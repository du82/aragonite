["https://code.msdn.microsoft.com/en-us/answers/support/release-notes"]
title = "Release notes for Microsoft Q&A | Microsoft Learn"
description = "Explore the latest updates and fixes in Microsoft Q&A with our detailed release notes. Stay informed and up-to-date."
full_description = '''Read in English Save Table of contents Read in English Save Add to plan Edit Share via Facebook x.com LinkedIn Email Print Table of contents Release notes for Microsoft Q&A Article03/29/2024 7 contributors Feedback In this article May 20, 2024 Here are the updates and enhancements we did since the previous release notes. Add link to support on Training content, directing users to look for existing answers or ask a new question on Q&A. Updates to spam prevention and removal processes to address influx in spam content. [Editor] Expand integration tests for critical editor scenarios. [Bug fix: Editor] Accessibility improvements to editor. [Bug fix] Resolve error when viewing Microsoft Graph tag. We also implemented other general improvements to site performance, user interface, and security. Upcoming fixes and improvements Continued updates to Learn editor. Site performance improvements. We're also finalizing our plan for the next few months of features and improvements on Q&A! We'll share more details soon about specific work coming up. March 25, 2024 Here are the updates and enhancements we did since the previous release notes. Investigate 500 errors and slowed performance. [Bug fix: Editor] Resolve formatting errors when copying/pasting into editor. [Bug fix: Editor] Resolve markdown error with code blocks not rendering as expected. [Editor] Expand test cases for Q&A scenarios when shipping changes to editor. We also implemented other general improvements to site performance, user interface, security, and spam prevention & removal. March 8, 2024 Here are the updates and enhancements we did since the previous release notes. Shipped support for Turkish and Chinese (Taiwan). Update tags for new languages supported. Private conversations initiated by Microsoft moderators now supported. Opt into mail notifications in the Q&A Preferences section of your Profile to make sure you don't miss any messages! Suspended users see an error message when attempting to take a blocked action on Q&A. Suspended users see a notification the next time they log into the Q&A site. Right-rail connect now available, connecting Q&A content with suggestions across Learn. [Bug fix] Now resolved: Error with same user displaying under "Following users" in Profile. [Bug fix] Now resolved: Error with email notifications across multiple languages for tags followed in English. [Bug fix] Now resolved: Error with "Follow question" button not working and followed questions not displaying accurately as followed on the question page. [Bug fix – Editor] Now resolved: Error with pasting markdown including user mentions. [Spam] Clean up spam attack on Chinese language site. We also implemented other general improvements to site performance, user interface, security, and spam prevention & removal. January 26, 2024 Here are the updates and enhancements we did since the previous release notes. Fixed the issue where depth limit exceeded on Markdown content was returning 500 errors. When a parent tag doesn't have children, we no longer show "See all tags" option. Users now see a placeholder text for a deleted answer or comment. [Multi-locale] Shipped support for Italian, French, German, Russian, Portuguese (Brazil), Japanese, Korean, Chinese (China). Users need to solve a Captcha puzzle before posting a question. We also implemented other general improvements to site performance, user interface, security, and spam prevention & removal. January 15, 2024 We made the following fixes and improvements since our last release notes, still focusing primarily on wrapping up work for multi-locale support on Microsoft Q&A. Spanish Tag wasn't localized when editing a question. We also implemented other general improvements to site performance, user interface, security, and spam prevention and removal. December 13, 2023 We made the following fixes and improvements since our last release notes, still focusing primarily on wrapping up work for multi-locale support on Microsoft Q&A. [Community feedback] Fixed issue where Q&A was failing to mark questions as a duplicate. [Community feedback] Fixed issue where the non en-us locale tags were searching en-us tagged content rather than the content tagged with its respective locale. We also implemented other general improvements to site performance, user interface, security, and spam prevention and removal. November 29, 2023 Updated error message when visiting a deleted question. November 16, 2023 We made the following fixes and improvements since our last release notes, still focusing primarily on wrapping up work for multi-locale support on Microsoft Q&A. [Community feedback] Fixed issue where part of the site wasn't available. [Community feedback] Fixed issue where original posters we able to accept their own answer. [Community feedback] Fixed issue where users were unable to post a comment or answer sporadically. Q&A Assist: AI output is now part of the user's draft. We also implemented other general improvements to site performance and user interface. November 1, 2023 We made the following fixes and improvements since our last release notes, focusing primarily on wrapping up work for multi-locale support on Microsoft Q&A. [Multi-locale] Shipped support for Spanish. [Community feedback] Refreshed issue fixed where users were seeing "This page isn't working right now" error. [Community feedback] Improved performance when displaying collections. We also implemented other general improvements to site performance and user interface. October 16, 2023 We made the following fixes and improvements since our last release notes, focusing primarily on wrapping up work for multi-locale support on Microsoft Q&A. [AI] Q&A Assist now available to all users asking questions in Microsoft Q&A. [Multi-locale] Continued work to support Q&A questions and answers in multiple languages. We also implemented other general improvements to site performance and user interface. September 19, 2023 Here are the updates and enhancements we did since the previous release notes. [Experimentation] Close experiment for Answer rating by question authors. Our team is evaluating the results this week. [Community feedback] Filter by questions you follow now enabled [Q&A Assist] Update result cards to use new properties [Community feedback] Updates to permissions for users with MVP and Microsoft affiliations [Community feedback] Continued spam fighting [Community feedback] Bug fix: Ensure Profile shows tags a user follows with correct tag name [Community feedback] Bug fix: Issue with Tags / follow functionality – If your followed tags on Q&A are out of sync, sign out and back in again to resync them to your Learn/Q&A profile. [Community feedback] Bug fix: Enable users to save changes to Q&A email notification preferences in Profile We also implemented other general improvements to site performance and user interface. August 28, 2023 Here are the updates and enhancements we did since the previous release notes. [Experimentation] Launch experiment for Answer rating by question authors [Q&A Assist] Increase number and relevancy of AI answers [Q&A Assist] Updates to ensure references and sources for AI answers are displayed consistently [Q&A Assist] UI adjustments to results and footer for Ask a Question page [Community feedback] Bug fix: Increase vote count when user submits feedback on Q&A questions [Community feedback] Bug fix: Display answer counts for "Find similar question" request [Community feedback] Bug fix: Ensure seamless transition when user replaces their question draft with AI-generated question draft using Q&A Assist [Community feedback] Bug fix: Allow users to change code language when using Learn Editor in rich-text mode [Community feedback] Bug fix: Update tooltips for AI features Updates to product taxonomy We also implemented improvements to performance and user interface. July 31, 2023 Here are the updates and enhancements we did since the previous release notes. [Community feedback] Fix UI error when marking questions as duplicate [Community feedback] Mobile: Ensure Ask a Question page auto populates tag when opening from a tag page [Q&A Assist] Fix UX bug when surfacing similar questions from Q&A and external sites We also implemented improvements to performance and user interface. July 14, 2023 Here are the updates and enhancements we did since the previous release notes. [Community feedback] Editor improvements including: Disable '@' mentions in code blocks [Community feedback] Restore missing events from Profile activity [Community feedback] Improve specificity of 400 error messaging across Q&A [AI work] Attribute AI answers to Q&A Assist instead of Anonymous user We also implemented improvements to performance and user interface. June 30, 2023 Here are the updates and enhancements we did since the previous release notes. [Community feedback] Show basic syntax highlighting for code blocks at rendering [Community feedback] Resolving editor bugs with blank lines and hyperlinks [AI work] Move AI banner next to answers [AI work] Don't automatically accept AI-generated answers [AI work] Improve messaging to users when AI can't provide an answer Ensure deleted spam content is removed from Search index Localize editor toolbar We also implemented improvements to performance and user interface. June 15, 2023 Here are the updates and enhancements we did since the previous release notes. [Community feedback] Resolved caching issues More improvements to prevent spam [Community feedback] When selecting and deleting a code block in rich-text mode, it's now deleted [Community feedback] Fixed odd keyboard behaviors on code blocks Removed follow actions when editing content Automatic generation of a unique avatar for users who don't upload their own avatar We also implemented improvements to performance and user interface. June 1, 2023 Here are the updates and enhancements we did since the previous release notes. More improvements to prevent spam [Community feedback] Italicizing bold text doesn't remove bold in the markdown editor [Community feedback]Code block doesn't longer get corrupt on edit Experimentation of adding categories when the question author rates an answer as unhelpful We also implemented improvements to performance and user interface. May 18, 2023 Here are the updates and enhancements we did since the previous release notes. [Community feedback] Improvements to automatically deal with spam. [Community feedback] Creating more than one quote in same comment duplicates quotes and replies. [Community feedback] New users are now receiving Q&A email notifications. [Community feedback] Users don't get an email notification when they post or edit content. [Community feedback] Users don't receive email notifications when content is automatically reported as spam. Editing the same content repeatedly doesn't mark it as marks it as spam. Header options are the same in the rich and Markdown views. We also implemented improvements to performance and user interface. May 3, 2023 Here are the updates and enhancements we did since the previous release notes. [Community feedback] Improvements to automatically deal with spam. [Community feedback] Fixed issue when posting content with nested numbered list. Fixes and improvements that only affect moderators. Ability to delete content directly from the question and tag list pages. Ability to filter content automatically deleted by the system. We also implemented improvements to performance and user interface. April 20, 2023 Here are the updates and enhancements we did since the previous release notes. [Community feedback] Line breaks are no longer removed when posting content. [Community feedback] You can now insert triple backticks as inline code blocks. [Community feedback] Headers in the editor match the size of the headers when published. [Community feedback] Updated email notification templates to take you directly to that comment or answer from the email message. [Community feedback] Added a "Discard draft" button for questions, answers, and comments to clear the form. You can now put the cursor before the code span even it's not the first word in a paragraph. Removed the option to follow a deleted question. You can unfollow a deleted question to remove it from your list. Fixes and improvements that only affect moderators. [Community feedback] Editing only the tags on a deleted question no longer undo delete (restore) the question. Report reasons are now carried over to Delete content modal. Deleted list only lists items deleted the last 30 days. We also implemented improvements to performance and user interface. April 4, 2023 Here are the updates and enhancements we did since the previous release notes. Typing _ in code spans/blocks no longer causes unwanted italics. Anonymous users can now see answer votes on questions they voted. When the user has a draft for a question, answer, or comment, the editor for that content type does no longer disappear. Selecting "My Content" in mobile view as anonymous user wasn't prompting the user to sign in. We removed the "My content" option on mobile. Moderators now have a visual cue when the system deletes content. Search by question author is no longer limited to 20 characters. We also improved the presentation of the user name. We improved the experience when inserting a link in the rich-text editor. Users whose display name was empty due to content validation, weren't receiving mails. We fixed the rules for default content for those users. When converting an answer to a comment and vice-versa, Q&A now keeps the data when the question or comment was first created. We also implemented improvements to performance and user interface. March 8, 2023 Here are the updates and enhancements we did since the previous release notes. Some users were experiencing their content disappearing after posting. It was deleted and a moderator had to republish it to reappear on the site. Metadata on the Questions and Tags pages list cards was outdated. Users who signed up for email notifications weren't receiving default notifications, which could have caused them to miss important updates. When deleting reported content with "Other" reason, the description of the reason wasn't visible in the Deleted moderation queue. Deleting content from the moderation queue with the reason "Other" resulted in a 400 error. Some non-moderators had the ability to edit other users' content. All moderators were receiving email notifications when items were in the moderation queue, regardless of whether they had signed up for that notification. We also implemented improvements to performance and user interface. February 13, 2023 Here are the updates and enhancements we did since the previous release notes. We improved the @ mention users when posting content and the searching by question author experiences as follow: Expanded the list of matches from 10 to 30. Prioritize matches for display names that start with '''
