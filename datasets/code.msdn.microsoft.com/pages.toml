description = "Practice Assessments for Microsoft Certifications"
full_description = "Read in English Save Table of contents Read in English Save Add to plan Edit Share via Facebook x.com LinkedIn Email Print Table of contents Practice Assessments for Microsoft Certifications Article09/03/2024 2 contributors Feedback In this article Overview Are you preparing for a Microsoft Certification exam? We’re excited to announce Practice Assessments on Microsoft Learn, our newest free exam preparation resource that allows you to assess your knowledge and fill knowledge gaps so that you are better prepared for your certification exam. These assessments provide you with an overview of the style, wording, and difficulty of the questions you’re likely to experience on the exam. Through these assessments, you’re able to assess your readiness, determine where additional preparation is needed, and fill knowledge gaps bringing you one step closer to the likelihood of passing your exam. These questions are not the same as what you will see on the exam nor is this document illustrative of the length of the exam or its complexity. For example, you may see additional question types, multiple case studies, and labs. These questions are examples only to provide insight into what to expect on the exam and help you determine if additional preparation is required. Taking a Practice Assessment is not a replacement for training taken or experience using Microsoft products. Note Practice Assessments will be available in local languages soon. Availability Below is a list of all the Practice Assessments available. S/N Practice Assessment 1 AI-102: Designing and Implementing a Microsoft Azure AI Solution 2 AI-900: Microsoft Azure AI Fundamentals 3 AZ-104: Microsoft Azure Administrator 4 AZ-140: Configuring and Operating Microsoft Azure Virtual Desktop 5 AZ-204: Developing Solutions for Microsoft Azure 6 AZ-305: Designing Microsoft Azure Infrastructure Solutions 7 AZ-400: Designing and Implementing Microsoft DevOps Solutions 8 AZ-500: Microsoft Azure Security Technologies 9 AZ-700: Designing and Implementing Microsoft Azure Networking Solutions 10 AZ-800: Administering Windows Server Hybrid Core Infrastructure 11 AZ-801: Configuring Windows Server Hybrid Advanced Services 12 AZ-900: Microsoft Azure Fundamentals 13 DP-100: Designing and Implementing a Data Science Solution on Azure 14 DP-203: Data Engineering on Microsoft Azure 15 DP-300: Administering Microsoft Azure SQL Solutions 16 DP-420: Azure Cosmos DB Developer Specialty 18 DP-600: Implementing Analytics Solutions Using Microsoft Fabric 19 DP-900: Microsoft Azure Data Fundamentals 20 MB-230: Microsoft Dynamics 365 Customer Service Functional Consultant 21 MB-240: Microsoft Dynamics 365 Field Service Functional Consultant 22 MB-310: Microsoft Dynamics 365 Finance Functional Consultant 23 MB-330: Microsoft Dynamics 365 Supply Chain Management Functional Consultant Associate 24 MB-335: Microsoft Dynamics 365 Supply Chain Management Functional Consultant Expert 25 MB-500: Dynamics 365: Finance and Operations Apps Developer Associate 26 MB-800: Microsoft Dynamics 365 Business Central Functional Consultant Associate 27 MB-910: Microsoft Dynamics 365 Fundamentals (CRM) 28 MB-920: Microsoft Dynamics 365 Fundamentals (ERP) 29 MD-102: Endpoint Administrator 30 MS-102: Microsoft 365 Administrator 31 MS-700: Managing Microsoft Teams 32 MS-721: Collaboration Communications Systems Engineer 33 MS-900: Microsoft 365 Fundamentals 34 PL-200: Microsoft Power Platform Functional Consultant 35 PL-300: Microsoft Power BI Data Analyst 36 PL-400: Microsoft Power Platform Developer 37 PL-500: Microsoft Power Automate RPA Developer 38 PL-600: Microsoft Power Platform Solution Architect 39 PL-900: Microsoft Power Platform Fundamentals 40 SC-100: Microsoft Cybersecurity Architect 41 SC-200: Microsoft Security Operations Analyst 42 SC-300: Microsoft Identity and Access Administrator 43 SC-400: Administering Information Protection and Compliance in Microsoft 365 44 SC-900: Microsoft Security, Compliance, and Identity Fundamentals Note: We will be launching Practice Assessments for others exams soon. Benefits Set yourself up for success and boost your exam performance. Be fully prepared Free Close alignment with exam content Ease of access Assess your knowledge and prepare for your certification exam. Receive a score report that provides the answer, rationale, and links to additional information for every question. Practice Assessments are available at no cost and can be attempted as many times as desired. Created by the same team that develops our certification exams, Practice Assessments are updated in step with certifications to keep them relevant and up to date. Access Practice Assessments on Microsoft Learn. Simply sign in to your Microsoft Learn profile or create an account before taking a Practice Assessment. User Flow Go to the Certification/Exam details page to access the free Practice Assessment. If prompted, sign in using your Microsoft Account or create one. Start answering the practice questions. Check for the correct answer and view rationale with links to additional learning resources. View your score report with a breakdown of your performance. Once you have completed an assessment, view results from previous attempts on the Certification/Exam details page. Frequently Asked Questions If you have any questions about Practice Assessments, review the FAQs. Any feedback? We would like your feedback on the Practice Assessment experience; if you take a Practice Assessment, please complete the Practice Assessment Survey Practice Assessments are authored with assistance from AI. Learn more."
