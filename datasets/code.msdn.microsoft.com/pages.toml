full_description = "Read in English Save Table of contents Read in English Save Add to plan Share via Facebook x.com LinkedIn Email Print Table of contents Industry Solutions Group Article 12/20/2007 In this article The Industry Solutions Group (ISG) drives the accelerated adoption and product use through Microsoft Software and Services strategy. To achieve this goal ISG conceives, develops and deploys repeatable end-to-end solutions that fulfill specific industry-vertical customer scenarios and proactive health operational scenarios. These solutions are defined by three elements: A combination of Microsoft core products software and services. A minimum set of proactive health and reactive support services. Managed solution IP created via engagements with customers that is repeatable within a vertical industry. ISG Offers Enterprise Customers an additional option to complement the current core products and custom development solutions. These solutions fulfill real world customer and partner opportunities through repeatable IP in a manner which reduces risk, improves time to market and enhances Customer Partner Experience. The MSDN Library for ISG provides reference content for key ISG Solutions like IMM, CCF via Operations Guide, Development and Deployment Guides, and other Technical Articles"
