["https://code.msdn.microsoft.com/en-us/contribute/content"]
title = "Contribute to Microsoft Learn - Contributor guide | Microsoft Learn"
description = "Learn how you can contribute to technical documentation and other content experiences on Microsoft Learn."
full_description = "Read in English Save Table of contents Read in English Save Add to plan Edit Share via Facebook x.com LinkedIn Email Print Table of contents Contribute to the Microsoft Learn platform Article03/05/2024 5 contributors Feedback In this article Welcome to the Microsoft Learn contributor guide! This documentation introduces you to the ways you can contribute to the Microsoft Learn platform and teaches you how to get started. Sharing your expertise with others on Microsoft Learn helps everyone achieve more. Use the information in this guide to publish a new article to Microsoft Learn, update a published article, answer questions on Microsoft Q&A, and more. Who can contribute? Anyone who desires to share their knowledge and make a difference can contribute to Microsoft Learn! If you have expertise to share, you're in the right place. This guide is intended for any non-Microsoft employee who wants to contribute their knowledge to the content and experiences on Microsoft Learn. (Are you a Microsoft employee? Use our internal content contributor guides instead.) How do I start? Tip A self-paced, step-by-step learning path is available for this topic. First, set up a few accounts. You'll need a GitHub account or a Microsoft account, depending on how you want to participate. The following table shows your contribution options and the type of account you'll need. Once you've set up your accounts, select a contribution option from the table to learn more about how to get started. Contribution option Account required Edit documentation GitHub Review pull requests GitHub Provide feedback on content None for standard experience; GitHub for open-source experience Create GitHub issues for open-source product documentation GitHub Answer questions on Microsoft Q&A Microsoft Create a Collection Microsoft Participate in the Microsoft Learn Tech Community Microsoft Create a GitHub account Navigate to https://github.com/join for a fast and free sign-up process. In your GitHub profile, identify your affiliations, like professional organizations you belong to or credentials/certifications you've earned. Contributions to Microsoft Learn count toward MVP award consideration. Identification helps us build a complete profile of all your activities. Note Microsoft employees participating in Open Source projects always identify themselves as such in their GitHub profiles. Community contributors should ensure that their profile does not incorrectly imply an employment relationship. Create a Microsoft account Navigate to learn.microsoft.com. Select Sign in in the upper-right corner. Follow the prompts to create a Microsoft account and profile. Once created, visit Managing your Microsoft Learn profile settings to learn how to update your Microsoft Learn profile. What's in it for me? Explore Microsoft Learn and discover how it’s a win-win for everyone, especially you! Every time you edit our documentation, we celebrate your contribution by featuring your name at the top of the article. Each commit you make to our GitHub repositories is a testament to your dedication, prominently displayed in your GitHub commit history. This not only demonstrates your passion for specific technologies but also fortifies your portfolio. And the cherry on top? Some products even reward you with digital treats like badges. So don’t hold back! Dive in, contribute, and enjoy the perks!"
