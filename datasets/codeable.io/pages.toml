description = "Fixed price estimates based on scope of work, complexity & urgency plus a 17.5% service fee, guarantees you the best quality of work."
full_description = "our pricing Simple pricing, unbeatable value. We like things simple. You get one estimate based on our $80–$120 USD hourly rate. Then we add a service fee and spice it up with a quality guarantee for peace of mind. Simple and works like a charm. start a project See sample prices our pricing Simple pricing, unbeatable value. We like keeping things simple. That’s why you get a single estimate based on our $80-$120 USD hourly rate. You then choose your preferred developer from our vetted recommendations, focusing on skills rather than price. We back that up with a quality guarantee for peace of mind! start a project See sample prices Pricing guide Try the filters below to see some starting prices based on frequent project types. Complexity Low Medium High Urgency Low Medium High Project Scope Basic Average Advanced Custom Plugin Development from $ 960 Custom Theme Development from $ 980 Speed and Security Optimization from $ 420 Website Design and Development from $ 2,500 E-commerce Site Design/Development from $ 3,200 How our pricing works 01 $80–$120 HOURLY RATE Your project estimate ESTIMATE BASED ON: Total scope of the project Complexity Urgency 02 17.5% FIXED Our service fee THIS COVERS: Expert vetting & training 24/7 customer service Platform management 03 SATISFACTION GUARANTEE Your total cost Includes: 28-day bug fixing warranty Fair refund policy Intellectual property ownership How our pricing works Your project estimate ESTIMATE BASED ON: Total scope of the project Complexity Urgency Our service fee 17.5% Fixed Fee Covers: Expert vetting & training 24/7 customer service Platform management Your Satisfaction, Guaranteed Includes: 28-day bug fixing warranty Fair refund policy Intellectual property ownership Your pricing questions, explained Here’s what you need to know about our pricing, based on the questions we get asked the most. Why do I see only one price estimate when multiple experts apply to my project? The single price estimate is what truly sets us apart from all other freelance marketplaces. Multiple offers essentially is called bidding. Bidding results in a race to the bottom on pricing that ultimately results in low quality work, unhappy clients and unhappy freelancers. We focus on quality first and this method of providing a single price estimate that is the average of all offers from interested freelancers to work on your project ensures that you get the best quality of work done at the fairest price. What forms of payment do you accept? We currently accept all major credit cards, bank wires, and PayPal. Do I have to pay in advance? Yes, once your project is fully scoped and you hire your preferred expert, you deposit the total cost of your project into a secure escrow system before the project work starts. Your money is safely and securely stored until you’ve marked the project as complete. Once that’s done, the money is released to the developer’s account. This ensures that you have a committed developer for your project and also protects your funds in the event that things don’t work out. Higher budget projects can also be broken down into milestones, so you fund each individual milestone as opposed to the full project cost ahead of time. Why do you charge a service fee? We invest a significant amount of time and effort to find, recruit and maintain the best WordPress developers (so you don’t have to). We also invest a lot of development hours to build and maintain a reliable platform that enables both clients and experts to collaborate on and get work done in a hassle-free manner. And finally, we provide near 24-7 customer service to ensure your peace of mind. Our service fee covers all of the above and of course, ensures we stay profitable, so we can keep doing what we’re doing best. Is there any money-back policy? Yes, we do have a money-back policy which guarantees that if any developer you hire doesn’t deliver to what was mutually agreed upon in the scope of work of the project, you will receive either a partial or full refund, depending on the amount of work that has been done. The amount of the refund is agreed upon either between you and the developer or by our team through a dispute resolution process, in case you can’t come to an agreement with the developer. A couple of notes: Regardless of whether a partial or full refund is due, Codeable fees are always non-refundable. We do not put a time-frame within which you can request a refund due to non-delivery of work, as long as the project has not been marked as complete. If you do mark the project as complete, that’s basically equal to you saying “Yes, the work delivered is according to the scope and I’m absolutely happy”, so we won’t be able to issue a refund beyond that point. Your pricing is outside of my budget. Are you really worth the cost? Some other developer marketplaces can beat our pricing with less experienced talent, less quality focus and little to non-existent customer support. We’ve heard from many of our customers that projects posted on other platforms often go poorly. As is the case with most major buying decisions, you get what you pay for. At the end of the day, we ultimately believe that quality comes at a price and are happy to work with both clients and experts who value exactly that – quality over the cheapest price. What if I have more questions? We’d be happy to answer them. Want a no-obligation to hire estimate? start a project Free estimate • No obligation to hire • 100% risk-free"
