n expert within this time frame, feel free to reach out to our support team who will be glad to look into your project and help bring it in front of relevant experts faster. More information on how the platform works. Is there any money-back policy? Yes, we do have a money-back policy which guarantees that if any developer you hire doesn’t deliver to what was mutually agreed upon in the scope of work of the project, you will receive either a partial or full refund, depending on the amount of work that has been done. The amount of the refund is agreed upon either between you and the developer or by our team through a dispute resolution process, in case you can’t come to an agreement with the developer. A couple of notes: Regardless of whether a partial or full refund is due, Codeable fees are always non-refundable. We do not put a time-frame within which you can request a refund due to non-delivery of work, as long as the project has not been marked as complete. If you do mark the project as complete, that’s basically equal to you saying “Yes, the work delivered is according to the scope and I’m absolutely happy”, so we won’t be able to issue a refund beyond that point. Do I have to pay in order to submit a project on Codeable? No, submitting a project is absolutely free and there’s zero obligation to hire an expert, even when you do receive an estimate. What if I have more questions? We’d be happy to answer them. Ready to hire your WordPress developer? post a project (it’s free!) Free estimate • No obligation to hire • 100% risk-free"
