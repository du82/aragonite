["https://www.codeable.io/how-it-works"]
title = "How it works | Codeable"
description = "Codeable helps you get matched with your WordPress developer in under one day. It's easy as 1-2-3."
full_description = "Get matched with your WordPress developer in under one day. It’s easy as 1, 2, 3! start a project Vetted freelancers No bidding Fair pricing 01. Brief 02. Connect 03. Collaborate 01. Brief Tell us what you need Only takes a few minutes Any scope or size–from short-term jobs to custom dev work Affordable consultation service available What type of projects can I post on Codeable? Anything from small tasks and fixes (404 errors, plugin not working as expected, slow database optimizations, white screen of death fixes) through server and website maintenance work (website migrations, theme and plugin updates, speed and security optimizations) to full custom development work (custom theme/plugin development, new website design and development). My project/task is urgent. Can you help? It depends on how you define urgent really. On average, it takes around 3-5 hours for experts to start reviewing and engaging with your project and around 22-24 hours for a project to be fully scoped and estimated. Of course, if you don’t hear from an expert within this time frame, feel free to reach out to our support team who will be glad to look into your project and help bring it in front of relevant experts faster. More information on how the platform works. How much does it cost? Each project posted on Codeable gets its own individual fixed price estimate based on the total scope to be completed, complexity, and urgency. Our recommended rates range USD $80 – $120 per hour. You can view some sample projects and cost estimates on our pricing page. 02. Connect We connect you with the right developers Top 1–5 recommended experts, not thousands of applicants Shared workroom for accurate scoping of your project Fast developer engagement with same-day response times How long does it take before I hear from an expert? On average, it takes around 3–5 hours for experts to start reviewing and engaging with your project. If you don’t hear from an expert within this time frame, feel free to reach out to our support team who will be glad to look into your project and help bring it in front of relevant experts faster. Why do I chat with multiple experts in a shared workroom? To save you time and effort answering the same questions multiple times, and to give you an opportunity to connect better with and screen the communication skills of the interested experts. How do you match me with the right developers for my project? We have an internal matchmaking system that connects you with the most appropriate developer based on a combination of your project requirements and our expert skill sets and availability. Additionally, we have a strict rule that our experts can only apply for projects they are 100% confident they can deliver on time and to the highest standard. 03. Collaborate Get one price, hire & start collaborating Single-price algorithm eliminates undercutting and over-pricing Limited number of profiles to review allows you to hire fast Escrow system for fast secure payments Why do I only get one price and how is it calculated? The single price estimate is what truly sets us apart from all other freelancer marketplaces. Multiple offers essentially is called bidding. Bidding results in a race to the bottom on pricing that ultimately results in low quality work. We focus on quality first, which is why we average all offers from freelancers who estimate on your project to ensure you get the fairest price and the highest quality work. Do I have to pay in advance? Yes, once your project is fully scoped and you hire your preferred expert, you deposit the total cost of your project into a secure escrow system before the project work starts. Your money is safely and securely stored until you’ve marked the project as complete. Once that’s done, the money is released to the developer’s account. This ensures that you have a committed developer for your project and also protects your funds in the event that things don’t work out. Higher budget projects can also be broken down into milestones, so you fund each individual milestone as opposed to the full project cost ahead of time. Is there any money-back policy? Yes, we do have a money-back policy which guarantees that if any developer you hire doesn’t deliver to what was mutually agreed upon in the scope of work of the project, you will receive either a partial or full refund, depending on the amount of work that has been done. The amount of the refund is agreed upon either between you and the developer or by our team through a dispute resolution process, in case you can’t come to an agreement with the developer. A couple of notes: Regardless of whether a partial or full refund is due, Codeable fees are always non-refundable. We do not put a time-frame within which you can request a refund due to non-delivery of work, as long as the project has not been marked as complete. If you do mark the project as complete, that’s basically equal to you saying “Yes, the work delivered is according to the scope and I’m absolutely happy”, so we won’t be able to issue a refund beyond that point. 97% of experts with 6+ years of professional WordPress experience 96% of clients say they would return with more work Less than 7 minutes wait time on chat for customer service during office hours 4.95/5 average project rating More than 2000 projects delivered on time and issue-free every month Previous Next Ready to see how it works? start a project Free estimate • No obligation to hire • 100% risk-free"
