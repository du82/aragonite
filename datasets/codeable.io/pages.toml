["https://www.codeable.io/team"]
title = "The Codeable Team"
description = "See who are the faces behind the Codeable brand."
full_description = "BUILD WITH HEART We are Codeable. Nice to meet you! We are developers, entrepreneurs, marketers, product makers, data lovers and customer service advocates. We are also parents, skydivers, snowboarders, wake-boarders, tennis aficionados, animal lovers and DJs. We are completely distributed and build with heart. Per Esbensen CO-FOUNDER & CEO Believes mountains are there to be moved. Per Esbensen CO-FOUNDER & CEO As CEO and founder, Per is responsible for setting the strategic vision for Codeable. His strong entrepreneurship skills and brave vision are what have steered Codeable to growth and to building one of the tightest community of WordPress developers. Per Esbensen @per_esbensen When Not Working You’ll find him spending time or traveling with his wife and three daughters, occasionally playing golf or fly fishing. Most Proud of Codeable’s fair and honest community. Backup Career Pro golf player. Bad Habit Impatience. Chris Osborne COO Finds deeply hidden truths in data. Chris Osborne COO As Codeable’s COO, Chris operates across all areas of the business, ranging across commercial planning, organizational development, supporting teams with planning, and on to all things data and performance. When Not Working Can be found running, playing as much sport as possible, walking the dogs, and watching the kids do their sporting things. Most Proud of Achieving a near mystical level of accuracy with revenue forecasting (is it wrong to love a spreadsheet?). Backup Career Deep space traveller. Bad Habit Addicted to excessive numbers of browser tabs. Matjaž Muhič CTO Can play “Knockin’ on Heaven’s Door” on guitar, piano and accordion. Matjaž Muhič CTO As the first Codeable employee and developer by trade, Matjaz has done it all: developed v1 of the app, lead the dev team, wrangled data and even set KPI dashboards. Today, he oversees all technical operations – from servers and architecture to efficient development workflows and tools. Matjaž Muhič When Not Working As an avid cooking aficionado, he loves cooking for friends, playing board games or playing one of his many musical instruments. Most Proud of Implementing and helping establish a data driven culture at Codeable. Backup Career Tea sommelier. Bad Habit Tab-hoarding. Christopher Churchill HEAD OF SUPPORT & EXPERT COMMUNITY Can build furniture with his bare hands. Christopher Churchill HEAD OF SUPPORT & EXPERT COMMUNITY As a former expert on the platform, and later on as a customer success manager internally at Codeable, Chris has first-hand experience with both client and expert success. Today, he oversees the support and expert community teams at Codeable and is responsible for enabling both clients and experts to thrive and succeed on the platform. Christopher Churchill @vimes1984 When Not Working Walking his 5 dogs, 3 cats and 2 horses or woodworking in his barn. Most Proud of Designing the initial Codeable vetting process. Backup Career Carpenter. Bad Habit The pipe! Hudson Atwell SUCCESS MANAGER “A reader is a leader.” Hudson Atwell SUCCESS MANAGER With a background in WordPress development (Hudson built, marketed and maintained a number of commercial WordPress plugins), Hudson knows exceptionally well what makes a WordPress project successful. He skillfully transfers his prior experience to helping clients and experts collaborate flawlessly. Hudson Atwell @atwellpub When Not Working On nights and weekends you’ll find Hudson building open source applications and spending quality time with his lovely wife and two dogs. Most Proud of Working daily with the world’s greatest community of WordPress freelancers and entrepreneurs. Backup Career Product shop owner Bad Habit Pressing enter on drafts. Sinclair Bain BACKEND DEVELOPER Scottish, but not from Edinburgh. Sinclair Bain BACKEND DEVELOPER Sinclair brings 20+ years of professional experience in planning, implementing, delivering and leading software development. He’s an important part of our cross-functional product team, responsible for delivering an optimal experience on the platform for both clients and experts. Sinclair Bain When Not Working When it is not raining he is on the nearby Cornish beaches. Or watching the beautiful game. Or schlepping kids. Or making meals. Most Proud of Knowing the platform inside-out. Backup Career A bar-owning footballer. Bad Habit Procrastination. Jasmine Cao CUSTOMER & EXPERT SUCCESS AGENT Does magic in the garden. Jasmine Cao CUSTOMER & EXPERT SUCCESS AGENT Jasmine has been smoothening the client and expert experience on Codeable since 2016. She is also Codeable’s Swag Guardian and has sent hundreds of swag items to our VIP clients and excellent experts all over the world. When Not Working Gardening, watching comedies and sci-fi movies, trying new recipes, traveling and playing boardgames with friends and family. Most Proud of Wowing 97% of all customers! (this is the percentage of clients who marked her support as excellent) Backup Career Mushroom forager. Bad Habit Multitasking. Allan Hendriks CUSTOMER & EXPERT SUCCESS AGENT DJs to crowds big and small. Allan Hendriks CUSTOMER & EXPERT SUCCESS AGENT Allan started as a customer success team rep to quickly become the driving force of our department that handles client and expert inquiries over chat. Allan Hendriks @baseline519 When Not Working Outdoors, back country camping, extended solo kayak and boating adventures, or DJ-ing, remixing and exploring the new technologies for musicians. Most Proud of Reducing Codeable refund and disputes rates. Backup Career DJ. Bad Habit Occassionally binging on Netflix. Kiril Hristov PRODUCT LEAD Won’t sleep to watch tennis. Kiril Hristov PRODUCT LEAD As a marketing, tech and user experience hybrid, Kiril works closely with our dev, design and business teams to set and drive the product vision and strategy at Codeable. Kiril Hristov @kirilhristov When Not Working He likes to play and watch tennis. Other than that it’s time spent outdoors – hiking, windsurfing or snowboarding. Most Proud of Helping shape the Codeable cross-functional product team. Backup Career Artist. Bad Habit Likes to sleep in. Andrey Kozlovskiy BACKEND DEVELOPER Has likely tried more tea types than the average human. Andrey Kozlovskiy BACKEND DEVELOPER A highly motivated and hard-working Sr. Software Engineer with a passion for writing clean code and designing maintainable architecture, Andrey ensures high-performance and scalability of back-end services and is responsible for driving projects from concept to completion. When Not Working You can find him walking in the fresh air, riding a bike, or participating in conferences. Also, he loves to watch and play football. Most Proud of Helping integrate different parts of the system in a seamless and secure way. Backup Career Healthy and organic food maker. Bad Habit Perfectionism. Jan Vesel FRONTEND DEVELOPER Chases landscapes for the perfect shot. Jan Vesel FRONTEND DEVELOPER As a senior front end developer, Jan is responsible for keeping our applications stable, user-friendly and optimized. He specializes in modern web application architecture design and is a key part of our core product group responsible for improving the Codeable platform. Jan Vesel When Not Working You’ll find him hiking, free-diving and spearfishing, messing around with IoT projects, cooking and occasionally capturing beautiful shots! Most Proud of Refactoring the Codeable app, modernizing the front end stack and migrating the whole application to component based structure without a full-blown rewrite. Backup Career Sushi chef. Bad Habit Addicted to good coffee. Where we are Distributed globally, incorporated in Denmark Codeable Aps, Vitus Berings Alle 5A, 2930 Klampenborg, Denmark, VAT: DK 35387730 [email protected] Learn more about us We built Codeable out of sincere frustration with existing freelancer marketplaces. read our story We learned a thing or two while we shot the portraits above. read blog post Our CEO answered a couple of questions for Kinsta’s Kingpin interview series. read interview Join the Codeable family view staff openings apply as an expert"
