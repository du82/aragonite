["https://www.codebugapp.com/building/60-of-software-developers-contribute-to-open-source-projects"]
title = "60% of software developers contribute to open source projects - CodeBug'22"
description = "Slashdata conducted a survey of 17,000 developers around the world to find out what programmers think about open source, the future of the Kotlin language and trends in new technologies."
full_description = "3Jul November 30th, 2021 12:53 am 2017-07-03 Elyssa WalkerFor partners 6 Slashdata conducted a survey of 17,000 developers around the world to find out what programmers think about open source, the future of the Kotlin language and trends in new technologies. JavaScript continues to be the most popular programming language among developers. This is not surprising since the JavaScript ecosystem is huge. Additionally, Python and Kotlin are among the top three fastest-growing programming languages for mobile app developers. That said, Java continues to lead the way in mobile app development. Kotlin is proving its worth when it comes to Android application development and is increasingly becoming a replacement for Java. The report notes that over the past two years, developers have started using Kotlin twice as often. According to available data, JavaScript is leading among web developers, Python is actively used in a wide range of areas, including in the field of machine learning, and Go and Ruby are used to develop software solutions for cloud systems. The paramount importance of open source software is noted. A survey conducted by Slashdata showed that developers have a positive attitude to open source software and take part in its development. The report says that 60% of the survey participants reported that they participate in open source software development. At the same time, 29% of developers participate in such projects to improve their own coding skills, 22% of programmers contribute because they simply like it, and only 3% of specialists work for money. Previous Post“Rust is the future of system programming, C is the new Assembler” – a talk by one of Intel’s leading engineersElyssa Walker / 2017-05-22 Next PostC programming language again the most popular among developersElyssa Walker / 2017-08-05"
