full_description = "23Aug November 30th, 2021 12:53 am 2017-08-23 Elyssa WalkerFor partners 6 One of the most popular programming languages Java is celebrating its 25th birthday. This was the day when the first public version of the platform became available, which was later recognized by millions of developers all over the world. Java was founded in 1991. That was when a group of developers from Sun Microsystems (later absorbed by Oracle Corporation), headed by James Gosling, began creating the Oak language for use in digital consumer devices. A year later, the project presented its first prototype to demonstrate the capabilities of the new platform-independent programming language, with internet technology playing a key role in its later development. In 1995, the Oak language was renamed Java and gained wide popularity thanks to the inclusion of the Java Virtual Machine (JVM) in the Netscape browser. From that moment on the popularity of Java, which could work identically on different hardware platforms regardless of the machine architecture used in them, began to grow rapidly, and the language itself found application in almost all spheres of the IT-industry. Java works in NASA’s Mars rovers and the Large Hadron Collider. And in everyday life, we are surrounded by computers, mobile devices, media players, and even smart cards that also run on Java. A quarter of a century later, Java continues to be in demand in a professional environment as a tool for creating applications and still holds firmly to its position as one of the most popular programming languages. “It is useful to assess what we have achieved in 25 years, but we are moving forward and aim to develop Java innovations in the future as well. And millions of Java developers will continue to create applications that shape the world around us, from entertainment to nuclear physics to social networking to finding life on Mars,” Oracle said in a statement. – A quarter-century later, we’re seeing tremendous positive changes in our lives thanks to Java. And we expect the next 25 years – and beyond – to be just as bright and fulfilling. Our world is becoming a better place because of Java.” To celebrate the anniversary, Oracle has developed a special website at oracle.com/java/moved-by-java that tells the story, present and future of Java. Translated with www.DeepL.com/Translator (free version) Previous PostC programming language again the most popular among developersElyssa Walker / 2017-08-05 Next PostMalware developers are increasingly using exotic programming languagesElyssa Walker / 2017-09-25"
