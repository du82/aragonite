full_description = "2Feb November 30th, 2021 12:53 am 2020-02-02 Elyssa WalkerFor partners 6 Huawei has shared details about its own programming language, which is being developed as part of the Harmony OS Cangjie project. It is reported that a completely new programming language will be launched in 2022. The first rumors about Huawei’s work on this project appeared in February of this year. Huawei did not specify why it chose the name Cangjie for its programming language. However, the company said that it should become a link between the operating systems Huawei HarmonyOS and OpenEuler. The language should allow to write universal code suitable for both platforms. This was revealed by Deng Taihua, president of Huawei’s computing division, who said that the programming language will launch next year, but did not say when exactly. Open Euler is Huawei’s lesser-known operating system for cloud computing. It debuted in January 2020 and is a proprietary Linux distribution that is based on the commercial EulerOS, which originated from CentOS. OpenEuler is optimized to work with Arm processors. HarmonyOS, on the other hand, is a consumer operating system that runs on smartphones and a huge amount of other smart electronics. It is worth noting that Huawei is not alone in its desire to introduce its own programming language. Google has Go, which turned out to be very appealing to hackers, and Apple introduced Swift back in 2014, although Objective-C is still the core language for macOS and iOS. Translated with www.DeepL.com/Translator (free version) Previous PostMalware developers are increasingly using exotic programming languagesElyssa Walker / 2017-09-25 Next PostIntroduction to website navigation designElyssa Walker / 2022-10-03"
