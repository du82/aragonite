title = "C programming language again the most popular among developers - CodeBug'22"
description = "TIOBE Software company has published updated rating of programming languages popularity, formed on the basis of analysis of search queries statistics in Google, Google Blogs, Yahoo!, Wikipedia, MSN, YouTube, Bing, Amazon, Baidu and other Internet services."
full_description = "5Aug November 30th, 2021 12:53 am 2017-08-05 Elyssa WalkerFor partners 6 TIOBE Software company has published updated rating of programming languages popularity, formed on the basis of analysis of search queries statistics in Google, Google Blogs, Yahoo!, Wikipedia, MSN, YouTube, Bing, Amazon, Baidu and other Internet services. In May’s report, reflecting the changes in the professional community’s interest in software development environments, the C programming language once again took over from Java, which had held the top spot for quite a long time and moved to second place on the list. The third place is firmly held by Python. As for the other programming languages on the list, R, Swift, Go, PL/SQL and Scratch showed good growth dynamics and a surge of interest from the interested audience during the year. Assembler, Perl, and Objective-C were mentioned less frequently on the Internet. It is important to note that the index generated by the company does not say which development environment is better or worse or in which language more lines of code are written. It only takes into account statistical information about the number of mentions of a particular programming language in search engines, social networks, popular discussion sites, sites of recruiting agencies, and other specialized resources that are in demand among developers. Previous Post60% of software developers contribute to open source projectsElyssa Walker / 2017-07-03 Next PostJava celebrates its 25th anniversaryElyssa Walker / 2017-08-23"
