["https://coderwall.com/p/app3ya/read-excel-file-in-c"]
title = "Read Excel File in C# (Example)"
description = "A protip by teddy about excel, c#, and interop."
full_description = '''{ "@context": "http://schema.org", "@type": "Article", "@id": "read-excel-file-in-c", "author": { "@type": "Person", "name": "Teddy Garland" }, "dateModified": "2022-12-18 06:31:28 UTC", "datePublished": "2022-12-18 06:31:28 UTC", "headline": "Read Excel File in C# (Example)", "url": "/p/app3ya/read-excel-file-in-c", "commentCount": 10, "keywords": "excel, c#, interop", "articleBody": ".NET 4+ allows C# to read and manipulate Microsoft Excel files, for computers that have Excel installed (if you do not have Excel installed, see [NPOI](http://npoi.codeplex.com/)).\r\n\r\nFirst, add the reference to [Microsoft Excel XX.X Object Library](http://msdn.microsoft.com/en-us/library/dd264733.aspx), located in the COM tab of the Reference Manager. I have given this the using [alias](http://www.dotnetperls.com/using-alias) of Excel.\r\n\r\n\tusing Excel = Microsoft.Office.Interop.Excel; //Microsoft Excel 14 object in references-\u003e COM tab\r\n\r\nNext, you'll need to create references for each COM object that is accessed. Each reference must be kept to effectively exit the application on completion.\r\n\r\n\t//Create COM Objects. Create a COM object for everything that is referenced\r\n\tExcel.Application xlApp = new Excel.Application();\r\n\tExcel.Workbook xlWorkbook = xlApp.Workbooks.Open(@\"sandbox_test.xlsx\");\r\n\tExcel._Worksheet xlWorksheet = xlWorkbook.Sheets[1];\r\n\tExcel.Range xlRange = xlWorksheet.UsedRange;\r\n\t\r\nThen you can read from the sheet, keeping in mind that indexing in Excel is not 0 based. This just reads the cells and prints them back just as they were in the file. \r\n\r\n\t//iterate over the rows and columns and print to the console as it appears in the file\r\n\t//excel is not zero based!!\r\n\tfor (int i = 1; i \u003c= rowCount; i++)\r\n\t{\r\n\t\tfor (int j = 1; j \u003c= colCount; j++)\r\n\t\t{\r\n\t\t\t//new line\r\n\t\t\tif (j == 1)\r\n\t\t\t\tConsole.Write(\"\\r\\n\");\r\n\r\n\t\t\t//write the value to the console\r\n\t\t\tif (xlRange.Cells[i, j] != null \u0026\u0026 xlRange.Cells[i, j].Value2 != null)\r\n\t\t\t\tConsole.Write(xlRange.Cells[i, j].Value2.ToString() + \"\\t\");\r\n\t\t\t\t\r\n\t\t\t//add useful things here!\t\r\n\t\t}\r\n\t}\r\n\t\r\nLastly, the references to the unmanaged memory must be released. If this is not properly done, then there will be lingering processes that will hold the file access writes to your Excel workbook. \r\n\r\n\t//cleanup\r\n\tGC.Collect();\r\n\tGC.WaitForPendingFinalizers();\r\n\r\n\t//rule of thumb for releasing com objects:\r\n\t// never use two dots, all COM objects must be referenced and released individually\r\n\t// ex: [somthing].[something].[something] is bad\r\n\r\n\t//release com objects to fully kill excel process from running in the background\r\n\tMarshal.ReleaseComObject(xlRange);\r\n\tMarshal.ReleaseComObject(xlWorksheet);\r\n\r\n\t//close and release\r\n\txlWorkbook.Close();\r\n\tMarshal.ReleaseComObject(xlWorkbook);\r\n\r\n\t//quit and release\r\n\txlApp.Quit();\r\n\tMarshal.ReleaseComObject(xlApp);\r\n\t\r\n\r\nFurther reading:\r\n\r\n[StackOverflow](http://stackoverflow.com/questions/158706/how-to-properly-clean-up-excel-interop-objects/158752)\r\n\r\n[Interop Marshaling](http://msdn.microsoft.com/en-us/library/eaw10et3.aspx)\r\n\r\n[Excel and C#](http://dontbreakthebuild.com/2011/01/30/excel-and-c-interop-with-net-4-how-to-read-data-from-excel/)\r\n\t\r\nFull Code:\r\n\r\n\tusing System;\r\n\tusing System.Collections.Generic;\r\n\tusing System.IO;\r\n\tusing System.Linq;\r\n\tusing System.Runtime.InteropServices; \r\n\tusing System.Text;\r\n\tusing System.Threading.Tasks;\r\n\tusing Excel = Microsoft.Office.Interop.Excel; //microsoft Excel 14 object in references-\u003e COM tab\r\n\r\n\tnamespace Sandbox\r\n\t{\r\n\t\tpublic class Read_From_Excel\r\n\t\t{\r\n\t\t\tpublic static void getExcelFile()\r\n\t\t\t{\r\n\t\t\t \r\n\t\t\t\t//Create COM Objects. Create a COM object for everything that is referenced\r\n\t\t\t\tExcel.Application xlApp = new Excel.Application();\r\n\t\t\t\tExcel.Workbook xlWorkbook = xlApp.Workbooks.Open(@\"C:\\Users\\E56626\\Desktop\\Teddy\\VS2012\\Sandbox\\sandbox_test - Copy - Copy.xlsx\");\r\n\t\t\t\tExcel._Worksheet xlWorksheet = xlWorkbook.Sheets[1];\r\n\t\t\t\tExcel.Range xlRange = xlWorksheet.UsedRange;\r\n\r\n\t\t\t\tint rowCount = xlRange.Rows.Count;\r\n\t\t\t\tint colCount = xlRange.Columns.Count;\r\n\r\n\t\t\t\t//iterate over the rows and columns and print to the console as it appears in the file\r\n\t\t\t\t//excel is not zero based!!\r\n\t\t\t\tfor (int i = 1; i \u003c= rowCount; i++)\r\n\t\t\t\t{\r\n\t\t\t\t\tfor (int j = 1; j \u003c= colCount; j++)\r\n\t\t\t\t\t{\r\n\t\t\t\t\t\t//new line\r\n\t\t\t\t\t\tif (j == 1)\r\n\t\t\t\t\t\t\tConsole.Write(\"\\r\\n\");\r\n\r\n\t\t\t\t\t\t//write the value to the console\r\n\t\t\t\t\t\tif (xlRange.Cells[i, j] != null \u0026\u0026 xlRange.Cells[i, j].Value2 != null)\r\n\t\t\t\t\t\t\tConsole.Write(xlRange.Cells[i, j].Value2.ToString() + \"\\t\");\r\n\t\t\t\t\t}\r\n\t\t\t\t}\r\n\r\n\t\t\t\t//cleanup\r\n\t\t\t\tGC.Collect();\r\n\t\t\t\tGC.WaitForPendingFinalizers();\r\n\r\n\t\t\t\t//rule of thumb for releasing com objects:\r\n\t\t\t\t// never use two dots, all COM objects must be referenced and released individually\r\n\t\t\t\t// ex: [somthing].[something].[something] is bad\r\n\r\n\t\t\t\t//release com objects to fully kill excel process from running in the background\r\n\t\t\t\tMarshal.ReleaseComObject(xlRange);\r\n\t\t\t\tMarshal.ReleaseComObject(xlWorksheet);\r\n\r\n\t\t\t\t//close and release\r\n\t\t\t\txlWorkbook.Close();\r\n\t\t\t\tMarshal.ReleaseComObject(xlWorkbook);\r\n\r\n\t\t\t\t//quit and release\r\n\t\t\t\txlApp.Quit();\r\n\t\t\t\tMarshal.ReleaseComObject(xlApp);\r\n\t\t\t}\r\n\t\t}\r\n\t}\t", "description": "A protip by teddy about excel, c#, and interop.", "publisher": { "@type": "Organization", "name": "Coderwall", "logo": { "@type": "ImageObject", "url": "/logo.png" }, "url": "https://coderwall.com/" }, "image": "/logo.png" } Last Updated: December 18, 2022 · 1.09M · teddy Read Excel File in C# #excel #c# #interop .NET 4+ allows C# to read and manipulate Microsoft Excel files, for computers that have Excel installed (if you do not have Excel installed, see NPOI). First, add the reference to Microsoft Excel XX.X Object Library, located in the COM tab of the Reference Manager. I have given this the using alias of Excel. using Excel = Microsoft.Office.Interop.Excel; //Microsoft Excel 14 object in references-> COM tab Next, you'll need to create references for each COM object that is accessed. Each reference must be kept to effectively exit the application on completion. //Create COM Objects. Create a COM object for everything that is referenced Excel.Application xlApp = new Excel.Application(); Excel.Workbook xlWorkbook = xlApp.Workbooks.Open(@"sandbox_test.xlsx"); Excel._Worksheet xlWorksheet = xlWorkbook.Sheets[1]; Excel.Range xlRange = xlWorksheet.UsedRange; Then you can read from the sheet, keeping in mind that indexing in Excel is not 0 based. This just reads the cells and prints them back just as they were in the file. //iterate over the rows and columns and print to the console as it appears in the file //excel is not zero based!! for (int i = 1; i <= rowCount; i++) { for (int j = 1; j <= colCount; j++) { //new line if (j == 1) Console.Write("\r\n"); //write the value to the console if (xlRange.Cells[i, j] != null && xlRange.Cells[i, j].Value2 != null) Console.Write(xlRange.Cells[i, j].Value2.ToString() + "\t"); //add useful things here! } } Lastly, the references to the unmanaged memory must be released. If this is not properly done, then there will be lingering processes that will hold the file access writes to your Excel workbook. //cleanup GC.Collect(); GC.WaitForPendingFinalizers(); //rule of thumb for releasing com objects: // never use two dots, all COM objects must be referenced and released individually // ex: [somthing].[something].[something] is bad //release com objects to fully kill excel process from running in the background Marshal.ReleaseComObject(xlRange); Marshal.ReleaseComObject(xlWorksheet); //close and release xlWorkbook.Close(); Marshal.ReleaseComObject(xlWorkbook); //quit and release xlApp.Quit(); Marshal.ReleaseComObject(xlApp); Further reading: StackOverflow Interop Marshaling Excel and C# Full Code: using System; using System.Collections.Generic; using System.IO; using System.Linq; using System.Runtime.InteropServices; using System.Text; using System.Threading.Tasks; using Excel = Microsoft.Office.Interop.Excel; //microsoft Excel 14 object in references-> COM tab namespace Sandbox { public class Read_From_Excel { public static void getExcelFile() { //Create COM Objects. Create a COM object for everything that is referenced Excel.Application xlApp = new Excel.Application(); Excel.Workbook xlWorkbook = xlApp.Workbooks.Open(@"C:\Users\E56626\Desktop\Teddy\VS2012\Sandbox\sandbox_test - Copy - Copy.xlsx"); Excel._Worksheet xlWorksheet = xlWorkbook.Sheets[1]; Excel.Range xlRange = xlWorksheet.UsedRange; int rowCount = xlRange.Rows.Count; int colCount = xlRange.Columns.Count; //iterate over the rows and columns and print to the console as it appears in the file //excel is not zero based!! for (int i = 1; i <= rowCount; i++) { for (int j = 1; j <= colCount; j++) { //new line if (j == 1) Console.Write("\r\n"); //write the value to the console if (xlRange.Cells[i, j] != null && xlRange.Cells[i, j].Value2 != null) Console.Write(xlRange.Cells[i, j].Value2.ToString() + "\t"); } } //cleanup GC.Collect(); GC.WaitForPendingFinalizers(); //rule of thumb for releasing com objects: // never use two dots, all COM objects must be referenced and released individually // ex: [somthing].[something].[something] is bad //release com objects to fully kill excel process from running in the background Marshal.ReleaseComObject(xlRange); Marshal.ReleaseComObject(xlWorksheet); //close and release xlWorkbook.Close(); Marshal.ReleaseComObject(xlWorkbook); //quit and release xlApp.Quit(); Marshal.ReleaseComObject(xlApp); } } } #excel #c# #interop Written by Teddy Garland Say Thanks Respond Related protips C#でExcelファイルを読み込む方法 18.81K 0 How to convert json to csv (excel). 52.85K 2 Download JavaScript array as Excel CSV file 9.391K 0 10 Responses Add your response { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-02-13 04:45:00 UTC", "text": "Thank you!!", "upvoteCount": 1, "author": { "@type": "Person", "name": "Jonathan Vallejo Muñoz" }, "about": { "@type": "Article", "@id": "read-excel-file-in-c" } } jonathanvm13 Thank you!! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2017-03-26 19:22:36 UTC", "text": "Hi!\r\n\r\n=\u003e For my Windows WPF Application I copied your code and get following exception \r\n\"COM object that has been separated from its underlying RCW cannot be used.\" \r\nduring \" xlWorkbook.Close();\" call.\r\n=\u003e For my Windows Console Application it works,. \r\nI am Using VS2015, Excel 14 Object Library v14.\r\n\r\nBest regards,\r\nOtmar", "upvoteCount": 0, "author": { "@type": "Person", "name": "Otmar" }, "about": { "@type": "Article", "@id": "read-excel-file-in-c" } } Otmar Hi! => For my Windows WPF Application I copied your code and get following exception "COM object that has been separated from its underlying RCW cannot be used." during " xlWorkbook.Close();" call. => For my Windows Console Application it works,. I am Using VS2015, Excel 14 Object Library v14. Best regards, Otmar over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2017-04-04 10:42:05 UTC", "text": "Error\tCS0234\tThe type or namespace name 'Application' does not exist in the namespace 'Excel' (are you missing an assembly reference?)\tMyTestdata\r\n\r\nThis is with the exact same reference and using directive you specify here. It simply doesn't work like that.", "upvoteCount": 0