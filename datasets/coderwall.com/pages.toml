title = "Creating full width (100% ) container inside fixed width container. (Example)"
description = "A protip by praveenvijayan about css, layout, and viewport width."
full_description = '''{ "@context": "http://schema.org", "@type": "Article", "@id": "creating-full-width-100-container-inside-fixed-width-container", "author": { "@type": "Person", "name": "praveen vijayan" }, "dateModified": "2023-11-29 15:09:32 UTC", "datePublished": "2023-11-29 15:09:32 UTC", "headline": "Creating full width (100% ) container inside fixed width container. (Example)", "url": "/p/hkgamw/creating-full-width-100-container-inside-fixed-width-container", "commentCount": 14, "keywords": "css, layout, viewport width", "articleBody": "Some times we need to add a full width containers (which spans 100% of window) inside a container which has a fixed width and aligned center.\r\n\r\nFollowing code helps to achieve the layout.\r\n\r\nDemo: http://jsfiddle.net/m1L6pfwm/2/\r\n\r\n HTML\r\n\r\n \u003cdiv class=\"container\" style=\"width: 750px; margin: 0 auto;\"\u003e\r\n \r\n \u003cdiv class=\"row-full\"\u003e\r\n --- Full width container ---\r\n \u003c/div\u003e\r\n\r\n \u003c/div\u003e\r\n\r\nCSS \r\n\r\n .row-full{\r\n width: 100vw;\r\n position: relative;\r\n margin-left: -50vw;\r\n height: 100px;\r\n margin-top: 100px;\r\n left: 50%;\r\n }\r\n\r\nHow it works:\r\n\r\nCss units vw (viewport width) is used here. IE9 above has support for vw \u0026 vh css units.\r\n\r\n![Picture](https://coderwall-assets-0.s3.amazonaws.com/uploads/picture/file/3728/row_fluid_explain.jpg)\r\n", "description": "A protip by praveenvijayan about css, layout, and viewport width.", "publisher": { "@type": "Organization", "name": "Coderwall", "logo": { "@type": "ImageObject", "url": "/logo.png" }, "url": "https://coderwall.com/" }, "image": "/logo.png" } Last Updated: November 29, 2023 · 469K · praveenvijayan Creating full width (100% ) container inside fixed width container. #css #layout #viewport width Some times we need to add a full width containers (which spans 100% of window) inside a container which has a fixed width and aligned center. Following code helps to achieve the layout. Demo: http://jsfiddle.net/m1L6pfwm/2/ HTML <div class="container" style="width: 750px; margin: 0 auto;"> <div class="row-full"> --- Full width container --- </div> </div> CSS .row-full{ width: 100vw; position: relative; margin-left: -50vw; height: 100px; margin-top: 100px; left: 50%; } How it works: Css units vw (viewport width) is used here. IE9 above has support for vw & vh css units. #css #layout #viewport width Written by praveen vijayan Say Thanks Respond Related protips Fully custom select box, simple css only 571.9K 32 Change the Bootstrap NavBar Breakpoint 501.4K 39 Total input[type=file] style control with pure CSS 294.9K 7 14 Responses Add your response { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2015-06-03 20:08:01 UTC", "text": "Saved my life! Thank you man!", "upvoteCount": 1, "author": { "@type": "Person", "name": "Pedro Gandra" }, "about": { "@type": "Article", "@id": "creating-full-width-100-container-inside-fixed-width-container" } } pedrogandra Saved my life! Thank you man! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2016-06-30 13:19:25 UTC", "text": "Thanks man!!!", "upvoteCount": 0, "author": { "@type": "Person", "name": "alanrezende" }, "about": { "@type": "Article", "@id": "creating-full-width-100-container-inside-fixed-width-container" } } alanrezende Thanks man!!! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2017-03-10 23:08:51 UTC", "text": "If you don't want the horizontal scrollbar and you don't mind voodoo, try this:\r\n\r\n.row-full {\r\n width: 99.225vw;\r\n position: relative;\r\n margin-left: -49.59vw;\r\n left: 50%;\r\n}", "upvoteCount": 0, "author": { "@type": "Person", "name": "FalseMcFakeman" }, "about": { "@type": "Article", "@id": "creating-full-width-100-container-inside-fixed-width-container" } } FalseMcFakeman If you don't want the horizontal scrollbar and you don't mind voodoo, try this: .row-full { width: 99.225vw; position: relative; margin-left: -49.59vw; left: 50%; } over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2017-03-30 12:02:35 UTC", "text": "It is a beautiful solution, but it is not responsive. :(\r\nAny suggestions for responsivity?", "upvoteCount": 0, "author": { "@type": "Person", "name": "Danymite" }, "about": { "@type": "Article", "@id": "creating-full-width-100-container-inside-fixed-width-container" } } Danymite It is a beautiful solution, but it is not responsive. :( Any suggestions for responsivity? over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2018-03-20 00:08:38 UTC", "text": "In your picture above. Did you mean for the green lines to be 'vw' not 'vh' ?", "upvoteCount": 0, "author": { "@type": "Person", "name": "zync09" }, "about": { "@type": "Article", "@id": "creating-full-width-100-container-inside-fixed-width-container" } } zync09 In your picture above. Did you mean for the green lines to be 'vw' not 'vh' ? over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2018-07-25 23:54:05 UTC", "text": "MAN! I just created an account to comment on this. I struggled for hours with this and this solution is super elegant! \r\nIt's specially helpful for wordpress sites for example, when you need to override the container in the post/product page.\r\n\r\nTHANKS!!", "upvoteCount": 0, "author": { "@type": "Person", "name": "Juan FullOfGraphics" }, "about": { "@type": "Article", "@id": "creating-full-width-100-container-inside-fixed-width-container" } } Juan FullOfGraphics MAN! I just created an account to comment on this. I struggled for hours with this and this solution is super elegant! It's specially helpful for wordpress sites for example, when you need to override the container in the post/product page. THANKS!! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2018-12-14 22:10:18 UTC", "text": "It's great, thank you! ", "upvoteCount": 0, "author": { "@type": "Person", "name": "eresendez" }, "about": { "@type": "Article", "@id": "creating-full-width-100-container-inside-fixed-width-container" } } eresendez It's great, thank you! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2018-12-22 13:24:38 UTC", "text": "This is great, thanks for sharing this tip it really helped me :D", "upvoteCount": 0, "author": { "@type": "Person", "name": "Fabio Rosado" }, "about": { "@type": "Article", "@id": "creating-full-width-100-container-inside-fixed-width-container" } } fabiorosado This is great, thanks for sharing this tip it really helped me :D over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2019-11-12 16:51:22 UTC", "text": "@FalseMcFakeman If you don't want the horizontal scrollbar then you set the `box-sizing` of the full-width container to border-box. What you have done there is not an advisable solution. Most people just use the following now by default on every project instead because border-box is a much easier way of thinking about sizes.\r\n\r\n *,\r\n *:before,\r\n *:after {\r\n box-sizing: inherit;\r\n }\r\n\r\n html {\r\n box-sizing: border-box;\r\n }", "upvoteCount": 0, "author": { "@type": "Person", "name": "stephenirving" }, "about": { "@type": "Article", "@id": "creating-full-width-100-container-inside-fixed-width-container" } } stephenirving @FalseMcFakeman If you don't want the horizontal scrollbar then you set the box-sizing of the full-width container to border-box. What you have done there is not an advisable solution. Most people just use the following now by default on every project instead because border-box is a much easier way of thinking about sizes. *, *:before, *:after { box-sizing: inherit; } html { box-sizing: border-box; } over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2019-11-12 18:12:26 UTC", "text": "The inner div `.row-full` only really needs the width set explicitly if another style effecting it sets it explicitly at something other than `100vw`, or if it has had its `display` value changed from `block`. An element with the `display` value of `block` will automatically take up the most space it possibly can, and when you changed the `position` value to `relative` you took it out of the normal document flow and its maximum value became 100vw automatically. In your example you can the `width: 100vw;` line out totally and it will look the same in all cases.", "upvoteCount": 0, "author": { "@type": "Person", "name": "stephenirving" }, "about": { "@type": "Article", "@id": "creating-full-width-100-container-inside-fixed-width-container" } } stephenirving The inner div .row-full only really needs the width set explicitly if another style effecting it sets it explicitly at something other than 100vw, or if it has had its display value changed from block. An element with the display value of block will automatically take up the most space it possibly can, and when you changed the position value to relative you took it out of the normal document flow and its maximum value became 100vw automatically. In your example you can the width: 100vw; line out totally and it will look the same in all cases. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2020-11-30 11:17:07 UTC", "text": "@stephenirving the problem with horizontal scrollbar has nothing to do with the box sizing model but with the way current desktop browsers handle viewport messurements. They are simply unaware of the vertical scroll bar so the 100vw generates content under the vertical scrollbar if ir's present, triggering the horizontal one. To fix it you have to substract bar's width from the 100vw. The problem is that scollbars are similar but not the same on all browsers, so you have to substract a more or less safe width or use javascript to calculate the real scrollbar width and substract it on the fly.\r\nMi pure CSS solution was to add:\r\n@media screen and (min-width:700px){\r\n .row-full{\r\n width: calc(100vw - 8.1px);\r\n }\r\n}\r\nbecause the scrollbar issue is not present on mobile browsers where scrollbars do not take visual space.", "upvoteCount": 0, "author": { "@type": "Person", "name": "Digitart" }, "about": { "@type": "Article", "@id": "creating-full-width-100-container-inside-fixed-width-container" } } Digitart @stephenirving the problem with horizontal scrollbar has nothing to do with the box sizing model but with the way current desktop browsers handle viewport messurements. They are simply unaware of the vertical scroll bar so the 100vw generates content under the vertical scrollbar if ir's present, triggering the horizontal one. To fix it you have to substract bar's width from the 100vw. The problem is that scollbars are similar but not the same on all browsers, so you have to substract a more or less safe width or use javascript to calculate the real scrollbar width and substract it on the fly. Mi pure CSS solution was to add: @media screen and (min-width:700px){ .row-full{ width: calc(100vw - 8.1px); } } because the scrollbar issue is not present on mobile browsers where scrollbars do not take visual space. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2021-02-10 07:34:02 UTC", "text": "Thank you! Helped a lot", "upvoteCount": 0, "author": { "@type": "Person", "name": "mmdbiz" }, "about": { "@type": "Article", "@id": "creating-full-width-100-container-inside-fixed-width-container" } } mmdbiz Thank you! Helped a lot over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2021-11-05 09:45:54 UTC", "text": "It solved my problem, thank you!", "upvoteCount": 0, "author": { "@type": "Person", "name": "RyanHillier" }, "about": { "@type": "Article", "@id": "creating-full-width-100-container-inside-fixed-width-container" } } RyanHillier It solved my problem, thank you! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2021-11-22 07:32:35 UTC", "text": "I simply use this rules for .row-full and it seems all works:\r\n\r\nmargin-left: calc((100vw - 100%) / -2);\r\nwidth: 100vw;", "upvoteCount": 0, "author": { "@type": "Person", "name": "Oleg Burakov" }, "about": { "@type": "Article", "@id": "creating-full-width-100-container-inside-fixed-width-container" } } Oleg Burakov I simply use this rules for .row-full and it seems all works: margin-left: calc((100vw - 100%) / -2); width: 100vw; over 1 year ago · Have a fresh tip? Share with Coderwall community! Post Post a tip Best #Css Authors oldboy 571.1K #css #jQuery #CSS 3 iatek 503.4K #css #Javascript #Node.js praveenvijayan 466.2K #css #Javascript #Python elad2412 416.2K #css #cross browser compatibility #photoshop projectcleverweb 308.1K #css #javascript #Python Related Tags #css #layout #viewport width .#native_index# { background-color: #native_bg_color#; margin-bottom: 40px; } .#native_index# .native-main { color: #native_color# !important; } .#native_index# .native-cta { color: #native_cta_color#; background-color: #native_cta_bg_color#; } Sponsored by #native_company# #native_desc# #native_cta# Filed Under Accelerate Your Web Development Skills Awesome Job See All Jobs Post a job for only $299 Sponsored by #native_company# — Learn More ._native_ribbon.native-js { background: linear-gradient(-30deg, #native_bg_color#E5, #native_bg_color#E5 45%, #native_bg_color# 45%) #fff; } ._native_ribbon .native-details, ._native_ribbon .native-sponsor, ._native_ribbon .native-bsa { color: #native_color# !important; } ._native_ribbon .native-details:hover { color: #native_color_hover# !important; } ._native_ribbon .native-cta { color: #native_cta_color#; background-color: #native_cta_bg_color#; } ._native_ribbon .native-cta:hover { color: #native_cta_color_hover; background-color: #native_cta_bg_color_hover#; 