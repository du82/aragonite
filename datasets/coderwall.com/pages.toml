["https://coderwall.com/p/7aymfa/please-oh-please-use-git-pull-rebase"]
title = "Please, oh please, use git pull --rebase (Example)"
description = "A protip by khasinski about git."
full_description = '''{ "@context": "http://schema.org", "@type": "Article", "@id": "please-oh-please-use-git-pull-rebase", "author": { "@type": "Person", "name": "Krzysztof Hasiński" }, "dateModified": "2024-03-08 10:54:13 UTC", "datePublished": "2024-03-08 10:54:13 UTC", "headline": "Please, oh please, use git pull --rebase (Example)", "url": "/p/7aymfa/please-oh-please-use-git-pull-rebase", "commentCount": 38, "keywords": "git", "articleBody": "When working on a project you usually synchronize your code by pulling it several times a day. What you might not know is that by typing\r\n\r\n git pull\r\n\r\nyou actually issuing git fetch + git merge commands, which will result with an extra commit and ugly merge bubbles in your commit log (check out gitk to see them). \r\n\r\nIt's much better to use \r\n\r\n git pull --rebase\r\n\r\nto keep the repository clean, your commits always on top of the tree until you push them to a remote server. The command will apply all your yet-to-be-pushed commits on top of the remote tree commits allowing your commits to be straight in a row and without branches (easier git bisects, yay!). \r\n\r\nFew notes though. If you want to merge a feature branch it might be wiser to actually merge your commits thus having a single point of integration of two distinct branches. \r\n\r\nAlso the conflict resolving will be now per commit basis, not everything-at-once, so you will have to use \r\n\r\n git rebase --continue\r\n\r\nto get to the next batch of conflicts (if you have any).\r\n\r\n**NOTE:** Because of many discussions about this note. I **DO NOT** encourage rebasing *remote* (public or shared) branches. Rebasing local history is OK (it's more than OK, it's sometimes necessary to maintain a clean history), but changing other people commits history is considered a bad practice.", "description": "A protip by khasinski about git.", "publisher": { "@type": "Organization", "name": "Coderwall", "logo": { "@type": "ImageObject", "url": "/logo.png" }, "url": "https://coderwall.com/" }, "image": "/logo.png" } Last Updated: March 08, 2024 · 563.7K · khasinski Please, oh please, use git pull --rebase #git When working on a project you usually synchronize your code by pulling it several times a day. What you might not know is that by typing git pull you actually issuing git fetch + git merge commands, which will result with an extra commit and ugly merge bubbles in your commit log (check out gitk to see them). It's much better to use git pull --rebase to keep the repository clean, your commits always on top of the tree until you push them to a remote server. The command will apply all your yet-to-be-pushed commits on top of the remote tree commits allowing your commits to be straight in a row and without branches (easier git bisects, yay!). Few notes though. If you want to merge a feature branch it might be wiser to actually merge your commits thus having a single point of integration of two distinct branches. Also the conflict resolving will be now per commit basis, not everything-at-once, so you will have to use git rebase --continue to get to the next batch of conflicts (if you have any). NOTE: Because of many discussions about this note. I DO NOT encourage rebasing remote (public or shared) branches. Rebasing local history is OK (it's more than OK, it's sometimes necessary to maintain a clean history), but changing other people commits history is considered a bad practice. #git Written by Krzysztof Hasiński Say Thanks Respond Related protips A better git log 680.4K 50 Git - Cloning Specific Commits 479.8K 3 git commit --allow-empty 479.6K 0 38 Responses Add your response { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2012-10-10 04:30:41 UTC", "text": "oh, i didn\"t knew you could do that. i was doing the same thing in a slightly more verbose way:\r\n\r\n```\r\ngit fetch\r\ngit rebase origin/my-branch\r\n```\r\n\r\ngreat advise, thanks", "upvoteCount": 1, "author": { "@type": "Person", "name": "Pavel Pravosud " }, "about": { "@type": "Article", "@id": "please-oh-please-use-git-pull-rebase" } } rwz oh, i didn"t knew you could do that. i was doing the same thing in a slightly more verbose way: git fetch git rebase origin/my-branch great advise, thanks over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2012-10-10 09:36:33 UTC", "text": "You can get even shorter version as I described here: \r\nhttp://coderwall.com/p/yf5-0w", "upvoteCount": 1, "author": { "@type": "Person", "name": "Krzysztof Hasiński" }, "about": { "@type": "Article", "@id": "please-oh-please-use-git-pull-rebase" } } khasinski You can get even shorter version as I described here: http://coderwall.com/p/yf5-0w over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-04-28 05:25:08 UTC", "text": "I tried explaining this to a colleague of mine about two years ago and he simply couldn't understand.", "upvoteCount": 0, "author": { "@type": "Person", "name": "Mahesh Lal" }, "about": { "@type": "Article", "@id": "please-oh-please-use-git-pull-rebase" } } maheshlal2910 I tried explaining this to a colleague of mine about two years ago and he simply couldn't understand. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-04-28 08:52:56 UTC", "text": "It's a lot easier to just set rebase as the default using\r\n\r\n git config branch.autosetuprebase always\r\n\r\nAs [explained by khasinski](https://coderwall.com/p/yf5-0w)", "upvoteCount": 13, "author": { "@type": "Person", "name": "potherca" }, "about": { "@type": "Article", "@id": "please-oh-please-use-git-pull-rebase" } } potherca It's a lot easier to just set rebase as the default using git config branch.autosetuprebase always As explained by khasinski over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-04-28 21:02:43 UTC", "text": "I never use 'git pull'. The reason is that I want to fetch - look at what other people changed, and only then decide whether I'd like to rebase to those changes now, while I'm doing my stuff locally.\r\n\r\nSo my advice - unless you know exactly what you are getting from the remote branch, don't use 'git pull'.", "upvoteCount": 9, "author": { "@type": "Person", "name": "Dan Aloni" }, "about": { "@type": "Article", "@id": "please-oh-please-use-git-pull-rebase" } } danaloni I never use 'git pull'. The reason is that I want to fetch - look at what other people changed, and only then decide whether I'd like to rebase to those changes now, while I'm doing my stuff locally. So my advice - unless you know exactly what you are getting from the remote branch, don't use 'git pull'. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-04-28 21:26:03 UTC", "text": "Rebase by default when doing git pull: https://coderwall.com/p/tnoiug", "upvoteCount": 0, "author": { "@type": "Person", "name": "Marcin Kulik" }, "about": { "@type": "Article", "@id": "please-oh-please-use-git-pull-rebase" } } sickill Rebase by default when doing git pull: https://coderwall.com/p/tnoiug over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-04-30 00:39:48 UTC", "text": "I use `git pull --ff-only` (aliased as `git p`) so if the pull is anything other than a fast forward I have to stop and think about what I want to do about it. Rebasing when I think I'm going to fast forward is not a behavior I want. If I decide a rebase is really what I want I have a `git prb` alias too.", "upvoteCount": 7, "author": { "@type": "Person", "name": "Carl Zulauf" }, "about": { "@type": "Article", "@id": "please-oh-please-use-git-pull-rebase" } } carlzulauf I use git pull --ff-only (aliased as git p) so if the pull is anything other than a fast forward I have to stop and think about what I want to do about it. Rebasing when I think I'm going to fast forward is not a behavior I want. If I decide a rebase is really what I want I have a git prb alias too. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-04-30 00:58:31 UTC", "text": "No - I want to see the full history. No rebase please.", "upvoteCount": 10, "author": { "@type": "Person", "name": "Jordan Zimmerman" }, "about": { "@type": "Article", "@id": "please-oh-please-use-git-pull-rebase" } } randgalt No - I want to see the full history. No rebase please. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-04-30 01:00:36 UTC", "text": "I prefer to git fetch then git rebase (or merge if appropriate) manually.", "upvoteCount": 8, "author": { "@type": "Person", "name": "Simon Baird" }, "about": { "@type": "Article", "@id": "please-oh-please-use-git-pull-rebase" } } simonbaird I prefer to git fetch then git rebase (or merge if appropriate) manually. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-04-30 01:53:19 UTC", "text": "+1 for not using git pull. Use git fetch, and then decide on the appropriate action.\r\n\r\nIn addition, I don't commit or merge onto master (or any shared tracking branch) until I'm ready to push, so I very rarely have a fetch that isn't a fast forward anyway.\r\n\r\nI do tend to rebase my development branches.", "upvoteCount": 4, "author": { "@type": "Person", "name": "Bryan Cribbs" }, "about": { "@type": "Article", "@id": "please-oh-please-use-git-pull-rebase" } } bdcribbs +1 for not using git pull. Use git fetch, and then decide on the appropriate action. In addition, I don't commit or merge onto master (or any shared tracking branch) until I'm ready to push, so I very rarely have a fetch that isn't a fast forward anyway. I do tend to rebase my development branches. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-04-30 02:43:29 UTC", "text": "git is overcomplicated.", "upvoteCount": 9, "author": { "@type": "Person", "name": "jj" }, "about": { "@type": "Article", "@id": "please-oh-please-use-git-pull-rebase" } } clockworkelves git is overcomplicated. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-04-30 03:53:38 UTC", "text": "clockworkelves, life is overcomplicated too.", "upvoteCount": 1, "author": { "@type": "Person", "name": "Ruben Tan Long Zheng" }, "about": { "@type": "Article", "@id": "please-oh-please-use-git-pull-rebase" } } soggie2 clockworkelves, life is overcomplicated too. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-04-30 05:26:59 UTC", "text": "Please don't use rebase if other people rely on / pull from your codebase; use merge instead.", "upvoteCount": 2, "author": { "@type": "Person", "name": "Matt Keenan" }, "about": { "@type": "Article", "@id": "please-oh-please-use-git-pull-rebase" } } mattkeenan Please don't use rebase if other people rely on / pull from your codebase; use merge instead. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-04-30 05:38:26 UTC", "text": "case 1: I want to push my code changes only (no merges), and I my local branch is out of date\r\n\r\n* git pull –r (or pull - -rebase)\r\n\r\ncase 2: I need to push a merge I just did, and I my local branch is out of date\r\n\r\n* git pull\r\n(If you have 'git pull' aliased to 'git pull -r', then 'git pull --no-rebase')", "upvoteCount": 0, "author": { "@type": "Person", "name": "Rico Rodriquez Collins" }, "about": { "@type": "Article", "@id": "please-oh-please-use-git-pull-rebase" } } ricokareem case 1: I want to push my code changes only (no merges), and I my local branch is out of date git pull –r (or pull - -rebase) case 2: I need to push a merge I just did, and I my local branch is out of date git pull (If you have 'git pull' aliased to 'git pull -r', then 'git pull --no-rebase') over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-04-30 07:28:59 UTC", "text": "clockworkelves\r\n\r\nCheck `man git`, you'll see it's 'the stupid content tracker' ;)", "upvoteCount": 1, "author": { "@type": "Person", "name": "Krzysztof Hasiński" }, "about": { "@type": "Article", "@id": "please-oh-please-use-git-pull-rebase" } } khasinski clockworkelves Check man git, you'll see it's 'the stupid content tracker' ;) over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-04-30 08:17:15 UTC", "text": "And if you are lazy to do git fetch \u0026 git rebase you might use https://github.com/aanand/git-up", "upvoteCount": 0, "author": { "@type": "Person", "name": "kewah" }, "about": { "@type": "Article", "@id": "please-oh-please-use-git-pull-rebase" } } kewah And if you are lazy to do git fetch & git rebase you might use https://github.com/aanand/git-up over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-04-30 09:06:02 UTC", "text": "@randgalt - You want to see every burp and hiccup along the development timeline? Why not take that viewpoint to the logical endpoint and auto-commit after every character typed?\r\n\r\nOh would that be insane? Because it's useless noise in the history? What you actually care about was the developers intent? Now you're starting to see the light. Once you grok git you realize the value of crafting your local commits to provide an immaculate and bisectable project history to the outside world.", "upvoteCount": 4, "author": { "@type": "Person", "name": "Gabe da Silveira" }, "about": { "@type": "Article", "@id": "please-oh-please-use-git-pull-rebase" } } dasil003 @randgalt - You want to see every burp and hiccup along the development timeline? Why not take that viewpoint to the logical endpoint and auto-commit after every character typed? Oh would that be insane? Because it's useless noise in the history? What you actually care about was the developers intent? Now you're starting to see the light. Once you grok git you realize the value of crafting your local commits to provide an immaculate and bisectable project history to the outside world. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-04-30 10:21:51 UTC", "text": "why would you git pull before you want to push?\r\n\r\nYou pull something, work on it, and when you are done, then you pull, check if everything is working and push.\r\n\r\nWhy would i resolve problems with remote changes multiple times a day if i'm not done with what i'm working on?", "upvoteCount": 0, "author": { "@type": "Person", "name": "Valter Martinek" }, "about": { "@type": "Article", "@id": "please-oh-please-use-git-pull-rebase" } } montas why would you git pull before you want to push? You pull something, work on it, and when you are done, then you pull, check if everything is working and push. Why would i resolve problems with remote changes multiple times a day if i'm not done with '''
