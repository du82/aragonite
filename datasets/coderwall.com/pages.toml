title = "Django dumpdata and loaddata (Example)"
description = "A protip by itseranga about django, database, model, and dumpdata."
full_description = '''{ "@context": "http://schema.org", "@type": "Article", "@id": "django-dumpdata-and-loaddata", "author": { "@type": "Person", "name": "eranga bandara" }, "dateModified": "2023-07-17 10:03:50 UTC", "datePublished": "2023-07-17 10:03:50 UTC", "headline": "Django dumpdata and loaddata (Example)", "url": "/p/mvsoyg/django-dumpdata-and-loaddata", "commentCount": 7, "keywords": "django, database, model, dumpdata", "articleBody": "## dumpdata command\r\n\r\n* It is a django management command, which can be use to backup(export) you model instances or whole database\r\n\r\n## dumpdata for basic database dump\r\n\r\n* Following command will dump whole database in to a `db.json` file\r\n\r\n```\r\n./manage.py dumpdata \u003e db.json\r\n```\r\n\r\n## dumpdata for backup specific app\r\n\r\n* Following command will dump the content in django `admin` app into `admin.json` file\r\n\r\n```\r\n./manage.py dumpdata admin \u003e admin.json\r\n```\r\n\r\n## dumpdata for backup specific table\r\n\r\n* Following command will dump only the content in django `admin.logentry` table \r\n\r\n```\r\n./manage.py dumpdata admin.logentry \u003e logentry.json\r\n```\r\n\r\n* Following command will dump the content in django `auth.user` table \r\n\r\n```\r\n./manage.py dumpdata auth.user \u003e user.json\r\n```\r\n\r\n## dumpdata (--exclude)\r\n\r\n* You can use `--exclude` option to specify apps/tables which don't need being dumped\r\n\r\n* Following command will dump the whole database with out including `auth.permission` table content\r\n\r\n```\r\n./manage.py dumpdata --exclude auth.permission \u003e db.json\r\n```\r\n\r\n## dumpdata (--indent)\r\n\r\n* By default, `dumpdata` will output all data on a single line. It isn’t easy for humans to read \r\n\r\n* You can use the `--indent` option to pretty-print the output with a number of indentation spaces\r\n\r\n```\r\n./manage.py dumpdata auth.user --indent 2 \u003e user.json\r\n```\r\n\r\n* Example output of above command is below\r\n\r\n![Picture](https://coderwall-assets-0.s3.amazonaws.com/uploads/picture/file/3284/Screen_Shot_2014-08-19_at_11.25.30_PM.png)\r\n\r\n## dumpdata (--format)\r\n\r\n* By default, dumpdata will format its output in JSON\r\n\r\n* You can specify the format using --format option\r\n\r\n* Command supports for following formats(serialization formats)\r\n\r\n1. json\r\n2. xml\r\n3. yaml\r\n\r\n```\r\n./manage.py dumpdata auth.user --indent 2 --format xml \u003e user.xml\r\n```\r\n\r\n* Above command output an xml file(user.xml)\r\n\r\n![Picture](https://coderwall-assets-0.s3.amazonaws.com/uploads/picture/file/3283/Screen_Shot_2014-08-19_at_11.23.28_PM.png)\r\n\r\n## loaddata command\r\n\r\n* This command can be use to load the fixtures(database dumps) into database\r\n\r\n```\r\n./manage.py loaddata user.json\r\n```\r\n\r\n* This command will add the `user.json` file content into the database\r\n\r\n## Restore fresh database \r\n\r\n* When you backup whole database by using `dumpdata` command, it will backup all the database tables\r\n\r\n* If you use this database dump to load the fresh database(in another django project), it can be causes `IntegrityError` (If you `loaddata` in same database it works fine)\r\n\r\n* To fix this problem, make sure to backup the database by excluding `contenttypes` and `auth.permissions` tables\r\n\r\n```\r\n./manage.py dumpdata --exclude auth.permission --exclude contenttypes \u003e db.json\r\n```\r\n\r\n* Now you can use `loaddata` command with a fresh database\r\n\r\n```\r\n./manage.py loaddata db.json\r\n```", "description": "A protip by itseranga about django, database, model, and dumpdata.", "publisher": { "@type": "Organization", "name": "Coderwall", "logo": { "@type": "ImageObject", "url": "/logo.png" }, "url": "https://coderwall.com/" }, "image": "/logo.png" } Last Updated: July 17, 2023 · 455.4K · itseranga Django dumpdata and loaddata #django #database #model #dumpdata dumpdata command It is a django management command, which can be use to backup(export) you model instances or whole database dumpdata for basic database dump Following command will dump whole database in to a db.json file ./manage.py dumpdata > db.json dumpdata for backup specific app Following command will dump the content in django admin app into admin.json file ./manage.py dumpdata admin > admin.json dumpdata for backup specific table Following command will dump only the content in django admin.logentry table ./manage.py dumpdata admin.logentry > logentry.json Following command will dump the content in django auth.user table ./manage.py dumpdata auth.user > user.json dumpdata (--exclude) You can use --exclude option to specify apps/tables which don't need being dumped Following command will dump the whole database with out including auth.permission table content ./manage.py dumpdata --exclude auth.permission > db.json dumpdata (--indent) By default, dumpdata will output all data on a single line. It isn’t easy for humans to read You can use the --indent option to pretty-print the output with a number of indentation spaces ./manage.py dumpdata auth.user --indent 2 > user.json Example output of above command is below dumpdata (--format) By default, dumpdata will format its output in JSON You can specify the format using --format option Command supports for following formats(serialization formats) json xml yaml ./manage.py dumpdata auth.user --indent 2 --format xml > user.xml Above command output an xml file(user.xml) loaddata command This command can be use to load the fixtures(database dumps) into database ./manage.py loaddata user.json This command will add the user.json file content into the database Restore fresh database When you backup whole database by using dumpdata command, it will backup all the database tables If you use this database dump to load the fresh database(in another django project), it can be causes IntegrityError (If you loaddata in same database it works fine) To fix this problem, make sure to backup the database by excluding contenttypes and auth.permissions tables ./manage.py dumpdata --exclude auth.permission --exclude contenttypes > db.json Now you can use loaddata command with a fresh database ./manage.py loaddata db.json #django #database #model #dumpdata Written by eranga bandara Say Thanks Respond Related protips Simple Django Image upload to model imagefield 235.5K 14 Mac OS X: ValueError: unknown locale: UTF-8 in Python 178.9K 13 Django Signals - an Extremely Simplified Explanation for Beginners. 74.89K 11 7 Responses Add your response { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2015-01-16 08:36:44 UTC", "text": "Thanks for this tutorial. The steps worked for me, but I found that when I tried to restore, I got an out of memory error, because my file was too large. I ended up using raw postgres commands: \r\n\r\nexport: pg_dump \u003cdbname\u003e -t \u003ctablename\u003e -f out.sql\r\n\r\nimport: psql \u003cdbname\u003e -f out.sql", "upvoteCount": 0, "author": { "@type": "Person", "name": "Richard Caceres" }, "about": { "@type": "Article", "@id": "django-dumpdata-and-loaddata" } } rchrd2 Thanks for this tutorial. The steps worked for me, but I found that when I tried to restore, I got an out of memory error, because my file was too large. I ended up using raw postgres commands: export: pg_dump <dbname> -t <tablename> -f out.sql import: psql <dbname> -f out.sql over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2015-03-20 10:39:17 UTC", "text": "There is lots of other cases where loaddata and dumpdata commands don't work. So pg_dump and psql are good, but the downside of them is that you lose the database configuration that is stored in the project settings (or the environment if you are 12factor aware).", "upvoteCount": 0, "author": { "@type": "Person", "name": "Dries Desmet" }, "about": { "@type": "Article", "@id": "django-dumpdata-and-loaddata" } } triotorus There is lots of other cases where loaddata and dumpdata commands don't work. So pg_dump and psql are good, but the downside of them is that you lose the database configuration that is stored in the project settings (or the environment if you are 12factor aware). over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2016-01-14 07:20:01 UTC", "text": "Thank you very much! Paragraph \"Restore fresh database\" saved me!", "upvoteCount": 0, "author": { "@type": "Person", "name": "eat4ever" }, "about": { "@type": "Article", "@id": "django-dumpdata-and-loaddata" } } lyn5466 Thank you very much! Paragraph "Restore fresh database" saved me! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2017-07-15 05:22:24 UTC", "text": "Hi, thanks for this post. I was able to use it to save some dats into json but when I tried to load same data into the db, I got the error: \r\n\r\nraise base.DeserializationError.WithData(e, d['model'], d.get('pk'), pk)\r\n\r\nlocal variable 'pk' referenced before assignment\r\n\r\nHow do I go around this error? Thanks ", "upvoteCount": 0, "author": { "@type": "Person", "name": "pythonian" }, "about": { "@type": "Article", "@id": "django-dumpdata-and-loaddata" } } pythonian Hi, thanks for this post. I was able to use it to save some dats into json but when I tried to load same data into the db, I got the error: raise base.DeserializationError.WithData(e, d['model'], d.get('pk'), pk) local variable 'pk' referenced before assignment How do I go around this error? Thanks over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2017-07-23 06:08:19 UTC", "text": "Thanks! This is awesome. For some reason I actually got my Webfaction Django to accept fixtures. Def bookmark on this exact page!", "upvoteCount": 0, "author": { "@type": "Person", "name": "chris9" }, "about": { "@type": "Article", "@id": "django-dumpdata-and-loaddata" } } chris9 Thanks! This is awesome. For some reason I actually got my Webfaction Django to accept fixtures. Def bookmark on this exact page! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2018-10-05 14:56:34 UTC", "text": "Good article. Here is a blog explaining loading fixtures in django with a video tutorial:- http://newprograminglogics.blogspot.com/2018/09/load-initial-data-into-django-model.html", "upvoteCount": 0, "author": { "@type": "Person", "name": "Sukeshbr" }, "about": { "@type": "Article", "@id": "django-dumpdata-and-loaddata" } } Sukeshbr Good article. Here is a blog explaining loading fixtures in django with a video tutorial:- http://newprograminglogics.blogspot.com/2018/09/load-initial-data-into-django-model.html over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2019-03-15 05:13:50 UTC", "text": "Thanks so much, this save me from slot of trouble.", "upvoteCount": 0, "author": { "@type": "Person", "name": "ahmadandulnasir" }, "about": { "@type": "Article", "@id": "django-dumpdata-and-loaddata" } } ahmadandulnasir Thanks so much, this save me from slot of trouble. over 1 year ago · Have a fresh tip? Share with Coderwall community! Post Post a tip Best #Django Authors itseranga 452.4K #django #cryptography #docker snird 235.5K #django #css #Python masnun 179.6K #django #PHP #Python shrikant 74.82K #django #Open Source #python madhugb 64.83K #django #JavaScript #Open Source Related Tags #django #database #model #dumpdata .#native_index# { background-color: #native_bg_color#; margin-bottom: 40px; } .#native_index# .native-main { color: #native_color# !important; } .#native_index# .native-cta { color: #native_cta_color#; background-color: #native_cta_bg_color#; } Sponsored by #native_company# #native_desc# #native_cta# Awesome Job See All Jobs Post a job for only $299 Sponsored by #native_company# — Learn More ._native_ribbon.native-js { background: linear-gradient(-30deg, #native_bg_color#E5, #native_bg_col