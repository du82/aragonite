title = "How to check if JavaScript Object is empty (Example)"
description = "A protip by Kyle Ross about objects, prototype, javascript, and isempty."
full_description = '''{ "@context": "http://schema.org", "@type": "Article", "@id": "how-to-check-if-javascript-object-is-empty", "author": { "@type": "Person", "name": "Kyle Ross" }, "dateModified": "2024-09-27 17:29:56 UTC", "datePublished": "2024-09-27 17:29:56 UTC", "headline": "How to check if JavaScript Object is empty (Example)", "url": "/p/_g3x9q/how-to-check-if-javascript-object-is-empty", "commentCount": 18, "keywords": "objects, prototype, javascript, isempty", "articleBody": "With JavaScript, it can be difficult to check whether an object is empty. With Arrays, you can easily check with **myArray.length**, but on the other hand, objects do not work that way.\r\n\r\nThe best way to check if an object is empty is by using a utility function like the one below.\r\n\r\n function isEmpty(obj) {\r\n for(var key in obj) {\r\n if(obj.hasOwnProperty(key))\r\n return false;\r\n }\r\n return true;\r\n }\r\n\r\nSo if you have an empty object, you can check whether it is empty by using the above function.\r\n\r\n var myObj = {}; // Empty Object\r\n if(isEmpty(myObj)) {\r\n // Object is empty (Would return true in this example)\r\n } else {\r\n // Object is NOT empty\r\n }\r\n\r\nAlternatively, you can write the isEmpty function on the Object prototype.\r\n\r\n Object.prototype.isEmpty = function() {\r\n for(var key in this) {\r\n if(this.hasOwnProperty(key))\r\n return false;\r\n }\r\n return true;\r\n }\r\n\r\nThen you can easily check if the object is empty like so.\r\n\r\n var myObj = {\r\n myKey: \"Some Value\"\r\n }\r\n \r\n if(myObj.isEmpty()) {\r\n // Object is empty\r\n } else {\r\n // Object is NOT empty (would return false in this example)\r\n }\r\n\r\nExtending the object prototype is not the best thing to do as it can cause some browser issues and other issues with certain frameworks (it's also not always reliable in certain environments). The example I gave is pretty much framework agnostic although.\r\n\r\nThis is one of those utility functions that will always be useful, especially if you deal with a lot of objects on a daily basis (like I do).\r\n\r\n####Related protips:\r\n[javascript foreach](https://coderwall.com/p/kvzbpa/don-t-use-array-foreach-use-for-instead)\r\n", "description": "A protip by Kyle Ross about objects, prototype, javascript, and isempty.", "publisher": { "@type": "Organization", "name": "Coderwall", "logo": { "@type": "ImageObject", "url": "/logo.png" }, "url": "https://coderwall.com/" }, "image": "/logo.png" } Last Updated: September 27, 2024 · 1.1M · Kyle Ross How to check if JavaScript Object is empty #objects #prototype #javascript #isempty With JavaScript, it can be difficult to check whether an object is empty. With Arrays, you can easily check with myArray.length, but on the other hand, objects do not work that way. The best way to check if an object is empty is by using a utility function like the one below. function isEmpty(obj) { for(var key in obj) { if(obj.hasOwnProperty(key)) return false; } return true; } So if you have an empty object, you can check whether it is empty by using the above function. var myObj = {}; // Empty Object if(isEmpty(myObj)) { // Object is empty (Would return true in this example) } else { // Object is NOT empty } Alternatively, you can write the isEmpty function on the Object prototype. Object.prototype.isEmpty = function() { for(var key in this) { if(this.hasOwnProperty(key)) return false; } return true; } Then you can easily check if the object is empty like so. var myObj = { myKey: "Some Value" } if(myObj.isEmpty()) { // Object is empty } else { // Object is NOT empty (would return false in this example) } Extending the object prototype is not the best thing to do as it can cause some browser issues and other issues with certain frameworks (it's also not always reliable in certain environments). The example I gave is pretty much framework agnostic although. This is one of those utility functions that will always be useful, especially if you deal with a lot of objects on a daily basis (like I do). Related protips: javascript foreach #objects #prototype #javascript #isempty Written by Kyle Ross Say Thanks Respond Related protips Alternatives to HMVC with Laravel 15.07K 0 PHP - Convert mixed array & objects recursively 13.9K 6 Immutable vs Mutable JAVA 10.74K 3 18 Responses Add your response { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2012-11-02 06:46:15 UTC", "text": " var isMyObjectEmpty = !Object.keys(myObject).length;", "upvoteCount": 11, "author": { "@type": "Person", "name": "Alexey Raspopov" }, "about": { "@type": "Article", "@id": "how-to-check-if-javascript-object-is-empty" } } avenger7x var isMyObjectEmpty = !Object.keys(myObject).length; over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2012-11-02 15:24:58 UTC", "text": "Nice tip. Seems like the Underscore.js implementation --\u003e\r\nhttp://documentcloud.github.com/underscore/#isEmpty\r\n\r\nJust that those guys are checking for Arrays and String in the same function like this:\r\n\r\n _.isEmpty = function(obj) {\r\n if (obj == null) return true;\r\n if (_.isArray(obj) || _.isString(obj)) return obj.length === 0;\r\n for (var key in obj) if (_.has(obj, key)) return false;\r\n return true;\r\n };", "upvoteCount": 2, "author": { "@type": "Person", "name": "Jorge Luis Rivera" }, "about": { "@type": "Article", "@id": "how-to-check-if-javascript-object-is-empty" } } develoser Nice tip. Seems like the Underscore.js implementation --> http://documentcloud.github.com/underscore/#isEmpty Just that those guys are checking for Arrays and String in the same function like this: _.isEmpty = function(obj) { if (obj == null) return true; if (_.isArray(obj) || _.isString(obj)) return obj.length === 0; for (var key in obj) if (_.has(obj, key)) return false; return true; }; over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2012-11-03 00:26:26 UTC", "text": "@avenger7x Yes, that certainly works although it is not supported in some older browsers such as Firefox \u003c 4 and IE \u003c 9. It's a new addition under ECMAScript 5.", "upvoteCount": 0, "author": { "@type": "Person", "name": "Kyle Ross" }, "about": { "@type": "Article", "@id": "how-to-check-if-javascript-object-is-empty" } } Kyle Ross @avenger7x Yes, that certainly works although it is not supported in some older browsers such as Firefox < 4 and IE < 9. It's a new addition under ECMAScript 5. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2012-11-03 00:26:26 UTC", "text": "@develoser Underscore is just one of those overly useful tools out there and I agree and suggest that others check it out. Thanks for you input!", "upvoteCount": 0, "author": { "@type": "Person", "name": "Kyle Ross" }, "about": { "@type": "Article", "@id": "how-to-check-if-javascript-object-is-empty" } } Kyle Ross @develoser Underscore is just one of those overly useful tools out there and I agree and suggest that others check it out. Thanks for you input! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-02-03 15:42:01 UTC", "text": "Hi, I'm wondering why the use of hasOwnProperty is required?\r\n\r\n function isEmpty(arg) {\r\n for (var item in arg) {\r\n return false;\r\n }\r\n return true;\r\n }\r\n", "upvoteCount": 0, "author": { "@type": "Person", "name": "Denis Jacquemin" }, "about": { "@type": "Article", "@id": "how-to-check-if-javascript-object-is-empty" } } denisjacquemin Hi, I'm wondering why the use of hasOwnProperty is required? function isEmpty(arg) { for (var item in arg) { return false; } return true; } over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-02-19 15:54:43 UTC", "text": "@denisjacquemin: historically, for(x in y) will show \"toString\" as a value of \"x\". using hasOwnProperty allows for skipping over \"built in\" or \"metadata\" properties, and just evaluate \"value\" properties.", "upvoteCount": 0, "author": { "@type": "Person", "name": "theGleep" }, "about": { "@type": "Article", "@id": "how-to-check-if-javascript-object-is-empty" } } thegleep @denisjacquemin: historically, for(x in y) will show "toString" as a value of "x". using hasOwnProperty allows for skipping over "built in" or "metadata" properties, and just evaluate "value" properties. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2017-05-16 10:37:02 UTC", "text": "If you don't want to copy-paste this all over your different repositories, you can also try [this NPM package][1] or [this Bit component][2].\r\n\r\nThey should work just fine and make it useable anywhere you need.\r\n\r\n\r\n [1]: https://www.npmjs.com/package/is-empty-object\r\n [2]: https://bitsrc.io/bit/utils/global/empty", "upvoteCount": 1, "author": { "@type": "Person", "name": "Codi" }, "about": { "@type": "Article", "@id": "how-to-check-if-javascript-object-is-empty" } } Codi If you don't want to copy-paste this all over your different repositories, you can also try this NPM package or this Bit component. They should work just fine and make it useable anywhere you need. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2018-03-31 12:48:31 UTC", "text": "```\r\nconst isEmpty = function (input) {\r\n if (typeof input === 'array') {\r\n return input.length === 0;\r\n }\r\n\r\n return !input || Object.keys(input).length === 0;\r\n}\r\n```", "upvoteCount": 0, "author": { "@type": "Person", "name": "pitter" }, "about": { "@type": "Article", "@id": "how-to-check-if-javascript-object-is-empty" } } pitter const isEmpty = function (input) { if (typeof input === 'array') { return input.length === 0; } return !input || Object.keys(input).length === 0; } over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2018-04-18 18:30:58 UTC", "text": "JSON.stringify(myObj) == \"{}\"", "upvoteCount": 0, "author": { "@type": "Person", "name": "maspai" }, "about": { "@type": "Article", "@id": "how-to-check-if-javascript-object-is-empty" } } maspai JSON.stringify(myObj) == "{}" over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2018-12-21 21:37:40 UTC", "text": "The Object.prototype.isEmpty approach shouldn't be used. \r\nI used that with jQuery and it made $.ajax failed.\r\nTook me more than an hour to solve it.", "upvoteCount": 0, "author": { "@type": "Person", "name": "dthung1602" }, "about": { "@type": "Article", "@id": "how-to-check-if-javascript-object-is-empty" } } dthung1602 The Object.prototype.isEmpty approach shouldn't be used. I used that with jQuery and it made $.ajax failed. Took me more than an hour to solve it. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2019-01-15 03:36:17 UTC", "text": "if(myObj.hasOwnProperty(key)) {\r\n // true;\r\n} else {\r\n // false\r\n}", "upvoteCount": 0, "author": { "@type": "Person", "name": "RagedPanda" }, "about": { "@type": "Article", "@id": "how-to-check-if-javascript-object-is-empty" } } RagedPanda if(myObj.hasOwnProperty(key)) { // true; } else { // false } over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2019-04-01 15:19:05 UTC", "text": "it doesn't work if it comes:\r\n\r\n```js\r\nlet obj2 = {\r\n [Symbol('name')]: 'alice'\r\n}\r\n\r\nlet obj3 = Object.defineProperty({}, 'name', {\r\n value: 'alice',\r\n enumerable: false\r\n})\r\n```\r\n\r\ni think we can use this:\r\n\r\n```js\r\nconst isEmptyObj = object =\u003e !Object.getOwnPropertySymbols(object).length \u0026\u0026 !Object.getOwnPropertyNames(object).length\r\n```\r\n", "upvoteCount": 0, "author": { "@type": "Person", "name": "oliveryoung" }, "about": { "@type": "Article", "@id": "how-to-check-if-javascript-object-is-empty" } } oliveryoung it doesn't work if it comes: let obj2 = { [Symbol('name')]: 'alice' } let obj3 = Object.defineProperty({}, 'name', { value: 'alice', enumerable: false }) i think we can use this: const isEmptyObj = object => !Object.getOwnPropertySymbols(object).length && !Object.getOwnPropertyNames(object).length over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2019-10-03 18:28:02 UTC", "text": "Why not to use [`_.isEmpty()`](https://lodash.com/docs/4.17.15#isEmpty) from the [lodash](https://lodash.com) library?", "upvoteCount": 0, "author": { "@type": "Person", "name": "cermakm" }, "about": { "@type": "Article", "@id": "how-to-check-if-javascript-object-is-empty" } } cermakm Why not to use _.isEmpty() from the lodash library? over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2022-07-22 19:38:39 UTC", "text": "thanks! I struggled with this for a very long time.", "upvoteCount": 0, "author": { "@type": "Person", "name": "DiegoLaskowski" }, "about": { "@type": "Article", "@id": "how-to-check-if-javascript-object-is-empty" } } DiegoLaskowski thanks! I struggled with this for a very long time. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2022-08-19 12:53:26 UTC", "text": "A lot of cool ways have been shown here. Thanks for the advice ;)", "upvoteCount": 0, "author": { "@type": "Person", "name": "AdrianSzewczyk" }, "about": { "@type": "Article", "@id": "how-to-check-if-javascript-object-is-empty" } } AdrianSzewczyk A lot of cool ways have been shown here. Thanks for the advice ;) over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2022-10-16 19:22:00 UTC", "text": "Thanks for the many ways to overcome the problem. It really came in handy.", "upvoteCount": 0, "author": { "@type": "Person", "name": "RyanHillier" }, "about": { "@type": "Article", "@id": "how-to-check-if-javascript-object-is-empty" } } RyanHillier Thanks for the many ways to overcome the problem. It really came in handy. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2023-07-23 00:40:50 UTC", "text": "Thx for imformation", "upvoteCount": 0, "author": { "@type": "Person", "name": "david setiawan" }, "about": { "@type": "Article", "@id": "how-to-check-if-javascript-object-is-empty" } } david setiawan Thx for imformation over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2024-04-14 11:53:30 UTC", "text": "How about\r\n\r\n```js\r\nfunction isEmpty(obj){\r\n return Object.keys(obj).length == 0\r\n}\r\n```\r\n\r\n?", "upvoteCount": 0, "author": { "@type": "Person", "name": "Joshua Moore" }, "about": { "@type": "Article", "@id": "how-to-check-if-javascript-object-is-empty" } } Joshua Moore How about function isEmpty(obj){ return Object.keys(obj).length == 0 } ? 10 months ago · Have a fresh tip? Share with Coderwall community! Post Post a tip Best #Objects Authors Kyle Ross 1.099M #objects #Javascript #SVN psycatham 14.96K #objects #Ruby on R'''
