title = "Stop / remove all Docker containers (Example)"
description = "A protip by fgrehm about lxc and docker."
full_description = '''{ "@context": "http://schema.org", "@type": "Article", "@id": "stop-remove-all-docker-containers", "author": { "@type": "Person", "name": "Fabio Rehm" }, "dateModified": "2024-09-30 01:22:59 UTC", "datePublished": "2024-09-30 01:22:59 UTC", "headline": "Stop / remove all Docker containers (Example)", "url": "/p/ewk0mq/stop-remove-all-docker-containers", "commentCount": 32, "keywords": "lxc, docker", "articleBody": "One liner to stop / remove all of [Docker](http://www.docker.io/) containers:\r\n\r\n docker stop $(docker ps -a -q)\r\n docker rm $(docker ps -a -q)\r\n\r\n\r\n\r\n\r\n", "description": "A protip by fgrehm about lxc and docker.", "publisher": { "@type": "Organization", "name": "Coderwall", "logo": { "@type": "ImageObject", "url": "/logo.png" }, "url": "https://coderwall.com/" }, "image": "/logo.png" } Last Updated: September 30, 2024 · 1.957M · fgrehm Stop / remove all Docker containers #lxc #docker One liner to stop / remove all of Docker containers: docker stop $(docker ps -a -q) docker rm $(docker ps -a -q) #lxc #docker Written by Fabio Rehm Say Thanks Respond Related protips Use private docker registry in OS-X 16.93K 0 Docker service discovery with skydns and skydock 2.948K 0 Linux containers #lxc 2.14K 0 32 Responses Add your response { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-01-27 20:59:40 UTC", "text": "My hard drive was full, total lockup, this was a saviour for me! thanks =D", "upvoteCount": 2, "author": { "@type": "Person", "name": "Koen Schmeets" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } vespakoen My hard drive was full, total lockup, this was a saviour for me! thanks =D over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-04-09 07:25:00 UTC", "text": "that's great. I needed to stop and rm all containers before removing an docker image.", "upvoteCount": 0, "author": { "@type": "Person", "name": "Sharipov Ruslan" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } sharipov-ru that's great. I needed to stop and rm all containers before removing an docker image. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-05-13 03:21:33 UTC", "text": "great command!", "upvoteCount": 0, "author": { "@type": "Person", "name": "timoy" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } timoy great command! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-08-01 06:37:38 UTC", "text": "Having bookmarked this immensely useful tip a while ago, the two-liner above :) can be now done in one line:\r\ndocker rm -f $(docker ps -a -q)\r\n\r\nAnd similar for all images:\r\ndocker rmi $(docker images -q)", "upvoteCount": 2, "author": { "@type": "Person", "name": "Zarko Hristovski" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } zarko-tg Having bookmarked this immensely useful tip a while ago, the two-liner above :) can be now done in one line: docker rm -f $(docker ps -a -q) And similar for all images: docker rmi $(docker images -q) over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-08-27 12:41:51 UTC", "text": "docker rm $(docker images -q) or docker rmi $(docker images -q)\r\n\r\nworks just fine, after you stopped them", "upvoteCount": 0, "author": { "@type": "Person", "name": "Stephane Paul" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } stephanep docker rm $(docker images -q) or docker rmi $(docker images -q) works just fine, after you stopped them over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-08-27 12:41:52 UTC", "text": "docker rm $(docker images -q) or docker rmi $(docker images -q)\r\n\r\nworks just fine, after you stopped them", "upvoteCount": 0, "author": { "@type": "Person", "name": "Stephane Paul" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } stephanep docker rm $(docker images -q) or docker rmi $(docker images -q) works just fine, after you stopped them over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-08-29 05:16:44 UTC", "text": "sudo docker rm $(sudo docker ps -a -q)\r\n\r\nIn case of error message Get http:///var/run/docker.sock/v1.14/containers/json?all=1: dial unix /var/run/docker.sock: permission denied", "upvoteCount": 1, "author": { "@type": "Person", "name": "Peter Reginald" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } preginald sudo docker rm $(sudo docker ps -a -q) In case of error message Get http:///var/run/docker.sock/v1.14/containers/json?all=1: dial unix /var/run/docker.sock: permission denied over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-09-29 18:50:01 UTC", "text": "I would add the -v flag:\r\ndocker rm -v $(docker ps -a -q)\r\nelse volumes will remain on the hard drive eating up space. Of course, be sure you want to delete your volumes and don't accidently delete data containers.", "upvoteCount": 1, "author": { "@type": "Person", "name": "Nicolas Mommaerts" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } dfuse I would add the -v flag: docker rm -v $(docker ps -a -q) else volumes will remain on the hard drive eating up space. Of course, be sure you want to delete your volumes and don't accidently delete data containers. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-10-04 06:43:14 UTC", "text": "thanks!", "upvoteCount": 0, "author": { "@type": "Person", "name": "Drew Miller" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } xer0x thanks! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-10-29 11:35:18 UTC", "text": "Thanks! Fabulous!", "upvoteCount": 0, "author": { "@type": "Person", "name": "JoongSeob Vito Kim" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } dorajistyle Thanks! Fabulous! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-11-15 13:56:48 UTC", "text": "To only stop exited containers and delete only non-tagged images.:\r\n```\r\ndocker ps --filter 'status=Exited' -a | xargs docker stop\r\ndocker images --filter \"dangling=true\" -q | xargs docker rmi \r\n```", "upvoteCount": 0, "author": { "@type": "Person", "name": "Hippie Hacker" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } hh To only stop exited containers and delete only non-tagged images.: docker ps --filter 'status=Exited' -a | xargs docker stop docker images --filter "dangling=true" -q | xargs docker rmi over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2015-01-10 10:15:09 UTC", "text": "Thank you. Very helpful!", "upvoteCount": 0, "author": { "@type": "Person", "name": "Simon Martinelli" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } simas_ch Thank you. Very helpful! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2015-05-12 23:13:47 UTC", "text": "Remove all containers that aren't currently running: \r\ndocker rm $(docker ps -a -q -f \"status=exited*\")", "upvoteCount": 0, "author": { "@type": "Person", "name": "August Kleimo" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } augustkleimo Remove all containers that aren't currently running: docker rm $(docker ps -a -q -f "status=exited*") over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2015-05-26 20:37:15 UTC", "text": "For anyone having trouble make sure you sudo the 2nd docker command:\r\n\r\nsudo docker rm -f $(sudo docker ps -a -q)", "upvoteCount": 0, "author": { "@type": "Person", "name": "Sam" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } lightmanca For anyone having trouble make sure you sudo the 2nd docker command: sudo docker rm -f $(sudo docker ps -a -q) over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2015-08-27 01:08:43 UTC", "text": "sudo docker rm -f -v $(sudo docker ps -a -q)\r\n\r\nif not the volumes will not be delete !!! (like if you are using a mysql docker image)\r\nand all the volumes will be orphans !", "upvoteCount": 0, "author": { "@type": "Person", "name": "Regis leray" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } regis-leray sudo docker rm -f -v $(sudo docker ps -a -q) if not the volumes will not be delete !!! (like if you are using a mysql docker image) and all the volumes will be orphans ! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2015-09-11 12:01:19 UTC", "text": "Just a reminder - this command cannot be used via ssh like this:\r\n`ssh server@127.0.0.1 \"docker stop $(docker ps -a)\"`\r\nBecause `$(docker ps -a)` will be executed on your local machine, not on server.", "upvoteCount": 0, "author": { "@type": "Person", "name": "Pavel Lobashov" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } shockwavenn Just a reminder - this command cannot be used via ssh like this: ssh server@127.0.0.1 "docker stop $(docker ps -a)" Because $(docker ps -a) will be executed on your local machine, not on server. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2015-10-21 20:28:49 UTC", "text": "The below removes all the Containers. \r\n\r\nfor f in `docker ps -a -q`; do docker rm $f; done\r\n\r\n", "upvoteCount": 0, "author": { "@type": "Person", "name": "avinb" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } avinb The below removes all the Containers. for f in docker ps -a -q; do docker rm $f; done over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2015-10-29 18:34:24 UTC", "text": "Helped me a lot, thanks =D", "upvoteCount": 0, "author": { "@type": "Person", "name": " Bordeaux SEO Expert" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } seoshake Helped me a lot, thanks =D over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2015-12-12 19:44:20 UTC", "text": "You can use this as a bash alias:\r\n```\r\ndstop() { docker stop $(docker ps -a -q); }\r\nalias dstop=dstop\r\n```", "upvoteCount": 1, "author": { "@type": "Person", "name": "Pavel Gavlík" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } pavelgavlik You can use this as a bash alias: dstop() { docker stop $(docker ps -a -q); } alias dstop=dstop over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2016-05-21 09:37:46 UTC", "text": "With this, I can also delete the volume what container used to be mapped directly :) *if you didn't configure your local directory\r\n\r\nThanks man!!! I really appreciate it!!", "upvoteCount": 0, "author": { "@type": "Person", "name": "Mochamad Iqbal Dwi Cahyo" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } mochadwi With this, I can also delete the volume what container used to be mapped directly :) *if you didn't configure your local directory Thanks man!!! I really appreciate it!! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2016-05-27 11:00:18 UTC", "text": "Great Thanks", "upvoteCount": 0, "author": { "@type": "Person", "name": "ZamanOof" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } ZamanOof Great Thanks over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2016-09-05 02:14:27 UTC", "text": "short and easy, thanks!", "upvoteCount": 0, "author": { "@type": "Person", "name": "benjamin658" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } benjamin658 short and easy, thanks! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2016-09-11 22:23:42 UTC", "text": "//remove all containers with keyword *cluster*\r\ndocker rm $(docker ps -a |grep cluster|awk '{print $1;}')\r\n\r\n//remove all images with keyword *cluster*\r\ndocker rmi $(docker images |grep cluster|awk '{print $3;}')", "upvoteCount": 0, "author": { "@type": "Person", "name": "Aaron Phillips" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } Aaron Phillips //remove all containers with keyword cluster docker rm $(docker ps -a |grep cluster|awk '{print $1;}') //remove all images with keyword cluster docker rmi $(docker images |grep cluster|awk '{print $3;}') over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2017-01-19 22:28:45 UTC", "text": "If you want to stop them faster:\r\n\r\n`docker ps -a -q | xargs -n 1 -P 8 -I {} docker stop {}`", "upvoteCount": 0, "author": { "@type": "Person", "name": "josiah" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } josiah If you want to stop them faster: docker ps -a -q | xargs -n 1 -P 8 -I {} docker stop {} over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2017-02-01 12:15:12 UTC", "text": " With the latest docker 1.13, you can manage the container deletion in more efficient way. Check out this thread for the latest docker features for cleaning up images and containers http://discuss.devopscube.com/t/how-to-delete-all-none-untagged-and-dangling-docker-containers-and-images/23", "upvoteCount": 0, "author": { "@type": "Person", "name": "skillslane" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } skillslane With the latest docker 1.13, you can manage the container deletion in more efficient way. Check out this thread for the latest docker features for cleaning up images and containers http://discuss.devopscube.com/t/how-to-delete-all-none-untagged-and-dangling-docker-containers-and-images/23 over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2017-12-05 23:00:55 UTC", "text": "thanks! good work", "upvoteCount": 0, "author": { "@type": "Person", "name": "martin skrut" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } martin skrut thanks! good work over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2018-06-11 23:58:45 UTC", "text": "In Powershell, it's `docker stop @(docker ps -a -q)`. ", "upvoteCount": 0, "author": { "@type": "Person", "name": "lmatter" }, "about": { "@type": "Article", "@id": "stop-remove-all-docker-containers" } } lmatter In Powershell, it's docker stop @(docker ps -a -q). over'''
