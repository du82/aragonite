full_description = '''{ "@context": "http://schema.org", "@type": "Article", "@id": "javascript-iterate-through-object-keys-and-values", "author": { "@type": "Person", "name": "Steven Iseki" }, "dateModified": "2023-06-26 13:19:33 UTC", "datePublished": "2023-06-26 13:19:33 UTC", "headline": "JavaScript iterate through object keys and values (Example)", "url": "/p/_kakfa/javascript-iterate-through-object-keys-and-values", "commentCount": 9, "keywords": "jquery, javascript", "articleBody": "I just wanted to keep this for reference how to quickly loop through an objects keys and values, if needed. I also included an implementation using jQuery .each\r\n\r\nNote the limitations of using a for...in loop, as it iterates over the properties of an object in an arbitrary order, and needs to use .hasOwnProperty, unless inherited properties want to be shown.\r\n\r\n\u003cb\u003eShow objects\u003c/b\u003e\r\n\r\n\r\n function showObject(obj) {\r\n var result = \"\";\r\n for (var p in obj) {\r\n if( obj.hasOwnProperty(p) ) {\r\n result += p + \" , \" + obj[p] + \"\\n\";\r\n } \r\n } \r\n return result;\r\n }\r\n\r\n\u003cb\u003eShow objects with .each\u003c/b\u003e\r\n\r\n function showObjectjQuery(obj) {\r\n var result = \"\";\r\n $.each(obj, function(k, v) {\r\n result += k + \" , \" + v + \"\\n\";\r\n });\r\n return result;\r\n }\r\n\r\n\u003cb\u003eTest it out\u003c/b\u003e\r\n\r\n var test = { \r\n 'type' : 'news', \r\n 'name' : 'article1' \r\n };\r\n\r\n showObject(test); \r\n // type , news name , article1\r\n showObjectjQuery(test); \r\n // type , news name , article1\r\n\r\n\u003cb\u003eA more useful example calling a function on the object keys and values\u003c/b\u003e\r\n\r\nThis approach of looping through keys and values in an object can be used to perform more useful operations on the object, for instance the method could call a function passed in on each of the values. An example of this is in the foIn method in mout.js which iterates through the object keys and values calling the function passed in. \r\n \r\n function forIn(obj, fn, thisObj){\r\n var key, i = 0;\r\n for (key in obj) {\r\n if (exec(fn, obj, key, thisObj) === false) {\r\n break;\r\n }\r\n }\r\n function exec(fn, obj, key, thisObj){\r\n return fn.call(thisObj, obj[key], key, obj);\r\n }\r\n return forIn;\r\n });\r\n\r\n\u003cb\u003eExample use of forIn\u003c/b\u003e\r\n\r\n function Foo(){\r\n this.foo = 1;\r\n this.bar = 2;\r\n }\r\n var obj = new Foo();\r\n var result = 0;\r\n var keys = [];\r\n \r\n forIn(obj, function(val, key, o){\r\n result += val;\r\n keys.push(key);\r\n });\r\n console.log(result); // 3\r\n console.log(keys); // ['foo', 'bar']\r\n\r\n####Related protips:\r\n[javascript foreach](https://coderwall.com/p/kvzbpa/don-t-use-array-foreach-use-for-instead)\r\n\r\n", "description": "A protip by steveniseki about jquery and javascript.", "publisher": { "@type": "Organization", "name": "Coderwall", "logo": { "@type": "ImageObject", "url": "/logo.png" }, "url": "https://coderwall.com/" }, "image": "/logo.png" } Last Updated: June 26, 2023 · 591.7K · steveniseki JavaScript iterate through object keys and values #jquery #javascript I just wanted to keep this for reference how to quickly loop through an objects keys and values, if needed. I also included an implementation using jQuery .each Note the limitations of using a for...in loop, as it iterates over the properties of an object in an arbitrary order, and needs to use .hasOwnProperty, unless inherited properties want to be shown. <b>Show objects</b> function showObject(obj) { var result = ""; for (var p in obj) { if( obj.hasOwnProperty(p) ) { result += p + " , " + obj[p] + "\n"; } } return result; } <b>Show objects with .each</b> function showObjectjQuery(obj) { var result = ""; $.each(obj, function(k, v) { result += k + " , " + v + "\n"; }); return result; } <b>Test it out</b> var test = { 'type' : 'news', 'name' : 'article1' }; showObject(test); // type , news name , article1 showObjectjQuery(test); // type , news name , article1 <b>A more useful example calling a function on the object keys and values</b> This approach of looping through keys and values in an object can be used to perform more useful operations on the object, for instance the method could call a function passed in on each of the values. An example of this is in the foIn method in mout.js which iterates through the object keys and values calling the function passed in. function forIn(obj, fn, thisObj){ var key, i = 0; for (key in obj) { if (exec(fn, obj, key, thisObj) === false) { break; } } function exec(fn, obj, key, thisObj){ return fn.call(thisObj, obj[key], key, obj); } return forIn; }); <b>Example use of forIn</b> function Foo(){ this.foo = 1; this.bar = 2; } var obj = new Foo(); var result = 0; var keys = []; forIn(obj, function(val, key, o){ result += val; keys.push(key); }); console.log(result); // 3 console.log(keys); // ['foo', 'bar'] Related protips: javascript foreach #jquery #javascript Written by Steven Iseki Say Thanks Respond Related protips jQuery .find and .closest are your best friends 492.4K 2 jQuery: When to use $(document).ready() and when $(window).load() 226K 4 creating DOM elements with jQuery in a more elegant way 144.2K 13 9 Responses Add your response { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-06-04 09:37:47 UTC", "text": "Why aren’t you passing the corresponding object to `JSON.stringify`?", "upvoteCount": 3, "author": { "@type": "Person", "name": "Steffen Bruchmann" }, "about": { "@type": "Article", "@id": "javascript-iterate-through-object-keys-and-values" } } sbruchmann Why aren’t you passing the corresponding object to JSON.stringify? over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-06-04 23:53:49 UTC", "text": "The showObject method here is not really useful in itself, as we could use JSON.stringify() to acheive this result. I was just putting this in as a reference as to how to iterate through all keys and values in an object. I will rename the pro tip to that. \r\n\r\nIt could be useful to use this approach to create an array of all the keys in an object and pass that back, or we could pass in a function to a method like this which iterates through the keys and values, and calls the function for specific values.", "upvoteCount": 0, "author": { "@type": "Person", "name": "Steven Iseki" }, "about": { "@type": "Article", "@id": "javascript-iterate-through-object-keys-and-values" } } steveniseki The showObject method here is not really useful in itself, as we could use JSON.stringify() to acheive this result. I was just putting this in as a reference as to how to iterate through all keys and values in an object. I will rename the pro tip to that. It could be useful to use this approach to create an array of all the keys in an object and pass that back, or we could pass in a function to a method like this which iterates through the keys and values, and calls the function for specific values. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-06-05 01:15:19 UTC", "text": "There’s also `Object.keys` in Node.js and _modern_ browsers. See [MDN](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/keys) for details.", "upvoteCount": 2, "author": { "@type": "Person", "name": "Steffen Bruchmann" }, "about": { "@type": "Article", "@id": "javascript-iterate-through-object-keys-and-values" } } sbruchmann There’s also Object.keys in Node.js and modern browsers. See MDN for details. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-10-27 11:12:35 UTC", "text": "And for compatibility with all browsers before using Object.keys() call this:\r\n\r\n\tif (!Object.keys) Object.keys = function(o) {\r\n\t\tif (o !== Object(o))\r\n\t\t\tthrow new TypeError('Object.keys called on a non-object');\r\n\t\tvar k = [],\r\n\t\t\tp;\r\n\t\tfor (p in o)\r\n\t\t\tif (Object.prototype.hasOwnProperty.call(o, p)) k.push(p);\r\n\t\treturn k;\r\n\t}", "upvoteCount": 0, "author": { "@type": "Person", "name": "kreso" }, "about": { "@type": "Article", "@id": "javascript-iterate-through-object-keys-and-values" } } Kresimir Pendic And for compatibility with all browsers before using Object.keys() call this: if (!Object.keys) Object.keys = function(o) { if (o !== Object(o)) throw new TypeError('Object.keys called on a non-object'); var k = [], p; for (p in o) if (Object.prototype.hasOwnProperty.call(o, p)) k.push(p); return k; } over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2016-02-28 08:45:01 UTC", "text": "I find this useful for me:\r\n\r\n```\r\nObjectKit.forEach = function Object_forEach (object, callback) {\r\n for (var key in object) {\r\n if (object.hasOwnProperty(key)) callback(key, object[key]);\r\n }\r\n};\r\n```", "upvoteCount": 0, "author": { "@type": "Person", "name": "Pavel" }, "about": { "@type": "Article", "@id": "javascript-iterate-through-object-keys-and-values" } } Paxa I find this useful for me: ObjectKit.forEach = function Object_forEach (object, callback) { for (var key in object) { if (object.hasOwnProperty(key)) callback(key, object[key]); } }; over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2021-01-06 10:33:17 UTC", "text": "Looks Good", "upvoteCount": 0, "author": { "@type": "Person", "name": "wefocusoncare" }, "about": { "@type": "Article", "@id": "javascript-iterate-through-object-keys-and-values" } } wefocusoncare Looks Good over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2021-03-10 14:19:15 UTC", "text": "Sufficiently informative", "upvoteCount": 0, "author": { "@type": "Person", "name": "RandyGelman" }, "about": { "@type": "Article", "@id": "javascript-iterate-through-object-keys-and-values" } } RandyGelman Sufficiently informative over 1 year ago · { "@c