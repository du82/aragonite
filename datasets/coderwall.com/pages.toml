title = "Basic Vim commands - For getting started (Example)"
description = "A protip by shiva about vim, unix, vi, and commands."
full_description = '''{ "@context": "http://schema.org", "@type": "Article", "@id": "basic-vim-commands-for-getting-started", "author": { "@type": "Person", "name": "shiva kumar" }, "dateModified": "2024-07-25 10:02:28 UTC", "datePublished": "2024-07-25 10:02:28 UTC", "headline": "Basic Vim commands - For getting started (Example)", "url": "/p/adv71w/basic-vim-commands-for-getting-started", "commentCount": 11, "keywords": "vim, unix, vi, commands", "articleBody": "Started learning to use Vim. Some simple commands to get started. \r\n##Vim has two modes.\r\n###1. Insert mode (Where you can just type like normal text editor. Press i for insert mode)\r\n###2. Command mode (Where you give commands to the editor to get things done . Press ESC for command mode)\r\n\r\nMost of them below are in command mode\r\n\r\n- x - to delete the unwanted character\r\n- u - to undo the last the command and U to undo the whole line\r\n- CTRL-R to redo \r\n- A - to append text at the end\r\n- :wq - to save and exit\r\n- :q! - to trash all changes\r\n- dw - move the cursor to the beginning of the word to delete that word\r\n- 2w - to move the cursor two words forward.\r\n- 3e - to move the cursor to the end of the third word forward.\r\n- 0 (zero) to move to the start of the line.\r\n- d2w - which deletes 2 words .. number can be changed for deleting the number of consecutive words like d3w\r\n- dd to delete the line and 2dd to delete to line .number can be changed for deleting the number of consecutive words\r\n\r\nThe format for a change command is: operator [number] motion\r\n-operator - is what to do, such as d for delete\r\n- [number] - is an optional count to repeat the motion\r\n- motion - moves over the text to operate on, such as w (word),\r\n $ (to the end of line), etc.\r\n\r\n- p - puts the previously deleted text after the cursor(Type dd to delete the line and store it in a Vim register. and p to put the line)\r\n\r\n- r - to replace the letter e.g press re to replace the letter with e\r\n\r\n- ce - to change until the end of a word (place the cursor on the u in lubw it will delete ubw )\r\n- ce - deletes the word and places you in Insert mode\r\n\r\n- G - to move you to the bottom of the file.\r\n\r\n- gg - to move you to the start of the file.\r\nType the number of the line you were on and then G\r\n- % to find a matching ),], or }\r\n\r\n- :s/old/new/g to substitute 'new' for 'old' where g is globally\r\n\r\n- / backward search n to find the next occurrence and N to search in opposite direction\r\n- ? forward search\r\n- :! to run the shell commands like :!dir, :!ls\r\n- :w - TEST (where TEST is the filename you chose.) . Save the file \r\n- v - starts visual mode for selecting the lines and you can perform operation on that like d delete \r\n- :r - Filename will insert the content into the current file\r\n- R - to replace more than one character\r\n- y - operator to copy text using v visual mode and p to paste it\r\n- yw - (copy)yanks one word\r\n\r\n- o - opens a line below the cursor and start Insert mode.\r\n- O - opens a line above the cursor.\r\n- a - inserts text after the cursor.\r\n- A - inserts text after the end of the line.\r\n- e - command moves to the end of a word.\r\n- y - operator yanks (copies) text, p puts (pastes) it.\r\n- R - enters Replace mode until \u003cESC\u003e is pressed.\r\n\r\n- ctrl-w to jump from one window to another\r\n\r\ntype a command :e and press ctrl+D to list all the command name starts with :e and press tab to complete the command\r\n\r\n\r\n\r\n####Related protips:\r\n[Basic Vim commands - For getting started](https://coderwall.com/p/adv71w/basic-vim-commands-for-getting-started)\r\n\r\n", "description": "A protip by shiva about vim, unix, vi, and commands.", "publisher": { "@type": "Organization", "name": "Coderwall", "logo": { "@type": "ImageObject", "url": "/logo.png" }, "url": "https://coderwall.com/" }, "image": "/logo.png" } Last Updated: July 25, 2024 · 1.217M · shiva Basic Vim commands - For getting started #vim #unix #vi #commands Started learning to use Vim. Some simple commands to get started. Vim has two modes. 1. Insert mode (Where you can just type like normal text editor. Press i for insert mode) 2. Command mode (Where you give commands to the editor to get things done . Press ESC for command mode) Most of them below are in command mode x - to delete the unwanted character u - to undo the last the command and U to undo the whole line CTRL-R to redo A - to append text at the end :wq - to save and exit :q! - to trash all changes dw - move the cursor to the beginning of the word to delete that word 2w - to move the cursor two words forward. 3e - to move the cursor to the end of the third word forward. 0 (zero) to move to the start of the line. d2w - which deletes 2 words .. number can be changed for deleting the number of consecutive words like d3w dd to delete the line and 2dd to delete to line .number can be changed for deleting the number of consecutive words The format for a change command is: operator [number] motion -operator - is what to do, such as d for delete - [number] - is an optional count to repeat the motion - motion - moves over the text to operate on, such as w (word), $ (to the end of line), etc. p - puts the previously deleted text after the cursor(Type dd to delete the line and store it in a Vim register. and p to put the line) r - to replace the letter e.g press re to replace the letter with e ce - to change until the end of a word (place the cursor on the u in lubw it will delete ubw ) ce - deletes the word and places you in Insert mode G - to move you to the bottom of the file. gg - to move you to the start of the file. Type the number of the line you were on and then G % to find a matching ),], or } :s/old/new/g to substitute 'new' for 'old' where g is globally / backward search n to find the next occurrence and N to search in opposite direction ? forward search :! to run the shell commands like :!dir, :!ls :w - TEST (where TEST is the filename you chose.) . Save the file v - starts visual mode for selecting the lines and you can perform operation on that like d delete :r - Filename will insert the content into the current file R - to replace more than one character y - operator to copy text using v visual mode and p to paste it yw - (copy)yanks one word o - opens a line below the cursor and start Insert mode. O - opens a line above the cursor. a - inserts text after the cursor. A - inserts text after the end of the line. e - command moves to the end of a word. y - operator yanks (copies) text, p puts (pastes) it. R - enters Replace mode until <ESC> is pressed. ctrl-w to jump from one window to another type a command :e and press ctrl+D to list all the command name starts with :e and press tab to complete the command Related protips: Basic Vim commands - For getting started #vim #unix #vi #commands Written by shiva kumar Say Thanks Respond Related protips Format JSON in vim 198.7K 15 Setup Vim, Powerline and iTerm2 on Mac OS X 125.6K 7 Automatically set paste mode in Vim when pasting in insert mode 81.51K 5 11 Responses Add your response { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-07-05 11:54:16 UTC", "text": "Also nice is `:xa` which save and quit all files. In case to use it as `ZZ` (save and quit) I have mapped some more:\r\n\r\n map ZX :cq \" quit and return error (helpful when using Vim with Git)\r\n map ZA :qa \" quit all buffers\r\n map ZS :xa \" quit and save all buffers ", "upvoteCount": 5, "author": { "@type": "Person", "name": "Łukasz Niemier" }, "about": { "@type": "Article", "@id": "basic-vim-commands-for-getting-started" } } hauleth Also nice is :xa which save and quit all files. In case to use it as ZZ (save and quit) I have mapped some more: map ZX :cq " quit and return error (helpful when using Vim with Git) map ZA :qa " quit all buffers map ZS :xa " quit and save all buffers over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-07-05 12:54:42 UTC", "text": "Nice .. Thanks @hauleth :)", "upvoteCount": 1, "author": { "@type": "Person", "name": "shiva kumar" }, "about": { "@type": "Article", "@id": "basic-vim-commands-for-getting-started" } } shiva Nice .. Thanks @hauleth :) over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-07-08 10:53:25 UTC", "text": "For beginners/intermediate: [Vim Revisited](http://mislav.uniqpath.com/2011/12/vim-revisited/) is my article where I present similar information but in a more structured format.", "upvoteCount": 2, "author": { "@type": "Person", "name": "Mislav Marohnić" }, "about": { "@type": "Article", "@id": "basic-vim-commands-for-getting-started" } } mislav For beginners/intermediate: Vim Revisited is my article where I present similar information but in a more structured format. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-07-08 10:59:03 UTC", "text": "@mislav i think the links is broken \r\n", "upvoteCount": 1, "author": { "@type": "Person", "name": "shiva kumar" }, "about": { "@type": "Article", "@id": "basic-vim-commands-for-getting-started" } } shiva @mislav i think the links is broken over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-07-08 11:00:10 UTC", "text": "Thanks, bad paste. Now fixed", "upvoteCount": 1, "author": { "@type": "Person", "name": "Mislav Marohnić" }, "about": { "@type": "Article", "@id": "basic-vim-commands-for-getting-started" } } mislav Thanks, bad paste. Now fixed over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-07-09 22:24:05 UTC", "text": "There's also :x, which contextually saves the current document if changes have been made and exits, or simply exits if no changes have been made. Equivalent to :wq", "upvoteCount": 2, "author": { "@type": "Person", "name": "Cannon Lewis" }, "about": { "@type": 