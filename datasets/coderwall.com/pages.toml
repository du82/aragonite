["https://coderwall.com/p/euwpig/a-better-git-log"]
title = "A better git log (Example)"
description = "A protip by filipekiss about color, aliases, log, alias, and git."
full_description = '''{ "@context": "http://schema.org", "@type": "Article", "@id": "a-better-git-log", "author": { "@type": "Person", "name": "Filipe Kiss" }, "dateModified": "2024-04-30 21:39:18 UTC", "datePublished": "2024-04-30 21:39:18 UTC", "headline": "A better git log (Example)", "url": "/p/euwpig/a-better-git-log", "commentCount": 50, "keywords": "color, aliases, log, alias", "articleBody": "So, are you tired of this old and bored *git log* screen?\r\n\r\n[![Picture](https://coderwall-assets-0.s3.amazonaws.com/uploads/picture/file/90/1._git_log__less_.jpg)](http://i.imgur.com/AwZKW.jpg)\r\n\r\nHow about this one, instead?\r\n\r\n[![Picture](https://coderwall-assets-0.s3.amazonaws.com/uploads/picture/file/91/1._git_lg__git_.jpg)](http://i.imgur.com/tSgaU.jpg)\r\n\r\nIt's simple. Just type in:\r\n\r\n git log --graph --pretty=format:'%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr) %C(bold blue)\u003c%an\u003e%Creset' --abbrev-commit\r\n\r\nI guess that's a bit too long, eh? Let's just make an alias. Copy and paste the line below on your terminal:\r\n\r\n git config --global alias.lg \"log --color --graph --pretty=format:'%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr) %C(bold blue)\u003c%an\u003e%Creset' --abbrev-commit\"\r\n\r\nAnd every time you need to see your log, just type in\r\n\r\n git lg\r\n\r\nOr, if you want to see the lines that changed\r\n\r\n git lg -p\r\n\r\n[![Picture](https://coderwall-assets-0.s3.amazonaws.com/uploads/picture/file/92/1._filipekiss_Metagross____Documents_projects_Coderwall-iOS__zsh_.jpg)](http://i.imgur.com/WOakP.jpg)\r\n\r\nHope you like it :)\r\n\r\n**PS: It seems that there's no way to view larger images, so I've linked bigger versions of them on the tip. Just click the image. Thanks to @basus(http://www.twitter.com/basus) for the note**\r\n\r\n**Update: As some people were reporting, the `git lg -p` command wasn't working. As pointed out by the user *universal_property* at reddit, removing the -- at the end made it work.** \r\n\r\nUpdate 2 (by @cervedin): I would suggest changing %cr to %ar as commit dates change when rebasing\r\n\r\n", "description": "A protip by filipekiss about color, aliases, log, alias, and git.", "publisher": { "@type": "Organization", "name": "Coderwall", "logo": { "@type": "ImageObject", "url": "/logo.png" }, "url": "https://coderwall.com/" }, "image": "/logo.png" } Last Updated: April 30, 2024 · 680.4K · filipekiss A better git log #color #aliases #log #alias #git So, are you tired of this old and bored git log screen? How about this one, instead? It's simple. Just type in: git log --graph --pretty=format:'%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr) %C(bold blue)<%an>%Creset' --abbrev-commit I guess that's a bit too long, eh? Let's just make an alias. Copy and paste the line below on your terminal: git config --global alias.lg "log --color --graph --pretty=format:'%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr) %C(bold blue)<%an>%Creset' --abbrev-commit" And every time you need to see your log, just type in git lg Or, if you want to see the lines that changed git lg -p Hope you like it :) PS: It seems that there's no way to view larger images, so I've linked bigger versions of them on the tip. Just click the image. Thanks to @basus(http://www.twitter.com/basus) for the note Update: As some people were reporting, the git lg -p command wasn't working. As pointed out by the user universal_property at reddit, removing the -- at the end made it work. Update 2 (by @cervedin): I would suggest changing %cr to %ar as commit dates change when rebasing #color #aliases #log #alias #git Written by Filipe Kiss Say Thanks Respond Related protips IOS customized activity indicator with Swift 136.4K 6 IOS UI colors with hex values in swfit 22.43K 1 Flat UI Color Palette for Inkscape / Gimp 15.09K 3 50 Responses Add your response { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2012-10-24 16:04:15 UTC", "text": "This doesn't work for individual files", "upvoteCount": 0, "author": { "@type": "Person", "name": "Jonathan Channon" }, "about": { "@type": "Article", "@id": "a-better-git-log" } } jchannon This doesn't work for individual files over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2012-12-07 02:01:04 UTC", "text": "@askjuise Thank. I've fixed. :)", "upvoteCount": 0, "author": { "@type": "Person", "name": "Filipe Kiss" }, "about": { "@type": "Article", "@id": "a-better-git-log" } } filipekiss @askjuise Thank. I've fixed. :) over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-01-16 21:16:36 UTC", "text": "You guys can try this one : \r\n\r\n`git config --global alias.lg \"log --graph --pretty=format:'%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr) %C(bold blue)\u003c%an\u003e%Creset' --abbrev-commit --date=relative\"`\r\n\r\nthis will:\r\n-one commit per line\r\n\r\n-show graph of commits\r\n\r\n-abbreviated commit IDs\r\n\r\n-dates relative to now\r\n\r\n-show commit references (like `git log --decorate`)\r\n\r\n-lots of colour\r\n\r\n-show author of the commit", "upvoteCount": 20, "author": { "@type": "Person", "name": "Patryk Małek" }, "about": { "@type": "Article", "@id": "a-better-git-log" } } lordmonkey You guys can try this one : git config --global alias.lg "log --graph --pretty=format:'%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr) %C(bold blue)<%an>%Creset' --abbrev-commit --date=relative" this will: -one commit per line -show graph of commits -abbreviated commit IDs -dates relative to now -show commit references (like git log --decorate) -lots of colour -show author of the commit over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-01-31 12:21:49 UTC", "text": "Cool Filipe! Thanks!", "upvoteCount": 0, "author": { "@type": "Person", "name": "Sergi Gracia" }, "about": { "@type": "Article", "@id": "a-better-git-log" } } sergigracia Cool Filipe! Thanks! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-03-09 07:16:09 UTC", "text": "Great Filipe! Thanks :)", "upvoteCount": 0, "author": { "@type": "Person", "name": "Ashish Kumar Singh" }, "about": { "@type": "Article", "@id": "a-better-git-log" } } ashish Great Filipe! Thanks :) over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-03-15 14:29:47 UTC", "text": "Very nice, thanks man", "upvoteCount": 0, "author": { "@type": "Person", "name": "Matt Creenan" }, "about": { "@type": "Article", "@id": "a-better-git-log" } } mcreenan Very nice, thanks man over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-03-15 15:40:48 UTC", "text": "thats amazing. thanks!", "upvoteCount": 0, "author": { "@type": "Person", "name": "Rajiv Ramroop" }, "about": { "@type": "Article", "@id": "a-better-git-log" } } ibevamp thats amazing. thanks! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-03-26 10:17:03 UTC", "text": "Thanks man! For copy-pasting change-logs, here's an ascii friendly version:\r\n\r\n git log --graph --pretty=format:'%h -%d %s (%cr) \u003c%an\u003e' --abbrev-commit\r\n\r\n...and the alias:\r\n\r\n git config --global alias.lg-ascii \"log --graph --pretty=format:'%h -%d %s (%cr) \u003c%an\u003e' --abbrev-commit\"", "upvoteCount": 1, "author": { "@type": "Person", "name": "benjaoming" }, "about": { "@type": "Article", "@id": "a-better-git-log" } } benjaoming Thanks man! For copy-pasting change-logs, here's an ascii friendly version: git log --graph --pretty=format:'%h -%d %s (%cr) <%an>' --abbrev-commit ...and the alias: git config --global alias.lg-ascii "log --graph --pretty=format:'%h -%d %s (%cr) <%an>' --abbrev-commit" over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-06-07 11:02:48 UTC", "text": "[alias]\r\n lg = !tig\r\n\r\ngoogle \"tig\" for more info\r\n", "upvoteCount": 3, "author": { "@type": "Person", "name": "Andrei Lisnic" }, "about": { "@type": "Article", "@id": "a-better-git-log" } } alisnic [alias] lg = !tig google "tig" for more info over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-06-07 13:08:18 UTC", "text": "This is great, thanks!\r\n\r\nRather than a git alias, I opted for a bash alias by adding this line to my `.bash_profile`:\r\n`alias gitlog=\"git log --graph --pretty=format:'%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr) %C(bold blue)\u003c%an\u003e%Creset' --abbrev-commit\"`\r\n\r\nNow I have `gitlog` and `gitlog -p`.\r\nThanks again!", "upvoteCount": 1, "author": { "@type": "Person", "name": "James Chevalier" }, "about": { "@type": "Article", "@id": "a-better-git-log" } } jameschevalier This is great, thanks! Rather than a git alias, I opted for a bash alias by adding this line to my .bash_profile: alias gitlog="git log --graph --pretty=format:'%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr) %C(bold blue)<%an>%Creset' --abbrev-commit" Now I have gitlog and gitlog -p. Thanks again! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-06-07 13:41:03 UTC", "text": "git log | tig\r\n\r\nhttps://github.com/jonas/tig", "upvoteCount": 7, "author": { "@type": "Person", "name": "Santiago Rodriguez" }, "about": { "@type": "Article", "@id": "a-better-git-log" } } sanrodari git log | tig https://github.com/jonas/tig over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-06-07 13:55:24 UTC", "text": "Try this \r\n`git log --oneline --abbrev-commit --all --graph --decorate --color`\r\n\r\nIt will give you one line commits, plus branching.", "upvoteCount": 6, "author": { "@type": "Person", "name": "Benjamin Brodie" }, "about": { "@type": "Article", "@id": "a-better-git-log" } } blbrodie Try this git log --oneline --abbrev-commit --all --graph --decorate --color It will give you one line commits, plus branching. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-06-07 15:42:12 UTC", "text": "FYI, %h is for abbreviated commit hash, making --abbrev-commit redundant.", "upvoteCount": 2, "author": { "@type": "Person", "name": "Will Gray" }, "about": { "@type": "Article", "@id": "a-better-git-log" } } graywh FYI, %h is for abbreviated commit hash, making --abbrev-commit redundant. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-06-07 16:13:35 UTC", "text": "Call me old fashioned. I use the alias ```glo``` mapped to \r\n```git log --decorate --oneline --graph``` and that works well for me. \r\n\r\nOr, if I'm feeling like I need something a bit different, ```glg``` , which is mapped to \r\n```git log --decorate --graph --abbrev-commit --date=relative```\r\n\r\nhttps://github.com/kevinSuttle/dotfiles/blob/master/git/aliases.zsh#L11", "upvoteCount": 3, "author": { "@type": "Person", "name": "Kevin Suttle" }, "about": { "@type": "Article", "@id": "a-better-git-log" } } kevinsuttle Call me old fashioned. I use the alias glo mapped to git log --decorate --oneline --graph and that works well for me. Or, if I'm feeling like I need something a bit different, glg , which is mapped to git log --decorate --graph --abbrev-commit --date=relative https://github.com/kevinSuttle/dotfiles/blob/master/git/aliases.zsh#L11 over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-06-07 17:34:59 UTC", "text": "This is great! Thanks :D", "upvoteCount": 0, "author": { "@type": "Person", "name": "Prateek Saxena" }, "about": { "@type": "Article", "@id": "a-better-git-log" } } prtksxna This is great! Thanks :D over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-06-07 18:57:17 UTC", "text": "I like this one, that shows the branch graph on the left:\r\n\r\nhistory = log --graph --pretty=format:'%C(yellow)%h%C(cyan)%d%Creset %s %C(white)- %an, %ar%Creset'\r\n stash-list = stash list --pretty=format:'%Cblue%gd%Cred: %C(yellow)%s'q\r\n\r\nLooks like: https://www.evernote.com/shard/s3/sh/1b468c02-8e39-499f-afd8-2fd3a099896c/88b8c39a380bc90b5809b2e9f4f069cc/deep/0/Screenshot%206/7/13%202:56%20PM.png", "upvoteCount": 0, "author": { "@type": "Person", "name": "Davey Shafik" }, "about": { "@type": "Article", "@id": "a-better-git-log" } } dshafik I like this one, that shows the branch graph on the left: history = log --graph --pretty=format:'%C(yellow)%h%C(cyan)%d%Creset %s %C(white)- %an, %ar%Creset' stash-list = stash list --pretty=format:'%Cblue%gd%Cred: %C(yellow)%s'q Looks like: https://www.evernote.com/shard/s3/sh/1b468c02-8e39-499f-afd8-2fd3a099896c/88b8c39a380bc90b5809b2e9f4f069cc/deep/0/Screenshot%206/7/13%202:56%20PM.png over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-06-07 19:19:34 UTC", "text": "@dshafik Mine also shows the graph :) It just happened to be a flat-line for the screenshots I've chose :P", "upvoteCount": 0, "author": { "@type": "Person", "name": "Filipe Kiss" }, "about": { "@type": "Article", "@id": "a-better-git-log" } } filipekiss @dshafik Mine also shows the graph :) It just happened to be a flat-line for the screenshots I've chose :P over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-06-07 20:38:10 UTC", "text": "Love it!", "upvoteCount": 0, "author": { "@type": "Person", "name": "Angel S. Moreno" }, "about": { "@type": "Article", "@id": "a-better-git-log" } } angelxmoreno Love it! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-06-07 22:43:53 UTC", "text": "scm_breeze on github does something similar automatically plus a bunch of other nice aliases", "upvoteCount": 0, "author": { "@type": "Person", "name": "Charles Phillip Cloud" }, "about": { "@type": "Article", "@id": "a-better-git-log" } } cpcloud scm_breeze on github does something similar automatically plus a bunch of other nice aliases over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-08-01 15:13:12 UTC", "text": "There is no need for `--abbrev-commit`.\r\n\r\nThanks for the tip though, I trimmed mine down to: \r\n\r\n git log --format='%Cred%h%Creset %s %Cgreen(%cr) %C(blue)\u003c%an\u003e%Creset%C(yellow)%d%Creset' --no-merges", "upvoteCount": 1, "author": { "@type": "Person", "name": "FMCorz" }, "about": { "@type": "Article", "@id": "a-better-git-log" } } fmcorz There is no need for --abbrev-commit. Thanks for the tip though, I trimmed mine down to: git log --format='%Cred%h%Creset %s %Cgreen(%cr) %C(blue)<%an>%Creset%C(yellow)%d%Creset' --no-merges over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-11-06 10:26:48 UTC", "text": "This is great, thanks for sharing !", "upvoteCount": 0, "author": { "@type": "Person", "name": "Julien Dubreuil" }'''
