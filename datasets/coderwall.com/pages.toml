full_description = '''{ "@context": "http://schema.org", "@type": "Article", "@id": "one-line-browser-notepad", "author": { "@type": "Person", "name": "Jose Jesus Perez Aguinaga" }, "dateModified": "2024-08-11 09:48:58 UTC", "datePublished": "2024-08-11 09:48:58 UTC", "headline": "One line browser notepad (Example)", "url": "/p/lhsrcq/one-line-browser-notepad", "commentCount": 125, "keywords": "browser, html5, notepad", "articleBody": "##Introduction\r\n\r\nSometimes I just need to type garbage. Just to clear out my mind. Using editors to type such gibberish annoys me because it clutters my project workspace (I'm picky, I know). \r\n\r\nSo I do this. Since I live in the browser, I just open a new tab and type in the url tab.\r\n\r\n data:text/html, \u003chtml contenteditable\u003e\r\n\r\nVoila, browser notepad.\r\n\r\n##Why it works?\r\n\r\nYou don't need to remember it. It's not rocket science. We are using the [Data URI's format](http://www.nczonline.net/blog/2009/10/27/data-uris-explained/) and telling the browser to render an html (try \"javascript:alert('Bazinga');\"). The content of said html is a simple html line with the html5 attribute contenteditable. This works only on modern browsers that understand this attribute. Click and type!", "description": "A protip by jjperezaguinaga about browser, html5, and notepad.", "publisher": { "@type": "Organization", "name": "Coderwall", "logo": { "@type": "ImageObject", "url": "/logo.png" }, "url": "https://coderwall.com/" }, "image": "/logo.png" } Last Updated: August 11, 2024 · 535.7K · jjperezaguinaga One line browser notepad #browser #html5 #notepad Introduction Sometimes I just need to type garbage. Just to clear out my mind. Using editors to type such gibberish annoys me because it clutters my project workspace (I'm picky, I know). So I do this. Since I live in the browser, I just open a new tab and type in the url tab. data:text/html, <html contenteditable> Voila, browser notepad. Why it works? You don't need to remember it. It's not rocket science. We are using the Data URI's format and telling the browser to render an html (try "javascript:alert('Bazinga');"). The content of said html is a simple html line with the html5 attribute contenteditable. This works only on modern browsers that understand this attribute. Click and type! #browser #html5 #notepad Written by Jose Jesus Perez Aguinaga Say Thanks Respond Related protips Use fetch instead of XmlHttpRequest in Javascript 51.06K 0 Add console.save to Chrome 28.88K 1 Connect to SMB or FTP on macOS 27.84K 0 125 Responses Add your response { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2012-12-04 15:21:21 UTC", "text": "This is great. Made a bookmark from it.", "upvoteCount": 2, "author": { "@type": "Person", "name": "Jan Laureys" }, "about": { "@type": "Article", "@id": "one-line-browser-notepad" } } janlaureys This is great. Made a bookmark from it. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-01-15 17:19:45 UTC", "text": "You can use textarea and make it \"invisible\" if you want autofocus.\r\n\r\n data:text/html, \u003ctextarea style=\"font-size: 1.5em; width: 100%; height: 100%; border: none; outline: none\" autofocus /\u003e", "upvoteCount": 24, "author": { "@type": "Person", "name": "Valter Martinek" }, "about": { "@type": "Article", "@id": "one-line-browser-notepad" } } montas You can use textarea and make it "invisible" if you want autofocus. data:text/html, <textarea style="font-size: 1.5em; width: 100%; height: 100%; border: none; outline: none" autofocus /> over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-01-15 19:11:45 UTC", "text": "I'm making it as my default page from now on. :) Thanks for the tip.", "upvoteCount": 0, "author": { "@type": "Person", "name": "Nenad Petkovic" }, "about": { "@type": "Article", "@id": "one-line-browser-notepad" } } creatifcode I'm making it as my default page from now on. :) Thanks for the tip. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-01-17 07:33:58 UTC", "text": "This is very clever; I dig it. Thanks for the tip!", "upvoteCount": 1, "author": { "@type": "Person", "name": "Jesse Reese " }, "about": { "@type": "Article", "@id": "one-line-browser-notepad" } } jessereese01 This is very clever; I dig it. Thanks for the tip! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-01-26 21:35:04 UTC", "text": "Really cool! :D", "upvoteCount": 1, "author": { "@type": "Person", "name": "Thomas Deinhamer" }, "about": { "@type": "Article", "@id": "one-line-browser-notepad" } } thasmo Really cool! :D over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-01-29 18:15:48 UTC", "text": "I made a version that is a full blown Ruby editor with syntax highlighting from Ace.\r\n\r\nhttps://gist.github.com/4666256", "upvoteCount": 83, "author": { "@type": "Person", "name": "Jake Moffatt" }, "about": { "@type": "Article", "@id": "one-line-browser-notepad" } } jakeonrails I made a version that is a full blown Ruby editor with syntax highlighting from Ace. https://gist.github.com/4666256 over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-01-29 18:42:05 UTC", "text": "@jakeonrails Quoting @jessereese01, this is very clever, I dig it. Smallest html5/css/js editor competition anyone?", "upvoteCount": 1, "author": { "@type": "Person", "name": "Jose Jesus Perez Aguinaga" }, "about": { "@type": "Article", "@id": "one-line-browser-notepad" } } jjperezaguinaga @jakeonrails Quoting @jessereese01, this is very clever, I dig it. Smallest html5/css/js editor competition anyone? over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2013-01-29 19:13:01 UTC", "text": "I'm going to use the hell out of this. thanks. ", "upvoteCount": 1, "autho