title = "Don't use Array.forEach, use for() instead 💡 Example"
description = "Don't use Array.forEach, use for() instead Example 💡 protip about performance, loop, and javascript."
full_description = '''{ "@context": "http://schema.org", "@type": "Article", "@id": "don-t-use-array-foreach-use-for-instead", "author": { "@type": "Person", "name": "Afshin Mehrabani" }, "dateModified": "2023-12-18 06:30:37 UTC", "datePublished": "2023-12-18 06:30:37 UTC", "headline": "Don't use Array.forEach, use for() instead 💡 Example", "url": "/p/kvzbpa/don-t-use-array-foreach-use-for-instead", "commentCount": 19, "keywords": "performance, loop, javascript", "articleBody": "**Array.ForEach** is about 95% slower than **for()** in for each for Arrays in JavaScript.\r\n\r\nSo, don't use:\r\n\r\n```\r\narr.forEach(function (item) {\r\nsomeFn(item);\r\n})\r\n```\r\nUse:\r\n\r\n```\r\nfor (var i = 0, len = arr.length; i \u003c len; i++) {\r\nsomeFn(arr[i]);\r\n}\r\n```\r\nSee this performance test online: http://jsperf.com/fast-array-foreach", "description": "Don't use Array.forEach, use for() instead Example 💡 protip about performance, loop, and javascript.", "publisher": { "@type": "Organization", "name": "Coderwall", "logo": { "@type": "ImageObject", "url": "/logo.png" }, "url": "https://coderwall.com/" }, "image": "/logo.png" } Last Updated: December 18, 2023 · 1.235M · afshinm Don't use Array.forEach, use for() instead #performance #loop #javascript Array.ForEach is about 95% slower than for() in for each for Arrays in JavaScript. So, don't use: arr.forEach(function (item) { someFn(item); }) Use: for (var i = 0, len = arr.length; i < len; i++) { someFn(arr[i]); } See this performance test online: http://jsperf.com/fast-array-foreach #performance #loop #javascript Written by Afshin Mehrabani Say Thanks Respond Related protips JavaScript Looper 2.806K 4 Iteration in JavaScript done right 2.193K 0 Why you should always append DOM elements using DocumentFragments 96.72K 10 19 Responses Add your response { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2019-11-25 19:33:05 UTC", "text": "How about for of loop ?", "upvoteCount": 2, "author": { "@type": "Person", "name": "mznaim" }, "about": { "@type": "Article", "@id": "don-t-use-array-foreach-use-for-instead" } } mznaim How about for of loop ? over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2019-12-01 05:56:03 UTC", "text": "very good", "upvoteCount": 1, "author": { "@type": "Person", "name": "cuakieng" }, "about": { "@type": "Article", "@id": "don-t-use-array-foreach-use-for-instead" } } cuakieng very good over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2019-12-06 21:15:34 UTC", "text": "Thank you for this site!", "upvoteCount": 1, "author": { "@type": "Person", "name": "RichardSantos" }, "about": { "@type": "Article", "@id": "don-t-use-array-foreach-use-for-instead" } } RichardSantos Thank you for this site! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2019-12-09 01:08:44 UTC", "text": "I wonder how often you actually need forEach anyway, you'll more often be using .map, .filter or .reduce anyway. Or is a for loop still faster?", "upvoteCount": 2, "author": { "@type": "Person", "name": "Larry Boltovskoi" }, "about": { "@type": "Article", "@id": "don-t-use-array-foreach-use-for-instead" } } larrybolt I wonder how often you actually need forEach anyway, you'll more often be using .map, .filter or .reduce anyway. Or is a for loop still faster? over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2020-01-13 10:43:42 UTC", "text": "It is about how functional you want to be. A for loop is not that functional so I would sacrifice performance over maintainability and readability. ", "upvoteCount": 4, "author": { "@type": "Person", "name": "Anastasios Orfanidis" }, "about": { "@type": "Article", "@id": "don-t-use-array-foreach-use-for-instead" } } kevinorfas It is about how functional you want to be. A for loop is not that functional so I would sacrifice performance over maintainability and readability. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2020-02-28 20:06:30 UTC", "text": "I completely disagree with this \u0026 please allow to explain why: \r\nUsing for loops is easy enough sure, in most cases.. but your overlooking the entire point of map, forEach, filter, reduce, find, findIndex, etc... These make use of functional paradigms, and these paradigms exist for a reason. Functional programming is all about focusing not on **how to solve** problems and instead, shifts your focus to **what to solve**. Beyond that, anyone who is worried about performance at this level can go back after they've built their app and measure the app's performance and decide where to optimize (and I will bet you will find most of your optimizations will not be refactoring map, filter, or reduce). Using for loops is like going backwards, not to mention that `forEach` is slow because it is modifying/mutating the original array, whereas `.map()` returns a new array, is much faster, and without the side effect of mutating the original array. There are fewer and fewer cases where a for loop is viable. Currently, the best use case would be for something like iterating an async generator function using the new `for-await-of` syntax. Which is super cool. My point is that javascript gives us first class functions and in combination with it's (sorta) functional paradigms can produce: more readable code, better tooling, composition and patterns like higher order functions and currying, beautiful immutability, and many other wins such as referential transparency with pure functions - which reduce side effects and can increase run time, especially if memoized etc... Although I say \"sorta\" as obviously you're going to need functions with side effects to make API calls, or logs, or write i/o (any function that has I/O). \r\n\r\nRegardless, I hate to say that I think you're giving bad advice here. Sure, everyone should know how to use all the original loops in javascript and use them well, but using a for loop versus `map` or even `forEach` (if you just have to mutate that existing array) is going the wrong direction.", "upvoteCount": 3, "author": { "@type": "Person", "name": "Andruw Hart" }, "about": { "@type": "Article", "@id": "don-t-use-array-foreach-use-for-instead" } } andrewjhart I completely disagree with this & please allow to explain why: Using for loops is easy enough sure, in most cases.. but your overlooking the entire point of map, forEach, filter, reduce, find, findIndex, etc... These make use of functional paradigms, and these paradigms exist for a reason. Functional programming is all about focusing not on how to solve problems and instead, shifts your focus to what to solve. Beyond that, anyone who is worried about performance at this level can go back after they've built their app and measure the app's performance and decide where to optimize (and I will bet you will find most of your optimizations will not be refactoring map, filter, or reduce). Using for loops is like going backwards, not to mention that forEach is slow because it is modifying/mutating the original array, whereas .map() returns a new array, is much faster, and without the side effect of mutating the original array. There are fewer and fewer cases where a for loop is viable. Currently, the best use case would be for something like iterating an async generator function using the new for-await-of syntax. Which is super cool. My point is that javascript gives us first class functions and in combination with it's (sorta) functional paradigms can produce: more readable code, better tooling, composition and patterns like higher order functions and currying, beautiful immutability, and many other wins such as referential transparency with pure functions - which reduce side effects and can increase run time, especially if memoized etc... Although I say "sorta" as obviously you're going to need functions with side effects to make API calls, or logs, or write i/o (any function that has I/O). Regardless, I hate to say that I think you're giving bad advice here. Sure, everyone should know how to use all the original loops in javascript and use them well, but using a for loop versus map or even forEach (if you just have to mutate that existing array) is going the wrong direction. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2020-02-29 01:58:27 UTC", "text": "@andrewjhart I agree that map, filter, reduce, find, ... are useful, but forEach is used to produce side effects. Although I usually use map, filter, reduce, find, ... , I still avoid forEach because it is pointless IMO. When I want to iterate over an array to produce side effects, I will use `for-of`, or use traditional `for` if index is needed.", "upvoteCount": 0, "author": { "@type": "Person", "name": "maple3142" }, "about": { "@type": "Article", "@id": "don-t-use-array-foreach-use-for-instead" } } maple3142 @andrewjhart I agree that map, filter, reduce, find, ... are useful, but forEach is used to produce side effects. Although I usually use map, filter, reduce, find, ... , I still avoid forEach because it is pointless IMO. When I want to iterate over an array to produce side effects, I will use for-of, or use traditional for if index is needed. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2020-11-09 19:34:58 UTC", "text": "@andrewjhart I will never understand how people can say that .forEach is more readable than an actual loop. Languages have keywords for looping for a reason, because they are core concepts that all programming is based on, your IDE will syntax highlight it and everything. List.map .filter and .reduce can all be useful for sure, I find myself using them frequently enough. Foreach as a function is completely pointless though imo. It is also a pain to debug and step through, which to me is the most obvious inferiority it has. For .. of loops are by far the most readable and nicest to type, but they also seem to have pretty bad performance on large collections.\r\n\r\nObject Oriented Programming is readable. Maybe my experience with people who get all into the functional programming idea is limited, but those huge blobs of anonymous functions strung about through generic map/filter/forEachs is the complete opposite of readable, to me at least.", "upvoteCount": 0, "author": { "@type": "Person", "name": "kyletheninja" }, "about": { "@type": "Article", "@id": "don-t-use-array-foreach-use-for-instead" } } kyletheninja @andrewjhart I will never understand how people can say that .forEach is more readable than an actual loop. Languages have keywords for looping for a reason, because they are core concepts that all programming is based on, your IDE will syntax highlight it and everything. List.map .filter and .reduce can all be useful for sure, I find myself using them frequently enough. Foreach as a function is completely pointless though imo. It is also a pain to debug and step through, which to me is the most obvious inferiority it has. For .. of loops are by far the most readable and nicest to type, but they also seem to have pretty bad performance on large collections. Object Oriented Programming is readable. Maybe my experience with people who get all into the functional programming idea is limited, but those huge blobs of anonymous functions strung about through generic map/filter/forEachs is the complete opposite of readable, to me at least. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2020-11-09 19:39:36 UTC", "text": "@andrewjhart @kevinorfas I will never understand how people can say that .forEach is more readable than an actual loop. Languages have keywords for looping for a reason, because they are core concepts that all programming is based on, your IDE will syntax highlight it and everything. List.map .filter and .reduce can all be useful for sure, I find myself using them frequently enough. Foreach as a function is completely pointless though imo. It is also a pain to debug and step through, which to me is the most obvious inferiority it has. For .. of loops are by far the most readable and nicest to type, but they also seem to have pretty bad performance on large collections.\r\n\r\nObject Oriented Programming is readable. Maybe my experience with people who get all into the functional programming idea is limited, but those huge blobs of anonymous functions strung about through long spaghetti chains of generic map/filter/forEachs is the complete opposite of readable, to me at least.\r\n\r\nTldr; I completely disagree that functional programming is especially readable or maintainable, at least according to the specific suggestions I hear from people who profess its greatness.", "upvoteCount": 1, "author": { "@type": "Person", "name": "kyletheninja" }, "about": { "@type": "Article", "@id": "don-t-use-array-foreach-use-for-instead" } } kyletheninja @andrewjhart @kevinorfas I will never understand how people can say that .forEach is more readable than an actual loop. Languages have keywords for looping for a reason, because they are core concepts that all programming is based on, your IDE will syntax highlight it and everything. List.map .filter and .reduce can all be useful for sure, I find myself using them frequently enough. Foreach as a function is completely pointless though imo. It is also a pain to debug and step through, which to me is the most obvious inferiority it has. For .. of loops are by far the most readable and nicest to type, but they also seem to have pretty bad performance on large collections. Object Oriented Programming is readable. Maybe my experience with people who get all into the functional programming idea is limited, but those huge blobs of anonymous functions strung about through long spaghetti chains of generic map/filter/forEachs is the complete opposite of readable, to me at least. Tldr; I completely disagree that functional programming is especially readable or maintainable, at least according to the specific suggestions I hear from people who profess its greatness. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2021-03-02 13:45:26 UTC", "text": "I disagree. for loop is very verbose and usually if you care about maintainability you should bow for more readability. Performance is something that comes after the app is running in Production for some time...\r\n\r\nYou are correct, Array.forEach loop is slow, instead use Array.map which does not mutate your array.\r\n\r\n", "upvoteCount": 0, "author": { "@type": "Person", "name": "lggmave" }, "about": { "@type": "Article", "@id": "don-t-use-array-foreach-use-for-instead" } } lggmave I disagree. for loop is very verbose and usually if you care about maintainability you should bow for more readability. Performance is something that comes after the app is running in Production for '''
