title = "Add git branch name to bash prompt (Example)"
description = "A protip by itseranga about shell, osx, unix, git, and bash."
full_description = '''{ "@context": "http://schema.org", "@type": "Article", "@id": "add-git-branch-name-to-bash-prompt", "author": { "@type": "Person", "name": "eranga bandara" }, "dateModified": "2024-09-26 21:02:43 UTC", "datePublished": "2024-09-26 21:02:43 UTC", "headline": "Add git branch name to bash prompt (Example)", "url": "/p/fasnya/add-git-branch-name-to-bash-prompt", "commentCount": 4, "keywords": "shell, osx, unix, git", "articleBody": "In order to add branch name to bash prompt we have to edit the **PS1** variable(set value of PS1 in **~/.bash_profile**). \r\n\r\n## What is PS1\r\n\r\nPS1 denotes **Prompt String 1**. It is the one of the prompt available in Linux/UNIX shell. When you open your terminal, it will display the content defined in PS1 variable in your bash prompt\r\n\r\nFollowing is an example bash prompt of my terminal. In here I have defined to display \r\n* `user` - eranga\r\n* `host name of the machine` - erangas-MacBook-Pro-4\r\n* `current working directory` - ~/Workspace/wasn\r\n\r\n![Picture](https://coderwall-assets-0.s3.amazonaws.com/uploads/picture/file/3210/Screen_Shot_2014-07-19_at_1.32.42_PM.png)\r\n\r\n## More details about bash prompt and PS1\r\n* http://www.linuxnix.com/2013/04/linuxunix-shell-ps1-prompt-explained-in-detail.html\r\n* http://blog.twistedcode.org/2008/03/customizing-your-bash-prompt.html\r\n\r\n## Display git branch name\r\n\r\nAdd following lines to your **~/.bash_profile**\r\n\r\n```\r\nparse_git_branch() {\r\n git branch 2\u003e /dev/null | sed -e '/^[^*]/d' -e 's/* \\(.*\\)/ (\\1)/'\r\n}\r\nexport PS1=\"\\u@\\h \\[\\033[32m\\]\\w\\[\\033[33m\\]\\$(parse_git_branch)\\[\\033[00m\\] $ \"\r\n```\r\n\r\nIn here `parse_git_branch()` function extract the branch name when your are in git repository. This function output used in PS1 variable in order to prompt the branch name.\r\n \r\nIn above PS1 we defined following properties\r\n* `\\u@\\h \\[\\033[32m\\]` - user, host name and its displaying color\r\n* `\\w\\[\\033[33m\\]` - current working directory and its displaying color\r\n* `\\$(parse_git_branch)\\[\\033[00m\\]` - git branch name and its displaying color\r\n\r\nNow when you go to git repository form the terminal it will display currently checked out git branch in the prompt. Following is the example output of bash prompt after adding these changes to **~/.bash_profile**\r\n\r\n![Picture](https://coderwall-assets-0.s3.amazonaws.com/uploads/picture/file/3211/Screen_Shot_2014-07-19_at_1.48.54_PM.png)\r\n\r\n####Related protips:\r\n[Remove all your local git branches but keep master](https://coderwall.com/p/x3jmig/remove-all-your-local-git-branches-but-keep-master)\r\n", "description": "A protip by itseranga about shell, osx, unix, git, and bash.", "publisher": { "@type": "Organization", "name": "Coderwall", "logo": { "@type": "ImageObject", "url": "/logo.png" }, "url": "https://coderwall.com/" }, "image": "/logo.png" } Last Updated: September 26, 2024 · 425.4K · itseranga Add git branch name to bash prompt #shell #osx #unix #git #bash In order to add branch name to bash prompt we have to edit the PS1 variable(set value of PS1 in ~/.bash_profile). What is PS1 PS1 denotes Prompt String 1. It is the one of the prompt available in Linux/UNIX shell. When you open your terminal, it will display the content defined in PS1 variable in your bash prompt Following is an example bash prompt of my terminal. In here I have defined to display * user - eranga * host name of the machine - erangas-MacBook-Pro-4 * current working directory - ~/Workspace/wasn More details about bash prompt and PS1 http://www.linuxnix.com/2013/04/linuxunix-shell-ps1-prompt-explained-in-detail.html http://blog.twistedcode.org/2008/03/customizing-your-bash-prompt.html Display git branch name Add following lines to your ~/.bash_profile parse_git_branch() { git branch 2> /dev/null | sed -e '/^[^*]/d' -e 's/* \(.*\)/ (\1)/' } export PS1="\u@\h \[\033[32m\]\w\[\033[33m\]\$(parse_git_branch)\[\033[00m\] $ " In here parse_git_branch() function extract the branch name when your are in git repository. This function output used in PS1 variable in order to prompt the branch name. In above PS1 we defined following properties * \u@\h \[\033[32m\] - user, host name and its displaying color * \w\[\033[33m\] - current working directory and its displaying color * \$(parse_git_branch)\[\033[00m\] - git branch name and its displaying color Now when you go to git repository form the terminal it will display currently checked out git branch in the prompt. Following is the example output of bash prompt after adding these changes to ~/.bash_profile Related protips: Remove all your local git branches but keep master #shell #osx #unix #git #bash Written by eranga bandara Say Thanks Respond Related protips Copy files to clipboard using command line on OSX 286.4K 4 The single most useful thing in bash 223.3K 64 $#, $@ & $?: Bash Built-in variables 201.4K 2 4 Responses Add your response { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-08-14 04:55:38 UTC", "text": "How to do it with oh-my-zsh :)\r\nhttps://coderwall.com/p/g801fg?i=11\u0026p=1\u0026q=author%3Aitseranga\u0026t%5B%5D=itseranga", "upvoteCount": 3, "author": { "@type": "Person", "name": "eranga bandara" }, "about": { "@type": "Article", "@id": "add-git-branch-name-to-bash-prompt" } } itseranga How to do it with oh-my-zsh :) https://coderwall.com/p/g801fg?i=11&p=1&q=author%3Aitseranga&t%5B%5D=itseranga over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2017-07-03 01:21:26 UTC", "text": "Make sure that you escape the $ at the end of the PS1 line, or it will nuke the colors of your session.", "upvoteCount": 1, "author": { "@type": "Person", "name": "Darc" }, "about": { "@type": "Article", "@id": "add-git-branch-name-to-bash-prompt" } } Darc Make sure that you escape the $ at the end of the PS1 line, or it will nuke the colors of your session. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2017-09-07 03:37:21 UTC", "text": "Or you can use a helper tool like https://github.com/magicmonty/bash-git-prompt which also shows you the current status of the repository ;-) ", "upvoteCount": 3, "author": { "@type": "Person", "name": "Martin Gondermann" }, "about": { "@type": "Article", "@id": "add-git-branch-name-to-bash-prompt" } } magicmonty Or you can use a helper tool like https://github.com/magicmonty/bash-git-prompt which also shows you the current status of the repository ;-) over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2018-11-17 09:55:33 UTC", "text": "Just wanted to point that colors actually go before what you want to color :\r\n\\[\\033[32m\\]\\w is what makes the working directory \\w green\r\n", "upvoteCount": 1, "author": { "@type": "Person", "name": "aniso" }, "about": { "@type": "Article", "@id": "add-git-branch-name-to-bash-prompt" } } aniso Just wanted to point that colors actually go before what you want to color : [\033[32m]\w is what makes the working directory \w green over 1 year ago · Have a fresh tip? Share with Coderwall community! Post Post a tip Best #Shell Authors itseranga 597.4K #shell #cryptography #docker jmarizgit 309.5K #shell #Javascript #PHP dotcode 227.5K #shell #Web Performance #Python mehikmat 201.7K #shell #java #Python filosottile 184.9K #shell #python #Go Related Tags #shell #osx #unix #git #bash .#native_index# { background-color: #native_bg_color#; margin-bottom: 40px; } .#native_index# .native-main { color: #native_color# !important; } .#native_index# .native-cta { color: #native_cta_color#; background-color: #native_cta_bg_color#; } Sponsored by #native_company# #native_desc# #native_cta# Filed Under Tools Awesome Job See All Jobs Post a job for only $299 Sponsored by #native_company# — Learn More ._native_ribbon.native-js { background: linear-gradient(-30deg, #native_bg_color#E5, #native_bg_color#E5 45%, #