["https://coderwall.com/p/os6woq/uninstall-all-those-broken-versions-of-mysql-and-re-install-it-with-brew-on-mac-mavericks"]
title = "Uninstall all those broken versions of MySQL and re-install it with Brew on Mac Mavericks"
description = "A protip by corysimmons about mysql, mac, and brew."
full_description = '''{ "@context": "http://schema.org", "@type": "Article", "@id": "uninstall-all-those-broken-versions-of-mysql-and-re-install-it-with-brew-on-mac-mavericks", "author": { "@type": "Person", "name": "Cory Simmons" }, "dateModified": "2024-05-07 06:30:40 UTC", "datePublished": "2024-05-07 06:30:40 UTC", "headline": "Uninstall all those broken versions of MySQL and re-install it with Brew on Mac Mavericks (Example)", "url": "/p/os6woq/uninstall-all-those-broken-versions-of-mysql-and-re-install-it-with-brew-on-mac-mavericks", "commentCount": 46, "keywords": "mysql, mac, brew", "articleBody": "##Remove MySQL completely per [The Tech Lab](http://soatechlab.blogspot.com/2011/01/completely-remove-mysql-on-mac-os-x.html)\r\n\r\n- `ps -ax | grep mysql`\r\n- stop and `kill` any MySQL processes\r\n- `brew remove mysql`\r\n- `brew cleanup`\r\n- `sudo rm /usr/local/mysql`\r\n- `sudo rm -rf /usr/local/var/mysql`\r\n- `sudo rm -rf /usr/local/mysql*`\r\n- `sudo rm ~/Library/LaunchAgents/homebrew.mxcl.mysql.plist`\r\n- `sudo rm -rf /Library/StartupItems/MySQLCOM`\r\n- `sudo rm -rf /Library/PreferencePanes/My*`\r\n- `launchctl unload -w ~/Library/LaunchAgents/homebrew.mxcl.mysql.plist`\r\n- edit `/etc/hostconfig` and remove the line `MYSQLCOM=-YES-`\r\n- `rm -rf ~/Library/PreferencePanes/My*`\r\n- `sudo rm -rf /Library/Receipts/mysql*`\r\n- `sudo rm -rf /Library/Receipts/MySQL*`\r\n- `sudo rm -rf /private/var/db/receipts/*mysql*`\r\n- restart your computer just to ensure any MySQL processes are killed\r\n- try to run `mysql`, it shouldn't work\r\n\r\n---\r\n\r\n##Brew install MySQL per user Sedorner from this [StackOverflow](http://stackoverflow.com/a/6378429/175825) answer\r\n\r\n- `brew doctor` and fix any errors\r\n- `brew update`\r\n- `brew install mysql`\r\n- `unset TMPDIR`\r\n- ```mysql_install_db --verbose --user=`whoami` --basedir=\"$(brew --prefix mysql)\" --datadir=/usr/local/var/mysql --tmpdir=/tmp```\r\n- `mysql.server start`\r\n- run the commands Brew suggests, add MySQL to `launchctl` so it automatically launches at startup\r\n\r\n`mysql` should now work and be running all the time as expected\r\n\r\nGodspeed.", "description": "A protip by corysimmons about mysql, mac, and brew.", "publisher": { "@type": "Organization", "name": "Coderwall", "logo": { "@type": "ImageObject", "url": "/logo.png" }, "url": "https://coderwall.com/" }, "image": "/logo.png" } Last Updated: May 07, 2024 · 332.1K · corysimmons Uninstall all those broken versions of MySQL and re-install it with Brew on Mac Mavericks #mysql #mac #brew Remove MySQL completely per The Tech Lab ps -ax | grep mysql stop and kill any MySQL processes brew remove mysql brew cleanup sudo rm /usr/local/mysql sudo rm -rf /usr/local/var/mysql sudo rm -rf /usr/local/mysql* sudo rm ~/Library/LaunchAgents/homebrew.mxcl.mysql.plist sudo rm -rf /Library/StartupItems/MySQLCOM sudo rm -rf /Library/PreferencePanes/My* launchctl unload -w ~/Library/LaunchAgents/homebrew.mxcl.mysql.plist edit /etc/hostconfig and remove the line MYSQLCOM=-YES- rm -rf ~/Library/PreferencePanes/My* sudo rm -rf /Library/Receipts/mysql* sudo rm -rf /Library/Receipts/MySQL* sudo rm -rf /private/var/db/receipts/*mysql* restart your computer just to ensure any MySQL processes are killed try to run mysql, it shouldn't work Brew install MySQL per user Sedorner from this StackOverflow answer brew doctor and fix any errors brew update brew install mysql unset TMPDIR mysql_install_db --verbose --user=`whoami` --basedir="$(brew --prefix mysql)" --datadir=/usr/local/var/mysql --tmpdir=/tmp mysql.server start run the commands Brew suggests, add MySQL to launchctl so it automatically launches at startup mysql should now work and be running all the time as expected Godspeed. #mysql #mac #brew Written by Cory Simmons Say Thanks Respond Related protips Splitting Strings with MySQL 316.9K 0 SOLVED: Can't connect to local mySQL server through socket /tmp/mysql.sock 122.3K 9 How to convert string to integer (PHP & MySQL) 108.6K 2 46 Responses Add your response { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-03-26 11:58:23 UTC", "text": "On the 'mysql_install_db' command, there needs to be a space between the 'whoami' and the '--basedir' - for me it was a cut\u0026paste gotcha. Otherwise, this was a great help in removing a munged installation, because the filesystem locations seem to be different for each Mac OS and this is the only one I found for Mavericks that pointed me to /usr/local/var/mysql, where all the 'bad' stuff was hiding.", "upvoteCount": 0, "author": { "@type": "Person", "name": "Lee Chastain" }, "about": { "@type": "Article", "@id": "uninstall-all-those-broken-versions-of-mysql-and-re-install-it-with-brew-on-mac-mavericks" } } lchastain On the 'mysqlinstalldb' command, there needs to be a space between the 'whoami' and the '--basedir' - for me it was a cut&paste gotcha. Otherwise, this was a great help in removing a munged installation, because the filesystem locations seem to be different for each Mac OS and this is the only one I found for Mavericks that pointed me to /usr/local/var/mysql, where all the 'bad' stuff was hiding. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-03-26 12:18:13 UTC", "text": "Oops, it was there but because of the backticks in the command markdown was breaking.", "upvoteCount": 0, "author": { "@type": "Person", "name": "Cory Simmons" }, "about": { "@type": "Article", "@id": "uninstall-all-those-broken-versions-of-mysql-and-re-install-it-with-brew-on-mac-mavericks" } } corysimmons Oops, it was there but because of the backticks in the command markdown was breaking. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-05-12 14:26:34 UTC", "text": "You sir, are a gentleman and a scholar. You have now enabled me to actually start working again :D", "upvoteCount": 0, "author": { "@type": "Person", "name": "Clare Lindley" }, "about": { "@type": "Article", "@id": "uninstall-all-those-broken-versions-of-mysql-and-re-install-it-with-brew-on-mac-mavericks" } } nano_monkey You sir, are a gentleman and a scholar. You have now enabled me to actually start working again :D over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-05-14 15:55:43 UTC", "text": "Thank you for this. Between the teams I work with and people wanting to get into the backend of my laptop, my files were all weirded out. This set everything straight, and I was able to get MySql running again! ", "upvoteCount": 0, "author": { "@type": "Person", "name": "Brad Stemke" }, "about": { "@type": "Article", "@id": "uninstall-all-those-broken-versions-of-mysql-and-re-install-it-with-brew-on-mac-mavericks" } } bradstemke Thank you for this. Between the teams I work with and people wanting to get into the backend of my laptop, my files were all weirded out. This set everything straight, and I was able to get MySql running again! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-05-16 04:14:17 UTC", "text": "\u003c3 !", "upvoteCount": 0, "author": { "@type": "Person", "name": "Alex Novosad" }, "about": { "@type": "Article", "@id": "uninstall-all-those-broken-versions-of-mysql-and-re-install-it-with-brew-on-mac-mavericks" } } gamenerds <3 ! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-05-24 01:02:58 UTC", "text": "Lordy lordy lordy. Thank you for this. I was struggling quite a bit with a MySQL install. I still don't know exactly what I was doing wrong, but this worked. THANK YOU!", "upvoteCount": 0, "author": { "@type": "Person", "name": "Natalie Wiser-Orozco" }, "about": { "@type": "Article", "@id": "uninstall-all-those-broken-versions-of-mysql-and-re-install-it-with-brew-on-mac-mavericks" } } dvlwearsparsley Lordy lordy lordy. Thank you for this. I was struggling quite a bit with a MySQL install. I still don't know exactly what I was doing wrong, but this worked. THANK YOU! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-06-17 16:01:04 UTC", "text": "This all worked great, thanks for helping me get mysql back up and running.\r\n\r\nbtw if anyone gets this error:\r\n [ERROR] /usr/local/opt/mysql/bin/mysqld: unknown variable '--general_log_file=/var/log/mysqldquery.log'\r\n\r\nGo to /etc/my.cnf and delete the line, then try mysql.server start again.", "upvoteCount": 0, "author": { "@type": "Person", "name": "thebiglechowski" }, "about": { "@type": "Article", "@id": "uninstall-all-those-broken-versions-of-mysql-and-re-install-it-with-brew-on-mac-mavericks" } } thebiglechowski This all worked great, thanks for helping me get mysql back up and running. btw if anyone gets this error: [ERROR] /usr/local/opt/mysql/bin/mysqld: unknown variable '--generallogfile=/var/log/mysqldquery.log' Go to /etc/my.cnf and delete the line, then try mysql.server start again. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-06-29 04:23:34 UTC", "text": "Even for a noob like me, it took just a few google searches to clean several failed/broken/mysterious installs and get a clean one going. Thanks a lot for taking the time to compile.\r\n\r\nI don't know if my path through this was typical, but you may want to bring about that the stop/kill of processes can be done from the Activity Monitor app as well. Also, I didn't have Homebrew installed, but the very nice article at http://coolestguidesontheplanet.com/setting-up-os-x-mavericks-and-homebrew/ took me through the process.\r\n\r\nThanks again", "upvoteCount": 0, "author": { "@type": "Person", "name": "CC" }, "about": { "@type": "Article", "@id": "uninstall-all-those-broken-versions-of-mysql-and-re-install-it-with-brew-on-mac-mavericks" } } zorzal Even for a noob like me, it took just a few google searches to clean several failed/broken/mysterious installs and get a clean one going. Thanks a lot for taking the time to compile. I don't know if my path through this was typical, but you may want to bring about that the stop/kill of processes can be done from the Activity Monitor app as well. Also, I didn't have Homebrew installed, but the very nice article at http://coolestguidesontheplanet.com/setting-up-os-x-mavericks-and-homebrew/ took me through the process. Thanks again over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-08-06 20:17:05 UTC", "text": "This command:\r\n```\r\nmysql_install_db --verbose --user=`whoami` --basedir=\"$(brew --prefix mysql)\" --datadir=/usr/local/var/mysql --tmpdir=/tmp\r\n```\r\n\r\nDidn't work for me... It is unable to get a lock. Asks if there is another mysqld process running, but there isn't. The server seems to work even though this line doesn't.", "upvoteCount": 0, "author": { "@type": "Person", "name": "Daniel Mullins" }, "about": { "@type": "Article", "@id": "uninstall-all-those-broken-versions-of-mysql-and-re-install-it-with-brew-on-mac-mavericks" } } danielmullins This command: mysql_install_db --verbose --user=`whoami` --basedir="$(brew --prefix mysql)" --datadir=/usr/local/var/mysql --tmpdir=/tmp Didn't work for me... It is unable to get a lock. Asks if there is another mysqld process running, but there isn't. The server seems to work even though this line doesn't. over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-08-28 12:47:16 UTC", "text": "thx for this useful little tutorial :)", "upvoteCount": 0, "author": { "@type": "Person", "name": "Sissi Adamski" }, "about": { "@type": "Article", "@id": "uninstall-all-those-broken-versions-of-mysql-and-re-install-it-with-brew-on-mac-mavericks" } } nerdess thx for this useful little tutorial :) over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-08-31 20:36:40 UTC", "text": "This saved me after three days of banging my head against the wall, thanks so much...", "upvoteCount": 0, "author": { "@type": "Person", "name": "epophoto" }, "about": { "@type": "Article", "@id": "uninstall-all-those-broken-versions-of-mysql-and-re-install-it-with-brew-on-mac-mavericks" } } epophoto This saved me after three days of banging my head against the wall, thanks so much... over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-09-29 09:41:28 UTC", "text": "Hi, can you help me fix this problem? Here is the error message that I got. \r\n\r\nERROR! The server quit without updating PID file (/usr/local/var/mysql/Cliffs-Mac-Pro.local.pid).", "upvoteCount": 0, "author": { "@type": "Person", "name": "Cliff Richard Anfone" }, "about": { "@type": "Article", "@id": "uninstall-all-those-broken-versions-of-mysql-and-re-install-it-with-brew-on-mac-mavericks" } } canfone Hi, can you help me fix this problem? Here is the error message that I got. ERROR! The server quit without updating PID file (/usr/local/var/mysql/Cliffs-Mac-Pro.local.pid). over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-09-29 15:54:54 UTC", "text": "It's useful to fix my problem in \u003c mysql_install_db --verbose --user=`whoami` --basedir=\"$(brew --prefix mysql)\" --datadir=/usr/local/var/mysql --tmpdir=/tmp \u003e, Thanks!", "upvoteCount": 0, "author": { "@type": "Person", "name": "emptyshark" }, "about": { "@type": "Article", "@id": "uninstall-all-those-broken-versions-of-mysql-and-re-install-it-with-brew-on-mac-mavericks" } } emptyshark It's useful to fix my problem in < mysqlinstalldb --verbose --user=whoami --basedir="$(brew --prefix mysql)" --datadir=/usr/local/var/mysql --tmpdir=/tmp >, Thanks! over 1 year ago · { "@context": "http://schema.org", "@type": "Comment", "datePublished": "2014-10-01 20:19:48 UTC", "text": "If anyone else gets errors like this:\r\n`[Warning] Can't create test file /usr/local/var/mysql/whoami.lower-test`\r\n`[ERROR] InnoDB: ./ibdata1 can't be opened in read-write mode`\r\n`[ERROR] InnoDB: The system tablespace must be writable!`\r\n`[ERROR] Plugin 'InnoDB' init function returned error.`\r\n`[ERROR] Plugin 'InnoDB' registration as a STORAGE ENGINE failed.`\r\n`[ERROR] Unknown/unsupported storage engine: InnoDB`\r\n`[ERROR] Aborting`\r\n\r\nFix permissions using these 2 commands:\r\n`sudo chown -R whoami:staff /usr/local`\r\n`sudo chmod u+rwX /usr/local`\r\n\r\nThen pick up with the instructions after `brew install mysql`.", "upvoteCount": 0, "author": { "@type": "Person", "name": "Laura Davis-Robeson" }, "about": { "@type": "Article", "@id": "uninstall-all-those-broken-versions-of-mysql-and-re-install-it-with-brew-on-mac-mavericks" } } ldavisrobeson If anyone else gets errors like this: [Warning] Can't create test file /usr/local/var/mysql/whoami.lower-test [ERROR] InnoDB: ./ibdata1 can't be opened in read-write mode [ERROR] InnoDB: The system tablespace must be writable! [ERROR] Plugin 'Inn'''
