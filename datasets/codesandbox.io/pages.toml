["https://codesandbox.io/sdk"]
title = ""
full_description = "Give agents a sandbox to resolve user prompts, or create autonomous agents running on sandboxes. You can run multiple agents in parallel without them interfering with each other. Using the forking mechanism, you can also A/B test different agents. Create a sandbox for each developer or student, and run their code in the sandbox. This way, you can run multiple development environments in parallel without them interfering with each other. Run code in a sandbox to interpret it. This way, you can run untrusted code without worrying about it affecting your system. You can also run popular evals on any piece of code. Run tests inside a sandbox, and hibernate the sandbox when the tests are done. This way, you can quickly start the sandbox again when you need to run the tests again or evaluate the results. Use our APIs to create isolated development environments (sandboxes) that can run any type of code you need. Every environment runs in isolation, so you can safely run untrusted code without it affecting your system. Resume development within the same sandbox after periods of inactivity. With no loss thanks to our snapshots. Our microVM infrastructure allows us to spin up entire VMs, clone them and restore snapshots within 2 seconds. Yes. You need a CodeSandbox API key to use CodeSandbox SDK, which you can get by creating a CodeSandbox account."
