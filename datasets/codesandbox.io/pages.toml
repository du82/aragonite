["https://codesandbox.io/docs/sdk/snapshot-library"]
title = "Snapshot Library – CodeSandbox"
description = "Explore some CodeSandbox SDK snaphots to help you bootstrap your next project."
full_description = '''SDKSnapshot LibrarySDK Snapshots All sandboxes created by the CodeSandbox SDK are created from a snapshot. Even if you don't pass an argument to sdk.sandbox.create, we will fork the "Universal" snasphot to create a new sandbox. This is because CodeSandbox is built on top of the concept of forking. You create a template that contains all your necessary dependencies, files, or even running servers and you can clone it many times to create new sandboxes. Starting from a Snapshot You can start from a snapshot by passing the template id to the sdk.sandbox.create method. const sandbox = await sdk.sandbox.create({ template: 'template-id' }) Templates Below are the official templates on CodeSandbox that you can start experimenting with. You can click on the id on the right to copy the id to your clipboard and use it in your sandbox. Click on the title to open the template in the CodeSandbox editor to inspect it. 💡Want to create your own snapshot? Check out the Snapshot Builder guide to learn how to create a template from your own files using a CLI. VM SpecsSnapshot Builder'''
