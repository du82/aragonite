["https://codesandbox.io/changelog/2025-01-13"]
title = ""
full_description = "arrow_backChangelog•codesandboxJoining Together AI, launching CodeSandbox SDK & tons of improvementsWe're kicking off 2025 with a big update to CodeSandbox SDK, focused on speed and quality-of-life improvements.Hello 👋 We're thrilled to be back with another CodeSandbox update! The last few months have been very busy with us joining Together AI and releasing CodeSandbox SDK, but we've finally compiled an update of everything happening on CodeSandbox. Catch the highlights below! What's new? +8Joining Together AI and Introducing CodeSandbox SDK ❤️ In the biggest news we've had in a long time, we announced the beginning of a new chapter for CodeSandbox, as part of our acquisition by Together AI. Read the blog post for all the details, but rest assured that CodeSandbox will continue to run as normal (in fact, with the backing of Together AI, we’ve made private sandboxes & devboxes part of the Free plan!) +3Introducing CodeSandbox SDK 🤖 After a huge undertaking by our team, we released CodeSandbox SDK, an API that allows you to create and run VM sandboxes quickly and securely to run untrusted code at scale. It brings some of our unique developments like memory snapshot/restore, VM cloning from a live VM or snapshot in 3 seconds, persistence and much more. We built CodeSandbox SDK to empower our extended community to build a wide range of different products, like your own CodeSandbox, code interpreter tools that run code written by an LLM, CI runners, coding agents, and any other use case that requires near-instant code execution at scale. Start playing with the SDK today by following our quickstart guide—all you need is to get your API token and install the SDK by calling: npm install @codesandbox/sdk CodeSandbox SDK Improvements & Bug Fixes +-3Massive speed improvements to our fork & resume times. On average, VM resume times are now down to 495ms and clone times are down from 3s to 863ms. +-3We have re-implemented our global scheduler in the API server. This significantly improves our VM creation times by removing another call to an external service. +-3You can now dynamically change VM hibernation timeout while the VM is running. For example, you can now start a VM with a low hibernation timeout (like 30s) and then call updateHibernationTimeout after the user shows activity to increase hibernation timeout. +-3Several improvements to the Snapshot builder CLI, including: support for creating snapshots without health checks; displaying the ID of the sandbox in progress; stopped reusing sandbox IDs when building from same directory. +-3fs/writeFile will now create the parent directory of the file if create: true is given. This allows you to write many files at once by calling write in parallel. +4Several other general improvements and bug fixes, mostly focused on improving UX and stability. That's a wrap! The beginning of this new chapter has been extremely positive, and we appreciate everyone's kind words and support as we continue to improve CodeSandbox. If you have any feature requests (namely for CodeSandbox SDK), don't forget to post them on our community platform! See you in the next one 👋arrow_backBack to releases"
