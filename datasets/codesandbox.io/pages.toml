full_description = "We are building a cloud development platform that accelerates how everyone learns, codes, reviews and ships software. Join our mission of making code more accessible! Creators within organizations like Shopify, Netflix, and Stripe have crafted over 30 million apps on CodeSandbox. Our platform is used by thousands of open-source projects, including React, Vue, and Babel, among others. Even with advice from peers, a clear strategy, and a supportive culture, our work is still challenging and can push us out of our comfort zones. Ultimately though, we find this approach to be more fulfilling and deliver better results than other approaches. We ideate, scope, and implement—we’re not code monkeys or pixel pushers, but creative professionals who use our full range of skills to get things done. We want you to meet as many of us as possible! So, we do every interview in pairs and with different assessors. This also helps us to eliminate bias."
