["https://codesandbox.io/changelog/2023-03-10-seamless-branching-workspace-scopes-python"]
title = ""
full_description = "arrow_backChangelog•codesandboxgithubSeamless branching, workspace scopes, Python support and many moreGet ready for an absolutely gigantic update!Time flies! it really does! Feels like 2023 just started but it’s March already?! The last couple of months were full of releases and announcements here at CodeSandbox. We were so busy doing them that we kept postponing writing the changelog. So, here it is! What's new? +-3Introduced seamless branching: the smoothest branching and forking experience yet Whenever you are in a protected branch or cloud sandbox, you can now just start editing the code, hit save, and we will magically create a new branch of fork so you can just keep on coding. +-3Seamless branching for open source Open source contributors now get a much nicer experience on CodeSandbox! Simply open the link of any open-source repo on CodeSandbox, start coding, and we seamlessly create a contribution branch. +2Workspace scopes: more VM specs control for teams Over the last few months, we spent a lot of time focusing on repositories for teams. We saw microVMs working really well for individuals and teams, but realized that teams need more custom-tailored VM setups. So we focused on creating team scopes for repositories and VMs. Now, each team works on its own VMs, which can only be configured and accessed by that team's members. Learn more about this in our Documentation +-3CodeSandbox gets official Python support 🐍 The wait is over! CodeSandbox now officially supports Python development environments 🎉 Read our announcement. +-3Added support for Deno LSP This includes all the features of the powerful Deno LSP such as types, autocomplete and code refactoring. See our template! +-2We now suggest repositories you can import based on your GitHub organization +-2New VM specs DevTool: keep track of the CPU, RAM and Disk usage of each VM +-2Open a new Next.js 13 sandbox🔥 You can create new projects with Next.js 13 via next.react.new +-2New “Full Sidekick” mode, specially crafted for those using the VS Code integration +-3Pitcher now detects the Node version needed for the project using package.json +-1Added new tabs in the browser sandbox editor allowing an upgrade to a cloud sandbox: Terminal, Docker and VS Code +-2Added a welcome modal to users when they upgrade from a browser sandbox to a cloud sandbox +-2Added the ability to change the protected status of a branch (i.e., you can now commit to main) +-2Cloud sandboxes now get an automatically-generated screenshot if the preview fails +-3Added a new theme to the Documentation, with more customization options +-2Team admins can now pre-purchase seats during checkout CodeSandbox for iOS Updates +-3Introduced Docker support +-3Expanded language support: Rust, Go, Swift, Ruby, Python, PHP, and Elixir +-3Added support for code snippets +-3Improved Python support +-3Bug fix: fixed a pesky bug that was preventing our users from listing the branches for a project Improvements & Bug Fixes +-3Improved the performance using the VS Code extension on Windows +-2Improved GitHub permissions, with additional UI prompts to grant missing scopes +-3Added team manager role that will allow administrative work +-3Project Editor improvements Project Editor now reacts to Pitcher sending a notification about it going into hibernation. If the browser tab is not visible, it will unmount all previews to avoid traffic to the preview URLs to wake up the VM again. We do not show the reconnecting badge until the third reconnect try. +-3Improved the startup time of microVMs +-3Removed legacy authentication layer and ensured SSR rehydration +-3Improved the Documentation (SEO, search results, theme) We know this is a lot to take in, so check our FAQ or reach us through Discord in case you have any questions. Now, it's time to experience all these new features by kicking off a fresh sandbox or importing a repo. Happy coding! Catch you on the next one 👋arrow_backBack to releases"
