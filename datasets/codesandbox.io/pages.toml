title = ""
full_description = '''arrow_backChangelog•codesandboxEnterprise, Dev Containers, GPT-4 and VS Code extension updateOctober was a big month for CodeSandbox, with exciting product updates and improvements you don't want to miss!Hello there 👋 We hope you had a spooktastic Halloween 🎃 Our team had a lot of fun and closed off October in great style! With November here, this also means it's time for a brand-new changelog. This past month, we made a lot of improvements and fixes across the board but we also shipped some powerful new features. Let's take a look! What's new? +0CodeSandbox Enterprise 🏦 We introduced CodeSandbox Enterprise as a new offering that brings scalability, availability, security and trust to our CDE—the only one in the market that spins up an environment in 1.5 seconds, is available 24/7, and is fully collaborative. Private beta now open! +-1Dev Container support 📦 In one of our biggest product releases of 2023, we introduced Dev Container spec in CodeSandbox. This is now the default spec for all CodeSandbox projects and you can use our brand-new DevTool to configure any environment in seconds 🔥 +-3Boxy AI gets GPT-4 🤖 We have upgraded Boxy, your CodeSandbox AI assistant, to use GPT-4 by default. Based on our testing, this (as expected) greatly increases the quality of Boxy's responses. (Boxy is available to Pro subscribers.) +-3Dev Containers support in the CodeSandbox VS Code extension 🎉 With the latest update to our VS Code extension, you can now connect to containers running inside the CodeSandbox microVMs using the Dev Containers extension. Besides providing improved suppport for repos and sandboxes configured with Dev Containers, this gets rid of the VS Code "trust" modal. +-3Embeds modal for cloud sandboxes Improvements & Bug Fixes +-3Fixed issues with the Settings permissions and visibility, enabling the Settings menu for everyone. +-3Fixed issues when renaming sandboxes. +1General improvements on error messages, error handler, and editor stability. And that's all, folks! We wish you all a very productive and fun November! And stay tuned—some hot announcements are coming soon 👀 And because you made it all the way to the end, we have a special treat for you! You are invited to be one of the first users to join our brand-new community platform 💖 See you on the next one 👋arrow_backBack to releases'''
