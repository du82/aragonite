["https://codesandbox.io/blog/codesandbox-raises-2-4m-seed-round-led-by-kleiner-perkins"]
title = "CodeSandbox Raises $2.4M Seed Round led by Kleiner Perkins - CodeSandbox"
description = "We're super excited to share that we've raised a seed round from Kleiner Perkins, Arches Capital, and the founders of Figma, Framer, Netlify, Vercel, Sourcegraph and Catawiki!"
full_description = "arrow_back Blog chevron_right News May 7, 2019CodeSandbox Raises $2.4M Seed Round led by Kleiner PerkinsWe're super excited to share that we've raised a seed round from Kleiner Perkins, Arches Capital, and the founders of Figma, Framer, Netlify, Vercel, Sourcegraph and Catawiki!Ives van HoorneshareShareOur Story Two years ago we released CodeSandbox as the result of a side project while I was studying at the university. At the time there was no easy way to start or share modern JavaScript projects, and I needed this when working at Catawiki. Thus CodeSandbox was born. CodeSandbox is an online code editor that allows you to create a new web application in a single click. We handle setting up the development environment, the tooling and the provisioning for you. This way you can focus on creating the application instead of all the tooling. You can always share your project by just sharing the URL, and we have integrations with popular deployment targets like Vercel and Netlify and source control providers like GitHub. It turned out that I wasn't the only one who wanted to have something like this. CodeSandbox quickly grew in usage, and with every new release, we got a new surge of encouragement from the community. Now, two years later, over 2 million projects have been created and we have over 1.2 million visitors per month! We never could've imagined this kind of adoption and support from so many people in such a short time: Thanks to everyone involved for being so supportive! The Round We've always said that we are an online code editor, but we think we can be much more than that. We want to become a platform that not only makes it easier and faster for everyone to create applications, but it should be a place that people go to to share, collaborate and learn as well. To make this possible we decided to raise money from a group of likeminded people. We raised money from an incredible group of people, many of whom have been advising us for some time now. Like us, our investors believe that the process of creating software can be more accessible, productive and effective by recreating the tooling to do so. Instantly sharing our work should be easier now than ever before. We're proud to announce a seed round of $2.4M, led by Kleiner Perkins. Kleiner Perkins has invested in many companies that are improving the flow of developing applications, like Figma and Netlify. Among the investors are Arches Capital, Christian Bach & Mathias Biilmann (Founders Netlify), Dylan Field (Co-Founder Figma), Guillermo Rauch (Founder Vercel), Koen Bok (Co-Founder Framer), Marco Jansen (Co-Founder and former CTO Catawiki), Petri Parvinen (Angel Investor) and Quinn Slack (Co-Founder Sourcegraph). We're super excited to raise this round from such a smart group of people, we can't wait to continue building! What does this mean for CodeSandbox and you? We'll continue to ship features inspired by our core values: Lower the learning curve Encourage sharing and discovery Give the experience of a local editor What will change is the capacity and speed we can deliver new product features and give everyone a more useful experience on CodeSandbox. Our roadmap includes making CodeSandbox more community friendly, supporting larger projects, improving specific workflows (like the workflow of a library maintainer) and extending integrations. We really believe that we can make building applications easier, faster and more collaborative, and we'll do everything with lowering the bar of entry in mind. Not only are we looking for your feedback, this also means you can work with us. So if you're interested in working on CodeSandbox please send us a message from here! Thank You There are so many people who have helped CodeSandbox to this point, and we're incredibly grateful. We'd like to thank our 125(!) contributors, everyone using CodeSandbox and everyone who has advised and helped us to this point! We can't wait to explore this new chapter with you!arrow_back Return to all articles"
