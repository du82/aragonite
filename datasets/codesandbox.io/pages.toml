["https://codesandbox.io/docs/sdk/faq"]
title = "FAQs – CodeSandbox"
description = "Find answers to common questions about the CodeSandbox SDK."
full_description = '''SDKFAQFAQ Do I need a CodeSandbox workspace to be able to use the SDK? Yes. You need a CodeSandbox API key to use CodeSandbox SDK, which you can get by creating a CodeSandbox account (opens in a new tab). How can I revoke my API key? To revoke an API key, go to the "Permissions" tab of your Workspace Settings (opens in a new tab) and click the respective token under "API Access". Then, click "Remove Token" from the bottom of that modal. I have hit a rate limit - what should I do? Please subscribe to a CodeSandbox plan that includes the most suitable rate limit for you. In case you're on our Builder plan already, please contact us (opens in a new tab) to discuss an Enterprise plan. Can I change the specs of the VMs? Currently, we only allow changing the default specs for all VMs created with the SDK. You can change We are also SOC 2 Type II compliant. Is it possible to self-host CodeSandbox SDK? No, for now we don't provide a self-host option. Are there any SDK rate limits? Yes. The SDK has rate limits on concurrent VMs, number of requests per hour, and number of sandboxes created per hour. These limits vary depending on the CodeSandbox plan, as explained on our Pricing page (opens in a new tab). Can I use the same CodeSandbox plan for SDK and non-SDK usage? Yes. Your CodeSandbox plan will allow you to use both, so you can leverage the SDK for programmatic sandbox creation, while still allowing your team to use CodeSandbox for their development. Does the CodeSandbox SDK use CodeSandbox Sandboxes or Devboxes? While the SDK code only mentions "sandbox", the actual environments that it uses are officially called "Devboxes" (which use VMs). So, if you need more details about these VMs, please always refer to "Devbox" section of the CodeSandbox documentation and pricing.Fork'''
