["https://codesandbox.io/changelog/2024-08-31-template-picker-sandpack-static-file"]
title = ""
full_description = "arrow_backChangelog•codesandboxNew Template Picker, Sandpack Static File Support and Several ImprovementsOur August 2024 CodeSandbox update brings a bit of everything, including many UX improvements!Hey you 👋 We're happy to have you back for another CodeSandbox update! Our August had a bit of everything in store for us, but we mostly focused on making our UX even more polished for everyone. Catch the highlights below! What's new? +-2New & improved template picker 🔥 Now, we show a single modal that combines all our templates, making it easier to find the ideal language and runtime for your project. You can combine our filters to find anything in seconds. +-3Sandpack static file support 🖼️ You can now serve static files inside a Sandpack instance! This beta feature allows serving SVGs, fonts, images and much more, which helps take isolated, interactive code examples to a new level! +-3Deprecated the legacy editor 👋 After 7 years, we have officially deprecated our original “v1” editor, which is now replaced by our new editor powered by VS Code Web. Improvements & Bug Fixes +-2Updated dashboard cards so that the author's name is displayed. +-3Major codebase cleanup. +-3Several enhancements to phishing detection & handling. +-3UX and UI improvements to the editor's top bar. +-3Fixed an issue that prevented opening a preview from the command palette. +-3Fixed an issue that prevented downloading a project from the file explorer. +-3Fixed an issue where the last closed DevTool would open again when the DevTool window group was reopened. +-3Improved the UX of editor previews and DevTools. +-3Improved the feedback form with new functionality, such as requesting account deletion. +-3Improved the dashboard search, which now doesn't show draft projects. +-1Several updates, improvements and fixes related to clusters, certificates, proxies, Dev Container initialization, private preview authentication, high availability, and CodeSandbox CI. +-2Several updates, improvements and fixes to endpoints, phishing handling, dependencies, and preview tokens. +4Several other general improvements and bug fixes, mostly focused on improving stability. There you have it! We hope that you enjoyed these changes. As always, remember to drop by our community platform to leave your feedback and feature requests! See you in the next one 👋arrow_backBack to releases"
