["https://codesandbox.io/docs/learn/devboxes/preview"]
title = "Preview – CodeSandbox"
description = "Learn how CodeSandbox previews work and how the different preview utilities can boost your productivity."
full_description = '''EditorDevboxesPreviewPreview When you run a task that opens a server on a port, that port will be attached to the Task, turning it into a preview-type DevTool. A list of all available previews is shown at the top of the DevTools tab. When opened, a preview will, by default, be displayed on the right side of the editor in a new tab. As explained below, CodeSandbox automatically proxies the preview into a publicly-accessible URL using a structure similar to https://:id-3000.csb.app. This URL can be opened and shared with others to get standalone version of the preview. Primary Preview Because a project may have several different previews, you can manually mark a specific one as a primary preview. One way to achieve that is by clicking the three dots icon at the right of the preview window and then click on "Set as primary preview". Primary previews will open by default when the project is spun up. Preview Utilities Previews come with a few built-in utilities that make it easier to interact with previews and edit their underlying code. These are presented as icons at the right side of the preview's address bar and will be described below in the order in which they are shown. Element Inspector The element inspector allows quickly finding the source code of a specific element shown in the preview. After clicking on the element inspector icon to activate it, you can then click an element on the preview to automatically open the corresponding code in the editor on the left. ⚠️This utility is only available on projects with certain stacks. Chrome DevTools CodeSandbox previews also provide a built-in Chrome DevTools (opens in a new tab) utility. This provides all the debugging functionality from Chrome DevTools, including the Elements, Console, Sources, Network and Application tabs. ⚠️Because this utility is powered by Chrome, it is not available on non-Chrome browsers such as Firefox and Safari. Opening preview on a new tab The preview utility shown at the very right simply allows you to open a standalone preview in a new browser tab. How do Previews work? WebSocket Override We’ve patched WebSocket to ensure that the right URL is always accessed when opening a websocket. In case you try to access http://localhost:3000 (opens in a new tab) using a websocket, we’ll rewrite it to https://:id-3000.csb.app so the socket automatically connects to the right URL. This will often make hot module reloading work out of the box for frameworks like Vite. Service Worker Proxy If possible, we try to install a service worker in the preview that will proxy requests to localhost:3000 (opens in a new tab) to the corresponding dev URL. The service worker only proxies URLs that are going to localhost, or URLs that go to e.g. https://:id-3000.csb.app:4000. Configuring the Proxy The service worker proxy is enabled by default, but you can turn it off in two ways: Configure the dev server to respond with the x-csb-no-sw-proxy header when sending HTML responses (any value is possible) Or, set csbLocalProxyEnabled to false in the localStorage: localStorage.setItem('csbLocalProxyEnabled', 'false');. When the x-csb-no-sw-proxy header is set, we automatically add localStorage.setItem('csbLocalProxyEnabled', 'false'); to the returned HTML from the dev server.Interactive ReadmeTask'''
