title = ""
full_description = "ChangelogcommitCodeSandbox SDK sessions API, list running sandboxes & many improvementsTime for another big update to CodeSandbox SDK, including a new API and some top feature requests.Hey hey 👋 We're back with another CodeSandbox update! Now that we're back on a regular changelog schedule, let's look at the top features & improvements we shipped in the last 2 weeks. What's new? +-1CodeSandbox SDK: sessions API 👯 We introduced a new API to CodeSandbox SDK, which allows you to create multiple users in a single sandbox, allowing for collaborative editing and sharing sandboxes publicly. This has been a top feature request and it unlocks some cool use cases like allowing multiple users to connect to the same sandbox/branch and collaboratively edit files. It also enables creating anonymous previews. More details in our Docs. +-3Coming soon - CodeSandbox SDK support for Sandpack 👀 We have the first working prototype of Sandpack running CodeSandbox SDK! This will allow you to run server-side sandboxes directly in Sandpack, which in turn will allow for easier integration of CodeSandbox SDK for use cases that require an in-browser playground/editor. More updates soon! +-3Instant node_modules ⚡ With this experimental feature, we mount a FUSE filesystem for node_modules. This FS lazily serves contents from a global pnpm store (shared by all VMs) based on pnpm-lock.yaml. This reduces npm installation time (from scratch, basic Next.js project) from 8s to 25ms and the node_modules folder is deduplicated across all VMs, saving a lot of disk space. This will make creating new VMs from scratch much faster, in case you don't have a snapshot yet available. The functionality is currently behind a feature flag; in the next update, we'll open it up to play with. +-3CodeSandbox SDK: list running sandboxes 📃 You can now list running sandboxes programmatically or via the CLI, making it easier to monitor and manage active environments. Filter by status or tag, retrieve sandbox details in bulk, and even automate mass hibernation or shutdown. These updates improve sandbox management at scale, with more runtime insights coming soon. CodeSandbox SDK Improvements & Bug Fixes +-3Added sandbox.keepActiveWhileConnected(enabled: boolean) to keep a sandbox from hibernating while the SDK is connected (for more granular hibernation control). +-3Added support for env and cwd in the sandbox.shells.run API. +-3ESM builds should now (finally) work properly in serverless environments! +-3.csbignore, .gitignore, and .dockerignore files will not be part of Snapshot Builder's output anymore. +-3Removed the unexpected behavior that kept a sandbox alive for 2x hibernation timeout if a client was connected. +-3More improvements to memory snapshot loading, which now allows CodeSandbox SDK to resume & clone VMs ~100-200ms faster. +-3Fixed a bug in CodeSandbox SDK where child processes of a process would not always get terminated when terminating a shell. +-3Increased the limit for sandbox tags to 64 characters to support users wanting to use UUIDs as tags. +-3WebSocket requests will not wake a VM anymore from hibernation; HTTP requests will still wake a VM. +-3Several improvements to the CodeSandbox SDK implementation in Together Code Interpreter. General Improvements & Bug Fixes +-3Fixed an issue that caused the terminal to run start tasks in an infinite loop in Python Devboxes. +-3Fixed an issue in our style loader that resulted in an error when using CSS @import statements from node_modules dependencies. +-3Improved the 502 error message when a Devbox preview breaks, namely when the VM runs out of memory. +-3Fixed an issue with the IDs of archived sandboxes. +-3Fixed an issue with the subscription management buttons not displaying correctly in the workspace settings for some annual Pro workspaces. +-3Fixed an issue with mangled CDN URLs when a string was used in the alias. +3Several other general improvements and bug fixes, mostly focused on improving UX and stability. And that's all we have for you today. We're thrilled to see so many people building exciting projects on top of CodeSandbox SDK! We have lots of exciting features ahead, so stay tuned. See you soon 👋commitJoining Together AI, launching CodeSandbox SDK & tons of improvementscommitNew Status Page, Sandpack Accessibility Improvements and Tons of FixescommitNew Template Picker, Sandpack Static File Support and Several ImprovementscommitNew Editor Powered by Web VS Code, Test Runner, and Several ImprovementscommitWeb VS Code Beta and Several ImprovementscommitStorybook Add-on, SOC 2, Unlimited Public Sandboxes and morecommitVS Code Web, Extension Marketplace and Dashboard UpdatescommitNew Repo Import Flow, Annual Plans, Better AI and UX ImprovementscommitVM Resizing and Dashboard & Editor ImprovementscommitCodeSandbox CDE, Usage-based Billing, and Live SessionscommitUnified Platform, Codeium and VS Code editorcommitEnterprise, Dev Containers, GPT-4 and VS Code extension updatecommitAI Commit Messages 2.0, new command palette and morecommitSSO, VIM mode, dependency picker and Chrome DevToolscommitCode reviews, editor updates and custom themescommitBoxy AI assistant, Go support, VS Code overhaul, and editor updatescommitPHP support, faster microVMs and better stabilitycommitSeamless branching, workspace scopes, Python support and many morecommitDocker support, Rust, seamless branching and much morecommitCloud Sandboxes for iOS & VS Code, new onboarding and morecommitNew dashboard, repositories and cloud sandboxescommitThe realtime multiclient collaboration updatecommitGitHub App updates, better Astro support and a new login methodcommitVS Code Insider support, faster project imports and much morecommitSandpack meets Dracula, support for custom NPM registries and bug fixescommitBetter list-view and rename branches from the command palettecommitPublic beta, new documentation and GiHub AppcommitAlways on previews, VScode improvements and better UI consistencies.commitSandpack June UpdatecommitBinary files on mobile, more syntax highlights and repository renames.commitDrag and drop file upload, better framework support and more.commitFirecracker by default, more storage and more FPS.commitSandpack April & May UpdatecommitProtected branches, bulk discard and relative file path.commitCodeSandbox May UpdatecommitSandpack March UpdatecommitAnnouncing CodeSandbox ProjectscommitSandpack February UpdatecommitMeet the new CodeSandboxcommitSandpack January UpdatecommitSandpack Devtools have landedcommitWelcome to our release notes"
