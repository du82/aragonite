full_description = "This privacy and cookie statement allows you to learn about the way CodeSandbox B.V. (hereinafter: “CodeSandbox” or “we”) controls and processes data about you. Additionally, this statement allows you to learn about the types of data we collect and how we use, share and secure this data and how you can exercise your privacy rights. During the processing of your personal data via our services and website https://codesandbox.io/ we comply with the General Data Protection Regulation (‘GDPR’). This means we: We obtain various personal data from you. We specify for each purpose what data we obtain from you, for what purpose we process these data and for how long they are stored. If you have any questions or would like to know exactly what information we store about you, please contact us. Our contact details are mentioned at the bottom of this privacy and cookie statement. We want to be as open as possible about how we treat your personal data, how you should be able to access and control your data and how you can use our services. We will not sell, rent or lease your personal data to anyone, except in case we sell our business or part thereof to another company. We use your personal data to provide our services to you (performance of contract). Certain features of our service require you to register beforehand to gain access to a secured platform/portal environment, including a management environment where you can set, specify and change settings. We will keep track of your activities for proof. In this context, you will be asked to provide information about yourself and choose login data for the account that we will set up for you, and/or use an account with a third-party service such as GitHub, Apple or Google to function as your login data. If you want to know in what ways these parties use your personal data, please read the privacy statements of the respective platforms. We store this information until you close your account. We will retain this data so that you do not have to re-enter it every time you visit our website to use certain features of our service, and in order to contact you in connection with the performing the contract, invoicing and payment, and to provide an overview of the products and services you have purchased from us."
