["https://codesandbox.io/changelog/2024-06-30-vs-code-web-beta"]
title = ""
full_description = "arrow_backChangelog•codesandboxWeb VS Code Beta and Several ImprovementsOur June 2024 CodeSandbox update is all about our evolving editor and stability improvements!Hello there 👋 A brand-new month is upon us, which means we're back with a fresh CodeSandbox update! After months of non-stop shipping, June was mainly focused on our editor and enhancing our overall stability. So, let's unpack yet another changelog! What's new? +-2VS Code Web editor (beta) 🌟 After several weeks of testing and iterations based on feedback from users who tested the experimental VS Code Web editor, it is now available in beta to everyone! To enable the beta editor, click the “VS Code Web” button at the right of the editor’s top bar. Improvements & Bug Fixes +-3Added an option to ensure shared URLs open in the legacy editor by using a ?editorMode=v1 query string in the address bar. It is also possible to access the legacy editor by disabling 'Unified platform editor' in the Experiments tab of the User Settings. +-3Improve the styling of the VS Code Web editor sidebar and DevTools extension. +-1Fix an issue where SSO authentication wasn’t shown in a Sandbox error message. +-3Update the authentication flow of Sandbox and Devbox preview URLs. +-3Update VM Pitcher images to Ubuntu 24.04 (LTS) and upgrade Docker to version 25 inside VMs. +-2Fix an issue that prevented Sandboxes and Sandpack from accessing the clipboard API. +-3Fix a UI issue that prevented Free workspaces from creating API tokens. +-3Fix a database bug that temporarily prevented using CodeSandbox CI. +-3Fix a UI issue that allowed moving templates in folders. +-3Fix follow mode not working in the VS Code Web editor. +-3Fix the title shown on Sandbox/Devbox info tab. +-3Fix an issue with the default storage allocated to Pro workspace VMs. +-3Fix an issue with keyboard shortcuts in a preview’s empty state. +4Several other general improvements and bug fixes, mostly focused on improving stability. And that's a wrap on June for us here at CodeSandbox! Remember to drop by our community platform to leave your feedback and feature requests! See you in the next one 👋arrow_backBack to releases"
