["https://codesandbox.io/changelog/2024-07-31-vs-code-web-test-runner-improvements"]
title = ""
full_description = "arrow_backChangelog•codesandboxNew Editor Powered by Web VS Code, Test Runner, and Several ImprovementsOur July 2024 CodeSandbox update brings a shiny new editor, old features reborn, and many improvements.Hi there 👋 We are back with one of the most exciting updates of 2024 so far! After a lot of hard work, iteration and user feedback, we have launched a major editor update and some highly-requested features and improvements. Let's jump right into it! What's new? +1New editor powered by VS Code Web 🔥 After additional testing with thousands of beta users, we have officially rolled out our new editor powered by VS Code Web. Our biggest editor overhaul in years combines the familiarity and extensibility of VS Code Web with the power of CodeSandbox DevTools. For now, you can revert to the old experience by clicking “Disable VS Code Web” at the editor's top right. +-2The test runner is back and better than ever 🧪 Many of our users have relied on the tests feature of our legacy editor for educational purposes and prototyping new features in isolation. Now, it's available in our new editor and has some improvements like test auto-detection and pinning. +-2Major overhaul of the Docs 📄 With the launch of the new editor, we saw the perfect opportunity to bundle a series of updates to our Docs. We have added and updated documentation pages for the main product flows and freshened up our FAQ with questions our community shared over the past few months. Improvements & Bug Fixes +-3Enhanced trust verifications and prompts to deter phishing. +-3Several updates and fixes to Sandpack. +-2Improved the UX of error messages: 404 message for unauthenticated users; max-size message. +-3Improved the UI of the dependency picker. +-3Fixed an issue when a private registry has an invalid URL. +-3Fixed an issue where the 'VS Code beta' modal appeared on every file open. +-3Fixed an issue where a search with special characters crashed the Sandbox. +-3Removed Boxy AI assistant. +-3Removed CodeSandbox for iOS from the App Store. +-1Several CI/CD updates, improvements and fixes. +-2Several updates, improvements and fixes to draft limits, contribution branches, default user authorizations, Sandbox archiving, warnings, branch deletion, and internal tools. +4Several other general improvements and bug fixes, mostly focused on improving stability. And with that, we bid July adieu! Remember to drop by our community platform to leave your feedback and feature requests! See you in the next one 👋arrow_backBack to releases"
