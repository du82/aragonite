["https://codesandbox.io/changelog/2023-04-28-php-faster-vms"]
title = ""
full_description = "arrow_backChangelog•codesandboxPHP support, faster microVMs and better stabilityRunning code in the cloud just got a whole lot better!Hey everyone! How was your April? Yes, we know April was a long time ago but... we finally had a bit of the time to go through our very long list of new features, improvements and bugfixes. So, here is our third changelog of 2023! What's new? +-3CodeSandbox gets official support for PHP 🐘 By adding official PHP support, we allow anyone to run a powerful cloud environment to develop PHP projects—for personal, work and open-source projects. Plus, we added Intelephense support with auto-completion, auto-formatting, linting and even type definitions (when applicable). +-3Faster microVMs ⚡ We introduced lazy shared snapshot syncing, which has improved our average fresh start VM timings by 1.75x and our resume VM timings by 2x. On our P99 the improvement is even more staggering: across the board (start & resume) a 3x speedup. Saving snapshots is 1.5x faster. +-1Seamless branching for anonymous users +-3Introduced a new 'billing manager' team role +-3Introduced private package support in Sandpack CodeSandbox for iOS Updates +-3Introduced PHP support +-3Added template categories with sandbox templates for front-end, back-end and new languages +-3Added support to convert browser sandboxes into cloud sandboxes +-3Introduced contextual tooltips to help you learn as you code Improvements & Bug Fixes +-3Improved the reconnecting behavior +-3Improved the command pallete, which is now much faster, especially on bigger codebases +-3Added a tab to the browser editor allowing users to upgrade to cloud sandboxes +-3Fixed an authentication issue when the same email is used both for Google and GitHub +-3Pitcher now handles any changes to imported `.gitignore` files and delestes them +-3Improved how terminals are disposed after Pitcher disconnects +-3Improved the generation of og-images from sandboxes That's all, folks! Feel free to reach out if you have any questions or feedback. We're on Discord! Catch you on the next one 👋arrow_backBack to releases"
