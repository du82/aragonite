title = "CodeSandbox Education Plans – CodeSandbox"
description = "Our education plans provide special discounts for those empowering the next generation of developers."
full_description = "EditorPlansEducation PlansCodeSandbox Education Plans One of the core values of CodeSandbox is empowerment: enabling creators to feel like they can build without limits. Our education plans allow us to support those learning to code and those empowering the next generation of developers. These plans include special discounts for access to CodeSandbox Pro, as described below. Discounts for Students Verified student accounts are eligible for a discount of 25% off on CodeSandbox Pro (opens in a new tab), which applies both to the base plan and on-demand credits. To apply and claim the discount code, contact us from your valid student email address. Discounts for Educators at Non-Profit Organizations Verified educators at non-profits are eligible for a discount of 50% off on CodeSandbox Pro (opens in a new tab), which applies both to the base plan and on-demand credits. Eligible accounts also get 500 extra VM credits included at no extra charge. Access to workspaces with more than 20 editors is also possible as part of this discount upon request. Note: To be eligible to be added to the workspace, users' email addresses must belong to the beneficiary organization's domain. To apply, claim the discount code, or get further pricing information, contact us from your organization's email address. Discounts for Educators at Universities and Tuition-Charging Organizations Verified educators at universities and educational organizations that charge tuition fees are eligible for a discount of 40% off on CodeSandbox Pro (opens in a new tab), which applies both to the base plan and on-demand credits. Eligible accounts also get 500 extra VM credits included at no extra charge. Access to workspaces with more than 20 editors is also possible as part of this discount upon request. Note: To be eligible to be added to the workspace, users' email addresses must belong to the beneficiary organization's domain. To apply, claim the discount code, or get further pricing information, contact us from your organization's email address. Application Requirements Applicants must have a valid CodeSandbox workspace that fits the eligibility criteria. Applicants must provide valid proof of their eligibility for the education plan they're applying for. Notes and Disclaimer CodeSandbox workspaces that receive an education discount must only be used for the approved project and usage. If we discover that the workspace is being used for other projects, we reserve the right to remove access to the discount without notice. Discounts are valid for 12 months. Extensions are possible and require submitting a new application. Unless clearly stated otherwise, the benefits and discounts of education plans are not cumulative with any other promotions. If, at any time, an eligible individual or organization stops meeting the eligibility criteria, the workspace owner must contact us to find a suitable solution. We reserve the right to update or deprecate CodeSandbox education plans at any time, after providing 30 days' notice. CodeSandbox FriendsFAQ"
