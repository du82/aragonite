["https://codesandbox.io/blog/building-web-animations-with-greensock"]
title = "Build fun web animations and win prizes - CodeSandbox Challenges - CodeSandbox"
description = "Participate in the CodeSandbox / GSAP web animation challenges and win fantastic prizes."
full_description = "arrow_back Blog chevron_right Highlight May 18, 2022Build fun web animations and win prizes - CodeSandbox ChallengesParticipate in the CodeSandbox / GSAP web animation challenges and win fantastic prizes.Adewale AbatishareShareWeb animations, especially when used right, help create fun, interactive and engaging experiences for your website visitors. However, more often than not, they can be quite difficult to implement. As CodeSandbox is dedicated to making web developers as productive as possible, we partnered with Greensock (GSAP) to host some fun and creative challenges for the month of April. Greensock puts a lot of animation power in the hands of developers through it's robust JavaScript library and they have now made all the Club Greensock premium plugins now available on CodeSandbox via npm. 🔥 /s/gsap-bonus-plugins-starter-m26x0?from-embed Every week through April, we shared a new creative coding challenge and a sandbox to get started building something fun. Challenges The first challenge encouraged everyone to build something fun on Scrolling animations with ScrollTrigger. There were a lot of amazing submissions but Victor and Ismael took the top spots. Here comes the sun by Ismael GSAP x CodeSandbox by Victor The next challenge involved animating SVG Strokes with DrawSVG. Even more creative entries but our winners were Christian and av. Cricut Drawings by Christian https://codesandbox.io/s/r3zv9l?from-embed Indiana Jones by AV The final challenge using Greensock’s Flip plugin had our previous winners - Victor and Christian topping the charts again. So the well deserved runner ups - Toso and Julia took the prizes for this one. Flip animation by Christian https://codesandbox.io/s/cg2fhc?from-embed Knowing the Alphabet by Victor SpaceX by Toso Tile builder by Julia We want to say a big thanks to our judges who voted every week for their favorite demos despite how tough it got. Ace from CodeSandbox Alex Trost from Prismic Arno Di Nunzio Cassie Evans from GreenSock 💚 Fabio Ottaviani Gianmarco Simone Jake Whiteley from GC Mike Wagz Pim de Wit Ryan LaBar from Elegant Seagulls Stefan Vitasovic Stay up to date with @CodeSandbox and @Greensock on Twitter.arrow_back Return to all articles"
