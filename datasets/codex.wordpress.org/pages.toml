title = "Documentation Contributor Handbook – Make WordPress Documentation"
description = "The community site where WordPress code is created and shared by the users. This is where you can download the source code for WordPress core, plugins and themes as well as the central location for community conversations and organization.  https://wordpress.org/"
full_description = '''Documentation Contributor Handbook In this article Table of ContentsWho is in the Documentation team? Prior knowledge What is needed? Where is the stuff? Getting started Reporting documentation issues Guides Resources ↑ Back to top This handbook contains information about how to contribute to WordPress documentation and be a member of the Documentation team. Who is in the Documentation team? Documentation team consists of volunteers and a few sponsored contributors with various backgrounds, levels of knowledge and experience working with WordPress. The team is maintaining both: end user and developer documentation, which creates tasks for both: end users and developers, as well as technical writers. Get to know the team members at our team’s page. Prior knowledge The Documentation team is one of rare WordPress Make teams that can benefit a lot from contributors without any prior knowledge or experience with WordPress. This valuable skill can give us insight how well documentation is written for people who are just starting to use WordPress. Having a lot of development experience with WordPress is a skill needed to make sure all code examples in documentation are following WordPress Coding Standards and best practices. Any skills, knowledge and experience level in between these two examples from above are welcomed and very valuable to creating and improving WordPress documentation. To get a better idea of all the ways you can contribute to WordPress documentation, take a look at our team roles page. What is needed? In order to contribute to the Documentation team you’ll need the following: WordPress.org account. WordPress Slack account (wordpress.orgWordPress.org The community site where WordPress code is created and shared by the users. This is where you can download the source code for WordPress core, plugins and themes as well as the central location for community conversations and organization. https://wordpress.org/ account is needed). GitHub account – connect your GitHub account to your WordPress.org profile. Where is the stuff? Documentation End user documentation (called HelpHub) – https://wordpress.org/documentation/ Developer documentation (called DevHub) – https://developer.wordpress.org/ Contributor documentation (this Handbook) – https://make.wordpress.org/docs/handbook/ Team collaboration Blog – for meeting agendas and summaries (and anything related to Docs team). Slack channel #docs – where meetings are happening (and all communication regarding the team itself). GitHub repository – where issues for all documentation are reported, discussed and worked on. Meetings (alternating every week) on Tuesdays at 2PM UTC: Regular meeting with agenda and summary published on our blog. Issues triage where we discuss issues from the GitHubGitHub GitHub is a website that offers online implementation of git repositories that can easily be shared, copied and modified by other developers. Public repositories are free to host, private repositories require a paid subscription. GitHub introduced the concept of the ‘pull request’ where code changes done in branches by contributors can be reviewed and discussed before being merged be the repository owner. https://github.com/ repository. The next meeting is on Tuesday, 14:00 UTC. Getting started We have recorded several onboarding sessions to introduce you to various parts of WordPress documentation and help you get started with the team. These sessions are, more or less, high level overview which should answer the most common questions new contributors usually have. We do not, by any means, assume you will be completely ready to start contributing after just watching these sessions. Feel free to ask any questions you have after watching sessions (and you will most likely have them) in our Slack channel. Reporting documentation issues Any issue found in WordPress documentation should be reported in our GitHub repository. Please note that this repository does not hold any documentation whatsoever. It is used only to report, discuss and work on WordPress documentation issues. Here you can request new page in documentation or an update for the existing one. Guides Official documentation Style guide – All new documentation should follow these guidelines. It is also planned that all existing documentation be updated to meet them. Resources What is Open Source? Introduction to Contributing to WordPress What about the Codex? The Codex is a community-created repository for WordPress documentation. Anyone can edit any of the information on the Codex, and only a WordPress.orgWordPress.org The community site where WordPress code is created and shared by the users. This is where you can download the source code for WordPress core, plugins and themes as well as the central location for community conversations and organization. https://wordpress.org/ user account is required to create a page. At this moment in time, the Codex is not actively maintained and pages are being migrated to both HelpHub and DevHub. [{"type":"post","id":141,"postID":141,"cssClasses":"handbook post-141 type-handbook status-publish hentry author-siobhan make-handbook","parentID":0,"titleRaw":"Documentation Contributor Handbook","titleFiltered":"Documentation Contributor Handbook","titleWasGeneratedFromContent":false,"contentRaw":"<!-- wp:paragraph -->\n<p>This handbook contains information about how to contribute to WordPress documentation and be a member of the Documentation team.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:heading -->\n<h2 class=\"wp-block-heading\">Who is in the Documentation team?<\/h2>\n<!-- \/wp:heading -->\n\n<!-- wp:paragraph -->\n<p>Documentation team consists of volunteers and a few sponsored contributors with various backgrounds, levels of knowledge and experience working with WordPress. The team is maintaining both: end user and developer documentation, which creates tasks for both: end users and developers, as well as technical writers. Get to know the team members at our&nbsp;<a href=\"https:\/\/make.wordpress.org\/docs\/handbook\/the-team\/\">team's page<\/a>.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:heading {\"level\":3} -->\n<h3 class=\"wp-block-heading\">Prior knowledge<\/h3>\n<!-- \/wp:heading -->\n\n<!-- wp:paragraph -->\n<p>The Documentation team is one of rare WordPress Make teams that can benefit a lot from contributors without any prior knowledge or experience with WordPress. This valuable skill can give us insight how well documentation is written for people who are just starting to use WordPress.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>Having a lot of development experience with WordPress is a skill needed to make sure all code examples in documentation are following&nbsp;<a href=\"https:\/\/developer.wordpress.org\/coding-standards\/\">WordPress Coding Standards<\/a>&nbsp;and best practices.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>Any skills, knowledge and experience level in between these two examples from above are welcomed and very valuable to creating and improving WordPress documentation.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>To get a better idea of all the ways you can contribute to WordPress documentation, take a look at our&nbsp;<a href=\"https:\/\/github.com\/WordPress\/Documentation-Issue-Tracker\/issues\/385\">team roles<\/a>&nbsp;page.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:heading -->\n<h2 class=\"wp-block-heading\">What is needed?<\/h2>\n<!-- \/wp:heading -->\n\n<!-- wp:paragraph -->\n<p>In order to contribute to the Documentation team you'll need the following:<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:list -->\n<ul><!-- wp:list-item -->\n<li><a href=\"https:\/\/login.wordpress.org\/register\">WordPress.org account<\/a>.<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><a href=\"https:\/\/make.wordpress.org\/chat\/\">WordPress Slack account<\/a>&nbsp;(wordpress.org account is needed).<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><a href=\"https:\/\/github.com\/signup\">GitHub account<\/a>&nbsp;\u2013 connect&nbsp;<a href=\"https:\/\/make.wordpress.org\/core\/2020\/03\/19\/associating-github-accounts-with-wordpress-org-profiles\/\">your GitHub account to your WordPress.org profile<\/a>.<\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:heading -->\n<h2 class=\"wp-block-heading\">Where is the stuff?<\/h2>\n<!-- \/wp:heading -->\n\n<!-- wp:list {\"ordered\":true} -->\n<ol><!-- wp:list-item -->\n<li>Documentation<!-- wp:list -->\n<ul><!-- wp:list-item -->\n<li><strong>End user<\/strong> documentation (called HelpHub) -\u00a0<a href=\"https:\/\/wordpress.org\/support\/\">https:\/\/wordpress.org\/documentation\/<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><strong>Developer<\/strong> documentation (called DevHub) -&nbsp;<a href=\"https:\/\/developer.wordpress.org\/\">https:\/\/developer.wordpress.org\/<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><strong>Contributor<\/strong> documentation (this Handbook) -&nbsp;<a href=\"https:\/\/make.wordpress.org\/docs\/handbook\/\">https:\/\/make.wordpress.org\/docs\/handbook\/<\/a><\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list --><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Team collaboration<!-- wp:list -->\n<ul><!-- wp:list-item -->\n<li><a href=\"https:\/\/make.wordpress.org\/docs\/\">Blog<\/a>&nbsp;\u2013 for meeting agendas and summaries (and anything related to Docs team).<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><a href=\"https:\/\/wordpress.slack.com\/archives\/C02RP4WU5\">Slack channel #docs<\/a>&nbsp;\u2013 where meetings are happening (and all communication regarding the team itself).<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><a href=\"https:\/\/github.com\/WordPress\/Documentation-Issue-Tracker\">GitHub repository<\/a>&nbsp;\u2013 where issues for all documentation are reported, discussed and worked on.<\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list --><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>Meetings (alternating every week) on\u00a0<a href=\"https:\/\/mytime.io\/2pm\/UTC\">Tuesdays at 2PM UTC<\/a>:<!-- wp:list -->\n<ul><!-- wp:list-item -->\n<li><strong>Regular meeting<\/strong>&nbsp;with <a href=\"https:\/\/make.wordpress.org\/docs\/tag\/agenda\/\">agenda<\/a> and <a href=\"https:\/\/make.wordpress.org\/docs\/tag\/summary\/\">summary<\/a> published on our blog.<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><strong>Issues triage<\/strong>&nbsp;where we discuss&nbsp;<a href=\"https:\/\/github.com\/WordPress\/Documentation-Issue-Tracker\/issues\">issues<\/a>&nbsp;from the GitHub repository.<\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li>The&nbsp;<strong>next meeting<\/strong>&nbsp;is on [time relative]Tuesday, 14:00 UTC[\/time].<\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list --><\/li>\n<!-- \/wp:list-item --><\/ol>\n<!-- \/wp:list -->\n\n<!-- wp:heading -->\n<h2 class=\"wp-block-heading\">Getting started<\/h2>\n<!-- \/wp:heading -->\n\n<!-- wp:paragraph -->\n<p>We have recorded several&nbsp;<a href=\"https:\/\/make.wordpress.org\/docs\/handbook\/get-involved\/\">onboarding sessions<\/a>&nbsp;to introduce you to various parts of WordPress documentation and help you get started with the team. These sessions are, more or less, high level overview which should answer the most common questions new contributors usually have. We do not, by any means, assume you will be completely ready to start contributing after just watching these sessions. Feel free to ask any questions you have after watching sessions (and you will most likely have them) in our&nbsp;<a href=\"https:\/\/wordpress.slack.com\/archives\/C02RP4WU5\">Slack channel<\/a>.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:heading {\"level\":3} -->\n<h3 class=\"wp-block-heading\">Reporting documentation issues<\/h3>\n<!-- \/wp:heading -->\n\n<!-- wp:paragraph -->\n<p>Any issue found in WordPress documentation should be reported in our&nbsp;<a href=\"https:\/\/github.com\/WordPress\/Documentation-Issue-Tracker\/\">GitHub repository<\/a>. Please note that this repository&nbsp;<strong>does not<\/strong>&nbsp;hold any documentation whatsoever. It is used only to report, discuss and work on WordPress documentation issues. Here you can&nbsp;<a href=\"https:\/\/github.com\/WordPress\/Documentation-Issue-Tracker\/issues\/new?assignees=&amp;labels=new+document&amp;template=new-doc.md\">request new page<\/a>&nbsp;in documentation or an&nbsp;<a href=\"https:\/\/github.com\/WordPress\/Documentation-Issue-Tracker\/issues\/new?assignees=&amp;labels=tracking+issue%2C+needs+triage&amp;template=doc-issue-fix.md\">update for the existing one<\/a>.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:heading -->\n<h2 class=\"wp-block-heading\">Guides<\/h2>\n<!-- \/wp:heading -->\n\n<!-- wp:list -->\n<ul><!-- wp:list-item -->\n<li>Official documentation&nbsp;<a href=\"https:\/\/make.wordpress.org\/docs\/style-guide\/\">Style guide<\/a>&nbsp;- All new documentation should follow these guidelines. It is also planned that all existing documentation be updated to meet them.<\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:heading -->\n<h2 class=\"wp-block-heading\">Resources<\/h2>\n<!-- \/wp:heading -->\n\n<!-- wp:list -->\n<ul><!-- wp:list-item -->\n<li><a href=\"https:\/\/learn.wordpress.org\/lesson-plan\/what-is-open-source\/\">What is Open Source?<\/a><\/li>\n<!-- \/wp:list-item -->\n\n<!-- wp:list-item -->\n<li><a href=\"https:\/\/learn.wordpress.org\/tutorial\/an-introduction-to-contributing\/\">Introduction to Contributing to WordPress<\/a><\/li>\n<!-- \/wp:list-item --><\/ul>\n<!-- \/wp:list -->\n\n<!-- wp:separator {\"className\":\"is-style-wide\"} -->\n<hr class=\"wp-block-separator has-alpha-channel-opacity is-style-wide\" \/>\n<!-- \/wp:separator -->\n\n<!-- wp:paragraph -->\n<p>[info]<strong>What about the Codex?<\/strong> <\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>The <a href=\"https:\/\/codex.wordpress.org\">Codex<\/a> is a community-created repository for WordPress documentation. Anyone can edit any of the information on the Codex, and only a WordPress.org user account is required to create a page.<\/p>\n<!-- \/wp:paragraph -->\n\n<!-- wp:paragraph -->\n<p>At this moment in time, the Codex is not actively maintained and pages are being migrated to both <a href=\"https:\/\/wordpress.org\/support\">HelpHub<\/a> and <a href=\"https:\/\/developer.wordpress.org\/\">DevHub<\/a>. [\/info]<\/p>\n<!-- \/wp:paragraph -->\n\n#docs","contentFiltered":"<strong>What about the Codex?<\/strong> <\/p>\n\n\n\n<p>The <a href=\"https:\/\/codex.wordpress.org\">Codex<\/a> is a community-created repository for WordPress documentation. Anyone can edit any of the information on the Codex, and only a <span tabindex='0' class='glossary-item-container'>WordPress.org<span class='glossary-item-hidden-content'>'''
