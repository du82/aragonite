title = "WordPress Glossary – Documentation"
description = "This document is designed to offer definitions of various terms, exclusive to WordPress, that users may not be familiar with. If you are a contributor, please don’t add definitions for generic terms (API, PHP, JavaScript, etc…). Absolute Path (also known as a full path) The complete location of a file or directory within a computer […]"
full_description = 'WordPress Glossary In this article Table of ContentsAbsolute Path Absolute URI Action Admin Bar Ajax Apache API Array ASCII Atom Attribute sources Attributes Autosave Avatar Back End Binaries Block Block (Inserter) Library Block categories Block name Block styles Block supports Block Template parts Block Templates Block Themes Block type Blog Blogging Blogosphere Blogroll Bookmarklet Boolean Category Capabilities CGI Character Entity Character Set chmod Class Classic block Codex Collation Comments Content Content Management System cPanel CSS CVS Dashboard Database Database version Default theme Deprecated Developer DIV DNS DOM Domain name Draft Dynamic block Excerpt Feed Feed Reader Filter Footer area Front End FTP Full Site Editing or FSE Gallery gettext GMT Gravatar GUI Gutenberg Hack Hacking Header Image Hook Terminology Confusion Hosting provider .htaccess HTML IDE Inspector IP address ISAPI JavaScript Linux Local Styles Mac OS X MariaDB Menu Meta Microformats MIME Moblogging mod_rewrite Multisite MySQL Navigation Navigation Block Network News reader Nonce Open Source Options Output Compression Page (post type) Patterns Perl Permalink Permissions PHP phpMyAdmin Ping Pingback Plugin Port Post Post settings Post Slug Post Status Post Type Query Query Block Query String Query Variable QuickTag RDF Recordset Relative Path Relative URI RichText RSS RTL Robots.txt Role Screen Serialization Settings Sidebar Shell Shortcode Sidebar Site Site Editor Slug Smileys Spam SSH SSL Static block Stats String Structure tags Subversion SVC Syndication Tag Tagline Task Based Documentation Taxonomy Telnet Template Template Editing Mode Template Tag Term Text editor Theme Theme Blocks TinyMCE Toolbar Toolbar (in FSE) Trackback Transient Unicode Unix Unix Time URL UTC Web server Widget Widget Area XFN XHTML XML XML-RPC More Resources ↑ Back to top This document is designed to offer definitions of various terms, exclusive to WordPress, that users may not be familiar with. If you are a contributor, please don’t add definitions for generic terms (API, PHP, JavaScript, etc…). Absolute Path (also known as a full path) The complete location of a file or directory within a computer filesystem. An absolute path starts at the root directory (or drive letter) and continues up the directory hierarchy until the specific file or directory is reached. This contrasts with a relative path, which does not start at the root directory. The syntax of absolute paths differs by operating system. On Microsoft Windows, they begin with a drive letter and use a backslash to separate directory names. Absolute paths on macOS and Linux lack drive letters and use a forward slash as the directory separator. Examples: Windows: C:\Users\Matt\www\blog\images\icecream.jpg macOS: /Users/Matt/www/blog/images/icecream.jpg Linux: /home/Matt/www/blog/images/icecream.jpg To find the absolute filesystem path of the directory containing a web page, copy the code below into a new text file, save the file as path.php (thus making a simple PHP web page), and move that file to your web server. Then direct your web browser to the URL address of that file (e.g. http://www.example.com/path.php). <?php echo getcwd(); ?> See also: Path (computing) at Wikipedia Absolute URI (also known as a full URI) A URI that contains the complete location of a resource (as opposed to a relative URI). Examples: http://www.example.com/blog/images/icecream.jpg ftp://ftp.example.com/users/h/harriet/www/ Action In WordPress; an Action is a PHP function that is executed at specific points throughout the WordPress Core. Developers can create a custom Action using the Action API to add or remove code from an existing Action by specifying any existing Hook. This process is called “hooking“. For example: A developer may want to add code to the footer of a Theme. This could be accomplished by writing new function, then Hooking it to the wp_footer Action. Custom Actions differ from custom Filters because custom Actions allow you to add or remove code from existing Actions. Whereas custom Filters allow you to replace specific data (such as a variable) found within an existing Action. See also: Filter, Hook, Terminology Confusion Related articles: Actions, Action Reference, add_action() Forum posts: Filters vs. Actions Discussion and Explanation Admin Bar An area of the screen just above your site that gives you quick access to features such as adding a new post or editing your profile. It is only visible if you are logged in. The admin bar concept was added to WordPress in Version 3.1 and was replaced by the Toolbar in WordPress Version 3.3. To turn it on (or off), open the Dashboard and navigate to Administration > Users > Your Profile. Related articles: Toolbar See also: Your Profile Screen Ajax Ajax is a technique that web pages use to have the server perform certain processing without reloading the web page. For example, when you approve a comment in a WordPress blog, WordPress uses Ajax to change the comment’s status, and you see the change without having to reload the Comments screen. Related article: AJAX External link: AJAX (Wikipedia) Apache Apache is short for Apache HTTP Server Project, a robust, commercial-grade, featureful, and freely-available open source HTTP Web server software produced by the Apache Software Foundation. It is the most commonly used web server on the internet, and is available on many platforms, including Windows, Unix/Linux, and Mac OS X. Apache serves as a great foundation for publishing WordPress-powered sites. API Please refer to Wikipedia page for a definition. Array An array is one of the basic data structures used in computer programming. An array contains a list (or vector) of items such as numeric or string values. Arrays allow programmers to randomly access data. Data can be stored in either one-dimensional or multi-dimensional arrays. A one-dimension array seven (7) elements would be: 105200545310213405 The Template Tag wp_list_categories() uses a one-dimensional array for the ‘exclude’ parameter. An example of two-dimensional array, 7 by 3 elements in size, would be: 105200545310213405 1521014513223134512 501500499488552751952 External links: Array Programming at Wikipedia, Array at freedictionary.com ASCII ASCII (pronounced as “ask ee”) is a standard but limited character set containing only English letters, numbers, a few common symbols, and common English punctuation marks. WordPress content is not restricted to ASCII, but can include any Unicode characters. ASCII is short for American Standard Code for Information Interchange. External links: ASCII (Wikipedia, with character set table) Atom A format for syndicating content on news-like sites, viewable by Atom-aware programs called news readers or aggregators. See also: News reader, RSS, RDF External links: Atom (standard) at Wikipedia Attribute sources An object describing the attributes shape of a block. The keys can be named as most appropriate to describe the state of a block type. The value for each key is a function which describes the strategy by which the attribute value should be extracted from the content of a saved post’s content. When processed, a new object is created, taking the form of the keys defined in the attribute sources, where each value is the result of the attribute source function. Attributes The object representation of the current state of a block in post content. When loading a saved post, this is determined by the attribute sources for the block type. These values can change over time during an editing session when the user modifies a block, and are used when determining how to serialize the block. Autosave When you are writing or editing your posts and pages, the changes you make are automatically saved every 2 minutes. In the lower right corner of the editor, you’ll see a notification of when the entry was last saved to the database. Autosaves are automatically enabled for all posts and pages. There is only one autosave for each post/page. Each new autosave overwrites the previous autosave in the database. Related articles: Revision Management External links: WordPress.com Support – Autosave Avatar An avatar is a graphic image or picture that represents a user. See also: Gravatar Related articles: Using Gravatars External links: Avatar (computing) at Wikipedia Back End The back end is the area that authorized users can sign into to add, remove and modify content on the website. This may also be referred to as “WordPress”, “admin” or “the administration area”. Binaries Binaries refer to compiled computer programs, or executables. Many open source projects, which can be re-compiled from source code, offer pre-compiled binaries for the most popular platforms and operating systems. Block The abstract term used to describe units of markup that, composed together, form the content or layout of a webpage. The idea combines concepts of what in WordPress today we achieve with shortcodes, custom HTML, and embed discovery into a single consistent API and user experience. Block (Inserter) Library Primary interface for selecting from the available blocks, triggered by plus icon buttons on Blocks or in the top-left of the editor interface. Block categories These are not a WordPress taxonomy, but instead used internally to sort blocks in the Block Library. Block name A unique identifier for a block type, consisting of a plugin-specific namespace and a short label describing the block’s intent. e.g. core/image Block styles The CSS styles that are part of the block, either via its stylesheet or via the block markup itself. For example, a class attached to the block markup is considered block styles. Compare to Global Styles. In contraposition to Global Styles, block styles are sometimes referred to as Local Styles. Learn more about Block Styles. Block supports An API for blocks to declare what features they support. By declaring support for a feature, the API would add additional attributes to the block and matching UI controls for most of the existing block supports. See Block Supports reference documentation for a deep dive into the API. Block Template parts Building on Block Templates, these parts help set structure for reusable items like a Footer or Header that one typically sees in a WordPress site. They are primarily site structure and are never to be mixed with the post content editor. With Full Site Editing and block based themes, users can create their own arbitrary Template Parts, save those in the database for their site, and re-use them throughout their site. Template parts are equivalent – in blocks – of theme template parts. They are generally defined by a theme first, carry some semantic meaning (could be swapped between themes such as a header), and can only be inserted in the site editor context (within “templates”). Block Templates A template is a predefined arrangement of blocks, possibly with predefined attributes or placeholder content. You can provide a template for a post type, to give users a starting point when creating a new piece of content, or inside a custom block with the InnerBlocks component. At their core, templates are simply HTML files of block markup that map to templates from the standard WordPress template hierarchy, for example index, single or archive. This helps control the front-end defaults of a site that are not edited via the Page Editor or the Post Editor. See the templates documentation for more information. Block Themes A theme built in block forward way that allows Full Site Editing to work. The core of a block theme are its block templates and block template parts. To date, block theme templates have been HTML files of block markup that map to templates from the standard WordPress template hierarchy. Block type In contrast with the blocks composing a particular post, a block type describes the blueprint by which any block of that type should behave. So while there may be many images within a post, each behaves consistent with a unified image block type definition. Blog A blog, or weblog, is an online journal, diary, or serial published by a person or group of people. Blogs are commonly used by individuals, peer groups, companies, or organizations. Blogs often contain public as well as private content. Depending on the functionality of the CMS software that is used, some authors may restrict access — through the use of accounts or passwords — to content that is too personal to be published publicly. Blogging Blogging is the act of writing in one’s blog. To blog something is to write about something in one’s blog. This sometimes involves linking to something the author finds interesting on the internet. See also: Blogosphere, Blogroll Blogosphere The blogosphere is the subset of internet web sites which are, or relate to, blogs. See also: Blog, Blogroll Blogroll A blogroll is a list of links to various blogs or news sites. Often a blogroll is “rolled” by a service which tracks updates (using feeds) to each site in the list, and provides the list in a form which aggregates update information. The default blogroll (aka links) included in WordPress was removed in version 3.5. See also: Blog, Blogosphere, Feed, News reader External links: News aggregator at Wikipedia Bookmarklet A bookmarklet (or favelet) is a “faux” bookmark containing scripting code, usually written in JavaScript, that allows the user to perform a function. Examples: The delicious.com bookmarklets allow users to quickly post a link to their delicious.com bookmarks list. Tantek’s favelets Boolean A variable or expression which evaluates to either true or false. External links: PHP Boolean data type Category Each post in WordPress can be filed under one or more categories. Thoughtful categorization allows posts to be grouped with others of similar content and aids in the navigation of a site. Please note that a post category should not be confused with a link category, which is used to classify and manage links. Capabilities A capability is permission to perform one or more types of task. Each user of a WordPress site might have some permissions but not others, depending on their role. For example, users who have the Author role usually have permission to edit their own posts (the “edit_posts” capability), but not permission to edit other users’ posts (the “edit_others_posts” capability). WordPress comes with six roles and over fifty capabilities in its role-based access system. Plugins can modify the system. Related article: Roles and Capabilities External link: Role-based access control (Wikipedia) CGI CGI (Common Gateway Interface) is a specification for server-side communication scripts designed to transfer information between a web server and a web-client (browser). Typically, HTML pages that collect data via forms use CGI programming to process the form data once the client submits it. Character Entity A character entity is a method used to display special characters normally rese'
