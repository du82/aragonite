["https://codex.wordpress.org/FAQ_Developer_Documentation"]
title = "FAQ Developer Documentation « WordPress Codex"
description = "Blog Tool and Publishing Platform"
full_description = '''This article lists common questions for WordPress core developers, as well as developers of WordPress plugins and themes, and refers you to articles that contain the answers. There is also a list of resources at Developer Documentation, which might be of help. Yes. WordPress Coding Standards has a list of coding standards used by WordPress core developers, plugin developers, and theme authors. Definitely! See WordPress in Your Language for information on existing translations, and Translating WordPress to find out how you can help if your language's translation is missing or needs improvement. Subversion is the online program used to track changes and upgrades to WordPress for developers. See Using Subversion for more information. There is also an online browser for the WordPress Subversion repository. Problems with plugins are best reported to the plugin author (visit the plugin's home page to find out how to contact the author). For plugins that are included in the wp-plugins.org Plugin Repository, you can also report bugs in the wp-plugins.org TrackTickets site. Basic instructions on how to write a plugin for WordPress can be found in Writing a Plugin. The API of "Hooks" for plugins is described in Plugin API. There is also a comprehensive list of other plugin resources in Plugin Resources. Most plugin and theme authors choose to license their plugins and themes under the GPL. Also, keep in mind that if your theme or plugin incorporates code from another theme or plugin that uses the GPL, you will probably need to license your theme or plugin with the GPL as well. If your theme or plugin is completely independent of other WordPress code, themes, and plugins, then you can probably license it however you would like. While in theory supporting more databases is better than supporting one, in practice focusing on MySQL/MariaDB has a number of benefits. First, introducing support for databases other than MySQL/MariaDB would increase the testing load for all development quite a bit, as already the combinations of PHP versions, web servers like Apache, Lighttpd, and IIS, and Windows vs Linux cause a number of issues, multiplying that by an arbitrary number of database platforms is daunting.'''
year_published = 2025
