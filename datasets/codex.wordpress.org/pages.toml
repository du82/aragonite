full_description = "Languages: English • Español • 中文(简体) • suomi • Português do Brasil • Македонски • 한국어 • (Add your language) Welcome to the Codex Community Portal. This is the right place to start if you are wondering what the Codex is, and how to help with the documentation project of WordPress. No help is too small. Your effort counts! Contributing to WordPress guides you through the things you can do, besides writing documentation, to contribute to the project at large. The Codex Effort is guided by its 26 Admins. The Task List identifies who is working on what projects and offers a list of things that need to be done on the Codex, too. Leave a message on the User Talk page of any of the admins if you need help, or direction. You can also join the wp-docs mailing list and send a message to the list in case you have any questions. The admins are benevolent, and will help and mentor you, if you need that. If you need to contact anyone within the WordPress Administration, visit their WordPress Contact page. Check out Current events, which is on the sidebar on all pages to keep up with the community. You can also read the WordPress Planet to get your daily fix."
