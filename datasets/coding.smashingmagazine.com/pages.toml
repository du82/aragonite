title = "Team, Impressum, Legal Notice — Smashing Magazine"
description = "Founded in September 2006 in Germany, Smashing Magazine delivers reliable, useful, but most importantly practical articles to web designers and developers. We don’t care about trends; we care about things that work or fail in actual projects. We are — and always have been — independent. 17+ years, and still ongoing."
full_description = "About Us Team, Impressum, Legal NoticeSmashing FamilyFounded in September 2006 in Germany, Smashing Magazine delivers reliable, useful, but most importantly practical articles to web designers and developers. We don’t care about trends; we care about things that work or fail in actual projects. We are — and always have been — independent. 17+ years, and still ongoing.Quality MattersWe care about quality content. We never wanted to be a big publishing house: Our team is small, but it’s a truly wonderful team of people who really care about what they do. Passionate and dedicated. Honest and respectful. Professional but informal. Quirky and personal.Through our articles, digital books, job openings, conferences and membership, we are committed to nourishing productivity, improving design and development skills and finessing the work-life balance. Getting better, together, by learning from each other — that’s the spirit that has been our mantra for all these years.Questions? Please contact us via our contact form. Yep, email would be easier, but we literally get tons of emails; frankly it’s just easier for us to sort things and reply faster, you know.Alternatively, you can contact us via Twitter — we try to reply as fast as we can.You can also use our postal address for random or not-so-random messages:Smashing Media AGHabsburger Str. 12579104 FreiburgGermanyVAT ID (USt-ID): DE264172548Advertising on Smashing MagazineWe don’t have much advertising on our site apart from a few spots that help us pay the bills. We look for advertisers who provide a product or service that fits the needs of a web designer or developer.Some Smashing MetricsMonthly pageviews: 2,000,000+Unique visitors: 1,500,000+Twitter followers: 905,000+LinkedIn: 13,000+Newsletter subscribers: 208,000+Medium Followers: 140,000+Subscribers to our RSS Feed: 281,000Subscribers on Feedly: 257,000Interested? Please send a brief email to Mariona N. Jones at mac@smashingmagazine.com — she’ll respond as quickly as possible!The Smashing TeamAll articles are carefully curated, edited and prepared according to the high standards set in the magazine’s Publishing Policy. These guidelines are continually revised and updated to ensure that the quality of the published content is never compromised. Smashing Magazine is always expanding to provide more quality content for professionals working in web design.From left to right: Vitaly, Inge, Iris, Cosima, Ilya, Geoff, Amanda, Mariona, Melina, Ari, Noah, Jan, Yana, Charis, Jarijn, Marc, Tobi, Ricardo, and last but not least, our one-and-only Topple!Smashing Magazine’s Experts PanelBefore an article is published, it’s reviewed by independent reviewers — respected members of the design community who provide feedback to authors and review technical details. We are very grateful for the fantastic work of our Experts Panel; the magazine wouldn’t have the same quality without their profound expertise and support.Aaron Beall • Adam Lang • Addy Osmani • AJ Dimarucot • Alan Colville • Alexander Charchar • Alexander Dawson • Alma Hoffmann • Andrea Trasatti • Andreas Bovens • Andrei Zmievski • Andrew Berry • Andrew Maier • Andrey Savchenko • Andy Hume • Ann McMeekin • Anna Peterson • Átila Fassina • Barry Pollard • Bart Mroz • Bastian Allgeier • Brian LeRoux • Bruce Lawson • Bryan Allott • Carie Fisher • Carl Alexander • Carlos Lanenga • Chad Smith • Charlie Nielsen • Chris Coyier • Chris Day • Chris Everson • Chris Mills • Chris Poteet • Chris Shiflett • Christian Heilmann • Chui Chui Tan • Colin J. Ihrig • Dale Cruse • Dan Kielp • Dan Mayer • Dan McKenzie • Dan Rose • Daniel Pataki • Darryl Adie • Dave Donaldson • Dave Hogue • David Kadavy • David Platt • Derek Allard • Derek Johnson • Dirk Jesse • Dmitry Baranovskiy • Dominique Lederer • Donna Spencer • Douglas Bonneville • Dudley Storey • Ed Finkler • Edward Chen • Eli Grey • Elliot Jay Stocks • Eoin McGrath • Eugene Terehov • Fiona Battersby • Francisco Inchauste • Graham