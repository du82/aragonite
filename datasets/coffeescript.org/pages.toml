L_START' 1 closeOpenIndexes: -> startToken = null condition = (token, i) -> token[0] in [']', 'INDEX_END'] action = (token, i) -> if @tokens.length >= i and @tokens[i + 1][0] is ':' startToken[0] = '[' token[0] = ']' else token[0] = 'INDEX_END' @scanTokens (token, i) -> if token[0] is 'INDEX_START' startToken = token @detectEnd i + 1, condition, action 1"
