title = "repl.coffee"
full_description = '''fs = require 'fs' path = require 'path' vm = require 'vm' nodeREPL = require 'repl' CoffeeScript = require './' {merge, updateSyntaxError} = require './helpers' sawSIGINT = no transpile = no replDefaults = prompt: 'coffee> ', historyFile: do -> historyPath = process.env.XDG_CACHE_HOME or process.env.HOME path.join historyPath, '.coffee_history' if historyPath historyMaxInputSize: 10240 eval: (input, context, filename, cb) -> if tokens.length >= 2 and tokens[0].generated and tokens[0].comments?.length isnt 0 and "#{tokens[0][1]}" is '' and tokens[1][0] is 'TERMINATOR' tokens = tokens[2...] if tokens.length >= 1 and tokens[tokens.length - 1].generated and tokens[tokens.length - 1].comments?.length isnt 0 and "#{tokens[tokens.length - 1][1]}" is '' tokens.pop() ast = new Root new Block [new Call ast] js = ast.compile {bare: yes, locals: Object.keys(context), referencedVars, sharedScope: yes} if transpile js = transpile.transpile(js, transpile.options).code if isAsync result.then (resolvedResult) -> cb null, resolvedResult unless sawSIGINT sawSIGINT = no else cb null, result catch err updateSyntaxError err, input cb err runInContext = (js, context, filename) -> if context is global vm.runInThisContext js, filename else vm.runInContext js, context, filename addMultilineHandler = (repl) -> {inputStream, outputStream} = repl origPrompt = repl._prompt ? repl.prompt multiline = enabled: off initialPrompt: origPrompt.replace /^[^> ]*/, (x) -> x.replace /./g, '-' prompt: origPrompt.replace /^[^> ]*>?/, (x) -> x.replace /./g, '.' buffer: '' nodeLineListener = repl.listeners('line')[0] repl.removeListener 'line', nodeLineListener repl.on 'line', (cmd) -> if multiline.enabled multiline.buffer += "#{cmd}\n" repl.setPrompt multiline.prompt repl.prompt true else repl.setPrompt origPrompt nodeLineListener cmd return inputStream.on 'keypress', (char, key) -> return unless key and key.ctrl and not key.meta and not key.shift and key.name is 'v' if multiline.enabled unless multiline.buffer.match /\n/ multiline.enabled = not multiline.enabled repl.setPrompt origPrompt repl.prompt true return'''
