title = "command.coffee"
full_description = "fs = require 'fs' path = require 'path' helpers = require './helpers' optparse = require './optparse' CoffeeScript = require './' {spawn, exec} = require 'child_process' {EventEmitter} = require 'events' useWinPathSep = path.sep is '\\\\' helpers.extend CoffeeScript, new EventEmitter printLine = (line) -> process.stdout.write line + '\\n' printWarn = (line) -> process.stderr.write line + '\\n' hidden = (file) -> /^\\.|~$/.test file BANNER = ''' Usage: coffee [options] path/to/script.coffee [args] If called without options, `coffee` will run your script. ''' SWITCHES = [ [ '--ast', 'generate an abstract syntax tree of nodes'] ['-b', '--bare', 'compile without a top-level function wrapper'] ['-c', '--compile', 'compile to JavaScript and save as .js files'] ['-e', '--eval', 'pass a string from the command line as input'] ['-h', '--help', 'display this help message'] ['-i', '--interactive', 'run an interactive CoffeeScript REPL'] ['-j', '--join [FILE]', 'concatenate the source CoffeeScript before compiling'] ['-l', '--literate', 'treat stdio as literate style coffeescript'] ['-m', '--map', 'generate source map and save as .js.map files'] ['-M', '--inline-map', 'generate source map and include it directly in output'] ['-n', '--nodes', 'print out the parse tree that the parser produces'] [ '--nodejs [ARGS]', 'pass options directly to the \"node\" binary'] [ '--no-header', 'suppress the \"Generated by\" header'] ['-o', '--output [PATH]', 'set the output path or path/filename for compiled JavaScript'] ['-p', '--print', 'print out the compiled JavaScript'] ['-r', '--require [MODULE*]', 'require the given module before eval or REPL'] ['-s', '--stdio', 'listen for and compile scripts over stdio'] ['-t', '--transpile', 'pipe generated JavaScript through Babel'] [ '--tokens', 'print out the tokens that the lexer/rewriter produce'] ['-v', '--version', 'display the version number'] ['-w', '--watch', 'watch scripts for changes and rerun commands'] ] opts = {} sources = [] sourceCode = [] notSources = {} watchedDirs = {} optionParser = null exports.buildCSOptionParser = buildCSOptionParser = -> new optparse.OptionParser SWITCHES, BANNER"
