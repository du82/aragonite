title = "scope.litcoffee"
full_description = '''constructor: (@parent, @expressions, @method, @referencedVars) -> @variables = [{name: 'arguments', type: 'arguments'}] @comments = {} @positions = {} @utilities = {} unless @parent add: (name, type, immediate) -> return @parent.add name, type, immediate if @shared and not immediate if Object::hasOwnProperty.call @positions, name @variables[@positions[name]].type = type else @positions[name] = @variables.push({name, type}) - 1 temporary: (name, index, single=false) -> if single startCode = name.charCodeAt(0) endCode = 'z'.charCodeAt(0) diff = endCode - startCode newCode = startCode + index % (diff + 1) letter = String.fromCharCode(newCode) num = index // (diff + 1) "#{letter}#{num or ''}" else "#{name}#{index or ''}" freeVariable: (name, options={}) -> index = 0 loop temp = @temporary name, index, options.single break unless @check(temp) or temp in @root.referencedVars index++ @add temp, 'var', yes if options.reserve ? true temp'''
