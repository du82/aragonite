title = "nodes.coffee"
full_description = '''Error.stackTraceLimit = Infinity {Scope} = require './scope' {isUnassignable, JS_FORBIDDEN} = require './lexer' {compact, flatten, extend, merge, del, starts, ends, some, addDataToNode, attachCommentsToNode, locationDataToString, throwSyntaxError, replaceUnicodeCodePointEscapes, isFunction, isPlainObject, isNumber, parseNumber} = require './helpers' exports.CodeFragment = class CodeFragment constructor: (parent, code) -> @code = "#{code}" @type = parent?.constructor?.name or 'unknown' @locationData = parent?.locationData @comments = parent?.comments toString: -> compileWithoutComments: (o, lvl, method = 'compile') -> if @comments @ignoreTheseCommentsTemporarily = @comments delete @comments unwrapped = @unwrapAll() if unwrapped.comments unwrapped.ignoreTheseCommentsTemporarily = unwrapped.comments delete unwrapped.comments fragments = @[method] o, lvl if @ignoreTheseCommentsTemporarily @comments = @ignoreTheseCommentsTemporarily delete @ignoreTheseCommentsTemporarily if unwrapped.ignoreTheseCommentsTemporarily unwrapped.comments = unwrapped.ignoreTheseCommentsTemporarily delete unwrapped.ignoreTheseCommentsTemporarily fragments compileNodeWithoutComments: (o, lvl) -> @compileWithoutComments o, lvl, 'compileNode' compileToFragments: (o, lvl) -> o = extend {}, o o.level = lvl if lvl node = @unfoldSoak(o) or this node.tab = o.indent fragments = if o.level is LEVEL_TOP or not node.isStatement(o) node.compileNode o else node.compileClosure o @compileCommentFragments o, node, fragments fragments compileToFragmentsWithoutComments: (o, lvl) -> @compileWithoutComments o, lvl, 'compileToFragments' compileClosure: (o) -> @checkForPureStatementInExpression() o.sharedScope = yes func = new Code [], Block.wrap [this] args = [] if @contains ((node) -> node instanceof SuperCall) func.bound = yes else if (argumentsNode = @contains isLiteralArguments) or @contains isLiteralThis args = [new ThisLiteral] if argumentsNode meth = 'apply' args.push new IdentifierLiteral 'arguments' else meth = 'call' func = new Value func, [new Access new PropertyName meth] parts = (new Call func, args).compileNode o switch when func.isGenerator or func.base?.isGenerator parts.unshift @makeCode "(yield* " parts.push @makeCode ")" when func.isAsync or func.base?.isAsync parts.unshift @makeCode "(await " parts.push @makeCode ")" parts compileCommentFragments: (o, node, fragments) -> return fragments unless node.comments'''
