title = "helpers.coffee"
full_description = '''exports.ends = (string, literal, back) -> len = literal.length literal is string.substr string.length - len - (back or 0), len exports.count = (string, substr) -> num = pos = 0 return 1/0 unless substr.length num++ while pos = 1 + string.indexOf substr, pos num extend = exports.extend = (object, properties) -> for key, val of properties object[key] = val object exports.invertLiterate = (code) -> out = [] blankLine = /^\s*$/ indented = /^[\t ]/ listItemStart = /// ^ (?:\t?|\ {0,3}) # Up to one tab, or up to three spaces, or neither; (?: [\*\-\+] | # followed by `*`, `-` or `+`; [0-9]{1,9}\. # or by an integer up to 9 digits long, followed by a period; ) [\ \t] # followed by a space or a tab. /// insideComment = no for line in code.split('\n') if blankLine.test(line) insideComment = no out.push line else if insideComment or listItemStart.test(line) insideComment = yes out.push "# #{line}" else if not insideComment and indented.test(line) out.push line else insideComment = yes out.push "# #{line}" out.join '\n' buildLocationData = (first, last) -> if not last first else first_line: first.first_line first_column: first.first_column last_line: last.last_line last_column: last.last_column last_line_exclusive: last.last_line_exclusive last_column_exclusive: last.last_column_exclusive range: [ first.range[0] last.range[1] ] exports.extractAllCommentTokens = (tokens) -> allCommentsObj = {} for token in tokens when token.comments for comment in token.comments commentKey = comment.locationData.range[0] allCommentsObj[commentKey] = comment sortedKeys = Object.keys(allCommentsObj).sort (a, b) -> a - b for key in sortedKeys allCommentsObj[key] exports.buildTokenDataDictionary = buildTokenDataDictionary = (tokens) -> tokenData = {} for token in tokens when token.comments tokenHash = buildLocationHash token[2] exports.addDataToNode = (parserState, firstLocationData, firstValue, lastLocationData, lastValue, forceUpdateLocation = yes) -> (obj) -> locationData = buildLocationData(firstValue?.locationData ? firstLocationData, lastValue?.locationData ? lastLocationData) if obj?.updateLocationDataIfMissing? and firstLocationData? obj.updateLocationDataIfMissing locationData, forceUpdateLocation else obj.locationData = locationData'''
