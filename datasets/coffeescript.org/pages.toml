title = "coffeescript.coffee"
full_description = '''{Lexer} = require './lexer' {parser} = require './parser' helpers = require './helpers' SourceMap = require './sourcemap' exports.VERSION = packageJson.version exports.FILE_EXTENSIONS = FILE_EXTENSIONS = ['.coffee', '.litcoffee', '.coffee.md'] base64encode = (src) -> switch when typeof Buffer is 'function' Buffer.from(src).toString('base64') when typeof btoa is 'function' btoa encodeURIComponent(src).replace /%([0-9A-F]{2})/g, (match, p1) -> String.fromCharCode '0x' + p1 else throw new Error('Unable to base64 encode inline sourcemap.') withPrettyErrors = (fn) -> (code, options = {}) -> try fn.call @, code, options catch err throw err if typeof code isnt 'string' # Support `CoffeeScript.nodes(tokens)`. throw helpers.updateSyntaxError err, code, options.filename options = Object.assign {}, options generateSourceMap = options.sourceMap or options.inlineMap or not options.filename? filename = options.filename or helpers.anonymousFileName() checkShebangLine filename, code map = new SourceMap if generateSourceMap tokens = lexer.tokenize code, options unless options.bare? and options.bare is yes for token in tokens if token[0] in ['IMPORT', 'EXPORT'] options.bare = yes break nodes = parser.parse tokens if options.ast nodes.allCommentTokens = helpers.extractAllCommentTokens tokens sourceCodeNumberOfLines = (code.match(/\r?\n/g) or '').length + 1 sourceCodeLastLine = /.*$/.exec(code)[0] # `.*` matches all but line break characters. ast = nodes.ast options range = [0, code.length] ast.start = ast.program.start = range[0] ast.end = ast.program.end = range[1] ast.range = ast.program.range = range ast.loc.start = ast.program.loc.start = {line: 1, column: 0} ast.loc.end.line = ast.program.loc.end.line = sourceCodeNumberOfLines ast.loc.end.column = ast.program.loc.end.column = sourceCodeLastLine.length ast.tokens = tokens return ast fragments = nodes.compileToFragments options currentLine = 0 currentLine += 1 if options.header currentLine += 1 if options.shiftLine currentColumn = 0 js = "" for fragment in fragments'''
