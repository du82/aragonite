["https://cognigraph.com/ROAM_homepage"]
title = "ROAM: Realtime Optimally-Adapting Meshes"
full_description = 'The paper can be downloaded as: [PostScript] [PDF] [Gzipped Tar]. UCRL-JC-127870 Last modified: October 19, 1997 Our method, dubbed Real-time Optimally Adapting Meshes (ROAM), uses two priority queues to drive split and merge operations that maintain continuous triangulations built from pre-processed bintree triangles. We introduce two additional performance optimizations: incremental triangle stripping and priority-computation deferral lists. ROAM execution time is proportionate to the number of triangle changes per frame, which is typically a few percent of the output mesh size, hence ROAM performance is insensitive to the resolution and extent of the input terrain. Dynamic terrain and simple vertex morphing are supported. Compilation instructions are in LibGen*/README (generally, just cd into LibGen* and type "make"). Executables will be in LibGen*/bin . The primary site for LibGen distributions is http://www.cognigraph.com/LibGen .'
year_published = 2025
