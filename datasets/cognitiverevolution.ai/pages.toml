full_description = '''Latest Episodes US-China Relations: History, Culture, and AI Competition, with Noah Smith, from Econ 102 Latest Episodes New Jersey’s AI Moonshot: Governor Phil Murphy on Partnerships, Progress, and Preparedness In this special crossover episode of The Cognitive Revolution, Nathan introduces a conversation from The Inside View featuring Owain Evans, AI alignment researcher at UC Berkeley's Center for Human Compatible AI.Watch Episode HereRead Episode DescriptionIn this special crossover episode of The Cognitive Revolution, Nathan introduces a conversation from The Inside View featuring Owain Evans, AI alignment researcher at UC Berkeley's Center for Human Compatible AI. Evans and host Michael Trazzi delve into critical AI safety topics, including situational awareness and out-of-context reasoning. Discover Evans' groundbreaking work on the reversal curse and connecting the dots, exploring how large language models process and infer information. This timely discussion highlights the importance of situational awareness in AI systems, particularly in light of recent advancements in AI capabilities. Don't miss this insightful exploration of the evolving relationship between human and artificial intelligence.Check out "The Inside View" Podcast here: https://theinsideview.ai/Apply to join over 400 Founders and Execs in the Turpentine Network: https://www.turpentinenetwork....SPONSORS:Weights & Biases RAG++: Advanced training for building production-ready RAG applications. Learn from experts to overcome LLM challenges, evaluate systematically, and integrate advanced features. Includes free Cohere credits. Visit https://wandb.me/cr to start the RAG++ course today.Shopify: Shopify is the world's leading e-commerce platform, offering a market-leading checkout system and exclusive AI apps like Quikly. Nobody does selling better than Shopify. Get a $1 per month trial at https://shopify.com/cognitive.LMNT: LMNT is a zero-sugar electrolyte drink mix that's redefining hydration and performance. Ideal for those who fast or anyone looking to optimize their electrolyte intake. Support the show and get a free sample pack with any purchase at https://drinklmnt.com/tcr.Notion: Notion offers powerful workflow and automation templates, perfect for streamlining processes and laying the groundwork for AI-driven automation. With Notion AI, you can search across thousands of documents from various platforms, generating highly relevant analysis and content tailored just for you - try it for free at https://notion.com/cognitivere...Oracle: Oracle Cloud Infrastructure (OCI) is a single platform for your infrastructure, database, application development, and AI needs. OCI has four to eight times the bandwidth of other clouds; offers one consistent price, and nobody does data better than Oracle. If you want to do more and spend less, take a free test drive of OCI at https://oracle.com/cognitiveCHAPTERS:(00:00:00) About the Show(00:00:22) Sponsors: Weights & Biases RAG++(00:01:28) About the Episode(00:04:10) Intro(00:05:09) Owain Evans' Research(00:06:36) Situational Awareness(00:09:07) Measuring Situational Awareness(00:14:29) Claude's Situational Awareness(00:19:06) Sponsors: Shopify | LMNT(00:22:01) Needle in a Haystack(00:26:26) Concrete Examples of Tasks(00:34:51) Sponsors: Notion | Oracle(00:37:29) Anti-Imitation Tasks(00:50:03) GPT-4 Base Model Results(01:01:48) Benchmark Saturation(01:07:23) Future Research Directions(01:12:01) Out-of-Context Reasoning(01:27:29) Safety Implications(01:36:24) Scaling and Reasoning(01:44:28) Mixture of Functions(01:54:12) Research Style and Taste(02:08:51) Capabilities and Downsides(02:18:56) Reception and Impact(02:25:30) OutroSOCIAL LINKS:Website: https://www.cognitiverevolutio...Twitter (Podcast): https://x.com/cogrev_podcastTwitter (Nathan): https://x.com/labenzLinkedIn: https://www.linkedin.com/in/na...Youtube: https://www.youtube.com/@Cogni...Apple: https://podcasts.apple.com/de/...Spotify: https://open.spotify.com/show/...TRANSCRIPT:Nathan: Hello, and welcome back to the Cognitive Revolution!Today, I'm excited to share a special crossover episode from The Inside View, featuring a conversation on situational awareness, out-of-context reasoning, and other AI safety topics, between Owain Evans, AI alignment researcher at the Center for Human-Compatible AI at UC Berkeley, and creator & host of The Inside View, Michael Trazzi.Owain is someone I have known casually through friends for many years, and it's been amazing to see him develop into such a prolific and influential researcher.His Google Scholar page lists 12 papers since 2022 – most of which serve to carefully map some dark but important corner of LLM capability space, and some of which you've likely heard of, including "The Reversal Curse", which showed that LLMs trained on "A is B" fail to learn "B is A", and also "Connecting the Dots", which shows that, at least to some degree, LLMs are capable of inferring censored information from implicit hints contained in its training data.In this episode, Owain explains why situational awareness matters, particularly in the context of deceptive AI scenarios, and discusses his research on measuring situational awareness in large language models, including the development of a benchmark to assess this capability.This topic has honestly never felt more relevant to me, because I've been coding with the new o1 model quite a bit over the last few weeks, and while, to be honest, I have to admit that the model is in most respects more cognitively capable than I am, it's situational awareness still seems rather weak, making this both one of a shrinking set of dimensions in which humans still have an advantage over AIs, and one worth watching very closely as AI systems continue to evolve.I've been wanting to have Owain on the show since I started it, and look forward to covering more of his work in a future episode.If you're finding value in the show, we of course appreciate it when folks take a moment to share it with friends or write an online review on Apple Podcasts or Spotify, and we always welcome your feedback, via our website, cognitiverevolution.ai, or by DMing me on your favorite social network. Finally before getting started, I really encourage you to check out The Inside View, on Youtube or at theinsideview.ai, for more of Michael's content. I specifically recommend his episode on Anthropic's research on Sleeper Agents with Evan Hubinger, and I'm also looking forward to his upcoming documentary on SB 1047, which will feature a number of past Cognitive Revolution guests, including Dean Ball, Timothy B. Lee, Leonard Tang, Dan Hendrycks, Nathan Calvin, and Flo Crivello.Now, let's get into the weeds on the critical topic of situational awareness in AI systems, with alignment researcher Owain Evans and Michael Trazzi, creator of The Inside View.Owain: If models can do as well or better than humans who are like AI experts, who know the whole setup, who are like trying to do well on this task. And also they're doing well, like on all the tasks, including like some of these very hard ones. I think that would be like one piece of evidence, right? Where you could say, look, two years ago or something, models were way below human level on this task. Now they're above human level. There's evidence here that they have the kind of skills necessary to understand when they're being evaluated, to take actions that go against their training data. So this would be, I think, a piece of evidence where you could say, look, Given this performance, we should think carefully about alignment of the model, like what evidence we have for alignment. We should maybe try and understand the skills. It's like, how is the model doing so well? Is it memorization or like specialized fine tuning? This would be a reason to like try and find out, okay, how general is this skill? Because I think it would certainly be concerning if models were getting plus 90% on this.Michael: I'm here today with Owain Evans, AI alignment researcher, research associate at the Center of Human Compatible AI at UC Berkeley and now leading a new AI safety group. Thanks Owain for coming on the show. It's a pleasure to finally have you. Thanks for having me. What would you say is the main agenda of your current research?Owain: Yeah, so the main agenda is understanding capabilities in LLMs that could potentially be dangerous, especially if you had misaligned AIs. So you've mentioned some of those capabilities, situational awareness, hidden reasoning, so the model doing reasoning that you can't easily read off what it's doing. And then deception, the model being deceptive in various different kinds of ways. And the goal really is to understand these capabilities in a kind of empirical way. So we want to design experiments with LLMs where we can measure these capabilities. And so this involves defining them in such a way that you can measure them in machine learning experiments.Michael: Yeah, I think the main concept that you're thinking about right now is situational awareness, right? And I think one of the papers you've recently published is around a dataset around that. So it could make sense to just define those concepts and why do you care about them? Sure.Owain: So what is situational awareness? So the idea is it is the model's kind of self-awareness, that is, its knowledge of its own identity, and then its awareness of its environment. So what are the basic interfaces that it is connected to? So as a concrete example, if you think of, say, GPT-4 being used inside ChatGPT, right? So there's the knowledge of itself, that is, does the model know that it is GPT-4? And then there's the knowledge of its immediate environment, which in this case, it is inside a web app. It is chatting to a user in real time. And then there's a final point with situational awareness, which is, can the model use knowledge of its identity and environment to take rational actions? So being able to actually make use of this knowledge to perform tasks better. So that's the kind of definition that we're working with.Michael: And since you're an AI Alignment researcher, like you care about the safety of systems in the long-term future, why should we care about situational awareness in that regard?Owain: Yeah. So I think situational awareness is really important for an AI system acting as an agent. So doing long-term planning, for example, and The intuition is, you know, if you don't understand what kind of thing you are and what your capabilities are, what your limitations are, it's very hard to make complicated plans because you make plans for things you're not actually able to carry out. So, and then if we think about the risks of AI, they're mostly coming from agentic models, models that are able to do planning that generally have agency. So deceptive alignment is one of the scenarios that I think about. And that's the scenario where, you know, a model is doing planning, right? Acting nicely, like behaving well in evaluation. So that later on, it's going to be able to seek power or like take dangerous actions, harmful actions, um, once it's deployed. And so situational awareness is relevant to that. Um, as it is to like any situation where the model is, you know, needing to do some kind of agentic long-term planning.Michael: Yeah. What, what led you to like read this paper?Owain: Yeah. So the idea of this paper is, can we measure situation awareness in large language models? And we wanted to have a a benchmark basically where we can get a score, how much situation awareness does a model have. And it's kind of similar to Big Bench or MMLU where we want to have like a wide range of tasks that are testing different aspects of situation awareness. And, you know, in terms of the motivation, well, the motivation is situation awareness is an important property in thinking about the risks of AI, especially deceptive alignment. And we don't really have great ways to measure this. and isolate it and sort of break it down into different components. So that's the kind of thing that we're trying to do here. And we wanted also to be able to do this for any kind of model. So whether it's an API model that you just have black box access to, a base model, a chat model, so that you can try and understand how situational awareness varies for different kinds of LLMs.Michael: Don't you think there's a risk in releasing a data set where people could just, you know, fine tune their model on this and build more agentic AIs? So I don't think of that as a big risk here.Owain: So, or a very significant risk. So the companies are already implicitly trying to make models situationally aware because that is useful for chat models. So companies are doing this RLHF post-training and they're doing a lot of training, a lot of work to make models basically more agentic and to have knowledge of themselves so that when you ask a model, like which company made you, it will say OpenAI if it's ChatGPT and so on. Um, so I think there's already a lot of effort to make situationally aware models and, um, they're using huge training sets for this. Um, and comparatively like our data set is small. Um, and I think it's, it's not set up for being useful for fine tuning. Um, so it's, Yeah, I think it's probably going to be much less efficient than the kind of fine tuning that they're already doing. That's my, that's my guess. But yeah, I think. It is a possibility that some kind of effect of our data set is that it helps companies in some way increase the situation awareness of models by a small amount. I think that wouldn't be all bad in the sense that it would still like, like that would come from a better understanding of situational awareness and how you kind of control it, how you promote it, right? If you know how to sort of increase this quantity, then you can probably also decrease it. And so I think part of what we, what part of what could be useful is just having this better scientific understanding and engineering understanding of situation awareness. So, yeah. I mean, one thing you get from our dataset is you can see which kind of models have which level of situation awareness. So base models, that is the pre-trained model before you do any RLHF. They generally perform much worse on our benchmark than the model you get after the RLHF fine tuning. And so that's, well, that's one basic thing. The base model has a lot of capability. Like it can be really good at MMLU answering mathematical questions and so on. But it's a lot worse on situation awareness. So that's like a useful thing to know. And likewise, if you prompt models, tell them some facts about themselves in the prompt. or you use chain of thought so you get the model to basically reflect explicitly before answering questions then that also increases scores I think that would effectively increasing situation awareness so so we already know from our paper from our stu'''
