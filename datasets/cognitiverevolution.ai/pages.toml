["https://www.cognitiverevolution.ai/teaching-ai-to-see-a-technical-deep-dive-on-vision-language-models-with-will-hardman-data-sci"]
title = "Teaching AI to See: A Technical Deep-Dive on Vision Language Models with Will Hardman of Veratai"
description = """
In this episode of The Cognitive Revolution, Nathan hosts Will Hardman, founder of AI advisory firm Veritai, for a comprehensive technical survey of vision language models (VLMs).


Watch Episode Here


Read Episode Description

In this episode of The Cognitive Revolution, Nathan hosts Will Hardman, founder of AI advisory firm Veritai,"""
full_description = "Latest Episodes US-China Relations: History, Culture, and AI Competition, with Noah Smith, from Econ 102 Latest Episodes New Jersey’s AI Moonshot: Governor Phil Murphy on Partnerships, Progress, and Preparedness In this episode of The Cognitive Revolution, Nathan hosts Will Hardman, founder of AI advisory firm Veritai, for a comprehensive technical survey of vision language models (VLMs).Watch Episode HereRead Episode DescriptionIn this episode of The Cognitive Revolution, Nathan hosts Will Hardman, founder of AI advisory firm Veritai, for a comprehensive technical survey of vision language models (VLMs). We explore the evolution from early vision transformers to state-of-the-art architectures like InternVL and Llama3V, examining key innovations and architectural decisions. Join us for an in-depth discussion covering multimodality in AI systems, evaluation frameworks, and practical applications with one of the field's leading experts.Help shape our show by taking our quick listener survey at https://bit.ly/TurpentinePulseSPONSORS:Oracle Cloud Infrastructure (OCI): Oracle's next-generation cloud platform delivers blazing-fast AI and ML performance with 50% less for compute and 80% less for outbound networking compared to other cloud providers. OCI powers industry leaders like Vodafone and Thomson Reuters with secure infrastructure and application development capabilities. New U.S. customers can get their cloud bill cut in half by switching to OCI before March 31, 2024 at https://oracle.com/cognitive80,000 Hours: 80,000 Hours is dedicated to helping you find a fulfilling career that makes a difference. With nearly a decade of research, they offer in-depth material on AI risks, AI policy, and AI safety research. Explore their articles, career reviews, and a podcast featuring experts like Anthropic CEO Dario Amodei. Everything is free, including their Career Guide. Visit https://80000hours.org/cogniti... to start making a meaningful impact today.CHAPTERS:(00:00:00) Teaser(00:00:55) About the Episode(00:05:45) Introduction(00:09:16) VLM Use Cases(00:13:47) Vision Transformers (Part 1)(00:17:48) Sponsors: Oracle Cloud Infrastructure (OCI)(00:19:00) Vision Transformers (Part 2)(00:24:58) OpenAI's CLIP Model(00:33:44) DeepMind's Flamingo (Part 1)(00:33:44) Sponsors: 80,000 Hours(00:35:17) DeepMind's Flamingo (Part 2)(00:48:29) Instruction Tuning with LAVA(01:09:25) MMMU Benchmark(01:14:42) Pre-training with QNVL(01:32:13) InternVL Model Series(01:52:33) Cross-Attention vs. Self-Attention(02:14:33) Hybrid Architectures(02:31:08) Early vs. Late Fusion(02:34:50) VQA and DocVQA Benchmarks(02:40:08) The Blink Benchmark(03:05:37) Generative Pre-training(03:15:26) Multimodal Generation(03:37:00) Frontier Labs & Benchmarks(03:47:45) Conclusion(03:53:28) OutroSOCIAL LINKS:Website: https://www.cognitiverevolutio...Twitter (Podcast): https://x.com/cogrev_podcastTwitter (Nathan): https://x.com/labenzLinkedIn: https://www.linkedin.com/in/na...Youtube: https://www.youtube.com/@Cogni...Apple: https://podcasts.apple.com/de/...Spotify: https://open.spotify.com/show/...Vision Language ModelsPrefaceWe’re aiming to provide an introduction to multi-modal AI - specifically for Vision-Language Models (VLMs).This is a “deep dive” from the perspective of someone with a general interest in AI, but it’s really just an introduction to a deep and complex field of vision-language modelsSo, we’ll assume familiarity with the general field of LLMs and deep learning but little in the specific area of multi-modal models.We can’t possibly provide a paper-by-paper analysis of the field - which is both deep and accelerating, so we’ll try to cover:An overview of the most important architectures and trends in research, illustrated via notable models - models anyone building in this space is likely to encounter.We’ll touch on the key datasets and benchmarksThen we’ll briefly examine recent attempts at “true” multi-modality (MM production as well as ingestion)Finally, we’ll look at how the best-in-class models compareMotivationMany obvious use cases for VLMs - medical assistants, content filtering, media content indexing, managing large product catalogues, damage assessment in cars, etcTwo further reasons being interested in VLMs: one obvious, one less so.VLMs allow us to explore modality alignmentIn learning how to construct VLMs, we learn a lot about how to build the true, multi-modal models of the future - integrating further domains like audio, touch, LIDAR, etcThink about robotics: the range of sensory inputs that need to be integrated to cook a meal or perform a medical procedure.MM Understanding may be important for AGIThe arguments forThe human brain uses cross-modal integrated information to determine which concepts are activated. E.G. the McGurk effectThe centrality of multi-sensory exploration to concept learning in infants was argued by Piaget.In deep learning, there are theoretical results demonstrating that latent embeddings generated from multi-modal data are of higher quality than those from single-modality (see here).Some researchers draw inspiration from Grounded Cognition Theory to argue for the importance of multi-modality in AI. (Note that current LMMs do not truly implement grounded cognition as described by the theory.)The arguments againstFrontier LLMs already show evidence of high-level abstraction, world models and sophisticated reasoning. There’s no obvious ceiling on performance in view as of today.Vision Language ModelsIf we’re Googling…:Large multi-modal model (LMM) and Multi-modal Large Language Model (MM-LMM or MLLM) generally mean the same thing.Vision-Language Models (VLMs) generally mean LLMs with image (and often video) understanding capabilities.VLMs are where most research has occurred to date. Some recent VLM architectures can natively generate image outputs also.Vision TransformersThe two minute overview.Introduced in 2020 by a team from Google, the canonical paper is An Image is Worth 16x16 Words: Transformers for Image Recognition at ScalePreviously, most vision models had been based on CNNs, where stacks of convolutional filters learned to extract successively more global features from images.The idea was to see whether the vanilla transformer architecture (without any of the inductive biases of a CNN) could learn to extract the features from an image.The recipe is as follows:Divide the image into patches (originally of 16x16).Apply a (trainable) linearizing embedding to each patch to yield a “token”Feed the sequence of patches into a transformer encoder, using full attentionLike BERT - add a [CLS] token and train the ViT on an image classification objective.Key finding: with scale, the transformer architecture beats CNNs.Note that input image resolution is fixed by design - 224 x 224 in the original paperIf this were a LM encoder, normal practise would be to apply a pooling operation over the hidden states to extract an embedding vectorHowever, for VLMs, normal practise is to extract the entire sequence of hidden states as this has been found to work better. For a resolution of 224x224 and patch size of 16x16 this would yield 196 visual tokens.When we come across a ViT, it’s name will tell us specifics about the architecture, for example, ViT-H/16 is a “Huge” ViT - which translates to 600M parameters, with a patch size of 16.Aligning images and Text: CLIP from OpenAI (2021)Learning Transferable Visual Models From Natural Language SupervisionCLIP stands for Contrastive Language-Image Pre-trainingA canonical model in the field which demonstrates how to align image and text encodings.Starting with a vision encoder (e.g. a ViT), a text encoder and a large dataset of (image, caption) pairs scraped from the web…jointly train the encoders so that they generate embedding vectors with high cosine similarity between an image and its caption.There is a simple linear projection added to each encoder to ensure that they project to an embedding space with conforming dimensionsThis is achieved using a contrastive loss mechanism. Within a batch of N (image, caption) pairs, the loss function penalises similarity between the N^2-N incorrect pairings and dissimilarity between the N correct pairings.Once trained, you can use CLIP for image search and other applications.It’s not, of course a generative model - but it does illustrate some of the important concepts we’ll cover later on.The Cross-Attention Architecture: DeepMind’s Flamingo (2022)We’ll start with one of the most cited papers in MM research - and a foundational contribution to VLM research.The basic pattern, which we’ll see throughout this episode, is that the two modalities are encoded modalities separately - using an image encoder and a text tokenizerThen, you design a mechanism to align the two representations so that a LM “backbone” can attend to the visual tokens as it decodes.Constructed from a frozen, pre-trained ResNet F6 model (a CNN - not a ViT) and a frozen Chinchilla LM.The visual tokens are injected into the frozen LM via learnable, gated cross-attention layers sandwiched between its layers.This is cool, because we can freeze the image encoder and the rest of the LM and just train the newly initialised cross-attention layers.However, the set-up poses to two challenges:Firstly, how can you handle a variable number of images (leading to varying numbers of image tokens) be projected to into a fixed dimensionality?How can the large number of visual tokens be reduced, in turn reducing the number of trainable cross-attention parameters?Answer: by passing the encoded images are into a Perceiver Resampler (PR) module:This module is capable of “selecting” the most critical information out of a long sequence of input tokens without needing to compute a full all-to-all query-key matrix in the attention mechanism.This is a achieved by learning a low-dimensional, latent query vector to be used in the module’s attention mechanism, rather than using a projection of the inputs.If we have N visual tokens and L learnable queries then this attention mechanism is only O(N x L) and there are only L output tokens. Flamingo sets L = 64The PR module can contain >1 layers, with the visual tokens concatenated onto the attention vector each timeIt is effectively resampling the visual tokens, learning what features it needs to query from them during training.It’s now easy to see how the cross-attention layers inserted into the LM backbone can learn to effectively query these fixed-size image representations.The PR module therefore facilitates an arbitrary number of images (e.g. video frames) to be incorporated into a Flamingo prompt with a consistent and parsimonious image representation.To interleave images & text in an input, images are replaced by special tokens, which in turn prompt the decoder to attend to the encoding of the associated image.Training data:They use the ALIGN dataset, composed of 1.8 billion images paired with alt-textsIn the ablations, they highlight the importance of interleaved data, collecting the MultiModal MassiveWeb (M3W) dataset.extracted from the HTML of approximately 43 million webpages, determining the positions of images relative to the text based on the Document Object Model.Sample evaluation tasks included captioning, VQA and OCRWorks best in a few-shot setting. Very compute-efficient training (once the LM and vision encoder are done) and yet still competitive with task-specific models (as of 2022)The basic pattern of using cross-attention layers to integrate the modalities has been used by other teams since.What do we learn from this example?The cross-attention architecture enables us to freeze a LM backbone and train only the new, cross-attention layers. This is efficient.Furthermore, reducing the number of visual tokens using a PR leads to fewer trainable parameters.Flamingo team concentrated on architecture and efficient pre-training. For LLMs, it is common to also perform instruction-tuning. How does this work for VLMs?Instruction Tuning VLMs: Example Model: LLaVA (2023)Large Language and Vision AssistantPapers for the LLaVA series of models, the original from a mixed Microsoft, academic teamLLaVA: Visual Instruction TuningLLaVA 1.5: [Improved Baselines with Visual Instruction Tuning](Improved Baselines with Visual Instruction Tuning)There’s no LLaVA-NExT paper but the repo is here: https://llava-vl.github.io/blog/2024-01-30-llava-next/LLaVA-NeXT-Interleave: Tackling Multi-image, Video, and 3D in Large Multimodal ModelsVideo Instruction Tuning With Synthetic Data (a.k.a. LLaVA Video)LLaVA-OneVision-72BInstruction tuning works well for increasing task competency and diversity for LLMs. Could scaling instruction-tuning serve a similar purpose for LMMs?First off, architecture of the original LLaVA:Base modules are a CLIP ViT-L/14 (2021 vintage) encoder and a Vicuna 13B decoder.Instead of using the cross-attention architecture, the LLaVA team chose a different approach, a simplification of one pioneered by the BLIP series of VLMs from SalesForce:Because the vision encoder is taken from a CLIP model, has already been aligned with language embeddings.Therefore, it should suffice to train a simple projection matrix align to simply adjust the alignment to work with a different LM - e.g. Vicuna.The visual ”tokens” (note - continuous not discrete) are then prepended to the text tokensConceptually, this is similar to prefix-tuning (soft prompting) in LLMs.This approach is called the self-attention or auto-regressive VLM architecture.Note that this could potentially result in a long sequence of visual tokens since, unlike Flamingo, no resampling takes place.The pre-pending recipe lends itself well to a use case where there is a single, static image and a dialogue flow about that image.Conversely, it doesn’t support the arbitrary interleaving of images and text in the inputs, nor the use of multiple images.N.B. this restriction was been lifted by a later in the series - LLaVA-NExT-Interleave (same recipe, different team - this one from Bytedance)This recipe is more parameter efficient than the cross-attention architecture as only the projection matrix is updated during alignment pre-training.Key contribution: how to generate high-quality instruction-following data when it is scarce?Use the textual content associated with MS COCO images: i.e. the descriptions + labelled bounding boxesUse a strong model (GPT4 - not V!) and some careful, few-shot prompting templates to generate:a conversation between a questioner and an assistant, framed as though the assistant could see the image.What type of vehicle is featured in the image?What challenges do these people face?a detailed description of the image - using the label & bounding boxes to help GPT4 determine what is going on & generate a richer captioncomplex reasoning questions using the conversation & detailed description as inspirationPre-trainingThe CLIP-ViT is frozen, the projection matrix & LM weights are updated.P"
