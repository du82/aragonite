 advertising data. Mention "Cog Rev" for 10% off www.omneky.comNetSuite has 25 years of providing financial software for all your business needs. More than 36,000 businesses have already upgraded to NetSuite by Oracle, gaining visibility and control over their financials, inventory, HR, eCommerce, and more. If you're looking for an ERP platform ✅ head to NetSuite: http://netsuite.com/cognitive and download your own customized KPI checklist.X/SOCIALS:@labenz (Nathan)@CeciliaZin (Cecilia)@CogRev_PodcastTIMESTAMPS:(00:00:00) - Episode Preview(00:04:30) - Introduction to Intellectual Property law(00:07:30) - Overview of main types of intellectual property - patents, trademarks, copyrights(00:10:30) - Could Google have patented the transformer? Google’s patent strategy(00:16:30) - Claim construction and its parallel to LLMs(00:17:17) - Sponsor: Shopify(00:18:46) - Practical impact of open source on ability to enforce IP rights(00:21:47) - Litigation, internal data privacy, and communication(00:24:30) - Copyright law and fair use doctrine for transformative works(00:30:22) - Sponsor: Netsuite | Omneky(00:31:42) - Big tech company lawsuits when money starts shifting between incumbents and newcomers(00:34:10) - When judges like a technology…(00:34:57) - Scraping and Linkedin’s suit(00:38:50) - NYTimes vs OpenAI(00:40:00) - Copyright, creators, and music industry licensing(00:42:35) - Transformative nature of work and “fair use”(00:48:39) - Middle ground for the NYTimes and OpenAI case(00:50:29) - Limits on getting injunctions and ongoing royalties from courts(00:56:39) - Legalities of other modalities, like DALL-E images of copyrighted IP(01:01:00) - OpenAI’s opt-out for licensing on the text modality(01:03:58) - OpenAI’s weak to strong generalization(01:07:00) - Pharmaceuticals and software, AI doctors, public good balancing(01:10:40) - Why licensed professionals aren’t pushing back against AI(01:15:36) - Duty to use tools for efficiency to a client(01:17:04) - Impact of open source and ability to find someone to sue(01:20:30) - Forward-looking thoughts on what IP laws should be for AI(01:27:38) - Overview of Cecilia's company GC AI for lawyersThe Cognitive Revolution is brought to you by the Turpentine Media network.Producer: Vivian MengExecutive Producers: Natalie Toren, and Erik TorenbergEditor: Graham BessellieuFor inquiries about guests or sponsoring the podcast, please email vivian@turpentine.co'''
