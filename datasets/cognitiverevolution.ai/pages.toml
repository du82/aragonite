title = "Everything You Wanted to Know About LLM Post-Training, with Nathan Lambert of Allen Institute for AI"
description = """
In this episode of The Cognitive Revolution, we dive deep into frontier post-training techniques for large language models with Nathan Lambert from the Allen Institute for AI.


Watch Episode Here


Read Episode Description

In this episode of The Cognitive Revolution, we dive deep into frontier post-training techniques for large language"""
full_description = "Latest Episodes US-China Relations: History, Culture, and AI Competition, with Noah Smith, from Econ 102 Latest Episodes New Jersey’s AI Moonshot: Governor Phil Murphy on Partnerships, Progress, and Preparedness In this episode of The Cognitive Revolution, we dive deep into frontier post-training techniques for large language models with Nathan Lambert from the Allen Institute for AI.Watch Episode HereRead Episode DescriptionIn this episode of The Cognitive Revolution, we dive deep into frontier post-training techniques for large language models with Nathan Lambert from the Allen Institute for AI. Nathan discusses the groundbreaking Tulu 3 release, which matches Meta's post-training performance using the LlAMA base model. We explore supervised fine-tuning, preference-based reinforcement learning, and the innovative reinforcement learning from verifiable reward technique. Nathan provides unprecedented insights into the practical aspects of model development, compute requirements, and data generation strategies. This technically rich conversation illuminates previously opaque aspects of LLM development, achieved by a small team of 10-15 people. Join us for one of our most detailed and valuable discussions on state-of-the-art AI model development.Check out Nathan's Lambert newsletter:https://www.natolambert.comhttps://www.interconnects.aiBe notified early when Turpentine's drops new publication: https://www.turpentine.co/excl...SPONSORS:Incogni: Take your personal data back with Incogni! Use code REVOLUTION at the link below and get 60% off an annual plan: https://incogni.com/revolutionNotion: Notion offers powerful workflow and automation templates, perfect for streamlining processes and laying the groundwork for AI-driven automation. With Notion AI, you can search across thousands of documents from various platforms, generating highly relevant analysis and content tailored just for you - try it for free at https://notion.com/cognitivere...Shopify: Shopify is the world's leading e-commerce platform, offering a market-leading checkout system and exclusive AI apps like Quikly. Nobody does selling better than Shopify. Get a $1 per month trial at https://shopify.com/cognitiveOracle Cloud Infrastructure (OCI): Oracle's next-generation cloud platform delivers blazing-fast AI and ML performance with 50% less for compute and 80% less for outbound networking compared to other cloud providers13. OCI powers industry leaders with secure infrastructure and application development capabilities. New U.S. customers can get their cloud bill cut in half by switching to OCI before December 31, 2024 at https://oracle.com/cognitive80,000 Hours: 80,000 Hours offers free one-on-one career advising for Cognitive Revolution listeners aiming to tackle global challenges, especially in AI. They connect high-potential individuals with experts, opportunities, and personalized career plans to maximize positive impact. Apply for a free call at https://80000hours.org/cogniti... to accelerate your career and contribute to solving pressing AI-related issues.RECOMMENDED PODCAST:Unpack Pricing - Dive into the dark arts of SaaS pricing with Metronome CEO Scott Woody and tech leaders. Learn how strategic pricing drives explosive revenue growth in today's biggest companies like Snowflake, Cockroach Labs, Dropbox and more.Apple: https://podcasts.apple.com/us/...Spotify: https://open.spotify.com/show/...CHAPTERS:(00:00:00) Teaser(00:00:59) Sponsors: Incogni(00:02:20) About the Episode(00:05:56) Introducing AI2(00:09:56) Tulu: Deep Dive (Part 1)(00:17:43) Sponsors: Notion | Shopify(00:20:38) Open vs. Closed Recipes(00:29:48) Compute & Value (Part 1)(00:34:22) Sponsors: Oracle Cloud Infrastructure (OCI) | 80,000 Hours(00:37:02) Compute & Value (Part 2)(00:42:41) Model Weight Evolution(00:53:16) DPO vs. PPO(01:06:36) Project Trajectory(01:20:39) Synthetic Data & LLM Judge(01:27:39) Verifiable RL(01:38:17) Advice for Practitioners(01:44:01) Open Source vs. Closed(01:49:18) OutroSOCIAL LINKS:Website: https://www.cognitiverevolutio...Twitter (Podcast): https://x.com/cogrev_podcastTwitter (Nathan): https://x.com/labenzLinkedIn: https://www.linkedin.com/in/na...Youtube: https://www.youtube.com/@Cogni...Apple: https://podcasts.apple.com/de/...Spotify: https://open.spotify.com/show/...TRANSCRIPT:Nathan: Hello, and welcome back to the Cognitive Revolution!Today my guest is Nathan Lambert, author of the popular interconnects.ai newsletter and Machine Learning Researcher at the Allen Institute for AI, which today is releasing Tulu 3, one of the most comprehensive open source efforts to diffuse the understanding and practice of frontier post-training techniques for large language models.By systematically working to match Meta's post-training performance using the same Llama base model, and sharing all their findings and data publicly, Nathan and the Allen Institute team have illuminated what has historically been one of the most opaque aspects of LLM development, and this conversation represents one of the most detailed discussions of this topic available anywhere online. We cover the full spectrum of post-training techniques, including supervised fine-tuning, multiple flavors of preference-based reinforcement learning, and a new technique called reinforcement learning from verifiable reward, which rewards the model for accurately answering questions with objectively correct ground-truth answers.At each step, we dig into the practical details that make these techniques work, the associated compute requirements, data generation strategies, and value derived from each, and also the experimental designs used to measure performance while exploring the vast space of possible training recipes. We even get into some fascinating emergent behaviors that echo the frontier reasoning behaviors we've seen from OpenAI's o1.Nathan's frank discussion of both the technical and organizational challenges of this work, including in a few moments where he acknowledges aspects that are not yet well understood, provides a super useful window into what it takes to develop state-of-the-art language models, and the fact that they ultimately succeeded in matching Llama performance, with a team of 10-15 people, makes their approach one to study closely. How long this level of open development can continue into future generations remains an open question in my mind. Even with billionaire estate backing, human-generated preference data and annotations are cost prohibitive for the Allen Institute, and the synthetic data generation techniques used in this project may not be available if frontier developers follow OpenAI's lead in choosing not to release o1-style reasoning traces. That said, Nathan expects that the community will figure something out, and just before publishing, we've seen Chinese AGI company DeepSeek announce a new o1-style model called DeepThink, which does seem to show its work and is reportedly going to be open sourced in the near future, a development that could shift the question from whether or not such open reinforcement learning projects can continue to whether or not they should, and which should definitely cause anyone who things that Western companies can maintain a comfortable lead relative to Chinese companies from here all the way to AGI to stop and rethink their assumptions. In any case, this episode is one of the highest-leverage pieces we've produced on this show, full of concrete, practical insights that were previously scattered throughout the literature or simply hidden behind closed doors, and I'm really grateful to Nathan for such an open and technically detailed conversation.If you're finding value in the show, we appreciate it when listeners take a moment to share it online, post a review on Apple Podcasts or Spotify, or just leave a comment on Youtube. And your feedback is always welcome, via our website, cognitiverevolution dot ai, or by DM'ing me on your favorite social network. With that, I hope you enjoy this super deep dive into the frontiers of LLM post-training, with Nathan Lambert of the Allen Institute for AI.Nathan Labenz: Nathan Lambert from the Allen Institute, creator of Tulu. Welcome to the Cognitive Revolution.Nathan Lambert: Yeah, thanks for having me. The Nathan squared pod has happened. Nathan Labenz: I can't believe it's taken this long, but I'm excited that the day is finally here. So a lot of ground to cover. I'm just going to fire questions at you rapid fire and let's see how far we can get. For starters, tell us about the Allen Institute. You guys have put out a lot of stuff. I would love to just get a little context on kind of the philosophy behind it, the, you know, the funding, the, you know, the GPU, are you GPU rich or GPU poor? And kind of, you know, how are you looking to put a dent in the universe?Nathan Lambert: Yeah, so the Allen Institute, I'm new blood here. I joined just over a year ago. The Institute is actually 10 years old. It's funded by Paul Allen, which is not surprising for people in the tech scene and knowing the Allen Institute in Seattle, given the name. And the original CEO, Oren, I don't know how to pronounce his last name, also was a professor at UW, a lot of UW ties, I think was buds with Paul Allen. And this kind of grew out of that to just kind of do AI research for the common good, make things very open, very hybrid academic industry. That is kind of the story of the first decade, roughly. It's not quite the first 10 years, and now there's like Oren left. The process of leaving started a few years ago, and there's the new CEO, Ali Farhadi. Also, Professor U-Dub was at Apple before. Most prominent work from his group, I think, is the YOLO line of work in computer vision. And it's kind of bringing in new blood to make this transition to build open language models. I think with a lot of institutions realize that in order to be credible in AI, you need to have some amount of cred in the language modeling space. And right now for AI research, it is to be like, look, we can do this too. And it is... a narrowing of scope to try to release great models and build models. I think Ulmo is the start of this, which was a very long story in 2023 that I was not a part of most of. I joined late in the year and launched in early 2024. And then 2024 has been the year of doubling down on this and scaling up projects that you can do when you have more people. I think we'll talk about the post-training side of things and there's plenty on pre-training and stuff in evals as well, but it's really like what the academic projects in open source AI look like when you can bring more people in. And I think throughout the year, a lot of our projects have been getting bigger and we've seen like MoMo, the vision model, which is primarily on the like vision team, but gets involved with the language pre-training team and other things. It's like these projects getting bigger and trying to increase the scope of research while doing as much as we can in the open. So no constraints on what we can say. end of the day, nonprofits are about telling a good story and stories are what can actually like change how policy happens and how people view the world. So at the end of the day, the Allen Institute needs to build good models so we can communicate why open source has benefits. And it's like kind of reductionist and it's a little cynical to view nonprofits as storytelling works. But when your money mostly comes from a tech billionaire's estate, like you got to say some of it as it is and But the momentum is good, so it's fun to be in the space and see things continuing for the time being.Nathan Labenz: I think stories are honestly a super important part of life in general and the AI moment in particular. It feels to me like we are summoning this crazy new alien intelligence and really lack, in most corners, a positive vision for what we want to do with it, what impact we want it to have on life. And there's a lot of very general talk about, won't it be great when we have everything we want? And it's like, yeah, can we put a little more detail on that? So I do appreciate the importance of storytelling in this space. You mentioned pre-training, post-training. The project that you've just put out today as we record this a few days in advance, but we'll try to publish it right around the time of recording, is called Tulu. It is really a deep dive into post-training techniques. Give us a little bit of context for kind of why this project, what the goals of it are. And then I really just want to go deep on the actual methodology, what you've learned and try to develop my own intuitions for the state of the art in post-training.Nathan Lambert: Yeah, so I think this kind of story fits well with what we were talking about with AI2. So AI2's kind of open post-training recipes have been under this Tulu brand for over a year, almost a year and a half. I think Tulu 1 was back when like Open Assistant was new, was like, what can we do by mixing all these popular data sets that people are putting out in 2023? All these data sets and small models, like how do you systematically mix instruction data sets? to combine them with open resources. And Tulu2 was around when DPO was very popular, and that was when we showed that you can scale DPO to 70 billion parameters and continue getting the benefits from preference fine tuning and open recipes. Then we went away and did Tulu2.5, which was kind of like trying to answer the PPO versus DPO question, which the TLDR was, if you tune your parameters right, PPO is probably better a bit, but it's probably not worth the effort to spend all your time on preference tuning when you can just be making better data and better pipelines, which is what two to three is about, which is kind of like inspired by the transition we're seeing with like the llama report with chatbot arena, it's like turned into a hockey stick again, where we have this incremental scores and the open AI and Google are like skyrocketing their scores again. Nemetron paper, Apple had a paper, which these post-training recipes are just much more complicated than big SFT step, do DPO on some chat data and be done. And the philosophy is kind of like, we know these labs are doing it. Like, how do we try to understand what the open groups should be doing and where there are hills to climb when you're increasing the complexity substantially in post training? Like, Lama 3 has hundreds of peoples on it and like a large amount on post training. We have 10 to 20 on ours. And it's like, what could academics actually do to do modern post training and curate new data use new algorithms, sequence things together, but like kind of move beyond this paradigm of like just increasing like alpaca eval or vibe scores and try to get really specific on improving math, improving if eval. Code is something we did a bit, but it wasn't the biggest focus. I think our evals for code were "
