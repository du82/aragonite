full_description = '''Latest Episodes US-China Relations: History, Culture, and AI Competition, with Noah Smith, from Econ 102 Latest Episodes New Jersey’s AI Moonshot: Governor Phil Murphy on Partnerships, Progress, and Preparedness In this episode of The Cognitive Revolution, Nathan welcomes back Zvi Mowshowitz for an in-depth discussion on the latest developments in AI over the past six months.Watch Episode HereRead Episode DescriptionIn this episode of The Cognitive Revolution, Nathan welcomes back Zvi Mowshowitz for an in-depth discussion on the latest developments in AI over the past six months. They explore Ilya's new superintelligence-focused startup, analyze OpenAI's O1 model, and debate the impact of Claude's computer use capabilities. The conversation covers emerging partnerships in big tech, regulatory changes, and the recent OpenAI profit-sharing drama. Zvi offers unique insights on AI safety, politics, and strategic analysis that you won't find elsewhere. Join us for this thought-provoking episode that challenges our understanding of the rapidly evolving AI landscape.Check out "Don't Worry About the Vase" Blog: https://thezvi.substack.comBe notified early when Turpentine's drops new publication: https://www.turpentine.co/excl...SPONSORS:Shopify: Shopify is the world's leading e-commerce platform, offering a market-leading checkout system and exclusive AI apps like Quikly. Nobody does selling better than Shopify. Get a $1 per month trial at https://shopify.com/cognitiveNotion: Notion offers powerful workflow and automation templates, perfect for streamlining processes and laying the groundwork for AI-driven automation. With Notion AI, you can search across thousands of documents from various platforms, generating highly relevant analysis and content tailored just for you - try it for free at https://notion.com/cognitivere...Oracle Cloud Infrastructure (OCI): Oracle's next-generation cloud platform delivers blazing-fast AI and ML performance with 50% less for compute and 80% less for outbound networking compared to other cloud providers13. OCI powers industry leaders with secure infrastructure and application development capabilities. New U.S. customers can get their cloud bill cut in half by switching to OCI before December 31, 2024 at https://oracle.com/cognitiveSelectQuote: Finding the right life insurance shouldn't be another task you put off. SelectQuote compares top-rated policies to get you the best coverage at the right price. Even in our AI-driven world, protecting your family's future remains essential. Get your personalized quote at https://selectquote.com/cognit...RECOMMENDED PODCAST:Unpack Pricing - Dive into the dark arts of SaaS pricing with Metronome CEO Scott Woody and tech leaders. Learn how strategic pricing drives explosive revenue growth in today's biggest companies like Snowflake, Cockroach Labs, Dropbox and more.Apple: https://podcasts.apple.com/us/...Spotify: https://open.spotify.com/show/...CHAPTERS:(00:00:00) Teaser(00:01:03) About the Episode(00:02:57) Catching Up(00:04:00) Ilya's New Company(00:06:10) GPT-4 and Scaling(00:11:49) User Report: GPT-4 (Part 1)(00:18:11) Sponsors: Shopify | Notion(00:21:06) User Report: GPT-4 (Part 2)(00:24:25) Magic: The Gathering (Part 1)(00:32:34) Sponsors: Oracle Cloud Infrastructure (OCI) | SelectQuote(00:34:58) Magic: The Gathering (Part 2)(00:35:59) Humanity's Last Exam(00:41:29) Computer Use(00:47:42) Industry Landscape(00:55:42) Why is Gemini Third?(01:04:32) Voice Mode(01:09:41) Alliances and Coupling(01:16:31) Regulation(01:24:58) Machines of Loving Grace(01:33:23) Taiwan and Chips(01:41:13) SB 1047 Veto(02:00:07) Arc AGI Prize(02:02:23) Deepfakes and UBI(02:09:06) Trump and AI(02:26:31) AI Manhattan Project(02:32:05) Virtue Ethics(02:38:40) Closing Thoughts(02:40:37) OutroSOCIAL LINKS:Website: https://www.cognitiverevolutio...Twitter (Podcast): https://x.com/cogrev_podcastTwitter (Nathan): https://x.com/labenzLinkedIn: https://www.linkedin.com/in/na...Youtube: https://www.youtube.com/@Cogni...Apple: https://podcasts.apple.com/de/...Spotify: https://open.spotify.com/show/...TRANSCRIPT:Nathan: Hello, and welcome back to The Cognitive Revolution!Today, Zvi Mowshowitz returns for another wide-ranging conversation, as we look back on the major developments in AI, including the technical, strategic, and political – that have transpired in the six months since his last appearance. We discuss Ilya's new startup, which aims to go straight to superintelligence, the utility (or lack thereof) of OpenAI's o1 for things like coding and Magic the Gathering, the likely impact of Claude's new computer use capabilities, and the recent discourse around the "end of scaling". We also analyze the complex web of partnerships emerging between Big Tech companies, the regulatory outlook in the wake of the veto of SB1047, and the latest OpenAI drama, this time centering around the question of who should and will get what as they convert to a for-profit company. Toward the end, we consider the potential impact of Donald Trump's return to the presidency on AI trajectories, and I pick Zvi's brain on how the AI safety community understanding of individual virtue should evolve in this new political reality.On all these topics and more, Zvi delivers a mix of strategic analysis & insight that you can't get anywhere else – except of course for his blog, Don't Worry About the Vase, online at thezvi.substack.com – and I personally find these exchanges super helpful, both for maintaining general situational awareness and in some cases for challenging my own mental models about how to most effectively work toward beneficial AI outcomes.As always, if you're finding value in the show, we'd appreciate a review on Apple Podcasts or Spotify, or just share it with a friend who's trying to make sense of the rapidly evolving AI landscape. And we welcome your feedback, either via our website, CognitiveRevolution.ai, or by DM'ing me on your favorite social network. Now, I hope you enjoy this latest discussion with the great Zvi Mowshowitz.Nathan: Welcome back to the Cognitive Revolution.Zvi: Thanks. I always enjoy it here.Nathan: So it's been a minute and the pace hasn't slowed down. I went back and looked at the timestamp of our last conversation and it was right after OpenAI and Google had sort of previewed their respective voice modes. And then I think literally as we were recording, there were like, several resignations from OpenAI safety teams. Then we did an immediate part two to talk about that. And certainly quite a bit has happened in the intervening months. So what I thought we would do is just run it down, get your take on a bunch of stuff. We're both in the business of keeping up with this on a weekly, daily and hourly basis, but not everybody can do that. So this is kind of the zoomed out few months recap and analysis. How's that sound? I like it.Zvi: Yeah, let's do it.Nathan: Cool. Looking through your blog and just revisiting the news myself, I thought that one story that kind of came and went, but which has at least some chance of proving to be maybe the most important story of all over the last few months was Ilya's announcement that he is starting a new company, which is going direct to super intelligence safely, of course. And so we've nothing to worry about there, but just... Basically, just want to let you know, we're going to go build super intelligence and we'll let you know when we've got it. No products and unclear how many updates we'll get in the meantime. It'll definitely be safe. We know that, right? It's right there in the title. So it's, I would say their ability to do this is obviously still questionable, but to borrow a infamous phrase, strikingly plausible. And, you know, that in and of itself is pretty crazy. Certainly you couldn't have made such a plan at all credible up until pretty recently. What do you make of it? And how often do you wake up at night wishing or dreaming that you might've got an unexpected update on their progress?Zvi: We have a little bit of an update just this week, actually. Aelia said that this is no longer the age of scaling. The 2010s were the age of scaling, and now we're back in the age of wonder and discovery. Once again, everyone is looking for the next thing. Scaling the right thing matters more now than ever. So basically, the OpenAI attitude of we'll just add a zero to everything and see what happens is not even what OpenAI is doing anymore, right? They move on to a one because their previous strategy wasn't working. And obviously he's not going to spill the secrets, so we don't know how well it's going, but presumably they're not finding it to be that easy. But yeah, it's deliberately opaque. It's deliberately hard for us to tell what's going on inside. I do know that I am skeptical that they can achieve safe superintelligence if they achieve superintelligence. I'm also reasonably skeptical they'll get to superintelligence by this direct method, but definitely not impossible. I can't rule it out.Nathan: So my next topic was 01 and you're touching on that. And then also this sort of meta debate as to what's working, what's not working. I find this quite confusing because on the one hand, we have Altman and Dario, and I would say also the DeepMind founders, although not quite as recently, all pretty clearly on record saying, we know what we need to do. We don't really see any fundamental barriers. We think we're going to get there in a two to three year timeframe. And then we also have this sort of end of scaling narrative that has popped up. It makes some intuitive sense to me when I'm like, okay, 15 trillion tokens or whatever is already a lot. And yeah, there's a lot more on the internet, but a lot of it is crap. Data quality matters more than quantity has certainly been true in my experience, albeit at much smaller scale than what these guys are doing. We've heard these reports also that 01 is... In addition to, of course, introducing a new inference time scaling law is being used to create training data for the next generation of model, the reported Orion model. They're still raising more and more billions and they're still planning to build bigger and bigger data centers. And the number of H-100s that people are training on is going up. Elon's got his Tennessee Valley Authority contract with like record time to deploy and network 100,000 H-100s. Meta has announced that they are training Llama 4 or will be. I'm not sure if it's R or soon will be training Llama 4 on 100,000 plus H-100s. So how do you sort through that? In your mind, is the era of scaling over or are they throwing, is that like throwing people off the scent or what?Zvi: Right. Is deep learning hitting a wall in air quotes? So yeah, we have these two camps. We have the people who are like, well, look at all the lack of amazing products that are coming out. It's all high. You know, you've hit a wall. It doesn't get much better than this. It doesn't get very, very slowly. And then everyone in the major AI companies is like, yep, AGI soon. End of world as we know it in 27 or thereabouts. And then who knows what happens. And then they had this strange forecast of we will get AGI that should be transformational, that can radically accelerate massive AI progress and do all these other things. And then people like Altman are like, well, then nothing much will change. Your life will continue the same way. And it will basically be better economic growth. So like you'll pay lower taxes or inflation will go down. But that story makes no sense, right? Like you might not get AGI, in which case we get the story of UFS changed much, but things get a little bit better because AI is cool. But if we get AGI, obviously life is not going to seem the same for very long. It might get way better. It might get worse. It might end. We don't know. But the story on it stays the same. Certainly wouldn't be like a automatic default outcome. It would be a, we deliberately engineered that it stayed the same. We chose under the hood to keep it the same because we couldn't do better. And there's some arguments for that being a reasonable choice if you don't confidently know how to do better, but it's not a natural outcome at all. And their rhetoric brings hollow, right? It makes you wonder, do they really believe that what they're describing is the AGI that's coming is AGI? Or are they trying to hype you up, slash get on the Microsoft contract, slash just make themselves feel if you're doing the thing? Even if it's about to be weak, you know, the miraculous definition is like not that strong, that kind of thing. So look a little bit farther ahead in all of this again. So my reconciliation is something like, The strategy of just pushing forward by adding more zeros to everything. The same strategy that went from GPT-1 to 2 to 3 to 4. There's some technique involved, but Jack Clark's impact right up. It's like expertise is everywhere. It's just about computing data. That's coming to a place. That's just marginal. Marginal returns are declining, even in scaling law terms. And you're not going to get very far from here doing that. And that's why O1. That's why these other approaches, but this is my way of understanding it. By using what the models have to offer to refine the training process, by using inference time compute in various ways, by using things like the O series of models, you can get these labs. People believe you can get that. You can overcome this barrier. We can pivot to a different scaling law, to a different method, and we can get where we need to go to the AGI. That's for at least some definition of AGI reasonably soon. Slash, they just have this statement, straight lines on graphs don't stop, right? It's like Moore's law. Something will happen. We'll figure out something else. Even though what we were doing before stops working, don't worry about it. We'll figure it out. And there's a lot of talk about things being stronger than we know, right? Rune talking about how everyone's under-upgrading on O1, but we don't see the O1 he sees. We see O1 Preview, right? And I gotta say, O1 Preview, super unimpressive to me. Having sat with it for a while, I basically don't use it. I find it to be, every time I ask O1 Preview, for a question, it like thinks for a while, talks about all of these relevant details, gives me lots and lots of data points. And like, none of it addresses the actual thing I was trying to do. It doesn't follow the conceptual logic that I was trying to get it to go to the thing that's useful to me. Like when I use use on it, I should use use on it. It almost happens.Nathan: That's quite interesting. I would say I have a different user report from a one. I certainly the downsides are real. The wait time, my goldfish attention span is such now that even a 45 second delay to first token is enough for me to like tab over to something else and forget what I was doing and then '''
