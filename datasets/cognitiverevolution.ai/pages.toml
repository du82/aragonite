full_description = "Latest Episodes US-China Relations: History, Culture, and AI Competition, with Noah Smith, from Econ 102 Latest Episodes New Jersey’s AI Moonshot: Governor Phil Murphy on Partnerships, Progress, and Preparedness Nathan welcomes back computational biochemist Amelie Schreiber for a fascinating update on AI's revolutionary impact in biology.Watch Episode HereRead Episode DescriptionNathan welcomes back computational biochemist Amelie Schreiber for a fascinating update on AI's revolutionary impact in biology. In this episode of The Cognitive Revolution, we explore recent breakthroughs including AlphaFold3, ESM3, and new diffusion models transforming protein engineering and drug discovery. Join us for an insightful discussion about how AI is reshaping our understanding of molecular biology and making complex protein engineering tasks more accessible than ever before.Help shape our show by taking our quick listener survey at https://bit.ly/TurpentinePulseSPONSORS:Shopify: Shopify is the world's leading e-commerce platform, offering a market-leading checkout system and exclusive AI apps like Quikly. Nobody does selling better than Shopify. Get a $1 per month trial at https://shopify.com/cognitiveSelectQuote: Finding the right life insurance shouldn't be another task you put off. SelectQuote compares top-rated policies to get you the best coverage at the right price. Even in our AI-driven world, protecting your family's future remains essential. Get your personalized quote at https://selectquote.com/cognit...Oracle Cloud Infrastructure (OCI): Oracle's next-generation cloud platform delivers blazing-fast AI and ML performance with 50% less for compute and 80% less for outbound networking compared to other cloud providers13. OCI powers industry leaders with secure infrastructure and application development capabilities. New U.S. customers can get their cloud bill cut in half by switching to OCI before December 31, 2024 at https://oracle.com/cognitiveWeights & Biases RAG++: Advanced training for building production-ready RAG applications. Learn from experts to overcome LLM challenges, evaluate systematically, and integrate advanced features. Includes free Cohere credits. Visit https://wandb.me/cr to start the RAG++ course today.CHAPTERS:(00:00:00) Teaser(00:00:46) About the Episode(00:04:30) AI for Biology(00:07:14) David Baker's Impact(00:11:49) AlphaFold 3 & ESM3(00:16:40) Protein Interaction Prediction (Part 1)(00:16:44) Sponsors: Shopify | SelectQuote(00:19:18) Protein Interaction Prediction (Part 2)(00:31:12) MSAs & Embeddings (Part 1)(00:32:32) Sponsors: Oracle Cloud Infrastructure (OCI) | Weights & Biases RAG++(00:34:49) MSAs & Embeddings (Part 2)(00:35:57) Beyond Structure Prediction(00:51:13) Dynamics vs. Statics(00:57:24) In-Painting & Use Cases(00:59:48) Workflow & Platforms(01:06:45) Design Process & Success Rates(01:13:23) Ambition & Task Definition(01:19:25) New Models: PepFlow & GeoAB(01:28:23) Flow Matching vs. Diffusion(01:30:42) ESM3 & Multimodality(01:37:10) Summary & Future Directions(01:45:34) OutroTRANSCRIPT:Nathan: I'm Malice Schreiber, computational biochemist and AI researcher. Welcome back to the Cognitive Revolution.Amelie: Hey. Nice to be here.Nathan: I'm excited about this. It has been about six months since our last deep dive into developments in AI for biology. And the pace is accelerating in that subfield of AI. Obviously, probably one of the most consequential ones, if not the most consequential one long term, just as it is everywhere else. So I'm excited to have this opportunity to catch up. Last episode we did was really well received. I think there's a ton of hunger among a general audience that hears a lot about large language models and a lot about image generation to understand, okay, sure, but how is all this stuff going to impact science and biology and ultimately medicine and ultimately quality of life and maybe even longevity. Last time we kind of, and I would definitely recommend for folks if they haven't seen it already, go back and check that episode out. But we basically covered the two main challenges as I kind of came away understanding it in biomedicine broadly, one being Can we understand what is going on? What causes what? What interacts with what? What promotes what? What inhibits what? All that sort of stuff. Obviously, super complicated. We've got a lot of work left to do on that. And then the other thing which really surprised me was just how far we have already come when it comes to a situation we're given a target where we know what we want to affect, the ability to actually design new proteins to create introduce into cells and and make the desired changes and actually interact effectively with the proteins and the other molecules of life so pretty fascinating stuff i kind of recall that we talked about predicting structures you know as kind of static structures with different levels of resolution and we also talked about the ground truth being the boltzmann distribution which is not a single structure but like a range of structures where some of them are you know the way that these big molecules spend a lot of their time and then others are kind of in between states where they don't spend so much time and you can do that at kind of a general shape level or a sequence level or even down to like the all atom level where you're even trying to get you know to where each hydrogen atom is all that to uh tee up a lot has happened in just the last six months we've got some nobel prizes given out we've got a bunch of new models uh you've drawn my attention to some new models specifically focusing on peptides we'll get into why that's important and then i want to try to dive into your actual work a little bit better and understand, you know, because we got kind of the general way of the land last time, but didn't come away with a great sense of like what you actually do during the day and what the practice of designing proteins actually looks like today. If I were to come, you know, watch over somebody's shoulder. So Let's start off maybe with a little discussion of David Baker, because I know you're a huge fan. And he recently shared a Nobel Prize. And that's a big deal. I think, you know, he was obviously the less famous recipient of the prize, but maybe, you know, shouldn't be that.Amelie: It shouldn't be that way. No, I have a few things to say there. Yeah, definitely a huge David Baker fan, for sure. He runs a solid lab. The work they put out is really good stuff. And from what I hear, he's a very good advisor too. A lot of his students and co-workers have a lot of good things to say about him. Yeah, I definitely love to follow their work, Baker Lab's work. So I guess something that is a little maybe annoying to me in particular is the fanfare that AlphaFold got over some of the stuff that David Baker got in some of the more simple mainstream sort of videos that are maybe not digging into the history as much as you could. Because I mean... David Baker's been doing this for a while. He's been doing protein engineering for longer than AlphaFold has been around for sure. And I would say like the approaches that they were using pre AlphaFolds were very like physics based sort of methods. And I mean, they had some reasonable results with some of that in some systems. But I think things really started to change when they started adopting AI. And that happened right around when AlphaFold happened. I think like Baker Lab had been using AI methods even before AlphaFold came out. They also built their own structure prediction model similar to AlphaFold 2. They built RoseTTAFold 2, which is a very similar model, does the exact same thing. predicts the structure given a protein sequence. And they actually did something really interesting, right? They took it a step further. They didn't stop at structure prediction. They decided they wanted to bring in someone to do generative modeling. And so they brought in people to do generative modeling and they fine-tuned RosettaFold 2 into a diffusion model that they called RF Diffusion right and we talked about this some last time when we met I think it's a very important model to know it's very useful even still I mean in AI terms it's been out forever it's been out for like two two or two and a half years but it's still very useful even though it's an older model so to speak And I would say that work in a lot of the YouTube videos and things that I was seeing floating around that were more oriented towards kind of hyping AI, they kind of brushed over some of the contributions that David Baker has made. But I have found a few good ones that actually went into the history a little bit and talked about Rosetta and what David Baker was doing before AlphaFold and what his lab did after AlphaFold. And I think they've come up with a lot of different AI models too. It's not just structure prediction and generating binders or doing motif scaffolding with RF Diffusion. They also had to develop a sequence design model so that they could design the protein sequences that fold into the design structures that they have. And they've also developed several other models for various other things that we'll talk about today probably. Yeah, I think it was well-deserved. The Nobel was definitely well-deserved, for sure. I think as these things always go, there are always a few people that maybe also deserved it, that didn't get it, or that contributed similar things but didn't get put in the spotlight. And I think maybe give some links to some info about that towards the end if people want to look into that a little more. Yeah, I mean, really cool stuff. I think it says a lot, too, that if you break it down into the physics and the chemistry Nobel category, I guess there were five total Nobel laureates this year that won Nobels in large part because of their AI techniques. which I think is really cool. And that's saying a lot about the kind of impact that AI is having. And I think there is plenty of hype, but there's a lot of signal there too. It's not all noise. There's plenty of signal. And I think it's still coming through. And in biochemistry in particular, it just hasn't even popped off yet, in my opinion. We're still at the very beginning of the curve there in a lot of ways. So yeah, a lot of exciting stuff to look forward to. Yeah, so there were two things that you mentioned that you wanted to talk about that I thought would be good to address up front. AlphaFold3 and ESM3. I think both of those are good things to mention because those both came out since we talked last. And those are pretty big foundational sort of models, whatever that term means anymore. But they're pretty central, important models that do some pretty important things, right? The new AlphaFold3, it predicts complexes of not just proteins now, but also RNA and DNA and small molecules and even ions, which is pretty cool. I think especially the ions, I haven't spent a lot of time testing how accurate that is, so I won't speak to the quality of the predictions that involve ions. But assuming that your predictions are high quality and the ion predictions are good, That's actually really useful for several things that I'm interested in. So that's pretty cool. Unfortunately, not open source, so I can't really use it. But hopefully we'll have some open source versions pretty soon. Can't say for sure when, but I do know there are at least a couple of groups working on it. And there are a couple of open source versions that have come out that are approximations of AlphaFold3. But nothing that's really satisfied me yet. I think they each have their own merits. But I haven't seen something that I feel like is just like a really good faithful reproduction of AlphaFold3 yet. And that's still in the works by a couple of groups. Hopefully that'll come out. sometime by the end of the year, first of next year. And I think that having something that will predict the structure of complexes involving all the different biomolecules and ions included is super useful, right? Because then you can start predicting things like protein-protein interactions or protein-nucleic acid interactions and start building out these interaction networks, which is really important for understanding different disease mechanisms or you know like how like if i want to treat some particular disease do i need to like design a binder here do i need to design some kind of inhibitor do i need to design like an allosteric modulator you get the idea so it's useful for building out these interaction networks and understanding how things are interacting with each other and where you need to design your molecules and for what purposes you need to design them for A couple of questions on AlphaFold.Nathan: Please provide the transcript segment you would like me to correct.Amelie: I guess there is an API, right? Just to go back to the open source bit for a second. There is, yeah. You can definitely use the API. I guess it's not open source on GitHub. The other thing too is the restrictions on it are pretty limiting. So if I wanted to use their API in some kind of drug design process, I wouldn't actually be able to do that because of their licensing and stuff. it can't really be used for like drug design unless maybe you're like an academic and you're doing it completely outside of the whole capitalist profit sort of machine and you're just doing it for academic research purposes and it's all completely like public domain, open source sort of research that's coming out of it. I think that's fine. But if you're doing anything that you want to have like any kind of IP for, or if you wanted to like patent your molecule or sell it or get it into the whole drug discovery pipeline and have it go to market or something one day, like you couldn't really do that. They have restrictions on it so that you can't really do that. Yeah, gotcha.Nathan: You also mentioned sort of The fact that one of the qualitative differences between AlphaFold 3 and what has come before is that it now works with all of life's molecules, I think was the language that they used in the original blog post, if I remember correctly. Right. And your comment there sort of suggested that you might be able to use this to kind of almost brute force your way through exploring what interacts with what in a cell. I've come to sort of an estimate that we have maybe 5% to 10% of all of the interactions in a given cell mapped and understood. And that obviously means that the majority of it, we don't know exactly what's interacting with what yet. Right. This sounds like you almost think it could be the basis for just... put a few things together, throw them into AlphaFold 3. If they seem to interact in a very like natural or close fitting way, then you would maybe infer that, hey, this probably happens for real. And that's like a real interaction. And if you put them together and they li"
