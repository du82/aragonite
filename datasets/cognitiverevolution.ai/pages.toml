atically detecting anomalies and hallucinations(01:09:20) - Relationships between Arthur AI and foundation model providers(01:11:52) - Where Cohere shines: multilingualism and not hedging(01:13:43) - Anticipating future watershed moments and steady progress(01:19:03) - Whether we can ever fully solve AI alignment and safetyLINKS:Arthur.ai: https://www.arthur.ai/X/Social:@apwenchel (Adam)@itsArthurAI (Arthur.ai)@labenz (Nathan)@eriktorenberg@CogRev_PodcastSPONSORS: NetSuite | OmnekyNetSuite has 25 years of providing financial software for all your business needs. More than 36,000 businesses have already upgraded to NetSuite by Oracle, gaining visibility and control over their financials, inventory, HR, eCommerce, and more. If you're looking for an ERP platform ✅ head to NetSuite: http://netsuite.com/cognitive and download your own customized KPI checklist.Omneky is an omnichannel creative generation platform that lets you launch hundreds of thousands of ad iterations that actually work customized across all platforms, with a click of a button. Omneky combines generative AI and real-time advertising data. Mention "Cog Rev" for 10% off.Music Credit: Stableaudio.com'''
