full_description = '''Latest Episodes US-China Relations: History, Culture, and AI Competition, with Noah Smith, from Econ 102 Latest Episodes New Jersey’s AI Moonshot: Governor Phil Murphy on Partnerships, Progress, and Preparedness Join Nathan for an expansive conversation with Dan Hendrycks, Executive Director of the Center for AI Safety and Advisor to Elon Musk's XAI.Watch Episode HereRead Episode DescriptionJoin Nathan for an expansive conversation with Dan Hendrycks, Executive Director of the Center for AI Safety and Advisor to Elon Musk's XAI. In this episode of The Cognitive Revolution, we explore Dan's groundbreaking work in AI safety and alignment, from his early contributions to activation functions to his recent projects on AI robustness and governance. Discover insights on representation engineering, circuit breakers, and tamper-resistant training, as well as Dan's perspectives on AI's impact on society and the future of intelligence. Don't miss this in-depth discussion with one of the most influential figures in AI research and safety.Check out some of Dan's research papers:MMLU: https://arxiv.org/abs/2009.033...GELU: https://arxiv.org/abs/1606.084...Machiavelli Benchmark: https://arxiv.org/abs/2304.032...Circuit Breakers: https://arxiv.org/abs/2406.043...Tamper Resistant Safeguards: https://arxiv.org/abs/2408.007...Statement on AI Risk: https://www.safe.ai/work/state...Apply to join over 400 Founders and Execs in the Turpentine Network: https://www.turpentinenetwork....SPONSORS:Weights & Biases RAG++: Advanced training for building production-ready RAG applications. Learn from experts to overcome LLM challenges, evaluate systematically, and integrate advanced features. Includes free Cohere credits. Visit https://wandb.me/cr to start the RAG++ course today.Shopify: Shopify is the world's leading e-commerce platform, offering a market-leading checkout system and exclusive AI apps like Quikly. Nobody does selling better than Shopify. Get a $1 per month trial at https://shopify.com/cognitive.LMNT: LMNT is a zero-sugar electrolyte drink mix that's redefining hydration and performance. Ideal for those who fast or anyone looking to optimize their electrolyte intake. Support the show and get a free sample pack with any purchase at https://drinklmnt.com/tcr.Notion: Notion offers powerful workflow and automation templates, perfect for streamlining processes and laying the groundwork for AI-driven automation. With Notion AI, you can search across thousands of documents from various platforms, generating highly relevant analysis and content tailored just for you - try it for free at https://notion.com/cognitivere...Oracle: Oracle Cloud Infrastructure (OCI) is a single platform for your infrastructure, database, application development, and AI needs. OCI has four to eight times the bandwidth of other clouds; offers one consistent price, and nobody does data better than Oracle. If you want to do more and spend less, take a free test drive of OCI at https://oracle.com/cognitiveCHAPTERS:(00:00:00) Teaser(00:00:48) About the Show(00:01:11) Sponsors: Weights & Biases RAG++(00:02:17) About the Episode(00:05:41) Intro(00:07:19) GELU Activation Function(00:10:48) Signal Filtering(00:12:46) Scaling Maximalism(00:19:07) Sponsors: Shopify | LMNT(00:22:03) New Architectures(00:25:41) AI as Complex System(00:32:35) The Machiavellian Benchmark(00:34:42) Sponsors: Notion | Oracle(00:37:20) Understanding MMLU Scores(00:45:23) Reasoning in Language Models(00:49:18) Multimodal Reasoning(00:54:53) World Modeling and Sora(00:57:07) Arc Benchmark and Hypothesis(01:01:06) Humanity's Last Exam(01:08:46) Benchmarks and AI Ethics(01:13:28) Robustness and Jailbreaking(01:18:36) Representation Engineering(01:30:08) Convergence of Approaches(01:34:18) Circuit Breakers(01:37:52) Tamper Resistance(01:49:10) Interpretability vs. Robustness(01:53:53) Open Source and AI Safety(01:58:16) Computational Irreducibility(02:06:28) Neglected Approaches(02:12:47) Truth Maxing and XAI(02:19:59) AI-Powered Forecasting(02:24:53) Chip Bans and Geopolitics(02:33:30) Working at CAIS(02:35:03) Extinction Risk Statement(02:37:24) OutroSOCIAL LINKS:Website: https://www.cognitiverevolutio...Twitter (Podcast): https://x.com/cogrev_podcastTwitter (Nathan): https://x.com/labenzLinkedIn: https://www.linkedin.com/in/na...Youtube: https://www.youtube.com/@Cogni...Apple: https://podcasts.apple.com/de/...Spotify: https://open.spotify.com/show/...TRANSCRIPT:Nathan: Hello, and welcome back to the Cognitive Revolution!Today I'm thrilled to be joined by Dan Hendrycks, Executive Director of the Center for AI Safety, advisor to Elon Musk's xAI, and one of the most prolific and influential researchers in AI safety and alignment.While Dan has recently become somewhat famous in AI circles for his work developing and advocating for SB1047, I wanted to use this conversation to highlight what an all-purpose AI powerhouse Dan truly is, and to get his perspective on a number of questions that I've personally been wondering about. And so, this is a long episode, in which we cover a tremendous amount of ground, including:his early work on activation functions, including the widely-used GeLU function which he developed as an undergrad, and his work on benchmarks, including the insights that allowed him to create, in MMLU and MATH, some of the longest-lived and most-often-cited benchmarks in existence today, as well as what he's up to next with a project called "Humanity's Last Exam"We also cover his work on AI robustness and alignment, including:early work on robustness in image classifiers which showed how difficult robustness is to achieve,his 2023 paper introducing Representation Engineering, a top-down alternative to mechanistic interpretability which can be used to identify directions in latent space for monitoring and steering purposeshis 2024 paper, with past guests Andy Zou and Zico Colter, on Circuit Breakers, which builds refusal behaviors more deeply into LLM weights through a specialized fine-tuning process and most recently his work on Tamper-Resistant Training, which aims to make it difficult for users of open source models to remove refusal behaviors via fine-tuning, and which suggests that it might be possible for companies like Meta to open source models with durable guardrails built in. We also touch on a number of big picture issues around AI governance and the geopolitics of AI development; philosophical questions about the nature of intelligence and consciousness; and sociological questions about how AI might help us better forecast future events and generally improve our collective epistemicsWe even get a fascinating behind-the-scenes look at how he orchestrated the 2023 AI X-risk statement – which was signed by a remarkable set of industry leaders, including the CEOs of Deepmind, Anthropic, and yes, Sam Altman of OpenAI and which said, in full, that quote "Mitigating the risk of extinction from AI should be a global priority alongside other societal-scale risks such as pandemics and nuclear war."I think what struck me most about this conversation was that, despite all his experience and success, Dan's approach remains fundamentally experimental & his outlook very empirical. He places far more weight on data and compute than on algorithmic insights as drivers of capabilities advances, and he remains very open-minded both about how far the current AI paradigm will go, and about whether any of the safety approaches we're developing will really work when the chips are down. Ultimately, as you'll hear, that leads him to believe that we would be well-served to adopt a "defense in depth" strategy.As always, if you're finding value in the show, we appreciate it when folks take a moment to share it with friends or write an online review on Apple Podcasts or Spotify, and we welcome your feedback, via our website, cognitiverevolution.ai, or by DMing me on your favorite social network. Now, I hope you enjoy this expansive discussion, with one of the most impactful figures in AI safety and alignment – the great Dan Hendrycks.Nathan: Dan Hendrycks, Executive Director of the Center for AI Safety. Welcome to the Cognitive Revolution. I'm super excited to have you. You've been on my bucket list of top target guests for a long time and I'm glad we're finally making this happen. What I thought we would do today is ask all the questions that I really wanna ask of you and just get your take on a ton of different issues and just get your sort of outlook on all these different issues. Basically get the Dan Hendrycks AI worldview from a lot of different perspectives. I think it'll be quite informative for everyone, but starting with me. For starters, I looked you up on Google Scholar, found your number one cited paper still to this day is, maybe you can pronounce it for me, 2016. It's like a GIF for GIF thing. Is it Gellu or Jellu?Dan: I haven't decided. I'd say Jellu more frequently, but people can make up their minds.Nathan: I just think the creator gets to decide. So 2016, Jellu? Sure. So this was a new activation function, which basically was better than old activation functions and has been used in a ton of neural networks that people have trained since. I think it's also been maybe somewhat superseded. You can comment on it. Is it still the state of the art or have new, even more elaborate tweaks improved on it? But I'd love to get your kind of zoomed out sense of what are these activation functions doing in the first place? How should we understand them? I think people have studied a lot like the attention mechanism. And many people have a sense for sort of the residual stream as the core object and the sort of reads from the other parts back to it and all that sort of stuff. But what are these activation functions doing? I think they're underappreciated. What should our mental model of that be?Dan: Yeah, so to back up a bit, the JELU is a function that's like x times the cumulative distribution function of the normal distribution of x. So it's something complicated like that. In that line of research, we also made mention of other variants on it, like x times the sigmoid of x called the CELU, which we coined in that paper as well. This was largely presented as an alternative to the ReLU, which is x times the indicator of whether x is positive. So it's, the ReLU is like that in its shape. The JELU and CELU are more like these. They have a curve down and then go up. But anyway, this was my first paper and my first internship. I was like, I got to work on a paper before I get into the safety stuff, just to show I can learn the ropes. And then in the first week of that internship, I stumbled across that and then wrote it up and put it on arXiv. Since then, it's been in the CELU are, I think, pretty much the main activation in every cutting edge transformer model, GPT and Grok and LLaMA, etc. As far as intuition, I mean, I don't know. I think it's not really in deep learning about understanding. It's largely performance driven. And so that's why I think it's propagated, not because it is better theory or because it's more principled. It just tends to work better. Intuition that led me to think of it is that the ReLU is like a flat line and then it's a straight linear line. And so it's those two lines next to each other. And that seemed like a sharp transition. And I was thinking the general lesson in looking at machine learning over the past decades is you don't want sharp things. You want things being smooth, more probabilistic. And so I was trying to think of what's a natural way of smoothening that sharp kink in the ReLU. And since the ReLU is X times an indicator function, which is a step function, X times a step function, I just think smooth the step function. And then what's a natural way of smoothing a step function? Something like a cumulative distribution function or a sigmoid type of shape feels like a natural way of going about that. So that's what gave rise to it. And then after that first week in research and doing capabilities, I thought, okay, I can do capabilities now. And then ever since, I've been focusing on AI safety research.Nathan: Do you have an intuition? You said, why is it better? We don't know. You had your intuition for why it was something to be worth trying.Dan: I mean, there's complicated ones one can give, like when doing filtering of signals, there are kind of sharp filters. And then there are some of these smoother filters, audio processing, and the smooth ones tend to be better. They're a bit more computationally expensive. So I think just another domain, sharp filters are generally not what you want to do, but... I don't know. My sort of philosophy is you in deep learning and in other things, just try and find things that work and are impactful and not really care too much about the deep underlying reasons because they're largely inaccessible. A lot of things are not obvious, even in hindsight, what they're doing for a lot of my papers, a lot of the methods for them. It's not clear what they're actually doing, even in hindsight. And that's just a sort of fact of dealing with complex systems. There are limits to what inspection can unearth. And that's just the world we live in.Nathan: So can you give us just a little bit more on the understanding of activation functions as signal filtering?Dan: Yeah, I think that like detectors or something like that. So interpretation of activation functions could be, let's say you've got something that scores whether there's a whisker in an image. All right, and then if the neuron has a negative correlation with the whisker, that could be almost anything. That could be a plane, that could be a chair. There are lots of things that are in the opposite or in a different direction from a whisker. But meanwhile, if something is very positively related, that is an indication that you actually have found something like a whisker. So throw out the sort of negative signal or the zero signal, because that doesn't really help you, and preserve the sort of positive signal. So that's why one might want to filter, but one might not want to do just a... So the ReLU is saying throw out all negative signal, keep all positive signal, but it does so in a very sharp way, and then this just does it in a smoother way.Nathan: Gotcha. Yeah, that's interesting. It reminds me of Eliezer's, the opposite of stupidity is not intelligence. Infinite ways to be wrong. So if all we're signaling is that there's not something here, we'll just filter that noise out entirely. That's right. So one thing I've been really interested in recently is the series of papers called Makarov Arnold Networks. Ziming Liu is the lead author and it's out of Max Tegmark's group. I guess they're doing some specific things. I think learnable activation functions feel like maybe the next big thing. Like everything is learnable except for the activation functions in many networks today. And'''
