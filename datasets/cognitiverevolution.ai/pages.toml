full_description = '''Latest Episodes US-China Relations: History, Culture, and AI Competition, with Noah Smith, from Econ 102 Latest Episodes New Jersey’s AI Moonshot: Governor Phil Murphy on Partnerships, Progress, and Preparedness Nathan explores the world of AI-powered design with John Milinovich, Head of Generative AI Product at Canva.Watch Episode HereRead Episode DescriptionNathan explores the world of AI-powered design with John Milinovich, Head of Generative AI Product at Canva. In this episode of The Cognitive Revolution, we dive into Canva's innovative approach to AI integration, from task automation to human augmentation. Join us for an insightful discussion about fine-tuning foundation models, AI's impact on architecture, and practical tips for AI product development at scale.Check out Canva: https://www.canva.comBe notified early when Turpentine's drops new publication: https://www.turpentine.co/excl...SPONSORS:SelectQuote: Finding the right life insurance shouldn't be another task you put off. SelectQuote compares top-rated policies to get you the best coverage at the right price. Even in our AI-driven world, protecting your family's future remains essential. Get your personalized quote at https://selectquote.com/cognit...Incogni: Take your personal data back with Incogni! Use code REVOLUTION at the link below and get 60% off an annual plan: https://incogni.com/revolutionShopify: Shopify is the world's leading e-commerce platform, offering a market-leading checkout system and exclusive AI apps like Quikly. Nobody does selling better than Shopify. Get a $1 per month trial at https://shopify.com/cognitiveOracle Cloud Infrastructure (OCI): Oracle's next-generation cloud platform delivers blazing-fast AI and ML performance with 50% less for compute and 80% less for outbound networking compared to other cloud providers13. OCI powers industry leaders with secure infrastructure and application development capabilities. New U.S. customers can get their cloud bill cut in half by switching to OCI before December 31, 2024 at https://oracle.com/cognitiveBrave: The Brave search API can be used to assemble a data set to train your AI models and help with retrieval augmentation at the time of inference. All while remaining affordable with developer first pricing, integrating the Brave search API into your workflow translates to more ethical data sourcing and more human representative data sets. Try the Brave search API for free for up to 2000 queries per month at https://bit.ly/BraveTCRRECOMMENDED PODCAST:Unpack Pricing - Dive into the dark arts of SaaS pricing with Metronome CEO Scott Woody and tech leaders. Learn how strategic pricing drives explosive revenue growth in today's biggest companies like Snowflake, Cockroach Labs, Dropbox and more.Apple: https://podcasts.apple.com/us/...Spotify: https://open.spotify.com/show/...CHAPTERS:(00:00:00) Teaser(00:01:13) Sponsors: SelectQuote(00:02:26) About the Episode(00:04:33) Introduction - Creativity vs Design(00:08:39) AI-Assisted Experiences(00:10:25) Automation & Augmentation(00:15:27) Pixels to Objects to Concepts(00:17:58) Sponsors: Incogni | Shopify(00:20:40) Concept-Level Interfaces(00:23:35) The Future of Design(00:29:39) Human Element in Design(00:32:49) AI Talking to AI(00:35:52) Sponsors: Oracle Cloud Infrastructure (OCI) | Brave(00:38:04) Purpose-Specific AI Experiences(00:45:29) GPT-4 Image Editing(00:51:17) Graduated Approach to Launch(00:55:09) Fine-Tuning GPT-4(00:59:10) Cost & Latency(01:01:29) Hiring AI Engineers(01:05:02) Engineering Best Practices(01:09:00) Inspiration in the AI Space(01:18:28) The Gen AI Application Layer(01:24:26) OutroSOCIAL LINKS:Website: https://www.cognitiverevolutio...Twitter (Podcast): https://x.com/cogrev_podcastTwitter (Nathan): https://x.com/labenzLinkedIn: https://www.linkedin.com/in/na...Youtube: https://www.youtube.com/@Cogni...Apple: https://podcasts.apple.com/de/...Spotify: https://open.spotify.com/show/...TRANSCRIPT:Nathan: Hello, and welcome back to the Cognitive Revolution!Today my guest is John Milinovich, Head of GenAI Product at Canva. For anyone not already familiar, Canva is "an online design platform with a mission to empower everyone in the world to design anything", which has scaled to serve more than 200 million users with its highly accessible suite of design products. More recently, Canva has become a leader in AI-powered design, with a mix of point solution features like their excellent image background removal tool, more horizontal features, like their Magic Write tool that attempts to write in your brand's voice across the entire product suite, andAI superpower features like their new DreamLab text-to-image product, which is derived from their acquisition of Leonardo AI, which was reportedly, though not confirmed, for some $320 million dollars.In this episode, John shares Canva's framework for thinking about task automation versus human augmentation, Canva's approach to testing & evaluating AI features, insights on fine-tuning foundation models, and a fascinating discussion of how AI might transform fields like architecture, where John began his career. We also dig into practical tips for AI engineering, with John emphasizing the importance of maintaining "problem orientation" rather than getting too attached to any particular candidate solution.This conversation was a super fun opportunity for me to trade notes with another generative AI product leader, whose expertise has been demonstrated at global scale, and I think there's huge value here for anyone who wants to level up their thinking about what sorts of experiences AI can unlock, and how best to go about developing them. If you agree, we'd ask that you take just a second to share the show online, write a review on Apple Podcasts or Spotify, or just post a comment on Youtube. Of course, your feedback is always appreciated too – you can contact us via our website, cognitiverevolution dot ai, or by DM'ing me on your favorite social network. Now, I hope you enjoy this behind the scenes look at AI product development at scale, with John Milinovich of Canva.Nathan: John Milinovich, head of Gen AI product at Canva. Welcome to the Cognitive Revolution. John: Thank you so much, Nathan. I'm really excited to be here today. Big fan of the podcast and what you all are doing in Turpentine Network.Nathan: Cool. Thank you. I appreciate that. Well, right back at you, too. I mean, Canva obviously has been a leader in the design software space and helping people who are maybe not creative professionals, but still are at least a little bit creative to realize their visions for a number of years. Definitely a company that I've watched closely. I don't know if you know about me, but I started a company called Waymark that is doing a similar thing, but very much for companies. video advertising for small businesses so a narrower scope but very focused in on that one use case and we've obviously looked at Canva quite a bit and always kept an eye on what you guys are doing and the product leadership sort of speaks for itself i wanted to start off with a big picture question about creativity and how you think about helping people be creative or how creative they really I'm wondering how many people really want to be creative versus want to totally outsource that creativity. And maybe we're limited in the past by budget, but maybe in the age of AI, like just want stuff done for them. How do you think about how the population breaks down and what's your kind of framework for figuring out how to balance enabling their creativity versus just getting things done that they need done? I love this question. I love these types of big philosophical reflections as well.Nathan: I think first order is important to delineate design from creativity. I view design as the process of generating or synthesizing new ideas, whereas design is much more of a goal-directed process that's really trying to produce some kind of an output to communicate some goal or to accomplish some kind of mission that you're setting out for. So I think what we've seen is actually that creativity is something that is like the highest enjoyment for people and that people generally want to spend the most amount of their time doing. When it comes to design, we've actually done a lot of user research on this. And actually what we've seen is actually a perfect split of a third of people want to spend more time designing, a third of people want to spend less time designing, and a third of people want to spend about just the same amount of time doing it. I think what this really makes it clear for us as Canva is that our job is to really just help break down the barriers for true global creativity and also really give people the tools they need to really augment and enrich their workflows, no matter where they fall on that spectrum. And I think generally how much automation or how much augmentation people want, which is something I'm excited to dig into and talk more about that difference, really depends on the type of job that they're trying to do and how much of that creative expression they want to put onto the process versus how much they view it as a production-oriented task.John: Yeah. Okay. That's interesting. So a third, a third, a third. And are you trying to serve all those people? We have like, obviously Adobe is out there for the people that really want to specialize in the craft of a certain kind of design industry. Are you trying to support all of these different profiles? Or how do you think about what are the really in-focus user perspectives for Canva?Nathan: Definitely. I think, yeah, within Canva is 200 million-plus users. We definitely have a mix of all of those types of folks. And I think the thing that I think is so exciting to me about Canva and our mission to empower the world to design is that we're really trying to actually give people creative confidence where they might not have otherwise had it. There's this really unique... kind of gap in the market that enabled Canva to get to the scale that it's at, which actually does help people no matter where they are on that spectrum, actually express themselves in a way that makes them feel proud and ultimately it makes them feel good about themselves. So I think that even within that spectrum of those 200 million plus that Canva creates, there's a really wide range of what people are looking for there. And I think what we're really trying to do is help support all of them. And I think that is obviously a difficult task from a product experience standpoint, but I think is also something that I think we've been doing a pretty good job at for the last decade.John: Maybe you could organize this by personas. How do you think about the kinds of AI assisted experiences that these different folks will be best served by? I mean, in our case at Waymark, we really started to hear, and this is really what set me off on the AI journey that has now become personal consuming obsession. But we really started to hear from people in the like 2020, 2021 timeframe as we had finished our in-browser rendering and finished all the easy to use editing features and whatnot. We were, okay, what can we do next to make this product better and easier to use for you? And people started to tell us, Nothing really comes to mind. They would be like, it is pretty easy to use. That's not really a problem. I just don't have that many ideas. Or I don't really know what to say. Or I find writing to be kind of a challenge. And we were like, man, that's going to be really hard for us to UI our way around. So I think for our user type, which canonically is like small business owner, who is the typical story there is can they open the bakery because they love to bake? And now they've got all these other responsibilities. I think that's definitely a prime Canva target user too. We found for our people that they mostly just wanted this done for them. And that has led us to a very, tell us what you want, we'll try to make it for you. But one thing I was struck by as I was looking at Canva over the last few days is there's a lot more local utility tools, some of which are extremely well done and definitely lead the market. The background removal is top notch and hard to match otherwise from what I've seen. But there's less of a... super big picture, give us your like high level idea in 10 words and we'll spit all out at you. So really interested to hear how you've thought about that, those forking paths and which ones you've chosen to go down.Nathan: I think there's at the highest level, again, there's automation and augmentation. So I think generally that we've seen what people want from automation is to remove the ick from something that's just super annoying to do. So this is where things like background remover is a great example or something like magic switch where you're converting a doc into deck format or things like even magic sort within our new whiteboards product where you can take all the sticky notes from a brainstorm and put them into a new order to do these things where there's a as a user you know what you want the outcome to be but you just kind of want it done for you. So I think that's automation. The other dimension here is augmentation, which is, hey, I am fundamentally in the driver's seat. I am working towards something that I can't quite see what it is in my head yet. And I want a set of tools or a suite of capabilities that help me take that like fuzzy feeling and make it into something that's more concrete or really turn that idea into reality. So I think that's really been where I think the, again, it's a much fuzzier balance there because it's less obvious how can you measure the outcome as a user where you know it when you see it in a way. So I think we think a lot about our product portfolio in these two different dimensions of augmentation and automation. And I think generally speaking, when it comes to things that are more augmentation focused, what we've seen is that having really natural AI integration points, the existing product is really the best way to drive this forward. So it's very fundamentally like an embedded AI strategy where we're trying to again put AI at the point of need for users so that it can actually help them assist in whether they're again looking for that automation task or that augmentation task. I think that when you're asking about like having maybe a more separate or kind of AI native experience, actually this is something we've been thinking about and actually DreamLab, our first kind of point of view or opinion on what kind of a separate, maybe more AI centric experience can look like. So DreamLab is a new text to image generation product that Canva just launched with our Leonardo team, which is an incredible addition to the Canva family. And ultimately what DreamLab does is it actually expands the use cases that people have for Canva because our'''
