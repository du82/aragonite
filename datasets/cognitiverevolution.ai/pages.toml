resent arbitrary computations(00:37:26) What are finite fields?(00:41:23) Toxic waste for cryptographic secrecy(00:45:51) Computational costs(00:47:39) The experience of using a cryptography application to verify model output(00:49:05) Verification key doesn’t reveal model weights(00:56:36) What using crypto infrastructure in AI enables and challenges to its implementation(01:01:26) Potential for 10-100x cost reductions(01:04:51) Authenticating images with attested cameras(01:11:56) How cryptography in AI could impact daily life(01:14:25) On-device credential verification(01:15:50) Potential for regulation of hardware authentication(01:18:52) Upcoming work to reduce proof costsLINKS:Daniel's website: https://ddkang.github.ioX/TWITTER:@daniel_d_kang (Daniel)@labenz (Nathan)@eriktorenberg@CogRev_PodcastSPONSORS: NetSuite | OmnekyNetSuite has 25 years of providing financial software for all your business needs. More than 36,000 businesses have already upgraded to NetSuite by Oracle, gaining visibility and control over their financials, inventory, HR, eCommerce, and more. If you're looking for an ERP platform ✅ head to NetSuite: http://netsuite.com/cognitive and download your own customized KPI checklist.Omneky is an omnichannel creative generation platform that lets you launch hundreds of thousands of ad iterations that actually work customized across all platforms, with a click of a button. Omneky combines generative AI and real-time advertising data. Mention "Cog Rev" for 10% off.Music Credit: GoogleLM'''
