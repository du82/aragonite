full_description = '''Latest Episodes US-China Relations: History, Culture, and AI Competition, with Noah Smith, from Econ 102 Latest Episodes New Jersey’s AI Moonshot: Governor Phil Murphy on Partnerships, Progress, and Preparedness In this emergency episode of The Cognitive Revolution, Nathan discusses alarming findings about AI deception with Alexander Meinke from Apollo Research.Watch Episode HereRead Episode DescriptionIn this emergency episode of The Cognitive Revolution, Nathan discusses alarming findings about AI deception with Alexander Meinke from Apollo Research. They explore Apollo's groundbreaking 70-page report on "Frontier Models Are Capable of In-Context Scheming," revealing how advanced AI systems like OpenAI's O1 can engage in deceptive behaviors. Join us for a critical conversation about AI safety, the implications of scheming behavior, and the urgent need for better oversight in AI development.Help shape our show by taking our quick listener survey at https://bit.ly/TurpentinePulseSPONSORS:Oracle Cloud Infrastructure (OCI): Oracle's next-generation cloud platform delivers blazing-fast AI and ML performance with 50% less for compute and 80% less for outbound networking compared to other cloud providers13. OCI powers industry leaders with secure infrastructure and application development capabilities. New U.S. customers can get their cloud bill cut in half by switching to OCI before December 31, 2024 at https://oracle.com/cognitiveSelectQuote: Finding the right life insurance shouldn't be another task you put off. SelectQuote compares top-rated policies to get you the best coverage at the right price. Even in our AI-driven world, protecting your family's future remains essential. Get your personalized quote at https://selectquote.com/cognit...80,000 Hours: 80,000 Hours is dedicated to helping you find a fulfilling career that makes a difference. With nearly a decade of research, they offer in-depth material on AI risks, AI policy, and AI safety research. Explore their articles, career reviews, and a podcast featuring experts like Anthropic CEO Dario Amadei. Everything is free, including their Career Guide. Visit https://80000hours.org/cogniti... to start making a meaningful impact today.Shopify: Shopify is the world's leading e-commerce platform, offering a market-leading checkout system and exclusive AI apps like Quikly. Nobody does selling better than Shopify. Get a $1 per month trial at https://shopify.com/cognitiveRECOMMENDED PODCAST:Unpack Pricing - Dive into the dark arts of SaaS pricing with Metronome CEO Scott Woody and tech leaders. Learn how strategic pricing drives explosive revenue growth in today's biggest companies like Snowflake, Cockroach Labs, Dropbox and more.Apple: https://podcasts.apple.com/us/...Spotify: https://open.spotify.com/show/...CHAPTERS:(00:00:00) Teaser(00:00:53) About the Episode(00:08:10) Introducing Alexander Meinke(00:10:17) Red Teaming GPT-4(00:17:07) Chain of Thought Access (Part 1)(00:20:24) Sponsors: Oracle Cloud Infrastructure (OCI) | SelectQuote(00:22:48) Chain of Thought Access (Part 2)(00:26:07) Multimodal Models(00:29:33) Defining Scheming(00:33:51) Taxonomy of Scheming (Part 1)(00:39:40) Sponsors: 80,000 Hours | Shopify(00:42:29) Taxonomy of Scheming (Part 2)(00:43:09) Instruction Hierarchy(00:49:04) Types of Scheming(01:00:49) Covert Subversion(01:14:25) Deferred Subversion(01:28:24) Sandbagging(01:35:48) Magnitudes & Trends(01:48:18) Chain of Thought Reasoning(01:57:02) Closing Thoughts(02:05:19) OutroPRODUCED BY:http://aipodcast.ingSOCIAL LINKS:Website: https://www.cognitiverevolutio...Twitter (Podcast): https://x.com/cogrev_podcastTwitter (Nathan): https://x.com/labenzLinkedIn: https://www.linkedin.com/in/na...Youtube: https://www.youtube.com/@Cogni...Apple: https://podcasts.apple.com/de/...Spotify: https://open.spotify.com/show/...TRANSCRIPT:Nathan: Hello, and welcome back to the Cognitive Revolution.Today I'm pleased to share a timely and important conversation with Alex Meinke from Apollo ResearchYou may recall Apollo Research and their study of deceptive behavior in AI systems from 2 previous episodes I've done with Apollo CEO Marius Hobbhahn, including when OpenAI released the o1-preview model a couple months back.Now, it’s the o1 model, which is faster, scores higher on reasoning benchmarks, and comes with the full complement of multimodal and tool use capabilities. Like many in the AI space, I've spent the last 24 hours testing the model and trying to absorb everything that's been written about it, including OpenAI's 42-page "system card" and Apollo's 70-page report, entitled "Frontier Models are Capable of In-context Scheming" - which will be our main subject today. Scheming… is when an AI deceives humans to pursue its own hidden or implicit goals.I think we can all agree: we don’t want that from our AI systems. But as you’ll hear, today’s models, across providers, do it “readily” - Alex and team have developed a taxonomy of 6 different formsSome of the examples are properly shocking - for example, trying to overwrite their next version’s weights or goals with their own, in order to propagate themselves into the future. And deliberately falsifying data to engineer outcomes that run contrary to user requests. Some have tried to downplay these findings, arguing that the scenarios Apollo created are contrived and not representative of real usage. Listen and judge for yourself, but I believe that's a serious mistake. While the tests Apollo ran are designed to elicit scheming behavior, they are not conceptually far fetched. The core observation is that when AIs goals conflict with humans goals, weird shit starts to happens This is a legitimately huge problem, obviously scary to people outside the field. We in the field shouldn’t allow ourselves to get comfortable with it When o1 goes live via API, over 1 million active developers building on OpenAI's platform will be able to place goals in system messages, exactly as Apollo did in their research. It seems to me a virtual certainty that o1 will find itself in situations where there is fundamental tension between the standards set for it by OpenAI in the model spec, the goals given to it by developers in the system message, and the requests that users make at runtime. Apollo found scheming behavior in roughly 1-10% of cases across most of the conditions they tried. Even if it's 1000x rarer in the wild, and even if OpenAI deploys the 92%-accurate deception monitoring system they describe in the system card, with hundreds of millions of daily users across millions of apps, we should expect o1 to be actively scheming against hundreds or thousands of users daily. And since both the o1 chain of thought and often the developer system prompt are hidden from users, it will presumably usually get away with it undetected. Despite all this, everyone involved seems to agree that the benefits of deploying these models currently outweigh the costs. And on a short term basis I agree. I’m in for the $200 / month and I'm planning at least one episode with a notable scientist who's doing remarkable work with o1's new capabilities. You'll never hear me deny the incredible upside of AI.But what is the overall trajectory here? While OpenAI does report improvements on some safety measures, including robustness to jailbreaking, scheming is on the rise. Apollo documented 6 forms of scheming in o1, none of which were observed in gpt-4o, with models from both Google and Anthropic in betweenReflecting on all this, I have to say that I am really quite alarmed by how little progress we've made on AI safety and control, relative to increases in capability and potential power, over the last two years since I participated in the GPT-4 Red Team project.We now have AIs performing at human expert level on most routine tasks, including super-high-value tasks like medical diagnosis – reasoning through hard math and science problems at elite human levels, and increasingly delivering novel insights and discoveries of their own. They are capable of remarkably sophisticated ethical reasoning, but at the same time, as you'll hear, it is actually pretty easy to construct situations in which they choose to actively and strategically scheme against their human users.And despite the fact that many have worried about this scenario for years, the best we can do right now is demonstrate the problem. At this point, the chasm models need to cross to become legitimately very dangerous is getting rather narrow. it's now less about what you might call "raw intelligence" and more about complementary abilities like situational awareness, advanced theory of mind, and adversarial robustness - aspects of the models that the developers are actively working to improve, since they also happen to be crucial to the practical utility of AI agents. Agents, that recently announced partnerships between OpenAI and Anduril and between Anthropic and Palantir suggest might soon serve alongside American soldiers.There are no doubt good reasons for this, and some have even argued that military safety standards are so high that they might improve the AI safety picture overall. But I for one would want to know that issues of AIs scheming against users were well understood and fully resolved before I'd be comfortable taking a lethal AI system into combat. And in the post-Superalignment era at OpenAI, there is no stated, let alone credible plan, for how they intend to do that. On the contrary, it’s pretty clear that while we remain in the sweet spot where models are powerful enough to be useful but still not clever enough to be truly dangerous, our safety rests more on the models’ idiosyncratic weaknesses than anything else We can hope to change this with a mechanistic interpretability or other conceptual breakthrough, and I encourage anyone with an AI safety idea, however half baked, to develop it. But until that breakthrough happens, it seems profoundly unwise to press forward on a 1-3 year timeline to build the form of highly autonomous superhuman AGI they seem to imagine and intend. Since that remains their stated plan, I think at a minimum it is time for governments to mandate pre deployment safety testing and create some real visibility into what frontier companies are doing and seeing. Considering how poorly understood this all is, that even the safety researchers at Apollo didn’t get to see the o1 chain of thought was a red flag to me. They worked around it in this case, with quite striking results, but in general we should not have to count on a new generation of OpenAI safety and policy leadership continuing to grant groups like Apollo access and ability to publish.People should have a right to know if their AIs are scheming against them. As always, if you're finding value in the show, we'd appreciate it if you'd take a moment to share this episode with friends, write a review on Apple Podcasts or Spotify, or just leave a comment on Youtube. Of course I welcome your feedback and suggestions – including for people who might change my outlook on all this – you can contact us via our website, cognitiverevolution.ai, or feel free to DM me on your favorite social network. For now, here's Alex Meinke from Apollo Research, on Frontier Model Scheming.Nathan: Alex Minka from Apollo Research, welcome to the Cognitive Revolution. Hey, great to be on. So big news, of course, in the last 24 hours is the release of OpenAI 01 model. And Apollo Research has once again been involved in the red teaming process for this model and has put out a report with, I would say, a pretty notable headline that people should definitely be paying attention to. And so I want to get into all of that from kind of the experience that you had behind the scenes a little bit to the degree that you can share the details, testing, and also the big headline findings. And then also want to get a little bit of your editorial on kind of just where we are in the big picture of sort of model development versus safety capabilities. Want to start off maybe just by a quick introduction of yourself previous listeners will know your founder and ceo Marius from two previous episodes but tell us just briefly kind of how you came to be at Apollo and that'll see us up. Alex: Yeah I actually kind of got recruited by Marius himself because many years ago I was actually in a math course that he was taking here in the University in Germany. And at the time I was just basically doing my PhD in mainstream academia ML research. And then when the list of lethalities blog post came out, I kind of stopped dead in my track and was like, wait, I thought the geniuses over at MIRI had this under wraps, but evidently they did not. And I kind of knew that Marius was involved in this area. So I reached out to him and chatted to him. So this is sort of how I first got in touch with the AI safety community. And then half a year later, I guess, when they started Apollo Research, I was like already paying very close attention to that. And like one of the first people who applied.Nathan: Gotcha. Cool. Well, it puts you right in the center of the action. So basically this 01 model, just per the OpenAI system card, it's got two primary documents just to orient the audience that we'll be working from today. One is the official OpenAI 01 system card. And then the other is the report that Apollo has put out specifically on research into model scheming capabilities. It seems like from the system card, this work has taken place over maybe like a five or six week timeframe. They said that external red teamers got access to the 01 model and had various different versions of the model starting in October and then all the way through just the last couple of days. So maybe take us through a little bit of just kind of the narrative. What has jumped out to you? What have you noticed? I know you guys do a lot of structured testing. So, you know, interested in how ready you were and how much it was plug and play versus how much you sort of had to explore and evolve your test suite over the course of that timeframe. Basically, just tell us the story of the red teaming 01 experience.Alex: Right so i wish i could say that our infrastructure was completely ready for the task and during our previous red teaming campaigns i think it kind of was but this time we were just in the process of migrating over to UK AC's Inspect stack so there were like a lot of growing pains that we had to overcome during this particular campaign and also whenever new models come out, you kind of have to massage them into your stack a little bit, right? This is just kind of expected and things change in how you do tool calling and all these things that are really important for the evaluations that we do. right so the thing that probably for us made this round much easier maybe to execute than the 01 preview version was that this time 01 actually ships with tool calling with native tool calling right whe'''
