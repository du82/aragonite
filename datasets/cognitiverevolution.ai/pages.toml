full_description = '''Latest Episodes US-China Relations: History, Culture, and AI Competition, with Noah Smith, from Econ 102 Latest Episodes New Jersey’s AI Moonshot: Governor Phil Murphy on Partnerships, Progress, and Preparedness Nathan and co-host Stephen Parker delve into the world of AI video generation with Anastasis Germanidis, Co-Founder and CTO of Runway.Watch Episode HereRead Episode DescriptionNathan and co-host Stephen Parker delve into the world of AI video generation with Anastasis Germanidis, Co-Founder and CTO of Runway. This episode of The Cognitive Revolution explores the cutting-edge technology behind Runway's Gen 3 models and their impact on the creative industry. From emergent properties in scaled-up models to the democratization of video creation, join us for an illuminating discussion on the future of AI-generated content and its potential to reshape entertainment and culture.Check Out Runway here: https://runwayml.comApply to join over 400 Founders and Execs in the Turpentine Network: https://www.turpentinenetwork....SPONSORS:Notion: Notion offers powerful workflow and automation templates, perfect for streamlining processes and laying the groundwork for AI-driven automation. With Notion AI, you can search across thousands of documents from various platforms, generating highly relevant analysis and content tailored just for you - try it for free at https://notion.com/cognitiverev...Weights & Biases RAG++: Advanced training for building production-ready RAG applications. Learn from experts to overcome LLM challenges, evaluate systematically, and integrate advanced features. Includes free Cohere credits. Visit https://wandb.me/cr to start the RAG++ course today.Omneky: Omneky is an omnichannel creative generation platform that lets you launch hundreds of thousands of ad iterations that actually work customized across all platforms, with a click of a button. Omneky combines generative AI and real-time advertising data. Mention "Cog Rev" for 10% off https://www.omneky.com/Oracle: Oracle Cloud Infrastructure (OCI) is a single platform for your infrastructure, database, application development, and AI needs. OCI has four to eight times the bandwidth of other clouds; offers one consistent price, and nobody does data better than Oracle. If you want to do more and spend less, take a free test drive of OCI at https://oracle.com/cognitiveRECOMMENDED PODCAST:This Won't Last - Eavesdrop on Keith Rabois, Kevin Ryan, Logan Bartlett, and Zach Weinberg's monthly backchannel ft their hottest takes on the future of tech, business, and venture capital.Spotify: https://open.spotify.com/show/...CHAPTERS:(00:00:00) About the Show(00:00:22) About the Episode(00:03:05) Introduction and AI for Creative Work(00:03:39) Video Generation as World Modeling(00:05:52) Emergent Properties in Scaled Models(00:08:44) Importance of Architecture vs Data(00:10:57) Multimodal Models(00:15:52) Sponsors: Notion | Weights & Biases RAG++(00:18:37) Video Understanding and AGI(00:25:03) AI Agents for Video Creation(00:27:30) Runway's culture of shipping(00:29:20) Balancing Research Publication and Strategy(00:33:19) Sponsors: Omneky | Oracle(00:34:40) Features Variety Release Cycle(00:36:54) Power Users(00:38:56) Interactive Video(00:40:40) Scaling Challenges(00:42:21) Future of Creativity(00:45:24) Competing with Giants(00:47:39) Model Divergence(00:49:28) Disclosure vs. Strategy(00:51:19) Runway's API(00:54:23) OutroSOCIAL LINKS:Website: https://www.cognitiverevolutio...Twitter (Podcast): https://x.com/cogrev_podcastTwitter (Nathan): https://x.com/labenzLinkedIn: https://www.linkedin.com/in/na...Youtube: https://www.youtube.com/@Cogni...Apple: https://podcasts.apple.com/de/...Spotify: https://open.spotify.com/show/...TRANSCRIPT:Nathan: Hello, and welcome back to the Cognitive Revolution!Today I'm excited to share my conversation with Anastasis Germanidis, CTO of Runway ML, a company that's become synonymous with AI video footage generation, and which, with their latest Gen-3 models, continues to lead the video generation market. Joining me as co-host for this episode is my good friend Stephen Parker, Creative Director at Waymark and co-creator of the AI-generated film "The Frost," which we've covered in a previous episode. As a power user of many generative art tools, including Runway, Stephen brings an extremely valuable perspective to this conversation.I came away from this discussion super impressed by Anastasis. We threw a lot at him, and he gave very nuanced, thoughtful answers on topics includingvideo generation models as world modelers and the potential role of video understanding on the path to AGI. emergent properties Anastasis and the Runway team have observed as they've scaled up their models, including surprisingly accurate liquid simulations and improvements in 3D consistencyRunway's product development philosophy and culture of rapid iteration, including how they think about shipping upgraded models that might disrupt existing user workflows, and of course, the challenge of scaling to meet explosive demand.We also discussthe creative possibilities unlocked by these tools, from pre-production storyboarding to generating footage for use in final productions,the importance of data quality over architecture complexity, the potential for the next generation of models to incorporate audio, the intriguing possibilities of interactive AI-generated environments, how all this might shape the future of entertainment and culture more broadly, and even how Anastasis thinks about competing in a game of scale with tech giants who have functionally unlimited resources. In Runway's innovations, we can clearly see signs of things to come - democratizing access to high-quality video creation means more stories from a wider range of voices, but also potentially major economic disruption for the iconic American film and television industry.As always, the pace of change is relentless – since we recorded this episode, Runway has launched API access, and we at Waymark are super excited to be among the first wave of customers to try it out!If you're finding value in the show, we'd love it if you'd share it with a friend or leave us a review on Apple Podcasts or Spotify. And of course we welcome your feedback, via our website, CognitiveRevolution.ai, or by DMing me on your favorite social network. Now, I hope you enjoy this illuminating discussion about the technology behind and impact to come from AI video generation, with Anastasis Germanidis, CTO of Runway ML.Nathan: Anastasis Germanidis, CTO of RunwayML. Welcome to the Cognitive Revolution.Anastasis: Great to be here.Nathan: I'm excited for this conversation and also excited to have my teammate and friend Stephen Parker creative director at Waymark along for this episode. We're going to get into generative AI for creative work. And he is an expert in that with a film that we've covered in a previous episode, The Frost, now traveling the globe and making its debut in Singapore. I will be the least knowledgeable about what is going on here today, but excited to have this conversation. I thought we would start with a big picture discussion of video generation as world modeling and as a step on the perhaps critical path to AGI. I'd love to hear your perspective on the case that video generation really is something that we have to have on the way to an AGI destination.Anastasis: So humans are visual beings. Like being in the physical world is a fundamental aspect of being human. And you can formulate so many tasks humans do in the modale of video. So the world models is like as those models basically learn through video data, large volumes of the video data, they gain powerful representations of the 3D world. They gain representations about a wide range of human activities of different tasks that you can perform in the world. And so that knowledge can be leveraged to generate video, which is where we came from, but also for a variety of different other tasks. Video models will kind of power huge applications in robotics to build representations of the world. One framework I like to use is that every representation of the world, like whether it's video, whether it's language, whether it's another representation is, it's ultimately a proxy for reality. But video itself has much less inductive biases than text, specifically the text that language models are trained on. Text captures a much smaller subset of everything that humans care about compared to video. So that's in a nutshell, kind of the case for why video generation can lead to broadly useful general intelligence and how we're thinking about it.Nathan: So, a lot to unpack there. A couple just follow-ups in different directions. One might say, is video enough? If you're to take that argument, could you say, maybe we need actual 3D point grid representations of the world? Is it a matter of just video being abundant relative to an even richer modality that makes it the natural place to work from? Or... Do you think that video is in some way a threshold that means it can do similar things as if you had a full 3D model?Anastasis: So what we found is that you can essentially learn 3D. You can gain 3D knowledge simply from the 2D footage. Models like Gen-3 have remarkable 3D consistency in like if you're generating a camera moving in a specific direction. Essentially, you'll see things in the environment remaining consistent as as you expect from a 3D point of view. We think 2D representations are sufficient to capture a 3D knowledge. 3D data is really hard to find at scale. And that's why generally research in 3D computer vision has not advanced as much as it has advanced in the 2D domain. So those are the two main arguments. the abundance of video data and the fact that you can derive 3D presentations from 2D data that makes video a good candidate for learning those broadly useful representations.Nathan: When you mentioned object consistency that definitely reminded me of OpenAI statements that the things like object permanence and the sort of intuitive physics that seem to get better with scale, I believe their phrase for describing this was, these are purely products of scale. I wonder what you would say have been the most interesting emergent properties or behaviors that you have seen as you have scaled up. What has jumped out and surprised you that you didn't necessarily engineer into the system, but nevertheless observed?Anastasis: That statement definitely aligns with what we've seen as well. If you compare, we released Gen 2 more than a year ago. We released Gen 3 recently. If you compare the outputs from the Gen 2 model to the outputs of Gen 3, there is a large step-up in capabilities. And a lot of that can be attributed to compute. There's a lot of other things that we did differently as we were building Gen 3. We've seen a lot of interesting emerging capabilities of Gen 3. Some interesting things on the world modelling side are the ability to simulate liquid simulation being surprisingly more accurate than you'd expect for a model that has no prior knowledge of how liquid should behave. There are specific problems that we try to understand those capabilities, like the interaction between a boiling pot where you throw out water on the boiling pot. Those kinds of interactions reveal some really surprising physics knowledge embedded into the model. And that's all completely learned from data, learn from scale. There is no specific inductive priors that we introduce the model to make it follow the laws of physics. There is a lot more room to further improve those things. The model doesn't fully follow the laws of gravity perfectly, like even generating something like a bouncing ball, can be challenging. So I don't think the problem is fully solved. But if you see the delta between Gen 2 and Gen 3, and you extrapolate from there, I don't see a fundamental reason why that additional physics knowledge and the more precise understanding of the world is not going to emerge.Nathan: How much do you think the architecture matters? Different companies have given different amounts of windows into their architectures. Do you think that the different big efforts to build these sorts of models will converge and ultimately have a similar architecture that is found to work the best? Or do you think there is room in the space of possible models to see divergence of different strengths and weaknesses?Anastasis: There's definitely more algorithmic improvements to be made. I don't think our collective exploration is a field of possible architectures has reached the conclusion. Of course, there is a lot more convergence to transformers and components and a very small side of architectures across modalities. At the same time, I do think there is, there's been traditionally much more focused on architecture compared to data, objectives, tasks in the field of machine learning. If you look at the most recent computer vision conference, the kind of the intake kind of survey of all the papers, you'll see there is probably a disproportion focus on architectures than on other aspects of training those models. Data is really important, specifically the tasks that you're teaching the model through data is something that there's probably less published work on as much as architecture.Nathan: Have you studied KANs at all? That's the Kolmogorov Arnold Network that's out of Tegmark's group at MIT. Ziming Liu is the first author. The reason I bring it up is they've created a way to learn activation functions. And now they've also created a way to initialize these networks with specific activation functions, that can encode a whole range of useful physics operators into a network. It seems like to me, an extremely promising neuro-symbolic approach If you've seen that great, if not, I wonder if you have any thoughts on embedding into future architectures, things that would be like obvious calculations that one might want to actually run simulated physics. Obviously, you said gravity's not perfect. If you could build in a parabola operator into the network, presumably that would help with getting these fine points dialed in a little bit more. Any thoughts on that?Anastasis: I'm not very familiar with the paper, but I think something that very often happens with a lot of kind of new architectures that supposedly perform common architectures. And we saw that with myriads of different alternative forms of linear attention. At some point, that was a big focus of the field, just figuring out if there is an more efficient mechanism of attention. Very often, the way those are presented in literature can lead to wrong conclusions. One very common thing is comparing the performance of two models with the same number of iterations, but not take into account that those models might have different amount of compute per forward pass. So there's all those different things that end up confusing the overall c'''
