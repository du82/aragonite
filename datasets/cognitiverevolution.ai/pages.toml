full_description = '''Latest Episodes US-China Relations: History, Culture, and AI Competition, with Noah Smith, from Econ 102 Latest Episodes New Jersey’s AI Moonshot: Governor Phil Murphy on Partnerships, Progress, and Preparedness In this episode of The Cognitive Revolution, Nathan delves into the fascinating world of AI-generated research ideas with Stanford PhD student Chenglei Si.Watch Episode HereRead Episode DescriptionIn this episode of The Cognitive Revolution, Nathan delves into the fascinating world of AI-generated research ideas with Stanford PhD student Chenglei Si. They discuss a groundbreaking study that pits AI against human researchers in generating novel AI research concepts. Learn about the surprising results that show AI-generated ideas scoring higher on novelty and excitement, and explore the implications for the future of AI research and development. Join us for an insightful conversation that challenges our understanding of AI capabilities and their potential impact on scientific discovery.Be notified early when Turpentine's drops new publication: https://www.turpentine.co/excl...SPONSORS:Weights & Biases RAG++: Advanced training for building production-ready RAG applications. Learn from experts to overcome LLM challenges, evaluate systematically, and integrate advanced features. Includes free Cohere credits. Visit https://wandb.me/cr to start the RAG++ course today.Shopify: Shopify is the world's leading e-commerce platform, offering a market-leading checkout system and exclusive AI apps like Quikly. Nobody does selling better than Shopify. Get a $1 per month trial at https://shopify.com/cognitive.Notion: Notion offers powerful workflow and automation templates, perfect for streamlining processes and laying the groundwork for AI-driven automation. With Notion AI, you can search across thousands of documents from various platforms, generating highly relevant analysis and content tailored just for you - try it for free at https://notion.com/cognitivere...Brave: The Brave search API can be used to assemble a data set to train your AI models and help with retrieval augmentation at the time of inference. All while remaining affordable with developer first pricing, integrating the Brave search API into your workflow translates to more ethical data sourcing and more human representative data sets. Try the Brave search API for free for up to 2000 queries per month at https://bit.ly/BraveTCROracle: Oracle Cloud Infrastructure (OCI) is a single platform for your infrastructure, database, application development, and AI needs. OCI has four to eight times the bandwidth of other clouds; offers one consistent price, and nobody does data better than Oracle. If you want to do more and spend less, take a free test drive of OCI at https://oracle.com/cognitiveCHAPTERS:(00:00:00) About the Show(00:00:22) Sponsors: Weights & Biases RAG++(00:01:28) About the Episode(00:05:30) Introducing Chenglei(00:06:22) Path to Automating Research(00:07:58) Notable AI Research Projects(00:15:26) Evaluating Research Ideas (Part 1)(00:19:39) Sponsors: Shopify | Notion(00:22:33) Evaluating Research Ideas (Part 2)(00:25:49) Research Setup and Design(00:29:38) AI Prompting and Idea Generation(00:34:40) Diversity vs. Quality of Ideas (Part 1)(00:34:40) Sponsors: Brave | Oracle(00:36:44) Diversity vs. Quality of Ideas (Part 2)(00:42:05) Inference Scaling and Execution(00:45:04) Anonymizing and Evaluating Ideas(00:53:22) Headline Results and Analysis(00:58:45) Observations and Insights(01:09:02) Novelty Indicators and Deception(01:11:59) Top AI-Generated Ideas(01:14:41) Next Steps and Future Directions(01:20:43) Expectations for the Future(01:23:14) OutroSOCIAL LINKS:Website: https://www.cognitiverevolutio...Twitter (Podcast): https://x.com/cogrev_podcastTwitter (Nathan): https://x.com/labenzLinkedIn: https://www.linkedin.com/in/na...Youtube: https://www.youtube.com/@Cogni...Apple: https://podcasts.apple.com/de/...Spotify: https://open.spotify.com/show/...TRANSCRIPT:Nathan: Hello, and welcome back to the Cognitive Revolution!Today my guest is Chenglei Si, a PhD student at Stanford who is developing ways to use LLMs to automate research, and lead author of a fascinating new paper that asks the question "Can LLMs Generate Novel Research Ideas?"The question has become one of the most important in the entire field, as the ability to generate research ideas worth pursuing - particularly in the domain of AI - has long been considered a key precursor to recursive self-improvement loops and a possible intelligence explosion. Since the early days of GPT-4, we've seen several notable attempts to create AI research assistants, including projects like Co-Scientist from Gabe Gomes group CMU, which we did a full episode on, and more recently the AI Scientist paper from Japanese company Sakana AI. These systems demonstrated capabilities that would have seemed impossible just a couple years ago – including translating natural language instructions to chemistry protocols, and using Semantic Scholar to assess research ideas for originality, but the question of whether AI systems can produce high-value novel research ideas, true "eureka moments", has been subject of fierce debate.Chenglei and his collaborators set out to shine light on this subject with an ambitious study. They asked more than 100 human PhD researchers working in AI for new research ideas, incentivizing quality with cash prizes, and then asked Claude for novel ideas as well. After processing the text in an attempt to create a level playing field for evaluation, they then had expert reviewers rate all the ideas without knowing their source. The results were striking: the AI-generated ideas scored significantly higher on both novelty and excitement.As with many recent AI results, this paper has become something of a Rorschach test - those inclined to believe in rapid AI progress see it as a major milestone, while skeptics criticize the methodology – somewhat unfairly in my view, but you can judge for yourself as you listen – and more persuasively in my mind, emphasize that this work, which focuses specifically on prompting techniques for language models, may not generalize to the harder sciences.Personally, while I agree that we can't confidently project this one result onto other domains, I find the experimental setup here to be quite well done, the statistically significant results seem credible, and I think Chenglei's individual observations are worth taking very seriously as evidence too. Everyone listening to this show should be familiar with the AI maxim "look at your data", and nobody has spent more time with the raw outputs than he has, so when he reports that 9 of his 10 favorite ideas turned out to be AI generated, and that the AI ideas are more "out of the box" and "less grounded in existing work" than human ideas, I think we would do well to listen.Overall, my feeling right now is that we are at a sort of tipping point, where the Claude 3.5 Sonnet and GPT-4o class of models can sometimes, with great effort put into system design and many millions of tokens to burn, generate meaningful novel research ideas, but not in a way that makes frontier research dramatically more accessible or scalable for non-experts.The next generation of models, starting with the o1 series, seem pretty likely to change that. I've been coding with o1 and Cursor a lot lately, and I have been struck by how effectively o1 can review my entire codebase and my plan for a new feature, and return both a critique of my approach and a recommended alternative that is genuinely better.As a community we're all still figuring out exactly what the limits of this capability are, but if I had to bet, I'd say that systems like Chenglei's, powered by o1 and a bigger inference budget, might well produce undeniably needle-moving results quite soon. As always, if you're finding value in the show, we appreciate it when folks share it with friends, or write a review on Apple Podcasts or Spotify, or just leave a comment on Youtube. And we welcome your feedback via our website, CognitiveRevolution.ai, or by DM'ing me on your favorite social network. For now, I hope you enjoy this conversation on the emerging reality of AI-automated research, with Chenglei Si.Nathan: Chenglei Si, PhD student at Stanford, researching the automation of research. Welcome to the Cognitive Revolution.Chenglei: Thank you. Excited to be here.Nathan: I'm excited for this conversation. I think you are working on a super interesting frontier and your recent paper with a provocative question in the title has certainly caught my attention and I think the attention of the field more broadly. So the paper that we're here to really go deep on today is called, Can LLMs Generate Novel Research Ideas? A large scale human study with a hundred plus NLP researchers. I'm looking forward to breaking this down and really getting into the nitty gritty of the methodology and what we can learn from it and what we should maybe take away from this and expect to see as we go forward into the near future. For starters, want to maybe just give me a little bit of kind of your background, like how did you get to focus on this question of automating research and maybe love to hear too some of the results from the last year or two that you have found to be most compelling.Chenglei: Yeah, so I came from a very NLP background. I was doing NLP research back during my undergrad, and then I came to Stanford last year, and then I met my advisor, Stian Tatsu. And I always wanted to do something different for my PhD. And back then, the big background in the whole NLP field is that large language models are getting really good. And then we saw some really impressive performance on things like reasoning, math, and coding and stuff like that. And we feel like it probably could give opportunities to some very new applications. And as someone who has done research for many years, I feel like being able to automate research feels like something very different and very exciting. And importantly, I think it will have huge practical implications to the entire field. And I just got excited about this agenda right away. And I'm lucky that most of my advisors are very excited about this whole agenda as well. So we actually got started on this whole thing pretty early. I think roughly one year ago, this whole project actually took around a year to finish.Nathan: Yeah. Interesting. And I trust that the human parts of that took the most legwork and took the most time. That is often the striking difference these days.Chenglei: Yeah. Building the agent itself took us like two or three months and then finding all the people and doing the actual human study took us like eight months or so.Nathan: Yeah. Interesting. Before we dive into the details of your paper, what other projects, and they don't necessarily have to, it could be academic papers, but it could also be open source projects, have captured your imagination and kind of stand out to you as the notable step change improvements on the road to this project destination of automated research.Chenglei: Yeah. So I think to me personally, there's this line of work on self-improving AI. There has been discussion on whether, as AI keeps getting better, there will be a point where AI can be even smarter than humans. At that point, how do we possibly keep improving AI if AI is getting smarter than us humans? Then it gives rise to this idea that maybe we can let the smarter AI to propose new ideas and improve itself. There has been some preliminary attempts on that. There has been some work done by folks here at Stanford, like Eric Zuckerman, and that's one inspiration for this line of work. But of course, there's also another line of work on building tools that can assist researchers. A lot of colleagues from HCI, folks like Semantic Scholar, a bunch of other people have been doing this for many years. So research assistant tools, creative support tools is another inspiration for this. But I think we really take a very different approach in the sense that once you do something that sounds even more aggressive, in the sense that we want you to see if we can possibly automate the entire research process rather than just build some assistant tools there.Nathan: Yeah, I think you've zeroed in on a really important question. I've looked for what it's worth at. This is kind of an area I try to keep up with because it feels to me like... If we are going to have an intelligence explosion, this is kind of the form that it's going to take, right? It's going to be, and I'm by no means like alone in this analysis or original in coming up with the analysis, but basically it seems like the expectation from the field is at some point, we're going to start to see AI systems that can make meaningful contributions to LLM research. And if LLM research becomes 10x, 100x, 1,000x more productive because we can sort of spin up AI LLM researchers and they can actually take real bites out of big problems, then it's really hard to say how good the overall resulting models could get. And that could take us into a different regime. So it feels like there's this sort of tipping point possibly where if we can't get over that hump, then things maybe stay somewhat normal. And if we do get over that hump, then kind of all bets are off and the future starts to look quite unpredictable and potentially quite weird. I guess for starters, is that your mental model of why this matters so much in the first place?Chenglei: Yes, you mentioned the word intelligence explosion. So I've read the whole situation awareness thing that Leopold wrote. My advisor Tatsu was warning me that using intelligence explosion would sound too aggressive for an academic setting. But I think on this podcast, it's probably fine. So yes, roughly that was one exciting vision that I kind of want to open to you. There's a very interesting data point. If you remember, there's a figure there where Leopold was saying, Around the year of 2028, we would be able to get automated ALEC Redford. So ALEC was like the lead author on the GPT paper. So if there was a point where we are able to automate ALEC Redford and we scale this up, that means we'll have massive increase in the way AI can improve itself. That would be insane. But we want to, you know, maybe take a step back. Automating ALEC is a pretty difficult role. There's only one ALEC in the whole AI field. So maybe once you really see the current generation of language models, how good they are right now. What do you compare that with a more reasonable baseline? So maybe want to see how do they compare with, let's say, average PhD students. I want to offer a concrete benchmarking point to gauge the progress that we have made so far. So that was the motivation for the whole thing.Nathan: Yeah. Okay, cool. So just to and by the way, Alec Radford has been making the rounds on Twitter just today as '''
