full_description = '''Latest Episodes US-China Relations: History, Culture, and AI Competition, with Noah Smith, from Econ 102 Latest Episodes New Jersey’s AI Moonshot: Governor Phil Murphy on Partnerships, Progress, and Preparedness Nathan hosts Professor Michael Levin and Staff Scientist Dr.Leo Pio Lopez from Tufts University in this episode of The Cognitive Revolution.Watch Episode HereRead Episode DescriptionNathan hosts Professor Michael Levin and Staff Scientist Dr.Leo Pio Lopez from Tufts University in this episode of The Cognitive Revolution. They discuss their groundbreaking paper that combines biological datasets into a unified network model of disease using advanced embedding techniques. The conversation covers the technical details of their work, including a predicted link between GABA and melanoma, and explores broader topics in AI for biology. From multi-scale intelligence in biological systems to the future of human enhancement and digital life, this thought-provoking episode reminds us of the rapidly approaching future and the work needed to prepare for it.Apply to join over 400 Founders and Execs in the Turpentine Network: https://www.turpentinenetwork....SPONSORS:Notion: Notion offers powerful workflow and automation templates, perfect for streamlining processes and laying the groundwork for AI-driven automation. With Notion AI, you can search across thousands of documents from various platforms, generating highly relevant analysis and content tailored just for you - try it for free at https://notion.com/cognitivere...Omneky: Omneky is an omnichannel creative generation platform that lets you launch hundreds of thousands of ad iterations that actually work customized across all platforms, with a click of a button. Omneky combines generative AI and real-time advertising data. Mention "Cog Rev" for 10% off https://www.omneky.com/Oracle: Oracle Cloud Infrastructure (OCI) is a single platform for your infrastructure, database, application development, and AI needs. OCI has four to eight times the bandwidth of other clouds; offers one consistent price, and nobody does data better than Oracle. If you want to do more and spend less, take a free test drive of OCI at https://oracle.com/cognitiveCHAPTERS:(00:00:00) Teaser(00:00:52) About the Show(00:01:15) About the Episode(00:04:45) Intro(00:06:32) Multi-Layer Networks(00:10:41) Network Embedding (Part 1)(00:16:50) Sponsors: Notion(00:18:30) Network Embedding (Part 2)(00:18:30) GABA and Cancer(00:24:08) AI for Biology(00:29:59) Emergent Cognition (Part 1)(00:33:57) Sponsors: Omneky | Oracle(00:35:18) Emergent Cognition (Part 2)(00:36:42) Data Limitations(00:42:48) Modeling Wellness(00:52:16) Multi-Scale Intelligence(01:02:54) Digital Life(01:07:11) Diverse Intelligence(01:13:02) OutroSOCIAL LINKS:Website: https://www.cognitiverevolutio...Twitter (Podcast): https://x.com/cogrev_podcastTwitter (Nathan): https://x.com/labenzLinkedIn: https://www.linkedin.com/in/na...Youtube: https://www.youtube.com/@Cogni...Apple: https://podcasts.apple.com/de/...Spotify: https://open.spotify.com/show/...TRANSCRIPT:Nathan: Hello, and welcome back to the Cognitive Revolution!Today, I'm pleased to share a conversation with Professor of Biology Michael Levin and staff scientist Dr. Leo Pio Lopez of Tufts University. Professor Levin's previous appearance on the show has become our most popular guest episode ever, and for good reason – his perspective on the ongoing convergence of biology, computer science, and philosophy are fascinating.I invited Michael & Leo again now because they recently published a groundbreaking paper that uses advanced embedding techniques to combine multiple biological datasets – spanning the modalities of genes, drugs, and diseases – into a unified network model of disease.I've been watching out for new machine learning approaches that can help pry open the black box of biological interactions and causation, and I was impressed that this approach has already generated meaningful new insights, including, most notably, a predicted link between the neurotransmitter GABA and the cancer melanoma, which was subsequently validated by laboratory experiment. In this episode, we first discuss the technical details of this work, including the application of "random walk with restart" algorithms to the challenge of learning associations across a multi-modal, multi-layer network, and the potential for this approach to uncover additional new therapeutic targets. From there, we zoom out to consider broader topics in AI for biology, including the current limitations in biological data collection & standardization, the shortage of data related to the aspects of health & development that matter most, and how emerging technologies like robot scientists and cloud labs might accelerate progress. We also touch on the concept of multi-scale intelligence in biological systems, a recurring theme in Professor Levin's work, including the remarkable observations that even simple gene regulatory networks are capable of some forms of learning, that biological systems can often survive and thrive despite major defects in their own hardware, and that humans have historically domesticated and effectively trained wild animals, despite knowing essentially nothing about their biology.We briefly explore how such results and other biological models might inspire more robust & adaptable AI architectures.Toward the end, we get into more philosophical territory, including the future of human enhancement and the ethical implications of outsourcing various aspects of cognition to AI, the blurring of categories, like "living things" and "machines", often thought to be mutually exclusive, and the potential for digital life,the challenge of envisioning a positive future, and specifically what humanity might look like as a "mature species",the potential incoherence of the concept of high-level AI alignment, considering the lack of alignment amongst humans,the possibility of transcending individual identify and also the extreme risks associated with overly powerful collective intelligences, and finally, the existential importance of developing a new science of where agency and goals come from and how we can effectively manage them.Overall, it's a super thought provoking episode which serves to remind us of how quickly the future is coming at us, and how much work we still need to do to be ready for it.As always, if you're finding value in the show, we'd appreciate it if you'd take a moment to share it with friends, and we always appreciate reviews on Apple Podcasts or Spotify. And we welcome your feedback, via our website, cognitiverevolution.ai, or by DM'ing me on your favorite social network. Now, I give you Professor Michael Levin and Dr. Leo Pio Lopez on the intersection of AI & biology and the future of intelligence.Nathan: Professor of Biology Michael Levin, Professor of Biology at Tufts University and Leo, Staff Scientist at Tufts University. Welcome to the Cognitive Revolution.Michael Levin: Hey, Nathan. Good to see you again.Nathan: It is great to have you back. So, so much continues to happen. You guys have put out a lot of great work recently, and I'm excited to pick up where we left off last time. If folks haven't heard our last episode, which by the way, is our most viewed episode ever on YouTube of any guest that we've ever had, then definitely go back and check that out. I think a lot of really interesting tie-ins were made in that conversation between all the fascinating work that you're doing in biology, and all of the stuff that people are just starting to wrap their arms around and minds around on the AI side so I kind of want to do more of that but I want to start also with a paper that you guys put out on July 4 of this year which I thought was really interesting and to me seems like a major sign of things to come it's called Universal Multilayer Network Embedding Reveals a Causal Link Between GABA Neurotransmitter and Cancer And what stood out to me a lot about this paper was that it is integrating multiple different data types and multiple different scale of systems, genes, drugs, and diseases into one data set, one network, one sort of unified understanding and driving new insights from that. The techniques are a little bit unfamiliar and I do think it's worth spending a little bit of time or maybe unfamiliar to people that have only been an AI in the transformer era. But I think it is worth taking a little time to kind of unpack. How did you get the idea to do this? How did you have the sense that these data sets could be combined and how did you actually go about it? Leo, if you wanna start?Leo: So, well, the idea came from also my previous postdoc because I worked on this kind of data multi-layer networks. Because what we have in the Omics era, if we have so many kind of data, and we don't know how to integrate them in the same representation, and networks are a very good way to do it. So until now, we had big limitations on the kind of multilayer network we could have. Only, for example, two multiplex networks. Multiplex and so-called just different kind of network. So I realized that I think it was in the middle of last year that I could finally have this kind of universal multilayer network because we had new extension of different techniques to do it. So I did it and I explained what I did to Professor of Biology Michael Levin and it happened this way.Nathan: Let's go a little deeper into that. Can you break down the different data sets that you started with and how you bridged these different modalities together? Leo: With this, now we can have as many kinds of nodes that we want. So for medical applications or to understand more biology, we used what we had. So genes, drugs, and diseases. And in networks, you have interactions that are... This is how you link different nodes. For example, with genes, we have so many things. We can have protein-protein interactions network. We can have co-expression network and so many different things. So we used... Well, the most interesting one, the one that we thought were the case. For drugs, I used DrugBank, for example, which is a very big data set. And then I add as many things I could find for diseases. That is actually pretty difficult. We don't have so many interesting diseases network. And the beauty of network embedding it is at the end, you have the possibility to apply machine learning on this kind of data that could not be integrated in the same space, let's say, before.Nathan: So I think figure one in the paper, and we'll put a link to the paper in the show notes, is very helpful for developing a little intuition for this. I'll just kind of describe it. There's the three different kinds of data, each in kind of their own space, so to speak. You've got the drug data, which consists of clinical drug interactions and also drugs that are often combined together, I guess. And then with the disease side, you have a sort of network of shared symptoms across different diseases and then also comorbidity or the co-occurrence of different diseases. And then in the gene side, it's a little bit less clear exactly what that is saying, but there's a pathways and a PPI. Pathways, I guess, being like what interacts with what sort of promotes or inhibits what. And then there's these links between these different spaces as well. So this would be the indication of what drug is used to treat what disease and what drug is used to treat what symptom and what gene seems to maybe cause or at least correlate with different diseases. Was this a matter of all these data sets existed and you had to like Do a big sort of reconciliation of all the different data sets to make sure that you're actually making all these linkages because all these different data sets like they don't connect automatically, right? I guess a big part of the work was identifying like which element corresponds to which element in other things.Leo: Actually, I have to say first that this figure is a simplification of all the data that we have. We have more in the paper. And, well, all these databases are already existing. My work here was just to translate them in the same language, in a sense. Because we have so many, for example, we have different kind of naming of the genes. So I just had to use the appropriate language. And then it's easy to build this kind of network. I think here the important idea was to take the most interesting databases that we have in the Omics, all the Omics databases that we can have right now.Nathan: So now let's talk about the actual learning technique. You've got all these data sets, you've assembled them all, you've figured out how to identify the connections between them and sort of unified them into one giant multimodal multiscale data set. And now the challenge is, or the goal is to say, okay, if we can take all these links that exist, maybe we can learn those and maybe we can use those to learn a model which can predict new linkages, right? So I think the techniques of MultiXVerse, which is new in this paper, and then the random walk with restart, which is more established, but I do think not super familiar to a lot of folks who've been following AI for only the last few years. I think those techniques are probably not super familiar. So take us through those techniques. Just give us a little sense of like the setup, the motivation for the technique, how it ultimately works.Leo: Well, yes, the main motivation, as I said, was to apply machine learning on networks. But with machine learning, we can't apply directly on networks. We need vectors. So network embedding has this ultimate aim to open this big machine learning toolbox for different kind of analysis. But to do that, we need to translate the nodes in the networks into vectors. So network embedding. Vector embeddings are the vectors. And to do that, we need what we call a similarity measure in the network. Because the network embedding will be to have embeddings in this vector space that can relate to the similarity measure between nodes in the network. So to have this similarity measure, we use random walk with restart. Random walk with restart is a method that is, I think, very well known in the field of network theory, network analysis, but not really in machine learning. And the general idea is to use like an imaginary particle that from a seed node will explore this big network a lot of time until convergence. And this will allow to retrieve like a probability distribution of how much you can, you will go through this node during your random walk on the network. And this is the similarity measure that we use and that will allow us after the learning phase to minimize the distances between the embeddings according to the similarity measure that we have in the network that we just computed.Nathan: Okay, cool. And then what's the next step with the MultiXVerse? Take us through the process.Leo: So whe'''
