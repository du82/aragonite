nflection(02:05:26) Replit as the perfect substrate for AGI(02:10) AI girlfriends(02:18:53) AI safety: The White House(02:25:43) Bottlenecks to progress(02:35:27) Can new players influence AI policy?(02:39:00) Liabilities(02:47:54) Independent red teaming organizations(02:57:18) Mechanistic interpretabilityLINKS- Zvi's blog: https://thezvi.wordpress.com/- Google's RT-2: https://www.deepmind.com/blog/rt-2-new-model-translates-vision-and-language-into-action- https://www.deepmind.com/publications/a-generalist-agent- Llama 2: https://ai.meta.com/llama/- Adversarial attacks paper: https://arxiv.org/abs/2307.15043RECOMMENDED THE COGNITIVE REVOLUTION EPISODES:- AI Safety Debates with Zvi https://www.youtube.com/watch?v=5yM7fIfxYV8- Mechanistic Interpretability with Arthur Conmy https://www.youtube.com/watch?v=Y5Pzch7_8MQ&t=5670s- Med-PaLM with Vivek Natarajan https://www.youtube.com/watch?v=nPBd7i5tnEEX:@labenz (Nathan)@thezvi (Zvi)@eriktorenberg (Erik)@cogrev_podcastSPONSORS: NetSuite | Omneky-NetSuite provides financial software for all your business needs. More than thirty-six thousand companies have already upgraded to NetSuite, gaining visibility and control over their financials, inventory, HR, eCommerce, and more. If you’re looking for an ERP platform: NetSuite (http://netsuite.com/cognitive) and defer payments of a FULL NetSuite implementation for six months.-Omneky is an omnichannel creative generation platform that lets you launch hundreds of thousands of ad iterations that *actually work* customized across all platforms, with a click of a button. Omneky combines generative AI and real-time advertising data. Mention "Cog Rev" for 10% off.MUSIC CREDIT:MusicLM'''
