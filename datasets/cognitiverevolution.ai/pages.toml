full_description = "Latest Episodes US-China Relations: History, Culture, and AI Competition, with Noah Smith, from Econ 102 Latest Episodes New Jersey’s AI Moonshot: Governor Phil Murphy on Partnerships, Progress, and Preparedness In this episode of The Cognitive Revolution, Nathan dives deep into the world of state space models with returning co-host Jason Meaux and special guest Quentin Anthony, Head of Model Training at Zyphra.Watch Episode HereRead Episode DescriptionIn this episode of The Cognitive Revolution, Nathan dives deep into the world of state space models with returning co-host Jason Meaux and special guest Quentin Anthony, Head of Model Training at Zyphra. Explore the cutting-edge Zamba 2-7b model, which combines selective state space and attention mechanisms. Uncover practical insights on model training, architectural choices, and the challenges of scaling AI. From learning schedules to hybrid architectures, loss metrics to context length extension, this technical discussion covers it all. Don't miss this in-depth conversation on the future of personalized, on-device AI.Check out more about Zyphra and Jason Meaux here:Zyphra's website: https://www.zyphra.comZamba2-7B Blog: https://www.zyphra.com/post/za...Zamba2 GitHub: https://github.com/Zyphra/Zamb...Tree attention: https://www.zyphra.com/post/tr...Jason's Meaux Twitter: https://x.com/KamaraiCodeJason's Meaux website: https://www.statespace.infoBe notified early when Turpentine's drops new publication: https://www.turpentine.co/excl...SPONSORS:Weights & Biases RAG++: Advanced training for building production-ready RAG applications. Learn from experts to overcome LLM challenges, evaluate systematically, and integrate advanced features. Includes free Cohere credits. Visit https://wandb.me/cr to start the RAG++ course today.Shopify: Shopify is the world's leading e-commerce platform, offering a market-leading checkout system and exclusive AI apps like Quikly. Nobody does selling better than Shopify. Get a $1 per month trial at https://shopify.com/cognitiveNotion: Notion offers powerful workflow and automation templates, perfect for streamlining processes and laying the groundwork for AI-driven automation. With Notion AI, you can search across thousands of documents from various platforms, generating highly relevant analysis and content tailored just for you - try it for free at https://notion.com/cognitivere...LMNT: LMNT is a zero-sugar electrolyte drink mix that's redefining hydration and performance. Ideal for those who fast or anyone looking to optimize their electrolyte intake. Support the show and get a free sample pack with any purchase at https://drinklmnt.com/tcr.CHAPTERS:(00:00:00) Teaser(00:00:42) About the Show(00:01:05) About the Episode(00:03:09) Introducing Zyphra(00:07:28) Personalization in AI(00:12:48) State Space Models & Efficiency (Part 1)(00:18:59) Sponsors: Weights & Biases RAG++ | Shopify(00:21:26) State Space Models & Efficiency (Part 2)(00:22:23) Dense Attention to Shared Attention(00:29:41) Zyphra's Early Bet on Mamba (Part 1)(00:32:45) Sponsors: Notion | LMNT(00:36:00) Zyphra's Early Bet on Mamba (Part 2)(00:37:22) Loss vs. Model Quality(00:44:53) Emergence & Grokking(00:50:06) Loss Landscapes & Convergence(00:56:55) Sophia, Distillation & Secrets(01:09:00) Competing with Big Tech(01:23:50) The Future of Model Training(01:30:02) Deep Dive into Zamba 1(01:34:24) Zamba 2 and Mamba 2(01:38:56) Context Extension & Memory(01:44:04) Sequence Parallelism(01:45:44) Zamba 2 Architecture(01:53:57) Mamba Attention Hybrids(02:00:00) Lock-in Effects(02:05:32) Mamba Hybrids in Robotics(02:07:07) Ease of Use & Compatibility(02:12:10) Tree Attention vs. Ring Attention(02:22:02) Zyphra's Vision & Goals(02:23:57) OutroSOCIAL LINKS:Website: https://www.cognitiverevolutio...Twitter (Podcast): https://x.com/cogrev_podcastTwitter (Nathan): https://x.com/labenzLinkedIn: https://www.linkedin.com/in/na...Youtube: https://www.youtube.com/@Cogni...Apple: https://podcasts.apple.com/de/...Spotify: https://open.spotify.com/show/...TRANSCRIPT:Nathan: Hello, and welcome back to the Cognitive Revolution!Today, we're once again going down the State Space Model rabbit hole, with returning co-host Jason Meaux – who regular listeners will know from our Mambapalooza literature review and Albert Gu interview episodes – and Quentin Anthony, head of model training at Zyphra, an LLM startup that's just released their new Zamba-2 7B model, built on a hybrid architecture that uses both the selective state space mechanism and the traditional attention mechanism, albeit with some notable tweaks relative to the standard implementation.In addition to sharing Zyphra's high-level vision for highly-personalized, on-device AI, Quentin was super generous with both his time and knowledge, sharing a wealth of practical lessons learned on the front lines of model training. We cover the delicate architectural choices that balance efficiency and capabilitythe many practical challenges of training at scale, including choosing the right learning schedules for different phases of training,the nitty-gritty details of training hybrid architectures, including why Zamba models don't need positional embeddingsthe Zamba models' use of shared attention blocks and internal LORA adapters to maximize edge performancethe not-so-simple relationship between loss metrics and model quality and capabilities and the challenges of context length extension,the Zyphra team's experiments with different optimizers and why they are sticking with Adam for nowQuentin's intuitions about the relationship between model scale and loss landscapesand finally even their recently published work on TREE Attention, which offers important advantages over RING Attention for multi-node training.I have to say… I got a lot from this episode, and while it's technical enough that I wouldn't call it entertainment, I am confident that you will do. If so, we always appreciate it when folks take a moment to share it with friends or write an online review on Apple Podcasts or Spotify, and we welcome your feedback, via our website, cognitiverevolution.ai, or by DMing me on your favorite social network. Now, I hope you enjoy this highly technical conversation with co-host Jason Meaux and guest Quentin Anthony, model training lead at Zyphra.Nathan: Jason Moe, returning guest and co-Nathan and chronicler of state space models at statespace.info and Quentin Anthony, model training lead at Zyphra, which has just released the new Zamba 7B SSM hybrid model. Welcome both of you to the Cognitive Revolution. Thanks a ton. Great to be here. Jason, regular listeners will know as a partner in crime, who's also obsessed with state-based models and the potential that they have to unlock new capabilities in terms of potentially long-term memory, extreme efficiency, all these kinds of interesting things. And we've been down the rabbit hole together on that a couple of times. So I was excited to have him back to help me with this conversation about the new Zamba model and all the ins and outs of that. So Jason, I'm going to ask you to lead the questioning today and I'll be in the supporting role, but listening intently and probably jumping in with a few of my own follow-up questions along the way as well. How's that sound?Jason: Sounds good. Let's do it. So let's start with maybe a broad question first. So on the Zephyr website, it says that, quote, the future of AGI will involve a combination of cloud and on-device deployment with an increasing shift towards local inference. So why is local inference going to be important? And how does this idea overall influence the direction of the company?Quentin: Yeah, there's a few aspects, a few angles of this. The main one is personalizability. We think that doing system prompt hacking things like these large monolithic model companies doing like Anthropic and AI just can't really specialize to every single person on the planet. We think that you need to have your own set of weights and changing a system prompt per person is not enough, right? We want to actually bake into the weights. You like to be talked to this way. Your favorite restaurant is X, that sort of thing. A second thing here is privacy. So there's a lot of data on your laptops, your phones that you don't really want to be communicating to the cloud. There's a lot of enterprises out there who don't want to share all of their data with OpenAI, all of their proprietary code things. So keeping that all on device, on-prem, in the organization is where we want to keep it. And then there's just some very practical challenges here of OpenAI spends, what was their CapEx realistically, right? In order to infer all these models, that's not really something that can keep up forever. It's being fueled by a lot of VC money. But if everyone's device is able to efficiently run their own models, then we offload that to the users. And then it's also just, it's much faster. You can run it offline. All these small benefits come out from having the model locally in the device, but it's all... steered by this global personalizability, privacy, these sort of north stars. In terms of cloud, there are some model capabilities that are more challenging. They're too challenging to have on 1B or 2B or something like that. Most people we see actually, when they communicate with models, they just need these higher level, more simplistic tasks, just like basic chat, like factual recall. They're not asking to make add questions or anything to their day-to-day on-device model. But sometimes you will need it, and that's why we have also a cloud offering in the 7B range. The 7B range is a turning point where you can fit it on more powerful laptops, powerful on-prem, but it's able to think through these more difficult problems more clearly. And we want those on-device models to be able to know like when they need to go back and ask like an Oracle model, something a bit more powerful. And then this is all seamless to the user. And then you can pick and choose how often your model wants to talk to the cloud.Jason: It sounds like it's when I hear local inference, it's often a privacy bullet point is the main bullet point that gets hit. It sounds like the overall idea is it's some mix of capability and privacy that if we had super efficient, super personalized, localized models that this is going to increase capability of the full stack. Is that correct?Quentin: Definitely. You can't forget personalizability. It's really hard to bake in like personalized outputs, personalized, like how the model likes to talk to you in the same way. It's just a hard problem.Nathan: I would love to dig into that a little bit further. Because I'm working on a project right now to try to get a model to write as me. This has been a white whale project for me for a while. I figure if a model can write as me in a way that's compelling to me on a consistent basis, it seems like that's a pretty big threshold. So I've been trying to get and see, can I make that happen? And... The best readily available fine-tunable model today is GPT-4. And so I've been working mostly with the OpenAI stack. They make it easy to do fine-tuning. They don't tell you too much about exactly how it works. One presumes that it's a LoRa-type process that they're running. I think there's a lot of reasons to believe it's something like that. It doesn't seem to learn facts very well. It does seem to learn like patterns and like stylistic layer, if you will, reasonably well. I wonder what you think is the right way to even approach personalization in the first place. Is it like when you envision doing this personalization for individuals on their machines? Are we talking to LoRa's? Are we talking like full training of a one or two or three B model? How many tokens does that take? Do we still need to like stuff huge amounts of context in there? Because that's another approach I've been taking where I'm like, maybe if I give it 50,000 tokens of everything it needs to know about me as the system prompt, then it like won't need to hallucinate. And I still haven't quite figured that out. I'm still getting hallucinations. So what is the overall paradigm or path to this like depersonalization for individuals?Quentin: Yeah, so the exact process will not be entirely clear until we have a bunch of people having Zamba on their phones. But we have a few bets. One is that we have a lot of expertise on continual learning and continual free training. So we envision doing a weight update overnight, maybe while your phone is plugged in, your laptop's not really actively being used on consumer hardware. It's really cheap to do this when the model's really small. Updating Loras, as you mentioned, is another that makes it even cheaper. But just continual learning, I think, is the way to go. In terms of your GPT-40 problem, I think I would need to know more details about the fine-tuning dataset and the model, which I'm just never going to get. We find continual learning on a small model per person is really great. There's some sort of, you can make the model simulate learning faster than it really is by doing things like activation steering. Like if you remember Golden Gate Bridge Claw and stuff, if the user tells the model you're being too dry. or something like that, then you can, like, very quickly steer the activation to be a bit more fun. Until tonight, when you can bake into the model, okay, this person likes, generally, to be a bit less dry and to talk in a more fun way. I think it's got to be continually, and it's got to be per user. And the only way to do that is with weights on the phone.Nathan: But how much of that exists today? Like, can I get a Zamba... First of all, which scale of model would you recommend that I bring locally? And can I do this continual learning? Can I start to feed it my emails and my Slack messages? I assume I would have to mix in some general purpose pre-training mix as well. I wouldn't just go all in on my content. So tell me a little bit more about what that looks like practically. I'm taking notes.Quentin: Yeah, absolutely. So right now we have the 1.2B, the 2.7B, and the 7B that we just dropped, all of our Zamba 2 series of models. The 1.2B is really good if you're like really edge constrained, like you don't want your phone to use much battery, you want it on a phone in the first place. In terms of whether you can do this yourself, right now you can. It's just a little less user-friendly than it will be someday. But right now we have our own Hugging Face fork for Zamba 2. So you would just download the model weights and then you would just have to up-tokenize and actually just train. on whatever personal emails or whatever else you want baked into the model. The product vision here, though, for Maya is that you have, like, a Maya cloud across all of your devices. And that's just some, like, social aspects here. You can upload pictu"
