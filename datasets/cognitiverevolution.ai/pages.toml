a zero-sugar electrolyte drink mix that's redefining hydration and performance. Ideal for those who fast or anyone looking to optimize their electrolyte intake. Support the show and get a free sample pack with any purchase at https://drinklmnt.com/tcrCHAPTERS:(00:00:00) About the Show(00:00:22) Sponsors: Weights & Biases RAG++(00:01:28) About the Episode(00:04:15) Gemini API Growth(00:05:26) Intro to AI Studio(00:07:35) Vertex vs. AI Studio(00:09:33) Developer Adoption(00:14:23) Gemini Use Cases (Part 1)(00:17:05) Sponsors: Shopify | Notion(00:20:01) Gemini Use Cases (Part 2)(00:23:08) Multimodality & Flash(00:26:29) Free Tier & Costs(00:31:43) Inference Costs(00:32:55) Fine-tuning & Vision(00:36:24) Sponsors: LMNT(00:38:04) Search Grounding(00:44:42) Grounding Sources(00:46:58) Competitive Landscape(00:50:36) Design Decisions(00:54:54) OutroSOCIAL LINKS:Website: https://www.cognitiverevolutio...Twitter (Podcast): https://x.com/cogrev_podcastTwitter (Nathan): https://x.com/labenzLinkedIn: https://www.linkedin.com/in/na...Youtube: https://www.youtube.com/@Cogni...Apple: https://podcasts.apple.com/de/...Spotify: https://open.spotify.com/show/...TRANSCRIPT:Nathan: Hello, and welcome back to the Cognitive Revolution!Today my guests are Shrestha Basu Mallick and Logan Kilpatrick, Product Managers for Google's Gemini API and AI Studio products. The occasion for our conversation is Google's release of a new "Grounding" feature that allows Gemini models to tap into Google search results to get up-to-date information from the web at runtime, which comes just a couple days after Google's latest earnings call, in which CEO Sundar Pichai noted that Gemini API usage has grown by a factor of 14 over the last six months.To prepare for this conversation, I spent a couple hours integrating Gemini into an application I'm developing, and found myself pondering a few big-picture questions.First, considering that various leaderboards consistently have Gemini at or very near the top, why does it still seem to be the 3rd priority for most developers, behind OpenAI and Anthropic?One hypothesis is that Google's platform is too complicated, or that the Gemini API is missing features, but in my hands-on work, I did not find that to be the case. Using the Vercel AI SDK, I was able to integrate Gemini as a peer to OpenAI and Anthropic models quite quickly and easily. Second, should we expect LLM capabilities to converge or diverge across providers? Considering this question through the lens of the Platonic Representation Hypothesis, and taking seriously that LLMs are learning ever-more-sophisticated world models and patterns of reasoning, it would seem they are destined to converge. And yet at the same time, OpenAI now has unique reasoning models, Claude is alone in its ability to use computers, and Gemini still has by far the longest context windows and now adds to that a native Google search integration.And finally, how and how much are teams within these companies thinking about competition? We know big tech leadership is taking a game theoretic approach, justifying 10s of billions of dollars of investment on the grounds that … that's simply what it takes to make sure they're not left behind. But what about at a product development level – are they constantly thinking about the competition, or just trying to build the best products they can?Logan and Shrestha had thoughtful responses to these questions and more, as we got into a number of details of the Gemini API and AI studio, including Code Execution, Prompt Caching, the incredible value of Gemini Flash and the generous free tier they offer, all in just an hour. As always, if you're finding value in the show, we'd appreciate an online shout out or a review on Apple Podcasts or Spotify, or just a comment on Youtube, and we always welcome your feedback, either via our website, cognitiverevolution.ai, or by DM'ing me on your favorite social network, For now, I hope you enjoy this realtime update on the Gemini API's latest features and inside look at Google's AI API product strategy, with Shrestha Basu Mallick and Logan Kilpatrick.Nathan: Shrestha and Logan from Google, the Gemini API and AI Studio team. Welcome to the Cognitive Revolution.Shrestha: Thanks, Nathan.Logan: Yeah, thanks, Nathan. I'm excited that this is appearance three. So I'm going for the record for the most number of appearances on your podcast.Nathan: You're in great company. Another three-time guest is Nat Viv from the medical applications team. And watch out because he might be due for a fourth before we know it. So you guys got to keep the pace up. So big news yesterday. Google had an earnings call, I think added a cool 100 billion to the market cap after hours. Everybody's feeling good. The headline stat around the Gemini API was 14X usage growth over the last six months. I have also spent a few hours this morning looking at the AI studio all the latest stuff there and testing out the big new announcement today, which is the new grounding feature where we can now tap directly into Google search results when we make a Gemini API call. A lot of great stuff there. Let's get the headlines from your perspective.Logan: Yeah. I love that. Maybe a quick, super high level context setting for folks who don't know AI studio. And then we can talk about search grounding. Yeah. AI studio entry point for developers to build with AI and specifically Gemini. We have all the latest Gemini models available. It is really intended to be like the least friction full experience you could imagine so literally like three or four clicks and then you can either confirm or deny this like a few clicks get an api key test the models really quickly and then go off and build something i think that's what success for us looks like. The increase in API usage and users building with Gemini has been awesome to see. And I think in some, at least to a certain degree, driven by making it as easy as possible to use Gemini and also as easy as possible to build with Gemini. We also have had a ton of uh independent of today's search grounding launch which i'm excited to talk about like just a slew of like continual things coming out the door from experimental models to production ready models to like new model classes with our flash 8b model to code execution and all this other stuff that's landed in the last uh six months. So i think there is this direct correlation and the increase in usage with continually getting new features off the door for developers and there's so much new stuff that's coming out these days. I think developers are sort of being implicitly tuned to like gravitate towards the platform where things are continuing to come out of. And it's been fun to be a part of that for the last six months and continue to put things into the hands of developers and get them excited about sort of the path that we're on.Shrestha: Definitely. I would also say, we can go into search grounding in a bit here, but I would also say that there's also features that we have out there. Logan mentioned code execution. We have context caching. Nathan, you were talking about structured outputs, where we've put out the initial versions of the features, but we're continuously taking feedback from developers in terms of how to improve those features and also the overall platform experience, whether it's error codes, whether it's rate limits, like we're continuously trying to think of how do we provide like a frictionless experience for developers.Nathan: A lot of progress certainly has been made. I think it really does bear emphasizing the kind of early fork in the road that I've seen some, and of course, Logan, you continue to do yeoman's work on online, correcting any misconceptions that may pop up. But I've seen a couple people be like, oh God, I wanted to use Gemini. I went into Vertex. I got totally lost. And in that respect, certainly Google's in good company with other like major cloud platform providers where the tools have just become overwhelming for a new user. Certainly I've experienced that most with AWS, honestly. The fork in the road early is understand the distinction between Vertex and the AI studio and make sure if you are trying to do the kind of work that I do, which is typically prototype, proof of concept, relatively low infosec hazard type of things, then you want to find yourself in the AI studio. And that is really very much on par. And in some ways, I would even say it has some advantages relative to the competing components platform type products that OpenAI and Anthropic have, which are all getting really quite good at this point. So go in there, choose a template prompt, tinker around with it, handle all the different little things on the sidebar around the structured outputs, whatever, whatever, generate code, choose your language, paste that into an AI coding assistant and have it do the translation into your application. I actually did that basically end-to-end earlier today in just about 90 minutes for an application that I'm developing. And it was really a pretty smooth process. I will confess that Gemini was the third provider that I had added to the app. Like most people, I started with OpenAI as it's just kind of the thing to do, I feel like. Then I went to Sonnet and then today I was like, oh, this grounding thing sounds pretty cool. I should go check that out and let's see how smooth they've really made it. Let me do the integration. It really was super smooth. I wonder if you think I'm representative, first of all, in terms of being a developer who like, for whatever reason, still has Gemini third in their queue. And I was looking for reasons for this today. I was like, what's the deal on LMSYS? Well, not really a big difference. You know, Gemini model is right at the top. And what's to do with ease of use? What's to do with structured outputs? What's to do with all these features? It seems pretty much like a dead heat, honestly, in the overall competition these days. So I wonder, is that just like a legacy hangover from the pre-Logan era? Do you have other ideas about it? And maybe we can kind of talk about some of the wins that you're seeing that might inspire people to think about these as like peers, as opposed to a one, two, three ranking.Logan: Yeah, this is a, it's a great question. I think the answer is complicated. I think maybe one simple answer is like, You know, Gemini has only been around for a year now. Actually, the model hasn't even been out for a full year. December of 2023 was when the first Gemini model was announced. OpenAI had a bunch of other models long before that, and the API had existed for actually many years before that, dating all the way back to, I think, 2021 or 2022. So we've been... sort of in the last year on this to the point that you made on this mission to sort of get to parity with the rest of the ecosystem and then really actually start to deliver some of those differentiated capabilities. I think we've done that at the model level and that's been sort of actually from the beginning with Gemini, you know, going natively multimodal and being the first LLM, the like large scale frontier LLM to go natively multimodal and also at launch with long contacts, the million token contact window. And we were there together at I/O and the 2 million tokens with 1.5 pro was announced and also 1.5 flash, which was sort of this, I think this breakout moment for us where, and you can sort of track that back to six months ago as well, when sort of API volume started to increase. that model has done such a good job of sort of balancing all of these different things that developers really care about. I think all that said, a ton of progress. The practical reality is like Gemini still only been around for less than a year. So like we are sort of getting over the mindshare perception challenges of people already having chosen an LLM when the technology originally came out. And the strategy is do a bunch of things that solve a uniquely suited for Google to solve. And one of those is search grounding and the other one being some of the long context stuff from an infrastructure challenge perspective. So it's been a ton of fun to sort of reason about what are the things that we can uniquely provide value on in addition to just having the world's best models from all the metrics and capability standpoint. How can we continue to differentiate? And that's why I think search grounding has been a ton of fun.Shrestha: Yeah, and to add to that, Nathan, like when we go and talk to developers, we do hear that, that OpenAI, Anthropic, they've both built excellent models with great buzz. And a lot of times when you're a very busy startup founder or someone like yourselves that builds a lot of prototypes, you may not have the time to evaluate all the models and make a rigorous decision. And under those circumstances, it can sometimes be easy to just say, we know there's a lot of buzz aroun'''
