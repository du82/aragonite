:29) Speculation on outcomes for the actor’s strike(01:12:51) The future where anyone can be a reasonable synthetic actor(01:17:33) Trey’s take on reasoning and why Hollywood should be more open to AI(01:16:20) New generative choose your own adventure content(01:25:49) A monk’s experience with Chat-GPT(01:28:56) Outdatedness of stochastic parrot notion; reasoning and synthesis(01:32:05) Adversarial attacks(01:36:14) Model vs human susceptibility to adversarial attacks because of human robustness(01:39:20) Trey and Nathan’s reasoning experiments(01:47:30) Performance jumping with abstraction(01:49:22) Language model self-delegation(01:51:04) NVIDIA’s margins compared to TSMC and ASML(02:07:35) Adding an AI layer and competing with incumbents(02:09:22) How sustainable is the demand for an AI friend?(02:13:10) Rewind AI(02:19:27) Big tech vs old school studios(02:14:52) Dramatic ironies from the picketing lines(02:21:38) AI development moments that feel like a movie(02:26:34) CEO of Inflection’s views on misuse being a greater threat than the AI itselfLINKS MENTIONED:- Watch Part 1 of The AI Revolution in Hollywood: https://www.youtube.com/watch?v=BkXiQitKu9I- Pamela Samuelson on Generative AI Meets Copyright: https://www.youtube.com/watch?v=6sDGIrVO6mo- Google Lawsuit: https://www.reuters.com/legal/litigation/google-hit-with-class-action-lawsuit-over-ai-data-scraping-2023-07-11/- Gradient descent in weights: https://twitter.com/labenz/status/1611745393007525890- Backspace Paper: https://arxiv.org/abs/2306.05426- Paige Bailey on Google’s PaLM 2: https://www.youtube.com/watch?v=K-XYxLifpQEX/SOCIAL:@treyko (Trey)@labenz (Nathan)@eriktorenberg@CogRev_PodcastSPONSORS: NetSuite | OmnekyNetSuite has 25 years of providing financial software for all your business needs. More than 36,000 businesses have already upgraded to NetSuite by Oracle, gaining visibility and control over their financials, inventory, HR, eCommerce, and more. If you're looking for an ERP platform ✅ head to