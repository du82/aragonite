based analgesia and multi-scale mind-body processes from whole-brain to cellular level (including belief change, kundalini meditation, and nonlocal interactions) <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Douglas Nitz & Seana Coulson Cameron Robert Jones He/Him/Hisc8jones@ucsd.edu CSB 125 Area of Research Interest: Large Language Models, World Knowledge, Theory of Mind <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Ben Bergen Yoonwon Jung <!-- br {mso-data-placement:same-cell;} --> She/Her/Hersy5jung@ucsd.edu Faculty Advisor: Area of Research Interest: Lumi Kang <!-- br {mso-data-placement:same-cell;} --> l5kang@ucsd.edu Area of Research Interest: Cognitive Linguistics, Syntax/Semantics <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Seana Coulson Elizabeth (Liz) Kaplan <!-- br {mso-data-placement:same-cell;} --> likaplan@ucsd.edu Area of Research Interest: Faculty Advisor: Betina Mario Karshaleva bkarshal@ucsd.edu CSB 225 Faculty Advisor: Gedeon Deak Stephan Kaufhold spkaufho@ucsd.edu CSB 223 Faculty Advisor: Federico Rossano Robert Kaufman rokaufma@ucsd.edu CSB 226 Areas of Research Interest: Human-Computer Interaction and Artificial Intelligence in complex, safety-critical domains including autonomous vehicles ("self-driving cars"), healthcare, and misinformation prevention <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: David Kirsh Stacy Kim stk006@ucsd.edu Faculty Advisor: Doug Nitz Emily Koithan She/Her/Hersemkoithan@ucsd.edu Areas of Research Interest: I plan to learn more about neuroimaging and machine learning in graduate school, which I hope to use to gain insight into the functional organization of the brain and the neural bases of psychiatric and neurological disorders. Faculty Advisor: Deanna Greene Scott Kooiman <!-- br {mso-data-placement:same-cell;} --> skooiman@ucsd.edu 