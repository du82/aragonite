full_description = "Undergraduates Advising Major Program Minor Program Courses Prospective Undergraduates Transfer Students Student Resources IRSPD Honors Program HOME Undergraduates Prospective Undergraduates Prospective Undergraduates Welcome! The Department of Cognitive Science at UC San Diego offers an exceptional undergraduate program. Follow the links below for an overview of our program. The Cognitive Science Major emphasizes three main areas of study: Brain - the understanding of neurobiological processes and phenomena Behavior - the experimental methods and findings from the study of psychology, language, and the sociocultural environment Computation - the powers and limits of various representations, coupled with studies of computational mechanisms Undergraduate Program Major Requirements Sample Academic Plans Approved Electives Areas of Specialization Honors Program Campus Resources TritonLink UC San Diego Libraries Financial Aid & Scholarships Student Housing Campus Tours International Center Triton Achievement Hub (Math/Chemistry Tutoring) Counseling & Psychological Services Student Health Services Study Abroad Office for Students with Disabilities Career Services Center Sports Facilities Undergraduates Advising Major Program Minor Program Courses Prospective Undergraduates Transfer Students Student Resources IRSPD Honors Program Undergraduate Advising In-Person Advising is unavailable. Virtual Advising: vac.ucsd.edu cogsadvising@ucsd.edu Please see Advising for Walk-In Hours."
