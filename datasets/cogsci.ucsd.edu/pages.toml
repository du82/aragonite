full_description = '''Daniel (Dan) Acosta-Kane dacostak@ucsd.edu Faculty Advisor: Virginia de Sa Ahern, Johnathan Ray <!-- br {mso-data-placement:same-cell;} --> jahern@ucsd.edu Area of Research Interest: Faculty Advisor: Sana Ali She/Her/Herss5ali@ucsd.edu Area of Research Interest: Cognitive neuroscience methods such as functional neuroimaging to explore psychopathology with a focus on neurodevelopment disorders. <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Deanna Greene Matthew T Beaudouin-Lafon He/Him/Hismbeaudouinlafon@ucsd.edu Areas of Research Interest: Human Computer Interaction with a focus on design methods for the information architecture of user interfaces <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Haijun Xia Felix Jedidja Binder He/Him/Hisfbinder@ucsd.edu CSB 226 Area of Research Interest: Planning, problem solving & physical world models <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: David Kirsh Mia Borzello mborzell@ucsd.edu CSB 123 Area of Research Interest: Electrophysiology, Hippocampus, cognitive neuroscience, memory, virtual reality <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Andrea Chiba Parla Buyruk She/Her/Herspbuyruk@ucsd.edu CSB 215/230 Faculty Advisor: Lera Boroditsky Yining (Rima) Cao yic069@ucsd.edu Faculty Advisor: Haijun Xia Dillan Cellier dcellier@ucsd.edu Area of Research Interest: I study temporal dynamics in electrophysiological data, and how they reveal the cognitive processes that underlie human behavior. <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Bradley Voytek Tyler Chang He/Him/Histachang@ucsd.edu Area of Research Interest: Language model analysis, including language learning, comprehension, and production. <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Ben Bergen & Zhuowen Tu Zhining Chen <!-- br {mso-data-placement:same-cell;} --> zhc008@ucsd.edu Area of Research Interest: Faculty Advisor: Ana Chkhaidze She/Her/Hersachkhaid@ucsd.edu CSB 232 Area of Research Interest: Phenomenology of thought and its cognitive and neural fingerprints <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Lera Boroditsky Alice Chung a3chung@ucsd.edu Area of Research Interest: My main research interest is human-computer interaction, to study how/why we create software and how we talk about software. HCI, computing education, artist-created technology. <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Philip Guo Alessandro (Ollie) D'Amico adamico@ucsd.edu Areas of Research Interest: Non-invasive neuroimaging with a focus on using EEG for brain-computer interfacing and investigating cognitive neuroscience in naturalistic tasks and settings <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Virginia de Sa Tania Delgado tadelgad@ucsd.edu CSB 230 Faculty Advisor: Seana Coulson Michelle Ding She/Her/Hersquding@ucsd.edu <!-- br {mso-data-placement:same-cell;} --> Faculty Advisor: Area of Research Interest: Yueying (Holly) Dong yud070@ucsd.edu Faculty Advisor: Anastasia Kiyonaga Homero Esmeraldo hesmeraldo@ucsd.edu Area of Research Interest: Reinforcement learning, memory, planning, individual differences <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Meenakshi Khosla Alexandria Evans She/Her/Hersa6evans@ucsd.edu Areas of Research Interest: Comparative cognition, cognitive evolution, prosocial behavior, human-animal interaction, animal welfare, metacognition. I study decision making and visitor effects in primates. Faculty Advisor: Federico Rossano Matthew Fain mfain@ucsd.edu Area of Research Interest: How we transform our experience of reality into memory. <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: David Kirsh Teng (Simon) Fei <!-- br {mso-data-placement:same-cell;} --> tfei@ucsd.edu Faculty Advisor: Area of Research Interest: EM-J Galang emgalang@ucsd.edu Areas of Research Interest: Neural mechanisms of spatial cognition and navigation, including path integration and reference frame transformations. <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Douglas Nitz Michael Robert Haupt mhaupt@ucsd.edu CSB 234 Area of Research Interest: Social network analysis, Semantic network, Cognition of misinformation spread <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Seana Coulson Devamardeep Singh Hayatpur dshayatpur@ucsd.edu Faculty Advisor: Haijun Xia Zoe He wah016@ucsd.edu Faculty Advisor: Angela Yu Victoria (Tori) Hennessy <!-- br {mso-data-placement:same-cell;} --> vhennessy@ucsd.edu Area of Research Interest: Cognitive Development Faculty Advisor: Martin Zettersten & Gedeon Deák Irene Hou <!-- br {mso-data-placement:same-cell;} --> She/Her/Hers ihou@ucsd.edu Area of Research Interest: My research interests span human-centered AI, human-computer interaction, and computing pedagogy. Faculty Advisor: Philip Guo Shang-En (Sean) Huang shh044@ucsd.edu Areas of Research Interest: I'm fascinated by language and the brain, I wish to further explore my interests in Psycholinguistics, Neurolinguistics, and Second and Foreign Language Acquisition. Faculty Advisor: Seana Coulson Aiden Iveris aiveris@ucsd.edu Faculty Advisor: Sarah Creel & Gedeon Deak Ian Jackson <!-- br {mso-data-placement:same-cell;} --> ijackson@ucsd.edu Faculty Advisor: Area of Research Interest: Peiling Jiang p4jiang@ucsd.edu Areas of Research Interest: I'm interested in making tools that help us learn, manage information space, and create. Faculty Advisor: Jim Hollan Alejandro Jinich aljinich@ucsd.edu CSB 230 Area of Reserach Interest: Meditation-based analgesia and multi-scale mind-body processes from whole-brain to cellular level (including belief change, kundalini meditation, and nonlocal interactions) <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Douglas Nitz & Seana Coulson Cameron Robert Jones He/Him/Hisc8jones@ucsd.edu CSB 125 Area of Research Interest: Large Language Models, World Knowledge, Theory of Mind <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Ben Bergen Yoonwon Jung <!-- br {mso-data-placement:same-cell;} --> She/Her/Hersy5jung@ucsd.edu Faculty Advisor: Area of Research Interest: Lumi Kang <!-- br {mso-data-placement:same-cell;} --> l5kang@ucsd.edu Area of Research Interest: Cognitive Linguistics, Syntax/Semantics <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Seana Coulson Elizabeth (Liz) Kaplan <!-- br {mso-data-placement:same-cell;} --> likaplan@ucsd.edu Area of Research Interest: Faculty Advisor: Betina Mario Karshaleva bkarshal@ucsd.edu CSB 225 Faculty Advisor: Gedeon Deak Stephan Kaufhold spkaufho@ucsd.edu CSB 223 Faculty Advisor: Federico Rossano Robert Kaufman rokaufma@ucsd.edu CSB 226 Areas of Research Interest: Human-Computer Interaction and Artificial Intelligence in complex, safety-critical domains including autonomous vehicles ("self-driving cars"), healthcare, and misinformation prevention <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: David Kirsh Stacy Kim stk006@ucsd.edu Faculty Advisor: Doug Nitz Emily Koithan She/Her/Hersemkoithan@ucsd.edu Areas of Research Interest: I plan to learn more about neuroimaging and machine learning in graduate school, which I hope to use to gain insight into the functional organization of the brain and the neural bases of psychiatric and neurological disorders. Faculty Advisor: Deanna Greene Scott Kooiman <!-- br {mso-data-placement:same-cell;} --> skooiman@ucsd.edu Faculty Advisor: Area of Research Interest: Eena Kosik She/Her/Hersekosik@ucsd.edu Area of Research Interest: Autonomic nervous system activity and the interactions with neural oscillations and cognition. <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Bradley Voytek Davis Lee dpl002@ucsd.edu Faculty Advisor: Eran Mukamel Estelita Leija esleija@ucsd.edu CSB 232 Areas of Research Interest: I would like to combine the knowledge I obtained from my Master of Science in architecture and Bachelor of Science in cognitive science and emphasis in neuroscience to continue research advancements that gude the design for both indoor and outdoor environments that are inclusive and adaptable to children (K-12) who are both typically developing as well as those with ADHD, Autism, and Anxiety disorders. Faculty Advisor: Andrea Chiba Rachel Lim <!-- br {mso-data-placement:same-cell;} --> ral077@ucsd.edu Faculty Advisor: Area of Research Interest: Chaolan Lin chlin@ucsd.edu CSB 226 Area of Research Interest: Social cognition, cognitive development, theory of mind, human-robot interaction <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Doug Nitz William McCarthy wmccarth@ucsd.edu CSB 231 Area of Research Interest: Visual reasoning, abstraction learning, generative behaviors, and creative collaboration. <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: David Kirsh Madeline Grace Meade She/Her/Hers <!-- br {mso-data-placement:same-cell;} --> mmeade@ucsd.edu Area of Research Interest: Comparative cognition, including Theory of Mind, logic, and social cognition in nonhuman primates Faculty Advisor: Federico Rossano James A. Michaelov j1michae@ucsd.edu CSB 231 Faculty Advisor: Ben Bergen Bryan Min <!-- br {mso-data-placement:same-cell;} --> He/Him/His bdmin@ucsd.edu Area of Research Interest: Human-Computer Interaction <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Haijun Xia Akshay Nagarajan He/Him/Hisanagaraj@ucsd.edu Faculty Advisor: Andrea Chiba Hui Xin Ng hxng@ucsd.edu Area of Research Interest: Brain Aging, Psychiatric Disorders, Bipolar Disorders <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Jim Hollan Srishti Palani srpalani@ucsd.edu CSB 227 Faculty Advisor: Steven Dow Jeongeon Park <!-- br {mso-data-placement:same-cell;} --> She/Her/Hers jep034@ucsd.edu Area of Research Interest: Human-computer interaction and human-AI interaction for supporting information navigation, comprehension, and utilization within people’s unique contexts and preferences. Faculty Advisor: Steven Dow Sujin Park <!-- br {mso-data-placement:same-cell;} --> She/Her/Hers sup031@ucsd.edu Area of Research Interest: Developmental neuroscience, predicting behavioral outcomes using biomarkers, mental health and clinical disorders Faculty Advisor: Deanna Greene Max E. Potter <!-- br {mso-data-placement:same-cell;} --> m2potter@ucsd.edu Faculty Advisor: Area of Research Interest: Emily Robles She/Her/Herseprovenz@ucsd.edu CSB 225 Areas of Research Interest: Orthographic and phonological contribution to silent reading of sentences <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Marta Kutas Srinivas (Srini) Ravishankar srravishankar@ucsd.edu Areas of Research Interest: Algorithmic advances in Brain-Computer Interfaces for neuroprosthetics Faculty Advisor: Virginia de Sa <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Jude Rayan mailto:jrayan@ucsd.edu Areas of Research Interest: My research interests lie at the intersection of Social Computing, Creativity and Human-Computer Interaction. I am currently exploring ways to help information sense-making and ideation during collaborative problem solving. Faculty Advisor: Steven Dow Pamela Riviere pdrivier@ucsd.edu CSB 125 Faculty Advisor: Lara Rangel Emilia Rosselli Del Turco She/Her/Herserossellidelturco@ucsd.edu Area of Research Interest: Personal Information Management (PIM) and professional vision across disciplines, with a focus on designing cognitive artifacts that support interdisciplinary interaction <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Jim Hollan Yumeng (Monica) Shen <!-- br {mso-data-placement:same-cell;} --> She/Her/Hers yus099@ucsd.edu Area of Research Interest: Speech perception and production among bilinguals and L2 speakers; word learning by preschool-aged children; eye tracking <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor(s): Sarah Creel, Anne Beatty-Martínez <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Fuling Sun She/Her/Hersfusun@ucsd.edu Area of Research Interest: Human-computer interaction and information visualization, currently interested in multilevel representation of information. <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Haijun Xia Lu Sun l5sun@ucsd.edu CSB 237 Faculty Advisor: Steven Dow Yueyan Tang yyt005@ucsd.edu Faculty Advisor: Gedeon Deak Samuel (Sam) Taylor s6taylor@ucsd.edu Areas of Research Interest: Decision making and planning in humans and machines, particularly in large-language models Faculty Advisor: Ben Bergen <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Jack Terwilliger jterwilliger@ucsd.edu Faculty Advisor: Federico Rossano Alyssa Truman atruman@ucsd.edu CSB 235 Areas of Research Interest: Language, Brain, Cognition, EEG <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Marta Kutas & Seana Coulson Janet Tung j5tung@ucsd.edu CSB 228 Faculty Advisor: Douglas Nitz Annapurna Vadaparty avadaparty@ucsd.edu Areas of Research Interest: Learning Sciences Faculty Advisor: Steven Dow Quirine van Engen She/Her/Hersquvaneng@ucsd.edu Areas of Research Interest: I'm studying the neural correlates of working memory processes, specifically theta oscillations and aperiodic activity in EEG. <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Bradley Voytek Vijay Veerabadran vveeraba@ucsd.edu CSB 232 Area of Research Interest: Neural networks, vision, machine learning <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Virginia de Sa Emily Winokur ewinokur@ucsd.edu CSB 233 Faculty Advisor: Andrea Chiba Haiyang (Daniel) Xu He/Him/His <!-- br {mso-data-placement:same-cell;} --> hax038@ucsd.edu <!-- td {border: 1px solid #cccccc;}br {mso-data-placement:same-cell;} --> Faculty Advisor: Zhuowen Tu Haoyin (Winnie) Xu hyx002@ucsd.edu Faculty Advisor: Seana Coulson Zhuojun Ying z5ying@ucsd.edu Faculty Advisor: Anastasia Kiyonaga Harshada Yadav hyadav@ucsd.edu Faculty Advisor: Seana Coulson Lu Yang <!-- br {mso-data-placement:same-cell;} --> He/Him/His luy013@ucsd.edu Area '''
