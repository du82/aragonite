title = "Photo/Video Galleries"
full_description = '''About Department History Photo/Video Galleries Contact & Directions Human Resources Employment Calendar News Highlights Give Back Cognitive Science Dept. Facilities Campus Principles of Community Diversity in Cognitive Science Safety Resources HOME About Photo/Video Galleries Photo/Video Galleries Halloween Bash @ Cognitive Science Courtyard We had the pleasure of hosting a Halloween Bash in the new Cognitive Science courtyard! Everyone showed up in wonderful costumes while we ate and played games. 2024 Cognitive Science Open House We had the wonderful opportunity to host our 2024 Open House PhD Recruitment event. It was so nice to see the spirit of Cognitive Science alive and bustling with faculty, current students, prospective students and staff! Large Language Models Can Understand Language Debate Sean Trott (proposition) and Benjamin Bergen (opposition) debated the motion "Do Large Language Models Understand Language?". Seana Coulson's Jeffrey L. Elman Endowed Chair Award Congratulations to Dr. Coulson for your amazing contributions to the Cognitive Science Department and field of reserch! Writing A Personal Statement 2021 Writing a personal statement workshop video. CogSci Spooktacular Halloween Costume Contest 2021 Our first CogSci Spooktacular Halloween Costume Contest! Thank you to everyone who participated, and voted. Here are the winners of the contest! The Science of Surviving the Zombie Apocalypse 2021 Professor Bradley Voytek gave a Halloween talk on using ZOMBIES to learn about Neuroscience. Dr. Voytek co-authored "Do Zombies Dream of Electric Sheep". To Our Class of 2020 Video To celebrate the graduation of our undergraduate Cognitive Science majors during this unprecedented time, members of our faculty sent video congratulations compiled in the video. We are so proud of our newest group of Cognitive Science Alumni! Cognitive Science Open House 2020 Open House 2020 was a success! A big thank you to all faculty, staff and grads who made it possible. We hope to see our prospective students come back and join the UCSD Cognitive Science family. 2020 Cognitive Science Holiday Party The Cognitive Science falculty, staff and grads dedicated some time to celebrate winter holidays together, all while enjoying delicious Paella Valenciana. Marta Kutas Appreciation Reception Here are some pictures of the reception in honor of Marta Kutas, thank you for your work as the Department of Cognitive Science Chair 2019 Cognitive Science Open House A big thank you to all the visiting students, as well as the faculty and staff that made this event possible! This was a great opportunity for prospective PhD. students to see what the UCSD Cognitive Science Dept. has to offer them. 2018 Cog Sci Holiday Party On December 12th, the Cognitive Science department came together to celebrate the end of the year festivities with tacos and dessert! 2018 Cogsgiving Potluck On November 14th, the Cognitive Science community gathered and celebrated the Thanksgiving holiday by sharing homemade dishes and delicious desserts. The Science of Surviving the Zombie Apocalypse Professor Bradley Voytek gave a Halloween talk on using ZOMBIES to learn about Neuroscience. Dr. Voytek co-authored "Do Zombies Dream of Electric Sheep". 2017 Welcome Lunch In September the department welcomed new graduate students and faculty to our CogSci community. About Department History Photo/Video Galleries Contact & Directions Human Resources Employment Calendar News Highlights Give Back Cognitive Science Dept. Facilities Campus Principles of Community Diversity in Cognitive Science Safety Resources Join us on Facebook Join us on Instagram'''
