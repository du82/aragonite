title = "Teaching Assistants"
full_description = "The undergraduate program offers a special challenge to instructor and student alike, and experience with the teaching of that program can provide a valuable part of the education of a cognitive scientist. The department works closely with the Teaching + Learning Commons to design effective training and development programs for its Teaching Assistants. All graduate students must serve as a Teaching Assistant for at least one quarter of each academic year in residence (students must TA for two quarters per academic year in years 1-4 for guaranteed funding). The Department will invite applications for TA positions, generally due by Sunday of Week 2 in the previous quarter. TA positions will be offered to students based on a balanced consideration of multiple factors including the TA’s preferred courses, faculty’s preferences, specific expertise needed for each course, the TA applicant’s academic standing and stage, as well as the date on which the TA’s application is received. Offers for TA positions will in most cases be made by the end of Week 7 of the prior quarter. Cognitive Science graduate students with questions or concerns about the TA assignment process should contact the Graduate Advisor or the Faculty Graduate Advisor. Note: This TA processing timeline is subject to change. Teaching assistantships performed in other departments must be approved by petition to the graduate committee to count toward the requirement (petitions can be found on the Resources page). At the end of each quarter, instructors prepare evaluations of all teaching assistants. Graduates CogSci Ph.D Program Courses Graduate Student Awards Resources Teaching Assistants SDSU-UCSD LCD Joint Doctoral Program"
year_published = 2025
clearnet = "https://cogsci.ucsd.edu/graduates/teaching-assistants/index.html"
