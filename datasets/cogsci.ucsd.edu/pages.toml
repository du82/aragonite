["https://cogsci.ucsd.edu"]
title = "Cog Sci"
full_description = '1st Cognitive Science Department in the World Today, the department provides a focus for the continued evolution of the discipline of cognitive science. Learn More JOIN US The Department of Cognitive Science at UC San Diego offers an exceptional undergraduate and graduate program Learn More Previous Next THE SCIENCE BEHIND THE INTUITION The Department of Cognitive Science is committed to transcending theoretical boundaries rooted in traditional disciplines in pursuit of a scientific account of cognition. We promote the study of learning, perception, action, and interaction in the physical, social, and cultural world. Our inter-disciplinary vision draws from a number of disciplines, including anthropology, computer science, ethology, electrical engineering, linguistics, neurology, neurosciences, philosophy, psychology, and sociology in order to contribute to theory and apply what we learn to design. Learn More ... PROGRAMS AND RESEARCH UNDERGRADUATE STUDIES Our program provides an excellent background for many professional fields, including medicine, clinical psychology, and information technology. More about undergraduate studies GRADUATE STUDIES Multidisciplinary study of cognition with emphasis on computer science, linguistics, neuroscience, psychology, and related aspects of anthropology, biology, mathematics, philosophy, and sociology. More about graduate studies RESEARCH The underlying philosophy of the department challenges faculty and students to be knowledgeable in and sympathetic to a wide variety of fields and techniques. More about research Cognitive Science Event Calendar Take a look at our CogSci calendar to find upcoming events, webinars, and more! SEE THE CALENDAR News and Highlights View All News February 28, 2025 Tyler Center Fellowship Applications: Apply by March 5th! View Flyer January 31, 2025 Empowered to Thrive: Congratulations to Parla Buyruk for being a recipient! Read More January 10, 2025 Dogs Use Two-Word Button Combos