title = "Courses"
description = "This class will examine the neuroanatomy, physiology, and functional correlates of the human mirror neuron system and its putative role in social cognition, e.g., action understanding, empathy, and theory of mind. We will examine the developmental, neuroimaging, electrophysiological, as well as clinical evidence, for and against this hypothesis. Prerequisites: upper-division standing."
full_description = "Undergraduates Advising Major Program Minor Program Courses COGS Course Catalog Prospective Undergraduates Student Resources IRSPD Honors Program HOME Undergraduates Courses Tentative Course Offerings These are tentative schedules. Classes and/or instructors may change or be canceled. Please consult the official Schedule of Classes on TritonLink each quarter. COGS Course Offerings 2024-25 DSGN Course Offerings 2024-25 Featured Courses COGS 87: First-year Seminar - Winter 2025 COGS 87 (A00): How Minds and Groups Make Religion and Superstition | Professor Gedeon Deak Why do humans, individually and in groups, attribute natural events to supernatural agents? How does the human brain accept religious beliefs, even in the face of contradictory evidence? We will examine how cognitive, developmental, and cultural factors work together to cause humans to believe in the supernatural. COGS 160: Seminars in Special Topics - Winter 2025 COGS 160 (B00): Bilingual Minds and Brains | Professor Anne Beatty-martinez This course will bring together recent discoveries about bilingualism and its influences on the brain, mind, and behavior. Class meet TuTh 2:00pm-3:20pm in PETER 104 Prerequisites: upper-division standing. Request enrollment via EASy. DSGN 119: Design at Large Seminar - Winter 2025 DSGN 119: Design at Large | Kristen Vaccaro New societal challenges, cultural values, and technological opportunities are changing design—and vice versa. The seminar explores this increased scale, real-world engagement, and disruptive impact. Invited speakers from UC San Diego and beyond share cutting-edge research on interaction, design, and learning. 2 units, P/NP grade. Meets Wednesdays 4:00pm-5:00pm at DIB 208. Prerequisites: COMM 124A or COGS 10 or DSGN 1 COGS 87: First-year Seminar - Spring 2025 COGS 87 (A00): How Minds & Cultures Make Religion & Superstition | Professor Gedeon Deak Why do humans, individually and in groups, attribute natural events to supernatural agents? How does the human brain accept religious beliefs, even in the face of contradictory evidence? We will examine how cognitive, developmental, and cultural factors work together to cause humans to believe in the supernatural. COGS 160: Seminars in Special Topics - Spring 2025 COGS 160 (A00): Social Neuroscience | Professor Ayse Saygin This class will examine the neuroanatomy, physiology, and functional correlates of the human mirror neuron system and its putative role in social cognition, e.g., action understanding, empathy, and theory of mind. We will examine the developmental, neuroimaging, electrophysiological, as well as clinical evidence, for and against this hypothesis. Prerequisites: upper-division standing. Class meet TuTh 2:00pm-3:20pm in CSB 003. Request enrollment via EASy. COGS 160 (B00): Cinema and Cognitive Science | Professor Ayse Saygin Although cinema is primarily a visual art, it combines many features that engage our brains rapidly and effectively (sound, music, speech, facial expressions, body language, landscapes, cityscapes, interiors, text, narrative, temporal flow, etc); as such, it can be a great artistic medium to illuminate human perception and cognition. Indeed, both filmmakers and theoreticians have argued cinema may even be unique among the arts in providing natural and powerful access to human consciousness. This course will explore a variety of themes relevant to cognitive science in cinema, by exploring works of cinema. We will view and discuss films selected both in terms of their content, and in terms of the art of filmmaking, to highlight concepts, themes, and questions related to cognitive science, from neuropsychology, to design to Artificial Intelligence. The goal is to explore both how these themes are covered in cinema, as well as how cinema can help us understand more about perception, cognition, creativity, and consciousness. Prerequisites: Cogs1, Cogs 10, Cogs 17, or consent of instructor.. Class meet TuTh 11:00am-12:20pm TBA. Request enrollment via EASy. COGS 160 (C00): Cognitive and Neuroscience for Architecture | Professor David Kirsh This is a seminar and project-oriented class in which students and several faculty explore what is known at cognitive, neuroscientific and behavioral levels about the interaction of person and building (human building interaction, HBI). It is part of the emerging field of research concerned with applications of Cognitive Science and Neuroscience to Architectural and Urban Design. Topics include: what is HBI; how space and movement are cognized and used; what is architectural atmosphere; what is the metaverse and its forthcoming roles in architecture; how can we quantify effects of buildings on persons and study HBI scientifically; what is architectural legibility; what is place: how do we understand it and remember; how does architecture affect our emotions; how does it affect our work; how does it shape personal well-being and social dynamics. Students and faculty will critically present the contents of research papers, and work in practicums whose goal will be to investigate specific roles that science may play in reshaping architectural and urban design. Faculty include several members from Cognitive Science and the Salk Institute, guest lecturers from University of London, and architects from the US and abroad. Class meet TuTh 11:00am-12:20pm in CSB 003 Prerequisites: GPA of 3.25 and enrollment is by permission of the instructor only. Request enrollment via EASy. DSGN 119: Design at Large Seminar - Spring 2025 DSGN 119: Design at Large | Lilly Irani and Manuel Shvartzberg Carrió New societal challenges, cultural values, and technological opportunities are changing design—and vice versa. The seminar explores this increased scale, real-world engagement, and disruptive impact. Invited speakers from UC San Diego and beyond share cutting-edge research on interaction, design, and learning. 2 units, P/NP grade. Meets Wednesdays 4:00pm-5:00pm at DIB 208. Prerequisites: COMM 124A or COGS 10 or DSGN 1 Course Pre-Authorizations All COGS course pre-authorizations and prerequisite override requests must be made through the UC San Diego Enrollment Authorization System (EASy). Undergraduates Advising Major Program Minor Program Courses COGS Course Catalog Prospective Undergraduates Student Resources IRSPD Honors Program Undergraduate Advising In-Person Advising is unavailable. Virtual Advising: vac.ucsd.edu cogsadvising@ucsd.edu Please see Advising for Walk-In Hours."
