["https://cogsci.ucsd.edu/about/give-back.html"]
title = "Give Back"
full_description = "About Department History Photo/Video Galleries Contact & Directions Human Resources Employment Calendar News Highlights Give Back Cognitive Science Dept. Facilities Campus Principles of Community Diversity in Cognitive Science Safety Resources HOME About Give Back Give Back Whether you are a UC San Diego alum, staff, faculty member, or supporter of the work being done in the Department of Cognitive Science, you can have a tremendous impact on our students, research, and programs through your philanthropy. As the first Cognitive Science department in the world, it’s remarkable to see our growth over the years. Our success would not be possible without the generous support of our alumni and community. Your gift, no matter how small or large, has a direct impact on Cognitive Science students and enables us to improve the student experience and better fulfill the University objectives of teaching and research. We hope that you will consider making a gift to one or more of these important initiatives today: Cognitive Science Excellence Fund – Gifts to this fund are critical and are used at the discretion of the Department Chair to support the students, projects, and research that need it most. Cognitive Science Study Abroad Scholarship Fund – Studying abroad is one of the most formative experiences in any student’s life. Gifts to this fund will promote the internationalization of a cognitive science education by providing scholarships to Cognitive Science students participating in UC Education Abroad or Global Seminars. Jeff Elman Memorial Fund – The Jeff Elman Memorial Prize has been created to recognize a rising star in the field of cognitive science at a mid-career point and to remember Jeff Elman. His intellectual depth, together with his genuine warmth made him a valued mentor. With that in mind, the Elman Prize will have dual mission: to recognize scientific contributions but also to reward personal service through mentoring others for the betterment of society. Have questions about making a gift? Interested in other ways to support the department? Please contact: Andrew Cronan (Director, Industry Relations and Student Professional Development) at atcronan@ucsd.edu or 858-534-8253. About Department History Photo/Video Galleries Contact & Directions Human Resources Employment Calendar News Highlights Give Back Cognitive Science Dept. Facilities Campus Principles of Community Diversity in Cognitive Science Safety Resources Join us on Facebook Join us on Instagram"
