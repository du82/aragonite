["http://www.cogsci.ucsd.edu/undergraduates/major/index.html"]
title = "Major Requirements"
full_description = "Undergraduates Advising Major Program Majors entering before Fall 2016 B.A. Cognitive Science B.S. Cognitive Science B.S. Spec. Neuroscience B.S. Spec. Clinical Aspects B.S. Spec. Language & Culture B.S. Spec. Design & Interaction B.S. Spec. Machine Learning & Neural Computation B.S. Cognitive Behavioral Neuroscience Minor Program Courses Prospective Undergraduates Student Resources IRSPD Honors Program HOME Undergraduates Major Program Cognitive Science Major Cognitive Science is a diverse field which is unified and motivated by a single basic inquiry: What is cognition? How do people, animals, or computers ‘think,’ act, and learn? In order to understand the mind/brain, cognitive science brings together methods and discoveries from neuroscience, psychology, linguistics, philosophy, and computer science. UCSD has been at the forefront of this exciting new field and our Department of Cognitive Science was the first of its kind in the world. It is part of an exceptional scientific community and remains a dominant influence in the field it helped create. The UC San Diego Department of Cognitive Science offers both a B.A. degree and a B.S. degree. Students are given the opportunity to take classes offered from the department, as well as from several other interdisciplinary departments across the campus. Check out these links for more information on Major requirements and Areas of Specializations: Areas of Specialization A major may elect to receive a B.S. in cognitive science with a specified area of specialization. The areas of specialization are intended to provide majors with guidance in choosing elective courses and to make the specific interests and training of the major clear to prospective employers and graduate schools. Specifying an area of specialization is optional. Students should take into consideration when planning for their specialization that approved courses are not necessarily offered every year. The specialization will be listed on your transcript. The areas of specialization are: Neuroscience Clinical Aspects of Cognition Language and Culture Design and Interaction Machine Learning and Neural Computation Cognitive Behavioral Neuroscience Approved Electives (PDF) Approved Specialization Electives (PDF) Undergraduates Advising Major Program Majors entering before Fall 2016 B.A. Cognitive Science B.S. Cognitive Science B.S. Spec. Neuroscience B.S. Spec. Clinical Aspects B.S. Spec. Language & Culture B.S. Spec. Design & Interaction B.S. Spec. Machine Learning & Neural Computation B.S. Cognitive Behavioral Neuroscience Minor Program Courses Prospective Undergraduates Student Resources IRSPD Honors Program Undergraduate Advising In-Person Advising is unavailable. Virtual Advising: vac.ucsd.edu cogsadvising@ucsd.edu Please see Advising for Walk-In Hours."
