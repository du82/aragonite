["https://cogsci.ucsd.edu/undergraduates/advising/index.html"]
title = "Advising"
full_description = "Undergraduates Advising FAQs Comments & Student Experiences What Do CogSci Students Do After Graduation? Preparing for Graduate School Learning Objectives Major Program Minor Program Courses Prospective Undergraduates Student Resources IRSPD Honors Program HOME Undergraduates Advising Academic Advising Information Our Cognitive Science Undergraduate advisors are happy to answer your questions about courses, major or minor planning, or Cognitive Science in general. Virtual Advising Current Students: The Department of Cognitive Science is currently offering the following methods of distance advising through the Virtual Advising Center (VAC): Ask A Question Meet with Advisor Please see the Calendar below for available hours. (Hours are subjected to change and will be reflected on the Calendar.) Others: cogsadvising@ucsd.edu UC San Diego Students should be sending academic advising questions through the VAC, not through email. If you are attempting to submit a form or document, please use our online submission form to do so. Forms Undergraduate Petition To file a petition with the Cognitive Science department, please fill out the undergraduate petition form and submit it via our online submission form. Be sure to attach any supporting documents, course description, and syllabus along with your petition. It may take up to 6 weeks* for your petitions to be reviewed, and we will notify you on VAC on the decision. Approval is not guaranteed. *Petitions submitted over the summer will be reviewed in the beginning of Fall quarter. Other Forms Campus forms that need to be reviewed by a Cognitive Science advisor can be submitted via our online submission form as a PDF attachment. This form submission is for Cognitive Science department use only. If you would like to petition GE requirements or other department's courses, please contact the respective department or college directly. Turnaround is not immediate, and could take up to 72 business hours. Students are expected to plan accordingly. COGS Course Pre-Authorization, Unit Limit Exceptions, and Special Studies Requests All COGS course pre-authorizations, prerequisite override, and special studies requests must be made through the UC San Diego Enrollment Authorization System (EASy). EASy Request Processing Time: Cognitive Science Majors Within 3 business days after submission Non-Cognitive Science Majors Within 3 business days after second pass Unit Limit Exception Requests Starting Monday of Week 2 FAQ's Please review our frequently asked questions page :) Undergraduates Advising FAQs Comments & Student Experiences What Do CogSci Students Do After Graduation? Preparing for Graduate School Learning Objectives Major Program Minor Program Courses Prospective Undergraduates Student Resources IRSPD Honors Program Undergraduate Advising In-Person Advising is unavailable. Virtual Advising: vac.ucsd.edu cogsadvising@ucsd.edu Please see Advising for Walk-In Hours."
