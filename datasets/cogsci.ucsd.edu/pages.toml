title = "Cognitive Science Ph.D. Program"
full_description = "Graduates CogSci Ph.D Program Admissions Incoming Students Requirements Policies Financial Information Graduate Alumni by Graduation Year Courses Graduate Student Awards Resources Teaching Assistants SDSU-UCSD LCD Joint Doctoral Program HOME Graduates CogSci Ph.D Program Cognitive Science Ph.D. Program This program provides broad training in neurological processes and phenomena; the experimental methods, results, and theories from the study of psychology, language, and social and cultural issues; and the studies of computational mechanisms. The first year is devoted to familiarizing the student with the findings and current problems in cognitive science through Foundations and Issues courses. In the second year, basic courses and laboratory rotations are completed, with the major emphasis on the completion of a year-long research project. Future years are spent completing the advancement to candidacy requirements and doing the thesis research. Throughout the program, there are frequent faculty-student interactions, including special lectures by the faculty or invited speakers and the weekly informal research discussions and cognitive science seminar. Graduates CogSci Ph.D Program Admissions Incoming Students Requirements Policies Financial Information Graduate Alumni by Graduation Year Courses Graduate Student Awards Resources Teaching Assistants SDSU-UCSD LCD Joint Doctoral Program Graduate Advising Virtual Advising:vac.ucsd.edu 8:30 - 12 p.m. & 1 - 4 p.m.Monday through Friday Email: cogsphd@ucsd.edu Cognitive Science BuildingFirst Floor, CSB 145"
