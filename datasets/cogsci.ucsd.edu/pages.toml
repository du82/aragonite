["http://www.cogsci.ucsd.edu/graduates/SDSU%20LCD%20Program/index.html"]
title = "SDSU-UCSD LCD Joint Doctoral Program"
full_description = "Graduates CogSci Ph.D Program Courses Graduate Student Awards Resources Teaching Assistants SDSU-UCSD LCD Joint Doctoral Program HOME Graduates SDSU-UCSD LCD Joint Doctoral Program SDSU-UCSD Joint Doctoral Program in Language and Communicative Disorders San Diego State University (SDSU) and the University of California San Diego (UC San Diego), offer jointly a doctoral program in Language and Communicative Disorders. The program’s focus is the interdisciplinary study of language and communicative disorders. A major emphasis of the program is to apply techniques developed in cognitive science and neuroscience to the study of language and language disorders. The program involves study and research in normal language (including sign languages of the deaf and language impairments), and in the neural bases of language use and language loss. Participating faculty have research interests in a wide range of issues in processes of language development, language and aging, multilingualism, language disorders, assessment, and intervention. Graduates of the program will be qualified to serve as faculty in university programs in a variety of disciplines, and to provide leadership in research and health services. The doctoral program faculty at UC San Diego are an interdisciplinary group from the Departments of Cognitive Science, Communication, Linguistics, Neurosciences, Radiology, Psychiatry, and Psychology. The doctoral program faculty at SDSU are members of the School of Speech, Language and Hearing Sciences and the Departments of Linguistics and Psychology. The program is coordinated by the doctoral program coordinators at each campus, in conjunction with an Executive Committee comprising three faculty from each campus appointed by the Graduate Deans from each campus. The program is designed as a five-year curriculum, based on a twelve-month academic year. Students will be admitted to the doctoral program only in the fall semester/quarter. Information regarding admission is found in the current edition of the Graduate Bulletin of San Diego State University. To obtain admission application and program information, contact: SDSU/UC San Diego Joint Doctoral Program in Language and Communicative Disorders San Diego State University 5500 Campanile Drive http://slhs.sdsu.edu/phd/. Graduates CogSci Ph.D Program Courses Graduate Student Awards Resources Teaching Assistants SDSU-UCSD LCD Joint Doctoral Program"
