title = "News Highlights"
full_description = '''The CalTestBed Initiative will be an asset to clean energy innovators in gaining crucial access to testing, verification, and commercialization of their technologies. Register now to attend the kick-off of the world's largest clean energy testbed ecosystem! Even with current development in workplace diversity, women everywhere still struggle to hold their place in design, a traditionally male-dominated industry. Nevertheless, these women thrived and rose to the top. Join us to hear the inspiring stories of their journey to success and how they’re leveling the field. Lab Expo is a student-organized research symposium that provides undergraduates with a chance to see others' research and get involved in a lab! We had over 800 attendees and over 50 presenters last year; this year you can be one of them! Abstracts - so tiny, yet so dense with information! In this workshop, we will review abstracts as a genre of academic writing, unpacking what each sentence in an abstract does for the reader. Together, we will read sample abstracts to discern their key features, and participants will have time to work on an abstract for a current project. Taking place on November 15th, 10 am to 1 pm. Workshop will explore strong principles that inform all research proposals, regardless of discipline. In this workshop series, we will explore strategies and tactics for developing your research topic into an effective proposal. We will discuss strategies for constructing a research puzzle from existing literature and the kinds of rhetorical moves that lead the reader to your research question. Taking place on November 8th, 10 am to 1 pm. Strategies for writing impactful prose that resonates with your audience, plus time to work on a draft. In this workshop, we will explore concrete strategies for maximizing the clarity of your writing. We will address common misconceptions about "good" style and learn how to fit style improvements into the writing process. Taking place on November 1st, 10 am to 1 pm.'''
year_published = 2021
year_updated = 2022
clearnet = "http://www.cogsci.ucsd.edu/about/news%20highlights.html"
