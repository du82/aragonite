s). No more than 1 lecture is expected from any TA in any given course. This will provide us with the information we need to best make your responsibilities reasonable and give you formal credit. Legacy Grad Student Wiki (old) Graduates CogSci Ph.D Program Courses Graduate Student Awards Resources Graduate FAQs Helpful Tools and Websites Fellowships & Jobs International Students Resources Health and Wellness Campus Centers and Associations Teaching Assistants SDSU-UCSD LCD Joint Doctoral Program Graduate Advising Virtual Advising:vac.ucsd.edu 8:30 - 12 p.m. & 1 - 4 p.m.Monday through Friday Email: cogsphd@ucsd.edu Cognitive Science BuildingFirst Floor, CSB 145"
