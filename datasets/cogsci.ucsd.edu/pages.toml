title = "Student Resources"
full_description = "Undergraduates Advising Major Program Minor Program Courses Prospective Undergraduates Student Resources UC/CSU Cognitive Science Transfer Equivalency Undergraduate Research (99 and 199) Instructional Apprenticeship (IA) Study Abroad Jobs, Programs & Internships Student Organizations Health and Wellness IRSPD Honors Program HOME Undergraduates Student Resources Student Resources Check out these resources that the Cognitive Science Depertment has to offer! Computer Access Use The Computer Lab Lookup to find computer labs on campus for remote instruction and finals. This webpage will be continually updated as VCSA works to gain access to computer labs on campus for students. Students can request a laptop through UC San Diego's Student Loaner Laptop Program. VCSA is partnering with Financial Aid and ITS to work with students who qualify: If you have questions, please reach out to vcsa@ucsd.edu. For more information, please see the VCSA's site. UC/CSU Articulation Transfer from another 4-year university? Here is the list of courses that have been accepted in the past towards CogSci major requirements! Research/IA Opportunities Students can do research in campus labs for academic credit (COGS 99s/199s) or become Instructional Assistants (IAs) in COGS classes to practice leadership skills and become more familiar with the material. These are great ways to work with CogSci faculty members who can provide guidance or mentorship. Study Abroad Would you like to study abroad? Our Study Abroad page has plenty of resources to help you choose a program and plan your trip. Jobs & Internship If you are looking for work or an internship on or off campus, you might find something on our Jobs & Internship page. Student Organizations To build up portflio and networking experience, you can join a CogSci student organization and work with your peers outside of the classroom. Health and Wellness Check out this page for a list of some health and wellness resources for undergraduate students. Undergraduates Advising Major Program Minor Program Courses Prospective Undergraduates Student Resources UC/CSU Cognitive Science Transfer Equivalency Undergraduate Research (99 and 199) Instructional Apprenticeship (IA) Study Abroad Jobs, Programs & Internships Student Organizations Health and Wellness IRSPD Honors Program Undergraduate Advising In-Person Advising is unavailable. Virtual Advising: vac.ucsd.edu cogsadvising@ucsd.edu Please see Advising for Walk-In Hours."
