title = "Employment"
full_description = "About Department History Photo/Video Galleries Contact & Directions Human Resources Employment Calendar News Highlights Give Back Cognitive Science Dept. Facilities Campus Principles of Community Diversity in Cognitive Science Safety Resources HOME About Employment Cognitive Science Academic Employment Assistant Professor in Cognitive Science Recruitment POSITION OVERVIEW Position title: Assistant Professor Salary range: A reasonable salary range estimate for this position is $74,600 - $83,100.A market off-scale component of up to $62,000 will be added to the scale in effect at the time the offer is made. The posted UC Academic salary scales set the minimum pay as determined by rank and/or step at appointment. See the following table(s) for the salary scale(s) for this position https://www.ucop.edu/academic-personnel-programs/_files/2023-24/oct-2023-acad-salary-scales/t1.pdf. The base salary range, from the salary table(s), for this position is $74,600.“Off-scale salaries” and other components of pay, i.e., a salary that is higher than the published system-wide salary at the designated rank and step, are offered when necessary to meet competitive conditions, qualifications, and experience. Additional UCSD salary information can be found here: https://aps.ucsd.edu/compensation/apo-salary.html APPLICATION WINDOW Open date: August 19, 2024 Next review date: Monday, Sep 30, 2024 at 11:59pm (Pacific Time)Apply by this date to ensure full consideration by the committee. Final date: Friday, May 30, 2025 at 11:59pm (Pacific Time)Applications will continue to be accepted until this date, but those received after the review date will only be considered if the position has not yet been filled. POSITION DESCRIPTION The UC San Diego Department of Cognitive Science invites applications for up to three tenure-track faculty positions at the Assistant Professor rank. We seek exceptional candidates in any relevant area of Cognitive Science, including but not limited to: artificial intelligence, language, learning, memory, perception, action, cognitive development, spatial cognition, neural underpinnings of cognition, theoretical and philosophical foundations of cognition, and the design and analysis of cognitive artifacts like human-computer interfaces, robots, and social computing systems. A successful candidate will be expected to lead an independent research program and supervise trainees in cognitive science at all levels, including undergraduate and graduate students. The candidate will be expected to lead an independent program of research in cognitive science, teach courses in cognitive science, mentor undergraduate and graduate students in research, engage in service to the department, university, and the profession, and contribute to efforts to promote diversity, equity, and inclusion on campus. Department: https://cogsci.ucsd.edu/ QUALIFICATIONS Basic qualifications (required at time of application) By the time of application, candidates must have a Ph.D. or equivalent doctoral degree or be ABD (all but dissertation) in their relevant area of Cognitive Science, including but not limited to: artificial intelligence, language, learning, memory, perception, action, cognitive development, spatial cognition, neural underpinnings of cognition, theoretical and philosophical foundations of cognition, and the design and analysis of cognitive artifacts like human-computer interfaces, robots, and social computing systems. Candidate currently engaged with or planned engagements of contributions to diversity, equity, and inclusion. Additional qualifications (required at time of start) By the time of appointment candidates must have a Ph.D. or equivalent doctoral degree in their relevant area of Cognitive Science, including but not limited to: artificial intelligence, language, learning, memory, perception, action, cognitive development, spatial cognition, neural underpinnings of cognition, theoretical and philosophical foundations of cognition, and the design and analysis of cognitive artifacts like human-computer interfaces, robots, and social computing systems. Candidate must have currently engaged efforts or planned engagements of contributions to diversity, equity, and inclusion. APPLICATION REQUIREMENTS Document requirements Curriculum Vitae - Your most recently updated C.V. Cover Letter Statement of Research Statement of Teaching - Describe experience teaching and/or mentoring at the University level and includes a list of courses the candidate is qualified to teach or has taught. Statement of Contributions to Diversity - Applicants should summarize their past or potential contributions to diversity. See our Faculty Equity site for more information. Publication(s) - Include up to 4 representative publications/scholarly articles. Authorization to Release Form - Applicants, must complete, sign and upload this form. See Institutional Reference Check https://aps.ucsd.edu/recruitment/applicant_resources/index.html for more information. Other Creative Work - Provide videos, demos or press coverage of other creative work (optional). (Optional) Misc / Additional (Optional) Reference requirements 3-5 letters of reference required Apply link: https://apol-recruit.ucsd.edu/JPF04016 Help contact: astorres@ucsd.edu ABOUT UC SAN DIEGO The University of California, San Diego is an Equal Opportunity/Affirmative Action Employer advancing inclusive excellence. All qualified applicants will receive consideration for employment without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, disability, age, covered veteran status, or other protected categories covered by the UC nondiscrimination policy. For the University of California’s Affirmative Action Policy please visit: https://policy.ucop.edu/doc/4010393/PPSM-20. For the University of California’s Anti-Discrimination Policy, please visit: https://policy.ucop.edu/doc/1001004/Anti-Discrimination. As a University employee, you will be required to comply with all applicable University policies and/or collective bargaining agreements, as may be amended from time to time. Federal, state, or local government directives may impose additional requirements. The University of California prohibits smoking and tobacco use at all University controlled properties. The UC San Diego Annual Security & Fire Safety Report is available online at: https://www.police.ucsd.edu/docs/annualclery.pdf. This report provides crime and fire statistics, as well as institutional policy statement & procedures. Contact the UC San Diego Police Department at (858) 534-4361 if you want to obtain paper copies of this report. JOB LOCATION San Diego, CA 2024-2025 Temporary Lecturer POSITION OVERVIEW Position title: Lecturer Salary range: A reasonable salary range estimate for this position is $68,247-$86,454. The posted UC academic salary scales (https://www.ucop.edu/academic-personnel-programs/compensation/2024-25-academic-salary-scales.html) set the minimum pay determined by rank and/or step at appointment. See the following table for the salary scale for this position: https://www.ucop.edu/academic-personnel-programs/_files/2024-25/july-2024-scales/t15.pdf Review timeline: The review of applications will begin on August 22nd, 2024. The posting will remain open for the duration of the year to accommodate upcoming course needs or until the position is filled. APPLICATION WINDOW Open date: August 22, 2024 Most recent review date: Thursday, Sep 12, 2024 at 11:59pm (Pacific Time)Applications received after this date will be reviewed by the search committee if the position has not yet been filled. Final date: Saturday, May 31, 2025 at 11:59pm (Pacific Time)Applications will continue to be accepted until this date, but those received after the review date will only be considered if the position has not yet been filled. POSITION DESCRIPTION The Department of Cognitive Science at the University of California, San Diego is committed to continuing a tradition of excellence in its faculty and invites applications from candidates who can contribute to that tradition.The department is accepting applications for temporary non-tenure track lecturers (Unit 18) to teach for the 2024-2025 academic year. Teaching duties will include upper- and lower-division undergraduate classes in the areas of: computational methods and modeling, human-computer interaction, human-centered design, language or culture and cognition, neuroscience (cognitive, behavioral, theoretical, and/or systems), and clinical aspects of cognitive science. In addition to teaching responsibilities, general duties include (but are not limited to) managing teaching assistants, holding office hours, assigning grades, advising students, preparing course materials (e.g., syllabus), and maintaining course websites. Lecturers teaching large courses are expected to work with and mentor student teaching assistants. The number of positions and courses varies across academic quarters, depending on the curriculum needs of the Department. Positions typically start at the beginning of an academic quarter, and appointments may be renewable based on need, funding, performance, and the Department's mandate to maintain intellectual diversity. UCSD and the Department of Cognitive Science are committed to maintaining a diverse faculty and promoting an inclusive and tolerant environment. Course descriptions can be found at http://www.ucsd.edu/catalog/courses More Info: http://www.cogsci.ucsd.edu QUALIFICATIONS Basic qualifications (required at time of application) Candidates must be at least nearing completion of a Master's program (within 1 semester of completion) in the area of Cognitive Science or closely related field. (Related fields include: Psychology, Neuroscience, Computer Science, Linguistics etc.) Candidates must have at least one semester or quarter of prior university level experience in teaching in cognitive science or related undergraduate courses. (Teaching experience can be as a teaching assistant). Additional qualifications (required at time of start) Candidates must have at minimum a Master's degree in the area of Cognitive Science and/or related fields. (Related fields includes: Psychology, Neuroscience, Computer Science, Linguistics etc.) Preferred qualifications Ph.D. or equivalent doctorate degree in the area of Cognitive Science and/or related fields is preferred. (Related fields include: Psychology, Neuroscience, Computer Science, Linguistics etc.) 1 year of experience teaching large classroom sizes (50 -200 students) Positive teaching evaluations with 75% student recommendation rate or higher is preferred. APPLICATION REQUIREMENTS Document requirements Curriculum Vitae - Your most recently updated C.V. Cover Letter Statement of Teaching/Teaching Philosophy - Summarize teaching experience, quality of teaching in classroom and student mentoring, and other instructional-related activities. Statement of Contributions to Diversity - Applicants should summarize their past or potential contributions to diversity. See our Faculty Equity site for more information. Misc / Additional (Optional) Evidence of Teaching Effectiveness - Provide summaries of teaching evaluations (within the last 2 years). (Optional but strongly encouraged.) (Optional) Transcript (Optional) Syllabus - Provide sample of course syllabi from classes you have taught in the last two years. (Optional) Reference requirements 3-4 required (contact information only) Apply link: https://apol-recruit.ucsd.edu/JPF04011 Help contact: m2villegas@ucsd.edu ABOUT UC SAN DIEGO The University of California, San Diego is an Equal Opportunity/Affirmative Action Employer advancing inclusive excellence. All qualified applicants will receive consideration for employment without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, disability, age, covered veteran status, or other protected categories covered by the UC nondiscrimination policy. For the University of California’s Affirmative Action Policy please visit: https://policy.ucop.edu/doc/4010393/PPSM-20. For the University of California’s Anti-Discrimination Policy, please visit: https://policy.ucop.edu/doc/1001004/Anti-Discrimination. As a University employee, you will be required to comply with all applicable University policies and/or collective bargaining agreements, as may be amended from time to time. Federal, state, or local government directives may impose additional requirements. The University of California prohibits smoking and tobacco use at all University controlled properties. The UC San Diego Annual Security & Fire Safety Report is available online at: https://www.police.ucsd.edu/docs/annualclery.pdf. This report provides crime and fire statistics, as well as institutional policy statement & procedures. Contact the UC San Diego Police Department at (858) 534-4361 if you want to obtain paper copies of this report. JOB LOCATION La Jolla, CA About Department History Photo/Video Galleries Contact & Directions Human Resources Employment Calendar News Highlights Give Back Cognitive Science Dept. Facilities Campus Principles of Community Diversity in Cognitive Science Safety Resources Join us on Facebook Join us on Instagram"
