["https://coinbase.com/assethub"]
title = "Coinbase Listings"
description = "For digital asset issuers looking to launch on Coinbase products"
full_description = "At Coinbase, we believe in the power of innovation and are constantly monitoring the crypto landscape for promising projects to support on our platform. Once an asset meets our business criteria, we may choose to move forward with a due diligence review. If we need additional information in order to complete an initial review or have updates to share, we will reach out to the project team directly. If your project has a live token (or is considering launching a token) and feel it’s a strong fit for our platform and customer base, we invite you to share more details with us. With thousands of live assets today, we prioritize reviews of assets by aiming to meet consumer demand while supporting a growing industry. We prioritize reviews of assets based on set business criteria such as demand (i.e. trading volume, market cap), traction of token/application (i.e. token holders), & anticipated liquidity. We also perform additional business assessments regarding quantitative and qualitative signals such as social media sentiment and behavior, history of key project contributors, and information about how tokens are distributed. As project teams continue to issue new tokens, our team strives to stay current in this evolving landscape by supporting asset launches with trading support on day one. Evaluating assets ahead of launch is unique, and we have a separate set of business criteria to decide which projects we’ll consider for a pre-launch review. We are currently equipped to support several token types (ERC-20 on Base, Ethereum, Optimism, Arbitrum, and Polygon as well as SPL’s and ARC-20s) without substantial integration efforts. Native blockchains and other asset types require additional resources to support, which impacts our ability to prioritize certain assets. Begin by filling out a request for review, and provide detailed information about your asset, including its purpose, technology, and team. Our team conducts a preliminary assessment to ensure the asset aligns with our listing criteria. If we choose to move forward or have additional questions, our team will reach out to you."
