["https://coinbase.com/bitcoin-halving"]
title = "The Bitcoin Halving: Everything you need to know"
description = "On April 2024 the block reward will be reduced from 6.25 Bitcoin per block to 3.125 Bitcoin per block. Read more."
full_description = '''Around April 19-20, 2024, the block reward will be reduced from 6.25 Bitcoin per block to 3.125 Bitcoin per block. Read more Around April 19-20, 2024, the block reward will be reduced from 6.25 Bitcoin per block to 3.125 Bitcoin per block. Read more Every four years, on the halving day, the amount of new Bitcoins created gets cut in half. This means that when Bitcoin halves, the reward given to the contributors securing the network is reduced by 50%, directly impacting the rate at which new Bitcoins are introduced into circulation. This is what we're referring to as the halving day. At the beginning of 2020, 12.5 new Bitcoins were added to the network every 10 minutes via virtual "mining." In May, that amount was halved to 6.25. In April 2024, it will drop again to around 3.125 — and the process will continue until all 21 million coins have been mined (which estimates say should happen around the year 2140). This process, coded into the Bitcoin protocol by Satoshi Nakamoto, the creator of Bitcoin, is a way to limit the total supply of Bitcoin, increasing its scarcity. When Bitcoin undergoes a halving, the number of new Bitcoins that are made gets cut in half. Said differently, there's a 50% reduction in the reward miners receive for validating transactions and adding them to the blockchain. This event is coded into the Bitcoin protocol and occurs approximately every four years or after 210,000 blocks. When Bitcoin halves, the reward given to the contributors securing the network is reduced by 50%, directly impacting the rate at which new Bitcoins are introduced into circulation. And because there are only 21 million bitcoins and the halving makes fewer of them, the halving contributes to making bitcoins more scarce. This inherent scarcity, combined with the historic increase in demand after the previous halving events, fosters a sense of digital rarity that could lead to potential upward pressure on prices. When Bitcoin halves, the reward given to the contributors securing the network is reduced by 50%, directly impacting the rate at which new Bitcoins are introduced into circulation. And because there are only 21 million Bitcoins and the halving makes fewer of them, the halving contributes to Bitcoin's deflationary nature, making people think of Bitcoin as something special and rare.'''
year_published = 2025
clearnet = "https://coinbase.com/bitcoin-halving"
