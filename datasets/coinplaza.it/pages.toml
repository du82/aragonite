["https://coinplaza.it/faq"]
title = "Frequently Asked Questions | CoinPlaza"
description = "At CoinPlaza you can buy, sell and exchange Bitcoin, Ethereum, Litecoin and other crypto currencies. Easy, fast and convenient!"
full_description = "Please enter the verification code that has been sent to your email / telephone and set up a new password for your account. Before you can use your CoinPlaza account, you must accept our Terms of Service. Before you can use your CoinPlaza account, you must accept our Privacy Policy. Please read and accept our Cookie Policy. Please read and accept our Affiliate Program's Terms of Service. CoinPlaza is a non-custodial instant crypto currency exchange. At CoinPlaza you can buy, sell and exchange crypto currencies in a practical, easy and fast manner. CoinPlaza is also the safest way to buy or sell crypto currencies since we immediately convert your money and send the desired currency to your own wallet, or to your bank account. Your funds are in our hands only for a very short time frame, strictly needed to perform the currency exchange. We don't provide any option to store your coins or fiat money on our exchange, making it impossible to lose your funds even if your CoinPlaza account gets compromised by hackers. Moreover, we firmly believe users should always own the private keys of their funds. We aimed to streamline the process of buying, selling or exchanging cryptos and keep it as simple as possible, using a unified interface for all the exchange directions. Just select the currency you want to send, the currency you want to receive, enter your desired amount and fill in your destination wallet address (or bank account). It's really as simple as that! Once you have sent the payment to the deposit address you are given, we will immediately convert your funds to your currency of choice and send it to your own wallet or bank account. We built our platform with the safety of our customers funds in mind. Instead of regular exchanges where you have to deposit your funds, submit an order, wait for it to be filled and then you can finally withdraw your desired currency, at CoinPlaza we minimized the time your funds are in our hands. Instead of using internal balances, your funds will be converted to the desired currency and sent to your own wallet straight away. Even if your CoinPlaza accounts get compromised, your funds will never be at risk. CoinPlaza S.r.l. is a registered company in Italy and you can reach us for any questions sending an email to support at coinplaza.it."
