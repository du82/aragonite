description = "Accelerate your crypto startup with our exclusive accelerator program ? Join a network of experts, gain media exposure, and connect with a professional community to fuel your growth in blockchain and Web3. ? Unlock your potential today!"
full_description = "We typically work with projects meeting the following criteria: Pre-Seed to Series A stages Working product or MVP/testnet Initial client traction Successfully raised or committed initial funds The program includes 3 months of strategic boost with marketing advisory, 1-to-1 mentorship sessions, workshops and networking. It is normally followed by a media campaign on Cointelegraph for 6-12 months. The program is fully remote with offline elements (meetups, demo-days etc). As part of the program you can receive up to $100k to fuel your project’s development. The seed funding is provided basing on completion of the program milestones and is structured to align with your project’s needs and valuation, further solidifying our commitment to your success. To enhance your brand visibility, you will be able to use media products in the Cointelegraph ecosystem, including: Advertorial products, video and content marketing Display advertising and exclusive special projects Integrations with Cointelegraph Research Throughout the program, you will work with top-notch mentors that will help you with the main pain points of your growth: user acquisition, tokenomics, legal, selecting the right tech stack, or other topics. Our diverse team will bring best practices to your project, including: Marketing strategy assessment/development Website and social media audit Community management guidelines and best practices Growth hacking tools, etc. We organise regular meetups and introductions to a network of investors, exchanges, market makers, technology providers, etc. You will also have access to one of the largest KOLs network in the industry. As part of the program, we help you get into hot spots and participate in online and offline events in the crypto industry, including access to demo days and pitch competitions supported by Cointelegraph. The average program value is 1% – 3% of tokens/equity, depending on your valuation. The value of media products on Cointelegraph is included in the program package. There is no upfront fee."
