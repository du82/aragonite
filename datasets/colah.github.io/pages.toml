title = "Data.List Recursion Illustrated - colah's blog"
full_description = 'Data.List Recursion Illustrated Posted on February 12, 2015 functional programming, Haskell, visualization .FunctionTable table, .FunctionTable th, .FunctionTable td { border: 1px solid black; border-collapse: collapse; } .FunctionTable { margin-top: 30px; margin-bottom: 30px; } .FunctionTable th, .FunctionTable td { width:50%; padding: 15px; text-align: center; font-family: monospace; } .FunctionTable h3 { font-family: monospace; margin-top: 1px; text-align:center; font-size:135%; } .FunctionTable td div { width:100%; height:100%; display:block; } .FunctionTable a:link { color: black; text-decoration: none; } .FunctionTable a:visited { color: black; text-decoration: none; } .FunctionTable a:hover { color: black; text-decoration: none; } .FunctionTable a:active { color: black; text-decoration: none; } .type-f { background-color: #fff0a5; } .type-a { background-color: #d4c7f9; } .type-b { background-color: #afd5f8; } .type-c { background-color: #d5a6bd; } .type-Bool { background-color: #e0e0e0; } .sig1 { text-align: left; margin-left: 5%; margin-bottom: 1px; } .sig2 { text-align: right; margin-right: 10%; margin-bottom: 1px; } Data.List is a standard Haskell library. It provides lots of really helpful functions for working with lists. In particular, Data.List provides functions for particular patterns of recursion on lists. Some of them, such as map, are familiar to many programmers. But there are lots of subtle variations, and it’s hard to keep them all straight. The goal of this blog post is to provide a convenient reference to quickly understand all these different functions, with a couple of pretty pictures. Folds Folds combine all the elements of a list into a single value. For example, if you want to add up all the elements of a list you could fold the addition function over the list. There are two choices one needs to make when doing a fold: Should I start on the right side, or the left side? Do I have a starting value? (For example, if I’m adding up the numbers in a list, I can start with zero and add each new value.) There are four versions of fold, corresponding to each pair of choices. foldl foldl :: (b -> a -> b) -> b -> [a] -> b foldr foldr :: (a -> b -> b) -> b -> [a] -> b foldl1 foldl1 :: (a -> a -> a) -> [a] -> a foldr1 foldr1 :: (a -> a -> a) -> [a] -> a Scans Scans are kind of like folds with history. As they combine the elements of the input list, they remember every intermediary step and produce a list from those. There is a scan corresponding to every version of fold. scanl scanl :: (b -> a -> b) -> b -> [a] -> [b] scanr scanr :: (a -> b -> b) -> b -> [a] -> [b] scanl1 scanl1 :: (a -> a -> a) -> [a] -> [a] scanr1 scanr1 :: (a -> a -> a) -> [a] -> [a] Maps Maps look at every element of a list and produce a corresponding output. The basic map function just looks at the list element, but there are also accumulating maps that either get information from the left or right. map map :: (a -> c) -> [a] -> [c] mapAccumL mapAccumL :: (b -> a -> (b, c)) -> b -> [a] -> (b, [c]) mapAccumR mapAccumR :: (b -> a -> (b, c)) -> b -> [a] -> (b, [c]) Accumulating maps are kind of elegant because they contain a lot of other functions. For example, if you let \(b=()\), you get regular map. And if you let \(c=()\) you get foldr/foldl. Finally, if you let \(a=()\), you get something very close to unfold from the following section. Unfolds Where folds take a list and produce a single value, unfolds take a single value and produce a list. Data.List only provides unfoldr. It is called unfoldr because it is the dual of foldr, even though it actually starts on the left. N/A unfoldr unfoldr :: (b -> Maybe (c, b)) -> b -> [c]'
