title = "Alumni"
description = "Music training for all ages and levels"
full_description = 'As a Colburn alum, you already have a lifelong connection to a remarkable group of performers, artists, educators, and industry professionals. The Alumni Office is here to provide the Colburn School’s incredible alumni with opportunities to engage with other alumni and students, give back to the community, and maintain or establish meaningful professional and personal networks. Get to know the resources and connections available to you, and be sure to stay in touch using our Alumni Announcement Form or by emailing alumni@colburnschool.edu. Need to request an official transcript from the Conservatory? Click here. For all other requests, contact the Alumni Office at alumni@colburnschool.edu Next Up Series Alumni of all units are invited to submit curated program proposals for this concert series. Selected proposals will be presented by The Colburn School and receive a grant. The submission cycle for the 2022-2023 season will close on Sunday, June 19, and you can find all of the details here. So, How’s That Going? alumni podcast We regularly catch up with Colburn alumni to talk about life after Colburn, diving into their stories to explore a wide range of topics. From landing the job to pursuing creative ventures, alumni share their insight with aspiring students and artists at Colburn and around the globe. Listen here or find us on your favorite podcast platform. Monthly Alumni Newsletter Get to know what other alumni are working on, learn about relevant Colburn news, and share your accomplishments every month. Sign up here. Opportunities to mentor students We regularly invite interested alumni back to campus to work with our current students on everything from professional development to audition prep, and more. Email alumni@colburnschool.edu or <a href="mailto:nzeisler@colburnschool.eduNathaniel Zeisler to let us know if you’re interested! Special alumni access and ticketing offers for select Colburn events Subscribe to the alumni mailing list to receive updates about alumni ticketing and access as the campus begins to open up and, eventually, when we resume hosting events in cities across the country. Sign up for the alumni mailing list here. Colburn Alumni Facebook group Keep in touch with your fellow alumni, share your projects, and stay up to date with the School. Join the group.'
