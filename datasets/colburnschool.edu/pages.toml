title = "2024–25 Season Overview"
description = "Music training for all ages and levels"
full_description = "Discover a Vibrant World of Music and Dance The Colburn School’s 2024-25 season presents an exciting lineup showcasing extraordinary young musicians, classical music stars, and world-renowned conductors. Season highlights include visiting artists such as violinist Jennifer Koh; the dynamic duo of cellist Steven Isserlis and Connie Shih; several Colburn alumni including the Calidore String Quartet, Will Hagen, Albert Cano Smit, and Afendi Yusuf; and the Adrian Dunn Singers. The Colburn Orchestra performs in DTLA, Pasadena, and Northridge under the batons of Esa-Pekka Salonen, Stéphane Denève, Lidiya Yankovskaya, Yehuda Gilad, and more. Colburn’s passionate and dedicated young musicians and dancers will put their training to work all season long in intimate recitals, chamber forums, and showcases featuring all genres. View Subscription Packages Explore our Flagship Series Colburn Orchestra Colburn Chamber Music Society Discover New Artists and Experiences Colburn Presents Recovered Voices Master Classes Faculty Recitals LA Arts and More Parties with a Purpose Connect with Colburn Students Community School of Performing Arts Conservatory of Music Music Academy Trudl Zipper Dance Institute Explore our Flagship Series Colburn Orchestra Colburn Conservatory of Music’s flagship ensemble brings stages to life around Southern California. SEP 28, 2024 at Ambassador Auditorium · Carlos Miguel Prieto conducts Brahms’s Symphony No. 3* OCT 26, 2024 at Walt Disney Concert Hall · Esa-Pekka Salonen conducts Sibelius’s Violin Concerto NOV 23, 2024 at Ambassador Auditorium · Lidiya Yankovskaya conducts Debussy’s La mer* FEB 1, 2025 at Ambassador Auditorium · Yehuda Gilad conducts Tchaikovsky’s Violin Concerto* MAR 22, 2025 in Zipper Hall · Mert Yalniz and Aleksandra Melaniuk conducts Concerto Forum APR 12, 2025 at The Soraya · Stéphane Denève conducts Dvořák Symphony No. 8 *Season Subscription Available The Colburn Orchestra is generously underwritten by Eva and Marc Stern. Colburn Chamber Music Society Renowned guest artists are joined on stage by Conservatory of Music students and faculty for a series of intimate performances. SEP 15, 2024 · Jennifer Koh, Violin OCT 13, 2024 · Louis Lortie, Piano NOV 10, 2024 · Paul Watkins, Cello JAN 19, 2025 · Jonathan Brown, Viola MAR 30, 2025 · Afendi Yusuf, Clarinet Season Subscription Available Discover New Artists and Experiences Colburn Presents Classical music and dance stars take the Colburn stage for intimate recitals. SEP 5, 2024 · Trio Azura in Recital OCT 23, 2024 · William Hagen, Violin, and Albert Cano Smit, Piano NOV 12, 2024 · Calidore String Quartet: Korngold Complete String Quartets NOV 15, 2024 · Calidore String Quartet and Quartet Integra: Mendelssohn Octet FEB 2, 2025 · Viola Plus FEB 7, 2025 · Marko Topchii FEB 9, 2025 · Quartet Integra and Fabio Bidini FEB 14, 2025 · Steven Isserlis, Cello, and Connie Shih, Piano FEB 15, 2025 · Adrian Dunn Singers MAR 28, 2025 · Kerson Leong, Violin Recovered Voices The Ziering-Conlon Initiative for Recovered Voices is a unique Colburn resource that encourages greater awareness and more frequent performances of music by composers whose careers and lives were disrupted—or worse— during the years of the Nazi regime in Europe. SEP 17, 2024 · ARC Ensemble FEB 16, 2025 · Adam Millstein, Violin, and Dominic Cheli, Piano MAR 15, 2024 · The Music of Poland The Ziering-Conlon Initiative for Recovered Voices is made possible through the generous support of Marilyn Ziering alongside the many donors who are inspired by this incredibly important work at Colburn School. Master Classes An insider’s look at performance preparation, master classes offer a rare glimpse into the artistic, creative, and learning processes. SEP 12, 2024 · Jennifer Koh, Violin SEP 13, 2024 · Jennifer Koh, Chamber Music NOV 7, 2024 · Paul Watkins, Cello NOV 8, 2024 · Paul Watkins, Chamber Music NOV 14, 2024 · Calidore String Quartet FEB 4, 2025 · Alon Goldstein, Piano FEB 8, 2025 · Marko Topchii, Guitar FEB 13, 2025 · Steven Isserlis, Cello & Connie Shih, Piano MAR 25, 2025 · Afendi Yusuf, Clarinet MAR 29, 2025 · Kerson Leong, Violin Faculty Recitals Experience the talent and creativity of Colburn’s distinguished faculty artists as they perform their own curated programs with friends and students. SEP 20, 2024 · Tatjana Masurenko, Viola OCT 19, 2024 · Community School Faculty Showcase NOV 3, 2024 · Henry Gronnier, Violin NOV 24, 2024 · Tap Faculty Showcase JAN 25, 2025 · Kenton Youngstrom, Guitar FEB 23, 2025 · Schubertiade MAR 30, 2025 · Connie Sheu, Guitar APR 25, 2025 · Kate Vincent, Viola MAY 10, 2025 · Aimee Kreston, Violin LA Arts and More Get a taste of the rich Los Angeles performing arts scene. OCT 10-11, 2024 · TonicCon OCT 19, 2024 · Grand Avenue Arts: All Access Parties with a Purpose We invite you to join us for show-stopping performances and exclusive parties with like-minded individuals who support Colburn’s education and on-stage activities. Your attendance will help provide access to the best performing arts training without financial barriers. View the calendar for special events that support Colburn throughout the year. APR 6, 2025 · Celebrate Colburn Gala To Be Announced · Space & Sound Connect with Colburn Students Community School of Performing Arts The Community School of Performing Arts is committed to making the highest quality music education available to all. Passionate, dedicated students of all ability levels and ages come to Colburn’s campus each year to play in ensembles and to study instruments, voice, music theory, drama, and more with world-class teachers. OCT 27, 2024/NOV 17, 2024/FEB 23, 2025/APR 27, 2025 · Advanced Orchestras DEC 7, 2024/MAY 10, 2025 · Band and Wind Ensemble DEC 8, 2024 · Honors Chamber Recital DEC 8, 2023/ MAY 3, 20245 · Choral Concerts DEC 15, 2024/MAY 11, 2025 · Honors Recital MAY 17, 2025 · Year-End Chamber Recitals Conservatory of Music The Conservatory of Music opened in 2003 with one goal: to train the very highest level of classical instrumental performers for careers in music. Outstanding performance opportunities; unparalleled faculty; and full scholarships covering tuition, room, and board for all students have allowed the Conservatory to produce dynamic young soloists, chamber groups, and orchestra musicians. THURSDAYS ALL YEAR · Performance Forum NOV 8, 2024/APR 4, 2025 · Colburn Baroque Ensemble OCT 31, 2024/APR 18, 2025 · Colburn Contemporary Ensemble TUESDAYS AND FRIDAYS ALL YEAR · Chamber Forum SATURDAYS ALL YEAR · Colburn @ St. Paul Music Academy The Music Academy brings exceptional pre-college students from around the world to Colburn, where they take their training to the next level. Young musicians ages 14–18 balance performance, musical instruction, and academics in a comprehensive program that allows them to flourish and develop their artistry. SATURDAYS ALL YEAR · Music Academy Young Artist Performances DEC 15, 2024/APR 20, 2025 · Academy Virtuosi APR 19, 2025 · Two-Piano Performance MAY 4, 2025 · Adrian Daly Senior Recitals Trudl Zipper Dance Institute The Trudl Zipper Dance Institute is dedicated to developing the talent and ambitions of its students, from beginners in Youth Dance to aspiring professionals in the Dance Academy. Performers of all levels receive sequential training in ballet, tap, and modern genres in a cohesive curriculum that emphasizes the joy of dance through artistic and technical accomplishment. NOV 3, 2024 · See the Music, Hear the Dance DEC 14, 2024· Winter Dance Celebration FEB 22, 2025 · Tap Fest MAR 30, 2025 · Counterpointe MAY 11, 2025 · Student Choreography Showcase MAY 17, 2025 · Spring Dance Festival: Tap May 24, 2025 · Spring Dance Festival: Ballet, Modern, and Dance Academy"
