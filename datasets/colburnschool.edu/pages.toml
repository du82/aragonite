full_description = 'At Colburn, people with a passion for the performing arts get their chance to build a future in music or dance. Guiding them are faculty members that include internationally acclaimed musicians and dancers from the nation’s top ensembles and companies. Private lessons, group instruction, and ensembles in classical music, jazz, drama, theory, and early childhood for students of all ability levels and ages A degree and diploma granting collegiate program for the highest level of classical instrumental performers Highly selective training pre-college program to prepare gifted young musicians from around the world for future success as professional musicians A comprehensive dance program for ballet, modern, and tap based on sequential learning that includes the elite pre-professional Dance Academy for ballet The Colburn School provides the highest quality performing arts education at all levels of development in an optimal learning environment. With a drive for access to excellence, students in our Community School, Music Academy, Trudl Zipper Dance Institute, and Conservatory of Music receive training, guidance, and comprehensive educational experiences from our renowned faculty located in the arts district of downtown Los Angeles. Receive information, articles, invites, and more by signing up for our Colburn newsletters. Stay connected and in the know on the latest Colburn news and events. Colburn School 200 South Grand Avenue Los Angeles, CA 90012 213-621-2200 jQuery(document).ready(function(){jQuery(".wpr-search-form").attr("action","/search"),jQuery(".wpr-search-field").attr("name","q")}); casibom deneme bonusu casibom'
