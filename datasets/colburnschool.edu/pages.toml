title = "Next Up Series"
description = "Music training for all ages and levels"
full_description = "Next Up Series Colburn alumni may no longer be studying in our halls, but they are performers for life. Thanks to the generosity of donations both large and small, we are pleased to welcome them back for the Next Up Series. 2022-23 Featured Artists DuoSkope Evin Blomberg (Conservatory ’15), Violin Natalie Helm (Conservatory ’14), Cello Thursday, March 9 at 7 pm Thayer Hall Evin Blomberg and Natalie Helm formed the string duo DuoSkope after first meeting and playing together at The Colburn School. In this autobiographical program, they will perform arrangements of favorite works, each of which has influenced their own journey. Learn more and buy tickets Sakura Cello Quintet Peter Myers (Conservatory ’08), Cello Michael Kaufman, Community School Faculty, Cello Stella Cho, Cello Yoshika Masuda, Cello Zachary Mowitz, Cello Thursday, April 27 at 7 pm Thayer Hall With this eclectic program, the SAKURA Cello Quintet <<link to http://www.sakuracellos.com>> explore the many facets of night—from comfort to terror, haunting loneliness to beguiling sensuality—through the works of Fauré, Falla, Myers, Crockett, Janacek, Schubert, Debussy, and Chick Corea. Learn more and buy tickets You can watch our past performances on demand or learn more about the individual programs here. Proposals are now being reviewed for the 2022–23 Next Up Series. Thank you to all who submitted! We look forward to sharing the performance schedule on this page as soon as it’s available. If you have any questions regarding the series or submission cycles, please feel free to reach out to alumni@colburnschool.edu."
