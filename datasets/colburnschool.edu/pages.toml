["https://colburnschool.edu/2024-25-early-access"]
title = "2024-25 Season: Subscription Packages"
description = "Music training for all ages and levels"
full_description = "The Colburn School’s 2024-25 season presents an exciting lineup showcasing extraordinary young musicians, classical music stars, and world-renowned conductors. Ensure you never miss a beat by purchasing one of our Subscription Packages, which include: At least 20% discount on premium tickets Guaranteed seats for high-demand guest artist performances 10% discount in the Colburn Café on the day of events taking place on the Colburn campus Colburn Orchestra Subscription Package: $100 Ambassador Auditorium, Pasadena The Colburn Orchestra is the renowned flagship ensemble of the Colburn Conservatory of Music, presenting exhilarating performances from some of the world’s best young classical musicians, led by internationally celebrated conductors. This package includes premium tickets to the Orchestra’s entire season at Pasadena’s Ambassador Auditorium. The Colburn Orchestra is generously underwritten by Eva and Marc Stern. Buy Orchestra Package Toggle Carlos Miguel Prieto conducts Brahms’s Symphony No. 3 Saturday, September 28 at 7 pm Carlos Miguel Prieto, Conductor Bence Bubreg, Clarinet WAGNER Prelude from Tristan und Isolde NIELSEN Concerto for Clarinet and Orchestra BRAHMS Symphony No. 3 The season opens with an evening of soulful masterworks rife with musical and emotional turmoil. The ever-shifting textures and styles of Nielson’s single-movement clarinet concerto are paired with Brahms’s Third Symphony, which exudes the composer’s characteristic angst as it alternates between major and minor. The moody prelude to Wagner’s opera Tristan and Isolde rounds out the program. Toggle Lidiya Yankovskaya conducts Debussy’s La Mer Saturday, November 23 at 7 pm Lidiya Yankovskaya, Conductor Eugene Lin, Cello STRAUSS Don Quixote ESMAIL RE|Member DEBUSSY La mer (The sea) Immerse yourself in musical imagery that paints vivid pictures of literature and life. The journey of errant knight Don Quixote is depicted through solo instruments in Strauss’s tone poem of the same name. Debussy brings an undulating seascape to life in his famous La mer, and a piece by Renee Esmail uses a unique oboe duet to capture the uncertainty felt in concert halls in 2021. Toggle Yehuda Gilad conducts Tchaikovsky’s Violin Concerto Saturday, February 1 at 7 pm Yehuda Gilad, Conductor Duncan McDougall, Violin SARAH GIBSON Painting the Floor SHOSTAKOVICH Symphony No. 6 TCHAIKOVSKY Violin Concerto The two critically-panned works on this program have since become audience favorites. Shostakovich’s Sixth starts with an achingly emotional slow movement before plunging toward a fast and fiery finish. In Tchaikovsky’s lively Violin Concerto, the virtuosic demands made on the soloist never fail to leave audiences awestruck. A David Hockney-inspired piece by Sarah Gibson opens the concert. This performance is generously supported by Beverly C. Marksbury. Quartet Collection Subscription Package: $115 Zipper and Thayer Halls Colburn is thrilled to welcome the renowned Calidore String Quartet to the Colburn stage for two concerts this season, including a performance with award-winning Colburn Chamber Ensemble-in-Residence Quartet Integra. Globally acclaimed pianist and Colburn Faculty Fabio Bidini will also take the stage with Quartet Integra. These performances are sure to sell out, so secure your tickets early. Buy Quartet Collection Package Toggle Calidore String Quartet: Korngold Complete String Quartets Tuesday, November 12 at 7 pm Zipper Hall KORNGOLD String Quartet No. 1 in A Major KORNGOLD String Quartet No. 2 in E-flat Major KORNGOLD String Quartet No. 3 in D Major The acclaimed Calidore String Quartet returns to its alma mater to perform the complete cycle of Korngold’s String Quartets. Winner of BBC Music Magazine’s 2024 Chamber Award, Calidore has been praised for its “deep reserves of virtuosity and irrepressible dramatic instinct” (New York Times). Korngold’s three string quartets are technically challenging, with melodies that harken to the composer’s successful film music career and vastly different styles and textures. The Calidore String Quartet’s 2024 Colburn School residency is generously supported by Dot and Rick Nelson. Toggle Calidore String Quartet and Quartet Integra: Mendelssohn Octet Friday, November 15 at 7 pm Thayer Hall WYNTON MARSALIS Selections from String Quartet No. 1 (“At the Octoroon Balls”) KORNGOLD String Sextet MENDELSSOHN String Octet in E-flat Major The acclaimed Calidore String Quartet continues its week-long residency with a program of eclectic works for four, six, and eight string instruments. Winner of BBC Music Magazine’s 2024 Chamber Award, Calidore has been praised for its “deep reserves of virtuosity and irrepressible dramatic instinct” (New York Times). Following Wynton Marsalis’s New Orleans-inspired string quartet, the group is joined by Quartet Integra, Colburn’s ensemble-in-residence, for works by Korngold and Mendelssohn. The Calidore String Quartet’s 2024 Colburn School residency is generously supported by Dot and Rick Nelson. Toggle Fabio Bidini and Quartet Integra: Schumann and Brahms Piano Quintets Sunday, February 9 at 3 pm SCHUMANN Piano Quintet in E-flat Major BRAHMS Piano Quintet in F Minor Delight in an evening of masterworks performed by Van Cliburn-winning pianist Fabio Bidini and Quartet Integra, Colburn’s ensemble-in-residence. These talented musicians will bring to life Brahms’s and Schumann’s only piano quintets, two of the most popular in the genre. Colburn Chamber Music Society Subscription Package: $112 Zipper Hall See some of the world’s most distinguished chamber musicians perform with talented Conservatory of Music students and faculty in the intimate setting of Zipper Hall. This package includes premium tickets to all of this season’s Chamber Music Society performances. The Chamber Music Package is no longer available. Toggle Jennifer Koh, Violin Sunday, September 15 at 3 pm MISSY MAZZOLI Lies You Can Believe In for String Trio NINA YOUNG Spero Lucem for Piano Quartet FAURE Piano Quartet No. 1 in C Minor SCHUMANN Piano Quartet in E-flat Major A multifaceted artist with a passion for new music, violinist Jennifer Koh continually enchants audiences with her virtuosity and technical prowess. She takes the Colburn stage for a program blending classic and contemporary. This concert is generously supported by the Jackson family, in memory of Adrian Daly for his angelic mentorship to students in the Colburn Academy and beyond. Toggle Louis Lortie, Piano Sunday, October 13 at 3 pm SAINT-SAËNS Caprice sur des airs danois et russes for Flute, Oboe, Clarinet, and Piano FAURÉ Piano Quartet No. 2 ROUSSEL Divertissement for Winds and Piano HAHN Piano Quintet Celebrated for his passionate playing and unique musical interpretations, award-winning French-Canadian pianist Louis Lortie boasts an impressive career as a soloist, chamber musician, and recording artist. He takes the stage for a program of innovative chamber works by French contemporaries Saint-Saen, Fauré, Roussel, and Hahn. Toggle Paul Watkins, Cello Sunday, November 10 at 3 pm CARLOS SIMON be still and know for Piano Trio COLERIDGE-TAYLOR Clarinet Quintet WAGNER Lohengrin Prelude for Cello Quartet MOZART Horn Quintet BRITTEN Sinfonietta for Wind and String Quintets Cellist Paul Watkins’s remarkable artistic resume includes membership in the famed Emerson String Quartet, eight concerto appearances at the BBC Proms, and regular performances with the Chamber Music Society of Lincoln Center. He curates a program sure to excite both wind and string lovers alike with its unique instrumental combinations. This residency is generously supported by The Geeting Family. Toggle Jonathan Brown, Viola Sunday, January 19 at 3 pm MOZART String Quartet No. 1 in G Major STEVE REICH Different Trains for String Quartet and Tape SCHOENBERG Verklärte Nacht for String Sextet Violist Jonathan Brown, Colburn’s newly appointed professor of chamber music, is a longtime member of the acclaimed Cuarteto Casals. With the quartet, he has performed in major concert halls across the globe and amassed a robust library of recordings. For his Colburn debut, Brown pairs Mozart’s charming String Quartet No. 1 with eclectic works by Schoenberg and Steve Reich. Toggle Afendi Yusuf, Clarinet Sunday, March 30 at 3 pm PENDERECKI Quartet for Clarinet and Strings VILLA-LOBOS Quintette en forme de chôros BRAHMS Clarinet Quintet in B Minor Cleveland Orchestra principal clarinet Afendi Yusuf has become an in-demand soloist and chamber musician thanks to his “clear, liquid tone, pitch-perfect intonation, and effortless technique” (Chicago Classical Review). The Conservatory alumnus returns to the Colburn stage for a program of quartets and quintets by Brahms, Villa-Lobos, and Penderecki. Season Sampler Subscription Package: $96 Can’t choose a subscription package? Then the Season Sampler subscription is for you! This package includes one Colburn Orchestra performance, one Chamber Music Society Performance, and one Quartet Collection performance of your choice. Buy Season Sampler Package"
