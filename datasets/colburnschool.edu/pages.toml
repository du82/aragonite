["https://colburnschool.edu/alumni/next-up-series/about"]
title = "About the Next Up Series"
description = "Music training for all ages and levels"
full_description = "About the Next Up Series 2022–23 Next Up Series Submission Cycle We are pleased to invite alumni from all Colburn units (Conservatory, Community School of Performing Arts, Music Academy, and the Trudl Zipper Dance Institute) to submit program proposals for consideration for the 2022-23 Next Up Series. If you have any questions regarding the series, please feel free to reach out to alumni@colburnschool.edu. Proposals are due Sunday, June 19, 2022 Programs will be reviewed and selected by a committee composed of Colburn leadership, Artistic Administration, and the Alumni Office with consultation from faculty across the school. Selected programs will receive a $1,000 grant and may be eligible for loans of recording equipment for project use, pending availability. The Colburn School will present the selected programs curated by alumni, with opportunities for on-campus and virtual formats, on the following possible dates: October 7, 2022 December 15, 2022 February 9, 2023 March 9, 2023 May 11, 2023 June 15, 2023 Once selected and notified, alumni will work directly with the Alumni Office to coordinate the performance, including promotional activities and communications with potential presenting or promotional partners. Alumni performers will be expected to promote the program on all channels available to them. All live performances will be recorded and may be used by the Colburn School in the future as a featured video on our social media channels, in sharing with the board and our donors, or in some other branded capacity. For pre-recorded performances, Colburn will retain a three-month window of exclusivity and may use that video in the future in any capacity. 2022-23 Proposal Requirements If you would like to be considered for the Alumni Recital Series, please use the following guidelines and submit your completed proposal as a PDF or Word Document to alumni@colburnschool.edu. Please carefully review the submission criteria for this cycle below before submitting. All proposals must include all of the listed elements for consideration. Proposals are due Sunday, June 19, 2022 Overview A written description of the program and thematic or narrative considerations that were used to shape it Program details Primary alumni contact information: Name, unit, graduation year, email address, and phone number All other performers, clearly identifying other alumni involved Details of each piece to be performed (Composer, work, movement, etc.) Estimated runtime (no longer than one hour) Details of recording or livestreaming setup to be used, if applicable Project details For In-Person Events Stage plot Instrument and equipment needs For Pre-Recorded Events Estimated timeline from selection to submission of the final video Unique considerations or challenges that this particular program or setup may encounter Technological limitations Promotional details Provide any details you can about the promotional activity the primary contact or may provide Provide any details you can about the promotional activity the other participating performers may provide (You may include a breakdown by performer) If you have any other questions regarding the series or submission process, please feel free to reach out to alumni@colburnschool.edu."
