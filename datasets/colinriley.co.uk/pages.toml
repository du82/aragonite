/> Savannah Roberts <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1630353292202-8F8BU6Q3BXA96U69KIDW/Ben+Jarlett.JPG" alt="Ben Jarlett" /> Ben Jarlett <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1630353672015-4GV6YKK8AE1R0H4ASH9Z/Spenser+Buckley.JPG" alt="Spenser Buckley" /> Spenser Buckley #block-yui_3_17_2_1_1630353088174_4835 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1630353088174_4835 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } Savannah Roberts (voice) Elisabeth Nygård (voice) Melanie Pappenheim (voice) Jeremy Avis (voice) Ben See (voice) Kimarné Henry (voice)Benjamin Zephaniah (voice) Daljit Nagra (voice) Georgia Cooke (flute) Andy Hall (trumpet) Mandhira de Saram (violin) Nic Pendlebury (viola) Natalie Rozario (cello) Steve Hackett (electric guitar) Rich Perks (fretless electric guitar) Ruth Goller (bass) Roger King (synth) Colin Riley (piano-organ-cello) Liam Noble (piano) Genevieve Wilkins (percussion) Stephen Hiscock (percussion) Dave Smith (drums) Spenser Buckley (electronic loops and textures) Jeevan Rai (electronic loops and textures) Reuben Kyriakides (electronic textures)James Waterworth (electronic textures)Ben Jarlett (electronic texture)Colin RileyI have always organized musical things. When I was seven this was puppet shows and quizzes for my friends. I formed a string quartet at school when I was thirteen, then a band, an opera company, a festival, and a record label. Many other initiatives followed. I’ve never felt like waiting for the phone to ring. Nowadays this is called curating. This feeling of not being part of any one tribe has what has driven me in my creative work since my upbringing as a classical cellist merged and cross-fertilised with rock, jazz, electronic and folk music. Composing is all I can remember wanting to do, and I am largely self-taught. Isolated Pieces is something that sprung naturally from the relationships I’ve built up over the years with musicians across many genres. I put stuff out and was rewarded with generous trust from everyone involved. I have tried to be as sensitive and generous back, allowing the album to form itself naturally. I also write regularly about composing, teaching and life on my blog Riley Notes. Liam NobleLiam Noble was brought up extremely rapidly by two parents in Bromley, Kent. His interest in music started from age two, when his analyst played him Schoenberg’s “Verklärte Nacht” as light relief from his regression therapy, resulting in the first in a line of prestigious awards – “Patient Of The Year, 1971.” From there it was a short step to Cannonball Adderley, the records of Miles Davis that featured his wives on the front covers, and the exuberant expletives of Jelly Roll Morton’s Library Of Congress recordings. Music and swearing went hand in hand in Noble’s early years, hopelessly splashing through mid period Beethoven sonatas and Chopin Études in a sea of curse and rage. He has since avoided sharps and flats altogether.In a career spanning his entire working life, Noble has worked with a whole roster of international talent that reads like a list of people on a CV. Among them are some that should be singled out for special mention. He continues to practice Bach’s “Goldberg Variations”, in the hope that out of 32, one will eventually come out right.Noble is a sought after educator, holding several negligible posts at major institutions. Teaching can often become repetitive; he has avoided this by teaching only one hour per year at each college. This hour is then taxed at source.Liam Noble’s new solo cd marks a significant departure from his usual way of working, including as it does many of the black notes of the keyboard, which are used in new and surprising combinations. The album has received rave reviews throughout the press, and more are eagerly anticipated when the music is finally released. Mandhira de SaramMandhira loves music, food, sunny days and her newly expanded family (which at the moment takes up every waking moment). Before the lockdowns, she took 6 months off to rest, grow creatively and settle into a new home. Her new home is lovely, but she found resting and finding a fresh creative outlook impossible until the half way through pregnancy and the very end of lockdown! With the help of her husband, she started recording from home and thinking of new approaches to music. Now, with a small baby in tow, she is looking forward to developing new techniques and ideas, and enjoying music as much as she ever did! Mandhira thrives off collaborating, having someone to bounce ideas off, make music with. Over the next year, she plans to get more into working with electronics and tech, get back to gigging with her string quartet, the Ligeti Quartet (when her baby allows) and go on holiday as much as possible. Nic PendelburyNic has spent the whole of his professional life getting people to write music for him. He’s probably done it over three hundred times now either by himself or together with three other note interpreters, quite often convincing other people to pay for it. Some of the notes are captured and then released back into the unknown world of listeners. Maybe you’ve spotified him and his mates doing it? People all over the world have asked him and his band, who trade under the name of Smith (!) incidentally, to bring some of notes to show them and have applauded them for doing so. On occasion he has been known to scribble some notes down himself, as in the case of this album, but usually you’ll find him on the banks of the Thames tending to a new up and coming generation of note interpreters. Natalie RozarioNatalie Rozario plays the cello and sings, and loves doing those things together with other people. Multi-genre is probably the polite way of describing her work life. She started out learning classical music, but her mum had Radio 2 on the whole time, so she grew up loving cheesy pop and easy listening just as much as Tchaikovsky and Stravinsky. She's the cellist you call up when you've got a project that's a bit unusual, like you need a cellist who's happy to lie on the floor and sing (Akram Khan - Ma), or get involved in a bit of physical theatre (Taragano Theatre - Chrysalis), or march around in red stilettos and pretend to knit (Clod Ensemble - Red Ladies), or just improvise and multitask with voice and cello (Gypsy Dreamers band). Natalie has been lucky enough to have played all over the world with some amazing dancers and musicians, but is mostly working in and around London as a freelancer. Ruth GollerRuth Goller, originally from South-tyrol (IT), is based in London and plays electric and double-bass. After winning ‘Bass Player of the Year’ at the London Music School where she studied for one year, she then graduated at Middlesex University with a BA Mus Jazz in 2006 and has since played with many U.K. leading musicians and bands such as punk-jazz outfits Acoustic Ladyland and Melt Yourself Down (Decca), Vula Viel, UK jazz band Let Spin, Mercury-Award nominee Kit Downes, Sarah Gillespie, Chris Montague’s ‘Warmer than Blood’, Josienne Clarke (Rough Trade), Bug Prentice, The Golden Age Of Steam, The Moss Project, Laura Jurd Trio and many more. Ruth has enjoyed a very active performance schedule and has been fortunate to play at many leading Jazz festivals round the world. She recorded for many different artists, such as folk-musician Sam Amidon (and then toured with the live band, featuring Mark Ribot). In conjunction with being an in demand performer, Ruth has a wealth of experience in arrangement and composition for the many varied ensembles she is involved with. Many of her own compositions have also been included covered by other artists, on recording labels such as ECM Records. Over the last 2 years Ruth has been working on her own solo-project called ‘Skylla’ - featuring her own solo bass concept using different tunings for electric bass, alongside singing her own lyrics (the live band also includes extra singers Alice Grant and Lauren Kinsella). Ruth was asked to co- curate the South Tyrol Jazz Festival in 2017, where she devised a programme featuring cutting edge musicians from all over Europe. She has performed with musicians from all over the world and from all different genres - touring the world with Malian singer Rokia Traore and Serbian pianist Bojan Z as well as Iranian Sufi- master Davood Azad and Somali star Aar Maanta. Performance highlights to date have included: Main stage at Glastonbury Festival, Sydney Town Hall, La Cigale in Paris, Royal Festival Hall and the Lincoln Centre in New York. Ruth was part of ‘The African Express’ in 2013 - a tour organised by Damon Albarn, when she has shared a stage with Paul McCartney and John Paul Jones. Ruth also writes a monthly column for the Bass guitar magazine, and is endorsed by Orange Amplifiers. Georgia CookeGeorgia Cooke (1994) is a British flautist and composer, living and working in London, UK. She studied at Trinity Laban Conservatoire of Music and Dance and previously at Brunel University achieving a first-class honours degree in music and the Sheridan Award for Music Performance. She runs The Silver Pencils flute choir, who perform original music (including her own material), and is the flautist in Ensemble Entropy, a free improvisation and graphic score group. You can find out all about Georgia on her website georgiacookemusic.com . Andy HallAndrew Hall is a performer, composer and researcher based in South London. In March 2020 Andy went from performing weekly 3-4 hour shows on the trumpet to suddenly having a very empty diary. The ensuing deconditioning of his brass-playing embouchure led to a variety of new sounds emerging from the trumpet, in which previously secure tones slipped readily into the liminal space between breath and pitch, and where of out-of-practice lip muscles seemed to audibly creak under the pressure of the instrument. This resonated with Andy’s interest in music and physiological processes (which he continues to explore as Music and Sound Research Consultant at Chelsea and Westminster Hospital NHS Trust), and as such became a key area of exploration in the creative work which followed. As well as featuring in his contribution to Isolated Pieces, these ideas and sounds also formed a key part of Atomic, an EP of new electronic music released in 2021 under the pseudonym countif. Steve HackettI always say, “I make a noise for a living”... From the moment I screamed from my cot, I realised I needed to find an outlet, and the guitar was it! As a child, I was mesmerised by a torch which shone either red or green. Each colour for me was equally enthralling. That’s how it is for me with acoustic and electric guitar. The red of electric thrills me, whilst the green of acoustic is balm to the spirit. Everything is like that for me. I hav'''
