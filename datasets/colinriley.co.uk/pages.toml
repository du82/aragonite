["https://colinriley.co.uk/in-place"]
title = "In Place — Colin Riley"
full_description = ''''In Place': An extended multi-media song-cycleThis is exploring a sense of place in the British Isles; how it informs our cultural identity; shapes our language and dialects; provides both solace and stimulation, and contains histories both universal and personal. For more information click on the project website In-PlaceThe song cycle consists of 10 songs. The writers include Robert Macfarlane, Paul Farley, Nick Papadimitrou, Daljit Nagra,, Jackie Morris, Richard Skelton and Autumn Richardson. This provides multiple styles, cultural viewpoints and personal histories from a contemporary perspective. Other elements are woven into the composition; place names, field-recordings, and folksongs. The album was released on 11th May 2017 on the Squeaky Kate label.The April 2021 edition of TEMPO has a feature about the project. Field recording in Cumbria Link to a short film of the premiere at Sound ScotlandA set of videos have also be created in response to songs from the album: Weather Words Half Written Love Letter Warp In The RainMoss Water Over Stone Beneath Above Along LiitaniesLink to a video diary of the Unplugged Scottish Rural Tour October 2018 In Place band rehearsals at Brunel University <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1498745317888-I6ZT7246V52J0MN9XUL3/InPlace3_1440px.jpg" alt="InPlace3_1440px.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1465075533968-J4BHAR1LN4UC7ST2QP81/Mel+P.jpg" alt="Mel P.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1465075612264-I2AWI1TXM1UUPKYELOA4/KH+Galv.jpg" alt="KH Galv.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1465075614956-AWBETP1TZWR9C0BOPYZS/Nic.jpg" alt="Nic.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1465076031479-M5C991KLN4EWKYHQILW0/Goller.jpg" alt="Goller.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1495802792477-259QNEVRTU1GNNMT9TS8/Stephen+Hiscock+pic.jpg" alt="Stephen Hiscock pic.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1465075673599-M5YT49J4UF7IZSYZ25ZL/group+shot+2.jpg" alt="group shot 2.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1465075736872-XROAI96TJXHMWOXU0ATZ/Screen+Shot+2016-05-30+at+12.33.28+%282%29.jpg" alt="Screen Shot 2016-05-30 at 12.33.28 (2).jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1465075625619-S4JKG9TD52RJABTL79B4/COlin+pic.jpg" alt="COlin pic.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1525003800698-KOW2AH3DHW9F169ZF3E0/IMG_7738.jpg" alt="IMG_7738.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1525003816043-EQ0GZ0O54P7POS3V7Q4V/In+PLace+Band.jpg" alt="In PLace Band.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1525003903108-6426ZSVI3D855SXC10VW/IMG_7923.jpg" alt="IMG_7923.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1525003922586-SJW132J6O9J97Q8UUN5J/IMG_7944.jpg" alt="IMG_7944.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1525003934967-P59GUWHGG2ILKELID7QF/IMG_7947.jpg" alt="IMG_7947.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1525003959170-7ZENHEO0F7A6206KMM9U/IMG_7955.jpg" alt="IMG_7955.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1525004044988-JRRXYTLITZQPSS01TGQB/IMG_8102.jpg" alt="IMG_8102.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1525004047692-81AQ1OOT4XORZA2PDCAG/IMG_8214.jpg" alt="IMG_8214.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1525004092394-1NOMEB9CTI1KMJ6XRCFU/IMG_6744.jpg" alt="IMG_6744.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1525004054112-0CQ11XIDBDFGF11NLY53/IMG_5674.jpg" alt="IMG_5674.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1525004498179-UX23HP41QZD3P8MBW4BE/Col+%2B+Anthony+Burguess+poster+2.jpg" alt="Col + Anthony Burguess poster 2.jpg" /> Colin Riley composer (Moov/Homemade Orchestra)Melanie Pappenheim voice (DV8/The Shout/Damon Albarn)Nic Pendlebury viola (Smith Quartet/Steve Reich/Django Bates/Pulp)Kate Halsall piano/keys (Michael Clarke/Ockham’s Razor/GalvanizeStephen Hiscock percussion (Ensemble Bash/Steve Reich/Nitin Sawhney))Ruth Goller electric bass (Melt Yourself Down/Let Spin/Gufo)There are also 3 programmes/podcasts for Resonance FM featuring interviews with the writers, additional field recordings, background to the songs, and a selection of related songs chosen by Colin Riley.Programme 1: It Does Noting, Absolutely Nothing But Be ItselfProgramme 2: Grafted LandscapesProgramme 3: Solid Breakfasts and Gloomy Sundays, Smoky Towns and Winding Roads, Green Fields and Red Pillar-BoxesThis project has come about through the collision of several strands: a) the word-hoard of Robert Macfarlane’s book ‘Landmarks’ (2015), a glossary of lost words which invite closer observation of the landscapes around us; b) an interest in making use of regional dialect; c) the merging of field recording (sounds from the natural world, urban environments and personal conversations) with scored music; d) the collage of disparate texts; e) an interest in psychogeography and walking through unusual terrain; f) the extension of the song-form.This project has be commissioned by Sound Festival Scotland . It is funded by the Arts Council of England and through the PRS for Music Foundation's 'Beyond Borders' programme which is a commissioning and touring programme run in partnership with Creative Scotland, Arts Council Wales, Arts Council of Northern Ireland / An Chomhairle Ealaion. ‘A bewitching, dynamic soundscape’ (Robert Macfarlane)“An album of rare delicacy. Mysteriously melancholic, inviting, languorous.” (Bill Bruford)"An engaging and captivating experience. You could hear that music many times and always be finding new things within it." (Kit Downes)“A fascinating collection of sounds and words, depicting place and all its space with beautiful tranquillity.” (Fay Hield)Review 1Review 2 A bit of backgroundA place can make you feel many things. There is something very powerful about the intersection of a particular location and our moment in it. Places are constantly renewed in unexpected ways by changing conditions; weather, seasons, times of day, the company we keep, sounds and smells, and the surrounding culture.I have always been fascinated with the idea that layers of history leave contours and traces of those who have been inthe same space before us. I love the way that ruins and industrial relics act as signs to how different a place would have been in a previous time and my walks often involve tracing the routes of disused railways, canals and ancient tracks.Through these songs I aim to steer a listener’s attention to the smaller details. In an age when there is ubiquitous use of headphones and a consumption of musicas a commodity or mood-enhancer, I feelmy role as a composer is to reclaim a more mindful listening mode. Discovering Robert Macfarlane’s recent book Landmarks, which reconnects us via lost words to a keener sense of seeing, was a catalyst for the project. It brought together my ideas about a sense of place and my hopes for keener musical listening.In Place is a gathering together of feelings, associations, geographical details, regional identities, dialects, place names, personal memories, imagined routes, and historical connections. To help in this I have commissioned new texts from a broad range of writers for whom a sense of place is very much at the core of their work. These, along with a scattering of various existing texts, have become the lyrics for the songs, enabling the piece to be diverse, multi-dimensional and hopefully, unexpected. Some blogs from Riley Notes about the creation of In PlaceThe Sheep and the Penhttp://colin-riley.blogspot.co.uk/2017/08/the-sheep-and-pen.htmlTaking Placehttp://colin-riley.blogspot.co.uk/2017/07/taking-place.htmlWaking Into The Piecehttp://colin-riley.blogspot.co.uk/2017/01/walking-into-piece.htmlShelfiehttp://colin-riley.blogspot.co.uk/2017/01/shelfie.htmlMaybe I’ve Aways Been A Psychogeographerhttp://colin-riley.blogspot.co.uk/2016/04/maybe-ive-always-been-psychogeographer.htmlFalling Into Placehttp://colin-riley.blogspot.co.uk/2016/03/falling-into-place.htmlOver The Hills and Far Awayhttp://colin-riley.blogspot.co.uk/2016/03/over-hills-and-far-away_16.htmlFollowing The Footstepshttp://colin-riley.blogspot.co.uk/2015/12/following-footsteps.html'''
year_published = 2017
year_updated = 2017
