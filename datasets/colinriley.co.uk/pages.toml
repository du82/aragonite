full_description = '''<img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1632819771525-LS3QP6KVON8LEAG10UND/Colin+with+Stream-Shine+score.jpg" alt="Colin with Stream-Shine score.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1670095254664-T3E6UOIA07MFQX2PMHYV/309199406_10209901395007632_3746519579532415143_n.jpg" alt="309199406_10209901395007632_3746519579532415143_n.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1568729397815-N908QJZ1XAHG5KH906AY/CR_007_2018.jpg" alt="CR_007_2018.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1628977425398-7OJKZRXX70RLW04YJN9X/cello+b+w+1.jpeg" alt="cello b w 1.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1444232387221-2CFTO1AO6HK6SX7KZRH8/Col+at+piano+cropped.JPG" alt="Col at piano cropped.JPG" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1568729447676-U2HTBCC6SMBKX41ALM9B/COL%2BPR%2BPIC.jpg" alt="COL+PR+PIC.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1628975590711-A789UT1CKN0K9C9XNC1C/IMG_0060.jpeg" alt="IMG_0060.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1444232536292-MGQ75AV1X6S6DYP75PKG/GOOD+ONE+OF+ME+TEACHING.jpg" alt="GOOD ONE OF ME TEACHING.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1704295281393-9JKO5EIMDKH27MS5FDFP/THP_2642_QuickProof+v1_1.jpeg" alt="THP_2642_QuickProof v1_1.jpeg" /> 'Wry, understated and slightly bonkers’ (Guardian) ‘An atavistic soul and a composer of amiable eccentricity’ (Daily Telegraph) Riley Notes Colin Riley ‘doffs his cap to the contemporary classical genre but also manages to stand alone in that genre as a unique indie voice’ (BBC Radio). His music draws on a range of elements including new technologies, improvisation, song-writing and large-scale classical form. His recent albums include Shenanigans (NMC) and In Place (Squeaky Kate). Other works include Warp and Weft a concerto for 2 cellos (Gabriella Swallow / Guy Johnston), Rock Paper Scissors (Ensemble Bash), Stream-Shine (Philippa Mo) and Earth Voices (Helsingborg Symphony Orchestra, Sweden). Hearing Places, his large-scale multi-media piece was recently premiered by the BBC National Orchestra of Wales to excellent reviews. ‘Witty, inventive music of ear-tickling inventiveness’ (Daily Telegraph). Colin is developing a multi-media project Ludic Inventions for piano and live visuals, a new string quartet for the RIOT Ensemble harnessing AI and the song of the blackbird, as well as a new album for Melanie Pappenheim. He has also just finished the music for COMA2020, a film by Michael Rosen, a piece for tabla player Kuljit Bhamra, and music for an installation at the Cutty Sark, London in collaboration with Nic Pendlebury. He is Reader in Composition at Brunel University, runs his own label Squeaky Kate and writes a regular blog about composing called Riley Notes. Colin is also on Music Patron and a member of the Place Collective.'''
year_published = 1994
year_updated = 2014
clearnet = "https://colinriley.co.uk/about"
