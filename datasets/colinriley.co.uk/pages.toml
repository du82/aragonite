["https://colinriley.co.uk/news"]
title = "NEWS — Colin Riley"
full_description = '''Latest news <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1737897283519-EOXTOGR6IOEWX792HEZT/image-asset.jpeg" alt="Wonderful to have my complete piano works in Forsyths music shop, Manchester. This was the place I spent so many Saturday afternoons as a teenager, looking at sheet music LPs, and manuscript paper. #forsyths #pianomusic #composersedition #musicpatron" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1737480233201-KL75JQN46LVJ6OIWEUAD/image-asset.jpeg" alt="January's song from The Year Round is released today. 'Somewhere Else' is a melancholy song about crows with the haunting voice of #melaniepappenheim Video to watch on my You Tube channel. Audio to listen to/buy on my Bandcamp. Linktree (above) fo" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1737475957395-6PNGA4QGRG5WGMFO8AVQ/image-asset.jpeg" alt="What a lovely bunch of piano students at the RNCM. Thanks for rehearsing all 16 pieces that make up 'Memory Leaves'. Huge thanks also to @adam.swayne.piano for making this happen. Looking forward to the premiere 6.30pm, Friday 24th at Forsyths, Manch" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1737475957395-H9QSQSLS8URJ4MQ8F2HO/image-asset.jpeg" alt="Reflecting on all this beauty. #conistonfells" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1737475957395-LAR9U1I28NXCVOMZBEU4/image-asset.jpeg" alt="I just looked out of the front door! #awe #nature" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1737475957395-P0BYD815BI99FS3QO67Q/image-asset.jpeg" alt="Today&amp;rsquo;s walk. #snow #mountains" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1737475957395-359Z91WEBDAL1E0HSBOL/image-asset.jpeg" alt="An inspiring spot. #hampsfell" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1737475957395-FLJ9XS2MV9O9U662NM9J/image-asset.jpeg" alt="Looking out into 2025." /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1737475957395-6V8BXJL7DUZRFHJX49KH/image-asset.jpeg" alt="Tomorrow is the Winter Solstice My song 'The Years Midnight' will be premiered on Radio 3 at 11pm. I hope you can listen in." /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1731966628228-3EL8XQOFEY57B1EYRAD6/image-asset.jpeg" alt="Fabulous to have alumni students back to provide wisdom to the next generation. #musicbrunel #brunel #brunelmusic I&amp;rsquo;ll" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1731599519896-A4OO66Z3C5N3YR1T52NB/image-asset.jpeg" alt="Foggy morning. #quiet" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1731464582875-HF8V0PENSX5W12J6ZEYY/image-asset.jpeg" alt="" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1731436623993-JVIX83CJVXY6UA0CVFZJ/image-asset.jpeg" alt="Tonight&amp;rsquo;s set up. With &amp;lsquo;figureheads&amp;rsquo; looking on. #cuttysark" /> #block-yui_3_17_2_1_1729194006478_14377 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1729194006478_14377 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; }'''
