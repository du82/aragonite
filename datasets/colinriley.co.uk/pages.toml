["https://colinriley.co.uk/the-year-round"]
title = "The Year Round — Colin Riley"
full_description = "THE YEAR ROUND “When we think ‘Time’ it sounds monolithic, uniform, the thing that takes us inexorably from the cradle to the grave in an unbroken line, straight as a Roman road. It stretches unimaginably far behind and ahead of us, framing our brief appearance. But when you look more closely, you see how complex it is – how its many strands weave together and sometime fray apart. We humans have our own cyclical renewals, physically and emotionally, never twice the same as we move through the days, weeks, months and seasons of each succeeding year. Our cells replace themselves; we find ourselves in the light again after long spiritual darkness. Like elderberry wine that starts re-fermenting at the time of year the berries first ripened and were picked, our bodies remember the seasons and dance to their rhythms in ways we can sometimes articulate, but more often cannot. (Pippa Marland) ” — With kind permission of the author and Hodder and Stoughton, extract taken from Gifts of Gravity and Light' Seasonal and Circadian SongsAll around us we are bombarded by loud noises, grandiose statements, and exaggerated hype. Co-existing with these are the smaller things; quiet, unique, and beautiful. Natural elements that keep 'singing' unselfconsciously. The Year Round is a celebration of these too-easily unnoticed things. A deep connection that we cannot afford to lose.I shall be releasing a song every month, each reflecting on that specific time of year. Each is a setting of poetry and prose by a broad range of writers. This words and music meditate on light and dark, the seasons, weather, place, and our relationship with the natural world and its rhythms. The words are sung by the unique Melanie Pappenheim with several guest musicians sprinkled in.On the shortest day of the year (the Winter Solstice) the journey of my new album begins.Album tracks available hereVideos <img src=\"https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1733594202570-WIQZP7N8T6OQ0BX3XPIJ/Col+and+Tarn+%28black+and+White%29.JPG\" alt=\"Col and Tarn (black and White).JPG\" /> <img src=\"https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1733594241962-8FK9R2H0DKIB0H480DZU/IMG_7745.jpeg\" alt=\"IMG_7745.jpeg\" /> <img src=\"https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1733769298433-BGQWI1SK0XC62EORD4FX/IMG_8257.jpeg\" alt=\"IMG_8257.jpeg\" /> <img src=\"https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1733769354867-1POFK6P6XITIXUJ0H0Z8/IMG_6687.jpeg\" alt=\"IMG_6687.jpeg\" /> <img src=\"https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1733769549533-GG28T3M4PLDEDUMSRXXU/IMG_5928.jpeg\" alt=\"IMG_5928.jpeg\" /> <img src=\"https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1733769454101-Z1VG5Y6SA0XCHAHYTMIC/IMG_6408.jpeg\" alt=\"IMG_6408.jpeg\" /> <img src=\"https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1733769636397-ZO7KCG1TFZYR8VQ2QPEI/Screen+Shot+2020-11-15+at+12.18.18.jpeg\" alt=\"Screen Shot 2020-11-15 at 12.18.18.jpeg\" /> <img src=\"https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1733769735290-M3MMFEDAUDY8V1NNFRAO/IMG_1480.JPG\" alt=\"IMG_1480.JPG\" /> <img src=\"https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1733769816408-UF60HN1EW6UAROJCTWTK/IMG_1464.JPG\" alt=\"IMG_1464.JPG\" /> <img src=\"https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1733769845648-3483OG5BLDU32KUL2L6T/IMG_1410.JPG\" alt=\"IMG_1410.JPG\" /> <img src=\"https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1733769899645-J52GON44SJ8E2AE7582U/IMG_4333.JPG\" alt=\"IMG_4333.JPG\" /> <img src=\"https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1733770003505-KTYAGCGXH83R8545K55T/IMG_3285.JPG\" alt=\"IMG_3285.JPG\" /> #block-yui_3_17_2_1_1732810997298_109177 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -20px; } #block-yui_3_17_2_1_1732810997298_109177 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 20px; margin-bottom: 20px; } #block-e5628489e612d337d35b .social-icons-style-border .sqs-svg-icon--wrapper { box-shadow: 0 0 0 2px inset; border: none; } “If there were no tilt, and the earth spun straight, every day would be an equinox: twelve hours of daylight and twelve hours of darkness all the year round. It would be hotter and colder, according to latitude, but there’d be no spring, no winter, no monsoon, no hibernation, no first flowerings. No deciduous leaf-shed, no life-cycle as we commonly understand it. (Anita Roy)” — With kind permission of the author and Hodder and Stoughton, extract taken from Gifts of Gravity and Light'"
