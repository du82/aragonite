["https://colinriley.co.uk/hearing-places"]
title = "Hearing Places — Colin Riley"
description = """
All information about Colin Riley’s 7-movement work for orchestra. 
Commissioned by BBC Radio 3 and premiered by the BBC National Orchestra of 
Wales."""
full_description = '<img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1712415245164-6LA8U2VAZZAS81562JZP/Screenshot+2024-04-05+at+20.31.04.png" alt="Screenshot 2024-04-05 at 20.31.04.png" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1712415157362-ZR1BS98KL2MRO2ARD693/Screenshot+2024-04-05+at+20.30.01.png" alt="Screenshot 2024-04-05 at 20.30.01.png" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1712415233314-L2EATKRSQDZ977R8247Y/Screenshot+2024-04-05+at+20.31.16.png" alt="Screenshot 2024-04-05 at 20.31.16.png" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1712415240588-L60TMM5TOCT4P6RDVORO/Screenshot+2024-04-05+at+20.30.49.png" alt="Screenshot 2024-04-05 at 20.30.49.png" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1712415203591-YPPF9U88QD84V4EDNEMH/Screenshot+2024-04-05+at+20.30.20.png" alt="Screenshot 2024-04-05 at 20.30.20.png" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1712415147215-SDJA86TFTP20UMT2MM6D/Screenshot+2024-04-05+at+20.31.53.png" alt="Screenshot 2024-04-05 at 20.31.53.png" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1712415124177-EJ1CNHHKLXHC05TWSI44/Screenshot+2024-04-05+at+20.32.09.png" alt="Screenshot 2024-04-05 at 20.32.09.png" /> #block-yui_3_17_2_1_1712415095127_4208 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -6px; } #block-yui_3_17_2_1_1712415095127_4208 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 6px; margin-bottom: 6px; } Hearing Places is a 7-movement work for large orchestra. It uses field recordings as the starting point for a set of tone poems, integrating the recordings (and video footage) into the fabric of the music. I. Steel and Steam II. Wind Clatter III. Pale Rain With Birds IV. Out of the Machinery V. Water Songs VI. Hive VII. Winter Sunrise VIDEO EXTRACTS SCORE “An atavistic soul … the whole thing glowed … what you might not expect was the humour.” (Ivan Hewett - Daily Telegraph)“An exhortation to listen … a powerful seven-movement ode … celebratory and mournful” (Rian Evans - Guardian) In Hearing Places I am aiming for a new kind of symphonic experience, one that involves immersive listening and a way of sharing in the noticing of often inconsequential, yet hugely beautiful sounds. The music aims to capture both the fragility and the massive power of our world, and to illustrate simply what we stand to lose in the environment crisis we are now in. I hope that, by noticing our surroundings, we can begin to value our world more. Natural elements are frequently referenced in the music (weather, times of day, natural phenomena and the changing seasons), as are the human imprints left on our world (machinery, vehicles, pattern-making, conversation). Hearing Places celebrates the rich audio and visual patterns found all around us: I’ve spent the last year travelling to all corners of Wales collecting field recordings and video clips of interesting places; universal and deeply emotive. The small building blocks of pitch, rhythm and pattern then became the materials for the creation of the music itself. Sometimes I adopted a natural emotional response in terms of mood and feeling, while at others my approach was more forensic. The audio forms a strand of the orchestral fabric, woven differently in each movement, and is ‘played’ from within the orchestra (as are the video clips) by the keyboard player. I Steel and SteamThe might of this huge industrial structure set against the sky forms one element of the music. The ever-changing clouds of steam emitted from the chimneys forms the other. The music is a fusion of these two elements: everything grows inexorably from the low rumble of the factory, captured in the fading evening light. 2 Wind RattleThe capricious clangs and rattles from moored boats in a harbour create a sound that has fascinated me for some time. The rhythms are intoxicating and yet random. These sounds will have been heard through the centuries and represent a poetic intervention of humans in the landscape – weather and technology in a kind of musical marriage, if you like. T 3 Pale Rain with Birds On a wet afternoon I visited the Dylan Thomas writing hut in Laugharne that looks down on the shifting panorama of the Tâf estuary. An estuary is a point of constant comings and goings – tides, gatherings of birds and weather conditions. In ‘Poem in October’ Thomas describes the melancholy sounds from the harbour and the neighbouring wood: sounds of seagulls, rooks, blackbird and larks. ‘Pale rain over the dwindling harbour and over the sea wet church’. I took my title for this movement from a line of this poem, as it seemed to be the kind of title for a painting: this music is like a slow-moving painting. 4 Out of the Machinery Here the whole orchestra becomes a giant rhythm section, and through four passages of interwoven grooves the music builds, forming increasingly tightly knitted and energised textures. It was important for me to break down the complex machinery of the woollen mill, with its shuttles, cogs and wheels, into tiny individual blocks of audio Lego. From here I could then rebuild the machine into a reimagined version of itself. Similarly, small video images of the mechanisms are playfully woven to form a funky visual component. 5 Water Songs If you sit quietly within nature, gradually it comes to you. The details become more acute and you seem to absorb all manner of sights, sounds, smells and feelings. The sound of a stream has been the source of inspiration for many composers over centuries. This musical meditation draws attention to the tiny hidden repeating melodies that you can often hear inside the sound of the trickles and eddies, if you take the time to listen. 6 Hive After just a few minutes standing in a busy place where all around you is in a constant state of motion and busyness, you become somehow absorbed into the place. Your own stillness is accentuated by the ‘hive of activity’ around you. I was fortunate to have the opportunity to look down on Central Square in Cardiff from high up. This revealed to me the grid system of the square heightening the sense of those walking across it being in a kind of game of pathways, traces and collisions. It’s a beautiful happenstance, and the interconnectedness of us all is there every day of the week, if we care to notice it. Recordings of everyday conversations collide with the sounds of bikes, skateboards, building site drills and car horns to form a sound-picture of the heart of Cardiff. 7 Winter Sunrise There is something about the sounds of birds and bells that have deep emotional resonance for us. In their very different ways they chime with a deep melancholy, but also a strong sense of hope. This final movement brings together these two elements in a journey from dark stillness to a rapturous outpouring of light and joy. As with many of the pieces that make up this suite, the music is transformed from the small to the large, reflecting something of our beautiful insignificance in time and space. My thanks to: Jeevan Rai for designing/programming the keyboard patches and for his additional sonic processing and manipulation, Anna Grime for allowing the recording and filming at Solva Woollen Mill, Peter Furniss for guiding me up the bell towers of Ruthin, the North Wales Association of Church Bell Ringers for their support and knowledge., and Yusef Bastawy at BBC NOW for filming with me in Cardiff Central Square. I have written several blogs about the process of creating Hearing Places: One Man and his Sock In Search of Sights, Sounds And Smells“Bring some overalls and a torch. You’ll need them.”This is a Big Deal for MeMelancholy MoodDaily Telegraph Review - BBC National Orchestra of Wales, Wales Millennium Centre, Cardiff ★★★★☆“Occasionally nowadays an atavistic soul comes along who wants to put music back in touch with its ancient roots in wind, birdsong, and splashing water. One such is Colin Riley, a composer of amiable eccentricity who’s written works with titles like Rock Paper Scissors and Earth Voices. His latest opus Hearing Places, premiered by the BBC National Orchestra of Wales on Friday, is rooted in the sounds he recorded during a year’s ramble across Wales – though not all of the sounds were primordial. He also recorded the clattering of the Solva Woollen Mill in Pembrokeshire, the vast hum of the Port Talbot Steelworks, and the knocking of small boats in Porthmadog harbour. All these, plus tricking water in the Brecon Beacons and birds and bells in Denbighshire, were each allotted a movement in Earth Voices. On a screen above the orchestra video images of the locale appeared, while the players engaged in a dialogue with the sounds, often beginning in a very modest way – a lone tuba imitating a foghorn here, a twitter of birds in the woodwind there – and then took on a poetically suggestive musical life of their own. That sort of response you might expect; what you might not expect was the humour of the piece, as in the second movement where the rattling of moored boats and seagulls’ cries prompted a dance of slouching not-quite-jazzy elegance. The whole thing glowed in this performance by the BBC Now under the intelligent baton of Matthew Coorey.” <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1712338479313-9G4FZSY1UQV6VSQ4LHW4/WALES+SCFREENSHOT.png" alt="WALES SCFREENSHOT.png" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1712338523851-H3AR7RG4QCDHY28OQQ0F/Millenium+Hall+Cardiff+-+arriving+for+first+rehearsal.jpeg" alt="Millenium Hall Cardiff - arriving for first rehearsal.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1712338538098-QR7708A2WT5N8JMPHX0E/Moon+over+the+hills+-+Ruthin.jpeg" alt="Moon over the hills - Ruthin.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1712338565500-KYY5CMCPM7YQ4624Z6E5/Laugharne+in+the+rain.jpeg" alt="Laugharne in the rain.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1712338590549-4GF6C3M254C4CZXZJ5QJ/Radnorshire+2.jpeg" alt="Radnorshire 2.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1712338605606-H85RZ7MW24XBS6QW19KS/Cardiff+Station.jpeg" alt="Cardiff Station.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1712338618316-3QRZWKRWRUAN47TA4B8S/Driving+into+Wales.jpeg" alt="Driving into Wales.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1712338637577-MUKHSKYEHZ66BWBV6D3M/Conwy.jpeg" alt="Conwy.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1712338654225-PQVQA6UM1PTHOAFWG17Z/Filming+Porthmadog+harbour+.jpeg" alt="Filming Porthmadog harbour .jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1712338673178-2E3O7AEMF1Y6NAICUTD1/Llanfwrog+church+2.jpeg" alt="Llanfwrog church 2.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1712338686306-P582KSL88E69DF0QJVMF/Colin+with+ear-defenders+St+Peters+Ruthin.jpeg" alt="Colin with ear-defenders St Peters Ruthin.jpeg" /> <img src="https://images.squarespace-cdn.com/content/v1/55999469e4b0386248d79c21/1712338704482-SA8QTB8WH8G19D89JO45/Pembrokeshire+Beach.jpg" alt="Pembrokeshire Beach.jpg" /> #block-yui_3_17_2_1_1712338232320_20473 .sqs-gallery-block-grid .sqs-gallery-design-grid { margin-right: -7px; } #block-yui_3_17_2_1_1712338232320_20473 .sqs-gallery-block-grid .sqs-gallery-design-grid-slide .margin-wrapper { margin-right: 7px; margin-bottom: 7px; }'
