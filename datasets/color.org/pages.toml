["http://www.color.org/DevCon/devcon2020"]
title = "ICC DevCon 2020: The Future of Color Management"
description = "The International Color Consortium....promoting and encouraging the standardization of an open color management system"
full_description = '''International Color Consortium Developers Conference "ICC DevCon 2020" had the theme 'The Future of Color Management. It was held on-line as a series of six webinars during November 2020 and January 2021. DevCon2020 included talks from international researchers, presentations from ICC members on implementing advanced colour management solutions, and an extended hands-on workshop on using iccMAX. Full program details including abstracts of talks and speaker details are here. Links to the recordings of each session will be posted below. With the publication in 2019 of ISO 20677, ICC's next-generation colour management architecture, the stage is set for a major rethink of colour management. In response to new hardware technology and new user requirements, researchers and developers have been working on colour management solutions that aim to quantify and reproduce visual appearance beyond the diffuse, 2D colorimetry supported in ICC v4. New developments are arising in the measurement and modelling of appearance, in lighting and display technology, the production of complex gonio-chromatic surface effects, combined with with a move towards colour matching for individual observers instead of a 'one colour fits all' approach. ICC DevCon 2020 focused on these new and emerging developments and how they can be implemented in a colour managed workflow. ICC invited presentations on recent work on topics including HDR imaging, BRDF (and other directional models of appearance), colorimetric observers and illuminants, measurement and modelling of appearance, the reproduction of complex surface properties such as gonio-chromatism, fluorescence and texture. It also focused on key application areas of the future, such as multi-colour 2D and 3D printing, cultural heritage, and web and broadcast imaging. Color Management in the 21st Century Danny Rich, Sun Chemical (a division of Dainippon Ink and Printing) Led by Max Derhak, the initial contributor and maintainer of the iccMAX reference implementation, RefIccMAX. These sessions will include hands-on participation.'''
year_published = 2025
clearnet = "http://www.color.org/DevCon/devcon2020"
