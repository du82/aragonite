["https://www.colorado.gov/governor/news"]
title = "Press Releases | Colorado Governor Jared Polis"
full_description = '''Press Releases Monday, March 3, 2025 Governor Polis: Trump’s Tariff Tax will Raise Costs For All DENVER - President Trump plans to implement a new 25% tax on hardworking Americans through his disastrous tariff tax. Monday, March 3, 2025 DOLA’s Division of Property Taxation Encourages Eligible Colorado Seniors to Take Advantage of the 2025-26 Qualified Senior Primary Residential Classification Property Tax Reduction STATEWIDE – The Qualified Senior Primary Residential Classification program is available for tax years 2025 and 2026. This allows property owners who moved between January 1, 2020 and December 31, 2025, and lost their Senior Property Tax Exemption, or those who plan to move in 2025 and would lose the exemption, to retain the property tax reduction for their new primary residence for 2025 and 2026. Monday, March 3, 2025 Governor Polis Urges Trump Administration to Comply with Court Order, Demands Public Safety Funding to Be Distributed to Colorado per Court Order DENVER - The Trump administration’s freeze on Homeland Security Grants allocated for Colorado could make the state less safe. The Temporary Restraining Order (TRO), issued by the United States District Court, clearly prohibits the federal government from pausing, freezing, or otherwise impeding the disbursement of federal financial assistance to the states. Nonetheless, the administration continues to stop paying for important programs like State and Local Cyber Security, Targeted Violence and Terrorism Prevention Grant Program, Urban Area Security Initiative, and the Nonprofit Security Grant Program (NSGP). The Trump administration is withholding this funding from organizations that are implementing much-needed safety measures. The federal government promised Colorado $69.5 million in public safety grants. The state will do everything it can to bridge the gap in funding and ensure that it receives the funds Congress authorized for communities throughout Colorado. Friday, February 28, 2025 Governor Polis: Colorado Continues to Stand with Ukraine DENVER - Colorado Governor Jared Polis released a statement following President Trump and Vice-President Vance’s chaotic meeting with Ukrainian President Volodymyr Zelensky. Thursday, February 27, 2025 Governor Polis Signs First Bill of Legislative Session into Law Strengthening Colorado's Healthcare Workforce DENVER - Today, Governor Polis signed bipartisan HB25-1022 - Qualified Medication Administration Personnel, sponsored by Representatives Cecelia Espenoza and Karen McCormick, and Senators Dafna Michaelson Jenet and Janice Rich. The bill helps expand qualifications for healthcare professionals and strengthen Colorado's healthcare workforce. Wednesday, February 26, 2025 Governor Polis, The Department of Natural Resources, Colorado Strategic Wildfire Action Program invests $8.4 million in 19 New Wildfire Mitigation Projects DENVER - Today, Governor Polis and the Colorado Department of Natural Resources (DNR) announced today $8.4 million through the Colorado Strategic Wildfire Action Program (COSWAP), which accelerates forest restoration and wildfire risk reduction through targeted projects that protect communities, watersheds and critical infrastructure. Tuesday, February 25, 2025 Governor Polis in Washington Pushing Congress to Reject Harmful Medicaid Cuts WASHINGTON DC – While in Washington DC, Colorado Governor Jared Polis spoke with Members of Congress today, urging them to reject the proposed $880 billion dollar proposed cuts to Medicaid which would be devastating for hardworking Coloradans, rural hospitals, and safety net providers. Roughly 1.3 million Colorado children and adults are enrolled in Medicaid and the Child Health Plan Plus, which are funded jointly by the state and federal government. Tuesday, February 25, 2025 Polis Administration Ready To Help Federal Workers Impacted by Nationwide Layoffs With approximately 57,000 federal workers in Colorado, many may be eligible for various support through Colorado’s Statewide Workforce System Monday, February 24, 2025 Colorado Airports Contribute $68.9 Billion Annually to State’s Economy WATKINS, CO –The Colorado Department of Transportation's (CDOT) Division of Aeronautics is pleased to announce the results of the 2025 Colorado Aviation Economic Impact Study (CEIS). This comprehensive study aims to quantify the economic contributions of airports across the state, updating the previous analysis conducted in 2020. Monday, February 24, 2025 Governor Polis Orders Flags to Half Staff To Honor Former Representative Rod Bockenfeld DENVER - Governor Polis ordered flags to fly at half-staff from sunrise until sunset tomorrow, February 25th, 2025, to honor Former Representative Rod Bockenfeld. "Today, I join many across the state to honor the life of Former Representative Rod Bockenfeld. I am thankful for Rep. Bockenfeld's commitment to his district and his thoughtful approach to his legislative work, including during his time at the Joint Budget Committee. My thoughts are with the Bockenfeld family and I hope they find comfort in their community during this difficult time." Pagination Current page 1 Page 2 Page 3 Page 4 Page 5 Page 6 Page 7 Page 8 Page 9 … Next page Next ›'''
year_published = 2025
