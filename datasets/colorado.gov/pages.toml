["https://colorado.gov/accessibility-standards"]
title = "Accessibility Standards | colorado.gov"
description = "Accessibility Statement Colorado.gov is committed to providing equitable access to our services to all Coloradans. Our ongoing accessibility effort works towards being in line with the Web Content Accessibility Guidelines (WCAG) version 2.1, level AA criteria. These guidelines not only help make technology accessible to users with sensory, cognitive and mobility disabilities, but ultimately to all users, regardless of ability. Our efforts are just part of a meaningful change in making services inclusive and accessible."
full_description = 'Accessibility Statement Colorado.gov is committed to providing equitable access to our services to all Coloradans. Our ongoing accessibility effort works towards being in line with the Web Content Accessibility Guidelines (WCAG) version 2.1, level AA criteria. These guidelines not only help make technology accessible to users with sensory, cognitive and mobility disabilities, but ultimately to all users, regardless of ability. Our efforts are just part of a meaningful change in making services inclusive and accessible. We welcome comments on how to improve our technology’s accessibility for users with disabilities and for requests for accommodations on Colorado.gov. References: Colorado Information Security Policies (CISPs) Section 508 of the U.S. Rehabilitation Act of 1973 C.R.S. 24-85-104, ARTICLE 85. "Information Technology Access For Individuals Who Are Blind Or Visually Impaired" HB21-1110 - “Colorado Laws For Persons With Disabilities” SB23-244 - “Updates to Technology Accessibility” - Includes rulemaking abilities in OIT for accessibility Worldwide Web Consortium Web Content Accessibility Guidelines 2.1 Level A and AA Accessibility Feedback and Accommodation If you have any questions, need to submit feedback, or need to request reasonable accommodations, please contact us. Email: support@www.colorado.gov Phone: (303) 534-3468 In order to respond in a manner most helpful to you, please provide as much detail as possible, including: The nature of the accessibility feedback or request The URL (web address) of the page or pages in question The specific information sought, and The individual’s email address or phone number for a response Voluntary Product Accessibility Template (VPAT) for Colorado.gov Content Management System (CMS) Component Library The Voluntary Product Accessibility Template (VPAT) outlines how the CMS component library complies with key accessibility standards, such as Web Content Accessibility Guidelines (WCAG 2.1 and 2.2 A and AA). The VPAT is available to help you assess the accessibility of the Colorado.gov CMS component library.'
