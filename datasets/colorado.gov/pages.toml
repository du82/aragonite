["https://www.colorado.gov/governor/news/dolas-division-property-taxation-encourages-eligible-colorado-seniors-take-advantage-2025-26"]
title = "DOLA’s Division of Property Taxation Encourages Eligible Colorado Seniors to Take Advantage of the 2025-26 Qualified Senior Primary Residential Classification Property Tax Reduction | Colorado Governor Jared Polis"
description = "STATEWIDE – The Qualified Senior Primary Residential Classification program is available for tax years 2025 and 2026. This allows property owners who moved between January 1, 2020 and December 31, 2025, and lost their Senior Property Tax Exemption, or those who plan to move in 2025 and would lose the exemption, to retain the property tax reduction for their new primary residence for 2025 and 2026."
full_description = "DOLA’s Division of Property Taxation Encourages Eligible Colorado Seniors to Take Advantage of the 2025-26 Qualified Senior Primary Residential Classification Property Tax Reduction Monday, March 3, 2025 The deadline is March 15 in the year the taxpayer is applyingSTATEWIDE – The Qualified Senior Primary Residential Classification program is available for tax years 2025 and 2026. This allows property owners who moved between January 1, 2020 and December 31, 2025, and lost their Senior Property Tax Exemption, or those who plan to move in 2025 and would lose the exemption, to retain the property tax reduction for their new primary residence for 2025 and 2026.“This is a great step in making sure Colorado's aging population can keep more of their hard-earned money, and enjoy retirement. Our administration is committed to lowering property taxes for all Coloradans so small businesses and homeowners can thrive,” said Governor Polis.For those who qualify, fifty percent (50%) percent of the first $200,000 in actual value of their primary residence real property will not be taxed unless it causes the assessed value to drop below $1,000. The classification applies to owner-occupied primary residential property, including single-family or multi-family residences, condos, townhomes or duplexes.“At DOLA, we aim to make complicated processes simpler for all Coloradans, including seniors choosing to retire here in Colorado,” said Maria De Cambra, DOLA Executive Director. “Our staff is available to answer questions about the Qualified Senior Primary Residential Classification program to make sure eligible seniors are not losing this property tax reduction.”ELIGIBILITY – A property owner must have previously qualified for, and received, the Senior Property Tax Exemption as of January 1, 2020, or later. If that exemption was removed, or will be, due to a change in the owner-occupier’s primary residence, then the new primary residence may qualify for this classification for tax years 2025 and/or 2026. There is also eligibility for a surviving spouse under certain conditions, and there are no income limits for this exemption.Applicants must complete the Qualified Senior Primary Residence Classification application and submit it by mail, or in person, to the county assessor of the county in which the property is located by March 15. Late applications will be accepted until July 15, however late-filing applicants forfeit their right to appeal if the classification is denied.Applications and instructions are available on the Division of Property Taxation website or at the county assessor of the county in which the property is located.The property tax reduction will be reflected on the tax bill received from the county treasurer in the year following the application.The Qualified Senior Primary Residential Classification should not be confused with programs creating tax credits tied to income tax returns or rebates managed by the Colorado Department of Revenue.Colorado seniors can contact their local county assessor for questions regarding eligibility or the application. For questions about the program, contact the Department of Local Affairs (DOLA’s) Division of Property Taxation, at dola_dpt_frontdesk@state.co.us.###"
year_published = 2025
clearnet = "https://www.colorado.gov/governor/news/dolas-division-property-taxation-encourages-eligible-colorado-seniors-take-advantage-2025-26"
tags = ["2025-26", "administration", "advantage", "aging", "answer", "available", "businesses", "choosing", "classification", "coloradans"]
