["https://www.colorado.gov/governor/education"]
title = "Education | Colorado Governor Jared Polis"
full_description = "Education Expanding opportunity to fulfill every child's potential regardless of their zip code. Governor Polis has a long history of advocating for Colorado’s children and their education, having founded several non-profit schools, served on the State Board of Education, and fought for our kids as a member of the U.S. House of Representatives Committee on Education and the Workforce. Governor Polis believes that providing every child an excellent education is the best investment we can make in Colorado’s future, and that funding and improving our schools from preschool through college must be a top priority. Governor Polis will lead an education system here in Colorado where teachers are respected, public schools are supported, and every child gets a strong start and the great education they need to unlock a bright future. From strategies that support our youngest learners and their families to building a stronger higher education and workforce development system -- and everything in between -- the Polis Administration is working to ensure that a good education is in reach for every child and family in Colorado. As a first step, the Polis Administration is committed to ensuring that free full-day kindergarten is available to every child in every community in Colorado and expanding access to high-quality preschool for all interested families. Despite strong research supporting full-day kindergarten, the state of Colorado currently only funds a half-day, leaving it to Colorado’s school districts to pull from other programs or to charge parents fees if they want to offer full-day kindergarten. That has led to damaging inequities that hurt our most vulnerable students and exacerbate achievement gaps. It is time we start providing a 21st century education to every student across Colorado, and free, full-day kindergarten is a great place to start. It is no secret that Colorado’s K-12 education system needs additional funding to help fulfill every child’s potential. Governor Polis is committed to making progress on adequately and equitably funding our schools, and investing in programs that work to prepare students for college and careers. As every parent knows, teachers are critical to students’ success and deserve more support. Colorado has one of the fastest growing economies in the country; that success should fuel our schools and teachers. The Polis Administration will invest in teachers through professional development, improved wages and loan forgiveness, affordable housing, and better working conditions. In today’s economy, education beyond high school is more important than ever. The Polis Administration is committed to making sure higher education and workforce development programs are in reach for every student, and is committed to saving students money. The Polis Administration is committed to making sure higher education and workforce development programs are in reach for every student, and is committed to saving students money no matter what pathway they choose."
year_published = 2025
