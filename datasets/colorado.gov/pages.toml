["https://www.colorado.gov/governor/internships"]
title = "Internships with the Governor's Office | Colorado Governor Jared Polis"
full_description = "The Governor's Executive InternshipThe Governor’s Executive Internship program works with diverse and talented students and growing professionals to develop their skill sets and expand their understanding of state government, institutions, and functions. Interested applicants of all backgrounds and experiences are encouraged to learn more about the program and the application process below. The Governor’s Executive Internship is intended to provide the following:Exposure to the operations and day-to-day tasks of the Governor’s OfficeExperiential learning and assignments that reflect methods in how the office strives for government to be more effective, efficient, and elegantA framework to enhance the educational experience through practical work and research, thereby developing skills useful for career developmentProfessional development opportunities and relational network buildingRequirements for participation:Commitment to consistent weekly hours based on individual schedulesMinimum 16hrs/week, from 8:00 am to 5:00 pm, Monday through Friday.Excellent writing, communication, and proofreading skillsStrong individual initiative/work ethicInterest in public serviceAbility to responsibly handle and participate in confidential workStrong commitment to good government and nonpartisanshipFlexibility and drive to work remotely if required The Governor's Office embraces diversity and does not discriminate based on race, color, gender, national or ethnic origin, religious affiliation, sexual orientation, marital status, age, or physical ability. The Governor's Office and the State of Colorado are equal-opportunity employers.ApplyThe Internship Application for our Summer 2025 session is now open!Summer 2025 Internship Application"
