["https://www.colorado.gov/governor/news/governor-polis-colorado-continues-stand-ukraine"]
title = "Governor Polis: Colorado Continues to Stand with Ukraine | Colorado Governor Jared Polis"
description = "DENVER - Colorado Governor Jared Polis released a statement following President Trump and Vice-President Vance’s chaotic meeting with Ukrainian President Volodymyr Zelensky."
full_description = "Governor Polis: Colorado Continues to Stand with Ukraine Friday, February 28, 2025 DENVER - Colorado Governor Jared Polis released a statement following President Trump and Vice-President Vance’s chaotic meeting with Ukrainian President Volodymyr Zelensky. “In Colorado, we support freedom and we will not cater to a brutal Russian dictator who is no friend to America, our interests or future. Ukraine’s ability to defend itself against Putin’s illegal and brutal invasion of their country is critical for their freedom, the future of the Ukrainian people and important for American global safety and national security. America plays a crucial role in supporting our international allies and protecting democracy abroad, Colorado continues to stand with Ukraine.” At Governor Polis’s direction, the State of Colorado has cut off all diplomatic and financial connections with Russia and Russian-owned businesses, and previously provided a surplus of combat armor to those who are on the front lines fighting Putin’s tyranny. Governor Polis met with President Zelensky this past summer along with America’s Governors. ###"
