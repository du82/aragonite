title = "Linking Policy | colorado.gov"
description = "Linking Policy Colorado.gov provides links to many Web sites that are not controlled, maintained, or regulated by Colorado.gov or any organization affiliated with Colorado.gov, and as such Colorado.gov is not responsible for the content of those Web sites. Use of information obtained from those Web sites is voluntary, and reliance on that information should only be undertaken after an independent review of its accuracy."
full_description = "Linking Policy Colorado.gov provides links to many Web sites that are not controlled, maintained, or regulated by Colorado.gov or any organization affiliated with Colorado.gov, and as such Colorado.gov is not responsible for the content of those Web sites. Use of information obtained from those Web sites is voluntary, and reliance on that information should only be undertaken after an independent review of its accuracy. References at those Web sites to any specific commercial product, process, or service by trade name, trademark, or otherwise does not constitute or imply endorsement, recommendation, or favoring by Colorado.gov. Links on Colorado.gov This Web portal may contain hypertext links to external Web sites and pages containing information created and maintained by public and private organizations other than Colorado.gov. These hypertext links may be created by Colorado.gov if it determines that establishing the external link will be consistent with assisting or furthering the purpose of this Web portal, which is to significantly and diligently promote public service to citizens and businesses by: Expanding business and citizen access to government services and government information Offering an easy and convenient process for citizens and businesses to conduct transactions with State government online Accelerating the development and delivery of an increased volume of high quality online government services Improving the level of customer service from State government Extending electronic government services to citizens of cities and county government In addition, hypertext links may be created by Colorado.gov for informational purposes where the linked external Web site will provide useful and valuable information to visitors of this Web portal, or where the linked external Web site is required or authorized by law. Colorado.gov, in its sole discretion, will determine whether the external Web site meets the purpose of this Web portal or for the specified informational purposes. The inclusion of a hypertext link to an external Web site is not intended as an endorsement of any product or service offered or referenced on the linked Web site, the organizations sponsoring said Web site, or any views that might be expressed or referenced in the Web site. Hypertext links to external Web sites and pages may be removed or replaced at the sole discretion of Colorado.gov, at any time without notice. In the event you discover problems with or have concerns regarding the format, accuracy, timeliness, or completeness of a linked external Web site, please contact the organization responsible for the linked external Web site. Colorado.gov does not control and is not responsible for any linked external Web sites, pages, or content. Linking to Colorado.gov We encourage you to link to Colorado.gov. Unfortunately, we cannot always create reciprocal links back to your site, which may not meet our criteria for posting links (Colorado state government agency/organization, federal, or other site which is deemed as an important resource for related state government services or information). If you would like to request a link be added to Colorado.gov, please Contact Us."
