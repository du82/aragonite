["https://www.colorado.gov/governor/health"]
title = "Health | Colorado Governor Jared Polis"
full_description = "Health Saving Coloradans money on healthcare. Nobody should go without care because they can’t afford it. Ensuring all Coloradans have access to affordable, quality healthcare is a top priority for the Polis Administration. Governor Polis and Lieutenant Governor Primavera have an ambitious agenda to reduce health care costs while ensuring culturally responsive and equitable access to care. High premiums, deductibles, and other out-of-pocket charges make it difficult for people to afford care. It’s time to get health care costs under control. The Polis administrations is taking a two-tiered approach to reducing patient costs and investing in long-lasting changes that will improve the health system overall. In the short term, Governor Polis and Lieutenant Governor Primavera are taking concrete steps to lower the cost of health insurance and out-of-pocket costs. In the longer term, we are making investments in preventive care, expanding access to comprehensive primary and behavioral health services, and helping providers use data more effectively to ensure Coloradans get the care they need when and where they need it. To learn more about these actions, view the updated 2020 Roadmap to Saving People Money on Healthcare. As a first step, Governor Polis is creating the Office of Saving People Money on Healthcare, headed by Lt. Governor Primavera. The goal of the Office is to identify and implement policies that will reduce health care costs while expanding access to quality care in every corner of Colorado. Healthcare costs are rising and are expected to continue to increase exponentially in the future. While we saw a historic reduction in the number of uninsured Coloradans following the passage of the Affordable Care Act, people living in Colorado’s rural and mountain communities are losing ground because they cannot afford the care and coverage they need. Families across Colorado are having trouble affording their high premiums and out of pocket expenses, and the cost of providing coverage to employees is straining businesses and our overall economy. The Office of Saving People Money on Health Care will study the drivers of healthcare costs and identify ways to make healthcare more affordable for individuals, small businesses, the uninsured, state government and state employees. The Polis Administration is also committed to exploring new and innovative approaches to meet the diverse healthcare needs of all Coloradans. This includes greater transparency across the healthcare system -- including for prescription drugs -- and instituting paid family and medical leave so Coloradans can maintain economic stability in tough times. It also includes combating opioid and drug use that threatens so many families and communities, a renewed commitment to effective mental health treatment, and strategies that ensure Coloradans with disabilities can live, work and thrive in their communities of choice."
year_published = 2025
