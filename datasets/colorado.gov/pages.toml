title = "Colorado Governor's Office Home Page | Colorado Governor Jared Polis"
description = "Foster an economy that works for everyone"
full_description = "Coloradans are encouraged to sign up for county emergency alerts to receive life saving emergency alerts and evacuation information from their local public safety agency. Links to sign up for emergency alerts are posted to the DHSEM website. Colorado GovernorJared PolisGovernor Jared Polis is an entrepreneur, education leader, and public servant. After launching several successful companies, Governor Polis committed himself to making sure other Coloradans had the opportunity to pursue their dreams through founding schools for at-risk students and new immigrants and started nonprofits to help veterans. Prior to serving as Governor, Polis served on the State Board of Education and represented Colorado's 2nd Congressional district. Meet Jared Lieutenant Governor Dianne Primavera Lt. Governor Dianne Primavera is serving her second term as Colorado’s 50th Lieutenant Governor. In her role, she leads six programs: the Office of Saving People Money on Health Care, the Office of eHealth Innovation, the Colorado Disability Funding Committee and Disability Policy, the Colorado Commission of Indian Affairs, Serve Colorado, and Aerospace and Defense. She is a lifelong Coloradan and longtime Broomfield resident. Prior to her role as Lieutenant Governor, she worked as CEO of Susan G. Komen Colorado and served eight years in the State Legislature, representing Broomfield, Superior, and parts of Erie and Westminster. Meet Dianne First Gentleman Marlon Reis Marlon Reis is a freelance writer, an animal welfare advocate, a father, and the first First Gentleman of Colorado. From raising his two wonderful children, to his continued support of animal welfare organizations such as the Wild Animal Sanctuary right here in Colorado, Marlon is already committed to making Colorado an even more welcoming place to live. Born and raised in Colorado and a graduate of the University of Colorado, Marlon is an avid poet and fiction writer. Meet Marlon Key Issues Economy Foster an economy that works for everyone Environment and Renewables Move to renewable resources and protect the environment Health Save Coloradans money on healthcare Education Fulfill every child's potential regardless of their zipcode Press Releases and Updates Monday, March 3, 2025 Governor Polis: Trump’s Tariff Tax will Raise Costs For All Monday, March 3, 2025 DOLA’s Division of Property Taxation Encourages Eligible Colorado Seniors to Take Advantage of the 2025-26 Qualified Senior Primary Residential Classification Property Tax Reduction Monday, March 3, 2025 Governor Polis Urges Trump Administration to Comply with Court Order, Demands Public Safety Funding to Be Distributed to Colorado per Court Order Friday, February 28, 2025 Governor Polis: Colorado Continues to Stand with Ukraine More Press Releases Cabinet Scheduling Request Executive Orders Share Comments"
