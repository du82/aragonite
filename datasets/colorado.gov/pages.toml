["https://www.colorado.gov/governor/lt-governor-primavera"]
title = "Lt. Governor Primavera | Colorado Governor Jared Polis"
full_description = "Lt. Governor Dianne Primavera Dianne Primavera is serving her second term as Colorado’s 50th Lieutenant Governor. In her role, she leads six programs: the Office of Saving People Money on Health Care, the Office of eHealth Innovation, the Colorado Disability Funding Committee and Disability Policy, the Colorado Commission of Indian Affairs, Serve Colorado, and Aerospace and Defense. Lt. Governor Primavera is a lifelong Coloradan and longtime Broomfield resident. She was part of Regis University’s first graduating class of women and received a masters degree in Vocational Rehabilitation Counseling from the University of Northern Colorado. Prior to her role as Lieutenant Governor, she worked as CEO of Susan G. Komen Colorado and served eight years in the State Legislature, representing Broomfield, Superior, and parts of Erie and Westminster. Throughout her service, Lt. Governor Primaverawas highly regarded for her success working across the aisle to pass legislation advocating for people with disabilities, expanding access to health care, and supporting Coloradans’ access to quality cancer screenings and treatment. In 1988, Lt. Governor Primavera was a single mom raising her two daughters here in Colorado when she received a terminal breast cancer diagnosis and was told she had five years to live. Since her first diagnosis, she battled cancer three more times and survived when many people feared she wouldn’t live to see her daughters grow up. Her personal experience with cancer inspired her to make it her life’s work to ensure every Coloradan has access to affordable, high quality health care. In her free time, Lt. Governor Primavera enjoys ballroom dancing, taking after her father who was known for his eagerness to get on the dance floor, even on his 95th birthday. She is a proud grandma and enjoys sharing home cooked meals with family and friends. Visit the Lt. Governor's website."
year_published = 2025
