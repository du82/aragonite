["https://www.colorado.gov/governor/accessibility-and-accommodations"]
title = "Accessibility and Accommodations | Colorado Governor Jared Polis"
description = "The Governor’s Office Accessibility StatementThe Offices of the Colorado Governor and Lieutenant Governor are dedicated to supporting a welcoming, inclusive, and accessible Colorado for all."
full_description = "Accessibility and Accommodations The Governor’s Office Accessibility StatementThe Offices of the Colorado Governor and Lieutenant Governor are dedicated to supporting a welcoming, inclusive, and accessible Colorado for all.Our ongoing accessibility efforts work toward being in line with the Web Content Accessibility Guidelines (WCAG) version 2.1, level AA criteria. These guidelines not only help make web content accessible to users with sensory, cognitive, and mobility disabilities but ultimately to all users, regardless of ability.Our efforts are part of a meaningful change in making all State of Colorado services inclusive and accessible. We welcome comments on how to improve our technology’s accessibility for users with disabilities and for requests for accommodations to any State of Colorado services.Feedback and Accommodation RequestsWe encourage individuals to submit feedback and request reasonable accommodations that will help ensure access to the services we provide.All requests are considered on a case-by-case basis, and we will do our best to reply to all communications within two (2) business days.Accommodations are provided at no cost.Accommodation requests that would impose an undue financial or administrative burden to state agencies may not be fulfilled as requested. Examples of accommodations include:Sign language interpretation for an event, meeting, or appointmentAlternative document formats (such as Braille or large print)Remediated PDFs and documentsContact UsPlease contact us at gov_websitefeedback@state.co.us or at 720-682-0633.For general questions and comments for the Governor's Office, please contact Governorpolis@state.co.us or use the Constituent Services Help Line at 303-866-2885.In the WorkplaceCurrent Governor’s Office employees who need a workplace accommodation should contact the Human Resources (HR) Office for support.Prospective employees who have been invited to interview for an employment opportunity should work directly with the person arranging the interview. How We Are Implementing AccessibilityWebsite Testing and RemediationWe use Siteimprove to conduct automated testing of all webpages for accessibility and quality assurance. We have contracted with third-party vendors for manual accessibility testing of our sites and to help provide document remediation services. In addition, we make use of tools such as the Web Accessibility Evaluation Tool (WAVE) and Contrast Checker by WebAIM.TrainingWe provide accessibility training to all staff through required coursework, weekly meetings on accessibility topics provided by the Office of Information Technology (OIT), and regular targeted training conducted by the Accessible Programs Coordinator for the Office of the Governor. An intranet page dedicated to accessibility resources is also available to staff in addition to OIT's Guide to Accessible Web Services and the monthly State of Colorado Accessibility Newsletter.ProcurementWe are taking steps to ensure all digital products we procure meet established technical standards by including accessibility assurances in contracts, requiring vendors to complete a Voluntary Product Accessibility Template (VPAT) also known as an Accessibility Compliance Report (ACR), and validating the accessibility information we receive. Additional State Accessibility ServicesAiraAs part of its drive to create a Colorado for All, the State of Colorado is partnering with Aira to remove barriers when navigating state-operated buildings and digital services. Aira is a live service that provides on-demand visual interpretation through a smartphone application to those who are blind or have low vision. Highly trained visual interpreters are available 24 hours a day, 7 days a week, 365 days a year for a free 30-minute session. To get started, visit the Aira Assistance website. The Colorado Commission for the Deaf, Hard of Hearing, and DeafBlind (CCDHHDB)The CCDHHDB provides programs and services for accessibility, communication, technology, and education. Explore the Colorado Commission for the Deaf, Hard of Hearing, and DeafBlind website for information about their services, provider directories, and much more.Relay ColoradoRelay Colorado is a statewide service that connects standard (voice) telephone users with Deaf, Hard of Hearing, DeafBlind, Speech-Disabled, or Late-Deafened people who use Teletypewriter (TTYs) or Voice Carry-Over (VCO) phones. Visit the Relay Colorado website for more information.Updated OnThis Accessibility Conformance Statement was last updated on: 5/24/2024"
