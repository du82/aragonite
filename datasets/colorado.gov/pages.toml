["https://www.colorado.gov/governor/gov-polis"]
title = "Governor Polis | Colorado Governor Jared Polis"
full_description = "Governor Jared Polis Governor Jared Polis is an entrepreneur, education leader, and public servant. After launching several successful companies, including one out of his college dorm room, Polis committed himself to making sure other Coloradans had the opportunity to pursue their dreams. Polis founded schools for at-risk students and new immigrants and started nonprofits to help veterans and entrepreneurs. Prior to serving as Governor, Polis served on the State Board of Education where he worked to raise pay for teachers and reduce class size for students, and represented Colorado's 2nd Congressional district, where he was rated the most effective member of the Colorado delegation. As Governor, Polis has focused on saving Coloradans money, keeping our economy strong, and preserving our Colorado way of life. Polis delivered universal free full-day kindergarten, signed a number of bills to save families money on health care, and made significant progress towards the goal of 100% renewable energy by 2040, all while cutting taxes for small businesses and investing in affordable housing and transportation. His efforts to expand health care access to medically underserved communities and to ensure that equity and justice remain central to building a Colorado for All have produced impactful legislation and made progress toward his administration’s bold vision."
