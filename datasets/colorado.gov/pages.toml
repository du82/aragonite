title = "Member Forms | Department of Health Care Policy and Financing"
full_description = "Application FormsIf you want to fill out a paper application and mail it in, print out one of the applications below. You can also drop it off at your county of residence's local county office or at a local application assistance site.Apply Only for Health First Colorado (Colorado's Medicaid program) and Child Health Plan Plus (CHP+)Health First Colorado, Child Health Plan Plus (CHP+) Paper Application - EnglishHealth First Colorado, Child Health Plan Plus (CHP+) Paper Application - SpanishApply for Health First Colorado, Child Health Plan Plus (CHP+), Cash, and Food AssistanceHealth First Colorado, Child Health Plan Plus (CHP+), Cash, and Food Assistance Paper Application - English (or Large Print Version)Health First Colorado, Child Health Plan Plus (CHP+), Cash, and Food Assistance Paper Application - Spanish (or Large Print Version)Disability ApplicationsIf you believe you have a disability, even if you have been denied disability status by the Social Security Administration, please also fill out the Disability Application:English Disability Application (or Large Print Version)Spanish Disability Application (or Large Print Version)Establish IdentityUse the forms at the links below to establish identity if:your application includes a child age 0-15 who does not have acceptable identity documents (acceptable documents include clinic, doctor, hospital, or school records) oryour application includes an individual age 16-18 who does not have acceptable identity documents (acceptable documents include school identification cards, state ID or drivers' licenses) oryour application includes an individual with a disability in an institutional care facility and no other evidence of identity is available.English Affidavit to Establish Identity FormSpanish Affidavit to Establish Identity FormOut of State Former Foster Care Medical AssistanceIf you received Former Foster Care Medical Assistance out of state and are applying alone, do not use the full medical assistance application. Fill out the form below.If you are applying for yourself and other members of your household, include the form below with the full medical assistance application. Please complete the form below for medical assistance if all of the following apply to you:You are 18 to 25 years old, andYou are now a Colorado resident, andYou were not adopted out of Foster Care, andYou received Former Foster Care Medical Assistance out of state, andYou turned 18 on or after January 1, 2023.English Health First Colorado Out of State Former Foster Care Youth FormSpanish Health First Colorado Out of State Former Foster Care Youth Form Paperwork for Applicants and MembersThis page contains copies of some of the paperwork you will receive when you apply for or renew health coverage. These forms are here for your convenience if you misplace your original form or need a copy.Health Coverage Additional Information Form - EnglishLive-In Home Care Provider Statement - EnglishLive-In Home Care Provider Statement - SpanishMedical Assistance Additional Information Form - EnglishMedical Assistance Additional Information Form - SpanishRental Property Verification Form - EnglishRental Property Verification Form - SpanishTax Information Packet - EnglishTax Information Packet - Spanish"
