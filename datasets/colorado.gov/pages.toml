["https://www.colorado.gov/governor/CORA"]
title = "CORA | Colorado Governor Jared Polis"
full_description = "Colorado Open Records ActThe Office of the Governor (“Office”) is committed to transparency and open government. The following policy specifies how the Colorado Open Records Act (“CORA”) (§ 24-72-201 to 206, C.R.S.) will be applied in a uniform and reliable manner.* This policy will help ensure the Office complies in all respects with CORA and meets all constitutional and statutory duties to the people of Colorado in an orderly and expeditious manner. This policy is not intended to be duplicative of CORA or supersede state law.This policy applies to the Office of the Governor, including the Office of State Planning and Budgeting. This policy applies solely to records requests where the Office is the custodian of records pursuant to CORA. Other state agencies and Office departments may have different CORA policies.Office Procedure for Handling Records RequestsAll records requests made by a requestor and received by the Office by mail, fax, courier, e-mail or other means shall be immediately provided to the Office of Legal Counsel. All records that may be responsive to specific requests for information must be provided to the Office of Legal Counsel as soon as possible. The Office of Legal Counsel will respond to all CORA requests except in extraordinary circumstances.The Office will only accept records requests from the requestor and that are made in writing or electronically via e-mail or fax. Records requests or requestors that cite the federal Freedom of Information Act will be treated as though they were made pursuant to the Colorado Open Records Act.When responding to a records request, the Office shall make every effort to respond within three working days as required by § 24-72-203(3)(b), C.R.S. The Office can issue up to a seven-working-day extension if it finds extenuating circumstances exist, as described in § 24-72-203(3)(b), C.R.S. A request is received by the Office the day an e-mail, fax or letter containing a request from the requestor is opened. The three working-day response time begins the first working day following receipt of the request. A request received after 5 p.m. or any day the Office is officially closed will be considered received as of the following working day. The Office will respond to one CORA request at a time per requestor.No employee of the Office may modify, redact or omit any records they are required to provide to the Office of Legal Counsel pursuant to this policy, or his or her designee handling the request. Decisions about the applicability of CORA to particular writings will be made by the Office of Legal Counsel.When feasible, the Office will endeavor to provide electronic copies or files to requestors if such alternative is significantly less burdensome to provide than paper records (see “The format of records produced” below). When responsive records cannot be easily or cost-effectively provided electronically to a requestor, the Office will work with the requestor to schedule a time to inspect the records in person. The Office is open from 9 a.m. to 5 p.m. Monday through Friday. The Office of Legal Counsel may grant exceptions where the Office, requestors or the records produced require special accommodations.Office staff should never assume a document is exempt from CORA and should always consult attorneys in the Office of Legal Counsel before making a final determination.These provisions shall not apply to records requests received and handled by employees as part of their work for client agencies or officials when the custodian of records is not the Office.Fees for Document Retrieval, Review, Copies and Release of RecordsWhen a substantial request is made — requiring the production of more than 25 pages of documents or the use of more than one hour of staff time to locate or produce records — the Office will charge the requestor for all copying expenses and reasonable, actual costs associated with staff time in accordance with § 24-72-205(5)(a), C.R.S. and applicable law.When the number of pages produced in response to a records request exceeds 25 pages, the Office will charge $0.25 per page for all documents photocopied. When researching, retrieving, reviewing or producing records consumes more than one hour of staff time, the Office will charge $20 an hour for all staff time after the first hour associated with researching, retrieving, reviewing and producing records for a requestor. The Office also may charge an hourly rate not to exceed $33.58 an hour (after the first hour) when specialized document production or specialized skills are required to research, retrieve, review, locate, compile or produce records pursuant to a records request, including the use of third-party contractors. Any costs charged to a requestor shall not exceed the actual cost of producing the records, in accordance with § 24-72-205(5)(a), C.R.S., and applicable law.For requests where the Office anticipates more than 25 pages will be produced and/or more than one hour of staff time will be consumed, the Office will provide a requestor with advance notice and an estimate of compliance costs. Such costs must be paid in full before the production of records unless alternative arrangements have been made through the Office of Legal Counsel.The Format of Records ProducedThe Colorado Open Records Act guarantees that all public records must be open for inspection by any person at reasonable times, except as provided in CORA or as otherwise specifically provided by law (§ 24-72-201, C.R.S.). CORA does not guarantee access to public records in a specific format. When the production or review of records in a specific format would interfere with the regular discharge of duties of Office employees (§ 24-72-203(1)(a), C.R.S.) or levy an undue burden upon the Office, the Office of Legal Counsel will determine the appropriate format for the records to be produced. Records maintained electronically may be produced electronically at the Office’s discretion; this may or may not mean records are provided in their native format.The Office may require that members of the public or press only be allowed to review copies of documents when the custodian of records determines that allowing access to originals could interfere with the regular discharge of duties of the Office or its staff or production of original records could jeopardize the condition of the records.Please submit your CORA request to gov_cora@state.co.us.Last Updated: June 7th, 2022* - This policy also generally applies to requests made pursuant to the Colorado Criminal Justice Records Act."
year_published = 2025
