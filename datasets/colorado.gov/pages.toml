["https://colorado.gov/registered-services"]
title = "Registered Services | colorado.gov"
description = "Registered Services   Colorado.gov Registration   Some of the online services offered to Coloradans by Colorado.gov are available only through a registration process. Registration with Colorado.gov provides quick and expedient access to fee-based services with the convenience of one monthly bill.   Benefits of Registering with Colorado.gov"
full_description = "Registered Services Colorado.gov Registration Some of the online services offered to Coloradans by Colorado.gov are available only through a registration process. Registration with Colorado.gov provides quick and expedient access to fee-based services with the convenience of one monthly bill. Benefits of Registering with Colorado.gov Conduct online government services 24/7 with the convenience of billing to one account. Access online services, some of which may only be accessed electronically, as a Colorado.gov registered user. Receive individual usernames and passwords for up to 10 people in your organization, with the ability to add more for an additional fee. Set up an Account and Billing Administrator roles for your business. Access detailed monthly billing summaries. Choose between automatic credit or debit card payment, direct debit (automatic bank draft), or monthly billing statement. For more information about registering, please contact the Colorado.gov Technical Support team at support@www.colorado.gov. Access Registered Services The following applications are available: Driving Records - Access to Driver History and Vehicle Title and Registration data for applicants who have an approved permissible use. Driver Monitoring - Access to Driver License status changes for approved applicants. Gambling Intercept Payment - Casino and casino staff access to the application for confirming intercept requirements. Motor Vehicle Verification System - Access to upload informationa about reported stolen. Register for Services How to Register Email a request to the Colorado.gov Technical Support team at support@www.colorado.gov. The team will provide you with information about the service requested and application paperwork. The annual Colorado.gov registration fee is $75. Attach a $75 check / money order, or include a credit card number on the completed Registration Agreement and any application paperwork provided. The team will contact you to confirm receipt and discuss next steps in on-boarding process. Account Management To manage your Colorado.gov registration account, refer to the following resources: Billing Options Accounts are billed monthly for usage and annually for registration renewal. Credit Card Billing We accept MasterCard and Visa. Declined Credit Cards: If your credit card declines charges, you will be contacted by the Customer Service Department to verify credit card information. Change of Credit Card Account: If you choose to use a different credit card, please contact the Colorado.gov Technical Support team at support@www.colorado.gov. Monthly Statements: Monthly statements are accessible online. Printed statements are not mailed to credit card billing customers. Auto Check Option The Auto Check Option is an automated fund transfer from your designated checking account. Your account will be charged for monthly usage and annually for subscription renewal. Non-sufficient funds: If your checking account declines charges due to non-sufficient funds, you will be contacted by the Customer Service Department to verify checking account information. Change of Checking Account: If you choose to use a different checking account, please contact the Colorado.gov Technical Support team at support@www.colorado.gov. NOTE: Colorado.gov will charge a $10 fee for insufficient funds. Monthly Statements: Monthly statements are accessible online. Printed statements are not mailed to Auto Check Option customers. Manual Billing Invoice If you select this billing option, you will receive a statement in the mail each month requesting payment for fee-based services. Annually, this statement will include the registration renewal fee. * If a Customer Administrator's password is lost or forgotten, they must contact Colorado.gov Technical Support team at support@www.colorado.gov."
year_published = 2025
clearnet = "https://colorado.gov/registered-services"
