["https://www.colorado.gov/governor/news/governor-polis-urges-trump-administration-comply-court-order-demands-public-safety-funding-be"]
title = "Governor Polis Urges Trump Administration to Comply with Court Order, Demands Public Safety Funding to Be Distributed to Colorado per Court Order | Colorado Governor Jared Polis"
description = "DENVER - The Trump administration’s freeze on Homeland Security Grants allocated for Colorado could make the state less safe. The Temporary Restraining Order (TRO), issued by the United States District Court, clearly prohibits the federal government from pausing, freezing, or otherwise impeding the disbursement of federal financial assistance to the states. Nonetheless, the administration continues to stop paying for important programs like State and Local Cyber Security, Targeted Violence and Terrorism Prevention Grant Program, Urban Area Security Initiative, and the Nonprofit Security Grant Program (NSGP). The Trump administration is withholding this funding from organizations that are implementing much-needed safety measures. The federal government promised Colorado $69.5 million in public safety grants. The state will do everything it can to bridge the gap in funding and ensure that it receives the funds Congress authorized for communities throughout Colorado."
full_description = '''Governor Polis Urges Trump Administration to Comply with Court Order, Demands Public Safety Funding to Be Distributed to Colorado per Court Order Monday, March 3, 2025 DENVER - The Trump administration’s freeze on Homeland Security Grants allocated for Colorado could make the state less safe. The Temporary Restraining Order (TRO), issued by the United States District Court, clearly prohibits the federal government from pausing, freezing, or otherwise impeding the disbursement of federal financial assistance to the states. Nonetheless, the administration continues to stop paying for important programs like State and Local Cyber Security, Targeted Violence and Terrorism Prevention Grant Program, Urban Area Security Initiative, and the Nonprofit Security Grant Program (NSGP). The Trump administration is withholding this funding from organizations that are implementing much-needed safety measures. The federal government promised Colorado $69.5 million in public safety grants. The state will do everything it can to bridge the gap in funding and ensure that it receives the funds Congress authorized for communities throughout Colorado. “In Colorado, we are focused on improving public safety and this delay and uncertainty makes us less safe. Common sense support to improve safety for Boys and Girls Clubs, places of worship, stopping school violence, and disaster assistance is illegally being cut off by the Trump administration. This wrecking ball approach from the federal government puts communities throughout Colorado at risk,” said Governor Polis."The federal government's freeze on Homeland Security Grants is deeply concerning for Summit County. As home to the most visited national forest in the nation—the White River National Forest—a critical stretch of Interstate 70, and dam infrastructure vital to the Colorado River Basin, Summit County relies on federal funding to support public safety across private, public, and federal lands. Public safety must remain a priority, and restoring these funds is essential,” said Summit County Sheriff Jamie FitzSimons.“Now, when antisemitism and other forms of identity-based hate are at historic levels, is not the time to cut the NSGP,” said Brandon Rattiner, Senior Director of JEWISHcolorado’s Jewish Community Relations Council. “Demand for this program already far exceeds available funding. Reducing it further would leave communities vulnerable and weaken essential security measures that have saved lives and prevented tragedies.”The following are some of the funding amounts currently frozen in Colorado :State Homeland Security Grants, $18,660,250Emergency Management Performance Grants, $6,355,282State and Local Cybersecurity Grants, $9,786,461Emergency Operations Center Grants, $2,446,557Nonprofit Security Grants, $9,872,027Targeted Violence and Terrorism Prevention Grants, $775,720Urban Area Security Initiative Grants, $15,200,484###'''
year_published = 2025
clearnet = "https://www.colorado.gov/governor/news/governor-polis-urges-trump-administration-comply-court-order-demands-public-safety-funding-be"
tags = ['"the', "$15,200,484", "$18,660,250", "$2,446,557", "$6,355,282", "$775,720", "$9,786,461", "$9,872,027", "across", "administration"]
language = "en"
