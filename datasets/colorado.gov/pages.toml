["https://www.colorado.gov/governor/news/governor-polis-trumps-tariff-tax-will-raise-costs-all"]
title = "Governor Polis: Trump’s Tariff Tax will Raise Costs For All | Colorado Governor Jared Polis"
description = "DENVER - President Trump plans to implement a new 25% tax on hardworking Americans through his disastrous tariff tax."
full_description = "Governor Polis: Trump’s Tariff Tax will Raise Costs For All Monday, March 3, 2025 DENVER - President Trump plans to implement a new 25% tax on hardworking Americans through his disastrous tariff tax.“Unless President Trump pulls back from tariffs on products from Mexico and Canada, starting at midnight, the President’s horrible sales tax will apply to all hardworking Coloradans. Trump’s tariffs are a costly sales tax that will raise the price of groceries, clothes, homes, technology, cars, and everyday items Americans rely on and hurt North American competitiveness. President Trump is playing chicken with people’s pocketbooks, small businesses, and our economy, and it is harmful. While Colorado is pushing ahead to lower costs, the President’s tariffs alone will cause economic devastation across America in their wake,” said Colorado Governor Polis. Governor Polis has been outspoken in opposition to President Trump's reckless tariff tax.###"
