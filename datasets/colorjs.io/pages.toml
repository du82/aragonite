["https://colorjs.io/docs/manipulation"]
title = "Color manipulation • Color.js"
full_description = '''The Color object Supported color spaces Color difference Color manipulation Contrast Gamut Mapping Interpolation Chromatic Adaptation Output Procedural, tree-shakable API Color manipulation By color coordinates We've seen in a previous section how we can manipulate a color by directly manipulating coordinates in any of the color spaces supported. You can use properties to modify coordinates of any color space and convert back let color = new Color("slategray"); color.lch.l = 80; // Set coord directly in any color space color.lch.c *= 1.2; // saturate by increasing LCH chroma by 20% color.hwb.w += 10; // any other color space also available To modify coordinates in any color space you use color.set() and color.setAll(): let color = new Color("slategray"); // Multiple coordinates color.set({ "lch.l": 80, // set lightness to 80 "lch.c": c => c * 1.2 // Relative manipulation }); // Set single coordinate color.set("hwb.w", w => w + 10); Coordinates of the color's color space are available without a prefix: let color = new Color("slategray").to("lch"); // Multiple coordinates color.set({ l: 80, // set lightness to 80 c: c => c * 1.2 // Relative manipulation }); // Set single coordinate color.set("h", 30); Chaining-style modifications are also supported: let color = new Color("lch(50% 50 10)"); color = color.set({ h: h => h + 180, c: 60 }).lighten(); You can also use properties: let color = new Color("slategray"); color.lch.l = 80; // Set coord directly in any color space color.lch.c *= 1.2; // saturate by increasing LCH chroma by 20% color.hwb.w += 10; // any other color space also available Coordinates of the color's color space are available without a prefix: let color = new Color("slategray").to("lch"); color.l = 80; // Set LCH lightness color.c *= 1.2; // saturate by increasing LCH chroma Edit this page on Color Notebook'''
