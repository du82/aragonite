title = "Supported Color Spaces • Color.js"
description = "Another wide gamut RGB color space, encompassed roughly 50% of visible colors, and popular in digital photography. The name Adobe® (1998) RGB&#39; is trademarked, but a colorspace which is 100% identical can be described as compatible` as long as it uses a different name."
full_description = 'Adobe® 98 RGB compatible src/spaces/a98rgb.js Another wide gamut RGB color space, encompassed roughly 50% of visible colors, and popular in digital photography. The name Adobe® (1998) RGB&#39; is trademarked, but a colorspace which is 100% identical can be described as compatible` as long as it uses a different name. Base Linear Adobe® 98 RGB compatible White point: D65 Coordinates: Id Name Ref. range r Red 0 – 1 g Green 0 – 1 b Blue 0 – 1 let color = new Color("a98rgb", [0.13, 0.25, 0.39]); color.a98rgb.r = 0.5; color.a98rgb.g = 0.5; color.a98rgb.b = 0.5; color.toString(); Learn more about Adobe® 98 RGB compatible Linear Adobe® 98 RGB compatible src/spaces/a98rgb-linear.js Base XYZ D65 White point: D65 Coordinates: Id Name Ref. range r Red 0 – 1 g Green 0 – 1 b Blue 0 – 1 let color = new Color("a98rgb-linear", [0.66, 0.9, 0.46]); color.a98rgb_linear.r = 0.5; color.a98rgb_linear.g = 0.5; color.a98rgb_linear.b = 0.5; color.toString(); ACEScc src/spaces/acescc.js Academy Color Encoding System, using the wide gamut but physically realizable AP1 primaries and Logarithmic Encoding. Used for color grading. Base ACEScg White point: ACES Coordinates: Id Name Ref. range r Red -0.358 – 1.468 g Green -0.358 – 1.468 b Blue -0.358 – 1.468 let color = new Color("acescc", [-0.11828683000000001, 0.7317131700000001, 1.2217131700000001]); color.acescc.r = 0.555; color.acescc.g = 0.555; color.acescc.b = 0.555; color.toString(); Learn more about ACEScc ACEScg src/spaces/acescg.js Scene-referred Academy Color Encoding System, using the wide gamut but physically realizable AP1 primaries and linear-light encoding. Used for physical rendering. Base XYZ D65 White point: ACES Coordinates: Id Name Ref. range r Red 0 – 65,504 g Green 0 – 65,504 b Blue 0 – 65,504 let color = new Color("acescg", [30700, 15300, 60900]); color.acescg.r = 32800; color.acescg.g = 32800; color.acescg.b = 32800; color.toString(); Learn more about ACEScg CAM16-JMh src/spaces/cam16-jmh.js An improved and simplified development from the earlier CIECAM02 Color Appearance Model, CAM16 provides three perceptual attributes: lightness J, colorfulness M and hue quadrature h. The default viewing conditions are: D65 white point, adapting luminance of 64 lux (4 cd/m²), average surround and less than full chromatic adaptation. This does mean that what other color models consider to be achromatic colors may have a non-zero colorfulness (M). Base XYZ D65 White point: D65 Coordinates: Id Name Ref. range j J 0 – 100 m Colorfulness 0 – 105 h Hue 0 – 360 let color = new Color("cam16-jmh", [34, 72, 285]); color.cam16_jmh.j = 50; color.cam16_jmh.m = 52.5; color.cam16_jmh.h = 180; color.toString(); Learn more about CAM16-JMh'
