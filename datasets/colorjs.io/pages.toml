title = "Color.js: Let’s get serious about color • Color.js"
full_description = "Fully color space aware Each color belongs to a color space; operations are color space agnostic. Modules for a wide variety of color spaces, including Lab/LCh, OKLab/OKLCh, sRGB and friends (HSL/HSV/HWB), Display P3, Jzazbz, REC.2100 and many more. Doesn't gloss over color science Actual gamut mapping instead of naïve clipping, multiple DeltaE methods (76, CMC, 2000, Jz), multiple chromatic adaptation methods (von Kries, Bradford, CAT02, CAT16), all with sensible defaults Up to date with CSS Color 4 Every CSS Color 4 format & color space supported for both input and output, whether your browser supports it or not. Readable, object-oriented API Color objects for multiple operations on the same color, and static Color.something() functions for one-off calculations Modular & Extensible Use only what you need, or a bundle. Client-side or Node. Deep extensibility with hooks. Fast & efficient Procedural, tree-shakeable API available for performance sensitive tasks and reduced bundle size"
