["https://colorjs.io/api"]
title = "Color.js API Docs - v0.6.0-alpha.1"
description = "Documentation for Color.js API Docs"
full_description = "Color.js is a color conversion and modification library originally created by two of the editors of the CSS Color specifications: Lea Verou and Chris Lilley. They continue to work on it, but are also joined by an exceptional small grassroots team of co-maintainers. Color.js is designed make simple things easy, and complex things possible, and that extends to installation as well. For quick experiments, you can just import Color.js directly from the CDN (kindly provided by the awesome folks at Netlify) with all modules included: Whether you’re using NPM, the CDN, or local files, Color.js allows you to also import specific modules by directly importing from src: Are you old school and prefer to simply have a global Color variable? We’ve got you covered! Just include the following script in your HTML: These are all very experimental and not as polished as Color.js itself, but we are excited about their potential. This is a set of (currently 10) web components for building color-related apps (the first library of its kind to our knowledge). It includes things like color pickers, color charts, interactive color scales, and more. A research project which aims to analyze designer-created color palettes in a variety of color spaces, both to document patterns (e.g. what hue names are most popular?) and to understand what makes aesthetically pleasing color scales."
