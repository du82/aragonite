cure.gravatar.com/avatar/8c84fa489ddf468892c3247294ba7ca5?s=50&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/8c84fa489ddf468892c3247294ba7ca5?s=100&#038;d=mm&#038;r=g 2x' class='avatar avatar-50 photo' height='50' width='50' decoding='async'/> Ashish Ajani says: at Great blog, very useful. I’ve developed a good few of sites for clients using WordPress and one thing I always looking for is a great collection of themes at one place so I can show it to my clients and ask to choose from. I gone through many blogs and came across this. It is really helpful to me, thank for putting it together. Reply <img alt='' src='https://secure.gravatar.com/avatar/69f34259a9d0b7df04f0b50893c469ed?s=50&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/69f34259a9d0b7df04f0b50893c469ed?s=100&#038;d=mm&#038;r=g 2x' class='avatar avatar-50 photo' height='50' width='50' decoding='async'/> Aigars says: at Ashish, Thank you for your feedback! I created this blog because I had the same situation when I Go'''
