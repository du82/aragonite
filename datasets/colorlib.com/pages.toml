full_description = "We are excited to be part of the WordPress community and looking to make contribution by releasing free WordPress themes for everyone to use. Other themes can be found here. Illdy is a beautiful One Page WordPress theme best suited for business and landing page style websites. Minimal and highly flexible multipurpose WordPress blog theme based on Bootstrap and WordPress Theme Customizer Highly customizable Bootstrap powered WordPress theme well suited for blogs, business, portfolio and travel websites Clean, modern and responsive WordPress theme with fullscreen content slider, dozens of options well suited for corporate websites Clean, flexible and stunning WordPress theme designed for travel websites, blogs and corporate websites WordPress Portfolio theme designed with image-first approach. Well suited for freelancers, agencies, artists and everyone looking to showcase their work and images If yo are looking for more featured and customization options then premium WordPress themes are the right fit for you. Best examples can be found here. Simple, responsive, clean and fast loading WordPress themes for everyone. Highly customizable functionality and design to create website you have always wanted. All our themes have dozens of Theme Options to get the most out of them. You won't need to touch a code to create a website you have always wanted. Our themes have the best coding standards in place and they are reviewed by WordPress experts. We promise performance, simplicity and error free experience. All our themes come with detailed documentation that will get you started in no time. If you happen to get stuck, we have support forum to get additional help with theme setup. If you want to be the first to find out more about our colorful WordPress themes, please subscribe to our newsletter"
