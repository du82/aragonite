full_description = 'We change everything WordPress—one WP theme at a time. Colorlib was founded in 2013 by Aigars Silkalns to serve as a resource where he could show his results from learning web development. It started as a learning experiment but soon turned into more than that. About Colorlib in 2014 This website serves around 300,000 page views each month and most of the traffic comes from the US, UK, Australia, Japan, and Germany. Our themes are downloaded over 200,000 in less than one year and hopefully, we can double this number by end of 2014 (hopefully we will remember to update this number when the time comes). About Colorlib in 2015 Today I noticed that this section needs a massive update to include how well we did in 2014. We closed 2014 with 450,000 visitors on average and a whooping 900,000 page views a month. Our themes have been downloaded over 600,000 times. We have come a long way and there is no sign of slowing down and we think we have just started our journey. We want to contribute to the WordPress community by releasing free WordPress themes, but you can expect premium features and themes. This project is entirely run by one person, but currently, Colorlib is seeking someone who could make this website even more useful for the WordPress community. If you are interested in doing business with us, please contact us. About Colorlib in 2019 Millions of pageviews a month, and tons of new themes and templates are added daily, and we have just started. It wasn’t a serious business until around 2017 but now the organization has changed significantly and more great things to come in the following years and decades to come. About Colorlib in 2020 This year we started selling our own website templates. We already have over 1,000 Bootstrap templates and add a new one daily. We offer them as part of a subscription with support and regular updates. This year marks when we switched from purely affiliate income and jumped into our product development. Full control over the user experience allows for delivering the best products and services. We know that this isn’t the best About Us page ever but we have some recommendations for ones that are. Last updated: August 1, 2023. <img fetchpriority="high" decoding="async" src="https://colorlib.com/wp/wp-content/uploads/sites/2/we-are-hiring.png" alt="We are Hiring" width="1100" height="700"/> Click on image above to find out more! Facebook Twitter'
