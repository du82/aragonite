full_description = "Colour 0.4.5 is available! Colour Developers 2024-10-10 09:24 Comments The colour-science Developers are pleased to announce the release of Colour 0.4.5! Read more… Retrospective on 10 Years of colour-science Colour Developers 2024-04-05 22:52 Comments Today is the 10th anniversary of Colour and colour-science! (colour-science-py3.12) Eris:colour kelsolaar$ git log --reverse commit 90bc42b9fedfc7291c7023247eab14b41d5c29af Author: Thomas Mansencal <thomas.mansencal@gmail.com> Date: Sat Apr 5 14:07:48 2014 +0200 Initial commit. Signed-off-by: Thomas Mansencal <thomas.mansencal@gmail.com> It is time for a decade of work retrospective. Read more… Colour Checker Detection with Machine Learning Colour Developers 2024-01-11 04:48 Comments We have released a new version of Colour - Checker Detection that implements a new machine learning inference method to detect colour rendition charts, specifically the ColorChecker Classic 24 from X-Rite / Calibrite. This post describes the journey to produce the model and package it with Colour - Checker Detection. Read more… Colour 0.4.4 is available! Colour Developers 2023-12-17 04:26 Comments The colour-science Developers are pleased to announce the release of Colour 0.4.4! Read more… Colour 0.4.3 is available! Colour Developers 2023-08-26 23:51 Comments The colour-science Developers are pleased to announce the release of Colour 0.4.3! Read more… Colour 0.4.2 is available! Colour Developers 2022-12-04 09:01 Comments We are pleased to announce that Colour 0.4.2 has been released earlier this week! Read more… Colour 0.4.0 is available! Colour Developers 2022-02-20 08:22 Comments We are pleased to announce that after over a year of work, Colour 0.4.0 has been released! Read more… The ColorChecker Considered Mostly Harmless Colour Developers 2021-03-06 01:16 Comments This post will be about colour rendition charts, e.g., X-Rite ColorChecker Classic, their usage and its dangers. It was a long time coming and some discussions accelerated the authoring. If you are in a hurry and do not want to read the entire post, the TLDR is as follows: Unless you have all the relevant spectral measurements, a colour rendition chart should not be used to perform colour-correction of camera imagery but only for white balancing and relative exposure adjustments. There is granularity in everything, and we will present, in the conclusion, some contexts when performing colour-correction is a good idea. Read more…"
