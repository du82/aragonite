full_description = "Colour - Checker Detection Colour - Checker Detection is a Python package implementing various colour checker detection algorithms and related utilities. Features The following colour checker detection algorithms are implemented: Segmentation Machine learning inference via Ultralytics YOLOv8 The model is published on HuggingFace, and was trained on a purposely constructed dataset. The model has only been trained on ColorChecker Classic 24 images and will not work with ColorChecker Nano or ColorChecker SG images. Inference is performed by a script licensed under the terms of the GNU Affero General Public License v3.0 as it uses the Ultralytics YOLOv8 API which is incompatible with the BSD-3-Clause. API The main technical reference for Colour - Checker Detection is the API Reference. Examples Colour - Checker Detection - Examples Downloads Colour - Checker Detection Github Repository Colour - Checker Detection - Pypi"
