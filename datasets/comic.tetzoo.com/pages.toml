title = "Tet Zoo Comic"
description = "Written by Darren Naish, drawn inaccurately by Ethan Kocak."
full_description = "Q Anonymous asked: Hey aren't you the same guy (Etahn) that makes the The BlackMudpuppy? Toilet Sloth so funny/gross/interesting/smelly A Yup, that’s me! Feb. 2 2015 3 notes Q Anonymous asked: Hey aren't you the same guy (Etahn) that makes the The BlackMudpuppy? Toilet Sloth so funny/gross/interesting/smelly A Yup, that’s me! Feb. 2 2015 Q Anonymous asked: Is it possible someday for ancient archosaurs ( like non-avian dinosaurs ) to be cloned someday? A From what I understand about the decay rate of the DNA molecule, very, very unlikely. Dec. 16 2014 2 notes Q horsediscourse asked: your axolotl comic only has 140 notes. sweet summer child. A :D Dec. 16 2014 Q Anonymous asked: How long does it take to make this comic? A It takes me a few days once I’ve broken up the article. Dec. 16 2014 1 note White Rhinos Part 3: The stunning conclusion! Original ArticleHi Res Version Oct. 1 2014 #white rhino rhinoceros tetzoo tetrapod zoology ethan kocak darren naish comics mammals 10 notes White Rhinos (Part 2 of 3)!Original Article Jul. 9 2014 #rhino #rhinoceros #white #Darren Naish #ethan kocak #tet zoo #tetrapod zoology #tetzoo #mammals 13 notes tetzoo:Show your love for the dinosaurian origin of birds with this Tet Zoo t-shirt! Available here.(via albertonykus) Jun. 26 2014 26 notes WHITE RHINOS, PART 1:There are at least two more parts to this forthcoming. I decided to cut it up into parts because it was taking too long to finish it, plus it was gigantic. Enjoy!ORIGINAL ARTICLE Jun. 25 2014 #rhinos #rhinoceros #white #black #mammals #tetrapod zoology #tet zoo #tetzoo #Darren Naish #ethan kocak 21 notes Carbon Dating » 107 Kocak Guest Strip ➔ I did a guest strip for CARBON DATING today. Yes, I know, anglerfish are not tetrapods. Your regularly scheduled Tet Zoo comic will be forthcoming. (Hoping to have it done by the end of the week).:) Jun. 10 2014 #science #comic #webcomic #kyle sanders #ethan kocak #anglerfish 7 notes"
