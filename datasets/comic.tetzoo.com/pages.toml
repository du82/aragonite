["https://comic.tetzoo.com/tagged/ethan%20kocak/page/1"]
title = "Tet Zoo Comic"
description = "Written by Darren Naish, drawn inaccurately by Ethan Kocak."
full_description = "White Rhinos (Part 2 of 3)!Original Article Jul. 9 2014 #rhino #rhinoceros #white #Darren Naish #ethan kocak #tet zoo #tetrapod zoology #tetzoo #mammals 13 notes WHITE RHINOS, PART 1:There are at least two more parts to this forthcoming. I decided to cut it up into parts because it was taking too long to finish it, plus it was gigantic. Enjoy!ORIGINAL ARTICLE Jun. 25 2014 #rhinos #rhinoceros #white #black #mammals #tetrapod zoology #tet zoo #tetzoo #Darren Naish #ethan kocak 21 notes Carbon Dating » 107 Kocak Guest Strip ➔ I did a guest strip for CARBON DATING today. Yes, I know, anglerfish are not tetrapods. Your regularly scheduled Tet Zoo comic will be forthcoming. (Hoping to have it done by the end of the week).:) Jun. 10 2014 #science #comic #webcomic #kyle sanders #ethan kocak #anglerfish 7 notes Bird Hands.Because everyone is required to appreciate that birds are still dinosaurs.For some stupid reason, Tumblr is not showing this comic on the main site, so I’ve mirrored it on my DA until I can fix it.Original Article. May. 27 2014 #Darren Naish #tetrapod zoology #tetzoo #tet zoo #ethan kocak #birds #hands #claws #manual claws #wings #dinosaurs #maniraptor #therapod 178 notes Toilet Sloths. Yes. That’s Right. Toilet Sloths.Original Article. May. 20 2014 #tet zoo #tetrapod zoology #tetzoo #Darren Naish #ethan kocak #sloth #sloths #2 toed sloth #two toed sloth #mammals #cartoons #comics #funny #poop #toilet 60 notes Where Are All the Dead Seamonsters?ORIGINAL ARTICLE HERESorry for the delay in getting an update out, but I tried to make it up by making this one really polished. Hope you guys dig it. May. 1 2014 #sea monsters #tet zoo #tetrapod zoology #tetzoo #Darren Naish #ethan kocak #cryptozoology #nessie #sea serpent #cryptid #undiscovered #marine #monster 273 notes GODZILLA DESTROY ALL TETRAPODS! This week on TetZoo Comic!ORIGINAL ARTICLE HERE Apr. 12 2014 #tetrapod zoology #tet zoo #tetzoo #Darren Naish #ethan kocak #godzilla #gino #zilla #speculative biology #speculative zoology 28 notes This week, it’s AXOLOTLS on TetZoo Comic! Yes, that’s right, CROSSOVER TIME!Darren’s Original Article HERE Apr. 6 2014 #axolotl #black mudpuppy #ethan kocak #Darren Naish #tet zoo #tetrapod zoology #salamanders #neotonic #mudpuppies 166 notes The Red Pandas of Ohio – Whackaloon Comments EditionThe original comment was HERE.It is duplicated verbatim in this comic, and as faithfully as possible, but we still have absolutely no idea what they were talking about. Enjoy! Mar. 24 2014 #red panda #lesser panda #tetrapod zoology #tet zoo #Darren Naish #ethan kocak #wtf #comments #trumpetlands #ohio 50 notes Didn’t have time to finish the longer one, so here’s something SHORT and SWEET about ‘gators.ORIGINAL HERE.Coming soon: Matamatas and the red pandas of Ohio. Mar. 11 2014 #tet zoo #tetrapod zoology #tetzoo #Darren Naish #ethan kocak #comics #webcomics #alligators #alligator #crocodilian #watermelon #melons #bite force 78 notes"
