aloon Comments EditionThe original comment was HERE.It is duplicated verbatim in this comic, and as faithfully as possible, but we still have absolutely no idea what they were talking about. Enjoy! Mar. 24 2014 #red panda #lesser panda #tetrapod zoology #tet zoo #Darren Naish #ethan kocak #wtf #comments #trumpetlands #ohio 50 notes Didn’t have time to finish the longer one, so here’s something SHORT and SWEET about ‘gators.ORIGINAL HERE.Coming soon: Matamatas and the red pandas of Ohio. Mar. 11 2014 #tet zoo #tetrapod zoology #tetzoo #Darren Naish #ethan kocak #comics #webcomics #alligators #alligator #crocodilian #watermelon #melons #bite force 78 notes Five Things You Didn’t Know About ArmadillosOriginal Article HEREEDIT: Fixed the weird Diamond Shaped ? symbols that came over from the original. Still cannot seem to remove the weird autospacing Tumblr inserts between every image. Mar. 3 2014 #Armadillos #Darren Naish #ethan kocak #tet zoo #tetzoo #tetrapod zoology 19 notes"
