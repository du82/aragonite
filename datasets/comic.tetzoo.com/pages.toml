full_description = "About Darren Naish is a science writer, technical editor and palaeozoologist (affiliated with the University of Southampton, UK). He mostly works on Cretaceous dinosaurs and pterosaurs but has an avid interest in all things tetrapod. His publications can be downloaded at http://darrennaish.wordpress.com. He has been blogging at Tetrapod Zoology since 2006. Check out the Tet Zoo podcast at tetzoo.com! Tetrapod Zoology is a blog hosted at Scientific American.Ethan Kocak is a cartoonist, previously known for The Black Mudpuppy, loved by literally sevens of fans.If you’re looking for the other Tet Zoo-themed webcomic on Tumblr, try HERE. Home About Questions? Archive Observer theme by Zack Sultan"
