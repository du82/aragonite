["https://commitlint.js.org/api/read.html"]
title = "@commitlint/read | commitlint"
description = "Lint commit messages"
full_description = '''@commitlint/read ​Read commit messages from a specified range or diskInstall ​shnpm install --save @commitlint/readSignature ​tstype Range = { /* Lower end of the commit range to read */ from: string; /* Upper end of the commit range to read */ to: string; /* Whether (boolean) to read from ./.git/COMMIT_EDITMSG or where to read from (string) */ edit?: boolean | string; }; read(range: Range) => Promise<string[]>Import ​jsimport read from '@commitlint/read';Examples ​Consider to have a repository with two commits:Initial commitI did somethingUsing edit: true ​jsconst result = await read({edit: true}); console.info(result); // => ['I did something\n\n']Read last two commits ​jsconst result = await read({from: 'HEAD~2'}); console.info(result); // => ['I did something\n\n', 'Initial commit\n\n']Read commits within a range ​jsconst result = await read({from: 'HEAD~2', to: 'HEAD~1'}); console.info(result); // => ['Initial commit\n\n']Read commit message from git gui file ​jsconst result = await read({edit: './git/GITGUI_EDITMESSAGE'}); console.info(result); // => ['I did something via git gui\n\n']'''
