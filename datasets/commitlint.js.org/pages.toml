nd in valuerule: alwaysvaluetext[]NOTEThis rule always passes if no scopes are provided in the message or the value > is an empty array.When set to always, all message scopes must be found in the value.When set to never, none of the message scopes can be found in the value.scope-case ​condition: scope is in case valuerule: alwaysvaluetext'lower-case'possible valuesjs[ 'lower-case', // default 'upper-case', // UPPERCASE 'camel-case', // camelCase 'kebab-case', // kebab-case 'pascal-case', // PascalCase 'sentence-case', // Sentence case 'snake-case', // snake_case 'start-case', // Start Case ];scope-empty ​condition: scope is emptyrule: neverscope-max-length ​condition: scope has value or less charactersrule: alwaysvaluetextInfinityscope-min-length ​condition: scope has value or more charactersrule: alwaysvaluetext0subject-case ​condition: subject is in case valuerule: alwaysvaluejs['sentence-case', 'start-case', 'pascal-case', 'upper-case'];possible valuesjs[ 'lower-case', // lower case 'upper-case', // UPPERCASE 'camel-case', // camelCase 'kebab-case', // kebab-case 'pascal-case', // PascalCase 'sentence-case', // Sentence case 'snake-case', // snake_case 'start-case', // Start Case ];subject-empty ​condition: subject is emptyrule: neversubject-full-stop ​condition: subject ends with valuerule: nevervaluetext'.'subject-max-length ​condition: subject has value or less charactersrule: alwaysvaluetextInfinitysubject-min-length ​condition: subject has value or more charactersrule: alwaysvaluetext0subject-exclamation-mark ​condition: subject has exclamation before the : markerrule: nevertype-enum ​condition: type is found in valuerule: alwaysvaluejs[ 'build', 'chore', 'ci', 'docs', 'feat', 'fix', 'perf', 'refactor', 'revert', 'style', 'test', ];type-case ​description: type is in case valuerule: alwaysvaluetext'lower-case'possible valuesjs[ 'lower-case', // default 'upper-case', // UPPERCASE 'camel-case', // camelCase 'kebab-case', // kebab-case 'pascal-case', // PascalCase 'sentence-case', // Sentence case 'snake-case', // snake_case 'start-case', // Start Case ];type-empty ​condition: type is emptyrule: nevertype-max-length ​condition: type has value or less charactersrule: alwaysvaluetextInfinitytype-min-length ​condition: type has value or more charactersrule: alwaysvaluetext0signed-off-by ​condition: message has valuerule: alwaysvaluetext'Signed-off-by:'trailer-exists ​condition: message has trailer valuerule: alwaysvaluetext'Signed-off-by:'"
