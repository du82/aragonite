full_description = 'Concept: Commit conventions ​Commit conventions allow your team to add more semantic meaning to your git history. This e.g. includes type, scope or breaking changes.With this additional information tools can derive useful human-readable information for releases of your project. Some examples areAutomated, rich changelogsAutomatic version bumpsFilter for test harnesses to runThe most common commit conventions follow this pattern:texttype(scope?): subject body? footer?Multiple scopes ​Commitlint supports multiple scopes. Current delimiter options are:"/""\"","'
