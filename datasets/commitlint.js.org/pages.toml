title = "Troubleshooting | commitlint"
description = "Lint commit messages"
full_description = "Troubleshooting ​Getting Range error: Found invalid rule names: [...] after update ​After updating one or more @commitlint packages you might encounter an error like:textFound invalid rule names: header-trim. Supported rule names are: body-case, body-empty, ...The source of this error is likely a mismatch of version between @commitlint packages in node_modules.E.g.: you might have a config requesting a rule that is not included in @commitlint/rules.TIPIf you are relying on a config which depends on an earlier version of @commitlint/config-conventional be sure to update them:shnpm update @commitlint/config-conventionalNOTEDetailed explanation about the error can be found in this comment."
