["https://commitlint.js.org/guides/use-prompt.html"]
title = "Guide: Use prompt | commitlint"
description = "Lint commit messages"
full_description = '''Guide: Use prompt ​@commitlint/prompt-cli helps with fast authoring of commit messages and ensures they adhere to the commit convention configured in commitlint.config.js.Install ​Create a git repository if neededshgit initCreate a package.json if neededshnpm initInstall and configure if neededshnpm install --save-dev @commitlint/{cli,config-conventional,prompt-cli} echo "export default { extends: ['@commitlint/config-conventional'] };" > commitlint.config.jsProvide a shortcut ​To make prompt-cli easy to use, add a npm run-script to your package.jsonjson{ "scripts": { "commit": "commit" } }12345Test the prompt by executingbashgit add . npm run commitAn alternative to @commitlint/prompt-cli: commitizen ​Another way to author commit messages that adhere to the commit convention configured in commitlint.config.js is to use commitizen. For more information, checkout their official website.commitlint provides two adapters for commitizen:@commitlint/prompt provides a way to interact same as @commitlint/prompt-cli@commitlint/cz-commitlint is inspired by cz-conventional-changelog, it provides a more modern way to interact.'''
