art created by most other popular painting and graphics programs. 2024-12-22 English Commodore 64 7.93 MB 39 Download Personal Publisher v1.3 [GEOS] Personal Publisher gives you the capabilities to enter the world of desktop publishing now. You can create newsletters, flyers, ads, awards, presentations, cards, announcements and more. With Personal Publisher you can combine text, graphics and page layout so your documents will look like they were created by a professional graphic designer. Inside this archive are two disk images. One image is the original as archived by Allan Pinkerton, and needs to have all the files on the disk converted to GEOS format with Convert 2.5. The other disk image has all the files already converted and ready to go. Here's a link to the manual. 2021-10-31 English Commodore 64 85.81 KB 508 Download PostPrint - the final word in GEOS PostScript printing NEW PostPrint - the final word in GEOS PostScript printing 2025-02-17 English Commodore 64 330.25 KB 14 Download The geoPublish Compendium NEW "A guide to using geoPublish with a laser printer, even if you don't own one!" 2025-02-14 English PDF 2.04 MB 21 Download Back'''
