full_description = '''Overview Search Up Category: Graphics Printing Tools Downloads: 13 1520 Doodle Dump Nothing special here, a compiled BASIC program that will print out a Doodle graphic file to a Commodore 1520 Plotter. 2015-04-02 English Commodore 64 5.86 KB 719 Download 1526 Doodle Print Pretty simple utility that prints a Doodle Paint image to a Commodore 1526 Printer. Simply load the Doodle image and then load this utility and run. 2015-04-02 English Commodore 64 1.5 KB 666 Download Bumper Sticker Maker v1.1 Bumper Sticker Maker v1.1 by C. Larvin (Intracorp 1987) - I have a facination with all things printer related when it comes to the Commodore 64 and this fits the bill. This is kind of like a trimmed down PrintShop with one big advantage; you can create your own artwork. There is a small .docs file on the disk that tells you how to navigate the program and how to change printers, everything else is pretty self explanatory. 2023-07-16 English Commodore 64 52.99 KB 153 Download Epyx Graphics Scrapbook Chapter III - School [Print Master] Epyx Graphics Scrapbook Chapter III - School [Print Master] - So I found this disk in a collection I've been imaging and never knew it existed. Apparently Epyx released three of these scrap books which were double sided disks with PrintShop graphics on one side and PrintMaster on the other. Unfortunately I only have the PrintMaster side. If you have any of the other Scapbooks and want to share, please let me know with the Contact Us link in the menu. 2024-11-28 English Commodore 64 60.76 KB 29 Download Epyx PrintMaster Graphics Scrapbook - Chapter 1: Sports NEW Epyx PrintMaster Graphics Scrapbook - Chapter 1: Sports - This is a collection of graphics for the PrintMaster program on the Commodore 64. Sorry, I don't have any additional information as I haven't located any box art or documentation yet. Thanks Bruce T. for filling this "Wanted" request. 2025-02-23 English Commodore 64 30.42 KB 12 Download Epyx PrintShop Graphics Scrapbook - Chapter 1: Sports NEW Epyx PrintShop Graphics Scrapbook - Chapter 1: Sports - This is a collection of graphics for the PrintShop program on the Commodore 64. Sorry, I don't have any additional information as I haven't located any box art or documentation yet. Thanks Bruce T. for filling this "Wanted" request. 2025-02-23 English Commodore 64 29.42 KB 12 Download Epyx PrintShop Graphics Scrapbook - Chapter 2: Off The Wall NEW Introducing the Graphics Scrapbook, an entire collection of graphics each covering a different theme. Create cards, signs, invitations, stationery and banners using the Graphics Scrapbook and The Print Shop or PrintMaster. Over 100 impressively drawn images on each disk! Chapter II, OFF THE WALL lies somewhere just this side of outrageousness, and occasionally rolls right over it. High tech. Holidays. Punkers and punks. Jesters, party animals, not to mention a few simply bizarre animals. Even your very favorite body parts. Nothing’s been spared the weird, often warped view of our Off The Wall artists. Don’t believe it? Look inside and see for yourself. We dare you. Thanks Bruce T. for filling this "Wanted" request. 2025-02-23 English Commodore 64 32.79 KB 13 Download Epyx PrintShop Graphics Scrapbook - Chapter 3: School NEW Introducing the Graphics Scrapbook an entire collection of graphics each covering a different theme. Create cards, signs, invitations, stationery and banners using Graphics Scrapbook and The Print Shop and PrintMaster. Over 100 impressively drawn images on each disk. Chapter III: SCHOOL covers every angle from geometry to driver’s ed. From New Year’s Day to birthdays. From raising funds to raising the roof. From campus elections to field trips. Whether you’re a teacher or student, you’ll have ready-made artwork on cheerleading, finals, graduation, proms, plays and dozens of other subjects. Look inside and see for yourself. Thanks Bruce T. for filling this "Wanted" request. 2025-02-23 English Commodore 64 44.92 KB 13 Download Gallery View 5.0 Gallery View v5.0 was written by David R. Sawyer and released in 1985/86. This program is used to view and print pictures from the Q-Link Photo Gallery. Works with any Commodore compatible printer. 2015-10-11 English Commodore 64 8.76 KB 671 Download Hardcopy MPS 802 Very little info on this graphics printing program which was cracked by Cracksel and released in early 1985. Wish I could tell you more but I don't even know what graphics formats the program will work with. It appears by the name that it's designed for the Commodore MPS 802 printer. I Guess you'll have to experiment. 2015-10-13 English Commodore 64 5.03 KB 707 Download Print Shop Graphics Printer v2.30 Print Shop Graphics Printer v2.30 by R.C. Davis (January, 1987) - Found this program on the BPUG 87 Public Domain disk. With this utility, you can print out all or some of the graphics images on a Print Shop disk to either a Commodore 1525 or and Epson printer. 2024-11-28 English Commodore 64 4.7 KB 27 Download Printscreen-64 Printscreen-64 is a neat utility that sits in the background and can print out any screen that's displayed by hitting the key combo c= / restore. The program has built-in support for the 1525 printer, but you can also customize the program to print with virtually any printer. 2023-07-25 English Commodore 64 3.71 KB 175 Download Screen Dump Written by F.C. Colosimo & M.J. Kozakiewicz - Screen Dump is an interupt driven routine which checks the F1 key 60 times a second. If detected it prints the contents of the screen to the printer.Docs are on the disk. Sys 49152 to start the program. 2015-03-08 English Commodore 64 2.42 KB 708 Download Back'''
