full_description = '''Overview Search Up Category: Hardware Manuals [C64] Downloads: Page 1 of 3 1 2 3 Downloads: 118 1541 Flash! for the SX-64 Manual Congratulations on purchasing SX-64 FLASHI Assembly, the fastest add on assembly for disk loading programs and files from the Commodore SX-64 disk drive. In addition to being the fastest disk drive enhancement available for the Commodore SX-64, over 50 added commands are included. These commands will make using your Commodore SX-64 much faster and easier. It is not necessary that you learn or use these commands. Install the SX-64 FLASHI Assembly and enjoy a whole new world of speed. 2025-01-05 English PDF 7.33 MB 27 Download 1541 Ultimate Docs (12-20-2018) HOT This 60 page doc covers all three of the 1541 Ultimate units (1541u, 1541u II, 1541u II+). 2019-01-20 English Windows 3.69 MB 3,186 Download 1541 Ultimate ii/ii+ & Ultimate 64 Docs [03-30-2020] HOT This documentation is basically for all three of Gideon's supported hardware [1541 Ultimate II, 1541 Ultimate II+ & Ultimate 64] projects using firmware up to v3.7 (Which is 1.28 on the Ultimate 64). Anyway, you can find the most current documentation here online. The reason I put snapshots of it online is because someday (possibly) someone will want to look back and see the progression of this awesome piece of hardware. 2020-05-19 English PDF 10.22 MB 1,138 Download ARM2SID Quick Installation Guide ARM2SID is a new replacement for 2 Commodore SID music chips and more. ARM2SID is a bigger brother of our well known ARMSID, which is a real "plug & play" solution and fully replaces both the MOS6581 and MOS8580 chips.ARM2SID comes whenever 2 SID chips are needed, usually for stereo. If you have 2 SID sockets, just place the ARM2SID in the primary socket, SID2 in the secondary socket, connect both of them with the provided 5 or 10 cm cable, configure with the provided C64/C128 utility and go.If you have just one socket and are not afraid of soldering, you can get even more. Use the provided connector cable, connect the 6 wires to your C64/C128 and you get the 2nd SID for stereo, the 3rd SID for 3SID music and OPL FM synthesis compatible with FM Sound Expander!Enjoy your ARM2SID! 2022-12-28 English PDF 1.04 MB 513 Download B.I. 80 Column Display Manual We believe that BI-80 is the best 80 column display available for the Commodore 64. BI-80 provides a crystal clear 80 column display and powerful Basic 4.0 language extension. BI-80 Installs easily and Is compatible with many programs Including the PaperCllp64 wordprocessor and the Consultant database. 2025-01-04 English PDF 1.47 MB 19 Download Blue Chip D12/10 Daisy Wheel Printer User's Guide Despite rumors of a forthcoming 'paperless' society brought about by the innovations of electronics technology, computer user of today still derive much satisfaction and have great need for seeing the results of their efforts on a hard copy printout. This introductory section is provided to offer some general observations on what printers are and how they work. It is intended as an introduction for novice users and a base upon which they can expand their knowledge. 2021-11-25 English PDF 8.61 MB 723 Download Blue Chip M120/10 Printer Owner's Manual This printer is an attractive, efficient, and versatile printer. The wide variation of character sets and its sufficient function capability allows you to print text and graphic in a wide range of different print styles. The printer is designed to operate through software control, supplied from the any general purpose micro-computer, personal computer, office computer, etc. that has provision of printing data out-put that shouldconform with this specification. Thanks Anthony for providing this manual. 2024-03-13 English PDF 1.99 MB 181 Download Blue Chip Printer Interface Manual Congratulations on your purchase of the Commodore Inlerface by Blue Chip Electronics. Your Commodore Interface lets you use your M120/10 personal prinler with the VIC-20 or C-64 Computers by Commodore. The Commodore Interface features easy·to-use print modes. Please 'read this manual completely before attempting to use your new interface. * Thanks Anthony for sending over this scan. 2024-05-05 English PDF 109.15 KB 126 Download C2N Tape Drive Operating Instructions Your Model C2N Tape Cassette will enable you to expand the input and output (110) capabilities of your PET. CBM or VIC Computer. The software for using the cassette is already built into your computer. Please reference the appropriate Computer User Manual for detailed operating instructions. 2024-10-29 English PDF 577.74 KB 61 Download Cannon BJ-200e Printer User's Manual Cannon BJ-200e Printer User's Manual 2021-01-26 English PDF 2.22 MB 846 Download Cardco Card/? A (Card/Print) Manual The "CARD/?" (CARD/PRINT) printer interface was designed to all you to add any parallel printer to your VIC-20 or C-64 computer. The design objective was to provide you with a system that would so closelyduplicate the functions of the VIC printers that you would be able to run available software without any changes. To accomplish this task, and still allow you to make use of the special features available in today'shigh quality printers, required some special approaches to solving simple problems. 2024-10-27 English PDF 1.06 MB 51 Download Cardco Cardboard/5 Manual Simply put, the "CARDBOARD/5 " is a parallel extension of the Commodore 64's game port. In other words, by using "CARDBOARD/5," you can switch cartridges without physically pulling them out and plugging their, in one at a time. 2025-01-04 English PDF 3.9 MB 22 Download CardCo CardPrint +G Within the text of this manual references are made to many printers and printer types. The C/?+G interface was intended to be used only with printers that conform to certain standards. There are four groups of printers that are intended to be used with the C/?+G interface. Within each group there may be many printers. The four groups are the Epson group, the Prowriter group, the Okidata group and the Siekosha group. A listing of the most common printers in each group is on page A1 of the appendix of this manual. When, in this manual, we refer to one of the printers in a group the statement will refer to all printers in that group. If your printer isn't listed in one of those groups it may still be in one of them, we just aren't aware of it. If this is the case and you find that your printer works when set up like one of the printers in one of the groups, please let us know so we can pass on the information to other users. Any printer can be used with the C/?+G (See page A1 of the appendix for OTHER PRINTERS) but the special Commodore functions and Commodore graphics will not be available. 2024-10-27 English Commodore 64 3.47 MB 64 Download CardCo CardPrint +G Manual Supplement This is some additional manual information for the CardCo Card/Print +G printer interface. 2024-10-29 English PDF 70.74 KB 48 Download CardCo CardPrint A Manual Addendum CardCo Card/Print (A) - Instruction Manual corrections and additions 2024-10-29 English PDF 141.33 KB 54 Download Cardco Cardriter Light Pen Instructions This manual and the programs on the cassette show you how to use the Cardriter 1 Light Pen for selecting items from a menu, for responding to prompts, for answering multiple-choice questions, and for playing games. We'll also give you details on programming for the light pen and on how the pen works. 2020-05-27 English PDF 17.6 MB 883 Download Cardco G-Wiz Parallel Printer Interface Manual The G-WIZ printer interface was designed to allow you to add most parallel printers to your Commodore computer. The design objective was to provide you with a system that would so closely duplicate the functions of the VIC printers that you would be able to run available software without any changes. To accomplish this task, and still allow you to make use of the special features available in today's high quality printers, required some special approaches to solving simple problems. If you plan to write your own programs or customize existing software to enable the use of special features of your printer this manual should become your companion and best friend. We have tried in this manual to document and fully explain each and every feature and function of our interface and how it will affect the operation of your system. We have provided examples and sample programs in an attempt to make each function understandable and useful to even a novice programmer. 2025-01-05 English Commodore 64 4.38 MB 25 Download CBUS I (Cartridge Backup System) Manual CBUS stands for Cartridge Back-Up System. CBUS I produces backup copies of cartridges for the Commodore 64. Using CBUS I saves wear and tear on ths Commodore 64 expansion connector by tricking the computer into running an image of the cartridge without having the cartridge physically present. Up to 17 cartridges can be stored on a single diskettae. With CBUS I, cartridges can be storad out of harms way rather than cluttering up the work area. CBUS I incorporates a RESET switch allowing you to perform a COLD Start without having to turn the machine off and on again. This permits study of cartridge object code, opening up the possibility of custom modifications. 2022-11-05 English PDF 1008.61 KB 376 Download Citizen 2-Color Computer Printer Instruction Manual The CITIZEN Advanced High Speed Dot Matrix 2-COLOR Computer Printer Expands your Commodore VIC-20 or 64 into a word and data processing system. 2025-01-05 English PDF 891.29 KB 21 Download CMD 1750 / 1750XL User's Guide & Programmer's Reference Congratulations on your purchase! Your new CMD RAM Expansion Unit (REU) will provide you with the increased RAM capacity necessary to take full advantage of many of the high-powered applications that offer REU support We hope that your new REU will greatly improve the speed and functionality of your Commodore C-64 or C-128 computer, and also act as a vehicle through which you will support the manufacturers and authors of new programs. 2024-11-23 English PDF 10.99 MB 67 Download CMD EX3 and EX2+1 Cartridge Port Expanders Manual CMD EX3 and EX2+1 Cartridge Port Expanders manual. 2025-01-04 English PDF 2 MB 32 Download CMD FD Series Floppy Drive User's Manual [4th Edition] HOT The CMD FD-2000 and FD-4000 are 3.5 inch floppy disk drives which have been designed utilizing the latest in micro-floppy technology. While retaining backward compatibility with Commodore 1581 formatted diskettes(800K), these drives are also capable of utilizing high density (HD) disks fora storage capacity of up to 1.6 Megabytes. The FD-4000 model can also use the newer enhanced density (ED) diskettes for a storage capacity of up to 3.2 Megabytes. 2021-02-16 English PDF 4.34 MB 1,443 Download CMD HD User's Manual HOT The CMD HD has been designed to be the easiest-to-use hard drive system available for Commodore 64 and 128 computers. 2021-01-15 English PDF 6.57 MB 1,494 Download CMD RAMDrive Manual RAMDrive is a portable RAM disk for the Commodore 64 and 128 series computers. Some of the standard features include built-in JiffyDOS Kemal routines, an external power supply, and a built in rechargeable battery backup unit. Compatibility with the widest possible range of software products has been incorporated through the installable RD DOS system software. 2024-11-23 English PDF 51.36 MB 58 Download CMD RAMLink User's Manual 3rd Edition (1991 ) RAMLink extends the capabilities and compatibility of RAM expansion units for the Commodore 64 and 128 series of computers. You may also use RAMLink as a compatible RAM disk by installing RAM internally. Other benefits include built-in JiffyDOS Kernal routines, a parallel hard drive interface for the CMD HD series, an external power supply, and an optional battery backup unit. Compatibility with the widest possible range of software products has been incorporated plus many special features and the capability to expand storage space used by the system. 2024-08-11 English PDF 117.01 MB 114 Download CMD RAMLink User's Manual 4th Edition (1993) HOT CMD RAMLink extends the capabilities and compatibility of RAM expansion units for the Commodore 64 and 128 series of computers. 2021-01-15 English PDF 12.85 MB 1,254 Download CMD SuperCPU 128 V2 Manual HOT Manual for the CMD SuperCPU 128 V2 Accelerator for the Commodore 128. 2016-10-24 English PDF 30.48 MB 1,601 Download CMD SuperRAM Installation Guide The CMD SuperRAM card is an add-in card for the CMD SuperCPU 64 and SuperCPU 128 accelerator cartridges. This card will allow the addition of 1,4,8 or 16 Megabytes of RAM which the 65816 processor of the SuperCPU can directly address. A single SIMM (Single Inline Memory Module) socket on the SuperRAM circuit board provides this expandability using standard 72-pin fast-page mode SIMM modules. 2025-01-06 English PDF 1.29 MB 32 Download CMD SwiftLink-232 Interface Instructions Thank you for purchasing a SwiftLink-232 serial cartridge! This cartridge contains a 6551 ACIA (Asynchronous Communication Interface Adapter) chip, which allows your computer to communicate with RS-232 serial devices (like modems and printers) at speeds far greater than before. The 6551 is part of the same family of chips (65XX/85XX) found in the Commodore 64 and 128. In fact, the C-64/128’s operating system emulates the 6551. When used with appropriate terminal software, this cartridge allows you to communicate at speeds from 300 bps to 38,400 bps. 2025-01-05 English PDF 58.16 KB 32 Download CMD Turbo232 Interface User's Guide The Turbo232 cartridge is a high-speed RS-232c modem interface which allows you to connect standard external modems to your Commodore 64 or 128 computer. When used with appropriate terminal software, this cartridge allows you to connect to communications networks at speeds up to 230,400 bps (230Kbps). The interface plugs easily into the cartridge port of any Commodore 64 or 128 computer, and provides an industry standard DB-9 port for attaching external modems. 2025-01-05 English PDF 175.52 KB 30 Download CMD Turbo232 User's Guide The Turbo232 cartridge is a high-speed RS-232c modem interface which allows you to connect standard external modems to your Commodore 64 or 128 computer. When used with appropriate terminal software, this cartridge allows you to connect to communications networks at speeds up to 230,400 bps (230Kbps). The interface plugs easily into the cartridge port of any Commodore 64 or 128 computer, and provides an industry standard DB-9 port for attaching external modems. 2023-09-30 English PDF 3.81 MB 283 Download Commodore 128 40/80 Column Video Adapter v5.1 Manual I have one of these adapters and although it's not the 5.1 version, I figure someone else might benefit from the manual, so here it is. Find much more info here. 2022-11-05 English PDF 444.02 KB 466 Download Commodore 1350 Mouse User's Manual The Commodore 1350 Mouse is a controller designed for use with the Commodore'''
