["https://commodore.software/downloads/category/10-basic-extensions"]
title = "Commodore Software - BASIC Extensions"
description = "Commodore 64 & 128 applications, utilities, tools and more!"
full_description = '''Overview Search Up Category: BASIC Extensions Downloads: 33 Applesoft Basic HOT By David Young. Applesoft Basic adds several commands for working with graphics. The commands are outlined when you start the program. 2015-04-11 English Commodore 64 10.93 KB 1,726 Download Apsoft-64 ApSoft-64 is a powerful extension to the resident Commodore 64 BASIC. It incorporates a 1541 program loader which speeds up loading of programs by a factor of 5. It also adds 45easy-to-use-and-understand BASIC commands. These commands are in the same format as Applesoft BASIC for the Apple ] [ family of computers. ApSoft-64 therefore gives the Commodore 64 owner a greatly expanded base of available software in addition toincreasing his or her programming power. Link to the Manual 2021-07-11 English Commodore 64 7.65 KB 740 Download BASIC 3.5 Extension HOT BASIC 3.5 is an extension released by 64'er Magazine back the June 1990 Issue that allows running Commodore BASIC v3.5 programs on a Commodore 64. While doing some searching on this extension, I ran across an interesting post on StackExchange that describes a couple ways to autoload/wedge you programs so they load the extension automatically and continue to run. Here's a link for the curious. 2020-05-17 English Commodore 64 12.9 KB 1,349 Download BASIC Expanded v4.5 HOT BASIC Expanded v4.5 - Released by Slayer of The Canibals in 1993. This extension to BASIC has several features for graphics, scrolling and playing music (Sids). Check out the demo program on the disk for more info. 2017-10-01 English Commodore 64 10.68 KB 1,745 Download BASIC Lightning v1.2 HOT BASIC Lightning v1.2 by David Hunter is an extension to the CBM64's resident BASIC interpreter which adds over 150 commands. The additional commands cover three main areas: structured programming, graphics and sound. One of BASIC LIGHTNING'S most powerful features is the ability to multi-task; up to five parts of a BASIC program can be run at once. A compiler for BASIC LIGHTNING will be available in early 1985 which will produce "stand-alone" compiled programs. Inside the archive is the complete PDF manual. 2017-08-27 English Commodore 64 5.61 MB 2,078 Download BBC Basic II v0.23 HOT Aztec Software produced a version of BBC BASIC for the Commodore 64 in the 1980s. It was written by Julian Gardner who wrote their Turbo Basic and Turbo Basic Compiler. The released software seems very much an unfinished development demo. 2015-04-11 English Commodore 64 26.77 KB 1,431 Download Business BASIC 64 HOT This one is a bit of a mystery. I've found two references to Business BASIC on the net. One is from the C64-Wiki that states this extension was by Kingsoft in 1985 and is also known as S'MORE Basic. The other reference also by the C64-Wiki says "There is a module extension known as Business Basic for the C64 or the C64 Basic V3.5 implementation published in 64'er Magazin 6/90 to get BASIC 3.5 capabilities on a C64 hardware.". I'm guessing this is the later, but since I can't read German you'll have to investigate this for yourself. 2020-05-31 English Commodore 64 9.17 KB 997 Download C64 - BASIC 4.0 HOT BASIC 4.0 for the Commodore 64. This BASIC extension has the ability to be loaded into two different areas of RAM. Included in the archive are two reference books for BASIC 4.0 2015-04-24 English Commodore 64 9.85 MB 3,934 Download DotBASIC v2.2 HOT DotBASIC is an extension to BASIC that add's over 100 commands making it super easy to create graphical interfaces with complete mouse control. This is a MUST HAVE extension if you program in basic. Full Docs and extra library's are included. 2015-04-11 English Commodore 64 2.41 MB 1,863 Download Drago BASIC v2.2 HOT Drago BASIC v2.2 by Cross-Soft - One of our kind visitors shared some details about this BASIC extension that's geared towards 3D graphics animation. Version 2.0 of this software was published in a special issue of a Polish magazine called Bajtek sometime in 1987-88. Version 2.2 appears to be nearly the same, and accepts the same commands as that published in the magazine. Here's a link to the magazine article. Thanks Al! 2017-04-24 English Commodore 64 5.55 KB 1,339 Download EfexBASIC v1.0 NEW EfexBASIC v1.0 by Mark Hanzen (1990) is a neat extension for Commodore 64 BASIC that adds a bunch of screen related commands that give you different effects like clearing the screen with a vertical swipe, or fading out the characters on the screen. All in all there are 12 new commands to make your BASIC program pop with a little flair. The help screen you see when first starting the extension is all you need to start using the new commands. 2025-02-25 English Commodore 64 3.1 KB 11 Download Evs Basic v1.00 HOT 1988 by Anton Treuenfels. Eve Basic is a BASIC 2.0 language extension, adding more than 40 new keywords covering bitmapped graphics, sprites, sound, strings, i/o, disk control, etc. Full docs are on disk with demo programs. 2015-04-12 English Commodore 64 42.94 KB 1,479 Download GameBASIC v1.1 HOT GameBASIC v1.1 - Released in 1991 by MR-Soft. GameBASIC is an extension to Commodore 64 BASIC 2.0 designed for creating games. Originally released in the German 64er magazine issue 73, I believe this is an updated version. Included in the archive is the original magazine article and an additional artice about programming with GameBASIC. Both articles are in German. Also included is a game and demp written in GameBASIC. 2020-11-16 English Commodore 64 7.11 MB 1,138 Download Graphics Basic v1.07 HOT 1983 Hes, Written by Ron Gilbert and Tom McFarlane. Graphics BASIC adds over 100 new commands to the BASIC language, providing an easy-to-use API to the relatively advanced (at the time) graphics and sound hardware capabilities of the Commodore 64. 2015-04-12 English Commodore 64 12.44 KB 1,755 Download Hires-Master v1.0 Hires-Master v1.0 - This is a an extension to the Commodore 64 BASIC 2.0 that adds some graphics commands. Originally I thought this came from a disk magazine called Commodisk, in particular issue #35, but that doesn't seem to be the case. I don't have any information on this extension, but there is a demo program on the disk that you can examine to see some of the new commands. 2023-07-16 English Commodore 64 10.52 KB 280 Download Laser Basic v1.3 HOT Laser BASIC is an easy to use and versatile utility which lets you make full use of the Commodore 64's outstanding graphics capabilities without using machine code. Although it was originally designed with video games in mind, it can be used in any application which requires high quality graphics. The full manual can be found at http://bombjack.org/commodore 2015-04-12 English Commodore 64 82.61 KB 2,119 Download MetaBASIC HOT MetaBASIC is an extension to Commodore BASIC that will change the way you program. It adds 32 new debugging and testing commands to Commodore 64 BASIC, working by itself or in conjunction with a machine language monitor/assembler. Here's a link to the manual. 2020-05-29 English Commodore 64 4.28 KB 1,120 Download MetaBASIC 128 HOT "MetaBASIC 128," (Released in Compute!'s Gazette February 1987) will change the way you program. It adds 11 new debugging and testing commands to BASIC 7.0-and these commands are instantly at your fingertips for programming sessions. Here's a link to the documentation. 2020-05-30 English Commodore 128 2.19 KB 1,144 Download MetaBASIC Plus HOT "MetaBASIC Plus" (Released in Compute!'s Gazette February 1987) is a companion program to "MetaBASIC 64." It adds 11 new commands and modifies HELP to print the new MetaBASIC Plus commands in addition to the original MetaBASIC commands. Please read the docs because you have to merge this into MetaBASIC 64 which is included in this archive. 2020-05-30 English Commodore 64 6.97 KB 969 Download ModemBASIC v1.2 HOT ModemBASIC is a utility which allows programing bulletin board systems and terminal programs with the ease of BASIC and the speed of machine language. ModemBASIC adds 23 commands and functions to BASIC as well as a DOS wedge with an additional 7 commands, enhanced floating point routines, and a new cursor. Full docs are included in the archive. 2020-05-30 English Commodore 64 11 KB 955 Download Northcastle Stuctured BASIC v1.7 Northcastle Structured BASIC v1.7 by Mike Roche (June 1984) - This is very similar to Waterloo BASIC, in fact it will run most programs written for Waterloo. I found a nice article about this language in issue 23 of TPUG Magazine (May 1986). Included on the disk is several versions that can be loaded into different parts of memory so it can co-exist with other utilities. There is also instructions, source code (written in PAL assembler) and several sample programs. I would consider this a complete package. 2022-10-30 English Commodore 64 33.11 KB 389 Download Pegasus Basic v4.0 Pegasus Basic v4.0 by Juli, 1989 - This is a really cool extension to BASIC. It's cool because it not only adds a bunch of graphics related commands, it also adds many utility type commands. On top of that, it has some nice improvements to the basic editor. There are a half dozen sample programs included on the disk and an English translation of the manual (Blame me if there are any inaccuracies, I ran it through the DeepL translator, then went back and transposed some wording). Big thank you to a couple of our visitors (BlueCursor & Markus), for pointing me in the direction of the source of this fine extension (and sharing an additional English translation of the manual), which is the February 1991 issue of Magic Disk 64. Here is a link to a nice site that has all the Magic Disk textual content converted to HTML. 2023-04-26 English Commodore 64 572.6 KB 353 Download SEMBERIA BASIC SEMBERIA BASIC is an extension to the built-in BASIC of the Commodore 64 that adds 27 new commands and has the ability to be appended to your program so that the extension doesn't need to be loaded beforehand. Additionally, the extension includes the source code so that you can modify any commands as needed. The author of the SEMBERIA extension is prof. Samir Ribić, Ph.D. from Sarajevo, Bosnia and Herzegovina. Included in the archive is a .d64 image, a .tap image, source code and complete manual. The original source and announcement for this program is this post on the Lemon64 Forum. 2024-07-28 English Commodore 64 240.14 KB 105 Download Simon's Basic v3.1 HOT Simons' BASIC adds 114 additional keywords to BASIC 2.0. These included commands to ease the coding of sprites, high-resolution and multi-color graphics, and sound. 2015-04-12 English Commodore 64 12.17 KB 3,883 Download Speedloader 1530 HOT Speedloader 1530 looks to be a BASIC extension, but on the other hand it sounds like a fast loader for the Commodore 1530 cassette drive. Maybe it's both. 2015-05-09 English Commodore 64 4.3 KB 1,289 Download Sprite Basic NEW Sprite Basic is an extension for Commodore 64 BASIC that adds three commands for dealing with sprites more easily. This extension was published in the December 1983 issue of Compute!s Gazette. Here is the description for the program from the magazine: If you've always wanted to create sprites on your Commodore 64, but have been put off by all the complicated POKEs, this article is your answer. It lets you modify BASIC to add three new sprite commands to make the job much easier. An accompanying side article also explains the rudiments of sprite design. 2025-02-25 English Commodore 64 2 KB 11 Download Super Basic 2 HOT This looks like a nice extension for BASIC but I can't find much information on it beyond the command summary that is included on the disk. 2015-04-12 English Commodore 64 10.95 KB 1,446 Download Super Expander 64 [CRT] HOT The SUPER EXPANDER 64 is a cartridge based program that adds 21 new commands and 11 new built-in functions to the BASIC language in your Commodore 64. As you will notice from the screenshot, you lose a bit of memory from the top of BASIC. Here is a link to the manual. 2020-07-02 English Commodore 64 6.52 KB 1,570 Download Super Sprite [Plus4] HOT Super sprite allows you the control of up to eight sprites under BASIC control. Each sprite is 16 pixels by 16 pixels and can move over or under characters on the text screen. The sprites can be any one of the 121 colours available to you on the C16 / PLUS4. They can even be set to flash!!! Documentation is included in the archive. 2018-05-17 English Plus 4 35.61 KB 1,457 Download The Tool The Tool or The Tool-64 by Tri Micro (also distributed by Handic) is a BASIC extension for the Commodore 64 that has many handy instructions. Most deal with the screen and cursor manipulation, but also some utilitarian features such as program renumbering and string manipulation. I want to thank Matt C. for this bit copy which he made with nibtools and a modded 1541. Although there are a couple other postings of this tool on the site, none are of a clean full version of the original floppy. If you are interested in additional information (manual and cartridge image) along with applications and demos that are related to The Tool, check here. 2024-04-30 English Commodore 64 181.13 KB 133 Download The Tool-64 HOT Micro-Application - I don't have much information on this BASIC extension. It was originally a cartridge and was released in 1983. This file is an Isepic'd version of the code. If you can shed some light on this extension, please send me an email. 2015-04-11 English Commodore 64 9.56 KB 1,362 Download UltraBASIC-64 HOT UltraBASIC-64 by Roy Wainwright is an extension for Commodore BASIC that adds 50 powerful commands to the Commodore 64. Originally released by Adamsoft, it was later distributed by Abacus. Included in the archive is a demo and two tutorials that explain many of the commands. Here's a link to the manual. 2020-06-06 English Commodore 64 24.46 KB 1,269 Download Ultrakit Ultrakit - A Programmer's Toolkit by Zach Townsend (Alpha Omega, 1986) - ULTRAKIT adds nearly 30 commands to the standard Commodore Basic, for use in developing your own programs. It includes commands for debugging BASIC programs, for listing to the printer, for altering and checking blocks of memory, as well as a fully-fledged multicolour Character Editor and Designer. This archive contains a .TAP file instead of a .D64. I was unable to convert it using FinalTAP because it isn't a BASIC program and has a non-standard loader. You can easily use this in CCS64 or the VICE emulator. Thanks to Green_Bert over at the Lemon64 forum for sharing this and the manual. 2023-03-25 English Commodore 64 82.8 KB 359 Download Back'''
