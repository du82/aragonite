["https://commodore.software/new-files"]
title = "Commodore Software - New Files"
description = "Commodore 64 & 128 applications, utilities, tools and more!"
full_description = "The COMvoice speech synthesizer for the VIC-20 and CBM-64 provides the user with the ability to add spoken English prompts and responses to BASIC programs. The two main features of COMvoice are the phoneme based unlimited vocabulary and the new BASIC command created by COMvoice which makes programming speech as easy as using a PRINT statement. Welcome to ASM-ONE, a professional assembler-package for the Commodore Amiga, which besides a fast assembler provides you with a professional editor, a screen for disassembling as well as screen-dumps and adebugger with step-,watch and jump-functions. Sprite Basic is an extension for Commodore 64 BASIC that adds three commands for dealing with sprites more easily. This extension was published in the December 1983 issue of Compute!s Gazette. Here is the description for the program from the magazine: If you've always wanted to create sprites on your Commodore 64, but have been put off by all the complicated POKEs, this article is your answer. It lets you modify BASIC to add three new sprite commands to make the job much easier. An accompanying side article also explains the rudiments of sprite design. EfexBASIC v1.0 by Mark Hanzen (1990) is a neat extension for Commodore 64 BASIC that adds a bunch of screen related commands that give you different effects like clearing the screen with a vertical swipe, or fading out the characters on the screen. All in all there are 12 new commands to make your BASIC program pop with a little flair. The help screen you see when first starting the extension is all you need to start using the new commands. Z-Pulator II+ by VIC / ZC is a screen editor for the Commodore 64. Nothing fancy here, but you can create and save a Commodore graphics screen in any memory location you choose. Hyper Backup v1 by J.Braun (1991 Magic Disk) - Nothing fancy or super fast, but copies a full disk without a bunch of frills or fancy intro screens (only 11 blocks). SID Player ]I[ by Craig Chamberlain - Found this player in a random archive and noticed I don't have it in the collection. I'm going to assume this is a modified version of the SID Player from Compute! magazine. As a bonus, this disk come with many SIDs to check out."
