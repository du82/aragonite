full_description = "GEOS Article Reference This is a work in progress... Here you'll find an index of articles on various GEOS topics and links to the referenced article. Last updated on January 9th, 2024 Desktop Publishing Desktop Publishing on the Commodore 64 by Peter Hughes - GEOWORLD Issue 02 (April 1987) Desk-Top Publishing - A Beginner's Guide to Becoming and Expert - GEOWORLD Issue 02 (April 1987) Desk-Top Publishing - Q&A dealing with topics that were covered in the Desk-Top Publishing article of GEOWORLD Issue 2 - GEOWORLD Issue 3 (May 1987) Graphics Working With Geopaint - Some great tips and recommendations for advanced use of GeoPaint - GEOWORLD Issue 3 (May 1987) Input Devices Lightpens by Mystic Jims Shareware - GEOWORLD Issue 01 (March 1987) Printing BSW Service Newsletter (April 1991) - This is a must have reference for printer drivers, printer dip switch settings and interface cards with dip switch settings. (Pages 13 - 16) GEOS and Printers by Antonio G. Mata - geoNews Issue 63 (November, 1996) GEOS Printing & geoCable Information by Danny Tod - geoNews Issue 63 (November, 1996) Connections - The Logo to PrintShop Screen Magic Connection (by Thomas F. Trocco) Interesting article on how to convert graphics created with the Logo language into PrintShop's Screen Magic format. A Printer Driver that Features Double Strike Printing - Excellent article on how to get NLQ priting from the Epson FX-80 Double strike driver. Includes detailed instructions and code. - GEOWORLD Issue 03 (May 1987) Programming Inside GEOS by Master Blaster - GEOWORLD Issue 01 (March 1987) First article in a series about programming within GEOS - Covers things to consider before starting to code. Inside GEOS by Master Blaster - GEOWORLD Issue 02 (April 1987) Examining the header block of a file and ways to convert your own programs to GEOS format. Inside GEOS by Master Blaster - GEOWORLD Issue 03 (May 1987) How to get a GEOS program to convert itself from something transferable over a modem to a program runnable in GEOS. Includes example code! Word Processing GeoWrite 2.0 Keyboard Shortcuts - GEOWORLD Issue 03 (May 1987) - Page 16"
