full_description = '''Overview Search Up Category: Graphics and Pictures Downloads: 15 10 Print Chr Found this cool disk sleeve based on the 10 Print Chr BASIC one liner. There is both a PDF and PNG in the archive. 2023-07-07 English PDF 22.03 KB 200 Download Commodore 64 Hi-Res Picture Disk HOT This is a disk full of miscellaneous hi-res graphics / pictures for the Commodore 64. 2015-10-28 English Commodore 64 27.17 KB 1,143 Download Far Side Gallery NEW The Best of... The Far Side Gallery is a very well done slideshow of classic Far Side comics. The slides advance quickly, even on a stock 1541 drive, so use the SHIFT-LOCK key to pause the show. 2025-02-21 English Commodore 64 34.64 KB 8 Download High Quality 64 Gfx All files contained within this disk are stand alone graphics, converted to the C64 by xlcus software. Each digitised picture have been ported across from the Acorn Archimedes computer, using specialist gfx conversion software programmed by: Acorn: Jonathan Hunt / C64: Paul Kubiszyn The pictures utilise a special display method, invented by xlcus software, called "IMAP". The process of IMAP or Interlaced bitMAP, is to have in memory two pre-calculated interlace frames, which you can then switch between. This means that no matter what C64 you run them on (NTSC or PAL) they will always work correctly. NOTE - The images onthe disk look MUCH better than the screenshots because the emulator I used to capture them with was only displaying at 32 FPS. 2023-07-21 English Commodore 64 40.61 KB 243 Download Jay's Picture Disk HOT Found this disk of pictures while checking out a collection. Each picture is self displaying after you load and run the file. I only put a few samples of the pictures that are on the disk in the screen shots, you'll have to download it and check it out for yourself to see the numerous other pictures. 2019-07-03 English Commodore 64 91.41 KB 915 Download Koala Pictures 1 Koala Pictures 1 is a collection of a dozen or so pictures in the Koala format. 2023-05-20 English Commodore 64 62.08 KB 310 Download Koala Pictures 2 Koala Pictures 2 is a collection of a nine pictures in the Koala format. 2023-05-20 English Commodore 64 30.88 KB 241 Download Koala Pictures 3 Koala Pictures 3 is a collection of a dozen or so pictures in the Koala format. 2023-05-20 English Commodore 64 47.64 KB 246 Download Koala Pictures 6 This is just a random collection of Commodore 64 pictures in Koala Paint format. 2021-04-03 English Commodore 64 26.69 KB 599 Download Mac Paint Graphics Disk This is a .D81 disk image filled with Mac Paint graphics images and a viewer so you can check them out on your Commodore 64. I took quite a few screen shots, but there are still many more images on the disk to explore. 2023-07-02 English Commodore 64 421.77 KB 196 Download Max Headroom Screen Saver Max Headroom Screen Saver for the Commodore 64. Not much to say, just cool! 2023-07-25 English Commodore 64 5.12 KB 254 Download PETSCII Doctors PETSCII Doctors by ArkanixLabs - Saw this posted over at the ArkanixLabs forum and had to share. This is a small slide show program that has PETSCII pictures of all the doctors from the BBC television series 'Doctor Who'. I've only included a few of the pictures, so grab it and check out the rest. 2019-07-28 English Commodore 64 72.02 KB 721 Download SIDin Cover Art (Issues 1 - 13) This archive is a .d64 image with the cover art for issues 1-13 of SIDin magazine. 2019-09-21 English Commodore 64 85.32 KB 640 Download The Britney Spears Collection The Britney Spears Collection - released in 2000 by a group called Angels (I think). If you're a Britney Spears fan, then this is the graphics collection you need for your Commodore 64! There are quite a few pics on the disk, but I only put screenshots of a couple with this post, so if you're curious you'll just have to download the archive and fire up your emulator. 2019-07-02 English Commodore 64 113.28 KB 795 Download The Famous Sprite Show Series The Famouse 