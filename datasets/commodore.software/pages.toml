["https://commodore.software/downloads/category/42-c-g-editors"]
title = "Commodore Software - C/G Editors"
description = "Commodore 64 & 128 applications, utilities, tools and more!"
full_description = '''Overview Search Up Category: C/G Editors Number of Subcategories: 1 Subcategories: Kaleidoscope Downloads: 30 ASCII Scroll Editor v2.0 HOT I'm not exactly sure what this utility does, but according to the intro screen it lets you add a scroller to the end of your log-on screen. So you BBS people should check this out and give me the low down. 2015-04-01 English Commodore 64 6.76 KB 1,167 Download Board Painter v1 HOT Written in 1992 by Scrap of Genesis - Boardpainter is a utility for creating lores (c/g) graphics screens. Very easy to use, but docs are on disk just in case... 2015-04-01 English Commodore 64 16.89 KB 1,279 Download C64 Editor v2.3 C64 Editor v2.3 - So I ran across this random editor today and I'm not sure how to classify it. It seems like a normal text editor, but it can also has a mode for Commodore Graphics. I also am not sure what the name should be. Is it "5 Editor v2.3"? Here are the credits as found in the program: Code by Yattaman/Alc Chrout proc by Antares Font by Fangorn/Alc Turbodos by Explorer If anyone has more info, I'd be interested in getting some details. 2024-08-14 English Commodore 64 8.61 KB 75 Download CG Animator v3.0a HOT Released on February 24th, 1989. Written by Defcon. This program is used to make MOVIE files for Image BBS. Docs are on the disk. 2015-04-01 English Commodore 64 16.77 KB 1,180 Download CG Editor HOT Released on September 5th, 1991 by IMSI. This is pretty much a very basic CG Editor with no frills. 2015-04-01 English Commodore 64 18.37 KB 1,200 Download CG Sequential Editor v2.5 HOT Released by the author Rick Mathewson in 1987, CG Sequential Editor v2.5 is a line based text editor supporting Commodore Graphics (character based graphics). 2015-05-19 English Commodore 64 10.5 KB 1,197 Download CG Writer v2.0 HOT C/G Writer was written by Andy Prince and released in 1987. Although its called C/G Writer, I couldn't for the life of me figure out how to do anything but load a C/G image and save it. If there is an editing feature I'm not sure how you access it. 2015-04-01 English Commodore 64 6.78 KB 1,107 Download Chalk v6.0 HOT By William Seely - This is a line based C/G Editor. Might be decent, but not worth the effort imho. 2015-04-01 English Commodore 64 10.18 KB 1,117 Download Chalk v6.5 HOT Bug fixed version of Chalk v6.0 2015-04-01 English Commodore 64 10.41 KB 1,089 Download Digi Script v1 This is a PAL only C/G editor - It seems to only work reliably on VICE 3.1 or higher and only with a pal c64 model. 2019-03-07 English Commodore 64 10.01 KB 683 Download Digital Paint v2.0 HOT By Aaron Hightower. This is an early version of the excellent C/G editor. There are a few c/g pictures included on the disk. 2015-04-01 English Commodore 64 15.86 KB 1,113 Download Digital Paint v3.0 HOT By Aaron Hightower with some new routines added by The Silver Surfer/Hotline!. This is one of the best lo-res c/g art programs available. 2015-04-01 English Commodore 64 11.28 KB 1,111 Download Digital Paint v4.0 HOT By Aaron Hightower, new routines by The Silver Surfer/Success! The only difference between this version and 3.0 is the ability to change device numbers between 8 & 9. There are some nice C/G pictures on this disk that are worth checking out. 2015-04-01 English Commodore 64 17.71 KB 1,198 Download LED Draw 64 LED Draw 64 by Joseph Gordon (Released Dec. 13th, 2020) is a neat little BASIC program for the Commodore 64 that will let you create a lo-res graphic that looks similar to the old Lite Brite toy. If you're into Perler Bead art, this is a good way to get your layout down for a simple creation. - Original post from archive.org 2020-12-20 English Commodore 64 5.45 KB 589 Download Lores v1.0 HOT By M. Czychowski - Unfortunately this program is written in German, but it's pretty easy to tell what the menu options are based on the key. Also, it is a PAL program, so don't forget to set VICE or whatever emulator you use appropriately. 2015-04-01 English Commodore 64 10.81 KB 1,093 Download Loser v1.3 L.O.S.E.R. v1.3 (Lores Screen Editor Royal) by Pumpkin of Lower Level - Simple, easy to use C/G editor with the features to get it done and not so many that it is complicated. 2020-11-22 English Commodore 64 13.69 KB 604 Download Lowres Draw v2 HOT Written by James Kelley (Dr. Edge) and release on August 8th, 1990. Lores Draw is a graphics editor for making pictures from the Commodore Petscii characters. This program is really nice. It has built in help and a cool feature to load a doodle or koala picture as lo-res. 2015-04-01 English Commodore 64 13.77 KB 1,036 Download Movie Magic v3.3 HOT 1987 Magisoft, Inc. Written by Andy Price - Movie Magic is a pretty slick C/G animation program. Don't have any docs for this one, but it looks pretty self explanatory. 2015-04-01 English Commodore 64 4.09 KB 1,009 Download Petdraw64 HOT Written by David Murray and released on 3-17-2015. PetDraw is designed to allow the creation of artwork using nothing but PETSCII characters and whatever text-mode colors are allowed by the system. Documentation and sample artwork is included on the disk. 2015-03-17 English Commodore 64 8.08 KB 1,203 Download PETSCII Edit 4.6 HOT PETSCII Edit 4.6 looks like one of the best Commodore 64 character graphics editors I have seen. It might even top Kaleidoscope, but I reserve judgment until I've had some time to use it. The only major downfall I see so far is that the editor requires PAL mode, at least in WinVICE otherwise it locks up after running. There are plenty of docs and other goodies on the disk to explore, so snag this one. 2015-04-21 English Commodore 64 44.41 KB 1,219 Download PETSCII Edit 4.61 HOT PETSCII Edit 4.61 by Fieserwolf, Released in April 2017 - This version is a minor update to 4.6 to add the ability to load screen and color RAM separately from a file. See my description for 4.6 for more comments. This is a PAL based program. 2018-03-27 English Commodore 64 48.62 KB 1,022 Download PETSCII Paint v0.5 HOT Released in 2011 by Dennis Busch, PETSCII PAINT is a simple little tool for your C64 (or emulated C64) to create tile based pixel art using the (modified to also include a smiley from ASCII) PETSCII character set of the C64. Docs and source are inside the archive. 2017-09-24 English Commodore 64 19.11 KB 1,173 Download Picture Perfect v2.0 HOT Created by Kelly Ethridge & Rick Stephens - Picture Perfect is a nice C/G Graphics editor with lots of options. Full docs are built into the program. 2015-04-01 English Commodore 64 15.34 KB 1,173 Download Screen Gem v1 HOT Screen Gem v1 by Billy Godfrey is a C/G paint program that appears to be customized for Ivory BBS based on the intro screen. I really can't see anything specific about it that would lend itself better to Ivory than any other Commodore 64 BBS capable of displaying character graphics screens. Anyway, it's almost completely joystick driven but does have a built-in help screen for the handful of keyboard commands it supports. 2018-03-05 English Commodore 64 10.4 KB 975 Download Screen Graphics Editor HOT Written by Lightning - Screen Graphics Editor is a graphics editor for Commodore Petscii screens commonly used for BBS related stuff. This C/G editor supports MCI commands popular with C-Net BBS. 2015-04-01 English Commodore 64 9.18 KB 1,260 Download TBoard Painter V1.1 Pro TBoard Painter v1.1 Pro by TAO/Triad - Excellent PETSCII editor that appears to be the third re-write as stated in the scroller, because the first two floppies with the application were de-magnitized, as a result, the program was improved upon each time and... Wahala, we now have this nice Pro version that is especially nice for C*Base BBS owners because it has a "filter first byte" mode (C= + W). Absolutely no clue what that means, but it's what the scroller says. Now go forth and create! Please don't judge this program from the screenshots. It apparently doesn't initialize screen memory when it starts, so its populated with (random?) screen garbage. 2023-02-10 English Commodore 64 9.35 KB 222 Download The MCI Artist HOT 1988 by Joseph Benton. The MCI Artist is a C/G editor ya know, for creating those cool screens for BBSes! 2015-04-01 English Commodore 64 8.88 KB 1,131 Download Tyronpaint v2.1 Tyronpaint v2.1 - Written by LynchBit of [LD] in 1996/97 and Improved by TLR in 2006. Some clain this to be the ultimate C/G editor, not so sure about that, but probably worth a try. 2020-11-19 English Commodore 64 8.7 KB 623 Download Vision Paint HOT Vision Paint by Steven Baxter (original by Aaron Hightower). Released July 15th, 1991. Quite a nice C/G graphics editor for the Commodore 64. Docs are on the disk image and there is some help built into the program also. 2016-11-24 English Commodore 64 17.28 KB 1,170 Download Z-Pulator II+ NEW Z-Pulator II+ by VIC / ZC is a screen editor for the Commodore 64. Nothing fancy here, but you can create and save a Commodore graphics screen in any memory location you choose. 2025-02-24 English Commodore 64 4.15 KB 10 Download Back'''
