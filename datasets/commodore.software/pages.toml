["https://commodore.software/downloads/category/12-databases"]
title = "Commodore Software - Databases"
description = "Commodore 64 & 128 applications, utilities, tools and more!"
full_description = '''Overview Search Up Category: Databases Downloads: 29 Address Book Address Book by K. Pike -(1986 Planet Earth LTD) , for the Commodore 64 is a nice address database program written in BASIC. Although it supports saving addresses to tape, sure would be nice if someone updated this to support disk storage. 2020-10-05 English PDF 4.86 KB 780 Download BBS Base v1.0 BBS Base v1.0 by Percival Blenman was released in 1986 and is a database type application that handles BBS billing for pay BBS systems back in the day. Some short Docs are included in the disk image. 2017-10-08 English Commodore 64 37.38 KB 894 Download BBS Machine NEW BBS Machine by D.P. Searles - Think of this as a database for BBS phone numbers. I know you are probably thinking; I would just put them in my terminals phone book. Probably true, but if you used multiple terminal programs, it would have been nice to have a central repository for all the numbers. Plus, with this program, you can get hard copies and have pretty much unlimited entries. 2025-02-18 English Commodore 64 4.51 KB 7 Download Better Working File & Report Better Working Software from Spinnaker is proud to introduce FILE & REPORT, a program which will allow you to organize lists of information and produce reports using those lists. FILE & REPORT integrates with the other Better Working products SPREADSHEET and WORD PROCESSOR. Link to the manual Link to the quick reference card 2021-03-28 English Commodore 64 253.34 KB 656 Download Bob the Bartender HOT Bob the Bartender is a database of mixed drinks that Bob will help you make. It has quite a few recipes and could be useful at a Commodore party. 2017-10-09 English Commodore 64 10.47 KB 927 Download Contact Dealer v2 Contact Dealer v2 from Censor is an sort of unique application I haven't run across before. It appears to be a type of database for contacts in the warez / cracking scene or similar. 2015-10-10 English Commodore 64 10.18 KB 892 Download Credit Card Base Credit Card Base by R.W. 'Bob' Kober (March 20th, 1986) - Yup, believe it or not, this is a database for credit card information. My personal feeling is that if you have so many credit cards that you need to file the information, you have too many! 2023-07-22 English Commodore 64 9.93 KB 196 Download Datafile 3.6 NEW Datafile (later sold commercially as dfile 64), is an excellent simple database program and an example of the great things that can be done in BASIC. Originally published in RUN magazine over the span of three issues in 1987, version 3.6 includes DFPrint, an accessory for creating mailing labels and reports, and DFCalc, an accessory that performs calculations and produces spreadsheet-like reports. This archive includes a D64 with all these programs. Also included are the accompanying RUN magazine articles (with program listings) in PDF form. 2025-02-22 English Commodore 64 50.18 MB 16 Download Demo Sorter v1.3 Demo Sorter 1.3 is a database for sorting/searching and maintaining demo titles. 2015-10-31 English Commodore 64 10.15 KB 847 Download Easy Phone Book v4.1 Easy Phone Book v4.1 by Randal G. Harris is a nice little utility for keeping track of phone numbers and addresses with built-in help and support for printing and saving to disk. 2018-08-21 English Commodore 64 41 KB 798 Download Easy Phone Book v5.0 Easy Phone Book v5.0 by Randal G. Harris is an improved database for storing phone numbers and addresses. Has built-in help and supports printing and saving to disk. * Use Load "*",8 2018-08-21 English Commodore 64 8.16 KB 883 Download Easy Working Filer v1.01 Easy Working Filer is a multi-purpose program which saves you time by simpliying the storage, selection and reporting of information. You can maintain or create mailing lists, inventories, club memberships and any other type of information file you need to organize. You can have over 10,000 records in each file. Note - This program will only work in the VICE 3.1 emulator if you select "C64 old NTSC" model. Not sure about newer versions of VICE. Here's a link to the manual. Update August 9th,2024 - I've updated this archive with an additional version. Although the version number on disk is still v1.01, the software is over a year newer (08-01-1988) and includes an additional program to print the manual outside of the main program. 2024-08-09 English Commodore 64 127.23 KB 651 Download File-Fax - Release 2 File-Fax Release 2 by TMQ (Trade Mark of Quality) software. This is a database management system released sometime post 1982 for the Commodore 64. If you look at the detailed description you can see a picture of the Ad I found for the software in a November 1982 PC Magazine. 2017-04-21 English Commodore 64 23.92 KB 899 Download FilePro 64 FilePro 64 by Steve Punter (1986) is a database program for the Commodore 64 - For additional information and details on the program particulars, check out https://www.danielsays.com/ 2020-12-17 English Commodore 64 26.18 KB 674 Download Inventory Management by Timeworks NEW This is a fairly complex database for small business inventory management. With the ability to track purchase orders, pre-orders, order/receive parts from suppliers, and much more, this seems like a program that could actually have been used by a small business. The program supports two disk drives, another big plus. On the downside, Inventory Management is not Y2K compliant. Also of note is that when Inventory Management starts a new blank database, it creates a gigantic relative file on the disk. This process takes so long I was convinced the C64 had locked up. 2025-02-23 Commodore 64 30.08 KB 12 Download Mail List 64 Mail List 64 by Dave & Al Johnson is an address keeping database that built-in help, the ability to work with disk files and supports printing. 2020-11-22 English Commodore 64 6.42 KB 542 Download Mailing List Nice little mailing list program that can store up to 150 entries in memory and supports printing and save / load to disk. 2015-04-06 English Commodore 64 7.85 KB 875 Download Micro Cookbook Micro Cookbook book by Commodore Business Machines & Virtual Combinatics is a full featured database for handeling cooking recipes on the Commodore 64. This is a two disk archive and documentation is built into the program. 2020-12-05 English Commodore 64 151.49 KB 638 Download PFS:File PFS:File is a flat-file database management program that works like an electronic index card filing system. Users control data in a totally unstructured database, and can design forms, store, retrieve and edit information, print reports and produce color graphs and charts. Note - Doesn't work in VICE. Works on real hardware or Z64k Emulator v2.0.0 2020-11-22 English Commodore 64 43.4 KB 622 Download Phi Beta Filer Phi Beta Filer by Elizabeth Levin, published by Scarborough Systems (1984) - Couldn't find much information on this program other than a review in the June 4th, 1984 issue of InfoWorld magazine. The review calls this a home-productivity-package, but it's main function is to create cardfile like sets of information, so I'm going to classify it as a database. You can find the review in the pictures included with the archive, but here is a link to the only online copy of the InfoWorld issue I could find. It might not work without being logged into a Google account though. 2023-06-25 English Commodore 64 20.87 KB 204 Download Phone Mail Phone Mail (also known as File Drawer) by S.J. Takis is a database utility for storing phone numbers and addresses. Also supports some added fields that aren't in most programs of this type. 2018-08-21 English Commodore 64 7.43 KB 786 Download Phone-Mail DB Phone/Mail DB is a simple but useful address book that can save data to disk and print a mailing list. 2015-10-09 English Commodore 64 7.44 KB 875 Download Pocket Filer 2 64 - v2.00 Welcome to Pocket Filer 2: all the power of Pocket Filer-a sophisticated, inexpensive and easy to-use database program for the Commodore 64 plus enhancements that make database management easier and better than ever! Note - Only runs on a real Commodore 64, Ultimate 64 or Commodore 64 with a 1541 Ultimate II / II+ Here's a link to the manual. 2020-11-22 English Commodore 64 161.13 KB 655 Download Pocket Filer 64 - v1.20 Pocket Filer 64 - a sophisticated, inexpensive and easy to-use database program for the Commodore 64. Note - Doesn't work with any emulators. Works with real hardware or the Ultimate 64 / 1541 Ultimate II / II+ 2020-11-22 English Commodore 64 405.75 KB 585 Download QuickPro+II v3.1 QUIKPRO + is one of the easiest programs to use. In minutes you'll be able to create programs for filing and data handling without knowing anything about programming. QUIKPRO + is not like any other Program, Data Base, File Handler, etc. because you get a separate BASIC Program Every time. (Manual) 2020-11-22 English Commodore 64 51.77 KB 649 Download Superbase 64 v1.0d Superbase 64 v1.0d is a database program for the Commodore 64, released by Precision Software in 1984. 2020-11-22 English Commodore 64 123.64 KB 838 Download Superbase 64 v3.01 Superbase 64 is a new concept in database management. It provides the power of large computers on a Commodore 64. This revision of Superbase includes support for two disk drives and the 1581 floppy drive. What is Superbase 64? In computer talk, it's known as a database management and information retrieval system with a user programmable interface. In English, it's best described as a great big filing cabinet which allows you to extract almost any piece of information, in almost any order, with multiple selection criteria. Plus - you can design your own record layouts and either work entirely from the menu options or write your own special program to meet your needs exactly. If you have no programming experience just use the Superbase 64 command set. Thanks to Howlin' Alan for acuiring and providing this excellent piece of Commodore history! 2024-08-07 English Commodore 64 48.48 KB 157 Download The Data Base The Data Base by John Calhoun is a full fledged data base program for the Commodore 64, released in 1986. The program has built in documentation and tutorial. 2020-11-22 English Commodore 64 110.52 KB 783 Download The Home Video Manager v2.0 The Home Video Manager v2.0 by James D. Gotwald (July 10th, 1987) - This is quite a nice database system for keeping track of 8mm, Beta, VHS, CED and Laser video storage. There is an extensive manual included. 2025-01-07 English Commodore 64 50.95 KB 20 Download Back'''
