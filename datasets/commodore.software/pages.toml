title = "Commodore Software - Word Processing & Text Editors"
description = "Commodore 64 & 128 applications, utilities, tools and more!"
full_description = '''Overview Search Up Category: Word Processing & Text Editors Downloads: Page 1 of 2 1 2 Downloads: 50 Blue Chip Word Processor Blue Chip Word Processor by Visiontronics and Professional Software, Inc. Designed by Jacques Lebrun (1984) - This is the word processor that accompanied the Blue Chip D12/10 daisy wheel printer. It's a fairly capable application, supporting 40, 80 or 120 columns. Thank you Thomas Shaw for sharing this! You can find the Word Processor Quick Guide with command reference here You can find the full printer manual here Lastly, you can find a GEOS printer driver here. 2023-01-16 English Commodore 64 30.11 KB 599 Download C64 Miniword v2.5 C64 Miniword v2.5 by Bo Zimmerman (The Zacman! ?? Is that Bo's handle?) - In my hunt for the Mirage Word Processor, I stumbled on Bo's github page where I found this neat little word processor. Since there wasn't an actual compiled release of the program, I imported the project into CBMPrg Studio, assembled the ML part, then Blitzed the BASIC part and put all the necessary files into a D64 disk image. Complete docs are in both the masterfile (mw_docs.txt) and also on the D64 that can be loaded into Miniword. Miniword uses .prg files for storage, so you will want to load the file "2.5docs.mw". The Github page and source files can be found HERE! 2023-04-22 English Commodore 64 43.7 KB 457 Download Cosmi Text and Data Pro HOT COSMI Text & Data Pro is a combination word processor and data base system 2018-08-21 English Commodore 64 15.53 KB 1,438 Download Easy Script HOT Easy Script is one of the more popular and affordable word processors for the Commodore 64. Its output files are in a SEQ (sequential file) format, so they are relatively easy to convert to a more modern, readable format. Included in the archive is the program, manual and review in pdf format. 2015-04-17 English Commodore 64 4.04 MB 3,696 Download Easy Working Writer v1.02 Easy Working Writer v1.02 by Spinnaker (1987) Easy Working Writer is an easy-to-use program containing both a word processor and a spelling checker. A word processor is like a typewriter with expanded capabilities. Use it to write a document, such as a letter, a paper, or a report, just as though you were using a typewriter. But, unlike a typewriter, you can edit and format your document easily and without retyping. With a word processor, once you type the first draft, you only need to type in corrections and additions to your text-you never need to retype the entire document. Formatting, too, is a simple matter-with a single command, you can change from single spacing to double spacing , center a title, boldface a heading, or place a foreign word in italics. The built-in Spelling Checker helps you find and replace misspelled words before you print your document. Here's a link to the manual. 2023-08-27 English Commodore 64 171.6 KB 341 Download Easy Working Writer v2.00 Easy Working Writer v2.00 (Spinnaker) - This version is in .nib format instead of .d64 becuase it has copy protection in tact still. WinVICE 3.1 works fine with .nib images, so I assume all newer versions will also. Easy Working Writer is an easy-to-use program containing both a word processor and a spelling checker. A word processor is like a typewriter with expanded capabilities. Use it to write a document, such as a letter, a paper, or a report, just as though you were using a typewriter. But, unlike a typewriter, you can edit and format your document easily and without retyping. With a word processor, once you type the first draft, you only need to type in corrections and additions to your text-you never need to retype the entire document. Formatting, too, is a simple matter-with a single command, you can change from single spacing to double spacing , center a title, boldface a heading, or place a foreign word in italics. The built-in Spelling Checker helps you find and replace misspelled words before you print your document. Here's a link to the manual. 2023-08-27 English Commodore 64 254.81 KB 359 Download Easywriter HOT Written by Steve Cumiskey, released in November 1988 - This program is intended to be used to write text information or instruct- ion for any other program. It will save those text as a seq file on disk. The text can then be loaded back and read onscreen or printed out. This program will then load the program the text was written for. 2015-04-03 English Commodore 64 8.31 KB 1,621 Download Electronic Notepad HOT This neat little text editor has a feature that lets you encrypt the file so that you need two codes you assign to unlock the file. 2015-04-03 English Commodore 64 3.21 KB 1,479 Download HES Writer 64 HES Writer 64 ByJerryBailey (1982) - As quoted from the manual: Thisprogramallowsyoutoentertext intothecomputerviathecomputer keyboard,theneditandformatthe textbeforeprintingit. I suppose in 1982 you could look past the crudeness of this program, and were just have something better than a typewriter. Anyway, here's a link to the manual which is surprisingly detailed. 2023-05-19 English Commodore 64 5.21 KB 332 Download HITEX Hi-Res Text Editor [PAL] HOT HITEX by LDX#40 is a neat little text editor that works in the Commodore 64 hi-res graphics mode. Full support for load & save, so who know, this could be your new word processor for that novel you've been meaning to write. Website 2020-05-16 English Commodore 64 6.01 KB 983 Download Home Word Processor Here's a simple but effective text editor for the Commodore 64 from the Starter Kit disk by the NorthWest group of California. Although it's calling itself a "Word Processor", it's really a line based text editor. That aside though, it does the job, and supports load/save from disk or tape, and printing among other things. If you just need something simple to edit a .SEQ file, this might be one to check out. This archive includes the full NorthWest Starter Kit. There are some other utilities / programs you might find useful on it. 2023-02-07 English Commodore 64 78.15 KB 447 Download HomeWord HomeWord by Sierra-Online (1983) - This is a neat word processor that came early in the Commodore 64's existence but had the neat feature of being able to see a live preview of the documents layout as it would be when printed out even though you only had 40 columns for editing. I haven't been able to find any documentation for this rare find. In fact, it's so rare that there isn't even a cracked version of this that I could find. That said, let me tell you a bit about what's in this archive. So there is both a .g64 and .d64 disk image, and both of them have some mild copy protection still in tact. The odd thing about the .d64 image is that it will work in VICE, and on the Ultimate II+ with Firmware 3.9, but won't work on an Ultimate 64 with Firmware 3.10, hence the .g64 image which I created by putting the .d64 on the Ultimate II+ and using Shotgun II nibbler to create a real floppy, then using Nib copy on a PC with a XUM1541 with parralel adapter to read back the floppy into a .g64 which the Ultimate 64 is ok with. Thanks to DLH over at the Bombjack site, we now have some documentation! Although the manual is for HomeWord Plus, I'm sure most of it applies to this version also 2023-01-29 English Commodore 64 115.06 KB 443 Download Interword v1.02 HOT Interword is a Commodore 64 assembly language port of an Amiga word processor. The software was written in 1992 on a commission from Interactivision, a software company based in Silkeborg, Denmark. Not that many people care, but this program works really nice with the Blue Chip d12/10 printer for the Commodore 64. Here's a YouTube video and the Author Martin Olsen has added some nice commentary. Source Code posted on GitHub. 2018-08-23 English Commodore 64 29 KB 1,680 Download Jasword v1.1 Jasword v1.1 - Can't believe I hadn't heard about this word processor for the Commodore 64 until recently. This is one of the few true 80 column word processors I've seen. It is really well layed out and intuitive to use. I searched for the manual but could't find one but I don't think one is really needed. Here is a review of Jasword over at the Retro Gamer CD Blog. Note - This program didn't like being launched from DirMaster into WinVICE. I ended up loading it with CCS64. 2025-01-19 English Commodore 64 26.68 KB 38 Download Kwik Write! HOT Released by Fairlight! This is one of those programs that just go to show that some of the best things in life are free. Not quite a word processor but very capable, Kwik Write is an excellent text editor. 2015-04-03 English Commodore 64 16.2 KB 1,793 Download Line Editor Line Editor for the Commodore 64 is a simple but fully featured sequential file editor written in BASIC. The program has some simple listing protection, but I'm sure anyone sufficiently determined will figure out a way around that. 2021-07-03 English Commodore 64 6.97 KB 672 Download Main Street Word Processor HOT Main Street Word Processor for the Commodore 64 is your basic no frills text processing application. 2015-10-29 English Commodore 64 73.81 KB 1,444 Download Mastertext Plus 64 v1.0 (German) HOT If you can read German, this is a very nice professional word processing package. 2015-05-04 German Commodore 64 45.67 KB 1,307 Download Maxiedit v2.9 HOT This general purpose text editor is quite nice with many formatting features. The full docs are on the disk. 2015-04-03 English Commodore 64 20.23 KB 1,315 Download Mirage Concepts Word Processor There's nothing quite like the feeling you get when you know you've got the solution. And there's nothing that can help you solve problems better than the WORD PROCESSOR by MIRAGE CONCEPTS! Program highlights include: 100% Machine Language 40/80 Character Display True Word Wrap Printed Page/Line/Character counters Over 70 Single Keystroke Commands Global Search and Replace Block and Column Functions Full Macro Implementation Compatible with MIRAGE DATABASE MANAGER Manual for Mirage Concepts can be found here 2023-12-17 English Commodore 64 24.73 KB 290 Download Mister Ed [PAL] HOT Mister Ed by Lubber of Padua is a text editor with a gui interface driven by a joystick (no mouse support). 2019-09-03 English Commodore 64 12.17 KB 905 Download Multidata-64 Multidata-64 by Commodore, appears to be a word processor for the Commodore 64 that was mainly I think, for German users, since that is the only references I can find to it on the net. Interestingly though, it has support for English, German, French, Italian & Spanish built-in. 2023-11-19 English Commodore 64 60.42 KB 208 Download Notepad64 v1.0 HOT Notepad64 v1.0 by Matteo Angelini. This is a nice clean text editor that supports loading and saving to .seq files. It also supports PETSCII editing. Included in the archive is the source and some sample screens. 2017-04-25 English Commodore 64 95.46 KB 1,574 Download Page-Edit v5.2 NEW Page Edit v5.2 by Elwix of Style (March 1994) - I know the intro text calls this a text editor designed for a disk-magazine, but really it's an all-around nice text editor for anything that requires creating a document. There is also easy to access built-in help screens, what more could you ask for? 2025-02-22 English Commodore 64 6.77 KB 13 Download Paper Quik HOT Although Paper Quick calls itself a word processor for the C64 & 1525 Printer, it really is closer to a simple text editor, because it lacks the features most people would have expected from such a program. This doesn't mean it 's useless. Paper Quick is really a nice simple approach to editing text. 2015-04-03 English Commodore 64 5.84 KB 1,199 Download Paperback Writer 64 v1.20 HOT Welcome to Paperback Writer 64 - probably the best writing tool available for inexpensive home computer systems. Extraordinarily easy to learn and use. Paperback Writer also offers many sophisticated controls over your documents, on both the video screen and printed paper. Link to the manual 2021-03-28 English Commodore 64 64.1 KB 1,048 Download PaperClip 64 HOT PaperClip is designed for ease and simplicity in use, yet is powerful enough to tackle almost any wordprocessing job. Many advanced features not found with micro-computer wordprocessors are incorporated in PaperClip. The result is a document which reads better, being created in less time. Note: There are several different release versions in this archive. The one I use is named "paperclip-64.d64" but I included all of them I could find. A few don't work under VICE 3.1 but work fine in CCS64 v3.9.2 and on the Ultimate64. Link to the manual 2021-03-27 English Commodore 64 305 KB 1,255 Download Ski Writer v1.0 HOT Ski Writer by Mastertronic is a pretty cool word processing program that was released in 1985. There is a good review of Ski Writer in the Midnight Software Gazette magazine, Issue 40 Page 6. 2018-08-23 English Commodore 64 27.86 KB 1,251 Download Speedscript 2.0 NEW Everyone who grew up with the C64 knows about Speedscript. The type-in word processor from Compute! magazine was practically ubiquitous. Speedscript 2.0, however, was only available from Compute!'s Gazette Disk in May, 1984. It has two standout features found in no other version of Speedscript: an attractive custom character set and a convenient Help Screen, invoked by pressing CTRL-W. 2025-02-22 English Commodore 64 15.25 KB 18 Download Speedscript Sequential Filing Mod Speedscript Filing Modifier by Steve Hammer & Gary Hills is a utility for modifying Speedscript 3.0 & 3.1 from Compute! Publications so that you can save files directly to ASCII or Pet ASCII from inside the word processor. Full docs are in the archive. 2020-12-01 English Commodore 64 12.03 KB 810 Download Story Writer Story Writer is a limited word processor designed especially for primary grade students and is intended to be used in conjunction with a sound classroom writing program. It is not intended that everything children write should be done on a wordprocessor. 2020-05-29 English Commodore 64 9.51 KB 865 Download Super-Text Super-Text Word Processor by Muse Software (1983) for the Commodore 64. Ideal for the student, businessman or novice computer owner, Super-Text's on-screen instructions and simple commands allow you to quickly create more professional looking correspondence. 80-column display and on-screen formatting shows how a document will appear before it is printed. Super-Text also features automatic page headings, page and chapter numbering, automatic word wrap, single key commands, unlimited document size, multiple file search and replace, copy/save/delete blocks of text, split screen, disk storage and retrieval. Thanks to Dave L. for sharing this excellent word processor and 175 page manual , I'm happy we can now share it with the community. 2024-09-14 English Commodore 64 36.87 KB 109 Download Superscript 64 HOT Superscript 64 by Precision Software is an advanced word processing package for the Commodore 64 which was not only available as a stand alone retail package, but was also availab'''
