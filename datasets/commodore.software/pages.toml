["https://commodore.software/downloads/category/829-geos-graphics-utilities"]
title = "Commodore Software - Graphics Utilities [GEOS]"
description = "Commodore 64 & 128 applications, utilities, tools and more!"
full_description = '''Overview Search Up Category: Graphics Utilities [GEOS] Downloads: 13 BigClipper v3.0 BigClipper v3.0 by Nicholas J. Vrtis (1988) - BigClipper will allow you to make almost any size Photo Scrap you want from a geoPaint file. There are a few restrictions based on the way Photo Scraps are handled by geoWrite and geoPaint. The height and width must be an even multiple of 8 pixels. Also, since color information applies to an 8x8 square, and BigClipper does not require you to make your clipping on an even 8x8 square, BigClipper ignores color, and stores the clipping as Black on a Grey3 Background. There is a 20k buffer limit, so some clippings may be too big or complex to fit. Thanks to Bruce Thomas for sending over this handy GEOS utility. Bruce also included two geoPaint images in the archive; the first is a handy grid to assist in setting your clipping parameters in BigClipper and the other called "geoPaint Super 64/128 Size Chart" is an excellent reference for understanding the visible screen areas in geoPaint. The Size Chart is based on Compute!'s Gazette June 1988 article in "the geos column" (Page 41). Both geoPaint images are also included as PDF files. 2024-11-22 English Commodore 64 38.15 KB 24 Download Click Pix v1.2 Click Pix v1.2 by Spike Dethman for the Commodor 64 & GEOS is an application that can turn a geoPaint picture into a stand alone executable. Although you still need GEOS to view the picture, you don't need geoPaint as the picture will have it's own built-in viewer that can scroll around if the picture is bigger than the screen size. Full docs included. 2020-06-11 English Commodore 64 5.3 KB 641 Download GeoFetch v1.0 GeoFetch v1.0 by Scott E. Resh (September 3rd, 1989) - With this neat utility, you can grab anything you see on the screen and turn it into a "photo scrap". A photo scrap is kind of the equivalent to the clipboard in Windows. Once you've grabbed the region of the screen you want to save and it goes into the photo scrap, you can then use the "Photo Manager" to add that scrap/capture into a "Photo Album". Photo albums are a collection of up to 60 various images, usually grouped together in similarity. Note - This program originally came from the Loadstar GEOS Apps 1 disk. 2023-05-07 English Commodore 64 4.71 KB 180 Download geoGIF v1.1 geoGIF v1.1 by Randy Weems is a GIF data stream format to geoPaint decoder for the Commodore 64 and GEOS. Basically you can convert non-interlaced GIFs to geoPaint format. Included on the disk image is a converted sample image. You'll need geoPaint to view it. Also on the disk is the docs in PDF. 2021-01-20 English Commodore 64 96.31 KB 507 Download geoGIF v1.2 geoGIF v1.2 by Randy Weems (Dated 11/20/1990) is a GIF data stream format to geoPaint decoder for the Commodore 64 and GEOS. Basically you can convert non-interlaced GIFs to geoPaint format. Included on the disk image is full docs. 2021-03-02 English Commodore 64 8.21 KB 532 Download GetGraphic v1.1 [GEOS] GetGraphic v1.1 by Nicholas J. Vrtis (Dated 9/5/1988) is a utility for GEOS that will convert / import Print Shop graphics into a GEOS Photo Album. Help is built into the program, but there is also a full geoWrite document file on the disk. 2021-01-30 English Commodore 64 6.66 KB 480 Download Graphics Grabber v1.0 [GEOS] Graphics Grabber v1.0 by Chris Hawley (October 1986) - The GEOS Graphics Grabber is a program designed to convert artwork available with other Commodore 64 programs for use in GEOS programs. The Graphics Grabber is compatible with and able to load graphics from PrintMaster, Print Shop, and Newsroom. Graphics Grabber is a part of the DeskPack 1 suite. The manual can be found here. 2023-04-28 English Commodore 64 12.32 KB 182 Download Handy Import v1.0 [GEOS] Handy Import v1.0 by Joe Buckley (Aka Red Storm) is a GEOS utility for importing pictures created by the Commodore 64 hand held scanner called "Handyscanner 64". With this you can convert from the Handy Scanner format file to a geoPaint file. 2021-01-30 English Commodore 64 6.61 KB 468 Download Icon Edit v2.0 Icon Edit v2.0 by Bill Helfinstine (August 28th, 1988) - Sometimes you just want a nice custom Icon for your GEOS program and this is the program that can help you get that done. Thanks to Bruce Thomas for sharing. As a side note, according to Bruce, this program was listed in the "1990 GEOS Program Directory" created by Peter T. Hughes. 2023-12-08 English Commodore 64 7.31 KB 135 Download Icon Grabber v1.5 NEW Icon Grabber v1.5 by John Paul Young (1989) is a graphics utility for GEOS on the Commodore 64. Icon Grabber is a desk accessory (DA) which allows for easier manipulation of file icons. With Icon Grabber you can move file icons around between files and thru photo scraps while you are in your favorite applications. If you don't have an icon editor (or don't like using the ones you have) you can use geoPaint in conjunction with Icon Grabber to edit your icons. There are many more uses for this DA and its very likely you'll come up with some of your own! Enjoy! 2025-02-21 English Commodore 64 17.31 KB 11 Download KoalaVert v1.0 [GEOS] KoalaVert v1.0 by Spike Dethman (Dated August 14th, 1991) is a graphics conversion utility for GEOS and the Commodore 64 / 128. With this utility, you can convert a graphics file that's in Koala Painter format to a GEOS Photo Scrap format that is useable in any program that supports Photo Scraps such as geoWrite, geoPublish, geoPaint and many more. 2021-04-11 English Commodore 64 11.48 KB 492 Download Print Photo Album v2.5 Print Photo Album 2.5 by Dave Hunter (8/22/87) - This program is really handy to get a printout of all the images in a photo album for reference sake. One of the nice features is that you can number the images so when you use the GEOS Photo Manager or SraPeek you can skip right to the correct image. Note - Although the program information still has this listed as v1.1, I can assure you it isn't. V1.1 would not process v2.0 Photo Albums, but this one does. 2024-12-07 English Commodore 64 7.97 KB 27 Download ScraPeek 3.4 ScraPeek 3.4 by Ed Flinn (May, 1989) - This handy GEOS utility lets you look through a photo album or scrapbook sequentially or by jumping to the number of the graphics item you're looking for. ScraPeek supports both GEOS 64 and GEOS 128 (40 & 80 columns). 2024-11-30 English Commodore 64 4.62 KB 28 Download Back'''
