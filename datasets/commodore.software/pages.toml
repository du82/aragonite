["https://commodore.software/downloads/category/591-action-games"]
title = "Commodore Software - Action Games"
description = "Commodore 64 & 128 applications, utilities, tools and more!"
full_description = '''Overview Search Up Category: Action Games Downloads: 6 Action Biker Enhanced Action Biker *Enhanced* by Grue - Fun racing game for the Commodore 64. Lots of great enhancements you can read about in the long description. 2025-01-21 English Commodore 64 15.28 KB 17 Download Harold The Game I don't typically post games, but this one is an exception for a very good reason, it was written in Vision BASIC! Similar to a Pac Man style game, there is much more to it than that, but instead of describing it here, check out the Vision BASIC website for details. If you haven't heard of Vision BASIC, I can't encourage you enough to see what this amazing new language has to offer the Commodore 64. Check it out at https://visionbasic.net and consider purchasing a copy to support the author and this great development tool. 2022-10-29 English Commodore 64 34.57 KB 386 Download Perplexian Challenger Perplexian Challenger by Steven Luedders of Progressive Peripherals & Software (1983) Perplexia, an insignificant blue-green planet which exists simultaneously with the earth in a universe parallel to our own, is under attack. Perplexians are thin-skinned, moon-faced creatures with deep pink eyes, who mill around,, with mouths agape. The perjink permutations of Perplexian society can be percieved by persistent personnel as perpetual perturbation permeated with pertinent persiflage. The advent of the parallax transporter has enabled physical exchanges between universes. Earth and Perplexia maintain a lopsided defense agreement. Earth is to defend Perplexia from attack in exchange for military bases on Perplexian soil. His scuminence, Baron Von Schlock, epitome of all things vile and disgusting, has enslaved an assemblage of software engineers, forcing them to program his limitless fleet of robot attack ships. Ships programmed to perpetrate pandemonium upon Perplexians. Her perplexcellency, Queen Confusion of Perspicacity, has enioined Earth to honor its agreement and defend her peaceful people. Count Conundrum, the enigmatic emissary has recruited you for this Perplexian patrol. Your weapons are skill, and four models of Perplexian confusion fighters: Model I —The oldest Perplexian fighter is lead slug slow. It is noted however for its self-regenerating laser cannons. Model II —The military moguls then insisted on a faster ship. In typical bureaucratic fashion, it was built at the expense of maneuverability and the self-regenerating laser cannons. Model III —Try, and try again. This model is faster and more maneuver- able but still without the self-regenerating laser cannons. Model IV —Right, at last. Mind boggling speed and maneuverability coupled with self-regenerating laser cannons! Thanks to Bruce Thomas for sharing this. 2025-01-19 English Commodore 64 1.59 MB 15 Download PETSCII Wizard of War PETSCII Wizard of War by KO-KO (Kornel Kolma, 2024) - No clue why, but I really like PETSCII based games, and this one is no exception! This is a conversion of the original 1980 game by Midway. If you'd like to find out more, check out the itch.io page where you can also find a Commodore Plus4 and PET version. 2024-10-11 English Commodore 64 15.19 KB 77 Download Quick Eyes This is a simple but fun game for the Commodore 64 in which you have to see how fast you can spot the correct number of colored squares on the screen. 2019-09-19 English Commodore 64 2.84 KB 743 Download Tower of Rubble 64 NEW Tower of Rubble 64 is a game for the Commodore 64 released by Komada and Amiga Plus magazine in 2018. There is a "Making od" article in issue #11 of K&A. Here is a link to a YouTube video so you can check out the gameplay. 2025-02-21 English Commodore 64 18.22 KB 11 Download Back'''
