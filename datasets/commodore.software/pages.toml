["https://commodore.software/downloads/category/24-disk-copiers"]
title = "Commodore Software - Disk Copiers"
description = "Commodore 64 & 128 applications, utilities, tools and more!"
full_description = '''Overview Search Up Category: Disk Copiers Downloads: Page 1 of 4 1 2 3 4 Downloads: 130 1 Minute Copy HOT Broken by Joe Forster/STA on 09-07-1991 - This is a three pass full disk copier that can do a BAM copy with verify. Does not work in VICE. 2015-03-12 English Commodore 64 4.22 KB 1,627 Download 1 Minute SpeedBackup v1.1 HOT 1 Minute SpeedBackup v1.1 - relased by Agnostic Front. Basically your no frills single or dual drive disk copier with options for format and copying errors. 2017-09-15 English Commodore 64 10.97 KB 1,558 Download 15 Seconds Copy v2.36 HOT 15 Second Copy was "spreaded" (their words not mine) by the Fall Guys and is a fast disk copier. You can enable write verify but it adds 7 seconds. Oh, and this is a 35 track copier. 2015-10-11 English Plus 4 5.65 KB 1,463 Download 15 Seconds Copy v3.0 [Xenon] HOT 15 Seconds Copy v3.0 [Xenon] - 35 Track disk copier. 2020-06-07 English Commodore 64 4.88 KB 906 Download 15 Seconds Multi Copy V.Doc 1.0 15 Seconds Multi Copy V.Doc 1.0 by Doctor Bit. 2020-06-07 English Commodore 64 5.1 KB 836 Download 1541 Super Kwik Copy HOT Written by a Late Night Hacker on November 10th, 1984. Can't really say much about this copier other than it's probably super kwik! 2015-03-12 English Commodore 64 4.31 KB 1,435 Download 1571 Single Disk Backup HOT By Jeffrey Sherman. This is a basic full disk copier for the C128 written for 40 or 80 Column mode. Don't forget to DLOAD the program. 2015-03-12 English Commodore 64 3.95 KB 1,486 Download 17 Second 40 Track Copier v2.37 HOT 17 Second copier was "spreaded" by the Fall Guys. This is a straight forward 40 track disk copier. 2015-10-11 Commodore 64 5.66 KB 1,379 Download 21 Second Backup v2.0 (Modified) 21 Second Backup by Charles Leborgne was quite an amazing hardware / software combo back in the day. I always wanted to have this when I was a kid, but somehow ended up with the Datel Burst Nibbler combo instead. I recently picked up a reproduction of this hardware from COREi64. For a long time, the software side of this combo was uncopiable, but recently that has changed. Here is a YouTube video from 8-Bit Resurgence demonstrating that it was indeed copied. Here is a LINK to an interview with the author of 21 Second Backup. Here is a LINK to the C64 Copy Protection website that has more details about the program and even a diagram of how to build the custom hardware cable yourself. 2023-01-05 English Commodore 64 7.18 KB 313 Download 40 Track Nibbler HOT This freeware disk nibbler is given by C.H.U.G. - Not sure if chug is a person or a group, but at least they gave a decent nibbler with half track support. 2015-03-12 English Commodore 64 7.96 KB 1,493 Download 60 Second Copy HOT Broken by Joe Forster/STA on 09-07-1991 - Very similar to 1 minute copy, but this program takes a little more than 3 passes because it does a full track/sector copy. 2015-03-12 English Commodore 64 5.39 KB 1,352 Download Backup 1541 HOT Backup 1541 was written by Jim Law and Keith Hope. Nice little disk copier with lots of buffer space. 2015-10-27 English Commodore 64 3.61 KB 1,400 Download Backup 64k HOT Found another version of Backup 64(k) by Kieth Hope which is a modified version of Backup 2031 (Jim Law / Kieth Hope). This version has almost twice the buffer area so less disk swapping, yay! 2019-07-24 English Commodore 64 3.36 KB 911 Download Backup64 Backup64 by Keith Hope is a modified version of Backup 2031 (Jim Law / Keith Hope) for the Commodore 64. Nothing fancy here, but gets the job done. 2019-07-24 English Commodore 64 3.5 KB 860 Download Beastie Copy v1 HOT Released by Vokke of The Beastie Boys. This is a full disk copier for 2 parralel drives device 8 & 9. 2015-03-12 English Commodore 64 10.71 KB 1,483 Download Bit Back'em v1.0 HOT Bit Back'em v1.0 by Mike J Henry. Nice nibble copier by the man known for some of the best copy utilities ever made for the Commodore 64. 2017-10-09 English Commodore 64 14 KB 1,467 Download Burst Nibbler v1.1 HOT Released in 1986 by The Dynamic-Duo. Burst Nibbler is a full disk copier that works with parallel port mods. Copies tracks up to 41 with density scan. 2015-03-12 English Commodore 64 5.36 KB 1,346 Download Burst Nibbler v1.9 HOT Cracked by Octagon - Burst Nibbler v1.9 is a parallel port copier supporting tracks 1 - 41 and many other copy parameters. 2015-03-12 English Commodore 64 12.7 KB 1,445 Download C-64 Disk Copy HOT C-64 Disk Copy by Luke Mester is a straight forward full disk copier with 1 or 2 drive capabilities. With a 211 Block buffer, this is going to copy single drive tasks in as few swaps as possible. 2015-04-22 English Commodore 64 3.97 KB 1,742 Download Canada A/M HOT Written by David Fillmore in 1984 and broken by Mr. Nike & Clone Man. Canada A/M is a full disk copier 4 pass copuer with a nice interface. Worthy of any copier collection. 2015-04-22 English Commodore 64 16.34 KB 1,353 Download Carbon Copy II HOT Carbon Copy II was released by Smart Software in 1984. This copy program has many extra features including file copying and error creation. This was one of the early copiers able to handle copy protection at the time. 2015-10-04 English Commodore 64 46.49 KB 1,626 Download CFB's 20-Second Copy v3.0 HOT CFB's 20-Second Copier v3.0 is a simple dual drive copier which likely has no provision for handling copy protection of any kind. 2017-10-01 English Commodore 64 3.38 KB 1,299 Download Clone Machine HOT Clone Machine released by Exodus in 1985 is a subset of the Super Clone Machine program. With this you can copy disks or files and edit tracks / sectors. 2019-07-05 English Commodore 64 19.59 KB 1,000 Download Copy ++ v4.0 HOT Copy ++ v4.0 is a 42 track disk copier with some extra utilities. Spread by JAM'86. 2015-12-16 English Commodore 64 4.04 KB 1,372 Download Copy Box v1.0 HOT Copy Box v1.0 by Ayatollah of mighty Titan is a nice compilation of 3 disk copiers into a single file. Included in the pack is RENEGADE Quick file copier, MAVERICK Data copier and MAVERICK single disk nybbler. 2017-04-23 English Commodore 64 18.71 KB 1,357 Download Copy II v2.5 HOT Back in the day, I remember this being one of the best non-parameter copiers around. Works with multiple drives and device #'s up to 11. 2015-03-13 English Commodore 64 16.53 KB 1,404 Download Copy II v2.6 HOT Copy II v2.6 for the Commodore 64 and 128 - This was one of the better copiers back in the day. 2019-02-04 English Commodore 64 16.91 KB 1,063 Download Copy II v2.7 HOT Copy II 64 v2.7 for the Commodore 64 - There certainly was a lot of versions of this program back in the day and since I've already started collecting them, might as well fill in the gaps. According to the C64 Copy Protection Site, this was a version previous to Jim Drew re-writing the program. 2019-07-24 English Commodore 64 17.11 KB 925 Download Copy II v2.8 Copy II v2.8 by Central Point Software, released in 1985 - This is another version of the popular full disk nibbler copy program. 2019-07-05 English Commodore 64 12.17 KB 838 Download Copy II v3.2 HOT Copy II was a great copy program back in the day. This isn't the newest version, but it might have some parameters (crack files) specific to this version, so worth collecting. 2015-10-26 English Commodore 64 54.4 KB 1,400 Download Copy II v4.0 HOT Central Point Software - 1985-88. This is one of the last versions of Copy II for the Commodore 64 and 128. Supports parameters, and auto-boots in 128 mode. Parameters on disk/side two. 2015-03-13 English Commodore 64 119.94 KB 1,740 Download Copy-Q v1.1 HOT Copy-Q v1.1 is one of the earliest full disk copiers I remember using that supported copying disks with errors. Multiple drives can be used for source and destination. 2015-04-21 English Commodore 64 7.02 KB 1,128 Download Copy-Q v2.0 HOT There used to be a really good disk nibbler called Copy-Q, but I don't think this is it. Although, this does appear to be a nice full disk copier, it doesn't have much in the way of nibbler options. 2015-03-13 English Commodore 64 9.55 KB 1,011 Download Copy-Q v2.1 HOT Copy- Q 2.1 by Star*Fleet. This was one of my favorite copiers when I was a kid. 2015-10-20 English Commodore 64 10.29 KB 1,262 Download Copy-Q v3.0 HOT Copy-Q 3.0 is a hiqh-speed diskette backup program the Commodore 64 computer that backs up your copy-protected software. Copy-Q 3.0 is designed for ease of use, speed, and reliability. Copy-Q 3.0 will make backup copies of almost any diskette-based program for the Commodore 64. This particular version of Copy-Q v3.0 is an Isepic'd copy. Since I don't have a full copy of this program yet, I'll post this one. Here is a link to the manual. 2020-07-10 English Commodore 64 13.46 KB 1,059 Download Copy-Rom HOT Copy-Rom by the Bittstoppers is a collection of 3 disk copiers all rolled up into a single file. After loading the file, you'll need to SYS 32768 to run it. 2015-11-01 English Commodore 64 11.23 KB 1,151 Download DFC - Diskette File Copy v3.2 DFC - Diskette File Copy v3.2 by Layton Berry (July 27th, 1985) - "Welcome to D F C - Diskette File Copy. I call it DFC for short. DFC puts you in control of your disk storage. It makes it easy to move files from one diskette to another. And it tells you what you need to know to make decisions as you go." This is one of the most complete disk copying utilities I can recall outside of commercial software. When I say complete, I don't necessarily mean it's a super duper copy anything utility, but more in the sense that it holds your hand through the whole process, has bonus features that do things outside of whole disk copies, and it has a ton of documentation included on the disk. 2023-07-20 English Commodore 64 70.58 KB 236 Download Di-Sector v2.0 HOT Di-Sector 2.0 by Mike J. Henry and Bruce Q. Hammond was released by Starpoint Software in 1984. This is more than just a copier, it's a complete arsenal of copiers and more. 2015-10-25 English Commodore 64 67.41 KB 1,212 Download Di-Sector v3.0 HOT Di-Sector v3.0 was released by Starpoint Software in 1985. This is one of the all time great copiers. 2015-10-26 English Commodore 64 51.81 KB 1,469 Download Disk Busters Mr. Nibble HOT (B)1984 by The Bandit - Mr. Nibble was one of the nicer nibble copiers back in 1984. This copier can do tracks higher than 35 and also 1/2 tracks. 2015-03-13 English Commodore 64 7.2 KB 1,152 Download Downloads: Page 1 of 4 1 2 3 4 Back'''
