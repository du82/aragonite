description = "Commodore 64 & 128 applications, utilities, tools and more!"
full_description = '''Overview Search Up Category: SID Players Downloads: 22 Enhanced Sidplayer HOT Enhanced Sidplayer (COMPUTE! 1986) released with aditional utilities and a disk full of demo music by Red Sector. Included with the Sidplayer is the following: SidPlayer - Plays SidPlayer songs Sid Editor - Lets you enter, edit and play back SidPlayer Music files Polycon Utility - Converts a solo voice into polyphonic voices Utldur - Changes a given range of notes into utility durations SpeedScript -> .WDS - Converts SpeedScript text into a .WDS Singalong song file EasyScript -> .WDS - Converts EasyScript text into a .WDS Singalong song file Sid Copier - Convenient was to copy any number of music, word or picture files Basic Merge Demo - Demo of SidPlayer music merged with a BASIC program Merge Utility - Lets you combine several music files to form one large file Extract Utility - Lets you extract given range of notes from a song 2021-10-31 English Commodore 64 86.79 KB 1,715 Download GeoPlayer v1.1 GeoPlayer v1.1 by M.Angelini (geoRAM not GEOS) is a very cool utility designed to take advantage of the speed and capacity of the geoRAM RAM expansion and the various clones. With geoPlayer, you can play back .WAV files, SID music and Koala pictures. The ability to upload these files to geoRAM is also built into the program. There are a few limitations, such as only 10 Koala pics, and SIDs can only load to address $1000, but still a cool tool, and hopefully future versions will overcome these limitations. 2021-10-31 English Commodore 64 13.1 KB 546 Download Music Star Music Star by Knees Calhoon is a nice menu type interface SID player for .MUS type SID music. Really easy to use interface with just the right amount of options. 2021-04-04 English Commodore 64 24.02 KB 753 Download Rob's 30120 Music Player v1.0a HOT Written by Robert Little. Rob's Music Player will play all 30120 music files created with Master Composer. The program can be controlled with either a joystick in port 2 or the cursor keys. A couple music files are included on the disk. 2015-04-02 English Commodore 64 9.34 KB 999 Download Sid Accompanist HOT Sid Accompanist was designed and programmed by Art Perlinger and was released in January 1989 by Witch Doctor Production. Not super flashy, but gets the job done when you want to listen to some SIDS. 2015-10-11 English Commodore 64 22.27 KB 944 Download Sid Player III NEW SID Player ]I[ by Craig Chamberlain - Found this player in a random archive and noticed I don't have it in the collection. I'm going to assume this is a modified version of the SID Player from Compute! magazine. As a bonus, this disk come with many SIDs to check out. If you ever wanted to know ANYTHING about SID Player from Compute!, check out this site - https://sidplayer.org 2025-02-24 English Commodore 64 91.1 KB 12 Download SID Player v0.9 HOT This is a program that can playback .SID files found in the HVSC collection (http://hvsc.c64.org/) on a real Commodore 64/128. Make sure you have the most recent HVSC version for your sid files. It was designed for both PAL and NTSC computers, and will play all sid songs at correct system speed. In the zip file there are docs and several versions of the program for various storage types such as sd2iec, 1541 ultimate, IDE64, etc... 2015-03-08 Commodore 64 51.57 KB 2,064 Download SID Tuner v2.1 HOT By John L. Tuner - SID Tuner is a 3 voice and 6 voice (Stereo) sid player. Stereo sids require an additional sid chip hardware add-on. The program has an exstensive help file. 2015-04-02 English Commodore 64 13.73 KB 1,018 Download Sidpic v1.2 HOT Sidpic v1.2 is an early version of Kermit R. Woodall's SID music player that not only plays your tunes but displays pictures at the same time. 2017-10-12 English Commodore 64 10.82 KB 978 Download Sidpic v2.5 HOT 1986 by Kermit R. Woodall. Sidpic was written to replace or provide an alternative to SINGALONG and the regular SIDPlayers like KPLAY. Sidpic also allows the display of hires graphics pictures while your SID music plays. Full docs are included on the disk along with a sample sid. 2015-04-02 Commodore 64 12.92 KB 903 Download Sidpic v3.4 Sidpic v3.4 was written by Kermit R. Woodall and release in June 1987. Sidpic is a sid player that offers singalong type playing. Full docs and some sample sids are included on the disk. 2015-10-09 English Commodore 64 20.18 KB 868 Download Sidpic v3.5 HOT Sidpic v3.5 was written by Kermit R. Woodall. Not sure when this particular version was released, but I do believe it was the last version. Nice SID player which can also deal with .wds (word files) and .pic (Koala/Doodle) files that may accompany music. 2015-10-11 English Commodore 64 17.05 KB 1,027 Download SidPlay64 v0.9 (All Versions) HOT This is a program that can playback .SID files found in the HVSC collection (http://hvsc.c64.org/) on a real Commodore 64/128. Make sure you have the most recent HVSC version for your sid files. It was designed for both PAL and NTSC computers, and will play all sid songs at correct system speed. In the zip file there are docs and several versions of the program for various storage types such as sd2iec, 1541 ultimate, IDE64, etc... 2015-04-02 English Commodore 64 51.57 KB 1,024 Download SIDPlay64 v1.00 HOT This is a program that can playback .SID files found in the HVSC collection on a real Commodore 64/128. You will find different versions of SP64 in this package, most of themwill work on all devices. But I suggest you use the correct version for for your device, since they might contain special commands. Versions of the program: sidplay64-reu-1541u2cmd.prg – 1541 Ultimate II version with REU. sidplay64-reu-sd2iec.prg – SD2IEC version with REU. sidplay64-reu-1541u-netdrive.prg – 1541 Ultimate & Netdrive with REU. sidplay64-reu-iec-cmd-ide64.prg – CMD drives, IDE64 devices & other IEC devices, with REU. sidplay64-reu-normal.prg – REU version for 1541, 1571, 1581 and clones of these. sidplay64-normal.prg – Standard version for 1541, 1571, 1581 and clones. sidplay64-1541u-netdrive.prg – 1541 Ultimate & Netdrive. sidplay64-iec-cmd-ide64.prg- CMD drives, IDE64 devices & other IEC devices. sidplay64-sd2iec.prg – SD2IEC. (The 1541U2 software iec mode has been disabled for this build.) 2016-01-11 English Commodore 64 59.2 KB 1,313 Download SIDPlay64 v1.2.1 A native Commodore 64 program that can play SID files from the High Voltage SID Collection (HVSC). It will run from any C64 friendly device. SID songs will be played back at correct speed on both PAL and NTSC computers. Now also supports SIDFX, Turbo Chameleon and BASIC sid files and lastly, a inject song length tool to play songs at correct lengths. Changes in v1.2.1 -* Updated: SIDFX card detection. For the latest version of SIDPlay64, visit the SourceForge Repository here - https://sourceforge.net/projects/sidplay64/ 2022-12-16 English Commodore 64 229.03 KB 430 Download SIDPlus v2.0 HOT SIDPlus v2.0 by Kenneth Bell Jr. is a SID player that will play music, words and pictures - think karaoke. Pictures can be Doodle, Koala & most 32 block graphics. Version 2.0 adds support for using the joystick to make selections. 2015-04-02 English Commodore 64 13.18 KB 931 Download Stereo Sid-Player v10.2 HOT Written by Mark A. Dickenson, Stereo Player v10.2 was a popular SID music player for the Commodore 64. 2015-10-12 English Commodore 64 79.42 KB 933 Download Stereo Sid-Player v10.3 HOT Stereo Sid-Player was the defacto standard sid player for those lucky people who had two sid chips. This is version 10.3 released in 1988 by Mark A. Dickenson. 2015-05-04 English Commodore 64 19.2 KB 936 Download Stereo Sid-Player v10.5 HOT Stereo Player v10.5 was written by Mark A. Dickenson. This particular version appears to be the last released version. My belief is that this is what was going to be version 11. 2015-10-12 English Commodore 64 65.1 KB 1,133 Download Stereo Sid-Player v3.0 HOT 1986 Disk-Vision by Mark A. Dickenson. Technically this program is called "The Sid-Player Stereo Keyboard Version 3.0". Will play stereo and non-stereo sids with lots of playback options. Docs and a few sample songs are on the disk also. 2015-04-02 English Commodore 64 19.77 KB 926 Download Stereo Sid-Player v7.0 Stereo Sid-Player v7.0 (1987 by Mark A. Dickenson) - This is by no means the newest version of this excellent Sid player, but I like to keep all versions of software around because I've found that sometimes newer versions will remove features, or introduce new bugs. This particular archive has a nice collection of 18 stereo sids included from the great 1980's. Please note - you will need to have two SID chips in your Commodore 64 to get full benefit from this program. 2022-12-24 English Commodore 64 48.27 KB 341 Download The Magic SID Machine HOT This is a pretty cool sid music player. You can create a directory file of all the sid songs on your disk and then print them out and/or play the music. 2015-04-02 English Commodore 64 7.85 KB 1,056 Download Back'''
