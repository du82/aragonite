he Paperclip word processor from the Commodore Computer Club News (Sept. 1984, Page 12) Tips on using Paperclip - from Commodore Computer Club News (Nov. 1984, Page 7) More Tips on Using Paperclip - from Commodore Computer Club News (May 1985, Page 6) Paperback Writer by David Foster (Digital Solutions 1985) Pocket Writer 3 Printfox Quick Brown Fox (Cartridge) Here's a Review of the Quick Brown Fox from the Commodore Computer Club News (May 1984, Page 4) Quickwriter III - (Educorp, Cardiff CA) Script-64 Skiwriter (Mastertronic) SkiWrite II (Cartridge) SmithWriter Snoopy Writer SpeedScript Story Writer Super-Text Superscript 64 Swift Word Processor SwiftWord (Might be different than Swift Word) Tasword 64 Text 64 Text Master The Tool The Write Stuff TOTL Text 2.6 Trio Plus Trio Word Vizawrite 64 WordPro 3 Plus/64 WordPro 64 Word Processor [Comtec] Word Processor - Version 7 Word Worker v1.0 Word Writer (Green Valley) Word Writer 3 Word Writer 4 Word Writer 5 Word Writer 6 Wordcraft 64 Wordmaster Writers Choice Write Now! 64 (Cardco) Here's a review of the Cardco Write Now! 64 from the Commodore Computer Club News (Sept. 1984, Page 11)'''
