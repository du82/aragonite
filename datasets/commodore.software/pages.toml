full_description = '''Overview Search Up Category: Demos Number of Subcategories: 1 Subcategories: Demo Tools Downloads: 9 Burp Construction Kit Burp Construction Kit by HCA, released in April 1987, for the Commodore 64 - When I was a kid, I had a ton of fun with this sound demo that made the C64 create all kinds of burp sounds. 2021-10-27 Commodore 64 29.13 KB 488 Download CBM Commodore 64 Store Demo HOT This is the demo program you'd see running on a Commodore 64 when you'd go to a department store or similar. 2019-02-04 English Commodore 64 54.58 KB 1,086 Download Commodore Store Demos I was going through some disks DLH over at Bombjack sent me, and I found this disk that appears to be something Commodore perhaps supplied to retail stores to demo the features of the Commodore 64. I love the part of the demo that "projects" their popularity. ** Note - The disk image attached to this is not the correct disk. I'm trying to find the correct disk, but so far haven't had any luck. I'm leaving this here though so I remember to look into it more. 2024-02-17 English Commodore 64 58.28 KB 192 Download Harry Potter"s BASIC Demos #01 Just a few of my BASIC demos. :) Uses DirMenu to execute my programs. GNU/GPL This email address is being protected from spambots. You need JavaScript enabled to view it. 2019-07-14 English Commodore 64 3.46 KB 721 Download Killer Drive NEW It's the infamous Killer Drive! 2025-02-22 Commodore 64 4.9 KB 15 Download The Tuneful Eight (Ultimate 64 Edition) If you are fortunate enough to have an Ultimate 64 by Gideon, you absolutely MUST play this demo released at the 2019 Evoke competition. It's so amazing to hear 8 SID chips (24 channels) all playing at once! In this particular archive there is a .cfg file you can load into your Ultimate 64 that will configure the settings you need to make this work. If you'd like to preview the demo beforehand, here's a YouTube link. 2022-12-27 English Commodore 64 1.56 MB 286 Download Wall of Sound II Wall of Sound by Bad Boy of Reflex - This is a pretty neat demo of the wide range of sound effects and music you can produce with the Commodore 64. 2023-05-20 English Commodore 64 23.31 KB 296 Download Xtreme Mega Comeback [Camelot] Xtreme Mega Comeback by Camelot is a 256 byte demo released in August 2003. Pretty neat bouncing comet with a trailing tail using just standard keyboard characters. 2019-07-25 English Commodore 64 1.19 KB 795 Download Xtreme Mega Comeback II [Camelot] Xtreme Mega Comeback II by Camelot is another 256 byte demo released in August 2003. This demo is bouncing raster bars with something hidden. 2019-07-25 English Commodore 64 2.05 KB 728 Download Back'''
