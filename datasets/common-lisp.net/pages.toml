["https://common-lisp.net/project/cl-plus-j"]
title = "CL+J: A Common Lisp Interface to Java"
full_description = '''CL+J is a JNI based interface to a Java Virtual Machine through CFFI. It targets safe, exact and complete access to Java from Common Lisp with as high integration as possible of the Java and CL respective runtime environments (especially at the condition/exception level). CL+J uses a set of reader dispatch-macros to simplify the Java code interface. In CL+J the traditional "Hello World!" becomes: CL+J 0.4 works fully on MKCL on any platforms supported by MKCL (Linux/x86 (32bits), Linux/x86_64 (64 bits), Windows XP (Win32) or later, Windows 7 (Win64) or later) with either Java 6, 7 or 8. Co-existence with such an elaborate set of foreign code as a full Java Virtual Machine certainly is, constitutes pretty much the ultimate acid test for a Common Lisp Foreign Function Interface subsystem. Only a few Common Lisp environments can meet such a challenge. Here is a non-exhaustive list of CL systems known to work with CL+J 0.3, in decreasing order of reliability: ManKai Common Lisp (MKCL): CL+J 0.3 works fully on MKCL on any platforms supported by MKCL (Linux/x86 (32bits), Linux/x86_64 (64 bits), Windows XP (Win32), Windows 7 (Win64)). No special JVM option is required on any of the widely available JVMs such as Oracle's HotSpot, IcedTea or IBM's JVM. MKCL is the reference platform for the development and debugging of CL+J. Clozure Common Lisp (CCL): CL+J 0.3 works on CCL for Linux/x86 or Linux/x86_64 if IBM's JVM is used with option -Xrs but will crash during JVM initialization without that option or if Oracle's HotSpot or IcedTea is used. CL+J 0.3 seems to work fully on CCL for Windows XP (Win32) or Windows 7 (Win64) with any of the widely available JVMs (Oracle's HotSpot, IBM's JVM) and this without any special JVM option. CL+J 0.3 may work on CCL for some the other platforms supported by CCL (such as Mac OS X, Solaris, ...). Note that on CCL the reader macro #_ is replaced by #] since the former is already used by CCL for its foreign function interface. ECL: CL+J 0.3 should work on ECL for Linux (32 bits or 64 bits) as long as the foreign code (JVM included) behaves strictly according to ECL's requirements on Unix signal masks. Such a compliance on the part of the foreign code is not very likely. CL+J 0.3 should most probably (but this has not been tried) work fully on ECL for Windows XP (Win32) or Windows 7 (Win64) with any of the widely available JVMs (Oracle's HotSpot, IBM's JVM) and this without any special JVM option.'''
year_published = 2025
clearnet = "https://common-lisp.net/project/cl-plus-j"
