full_description = "local-time is a development library for manipulating date and time information in a semi-standard manner. It is based almost entirely off of Erik Naggum's paper, The Long, Painful History of Time. It includes such features as: The library has been tested under sbcl 1.1.x on Linux x86 and x86-64. It requires cl-fad for operation (Stefil is required to run tests). It has been placed under the BSD license. This library is still under development. Contributors and feedback are both very welcome. The maintainer of this project is Daniel Lowe. You may also retrieve the latest version using git, a distributed version control system. Once git is installed, you may pull the source code with the following command: For support and feedback, please join the local-time-devel mailing list. To receive announcements of new releases, you may join the local-time-announce mailing list. You should start by getting the latest source using git. When you've made and committed your changes, use git format-patch to email the patches to local-time-devel@common-lisp.net."
