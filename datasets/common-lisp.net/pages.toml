["https://common-lisp.net/project/slime"]
title = "SLIME: The Superior Lisp Interaction Mode for Emacs"
full_description = 'SLIME is a Emacs mode for Common Lisp development. Inspired by existing systems such Emacs Lisp and ILISP, we are working to create an environment for hacking Common Lisp in. The slime-devel@common-lisp.net mailing list is used for all SLIME discussions. This is where to ask questions and generally participate in the development. To post messages to that list you must be subscribed. SLIME is an Extension of SLIM, which was written by Eric Marsden in mid-2003. Luke Gorrie and Helmut Eller took over development to create SLIME as a traditional "open-source project." Since then the hacking has continued at a rapid pace as many more hackers joined the fray. HTML style shamelessly stolen by Luke Gorrie from the sawfish homepage. Any remaining HTML-conformance is solely due to Stephen Caldwell. Last updated: 2024'
