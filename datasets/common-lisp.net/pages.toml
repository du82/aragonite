["https://common-lisp.net/libraries"]
title = "Common Lisp libraries overview"
full_description = '''Table of contents Audio Build Systems Compilers, code generators Crypto Cryptocurrencies Database Data Structures Docker images Foreign Function Interface Game Development Graphics GUI Implementations JSON YAML Language extensions Learning and Tutorials Library Manager Machine Learning Natural Language Processing Network and Internet Numerical and Scientific Parallelism and Concurrency Regex Scripting Text Editor Resources Text Parsers Text Processing Tools Unit Testing Utilities XML Contributing Your contributions are always welcome! Please submit a pull request or create an issue to add a new framework, library or software to the list. Audio Open Music - a visual programming, computer-aided composition environment. GPL3.OM7 - a new implementation of the OpenMusic visual programming and computer-aided composition environment including a number of improvements on graphical interface, computational mode, and connection to external software libraries. GPL3.Incudine - Music/DSP programming environment for Common Lisp. Useful to design software synthesizers or sound plugins from scratch. It is also a compositional tool that allows to produce high quality sounds controllable at the sample level, defining and redefining the digital signal processors and the musical structures on-the-fly.cl-collider - A SuperCollider client for CommonLisp. With a tutorial and live coding demos. Public domain. csound - A sound and music computing system. Includes CFFI and FFI interfaces for Common Lisp.CLM - Common Lisp Music is a music synthesis and signal processing package in the Music V family. It provides much the same functionality as Stk, Csound, SuperCollider, PD, CMix, cmusic, and Arctic — a collection of functions that create and manipulate sounds, aimed primarily at composers (in CLM's case anyway).cl-patterns - a system for composing music via Lisp code, heavily inspired by SuperCollider’s patterns system, with aims to implement much of it, but in a more robust, expressive, consistent, reflective, and lispy way. Audio output through SuperCollider, with preliminary support for Incudine, and MIDI through ALSA.cl-openal - bindings for the OpenAL audio library. Public domain.Common Music - the repository of an ancient version of Common Music (version 2.12.0), the presumably last version which ran on Common Lisp dating from around 2007-09, before work on Common Music shifted to (scheme-based) cm3. Slippery Chicken - Algorithmic composition library which outputs Midi, Common Music Notation, pdf-score via Lilypond and sound via Common Lisp Music. GPL3.Common Music Notation - Common Music Notation (CMN) provides a package of functions to hierarchically describe a musical score. Public domain.cm-incudine - extends Common Music 2 with realtime capabilities. GPL2.Mégra - A mini-language to make music with variable-order markov chains and some other stochastic shenanigans. GPL3.Music - A framework for musical expression in Lisp with a focus on music theory (built from scratch, unrelated to Common Music).rq - A library for rhythm transcription in OpenMusic (version 6.10 and later). demo video. GPL3.scheduler - The time based musical event scheduler for Common Lisp. Apache2.0.mixalot - Loosely-coupled collection of audio libraries for mp3, ogg vorbis, flac. Used for the Shuffletron music player.osc - an implementation of the Open Sound Protocol. LGPL2.1.Harmony - A real-time sound processing and playback system. Artistic License 2.0.Build Systems :star: ASDF - Another System Definition Facility; a build system for Common Lisp. Expat.asdf-linguist - Extensions for ASDF. Expat.asdf-viz - a tool to visualize the library dependencies of ASDF systems, the call graph of a function and the class inheritances. LLGPL.Compilers, code generators APL April - The APL programming language (a subset thereof) compiling to Common Lisp. Replace hundreds of lines of number-crunching code with a single line of APL. Apache2.C, C++ cmacro - Lisp macros for C. MIT.C-mera - a source-to-source compiler that utilizes Lisp's macro system for meta programming of C-like languages. GPL3.lispc - a powerful "lispsy" macrolanguage for C. MIT.with-c-syntax - a fun package which introduces the C language syntax into Common Lisp. (Yes, this package is not for practical coding, I think.) WTFPL Licence.ecrepl - an interactive REPL for the C language. BSD_2Clause.Software-Evolution-Library - The SEL enables the programmatic modification and evaluation of software (C/C++ support using Clang, compiled assembler, and linked ELF binaries). GPL3.Crypto :star: Ironclad - A library of crypto functions for Common Lisp. Not considered secure, but is still useful for the message digest functions. Expat.crypto-shortcuts - Collection of common crypto shortcuts. Artistic License 2.0.trivial-ssh - An SSH client library. Expat.cl-ssh-keys - Common Lisp system for generating and parsing of OpenSSH keys. BSD_3Clause.cl-bcrypt - Common Lisp system for parsing and generating bcrypt password hashes. BSD_3Clause.see also cl-pass, using pbkdf2.Cryptocurrencies cl-monero-tools - Common Lisp toolbox to work with the Monero cryptocurrency. GPL3. Not in Quicklisp.emotiq - a next-generation blockchain with an innovative natural-language approach to smart contracts. MIT.peercoin-blockchain-parser - parse the blockchain contained in a file and export some of its data to a text file, a SQL script or a database. It can also create a database using the RPC of a Peercoin daemon as source of data instead of a blockchain file. LGPL3. Not in Quicklisp.peercoin-calculator - This program gives you the probability of generating a POS or POW block within 10 minutes, 24 hours, 31 days, 90 days and 1 year, as well as the reward that can be expected. GUI in Qt. GPL3. Not in Quicklisp.peercoin-vote - A voting system based on data from the blockchain (addresses and balances). GPL3. Not in Quicklisp.See also legochain, a simple educational blockchain. Database cl-yesql - SQL statements live in their own files, in SQL syntax, and are imported into Lisp as functions. You are not limited to the features a DSL supports. Based on Clojure's Yesql. MIT.ORMs :star: clsql - An SQL database with a Common Lisp interface. LLGPL.👍 mito - An ORM for Common Lisp with migrations, relationships and PostgreSQL support LLGPL. mitho-auth, a mixin class for use authorization; mito-attachment, a mixin class for file management outside of RDBMS.cl-dbi - A database-independent interface for Common Lisp. LLGPL.dbd-oracle - an Oracle database driver for CL-DBI. LLGPL.crane - Another ORM. Expat.datafly - A lightweight database library. 3-clause BSD.sxql - A DSL for generating SQL. 3-clause BSD.Persistent object databases bknr.datastore - a CLOS-based lisp-only database in RAM with transaction logging persistence. Manual. licence. (see also chap. 21 of "Common Lisp Recipes")ubiquitous - A library providing easy-to-use persistent configuration storage. Artistic License 2.0.cl-prevalence - in-memory database system. Implementation of Object Prevalence, in which business objects are kept live in memory and transactions are journaled for system recovery. github fork. LLGPL. See also cl-prevalence-multimaster, to syncronize multiple cl-prevalence systems state.Graph databases cl-agraph, a minimal client for AllegroGraph. AllegroGraph is a horizontally distributed, multi-model (document and graph), entity-event knowledge graph technology. It is proprietary and has a free version with a limit of 5 million triples.cl-neo4j - neo4j RESTFUL client interface.vivace-graph - graph database & Prolog implementation. Takes design inspiration from CouchDB, neo4j and AllegroGraph. It implements an ACID-compliant object graph model with user-defined indexes and map-reduce views. It also implements a master / slave replication scheme for redundancy and horizontal read scaling. Querying the graph is accomplished via a number of Lisp methods or via a Prolog-like query language. MIT.facts - an in-memory graph database with transactions and rollbacks, logging/replay and dumping/loading to/from disk. BSD-style license (ISC).Wrappers :star: postmodern - A library for interacting with PostgreSQL. zlib.cl-sqlite - Bindings for SQLite. Public domain.cl-memcached - Fast, thread-safe interface to the Memcached object caching system. Expat.cl-mongo - MongoDB client. Expat.cl-redis - Redis client. Expat.cl-disque - Disque client. 3-clause BSD.cl-rethinkdb - RethinkDB client. Expat.cl-mango - A minimalist CouchDB 2.x database client. BSD_3Clause. See also clouchdb - Library for interacting with CouchDB. FreeBSD.Migration tools cl-migratum - a system which provides facilities for performing database schema migrations, designed to work with various databases. BSD_3Clause.postmodern-passenger-pigeon - a migration manager for postmodern. No licence specified.To third parties dyna - an AWS DynamoDB ORM. MIT.cl-influxdb - an interface to the Time Series Database InfluxDB. MIT.Tools pgloader - a data loading tool for PostgreSQL. PostgreSQL Licence.Data Structures 👍 str - a modern, simple and consistent string manipulation library. MIT.👍 FSet - A functional, set-theoretic collections data structure library. LLGPL.trivial-extensible-sequences - Portability library for the extensible sequences protocol (SBCL documentation). zlib.bst - Binary Search Tree. GPL3. Not in Quicklisp.pileup - a portable, performant, and thread-safe binary heap for Common Lisp. MIT.sycamore - a fast, purely functional data structure library. BSD_3Clause.genhash – hash table implementation with API from generic methods. Public domain.cl-ctrie - lock-free, concurrent, key/value index with efficient memory-mapped persistence and fast transient storage models. MIT. cl-data-structures - a portable collection of data structures and algorithms (mainly dicts and sequences, with some statistical functions). BSD.listopia - a list manipulation library inspired by Haskell's Data.List. LLGPL.hash-set - a 