["https://common-lisp.net"]
title = "Welcome to Common-Lisp.net!"
full_description = "Latest Common-Lisp.net news 2025-03-03Gitlab has been moved to a new host. Other services will follow to this new host. Please update your remotes to use gitlab.common-lisp.net if they were using bare common-lisp.net previously. Follow discussion of server migration at the #common-lisp.net channel on libera.chat IRC. 2022-02-08All project sites have moved from https://common-lisp.net/project/<project-name> to https://<project-name>.common-lisp.dev. The former now redirects to the latter, so bookmarks should continue to work. Additionally, we have added new content to our FAQs on how to deploy a website to https://<project-name>.common-lisp.dev, as well as use GitLab CI for testing and more complicated tasks. 2020-04-05Mailing list archive clean-up: Since the inception of common-lisp.net, hosting of mailing lists has been part of our service offering. For a long time, two or even three mailing lists were created with every new project. Many of those were never used. Today, we cleared out all mailing list archives which didn't have any messages in them and which are not in active operation. 2019-12-27 ABCL fundraiser!The Common Lisp Foundation hosts an appreciation fundraiser for the ABCL project. Read more... Latest Lisp news What is Common Lisp? Common Lisp is the modern, multi-paradigm, high-performance, compiled, ANSI-standardized, most prominent (along with Scheme) descendant of the long-running family of Lisp programming languages. Common Lisp is known for being extremely flexible, having excellent support for object oriented programming, and fast prototyping capabilities. It also sports an extremely powerful macro system that allows you to tailor the language to your application, and a flexible run-time environment that allows modification and debugging of running applications (excellent for server-side development and long-running critical software). It is a multi-paradigm programming language that allows you to choose the approach and paradigm according to your application domain. Curious? Get started!"
