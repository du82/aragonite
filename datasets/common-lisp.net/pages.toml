["https://common-lisp.net/project/armedbear"]
title = "Armed Bear Common Lisp (ABCL) - ANSI Common Lisp on the Java Virtual Machine"
full_description = "Armed Bear Common Lisp (ABCL) is a full implementation of the Common Lisp language featuring both an interpreter and a compiler, running in the JVM. Originally started to be a scripting language for the J editor, it now supports JSR-223 (Java scripting API): it can be a scripting engine in any Java application. Additionally, it can be used to implement (parts of) the application using Java to Lisp integration APIs. Running on one of the explictly supported platforms: Windows, Linux, MacOS X, OpenBSD, NetBSD, FreeBSD, Solaris or Google App Engine The use of Armed Bear Common Lisp (ABCL) is covered by the GNU General Public License with Classpath exception, meaning that you can use ABCL in your application without the requirement to open the sources to your application."
