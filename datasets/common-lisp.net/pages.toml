["https://www.common-lisp.net/project/okra/manual.html"]
title = "Okra"
full_description = '''Whenever I refer to directories, file names or commands issued on the computer they will be written in mono-space and verbatim. Ogre is a 3D graphics library written in C++. This means that we'll have to generate code for CFFI (my chosen FFI) in CL and we'll have to generate C wrapper code for Ogre's C++ classes and methods since talking directly to C++ is riddled with problems (which will not be further discussed in this document). Both the generated C++ code as well as the CL code should be human readable and produce as little warnings as possible when compiling! (When having to choose between the generated code being readable and the code of the bindings generator being readable I have given the former priority. I'm not so sure whether it's a good choice but time will tell...) The bindings should be a usable subset of Ogre's API, enough to create a game. Due to various reasons (time, man power, differences between C++ and CL) it is probably not possible to ever automatically generate complete bindings to the Ogre API. At the time of this writing I am not anymore working exclusively on Okra. I do use Okra in my private projects and through that it will slowly grow. All examples expect Ogre to be installed so download the source from: http://www.ogre3d.org/download/source (you'll need "OGRE 1.6.x Source for Linux / OSX"). Configure, compile and install in /usr/local. Ogre has some dependencies which need to be installed first. Also, see here for more information on the whole process: http://www.ogre3d.org/wiki/index.php/Building_From_Source#Linux The Linux start-up scripts are written and tested using SBCL (1.0.25.debian at the time of writing) and expect to find sbcl in the path. They expect to find the necessary Ogre libraries in /usr/local/lib/OGRE and all others in the lib directory of the Okra distribution. All examples depend on the Ogre SDK to be installed so download it from: http://www.ogre3d.org/download/sdk (you'll need "OGRE 1.6.x SDK for Code::Blocks + MinGW C++ Toolbox").'''
year_published = 2025
