["https://common-lisp.net/news"]
title = "common-lisp.net News"
full_description = '''Latest Common-Lisp.net news2025-03-03Gitlab has been moved to a new host. Other services will follow to this new host. Please update your remotes to use gitlab.common-lisp.net if they were using bare common-lisp.net previously. Follow discussion of server migration at the #common-lisp.net channel on libera.chat IRC. 2022-02-08All project sites have moved from https://common-lisp.net/project/<project-name> to https://<project-name>.common-lisp.dev. The former now redirects to the latter, so bookmarks should continue to work. Additionally, we have added new content to our FAQs on how to deploy a website to https://<project-name>.common-lisp.dev, as well as use GitLab CI for testing and more complicated tasks. 2020-04-05Mailing list archive clean-up: Since the inception of common-lisp.net, hosting of mailing lists has been part of our service offering. For a long time, two or even three mailing lists were created with every new project. Many of those were never used. Today, we cleared out all mailing list archives which didn't have any messages in them and which are not in active operation. This cleanup should allow more effective browsing of the archives as 571 mailing lists without content are no longer part of the archive listing. If you think we cleared out an archive in error, please let us know so we can restore. 2019-12-27 ABCL fundraiser!The Common Lisp Foundation hosts an appreciation fundraiser for the ABCL project. An appreciation fundraiser serves as a 'thank you' to those who have invested their (free) time in the project. It isn't intended as a 'bounty' for new functionality. 2019-06-01The Subversion repository maintenance window completed ahead of schedule at 18:00 on June 1st instead of taking the better part of the weekend. During this maintenance window, Subversion repositories were upgraded to the latest standard (1.9). Some repositories were stored in backward compatible formats as far back as 1.1. With the migration, repository access should benefit from performance work done in the server component. Other features that become available with this maintenance include the storage of merge-tracking information. Thank you for your patience! 2019-05-19The site has always been running its own Trac setup, because we were one of the early Trac adopters. While running our own packages, we've also been lenient to install plugins. Due to improved support in both Trac as well as Debian packages, we were able to move to a full-standard setup. These days, many of those plugins have been integrated into Trac or come pre-packaged from Debian. Others have lost their usefulness (OpenID support falls into this category as nobody seems to be supporting that anymore...). For the common-lisp.net team this means we've been able to maintain both our liberal support for user-desired functionality of our Trac users as well as simplifying maintenance of our hosting infrastructure. Thanks to the Trac team for their continued efforts! 2019-04-28On Sunday, April 28th, the common-lisp.net hosting infrastructure experienced an outage of approximately 5 hours when we encountered a unexpected difficulty in upgrading our services. As you know, we take our responsiblity towards the integrity of the data and services associated with common-lisp.net seriously. Part of that responsiblity is owning up to our mistakes, so here’s our deeper explanation of how we inadvertently impinged on the integrity of the main host file system. While work was in progress on changes to set up support for better and faster restore from backup, if such was required, a small change was required on the main BTRFS filesystem: moving a snapshot from one place to another on the file system. This operation couldn't be performed while the system was online, so the VM was brought down. After the VM was down, the main filesystem was mounted on the host system to perform the operation. After unmounting the filesystem and remounting it to verify the result, the filesystem at first wouldn't be mounted. After executing the btrfs rescue zero-log command, the filesystem did mount, but only in read-only mode. Using a combination of the daily backups and the read-only filesystem, a new filesystem with the same content been created. I'm very sorry for the incident in general and having your data at risk in particular. I haven't found any data-loss. Erik Hulsmann common-lisp.net admin 2019-02-09 ASDF fundraiser!The Common Lisp Foundation hosts an appreciation fundraiser for the ASDF project, with up to $5,000 donation doubler. An appreciation fundraiser serves as a 'thank you' to those who have invested their (free) time in the project. It isn't intended as a 'bounty' for new functionality. 2018-11-18There was a short period of down time today in order to support an off-line reorganization of our file systems required to simplify and strengthen our backups and system maintenance tasks. 2018-11-09Our GitLab instance now has a more open account policy: users with a social login will be able to create an account without approval by an admin. In order to support this openness, a more strict login policy has been put into place, requiring all users to log in using 2FA. For those users who don't have a smartphone to install a 2FA app on, here's a c|net article how to do 2FA anyway 2018-11-03There's now infrastructure available to projects to deploy their project pages through GitLab. This infrastructure is now being used to migrate those project pages to GitLab Pages deployment for which there are no OS-level users anymore to update them. 2018-10-26As announced on October 12, empty projects have been removed (archived) from the system. After further cleaning, the updated list consists of these 23 projects: cl-amqpcl-cactus-kevcl-captchacl-gdbmclintcl-lazy-listcl-lexerclotnetcl-playercl-rundowncltl3decldefmuddocutrackisrael-lisplisp-interface-librarymk-defsystemmoviesobjective-clphorplaysametrivial-featuresumpa-lumpa2018-10-12 Intent to remove unused projectsAs per the announcement, the site admins plan to remove the following list of projects which have been determined to neither have a project page nor a code repository. Please contact the site admins before October 26, 2018 to cancel project cleanup in case your project is wrongfully listed. arxanaasdf-installasdf-packagingboston-lispchemboycl-amqpcl-buchbergercl-cactus-kevcl-captchacl-clickatellcl-gdbmcl-gtk2clintcl-lazy-listcl-lexercl-matchcl-odeclotnetcl-pegcl-playercl-rundowncltl3cl-yacc-ebnfdecldefmuddocutrackinnenisrael-lispjess-parselisp-interface-librarymk-defsystemmoviesobjective-clphorplaysamesqlisptiogatrivial-featurestrivial-shellucs-sortumpa-lumpaxml-psychiatrist2018-10-12Today I found some time to enable GitLab's 'reply by e-mail' functionality. When you receive a notification e-mail from our GitLab instance, you can now send a reply to that notification. If the notification was from an issue being updated, then your reply will update the issue with a follow-up commont. 2018-10-10A new version of Common-Lisp.net has been launched! Among other things, the new site features: A site generator implemented in Common Lisp.A gitlab pipeline for automatic deployment.A new responsive design based on Bootstrap and new content.2018-10-06As per the announcement in August, the list of users with O/S level access has been cleaned up: those accounts which haven't been accessed since 2013 (and for which the owner didn't object to removal), have been removed. Home directories will be destructed to comply with GDPR regulations. If you once had an account and you need your access restored, please contact our admins. 2018-02-17The Darcs (a distributed version control system before Git) repositories listed in our darcsweb instance have been converted to our GitLab instance. All use of Darcs on our site has been marked deprecated for a long time and we're happy to have found a way forward, keeping the repository content available to more modern VCSes. 2017-07-15Our server was upgraded to Stretch as part of the regular life cycle management. See our announcement. 2015-05-25Today the system has been declared "CVS clean"! All remnants of CVS have been removed. 2015-05-23On Friday, the system had performance problems due to slow I/O. Checking the S.M.A.R.T. parameters of the disks didn't show anything unusual. Today, the disk system reports running in degraded mode, so we ordered the failing disk to be replaced, causing only minor downtime. The disk array has been rebuilt and it's smooth sailing from here again! 2015-05-22GitLab upgraded to GitLab 7.11.1. 2015-05-15Proposed approach for Darcs repository migration sent out. 2015-05-12The final batch of CVS projects has been migrated. None of the projects opted to move to Subversion, so all of them were migrated to Git+GitLab: gamelibganelongeometryginsenggloutongsharpgtk-cffihtml-templatehyperdochyperspec-lookupieeefp-testsimagoiso8601-datejnillambda-gtklgtklispfaqlispylmudlog4clmcclimmeta-cvsmisc-extensionsmorphologiemovitznionoctoolpalpgphemlockplain-odbcrfc2388rfc2822rjain-utilsrucksacksapaclispsb-simdsnmp1spraystamps-xmls-xml-rpctrivial-freeimageunetworkzipzlibNow that the CVS repositories have been migrated, we'll move to clean up the cvs services from the underlying box and preparations will start to migrate the Darcs repositories on the system. For progress on the Darcs repository migration, watch the clo-devel mailing list. 2015-05-03The next batch of CVS projects has been migrated. None of the projects opted to move to Subversion, so all of them were migrated to Git+GitLab: cl-magickcl-menusystemcl-mp3-parseclosureclouchdbcl-plus-sslcl-ppcrecl-prevalencecl-ropecl-sbmlcl-screencl-seleniumcl-semanticcl-smogamescl-smtpcl-snmpcl-soapcl-storecl-syslogcl-telnetdcl-utilitiescl-wav-synthcl-whocl-x86-asmcl-xmmscl-xmppcorman-sdlcparsecrypticlcxmldefdocdefeditordefinerdefplayerdefwmeclipseelephantfetterflexichainfomus2015-04-27GitLab project fixes issues reported by common-lisp.net admin: loading of commit data. 2015-04-26The next batch of CVS projects has been migrated. None of the projects opted to move to Subversion, so all of them were migrated to Git+GitLab: cinlinecl-blogcl-carboncl-cli-parsercl-cracklibcl-dbfcldoccl-enumerationcl-fltkcl-godbcl-gslclimacsclim-desktopcl-interpolcl-ipccl-jpegcl-libtai2015-04-22GitLab has been upgraded to 7.10.0; one of the tickets we filed with the GitLab project, has been resolved now. 2015-04-19Migration of CVS repositories to Git+GitLab has started. The first batch (10 projects) was converted: anaphoraaspiwork-pdmbayesclbeepbeircbesecellocellscells-gtkcells-odeIn total there are 120 CVS repositories to convert. Project members receive an announcement mail in advance. CVS repositories which are left behind after conversion to another VC will be skipped and projects which are in such a situation are kindly requested to notify the admins of such situation - or even better: clean it up before the admins run into it. Now is your chance! :-) 2015-04-17GitLab upgraded to 7.9.4 2015-04-11The first projects with CVS repositories have received e-mails about the planned migration according to the proposed procedure. We're going in batches, using aphabetical order, so you may not have received e-mail for your projects yet. Don't dispair, it'll come! The announcement e-mail requires action if you want to migrate to Subversion instead of to Git. If you want to migrate to Git+GitLab, there's no need to respond. It's the default. If you want to declare that your project wants to migrate to Subversion without awaiting your announcement e-mail, please file a ticket in the site's Trac instance. 2015-04-08Due to a variety of reasons, the history of the mailing lists of common-lisp.net had spread over a number of sources: the older system's mailman list manager's history (mbox format)the intermediately used mlmmj list manager's history (spool directory, individual mails)the new system's mailman list manager's history (mbox format)With only the archives from the last bullet hosted in viewable form, valuable Common Lisp history and coding advice collected over the years has been unavailable for at least 9 months. Now, this long-overdue task has finally been completed. The mailing list history can be browsed and indexed again from the online archive 2015-03-27Today we enabled project imports from GitHub. Should you want to import your project (which should import both the repository and the issues) into gitlab, please check out gitlab documentation for the github import workflow. As part of the effort to enable GitHub imports, we had to do a minor GitLab upgrade. The current hosted GitLab version is now 7.9.1. Another part of enabling GitHub imports was to allow users to log in on our site using their GitHub credentials. Please note that this will only work for those who already have a valid (i.e. pre-existing and confirmed) GitLab account. If you want to use this option (which is also available for Google accounts), please check the GitLab omniauth for existing users documentation. 2015-03-24GitLab upgraded to 7.9.0. GitLab released its newest version (7.9.0) on the Sunday after the Friday we went live with our self-hosted GitLab (7.8.4 -- then latest). The release contains a large number of fixes and enhancements. 2015-03-20Our self-hosted git repository management environment gitlab.common-lisp.net is now live! During the deployment, the system was seeded with 390 users, 434 groups and 210 repositories. The deployment itself took little over an hour, while we were able to resolve the issues we identified after completion well within the migration timeframe of 4 hours. During this time, most services were fully available. Only SSH has been impacted shortly. If you experience any issues, please report to the site admins. We hope you enjoy the new user experience! 2015-03-16Today the date has been announced for the final migration of all git repositories to GitLab: Friday March 20th! 2015-03-08While testing the seeding scripts for the new GitLab site, a number of e-mails to live users have unintentionally been sent instead of held. The content of the messages suggests one may be able to log in on the system. When trying so, the system denies access. This is a side effect of the testing setup. In the final migration run, you will receive an account confirmation mail. A mail not distributed in the test-run. Once the account is confirmed, the system will allow changing passwords and logging in. We're sorry for any inconvenience caused. 2015-02-19The site admins have announced a change in policies for the mailing lists to be in effect as of March 15th, 2015. Please read the original announcement e-mail for details. In summary, there are two changes being implemented: Subject prefix '[ ]' won't be added anymore. Moderation requests won't be held indefinitely anymore, defaulting to a hold period of 90 days (expiring the unmoderated e-mail when unhandled). The former addresses p'''
