on in various color models. MIT.lispbuilder-sdl - A set of bindings for SDL. Expat.lisp-magick-wand - ImageMagick bindings. BSD. Not in Quicklisp.okra - CFFI bindings to Ogre. Not available on Quicklisp. 3-clause BSD.opticl - a library for representing and processing images. BSD_2Clause.Varjo - Lisp to GLSL translator. BSD_2Clause.Vecto - Simple vector drawing library. FreeBSD.zpng - A library for creating PNG files. FreeBSD.pngload-fast - A PNG (Portable Network Graphics) image format decoder in portable Common Lisp with an emphasis on speed. MIT.GUI 👍 Qtools - A Qt toolkit, based on CommonQt. Artistic License 2.0 Also Qtools-ui (premade UI components), with videos.:star: CommonQt - A Common Lisp binding for Qt4 via QtSmoke. FreeBSD.:star: ltk - A binding for the Tk toolkit. LLGPL or GNU LGPL2.1.IUP - CFFI bindings to the IUP Portable User Interface library (pre-ALPHA). IUP is cross-platform (Windows, macOS, GNU/Linux, with new Android, iOs, Cocoa and Web Assembly drivers), has many widgets, has a small ap'''
