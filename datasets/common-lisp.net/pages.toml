title = '<!--#include virtual="project-name" -->'
full_description = "As a project Alexandria's goal is to reduce duplication of effort and improve portability of Common Lisp code according to its own idiosyncratic and rather conservative aesthetic. What this actually means is open to debate, but each project member has a veto on all project activities, so a degree of conservativism is inevitable. As a library Alexandria is one of the means by which the project strives for its goals. Alexandria is a collection of portable public domain utilities that meet the following constraints: Discussions on Alexandria take place on alexandria-devel mailing list -- and also #lisp on irc.freenode.net. Automated commit messages for the Git repository are sent to the alexandria-cvs mailing list. (Yeah, -cvs, really. Historical reasons.) Current members of Alexandria are: Marco Baringer, Attila Lendvai, Nikodemus Siivola, Robert Strandh, and Philipp Marek."
