title = "Embeddable Common-Lisp"
full_description = "About Description ECL (Embeddable Common-Lisp) is an interpreter of the Common-Lisp language as described in the X3J13 Ansi specification, featuring CLOS (Common-Lisp Object System), conditions, loops, etc, plus a translator to C, which can produce standalone executables. ECL supports the operating systems Linux, FreeBSD, NetBSD, OpenBSD, OS X, Solaris, Windows, iOS, Android and Emscripten, running on top of the Intel, Sparc, Alpha, PowerPC and ARM processors. Features A bytecode compiler and interpreter Compiles Lisp also with any C/C++ compiler Can build standalone executables and libraries ASDF, Sockets, Gray streams, MOP, and other useful components Extremely portable A reasonable license Resources Documentation - the manual for the latest release, Source Code - the code of the latest release, Files – releases, manuals, papers and other static resources, Project's repository, mirror and bug tracker, The mailing list - low volume mailing list for announcements and discussions, #ecl@libera.chat - ephemeral discussions and development talk. Support For commercial support and services please contact daniel@turtleware.eu. You may also consider supporting me financially on Patreon."
