["https://common-lisp.net/project/clouchdb"]
title = "clouchdb"
full_description = "Clouchdb is a Common Lisp library for interacting with CouchDb databases. CouchDb is a document based database server. Clouchdb comes with a BSD Style License for maximum agreeableness. The current download link for clouchdb can be found at Clicki.net. Clouchdb may also be installed with Quicklisp or ASDF. Something like the following should be all that's necessary to install and load clouchdb using ASDF-INSTALL: ASDF-INSTALL will install library dependencies, though you must of course install the CouchDb server separately. The clouchdb distribution comes with a unit test suite which uses the Stefil test framework. To run the tests follow the following steps: The distribution also includes the clouchdb examples file examples.lisp which contains ready-to-run examples and comments describing each example in detail. Note: CVS access is still available, but further development will be checked in only to the git repository at github The following email lists have been provided by the common-lisp.net for clouchdb development and information: The following clouchdb REPL sessions demonstrate various aspects of the three major functional areas of the CouchDb API: Database API, Document API and View API. NB: If you try these examples I suggest also viewing the results via CouchDb's bulit-in HTML UI at http://localhost:5894/_utils/. Of course adjust the URL for the actual CouchDb server and port in use. The API described in this has to do with managing CouchDb server information and the creation and deletion of databases. This special variable contains an instance of the db structure which identifies the target host, port and database name for general database operations. Initiates database compaction. The database to compact, if unspecified, is the current value of *couchdb*. The db parameter allows an alternate database to be specified, either as a local database name string or a db structure instance. Create a database. If specified, the db parameter may be either the string value of a local database name or an instance of the db structure. If the db parameter is unspecified the value of *couchdb* will be used to create the database."
