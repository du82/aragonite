["https://common-lisp.net/documentation"]
title = "documentation.html"
full_description = "The Lisp Community Documentation Getting Started Check out our guide to get started. Books Practical Common Lisp Lisp is often thought of as an academic language, but it need not be. This is the first book that introduces Lisp as a language for the real world. Practical Common Lisp presents a thorough introduction to Common Lisp, providing you with an overall understanding of the language features and how they work. Read Online On Lisp On Lisp is a comprehensive study of advanced Lisp techniques, with bottom-up programming as the unifying theme. It gives the first complete description of macros and macro applications. The book also covers important subjects related to bottom-up programming, including functional programming, rapid prototyping, interactive development, and embedded languages. Read Online Successful Lisp How to understand and use Common Lisp. Read Online Lisp Hackers Interviews with Common Lisp programmers. Read Online Lisp Web Tales Develop Web applications in Common Lisp. Read Common Lisp Recipes Find solutions to problems and answers to questions you are likely to encounter when writing real-world applications in Common Lisp. This book covers areas as diverse as web programming, databases, graphical user interfaces, integration with other programming languages, multi-threading, and mobile devices as well as debugging techniques and optimization, to name just a few. Buy Land of Lisp Learn to Program in Lisp, One Game at a Time! Website Programming Algorithms A comprehensive guide to writing efficient programs with examples in Lisp. Read Let Over Lambda - 50 Years of Lisp Let Over Lambda is one of the most hardcore computer programming books out there. Starting with the fundamentals, it describes the most advanced features of the most advanced language: COMMON LISP. The point of this book is to expose you to ideas that you might otherwise never be exposed to. Read Loving Common Lisp, or the Savvy Programmer's Secret Weapon The purpose of this book is to provide a quick introduction to Common Lisp and then provide the user with many fun and useful examples for using Common Lisp. The author has used Common Lisp professionally since 1982.. Read Also: ANSI Common Lisp Common Lisp in the Wild - Deploying Common Lisp Applications Look here for a more complete list of books. ANSI Common Lisp Specification Common Lisp HyperSpec (CLHS) - The Common Lisp HyperSpec (CLHS) is a non-free hyperlinked version of the ANSI Common Lisp Standard. Common Lisp Standard Draft (PDF) Getting Help If you need help, get in contact via the Lisp mailing lists and IRC. Other resources the Common Lisp Cookbook CLiki - The Common Lisp wiki Quickdocs - Documentation for All Common Lisp Projects Quickref - Reference manuals for Quicklisp libraries State of the Common Lisp Ecosystem as of 2015"
