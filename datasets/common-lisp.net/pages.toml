title = "Common-Lisp.net | About"
full_description = "About Common-Lisp.net Common-Lisp.net provides hosting for projects and user groups related to the programming language Common Lisp. The site is run under the governance of the Common Lisp Foundation and maintained mostly by a committee of volunteers. Please consider donating. Its source is hosted on gitlab.common-lisp.net. If you want to request a project, read this document. If you have questions, suggestions or comments about this site or you simply wish to reach the current maintainers, email this mailing list. The documentation, procedures, feature requests etc are located in our Trac instance: clo's Trac. Maintainance Since many years Common-Lisp.net has been run by a number of volunteers. Currently active maintainers Mark EvensonErik HuelsmannMariano Montone Previous maintainers Erik EngeDrew CrampsieHans HübnerC. YangMario S. Mommer"
