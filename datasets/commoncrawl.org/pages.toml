["https://commoncrawl.org/blog/host--and-domain-level-web-graphs-july-august-and-september-2024"]
title = "Common Crawl - Blog - Host- and Domain-Level Web Graphs July, August, and September 2024"
description = "We are pleased to announce a new release of host-level and domain-level web graphs based on the crawls of July, August, and September 2024. The crawls used to generate the graphs were CC-MAIN-2024-30, CC-MAIN-2024-33, and CC-MAIN-2024-38."
full_description = "We are pleased to announce a new release of host-level and domain-level Web Graphs based on the crawls of July, August, and September 2024. The crawls used to generate the graphs were CC-MAIN-2024-30, CC-MAIN-2024-33, and CC-MAIN-2024-38. Additional information about the data formats, the processing pipeline, our objectives, and credits can be found in the announcements of prior Web Graph releases. You may also visit the projects cc-webgraph and cc-pyspark which include all scripts and tools required to construct the graphs. Instructions to explore the graphs in the webgraph format are given in our collection of Web Graph notebooks. There are 242.4 million dangling nodes (79.07%) and the largest strongly connected component contains 42.0 million (13.70%) nodes. Dangling nodes stem from: Host names in the graph are in reverse domain name notation and a leading www. is stripped: www.subdomain.example.com becomes com.example.subdomain. You can download the graph and the ranks of all 306.5 million hosts from AWS S3 on the path s3://commoncrawl/projects/hyperlinkgraph/cc-main-2024-jul-aug-sep/host/ (this requires an account on AWS). Alternatively, you can use https://data.commoncrawl.org/projects/hyperlinkgraph/cc-main-2024-jul-aug-sep/host/ as prefix to access the files from everywhere. Please note that the text representation of the host-level graph is shipped in 48 gzip-compressed files listed in two path listings - one for the nodes (vertices), one for the edges (arcs). First, download the paths listing and decompress it using `gzip -d` or `gunzip`. By adding the prefix s3://commoncrawl/ or https://data.commoncrawl.org/ to each line in the path listing you get the list of URLs to download the entire graph. The domain graph is built by aggregating the host graph on the level of pay-level domains (PLDs) based on the public suffix list maintained on publicsuffix.org. Version (commit) e0ec09d of the public suffix list was used (commit date 2024-09-26T15:29:35Z). The domain-level graph has 95.4 million nodes and 1.7 billion edges. 50.1% or 47.8 million nodes are dangling nodes, the largest strongly connected component covers 34.6 million or 36.23% of the nodes."
