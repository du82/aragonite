["https://commoncrawl.org/team/jason-grey"]
title = "Common Crawl - Team - Jason Grey"
description = "Learn more about Jason Grey, Senior Engineer at the Common Crawl Foundation."
full_description = "Jason began his tech journey in elementary school, ventured into consulting by age 14, and a mentorship at Cray Research in high school laid the foundation for his distinguished three-decade career in invention and innovation. In 1998, he developed an early internet and CD-ROM search engine for 3M using Java Applets, and in 2008, he designed a large-scale web crawling and search solution for highly localized news using early versions of Hadoop, Nutch, SOLR, and AWS. Since 2005, Jason has worked with machine learning - applying NLP, semantic search and computer vision to numerous projects. He has collaborated with leading companies such as 3M, 5/3 Bank, Nike Hockey, Best Buy, Boston Scientific, CapitalOne, General Mills, Land O' Lakes, NVIDIA, PepsiCo, Target, and United Health Group. Renowned for pushing technological boundaries, Jason has made a significant impact across the tech landscape through his roles as a tech leader, innovator, consultant, and mentor. He is currently a Partner and CTO at Warecorp."
