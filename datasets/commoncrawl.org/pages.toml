["https://commoncrawl.org/errata"]
title = "Common Crawl - Errata"
description = "Find comprehensive information on collected errata which affect our data releases, including crawl data and web graph releases."
full_description = '''Here you can find comprehensive information about errata that affect our data releases, including crawl data, and web graphs. If you have any problems to report please Contact Us. When constructing SURT (Sort-friendly URI Reordering Transform) URLs, percent-encoded characters that are not valid UTF-8 sequences were not being correctly handled. This could lead to inconsistencies in URL normalization and sorting, potentially causing incorrect deduplication or retrieval issues in datasets that rely on SURT-based indexing. The revisit records in the Common Crawl WARC archives (since Aug 2018) lack the metadata record which is attached to all response records. In our columnar index for this crawl, the `content_mime_type` is missing and `fetch_status` is always -1. In the cdx index (columnar: `content_mime_type`), fields "mime" and "status" are missing. The WARC files of the August 2018 crawl contain a redundant empty line between the HTTP headers and the payload of WARC response records. The charset detection required to properly transform non-UTF-8 HTML pages in WARC files into WET records didn't work before November 2016 (CC-MAIN-2016-50) due to a bug in IIPC Web Archive Commons. Starting with crawl CC-MAIN-2018-39 we added a language classification field (‘content-languages’) to the columnar indexes, WAT files, and WARC metadata for all subsequent crawls. A bad configuration was checked into our exclusion list on Sep 22, 2022 and was fixed on Oct 27, 2023. The configuration blocked a number of 2–level domains, meaning they were not included in certain crawls.'''
year_published = 2025
clearnet = "https://commoncrawl.org/errata"
