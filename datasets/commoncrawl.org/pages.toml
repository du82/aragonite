["https://commoncrawl.org/blog/host-and-domain-level-web-graphs-september-october-november-december-2023-and-february-march-2024"]
title = "Common Crawl - Blog - Host- and Domain-Level Web Graphs September/October, November/December 2023 and February/March 2024"
description = "We are pleased to announce a new release of host-level and domain-level web graphs based on the crawls of September, November, February 2023-24."
full_description = 'We are pleased to announce a new release of host-level and domain-level web graphs based on the crawls of September, November, February 2023-24. The crawls used to generate the graphs were CC-MAIN-2023-40, CC-MAIN-2023-50, and CC-MAIN-2024-10. Additional information about the data formats, the processing pipeline, our objectives, and credits can be found in the announcements of prior webgraph releases. You may also visit the projects cc-webgraph and cc-pyspark which include all scripts and tools required to construct the graphs. Instructions to explore the graphs in the webgraph format are given in our collection of webgraph notebooks. There are 287.0 million dangling nodes (82.38%) and the largest strongly connected component contains 48.1 million (13.82%) nodes. Dangling nodes stem from: Host names in the graph are in reverse domain name notation and a leading www. is stripped: www.subdomain.example.com becomes com.example.subdomain. You can download the graph and the ranks of all 348.4 million hosts from AWS S3 on the path s3://commoncrawl/projects/hyperlinkgraph/cc-main-2023-24-sep-nov-feb/host/ (this requires an account on AWS). Alternatively, you can use https://data.commoncrawl.org/projects/hyperlinkgraph/cc-main-2023-24-sep-nov-feb/host/ as prefix to access the files from everywhere. Please note that the text representation of the host-level graph is shipped in 48 gzip-compressed files listed in two path listings - one for the nodes (vertices), one for the edges (arcs). First, download the paths listing and decompress it using "gzip -d" or "gunzip". By adding the prefix s3://commoncrawl/ or https://data.commoncrawl.org/ to each line in the path listing you get the list of URLs to download the entire graph. The domain graph is built by aggregating the host graph on the level of pay-level domains (PLDs) based on the public suffix list maintained on publicsuffix.org. Version (commit) 9094af5 of the public suffix list was used (commit date 2024-03-06T16:40:19Z).'
