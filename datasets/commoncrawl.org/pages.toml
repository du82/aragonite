["https://commoncrawl.org/team/sam-reddy"]
title = "Common Crawl - Team - Sam Reddy"
description = "Learn more about Sam Reddy, Staff Advisor at the Common Crawl Foundation."
full_description = "Over a 30-year tech career, Sam has a broad range of experiences as an engineer, founder, early employee, advisor, and strategic angel investor. Her roots are in public safety systems, open source, and social entrepreneurship. After earning a degree in Computer Science from Texas A&M University's Dept of Engineering, she worked at Motorola as a real-time embedded engineer, building two-way radio systems for law enforcement. Sam then founded DharmaTech, a 501(c)(3) non-profit software company, with the mission to bring the power of enterprise-level and open-source technology to non-profit organizations. She was on the founding team at DrupalSquad, deploying and supporting open-source CMS Drupal, until it merged with Warecorp, where she is currently a Partner. Sam’s current large-scale project is working with the world's best avalanche experts, the Utah Avalanche Center, to build a global AI Avalanche Forecasting public safety system."
