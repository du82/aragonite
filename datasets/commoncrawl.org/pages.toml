["https://commoncrawl.org/blog/a-further-look-into-the-prevalence-of-various-ml-opt-out-protocols"]
title = "Common Crawl - Blog - A Further Look Into the Prevalence of Various ML Opt–Out Protocols"
description = "This post details some experiments that we have done regarding Machine Learning Opt–Out protocols. We decided to investigate the prevalence of some of these protocols, by taking a deeper look at our WARC files, and finding which proportions of domains are using which opt–out protocols."
full_description = "We discussed what ML opt–out protocols are in our previous blog post. We explored a few different ways to opt–out, as well as some associated emerging protocols, and how these fit into Common Crawl’s processes. Our mission is to make web data accessible to everyone, and to do so in an ethical, responsible fashion, and so it is important for us to try to discern the wishes of those who own it. We decided to investigate the prevalence of some of these protocols, by taking a deeper look at our WARC files, and finding which proportions of domains are using which opt–out protocols. First, we need data to look for usage of the various opt–out protocols. We need a dataset large enough to be representative, but which can also be processed with a reasonable amount of resources. This dataset should also contain high–quality data, and avoid possible biases, for instance where too many subdomains would use the same template and therefore give a distorted representation of the use of a particular protocol.Fortunately, as part of the pre–processing for our web crawls, we run a pre–crawl to gather candidate URLs for fetching. As a starting point this takes a list of the top hosts and domain names from our latest Web Graph. From there we do a few iterations of crawling with Apache Nutch™ and harvest URLs, some of which will be part of the next crawl.The data that we used for these experiments is two iterations of the output of our pre–crawl seed generation used internally, which takes the familiar form of a list of WARC files. The first iteration is the pre–crawl seed WARC files for October (Week 40 of 2023, ~134.0 TiB) and the second iteration is for December (Week 50 of 2023, ~1008 GiB). We will refer to them as seed-crawl/CC-MAIN-2023-40 and seed-crawl/CC-MAIN-2023-50 respectively. Using two iterations is important because it gives us more insight on how the prevalence of each opt–out protocol may have changed over time. Our hope is that these experiments will provide valuable insights on how to acknowledge opt–out protocols, increase visibility in emerging initiatives and act as a stepping–stone for your own projects."
year_published = 2024
clearnet = "https://commoncrawl.org/blog/a-further-look-into-the-prevalence-of-various-ml-opt-out-protocols"
