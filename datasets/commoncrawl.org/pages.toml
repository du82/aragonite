["https://commoncrawl.org/2016/09/august-2016-crawl-archive-now-available"]
title = "Common Crawl - Blog - August 2016 Crawl Archive Now Available"
description = "The crawl archive for August 2016 is now available! The archive contains more than 1.61 billion web pages."
full_description = '''The crawl archive for August 2016 is now available! The archive located in the commoncrawl bucket at crawl-data/CC-MAIN-2016-36/ contains more than 1.61 billion web pages. To extend the seed list, we've added 50 million hosts from the Common Search host-level pagerank data set. While many of these hosts may already be known, and some may not provide crawlable content, the number of crawled hosts has grown by 18 million (or 50%) and there are 8 million more unique domains (plus 35%). Together with the August 2016 crawl archive we also release two data sets containing robots.txt files and responses without content (404s, redirects, etc.). More information can be found in a separate blog post. By simply adding either s3://commoncrawl/ or https://data.commoncrawl.org/ to each line, you end up with the S3 and HTTP paths respectively. The Common Crawl URL Index for this crawl is available at: https://index.commoncrawl.org/CC-MAIN-2016-36/. For more information on working with the URL index, please refer to the previous blog post or the Index Server API. There is also a command-line tool client for common use cases of the url index. Please donate to Common Crawl if you appreciate our free datasets! We’re also seeking corporate sponsors to partner with Common Crawl for our non-profit work in open data. Please contact info@commoncrawl.org for sponsorship information and packages. Repeated HTTP and WARC headers were not represented in the JSON data in WAT files. When a header was repeated adding a further value of that header, only the last value was stored and other values were lost. This issues was fixed with CC-MAIN-2024-51, see ia-web-commons#18. All WAT files from CC-MAIN-2013-20 until CC-MAIN-2024-46 are affected. The "Title" extracted in WAT records to the JSON path `Envelope > Payload-Metadata > HTTP-Response-Metadata > HTML-Metadata > Head > Title` is not the content included in the <title> element in the HTML header (<head> element) if the page contains further <title> elements in the page body. The content of the last <title> element is written to the WAT "Title". This bug was observed if the HTML page includes embedded SVG graphics.'''
year_published = 2016
clearnet = "https://commoncrawl.org/2016/09/august-2016-crawl-archive-now-available"
