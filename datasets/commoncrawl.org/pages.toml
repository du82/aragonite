["https://commoncrawl.org/team/greg-lindahl-engineer"]
title = "Common Crawl - Team - Greg Lindahl"
description = "Learn more about Greg Lindahl, CTO at the Common Crawl Foundation."
full_description = "Greg Lindahl is an astrophysicist and technologist who has advised Common Crawl since 2013. He was previously the Founder and CTO of Blekko, an internet search engine. Before joining Common Crawl full-time in 2023, Greg was a member of the Event Horizon Telescope Collaboration, working at the Center for Astrophysics - Harvard & Smithsonian. He has also contributed to the Wayback Machine at the Internet Archive. Greg is an experienced entrepreneur who has founded three successful startups. He began his industry career at the quantitative trading firm D. E. Shaw & Co. Greg has a MA in Astronomy from the University of Virginia and a BA in Physics and Math from Brandeis University."
