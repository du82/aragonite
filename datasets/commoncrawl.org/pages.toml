["https://commoncrawl.org/privacy-policy"]
title = "Common Crawl - Privacy Policy"
description = "Review Common Crawl's Privacy Policy: understand how we handle, protect, and respect your data in our web crawling efforts."
full_description = '''The words of which the initial letter is capitalized have meanings defined under the following conditions. The following definitions shall have the same meaning regardless of whether they appear in singular or in plural. For the purposes of this Privacy Policy:Company (referred to as either "the Company", "We", "Us" or "Our" in this Agreement) refers to Common Crawl Foundation, 9663 Santa Monica Boulevard #425, Beverly Hills, CA 90210, Unites States of America.You means the individual accessing or using the Service, or the company, or other legal entity on behalf of which such individual is accessing or using the Service, as applicable.‍Country refers to: The United States of America.Device means any device that can access the Service such as a computer, a cellphone or a digital tablet.Personal Data is any information that relates to an identified or identifiable individual.Service refers to the Website.Service Provider means any natural or legal person who processes data on behalf of the Company. It refers to third-party companies or individuals employed by the Company to facilitate the Service, to provide the Service on behalf of the Company, to perform services related to the Service or to assist the Company in analyzing how the Service is used.Third-party Social Media Service refers to any website or any social network website through which a User can log in or create an account.Usage Data refers to data collected automatically, either generated by the use of the Service or from the Service infrastructure itself (for example, the duration of a page visit).Website refers to web pages or other data accessible from the commoncrawl.org domain, including any subdomains thereof. Usage Data is collected automatically when using the Service, and may include information such as Your Device's Internet Protocol address (e.g. IP address), browser type, browser version, the pages of Our Service that You visit, the time and date of Your visit, the time spent on those pages, unique Device identifiers and other diagnostic data.When You access the Service by or through a mobile device, We may collect certain information automatically, including, but not limited to, the type of mobile device You use, Your mobile device unique ID, the IP address of Your mobile device, Your mobile operating system, the type of mobile Internet browser You use, unique device identifiers and other diagnostic data.We may also collect information that Your browser sends whenever You visit our Service or when You access the Service by or through a mobile device.'''
