["https://commoncrawl.org/blog/balancing-discovery-and-privacy-a-look-into-opt-out-protocols"]
title = "Common Crawl - Blog - Balancing Discovery and Privacy: A Look Into Opt–Out Protocols"
description = "What opt–out protocols are, their importance, how you can use them, how we respect them, and what the emerging initiatives are that surround them."
full_description = 'A web–crawler, also referred to as a spider or search engine bot, retrieves and catalogs content from throughout the Internet. Its objective is to allow data to be accessed efficiently when needed. They are named "web–crawlers" because crawling is the technical term for automatically visiting a website and gathering data via a software program. Web–scraping, also known as data–scraping or content–scraping, occurs when a bot downloads content without authorization, frequently in order to use it maliciously. Unlike web–crawling, web–scraping tends to be focused on specific pages, or particular websites, and often ignores the load imposed on web servers. In contrast, web crawlers use open Internet protocols and adhere to the majority of opt–out mechanisms (which we will discuss in this article) and moderate their requests to avoid overwhelming web servers. We believe that the gathering and archiving of web data should be done in a polite and respectful way. Common Crawl’s crawler, CCBot, does its best to be a polite and respectful citizen of the web. Aside from the many Machine Learning (ML) applications for which crawled data can be used, it is instrumental in the fields of market research, risk–management and fraud–detection, and search engine optimisation (SEO). Academics use web crawling to gather large datasets from the Internet for studies in fields like social sciences, linguistics, and humanities. Organizations like libraries and historical societies use crawled data to archive digital content for future reference. Travel websites can use the data to aggregate information on hotel prices, flight schedules, and tourist attractions, in order to offer comprehensive travel solutions to their users. In the ML world, models in Natural Language Processing (NLP) are used for tasks like machine translation and speech recognition; often for under–resourced languages. In manufacturing, ML models trained on web–sourced data can predict equipment failures, and help with scheduling of maintenance.'
year_published = 2024
clearnet = "https://commoncrawl.org/blog/balancing-discovery-and-privacy-a-look-into-opt-out-protocols"
