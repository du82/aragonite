["https://commoncrawl.org/blog/the-environmental-impact-of-the-cloud---the-common-crawl-case-study"]
title = "Common Crawl - Blog - The Environmental Impact of the Cloud - the Common Crawl Case Study"
description = "Looking at tools (Green Software) and methodologies to evaluate the environmental impact of the cloud (a nascent activity coined GreenOps)."
full_description = "It is pretty impossible to escape AI at the moment: every other social media post, news item, marketing blurb or job advert seems to be involving it one way or another. This comes at a time of growing awareness of the environmental impact of IT in general, which AI will only exacerbate: training and running AI models is computationally expensive and the resources that enable it require resources to be built, energy to run and water to cool them. A recent study by the International Energy Agency forecasts a substantial growth in energy demand from data centres, fuelled by AI and cryptocurrencies. This article will look at tools (Green Software) and methodologies to evaluate the environmental impact of the cloud (a nascent activity coined GreenOps). We will examine the impact of an organisation I know quite well, the Common Crawl Foundation, who have kindly agreed to let me use them as a use case. This is a particularly relevant example in the context of AI. As we will see below, the Common Crawl dataset is one of the main sources of data for large language models, so by looking at the impact of generating and distributing their datasets, we not only get a good illustration of the environmental impact of cloud computing in general but also uncover one of the sources of upstream emissions of AI. This is a complex subject and it is fast changing. As I am increasingly working in the field, this article gives me an opportunity to share some of my findings and introduce some key concepts, methodologies and tools, which hopefully might be useful to the reader. Please leave comments if something looks incorrect or unclear. The Common Crawl Foundation is a nonprofit 501(c)(3) organisation founded by Gil Elbaz, which crawls the web and freely provides its archives and datasets to the public since 2011. Each release contains around 3 billion web pages stored in WARC format, which is the standard used by the web archiving community. The datasets are hosted and provided for free through Amazon’s Open Data Sponsorship Programme and reside on a AWS S3 bucket in the us-east-1 region. The total size of the bucket is 7.9 PB, most of it using intelligent tiering. As explained on the CC website, the data can be accessed either using the S3 clients or HTTP via CloudFront."
