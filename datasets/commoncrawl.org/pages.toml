["https://commoncrawl.org/blog/submission-to-the-uks-copyright-and-ai-consultation"]
title = "Common Crawl - Blog - Submission to the UK’s Copyright and AI Consultation"
description = "Read our submission to the UK government's Copyright and AI consultation, supporting a legal exception for text and data mining (TDM) while respecting creators’ rights."
full_description = "Common Crawl started long before generative AI was front page news. Researchers, developers, and students around the world rely on our archive, analyzing open data in order to advance translation tools, monitor trends in public information on social media, track public health information to support disaster response, and much, much more. In recent years, our mission to democratize access to high-quality web data has positioned Common Crawl as a linchpin in the AI ecosystem, especially as demand for extensive, diverse datasets has surged with the rise of generative AI. Today, Common Crawl is the source of an estimated 70–90% of the tokens used in training data for nearly all of the world’s large language models (LLMs), making us perhaps the most universally relied-upon resource for LLMs in production. Common Crawl is particularly useful because it encompasses a wide range of topics, writing styles, and perspectives. In the face of that growth, policymakers around the world are examining how copyright laws can facilitate text and data mining in general and AI training in particular in order to serve the public interest. Changes to the law could have a huge impact not only on Common Crawl and our community, but also everyone who relies on large scale, public datasets for computer analysis. Last week, Common Crawl provided comments to the United Kingdom’s consultation on Copyright and AI. While countries around the world already allow text and data mining using copyrighted materials, the UK does not generally do so. The consultation proposes changing that – it rejects the idea that this is a binary debate that pits “tech v. creators” and instead proposes to create limited exceptions to copyright in a way that serves society as a whole. We strongly support that direction. The Common Crawl Foundation supports the rights of creators and content owners to receive proper attribution and fair compensation. Where the output of text and data mining communicates someone’s protected work – e.g., a generative AI tool regurgitating an entire copyrighted book or a movie – from the training data to the public, copyright regulates the use."
year_published = 2025
clearnet = "https://commoncrawl.org/blog/submission-to-the-uks-copyright-and-ai-consultation"
