["https://commoncrawl.org/blog/common-crawl-foundation-at-neurips-2024-expanding-horizons-and-building-connections"]
title = "Common Crawl - Blog - Common Crawl Foundation at NeurIPS 2024: Expanding Horizons and Building Connections"
description = "The Common Crawl Foundation attended NeurIPS 2024, connecting with organisations, hosting a social event on tech and social impact, and showcasing contributions to AI research and data access."
full_description = 'Last week, members of the Common Crawl Foundation team—Chris, Greg, Jason, Rich, Sam, Stephen, and Wayne—attended the Neural Information Processing Systems (NeurIPS) Conference at the Vancouver Convention Centre in downtown Vancouver, BC. Set against the backdrop of Vancouver’s stunning waterfront, with snow-capped mountains and vibrant cityscape, the conference drew over 7,000 attendees from around the world. We attended NeurIPS with the goal of understanding potential partnerships and learning from the AI research community. During the conference, we had the opportunity to meet with people from over 40 organizations, each conversation offering insights into potential collaborations and ways we might support the broader AI ecosystem. Our signature event at NeurIPS was a compelling social gathering titled "Nonprofits Bridging Tech and Social Impact." This two-hour event brought together over 60 participants from academia and industry, showcasing the critical work of nonprofit technology organizations. The event transitioned into roundtable discussions, also providing a unique networking opportunity. Participants from various backgrounds exchanged their ideas about AI, technology, and social impact. We were excited to support our colleague Professor Ludwig Schmidt, who delivered a highly effective tutorial titled "Advancing Data Selection for Foundation Models: From Heuristics to Principled Methods." His presentation explored critical approaches to data selection in foundation model training, discussing everything from algorithmic foundations to practical data curation techniques. The session delved into attribution-based approaches, diversity-based methods, and emerging strategies for optimizing model performance through intelligent data selection. We were also lucky to meet Dr. Fei-Fei Li, a key industry leader often referred to as the "Godmother of AI", and co-founder of the Stanford HAI (Human-centered Artificial Intelligence) Department where she reiterated how critical Common Crawl’s work is in the industry. Dr. Li’s was also one of the Key Invited Talks at the conference and highlighted Common Crawl in Slide #104 of her presentation.'
year_published = 2024
