["https://commoncrawl.org/2015/04/announcing-the-common-crawl-index"]
title = "Common Crawl - Blog - Announcing the Common Crawl Index!"
description = "This is a guest post by Ilya Kreymer, a dedicated volunteer who has gifted large amounts of time, effort and talent to Common Crawl. He previously worked at the Internet Archive and led the Wayback Machine development, which included building large indexes of WARC files."
full_description = "‍The raw index data is available, per crawl, at: s3://commoncrawl/cc-index/collections/CC-MAIN-YYYY-WW/indexes/ There is now an index for the Jan 2015 and Feb 2015 crawls. Going forward, a new index will be available at the same time as each new crawl. To make working the index a bit simpler, an api and service for querying the index is available at: http://index.commoncrawl.org. The index is fully functional but we are looking for feedback to improve the usefulness and usability of the index for future updates. ‍The index format is relatively simple: It consists of a compressed plaintext index (with one line for each entry) compressed into gzipped chunks, and a secondary index of the compressed chunks. This index is often called the ‘ZipNum’ CDX format and it is the same format that is used by the Wayback Machine at the Internet Archive. ‍To make working with the index a bit easier, the main index site (http://index.commoncrawl.org) contains a readily accessible api for querying the index. The api is a variation of the ‘cdx server api’ or ‘capture index server api’ that was originally built for the wayback machine. The site is built using pywb (https://github.com/ikreymer/pywb), a new collection of web archive replay and query tools, including the index query component. For example, the following query looks up “wikipedia.org” in the CC-MAIN-2015-11 (Feb 2015) crawl: https://index.commoncrawl.org/CC-MAIN-2015-11-index?url=wikipedia.org ‍The above query will only retrieve captures from the exact url “wikipedia.org/”, but a frequent use case may be to retrieve all urls from a path or all subdomains. This can be done by using a wildcard queries:https://index.commoncrawl.org/CC-MAIN-2015-11-index?url=wikipedia.org/*or https://index.commoncrawl.org/CC-MAIN-2015-11-index?url=*.wikipedia.org/ ‍For most prefix or domain prefix queries such as these, it is not feasible to retrieve all the results at once, and only the first page of results (by default, up to 15000) are returned. The total number of pages can be retrieved with the showNumPages query: https://index.commoncrawl.org/CC-MAIN-2015-11-index?url=*.wikipedia.org/&showNumPages=true"
