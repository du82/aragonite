["https://commoncrawl.org/blog/host-and-domain-level-web-graphs-november-december-2023-february-march-2024-and-april-2024"]
title = "Common Crawl - Blog - Host- and Domain-Level Web Graphs November/December 2023, February/March 2024, and April 2024"
description = "We are pleased to announce a new release of host-level and domain-level web graphs based on the crawls of November, February, April 2024."
full_description = 'We are pleased to announce a new release of host-level and domain-level web graphs based on the crawls of November, February, April 2024. The crawls used to generate the graphs were CC-MAIN-2023-50, CC-MAIN-2024-10, and CC-MAIN-2024-18. Additional information about the data formats, the processing pipeline, our objectives, and credits can be found in the announcements of prior webgraph releases. You may also visit the projects cc-webgraphand cc-pyspark which include all scripts and tools required to construct the graphs. Instructions to explore the graphs in the webgraph format are given in our collection of webgraph notebooks. There are 271.5 million dangling nodes (80.99%) and the largest strongly connected component contains 49.8 million (14.87%) nodes. Dangling nodes stem from: Host names in the graph are in reverse domain name notation and a leading www. is stripped: www.subdomain.example.com becomes com.example.subdomain. You can download the graph and the ranks of all 335.3 million hosts from AWS S3 on the path s3://commoncrawl/projects/hyperlinkgraph/cc-main-2024-nov-feb-apr/host/ (this requires an account on AWS). Alternatively, you can use https://data.commoncrawl.org/projects/hyperlinkgraph/cc-main-2024-nov-feb-apr/host/ as prefix to access the files from everywhere. Please note that the text representation of the host-level graph is shipped in 72 gzip-compressed files listed in two path listings - one for the nodes (vertices), one for the edges (arcs). First, download the paths listing and decompress it using "gzip -d" or "gunzip". By adding the prefix s3://commoncrawl/ or https://data.commoncrawl.org/ to each line in the path listing you get the list of URLs to download the entire graph. The domain graph is built by aggregating the host graph on the level of pay-level domains (PLDs) based on the public suffix list maintained on publicsuffix.org. Version (commit) 0c0a279 of the public suffix list was used (commit date 2024-05-03T09:02:18Z). The domain-level graph has 113.9 million nodes and 1.9 billion edges. 57.4% or 65.3 million nodes are dangling nodes, the largest strongly connected component covers 40.9 million or 35.96% of the nodes.'
