full_description = 'We are pleased to announce a new release of host-level and domain-level Web Graphs based on the crawls of May, June, and July 2024. The crawls used to generate the graphs were CC-MAIN-2024-22, CC-MAIN-2024-26, and CC-MAIN-2024-30. Additional information about the data formats, the processing pipeline, our objectives, and credits can be found in the announcements of prior Web Graph Releases. You may also visit the projects cc-webgraph and cc-pyspark which include all scripts and tools required to construct the graphs. Instructions to explore the graphs in the webgraph format are given in our collection of Web Graph Notebooks. There are 292.6 million dangling nodes (80.79%) and the largest strongly connected component contains 49.6 million (13.70%) nodes. Dangling nodes stem from: Host names in the graph are in reverse domain name notation and a leading www. is stripped: www.subdomain.example.com becomes com.example.subdomain. You can download the graph and the ranks of all 362.2 million hosts from AWS S3 on the path s3://commoncrawl/projects/hyperlinkgraph/cc-main-2024-may-jun-jul/host/ (this requires an account on AWS). Alternatively, you can use https://data.commoncrawl.org/projects/hyperlinkgraph/cc-main-2024-may-jun-jul/host/ as prefix to access the files from everywhere. Please note that the text representation of the host–level graph is shipped in 48 gzip–compressed files listed in two path listings - one for the nodes (vertices), one for the edges (arcs). First, download the paths listing and decompress it using "gzip -d" or "gunzip". By adding the prefix s3://commoncrawl/ or https://data.commoncrawl.org/ to each line in the path listing you get the list of URLs to download the entire graph. The domain graph is built by aggregating the host graph on the level of pay–level domains (PLDs) based on the public suffix list maintained on publicsuffix.org. Version (commit) 37d2d6a of the public suffix list was used (commit date 2024-07-30T08:08:08