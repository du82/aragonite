["https://commoncrawl.org/blog/host--and-domain-level-web-graphs-april-may-and-june-2024"]
title = "Common Crawl - Blog - Host- and Domain-Level Web Graphs April, May, and June 2024"
description = "We are pleased to announce a new release of host-level and domain-level web graphs based on the crawls of April, May, June 2024. The crawls used to generate the graphs were CC-MAIN-2024-18, CC-MAIN-2024-22, and CC-MAIN-2024-26."
full_description = 'We are pleased to announce a new release of host–level and domain–level Web Graphs based on the crawls of April, May, and June 2024. The crawls used to generate the graphs were CC-MAIN-2024-18, CC-MAIN-2024-22, and CC-MAIN-2024-26. Additional information about the data formats, the processing pipeline, our objectives, and credits can be found in the announcements of prior Web Graph Releases. You may also visit the projects cc-webgraph and cc-pyspark which include all scripts and tools required to construct the graphs. Instructions to explore the graphs in the webgraph format are given in our collection of Web Graph Notebooks. There are 302.2 million dangling nodes (81.29%) and the largest strongly connected component contains 54.0 million (14.53%) nodes. Dangling nodes stem from: Host names in the graph are in reverse domain name notation and a leading www. is stripped: www.subdomain.example.com becomes com.example.subdomain. You can download the graph and the ranks of all 371.7 million hosts from AWS S3 on the path s3://commoncrawl/projects/hyperlinkgraph/cc-main-2024-apr-may-jun/host/ (this requires an account on AWS). Alternatively, you can use https://data.commoncrawl.org/projects/hyperlinkgraph/cc-main-2024-apr-may-jun/host/ as prefix to access the files from everywhere. Please note that the text representation of the host-level graph is shipped in 48 gzip-compressed files listed in two path listings – one for the nodes (vertices), one for the edges (arcs). First, download the paths listing and decompress it using "gzip -d" or "gunzip". By adding the prefix s3://commoncrawl/ or https://data.commoncrawl.org/ to each line in the path listing you get the list of URLs to download the entire graph. The domain graph is built by aggregating the host graph on the level of pay-level domains (PLDs) based on the public suffix list maintained on publicsuffix.org. Version (commit) afe95d9 of the public suffix list was used (commit date 2024-06-30T00:08:12Z). The domain-level graph has 173.4 million nodes and 1.9 billion edges. 71.0% or 123.1 million nodes are dangling nodes, the largest strongly connected component covers 43.9 million or 25.33% of the nodes.'
