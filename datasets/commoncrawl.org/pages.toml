title = "Common Crawl - Blog - Host- and Domain-Level Web Graphs May/Sep/Nov 2023"
description = "We are pleased to announce a new release of host-level and domain-level web graphs based on the crawls of May, September, and November of 2023."
full_description = 'We are pleased to announce a new release of host-level and domain-level web graphs based on the crawls of May, September, and November of 2023. The crawls used to generate the graphs were CC-MAIN-2023-23, CC-MAIN-2023-40, and CC-MAIN-2023-50. Additional information about the data formats, the processing pipeline, our objectives, and credits can be found in the announcements of prior webgraph releases. You may also visit the projects cc-webgraph and cc-pyspark which include all scripts and tools required to construct the graphs. Instructions to explore the graphs in the webgraph format are given in our collection of webgraph notebooks. There are 259.6 million dangling nodes (81.33%) and the largest strongly connected component contains 45.5 million (14.26%) nodes. Dangling nodes stem from: Host names in the graph are in reverse domain name notation and the leading www. is stripped, e.g: www.subdomain.example.com becomes com.example.subdomain. You can download the graph and the ranks of all 319.1 million hosts from AWS S3 on the path s3://commoncrawl/projects/hyperlinkgraph/cc-main-2023-may-sep-nov/host/ (this requires an account on AWS). Alternatively, you can use https://data.commoncrawl.org/projects/hyperlinkgraph/cc-main-2023-may-sep-nov/host/ as prefix to access the files from everywhere. Please note that the text representation of the host-level graph is shipped in 72 gzip-compressed files listed in two path listings - one for the nodes (vertices), one for the edges (arcs). First, download the paths listing and decompress it using "gzip -d" or "gunzip". By adding the prefix s3://commoncrawl/ or https://data.commoncrawl.org/ to each line in the path listing you get the list of URLs to download the entire graph. The domain graph is built by aggregating the host graph on the level of pay-level domains (PLDs) based on the public suffix list maintained on publicsuffix.org. Version (commit) 502e2bf of the public suffix list was used (commit date 2023-12-13T10:45:24Z).'
