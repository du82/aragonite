["https://commoncrawl.org/team/julien-nioche"]
title = "Common Crawl - Team - Julien Nioche"
description = "Learn more about Julien Nioche, Emeritus Member at the Common Crawl Foundation."
full_description = "Julien is a Java developer and Open Source veteran who lives in Bristol, UK. Having studied Russian language and culture in Paris and taught French in a school in Kyiv, Ukraine, Julien went on to graduate in Text Engineering and Natural Language Processing. He moved to the UK to work as a researcher at the University of Sheffield in 2005 and founded his consultancy, DigitalPebble, in 2008. Julien has been involved in several Open Source projects, mainly at the Apache Software Foundation, and was the PMC chair for Apache Nutch. He is a member of the Apache Software Foundation. He is a committer on Apache Storm and the author of the popular Open Source web crawler StormCrawler, which is used at Common Crawl for generating the news dataset. Julien has over 20 years of experience in both academia and industry and has worked on numerous projects through his consultancy, as well as holding senior positions in various organisations. When he is not wood–working, rewilding or cycling, Julien runs workshops on web crawling, speaks at conferences and reviews technical books."
