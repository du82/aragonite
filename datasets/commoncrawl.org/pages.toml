["https://commoncrawl.org/access-the-data"]
title = "Common Crawl - Get Started"
description = "Dive into Common Crawl: your guide to accessing vast web data. Start here to harness the web's potential effortlessly."
full_description = "It’s mandatory to access the data from the region where it is located (us-east-1 ).The connection to S3 should be faster and you avoid the minimal fees for inter-region data transfer (you have to send requests which are charged as outgoing traffic).Be careful using an Elastic IP address or load balancer, because you may be charged for the routed traffic. You may use the AWS Command Line Interface but many AWS services (e.g EMR) support the s3:// protocol, and you may directly specify your input as s3://commoncrawl/path_to_file, sometimes even using wildcards.On Hadoop (not EMR) it’s recommended to use the S3A Protocol: just change the protocol to s3a://. If you want to download the data to your local machine or local cluster, you can use any HTTP download agent, such as cURL or wget. The data is accessible via the https://data.commoncrawl.org/[...] URL scheme.There is no need to create an AWS account in order to access the data using this method. The AWS Command Line Interface can be used to access the data from anywhere (including EC2). It’s easy to install on most operating systems (Windows, macOS, Linux). Please follow the installation instructions.Please note, access to data from the Amazon cloud using the S3 API is only allowed for authenticated users. Please see our blog announcement for more information.Once the AWS CLI is installed, the command to copy a file to your local machine is:aws s3 cp s3://commoncrawl/path_to_file <local_path>‍You may first look at the data e.g, to list all WARC files of a specific segment of the April 2018 crawl:> aws s3 ls s3://commoncrawl/crawl-data/CC-MAIN-2018-17/segments/1524125937193.1/warc/2018-04-20 10:27:49 931210633 CC-MAIN-20180420081400-20180420101400-00000.warc.gz2018-04-20 10:28:32 935833042 CC-MAIN-20180420081400-20180420101400-00001.warc.gz2018-04-20 10:29:51 940140704 CC-MAIN-20180420081400-20180420101400-00002.warc.gz‍The command to download the first file in the listing is:aws s3 cp s3://commoncrawl/crawl-data/CC-MAIN-2018-17/segments/1524125937193.1/warc/CC-MAIN-20180420081400-20180420101400-00000.warc.gz <local_path>The AWS CLI supports recursive copying, and allows for pattern–based inclusion/exclusion of files.For more information check the AWS CLI user guide or call the command-line help (here for the cp command):aws s3 cp help"
year_published = 2025
clearnet = "https://commoncrawl.org/access-the-data"
