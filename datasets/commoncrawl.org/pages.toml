["https://commoncrawl.org/blog/host-and-domain-level-web-graphs-mar-may-oct-2023"]
title = "Common Crawl - Blog - Host- and Domain-Level Web Graphs Mar/May/Oct 2023"
description = "We are pleased to announce a new release of host-level and domain-level web graphs based on the crawls of March, May, and October 2023. The host-level graph consists of 378.7 million nodes and 2.6 billion edges, and the domain-level graph has 94.2 million nodes and 1.7 billion edges."
full_description = 'We are pleased to announce a new release of host-level and domain-level web graphs based on the crawls of March, May, and October 2023. The crawls used to generate the graphs were CC-MAIN-2023-14, CC-MAIN-2023-23, and CC-MAIN-2023-40. Additional information about the data formats, the processing pipeline, our objectives, and credits can be found in the announcements of prior web graph releases. You may also visit the projects cc-webgraph and cc-pyspark which include all scripts and tools required to construct the graphs. Instructions to explore the graphs in the webgraph format are given in our collection of web graph notebooks. There are 321.4 million dangling nodes (84.85%) and the largest strongly connected component contains 44.2 million (11.67%) nodes. Dangling nodes stem from: - Hosts that have not been crawled, yet are pointed to from a link on a crawled page- Hosts without any links pointing to a different host nameor hosts which did only return an error page (eg. HTTP 404). Host names in the graph are in reverse domain name notation and a leading www. is stripped: www.subdomain.example.com becomes com.example.subdomain. You can download the graph and the ranks of all 378.7 million hosts from AWS S3 on the path s3://commoncrawl/projects/hyperlinkgraph/cc-main-2023-mar-may-oct/host/ (this requires an account on AWS). Alternatively, you can use https://data.commoncrawl.org/projects/hyperlinkgraph/cc-main-2023-mar-may-oct/host/ as prefix to access the files from everywhere. Please note that the text representation of the host-level graph is shipped in 40 gzip-compressed files listed in two path listings - one for the nodes (vertices), one for the edges (arcs). First, download the paths listing and decompress it using "gzip -d" or "gunzip". By adding the prefix s3://commoncrawl/ or https://data.commoncrawl.org/ to each line in the path listing you get the list of URLs to download the entire graph. ‍The domain graph is built by aggregating the host graph on the level of pay-level domains (PLDs) based on the public suffix list maintained on publicsuffix.org. Version (commit) 78bff2b of the public suffix list was used (commit date 2023-11-03T16:47:17Z).'
