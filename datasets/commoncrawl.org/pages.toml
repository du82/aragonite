["https://commoncrawl.org/blog/iab-workshop-on-ai-control"]
title = "Common Crawl - Blog - IAB Workshop on AI-CONTROL"
description = "Earlier this month, the Common Crawl Foundation had the privilege of participating in a groundbreaking workshop hosted by the Internet Architecture Board (IAB) in Washington DC."
full_description = 'Earlier this month, the Common Crawl Foundation had the privilege of participating in a groundbreaking workshop hosted by the Internet Architecture Board (IAB) in Washington DC. The workshop, titled "IAB Workshop on AI-CONTROL," brought together experts from crawling companies, web publishers, AI companies, and “bot defense” companies to discuss the intersection of artificial intelligence and Internet protocols. Thom Vaughan from Common Crawl served on the program committee. While adhering to Chatham House rules limits the specifics we can share, we can highlight some of the general themes that were explored: The workshop attendees discussed various approaches for allowing individuals and organizations to opt-out of AI data collection and processing. We agreed that it was important to develop a vocabulary that clearly expressed the preferences of rights holders and authors. This vocabulary should include Creative Commons-style opt-in choices. This vocabulary will be important for the eventual EU text and data mining (TDM) opt-out registry. Attendees discussed the recent popularity of using “robot defenses” to stop crawling, instead of robots.txt. Providers of these defenses are sometimes treating archive crawlers (like Common Crawl’s CCBot) the same as bots crawling for particular AI companies. This is unfortunate and opaque: robots.txt is usually a public document, and is obeyed by a significant number of crawlers. We discussed some examples of US government websites inadvertently blocking the official 2024 End of Term Archive. A wide range of perspectives was shared, and we discussed the balancing act between innovation, privacy, and ethical considerations. The discussions at this workshop will undoubtedly influence future recommendations and standards in the realm of Generative AI and Internet protocols. As we enter what many are calling the "dawn of generative AI," the guidance provided by organizations like the IAB will be instrumental in shaping a responsible and innovative future.'
year_published = 2024
clearnet = "https://commoncrawl.org/blog/iab-workshop-on-ai-control"
