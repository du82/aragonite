["https://commoncrawl.org/use-cases"]
title = "Common Crawl - Use Cases"
description = "Explore how Common Crawl data powers diverse projects: from research to business insights. See its impact in action."
full_description = "Introduction of the distributed, parallel extraction framework provided by the Web Data Commons project. Overview of the original Common Crawl crawler (in use 2008-2013) discussing the Hadoop data processing pipeline, PageRank implementation, and the techniques used to optimize Hadoop. Description of using Common Crawl data and NLP techniques to improve grammar and spelling correction, specifically homophones. Overview of Web Science including basic semantic web, Linked Open Data, primer, and then DBpedia, Linked Data Integration Framework (LDIF), Common Crawl Database, Web Data Commons. Description of using the Common Crawl data to perform wide scale analysis over billions of web pages to investigate the impact of Google Analytics and what this means for privacy on the web at large. Discussion of how open, public datasets can be harnessed using the AWS cloud. Covers large data collections (such as the 1000 Genomes Project and the Common Crawl) and explains how you can process billions of web pages and trillions of genes to find new insights into society. Learn how iAcquire scaled identification of credible content producers – with credibility being based on authorship proliferation. CC used as seed source AWS Summit Berlin 2012 Talk on Web Data Commons. Large-Scale Web Analysis now possible with Common Crawl datasets In this screencast, we’ll show you how to go from having no prior experience with scale data analysis to being able to play with 40TB of web crawl information, and we’ll do it in five minutes. Sebastian Spiegler, leader of the data team at SwiftKey talks about the value of web crawl data, his research, and why open data is important. “Data Track” Keynote at Data Days 2012 by Lisa Green from Common Crawl Foundation, recorded in Berlin, October 1st 2012. “Data Track” Panel at Data Days 2012 with Stephan Baumann (German Science Institute for Artificial Intelligence), Daniel Dietrich (Open Data Foundation), Lisa Green (Common Crawl Foundation, San Francisco), Christopher Steiner (Best Selling Author, Chicago), Matt Turck (Bloomberg Ventures, NYC)"
