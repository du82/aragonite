["https://commoncrawl.org/team/kurt-bollacker-advisor"]
title = "Common Crawl - Team - Kurt Bollacker"
description = "Learn more about Kurt Bollacker, Advisor at the Common Crawl Foundation."
full_description = "Kurt is a computer scientist with a research background in the areas of machine learning, digital libraries, semantic networks, and electro-cardiographic modeling. He received a Ph.D. in Computer Engineering from The University Of Texas At Austin. Kurt was co-creator of the CiteSeer research tool as a visiting researcher at the NEC Research Institute, the technical director of the Internet Archive, and a biomedical research engineer at the Duke University Medical Center. Kurt was Chief Scientist at Metaweb Technologies until Feb, 2009. He is currently pursuing research on long term digital archiving as the Digital Research Director at the Long Now Foundation as well as serving as a consulting Data Scientist at InfoChimps. Kurt is a philanthropist active with many organizations that promote openness, transparency and preservation. As an Advisor at Common Crawl, he provides the organization with valuable advice and insight into the crawl technology, big data processing, open innovation, products and collaborations."
