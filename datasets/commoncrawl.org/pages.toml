description = "Learn more about Michael Birnbach, Head of Finance & Operations at the Common Crawl Foundation."
full_description = "Michael has managed Common Crawl’s finance and operations since 2011. Prior to that, Michael was part of the Executive team at Factual as SVP of finance and operations and Treasurer for 10 years, successfully helping to grow the company from 25 people to over 200 people, expanding operations globally, and successfully merging the company with Foursquare. Michael is an active participant in industry trade groups, such as the IAB UK and IAB Europe panels on GDPR, the Los Angeles CFO Roundtable, and A16Z and Index Ventures Portfolio Finance Leaders Groups. Before joining Factual, Michael analyzed and advised private equity groups on national real estate portfolio acquisitions and distributions. He also conducted private wealth management for individuals and Fortune 500 companies while at Oppenheimer and Smith Barney/Citigroup. Prior to that, Michael honed his deal-making skills in the entertainment industry, first on the agency side at ICM in the film division and then on the production side at various production companies at Warner Brothers and MGM. Michael earned his BS in Economics from Chapman University."
