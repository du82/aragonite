["https://commoncrawl.org/2016/09/robotstxt-and-404-redirect-data-sets"]
title = "Common Crawl - Blog - Data Sets Containing Robots.txt Files and Non-200 Responses"
description = "Together with the crawl archive for August 2016 we release two data sets containing robots.txt files and server responses with HTTP status code other than 200 (404s, redirects, etc.) The data may be useful to anyone interested in web science, with various applications in the field."
full_description = 'The data may be useful to anyone interested in web science, with various applications in the field. For instance, redirects are substantial elements of web graphs where they are equivalent to ordinary links. The data may also be useful to people developing crawlers, as it enables testing of robots.txt parsers against a huge data set. This data is provided separately from the crawl archive because it does not apply to data analysis for natural language content: robots.txt files are read by crawlers; and content generated together with 404s (and redirects, etc.) is usually auto-generated and contains only standardized phrases such as "page not found" or "document has moved". Replace the star * by all segments to get the full list of folders. Alternatively, we provide lists of all robots.txt WARC files or all WARC files containing non-200 HTTP status code responses. Please, share your feedback on this new data sets and let us know whether we should continue and update these data sets regularly every month.'
