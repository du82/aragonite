["https://commoncrawl.org/team/kevin-debre-legal-counsel"]
title = "Common Crawl - Team - Kevin DeBré"
description = "Learn more about Kevin DeBré, Legal Counsel at the Common Crawl Foundation."
full_description = "Kevin is a highly respected Intellectual Property (IP) attorney who has continually worked at the forefront of the evolving IP landscape. He is a Partner and the Chairman of the Intellectual Property and Technology Transactions Department at the firm Stubbs, Alderton and Markiles. Kevin is an author and frequent speaker on technology commercialization and intellectual property licensing. Kevin was selected in 2009, 2008 and 2006 as a Southern California Super Lawyer and is the founder and Chair of the Licensing Interest Group of the California State Bar Intellectual Property Section. Prior to joining Stubbs Alderton & Markiles, LLP, Kevin was a partner in leading international law firms, including Brobeck Phleger & Harrison, LLP, where he headed the firm’s technology transactions practice in Southern California. After law school, he served as a judicial law clerk for Hon. John G. Davies, United States District Court for the Central District of California. Kevin received his J.D. from Hastings College of the Law and his B.S. degree from the University of California, Davis."
