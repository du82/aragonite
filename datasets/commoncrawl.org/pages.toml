["https://commoncrawl.org/uk-copyright-and-ai-consultation"]
title = "UK Copyright and AI Consultation Submission"
description = "Common Crawl's submission to the UK Government's Copyright and AI Consultation, February 2025"
full_description = "The Common Crawl Foundation welcomes the opportunity to respond to the UK Government’s open consultation on “Copyright and Artificial Intelligence.” In our comments below, we provide further background on our leadership building an open repository of web crawl data and its utility to researchers, developers, and students, including in the context of AI. We then offer guidance on how the UK can create a supportive legal environment both for us and the people who depend on our archive for text and data mining (TDM). Specifically, we advocate for clear, fair exceptions to copyright that facilitate TDM and allow organizations like us to continue supporting research and innovation. We then offer recommendations on how any AI training “opt-outs” should interact with different parts of the ecosystem; specifically, any opt-outs should be applied by the entity using the data for AI training or other TDM, rather than organizations like ours that crawl sites to create archives. The Common Crawl Foundation is a nonprofit organization that has been operating since 2007 with the mission of preserving and freely sharing samples of the public Internet. Common Crawl has amassed a 10-petabyte archive containing over 250 billion web pages, and this repository grows by an additional 3–5 billion pages each month. Researchers, developers, and students around the world rely on this open data, and the concept of freely sharing a vast corpus for diverse uses is now a mature idea that has proven its value over many years. We strive to provide a comprehensive crawl of public websites, while also operating as a responsible participant in the online ecosystem. Common Crawl’s crawling agent, CCBot, strictly honors the robots.txt standard to avoid disallowed pages, identifies itself clearly, and respects requests to cease crawling. CCBot also does not bypass paywalls, never logs in to private sites, and crawls at a measured rate to prevent server overload. Additionally, Common Crawl provides cryptographically verifiable provenance for its data, enabling users to confirm the authenticity and integrity of the data."
year_published = 2025
clearnet = "https://commoncrawl.org/uk-copyright-and-ai-consultation"
