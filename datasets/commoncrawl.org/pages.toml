["https://commoncrawl.org/team/gil-elbaz-chairman"]
title = "Common Crawl - Team - Gil Elbaz"
description = "Learn more about Gil Elbaz, Chairman at the Common Crawl Foundation."
full_description = "Gil Elbaz is an accomplished entrepreneur and investor and a pioneer of natural language technology. In 1998, Gil co-founded Applied Semantics, the original developer of AdSense. In 2003 the company was acquired by Google and Gil became Engineering Director for Google’s new LA office. In 2007, Gil founded Factual to democratize access to quality data. In 2020, Factual merged with Foursquare and today Gil is Co-Chairman of the board of a combined entity which generated $150m in combined revenue at the time of the merger. With David Waxman, Gil launched TenOneTen Ventures in 2013 and raised their first true fund in 2014. He joined TenOneTen on a full time basis upon relinquishing his CEO role in 2020. Gil has also been very active in the non-profit arena. Most notably, in 2007 he founded the Common Crawl Foundation which provides a petabyte-scale web crawl free of cost. He also sits on the Board of Directors of XPRIZE Foundation which leverages the power of competition to catalyze innovation. Gil earned his bachelor’s degree from the California Institute of Technology with a double major in Engineering & Applied Science and Economics."
