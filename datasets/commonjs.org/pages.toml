["https://commonjs.org/wiki/Command_Line"]
title = "Command Line - CommonJS Spec Wiki"
full_description = '''Command Line From CommonJS Spec Wiki Jump to: navigation, search Command line processing Many server-side tools use a command line as their interface, and there should be a high-level way to deal with the arguments. Prior Art Flusspferd's getopt module v8cgi's GetOpt module Microsoft WshArguments object in the Windows Script Host environment. CommandLine object, by Olivier Mengué, a generic API to Unix-style parsed arguments with a concrete JavaScript implementation on top of WshArguments (CScriptCommandLine). Python's optparse module provides a reasonably powerful, flexible and full-featured option parser. optparse.js: inspired by Python's optparse module but with some distinct differences. Narwhal's "args" module example usage, the module Retrieved from "https://wiki.commonjs.org/index.php?title=Command_Line&oldid=3097"'''
