full_description = '''Our partners Common Sense is privileged to partner with the most committed companies, foundations, philanthropists, and education pioneers on the planet. Our partners share our commitment to helping kids and families in today's 24/7 media environment. Their support helps make our mission possible. Affiliate partners When browsing through our site, you'll see we provide a green "Buy," "Watch," or "Download" button on our reviews as a convenience to our users. When you use these links to make a purchase, Common Sense earns a small affiliate fee from Amazon or iTunes. As a nonprofit organization, these funds help us continue providing independent, ad-free services for educators, families, and kids while the price you pay remains the same. Learn more Corporate partners Through our distribution with a wide-ranging list of leading companies, we reach millions of parents at the point of decision. Our partners license our ratings and reviews and parent advice, which provide parents with the resources they need to navigate the digital world. Some highlights of integrations include ratings and reviews within Apple TV, Charter Spectrum, Comcast Xfinity, Cox Contour, DirecTV, OpenAI, Target.com, Verizon Fios, and more. See all corporate partners Education and research partners and demonstration sites Common Sense works with uncommonly committed and generous partners to provide digital literacy and digital citizenship resources for educators, parents, and students around the world. These partners include many of the nation's leading educational nonprofits, innovative companies, and field-defining researchers. Additionally, we implement our whole-community approach to digital citizenship through demonstration sites identified in partnership with leading school districts and departments of education around the country. These partnerships are an integral part of Common Sense's education efforts. See a full list of our education and research partners Foundation partners Nearly 40% of our total annual operating budget comes from our foundation support. We are proud to work with national foundations, corporate foundations, family foundations, and local foundations. We work with all our foundation partners, who invest in our vision to create a world where every kid is an educated digital citizen. See a full list of our foundation partners Latino partners Reaching out and increasing our presence in the Latino community is one of our strategic goals at Common Sense Media. We are committed to providing advice, resources, and information in Spanish. We also acknowledge the cultural nuances in the Latino community. Through our partnerships with Latino media outlets and organizations, we are expanding our support for the largest minority group in the U.S. Learn more about our Latino partnerships Pro bono partners Common Sense reaches out to the best in the business for pro bono resources to ensure we can focus as much of our philanthropic support on programming as possible. We are proud to have pro bono support in various sectors, from legal support to interactive consulting. Our pro bono support will continue to grow as we engage in new projects in the ever-changing landscape of the digital world. Learn more about our pro bono partnerships'''
