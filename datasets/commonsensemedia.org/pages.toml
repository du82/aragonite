full_description = '''Join Our Team Together we can build a digital world where our kids can thrive. We feel strongly about hiring smart, passionate, creative people who want to improve the media and technology landscape for kids, families, and schools. Our 5 Organizational Values Excellence: We deliver award-winning programs that are trusted and loved. Inclusion: We uphold a workplace and programs that welcome everyone and invite diverse perspectives. Innovation: We anticipate challenges and trends, and collaborate to lead change. Connection: We work hard to connect the people we serve to resources, skills, and support. Teamwork: We support each other to bring our mission and vision to life. A diverse, equitable, inclusive culture We believe that true innovation happens when everyone has room at the table and the tools, resources, and opportunity to thrive. That's why we hire and cultivate diverse teams of the best and brightest from all backgrounds, experiences, and perspectives. See our story, and read about our commitment to diversity, equity, and inclusion. Our Generous Benefits Package Common Sense employees enjoy a rich Health & Welfare Benefits package. If you're a full-time employee—regularly scheduled to work 30 hours or more per week—you're eligible once you're hired. Most benefits start the first of the month following your hire date. Medical: PPO and HMO plans. We cover 85% of the premium for you and your dependents. Vision: We cover 100% of the premium for you and your dependents. Dental: includes ortho coverage up to $2k Flex and dependent spending accounts 401k: match up to 4% Generous PTO Health and wellness benefits Employee Assistance Program Pet insurance Commuter benefit Explore Roles Thank you for considering a role at Common Sense. Browse our current opportunities to discover one you're interested in. Don't meet every single requirement? Studies have shown that women and people of color are less likely to apply for jobs unless they meet every single qualification. At Common Sense, we're dedicated to building a diverse, inclusive, and authentic workplace. So if you're excited about this role but your past experience doesn't align perfectly with every qualification in the job description, we encourage you to apply anyway. You may be just the right candidate. Advocacy Intern Washington, DC, or Remote (Eastern Time Zone) Reports to: Senior Counsel, Tech Policy Pay: $25.00 per hour We are seeking an Advocacy Intern to support our team and learn about the ins and outs of federal and state technology policy and advocacy strategy on behalf of America's kids and teens. As an intern, you will be expected to hit the ground running on a variety of activities. Learn more AI Prototyping Intern San Francisco, CA Reports to: Product Manager, AI Prototyping Pay: $25.00 per hour The AI Prototyping Squad is a small, agile team exploring how AI can enhance Common Sense's mission, including both internal tools and user-facing products. This role is flexible based on your skills—whether through user research, prototyping, or AI-powered learning design, you'll help shape the future of AI in media and education. Learn more Brand Design Intern San Francisco, CA, or Remote (Pacific Time Zone) Reports to: Head of Design Pay: $25.00 per hour We are seeking a creative and enthusiastic Brand Design Intern to join our team. This is an exciting opportunity to work alongside experienced designers and contribute to real-world projects that enhance our brand identity across digital and print mediums. As a Brand Design Intern, you will play a supporting role in creating compelling designs that align with our brand strategy, engage our audience, and drive organizational goals. Learn more Data Analytics & Insights Intern San Francisco, CA Pay: $25.00 per hour The Data Analytics & Insights Intern will analyze data and generate insights to support decision-making across product and key stakeholder groups such as marketing and business development. This internship is ideal for someone who enjoys working with data, uncovering trends, and translating numbers into meaningful stories. Learn more Development Coordinator San Francisco, California (Hybrid) Reports to: Director, Development Operations & Communications Pay Range: $22.00–$26.00 per hour We are seeking a detail-oriented and self-motivated Development Coordinator to join our Development team. The ideal candidate is confident in their abilities to communicate clearly and to request and ensure clarity when needed. The coordinator will be joining a highly collaborative team that is passionate about building a more healthy, equitable, and empowering future for all kids in the digital age. Learn more Senior Director, Data & Technology San Francisco, California (Hybrid) Reports to: Chief Product & Technology Officer Salary Range: $140,000–$166,250 The Senior Director, Data & Technology will shape and lead the enterprise technology strategy, providing vision and leadership in designing and architecting scalable systems and data solutions. This role oversees a team responsible for IT, data analytics, and CRM, ensuring that technology initiatives are aligned with business objectives to support organizational growth and strategic goals. Learn more Executive Director - FutureVoice This position is with FutureVoice, a public awareness campaign project of Common Sense Media Location: Flexible within the U.S., with 25% travel required Salary: DOE About FutureVoice: FutureVoice is a groundbreaking 501(c)(3) public awareness campaign focused on increasing civic engagement among young Americans. Built on 25 years of data on youth voters collected by Harvard pollster John Della Volpe, our campaign addresses the fundamental"why" of civic participation through cutting-edge research, Gen Z-created content, and grassroots activations. We aim to create lasting change in how young Americans view their role in democracy. About the Position: We are seeking a visionary Executive Director to lead FutureVoice in its mission to become the nation’s leading Gen Z civic education platform. The ideal candidate will be passionate about youth civic engagement, experienced in nonprofit leadership, and skilled in building coalitions and partnerships. As the leader of a newly incorporated organization, the Executive Director will play a crucial role in establishing and maintaining strong organizational infrastructure and compliance systems and laying the foundation for its long-term impact and success. Learn more Who we are An independent voice for kids, families, and schools everywhere. Common Sense is a nonprofit organization giving kids, families, and schools the tools to make informed choices about media and technology. Families know us for our independent, age-based reviews of movies, TV shows, books, games, podcasts and apps. Educators use our free curriculum and edtech reviews to plan lessons and integrate technology into their teaching practice. At our core, we are a children's advocacy group. We draw on original research, industry expertise, and community partnerships to advocate for laws and policies that help kids thrive.'''
