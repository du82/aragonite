["https://commonsensemedia.org/articles/festive-lunar-new-year-activities-for-kids-and-teens"]
title = "Festive Lunar New Year Activities for Kids and Teens | Common Sense Media"
description = "Watch videos, make crafts, and explore how the holiday is celebrated around the world. Advice from Common Sense Media editors."
full_description = '''Raisa Masood Content Editor | Aunt of many January 9, 2023 Browse all articles Festive Lunar New Year Activities for Kids and Teens Watch videos, make crafts, and explore how the holiday is celebrated around the world. By Raisa Masood | January 9, 2023 Topics: Learning Identity and Community Lunar New Year is a time for family gatherings, delicious food, and joyful celebrations. Also known as Chinese New Year, Spring Festival, Seollal, and Tết, it marks the beginning of the year in the lunisolar calendar. The holiday is observed by communities in East Asia, Southeast Asia, and around the world. Families can honor new year traditions by using kid-friendly entertainment to bond and make memories. Here are some ways you can celebrate with your children and learn more about the holiday together. For Preschoolers and Young Kids Gather for storytime. Listen to authors read aloud from Brandon Makes Jiǎo Zi, Gordon & Li Li Celebrate Chinese New Year, and Mindy Kim and the Lunar New Year Parade. Make crafts together. Get creative and make dragons, lanterns, lucky bags, paper cuttings, and red envelopes. Print out coloring sheets. Learn more about the animals related to Chinese zodiac signs. You can also design your own hanbok inspired by Seollal (Korean Lunar New Year) celebrations. Watch clips from children's shows. "Curious George: Gung Hay Fat Choy! Happy Chinese New Year!" and "Ni Hao, Kai-Lan: Happy Chinese New Year!" For Preteens and Teens Check out festivities about the world. Read this article on ways that people welcome Lunar New Year in different countries. Explore traditions. Find out more about lantern craft in Vietnam and Qilin dancing in Chinese cultures. Have a puzzle party. Solve virtual jigsaw puzzles of festive art. Find your zodiac animal. Look through art of zodiac animals and find your sign. Find more resources and entertainment picks that celebrate Asian cultures here. Raisa is passionate about helping kids thrive, which has led to her making a career out of reading and watching children's media. As a content editor at Common Sense, she works on tips and advice for families on managing entertainment and tech at home. She has previously worked in children's publishing and at nonprofit organizations. Raisa holds a bachelor's degree in Global Business and Marketing from Fordham University. She loves to read, travel, and watch football (aka soccer). You can find her exploring New York City during her free time, and trying to hunt down the best dumplings in the city (she has a never-ending list). Show more Recommended reads on this topic Editors' Picks Great Kids' Books for Lunar New Year East Asian characters shine in books for the holiday or anytime. Article Raising Multilingual Kids and Teens with Books Tips to get your children reading and practicing a new language at home. Editors' Picks Movies & TV That Celebrate Asian, Asian American, Native Hawaiian, and Pacific Islander Heritage & Culture These entertaining picks feature the rich diversity found in these communities.'''
year_published = 2023
year_updated = 2023
