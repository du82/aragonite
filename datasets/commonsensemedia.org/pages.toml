full_description = "Raisa Masood Content Editor | Aunt of many October 15, 2024 Browse all articles Quiz: How social media savvy is your child? By Raisa Masood | October 15, 2024 Topics: Social Media Social Media If your preteen or teen is using social media, or asking to get started, it's a good idea to talk with them about it. Parents and caregivers can help children have healthier online experiences by guiding them to use social media safely and responsibly. Take our quiz to see if you're ready to talk with your kid about social media. Based on your responses, you'll find tips and advice from our experts to help guide your family conversations. Raisa is passionate about helping kids thrive, which has led to her making a career out of reading and watching children's media. As a content editor at Common Sense, she works on tips and advice for families on managing entertainment and tech at home. She has previously worked in children's publishing and at nonprofit organizations. Raisa holds a bachelor's degree in Global Business and Marketing from Fordham University. She loves to read, travel, and watch football (aka soccer). You can find her exploring New York City during her free time, and trying to hunt down the best dumplings in the city (she has a never-ending list). Show more Recommended reads on this topic Article Practical Tips for Easing Kids' Social Media Anxiety Fear of missing out can make social media-using teens feel stressed. Here's how you can help. Article Parents' Ultimate Guide to TikTok (2024) Article How to Help Kids Spot Misinformation and Disinformation Clickbait, biased opinions, and false information are common online. Teach your child strategies to identify fact from fiction."
