full_description = '''Privacy Policy Community guidelines | Privacy FAQ | Privacy Policy | Cookie Policy | Children's Privacy Policy | General Terms of Use | Teen Terms of Use | UK Digital Citizenship Terms of Service | Survey Privacy Policy | Subprocessor List Effective Date of Policy (Last Update): December 3, 2024 Former version COMMON SENSE MEDIA PRIVACY POLICY Welcome! Below you will find the Privacy Policy (hereinafter "Privacy Policy" or "Policy") for Common Sense Media, Inc. ("Common Sense", "we" or "us"). We are dedicated to protecting your privacy and handle the Personal Information we obtain with care and respect. Throughout this Privacy Policy we use certain terms as defined in the Glossary at the end. For ease of reference, these terms are capitalized—please refer to the Glossary for better understanding. At Common Sense Media, we value your privacy. And since privacy policies can be very long, we have created a summary of the key concepts of this Policy here to make our practices more accessible to you. This Policy describes how we collect, use, and share information that can reasonably be used to identify a natural person directly or indirectly (“Personal Information”). It covers Personal Information collected from users of the Common Sense websites, www.commonsensemedia.org and www.commonsense.org/education (collectively, the "Site"), and all other applications ("Apps"), services, and websites that link to this Privacy Policy (collectively, the "Services"). However, this Privacy Policy does not apply to the following information: Human resources data: This Policy does not describe how we handle Personal Information collected in the context of employment. Business-to-business communications: Except as outlined in our EEA+ Privacy Policy below, this Policy does not describe how we collect and use the Personal Information of individuals that act as personnel of organizations with which we transact business or otherwise collaborate. For example, this Policy does not cover information we collect from personnel of educational institutions we serve. Properties subject to separate privacy notices and surveys: Please be aware that Common Sense Media also maintains certain websites and apps, which are governed by their own privacy notices. In addition, surveys are governed by the privacy notices displayed in the survey, which may differ from this Privacy Policy. If you are using another Common Sense Media website or app or responding to a survey, please be sure to consult the applicable notice. Information Controlled by third parties: This Policy does not apply to information Controlled by third parties (including Payment Services, and affiliates such as Common Sense Media UK and Bandio PBC). For details on how independent third parties handle your Personal Information, please refer to their policies. The privacy notice for Bandio PBC is available here. In addition to this Privacy Policy, please note that we have made the following privacy disclosures available for specific topics: Cookie Policy: Our Cookie Policy explains how a website collects, uses, and stores cookies, which are small data files that track user activity. It informs users about the types of cookies used, their purpose, and how they can manage or opt out of them for privacy control. Children’s Privacy Policy: A Children’s Privacy Policy outlines how we protect the privacy of Children and Teens. It explains what Personal Information is collected from Children and Teens, how it is used, and what parental rights are in place regarding this data. The terms of this Policy specific to individuals in the EEA+ are set out in Section VIII (Common Sense Media: EEA+ Privacy Policy). The Services are operated by Common Sense, a nonprofit organization in the United States. Please see our separate Terms of Use, which governs the use of the Services. Subject to our obligations (if any) under our Terms of Use, we may limit the availability of the Services, in whole or in part, to any person, geographic area, or jurisdiction we choose, at any time in our sole discretion. Our Services may link to a limited number of third-party websites or applications. We are not responsible for the practices of these third-party websites and applications. We encourage you to read this Policy before using the Services and not to use the Services if you disagree with any part of this Policy. By using the Services or by clicking a box that states that you accept or agree to this Policy, you signify your agreement to this Policy. However, acceptance of this Policy does not limit any rights or remedies available to you by law. I. OUR COLLECTION OF PERSONAL INFORMATION A. Categories of Personal Information processed. The table below describes the categories of Personal Information that we process: Category of Personal Information collected What does this include? Identity Data Adult Members: Name, username or similar identifier, age, profile picture, and password and other log-in credentials. Adult Members’ children: If our Adult Members choose to provide it to us, we may also receive the ages and names of Adult Members’ children. Educator Members: (in addition the above) your school’s name, your professional title, grades and subjects taught, social media links, and your profile profile picture or other avatar. Teen Members: username or similar identifier, country of residence, month and year of birth, and password and other log-in credentials. Contact Data Adult Members: zip/postal code and country of residence, email address. Parental Data Your email address when it is provided by your Child where we need your parental consent to comply with applicable law. Any other Personal Information that you choose to provide us during the course of our correspondence relating to the administration of your Child’s Profile. Service Personalization Data Adult and Teen Members: the preferences that you set by configuring your Profile to identify the topics and content you want to see as part of the Services (including in any emails you ask us to send). Adult Members’ children: we may obtain knowledge of your child’s preferences as a result of how you configure your Profile (e.g., by using our ‘For Your Family’ function) to identify the topics and content your children might want to see (including in any emails you ask us to send you). Communication Interaction Data Adult Members: information about your engagement with our email newsletters that is collected by the “web beacons” referred to in our Cookie Policy. Payment Data Subscribers: information necessary to process payments for your Common Sense Media subscription (including affecting renewals, if and as applicable), such as name, email address, phone number, payment card information (including name as shown on your card, billing address (street address, city, state, country, ZIP code), expiration date, security code and payment card number, and associated details of subscriptions purchased from us (including any relevant payments taken). Note: although our Payment Services providers require all this information to process payments on our behalf, we do not receive your security code or full payment card number – we only receive the final four digits of your payment card number. Donation Data Name (unless you want your donation to be anonymous), email address, phone number, payment card information (including name as shown on your card, billing address, expiration date, security code and payment card number) and the amount of your donation(s).Note: although our Payment Services providers require all this information to process donations on our behalf, we do not receive your full security code and payment card number – we only receive the final four digits of your payment card number. Donor Analysis Data Where available from the sources noted in the Donor Privacy Policy below: current and prospective donors’ biography data, contact data (email address and mailing address), financial status, income data, donation history, political contribution history, value of residence(s), and employment history. Analytics Data We use analytics tools to collect certain internet log information and the details of the behavior patterns of people who visit the Services. Technical Data Data routinely collected by online services, such as browsing activity, Internet protocol (IP) address, your log-in data, browser type and version, time zone setting and location, browser plug-in types and versions, operating system and platform and other technology on the devices you use to access the Services. Certain elements of this Technical Data may be linked to online identifiers as outlined in our Cookie Policy. Any relevant details about our advertising activities are also described there. Any advertising or marketing activities are exclusively related to Common Sense services, the Common Sense Media app, and www.commonsensemedia.org, as no data is used for third-party advertising or collected on other Common Sense domains for such purposes. Review and User Submitted Data Where you post a comment or submit a review on our Services, in addition to certain Identity Data attached to your account (which will depend on whether you are a Teen Member or an Adult Member), we will also collect any Personal Information that you choose to include in that content. Survey Data Depending on the survey, in addition to certain Identity Data, Contact Data, and Technical Data, we will also collect any other information requested by, or that you submit in response to, a survey. This may include demographic data such as gender, race/ethnicity, income, education level, living situation, among other details about you. Event and Webinar Data We need your email address (and in certain instances other requested Identity Data and Contact Data) to sign you up as attendee at events or webinars for which you register, and to provide you with the necessary details about that event or webinar. We may record some events and webinars. Where relevant, all presenters will have their image and audio, and relevant comments and opinions, published to attendees and captured in the recording. If you are an attendee and you choose to share your image and audio during an event or webinar — your image and audio will also be published to others at the event or webinar, and will be captured in any recording. If you are an attendee and you choose to otherwise participate or interact in an event or webinar (e.g., by submitting questions to a Q&A) — your questions and comments may be published to others at the event or webinar, and will also form part of the recording. We collect different types of Personal Information depending on whether you are a Visitor or a Member, and what type of Member you are. All Visitors: Visitors to the Services may opt-in to receive Common Sense Media email newsletters by providing their name, email address, and zip code. Note that our newsletters are not intended for individuals under the age of 18. If you are a Member or Visitor under 18 you should not attempt to sign-up for our newsletters. We also may collect Personal Information that you choose to provide through surveys or questionnaires, such as demographic information, family information, professional information, feedback on your experience using the Services, and opinions on certain issues. Your participation in surveys and questionnaires is entirely voluntary. Surveys are governed by the privacy policies displayed in the survey, which may differ from this Policy. Participating in or using our other Services may involve the collection of Visitor Personal Information such as name, email address, phone number, mailing address, professional information, and social media handles/URLs. Adult Members: If you wish to become a Member, you must provide us with certain Personal Information as part of the registration process, including, for example, name, email address, and password. You may also choose to add a profile photo and username to your Member Profile. To personalize your experience on the Services and within our email newsletters, you may also optionally choose to provide us with information about your children, such as their ages, first names or nicknames, and the streaming services they use, as well as your preferences for what kind of content is suitable for your children. Subscribers may need to provide payment information, including name, email address, card brand, number, expiration, and code, and billing address to process donations and subscriptions. Common Sense receives address information; all other payment information is processed by a third-party payment provider and not by us. See “B. Collection of Information by Our Service Providers” and DONOR SECTION for more information. Adult Members may choose to publish reviews on the Services regarding the age appropriateness and quality of books, television shows, books, games, and other forms of media. Educator Members: Educator Members are required to provide their name, email address, zip code or country (if outside of the United States), name and location of your worksite, e.g., school, and password. We provide you with the alternative option to register or login and link your Member account on the Services with a single-sign on service such as Google. These services will authenticate your identity and will share certain Personal Information that you allow us to collect, as discussed below. You can optionally provide additional information to your Profile such as a biographical details, profile picture, and links to social media accounts. Education Members may choose to publish reviews on the Services regarding the quality of education technologies and websites. Teen Members: If the Member is a Teen, we do not ask for name, but we do ask for birth month and year, country, username, password, and email address. Teen Members may choose to publish reviews on the Services regarding the age appropriateness and quality of books, television shows, books, games, and other forms of media. Child Members: To learn about our practices regarding children's Personal Information, please read our Children's Privacy Policy. When we intend to collect Children's Personal Information, we take additional steps to protect their privacy, including: Notifying parents about our information practices with regard to Children; Limiting our collection of Children's Personal Information to no more than is reasonably necessary; and Providing parents with access to, and the ability to request changes to or deletion of, Children's Personal Information that we have collected. Sources of Additional Personal Information: In addition to the Personal Information you provide to us while using our Services, we may receive Personal Information from other sources, such as Common Sense events, Common Sense education partners, activity on Common Sense social media platforms, and publicly and commercially available databases. '''
