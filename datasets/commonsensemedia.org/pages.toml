["https://commonsensemedia.org/articles/parents-ultimate-guide-to-fortnite"]
title = "Parents' Ultimate Guide to Fortnite | Common Sense Media"
description = "Are your kids caught up in the Fortnite frenzy? Here's everything you need to know about this popular video game. Advice from Common Sense Media editors."
full_description = '''Common Sense Media March 1, 2024 Browse all articles Parents' Ultimate Guide to Fortnite Are your kids caught up in the Fortnite frenzy? Here's everything you need to know about this popular video game. By Common Sense Media | March 1, 2024 Topics: Gaming Screen Time Violence What is Fortnite?What is Fortnite: Battle Royale?Do you play by yourself or with a team in Fortnite: Battle Royale?What if I'm not ready for the action of Battle Royale?What is Save the World?Why is my kid so interested in playing Fortnite?Is Fortnite appropriate for kids?What age should kids be to play Fortnite?Are there parental controls for Fortnite?Is Fortnite too violent for kids?How much does Fortnite cost?What are Fortnite Seasons?What are Fortnite Live Events?What platforms can you play Fortnite on?How is Fortnite related to Twitch?Can players chat with each other in Fortnite: Battle Royale?How do you turn off voice chat in Fortnite: Battle Royale?How long is a match of Fortnite: Battle Royale?How do I manage screen time for my kids when they're playing Fortnite? What is Fortnite? If your kids say they're playing Fortnite, they're probably talking about Battle Royale, the free-to-play multiplayer offshoot of the action-strategy game Fortnite from developer Epic Games. This ultra-popular video game blends elements of sandbox building games with fast-paced action. It offers two modes: a solo version called Save the World and the multiplayer version called Battle Royale. (Note: If you're looking for more parental insights on your kids' favorite things online, sign up for our family movie night newsletter.) What is Fortnite: Battle Royale? The game allows up to 100 people to participate in a match together. Players are dropped onto the game map and must compete to be the last one standing by killing every other player. During the game, players collect weapons, build safe structures, and try to avoid the Storm that damages all players outside of a safe zone. Players can also choose to play a no-build version, where you just focus on shooting people. Unlike the Save the World version, there aren't any zombies to kill, which makes it a less scary version to play. However, players can buy items to make themselves look like a zombie or another creepy character. Do you play by yourself or with a team in Fortnite: Battle Royale? There are four modes of play in Battle Royale: Solo, Duo, Trio, and Team. In Solo mode, you're dropped into the game alone. In Duo, you're dropped in with one teammate, and in Trio, with two. In Team mode, you play on a team of four. Duos, Trios, and Teams can either be friends choosing to play together or randomly matched players. All players in a match are playing in the same mode. What if I'm not ready for the action of Battle Royale? Don't worry if you've never played Fortnite or a battle royale game before. Playground mode lets players get used to the mechanics of the game without the pressure of fighting other gamers. Playground sessions are limited to a maximum of four players, and you can even put everyone on the same team to eliminate the possibility of friendly fire. What is Save the World? Save the World is the traditional solo campaign in the game Fortnite. Unlike in Battle Royale, where players compete against each other, players in the Save the World mode are survivors of an apocalyptic storm where the few remaining humans must band together to defeat creepy zombie-like creatures called husks. Why is my kid so interested in playing Fortnite? Kids love Fortnite for lots of reasons. One is that it combines two other genres that are big winners with young gamers. Another is that it has a more cartoonish look than some other more gory video games, so younger gamers are drawn to it. Kids can play with friends in Duos, Trios, and Teams, creating a more social element. And popular gamers like play the game on streaming sites like YouTube and Twitch. Plus, in the case of the Battle Royale mode, it's free (although it does have in-app purchases—more on that below). Is Fortnite appropriate for kids? What age should kids be to play Fortnite? For some parents, the cartoonish, bloodless style of the action in Fortnite makes the violence less problematic than the aggressive gore in other popular shooter games. But the game's online chat feature—especially in Battle Royale mode—could expose younger players to offensive language or mature content from random strangers. Common Sense recommends Fortnite for teens 13 and up, primarily because of the action violence. But with the right controls and parental guidance, this can be a preteen-friendly alternative to violent first-person shooters. Are there parental controls for Fortnite? Yes, adults can restrict some features on their child's account. You can manage permissions for friend requests, voice and text chat, content ratings, and filters for mature language. Parents and caregivers can also set up passwords for in-game spending. When you enable this option, the Parental Control PIN will be required for all purchases. Accounts for users under 18 also have privacy settings turned on by default. Use this guide to set up parental controls on your child's account. There is an additional restriction for kids under 13. Children below that age are automatically assigned a "cabined account," where parents and caregivers have to consent to their child getting access to certain features. These include in-game purchases and chatting. Keep in mind that the game determines a user's age based on the date of birth they enter when setting up an account. Is Fortnite too violent for kids? Fortnite: Battle Royale is loaded with violence, but it's all cartoonish, rather than bloody or gory. Since the object is to be the last one standing, you'll constantly shoot other players and dodge fatal storms. However, there's no blood; defeated enemies simply vanish. Those seeking a less violent—and more social—play experience can find it in the weapon-free Party Royale section, which you choose when you log in for a session. Party Royale has no killing and dying. Instead, the environment is more conducive to exploring environments while chit-chatting with friends and other players. How much does Fortnite cost? Players can currently download and play Fortnite: Battle Royale for free. The current cost of Fortnite: Save the World is $39.99, although the developer, Epic Games, has suggested it will make it free or discounted some time in the future. However, even within the free-to-play version, players can spend real money. Fortnite encourages purchases such as upgrades to Deluxe and Super Deluxe editions, as well as in-game currency called V-Bucks that can be used to buy bonus items. The Premium Battle Pass requires a $10 subscription that lets players compete on more levels and win exclusive game skins/costumes. Epic's partnerships with popular entities including Marvel, the Mandalorian, Predator, and Tron mean they frequently introduce new characters, costumes, and other crave-worthy elements—keeping players' interest up and their money coming in. What are Fortnite Seasons? Unlike other multiplayer games, Battle Royale has a storyline, which results in frequent additions of new content to the game that are referred to as a new "season." Seasons seem to update approximately every 10–12 weeks, and 10 seasons make up a chapter. You'll begin to see clues to the updates during the current season, usually to encourage players to purchase the next season's Battle Pass. What are Fortnite Live Events? The platform's live events, which are often tied to a feature in the game, can attract tens of millions of viewers (not just players) around the world. Some of the most popular events include concerts, such as ones by Marshmello, Travis Scott, and Diplo, as well as in-game promotional launches, such as director J.J. Abrams' release of an exclusive Star Wars: The Rise of Skywalker trailer in advance of the movie. Some of these events are scheduled and some are spontaneous. If your kid's into Fortnite, they'll probably hear the buzz and want to tune in. Events tend to be family-friendly and are listed in the news section of the Fortnite site. What platforms can you play Fortnite on? You can play Fortnite on the latest game consoles (PlayStation, Xbox, and Switch), computers (Mac and Windows), and Android mobile devices. The one place you can't play it is on iPhones, since Epic Games launched a very public battle against the Apple App Store over the way Apple collects in-app purchase fees—money Epic relies on, as it offers Fortnite: Battle Royale for free. Users need an internet connection to play. Players can play "cross-platform," which means, for example, that a Windows player can be on a team with a console player. Gamers can also create an account on any device and carry over their progress in a game to another system. For example, you could start on a cellphone, then pick up a game on a computer or console later in the day and continue where you left off. How is Fortnite related to Twitch? Some kids aren't only playing Fortnite—they're watching other people, including celebrities like Drake, play the game on Twitch. Twitch is a social media platform for gamers where they can livestream themselves playing popular video games, including Fortnite. Livestreaming can be unpredictable, so make sure to check out which gamers kids are watching, and if kids say they want to livestream themselves, carefully consider the risks. Can players chat with each other in Fortnite: Battle Royale? Live, unmoderated chat is possible between users in the console and PC versions of Fortnite: Battle Royale. Options include voice chat and on-screen text chat. This exposes players to random strangers and the likelihood of profanity. How do you turn off voice chat in Fortnite: Battle Royale? Open the Settings menu in the top right of the main Fortnite page by selecting the three bars, then the cog icon. Choose the Audio tab at the top of the screen. From there, you can adjust several audio features, including voice chat. Turn the setting from on to off by tapping the arrows. How long is a match of Fortnite: Battle Royale? Each match in Battle Royale lasts about 20 minutes, although players who are killed early play for less time. How do I manage screen time for my kids when they're playing Fortnite? When each match only takes 20 minutes, it's easy to fall into the trap of "just one more" ... sort of like how you end up binge-watching an entire season of Stranger Things. But you can take advantage of the quick matches by using them as a natural stopping point in gameplay. Some kids benefit from using a timer, limiting themselves to a certain number of matches per day, or using one of these tips for finding a balance between gaming and other activities. Read Common Sense Media's full review of Fortnite and learn more about how it works. Jeff Haynes, former senior editor, web and video games, contributed to this guide. Common Sense Media offers the largest, most trusted library of independent age-based ratings and reviews. Our timely parenting advice supports families as they navigate the challenges and possibilities of raising kids in the digital age. Show more Recommended reads on this topic Article Could My Child Be Addicted to Video Games? Article What Are Some Basic Gaming and Social Media Rules for Elementary Schoolers? Article What Should I Teach My Child About Safe Online Behavior?'''
