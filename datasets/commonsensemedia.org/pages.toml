["https://commonsensemedia.org/about-us/our-mission"]
title = "Our Mission | Common Sense Media"
description = "Common Sense Media improves the lives of kids and families by providing independent reviews, age ratings, & other information about all types of media."
full_description = "You know your kids.We know media and tech. Together we can build a digital world where our kids can thrive. Your trusted guide for a fast-changing world. Media and technology are at the center of kids' lives every day. From a very young age, kids use technology at home and at school to connect with friends and family and to document their lives and create digital content of their own. With more and more of life happening online, what catches kids' attention isn't always what's best for them, and what companies do with their personal information isn't always clear. See the impact of our work. Our five key focus areas champion high-quality media, support closing of the digital divide, ensure that students and educators think critically about technology use, and more. Learn about how we're creating a safe, healthy, and equitable digital world for kids and families: Media Choice Digital Equity Digital Literacy and Citizenship Tech Accountability Healthy Childhood Independent. Nonprofit. Research backed. Since 2003, Common Sense has been the leading source of entertainment and technology recommendations for families and schools. Every day, millions of parents and educators trust Common Sense reviews and advice to help them navigate the digital world with their kids. Together with policymakers, industry leaders, and global media partners, we're building a digital world that works better for all kids, their families, and their communities. Here's how we do it: Common Sense is an independent voice for kids, families, and communities everywhere. We combine original research with game-changing advocacy efforts to make the digital world work better for all kids. Our advocacy work highlights legislation related to technology and identifies solutions that protect consumer privacy, push for better connectivity for students and families, and hold tech companies accountable to ensure a healthy internet for all. Common Sense Media rates movies, TV shows, podcasts, books, and more so families can feel good about the entertainment choices they make for their kids. We offer the largest, most trusted library of independent age-based ratings and reviews. Our timely parenting advice supports families as they navigate the challenges and possibilities of raising kids in the digital age. Learn how we rate and review nearly everything kids want to watch, read, play, and learn. Our vision: Families taking charge of their digital choices. Common Sense Education supports K–12 schools with everything educators need to empower the next generation of digital citizens. Our innovative, award-winning Digital Citizenship Curriculum prepares students with lifelong habits and skills, supports teachers with training and recognition, and engages families and communities with helpful tips and tools. ​Schools everywhere rely on our free curriculum, expert advice, and edtech ratings to help kids thrive. Our vision: Students thriving as learners, leaders, and citizens in the digital age. Our programs: Research Program Leading the way with original research reports. The Common Sense Research Program provides unique, data-driven insights into families' and educators' experiences with media and technology. Our original research reports provide reliable, independent data on the impact of media and tech use on kids' physical, emotional, social, and intellectual development. Privacy Program Supporting a more secure digital future for kids everywhere. The Common Sense Privacy Program evaluates popular applications and edtech products so parents and educators can make informed choices about the media and tech they use with kids and so schools and districts can participate in evaluating the technology used in K–12 classrooms. Digital Literacy and Citizenship Program Helping students take ownership of their digital lives. The Common Sense Digital Literacy and Citizenship Curriculum empowers K–12 educators to prepare students to make smart choices online and in life. It includes professional development for K–12 educators in the form of live events, interactive workshops, and self-paced training, with practical takeaways and ready-to-implement teaching strategies. Family and Community Engagement Program A whole community approach to student success and well-being. The Common Sense FACE program is a free membership program that supports educators, family specialists, school administrators, and community organizations with resources and live events to help parents and caregivers navigate their kids' digital lives. FACE program members network and connect through professional development trainings, group chats, and cohort opportunities to share best practices, build community, and foster healthy media and tech use in partnership with families. Want more Common Sense? Become a member today. Join as a parentJoin as an educatorJoin as an advocate"
