title = "Parents' Ultimate Guide to TikTok (2024) | Common Sense Media"
description = "Parents' Ultimate Guide to TikTok (2024) - Learn more and get Common Sense Media's research-backed tips."
full_description = '''Robert Yaniz Jr. December 6, 2024 Browse all articles Parents' Ultimate Guide to TikTok (2024) By Robert Yaniz Jr. | December 6, 2024 Topics: Recommendations Social Media Social Media Parents Need to Know What is TikTok? TikTok Safety Features and Settings Key Concerns and Solutions Age-by-Age Considerations Making the Most of TikTok Parents Need to Know TikTok is one of the most popular social media sites for teens, second only to YouTube. Users must be age 13 and up, but kids can easily bypass age requirements by entering a false birth date. TikTok's "For You" page uses a powerful algorithm to serve an endless stream of videos that match your interests, making it extremely difficult for teens to stop scrolling (and potentially exposing them to inappropriate content). Viral challenges and trends can pressure teens into risky behaviors, from dangerous pranks to problematic mental health self-diagnosis trends. The platform aggressively promotes shopping through TikTok Shop, influencer marketing, and in-app purchases. Mental health experts are concerned about TikTok's impact on teens, including body image issues, social comparison, and addictive use patterns. What is TikTok? TikTok is a video-sharing platform that's revolutionized how teens consume and create content, and it has become one of the most influential apps in their digital lives. Its signature endless scroll of short videos (from 15 seconds to 10 minutes) and powerful recommendation engine are meant to keep users, especially teens, on the app. Beyond just entertainment, TikTok shapes teen culture, influencing everything from music and fashion trends to political awareness and mental health conversations. The platform's ability to make content go viral instantly and its highly personalized "For You" feed make it even more compelling for teens who are looking to express themselves and connect with others. The app's features continually evolve, but some features to know about include: For You Page (FYP): This is the main feed, where TikTok's algorithm serves an endless stream of videos tailored to the user's interests, making it highly engaging but often hard to step away from. Direct Messages (DMs): Private messaging for users who are 16+ helps friends connect, but it may also allow contact from strangers. Livestreaming: Users 16+ can broadcast live to their followers, often interacting in real time through comments and virtual gifts, which can sometimes introduce risks like inappropriate interactions. Duets and Stitches: These features allow users to build on others' videos by reacting, adding their own commentary, or creating collaborative content, which fosters creativity but can also lead to misuse, like mocking or hurtful reactions. Comments and Reactions: Teens use likes, comments, and emoji reactions to interact socially on TikTok, but these can also lead to bullying or negative feedback. Is it free? While TikTok is free to download and use, it's designed to encourage spending in several ways: TikTok Shop: Built-in shopping features let users buy products directly through videos. Users must be 18 years old to spend money in the TikTok Shop. Creator Marketplace: Influencers promote products, often in ways that feel like regular content. Virtual Gifts: Users can buy "coins" to send virtual gifts during livestreams—and these lead to real money for content creators. Premium Features: Subscription options like TikTok LIVE subscriptions, allow users to access perks like exclusive content, custom emojis, or priority interactions with their favorite creators during livestreams Targeted Advertising: Personalized ads are seamlessly integrated into the For You feed. What's the age requirement? TikTok requires users to be at least 13 years old to create a basic account. While the app asks for a birth date during signup, there's no strict age verification process, which makes it easy for kids to join by entering a fake date. Families should know: Children under age 13 who try to sign up should be directed to a curated version of the app that limits features like commenting, searching, and posting videos. The platform automatically sets accounts of users age 13–15 to private, which means that only approved followers can see their content or interact with their videos, providing an added layer of safety. Users must be age 16+ to use direct messaging and livestreaming features. How are teens using TikTok? Content Consumption: Most teens scroll primarily through their For You page, which learns their interests and serves increasingly personalized content Social Connection: Following friends and creators, participating in trends, and using features like Duets and Stitches to interact with others' content Creative Expression: Making their own videos using TikTok's editing tools, filters, and vast music library Information Source: Many teens use TikTok as their primary search engine for everything from news to advice Identity Building: Creating and engaging with content that helps them explore interests and build their personal brand Background Noise or Distraction: Many teens use TikTok to fill downtime, have as background noise, or as a way to escape stress, which can actually lead to excessive screen time that impacts sleep and increases stress levels TikTok Safety Features and Settings Family Pairing: Lets parents link their account with their teen's to manage privacy, screen time, messaging, and content settings Restricted Mode: Filters out mature content like explicit language or violence. While not perfect, it aims to create a safer experience for younger users. Teen Privacy and Safety Settings: Provides options to make accounts private, limit comments or Duets, and control who sees followers or posts Screen Time Management: Allows users to set daily limits and take breaks. Through Family Pairing, parents can customize limits, lock settings with a passcode, and monitor usage patterns to help teens build healthier habits. Key Concerns and Solutions My Teen Won't Stop Scrolling TikTok – What Can I Do? TikTok's "For You" page is designed to be irresistible in two ways: It learns exactly what your teen likes, and it gradually expands what they see beyond their usual interests. So a teen who starts watching soccer clips might soon be deep into sports motivation videos, workout routines, and athlete lifestyles. This "discovery" feature makes the scrolling even more compelling—there's always something new and interesting just a swipe away. This is what makes teens feel like they can't leave the app, even when they want to. What to Watch For: "Just one more video" turns into hours of scrolling Interests becoming more intense or obsessive Trouble sleeping because of late-night TikTok use Difficulty focusing on other activities Anxiety when separated from the app Scrolling during meals or family time, or as a way to avoid difficult situations What You Can Do: Create phone-free spaces and times: Keep phones out of bedrooms, and avoid them during meals, homework, and bedtime, to encourage healthier habits. Set time limits and use in-app tools: Use TikTok's Screen Time Management and "Take a Break" features to set limits, and lock them with Family Pairing if needed. Discuss these tools with your teen to help them understand why limits are important, and involve them in creating a plan that works. Encourage self-awareness: Ask simple questions like "How do you feel after scrolling?" to help them reflect on their habits. Help them find a balance: Help your teen find hobbies or activities they enjoy away from screens, like reading, drawing, or playing a sport. Encourage them to set aside time for these activities regularly so they can remember what they love beyond the phone and feel more balanced. Talk about how the algorithm works: Explain that TikTok's algorithm is designed to keep them scrolling by showing endless content tailored to their interests. Understanding this can help them feel in control and recognize when to take a break instead of letting the app control their time. What Are the Mental Health Risks for My Teen on TikTok? While TikTok can be fun and creative, mental health experts are concerned about its impact on teens' well-being. The platform's focus on "perfect" content, viral trends, and instant reactions can affect how teens see themselves and their lives. Even teens who understand that much of what they see is filtered or staged can still feel pressure to measure up. Some key issues include: Comparison overload: Endless streams of "perfect" lives, talents, and bodies can lead to increased self-comparison, which can increase the likelihood of experiencing depression, anxiety, disordered eating, and thoughts of self harm. Mental health misinformation: Viral videos about anxiety, depression, or ADHD can encourage self-diagnosis without proper guidance. "Wellness" content that's actually harmful: Some trends promote disordered eating, unhealthy exercise habits, or excessive consumerism. Social pressure: Fear of missing out (FOMO) or pressure to join trends. Filter fixation: Beauty filters can distort how teens see themselves, leading to body image issues and lower self-esteem. These filters often reinforce narrow, Eurocentric beauty standards, which can be especially harmful to teens of color by promoting features that don't reflect their natural appearances. This can lead to feelings of exclusion, lower confidence, or heightened pressure to conform to ideals that don't represent them. TikTok is now restricting certain beauty filters for users under 18 in response to these concerns. However, teens can still bypass this by entering a false birth date, so families should discuss how filters create unrealistic beauty standards. What You Can Do: Do regular "feed cleanups" together: Use "Not Interested" on harmful content and "Favorite" positive videos to help reshape their algorithm. Encourage them to switch from the "For You Page" to the "Following" tab when feeling overwhelmed, and follow accounts that promote accurate health information, positive self-image, and relaxing or uplifting content. Be open about your own social media challenges: When you find yourself comparing or scrolling too much, share how you handle it. Keep conversations casual and curious: Ask about their favorite creators or trends, rather than starting with worries or warnings. Watch some content together: Discuss filters, editing, and how posts can be misleading. For beauty filters, talk about how they reinforce narrow beauty standards and why it's important to embrace different appearances. Encourage positive content creation: Support them in using TikTok to express their creativity and celebrate their unique traits rather than trying to fit into unrealistic trends. Know when to seek help if you notice changes in mood, sleep, school performance, or eating habits related to TikTok use. How Do I Know What My Teen Is Actually Seeing on TikTok? Unlike streaming or watching TV, where parents can more easily monitor content, TikTok's personalized "For You" feed means every teen sees something different. Content can quickly move from harmless fun to inappropriate material, even with TikTok's safety filters in place. What makes this especially challenging is TikTok's powerful influencer culture, where creators often have more impact on teens than traditional celebrities, shaping not just trends but core values and behaviors. The platform's algorithm can also expose teens to harmful misinformation and extreme viewpoints. This includes content promoting toxic masculinity, misogyny, and gender stereotypes, as well as dangerous health and wellness advice. TikTok's short video format makes it harder for teens to fact-check or understand the context, and its recommendation system can lead them toward increasingly concerning content. What to Watch For: Age-inappropriate content that slips through filters Mature themes in trending sounds or hashtags Videos promoting risky behavior or substances Content about disordered eating, self-harm, or dangerous stunts Viral misinformation or conspiracy theories that target teens Influencers promoting harmful attitudes or behaviors Content that gradually becomes more extreme or concerning Adult content hidden in seemingly innocent videos What You Can Do: Use Family Pairing to set content restrictions that match your teen's maturity level Talk openly about what to do if they see disturbing content (skip it, report it, tell you) Watch some content together and discuss how to spot misinformation Talk about how influencers make money and may not have teens' best interests in mind Help them understand how the algorithm can push increasingly extreme viewpoints Encourage critical thinking about viral trends and popular creators Keep conversations open and non-judgmental about what they're seeing What Should I Know About TikTok Challenges and Trends? TikTok challenges and trends can range from fun dance moves to risky stunts that put teens in danger. While many trends are harmless or even positive (like cleanup challenges or kindness movements), others can pressure teens into unsafe behavior. What makes these especially tricky is that teens may feel intense social pressure to participate, and new challenges pop up constantly. Types of Viral Challenges and Trends Dance and music trends (usually harmless fun): Notable trends include the "Wednesday Dance" set to Lady Gaga's "Bloody Mary" or Charli XCX's "Apple" dance. Pranks and stunts (can be dangerous): Some pranks, like throwing objects or fake scares, are lighthearted, while others, like "chroming" (inhaling household chemicals for a high), pose serious health risks. Physical challenges (may risk injury): Examples include the "Milk Crate Challenge," where participants climb unstable stacks of crates, often resulting in falls and injuries, and "blackout" challenges that risk oxygen deprivation. Product challenges (often tied to purchasing): Trends like "TikTok Made Me Buy It" encourage excessive spending, with viral products ranging from skin care to kitchen gadgets. Mental health trends (can promote self-diagnosis): Examples include oversimplified personality disorder checklists or "tell me you have anxiety without telling me" trends. Food/drink challenges (may involve unsafe consumption): ​​Challenges like the "NyQuil Chicken Challenge," where teens cooked chicken in cold medicine, or the infamous "Tide Pod Challenge," encouraged dangerous consumption of toxic substances, leading to serious health risks and even hospitalization. What You Can Do: Help them understand challenge tactics: Talk about how trends use urgency, social pressure, and the promise of views to encourage participation. Keep the tone curious rather than critical. Have casual conversations about what makes a challenge safe or risky: Let teens share their thoughts first. Show interest in their perspective before sharing concerns. Support safer alternati'''
