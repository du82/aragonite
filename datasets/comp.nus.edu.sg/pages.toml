title = "About - NUS Computing"
full_description = "Unleashing Potential, Shaping the Digital Landscape Home » About About The NUS School of Computing traces its roots back to the Nanyang University Department of Computer Science that was established in 1975 – the first of its kind in Singapore. Since then, we have developed into one of the leading computing schools in the world, with faculty members who are both internationally recognised researchers and inspiring teachers.We offer outstanding undergraduate and graduate degree programmes across the full spectrum of the field of computing, including Computer Science, Information Systems, Computer Engineering, Business Analytics and Information Security, as well as specialisations in emerging areas of importance such as artificial intelligence, fintech, blockchain, analytics and security. Correspondingly, we attract excellent students and produce talented graduates who are making their mark in the world.The exceptional education that students experience here, coupled with the demand for computing talent in all fields and industries, make NUS Computing graduates highly sought-after. We instil our students with leadership qualities and a spirit of entrepreneurship through mentorship, community service initiatives and special programmes, including The Furnace, a start-up incubator which offers funding, infrastructure and management support to bring original ideas to commercial fruition.We are pleased to have been educating Singapore and the world’s computing professionals for the past four decades and are proud to count many locally and internationally prominent leaders in the field among our large and accomplished family of alumni. Professor Tan Kian LeeDean, School of ComputingTan Sri Runme Shaw Senior Professor Dean’s Welcome Welcome to NUS Computing!More than ever, digitalisation has become an integral part of our lives today, shaping the way we study, work, live and play. Here at NUS Computing, we are constantly enhancing our programmes and introducing new initiatives as we prepare our students – undergraduate, graduate and adult learners – adequately for the digital age and the new economy. Read the full message By the Numbers QS World University Rankings (2024) 0 th Alumni making their mark in the world 0 + Funds supporting research projects $ M+ Research centres fostering innovative studies + Meet our management Professor Tan Kian Lee Dean, School of Computing Associate Professor Kan Min Yen Vice Dean, Undergraduate Studies Professor Chan Mun Choon Vice Dean, Academic Affairs and Graduate Studies Find Out More Our prominent alumni Ng See Sing Managing Director, Singapore at DXC Technology Bruce Liang Head Strategic Projects, Sea Yen Yen Tan Non Executive Director, OCBC Bank Find Out More NUS COMPUTING LEADING THE WAY IN AI INNOVATION Learn more"
