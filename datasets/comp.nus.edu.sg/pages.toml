title = "Dean's Message - NUS Computing"
full_description = "Home » About » Dean’s Message Message from the Dean Professor Tan Kian Lee Dean, School of ComputingTan Sri Runme Shaw Senior Professor Biography This year, 2025, holds special significance. Firstly, Singapore celebrates 60 years of nation-building and secondly, the National University of Singapore (NUS) commemorates its 120th anniversary. And finally, the NUS School of Computing (NUS Computing) also marks its very own historic milestone – 50 years of computing education in Singapore. Five decades ago, we started out as a small Computer Centre offering programming courses to a handful of students. We took on the challenge to introduce an information technology-based education to support Singapore’s industrialisation aspirations. From a modest department to a full-fledged school, NUS Computing has maintained our noble mission to educate and train generations of IT professionals over the years. Our student enrolment is more than 6,000 and we have a 20,000-strong alumni fraternity.We are proud of our rich and storied heritage. We were the first to educate computing graduates, and continue to be the largest source of top-notch computing professionals today. Our graduates remain highly sought-after, a testament to our success. Many have excelled in teaching and research frontiers, assumed thought leadership roles in national IT research institutions and enterprises, and emerged as influential drivers of the industry.As we brace ourselves for more transformative challenges ahead in the new economy, the School is committed to empowering our students with more innovative skills and knowledge as well as industry relevant competencies. To this end, the School will introduce more AI-centric courses this year as part of the curriculum to prepare our graduates for the future AI-empowered workplace and society. We hope to also strengthen our philanthropic efforts to create awareness and inculcate greater interest in community engagement among students.NUS Computing is more than just a school which offers academic and research pursuits. We are a vibrant community of talented individuals – our internationally acclaimed faculty are inspiring teachers and researchers while our students exemplify creativity, leadership and an entrepreneurial spirit.It has been a remarkable 50-year journey thus far. Building on our strong legacy, I am confident that NUS Computing will continue to chart a path of success and excellence. I look forward to working with our dedicated community of faculty, staff, students and alumni to further elevate our academic and research distinction, enrich student life, and deepen our social responsibility to shape a better future."
year_published = 2025
