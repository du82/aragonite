["https://compass.com/about"]
title = "About Us - Compass Real Estate"
full_description = '''A real estate company with a purpose. Our mission is to help everyone find their place in the world. Compass is building the first modern real estate platform, pairing the industry’s top talent with technology to make the search and sell experience intelligent and seamless. A brokerage of unparalleled agents As an innovative residential real estate firm, we empower our agents so they have more time for advising their clients. With the solutions-driven mindset of a startup and the sophistication of a luxury brand, Compass is the future of real estate. A tech company reinventing the space To lead the industry requires the smartest tools built by the brightest minds across engineering, design, and strategy. Through our proprietary platform, Compass is changing how agents and clients navigate the process of finding or selling a home. Whether you know us as Urban Compass or just Compass, since our launch in 2012 we’ve aimed to simplify the real estate process, one market at a time. Guiding you from coast to coast With our agents serving vibrant communities across the U.S., Compass is now the country's largest independent real estate brokerage. On-the-ground teams support our agents, serving each location with precision and nuance. Explore our office locations Leading our way With founders Ori Allon and Robert Reffkin at the helm, Compass is led by a team of experienced innovators. These proven pioneers across technology, real estate, marketing, and finance are solving real estate’s most complex challenges. Robert Reffkin Founder & CEO Ori Allon Founder & Chief Strategist Neda Navab President Kalani Reelitz Chief Financial Officer Rory Golod President of Growth & Communications Meet the entire team A national network of local experts Our agents are trusted advisors, helping everyone from the first-time buyer to the seasoned seller make better, more informed decisions. Partner with an agent A diverse team with a single vision We’re bringing together the world’s sharpest, most creative professionals across real estate, engineering, business, marketing, and design. Learn about careers On the radar From our early days with a single downtown Manhattan office, through our evolution into the national force we are today, the press has been covering our rapid growth — our entrepreneurial people and our integrated platform. “And it’s no wonder Compass has shaken things up: As anyone who’s ever tried to rent or buy property in New York knows, the experience is loaded with pain points — exactly the type of stuff that turns mere ideas into thriving startups.” “While Compass functions like a traditional broker, the company's promise is using technology to reduce the time and friction of buying and selling a house or apartment... last month Compass released an app designed to replace ‘stale’ quarterly market reports with more dynamic information." "You might think of Compass as the equivalent of the launch of the first iPhone to the various other smartphones that preceded it." Keep exploring Meet our agents Sell your home Join our team Contact us'''
year_published = 2025
