title = "The Team - Compass Real Estate"
full_description = "We're a passionate team of engineers, real-estate professionals, and entrepreneurs making it easier to find a great place to live. Interested in joining the team? See our current job openings. Leadership Team Robert Reffkin Founder & CEO Robert Reffkin founded Compass in 2012, drawing inspiration from his mother, Ruth, a longtime real estate agent. Under his leadership, Compass ascended to become the country's #1 real estate brokerage in the United States, achieving half a trillion dollars in real estate sales. Robert holds both a B.A. and M.B.A. from Columbia University, and his professional background includes roles at McKinsey and Goldman Sachs, along with a tenure as a White House Fellow. Beyond his business endeavors, he has run 50 marathons in 50 states, raising $1 million for charities–including the nonprofit America Needs You, which he founded to empower young people from underprivileged backgrounds, assisting them in becoming the first in their families to attend college. He is also donating all of his proceeds from his recent book, No One Succeeds Alone, to nonprofits that help young people realize their dreams. Ori Allon Founder & Chief Strategist Ori Allon is a technologist and entrepreneur who, throughout his career, has built software-driven businesses that generate personalized experiences for the everyday consumer. Ori's background working in technology includes serving as Director of Engineering at Twitter, founding Julpan which was acquired by Twitter, and founding Orion which was acquired by Google. His passion lies within empowering entrepreneurs to make impact through technology. Ori earned his PhD in computer science at the University of New South Wales in Sydney, Australia. Neda Navab President The proud daughter of a real estate agent, Neda is focused on bringing Compass's mission to life across the United States. Prior to Compass Neda was the Director of Urban Systems at Sidewalk Labs, the division of Google focused on building smart cities. Neda also spent years in the Bay Area working at high-growth technology companies, and in East Africa building programs to support female entrepreneurs. Neda started her career as a management consultant at McKinsey & Co. She earned her MBA from Harvard Business School and her BA in Economics from Columbia University. Kalani Reelitz Chief Financial Officer Kalani Reelitz brings nearly 20 years of finance, business, and operational experience across the real estate and retail industries. Among his many leadership roles, he served as Chief Financial Officer and Chief Operating Officer at Cushman & Wakefield Americas, one of the world’s leading commercial real estate companies. Prior to joining Cushman & Wakefield, Kalani spent 12 years at Walgreens in a variety of roles, including strategy and business integration, strategic finance, financial planning and analysis, and internal audit. Kalani received a Bachelor of Business Administration and a Master of Science in Accounting from Loyola University Chicago. Rory Golod President of Growth & Communications Rory joined Compass in 2014 and currently serves as the President of Growth and Communications. Prior to his current position, he held various roles across the company including chief of staff to Founder and CEO Robert Reffkin. Before coming to Compass, Rory worked in Global Analytics for Bloomberg LP and Operations & Strategy at Yext, Inc. (NYSE: YEXT). Rory received his BA from the University of Richmond and was the winner of the 2008 Robins School Business Plan competition. Independent Board Members Allan Leinwand Board Member Allan Leinwand is Chief Technology Officer at Shopify, joining in 2021 to lead the engineering teams. Prior to Shopify, Allan was Senior Vice President of Engineering at Slack from pre-IPO, transforming the way work gets done for hundreds of thousands of companies and tens of millions of users. Previously, Allan was Chief Technology Officer at ServiceNow, and has co-founded and held senior leadership positions at multiple companies and was also a venture capital investor for seven years. Allan previously served as an adjunct professor at the University of California, Berkeley where he taught on the subjects of computer networks, network management and network design. He holds a BS in Computer Science from the University of Colorado at Boulder. He co-authored “Cisco Router Configuration” and “Network Management: A Practical Perspective” and has been granted a patent in the field of data routing. Charles Phillips Board Member Charles Phillips is the former CEO and Chairman of Infor, the third-largest business software applications company in the world. The company provides cloud applications that automate critical business processes for a broad range of industries. Prior to joining Infor, Charles was president of Oracle Corporation and a member of its board of directors. During his eight-year tenure, Oracle tripled in market capitalization and acquired 70 companies. Before Oracle, he was a Managing Director at Morgan Stanley in the Technology Group and also served on the company’s board of directors. Charles’ experience as a board member is extensive. He has served on the boards of the Viacom Corporation, the Apollo Theater, the New York Police Foundation, the Federal Reserve Bank of New York and President Barack Obama’s Economic Recovery Board. Dawanna Williams Board Member Dawanna Williams is the Founder and Managing Principal of Dabar Development Partners – a real estate development firm that offers modern living solutions with intelligent planning, architectural ingenuity, and environmental integrity. Prior to founding Dabar, she spent 10 years practicing commercial real estate law, most of that time with the firm Sidley Austin LLP. During her legal career, she has represented major developers, international funds, investment banks, institutional lenders and private equity investors to facilitate a wide range of complex real estate transactions, totaling millions of spatial square feet. Dawanna also serves on the boards of ACRES Commercial Realty Corp. (NYSE: ACR), Focus Impact Acquisition Corp. (NASDAQ: FIACU), the New York Real Estate Chamber, the Apollo Theater, and The Trust For Cultural Resources of The City Of New York. She holds an A.B. from Smith College, an M.P.A. from the Harvard Kennedy School and a J.D. from the University of Maryland Francis King Carey School of Law. Frank Martell Board Member Frank Martell serves as President and CEO of loanDepot, where he leads the team in service of its mission to serve customers throughout the home ownership journey. From March 2017 to January 2022, Frank Martell served as President and Chief Executive Officer of CoreLogic, after serving in the Chief Financial Officer and Chief Operating Officer roles after joining CoreLogic in 2011. Martell now serves as the non-executive Chairman of the Board of directors at CoreLogic, supporting the company's efforts to provide real estate data and analytics services to real estate professionals, financial institutions, insurance carriers, government agencies, and other housing market participants to help people make their dream of homeownership a reality. Frank has over 30 years of executive leadership experience in the marketing, financial services, and business information industries including senior executive roles at General Electric, AC Nielsen, and the Western Institutional Review Board. In 2016, he received the HousingWire Vanguard Award in recognition of his distinguished leadership in the housing industry. Frank serves on the global board of directors of Operation HOPE, a best-in-class provider of financial literacy empowerment for youth, financial capability for communities, and financial dignity for all. He chairs the West Coast Scarlet & Gold Committee of the Marine Corps Scholarship Foundation and is on the board of directors of Bank of the West. Josh McCarter Board Member Josh McCarter currently serves as the CEO of ShipMonk, a leading e-commerce fulfillment and technology solutions provider. Formerly, Mr. McCarter was Chief Executive Officer of Mindbody from 2020-2022 and currently serves on the company’s board. Josh previously held the position of president and Chief Strategy Officer at Mindbody. He joined Mindbody in 2018 as a result of the acquisition of Booker, which he co-founded in 2010 and built in to the largest vertical SaaS company serving thousands of beauty & wellness businesses around the world. Josh previously served as president of Arbitech, LLC from 2003 to 2010, Chief Operating Officer of SpaFinder, Inc. from 2000 to 2002 and Vice President of Business and International Development of Autobytel from 1996 to 2000. Mr. McCarter has also held various board positions with private companies, community organizations, and non-profit organizations including the Young Presidents’ Organization, a worldwide leadership community of chief executives, and the Juvenile Diabetes Research Foundation, a non-profit organization aimed at providing support to individuals impacted by type 1 diabetes. Mr. McCarter holds a B.A. degree in political science from the University of California, Los Angeles and a M.B.A. from the University of Southern California. Pamela Thomas-Graham Board Member Pamela Thomas-Graham began her career at McKinsey & Company where she became the first African-American woman to make partner. Throughout her career, Pamela served as Chief Marketing Officer and on the executive board at Credit Suisse, Group President Liz Claiborne, and President and Chief Executive Officer of both CNBC Television and CNBC.com. Currently, she serves as Lead Independent Director on the board of the Clorox Company, and is a board member of Bumble, Peloton, Bank of N.T. Butterfield & Son, and Norwegian Cruise Lines. Steven Sordello Board Member Steve Sordello is the Chief Financial Officer of LinkedIn, where he oversaw the company’s successful IPO in 2011, raised more than $4 billion in capital and completed multiple private and public acquisitions, including LinkedIn's $26.2 billion merger with Microsoft. Prior to LinkedIn, Steve was instrumental in guiding TiVo to profitability. Steve serves on the board of Atlassian and is a trustee at Santa Clara University."
