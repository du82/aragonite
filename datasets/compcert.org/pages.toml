full_description = '''Menu Home Partners Motivations Research The Compcert C compiler Downloads Publications The CompCert project investigates the formal verification of realistic compilers usable for critical embedded software. Such verified compilers come with a mathematical, machine-checked proof that the generated executable code behaves exactly as prescribed by the semantics of the source program. By ruling out the possibility of compiler-introduced bugs, verified compilers strengthen the guarantees that can be obtained by applying formal methods to source programs. The main result of the project is the CompCert C verified compiler, a high-assurance compiler for almost all of the C language (ISO C 2011), generating efficient code for the ARM, PowerPC, RISC-V and x86 processors. Download CompCert C Read the manual News [12/2024] Release of CompCert version 3.15. This release makes value analysis more precise, thus improving the effectiveness of constant propagation and redundant cast elimination. Other missed opportunities for optimization were also addressed, notably for redundant load elimination on ARM and RISC-V. This release also fixes incompatibilities with header files in the latest version of macOS, and improves support for Coq 8.20. [05/2024] Release of CompCert version 3.14. It provides minor performance improvements, notably for ARM 32 bits, better debugger support for ARM 64 bits and RISC-V, and supports Coq up to version 8.19. [07/2023] Release of CompCert version 3.13. This is a minor release that fixes minor issues in the unverified C front-end, and improves code compactness for ARM Thumb. [01/2023] For the development of CompCert, the 2022 ACM SIGPLAN Programming Languages Software Award is awarded to Xavier Leroy, Sandrine Blazy, Zaynah Dargaye, Jacques-Henri Jourdan, Michael Schmidt, Bernhard Schommer, and Jean-Baptiste Tristan. This award recognizes "a software system that has had a significant impact on programming language research, implementations, and tools. The impact may be reflected in the widespread adoption of the system or its underlying concepts by the wider programming language community either in research projects, in the open-source community, or commercially". [11/2022] CompCert version 3.12 is released, featuring full support for unstructured switch statements (the infamous Duff's device) and C2011 Unicode string literals and character constants. [06/2022] Release of CompCert version 3.11. This release adds support for _Generic expressions from C11 and fixes minor deviations from ISO C and minor issues with the RISC-V back-end. It uses version 4.1 of the Flocq library for floating-point arithmetic and is compatible with Coq 8.15. [05/2022] For the development of CompCert, the 2021 ACM Software System Award is awarded to Xavier Leroy, Sandrine Blazy, Zaynah Dargaye, Jacques-Henri Jourdan, Michael Schmidt, Bernhard Schommer, and Jean-Baptiste Tristan. This award recognizes "a software system that has had a lasting influence, reflected in contributions to concepts, in commercial acceptance, or both" and is considered the highest award for software originating from computer science research. [11/2021] Release of CompCert version 3.10. Bit fields in structs and unions are no longer emulated, but are given formal semantics and are compiled to bit-level manipulations in the formally-verified part of CompCert. Relatedly, the layout of bit fields is now compatible with the ELF ABI. Other novelties include a new implementation of the PTree data structure that enjoys extensionality and runs faster, and an option to the clightgen to produce CompCert C AST instead of Clight AST. [05/2021] CompCert version 3.9 is released. It adds support for macOS running on "Apple silicon", i.e. ARM 64-bit architectures, preliminary support for __builtin_expect and __builtin_unreachable, and compatibility with Coq 8.13 and Menhir >= 20210419. Also, the open-source parts of CompCert are now licensed under the LGPL (in