full_description = '''Files Source distribution User's manual Browse the Coq development Earlier releases Git repository Menu Home Partners Motivations Research The Compcert C compiler Downloads Publications Downloads The latest release of the CompCert C compiler is version 3.15, released in December 2024. See here for a description of this compiler. Changes from earlier releases are summarized here. Earlier releases can be found here. The current state of the development can be viewed on Github. Source distribution Download the source code: Compcert C version 3.15. Download the user's manual in PDF or browse it online. The sources compile and run on Intel or AMD x86 machines running Linux, macOS, or Windows with the Cygwin environment, and also on ARM 64-bit machines running Linux or macOS. To compile, you will need: The Coq proof assistant: any version between 8.20 and 8.13. It is available from coq.inria.fr or prepackaged in OPAM, Homebrew, MacPorts, and many Linux distributions. The OCaml functional language, version 4.05 or later, available from ocaml.org or prepackaged in OPAM, Homebrew, MacPorts, and many Linux distributions. The Menhir parser generator version 20200624 or later, available from Inria or prepackaged in OPAM. Refer to the user's manual for installation instructions. The CompCert C compiler is not free software. This public release can be used for evaluation, research and education purposes, but not for commercial purposes. See the License for more information. The AbsInt company sells a version of CompCert that has no such restrictions and can be used for commercial purposes. Contact sales@absint.com for more information. For questions and feedback about the CompCert C compiler, please contact <!-- function frob(msg) { msg = msg.replace(/[^A-Z0-9.@]/g, "").toLowerCase(); document.write("<a href=mailto:" + msg + ">" + msg + "</a>"); } frob("qwXzqteAgdVfghIjheEdagRx.dgfLhgfEadfRgwOfghY@IsNeRhdsIdxAe.FxRy") // --> <code>Xavier</code> DOT <code>Leroy</code> AT <code>inria</code> DOT <code>fr</code> Browse the Coq development The Coq development can also be browsed online.'''
