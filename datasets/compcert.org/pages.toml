["https://compcert.org/doc/index.html"]
title = "The CompCert verified compiler"
full_description = 'CompCert is a compiler that generates ARM, PowerPC, RISC-V and x86 assembly code from CompCert C, a large subset of the C programming language. The particularity of this compiler is that it is written mostly within the specification language of the Coq proof assistant, and its correctness --- the fact that the generated assembly code is semantically equivalent to its source program --- was entirely proved within the Coq proof assistant. High-level descriptions of the CompCert compiler and its proof of correctness can be found in the following papers (in increasing order of technical details): This Web site gives a commented listing of the underlying Coq specifications and proofs. Proof scripts are folded by default, but can be viewed by clicking on "Proof". Some modules (written in italics below) differ between the five target architectures. The PowerPC versions of these modules are shown below; the AArch64, ARM, x86 and RISC-V versions can be found in the source distribution. This development is a work in progress; some parts have substantially changed since the overview papers above were written. The complete sources for CompCert can be downloaded from the Git repository or the CompCert Web site. This document and the CompCert sources are copyright Institut National de Recherche en Informatique et en Automatique (INRIA) and AbsInt Angewandte Informatik GmbH, and are distributed under the terms of the following license.'
