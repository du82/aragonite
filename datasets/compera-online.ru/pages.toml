full_description = "По началу я хотел назвать этот раздел «Записки о вебдизайне». Однако, осмыслив тот факт, что речь в нём будет идти всё таки преимущественно о технической стороне вопроса (в нашей команде я занимаюсь HTML-вёрсткой, переносом на CMS и прочими техническими моментами), то раздел будет называться именно сайтостроением. Создан раздел исключительно в целях помощи начинающим верстальщикам, чтобы у них была возможность не методом проб и ошибок изучать HTML/CSS и прочие безобразия, а уже иметь какие-то исходные направления. Так же я постараюсь дать информацию для тех, кому может быть и не требуется глубоких знаний, т.к. их функция будет состоять только в том, чтобы что-то подправить на имеющемся сайте. Это для тех, кто занимается наполнением сайтов. Как правило, все современные сайты функционируют под управлением CMS (Content Managment System – система управления контентом), в которых имеются встроенные визуальные редакторы. Однако, изредка, требуется сделать что-то выходящее за рамки редактора. Вот как раз тут требуются хотя бы базовые знания HTML. Сегодня мы поговорим о такой неотъемлемой части вебстраницы, как раздел <head>, не случайно его головой назвали. От правильного оформления заголовка отчасти зависит положение сайта в поисковой выдаче."
