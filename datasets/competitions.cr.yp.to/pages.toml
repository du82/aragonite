["http://competitions.cr.yp.to/disasters.html"]
title = """
Crypto competitions:
Disasters"""
full_description = "The trust that users place in secret-key cryptography has been repeatedly and flagrantly violated. Consider the following recent and ongoing examples: Less obvious, but even more pervasive, is an even more extreme type of disaster, in which the attacker does not need to break an authenticated cipher because the application is failing to use an authenticated cipher. Consider the following examples: It is easy to blame many of these security problems on a lack of user education, where in this case the users are the software and hardware engineers choosing cryptographic primitives to apply. The AES block cipher was standardized more than a decade ago and apparently has none of the weaknesses of RC4, Keeloq, etc.; there is an extensive literature explaining how to use AES to encrypt and authenticate messages of any length (for example, with AES-OCB3); many of these explanations are backed by proofs of security, assuming nothing more than the security of AES; and there is an extensive literature on defenses against timing attacks and other side-channel attacks. However, in many cases there is a tension between security and the performance requirements of the applications. For example, RC4 became popular precisely because it offers high speed in software: AES needs more than 10 cycles per byte on most CPUs, while RC4 typically runs in fewer than 6. HB was introduced, and remains widely studied, precisely because it can fit into very small hardware, under 1000 gates. Software side-channel defenses impose a noticeable cost, and hardware side-channel defenses impose a much larger cost."
year_published = 2025
