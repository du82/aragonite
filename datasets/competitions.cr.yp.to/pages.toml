full_description = 'MD5 became very widely used and inspired a number of similar-looking hash functions, including SHA-0 (1993), SHA-1 (1995), and SHA-2 (2001). SHA-2 is actually four functions: SHA-224, SHA-256, SHA-384, and SHA-512. On 12 August 2004, Joux, Carribault, Lemuet, and Jalby announced collisions in SHA-0. On 17 August 2004, Xiaoyun Wang independently presented collisions in MD5 and faster collisions in SHA-0. In February 2005, Wang, Yiqun Lisa Yin, and Hongbo Yu announced an attack that could find collisions in SHA-1 using only 2^69 simple operations. The goal of the SHA-3 competition was to specify "a new hash algorithm to augment and revise" FIPS 180-2, the standard that specified SHA-1 and SHA-2. The SHA-3 competition was organized by the United States National Institute of Standards and Technology (NIST). This list includes the 51 submissions accepted for round 1, and 5 of the 13 submissions not accepted for round 1; the other 8 submissions have not been disclosed. winnerfinalistround 2round 1 yesyesyesyesKeccak yesyesyesBLAKE yesyesyesGrøstl yesyesyesJH yesyesyesSkein yesyesBlue Midnight Wish yesyesCubeHash yesyesECHO yesyesFugue yesyesHamsi yesyesLuffa yesyesShabal yesyesSHAvite-3 yesyesSIMD yesARIRANG yesCHI yesCRUNCH yesFSB yesLANE yesLesamnta yesMD6 yesSANDstorm yesSarmal yesSWIFFTX yesTIB3 yesAURORA (broken) yesBlender (broken) yesCheetah (broken) yesDynamic SHA (broken) yesDynamic SHA2 (broken) yesECOH (broken) yesEdon-R (broken) yesEnRUPT (broken) yesESSENCE (broken) yesLUX (broken) yesMCSSHA-3 (broken) yesNaSHA (broken) yesSgàil (broken) yesSpectral Hash (broken) yesTwister (broken) yesVortex (broken) yesAbacus (withdrawn) yesBoole (withdrawn) yesDCH (withdrawn) yesKhichidi-1 (withdrawn) yesMeshHash (withdrawn) yesSHAMATA (withdrawn) yesStreamHash (withdrawn) yesTangle (withdrawn) yesWaMM (withdrawn) yesWaterfall (withdrawn) HASH 2X Maraca NKS 2D Ponic ZK-Crypt'
