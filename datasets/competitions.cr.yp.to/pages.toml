full_description = "This document is draft 5 of a call for CAESAR public submissions. Please check http://competitions.cr.yp.to for newer drafts. CAESAR (Competition for Authenticated Encryption: Security, Applicability, and Robustness) will identify a portfolio of authenticated ciphers that (1) offer advantages over AES-GCM and (2) are suitable for widespread adoption. Cryptographic algorithm designers are invited to submit proposals of authenticated ciphers to CAESAR. All proposals will be made public for evaluation. First-round submission PDF files must be received by caesar-submissions at competitions.cr.yp.to between 2014.02.01 and 2014.03.15 23:59 GMT. This email must have subject line precisely round 1 submission: NAME where NAME is replaced by the cipher name. After 2014.03.15 the CAESAR secretary will publish all first-round submissions received, except that the CAESAR secretary may eliminate submissions that do not meet requirements stated in this call. Reference software implementations must be received by caesar-submissions at competitions.cr.yp.to between 2014.02.01 and 2014.04.15 23:59 GMT. This email must have subject line precisely round 1 software: NAME where NAME is replaced by the cipher name. The CAESAR secretary may eliminate any submission that does not comply with the reference implementation requirements or other requirements stated in this call. An authenticated cipher is a function with five byte-string inputs and one byte-string output. The five inputs are a variable-length plaintext, variable-length associated data, a fixed-length secret message number, a fixed-length public message number, and a fixed-length key. The output is a variable-length ciphertext. The first four inputs have different security purposes, as indicated by the following table: integrityconfidentialitymay impose single-use requirements plaintextyesyesno associated datayesnono secret message numberyesyesyes public message numberyesnoyes It must be possible to recover the plaintext and the secret message number from the ciphertext, associated data, public message number, and key."
