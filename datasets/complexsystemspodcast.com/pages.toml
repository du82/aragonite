title = "Balancing control and chaos, with Dan Davies"
description = "Dan and I chat about Lying for Money, his book on organizational design (and dysfunction), and more."
full_description = "Balancing control and chaos, with Dan Davies Patrick McKenzie Aug 22nd, 2024 Dan and I chat about Lying for Money, his book on organizational design (and dysfunction), and more. Dan Davies, one of my favorite authors (Lying for Money is perhaps my favorite non-fiction book of this decade), came on the podcast to discuss his new book The Unaccountability Machine on organizational design (and why it occasionally creates perverse outcomes in recent times).[Patrick notes: I add after-the-fact notes to the transcript, set aside in this fashion.As befits a conversation between a serious writer and a serious reader, we mention a lot of books. Not all mentions are necessarily endorsements; some of these are historical texts at this point. I took the liberty of linking to Amazon for convenience. No, they're not affiliate links.] Sponsor:This podcast is sponsored by Check, the leading payroll infrastructure provider and pioneer of embedded payroll. Check makes it easy for any SaaS platform to build a payroll business, and already powers 60+ popular platforms. Head to checkhq.com/complex and tell them patio11 sent you.Timestamps(00:00) Intro (00:26) The Unaccountability Machine (01:38) History and fundamentals of cybernetics (08:10) Operations research and its evolution (12:08) Theory of the Firm, revisited (15:21) Monopolizing math for fun and profit (18:38) Sponsor: Check (19:50) Role of black boxes in systems (25:11) AI and the future of system management (30:02) Accountability sinks and organizational issues (38:44) Optimism about future of organizational design (43:45) Empowering employees: the CEO’s open door policy (46:31) Lying for Money (51:57) Psychology of fraudsters (01:02:52) Fraudogenic environments (01:09:49) Journey of becoming a published author (01:18:13) Effective ways to sell books (01:22:33) Wrap (You can Ctrl-F for most of these titles to skip to that point in the transcript. Sorry, due to technical reasons, I cannot simply link them everywhere this transcript appears.) TranscriptPatrick: Hi everybody. I'm Patrick McKenzie, better known as patio11 on the internets, and I'm here with one of my favorite nonfiction authors, Dan Davies.Dan: Hi! I'm really pleased to be here.The Unaccountability MachinePatrick: Honored to have you here, Dan. So I'd love to talk about your new book, The Unaccountability Machine. I've been reading it with interest the last couple of weeks.Dan: Oh, thanks. It's been a bit of a labor of love for me. It's taken about five years, start to finish, although I took a break in the middle of that to write a different book. It's really talking about a kind of thing that's adjacent to the themes of this podcast: how people build systems to manage things because they are too complicated for any one human being to hold them in their head.But then the systems take on a life of their own, and in particular, I'm most interested in the situations where a decision-making process has been industrialized – and where it now really seems like the only sensible way that you can look at the situation is one where the system is in control, and where the system is making the decisions, and they can't be attributed easily or fairly to any one natural person, any one single human being.History and fundamentals of cyberneticsPatrick: Yep. So the book starts with a deep dive into the history of cybernetics, which is honestly something I was under-informed about, but I suppose that's why we read. The brief version is that cybernetics is sort of the history of looking at organizations – not so much as social systems, which we have a bit of in ethnography and other places, but as more technical systems for getting work done.Dan: Yeah, absolutely. The way I would describe it is that cybernetics is applied mathematics in the same way that economics is applied mathematics – but like economics, it's mathematics being applied in an area where most of the important things aren't necessarily mathematically quantifiable.So, I mean, maybe I should unpack that a bit. Originally the word was coined in the 1940s by Norbert Wiener, who was at work trying to design an automated gun site. He was working on how to get a gun site to automatically track aircraft, and he started realizing that there was some single quantity that was being preserved between the radar, the operator, the server motors, and the site. This quantity might be what you would call information.The idea that if you could treat this abstract quantity of information as a single entity, and ignore all of the physical processes going on, just lent itself to a whole load of analysis, in the early days of computer science, in the early days of control engineering, optimization – all of these techniques were being invented at the end of the second world war. There's a whole parallel strand of that analysis, which ended up becoming information theory – and another way to look at cybernetics is that it's information theory kind of turned through 90 degrees, to be thinking about things in terms of control. (I'm kind of going a bit fast here, but my personal favorite nonfiction book in the last 20 years is James Gleick's The Information, which is all about the discovery of information theory at Bell Labs by Claude Shannon.)Patrick: I was going to name drop Claude Shannon and prove that I actually have a CS degree, darn it.Dan: Shannon's fundamental theorem of information theory is showing that information is entropy – and in Shannon's formulation, it's entropy because information is the opposite of redundancy. It's the extent to which a signal can't be compressed.Now, Wiener actually came up with the exact same theorem close enough in time to Shannon's theorem that they both decided that, you know, they were friends and it would be in nobody's interest to have a big battle about who invented what first. But in Wiener's formulation of information theory, it's entropy with a negative sign in front of it, because the way that Wiener and cybernetics interpreted information is that it's a measure of disorder in the system. It's a measure of the chaos that the system can throw up. From there you get other extensions of that in applied mathematics, and the absolute fundamental theorem being discovered by a guy in Britain called Ross Ashby. He was actually a brain doctor, but he was trying to build an artificial intelligence – even back in 1950, before the first IBM machine had been imported into the UK.Ashby's Theorem of requisite variety is just the very simple principle that the bandwidth and capacity of a controller has to be at least as great as the amount of entropy and variety generated by the system that it's trying to control. If we think of economics as being basically the science of trying to make sure that supply and demand balance with one another, then cybernetics, at that same level of generality, is the same principle of trying to make sure that the information balance sheet balances, and that the capacity to manage the system is equal or greater to the amount of chaos and uncertainty that the system itself can throw up. The big difference is that in economics, you talk about equilibrium because if supply and demand are out of balance, then they will tend towards equilibrium – prices will move, supply and demand will adjust, and they will tend towards equilibrium. In cybernetics there's no such easy equilibrium process for the information matching; it has to be produced by constant effort. That's why for someone like Stafford Beer and the early cyberneticians, they're always talking about the word homeostasis. Homeostasis is basically the same thing as equilibrium, it's just the Greek word – homeostasis, same state – but it has that implication that this is not a self-sustaining stable process. This is a state which requires constant input of energy in order to maintain it. The way that a guy explained it to me was that, if your body's temperature is in homeostasis, that's good, because it's being maintained at a constant 98 degrees Fahrenheit, 37 and a half degrees Celsius. If your body temperature is in equilibrium, that's probably bad, because that means you're in equilibrium with the surrounding temperature and that usually means that you're dead.Operations research and its evolutionPatrick: So it seems to me from the outside that cybernetics is one of a number of more rigorous intellectual approaches to analyzing organizations and production systems as systems themselves that we got right around the Second World War – largely done by people who were given incredible incentives to understand how factories and logistics and similar worked, many times for the first time in history because we were in total war mode. I think operations research was essentially invented in parallel at roughly the same time.One of the enduring mysteries of the 20th century for me is how we invented operations research in the United States and the UK during the war, and then promptly forgot about it for, it seems, about 40, 50 years afterwards – meanwhile W. Edwards Deming took it over to Japan and successfully evangelized it in large Japanese manufacturing companies during the interim, and then they sort of ran the table on the world for much of the next 50 years by basically having a worldwide monopoly on applied mathematics.[Patrick notes: There are many books written about this, some implicating a company which I never officially worked at but which many people in the vicinity of Nagoya do not officially work for. You might find this one or this one useful on the general topic. There is a bit of a cargo cult around the whole field, much like there is a cargo cult around Agile, for the same reason: this model won, decisively. Practice in the field these days is not merely using or not using the model, it exists in conversation with a world transformed by that model, in a way which influences customers, suppliers, the ecosystem, etc, whether on uses the specific words/tactics/etc of the model or not.] Dan: Well, there's a whole story there – it's, again, a story partly about information, but it's also a story about ideology. The thing about operations research, management cybernetics, all of these things which just basically mean applied mathematics in the context of controlling systems, big systems, is that, as you say, they did develop from the military.They developed from a very command and control-oriented kind of philosophy, in which you were always going to assume that you could hand out orders and make things happen and that you would have reasonable control over the information environment – which is to say not perfect control, but you'd be aware of the major sources of uncertainty in the process.And of course, this was the Cold War. This was not a time at which it was particularly ideologically simpatico in the USA or in Western Europe to be talking about things in terms of command and control structures and information gathering, information management and processing and making of five-year plans.It was a period in which we were very ideologically committed to the idea that the free market was effectively our way of processing information – that, you know, the financial markets coupled with competitive goods markets was our equivalent of a distributed supercomputer – and to be honest, who's to say that was wrong?I'm not going to disagree with you about the influence of Deming in Japan and Lean Production and all those things, but, you know, the USA didn't do too badly. I've been there. It's a great place.[Patrick notes: Lean Production is a reference to the constellation of practices associated with a certain automobile manufacturer. That particular one is about radically minimizing the amount of “work in progress” and inventory levels, in the pursuit of greater efficiency, quality, and cost control.]Dan: The problem was that as things got more and more complicated, to my mind, the financial market in particular just stopped working as a regulator. Maybe we can kind of come onto this in some other context, but particular pathologies of the financial markets – in particular the overuse of debt – just made it work much less well as a massive distributed supercomputer to organize our whole economy, and maybe we're reaching some kind of crisis point now.Theory of the Firm, revisitedPatrick: I can't remember who first articulated this [Patrick notes: Ronald Coase, in Theory of the Firm], but one of the idiosyncrasies of capitalism is that we rely on price as a signal in competitive, vibrant markets for trade between firms – but then in trade within firms, virtually no one has a true internal markets operating (with the possible exception of Amazon with regards to some capital allocation decisions, but that's definitely not the main way that firms operate).They operate more on the command and control model, where you have an org chart, and the org chart passes orders and memos around, and hopefully that converges on actually producing something of value in the economy.One thing that we see repeatedly when we try to analyze systems is that we have a theory for how the system operates – maybe we have mathematics that can describe that in some fashion – and then reality confounds our expectations because all models are wrong and some models are useful but some models are, let's say, wronger than others.Is there, like, a Seeing Like A State vibe with regards to cybernetics, in that we created this wonderful theory of the firm, but perhaps it does not describe exactly the firms that we have in front of us?Dan: Well, it's always the problem. There's a guy – don't know if you've come across him, incredibly smart guy – up at the University of Berkeley called Ben Recht, and he's very much into control engineering, borderlines of machine learning, recommendation engines.I was talking to him at a conference a few months ago and he said, you know, “in every one of these theories of organization, there comes a point where complexity increases and you switch from math to metaphor.” For economics, you can have things like derivatives pricing and finance theory, and that's pure math – bond pricing is simply math, and there is a right answer to however many decimal places you want to give it.It's precise because you have access to the entire relevant information environments – everything that is worth knowing about a US government bond can be held on one single Bloomberg screen. (If it's a junk bond or orderline investment grade bond there might be a bunch of other things that you have to know that aren't on that Bloomberg screen however, but most of the time you can still say “Pricing this thing is basically math.”)[Patrick notes: This ties into the banking business, among many other things. U.S. government bonds and bank deposits are “information insensitive”, meaning that no one transacting in them reasonably has an informational edge on anyone else transacting in them. That is an i"
