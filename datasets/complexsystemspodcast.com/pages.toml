title = "Bet on it: Zvi Mowshowitz on professional gambling, trading, and AI futures"
description = "The epistemology of wagering, in markets formal, informal, and metaphorical."
full_description = "Bet on it: Zvi Mowshowitz on professional gambling, trading, and AI futures Patrick McKenzie Aug 8th, 2024 The epistemology of wagering, in markets formal, informal, and metaphorical. This week I interviewed Zvi Mowshowitz, who I Internet-met 30+ years ago in middle school then became acquainted with for real through his recent public intellectualism on covid. We talked about his interesting career path through Magic, professional gambling, and equities trading, which are very different but rhyme in important ways.[Patrick notes: I add commentary to the transcript using this convention. This is, necessarily, after the conversation and in my personal capacity. As always, nothing you read in my personal spaces is necessarily endorsed by other organizations, including Call The Shots, Inc., a 501c3 that I ran which is discussed (as VaccinateCA) below.] Sponsor: This podcast is sponsored by Check, the leading payroll infrastructure provider and pioneer of embedded payroll. Check makes it easy for any SaaS platform to build a payroll business, and already powers 60+ popular platforms. Head to checkhq.com/complex and tell them patio11 sent you.(00:00) Intro (00:16) Meet Zvi Mowshowitz (04:11) Trading and Magic: The Gathering (07:24) Professional sports gambling (11:58) Navigating the sportsbook market (22:33) Sponsor: Check (23:48) Financial markets vs. sports betting (34:02) Covid-19 early predictions (43:21) Covid-19 policy failures and blame (49:52) Vaccine rollout chaos (01:01:11) The importance of scaling effective strategies (01:14:46) AI predictions (01:23:58) Wrap (Many of the above section headers are available via Ctrl-F if you'd like to skip to that part in the transcript. Sadly, for technical reasons, I can't reliably hyperlink them everywhere this shows up.) TranscriptPatrick McKenzie: Hi everybody, my name is Patrick McKenzie, better known as Patio11 on the internets, and I'm here with my buddy Zvi Mowshowitz.Zvi Mowshowitz: Yup, also known as TheZvi.Patrick McKenzie: I don't know the quickest way to encapsulate you professionally for people who might not be familiar with your work – I would say public intellectual. Do you have anything that you would prefer over that?Zvi Mowshowitz: I think ‘public intellectual,’ ‘rogue journalist about AI’ at this point, largely – something like that.Patrick McKenzie: Currently you write a newsletter largely about roundups of what's been happening in the world of AI, but you've done a number of things over the years. I actually became aware of you when I was in middle school, 25+ years ago, because you were big on the Magic: the Gathering scene. So what happened in between Magic: the Gathering and today?[Patrick notes: It’s difficult to overstate how formative M:tG was during my middle school years. Some of my first writing for the Internet was analysis of the metagame for the Dojo (the community’s premier site for cognoscenti in the early days). On the Internet, no one knows you are a middle schooler. (As I’ve recounted previously, some middle schoolers use this to substantially more advantage than I did.) ]Zvi Mowshowitz: So many things. I played a lot of Magic: the Gathering in high school and college. Decided to become a professional; spent roughly 10 years in some combination of playing Magic and writing about Magic to pay the bills and keep going. I tried to join a startup developing a game. That didn't work out very well. I got into sports betting in various capacities for a while; after that I tried to found a personalized medicine startup called MetaMed which lasted a few years and got reasonably far, but ended up not having good product-market fit, basically – and we didn't understand marketing – and it didn't work out. Then I joined Jane Street Capital. Then I did a year or so of crypto trading. Then COVID happened: I did a combination of making my own game, sort of in the style of Magic, which didn't ultimately work out, and I started spending a lot of time worrying about COVID and thinking about COVID and analyzing COVID. I realized I might as well share this information with other people; I have a blog, I've written about rationality style stuff on that blog for a while, so I started writing COVID posts starting (I think) sometime in February 2020. That turned into weekly updates. Suddenly I realized there were hundreds of people who were like, “I really depend on your weekly updates to not have to otherwise think about COVID so much,” and so I kept going; one thing led to another.When COVID was winding down and I had just written my last COVID post, entitled “Your Best Possible Situation” – which is that you get to stop writing these posts and go back to your life – I jokingly said weekly COVID posts should be replaced with weekly AI posts because there was a lot happening.Then everyone said, “yeah, yeah, absolutely, yeah, you gotta do this!” [Patrick notes: My Internet buddy Visa keeps a collection “Joke about the outcomes you want.” There is a corollary to this, which is: do not joke about outcomes you don’t want. Having seen how self-deprecation gets rewarded in the world for a few decades and then how rapidly response changes when one simply stops doing it, I would flag this as being far deeper wisdom than people generally appreciate. (Well, I mostly stopped doing it.)] Zvi Mowshowitz: I was just thinking to myself, “oh no… I, I guess.” I tried it, and it got a very positive reception. One thing led to another, and now this is my day – all day, all the time.Patrick McKenzie: The best possible form of audience capture is when the audience says, “we think you're actually good at something, we'd like you to continue doing that for the next couple of years” – something that's pro social and actually useful for the world.[Patrick notes: The less salubrious form of audience capture is when the audience uses your output for a form of wireheading which is against their interests to consume. You, as a producer, then get awarded for wireheading them harder and infecting more people with the memes that have adversely impacted the original audience. Eventually, this results in being the intellectual equivalent of PepsiCo, with you doingincreasingly elaborate features of chemical engineering, impossible in nature, while running a world-spanning highly optimize marketing operation. This stunning edifice of intellectual effort will be in the service of killing your customer base just slowly enough to be described as not intentionally killing your customer base.…Well that got dark, but it is important.] Zvi Mowshowitz: The thing is, I think it's super important. I've been a worrier in one form or another about existential risk from AI since about 2007 (or something like that) – well before any of these current things were happening. This has not come to me recently.Suddenly AI is moving forward much quicker; a lot of things are happening and a lot of decisions are getting made. Helping people understand that, and helping people think better about artificial intelligence in all these different ways – and be able to do that faster (even though I write a metric ton of words that I expect people to mostly pick and choose from unless they want to go into the weeds) – a lot of people say they found it really helpful. It has allowed me to speak directly on issues I feel matter to people at major labs, people who are in national security, people who potentially help shape the way things go. I'm really excited to keep doing that, even as it completely overwhelms every hour of every day.Trading and Magic: The GatheringPatrick McKenzie: So I think we'll return to AI in a moment, but to go back into the mist of history, you've done three somewhat different, somewhat similar things that broadly look a little bit like trading. (I suppose Magic might look like trading in some ways too.)Zvi Mowshowitz: Magic started out largely also as trading, because everybody had a limited pool of cards and there wasn't a good, strong marketplace – and we were all kids so we didn't have the money to just buy everything we wanted, we had to acquire them through opening packs and trading. So trading was a substantial portion of that, and I kind of didn't like it. It was very much, you spend a lot of time trying to find people who will give you a reasonable deal – then when you know more than someone else and you can take advantage of them, you don't want to because you feel bad about ripping off a person in front of you, especially because it's often a kid.You were basically in this world where you were trading to try and get the right basket of goods that you wanted, but you never really got value from it. Occasionally you'd be able to get some value, and feel good about it because you were giving them what they wanted – and that was a service, and you were organizing and providing – but mostly it was just trying to not be cheated all day and making sure that the trades were fair. That just got very exhausting, and after a while I was just like “I don't have time for this.” I got enough money that I could afford just to start buying my cards, and that was a great relief.But trading has always been fascinating to me – as a game, as a competition, as an intellectual exercise, as a thing that I believe makes the world a much better place by distributing resources properly and allowing people to figure out what matters and all that.Patrick McKenzie: I think many people who work in finance in some capacity, or in the markets, or doing “formal trading” – or even high stakes negotiation, etc. – got their start on things that society broadly does not believe are real, but which certainly felt real to us in the moment.People on RuneScape with the “I can't believe it's not stock market,” – a crippled stock market, but a stock market – the World of Warcraft Auction House systems, Magic: the Gathering cards, etc. Some of them have had longevity into our adult lives, but the lessons people took from those various things have definitely echoed in real institutions over the years.Zvi Mowshowitz: Absolutely, it makes you feel comfortable with it, and it makes you appreciate it. The Magic dealers will take 30% of the transaction roundtrip, something like that. If you want to sell your cards to them, and then buy others, if you don't have the cards they specifically want, they will pay you almost nothing – and yet, those Magic dealers are providing an insanely valuable service, without which my life would have been a living hell.I would have had to go around individual players, trying to engage in barter style transactions all the time. That was fun when I was 14, and it was not fun when I was 24. Then I get into other markets, some of which are more clearly zero-sum and competitive, and some of which are clearly productive and useful.I just found the whole thing fascinating. It's a contest of trying to figure stuff out and learn about the world, and it's a fire that teaches you probability and statistics, various forms of psychology, and strategy, and so many other things.Professional sports gamblingPatrick McKenzie: We were talking earlier about – a hole in my financial knowledge is about sportsbooks – but you did that professionally for a while.Can you tell the audience a little about what being a professional sports gambler looks like?[Patrick notes: I have a complicated relationship with gambling. I’m not opposed to it, per se, and have been known to compensate independent providers of entertainment services on a probabilistic basis via e.g. playing at the same poker table as them. However, I think we’ve done a disservice to the broader community by making gambling hyperaccessible. There was societal value in making it something you had to get on a bus to do and in putting some friction between your bank account and the craps table, even if that friction was just walking from the table to the conveniently situated ATM. Now with everything on your phones, the marginal player is not just betting against the house, they’re betting their self-control will exceed the ability to provoke action of the best product and marketing teams given billion dollar budgets. Most will lose that metaphorical bet, and then go on to lose the real bets.And on the gripping hand, at least we have deep-seated societal antibodies against this when we call it a sportsbook, in a way we don’t when the gambling app on your phone wears the clothes of a responsible financial institution.Anyhow, qualms disclosed, the reason I wanted to talk with Zvi about his sports betting career is because it demonstrates some concepts relevant to more formal markets.] Zvi Mowshowitz: Yeah, so being a professional sports gambler… first of all, it's one of those jobs where you choose where you want to draw your attention, where you want to pay attention to, where you want to focus on, what attacks you want to make.The great advantage of being a sports bettor is the great advantage of any trader, which is that you always have the option to do nothing. The house has the edge, and the house will ultimately almost always win, or else they wouldn't be a house.[Patrick notes: Even people whose job is capital allocation will necessarily not place a bet in 99.999%+ of opportunities available to them. This isn’t necessarily expressing a negative point of view on the opportunities not chose. Partly, it’s because search/evaluation/execution costs are non-zero. Partly, it is because you are likely capital constrained in some fashion and so don’t want to pick merely positive bets, you want to pick the best positive bets. This is also why galactically sized pools of capital tend to indexing over active management over time: if you no longer are capital constrained, then you just want to buy all of the positive bets at a minimum of search/evaluation/execution cost.]Zvi Mowshowitz: But if you are a smart gambler trying to win, your great advantage is you can look at 100 markets a day; of those 100 markets, 97 of them, you will not find anything that you find interesting, potentially, if you're looking at one sportsbook in isolation. You can just not trade on those at all – that's totally fine. Then you find the one big mistake they made, and you exploit it, and you also find two other places where you think they may have made a mistake, where you can supplement, and you tune in on that – then you can still make a lot of money.The art of sports betting from the bettor’s perspective is a combination of many skills: you need to figure out how to watch sports, how to analyze sports, build a model of the sport on both a fundamental level – which teams are good, what's likely the outcome of the basic situation – and also… One of the things I specialized in was derivatives, essentially: if the home team is a two-to-one favorite, and on average, it's going to be 42.5 points in this NFL game, how many points will the home team over-under be? And what are the odds on that? I speciali"
