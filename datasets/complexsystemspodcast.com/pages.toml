I've run a few software companies, ran the U.S.'s vaccine location information infrastructure for a while (long story), and have written extensively on the"""
full_description = '''About We live in a world where our civilization and daily lives depend upon institutions, infrastructure, and technological substrates that are complicated but not unknowable.I've run a few software companies, ran the U.S.'s vaccine location information infrastructure for a while (long story), and have written extensively on the software business, financial infrastructure, and similar.Over the years, I've met many other people who share my interest in systems thinking. We are frequently frustrated about the level of discourse. "Everything is broken!", "That's totally random!", "Late stage capitalism!", etc.In this podcast, I interview people who have built things and are experts in them. We share the warts-and-all stories of how systems and institutions work. Some portion of the explanation is about physical and technical reality. Some part is a bit squishier, about incentives, culture, and history. Hopefully you'll find it interesting and useful.Obligatory disclaimers: I'm a (tiny) angel investor. I previously worked at, and am still an advisor to, Stripe. Everything I say in my personal spaces is my own opinion, and many not be endorsed by other organizations I am affiliated with, or have been affiliated with.'''
