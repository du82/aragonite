full_description = '''Reporting on tech with Kelsey Piper Patrick McKenzie Jul 25th, 2024 Kelsey and Patrick discuss the sometimes frosty relationship between tech and the reporters that cover it. Kelsey Piper, my favorite tech journalist by a country mile, joined me to share our perspectives on tech journalism. We also discussed some of her recent reporting, and the social role of equity in the tech industry.[Patrick notes: I add commentary to transcripts, set out from the rest of the text in this fashion.A disclaimer at the top: it is extremely relevant to this topic that I once worked in a tech company PR department. Neither Stripe, nor anyone else I've been associated with, necessarily endorses what I say in my own spaces.][Patrick notes: You're going to fairly frequently observe that I retreat from the object level, discussing particular practices at OpenAI, to the meta level, how equity works in the tech industry. Partly this is because I have an enormous regard for OpenAI and have friends there. Partly this is because the general treatment of workers and equity in tech is far more important than any particular set of decisions at any company. And partly it is because Silicon Valley is a small place, and in that small place, I am conflicted up the wazoo.]Sponsor: This podcast is sponsored by Check, the leading payroll infrastructure provider and pioneer of embedded payroll. Check makes it easy for any SaaS platform to build a payroll business, and already powers 60+ popular platforms. Head to checkhq.com/complex and tell them patio11 sent you.–Timestamps:(00:00) Intro(00:28) Kelsey Piper's journey into tech journalism(01:34) Early reporting (03:16) How Kelsey covers OpenAI(05:27) Understanding equity in the tech industry(11:29) Tender offers and employee equity(20:00) Dangerous Professional: employee edition(28:46) The frosty relationship between tech and media(35:44) Editorial policies and tech reporting(37:28) Media relations in the modern tech industry(38:35) Historical media practices and PR strategies(40:48) Challenges in modern journalism(44:48) VaccinateCA(56:12) Reflections on Effective Altruism and ethics(01:03:52) The role of Twitter in modern coordination(01:05:40) Final thoughtsTranscriptPatrick McKenzie: Hey everyone. I'm Patrick McKenzie, better known as patio11 on the internets, and I'm here with Kelsey Piper.Kelsey Piper: And I'm Kelsey Piper, I'm a reporter for Vox's Future Perfect. I write about tech, science, people trying to get stuff done. Patrick McKenzie: So, just for a little bit of the “how you ended up in this position in life” backstory, how do you find yourself working as a journalist in the tech industry?Kelsey Piper: I had a blog – actually, this is embarrassing – but I had a blog on Tumblr which I'd had since I was a teenager, and where I wrote about my objections to the social justice stuff that was popular on Tumblr at the time that I think became kind of the woke stuff that's popular in a lot of places now – from a kind of consequentialist, effective altruist inspired, “the point of doing stuff is to make the world better, and I don't like any of your activism unless there's a route by which things get better.” I met Dylan Matthews, who wrote for Vox and was apparently dissatisfied about how much of the stuff he was writing was based on what was in the news and not what mattered the most – and who'd gotten funding for a new section at Vox that was supposed to be, because it was grant funded, less about audience and more about writing about whatever matters the most. I was like, “that's so cool, I'm really glad you're doing that.” He said, “I like your blog, do you want to do it?” And I was like, yes! Yes, I want to do it!So I've been at Vox ever since – got to be six, seven years now. Initially we wrote a bunch about farmed animal welfare, which is really important if you think animal suffering is important; about pandemics, which we sounded a little crazy about in 2018 and then sounded really prescient about in 2020 and then now I think we sound like we're beating a dead horse when we talk about pandemics; and about AI, which is another one where, 2018, a lot of people were like, “why do you talk about AI? I don't see the relevance.” Now I think we're actually in a bit of a type of cycle where most people are saying stronger things about AI than I would endorse. Over that time, I think I got into writing about science and the process of science, and about what it takes to actually build things and get stuff done, because so often when I dug into something, the real story wasn't about whatever was on the label – it was about how we'd learned something important about the world, or how we'd been really wrong about something about the world, or about why people knew something, and had known it for a while, and nothing had actually happened. COVID was... full of that. Patrick McKenzie: I think we'll get into some concrete examples later, but we'll do the (I think) standard-in-journalism thing, where you say the most recent stuff first and then go back as we go.So full disclosure, I used to work in the comms department of a tech company, Stripe, which definitely does not necessarily endorse anything I say in my personal spaces. So we come from slightly different sides of the table in the sometimes synergistic, sometimes antagonistic supporting relationship that is the tech-focused news industry.Recently you’ve been doing some important reporting on a variety of subjects there. Could you give everyone a rundown on it?Kelsey Piper: Yeah. So I think I've been covering OpenAI, like I said, going back to 2018 when no one was taking AI seriously. That whole time they've been like, “we're not just a tech company, we're different because of the stakes of what we're trying to do. We're trying to build something that's going to transform the whole world, and we have this hybrid for-profit/non-profit structure so that we can make sure that the results of this huge thing we're going to try and pull off benefit everybody.”A lot of people in journalism, certainly who I talked to, took this as boilerplate tech company hype. A very common reaction you get is like, “uh huh, the crypto people also say they're going to replace the whole global financial system. You have to say that to raise $80 billion. It doesn't mean anything.”But I took and still take OpenAI pretty seriously about that, and I think that because of that, I was scrutinizing them even more closely than everybody else in tech – although also what I ended up running into I think would be an objectionable practice at literally any tech company.When a person left OpenAI: Every employee that I spoke to who left OpenAI in the last seven or eight years, they would be told that their vested equity in the company – which is a slightly weird kind of equity because of this hybrid for-profit/nonprofit thing, it's called a profit participation unit. It was treated in compensation agreements basically the same as every tech company treats equity. That's how everybody involved was encouraged to think about it – it had vested, and after it vested people assume it's yours.But when they left, they were told their units would be canceled unless they signed this very restrictive agreement, which included non-disparagement provisions (you can't criticize the company) which was lifelong and which also included a non-disclosure agreement which encompassed the agreement itself.Not only could you never criticize OpenAI in any way, you could also never tell anybody that you had agreements which might make you unable to criticize OpenAI. Then it had some non-interference provisions that were pretty broad and overall just quite restrictive. Especially for some people who'd signed it seven years ago when OpenAI was a tiny nonprofit – [it’s] a difficult position to be in seven years down the road where you've agreed to never criticize this company that has changed really dramatically from the one you left.Patrick McKenzie: A thing I've learned over my years in the tech industry is that even people who notionally have a supermajority of their net worth in equity often don't really understand how it works.How about we give people the easy-to-understand version for what vesting, etc., means?Kelsey Piper: Oh, yeah, absolutely.Patrick McKenzie: Mind if I monologue for a moment? Kelsey Piper: Go!Patrick McKenzie: So without reference to any specific company, here’s a very common pattern in the tech industry: you're hired and you're given a promise for compensation in return for the supermajority of your professional efforts going to your new employer for an undefined portion period in the future.[Patrick notes: An informal term of most employment contracts in tech, and a formal term in many, is that you not do professional things which would cause you to take your eye off the ball. This exists in uneasy tension with a cultural practice in many places of celebrating side projects. As someone who ended up in his quirky position in life largely thanks to being able to convince a Japanese megacorp to tolerate running a commercial side project for a few years, I have some thoughts on that topic. Perhaps surprisingly, they include "100% focus is a lot more valuable than 98% focus and if a company wants to buy the former they should be able to do that, assuming they are extremely upfront about that fact and pay accordingly."]At the point you're hired, you'll be told what your salary is, and the company is basically always good for that salary to the dollar. Essentially everyone in capitalism understands that after a dollar transfers to your bank account, it does not ever go back to the company. That would be a wildly crazy thing to happen.[Patrick notes: It is, unfortunately, not the case that every failing startup has made good on its last two weeks of payroll. This is the one monetary lapse that can cause me to think less of a startup founder. Payroll is a sacred trust, which I say not because I'm sponsored by a payroll company but because employees rely on it and also it's a failure mode of employer/employee relationships so well-established that the Bible warns you against it. (James 5:4)In modern startup practice, when I hear "A company was so #*$(#ed that it missed payroll", my mind goes immediately to "... was it criminal fraud?"]Patrick McKenzie: Equity is a little bit different in that the intuition for it is that the company would like you to earn your equity over time. The actual legal code that causes this is a little bit complicated – essentially you're given it all up front, but the company typically has a repurchase right for most of it and they lose that right over time.So you gain true, durable ownership of your equity over time, and that process is called vesting. Without reference to any particular schedule, a very common thing in the tech industry is what's called “four-year vesting with a one year cliff,” which means you durably earn no equity until your 365th day, at which point you immediately get one quarter of it. Then you earn the rest ratably on a monthly basis over the next 36 months. That isn't the only equity that you'll probably own at the company – there are things like refresher grants, etc. – but the important intuition to come away with is that people in tech have arrived, through this complex social and legal iterated game that's been connected over decades, at understanding vested equity to be pretty close to salary that has arrived in your bank account.After equity is vested, you expect to keep it and to be able to participate in the upside from that portion forth. So many of the labor issues in tech around equity are about firming out some of the edges around that broadly-held intuition that vested equity belongs to the employee in the same way that their house belongs to the employee.Kelsey Piper: One example of that (which you probably know more about than me, but): there was a discussion when I was actually a young person working in tech, of companies where the equity took the form of options to purchase the company's stock, and if you left, you had to decide immediately whether to exercise those options. It was often more money than people had, and they didn't have enough time to, say, go to a bank and secure a loan.There was a lot of discussion about extending the exercise window, which is maybe one example of firming up an employee's access to the equity they earned in a job.Patrick McKenzie: If you go back to the mist of prehistory, equity was just this nice thing that companies did that was a kicker on top of your salary.[Patrick notes: Even in the midst of prehistory, it was used as an inducement to get employees to accept wages which were below prevailing wages for their skill sets. It also essentially functions as a funding mechanism for startups; they essentially lever their equity investments from professional investors with a matching sweat contribution from non-professional investors in return for common equity grants.]Patrick McKenzie: That has very materially changed over the last couple of years. Many employment agreements are structured such that the majority of compensation will be equity in the success case for the company – and if you're not joining a company expecting them to hit the success case, there's a big question of, “what is anyone in this conversation doing?” It's become more important – it's become more codified, more, let's say, labor-friendly over the years. It was a respectable point of view for a while among, say, venture capitalists (who also have equity in the company, which they purchased with money rather than with the sweat of their brow) that it's a good thing when an employee leaves the company and does not successfully exercise their options. That essentially returns that value to all the other equity holders of the company, including the founders, current employees, future employees, and not incidentally, the venture capitalists. And – incredibly to me – people put this in writing on their website, in places where they expected tech employees to read it, and thought tech employees should endorse this perspective.[Patrick notes: I am subtweeting an essay from a partner at a16z which argues that when ex-employees do not have their vested equity canceled that that dilutes current employees (and other equity holders like e.g. venture capitalists, though this part is unsaid) and, therefore, it is a good thing when ex-employees have their equity canceled. That is a robust and absolutely fair paraphrase of the argument.]Patrick McKenzie: I'm as capitalist as the day is long. I will probably purchase more months of employee work than I will deliver as an employee over the course of my career by a pretty fair margin – but I view it as a moral failing in the tech industry every time an employee doesn't get the value of their vested equity.I think that we as an industry should be as scandalized – as this must be fixed '''
