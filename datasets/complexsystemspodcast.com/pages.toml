["https://complexsystemspodcast.com/episodes/electricity-grids-travis-dauwalter"]
title = "Power plays: grid economics and engineering, with Travis Dauwalter"
description = "Electricity grids: how they work, who operates them, and how they function as markets."
full_description = "Power plays: grid economics and engineering, with Travis Dauwalter Patrick McKenzie Feb 6th, 2025 Electricity grids: how they work, who operates them, and how they function as markets. This week I'm joined by Travis Dauwalter. We chatted about electricity grids, across a range of abstractions, like: How the frequency of current on a wire showed operators relative demand/supply conditions before we had computer networks to transfer that information. Why building power transmission infrastructure requires thirty year bets on rates of family formation. What the AI boom means for data center buildouts, and what that implies for energy generation.This pairs well with previous episodes with Casey Handmer (on solar economics) and Austin Vernon (on fracking).SponsorsCheck is the leading payroll infrastructure provider and pioneer of embedded payroll. Check makes it easy for any SaaS platform to build a payroll business, and already powers 60+ popular platforms. Head to checkhq.com/complex and tell them patio11 sent you.Timestamps(00:00) Intro (00:28) Understanding the energy grid (02:22) The complexity of supply and demand (05:43) Regional differences in energy grids (08:16) Seasonal and daily energy demand (11:22) Renewable energy and storage solutions (17:17) Sponsor: Check (18:29) Renewable energy and storage solutions (continued) (24:07) Demand response and time of use rates (34:08) Bitcoin mining and energy economics (39:29) Exploring behind the meter arrangements (40:44) Transmission line challenges and innovations (45:51) Dynamic line rating and grid efficiency (50:58) Data centers and energy demand (58:33) Interconnection queue and grid security (01:03:38) Understanding the US grid structure (01:09:46) Wrap TranscriptPatrick: Hi everybody, and welcome to Complex Systems. I'm here with my buddy, Travis Dauwalter.Travis: Great to be here. Thank you very much for having me on, Patrick. I'm really excited about the conversation ahead.Patrick: Thanks very much. We're going to be talking about the energy grid as an institution and our engineering artifact today. You've been in energy for a very long time, I think.Travis: Yeah, I've been thinking deeply about our electricity grid here in the US for the last 15 years or so. Every time I peel back another layer, I'm shocked at how complicated it indeed is. So it feels like a fitting topic for this podcast.Understanding the energy gridPatrick: I feel like I'm something of a talented amateur on this subject—perhaps less on the talent but more on the amateur—but it astounds me that we managed to put it together prior to one, the physical instantiation of any networks to coordinate the installation of the grid. [Patrick notes: One of these days I will achieve victory over the childhood impulse to self-minimize, but today is not that day. If you do not already have this impulse, please do not adopt it from me. Many people of good will will be convinced that, if you are not your best advocate, you have an informational advantage over them and therefore your minimization is the ceiling for your actual ability/etc, and of course you may be overstating your abilities, since people do that all the time. Many people of ill will will say that you claimed to be the thing you expressly disclaimed.]But two, the sort of thinking about formalized thinking of graph theory and networks and similar, which would seem to me to be necessary to string the wires together and have all the math balance. But apparently prior generations were willing to tape things together, deal with the fires, and then eventually get us into some metastable state.Travis: Yeah, that's kind of how it flowed as well. It got assembled off of choices made here and there. Some of them were stickier than others. We can dig into all of that, but what you're saying really resonates with me in terms of just the sheer physical complexity of the grid.If I'm looking at a light switch in this room that I'm in right now, and if I were to walk over and flick it on and off, I would know with certainty that light in this room is going to toggle on and off, and there's a wire going from this light switch all the way back to some generating plant, maybe hundreds of miles away. All of our devices, anything plugged in is in some way connected topologically to this grid. It's really amazing.The complexity of supply and demandPatrick: The thing that blows my mind even more than the geographical implications and that there physically must be a path hundreds of miles long between you and some physical, chemical, electromagnetic generation apparatus—there's also something that feels a little bit like calculus and a little bit like physics going on. The instantaneous draw on the grid must exactly match the instantaneous production of the grid. As able to, as the universe is capable of perceiving zero difference between those two things, where the actual physical processes involved are not such that one can scale them arbitrarily quickly up or down.So there is some amount of slack in the system, and implicitly, there is some sort of demand and supply matching apparatus going on, which does possibly humanity's most efficient job of instantaneous demand and supply matching. What is that apparatus?Travis: Yeah, I totally agree with you. It's remarkable that you can turn on that switch with certainty, and that there is this supply and demand match that's happening, not just once a day checking in to make sure we're matching up, but at the second-by-second level.What ends up happening is, with all the puts and takes of people turning load on in the grid and then taking load off of the grid, it induces incremental change in the frequency of the grid in that local topology. [Patrick notes: You can round these jargon words to: “put” is when you produce electricity and add it to the grid, “take” is when you remove electricity from the grid to consume (or store). I would ordinarily have prompted Travis for this, but he was on a roll, and I didn’t want to interrupt.] The generators can observe that minor dip in frequency or minor increase in frequency, and they're effectively responding to that. The tolerance band that you're talking about is very narrow but centered on 60 hertz, which is what our grid operates on.If it starts getting fast, if the frequency starts getting a little fast, that means that we've got an abundant supply compared to demand. That's a signal to generators to start turning things down. And if we're seeing the frequency droop a little, then the supply needs to step in and start injecting a bit more power into the grid I totally get what you're saying. It does feel impossible to orchestrate the millions of different users that are on this grid in that way, but there's this really tidy data point that you can observe happening continuously and you're keeping it within that tolerance band around 60 hertz.Patrick: I suppose this is one of the original operations research problems where in the classical model of operations research modeling a factory, you'd be able to perceive changes in demand in the market in the flow of orders at the factory or changing stock issues at various workstations. And here you are literally using an oscilloscope on the wire and attempting to measure the frequency of the electromagnetic signal.Regional Differences in Energy GridTravis: Yeah, and the alternating current that we operate most of our grid on is ready equipped for that sort of observation so that we can make those fine adjustments. There's also, depending on the market—and we can dig into this a bit more about how regionally we've made different choices across the United States on how to structure those different grids—sometimes generating units that are just sitting there and providing frequency response services for the grid. Their whole job is to just stare very intently at that oscilloscope and make sure that we're doing a good job of keeping within those bands.Those different policy decisions that were made by the different organizations that oversee our grid have been really effective in keeping the grid as stable as it is. Think about the last time you had a grid outage. Depending on location, but for the most part, across most of America, it's really rare for you to have a grid outage. And if you do, it's often just a flicker. And then the grid is finding its way to its healthy 60 Hertz frequency.Part of that is the utilities have a lot of arrows in their quiver to help mitigate this supply demand mismatch and ensure that we keep within tolerances. They'll just start running their playbook—first try this, if still having problems then try that—and they just move through the cascade of activities. It will culminate in rolling blackouts if none of them work, but there's a lot of opportunities before you get to that point to cure the problem. They take full advantage of it as they should. We've come to really expect power to just be available whenever we want it. It's almost a feature of living in the modern era, and we have very little patience for when the grid goes down.Patrick: Yeah, I think the pervasive availability of power along with bandwidth (increasingly), water, et cetera—they're an infrastructural substrate that the rest of society kind of leans on in a load-bearing fashion for doing all the other things that we do with our lives. And so, there's always a background process in my mind when I'm flicking something: wow, this is amazing. And amazing that the vast majority of users never have to think of how amazing it is or to plan their lives around it.I understand that one of the things that both grid operators and power producers do is to plan around variations in the clock and variations in, I suppose, the annual cycle and the business cycle in terms of power demand. Do you want to sketch out what those curves look like for people who might not have looked at them before?[Patrick notes: Many grid operators will make the graphs and forecasts available in real time through a web application these days. Tokyo’s is great, though you might fight through a bit of localization engineering to wonder why it quotes things in units of x10 MW. I’ll reproduce a similar graph from Illinois inline so you can see the flavor. Note the daily peak/trough cycle, substantial intra-day variation, and the fact that an alien carefully looking at this data might say “Does your culture do something strange on December 25th? Like, an annual commemorative LLM training run?”]]Seasonal and daily energy demandTravis: Yeah, sure. Let's talk first about seasonality and then we can zoom in onto what's happening hour by hour over the course of a day. It depends a bit on your location—I live in Atlanta, Georgia, for instance, and it's really hot and humid in the summer. Generally speaking, Georgia Power has higher loads that they're facing in the summer and in the winter. We tend to have pretty mild winters here, with the exception of a pretty big snowstorm that came in a couple of weeks ago.You might see something like a double peak in seasonality in places like the Northeast where there's high energy consumption for air conditioning loads, but then in the winter there's maybe not everyone has gas-fired furnaces, so there's higher electricity consumption in the winter as well as they're trying to heat their homes and their spaces. And you can contrast that with a place like San Diego, notorious for having really lovely weather throughout the year. From a seasonality standpoint, they're going to have less amplitude to that annual cycle.As we zoom in a little bit to shorter timeframes over the course of a day, put yourself in the shoes of your own energy usage. At midnight, many of us are in bed and the house is kind of shut down and you're not using a lot of electricity. Then you wake up and maybe go down and turn on your coffee maker and throw something in the microwave or turn on your oven, turn up the heat or turn on the air conditioning.So there's a peak in the morning where the energy consumption goes up as everyone is consuming, waking up and starting their day. There tends to be a leveling off, and that's largely because everyone is moving from their homes to their place of work. That place of work on an energy usage per person basis is a little bit more efficient. Think about a big commercial building with really efficient air conditioning units—the unit amount of energy you need to cool yourself when you're in a commercial building is lower than when you're trying to cool yourself in your home.[Patrick notes: You’d also see this if society had graphs which broke rent/mortgage expenses down on a per minute level attributed to people based on what building they were physically in. You pay more rent per minute at home than your employer does on your behalf per minute you’re in an office, mostly due to physical and temporal density and utilization.Mentioning this because your employer’s (or employer’s landlord’s) professional skill with optimization is mentioned below, and that skill is not necessary to achieve relative efficiency over your place of abode.]The spike happens again as everyone's leaving work and returning to their homes and starting their evenings, turning on televisions and doing their cooking and reengaging with their HVAC system. Then it'll taper off as everyone goes to bed and the cycle repeats. That's sort of what it looks like on a day-to-day basis. And then that little waveform I just described kind of flows up or down as we move through the different seasons of the year.Renewable energy and storage solutionsPatrick: So one of the things that fascinates me about the economics of this is that, for most grids, there is intentionally a mix of different power generation modalities to hit various points along that waveform. There's a great amount of physical capital in the world that is deployed at various points. At midnight, for example, solar generation—unless you're in a very rare location—you will not be getting sun. But our natural desire for offtake is lower at midnight.Then solar comes on during the day and towards the peaks, there are higher marginal cost or higher marginal nuisance generators such as—I believe the word is peaker plants—where you might be burning liquid natural gas. From a societal perspective many people would assume, okay, if we could make it 100 percent renewable energy use at some acceptable cost level, we would like to do that. But at certain margins that is cost prohibitive, and so we can cover those margins—and maybe those margins alone—with the use of the peaker plant and then intentionally keep the peaker plant offline for 80 percent of the time, 95 percent of the time, potentially even in some grids perpetually offline except in the case of emergency, which provides that sort of system-wide slack for the extremely disruptive tough to predict events.I lived in Japan for 20 years, and the only sustained in"
