title = "Energy economics and rocket science with Casey Handmer"
description = "Casey and I discuss solar energy economics, learning curves, the triumphs and foibles of the space industry, and more."
full_description = "Energy economics and rocket science with Casey Handmer Patrick McKenzie Aug 15th, 2024 Casey and I discuss solar energy economics, learning curves, the triumphs and foibles of the space industry, and more. I'm joined this week by my buddy Casey Handmer of Terraform Industries. The conversation starts with catching up non-specialists to the exciting revolution in solar energy which happened over the last 15 years (and continues to make almost incredible progress), and then touches on space, organizational design, and the moral case for increasing energy consumption.[Patrick notes: I add commentary to transcripts, set out from the rest of the text in this fashion.]Sponsor: This podcast is sponsored by Check, the leading payroll infrastructure provider and pioneer of embedded payroll. Check makes it easy for any SaaS platform to build a payroll business, and already powers 60+ popular platforms. Head to checkhq.com/complex and tell them patio11 sent you.Timestamps(00:00) Intro (00:25) Casey’s startup: Terraform Industries (00:48) The rise of solar power (02:19) Solar power vs. traditional energy sources (05:18) Economic and industrial impacts of solar (09:02) Challenges in aviation and energy (19:39) The role of policy in clean energy (22:30) Sponsor: Check (23:41) Casey’s experience at NASA and JPL (34:17) SpaceX, Elon Musk and the US private space actors (44:05) Solving problems and workplace politics (45:10) Spreadsheets create their own reality, film at eleven (48:35) Organizational challenges at NASA (49:40) Challenges of innovation in bureaucracies (51:07) The role of NASA and government in innovation (55:25) The housing theory of everything (58:36) Empowering employees for success (01:02:41) Terraform Industries’ vision (01:07:28) The future of energy and carbon neutrality (01:10:52) The importance of hydrocarbons in aviation (01:15:47) Challenges with hydrogen as a fuel (01:18:21) Development of synthetic fertilizers (01:21:54) Environmental considerations on industrial progress (01:22:55) Wrap (Many of the above section headers are available via Ctrl-F if you'd like to skip to that part in the transcript. Sadly, for technical reasons, I can't reliably hyperlink them everywhere this shows up.)TranscriptPatrick: Hi everybody, I'm Patrick McKenzie, better known as Patio11 on the internets, and I'm here with my buddy Casey Handmer.Casey: Hi. So great to be here.Patrick: Thanks very much for coming. So, Casey, what are you doing these days?Casey’s startup: Terraform IndustriesCasey: These days I'm mostly preoccupied with running my startup Terraform Industries, where we're making cheap, green synthetic natural gas from sunlight and air.The rise of solar powerPatrick: You've had a blog for a number of years and have written extensively on solar power, which is a topic that I know relatively little about. And so I brought you on the show to talk more and help more people “get solar pilled.” Let's start with the obvious fact: we are installing an absolutely gobsmacking amount of solar power as a result of the cost versus benefit curve of it, bending in an extremely favorable way over the last couple of years. What just happened, and why?Casey: If you look at the data, going back to the 1970s, solar has followed a pretty good learning rate, even since then. But obviously, exponentials are exponentials, and progress accumulates. I remember when I first tuned into this 10 or 12 years ago thinking, “wow, quite a lot of solar [has gotten] installed.”For reference, last year I think we had about 460-something gigawatts globally, which is very close to a one megawatt array per minute being put down. That seems like a large number right now, but I can assure you all in 5 or 10 years time, it'd be like, “Wow, that's tiny. That's like less than a week's worth of installation to put down 500 gigawatts.” At this level, we actually have to start thinking about deployment in terms of overall land use compared to things like forestry and agriculture and grazing of animals — just in terms of the quantities of land consumed and the scale of the industrial machine required to perform those operations. This is no longer, you know, a couple of people running around on a rooftop putting in some solar panels so you can feel good about yourself in summer. This is actually kind of a major project to drastically upgrade the energy capacity of our entire civilization, which I find super exciting. I find it super compelling.[Patrick notes: Solar and AI were two technologies that were “just around the corner” for several decades, with that being a Lucy-takes-the-football-from-Charlie-Brown story frequently enough, that I was mildly surprised when they actually happened.When I graduated university in 2004 prices were approximately $4.35 per watt. That was a 5X improvement over the course of my life, and forecasting another 5X improvement didn’t seem too compelling. They’ve fallen by a factor of twenty and are still dropping.]Solar power vs. traditional energy sourcesPatrick: The thing that's often missed about solar panels when you put them on the ground is that they are hundreds to thousands of times more energetically and economically productive than farming, which is typically how we dispose of large amounts of land in order to create energy that we can use.And of course, 200 years ago, most of the energy we consumed was in the form of food. Today it's about 1 percent or less. We kind of have grown the non-digestive part of our energy economy quite substantially.But in some ways, that growth is limited by the scarcity of reduced chemicals like hydrocarbons and coal and so on in the crust, so we're going to have to go back to something like plants. But the nice thing about silicon, solar photovoltaics, and similar technologies is that the productivity is hundreds to thousands of times higher. So you can actually support the next step of our major civilization development on much less land and with much less intense demands, you know — irrigation, fertilizers, pesticides, etc. — than farming requires.Patrick: It's sort of fortunate for humanity that we kind of co-grew up with a number of plants that have photosynthesis as one thing they do. Unfortunately, since plants only do photosynthesis as one thing they do, versus like reproducing and resisting pests and blight (and similar), they're actually not that good at photosynthesis relative to an engineered system, and we can simply choose to engineer photosynthesis better. Casey: That’s right.Patrick: We've had photovoltaic cells for a very long time now as a technology. In startup land, we deal with exponential growth curves with respect to things like user adoption of the internet or various companies on it, etc. But I very rarely hear about hard physical technologies where there is an exponential curve sustained over decades in terms of actual price/performance of the physical artifact. Why has that happened in photovoltaic cells and has not happened in — I don't know — steel smelting?Casey: It kind of actually has, if we want to get super detailed here. The obvious comparison (or point of comparison) would be silicon chips, essentially Moore's law — similar technology. And actually solar itself turned a corner in about 2009 when the scale of the industry became so large that it became necessary to invest in solar photovoltaic specific silicon refineries rather than just consuming the seconds from the silicon chip industry. At that point the learning rate almost doubled, which is in some ways why a lot of the policy papers written in about 2010 have got their timelines wrong by a factor of 10. We're already at prices now that are at the very tail end of curves that went out to 2150 or 2200 that were written down 10 or 15 years ago, which is super exciting.Economic and industrial impacts of solar Casey: But actually just more generally, if we think about the development of mass production, and the learning rates and cumulative learning rates and so on, we've seen this over and over again. We've seen the cost of producing ships and planes and tanks in World War II drop exponentially by multiple orders of magnitude. We've seen the cost of mass producing automobiles under Henry Ford drop from something like $12,000 down to about $200 (in those days’ money), over the course of roughly 20 years of development of manufacturing technology. And actually just as far as metals go, I’m continually flabbergasted by how much bronze we find in burials in Europe from like 3,500 years ago, because in those days, the amount of bronze (which is mostly copper) required to make, say, a two- or three-pound sword would take the equivalent of, let's say, 20 to 100 human days of labor to create. Nowadays, the productivity of our economic system is such that you can generate that amount of copper with the equivalent of like three hours of labor, or something like that. Patrick: Textiles are another great example of that. Traditional garments used to sometimes embed 3,000 hours of human labor and now can be bought for, like, less than the price of a cheeseburger. And the actual physical artifacts you get, people like to poo-poo a lot on — “oh, t-shirts fall apart almost immediately these days,” — as if we didn't have to repair things made under traditional systems. But we can just pump so much out of industrial processes. (Ah, sorry, digression.)Casey: No, you're exactly correct. But of course, if we think of the extraordinary garments of the ancient past, actually, the fact that they consumed a lot of labor to produce was part of the point. It's kind of a way of honestly signaling that you have wealth and prestige, to create or commission works that require a lot of effort to produce. There are still things today which require decades of labor by many, many, many extremely talented, special, unusual, rare people. And that's kind of where you see modern day vanity projects kind of going, because it's more in the direction of rocket launch companies or private jets or fancy cars or flying cars or whatever the case may be.Patrick: Movie producing, I think probably falls into that, although with a compressed timeline, but effectively, you know, multiple hundreds of person-years of extremely specialized labor.Casey: Yeah, but movie producing mostly self-supports itself, right? As opposed to like a vanity product. Like I say, “vanity is a byproduct rather than the main purpose of Hollywood.”Patrick: True. Although I do think it's important to say, we've actually gotten much more effective at things like textile production. Even in the relatively recent past, the United States is young enough to still have a Navy that has relatively consistent records over the entire national run of history, which is not true of many older nations.And it used to be the case that there was a particular salary — I think it was like 20 present-day dollars in the 1800s — for employing a sailor in the Navy. And then the Navy also budgeted three months of salary for the outfit they were going to put the sailor in; one of the two outfits that they would requisition for him.[Patrick notes: I sometimes wonder at how things get stuck in my head, but “Oh yeah, enlisted sailors roughly halfway between the Revolutionary War and the Civil War got about $15 a month in wages.” is in the historical record. The industrial revolution brought the cost of a uniform from a month of wages to a week’s in only about 50 years. At the risk of stating the obvious, fabric is not a material component of the net worth of enlisted sailors in the modern era.] Patrick: Nobody in the modern world only owns two outfits anymore, and they certainly don't require three months of salary to buy. And that was for people near “the lowest possible rung of the Navy, swabbing decks, etc.” We are not making a conspicuous consumption of labor. We are not simply diverting rent into the industrial complex — although probably a little of that went on because nothing ever changes. But it was just like, “Oh, you know. Wool coats are expensive to make when you do it by hand,” and they get vastly less expensive in the wake of the Industrial Revolution.Casey: You're absolutely correct. Yeah. Completely.Challenges in aviation and energyPatrick: To push back a little bit about something you said, though: I do understand that between Kitty Hawk and World War II, we were able to industrialize creating airplanes as a process, and the implicit cost per airplane fell by orders of magnitude, but it doesn't seem like we've continued that over the course of the last couple of decades.The newest model, the Boeing-whatever, is a much better technical artifact than what came off the line in World War II, but costs many, many billions of dollars, where, if we had seen that curve continue, it would cost, like, car money and be about as effective as it is currently. What's the magic trick with solar that causes this exponential to just continue, and do we think we're approaching a plateau here in terms of price versus performance, or are there still multiple orders of magnitude to go?[Patrick notes: Boeing makes approximately $34 billion of revenue a year (pg 24) in commercial aviation, which is somewhere on the order of 150 planes. Military aircraft can be substantially more expensive (stealth bomber: ~$4 billion apiece in current dollars) and, due to quirks in how procurement works, the number quoted upfront is very rarely the price the taxpayer ends up paying once the program is delivered a few decades later.]Casey: Yeah, that's a great question. And you know, some of our friends are involved in speculating about the stagnation hypothesis. I think it's certainly true to say that in general aviation worldwide and also in the United States (which kind of led general aviation), a series of unfortunate policy choices essentially sucked the air out of the room, as far as continued innovation on general aviation aircraft — which I'm actually pretty upset about — but in many ways the key missing piece there is a mass producible turbine engine.In the case of the automotive industry, we figured out how to produce precision machined four- or six-cylinder engines for $5,000 or $10,000, including gearbox and so on. And we kind of almost have that technology in some cases with piston powered aircraft. But if you want a turbine, like a Pratt and Whitney PD six (roughly one megawatt turbine), this typical thing that was on a Cessna Caravan or something, you're talking like 1 to 2 million dollars for one of those new. You kind of substitute the mechanical engineering problem for a material science engineering problem, to machine or to produce these turbine components that are extremely strong and extremely performant and extremely light and extremely heat tolerant.If you ever have the opportunity, visit the Dodgers museum in Munich and have a look at the exhibition on aircraft engines from World War II, because it's just "
