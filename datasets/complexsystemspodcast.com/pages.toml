title = "The banking crisis, two years later"
description = "Patrick revisits 2023's bank runs now that a new report details how 22 banks nearly failed while regulators misdiagnosed the crisis"
full_description = '''The banking crisis, two years later Patrick McKenzie Jan 23rd, 2025 A look back on the banking crisis of March 2023 and its aftermath. This week I'm solo in the studio. Back in March 2023 I wrote Banking in Very Uncertain Times at Bits about Money, my newsletter about the intersection of finance and technological infrastructure. Today's episode is the author's commentary on that essay, with the benefit of two years of hindsight, and spelling out some of the things that I couldn't say at the time (and the rationale for why).I wanted the opportunity to do a bit of implicit meta-commentary on journalists, regulators, and randoms who write essays on the Internet. Some of us do keep score. It keeps me honest. (After action reports of e.g. regulators are linked below. Their honesty is... discussed in more detail, below.)SponsorsVanta automates security compliance and builds trust, helping companies streamline ISO, SOC 2, and AI framework certifications. Learn more at https://vanta.com/complexSupport proven charities that deliver measurable results and learn how to maximize your charitable impact with GiveWell. Go to givewell.org (and type in "Complex Systems" at checkout).Check is the leading payroll infrastructure provider and pioneer of embedded payroll. Check makes it easy for any SaaS platform to build a payroll business, and already powers 60+ popular platforms. Head to checkhq.com/complex and tell them patio11 sent you.Timestamps(00:00) Revisiting the March 2023 essay 'Banking in Uncertain Times' (01:47) The Fed's study (11:21) Why are banks failing? (14:41) A useful heuristic from bond math (18:05) Sponsors: Vanta | Check (21:00) Maturity transformation (29:54) Sponsor: GiveWell (30:42) Liquidity problems are the proximate cause of bank failures (33:43) Trying to forestall a banking crisis (40:16) Deposit insurance expansion (47:12) Deposit insurance has some legacy issues (52:04) What would happen if my bank were to go into receivership this weekend? (59:46) What should users of the banking system do? (01:04:09) Parting thoughts (01:05:08) Footnote TranscriptHi everyone, my name is Patrick McKenzie, better known as patio11 on the Internet. I sometimes get asked if I'm a journalist, and the answer is mostly no, because I don't break news. That's largely an intentional choice - partly because it's not where I've put my character points in getting good at things, and partly because it's simply not what I choose to do with my publications.For example, Bits About Money very intentionally almost never discusses anything happening uniquely this week. I try to write explainers about financial infrastructure - the cultural and technological underpinnings of why those complex systems fit together. But I don't usually ground those explanations in current events.[Patrick notes: As I’ve previously remarked to Byrne Hobart, a few of us finance-adjacent writers have different strategies here. Byrne and Matt Levine often ground their ~daily columns in the news of the day, without generally reporting that news, per se. I have even less connection than that. While I’m occasionally moved to write by a news cycle, I’d prefer if almost everything I wrote retains value over ten years, and news depreciates straight off a cliff.] My one exception is that I will occasionally cover current events when, given the nature of my beat, not covering the current event would itself be a very major decision.Journalists sometimes flatter themselves and say that journalism - breaking news - is writing the first draft of history. But I will say, as a writer who has immense regard for journalism, that the first draft of most things is often very bad in retrospect. In most cases, we don't treat the first draft as a product we're emotionally attached to.Let's examine my own work critically. I thought we could revisit some writing I did in 2023 during the early stages of the spring banking crisis and see how well it has held up given what we've learned over the intervening almost two years.The Federal Reserve StudyWhat specifically prompted this review was reading an academic article recently published by the New York Federal Reserve. It was technically written in May 2024, though revised in December 2024. The paper is Tracing Bank Runs in Real Time, authored by Marco Cipriani, Thomas M. Eisenbach, and Anna Kovner.This article is fascinating for two reasons. First, it presents an interesting approach to exploring bank run dynamics from a somewhat privileged point of view - they have access to data sources that are very difficult for outsiders to obtain. Second, it clarifies some uncertainties we had in March 2023 about what was actually happening.Let me read you the abstract:We use high-frequency interbank payments data to trace deposit flows from March 2023 and identify 22 banks that suffered a run significantly more than the two that failed, but fewer than the number with large negative stock returns. The runs were driven by a small number of large depositors and were correlated to weak balance sheet characteristics. However, we find evidence for the importance of coordination because run banks were disproportionately publicly traded and many banks with similarly bad fundamentals did not suffer a run. Banks survived the run by borrowing new funds and raising deposit rates, not by selling securities.For those who don't read the full article (though I encourage you to do so), they specifically traced FedWire payments and ACH transfers between banks. The fundamental nature of a deposit run is that people want their money out of the bank.Our image of deposit runs from "It's a Wonderful Life" - people sidling up to the teller window attempting to withdraw cash - is inaccurate. Most deposits stay within the banking system; they just flow to another bank. [Patrick notes: There is some risk that deposits could flow out of banks specifically to another place in the financial system and buy up non-deposit money-adjacent financial instruments, such as e.g. money market funds, but to do that, they do have to move in the financial system first, from e.g. a large regional bank to e.g. the money center bank which handles money movement on behalf of a large brokerage.]Statistical SignificanceThere's a particularly striking line in the paper: "We identified 22 run banks with significant net liquidity outflows on one of the days between March 9th and March 14th, exceeding five standard deviations of their historical net outflows."Five standard deviations - that's a heart-stopping number. For those who don't have statistics fresh in mind, let me break this down. In the universe of approximately 4,500 federally insured banks in the U.S. (plus about 4,500 credit unions), you should expect to see a five-standard-deviation outcome approximately once every 3.5 million observations, assuming normal distribution. This means you'd expect about four years between each bank experiencing a five-standard-deviation outflow.Having twenty-two banks experience five-standard-deviation outcomes in just five days is, well... while "catastrophic" might be too strong a word (we did weather the crisis), it's certainly a heart-stopping statistical anomaly.[Patrick notes: Intuitions about standard deviations often imply a normal distribution or a stochastic process which is uncorrelated between observations, and (very obviously) this assumption breaks down during banking crises and financial crises. A statement often made is that “all correlations go to one” in times of stress, though that is more an intuition than a claim about mathematics.] Real-Time UnderstandingA fascinating aspect of large distributed systems, even those run by people with arbitrarily large staffs of very intelligent people, is that sometimes you don't exactly understand what you're looking at in real time.For context, let's review the timeline:Silvergate bank announces voluntary dissolution on March 8th, 2023Silicon Valley Bank failed on March 10th, 2023Signature Bank failed on March 12th, 2023 (over the weekend)I wrote my essay "Banking in Very Uncertain Times" on March 14th, 2023To be precise about the timing, while we say colloquially that you wrote something as of a certain date, everything takes time to write. This was written over the weekend prior to the 14th but was ready for publication (or at least as ready as anything I write ever is) on the 14th when it started hitting people's inboxes.The specific dates matter here - March 10th was a Friday, the 11th and 12th were the weekend, the 13th was Monday, and this came out Tuesday as my explainer for people worried about what they were seeing in the news.[Patrick notes: The original essay, Banking in Very Uncertain Times, is of course available to read. I’ve taken the liberty of marking as inline commentary those portions of the below transcript which are substantially new. In the actual audio, I try to distinguish vocally or via explicit signposting (i.e. saying “Back to the essay”), but this is still something I’m working on.]Understanding Bank FailuresOver the last week, three U.S. banks have failed. More banks are under extreme stress. This stress is not new and was not unknown but is becoming common knowledge rapidly. We may be in the early stages of a banking crisis.Patrick comments: In my essay, I stated that three U.S. banks had failed. This requires some clarification, as officially only two banks had failed. "Fail" is a technical term in banking - it means your bank went bust and the FDIC needed to step in, invoke the deposit guarantee, and usually sell you to another bank over the weekend, in concert with your primary bank regulator (who's usually not the FDIC).[Patrick notes: The sequence of events is generally an order from your primary regulator that you cease operations followed by the FDIC swinging into action. Your regulator has prepped the FDIC to receive the call, during the mid stages of the process which begins “Hmm that’s odd”, proceeds through “We are very worried about you and you need to be concerned”, and ends with the U.S. having one bank less than previously.] Patrick comments: The third bank I referenced was Silvergate Bank - I affectionately called it the First National Bank of Crypto. Silvergate had wound up early in the week. What's the difference between a wind-up and a failure? You might say one is like the controlled demolition of a building versus the building just falling apart. Silvergate described their decision to wind down as voluntary at the time, though they've since characterized it as not entirely voluntary, alleging that banking regulators made demands incompatible with continuing operations. [Patrick notes: For much, much more on that subject, see Debanking (and Debunking?).]Disclaimers and ContextI included a bold disclaimer in the essay: "This situation is evolving very rapidly, and this essay will not. Please check the WSJ or Financial Times for updates on the fluid bits. Hopefully this essay helps contextualize what is reported."Patrick comments: This was an explicit acknowledgment that I'm not the news media and can't provide ongoing updates about breaking news.I also included a disclosure about my background at Stripe: "I worked at Stripe, which is not a bank but works with many banks, for six years prior to leaving full-time employment recently. I'm an advisor there now. My views are entirely my own, and my analysis is informed only by publicly available data."This disclaimer served two purposes. First, to avoid having my statements attributed to Stripe, obviously. Second, to clarify that I wasn't operating with privileged information. Some people, like Federal Reserve employees with access to Fedwire data, have privileged views of the financial ecosystem. Any commentary they make might reasonably be interpreted as informed by non-public, potentially newsworthy intraday settlement data between banks. [Patrick notes: And thus we responsible professionals have to disclaim floridly, in addition to prudentially avoiding comment on many things we would like to comment on, or which people would prefer we comment on.]The Nature of Bank FailuresWhy are banks failing? As we've previously covered regarding deposit insurance (now unfortunately topical), banks don't fail in a day. The seeds of their destruction are sown and watered for years, then reaped quickly. Importantly, these seeds don't come with warning labels.People have a great desire for there to be a narrative here - for bank failure to require stupidity or malfeasance, or ideally, stupid malfeasance. But what's actually killing banks is a very simple idea with profound consequences: When interest rates rise, all asset prices must fall.This is both almost a law of nature and perpetually underestimated in how much it affects the world beyond asset prices. For example, in January 2020, I pointed out on Twitter that engineering compensation includes an interest rate derivative because it includes equity. This isn't obvious to many people in tech, including financially sophisticated ones.But equity isn't the only thing embedding an interest rate derivative - all prices do. The price of eggs embeds an interest rate derivative, among many other factors like grain costs. The price of grain embeds an interest rate derivative. The world sits atop four elephants who stand astride the risk-free rate, and then it's interest rates all the way down.The Interest Rate EnvironmentThe price of eggs and other important parts of the consumer basket is a major reason why we're here. The United States, through the Federal Reserve, made a considered decision to manage inflation by hiking interest rates. This is explicitly an intervention to push down the price of eggs and other things, via a lever that's more amenable to direct action than other available options for controlling prices.If you recall the past 15 months, we went from interest rates just above zero to almost 5%. This was the most aggressive rate hike since World War II, or put another way, in the history of the modern economic order.Patrick comments: As an aside, that claim is somewhat glib. In 1980, there was a significant whipsaw in interest rates - the Fed funds rate went from 17.6% in April to 9.47% in June, then back up to 19.08% by January 1981. So by some measures, that was a more aggressive hike. But the claim is still defensible since rates weren't rising from nearly zero, and people had recent memory of comparable rates. See the Fed’s chart, below.The decision to sharply manage down prices was, indirectly but inescapably, also a decision to cause large notional losses to all holders of financial assets. That includes everyone with a mortgage, every startup employee with equity, and every bank. That is the proximate cause of the banking crisis, if indeed we are in one.Three banks failed first because, for idiosyncratic reasons, they were exposed to sudden demands for liquidity, which makes large declines in as'''
