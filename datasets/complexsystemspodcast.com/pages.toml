title = "Debanking explained"
description = "The U.S. political discourse has included many claims about debanking recently, mostly from crypto advocates. Some are accurate; some less so."
full_description = '''Debanking explained Patrick McKenzie Jan 16th, 2025 The U.S. political discourse has included many claims about debanking recently, mostly from crypto advocates. Some are accurate; some less so. I'm joined this week by Erik Torenberg, who heads Turpentine, the media network that publishes Complex Systems. Erik wanted to interview me about debanking, which I recently wrote about in Bits about Money. This has become a hot topic recently due to discourse in the tech industry (particularly among crypto fans) about politically motivated debanking, which has become a national political issue. As always, I'm pretty non-partisan in professional spaces, but as this is squarely on my beat, happy to share what I know.SponsorsVanta automates security compliance and builds trust, helping companies streamline ISO, SOC 2, and AI framework certifications. Learn more at https://vanta.com/complexSupport proven charities that deliver measurable results and learn how to maximize your charitable impact with GiveWell. Go to givewell.org (and type in "Complex Systems" at checkout).Check is the leading payroll infrastructure provider and pioneer of embedded payroll. Check makes it easy for any SaaS platform to build a payroll business, and already powers 60+ popular platforms. Head to checkhq.com/complex and tell them patio11 sent you.Timestamps(00:19) Marc Andreessen's debanking claims (01:02) Understanding debanking and its implications (02:18) Crypto enthusiasts' perspective (07:43) Operation Chokepoint: A historical context (18:09) Sponsors: Vanta | Check (20:23) Operation Chokepoint 2.0: The present day (22:12) The fall of Silvergate Bank (29:55) Crypto advocates and Silvergate Bank (30:45) Sponsor: GiveWell (31:43) Understanding bank account closures (32:35) Bodegas and money services businesses (36:38) Crypto companies and credit risk (47:24) Debanking and its broader implications (49:24) Political ramifications and free speech (59:27) Wrap TranscriptErik Torenberg: Happy New Year. Great to see you.Patrick McKenzie: Happy New Year, good to see you as well.Marc Andreessen's debanking claimsErik: I'm excited to do this. It's a bit overdue. There was this brouhaha a month ago when Marc Andreessen went on Joe Rogan's podcast and talked about what he saw as politically motivated debanking. As we've covered on this podcast and as you've discussed at length and written about, banking is very complex and people may not understand it You were the guy that many people were looking towards to make sense of it: Is this actually happening? Did this actually happen? What does this mean? So I wanted to have a dedicated conversation with you about the debanking that Marc was speaking about and maybe debanking more generally.[Patrick notes: A16z, Andreessen’s VC firm, has a debanking explainer. It is a more concise, and slightly more measured, version of the claims than Andreessen’s press tour on them.] Understanding debanking and its implicationsPatrick: Sure, happy to talk about this. For those who haven't seen it, I wrote a piece called "Debanking (And Debunking?)" which went through this in quite a bit of detail. I almost felt like I wanted to apologize to the audience for how long it was, but it's a complicated topic with a lot of facets to it. Marc and others make a lot of points. Among them are some points that I'm relatively sympathetic to—and given that I'm somewhat notorious as not being the most crypto-enthusiastic person in the world, I wanted to be fair to advocates where I felt they had a point. I also wanted to go into some of the places where there's confabulation about which actor was ordering what, or whether something was truly a private decision of an individual or entity versus a motivated decision based on government action versus a long and complicated procedural history. So yeah, happy to start this wherever you would like.Erik: Sure, well maybe for those who missed it, why don't you characterize Marc's claims and then we can respond to them.Crypto enthusiasts' perspectivePatrick: One thing I'll say at the outset: I have enormous respect for Marc Andreessen and A16Z broadly. I also think there's a number of people making claims like this—I'll broadly characterize them as crypto enthusiasts. Nick Carter has done a lot of work. He's another crypto VC and has published quite a bit about this in Pirate Wires, his own Castle Island Ventures podcast, and a few other places. This is not to say that this is a me-versus-them match, but I’m trying to identify the set of public intellectuals I'm responding to in this discourse.So, let's start with the claims that have been made. First, the word "debanking." Debanking is an advocacy term. What I mean by an advocacy term is that it's intentionally chosen to smuggle in a bit about one's worldview and preferred policy preferences into the words used to describe something—in the same fashion that "death tax" versus "inheritance tax" is an advocacy term.The central claim of debanking is that there's a legitimate user—whether an individual or a corporation—who has a bank account, and then the bank terminates their usage of the account and/or all their accounts for reasons that are not facially legitimate. Almost everyone listening to this podcast has a bank account. You pay your rent and/or mortgage out of it, you pay your employees out of it, etc. And you understand that losing access to your bank account on a very short timeline when you weren't planning to have that happen is an emergency. This establishes a certain amount of automatic regard for the person who has been affected by this debanking decision.Then there's a conflation of that kind of debanking with a second kind: when a person or firm attempts to get a new bank account at a new bank and they are told no for a reason they don't like. Getting told no by a bank is generally speaking not an emergency—it's only an emergency if every bank tells you no. Our moral intuitions for what is happening here are different, in the same fashion that if you told me you got divorced this week, I would want to be extremely sympathetic because obviously your life is in total uproar, but if you told me you got turned down for a date this week, I wouldn't feel that you needed all the support I could offer.Having started with this very user-centric view of banking, the crypto advocates smuggled in another thing: there are a couple of crypto-friendly banks that are largely speaking no longer with us, that had various supervisory actions against them which in some cases are correlated with them no longer being with us. Advocates do not like those supervisory actions.I think I'm being fair in the following characterization, even though it is a negative one: The crypto advocates who are describing those supervisory actions are not familiar with the actions themselves, they are not familiar with the procedural history, and they do not have good mental models for how bank supervision generally works. That is the swath of activities that are coming in under this debanking moniker.To characterize the advocates' claims:1. There's been rampant debanking of crypto-using individuals and crypto-focused firms specifically because they use crypto2. This is being intentionally coordinated by the federal government under the auspices of what they describe as "Operation Choke Point 2.0"3. The federal government has intentionally closed banks that were crypto-friendly4. While there are many federal regulators acting in concert under this Operation Choke Point 2.0 umbrella, one particular federal regulator—the Consumer Financial Protection Bureau (CFPB)—has been taking a particular whack at crypto firms and/or fintech companies and/or tech companies generally.That's the constellation of claims that has been made under the debanking heading.Operation Chokepoint: A historical contextErik: Let's get into Operation Choke Point, just because it's valuable context to have here.Patrick: Sure. Back during the Obama administration, society had many complicated goals. Presidential administrations have many complicated goals—one of the goals of the Obama administration originating in Washington (whether it originated in the White House is beside the point because administrations are larger than the White House; that's a basic feature of American government) was consumer protection in areas of long-standing interest to consumer advocates with respect to finance.One specific sub-area was that many consumer advocates don't like the institution of payday loans. I don't know if I have to give disclaimers of my own point of view here—I also think payday loans are kind of a "burn it with fire" sort of industry, but be that as it may.[Patrick notes: The best argument in favor of payday loans, which are an extremely high interest rate way for descriptively poor people to access cash in a hurry, is that their alternative ways to tap credit are even worse. For example, if your choices under scarcity are a) overdraft your bank account to pay the electricity bill, b) have your electricity turned off, or c) take out a payday loan, possibly the payday loan is your least worst option in a set of three very bad options.So that is the industry’s best argument for why it should not be scoured from the earth with cleansing fire. Perhaps my history as an unpaid consumer advocate or phrasing there might tip my hat as to my own point of view here. But, nonetheless, payday loans are legal in many places in the U.S., and I have a presumptive automatic deference to the laws of democratic nations.]Patrick: The Obama administration decided payday lenders were abusing people. There was a rapid spike in online payday lending, which they thought was particularly abusive, and they wanted to turn the screws on payday lenders.Consumer lending is regulated on a state-by-state basis and in the United States system of government does not naturally roll up to the feds. [Patrick notes: Historically. The creation of the Consumer Financial Protection Bureau seems to federalize many issues which were previously handled at the state level. But that’s another ball of wax.] But that doesn't mean the feds have no preferences about it or no levers available. One lever they had was saying, "Okay, we're not really in the consumer lending regulation business per se. We're in the bank regulation business and payday lenders need bank accounts. If we make it more difficult for them to get bank accounts, there would be less payday lending—and since we think payday lending is basically straight-up evil, less of it in the world would be a wonderful thing."How did they accomplish this? It starts in the Department of Justice. The DOJ pulls out this law from the late 1980s that was passed in response to the savings and loan crisis. That law (the name escapes me at the moment essentially federalizes the crime of defrauding a bank. One of the things that blew up these savings and loan trusts during the crisis was control frauds, where a bad actor essentially puppets the trusts and gives the depositors' money to themselves under fraudulent pretenses. Those frauds blew up some of the trusts, causing a gigantic loss to the entire industry and then a bailout. [Patrick notes: The referenced law was the Financial Institutions Reform, Recovery, and Enforcement Act of 1989 (FIRREA).]Patrick: The law federalizes prosecution of frauds that "affect" (that's going to be a really important word in a moment) a financial institution that is federally insured. As you've seen from the FDIC logo slapped all over your bank and credit union websites, all the financial institutions that are doing anything interesting are federally insured. [Patrick notes: Please read this as a humorous observation; there are many things which consumers perceive to be financial institutions which are not FDIC insured.]The Department of Justice comes up with a novel theory: if you are a bank and you have offered services to a less than salubrious entity, and that entity does things that could reflect upon your social standing in your community or with your regulator, then you have just "affected" a financial institution—to wit, yourself. They read this law as federally criminalizing the act of providing services to someone who then turns out to be a fraudster.They start going after banks for this, and it works for a while. They have a few successful prosecutions and, as is often the case when the feds come knocking, people settle rather than choose to fight it, particularly when keeping one's relationship with one's regulator is important. There's a bit of a two-step during those prosecutions and settlement agreements: "Okay, there's this one particular payday loan company which we think is fraud-fraud-fraudy-fraud. You banked them. That's bad. You promise not to bank them again. And also you promise in the settlement agreement never to bank any other payday lender."Now, payday lenders are legal under the laws of the United States. There is no authority in statute to just usurp Congress's [Patrick elaborates: or state legislatures’] ability to regulate what is and is not legal in the country. But the Department of Justice conjured this authority for itself out of the combination of a 30-year-old statute and a few court cases that they thought gave them some colorable authority.They then talked to their buddies at the FDIC (who do not report to them, but same presidential administration, same broad set of policy priorities) and said, "Hey FDIC, we've been trying to go after this payday lending business and we're having some success here with bringing court cases against banks instead of trying to interdict the payday lenders directly—because there's fewer banks than there are payday lenders, this is more efficient. But you talk to a lot more banks than we do. Can you help us accelerate this process?"The FDIC said "sure." There are these third-party payment processors that need banking rails, so we should call third-party payment processing a sort of high-risk activity because we are in the regulating bank risk business. We'll tell banks that to do high-risk activities, you need a built-out process. This will cause some banks to cease these activities that we've labeled as high-risk.We'll put out a circular of all the industries we think are high-risk—maybe there'll be 30 of them or so. Let's make a list of everything we don't like in the world, and all those things are now high-risk. Are they high-risk because they're going to cause a bank to have a bank run? That magical thinking did appear in some documents about this, but to be clear, it is magical thinking. The only form of risk these businesses consistently represented was "we don't like them."Thirty industries get added to the list. Some of them are outright evil: scams, for example. Some are challenging industries to bank but bankable, such as adult entertainment. Some are just bizarre for inclusion in this list—like fi'''
