title = "Seeing like an outsider, with Yatharth"
description = "How I came to know a bit about financial infrastructure, the edge inherent in the outside view, and some potpourri."
full_description = '''Seeing like an outsider, with Yatharth Patrick McKenzie Jan 2nd, 2025 How I came to know a bit about financial infrastructure, the edge inherent in the outside view, and some potpourri. Capping off our experiments for the holidays, my Twitter mutual Yatharth reverse interviewed me. Some of it is professionally relevant (how did I fall backwards into knowing a Bit about Money), some of it is personal (how I met my wife), and some is application of lenses and scripts that I've accumulated over the years.In particular, we come back several times to the theme that outsiders are forced to explicitly study cultures to be successful within them, and perhaps might understand them on levels that insiders do not. Or perhaps that is just a story I like to tell, as someone who has found himself the insider outsider for most of his career.SponsorsCheck is the leading payroll infrastructure provider and pioneer of embedded payroll. Check makes it easy for any SaaS platform to build a payroll business, and already powers 60+ popular platforms. Head to checkhq.com/complex and tell them patio11 sent you.Timestamps(00:00) Intro (01:30) Patrick's early interest in credit cards (03:53) Navigating financial challenges (05:10) Becoming a financial advisor (10:35) Cultural and educational insights (18:57) Sponsor: Check (22:14) Personal stories and reflections (25:48) Parenting and cultural integration (33:26) Writing and storytelling journey (37:35) Translating financial systems for a new audience (39:08) The role of AI in writing and style transfer (40:46) The concept of alpha in writing (44:48) Legal advice and AI's role (52:12) The impact of AI on bureaucratic systems (01:04:22) Reflections on government software and policy (01:13:49) Sabbatical insights and future interests (01:18:52) Wrap TranscriptPatrick McKenzie: Welcome to Complex Systems, where we discuss the technical, organizational, and human factors underpinning why the world works the way it does. Hi everybody. My name is Patrick McKenzie, better known as Patio11 on the internet, and I'm here with my Twitter mutual, Yatharth.Yatharth: Hi everyone. It's good to be on the show, Patrick.I spent the last couple of days asking myself a question. It wasn't very salubrious in nature, but it was: if Patrick died in a plane crash tomorrow, what would I really regret not having asked him in this hour? That's where I'm coming from today, and I'd love to dive straight in with some of those things that came up for me.Patrick: Sure. Just to give context for people who weren't flies on the wall when we were arranging this - we follow each other on Twitter, we think we mutually have interesting ideas about a funny potpourri of things, and this'll be something of a reverse interview.Just so people know where you're coming from, what do you do when you're not on Twitter?Yatharth: Currently I'm in graduate school doing research on screen time addiction and AI capabilities. I'm also a software engineer at a small health tech startup in LA. On the side, I volunteer at a preschool, draw at an anatomy lab, and write a lot on Twitter.Patrick: Alright, I have no idea what's coming next, but hit me with your questions.Yatharth: The first one - I've read some of your articles on debanking and Know Your Customer requirements, and all these things.[Patrick notes: The debanking piece is probably the best thing I’ve written in the last 18 months or so, and very worth reading if you’ve been following pmarca et al’s discourse on debanking as it relates to crypto or U.S. politics in the last few months.]Yatharth: There's a magic to them. You seem to actually care about how the system works. In all the discourse I encounter about these topics online, it's mostly focused on stories that sound very plausible, with little concern for what actually exists. I understand you were working at Stripe and are now an advisor there, but I'd love for you to take me back to a moment before you understood credit card exceptions well enough to talk about them for 20 minutes, and how that experience came to be built up.Patrick's early interest in credit cardsPatrick: Obligatory disclaimer upfront: I am currently an advisor at Stripe after leaving their full-time employment. Stripe does not necessarily endorse what I say in my personal spaces. (You can tell I have that one macroed out.)When did I first start caring an irrational amount about credit cards? It was a long time ago. For those who don't know me, I had a fairly standard upbringing in a Chicago lower-to-middle-class American family. Happy family live, some hangups about money, yadda yadda. I got to university the same way many people do - by studying a lot and signing some student loans.[Patrick notes: As long as we’re doing deep lore here: I paid for university in small part by making a list of every essay writing competition attached to a $500 or $2,000 scholarship I could find, and won a lot of them, partly because I wrote better than the average entrant and partially because the typical organization which throws a $500 essay competition will be lucky if they get 5 essays to pick from. (As a certain ethnically affiliated organization told my sister, when they proposed giving her a fairly sizable scholarship which any rational person would assume was extremely unlikely to go to anyone who looks related to me. We’ve got to distribute some grant money and you have the winning essay, on the strength of there being no other essays, so please help us out by cashing this check quickly.)Patrick: If I had been more organized about this with a spreadsheet, templated essays, and similar, I probably could have simply paid for university that way.]Partly due to one of the very few parenting choices from my parents that I will intentionally not replicate, I was protected from the mechanics of money until I got to university and had to figure it out for myself.As soon as I arrived on campus, the marketing operation of the American financial industry descended upon me saying, "Hello, student who we rationally assume will have money in a few years because you are going to a research university in the United States. Would you like a credit card?"I reacted as if someone had proposed a deal with the devil, because that's not something you're encouraged to get into if you're from a lower-middle-class American background. I gradually gained a somewhat more sophisticated understanding. One factor was simply attempting to read and give myself an education on consumer finance, because I thought, "This is going to be relevant for my interests. I'm going to become an adult. I will have to do adult things like getting a mortgage. Apparently getting a mortgage requires you to have a credit score." So I read up about that sort of stuff.Navigating financial challengesThen one incident ended up being really important: in the course of finding out what a credit score is, I pulled my credit report and discovered something surprising: I had over $100,000 of various forms of consumer debt. In many cases, those consumer debts dated back to before I was born. I did not remember having bought cars before I was born.It felt like: one, I'm in a bit of an emergency here. It appears that the United States financial industry thinks that I owe them $100,000, which is approximately $100,000 more than I have. And two, this is obviously crazy. This was largely dawning on me after I graduated university and pulled my credit report for the first time, because who pulls it as a university student?Anyhow, I get to Japan, I pull my credit report - oh my - and then I spend essentially a six-month adventure working with the credit reporting agencies (CRAs), a panoply of debt collectors, and financial institutions in resolving the various issues that the industry had with me. I can tell you how that crazy situation happened, but let's just say that I managed to get past it.Becoming a financial advisorIn getting past it, I did what anyone does and Googled around a lot. I found myself on The Motley Fool's discussion boards and participated on the Credit Cards and Consumer Debt discussion board.[Patrick notes: My pseudonym was laughably transparent to people who knew me, but I didn’t expect anyone to ever read those posts, so please don’t take unmasking 24 year old me as a challenge, Internets.] Patrick: After a couple of months, the questions that were asked by people coming in for the first time were very familiar to me because I'd gone through this process myself.The answer was always the same: in this circumstance, you need to assert your rights under the Fair Debt Collection Practices Act. You do that by writing a short letter to the responsible person.The typical person who ends up on the Internet with severe debt problems and beseeches a random forum to solve their debt problems cannot immediately action this advice. "You just need to write a short professional letter to the vice president of customer affairs at your bank, cite your knowledge of the Fair Debt Collection Practices Act, maybe mention Regulation E a few times, and then this will be solved for you." They find that rather difficult.Because I had a lot of time on my hands and was on the Internet - and have this genetic abnormality that any question asked above a text box on the Internet demands my immediate reply - I would just ghost write letters for people. I think I ghost wrote on the order of a couple hundred letters over the course of the next few years, just walking people through the mechanics of this.Meanwhile, I did a lot of random reading on the Internet. I think I read every Supreme Court opinion - I'm not exactly sure that I kept a spreadsheet of that, but I had lots of time on my hands. And while running a small software business, I did something that very few small software business owners do: I actually read all the contracts about credit card acceptance, because I was fascinated by how PayPal pays me money. It appears that money magically teleports from my customers to me over in Japan. This implies something cool in the middle. I wanted to understand it.As a result, by the time I actually worked in the financial services industry for Stripe, they did training in the first week and the trainer asks, "Okay, who can diagram out credit card acceptance on the blackboard?" That's a common gambit that teachers make, expecting to say "Of course it's nobody, but I will do it for you." I asked, "How much detail do you want?" And the trainer said "You tell me how much detail you can give." I replied, "Do you want the case in which we tokenize the credit cards or the case where we don't tokenize the credit cards?"She was like, "You understand what credit card tokenization is? Have you worked in the financial industry before?" I said, "No, I was a Stripe customer before. And tokenization is a pretty important thing in Stripe.js. It's for reasons related to PCI DSS." I got a lot of mileage out of my weird extracurricular interests over the course of working at Stripe for a number of years. And go figure, part of my job became explaining these weird extracurricular interests to various audiences.That's my origin story of how I came to know a few things about various financial fields. And then there is a feedback loop here in any sort of Internet participation. The more you do anything, both you will get directly better at doing the thing, and when you do the thing in public - to use a very evocative phrase from my buddy Kevin Kwok - it's like tapping a tuning fork and seeing who resonates.People who have maybe more connection to that thing than you do, maybe they've made it the entire focus of their career rather than simply having it as one of your diverse intellectual interests, they will say, "Wow, it's great that someone who can write actually cares about Regulation E. As a matter of fact, I have worked for a financial regulator for the last couple of years, and it really grinds my gears that people don't understand that Regulation E has cross-applicability to Zelle specifically. Can I take you out to coffee and just dump on you about Reg E?" Being willing to listen to people about that sort of thing exposes you to all sorts of tidbits. And this snowballs, if you allow it to snowball.So that's my villain origin story.Yatharth: That is more satisfying of a story than I could have come up with myself.Patrick: By the way, people often ask if this was planned - did I have the 20-year arc of my career planned out, that I was going to decamp for Japan and then deliberately write my way into the financial services industry? Nooooo.For a variety of class-inflected reasons, I was at an American research university, Washington University in St. Louis, with many people who took the more direct path into consulting or investment banking.I told people contemporaneously, "I don't think I'm exactly the kind of person that goes into investment banking." And they said, "What do you mean? You're in the engineering school, top of the math classes, etc. It seems like you could probably do this. Have you seen the people that show up to the interviews?"I said, "How would one even go about that?" And the true answer was probably the open casting call interview they were having on campus. Perhaps I should have arranged to go to that. But that did not occur to me as an undergrad who knew little about anything in the world. That is one mechanism I try to explain to people - "go through the door that is open" is a viable strategy in a lot of circumstances.Cultural and educational insightsYatharth: There's this phenomenon of people who generate a lot of value for others writing on the Internet where some misfortune happened to them. They had to figure out a lot of stuff that normal people didn't have to figure out and they're somewhat autistic about writing about it. In your case, it's this massive fraud and the fact that you actually didn't come from that professional-managerial class culture. It's very interesting and maybe reflects the way you talk about it.In my own case, I have had to figure out a lot of things about just how emotions work and feelings - things that I now articulate in painful detail to some, but that people regularly message me saying "this changed my life," just because I had to figure it out from scratch and write about it.Patrick: Yeah, the intersection of class and education and professional capabilities/responsibilities is a deep well. I think part of the story is that as one grows into adulthood, one starts to master things that different people encounter at different rates.You mentioned a particular word that I have a complicated relationship with. I like to phrase it as "being wired differently than the other kids." Growing up, I was very obviously wired differently than the other kids, but there was less of an understanding that that specific thing could be medicalized. Although they did try. There was a school psychologist at one point '''
