title = "Betting on the future via prediction markets, with Stephen Grugett of Manifold"
description = "How prediction markets put a legible probability on claims about the future."
full_description = "Betting on the future via prediction markets, with Stephen Grugett of Manifold Patrick McKenzie Aug 1st, 2024 How prediction markets put a legible probability on claims about the future. This week I caught up with Stephen Grugett, one of the co-founders of Manifold Markets, a prediction markets startup. (I am a small angel investor in it, after having been an avid Manifold user and an off-again-on-again prediction markets user for ~20 years.) We discussed putting prices on the future, some of the mechanics and design decisions, and how markets are better for epistemics than many competing approaches.[Patrick notes: As always, I write notes in the transcript in this format.For historical context, this conversation was recorded on June 4th, 2024. You might remember those halcyon mists of history, where we were discussing two elderly men vying for the presidency.On June 4th, Manifold users assigned only a 95% probability that Biden would win the Democratic nomination. I was one of the (many) people who updated negatively on that in the wake of the debate, buying No for the first time on at 77% and adding on several more times in the 60s, 50s, 40s, and 20s. My reason for these transactions was simple: I'm a Japanese salaryman who knows relatively little about American politics but who is familiar with the concept of coordination games conducted publicly via other-than-strictly-true statements. The market, of course, resolved to zero on July 22nd.] Sponsor: This podcast is sponsored by Check, the leading payroll infrastructure provider and pioneer of embedded payroll. Check makes it easy for any SaaS platform to build a payroll business, and already powers 60+ popular platforms. Head to checkhq.com/complex and tell them patio11 sent you.Timestamps(00:00) Intro (00:26) Understanding prediction markets (02:15) Manifold's calibration and performance (06:48) The role of bots in prediction markets (10:52) User-created markets and community practices (15:49) Forecasting, and superforecasters (18:26) Crafting good markets on Manifold (23:07) Sponsor: Check (24:20) Evolution of Manifold's loan system (26:13) Market participation and capital efficiency (27:57) The LK-99 superconductor markets on Manifold (28:57) Social aspects of market participation (32:31) Building Manifold and user growth trajectory (34:57) Innovative use cases for prediction markets (38:52) Prediction market vs. traditional market (42:22) Play money markets with real cash prizes (46:14) Historical and regulatory context of prediction markets (49:32) The importance of market optics (50:44) Wrap TranscriptPatrick McKenzie: Hi everybody. I'm Patrick McKenzie, better known as patio11 on the internets. I'm here with Stephen Grugett from Manifold.Stephen Grugett: Hi Patrick. It's great to be here, thanks for having me on.Patrick: Thanks much for coming. So I've long been an enthusiast in prediction markets and Manifold is the product in prediction markets that really grabbed me, but it's one of these technologies that is vastly under-understood outside of a relatively narrow community of practice.[Patrick notes: I became prediction pilled by reading Robin Hanson et al on the Marginal Revolution blog in the early 2000s, and was an avid hobby user of Foresight Exchange for several years, ending when I made the curious decision to stake all of my fake Internet points against a strengthening yen. 20-something me apparently believed that, after several correct calls on elections during my online political junkie phase, I should try my hand at currency speculation. I don’t pretend to know what he was thinking.] Patrick: Can you just explain for the audience: what is the prediction market?Stephen: A prediction market is a place where you can bet on the outcome of events. An event can be anything. A typical example would be the upcoming presidential election: you can create a prediction market on whether Trump will win the 2024 US presidential election. Typically in a prediction market, people are purchasing shares that pay out if the event occurs, so if I'm betting against Trump, I will purchase “No” shares in the outcome of that event, and each “No” share will pay out one dollar, or a thousand mana, or something similar.Patrick: (In the event that he is not elected.)Stephen: Right.Patrick: There’s this fun property of prediction markets where the the cost of a “No” share and the cost of a “Yes” share in the same event should sum to (should,* asterisks, there's some funness here, which I'm sure we'll get into) but in principle, they sum to a dollar in many implementations, so you can read from the price a probability estimate - not from any individual trader, not any individual authority, but the market's best sense of the truth, given what it knows right now.[Patrick notes: People who are new to prediction markets really struggle with the concept of Yes and No shares. I think it is to Manifold’s credit that they largely abstract it away via the UI: your position is always a positive number, just labeled with a direction, and should you simultaneously hold a Yes and a No in the same market they are immediately autocancelled for $1 without you needing to be aware of that. Out of tiny UX decisions like this are very compelling products made.][Patrick notes: So what are the fun edge cases I was alluding to? OK, you can extend the general concept of binary markets to e.g. betting on the length of my sabbatical by expressing whether you think the current prediction is low or high, which gets quantized via some magic into several binary bets on underlying buckets.]Stephen: That's right, yeah. This is why people care about prediction markets.It's not just a spiced-up poll; it really is one of the best ways of aggregating humanity's opinion on something in general, because when money is at stake, you know, people tend to get serious about predicting things. Patrick: Sort of like, empirically, if we expect to be actually good at predicting things in, I don't know, journalism, we might have a written record.Perhaps we could go back and score a written record against the facts as they arrive. I don't know that anyone actually does that for journalism, but I'm assuming for Manifold you look at historical prices and then look at whether the market was well calibrated or not.You want to share anything about that?Stephen: Sure. We at Manifold do publicly track our own calibration. I think one surprising thing is how well this system works with just play money and relatively low dollar volumes in general.[Patrick notes: Manifold also grades each user individually on their calibration. I get an A, which is profoundly motivating to the part of me that will never, ever graduate high school.]Stephen: Just having the basic market set up plus a few participants can get results that are pretty good. One of the typical findings with prediction markets (and for expert aggregation systems in general) is that typically market mechanisms and other systems outperform both individual experts and the general public.Patrick: They often, I think, outperform consensus of experts as well, if I'm not mistaken – there's some sort of social desirability bias and similar, which makes the sum of a number of smart people in some ways less added value than you would expect given the number of smart people involved.Stephen: Yes, I think it's very sensitive to the exact way that you're aggregating expert opinion –prediction markets are a way of aggregating expert opinion, and non expert opinion too.Patrick: You can do a market on, in principle, just about anything. There were markets on, notably, will Russia invade the Ukraine or not – which are obviously sensitive in one sense but important questions for society – and there were many experts that were pretty confident in their opinion of how life would go down, and prediction markets are maybe better-calibrated at getting early answers on those consequential questions.Stephen: That's right. It's interesting that you bring up the Ukraine invasion market, because I think this is one of Manifold's first predictive successes.Pretty shortly after we had launched the platform, we had a number of markets on this question of whether Russia would invade – I think we were above 50 percent like a month out from the actual invasion, despite many pundits claiming that this was totally impossible and far-fetched, etc.[Patrick notes: NYT, Jan 20th 2022: “A group of Russia experts — including Frederick Kagan, who has advised U.S. military leaders in the past — [believe the troop buildup is a mix of bluff and distraction]”. Russia’s Deputy Foreign Minister, Jan 19th: “We will not attack, strike, invade, quote unquote, whatever, Ukraine.” Manifold, Jan 20th: 49% chance of war. World we live in, February 24th: Russia invades.]Stephen: It really felt vindicating for us that we were working on the right thing – and a vindication of prediction markets in general, that even when operating at a relatively low scale, they can still produce useful and meaningful results that can be interpreted by everyone in the public.Patrick: I'm a relatively minor user of Manifold (also a relatively minor angel investor, full disclosure). I mostly use it myself as a fun game to keep me honest about my crypto doomsdaying on Twitter. I remember last year or so, early last year, sometime after the collapse of FTX, there were several markets made on whether CZ, the CEO of Binance, would continue being the CEO of Binance, and would he get into various forms of legal trouble?The markets were trading very low relative to what I thought the number was. I made a comment on Manifold saying, “This currently has a 10 percent chance that CZ leaves his employment as the CEO of Binance, which radically understates the likelihood that he would leave under some sort of negotiated agreement to protect the company from legal liability. I'm buying this up to 25.” And then go figure, that did indeed happen and I won $30 of fake money and felt like king of the world.Prediction markets are very good at tapping my, like, someone's being wrong on the internet (in the XKCD form of things) – and also, a little bit of enforced epistemic humility on making sure that you're not the person that is being wrong on the Internet and just sort of browbeating other people because you have more Twitter followers than them, or a position of social esteem or similar.Stephen: I think that's a great example. It also shows the power of markets to allow individuals to add information into the forecast in a piecemeal fashion. You knew something about this facet of the law that was relevant to this case. Maybe (for the sake of argument) you don't have views on the overall evolution of crypto in general, but if you know something about this particular case, you can come into the market, and add that information in.This is one of the benefits of a market-like mechanism versus other forecasting aggregation mechanisms. Patrick: And either informally or strikingly formally, you can look at differences between the markets and say things like, “Oh, if if this market says that hypothetically CZ has 60 percent chance of going to prison and this market says 20 percent chance that he leaves his job as the CEO, those doesn't really cohere with each other” – even if I don't have a strong point of view on the actual course of future events with respect to CZ, I have a strong point of view that these prices are wrong relative to each other. I can sell one and buy the other and cause them to converge towards what the true relationship of these two independent but tied situations should be.[Patrick notes: For much, much more on this, see the conversation with Ricki on teaching trading. Sometimes new information in one market should inform prices in a separate one. ]Stephen: Yeah, that's right. That's another very powerful feature of markets.Patrick: And I understand that there actually are some bots running on Manifold that do things like the “arbitrage” and other forms of algorithmic training?Stephen: That's right – I actually operate one myself. I operate Manifold's house bot called Acceleration.Patrick: Can you tell the audience a little bit about Acceleration? I have some background knowledge, but…Stephen: There are still many secrets that I will not reveal… but I have talked a little bit about this in public before. The basic strategy is something akin to what Citadel is doing when they're buying retail order flow.So, the vast majority of traders, when they trade in marketplaces, are not informed and don't really have a good opinion on where the market price is going to be – so the basic strategy is to first, identify who is not bringing new important information into the marketplace, and then secondly, bet against them and return the market price back to where it was before.[Patrick notes: Acceleration used to give me action, but has been refusing to do so lately. Crafty little bugger.]Stephen: That's the very basic strategy. There are many, many details that you need to do in order to not lose money – the most important of which is being very sensitive to exploits and people trying to game the patterns that you're looking for, to spoof the credentials that you're using to try and detect if they're good traders or not.Besides my bot, there are a bunch of different algorithmic strategies that our users are running as well.I guess the first and most simple type of bot is a simple arbitrage bot: it's looking for markets that are on the exact same topic – if you have a market on whether Trump will be elected or whether Biden will be elected there's a very obvious relationship between those two markets – and if they get out of whack, there are bots that will bet those back into equilibrium.There are bots that look at external news sources or other bookies to provide information; Manifold in terms of sports betting is quite small compared to other major sports books, so if you copy the prices from other sports books and bring them onto Manifold, that actually turns out to be a really great strategy, so there are people doing that as well. In the future, I expect people will add even more sophisticated strategies. I haven't seen this yet, but I suspect in a year or two, there'll be some true, more complicated statistical arbitrage strategies, which look at baskets of different markets that have some sort of statistical relationship, and then buy or short these baskets in order to make sure they reach an equilibrium.There are time decay strategies: many events are structured in the form of, “will X happen by this date?” and as the present movement moves closer to that date, then the probability naturally needs to go down over time – you can set up a bot to perform this pretty simple strategy for you.There are tons of variations of these things. I think we're probably in a very unusual position among other early stage startups in that we have such an extensive bo"
