full_description = '''The hundred-year-old telegram worth $5 million, with Jim McKenzie Patrick McKenzie Oct 3rd, 2024 Ever wondered what a real estate developer actually does? I'm joined this week by my father, Jim McKenzie, who worked in commercial real estate development in Chicago for most of his career. He has been telling me stories of deals, and what they implicitly show about the system that is Chicago, since before I knew how to spell "real estate." When I've recounted them to people over the years, I've often been asked for more, and so thought I'd let folks hear them from the horse's mouth once.Although I ran screaming from the field (for reasons which may be alluded to in our conversation), I think real estate is a useful window for systems afficionados. It is a necessary component in any infrastructure project of note. The practice of it also gives a window into parts of government and other bureaucracies which must function in a way differently than they are described to function. Also, selfishly, there is no way for the U.S. to achieve Tokyo's level of housing abundance without convincing capable people of going into real estate development, so perhaps this can showcase the field decently.[Patrick notes: As always, I put my other-than-contemporaneous thoughts in the transcript, set off from the rest of it in this fashion.] SponsorThis podcast is sponsored by Check, the leading payroll infrastructure provider and pioneer of embedded payroll. Check makes it easy for any SaaS platform to build a payroll business, and already powers 60+ popular platforms. Head to checkhq.com/complex and tell them patio11 sent you.Timestamps(00:00) Intro (00:27) Understanding real estate development with Jim (03:13) The great rail lease story (20:02) How real estate ownership is conducted (25:58) Real estate acquisition strategies (28:39) Sponsor: Check (29:41) Banks and location (34:25) Day-old bread: an opportunity (38:45) The Walgreens development dilemma (40:22) Strategic offers and unusual numbers (42:25) The power of personal relationships (46:37) Navigating real estate offers and execution quality (52:51) The LaSalle Bank acquisition and its impact (54:39) The 2008 quadruple whammy (58:39) The West Town shopping center opportunity (01:05:29) The complexities of real estate deals (01:14:24) The 2008 financial crisis and its ripple effects (01:15:36) The energy industry resurgence post-Ukraine incursion (01:16:07) Navigating utility easements and real estate (01:21:43) The complexities of curb cuts and driveway permits (01:23:46) Chicago's political landscape and real estate development (01:32:37) Lobbying and political influence in development (01:51:58) Wrap TranscriptPatrick McKenzie: Hideho everybody. My name is Patrick McKenzie, better known as Patio11 on the internets, and I'm here with guest who is near and dear to my heart today: my father, Jim McKenzie.Jim McKenzie: Hey, I'm happy to be here.Understanding real estate development with JimPatrick McKenzie: We’ll be speaking about real estate today. This is mostly an infrastructure podcast, but all creation of infrastructure, and the infrastructure itself, sits in some place in the physical world. Real estate is the interface between the physical world and the rest of us. [Patrick notes: Incredibly, that was not intended as a joke.] I often think that people underappreciate how much work is done to actually get properties into a usable condition and deal with the sort of complex legal and logistical issues that are involved in bringing real estate into being actively usable.So, you worked for real estate developers for much of your career. Can you explain, for an audience without background knowledge: what does a real estate developer actually do?Jim McKenzie: A developer goes out and acquires, most commonly, land, though sometimes they redevelop existing buildings. They then organize the construction of improvements on that property, and then lease it out to tenants, who hopefully pay excellent rents for new, usable real estate.They then make money on the difference between the purchase price plus the cost of improvement and the value of the property once it has been leased up.Patrick McKenzie: Some developers will carry the new buildings on their own books, to earn rent over time, while others will then sell the improved real estate to a longer-term owner of it, correct?Jim McKenzie: Exactly.[Patrick notes: You will note that in this conversation I frequently interject things that I learned from my father when I was seven, because he assumes (accurately) that I remembered those lessons, and I am trying to be the voice of audience members.For example, many people don’t understand that real estate developers and landlords are not necessarily the same people. As a trivial example: I am a landlord. The condo in Tokyo I originally purchased for our family is now occupied by another family; they pay me rent for a bundle of services (including e.g. committing to interface with professionals on their behalf or pay a designate to do so, providing capital, and absorbing all risks from “Gozilla stomped it” to “we’d prefer to not live here anymore, so we can stop paying you, right.”)I did not develop that condo. A large Tokyo real estate firm acquired the condo unit from its prior owner for X, put a six figure USD sum into modernizing the unit (paying people to swing hammers, buying new appliances, and similar), and then sold it on the market (to their mild surprise, to me). They earned a six figure USD spread between the cost of the unit plus the cost of repairs (and their capital being tied up for half a year), and revenue from the sale.]Patrick McKenzie: So let’s talk about the capital stack for commercial real estate, which you spent most of your career in. How are these projects financed?Jim McKenzie: Typically large banks make the loans. The equity largely came from private equity. [Patrick notes: Equity for real estate developers doesn’t necessarily come from “PE firms” in the way that word is understood by most people who read the newspaper, although it can. Some developments are “below institutional scale.” In this case, the partners at the developer may self-fund the equity required. They may also raise private capital by any of a variety of approaches.If you look around your town at commercial developments, down to individual small apartment buildings or strip malls, many of them are funded by consortiums of (without loss of generality) dentists, small business owners, or landlords.If we had had another few minutes to talk about the capital stack specifically, I would have loved to dig into the difference between common equity and preferred equity, which is a debt-like instrument that is quite common in commercial real estate, and how real estate sponsors have a compensation scheme similar to VC's carry except they call it promote.]Patrick McKenzie: What range of sizes of projects did you work on during your career?Jim McKenzie: During the development years of my career, between approximately $2 million on the low end and low $100 million range on the high end.[Patrick notes: There are multi-billion dollar real estate projects in the world, but they are relatively rare; nine figures, on the other hand, happens in every major city with a bit of regularity. And, of course, there do exist projects below $2 million. Many of them are done by so-called mom-and-pops. Anyone who “flips” a single family home, which is something my parents did when they were much younger, is in effect a real estate developer. (A “flipper” buys a house, improves it (frequently through the sweat of their own brow), and attempts to sell at a profit.) Patrick McKenzie: So presumably those mid-range real estate projects have 20% or so equity and then the balance being bank loans?Jim McKenzie: It was more typically about 30% equity, except for unusual circumstances. As an example, Walgreens has exceptionally good credit. If you have a signed lease from Walgreens for a property you have committed to develop on their behalf, banks will be more inclined to be generous with their underwriting terms, perhaps including requiring you to have less equity in the deal.[Patrick notes: Equity takes losses first. The more equity you have in the deal, the more protection the bank has, both due the simple fact that you spend your dollars first and the bank’s last, and the more indirect implication that you are far more incentivized to make the project work when you have accepted more downside risk. And there is always, always something threatening the project with failure. It will default to failing, any day you default to not showing up.This is a very elementary point, and it needs to be said explicitly: the thing society compensates real estate developers for is going out and making buildings happen. No amount of happy accidents has ever, even onced, caused a building. They are fractally complex engineering projects with substantial project management risk, far more complicated financial engineering than most equivalently valuable tech startups, legal/regulatory complexity, and an uncaring physics engine which will kill your people and ruin you if you get the math wrong.] Patrick McKenzie: People may not appreciate this, but in commercial real estate, bank underwriting is substantially more complex than in residential real estate. It isn’t as simple as getting a credit report on the borrower [Patrick notes: laughs in residential underwriting], right? The process is very bespoke on a deal-by-deal basis, for one thing, right?Jim McKenzie: Yes. It is very rigorous. [Patrick notes: Flagging this as McKenzie family humor, because rigor is certainly present in some deals, but as we discuss later, it’s a complicated topic.] Patrick McKenzie: Certainly rigorous. Also, there is a bit of competitive pressure possible with respect to banks, with the developer being able to play them off each other. This can result in some underwriting requirements being negotiable.Jim McKenzie: Yes.The great rail lease storyPatrick McKenzie: So let’s walk down memory lane and examine some of the sort of unusual circumstances real estate sometimes exposes one to.I recall that you have a story about once negotiating leases on behalf of a railroad, while having recently become a paralegal. Care to recount it for people?Jim McKenzie: Early in my adult life, I considered going to law school, and took a paralegal training course to see if the field would suit me. This was about the time your mother and I got married. [Patrick notes: Dad would have been in his mid-twenties. His jobs before this including driving a bus and shooting Cheerios out of a cannon, which is apparently a production step.] On the day of our wedding, we sold the contract to purchase a small two flat on Ashland Avenue in Chicago just off of Diversey. This is a very, very hot neighborhood today, but back in 1979, it was kind of an edgy neighborhood, with some gang problems, with great future promise.[Patrick notes: I say this explicitly later in the episode, but Dad has nearly a photographic memory for recollection of the map of Chicago, the social organization of a large chunk of it, and minutiae about real estate deals from 40 years ago.I definitely can’t do any of those things, specifically, but you can sort of see where some aspects of my personality come from.] Jim McKenzie: The upshot to the story: we had contracted to purchase a property which had come on the market for $18,000. It was not financeable.[Patrick notes: There are a few fact patterns which can lead to residential real estate not being financeable. A theoretical one: some properties are below the effective minimum to get a bank interested in loaning you money. That is not the issue here, though.Real estate, like many fields, occasionally thrives in euphemisms, and I’ll spell this particular one out: a bank will not underwrite a loan for this property because, at the time of sale, it was not in a livable condition. Some buildings have structural defects with mechanical consequences like e.g. being illegal to rent out in the city of Chicago and not being safe to be present in during e.g. temperatures reasonably foreseeable in a Chicago winter. Banks won’t lend against those properties, because absent someone willing to put in work to remediate them, they’re effectively worthless, and the time and attention of someone qualified might well push the worth to negative numbers. (Also the supply chain for mortgages can’t metabolize them, for effectively policy reasons, outside the scope of this parenthetical note.)Jim McKenzie: We offered the owner $20,000 with $3,000 down. The owner, an 80 year old woman, was to hold her existing mortgage until we would be able to rehabilitate it to a point where we could refinance.[Patrick notes: Explaining this transaction: Mom and Dad bought a house for $3,000 with a promise to pay $17,000 more later, with them to do substantial work swinging hammers and similar. The aim of this was to make a house that was not suitable to live in suitable to live in. After demonstrating to the satisfaction of a bank that the house was now suitable to live in, Mom and Dad were going to borrow the $17,000 and pay it to the seller.Stating explicitly: there is enormous risk in this transaction, obviously. What if Mom and Dad can’t successfully swing hammers? What if the problems are beyond their capabilities or they run out of money to buy new lumber and paint? What if their amateur shenanigans degrade the house from its already impaired state? These are important considerations for the seller, who (despite the state of the house) very likely considered it financially significant to them.]Jim McKenzie: There were four other offers from developers and commercial purchasers. Our number was the highest and, being an 80 year old woman, she didn't look at the details and took the highest number in the pile.[Patrick notes: Many, many sellers of real estate are advanced in their years, and their priorities shift versus their younger years. This is a very important thing for professional buyers of real estate to understand, and Dad is (if you accept my surmising almost 40 years of stories) very good at being empathetic about it. Sometimes the priority is cleaning up one’s affairs to prepare one’s heirs with a cash inheritance instead of an albatross. Sometimes it is freeing up money to join one’s sister in Florida.]One prospective purchaser was the owner of a factory adjacent to this two-flat. [Patrick notes: This is a Chicago-ism for what is sometimes called a “duplex.” Effectively, it is two single-family homes in the same physical building, sometimes with more shared infrastructure than would be normative in an apartment.]Your mom and I were getting weak kneed about the amount of work the place needed and our inexperience in doing rehabilitation. Happily, around that time, our broker came to us and said that one o'''
