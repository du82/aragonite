title = "The mad science of drilling the earth with Austin Vernon"
description = "Austin and I discuss how fracking rescued us from Peak Oil, how incremental technical process shows up as learning curves, and cross-pollination with geothermal energy extraction."
full_description = '''The mad science of drilling the earth with Austin Vernon Patrick McKenzie Aug 29th, 2024 Austin and I discuss how fracking rescued us from Peak Oil, how incremental technical process shows up as learning curves, and cross-pollination with geothermal energy extraction. I once wandered into a room where Austin Vernon was giving a talk about his specialty, fracking, and was transfixed by how delightfully steampunk the enterprise sounded. It is also deeply misunderstood by non-specialists. Plus, supporting the substantial engineering and chemistry, there is a cottage industry of capital stack optimization. So I thought I'd have a conversation with him as part of an occasional mini-series on energy economics. (See also: Casey Handmer on solar.)[Patrick notes: I add notes to my transcript, set out in this fashion.] Sponsors:Check is the leading payroll infrastructure provider and pioneer of embedded payroll. Check makes it easy for any SaaS platform to build a payroll business, and already powers 60+ popular platforms. Head to checkhq.com/complex and tell them patio11 sent you.Building an enterprise-ready SaaS app? WorkOS has got you covered with easy-to-integrate APIs for SAML, SCIM, and more. Start now at https://bit.ly/WorkOS-Turpentine-NetworkTimestamps:(00:00) Intro (01:38) Fracking technology and horizontal drilling (05:12) The history and development of fracking techniques (12:26) Communication methods in drilling operations, including mud pulse technology (15:50) The economics of drilling operations (17:28) Scale and cost comparisons between different types of drilling projects (19:30) Safety considerations in onshore vs offshore drilling (20:50) Sponsors: WorkOS | Check (24:04) Discussion of small-scale "mom and pop" oil operations (27:13) The impact of oil on local economies (31:45) The lifecycle of fracked wells and their long-term production (36:15) Financing in the oil and gas industry (39:19) Unique aspects of US mineral rights laws and leasing practices (42:38) The process of setting up and funding new drilling operations (52:55) Environmental concerns and groundwater protection measures in fracking (56:40) The physical footprint of drilling operations (59:12) Learning curves in fracking and geothermal energy extraction (59:56) Diamond drill bits are not quite forever (01:03:59) Where fracking goes from here You can Ctrl-F these headings to find them in the below transcript. I cannot hyperlink them, unfortunately, due to technical limitations. TranscriptPatrick: Hi everybody. My name is Patrick McKenzie, better known as patio11 on the internets, and I'm here with my buddy Austin Vernon.Austin: Hello.Patrick: So, Austin was previously a petroleum engineer, probably also currently a petroleum engineer – I think that’s a thing one does not necessarily stop being, sort of like the former vs. retired distinction in the military. Professions are something we carry around for the rest of our days.[Patrick notes: A shibboleth which some people are extremely serious about: do not call people who have previously served in the military “ex-”, as this implies that they were stripped of their membership via e.g. a dishonorable discharge. A socially appropriate word in those circles is “former.” Retirement is a subset of “former” since you can exit honorably without retiring.I think servicemembers are entitled to some amount of special deference but that many professions put an indelible stamp on people.]Patrick: But be that as it may, we had a chat once about the miracles of modern engineering involved in fracking, and I was so intellectually interested in it that I wanted to have you on the podcast to talk about it with a wider audience. To set the stage a little bit, I'm from the more software side of the hardware versus software ecosystem; I think energy is the thing that comes out of the outlet on a wall. The only time I have to think about it seriously is when it's at a data center. There are scary wizards, sitting next to the other scary wizards that handle networking. They handle power and cooling. I try to avoid thinking about that as much as possible.It is likely not the case that we can continue to avoid thinking about this with forecasted energy curves demanded for, among other things, the utilization of AI over the next decade to two decades. So I want to dig into the (bum bum bum!) Complex Systems that result in those electrons getting from several kilometers under the soil into our homes, factories, and data centers.And with that out of the way, take it away Austin. What is fracking, for those of us who haven't followed the news for the last 20 years? Austin: Yeah, I think technically it’s horizontal drilling with multi-stage fracturing – essentially, you drill down about a mile or two miles, then you make a wide turn that takes about 900 feet to turn all the way. Then you drill another – it used to be that we only drilled about a few thousand feet, but now there's people that drill up to three miles horizontally.Then you run some pipes down there and then you're ready to do your multi-stage fracturing – typically with some of these long ones, you might do as many as 50 or 60 different stages. That essentially allows you to control how the fluid goes into the rock and breaks it at various intervals, every few hundred feet.Then with that, we also pump in sand – that usually is the prop, which holds the cracks open after you make them. That allows the oil and gas to flow out the well up to the top, and then get processed from there.[Patrick notes: You may also hear this referred to as “proppant.”] Fracking technology and horizontal drillingPatrick: The general theory here is that, over the past 100 plus years of doing petroleum and other sordid energy resources exploration, we tapped the stuff that was easily accessible – where you could either literally siphon it off of the surface of the earth, Beverly Hillbillies-style, or just drill down vertically and suck it up with a straw, essentially – and we got more technologically advanced and more creative at taking out, for example, gasses that were diffused among, I believe shale rock is the term.[Patrick notes: For those not familiar with classic American television, come listen to the story of a man named Jed, … and then one day he was shooting at some food, and up from the ground came a-bubblin’ crude. Oil, that is.] Patrick: We use liquids that we pump out in the hole to engineer the working environment around these pipes that we put down, such that the gas un-diffuses from the rock, comes into the pipe that we have, and some combination of buoyancy and liquids moving through, etc., moves that to the top where we can then put it in a pipeline and send it to refineries.Austin: Actually the shale is the source – that's where oil comes from, or gas comes from, basically old sea creatures, like plankton and stuff, that fell down onto some shelf, and then they got covered up, and then through geological processes got turned into oil. So really what we were doing before was going and finding very special features, like a place where the gas or the oil had leaked out of the shale and gotten trapped.So, a special rock feature, where it'd be like a little hill or something underground essentially. And then you also had to have an actual reservoir there, like a lot of, say, a good sandstone or good limestone that had porosity and permeability. You could recover the oil. So essentially, the advances were going straight to the source and just getting the oil and gas where it was generated, and still often is.Patrick: So my limited understanding of geology is that we have, essentially, pseudo-randomly generated subsurface features due to some combination of physics, chemistry, and plain old luck, and some of those subsurface features are amenable to creating oil, gas, et cetera, and then capturing them in such a way that in the last several hundred million years, it didn't just escape into the atmosphere uselessly.And so, we explored to find which places in the world had those weird combinations of features, and certain combinations of features were exploitable by technology that we had back in the day. Certain combinations of features, we were aware they had oil and gas around them because we understood physics, but didn't have the technology to repeatedly exploit them in an economical fashion.And as a result of technological development, we have essentially found the capability to exploit resources that were not previously economically exploitable. Do I have that roughly right in terms of science and engineering?The history and development of fracking techniquesAustin: Yeah. And it's a very common theme as we're seeing this – we had the same thing with geothermal where we were only going for special features, and now essentially we're going for that source. Then also we'll see the same thing if geological hydrogen ever becomes a thing where, right now, you have people looking for those special features – if they even exist, we don't know that they do – but really long term, if you're probably going to make that work in a big way, you're going to be going right to that iron-rich rock and feeding it with water to do the reaction and all that kind of stuff.Patrick: So for folks who might not have heard the term geological hydrogen before, the hypothesis is that there are some places in the world where hydrogen gas is naturally occurring as a result of superheated iron-dense rock, which causes, presumably, the breakdown of water into oxygen and hydrogen. The oxygen does something, hopefully doesn't explode on us, and then the hydrogen is available for tapping as a potent, high-density energy source – that is the rough idea, presumably.[Patrick notes: I am not sure whether I remembered that iron catalyzes that reaction from chemistry class or from video gaming.] Austin: Right. And I think hydrogen is just always tough because you have so little mass that comes with a volume. Like, if you think you have a certain reservoir volume of oil, you have way, way, way more mass than you have with hydrogen. There's just not very much hydrogen in there. And so, almost implicit in this, if we're going to find a special feature where you can actually produce hydrogen, is that there's actually active generation going on, replenishing it, because it's not just going to sit there for a long time.Patrick: And so effectively there the hydrogen becomes a replenishable transport mechanism for tapping the latent waste heat in the earth and moving that up to places where humans could actually make use of it.Austin: Yeah. I think actually, you're talking about the oxygen – I'm pretty sure the oxygen actually gets locked up in the rock. So it's more like you're taking advantage of the earth’s latent reduction potential in its rocks, as opposed to heat there.Patrick: Oh, okay. So, as you know (because we've previously talked about it), I've been going out a bit of a geothermal bender recently, and one of the things that I've learned – or I believe myself to have learned in the course of researching geothermal – is that heat within the crust of the earth comes from the breakdown of trace radioactive elements, rather than whatever magical energy source that I thought was providing it. I just sort of always assumed, “ehh, the center of the earth is really, really hot for random reasons, and has stayed like that forever because the earth is a good insulator.”And it turns out like, no, actually, heat is generated over time in the same way that it radiates into space over time, and we are not simply at equilibrium; there continues to be heat energy added as radioactive decay of nuclei happens.Austin: Yeah. And I think one thing people don't quite always get at first about geothermal is that – actually, I get this question a lot – they do the math on what that flux is and what the heat being generated is, and it’s actually very, very low; it's like, “well, why is anyone excited about geothermal?”Really what we're doing with geothermal is mining the heat that's already in the rocks, because the rocks are dense enough and they're hot enough that they actually hold a pretty enormous amount of energy. It's all about mining heat, as opposed to taking advantage of that ongoing generation.Patrick: And the mass of the earth is just – you know, on the one hand, we have a very good approximation for that number; on the other hand, it has so many zeros in it that it sort of boggles human comprehension. The mass of the earth relative to all human activity is very large, so we can siphon a very small percentage of heat from it for a very long time if we successfully work out the engineering kinks.[Patrick notes: 5.97 x 10^24 kg. If a carbon atom massed 10 kg, then a mole of carbon atoms would have approximately the mass of the earth. A mole of carbon actually masses about twelve grams because carbon atoms are really tiny. Or, to put it another way, if all of the ~120 billion humans who have ever lived had equal shares in that mass, your share would be 50 trillion kg, or about the U.S.’s production of cement if we hold it constant for the next 500 years. And I certainly hope I did not flub this calculation by an order of magnitude or three in any direction, but this is what incomprehensibly large means.]Patrick: Talking about working out the engineering kinks, if you rolled back to the popular discourse around energy economics when I was an undergrad in the early 2000s, Peak Oil was all in vogue, “we're going to run out of this,” et cetera. The peak oil thesis, for those of you who haven't heard this before, was this theory that, looking in the rear-view mirror, there was a year in which we had extracted more oil and gas than we ever would again in the future history of the earth – that the resources were depleting and, you know, they only go in one direction. And so the theory said that we had tapped the easy stuff, there was no more easy stuff, and we were locked into a future of declining energy abundance, as just a consequence of physics.[Patrick notes: I’m being somewhat unfair to Hubbert here, given that he prognosticated the peak decades in advance using advanced-for-the-time curve fitting. But, at the point where I was in university (2000-2004), Peak Oil was considered a historical fact for the U.S. and an inevitability for the world within ~20 years.Fast forward twenty years: “U.S. produces more crude oil than any country, ever” tells the tale very succinctly.] Patrick: My narrative for fracking is, we are not simply in a battle against physics – we also have human ingenuity, which allows us to bring things that were not previously in the equation into the equation as a result of engineering advances.[Patrick notes: I award my college self a cookie for consistently telling the debate team that Peak Oil was in fact unlikely due to technological progress, despite the reams of evidence we had “cut” where c'''
