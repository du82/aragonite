title = "The future of pandemic preparedness, with Joshua Morrison"
description = "Operation Warp Speed, lessons learned and as-yet unlearned about the pandemic, and a peek at near-future technology against infectious disease."
full_description = 'The future of pandemic preparedness, with Joshua Morrison Patrick McKenzie Dec 19th, 2024 Operation Warp Speed, lessons learned and as-yet unlearned about the pandemic, and a peek at near-future technology against infectious disease. This week I had a conversation with Joshua Morrison, CEO of an advocacy non-profit (1DaySooner) focused on increasing the uptake of challenge trials and other mechanisms to better fight infectious diseases. We discussed the history of Operation Warp Speed, some of the unfortunate and complicated political economy of vaccines in the U.S., and the future of improvements to the built environment to decrease exposure to respiratory diseases.SponsorsSupport proven charities that deliver measurable results and learn how to maximize your charitable impact with GiveWell. Go to givewell.org (and type in "Complex Systems" at checkout).Check is the leading payroll infrastructure provider and pioneer of embedded payroll. Check makes it easy for any SaaS platform to build a payroll business, and already powers 60+ popular platforms. Head to checkhq.com/complex and tell them patio11 sent you.Timestamps(00:00) Intro (00:56) The role of challenge studies in vaccine development (09:24) Understanding vaccine platforms (18:33) Sponsor: Check (19:46) Regulatory system insights and future improvements (20:41) Lessons for our regulatory system (29:55) First doses first debate (37:35) The surprising nature of COVID-19 (39:30) Vaccine hesitancy and public communication (42:08) Political influence on vaccine distribution (58:28) Indoor air quality and disease prevention (01:06:52) Future of public health initiatives (01:12:27) Wrap [Patrick notes: As always, I have included commentary below, set out in this fashion. This transcript has been massaged by an LLM and is designed for readability rather than for being a court stenographer.I make some points with an unfortunate amount of political valence, and must therefore disclaim that I am only speaking for myself and not on behalf of VaccinateCA, Call The Shots, Inc., or anyone else affiliated with the effort, including team members, funders, partners in government or industry, etc.And, as always, Complex Systems is a personal project of mine, and not everything said by myself or guests is endorsed by e.g. advertisers or other organizations I may be affiliated with.]TranscriptPatrick McKenzie (patio11): Hideho, everybody. My name is Patrick McKenzie, better known as patio11 on the Internet. A quick disclaimer before we dive in—I have strep at the moment, so I might not sound as great as usual. Not that I normally sound great! I hope you can power through and join me for a conversation with my friend Joshua Morrison, who leads 1Day Sooner.1Day Sooner is an advocacy organization focused on advancing scientific progress in the fight against infectious diseases. Joshua, thanks for coming on. I’ve given the brief overview, but can you delve a little deeper into 1Day Sooner’s work? After that, we’ll talk about the recent history of infectious diseases—a story that’s both traumatic and inspiring.The role of challenge studies in vaccine developmentJoshua Morrison:Thanks for having me, Patrick. 1Day Sooner started about four and a half years ago, at the height of COVID in March 2020. Our initial focus was on promoting challenge studies to help develop COVID vaccines and learn more about the disease.A challenge study is when participants are deliberately infected with a disease under controlled medical conditions, often in quarantine, to either learn about the disease or test vaccines. Early in the pandemic, there was significant public interest in participating in such studies. In fact, about 40,000 people from 165 countries signed up on our website to volunteer for these trials.Our goal was to accelerate COVID vaccine development. However, for various reasons—scientific readiness, ethical debates, and timing—challenge studies weren’t conducted before the first vaccines showed efficacy in November 2020 or were approved in December 2020. That said, COVID challenge studies did eventually take place in England, starting in May 2021, and they’ve provided some valuable insights.At its core, 1Day Sooner represents people who are willing to take calculated risks by participating in studies that push the frontier of infectious disease research. Our focus is on combating diseases that disproportionately impact people in poorer countries, such as tuberculosis, hepatitis C, and group A strep—the very thing that’s giving you trouble today. We’re also concerned with diseases that can lead to pandemics, like COVID or pandemic flu.Our work spans several areas, from supporting individual clinical trials to advocating for broader technologies, such as malaria and hepatitis C vaccines. We also promote innovations like indoor air cleaning with far-UVC light. Alongside these efforts, we engage in policy development to enable and advance these critical interventions.Patrick McKenzie:We’ll come back to indoor air cleaning in a moment—it’s one of my personal weird interests—but let’s start here:It was the best of times; it was the worst of times. The pandemic is still fresh in everyone’s memory—unless someone was literally born yesterday. On the one hand, there were massive failures across nearly every axis: political, scientific, pharmaceutical, and societal. Underperformance happened at almost every level.On the other hand, we witnessed a world-historical success: vaccines were brought to market faster than any medicine in history and distributed to an unprecedented number of people in under 12 months from development. That is extraordinary.A significant part of that success is attributable to a government initiative called Operation Warp Speed. For the benefit of anyone who hasn’t geeked out on this topic—or who thinks vaccines might fall off trees—can you explain what Operation Warp Speed was and how it came to be?Joshua Morrison:Yeah, so basically, Operation Warp Speed represents what the U.S. government—or really, humanity at large—does when you absolutely need a vaccine and are willing to throw immense resources at the problem to get it as quickly as possible.What does that look like in practice? With COVID, it was essentially a combination of a few key strategies. First, there was what’s called “push funding.” The government selected about half a dozen vaccine candidates, assembling a diversified portfolio of bets. The idea was that if these bets panned out, there was a high likelihood of having an approved vaccine by the end of 2020.This wasn’t the traditional approach of one pharmaceutical company working on one specific candidate. Instead, they operated at the level of the entire field, effectively hedging bets across multiple approaches.But that’s only part of the story—there were two other critical pieces to the puzzle, which I—Patrick McKenzie:Let me just elaborate on that briefly for anyone unfamiliar with this field, and please correct me if I’m off base. This isn’t my area of expertise.When a pharmaceutical company talks about a “candidate,” they’re usually referring to a molecule or a combination of a molecule and a delivery system. In the case of the COVID vaccine effort, we weren’t searching for just one molecule out of all possible molecules. We were looking for any viable combination of a molecule and a delivery system that could safely and effectively prevent COVID.There were also sub-goals involved—things we can dive into in a moment—but the overarching idea was to identify and support a portfolio of six likely candidates that could lead to an efficacious vaccine. So, once those candidates were identified and the government provided significant funding up front, what happened next?Joshua Morrison:So, once the government gave companies significant funding up front, they also introduced an innovative mechanism called "pull funding," or "demand funding," through advanced purchase agreements. Essentially, the government guaranteed that if a company’s vaccine received FDA approval, it would purchase a set number of doses—often a couple hundred million—at a pre-agreed price, something like $20 per dose.This created a clear and substantial demand for the vaccines, ensuring there would be a purchaser. That was a huge incentive for companies to invest heavily in development.At the same time, the FDA operated differently than it usually does. No corners were cut, and all the same rigorous steps were followed, but everything happened much faster. This was achieved through a surge in regulatory capacity and advanced guidance to companies. The FDA explicitly communicated what they expected from the vaccines. For instance, they stated they wouldn’t approve a vaccine that was less than 50% effective, among other criteria in the target product profile.This clarity helped companies understand exactly what they needed to achieve. Additionally, the FDA worked around the clock. In a typical scenario, if a company wanted to run a trial, they’d submit paperwork and wait 30 to 60 days for a response. Under Operation Warp Speed, submissions sent at 5 PM might be reviewed and returned by 9 AM the next day because the FDA staff were working overnight in shifts.Another critical component of Operation Warp Speed was the involvement of the Department of Defense (DoD). The DoD handled much of the contracting, procurement, and hands-on coordination with companies. They were also heavily involved in the logistics of vaccine distribution, which added a significant level of operational expertise to the initiative.Patrick McKenzie:Right. I won’t rehash everything I’ve semi-expertly absorbed about the distribution story, especially the hiccups after the baton was passed to the rest of civil society. But setting that aside, I think it’s important to underline a couple of things.[Patrick notes: In 2021 was the CEO of an initiative (VaccinateCA) which attempted to patch holes in our distribution strategy, mostly around no one having an actual understanding of where the vaccine was presently available. If you were able to successfully Google for the vaccine, you were very likely downstream of our work. For more on that subject, see the Story of VaccinateCA or the previous episode with Dave Kasten, who was a volunteer on the project.] Patrick McKenzie:First, we should be profoundly thrilled that this effort was even possible and that we ended up in a world where a successful vaccine existed by the end of the year. That wasn’t guaranteed—there were certainly possible outcomes where no vaccine materialized on that timeline.Second, while the FDA brought extraordinary competence and regulatory capacity to this effort, it’s fair to say they don’t typically operate with the same level of urgency or enthusiasm for quick results in a normal year, for a standard drug or disease.[Patrick notes: In describing the FDA as being extraordinarily competent in 2020 I am grading it against a curve composed of “The FDA” and not “institutions which I broadly believe are competent.” You can take the salaryman out of Japan, but you can’t take the salaryman out of the salaryman. There were some decisions by the FDA in 2020 which I consider to be on the spectrum from “extremely suboptimal” to “outrageous.” We will discuss some later in the episode.]That said, there were still gaps in this process. Can you talk a bit about where those gaps were?Understanding vaccine platformsJoshua Morrison:Before I get to the gaps in Operation Warp Speed, I think it’s important to talk about the prehistory that set the stage for its success. You mentioned luck earlier, and there was definitely an element of that, but there was also a tremendous amount of groundwork laid before the pandemic that allowed us to develop successful vaccines so quickly.One major factor was the development of the mRNA vaccine platform. This was a long-term effort involving academia, private industry, and government funding. Private companies like BioNTech and Moderna were instrumental in innovating on the platform, but they stood on the shoulders of academic pioneers like Katalin Karikó, who, despite not always being treated well, made groundbreaking contributions.Government funding also played a critical role, particularly from agencies like DARPA and the NIH. For example, DARPA, led by people like Dan Wattendorf (now at the Gates Foundation), supported foundational work, while the NIH funded Moderna’s phase 1 studies for pandemic flu using the mRNA platform.There was also important work done on viral vector platforms, like those used by Johnson & Johnson and AstraZeneca. While these turned out to be less effective in the U.S. compared to mRNA vaccines, they were still a crucial part of the global vaccine effort.Patrick McKenzie:Let’s pause for a quick timeout to explain the difference between these vaccine platforms, particularly for anyone who hasn’t been immersed in the topic.The mRNA platform represents a completely novel way to create vaccines—an enormous scientific advance in the history of humanity. It works differently from the live virus or weakened virus vaccines you might remember from high school biology. For example, take the cowpox vaccine, which was key to eradicating smallpox. The idea there was to infect someone with cowpox, a virus similar to smallpox, but far less dangerous. The immune system would then develop immunity to both cowpox and smallpox without the deadly risks of the latter.mRNA vaccines, however, don’t involve any virus at all. Instead, they stimulate the immune system in a way that teaches it to produce antibodies without requiring live-fire exposure to an actual virus. To oversimplify a bit, the vaccine delivers instructions—messenger RNA, hence “mRNA”—that prompt your body to produce a harmless piece of the virus, like the spike protein on COVID-19. Your immune system learns to recognize and attack that protein, so if it ever encounters the real virus, it’s ready to fight it off.By contrast, weakened virus vaccines work by giving the immune system a deactivated or incomplete version of the virus. Imagine the virus is like a ball with a distinctive shape. A weakened virus vaccine might break that ball into pieces and show those to your immune system. Your immune system learns to recognize the shape and can respond if it encounters the whole virus later.Quick refresher on high school biology complete—back to you, Joshua.Joshua Morrison:Can I be a bit pedantic about a couple of small things?Patrick McKenzie:This is the pedantry podcast!Joshua Morrison:Okay, so, yeah, the explanation about smallpox was great. But for Operation Warp Speed, there were actually three different types of vaccines that received funding.First, there were the mRNA vaccines, which we’ve already discussed. Then there were viral vector vaccines, which are a bit different. And finally, there were protein-based or protein subunit vaccines.The protein subunit vaccines '
