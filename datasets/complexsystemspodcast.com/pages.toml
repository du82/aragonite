title = "Stablecoins and shenanigans, with Zeke Faux"
description = "Zeke reported an IRL game of Where is Carmen Sandiego except she's a crypto-enabled money launderer."
full_description = '''Stablecoins and shenanigans, with Zeke Faux Patrick McKenzie Feb 13th, 2025 Zeke reported an IRL game of Where is Carmen Sandiego except she's a crypto-enabled money launderer. This week I'm joined by Bloomberg investigative journalist Zeke Faux. He's been the mainstream media's most dogged reporter on the Tether beat, and wrote what I consider the best book yet on cryptocurrency: Number Go Up. (I reviewed it.) In addition to discussing the quilt of red flags, we talk about pending legislation to regulate stablecoin issuance in the U.S., and also the synthesis of investigative journalism by institutions, experts without press badges who still buy e-ink by the barrel, and the Baker's Street Irregulars of cryptoskeptic Twitter.[Patrick notes: I add notes, set out in this fashion, after recording the episode. As I was writing those notes, while I feel like my prior writing on stablecoins talks about the potential of it, there was an opportunity here to present the bull case—so to speak—in more depth than we did. I got too fascinated by our rollicking conversation and ran out of time. So, docking myself one cookie, and committing to writing something on that at some point in the future.]SponsorsCheck is the leading payroll infrastructure provider and pioneer of embedded payroll. Check makes it easy for any SaaS platform to build a payroll business, and already powers 60+ popular platforms. Head to checkhq.com/complex and tell them patio11 sent you.Timestamps(00:00) Intro (00:45) The GENIUS act of 2025 (02:28) Tether's audit controversy (05:49) The origins and impact of Tether (08:17) Investigative reporting and red flags (12:58) Tether's shady business practices (19:23) Tether meets SBF (21:40) Sponsor: Check (22:51) New anecdotes in the Number Go Up paperback (28:53) The role of stable coins in crime (38:20) The importance of AML and KYC rules (44:21) Financial privacy (45:18) Sam Bankman-Fried's conference in the Bahamas (47:14) Loot NFTs (49:34) Axie Infinity: a case study (52:30) Crypto's real-world consequences (58:15) Regulation and financial safety (01:05:40) Stablecoin bill and ownership limits (01:06:50) Political realignment and crypto (01:14:40) Citizen journalists and the crypto-skeptic community (01:20:36) The abilities and limitations of institutional journalists (01:26:00) Wrap TranscriptPatrick: Hideho, everybody. My name is Patrick McKenzie, better known as patio11 on the internet, and I'm here with my buddy Zeke Faux, who's an investigative journalist at Bloomberg and the author of "Number Go Up."Zeke: Hey, Patrick.Patrick: Good to have you here. As I mentioned in my review of it - and I'll link it in the notes - "Number Go Up" is my favorite crypto book, which is appropriate because it's going to be a very crypto day for both of us. So, do you want to kick things off? What's new in the world of the stablecoin bill?The GENIUS act of 2025Zeke: Well, as we speak, I think there's a hearing going on in the house where they're talking about this bipartisan stablecoin bill, which they call the GENIUS bill.[Patrick notes: One of these days we will learn our lesson about forced acronyms. Today… is not that day. On the plus side, I can look forward to describing acts of GENIUS on Twitter.The sponsors have so some comments on the bill which are easier for lay readers than the text itself, if that floats your boat.] Zeke:This is the Guiding and Establishing National Innovation for US Stablecoins of 2025 Act, which forms the acronym GENIUS Act. It's sponsored by Tim Scott, who's the chair of the Senate Banking Committee, and Kirsten Gillibrand, who's a Democrat from New York. So there seems to be some support for it.Basically, it's going to require stablecoins to hold safe assets and to publish audits. If you don't know what stablecoins are, these are cryptocurrencies that are supposed to be backed one-to-one with dollars in a bank somewhere. The most popular one, which was a big part of my book "Number Go Up," was - or still is - Tether. Right now there's more than 130 billion worth of Tether outstanding.Tether's audit controversyThere's also a rival stablecoin called USDC, which is issued by a US company called Circle. Circle would likely have little trouble complying with this stablecoin law since they already are publishing these audits. [Patrick notes: I concur with respect to the part which is about composition and disclosability of the reserves, but for what it is worth, there are other requirements. That said, if you had to pick which of the two has any prayer of complying…] But Tether famously has always said that they are about to publish an audit but have never done so, and only put out these lesser documents called attestation reports.Patrick: And Tether has been saying that about the audit since, if I remember off the top of my head, 2017. It was a month away… and it's been 1 to 3 months away since 2017. [Patrick notes: 2017 is accurate; their forecast timeline changes periodically.]Zeke: Yeah. And their claim is that the big auditing firms do not want to take the risk of signing off on Tether. I'm a bit skeptical of that. I feel like service providers will take on clients - they might ask for hazard pay if they think it's dangerous. What do you think?Patrick: I think Tether also said at one point that one of the firms they approached was asking [Patrick notes: following is a paraphrase] "intrusive questions that they didn't need answers for."My read on that - for folks who have never worked in an audit firm, and I've never worked in an audit firm, but I have some reading knowledge of how this works - they need to understand how you do business so they can probe at the controls of the business. This allows them to represent that the combination of statements they have from management and testing of things on a transaction level actually materially represent the financial health of the firm, and that the numbers published in the report are believable by interested parties up to some standard.So these would be extremely basic things like "Tell me about your internal controls" and "Who is sending you money and how do you know when that money arrives that it is the amount you were expecting?" AAnd when Tether's character witness, one Sam Bankman-Fried, went on Bloomberg Odd Lots [Patrick notes: transcript (Bloomberg paywall); Spotify link] to discuss how Tether did issuance from his perspective, he said - and not to put words in Sam Bankman-Fried's mouth because he had many words to say about it - but I will paraphrase that they're extremely attentive to DMs but the processes are just a little bit weird and cowboy compared to USDC, which was a comparison he explicitly made.[Patrick notes: Bloomberg does verbatim transcripts, and you can read it by Ctrl-F “Like, can you do it? You can do it.”, but I think that quoting someone with the included level of disfluencies is below my personal standards, and so I will take the liberty of editing SBF’s remarks in the fashion I would edit my own. (I have, at some times in my life, had a speech impediment, and I am acutely aware that there are conditions under which a verbatim transcript of my speech would not redound to my favor.)Can you do [redeem Tether]? You can do it. We have done billions but it's a messy process. It works, but, compare it to redeeming USDC. They have their U.S. dollars in a U.S. bank account, at the same bank that everyone else in crypto uses. It takes thirty seconds to create a book transfer, and then 30 seconds later, they send you your USDC. You can redeem them 30 seconds later, and they will immediately transfer you good funds. No fees are charged. It is a straightforward and smooth process.Compare to Tether: it’s a messy process. Every piece of mess in the process makes it harder for them to present as having a self-evidently reasonable process. It gives you a heightened sense that something weird is going on.Patrick elaborates: The bank that everyone at crypto banked at was Silvergate Bank. It is no longer with us. The real-time settlement API that Silvergate made available, the Silvergate Exchange Network, enabled more than $1 trillion of unsurveilled transactions, including by SBF et al. See Debanking (and Debunking?)’s discussion of Silvergate’s windup.] Zeke: And let's just say if Sam Bankman-Fried is saying that your internal processes are subpar - this is a guy whose payment systems ran on emojis and who was actually stealing all of his customers' money using those emojis. So it's not a very good endorsement.Patrick: I have to defend the honor of FTX on this narrow point because I do think that plausibly you can run a compliant expense reporting system on Slack using emojis if you have audit logs enabled. And depending on the nature of the risk and totality of controls of the business involved, that could be reasonable for a startup.Zeke: Maybe a better criticism - this was a guy who, when his firm was going bankrupt, found bank accounts that he had forgotten about that held hundreds of millions of dollars.Patrick: Yeah. And whose primary accounting software was some combination of QuickBooks and Google Spreadsheets, and who had eight candidate balance sheets depending on the needs of the moment.The origins and impact of TetherZeke: Well, I want to roll this back a little bit because I feel like Tether is what brought us together. If you haven't heard of Tether, it's really a very funny company. It's what got me into this - I'm not a crypto reporter. I've always wanted to write an adventurous nonfiction book, and crypto just sort of came to me as this opportunity to do it. And it came through Tether.My boss in 2021, the editor of BusinessWeek, asked me what I knew about it - he thought it might be a good story. When I started looking into it, I was shocked. At that point it was much smaller, but they still had more than 50 billion tethers outstanding. So if they're supposed to have 50 billion in the bank somewhere, but you'd ask these people about Tether in the industry, and they would say, "Oh yeah, Tether, yeah, I use it every day. I send and receive billions of dollars of Tether, but yeah, it's super sketchy. Could it be run by the CIA?"Patrick: I'm glad you said that because it's been darkly hinted in many quarters that this is clearly an intelligence asset and that's why they're protected. But many explanations that people have advanced - or hypotheses more than explanations - don't have the ring of truth to me. What does have the ring of truth is that there are epiphenomena to many industries that collect characters that are on a spectrum from "kind of weirdo but basically harmless" to "other than salubrious" to "parasites or criminals," and Tether is somewhere on that spectrum. I think everybody would agree. I said pretty confidently back in 2019 that they're the largest fraud since Madoff - that has now been decisively disproven because they're larger than Madoff ever was.[Patrick notes: Was that the first time I had the thought? No. It was the first time I could beat the libel suit. See some hashed predictions for earlier versions of the thought evolving over time.] Investigative reporting and red flagsZeke: I want to get into that. When I started looking into Tether, one of the things that attracted me to it was I found a lot of crypto kind of impenetrable, but with Tether, the question was: do they have this money? They say they got 50 billion, but they won't prove it. And there's a lot of evidence that they've been lying about it in the past.In your review - and thank you for the very thoughtful review of the book, it really meant a lot to me. One of the coolest parts about writing a book is seeing people engage with it. I actually enjoyed your criticisms of it too. But you talk about the role of investigative reporters. Actually, what I found is that a lot of times what people think the investigative reporter is going to totally nail everything. But often what the investigative reporter does is merely point out some of the red flags. And once they've done that, that sparks someone with subpoena power to do a bigger investigation. The stories that are credited with exposing the Enron fraud were actually very mild. [Patrick notes: Extremely common for all sorts of detection of malfeasance! One of the things which did Stephen Glass in was he described an event at a hotel, and when someone went to that hotel, the physical layout of the hotel was incompatible with his description.] Patrick: As I wrote in the book review, you have the best line about Tether from one of your early pieces on it. I think it was "Anyone Seen Tether's Billions?" And I'm a man who doesn't experience jealousy often in life, but I experienced jealousy for not having written this line: "Tether is quilted out of red flags."But it's true - they jumped off a tree of nonsense and hit every branch on the way down. They say things like "we are fully reserved and have 100 percent adequate liquidity over any 24-hour window in our history," which is mind-blowing. One, that you would think that is adequate. Two, that you would say that. They denied for years that they were holding billions of dollars of Chinese commercial paper because billions of dollars of Chinese commercial paper are not necessarily one-to-one swappable for U.S. dollars in all environments, to put it mildly. And then it turned out, "Okay, yeah, we were holding billions of dollars of Chinese commercial paper, but what of it? Now our money is at Cantor Fitzgerald."And then Cantor Fitzgerald CEO, Howard Lutnick - also a character - gave what I would describe [Patrick notes: and did, contemporaneously, describe] as an extraordinary vouching for them, saying in front of an audience essentially, "Questions have been swirling for years. Do they have all the money? I've seen so much stuff." This is not a quote, this is a paraphrase, but it's pretty close: "Our team has seen so much stuff. I'm telling you, they've got it."[Patrick notes: Per Bloomberg Television, the quote: They have the money they say they have. … I’ve seen a whole lot and the firm has seen a whole lot and they have the money. And so there has always been a lot of talk ‘Do they have it or not?’ and I am here with you guys and, I am telling you, we have seen it and they have it.]Patrick: When I read that, I thought: if you asked Jamie Dimon, "Does Bank of America have all the money?" …Under no circumstances is Jamie Dimon going to say "Yeah, please sign me up for every variety of liability if Bank of America ever screws up on anything in the future." No, he's going to say something anodyne like "Bank of America's a huge institution, well regarded, and extensively regulated. With regards to the portions of business that they do with us, we've underwritten them to our standards." And then if you probe them on it and say "But do they have all the money?" he's got to say "What didn't you understand the first time?” and think “I’m n'''
