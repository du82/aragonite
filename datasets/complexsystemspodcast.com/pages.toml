["https://www.complexsystemspodcast.com/episodes/tech-government-dave-kasten"]
title = "That time we accidentally created national healthcare infrastructure, with Dave Kasten"
description = "Dave Kasten and I worked on VaccinateCA together, which taught us a bit about the tech / government interface."
full_description = '''That time we accidentally created national healthcare infrastructure, with Dave Kasten Patrick McKenzie Sep 5th, 2024 Dave Kasten and I worked on VaccinateCA together, which taught us a bit about the tech / government interface. I met my friend Dave Kasten for real, after being Twitter mutuals, when we mutually rolled up our sleeves to fix America's inability to remember where it had misplaced the covid vaccine back in 2021. That effort probably ended up saving a few thousand lives.I've written (and done an interview or two) about VaccinateCA before, but usually at a relatively high level, and wanted to go into the nitty-gritty of the technical, operational, and occasionally moral decisions in getting important work done quickly. Dave also works in the intersection of tech and policy, and has an optimistic and helpful perspective on that engagement, which I think many of us can learn from.[Patrick notes: I pepper transcripts with other-than-contemporaneous commentary, set out in this fashion. I continue to think takeaways from the vaccine rollout, including some uniquely generated by VaccinateCA, are very important for our nation to digest.I am a little bit less than reserved about describing the truth of the 2021 situation. In some places, this is unavoidably political, though not particularly partisan. And thus here is a disclaimer: while I think I'm being true to my recollection (and notes/electronic records/etc) of a chaotic time, my opinions are not necessarily shared by Call The Shots, Inc. (the 501c3 which ran the VaccinateCA project), or by other board members, employees, donors, or volunteers to the effort, or by other organizations I have been or am affiliated with.Also note that sometimes these notes will appear in the transcript in the middle of Dave talking and this is me reacting to what he is saying, not necessarily him agreeing with my reaction. It's not an improv game and he doesn't necessarily intend for me to "Yes and" him in a very different direction.]Sponsors:Check is the leading payroll infrastructure provider and pioneer of embedded payroll. Check makes it easy for any SaaS platform to build a payroll business, and already powers 60+ popular platforms. Head to checkhq.com/complex and tell them patio11 sent you.Building an enterprise-ready SaaS app? WorkOS has got you covered with easy-to-integrate APIs for SAML, SCIM, and more. Start now at https://bit.ly/WorkOS-Turpentine-NetworkTimestamps (00:00) Intro (00:23) Dave Kasten’s unique career path (01:37) The beginning of VaccinateCA (03:09) Early challenges and volunteer efforts (07:24) Volunteer coordination and call center operations (10:55) Navigating policies and procedures (14:33) Navigating policies and prioritization (21:00) Adapting to volunteer feedback (22:50) Sponsors: WorkOS | Check (25:07) Public reception and media involvement (35:40) Government and institutional responses (45:59) Differences between tech and government approaches (47:52) Challenges in pandemic information dissemination (49:10) Accuracy and information systems (53:43) Government and agile development (56:51) Bureaucratic constraints and historical practices (01:08:55) Government workforce and technological challenges (01:22:34) The importance of policy engagement (01:33:42) Wrap You can Ctrl-F many of these in the below transcript. Sorry, I can't link them, due to technical limitations on some platforms. TranscriptPatrick: Hideho everybody, I'm Patrick McKenzie, better known as patio11 on the internet, and I'm here with my buddy Dave Kasten.Dave: Hi Patrick, great to be here.Dave Kasten's unique career pathPatrick: So, Dave is another person that has… let's say, a little bit of a weird career history. We won’t touch on most of it because there aren’t all that many common threads – you worked at Blizzard Entertainment, McKinsey, and now helping the tech community understand policy folks in DC, where you’ve been for the last 15 years or so – but we ended up on each other’s radar back in 2021 when we were doing VaccinateCA. VaccinateCA ended up being something like “a clearinghouse for vaccine location information in the United States.” You were a volunteer on that effort, and that’s how I got to know you; I ended up accidentally falling backward into the CEO chair. I just want to talk in very granular detail about what doing hard things looked like, in that we were not governmental exactly, but definitely rubbed elbows with some folks in those spheres.[Patrick notes: I have written about the big picture story of VaccinateCA (warning and/or promise of depth: 27,000 words!), but don’t think we’ve covered the “so what did y’all actually do every day?” in enough depth for people to copy tactics/strategy into their own projects, and so thought it would be useful to talk to Dave about that prior to talking about the broader tech/government engagement question.]Patrick: Then we can talk more at a 30,000-foot level of detail about what engagement with policy folks looks like from a “doing-things-in-the-world” perspective.Dave: Yeah, sounds great. The beginning of VaccinateCASo it would be helpful for me to start by talking about how I got involved with VaccinateCA and how that evolved over time?Patrick: I would love to hear it, because honestly, I didn’t know anything about anybody until they showed up in Discord. [Patrick notes: Where all important public health infrastructure is built! Also, notably, community software / Slackalike most commonly used by gamers, for those audience members who have not used it.]Dave: As is probably the case for a decent number of listeners to this podcast, you are someone who has been on my radar as a person on Twitter–I refuse to say X, it’s Twitter still–for quite some time. I think probably we had tweeted back and forth with each other maybe a very little bit prior to that–I certainly wouldn’t say that we were friends, or even really acquaintances at that point–and then I remember when you tweeted out, in January of 2021 I guess it was, “Hey, it sure would be a good idea if somebody was to call a bunch of pharmacies and write down on the internet where the places that have vaccines are, because it turns out nobody actually has that information.”[Patrick notes: To restore now-deleted context, I quoted tweeted someone reacting to one of many news stories saying vaccine discovery in California was borked with a thread beginning thusly:]Dave: I remember seeing that as I was going to bed, and I thought, “I wonder what’s going to happen with that.” A little part of me was like, maybe I should say, “Yeah, sure, I can try to do a little of that.” Then I kind of forgot about it, because it was January 2021. I think we were all a little burned out at that point in time.Then the next morning, I logged back online and – in between doing my day job, which was at McKinsey at the time – I saw, “hey, there’s something here”; there continued to be people doing stuff.Early challenges and volunteer efforts I actually remember that, at that point, it wasn’t even a Discord server, right? The very first step was a Google Doc or Google Sheet or something, where it was just a list of pharmacies, I think in the SF area – calling them, and as you did it, you’d just fill in what you had learned.I did maybe five or ten of those—I forget, honestly—and put the results in. I think they were all "no's" at that point in time – I think it is important to remember, that although we ended up getting into cadence where there are a lot of yeses later on, early on it was basically just getting the metaphorical door slammed in your face very politely, over and over again.[Patrick notes: I recall us as having had the Discord from within an hour or two of the tweet going live; it was where most of the communication happened on the first day. Most people in the Discord had been invited via text message and similar by Karl Yang, who found it on Twitter. This was an extremely ad hoc effort which used mixed online and offline social networks to recruit the dozen-ish “coordinators” who did most of the heavy lifting in the first week or two, and most of our early volunteers.]Patrick: It’s worth pausing for the audience that wasn’t there in those early days: the reason this project needed to exist was that there were thousands of people across California—tens of thousands—who were either patients or, more commonly, caregivers for patients, often the children of folks who were advanced in years, who were sequentially doing this exact exercise, calling a bunch of pharmacies and getting told no.[Patrick notes: Frequently they, like we for the first few hours, were calling healthcare providers other than pharmacies, out of the mistaken impression that that was likely to actually work. Most doctors had no allocation, were not scheduled to get an allocation, and were never going to be told they had no allocation. State and national planners who knew that fact did not consider it their job to get on the nightly news to say “When the governor said ask your medical professional, to be clear, unless they spontaneously offer it you’ll have a much better time asking your pharmacist than your doctor.”] Patrick: The thing that had motivated me to tweet was reports of people calling upwards of 50 or 60 places prior to finding one that had the vaccine available. I thought, “this would be much more efficient if someone could just centralize this.” The way you centralize it – that actually worked for centralizing it – was to get told the "no's," so other people didn’t have to hear those no's.I remember there was an early discussion among us about “is this being abusive of the medical system?” because we were making phone calls into the system at a time when the system was getting an awful lot of calls. Our decision, which was heavily overdetermined but it’s worth noting that smart people actually had this discussion, was that “it’s better to get told no, and have one net new phone call have to get answered by a medical professional, when we can put that on the Internet and thus avoid many phone calls at the margin versus not making that one sorta-imposition call.”[Patrick notes: This should be a pass/fail question for getting to work as a medical ethicist. You would think all ethicists would pass, right. Right.]Dave: Yep. And I think, jumping ahead, related to that for a second in the story, one of the things we got quite sophisticated about at Vaccinate CA over the course of it was (1) how do you sort of take someone off of your list temporarily or permanently? There was a particular healthcare-related entity, I'll avoid mentioning them, that essentially said, “hey, could you never call us?” For a variety of reasons related to how they distributed stuff they said, “look, we're never going to have useful information for you and it's really annoying.” And we said, “Sure.”There were a variety of other settings we had internally within the system that evolved over time based on what we were seeing, about like, "don’t bother to call us back for a certain number of days," "don't bother to call us back until some sort of situation change,” in one sort or another – either in free-form notes, or we had switches we could throw in our databases. Then, of course, there were famous examples of the times we called horse hospitals, which politely informed us that they in fact would never have the COVID vaccine unless and until the equine industry got into vaccinating those fine mares and steeds as well.[Patrick notes: We also had a “despite ending up in the database this is not actually a medical provider and will never receive an allocation and so we should spend zero resources on it in the future” label. Because we were a team heavily steeped in Internet culture, that flag was sir-this-is-an-arbys. If you are less online than America’s vaccine location infrastructure mavens, see here.\]Patrick: I will say – tying in a little bit of off-topic information – the California Veterinary Medicine Association did successfully get veterinarians prioritized, group 1A, for the vaccine distribution. I don’t remember if we had the conversation internally, but I would have been okay with giving at least one call to horse hospitals just to make sure they didn’t, accidentally or otherwise, have a box lying around – but be that as it may.In those early days, we were a scrappy Internet-organized operation. Our hypothesis was basically that there’s no central source of this information which is currently published, and we can develop a central source by making a large number of volunteer-powered phone calls. This hypothesis evolved over time, and our activities evolved over time. In the beginning, we were just distributing a spreadsheet, then we put a nice UI on the spreadsheet with a map, and a search box, and “find stuff in your zip code,” etc. But in those early days, the core of our operation every day was making as many phone calls as we could convince our volunteers to make. Volunteer coordination and call center operationsCan you talk a little bit about some of the stuff we learned in spinning up that kind of Internet-enabled call center?[Patrick notes: Various team members and volunteers had various lenses for what we were doing. Some of our team had worked in progressive advocacy organizations and for them this was “kinda like a political campaign.” For me, it was “kinda like working in a call center” since I paid for my college education in part by doing that, and also “kinda like a leading WoW raid guild” since that was my only prior management experience. Jesse, our COO, often analogized it to being kinda like an OSS project with maintainers and volunteers existing in a delicate symbiotic relationship with important power dynamics to be aware of. And for many of us, it was simultaneously kinda like a tech startup, since we were deeply, deeply steeped in the folkways and habitus of tech startups.I say this partly because different people perceive or emphasize different parts of the elephant, as it were, and partly because the culture of how we build organizations is extremely important. I think VaccinateCA’s manifest outperformance compared to better-resourced actors in society owed a lot to quite a bit of accidental cultural decisions and a few key extremely intentional ones.] Dave: Yep. I think the thing that was probably my central takeaway from this experience is that expertise in this question is not necessarily where you’d expect it would be. Quite early on, I actually was looking back at some of the old chat messages prior to this podcast just to prep, and early on I actually was one of the main volunteers that when folks were coming into our Discord server – they've been invited one way or another, whether they had seen a post by one of the volunteers (probably most often you [Patrick]) or they had been been pulled in by a friend directly – I'd often be the person greeting them in the intro channel saying, “He'''
