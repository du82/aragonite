full_description = "How the Smart Money teaches trading with Ricki Heicklen Patrick McKenzie Jul 11th, 2024 Patrick and Ricki discuss real problems in trading, how trading is taught, and pedagogical game design. [Patrick notes: Welcome to the first episode of Complex Systems. I have always produced an edited transcript with my podcasts, and frequently take the opportunity to add notes, in this format.]Some years ago, I built a trading simulation for a startup I was running, Starfighter. It was, at the time, by far the most impressive technical artifact I'd ever made, including a scratch-built fake stock exchange. I recently ran into Ricki Heicklen, who has a business teaching trading, and said we should swap notes on comparative pedagogical game design.Trading doesn't have a vast body of useful information targeted at people of various skill levels. There is a vast amount of fanfic. Actual practitioners work at a relatively small number of firms and are extremely disincentivized from explaining how the world really works to outsiders. Ricki and I talk about some of the lessons people learn early in their trading careers, how those correspond to market microstructure which impacts everything tied to the financial markets, and the security mindset. There are also some (perhaps surprisingly) portable lessons from trading to many other complex systems.Sponsor: This podcast is sponsored by Check, the leading payroll infrastructure provider and pioneer of embedded payroll. Check makes it easy for any SaaS platform to build a payroll business, and already powers 60+ popular platforms. Head to checkhq.com/complex and tell them patio11 sent you.Timestamps:(00:00) Intro(00:58) Ricki’s background in trading(01:07) Teaching trading: pedagogical approaches(03:47) Challenges in learning trading(07:08) The importance of adverse selection(08:02) Crowdfunding and market dynamics(11:49) Understanding order books(19:53) Sponsor: Check(21:07) Liquidity and market microstructure(27:48) Teaching trading through practical examples(35:14) Reacting to new market information(36:47) Understanding order cancellations(41:29) Order types and other oddities(56:00) Introduction to arbitrage(01:05:00) Teaching position sizing and risk management(01:10:05) Thoughts on quant trading(01:12:44) Trading simulations and mental models(01:13:08) Simulated Insider Trading Exercise(01:20:18) Security Mindset in Trading(01:24:41) Information Leakage in Trading Firms(01:38:17) Final ThoughtsTranscriptPatrick McKenzie: Hey everybody, my name is Patrick McKenzie, better known as patio11 on the Internet, and I'm here with Ricki.Ricki Heicklen: Hi, I'm Ricki Heicklen, not quite yet as well known on the internet, but I'm very excited to be here to talk about teaching trading.Patrick McKenzie: Yep. So, some people might know I ran a startup back in the day called Starfighter, which had a product called Stockfighter: as the coolest thing I had made to date at that point, I coded up a fake stock exchange. I recently learned that you also created some fake trading interfaces to actually teach trading. (Ours is mostly about assessing programming ability rather than the trading logic itself.)[Patrick notes: The name Starfighter was an homage to picked by my cofounders Erin Ptacek and Thomas Ptacek to a classic sci-fi movie The Last Starfighter, where an advanced alien civilization recruits generals for an intergalactic war by concealing a work sample test in arcade game cabinets in out-of-the-way locations like southern California. We likewise believed that many talented candidates did not necessarily live in tech hotspots.]I'd love to just have an open ended conversation on how does one teach trading? What are the technical choices you made on that stock exchange? Maybe compare and contrast with another person who might've been coming at a similarly shaped problem from a very different angle.So – take it away. Why don't you give people a little bit of professional context on where you're coming at this from?Ricki Heicklen: Great. So my credentials as it relates to this conversation are that I was a US equities trader at Jane Street Capital for two and a half years. I really enjoyed trading, but way more than that, I really enjoyed teaching trading. The summer internship was my favorite part of the job there by far, and figuring out what makes sense pedagogically for teaching trading, especially in contrast to other disciplines. I joined Jane Street straight out of undergrad, so I had had a lot of experience of sitting in lecture classrooms and not as much of more interactive, dynamic teaching, the type that Jane Street did when I arrived there.Figuring out the pedagogical merits of each, and how to tailor teaching trading toward the audience of people that firms are often hiring straight out of undergrad is a special pet interest of mine. Patrick McKenzie: So I presume you're kind of in the demographic center of people that get hired at finance firms, but for the benefit of people who haven't been in that industry, can you just sketch out the general profile that ends up doing the sort of job you did?Ricki Heicklen: Sure. So I went to Princeton University, an Ivy League school; I studied computer science with a focus on theoretical computer science. I had an internship at Jane Street the summer going into my senior year in college. I was then hired to work at Jane Street full time as a quantitative trader and started working there immediately after graduating. This is certainly true of the median employee – went to a fancy college or university, for New York traders, mostly coming from the United States, which is where I was. Often it’s people who have experience spending a long time thinking about math problems or puzzles, but not necessarily a lot of life experience under their belt. Certainly not a lot of professional training and often less background than you might expect in economics and finance specifically – rather, a general comfort with concepts around probability, expected value, and math puzzles writ large.[Patrick notes: Interestingly, this demographic profile has changed over time and varies/varied with respect to which part of finance one found oneself in. A frequent feature of Wall Street biographies in the 1960s through 2000 or so is that upstart investment banks and other businesses recruited much more broadly than Wall Street generally, and that this tended to calcify after the firms had reached substantial success. Similarly, HFT shops used to be known for hiring almost solely for acumen but now have lists of feeder schools which resemble the rest of Wall Street.]Patrick McKenzie: I remember a person who went to my university came up to me and said that they had an interview later in the day with a finance firm, and they understood that I read the Wall Street Journal a lot – could I please explain to them the difference between a stock and a bond in case that came up? I was very worried, and I'm a little less worried these days. (Still a little worried if one is at that point, but be that as it may.)The part about competitions is interesting. One of my theories is that there's some selection effect for people who have that competitive mindset and want to play games about these sorts of things, but I generally tend to think that strong performance in games, particularly in competitive environments, probably predicts performance in real life.At least in the tech industry, we don't back-propagate that into our decisions for advertising at places like the International Math Olympiad. Is finance more rational than we are on this?Ricki Heicklen: I think it's possible finance is more rational. Now, I don't personally know how it is that software goes about recruiting as well, but I think that part of what quantitative trading firms are often trying to do is they are trying to recruit people who have the raw intelligence, that when combined with training that those firms are capable of providing in-house will turn into good trading skills. I think with software development, there is both more opportunity for people to get good at software development external to the places that are hiring for it, and therefore more ease at measuring what somebody's skill in that domain is than there is for trading.Right now, the state of the world is if you want to learn how to be a good trader, basically your only option is to go to a good trading firm. It is very hard to find good materials for learning how to trade, learning how to have the kind of intuitions and heuristics about a market that a trader ought to develop, in any context outside of a firm.There are a couple of reasons for this. One is that the firms are incentivized to not spread that information too far and wide, and another is that trading skills are not skills that you can easily pick up from reading a book or from consuming a YouTube lecture series. They're way easier to learn through actually being immersed in the environment and doing it yourself.That means that you're going to need a really good ratio of teachers to students in order to properly transmit trading knowledge to those students. This is just not going to be that widely available when you're bottlenecked on how many good traders there are, and when those traders will benefit a lot more from full time trading than they will from teaching those skills to a few dozen other people.Patrick McKenzie: It honestly surprised me when I heard that firms had intensive training practices because my model of the world for this kind of thing is, “you join a desk and sit next to someone who's been doing it for a while,” and essentially have an apprenticeship model, versus a classroom lecture simulation-based model. I'm glad that some investment is happening into simulations.[Patrick notes: teams are “desks'' in finance, in a fun bit of metonymy-based entomology. The trading used to happen at a particular physical desk, and then the venue for trading became known as the desk even though there might not be a physical location synonymous with it anymore, and then the people trading at the venue started calling themselves the desk.]Actually, one of the reasons we picked ‘build a fake stock exchange’ as the thing Starfighter would do to measure engineering ability was because it is so hard on the outside to figure out how these things worked. There's kind of a mystique around making piles of money by being smarter than the next person. [Patrick notes: this is part of the appeal of dramatic accounts of finance the Big Short or Margin Call.]We thought, well, we can make the 5,000th game about dwarves killing orcs, or we can make one of the first games that is actually true to life about trading stocks. We will certainly get some snipes from people who do it for a living, but that isn't exactly the audience.We’ll have this fun fictional environment. It's a very deep domain now that we can teach to people – learning stuff is fun – and then they can show off their stuff in the other domain that we're really interested in, which was for us programming ability that they probably had before they joined the game. Everybody wins from the discovery of knowledge there. (Anyhow, I still cry tears that Starfighter is no longer in business.)My toy economic model for a high speed trading firm is, (1) we hire very smart people directly out of undergrad, (2) ???, (3) they pull a lot of money out of the economy. Somewhere in the middle there is connecting them to infrastructure that they cannot access if they're back at home at E*Trade; some of that is imparting them this wisdom.You have taught trading classes at Jane Street before – how do you teach trading?Ricki Heicklen: Great question.I think that there is indeed this big black box there that a lot of people don't know about. I was a quant trader at Jane Street for two and a half years, but despite trading being my lifelong passion, making US equities markets slightly more efficient, I left it for teaching because it just pays a lot better. [Patrick notes: I will explicitly flag this as dry wit for the benefit of people far from this industry.]I ended up in a role where I was teaching trading for a couple of summers to a group of precocious, smart high school students with no background knowledge in trading. I got to really refine a curriculum that was in part inspired by the experience I'd had trading, and in part reactive to what worked well and what didn't work well at teaching trading concepts to a small group of smart but financially illiterate high school students.[Patrick notes: As an aside, people often assume that “illiterate” is a value judgment on a person’s worth, in part because educational attainment is the primary way one establishes a legitimate claim to status in the American professional managerial class. “Illiterate” is a state that literally everyone is born in even with respect to their native language. It is a concise way to say that someone has not yet expended, or had expended on their behalf, the prodigious amount of effort required to get to literacy. One reason I make this defense of the word is it is critically important to people’s world models that some people are illiterate, both vis written literacy in a particular language and also in every other interesting domain. This includes people who are broadly esteemed in society. And so, when one is designing systems, one needs to think about how they interact with people who occupy a much larger slice of the literacy spectrum than system designers tend to.]Patrick McKenzie: So what's the first thing you would tell someone? Like, “I'm going to impart a bit of information upon you to get you ready for understanding the US equities markets…” – if you only had one sentence, what is that?Ricki Heicklen: The number one sentence for purposes of trading, in general, is to think about adverse selection. Adverse selection is the concept that, conditional on getting to do a trade with someone, your trade might be worse than you'd previously thought it would be – that the world that you are looking at is one that has lots of different models that will explain different systems, and you can make predictions of what those models would output for numbers. But as soon as you are putting an order into a market, you need to think about the profitability of your trade, if it gets traded with, versus if it doesn't. If it doesn't, it profits zero.So the fact of somebody else's willingness to trade with you should adjust your model, and therefore you should calculate the profitability of the order that you submit based on limiting yourself to worlds in which those trades do happen, i.e. worlds in which the trade that you want to do is worse than it otherwise would have appeared.Patrick McKenzie: One way that adverse selection shows up in the capital allocation markets in startup-land, where I spent much of my life, is that there is this notion that okay, we have a professionalized clas"
