full_description = '''Retrospective on 2024, with Sammy Cottrell Patrick McKenzie Jan 9th, 2025 On the production function of podcasting, why understanding systems isn't magic, and why freely available knowledge beats paywalls. This week I sat down with Sammy Cottrell, my EA/producer and the person who makes Complex Systems actually happen every week, to examine the production function behind the podcast. We discuss theory and practice of good shows (including e.g. the importants of transcripts and how to curate guests), reflect on our subjectively favorite episodes, and explore how LLMs might transform both the systems we cover and how we write about them. SponsorsVanta automates security compliance and builds trust, helping companies streamline ISO, SOC 2, and AI framework certifications. Learn more at https://vanta.com/complexSupport proven charities that deliver measurable results and learn how to maximize your charitable impact with GiveWell. Go to givewell.org (and type in "Complex Systems" at checkout).Check is the leading payroll infrastructure provider and pioneer of embedded payroll. Check makes it easy for any SaaS platform to build a payroll business, and already powers 60+ popular platforms. Head to checkhq.com/complex and tell them patio11 sent you.Timestamps(01:04) Introducing Sammy (01:37) The offscreen symphony behind Complex Systems (07:19) Production supply chain and transcript philosophy (08:40) LLMs of choice (15:11) Sponsors: Vanta | Check (21:21) Favorite episodes (25:49) Sponsor: GiveWell (27:15) Beyoncé (28:47) More subjectively favorite episodes (32:34) Thesis of Complex Systems (34:07) Canon in operations research (40:51) Sabbatical mode (48:52) Bits about Money and other writing in 2024 (51:22) On paywalls and not implementing them (54:29) LLM plans for 2025 [Patrick notes: As always, I have included commentary below, set out in this fashion. This transcript has been massaged by an LLM and is designed for readability rather than for being a court stenographer.Complex Systems is a personal project of mine, and not everything said by myself or guests is endorsed by e.g. advertisers or other organizations I may be affiliated with.]TranscriptPatrick McKenzie: Hi everybody, my name is Patrick McKenzie, better known as patio11 on the Internet, and I'm here with Sammy Cottrell.Sammy Cottrell: Hey Patrick.Patrick: One thing I really like about Tyler Cowen's podcast is that annually he does a retrospective on the year's events with his producer, Jeff Holmes. I often feel that the "off-camera" talent in media production doesn't get enough on-air recognition for their efforts. Are we a media production business? I guess we kind of are.Sammy: We're a little bit in media production.Patrick: We sort of cosplay as this on the Internet. [Patrick notes: This is partially tongue in cheek. While I don’t particularly feel like a professional commentator/researcher/writer in the field of financial services, there is no reasonable bright line for that that I don’t easily pass.] I wanted to recognize you for your work as the de facto producer of this podcast. Why don't you tell the world a little bit about yourself before we get into things?Introducing SammySammy: I'm Sammy. I'm Patrick's EA. More generally, I do part-time chief of staff, general fixer, and executive assistant work for various people. I enjoy working on interesting projects with interesting people, and I particularly enjoy working with Patrick. I help produce Complex Systems, which these days mostly involves lining up guests and managing scheduling.The offscreen symphony behind Complex SystemsPatrick: Like every infrastructure project, there's an offscreen symphony making things happen. For example, we're recording this from a pair of recording studios, and ensuring studio availability, microphone setup, and other logistics takes non-trivial work. We'll discuss the fruits of your labors in a moment.I had this on my list for years—restarting a podcast after having one before. From 2012 through 2016, I had a podcast with my friend Keith Perhac where we produced 16 episodes over four years, which reflects how consistently I could release them. How many episodes has Complex Systems done?Sammy: This will be episode 25. Production supply chain and transcript philosophyPatrick: Yes, 25 since July. To use another Tyler Cowen-ism, the production function seems to be working. Thank you for that. So we've been doing about one per week. How do we feel about it? Give me your impressions, and then I'll give you mine.Sammy: I'm a little bit biased. I really enjoy this podcast. I like reading the episode transcripts, I like the guests that we have on—many of whom I helped choose, but I would have liked them anyway. We've managed to make an episode every week except Thanksgiving and Christmas, which was intentional.Patrick: I feel somewhat passionate about transcripts. Many well-produced professional podcasts don't put much effort into transcripts for various reasons. They're seen as epiphenomena of audio work. They require significant effort to do right and don't fit neatly into the weekly workflow of podcast production. As a result, they're often neglected.About 50% of my work on each podcast is reviewing the transcript, which is produced either by a human transcriptionist or by AI tools, then re-edited by me with inline notes added. [Patrick notes: Actually, if you’re counting strictly by minutes expended, this is substantially more than 50%, but if you’re counting by mental energy, 50% seems about right.]Why is this important? I'm far more committed to the written word than to speaking as a format. I want people to be able to read things if they get more value from reading than listening. It's much more time-efficient for many busy people. Additionally, I often find myself doing better reflection on topics offline when I have time to think, versus simultaneously managing the mechanics of speaking while thinking about complex topics and reacting to guest comments. [Patrick notes: Although I don’t like to be defined by it, I have at times struggled with a minor speech impediment, and the physical mechanics of speech take me a bit more of my attention budget to juggle than the typical person. You’re most likely to hear it slip through years of effort when either I’m quite excited and speaking quickly or when I’m ill or tired and not able to summon the effort to police my speech like I do in every other conversation.]The written format allows thoughts to breathe and produces a more cohesive finished product.Sammy: I'd add that your particular manner of speaking, and sometimes writing, is often implicit. There's a lot of subtext. The nice thing about inline notes is that they explicitly spell out the subtext for those who might not parse it the same way as your intended sophisticated audience. Having the industry references spelled out with links to examples, rather than brief references, is really valuable.Patrick: The podcast has also developed a diverse audience—though that doesn't quite capture it. We have listeners from various positions: tech, finance, government, policy roles, and beyond. Things that are common knowledge in some communities might not be worth explaining there. For instance, in banking, while many actually do need Regulation E explained to them, those with my particular confluence of interests don't need it explained every time. However, many Complex Systems listeners don't have Regulation E cached in their short-term memory, so I'll frequently include an explainer, particularly when using it as an example of larger regulatory frameworks.[Patrick notes: Regulation E governs, most prominently, liability for fraudulent use of (many) consumer-oriented payments systems within the United States. It is, broadly, extremely customer-friendly, and shifts liability from consumers to financial institutions in (effectively) almost all cases. The financial and payments industries have complex business processes downstream of Reg E to re-shift that liability to e.g. businesses which take credit card payments. Reg E is very much not a dead letter. I used to have a hobby of writing banks on behalf of (mostly) unsophisticated consumers asserting their rights under it, and banks were indeed quite solicitous about following their obligations under the law… contingent on someone presenting as being “the sort of person who knows what Regulation E is” taking a keen interest in the affairs of a Kansan grandmother who had a routine dispute with their bank.] Sammy: That's how I first learned terms like OpEx and CapEx—from Bits About Money, because you explained them outright with examples. Now they're fundamental terms in my vocabulary.Patrick: You're welcome. By the way, Sammy is quite young—not saying that to embarrass you, but it reminds me of a great XKCD comic about how for any well-understood topic, 30,000 people are learning about it today. [Patrick notes: The original comic cites 10,000.]Current technology doesn't make it possible to explain every possible allusion in a piece, though LLMs make that tantalizingly close. But with minimal effort, we can increase accessibility for those 30,000 daily learners of concepts like operating expenses versus capital expenses.Sammy: It really helps.Patrick: Continuing education is something we're all subscribed to for the rest of our lives, hopefully.Regarding our supply chain: Complex Systems is produced by Turpentine, a media network focused on the tech industry and its adjacencies. They handle our production and advertising sales. If your company could use more exposure to an intelligent audience, email me for introductions.The show is hosted on Ghost and Transistor—Ghost for the website, which I also use for Bits About Money, and Transistor.fm for podcast hosting, which is by far the best way to host a podcast. We record through Riverside, which makes the physical dynamics of recording much better than having guests set up their own recording tools.LLMs of choiceWe use a human transcriptionist and extensively use LLMs in post-production, mainly for rough-to-fine transcription editing. We've been experimenting with different LLMs. I know you prefer Claude. I just signed up for Claude this week, having previously used ChatGPT.Sammy: Have you tested Claude yet?Patrick: I just started using it and haven't used it "in anger" yet.Sammy: Ah, gotcha.Patrick: The technology works far better than we would have expected two years ago. Point it at an MP3 file, and you get a mostly accurate transcription. The failure modes are somewhat insane if you don't understand what LLMs are doing under the hood—sometimes they'll invent entire paragraphs that never happened, even when explicitly prompted to reduce hallucinations. It's a hilarious software paradigm where you have to tell your software in plain English, "Please invent less while cleaning up this transcription."Sammy: You mentioned an incident where you didn't actually paste in the transcript, and it just invented a plausible podcast episode.Patrick: Yes, and it fooled me for the first few paragraphs, which was mind-blowing. Then I realized, "No, this wasn't the first topic we discussed. I have distinct memory of the sequence, and it was not this sequence."I don't want court transcript-style verbatim records. For those unfamiliar, court transcriptionists produce exact, word-by-word records for the judicial system. Instead, I want to present guests—and myself—in their best light, which sometimes means transforming complex, exploratory conversations into more structured thoughts, as if they had been written with an editing process.When I ask AIs to help with this editing, they sometimes do well conveying the core message but remove people's unique phrases, speaking styles, and specific points. We're working to find the right combination of LLM, version, and prompting to preserve the best version of what was said without losing the speaker's personality and detail.Sammy: Empirically, Claude does this well. I know you've had issues with ChatGPT's "sandblasting." A recent example: in an automated transcript, something was transcribed as "factory" when you actually said "Factorio," and Claude corrected it to Factorio based on context and knowing it was you.Patrick: There are pros and cons to being recognizable to LLMs. For better or worse, large amounts of my written work are in various AI labs' datasets. I might still be used as a test case in some places—I don't know. Funny things happen when you're willing to say yes to things. (For context: "eval" is a term used by AI labs for testing their LLMs' functionality, through automated, semi-automated, and manual approaches, both during and after training.)We should probably do an episode on LLMs at some point. So, what episodes were our most popular of the first 26?Favorite episodesSammy: The Ricki Heicklen episode was most popular by a decent margin. It was also our first episode, so when people check out the podcast and scroll down to the beginning, that's the one they click on. It probably got the most promotion as our launch episode. Also, it was fantastic—Ricki is an incredible guest, and the conversation was excellent.Patrick: And pip pip for you, you're totally responsible for making that happen. I wasn't aware of Ricki’s work before you introduced us, and she was indeed a fantastic guest. Going just by the numbers, what are our other top episodes?Sammy: Based on downloads and transcript views, Casey Handmer, Dan Davies, and Zvi are all roughly tied for second place, in about that order.Patrick: I have some thoughts about judging the nascent success of internet publishing operations after writing for the internet for many years. Sorting purely by engagement is suboptimal—actually, very suboptimal. It causes much of the dysfunction we see in prestige media, among other things.The reality of running a podcast with guests of various profiles is that you'll tend to overperform your baseline with guests who have larger profiles or who promote their episodes through their own channels. You'll underperform with people who are less discovered by the Internet at large.Part of the reason to have a show that invites people to discuss interesting subjects is to raise the stature of people who aren't yet Internet famous. Ricki, for example, is—relative to her expertise about trading—less well known to daily Matt Levine readers than Matt Levine himself. If Matt were hypothetically on the podcast, we'd break our download records.Sammy: We gotta get him on the podcast, man.Patrick: That will probably happen at some point, if Bloomberg allows it. People who are "native internet creatures" with large Twitter presences they can use to share their episodes will tend to outperform versus those who aren't.If you allow yourself to be ruled by the numbers, you'll tend to over-select for people who've invested heavily in becoming famous in some subculture, and anti-se'''
