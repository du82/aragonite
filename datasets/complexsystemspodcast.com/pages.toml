full_description = '''AI, data centers, and power economics, with Azeem Azhar Patrick McKenzie Feb 27th, 2025 AI-fueled energy demands in data centers, the changing electricity generation mix which will support it, and more. This week I'm joined by Azeem Azhar. We started intending on doing a deep dive into data center power economics, with a particular focus on how AI-fueled demand changes the equations, and ended up visiting everything from the history of infrastructure overinvestment cycles to the future of the energy generation mix.Sponsors: Safebase | CheckReady to save time and close deals faster? Inbound security reviews shouldn’t slow down your team or your sales cycle. Leading companies use SafeBase to eliminate up to 98% of inbound security questionnaires, automate workflows, and accelerate pipeline. Go to safebase.io/podcast Check is the leading payroll infrastructure provider and pioneer of embedded payroll. Check makes it easy for any SaaS platform to build a payroll business, and already powers 60+ popular platforms. Head to checkhq.com/complex and tell them patio11 sent you.Timestamps(00:00) Intro (00:27) The power economics of data centers (01:12) Historical infrastructure rollouts (04:58) The telecoms bubble (06:22) Unprecedented enterprise spend on AI capabilities (11:12) Let's have your LLM talk to my LLM (16:44) Is there a saturation point? (19:25) Sponsors: Safebase | Check (21:55) What’s in a data center? (24:52) The challenges of data centers (29:40) Geographical considerations for data centers (36:53) Energy consumption and future needs (40:48) Challenges in building transmission lines (41:35) The solar power learning curve (43:51) Small modular nuclear reactors (51:26) Geothermal energy and fracking (01:01:34) The future of AI and energy systems (01:12:57) Wrap TranscriptPatrick: Hideho, everybody. My name is Patrick McKenzie, better known as patio11 on the internets, and I'm here with my buddy Azeem Azhar.Azeem: It is so great to be here, I love the name of your podcast.Patrick: Oh, thank you very much. So Azeem runs a newsletter called Exponential View, and we're going to be talking about the power economics, specifically that of data centers today. People might have heard recently in the news that OpenAI et al. are building a multi-billion dollar Stargate facility down in Texas. People might have heard some sort of hand-wavy or more evidence-based calculations that data center usage is going to be tens of percent of all power usage in the near future.The power economics of data centersAnd I think for folks inside the industry, these are eye-popping numbers, but they're somewhat expected numbers. For people who are outside the industry, this is all just a little bit wild. So let's take the very long view. How does this compare to other infrastructure rollouts over the last, say, couple of centuries and then go into the nitty-gritty? But speaking of things that are a couple of centuries old, we've been around this computer thing for a while, haven't we?Azeem: We certainly have. I still have my first computer. It's a Z80 processor and the computer's called the ZX81, and I got it in 1981. So it's 43 years old, gonna be 44 this year and probably older than many of the listeners.Patrick: The first modem I ever used was 300 bits per second. No, that is not misspeaking, for those of you who have had cell phones for your entire life. [Patrick notes: Middle age, it is a trip. One of the early markers of onset for me was, in receiving a compliment from the first boss I had had in a very long time, I said “Oh of course I’m good at this. I have been doing it since you were in middle school. … I meant that in any other way than the way it sounded.” … And that funny story is about as old as my son, who wants to get into programming for the Minecraft utility. Middle age, it is a trip.] The power economics of data centersAnyhow, let's talk about slightly more ancient infrastructure. So as we're doing this build out of data centers and the electricity—both generation and transmission apparatus that powers them—I'm sometimes put in mind of other societal-wide infrastructure buildouts. What's one that comes to mind for you?Azeem: You know, we see these infrastructure buildouts every 50 to 60 years, roughly speaking, and the really, really big ones in the U.S. and in Europe were for the railways, and they were for electrification. Electrification just over a hundred years ago or a hundred to 80 years ago in the U.S. [Patrick notes: The Rural Electrification Act of 1936 is a useful marker for Americans who need one.] One of the interesting facts around all of these build-outs is just how significant they were. If you look at the build-out of the railways in Great Britain in the 1840s to 1860s, roughly six to seven percent of GDP per annum went into capital investment to build out those rail lines, which in U.S. terms today, given the size of the U.S. economy, would be approaching kind of a trillion, a trillion and a half dollars.The telecoms bubbleSo whenever we see a general purpose technology like this, like artificial intelligence, like the internet, like telecoms and electricity or the railways, infrastructure needs to get built. And the sums of money that go into it are always eye-popping. And so too, by the way, are the dynamics of overinvestment as it's hard to forecast exactly when demand and where demand will arise.Patrick: Byrne Hobart has a book Boom with Stripe Press that lays out this theory with the co-author, Tobias Huber. [Patrick disclaims: I previously worked for Stripe and, as one of my last job duties, reviewed a pre-publication draft of this. Byrne is a friend of mine.] And essentially he says that infrastructure overinvestment tends to happen with bubble dynamics but that the bubble is actually somewhat positive in that it causes a Schelling point for different people, firms, government entities, et cetera, that all have different pieces of the puzzle that would not coordinate to do a nationwide or even worldwide infrastructural revolution, but for some bubble dynamics.And then often bubbles pop because, as you mentioned, it is virtually impossible to get these questions right a priori. But the demand sort of backfills over the intervening decades after the popping of the bubble.I honestly don't know. There's substantial technical uncertainty, et cetera. This might be the bubble that doesn't pop. And it's always dangerous to say "this time is different," [Patrick notes: I apologize to friends with relevant equity interests for tempting fate in this fashion] but what I'm saying is there is some possibility that there is a discontinuity here with previous infrastructural build-outs.But for people who are our generation, who remember very keenly the dot-com bust happening—people remember the dot-com bust as being about the application layer, about Webvan and Pets.com, we had great dot-com domains back in those days. But they remember that. But by count of money invested, almost all of it was doing coast-to-coast fiber and copper rollouts, and that substantially enabled the development of the modern Internet and its use as e-commerce, et cetera, platforms.Azeem: Yeah, I agree with that. And in fact, the telecoms bubble is really salutary. The total investment in telecoms infrastructure—you described it as kind of coast to coast, but there was stuff happening outside the U.S. as well—was, as I recall, around $600 billion between 1996 and 2001. [Patrick notes: Many ballpark it there.] And US telecoms firms alone took on about $350 to $370 billion of debt in order to do this. And they did it at a time when the telecoms market was growing at about 7 percent per annum.Unprecedented enterprise spend on AI capabilitiesAnd so what feels really different about this AI market is that firms are growing much, much faster than that. I mean, 7 percent per week is not unheard of right now. And you're getting these early-stage startups that, like Cursor, are getting to $100-$150 million of annual recurring revenue within 18 months or so, which is an absolutely dramatic result. [Patrick notes: Finger to the wind, we historically expected great SaaS businesses to be at about a million dollars of run rate, not revenue, at that point. One million, not $100 million. One assumes Cursor has COGS far in excess of historical SaaS comparables but I can’t imagine the seed investors cry too much about them.]And in fact, six months ago, we were looking at data that showed that AI-based software startups were growing three times faster than fast-growing SaaS startups in the pre-AI era. And that's compressed even further. And the reason that's different to the telecoms infrastructure buildout is that the revenues are probably ramping faster than the infrastructure growth is ramping. Whereas the reverse was true back in the telecoms bubble, which has been relabeled the dot-com bubble by some historians.Patrick: Yeah. So I'm also hearing reports of this anecdotally. Don't treat the following as a quote from an informed market participant, but just treat it as a bit of market color on the grapevine. At about Series C stage for raising investment in Silicon Valley, you continue to be quickly growing, but are sort of reinvesting in processes to support the next 10x over the next couple of years and getting, let's say, a little less cowboy about the operations.I have heard credible people claim positive knowledge of Series C stage that are growing as quickly as Y Combinator companies that are double-digit weeks old with 10% week-over-week growth, etc.[Patrick notes: On occasionally gets bits of market color on Twitter, in addition to private conversations.]And not growth in a vanity metric or growth in eyeballs for viewing cat videos, but growth in enterprise spend on AI capabilities. Which, to the extent that one would trust that observation, is mind-blowing. [Patrick notes: Should you trust it? To you, it’s non-specific third hand market color. Should I trust it? It’s not a company that has contractually promised me information rights. Drats. Should I trust my interlocutor? The information sharing game is one with persistent reputations and repeated interactions over decades, and the ecosystem contains some people who have richly earned a reputation for telling fish stories, and some people who have not.] Azeem: It's absolutely wild. And I've heard similar things as well. So presuming we're not hearing the same rumor sourced from the same person, let's assume that these are coming from different places, that seems to match somewhat with what I hear as well. [Patrick notes: It’s always fun at dinner when you and another person are trying to say “Wait are we both in on the same information that we can’t share directly or are we swapping independent anecdotes?” No, this does not usually get resolved by a protocol involving one-way hashes, though that would be pleasantly cyberpunk.] And you can see it from other datasets. So there is a platform called OpenRouter which has access to a whole bunch of LLM APIs, and in some of their recent data, when I looked at it, I saw an 8x growth in token usage, as in tokens served by a set of these models over a somewhat less than one-year period. And so we're going from a few hundred million tokens per month to several billion tokens per month.And of course, while token prices have come down, that is showing the elasticity of demand and the fact that the demand exists and the demand is not being saturated at all. So I sometimes feel that we are the blindfolded men walking around this elephant, and we have to sort of put the full picture of what's happening in the market together. And I don't really see many of the feelers that suggest we're not dealing with something that's big and fast-growing. I mean, typically every conversation I have—sometimes a bit skeptical about them—points to the kind of dynamic that you talked about, which is that the growth is really, really fast. It continues to be fast. And you know, as prices come down, spending goes up because you can basically make the economics work on newer use cases.Patrick: I also think that people—there's a comparative advantage in having seen the dynamics of SaaS companies at scale in understanding how this is going to scale because I think some of the best-informed people with regards to what LLMs can actually do these days are folks that are playing with them every day.But if your view on an LLM's capability is "I chat with Claude all the time. He seems very emotionally supportive. I've done this sort of song generation in Suno, which is a wonderful experience, by the way"—you're probably not predicting what those capabilities in an API plus a two-to-five year enterprise integration cycle looks like.Because after that exists, it's not going to be you invoking one a couple hours per day, it will be everybody getting a staggering number of LLM invocations on their behalf every day, most in the background. The right model isn't a person having a conversation with an AI. It's more similar to what happens when you open up the New York Times and several hundred robots conduct an instant auction for your attention on your behalf. And there's an entire ecosystem of firms in adtech that make that happen, and you will never know most of their names.[Patrick notes: DoubleClick rattles around in people’s memory as the acquisition that became Google AdSense, but few non-specialists would recognize an obscure company like Nexxen. They’re publicly traded and serviced ~200 billion ads. Today.It seems very likely to me that, someday quite soon, there will be a company running 25 LLM invocations for every man, woman, and child on earth every day. It is far less likely that 25 is the ceiling. I don’t think that most listeners, or myself, will necessarily be able to name them off the top of the head.] Azeem: Yeah, well, can I add to that? I mean, we already got that crossing point on web traffic a couple of years ago where 50 percent of traffic generated is bots traffic doing various things like that and within processes within the enterprise.There are so many advantages in having LLMs or AI systems talk to each other. Fundamentally because they can be much faster than we can, and that's one of the things that emerges when you see these sort of optimized distilled LLMs running at a thousand tokens per second. Which is that, that is really, really significant in terms of ingesting information, making a decision on that information and sending a signal back out to the next step in the process at millisecond speed, whereas humans work at minute speed.And at a thousand tokens a second, rather than five to eight tokens a second, which may be where we might sit at the very, very best of times when we're reading something, let alone when we're writing something. And that velocity, I think in of itself will breed faster velocity. And that's why I love the idea of this being a compl'''
