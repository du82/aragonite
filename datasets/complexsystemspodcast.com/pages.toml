description = "Chicago is stumping for equity for a casino development projects in fairly unlikely places. Here's why."
full_description = '''The landmines buried in the fine print of Chicago’s new casino deal Patrick McKenzie Jan 30th, 2025 Chicago is stumping for equity for a casino development projects in fairly unlikely places. Here's why. My most recent essay for Bits about Money, A very Chicago gamble, covers an investment opportunity presently being touted by the government of my city. It's not a compelling pitch, to my mind, but it is a compelling story, existing at the intersection of real estate, investment, municipal politics, recent U.S. cultural changes, governance (and ill rule), etc.[Patrick notes: Today’s episode is very, very similar in character to that essay if you read it, through the Post-Publication Update, which follows the essay, for flow reasons. The exceptions are those places where I had to verbally describe an interface or diagram.I’ll note that this episode was recorded on January 28th, 2025, and the below transcript may not reflect things that I’ve come to know after that date.]SponsorsVanta automates security compliance and builds trust, helping companies streamline ISO, SOC 2, and AI framework certifications. Learn more at https://vanta.com/complexSupport proven charities that deliver measurable results and learn how to maximize your charitable impact with GiveWell. Go to givewell.org (and type in "Complex Systems" at checkout).Check is the leading payroll infrastructure provider and pioneer of embedded payroll. Check makes it easy for any SaaS platform to build a payroll business, and already powers 60+ popular platforms. Head to checkhq.com/complex and tell them patio11 sent you.Timestamps (00:00) Intro (01:43) Chicago has wanted a casino for a long time (04:55) The stock offering (10:29) Chicago’s peculiar definition of minority (14:04) Sponsors: Vanta | Check (16:26) Reading a complex corporate structure (20:29) Is this valuation a gift to investors? (23:20) Capital stack arbitrage (30:04) The casino will not distribute profits, per se (32:45) Tax consequences of this offering (38:34) In conclusion TranscriptPatrick McKenzieHideo everybody. I’m Patrick McKenzie, better known as patio11 on the internet. On January 24th, which was last Friday, I wrote an essay about a recent investment opportunity in the city of Chicago. And in the last few days, I've learned a little bit more through some digging. So I'm going to read that essay, which originally ran in Bits About Money, and then tell you what I've learned since then in the intervening four days.A very Chicago gambleThis column doesn’t offer investment advice, as I am not a registered investment advisor. This is not merely a mandatory disclaimer; this is a warning. We will discuss some specific securities below that I am not merely incapable of recommending.Finance performs a strange alchemy, teleporting value through time and space. Ordinarily, Bits about Money focuses more on the plumbing of it than the deals. But a deal enthusiast who goes by The Conservative Income Investor recently flagged a capital raise to me. It has everything: echoes of the culture that is the American PMC 2020-2024, complex financial structuring, a novel web application to move money, a crypto company in the background, and municipal politics. So it seems squarely within this column’s beat.The municipality happens to be Chicago, my hometown and (after a 20 year stint in Japan) current residence. And so I feel some sense of civic duty, as a Chicagoan, taxpayer, and reasonably financially sophisticated person, to say the following publicly: What the hell, Chicago.But before we get to present-day shenanigans, we need to go back several decades, because municipal politics is inextricable from the shenanigans.Chicago has wanted a casino for a long timeChicago and the state of Illinois more broadly have a deeply unserious polity. It has mortgaged its future through consistently overpaying public sector employees (principally, in Chicago, police/fire/teachers) and undertaxing. Neither decreasing total compensation of public sector employees nor reneging on previously-negotiated deferred compensation (pensions and healthcare for retirees) nor raising taxes to appropriate levels is considered politically palatable. One reason is that the Illinois state constitution (Article 13 Section 5) makes public employee pensions sacrosanct. The constitution is, of course, not a fact of nature; it is a political compromise by, again, a deeply unserious polity.Long-time watchers of state and local politics know Illinois pensions are the worst funded in the nation, state officials celebrate when Wall Street upgrades its credit rating from close-to-junk, and the possibility of a federal bailout was a constant political issue for decades until it happened by stealth during covid.And so Illinois and Chicago specifically are constantly on the make for new revenue streams. One which was mooted since my childhood in the 1980s was an expansion of gambling. So-called sin taxes (on gambling, liquor, tobacco, and similar) are politically attractive because they do not cause as much opposition as raising consumption or property taxes.And so Chicago has had a decades-long campaign to build a casino within city limits. Why couldn’t Chicago actually get this done in several decades? One reason is the usual incompetence. The other reason is that the political economy of casinos is controversial. Many policies create winners and losers, but casinos inescapably create losers much more directly than most policies up for vote. Local political elites often band together against them, worried about siphoning money from local consumers. They also worry that they tend to create spillover effects, such as crime and moral collapse among a portion of patrons.And so, as I once mentioned in a podcast with Thinking Poker, pro-casino political coalitions try to pick off anti-casino political elites by assuaging their concerns and/or bribing them. (In Japan, the de facto concession was “We’ll limit the amount Japanese people can lose here and maximize for soaking Chinese tourists. Now, let’s write that down in a way which doesn’t say exactly that, because it sounds bad if you put it that way.”)In Chicago, much of the opposition came from African American political elites. They had the usual set of concerns for casinos, plus one other which is slightly more idiosyncratic. A belief with wide currency in that community is that the community would be much more wealthy than it currently is, but for vice entrepreneurs siphoning that community’s resources out of the community. This belief has lead to e.g. pogroms against Korean liquor store owners. I direct interested readers to histories of the Rodney King riots or the Asian American experience in 20th century America. (This was covered extensively in an elective I took more than 20 years ago, and so I have since forgotten the academic citations for this true but parenthetical point.)Bally’s won the bid for the newly licensed Chicago casino in 2022, in part due to offering the right mix of concessions and inducements in its Host Community Agreement. One of those was promising Chicago that the new casino would be at least 25% owned by women and Minorities. The M is capital in the Chicago municipal code, and I will preserve this stylistic choice, because the word does not mean what most educated Americans assume it means. We shall return to that meaning later.The stock offeringIn fulfillment of its obligations under the HCA, Bally’s Chicago, Inc., an entity in the corporate web which will build and operate the casino, has conducted a stock offering since December. It runs through January 2025.The stock offering has a prospectus associated with it. BCI does not appear to be relying on an exemption from registration, in the fashion that e.g. most startups would, restricting them to raising money from accredited investors.While reading the prospectus, I read a much-remarked-upon statement, and assumed it was a misprint.This offering is only being made to individuals and entities that satisfy the Class A Qualification Criteria (as defined herein). Our Host Community Agreement with the City of Chicago requires that 25% of Bally’s Chicago OpCo’s equity must be owned by persons that have satisfied the Class A Qualification Criteria. The Class A Qualification Criteria include, among other criteria, that the person:if an individual, must be a woman;if an individual, must be a Minority, as defined by MCC 2-92-670(n) (see below); orif an entity, must be controlled by women or Minorities.Why did I assume this was a mistake? Well, for one thing, on the face of it Bally’s has told the SEC that this offering is only available to Minorities who are also women, which does not match the intent expressed elsewhere or during their roadshow. I have immense sympathy for drafting errors. Bally’s, feel free to let the lawyers know they forgot a significant “or” on the first bullet point. [Post-publication edit: An actual lawyer, not an Internet lawyer, informs me that the first bullet point has an implied "or" in this construction. Mea maxima culpa, associate who drafted this.]The other reason I thought this was likely a mistake is that the American social, legal, and constitutional order is profoundly opposed to discrimination by race, and considers that action malum in se. Even when individual actors want to do it, they usually feel embarrassed enough about it to dissemble. For example, the last few years tech companies absolutely, notoriously engaged in legally prohibited discrimination in hiring, sometimes as an intentionally directed and explicitly written down policy. This is often assumed to be a conspiracy theory by disaffected white males. Perhaps that is an understandable belief, since people who read the project plans either a) supported them or b) value their future careers and are therefore mostly not leaking them, and thus we only have public evidence of those project plans which end up screenshotted in litigation. Similarly, when I say that the state of California proudly engaged in redlining in the provision of lifesaving medical care in 2021, many people of good-will assume that I simply must be mistaken. I get it, but I was there.Returning from the ancient history of 2021 to this very week: Chicago has directed a private entity to segregate, and that entity is segregating, principally via web application. If you attempt to engage Bally’s for an investment here, you will see the following blocking question during qualification stages for the investment opportunity. (The web application will also ask for your name, address, social security number, and accredited investor status.)There is a right answer to this question. If you give the wrong answer, Bally’s will decline you the opportunity to invest. You get entirely stopped by the web application.I express no opinion on whether this is legal, by Bally’s or Chicago. After all, I am not a lawyer, and this has certainly been seen by many lawyers at this point, in e.g. preparing the submission to the SEC. Presumably all of them went through 1L courses which introduced concepts like the Fourteenth Amendment, case law which says government actions discriminating by race are subject to strict scrutiny, and case law which says that the government cannot proxy through a private entity to do things it is prohibited to do itself. And clearly no one admitted to the bar in Illinois thinks that Chicago can waive the U.S. Constitution if it considers that politically advantageous to get a gridlocked casino through municipal politics.So I will charitably assume the existence of a memo where competent professionals have laid out a case for the legality of this course of action. They must have concluded that no future Department of Justice Civil Rights Division, not even in an administration elected after the Host Community Agreement had been inked, would descend upon this official act like the hammer of an avenging god.As Matt Levine beat me to observing: awkward timing.Chicago’s peculiar definition of MinorityLong-time observers of Chicago politics might opine that the city very rarely does anything without creating a carveout for politically connected individuals. The local phrase for this sort of social connection is having “clout” or, sometimes, “is clouted.” You can find examples of the sort of carveouts Chicago reserves for the clouted in the professional histories of the board members of Bally’s Chicago, Inc, for example, which are included in the prospectus.So what’s the carveout here? The definition of a racial or ethnic minority is a legendarily contentious one in U.S. politics, largely because inclusion or exclusion from it makes one eligible (or ineligible) for concrete benefits. Sites of contention often include e.g. are Asian Americans a minority, or are e.g. Cuban Americans Hispanic, etc.Chicago leaves itself an out for its definition of Minority, which lets it designate any individual or group as a Minority, on an ad hoc, unreported, unaccountable basis. That sounds like I must be strawmanning Chicago. See the below screenshot and explanation in the prospectusQuoting the prospectus:Qualification under [the final] clause is determined on a case-by-case basis and there is no exhaustive or definitive list of groups or individuals that the City of Chicago has determined to qualify as Minority under this clause. However, in the event the City of Chicago identifies any additional groups or individuals as falling under this clause in the future, members of such groups would satisfy the Class A Qualification Criteria.Now, fairminded people reading “groups… found by the City of Chicago to be socially disadvantaged by having suffered racial or ethnic prejudice or cultural bias within American society” would note “Well, OK, on the face of it, that definitely includes e.g. Jewish Americans or Irish Americans. We have some lamentable history as a nation and city, sure. But no intellectually serious person in the United States considers Irish Americans ‘a racial or ethnic minority’ in the common usage of the term.” And thus, the capitalization of Minority.You’ll have to ask the city for their list of ad hoc exceptions made under this bullet point. Long-time watchers of Chicago municipal politics, however, might say that asking is of limited utility.I will note that, as a matter of engineering fact, the web application will blithely accept self-certification under this bullet point for anyone. You are welcome to your guess as to whether Bally’s or any city employee will review the 1,000 investors individually and, if they review them, what the process is for determining whether e.g. a particular Patrick counts as a Minority or not. I’d wager there is no process at all here. It seems like a better bet than most offered in the casino.Reading a complex corporate structureBally’s Chicago is a product of Bally’s, a publicly traded company. You can read their 10-Ks. According to'''
