title = "From molecule to medicine, with Ross Rheingans-Yoo"
description = "What happens between academic research and patients getting access to new drugs, and how we can improve it."
full_description = '''From molecule to medicine, with Ross Rheingans-Yoo Patrick McKenzie Oct 31st, 2024 What happens between academic research and patients getting access to new drugs, and how we can improve it. I'm joined this week by my friend Ross Rheingans-Yoo, who has had an eclectic career, most recently in investment in pharmaceutical R&D. We chatted about what the lifecycle of drugs is, how trials are regulated by the FDA in the U.S. (and what the history is there), and how processes with many well-credentialed PhDs, lives hanging in the balance, and billions of dollars on the line are sometimes surprisingly unoptimized.[Patrick notes: I add inline observations to the transcript after the recording of the conversation, set out in this fashion. As always, transcripts at Complex Systems are not stenographed for literally reproducing the conversation, but are edited (including by an AI this time) with an eye to producing the best readable version of a spoken conversation.]SponsorsManifold is my favorite prediction market platform, making it easy to bet on anything from elections to crypto drama. Get started with a bonus at https://manifold.markets/complexsystems when you spend $20. Play money markets open to anyone; cash prizes only available to U.S. residents of at least 18 years of age. Terms and conditions apply.Check is the leading payroll infrastructure provider and pioneer of embedded payroll. Check makes it easy for any SaaS platform to build a payroll business, and already powers 60+ popular platforms. Head to checkhq.com/complex and tell them patio11 sent you.Timestamps(00:00) Intro (02:28) Ross’ career transition to drug development (03:12) The drug development process (06:22) Clinical trials and FDA approval (11:48) Challenges in clinical trials (14:50) Case study: COVID-19 trials (18:00) Sponsors: Manifold Markets | Check (19:55) Pharmaceutical economics (38:13) Rare diseases and regulatory strategies (45:18) Advanced market commitments explained (45:54) Operation warp speed and its impact (47:45) How to get accelerated approvals (52:49) The thalidomide tragedy and its legacy (01:03:17) Modern regulatory challenges and patient advocacy (01:07:14) Reviving abandoned drugs (01:12:06) Innovative approaches to drug trials (01:24:26) The future of pharmaceutical development (01:26:34) Wrap TranscriptPatrick McKenzie: Hideho everybody, my name is Patrick McKenzie, better known as Patio11 on the Internet, and I'm here with my buddy Ross Rheingans-Yoo.Ross Rheingans-Yoo: Hey Patrick, good to be here.Patrick McKenzie: Great to have you. we're going to talk a little bit about clinical trials and drug development today. Patrick McKenzie: So, like myself and many guests on this podcast, you've had a bit of a winding career. I first met you when you were at Jane Street. You brought me in to be a guest speaker, if I remember right. And then you ended up in drug development. What happened in the middle?[Patrick notes: The live conversation said drug "discovery" rather than development. Ross has explained to me that, in the industry, discovery is the more scientific arm of the process; development is the financial, logistical, and commercial work of turning that science into something which scalably improves human lives.]Ross Rheingans-Yoo: Sure. I spent five and a half years at Jane Street, first in New York and then in Hong Kong, which is when we had you as a virtual guest speaker. I have a lot of positive things to say about the place, but those belong in a different podcast.[Patrick notes: This makes Ross by my count the third former Jane Street employee we’ve had on Complex Systems, which is partially a reflection of my skewed personal and professional networks, and partly downstream of very interesting things they do with regards to identifying and attracting early-career talent.] Ross Rheingans-Yoo: At the beginning of 2022, I was invited to take a position at a philanthropic foundation funded by someone who had recently made a significant amount of money in crypto. I thought this would provide an opportunity to work on more exciting and timely projects than I had been involved with recently. So, I went to work as a program officer for the FTX Foundation.I held that position until about November of that year when I unfortunately learned that one of the challenges facing a philanthropic foundation can be issues related to the sources of its donors' funds. I had several legal interactions with the bankruptcy estate following those events. However, two things I’m glad to have come from that experience are: first, the estate withdrew several unfortunate allegations they had made against me personally.Secondly, in the final resolution of the settlements, the estate agreed that while the potential returns from some equity investments I had directed would be recovered for the benefit of creditors, they would not seek to pull money out of the companies that were continuing to actively develop drugs and push those programs forward. I’m pleased that the companies I supported were able to continue their flight paths without much interruption after those settlements.Ross’ career transition to drug developmentBut we’re here to talk about drug development more generally. So, what do you want to know? Where do we start?Patrick McKenzie: Yeah, I’m sorry you had that rough experience, but I’m glad it worked out in the end. [Patrick notes: I will note, not for the first time, that the FTX caper had many, many layers to it. One of them was an affinity fraud against people broadly affiliated with effective altruism, and another layer was a privilege escalation attack on the institutions of the American professional-managerial class. FTX’s senior management has few people who will admit to being friends with them prior to November 2022, for understandable reasons, but I think it’s instructive to reflect on how it fooled so many people for as long as it did.To not put words in anyone else’s mouth, I was surprised by the FTX implosion, and I shouldn’t have been, as a notoriously crypto-skeptical individual who had enough of the pieces to put the story together. Partly this was because I thought I understood the crime: FTX/Alameda was Tether’s money launderer, and I assumed they were mostly competently executed on their side businesses while making their serious money from gatekeeping Tether’s access to the U.S. financial system. I did not have a very developed point of view on their degree of understanding that this was actually their business; one can deliver that fee for services as arbitrage profits, and the only party willing to crime will keep reaping the profits. SBF et al were quite brazen in saying that this was the plan; few financial services CEOs get on Bloomberg and say, in as many words, that most compliance officers would look at their founding narrative and diagnose it as money laundering.But the other reason was, in looking at FTX management, I saw people who looked like me, talked like me, had clearly spent a lot of their lives reading the same websites I did, and struck me as having an ethical system I didn’t quite share but could appreciate. They were going to rapaciously harvest profits by enabling degenerate gamblers and committing process crimes, achieve regulatory capture to get those crimes forgiven, and then spend the money on charitable causes. And they were clearly achieving incipient success on harvesting profits and incipient success on regulatory capture.And at no point prior to the collapse did I ask the fateful question: “The story being told here is one designed to work on me. Am I the mark, or sufficiently similar to the marks that a strategy designed to exploit them also exploits me?”]Patrick McKenzie: For the benefit of an audience who might not have spent a significant portion of their career in this field, there's a process that can feel a bit opaque, and then, at some point, you go to your doctor with a complaint. Your doctor diagnoses you with a condition and prescribes a medication for it. You take the medication, and your insurance company covers at least a portion of it, in the typical case.That vague blob of uncertainty is where a lot of drugs go to die, as I understand it. So let’s start at the beginning: where does a drug begin its life?The drug development processRoss Rheingans-Yoo: The development of a drug is, in my experience, more honored in the exception than in the rule. However, there is a fairly standard process that we can use as a jumping-off point for discussing the exceptions. The prototypical drug development story begins in a university lab, where a scientific team, often headed by professors of medicine, investigates the effect of a particular molecule on a specific biological system, hoping that this effect will eventually help resolve a disease.This work typically takes place within the university setting until it reaches a point where the research transitions from exploratory studies to a more structured plan for bringing the drug to market. At this stage, the drug goes through the university's tech transfer office and then ends up in a startup company that owns the intellectual property. The university may retain a small equity stake, and that startup is then poised to seek venture capital funding to advance the development.At this point, the drug is moving from investigative studies in petri dishes and animal models to a more concerted and planned roadmap, first in animals. After those trials, it will begin human trials through several conventional stages, eventually seeking final approval from the FDA and a quasi-approval from the insurance industry, which involves agreeing to cover the drug.This is the lifecycle of drug discovery which happens in private industry, as opposed to in an academic lab.So, after the company has spun out from the university, it often continues conducting trials in non-human animals. These trials aim to compile enough data to make an initial application to the FDA to study the drug in human. That is known as an IND, or investigational new drug application. When the FDA grants that stamp of approval, it represents the first of several green lights that allow the drug to be administered to humans for the first time.Patrick McKenzie: My understanding is that many of these startup companies have essentially one asset: the drug or set of drugs they are attempting to bring to market. After they receive FDA approval, these companies are often acquired by larger drug manufacturers, allowing the startups to leverage their unique core competencies in drug development while the majors handle marketing, manufacturing, and distribution. Is that roughly accurate?Clinical trials and FDA approvalRoss Rheingans-Yoo: Yes, you've correctly identified that the company that spins out of the university is rarely the one selling you the drug a decade later.I want to highlight one detail: the company that begins the development often doesn't hand off the project immediately after IND approval. They typically conduct some studies in humans to further de-risk the prospect for potential acquirers.In a typical scenario, the spinoff company would complete its non-human testing, obtain investigational new drug approval, and then carry out phases of safety testing in healthy volunteers to identify any obvious risks. Following that, they would conduct proof of efficacy and proof of concept testing. This is less for the regulatory apparatus but more for the commercial apparatus, like insurers. Gathering this evidence helps convince investors or potential acquirers that this drug should continue to advance.It's generally considered necessary for any acquisition transaction. Plenty of companies have drugs they believe should work and can argue that they should work, but very few drugs get acquired before there's evidence of positive outcomes in humans.Patrick McKenzie: So, we’re looking at a funnel here, and the pass rates at different stages probably vary. We start with thousands of molecules to find one candidate that looks interesting enough to move from the petri dish to animal testing. What’s the drop-off rate for moving to full human studies?Ross Rheingans-Yoo: Great question! The numbers might not be what people expect.In broad generalities—and while it’s possible to get arbitrarily specific about particular indications, types of drugs, types of molecules, and situations—if I speak generally, you might see that about two-thirds of drugs that begin phase one safety testing in healthy volunteers proceed to the next phase. Industry-wide studies don’t always delve into the specifics, like why a trial might have been stopped, whether due to adverse reactions, changing corporate priorities, or funding issues. So, if we abstract those details away, the rough statistic is that around two-thirds of drugs that start phase one will move on to phase two.In phase two, we focus on efficacy testing—essentially proof of concept in patients who actually have the condition we’re trying to treat. At this stage, you might see success rates between 40% and 50%.Patrick McKenzie: One of the reasons this process feels interminably long to patients, who often wonder why their disease hasn't been cured yet, is that it takes many shots on goal to start entering the funnel before one eventually makes it through. The latency on this process is likely several years, right? If I’m a bright postdoc with a promising molecule today, and things proceed at the usual pace, when could that realistically be consumable by a patient outside of a trial?Ross Rheingans-Yoo: If you’re a bright postdoc working on a promising molecule in your lab, dreaming of starting a company to bring it to patients, you’d be lucky to finish that journey in much less than a decade. The process involves multiple shots on goal, and the timeline can be extended significantly if things go wrong. A straightforward path through this process typically takes about seven years for many common conditions, assuming nothing goes awry.We’ll talk later about what could make this different, and what procedural levers could make it dramatically faster. To summarize the funnel: we see a two-thirds success rate in moving from safety trials to initial efficacy testing, and then 40% to 50% from efficacy testing to pivotal trials. A phase three trial has parameters agreed upon with the FDA from the start, meaning if it succeeds, they won’t have further questions or requests before making their final determination. About two-thirds of drugs that pass their safety and efficacy trials successfully complete their pivotal trials. Of those, approximately 85%—or five-sixths—receive FDA approval.When you multiply those pass rates, it translates to between one in six and one in ten drugs that are first given to humans actually becoming approved medicines. As I mentioned, this entire process typically takes seven to ten years in a prototypical case.[Patrick notes: As it i'''
