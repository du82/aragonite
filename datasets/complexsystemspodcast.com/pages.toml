description = "Newsletters, hedge funds, and VCs are all in the business of finding out truths about world then writing them down."
full_description = "Writing the first draft of financial history with Byrne Hobart Patrick McKenzie Jul 18th, 2024 Patrick and Byrne discuss how very different finance-adjacent industries extract truth from the world. [Patrick notes: I'm delighted to be joined today by Byrne Hobart. It is my usual practice to add notes in this format to transcripts.]Byrne is a writer and investor, best known for his newsletter the Diff, on the intersection of tech and finance. He also writes Capital Gains, explaining the finance concepts one's education may not have covered. Byrne is publishing a book, Boom: Bubbles and the End of Stagnation, which is coming from Stripe Press in October, and which you can pre-order on Amazon.Timestamps: (00:00) Intro (00:25) The 30-year mortgage is an intrinsically toxic product (04:46) Young households are the socially optimal holders of equities risk (10:19) The structure of private equity returns (14:18) Sponsor: Check (15:32) Meta-analysis of the finance newsletter space (19:54) Byrne’s aspirations for The Diff (25:01) The origins of names (27:19) The epistemics of a hedge fund (34:26) Venture capital vs hedge funds (38:13) Understanding scrapers (41:20) How to learn about an industry from scratch (45:37) The business of online travel agencies (49:21) Wrap Sponsor: This podcast is sponsored by Check, the leading payroll infrastructure provider and pioneer of embedded payroll. Check makes it easy for any SaaS platform to build a payroll business, and already powers 60+ popular platforms. Head to checkhq.com/complex and tell them patio11 sent you.TranscriptPatrick McKenzie: Hideho everybody. I'm Patrick McKenzie, better known as patio11 on the internets, and I'm here with my – I would have called you an internet buddy once, but we've been upgraded to friends, Byrne.[Patrick notes: In all businesses since time began, sometimes coworkers or customers graduate to friends. In the weird world that is working for the Internet, sometimes those of us who rub elbows online for years eventually discover we enjoy each others’ company in addition to enjoying each others’ ideas. Sometimes this friendship is entirely online; sometimes it extends into the other real world. Families get introduced to each other, food and drink get consumed, etc.] Byrne Hobart: Hey, great to be here.Patrick McKenzie: We have an interesting way in which we found each other back in the day, but when I try to introduce people to you – you should definitely be following Byrne Hobart in all the places – I tell them to read your magnificent tome The 30-Year Mortgage is an Intrinsically Toxic Product.Can you give people the brief version of that thesis?Byrne Hobart: Yes. It is very, very unnatural for a bank that has demand deposits to lend someone money for 30 years. But we make them do it; there was a long struggle to do this, and there's a book called The Dead Pledge that goes into great detail on how that happened on the policy side.What I was interested in was, what are the consequences of having these long term loans? Now, the consequence for homeowners is pretty good. You have this asset that does tend to appreciate over time; it may not be the best thing to put your money into, but it does go up and you can borrow a whole lot of the money that you invest in that asset.So that is good. If it's a 30-year loan and you're paying it down continuously, you know exactly what you're paying, so you've simplified a lot of your finances. You’ve basically locked into, paying some amount of interest and making some amount of investment in capital over a long period. The standard 30-year mortgage in the US has this wonderful feature for you, where if rates decline, then you can refinance at the new low rates. So you have this free option – but it's not free, because options are never free; there's always a spread between what you would pay on a mortgage and what you would get on a 30-year treasury bond and that spread basically reflects the cost of the option.But what you end up with is a really interesting situation. There are a lot of cases where in a financial market you'll have people who are buying underlying assets, and they're often buying just the stock, the bond, whatever – they're buying it to hold it for a very long time. They call them “real money.” Then there are more speculative market participants who are often doing a trade in and hedging some of their risk, and they're making money on the spread between what is the thing they're trading and then what is the cost of hedging it. With the 30-year mortgage, what happens is there is this large interest rate-options position, and one side of that trade – the person who is buying the 30-year mortgage – they do generally want to hedge some of the risk associated with that option. But someone who has a mortgage generally does not do that; they generally don't calculate, “what is the value of this option, and how many contracts of treasury futures do I need to be long or short at any given time to hedge out my risk?”If they did that, things would be a little bit different, but what happens is they don't. So anytime interest rates go down, the optimal hedging strategy is to buy more treasuries; anytime interest rates go up, the optimal strategy is to sell more of those treasuries. The existence of this huge amount of refinanceable mortgage debt does actually cause long term rates to be more volatile than they otherwise would be, and the only consequence of that is that that is just the benchmark that everyone uses for the cost of money.[Patrick notes: Let me repeat that because it is important: sometimes the tail wags the dog, and here it is the tail wagging the entire world. Hedging mortgage rate interest exposure for the most common way to purchase homes in specifically the United States implicitly dominos into the cost of capital for almost all businesses worldwide, exchange rates for most major currency pairs, the competitiveness of Japanese cars in overseas markets, etc etc.] What does the Treasury bond of a given maturity yield? That is the cost of money over that time period. The dollar is just the universal denominator for everything, and this is dollars, dollars in time zero versus dollars at time t.Patrick McKenzie: To draw out an implication of this, some people say that “well, other countries choose to socialize medicine, but make the housing market a relatively free market; the United States chooses to socialize the housing market, but make medicine go to the free market.” But it's actually much more impactful from that.The price of literally everything in the world is downstream of this peculiar choice for the microstructure of the American housing market. Byrne Hobart: There are other elements of toxicity in this asset that we can get into.Patrick McKenzie: Oh, I think we could go for a very long time on it. I have a special interest in real estate because my father raised me reading the Wall Street Journal and telling me stories about it.I told him at age seven – not due to toxicity, the risk-free rate or the consequences of hedging strategies, but just because of the conversations he was having around the dinner table about the type of people who turned up in Chicago real estate commercial real estate transactions, – I cried to dad and I said, “I can't go into the family business, I'm going to have to be an engineer or something.”Actually, part of that anecdote is not true – at age seven, I wanted to be the Commissioner of Weights and Measures. But you can tell that I'm definitely still the same person. You said an interesting thing to me before .I think that one of the positive consequences of the decision to securitize substantially all housing loans in the United States was that it moved this asset and the asset liability mismatch from the balance sheet of banks to holders that could be more structurally aligned with having very, very long term assets. I think probably the optimal holder for a 30-year mortgage note is something like a pension fund, which, on the one hand they know they need cash in 30 years, and if interest rates go up, the notional value of the bonds they are holding goes down – but that isn’t actually any skin off their nose because their cash needs are still as they modeled them previously, and now the net present value of their funding shortfall is smaller.[Patrick notes: Explaining the joke: I am assuming that any pension fund large enough to talk about is underreserved because the incentives for looting pension funds and then kicking that can down the road are extremely attractive. This thesis was mildly terrifying when I encountered it 20+ years ago at the Pension Tsunami blog (now offline, sadly). The size of the shortfall is, broadly, larger these days, and a topic of much conversation here in Chicago, because both Chicago and Illinois have deeply dysfunctional polities which were unwilling to tell politically influential stakeholders No. ]You've told me something interesting about who the socially optimal holder for equities risk is. Who do you think that is and why?Byrne Hobart: That is households saving for retirement, particularly when they're fairly young. The reasoning there is that there's an efficient frontier where, if you're allocating between different asset classes, you can generally trade more volatility for more returns in roughly similar ratios – starting with, instead of buying one month T-bills, you buy one year T-bills; now your interest rate went up, from negligible to trivial, but it's still pretty low. Then you can go all along that line, out to equities – and then you can go past that line, you can also go to asset classes that probably have negative expected value and are not really investable in the same way, but equity is a useful way to finance a lot of a lot of organizations, especially large ones or ones that are trying to get much larger very fast.But equities are also quite volatile compared to other asset classes. If you are a large investor, you do care about that volatility.Let’s say you're a college endowment. You are spending some amount of money every year; if your portfolio loses a third of its value, either the budget for the school goes down by a third, or the percentage of your assets that you spend every year goes up by 50 percent.[Patrick notes: As Byrne elides here, because it is common knowledge among professional money managers: if the college’s endowment goes down 30% under your watch, that will certainly have consequences for the college, but the most immediate consequence for the investment manager will be them being fired and then disgraced. This is one of a few ways to have “career risk” as a professional money manager, and is a fairly aligned form of career risk. Many forms of career risk cause a principal/agent problem because the money manager should do something but won’t because of career risk. If the constituents of the pot of money understood the situation in the same way the money manager does and had simpler preferences than they do, there wouldn’t be career risk, but if wishes were fishes then sushi would be a lot cheaper than it is.] Byrne Hobart: Both of those are very scary things to have to deal with, and it just doesn't really make sense that [when asking] the question of whether or not there should be a major in X or whether or not we should hire this particular professor – is asking what the S&P did over the last six months really relevant to the decision? Usually not; [that] probably should not be the main consideration.So you have a lot of kinds of investors who are afraid of volatility. Then there's a set of investors who really like volatility in particular ways: some of them are gamblers and a lot of them are founders. I think it is socially optimal for founders to own a lot of stock because they should have a large monetary incentive to do a good job – particularly, the more of their net worth is in the company, the more averse they are to completely blowing it up.[Patrick notes: This has historically been an argument advanced against secondary sales by founders by e.g. venture capitalists. This argument has lost in recent years, partly as companies have taken longer to go public and partly as money was abundant in the zero-interest environment. I’ve personally not cared for it much in that context; the founders you want to back would feel far more psychic damage from no longer being the CEO of a high-flying company than they would feel from living in diminished material conditions. But outside of that context, this is a game of making numbers sum up to 100%, and allocating tens of percent to founders versus to teachers’ pension funds sounds eminently fair to me. This, however, does imply a natural consequence: when you sort the population by wealth descending, the beginning of the list will be dominated by people who, told they’d be zeroed out in the event of a business failure, said “Bet.”]That's a healthy incentive to have, because they have a lot of people who are paying their bills, paying their mortgages, sending their kids to school, etc. with the money from this company. It's good for them to really viscerally feel the risks that they take.But then there are just not enough super rich founders to buy all of the equities in the US. You need someone else to hold them. There are some investors who hold equities, but are not net long – a lot of hedge funds do that.So who is this mysterious class of investors who could want to own a really, really volatile asset and should mind least if it drops in value? I think the answer is households. Households are saving if they're buying the most volatile asset class of the major asset classes, because it's also the asset class with the highest returns. If they're putting in a consistent amount of money every month or over set time periods, then a lot of that volatility washes out. It doesn't make a big difference to your retirement if, when you were 24 and you had $2,000 in your brokerage account, you lost half your money. It's just not a big deal. As you get older and as the number goes up – and as the question of “how much of this money can I spend every year if I'm not earning money anymore,” as it gets more salient – then you do want more of that portfolio to be in bonds. But as long as you have a large cohort of young people who are earning more money every year, we have a natural buyer for equities. We have a natural group that should be taking equity risk. I think the simplest way to do that is to buy index funds. That is my default suggestion to people: if you are asking how to make money, buy index funds. If you're asking how to potentially make more, but also more likely lose money in informative ways, picking individual stocks is certainly a great education – but it's bad advice to give someone without direct context about their situation.Patrick McKenzie: Yep. I have spent a little bit of time playing many video games. I've playe"
