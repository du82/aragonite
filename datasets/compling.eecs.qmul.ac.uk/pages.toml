full_description = "Computational Linguistics Lab Hello. We’re the people to come to for Computational Linguistics and Natural Language Processing at Queen Mary University of London. The lab is a research sub-group within the Cognitive Science, Theoretical Computer Science and Game AI groups. Our research covers a range of areas, from new theoretical models of language, its meaning and its processes; to applications automatically understanding social media, web searches, dialogue systems, creativity and mental health treatment. Please see our projects and publications pages for more. We also maintain a blog featuring thoughts and reports from some of our constituents. Our members are spread across a range of research groups within QMUL, including Cognitive Science, Theoretical Computer Science, Game AI and Risk & Information Management. Try our new word game with a purpose, Wormingo, and help advance our research while having fun! See below for some enthusiastic feedback from a student on QMUL’s MSc in AI programme this year, including our own recently developed NLP courses. Congratulations Henry, and well done!"
