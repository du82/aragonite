full_description = '''ComponentPaginationPagination is the process of splitting information over multiple pages instead of showing it all on a single page; also the name for the interface component used for navigating between these pages.Updated November 16th, 20191 minute readTable of contentsExamplesDescriptionMarkup61 examplesPaginationA11Y Style GuidejQueryCode examplesUsage guidelinesAccessibilityUnmaintainedOpen sourcePaginationAnt DesignAnt FinancialReactCode examplesAccessibility issuesOpen sourcePaginationAtlassian Design SystemReactCode examplesUsage guidelinesTone of voiceAccessibilityPaginationAuroraGovernment of CanadaCSSCode examplesTone of voiceOpen sourceUnmaintainedPaginationBackpackSkyscannerMobileReactCode examplesUsage guidelinesOpen sourceTone of voicePaginationBase WebUberReactCSS-in-JSCode examplesUsage guidelinesOpen sourceNumbered paginationBBC Global Experience LanguageAccessibilityUsage guidelinesUnmaintainedPaginationBolt Design SystemPegasystemsSassTwigWeb ComponentsCode examplesTone of voiceOpen sourceContent paginationBolt Design SystemPegasystemsSassTwigWeb ComponentsCode examplesTone of voiceOpen sourcePaginationBootstrapSassCode examplesAccessibilityOpen sourcePaginationBulmaSassCode examplesAccessibility issuesOpen sourcePaginationCarbon Design SystemIBMReactVanilla JSAngularVueSvelteWeb ComponentsCode examplesUsage guidelinesOpen sourcePaginationCauldronDequeReactCSSCode examplesUsage guidelinesAccessibilityOpen sourcePaginationCedarRecreational Equipment, Inc.VueSassCSS ModulesUsage guidelinesCode examplesOpen sourcePaginationCrayonsFreshworksWeb ComponentsCode examplesOpen sourcePaginationDell Design SystemVanilla JSCode examplesUsage guidelinesPaginationeBay MIND PatternsAccessibilityUsage guidelinesOpen sourcePaginationeBay PlaybookHTMLReactCode examplesPaginationElastic UI frameworkElasticReactSassCode examplesOpen sourcePaginationElisa Design SystemReactUsage guidelinesCode examplesAccessibilityPaginationEvergreenSegmentReactOpen sourcePaginationFlowbiteTailwind CSSOpen sourceCode examplesPaginationGeist Design SystemVercelReactCode examplesPaginationgiffgaff design systemUsage guidelinesCode examplesPaginationHeliosHashicorpEmberSassCode examplesUsage guidelinesAccessibilityOpen sourcePaginationInstructure-UIInstructureReactCSS-in-JSCode examplesAccessibilityOpen sourcePaginationLunaSainsbury’sReactSassUsage guidelinesCode examplesTone of voicePaginationMomentum DesignCiscoReactSassCode examplesUsage guidelinesOpen sourcePaginationMorningstar Design SystemVueUsage guidelinesPaginationNextUIReactCSS-in-JSCode examplesOpen sourcePaginationNHS Digital service manualNunjucksCode examplesUsage guidelinesResearchTone of voiceOpen sourcePaginationONS Design SystemOffice for National StatisticsHTMLNunjucksSassCode examplesUsage guidelinesAccessibilityOpen sourcePaginationOrbitKiwi.comReactCSS-in-JSUsage guidelinesOpen sourceCode examplesTone of voicePaginationOxygenRepsolHTMLCode examplesUsage guidelinesPaginationPajamasGitLabVueUsage guidelinesCode examplesOpen sourcePaginationPatternFlyRed HatReactSassTone of voiceOpen sourceUsage guidelinesPaginationPharosJSTORWeb ComponentsSassUsage guidelinesOpen sourceCode examplesAccessibilityTone of voicePaginationPolarisShopifyReactCode examplesUsage guidelinesAccessibilityTone of voiceOpen sourcePaginationPorsche Design SystemWeb ComponentsAngularReactVueCode examplesOpen sourcePaginationPrimerGitHubReactCode examplesOpen sourcePaginationQuasar FrameworkVueAccessibility issuesCode examplesOpen sourcePaginationRuter ComponentsReactCode examplesUnmaintainedPaginationshadcn/uiReactTailwind CSSCode examplesOpen sourcePaginationSourceThe GuardianReactCode examplesUsage guidelinesOpen sourcePaginationSpark Design SystemQuicken LoansReactAngularCode examplesUsage guidelinesOpen sourceUnmaintainedPaginationStacksStack OverflowStimulusCode examplesUsage guidelinesTone of voiceOpen sourcePaginationVattenfall Design SystemHTMLjQuerySassCode examplesOpen sourcePaginationW3C design systemSassVanilla JSCode examplesUsage guidelinesOpen sourceAccessibilityPaginationWandaWonderflowReactCSS ModulesCode examplesOpen sourcePaginationWorkday Canvas Design SystemReactUsage guidelinesAccessibilityTone of voiceOpen sourceDescriptionThe most basic form of pagination controls are simple 'next' and 'previous' buttons. More complex solutions may include links to specific page numbers and/or the first and last pages.MarkupHere is example mark up for pagination on a blog article listing page. This example uses links to specific, numbered pages; the user is currently on /blog?p=2, the second page of results:<nav aria-label="Pagination"> <ul> <li><a href="/blog">1</a></li> <li aria-current="page">2</li> <li><a href="/blog?p=3">3</a></li> </ul> </nav>As pagination is a form of navigation it should be wrapped in a <nav> element. Important note: You may come across examples where role="navigation" is placed directly to the ul element itself (e.g. this example from the Yale UI Style Guide). This is incorrect as the navigation role overrides the list semantics of the ul as well as the li items inside.1Add a meaningful label such as aria-label="Pagination" to the <nav> element to differentiate it from other navigation landmarks (such as your main site navigation, or breadcrumbs).Add the aria-current="page" attribute to the list item which represents the current page. As clicking on a link to the current page would do nothing but trigger a page reload, it's common for the link to be excluded here.You can enhance the experience for users of assistive technology further by adding an accessible label to each item. Two possible ways of doing this are:By using the aria-label attributeBy including text which is visually hidden, but still gets announced by screen readers (in the following example, this is done using the class, visually-hidden).<!-- Users of screen readers will hear "Page 2" --> <li> <a href="/blog?p=2" aria-label="Page 2">2</a> </li> <!-- Users of screen readers will hear "Current page, page 3" --> <li aria-current="page"> <span class="visually-hidden">Current page, page </span>3 </li>WAI-ARIA Authoring Practices 1.1 — 2.1 No ARIA is better than Bad ARIA↩'''
