full_description = "Accordion106 examplesOther names: Arrow toggle, Collapse, Collapsible sections, Collapsible, Details, Disclosure, Expandable, Expander, ShowyHideyThingAn accordion is a vertical stack of interactive headings used to toggle the display of further information; each item can be 'collapsed' with just a short label visible or 'expanded' to show the full content.Alert123 examplesOther names: Notification, Feedback, Message, Banner, CalloutA way of informing the user of important changes in a prominent way.Avatar38 examplesA graphical representation of a user: usually a photo, illustration, or initial.Badge129 examplesOther names: Tag, Label, ChipA small label, generally appearing inside or in close proximity to another larger interface component, representing a status, property, or some other metadata.Breadcrumbs54 examplesOther names: Breadcrumb trailA list of links showing the location of the current page in the navigational hierarchy.Button141 examplesButtons trigger an action such as submitting a form or showing/hiding an interface component.Button group49 examplesOther names: ToolbarA wrapper for multiple, related buttons.Card92 examplesOther names: TileA container for content representing a single entity. e.g. a contact, article, or task.Checkbox95 examplesAn input for choosing from predefined options: when used alone, it gives a binary choice (checked/unchecked); in a group it allows the user to select multiple values from a list of options. Color picker11 examplesAn input for choosing a color.Combobox39 examplesOther names: Autocomplete, AutosuggestAn input that behaves similarly to a select, with the addition of a free text input to filter options.Date input21 examplesA means of inputting a date – often separated into multiple individual fields for day/month/year.Datepicker54 examplesOther names: Calendar, Datetime pickerA visual way to choose a date using a calendar view.Drawer34 examplesOther names: Tray, Flyout, SheetA panel which slides out from the edge of the screen.Dropdown menu53 examplesOther names: Select menuA menu in which options are hidden by default but can be shown by interacting with a button; it differs from a select in that it shows actions or navigation options and is not a form input.Empty state14 examplesAn indication to the user that there is no data to display in the current view; it often includes an alternative action (e.g. try a different search term).Fieldset28 examplesA wrapper for related form fields.File6 examplesOther names: Attachment, DownloadA representation of a file such as an uploaded attachment or a downloadable PDF.File upload34 examplesOther names: File input, File uploader, DropzoneAn input which allows users to upload a file from their device.Footer24 examplesCommonly appearing at the bottom of a page or section, a footer is used to display copyright and legal information or links to related content.Form31 examplesA grouping of input controls that allow a user to submit information to a server.Header45 examplesAn element that appears across the top of all pages on a website or application; it usually contains the site name and main navigation.Heading30 examplesA title or caption used to introduce a new section.Hero14 examplesOther names: Jumbotron, BannerA large banner, usually appearing as one of the first items on a page; it often contains a full-width image.Icon51 examplesAn icon is a graphic symbol designed to visually indicate the purpose of an interface element.Image30 examplesOther names: PictureAn element for embedding images.Label16 examplesOther names: Form labelA text label for form inputs.Link76 examplesOther names: Anchor, HyperlinkA link is a reference to a resource. This can be external (e.g. a different web page) or internal (e.g. a specific element in the current document).List80 examplesLists are used for grouping a collection of related items. In HTML there are three types: unordered list — for items in no particular order. ordered list — for items in a specific order. description list — for key-value pairs. Modal95 examplesOther names: Dialog, Popup, Modal windowA modal is an interface element that appears over other content. It requires an interaction from the user before they can return to whatever is underneath.Navigation72 examplesOther names: Nav, MenuA container for navigation links; these can be to other pages (e.g. main site navigation) or to elements within the current page (e.g. a table of contents).Pagination61 examplesPagination is the process of splitting information over multiple pages instead of showing it all on a single page; also the name for the interface component used for navigating between these pages.Popover48 examplesAn element that pops up from another element over other content; it differs from a tooltip in that it is usually triggered via click instead of hover and can contain interactive elements.Progress bar41 examplesOther names: ProgressA horizontal bar indicating the current completion status of a long-running task, usually updated continuously as the task progresses, instead of in discrete steps.Progress indicator46 examplesOther names: Progress tracker, Stepper, Steps, MeterA representation of a user’s progress through a series of discrete steps.Quote15 examplesOther names: Pull quote, Block quoteQuotes are used to display a quotation: either from a person or another outside source or to highlight a passage of the current document (a pull quote).Radio button98 examplesOther names: Radio, Radio groupRadio buttons allow a user to select a single option from a list of predefined options.Rating18 examplesRatings let users see and/or set a star rating for a product or other item.Rich text editor4 examplesOther names: RTE, wysiwyg editorAn interface for editing “rich text” content (i.e. with formatting), usually through a WYSIWYG interface.Search input40 examplesOther names: SearchSearch inputs allow users to find content by entering a search term.Segmented control26 examplesOther names: Toggle button groupA hybrid somewhere between a button group, radio buttons, and tabs; segmented controls are used to switch between different options or views.Select91 examplesOther names: Dropdown, Select inputA form input used for selecting a value: when collapsed it shows the currently selected option and when expanded, it shows a scrollable list of predefined options for the user to choose from.Separator29 examplesOther names: Divider, Horizonal rule, Vertical ruleA separator between two elements, usually consisting of a horizontal line.Skeleton29 examplesOther names: Skeleton loaderA placeholder layout for content which hasn't yet loaded, usually built up of grey boxes.Skip link14 examplesLinks within a page for skipping to another section, primarily for users who navigate using a keyboard.Slider39 examplesOther names: Range inputA form control for choosing a value within a preset range of values.Spinner73 examplesOther names: Loader, LoadingA visual indicator that a process is happening in the background but the interface is not yet ready for interaction.Stack11 examplesA wrapper component for adding a consistent margin between components.Stepper19 examplesOther names: Nudger, QuantityA control for editing a numeric value with buttons for decrementing / incrementing.Table85 examplesA component for displaying large amounts of data in rows and columns.Tabs88 examplesOther names: Tabbed interfaceTabbed interfaces are a way of navigating between multiple panels, reducing clutter and fitting more into a smaller space.Text input92 examplesA form control that accepts a single line of text.Textarea63 examplesOther names: Textbox, Text boxA form control for editing multi-line text.Toast39 examplesOther names: SnackbarA type of alert which appears in a layer above other content, visually similar to a mobile or desktop push notification.Toggle58 examplesOther names: Switch, Lightswitch, Toggle buttonA control used to switch between two states: often on or off.Tooltip75 examplesOther names: ToggletipA means of displaying a description or extra information about an element, usually on hover, but can also be on click or tap.Tree view15 examplesA component for displaying nested hierarchical information, such as a table of contents or directory structure.Video12 examplesOther names: Video playerVideo players are used for displaying video content; they often include controls to control playback.Visually hidden11 examplesOther names: Screenreader onlyInvisible text used to provide extra context for users of assistive technology.Is there a component missing?Let me know"
