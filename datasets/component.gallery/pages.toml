onent links for Clarity, Talend Coral, and Wonderflow Wanda Design Systems. Fixes #64, #65 (thanks @amyrlam) Content2023-08-13AddedPopover component ContentUpdatedUpdate component examples for GitHub Primer, Nord Design System, Shopify Polaris, Skyscanner Backpack, Talend Coral Design System ContentTweak to contact form input labelsFixedFix incorrect link to Tooltip article on Open UI ContentFix incorrect use of Gatbsy Link component for external resource links2023-07-15AddedAdd .nvmrc fileFixedTypo on Skyscanner Backpack Nudger component ContentAdded gap between filters on component pagesUpdatedUpdate sharp to 0.32.3.2023-04-28FixedFix broken link for Decathlon Design System Content2023-04-15AddedNew design system: Google Material Design ContentFixedFix incorrect URLs for Reach UI Content2023-03-29UpdatedAdd new components for Carbon Design System Content2023-03-14FixedFix bug where only part of design system cards was clickable2023-03-06AddedDesign system cards now include links to Figma, Storybook, and GitHub where availableDesign systems can be filtered by platform (Figma, Storybook, and GitHub)New component: Empty State ContentNew design system: Wise design Content2023-02-26AddedAdd links to Open UI on component pages ContentUpdatedFix broken links, add new components for Ant Design, Decathlon Design System Content2023-02-14AddedHashicorp Helios Design System Content2023-01-07FixedFix broken links to Mozilla Protocol Design System, ONS Design System Content2022-12-27AddedAdd more resources to component pages ContentFixedFix incorrect style rule on accordion page (thanks @mrassili)Fix broken links to Talend Coral Design System, giffgaff Design System (thanks @Shrinks99), and Freshworks Crayons Design System (thanks @tif-calin) Content2022-10-30AddedAdd new feature badge, 'Unmaintained' to Design Systems which appear to have had no meaningful updates in the previous year (thanks to @aadrian for flagging this). Related to #40 ContentFixedFix 404 errors for various