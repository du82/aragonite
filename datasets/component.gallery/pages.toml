full_description = '''Recently updated componentsPopover48 examplesAn element that pops up from another element over other content; it differs from a tooltip in that it is usually triggered via click instead of hover and can contain interactive elements.Rating18 examplesRatings let users see and/or set a star rating for a product or other item.Accordion106 examplesOther names: Arrow toggle, Collapse, Collapsible sections, Collapsible, Details, Disclosure, Expandable, Expander, ShowyHideyThingAn accordion is a vertical stack of interactive headings used to toggle the display of further information; each item can be 'collapsed' with just a short label visible or 'expanded' to show the full content.Quote15 examplesOther names: Pull quote, Block quoteQuotes are used to display a quotation: either from a person or another outside source or to highlight a passage of the current document (a pull quote).Pagination61 examplesPagination is the process of splitting information over multiple pages instead of showing it all on a single page; also the name for the interface component used for navigating between these pages.Tabs88 examplesOther names: Tabbed interfaceTabbed interfaces are a way of navigating between multiple panels, reducing clutter and fitting more into a smaller space.Button141 examplesButtons trigger an action such as submitting a form or showing/hiding an interface component.Breadcrumbs54 examplesOther names: Breadcrumb trailA list of links showing the location of the current page in the navigational hierarchy.View all components Recently updated Design Systems<picture><source type="image/webp" srcSet="/static/7c7150cee9c2fe1c6bbee7268c881b28/b1cd7/playbook.ebay.com_..webp 360w,/static/7c7150cee9c2fe1c6bbee7268c881b28/abdd9/playbook.ebay.com_..webp 492w,/static/7c7150cee9c2fe1c6bbee7268c881b28/12849/playbook.ebay.com_..webp 500w,/static/7c7150cee9c2fe1c6bbee7268c881b28/b4193/playbook.ebay.com_..webp 720w,/static/7c7150cee9c2fe1c6bbee7268c881b28/85e35/playbook.