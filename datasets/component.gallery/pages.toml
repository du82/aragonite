full_description = '''ComponentBreadcrumbsOther names: Breadcrumb trailA list of links showing the location of the current page in the navigational hierarchy.Updated August 7th, 20191 minute readTable of contentsExamplesDescriptionLayoutMarkupUsage guidelinesResources54 examplesBreadcrumbsA11Y Style GuidejQueryCode examplesUsage guidelinesAccessibilityUnmaintainedOpen sourceBreadcrumbAnt DesignAnt FinancialReactCode examplesAccessibility issuesOpen sourceBreadcrumbsAtlassian Design SystemReactCode examplesUsage guidelinesTone of voiceAccessibilityBreadcrumbsAuroraGovernment of CanadaCSSCode examplesTone of voiceOpen sourceUnmaintainedBreadcrumbBackpackSkyscannerMobileReactCode examplesUsage guidelinesOpen sourceTone of voiceBreadcrumbsBase WebUberReactCSS-in-JSCode examplesUsage guidelinesOpen sourceBreadcrumbBolt Design SystemPegasystemsSassTwigWeb ComponentsCode examplesTone of voiceOpen sourceBreadcrumbBootstrapSassCode examplesAccessibilityOpen sourceBreadcrumbBulmaSassCode examplesAccessibility issuesOpen sourceBreadcrumbCarbon Design SystemIBMReactVanilla JSAngularVueSvelteWeb ComponentsCode examplesUsage guidelinesOpen sourceBreadcrumbCauldronDequeReactCSSCode examplesUsage guidelinesAccessibilityOpen sourceBreadcrumbCedarRecreational Equipment, Inc.VueSassCSS ModulesUsage guidelinesCode examplesOpen sourceBreadcrumbChakra UIReactCSS-in-JSCode examplesOpen sourceBreadcrumbsCoralTalendReactCode examplesTone of voiceOpen sourceBreadcrumbDecathlon Design SystemCSSReactSvelteVueWeb ComponentsUsage guidelinesCode examplesAccessibilityOpen sourceBreadcrumbDell Design SystemVanilla JSCode examplesUsage guidelinesBreadcrumbseBay MIND PatternsAccessibilityUsage guidelinesOpen sourceBreadcrumbeBay PlaybookHTMLReactCode examplesBreadcrumbsElastic UI frameworkElasticReactSassCode examplesOpen sourceBreadcrumbFlowbiteTailwind CSSOpen sourceCode examplesBreadcrumbFluent UIMicrosoftReactWeb ComponentsMobileUsage guidelinesCode examplesAccessibilityOpen sourceBreadcrumbsgiffgaff design systemUsage guidelinesCode examplesBreadcrumbsGOLD Design SystemDesign System AUReactSassCode examplesUsage guidelinesAccessibilityOpen sourceUnmaintainedBreadcrumbsGOV.UK Design SystemNunjucksCode examplesUsage guidelinesResearchOpen sourceBreadcrumbHeliosHashicorpEmberSassCode examplesUsage guidelinesAccessibilityOpen sourceBreadcrumbInstructure-UIInstructureReactCSS-in-JSCode examplesAccessibilityOpen sourceBreadcrumbJøkul DesignsystemFremtind ForsikringReactSassCode examplesUsage guidelinesOpen sourceBreadcrumbsLightning Design SystemSalesforceReactCode examplesUsage guidelinesTone of voiceOpen sourceBreadcrumbLunaSainsbury’sReactSassUsage guidelinesCode examplesTone of voiceBreadcrumbMomentum DesignCiscoReactSassCode examplesUsage guidelinesOpen sourceBreadcrumbMozilla ProtocolHandlebarsSassUsage guidelinesOpen sourceBreadcrumbsNessieNederlandse SpoorwegenWeb ComponentsTailwind CSSUsage guidelinesCode examplesBreadcrumbsNHS Digital service manualNunjucksCode examplesUsage guidelinesResearchTone of voiceOpen sourceBreadcrumbsONS Design SystemOffice for National StatisticsHTMLNunjucksSassCode examplesUsage guidelinesAccessibilityOpen sourceBreadcrumbsOrbitKiwi.comReactCSS-in-JSUsage guidelinesOpen sourceCode examplesTone of voiceBreadcrumbPajamasGitLabVueUsage guidelinesCode examplesOpen sourceBreadcrumbPatternFlyRed HatReactSassTone of voiceOpen sourceUsage guidelinesBreadcrumbPharosJSTORWeb ComponentsSassUsage guidelinesOpen sourceCode examplesAccessibilityTone of voiceBreadcrumbsQuasar FrameworkVueAccessibility issuesCode examplesOpen sourceBreadcrumbsRuter ComponentsReactCode examplesUnmaintainedBreadcrumbsSEB Design LibrarySkandinaviska Enskilda BankenSassReactAngularCode examplesUsage guidelinesBreadcrumbsSpectrumAdobeCSSWeb ComponentsReactCode examplesUsage guidelinesTone of voiceOpen sourceBreadcrumbsStacksStack OverflowStimulusCode examplesUsage guidelinesTone of voiceOpen sourceBreadcrumbsuStyleuSwitchSassTone of voiceCode examplesUsage guidelinesOpen sourceUnmaintainedBreadcrumbsW3C design systemSassVanilla JSCode examplesUsage guidelinesOpen sourceAccessibilityBreadcrumbWest Midlands Network Design SystemHTMLNunjucksSassCode examplesUsage guidelinesOpen sourceBreadcrumbsWorkday Canvas Design SystemReactUsage guidelinesAccessibilityTone of voiceOpen sourceDescriptionBreadcrumbs (or a ‘breadcrumb trail’) are a form of navigation, consisting of a list of links arranged in a hierarchical or chronological order. Their purpose is to help users keep track of their location by showing the position of the current page in one of the following contexts:the structural hierarchy of the site’s pages;the categories of the current page;You may also find examples of websites that use breadcrumbs to show the history of all the pages the user has visited in their current session, but this seems to be far less common. For the sake of this article, I will focus on the first two contexts: representing page structure; and representing nested categories.LayoutThe most common place for a breadcrumbs component to appear is before the main content of a page1. It's usual to see a progression from least specific (the highest-level page or least specific category) to most specific category. The highest level page may be the homepage or the root of the current section. The breadcrumbs on the documentation site for Gatsby JS represent the structural hierarchy with the homepage on the left and the current page on the right. Items are separated using an SVG arrow icon. The breadcrumbs on the recipe site Serious Eats represent a taxonomy based on ingredients. Items are separated using a forward slash. Separation of breadcrumb items is usually indicated with either: a greater-than symbol (>), a forward slash (/), or a similar-looking icon.MarkupFor a page at the URL, example.com/parent-page/current-page the markup could look like this:<nav aria-label="Breadcrumbs"> <ol> <li> <a href="/">Homepage</a> </li> <li> <a href="/parent-page">Parent page</a> </li> <li aria-current="page">Current page</li> </ol> </nav>Notes:As breadcrumbs are a type of navigation you should put them in a <nav> element.The order of the items in a breadcrumb list is important: use an ordered list (<ol>) with an <li> for each breadcrumb item.Add a meaningful label such as aria-label="Breadcrumbs" to the <nav> element. This helps differentiate it from any other navigation landmarks in the current document, such as the primary navigation.2Add the aria-current="page" attribute to the item which represents the current page.Usage guidelinesBreadcrumbs work best for websites based around a hierarchical structure, such as documentation or e-commerce websites. If everything is on a single level (e.g. posts on a blog), there’s no point.WAI-ARIA Authoring Practices 1.1↩Accessible Breadcrumb Navigation Pattern — Scott O'Hara↩ResourcesBreadcrumb GuidelinesTess GaddBalsamiqBreadcrumbOpen UI'''
