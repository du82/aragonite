full_description = '''ComponentAccordionOther names: Arrow toggle, Collapse, Collapsible sections, Collapsible, Details, Disclosure, Expandable, Expander, ShowyHideyThingAn accordion is a vertical stack of interactive headings used to toggle the display of further information; each item can be 'collapsed' with just a short label visible or 'expanded' to show the full content.Updated February 7th, 20213 minute readTable of contentsExamplesDescriptionMarkupApproach 1: Heading with ButtonApproach 2: Summary and DetailsInteractivityStylingUsage guidelinesResources106 examplesAccordionA11Y Style GuidejQueryCode examplesUsage guidelinesAccessibilityUnmaintainedOpen sourceCollapseAnt DesignAnt FinancialReactCode examplesAccessibility issuesOpen sourceAccordionAuroAlaska AirlinesWeb ComponentsSassCode examplesUsage guidelinesOpen sourceAccordionBackpackSkyscannerMobileReactCode examplesUsage guidelinesOpen sourceTone of voiceAccordionBase WebUberReactCSS-in-JSCode examplesUsage guidelinesOpen sourceAccordionBBC Global Experience LanguageAccessibilityUsage guidelinesUnmaintainedAccordionBolt Design SystemPegasystemsSassTwigWeb ComponentsCode examplesTone of voiceOpen sourceCollapseBootstrapSassCode examplesAccessibilityOpen sourceExpandable helperBrighton & Hove City Council Website pattern libraryUnmaintainedAccordionCarbon Design SystemIBMReactVanilla JSAngularVueSvelteWeb ComponentsCode examplesUsage guidelinesOpen sourceAccordionCauldronDequeReactCSSCode examplesUsage guidelinesAccessibilityOpen sourceExpandCollapsePanelCauldronDequeReactCSSCode examplesUsage guidelinesAccessibilityOpen sourceAccordionCedarRecreational Equipment, Inc.VueSassCSS ModulesUsage guidelinesCode examplesOpen sourceAccordionChakra UIReactCSS-in-JSCode examplesOpen sourceCollapseChakra UIReactCSS-in-JSCode examplesOpen sourceAccordionClarity Design SystemVMwareCSSAngularWeb ComponentsCode examplesUsage guidelinesOpen sourceStack ViewClarity Design SystemVMwareCSSAngularWeb ComponentsCode examplesUsage guidelinesOpen sourceAccordionCoralTalendReactCode examplesTone of voiceOpen sourceAccordionCrayonsFreshworksWeb ComponentsCode examplesOpen sourceAccordionDecathlon Design SystemCSSReactSvelteVueWeb ComponentsUsage guidelinesCode examplesAccessibilityOpen sourceAccordionDell Design SystemVanilla JSCode examplesUsage guidelinesView More/LessDell Design SystemVanilla JSCode examplesUsage guidelinesAccordioneBay MIND PatternsAccessibilityUsage guidelinesOpen sourceDetailseBay MIND PatternsAccessibilityUsage guidelinesOpen sourceExpansioneBay PlaybookHTMLReactCode examplesAccordionElastic UI frameworkElasticReactSassCode examplesOpen sourceAccordionElisa Design SystemReactUsage guidelinesCode examplesAccessibilityAccordionFlowbiteTailwind CSSOpen sourceCode examplesAccordionForma 36ContentfulReactCSS-in-JSCode examplesOpen sourceArrow ToggleFutureLearn design systemFutureLearnReactUsage guidelinesTone of voiceCollapseGeist Design SystemVercelReactCode examplesAccordiongeneric-componentsWeb ComponentsCode examplesAccessibilityOpen sourceDisclosuregeneric-componentsWeb ComponentsCode examplesAccessibilityOpen sourceAccordionGestaltPinterestReactCSSCode examplesOpen sourceUsage guidelinesAccordiongiffgaff design systemUsage guidelinesCode examplesAccordionGOLD Design SystemDesign System AUReactSassCode examplesUsage guidelinesAccessibilityOpen sourceUnmaintainedAccordionGOV.UK Design SystemNunjucksCode examplesUsage guidelinesResearchOpen sourceDetailsGOV.UK Design SystemNunjucksCode examplesUsage guidelinesResearchOpen sourceAccordionGrommetReactCode examplesOpen sourceDisclosureHeadless UITailwind Labs ReactVueCode examplesAccessibilityOpen sourceAccordionHelsinki Design SystemCity of HelsinkiReactCSSCode examplesUsage guidelinesAccessibilityOpen sourceCollapsible sectionsInclusive ComponentsCode examplesAccessibilityUnmaintainedToggleDetailsInstructure-UIInstructureReactCSS-in-JSCode examplesAccessibilityOpen sourceToggleGroupInstructure-UIInstructureReactCSS-in-JSCode examplesAccessibilityOpen sourceAccordionJøkul DesignsystemFremtind ForsikringReactSassCode examplesUsage guidelinesOpen sourceExpandButtonJøkul DesignsystemFremtind ForsikringReactSassCode examplesUsage guidelinesOpen sourceAccordionLightning Design SystemSalesforceReactCode examplesUsage guidelinesTone of voiceOpen sourceExpandable SectionLightning Design SystemSalesforceReactCode examplesUsage guidelinesTone of voiceOpen sourceSummary DetailLightning Design SystemSalesforceReactCode examplesUsage guidelinesTone of voiceOpen sourceAccordionLunaSainsbury’sReactSassUsage guidelinesCode examplesTone of voiceDisclosureMailchimp design systemCode examplesAccordionMomentum DesignCiscoReactSassCode examplesUsage guidelinesOpen sourceDetailsMozilla ProtocolHandlebarsSassUsage guidelinesOpen sourceDetails componentMozilla ProtocolHandlebarsSassUsage guidelinesOpen sourceExpandableNessieNederlandse SpoorwegenWeb ComponentsTailwind CSSUsage guidelinesCode examplesCollapseNextUIReactCSS-in-JSCode examplesOpen sourceExpanderNHS Digital service manualNunjucksCode examplesUsage guidelinesResearchTone of voiceOpen sourceDetailsNHS Digital service manualNunjucksCode examplesUsage guidelinesResearchTone of voiceOpen sourceAccordionNucleus Design SystemBritish GasWeb ComponentsUsage guidelinesExpanderNucleus Design SystemBritish GasWeb ComponentsUsage guidelinesAccordionONS Design SystemOffice for National StatisticsHTMLNunjucksSassCode examplesUsage guidelinesAccessibilityOpen sourceDetailsONS Design SystemOffice for National StatisticsHTMLNunjucksSassCode examplesUsage guidelinesAccessibilityOpen sourceAccordionOntario Design SystemOntario GovernmentHTMLSassCode examplesUsage guidelinesAccessibilityAccordionOrbitKiwi.comReactCSS-in-JSUsage guidelinesOpen sourceCode examplesTone of voiceCollapseOrbitKiwi.comReactCSS-in-JSUsage guidelinesOpen sourceCode examplesTone of voiceAccordionOxygenRepsolHTMLCode examplesUsage guidelinesAccordionPajamasGitLabVueUsage guidelinesCode examplesOpen sourceDisclosurePasteTwilioReactCSS-in-JSUsage guidelinesCode examplesTone of voiceAccessibilityOpen sourceAccordionPatternFlyRed HatReactSassTone of voiceOpen sourceUsage guidelinesExpandable sectionPatternFlyRed HatReactSassTone of voiceOpen sourceUsage guidelinesAccordionPorsche Design SystemWeb ComponentsAngularReactVueCode examplesOpen sourceDetailsPrimerGitHubReactCode examplesOpen sourceExpansion ItemQuasar FrameworkVueAccessibility issuesCode examplesOpen sourceAccordionRadix PrimitivesWorkOSReactCode examplesOpen sourceCollapsibleRadix PrimitivesWorkOSReactCode examplesOpen sourceAccordionReach UIReactAccessibilityCode examplesOpen sourceDisclosureReach UIReactAccessibilityCode examplesOpen sourceDisclosureReakitReactCode examplesOpen sourceAccessibilityAccordionRuter ComponentsReactCode examplesUnmaintainedAccordionSEB Design LibrarySkandinaviska Enskilda BankenSassReactAngularCode examplesUsage guidelinesSection expanderSEB Design LibrarySkandinaviska Enskilda BankenSassReactAngularCode examplesUsage guidelinesCollapsibleSeedsSprout SocialReactCode examplesUsage guidelinesTone of voiceAccordion ItemSeek style guideReactCode examplesUnmaintainedToggle ContentSeek style guideReactCode examplesUnmaintainedRead MoreSeek style guideReactCode examplesUnmaintainedAccordionshadcn/uiReactTailwind CSSCode examplesOpen sourceCollapsibleshadcn/uiReactTailwind CSSCode examplesOpen sourceDetailsShoelaceWeb ComponentsCode examplesOpen sourceAccordionSourceThe GuardianReactCode examplesUsage guidelinesOpen sourceAccordionSpark Design SystemQuicken LoansReactAngularCode examplesUsage guidelinesOpen sourceUnmaintainedExpandableStacksStack OverflowStimulusCode examplesUsage guidelinesTone of voiceOpen sourceAccordionUnited States Web Design SystemUnited States governmentNunjucksCode examplesUsage guidelinesOpen sourceCollapsible containersW3C design systemSassVanilla JSCode examplesUsage guidelinesOpen sourceAccessibilityDisclosureWandaWonderflowReactCSS ModulesCode examplesOpen sourceAccordionWandaWonderflowReactCSS ModulesCode examplesOpen sourceExpanderWandaWonderflowReactCSS ModulesCode examplesOpen sourceAccordionWest Midlands Network Design SystemHTMLNunjucksSassCode examplesUsage guidelinesOpen sourceDetailsWest Midlands Network Design SystemHTMLNunjucksSassCode examplesUsage guidelinesOpen sourceExpandable containerWorkday Canvas Design SystemReactUsage guidelinesAccessibilityTone of voiceOpen sourceDescriptionThe examples above use a variety of different names: many of these refer to the collapsible/expandable nature of the component, while others reference the HTML element used by their implementation: details. All of these examples have two primary elements in common: a heading and some content: interacting with the heading toggles the visibility of the content; this heading + content pattern can be repeated as many times as needed.MarkupApproach 1: Heading with ButtonHere is example markup for a single accordion item:<h2> <button type="button" aria-expanded="false" aria-controls="accordion-item-1-content" > Accordion item 1 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" aria-hidden="true" focusable="false" > <polygon points="0,64 128,192 256,64" /> </svg> </button> </h2> <div id="accordion-item-1-content"> <p>Accordion item 1 content</p> </div>This example uses an h2 for the heading but this should be whichever heading level is appropriate for where you’re using it.Each accordion item can be in one of two states: expanded or collapsed. This is communicated to assistive technology via the aria-expanded attribute on the button.The aria-controls attribute ties the button to the content it controls using the id of the content container (accordion-item-1-content in the example).The button contains a downwards-pointing arrow to hint that it can be expanded. When the accordion item is in its expanded state, this is rotated 180 degrees to point upwards. It is also common to see plus (+) and minus (-) symbols used instead of arrows.The icon in this example uses an inline SVG to render the arrow. It is given the aria-hidden="true" attribute to hide it from assistive technologies (as well as focusable="false" to address an inconsistency in Internet Explorer and older versions of Edge). You could alternatively use a CSS background image or pseudo-element.Approach 2: Summary and DetailsThe following example uses the summary and details elements to achieve a similar result to the previous example, without JavaScript:<details> <summary> <h2>Accordion item 1</h2> </summary> <p>Accordion item 1 content</p> </details>To set the initial state of the accordion item to be 'expanded', you can add the attribute open="true" to the details element (the default is false, so this can be omitted for collapsed items).Browser support warning: The details and summary elements are not supported by Internet Explorer or Opera Mini at the time of writing.1InteractivityThe first example, requires a small amount of JavaScript to toggle the aria-expanded attribute on the button and the visibility of the content.In situations where JavaScript is not enabled or doesn’t work for some reason, it is desirable for the content to still be visible (because the button requires Javascript, the user has no way of making the content visible if JavaScript is disabled). Instead of making the content invisible by default or having buttons that do nothing, you can create your accordion component without the button element, and use JavaScript to progressively enhance the HTML with additional interactivity. There is an example on how to do this on Inclusive Components.The second example works without JavaScript in browsers that support the details element. In browsers that don’t support the details element, all of the content will be rendered, but it won’t be collapsible.StylingIf you go for the first approach, using a button element which triggers some JavaScript, you can use the aria-expanded attribute as a hook for styling the button. The following example will rotate the arrow 180 degrees when the accordion is expanded:button[aria-expanded='true'] > svg { transform: rotate(180deg); }If you decide on the details and summary elements instead, there are a couple of default browser styles you may want to override:2The default cursor for the summary is the text selection type which doesn’t give great affordance that the element is clickable. The following CSS, will change the cursor to the pointer style (like that shown when hovering over links):details summary { cursor: pointer; }If you nest a block-level element like a heading in a summary element (as in the example above), it appears below the arrow marker. To make it appear next the the arrow, set its display property to inline:details summary > * { display: inline; }Usage guidelinesAccordions work well on smaller screens, as they reduce the amount of vertical scrolling required to get an overview of the content. They also require very little horizontal space, unlike components such as tabs.Some implementations allow for only a single accordion item to be expanded at any one time — do this with caution, as some users may wish to view the content from two items at the same time.Be mindful that when you are using an accordion you are hiding content from users — they therefore should not be used for essential information.Details & Summary elements: Caniuse.com↩Two Issues Styling the Details Element and How to Solve Them, Greg Gibson on CSS-Tricks↩ResourcesUI cheat sheet: AccordionsTess GaddUX CollectiveAccordion GuidelinesTess GaddBalsamiqWhy <details> is Not an AccordionDave RupertStop Using ‘Drop-down’Adrian RoselliAccordion Icons: Which Signifiers Work Best? Page Laubheimer and Raluca BudiuNielsen Norman Group'''
