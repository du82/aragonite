ts2020-08-27ChangedRemove Google Analytics, replace it with Plausible Analytics2020-08-12AddedNew design system: Atlassian Design System (replaces Atlaskit) Content2020-08-10AddedNew design system: REI Cedar ContentChangedUpdate accordion article to reflect current browser support of details element ContentFixedUpdate links to all Adobe Spectrum CSS components to fix 404 errors2020-07-26ChangedUse gatsby-plugin-svg-sprite-loader for icons instead of react-iconsForce trailing slashes for URLs2020-07-24FixedImprove performance of design-systems page by removing image placeholders2020-07-04AddedNew design systems: Elastic UI framework, Aurora, Paste ContentNew component: Horizontal rule Content2020-06-06AddedComplete tagging of Design Systems with 'Tone of voice' guidelines ContentChangedMove Select into its own component ContentFixedVarious linting errorsAccessibility issues2020-05-28AddedEnable Gatsby Incremental Builds on Netlify2020-05-13AddedNew Design System: Base Web ContentAdded more design system resources to about page ContentFixedIncorrect sorting of Design Systems due to GraphQL sorting being case-sensitiveChangedSimplified sorting options2020-05-04AddedNew Design System: uStyle ContentRelated components are now shown at the bottom of component pagesDesign Systems are now labelled to show if they include Tone of voice guidelines ContentFixedUpdate incorrect link on Tabs page2020-04-29AddedNew “Design System”: 98.css Content2020-04-18AddedNew Design system: Ruter Components ContentChangedSplit Dropdown component into three different components: Select, Dropdown menu and Combobox ContentFixedUpdate broken links for Bulb Solar Design System components2020-03-29AddedList most recently updated Design Systems on homepageDesign Systems: eBay MIND Patterns, Workday Canvas, BBC GEL, ICS Design System (thanks @ignorantcow for suggesting these four), Sainsbury’s Luna, Quicken Loans Spark ContentFixedMissing footnotes on Button article Content2020-02-26AddedTwitter and