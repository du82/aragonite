description = "Have you thought about becoming a data analyst or starting an entry-level IT job but don't know where to start? Learn how you can change careers with CompTIA."
full_description = "Take the first steps toward a bright future and launch your career in tech fields like IT, cybersecurity, data analytics, and more. People like you are realizing a better life in tech every date. Get inspired by their stories, explore the career tool kit and learn how IT jobs can change your future. 57% of senior leaders are placing less priority on four-year degrees. Get certified and start your career in a matter of weeks, not years. Some of the most in-demand IT skills have nothing to do with math or science – project management, communication and resourcefulness, for example. IT pros collaborate, work on teams and interact with end users daily. Tech careers are great for introverts and extroverts alike. You can start your career with training and certifications, which are significantly less expensive than college. Some people qualify for free or reduced-cost training and certifications, making it a no-brainer. Scott previously worked as a personal trainer and now works in IT with the help of CompTIA A+ and Security+. From working in a library to training data center technicians, Allison transformed her career with CompTIA Data+. Vernon, a Chicago salesman, found satisfaction and fulfilment in a cybersecurity career despite lack of experience with the help of CompTIA A+."
