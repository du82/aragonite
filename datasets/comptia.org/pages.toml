full_description = "Digital badges are an exciting new way to highlight your completed CompTIA certifications on your online profiles, resume and more. Currently, more than 2 million CompTIA IT professionals are sharing their skills this way. CompTIA has included digital badges as an additional way for you to share and validate your CompTIA certification achievements. A digital badge consists of an image and metadata that are uniquely linked to you. Together, they serve as a compelling digital showcase of your certification achievements. Clicking on your digital badge grants immediate access to validated information that features your knowledge and skills. When you earn your CompTIA certification, you’ll receive an email letting you know that you can claim your digital badge at Credly’s Acclaim website. Claiming your digital badge is quick and easy when you follow these steps: Questions? Watch this short video to learn how to claim and share your digital badge. Read our FAQ, which provide answers to the most common questions about digital badges. Digital badges are available for active CompTIA certifications and stackable certifications that have not been retired. These include both Good-for-Life (GFL) and Continuing Education (CE) certifications. CompTIA certifications that have been retired or have been removed from the market otherwise are not eligible for a digital badges. If you hold one of these certifications, it may still be Good for Life (GFL) even though it is not eligible for a digital badge."
