["https://comptia.org/certifications/become-a-subject-matter-expert"]
title = "Become a Subject Matter Expert (SME) | CompTIA IT Certifications"
description = "Learn how to become one of CompTIA’s Subject Matter Experts and help CompTIA develop and maintain IT certification exams."
full_description = "Here at CompTIA, we use Subject Matter Experts (SMEs) for help in developing and maintaining our certification exams. Input from IT professionals working in the field is crucial to our ability in developing relevant and up-to-date exam content. Assistance from SMEs is essential in developing quality content for the appropriate level of expertise. SMEs work with peers and CompTIA staff to create or review exam items associated with the technologies, skills and best practices used by IT professionals. We make sure to reward our SMEs for their valuable help and keep them well-fed! SMEs who participate in workshops at CompTIA headquarters are provided CompTIA swag, a CompTIA voucher, and all the breakfast, lunch, snacks and (sometimes) dinner you can eat. Richard Rieben, a member of the CompTIA Subject Matter Expert Technical Advisory Committee, discusses his experience as a CompTIA SME and why he thinks other experts should get involved. “If you enjoy taking certification exams more than you should, the CompTIA SME community might be the perfect place for you,” Rieben said. “Don’t be shy! If you think you can contribute and you meet all of the desired criteria, consider applying for a program in your area of expertise.” Ryan Frillman has a lifelong love of computers and community service. In this profile, he explains that his desire to help others learn and grow are what motivate him to participate as a SME. “When you participate in these events, treat it like a learning experience,” Frillman said. “That’s what we’re all here for.” CompTIA hires Subject Matter Experts (SMEs) to provide their industry expertise and knowledge in specific technical areas. SMEs are expected to possess the knowledge and skills of the target job role to inform accurate and valid content development initiatives for a CompTIA certification. SMEs are also expected to learn how to develop exam content, review the exam content, and provide judgments about the quality/difficulty of our exams."
year_published = 2025
