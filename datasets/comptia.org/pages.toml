full_description = "CompTIA PenTest+ is for cybersecurity professionals tasked with penetration testing and security consulting. Demonstrate Competency of Current Trends:Unlike other penetration testing exams that only cover a portion of stages, CompTIA PenTest+ uses both performance-based and knowledge-based questions to ensure all stages are mastered. Prove You Know the Latest Techniques:CompTIA PenTest+ is the only product on the market covering artificial intelligence (AI), hands-on inventory, scanning and analysis, attacks, lateral movement, as well as planning, scoping, and vulnerability management. Perform Hands-on Tasks:CompTIA PenTest+ requires a candidate to demonstrate key pen testing skills for all attack surfaces , including the cloud, web apps, APIs, IoT, on-premises and hybrid network environments. Thank you to all the cybersecurity professionals who sat for the beta exam for the next version of PenTest+. The beta exam closed Aug 6. Due to beta exam scoring processes, participants will not know whether they passed/earned the certification until the final release date, tentatively December 2024, and will be notified directly from Pearson VUE. Includes updated techniques emphasizing scoping and organizational/customer requirements, governance, risk and compliance concepts, reporting, communication, remediation recommendations and demonstrating an ethical hacking mindset. Expanded coverage of information gathering, enumeration, and passive/active reconnaissance, with the goal of conducting inventory. Includes identifying scripts and explaining use cases of various scripting languages (scripting or coding is not required). Updated skills that cover vulnerability scanning tools, analysis, management, and physical security weaknesses. Includes new techniques to analyze targets, select the best approach, and perform network attacks, wireless attacks, application-based attacks, and cloud attacks. Learn about artificial intelligence (AI) attacks and scripting automation. Additional focus on maintaining persistence, lateral movement, staging, exfiltration and post-exploitation, including clean up and restoration activities."
