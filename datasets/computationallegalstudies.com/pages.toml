["https://computationallegalstudies.com/2009/04/13/opensecrets-open-data-visualizing-the-publicly-traded-assets-of-senators-in-2007"]
title = "OpenSecrets Open Data! – Visualizing the Publicly Traded Assets of Senators in 2007 – Computational Legal Studies"
full_description = "OpenSecrets Open Data! – Visualizing the Publicly Traded Assets of Senators in 2007 April 13, 2009 clsadmin3 Comments on OpenSecrets Open Data! – Visualizing the Publicly Traded Assets of Senators in 2007 OpenSecrets.org went open with their data today. In honor of this very significant act and its ramifications on future government transparency, I’ve decided to produce a quick visualization to answer a question I’ve long been intrigued by – the publicly traded holdings of Senators. One good proxy to this question is the Personal Financial Disclosure data released today by Open Secrets. In the words of Open Secrets, Any legal ownership a person has in a company or property is classified as an asset, including brokerage accounts, corporate bonds and stocks. For the most part, lawmakers seem to have a stake in big-name, recognizable companies and properties. They need to report only assets worth more than $1,000 at the end of the calendar year, or producing more than $200 of income. (One note about mutual funds: Filers are not required to provide detail on funds’ individual holdings.) Any purchases, sales or exchanges of assets during the year of more than $1,000 must be disclosed as transactions. Reporting the value of a primary residence, unless it produces income, is not required. This visual represents a very rough cut of this data for the holdings of Senators in 2007. As is often the case with real form data, there are inconsistencies across the data set. Ideally, one could simply use the asset’s description, which would accurately report the assets held in an account. However, as these are not always provided, the “asset source” is used in their absence. When combined with the mutual fund issues mentioned above, blind trust reporting, and these possible transcription errors, there is a compelling case against strict interpretation of this visual. In any case, enjoy the visual, and again, thanks to Open Secrets for their monumental move forward! TaggedcongressindustriessenateUncategorizedShare"
