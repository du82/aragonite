["https://computationallegalstudies.com/2010/05"]
title = "May 2010 – Computational Legal Studies"
full_description = "- Pocket Justice – An App for Your IPhone / IPod Touch May 29, 2010 clsadmin Jerry Goldman (Northwestern/ Oyez Project) has recently released a great app for those wanting to quickly access SCOTUS case summaries and/or audio recordings from their Iphones. The top 100 constitutional law cases are made available for free–thanks to the good folks at Justia. Those looking for the full 600+ cases can access them for the low price of $4.99. Here is the complete description – “PocketJustice brings the U.S. Supreme Court down to earth through abstracts of the Court’s constitutional decisions and access to its public sessions. The application includes voting alignments and biographical sketches for all justices. PocketJustice harnesses recordings of the Court’s public proceedings to deliver hundreds of hours of oral arguments and opinion announcements. In many of these cases, PocketJustice provides synchronized, searchable transcripts identifying all speakers. This version offers information and audio for the top 100 constitutional law cases. The complete version ($ 4.99) provides information and audio for all 600+ constitutional law cases in the Supreme Court canon.” - How a Bill Becomes a Law [Via Mike Wirth] May 28, 2010 clsadmin Check out this nice infographic! [HT RC Richards @ Legal Informatics Blog] - As Science Evolves, How Can Science Policy? May 26, 2010 clsadmin The above image is directly linked to the NBER paper. Here is a link to a story covering the release of the paper. [Hat Tip to Marginal Revolution] - The Bilski Case: Still Waiting for the Supreme Court’s Decision May 23, 2010 clsadmin Along with a non-trivial subset of the legal blogosphere, we eagerly await the Supreme Court’s decision in the Bilski case. Perhaps tomorrow will be the day? In the meantime, here are a variety of thoughts on the matter. Bilski Blog / EFF / Now Europe / PatentlyO / GenomicsLawReport / Ipwatchdog / Fenwick&West / InsideCounsel. This one from Greg Laden is also fun."
