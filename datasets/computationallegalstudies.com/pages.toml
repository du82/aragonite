full_description = '- Tecnologia Rouba vaga de Trabalhadores Qualificados (Technology Steals Wave of Skilled Workers) [ via Folha.com] October 31, 2011 clsadmin Please see my comments in Folha De São Paulo (Brazil’s Largest Newspaper) - Selling Pieces of Law Firms to Investors [via NY Times] October 30, 2011 clsadmin Having recently returned from the LegalFutures.co.uk meeting on alternative business structures (ABS), I can report there are number of important developments taking place across the pond. Developing the next generation of legal service delivery is question of supply chain, scale efficiency, software aided point of sale legal practice, access to capital markets, marketing, queueing theory, legal information technology – you know – all of the things that we teach students in law school (see my MIT School of Law proposal for a potential way forward — #icebergsahead ) For additional thoughts and related questions – check out Renee Knake’s round up @ Legal Ethics Forum and last month’s Unlocking the Law Symposium @ Truth on the Market. - THINK Exhibit: An Exploration into Making the World Work Better [IBM Let’s Build a Smarter Planet] October 22, 2011 clsadmin - Legal Futures.co.uk Conference – New ways to Practise Law October 18, 2011 clsadmin My thanks to Neil Rose and all of the LegalFutures.co.uk conference organizers and speakers – it was a very interesting conference. As a byproduct of the modifications to the UK Legal Services Act, change is on the march in the UK legal services market. Keep your eye on these developments — as they may be coming to the US — sooner rather than later. - The MIT School of Law: A Perspective on Legal Education in the 21st Century [Presentation Slides Version 1.02] October 13, 2011 clsadmin The "MIT School of Law" – Presentation Version 1.02 – (10/14/11) View more presentations from Daniel Katz Paper is in progress and will be on SSRN soon – In the meantime, I would appreciate some constructive feedback from the friends of this blog – just message me directly katzd@law.msu.edu — Cheers, Dan'
