full_description = "- Thomas Goetz: It’s Time to Redesign Medical Data [TEDMed] January 25, 2011 clsadmin Thomas Goetz is the executive editor of Wired and author of “The Decision Tree: Taking Control of Your Health in the New Era of Personalized Medicine. From the Talk Abstract “Your medical chart: it’s hard to access, impossible to read — and full of information that could make you healthier if you just knew how to use it. At TEDMED, Thomas Goetz looks at medical data, making a bold call to redesign it and get more insight from it.” - Modeling the Financial Crisis [ From Nature ] January 19, 2011 clsadmin This week’s issue of Nature offers two brief but meaningful articles on the financial crisis. Here are the abstracts: Financial Systems: Ecology and Economics (By Neil Johnson & Thomas Lux): “In the run-up to the recent financial crisis, an increasingly elaborate set of financial instruments emerged, intended to optimize returns to individual institutions with seemingly minimal risk. Essentially no attention was given to their possible effects on the stability of the system as a whole. Drawing analogies with the dynamics of ecological food webs and with networks within which infectious diseases spread, we explore the interplay between complexity and stability in deliberately simplified models of financial networks. We suggest some policy lessons that can be drawn from such models, with the explicit aim of minimizing systemic risk.” Systemic Risk in Banking Ecosystems (By Andrew G. Haldane & Robert M. May): “In the run-up to the recent financial crisis, an increasingly elaborate set of financial instruments emerged, intended to optimize returns to individual institutions with seemingly minimal risk. Essentially no attention was given to their possible effects on the stability of the system as a whole. Drawing analogies with the dynamics of ecological food webs and with networks within which infectious diseases spread, we explore the interplay between complexity and stability in deliberately simplified models of financial networks. We suggest some policy lessons that can be drawn from such models, with the explicit aim of minimizing systemic risk.”"
