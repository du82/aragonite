full_description = "- 3 Thoughts on E-Discovery in 2015 and Beyond – LegalTechNYC 2013 – ( Daniel Martin Katz + Michael J. Bommarito II ) January 30, 2013 clsadmin 3 Thoughts on E-Discovery in 2015 and Beyond – LegalTechNYC 2013 from Daniel Martin Katz The focus of my panel was “E-Discovery in 2015 and Beyond.” My Panel included: The Honorable Faith Hochberg, United States District Court for the District of New Jersey; Joe Looby, FTI Technology & Dawn Hall, FTI Consulting. As was true last year, I was the only Law Professor asked to speak at an event which draws more than 12,000 attendees from many of the law divisions of the Fortune 500, many of the law firms in the AmLaw100 / NLJ 250 and the large number of emerging legal technology companies which as Bill Henderson noted are not really being held back by Rule 5.4. - UPDATED — ReInventLaw Silicon Valley — March 8, 2013 @ The Computer History Museum — Sign Up For Tickets and Check Back for Additional Speakers To Be Announced Soon! January 26, 2013 clsadmin Click Here for Full Sized Image! Access ReInventLawSiliconValley.com - Next-Gen Video Format H.265 Is Approved, Paving The Way For High-Quality Video On Low-Bandwidth Networks [via TechCrunch] January 26, 2013 clsadmin - Novel Views: Les Miserables (Visual Display of Textual Relationships, etc.) { via neoformix.com } January 15, 2013 clsadmin {HT:Infosthetics.com} - A Sad Irony: The Federal Judiciary’s PACER Pricing Is Illegal [via Aaron Greenspan] January 15, 2013 clsadmin - Robots Are Already Replacing Us (via Wired) January 6, 2013 clsadmin {Not a binary proposition – displacing 20% of work in a given sector is a very big deal}"
