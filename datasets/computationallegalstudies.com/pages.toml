["https://computationallegalstudies.com/2009/04"]
title = "April 2009 – Computational Legal Studies"
full_description = "- Taking Judicial Content Seriously–Lupu & Fowler’s Strategic Content Model April 30, 2009 clsadmin In my conversations with judicial politics scholars, many lament how many of our existing approaches tend to ignore opinion content. For those interested in embedding opinion content into existing theories of judicial decision making … consider Yonatan Lupu & James Fowler’s paper recently posted to the SSRN. The authors present a strategic model of judicial bargaining over opinion content. They note … “we find that the Court generates opinions that are better grounded in law when more justices write concurring opinions.” To generate the specification for “grounding in law” the authors use Kleinberg’s Hubs and Authorities Algorithm calculated at the time the opinion was authored. The Strategic Content Paper is available here. The visual above is drawn from a related Fowler project located here. Another very worthwhile paper authored by Fowler, Johnson, Spriggs, Jeon & Wahlbeck is located here. - The S.I.R. Model — A Simple Model With Applications to Swine Flu, etc. April 28, 2009 clsadmin Last week we offered a model of intellectual diffusion built upon a standard fare social epidemiology model. Given recent events within the United States, Mexico and potentially worldwide, we thought it would be worthwhile to highlight the classic S.I.R. (Susceptible, Infected, Recovered) model. Netlogo offers a user friendly version of the model. Using this platform, we hope the exploration of the dynamics of S.I.R. might prove illuminating. First, various hosts have different levels of interactions (work, home, transit, etc.) and so this network approach represents a blunt measure. To start the model at the default parameters, push the SETUP Button and then the GO Button. As the model runs, the plot tracks the Susceptible, Infected, Recovered. The model contains a variety of “sliders.” The model can be rerun at lots of combinations of parameter levels. Those “sliders” fall into several categories: Network Attributes, Virus Attributes, Node Attributes. The full documentation is available here. With respect to the swine flu, one important parameter is the delay between when an individual becomes infectious and when that individual is likely to become symptomatic. This parameter can be tuned in the simulation above using VIRUS-CHECK-FREQUENCY slider. From the documentation… “Infected nodes are not immediately aware that they are infected. Only every so often (determined by the VIRUS-CHECK-FREQUENCY slider) do the nodes check whether they are infected by a virus.” An additional parameter worthy of consideration is the VIRUS-SPREAD-CHANCE. Consider this slider as a rough measure of the underlying infectiousness of the virus in question. It is important to note the above simulation is an incredible simplification of the world faced by public health officials. Additionally, this version of the model was designed to consider the spread of disease on a computer network. Notwithstanding these limitations, we thought it useful to highlight a computational approach to this important matter of public concern."
