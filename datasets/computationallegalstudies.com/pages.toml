["https://computationallegalstudies.com/2012/02"]
title = "February 2012 – Computational Legal Studies"
full_description = "- Judge Peck’s Opinion on Computer Assisted Review (i.e. Predicitve Coding) February 25, 2012 clsadmin See also Monique Da Silva Moore, et al., Plaintiffs, v. Publicis Groupe & MSL Group, Defendents (Opinion and Order). as well as this article, this article, this article, this article, etc. from a few days ago (when there was a bit of misreporting on this case). [ HT: Legal Informatics Blog ] - Health InfoScape [ via GE Data Visualization Lab ] February 20, 2012 clsadmin From the GE Page: “When you have heartburn, do you also feel nauseous? Or if you’re experiencing insomnia, do you tend to put on a few pounds, or more? By combing through 7.2 million of our electronic medical records, we have created a disease network to help illustrate relationships between various conditions and how common those connections are. Take a look by condition or condition category and gender to uncover interesting association. About the Data: “The information used for this visualization is based on 7.2 million patient records from GE’s proprietary database, and represents some of the conditions that commonly affect Americans today. By investigating how different ailments are related, one may gain various insights about condition associations. The numbers and percentages are meant to represent general trends. Looking at the data in new ways like this can help us understand health and gain new insights about how to take better care of ourselves and the healthcare system.” - Neil Burgess: How Your Brain Tells You Where You Are [TED Salon] February 19, 2012 clsadmin How do you remember where you parked your car? How do you know if you’re moving in the right direction? Neuroscientist Neil Burgess studies the neural mechanisms that map the space around us, and how they link to memory and imagination. - The Age of Big Data [via NY Times] February 12, 2012 clsadmin Please read this article and ask yourself how can we get in front of this – both as a profession and as an academy. Big Data and ‘Soft’ Artificial Intelligence are the center piece of my presentation and forthcoming paper the Age of Quantitative Legal Prediction. For the legal services industry, a very different world is coming (is already here in certain circles). As a Law Professor, I am preparing my students to be the leaders in this world with my Quantitative Methods for Lawyers course, Legal Information Technology & Engineering (London Summer Program), E-Discovery as well as several other courses that my MSU colleagues and I are developing. As I said to start the year – it is time to step up your game. 🙂"
