["https://computationallegalstudies.com/2009/11/11/new-paper-properties-of-the-united-states-code-citation-network"]
title = "New Paper: Properties of the United States Code Citation Network – Computational Legal Studies"
full_description = "New Paper: Properties of the United States Code Citation Network November 11, 2009 clsadminComment on New Paper: Properties of the United States Code Citation Network We have been working on a larger paper applying many concepts from structural analysis and complexity science to the study of bodies of statutory law such as the United States Code. To preview the broader paper, we’ve published to SSRN and arXiv a shorter, more technical analysis of the properties of the United States Code’s network of citations. Click here to Download the Paper! Abstract: The United States Code is a body of documents that collectively comprises the statutory law of the United States. In this short paper, we investigate the properties of the network of citations contained within the Code, most notably its degree distribution. Acknowledging the text contained within each of the Code’s section nodes, we adjust our interpretation of the nodes to control for section length. Though we find a number of interesting properties in these degree distributions, the power law distribution is not an appropriate model for this system. Citation In-Degree Taggedcomplex systemscomputational legal studiesnetwork analysisUncategorizedunited states codeShare"
