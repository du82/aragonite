["https://computationallegalstudies.com/2010/02"]
title = "February 2010 – Computational Legal Studies"
full_description = "- Dissipation and Displacement of Hotspots in Reaction-Diffusion Models of Crime [PNAS] February 25, 2010 clsadmin From the abstract… “The mechanisms driving the nucleation, spread, and dissipation of crime hotspots are poorly understood. As a consequence, the ability of law enforcement agencies to use mapped crime patterns to design crime prevention strategies is severely hampered. We also lack robust expectations about how different policing interventions should impact crime. Here we present a mathematical framework based on reaction-diffusion partial differential equations for studying the dynamics of crime hotspots. The system of equations is based on empirical evidence for how offenders move and mix with potential victims or targets. Analysis shows that crime hotspots form when the enhanced risk of repeat crimes diffuses locally, but not so far as to bind distant crime together. Crime hotspots may form as either supercritical or subcritical bifurcations, the latter the result of large spikes in crime that override linearly stable, uniform crime distributions. Our mathematical methods show that subcritical crime hotspots may be permanently eradicated with police suppression, whereas supercritical hotspots are displaced following a characteristic spatial pattern. Our results thus provide a mechanistic explanation for recent failures to observe crime displacement in experimental field tests of hotspot policing.” - Fraunhofer HHI’s New 7-Megapixel Immersive Cinema February 23, 2010 clsadmin We just thought this was an interesting peek into the not so distant future …. Enjoy! - What’s Next? Judging Sequences of Binary Events [HT Paul Kedrosky] February 21, 2010 clsadmin From the abstract … “The authors review research on judgments of random and nonrandom sequences involving binary events with a focus on studies documenting gambler’s fallacy and hot hand beliefs. The domains of judgment include random devices, births, lotteries, sports performances, stock prices, and others. After discussing existing theories of sequence judgments, the authors conclude that in many everyday settings people have naive complex models of the mechanisms they believe generate observed events, and they rely on these models for explanations, predictions, and other inferences about event sequences. The authors next introduce an explanation-based, mental models framework for describing people’s beliefs about binary sequences, based on 4 perceived characteristics of the sequence generator: randomness, intentionality, control, and goal complexity. Furthermore, they propose a Markov process framework as a useful theoretical notation for the description of mental models and for the analysis of actual event sequences.”"
