["https://computationallegalstudies.com/2011/12"]
title = "December 2011 – Computational Legal Studies"
full_description = "- Katz & Bommarito – Slides from Introductory Tutorial in Network Analysis and Law @ Jurix 2011 Meeting (University of Vienna – Faculty of Law) December 31, 2011 clsadmin Network Analysis and Law: Introductory Tutorial @ Jurix 2011 Meeting View more presentations from Daniel Katz - Benoît B. Mandelbrot: Fractals in Science, Engineering and Finance (Roughness and Beauty) [via MIT World] December 26, 2011 clsadmin Many of you are aware of my obsession (here) (here) (here) with fractals, power law distributions, etc. and their role in understanding a variety of phenomena. In this spirit, I recently came across this video on MIT World from the late Benoît B. Mandelbrot. It is well worth the watch – enjoy! - NORAD Tracks Santa – 2011- London, United Kingdom [Powered By Google Earth] December 25, 2011 clsadmin - Larry Ribstein R.I.P. December 24, 2011 clsadmin This is a sad day for the American Legal Academy. It has been reported (here) (here) (here) that Larry Ribstein has unexpectedly passed away. While I have only known Larry for about a year, we probably exchanged ~100 emails and provided comments on our respective papers. He had been helping me with my “MIT School of Law” paper as well as some of my other projects. I had recently provided commentary on his Wisconsin Law Review article on the Future of General Counsels. This is a very important paper. Larry was one of the few people who really understood what was happening in our industry. While we did not agree on all subjects (particularly some of his views of corporate law and economic theory) his work on the future of legal education was straight up visionary. Taken together, I believe it will be seen as the template – the sketch of the future of our industry. Larry – I will miss you very much. - 21st Century Law Practice London Summer Program — Michigan State University College of Law & Westminster Law (London Summer 2012) December 23, 2011 clsadmin 21st Century Law Practice London Summer Program — Michigan State University – College of Law & Westminster University View more presentations from Daniel Katz"
