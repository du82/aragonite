["https://computationallegalstudies.com/2009/05"]
title = "May 2009 – Computational Legal Studies"
full_description = "- Visualizing Job Losses from 2007-2009 May 29, 2009 clsadmin For those of you who may have missed it, here is this visualization of geographic density of job losses around the country. As a person living in Michigan, it is fairly sobering. Click above to see the full movie starting in January 2007 and utilizing data through March 2009. - An Exchange in Need of Empirics and an Analytical or Computational Model May 28, 2009 clsadmin On a recent flight, I read Jeffrey Toobin’s New Yorker Article on Chief Justice Roberts entitled “No More Mr. Nice Guy”. The exchange quoted above is drawn from this article. While I believe it is appropriate to engage empirical data where available, the underlying discussion is not one exclusively subjectable to empirical inquiry. Rather, it is, at least in part, a question in need of a formal theoretic model. Justice Roberts and Mr. Katyal are implicitly discussing a “state of the world” not yet realized but which would be realized if the statute were not to exist. What would benefit the discussion is principled manner to adjudicate between these two inferences drawn above. Namely, it would be useful to fully evaluate what behavior would likely follow if the statute were not to exist. There exist a variety of mathematical modeling techniques which could inject some much needed rigor into the above discussion. To my knowledge, such an applied model has yet to be offered. The Supreme Court’s decision in the matter is soon forthcoming. Given the nature of the exchange above, there is reason to believe that if Chief Justice Roberts prevails ….we will get our model as the “state of the world” discussed above will no longer be hypothetical…. - Data.gov is Now Online May 27, 2009 clsadmin Important thing worth noting … data.gov went online during our break …. From the front page “The purpose of Data.gov is to increase public access to high value, machine readable datasets generated by the Executive Branch of the Federal Government. Although the initial launch of Data.gov provides a limited portion of the rich variety of Federal datasets presently available, we invite you to actively participate in shaping the future of Data.gov by suggesting additional datasets and site enhancements to provide seamless access and use of your Federal data. Visit today with us, but come back often. With your help, Data.gov will continue to grow and change in the weeks, months, and years ahead.”"
