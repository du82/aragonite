title = "Justice Souter to Retire….Possible Replacements?…Here is a Mapping of Socially Prominent Jurists in the American Federal Judiciary – Computational Legal Studies"
full_description = "Justice Souter to Retire….Possible Replacements?…Here is a Mapping of Socially Prominent Jurists in the American Federal Judiciary May 1, 2009 clsadminComment on Justice Souter to Retire….Possible Replacements?…Here is a Mapping of Socially Prominent Jurists in the American Federal Judiciary NPR’s Nina Totenberg is reporting that Justice Souter is planning to retire at the end of the current Supreme Court Term. As noted in the NPR report, the short list of replacements may include Elena Kagan, Diane Wood and/or Sonia Sotomayor (who is in the network above near Justice Stevens). If President Obama decides to look beyond this early short list, he might consider one of the socially prominent federal jurist mapped in above visualization. We have a much more detailed prior post on the underlying paper Hustle and Flow: A Social Network Analysis of the American Federal Judiciary located here. To see the full visualization contained within the paper, click on the slide above or click here. TaggedJudicial Decision Makingsupreme courtUncategorizedShare"
