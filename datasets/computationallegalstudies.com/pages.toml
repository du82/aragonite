["https://computationallegalstudies.com/2012/04"]
title = "April 2012 – Computational Legal Studies"
full_description = "- Announcing Law Tech Camp London 2012 – June 29, 2012 – Sponsored By Michigan State University College of Law, University of Westminster and The College of Law April 30, 2012 clsadmin lawTechCampLondon 2012 is a BarCamp-style community UnConference for new media and technology enthusiasts and legal professionals including bloggers, twitters, legal-technology lawyers, social networkers, and anyone curious about new media and the law. Building off the strength of LawTechCamp Toronto – LawTechCamp London will be the first such event held in outside of North America. lawTechCamp is not just for lawyers. If you are interested in the intersection of law and technology, such as legal issues facing startups, access to justice issues, or someone just interested in technology or law, then please join us – and bring a friend or colleague. This event is casual, with active participation between the audience and the workshop presenters and event-attendees. Attendance is free, but registration is required. This event is brought to you by the following organizers: Daniel Martin Katz, Michigan State University College of Law Renee Newman Knake, Michigan State University College of Law Monica Goyal, owner and CEO of MyLegalBriefcase.com Lisa Webley, University of Westminster Law School John Flood, University of Westminster Law School David Allison, The College of Law Jon Harman, The College of Law - How Recruiters Look at Your Resume {via The Ladders} April 26, 2012 clsadmin Small N here (n=30) but it is still worthy of consideration. {HT Flowing Data} - Automatic Prediction Of Small Group Performance In Information Sharing Tasks {from MIT Media Lab} April 22, 2012 clsadmin Abstract: “In this paper, we describe a novel approach, based on Markov jump processes, to model small group conversational dynamics and to predict small group performance. More precisely, we estimate conversational events such as turn taking, backchannels, turn-transitions at the micro-level (1 minute windows) and then we bridge the micro-level behavior and the macro-level performance. We tested our approach with a cooperative task, the Information Sharing task, and we verified the relevance of micro- level interaction dynamics in determining a good group performance (e.g. higher speaking turns rate and more balanced participation among group members).”"
year_published = 2012
