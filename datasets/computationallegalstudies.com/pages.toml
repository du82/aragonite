["https://computationallegalstudies.com/2009/09/15/the-structure-of-the-united-states-code-with-zoomorama"]
title = "The Structure of the United States Code [With Zoomorama] – Computational Legal Studies"
full_description = "The Structure of the United States Code [With Zoomorama] September 15, 2009 clsadmin1 Comment on The Structure of the United States Code [With Zoomorama] Above we offer the same visual of the United States Code (Titles 1-50) which we previously offered here … this time we are using Zoomorama. Zoomorama is an alternative to Seadragon which we believe might perform better on certain machine configurations. Essentially, we do not want people to miss out on the visualization simply because their computer does not feature the necessary software/plugins. While some class of endusers still might not be able to view either version, we hope this alternative version will maximize the chances that it would be visable. So, feel free to scroll over the visual using your mouse. For optimal viewing, however, we believe the full screen visual is the best way to go. Click on the square icon in the upper lright corner to make the visual full size. Click Here for the Zoomorama Instructions! Taggedcomputational social sciencecomputer scienceUncategorizedunited states codevisualizationShare Ken says: September 16, 2009 at 6:56 pm Seadragon.com doesn’t require Silverlight, it has a identical Javascript version that is show when Silverlight isn’t found. That version works without any plug-ins and even on some mobile devices. Seadragon.com automatically detects which is the correct version to show. Additionally, we have a full Javascript API if necessary, so you can customize the experience. (http://www.livelabs.com/seadragon-ajax) I’d love to help you out if you like, just let me know how I can assist. Ken PM for Seadragon Reply"
