title = "October 2010 – Computational Legal Studies"
full_description = "- Exponential Growth Rate of US Stocks since 1871 [ Via Visualizing Economics ] October 29, 2010 clsadmin If you would like to see this chart plotted on a log scale click here. Also, Visualizing Economics has a number of other very interesting projects worth checking out. - Introduction to Computing for Complex Systems — ICPSR 2010 — My Full Course Slides Available Online! October 22, 2010 clsadmin I am going to bump this post to front of the blog one last time as there has been some interest in this material. It has now been several weeks since we completed the full four week class here at the ICPSR Program in Quantitative Methods. In this course, I (together with my colleagues) highlight the methods of complex systems as well as several environments designed to explore the field. These include Netlogo (agent based models and network models), Vensim (system dynamics / ecological modeling) and Pajek (empirical network analysis). In the final week, we cover a variety of advanced topics: (a) Community Detection in Networks (b) Computational Linguistics / Natural Language Processing (c) Diffusion Models and Mathematical Modeling with Data (d) Exponential Random Graph (p*) Models (e) Information Retrieval / Webscraping Although, we do not work with more advanced languages within the course, those who need to conduct complex analysis are directed to alternatives such as R, Python, Java, etc. Anyway, the slides are designed to be fully self-contained and thus allow for individually paced study of the relevant material. If you work through the slides carefully you should be able to learn the software as well as many of the core principles associated with the science of complex systems. The material should be available online indefinitely. If you have questions, feel free to email me. - “Peak Data” or “The Capacity Crunch” [From Science] October 19, 2010 clsadmin From this week’s issue of Science comes Filling the Light Pipe by David J. Richardson. This is an important article highlighting a serious challenge facing the both the scientific and policy community. From the abstract: “It has been a landmark year for the field of optical telecommunications, with the award of the 2009 Nobel Prize to Charles Kao for his insight in the mid-1960s that the future of communications lay in single-mode silica-based optical fibers (1) as well as the 50th anniversary of the first demonstration of the laser—both key technologies responsible for the development of the global-scale communications networks of today (2). Recently, however, a growing realization has emerged within the telecommunications industry that the end of the phenomenal growth in optical fiber communication capacity is within sight. At this year’s Optical Fiber Communication Conference (OFC 2010), several groups reported results within a factor of 2 of the ultimate capacity limits of existing optical fiber technology. Without radical innovation in our physical network infrastructure—that is, improvements in the key physical properties of transmission fibers and the optical amplifiers that we rely on to transmit data over long distances—we face what has been widely referred to as a “capacity crunch” that could severely constrain future Internet growth, as well as having social and political ramifications.” [HT to Paul Kedrosky]"
