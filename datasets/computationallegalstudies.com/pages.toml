["https://computationallegalstudies.com/2009/11"]
title = "November 2009 – Computational Legal Studies"
full_description = "- Bommarito, Katz, Zelner & Fowler – Distance Measures for Dynamic Citation Networks (Version 3.0 w/ Theoretical Model & SCOTUS Citation Network Application) November 30, 2009 clsadmin - Well Formed Eigenfactor.Org–Wonderful Visualization of CrossDisciplinary Fertilization, Information Flow & The Structure of Science [Repost] November 29, 2009 clsadmin Given our interest in both interdisciplinary scholarship and the spread of ideas, we wanted to highlight one of our favorite projects–eigenfactor.org. Here is basic documentation from their website. There are also links to academic papers offering far more detailed documentation for the data and algorithm choice. In particular, read Martin Rosvall and Carl T. Bergstrom, Maps of Random Walks on Complex Networks, Proc. of the Nat. Academy of Sci. 105:1118-1123 (2007). The above visualizations are written in Flare by Moritz Stefaner. Click on the slide above to reach these interactive visualizations. These mapping offer reveal the reach of various publications across disciplines–some are insular and others have incredible reach. The inner rings are journals and the outer rings are the host disciplines. Enjoy! - Visualizing the East Anglia Climate Research Unit Leaked Email Network November 27, 2009 clsadmin As reported in a wide variety of news outlets, last week, a large amount of data was hacked from the Climate Research Unit at the University of East Anglia. This data included both source code for the CRU climate models, as well as emails from the individuals involved with the group. For those interested in background information, you can read the NY Times coverage here and here. Read the Wall Street Journal here. Read the Telegraph here. For those interested in searching the emails, the NY Times directs the end user to http://www.eastangliaemails.com/. Given the data is widely available on the internet, we thought it would be interesting to analyze the network of contacts found within these leaked emails. Similar analysis has been offered for large datasets such as the famous Enron email data set. While there may be some selection issues associated with observing this subset of existing emails, we believe this network still gives us a “proxy” into the structure of communication and power in an important group of researchers (both at the individual and organization level). To build this network, we processed every email in the leaked data. Each email contains a sender and at least one recipient on the To:, Cc:, or Bcc: line. The key assumption is that every email from a sender to a recipient represents a relationship between them. Furthermore, we assume that more emails sent between two people, as a general proposition indicates a stronger relationship between individuals. To visualize the network, we draw a blue circle for every email address in the data set. The size of the blue circle represents how many emails they sent or received in the data set – bigger nodes thus sent or received a disproportionate number of emails. Next, we draw grey lines between these circles to represent that emails were sent between the two contacts. These lines are also sized by the number of emails sent between the two nodes. Typically, we would also provide full labels for nodes in a network. However, we decided to engage in partial “anonymization” for the email addresses of those in the data set. Thus, we have removed all information before the @ sign. For instance, an email such as johndoe@umich.edu is shown as umich.edu in the visual. If you would like to view this network without this partial “anonymization,” it is of course possible to download the data and run the source code provided below. Note: We have updated the image. Specifically, we substituted a grey background for the full black background in an effort to make the visual easier to read/interpret. Click here for a zoomable version of the visual on Microsoft Seadragon. Don’t forget to use SeaDragon’s fullscreen option: Hubs and Authorities: In addition to the visual, we provide hub and authority scores for the nodes in the network. We provide names for these nodes but do not provide their email address. Authority Phil Jones: 1.0 Keith Briffa: 0.86 Tim Osborn: 0.80 Jonathan Overpeck: 0.57 Tom Wigley: 0.54 Gavin Schmidt: 0.54 Raymond Bradley: 0.52 Kevin Trenberth: 0.49 Benjamin Santer: 0.49 Michael Mann: 0.46 Hubs returns nearly identical ranks with slightly perturbed orders with the notable exception that the UK Met Office IPCC Working Group has the highest hub score. Thus, so far as these emails are a reasonable “proxy” for the true structure of this communication network, these are some of the most important individuals in the network. Source Code: Unlike some existing CRU code, the code below is documented, handles errors, and is freely available. parseEmails.py: parses dates and email addresses out of the text plotEmails.py: produces the visual"
