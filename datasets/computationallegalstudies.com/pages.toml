["https://computationallegalstudies.com/2009/04/09/visualizing-contributions-to-the-110th-congress-house-edition-take-2"]
title = "Visualizing Contributions to the 110th Congress—House Edition (Take 2) – Computational Legal Studies"
full_description = "Visualizing Contributions to the 110th Congress—House Edition (Take 2) April 9, 2009 clsadmin6 Comments on Visualizing Contributions to the 110th Congress—House Edition (Take 2) In our previous graph visualizations of contributions to members of the House and Senate, there have been two types of entities: Contributors and Congressmen. This division manifests itself in the dynamics of the graph as well – Contributors give only to Congressmen, and Congressmen receive only from Contributors. A network with this property is bipartite, and there are a number of additional ways to represent the relations contained therein. One such representation is called the single-mode projection. In this simplification, only elements from one of the two sets (e.g., Congressmen or Contributors) are displayed. A relationship exists between two elements in the visual if they share a relationship with at least one member of the other group. For instance, both Bernie Sanders and Sam Brownback received campaign contributions from the the National Association of Realtors. Thus, the Congressmen both have a relationship with the same Contributor, and the simplest single-mode projection would represent this as a shared relationship between the two Congressmen. For more on this projection or other representations, see Wasserman and Faust (1994) or M. E. J. Newman, S. H. Strogatz, and D. J. Watts, Phys. Rev. E 64, 026118 (2001). As the Sanders-Brownback example above demonstrates, however, it is relatively easy to be connected in this representation. Thus, we enforce a threshold on the number of shared contributors for a relationship to exist – representatives must shared at least 10 contributors in order for a relationship to exist between them. It is important to note that different thresholds may produce different graphs. We have chosen this figure as it represents roughly half the number of major contributors to the typical representative. Obviously, alternative specifications are possible. In future posts, we may present different thresholds or normalizations. However, for now, we believe this is a simple but appropriate representation for the underlying data. Given the requirement of sharing at least 10 contributors with another member, the above visualization no longer contains every member of the House of Representatives. To observe the full graph, please see our first post on the contributions to the House. Interpreting this visual is very similar to previous visuals, and in many ways simpler. Other than points (1) and (2) below, again refer to our first post on the contributions to the House. (1) SIZING of the CONNECTIONS — Each Connection (Arc) between an Institution and a Member of the House is sized according to the amount of money flowing through a connection. Darker connections represent larger flows of money while lighter connections represent smaller amounts of money. (2) COLORING of the CONNECTIONS — Each connection representing a shared campaign contributor from between members of Congress is colored according to partisan affiliation. Using popular convention, we color shared relationships between Republican Party members as Red, and blue for shared relationships between Democratic Party members. For relationships that span across the party lines, the color green is used. Tagged110th Congresscampaign contributioncampaign finance networkcongressUncategorizedShare"
year_published = 2009
