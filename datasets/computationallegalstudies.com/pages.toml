["https://computationallegalstudies.com/2009/03"]
title = "March 2009 – Computational Legal Studies"
full_description = "- Co-Sponsorship Networks– Senators of the 108th Congress March 31, 2009 clsadmin In the days and weeks to come we will turn our attenion away from Congress in favor of other institutions and substantive questions. However, given our prior posts focusing upon the structure of the 110th Congress, we thought it proper to highlight some relevant realted scholarship. James Fowler from the UCSD Political Science Department and leader of the Networks in Political Science movement has published several papers exploring the strucutre of legislative co-sponsorship. You can find a link to these papers here. My favorite of these papers is Community Structure in Congressional Cosponsorship Networks published in Physica A by Yan Zhang, A. J. Friend, Amanda L. Traud, Mason A. Porter, James H. Fowler & Peter J. Mucha. The above figure, drawn from the paper, is a dendrogram for the legislative cosponsorship network of the Senate of the 108th Congress. - Senators of the 110th Congress Take 2-Contributions by Industry/Sector March 30, 2009 clsadmin To view the full image, please click here. This represents a deeper cut on campaign contributions to the Senators of 110th Congress. Again, we rely upon data from the Center for Responsive Politics. The CRP aggregates contribution data up to the industry or economic sector. Thus, as before, we adopt their classification scheme and methodology herein. While aggregating to the industry/sector level removes the degree of specificity we offered in our earlier post, it provides a cleaner representation for the graph. For those interested in the other chamber, click here for the House of Representatives. Click on the picture above and it will take you to our flash where you can zoom in and read the labels. As you review the graph, please consider the following: (1) Industries locate in the center of the graph because they provide significant funding to both Democrats and Republicans. (2) Industries which generally only fund one political party are located toward the respective red/blue boundary. For example, it is hardly surprising to observe the location of “Oil and Gas” relative to “Environmental” groups. (3) It is important to note that we do not impose the partisan separation or the placement of party outliers apparent in the image. Rather, the algorithm places Red Senators in Blue Territory and Blue Senators in Red Territory because they receive significant sums from industries who typically fund the opposing party. For example, consider Senator Olympia J Snowe (R-ME) who is typically characterized as a moderate Republican. Since she receives money from more industries that typically fund Democrats than Republicans, she is placed in Blue Territory by the algorithm. (4) It is important not to over read the position of Senator Herb Kohl (D-WI). Over the relevant time window, Senator Kohl received 94% of his resources through self-financing."
