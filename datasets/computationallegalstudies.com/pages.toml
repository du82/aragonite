["https://computationallegalstudies.com/2010/09"]
title = "September 2010 – Computational Legal Studies"
full_description = "- Public Resource.org / Law.gov Win 10^100 Google Project Funding September 24, 2010 clsadmin Congratulations to Carl Malamud and publicresource.org for being selected as a Google 10^100 project winner! Among other things, the $2 million grant “will support the Law.Gov initiative, which aims to make all primary legal materials in the United States available to all.” I had the pleasure of presenting at the UC-Boulder Law.gov meeting and Texas Law.gov meeting earlier this year. Thus, I am very excited about Google’s decision to fund this very worthy project. For those who are interested in reading more, O’Reilly Radar has additional information on the law.gov / google 10^100 announcement here. - Mapping the 2010 Midterm Election [From Google] September 22, 2010 clsadmin This is a straightforward tool that can be customized using Fusion Tables. Read more about this tool from the Google Public Policy Blog announcement. - High Throughput Humanities – ECCS Satellite Conference (Lisboa 2010) September 14, 2010 clsadmin As we speak, I am currently in route to Portugal for the very exciting High Throughput Humanities meeting on Wednesday. As we believe it fits well within the goals of the meeting, I will briefly present our work on the United States Code (including a brief preview of our still unreleased new paper). Anyway, for those not familiar with the meeting, if you click on the image above you will be taken to the main page. Also, here is the announcement for the meeting: “The High Throughput Humanities satellite event at ECCS’10 establishes a forum for high throughput approaches in the humanities and social sciences, within the framework of complex systems science. The symposium aims to go beyond massive data aquisition and to present results beyond what can be manually achieved by a single person or a small group. Bringing together scientists, researchers, and practitioners from relevant fields, the event will stimulate and facilitate discussion, spark collaboration, as well as connect approaches, methods, and ideas. The main goal of the event is to present novel results based on analyses of Big Data (see NATURE special issue 2009), focusing on emergent complex properties and dynamics, which allow for new insights, applications, and services. With the advent of the 21st century, increasing amounts of data from the domain of qualitative humanities and social science research have become available for quantitative analysis. Private enterprises (Google Books and Earth, Youtube, Flickr, Twitter, Freebase, IMDb, among others) as well as public and non-profit institutions (Europeana, Wikipedia, DBPedia, Project Gutenberg, WordNet, Perseus, etc) are in the process of collecting, digitizing, and structuring vast amounts of information, and creating technologies, applications, and services (Linked Open Data, Open Calais, Amazon’s Mechanical Turk, ReCaptcha, ManyEyes, etc), which are transforming the way we do research. Utilizing a complex systems approach to harness these data, the contributors of this event aim to make headway into the territory of traditional humanities and social sciences, understanding history, arts, literature, and society on a global-, meso- and granular level, using computational methods to go beyond the limitations of the traditional researcher.”"
