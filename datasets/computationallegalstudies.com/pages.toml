["http://computationallegalstudies.com/tag/law-clerks"]
title = "Law Clerks – Computational Legal Studies"
full_description = "- The Clerkship Tournament: Supreme Court Edition [Repost from 6/3] October 15, 2009 clsadmin As part our multipart series on the clerkship tournament, here is a simple bar graph for the top placing law schools in the Supreme Court Clerkship Tourney. It is important to note that we do not threshold for the number of graduates per school. Specifically, we do not just divide by the number graduates per school because we have little theoretic reason to believe that placements linearly scale to differences in size of graduating classes. In other words, given we do not know the proper functional form — we just offer the raw data. For those interested in other posts, please click here for the law clerks tag. - The Law Clerkship Tournament : The Expanded Edition August 3, 2009 clsadmin Our multipart series on the clerkship tournament continues above with an expanded edition of our underlying dataset. It is important to note that we do not threshold for the number of graduates per school. Specifically, we do not just divide by the number graduates per school because we do not have any particular theoretic reason to believe that placements linearly scale to differences in size of graduating classes. In other words, given we do not know the proper functional form — we just offer the raw data for your consideration. For those interested in other posts, please click here for the law clerks tag. In the previous circuit/district post, we focused upon the “top” 15 schools as ranked by an older version of US News. When we expand the analysis to consider a wider slice of institutions, two schools standout — Texas and Notre Dame. Basically, the arbitrariness of the prior cut off we imposed did not really do justice to these institutions … this wider view provides a deeper indication of their standing relative to other institutions. - Data on the Law Clerkship Tournament: Take 2 May 14, 2009 clsadmin Highlighting underlying data Derek Stafford and I collected for our article Hustle and Flow: A Social Network Analysis of the American Federal Judiciary — here is some additional information on the law clerk tournament. In the original post, we highlighted both Circuit and District Court Clerkship Placements for the 1995-2005 period. Using only the Circuit Court data, we thought it might be interesting to consider how those placements are distributed across the various circuits. At first glance, observe the regional or home turf bias contained in the placements (Penn 3rd Circuit ; Vanderbilt 6th Circuit). Furthermore, consider institutions whose placements are highly concentrated (Berkeley 9th Circuit) versus institutions with more diffuse placements (Michigan, Chicago)."
