["http://computationallegalstudies.com/2009/04/22/the-revolution-will-not-be-televised-but-will-it-come-from-harvard-or-yale-a-network-analysis-of-the-american-law-professoriate-part-iii"]
title = "Model of Intellectual Diffusion Upon the American Legal Academy – Computational Legal Studies"
full_description = "Model of Intellectual Diffusion Upon the American Legal Academy April 22, 2009 clsadmin1 Comment on Model of Intellectual Diffusion Upon the American Legal Academy For the third installment of posts related to Reproduction of Hierarchy? A Social Network Analysis of the American Law Professoriate, we offer a Netlogo simulation of intellectual diffusion on the network we previously visualized. As noted in prior posts, we are interested legal socialization and its role in considering the spread of particular intellectual or doctrinal paradigms. This model captures a discrete run of the social epidemiological model we offer in the paper. As we noted within the paper, this represents a first cut on the question—where we favor parsimony over complexity. In the paper and in the model documentation, we offer some possible model extensions which could be considered in future scholarship. Once you click through to the model, here is how it works: (1) Click the Setup Button in the Upper Left Corner. This will Display the Network in the Circular Layout. (2) Click the Layout Button. Depending upon the speed of your machine this may take up to 30 seconds. Stop the Layout Button by Re-Clicking the Button. (3) Click the Size Nodes by Degree Button. You Will Notice the Fairly Central Node Colored in Red. This is School #12 Northwestern University Law School. Observe how we have set the default infected school as #12 Northwestern (Hat Tip to Uri Wilensky). A Full List of School Number is available at the bottom of the page when you click through. (4) Now, we are ready to begin. Click the Spread Once Button. The idea then reaches its neighbors with probability p (set as a default at .05). You can click the Toggle Infection Tree button (at any point) to observe the discrete paths traversed by the idea. (5) Click the Spread Once Button, again and again. Notice the plot tracking the time on the x axis and the number of institution infected on the y axis. This is an estimate of the diffusion curve for the institution. (6) To restart the simulation, click the Reinfect One button. Prior to hitting this button, slide the Infected Slider to any Law School you would like to observe. Also, feel free to adjust the p slider to increase or decrease the infectiousness of the idea. Please comment if you have any difficulty or questions. Note you must have Java 1.4.1 + installed on your computer. The Information Technology professionals at many institutions will have already installed this on your machine but if not you will need to download it. We hope you enjoy! Taggedevolution of lawLaw as a Complex Systemlaw schoolssocial epidemiologySociology of LawUncategorizedShare"
year_published = 2009
clearnet = "http://computationallegalstudies.com/2009/04/22/the-revolution-will-not-be-televised-but-will-it-come-from-harvard-or-yale-a-network-analysis-of-the-american-law-professoriate-part-iii"
