["https://computationallegalstudies.com/2011/08"]
title = "August 2011 – Computational Legal Studies"
full_description = "- Physicist Cuts Plane Boarding Time in Half [via CNet & Hacker News] August 31, 2011 clsadmin “… Steffen considered various methods, such as boarding people in blocks, at random, and in window seats first. He set up a model using an algorithm based on the Monte Carlo optimization method used in statistics and mathematics. He found that the most efficient boarding method is to board alternate rows at a time, beginning with the window seats on one side, then the other, minimizing aisle interference. The window seats are followed by alternate rows of middle seats, then aisle seats. He also found that boarding at random is faster that boarding by blocks.” Coverage over at C-Net - Information Efficiency and Financial Stability August 29, 2011 clsadmin From the abstract: “The authors study a simple model of an asset market with informed and non-informed agents. In the absence of non-informed agents, the market becomes information efficient when the number of traders with different private information is large enough. Upon introducing non-informed agents, the authors find that the latter contribute significantly to the trading activity if and only if the market is (nearly) information efficient. This suggests that information efficiency might be a necessary condition for bubble phenomena—induced by the behavior of non-informed traders—or conversely that throwing some sands in the gears of financial markets may curb the occurrence of bubbles.” [ HT: Paul Kedrosky ] - Introduction to Artificial Intelligence [ CS 221 – Free Online Course from Stanford University ] August 23, 2011 clsadmin “A bold experiment in distributed education, “Introduction to Artificial Intelligence” will be offered free and online to students worldwide during the fall of 2011. The course will include feedback on progress and a statement of accomplishment. Taught by Sebastian Thrun and Peter Norvig, the curriculum draws from that used in Stanford’s introductory Artificial Intelligence course. The instructors will offer similar materials, assignments, and exams. Artificial Intelligence is the science of making computer software that reasons about the world around it. Humanoid robots, Google Goggles, self-driving cars, even software that suggests music you might like to hear are all examples of AI. In this class, you will learn how to create this software from two of the leaders in the field. Class begins October 10.” Check out the syllabus here. Although I have previously highlighted Academic Earth – I am a little late on this New York Times coverage available here. See also Andrew Ng’s class on Machine Learning (which is also available right now on Academic Earth)."
