full_description = "- Data Without Borders – Jake Porway & Drew Conway September 30, 2011 clsadmin Friend of the CLS Blog Drew Conway has started a fantastic organization called Data Without Borders. DWB seeks to match non-profits in need of data analysis with freelance and pro bono data scientists who can work to help them with data collection, analysis, visualization, or decision support. Check out the video to learn more! - Will Robots Steal Your Job? Legal Automation and Added Disruption in the Law Job Market [via Slate] September 29, 2011 clsadmin - The UC Hastings “Strategic Plan” — Come On Folks This Is NOT EVEN Remotely Up to Par [ HT TOTM ] September 27, 2011 clsadmin As I commented over at TOTM, “UC-Hastings — come on folks — this is NOT EVEN remotely serious.” Legal education is at a serious crossroads (here)(here)(here)(here)(here)(here)(here)(many others). In light of the current state of affairs, if you are at UC-Hastings in any capacity — I hope you are asking yourself — is this really the best we can do? Lets just check the scoreboard for a moment: UC Hastings is an institution that is just a few miles from the technology center of the entire world (click for the fun map) (what an unbelievable factor endowment!). So, in light of this fact, the UC-Hastings “strategic plan” basically makes no mention of the new legal information industry and how the institution might “strategically position” its students for technology infused Lawyering of the 21st Century. Lets hope they did not pay a mgmt consulting firm to do what this website would do for free (see this site “Management Buzz Word Generator.”) - Google NGrams: What We Learned From 5 Million Books (and 500 Billion Words) [ TEDxBoston 2011] September 25, 2011 clsadmin - Unlocking the Law: Deregulating the Legal Profession — Truth on the Market Symposium September 20, 2011 clsadmin - Quantitative Legal Prediction – Updated Slides – 2011 Midwest Law & Economics Association September 18, 2011 clsadmin Qu