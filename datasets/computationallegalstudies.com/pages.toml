["https://computationallegalstudies.com/2011/03"]
title = "March 2011 – Computational Legal Studies"
full_description = "- Oyez @ Chicago Kent Releases Free OyezToday App for IPhone March 31, 2011 clsadmin Kudos to Jerry Goldman, the other folks at the Oyez Project as well as the Chicago-Kent College of Law for making this free resource available to the public! From the description: “OYEZTODAY at IIT Chicago-Kent College of Law offers you the latest information and media on the current business of the Supreme Court of the United States. OYEZTODAY provides: easy-to-grasp abstracts for every case granted review, timely and searchable audio of oral arguments + transcripts, and up-to-date summaries of the Court’s most recent decisions including the Court’s full opinions. You will have access to all this information on your iPhone with the ability to share reactions on Facebook, Twitter, or by email. (Recordings of opinion announcements from the bench will follow when the Court releases these files to the National Archives at the start of the Court’s next Term). Chicago-Kent is proud to provide this free service to enhance the public’s understanding of the Supreme Court and current legal controversies.” - Network Structure of Production [From PNAS] March 30, 2011 clsadmin From the abstract: “Complex social networks have received increasing attention from researchers. Recent work has focused on mechanisms that produce scale-free networks. We theoretically and empirically characterize the buyer–supplier network of the US economy and find that purely scale-free models have trouble matching key attributes of the network. We construct an alternative model that incorporates realistic features of firms’ buyer–supplier relationships and estimate the model’s parameters using microdata on firms’ self-reported customers. This alternative framework is better able to match the attributes of the actual economic network and aids in further understanding several important economic phenomena.” - Complex Systems: A Survey March 28, 2011 clsadmin From the abstract: “A complex system is a system composed of many interacting parts, often called agents, which displays collective behavior that does not follow trivially from the behaviors of the individual parts. Examples include condensed matter systems, ecosystems, stock markets and economies, biological evolution, and indeed the whole of human society. Substantial progress has been made in the quantitative understanding of complex systems, particularly since the 1980s, using a combination of basic theory, much of it derived from physics, and computer simulation. The subject is a broad one, drawing on techniques and ideas from a wide range of areas. Here I give a short survey and an annotated bibliography of resources for those interested in learning about complex systems.” [By Mark E.J. Newman – Submitted to Amer. J. Physics] Complex systems is a relatively young subject area and one that is evolving rapidly, but there are nonetheless a number of general references, including books and reviews, that bring together relevant topics in a useful way. ” The paper then has recommended materials on major topics relevant to the study of complex systems including: Lattices and Networks Dynamical Systems (including Chaos & Fractals) Discrete Dynamics and Cellular Automata Scaling and Criticality Adaptation and Game Theory Information Theory Computational Complexity Agent-Based Modeling “Classic examples of complex systems include condensed matter systems, ecosystems, the economy and financial markets, the brain, the immune system, granular materials, road traffic, insect colonies, flocking or schooling behavior in birds or fish, the Internet, and even entire human societies.”"
