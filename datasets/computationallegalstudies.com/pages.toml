title = "July 2009 – Computational Legal Studies"
full_description = "- Law in Structure of Academic Disciplines [Repost] July 30, 2009 clsadmin This article offers a very interesting insight into the structure of academic disciplines. Using a variety of sources, the authors collected nearly 1 billion interactions from scholarly web portals including Thomson Scientific, Elsevier, JSTOR, etc. Residing between Economics, Sociology and International Studies, notice the location for legal studies in the upper center portion of this screen print. The Full Size visualization as well as relevant analytics are available within the paper. Among other things, the approach undertaken by Johan Bollen, Herbert Van de Sompel, Aric Hagberg, Luis Bettencourt, Ryan Chute, Marko A. Rodriguez & Lyudmila Balakireva provides an alternative view of the current structure of the academic disciplines from that offered in existing bibliometric studies. - In the Meantime … Movie of Flight Patterns July 24, 2009 clsadmin So it has and will be light blogging while we finish a number of projects here in Ann Arbor. There are a number interesting papers in the queue including The Development of Community Structure in the Supreme Court’s Network of Citations (with James Fowler, James Spriggs and Jon Zelner) and A Tale of Two Codes: An Empirical Analysis of The Jurisprudence of the United States Tax Court (1990-2008) (with Lilian V. Faulhaber). Both are forthcoming to the SSRN and the CLS BLOG in the coming days. So in the mean time please enjoy the above movie …. and we will do our best to provide content during this busy period…. - HarambeeNet @ Duke Computer Science July 20, 2009 clsadmin We enjoyed today’s discussion at the Harambeenet Conference here in the Duke Computer Science Department. The conference is centered upon network science and computer science education. It features lots of interdisciplinary scholarship and applications of computer science techniques in novel domains. We are looking forward to an interesting final day of discussion and hope to participate in allied future conferences."
year_published = 2009
