title = "Data on the Law Clerkship Tournament: Take 2 – Computational Legal Studies"
full_description = "Data on the Law Clerkship Tournament: Take 2 May 14, 2009 clsadminComment on Data on the Law Clerkship Tournament: Take 2 Highlighting underlying data Derek Stafford and I collected for our article Hustle and Flow: A Social Network Analysis of the American Federal Judiciary — here is some additional information on the law clerk tournament. In the original post, we highlighted both Circuit and District Court Clerkship Placements for the 1995-2005 period. Using only the Circuit Court data, we thought it might be interesting to consider how those placements are distributed across the various circuits. At first glance, observe the regional or home turf bias contained in the placements (Penn 3rd Circuit ; Vanderbilt 6th Circuit). Furthermore, consider institutions whose placements are highly concentrated (Berkeley 9th Circuit) versus institutions with more diffuse placements (Michigan, Chicago). Taggedclerk tournamentLaw Clerkslaw schoolsUncategorizedShare"
