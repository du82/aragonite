["https://computationallegalstudies.com/2012/03"]
title = "March 2012 – Computational Legal Studies"
full_description = "- Tracking Techies: Finding the Footprints of America’s Switched-on Lawyers [via ABA Journal] March 27, 2012 clsadmin - Virginia Decoded – The Code of Virginia for Humans {49 States to Go} March 17, 2012 clsadmin “Virginia Decoded is a private, non-governmental, non-partisan implemenation of The State Decoded, an open source project that provides a platform to display state-level legal information in a friendly, accessible, modern fashion. Virginia is the first state to deploy the software. Virginia Decoded is currently in beta, which is to say that the site is under active development, with known shortcomings, but it has reached a point where it would benefit from being used by the general public (who one hopes will likewise benefit from it.) While every effort is made to ensure that the data provided on Virginia Decoded is accurate and up-to-date, it would be gravely unwise to rely on it for any matter of importance while it is in this beta testing phase. Many more features are under development, including improvements to search, calculations of the importance of given sections of the code, inclusion of attorney generals’ opinions, Supreme Court of Virginia rulings, extensive explanatory text, social media integration, significant navigation enhancements, a vastly expanded built-in glossary of legal terms, Code download options, scholarly article citations, and much more.” {HT: Legal Informatics Blog} - Machine Learning for Hackers – Published By O’Reilly Media [Drew Conway & John Miles White] March 14, 2012 clsadmin Below is the Table of Contents for the new book “Machine Learning for Hackers” by Drew Conway & John Miles White. Drew is a long time friend of this blog and we are very excited about his new book. My copy just arrived and I will be working through the book this summer (for potential inclusion in the 2013 edition of my Quantitative Methods for Lawyers Course and/or E-Discovery Course). Here is the description: “Each chapter focuses on a specific problem in machine learning, such as classification, prediction, optimization, and recommendation. Using the R programming language, you’ll learn how to analyze sample datasets and write simple machine learning algorithms. Machine Learning for Hackers is ideal for programmers from any background, including business, government, and academic research.” Check it out! TOC ML4Hackers"
