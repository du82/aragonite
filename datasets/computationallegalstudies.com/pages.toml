full_description = "In the Meantime … Movie of Flight Patterns July 24, 2009 clsadminComment on In the Meantime … Movie of Flight Patterns So it has and will be light blogging while we finish a number of projects here in Ann Arbor. There are a number interesting papers in the queue including The Development of Community Structure in the Supreme Court’s Network of Citations (with James Fowler, James Spriggs and Jon Zelner) and A Tale of Two Codes: An Empirical Analysis of The Jurisprudence of the United States Tax Court (1990-2008) (with Lilian V. Faulhaber). Both are forthcoming to the SSRN and the CLS BLOG in the coming days. So in the mean time please enjoy the above movie …. and we will do our best to provide content during this busy period…. TaggedUncategorizedvisualizationShare"
