full_description = "Data.gov is Now Online May 27, 2009 clsadmin2 Comments on Data.gov is Now Online Important thing worth noting … data.gov went online during our break …. From the front page “The purpose of Data.gov is to increase public access to high value, machine readable datasets generated by the Executive Branch of the Federal Government. Although the initial launch of Data.gov provides a limited portion of the rich variety of Federal datasets presently available, we invite you to actively participate in shaping the future of Data.gov by suggesting additional datasets and site enhancements to provide seamless access and use of your Federal data. Visit today with us, but come back often. With your help, Data.gov will continue to grow and change in the weeks, months, and years ahead.” Taggedcomputational social sciencedata miningUncategorizedShare SDC says: May 27, 2009 at 10:32 pm The data currently available is somewhat underwhelming (soil quality?), but supposedly 20,000 new data sets are coming out next month. Reply"
