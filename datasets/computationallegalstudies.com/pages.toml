["https://computationallegalstudies.com/2011/11"]
title = "November 2011 – Computational Legal Studies"
full_description = "- Announcing the 21st Century Law Practice London Summer Program – MSU College of Law – (In Partnership with University of Westminster) November 29, 2011 clsadmin Program Description: “The MSU / Westminster 21st Century Law Practice London Summer Program is a first of its kind, intensive study of technology, innovation, regulation, entrepreneurship and the international legal marketplace. With the deregulation of lawyers in the United Kingdom and the outgrowth of alternative legal services delivery models, London is poised to become the global leader in the legal services market. Our program will educate students about these new delivery models and help prepare students for the technology infused law jobs of the 21st Century.” Educational Objectives: (1) Provide students a comprehensive understanding of the market for legal services as it transitions to a global legal supply chain in the wake of deregulation, economic pressures, and technological innovation. (2) Prepare students to become practice-ready entrepreneurial lawyers who can leverage information technology in order to operate more efficiently and thereby attract (and retain) clients. (3) Inspire students to think broadly about future delivery of legal representation and access to justice by exposing them to the innovative legal service delivery models and platforms of the present (and not-too-distant future). Courses for the 2012 Program: Legal Information Engineering & Technology – The increasing role of legal information technology in the law practice of today (and the not too distant future) will be highlighted in this course. Students will be exposed to a number of emerging approaches in legal automation, process engineering, informatics / ‘soft’ artificial intelligence (e-discovery, automated document generation), supply chain management, and quantitative legal prediction. 21st Century Law Practice – This course will provide students with an overview of the practice challenges facing lawyers in the 21st century, including economic pressures, technological advancements, increased globalization, international deregulation, and access to justice concerns (for example, reading the work of Richard Susskind, Thomas Morgan, and others). Building upon this background, the course will then explore a set of case studies to examine a variety of innovative new legal services delivery mechanisms and businesses in the US and the UK, such as Axiom, LawVest, Lawyers2You, LegalZoom, QualitySolicitors, Rocket Lawyer and others that have been created in anticipation of (or in some cases in response to) these practice challenges. Students will critically assess these legal service providers, and will reflect upon how lawyers and regulators should respond. The Legal Services Act and UK Deregulation – Students will study the history and impact of the Legal Services Act and deregulation of the profession in the UK with a focus on how the resulting innovations (both regulatory changes and new legal services delivery mechanisms that follow) might be exported to the United States. Also encompassed in this course will be a comparative overview of American and British law governing lawyers and law practice, along with emphasis on globalization pressures faced by the legal profession. APPLICATION GOES LIVE IN LATE DECEMBER – SPACE WILL BE LIMITED 🙂"
