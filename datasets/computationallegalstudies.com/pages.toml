["http://computationallegalstudies.com/2009/04/06/the-law-clerkship-tournament"]
title = "April as the Cruellest Month? Data on the Law Clerkship Tournament – Computational Legal Studies"
full_description = "April as the Cruellest Month? Data on the Law Clerkship Tournament April 6, 2009 clsadmin3 Comments on April as the Cruellest Month? Data on the Law Clerkship Tournament Judge Wald’s classic article describing the market for judicial clerks reminds us how April was once the cruellest month. Given the Federal Law Clerk Hiring plan has shifted the relevant window of discomfort, we thought it reasonable to ring in the spring season with some of our data on the law clerk tournament. Using underlying information Derek Stafford and I collected for our article Hustle and Flow: A Social Network Analysis of the American Federal Judiciary, here is Federal Court Clerkship data for the period of the “Natural” Rehnquist Court. The current offering is aimed at the US News Top 15 Law Schools. Although this data terminates in the 2004- 2005 clerkship year, we still believe it offers useful empirical insight into the status of the law clerk tournament. Taggedclerk tournamentLaw Clerkslaw schoolsUncategorizedShare EP says: April 6, 2009 at 5:24 pm It would be good to also present these numbers as a percentage of total graduates from each school during the period in question. Reply BWM says: April 6, 2009 at 9:13 pm @EP — Agreed, for purposes of assessing law schools’ performance in “the tournament.” However, at least in “Hustle and Flow,” Katz & Stafford are, I believe, more interested in the propagation of legal ideas and, further, on influence. Absolute numbers are the more relevant measure for that question. Reply"
