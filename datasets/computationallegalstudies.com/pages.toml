title = "March 2013 – Computational Legal Studies"
full_description = "- Quantitative Legal Prediction – Updated Presentation Slides from Talk at Santa Clara Law School – March 2013 (By Daniel Martin Katz) March 31, 2013 clsadmin Quantitative Legal Prediction – Presentation @ Santa Clara Law – March 2013 – By Daniel Martin Katz from Daniel Martin Katz - Workshop “Network Analysis in Law” @ International Conference on Artificial Intelligence and Law – Rome 2013 March 24, 2013 clsadmin This Workshop builds upon the “Network Analysis and the Law” Tutorial that Mike Bommarito and I ran at Jurix 2011 in Vienna. It was a great honor to be an organizer for both the overall Artificial Intelligence and Law 2013 Conference as well as the Network Analysis and Law workshop. Looking forward to great week of rigorous technical papers at Artificial Intelligence and Law 2013 in Rome in early June! - ReInvent Law London 2013 – A Free, Open & Crowd Sourced Conference – June 14, 2013 in Central London March 23, 2013 clsadmin #ReInvent Law London 2013 will be an open, crowd-sourced conference! Talks will be submitted by the public and then those proposals will be voted upon by the public. Anyone can pitch a topic, and everyone can vote. Here are the rules: 1. Submit your 300-word or 30-second-YouTube-video pitch at www.ReInventLawLondon.com between now and midnight on April 5, 2013. 2. Vote for your favorite pitch when the voting window opens in early April. One person, one vote—but feel free to use Twitter, Facebook and LinkedIn to encourage colleagues, friends, family and more to vote for your pitch. 3. Talks must relate to some aspect of law + technology + innovation + entrepreneurship. This is about big ideas—no sales pitches or product pushing. 4. Winners will have up to 10 minutes to speak, and will then respond to dynamic, real-time, audience-driven Q&A. 5. You can also sign up here for a FREE ticket to witness ReInvent Law London, June 14, 2013. Each of our previous events have sold out – so sign up today! #ReInventLaw London 2013 is part of Michigan State University College of Law’s 21st Century Law Practice Summer Program. Learn more about our laboratory and its 4 pillars — { Law + Tech + Design + Delivery } @ www.ReInventLaw.com"
