["https://computationallegalstudies.com/2013/02"]
title = "February 2013 – Computational Legal Studies"
full_description = "- #ReInvent Law Silicon Valley 2013 — 40+ Speakers, 1 Stage – Detailed Schedule for March 8, 2013 February 28, 2013 clsadmin ReInventLaw Silicon Valley 2013 – Schedule of Presentations from Daniel Martin Katz - Every Student in Every School Should Have the Opportunity to Learn to Code {via code.org} February 27, 2013 clsadmin - ReInvent Law – Legal Services Start Up Competition – 15 Student Teams Pitching Their Entrepreneurial Idea to ReInvent the Legal Services Industry! February 23, 2013 clsadmin Monday, Feb. 25 from 4:00 – 6:00PM – is our inaugural ReInvent Law Start Up Competition. This event is generously supported by resources from MSU Credit Union, the Ewing M. Kauffman Foundation and the MSU College of Law. 15 MSU Law Student Teams – most of whom have been perfecting their idea under the direction of the ReInvent Law Laboratory and our Entrepreneurial Lawyering Course – will pitch their business idea and business plan in the Castle Board Room @ Michigan State University College of Law. Your Hosts: Professor Daniel Martin Katz & Professor Renee Newman Knake Your Judges: Joan Howarth, Joshua Kubicki, Shelley Davis Mielock, Michael J. Bommarito II, Jeremy Mulder & Mike Morin This is one of the first events of its kind hosted by a law school. An entrepreneurial culture is what we are building here at ReInvent Law Laboratory under our four pillars of legal innovation –> {Law+Tech+Design+Delivery} ! - Legal Process Outsourcing Firms Stealing Deal Work from Law Firms (via Bloomberg Law) February 22, 2013 clsadmin - The Inside Story of Aaron Swartz’s Campaign to Liberate PACER Court Filings (via Ars Technica) February 12, 2013 clsadmin - LegalForce Bookflip – A New Way to Access Law February 10, 2013 clsadmin As a matter of full disclosure, I am a strategic advisor to the company. - How To Run A Law Firm Like A Startup (via Business Insider) February 6, 2013 clsadmin Here is a brand new article on Kyle Westaway who spoke this past Saturday at the Entrepreneurial Lawyering Workshop here in East Lansing. This workshop is an intensive day of pitches and feedback (ala Startup Weekend) and is an important part of the Entrepreneurial Lawyering course that I co-teach with my colleague Renee Knake. Whether it is the “Start Up of You” or some sort of legal process / legal tech idea … this course is about the business of law and how to succeed in this very tough market for legal services …"
