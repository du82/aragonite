full_description = "The Clerkship Tournament: Supreme Court Edition [Repost from 6/3] October 15, 2009 clsadminComment on The Clerkship Tournament: Supreme Court Edition [Repost from 6/3] As part our multipart series on the clerkship tournament, here is a simple bar graph for the top placing law schools in the Supreme Court Clerkship Tourney. It is important to note that we do not threshold for the number of graduates per school. Specifically, we do not just divide by the number graduates per school because we have little theoretic reason to believe that placements linearly scale to differences in size of graduating classes. In other words, given we do not know the proper functional form — we just offer the raw data. For those interested in other posts, please click here for the law clerks tag. Taggedclerk tournamentLaw Clerkslaw schoolssupreme courtUncategorizedShare"
