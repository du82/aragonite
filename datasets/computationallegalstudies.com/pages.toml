["https://computationallegalstudies.com/2010/03"]
title = "March 2010 – Computational Legal Studies"
full_description = "- United States Supreme Court’s New Website — Still Far Below the Mark March 26, 2010 clsadmin The United States Supreme Court has recently launched its newly redesigned website. Given the significant limitations associated with the prior website, this launch had been highly anticipated. Indeed, many had hoped for a website that would reflect well upon the Court. While we applaud the decision to move away from the prior design, a review of the Court’s new website reveals a product which still falls far below the mark. One of the very disappointing aspects of the new interface is that it appears to have been created with little regard for the overtures offered by folks such as the Sunlight Foundation. Specifically, in an effort to improve the experience of end users, the Sunlight Foundation offered a very constructive mockup redesign for the website. Unfortunately, the current redesign does not reflect most of their ideas. For those interested in additional thoughts on this matter, the good folks over at Law Librarian Blog offer a number of constructive suggestions for improvements. These include unlocking PDF documents by simultaneously making their content available in friendly formats such as XML / HTML. Anyway, we hope that this is merely one step in the direction of genuine improvement …. but given the current state of affairs … the path to a 21st century website for the United States Supreme Court looks to be quite long. - Visualizing a Subset of the Tax Code – Capital Gains & Losses at Full Depth [Repost] March 25, 2010 clsadmin In our original post on Title 26, we displayed every subtitle of Title 26, A through K, down to the section level. We did not, however, display the elements of the code below the section level. For example, our prior visualization stops at §501 and does not distinguish between §501(c)(3) and §501(c)(2). This is a function of the size of Title 26, as the full labeled image is too large to render and distribute over the Internet. However, working with only a subset of Title 26 of the United States Code, we can provide a full depth zoomable visualization. We’ve chosen to highlight – Subtitle A, Chapter 1, Subchapter P: Capital Gains and Losses as this section well represents the structural complexity of the code. Despite only displaying a single subchapter without any Treasury Regs or SEC guidance, there are over 1,711 citable elements in this visual. If you look closely you can see the labels for each and every piece of this subchapter, including §1221(b)(2)(A)(ii), which defines “hedging transactions” (e.g., swaps) for the purpose of the tax code: “to manage risk of interest rate or price changes or currency fluctuations with respect to borrowings made or to be made, or ordinary obligations incurred or to be incurred, by the taxpayer.” For details on the coloring of this visual, see our previous post visualizing the Bankruptcy Code 11 U.S.C located here."
