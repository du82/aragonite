full_description = "SEAL 2009 @ Vanderbilt Law School April 17, 2009 clsadminComment on SEAL 2009 @ Vanderbilt Law School I am currently at Vanderbilt Law School for the 2009 Society for Evolutionary Analysis in Law (SEAL) Conference. For those of you not familiar with the organization … “SEAL is a scholarly association dedicated to fostering interdisciplinary exploration of issues at the intersection of law, biology, and evolutionary theory, improving the models of human behavior relevant to law, and promoting the integration of life science and social science perspectives on law-relevant topics through scholarship, teaching, and empirical research.” The organization embraces a wide range of scholarship including those with interests in evolutionary and behavioral biology, complex adaptive systems, economics, psychology, primatology and anthropology. In the coming days, we will be highlighting our work on The American Legal Academy and previewing extensions of the paper Reproduction of Hierarchy? A Social Network Analysis of the American Law Professoriate. So stay tuned for this and more… please add us to your blogrolls and tell your colleagues about the CLS Blog. Taggedbiology and lawcomputational legal studiesLaw as a Complex SystemprimatologyUncategorizedShare"
