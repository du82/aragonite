full_description = "Computerworld, which has covered enterprise technology since 1967, is the go-to online publication for IT decision-makers and IT professionals looking to understand and implement technology in the workplace. We provide authoritative analysis of IT trends, offer insights into how technology is used in the enterprise, and explain how IT is evolving. Computerworld focuses on critically important areas for business, including generative AI, Windows, office suites, Apple in the enterprise, mobile issues, collaboration software, and productivity tools. We offer deeply researched features, timely news analyses, lively and informative blogs, sharp opinion pieces, and a variety of videos and podcasts — all aimed at solving tech problems for IT users. Computerworld Executive Editorial Executive Editor: Ken Mingis Managing Editor, Features: Valerie Potter News Editors Executive Editor: Peter SayerNews Editor, APAC: Varun Aggarwal Please note that Computerworld does not publish contributed articles. Interested in reaching our audience with sponsor content? Contact Sales. Foundry Editorial Management Amy BennettEditor in Chief, Foundry EnterpriseMatt EganGlobal Editorial Director, Foundry Privacy Policy Computerworld values the privacy of its readers. See our privacy policy for complete details. Foundry (formerly IDG Communications) Foundry US and Foundry Global (formerly IDG Communications Inc.) Foundry UK (formerly IDG Communications Ltd.)Foundry UK terms and conditions Foundry Germany Foundry Western Europe (formerly IDG Communications BV) Foundry Central Europe Foundry Southern Europe Foundry Nordics Foundry Middle East, Türkiye, and Africa Foundry Japan (in Japanese) Foundry ASEAN (formerly IDG Communications Ltd.) Foundry India (formerly IDG Media Private Ltd.) Foundry Australia and New Zealand (formerly IDG Communications Pty. ABN 14 001 592 650) Reuters Images Copyright This site includes material whose copyright is held by Reuters. All rights reserve