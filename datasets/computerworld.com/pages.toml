full_description = "The Artificial Intelligence Forecasting System model uses a thousand times less energy than traditional methods and should be 20% better. Credit: Miti / Unsplash The European Center for Medium-Range Weather Forecasts (ECMWF) has made its new AI model, the Artificial Intelligence Forecasting System (AIFS), available to everyone free of charge. Medium-range weather forecasts are those that predict weather conditions for three to 15 days into the future. AIFS can provide detailed forecasts for wind, temperature and precipitation and, according to the Center, and should perform up to 20% better than today’s modern physics-based models. The model will also be faster and consume a thousand times less energy. Traditional physics-based weather forecasts are made by solving physical equations, but these are only a simplification of the dynamics of the atmosphere. AI-driven models have an advantage because they can find more complex relationships and dynamic patterns directly from the data. Related content Opinion Why fast-learning robots are wearing Meta glasses By Mike Elgan Feb 28, 2025 7 mins Augmented Reality Emerging Technology Robotics Feature Just what is an 'IT worker' now? The definition is changing By Lucas Mearian Feb 27, 2025 11 mins Developer Generative AI IT Jobs News Analysis Apple's Vision Pro enters Industry 4.0 with Dassault Systèmes By Jonny Evans Feb 26, 2025 4 mins Apple Augmented Reality Virtual Reality Other Sections Podcasts Videos Resources Events Spotlight: Prioritizing your AI investments SUBSCRIBE TO OUR NEWSLETTER From our editors straight to your inbox Get started by entering your email address below. Please enter a valid email address Subscribe Opinion Why fast-learning robots are wearing Meta glasses By Mike Elgan Feb 28, 2025 7 mins Augmented Reality Emerging Technology Robotics Feature Just what is an 'IT worker' now? The definition is changing By Lucas Mearian Feb 27, 2025 11 mins Developer Generative AI IT Jobs News Analysis Apple's Vision Pro enters Industry 4.0 with Dassault Systèmes By Jonny Evans Feb 26, 2025 4 mins Apple Augmented Reality Virtual Reality"
