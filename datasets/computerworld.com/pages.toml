title = "Best Places to Work in IT 2025 – Computerworld"
description = "Our 31st annual report finds that leading companies prioritize upskilling and retention strategies as IT expands its impact and influence across the business."
full_description = "Our 31st annual report finds that leading companies prioritize upskilling and retention strategies as IT expands its impact and influence across the business. Credit: Foundry / Unsplash What makes a company a great place to work for IT professionals? Top salaries and benefits certainly help, but those are just table stakes. Tech workers are looking for challenging projects, growth opportunities, and continuous learning in a supportive workplace. For the 31st year, Computerworld publisher Foundry surveyed large, midsize, and small organizations to find the top IT employers. Read our special report to see which companies made our list and what makes them such desirable places to work. To read the Best Places to Work in IT 2025 report in PDF format, download it below (no registration required). Special Report: Best Places to Work in IT 2025Download PDF In this report: Cover story: Building a collaborative IT culture Profiles of three Best Places companies: Total Quality Logistics, OCLC, and Tokio Marine North America Services The Best Places to Work in IT 2025: Rankings by company size Metholodology: How we chose the best places to work Building a collaborative IT culture The ongoing quest for technical talent in an uncertain economic environment has caused many organizations to turn their attention inward, taking steps to keep their existing IT workforce engaged and invested in the overall business charter. The goal: build a collaborative IT culture defined by continuous learning, meaningful work, and positive contributions to the business. Companies participating in Computerworld’s 31st annual “Best Places to Work in IT” survey show a strong commitment to in-house IT talent, even as they cast a wider net for IT candidates to build a more diverse workforce that fosters creativity and innovation. A heightened emphasis on training is designed to enrich technical skills — especially in artificial intelligence (AI), analytics, and the cloud — as well as soft skill sets that align with broader business objectives. “We are steadfast in our technology investments and continue to modernize our skill sets, technologies, and processes at the same speed as ever — or even faster,” says Deepa Soni, chief information and operations officer at The Hartford, ranked No. 2 overall and No. 4 in the career development/training category among large companies in this year’s survey. “We think about three things to make IT the best destination for internal and external folks: Leveraging cutting-edge technology and solutions, creating business impact, and building a culture that fosters creativity while being inclusive and diverse.” Precision hiring addresses critical skills gaps Our survey found that the relentless pace of new hiring over the past two years remains robust. Among the surveyed companies, 79% have increased the total number of IT employees over the last three years, on average by 36%. This is down from a high of 86% in the 2024 survey but surpasses the 72% of companies reporting three-year IT workforce gains in 2023. But although IT hiring is picking up steam again after a brief lull, survey respondents indicated that another cooling-off period may lie ahead. Just half of this year’s respondents plan to increase the number of IT hires over the next fiscal year, down significantly from the previous two years (71% and 72%, respectively). Nearly half of the organizations (46%) expect the size of their IT workforce to remain the same, with larger firms more likely to face hiring slowdowns. Conversely, 70% of smaller companies plan to add IT talent, with an average increase of 10%. Top 10: IT Growth LARGE COMPANIESMIDSIZE COMPANIESSMALL COMPANIES1Graphic Packaging InternationalPower Home RemodelingMetroStar2Dayforce, Inc.CHG HealthcareRailinc Corp.3Johns Hopkins MedicineSophos Ltd.IT Convergence, Inc.4University of Notre DameEnovaConnexus Credit Union5Johns Hopkins University Applied Physics LaboratoryGenesis HealthCare SystemAmerisure Mutual Insurance Company6UKGOCLC, Inc.Nerdio7H. Lee Moffitt Cancer Center & Research InstitutePlante Moran, PLLCMiles IT Company8Health Care Service CorporationFive9Nitel9Norton HealthcareKinaxis Inc.Dataprise LLC10RSM US LLPAmerican FidelityAbarca Health VyStar Credit Union, ranked third overall among midsize company respondents, is being very intentional about its IT hiring strategy while it moves to fill key openings. The plan is to slowly augment its 271-person IT staff with several critical positions, including a high-level AI thought leader and champion, several data architects, and engineers versed in software development life cycle skills such as DevOps automation. “We are focused on how to make the best use of AI for our organization and are on a relentless journey to automate and streamline processes,” says Lisa Cochran, CIO of VyStar. “We are a heavily regulated organization, so we must have consistent ways of documenting changes. If we can capture and create artifacts without a human, then developers can spend less time on documentation.” Like VyStar, many other companies are mapping the smaller number of external hires to highly coveted emerging skills categories — many of which are in short supply in the general marketplace. Among this year’s respondents, most new open IT-related positions fall into critical skills groups such as AI/machine learning (86%), data science/analytics (78%), cloud/multicloud (76%), and IT/cybersecurity (67%). In each of these competency areas, companies have dialed up hiring over last year’s, most significantly in the AI/machine learning (ML) area, which saw a 12-point year-over-year hike. To address the need for more traditional IT skills, companies are relying more heavily on contract workers. In this year’s survey, the number of temporary or contract workers increased 10% on average across all respondents, compared with an average 7% decrease in contract workers hired over the prior 12 months. Career development opportunities on the rise While casting an eye toward external talent, organizations continue to promote from within to hold onto existing talent. This year’s survey found that 13% of IT employees across all companies advanced to new positions in the last fiscal year, much as in the last two years (15% in the 2024 survey and 14% in 2023). Similarly, salary bumps remain in line with last year’s findings, with 90% of IT employees the beneficiaries of a raise. Salary cuts or wage freezes don’t appear to be on the table — the vast majority (96%) of this year’s respondents said no such plans were in the works, now or in the foreseeable future. This year’s survey indicates that IT professionals have plenty of opportunities to take advantage of internal programs to boost their career. Respondent companies are upleveling training programs with new curriculum that burnishes both technical and business skills, going deeper on high-demand technologies such as AI and cloud engineering while also providing education on soft skills such as change management and communications, to accommodate the increasing influence of digital technologies across the business. Top 10: Career Development LARGE COMPANIESMIDSIZE COMPANIESSMALL COMPANIES1MITRESophos Ltd.Tokio Marine North America Services2Total Quality LogisticsPower Home RemodelingAxon Active Vietnam Co., Ltd.3SUNY Upstate Medical UniversityCME GroupOstfriesische Tee Gesellschaft GmbH & Co. KG4The HartfordNational Information Solutions CooperativeRailinc Corp.5The Kroger CompanyFINRAMiles IT Company6University of Notre DameCHG HealthcareAmerisure Mutual Insurance Company7Navy Federal Credit UnionWorthington SteelPrezzee Pty Ltd8HolmanCareSourceAvaap9Oshkosh CorporationVyStar Credit UnionDataprise LLC10Johns Hopkins MedicineKinaxis Inc.Consumers Credit Union As part of the emphasis on internal employee development, companies are putting structures in place to help IT professionals actively chart a career course. New mentorship, apprenticeship, and job rotation programs deliver exposure to emerging technology domains as well as full immersion in the business. Defined learning paths and formalized skills assessments help IT workers be more intentional about identifying and addressing critical skills gaps when mapping out their next career move. These efforts continue to move the needle on internal mobility: Approximately 35% of IT vacancies are now being filled through company insiders, equal to last year’s percentage and down slightly from the 38% reported in the 2023 survey. At Amerisure Mutual Insurance, which ranked fourth overall among small companies and sixth for career development and training, communities of practice meet monthly or quarterly, providing cross-functional IT groups and business professionals with demonstrations, tutorials, and training to build expertise in areas such as agile, DevOps, and product architecture. In addition, all IT staffers now participate in a proprietary skills assessment that spells out current skills and targets key areas for improvement. “Development plans can be too broad and not actionable,” notes Amjed Al-Zoubi, Amerisure’s CIO. “This isn’t a checklist but, rather, a very clear conversation and development plan highlighting the skills they need to grow into specific jobs.” Amerisure also bolsters internal IT development practices by increasing the emphasis on business outcomes. Historically, Amerisure assigned people to projects from a central IT talent pool, reassigning them when work was complete. Today, IT teams are aligned with eight different business groups. “There were inefficiencies in our old process, and IT was limited in their ability to learn the business,” Al-Zoubi explains. “Now the IT underwriting team is aligned with the business underwriting team, and they work together to solve underwriting problems. We bring our best, and they bring their best, and it results in higher-performing teams.” Training courses offered by survey respondents run the gamut and are available to all IT employees, regardless of where they work. Technical training, technical certifications, and management training are the most prevalent forms of instruction, but there is also a heavy emphasis on professional career development, building business and soft skills, and even health and wellness. The Hartford is continuing to uplevel its skills development programs to stay abreast of the latest technology trends and leadership skills. For example, the firm has doubled training hours available for cloud, agile development, data science, and cybersecurity. The company’s HartCode Academy Bootcamp provides an avenue for non-IT people to learn software engineering and business data analysis skills, and there are numerous executive-level programs devoted to cultivating leadership skills. “We are helping IT leaders get really comfortable with change and how they lead teams,” Soni says. “We are training folks to be the CIOs of the future.” Top 10: Benefits & Compensation LARGE COMPANIESMIDSIZE COMPANIESSMALL COMPANIES1GenentechOCLC, Inc.Dataprise LLC2Zimmer BiometCME GroupAvaap3Oshkosh CorporationCHG HealthcareAmerisure Mutual Insurance Company4QualcommA+E Television NetworksData Intensity5Motorola Solutions, IncKinaxis Inc.Nitel6UKGCredit AcceptanceConsumers Credit Union7RSM US LLPSophos Ltd.Tokio Marine North America Services8PPGPlante Moran, PLLCIT Convergence, Inc.9GSK plcGuardant HealthNerdio10International PaperTokyo Electron U.S. Holdings, Inc.Nationale Nederlanden Vida Given the emphasis on continuous learning, training budgets remain flush, with 39% of this year’s respondents increasing their training budget from the previous year and 59% reporting no change to their allocations. The number of companies increasing their training budget has fallen over the past two years, down from 62% in 2023 and 49% last year. Most companies don’t set caps on training: 77% give employees the latitude to participate in as many programs as they desire. Those that do restrict employees limit them to seven days, on average, of in-person or remote training annually. To spark engagement, companies are courting employees with a variety of tactics, including hosting employee appreciation events (98%), doling out bonuses or other high-value items to reward high performers (92%), and building clear career paths with attainable milestones (88%). Free career development services are also offered by 82% of the respondents. Mentoring programs remain a consistent and widely prevalent vehicle for upskilling existing IT workers, offered by 76% of the responding companies, which is similar to last year. DEI remains a priority, with mixed results Companies continue to dedicate time and money to diversity, equity, and inclusion (DEI) initiatives, confident that greater workforce diversity is an important element of company culture as well as a factor in upleveling innovation and diversity of thought. Overall DEI efforts have made an impact, but they’ve been slower to reshape the makeup of the traditional IT workforce, particularly when it comes to women, who made up 27% of the IT workforce among respondents this year, down slightly from 29% in 2024 and 28% in 2023. On the other hand, minority hires are on the rise. Among this year’s respondents, the number of people in IT identifying as part of a minority group jumped to 36%, compared to 33% in the 2024 survey. Minority groups accounted for 29% of the IT managers and 37% of the nonmanagers. The percentage of companies with a formal DEI strategy fell this year to 88%, down six points from 2024. Large firms were more likely to have a formal strategy, at 94%. Companies were also less likely to have a dedicated role in place to promote DEI (54% this year, compared to 62% in 2024), although most respondents (92%) maintain either a person or a team in place to champion DEI policies and awareness. The Hartford has been steadfast in its commitment to diversity, to the point where DEI is infused into company culture instead of serving as a stand-alone program, says Soni. “DEI is baked into the fabric of how we do business quite uniquely,” she says. “We view it as a business necessity — we have to represent the society that we live in in the workplaces we have.” To encourage greater understanding of DEI and its potential impacts, organizations such as The Hartford are serving up a smorgasbord of DEI training, including curriculum focused on preventing discrimination and harassment (96%) and creating an inclusive workspace (92%). Much of the DEI activity is consistent with last year’s survey, with one notable exception: providing targeted internships for women and minorities, at 50% this year, compared to 60% in the 2024 survey. Top 10: Diversity, Equity & Inclusion LARGE COMPANIESMIDSIZE COMPANIESSMALL COMPANIES1Stanford Medicine Children’s HealthOCLC, Inc.Tokio Marine North America Services2NewYork-Presbyterian HospitalCareSourceMetroStar3Cedars SinaiChenMedAmerisure Mutual I"
