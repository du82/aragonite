title = "Windows 11: A guide to the updates – Computerworld"
description = "Preston Gralla is a contributing editor for Computerworld, a blogger for ITworld, and the author of more than 45 books, including NOOK Tablet: The Missing Manual (O'Reilly 2012) and How the Internet Works (Que, 2006)."
full_description = "Here’s what you need to know about the latest updates to Windows 11 as they’re released from Microsoft. Now updated for KB5052093 Preview, released on Feb. 25, 2025. Credit: Shutterstock A Windows launch isn’t the end a process — it’s really just the beginning. Microsoft continually works on improving Windows 11 by fixing bugs, releasing security patches, and occasionally adding new features. In this story we summarize what you need to know about each update released to the public for the most recent version of Windows 11 — currently version 24H2. For each build, we’ve included the date of its release and a link to Microsoft’s announcement about it. The most recent updates appear first. The easiest way to install updates is via Windows Update. Not sure how? See “How to handle Windows 10 and 11 updates” for full instructions. Note that Windows 11 version 24H2 is being released as a phased rollout and may not be available to you in Windows Update yet. If you’re still using Windows 10, see “Windows 10: A guide to the updates.” And if you’re looking for information about Insider Program previews for upcoming feature releases of Windows 11, see “Windows 11 Insider Previews: What’s in the latest build?” Updates for Windows 11 24H2 KB5052093 (OS Build 26100.3323) Preview Release date: February 25, 2025 In this build, a variety of new features are being rolled out gradually, including one that lets you snooze or turn off the “Start backup” reminder in the File Explorer address bar. This only applies if you are not already backing up your files and folder. To view this new option, right-click Start backup. A number of bug fixes are being rolled out gradually, including one for a bug in which the address bar overlapped files in File Explorer when you used the F11 full-screen mode. A variety of bug fixes take immediate effect, including for a bug in which there were display rendering issues when you tried to connect to certain PCs. There are two known issues in this build, including one in which Arm devices are unable to download and play Roblox via the Microsoft Store on Windows. In addition, devices that have certain Citrix components installed might be unable to complete installation of the January 2025 Windows security update. This issue was observed on devices with Citrix Session Recording Agent (SRA) version 2411. (Get more info about KB5052093 Preview.) KB5051987 (OS Build 26100.3194) Release date: February 11, 2025 This update has a wide variety of security updates. For details, see Microsoft’s Security Update Guide and February 2025 Security Updates. What IT needs to know: Because this is a security update, it should be applied relatively soon. Over the next few weeks, check for reports about problematic issues, and if all seems well, apply the update. There are three known issues in this build, including one in which players on Arm devices are unable to download and play Roblox via the Microsoft Store on Windows. (Get more info about KB5051987.) KB5050094 (OS Build 26100.3037) Preview Release date: January 28, 2025 In this build, a variety of new features are being rolled out gradually, including one in which an icon will appear in the system tray when you use an app that supports Windows Studio Effects. This only occurs on a device that has a neural processing unit (NPU). Select the icon to open the Studio Effects page in Quick Settings. To view the app that is using the camera, hover over the icon for a tooltip. A number of bug fixes are being rolled out gradually, including one for a bug in which a search would sometimes repeat when you didn’t want it to. Other bug fixes are immediately available, including one in which the display of some games appears oversaturated when you use Auto HDR. There are three known issues in this build, including one in which Arm devices are unable to download and play Roblox via the Microsoft Store on Windows. In addition, following the installation of the October 2024 security update, some customers report that the OpenSSH (Open Secure Shell) service fails to start, preventing SSH connections. And devices that have certain Citrix components installed might be unable to complete installation of the January 2025 Windows security update (Get more info about KB5050094 Preview.) KB5050009 (OS Build 26100.2894) Release date: January 14, 2025 This update has a wide variety of security updates. For details, see Microsoft’s Security Update Guide and January 2025 Security Updates. What IT needs to know: Because this is a security update, it should be applied relatively soon. Over the next few weeks, check for reports about problematic issues, and if all seems well, apply the update. There are three known issues in this build, including one in which players on Arm devices are unable to download and play Roblox via the Microsoft Store on Windows. (Get more info about KB5050009.) KB5048667 (OS Build 26100.2605) Release date: December 10, 2024 This update has a wide variety of security updates. For details, see Microsoft’s Security Update Guide and December 2024 Security Updates. What IT needs to know: Because this is a security update, it should be applied relatively soon. Over the next few weeks, check for reports about problematic issues, and if all seems well, apply the update. There is one known issue in this build, in which players on Arm devices are unable to download and play Roblox via the Microsoft Store on Windows. (Get more info about KB5048667.) KB5046740 (OS Build 26100.2454) Preview Release date: November 21, 2024 This build adds a number of interface features are being rolled out gradually. The system tray shows a shortened date and time, and there’s a new section for touchscreen edge gestures in Settings. When you right-click an app on the Start menu, a jump list will appear (if the app has a jump list). And if you hold Ctrl + Shift down when you click a jump list item, you open the item as an admin. A variety of bugs have been fixed in this build, including one in which the users page might have caused Task Manager to stop responding when you use the keyboard. There is one known issue in this build, in which Arm devices are unable to download and play Roblox via the Microsoft Store on Windows. (Get more info about KB5046740 Preview.) KB5046617 (OS Build 26100.2314) Release date: November 12, 2024 This update has a wide variety of security updates. For details, see Microsoft’s Security Update Guide and November 2024 Security Updates. What IT needs to know: Because this is a security update, it should be applied relatively soon. Over the next few weeks, check for reports about problematic issues, and if all seems well, apply the update. (Get more info about KB5046617.) KB5044384 (OS Build 26100.2161) Preview Release date: October 24, 2024 In this build, you can now configure the Copilot key on the keyboard. On new devices, the key opens the Copilot app. If you sign in to your account using a Microsoft Entra ID, the key opens the M365 app. You can make the key open a different app or open Search. To do this, go to Settings > Personalization > Text input. In addition, a variety of features are being rolled out gradually, including one in which you can stop the suggestions to turn off notifications from certain apps. Select the ellipsis (…) in the notification and turn it off. You can also go to Settings > System > Notifications and turn it off from there. A variety of bugs have also been fixed, including one in which you were unable to view some parts of the UI when you run certain apps. There is one known issue in this build, in which Arm devices are unable to download and play Roblox via the Microsoft Store on Windows. (Get more info about KB5044384 Preview.) Windows 11 24H2 KB5044284 (OS Build 26100.2033) Release date: October 8, 2024 This update has a wide variety of security updates. For details, see Microsoft’s Security Update Guide and October 2024 Security Updates. This build also fixes one bug in which the Remote Desktop Gateway Service stopped responding when a service used remote procedure calls (RPC) over HTTP. There is one known issue in this build, in which Arm devices are unable to download and play Roblox via the Microsoft Store on Windows. What IT needs to know: Because this is a security update, it should be applied relatively soon. Over the next few weeks, check for reports about problematic issues, and if all seems well, apply the update. (Get more info about KB5044284.) Windows 11, version 24H2 Release date: October 1, 2024 The Windows 11 24H2 update (also called Windows 11 2024 Update) is now being gradually rolled out. It may take some months before it reaches everyone, so you may not have it yet. As with previous annual Windows updates, it’s not a major upgrade, but does include a variety of minor new features. Following are the highlights for end users: File Explorer gets several new features, including support for TAR and 7z compression and the ability to add metadata to PNG files, so you can add information to your images. New privacy settings for Wi-Fi networks give more control over which applications can access the list of nearby Wi-Fi networks. Limiting the applications that can access that list can make it more difficult for others to pinpoint your location. You can now join Wi-Fi networks by scanning QR codes, and create a QR code to allow others to share your mobile hotspot with others. A new Energy Saver mode reduces electric consumption on desktop PCs as well as laptops, helping you reduce your carbon footprint and improving laptop battery life. It reduces energy consumption from background tasks as well as those running in the foreground. Copilot now runs as a separate app, and is movable and resizable like any other app, rather than running in a sidebar panel. Copilot+ PCs get several new features, including Cocreator in Paint, which uses AI to generate images; enhancing video calls with AI-powered noise cancellation and improved lighting; and what Microsoft calls Auto Super Resolution, which gives games higher resolution and offers smoother gameplay. For IT admins, highlights include: Policy improvements and automatic account management for Windows Local Administrator Password Solution (LAPS) Personal Data Encryption (PDE) for users’ Documents, Desktop, and Pictures folders App Control for Business Windows protected print mode Local Security Authority (LSA) protection Support for Wi-Fi 7 SHA-3 support See this blog post from Microsoft’s Harjit Dhaliwal for more information. Prerelease updates for Windows 11 24H2 KB5043178 (OS Build 26100.1882) Preview Release date: September 30, 2024 This build for Windows 11 24H2 offers a variety of new features, some of which will show up immediately and some of which are being rolled out gradually. Among the features that will roll out gradually is a new energy recommendation to turn off high dynamic range (HDR). This helps to conserve energy on devices that have HDR displays. Go to Settings > Power & battery > Energy recommendations. Among the features available immediately is one that lets you manage your Copilot Pro subscription in Settings. Sign in to your Microsoft account and go to Settings > Accounts. Several bugs have been fixed, including one in which Task Manager stopped responding when you switched from a high-contrast theme to a normal theme. There is one known issue in this build, in which Arm devices are unable to download and play Roblox via the Microsoft Store on Windows. (Get more info about KB5043178 Preview.) KB5043080 (OS Build 26100.1742) Release date: September 10, 2024 This update has a wide variety of security updates. For details, see Microsoft’s Security Update Guide and September 2024 Security Updates. There is one known issue in this build, in which Arm devices are unable to download and play Roblox via the Microsoft Store on Windows. What IT needs to know: Because this is a security update, it should be applied relatively soon. Over the next few weeks, check for reports about problematic issues, and if all seems well, apply the update. (Get more info about KB5043080.) KB5041865 (OS Build 26100.1591) Preview Release date: August 27, 2024 This build for Windows 11 24H2 offers a variety of new features that are being rolled out gradually, including one in which you can share content to your Android device from the Windows Share window. Several bugs have been fixed, including one in which a deadlock occurred in the domain controller when it started up in the DNS client. There is one known issue in this build, in which Arm devices are unable to download and play Roblox via the Microsoft Store on Windows. (Get more info about KB5041865 Preview.) KB5041571 (OS Build 26100.1457) Release date: August 13, 2024 This update has a wide variety of security updates. For details, see Microsoft’s Security Update Guide and August 2024 Security Updates. It also fixes several bugs, including one in which the “Use my Windows user account” checkbox was not available on the lock screen to connect to Wi-Fi. There is one known issue in this build, in which Arm devices are unable to download and play Roblox via the Microsoft Store on Windows. What IT needs to know: Because this is a security update, it should be applied relatively soon. Over the next few weeks, check for reports about problematic issues, and if all seems well, apply the update. (Get more info about KB5041571.) KB5040529 (OS Build 26100.1301) Preview Release date: July 30, 2024 This build for Windows 11 24H2 offers a variety of new features that are being rolled out gradually, including the new account manager being on the Start menu. When you use a Microsoft account to sign in to Windows, you will get a glance at your account benefits. This feature also makes it easy to manage your account settings. One feature is being rolled out immediately, in which Widgets icons on the taskbar are no longer pixelated or fuzzy. You also get a larger set of animated icons. Several bugs have been fixed, including one in which devices that use certain WLAN cards stopped responding. There is one known issue in this build, in which Arm devices are unable to download and play Roblox via the Microsoft Store on Windows. (Get more info about KB5040529 Preview.) KB5040435 (OS Build 26100.1150) Release date: July 9, 2024 This update has a wide variety of security updates. For details, see Microsoft’s Security Update Guide and July 2024 Security Updates. It also This update adds PCR 4 to PCR 7 and 11 for the default Secure Boot validation profile. There is one known issue in this build, in which Arm devices are unable to download and play Roblox via the Microsoft Store on Windows. What IT needs to know: Because this is a security update, it should be applied relatively soon. Over the next few weeks, check for reports about problematic issues, and if all seems well, apply the update. (Get more info about KB5040435.) KB50439304 (OS Build 26100.1000) Preview Rel"
