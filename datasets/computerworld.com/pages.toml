title = "AWS exec highlights key skills for success in the evolving AI-driven job market – Computerworld"
description = "AI and tech skills are rapidly changing, and what's needed to find a job or advance your career is dramatically different than just a few years ago — and critical soft skills matter more than ever, says Jenny Troutman, director of product and services for AWS training and certification."
full_description = "AI and tech skills are rapidly changing, and what's needed to find a job or advance your career is dramatically different than just a few years ago — and critical soft skills matter more than ever, says Jenny Troutman, director of product and services for AWS training and certification. Credit: CHOLTICHA KRANJUMNONG According to the World Economic Forum’s recent Future of Jobs Report, 39% of workers’ existing skillsets will become outdated by 2030 due to economic uncertainty, the rise of generative AI (genAI) and rapid technological change. Skillsets related to genAI, networks and cybersecurity, and technological literacy are now among the fastest growing and highest in-demand skills sought by employers. Seventy-three percent of employers prioritize hiring AI-skilled talent, yet three-quarters of them struggle to find the right candidates, according to one study commissioned by Amazon Web Services (AWS). It found that employers are willing to pay more for IT workers with genAI skills — on average, 47% more — and pay benefits extend across departments. Employers said that they would be willing to pay workers with AI skills a premium in sales and marketing (43% higher salary); finance (42% more); business operations (41% more); legal, regulatory, and compliance (37% more); and human resources (35% more). AWS has more than 600 online courses — many of them free — through which workers can become more familiar and certified in the uses of genAI technology and tools. And, not surprisingly, Amazon is dealing with many of the same issues, including worker fear of the unknown and concerns about what jobs will remain in the wake of genAI’s advances. The pace at which new courses are being devoured by technologists and business-side workers alike is unpreceded, according to Jenni Troutman, director of product and services for AWS training and certification. Among all AWS Certifications, the beta exam for AWS Certified AI Practitioner drew the largest number of participants — 20 times the number of participants than the historical average for new beta courses. For the AWS Certified Machine Learning Engineer Associate, the company saw a tripling of the number of beta participants compared to the past average. While AWS has been expanding its courses to help workers gain expertise and certification in genAI, it’s also been forced to address internal concerns and anxiety around the technology’s impact on jobs. Troutman said that as the technology and business marketplace quickly evolves, the traits that make a worker valuable are also changing. The need to understand how to use genAI, as well as the need for critical soft skills, is no longer a nice-to-have. It’s a need-to-have. Troutman spoke with Computerworld about what skills are most needed by job seekers and the currently employed who want to keep their jobs or advance their careers. What do you see changing in terms of the type of skills and workers AWS itself is seeking? “We’re looking at the same things our customers are talking about, which is, how do we get our workforce upskilled on just what AI is to begin with, and then how to use it in their day-to-day jobs. “We have our own internal efforts that are similar to the training we provide customers. We’ve been running multiple internal campaigns on getting people to take the training, build the skills and get, at least — depending on their role — the certified AI practitioner certification, which is one we launched last year. It’s meant for everyone to demonstrate fluency in AI and some basic understanding of AI and generative AI concepts, how you can benefit from them, and knowledge on the tools we provided. “We are driving change management-type efforts to get people comfortable using the tools that are provided, so anything from Amazon Q Developer to get our developers’ productivity improved and free up time for two things: One, get more out there so we can build faster for customers, but also to get people [doing] higher quality code moving faster and just more productive in their day-to-day work. “We also have [business intelligence-type] tools internally where people are learning how to use AI. Another one is Amazon Q for Business — our business intelligence tool that looks across internal information, and you can use it to make yourself more productive. “So, we have been working on helping people understand what tools are out there, how they can use them, and then how they can think differently about what they can accomplish in their work over a period of time. And we incorporate that into our annual planning.” What are you seeing in terms of accepting this kind of job change from employees? Are you getting any pushback? “Yeah. Frankly, we see all the same things as we see externally. We see people who are super excited and jump on it and are figuring out new ways of using the technology rapidly and then you see people who are skeptical, who are going to say, ‘Hey, it’s not ready for me to use, yet. It’s not really going to affect me and [will] take longer to come along.’ “What we’re finding is people that are in that place are starting to get nervous and realizing that people are serious [about this]. I think we’re probably further ahead than a lot of users, because we build the technology ourselves, and so we need to be demonstrating that we’re using it. So people are already realizing, ‘If I’m not figuring out how to use it, I’m going to be in trouble, and it’s going to be a risk for my career.’ “So, while there are still people who are slow to adopt it, I would say there’s less of them and we’re moving past the message of, ‘It’s not ready for me, or it’s not relevant for me.’ It’s more of an, ‘Oh, how I’m getting nervous, and I need to start figuring out how to do it, but I’m so busy that it feels like a lot to have to learn it.’” What are the skills requirements that are changing? “A big one is prompt engineering. It’s a term that puts people off if they’re not technical. I think because you think of engineering as being technical, but really, it’s sort of the term that we’re using for how you get the output you need from a generative AI tool. It doesn’t really matter your role. You need to understand how to write good prompts really be able to get the best benefit from the technology. “Learning how to write good prompts is a skill in and of itself, and it’s a new skill that most people don’t have. So that is one where we focus a lot. Once you get the basics and understand what AI and generative AI is, then you need to learn prompt engineering, and there’s a course on how to write good prompts. Then the second thing to learn is just thinking differently. It’s really around the soft skills of being creative, trying new things, thinking critically. “So, if you try something out and it doesn’t give you the result you wanted at first, being able to figure out why, and keep adapting your approach. And during that time, be collaborating with others to understand how other people are using the technology, which will help you think differently and come up with new ideas. “We’re in such early stages. While the technology itself been around a long time, widespread use hasn’t been here for very long. It’s really about the art of the possible and thinking differently about how to accomplish day-to-day things. I would say that is the biggest barrier, right now. “And so, getting exposure to what other people are doing and being curious, reaching out and finding out is a skill in and of itself. We call it, ‘learn and be curious.’ It’s a leadership principle of ours at Amazon. But in general, it’s that curiosity of really being able to find out what other people are doing and then use that, not only to replicate it, but also to come up with new ideas yourself.” What skills do you see are becoming outdated? “It’s things that are…repetitive. An example is an entry-level software developer, where they’re mostly coding all the time. That pure practice of coding is going to become less and less relevant. It’s going to be developers who are able to spend more time on thinking differently about what they’re building, about how to create better applications, about better designs and architectures, which is a higher-level skill. And, they’re going to have to take on a role more around the quality of code — the quality checking role — making sure that the code is doing what you want. “And so it’s those kind of more mid-tier and senior developers that are going to be where the demand is, and entry-level kind of coding is going to be a less relevant skill. So, we’re really encouraging people that are more junior developers to get mentors and learn how to think bigger and move beyond pure coding to getting into design and new application development.” Is generative AI really creating quality code? “Yes. If you use it correctly and it’s dependent on the use case. So, there are use cases that it is phenomenal at it, and there are use cases where there’s still some work for it to get there. But it will get there. It’s getting better by the day. “The advances that are happening in the technology are happening so fast that things like Java migrations — that are more standardized — those [use cases] are incredible. The speed of acceleration and the quality of the work are tremendous. When you’re talking about building something completely new from the beginning, then it takes someone who really understands how to do successful prompting, and they have more QA. But it’s getting there. It’s getting better and better.” How do you see software developer jobs changing? Are some entry-level jobs simply going away? “I don’t think so. I think we will need fewer people at those levels, or those at those levels will just become more advanced. Because what will happen is they won’t need to spend as much time on coding. It will force them to learn new things so to either quickly adapt and focus time more on the actual problems that they’re solving with their applications, or learn new skills and start to expand beyond core products, core software development — like core coding. They’ll also be moving into specialty areas, like security areas, where we definitely need more people. And they are adjacent, so they can kind of branch into building skills in those areas.” What new jobs are you seeing in the market that are being created by this shift? “I see a lot of people being able to be more productive in their current jobs. I see a lot of expansion of roles, like machine learning engineers, big data specialists. We’re needing more and more of those roles. They’re not necessarily new roles, but they’re roles where people tend to be highly skilled. We don’t have a lot of them, and now we need a lot more of them. “It’s not clear yet what brand new roles we’re going to have or need. I think we haven’t figured it out yet, but what we are finding is that people in their current roles are operating in different ways and able to do a lot more [through genAI]. It’s great, because you can be more creative and more innovative and get a lot more done. But it also can be scary for people because of how much more is this all going to change, and how fast and how many people are we going to need to do the work? “Are we just going to keep getting more productive, or is there a point where we don’t need as many people? And I think that’s a big…interesting question, because I think it’s similar to when the internet came up. People could get stuff done so fast, and it was like, ‘Yikes! We’re not going to need nearly [as many workers] now.’ But we certainly haven’t seen the workforce shrink. So I don’t think we will now, either. But it’s hard to predict where we’re going to go.” Businesses are now hiring tech talent across various departments, like finance, sales, marketing — and even business-side workers are becoming IT savvy. Are you seeing a rise in the business technologist? And what does that mean? “I don’t know if I’d call them business technologists, but yes, there’s a rise in business people trying to understand AI and what it means for them, and we’ve actually seen that with the launch of our AWS Certified AI Practitioner [course]. The demand for it has outpaced any previous certification we’ve had by a factor of 9x from the beta launch of it. And it’s been because of demand from both business people and technical people who are really just trying to figure out what is it all about and how can they use it in their day-to-day lives and jobs. “That’s what we’re seeing — that recognition that these new technologies that are coming out…and they’re kind of the future, and people have to figure out what this technology can do for them and their job, no matter what their job is. “We participated in a study…around wages associated with AI skills, and what we found was just an incredible uplift in wage premiums for people in any role that have AI skills, or those who can demonstrate AI skills, including like above 30% wage premiums, even for people in HR, marketing, finance, stuff like that. And so, because of those roles, having such a high premium placed on having AI skills, people are realizing across the board that they need an understanding of the technology and a literacy around AI to be successful, no matter their role.” What are the AI-related skills companies are seeking right now, and will those also change in the future? “Yes. So the big ones are around machine learning engineers. We also came out with an associate-level technical certification for machine learning engineers last year, because that one is a big high-growth area, as well as data specialists. So, people who know how to architect the data environments and who know how to structure the data all the way through to people who know how to use it, like business analysts to effectively leverage [business intelligence] tools. And, then also software engineers who understand AI and who can build applications that leverage the AI underlying the application. Those are some of the highest growth technical roles. And who knows for how long? “I imagine those are going to be critical roles for quite a for quite a while, but I’m sure there’s going to be all kinds of new ones that come up in the next couple years that we can’t even imagine.” What are the steps workers and job seekers can take to gain in-demand tech skills that can future-proof their careers? “I would say two things: One, I would start setting aside a time to do some kind of structured learning online. We offer that on AWS Skill Builder. Start taking some of the foundational courses. There’s all kinds of free training out there: What is AI? What is generative AI? There’s even a generative AI essentials course on there where you can just get the foundational concepts. I would start learning that now. “And two, I would find what tools you either have access to at your company that are generative AI or go outside and start with Q Developer or oth"
