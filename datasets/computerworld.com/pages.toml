["https://www.computerworld.com/article/3833900/kandji-exec-vision-pro-is-a-good-fit-for-the-enterprise.html"]
title = "Kandji exec: Vision Pro is a good fit for the enterprise – Computerworld"
description = "Hello, and thanks for dropping in. I'm pleased to meet you. I'm Jonny Evans, and I've been writing (mainly about Apple) since 1999. These days I write my daily AppleHolic blog at Computerworld.com, where I explore Apple's growing identity in the enterprise. You can also keep up with my work at AppleMust, and follow me on BlueSky,Mastodon, and LinkedIn."
full_description = "The company now offers MDM support for Vision Pro from within the Kandji system. Credit: Kandji Apple’s recently announced partnership with Dassault Systemés shows the Vision Pro as the cutting-edge enterprise solution it has become, but business users will want to ensure these devices can be managed like the rest of their critical IT infrastructure. Apple responded to this recently when it introduced the tools device management vendors could use to deploy their mobile device management (MDM) solutions for visionOS devices. I caught up with Kandji’s John Richards, general manager for device management, to find out how — and why — the company this week introduced device management for Apple’s Vision device. Kandji puts its Vision on (MDM) Kandji’s take on MDM for Vision Pro devices includes the kind of critical capabilities enterprises will demand from their tech. These include automated device enrollment, passcode policy management through the application of Apple’s Declarative Device Management (DDM), real-time compliance monitoring, and support for the full gamut of Apple device management — but on the Vision Pro. The solution also includes complete device lifecycle management features such as custom profiles, real-time monitoring, detailed inventory tracking, and more, all managed from within the same console as the other systems Kandji supports. Like all device management vendors introducing support for Vision Pro, Kandji built its system using protocols provided by Apple. “We’re enabling organizations to confidently deploy Vision devices while maintaining enterprise-grade security, compliance, and performance,” Kandji said in announcing this support. Apple in the enterprise Richards explained that Kandji is supporting Vision Pro this way because its customers are using the headset. While he declined to be specific, citing customer confidentiality, he described a few of the ways companies are already using Apple’s spatial computing system. “An architecture firm uses Vision Pro devices with their design team. Their designers use Vision Pro to create and review 3D architectural models using spatial computing capabilities,” he told me. When deployed, the hardware is securely configured with specialized CAD applications and secure access to project files using Kandji. “We are also seeing it used as a platform for enterprises to create an integrated package with their proprietary software to be used by customers,” he said. “One company, for example, is drastically lowering the cost of training pilots by allowing aspiring pilots to train using their simulation software customized for Apple Vision Pro as they transition from ground school to full, “zero-hour” flight simulators. This reduces the time that students need to spend using the much-more-expensive flight simulator.” Success where it matters Richards rebuts the notion that because it isn’t selling in iPhone-like quantities, Vision Pro has failed. “The enterprise adoption data tells a different story,” he said. “Over 50% of Fortune 100 companies are already incorporating Vision Pro into their operations, and 67% of IT professionals see Vision Pro’s future as a business productivity solution. IDC projects the AR/VR headset market to reach 22.9 million units by 2028. These early indicators suggest we’re at the beginning of a transformation in enterprise computing.” Vision Pro introduces new possibilities for business productivity and product creation through spatial computing. “The device enables teams to work with digital information and collaborate in revolutionary ways while maintaining enterprise-grade security and management,” Richards said. “With proper management tools, businesses can focus on leveraging these capabilities rather than wrestling with technical deployment challenges.” Managing cutting-edge business As he sees it, the ability to manage Apple’s cutting-edge devices in the same way as we have become accustomed to managing all devices is critical. “The key to Vision Pro’s success in enterprise isn’t just about the fantastic hardware — it’s about enabling organizations to deploy and manage these devices so they can successfully use them as a platform for innovation,” Richards said. Can Apple do more to nurture this part of its market? Richards praised the company for building robust foundations for device management across its devices, but would like to see the capabilities of DDM extended, including the capacity to manage software updates and support for Lost Mode on Vision devices. He has no doubt Apple can make a dent in the enterprise universe, however: “Apple is the only company on the market that can offer the security and privacy that comes when you own both the hardware and software, which makes it an ideal tool for organizations in a world with increasing cyber risks,” he said. “When you combine that with Apple becoming the preferred device for employees, there’s a strong case for adopting Apple tech from a security and employee experience perspective.” You can follow me on social media! Join me on BlueSky, LinkedIn, and Mastodon. Related content Opinion MDM and genAI: A match made in Heaven — or something less? By Ryan Faas Jan 24, 2025 6 mins Enterprise Mobile Management Generative AI Mobile Device Management How-to Time to audit your MDM setup? Here’s how to get it right By Ryan Faas Jan 14, 2025 8 mins Compliance Enterprise Mobile Management Mobile Device Management How-to So you want to manage Apple devices without using MDM? Here’s how. By Ryan Faas Jan 09, 2025 6 mins Apple Mobile Device Management iOS Other Sections Podcasts Videos Resources Events Spotlight: Prioritizing your AI investments SUBSCRIBE TO OUR NEWSLETTER From our editors straight to your inbox Get started by entering your email address below. Please enter a valid email address Subscribe"
