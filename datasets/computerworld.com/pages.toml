["https://www.computerworld.com/article/1614352/windows-11-insider-previews-whats-in-latest-build.html"]
title = "Windows 11 Insider Previews: What’s in the latest build? – Computerworld"
description = "Get the latest info on new preview builds of Windows 11 as they roll out to Windows Insiders. Now updated for Build 22635.5015 for the Beta Channel, Build 26120.3360 for the Dev and Beta Channels, and Build 27802 for the Canary Channel, all released on Feb. 28, 2025."
full_description = "Get the latest info on new preview builds of Windows 11 as they roll out to Windows Insiders. Now updated for Build 22635.5015 for the Beta Channel, Build 26120.3360 for the Dev and Beta Channels, and Build 27802 for the Canary Channel, all released on Feb. 28, 2025. Credit: Microsoft Windows 11 24H2 has been released, but behind the scenes, Microsoft is constantly working to improve the newest version of Windows. The company frequently rolls out public preview builds to members of its Windows Insider Program, allowing them to test out — and even help shape — upcoming features. Skip to the builds The Windows Insider program is divided into four channels: The Canary Channel is where platform changes (such as major updates to the Windows kernel and new APIs) are previewed. These changes are not tied to a particular Windows release and may never ship at all. Little documentation is provided, and builds are likely to be very unstable. This channel is best for highly technical users. The Dev Channel is where new features are introduced for initial testing, regardless of which Windows release they’ll eventually end up in. This channel is best for technical users and developers and builds in it may be unstable and buggy. In the Beta Channel, you’ll get more polished features that will be deployed in the next major Windows release. This channel is best for early adopters, and Microsoft says your feedback in this channel will have the most impact. The Release Preview Channel typically doesn’t see action until shortly before a new feature update is rolled out. It’s meant for final testing of an upcoming release and is best for those who want the most stable builds. The Beta and Release Preview Channels also receive bug-fix builds for the currently shipping version of Windows 11. See “How to preview and deploy Windows 10 and 11 updates” for more details about the four channels and how to switch to a different channel. Not everyone can participate in the Windows 11 Insider program, because the new operating system has more stringent system requirements than Windows 10. If your PC fails to meet the minimum hardware requirements for Windows 11, you cannot join the Windows 11 Insider Program. (See “How to check if your PC can run Windows 11.”) Below you’ll find information about the Windows 11 preview builds that have been announced by Microsoft in the past six months. (For the Release Preview Channel, we cover builds released for the current version of Windows 11, not for earlier versions.) For each build, we’ve included the date of its release, which Insider channel it was released to, a summary of what’s in the build, and a link to Microsoft’s announcement about it. Note: If you’re looking for information about updates being rolled out to all Windows 11 users, not previews for Windows Insiders, see “Windows 11: A guide to the updates.” The latest Windows 11 Insider preview builds Windows 11 Insider Preview Build 22635.5015 Release date: February 28, 2025 Released to: Beta Channel In this build, those in the Beta Channel who have turned the toggle on to receive the latest updates will see a new system tray icon on the taskbar, which lets you use emojis, GIFs, Kaomoji, etc. across all apps and surfaces in Windows in addition to using the Win + . keyboard shortcut. This new system tray icon can be changed by right-clicking on the icon to go to taskbar settings page. Those in the Beta Channel who have turned the toggle on to receive the latest updates get a number of new bug fixes, including for a bug in which File Explorer Home crashed for some Insiders. There are four known issues in this build, including one in which File Explorer is very slow to close for some Insiders when closing using the X button. This may also affect the other title bar buttons. Get more info about Windows 11 Insider Preview Build 22635.5015.) Windows 11 Insider Preview Build 26120.3360 Release date: February 28, 2025 Released to: Dev and Beta Channels In this build, those in the Dev Channel who have turned the toggle on to receive the latest updates get two new features being gradually rolled out, including one in which Task Manager changes the way it calculates CPU utilization for the Processes, Performance, and Users pages. Task Manager will now use the standard metrics to display CPU workload consistently across all pages and aligning with industry standards and third-party tools. Also being added is the ability to share directly to apps that support sharing in Windows when right-clicking on local files in File Explorer or the desktop. Those in the Dev Channel who have turned the toggle on to receive the latest updates get several bug fixes, including for a bug which some people experienced Remote Desktop freezes on login, or frequent disconnect. There are 11 known issues in this build, including one in which Windows Recall is unable to automatically save snapshots, and the setting can’t be turned on in Settings. (Get more info about Windows 11 Insider Preview Build 26120.3360.) Windows 11 Insider Preview Build 27802 Release date: February 28, 2025 Released to: Canary Channel In this update, new battery icons in Windows 11 communicate the battery status of your PC with a quick glance. Key changes include colored icons to indicate charging states, simplified overlays that don’t block the progress bar, and an option to turn on battery percentage. The build also fixes several bugs, including one that was causing the login screen to crash when clicking the “sign-in options” link for some Insiders. There are six known issues in this build, including one in which if you are joining the Canary Channel on a new Copilot+ PC from the Dev Channel, Release Preview Channel, or retail, you will lose Windows Hello PIN and biometrics to sign into your PC. You should be able to re-create your PIN by clicking Set up my PIN. (Get more info about Windows 11 Insider Preview Build 27802.) Windows 11 Insider Preview Build 26120.3291 Release date: February 21, 2025 Released to: Dev and Beta Channels In this build, those with Copilot+ PCs can search photos saved in the cloud by using your own words to describe what you’re looking for in the Windows search box on the taskbar. Those in the Dev Channel who have turned the toggle on to receive the latest updates get several bugs fixed, including one in which switching languages crashed live captions if audio was playing or the microphone was enabled. There are 11 known issues in this build, including one in the Recall feature in which some users may see a message to “Make sure Recall is saving snapshots,” while the Settings page for Recall shows saving snapshots is enabled. Reboot your device to resolve this issue. (Get more info about Windows 11 Insider Preview Build 26120.3291.) Windows 11 Insider Preview Build 26100.3321 (KB5052093) Release date: February 18, 2025 Released to: Release Preview Channel This build gradually rolls out a number of new features, including one in which you can share files directly from a jump list on the taskbar, and another in which you can find out more information about a background image by hovering over the image or clicking the “Learn about this picture” icon. A variety of bug fixes are also being gradually rolled out, including one in which when you enter a URL in the File Explorer address bar, it might not go to the location. The build also immediately fixes a number of bugs, including one in which Remote Desktop stopped working. (Get more info about Windows 11 Insider Preview Build 26100.3321.) Windows 11 Insider Preview Build 26120.3281 Release date: February 14, 2025 Released to: Dev and Beta Channels In this build, those in the Dev Channel who have turned the toggle on to receive the latest updates have the ability to resume working on OneDrive files from your phone (iOS and Android) on your Windows 11 PC with a single click. In addition, when “Restore previous folder windows at logon” is enabled in File Explorer, you can now restore all the extra tabs that you previously had open in each File Explorer window. Those in the Dev Channel who have turned the toggle on to receive the latest updates get several bug fixes, including for a bug in which if you tried to reset your password from the login screen, it wouldn’t work due to an underlying crash. Another fix addresses a bug for users who have a Snapdragon-powered Copilot+ PC, in which File Explorer search was unresponsive and required a reboot to start working. There are 12 known issues in this build, including one in the Recall feature in which some users may see a message to “Make sure Recall is saving snapshots,” while the Settings page for Recall shows saving snapshots is enabled. Reboot your device to resolve this issue. (Get more info about Windows 11 Insider Preview Build 26120.3281.) Windows 11 Insider Preview Build 27788 Release date: February 5, 2025 Released to: Canary Channel This update includes the first in-box public preview of Windows MIDI Services, a complete rewrite of MIDI on Windows for musicians. Windows MIDI Services handles MIDI 2.0 and improves MIDI 1.0 implementation, with automatic translation between the two. It works on 64-bit operating systems on all supported processors, including Arm64. The build also gradually rolls out the ability to resume working on OneDrive files from your phone (iOS or Android) on your Windows 11 PC with a single click. The build also fixes several bugs, including one that prevented scanning apps from detecting a connected scanner. There are six known issues in this build, including one in which if you are joining the Canary Channel on a new Copilot+ PC from the Dev Channel, Release Preview Channel, or retail, you will lose Windows Hello PIN and biometrics to sign into your PC. You should be able to re-create your PIN by clicking Set up my PIN. (Get more info about Windows 11 Insider Preview Build 27788.) Windows 11 Insider Preview Build 22635.4870 Release date: February 3, 2025 Released to: Beta Channel In this build, IT administrators in the Beta Channel who have turned the toggle on to receive the latest updates as soon as they are available get a new group policy called “Disable Widgets On Lock Screen,” which allows them to disable lock screen widgets without disabling widgets elsewhere on PCs they manage. Those in the Beta Channel who have turned the toggle on to receive the latest updates get several bug fixes, including for a bug in which the Start menu crashed for some Insiders when they interacted with the letters in the apps list. Several bugs have been fixed for everyone in the Beta Channel, including one in which PCs did not recognize that USB cameras were on after installing the January 2025 security update. There are three known issues in this build, including one in which the home page of Settings may crash. If you are impacted by this, you should still be able to open specific Settings pages directly by searching for them from the taskbar. Get more info about Windows 11 Insider Preview Build 22635.4870.) Windows 11 Insider Preview Build 26120.3073 Release date: January 31, 2025 Released to: Dev and Beta Channels In this build, those who have Copilot+ PCs get a new feature in Windows Search, in which you can use your own words to find photos stored and saved in the cloud by describing what they are, such as “European castles” or “summer picnics.” In addition to photos stored locally on your Copilot+ PC, photos from the cloud will now show up in the search results as well. Exact matches for your keywords within the text of your cloud files will show in the search results. The build also includes changes being gradually rolled out for all Windows 11 PCs. Those in the Dev Channel who have turned the toggle on to receive the latest updates will see a Settings home page for commercial customers on PCs managed by an IT administrator. The feature will show some existing cards relevant to enterprise-managed PCs like “Recommended settings” and “Bluetooth devices,” as well as two new enterprise-specific device info and accessibility preferences cards. For commercial customers who also use their Microsoft account on their managed PC, there will also be a new accounts card indicating the presence of both work/school and Microsoft account types. Those in the Dev Channel who have turned the toggle on to receive the latest updates also get several bug fixes, including for a bug in which minimized File Explorer windows might not have rendered correctly when restored. Everyone in the Dev Channel gets several bug fixes, including for one in which the display of some games appeared oversaturated when you used Auto HDR. There are 18 known issues in this build, including one in the Recall feature in which some users may see a “Make sure Recall is saving snapshots” message while the Settings page for Recall shows saving snapshots is enabled. Reboot your device to resolve this issue. (Get more info about Windows 11 Insider Preview Build 26120.3073.) Windows 11 Insider Preview Build 27783 Release date: January 29, 2025 Released to: Canary Channel In this update, users signed into Windows with a Microsoft account will be able to view files that have been shared with the account, such as email, Teams chat, etc., in File Explorer. Commercial customers signed in with a Microsoft Entra ID account will also be able to view files that they have shared with others. You can access this feature by launching File Explorer Home and clicking on the ‘Shared’ tab item. The build also fixes several bugs, including one in which taskbar preview windows sometimes didn’t display when hovering over open apps in the taskbar. There are four known issues in this build, including one in which if you are joining the Canary Channel on a new Copilot+ PC from the Dev Channel, Release Preview Channel, or retail, you will lose Windows Hello PIN and biometrics to sign into your PC. You should be able to re-create your PIN by clicking Set up my PIN. (Get more info about Windows 11 Insider Preview Build 27783.) Windows 11 Insider Preview Build 22635.4805 Release date: January 24, 2025 Released to: Beta Channel In this build, those in the Beta Channel who have turned the toggle on to receive the latest updates as soon as they are available get a change to Snap in Windows 11 in which inline messaging will now appear when you accidentally invoke the Snap Bar when dragging an app to the top middle of your desktop or Snap Flyout when hovering over the Minimize or Maximize button of an app. This is designed to provide guidance on snapping app windows and educating users on the keyboard shortcuts for quickly snapping app windows in the future. This group also gets new keyboard shortcuts in Narrator scan mode for quickly jumping to list items and to the beginning or end of large elements such as tables or lists. These changes are gradually rolling out. There are five known issues in this build, including one in which the Home page "
