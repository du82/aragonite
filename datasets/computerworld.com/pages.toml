["https://www.computerworld.com/article/1682225/windows-10-a-guide-to-the-updates.html"]
title = "Windows 10: A guide to the updates – Computerworld"
description = "Preston Gralla is a contributing editor for Computerworld, a blogger for ITworld, and the author of more than 45 books, including NOOK Tablet: The Missing Manual (O'Reilly 2012) and How the Internet Works (Que, 2006)."
full_description = "Here's what you need to know about each update to the current version of Windows 10 as it's released from Microsoft. Now updated for KB5052077 Preview, released on Feb. 25, 2025. Credit: Microsoft The launch of a major Windows 10 update isn’t the end of a process — it’s really just the beginning. As soon as one of Microsoft’s feature updates (such as Windows 10 version 22H2) is released, the company quickly gets to work on improving it by fixing bugs, releasing security patches, and occasionally adding new features. In this story we summarize what you need to know about each update released to the public for the most recent versions of Windows 10 — versions 22H2 and 21H2. (Microsoft releases updates for those two versions together.) For each build, we’ve included the date of its initial release and a link to Microsoft’s announcement about it. The most recent updates appear first. For details about how to install and manage Windows updates, see “How to handle Windows 10 and 11 updates.” If you’re looking for information about Insider Program previews for upcoming feature releases of Windows 10, see “Windows 10 Insider Previews: A guide to the builds.” Updates to Windows 10 versions 21H2 and 22H2 KB5052077 (OS Build 19045.5555) Preview Release date: February 25, 2025 This build fixes several bugs, including one in which the OpenSSH (Open Secure Shell) service failed to start, preventing SSH connections. There are two known issues in this build, including one in which certain Citrix components installed might be unable to complete installation of the January 2025 Windows security update. This issue was observed on devices with Citrix Session Recording Agent (SRA) version 2411. (Get more info about KB5052077 Preview.) KB5051974 (OS Builds 19044.5487 and 19045.5487) Release date: February 11, 2025 The update has a wide variety of security updates. For details, see Microsoft’s Security Update Guide and February 2025 Security Updates. What IT needs to know: Because this is a security update, it should be applied relatively soon. Over the next few weeks, check for reports about problematic issues, and if all seems well, apply the update. There are three known issues in this build, including one in which devices that have certain Citrix components installed might be unable to complete installation of the January 2025 Windows security update. (Get more info about KB5051974.) KB5050081 (OS Build 19045.5440) Preview Release date: January 28, 2025 This build includes the new version of the Outlook app. IT admins can learn how to manage the new version at the Microsoft Learn page “Control the installation and use of new Outlook.” The build also fixes a variety of bugs, including one in which the Capture Service and Snipping Tool stopped responding when you pressed Windows logo key + Shift + S several times while Narrator was on. There are two known issues in this build, including one in which the OpenSSH (Open Secure Shell) service fails to start, preventing SSH connections. In the other one, PCs that have certain Citrix components installed might be unable to complete installation of the January 2025 Windows security update. (Get more info about KB5050081 Preview.) KB5049981 (OS Builds 19044.5371 and 19045.5371) Release date: January 14, 2025 The update has a wide variety of security updates. For details, see Microsoft’s Security Update Guide and January 2025 Security Updates. What IT needs to know: Because this is a security update, it should be applied relatively soon. Over the next few weeks, check for reports about problematic issues, and if all seems well, apply the update. There are two known issues in this build, including one in which devices that have certain Citrix components installed might be unable to complete installation of the January 2025 Windows security update. (Get more info about KB5049981.) KB5048652 (OS Builds 19044.5247 and 19045.5247) Release date: December 10, 2024 The update has a wide variety of security updates. For details, see Microsoft’s Security Update Guide and December 2024 Security Updates. What IT needs to know: Because this is a security update, it should be applied relatively soon. Over the next few weeks, check for reports about problematic issues, and if all seems well, apply the update. (Get more info about KB5048652.) KB5046714 (OS Build 19045.5198) Preview Release date: November 21, 2024 This build fixes a variety of bugs, including one in which Win32 shortcuts did not back up to the cloud. (Get more info about KB5046714 Preview.) KB5046613 (OS Builds 19044.5131 and 19045.5131) Release date: November 12, 2024 This update fixes a bug in which some games did not start or stopped responding after you installed KB5044384. This occurred because some games use a third-party DRM component that are not compatible with that update. This update makes changes to support those games while the game developers address the DRM issue. The update also has a wide variety of security updates. For details, see Microsoft’s Security Update Guide and November 2024 Security Updates. What IT needs to know: Because this is a security update, it should be applied relatively soon. Over the next few weeks, check for reports about problematic issues, and if all seems well, apply the update. (Get more info about KB5046613.) KB5045594 (OS Build 19045.5073) Preview Release date: October 22, 2024 This build starts the rollout of the new account manager on the Start menu that makes it easy to view your account and access account settings. To change to a different user, select the ellipsis (…) next to “Sign out.” Not everyone will see this change yet, because it’s rolling out gradually. The build also fixes a variety of bugs, including one in which a vmswitch triggers a stop error. This occurs when you use Load Balancing and Failover (LBFO) teaming with two virtual switches on a virtual machine (VM). In this case, one virtual switch uses single root Input/Output virtualization (SR-IOV). (Get more info about KB5045594 Preview.) KB5044273 (OS Builds 19044.5011 and 19045.5011) Release date: October 8, 2024 This update has a wide variety of security updates. For details, see Microsoft’s Security Update Guide and October 2024 Security Updates. What IT needs to know: Because this is a security update, it should be applied relatively soon. Over the next few weeks, check for reports about problematic issues, and if all seems well, apply the update. (Get more info about KB5044273.) KB5043131 (OS Build 19045.4957) Preview Release date: September 24, 2024 This build fixes several bugs, including one in which playback of some media might have stopped when you use certain surround sound technology, and another in which Windows server stopped responding when you used apps like File Explorer and the taskbar. There is one known issue in this update, in which you might be unable to change your user account profile picture. (Get more info about Windows 10 22H2 KB5043131 Preview). KB5043064 (OS Builds 19044.4894 and 19045.4894) Release date: September 10, 2024 This update has a wide variety of security updates. For details, see Microsoft’s Security Update Guide and September 2024 Security Updates. What IT needs to know: Because this is a security update, it should be applied relatively soon. Over the next few weeks, check for reports about problematic issues, and if all seems well, apply the update. (Get more info about KB5043064.) KB5041582 (OS Build 19045.4842) Preview Release date: August 29, 2024 This build fixes several bugs, including one in which when a combo box had input focus, a memory leak could occur when you closed that window. There is one known issue in this update, in which you might be unable to change your user account profile picture. (Get more info about KB5041582 Preview.) KB5041580 (OS Builds 19044.4780 and 19045.4780) Release date: August 13, 2024 This release has a wide variety of security updates. For details, see Microsoft’s Security Update Guide and August 2024 Security Updates. What IT needs to know: Because this is a security update, it should be applied relatively soon. Over the next few weeks, check for reports about problematic issues, and if all seems well, apply the update. (Get more info about KB5041580.) KB5040525 (OS Build 19045.4717) Preview Release date: July 23, 2024 This build fixes a variety of bugs, including one in which the Transmission Control Protocol (TCP) send code caused systems to stop responding during routine tasks, such as file transfers. This issue led to an extended send loop. There is one known issue in this update, in which you might be unable to change your user account profile picture. (Get more info about KB5040525 Preview.) KB5040427 (OS Builds 19044.4651 and 19045.4651) Release date: July 9, 2024 This update has a wide variety of security updates. For details, see Microsoft’s Security Update Guide and July 2024 Security Updates. What IT needs to know: Because this is a security update, it should be applied relatively soon. Over the next few weeks, check for reports about problematic issues, and if all seems well, apply the update. There are two known issues in this build, including one in which you might be unable to change your user account profile picture. (Get more info about KB5040427.) KB5039299 (OS Build 19045.4598) Preview Release date: June 25, 2024 This build fixes a variety of bugs, including one in which apps’ jump lists on the taskbar sometimes failed, and another in which systems didn’t resume from hibernation after BitLocker was turned off. There are four known issues in this update, including one in which Windows devices using more than one monitor might experience issues with desktop icons moving unexpectedly between monitors or have other icon alignment issues when attempting to use Copilot in Windows. (Get more info about KB5039299 Preview.) KB5039211 (OS Builds 19044.4529 and 19045.4529) Release date: June 11, 2024 This build has a wide variety of security updates. For details, see Microsoft’s Security Update Guide and June 2024 Security Updates. What IT needs to know: Because this is a security update, it should be applied relatively soon. Over the next few weeks, check for reports about problematic issues, and if all seems well, apply the update. There are two known issues in this build, including one in which Copilot in Windows is not currently supported when your taskbar is located vertically on the right or left of your screen. (Get more info about KB5039211.) KB5037849 (OS Build 19045.4474) Preview Release date: May 29, 2024 This build fixes a variety of bugs, including one in which devices could not authenticate a second Microsoft Entra ID account, and another in which TWAIN drivers stopped responding when used in a virtual environment. There are four known issues in this update, including one in which Windows devices using more than one monitor might experience desktop icons moving unexpectedly between monitors or have other icon alignment issues when attempting to use Copilot in Windows. (Get more info about KB5037849 Preview.) KB5037768 (OS Builds 19044.4412 and 19045.4412) Release date: May 14, 2024 This update fixes a bug that caused VPN connections to fail. In addition, it has a wide variety of security updates. For details, see Microsoft’s Security Update Guide and May 2024 Security Updates. What IT needs to know: Because this is a security update, it should be applied relatively soon. Over the next few weeks, check for reports about problematic issues, and if all seems well, apply the update. There are four known issues in this build, including one in which Copilot in Windows is not currently supported when your taskbar is located vertically on the right or left of your screen. (Get more info about KB5037768.) KB5036979 (OS Build 19045.4355) Preview Release date: April 23, 2024 With this build, you will start getting account-related notifications for Microsoft accounts in Settings > Home. The account also backs up all your account-related data and helps you to manage your subscriptions. The update also makes the Widgets on the lock screen more reliable. A number of bugs have also been fixed, including one in which Windows Local Administrator Password Solution’s Post Authentication Actions (PAAs) did not occur at the end of the grace period. Instead, they occurred at restart. (Get more info about KB5036979 Preview.) KB5036892 (OS Builds 19044.4291 and 19045.4291) Release date: April 9, 2024 This build has a wide variety of security updates. For details, see Microsoft’s Security Update Guide and April 2024 Security Updates. What IT needs to know: Because this is a security update, it should be applied relatively soon. Over the next few weeks, check for reports about problematic issues, and if all seems well, apply the update. There are two known issues in this build, including one in which Copilot in Windows is not currently supported when your taskbar is located vertically on the right or left of your screen. (Get more info about KB5036892.) KB5035941 (OS Build 19045.4239) Preview Release date: March 26, 2024 In this build, Windows Hello for Business admins can now use mobile device management to turn off the prompt that appears when users sign in to an Entra-joined machine. To do it, turn on the “DisablePostLogonProvisioning” policy setting. After a user signs in, provisioning is off for Windows 10 and Windows 11 devices. The update also update improves the Remote Desktop Session Host. You can now set up its “clipboard redirection” policy to work in a single direction from the local computer to the remote computer. You can also reverse that order. A number of bugs have also been fixed, including one in which a network resource could not be accessed from a Remote Desktop session when the Remote Credential Guard feature was turned on, and another that affected the time service, in which the Windows Settings app did not match what IT admins configured using MDM or a Group Policy Object. (Get more info about KB5035941 Preview.) KB5035845 (OS Builds 19044.4170 and 19045.4170) Release date: March 12, 2024 This build has a wide variety of security updates. For details, see Microsoft’s Security Update Guide and March 2024 Security Updates. What IT needs to know: Because this is a security update, it should be applied relatively soon. Over the next few weeks, check for reports about problematic issues, and if all seems well, apply the update. There are two known issues in this build, including one in which Copilot in Windows is not currently supported when your taskbar is located vertically on the right or left of your screen. (Get more info about KB5035845.) KB5034843 (OS Build 19045.4123) Preview Release date: February 29, 2024 In this update, using Windows share, you can now directly share URLs to apps like WhatsApp, Gmail, Facebook, and LinkedIn. Sharing to X (formerly Twitter) is coming soon. The update also fixes a variety of bugs, including "
