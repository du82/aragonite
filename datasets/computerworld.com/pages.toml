title = "Google co-founder: Be in the office every weekday, work 60 hours a week – Computerworld"
description = "Less work at home and longer days in the office will put Google at the forefront of AI development, says Sergey Brin. His message was aimed at team working on the company's AI model Gemini."
full_description = "Less work at home and longer days in the office will put Google at the forefront of AI development, says Sergey Brin. His message was aimed at team working on the company's AI model Gemini. Credit: Reuters/Stephen Lam Google co-founder Sergey Brin sent an internal message Wednesday to the group working on the company’s AI model Gemini. In the message, Brin wrote that Google can become a leader in AI development — provided that employees work more. “I recommend being in the office at least every weekday,” Brin said in a message quoted by The New York Times. “Sixty hours a week is the best for productivity.” Brin sees an increased risk of burnout when working more than 60 hours a week, but at the same time criticized employees who he says do not contribute enough. “Some people work less than 60 hours and some don’t put in more effort than they have to,” he wrote. “The latter are not only unproductive, but can also be very demoralizing for everyone else.” It is not clear from the report whether Brin himself is in the office at least every weekday and works 60 hours a week. According to the newspaper, Brin’s statement should not affect Google’s work-from-home policy, which states that employees must be in the office at least three days per week. Related content Tip A must-try Android email upgrade By JR Raphael Feb 26, 2025 14 mins Android Gmail Google News Zoom, Google step up their AI game with new videoconferencing features By Agam Shah Feb 20, 2025 3 mins Generative AI Google Zoom Video Communications News Google’s new AI co-scientist aims to speed up the scientific discovery process By Gyana Swain Feb 20, 2025 5 mins Google Other Sections Podcasts Videos Resources Events Spotlight: Prioritizing your AI investments SUBSCRIBE TO OUR NEWSLETTER From our editors straight to your inbox Get started by entering your email address below. Please enter a valid email address Subscribe News Zoom, Google step up their AI game with new videoconferencing featu