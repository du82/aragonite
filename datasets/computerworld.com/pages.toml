full_description = "IDC expects global sales of smartphones to increase by 2.3% this year compared to 2024. Credit: Adam Kovacs - shutterstock.com Global sales of smartphones will increase by 2.3% in 2025 compared to last year, according to a new report from IDC. Android-based phones are expected to account for most of the increase, including in China, where sales are expected to rise by 5.6% year over year. Apple’s smartphone sales are expected to dip in China, but rise elsewhere. “While iOS will decline 1.9% in China this year due to ongoing challenges, globally it is forecast to increase 1.8% thanks to strong growth in the US, Apple’s largest market, coupled with rapid growth of 18% and 9% [year over year] in emerging markets like India and Indonesia.” Apple has made a push in recent years to build a market presence in India, in particular. Over the next five years, IDC expects sales to remain high, but the average price of a smartphone is expected to slip from $434 this year to $424 in 2029. Related content News Analysis Is Apple almost ready for foldable iPhones? By Jonny Evans Feb 25, 2025 5 mins Apple Smartphones iPhone Feature Everything we know about Apple’s C1 5G modem in iPhone 16e By Jonny Evans Feb 20, 2025 10 mins 5G Apple iPhone Tip 22 new tricks for your Google Pixel Clock app By JR Raphael Feb 19, 2025 23 mins Google Small and Medium Business Smartphones Other Sections Podcasts Videos Resources Events Spotlight: Prioritizing your AI investments SUBSCRIBE TO OUR NEWSLETTER From our editors straight to your inbox Get started by entering your email address below. Please enter a valid email address Subscribe News Analysis Is Apple almost ready for foldable iPhones? By Jonny Evans Feb 25, 2025 5 mins Apple Smartphones iPhone Feature Everything we know about Apple’s C1 5G modem in iPhone 16e By Jonny Evans Feb 20, 2025 10 mins 5G Apple iPhone Tip 22 new tricks for your Google Pixel Clock app By JR Raphael Feb 19, 2025 23 mins Google Small and Medium Business Smartphones"
