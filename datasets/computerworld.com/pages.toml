["https://www.computerworld.com/article/3832819/atlassian-refocuses-trello-on-individual-task-management.html"]
title = "Atlassian refocuses Trello on individual task management – Computerworld"
description = "The company aims to move away from a focus on complex project management in favor of more individual productivity."
full_description = "The company aims to move away from a focus on complex project management in favor of more individual productivity. Credit: Trello Atlassian’s Trello project management tool has received a facelift with features designed to organize meetings and ideas in a cohesive manner. The new features include an inbox, a planner, and a mix of add-ons and generative AI (genAI) tools to help customers summarize emails, organize meetings, and quickly sort through the barrage of pop-ups appearing in the software. “In the past, Trello had kind of veered in the direction of project management because you were planning — and helping people plan — bigger and more complex projects. Now we are redirecting the focus on an individual task management,” said Gaurav Kataria, head of product for Trello at Atlassian. With the update, Trello focused on simplicity, ease of use, and helping individual users be more productive, Kataria said. The company highlighted two specific features: Inbox and Planner, which are currently in beta. The AI-based inbox, for instance, serves to collect and summarize key action points and organizes to-do lists collected from a variety of collaborative and productivity apps. Planner serves to coordinate scheduling and tasks. The new features are built atop current features that include to-do lists and cards, which help users organize and complete projects. This represents a big shift for Trello, as the current feature set “has been pretty much the same for the last 14 years,” Kataria said. A built-in large-language model (LLM) parses messages and can summarize key action items and dates, which are then organized as a to-do list in the Inbox. Users can read those summaries in the inbox, then use the Planner feature to organize meetings in the calendar. For example, knowledge workers are often drowning in emails, Slack messages, Microsoft Team messages and notifications that come from applications that might include Salesforce and Workday. “The most common use cases — just forward everything on to one single to-do list and have the AI summarize it. By far, this is the killer use case,” Kataria said. There are many ways to forward a message to Trello’s inbox. For example, a user can forward a meeting reminder email on Google to Trello, which then adds it. A Slack message about a meeting can be tagged and saved to the Inbox. Apple’s Siri can also be used to send notes or reminders to the inbox. The new features will become generally available in six weeks to paid users. They will not be available to freemium users. Atlassian is also known for Jira, its enterprise product management tool. Companies can import data from Jira into Trello and vice versa. “A lot of teams have graduated from Trello to Jira for project management needs, but use Trello for individual productivity. That’s where there’s a clear separation between Trello and Jira. But at the same time, they…nicely integrate with each other,” Kataria said. Trello’s structural approach and interface make it easy to manage work and serves as a major on-ramp to other Atlassian products, said Wayne Kurtzman, research vice president of social, communities and collaboration at IDC. “Making Trello a personal work hub shows promise, as long as features and interface evolve with their technical audience,” Kurtzman said. In addition to other vendors in the collaborative work management segment, challenges could come from unexpected places as competitors focus on workflow automation. “Atlassian has to balance the expectations of their Trello base with the desire to onboard them to Jira,” Kurtzman said. “If done with care, making Trello a personal product with team abilities could accomplish this.” Related content News Google co-founder: Be in the office every weekday, work 60 hours a week By Mikael Markander Feb 28, 2025 2 mins Generative AI Google Remote Work Feature Just what is an 'IT worker' now? The definition is changing By Lucas Mearian Feb 27, 2025 11 mins Developer Generative AI IT Jobs News Alibaba open sources its video-generation AI model By Agam Shah Feb 26, 2025 4 mins Generative AI Video How-to 8 ways to make Windows 11 work like Windows 10 By Chris Hoffman Feb 26, 2025 9 mins Desktop PCs Microsoft Windows 10 Other Sections Podcasts Videos Resources Events Spotlight: Prioritizing your AI investments SUBSCRIBE TO OUR NEWSLETTER From our editors straight to your inbox Get started by entering your email address below. Please enter a valid email address Subscribe"
