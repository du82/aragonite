["https://www.computerworld.com/article/3831727/as-microsoft-innovates-apple-stagnates.html"]
title = "As Microsoft innovates, Apple stagnates – Computerworld"
description = "Preston Gralla is a contributing editor for Computerworld, a blogger for ITworld, and the author of more than 45 books, including NOOK Tablet: The Missing Manual (O'Reilly 2012) and How the Internet Works (Que, 2006)."
full_description = "Not so long ago, Apple was the company rolling out cool new products that upended the way people use technology. My, how times have changed. Credit: WoodsyPhotos / Shutterstock Microsoft and Apple were once the yin and yang of the tech world. Microsoft was dull and plodding, milking buggy, barely-good-enough-for-prime-time Windows for tremendous profits, thanks to a worldwide operating system monopoly. The company was incapable of creating new, innovative products, and relied on sharp-elbowed (and potentially illegal) business practices to stay atop the tech world. Apple was its polar opposite. Under Steve Jobs’ out-of-the-box thinking and obsessive attention to the smallest details, it released what seemed an unending stream of beautifully designed products that changed the way the world uses technology: the Mac, iPhone, iPod and iPad. That was then. These days, the two companies have reversed roles. If you’re looking for innovation, look to Microsoft. Meanwhile, Apple stagnates, milking old products for new money. For evidence, you need only look at a single day – Feb. 19, 2025. On that day, Microsoft announced a breakthrough in quantum computing, based on a branch of physics known as quantum physics. (It’s beyond the scope of this article to detail exactly how quantum computing works, but you can get some details in Microsoft’s announcement.) The technology will eventually be able to solve technological, mathematical and scientific problems that can’t be cracked right now. When it’s ready for prime time, it will likely be able to supercharge AI development and usage. Microsoft has been working on quantum computing since the early 2000s and will continue spend money on it. And while it will take years to come to fruition, it’s one of the few technologies that has the potential to change the world. On the same day Apple announced…drumroll, please!…a cheaper version of the iPhone, the iPhone 16e, a successor to the iPhone SE. There’s no new technology in it, aside from the first modem built by Apple. On second thought, hold the drumroll. How did we get here? Why is the tech world looking to Microsoft for the newest technologies like AI and quantum computing, and looking to Apple for a cheaper iPhone? To understand the present and predict the future, you need to know the past. So, we’ll start out by looking at both companies’ earlier days. A look at technology’s past It’s said that to a man with a hammer, everything in the world looks like a nail. In the old days of Microsoft, Windows was its hammer. Its competitors were the nails. One by one Microsoft used Windows to pound them into submission. Lotus, the maker of Lotus 1-2-3 — the world’s most popular spreadsheet — gone. Harvard Graphics, maker of the Harvard Graphics —the world’s most popular presentation software — gone. WordPerfect, maker of the world’s most popular word processor WordPerfect, barely even a shell of its former self. Many other competitors were crushed by Microsoft as well. The strategy worked for years…, until it didn’t. The world changed, and Microsoft didn’t change along with it. Its attempt to build a mobile operating system bearing the Windows name cost the company billions of dollars before CEO Satya Nadella killed it. Its other attempts at getting into new markets, like the laughably bad Zune music player to compete with the iPod, went off the rails. The Internet came along, and Microsoft didn’t pivot quickly enough to it because it was still focused on Windows, allowing the rise of Google, Meta and myriad other companies. As for Apple, under Steve Jobs it seemingly did everything right. It focused on new technologies, each new product beautifully designed and built — and released before people even knew they wanted them, creating entirely new markets. Jobs was an impatient innovator, and he refused to rest on his laurels or repeat the past. Something new was always in the works. So, what happened? At Microsoft, Bill Gates and Steve Ballmer, architects of Microsoft’s rise to power, left the company in Nadella’s hands. He wasn’t wed to the company’s past and didn’t believe Windows was the solution to every tech problem. He’s been a quiet innovator. Under his leadership, cloud computing, not Windows, became the focus. Then Nadella turned to AI. And all along, he continued to spend money on quantum computing. The company now lives on the cutting edge. After Jobs died in 2011, Apple was never the same. Tim Cook took over as CEO. He’s been a brilliant manager, growing the company to the point it’s now valued at $3.7 trillion, the largest in the world. But is he an innovator? No. The Apple Watch and AirPods launched under his watch might bring in nice amounts of revenue. But they’re far from being breakthroughs. A look to the future What’s next for both companies when it comes to innovation? At Microsoft it’s clear. The company has become an AI company and it’s not looking back. It’s going to continue to pour money into quantum computing. I don’t know what else it’s cooking up in its labs, but I’m sure it’s something. As for Apple, it’s having a hard time catching up with Microsoft and the rest of the industry when it comes to innovation. And it’s doing a particularly bad job in AI. Apple Intelligence, the company’s answer to Microsoft’s and other companies’ generative AI (genAI) efforts, has floundered badly. OpenAI’s ChatGPT was released more than two years ago, and Microsoft Copilot, based on ChatGPT, was released more than a year ago. Apple Intelligence still isn’t here, and it’s falling behind schedule. It may not be released until the WWDC (Apple’s annual developer conference), and possibly not even then, a full year after it was first announced. When it’s released, it will still lag badly behind its genAI competitors. Bloomberg reports that an upgrade to make Siri “more conversational and a closer match for ChatGPT” has been postponed to 2026. That’s about a century in AI time. By then, the competitors will be several generations ahead of Apple. The upshot? Apple is doing a great job of milking existing products, but a terrible job of innovation, while Microsoft continues to innovate. And there’s no sign of that changing anytime soon. Related content News R.I.P. Skype: 2003-2025 By Agam Shah Feb 28, 2025 3 mins Enterprise Applications Microsoft Microsoft Teams Feature Windows 11 Insider Previews: What’s in the latest build? By Preston Gralla Feb 28, 2025 66 mins Microsoft Small and Medium Business Windows 11 How-to 8 ways to make Windows 11 work like Windows 10 By Chris Hoffman Feb 26, 2025 9 mins Desktop PCs Microsoft Windows 10 Other Sections Podcasts Videos Resources Events Spotlight: Prioritizing your AI investments SUBSCRIBE TO OUR NEWSLETTER From our editors straight to your inbox Get started by entering your email address below. Please enter a valid email address Subscribe"
