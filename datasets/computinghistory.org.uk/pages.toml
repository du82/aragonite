["http://www.computinghistory.org.uk/pages/38163/Donate-Items"]
title = "Donate Items - Computing History"
description = "Donations The bedrock of our work here at the Centre for Computing History is our collection. Since we moved to our current Cambridge site in 2013, we have acquired a fantastic range of objects, an..."
full_description = "The bedrock of our work here at the Centre for Computing History is our collection. Since we moved to our current Cambridge site in 2013, we have acquired a fantastic range of objects, and we have you and hundreds of other donors and visitors to thank for it. If you would like to donate an item to the Centre's collection, please contact us at collection@computinghistory.org.uk. . ****It is imperative that contact is made via email first and not by phone, as we need a clear paper trail for all donated items**** Please let us know if you are able to deliver the items to us in Cambridge. We can only travel to acquire very desirable objects. Please note that we do not accept donations brought to the Centre without first being confirmed beforehand. This rule will only be changed for items of exceptional interest. Do your best to explain to us why your object is so special! Does it have a fascinating story attached? Does it represent a technological breakthrough? Let us know. Please do NOT send us items in the post without agreeing it with us first. Even if you acknowledge that we can do what we want with the items, such donations represent additional archival work that takes up valuable staff and volunteer time. It is very helpful for us to have an inventory of objects when donations come in. For guidance on preparing an inventory, please read this document. As a non-profit organisation, we need monetary donations to enable this very exciting initiative to proceed and to fill gaps in our collection. If you feel that you would like to help us financially just click on 'donate' at the top of this page. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed."
