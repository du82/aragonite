["http://www.computinghistory.org.uk/det/32765/Nvidia%20announces%20NV1"]
title = "Nvidia announces NV1 - Event  - Computing History"
description = "Nvidias first product was the NV1, a multimedia PCI card which was sold under the name Diamond Edge 3D .Nvidia's first product was the NV1, a multimedia PCI card which was sold under the name Diamo..."
full_description = '''Nvidia's first product was the NV1, a multimedia PCI card which was sold under the name "Diamond Edge 3D". It was announced in May 1995 and released in November 1995. The NV1 was the first mainstream multimedia processor. It featured a Sega Saturn compatible joypad port, 32-channel audio, and 3D graphics using quadratic texture mapping. Several Sega Saturn games were ported to the NV1, including NASCAR Racing, Panzer Dragoon, and Virtua Fighter, which was the first 3D game to run on the card. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team. All individual donations can also be Gift Aided, allowing us to claim an extra 25p on every £1 donated. Visit our Gift Aid page to complete a Gift Aid declaration. Please be assured that any amount you feel able to donate will make an immediate and significant impact.'''
