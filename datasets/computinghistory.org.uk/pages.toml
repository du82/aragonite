["http://www.computinghistory.org.uk/det/32766/Nvidia%20releases%20GeForce%20256"]
title = "Nvidia releases GeForce 256 - Event  - Computing History"
description = "Released on 11th October 1999, the GeForce 256 was the first product released by Nvidia under the GeForce brand.Released on 11th October 1999, the GeForce 256 was the first product released by Nvid..."
full_description = '''Released on 11th October 1999, the GeForce 256 was the first product released by Nvidia under the GeForce brand. It was described by Nvidia as the world's first GPU, or Graphics Processing Unit. Nvidia's definition at the time was "a single-chip processor with integrated transform, lighting, triangle setup/clipping, and rendering engines that is capable of processing a minimum of 10 million polygons per second." Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team. All individual donations can also be Gift Aided, allowing us to claim an extra 25p on every £1 donated. Visit our Gift Aid page to complete a Gift Aid declaration. Please be assured that any amount you feel able to donate will make an immediate and significant impact.'''
