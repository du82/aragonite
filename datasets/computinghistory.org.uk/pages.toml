full_description = '''On 20th February 2014, Facebook bought mobile messaging service WhatsApp in a deal worth $19bn. The purchase was the social networking company's largest acquisition to date. WhatsApp was popular with people looking to avoid text messaging charges. At the time, WhatsApp had more than 400m users around the world and claimed to be adding more than 1 million new registered users a day. Mark Zuckerberg, the founder of Facebook, described five-year-old WhatsApp as an "incredibly valuable" service that was well on its way to connecting 1 billion people around the world. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team. All individual donations can also be Gift Aided, allowing us to claim an extra 25p on every £1 donated. Visit our Gift Aid page to complete a Gift Aid declaration. Please be assured that any amount you feel able to donate will make an immediate and significant impact.'''
