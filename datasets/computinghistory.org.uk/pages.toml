full_description = "We need help to stay on top of social media posts about our work. Our online presence is important to us and we need to promote our events and our important collection to drive both physical footfall to the museum and to increase engagement with our collection for our digital audiences. RequirementsJust the ability to create fresh and impactful posts with consistency and attention to detail! If you have a flair for creating exciting content or perhaps you're looking to break into a new career in social media marketing, we'd love to hear from you. We primarily use Facebook, X (formerly Twitter), Instagram and LinkedIn but we'd be open to using other platforms too.Come and Join the Team!We are a relaxed and welcoming team. The working atmosphere is fun, relaxed but professional. Tea and coffee is available for free from our 'Pac Lunch Shop' and as a volunteer you are welcome to all of our special events for free. LogisticsIt would be great if you could come and work with us in person, but you may be able to do some work remotely. TimeWe are open from Wednesday to Sunday, 10am to 5pm, every week throughout the year and every day in most school holidays. Times are flexible though, especially for remote work. The amount of time you can offer us is entirely up to you, and it need not be the same each week. All we ask is that you let us know in advance.How to ApplyAs with all of our volunteer roles, if you are interested in volunteering your time and playing a vital part in our museum, email us with your details, what role you'd like to apply for and what makes you ideal for this role. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed."
