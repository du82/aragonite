["http://www.computinghistory.org.uk/det/34794/The%20Magnavox%20Odyssey,%20the%20first%20video%20game%20console,%20is%20demonstrated"]
title = "The Magnavox Odyssey, the first video game console, is demonstrated - Event  - Computing History"
description = "The Magnavox Odyssey was the first home video game console.The Magnavox Odyssey was the first home video game console. It was first demonstrated on May 24, 1972 and released in September the same y..."
full_description = '''The Magnavox Odyssey was the first home video game console. It was first demonstrated on May 24, 1972 and released in September the same year. In 1951 Ralph H Baer came up with the idea of a home video game system, and in the late 1960s developed the idea into a set of designs. One of these designs, nicknamed the "Brown Box" would go on to become the Odyssey after being pitched to Magnavox. The initial design featured a row of switches that could be turned on and off to change the gameplay, replicating games such as Tennis, Volleyball or Hockey. These were later changed to different cartridges for each game. The console was only moderately successful. It wasn't until the release of Atari's Pong that the public started taking notice of the new video game console industry. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team. All individual donations can also be Gift Aided, allowing us to claim an extra 25p on every £1 donated. Visit our Gift Aid page to complete a Gift Aid declaration. Please be assured that any amount you feel able to donate will make an immediate and significant impact.'''
