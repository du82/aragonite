["https://www.computinghistory.org.uk/pages/36536/Archive-Home"]
title = "Archive Home - Computing History"
description = "An interview with Professor Andy Hopper of Cambridge Computer Lab. Filmed on 26/02/2010. Jason Fitzpatrick of The Centre for Computing History talks to Andy about his involvement in computing and the projects he has worked on."
full_description = "This is the video archive from our lottery-funded Viva Computer! project. The archive is a valuable resource for people interested in computing history. Whilst the main focus of this project is collecting oral histories relating to home computing in Cambridge from 1960, over time as the archive builds we hope to increase the scope of our collection. Supported by the Heritage Lottery Fund, this project is aimed at capturing the stories of people in tech. This focus on not just the technological breakthroughts, but the past memories and capturing them for the enjoyment of others is what makes this project so important. Below you can find some of the videos we have already created. An interview with Professor Andy Hopper of Cambridge Computer Lab. Filmed on 26/02/2010. Jason Fitzpatrick of The Centre for Computing History talks to Andy about his involvement in computing and the projects he has worked on. Jason Fitzpatrick of The Centre for Computing History talks to Chris Turner about his involvement with Acorn and the BBC Micro computer. An interview with Andrew Oliver about his, and his brother Philip, early career in the video game industry. An interview with Dan Crow who worked at Apple as tech lead for the Apple Media Tool in the early nineties. Dan was also responsible (along with Steve Jobs) for the brushed aluminium feel of the Quicktime media player! Dan talks about the what it was like to work at Apple during turbulent years and the return of Steve Jobs to Apple as CEO. Some fantastic advice from game industry legend, John Romero, about how to get into creating your own games for mobile devices. John is best known as one of the co-founders of id Software and designer of groundbreaking games like Wolfenstein 3D, Doom and Quake. An interview with John Steele who worked at Ferranti from 1963 to 1970. John talks about the Argus 100 computer and what it was like to work at Ferranti. Dr. Peter Cunningham talks about his experiences with micro computers in education throughout the eighties and nineties. Peter talks about Acorn BBC Micro computers, The Turtle, RM Nimbus computers and how they have changed education."
year_published = 2025
year_updated = 2025
