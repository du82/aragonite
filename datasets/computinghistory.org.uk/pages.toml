["https://computinghistory.org.uk/pages/37731/How-To-Find-Us"]
title = "How To Find Us - Computing History"
description = "How To Find Us We’re so excited that you’re visiting our museum! You’re going to love it : The Centre for Computing History has parking immediately outside our building. However, ..."
full_description = "The Centre for Computing History has parking immediately outside our building. However, the museum does get busy and the car park can fill up so please be aware that you may need to find parking near by. From the A1134 (Newmarket Road) turn onto Coldham's Lane. Go straight over the roundabout (the Beehive Centre should be on your right) and over the railway bridge. Immediately after the bridge there is a very sharp, double back left hand turn onto Coldham's Road. Take that turn into the commercial estate. From the A1134 (Barnwell Road / Brooks Road) take either the first exit (from Brooks Road) or the third exit (from Barnwell Road) up Coldham's Lane. Continue to the traffic lights at the junction with Cromwell Road (Coldham's Common will be on your right). Straight ahead is a railway bridge. Immediately before the bridge there is a shallow right hand turn onto Coldham's Road. Take that turn into the commercial estate. Edmundson Electrical and Topps Tiles are on that junction. Once you have taken the turn onto the commercial estate, follow the road round to the right and you will soon see a level crossing.The turning into our court is immediately before the railway crossing. DO NOT go over the railway crossing! If you do miss this turning, do not reverse over the railway crossing. Carry on and turn around in a safe place. The number 17 bus from the City Centre towards Fulbourn passes down Coldham's Lane, very close to our location. However, it only runs every two hours. The nearest bus stop to us is close to the Coldhams Lan play area. The Centre is a 30 minute walk from Cambridge Central station and a 36 minute walk from Cambridge North station. You can also take a bus into the centre of the city from just outside the station and then follow the instructions in the 'By Bus' section above. Follow the instructions on the rest of this page to reach the Centre on foot. There are pavements along all of the roads described. The only section with no pavements is on the trading estate for 50 yards just outside our gates."
