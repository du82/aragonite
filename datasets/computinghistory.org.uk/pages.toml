["http://www.computinghistory.org.uk/det/15581/Commodore%20releases%20the%20Amiga"]
title = "Commodore releases the Amiga - Event  - Computing History"
description = "Commodore released the first Amiga computer in 1985.Commodore released the first Amiga computer in 1985. Initially it was just called the Amiga, but was later renamed to the Commodore Amiga 1000. I..."
full_description = "Commodore released the first Amiga computer in 1985. Initially it was just called the Amiga, but was later renamed to the Commodore Amiga 1000. It was the successor to the Commodore 64, and also a competitor to the Apple Macintosh. The Amiga 1000 had exceptional audio and graphics capabilities for a machine of its time. Based on the Motorola 68000 microprocessor, the Amiga's chipset also included several coprocessors to accelerate graphics and sound. The Amiga could display up to 4096 colors, produce 8-bit stereo audio, and run several applications simultaneously. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team. All individual donations can also be Gift Aided, allowing us to claim an extra 25p on every £1 donated. Visit our Gift Aid page to complete a Gift Aid declaration. Please be assured that any amount you feel able to donate will make an immediate and significant impact."
