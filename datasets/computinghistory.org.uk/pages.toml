["http://www.computinghistory.org.uk/pages/37534/Accessibility"]
title = "Accessibility - Computing History"
description = "Accessibility The Centre for Computing History welcomes everyone. Entrance Exit The entrance to the museum has a shallow incline ramp in both directions. Accessible Parking We have dedicated access..."
full_description = "Accessible ParkingWe have dedicated accessible parking space immediately outside our front door. Please call us on 01223 214446 at least 24 hours in advance to reserve this.You will need to provide the details of the registration number, make and model of vehicle and the date of your visit. Accessible ToiletWe have an large accessible toilet in our front foyer area. This also holds our baby changing facilities. LayoutThe museum is quite open plan. There are no steps and all of the exhibits are on one level. There is plenty of space around the exhibits for wheelchair access. Concessionary EntriesConcession tickets are available for visitors who are blue badge holders, guide dog owners, or anyone part of a registered disability scheme. Free entry is also provided for registered carers where applicable, though we appreciate it if you can contact us beforehand to confirm your visit. To Qualify for free entry, all we require is to see an example of the recognised documentation below: Entitlement to (i.e. a letter stating that the benefit has been awarded, or the actual allowance book):Disability Living Allowance (DLA) International Proof of Disability (ISA (International Symbol of Access) or similar must be printed on it) Other Accessibility NeedsIf you or your group require additional assistance when visiting the museum, please contact us in advance. We will do our best to make arrangements and ensure that you can enjoy your visit to the full. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed."
