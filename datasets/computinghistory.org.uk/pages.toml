["http://www.computinghistory.org.uk/det/15584/Commodore%20releases%20the%20the%20Amiga%20A500+"]
title = "Commodore releases the the Amiga A500+ - Event  - Computing History"
description = "The Amiga A500 was an updated version of the Amiga 500, with 1MB of RAM and the ECS enhanced chipset.The Amiga A500 was an updated version of the Amiga 500, with 1MB of RAM and the ECS enhanced chi..."
full_description = "The Amiga A500+ was an updated version of the Amiga 500, with 1MB of RAM and the ECS enhanced chipset. The Amiga A500+ started shipping without an offical anouncement from Commodore. In fact, in December 1991 some customers bought what they thought were A500 computers, only to find when they opened them that they had A500+ models. Compatibility issues with the new Kickstart ROM meant that several popular Amiga games did not work on the Amiga A500+, including Treasure Island Dizzy and Lotus Esprit Turbo Challenge. This resulted in criticism and returns from customers. In summer 1992, the A500+ was discontinued and replaced by the Amiga 600, making the A500+ the shortest-lived Amiga model. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team. All individual donations can also be Gift Aided, allowing us to claim an extra 25p on every £1 donated. Visit our Gift Aid page to complete a Gift Aid declaration. Please be assured that any amount you feel able to donate will make an immediate and significant impact."
