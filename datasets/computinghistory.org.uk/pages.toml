["http://www.computinghistory.org.uk/det/43808/Vannevar%20Bush%20publishes%20his%20influential%20essay"]
title = "Vannevar Bush publishes his influential essay - Event  - Computing History"
description = "The July 1945 issue of The Atlantic Monthly contained the essay, As We May Think by Vannevar Bush.The July 1945 issue of The Atlantic Monthly contained the essay, As We May Think by Vannevar Bush. ..."
full_description = '''Bush describes a theoretical machine he called a "memex". The machine was intended to enhance human memory by allowing documents to be stored and retrieved by association, rather than a traditional index and hierarchical system as you might find in a library. This description of associative linking is very similar to what we now call hypertext, the system on which the World Wide Web is built. "device in which an individual stores all his books, records, and communications, and which is mechanized so that it may be consulted with exceeding speed and flexibility. It is an enlarged intimate supplement to his memory." "wholly new forms of encyclopedias will appear, ready made with a mesh of associative trails running through them, ready to be dropped into the memex and there amplified” The name of the memex came from the words "memory" and "index". The concept of the memex influenced the creators of early hypertext systems such as Ted Nelson, who coined the terms "hypertext" and "hypermedia". These ideas eventually led to the creation of the World Wide Web. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team. All individual donations can also be Gift Aided, allowing us to claim an extra 25p on every £1 donated. Visit our Gift Aid page to complete a Gift Aid declaration.'''
