["http://www.computinghistory.org.uk/det/3820/Herman%20Hollerith%20is%20born"]
title = "Herman Hollerith is born - Event  - Computing History"
description = "Herman Hollerith 29th February 1860 November 17, 1929 is born.Herman Hollerith 29th February 1860 November 17, 1929 is born. Hollerith was a GermanAmerican statistician who invented a punched card ..."
full_description = "Herman Hollerith (29th February 1860 - November 17, 1929) is born. Hollerith was a German-American statistician who invented a punched card system for tabulating census statistics. This use of punched cards to store data was a standard mechanism for data storage and processing until the late 1970s. The company Hollerith founded to build his electrical tabulating machines would later form the basis of the IBM corporation. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team. All individual donations can also be Gift Aided, allowing us to claim an extra 25p on every £1 donated. Visit our Gift Aid page to complete a Gift Aid declaration. Please be assured that any amount you feel able to donate will make an immediate and significant impact."
