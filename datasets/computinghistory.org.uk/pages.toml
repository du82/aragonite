["http://www.computinghistory.org.uk/pages/55168/Corporate-Gaming-Evenings"]
title = "Corporate Gaming Evenings - Computing History"
description = "Corporate Retro Gaming Evenings The Centre for Computing History offers you a unique venue to host corporate retro gaming evenings. You will love our huge range of retro games and the nostalgic atm..."
full_description = "The Centre for Computing History offers you a unique venue to host corporate retro gaming evenings. You will love our huge range of retro games and the nostalgic atmosphere. Unfortunately, we are unable to offer these fabulous evenings at this point in time for staffing reasons. If you would be interested in booking one of these events, please email events@computinghistory.org.uk and we will add you to our mailing list so we can let you know when we are able to offer these again. We apologise for any inconvenience caused. The museum is available to hire from 6pm to 10pm, Wednesday to Friday, and you will have the entire public area of the museum to yourselves. Your team will have access to all of the hands-on gaming consoles and computers the museum has on display. We charge £200 (+VAT) per hour. A minimum booking of 3 hours is required if food is to be consumed, or 2 hours without food. A £100 non-refundable deposit will be required at the time of booking with the remainder payable before the day of the event. If your organisation is likely to require terms of greater than 30 days for payment please consider this when booking so that we have payment in hand before your event. Please also ensure a purchase order is provided at the point of booking where this will be required by your own financial systems. Tours are charged at £100 (+VAT) per group and last for approximately 40 minutes. Each tour has a maximum limit of 25 people. Groups of 25+ will need to be split into smaller groups. Tours can run consecutively for larger groups. We can also recommend a pop-up bar for you to book directly if you wish to have alcoholic drinks available. Alternatively, we can keep our Pac Lunch Shop open and run a tab for the snacks, to be paid on the day. We can provide a buffet including sandwiches, dips, fresh fruit, and tea/coffee/soft drinks for £20 (+VAT) per head. Alternatively, you are welcome to organise pizza delivery or similar, however we would ask that you supply your own plates."
