["https://www.computinghistory.org.uk/pages/30598/Corporate-Venue-Hire"]
title = "Cambridge Venue Hire - Corporate Events - Private Parties"
description = "Corporate Venue Hire The Centre for Computing History in Cambridge offers a unique venue experience combining business with pleasure for all corporate and private events. Its exhibition spaces, wit..."
full_description = "The Centre for Computing History in Cambridge offers a unique venue experience combining business with pleasure for all corporate and private events. Its exhibition spaces, within an environment dedicated to technical discovery, provide a distinctive backdrop for parties and celebrations. Both the Main Gallery and Hauser Studio are available to hire for corporate events including conferences, receptions, product launches, team-building workshops, training days, board meetings and press briefings. These facilities are also available for private celebrations. From guided tours to gallery-related character actors (subject to staff availability), we can pull together the right ingredients for a truly memorable event. To discuss your event, check availability or arrange a visit, please email events@computinghistory.org.uk. This flexible space, often used to host temporary exhibitions, is ideal for business events and receptions. The Hauser Studio is a fully carpeted room that can be completely isolated and closed off from the Foyer making it ideal for private functions and presentations. Facilities include a Digital Projector and Sound System. The Main Gallery is a large, flexible space that houses our permanent exhibition - Odyssey. The central area allows us to accommodate up to 120 people seated theatre style for presentations and conferences. This area can also be used for business exhibition purposes. For smaller groups and further alternatives, including informal buffets, receptions and events, please contact us: events@computinghistory.org.uk Want to just hire the space and do the other bits yourself... no problem, here are our charges for room only hire: Guided Tour - Tours may be subject to staff availability. A cost of £100+VAT per tour with a maximum limit of 25 people per tour group. One choice from 3 types of tour on offer - History of Computing, Technical or Gaming. Please enquire for further information. A timeline of the greatest video game consoles and the best and worst of video games. All are interactive and fully playable and are always popular with guests!"
