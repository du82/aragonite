["http://www.computinghistory.org.uk/det/15847/Steve%20Jobs%20retires%20as%20CEO%20of%20Apple"]
title = "Steve Jobs retires as CEO of Apple - Event  - Computing History"
description = "On 24th August 2011 Steve Jobs, cofounder of Apple, resigned as chief executive, saying he can no longer handle the job, but will continue to play a leadership role.On 24th August 2011 Steve Jobs, ..."
full_description = "On 24th August 2011 Steve Jobs, co-founder of Apple, resigned as chief executive, saying he can no longer handle the job, but will continue to play a leadership role. He was 55 years old. He founded the company 35 years before in his garage. He had been on medical leave from the company since January with an unspecified condition. In a letter to the Apple board, Jobs said: 'I have always said if there ever came a day when I could no longer meet my duties and expectations as Apple's chief executive, I would be the first to let you know. 'Unfortunately, that day has come. I hereby resign as chief executive of Apple. I believe Apple's brightest and most innovative days are ahead of it. And I look forward to watching and contributing to its success in a new role.' Jobs, who underwent a liver transplant in 2009 following a battle with pancreatic cancer in 2004, was the mastermind behind the iMac, iPod, iPhone and iPad, turning Apple into one of the most powerful companies in the world. Many claim it was Steve's attention to detail that set Apple apart from its fierce competitors and feared the company may struggle to come-up with market changing ideas without its charismatic leader. In early August 2011, Apple became the most valuable company in America although stock value quickly fell by 5.4% after Steve's announcement. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team."
