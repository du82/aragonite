["http://www.computinghistory.org.uk/det/32758/Microsoft%20releases%20Xbox%20One"]
title = "Microsoft releases Xbox One - Event  - Computing History"
description = "On the 22nd November 2013, Microsoft released the Xbox One games console.On the 22nd November 2013, Microsoft released the Xbox One games console. Xbox One was Microsoft's third console in the Xbox..."
full_description = "On the 22nd November 2013, Microsoft released the Xbox One games console. Xbox One was Microsoft's third console in the Xbox series, after the original Xbox and the Xbox 360. Microsoft positioned the console as an all-in-one entertainment system, playing films from Blu-ray and DVD, and music from CDs. Xbox One also had the ability to overlay live TV and display split-screen multitasking applications. After the Xbox 360's move to a PowerPC-based architecture, Xbox One saw a return to the x86 architecture used in the first Xbox, featuring an AMD x86-64 processor. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team. All individual donations can also be Gift Aided, allowing us to claim an extra 25p on every £1 donated. Visit our Gift Aid page to complete a Gift Aid declaration. Please be assured that any amount you feel able to donate will make an immediate and significant impact."
