["http://www.computinghistory.org.uk/pages/48940/Front-of-House-Volunteers"]
title = "Front of House Volunteers - Computing History"
description = "With lots of visitors coming to the museum everyday, especially during holiday periods, we are looking for people people to come and help us make a visit to our museum that bit more special. You ne..."
full_description = "With lots of visitors coming to the museum everyday, especially during holiday periods, we are looking for 'people people' to come and help us make a visit to our museum that bit more special. You need know nothing about computers! There are plenty of techies here who you can refer our guests to! We just need people that are friendly and personable that can be there for visitors when they need you. Come and Join the Team!We are a relaxed and welcoming team. The working atmosphere is fun but professional.Tea and coffee is available for free from our 'Pac Lunch Shop' and as a volunteer you arewelcome to all of our special events for free. LogisticsTo be able to do this role you will need to be able to get to the museum in Cambridge. TimeThe critical time for this role is Saturdays and Sundays, 10am-5pm, as this is when we're busiest with the public. Also, every day of the week during a school holiday period is important, as visitor numbers jump up during these times. There is some scope for helping us on weekdays when we have school groups present, though these times will be less busy. During these times, when there is less going on there are a few projects that you could help us with from the front desk that will keep you busy ;) Any time within those hours is suitable - you don't need to do a full day. The amount of time you can offer us is entirely up to you, and it need not be the same each week. All we ask is that you let us know in advance.How to ApplyAs with all of our volunteer roles, if you are interested in volunteering your time and playing a vital part in our museum, email us with your details, what role you'd like to apply for and what makes you ideal for this role. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder!"
