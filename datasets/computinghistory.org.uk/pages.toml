["http://www.computinghistory.org.uk/pages/46742/Volunteer-Archivist"]
title = "Volunteer Archivist - Computing History"
description = "We have a huge collection of hardware, software, books, journals, documentation and ephemera. Whilst a lot has been catalogued and made available online, there is still much to do. As an Accredited..."
full_description = "We have a huge collection of hardware, software, books, journals, documentation and ephemera. Whilst a lot has been catalogued and made available online, there is still much to do.As an Accredited Museum, we archive to museum 'SPECTRUM' standards so the cataloguing process involves photographing, researching, itemising and preparing objects for long-term storage. We use our own cloud-based in-house software to do this, and we provide full training on how to use it and the procedures that need to be followed.If you have a keen interest in computing history, this role could be perfect for you, especially if you like order and take pride in detail.Once an object has been catalogued, your hard work will be represented online on our website immediately, allowing visitors around the world unique access to our collection for research and general interest.With your work represented online immediately, the role is very rewarding. RequirementsThis role does require that you have some knowledge of computing history. In particular, we need people who have knowledge of hardware, although we have an ongoing need for software and documentation cataloguing too. Much can be researched online, but a personal knowledge would be a huge advantage. You must be able to catalogue items on a purely factual basis and you'll need to have a very methodical but practical and flexible approach to the process. Accuracy and attention to detail are obviously important, and documentation is key.Come and Join the Team!Our amazing team of volunteers have already catalogued over 41,000 items, which are all available to view on this website. We are a relaxed and welcoming team. The working atmosphere is fun, relaxed but professional. Tea and coffee is available for free from our 'Pac Lunch Shop' and as a volunteer you are welcome to join all of our special events for free. LogisticsTo be able to do this role you will need to be able to get to the museum in Cambridge. TimeThe position is available from Wednesday to Sunday, 10am to 5pm, every week throughout the year.This role can be done at a time that suits you within the above times. The amount of time you can offer us is entirely up to you, and it need not be the same each week. All we ask is that you let us know in advance when you intend to come in.How to ApplyAs with all of our volunteer roles, if you are interested in volunteering your time and playing a vital part in our museum, email us with your details, what role you'd like to apply for and what makes you ideal for this role."
