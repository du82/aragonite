["http://www.computinghistory.org.uk/det/12410/David%20Filo%20and%20Jerry%20Yang%20found%20Yahoo!"]
title = "David Filo and Jerry Yang found Yahoo! - Event  - Computing History"
description = "Yahoo! was the first popular World Wide Web online directory.Yahoo! was the first popular World Wide Web online directory. It was a humanedited directory of websites, rather than a search engine, t..."
full_description = '''Yahoo! was the first popular World Wide Web online directory. It was a human-edited directory of websites, rather than a search engine, that let you browse hierarchies and categories to find websites of interest. Yahoo! began as a student hobby and evolved into a global brand that has changed the way people communicate with each other, find and access information and purchase things. The two founders of Yahoo!, David Filo and Jerry Yang, Ph.D. candidates in Electrical Engineering at Stanford University, started their guide in a campus trailer in January 1994 as a way to keep track of their personal interests on the Internet. Before long they were spending more time on their home-brewed lists of favorite links than on their doctoral dissertations. Eventually, Jerry and David's lists became too long and unwieldy, and they broke them out into categories. When the categories became too full, they developed subcategories ... and the core concept behind Yahoo! was born. The Web site started out as "Jerry and David's Guide to the World Wide Web" but eventually received a new moniker with the help of a dictionary. The name Yahoo! is an acronym for "Yet Another Hierarchical Officious Oracle," but Filo and Yang insist they selected the name because they liked the general definition of a yahoo: "rude, unsophisticated, uncouth." Yahoo! itself first resided on Yang's student workstation, "Akebono," while the software was lodged on Filo's computer, "Konishiki" - both named after legendary sumo wrestlers. Jerry and David soon found they were not alone in wanting a single place to find useful Web sites. Before long, hundreds of people were accessing their guide from well beyond the Stanford trailer. Word spread from friends to what quickly became a significant, loyal audience throughout the closely-knit Internet community. Yahoo! celebrated its first million-hit day in the fall of 1994, translating to almost 100 thousand unique visitors. Due to the torrent of traffic and enthusiastic reception Yahoo! was receiving, the founders knew they had a potential business on their hands. In March 1995, the pair incorporated the business and met with dozens of Silicon Valley venture capitalists. They eventually came across Sequoia Capital, the well-regarded firm whose most successful investments included Apple Computer, Atari, Oracle and Cisco Systems. They agreed to fund Yahoo! in April 1995 with an initial investment of nearly $2 million.'''
