["http://www.computinghistory.org.uk/pages/42187/Research"]
title = "Research - Computing History"
description = "Research, Projects & Community Researching our Collections We welcome researchers and others who wish to use objects in our collection for their studies. If you have a research query, contact u..."
full_description = "Researching our CollectionsWe welcome researchers and others who wish to use objects in our collection for their studies. If you have a research query, contact us on collection@computinghistory.org.uk. If there are specific items in the collection that you would like access to, please quote the object ID (listed at the bottom of each object's web page) in your query. Research & Community ProjectsResearch is an integral part of our culture as a museum, as we strive to promote understanding of the history of computing. Our staff are involved in a wide range of research activities across the fields of computing; computing history; conservation and management of collections involving modern materials; and video game preservation. We also get involved with local community projects where we can and these vary hugely in focus and in scope. Sometimes this just means we'll take part in community events like the Cambridge Big Weekend or Summer at the Museums. Other community projects are wider in scope and they often involve our staff in activities that help promote social inclusion or address inequalities. This exciting initiative is funded by a grant from the Esmée Fairbairn Collections Fund, run by the Museums Association. It will engage the local community in exploring the environmental and social impacts of the tech boom. The Centre for Computing History’s collection celebrates the incredible evolution of computing technology over the past 80 years. However, with tech embedded in all our lives, and the UK predicted to generate over 30,000 tons of e-waste a week by the end of this year, the museum is keen to work with local people and organisations to explore how to reinterpret our collection and tell alternative stories about the environmental impact of tech. Find out more. Swiss Rolls, Tea & the Electronic Office: A History of LEO, the World's First Business Computer - completed June 2023, but some volunteer work is ongoing.Having developed the world's first business computer, LEO Computers played a key role in the early development of computing, and its subsequent social impact, but the LEO story is not well known. So, in partnership with the LEO Computers Society, and with grateful thanks to the National Lottery Heritage Fund, we are preserving, archiving and digitising LEO artefacts, documents and personal memories before they are lost forever. Further details can be found on our project webpage."
year_published = 2025
year_updated = 2025
