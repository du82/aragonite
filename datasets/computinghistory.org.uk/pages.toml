title = "Retro Gaming Parties - Computing History"
description = "Retro Gaming Parties The Centre for Computing History offers you a unique venue to host parties and other celebrations. Kids will love the huge range of retro games, and adults will love the nostal..."
full_description = "The Centre for Computing History offers you a unique venue to host parties and other celebrations. Kids will love the huge range of retro games, and adults will love the nostalgic atmosphere. The museum is available to hire in the evenings from Wednesday-Sunday and you will have the entire public area of the museum to yourself. Your guests will have access to all of the hands-on gaming consoles and computers the museum has on display. Unofficial Birthday Parties We appreciate that our museum is a great venue for birthday parties and have created a specific early evening service to accommodate your special occasion. Therefore we do not allow birthday party bookings during our normal opening hours. You can however still visit for a birthday, but food, drink, gifts and banners cannot be brought in to the museum. You must also contact us in advance so we can make our staff aware, and state that you have read this page of the website. You must also ensure you have enough adults to supervise the children on a one adult per six children ratio. All members of the party must enter at the same time to ensure we maintain ratios, we can't process extraneous child tickets. Entry fees for such occasions are based STRICTLY on adult and child entry fees and NOT the family discounted rate or any other concessions. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team."
