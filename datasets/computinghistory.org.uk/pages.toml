title = "Commodore releases the VIC-20 in Europe and US - Event  - Computing History"
description = "In May 1981, Commodore released the VIC20 in Europe and the US.In May 1981, Commodore released the VIC20 in Europe and the US. The machine was first released 8 months earlier in Japan as the VIC100..."
full_description = "In May 1981, Commodore released the VIC-20 in Europe and the US. The machine was first released 8 months earlier in Japan as the VIC-1001. Priced at £299.99 and aimed at the personal and hobby end of the market, the VIC-20 was the first computer to sell more than 1 million units. It eventually sold over 2.5 million units before production was discontinued in 1985. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team. All individual donations can also be Gift Aided, allowing us to claim an extra 25p on every £1 donated. Visit our Gift Aid page to complete a Gift Aid declaration. Please be assured that any amount you feel able to donate will make an immediate and significant impact."
