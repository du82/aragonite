full_description = "Commodore announced the Amiga CD32 at the Science Museum in London, United Kingdom on 16th July 1993. It was released in September 1993. Commodore marketed the CD32 as the world's first 32-bit CD games console, but that title actually belongs to the FM Towns Marty, a console available only in Japan which was launched in February 1993. The CD32 was based on Commodore’s Advanced Graphics Architecture Chipset, and had a similar specification to the Amiga 1200 computer. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team. All individual donations can also be Gift Aided, allowing us to claim an extra 25p on every £1 donated. Visit our Gift Aid page to complete a Gift Aid declaration. Please be assured that any amount you feel able to donate will make an immediate and significant impact."
