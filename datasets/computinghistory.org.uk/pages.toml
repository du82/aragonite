title = "Games Consoles - Trump Cards - Shop Item  - Computing History"
description = """
Description :

Following the huge success of the Home Computer Trump Cards, and under increasing pressure from the retro gaming community we have FINALLY produced an awesome set of collectible cards with some of the most popular (and not so popular) game consoles in existence!

Featuring new a set of comparisons, these cards will have you arguing frenetically about which console was better and why. (Although we all know WHY is irrelevant!) A new wildcard feature will throw a few curve balls into the gameplay!

Packaged in a retro cassette case in keeping with our deluxe version of the Home Computer collectible cards. 
40 game consoles are represented, and playing instructions are on the reverse of the cassette inlay card.
 
A huge thank you to 8bitkick.cc for help produce the artwork for the cards and to Evan Amos for his excellent public domain game console images."""
