["https://computinghistory.org.uk/news/73726/We-re-Hiring-The-Land-Archivist"]
title = "Were Hiring! - The Land Archivist - Computing History"
description = "The UK Computer and Videogame Museum"
full_description = "Applications are invited for a new archivist post, based at CCH. The Land Archivist, funded for two years by the AIT Trust, will continue to conserve, catalogue, and digitise the LEO Computers collection, building on work completed as part of our lottery-funded project which ended in 2023. CCH is a museum and charity with collections and learning at its heart. We are an accredited museum with a core purpose to increase understanding of developments in computing over the past 80 years by exploring their social, cultural and historical impact. We look after the LEO Computers Society’s important archive, which continues to grow in both size and historical significance. LEO computers were the first business computers in the world, developed in the late 1940s and early 1950s by mass catering firm Lyons, famous for its high street teashops, and were based on the Cambridge EDSAC. This post which has been generously funded by the AIT Trust is named in honour of Frank and Ralph Land, twin brothers who were important early pioneers in the LEO enterprise. More information is available in our press release. The principal role of the Land Archivist is to work with the existing CCH collections team and CCH's CEO in the management of the LEO Computers collection at CCH and its services to users. Email your CV and in the covering email outline the reasons for applying and the skills you will bring to the post. Email: admin@computinghistory.org.uk We are a disability, neurodiversity and mental health inclusive employer and want to ensure that you have a barrier-free recruitment experience. If you need adjustments during the recruitment process or require assistance completing an application as the result of disability, please email admin@computinghistory.org.uk. We regret that CCH may not reply to every application. If you do not hear from us within three weeks after the closing date, you should assume that you have not been short-listed for interview. The post will require working in stored collection areas, including the lifting and transporting of moderately heavy boxes of archive papers."
