["http://www.computinghistory.org.uk/det/17298/C.%20100%20BC%20Ancient%20Greeks%20build%20the%20Antikythera%20mechanism"]
title = "C. 100 BC Ancient Greeks build the Antikythera mechanism - Event  - Computing History"
description = "The Antikythera mechanism is an ancient mechanical computer designed to calculate astronomical positions.The Antikythera mechanism is an ancient mechanical computer designed to calculate astronomic..."
full_description = "The Antikythera mechanism is an ancient mechanical computer designed to calculate astronomical positions. It was recovered in 1901 from the wreck of a ship near the island of Antikythera, in the Mediterranean Sea. The mechanism is the oldest known complex scientific calculator. It contains many gears, and is sometimes called the first known analog computer, although its flawless manufacturing suggests that it may have had several undiscovered predecessors during the Hellenistic Period. The device appears to be constructed based on theories of astronomy and mathematics developed by Greek astronomers. It is estimated that it was made between 150 and 100 BC. The significance and complexity of the device were not understood until decades after its discovery. Technological artifacts of similar complexity and workmanship did not reappear until the 14th century, when mechanical astronomical clocks were built in Europe. The device is displayed at the National Archaeological Museum of Athens, accompanied by a reconstruction made and donated to the museum by Derek de Solla Price. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team. All individual donations can also be Gift Aided, allowing us to claim an extra 25p on every £1 donated. Visit our Gift Aid page to complete a Gift Aid declaration."
