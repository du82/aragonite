full_description = "On February 25th, Facebook announced that they had acquired Oculus VR, the company behind the ground-breaking virtual reality device, the Oculus Rift. The founder of Oculus VR, Palmer Luckey, received initial funding from Kickstarter to develop his prototypes into a commercial product. The value of the deal was $2bn, of which $400 million was cash, with the rest consisting of Facebook shares. Many backers on Kickstarter were upset about the sale, stating that they did not intend their money to be used to develop Facebook-related projects. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team. All individual donations can also be Gift Aided, allowing us to claim an extra 25p on every £1 donated. Visit our Gift Aid page to complete a Gift Aid declaration. Please be assured that any amount you feel able to donate will make an immediate and significant impact."
