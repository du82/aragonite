["https://computinghistory.org.uk/cgi-bin/sitewise.pl"]
title = "The Centre for Computing History - Computer and Video Game Museum - Cambridge"
description = "The Centre for Computing History is a computer and video game museum based in Cambridge, UK. With a collection of vintage computers and game consoles, many of the exhibits are hands on and interactive."
full_description = '''The Centre for Computing History is much more than a museum. Based in Cambridge, it hosts hands-on exhibitions, a wide range of activities and events, has a small shop and runs a learning programme. Most importantly, it makes the history of computing relevant and fun for all! Cambridge has a long history in the computing field so is the perfect place for a museum dedicated to computing history. <!-- .homewhatson { padding:5px 0; border-bottom:#E0E0E0 1px solid; } .homewhatson span { color:#0e83cd } .homewhatson a { font-weight:normal; color:#2f2f2f !important; } .homewhatson img { float:left; width:50px; margin-right:10px; padding:5px; border:1px solid #0e83cd; } .homewhatson h3 { margin:0 !important; font-weight:normal !important; font-size:15px !important; font-family:"Noto Sans",sans-serif !important; text-align:left !important; } --> From posters and trump cards to mugs and retro tech, it's great place to buy gifts for others or for yourself! All proceeds support us in our work. Visit our online shop now (or drop in to the museum). Could you volunteer? By giving your time you can help us enthuse children, parents and teachers about the technology that fills our world. Hands-on projects including cataloguing, helping the learning team, photography, filming, front of house and exhibit maintenance. We strive to be open and welcoming to all and we're always open to opportunities to co-create the histories of computing. Are you a business? Would you be interested in working with or sponsoring us? We're always looking for partners! Please contact our Partnerships team via admin@computinghistory.org.uk in the first instance. We regularly release new video content that captures important stories or provides access to our collection. Visit our channel now to support our work. And if you want to go the extra mile with your support and see new content before anyone else, join our Patreon community. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk'''
