["http://www.computinghistory.org.uk/pages/4895/Latest-Additions"]
title = "Latest Additions - Computing History"
description = "Latest Additions This list shows the computers, calculators, game consoles and peripherals that have been added to our collection recently. VIEW ALL LATEST ADDITIONS..."
full_description = "This list shows the computers, calculators, game consoles and peripherals that have been added to our collection recently. .archiveitems { border:#C0C0C0 1px solid; border-radius:10px; -moz-border-radius:10px; -webkit-border-radius:10px; padding:10px; position:relative; clear:both; margin-bottom:20px; } .archiveitems .date { float:right; margin:5px; font-size:20px; } .profilePic { float:left; margin-right:25px; width: 150px; height: 150px; background-color:#ccc; background-size: cover; } .archiveitems object{ width: 150px; height: 150px; object-fit: cover; } .archiveitems a.title { font-size:17px; } Delay-line memory is a form of data storage used in the earliest computers such as Leo this is now reappearing in forms of optical delay lines. The Telesensory Navigator 80 is a refreshable Braille display designed to provide visually impaired users with seamless access to digital content. ATM Ltd / Virata Corporation were a relativly short-lived Cambridge start-up from the 1990s which was first to market with ADSL broadband modem processors with a hugely-successful NASDAQ IPO in 2000. The Mitsubishi Maxy DT2 is a compact desktop computer that was part of Mitsibushi's line of business-oriented machines. Controller that can be plugged into the bottom of a Wii remote to allow certain games to be played with a more standard control scheme. Cable that allows controllers to be plugged into a Playstation or Playstation 2 from greater distances than usual. The Macintosh Portable was Apple Computer's first attempt at making a portable Macintosh personal computer that held the power of a desktop Macintosh. The Trantam 8080A-based system refers to a computer system built around the Intel 8080A microprocessor, which was introduced in the early 1970s. The Cipher 5210 Tape Drive is an external data storage device used primarily for backing up and archiving data. Robokit is a piece of software for the Atari ST for controlling an electronics board - the board is designed for use with building pieces that will create a robot around it which can be controlled from a computer."
