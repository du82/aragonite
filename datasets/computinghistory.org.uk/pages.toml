["http://www.computinghistory.org.uk/pages/62739/Virtual-School-Visits"]
title = "Virtual School Visits - Computing History"
description = "TeleVisits The 20202021 academic year sees the introduction of a brand new service here at The Centre for Computing History. With the physical limitations ofCovidpreventing some school visits, we h..."
full_description = "All modules will be delivered live by one or two members of the museum staff. Each module (except Module 7) will be 60 minutes in duration - this will include 40 minutes of the said activity and 20 minutes of Q&A. These modules can be delivered Wednesday to Friday. MODULE 1 - Timeline Bytes: The Centre tells the amazing story of the rise of personal computing from the huge machines of the sixties to the technology that impacts all of us now. Through heritage displays and artefacts, students will discover ‘bytes’ of the computing timeline bringing the past alive. You can supplement the tour with our downloadable trail sheets, the link to which will be e-mailed to you when you book the module. MODULE 2 - Game Bytes: Through the Centre’s impressive collection of gaming technology, students will be able to learn about the development of games consoles, game design, mechanics and narrative and the development of graphics from 8-bit to HD. You can supplement this activity with our downloadable Game Zone sheets, the link to which will be e-mailed to you when you book the module. MODULE 3 - Meet the Megaprocessor: Meet our biggest exhibit! The Megaprocessor is a computer processor made large - very, very large. This presentation has been developed specifically for Computer Science students and covers concepts like the Von Neumann Architecture, Memory and Address registers, Machine Code operations and Fetch-Execute cycle, to name a few. These concepts are ‘deep’ within the hardware and are usually ‘theoretical’ in their presentation and understanding by students. The Megaprocessor offers an opportunity to make these real and visible at a speed that supports understanding. MODULE 4 - Amazing Automatons: Be introduced to our newest ‘staff’ member, Jnfr - a humanoid robot - and her team! This is designed to be a lively, interactive talk on robotics where students will learn about the past, present and future of this field. The talk is followed by a robotics demo that will end with Jnfr demonstrating a little Tai-Chi (depending on her mood, of course!)."
