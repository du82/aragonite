title = "Nvidia is founded - Event  - Computing History"
description = "On 5th April 1993, technology company Nvidia was founded by JenHsun Huang, Chris A.On 5th April 1993, technology company Nvidia was founded by JenHsun Huang, Chris A. Malachowsky, and Curtis Priem ..."
full_description = "On 5th April 1993, technology company Nvidia was founded by Jen-Hsun Huang, Chris A. Malachowsky, and Curtis Priem with venture capital funding from Sequoia Capital. Nvidia began by producing graphics processing units (GPUs) aimed at the gaming industry, but later diversified into markets including video cards, mobile phones, multimedia, and high-end scientific computers. As of August 2023, Nvidia was worth over 1 trillion dollars and ranked as the world's sixth-largest company. This meteoric rise in company value is due at least in part to their domination of the market for the chips used to power AI services such as ChatGPT, expected to be a key growth area in the future. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team. All individual donations can also be Gift Aided, allowing us to claim an extra 25p on every £1 donated. Visit our Gift Aid page to complete a Gift Aid declaration. Please be assured that any amount you feel able to donate will make an immediate and significant impact."
