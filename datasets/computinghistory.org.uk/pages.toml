["http://www.computinghistory.org.uk/det/14525/Silicon%20&%20Synapse%20becomes%20Blizzard%20Entertainment"]
title = "Silicon & Synapse becomes Blizzard Entertainment - Event  - Computing History"
description = "Video game developer Silicon & Synapse was founded in 1991.Video game developer Silicon & Synapse was founded in 1991. In late 1993, the company changed its name to Chaos Studios, but ran i..."
full_description = "Video game developer Silicon & Synapse was founded in 1991. In late 1993, the company changed its name to Chaos Studios, but ran into a legal challenge. In response, April 1994 saw another change of name to Ogre Studios, but new company owners Davidson & Associates did not approve. Finally, in May 1994, the name Blizzard Entertainment was chosen. As Silicon & Synapse, the company had had some success with games such as Rock & Roll Racing, The Lost Vikings, and Blackthorne. However, it was Blizzard Entertainment that released the massively multiplayer online role playing game (MMORPG) World of Warcraft. By 2017, World of Warcraft had made over $9 billion, making it one of the highest-grossing video game franchises of all time. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team. All individual donations can also be Gift Aided, allowing us to claim an extra 25p on every £1 donated. Visit our Gift Aid page to complete a Gift Aid declaration. Please be assured that any amount you feel able to donate will make an immediate and significant impact."
