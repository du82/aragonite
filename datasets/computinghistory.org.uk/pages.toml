["http://www.computinghistory.org.uk/det/16991/Wikipedia%20and%20others%20protest%20anti-piracy%20law"]
title = "Wikipedia and others protest anti-piracy law - Event  - Computing History"
description = "Wikipedia, Reddit, Boing Boing and an estimated 7000 other websites blacked out their web pages as part of a global protest against the U.Wikipedia, Reddit, Boing Boing and an estimated 7000 other ..."
full_description = "Wikipedia, Reddit, Boing Boing and an estimated 7000 other websites blacked out their web pages as part of a global protest against the U.S. House of Representatives' Stop Online Piracy Act and the U.S. Senate's Protect IP Act. At the time SOPA and PIPA were bills not yet approved as laws that would give entertainment companies the power to take down domains that host or link to anything they consider pirated. Neither bill had been finalized for presentation, and at that point language could still be changed. According to the White House website at the time, the Obama administration was against Internet piracy but would not support legislation that restricted freedom of expression or thwarted online innovation. Many websites simply redirected to the SOPA Strike website strike for the duration of the protest which was the largest online protest in history. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team. All individual donations can also be Gift Aided, allowing us to claim an extra 25p on every £1 donated. Visit our Gift Aid page to complete a Gift Aid declaration. Please be assured that any amount you feel able to donate will make an immediate and significant impact."
