["http://www.computinghistory.org.uk/det/1778/Hewlett-Packard%20is%20founded"]
title = "Hewlett-Packard is founded - Event  - Computing History"
description = "HewlettPackard is founded on 1st January 1939 by Stanford University graduates David Packard and Bill Hewlett.HewlettPackard is founded on 1st January 1939 by Stanford University graduates David Pa..."
full_description = "Hewlett-Packard is founded on 1st January 1939 by Stanford University graduates David Packard and Bill Hewlett. Their initial premises was a garage in Palo Alto, California, as was the case with so many Silicon Valley computer companies of the time. HP's first product was not in fact a computer at all, but the HP 200A Precision Audio Oscillator, which became a very popular piece of test equipment for engineers mainly due to its unique design and low cost. Walt Disney bought eight of the later model, the HP 200B, which they used to certify the Fantasound surround sound system installed in cinemas for their classic Fantasia film in 1940. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team. All individual donations can also be Gift Aided, allowing us to claim an extra 25p on every £1 donated. Visit our Gift Aid page to complete a Gift Aid declaration. Please be assured that any amount you feel able to donate will make an immediate and significant impact."
