["https://computinghistory.org.uk/news/73555/Citrix-Continues-its-Support-with-10-000-Donation"]
title = "Citrix Continues its Support with �10,000 Donation - Computing History"
description = "The UK Computer and Videogame Museum"
full_description = 'The Centre for Computing History (CCH) in Cambridge is proud to announce the continuation of support from Citrix, a business unit of Cloud Software Group, Inc.​ ​​and​ a global leader in cloud computing and workplace technology, which has made a generous contribution of £10,000 to the CCH Learning Programme. CCH, an educational charity and museum, offers schools an immersive full-day experience that brings to life the past, present and future of computing. Interactive, hands-on activities engage students in coding, robotics, and problem-solving, all within an environment that brings purpose and context to their learning. Since 2017, Citrix has played a vital role in enabling the Centre for Computing History to discount schools’ access to its Learning Programme – benefiting more than 3,000 schoolchildren annually. Citrix’s continued support for the Centre for Computing History highlights the ​provider​’s commitment to promoting digital skills and STEM education in Cambridge. “At Citrix, we believe in the power of education to drive innovation. Our ongoing support for the Centre for Computing History reflects our commitment to fostering a deeper understanding of technology and empowering students to explore their potential.” "We are incredibly grateful to Citrix for their continued support of our Learning Programme. Since the pandemic and cost of living crisis, many schools are struggling to run the educational trips which provide children with vital inspiration and deeper understanding of a subject. Citrix is helping to empower thousands of young people to see how technology has shaped our lives, the diverse range of tech careers available to them, and how they themselves can be future innovators.” The Centre for Computing History is a charitable heritage organisation with a strong focus on learning. Based in Cambridge, the Centre helps people understand how tech has shaped the modern world and revolutionised the way we live, work and play through interactive displays and exhibitions, a schools programme, learning events and workshops, and an astonishing collection of computing-related artefacts.'
