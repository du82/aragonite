["https://www.computinghistory.org.uk/pages/176/About-Us"]
title = "About the Computer Museum"
description = "About the Centre for Computing History The Centre for Computing History CCH is a pioneering educational charity that opened at its current site in Cambridge in August 2013. CCH was established as a..."
full_description = "The growth and innovation of the computing revolution has been fast and furious. Having created our global society, whereby our thinking, means of communication and the way we organise our lives have been irreversibly transformed, it is now impossible to envisage a world without computers or the internet. But there is now a generation of people growing up who know very little about how this has all come to pass. The Centre for Computing History tells this story. The Centre for Computing History (CCH) began in 2006, when a new ‘hands-on’ museum of personal computing was an idea in the collective mind of three friends, one of whom, Jason Fitzpatrick, owned an extensive collection of computing-related artefacts. The other two founders were Elaine Symonds and Dr Lisa McGerty. A company was formed in 2007, and together with an engaged and supportive Board, we consulted as widely as we could about our ideas for a museum of computing history in Cambridge, a natural home for such a museum. We formed a charity in 2009, which raised enough funds to be able to afford a building and the museum finally opened to the public in Cambridge in 2013. In 2019, we were awarded Accredited Museum status. Jason served as Chair of Trustees and then CEO until 2022 when he stepped away, and Lisa then took over the role of CEO, supported by current Chair of Trustees Gareth Marlow. The CCH is an accredited museum with an active visitor base and firm role in the local and tech communities, achieved with a dedicated staff team and a small army of volunteers, without whom we could not succeed. Jason's collection, passion, knowledge and devotion to computing drove the museum's early success and now Lisa is driving it forward as a highly regarded and unique museum. CCH aims to be an open and welcoming visitor attraction, offering inspirational learning opportunities to a wide range of audiences – from pre-schoolers to the over-70s – so people can confidently and creatively engage with information and digital technologies and their history. We offer a range of learning services on site including programming and electronics workshops, activities exploring the history of computing and other interactive educational opportunities using people's stories along with 1980s BBC Micros, Raspberry Pis and Micro:Bits for school students and the general public."
