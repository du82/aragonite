title = "Dragon Data releases the Dragon 32 - Event  - Computing History"
description = "In August of 1982, Dragon Data Ltd based in Port Talbot, Wales released the Dragon 32 home computer.In August of 1982, Dragon Data Ltd based in Port Talbot, Wales released the Dragon 32 home comput..."
full_description = "Built around the Motorola MC6809E processor running at 0.89 MHz, the Dragon 32 was based on the Tandy TRS-80 but had several improvements. These included video output (it still retained TV output), a better keyboard, and a Centronics printer interface. Unfortunately, the Dragon 32 couldn't compete with computers like the ZX Spectrum or Commodore 64 due to its limited graphics capabilities. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team. All individual donations can also be Gift Aided, allowing us to claim an extra 25p on every £1 donated. Visit our Gift Aid page to complete a Gift Aid declaration. Please be assured that any amount you feel able to donate will make an immediate and significant impact."
