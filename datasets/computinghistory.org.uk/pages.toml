["http://www.computinghistory.org.uk/det/33139/Google%20Brain%20recognises%20cats%20in%20YouTube%20videos"]
title = "Google Brain recognises cats in YouTube videos - Event  - Computing History"
description = "One of the many experimental projects at the Google X laboratory was a deep learning technique whose aim was to improve the adaptability of machine learning technology, especially when dealing with..."
full_description = '''One of the many experimental projects at the Google X laboratory was a "deep learning" technique whose aim was to improve the adaptability of machine learning technology, especially when dealing with data that has not been labelled and identified by humans. The project was later named Google Brain. Using 16,000 CPUs in their data centres and software that let it easily break programs into many tasks that could be computed simultaneously, the project was able to teach itself to recognise patterns in random samples of unlabelled data. After processing randomly-selected YouTube thumbnails, Google Brain produced a number of images that it had learned to recognise. One of these images was the face of a cat. The scientists behind the project said that it appeared they had developed a simulation of what takes place in the brain’s visual cortex. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team. All individual donations can also be Gift Aided, allowing us to claim an extra 25p on every £1 donated. Visit our Gift Aid page to complete a Gift Aid declaration. Please be assured that any amount you feel able to donate will make an immediate and significant impact.'''
