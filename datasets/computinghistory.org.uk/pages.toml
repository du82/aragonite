["https://computinghistory.org.uk/det/66159/Computing-Herstory-Postcard-Set"]
title = "Computing Herstory Postcard Set - Shop Item  - Computing History"
description = """
Description :

A series of postcards intended to accompany our Computing Herstory booklet.
At CCH, we wonder if the lack of a clear history of the contributions made by women has led to a perception that computing, and technology in general, are the preserve of men and boys?
We are well placed to put these contributions back at the forefront of our shared history so we have produced this set of 6 postcards to raise the profile of at least a few of the women who have made important contributions.
Each set of 6 cards includes :

Ada Lovelace
Hedy Lamarr
Karen Sparck Jones
Grace Hopper
Beatrice Worsley
Radia Perlman

One set contains 6 different A6-sized cards, one of each of the above women, sealed in a plastic wallet. The reverse of each card has an area to write in and to fill in the recipient's address. There is also a short description of the contribution each woman made to the history of computing."""
