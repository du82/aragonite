["http://www.computinghistory.org.uk/det/10389/Commodore%20introduces%20the%20Commodore%2064"]
title = "Commodore introduces the Commodore 64 - Event  - Computing History"
description = "On 7th January 1982, Commodore introduced the Commodore 64 C64 at the Consumer Electronics Show in Las Vegas.On 7th January 1982, Commodore introduced the Commodore 64 C64 at the Consumer Electroni..."
full_description = "On 7th January 1982, Commodore introduced the Commodore 64 (C64) at the Consumer Electronics Show in Las Vegas. The Commodore 64 used a MOS 6510 processor running at 1 mHz, and provided 64 kilobytes of RAM which gave the machine its name. The Commodore 64 was one of the most successful home computers ever made. Between 1982 and 1994 it sold between 17 and 30 million units. The C64 was still being produced in 1994 when Commodore filed for bankruptcy in April of that year. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team. All individual donations can also be Gift Aided, allowing us to claim an extra 25p on every £1 donated. Visit our Gift Aid page to complete a Gift Aid declaration. Please be assured that any amount you feel able to donate will make an immediate and significant impact."
