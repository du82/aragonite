["https://computinghistory.org.uk/det/55842/Computing-Herstory-Book"]
title = "Computing Herstory - Book - Shop Item  - Computing History"
description = """
Description :

Much attention is currently being paid to issues of gender inequality in computing and tech industries. Interestingly, young girls perform better than their male counterparts at GCSE yet still seem to be less attracted to tech subjects.
At CCH, we wonder if the lack of a clear history of the contributions made by women has led to a perception that computing, and technology in general, are the preserve of men and boys?
At the Centre for Computing History we are well placed to put these contributions back to the forefront of our shared history. The stories told here merely scratch the surface of women's tech history, but if a single person is inspired by them then they have served their purpose.
48 page paperback."""
