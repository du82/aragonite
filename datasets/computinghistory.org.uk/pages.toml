["http://www.computinghistory.org.uk/pages/36400/home"]
title = "Viva Home - Computing History"
description = "Viva Computer A peoples history of computing Viva Computer records the memories of the engineers, inventors, microchip designers, game developers, tech entrepreneurs and end users who have helped c..."
full_description = "Viva Computer records the memories of the engineers, inventors, microchip designers, game developers, tech entrepreneurs and end users who have helped create the high-tech world we live in today. Their stories, freely available in this audio-visual archive, help us gain a deeper understanding of the computing industry’s history of innovation, and Cambridge’s unique position within it. Many of the stories are told by the innovators of the time; others are told by ordinary people who kindly told their stories as part of our public events. Viva Computer! was supported by a grant from the Heritage Lottery Fund (HLF).The interviewees were generous in sharing their memories and visitors to these pages are asked to treat this material with respect and sensitivity. The content of oral history interviews is personal, experiential and interpretive because, by its nature, it relies on the memories, perceptions and opinions of individuals. If you refer to this material elsewhere, please present the recordings in context so that interviewees’ meanings are not misconstrued. All interviewees have given permission for the video to be preserved as a permanent public reference resource for use in research, publication, education, lectures, broadcasting and the internet. The views expressed in these recordings should not be taken as statements of fact or opinion endorsed by The Centre for Computing History or by any of the organisations referred therein. The Centre for Computing History is committed to continuing this project. If you’d like to be part of the story, please get in touch. We currently have unedited footage that needs to be put together and made available online. If you are proficent with video editing software and methods, and have the time to help, please do get in touch. How has your life been changed by the phenomenon? How have computers and technology altered the way you work, play, live, sport, date and communicate? We are looking for people interested in contributing their time, experience, and passion to continue this project."
