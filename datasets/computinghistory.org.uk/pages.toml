["https://www.computinghistory.org.uk/pages/14522/Volunteering"]
title = "Volunteering - Computing History"
description = "Volunteering atThe Centre for Computing History Join our team! The Centre for Computing History needs your help. Our volunteers are achieving great things but there is so much more we would like to..."
full_description = "We understand that your time is valuable so offering to volunteer for us is something we really do appreciate. Whether you live locally or far away, we have a number of roles available that would really help move the museum forward. We are an inclusive organisation and strive to create opportunities for everyone, regardless of background or capability. Our volunteers tell us how much they enjoy what they do for us, and that they learn new skills too! We have a particular need for volunteers who can help with school visits on weekdays during term time and and with general visitor engagement, particularly at weekends and during school holidays. We also need volunteers with a flair for social media. Volunteers work closely with staff and become part of an active volunteer community. Training is provided for all roles so not only do you help us achieve things but you can gain new skills and interests too. Free tea and coffee is always available. We hold regular get-togethers (optional of course!), and volunteers can attend all our events for free. We have an arrangement with the National Museum of Computing at Bletchley Park too, so that all our volunteers can visit there free of charge (and vice versa). After a general induction, the Centre divides new volunteers into four broad teams, with slightly different settling in procedures for each. Then once a new volunteer has settled in, there is often an opportunity to create a more customised role suited to your strengths and preferences, but we ask all new volunteers who aren't applying for a specific task to join one of our teams. Education: On weekdays, many school groups come to the Centre to participate in our learning programme. Quite often we need help to facilitate these visits, with things like setting up the classroom and lunch area and helping students move through the galleries. If you have the right skills, you could also help as a learning coach during school activities; some of our volunteers lead tours and workshops, though all assistance is good. If you enjoy working with children and young adults and are available on weekdays, this is a good role for you."
year_published = 2025
year_updated = 2025
