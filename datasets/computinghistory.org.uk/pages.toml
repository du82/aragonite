["http://www.computinghistory.org.uk/det/32759/Sony%20releases%20PlayStation%204"]
title = "Sony releases PlayStation 4 - Event  - Computing History"
description = "Sony released the PlayStation 4 PS4 on 15th November 2013 in North America.Sony released the PlayStation 4 PS4 on 15th November 2013 in North America. The PS4 used a singlechip custom processor dev..."
full_description = "The PS4 used a single-chip custom processor developed by AMD in collaboration with Sony. The processor combined an x86-64 AMD 8 core Jaguar CPU with an AMD Radeon-based GPU. The DualShock 4 controller that came with the PS4 introduced several new features over the PS3 controller, including a touchpad, light bar, and integrated speaker. The PS4 was well received by the public, with strong sales from the instant it went on sale. In the UK, the PlayStation 4 sold 250,000 consoles in the first 48 hours. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team. All individual donations can also be Gift Aided, allowing us to claim an extra 25p on every £1 donated. Visit our Gift Aid page to complete a Gift Aid declaration. Please be assured that any amount you feel able to donate will make an immediate and significant impact."
