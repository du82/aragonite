description = "Video game developer Silicon & Synapse is founded by Allen Adham, Mike Morhaime and Frank Pearce.Video game developer Silicon & Synapse is founded by Allen Adham, Mike Morhaime and Frank Pe..."
full_description = "Video game developer Silicon & Synapse is founded by Allen Adham, Mike Morhaime and Frank Pearce. Based in Irvine, California, all three founders were graduates of the University of California, Los Angeles. The company later changed its name to Blizzard Entertainment and released the massively multiplayer online role playing game (MMORPG) World of Warcraft. By 2017, World of Warcraft had made over $9 billion, making it one of the highest-grossing video game franchises of all time. Tel : +44 (0) 1223 214446Donations: collection@computinghistory.org.ukOther Email: admin@computinghistory.org.uk We are a registered charity. Since opening in 2013, over 160,000 people, including 18,000 school pupils, have visited the Centre. Our visitors deserve a space which is engaging and inspiring, where they can feel a sense of adventure, exploration and wonder! We have an ongoing need for small donations to support our work, major donations to move us forward as a charity and everything in between. Corporate partnerships are also welcomed. Small donations can be made below or to make the absolute most of your donation, please do consider making a direct bank transfer. Contact us by email using admin@computinghistory.org.uk to ask for details. If you'd like to chat about supporting us please contact our Partnerships team. All individual donations can also be Gift Aided, allowing us to claim an extra 25p on every £1 donated. Visit our Gift Aid page to complete a Gift Aid declaration. Please be assured that any amount you feel able to donate will make an immediate and significant impact."
