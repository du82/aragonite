["http://www.computinghistory.org.uk/pages/47372/Education-Volunteer-(School-Tours-and-Classroom-Assistants)"]
title = "Education Volunteer (School Tours and Classroom Assistants) - Computing History"
description = "Learning is a vital part of the work of any museum. Were no different. As well as encouraging our general visitors to learn through our displays and events, we run a formal learning programme in te..."
full_description = "Learning is a vital part of the work of any museum. We're no different. As well as encouraging our general visitors to learn through our displays and events, we run a formal learning programme in term time for schools from ages 5-18. In 2023, we welcomed almost 2,500 students to the Centre as part of a school visit. They enjoyed using our MegaProcessor, guided tours, workshops, talks on robotics and meeting people who are currently working in STEM roles and (of course) all the fun of our usual exhibits. You can find out more about our education offer on our Education Visit pages. We're looking for volunteers to help us grow this side of our work. There's no pressure to lead a lesson or take charge of a group of students unless you feel completely confident. We just need people who are comfortable around children and excited by the idea of inspiring them to learn about the history of computing. If you're comfortable with young people and want to help them learn, you'll be just what we're looking for. Tour guides will need a basic knowledge of the history of computing (though enthusiasm is more important) and some classroom volunteers need to be happy with a little bit of programming - but we'll teach you the specifics. Please be advised that we run DBS (Disclosure and Barring Service) checks on all our education volunteers to ensure that they are safe to work with children. Come and Join the Team!We are a relaxed and welcoming team. The working atmosphere is fun, relaxed but professional. Tea and coffee is available for free from our 'Pac Lunch Shop' and as a volunteer you are welcome to join all of our special events for free. We hold regular social events for volunteers too.LogisticsThis is an in-house role. You'll need to come to our site in Cambridge. TimeWe are open from Wednesday to Sunday, 10am to 5pm, every week thoughout the year. Education activities typically take place Wednesday-Friday, though occasionally we run groups on Mondays, Tuesdays, or even at the weekend."
year_published = 2025
year_updated = 2025
