["https://www.computinghistory.org.uk/pages/28568/Visiting"]
title = "Visiting - Computing History"
description = "Visiting The museum is located in Cambridge, UK. WE ARE OPEN EVERY DAY FOR HALF TERM 15th23rd FEBRUARY 2025, 10am5pm. Term time opening hours: Wednesday to Friday 10am to 3pm last entry 2.30pm Satu..."
full_description = "In school holidays we are usually open 7 days a week, 10am-5pm, except at Christmas. Check back for dates! During term times we often have large school groups in the building, which will mean some areas will not be available for a short while. If you would like to know if we have a school in on the day you would like to visit, please call 01223 214446. Entry Fees: The entry fee is £12 for adults and £8 for children between 5 and 16. Students and over 60s are £10. Under 5's are free. A family ticket for up to two adults and two children is available for £32. A family ticket for one adult and up to two children is available for £25. Registered Carers where applicable are free with paying carer. We are a charity and these prices include Gift Aid. For us to claim Gift Aid, the Admission price must be at least 10% more than our standard prices.If you do not wish to pay the extra 10%, please ask at the till. Thank you for your support. School visits have a separate pricing structure. More information on this structure can be found here. No unaccompanied children Aged 14 or Under. To Accompany someone under 14, you must be 16 years or over. Unofficial Birthday Parties We appreciate that our museum is a great venue for birthday parties and have created a specific early evening service to accommodate your special occasion. See our Childrens Birthday Parties page for more information. Therefore we do not allow birthday party bookings during our normal opening hours. You can however still visit for a birthday, but food, drink, gifts and banners cannot be brought in to the museum. You must also contact us in advance so we can make our staff aware, and state that you have read this page of the website. You must also ensure you have enough adults to supervise the children on a one adult per six children ratio. All members of the party must enter at the same time to ensure we maintain ratios, we can't process extraneous child tickets. Entry fees for such occasions are based STRICTLY on adult and child entry fees and NOT the family discounted rate or any other concessions."
