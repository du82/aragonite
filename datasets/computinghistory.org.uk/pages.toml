["https://computinghistory.org.uk/pages/57757/Ways-You-Can-Help-Us"]
title = "Ways You Can Help Us - Computing History"
description = "Ways You Can Help Us Things are tough right now for all of us. Thanks to Covid, the museum had no visitors or schools attending, no workshops and no events for over a year. These are what keep it g..."
full_description = "Things are tough right now for all of us. Thanks to Covid, the museum had no visitors or schools attending, no workshops and no events for over a year. These are what keep it going. .edartitems { border:#C0C0C0 1px solid; background-color: #FFFFFF; border-radius:10px; -moz-border-radius:10px; -webkit-border-radius:10px; padding:10px; position:relative;` clear:both; margin-bottom:20px; } .edartitems .date { float:right; margin:5px; font-size:20px; } .edart_profilePic { float:left; margin-right:25px; width: 300px; height: 214px; background-color:#ccc; background-size: cover; } .edartitems object{ width: 300px; height: 214px; object-fit: cover; } .edartitems a.title { font-size:22px; } Support the work of the Centre and sign up for an annual pass! All funds raised from these go towards our education and conservation work. Each individually numbered pass is valid for unlimited entries to the Centre across the year. Check out our gift shop. We've got some unique items that would make the ideal gift for that special geek in your life. Or maybe that geek is you? Buy something now and putting it away for Christmas or buy it now and and give yourself something to do during the crazy lockdown days. Easyfundraising turns your everyday online shopping into free donations for your favourite cause (That's us right?). Just start your online shopping first at easyfundraising, then shop as normal. Their retailers will then make a small donation to say “thank you”. Entertain yourself with some interesting interviews, talks and events. Remember to disable that ad-blocker though because we earn a small amount every time you watch one of our videos!! Join Adrian, Phil, and Dan, and maybe the other volunteers if you're lucky, for some fun behind the scenes videos and entertaining looks at some of the machines in our collection. Again, remember to disable that ad-blocker though because we earn a small amount every time you watch one of our videos!! Okay, okay! So you don't want to uninstall that ad blocker. We don't blame you! So how can we generate revenue through all of the great videos we produce? Patreon! For a monthly amount that you can choose we'll give you early access to our videos and even give you behind the scenes videos that will really give you an insight into what's going on here at the museum. Go on ... Become a patron. All the funds go towards creating great video content."
