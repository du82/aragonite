["https://www.computinghistory.org.uk/pages/34836/Kids-Retro-Gaming-Parties"]
title = "Birthday Party Venue in Cambridge"
description = "Kids Retro Gaming Parties The Centre for Computing History offers you a unique venue to host kids birthday parties. Kids will love the huge range of retro games. The museum is typically available t..."
full_description = "The Centre for Computing History offers you a unique venue to host kids birthday parties. Kids will love the huge range of retro games. The museum is typically available to hire from 5.30pm to 7.30pm, Wednesday to Sunday and you will have the museum to yourself. We will supply tables in our foyer area where you can put your own birthday cake, snacks and drinks. The kids will have access to all of the hands-on gaming consoles and computers the museum has on display. As a low-cost self service option we ask that you take responsibility for clearing up any spillages and dropped food and leave the museum in the clean state that we provided it. We have the cleaning equipment available. You are responsible for taking any waste away with you. Our kids parties run by a set structure to ensure the best experience for everyone. Please note that food and cake is saved until the end of our parties. We allow party hosts to enter from 5:05pm to set up. Once most of the guests have arrived, around 5:30pm, one of our Video Game experts will provide a brief introduction to the museum - This involves stating the ‘rules’ in a fun way, and asking the group to repeat them back (dependent on the ages!) These are: Then we will open the doors to the main gallery and classroom. After 90 minutes of play, we will direct everyone to wash their hands before sitting down for food. The gallery and classroom doors will be closed. Food & cake time lasts until the end of the party. 17:05-17:30 - Set up time17:30-17:35 - Introduction17:35-18:55 - Games & play!18:55-19:00 - Hand washing time.19:00-19:30 - Food, happy birthday, + cake! We charge £350 per event (5.30pm to 7.30pm).A £100 non-refundable deposit will be required at the time of booking, with the remainder payable 4 weeks prior to the event. Please bear in mind that we are a museum and we ask that all guests respect the displays and games at all times. Please also note that running is not permitted in the museum to ensure the safety of the collection and our guests. All invited guests must be informed of these requirements prior to or upon arrival."
year_published = 2025
year_updated = 2025
