["https://conferences.sigcomm.org/co-next/2014"]
title = "CoNEXT 2014 - Welcome - ACM SIGCOMM"
description = "The 10th International Conference on emerging Networking EXperiments and Technologies (CoNEXT)"
full_description = "The 10th International Conference on emerging Networking EXperiments and Technologies (CoNEXT) will be held December 2nd to 5th 2014 at University of Technology Sydney in Sydney, Australia. CoNEXT 2014 will be a major forum for presentations and discussions of novel networking technologies that will shape the future of Internetworking. The conference is single track and features a high-quality technical program with significant opportunities for individual and small-group technical and social interactions among a diverse set of participants. The CoNEXT conferences focus on stimulating exchanges between various international research communities. The open exchange of ideas and the freedom of thought and expression are central to the aims and goals of SIGCOMM; these require an environment that recognizes the inherent worth of every person and group, that fosters dignity, understanding, and mutual respect, and that embraces diversity. The ACM Code of Ethics embraces the “values of equality, tolerance, respect for others, and the principles of equal justice”. For these reasons, SIGCOMM is dedicated to providing a harassment-free conference experience. Harassment is unwelcome or hostile behavior, including speech that intimidates, creates discomfort, or interferes with a person’s participation or opportunity for participation, in a SIGCOMM event. Harassment in any form, including but not limited to harassment based on race, gender, religion, age, color, national origin, ancestry, disability, sexual orientation, or gender identity, will not be tolerated. Harassment includes the use of gratuitous language or sexual imagery in public presentations and displays, degrading verbal comments, deliberate intimidation, stalking, harassing photography or recording, inappropriate physical contact, and unwelcome sexual attention. Conference participants violating these standards may be sanctioned, expelled from the conference or asked not to attend future conferences or conference events, at the discretion of the conference organizers and the SIG executive committee."
