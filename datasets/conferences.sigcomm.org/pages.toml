title = "HotNets-III CFP"
full_description = "The Third Workshop on Hot Topics in Networks, HotNets-III, will bring together researchers in the networking and distributed systems community to debate emerging research directions. The goal of the workshop is to promote community-wide discussion of ideas that will influence and foster continued research in the field. The workshop will provide a venue for researchers to present new ideas that have the potential to significantly impact the community in the long term, especially those that are architectural or design-oriented in nature. Each potential participant should submit a short paper describing such an idea; the paper could, for example, expose a new problem, advocate a new solution, or debunk existing work. Attendance is limited to around 60 participants, by invitation based primarily on paper submissions. HotNets-III is sponsored by ACM SIGCOMM and supported by Intel Research and Cisco Systems. We encourage submissions across the broad range of networking and distributed systems research, not limited to those topics covered by the SIGCOMM conference. Submissions may be on topics traditionally published at SIGCOMM, NSDI, SOSP/OSDI, SenSys, or MobiCom, or they may be on topics that have yet to find a home in an established conference. Topics of interest include, but are by no means limited to: The selection of HotNets papers will be based primarily on their potential to influence future research. This influence can be exercised in many ways, exemplified by but not limited to the following: Copies of the accepted papers will be made publicly available via the Web prior to the workshop. Proceedings will be distributed at the workshop and will be made available through ACM's digital library. Examples of papers from past HotNets workshops can be found at: http://www.acm.org/sigs/sigcomm/hotnets. The Program Committee plans to write short New York Times Book Review-style reviews of accepted papers, for inclusion in the proceedings, to provide the broader community with an additional perspective on future directions in the field."
