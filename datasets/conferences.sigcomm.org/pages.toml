["https://conferences.sigcomm.org/co-next/2011"]
title = "ACM CoNEXT 2011 — Welcome — ACM SIGCOMM"
description = "The 7th International Conference on emerging Networking EXperiments and Technologies (CoNEXT)"
full_description = '''The 7th International Conference on emerging Networking EXperiments and Technologies (CoNEXT) will be held December 6th to December 9th on the campus of the University of Tokyo in Japan. CoNEXT 2011 will be a major forum for presentations and discussions of novel networking technologies that will shape the future of Internetworking. The conference is single track and features a high-quality technical program with significant opportunities for individual and small-group technical and social interactions among a diverse set of participants. The CoNEXT conferences focus on stimulating exchanges between various international research communities. For any additional queries, please email document.write('<a href="javascript:sendmail(\'kjc\', \'iijlab.net\');">the Organizing Team</a>.'); the Organizing Team &lt;kjc at iijlab.net&gt;. Decision to hold the conference in Tokyo: Tokyo only received limited physical damages from the earthquake. However, the organizing and steering committees are monitoring the evolution of the situation at the Fukushima nuclear power plant. While there does not currently seem to be any indication that the conference may not be held safely in Tokyo in December, the committees are aware of the concerns, and ready to take appropriate actions if necessary. In early May, the organizing committee surveyed recent CoNEXT attendees on the subject of the situation in Japan. Results are here. Based on community feedback along with assessments by various authorities, the organizing and steering committees have decided that the conference will go on as planned in Tokyo. Thanks to all who participated in the survey for their feedback.'''
