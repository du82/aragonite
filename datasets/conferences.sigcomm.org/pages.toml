["https://conferences.sigcomm.org/hotnets"]
title = "HotNets Workshop"
full_description = "The Workshop on Hot Topics in Networks (HotNets) was created in 2002 to discuss early-stage, creative networking research and to debate positions that reflect on the research direction and needs of the broad networking community. Architecture, high-level design work, and positions that may shape long-term research direction are especially welcome. HotNets is structured to work in synergy with conferences such as SIGCOMM by providing a venue in which innovative work may receive feedback to help it mature into conference papers or otherwise have a long-term impact on the community. To fulfill these goals HotNets calls for short position papers that argue a thoughtful point-of-view rather than full-length conference papers, and maintains a broad and diverse scope. Submission to the workshop is open and encouraged across a wide-ranging set of topics, including at least security, distributed systems, sensor networks, middleware, economics, and management, as well as more traditional core networking topics. Attendance is limited to around 60 participants, drawn mainly from the author pool, to help promote a welcoming atmosphere for discussions. In previous years, HotNets has received over 100 submissions and selected one in four of these for presentation at the workshop."
year_published = 2025
clearnet = "https://conferences.sigcomm.org/hotnets"
