["http://conferences.sigcomm.org/hotnets/2002"]
title = "HotNets-I CFP"
full_description = '''The First Workshop on Hot Topics in Networks (HotNets-I) will bring together researchers in the networking and distributed systems community to debate emerging research directions. The goal of the workshop is to promote community-wide discussion of ideas that are not yet mature with the expectations that (1) this will influence and foster ongoing research in the community, and (2) many of the HotNets position papers will grow into papers accepted at SIGCOMM or other quality conferences. Attendance is limited to around 60 participants, by invitation based primarily on open position paper submissions. HotNets is sponsored by ACM SIGCOMM, Intel Research and NSF. The CFP calls for position papers. The main purpose of a position paper should be to convince the program committee that an interesting research discussion will ensue, as opposed to present full-length conference results. We expect that most submissions will describe new work-in-progress, especially that which demonstrates a new approach or design strategy and hence has implications for ongoing work in the area. Many HotOS papers provide an example of this kind of paper. We also welcome position papers that advocate a point of view that has the potential to open up new avenues of research or close off existing avenues of research. Many MobiCom "Challenge" papers provide an example of this kind of paper. Other useful examples of workshops based on "position papers" are the SIGOPS European Workshop and the 1st International Workshop on Peer-to-Peer Systems (IPTPS'02). NSF has sponsored a limited number of travel grants for students attending HotNets. Details of how to apply for a student travel grant will be posted on the conference website. Both the submission and final paper appearing in the proceedings will be limited to six (6) pages. Part of the rationale for limiting the length is to provide clear differentiation between HotNets position papers and follow-on conference papers. We increased this limit slightly in response to requests, and it is comparable to the length of HotOS, IPTPS and EW papers.'''
