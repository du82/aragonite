title = "HotNets-VIII: Home Page"
full_description = "Overview The Eighth ACM Workshop on Hot Topics in Networks (HotNets-VIII) will bring together people with interest in computer networks to engage in a lively debate on theory and practice of networking. Continuing the HotNets tradition, the workshop will provide a venue for presenting and discussing innovative ideas that have the potential to significantly influence the community. The goal is to promote community-wide discussions of those ideas. Important Dates Abstract registration: July 17, 2009 (11:59pm EDT) Paper submission: July 24, 2009 (11:59pm EDT) Notification of decision: September 15, 2009 Camera-ready submission: October 1, 2009 Workshop dates: October 22-23, 2009 Previous HotNets workshops. Sponsored by: ACM SIGCOMM ANNOUNCEMENTS October 5th, 2009:Workshop program released September 15th, 2009:Notifications sent (21 out of 131 paper accepted) June 23rd, 2009:Web site opened for submissions April 6th, 2009:Web site launched and CFP released"
