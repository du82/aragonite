["https://conferences.sigcomm.org/co-next/2005"]
title = "Co-Next"
description = "Conference on Future Networking Technologies"
full_description = "CoNEXT aims at becoming a major forum in the area of future networking technologies. CoNEXT is designed as an open, multi-track conference aiming to attract longer-term studies and to contribute to the integration of networking research at the international level. By bringing together a number of successful workshops run by various networking communities, it will encourage much needed synergies between these communities. CoNEXT is a joint conference series having its roots in QoFIS, NGC and MIPS. QoFIS and NGC are highly successful international workshops initiated by two European COST Actions, namely COST263 on Quality of Future Internet Services and COST264 on Networked Group Communications. MIPS resulted from the merging of two other major workshops, namely IDMS (concentrated on interactive and distributed multimedia services) and PROMS (focusing on protocols for networked multimedia systems); also the associated ICQT (Internet Charging and QoS Technology) workshop is integrated into CoNEXT 2005. CoNEXT is designed as an open, multi-track conference aiming to attract longer-term studies and to contribute to the integration of networking research at the international level. Examples of relevant topics here."
