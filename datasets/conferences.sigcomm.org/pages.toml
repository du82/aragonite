["https://conferences.sigcomm.org/co-next/2007"]
title = "CoNext 2007 (Dec 10 - 13, 2007, New York): CoNEXT 2007"
description = "Third Conference on Future Networking Technologies"
full_description = "The 3rd International Conference on emerging Networking EXperiments and Technologies (CoNEXT) will be held December 10th through 13th on the campus of Columbia University in New York. CoNEXT 2007 will be a major forum for presentations and discussions of novel networking technologies that will shape the future of Internetworking. The conference is single track and features a high-quality technical program with significant opportunities for individual and small-group technical and social interactions among a diverse set of participants. CoNEXT 2007 follows the first two highly successful editions held in Toulouse, France in 2005, and in Lisbon, Portugal in 2006, and as before focuses on stimulating exchanges between various international research communities. The main conference (December 11-13) will be preceded by a student workshop on December 10. CoNEXT seeks to foster open discussions on technology alternatives and to be a forum accommodating multiple viewpoints. It is committed to a fair and thorough review process that will provide authors of submitted papers with sound and detailed feedback."
