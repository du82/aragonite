["https://conferences.sigcomm.org/co-next/2013"]
title = "ACM CoNEXT 2013 — Home — ACM SIGCOMM"
description = "The 9th International Conference on emerging Networking EXperiments and Technologies (CoNEXT 2013)"
full_description = "The 9th International Conference on emerging Networking EXperiments and Technologies (CoNEXT) will be held from December 9th to 12th in Santa Barbara, CA. CoNEXT 2013 will be a major forum for presentations and discussions of novel networking technologies that will shape the future of Internetworking. The conference is single track and features a high-quality technical program with significant opportunities for individual and small-group technical and social interactions among a diverse set of participants. The CoNEXT conferences focus on stimulating exchanges between various international research communities. This year the conference will feature two separate calls for papers. The first one will be targeted to mature, technical work, that has been the focus of the conference throughout the past 8 years. The second will be an explicit call for short papers. With that call we would like to make CoNEXT a vehicle for the dissemination of new ideas, that may not have reached the level of maturity of full papers. Both types of papers will be reviewed by the same Technical Program Committee, but with separate processes. More information on the two calls can be found below."
