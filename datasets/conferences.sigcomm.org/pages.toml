["https://conferences.sigcomm.org/imc"]
title = "Internet Measurement Conference (IMC)"
full_description = '''IMC was begun as a workshop in 2001 in response to the difficulty at that time finding appropriate publication/presentation venues for high-quality Internet measurement research in general, and frustration with the annual ACM SIGCOMM conference's treatment of measurement submissions in particular. The conference is generally held in late October or early November. In its first two years as a Workshop, attendance was limited, but now as a conference it is open to all interested in attending. Papers are submitted in May with notifications in July and camera-ready papers due in August. The acceptance rate to date has been around 25%. IMC is usually open to both full-length papers and extended abstracts, with the latter being significantly shorter and intended to convey work-in progress and less mature results. To encourage broader data sharing in the community, each year IMC will present a best paper award for the top paper that makes its data sets publically available by the time of the camera ready submission. Several papers are selected for "fast-track" submission to IEEE/ACM Transactions on Networking. In addition, IMC is committed to offering a number of student travel grants to foster the participation of students.'''
