["https://conferences.sigcomm.org/co-next/2012"]
title = "ACM CoNEXT 2012 — Home — ACM SIGCOMM"
description = "The 8th International Conference on emerging Networking EXperiments and Technologies (CoNEXT 2012)"
full_description = "The 8th International Conference on emerging Networking EXperiments and Technologies (CoNEXT) will be held from December 10th to 13th in Nice, located at the wonderful Côte d’Azur in France. While CoNEXT used to be two and a half day formerly, this year CoNEXT will last three full days. CoNEXT 2012 will be a major forum for presentations and discussions of novel networking technologies that will shape the future of Internetworking. The conference is single track and features a high-quality technical program with significant opportunities for individual and small-group technical and social interactions among a diverse set of participants. The CoNEXT conferences focus on stimulating exchanges between various international research communities. This year’s CoNEXT will host three Workshops on the first day: The Capacity Sharing Workshop (CSWS), the UrbaNe Workshop and a Student Workshop. The conference will be held at the Boscolo Plaza Hotel in downtown Nice. CoNEXT 2012 will give a registration discount for all participants who reserve their hotel room together with registration."
