["https://conffab.com"]
title = "Conffab – Web Directions"
description = "Your platform for world leading conferences– livestreamed and on demand."
full_description = "There's free, paid and premium options, or just browse our library of hundreds of presentations across product, design, front end dev, and more. No ads. Just hundreds of hours of product design, product management, front end and web dev presentations. Premium members get access to the live streams of all our in-person conferences, like our Developer Summit, Code, Code Leaders and more, plus partner conferences like Clarity, the Design Systems conference. Let's face it, we don't always have time to watch everything we want to. So, at Conffab, we've transcribed and captioned almost every presentation, with expert summaries, slides, speaker notes, self assessment tasks and additional resources for many as well. Conffab features hundreds of speakers, many you'll know, others you won't, but all experts in their field. And best of all, by watching, you'll be compensating them for their expertise. Watch their content, they get paid. We've started with presentations from our conferences going back years, alongside other conferences we love like Clarity, and Pixel Pioneers. And we're hard at work bringing you presentations from conferences all over the world, with plenty to come For experienced professionals, effective learning extends beyond just knowing what you need to improve—to discovering what you don't yet know. Conffab bridges this gap with a robust platform featuring live and on-demand conferences and presentations that serve as active training and development tools. With decades of leadership in industry education, we equip you with in-depth knowledge of emerging technologies and practices. Designed to integrate seamlessly into your continuous learning path, Conffab provides much more than just information. Our unique self-assessment tools allow you to measure your progress and adapt your learning journey making Conffab a key component in maintaining your knowledge and capabilities. Are you a conference organizer or speaker, and would like to get your presentations on Conffab? We'd love to talk! We'll host them, caption them, transcribe them and create accessible slides for them. And not only is that at no cost to you, but speakers and events generously share in the revenue their content generates—as is only right."
year_published = 2025
