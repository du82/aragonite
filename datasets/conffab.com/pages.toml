["https://conffab.com/about-conffab"]
title = "Conferences are broken (but we’re working to fix them) – Conffab"
description = "Your platform for world leading conferences– livestreamed and on demand."
full_description = "We believe conference presentation videos are broken. Actually, it’s bigger than that. We believe professional conferences are broken. We believe they serve everyone far less well than they could–presenters, event organisers, the audience, and the industry as a whole. And we believe we have a way to address this, which we hope will lead to an explosion of amazing presentations, and encourage the growth particularly of really focused events and deep dive content. We know, because we’ve been on all sides of the equation. We’ve organised dozens of commercial conferences, and community events small and large, over many years.We’ve spoken at events from small local meetups to keynoting at some of the biggest conferences in our industry. And we watch many many presentations, in person, and online, every year. Presenters put dozens, even hundreds of hours into their ideas, examples, slides, code, and if they are lucky they present it once, for little if any compensation, with the video available for free on Youtube, making no one other than Google money. Engagement with the audience is limited, at best to the Youtube comments associated with the video. Meanwhile, there’s little if any incentive for high profile presenters to develop new material with any great frequency. Events will often be fine with the same presentation someone has delivered multiple times. Which makes perfect sense for the presenter. Developing a great presentation is a staggering amount of work. But this means we get to see so much less from experts in our fields since it makes little economic sense for them to create more. But what if there were a way for presenters, both established and just starting out, to be compensated for all that effort, and the courage and generosity of sharing their knowledge and expertise? That would unlock much more of the capacity of speakers by rewarding them for new presentations? A way also to engage more directly, more professionally, with their audience, wherever they happen to be, whenever they happen to watch?"
year_published = 2025
clearnet = "https://conffab.com/about-conffab"
tags = ["audience", "audiences", "believe", "better?", "broken", "broken.", "conferences", "conffab", "organizers", "presenters"]
language = "en"
