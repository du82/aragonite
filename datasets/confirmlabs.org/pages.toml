title = "Confirm"
description = "Better token optimization to maximize SAE features."
full_description = "Confirm Labs Confirm Labs is a research group run by Michael Sklar and Ben Thompson. In April 2023, we transitioned into AI safety from our past work on statistical theory/software to speed up the FDA. We have two ongoing projects: Adversarial attacks: We believe that developing better white-box adversarial techniques can help with (a) evaluating model capabilities via red-teaming (b) model interpretability (c) providing data and feedback for safety-training pipelines. Recently, we have built methods for powerful and fluent adversarial attacks described in “Fluent Student-Teacher Redteaming”. Earlier this year, we published “Fluent Dreaming for Language Models” which combines whitebox optimization with interpretability. We also won a division of the NeurIPS 2023 Trojan Detection Competition. Pretraining AI editor architectures: We believe AI inspection of AI internals could become a useful component of AI interpretability and oversight. Inspired by the success of the pre-training paradigm in language models, we are designing models that are trained to understand the inner workings of a target model. In particular, we are building editor architectures that take as inputs the activations of a frozen target model as well as language-based editing instructions, and as their output will “puppet” the activation stream of the target model to achieve desired results. Fine-tuning the resulting model for interpretability tasks could result in powerful tools for interpretability or oversight. Articles Dreaming with sparse autoencoder features Better token optimization to maximize SAE features. T. Ben Thompson Oct 14, 2024 Fluent student-teacher redteaming How to use our jailbreaking code. T. Ben Thompson, Michael Sklar Jul 23, 2024 Breaking circuit breakers Refusal rates, token-forcing, internal attacks. T. Ben Thompson, Michael Sklar Jul 12, 2024 Fluent dreaming for language models Paper companion page. T. Ben Thompson, Zygimantas Straznickas, Michael Sklar Jan 23, 2024 Takeaways from the NeurIPS 2023 Trojan Detection Competition Summarizing our takeaways from TDC2023 Zygimantas Straznickas, T. Ben Thompson, Michael Sklar Jan 13, 2024 6 Ways to Fight the Interpretability Illusion Notes on using optimization and causal models for interpretability. Michael Sklar Nov 30, 2023 A catalog of several million tasks Pythia can do We’re sharing datasets that we hope will be useful for language model interpretability. T. Ben Thompson, Michael Sklar Jun 25, 2023 No matching items"
