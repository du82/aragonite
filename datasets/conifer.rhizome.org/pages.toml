["https://conifer.rhizome.org"]
title = "Conifer | Homepage"
description = "Collect and revisit web pages — Free, open-source web archiving service."
full_description = "ConiferCollect and revisit web pages.Conifer is a web archiving service that creates an interactive copy of any web page that you browse, including content revealed by your interactions such as playing video and audio, scrolling, clicking buttons, and so forth.Create a Free AccountExisting Users LoginFree accounts with 5GB of storage. Get more and support this project by becoming a supporter.Conifer is an online service based on Webrecorder software.Online Now ≠ Online TomorrowLinks break. Information is removed from the web. Services disappear and redesigns happen. Make sure that what’s important to you will stay available.Capture Complex WebpagesUnlike conventional crawler-based web archiving methods, Conifer’s approach allows even intricate websites, such as those with embedded media, complex Javascript, user-specific content and interactions, and other dynamic elements, to be captured and restaged.Autopilot Your CapturesCapturing pages on a popular web platform? Autopilot behaviors may be able to speed up your capture via automation.Advanced FeaturesLogin and CaptureCapture what you see on websites when you're logged into them, and share archived pages without revealing your credentials.Publish and ShareMake your collections publicly accessible or keep them private.Own Your DataDownload your web archives in the ISO standard WARC file format.Pre-configured browsers for best capturing resultsConifer's Remote Browser feature provides access to a range of preconfigured browsers running on the Conifer server. They offer for the most thorough capture of network traffic, and support for Flash.You can support a free platform for archiving the web.Conifer is an open source web archiving initiative by Rhizome, an institution supporting born-digital art and cultureBecoming a supporter or donor helps us offset our operational costs, keeping Conifer a sustainable project.Become a SupporterLearn moreConifer is a project of Rhizome, a registered 501(c)(3) non-profit organization. Your donations are tax-deductible."
year_published = 2025
clearnet = "https://conifer.rhizome.org"
