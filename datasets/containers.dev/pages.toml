["https://containers.dev/supporting"]
title = "Supporting tools and services"
description = "Development containers documentation and specification page."
full_description = "This page outlines tools and services that currently support the Development Container Specification, including the devcontainer.json format. A devcontainer.json file in your project tells tools and services that support the dev container spec how to access (or create) a dev container with a well-defined tool and runtime stack. While most dev container properties apply to any devcontainer.json supporting tool or service, a few are specific to certain tools, which are outlined below. Please note that the Dev Containers extension and GitHub Codespaces support these VS Code properties. Visual Studio added dev container support in Visual Studio 2022 17.4 for C++ projects using CMake Presets. It is part of the Linux and embedded development with C++ workload, so make sure it is selected in your VS installation. Visual Studio manages the lifecycle of dev containers it uses as you work, but it treats them as remote targets in a similar way to other Linux or WSL targets. IntelliJ IDEA has early support dev containers that can be run remotely via an SSH connection or locally using Docker. The Dev Container Command Line Interface (CLI) is a reference implementation for the Dev Container Spec. It is in development in the devcontainers/cli repo. It is intended both for use directly and by tools or services that want to support the spec. The CLI can take a devcontainer.json and create and configure a dev container from it. It allows for prebuilding dev container configurations using a CI or DevOps product like GitHub Actions. It can detect and include dev container features and apply them at container runtime, and run lifecycle scripts like postCreateCommand, providing more power than a plain docker build and docker run. The VS Code Dev Containers extension includes a variation of the Dev Container CLI that adds the ability use the command line to open a dev container in VS Code. It is also automatically updated when the extension updates. Press cmd/ctrl+shift+p or F1 and select the Dev Containers: Install devcontainer CLI command to install it."
year_published = 2025
clearnet = "https://containers.dev/supporting"
