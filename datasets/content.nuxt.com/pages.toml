title = "App Config - Nuxt Studio"
description = "Discover how to customize application config edition in Studio by providing schema. Ensure a smooth and structured content management experience."
full_description = "Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugStudioTailor application configuration editionDiscover how to customize application config edition in Studio by providing schema. Ensure a smooth and structured content management experience.When entering the Config tab of the editor, you can browse configurations to customize your website. These configurations represent the settings defined in your app.config.ts file.app.config.tsThe app.config.ts file is a configuration file introduced in Nuxt 3. It's a TypeScript file that allows you to configure various aspects of your application settings. Developers can easily turn any website into a configurable experience using this file.Customize editionEnsure you have at least an empty config file in your app.app.config.tsexport default defineAppConfig({}) To create a customized editing experience for your app.config.ts in Studio, you need to create a nuxt.schema.ts file in your project. This schema serves as a representation of your app.config.ts.HelpersThose helpers are provided by the Nuxt Content Preview API.The group method allows you to customize parent objects.The field method allows you to customize inputs (aka leaf).nuxt.schema.tsimport { field, group } from '@nuxt/content/preview' export default defineNuxtSchema({ appConfig: { parent: group({ title: 'Parent title', description: 'Parent description.', icon: 'i-icon-to-display', fields: { leaf: field({ type: 'Type of component used to edit your field', title: 'Field title', description: 'Field Description', icon: 'i-icon-to-display', default: 'default value' }) } }) } }) It is not mandatory to include all your app config keys; only those you wish to showcase on the Studio interface need to be added.Input TypesThe type in the field() method's first parameter can accept various values:stringnumberbooleanarrayobjecticonmediaBased on these values, the Studio UI will adapt to display the appropriate input type. For instance, an icon picker is displayed for icon type or the media library is displayed for media type.Text can be displayed as a select instead on a classical input if you provide a required key in the field() method:nuxt.schema.tsimport { field, group } from '@nuxt/content/preview' export default defineNuxtSchema({ appConfig: { parent: group({ title: 'UI', description: 'UI configuration', icon: 'i-ph-palette-fill', fields: { primary: field({ type: 'string', title: 'Primary', description: 'Primary color of your UI.', icon: 'i-ph-palette', default: 'sky', required: ['sky', 'mint', 'rose', 'amber'] }) } }) } }) Edit on StudioOnce your schema is deployed. Any user can access the Data section and play with the generated form.Any update in the form will be directly applied to the app.config.ts file. You can review those changes on the review page.Previewnuxt.schema.tsexport default defineNuxtSchema({ ui: group({ title: 'UI', description: 'UI Customization.', icon: 'i-mdi-palette-outline', fields: { primary: field({ type: 'string', title: 'Primary', description: 'Primary color of your UI.', icon: 'i-mdi-palette-outline', required: ['sky', 'mint', 'rose', 'amber', 'violet', 'emerald', 'fuchsia', '...'] }), gray: field({ ... }), icons: group({ title: 'Icons', description: 'Manage icons used in UI Pro.', icon: 'i-mdi-application-settings-outline', fields: { search: field({ ...}), dark: field({ ... }), light: field({ ... }), external: field({ ...}), chevron: field({ ... }), hash: field({ ... }) } }) } }) }) Take a look at this section to validate your schema in local development.For a practical example, take a look at the schema we've developed for the UI Pro Docs starter.html pre.shiki code .s8pZq, html code.shiki .s8pZq{--shiki-light:#39ADB5;--shiki-light-font-style:italic;--shiki-default:#89DDFF;--shiki-default-font-style:italic;--shiki-dark:#89DDFF;--shiki-dark-font-style:italic}html pre.shiki code .swgpB, html code.shiki .swgpB{--shiki-light:#6182B8;--shiki-default:#82AAFF;--shiki-dark:#82AAFF}html pre.shiki code .sndM8, html code.shiki .sndM8{--shiki-light:#90A4AE;--shiki-default:#EEFFFF;--shiki-dark:#BABED8}html pre.shiki code .s86vT, html code.shiki .s86vT{--shiki-light:#39ADB5;--shiki-default:#89DDFF;--shiki-dark:#89DDFF}html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html pre.shiki code .sIEYB, html code.shiki .sIEYB{--shiki-light:#91B859;--shiki-default:#C3E88D;--shiki-dark:#C3E88D}html pre.shiki code .sd2Uz, html code.shiki .sd2Uz{--shiki-light:#E53935;--shiki-default:#F07178;--shiki-dark:#F07178}Media LibraryExplore how to browse and manage media files, and integrate them into your projects using Nuxt Content Studio CMS features.Local DebugValidate your customization in local development.On this pageOn this pageapp.config.tsCustomize editionHelpersInput TypesEdit on StudioCommunityEdit this pageStar on GitHubChat on Discord"
