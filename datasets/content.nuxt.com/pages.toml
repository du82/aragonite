["https://content.nuxt.com/docs/advanced/llms"]
title = "AI-ready content files(`llms.txt`) - Nuxt Content"
description = "Learn how to generate AI-ready content files using Nuxt Content and the Nuxt LLMs module."
full_description = "Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugAdvancedAI-ready content files(`llms.txt`)Learn how to generate AI-ready content files using Nuxt Content and the Nuxt LLMs module.LLMs IntegrationThe Nuxt Content module seamlessly integrates with nuxt-llms to prepare your content for Large Language Models (LLMs). When nuxt-llms is detected, Content module automatically extends the LLMs module and inject page collection to the LLMs module.Setup GuideFirst, install the required module:npm install nuxt-llms # or yarn add nuxt-llms Configure your nuxt.config.ts:// nuxt.config.ts export default defineNuxtConfig({ modules: ['@nuxt/content', 'nuxt-llms'], llms: { domain: 'https://your-site.com', title: 'Your Site Name', description: 'A brief description of your site', }, }) That's it!Nuxt Content will automatically detect Nuxt LLMs module and will create a section to each page collection.Custom SectionsThe Content module enhances the LLMs module by adding two key options to control content generation:contentCollection: Specifies which content collection to use as sourcecontentFilters: Defines filters to select specific content within the collectionWhen generating content, the module uses these options to fetch and process your content into LLM-friendly formats (llms.txt and llms_full.txt).All you need is to add your custom sections to the llms.sections array and define the contentCollection and contentFilters for each section.// nuxt.config.ts export default defineNuxtConfig({ modules: ['@nuxt/content', 'nuxt-llms'], llms: { domain: 'https://your-site.com', title: 'Your Site Name', description: 'A brief description of your site', sections: [ { title: 'Documentation', description: 'Technical documentation and guides', // Specify which content collection to use contentCollection: 'docs', // Filter content as needed contentFilters: [ { field: 'extension', operator: '=', value: 'md' }, // You can add more filters here ] }, ], }, }) If there is no section defined with the contentCollection option, the module will add page collections to the LLMs module.Content FilteringYou can use contentFilters to precisely control which content is included. Each filter consists of:field: The content property to checkoperator: Comparison operator (=, <>, >, <, LIKE, IN, NOT IN, IS NULL, IS NOT NULL, etc.)value: The value to compare againstExample filters:contentFilters: [ // Only include markdown files { field: 'extension', operator: '=', value: 'md' }, // Only include published content { field: 'draft', operator: '<>', value: true }, // Filter by directory { field: 'path', operator: 'LIKE', value: '/guide%' }, ] Checkout the nuxt-llms documentation for more information on how to use the LLMs module.html pre.shiki code .sYGMc, html code.shiki .sYGMc{--shiki-light:#E2931D;--shiki-default:#FFCB6B;--shiki-dark:#FFCB6B}html pre.shiki code .sIEYB, html code.shiki .sIEYB{--shiki-light:#91B859;--shiki-default:#C3E88D;--shiki-dark:#C3E88D}html pre.shiki code .syuKq, html code.shiki .syuKq{--shiki-light:#90A4AE;--shiki-light-font-style:italic;--shiki-default:#546E7A;--shiki-default-font-style:italic;--shiki-dark:#676E95;--shiki-dark-font-style:italic}html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-