["https://content.nuxt.com/docs/getting-started"]
title = "Introduction - Nuxt Content"
description = "The powerful Git-based CMS designed specifically for Nuxt developers."
full_description = "Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugGetting StartedNuxt Content v3The powerful Git-based CMS designed specifically for Nuxt developers.Welcome to Nuxt Content v3, a major upgrade that brings enhanced performance and innovative features to your Nuxt projects. This latest iteration of our Git-based CMS is optimized for modern application development.What's New?Content CollectionsCollections organize related items within your project, helping you manage large datasets more efficiently. Key benefits include:Structured Data: Configure database architecture and define collections in content.config.tsType-safe Queries: Direct TypeScript integration across all utilitiesAutomatic Validation: Ensure data consistency across frontmatter fields and data files (json, yml...)Advanced Query Builder: Filter, sort, and paginate your collections with easeStudio Integration: Enhanced form generation and optimal editing experience through StudioLearn more about Content Collections.Improved PerformanceA significant challenge in v2 was the large bundle size needed for storing files, particularly affecting serverless deployments.V3 addresses this by transitioning to SQL-based storage in production. This switch requires zero configuration, supporting development mode, static generation, server hosting, serverless and edge deployments.The new database system enhances the way your data files are stored and structured, ensuring better performance and scalability. This update is entirely behind the scenes and does not affect the file types you can use in Content (yml, json, and markdown ).Benefits include:Optimized Queries: SQL storage enables ultra-fast data retrievalUniversal Compatibility: Our adapter-based system integrates SQL databases across all deployment modes (server, serverless and static). We welcome community contributions for additional adapters.TypeScript IntegrationThe new collections system provides automatic TypeScript types for all your data. Every utility and API is strongly typed based on your collection definitions, ensuring robust type safety throughout development.Nuxt Studio Integration SoonNuxt Studio and v3 are designed to complement each other perfectly.. The studio module is now integrated directly into Nuxt Content, creating an ideal environment where developers can focus on code while team members manage content through an intuitive interface.We're excited for you to explore these new capabilities. Dive into our documentation to learn more about integrating the module and implementing best practices in your next project.Content V2 MigrationLearn how to migrate from Content v2 to v3 in the migration guide. InstallationGet started with Nuxt Content v3 in your Nuxt application.On this pageOn this pageWhat's New?Content CollectionsImproved PerformanceTypeScript IntegrationNuxt Studio Integration SoonContent V2 MigrationCommunityEdit this pageStar on GitHubChat on Discord"
