title = "Docker - Nuxt Content"
description = "Deploy your Content app with Docker"
full_description = '''Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugDeployDockerDeploy your Content app with DockerDocker is a popular containerization platform that allows you to package your application with all its dependencies into a single container. This makes it easy to deploy your Content app on any platform that supports Docker.With Node.js imageUsing Docker's Node.js image, you can deploy your Content app. All you need is to create a Dockerfile and build the image. Here is an example Dockerfile:Dockerfile# Build Stage 1 FROM node:22-alpine AS build WORKDIR /app RUN corepack enable # Copy package.json and your lockfile, here we add pnpm-lock.yaml for illustration COPY package.json pnpm-lock.yaml .npmrc ./ # Install dependencies RUN pnpm i # Copy the entire project COPY . ./ # Build the project RUN pnpm run build # Build Stage 2 FROM node:22-alpine WORKDIR /app # Only `.output` folder is needed from the build stage COPY --from=build /app/.output/ ./ # Change the port and host ENV PORT 80 ENV HOST 0.0.0.0 EXPOSE 80 CMD ["node", "/app/server/index.mjs"] With Bun imageIf you like to use Bun, you can use the official Bun image. Here is an example Dockerfile:Dockerfile# use the official Bun image # see all versions at https://hub.docker.com/r/oven/bun/tags FROM oven/bun:1 AS build WORKDIR /app COPY package.json bun.lockb ./ # use ignore-scripts to avoid builting node modules like better-sqlite3 RUN bun install --frozen-lockfile --ignore-scripts # Copy the entire project COPY . . RUN bun --bun run build # copy production dependencies and source code into final image FROM oven/bun:1 AS production WORKDIR /app # Only `.output` folder is needed from the build stage COPY --from=build /app/.output /app # run the app EXPOSE 3000/tcp ENTRYPOINT [ "bun", "--bun", "run", "/app/server/index.mjs" ] html pre.shiki code .syuKq, html code.shiki .syuKq{--shiki-light:#90A4AE;--shiki-light-font-style:italic;--shiki-default:#546E7A;--shiki-default-font-style:italic;--shiki-dark:#676E95;--shiki-dark-font-style:italic}html pre.shiki code .smPcV, html code.shiki .smPcV{--shiki-light:#F76D47;--shiki-default:#F78C6C;--shiki-dark:#F78C6C}html pre.shiki code .sndM8, html code.shiki .sndM8{--shiki-light:#90A4AE;--shiki-default:#EEFFFF;--shiki-dark:#BABED8}html pre.shiki code .sIEYB, html code.shiki .sIEYB{--shiki-light:#91B859;--shiki-default:#C3E88D;--shiki-dark:#C3E88D}html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}NetlifyDeploy your Content app to NetlifyStaticHow to deploy Nuxt Content to static hosting with static site generation.On this pageOn this pageWith Node.js imageWith Bun imageCommunityEdit this pageStar on GitHubChat on Discord'''
