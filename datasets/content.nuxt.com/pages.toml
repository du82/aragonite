["https://content.nuxt.com/blog/studio-v2"]
title = "Introducing Nuxt Studio v2"
description = "We are excited to announce the v2 release of Nuxt Studio, the new editing experience for your Nuxt Content website"
full_description = "BlogIntroducing Nuxt Studio v2StudioJune 13, 2024Introducing Nuxt Studio v2We are excited to announce the v2 release of Nuxt Studio, the new editing experience for your Nuxt Content websiteBLBaptiste Leproux@larbishThis article was published before the merge of the Content and Studio modules on January 6, 2025. As a result, it may contain some inconsistencies. The Studio module is now deprecated and available as an opt-in feature of the Content module. Learn how to enable it in this guide.We are excited to announce the release of Nuxt Studio v2, a major update bringing a brand new interface designed specifically for our users, based on their feedback.Studio is optimized for Nuxt Content project but the only real requirement is to have a content folder with Markdown files. This simple setup is enough to start editing and publishing your files with the platform.A more intuitive interfaceThe main improvement in Version 2 is a complete rework of the interface. We have designed it to be more intuitive and user-friendly, especially for non-technical users. Our goal was to simplify the user experience, making it easier to create and set up projects with minimal hassle. The new interface is light, straightforward, and designed to streamline your workflow.Google authenticationWe now have two different authentication methods. You can either login with GitHub or with Google. Both methods give you the same edition rights but since Studio is synchronized with GitHub, some features are specific to GitHub users, especially project creation.Since a Google user can not create a project, he has to join a team with existing projects to edit them.Minimal setup to edit your filesYou can now edit your content without any setup, just import your repository and this is it. You can navigate through your files and medias, edit your content and publish on GitHub.Collaboration is available for teams.Medias in the editor are not displayed until you set up the live preview (see section below).Simplified setup for live previewAs the live preview feature requires a deployed URL, we made it as simple as possible to set it up.While GitHub pages deployment remains available and still does not require any configuration on your end, requirements have been simplified for self-hosted project as we removed the token verification. Enabling the Studio module is the only remaining requirement.It's crucial to use the latest version of the Studio module to ensure compatibility and access to new features.New documentationWith a revamped platform comes a new documentation. Don't hesitate to check it out to learn everything about the new Studio.Whether you are an editor or a developer you now have your dedicated section in the docs.A new direction for StudioMost available CMS solutions have to choose between being very customizable for developers or highly user friendly for content editors, with Studio we want to do both.The developer provides the tools for the editors to focus on content, without requiring any technical knowledge.Our Notion-like editor has a bright future ahead, and we want to develop it collaboratively with the community.Start with Studio todayGet started for freeRead docs ← Back to blog Copy URL Behind the scenes of Nuxt Studio's visual editorDiscover the inner workings of Nuxt Studio's visual editor and how it interprets the Markdown syntax and generate it back. On this pageOn this pageA more intuitive interfaceGoogle authenticationMinimal setup to edit your filesSimplified setup for live previewNew documentationA new direction for StudioLinksFollow on XFollow on BlueskyChat on Discord"
year_published = 2024
