full_description = "TemplatesCanvasFreeCanvas - The i18n portfolio template By HugoRCDPreviewUse itThis is a fully customizable portfolio template with internationalization.Canvas Portfolio is a fully customizable i18n portfolio template built with Nuxt and Nuxt UI, designed to help you showcase your work, testimonials, and key information with ease. The template integrates with Nuxt Studio for a smooth editing experience, while leveraging Nuxt Content for content management. Built with performance, flexibility, and responsiveness in mind, Canvas Portfolio provides a robust foundation for developers and creatives alike.Modern Components & Layouts – Includes built-in components.Nuxt UI v3 – Utilize pre-built, customizable UI components.NuxtHub ready - Deploy on NuxtHub in seconds.Tailwind CSS – A beautiful, responsive design system.Working Contact Form – Integrated with Resend for easy email handling.Multi-language Support – Powered by Nuxt i18n.SEO-Ready – Open Graph Image (Nuxt OG Image) & Nuxt Robots for automatic robots.txt generation.Good practices – Auto-generated sitemap, optimized images (Nuxt Image), and ESLint (Nuxt config with Flat config).Fully Responsive – Adapts to all modern browsers and devices.Minimal & Professional Design – Clean, elegant, and easy to customize. Features Nuxt ArchitectureNuxt Studio readyVue ComponentsWrite MarkdownDeploy anywhereExtensible"
