["https://content.nuxt.com/docs/studio/team@nuxt.studio"]
title = "The git-based CMS for Nuxt projects."
description = "Nuxt Content is a module for Nuxt that provides a simple way to manage content for your application. It allows developers to write their content in Markdown, YAML, or JSON files and then query and display it in their application."
full_description = '''The git-based CMS for Nuxt projects.Nuxt Content is a module for Nuxt that provides a simple way to manage content for your application. It allows developers to write their content in Markdown, YAML, CSV or JSON files and then query and display it in their application.Get StartedOpen Visual EditorFile-based CMSWrite your content in Markdown, YAML, CSV or JSON and query it in your components.Query BuilderQuery your content with a MongoDB-like API to fetch the right data at the right time.SQLite poweredAdd custom fields to your content, making it suitable for various types of projects.Markdown with VueUse Vue components in Markdown files, with props, slots and nested components.Code highlightingDisplay beautiful code blocks on your website with the Shiki integration supporting VS Code themes.Visual EditorLet your team edit your Nuxt Content project with Nuxt Studio, our visual editor.Navigation GenerationGenerate a structured object from your content files and display a navigation menu in minutes.Prose ComponentsCustomize HTML typography tags with Vue components to give your content a consistent style.Deploy everywhereNuxt Content works on all hosting providers, static, server, serverless & edge.Everything you need for content managementCombine file-based simplicity with Vue component power. Build content-rich websites, from documentation pages to complex applications.Markdown meets Vue componentsWe created the MDC syntax to let you use Vue components with props and slots inside your Markdown files.Specify props with frontmatter syntaxUse components slots with #Add any other html attributesLearn more about MDCPreviewcontent/index.mdcomponents/LandingHero.vueThe Everest.The Everest is the highest mountain in the world, standing at 8,848 meters above sea level.--- title: The Mountains Website description: A website about the most iconic mountains in the world. --- ::landing-hero --- image: /mountains/everest.png --- #title The Everest. #description The Everest is the highest mountain in the world, standing at 8,848 meters above sea level. :: <script setup lang="ts"> defineProps<{ image: string }>() </script> <template> <section class="flex flex-col sm:flex-row sm:items-center flex-col-reverse gap-4 py-8 sm:gap-12 sm:py-12"> <div> <h1 class="text-4xl font-semibold"> <slot name="title" /> </h1> <div class="text-base text-gray-600 dark:text-gray-300"> <slot name="description" /> </div> </div> <img :src="image" class="w-1/2 rounded-lg"> </section> </template> Query with Type-SafetyDefine your content structure with collections and query them with schema validation and full type-safety.Create collections for similar content filesDefine schema for the collection frontmatterGet auto-completion in your Vue filesLearn more about content collectionspages/blog.vuecontent.config.ts<script setup lang="ts"> const { data: posts } = await useAsyncData('blog', () => { return queryCollection('blog').all() }) </script> <template> <div> <h1>Blog</h1> <ul> <li v-for="post in posts" :key="post.id"> <NuxtLink :to="post.path">{{ post.title }}</NuxtLink> </li> </ul> </div> </template> import { defineContentConfig, defineCollection, z } from '@nuxt/content' export default defineContentConfig({ collections: { blog: defineCollection({ source: 'blog/*.md', type: 'page', // Define custom schema for docs collection schema: z.object({ tags: z.array(z.string()), image: z.string(), date: z.Date() }) }) } }) Let anyone edit your websiteEdit your Nuxt Content website with Studio, our CMS platform with Notion-like Markdown editor and generated forms for YAML and JSON files. Live preview and online collaboration included.Visual editor with drag and drop for MarkdownForm generation for YML and JSON filesInvite editors to login with Google and publish changesDiscover StudioAdd a git-based CMS to your Nuxt project.Start reading docsOpen Studiohtml pre.shiki code .s86vT, html code.shiki .s86vT{--shiki-light:#39ADB5;--shiki-default:#89DDFF;--shiki-dark:#89DDFF}html pre.shiki code .sd2Uz, html code.shiki .sd2Uz{--shiki-light:#E53935;--shiki-default:#F07178;--shiki-dark:#F07178}html pre.shiki code .sIEYB, html code.shiki .sIEYB{--shiki-light:#91B859;--shiki-default:#C3E88D;--shiki-dark:#C3E88D}html pre.shiki code .sndM8, html code.shiki .sndM8{--shiki-light:#90A4AE;--shiki-default:#EEFFFF;--shiki-dark:#BABED8}html pre.shiki code .s50WR, html code.shiki .s50WR{--shiki-light:#9C3EDA;--shiki-default:#C792EA;--shiki-dark:#C792EA}html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html pre.shiki code .swgpB, html code.shiki .swgpB{--shiki-light:#6182B8;--shiki-default:#82AAFF;--shiki-dark:#82AAFF}html pre.shiki code .sYGMc, html code.shiki .sYGMc{--sh