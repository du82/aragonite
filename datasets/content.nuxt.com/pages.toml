["https://content.nuxt.com/docs/utils/query-collection-search-sections"]
title = "queryCollectionSearchSections - Nuxt Content"
description = "The queryCollectionSearchSections composable generates searchable sections from a collection for enhanced content discovery."
full_description = '''Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugQuery UtilsqueryCollectionSearchSectionsThe queryCollectionSearchSections composable generates searchable sections from a collection for enhanced content discovery.Typefunction queryCollectionSearchSections(collection: keyof Collections, opts?: { ignoredTags: string[] }): ChainablePromise<T, Section[]> interface ChainablePromise<T extends keyof PageCollections, R> extends Promise<R> { where(field: keyof PageCollections[T] | string, operator: SQLOperator, value?: unknown): ChainablePromise<T, R> andWhere(groupFactory: QueryGroupFunction<PageCollections[T]>): ChainablePromise<T, R> orWhere(groupFactory: QueryGroupFunction<PageCollections[T]>): ChainablePromise<T, R> order(field: keyof PageCollections[T], direction: 'ASC' | 'DESC'): ChainablePromise<T, R> } UsageUse the auto-imported queryCollectionSearchSections to generate searchable sections from a specific collection. This is particularly useful for creating advanced search functionality or content discovery features in your application.app.vue<script> const { data: sections } = await useAsyncData('search-sections', () => { return queryCollectionSearchSections('docs') }) </script> The queryCollectionSearchSections utility is available in both Vue and Nitro. Checkout Server Usage for more details on how to use it on the server side.APIqueryCollectionSearchSections(collection: CollectionName, options?: SearchSectionsOptions)Generate searchable sections from the specified collection.Parameters: collection: The key of the defined collection in content.config.ts.options: (Optional) An object with the following properties: ignoredTags: An array of tag names to ignore when generating sections. Default is an empty array.Returns: A Promise that resolves to an array of searchable sections. Each section is an object with the following properties: id: A unique identifier for the section.title: The title of the section (usually the heading text).titles: An array of parent section titles, representing the hierarchy.content: The textual content of the section.level: The heading level (1-6) of the section, where 1 is the highest level.ExampleHere's an example of how to use queryCollectionSearchSections to create searchable sections from the 'docs' collection:pages/[...slug].vue<script> const { data: surround } = await useAsyncData('foo-surround', () => { return queryCollectionSearchSections('docs', { ignoredTags: ['code'] }) }) </script> Server UsageNuxt Content provides a similar utility to query collections on the server side. The only difference is that you need to pass event as the first argument to the queryCollectionSearchSections function.server/api/search-sections.tsexport default eventHandler(async (event) => { const sections = await queryCollectionSearchSections(event, 'docs') return sections }) Make sure to create server/tsconfig.json file with the following content to avoid type error.{ "extends": "../.nuxt/tsconfig.server.json" } html pre.shiki code .s50WR, html code.shiki .s50WR{--shiki-light:#9C3EDA;--shiki-default:#C792EA;--shiki-dark:#C792EA}html pre.shiki code .swgpB, html code.shiki .swgpB{--shiki-light:#6182B8;--shiki-default:#82AAFF;--shiki-dark:#82AAFF}html pre.shiki code .s86vT, html code.shiki .s86vT{--shiki-light:#39ADB5;--shiki-default:#89DDFF;--shiki-dark:#89DDFF}html pre.shiki code .sK9QF, html code.shiki .sK9QF{--shiki-light:#90A4AE;--shiki-light-font-style:italic;--shiki-default:#EEFFFF;--shiki-default-font-style:italic;--shi