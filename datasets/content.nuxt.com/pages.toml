["https://content.nuxt.com/blog/ui-pro-docs-migration"]
title = "Migrate Nuxt UI Pro Documentation Starter"
description = "How to upgrade your Nuxt UI Pro documentation to Content and UI v3"
full_description = '''BlogMigrate Nuxt UI Pro Documentation StarterMigrationJanuary 21, 2025Migrate Nuxt UI Pro Documentation StarterHow to upgrade your Nuxt UI Pro documentation to Content and UI v3BLBaptiste Leproux@larbishHow to upgrade your Nuxt documentation website to Content x UI v32025 kicks off with the power of 3!This start of year is marked by major updates to our favorite tools. The UI team is about to launch version 3 of the UI / UI Pro libraries (currently in alpha), while the Content team has already released Nuxt Content v3.These updates mean that all our starter templates combining Content and UI will need to be updated to align with the latest versions. To help you make the transition, this guide walks through migrating the Nuxt UI Pro Docs Starter to the new Content v3 and Nuxt UI v3 packages.Check the UI Pro documentation starter repository source code.Content migration (v2 → v3)1. Update package to v3pnpmyarnnpmbunpnpm add @nuxt/content@^3 yarn add @nuxt/content@^3 npm install @nuxt/content@^3 bun add @nuxt/content@^3 2. Create content.config.ts fileThis configuration file defines your data structure. A collection represents a set of related items. In the case of the docs starter, there are two different collections, the landing collection representing the home page and another docs collection for the documentation pages.content.config.tsimport { defineContentConfig, defineCollection, z } from '@nuxt/content' export default defineContentConfig({ collections: { landing: defineCollection({ type: 'page', source: 'index.yml' }), docs: defineCollection({ type: 'page', source: { include: '**', exclude: ['index.yml'] }, schema: z.object({ links: z.array(z.object({ label: z.string(), icon: z.string(), to: z.string(), target: z.string().optional() })).optional() }) }) } }) On top of the built-in fields provided by the page type, we added the extra field links to the docs collection so we can optionally display them in the docs page header.The type: page means there is a 1-to-1 relationship between the content file and a page on your site.3. Migrate app.vueNavigation fetch can be updated by moving from fetchContentNavigation to queryCollectionNavigation methodapp.vue (v3)app.vue (v2)const { data: navigation } = await useAsyncData('navigation', () => queryCollectionNavigation('docs')) const { data: navigation } = await useAsyncData('navigation', () => fetchContentNavigation()) Content search command palette data can use the new queryCollectionSearchSections methodapp.vue (v3)app.vue (v2)const { data: files } = useLazyAsyncData('search', () => queryCollectionSearchSections('docs'), { server: false, }) const { data: files } = useLazyFetch<ParsedContent[]>('/api/search.json', { default: () => [], server: false }) 4. Migrate landing pageHome page data fetching can be updated by moving from queryContent to queryCollection methodindex.vue (v3)index.vue (v2)const { data: page } = await useAsyncData('index', () => queryCollection('landing').path('/').first()) const { data: page } = await useAsyncData('index', () => queryContent('/').findOne()) useSeoMeta can be populated using the seo field provided by the page typeindex.vueuseSeoMeta({ title: page.value.seo.title, ogTitle: page.value.seo.title, description: page.value.seo.description, ogDescription: page.value.seo.description }) Please note that the seo field is automatically overridden by the root title and description if not set.5. Migrate catch-all docs pageDocs page data and surround fetching can be updated and mutualised by moving from queryContent to queryCollection and queryCollectionItemSurroundings methodsdocs/[...slug].vue (v3)docs/[...slug].vue (v2)const { data } = await useAsyncData(route.path, () => Promise.all([ queryCollection('docs').path(route.path).first(), queryCollectionItemSurroundings('docs', route.path, { fields: ['title', 'description'], }), ]), { transform: ([page, surround]) => ({ page, surround }), }) const page = computed(() => data.value?.page) const surround = computed(() => data.value?.surround) const { data: page } = await useAsyncData(route.path, () => queryContent(route.path).findOne()) const { data: surround } = await useAsyncData(`${route.path}-surround`, () => queryContent() .where({ _extension: 'md', navigation: { $ne: false } }) .only(['title', 'description', '_path']) .findSurround(withoutTrailingSlash(route.path)) ) Populate useSeoMeta with the seo field provided by the page typeindex.vueuseSeoMeta({ title: page.value.seo.title, ogTitle: `${page.value.seo.title} - ${seo?.siteName}`, description: page.value.seo.description, ogDescription: page.value.seo.description }) Please note that the seo field is automatically overridden by the root title and description if not set.6. Update typesTypes have been significantly enhanced in Content v3, eliminating the need for most manual typings, as they are now directly provided by the Nuxt Content APIs.Concerning the documentation starter, the only typing needed concerns the navigation items where NavItem can be replaced by ContentNavigationItem .import type { ContentNavigationItem } from '@nuxt/content' const navigation = inject<Ref<ContentNavigationItem[]>>('navigation') 7. Replace folder metadata filesAll _dir.yml files become .navigation.yml8. Migrate Studio activationSince the studio module has been deprecated and a new generic Preview API has been implemented directly into Nuxt Content, we can remove the @nuxthq/studio package from our dependencies and from the nuxt.config.ts modules.Instead we just need to enable the preview mode in the Nuxt configuration file by binding the Studio API.nuxt.config.tsexport default defineNuxtConfig({ content: { preview: { api: 'https://api.nuxt.studio' } }, }) Finally, in order to keep the app config file updatable from Studio, we just need to update the helper import of the nuxt.schema.ts file from @nuxthq/studio/theme to @nuxt/content/preview.That's it, content v3 is now powering the starter. Let's now migrate to version 3 of Nuxt UI / UI Pro.Nuxt UI Pro Migration (v1 → v3)This is a migration case, it won't cover all breaking changes introduced by the version upgrade. You should check each component you're using in the documentation to know if you need updates concerning props, slots or styles.1. Setup package to v3To maintain consistency with the UI versioning, which transitioned from v1 to v2. The Nuxt UI Pro version 2 is being skipped, and the update jumps directly to v3.Install the Nuxt UI v3 alpha packagepnpmyarnnpmbunpnpm add @nuxt/ui-pro@next yarn add @nuxt/ui-pro@next npm install @nuxt/ui-pro@next bun add @nuxt/ui-pro@next Add the module in the Nuxt configuration fileIt's no longer required to add @nuxt/ui in modules as it is automatically imported by @nuxt/ui-pro .nuxt.config.ts (v3)nuxt.config.ts (v1)export default defineNuxtConfig({ modules: ['@nuxt/ui-pro'] }) export default defineNuxtConfig({ extends: ['@nuxt/ui-pro'], modules: ['@nuxt/ui'] }) Nuxt UIPro V3 is now considered as a module and no longer as a layer.Import Tailwind CSS and Nuxt UI Pro in your CSSassets/css/main.css@import "tailwindcss"; @import "@nuxt/ui-pro"; nuxt.config.tsexport default defineNuxtConfig({ modules: ['@nuxt/ui-pro'], css: ['~/assets/css/main.css'] }) Remove tailwind config file and use CSS-first themingNuxt UI v3 uses Tailwind CSS v4 that follows a CSS-first configuration approach. You can now customize your theme with CSS variables inside a @theme directive.Delete the tailwind.config.ts fileUse the @theme directive to apply your theme in main.css fileUse the @source directive in order for Tailwind to detect classes in markdown files.assets/css/main.css@import "tailwindcss"; @import "@nuxt/ui-pro"; @source "../content/**/*"; @theme { --font-sans: 'DM Sans', sans-serif; --color-green-50: #EFFDF5; --color-green-100: #D9FBE8; --color-green-200: #B3F5D1; --color-green-300: #75EDAE; --color-green-400: #00DC82; --color-green-500: #00C16A; --color-green-600: #00A155; --color-green-700: #007F45; --color-green-800: #016538; --color-green-900: #0A5331; --color-green-950: #052E16; } 2. Update ui overloads in app.config.tsAll overloads using the ui props in a component or the ui key in the app.config.ts are obsolete and need to be checked in the UI / UI Pro documentation.app.config.ts (v3)app.config.ts (v1)export default defineAppConfig({ ui: { colors: { primary: 'green', neutral: 'slate' } }, uiPro: { footer: { slots: { root: 'border-t border-gray-200 dark:border-gray-800', left: 'text-sm text-gray-500 dark:text-gray-400' } } }, } export default defineAppConfig({ ui: { primary: 'green', gray: 'slate', footer: { bottom: { left: 'text-sm text-gray-500 dark:text-gray-400', wrapper: 'border-t border-gray-200 dark:border-gray-800' } } }, }) 3. Migrate error.vue pageNew UError component can be used as full page structure.error.vue (v3)error.vue (v1)<template> <div> <AppHeader /> <UError :error="error" /> <AppFooter /> <ClientOnly> <LazyUContentSearch :files="files" :navigation="navigation" /> </ClientOnly> </div> </template> <template> <div> <AppHeader /> <UMain> <UContainer> <UPage> <UPageError :error="error" /> </UPage> </UContainer> </UMain> <AppFooter /> <ClientOnly> <LazyUContentSearch :files="files" :navigation="navigation" /> </ClientOnly> <UNotifications /> </div> </template> 4. Migrate app.vue pageMain, Footer and LazyUContentSearch components do not need any updates in our case.Notification component can be removed since Toast components are directly handled by the App component.Instead of the NavigationTree component you can use the NavigationMenu component or the ContentNavigation component to display content navigation.Header.vue (v3)Header.vue (v1)<script> // Content navigation provided by queryCollectionNavigation('docs') const navigation = inject<Ref<ContentNavigationItem[]>>('navigation') </script> <template> <UHeader> <template #content> <UContentNavigation highlight :navigation="navigation" /> </template> </UHeader> </template> <script> // Content navigation provided by fetchContentNavigation() const navigation = inject<Ref<NavItem[]>>('navigation') </script> <template> <UHeader> <template #panel> <UNavigationTree :links="mapContentNavigation(navigation)" /> </template> </UHeader> </template> 5. Update landing pageWe've decided to move the landing content from YML to Markdown .This decision was made because components used in Markdown no longer need to be exposed globally (nor do they need to be created in the components/content folder). Content v3 handles it under the hood.Update content configurationcontent.config.tsexport default defineContentConfig({ collections: { landing: defineCollection({ type: 'page', source: 'index.md' }), docs: defineCollection({ type: 'page', source: { include: '**', exclude: ['index.md'] }, ... }) } }) Use ContentRenderer to render Markdownprose property must be set to false in ContentRendered as we don't want Mardown to be applied with prose styling in the case of a landing page integrating non prose Vue components.index.vue (v3)index.vue (v1)<template> <UContainer> <ContentRenderer v-if="page" :value="page" :prose="false" /> </UContainer> </template> <template> <div> <ULandingHero v-if="page.hero" v-bind="page.hero" > <template #headline> <UBadge v-if="page.hero.headline" variant="subtle" size="lg" class="relative rounded-full font-semibold" > <NuxtLink :to="page.hero.headline.to" target="_blank" class="focus:outline-none" tabindex="-1" > <span class="absolute inset-0" aria-hidden="true" /> </NuxtLink> {{ page.hero.headline.label }} <UIcon v-if="page.hero.headline.icon" :name="page.hero.headline.icon" class="ml-1 w-4 h-4 pointer-events-none" /> </UBadge> </template> <template #title> <MDC :value="page.hero.title" /> </template> <MDC :value="page.hero.code" class="prose prose-primary dark:prose-invert mx-auto" /> </ULandingHero> <ULandingSection :title="page.features.title" :links="page.features.links" > <UPageGrid> <ULandingCard v-for="(item, index) of page.features.items" :key="index" v-bind="item" /> </UPageGrid> </ULandingSection> </div> </template> Migrate Vue components to MDCMove all components in index.md following the MDC syntax.Landing components have been reorganised and standardised as generic Page components.LandingHero => PageHeroLandingSection => PageSectionLandingCard => PageCard (we'll use the PageFeature instead)Have a look at the final Markdown result on GitHub.6. Migrate docs pageLayoutAside component has been renamed to PageAside .ContentNavigation component can be used (instead of NavigationTree) to display the content navigation returned by queryCollectionNavigation.layout/docs.vue (v3)layout/docs.vue (v1)<template> <UContainer> <UPage> <template #left> <UPageAside> <UContentNavigation highlight :navigation="navigation" /> </UPageAside> </template> <slot /> </UPage> </UContainer> </template> <template> <UContainer> <UPage> <template #left> <UAside> <UNavigationTree :links="mapContentNavigation(navigation)" /> </UAside> </template> <slot /> </UPage> </UContainer> </template> Catch-all pagesDivider has been renamed to SeparatorfindPageHeadline must be imported from #ui-pro/utils/contentprose property does not exist no more on PageBody component.That's it! The docs starter is now fully running on both UI and Content v3 🎉Edit on StudioIf you're using Nuxt Studio to edit your documentation you also need to migrate the related code.The Studio module has been deprecated and a new generic Preview API has been implemented directly into Nuxt Content, you can remove the @nuxthq/studio package from your dependencies and from thenuxt.config.ts modules. Instead you just need to enable the preview mode in the Nuxt configuration file by binding the Studio API.nuxt.config.tsexport default defineNuxtConfig({ content: { preview: { api: 'https://api.nuxt.studio' } }, }) In order to keep the app config file updatable from Studio you need to update the helper import of the nuxt.schema.ts file from @nuxthq/studio/theme to @nuxt/content/preview.html pre.shiki code .sYGMc, html code.shiki .sYGMc{--shiki-light:#E2931D;--shiki-default:#FFCB6B;--shiki-dark:#FFCB6B}html pre.shiki code .sIEYB, html code.shiki .sIEYB{--shiki-light:#91B859;--shiki-default:#C3E88D;--shiki-dark:#C3E88D}html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: '''
