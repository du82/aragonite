["https://content.nuxt.com/docs/collections/sources"]
title = "Sources - Nuxt Content"
description = "Learn how to import your files in Nuxt Content collections."
full_description = '''Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugCollectionsCollection SourcesLearn how to import your files in Nuxt Content collections.Nuxt Content provides several ways to import content files into your collection. You can configure the source by using the source property within defineCollection:content.config.tsimport { defineCollection, defineContentConfig } from '@nuxt/content' export default defineContentConfig({ collections: { docs: defineCollection({ source: '**', type: 'page' }) } }) sourceThe source property can be defined as either a string (following a glob pattern) or an object, allowing more detailed source configuration for your target directory and files within the content folder.Example:source: '** includes all files within the content directory and its subdirectories.source: '**/*.md'includes all Markdown files within the content directory and its subdirectories.source: 'docs/**/*.yml' includes all YML files within the content/docs and its subdirectories.source: '**/*.{json,yml}' includes JSON or YML file within the content directory and all its subdirectories.source: '*.json' includes only JSON files located directly within the content directory, excluding any subdirectories.includeGlob pattern of your target repository and files in the content folder.excludeGlob patterns to exclude content from the import.prefixThis configuration only applied for page type with 1-to-1 relationship between content files and pages on your site.It represents the path prefix (base URL) of the corresponding page on the website.The prefix must start by a leading /.By default, module extracts the static prefix of source(or source.include) and uses it as a prefix for content paths. For example, if you define /en/** source, module will auto-fill the prefix with /en. You can manually provide a prefix to override this behavior. The prefix can be removed by setting prefix: '/' in the collection source.defineCollection({ type: "page", source: { include: "en/**", exclude: ["en/index.md"], prefix: '/' } }) cwdRoot directory for content matching.Example:If you want to include files from a folder outside the content directory, set the absolute path of that folder to the cwd property.source: { cwd: path.resolve('packages/my-pkg/docs'), include: '**/*.md', } repositoryExternal source representing a remote git repository URL (e.g., https://github.com/nuxt/content)authTokenAuthentication token for private repositories (e.g., GitHub personal access token).html pre.shiki code .s8pZq, html code.shiki .s8pZq{--shiki-light:#39ADB5;--shiki-light-font-style:italic;--shiki-default:#89DDFF;--shiki-default-font-style:italic;--shiki-dark:#89DDFF;--shiki-dark-font-style:italic}html pre.shiki code .s86vT, html code.shiki .s86vT{--shiki-light:#39ADB5;--shiki-default:#89DDFF;--shiki-dark:#89DDFF}html pre.shiki code .sndM8, html code.shiki .sndM8{--shiki-light:#90A4AE;--shiki-default:#EEFFFF;--shiki-dark:#BABED8}html pre.shiki code .sIEYB, html code.shiki .sIEYB{--shiki-light:#91B859;--shiki-default:#C3E88D;--shiki-dark:#C3E88D}html pre.shiki code .swgpB, html code.shiki .swgpB{--shiki-light:#6182B8;--shiki-default:#82AAFF;--shiki-dark:#82AAFF}html pre.shiki code .sd2Uz, html code.shiki .sd2Uz{--shiki-light:#E53935;--shiki-default:#F07178;--shiki-dark:#F07178}html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html pre.shiki code .sYGMc, html code.shiki .sYGMc{--shiki-light:#E2931D;--shiki-default:#FFCB6B;--shiki-dark:#FFCB6B}TypesLearn about the two types of collections you can define in Nuxt Content.MarkdownCreate and query Markdown files in your Nuxt applications and use the MDC syntax to integrate Vue components.On this pageOn this pagesourceincludeexcludeprefixcwdrepositoryauthTokenCommunityEdit this pageStar on GitHubChat on Discord'''
