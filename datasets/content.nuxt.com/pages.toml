full_description = '''Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugComponentsProse ComponentsSourceA list of Prose components.Prose components are replacements for HTML typography tags. Prose components provide a simple way to customize content UI.To overwrite a prose component, create a component with the same name in your project components/content/ directory (ex: components/content/ProseA.vue).Prose components are originally part of @nuxtjs/mdc.ProseACodePreview[Link](/docs/components/prose) LinkProseBlockquoteCodePreview> Block quote Block quoteProsePreCodePreview ```js [file.js]{2} meta-info=val export default () => { console.log('Code block') } ``` file.jsexport default () => { console.log('Code block') } Component properties will be:{ code: "export default () => {\n console.log('Code block')\n}" language: "js" filename: "file.js" highlights: [2] meta: "meta-info=val" } Check out the highlight options for more about the syntax highlighting.If you want to use ] in the filename, you need to escape it with 2 backslashes: \\]. This is necessary since JS will automatically escape the backslash in a string so \] will be resolved as ] breaking our regex.ProseCodeCodePreview`code` `const code: string = 'highlighted code inline'`{lang="ts"} codeconst code: string = 'highlighted code inline'ProseH1CodePreview# H1 Heading H1 HeadingProseH2CodePreview## H2 Heading H2 HeadingProseH3CodePreview### H3 Heading H3 HeadingProseH4CodePreview#### H4 Heading H4 HeadingProseH5CodePreview##### H5 Heading H5 Head