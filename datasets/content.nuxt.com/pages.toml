full_description = "Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugDeployCloudflare PagesDeploy your Content app to Cloudflare PagesQuick SetupUse nuxi build --preset=cloudflare_pages to build your appCreate D1 database and connect to your project in Cloudflare Dashboard under DB binding nameDeploy/Redeploy your appNuxt Content module has a built-in integration with Cloudflare Pages to deploy your content.Module will automatically detects the build target and prepare the necessary configuration for Cloudflare Pages. Content module currently only support cloudflare-pages presets.You can either use --preset=cloudflare_pages option on nuxi build command or use nuxt.config.ts to configure the preset.export default defineNuxtConfig({ nitro: { preset: 'cloudflare_pages', }, }); The module requires a D1 database to be connected to the app in order to work. By default it will use the DB binding name. You can override the database configuration by providing your own database configuration in nuxt.config.ts.After creating a new Cloudflare Pages project, you need to create a new D1 database and connect it to the project. Make sure to use the same binding name as the module is using. (default is DB)That's it 🎉Checkout:Nuxt Deploy documentationCloudflare D1 documentationCloudflare Pages documentationhtml pre.shiki code .s8pZq, html code.shiki .s8pZq{--shiki-light:#39ADB5;--shiki-light-font-style:italic;--shiki-default:#89DDFF;--shiki-default-font-style:italic;--shiki-dark:#89DDFF;--shiki-dark-font-style:italic