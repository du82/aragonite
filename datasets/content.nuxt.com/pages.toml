["https://content.nuxt.com/docs/studio/content"]
title = "Content Editors - Nuxt Studio"
description = "Discover and select your favorite way to manage your content between the visual or the code editor."
full_description = '''Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugStudioEdit your contentDiscover and select your favorite way to manage your content between the visual or the code editor.Nuxt Studio offers a versatile workspace for both developers and content writers, giving them the freedom to choose between our differents editors:Notion-like editor for Markdown filesForm editor for YAML and JSON filesCode editor for any kind of files (for technical users only)You can choose your favorite editor from the settings page of your project.Each editor serves its own purpose. Some users are used to code edition, while others prefer a non-technical, visual approach. At the end, code syntax is the final output for both editors.Notion-like editor (Markdown files)This editor is heavily inspired by Notion, well known for its intuitive design and flexibility. Much like a standard text editor, this editor is designed to be familiar and easy to use. However, it stands out with its additional features that improve the writing experience.You want to know how we've built this editor and how it works under the hood? Check this blog post.FrontmatterFrontmatter is a convention of Markdown-based CMS to provide meta-data to pages, like description or title or any other data you would like to store as key: value pair.Based on the user collection and schema provided, a form is generated to edit this metadata from the editor.Check this section to learn more about form generation based on schema.ToolbarHighlight your text to reveal the toolbar, giving you access to all the standard text editing features (title formatting, Bold, Italic, Strike-through, code, link, class, bullet list, numerated list...).MediasUsers can simply drag and drop images directly into the editor. An upload modal will open to let you choose the destination folder.By typing / and searching for Image or Video, they can quickly insert a media. A modal will open to let them choose the media they want to insert from the media gallery (aka thepublic folder of the Nuxt application).From the media modal, you can set the alt attribute for SEO and accessibility purpose.Vue ComponentsOne of this editor standout features is its ability to integrate and customize any complex Vue component directly within the editor.Create and integrate your own componentA developer can create any kind of visually complex components and editors will be able to use them and focus on the content. An editor can also play with the component properties, styles, and behaviour to fit its specific requirements as long as the developer made it customisable.Create your componentYou can create Vue components and integrate them into Markdown. They just need to be located in the /components/content folder to be available.components/content/HomeFeature.vue<template> <div class="flex items-start gap-3"> <div class="flex items-center justify-center border rounded-lg p-1.5"> <UIcon :name="icon" /> </div> <div class="flex flex-col"> <h3 class="font-semibold"> <ContentSlot name="title" /> </h3> <span> <ContentSlot name="description" /> </span> </div> </div> </template> <script setup lang="ts"> defineProps({ icon: { type: String, default: 'i-ph-cursor-click', }, }) </script> Integrate these components easily within any Markdown file using MDC syntaxcontent/index.md::home-feature --- icon: i-mdi-vuejs --- #title Embedded Vue components #description Edit slots and props inside the Notion-like editor. :: Edit them with our Studio editorsThe visual editor simplifies the component edition, allowing you to integrate and edit them directly in the visual editor. Non technical users can play with slots and props without any technical knowledge.All components in the /components/content folder are available in the editor. Studio users can type / anywhere while editing to access the list of available components.Take a look at this section to validate your Vue component integration in the editor in local development.Integrate built-in components from external librariesBy default, you can integrate any component inside a Markdown file and it should work and be editable from Studio but external components won't be displayed in the components list in Studio and can't be integrated manually by a Studio editor.To list this component inside Studio and fetch all its metadata, you need to set it as global in your Nuxt config file.Here is an example to integrate Button and Icon components from the Nuxt UI library:export default defineNuxtConfig({ hooks: { 'components:extend': (components) => { const globals = components.filter(c => ['UButton', 'UIcon'].includes(c.pascalName)) globals.forEach(c => c.global = true) } }, }) Form editorThis editor is used whether you’re editing the frontmatter of a Markdown file or a JSON / YAML file.It eliminates the need to interact directly with complex file syntax. Instead, a form is automatically generated based on the provided user collection schema.Defining your form with zod SchemaLearn more about schema collection definition in the dedicated section.Once the schema property has been defined in your collection, this will automatically generate the corresponding form on Studio interface.content.config.tsGenerated Formexport default defineContentConfig({ collections: { posts: defineCollection({ type: 'page', source: 'blog/*.md', schema: z.object({ draft: z.boolean().default(false), category: z.enum(['Alps', 'Himalaya', 'Pyrenees']).optional(), date: z.date(), image: z.object({ src: z.string().editor({ input: 'media' }), alt: z.string(), }), slug: z.string().editor({ hidden: true }), icon: z.string().optional().editor({ input: 'icon' }), authors: z.array(z.object({ slug: z.string(), username: z.string(), name: z.string(), to: z.string(), avatar: z.object({ src: z.string(), alt: z.string(), }), })), }), }), }, }) Native Inputs MappingPrimitive Zod types are automatically mapped to appropriate form inputs in:String → Text inputDate → Date pickerNumber → Number input (counter)Boolean → Toggle switchEnum → Select dropdownArrays of strings → List of badge inputsArrays of objects → Accordion of items with embedded formCustom Inputs MappingStudio goes beyond primitive types. You can customise form fields using the editor method, which extends Zod types with metadata to empower editor interface.This allows you to define custom inputs or hide fields.Usagecontent.config.tsmainScreen: z.string().editor({ input: 'media' }) Optionsinput: 'media' | 'icon'You can set the editor input type. Currently icon and media are available.hidden: BooleanThis option can be set to avoid the display of a field in the Studio editor.Studio inputs are fully extensible. We can create as many input as we want based on our users needs.Code editorEven though the two previous editors are dedicated to a specific file extension (md or yaml/json). The code editor can be used with any kind of file.It provides full control over your content, allowing you to write raw content directly:MDC syntax for Markdown filesJSON or YAML syntaxWhen your file is saved with the code editor, the content is stored exactly as you've written it, preserving all specific syntax and formatting. This editor is ideal for users comfortable with code syntax (Markdown, YAML or JSON) who want precise control over structure of their content.html pre.shiki code .s86vT, html code.shiki .s86vT{--shiki-light:#39ADB5;--shiki-default:#89DDFF;--shiki-dark:#89DDFF}html pre.shiki code .sd2Uz, html code.shiki .sd2Uz{--shiki-light:#E53935;--shiki