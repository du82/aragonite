["https://content.nuxt.com/docs/collections/define"]
title = "Define - Nuxt Content"
description = "Learn how to define and configure content collections in your Nuxt application."
full_description = '''Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugCollectionsDefine Content CollectionsLearn how to define and configure content collections in your Nuxt application.The Nuxt Content module automatically parses any content files within the content/ directory located at the root of your Nuxt application. This setup allows you to freely structure the folder to suit your project's needs.For better organization, consider using Content Collections, which let you categorize and manage content more effectively. These collections are defined in a content.config.ts file.If no content.config.ts file is present, all files within the content folder are parsed and imported by default. However, once a config file is added, only files matching the specified path patterns defined in collections will be imported.What are Content Collections?Content Collections organize related items within your Nuxt Content project. They provide a structured way to manage your content, making it easier to query, display, and maintain your site's data.Key features include:Logical Grouping: Group similar content together, such as blog posts, product pages, or documentation articlesShared Configuration: Apply common settings and validations across all items within a collectionImproved Querying: Fetch and filter related content items efficientlyAutomatic Type Inference: Get type safety and autocompletion in your development environmentFlexible Structure: Organize collections by content type, category, or any other logical grouping that suits your needsDefining CollectionsCreate a content.config.ts file in your project's root directory. This special file configures your collections database, utility types, and content handling.Here's a basic example:content.config.tsimport { defineCollection, defineContentConfig } from '@nuxt/content' export default defineContentConfig({ collections: { docs: defineCollection({ // Load every file inside the `content` directory source: '**', // Specify the type of content in this collection type: 'page' }) } }) Currently, a document is designed to be present in only one collection at a time. If a file is referenced in multiple collections, live reload will not work correctly. To avoid this, it is recommended to use the exclude attribute to explicitly exclude a document from other collections using appropriate regex patterns.This topic is still under discussion in this issue: nuxt/content#2966.Collection SchemaSchemas enforce data consistency within a collection and serve as the source of truth for TypeScript types.On top of the built-in fields, you can define a schema by adding the schema property to your collection by using a zod schema:content.config.tsimport { defineCollection, defineContentConfig, z } from '@nuxt/content' export default defineContentConfig({ collections: { blog: defineCollection({ source: 'blog/*.md', type: 'page', // Define custom schema for docs collection schema: z.object({ tags: z.array(z.string()), image: z.string(), date: z.date() }) }) } }) @nuxt/content exposes a z object that contains a set of Zod schemas for common data types. Check the Zod’s README for complete documentation on how Zod works and what features are available.You can define as many collections as you want to organize different types of content.Querying CollectionsUse the queryCollection util to fetch one or all items from a collection:pages/blog.vue<script setup lang="ts"> const { data: posts } = await useAsyncData('blog', () => queryCollection('blog').all()) </script> <template> <div> <h1>Blog</h1> <ul> <li v-for="post in posts" :key="post.id"> <NuxtLink :to="post.path">{{ post.title }}</NuxtLink> </li> </ul> </div> </template> Learn more about the available query options in our queryCollections API documentation.defineCollection()The defineCollection function defines a collection in your content configuration. Here's its TypeScript signature:function defineCollection(collection: Collection): DefinedCollection type Collection = { // Determines how content is processed type: 'page' | 'data' // Specifies content location source?: string | CollectionSource // Zod schema for content validation and typing schema?: ZodObject<T> } Learn more about collection types.type CollectionSource = { // Glob pattern for content matching include: string // .path prefix (only applies to 'page' type) prefix?: string // Glob patterns to exclude content exclude?: string[] // Root directory for content matching cwd?: string // Remote git repository URL (e.g., https://github.com/nuxt/content) repository?: string // Authentication token for private repositories (e.g., GitHub personal access token) authToken?: string } Learn more about collection sources.The function returns the defined collection object.html pre.shiki code .s8pZq, html code.shiki .s8pZq{--shiki-light:#39ADB5;--shiki-light-font-style:italic;--shiki-default:#89DDFF;--shiki-default-font-style:italic;--shiki-dark:#89DDFF;--shiki-dark-font-style:italic}html pre.shiki code .s86vT, html code.shiki .s86vT{--shiki-light:#39ADB5;--shiki-default:#89DDFF;--shiki-dark:#89DDFF}html pre.shiki code .sndM8, html code.shiki .sndM8{--shiki-light:#90A4AE;--shiki-default:#EEFFFF;--shiki-dark:#BABED8}html pre.shiki code .sIEYB, html code.shiki .sIEYB{--shiki-light:#91B859;--shiki-default:#C3E88D;--shiki-dark:#C3E88D}html pre.shiki code .swgpB, html code.shiki .swgpB{--shiki-light:#6182B8;--shiki-default:#82AAFF;--shiki-dark:#82AAFF}html pre.shiki code .sd2Uz, html code.shiki .sd2Uz{--shiki-light:#E53935;--shiki-default:#F07178;--shiki-dark:#F07178}html pre.shiki code .syuKq, html code.shiki .syuKq{--shiki-light:#90A4AE;--shiki-light-font-style:italic;--shiki-default:#546E7A;--shiki-default-font-style:italic;--shiki-dark:#676E95;--shiki-dark-font-style:italic}html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html pre.shiki code .s50WR, html code.shiki .s50WR{--shiki-light:#9C3EDA;--shiki-default:#C792EA;--shiki-dark:#C792EA}html pre.shiki code .sK9QF, html code.shiki .sK9QF{--shiki-light:#90A4AE;--shiki-light-font-style:italic;--shiki-default:#EEFFFF;--shiki-default-font-style:italic;--shiki-dark:#BABED8;--shiki-dark-font-style:italic}html pre.shiki code .sYGMc, html code.shiki .sYGMc{--shiki-light:#E2931D;--shiki-default:#FFCB6B;--shiki-dark:#FFCB6B}MigrationHow to migrate from v2 to v3TypesLearn about the two types of collections you can define in Nuxt Content.On this pageOn this pageWhat are Content Collections?Defining CollectionsCollection SchemaQuerying CollectionsdefineCollection()CommunityEdit this pageStar on GitHubChat on Discord'''
