full_description = "Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugDeployNuxtHubDeploy your Content app to NuxtHubQuick SetupInstall the @nuxthub/core module nuxi module add hubUse npx nuxthub deploy to deploy your content to NuxtHubNuxt Content module has a built-in integration with NuxtHub to deploy your content.To enable NuxtHub integration, you need to install the @nuxthub/core module and register it in your nuxt.config.ts. More efficiently, you can use nuxi module command to do both at once.npx nuxi module add hub That's it 🎉Now you can use the npx nuxthub deploy command to deploy your content to NuxtHub.npx nuxthub deploy Nuxt Content module automatically enables NuxtHub database. And update database configuration to use Cloudflare D1 with DB binding name. (This is default configuration for NuxtHub database.)You can override the database configuration by providing your own database configuration in nuxt.config.ts.Checkout the NuxtHub documentation for more information.html pre.shiki code .sYGMc, html code.shiki .sYGMc{--shiki-light:#E2931D;--shiki-default:#FFCB6B;--shiki-dark:#FFCB6B}html pre.shiki code .sIEYB, html code.shiki .sIEYB{--shiki-light:#91B859;--shiki-default:#C3E88D;--shiki-dark:#C3E88D}html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki