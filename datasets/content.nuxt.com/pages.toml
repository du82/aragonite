["https://content.nuxt.com/docs/utils/query-collection-item-surroundings"]
title = "queryCollectionItemSurroundings - Nuxt Content"
description = "The queryCollectionItemSurroundings composable looks for sibling contents of an specific path."
full_description = '''Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugQuery UtilsqueryCollectionItemSurroundingsThe queryCollectionItemSurroundings composable looks for sibling contents of an specific path.Typefunction queryCollectionItemSurroundings<T extends keyof PageCollections>( collection: T, path: string, opts?: SurroundOptions<keyof PageCollections[T]> ): ChainablePromise<T, ContentNavigationItem[]> interface ChainablePromise<T extends keyof PageCollections, R> extends Promise<R> { where(field: keyof PageCollections[T] | string, operator: SQLOperator, value?: unknown): ChainablePromise<T, R> andWhere(groupFactory: QueryGroupFunction<PageCollections[T]>): ChainablePromise<T, R> orWhere(groupFactory: QueryGroupFunction<PageCollections[T]>): ChainablePromise<T, R> order(field: keyof PageCollections[T], direction: 'ASC' | 'DESC'): ChainablePromise<T, R> } UsageUse the auto-imported queryCollectionItemSurroundings to find the previous and next items relative to a specific content item in a collection. This is particularly useful for creating navigation between related content pages.The function returns a chainable promise that allows you to add additional query conditions:pages/[...slug].vue<script setup lang="ts"> const { data } = await useAsyncData('surround', () => { return queryCollectionItemSurroundings('docs', '/foo') .where('published', '=', true) .order('date', 'DESC') }) </script> The queryCollectionItemSurroundings utility is available in both Vue and Nitro. Checkout Server Usage for more details on how to use it on the server side.APIqueryCollectionItemSurroundings(collection: CollectionName, path: string, opts?: SurroundOptions)Find the surrounding items (previous and next) for a specific content item in a collection.Parameters: collection: The key of the defined collection in content.config.ts.path: The path of the current content item.opts: (Optional) An object with the following properties: before: (Optional) The number of items to fetch before the current item. Default is 1.after: (Optional) The number of items to fetch after the current item. Default is 1.fields: (Optional) An array of additional fields to include in the surrounding items.Returns: A chainable promise that resolves to an array containing the surrounding items. The promise includes methods for adding query conditions: where(field, operator, value): Add a WHERE conditionandWhere(groupFactory): Add a grouped AND conditionorWhere(groupFactory): Add a grouped OR conditionorder(field, direction): Add an ORDER BY clauseThe final result will be an array with the following structure:[previousItem, nextItem] if using default options[...previousItems, ...nextItems] if using custom before and after valuesEach item in the array is of type ContentNavigationItem or null if there is no item in that position.ExamplesBasic usage without additional query conditions:pages/[...slug].vue<script setup lang="ts"> const { data } = await useAsyncData('surround', () => { return queryCollectionItemSurroundings('docs', '/foo') }) </script> <template> <div class="flex justify-between"> <NuxtLink v-if="data?.[0]" :to="data[0].path"> ← {{ data[0].title }} </NuxtLink> <NuxtLink v-if="data?.[1]" :to="data[1].path"> {{ data[1].title }} → </NuxtLink> </div> </template> Example with additional query conditions:pages/[...slug].vue<script setup lang="ts"> const { data } = await useAsyncData('surround', () => { return queryCollectionItemSurroundings('docs', '/foo', { before: 1, after: 1, fields: ['badge', 'description'] }) .where('_draft', '=', false) .where('_partial', '=', false) .order('date', 'DESC') }) </script> Server UsageNuxt Content provides a similar utility to query collections on the server side. The only difference is that you need to pass event as the first argument to the queryCollectionItemSurroundings function.server/api/surroundings.tsexport default eventHandler(async (event) => { const surroundings = await queryCollectionItemSurroundings(event, 'docs', '/foo') return surroundings }) Make sure to create server/tsconfig.json file with the following content to avoid type error.{ "extends": "../.nuxt/tsconfig.server.json" } html pre.shiki code .s50WR, html code.shiki .s50WR{--shiki-light:#9C3EDA;--shiki-default:#C792EA;--shiki-dark:#C792EA}html pre.shiki code .swgpB, html code.shiki .swgpB{--shiki-light:#6182B8;--shiki-default:#82AAFF;--shiki-dark:#82AAFF}html pre.shiki code .s86vT, html code.shiki .s86vT{--shiki-light:#39ADB5;--shiki-default:#89DDFF;--shiki-dark:#89DDFF}html pre.shiki code .sYGMc, html code.shiki .sYGMc{--shiki-light:#E2931D;--shiki-default:#FFCB6B;--shiki-dark:#FFCB6B}html pre.shiki code .sK9QF, html code.shiki .sK9QF{--shiki-light:#90A4AE;--shiki-light-font-style:italic;--shiki-default:#EEFFFF;--shiki-default-font-style:italic;--shiki-dark:#BABED8;--shiki-dark-font-style:italic}html pre.shiki code .sndM8, html code.shiki .sndM8{--shiki-light:#90A4AE;--shiki-default:#EEFFFF;--shiki-dark:#BABED8}html pre.shiki code .sd2Uz, html code.shiki .sd2Uz{--shiki-light:#E53935;--shiki-default:#F07178;--shiki-dark:#F07178}html pre.shiki code .sIEYB, html code.shiki .sIEYB{--shiki-light:#91B859;--shiki-default:#C3E88D;--shiki-dark:#C3E88D}html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: 