title = "queryCollectionNavigation - Nuxt Content"
description = "The queryCollectionNavigation composable generates the navigation tree of given collection."
full_description = '''Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugQuery UtilsqueryCollectionNavigationThe queryCollectionNavigation composable generates the navigation tree of given collection.Typefunction queryCollectionNavigation<T extends keyof PageCollections>( collection: T, fields?: Array<keyof PageCollections[T]> ): ChainablePromise<T, ContentNavigationItem[]> interface ChainablePromise<T extends keyof PageCollections, R> extends Promise<R> { where(field: keyof PageCollections[T] | string, operator: SQLOperator, value?: unknown): ChainablePromise<T, R> andWhere(groupFactory: QueryGroupFunction<PageCollections[T]>): ChainablePromise<T, R> orWhere(groupFactory: QueryGroupFunction<PageCollections[T]>): ChainablePromise<T, R> order(field: keyof PageCollections[T], direction: 'ASC' | 'DESC'): ChainablePromise<T, R> } UsageUse the auto-imported queryCollectionNavigation to generate a navigation tree for a specific collection. This is particularly useful for creating dynamic navigation menus or sidebars based on your content structure.The function returns a chainable promise that allows you to add additional query conditions:pages/[...slug].vue<script setup lang="ts"> const { data } = await useAsyncData('navigation', () => { return queryCollectionNavigation('docs') .where('published', '=', true) .order('date', 'DESC') }) </script> The queryCollectionNavigation utility is available in both Vue and Nitro. Checkout Server Usage for more details on how to use it on the server side.Navigation metadata with .navigation.ymlYou can add metadata to a directory using a .navigation.yml file..navigation.ymltitle: Getting Started icon: i-lucide-square-play APIqueryCollectionNavigation(collection: CollectionName, extraField: keyof Collection)Generate a navigation tree for the specified collection.Parameters: collection: The key of the defined collection in content.config.ts.extraFields: (Optional) An array of additional fields to include in the navigation items. (By default title and path are included in the navigation items.)Returns: A chainable promise that resolves to a navigation tree structure. The promise includes methods for adding query conditions: where(field, operator, value): Add a WHERE conditionandWhere(groupFactory): Add a grouped AND conditionorWhere(groupFactory): Add a grouped OR conditionorder(field, direction): Add an ORDER BY clauseThe navigation tree is generated based on the directory structure and ordering happens based on files orderingExamplesBasic usage without additional query conditions:pages/[...slug].vue<script setup lang="ts"> const { data } = await useAsyncData('navigation', () => { return queryCollectionNavigation('docs') }) </script> <template> <nav> <ul v-if="data"> <li v-for="item in data" :key="item.path"> <NuxtLink :to="item.path">{{ item.title }}</NuxtLink> </li> </ul> </nav> </template> Example with additional query conditions and extra fields:pages/[...slug].vue<script setup lang="ts"> const { data } = await useAsyncData('navigation', () => { return queryCollectionNavigation('docs', ['description', 'badge']) .where('draft', '=', false) .where('partial', '=', false) .order('title', 'ASC') }) </script> <template> <nav> <ul v-if="data"> <li v-for="item in data" :key="item.path"> <NuxtLink :to="item.path"> {{ item.title }} <span v-if="item.badge" class="badge">{{ item.badge }}</span> </NuxtLink> <p v-if="item.description">{{ item.description }}</p> </li> </ul> </nav> </template> Server UsageNuxt Content provides a similar utility to query collections on the server side. The only difference is that you need to pass event as the first argument to the queryCollectionNavigation function.server/api/navigation.tsexport default eventHandler(async (event) => { const navigation = await queryCollectionNavigation(event, 'docs') return navigation }) Make sure to create server/tsconfig.json file with the following content to avoid type error.{ "extends": "../.nuxt/tsconfig.server.json" } html pre.shiki code .s50WR, html code.shiki .s50WR{--shiki-light:#9C3EDA;--shiki-default:#C792EA;--shiki-dark:#C792EA}html pre.shiki code .swgpB, html code.shiki .swgpB{--shiki-light:#6182B8;--shiki-default:#82AAFF;--shiki-dark:#82AAFF}html pre.shiki code .s86vT, html code.shiki .s86vT{--shiki-light:#39ADB5;--shiki-default:#89DDFF;--shiki-dark:#89DDFF}html pre.shiki code .sYGMc, html code.shiki .sYGMc{--shiki-light:#E2931D;--shiki-default:#FFCB6B;--shiki-dark:#FFCB6B}html pre.shiki code .sK9QF, html code.shiki .sK9QF{--shiki-light:#90A4AE;--shiki-light-font-style:italic;--shiki-default:#EEFFFF;--shiki-default-font-style:italic;--shiki-dark:#BABED8;--shiki-dark-font-style:italic}html pre.shiki code .sndM8, html code.shiki .sndM8{--shiki-light:#90A4AE;--shiki-default:#EEFFFF;--shiki-dark:#BABED8}html pre.shiki code .sd2Uz, html code.shiki .sd2Uz{--shiki-light:#E53935;--shiki-default:#F07178;--shiki-dark:#F07178}html pre.shiki code .sIEYB, html code.shiki .sIEYB{--shiki-light:#91B859;--shiki-default:#C3E88D;--shiki-dark:#C3E88D}html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html .default .shiki span {color: var(--shiki-default);backg