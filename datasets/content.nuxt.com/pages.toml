["https://content.nuxt.com/docs/getting-started/migration"]
title = "Migration - Nuxt Content"
description = "How to migrate from v2 to v3"
full_description = '''Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugGetting StartedMigrationHow to migrate from v2 to v3Nuxt Content v3 has been rebuilt from the ground up, resulting in a new library with enhanced capabilities. While we've redesigned concepts and components in a similar way as Content v2, breaking changes are inevitable.Don't worry, you don't need to modify your content files. We made sure that Content v3 handles content in the same way as Content v2.ChangesVue utilsqueryContent() API is replaced with new queryCollection()The new API is backed by SQL and content queries happens within a specific collection.fetchContentNavigation() API is replaced with new queryCollectionNavigation()Surroundings now has its own separate API queryCollectionItemSurroundings()Document driven mode is dropped: Markdown files will not convert to Nuxt pages automatically, you need to create pages, check this section to see how.useContent() composable is removedsearchContent() is dropped in favor of the new queryCollectionSearchSections APIFull text search can easily be done using the queryCollectionSearchSections API, check this section to see howComponentsAll content should be rendered using <ContentRenderer> component. <ContentDoc>, <ContentList>, <ContentNavigation> and <ContentQuery> components are dropped in v3.<ContentSlot> and <MDCSlot> components are not supported in v3. Instead components can simply use Vue's native <slot> component<ContentSlot> and <MDCSlot> was initially pro to manipulate content before rendering and removing wrapping paragraphs from slot content. This unwrapping behavior is now supported via mdc-unwrap attribute in <slot> component. Example: <slot mdc-unwrap="p" />Components created under the components/content directory are no longer automatically registered as global components. If you use dynamic rendering to render these components outside markdown files, you must manually register them in your Nuxt app. Check out the Nuxt - Custom Components Directories documentation for more information on how to do so.Typesimport type { NavItem } from '@nuxt/content/dist/runtime/types' is replaced with import type { ContentNavigationItem } from '@nuxt/content'General_dir.yml files are renamed to .navigation.ymlThere is no source option in module options, instead you can define multiple sources for your collections in content.config.ts.Document ._path is now renamed to .path, likewise all internal fields with _ prefix are removed or renamed.useContentHelpers() is removedModule does not ignore dot files by default, you can ignore them by adding ignore: ['**/.*'] in exclude options of your collection source.Nuxt Studio integrationThe studio module has been deprecated and a new generic Preview API has been implemented directly into Nuxt Content, you can remove the @nuxthq/studio package from your dependencies and from the nuxt.config.ts modules. Instead we just need to enable the preview mode in the Nuxt configuration file by binding the Studio API.nuxt.config.tsexport default defineNuxtConfig({ content: { preview: { api: 'https://api.nuxt.studio' } }, }) In order to keep the app config file updatable from Studio we just need to update the helper import of the nuxt.schema.ts file from @nuxthq/studio/theme to @nuxt/content/preview.Implement Document Driven mode in v3Implementing document driven mode in Content v3 is quite easy. All you need is to create a catch-all page in Nuxt and fetch contents based on route path.pages/[...slug].vue<script lang="ts" setup> const route = useRoute() const { data: page } = await useAsyncData(route.path, () => { return queryCollection('content').path(route.path).first() }) </script> <template> <div> <header><!-- ... --></header> <ContentRenderer v-if="page" :value="page" /> <footer><!-- ... --></footer> </div> </template> Converting queryContent to queryCollectionsAs we mentioned above, queryContent is dropped in favor of new collection based queryCollection. There are two main differences between these two:queryCollection is building a query for an SQL database.queryCollection does the search only inside the specified collection. You should know the collection's name (key on config).Find content with path// Content v2 const v2Query = await queryContent(route.path).findOne() // Content v3 - don't forget to create `content` collection in `content.config.ts` const v3Query = await queryCollection('content').path(route.path).first() Find contents with custom filter// Content v2 const v2Query = await queryContent() .where({ path: /^\/hello\/.*/ }) .find() // Content v3 - don't forget to create `content` collection in `content.config.ts` const v3Query = await queryCollection('content') .where('path', 'LIKE', '/hello%') .first() Check the dedicated section for more info about collectionsConvert queryContent().findSurround()Surround now has its own separate API.const targetPath = '/docs' // Content v2 const v2Surround = await queryContent(targetPath) .only(['title', 'description', 'navigation']) .findSurround(withoutTrailingSlash(route.path)) // Content v3 - don't forget to create `content` collection in `content.config.ts` const v3Surround = await queryCollectionItemSurroundings( 'content', targetPath, { fields: ['title', 'description', 'navigation'] } ) Check the dedicated section for more information about theConsolidate ProsePre, ProseCode, and ProseCodeInline componentsMany ProsePre components are thin wrappers around the ProseCode component. We've consolidated these three components into two components. There is now no difference between ProsePre and multi-line code blocks.MDC will now map and parse single backticks ` as ProseCode instead of ProseCodeInline.MDC will now map and parse block code starting with three backticks``` as ProsePre component.Suggested Changes:Your current ProseCode logic should be moved to ProsePreRename your ProseCodeInline components to ProseCode_dir.yml files are renamed to .navigation.ymlIn Content v3, we renamed _dir.yml to .navigation.yml. The new name better reflects the purpose of these files. Module uses these files to gather information about directories for generating navigation.Note that in order to make these files available for Module, youe should define your collection's source in a way that includes these files. For example source: '**' and source: '**/*.{md|yml} will include these files in collection, but source: '**/*.md' will not include them.Ignore dot filesBy default, Content v3 does not ignore dot files. If you want to ignore them, you can add ignore: ['**/.*'] in the exclude option of your collection source.defineCollection({ source: { include: '**', exclude: ['**/.*'] } }) Note that the above pattern will also excldue .navigation.yml file from collection. If you use .navigation.yml and want to keep them you can use **/.(!(navigation.yml)) patter to exclude all dot files except .navigation.yml.defineCollection({ source: { include: '**', exclude: ['**/.!(navigation.yml)'] } }) html pre.shiki code .s8pZq, html code.shiki .s8pZq{--shiki-light:#39ADB5;--shiki-light-font-style:italic;--shiki-default:#89DDFF;--shiki-default-font-style:italic;--shiki-dark:#89DDFF;--shiki-dark-font-style:italic}html pre.shiki code .swgpB, html code.shiki .swgpB{--shiki-light:#6182B8;--shiki-default:#82AAFF;--shiki-dark:#82AAFF}html pre.shiki code .sndM8, html code.shiki .sndM8{--shiki-light:#90A4AE;--shiki-default:#EEFFFF;--shiki-dark:#BABED8}html pre.shiki code .s86vT, html code.shiki .s86vT{--shiki-light:#39ADB5;--shiki-default:#89DDFF;--shiki-dark:#89DDFF}html pre.shiki code .sd2Uz, html code.shiki .sd2Uz{--shiki-light:#E53935;--shiki-default:#F07178;--shiki-dark:#F07178}html pre.shiki code .sIEYB, html code.shiki .sIEYB{--shiki-light:#91B859;--shiki-default:#C3E88D;--shiki-dark:#C3E88D}html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html pre.shiki code .s50WR, html code.shiki .s50WR{--shiki-light:#9C3EDA;--shiki-default:#C792EA;--shiki-dark:#C792EA}html pre.shiki code .syuKq, html code.shiki .syuKq{--shiki-light:#90A4AE;--shiki-light-font-style:italic;--shiki-default:#546E7A;--shiki-default-font-style:italic;--shiki-dark:#676E95;--shiki-dark-font-style:italic}ConfigurationNuxt Content is configured with sensible defaults.DefineLearn how to define and configure content collections in your Nuxt application.On this pageOn this pageChangesVue utilsComponentsTypesGeneralNuxt Studio integrationImplement Document Driven mode in v3Converting queryContent to queryCollectionsConvert queryContent().findSurround()Consolidate ProsePre, ProseCode, and ProseCodeInline components_dir.yml files are renamed to .navigation.ymlIgnore dot filesCommunityEdit this pageStar on GitHubChat on Discord'''
