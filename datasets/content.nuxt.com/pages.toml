title = "Vercel - Nuxt Content"
description = "Deploy your Content app to Vercel"
full_description = "Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugDeployVercelDeploy your Content app to VercelQuick SetupExeceute npx vercel deploy command or go to Vercel dashboard and create a new project using git repository.Nuxt Content projects can be deployed to Vercel with zero configuration. The module will automatically detects Vercel environment and prepare the necessary configuration for Vercel.All you need to do is to execute npx vercel deploy command or go to Vercel dashboard and create a new project using git repository.That's it 🎉By default module will use SQlite database in Vercel located at /tmp directory. You can override the database configuration by providing your own database configuration.There are a couple of database providers that are supported by Vercel. You can use any of them by providing the correct connection string in nuxt.config.ts.Checkout:Nuxt Deploy documentationVercel documentationCloudflare PagesDeploy your Content app to Cloudflare PagesNetlifyDeploy your Content app to Netlify"
