["https://content.nuxt.com/docs/components/slot"]
title = "Slot - Nuxt Content"
description = "The fastest way to inject Markdown into your Vue components."
full_description = '''Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugComponentsSlotThe fastest way to inject Markdown into your Vue components.When you write contents and paragraphs inside a component with the MDC syntax, you can use Vue's <slot> component to render the content.UsageIf you don't want to modify the rendered content, simply use Vue's <slot> component.components/content/Callout.vue<template> <div class="callout"> <slot /> </div> </template> Now let's use it in Markdown:content/index.md::callout This is a callout. :: The rendered HTML will be:<div class="callout"> <p>This is a callout.</p> </div> This usage would be similar to using the native <slot> component.UnwrappingThe mdc-unwrap prop allows you to remove one or multiple wrapping elements from the rendered content. This is useful when you want to extract the content nested in native Markdown syntax. Each specified tag will get removed from AST.Let's unwrap the <p> element from the previous example:components/content/Callout.vue<template> <div class="callout"> <slot mdc-unwrap="p" /> </div> </template> Now the rendered HTML will be:<div class="callout"> This is a callout. </div> Named SlotsThe name prop allows you to bind a slot by its name. This is useful when you want to render a slot that is not the default one.Let's improve our Callout component to have a title slot:components/content/Callout.vue<template> <div class="callout"> <h2 v-if="$slots.title"> <slot name="title" mdc-unwrap="p" /> </h2> <slot /> </div> </template> Now let's use it in Markdown:content/index.md::callout #title Please be careful! #default Using MDC & Vue components is addictive. :: This will result into:<div class="callout"> <h2>Please be careful!</h2> <p>Using MDC & Vue components is addictive.</p> </div> When not using the title slot, the h2 element will not be rendered.Propsmdc-unwrap: Whether to unwrap the content or not. This is useful when you want to extract the content nested in native Markdown syntax. Each specified tag will get removed from AST. Type: boolean or stringDefault: falseExample: 'p' or 'ul li'html pre.shiki code .s86vT, html code.shiki .s86vT{--shiki-light:#39ADB5;--shiki-default:#89DDFF;--shiki-dark:#89DDFF}html pre.shiki code .sd2Uz, html code.shiki .sd2Uz{--shiki-light:#E53935;--shiki-default:#F07178;--shiki-dark:#F07178}html pre.shiki code .s50WR, html code.shiki .s50WR{--shiki-light:#9C3EDA;--shiki-default:#C792EA;--shiki-dark:#C792EA}html pre.shiki code .sIEYB, html code.shiki .sIEYB{--shiki-light:#91B859;--shiki-default:#C3E88D;--shiki-dark:#C3E88D}html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html pre.shiki code .sndM8, html code.shiki .sndM8{--shiki-light:#90A4AE;--shiki-default:#EEFFFF;--shiki-dark:#BABED8}ContentRendererTakes your component from an AST to a wonderful template.Prose ComponentsA list of Prose components.On this pageOn this pageUsageUnwrappingNamed SlotsPropsCommunityEdit this pageStar on GitHubChat on Discord'''
