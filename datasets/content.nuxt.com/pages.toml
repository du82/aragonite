["https://content.nuxt.com/docs/deploy/serverless"]
title = "Serverless - Nuxt Content"
description = "How to deploy Nuxt Content on various serverless platforms."
full_description = '''Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugDeployServerless HostingHow to deploy Nuxt Content on various serverless platforms.What is Serverless Hosting?Serverless hosting lets you run code and applications without managing servers directly - you just upload your code and the cloud provider automatically handles all the infrastructure, scaling, and maintenance while charging you only for the actual compute resources you use.In serverless environments, each user request triggers a fresh instance of your Nuxt server, meaning it starts from scratch every time. This "stateless" nature means you can't store data in server memory or use file-based databases like SQLite. That's why we need to use external database services (like D1, Turso, or PostgreSQL) that persist data independently of your server instances.Deploy with ServerlessThe module have built-in support for couple of famous serverless platforms. You can deploy your project to them with ease. Checkout the guides for each platform:NuxtHubCloudflare PagesVercelIf you like to deploy to other platforms, you can follow below steps to deploy your project.1. Select a database serviceBefore deploying your project, you need to select a database service:PostgreSQLCloudflare D1LibSQLNuxtHub// 1. Create a PostgreSQL database // 2. And add the `POSTGRES_URL` to the env variables export default defineNuxtConfig({ content: { database: { type: 'postgres', url: process.env.POSTGRES_URL } } }) // 1. Create a D1 database in your CF account // 2. Link it to your project with the same binding name export default defineNuxtConfig({ content: { database: { type: 'd1', binding: '<YOUR_BINDING_NAME>' } } }) // 1. Create a LibSQL database on Turso.tech // 2. And add the `TURSO_DATABASE_URL` and `TURSO_AUTH_TOKEN` env variables export default defineNuxtConfig({ modules: ['@nuxt/content'], content: { database: { type: 'libsql', url: process.env.TURSO_DATABASE_URL, authToken: process.env.TURSO_AUTH_TOKEN, } } }) // Install the NuxtHub module (see hub.nuxt.com) export default defineNuxtConfig({ modules: ['@nuxt/content', '@nuxthub/core'], content: { database: { type: 'd1', binding: 'DB' } }, hub: { database: true } }) 2. Deploy your projectNuxt Content uses Nuxt deployment presets to adjust the build process for different hosting platforms.Various serverless platform are supported with zero configuration:CloudflareNuxtHubVercelNetlifyAll you need to do is to set the build command to:Terminalnuxi build The generated output will be compatible with the selected platform.The linked database will be loaded on the server side when booting the server. In the browser, a WASM SQLite database will be loaded for client-side navigation and actions.If you wish to deploy to AWS Lambda, you need to make sure your sqlite file is in /tmp since this is the only writeable folderexport default defineNuxtConfig({ modules: ['@nuxt/content'], content: { database: { type: 'sqlite', filename: '/tmp/contents.sqlite' } } }) 3. Optimize with pre-renderingAs each request trigger a fresh instance of your Nuxt server, the performance of your serverless application will be impacted if you don't pre-render some pages.To optimize your serverless application, you can pre-render your pages using the routeRules option:nuxt.config.tsexport default defineNuxtConfig({ routeRules: { '/': { prerender: true } } }) We recommend to checkout NuxtHub's Pre-rendering guide to learn more about the different strategies to optimize your serverless application, it applies to all serverless platforms.html pre.shiki code .syuKq, html code.shiki .syuKq{--shiki-light:#90A4AE;--shiki-light-font-style:italic;--shiki-default:#546E7A;--shiki-default-font-style:italic;--shiki-dark:#676E95;--shiki-dark-font-style:italic}html pre.shiki code .s8pZq, html code.shiki .s8pZq{--shiki-light:#39ADB5;--shiki-light-font-style:italic;--shiki-default:#89DDFF;--shiki-default-font-style:italic;--shiki-dark:#89DDFF;--shiki-dark-font-style:italic}html pre.shiki code .swgpB, html code.shiki .swgpB{--shiki-light:#6182B8;--shiki-default:#82AAFF;--shiki-dark:#82AAFF}html pre.shiki code .sndM8, html code.shiki .sndM8{--shiki-light:#90A4AE;--shiki-default:#EEFFFF;--shiki-dark:#BABED8}html pre.shiki code .s86vT, html code.shiki .s86vT{--shiki-light:#39ADB5;--shiki-default:#89DDFF;--shiki-dark:#89DDFF}html pre.shiki code .sd2Uz, html code.shiki .sd2Uz{--shiki-light:#E53935;--shiki-default:#F07178;--shiki-dark:#F07178}html pre.shiki code .sIEYB, html code.shiki .sIEYB{--shiki-light:#91B859;--shiki-default:#C3E88D;--shiki-dark:#C3E88D}html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html pre.shiki code .sPKOg, html code.shiki .sPKOg{--shiki-light:#FF5370;--shiki-default:#FF9CAC;--shiki-dark:#FF9CAC}html pre.shiki code .sYGMc, html code.shiki .sYGMc{--shiki-light:#E2931D;--shiki-default:#FFCB6B;--shiki-dark:#FFCB6B}ServerNode preset is the default preset for Nuxt and Nuxt Content. It is used to build and run Nuxt applications on Node.js.NuxtHubDeploy your Content app to NuxtHubOn this pageOn this pageWhat is Serverless Hosting?Deploy with Serverless1. Select a database service2. Deploy your project3. Optimize with pre-renderingCommunityEdit this pageStar on GitHubChat on Discord'''
