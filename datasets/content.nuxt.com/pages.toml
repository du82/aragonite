round: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html pre.shiki code .sYGMc, html code.shiki .sYGMc{--shiki-light:#E2931D;--shiki-default:#FFCB6B;--shiki-dark:#FFCB6B}html pre.shiki code .sIEYB, html code.shiki .sIEYB{--shiki-light:#91B859;--shiki-default:#C3E88D;--shiki-dark:#C3E88D}App ConfigDiscover how to customize application config edition in Studio by providing schema. Ensure a smooth and structured content management experience. On this pageOn this pagePurposeTutorialImport your project on StudioClone your repository on localEnable Nuxt Content preview in developmentLaunch your app using your dev command with --tunnel to expose it to the internetEnsure the metadata file has been generatedCopy the tunnel URL and copy it in the self-hosting section of the deployment tab on Studio platformCommunityEdit this pageStar on GitHubChat on Discord"
