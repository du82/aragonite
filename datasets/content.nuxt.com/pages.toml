["https://content.nuxt.com/docs/getting-started/installation"]
title = "Installation - Nuxt Content"
description = "Get started with Nuxt Content v3 in your Nuxt application."
full_description = '''Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugGetting StartedInstallationGet started with Nuxt Content v3 in your Nuxt application.Install the PackageChoose your preferred package manager to install Nuxt Content v3:pnpmyarnnpmbunpnpm add @nuxt/content yarn add @nuxt/content npm install @nuxt/content bun add @nuxt/content Register the ModuleAdd the Nuxt Content module to your nuxt.config.ts:nuxt.config.tsexport default defineNuxtConfig({ modules: ['@nuxt/content'] }) Create your First CollectionCreate a content.config.ts file in your project root directory:content.config.tsimport { defineContentConfig, defineCollection } from '@nuxt/content' export default defineContentConfig({ collections: { content: defineCollection({ type: 'page', source: '**/*.md' }) } }) This configuration creates a default content collection that processes all Markdown files located in the content folder of your project. You can customize the collection settings based on your needs.The type: page means there is a 1-to-1 relationship between content files and pages on your site.Learn more in our Collections guide.Create your First Markdown PageCreate a content/index.md file in your project root directory:content/index.md# My First Page Here is some content. Read more about writing Markdown pages.Display your PageCreate a pages/index.vue file and display the page content:pages/index.vue<script setup lang="ts"> const { data: home } = await useAsyncData(() => queryCollection('content').path('/').first()) useSeoMeta({ title: home.value?.title, description: home.value?.description }) </script> <template> <ContentRenderer v-if="home" :value="home" /> <div v-else>Home not found</div> </template> If you are installing Nuxt Content in a new Nuxt project and you didn't have pages directory, you also need to update the app.vue file to allow rendering the pages by adding the NuxtPage component. (If you already have some pages in your project, you are good to go.)app.vue<template> <NuxtLayout> <NuxtPage /> </NuxtLayout> </template> That's it! You've now created your first Nuxt Content page.html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html pre.shiki code .sYGMc, html code.shiki .sYGMc{--shiki-light:#E293