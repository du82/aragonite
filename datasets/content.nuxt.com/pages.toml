["https://content.nuxt.com/docs/advanced/tools"]
title = "Debugging tools - Nuxt Content"
description = "Debugging tools"
full_description = '''Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugAdvancedToolsDebugging toolsNuxt Content uses an SQLite database (contents.sqlite) to store and query content efficiently. If you're running into missing content, slow queries, or database issues, debugging your SQLite database can help!A simple way to inspect it? Use the SQLite VS Code extension!Install SQLite VS Code ExtensionOpen Visual Studio Code.Go to the Extensions panel (Ctrl+Shift+X / Cmd+Shift+X on Mac).Search for "SQLite" (by alexcvzz) and install it.Open your Nuxt Content database (.data/content/contents.sqlite).If you don't see contents.sqlite, start your Nuxt app first:Terminalnpx nuxi dev Locate Your SQLite DatabaseNuxt Content stores its database here:.data/content/contents.sqlite This file is automatically generated when you start your Nuxt app. No need to create it manually!Open & Explore the DatabaseRight-click on contents.sqlite in VS Code.Select "Open Database".Expand the Database Explorer panel to view tables & data.Fixing Common IssuesContent Not Showing?Check if the database exists (.data/content/contents.sqlite).Run a cleanup & restart Nuxt: Terminalnpx nuxi cleanup && npx nuxi dev Check if content is inside the database (run an SQL query).Manually Reset the DatabaseIf things seem really broken, try resetting it:Delete the database file: Terminalrm -rf .data/content/contents.sqlite Run cleanup to remove old caches: Terminalnpx nuxi cleanup Restart Nuxt to generate a fresh database: Terminalnpx nuxi dev Cleaning up will remove cached data. Don't worry—it regenerates automatically!More Debugging ToolsIf VS Code isn’t enough, check out:🖥️ DB Browser for SQLite – A visual tool for inspecting & modifying the database.🛠️ SQLite Command Line – Use sqlite3 contents.sqlite to run SQL queries from your terminal.html pre.shiki code .sYGMc, html code.shiki .sYGMc{--shiki-light:#E2931D;--shiki-default:#FFCB6B;--shiki-dark:#FFCB6B}html pre.shiki code .sIEYB, html code.shiki .sIEYB{--shiki-light:#91B859;--shiki-default:#C3E88D;--shiki-dark:#C3E88D}html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html pre.shiki code .s86vT, html code.shiki .s86vT{--shiki-light:#39ADB5;--shiki-default:#89DDFF;--shiki-dark:#89DDFF}SQL StorageHow Nuxt Content stores and retrieves contentHooksModify your content using Nuxt build time hooksOn this pageOn this pageInstall SQLite VS Code ExtensionLocate Your SQLite DatabaseOpen & Explore the DatabaseFixing Common IssuesContent Not Showing?Manually Reset the DatabaseMore Debugging ToolsCommunityEdit this pageStar on GitHubChat on Discord'''
