title = "Custom Source - Nuxt Content"
description = "Define a custom source to retrive data."
full_description = "Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugAdvancedCustom SourceDefine a custom source to retrive data.By default, Nuxt Content provides some built-in sources like local files source and remote Github source. However this is not enough for some cases, for example, you want to fetch data from a remote API. In this case, you can define a custom source to fetch data and use it in your collections.Using defineCollectionSource, you can define a custom source.import { defineCollectionSource } from '@nuxt/content' const hackernewsSource = defineCollectionSource({ getKeys: () => { return fetch('https://hacker-news.firebaseio.com/v0/topstories.json') .then(res => res.json()) .then(data => data.map((key: string) => `${key}.json`)) }, getItem: (key: string) => { const id = key.split('.')[0] return fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`) .then(res => res.json()) }, }) Then you can use this source in your collections.content.config.tsimport { defineContentConfig, defineCollectionSource, defineCollection, z } from '@nuxt/content' const hackernewsSource = defineCollectionSource({ getKeys: () => { return fetch('https://hacker-news.firebaseio.com/v0/topstories.json') .then(res => res.json()) .then(data => data.map((key: string) => `${key}.json`)) }, getItem: (key: string) => { const id = key.split('.')[0] return fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`) .then(res => res.json()) }, }) const hackernews = defineCollection({ type: 'data', source: hackernewsSource, schema: z.object({ title: z.string(), date: z.date(), type: z.string(), score: z.number(), url: z.string(), by: z.string(), }), }) export default defineContentConfig({ collections: { hackernews, }, }) html pre.shiki code .s8pZq, html code.shiki .s8pZq{--shiki-light:#39ADB5;--shiki-light-font-style:italic;--shiki-default:#89DDFF;--shiki-default-font-style:italic;--shiki-dark:#89DDFF;--shiki-dark-font-style:italic}html pre.shiki code .s86vT, html code.shiki .s86vT{--shiki-light:#39ADB5;--shiki-default:#89DDFF;--shiki-dark:#89DDFF}html pre.shiki code .sndM8, html code.shiki .sndM8{--shiki-light:#90A4AE;--shiki-default:#EEFFFF;--shiki-dark:#BABED8}html pre.shiki code .sIEYB, html code.shiki .sIEYB{--shiki-light:#91B859;--shiki-default:#C3E88D;--shiki-dark:#C3E88D}html pre.shiki code .s50WR, html code.shiki .s50WR{--shiki-light:#9C3EDA;--shiki-default:#C792EA;--shiki-dark:#C792EA}html pre.shiki code .swgpB, html code.shiki .swgpB{--shiki-light:#6182B8;--shiki-default:#82AAFF;--shiki-dark:#82AAFF}html pre.shiki code .sd2Uz, html code.shiki .sd2Uz{--shiki-light:#E53935;--shiki-default:#F07178;--shiki-dark:#F07178}html pre.shiki code .sK9QF, html code.shiki .sK9QF{--shiki-light:#90A4AE;--shiki-light-font-style:italic;--shiki-default:#EEFFFF;--shiki-default-font-style:italic;--shiki-dark:#BABED8;--shiki-dark-font-style:italic}html pre.shiki code .sYGMc, html code.shiki .sYGMc{--shiki-light:#E2931D;--shiki-default:#FFCB6B;--shiki-dark:#FFCB6B}html pre.shiki code .smPcV, html code.shiki .smPcV{--shiki-light:#F76D47;--shiki-default:#F78C6C;--shiki-dark:#F78C6C}html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: 