["https://content.nuxt.com/docs/studio/github"]
title = "Synchronization - Nuxt Studio"
description = "Nuxt Studio is natively synced with GitHub. Install the Nuxt Studio GitHub app and enable content publication on GitHub directly from Studio."
full_description = "Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugStudioReal time synchronization between Studio and GitHubNuxt Studio is natively synced with GitHub. Install the Nuxt Studio GitHub app and enable content publication on GitHub directly from Studio.This section explains the syncronization behaviour between Studio and GitHub. This process is handled directly from the platform and does not require any external action. This page purpose is purely informational.OverviewNuxt Studio integrates with the GitHub API, enabling smooth synchronization between Studio and your GitHub repositories. This first-class integration is made possible through the utilization of GitHub Apps.InstallationDuring Studio project creation, you'll need to install the Nuxt Studio GitHub App in your personal account or in the organizations you manage. Installing a GitHub App requires either organization ownership or admin permissions in a repository. If you lack the necessary permissions, the repository owner will need to approve the request.You can access the installation page from anywhere on the app by clicking on Install with GitHub.PermissionsDuring the installation of our GitHub app, you will be prompted to grant certain permissions:Read access to actions, metadata, members, and planRead and write access to secrets, administration, contents, pages, pull requests and workflowsWe need read access to actions to send a notification when a workflow run fails on a pull request or on the repository default branch. metadata is mandatory to fetch repository data, members to import your organization members and repository collaborators and plan is used to propose features based on your GitHub account plan.Nuxt Studio acts on your behalf to create repositories, branches, pull requests, and perform commits and merges. We also offer one-click deployment to GitHub Pages with instant preview of workflows and environment variables secrets management. To accomplish this, we need read and write access to administration, contents, pages, pull requests, workflows and secrets.Repositories InstallationsWhen installing our GitHub app, you will be prompted to select all repositories or a subset of them. This selection can be changed at any time by going to the GitHub app settings.By clicking on Install, Nuxt Studio will install each repository you have selected, enabling you to perform all the actions listed above.UninstallAll the data imported from GitHub is directly associated with your GitHub app installation. If you uninstall the GitHub app, all the associated data will be deleted.If you delete your GitHub repository, the associated Nuxt Studio project will be automatically removed. However, if this project was subscribed to a Team plan, the subscription will not be canceled automatically. You will need to manually end the subscription via Lemon Squeezy or contact us for assistance.SetupStudio is the intuitive CMS interface to edit Nuxt Content websites. Edit your Markdown, YAML and JSON files and publish your changes to GitHub.Content EditorsDiscover and select your favorite way to manage your content between the visual or the code editor.On this pageOn this pageOverviewInstallationPermissionsRepositories InstallationsUninstallCommunityEdit this pageStar on GitHubChat on Discord"
