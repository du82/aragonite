["https://content.nuxt.com/changelog/frontmatter-form"]
title = "Visual Front-matter Edition"
description = "Your page metadata is now editable through a visual interface instead of YAML."
full_description = "ChangelogVisual Front-matter EditionStudioOctober 17, 2024Visual Front-matter EditionYour page metadata is now editable through a visual interface instead of YAML.BLBaptiste LeprouxThis article was published before the merge of the Content and Studio modules on January 6, 2025. As a result, it may contain some inconsistencies. The Studio module is now deprecated and available as an opt-in feature of the Content module. Learn how to enable it in this guide.Visual Front-Matter editingYou can now edit your markdown front-matter without writing in the YAML syntax. Instead, Nuxt Studio automatically generates a user-friendly form that simplifies metadata editing.What is the front-matter?Front-matter is a convention used in Markdown-based CMSs to provide metadata for pages, such as descriptions, titles, and more. In Nuxt Content, the front-matter uses the YAML syntax.For more detailed information about front-matter syntax, visit the Nuxt Content documentation.The last piece of our non-technical editorNuxt Studio has been designed with non-technical users in mind, mainly since our editor has been released. Our goal is to make markdown and content edition accessible to everyone.The automatic form generation for front-matter is the next logical step. By moving away from the complexities of YAML syntax, we’re simplifying the process for non-developers, offering dynamic input options like image pickers, date pickers, boolean toggles and more. This enhancement brings us to a fully visual, user-friendly content management experience.Expanding to all YAML and JSON filesSoon, the form generation feature will extend to all YAML and JSON files you edit within Nuxt Studio, making it easier than ever to work with structured data.Looking ahead to Nuxt Content v3This section is just a teaser of Nuxt Content v3. We will publish a more detailed blog post soon.We're actively working on the next major update of Nuxt Content which will bring significant performance improvements and new features to further enhance your content management experience.Improved PerformanceA key challenge with Nuxt Content v2 was the large bundle size required to store all content files. It was an issue when deploying to edge platforms like NuxtHub.To address this, Nuxt Content v3 moves away from the file based storing in production and leverage SQL database system. This switch is transparent to users. We're providing a zero config support for development mode, static generation, server rendering and edge deployments with NuxtHub.Introducing CollectionsCollections are groups of related content items within your Nuxt Content project. They help organize and manage large datasets more efficiently.Define collectionsYou'll be able to define collections in the content.config.ts file which is used by Nuxt Content to configure database structures, utility types, and methods for finding, parsing, and querying content.Collections schemaSchemas enforce consistency within collections and improve TypeScript typings for better integration with Nuxt Content utilities.content.config.tsimport { defineCollection, z } from '@nuxt/content' // Export collections export const collections = { // Define collection using `defineCollection` utility posts: defineCollection({ // Specify the type of content in this collection type: 'page', // Load every file matching this pattern source: 'blog/**/*.md', // Define custom schema for this collection schema: z.object({ date: z.date(), image: z.object({ src: z.string(), alt: z.string() }), badge: z.object({ label: z.string(), color: z.string() }) }) }), } Built with Nuxt Studio in mindNuxt Studio was originally developed alongside Nuxt Content v2, but with v3, we're building the module with Nuxt Studio experience in mind. Our goal is to create the best CMS platform for content editing, while still offering the best developers experience.For example, collection schemas will help us further enhance form generation in Studio. Among other things, you'll be able to set the editor type for a field directly in your schema.content.config.tsimage: z.object({ src: z.string().editor({ type: 'media' }) alt: z.string() }), icon: z.string().editor({ type: 'icon' }) Nuxt Content v3 has been officially released. Don't hesitate to try it out and give us feedback.html pre.shiki code .s8pZq, html code.shiki .s8pZq{--shiki-light:#39ADB5;--shiki-light-font-style:italic;--shiki-default:#89DDFF;--shiki-default-font-style:italic;--shiki-dark:#89DDFF;--shiki-dark-font-style:italic}html pre.shiki code .s86vT, html code.shiki .s86vT{--shiki-light:#39ADB5;--shiki-default:#89DDFF;--shiki-dark:#89DDFF}html pre.shiki code .sndM8, html code.shiki .sndM8{--shiki-light:#90A4AE;--shiki-default:#EEFFFF;--shiki-dark:#BABED8}html pre.shiki code .sIEYB, html code.shiki .sIEYB{--shiki-light:#91B859;--shiki-default:#C3E88D;--shiki-dark:#C3E88D}html pre.shiki code .syuKq, html code.shiki .syuKq{--shiki-light:#90A4AE;--shiki-light-font-style:italic;--shiki-default:#546E7A;--shiki-default-font-style:italic;--shiki-dark:#676E95;--shiki-dark-font-style:italic}html pre.shiki code .s50WR, html code.shiki .s50WR{--shiki-light:#9C3EDA;--shiki-default:#C792EA;--shiki-dark:#C792EA}html pre.shiki code .sd2Uz, html code.shiki .sd2Uz{--shiki-light:#E53935;--shiki-default:#F07178;--shiki-dark:#F07178}html pre.shiki code .swgpB, html code.shiki .swgpB{--shiki-light:#6182B8;--shiki-default:#82AAFF;--shiki-dark:#82AAFF}html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html pre.shiki code .sYGMc, html code.shiki .sYGMc{--shiki-light:#E2931D;--shiki-default:#FFCB6B;--shiki-dark:#FFCB6B}Start with Studio todayGet started for freeRead docs ← Back to changelog Copy URL Visual YAML and JSON File EditionEdit YAML and JSON files with an automatically generated form. On this pageOn this pageVisual Front-Matter editingWhat is the front-matter?The last piece of our non-technical editorExpanding to all YAML and JSON filesLooking ahead to Nuxt Content v3Improved PerformanceIntroducing CollectionsDefine collectionsCollections schemaBuilt with Nuxt Studio in mindLinksFollow on XFollow on BlueskyChat on Discord"
