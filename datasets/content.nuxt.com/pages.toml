["https://content.nuxt.com/docs/files/json"]
title = "JSON - Nuxt Content"
description = "How to define, write and query JSON data."
full_description = '''Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugFilesJSONHow to define, write and query JSON data.Define Collectioncontent.config.tsimport { defineCollection, defineContentConfig, z } from '@nuxt/content' export default defineContentConfig({ collections: { authors: defineCollection({ type: 'data', source: 'authors/**.json', schema: z.object({ name: z.string(), avatar: z.string(), url: z.string() }) }) } }) Create .json filesCreate authors files in content/authors/ directory.farnabaz.jsonlarbish.json{ "name": "Ahad Birang", "avatar": "https://avatars.githubusercontent.com/u/2047945?v=4", "url": "https://github.com/farnabaz" } { "name": "Baptiste Leproux", "avatar": "https://avatars.githubusercontent.com/u/7290030?v=4", "url": "https://github.com/larbish" } Each file in data collection should contain only one object, therefore having top level array in a JSON file will cause invalid result in query time.Query DataNow we can query authors:<script lang="ts" setup> // Find a single author const { data: author } = await useAsyncData('larbish', () => { return queryCollection('authors') .where('stem', '=', 'larbish') .first() }) // Get all authors const { data: authors } = await useAsyncData('authors', () => { return queryCollection('authors') .order('name', 'DESC') .all() }) </script> html pre.shiki code .s8pZq, html code.shiki .s8pZq{--shiki-light:#39ADB5;--shiki-light-font-style:italic;--shiki-default:#89DDFF;--shiki-default-font-style:italic;--shiki-dark:#89DDFF;--shiki-dark-font-