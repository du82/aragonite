["https://content.nuxt.com/docs/getting-started/configuration"]
title = "Configuration - Nuxt Content"
description = "Nuxt Content is configured with sensible defaults."
full_description = "Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugGetting StartedConfigurationNuxt Content is configured with sensible defaults.To configure the content module and customize its behavior, you can use the content property in your nuxt.config:nuxt.config.tsexport default defineNuxtConfig({ content: { // Options } }) In addition to configuring via content.markdown, you can use Markdown Components (MDC) to customize the rendering of Markdown elements with mdc property.buildNuxt Content read and parse all the available contents at build time. This option gives you control over parsing contents.markdownConfigure markdown parser.tocDefaultSignaturetoc: { depth: 2, searchDepth: 2 } type Toc = { depth: number searchDepth: number } Control behavior of Table of Contents generation.Value:depth: Maximum heading depth to include in the table of contents.searchDepth: Maximum depth of nested tags to search for heading.nuxt.config.tsexport default defineNuxtConfig({ content: { build: { markdown: { toc: { depth: 3, // include h3 headings } } } } }) remarkPluginsDefaultSignatureremarkPlugins: {} type RemarkPlugins = Record<string, false | MarkdownPlugin> A list of remark plugins to use.nuxt.config.tsexport default defineNuxtConfig({ content: { build: { markdown: { // Object syntax can be used to override default options remarkPlugins: { // Override remark-emoji options 'remark-emoji': { options: { emoticon: true } }, // Disable remark-gfm 'remark-gfm': false, // Add remark-oembed 'remark-oembed': { // Options } }, } } } }) rehypePluginsDefaultSignaturerehypePlugins: {} type RehypePlugins = object A list of rehype plugins to use.nuxt.config.tsexport default defineNuxtConfig({ content: { build: { markdown: { // Object syntax can be used to override default options rehypePlugins: { 'rehype-figure': { } }, } } } }) highlightDefaultSignaturehighlight: false type Highlight = false | object Nuxt Content uses Shiki to provide syntax highlighting for ProsePre and ProseCode.OptionTypeDescriptionthemeShikiTheme or Record<string, ShikiTheme>The color theme to use.langsShikiLang[]The loaded languages available for highlighting.highlight.themeTheme can be specified by a single string but also supports an object with multiple themes.This option is compatible with Color Mode module.If you are using multiple themes, it's recommended to always have a default theme specified.nuxt.config.tsexport default defineNuxtConfig({ content: { build: { markdown: { highlight: { // Theme used in all color schemes. theme: 'github-light', // OR theme: { // Default theme (same as single string) default: 'github-light', // Theme used if `html.dark` dark: 'github-dark', // Theme used if `html.sepia` sepia: 'monokai' } } } } } }) highlight.langsBy default, the module loads a couple of languages for syntax highlighting:Default['json', 'js', 'ts', 'html', 'css', 'vue', 'shell', 'mdc', 'md', 'yaml'] If you plan to use code samples of other languages, you need to define the language in these options.nuxt.config.tsexport default defineNuxtConfig({ content: { build: { markdown: { highlight: { langs: [ 'c', 'cpp', 'java' ] } } } } }) If you wish to add highlighting for an unsupported language, you can do so by loading the grammar file for the language.nuxt.config.tsimport { readFileSync } from 'node:fs' export default defineNuxtConfig({ content: { build: { markdown: { highlight: { langs: [ // Read more about Shiki languages: https://shiki.style/guide/load-lang JSON.parse( readFileSync('./shiki/languages/gdscript.tmLanguage.json', 'utf-8'), ), ] } } } } }) Read more about adding languages in the Shiki documentation.pathMetaContent module uses files path to generate the slug, default title and content order, you can customize this behavior with pathMeta option.pathMeta.forceLeadingSlashIf set to true, the path will be prefixed with a leading slash. Default value is true.pathMeta.slugifyOptionsContent module uses slugify to generate the slug, you can customize the behavior of slugify with this option.Checkout slugify options for more information.transformersNuxt Content has specific transformers for each content type to parse the raw content and prepare it for querying and rendering. Using this option you can define custom transformers to support new content types or improve functionalities of supported content types.nuxt.config.ts~/transformers/title-suffix.tsexport default defineNuxtConfig({ content: { build: { transformers: [ '~/transformers/title-suffix', ], }, }, }) import { defineTransformer } from '@nuxt/content' export default defineTransformer({ name: 'title-suffix', extensions: ['.md'], transform(file) { return { ...file, title: file.title + ' (suffix)', } }, }) databaseBy default Nuxt Content uses a local SQLite database to store and query content. If you like to use another database or you plan to deploy on Cloudflare Workers, you can modify this option.Here is the list of supported database adapters:SQLiteIf you want to change the default database location and move it to elsewhere you can use sqlite adapter to do so. This is the default value to the database option. Depending on your runtime-environment different sqlite adapters will be used (Node: better-sqlite-3, Bun: bun:sqlite).nuxt.config.tsexport default defineNuxtConfig({ content: { database: { type: 'sqlite', filename: 'SQLITE_DB_LOCATION' } } }) D1If you plan to deploy your application to Cloudflare workers, you need to use the d1 database adapter. Create a d1 binding in the Cloudflare dashboard and fill in the bindingName field.nuxt.config.tsexport default defineNuxtConfig({ content: { database: { type: 'd1', bindingName: 'CF_BINDING_NAME' } } }) PostgresIf you plan to deploy your application using PostgreSQL database you need to use the postgres database adapter.First, make sure to install the pg package:Terminalnpx npm i pg Then, configure the postgres adapter in your nuxt.config.ts:nuxt.config.tsexport default defineNuxtConfig({ content: { database: { type: 'postgres', url: process.env.POSTGRES_URL, /* Other options for `pg` */ } } }) LibSQLIf you plan to deploy your application using a LibSQL database you need to use the libsql database adapter.First, make sure to install the @libsql/client package:Terminalnpx npm i @libsql/client Then, configure the libsql adapter in your nuxt.config.ts:nuxt.config.tsexport default defineNuxtConfig({ content: { database: { type: 'libsql', url: process.env.TURSO_DATABASE_URL, authToken: process.env.TURSO_AUTH_TOKEN, } } }) The most popular LibSQL hosting services is Turso.rendererConfigure content renderer.anchorLinksDefaultSignature{ h2: true, h3: true, h4: true } type AnchorLinks = boolean | Record<'h1' | 'h2' | 'h3' | 'h4' | 'h5' | 'h6', boolean> Control anchor link generation, by default it generates anchor links for h2, h3 and h4 headingValue:false: will disable link generation.true: will enable link generation for all headings.aliasDefaultSignaturealias: {} type Alias = Record<string, string> Aliases will be used to replace markdown components and render custom components instead of default ones.nuxt.config.tsexport default defineNuxtConfig({ content: { renderer: { alias: { p: 'MyCustomParagraph' } } } }) watchDefaultwatch: { enabled: true, ws: { port: 4000, showURL: false } } Configure content hot reload in development.Value:enabled: Enable/Disable hot reload.port: Select the port used for the WebSocket server.showURL: Toggle URL display in dev server boot message.The watcher is a development feature and will not be included in production.EnabledDisabledexport default defineNuxtConfig({ content: { watch: { ws: { port: 4000, showURL: true } } } }) export default defineNuxtConfig({ content: { watch: { enabled: false } } }) previewEnable Preview APIThis is needed to enable live preview on Nuxt Studio.Value:dev: Enable in development modeapi: Activate the preview mode and set the API to be linked with.Enable Studiopreview: { api: 'https://api.nuxt.studio', } html pre.shiki code .s8pZq, html code.shiki .s8pZq{--shiki-light:#39ADB5;--shiki-light-font-style:italic;--shiki-default:#89DDFF;--shiki-default-font-style:italic;--shiki-dark:#89DDFF;--shiki-dark-font-style:italic}html pre.shiki code .swgpB, html code.shiki .swgpB{--shiki-light:#6182B8;--shiki-default:#82AAFF;--shiki-dark:#82AAFF}html pre.shiki code .sndM8, html code.shiki .sndM8{--shiki-light:#90A4AE;--shiki-default:#EEFFFF;--shiki-dark:#BABED8}html pre.shiki code .s86vT, html code.shiki .s86vT{--shiki-light:#39ADB5;--shiki-default:#89DDFF;--shiki-dark:#89DDFF}html pre.shiki code .sd2Uz, html code.shiki .sd2Uz{--shiki-light:#E53935;--shiki-default:#F07178;--shiki-dark:#F07178}html pre.shiki code .syuKq, html code.shiki .syuKq{--shiki-light:#90A4AE;--shiki-light-font-style:italic;--shiki-default:#546E7A;--shiki-default-font-style:italic;--shiki-dark:#676E95;--shiki-dark-font-style:italic}html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: v