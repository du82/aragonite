["https://content.nuxt.com/docs/studio/setup"]
title = "Setup - Nuxt Studio"
description = "Studio is the intuitive CMS interface to edit Nuxt Content websites. Edit your Markdown, YAML and JSON files and publish your changes to GitHub."
full_description = '''Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugStudioSetup Nuxt StudioStudio is the intuitive CMS interface to edit Nuxt Content websites. Edit your Markdown, YAML and JSON files and publish your changes to GitHub.Studio is an intuitive CMS interface to edit your Nuxt Content websites.It take advantage of the Preview API included in Nuxt Content to propose the best editing experience for your content files. Editors can benefit from a user-friendly interface to edit their Markdown, YAML or JSON files.Developers can customize the edition experience and provide tools to the editor who can focus on content without requiring any technical expertise.AuthenticationThe Studio admin is located on nuxt.studio. From there you can either login with GitHub or with Google. Both methods give you the same edition rights but since Studio is synchronized with GitHub, the repository import must be handled by a GitHub user.Google authentication is adapted for non technical users. Google users have to join a team with existing projects to edit them.Connect your Nuxt Content RepositoryOnce you are logged in the admin, you have the possibility to import your Nuxt Content repository from the interface.Two options are available, you can either import an existing repository or use one of our templates.The only requirement is to host your repository on GitHub. From the interface, connect to our GitHub app, you'll be then able to link a GitHub repository to your Studio project.Once the project is created, you can start editing your files with the Studio editors and publish your changes.Enable the Full Editing ExperienceTo unlock the complete range of features in Studio, make sure your project URL is properly configured in the deployment section.This will enable all Studio features including:Live preview of your website: instantly see changes reflected on your site as you work.Dynamic form generation: Automatically generate forms to edit your files based on your Nuxt Content collections.Enhanced markdown editors: enjoy an improved editing experience, including the ability to list and integrate Vue components that you’ve exposed.Automatic app configuration: generate application configurations based on the schema you’ve defined.We are proposing a GitHub Pages deployment. By using it, we will handle all the requirements for you. However, if you want to use the deployment platform of your choice, please follow the simple guideline below.To be able to set your URL in Studio, you just need to set the Preview API in the content configuration of your nuxt.config.ts file.nuxt.config.tsexport default defineNuxtConfig({ content: { preview: { api: 'https://api.nuxt.studio' } } }) Once deployed, you can ensure the Preview API has been activated by navigating to the /__preview.json page on your site. This metadata page is automatically generated by the Content module and must be accessible to connect your URL in the self-hosted section of Studio.TroubleshootingThe __preview.json file is generated but you encounter a Forbidden error: invalid property check when setting your URL in the self-hosted section, follow these steps:Ensure the gitInfo field is set and accurate in the __preview.json filehttps://your-website.com/__preview.json"gitInfo": { "name": "content", "owner": "nuxt", "url": "https://github.com/nuxt/content" }, This information should be populated automatically in most cases. We support most popular providers (NuxtHub, Vercel, Netlify, etc.), but if you're using a non supported provider or a custom one, it may not be fetched correctly.Override gitInfo in your nuxt.config.tsnuxt.config.tsexport default defineNuxtConfig({ content: { preview: { api: 'https://api.nuxt.studio', gitInfo: { name: 'Your repository name', owner: 'Your repository owner/organization', url: 'Your GitHub repository URL' } } } }) Ensure these fields are correctly set in __preview.jsonThe Forbidden error should be resolved and you should be able to set your URL on Nuxt Studio. If not, please contact us on the Discord server.html pre.shiki code .s8pZq, html code.shiki .s8pZq{--shiki-light:#39ADB5;--shiki-light-font-style:italic;--shiki-default:#89DDFF;--shiki-default-font-style:italic;--shiki-dark:#89DDFF;--shiki-dark-font-style:italic}html pre.shiki code .swgpB, html code.shiki .swgpB{--shiki-light:#6182B8;--shiki-default:#82AAFF;--shiki-dark:#82AAFF}html pre.shiki code .sndM8, html code.shiki .sndM8{--shiki-light:#90A4AE;--shiki-default:#EEFFFF;--shiki-dark:#BABED8}html pre.shiki code .s86vT, html code.shiki .s86vT{--shiki-light:#39ADB5;--shiki-default:#89DDFF;--shiki-dark:#89DDFF}html pre.shiki code .sd2Uz, html code.shiki .sd2Uz{--shiki-light:#E53935;--shiki-default:#F07178;--shiki-dark:#F07178}html pre.shiki code .sIEYB, html code.shiki .sIEYB{--shiki-light:#91B859;--shiki-default:#C3E88D;--shiki-dark:#C3E88D}html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html pre.shiki code .s50WR, html code.shiki .s50WR{--shiki-light:#9C3EDA;--shiki-default:#C792EA;--shiki-dark:#C792EA}AI-ready content files(`llms.txt`)Learn how to generate AI-ready content files using Nuxt Content and the Nuxt LLMs module.SynchronizationNuxt Studio is natively synced with GitHub. Install the Nuxt Studio GitHub app and enable content publication on GitHub directly from Studio.On this pageOn this pageAuthenticationConnect your Nuxt Content RepositoryEnable the Full Editing ExperienceTroubleshootingEnsure the gitInfo field is set and accurate in the __preview.json fileOverride gitInfo in your nuxt.config.tsEnsure these fields are correctly set in __preview.jsonCommunityEdit this pageStar on GitHubChat on Discord'''
