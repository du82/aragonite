font-style:italic;--shiki-dark:#89DDFF;--shiki-dark-font-style:italic}html pre.shiki code .sK9QF, html code.shiki .sK9QF{--shiki-light:#90A4AE;--shiki-light-font-style:italic;--shiki-default:#EEFFFF;--shiki-default-font-style:italic;--shiki-dark:#BABED8;--shiki-dark-font-style:italic}html pre.shiki code .sPKOg, html code.shiki .sPKOg{--shiki-light:#FF5370;--shiki-default:#FF9CAC;--shiki-dark:#FF9CAC}html pre.shiki code .sYGMc, html code.shiki .sYGMc{--shiki-light:#E2931D;--shiki-default:#FFCB6B;--shiki-dark:#FFCB6B}SynchronizationNuxt Studio is natively synced with GitHub. Install the Nuxt Studio GitHub app and enable content publication on GitHub directly from Studio.Media LibraryExplore how to browse and manage media files, and integrate them into your projects using Nuxt Content Studio CMS features.On this pageOn this pageNotion-like editor (Markdown files)FrontmatterToolbarMediasVue ComponentsCreate and integrate your own componentCreate your componentIntegrate these components easily within any Markdown file using MDC syntaxEdit them with our Studio editorsIntegrate built-in components from external librariesForm editorDefining your form with zod SchemaNative Inputs MappingCustom Inputs MappingUsageOptionsinput: 'media' | 'icon'hidden: BooleanCode editorCommunityEdit this pageStar on GitHubChat on Discord'''
