title = "ContentRenderer - Nuxt Content"
description = "Takes your component from an AST to a wonderful template."
full_description = '''Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugComponentsContentRendererTakes your component from an AST to a wonderful template.The <ContentRenderer> component renders a document coming from a query with queryCollections().This component only works with the pages collection.PropsPropDefaultTypeDescriptionvalue{}ParsedContentThe document to render.tag'div'stringThe tag to use for the renderer element if it is used.excerptfalsebooleanWhether to render the excerpt only without the rest of the content.components{}objectThe map of custom components to use for rendering. This prop will pass to the markdown renderer and will not affect other file types.data{}object (required)A map of variables to inject into the markdown content for later use in binding variables.proseundefinedbooleanWhether or not to render Prose components instead of HTML tags.classundefinedstring or objectRoot tag to use for rendering.unwrapfalseboolean or stringTags to unwrap separated by spaces. Example: 'ul li'.Example Usagepages/[...slug].vue<script lang="ts" setup> const route = useRoute() const { data: page } = await useAsyncData(route.path, () => { return queryCollection('docs').path(route.path).first() }) </script> <template> <ContentRenderer v-if="page" :value="page" /> </template> Handling Missing PagesIf the queried content is missing, you can display a custom fallback message.pages/[...slug].vue<script lang="ts" setup> const route = useRoute() const { data: page } = await useAsyncData(route.path, () => { return queryCollection('docs').path(route.path).findOne() }) </script> <template> <template v-if="page"> <ContentRenderer :value="page" /> </template> <template v-else> <div class="empty-page"> <h1>Page Not Found</h1> <p>Oops! The content you're looking for doesn't exist.</p> <NuxtLink to="/">Go back home</NuxtLink> </div> </template> </template> Handling Empty PagesIf the queried content is empty, you can display a custom fallback message.html pre.shiki code .s86vT, html code.shiki .s86vT{--shiki-light:#39ADB5;--shiki-default:#89DDFF;--shiki-dark:#89DDFF}html pre.shiki code .sd2Uz, html code.shiki .sd2Uz{--shiki-light:#E53935;--shiki-default:#F07178;--shiki-dark:#F07178}html pre.shiki code .s50WR, html code.shiki .s50WR{--shiki-light:#9C3EDA;--shiki-default:#C792EA;--shiki-dark:#C792EA}html pre.shiki code .sIEYB, html code.shiki .sIEYB{--shiki-light:#91B859;--shiki-default:#C3E88D;--shiki-dark:#C3E88D}html pre.shiki code .sndM8, html code.shiki .sndM8{--shiki-light:#90A4AE;--shiki-default:#EEFFFF;--shiki-dark:#BABED8}html pre.shiki code .swgpB, html code.shiki .swgpB{--shiki-light:#6182B8;--shiki-default:#82AAFF;--shiki-dark:#82AAFF}html pre.shiki code .s8pZq, html code.shiki .s8pZq{--shiki-light:#39ADB5;--shiki-light-font-style:italic;--shiki-default:#89DDFF;--shiki-default-font-style:italic;--shiki-dark:#89DDFF;--shiki-dark-font-style:italic}html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);