["https://content.nuxt.com/docs/files/markdown"]
title = "Markdown - Nuxt Content"
description = "Create and query Markdown files in your Nuxt applications and use the MDC syntax to integrate Vue components."
full_description = '''Getting StartedIntroductionInstallationConfigurationMigrationCollectionsDefineTypesSourcesFilesMarkdownYAMLJSONQuery UtilsqueryCollectionqueryCollectionNavigationqueryCollectionItemSurroundingsqueryCollectionSearchSectionsComponentsContentRendererSlotProse ComponentsDeployServerServerlessNuxtHubCloudflare PagesVercelNetlifyDockerStaticAdvancedFull-Text SearchRaw ContentSQL StorageDebugging toolsHooksCustom SourceAI-ready content files(`llms.txt`)StudioSetupSynchronizationContent EditorsMedia LibraryApp ConfigLocal DebugFilesMarkdownCreate and query Markdown files in your Nuxt applications and use the MDC syntax to integrate Vue components.UsageDefine a Collectioncontent.config.tsimport { defineCollection, defineContentConfig, z } from '@nuxt/content' export default defineContentConfig({ collections: { blog: defineCollection({ type: 'page', source: 'blog/*.md', schema: z.object({ date: z.string() }) }) } }) Learn more about the page collection type.Create .md filesCreate blog posts in content/blog/ directory.foo.mdbar.md--- date: 2020-11-11 --- # Foo This is Foo blog post. --- date: 2024-12-12 --- Hello I am bar. Nice to meet you. Query Markdown FilesNow we can query blog posts:// Get the foo post const fooPost = await queryCollection('blog').path('/foo').first() // Find all posts const allPosts = await queryCollection('blog').order('date', 'DESC').all() Display MarkdownTo display the content of a markdown file, you can use the <ContentRenderer> component.blog/[slug].vue<script setup> const slug = useRoute().params.slug const { data: post } = await useAsyncData(`blog-${slug}`, () => { return queryCollection('blog').path(`/blog/${slug}`).first() }) </script> <template> <!-- Render the blog post as Prose & Vue components --> <ContentRenderer :value="post" /> </template> Read more about the <ContentRenderer> component and Prose Components.FrontmatterFrontmatter is a convention of Markdown-based CMS to provide meta-data to pages, like description or title. In Nuxt Content, the frontmatter uses the YAML syntax with key: value pairs.These data are available when rendering the content and can store any information that you would need.SyntaxYou can declare a frontmatter block at the top of the Markdown files in the content/ directory with the --- identifier.content/index.md--- title: 'Title of the page' description: 'meta description of the page' --- <!-- Content of the page --> example.tsconst home = await queryCollection('content').path('/').first() console.log(home.title) // => 'Title of the page' console.log(home.description) // => 'meta description of the page' console.log(home.body) // => AST object of the page content Native parametersKeyTypeDefaultDescriptiontitlestringFirst <h1> of the pageTitle of the page, will also be injected in metasdescriptionstringFirst <p> of the pageDescription of the page, will be shown below the title and injected into the metasnavigationbooleantrueDefine if the page is included in queryCollectionNavigation return value.MDC SyntaxWe created the MDC syntax to supercharge Markdown and give you the ability to integrate Vue components with slots and props inside your Markdown.Install the MDC VS Code extension to get proper syntax highlighting for the MDC syntax.Vue ComponentsYou can use any Vue component in your Markdown files.We have a special syntax to make it easier to use components in your Markdown files.content/index.md::component-name Default slot content :: Components that are used in Markdown has to be marked as global in your Nuxt app if you don't use the components/content/ directory, visit Nuxt 3 docs to learn more about it.Block ComponentsBlock components are components that accept Markdown content or another component as a slot.The component must contain at least one <slot /> component to accept formatted text.In a markdown file, use the component with the :: identifier.index.mdCard.vuePreview::card The content of the card :: <!-- components/content/Card.vue --> <template> <div class="p-2 border bg-white dark:bg-black dark:border-gray-700 rounded"> <slot /> </div> </template> The content of the cardSlotsA component's slots can accept content or another components.Default slot renders the top-level content inside the block component or with #defaultNamed slots use the # identifier to render the corresponding content.index.mdHero.vuePreview::hero My Page Title #description This will be rendered inside the `description` slot. :: <template> <section> <h1 class="text-4xl"> <slot mdc-unwrap="p" /> </h1> <slot name="description" /> </section> </template> My Page TitleThis will be rendered inside the description slot.Read more about the <slot /> component.You can use Markdown inside your components slots:index.mdMyTitle.vuePreview::the-title A [rich text](/) will be **rendered** by the component. :: <template> <h1 class="text-4xl"> <slot mdc-unwrap="p" /> </h1> </template> A rich text will be rendered by the component.PropsThere are two ways to pass props to components using MDC.Inline methodThe {} identifier passes props to components in a terse way by using a key=value syntax.index.mdAlert.vuePreview::alert{type="warning"} The **alert** component. :: <script setup> defineProps(['type']) </script> <template> <div :class="[type]"> <slot mdc-unwrap="p" /> </div> </template> The alert component.Multiple props can be separated with a space:::alert{type="warning" icon="exclamation-circle"} Oops! An error occurred :: The v-bind shorthand : can be also be used to bind a prop to a value in the frontmatter.--- type: "warning" --- ::alert{:type="type"} Your warning :: If you want to pass arrays or objects as props to components you can pass them as JSON string and prefix the prop key with a colon to automatically decode the JSON string. Note that in this case you should use single quotes for the value string so you can use double quotes to pass a valid JSON string:array.mdnumber-array.mdobject.md::dropdown{:items='["Nuxt", "Vue", "React"]'} :: ::dropdown{:items='[1,2,3.5]'} :: ::chart{:options='{"responsive": true, "scales": {"y": {"beginAtZero": true}}}'} :: YAML methodThe YAML method uses the --- identifier to declare one prop per line, that can be useful for readability.index.mdIconCard.vuePreview::icon-card --- icon: IconNuxt description: Harness the full power of Nuxt and the Nuxt ecosystem. title: Nuxt Architecture. --- :: <script setup> defineProps({ title: { type: String, default: 'Default title' }, description: { type: String, default: 'Default description' }, icon: { type: String, default: 'IconMarkdown' } }) </script> <template> <div class="p-6 border bg-white dark:bg-black dark:border-gray-700 rounded"> <component :is="icon" class="w-20 h-20" /> <h2 class="text-3xl font-semibold mb-2"> {{ title }} </h2> <p>{{ description }}</p> </div> </template> Nuxt Architecture.Harness the full power of Nuxt and the Nuxt ecosystem.AttributesAttributes are useful for highlighting and modifying part of paragraph. The syntax is nearly similar to inline components and markdown links syntax.Possible values are all named attributes, classes with the notation .class-name and an ID with #id-name.index.mdPreviewHello [World]{style="color: green;" .custom-class #custom-id}! Hello World !In addition to mdc components and span, attribute syntax will work on images, links, inline code, *bold* and _italic_ text.index.mdPreviewAttributes work on: - [link](#attributes){style="background-color: pink;"}, `code`{style="color: cyan;"}, - _italic_{style="background-color: yellow; color:black;"} and **bold**{style="background-color: lightgreen;"} texts. Attributes work on:link, code,italic and bold texts.Binding Data in MarkdownYou can bind data within your Markdown document using the {{ $doc.variable || 'defaultValue' }} syntax. These values can be defined in the YAML frontmatter at the top of the document, within each MDC component, or injected using the data prop of the <ContentRenderer> component.Example 1: Define in YAML--- title: 'Title of the page' description: 'meta description of the page' customVariable: 'Custom Value' --- # The Title is {{ $doc.title }} and customVariable is {{ $doc.customVariable || 'defaultValue' }} Example 2: Define in external with <ContentRenderer>test.vue<template> <div> <ContentRenderer :value="data" :data="mdcVars"/> <button type="button" v-on:click="mdcVars.name = 'Hugo'">Change name</button> </div> </template> <script setup lang="ts"> const { data } = await useAsyncData(() => queryCollection('content').path('/test').first()); const mdcVars = ref({ name: 'Maxime'}); </script> test.md# Hello {{ $doc.name || 'World' }} Prose ComponentsIn Nuxt Content, the prose represents HTML tags generated by the Markdown syntax, such as heading levels and links.For each HTML tag, a Vue component is used, allowing you to override them if needed, for example <p> becomes <ProseP>.If you want to customize a Prose component, here are the recommended steps:Check out the original component sources.Use the exact same props.In your components/content/ directory, give it the same name.Make it yours 🚀.Read the complete Prose reference in the Prose Components section.Code HighlightingNuxt Content uses Shiki, which colors tokens with VSCode themes.Code highlighting works both on ProsePre and ProseCode.Each line of a code block gets its line number in the line attribute so lines can be labeled or individually styled.Read the API reference to configure or entirely disable syntax highlighting.ImagesYou can add images to your public directory:Directory structurecontent/ index.md public/ image.png nuxt.config.ts package.json And then use them in your markdown files in the content directory as such:content/index.md![my image](/image.png) ExcerptContent excerpt or summary can be extracted from the content using <!--more--> as a divider.content/index.md--- title: Introduction --- Learn how to use `@nuxt/content`. <!--more--> Full amount of content beyond the more divider. Description property will contain the excerpt content unless defined within the frontmatter props.If there is no <!--more--> divider in the text then excerpt is undefined.You should define the excerpt field in the collection schema if you want to use the excerpt feature.content.config.tsconst content = defineCollection({ type: 'page', source: '**', schema: z.object({ excerpt: z.object({ type: z.string(), children: z.any(), }), }), }) Read more about the collection schema.Example variables will be injected into the document:{ "excerpt": Object "body": Object // ... other keys } html pre.shiki code .s8pZq, html code.shiki .s8pZq{--shiki-light:#39ADB5;--shiki-light-font-style:italic;--shiki-default:#89DDFF;--shiki-default-font-style:italic;--shiki-dark:#89DDFF;--shiki-dark-font-style:italic}html pre.shiki code .s86vT, html code.shiki .s86vT{--shiki-light:#39ADB5;--shiki-default:#89DDFF;--shiki-dark:#89DDFF}html pre.shiki code .sndM8, html code.shiki .sndM8{--shiki-light:#90A4AE;--shiki-default:#EEFFFF;--shiki-dark:#BABED8}html pre.shiki code .sIEYB, html code.shiki .sIEYB{--shiki-light:#91B859;--shiki-default:#C3E88D;--shiki-dark:#C3E88D}html pre.shiki code .swgpB, html code.shiki .swgpB{--shiki-light:#6182B8;--shiki-default:#82AAFF;--shiki-dark:#82AAFF}html pre.shiki code .sd2Uz, html code.shiki .sd2Uz{--shiki-light:#E53935;--shiki-default:#F07178;--shiki-dark:#F07178}html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html pre.shiki code .syuKq, html code.shiki .syuKq{--shiki-light:#90A4AE;--shiki-light-font-style:italic;--shiki-default:#546E7A;--shiki-default-font-style:italic;--shiki-dark:#676E95;--shiki-dark-font-style:italic}html pre.shiki code .s50WR, html code.shiki .s50WR{--shiki-light:#9C3EDA;--shiki-default:#C792EA;--shiki-dark:#C792EA}html pre.shiki code .sYGMc, html code.shiki .sYGMc{--shiki-light:#E2931D;--shiki-default:#FFCB6B;--shiki-dark:#FFCB6B}html pre.shiki code .sAZcy, html code.shiki .sAZcy{--shiki-light:#90A4AE;--shiki-light-text-decoration:underline;--shiki-default:#EEFFFF;--shiki-default-text-decoration:underline;--shiki-dark:#BABED8;--shiki-dark-text-decoration:underline}html pre.shiki code .slNEC, html code.shiki .slNEC{--shiki-light:#39ADB5;--shiki-light-font-weight:bold;--shiki-default:#89DDFF;--shiki-default-font-weight:bold;--shiki-dark:#89DDFF;--shiki-dark-font-weight:bold}html pre.shiki code .sf2UM, html code.shiki .sf2UM{--shiki-light:#E53935;--shiki-light-font-weight:bold;--shiki-default:#F07178;--shiki-default-font-weight:bold;--shiki-dark:#F07178;--shiki-dark-font-weight:bold}SourcesLearn how to import your files in Nuxt Content collections.YAMLHow to define, write and query YAML data.On this pageOn this pageUsageDefine a CollectionCreate .md 