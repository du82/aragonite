title = "Announcing Nuxt Content version 3"
description = "Content version 3 is out - introducing SQL based storage, collections, preview API for a better Studio integration and tons of performance improvements."
full_description = '''BlogNuxt Content v3ReleaseJanuary 16, 2025Nuxt Content v3Content version 3 is out - introducing SQL based storage, collections, preview API for a better Studio integration and tons of performance improvements. BLBaptiste Leproux@larbishABAhad Birang@farnabazSCSébastien Chopin@atinuxAnnouncing Nuxt Content 3.0We are thrilled to announce the first stable version of Nuxt Content 3.0.0 ✨🚀 Performance ImprovementsNuxt Content v3 moves away from a file-based storage approach to an SQL database system. Using a database instead of the file-based storage reduces many I/O operations when querying large datasets.The new database system enhances the way your data files are stored and structured, ensuring better performance and scalability. This update is entirely behind the scenes and does not affect the file types you can use in Content (yml, json, and markdown ).This switch is transparent to users and Nuxt Content still provides a zero config support for development mode, server hosting and static generation.Furthermore, serverless hosting is now supported and client-side navigation performance has been improved.Serverless CompatibilityA key challenge with Nuxt Content v2 was the large bundle size required to store all content files. It was an issue when deploying to serverless or edge platforms like Netlify, NuxtHub or Vercel.In serverless environments, each user request triggers a fresh instance of your Nuxt server, it starts from scratch each time. This "stateless" nature means you can't store data in server memory or use file-based databases like SQLite. That's why we've implemented database adaptors that persist data independently of your server instances.We're manually switching to the appropriate provider (Vercel / Postgres, NuxtHub / D1...) according to the database type you've set in your config.WASM SQLite in BrowserFor client-side navigation, the module uses a similar approach. When the application executes the first content query, it downloads the generated dump from the server and initializes a local SQLite database within the browser. From that point onward, all queries are executed locally without needing to call the server: significantly improving the responsiveness of the application and providing a seamless user experience.🗄️ Content CollectionsCollections are groups of related content items within your Nuxt Content project. They help organize and manage large datasets more efficiently.Define CollectionsYou can now define collections in the content.config.ts file to configure the database structure, utility types, and methods for finding, parsing, and querying content.Collections SchemaSchemas enforce consistency within collections and improve TypeScript typings for better integration with Nuxt Content utilities.content.config.tsimport { defineCollection, z } from '@nuxt/content' // Export collections export const collections = { // Define collection using `defineCollection` utility posts: defineCollection({ // Specify the type of content in this collection type: 'page', // Load every file matching this pattern source: 'blog/**/*.md', // Define custom schema for this collection schema: z.object({ date: z.date(), image: z.object({ src: z.string(), alt: z.string() }), badge: z.object({ label: z.string(), color: z.string() }) }) }), } Learn more about collections in the documentation.🔧 Simplified Vue UtilsWe simplified the utils to now expose:queryCollection to fetch your collections with our powerful query builderqueryCollectionNavigation to fetch the generated navigation for a specific collectionqueryCollectionItemSurroundings to fetch sibling content for a specific pathqueryCollectionSearchSections to fetch searchable sections from a collection for enhanced content discoveryThese four utils allow your to efficiently fetch and query your content within your Vue pages and components:pages/blog.vue<script setup lang="ts"> const { data: posts } = await useAsyncData('blog', () => { return queryCollection('blog').all() }) </script> <template> <div> <h1>Blog</h1> <ul> <li v-for="post in posts" :key="post.id"> <NuxtLink :to="post.path">{{ post.title }}</NuxtLink> </li> </ul> </div> </template> 📦 Built-in ComponentsWe've updated the components to include only the essentials:ContentRendered to render the parsed Markdown to HTML & Vue componentsSlot replaced ContentSlot as we now support unwrapping using a directive, making your Vue components perfectly compatible to be used in both Vue & MarkdownProse Components are pre-designed components tailored for MDC syntax, with integrated styling for a good appearanceHere's an example of displaying the content of a Markdown file:pages/about.vue<script lang="ts" setup> const { data: page } = await useAsyncData(() => { return queryCollection('content').path('/about').first() }) </script> <template> <ContentRenderer v-if="page" :value="page" /> <p v-else>About page not written yet.</p> </template> 🔷 TypeScript IntegrationThe new collections system provides automatic TypeScript types for all your data. Every utility and API is strongly typed based on your collection definitions, ensuring robust type safety throughout development.⬆️ Migrating from V2Migration should be as easy as possible, this is why we wrote the migration guide.Note that we've decided to remove the document-driven mode to simplify the module usage.🖼️ Studio IntegrationNuxt Studio is a platform to visually edit your Nuxt Content projects in production. With support for Markdown, YAML, or JSON files, our editor ensures versatility and ease of use.Preview APIPreviously an independent module, the Studio module has been updated to be more generic and is now integrated directly into Nuxt Content as a Preview API.Enabling the preview functionality in Studio is easier than ever—simply configure the Studio API as your Preview API in your Nuxt Content settings:nuxt.config.tsexport default defineNuxtConfig({ content: { preview: { api: 'https://api.nuxt.studio' } } }) This simplification means no extra module is required for Studio, making setup faster. Furthermore, the Preview API is now generic, enabling other providers to deliver great editing experiences on top of Nuxt Content.Unified DocumentationIn addition to this integration, we’ve unified the Content and Studio documentation and websites into a single comprehensive resource. Only the Studio platform (available once the user is logged-in) remains as a standalone site.We can now take advantage of data structures and collections in Studio. The Studio platform supports and adapts its behaviour to collections and user-defined schemas. This enhancement will allow schema-generated forms for both YAML and JSON files as well as front-matter within Markdown files.html pre.shiki code .s8pZq, html code.shiki .s8pZq{--shiki-light:#39ADB5;--shiki-light-font-style:italic;--shiki-default:#89DDFF;--shiki-default-font-style:italic;--shiki-dark:#89DDFF;--shiki-dark-font-style:italic}html pre.shiki code .s86vT, html code.shiki .s86vT{--shiki-light:#39ADB5;--shiki-default:#89DDFF;--shiki-dark:#89DDFF}html pre.shiki code .sndM8, html code.shiki .sndM8{--shiki-light:#90A4AE;--shiki-default:#EEFFFF;--shiki-dark:#BABED8}html pre.shiki code .sIEYB, html code.shiki .sIEYB{--shiki-light:#91B859;--shiki-default:#C3E88D;--shiki-dark:#C3E88D}html pre.shiki code .syuKq, html code.shiki .syuKq{--shiki-light:#90A4AE;--shiki-light-font-style:italic;--shiki-default:#546E7A;--shiki-default-font-style:italic;--shiki-dark:#676E95;--shiki-dark-font-style:italic}html pre.shiki code .s50WR, html code.shiki .s50WR{--shiki-light:#9C3EDA;--shiki-default:#C792EA;--shiki-dark:#C792EA}html pre.shiki code .sd2Uz, html code.shiki .sd2Uz{--shiki-light:#E53935;--shiki-default:#F07178;--shiki-dark:#F07178}html pre.shiki code .swgpB, html code.shiki .swgpB{--shiki-light:#6182B8;--shiki-default:#82AAFF;--shiki-dark:#82AAFF}html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}Start with Studio todayGet started for freeRead docs ← Back to blog Copy URL Migrate Nuxt UI Pro Documentation StarterHow to upgrade your Nuxt UI Pro documentation to Content and UI v3Behind the scenes of Nuxt Studio's visual editorDiscover the inner workings of Nuxt Studio's visual editor and how it interprets the Markdown syntax and generate it back.On this pageOn this page🚀 Performance ImprovementsServerless CompatibilityWASM SQLite in Browser🗄️ Content CollectionsDefine CollectionsCollections Schema🔧 Simplified Vue Utils📦 Built-in Components🔷 TypeScript Integration⬆️ Migrating from V2🖼️ Studio IntegrationPreview APIUnified DocumentationLinksFollow on XFollow on BlueskyChat on Discord'''
