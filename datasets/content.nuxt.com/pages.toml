["https://content.nuxt.com/changelog/studio-customisation"]
title = "Studio Form Customisation"
description = "Studio forms are dynamically generated based on the collection schema defined in your content configuration file."
full_description = "ChangelogStudio Form CustomisationContentFebruary 20, 2025Studio Form CustomisationStudio forms are dynamically generated based on the collection schema defined in your content configuration file.BLBaptiste LeprouxThe Studio forms are dynamically generated based on the collection schema defined in your content configuration file. This behaviour applies whether you’re editing the frontmatter of a Markdown file or a JSON / YAML file.Defining your form with zod SchemaNuxt Content leverages zod to let you define a type-safe schema for your content. This schema not only validates your data but also powers the form generation in Studio.Built-in zod HelpersYou can define your Content schema by adding the schema property to your collection and by using a zod schema.@nuxt/content exposes a z object that contains a set of Zod utilities for common data types.content.config.tsGenerated Formexport default defineContentConfig({ collections: { posts: defineCollection({ type: 'page', source: 'blog/*.md', schema: z.object({ draft: z.boolean().default(false), category: z.enum(['Alps', 'Himalaya', 'Pyrenees']).optional(), date: z.date(), image: z.object({ src: z.string().editor({ input: 'media' }), alt: z.string(), }), slug: z.string().editor({ hidden: true }), icon: z.string().optional().editor({ input: 'icon' }), authors: z.array(z.object({ slug: z.string(), username: z.string(), name: z.string(), to: z.string(), avatar: z.object({ src: z.string(), alt: z.string(), }), })), }), }), }, }) Native Inputs MappingPrimitive Zod types are automatically mapped to appropriate form inputs in Studio:String → Text inputDate → Date pickerNumber → Number input (counter)Boolean → Toggle switchEnum → Select dropdownArrays of strings → List of badge inputsArrays of objects → Accordion of items with embedded formCustom Inputs MappingContent goes beyond primitive types. You can customise form fields using the editor method, which extends Zod types with metadata to empower editor interface.This allows you to define custom inputs or hide fields.Usagecontent.config.tsmainScreen: z.string().editor({ input: 'media' }) Optionsinput: 'media' | 'icon'You can set the editor input type. Currently both icon and media are available since there are handled in Studio editor.hidden: BooleanThis option can be set to avoid the display of a field in the Studio editor.Studio inputs are fully extensible. We can create as many input as we want based on our users needs.html pre.shiki code .s8pZq, html code.shiki .s8pZq{--shiki-light:#39ADB5;--shiki-light-font-style:italic;--shiki-default:#89DDFF;--shiki-default-font-style:italic;--shiki-dark:#89DDFF;--shiki-dark-font-style:italic}html pre.shiki code .swgpB, html code.shiki .swgpB{--shiki-light:#6182B8;--shiki-default:#82AAFF;--shiki-dark:#82AAFF}html pre.shiki code .sndM8, html code.shiki .sndM8{--shiki-light:#90A4AE;--shiki-default:#EEFFFF;--shiki-dark:#BABED8}html pre.shiki code .s86vT, html code.shiki .s86vT{--shiki-light:#39ADB5;--shiki-default:#89DDFF;--shiki-dark:#89DDFF}html pre.shiki code .sd2Uz, html code.shiki .sd2Uz{--shiki-light:#E53935;--shiki-default:#F07178;--shiki-dark:#F07178}html pre.shiki code .sIEYB, html code.shiki .sIEYB{--shiki-light:#91B859;--shiki-default:#C3E88D;--shiki-dark:#C3E88D}html pre.shiki code .sPKOg, html code.shiki .sPKOg{--shiki-light:#FF5370;--shiki-default:#FF9CAC;--shiki-dark:#FF9CAC}html .light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html.light .shiki span {color: var(--shiki-light);background: var(--shiki-light-bg);font-style: var(--shiki-light-font-style);font-weight: var(--shiki-light-font-weight);text-decoration: var(--shiki-light-text-decoration);}html .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html pre.shiki code .sYGMc, html code.shiki .sYGMc{--shiki-light:#E2931D;--shiki-default:#FFCB6B;--shiki-dark:#FFCB6B}Start with Studio todayGet started for freeRead docs ← Back to changelog Copy URL Visual YAML and JSON File EditionEdit YAML and JSON files with an automatically generated form.On this pageOn this pageDefining your form with zod SchemaBuilt-in zod HelpersNative Inputs MappingCustom Inputs MappingUsageOptionsinput: 'media' | 'icon'hidden: BooleanLinksFollow on XFollow on BlueskyChat on Discord"
