full_description = '''{"@context":"https://schema.org","@type":"Organization","name":"Contentful","url":"http://www.contentful.com/","logo":"https://www.contentful.com/assets/logo/contentful-light.svg/","sameAs":["https://twitter.com/contentful","https://www.linkedin.com/company/contentful/","https://github.com/contentful","https://www.youtube.com/channel/UCrsEcxPCJlz5yZ_FKGo6D9g","https://www.wikidata.org/wiki/Q18348837","https://en.wikipedia.org/wiki/Contentful"]} Bright people. Big impact. We're creating a better way to build digital experiences. Join us.View open roles in:Customer Experience (4)Engineering (28)IT (2)Legal (2)Marketing (9)Partnerships (1)People (2)Product (2)Sales (26)See all current openingsWhat does Contentful do?Contentful is the pioneer and market leader offering a next-generation composable content platform — the heart of the modern tech stack — that enables enterprises to build digital experiences at scale.Why join Contentful?We like solving big problems and creating even bigger potential.We’re going placesThe New York Times reported that Contentful is one of 50 startups on track to become a unicorn: valued at more than $1 billion.We value smartWe believe that experts stay experts by continually learning. We make this happen by giving you an education budget for conferences, courses and books.Competitive benefitsWith stock options and salaries that grow alongside your impact, you’ll be well taken care of. Moving from overseas? We offer an attractive relocation budget.Create serious wowWhen you work at Contentful, you’ll help the world’s biggest brands create incredible digital experiences.You’ll find friends hereWork with kind and genuine people from 70+ countries. We make building personal connections a priority: Our central cafe culture, all-company off-site and virtual hangouts give you time to enjoy the people you work with.We’re dog lovers, travelers, crafters and athletes. And we never miss a chance to celebrate together.“Working with some of the most brilliant and humble colleagues has been the highlight of my Contentful journey. It feels great to know that you can always get the help that you need. And the opportunity to expand your skills is another cherry on top.“Fajri Hanny - Customer Support Engineer“It's so refreshing working for a company that gives you creative liberty with intelligent colleagues who are also excited about the company and are open to collaboration.“Chigo Kawa - Senior Technical Trainer Learning Services“Contentful checks all the boxes. A great product with huge market potential. A career path that offers a variety of opportunities for growth and learning. And amazing people that both inspire and simply make work….fun."“Sara Sullivan - VP Solution Engineering“Hands down, my favorite employer of my career. It's invigorating that I can really believe in our product, have so much autonomy, and work on a global team that is welcoming, open to collaboration, and wants to help one another.“Nelson Harris, Strategic Partnerships ManagerCustomer SupportLearning ServicesSolution EngineeringPartnershipsWhat do we care about?We believe our product and workplace strongly benefit from being inclusive and equitable, so we give special attention to inclusion and diversity, cross-cultural communication, corporate social responsibility and working together to support the causes we care about. Our core values are:Relentless customer focusWe prioritize the long-term success of our customers in every decision, treat them with respect and transparency, and recognize that we exist to make their lives better.Be boldWe have ambitious ideas, a bias for action and take calculated risks that challenge the status quo.Own itWe have a proactive mindset, own challenges as a team, act decisively, and drive results that matter.Win togetherWe challenge each other to meet high standards, unleash our full potential, and achieve collective success. Where our employees thriveBerlinA new perfectly adapted work