full_description = '''{"@context":"https://schema.org","@type":"Organization","name":"Contentful","url":"http://www.contentful.com/","logo":"https://www.contentful.com/assets/logo/contentful-light.svg/","sameAs":["https://twitter.com/contentful","https://www.linkedin.com/company/contentful/","https://github.com/contentful","https://www.youtube.com/channel/UCrsEcxPCJlz5yZ_FKGo6D9g","https://www.wikidata.org/wiki/Q18348837","https://en.wikipedia.org/wiki/Contentful"]} The Contentful research panel Sign up to become part of our research panel and shape the future of Contentful products!Sign upWhat’s in it for you?Get exclusive access & insightsJoin research studies for early access to new features, stay informed on behind-the-scenes developments, including upcoming releases & beta access.Direct engagement with product teamsConnect with Contentful's product design team, providing valuable feedback on innovations.Appreciation & rewards programReceive thank-you e-gift cards and surprises, while influencing & improving Contentful products.Sign upHow does it work?Join our research panel to contribute to product development.Receive email invitations for relevant studies.Participate in surveys or interviews at your convenience. No obligation to respond if you're busy or not interested.Receive an incentive for your time.You can always opt out (of the panel) if you no longer wish to participate here.Sign upCommonly asked questions about the Contentful research panel Why does Contentful have a research panel?One of Contentful’s core values is “Start with the customer and work backwards.” The first question we always ask ourselves is, “What problems does this solve for our customers?” We believe the best way to answer this question is to get your feedback directly. Your voice will be heard by the people guiding the future of Contentful. What is expected of participants?If you join the Contentful research panel, you get the chance to take part in our internal product development and research projects. We’ll contact you via email and invite you to take part whenever a current study involves people with experiences like yours . The research could be a short survey or a one-on-one interview. But if you’re too busy at the moment, you can ignore the invitation. There’s no obligation to respond or take part! You can always opt out (of the panel) if you no longer wish to participate here.What is in it for me?When you join the Contentful research panel, you have the chance to look behind the curtains! You’ll be able to influence our products and share your thoughts with us. Other benefits could include the chance to go through new features with us. We are aware that your time is precious, therefore we often offer incentives(digital vouchers), in order to compensate for your collaboration with us, especially for one-on-one interviews.What types of participants is Contentful looking for?We are looking for as much diversity as possible — everyone is welcome, including developers, admins, and content creators. It helps if you use contentful or another CMS platform. If you decide to take part in one of our research initiatives, it will be tailored to your specific profile so that you can share your expertise.What happens with the data of participants?We only collect and use your personal data to the extent needed to carry out the research and to stay in touch with you for any possible follow-up. You will not get spammed with any unrelated topics. We may share your personal data with third parties who act as our service providers. Your feedback, in response to our research and survey, will only be shared internally with our team. More information about Contentful’s privacy practices is available on our website: https://www.contentful.com/legal/privacy-at-contentful/privacy-notice/ As a reminder, you can always opt out (of the panel) if you no longer wish to participate here.We look forward to talking with you soon!Sign up'''
year_published = 2021
clearnet = "https://contentful.com/researchpanel"
