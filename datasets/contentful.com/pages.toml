a-d7430f8ecfbe.place-right::before { border-right: 8px solid transparent; } .t81d65774-e3aa-4685-b34a-d7430f8ecfbe.place-right::after { border-top: 5px solid transparent; border-bottom: 5px solid transparent; left: -6px; top: 50%; margin-top: -4px; border-right-color: #222; border-right-style: solid; border-right-width: 6px; } Traditional Content Management System architecture was once the standard for web development, but as business needs and customer expectations grow more complex, the more common technology used these days is known as Headless CMS, or Headless Content Management System. This page breaks down what Headless CMS is, including why the industry landed on “headless” as the chosen turn of phrase. Read on to find out more!On this pageHeadless CMS explained in 1 minuteWhat is a headless CMS?The origins of headless CMSHeadless CMS vs. traditional CMS at-a-glanceHow does a headless CMS solution work?View more .t6f13d60d-04df-49ed-8f09-779a218d4110 { color: #fff; background: #222; border: 1px solid transparent; } .t6f13d60d-04df-49ed-8f09-779a218d4110.place-top { margin-top: -10px; } .t6f13d60d-04df-49ed-8f09-779a218d4110.place-top::before { border-top: 8px solid transparent; } .t6f13d60d-04df-49ed-8f09-779a218d4110.place-top::after { border-left: 8px solid transparent; border-right: 8px solid transparent; bottom: -6px; left: 50%; margin-left: -8px; border-top-color: #222; border-top-style: solid; border-top-width: 6px; } .t6f13d60d-04df-49ed-8f09-779a218d4110.place-bottom { margin-top: 10px; } .t6f13d60d-04df-49ed-8f09-779a218d4110.place-bottom::before { border-bottom: 8px solid transparent; } .t6f13d60d-04df-49ed-8f09-779a218d4110.place-bottom::after { border-left: 8px solid transparent; border-right: 8px solid transparent; top: -6px; left: 50%; margin-left: -8px; border-bottom-color: #222; border-bottom-style: solid; border-bottom-width: 6px; } .t6f13d60d-04df-49ed-8f09-779a218d4110.place-left { margin-left: -10px; } .t6f13d60d-04df-49ed-8f09-779a218d4110.place-left::before { border-left: 8px solid transparent; } .t6f13d60d-04df-49ed-8f09-779a218d4110.place-left::after { border-top: 5px solid transparent; border-bottom: 5px solid transparent; right: -6px; top: 50%; margin-top: -4px; border-left-color: #222; border-left-style: solid; border-left-width: 6px; } .t6f13d60d-04df-49ed-8f09-779a218d4110.place-right { margin-left: 10px; } .t6f13d60d-04df-49ed-8f09-779a218d4110.place-right::before { border-right: 8px solid transparent; } .t6f13d60d-04df-49ed-8f09-779a218d4110.place-right::after { border-top: 5px solid transparent; border-bottom: 5px solid transparent; left: -6px; top: 50%; margin-top: -4px; border-right-color: #222; border-right-style: solid; border-right-width: 6px; } Headless CMS explained in 1 minute .tbd16794b-151b-4166-aefe-5aaead31b8e8 { color: #fff; background: #222; border: 1px solid transparent; } .tbd16794b-151b-4166-aefe-5aaead31b8e8.place-top { margin-top: -10px; } .tbd16794b-151b-4166-aefe-5aaead31b8e8.place-top::before { border-top: 8px solid transparent; } .tbd16794b-151b-4166-aefe-5aaead31b8e8.place-top::after { border-left: 8px solid transparent; border-right: 8px solid transparent; bottom: -6px; left: 50%; margin-left: -8px; border-top-color: #222; border-top-style: solid; border-top-width: 6px; } .tbd16794b-151b-4166-aefe-5aaead31b8e8.place-bottom { margin-top: 10px; } .tbd16794b-151b-4166-aefe-5aaead31b8e8.place-bottom::before { border-bottom: 8px solid transparent; } .tbd16794b-151b-4166-aefe-5aaead31b8e8.place-bottom::after { border-left: 8px solid transparent; border-right: 8px solid transparent; top: -6px; left: 50%; margin-left: -8px; border-bottom-color: #222; border-bottom-style: solid; border-bottom-width: 6px; } .tbd16794b-151b-4166-aefe-5aaead31b8e8.place-left { margin-left: -10px; } .tbd16794b-151b-4166-aefe-5aaead31b8e8.place-left::before { border-left: 8px solid transparent; } .tbd16794b-151b-4166-aefe-5aaead31b8e8.place-left::after { border-top: 5px solid transparent; border-bottom: 5px solid transparent; right: -6px; top: 50%; margin-top: -4px; border-left-color: #222; border-left-style: solid; border-left-width: 6px; } .tbd16794b-151b-4166-aefe-5aaead31b8e8.place-right { margin-left: 10px; } .tbd16794b-151b-4166-aefe-5aaead31b8e8.place-right::before { border-right: 8px solid transparent; } .tbd16794b-151b-4166-aefe-5aaead31b8e8.place-right::after { border-top: 5px solid transparent; border-bottom: 5px solid transparent; left: -6px; top: 50%; margin-top: -4px; border-right-color: #222; border-right-style: solid; border-right-width: 6px; } What is a headless CMS?A headless CMS is a content management system that separates the presentation layer (where content is presented) from the backend (where content is managed). A headless CMS allows you to manage content in one place and be able to deploy that content on any digital channel you choose. Separating the frontend from the backend unlocks your content, making it easier for marketers to manage content independently, and for developers to build faster, automate changes, and manage digital at scale. In a traditional CMS, content is tangled up with code and locked in silos, making reusing content — and creating modern digital experiences — next to impossible. .t4f28f474-bb43-4b9c-86b3-968210f61da6 { color: #fff; background: #222; border: 1px solid transparent; } .t4f28f474-bb43-4b9c-86b3-968210f61da6.place-top { margin-top: -10px; } .t4f28f474-bb43-4b9c-86b3-968210f61da6.place-top::before { border-top: 8px solid transparent; } .t4f28f474-bb43-4b9c-86b3-968210f61da6.place-top::after { border-left: 8px solid transparent; border-right: 8px solid transparent; bottom: -6px; left: 50%; margin-left: -8px; border-top-color: #222; border-top-style: solid; border-top-width: 6px; } .t4f28f474-bb43-4b9c-86b3-968210f61da6.place-bottom { margin-top: 10px; } .t4f28f474-bb43-4b9c-86b3-968210f61da6.place-bottom::before { border-bottom: 8px solid transparent; } .t4f28f474-bb43-4b9c-86b3-968210f61da6.place-bottom::after { border-left: 8px solid transparent; border-right: 8px solid transparent; top: -6px; left: 50%; margin-left: -8px; border-bottom-color: #222; border-bottom-style: solid; border-bottom-width: 6px; } .t4f28f474-bb43-4b9c-86b3-968210f61da6.place-left { margin-left: -10px; } .t4f28f474-bb43-4b9c-86b3-968210f61da6.place-left::before { border-left: 8px solid transparent; } .t4f28f474-bb43-4b9c-86b3-968210f61da6.place-left::after { border-top: 5px solid transparent; border-bottom: 5px solid transparent; right: -6px; top: 50%; margin-top: -4px; border-left-color: #222; border-left-style: solid; border-left-width: 6px; } .t4f28f474-bb43-4b9c-86b3-968210f61da6.place-right { margin-left: 10px; } .t4f28f474-bb43-4b9c-86b3-968210f61da6.place-right::before { border-right: 8px solid transparent; } .t4f28f474-bb43-4b9c-86b3-968210f61da6.place-right::after { border-top: 5px solid transparent; border-bottom: 5px solid transparent; left: -6px; top: 50%; margin-top: -4px; border-right-color: #222; border-right-style: solid; border-right-width: 6px; } The origins of headless CMSTo understand what a headless CMS solution is, it helps to first look at the traditional content management system and what it was designed to do. Traditional CMSes have been around since the early days of web development. Platforms like Wordpress, Drupal, and Sitecore were designed to store and present content elements like text, images, and video on websites specifically. The traditional CMS approach to managing content puts everything into one big bucket — content, images, HTML, and CSS. This made it impossible to reuse content because it was commingled with code. As digital channels and devices have evolved, the need for more flexible solutions has emerged. Now, enterprises are developing websites, mobile apps, digital displays, conversational interfaces, and more. Meanwhile, the traditional CMS failed to keep pace. Why? Because a CMS organizes content in webpage-oriented frameworks, making it impossible for the same content to fit other digital platforms or software. .t9ad3147c-15b3-4c36-ab15-1cd6ba5d7f8c { color: #fff; background: #222; border: 1px solid transparent; } .t9ad3147c-15b3-4c36-ab15-1cd6ba5d7f8c.place-top { margin-top: -10px; } .t9ad3147c-15b3-4c36-ab15-1cd6ba5d7f8c.place-top::before { border-top: 8px solid transparent; } .t9ad3147c-15b3-4c36-ab15-1cd6ba5d7f8c.place-top::after { border-left: 8px solid transparent; border-right: 8px solid transparent; bottom: -6px; left: 50%; margin-left: -8px; border-top-color: #222; border-top-style: solid; border-top-width: 6px; } .t9ad3147c-15b3-4c36-ab15-1cd6ba5d7f8c.place-bottom { margin-top: 10px; } .t9ad3147c-15b3-4c36-ab15-1cd6ba5d7f8c.place-bottom::before { border-bottom: 8px solid transparent; } .t9ad3147c-15b3-4c36-ab15-1cd6ba5d7f8c.place-bottom::after { border-left: 8px solid transparent; border-right: 8px solid transparent; top: -6px; left: 50%; margin-left: -8px; border-bottom-color: #222; border-bottom-style: solid; border-bottom-width: 6px; } .t9ad3147c-15b3-4c36-ab15-1cd6ba5d7f8c.place-left { margin-left: -10px; } .t9ad3147c-15b3-4c36-ab15-1cd6ba5d7f8c.place-left::before { border-left: 8px solid transparent; } .t9ad3147c-15b3-4c36-ab15-1cd6ba5d7f8c.place-left::after { border-top: 5px solid transparent; border-bottom: 5px solid transparent; right: -6px; top: 50%; margin-top: -4px; border-left-color: #222; border-left-style: solid; border-left-width: 6px; } .t9ad3147c-15b3-4c36-ab15-1cd6ba5d7f8c.place-right { margin-left: 10px; } .t9ad3147c-15b3-4c36-ab15-1cd6ba5d7f8c.place-right::before { border-right: 8px solid transparent; } .t9ad3147c-15b3-4c36-ab15-1cd6ba5d7f8c.place-right::after { border-top: 5px solid transparent; border-bottom: 5px solid transparent; left: -6px; top: 50%; margin-top: -4px; border-right-color: #222; border-right-style: solid; border-right-width: 6px; } Headless CMS vs. traditional CMS at-a-glanceUse this table as a quick reference to see how traditional CMS stacks up against headless CMS when it comes to critical tech features needed to do your job properly. Traditional CMSHeadless CMSHosting & deliveryIn-houseIn the cloudDevelopment mindsetProject-focusedProduct-focusedContent modelBuilt for a single pageBuilding block for many productsSupported devicesLimitedLimitlessReachOne-to-oneOne-to-manyWorkflowWaterfallAgileUpdatesScheduledContinuousBackend systemMonolithic, all-in-oneMicroservice, best-in-classInvestmentLarge up-front costQuick proof of conceptTechnical debtInherent to the systemManaged .tf6152a27-1cf9-4a08-bd1f-ec3bbada65f5 { color: #fff; background: #222; border: 1px solid transparent; } .tf6152a27-1cf9-4a08-bd1f-ec3bbada65f5.place-top { margin-top: -10px; } .tf6152a27-1cf9-4a08-bd1f-ec3bbada65f5.place-top::before { border-top: 8px solid transparent; } .tf6152a27-1cf9-4a08-bd1f-ec3bbada65f5.place-top::after { border-left: 8px solid transparent; border-right: 8px solid transparent; bottom: -6px; left: 50%; margin-left: -8px; border-top-color: #222; border-top-style: solid; border-top-width: 6px; } .tf6152a27-1cf9-4a08-bd1f-ec3bbada65f5.place-bottom { margin-top: 10px; } .tf6152a27-1cf9-4a08-bd1f-ec3bbada65f5.place-bottom::before { border-bottom: 8px solid transparent; } .tf6152a27-1cf9-4a08-bd1f-ec3bbada65f5.place-bottom::after { border-left: 8px solid transparent; border-right: 8px solid transparent; top: -6px; left: 50%; margin-left: -8px; border-bottom-color: #222; border-bottom-style: solid; border-bottom-width: 6px; } .tf6152a27-1cf9-4a08-bd1f-ec3bbada65f5.place-left { margin-left: -10px; } .tf6152a27-1cf9-4a08-bd1f-ec3bbada65f5.place-left::before { border-left: 8px solid transparent; } .tf6152a27-1cf9-4a08-bd1f-ec3bbada65f5.place-left::after { border-top: 5px solid transparent; border-bottom: 5px solid transparent; right: -6px; top: 50%; margin-top: -4px; border-left-color: #222; border-left-style: solid; border-left-width: 6px; } .tf6152a27-1cf9-4a08-bd1f-ec3bbada65f5.place-right { margin-left: 10px; } .tf6152a2