e-right { margin-left: 10px; } .t71adf760-7fc8-4b53-a32d-80ff48a8b94d.place-right::before { border-right: 8px solid transparent; } .t71adf760-7fc8-4b53-a32d-80ff48a8b94d.place-right::after { border-top: 5px solid transparent; border-bottom: 5px solid transparent; left: -6px; top: 50%; margin-top: -4px; border-right-color: #222; border-right-style: solid; border-right-width: 6px; } The Composable Content guide1. What is Composable content?2. What is composable architecture?3. Composable vs headless4. What is a composable CMS?5. From composable content to composable commerce6. Composable content for marketers7. Composable content for developers8. How composable content is transforming digital experiences across industriesIn this guide we’ll cover everything you need to know about what composable content is, how it helps companies deliver the experiences customers expect, and how you can get started with a composable approach.On this pageIntroductionComposable content definedA new way of working with content at scaleWhy digital leaders are adopting a composable content strategyWhat are the benefits of a composable content platform?View more .t70aa19ea-a2b4-44a3-85b1-8b6825ae3496 { color: #fff; background: #222; border: 1px solid transparent; } .t70aa19ea-a2b4-44a3-85b1-8b6825ae3496.place-top { margin-top: -10px; } .t70aa19ea-a2b4-44a3-85b1-8b6825ae3496.place-top::before { border-top: 8px solid transparent; } .t70aa19ea-a2b4-44a3-85b1-8b6825ae3496.place-top::after { border-left: 8px solid transparent; border-right: 8px solid transparent; bottom: -6px; left: 50%; margin-left: -8px; border-top-color: #222; border-top-style: solid; border-top-width: 6px; } .t70aa19ea-a2b4-44a3-85b1-8b6825ae3496.place-bottom { margin-top: 10px; } .t70aa19ea-a2b4-44a3-85b1-8b6825ae3496.place-bottom::before { border-bottom: 8px solid transparent; } .t70aa19ea-a2b4-44a3-85b1-8b6825ae3496.place-bottom::after { border-left: 8px solid transparent; border-right: 8px solid transparent; top: -6px; left: 50%; margin-left: -8px; border-bottom-color: #222; border-bottom-style: solid; border-bottom-width: 6px; } .t70aa19ea-a2b4-44a3-85b1-8b6825ae3496.place-left { margin-left: -10px; } .t70aa19ea-a2b4-44a3-85b1-8b6825ae3496.place-left::before { border-left: 8px solid transparent; } .t70aa19ea-a2b4-44a3-85b1-8b6825ae3496.place-left::after { border-top: 5px solid transparent; border-bottom: 5px solid transparent; right: -6px; top: 50%; margin-top: -4px; border-left-color: #222; border-left-style: solid; border-left-width: 6px; } .t70aa19ea-a2b4-44a3-85b1-8b6825ae3496.place-right { margin-left: 10px; } .t70aa19ea-a2b4-44a3-85b1-8b6825ae3496.place-right::before { border-right: 8px solid transparent; } .t70aa19ea-a2b4-44a3-85b1-8b6825ae3496.place-right::after { border-top: 5px solid transparent; border-bottom: 5px solid transparent; left: -6px; top: 50%; margin-top: -4px; border-right-color: #222; border-right-style: solid; border-right-width: 6px; } Composable contentComposable content is a means of orchestrating and structuring digital content from any system. It organizes text, images, graphics, sound, and even data into small (but still meaningful) pieces that teams can use in any number of combinations across multi-brands, use cases, channels, and regions. .t52c7c698-e6a1-4950-b532-3edd91dbff88 { color: #fff; background: #222; border: 1px solid transparent; } .t52c7c698-e6a1-4950-b532-3edd91dbff88.place-top { margin-top: -10px; } .t52c7c698-e6a1-4950-b532-3edd91dbff88.place-top::before { border-top: 8px solid transparent; } .t52c7c698-e6a1-4950-b532-3edd91dbff88.place-top::after { border-left: 8px solid transparent; border-right: 8px solid transparent; bottom: -6px; left: 50%; margin-left: -8px; border-top-color: #222; border-top-style: solid; border-top-width: 6px; } .t52c7c698-e6a1-4950-b532-3edd91dbff88.place-bottom { margin-top: 10px; } .t52c7c698-e6a1-4950-b532-3edd91dbff88.place-bottom::before { border-bottom: 8px solid transparent; } .t52c7c698-e6a1-4950-b532-3edd91dbff88.place-bottom::after { border-left: 8px solid transparent; border-right: 8px solid transparent; top: -6px; left: 50%; margin-left: -8px; border-bottom-color: #222; border-bottom-style: solid; border-bottom-width: 6px; } .t52c7c698-e6a1-4950-b532-3edd91dbff88.place-left { margin-left: -10px; } .t52c7c698-e6a1-4950-b532-3edd91dbff88.place-left::before { border-left: 8px solid transparent; } .t52c7c698-e6a1-4950-b532-3edd91dbff88.place-left::after { border-top: 5px solid transparent; border-bottom: 5px solid transparent; right: -6px; top: 50%; margin-top: -4px; border-left-color: #222; border-left-style: solid; border-left-width: 6px; } .t52c7c698-e6a1-4950-b532-3edd91dbff88.place-right { margin-left: 10px; } .t52c7c698-e6a1-4950-b532-3edd91dbff88.place-right::before { border-right: 8px solid transparent; } .t52c7c698-e6a1-4950-b532-3edd91dbff88.place-right::after { border-top: 5px solid transparent; border-bottom: 5px solid transparent; left: -6px; top: 50%; margin-top: -4px; border-right-color: #222; border-right-style: solid; border-right-width: 6px; } Composable content definedComposable content is both the output and the process of orchestrating and structuring digital content from any system, allowing teams to quickly shape dynamic experiences for distinct audiences. You can think of composable content as the door to limitless configurable content. What sets composable content apart is that content creators, developers, and machines can all easily interact with it. It’s API-accessible so everyone who needs to can work with and use it — quite different from the content stored in legacy content management systems. Composable content also leans heavily on structured content — segmenting text, images, graphics, sound, and even data into small (but still meaningful) pieces so that they can be readily used in any number of combinations in any context, channel, or device. It’s pure content that can be used anywhere with any language presentation layer. Read on belowComposable content chaptersArticle1: What is composable content?Article2: What is composable architecture?Article3: Composable vs headlessArticle4: What is a composable CMS?Article5: Composable commerceArticle6: Composable content for marketersArticle7: Composable content for developersArticle8: Transforming digital experiences .t02410240-39a7-4016-9a05-6c51ea5796a8 { color: #fff; background: #222; border: 1px solid transparent; } .t02410240-39a7-4016-9a05-6c51ea5796a8.place-top { margin-top: -10px; } .t02410240-39a7-4016-9a05-6c51ea5796a8.place-top::before { border-top: 8px solid transparent; } .t02410240-39a7-4016-9a05-6c51ea5796a8.place-top::after { border-left: 8px solid transparent; border-right: 8px solid transparent; bottom: -6px; left: 50%; margin-left: -8px; border-top-color: #222; border-top-style: solid; border-top-width: 6px; } .t02410240-39a7-4016-9a05-6c51ea5796a8.place-bottom { margin-top: 10px; } .t02410240-39a7-4016-9a05-6c51ea5796a8.place-bottom::before { border-bottom: 8px solid transparent; } .t02410240-39a7-4016-9a05-6c51ea5796a8.place-bottom::after { border-left: 8px solid transparent; border-right: 8px solid transparent; top: -6px; left: 50%; margin-left: -8px; border-bottom-color: #222; border-bottom-style: solid; border-bottom-width: 6px; } .t02410240-39a7-4016-9a05-6c51ea5796a8.place-left { margin-left: -10px; } .t02410240-39a7-4016-9a05-6c51ea5796a8.place-left::before { border-left: 8px solid transparent; } .t02410240-39a7-4016-9a05-6c51ea5796a8.place-left::after { border-top: 5px solid transparent; border-bottom: 5px solid transparent; right: -6px; top: 50%; margin-top: -4px; border-left-color: #222; border-left-style: solid; border-left-width: 6px; } .t02410240-39a7-4016-9a05-6c51ea5796a8.place-right { margin-left: 10px; } .t02410240-39a7-4016-9a05-6c51ea5796a8.place-right::before { border-right: 8px solid transparent; } .t02410240-39a7-4016-9a05-6c51ea5796a8.place-right::after { border-top: 5px solid transparent; border-bottom: 5px solid transparent; left: -6px; top: 50%; margin-top: -4px; border-right-color: #222; border-right-style: solid; border-right-width: 6px; } Composable enables a new way of working with content at scaleIn the last decade, we've seen the market transition from channel-first digital marketing to experience-first marketing that focuses on the customer journey as a whole, not as a series of websites, apps, emails, and advertisements. Connecting all these pieces into cohesive experiences requires companies to think and work differently. It requires new technologies that support a composable approach and composable content. In the old way of working, first you picked a channel and then you created the content. So, maybe you created a web page in a content management system. Then, you needed content for the mobile app, so you created that in another system. But then you needed an email too, so you copy/pasted content into another system. And if it was for a global campaign, you repeated the process for each additional market, translating content manually along the way. A more efficient content creation process for any digital channel With a composable approach, you might start with a specific channel in mind, but you're also mindful of the other channels your customers will use to experience that content. This changes the content creation process: you worry less about how the content will be presented, and instead focus on producing high-quality, engaging content. The goal is to create great content once and reuse it everywhere. Instead of creating content in a big block, you fill out a series of smaller chunks that have been defined by your developer and information architect. Why? Because this enables developers to take your content and quickly integrate it into the front end. It also means you and other editors can mix and match content to compose different experiences instead of recreating it for each channel. For example, having two chunks or content types called "product benefits" and "usage instructions" makes it easy to pull this content into a product page and combine it with content from an ecommerce platform. You can also quickly apply different visual styles to copy elements. If all that content was stored in the same field, it'd be extremely hard to reuse it in these different ways. Employing a composable content method makes working with content more efficient. That means you can spend time on more interesting things — like localization and personalization. Curious about how composable content works? Watch this demo to learn how a composable content platform makes it easier to maintain and deploy content across different channels and geographies that need localized content and a consistent brand message. .te754bd92-dfa6-42bc-95ed-b049916e5927 { color: #fff; background: #222; border: 1px solid transparent; } .te754bd92-dfa6-42bc-95ed-b049916e5927.place-top { margin-top: -10px; } .te754bd92-dfa6-42bc-95ed-b049916e5927.place-top::before { border-top: 8px solid transparent; } .te754bd92-dfa6-42bc-95ed-b049916e5927.place-top::after { border-left: 8px solid transparent; border-right: 8px solid transparent; bottom: -6px; left: 50%; margin-left: -8px; border-top-color: #222; border-top-style: solid; border-top-width: 6px; } .te754bd92-dfa6-42bc-95ed-b049916e5927.place-bottom { margin-top: 10px; } .te754bd92-dfa6-42bc-95ed-b049916e5927.place-bottom::before { border-bottom: 8px solid transparent; } .te754bd92-dfa6-42bc-95ed-b049916e5927.place-bottom::after { border-left: 8px solid transparent; border-right: 8px solid transparent; top: -6px; left: 50%; margin-left: -8px; border-bottom-color: #222; border-bottom-style: solid; border-bottom-width: 6px; } .te754bd92-dfa6-42bc-95ed-b049916e5927.place-left { margin-left: -10px; } .te754bd92-dfa6-42bc-95ed-b049916e5927.place-left::before { border-left: 8px solid transparent; } .te754bd92-dfa6-42bc-95ed-b049916e5927.place-left::after { border-top: 5px solid transparent; border-bottom: 5px solid transparent; right: -6px; top: 50%; margin-top: -4px; border-left-color: #222; border-left-style: solid; border-left-width: 6px; } .te754bd92-dfa6-42bc-95ed-b049916e5927.place-right { margin-left: 10px; } .te754bd92-dfa6-42bc-95ed-b049916e5927.place-right::before { border-right: 8px solid transparent; } .te754bd92-dfa6-42bc-95ed-b049916e5927.place-right::after { border-top: 5px solid transparent; border-bottom: 5px solid transparent; left: -6px; top: 50%; margin-top: -4px; border-right-color: #222; border-right-style: solid; border-right-width: 6px; } Why digital leaders are adopting a composable content strategyCompanies are racing to build and launch better experiences faster, but the teams building these experiences are slowed down by disconnected tools, rigid templates, and unnecessary dependencies between developers and marketers. Trading monolithic tools for a composable ecosystem is less about the technology and more about the digital transformation it enables. A composable content strate'''
