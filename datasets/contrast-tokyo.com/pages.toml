["https://contrast-tokyo.com/archive/memory_in_motion"]
title = "Memory in Motion: 忍耐による建築 - CONTRAST ARCHIVE"
description = """
この度、7月15日(土)から7月23日(日)まで、ウクライナのアーティストで建築家のボグダン・サーレディアクによる日本では初の個展となる「Memory in Motion：忍耐による建築」をCONTRASTにて開催致します。

2018年以降、ボグダンは実用的デザイン、空間インスタレーション、都市や社会研究に影響を受けた様々な建築プロジェクトを通して、人間中心の環境を改善することを目標に、独立して活動しています。また、鑑賞者が空間を知覚し、理解する事を目的とし、2022年5月に発表した最新作「Memory in Motion」ではロッテルダムの戦後景観に関する研究を元に、建築や市民社会において、建築環境における集合的記憶をテーマに議論し、人々が互いに対話することを目指しています。そして、2022年9月来日以降は日本の復興戦略を同プロジェクトに取り組んでいます。

本展では常に変化し続ける建築について探求し、どのように破壊された建物を再建するか？どうすれば、過去の記憶を保持しながら、それを超越する事が出来るか？建築は記憶の集合体でもあり、ひとたび破壊されれば、歴史の連続性が危ぶまれます。ウクライナの戦後復興に焦点を当て、ウクライナでよく見られる4つの様式、ビザンティン、バロック、ソビエト・モダニズム、伝統工法（小さな木造教会など）を機械学習アルゴリズムを用いて融合させる事によって、ウクライナ独自の建築デザインを探求すると共に、解決策ではなく、フレームワークとして発表致します。そして、新しい建築は意図的な意図とデザインによって、慣れ親しんだ古いものから根本的に新しいものへと変化し、再構成された居住空間に対して進歩的でありながら記憶的なアイデアを実現することができます。

Supported by 在日ウクライナ大使館"""
