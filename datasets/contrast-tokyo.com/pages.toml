title = "対話 - CONTRAST ARCHIVE"
description = """
この度、写真と映像の制作プロダクションbird and insectのディレクターShuma JanとシネマトグラファーのAbe Daisukeによる初の2人展「対話」を10月28日(金)から10月30日(日)までCONTRASTで開催しました。

ディレクターとシネマトグラファーという関係上、2人で制作について議論を交わすことが多く、同じ成果物に対しても、そこには別々の視点、そして考え方があることに気が付き、どれだけ長い間、時を共にしていたとしても、アイデンティティやバックグラウンドの違いは、当然のごとく、見るもの、考えるものに別々の影響を与え、別々の結果を生み出します。
その反面、あまり言葉を交わさずとも、同じビジョンを思い描くことができることもあり、そのような気づきから、本展のテーマ「対話」が生まれました。

Shuma Janは映像作品、Abe Daisukeは写真作品をそれぞれ展示し、各人のもつ作品に対する考えが提示されました。

