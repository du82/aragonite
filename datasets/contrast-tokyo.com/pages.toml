["https://contrast-tokyo.com/archive/morphosis"]
title = "Morphosis - CONTRAST ARCHIVE"
description = """
この度、フランス出身マルタン・ベルトの個展「Morphosis」を11月24日(金)から26(日)までCONTRASTにて開催致します。

「Morphosis」は過去1年半にわたり、触覚と視覚表現の領域をより深く掘り下げ、2023年に制作した「A Contaminated Love Story」を元に官能的で錯綜する感情の微細な複雑さに焦点を当てています。
また、ダーク・シュルレアリスムの影響を受け、グロテスクと美の要素が組み合わさり、混沌と静謐の対比が描かれています。

本展では銅像、版画、写真、ARインスタレーション、パフォーマンスの他、3Dプリンターで制作されたマスク、ウェアラブル、短編映画など、様々なメディアを探求します。

11月24日(金)のオープニングでは入場料¥1,000でドリンク、パフォーマンス、アニメーションをお楽しみ頂けます。

