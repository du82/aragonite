["https://contrast-tokyo.com/archive/exhibition_and_order_event"]
title = "展示 & 受注会 - CONTRAST ARCHIVE"
description = """
この度、〈Haa Jime Studio〉初の展示および受注会を11/30(土) と12/1(日)の2日間、CONTRASTにて開催致しました。

スウェーデンを拠点に活動しているガラス作家の山野・アンダーソン・陽子とのコラボレーションにより実現したガラスの照明や、日本各地の職人たちと作り上げた、素材の力強さを感じられる家具が集いました。

家具は受注生産となり、仕上がり次第お客様へお届け。

ー

自宅で使うことはもちろん、飲食店やそのほかさまざまなお店での長きに渡る使用にも耐えうるような力強さを持ち合わせた家具であり、そして木の素材や人の手のあたたかさを感じられる家具のありかたを目指し、日本の職人によるたしかな技術力を礎に、〈Haa Jime Studio〉を立ち上げました。

Studioの名には、関わってくださる全ての職人たちを巻き込んだ“私たち”である意味と匿名性を込めています。〈Haa Jime Studio〉は、誰かひとりの力だけではなく多くの人の手が介在しているプロジェクトであることを大切にしています。

素材や技術やデザインなどのすべての要素を包括し、決して強く主張はせずともしっかりと存在感のある佇まいであることが、〈Haa Jime Studio〉の理想です。"""
