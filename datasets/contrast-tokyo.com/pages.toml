["https://contrast-tokyo.com/archive/golem_ph2"]
title = "GOLEM Ph2 - CONTRAST ARCHIVE"
description = """
この度、「GOLEM」に所属する造形作家、石野平四郎、植田明志、蔦本大樹、中西宏彰、森田悠揮、米山啓介によるグループ展「GOLEM Ph2 」を2月17日(土)から3月3日(日)までCONTRASTにて開催致します。

「GOLEM」はサブカルチャー発祥の「造形作家」と呼ばれるアーティスト達が、芸術領域で確かな立ち位置を表明していくために発起し、展示を展開していく気鋭の造形作家集団です。2022年に3331アーツ千代田で第一回目を開催し、第二波となる本展では「彫刻」をテーマに、彼等の立ち位置について考えられるような、物理的な出会いを鑑賞者に提供します。

また、同時期 2月16日(木)から25日(日)には東京都台東区、文京区内の11会場で開催される「きらめき彫刻祭」@kirameki_art_fes に「GOLEM Ph1.5」としても参加しており、並行してあらゆる類いの彫刻の流れを掴みながら、鑑賞体験できる仕掛けを半澤美術店(会場4)にてお楽しみ頂けます。"""
