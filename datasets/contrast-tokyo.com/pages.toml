["https://contrast-tokyo.com/archive/absences"]
title = "Absences - CONTRAST ARCHIVE"
description = """
この度、3月4日(土)から3月19日(日)まで、東京を拠点に活動するフランス人ビジュアルアーティスト、ルイジ・オノラの個展「Absences」をCONTRASTにて開催致しました。

オノラは武蔵野美術大学にて彫刻を学んだ後、現在は同大学で講師として務めながら、オブジェと3DCGをメディアとしたアートの研鑽に努め、コンピューターグラフィックを駆使して新たな彫刻のフォルムや動き、手法を探求。「現実と仮想」、「オブジェとデータ」、「美とある種の不気味さ」と様々な要素を組み合わせ、相互にリンクさせたインスタレーション、彫刻、映像作品を制作しています。

Apple、Adidas、L’Oréal、The New York Times等のブランドや、Moses Sumney、Son Lux's Ian Chang、Micka Luna、Variérasといったミュージシャンとの仕事でも知られています。

本展では、プリント、AR (拡張現実)、映像という異なる3つのメディアで構成されたデジタルスカルプチャーの新作シリーズを発表致しました。プリントやARを通して、実際には存在しないデジタルスカルプチャーの体感を可能とし、映像作品ではそのフォルムが形成されていく一連の変化により、具象的なトルソーが溶けては消え、トランスフォームする過程から、「Absences (不在)」の概念を探求しました。
また、会場ではARマーカーのプリント販売も行い、別空間で読み込む事により、空間と身体の関係にも問いを投げかけました。"""
full_description = "ArchiveAbsencesルイジ・オノラこの度、3月4日(土)から3月19日(日)まで、東京を拠点に活動するフランス人ビジュアルアーティスト、ルイジ・オノラの個展「Absences」をCONTRASTにて開催致しました。 オノラは武蔵野美術大学にて彫刻を学んだ後、現在は同大学で講師として務めながら、オブジェと3DCGをメディアとしたアートの研鑽に努め、コンピューターグラフィックを駆使して新たな彫刻のフォルムや動き、手法を探求。「現実と仮想」、「オブジェとデータ」、「美とある種の不気味さ」と様々な要素を組み合わせ、相互にリンクさせたインスタレーション、彫刻、映像作品を制作しています。 Apple、Adidas、L’Oréal、The New York Times等のブランドや、Moses Sumney、Son Lux's Ian Chang、Micka Luna、Variérasといったミュージシャンとの仕事でも知られています。 本展では、プリント、AR (拡張現実)、映像という異なる3つのメディアで構成されたデジタルスカルプチャーの新作シリーズを発表致しました。プリントやARを通して、実際には存在しないデジタルスカルプチャーの体感を可能とし、映像作品ではそのフォルムが形成されていく一連の変化により、具象的なトルソーが溶けては消え、トランスフォームする過程から、「Absences (不在)」の概念を探求しました。 また、会場ではARマーカーのプリント販売も行い、別空間で読み込む事により、空間と身体の関係にも問いを投げかけました。VIDEODOP/EDIT: Ryosuke SendaDIRECTION : Taiju Nakajima (IN FOCUS)PRODUCE : Masaki Fushimi (IN FOCUS)PHOTO：Yoshinori Kataoka (IN FOCUS)VIDEODOP/EDIT: Ryosuke SendaDIRECTION : Taiju Nakajima (IN FOCUS)PRODUCE : Masaki Fushimi (IN FOCUS)PHOTO：Yoshinori Kataoka (IN FOCUS)"
