["https://contrast-tokyo.com/archive/meet_your_art"]
title = "MEET YOUR ART FESTIVAL 2023 「Time to Change」 - CONTRAST ARCHIVE"
description = """
この度、CONTRASTは10月6日(金)から9日(月・祝)まで、100名以上のアーティストが参加する国内最大級のアートとカルチャーの祭典『MEET YOUR ART FESTIVAL 2023 「Time to Change」』に出展します。

「MEET YOUR ART FESTIVAL」はアートを軸に、音楽・食・ファッション・ライフスタイルに隣接したカルチャーを一堂に会する事で、領域を超えてカルチャーの魅力に気付きを生み出すと共に、アートに対する新しい出会いや発見を設計する事を目指す、領域横断型のアートフェスティバルです。

第二回目は更に規模を拡大し、寺田倉庫を中心とした東京・天王洲運河エリア一帯にて、アートエキシビジョン・2つのアートフェア・ライヴパフォーマンス・トークセッション・マーケットと6つの会場で同時に行われます。

CONTRASTはアートとカルチャーが交差する風景を15組以上のキュレーター／ギャラリーが各々の視点で切り取るミックスカルチャーアートフェアのの1つ「CROSSOVER」に出展。

今回の出展では「茶の湯×現代アート」をテーマにアートプロデュースを手がける「無茶苦茶」から代表の宇野景太が共同キュレーターとして参画。
IN FOCUS代表の井口忠正、國本怜、本橋孝祐の3名が既成概念に捉われない新たな表現を模索します。"""
