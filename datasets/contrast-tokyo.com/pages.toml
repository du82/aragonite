["https://contrast-tokyo.com/archive/fvs"]
title = "FVS FIRST(1.0) SEASON “Future in Motion” - CONTRAST ARCHIVE"
description = """
この度、10/8 (火)から14 日(月・祝)まで、デザインプロジェクト「FlexibleVisual SPCE」(FVS)によるファーストシーズンのプロダクトを紹介する展示会/展覧会「Future in Motion」をCONTRASTにて開催いたします。本展覧会では、FVSの象徴である革新的なデザインと視覚的な表現を通じて、新しい時代のファッション/アートの可能性を探求します。

FlexibleVisual SPCEは、デザイナーJohn June James(ジョン・ジュン・ジェイムス)によって設立された新進気鋭のデザインプロジェクトです。ファーストシーズンのテーマは「Future in Motion」。日常の中で動き続ける現代の都市生活を反映し、アートとファッションを通じて現代の多様な美意識を独自のビジュアル言語で表現します。

また、会場ではクリエイティブコレクティブ「Cattleyatokyo」によるアートやネオン作品なども合わせて展示されます。FlexibleVisual SPCEの世界観が具現化され、視覚と感覚を刺激する空間が立ち上がります。

本展には誰でも訪れることができ、アイテムのオーダーも可能です。訪れる方々には、FlexibleVisual SPCEが描く新しいファッションの世界を体験し、その魅力を存分に感じていただけることでしょう。

FlexibleVisual SPCEの世界観に浸れるこの機会を、どうぞお見逃しなく。
皆様のご来場を心よりお待ちしております。

ー

会期：10/8(火)- 10/14(月)
営業時間：10:00 - 20:00(10/8 初日 16:00 - 20:00、10/14 最終日 10:00 - 15:00)
入場料：無料
レセプションパーティー：10/11(金)12:00 - 20:00
HP： fvsfvsfvs.com"""
