["https://contrast-tokyo.com/archive/sonic_geometries"]
title = "Sonic Geometries - CONTRAST ARCHIVE"
description = """
この度、CONTRASTは3月16日(土)から3月31日(日)まで、新潟県十日町市を拠点に活動するベネズエラ出身アメリカ人アーティスト、ウォルフガング・ギルによる日本では初の個展となる「Sonic Geometries」を開催致します。

ギルはカーブやエッジ、幾何学といった変容性のある素材を音として用いて、場所や空間全体を作品として体験させるインスタレーションを通して、彫刻的な音を探求します。

本展では2022年ニューアーク美術館で発表した音響彫刻作品に加え、新作2点とB1Fスペースでは再構築したサウンドインスタレーションを紹介致します。
音響彫刻を制作するにあたり、音は非常に重要な役割を担っていますが、どのように音が奏でられるか予測する事は難しく、オブジェを通してさまざまな音を再生し、目に見えるものと耳に聞こえるものとの関係を観察することで、オブジェの共鳴の特質を探求します。そして、この長いプロセスを経て、オブジェ自体にユニークな音のセットを生み出し、オブジェの言語を定義します。

尚、本展制作にあたり、音響体験を洗練させ、機能性を合理化する為、3ヶ月にわたり十日町のスタジオで作品から壁、配線、オートメーションを含んだモックアップを入念に準備し、これらは十日町から東京に輸送されました。
展覧会終了後は、十日町で設営中のミュージアム「Honk-Tweet」に同じ壁を再利用し、自身の常設展示を行う他、コーヒーショップを併設し、ワークショップや教育プログラムを開催するコミュニティのハブとしても機能する予定です。

是非、この機会に音が繰り出すオブジェを体験下さい。

ー

Special Thanks：桐生愛里、桐生けい子、桐生松夫、ルイジ・オノラ、マイク・ロメオ、波形雅照、松井千枝、ルーカス・ヒックマン、山家悠平、十日町市移住コンシェルジュ、アスト、山田建工"""
