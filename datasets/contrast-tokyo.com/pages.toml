["https://contrast-tokyo.com/archive/every_subpixel_matters"]
title = "Every Subpixel Matters - CONTRAST ARCHIVE"
description = """
この度、10月5日(木)から10月9日(月・祝)まで、堀川淳一郎、弓場太郎、相樂園香による個展「Every Subpixel Matters」をCONTRASTにて開催致します。

コンピューターの液晶モニタ上で、各画素（ピクセル）は、赤・緑・青（RGB）といったさらに微細な単位である3つのサブピクセルから構成されています。Retina以前のディスプレイが主流だったmacOS 10.13 High Sierraバージョンまでは、このサブピクセルを使った文字の表示形式が利用されていました。低解像度のディスプレイ上で、微細な色の変化を利用して、文字やグラフィックスの表示を最適化する手法です。しかし、新しいOSでの表示技術の進歩やRetina解像度のスクリーンの登場により、その技術が意識されることは殆ど無くなりました。

本展示では、サブピクセルという過去の技術・ピクセルというディティールへの偏愛を再び加速させながら、デジタルとフィジカルの両面から新たな文字の視覚表現を探求しています。多層的な色の重なり・複数の視点を持つ立体的なキューブの表現から、文字・色の新たな捉え方をぜひお楽しみください。"""
