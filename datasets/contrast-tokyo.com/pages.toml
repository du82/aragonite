full_description = '''ArchiveArtist Residence：IKEUCHIIKEUCHIアーティストIKEUCHIはniketokyo studio 81クライアントワークの為、CONTRASTにて作品制作を行いました。 IKEUCHI "WD-01n". Photo by Keishin Horikoshi / SS. Courtesy of Gallery COMMON. ArchiveArtist Residence：IKEUCHIIKEUCHIアーティストIKEUCHIはniketokyo studio 81クライアントワークの為、CONTRASTにて作品制作を行いました。 IKEUCHI "WD-01n". Photo by Keishin Horikoshi / SS. Courtesy of Gallery COMMON.IKEUCHI1990年東京生まれ。 多摩美術大学情報デザイン学科卒業。学生時代の多くをプラモデル制作に充てる。 卒業制作にあたり、自分の最も身近な存在であったコンピュータの内部が秘密基地に見えるという着想からプラモデルを組み合わせたハイブリッド・ジオラマを制作する。 第17回文化庁メディア芸術祭エンターテインメント部門優秀賞の受賞を切っ掛けに世界最高峰のメディアアートイベント「アルスエレクトロニカ」に招待され、BALENCIAGA2022年SPRINGキャンペーンビジュアルに抜擢。国内外から高い評価を受ける。webAbout CONTRAST2022年、東京·代々木八幡にクリエイティブスペースとしてオープン。築45年の躯体をベースとした内装は「再構築」をコンセプトに3つのフロアで構成され、「多様なデジタル表現を交差することにより新しい視点を提案する」をミッションに活動するデジタルブランディングスタジオ「IN FOCUS」によって運営されています。 CONTRASTはクリエイターに寄り添った広く開放されたスペースとして、枠に囚われず実験的、かつ利用者によって継続的に再構築されていく空間を目指します。 また、多くの表現に焦点を当て、それらを生み出すクリエイター達と出会い、その姿勢を知ることは私たちに 「CONTRAST = 対比」の重要性を気づかせてくれるでしょう。 Operated by IN FOCUS2022年、東京·代々木八幡にクリエイティブスペースとしてオープン。築45年の躯体をベースとした内装は「再構築」をコンセプトに3つのフロアで構成され、「多様なデジタル表現を交差することにより新しい視点を提案する」をミッションに活動するデジタルブランディングスタジオ「IN FOCUS」によって運営されています。 CONTRASTはクリエイターに寄り添った広く開放されたスペースとして、枠に囚われず実験的、かつ利用者によって継続的に再構築されていく空間を目指します。 また、多くの表現に焦点を当て、それらを生み出すクリエイター達と出会い、その姿勢を知ることは私たちに 「CONTRAST = 対比」の重要性を気づかせてくれるでしょう。 Operated by IN FOCUSUpcomingTitleArtist/CompanyDateTag結晶化したエアークオーツの聲太田琢人CONTRAST curatedExhibitionArchiveAllCONTRAST curatedExhibitionResidenceShootingEventTitleArtist/CompanyDateTag絡み合う物質、共鳴する身体DIG SHIBUYAフラビア・マッツァンティCONTRAST curatedExhibitionEventWavy Tatami Preview & Pre-OrderSTUDIO THE BLUE BOYEventTrans Point水落大ExhibitionNEO KAWAii vol.2LWArt游藝舎たまごたけさめほしナルコレプシーカメ子カメ男巽千沙都マイトExhibitionIN FOCUS展千﨑杏菜兼石淳小原潤也ネイト・コバー山本理央奈仲山慎哉佐伯志織王書強井口忠正鈴鹿岳宣槻舘翼葉大ExhibitionTRANSLATOR展 〜白日夢〜向井大輔MIKA安田晃大伊藤はるか酒井愛梨Exhibition展示 & 受注会Haa Jime StudioExhibitionEvent「EXOGLO by MESCH JAPAN」ローンチイベントMESCH JAPANEventOfflineキャスパー・ケントExhibition波と粒子suiteruCONTRAST curatedExhibitionFVS FIRST(1.0) SEASON “Futu