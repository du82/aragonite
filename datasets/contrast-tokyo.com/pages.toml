["https://contrast-tokyo.com/archive/entangles_resonates"]
title = "絡み合う物質、共鳴する身体 - CONTRAST ARCHIVE"
description = """
この度、CONTRASTはアートとテクノロジーの祭典「DIG SHIBUYA 2025」出展にあたり、2/8(土)から16(日)まで、ウィーンとサンパウロを拠点に活動するマルチメディア・アーティスト、フラビア・マッツァンティの日本初個展「絡み合う物質、共鳴する身体」を開催します。

本展ではデジタルアート、没入型技術、実験的なアニメーションを駆使し、身体とその物理的・社会的環境の関係に焦点を当て、ポスト人間中心主義やポストヒューマニズムを通じて新たな視点を提供します。

展示作品には、ウィーンとブラジルで制作されたデジタル写真アートシリーズから、短編映画「Sympoietic Bodies」が含まれます。また、物理空間とバーチャル空間を都市環境に融合させる多分野プロジェクト「Beyond My Skin」では、渋谷、ウィーン、サンパウロで撮影された映像がLEDディスプレイで上映される他、来場者はMR(複合現実)インスタレーションも体験できます。

さらに、2/10(月)深夜24時からは「Shibuya Crossing Night Art」の一環として、渋谷スクランブル交差点を囲む4つの大型LEDスクリーンで「Sympoietic Bodies」と「Beyond My Skin」一般公開致します。
また、2/13(木)には駐日ブラジル大使館にてアーティストトークも開催致します。

是非、この機会にDIG SHIBUYAのプログラムと合わせ、フラビア・マッツァンティの新たな視覚体験をお楽しみ下さい。

ー

プロフィール
フラビア・マッツァンティ（イタリア／ブラジル、1994年生まれ）
ウィーン美術アカデミー卒業。国内外の展示会やフェスティバルで受賞歴があり、彼女の作品はウィーン美術館やグラーツ美術館、個人コレクションに収蔵されている。2023年にはフォーブス誌の30アンダー30に選出。インタラクティブ・メディア会社Immereaの共同創設者であり、XRViennaの共同主催者、Euromersiveのオーストリア共同大使も務め、国内外のシンポジウムやフェスティバルで大学講師および講演者としても活躍している。

ー

