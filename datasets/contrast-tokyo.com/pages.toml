title = "NIGHT ART FAIR TAIPEI - CONTRAST ARCHIVE"
description = """
この度、CONTRASTは毎年恒例の台北アートウィーク期間中、5月11日(木)から14日(日)まで初開催となるアートフェア「NIGHT ART FAIR TAIPEI」に出展致します。

台湾人アーティスト、Chou Shih Hsiung氏が設立したフェアは「noir (ノワール)」をテーマに夜間に開催され、一般的なギャラリーの白壁の環境から抜け出し、ビジュアルデザインや時間軸を通して、新しいアプローチによってアート業界の可能性を探ります。

