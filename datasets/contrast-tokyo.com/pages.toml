["https://contrast-tokyo.com/archive/like"]
title = "LIKE - CONTRAST ARCHIVE"
description = """
アートxテクノロジーを追求し、新しい時代の可能性を創造するクリエイティブユニットNOLLの新作「LIKE」と、過去作となる「Reincarnation」を3月25日(土)、26日(日)の2日間、CONTRASTにて展示致しました。

本作品「LIKE」は、現代の効率化された恋愛をテーマとし、実在しないデジタルヒューマン同士に仮想のデーティングアプリを通じて「恋愛」と「繁殖」のサイクルを行わせるインスタレーション作品となっています。
デーティングアプリの誕生で、出会いから愛を育むまでのハードルが下がり、ひと昔前とは違う恋愛のプロセスが生まれています。
恋愛は「LOVE」から「LIKE」へと変わりつつあります。

本作品では、仮想のデーティングアプリがインストールされたスマートフォン、自動スワイプマシンが様々な額縁に入った状態で展示されており、デーティングアプリ上では実際には存在していないデジタルヒューマン同士が画像色などの類似度をもとに自動で「LIKE」または「NOPE」の判断をしてマッチングする相手を探します。マッチングが成立すると、両者の特徴を受け継いだデジタルヒューマンが新たに誕生しデーティングアプリを利用できる年齢まで急成長します。このサイクルを半永久的に繰り返すことで、効率化された現代の「恋愛」と「繁殖」を俯瞰して鑑賞することが可能となっています。

我々はこの現代の恋愛システムの変革を人類の手の及ばない領域への第一歩と考えており、アダムとイブが出会った一場面を切り取った絵画のように額縁の中にスマートフォンと自動制御されたスワイプマシンを設置することでその神聖さを表現しています。
生得的に備わる基本衝動としての「恋愛」も、人とは異なる知性を介入させ効率化する人間。
鑑賞者は、「LIKE」で効率化された無機質な恋愛サイクルを俯瞰し、現代社会や未来にそれぞれの思いを馳せることになります。

Artwork by NOLL Inc. and Shinpei Miura
NOLL Inc. Project member：Genya Ohashi / Takuro Kawashima / Jun Inagaki / Madoka Ashida"""
