["https://contrast-tokyo.com/archive/snow_therapy"]
title = "Snow Therapy - CONTRAST ARCHIVE"
description = """
この度、CONTRASTは2月3日(土)から12日(月・祝)まで、東京を拠点に活動するビジュアルアーティスト、ティモテ・ランブレイクの個展「Snow Therapy」を開催致します。

ティモテは主に写真とビデオ制作を得意とし、完璧さよりも自然体である事を重視し、自身のビジョンを共有すると共に、観客をその体験に誘い入れます。
過去には彼にとって故郷である東京とレイキャビクにて、日本とアイスランドのつながりを探求するプロジェクト「Heikō/ Heild」も発表し、両都市の様々なアーティスト、スタジオ・オラファー・エリアソン、ビョーク、新しい学校のリーダーズ等ともコラボレーションしています。

2021年2月、ティモテはスノーボード中の事故で複数箇所を骨折する大怪我を負いました。入院は３ヶ月間に及び、歩行すらままならない期間が続きました。これまで世界各地を旅しながら自然現象と触れ合い、作品にしてきましたが、愛していたはずの雪は脅威、そしてトラウマへと変わってしまったのです。
翌年、自身の恐怖と向き合うために、世界有数の豪雪地帯である北海道へと向かいました。うず高く積もる雪、吹雪、反射する光。北海道への旅はもう一度、雪や自然を身近に感じるきっかけとなり、セラピーとなりました。同時に、一つのアイデアが生まれました。もしかしたら、この体験は他の人にも影響を与えられるかもしれない。人々が抱えるトラウマは全て異なりますが、雪という存在には、共通して訴えかける力があるかもしれない……。
この展覧会が目指すのは、瞑想的でありながら遊び心もあるビジュアル体験です。自然と人々との関係性を探り、あなたの心身へポジティブな影響があることを期待しています。

2月3日(土)のオープニングでは上村洋一によるサウンドパフォーマンス「Ice Meditation」を行う他、2月10日(土)にはシルクスクリーンプリントのワークショップも開催致します。

ー

グラフィックデザイン：田上亜希乃
テキスト&プランニング・アソシエイト：角尾舞
スペースデザイン：澤田よしき
ミュージックプレイリスト：コムアイ
サウンド・パフォーマンス：上村洋一
石鹸パッケージ: Ryota Kanno"""
