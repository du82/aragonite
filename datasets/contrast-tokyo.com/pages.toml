["https://contrast-tokyo.com/archive/artist_residence_shohei_takasaki"]
title = "Artist Residence：Shohei Takasaki - CONTRAST ARCHIVE"
description = """
Gallery COMMONのアーティスト、Shohei Takasakiは「アートフェア東京」出展に向け、CONTRASTにて作品制作を行いました。

Shohei Takasaki.Untitled (February 28 2022).2022.  Oil pastel and colored pencil on canvas.1819 x 2590 x 38 mm.  Photo by Yosuke Torii. Courtesy of Gallery COMMON."""
full_description = "ArchiveArtist Residence：Shohei TakasakiShohei TakasakiGallery COMMONGallery COMMONのアーティスト、Shohei Takasakiは「アートフェア東京」出展に向け、CONTRASTにて作品制作を行いました。 Shohei Takasaki.Untitled (February 28 2022).2022. Oil pastel and colored pencil on canvas.1819 x 2590 x 38 mm. Photo by Yosuke Torii. Courtesy of Gallery COMMON. ArchiveArtist Residence：Shohei TakasakiShohei TakasakiGallery COMMONGallery COMMONのアーティスト、Shohei Takasakiは「アートフェア東京」出展に向け、CONTRASTにて作品制作を行いました。 Shohei Takasaki.Untitled (February 28 2022).2022. Oil pastel and colored pencil on canvas.1819 x 2590 x 38 mm. Photo by Yosuke Torii. Courtesy of Gallery COMMON. Shohei Takasaki1979年、埼玉県生まれ。日本で育った後、アメリカのポートランドに移り住み、現在はオーストラリアのシドニーを拠点に活動しています。Takasakiの作品の根底には、「比較」するという一貫したテーマがあります。オイルパステル、木炭、絵の具、既製品、布など、様々な素材を用いて、いくつもの手法を使い、ひとつの主題やモチーフを描き出します。そして、こうした並置から生じる「中間性（in-betweenness）」に目を向けています。「自己と他者」「国内と国外」「体内と体外」「自国語と外国語」「フィジカルとオンライン」「現実と仮想」「過去と未来」「生と死」などの境界を問う作品を通じて、私たちの思い込みを捉え直し、より微細な差異をもった「中間」として世界を理解するために、他者との対話を深めるよう促します。Takasaki はこれまでにポートランド、ロサンゼルス、クウェート、メルボルン、香港、東京など、様々な都市で作品を発表。また、シアトルにあるスターバックス本部やポートランドのホクストン・ホテルなどのパブリック・コレクションにも収蔵されています。webGallery COMMON2010年にen one tokyoによって設立され、現在共同設立者の新井暁がディレクターを務めるGallery COMMONは、原宿のストリートカルチャーを背景に国内外のアーティストやトレンドセッターがローカルシーンと交流するための親密なスペースとして誕生しました。 クリエイティブ・エージェンシーという異色の背景をもとに、ファッションとアート、ストリートとコマーシャル、サブカルチャーとメインストリームという逆説的でありながらも互いに共生的な二者間のギャップを埋めることを目指してきたGallery COMMONは、新たなスペースでスタートを切った後も、原宿の文化を守り育てるという初心を忘れず、様々な国や分野にわたる著名または将来有望な現代アーティストと仕事をともにする傍ら、国内外のアートフェアやコラボレーションプロジェクトにも参加していく。webinstagramAbout CONTRAST2022年、東京·代々木八幡にクリエイティブスペースとしてオープン。築45年の躯体をベースとした内装は「再構築」をコンセプトに3つのフロアで構成され、「多様なデジタル表現を交差することにより新しい視点を提案する」をミッションに活動するデジタルブランディングスタジオ「IN FOCUS」によって運営されています。 CONTRASTはクリエイターに寄り添った広く開放されたスペースとして、枠に囚われず実験的、かつ利用者によって継続的に再構築されていく空間を目指します。 また、多くの表現に焦点を当て、それらを生み出すクリエイター達と出会い、その姿勢を知ることは私たちに 「CONTRAST = 対比」の重要性を気づかせてくれるでしょう。 Operated by IN FOCUS2022年、東京·代々木八幡にクリエイティブスペースとしてオープン。築45年の躯体をベースとした内装は「再構築」をコンセプトに3つのフロアで構成され、「多様なデジタル表現を交差することにより新しい視点を提案する」をミッションに活動するデジタルブランデ