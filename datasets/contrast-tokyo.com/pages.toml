["https://contrast-tokyo.com"]
title = "CONTRAST ARCHIVE"
description = """
この度、CONTRASTはデザイナー / アーティストである太田琢人の初個展「結晶化したエアークオーツの聲 (ひびき）」 を 3月9日(日)から3月16日(日)まで開催いたします。

現代社会において、私たちと世界の間には目に見えない距離があるように感じます。ニュース、陰謀論、デザイン、アート、さらには身につける服や飲み水さえも、その本質を確かめる術はなく、情報があふれる中で何が真実なのかを知ることは困難です。言葉ひとつをとっても、「リンゴ」が「リンゴ」である理由を問い始めると、終わりのない迷宮に迷い込んでしまいます。

そんな漠然とした虚無感の中で、「エアークオーツ (Air Quotes)」という言葉に出会い、意識を向けてみました。これは、発言を引用する際に用いられるジェスチャーであり、しばし皮肉や揶揄を込めて使われます。現代社会において、多様な価値観が交錯し、言葉の意味が拡散していく中で、あらゆる概念に ❝　　　　❞ をつけてしまえば、どうなるのでしょうか。

❝ 人間 ❞、❝ 社会 ❞、❝ 言葉 ❞、❝ 感情 ❞、❝ 戦争 ❞、❝ 平和 ❞、❝ アート ❞、❝ デザイン ❞、❝ 価値観 ❞……。
太田は、これらの言葉に括弧をつけたとき、私たちの認識はどのように変化するか問いかけます。

本展では、言葉や物質が持つ「言語」を再解釈し、その過程で生まれる問いに対する個人的な応答を、写真・立体・詩を通じて表現しています。また、3つの異なる世界観が各フロアに展開され、空間全体で多層的な視点を提示します。
ぜひ、会場にてご覧ください。

ー

