["https://contrast-tokyo.com/archive/reflective_configuration"]
title = "Reflective Configuration - CONTRAST ARCHIVE"
description = """
この度、CONTRASTは1月21日(土)から2月5日(日)まで、アーティストHiroyuki Arikawa (WORKSHOP™)の個展「Reflective Configuration」を開催致しました。

Arikawaは桑沢デザイン研究所を卒業後、数社のアパレルブランドでの企画デザインを経て、2019年よりオブジェクト、什器制作と空間構成を主軸にした活動WORKSHOP™（ワークショップトレードマーク）を開始。2021年にはTOKYO DESIGN STUDIO New Balance / Apparel (東京デザインスタジオニューバランス/アパレル)のビジュアルを手掛け、主にアルミフレームやLED 蛍光灯、コードなどの工業用資材を用いた作品を制作。

展覧会タイトルである「Reflective Configuration」は「内省的構造」を意味し、作家自身が今まで忘れていた過去の感覚や記憶を辿り、視覚的、聴覚的情報をどう恣意的に記録、蓄積してきたかという“顕在化された記憶の変化”が原点になっています。そして、Arikawaが得意とするソリッドなオブジェクトに加え、ファッションに関する考察をテーマにしたものから、音やリズムのシークエンスなど視覚以外の構造を取り入れた作品を発表致しました。
また、出版レーベルRondadeより今回の展示の為に制作した出版物も販売。

協力：Rondade"""
full_description = "ArchiveReflective ConfigurationHiroyuki Arikawa (WORKSHOP™)この度、CONTRASTは1月21日(土)から2月5日(日)まで、アーティストHiroyuki Arikawa (WORKSHOP™)の個展「Reflective Configuration」を開催致しました。 Arikawaは桑沢デザイン研究所を卒業後、数社のアパレルブランドでの企画デザインを経て、2019年よりオブジェクト、什器制作と空間構成を主軸にした活動WORKSHOP™（ワークショップトレードマーク）を開始。2021年にはTOKYO DESIGN STUDIO New Balance / Apparel (東京デザインスタジオニューバランス/アパレル)のビジュアルを手掛け、主にアルミフレームやLED 蛍光灯、コードなどの工業用資材を用いた作品を制作。 展覧会タイトルである「Reflective Configuration」は「内省的構造」を意味し、作家自身が今まで忘れていた過去の感覚や記憶を辿り、視覚的、聴覚的情報をどう恣意的に記録、蓄積してきたかという“顕在化された記憶の変化”が原点になっています。そして、Arikawaが得意とするソリッドなオブジェクトに加え、ファッションに関する考察をテーマにしたものから、音やリズムのシークエンスなど視覚以外の構造を取り入れた作品を発表致しました。 また、出版レーベルRondadeより今回の展示の為に制作した出版物も販売。 協力：RondadeVIDEODIRECTION/ DOP/ EDIT : Taiju Nakajima (IN FOCUS)PRODUCE : Masaki Fushimi (IN FOCUS)PHOTO：Yoshinori Kataoka (IN FOCUS)VIDEODIRECTION/ DOP/ EDIT : Taiju Nakajima (IN FOCUS)PRODUCE : Masaki Fushimi (IN FOCUS)PHOTO：Yoshinori Kataoka (IN FOCUS)"
