["https://contrast-tokyo.com/archive/shu_to"]
title = "SHU TO / EXHIBITION HUNGRY SCISSORS - CONTRAST ARCHIVE"
description = """
この度、東京と京都に拠点を置くクリエイティブスタジオ「SHU TO /」の代表・インテリアデザイナー、岩竹勇樹による初個展「SHU TO / EXHIBITION HUNGRY SCISSORS」を1/26(金)から30(火)までCONTRASTにて開催致します。

2012年インテリアデザイン事務所としてスタートし、イベント、ショールーム、ショーウィンドウ、店舗、オフィス、住宅、家具、プロダクトと様々な領域のプロジェクトを手掛け、主なクライアントにはALFA ROMEO、ALPHATAURI、BMW JAPAN、DECORTE等がいる他、ロサンゼルスを拠点とするファッション・カルチャーマガジンFLAUNT MAGAGINE にも掲載。

2024年、SHU TO /は世界に影響を与える「空間による自己表現」を思考する新たなクリエイティブスタジオへ。
自己を表現する個性的で他にはない空間創りへの渇望は、ファッションに強く影響を受けており、インテリア・ファッション・アートの要素を融合し空間を再構築し、それらの調和と破壊を通して心を動かす空間表現を模索します。"""
