["https://contrast-tokyo.com/archive/jyu"]
title = "獸（第1章/宝町団地） - CONTRAST ARCHIVE"
description = """
9月3日(土)から25日(日)まで、GILLOCHINDOX☆GILLOCHINDAE（以下、GCD☆GCD）主催のグループ展「獸（第1章/宝町団地）」をCONTRASTにて開催致しました。

本展はGCD☆GCDが総合ディレクションを務め、現代美術と音楽などの都市文化の接続や、展覧会形式での物語表現など新たな挑戦を行うものです。展覧会形式のアップデートを目指す本展は、様々なジャンルのアーティスト（日本画家・彫刻家・現代美術家・デザイナー・ラッパー・DJ・バンドetc.）によって、7年かけて物語が展開されていく長編プロジェクトの第2回目になります。

「獸」とは全7章にわたる黒い獣を主人公とした物語であり毎年1度、各章ごとに展覧会という形式で表現されます。今回の「第1章/宝町団地」は物語の時系列で最初に位置し、黒い獣の幼少期と、思い出の中にある公園をテーマとした展覧会と合わせ、WWW Xにて音楽ライブを行いました。

- Exhibition Concept -
東京の都心部から電車で20分ほど行った小さな街の中心にその団地はある。
団地中央スペースの公園にはタコをモチーフにした大きな滑り台型遊具があり、人々からタコ山公園と呼ばれていた。
その“タコ山”の周りを走り回る子供達の中の一人が幼少期の黒い獣であった。
その獣の様子を父/狩人は団地のベランダから見下ろす。
午後5時を知らせる時報があたりに響く。
あたりいったい目に見えるもの全てがオレンジに染まる。
団地を静けさが覆う。
ここは東京郊外の小さな団地、宝町団地。

Artist：GCD☆GCD /横手太紀/倉知朋之介/王之玉/ハンス・チュウ
Curation : GCD☆GCD
Art Direction & Graphic Design：八木幣二郎
Display Fixture：板垣竜馬
Space Design Support：桒原幹治（もちもちのたね）
Music：張

主催/企画：GCD☆GCD
Special Thanks : volvox Inc. / IN FOCUS inc.
企画/運営サポート：Hisatomo Kato（CON_）"""
