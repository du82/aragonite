["https://contrast-tokyo.com/archive/overgrowth"]
title = "Overgrowth - CONTRAST ARCHIVE"
description = """
この度、CONTRASTにて10月21日(土)から11月5日(日)まで、東京を拠点に活動するイタリア人ビジュアルアーティスト、アンドレア・サモリーの個展「Overgrowth」を開催致します。
アンドレアは1991年にイタリアで生まれ、東京大学を卒業した後、建築家の隈研吾氏や名和晃平氏のもとで経験を積み、現在は積極的にイタリア、台湾、オーストラリアなど国外でも展覧会を開催しています。

ポストインターネットアーティストとして、現代社会が抱える不安や希望に焦点を当て、3Dスカルプティングと3Dプリンティングを特殊効果(SFX)や伝統的なスカルプティング技法と組み合わせることで、見る者を自然が腐敗した不気味な世界へと引き込み、反発と魅了、疎外感と認識といった両義的な感情を引き起こさせます。

また、思弁的実在論(スペキュラティブリアリズム)の哲学やアッサンブラージュ理論にSF、ボディホラー、コズミックホラー、マジックリアリズムといった要素を取り入れた作品は、世界社会、気候、政治、テクノロジーに関する現代社会の課題に焦点を当て、ディストピア(極端な悪化)とユートピア(理想的な状態)の情報が入り乱れる状況を表現しています。

本展は私たちの日常生活がバイラリティ(生物学とインターネットに関連する二つの概念)によって形作られている実態にインスピレーションを得ています。
制御不能な成長が自然界や人工的な状況において、創造とエントロピーの相互作用として現れ、それが異なるスケールや領域領域で喚起されます。
そして、彫刻や映像作品には完璧さを備えた重なり合って形成された抽象的、かつ光り輝く生物学的パターンはトランスヒューマンでバーチャルな現代社会において、「身体」と「自己」の境界を曖昧にし、新しい視点や理解を探求します。"""
