["https://contrast-tokyo.com/archive/delusions_realities"]
title = "Delusions & Realities - CONTRAST ARCHIVE"
description = """
この度、ベルリンとヨーテボリを拠点に活動するスウェーデン／ポーランド人、マルチメディア・アーティストのElliott Nicoleとロンドンを拠点に活動する韓国系アメリカ人、マルチメディア・クリエイターのCoral Garvey が1月17日(水)から20日(土)まで、CONTRASTにてグループ展「Delusions & Realities」を開催致します。

本展では、芸術的な視点で魅惑的に融合された誇大な妄想、変容やアイデンティティの微妙な旅路の交差を探求します。Coral Garveyは自己認識の複雑さに焦点を当て、壮大な願望の魅力とその落とし穴を描写する一方、Elliott Nicoleは、アイデンティティの流動性が絶え間ない変容を遂げ、個人的進化という深遠な領域をナビゲートします。

これらの視点は、アーティスト自身が抱く幻想と真のアイデンティティを形成する変容のプロセスとの複雑な関係が浮かび上がります。これにより、観る者は野心と自己発見の微妙な境界線について深く考えさせられ、ダイナミックな対話が生まれます。"""
full_description = "ArchiveDelusions & RealitiesElliott NicoleCoral Garveyこの度、ベルリンとヨーテボリを拠点に活動するスウェーデン／ポーランド人、マルチメディア・アーティストのElliott Nicoleとロンドンを拠点に活動する韓国系アメリカ人、マルチメディア・クリエイターのCoral Garvey が1月17日(水)から20日(土)まで、CONTRASTにてグループ展「Delusions & Realities」を開催致します。 本展では、芸術的な視点で魅惑的に融合された誇大な妄想、変容やアイデンティティの微妙な旅路の交差を探求します。Coral Garveyは自己認識の複雑さに焦点を当て、壮大な願望の魅力とその落とし穴を描写する一方、Elliott Nicoleは、アイデンティティの流動性が絶え間ない変容を遂げ、個人的進化という深遠な領域をナビゲートします。 これらの視点は、アーティスト自身が抱く幻想と真のアイデンティティを形成する変容のプロセスとの複雑な関係が浮かび上がります。これにより、観る者は野心と自己発見の微妙な境界線について深く考えさせられ、ダイナミックな対話が生まれます。"
