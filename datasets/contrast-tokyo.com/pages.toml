協力： 駐日ブラジル大使館、ギマランイス・ホーザ文化院"""
full_description = "Archive絡み合う物質、共鳴する身体DIG SHIBUYAフラビア・マッツァンティこの度、CONTRASTはアートとテクノロジーの祭典「DIG SHIBUYA 2025」出展にあたり、2/8(土)から16(日)まで、ウィーンとサンパウロを拠点に活動するマルチメディア・アーティスト、フラビア・マッツァンティの日本初個展「絡み合う物質、共鳴する身体」を開催します。 本展ではデジタルアート、没入型技術、実験的なアニメーションを駆使し、身体とその物理的・社会的環境の関係に焦点を当て、ポスト人間中心主義やポストヒューマニズムを通じて新たな視点を提供します。 展示作品には、ウィーンとブラジルで制作されたデジタル写真アートシリーズから、短編映画「Sympoietic Bodies」が含まれます。また、物理空間とバーチャル空間を都市環境に融合させる多分野プロジェクト「Beyond My Skin」では、渋谷、ウィーン、サンパウロで撮影された映像がLEDディスプレイで上映される他、来場者はMR(複合現実)インスタレーションも体験できます。 さらに、2/10(月)深夜24時からは「Shibuya Crossing Night Art」の一環として、渋谷スクランブル交差点を囲む4つの大型LEDスクリーンで「Sympoietic Bodies」と「Beyond My Skin」一般公開致します。 また、2/13(木)には駐日ブラジル大使館にてアーティストトークも開催致します。 是非、この機会にDIG SHIBUYAのプログラムと合わせ、フラビア・マッツァンティの新たな視覚体験をお楽しみ下さい。 ー プロフィール フラビア・マッツァンティ（イタリア／ブラジル、1994年生まれ） ウィーン美術アカデミー卒業。国内外の展示会やフェスティバルで受賞歴があり、彼女の作品はウィーン美術館やグラーツ美術館、個人コレクションに収蔵されている。2023年にはフォーブス誌の30アンダー30に選出。インタラクティブ・メディア会社Immereaの共同創設者であり、XRViennaの共同主催者、Euromersiveのオーストリア共同大使も務め、国内外のシンポジウムやフェスティバルで大学講師および講演者としても活躍している。 ー フラビア・マッツァンティ「絡み合う物質、共鳴する身体」 日時：2/8(土) - 16(日) 11:00 - 18:00 (2/14(金)のみ13:00 - 18:00) プレビュー：2/8(土) 15:00 - 18:00 会場：CONTRAST 入場料：無料 協力：X VISION株式会社、オーストリア文化フォーラム東京、マヌエル・ボーネル ー Shibuya Crossing Night Art 日時：2/10(月) 24:00 - 25:00 会場：渋谷スクランブル交差点 ー DIG SHIBUYA 2025 日程：2/8(土) - 11(火・祝) 会場：渋谷公園通り周辺エリアおよび各会場 入場料：無料（プログラムによっては有料） 主催：SHIBUYA CREATIVE TECH実行委員会、独立行政法人日本芸術文化振興会、文化庁 共催：渋谷区 後援：一般財団法人渋谷区観光協会、一般社団法人渋谷未来デザイン ー アーティストトーク 日程：2/13(木) 時間：15:00 - 16:30(14:30開場) 会場：駐日ブラジル大使館(オーディトリアム) 入場料：無料 住所：東京都港区北青山2-11-12 最寄駅：東京メトロ銀座線「外苑前」駅3番出口より徒歩5分 協力： 駐日ブラジル大使館、ギマランイス・ホーザ文化院"
