description = "The OpenJS Foundation Board of Directors has approved an IP policy which allows projects to determine on a project-by-project basis whether contributors will be required to sign a CLA."
full_description = 'The OpenJS Foundation Board of Directors has approved an IP policy which allows projects to determine on a project-by-project basis whether contributors will be required to sign a CLA.self.__wrap_n=self.__wrap_n||(self.CSS&&CSS.supports("text-wrap","balance")?1:2);self.__wrap_b=(e,t,r)=>{let n=(r=r||document.querySelector(`[data-br="${e}"]`)).parentElement,l=e=>r.style.maxWidth=e+"px";r.style.maxWidth="";let a=n.clientWidth,i=n.clientHeight,s=a/2-.25,o=a+.5,u;if(a){for(l(s),s=Math.max(r.scrollWidth,s);s+1<o;)l(u=Math.round((s+o)/2)),n.clientHeight===i?o=u:s=u;l(o*t+a*(1-t))}r.__wrap_o||"undefined"!=typeof ResizeObserver&&(r.__wrap_o=new ResizeObserver(()=>{self.__wrap_b(0,+r.dataset.brr,r)})).observe(n)};self.__wrap_n!=1&&self.__wrap_b(":R2dtsla:",1) The OpenJS Foundation Board of Directors has approved an IP policy which allows projects to determine on a project-by-project basis whether contributors will be required to sign a CLA. In addition, the Board has approved a CLA for individual contributors, and a CLA for corporate contributors. Project maintainers may choose to use the DCO signoff process, an individual CLA and a corporate CLA (which covers multiple contributors from a single organization), or just an individual CLA. The OpenJS Foundation uses the Linux Foundation’s EasyCLA tool to manage CLA signatures. For repositories which require a CLA, EasyCLA automatically checks whether the author has a signature on file. If not, the PR will be blocked and the contributor presented with a link to complete their signature. The easiest way to sign the CLA is to open a pull request and sign when prompted (for example, against the EasyCLA test repo), because the EasyCLA bot will comment on the PR and report the status of the signature. Alternatively, contributors may pre-sign the CLA. Copyright © OpenJS Foundation. All rights reserved. The OpenJS Foundation has registered trademarks and uses trademarks. For a list of trademarks of the OpenJS Foundation, please see our Trademark Policy and Trademark List. Trademarks and logos not indicated on the list of OpenJS Foundation trademarks are trademarks™ or registered® trademarks of their respective holders. Use of them does not imply any affiliation with or endorsement by them.OpenJS Foundation | Member Support | Terms of Use | Privacy Policy | Security | Bylaws | Code of Conduct | Trademark Policy | Trademark List | Cookie Policy'
