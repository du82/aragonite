["https://contribute.jquery.org"]
title = "Contribute to jQuery"
full_description = "Welcome! With a variety of popular JavaScript tools, more than twenty websites, and millions of users all over the world, there's always more to be done in the world of jQuery. From code and documentation to web design and support, the jQuery Foundation welcomes contributions from anyone willing to put in the time and effort to help us and our community of users. Whether you're a grizzled open-source veteran or a curious newcomer, if you want to get involved, use this site to find out how! Sign Up! If you're planning to contribute code or content to any jQuery Foundation project, you'll need to sign our Contributor License Agreement before we can accept your pull request. Read & Sign CLA Keeping In Style Whether you're writing code or documentation, it's important to keep your contributions in line with existing conventions. Take a look at our style guides for JavaScript HTML CSS API Documentation Articles New to Open Source? Check out our guide with tips, tricks, and important things to keep in mind if you're looking to get started contributing to any open source project, including jQuery."
author = "OpenJS Foundation - openjsf.org"
year_published = 2025
