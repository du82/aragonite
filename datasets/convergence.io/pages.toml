["https://convergence.io/faq"]
title = "Convergence: Frequently Asked Questions"
description = "Convergence is a next generation API that allows developers to build rich, real-time collaboration into their applications."
full_description = '''We get asked a lot of questions. You might find the answer to yours below! About Convergence Why Convergence? We believe that highly collaborative real-time applications are the future. There are vanishingly few good examples out there, and we'd like to push the state of the art forward. It's still much too hard to build these types of apps, and we believe that you shouldn't have to be an expert in distributed concurrency control algorithms to do so. What does Convergence cost? Convergence is free and licensed under the GPL (server) and LGPL (client). With this license arrangement we aim to accommodate the vast majority of commercial and non-commercial uses while maintaining a strong core product. What browsers are supported? Evergreen browsers (the latest Chrome, Firefox, Safari and Edge) are all supported. Internet Explorer 10+ should also work but have not been heavily tested. Developing with Convergence What languages are supported? We support JavaScript and TypeScript along with any other interoperable languages. In the near term we also anticipate a Java / Scala client as well. How do I request a feature? Absolutely! The best option is to create a new post on the Convergence community forum. Do you provide a hosted version? As of early 2019 we no longer offer a cloud-based production instance of Convergence. We can help you get Convergence set up in your own environment. $(document).ready(function() { Convergence.initAccordion("faqs"); });'''
year_published = 2025
