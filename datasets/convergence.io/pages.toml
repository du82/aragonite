description = "1.0.0-rc.6 is out the door, bringing tons of bug fixes and features to support our existing users."
full_description = "The Convergence team is pleased to announce the availability of 1.0.0-rc.6. We re-prioritized much of our previously planned work for this release to focus on stability and quality improvements, as well as adding some features that rounded out existing functionality. We have been getting a lot of quality user engagement (thanks!) which has helped us prioritize our efforts. There were 38 documented bug fixes and enhancements in this release and almost as many items that we fixed / improved along the way. Release Highlights: Release Candidate 6 focuses mainly on: Bug fixes and enhancements around user permissions for the Convergence Server and Domains. Numerous fixes and improvements for the Chat subsystem, including a new screen that allows browsing of chat events. Improvements to how Convergence operates in a clustered database setup. Model Reference fixes. Performance, stability, and API cleanup. What’s Next? Check our road map here to see what we are focusing on next. The road map remains mostly the same, since we took a bit of a detour for this release. Mainly we will be working on: More bug fixes. API Consistency The design and implementation of our Experimental Rich Text Support. As always, direct any feedback to our public slack or forum. Happy coding!"
