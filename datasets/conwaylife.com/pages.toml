["https://conwaylife.com/book/periodic_circuitry"]
title = "Conway's Game of Life: Mathematics and Construction"
description = "A textbook for mathematical aspects of Conway's Game of Life and methods of pattern construction."
full_description = 'RLE, Macrocell, or LifeHistory code for all patterns that are displayed as figures in Chapter 6: Periodic Circuitry are provided here. These patterns can be viewed in-browser by clicking on the "Show in Viewer" link near the code, or the patterns can be viewed and manipulated by copying and pasting the RLE code into Game of Life software like Golly. A true period 30 glider gun. The first known gun and the first known finite pattern with unbounded growth. More info: https://www.conwaylife.com/wiki/Gosper_glider_gun The period 30 buckaroo can be used to reflect a glider. More info: https://www.conwaylife.com/wiki/Buckaroo Two Gosper glider guns (one acting as an inline inverter) bouncing back a glider in order to release a single glider. A period 120 glider gun based that works by bouncing a single glider back and forth against a stream of gliders that is being fed into an inline inverter. A period 120 glider gun based that works by bouncing a single glider back and forth against a stream of gliders that is being fed into a non-inline inverter. A configuration of two glider streams and a block that inverts one of the streams and leaves the other one alone. The inverted stream goes southeast and a copy of the original stream goes southwest. A period 120 LWSS gun with the property that every LWSS in an even- indexed position or multiple-of-3-indexed position is erased. Thus only 2 out of every 6 lightweight spaceships actually escape (the ones in positions 1 and 5 mod 6). A prime-generating pattern. The stream of lightweight spaceships that escapes to the left has spacing determined by the prime numbers (i.e., only the 2nd, 3rd, 5th, 7th, 11th, ... lightweight spaceships escape). A "ticker tape" gun that uses a glider duplicator to read a sequence of gliders in a loop and output a stream of lightweight spaceships with the same spacing. A configuration of two twin bees shuttles that detects the presence of an LWSS and creates an MWSS traveling in the opposite direction in response.'
author = "Nathaniel Johnston and Dave Greene"
