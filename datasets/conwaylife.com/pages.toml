full_description = '''Home • LifeWiki • Book • Catagolue • Forums • Discord • Golly 2-engine Cordership From LifeWiki Jump to navigation Jump to search 2-engine Cordership x = 41, y = 49, rule = B3/S23 19b2o$19b4o$19bob2o2$20bo$19b2o$19b3o$21bo$33b2o$33b2o7$36bo$35b2o$34b o3bo$35b2o2bo$40bo$37bobo$38bo$38bo$38b2o$38b2o3$13bo10bo$12b5o5bob2o 11bo$11bo10bo3bo9bo$12b2o8b3obo9b2o$13b2o9b2o12bo$2o13bo21b3o$2o35b3o 7$8b2o$8b2o11b2o$19b2o2bo$24bo3bo$18bo5bo3bo$19bo2b2o3bobo$20b3o5bo$ 28bo! #C [[ THUMBSIZE 2 THEME 6 GRID GRIDMAJOR 0 SUPPRESS THUMBLAUNCH ]] #C [[ AUTOSTART ]] #C [[ HEIGHT 600 WIDTH 600 THUMBSIZE 2 ZOOM 8 Y 2 GPS 32 TRACKLOOP 96 1/12 1/12 ]] <a href="/wiki/File:2enginecordership.png" class="image" title="2-engine Cordership image"><img alt="2-engine Cordership image" src="/w/images/e/ef/2enginecordership.png" decoding="async" width="345" height="409" /></a> View static image Pattern type Spaceship Family Cordership Number of cells 100 Bounding box 41 × 48 Direction Diagonal Period 96 (mod: 96) Speed c/12 | 8c/96 Heat 110.4 Kinetic symmetry n Discovered by praosylen Year of discovery 2017 Rules Outer-totalistic rules B3/S23 only # of rules 20 = 1 Isotropic rules B3/S23 only Glider synthesis Fewest gliders 8 Catagolue-generated RLE synthesis Uploaded synthesis RLE 2enginecordership_synth.rle Pattern files Plaintext 2enginecordership.cells RLE 2enginecordership.rle Identifiers apgcode xq96_y8573w8aegvzys33zwg8gyvoozsvv0338gy2442cia049uo239e4z037e8x1z08464ogzy011zy3oozyf51guozyd2451032 The 2-engine Cordership is a c/12 diagonal spaceship that was discovered by praosylen on December 31, 2017.[1] It is the Cordership that uses the fewest number of switch engines known to be possible (ahead of the 3-engine Cordership) as well as the smallest Cordership in terms of population (ahead of a variant of the 4-engine Cordership) and the smallest engineered spaceship.[note 1] The 2-engine Cordership was voted Pattern of the Year for 2017 on the ConwayLife.com forums.[5] Contents 1 Reactions 2 Synthesis and seeds 3 Uses 4 See also 5 Notes 6 References 7 External links Reactions Dave Greene noted that the 2-engine Cordership, like its 3-engine counterpart, can be stopped by a single glider from behind without releasing any gliders or other spaceships,[6] and updated Martin Grant's Model D Heisenburp device for the 2-engine Cordership.[6] Dave Greene, BlinkerSpawn and Matthias Merzenich noted that the 2-engine Cordership can be eaten by a constellation of two eaters and three blocks:[6] x = 83, y = 86, rule = B3/S23 19b2o$19b4o$19bob2o2$20bo$19b2o$19b3o$21bo$33b2o$33b2o7$36bo$35b2o$34b o3bo$35b2o2bo$40bo$37bobo$38bo$38bo$38b2o$38b2o3$13bo10bo$12b5o5bob2o 11bo$11bo10bo3bo9bo$12b2o8b3obo9b2o$13b2o9b2o12bo$2o13bo21b3o$2o35b3o 7$8b2o$8b2o11b2o$19b2o2bo$24bo3bo$18bo5bo3bo$19bo2b2o3bobo$20b3o5bo47b 2o$28bo47b2o20$79b2o$79bo$80b3o$82bo5$39b2o$39b2o4$66b2o$66bo$67b3o$ 47b2o20bo$47b2o! #C [[ THUMBSIZE 2 THEME 6 GRID GRIDMAJOR 0 SUPPRESS THUMBLAUNCH ]] #C [[ THEME 6 THUMBNAIL THUMBSIZE 2 ZOOM 6 HEIGHT 600 WIDTH 600 ]]<div style="border-width:1px;border-color:#888888;border-style:solid;padding:8px;">Please enable Javascript to view this LifeViewer.</div>2-engine Cordership eater(click above to open LifeViewer)RLE: here Plaintext: here gmc_nxtman pointed out that the 2-engine Cordership can reflect a glider 180 degrees, while preserving its mod-4 timing, resulting in an updated version of glider loop.[7] Synthesis and seeds Dave Greene found a 13-glider synthesis of the 2-engine Cordership on the day of its discovery,[8] which Luka Okanishi improved to 9 gliders [9]. Forum user 'vilc' found an 8-glider recipe in March 2024.[10] Two-glider seeds using as few as 8 still lifes and one-glider seeds using 14 or 15 still lifes are known.[11][12][13] #N 2-engine Cordership, slow salvo construction of 1-glider seed #O Dave Greene, 2018 #C http://conwaylife.com/forums/viewtopic.php?p=57674#p57674 #C http://conwaylife.com/wiki/2-engine_Cordership x = 761, y =