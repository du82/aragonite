["https://conwaylife.com/book/glider_synthesis"]
title = "Conway's Game of Life: Mathematics and Construction"
description = "A textbook for mathematical aspects of Conway's Game of Life and methods of pattern construction."
full_description = '''RLE, Macrocell, or LifeHistory code for all patterns that are displayed as figures in Chapter 5: Glider Synthesis are provided here. These patterns can be viewed in-browser by clicking on the "Show in Viewer" link near the code, or the patterns can be viewed and manipulated by copying and pasting the RLE code into Game of Life software like Golly. A period 30 gun that shoots lightweight spaceships, based on using 3 Gosper glider guns and a 3-glider synthesis of the LWSS. A glider collision that produces a block, but is not considered a valid glider synthesis since two of the gliders cannot get into position without crossing paths in the first place. A collection of all 71 distinct two-glider collisions, grouped by what they synthesize. Compiled on January 29, 2005 by Jason Summers. More info: https://www.conwaylife.com/wiki/Glider_synthesis A glider syntheses of the Gosper glider gun that works by synthesizing two blocks via two gliders each and two queen bees by three gliders each. 11-glider synthesis of Paul Tooke's 3-engine Cordership, built by Luka Okanishi and Dave Greene on March 13, 2017. More info: https://www.conwaylife.com/wiki/3-engine_Cordership A slow salvo of 5 gliders can push a block by 2 cells horizontally and 1 cell vertically, thus undoing a (2,1) block pull. A demonstration of how one-time turners can be used to turn a set of gliders coming from the same direction into a set of gliders coming from different directions, and thus synthesize an object like a clock. A collection of 180-degree one-time turners that can offset a glider by any number of generations mod 8, and can also either preserve or change its color. The left column of reflectors preserves color, while the right column changes it. A demonstration of how effective the clock inserter is at inserting a glider in front of and beside other gliders. This configuration was compiled by Dave Greene. A 7-glider synthesis of the fumarole, found by Stephen Silver. More info: https://www.conwaylife.com/wiki/Fumarole'''
author = "Nathaniel Johnston and Dave Greene"
year_published = 2025
clearnet = "https://conwaylife.com/book/glider_synthesis"
