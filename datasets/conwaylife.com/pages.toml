full_description = 'RLE, Macrocell, or LifeHistory code for all patterns that are displayed as figures in Chapter 9: Universal Computation are provided here. These patterns can be viewed in-browser by clicking on the "Show in Viewer" link near the code, or the patterns can be viewed and manipulated by copying and pasting the RLE code into Game of Life software like Golly. A binary register that was constructed by Dave Greene in April 2020. It uses several glider duplicators and edge-shooting Herschel conduits to create one of four different slow glider salvos, corresponding to the four actions INC, TDEC, SET, and READ. A component of the general purpose calculator that facilitates addition of two binary registers by keeping track of carry bits in the binary addition. A component of the general purpose calculator that facilitates subtraction of two binary registers by keeping track of carry bits in the binary subtraction. A component of the general purpose calculator that facilitates multiplication of a binary register by 10 by keeping track of carry bits in the binary multiplication. A 7-glider salvo that creates a pixel block off to the side of a pointer block, without destroying the pointer block. A 14-glider salvo that pushes a block away by 32 full diagonals. Used in the character printer component. A conduit that aims a glider salvo at a target (cursor) block so as to push it forward by 32 full diagonals, and optionally place a pixel block off to its side. A device that computes and prints the decimal digits of pi. Originally constructed in a somewhat larger form by Adam P. Goucher in February 2010.'
