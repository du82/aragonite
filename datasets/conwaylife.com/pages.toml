full_description = 'RLE, Macrocell, or LifeHistory code for all patterns that are displayed as figures in Chapter 2: Still Lifes are provided here. These patterns can be viewed in-browser by clicking on the "Show in Viewer" link near the code, or the patterns can be viewed and manipulated by copying and pasting the RLE code into Game of Life software like Golly. The leftmost block is a strict still life, the bi-block is a pseudo still life, and none of the other arrangements of blocks here are pseudo still lifes. A selection of small still lifes. The still lifes on the left are strict, while the ones on the right are pseudo. A 32-cell still life found in 2001 that can be broken down into three stable pieces, but not two. More info: https://www.conwaylife.com/wiki/Triple_pseudo_still_life A 34-cell pseudo still life that can be decomposed into four stable subpatterns, but can not be decomposed into two or three stable subpatterns. More info: https://www.conwaylife.com/wiki/Quad_pseudo_still_life An example of how an arbitrarily-drawn path of live cells can be stabilized to be part of a still life. A row of 5 orthogonally-connected cells can be stabilized by a single cell, like one from a tub or an eater 1. Eater 1 about to eat a glider, a middleweight spaceship, a lightweight spaceship, and several other objects. A well-known eater and 19-cell still life that can eat gliders that approach it along four different paths. More info: https://www.conwaylife.com/wiki/Eater_2 A 12-cell still life and eater composed of a tub with tail and a block that is capable of eating gliders that approach from the top-right. More info: https://www.conwaylife.com/wiki/Eater_5 A reaction that shows how a snake can be used to eat two gliders. Later in the book, we will use this reaction to store data in memory. More info: https://www.conwaylife.com/wiki/Boat-bit'
