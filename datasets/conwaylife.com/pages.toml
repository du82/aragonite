full_description = 'RLE, Macrocell, or LifeHistory code for all patterns that are displayed as figures in Chapter 1: Early Life are provided here. These patterns can be viewed in-browser by clicking on the "Show in Viewer" link near the code, or the patterns can be viewed and manipulated by copying and pasting the RLE code into Game of Life software like Golly. Some commonly-occurring objects. From left to right, these are called: block, tub, boat, ship, beehive, loaf, pond, blinker, and glider. A period 3 oscillator. Despite its size, this is the fourth most common oscillator (and by far the most common of period greater than 2). More info: https://www.conwaylife.com/wiki/Pulsar A very well-known period 4 c/2 orthogonal spaceship. More info: https://www.conwaylife.com/wiki/Lightweight_spaceship One of 35 hexominoes. It is a predecessor of the blockade. More info: https://www.conwaylife.com/wiki/Stairstep_hexomino A pattern that lays a beehive on either side of itself before exploding. More info: https://www.conwaylife.com/wiki/Queen_bee A true period 30 glider gun. The first known gun and the first known finite pattern with unbounded growth. More info: https://www.conwaylife.com/wiki/Gosper_glider_gun A very common unstable pattern with lifespan 148 that often arises with the cell at top left shifted one space upward, which does not affect the subsequent evolution. More info: https://www.conwaylife.com/wiki/B-heptomino Twin bees shuttle was found in 1971 and is the basis of most known period 46 oscillators. More info: https://www.conwaylife.com/wiki/Twin_bees_shuttle A true period 46 gun. The second known basic gun. More info: https://www.conwaylife.com/wiki/New_gun_1 An unstable pattern that moves 8 cells diagonally in 96 generations while leaving chaotic debris behind. It can be used to make c/12 diagonal puffers and spaceships. More info: https://www.conwaylife.com/wiki/Switch_engine A methuselah with lifespan 7468 found on February 20, 2005. More info: https://www.conwaylife.com/wiki/7468M'
