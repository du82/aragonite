["https://conwaylife.com/wiki"]
title = "LifeWiki"
full_description = '''Home • LifeWiki • Book • Catagolue • Forums • Discord • Golly Main Page From LifeWiki Jump to navigation Jump to search Welcome to LifeWiki, the wiki for Conway's Game of Life. Currently contains 2,669 articles. Guns Methuselahs Oscillators Puffers Spaceships Still lifes Wicks All patterns Everything else Overview · How to contribute · ConwayLife.com Image gallery · A–Z index Today's featured article Tanner's p46 is a period-46 oscillator that was found by Tanner Jacobi in 2017 involving a pi running a small conduit. Mark Niemiec posted a 19-glider synthesis two hours after its discovery. Various guns can be constructed by combining two of the oscillators themselves, one of which produces middleweight spaceships without any gliders required.Read more... In the news February 12: Keith Amling discovers the first 2c/5 orthogonal chicken wire greyship. February 8: iNoMed constructs a record-breaking small period-80 HWSS gun based on a new p80 R-pentomino hassler by Caleb R. Hilton. This gun has the unusual property of being gliderless. February 7: Matthias Merzenich uses Logic Life Search to reduce the p28 glider gun, making it the tenth period with a true-period gun smaller than the single-barreled Simkin glider gun. February 6: Matthias Merzenich uses Logic Life Search to complete a single-engine p57 glider gun based on a partial result by ElijahKen. Subsequent reductions by Merzenich, ElijahKen, iNoMed, and vilc result in a single-engine gun that is 45% smaller than the previous 2-engine gun. February 3: Keith Amling discovers and vilc synthesises a new 32-cell 2c/4 orthogonal spaceship. February 1: Entity Valkyrie synthesises LWSS pulling Unnamed tagalong 23P4H2V0. At 32 cells, this was the smallest known spaceship without a previously known glider synthesis. Editable news item submissions page • Archive • Did you know... ... that hitting a pre-block with a glider on a certain lane can output either an LWSS or MWSS, depending only on a one-tick change in the timing? ... that the clock is almost 5,000 times rarer than the toad, despite both having 6 cells and fitting in a 4 × 4 bounding box? ... that the quadpole is more common than the tripole in random soup, due to a relatively common bottleneck reaction involving a century variant hitting a ship? ... that a half blockade can be struck by a single glider to produce a three-block constellation that becomes its mirror image when hit by another glider, while also releasing another glider in the same direction? ... that a series of increasingly larger greyships, starting with Canada Grey, can all be constructed incrementally by colliding gliders with a gradually accreting still life target? ... that oblique puffers and rakes based on elementary spaceships were unknown in Conway's Life until Dylan Chen and Adam P. Goucher constructed combinations of sprayer knightships in May 2021? ... that a configuration of two ponds and two blocks recovers back to its original position when sparked in a certain way, allowing for the creation of some period multipliers? ... that the third-smallest unique-period gun (at the time) was discovered just six hours after the second-smallest unique-period gun, despite the two being completely unrelated? ... that despite 22P36 having been known since 1995, one half of it was not generalized to a versatile traffic stop catalyst until 26 years later? ... that Merzenich's p64 and 32P21 are both hassling two beehives and two R-pentominoes, and 56P27 hassles four of each? Showing 10 items out of 197 More did you know... Pattern collection The LifeWiki contains one of the most comprehensive catalogues of patterns available on the internet. Within it you will find: 1727 patterns (including 703 oscillators, 209 spaceships and 374 still lifes); 3733 images (608 animated and 3125 static); Over 3000 downloadable pattern files; Glider syntheses for 992 patterns. Download pattern collection6MB .zip archive containing the 5200+ Game of Life RLE pattern files used on the wikiAlso available: 38KB .zip archive containing approximately 75 pattern files for other cellular automata Retrieved from "https://conwaylife.com/w/index.php?title=Main_Page&oldid=156510" Hidden category: Pages using DynamicPageList parser function'''
year_published = 2025
clearnet = "https://conwaylife.com/wiki"
