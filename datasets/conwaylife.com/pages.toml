full_description = 'RLE, Macrocell, or LifeHistory code for all patterns that are displayed as figures in Chapter 7: Stable Circuitry are provided here. These patterns can be viewed in-browser by clicking on the "Show in Viewer" link near the code, or the patterns can be viewed and manipulated by copying and pasting the RLE code into Game of Life software like Golly. The 8 possible orientations of Herschels. From left to right, these are called F, Fx, R, Rx, B, Bx, L, and Lx. A glider-to-Herschel converter that was found by Tanner Jacobi in 2015. More info: https://www.conwaylife.com/wiki/Syringe A modification of the syringe glider-to-Herschel converter that replaces the welded eater with an eater 2 and an eater 1. A small, stable color-changing reflector that uses a "Bandersnatch" and a Snark. The Bandersnatch was found by Martin Grant and Entity Valkyrie in June 2020. More info: https://www.conwaylife.com/wiki/Bandersnatch A small glider duplicator that works by using a syringe to convert a glider into a Herschel, and then a Herschel conduit to convert that Herschel into two gliders. An incomplete glider-to-LWSS circuit. It produces three gliders that go to the right positions to synthesize a LWSS, but they have incorrect timing. A adjustable true-period period 80 glider gun that can be turned into a period 80+n gun by (a) moving the top 33 rows northeast by n cells and (b) adjusting the spacing of the 8 input gliders so that they are separated by 80+n generations. A color-preserving, doubling signal conduit with a repeat time of 48, found by Tanner Jacobi in 2017. More info: https://www.conwaylife.com/wiki/CP_semi-Snark A conduit named BLx19R that converts a B-heptomino into an R-pentomino. More info: https://www.conwaylife.com/wiki/BLx19R A conduit named RF28B that converts an R-pentomino into a B-heptomino. More info: https://www.conwaylife.com/wiki/RF28B An LWSS-to-glider converter found by Ivan Fomichev in October 2015. Can also accept an MWSS as an input. A conduit named BLx19R that converts a B-heptomino into an R-pentomino. More info: https://www.conwaylife.com/wiki/BLx19R'
