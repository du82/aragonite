full_description = '''RLE, Macrocell, or LifeHistory code for all patterns that are displayed as figures in Chapter 12: The 0E0P Metacell are provided here. These patterns can be viewed in-browser by clicking on the "Show in Viewer" link near the code, or the patterns can be viewed and manipulated by copying and pasting the RLE code into Game of Life software like Golly. A replicator for the HighLife rule (B36/S23) that was found by Nathan Thompson in 1994. More info: https://conwaylife.com/wiki/OCA:HighLife A smiley face (or any other pattern) is a replicator in the rule B1357/S1357 (which is appropriately named "replicator"). A reflectorless rotating oscillator in an isotropic cellular automaton that was found by Hdjensofjfnen in January 2020. A spaceship made of spaceships made of spaceships in an isotropic cellular automaton. Found by FWKnightship in August 2019, based on the spaceship made of spaceships that was found by Saka in August 2017. A non-isotropic rule that emulates the Rule 90 elementary cellular automaton, so a single cell produces a Sierpinski triangle. How to use a single glider to block a syringe-based reflector, and then one more glider to unblock it (but with a different output direction). A period 2^12 = 4096 clock gun being used to periodically change what happens to a single-channel glider sequence. As the clock gun releases its gliders, the single-channel glider sequence changes from being reflected to the northeast, to being absorbed, to being reflected to the southwest, to passing through to the southeast. A close-up of a child 0E0P metacell's south corner after its clock gun has started up, but before it has done anything (i.e., before it has started destroying itself, thus signalling the various stages of its life). The interesting region of the t = 0 snapshot of the 0E0P metacell, at its south corner where the clock gun releases a glider that starts everything in motion. This metacell is emulating the rule B2-an3-eiky4aiqw5ijnr6ak/S012ik3-acir4kqw5acq6ack7c8. See below for the full snapshot.'''
