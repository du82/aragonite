["https://conwaylife.com/book/universal_construction"]
title = "Conway's Game of Life: Mathematics and Construction"
description = "A textbook for mathematical aspects of Conway's Game of Life and methods of pattern construction."
full_description = 'RLE, Macrocell, or LifeHistory code for all patterns that are displayed as figures in Chapter 11: Universal Construction are provided here. These patterns can be viewed in-browser by clicking on the "Show in Viewer" link near the code, or the patterns can be viewed and manipulated by copying and pasting the RLE code into Game of Life software like Golly. A method of pulling a block 1 full diagonal closer via just two gliders. Found by Dean Hickerson no later than March 1990. A method of pushing a block 1 full diagonal farther away via just two gliders. Found by Paul Chapman in 2004. A component with 4 input glider lanes that trigger four different actions on a sliding block: push, pull, fire perpendicular white glider, and fire perpendicular black glider. Constructed by Paul Chapman in 2004. A 13-glider single-channel glider recipe that produces a perpendicular glider on lane -18 of the interior side of the elbow block. A sequence of 185 gliders on a single lane that collide with a 90-degree elbow block so as to create a hand block, and then move that hand block down by 11 cells via a 4-glider slow salvo. A 14-glider single-channel glider recipe that produces a glider on lane 8 (i.e., 8 half-diagonals up from the input glider stream). A sequence of 118 gliders on a single lane that collide with a zero-degree elbow block so as to create a hand block, and then move that hand block up by 11 cells via a 4-glider slow salvo. 25 gliders (elbow to offset block which will serve as the new elbow) 14 + 17 = 31 gliders (elbow pull to line up with new elbow) 19 gliders (elbow duplicator) 15 gliders (pull near elbow to a safe distance) 2253 gliders (complete the Snark construction) 8 gliders (remove the 0-degree elbow) 76 gliders (push elbow back to a safe distance to repeat the recipe) 1 glider (suppressed by extra cell, marks safe repeat location) More info: https://www.conwaylife.com/forums/viewtopic.php?p=44377#p44377 More info: https://www.conwaylife.com/wiki/Snarkmaker A single-channel recipe that destroys a Snark and adjusts the elbow block accordingly. Found by Simon Ekstr�m and Chris Cain in June 2017. More info: https://www.conwaylife.com/wiki/Snarkbreaker'
author = "Nathaniel Johnston and Dave Greene"
year_published = 2025
