full_description = 'RLE, Macrocell, or LifeHistory code for all patterns that are displayed as figures in Chapter 8: Guns and Glider Streams are provided here. These patterns can be viewed in-browser by clicking on the "Show in Viewer" link near the code, or the patterns can be viewed and manipulated by copying and pasting the RLE code into Game of Life software like Golly. Two period 29 glider streams that are pointed at each other in such a way that one is destroyed and the other is thinned out by a factor of two. Two glider streams that are pointed at each other in such a way that one is destroyed and the other is thinned out by a factor of three. Two glider streams that are pointed at each other in such a way that one is destroyed and the other is thinned out by a factor of five. Two glider streams that are pointed at each other in such a way that one is destroyed and the other is thinned out by a factor of seven. A collision of a lightweight spaceship and a glider that results in a glider travelling in another direction. The p6 unix oscillator, a p6 pipsquirter, and an LWSS being used to merge another LWSS into a p14 glider stream. A p7 pipsquirter providing a domino spark and a Herschel conduit dproviding the uoplet spark needed to squish an LWSS into a gap in a p14 glider stream. A T-nosed p4, Heavyweight emulator, and perpendicular LWSS being used to provide the sparks necessary to merge an LWSS into a gap in a p14 glider stream. A MWSS volcano, pentadecathlon, and antiparallel LWSS being used to provide the sparks necessary to merge an LWSS into a gap in a p14 glider stream. A period 84 LWSS gun that makes use of a conduit that converts a Herschel and glider collision into an LWSS, as well as the p84 adjustable glider gun. A period 84 LWSS gun that makes use of a conduit that converts a Herschel and glider collision into an LWSS. T-nosed p4 being used to double the period of a period 4n+2 (n >= 3) stream of lightweight spaceships. A blocker being used to double the period of a period 8n+4 (n >= 2) stream of lightweight spaceships.'
