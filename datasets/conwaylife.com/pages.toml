["https://conwaylife.com/wiki/LifeWiki:Privacy_policy"]
title = "LifeWiki:Privacy policy - LifeWiki"
full_description = '''Home • LifeWiki • Book • Catagolue • Forums • Discord • Golly LifeWiki:Privacy policy From LifeWiki Jump to navigation Jump to search This privacy policy contains details about the type of information that is collected and recorded by ConwayLife.com, and how we use it. Contents 1 Log Files 2 Cookies and Web Beacons 3 Our Advertising Partners 4 Children's Information 5 Consent Log Files ConwayLife.com follows a standard procedure of using log files. These files log visitors when they visit websites. All hosting companies do this and a part of hosting services' analytics. The information collected by log files include internet protocol (IP) addresses, browser type, Internet Service Provider (ISP), date and time stamp, referring/exit pages, and possibly the number of clicks. These are not linked to any information that is personally identifiable. The purpose of the information is for analyzing trends, administering the site, tracking users' movement on the website, and gathering demographic information. Cookies and Web Beacons Like many other websites, ConwayLife.com and its partners use "cookies". These cookies are used to store information including visitors' preferences, and the pages on the website that the visitor accessed or visited. The information is used to optimize the users' experience by customizing our web page content based on visitors' browser type and/or other information. Third party vectors, including Google, use cookies to serve ads based on a user's visits to ConwayLife.com and other websites. Google's use of advertising cookies on ConwayLife.com also enables it and its partners to serve ads to you based on your visit here and to other sites on the Internet. However, visitors may choose to decline the use of Google cookies by visiting the Google ad and content network Privacy Policy at https://policies.google.com/technologies/ads. You can also choose to disable cookies through your web browser's settings. Our Advertising Partners Some of advertisers on our site may use cookies, javascript, or web beacons. Our advertising partners are listed below. Each of our advertising partners has their own Privacy Policy for their policies on user data. For easier access, we hyperlinked to their Privacy Policies below. Google: https://policies.google.com/technologies/ads Media.net: https://www.media.net/privacy-policy Children's Information ConwayLife.com does not knowingly collect any personal identifiable information from children under the age of 13. If you think that your child provided this kind of information on our website, we strongly encourage you to contact us immediately and we will do our best efforts to promptly remove such information from our records. Consent By using our website, you hereby consent to our Privacy Policy. Retrieved from "https://conwaylife.com/w/index.php?title=LifeWiki:Privacy_policy&oldid=141262"'''
