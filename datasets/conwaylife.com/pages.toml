full_description = 'RLE, Macrocell, or LifeHistory code for all patterns that are displayed as figures in Chapter 4: Spaceships and Moving Objects are provided here. These patterns can be viewed in-browser by clicking on the "Show in Viewer" link near the code, or the patterns can be viewed and manipulated by copying and pasting the RLE code into Game of Life software like Golly. A small c/4 diagonal spaceship with an isolated domino spark; discovered in September 2004. More info: https://www.conwaylife.com/wiki/B29 A c/4 period 4 spaceship. At the time of its discovery, the Canada goose was the smallest known diagonal spaceship other than the glider, but this record has since been beaten. More info: https://www.conwaylife.com/wiki/Canada_goose The smallest known diagonal spaceship other than the glider. Period 4 with speed c/4. It was discovered in September 2000. More info: https://www.conwaylife.com/wiki/Crab An orthogonal period 4 c/2 tagalong for the heavyweight spaceship that was found in 1992. More info: https://www.conwaylife.com/wiki/Sidecar An orthogonal period 4 c/2 pushalong that attaches to the front of a middleweight spaceship. Found in 1992. More info: https://www.conwaylife.com/wiki/Pushalong_1 The three pseudo spaceships that can be constructed from mixing and matching two light, middle, and/or heavyweight spaceships. A would-be spaceship similar to the LWSS, MWSS and HWSS, but longer. It is unstable by itself, but can be escorted by other spaceships to produce a flotilla. More info: https://www.conwaylife.com/wiki/Overweight_spaceship A c/12 period 96 diagonal Cordership that uses 10 switch engines, which was the fewest possible known at the time of its discovery. More info: https://www.conwaylife.com/wiki/10-engine_Cordership An orthogonal period 140 c/2 puffer. The second puffer to be found. It uses two lightweight spaceships to escort a B-heptomino. More info: https://www.conwaylife.com/wiki/Puffer_2 A period 20 c/2 orthogonal spaceship based on one of the classic puffer trains. More info: https://www.conwaylife.com/wiki/Ecologist'
