650bo$651bo12$670b3o$670bo$671bo125$758b2o$758bobo$ 758bo! #C [[ THUMBSIZE 2 THEME 6 GRID GRIDMAJOR 0 SUPPRESS THUMBLAUNCH ]] #C [[ THEME 6 THUMBNAIL THUMBSIZE 2 AUTOSTART X -375 Y -375 ZOOM 6 GRID OFF CELLBORDERS LOOP 5000 ]] #C [[ PAUSE 2 LINEAR ZOOM WIDTH 600 HEIGHT 600 ]] #C [[ T 500 ]] #C [[ T 1000 X -200 Y -200 Z -1 STEP 5 ]] #C [[ T 3000 X -350 Y -350 Z 4 LINEAR ZOOM ]] #C [[ T 3200 X -380 Y -380 Z 8 LINEAR ZOOM ]] #C [[ T 4000 X -425 Y -425 ]]<div style="border-width:1px;border-color:#888888;border-style:solid;padding:8px;">Please enable Javascript to view this LifeViewer.</div>Slow salvo construction of a 15-object one-glider seed(click above to open LifeViewer)RLE: here Plaintext: here Uses David Bell built a log(t) growth from four 2-engine Corderships,[14] and a 4-engine Cordership rake from two adjacent 2-engine Corderships,[15] both on January 3rd, 2018. 2718281828, Dave Greene and Chris Cain posted glider syntheses for this rake on January 7th, allowing for the construction of breeders.[16][17][18] Bell further built two different period-96 c/12 forward rakes, one using the 4-engine rake, along with the 2-engine Cordership and an older 3-engine block puffer,[19] the other using a new Cordership boat and block puffer, two 2-engine Corderships, and a sideways rake, both on January 6th, 2018.[19] He also built a different Cordership made from a two-engine boat puffer and a 2-engine Cordership that contains a glider which can escape if the boat is deleted by a sideways or forward glider.[19] Chris Cain updated the infinite glider hotel to use the 2-engine Cordership on January 3rd, 2018.[20] Entity Valkyrie built an 714 × 501 2-engine Cordership gun on January 6, 2018, using Luka Okanishi's 9-glider synthesis;[21] BlinkerSpawn noted that this gun could be compacted to 385 × 253 using the quadri-Snark.[22] Dave Greene built an unrelated period-556 2-engine Cordership gun on January 7.[23][24] Entity Valkyrie built a different gun using a boat keeper reaction on January 10.[25] On August 29 that year, Nathaniel Johnston completed a stable glider to 2-engine Cordership converter,[26] which converts an input glider to a 2-engine Cordership at repeat time 556 ticks, thus allowing for arbitrary high-period guns to be built. The following is an improved design by Dave Greene: x = 561, y = 544, rule = B3/S23 296bobo$296b2o$297bo77$313b2o$313bobo$315bo4b2o$311b4ob2o2bo2bo$311bo 2bobobobob2o$314bobobobo$315b2obobo$319bo2$305b2o$306bo7b2o$306bobo5b 2o$307b2o7$317b2o$317bo$318b3o$320bo12$301b2o$301bobo$303bo4b2o$299b4o b2o2bo2bo$299bo2bobobobob2o$302bobobobo$303b2obobo$307bo2$293b2o$294bo 7b2o$294bobo5b2o$295b2o7$285b2o18b2o$286bo18bo$284bo21b3o$284b5o14b3o 2bo$289bo13bo2bo$286b3o12bobo2b2o$257b2o26bo15b2o$258bo26b4o$256bo26b 2o3bo3b2o$256b5o14b2o5bo2b3o4b2o$261bo13bo6b2obo$258b3o12bobo9bo$257bo 15b2o10b2o$163b2o11bo80b4o$163b2o10bobo77b2o3bo3b2o$175bobo2b2o3bo68bo 2b3o4b2o27b2o$174b2ob2o2bo2bobo12bo49bo4b2obo36bo$178bobo3bobo10b3o47b 3o7bo33b3o$174b2obo2b4obo10bo26bo22bo10b2o32bo$174b2obobo3bo12b2o25b3o 20b2o$178bobo3bo41bo73b2o$179bobo3bo39b2o38b2o33bo$180bo3b2o80bo31bobo $206bo49bo6b3o28b2o2b2o$206b3o47b3o4bo30b2o$209bo49bo44bo$171b2o35b2o 11b2o35b2o11b2o29b3o$171b2o48b2o48b2o28bo$156b2o143b2o$155bo2bo$154bob 2o$154bo$153b2o$168b2o$168bo135b2o$169b3o24b2o48b2o56b2o$171bo11b2o11b 2o35b2o11b2o34b2o$184bo49bo46bobo$181b3o47b3o47bo$181bo49bo48b2o$292b 2o$200b2o47b2o38bo3bo$201bo15b2o6b2o21bobo16b2o6b2o5b2o5b4o$198b3o15bo 2bo5b2o21bo17bo2bo5b2o5bobo$112bo85bo17bo2bo27b2o17bo2bo14bo4b2o$110b 3o104b2o48b2o11b4ob2o2bo2bo$109bo80bo89bo2bobobobob2o$108bobo79b3o90bo bobobo58b2o$108bobo82bo90b2obobo58bo$109bo82b2o43bo50bo61bo$237b3o90b 2o14b5o$240bo33b2o52bo2bo13bo$184b2o53b2o34bo7b2o43b2obobo12b3o$184bo 90bobo5b2o45bob2o15bo$93b2o86b2obo91b2o52bo15b4o$93b2o86bo2b3o4b2o38b 2o95b3o10b2o3bo3b2o$125b2o55b2o3bo3b2o38bo95bo13b2o4b3o2bo$126bo57b4o 40b2obo95b2o20bob2o2b2o$124bo59bo15b2o26bo2b3o4b2o109bo5bobo$113b2o9b 5o14b2o40b3o12bobo26b2o3bo