["https://conwaylife.com/book/oscillators"]
title = "Conway's Game of Life: Mathematics and Construction"
description = "A textbook for mathematical aspects of Conway's Game of Life and methods of pattern construction."
full_description = '''RLE, Macrocell, or LifeHistory code for all patterns that are displayed as figures in Chapter 3: Oscillators are provided here. These patterns can be viewed in-browser by clicking on the "Show in Viewer" link near the code, or the patterns can be viewed and manipulated by copying and pasting the RLE code into Game of Life software like Golly. A period 8 oscillator found by John Conway's group in 1970. More info: https://www.conwaylife.com/wiki/Hertz_oscillator A period 2 oscillator that is very similar to the Hertz oscillator. More info: https://www.conwaylife.com/wiki/Negentropy The first period 10 oscillator to be found. Found no later than 1976, by David Buckingham. More info: https://www.conwaylife.com/wiki/42P10.1 A period 3 oscillator that was found in September 1971. More info: https://www.conwaylife.com/wiki/Two_eaters A period 9 oscillator consisting of a pentadecathlon with stabilizers that force it into a lower period. More info: https://www.conwaylife.com/wiki/Snacker A period 4 oscillator found no later than 1972. More info: https://www.conwaylife.com/wiki/Confused_eaters The first period 12 oscillator to be found. Discovered in 1972. More info: https://www.conwaylife.com/wiki/Dinner_table With a minimum population of 35 cells this is the smallest known period 52 oscillator. More info: https://www.conwaylife.com/wiki/35P52 A period 36 oscillator, discovered on January 29, 1995. More info: https://www.conwaylife.com/wiki/22P36 A period 12 oscillator that was found by Matthias Merzenich in December 2015. More info: https://www.conwaylife.com/wiki/35P12.1 The first period 13 oscillator to be found. Found in 1976. More info: https://www.conwaylife.com/wiki/65P13.1 A period 5 oscillator that emits a rather isolated domino spark. More info: https://www.conwaylife.com/wiki/Heavyweight_volcano A period 7 oscillator that emits a domino spark. More info: https://www.conwaylife.com/wiki/Hebdarole A period 8 oscillator that emits some domino sparks. More info: https://www.conwaylife.com/wiki/Figure_eight'''
author = "Nathaniel Johnston and Dave Greene"
year_published = 2025
