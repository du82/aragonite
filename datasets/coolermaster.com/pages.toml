["https://coolermaster.com/en-us/cookie-policy"]
title = "Cookie Policy | Cooler Master"
description = "Like most commercial websites we use cookies on Cooler Master web pages. To make this site work properly, we sometimes place small data files called cookies on your device. Each cookie expires after a certain period of time depending on what we use it for. We use cookies for several reasons. Below we list and describe the various types of cookies we use on our site."
full_description = "Home/Cookie policyCookie Policy2MIN READAbout the Cookies Cooler Master UsesLike most commercial websites we use cookies on Cooler Master web pages. To make this site work properly, we sometimes place small data files called cookies on your device. Each cookie expires after a certain period of time depending on what we use it for. We use cookies for several reasons. Below we list and describe the various types of cookies we use on our site.About the Cookies Cooler Master UsesLike most commercial websites we use cookies on Cooler Master web pages. To make this site work properly, we sometimes place small data files called cookies on your device. Each cookie expires after a certain period of time depending on what we use it for. We use cookies for several reasons. Below we list and describe the various types of cookies we use on our site.What are cookies?A cookie is a small text file that a website saves on your computer or mobile device when you visit the site. It enables the website to remember your actions and preferences (such as login, language, font size and other display preferences) over a period of time, so you don’t have to keep re-entering them whenever you come back to the site or browse from one page to another. How does Cooler Master use cookiesWe use different types of cookies for different things, such as:Analyzing how you use the Cooler MasterGiving you a better, more personalized experienceRecognizing when you've signed in Strictly Necessary cookiesThese cookies let you use all the different parts of coolermaster.com. Without them services that you have asked for cannot be provided. Some examples of how we use these cookies are: Signing into the CM Fanzone or Community, it will be remembering some personal settings which accessing the other cooler master's websites. Functional cookiesThese help us personalize the Cooler Master to you. For instance, remembering your preferences and settings so if you talking with tech support guys via live chat in CM FanzoneSome examples of how we use these cookies are:To collect information about which web pages visitors go to most often so we can improve the online experienceError management to make sure that the website is working properlyTesting designs to help improve the look and feel of the website. Strictly Necessary cookies__cf_bmThis cookie is used for CloudFlare CDN services and is only used to determine from what CDN location the website needs to serve data.ClientCountryThis cookie is used to ensure the website is displayed correctly based on the user's location.CM.CompareProductsThis cookie is used for product comparisons in the product comparison feature.CM.CookieWallAcceptedThis cookie keeps track of your cookie consent choice.CM.CustomerTypeThis cookie keeps track of splash page choiceCM.ShowRegionPopupThis cookie keeps track of country choice for the popupASP.NET_SessionId​​This cookie names are associated with technology from CM Fanzone. It indicates that a user is signed in.cookieconsent_statusThis cookie names are associated with technology from CM Fanzone. It indicates the state of the sign in session.UserNameThis cookie names are associated with technology from CM Fanzone. This is cookie is used to store the user's name.BrowserIdThis cookie name is associated with technology from Salesforce. This is cookie is used to identity tokens of browser.apex_PKB2SessionIdThis cookie name is associated with technology from Salesforce. This cookie is set the identity tokens.ips4_cookie_consent, ips4_cookie_consent_optional, ips4_device_key, ips4_hasJS, ips4_IPSSessionFront, ips4_IPSSessionSetup, ips4_ipsTimezoneThis cookie names are associated with technology from Invision Community. Performance cookiesga, gid, gclauThis cookie name is associated with Google Universal Analytics. How do I change my cookie settings?Most web browsers allow some control of most cookies through the browser settings. To find out more about cookies, including how to see what cookies have been set and how to manage and delete them, visit www.aboutcookies.org or www.allaboutcookies.org. To opt out of being tracked by Google Analytics across all websites visit http://tools.google.com/dlpage/gaoptout."
