full_description = "Home/General terms and conditions of sale and deliveryTerms of Sale12MIN READThese Terms of Sale apply to all purchases by an individual or entity (“you”) of any products, software, services, and/or support (“Product”) from www.coolermaster.com (the “Site”) unless modified by Cooler Master. By submitting an order to Cooler Master and/or by purchasing any Product from Cooler Master, you acknowledge that you agree to these Terms of Sale in their entirety.These Terms of Sale apply to all purchases by an individual or entity (“you”) of any products, software, services, and/or support (“Product”) from www.coolermaster.com (the “Site”) unless modified by Cooler Master. By submitting an order to Cooler Master and/or by purchasing any Product from Cooler Master, you acknowledge that you agree to these Terms of Sale in their entirety.These Terms of Sale constitute a legally binding agreement between you and Cooler Master and your purchase of Product constitutes acknowledgement that you understand, accept, and agree to abide by the terms of this Agreement. By submitting your order or purchasing any Product, you affirm that you are of legal age to enter into these Terms of Sale, or, if you are not, that you have obtained parental or guardian consent to enter into these Terms of Sale and your parent or guardian consents to these Terms of Sal on your behalf. If you violate or do not agree to these Terms of Sale, then your purchase and/or use of Product is unauthorized.I. INCORPORATED DOCUMENTSThese Terms consist of this document and Cooler Master’s Terms of Use, Privacy Policy, and Limited Licenses.II. ORDERS, ACCEPTANCE, AND CANCELLATION Your order is an offer to buy Product from Cooler Master. Cooler Master may send an order confirmation email to acknowledge receipt of your order, but Cooler Master does not accept your order until we send you a notice that ordered Product has been shipped. Cooler Master may process payment for and ship parts of an order separately at our sole discretion. Cooler Master reserves the right at any time, even after having sent you a confirmation email, to cancel your order or to limit order quantities for any reason, including, but not limited to, errors or suspected fraud.You represent and warrant that you have the right to use any credit card or other means of payment that you provide to us. By providing payment card information to us, you authorize us to use the card as a payment method for purchases made through your Cooler Master account, including on affiliated sites and properties which you access via your Cooler Master account credentials. All billing information you provide to us must be truthful and accurate. Providing any untruthful or inaccurate information is a breach of these Terms of Use and may result in cancellation of your order. Prior to accepting an order, we may also request additional information from you. Verification of information may be required prior to the acknowledgment or completion of any purchase. We reserve the right to refuse or cancel an order for any reason including limitations on quantities available for purchase, inaccuracies, or errors in product or pricing information, or problems identified by our credit and fraud avoidance department. If your order is canceled after your credit card (or other payment account) has been charged, we will issue a credit to your credit card (or other applicable payment account) in the amount of the charge. We will attempt to contact you if all or any portion of your order is canceled or if additional information is required to accept your order. Cooler Master may request a pre-authorization for some orders placed online with a credit or debit card. This pre-authorization will not be billed to you; however, your card issuer may hold this amount for a short period. Your card issuer determines the length of time the pre-authorization is held. We do this to ensure that the card details are still valid and that you have sufficient funds to complete the transaction.By confirming your purchase at the end of the checkout process, you agree to accept and pay for the Products, as well as all shipping and handling charges and applicable taxes. You will not be charged for most orders until the order has shipped. Exceptions to this policy, i.e. occasions when you will be charged at the time your order is placed, are orders paid for with a Gift Card, eGift Card, or PayPal account.Cooler Master reserves the right, including without prior notice, to limit the quantity of items purchased per person, per household, or per order for any reason. We will attempt to notify you should such limits be applied. Cooler Master also reserves the right, at our sole discretion, to prohibit sales to dealers or resellers. For purposes of these Terms of Use, “reselling” will be defined as purchasing or intending to purchase any Product(s) from Cooler Master for the purpose of engaging in a commercial sale of the same Product(s) to a third party.In addition to any other remedies available to it, Cooler Master may in its sole discretion restrict or terminate your account, or cancel or refuse orders for violations of, or abuse of, Cooler Master’s returns policy.III. PRICING AND AVAILABILITY Cooler Master cannot confirm the price or availability of an item until after an order is placed. Pricing or availability errors may occur on the Site or through third party retailers. The receipt of an order confirmation does not constitute our acceptance of an order or our confirmation of an offer to sell a Product. Cooler Master reserves the right to cancel any orders containing pricing or availability errors, with no further obligations to you, even after your receipt of an order confirmation or shipping notice from Cooler Master. Cooler Master may, at its discretion, either contact you for instructions or cancel your order and notify you of such cancellation. Pricing for products on the Site may be different from prices avai