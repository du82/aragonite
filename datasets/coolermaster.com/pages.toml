full_description = "Home/FaqFAQFind quick answers to common questions about our products, services, and policies. Get the information you need right here!CoolingNo results were foundMy liquid cooling fan doesn't light up (ARGB no function), what should I do? Check the ARGB connector and the motherboard connector. Please follow the steps bellow or watch the video tutorial Liquid Cooler ARGB No FunctionA. Check the ARGB connectorStep 1: Check the ARGB wires are connectedStep 2: Connect the liquid cooler wire to the ARGB controller hubStep 3: Connect the ARGB controller hub to SATA power connectorB. Check the motherboard connectorStep 1: Check the ARGB wires are connectedStep 2: Connect the liquid cooler wire to the ARGB controller hubStep 3: Connect the ARGB connector of motherboard How do I know my water pump is working properly?Check the water pump connection to the motherboard or enter BIOS to check. Please follow the steps bellow or watch the video tutorial “Is The Water Pump Functioning Normally”Step 1: Check the water pump connector on the motherboardStep 2: Turn on the computer and press function key entering BIOSStep 3: Enter BIOS and check the CPU fan speed and pumpLiquid cooler ARGB no functionWatch the video tutorial Liquid Cooler ARGB No FunctionPump function checkWatch the video tutorial Pump function checkDeep dive into the MasterLiquid 360 AtmosWatch the video tutorial Deep dive into the MasterLiquid 360 AtmosMasterAir MA624 Stealth INTEL and AMD Installation VideoWatch the video tutorial MasterAir MA624 Stealth INTEL and AMD Installation VideoMasterAir MA612 Stealth ARGB Installation VideoWatch the video tutorial MasterAir MA612 Stealth ARGB Installation VideoMasterAir MA612 Stealth Installation VideoWatch the video tutorial MasterAir MA612 Stealth Installation VideoCaseNo results were foundHow should I troubleshoot if my computer makes noise while running?While the computer is running, sequentially unplug the power cables of the case fan, water cooler head, and water cooling fan to identify the source of the noise. Please follow the steps bellow or watch the video tutorial Abnormal NoiseStep 1 : Unplug the power cable of the case fanStep 2 : Unplug the power cable of the liquid cooler headStep 3 : Unplug the power cable for the water cooling fanHow to adjust parameters of HAF 700 EVO IRIS?The three most commonly asked IRIS parameter adjustments are: multiple displays, uploading custom videos, and adjusting case ARGB. Please follow the steps bellow or watch the video tutorial How to Adjust Parameters in MasterPlus - HAF 700 EVO LCD Display (IRIS)Step 1 Hardware InstallationStep 2 Download and install MasterPlusStep 3 Perform IRIS display calibration / I. Multi DisplayStep 3 Perform IRIS display calibration / II. Upload Custom VideoNote: The video size should be 480x480 pixels or smallerStep 3 Perform IRIS display calibration / III. Change ARGBUpgrade the MasterPlusPre-Built Gaming PC Quick Start GuideLearn MoreHow to Build Your Next PC with the Qube 500 CaseWatch the video tutorial How to Build Your Next PC with the Qube 500 CasePC Building with the Qube 500Watch the video tutorial PC Building with the Qube 500HAF 700 EVO - Iris LCD BIOS update00 PrepareSTEP 0-1Download Iris LCD update files from our website.Continue to Step 01 Install Driver.01 Install DriverContinue to Step 02 Prepare for LCD BIOS update.02 Prepare for LCD BIOS update1. Find the pin hole.2. Press for 5 seconds, wat for LCD to go dark.Continue to Step 03 BIOS update.03 BIOS updateFinished!! LCD will restart automatically.Please restart MasterPlus+, after LCD has been restarted.How To install a 200/230mm Fan into the top of the HAF 912 chassis1. Align the fan to the correct holes as shown below2. Attach the fan with the standard case fan screws that come with the fan.Power SupplyNo results were foundHow to guide Removing the 90-degree 12VHPWR connector bracket?Some Cooler Master’s PSUs features a 90-degree 12VHPWR connector that includes a bracket. This bracket requires some additional information to be removed safely and correctly. Below are some steps and tips for ensuring you can disconnect it correctly.1. Before removing the bracket please be aware that the cable’s warranty will be voided if it takes any damage during this process.2. Using a flathead screwdriver or another similarly shaped tool for prying, gently pry the bracket’s side clips off one at a time. The bracket will begin to come off the connector as each clip opens up.3. Slowly and carefully remove the bracket entirely.4. Once the bracket is removed, straighten the cable without applying any force.*Specifications, appearances, and features may vary by model and region. Please refer to official specification pages for full details.**Warranty Policy is according to the Cooler Master Limited Warranty Policy: If the cable was damaged due to the user’s actions, the cable’s warranty will be voided.How can I resolve a PSU no power issue?Please follow the steps below for troubleshooting or watch the video tutorial PSU No PowerStep 1. Check the AC power cordStep 2. Check the power switch is onStep 3. Connect all power connectorsHow can I know what type of power supply my computer needs?First, You need to prepare your computer hardware specifications previously, and try our free online tool – “power supply calculator”. Please follow the steps bellow or watch the video tutorial How to calculate the wattage you need with online PSU calculatorPrepare your computer hardware specifications previouslyAnd click Builder's Zone > Power Supply CalculatorThe minimum power wattage requiredThe power supply solution we recommendedFind your ideal PSU model!What does AWG mean and why does it matter?American Wire Gauge (AWG) is a standard for the width of electrical wire used predominately in North America. The standard specifies the width of the diameter of the wire, ranging from 0000 to 40. The diameter decreases as the wire gauge number get larger.It is an important factor to evaluate when purchasing a power supply unit because the thicker the cable used the higher the temperature it can endure without problems.How is current noise reduced?In most cases, current noise is not a huge factor during normal use. This is because it’s usually drowned out by other components and fans spinning. But during idle mode when other components are off, current noise can be noticeable and annoying. This is a really odd situation because it means the power supply is causing a problem that doesn’t really effect normal operation. This problem could be easily remedied by simply shutting down your computer when it’s not in use, but for many that isn’t an acceptable option.Currently, manufacturers can only try to reduce current noise by way of three main methods:A. Dip the transformer into the varnish paint longer to glue every microscopic crack to reduce the switching sound when currents pass through it.B. There are three main electrical pillars inside a transformer and usually the middle one is shorter. The middle of the three main pillars inside a transformer is usually shorter that the other two. Engineers often use glue to fill this gap which does have a noticeable effect in current noise reduction.C. Adjust the flow of currents by altering primary and secondary copper wire twining.Brands can demand these processes from manufacturers all they want but ultimately it comes down to the employees in the factory taking the time to do this. While all three methods do have a positive effect on noise reduction, none of them are radical solutions that completely solve the noise problem and thus are often ignored to cut costs and reduce production times.AccessoriesNo results were foundMy screen is not showing anything(monitor no display). What should I do?Check the HDMI connection, Power cables and the RAM in order. Please follow the steps bellow or watch the video tutorial No DisplayStep 1: Connect the graphics card with HDMI cableStep 2: Connect the other side of HDMI cable to the monitorStep 3: Make sure the monitor power cable is connectedStep 4: Remove the RAM (Random Access Memory)Step 5: Use the eraser wiping the connecting fingerStep 6: Install the RAM My monitor has no sound. How can I turn on the sound?Common reasons for no audio on a monitor include incorrect settings, faulty cables, or hardware issues. Please follow the steps below for troubleshooting or watch the video tutorial Monitor No AudioStep 1. Play the audio source Step 2. Ensure the screen audio source is turned on Step 3. Check if the output cable is connected properlyStep 4. Reset to default settingsMy keyboard keys are malfunctioning. What should I do?Under sufficient keyboard battery power, you can check the keyboard connection, restart or clean the keyboard, and check the keyboard settings. We have also prepared a video Keyboard Keys Malfunction to assist you in troubleshooting the issue step by step. Step 1. Make sure the keyboard battery level is sufficientStep 2. Reset the keyboard to default settingsStep 3. Pair the keyboard with the computer again (Bluetooth / Wired / 2.4 GHz)My keyboard cannot charge. How to fix it?Check the charging cable for any damage and ensure it is properly connected (it is recommended to use the charging cable included with the product). You can also clean both ends of the connector and restart the keyboard. Please follow the steps below for troubleshooting or watch the video tutorial Keyboard Cannot Charge. We will explain how to check the keyboard's charging status and wireless connection steps.Step 1. Connect the keyboard to the computerStep 2. Check the keyboard charging function Step 3. Switch to wireless mode for useMasterKeys (NON PRO) S/M/L - Quick Macro Recording GuideTo record Macros on the fly is simple.1. Press FN+F11 to start recording Macro• The C (Cap lock) LED indicator would start flashing2. Select a Key to record a Macro• The C (Cap lock) LED indicator would stay on• The S (Scroll lock) LED indicator would start flashing3. Start typing to record Macro. For Pro L, each profile can record up to 20 Macros, and each Macro can store up to 200 characters.• The C (Cap lock) LED indicator would stay on• The S, G (Scroll lock & Win Lock) LED indicators would both start flashing4. When done recording, Press FN+PRT SC or FN+SCR LK or FN+PAUSE to select Macro Repeat Mode• The C (Cap lock) LED indicator would start flashing againNote: the different repeat mode is Once, Toggle and Cycle respectively.• Once: Macro executes once per Macro Key press.• Toggle: Macro executes indefinitely until macro Key is pressed, and will resume running as Macro Key is pressed again.• Cycle: Macro executes as long as the Macro Key is pressed.5. Press FN+ESC to Save and ExitTo delete Macros is also easy.1. Press FN+F122. Select all the keys you wish to have Macro deleted.3. Press FN+ESC to Save and ExitTo reset all keys back to defaultPress FN+E for 5 sec, or until C, S, G LED indicators all flash 4 times to reset all keys and remove all Macros stored.MasterKeys Pro Series - Quick Macro Recording GuideMasterKeys Pro S/M/L – Quick Macro Recording GuideTo record Macros on the fly is simple.1. For Models with Profiles, a Profile must be selected first (P1, P2, P3, or P4 for Pro L; FN+1, 2, 3 or 4 for Pro M/S).2. Press FN+F11 to start recording Macro3. Select a Key to record a MacroFor PRO LED WHITE, Keys available for recording are lit up, after Key press; selected key would light up brightly.Keys that already have a Macro recorded would light up brightly; you can still select a key that has a Macro already recorded to overwrite its Macro.For Pro RGB: Keys available for recording are BLUE; Keys already have macro recorded are RED. You can still select a key that has a Macro already recorded to overwrite its Macro.4. Start typing to record Macro. For Pro L, each profile can record up to 20 Macros, and each Macro can store up to 200 characters.5. When done recording, Press FN+PRT SC or FN+SCR LK or FN+PAUSE to select Macro Repeat Mode.Note: the different repeat mode is Once, Toggle and Cycle respectively.Once: Macro executes once per Macro Key press.Toggle: Macro executes indefinitely until macro Key is pressed, and will resume running as Macro Key is pressed again.Cycle: Macro executes as long as the Macro Key is pressed.6. Press FN+ESC to Save and Exit (no visual confirmation if the recording is successful).7. To activate the Macro you have just recorded, just press the Key where you have recorded it.To delete Macros is also easy.1. Select Profile (P1, P2, P3, or P4 for Pro L, FN+1, 2, 3 or 4 for Pro M/S).2. Press FN+F123. Select all the keys you wish to have Macro deleted.For PRO LED WHITE, Keys that already have a Macro recorded would light up faintly.For Pro RGB: Keys already have macro recorded are RED.4. Press FN+ESC to Save and Exit1How To Fix a Bent Pin?Remove the switches that are not actuating following Step 2 and straighten out the pins using pliers.Once they are straight, you can attempt to reinstall the switch.How To Swap Out Switches?STEP 1REMOVE THE KEYCAPS WITH A KEYCAP PULLERDo not pull forcibly, but gently wiggle side to side and slowly pull up using the keycap puller.STEP 2REMOVE THE SWITCHES WITH THE SWITCH PULLERHook the top and bottom of the switch at the base and squeeze the switch puller until the two plastic tabs on the side of the switch compress. Gently pull and wiggle until it comes loose.STEP 3GENTLY PRESS NEW SWITCHES INTO PCBLine up the switch pins with the sockets on the keyboard and gently press until the switch is secured.STEP 4PLUG IN THE KEYBOARD AND TEST TO SEE IF THE SWITCHES WORKBefore putting keycaps back on, check using a free online tester. If there are any that do not actuate, the pins may have bent during installation.Device Lost Connection to Dongle after Firmware UpdateIf the MM712 lost connection after firmware update, please check the following troubleshooting suggestion:• Unplug and re-plug dongle to the PC and connect the MM712 under 2.4 GHz mode again.• Repair the MM712 by the steps found here.• Double check if the MM712 had been update to the latest version completely.These steps may resolve the issue, if don’t, please contact us for more help.My MM712 is Stuck Updating Its Firmware. What Should I Do?If you start the update process and stuck in following windows for a while, please try following instructions to continue the update process.SITUATION 1If you are stuck in the window above, you will need to perform the following steps to continue the update. NOTE: Please DO NOT unplug the dongle during the steps.STEP 1Make sure the MM712 is connected in 2.4 GHz mode with dongle plugged in the PC, as well as unplug the USB cable.STEP 2Toggle the bottom switch from 2.4 GHz mode to Wired mode.STEP 3Toggle back the bottom switch from Wired mode to 2.4 GHz mode.STEP 4After switching back to 2.4 GHz mode, MM712 will start to update the MM712 FW automatically.SITUATION 2If you have stuck in the MM712 firmware"
