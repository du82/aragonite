title = "MasterAir MA824 Stealth CPU Air Cooler | Cooler Master"
description = "Cooler Master is unveiling its flagship air cooler and newest addition to the Stealth Series – the MA824 Stealth. With an impressive 8 heat pipes, dual tower design the MA824 Stealth delivers unmatched performance in it’s class. It carries the Stealth identity with total blackout accents and design. The redesigned dual tower feature 8 Superconductive Composite heat pipes, with dual variable thicknesses for ultra efficient heat dissipation. Upgraded with a 120mm Mobius fan for performance and 43mm of RAM clearance, the staggered Push-Pull setup along with the 135mm performance fan provide absolute cooling. The full coverage nickel plated copper base provide total and seamless contact with the CPU. The MA824 Stealth is bringing performance ready to overshadow it’s competition."
