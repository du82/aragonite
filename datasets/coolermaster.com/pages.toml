title = "Mobius 140P ARGB Case Fan | Cooler Master"
description = "Cooler Master is introducing the Mobius Series representing the performance line of fans with a new entry – Mobius 140P ARGB. The Mobius 140P ARGB utilizes the new Ring Blade Design, with interconnecting fan blades for structural reinforcement, eliminating vibration for even more stability. The angled inner frame rim features chamfered side vents boost airflow with force induced pressure draw for maximum airflow. The sound output has been fine tuned to sub 6dB prominence noise levels for optimal acoustics without performance sacrifice. The Mobius Series fans are engineered for the perfect balance of quiet operation and unmatched cooling capabilities."
full_description = "Home/Cooling/Case Fans/Mobius 140P ARGB Case FanMore Balance, More BurstMobius 140P ARGBRing Blade Design (RBD)Pressure Air AccelerationAbsolute AcousticsLuminescent Light EffectsAddressable Gen 2 RGBPerfecting EngineeringCooler Master’s Mobius140P ARGB is our new series of performance fans. With our enhanced Ring Blade Design, the Mobius Series optimizes both performance and acoustics, catering to a dynamic range of applications from case, liquid or air, to overclocking and intense gaming.Ring Blade Design (RBD)Interconnecting fan blades designed for a reinforced and rigid structure, eliminating vibration for stable and fluid fan operation.Pressure Air AccelerationAngled inner frame rim with chamfered side vents boost airflow draw, maximizing force induced air pressure and diminishing dead air.Loop Dynamic BearingNew loop dynamic bearing design utilizes thick oil coating and lubrication to allow for stable performance.Anti-vibration DamperExclusive Cooler Master color accent dampers diminish vibration and rattling to maintain chassis stability for silent performance.Absolute AcousticsSound output fine tuned to the optimal prominence ratio to achieve sub 6dB noise levels without performance sacrifice.Acoustic Testing Anechoic Chamber for ISO 3745• FFT analyzer: AD-3524 O Microphone: B&K 2235• Sound Pressure: IS0-7779• Sound Power: ISO-7779• Sound Quality: 1S0-532B /ISO• Background noise: below 6dBAOil ReflowThe oil flows back to the sealed bearing to create constant lubrication against friction and increases the life span of the fan.Dust ProofingThe sealed and concave position of the bearing prevents air and dust exposure and ensures a smooth transfer of motion.Anti-sway SystemMagnetic ring prevents bearing shaft from tilting, stabilizing the fan to prevent fan blade obstruction under various orientations, as well as oil spray.ARGB Motherboard CompatibilityAddressable Gen 2 RGB syncs with Cooler Master’s MasterPlus+ software and dedicated controller, allowing customization of individual LED colors, effects, brightness and more – all from an intuitive, convenient interface. (controller sold separately)Download MasterPlus+Tech specificationsDiscover technical info about the productDiscover"
