full_description = "Christine Zaffarano, Esq. Christine Zaffarano is an associate at CopyCat Legal. She was born and raised in South Florida, where she received her Bachelor of Arts in 2010 from Florida Atlantic University in Political Science and Communications. Christine is a 2014 Dean’s List graduate of St. John’s University School of Law. She attended on a full academic scholarship and served on Law Review. She was admitted to the New York Bar in 2015 and the Florida Bar in 2022. Christine is also admitted to the United States District Court for the Middle District of Florida; the United States District Court for the Southern District of Florida; the United States District Court for the Northern District of Illinois; the United States District Court for the Eastern District of New York; the United States District Court for the Northern District of New York; and the United States District Court for the Southern District of New York. Prior to joining the firm, Christine practiced in civil courts for over eight years, including on behalf of the City of New York and the State of Florida prosecuting child welfare matters."
