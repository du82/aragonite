full_description = "Lauren Hausman, Esq. Lauren has been with CopyCat since 2022. She is admitted to the Florida Bar, California bar, the United States District Court for the Southern District of Florida, the United States District Court for the Middle District of Florida, the United States District Court for the District of New Mexico, and the United States District Court for the Central District of California. Lauren is a proud double Gator, having earned a Bachelor of Science in Business Administration – Management, and her Master’s in International Business. She received her juris doctor from Elon University School of Law, graduating magna cum laude and third in her class.Lauren has been published in three law review journals, including the Chicago-Kent Journal of Intellectual Property. During law school, Lauren was the articles editor for the Elon Law Review, a member of Moot Court and overall chair of the Billings, Exum & Frye National Moot Court Competition, a student attorney in the Humanitarian Immigration Law Clinic, a recipient of the McMichael Law and Leadership Fellow Scholarship and was inducted into The Order of the Barristers."
