full_description = "Home Fees Fees Shown below are fees for copyright registration, recordation, and other services. For more information about how the Copyright Office sets these fees, see the Fee Study Page. Registration Registration of a claim in an original work of authorship Electronic filing: Single author, same claimant, one work, not for hire $45 Standard Application $65 Paper Filing (Forms PA, SR, TX, VA, SE) $125 Registration of a claim in a group of unpublished works $85 Registration of a claim in a group of published photographs or a claim in a group of unpublished photographs $55 Registration of a claim in a group of works published on an album of music $65 Registration of a claim in a group of serials (per issue, minimum two issues) $35 Registration of a claim in a group of newspapers, a group of newsletters, or a group of updates to a news website $95 Registration of a claim in a group of contributions to periodicals $85 Registration of a claim in a group of short online literary works $65 Registration of updates or revisions to a database that predominantly consists of non-photographic works $500 Registration for a database that predominantly consists of photographs and updates thereto: Electronic filing $250 Paper filing $250 Registration of a renewal claim (Form RE): Claim without addendum $125 Addendum (in addition to the fee for the claim) $100 Registration of a claim in a restored copyright (Form GATT) $100 Preregistration of certain unpublished works $200 Registration of a correction or amplification to a claim Supplementary registration Electronic filing $100 Paper Filing for correction or amplification of renewal registrations, GATT registrations, and group registrations for non-photographic databases (Form CA) $150 Registration of a claim in a mask work (Form MW) $150 Registration of a claim in a vessel design (Form D/VH) $500 Correction of a design registration: Form DC $100 Retrievals and copies Provision of an additional certificate of registration $55 Certification of other Copyright Office records, including search reports (per hour) $200 Search report prepared from official records other than Licensing Section records (per hour, 2 hour minimum) $200 Estimate of retrieval or search fee (credited to retrieval or search fee) $200 Retrieval of in-process or completed Copyright Office records or other Copyright Office materials: Retrieval of paper records (per hour, 1 hour minimum) $200 Retrieval of digital records (per hour, half hour minimum, quarter hour increments) $200 Miscellaneous Fees Designation of agent under 17 U.S.C. 512(c)(2) to receive notification of claimed infringement, or amendment or resubmission of designation $6 Schedule of pre-1972 sound recordings, or supplemental schedule of pre-1972 sound recordings (single sound recording) $75 Additional sound recordings (per group of 1 to 100 sound recordings) $10 Removal of pre-1972 sound recording from Office's database of indexed schedules (single sound recording) $75 Notice of noncommercial use of pre-1972 sound recording $50 Opt-out notice of noncommercial use of pre-1972 sound recording $50 Issuance of a receipt for a section 407 deposit $30 Removal of PII from Registration Records Initial request, per registration record $100 Reconsideration of denied requests, flat fee $60 Recordation of Documents Recordation of a document, including a notice of termination and a notice of intention to enforce a restored copyright Base fee (includes 1 work identified by 1 title and/or registration number): Paper $125 Electronic $95 Additional transfer (per transfer) (for documents recorded under 17 U.S.C. 205) $95 Additional works and alternate identifiers: Paper (per group of 10 or fewer additional works and alternate identifiers) $60 Electronic: 1 to 50 additional works and alternate identifiers $60 51 to 500 additional works and alternate identifiers $225 501 to 1,000 additional works and alternate identifiers $390 1,001 to 10,000 additional works and alternate identifiers $555 10,001 or more additional works and alternate identifiers $5,500 Correction of online Public Catalog data due to erroneous electronic title submission (per title) $7 Licensing Section services Recordation of a notice of intention to make and distribute phonorecords (17 U.S.C. 115) $75 Additional titles (per group of 1 to 10 titles) (paper filing) $20 Additional titles (per group of 1 to 100 titles) (online filing) $10 Statement of account amendment (cable television systems and satellite carriers, 17 U.S.C. 111 and 119; digital audio recording devices or media, 17 U.S.C. 1003) $50 Recordation of certain contracts by cable TV systems located outside the 48 contiguous states $50 Initial or amended notice of digital transmission of sound recording (17 U.S.C. 112, 114) $50 Processing of a statement of account based on secondary transmissions of primary transmissions pursuant to 17 U.S.C. 111: Form SA1 $15 Form SA2 $20 Form SA3 $725 Processing of a statement of account based on secondary transmissions of primary transmissions pursuant to 17 U.S.C. 119 or 122 $725 Search report prepared from Licensing Section records (per hour, 2 hour minimum) $200 Special services Service charge for deposit account overdraft $285 Service charge for dishonored deposit account replenishment check $500 Service charge for an uncollectible or non-negotiable payment $115 Appeals: First appeal (per claim) $350 Second appeal (per claim) $700 Secure test examining fee (per staff member per hour) $250 Copying of Copyright Office records by staff $12 Special handling fee for a claim $800 Handling fee for each non-special handling claim using the same deposit $50 Special handling fee for recordation of a document $550 Handling fee for extra deposit copy for certification $50 Full-term retention of a published deposit Physical deposit $540 Electronic deposit $220 Voluntary cancellation of registration $150 Matching unidentified deposit to deposit ticket claim $40 Special handling fee for records retrieval, search, and certification services (per hour, 1 hour minimum) $500 Litigation statement (Form LS) $100 Notice to libraries and archives $50 Each additional title $20 Service charge for Federal Express mailing $45 Service charge for delivery of documents via facsimile (per page, 7 page maximum) $1"
