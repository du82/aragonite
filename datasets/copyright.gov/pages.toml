title = "Mailing Address | U.S. Copyright Office"
description = "Mailing Addresses"
full_description = "Contact Form Visitor Information Addresses Home Contact Addresses Addresses General Purpose Address General communications, where services are not requested or a specific address is not required, are mailed to Library of Congress Copyright Office 101 Independence Avenue SE Washington, DC 20559-6000 Most Registration Applications Standard/Single applications: VA, TX, PA, SR, single serial issues; group registration applications: GRUPH, GRPPH, GRCP, group serials, newspapers, newsletters, unpublished works, photographic databases; supplementary registrations for these applications. Applicants are strongly encouraged to file electronic applications through the eCO system; paper applications are permitted for Standard VA, TX, PA, SR, and SE claims, but check the Office's rules for specific application type and applicable deposit requirements. eCO online registration system eco.copyright.gov Registration of Literary Works Registrations for nondramatic literary works should be addressed to Library of Congress Copyright Office-TX 101 Independence Avenue SE Washington, DC 20559-6000 Registration of Serials Registrations for serials should be addressed to Library of Congress Copyright Office-SE 101 Independence Avenue SE Washington, DC 20559-6000 Registration of Visual Arts Works Registrations for visual arts works should be addressed to Library of Congress Copyright Office-VA 101 Independence Avenue SE Washington, DC 20559-6000 Registration of Performing Arts Registrations for works of the performing arts should be addressed to Library of Congress Copyright Office-PA 101 Independence Avenue SE Washington, DC 20559-6000 Registration of Sound Recordings Registrations for sound recordings should be addressed to Library of Congress Copyright Office-SR 101 Independence Avenue SE Washington, DC 20559-6000 Registration of Motion Pictures and Audiovisual Works Registrations for motion pictures and audiovisual works should be addressed to Library of Congress Copyright Office-MP 101 Independence Avenue SE Washington, DC 20559-6000 Request to Reopen Claims Closed as a No Reply Registrations for renewal of copyright should be addressed to Fill out the web form at copyright.gov/forms/reopen.html Registration of Renewal Claims Library of Congress Copyright Office-RE 101 Independence Avenue SE Washington, DC 20559-6000 Preregistration Electronic Only Preregistration page copyright.gov/prereg or eCO online registration system eco.copyright.gov Declaration of Ownership in Musical Works (DOMWs) Copyright Office-DOMW P.O. Box 71537 Washington, DC 20024-1537 Schedules of Pre-72 Sound Recordings Electronic Only Email cover sheet and schedule to [email protected] Notices of Noncommercial Use/Opt-Out Notices Relating to Pre-72 Sound Recordings Electronic Only Email cover sheet and notice to [email protected] Document Recordation Document recordation should be addressed to: Library of Congress Copyright Office-DOC 101 Independence Avenue SE Washington, DC 20559-6000 Registration of Mask Works Registrations for mask works should be addressed to Library of Congress Copyright Office-MW 101 Independence Avenue SE Washington, DC 20559-6000 Searches and Copies of Records of Deposits Requests for searches of registrations and recordations in the completed catalogs, indexes, or other records of the U.S. Copyright Office as well as requests for copies of records or deposits for use in litigation or other authorized purposes should be addressed to U.S. Copyright Office, Records Research and Certification Division, and submitted either electronically, as instructed in the Office's website copyright.gov/rrc, or by mail addressed to Records Research and Certification Division Copyright Office P.O. Box 70400 Washington, DC 20559-0400 Note: The preferred method for submitting request for searches and copies of records or deposits are via email to the appropriate address below: Searches [email protected] Copies of records or deposits [email protected] Time Sensitive Request Requests for expedited service from the Records Research and Certification Division to meet the needs of pending or prospective litigation, customs matters, or contract or publishing deadlines should be submitted electronically by visiting the website copyright.gov/rrc, emailing [email protected], or addressed to Records Research and Certification Division Copyright Office P.O. Box 70400 Washington, DC 20024-0400 NOTE: Notices related to the filing of copyright infringement suits and submitted pursuant to 17 USC 411(a) or 17 USC 508, and requests pursuant to 17 USC 411(b)(2) from district courts to the Register of Copyrights must be submitted electronically to the appropriate address below: Submissions pursuant to section 508 [email protected] Submissions pursuant to section 411(a) or 411(b)(2) [email protected] Online Service Providers Section 512 DMCA Designated Agent Directory No physical submissions permitted Submit online at dmca.copyright.gov/osp/login.html Requests to waive physical address requirement and substitute with P.O. Box in section 512 DMCA Designated Agent Directory U.S. Copyright Office Office of the General Counsel P.O. Box 704000 Washington, DC 20024-0400 Email request to [email protected] Reconsiderations of Refusal to Register First and second requests for reconsideration of refusal to register a copyright, mask work, or vessel hull claim should be addressed to Email request to [email protected] Copyright Office Materials Control and Analysis Division P.O. Box 71380 Washington, DC 20024-1380 Registration of Vessel Designs Registrations for vessel designs should be addressed to Library of Congress Copyright Office-VH 101 Independence Avenue SE Washington, DC 20559-6000 Copyright Acquisitions Copyright acquisitions inquiries should be addressed to Library of Congress Copyright Office-Acquisitions & Deposits 101 Independence Avenue SE Washington, DC 20559-6000 Deposit copies submitted under section 407 of the Copyright Act should be addressed to Library of Congress Copyright Office Attn: 407 Deposits 101 Independence Avenue SE Washington, DC 20559-6000 Deposits Demands Replies to demands for deposits should be addressed to Library of Congress Copyright Office-Acquisitions & Deposits 101 Independence Avenue SE Washington, DC 20559-6601 Replies to Serial demands for deposits should be addressed to Acquisitions & Deposits Serials Library of Congress Copyright Office-Acquisitions & Deposits/SER 101 Independence Avenue SE Washington, DC 20024-0977 Licensing Division Licensing Division inquiries should be addressed to Library of Congress Copyright Office-LD 101 Independence Avenue SE Washington, DC 20559-6000 Notices related to statutory licenses under 17 USC 112, 114, 115, and 119 should be addressed to Copyright Office P.O. Box 70977 Washington, DC 20024-0977 Filings or inquiries related to section 111 licenses should be addressed to Library of Congress Copyright Office 101 Independence Avenue SE Washington, DC 20557-6400 [email protected] Freedom of Information Act Request The Copyright Office's FOIA Requester Service Center is responsible for processing all initial requests submitted pursuant to the FOIA or the Privacy Act. All initial requests must be in writing and sent by mail to Copyright Office P.O. Box 70400 Washington, DC 20024 Freedom of Information Act (FOIA) Appeals General Counsel of the United States Copyright Office Copyright GC P.O. Box 70400 Washington, DC 20024 Special Handling Requests for expedited processing of registrations or for document recordations should be addressed to Copyright Office Materials Control and Analysis Division P.O. Box 71380 Washington, DC 20024-1380 Notices of Termination (standard, nonexpedited processing) Copyright Office-Notices of Termination P.O. Box 71537 Washington, DC 20024-1537 Additional Addresses Requests to remove PII from registration records (registration certificates, copies of applications, recorded documents, recordation certificates, etc.) U.S. Copyright Office Associate Register of Copyrights and Director of Public Information and Education P.O. Box 70400 Washington, DC 20024-0400 Fill out the web form at www.copyright.gov/forms/remove_pii.html Complaints served on the Register of Copyrights pursuant to 17 USC § 411(a) If submission of a request via email is not feasible, please contact the Office of the General Counsel by telephone during normal business hours at 202-707-8380. Email [email protected] Court requests to the Register of Copyrights pursuant to 17 USC § 411(b) If submission of a request via email is not feasible, please contact the Office of the General Counsel by telephone during normal business hours at 202-707-8380. Email [email protected] Court notices to the Register of Copyrights pursuant to 17 USC § 508 If submission of a request via email is not feasible, please contact the Office of the General Counsel by telephone during normal business hours at 202-707-8380. Email [email protected] Notice to Libraries and Archives of Normal Commercial Exploitation or Availability at Reasonable Price Library of Congress U.S. Copyright Office-NLA 101 Independence Avenue SE Washington, DC 20559-6000 Email [email protected]"
