full_description = 'Welcome to the U.S. Copyright Office Welcome to the U.S. Copyright Office Copyright and Artifical Intelligence Report Copyright and Artifical Intelligence Report Read Part 2: Copyrightability The Geography of Copyright Registrations The Geography of Copyright Registrations A new report from the Office of the Chief Economist is now available. El derecho de autor en español El derecho de autor en español Recursos en español para creadores y usuarios de obras protegidas por el derecho de autor. Involucre su creatividad aquí. The Copyright Claims Board (CCB) The Copyright Claims Board (CCB) The CCB is available to resolve copyright disputes of up to $30,000 as an efficient, less expensive alternative to federal court. United States Copyright Office Strategic Plan 2022–2026 United States Copyright Office Strategic Plan 2022–2026 Fostering Creativity and Enriching Culture Previous Next What is Copyright? Learn about the basics of copyright with our new online reference page. Learn More Onsite Service Onsite Services in our offices in Washington, DC, are available by appointment. To submit claims, request certified copies of certificates or copyright deposits, or request searches, visit our Public Information Office by making an appointment here. Copyright Office Reading Room services are available in the James Madison Memorial Building, room LM-463. × Features Search Copyright Records Search our online records, learn about our searching and retrieval services, and view educational videos and materials. Learn More Register Your Works Register your work or learn more about the registration process with the Copyright Office. Learn More Recordation Record transfers of copyright ownership and other documents pertaining to copyright for indexing into our public records. Learn More Copyright Law View current Copyright Law of the United States and related laws contained in Title 17 of the U.S.Code. Learn More Who We Are Learn more about who we are, what we do, and how we can help. Learn More Fees View current fees for registration, recordation, and other services. Learn More Quick Links Copyright and Artificial Intelligence Learn about copyright and artificial intelligence Copyright Small Claims Learn about the Copyright Claims Board Economic Research Learn about economic research on copyright U.S. Copyright Law Title 17 of the U.S. Code Code of Federal Regulations Title 37, Chapter II Compendium of U.S. Copyright Office Practices Third Edition Continuous Development of IT Systems Enhancing systems across the entire Office Music Modernization Act Background and implementation steps Engage Your Creativity Resources for creators Events Upcoming Copyright Office public events News Copyright Office Adjusts Compliance Dates in its Earlier Final Rule Relating to Cable, Satellite, and DART License Reporting Practicess | February 28 U.S. Copyright Office Releases Publication Produced by Group of Economic Scholars Identifying the Economic Implications of Artificial Intelligence for Copyright Policy | February 12 Copyright Office Issues Notice of Inquiry on Issues Related to Performing Rights Organizations | February 10 Copyright Office Releases Part 2 of Artificial Intelligence Report | January 29, 2025 U.S. Copyright Office Announces Webinar on Copyright Essentials for Visual Artists and Photographers | January 27, 2025 News archive { "mediaObjectId": "A18A17AEC2D20094E0538C93F1160094" } The Music Modernization Act This featured video highlights The Orrin G. Hatch-Bob Goodlatte Music Modernization Act (Music Modernization Act) the most significant piece of copyright legislation in decades and updates our current laws to reflect modern consumer preferences and technological developments in the music marketplace. Learn more'
