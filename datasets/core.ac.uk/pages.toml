["https://core.ac.uk/services/recommender"]
title = "CORE Recommender"
description = "A leading research papers recommendation solution"
full_description = "How it worksThe recommender is a plugin for repositories, journal systems and web interfaces that provides suggestions on relevant articles to the one currently displayed. Its purpose is to support users in discovering articles of interest from across the network of open access repositories. We have validated that all recommended articles are free to read and can be accessed without a paywall. Thus, the CORE Recommender increases the visibility of open access content. Being open should pay off! Arthur SmithDeputy Manager of Scholarly Communication (Open Access), Cambridge UniversityCORE Recommender is an essential part of the evolving open infrastructure, which surfaces not just the content in our repository, but the entire open literature. Recommender greatly enhances the functionality of our repository and provides our users with topical open resources that are only a click away."
year_published = 2025
