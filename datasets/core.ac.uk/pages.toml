["https://core.ac.uk/faq"]
title = "FAQs"
description = "Frequently asked questions about CORE"
full_description = '''FAQsJoining COREIndexingMembershipDashboardServicesGeneral informationREF2021 AuditJoining CORE as data providerLast updated 22.02.2024Is my repository or journal indexed by CORE?To check whether your repository or journal is indexed by CORE, go to our data providers list.How do I register my repository or journal with CORE? CORE uses information from various registries, such as OpenDOAR and DOAJ, to include new repositories and journals into CORE. If your repository or journal is already registered with some authoritative registry, you don't need to do anything. If your repository or journal has not been registered yet use the form to add it.Where are the repositories indexed by CORE located?CORE is an international service and indexes repositories from various locations around the world. This information is displayed in a map at our data providers page.I am an author of scientific papers and I would like to include them in CORE. CORE is a indexing service and is not similar to research networking sites, e.g. ResearchGate or Academia.edu, where authors can deposit papers, so please do not email us the full text of your papers. If you have deposited your articles in a repository let us know the name of the repository. There are chances that we index it already and if we don’t we could start indexing it.CORE indexes from DOAJ but I cannot find my journal which is already registered in DOAJ. CORE indexes DOAJ as a single entry, which means that each journal title does not appear separately in CORE. If you wish to have a separate entry for your journal in CORE, do send us the journal's OAI base URL and we will create a new entry.IndexingLast updated 22.02.2024GeneralHow often does CORE index the repositories? CORE does not index all the repositories that exist in our database with the same frequency. Repositories are indexed as frequently as our HW infrastructure allows. The specific time of indexing for a repository is determined by the CORE Scheduler. The CORE Scheduler is a software component that ensures that our indexing cluster of machines is close to fully utilised 24/7 for 365 days every year. As soon as some resource is freed, the CORE Scheduler decides which repository needs to be indexed based on several criteria. These criteria include, but are not limited to, the previous time of the repository being indexed, the size of the repository, the location of the repository, the repository's indexing performance and information about potential previous indexing errors. We review the functionality of the scheduler on a regular basis to ensure that its decisions on what to index next maximise the number of ingested documents over a unit of time.If you have a question regarding a specific repository do get in touch with us.When will the indexing process of my repository be completed? Depending on the size of the repository and the existing traffic in CORE's servers, the indexing can last from a couple of hours to a couple of weeks. If we experience any technical issues during that period, we will get in touch.What types of scientific outputs does CORE provide? CORE indexes all metadata records in a repository, but it is in position to index full text records in PDF only. We are working though to include other file types, such as HTML webpages, images etc.My repository has plenty of metadata records, but not all of them have an open access full text. Can my repository be indexed by CORE? Yes it can, provided that the repository offers its content as Open Access.My repository contains a much higher number of records than CORE. What can I do? Log in to the CORE Repository Dashboard and look under the issues tab. Examine whether CORE has the correct oai base url of your repository or if there are any technical issues listed there. If there are no technical issues or you do not have an account for the CORE Repository Dashboard contact us.There is a mistake in my article, can I upload a new version? CORE works at the level of repositories and cannot update specific records. You can upload the new record into your institutional repository or journal and CORE will synchronise it at the next scheduled re-indexing.There are many new records in my repository. Do I need to notify CORE? No, CORE follows an automated re-indexing process and your repository will be re-indexed at the next automated re-indexing.How is CORE different from Google Scholar? Google Scholar is a search engine containing scholarly research papers but it is not designed to collect information from repository and journal systems. More specifically:Google Scholar crawls and indexes the full text of research papers that can be found on the web, while CORE indexes also the metadata as supplied by the repository opr journal system.The audience is different. Even though CORE has a search engine in the same way as Google Scholar, CORE’s delivers value by making research information machine readable, delivering an open access scholarly infrastructures which others can build on via the CORE API and Dataset.The metadata in the CORE display page are wrong. How can I have them corrected? CORE does not create the metadata, but rather indexes them from its content providers. If the metadata are wrong then contact the repository or journal where you had originally deposited or published your content.Can CORE offer any statistics about the content it indexes? CORE can offer repository or journal full text download statistics per month via the CORE Repository Dashboard. If you do not have access to the Dashboard, you can claim it.Are the research papers offered by CORE peer-reviewed? Yes it does. CORE indexes content from repositories and journals. The first do not perform peer review of the deposited content but the latter do. In some occassions the content deposited in a repository is already published in a journal and is peer-reviewed. In addition, repositories may contain grey literature and these resources are not peer-reviewed.How is the record count in OpenDOAR estimated by CORE? CORE has created definitions with regards to the statistics it provided to OpenDOAR.Metadata: The total number of metadata records with a unique OAI identifier provided by the repository as this appears in the application profile which CORE index - if CORE indexes from the RIOXX endpoint, CORE will provide RIOXX counts instead of Dublin Core counts.Full text: Count of metadata records - as above - with a least one attachment provided by the repository being a pdf file, which a) is publicly downloadable (no-login required or output is not under embargo, etc.) and b) the full text is machine readable, i.e. it has an extractable text not via OCR.Who owns the rights of the content in the CORE collection? CORE does not own any rights of the aggregated content and each resource has its own license, which should be respected by the CORE users.I landed at a CORE URL linking to a full text PDF but the link gives a 404 error. How can I access this output? You cannot access it – a 404 error indicates that the full text has been removed from CORE.My repository contains a mix of OA and non-OA papers. Can I ask CORE to limit indexing only to OA papers? Yes, this is possible. Please contact us and we will enable this for your repository.TechnicalWhat are the technical requirements for being aggregated? In order to realise the data transfer and regular data updates of CORE and your system, CORE uses a variety of protocols to ingest the content. The easiest way to get your content integrated with CORE is the OAI-PMH protocol. If you wish to join CORE get in touch.What is my journal’s/repository’s OAI base URL? OAI base URL looks similar to http://journaldomain.com/cgi/oai2 or http://journaldomain.com/oai/request when homepage URL is http://journaldomain.com. CORE cannot index the journal’s/repository’s content via its webpage URL. If you are not sure whether your journal/repository has an OAI base URL, contact our team and we will provide technical support to you.What is an OAI Identifier? A more technical answer for https://support.core.ac.uk Target audience: repository managers, Technical staff. An OAI Identifier is a unique identifier which distinguishes items in a repository. It “unambiguously identifies an item within a repository; the unique identifier is used in OAI-PMH requests for extracting metadata from the item” The Identifier contains 3 parts, split using: “oai“ : Unique identifier oai. This describes the type of the identifier “website address”: Where the item is hosted. “Unique identifier”: An identifier of the object For example: oai:eprints.gla.ac.uk:129357 oai:digitalcommons.odu.edu:oaweek-1012 oai:oro.open.ac.uk:75049 oai:dspace.stir.ac.uk:1893/24654Not all OAI Identifiers look like this, but they are non-standard and their use is discouraged. OAI Identifiers must follow the URI (Uniform Resource Identifier) syntax. For more information about how OAI Identifiers are formed, visit Specification and XML Schema for the OAI Identifier Format.An OAI identifier is registered but does not resolve. Reasons: -The item has not been indexed by CORE yet -The repository is not yet registered as a CORE data provider. Become a providerHow difficult is it to satisfy the CORE indexing recommendations? We would expect that indexing could take from one hour to a couple of days for a typical repository. In some repository systems, such as EPrints, most of these recommendations are followed by default. Find more details how it works.Which metadata formats does CORE support? We mainly support oai_dc, the mainstream metadata format used in the OAI-PMH Protocol, utilising the Dublin Core vocabulary, a popular vocabulary for bibliographic data. We also support RIOXX, a richer metadata protocol, used mostly by the UK repositories.Can CORE just index our content, but not store it on its servers? To provide its service, it is essential for CORE to be able to store a cached copy of the indexed content. This is needed to verify open access sources, offer analytical services, support text and data mining, recommendation tools, etc. By cashing a copy of the indexed resource, CORE is not different from many commercial and non-commercial, academic and non-academic, search engines including Google or CiteSeerX. The primary difference from such systems is that CORE caches only copies of open access content. More information on the benefits of this approach is available in the “CORE: Three Access Levels to Underpin Open Access” article.How can my repository opt out from being indexed by CORE? CORE uses information from various registries, such as OpenDOAR, to include new repositories, journals and archives into CORE. If the circumstances have changed in your repository, you can restrict indexing and crawling activities by modifying your rules in your “robots.txt” file by using the Standard for Robots Exclusion. This will also guarantee the content cannot be cached by search engines and indexing systems. In addition, you could withdraw your repository from all open access registries lists; when this takes place, please notify us.Removing full text or metadataHow does CORE ensure that the indexed content is Open Access? CORE aggregates content from repositories registered in OpenDOAR, journals registered in DOAJ or those content providers that requested their content to be aggregated. This means that all the content sources aggregated by CORE must be open access as this is a requirement for the providers to be included in these registries. According to the official BOAI definition of open access, CORE is allowed to, "distribute, search, or link to the full texts of articles, crawl them for indexing, pass them as data to software, or use them for any other lawful purpose, without financial, legal, or technical barriers other than those inseparable from gaining access to the Internet itself. The only constraint on reproduction and distribution, and the only role for copyright in this domain is to give authors control over the integrity of their work and the right to be properly acknowledged and cited."CORE indexes copyrighted material from my repository CORE’s system is fully automated and relies on data made available in a machine readable form. If your repository hosts full text with a restrictive license that prohibits indexing, this needs to be properly communicated in a machine readable form. All non open access items should be blocked in the robots.txt file. If this information is provided in the metadata for each record and CORE exposes the full text, please get in touch with us.How can I retrieve the license information (CC-BY, CC-BY-NC, etc.) from the indexes outputs? An output's license is not consistently exposed by content providers in a machine readable form. In some circumstances it may be possible to extract this from the "fulltextUrls" field in the CORE API. However, this is subject to the license the data offered by the data provider.A full text record is deleted from my repository, but is still available in CORE CORE’s system is fully automated and relies on data made available in a machine readable form. Our system understands that the full text of a record was removed only when the record is marked as deleted in the metadata of your repository. See how to take down full text from CORE in the related FAQ.How do I notify CORE to take down full text content? If full text content appears in CORE but not in the hosting service your repository manager can take it down via the CORE Repository Dashboard anytime without notifying us. Alternatively, you can use the update or remove article form.The full text has been removed, but the metadata is still visible in CORE It is a CORE policy to remove only the full text and not the metadata. Only in limited cases - e.g. when a publication did not happen - it is possible that the metadata can be removed. In that case,email us.I have removed an item from my repository, but the metadata are still visible in CORE In order for the metadata to be removed from CORE they need to be marked as "deleted/removed" in the repository. If the metadata are marked as "restricted" CORE will still display it.MembershipLast updated 22.02.2024What is membership of CORE? We founded CORE to provide free indexing, and discovery for institutions. Initially, we were funded to provide these tools, but much of our funding ended in July 2023. As a result, we have created a membership model, with both free and paid membership. Our founding goal remains as before: we index any institutional repository. If you register as a starting member, you can see a freely available dashboard that shows useful information about your repository. We have added optional paid tools that assist in analytics and compliance.Is CORE paid membership worth it? By joining CORE you are supporting the open research community. Moreover, we believe that our paid membership provides tools that save your institution time and money'''
year_published = 2022
year_updated = 2022
