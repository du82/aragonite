full_description = "CookiesYour cookie settingsHow we use cookiesPrivacy noticeHow we use cookiesWe use cookies for several purposes on this website – we’ve listed each of them below with more details about why we use them and how long they’ll last.Essential cookies (cookie settings)We use essential cookies to store your personal preferences. It's required to save the cookie settings.NB: Cookie guidance wording adapted from gov.uk, shared under the Open Government License.Our essential cookiesNamePurposeExpiresessential_cookies_allowedThis helps us to know your cookies preferences and do not show pop-up window on each visit to website 1 yearanalytics_cookies_allowedThis helps us to know you preferences in analytics and tracking user behaviour 1 yearMeasuring website usage (Google Analytics)We use Google Analytics to collect information about how people use our site, and rough demographics as to what groups of people are using our site. We do this to make sure it’s meeting your needs and to understand how we could improve it. You can opt out of Google Analytics tracking.Google Analytics stores information about:the pages you visithow long you spend on each pagehow you got to the sitewhat you click on while you're hereyour broad demographic profile (age range, gender, interests)Google Analytics does not have access to the personal information you provide us (eg your name) so it doesn’t know who you are.Google Analytics cookiesNamePurposeExpires_gaThis helps us count how many people visit the site by tracking if you've visited before 2 years_utmaLike `_ga`, this lets us know if you’ve visited before, so we can count how many of our visitors are new to the site or to a certain page 2 years_utmbThis works with _utmc to calculate the average length of time you spend on the site 30 minutes_utmcThis works with _utmb to calculate when you close your browser when you close your browser_utmzThis tells us how you reached the site (like from another website or a search engine) 6