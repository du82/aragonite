["https://core.ac.uk/privacy"]
title = "Privacy notice"
description = "Explore all CORE services"
full_description = "Privacy noticeHere is an overview about how we process personal data.This page supplements the information provided in The Open University's Privacy Notice.Measuring our visitorsWe collect anonymous statistics to help us improve our site using Google Analytics. We use this data to understand how our site is used and to make it better. You may also opt-out if you wish.Registering for our servicesWhen you register for any of our services, we may request personal information from you such as your name and email address. We use this information to provide the services you requested and for improving them. We may, with your permission, also contact you about other services and products we think you will be interested in.We will never share your personal information, such as your email address, with any third party except when required for the delivery of our own services or where the law requires us to do so. For example, we might need to pass your information to a third party provider to process payments.Updates to this policyWe may update this policy as required by law and as technology changes. We suggest you regularly check this document for the latest changes. We may notify you by email of any changes to this privacy notice.Any more questions?If you have any questions regarding our use of your data or for any other reason, please contact us."
