All this you can do with CORE Services."""
full_description = "CORE ServicesWe deliver services for a wide range of audiences, including researchers, libraries, universities, innovative companies and funders. Process and analyse the largest structured collection of open research with their full texts, manage your research papers, make them more discoverable, and comply with funder mandates. All this you can do with CORE Services.Access to raw dataCORE APIA unique and free API providing real-time machine access to metadata and full texts of research papers in CORE. Recommended for:CompaniesAcademic institutionsResearchersFundersLearn moreCORE DatasetDownload all of CORE data and run processes in your own infrastructure. Perfect for prototyping new methods, data analysis and text mining. Recommended for:CompaniesAcademic institutionsResearchersFundersLearn moreFastSyncKeep an always up to date copy of all CORE data in your infrastructure. Recommended for:CompaniesLearn moreContent discoveryRecommenderThe recommender is a plugin for repositories, journal systems and web interfaces to suggest similar articles. Recommended for:RepositoriesPublishersAcademic institutionsLearn moreDiscoveryAvailable both as a browser extension and a repository plugin, that assists users in finding freely accessible copies of research papers. Recommended for:General publicResearchersAcademic institutionsLearn moreSearchCORE Search is the engine that researchers, scholars, and others turn to for open access papers from around the world and for staying up to date on the latest scientific literature. Recommended for:General publicResearchersAcademic institutionsGo to searchManaging contentCORE MembershipBy being a member, you contribute to help us build a better, fairer, more equitable open research ecosystem for everyone. CORE Membership comes with a range of tools and benefits including technical support, compliance checking, and participation in our community governance. Recommended for:Academic institutionsLearn moreRepository DashboardA service for our data providers. It provides an online interface offering valuable technical information and statistics. Recommended for:Academic institutionsFundersLearn moreOAI identifiersOAI ResolverMake OAI identifiers originating from your repository resolve directly to your repository, turning them into free-to-mint unique persistent identifiers (PIDs) for open access papers. Recommended for:Academic institutionsFundersPublishersLearn moreBespoke contractsConsultancy servicesHelping organisations to analyse and derive value from large amounts of research data, empowering them to understand, interpret and build on new knowledge. Recommended for:CompaniesFundersAcademic insitutionsLearn more"
