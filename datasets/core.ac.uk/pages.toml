["https://core.ac.uk/documentation/oai-resolver"]
title = "OAI resolver"
description = "Explore all CORE services"
full_description = ".pageTitle{ font-size: 24px; line-height: 24px; margin-bottom: 24px; } .subTitle { line-height: 24px; font-size: 24px; font-weight: 500; margin-bottom: 49px; } .textNoSubTitle { margin-top: 73px; } .primeColor { color: #B75400; } .italic { font-style: italic; } .fontRobotoMono { font-family: Roboto Mono; } .oaiLinkBlock { position: relative; margin-bottom: 15px; max-width: 365px; } .oaiLink:after { content: ''; position: absolute; display: block; border: 1px solid #E0E0E0; width: 100%; } .oaiInput { background: #FFFFFF; border: 1px solid rgba(0, 0, 0, 0.12); box-sizing: border-box; border-radius: 2px; width: 520px; height: 48px; } .oaiText { color: #B75400; margin-left: 16px; } .oaiElem { margin: 0 5px; line-height: 48px; }.helperText { color: #9E9E9E; font-size: 14px; line-height: 12px; } .helperText:first-child { margin-left: 5px; } .helperText:last-child{ margin-left: 15px; } .firstPart { margin-left: 20px; } .secondPart { margin-left: 29px; } .el { display: inline-flex; } .firstPart > div { width: 57px; } .secondPart > div { width: 13px; } .el > div { height: 1px; background: #666666; margin: 10px 5px; position: relative; } .el > div:before, .el > div:after { content: ''; position: absolute; width: 5px; height: 5px; border-top-left-radius: 200px; border: 1px solid #666666; border-right: none; border-bottom: none; } .el > div:after { right: -5px; } .right:after { transform: rotate(-180deg); top: -4px; } .left:before { transform: rotate(-90deg); top: -4px; left: -5px; } .left:after { transform: rotate(90deg); } .right:before { left: -5px; } .oaiLink{ color: #b75400; line-height: 36px; font-size: 16px; margin-left: 20px; height: 36px; } .oaiLink:before { content: ''; background: #b75400; width: 4px; height: 36px; position: absolute; display: block; top: 0; left: 3px; } .oaiLink:after{ content: ''; position: absolute; display: block; border: 1px solid #e0e0e0; width: 100%; } .resolverImg { background: url(https://oai.core.ac.uk/images/oai_resolve/explore.png) no-repeat 50% 50%; height: 255px; max-width: 375px; background-size: 100%; } .btnWrapper {display: flex; justify-content: center; align-items: center; margin-top: 24px; max-width: 375px; } .resolverBtn { border-radius: 2px; border: 1px solid #B75400; width: 150px; padding: 8px 16px; color: #B75400; text-align: center; font-size: 14px; font-style: normal; font-weight: 500; line-height: 16px; letter-spacing: 0.175px; } What is an OAI identifier? There is a need for globally unique decentralised persistent identifiers (PIDs) for identifying research outputs resolvable to repositories. An OAI (Open Archives Initiative) identifier is a unique identifier of a metadata record. OAI identifiers are used in the context of repositories using the Open Archives Initiative Protocol for Metadata indexing (OAI-PMH), however, the process by which they are assigned can be, in principle, used more broadly elsewhere.Structure: oai:oro.open.ac.uk : 73739 globally unique OAI Prefix locally unique identifier In comparison to DOIs, OAI identifiers are registered in a distributed rather than centralised manner and there is therefore no cost for minting them. OAI identifiers are persistent identifiers in repositories that declare their level of support for deleted documents in the deletedRecord element of the Identify response as persistent. CORE recommends repositories to provide this persistent level of support.There is no strict format for the identifier apart from it having to be a URI, but a good practice is for it to consist of a globally unique prefix identifying the repository and a suffix that is locally unique to a given metadata record in the repository.The following are examples of OAIs available in COREoai:eprints.gla.ac.uk:129357 oai:digitalcommons.odu.edu:oaweek-1012 oai:oro.open.ac.uk:75049 oai:dspace.stir.ac.uk:1893/24654Why do we need OAI identifiers?OAI Identifiers are viable PIDs for repositories that can be, as opposed to DOIs, minted in a distributed fashion and cost-free, and which can be resolvable directly to the repository rather than to the publisher.This approach has the potential to increase the importance of repositories in the process of disseminating knowledge. CORE provides a global OAI Resolver built on top of the CORE research outputs aggregation system.OAI identifiers do not replace DOIs, but complement them. According to the DOI handbook “Uniqueness (specification by a DOI name of one and only one referent) is enforced by the DOI system. It is desirable that two DOI names should not be assigned to the same thing.” A DOI typically identifies the canonical final version of record (VoR) of a paper. An OAI Identifier a metadata record in a repository. As there often exist multiple copies of a paper across repositories, it is, in fact, desirable that these records identified using an OAI Identifier are linked to a single DOI.OAI ResolverCORE provides a global resolver for OAI identifiers athttps://core.ac.uk/oai_resolverThe RESTful call to resolve an OAI is available at:https://oai.core.ac.uk/< oai-identifier>As CORE aggregates data from repositories from across the globe, it is aware of OAI Identifiers for each repository record across this network. This means that repositories do not need to do anything to register their OAI identifiers to allow the OAI resolver to work on their records apart from making sure that they expose their metadata using OAI-PMH, which is a widely supported functionality.However, we recommend that repositories register for the CORE Repository Dashboard to check that their metadata records are indexed correctly in their entirety. This is an extremely low barrier to adoption with the resolver effectively working out-of-the-box.CORE can resolve any OAI identifier to either a metadata page of the record in CORE or route it directly to the repository page. To route redirection directly to the repository, it is necessary to provide mapping in the CORE Repository page between the OAI prefix of a repository and the currently used URL for the repository metadata record display page/splash. The redirection will change instantly.Find out more in our Open Repositories 2022 article.FAQsWhat is my journal’s/repository’s OAI base URL? OAI base URL looks similar to http://journaldomain.com/cgi/oai2 or http://journaldomain.com/oai/request when homepage URL is http://journaldomain.com. CORE cannot index the journal’s/repository’s content via its webpage URL. If you are not sure whether your journal/repository has an OAI base URL, contact our team and we will provide technical support to you.What is an OAI Identifier? A more technical answer for https://support.core.ac.uk Target audience: repository managers, Technical staff. An OAI Identifier is a unique identifier which distinguishes items in a repository. It “unambiguously identifies an item within a repository; the unique identifier is used in OAI-PMH requests for extracting metadata from the item” The Identifier contains 3 parts, split using: “oai“ : Unique identifier oai. This describes the type of the identifier “website address”: Where the item is hosted. “Unique identifier”: An identifier of the object For example: oai:eprints.gla.ac.uk:129357 oai:digitalcommons.odu.edu:oaweek-1012 oai:oro.open.ac.uk:75049 oai:dspace.stir.ac.uk:1893/24654Not all OAI Identifiers look like this, but they are non-standard and their use is discouraged. OAI Identifiers must follow the URI (Uniform Resource Identifier) syntax. For more information about how OAI Identifiers are formed, visit Specification and XML Schema for the OAI Identifier Format.An OAI identifier is registered but does not resolve. Reasons: -The item has not been indexed by CORE yet -The repository is not yet registered as a CORE data provider. Become a provider"
