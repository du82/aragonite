["https://core.ac.uk/about/research-outputs"]
title = "CORE"
description = "CORE is a service provided by the Knowledge Media Institute, based at The Open University, United Kingdom."
full_description = 'Research outputs by COREWriting about CORE? Discover our research outputs and cite our work. Below we have listed key articles about CORE by the Big Scientific Data and Text Analytics group (BSDTAG).CORE reference articlesCORE aggregation approaches and infrastructureSelected AI/ML papersCORE RecommenderCORE repositories dashboardCORE and download statisticsSupporting research assessment and evaluationFind more our research outputs at Big Scientific Data and Text Analytics group website.find moreCORE vision and missionIf you use CORE in your work, we kindly ask you to cite one of our reference publications.CORE: A Global Aggregation Service for Open Access PapersP. Knoth, D. Herrmannova, M. Cancellieri, L. Anastasiou, N. Pontika, S. Pearce, B. Gyawali and D. PrideIn Nature Scientific Data 10, 366 (2023)This paper introduces CORE, describes CORE’s continuously growing dataset and the motivation behind its creation, presents the challenges associated with systematically gathering research papers from thousands of data providers worldwide at scale and outlines the solutions developed to overcome these challenges. It provides an in-depth discussion of the services and tools built on top of the indexed content and finally examines several use cases that have leveraged the CORE dataset and services. Cite the workFull citationBibTeXFull citation text to copyKnoth, P., Herrmannova, D., Cancellieri, M. et al. CORE: A Global Aggregation Service for Open Access Papers. Nature Scientific Data 10, 366 (2023). https://doi.org/10.1038/s41597-023-02208-w BibTeX text to copy@article{Knoth2023-zi, title = {CORE: A global aggregation service for open access papers}, author = {Knoth, Petr and Herrmannova, Drahomira and Cancellieri, Matteo and Anastasiou, Lucas and Pontika, Nancy and Pearce, Samuel and Gyawali, Bikash and Pride, David}, abstract = {This paper introduces CORE, a widely used scholarly service, which provides access to the world’s largest collection of open access research publications, acquired from a global network of repositories and journals. CORE was created with the goal of enabling text and data mining of scientific literature and thus supporting scientific discovery, but it is now used in a wide range of use cases within higher education, industry, not-for-profit organisations, as well as by the general public. Through the provided services, CORE powers innovative use cases, such as plagiarism detection, in market-leading third-party organisations. CORE has played a pivotal role in the global move towards universal open access by making scientific knowledge more easily and freely discoverable. In this paper, we describe CORE’s continuously growing dataset and the motivation behind its creation, present the challenges associated with systematically gathering research papers from thousands of data providers worldwide at scale, and introduce the novel solutions that were developed to overcome these challenges. The paper then provides an in-depth discussion of the services and tools built on top of the aggregated data and finally examines several use cases that have leveraged the CORE dataset and services.}, journal = {Nature Scientific Data}, volume = 10, number = 1, pages = 366, month = jun, year = 2023, language = {en} } Copy to clipboardCORE: three access levels to underpin open accessP. Knoth and Z. ZdrahalD-Lib Magazine, 18 (11/12)Sets the vision for creating the CORE service, developing global-wide content aggregation of all open access research literature (on top of OAI-PMH protocol for metadata indexing and other protocols). It sets the mission to develop the three access levels (access at the granularity of papers; analytical access; access to raw data) via CORE. Cite the workFull citationBibTeXFull citation text to copyKnoth, P., & Zdrahal, Z. (2012). CORE: three access levels to underpin open access. D-Lib Magazine, 18(11/12). Retrieved from http://oro.open.ac.uk/35755/ BibTeX text to copy@article{oro35755, volume = {18}, number = {11/12}, title = {CORE: three access levels to underpin open access}, author = {Petr Knoth and Zdenek Zdrahal}, year = {2012}, journal = {D-Lib Magazine}, keywords = {digital libraries; open access; technical infrastructure; applications of OA; reuse of OA content; CORE}, url = {http://oro.open.ac.uk/35755/}, abstract = {The last 10 years have seen a massive increase in the amount of Open Access publications in journals and institutional repositories. The open availability of large volumes of state-of-the-art knowledge online has the potential to provide huge savings and benefits in many fields. However, in order to fully leverage this knowledge, it is necessary to develop systems that (a) make it easy for users to discover and access this knowledge at the level of individual resources, (b) explore and analyse this knowledge at the level of collections of resources and (c) provide infrastructure and access to raw data in order to lower the barriers to the research and development of systems and services on top of this knowledge. In this paper, we argue why these requirements should be satisfied and show that current systems do not meet them. Consequently, we present the CORE (COnnecting REpositories) system, a large-scale Open Access aggregation, outlining its existing functionality and discussing the future technical development. We demonstrate how the system addresses the above needs and how it can be applied to the benefit of the whole ecosystem that includes institutional repositories, individuals, researchers, developers, funding bodies and governments.} } Copy to clipboardCORE aggregation approaches and infrastructureFrom open access metadata to open access content: two principles for increased visibility of open access contentP. KnothIn Open Repositories 2013This paper describes the two principles that should be followed to ensure that content can be properly indexed from repositories. This paper could be of great interest to repository managers. Cite the workFull citationBibTeXFull citation text to copyKnoth, P. (2013). From open access metadata to open access content: two principles for increased visibility of open access content. In Open Repositories 2013. Retrieved from http://oro.open.ac.uk/37824/ BibTeX text to copy@inproceedings{oro37824, booktitle = {Open Repositories 2013}, title = {From open access metadata to open access content: two principles for increased visibility of open access content}, author = {Petr Knoth}, year = {2013}, keywords = {open access; aggregation systems; institutional repositories; open repositories; CORE}, url = {http://oro.open.ac.uk/37824/}, abstract = {An essential goal of the open access (OA) movement is free availability of research outputs on the Internet. One of the recommended ways to achieve this is through open access repositories (BOAI, 2002). Given the growing number of repositories and the significant proportion of research outputs already available as OA (Laakso \& Bjork, 2012), it might come as a surprise that OA content is not necessarily easily discoverable on the Internet (Morrisson, 2012; Konkiel, 2012), more precisely, it is available, but often difficult to find. If OA content in repositories cannot be discovered, there is little incentive to make it available on the Internet in the first place. Therefore, not trying hard enough to increase the visibility of OA content would be a lost opportunity for achieving the main OA goals, including also the reuse potential of OA content. In this paper, we build on our experience in finding and aggregating open access content (not just metadata) from repositories, discussing the main issues and summarizing the lessons learned into two principles that, if adopted, will dramatically increase the discoverability of OA content on the Internet and will improve the possibilities of OA content reuse.} } Copy to clipboardCORE: aggregation use cases for open accessP. Knoth and Z. ZdrahalIn 2nd International Workshop on Mining Scientific Publications (WOSP 2013) This paper describes the use cases that must be supported by open access aggregators, it establishes the CORE use case and demonstrates the benefits of open access content aggregators. Cite the workFull citationBibTeXFull citation text to copyKnoth, P., & Zdrahal, Z. (2013). CORE: aggregation use cases for open access. In 2nd International Workshop on Mining Scientific Publications (WOSP 2013). Retrieved from http://oro.open.ac.uk/37823/ BibTeX text to copy@inproceedings{oro37823, booktitle = {2nd International Workshop on Mining Scientific Publications (WOSP 2013)}, title = {CORE: aggregation use cases for open access}, author = {Petr Knoth and Zdenek Zdrahal}, year = {2013}, note = {Held in conjuction with Joint Conference on Digital Libraries (JCDL 2013)}, keywords = {CORE}, url = {http://oro.open.ac.uk/37823/}, abstract = {The push for free online availability of research outputs promoted by the Open Access (OA) movement is undoubtedly transforming the publishing industry. However, the mere availability of research outputs is insufficient. To exploit the full potential of OA, it must be possible to search, discover, mine, analyse, etc. this content. To achieve this, it is essential to improve the existing OA technical infrastructure to effectively support these functionalities. Many of the vital benefits of OA are expected to come with the ability to reuse OA content in unanticipated ways. Access to the OA content must therefore be flexible, yet practical, content-based and not just metadata based. In this demonstration, we present the CORE system, which aggregates millions of OA resources from hundreds of OA repositories and journals. We discuss the use cases aggregationsshould support and demonstrate how the CORE system addresses them, including searching, discovering, mining and analyzing content. We also show how aggregated OA content can be reused to build new applications on top of CORE?sfunctionality.} } Copy to clipboardAggregating Research Papers from Publishers? Systems to Support Text and Data Mining: Deliberate Lack of Interoperability or Not?P. Knoth and N. PontikaIn R. Eckart de Castilho, S. Ananiadou, T. Margoni, W. Peters and S. Piperidis (Eds.) INTEROP2016This paper describes the technical challenges relating to machine interfaces, the interoperability issues on obtaining open access content and the complications of achieving a harmonisation across repositories’ and publishers’ systems. Cite the workFull citationBibTeXFull citation text to copyKnoth, P., & Pontika, N. (2016). Aggregating Research Papers from Publishers? Systems to Support Text and Data Mining: Deliberate Lack of Interoperability or Not? In R. E. de Castilho, S. Ananiadou, T. Margoni, W. Peters, & S. Piperidis (Eds.), INTEROP2016. Retrieved from http://oro.open.ac.uk/46870/ BibTeX text to copy@inproceedings{oro46870, booktitle = {INTEROP2016}, editor = {Richard Eckart de Castilho and Sophia Ananiadou and Thomas Margoni and Wim Peters and Stelios Piperidis}, month = {May}, title = {Aggregating Research Papers from Publishers? Systems to Support Text and Data Mining: Deliberate Lack of Interoperability or Not?}, author = {Petr Knoth and Nancy Pontika}, year = {2016}, keywords = {Interoperability; publishers; standardisation; CORE}, url = {http://oro.open.ac.uk/46870/}, abstract = {In the current technology dominated world, interoperability of systems managed by different organisations is an essential property enabling the provision of services at a global scale. In the Text and Data Mining field (TDM), interoperability of systems offering access to text corpora offers the opportunity of increasing the uptake and impact of TDM applications. The global corpus of all research papers, i.e. the collection of human knowledge so large no one can ever read in their lifetime, represents one of the most exciting opportunities for TDM. Although the Open Access movement, which has been advocating for free availability and reuse rights to TDM from research papers, has achieved some major successes on the legal front, the technical interoperability of systems offering free access to research papers continues to be a challenge. COnnecting REpositories (CORE) (Knoth and Zdrahal, 2012) aggregates the world?s open access full-text scientific manuscripts from repositories, journals and publisher systems. One of the main goals of CORE is to harmonise and pre-process these data to lower the barrier for TDM. In this paper, we report on the preliminary results of an interoperability survey of systems provided by journal publishers, both open access and toll access. This helps us to assess the current level of systems? interoperability and suggest ways forward.} } Copy to clipboardCORE: connecting repositories in the open access domainP. Knoth and Z. ZdrahalIn CERN Workshop on Innovations in Scholarly Communication (OAI7)Cite the workFull citationBibTeXFull citation text to copyKnoth, P., & Zdrahal, Z. (2011). CORE: connecting repositories in the open access domain. In CERN Workshop on Innovations in Scholarly Communication (OAI7). Retrieved from http://oro.open.ac.uk/32560/ BibTeX text to copy@inproceedings{oro32560, booktitle = {CERN Workshop on Innovations in Scholarly Communication (OAI7)}, title = {CORE: connecting repositories in the open access domain}, author = {Petr Knoth and Zdenek Zdrahal}, year = {2011}, note = {Poster Session ID: 53}, keywords = {CORE}, url = {http://oro.open.ac.uk/32560/}, abstract = {This submission reports on the results of the ongoing JISC-funded project CORE (COnnecting REpositories) which aims to facilitate the access and navigation across relevant scientific papers stored in Open Access repositories. This is being achieved by indexing metadata and full-text content from diverse Open Access repositories, applying text mining techniques to discover semantic relations between the articles and representing and exposing these relations as Linked Data. The information about associations between articles will be made publicly available to enable the emergence of a wide range of applications that can exploit the provided data. Within this project, we will demonstrate the usability of the CORE system on two use-cases: (1) Improving the accessibility of content and the navigation capabilities for digital library users, (2) Enabling more ubiquitous access to digital content through smart phones and tablet devices.} } Copy to clipboardConnecting repositories in the open access domain using text mining and semantic dataP. Knoth, V. Robotka and Z. ZdrahalIn Research and Advanced Technology for Digital LibrariesThis paper describes the CORE system in its early stages with a focus on the original idea of the CORE recommender. Cite the workFull citationBibTeXFull citation text to copyKnoth, P., Robotka, V., & Zdrahal, Z. (2011). Connecting repositories in the open access domain using text mining and semantic data. In Research and Advanced Technolo'
