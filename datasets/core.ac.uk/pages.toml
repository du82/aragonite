title = ""
description = "CORE is a service provided by the Knowledge Media Institute, based at The Open University, United Kingdom."
full_description = '''MissionHow it worksGovernanceResearchTeamResourcesContactsWhat is CORE?CORE (COnnecting REpositories) provides a comprehensive bibliographic database of the world’s scholarly literature, collecting and indexing research from repositories and journals. It is, to our knowledge, also the world’s largest collection of full text open access research papers. CORE is a not-for-profit service dedicated to the open access mission and one of the signatories of the Principles of Open Scholarly Infrastructures POSI.We serve the global network of repositories and journals increasing discoverability and preventing misuse of their content; making metadata records uniquely identifiable and resolvable with decentralised PIDs; supporting data providers in adopting good practices by providing tools for metadata validation, content management, enrichment and OA compliance; and facilitating machine access to open research.Our services support a wide range of stakeholders in getting scalable access to our vast and comprehensive collection of data, specifically researchers, the general public, academic institutions, developers, funders as well as companies from a diverse range of sectors including but not limited to innovators, AI technology companies, digital library solutions and pharma.MissionCORE’s mission is to index all research worldwide and deliver unrestricted access for all.In doing so, we:enrich scholarly data using state-of-the-art text and data mining technologies to aid discoverability,enable others to develop new tools and use cases on top of the CORE platform,support the network of open access repositories and journals with innovative technical, solutions and,facilitate a scalable, cost-effective route for the delivery of open scholarship.Recent blog postsLoading...Visit the blogWho is using CORE?Our data and tools power global innovationFind out moreHow it worksCORE indexes research papers from data providers including institutional and subject repositories, preprint servers, and open access and hybrid journals.CORE currently contains 312M open access articles collected from 12K data providers around the world.Become a data providerAll data providersLoading...GovernanceCORE is a community governed service. Our organisational structure reflects the diversity of our stakeholders ensuring our activities are kept in alignment with our mission and community needs. Take part and help shape the future of CORE.Find out moreThe services we offerAccess to raw dataCORE APIDirect access to CORE dataCORE DatasetDownload data in bulkFastSyncStay in sync with COREContent discoveryRecommenderFind related content in COREDiscoveryLocate open access versions of paywalled articlesSearchResearchers engineManaging contentCORE MembershipContribute to help us build a better open research ecosystem for everyoneRepository DashboardMonitor and improve your repository outputOAI identifiersOAI ResolverMonitor and improve your repository outputBespoke contractsConsultancy servicesConsultancy services for usersExplore our servicesOur research outputsDoes your project produce research articles mentioning CORE? If so, please cite our work.Browse research outputsTeamPetr KnothFounder & Head of CORE“Responsible for leading the team, development & research effort, funding and product strategy. Believes in fre...” Show moreVako BatiashviliFull Stack Developer“Full Stack Developer specializing in PHP and JavaScript. Experienced in code optimization, maintenance, and fe...” Show moreValeriy BudkoFull Stack Developer“PHP and JavaScript developer. Performs code optimization and implementation of continuous integration. In his ...” Show moreMatteo CancellieriLead Developer (Backend)“Works on improving and and maintaining CORE services. He is a detail knowledge base of all CORE services. Has ...” Show moreEkaterine ChkhaidzeFront-end developer“Responsible for creating fascinating user interface and transforming design into website. Outside work she enj.