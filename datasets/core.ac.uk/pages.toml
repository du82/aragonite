["https://core.ac.uk/data"]
title = "Powerful dataset of CORE"
description = "CORE aggregates research papers from data providers all over the world including institutional and subject repositories and journal publishers"
full_description = "Data, data, dataCORE provides a comprehensive bibliographic database of the world’s scholarly literature.Our dataset is huge, global, and widely used.CORE is a comprehensive collection of 312M searchable scholarly resourcesCORE indexes metadata and content from a wide range of data providers including institutional, subject and preprint repositories as well as journals.Learn more about the nature of our datasetYou can access the data programmatically and do exciting and powerful things with itCORE APICORE DatasetCORE FastSyncLearn more about machine access to our dataCORE provides access to an estimated 244M free to read full text research papers with 39M full texts hosted directly by COREIt's the biggest collection of open access full texts, making it an unparalleled research tool.Aspiring for completenessWhile other bibliographic databases only include scholarly works with registered DOIs, CORE is able to find and index in addition scholarly works without them. In fact, about half of CORE’s works do not have a DOI. Those works are missing in most other scholarly databases, making CORE truly unique and a necessity for any service that cannot afford to omit important studies.Learn more about the nature of our datasetWe're truly global, aggregating from 12K data providers, in more than 150 countries.And we're used by every country in the world.Learn about how we index data or become a data providerDisclaimer: The exact statistics might differ based on the used CORE service (Search, API, Dataset, FastSync). This is due to the application of different data quality filtering mechanisms across these services."
