["https://core.ac.uk/benefits"]
title = "Benefits"
description = "Data providers joining benefits page"
full_description = "Why joinHow to joinData providers guideFAQsWhy become a data provider?Facilitate access of your scientific research outputs to everyone in the worldJoin NOWLIST OF DATA PROVIDERSData Provider’s GuideThis guide explains to repository managers how to configure their systems for successful indexing by CORE.Go to the guideWhy join the data providers community?Increase your contents’ discoverability and prevent its misuseInclusion in CORE ensures the widest possible dissemination of your open access content, resulting in increased visibility and discoverability of your papers. We achieve this by promoting your content to over 30 million monthly active users of CORE. Your content will be discoverable not just in CORE Search, but also across the open access network, within the systems of hundreds of data providers using the CORE Recommender (such as arxiv.org) and CORE Discovery plugins. We also integrate with PMC LinkOut and there are dozens of mission-driven third-party services that have been built on top of our aggregated data, such as the Pocket Open Access mobile app and the Lean Library discovery service. By cooperating with world-leading plagiarism detection solutions, we also facilitate early-detection and prevention of misuse of content produced by your staff.A study of 21 UK institutions carried out in 2019 showed that when a repository is indexed by CORE, the number of content downloads increases by 15% on average and up to 32% if the repository is well configured for indexing.With millions of monthly active users, it matters to become a data provider and show to the world that your content is indexed.Make your papers uniquelly identifiable and resolvable with PIDsIdentifiers of metadata records indexed by CORE are automatically registered as globally unique persistent identifiers (PIDs). CORE uses for this purpose OAI identifiers that have been almost universaly adopted across the network of open access repositories and publishers. OAI identifiers are viable PIDs for repositories, publishers and archives that can be, as opposed to DOIs, minted in a distributed fashion and cost-free, and that are resolvable directly to the data provider rather than, as is typical with DOIs, to the publisher’s website. As a result, OAIs are highly suitable identifiers supporting the green (self-archiving) route to Open Access, envisaged by the Budapest Open Access Initiative. Data providers are encouraged to freely register their OAI prefix with CORE (using the CORE Dashboard) to benefit from our global OAI Resolver.Assess and contribute to Open Access compliance and FAIRnessIn the context of rapidly increasing open access policies (such as REF, UKRI or Plan S) and best practices (such as FAIR), CORE can improve the understanding of your content’s status and help you prepare analytical reports for research administrators and funders. For example, CORE conducted the UK REF2021 open access audit, verifying when outputs became publicly available as open access.By being included in CORE, your infrastructure contributes to the national and international monitoring of open access content growth and enables the prediction of new trends in scientific disciplines. Join our vast network of interoperable repositories and journals and take advantage of metadata enrichments, e.g. recommendations, DOIs, ORCID iDs, etc.Make your content machine readableOpen access content hosted in repository and journal platforms is typically not easily usable in analytical, text and data mining tasks. However, creators of innovative research tools, funders and researchers themselves frequently need research content in a well-structured machine readable format, a prerequisite for a wide range of use cases, including domain specific research search engines, plagiarism detection, fact checking and misinformation detection, research graphs, rapid systematic reviews, detection of research trends, research assessment, identifying suitable peer-reviewers, recommender systems, innovation engineering, compliance monitoring, etc. CORE provides access to open access content in a machine readable format doing all the heavy lifting with the help of AI. This involves harmonising metadata, cleaning and creating a structured representation of scholarly data.Become a CORE Member and benefit from lots moreAfter joining as a data provider, you will be able to become a CORE Member, giving you many more benefits, such as:Public recognition of your support for key Open Science infrastructure through display of your organisation’s logo and banners within CORE Search and across the CORE ecosystem.Participation in our governance programme.Guaranteed technical support for your repository.Access to the CORE Repository Dashboard loaded with tools for Open Access compliance checking, metadata quality validation, enrichment and assessment of repository health.Access to raw data services for your organisation: CORE API and CORE Dataset.How many data providers have joined CORE?Last quarter819last year1Kall time12KHow to join?Step 1Submit the data provider OAI base URL into the form below.Step 2We will index your content and send an email once completed.Step 3Claim access to the CORE Dashboard to manage your content.Step 4Become a Supporting or Sustaining member to receive even more benefits.Data provider’s guideJoin CORE as a data provider and contribute to the creation of a mutually beneficial ecosystem.We have created a data provider’s guide describing best practices of how to expose metadata to CORE. This guide serves as a reference to our data providers.join nowCORE MembershipCORE is a mission-driven not-for-profit endeavour and a signatory of the Principle of Open Scholarly Infrastructure (POSI) and we rely on the generous support of our members to support and sustain the service.Find out moreCORE DashboardThe Repository Dashboard is a service provided to CORE Members. It offers a range of tools for repository management, content enrichment, metadata quality assessment and open access compliance checking.Find out moreIs my repository or journal indexed by CORE?To check whether your repository or journal is indexed by CORE, go to our data providers list.How do I register my repository or journal with CORE? CORE uses information from various registries, such as OpenDOAR and DOAJ, to include new repositories and journals into CORE. If your repository or journal is already registered with some authoritative registry, you don't need to do anything. If your repository or journal has not been registered yet use the form to add it.Where are the repositories indexed by CORE located?CORE is an international service and indexes repositories from various locations around the world. This information is displayed in a map at our data providers page.See more FAQs"
year_published = 2025
clearnet = "https://core.ac.uk/benefits"
