title = "CORE Membership for data providers"
description = "CORE is a mission-driven and not-for-profit endeavour and we rely on the generous support of our members to support and sustain the service.  Find out how CORE Membership has[ helped other institutions.](https://core.ac.uk/membership#member-experiences)"
full_description = "STARTING for: Organisations who want to get their content indexed in CORE and benefit from increased discoverability (in search, Recommender, Discovery and PMC) and persistent identification (via OAI Resolver), while staying in control of how their content is exposed using the CORE Dashboard. SUPPORTING for: Organisations who want to be widely recognised for their open research. In addition to all the STARTING benefits, this membership also comes with our versions and near-duplicates detection tool, extra visibility for your organisation in the OA network, technical support, CORE API access for your institution and researchers, and a seat on our Board of Supporters. SUSTAINING for: Organisations who want to be seen as open research champions. In addition to all the SUPPORTING benefits, this membership comes with additional tools to help stay compliant with OA policies and FAIR, unlimited technical support, CORE Dataset access for your researchers for text and data mining, and two seats on our Board of Supporters StartingFreeCORE Repository DashboardGet your OAI identifiers resolved to your repositoryCORE DiscoveryCORE SearchCORE RecommenderGeneral supportDownload statisticsRepository Discovery Boost:– PubMed Central (PMC)– Recommended across the repositories networkRIOXX metadata validatorBecome a member SupportingMembership feesAll Starting benefitsPLUSVersions and duplicates detectionRights Retention Strategy (RRS) IdentificationSDG InsightsАPI use for your universityTechnical support (≤5)Logos for your papersLogo bannerMonitor RIOXX compliancecoming soonBoard of Supporters (1 vote)Register your interestUK HEIs can subscribe via the Jisc licence subscriptions manager SustainingMembership feesAll Supporting benefitsPLUSCORE OA Compliance dashboardDataset use for your universityRepository health checkUnlimited and prioritised supportPersonalised bannerPromoted / spotlight / featured articlesHosted or interview style blog post on mission-aligned activitiesBoard of Supporters (2 votes)Register your interestUK HEIs can subscribe via the Jisc licence subscriptions manager"
