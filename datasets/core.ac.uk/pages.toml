title = "CORE Sponsorship"
description = "CORE is a mission-driven and not-for-profit endeavour and we rely on the generous support of our sponsors to support and sustain the service."
full_description = "How to sponsor?We offer five levels of sponsorship enabling organisations to select the most suitable option. In becoming a CORE Sponsor you make a very public statement of support for Open Access and Open Research. Contact usIf you still have some question send us a request and we will be happy to get in touch with you.Register your interest CORE SponsorshipCORE is a mission-driven and not-for-profit endeavour and we rely on the generous support of our sponsors to support and sustain the service.Register your interestdownload our flyerBy becoming a CORE Sponsor you supportOpen scholarly infrastructuresWe provide a worldwide service and are committed to the Principles of Open Scholarly Infrastructure (POSI).Open repositories networkWe support the global open repositories network with innovative technical solutions as an integral part of our mission.Open research communityWe support researchers, academic institutions, developers, funders and other organisations in their Open Access & Open Research mission.Raising scholarly data qualityWe facilitate interoperability and raise quality of scholarly data to align with FAIR principles.How to sponsor?We offer five levels of sponsorship enabling organisations to select the most suitable option. In becoming a CORE Sponsor you make a very public statement of support for Open Access and Open Research.Strategic partnerPlatinumGoldSilverBronzeSponsorship benefitsStrategic partnerStarting from £50Kp.a.Platinum£20,000p.a.Gold£10,000p.a.Silver£5,000p.a.Bronze£2,500p.a.Listing of the sponsor on the CORE donors page together with their sponsorship level.Acknowledgement of the sponsor’s generous support and their sponsorship level in CORE SearchAcknowledgement of support in a CORE communication and/or promotion materialInvited post on CORE blog*Acknowledgement in presentations delivered by the CORE teamListing as a key sponsor on the CORE homepageListing as a strategic partner within the CORE footer of every CORE page right next to The Open University logoAcknowledgement of financial support provided in relevant research papers produced by the CORE team* This cannot be used for advertising and is subject to compliance with CORE's T&Cs. It can be used for addressing topics relevant to open research delivered in a way that engages the open scholarly community.Multi-year discount** PeriodDiscount3 years10%5 years15%**This discount is available for those who sign up for 3 or 5 years. Both annual and single upfront payment invoicing is possible on multiyear subscriptions.Contact usIf you still have some question send us a request and we will be happy to get in touch with you.Register your interest"
