description = "CORE is a service provided by the Knowledge Media Institute, based at The Open University, United Kingdom."
full_description = "Accessibility StatementCommitmentWe want core.ac.uk to be accessible to the widest audience possible, regardless of technology or ability. Thus, we are actively working to increase the accessibility and usability of this site.GuidelinesWe follow the Open University accessibility standards, based on WCAG 2.1, where each point has been selected and rephrased for clarity and briefly explained. You can read about this in greater detail at the Open University web standards pages.Where possible this site has been built using code compliant with W3C standards for HTML and CSS. The site should display correctly in current browsers on Windows, MacOS, Android and iOS.If you use a screen reader to access websites, you may find the following instructions useful: access pdfs with a screen reader.Exceptions and issuesWhile we strive to be as accessible and usable as possible, errors and issues may occur. If you experience any difficulty in using this site then please get in touch."
