["https://core.ac.uk/governance/supporters"]
title = "Board of Supporters"
description = "Explore all CORE services"
full_description = "Community Governed Decisions regarding the future directions of CORE are made based on community feedback and in line with our mission statement, giving the community confidence that we are here to serve open research. Transparent The Board of Supporters is a critical component of CORE’s governance structure. The processes through which members can influence our development roadmap are fully transparent and documented. Inclusive Participation in the Board of Supporters is non-discriminatory. Any data provider is welcome to become our Supporting or Sustaining member and participate in the governance of CORE. While support for open access and open research is growing rapidly, the future of open scholarly infrastructure services, including CORE, is by no means secured. As the number of CORE users has been fast growing, reaching millions of monthly active users and being among the most used open infrastructures globally, so have costs.To sustain CORE as a mission-aligned widely used open scholarly infrastructure, we need both the support and advice of the community of open repositories and journals.Join our Board of Supporters and help shape our future! Bi-annual MeetingsThe board meets every six months to review recent progress, and the CORE operations team estimates time and costs for proposed enhancements. Members state their priority for specific enhancements. Collecting Feedback Any user of CORE can provide suggestions at any time. Working with our members ensures we are always fully aware of the needs of the community. Prioritising Development DirectionsFollowing member feedback, the roadmap for the next six months is determined. In this way, CORE commits resources to the development of functionalities that are most needed. Voting RightsEach board member has voting rights, and can participate in shaping the future development of CORE. Members can post suggestions for the roadmap on an open list, and can vote for items on the roadmap."
