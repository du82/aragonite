full_description = 'Article Takedown Request To remove a paper from CORE, please search for the paper using the search box at the top of this page.When you have found the paper, please enter the URL of the paper from CORE into the form on the right and we will redirect you to the correct page.Put link to the article here:CORE URLSUBMITTypes of links you can use to fill up the CORE URL fieldFor example, suppose you wanted to remove the paper: CORE: aggregation use cases for open access. In the CORE URL box, you may enter one of the following: A outputs page URLhttps://core.ac.uk/outputs/82976757 A fulltext URLhttps://core.ac.uk/download/82976757.pdf Please note that the form does not accept links which start with "https://core.ac.uk/search" and "https://core.ac.uk/works".You can find out more information about deleting articles in the "Removing full text or metadata" section of the FAQs.'
