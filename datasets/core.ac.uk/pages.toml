["https://core.ac.uk/services/consultancy"]
title = "CORE Consultancy"
description = "CORE aggregates (indexes) research papers from data providers from all over the world including institutional and subject repositories, open access and hybrid journal publishers"
full_description = "How it worksWe provide services for organisations of all shapes and sizes: not-for-profit and commercial; small and large; local, national, and international; funders, libraries, publishers, research institutions, infrastructure organisations, startups, and more. We offer collaborative consulting services, designed to encourage contributions from a wide range of stakeholders. From a one-hour conversation about a specific challenge or opportunity, to project co-design and execution, to a long-term partnership, we are here to help your organisation succeed! Machine Learning ModelsDevelop new or provide improvements to existing models to help your organisation. Research Management & BenchmarkingComparative analysis of research strengths to enable benchmarking with peers, reviews of research management, operations and systems. BotevCTO, Iris AI AS“We are integrating the CORE API into our product, IRIS, because so far it is the open access portal that covers almost all open access content, provides easy to integrate API and has a powerful search querying engine. We want to make open access articles more easily accessible and more useful to researchers and the open public and we see the CORE API as a way to speed that up.” William Cullerne BownCEO ResearchResearch.com“The CORE team understand data mining. As an independent company, we had no obvious access to big, diverse scholarly data – a killer in our drive to develop classification algorithms. The CORE repository, available in bulk, was a breakthrough. Now our algorithms outperform even those from huge publishers.”"
