["https://core.ac.uk/governance"]
title = "Governance"
description = "CORE is a community governed service. Our organisational structure reflects the diversity of our stakeholders ensuring our activities are kept in alignment with our mission and community needs. We provide a worldwide service and are committed to the Principles of Open Scholarly Infrastructure [(POSI)](https://openscholarlyinfrastructure.org/posse/)"
full_description = "GovernanceCORE is a community governed service. Our organisational structure reflects the diversity of our stakeholders ensuring our activities are kept in alignment with our mission and community needs. We provide a worldwide service and are committed to the Principles of Open Scholarly Infrastructure (POSI)Advisory BoardAdvises on strategic directionsEnsures mission alignment with the needs of the open research communityBoard of SupportersHelping to identify requirements and prioritise the development roadmapRepresents the interests of the global open repositories and journals network.The Open University Stakeholder GroupAssumes overall financial and legal responsibility for CORE’s obligations.Provides institutional support and resources for CORE (e.g. HR, financial, legal, infrastructure).Research network representativesEnsures relevance and provides guidance on effectively supporting the open research community.CORE Leadership & Management TeamIs responsible for the day to day operation of CORE.Takes operational decisions with guidance from the governance groupsAdvisory BoardBoard of SupportersResearch networkThe Open University Stakeholders group"
