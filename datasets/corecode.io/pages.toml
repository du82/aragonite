["http://corecode.io/uninstallpkg/index.html"]
title = "Mac UninstallPKG - remove unwanted packages from your system"
description = "mac app to uninstall .PKG packages"
full_description = '''UninstallPKG 1.2.2 remove unwanted packages from your Mac UninstallPKG is an application that allows you to completely remove so called "packages" (file-extension .pkg) and all their installed contents from your Mac. UninstallPKG can be used to reclaim precious disk-space by removing unwanted functionality like unused printer drivers or completely remove applications you no longer use. UninstallPKG can also keep your Mac clean by removing left-over files from applications that you have already partially removed manually. UninstallPKG can remove all 37290 files of Office 2016 at once or completely remove things like Java or the Flash plugin. UninstallPKG is also able to clean-up after uninstalling an application by removing it from the Dock and LoginItems and erasing the files it has generated (preferences etc). SAFETY WARNING: Usage is completely at your own risk. Make sure you remove only packages corresponding to applications or functionality you DO NOT WANT TO USE ANYMORE. Never uninstall packages where you do not know for sure what they are doing or providing. UninstallPKG is safer than other un-installers because it never removes files that are used by other packages, but uninstalling packages is still an inherently unsafe operation because packages may be depended on by other non-packaged software you are still using. User Reviews: System Requirements: • macOS 10.14 'Mojave' or later • Localisations: 🇺🇸 English 🇨🇳 Simplified Chinese 🇩🇪 German (Partial Localisation) License & Cost: UninstallPKG is completely free of charge & supported by showing our other apps. Documentation & Support: Technical support for UninstallPKG is no longer available.. Read Me | F.A.Q. | Version History | Privacy Policy Screenshots: Free Download UninstallPKG: ▶ ▶ ◀ ◀ Download Size: 3.2 MB Release Date: 2024-11-06 ´'''
