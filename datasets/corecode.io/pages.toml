full_description = "MKV2ATV 1.4.5 convert MKV videos to Apple TV-compatible MP4s MKV2ATV is an application that can convert video files in the MKV container format to MP4 video files that are playable on the 'Apple TV'. MKV2ATV can convert most common MKV files quickly and has a queue for converting hundreds of files at once. Because MKV2ATV doesn't re-encode the video track, conversion is fast and the resulting video has the exact same high video-quality as the source file. Most subtitles are supported (see F.A.Q.). MKV2ATV can include a 5.1 surround audio track (if available) so you can play your movies in surround sound - when your Apple TV is connected to a 5.1 AC3 capable and compatible receiver. We also have specialized versions for producing files for iOS devices (iPhone & iPad) or the Sony PlayStation 3. User Reviews: System Requirements: • macOS 10.13 'High Sierra' or later License & Cost: MKV2ATV is completely free of charge and supported by showing info about our other apps. Documentation & Support: Technical support for MKV2ATV is no longer available. Read Me | F.A.Q. | Version History | Privacy Policy Screenshots: Free Download MK2ATV: ▶ ▶ ◀ ◀ Download Size: 9.4 MB Release Date: 2021-02-28"
