["https://corecode.io/ssdreporter/index.html"]
title = "Mac SSDReporter - check & monitor your SSD / Flash Storage health"
description = "mac app to monitor SSD health"
full_description = '''SSDReporter 1.6.1 check & monitor your SSD / Flash Storage health SSDReporter is an application that checks the health of your internal Solid State Disks ("SSD" aka "Flash Storage"). Since SSDs have a limited life-time determined by the number of write operations it is important to keep an eye on your SSD status. SSDReporter can warn you by e-mail or on-screen each time the health of your SSD decreases and/or when the health falls below the 'warning' or 'error' thresholds. The current status of your SSDs is also always easily recognizable because SSDReporter changes its icon (optionally in the menubar) from green to yellow (warning threshold) and finally red (error threshold) as the SSD health decreases. Limitations & Compatibility: Only 'internal' SSDs are supported, disks connected via USB & FireWire do not work at all with SSDReporter. eSATA & ThunderBolt connected SSDs may work if the enclosure is S.M.A.R.T.-compatible. SSDReporter works with all internal SSDs that support S.M.A.R.T. in online mode and export useful health/lifetime attributes. SSD models that are known not to work for various reasons include: • a few 2013 and 2014 MacBookAir models contain incompatible 'TOSHIBA' SSDs • many 'Micron' and 'Crucial', 'Mushkin' and 'ADATA' SSDs are incompatible • some 'OCZ' SSDs including the ARC, ONYX, AGILITY4, VECTOR & VERTEX are incompatible (but the TRION works) • most 'OWC' SSDs including the AURA, MERCURY & ELECTRA are incompatible For more information check our Read Me and F.A.Q. and try the free 'Demo' version prior to purchase. User Reviews: System Requirements: • macOS 10.14 'Mojave' or later • At least one compatible internal "Solid State Disk" (SSD) or "Flash Storage" device License & Cost: SSDReporter is completely free of charge & supported by showing our other apps. Documentation & Support: Technical support for SSDReporter is no longer available. Read Me | F.A.Q. | Version History | Privacy Policy Screenshots: Free Download SSDReporter: ▶ ▶ ◀ ◀ Download Size: 5.2 MB Release Date: 2024-11-25 ´'''
