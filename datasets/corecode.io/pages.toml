["https://corecode.io/tableedit/index.html"]
title = "Mac TableEdit - edit spreadsheets in a simple, clean & elegant way"
description = "free mac app to view and edit spreadsheets"
full_description = '''TableEdit 1.4.8 edit spreadsheets in a simple, clean & elegant way TableEdit is a simple, clean & elegant spreadsheet application designed specifically for the Mac. TableEdit features a minimalistic yet intuitive interface and has convenient features like formulae, charts and exhaustive cell styling options as well as comprehensive import & export options. MAC-NATIVE UI: TableEdit has been designed from the ground up to be a simple, fast and convenient spreadsheet. Unlike cross-platform competitors we natively support Mac technologies like autosave, document versioning, iCloud and many more. Navigating and selecting works just as expected in any real Mac-app, with keyboard shortcuts and modifier keys having their usual effect. The defining element of the interface is the toolbar which gives access to the most commonly used options as well as the 'main cell editor'. The main cell editor always displays cell contents unmodified by formatting options or formulae results. The main cell editor also provides easy access for inserting common functions like SUM. TABLE OPTIONS: Your configurable table options allow you to resize the table and enable a 'floating header row' so that you don't lose track of titles when scrolling down. Configurable row-heights allow multiple lines of text in a cell. Furthermore there is support for scaling the whole table or defining alternating row background colors on a global or per-spreadsheet basis. CELL STYLING: You can easily select background colors for your cells and define cell border options with varying thickness, placement and color. There are also exhaustive text setting including color, font and alignment. CELL FORMATTING: TableEdit has many options for controlling how cell content should be displayed in the table. You can opt for customizable date and time formats. Even more options are available for number display - you can control the number of digits, separator, choose scientific or currency display. Or you can go all the way and use the freeform "custom" representation for numbers. FUNCTIONS / FORMULAE: Our world class excel-compatible formula implementation has been tested on over a million formulae and works with the most complex imaginable formulae. In the formula-system there is support for more than hundred of the most-used excel functions. In many cases you can just import a excel file and the formulae will carry over and work as expected. Also you can write Python scripts to define custom functions that can do anything you want. CHARTS / GRAPHS: TableEdit supports different charts and graphs to visualize your data. You can currently select from pie-charts, bar-charts and line-graphs and define colors, styles and various options. You can move charts freely around your document and export them directly to PDF. IMPORT & EXPORT: You can either import CSV and Excel files quickly via drag&drop or use the Import-panel to select more options like the separator or encoding. Exporting to Excel, CSV or PDF is also just a mouse click away. User Reviews: System Requirements: • macOS 10.13 'High Sierra' or later License & Cost: TableEdit is completely free of charge & supported by showing info about our other apps. Documentation & Support: Technical support for TableEdit is no longer available. Read Me | F.A.Q. | Version History | Privacy Policy Screenshots & Videos: Download 'Full' Version: free to download and usedisplays infos about our other apps Download 'Lite' Version: free and open-sourceless features but lighter and faster'''
