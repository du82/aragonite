["http://corecode.io/mailboxalert/index.html"]
title = "Mac MailboxAlert Free - prevent your email inbox from becoming full"
description = "free mac app to check if your email inbox becomes too full"
full_description = '''MailboxAlert 1.1.4 prevent your email inbox from becoming full MailboxAlert is an application that regularly checks whether your email accounts are filled up to their storage limit, which prevents you from receiving mails. MailboxAlert periodically polls your mailboxes and if one of your accounts is filled above its threshold it lets you know with alerts, on-screen notifications and a changed menubar icon. You can enter as many accounts as you want and freely define polling intervals and thresholds. MailboxAlert supports all standards-compliant IMAP email accounts with and without SSL encryption. WHY USE IT: Because a full email inbox means you can't receive any emails anymore, and there is no way to know that this happening (people can't tell you by mail). Usually full mailboxes are only discovered after multiple days or weeks when noticing the distinct lack of incoming mails or someone informs about the problem by phone or personally. Additionally, emails sent to you while the mailbox is full are not automatically resent, which can mean a lot of lost (business) opportunities. TARGET AUDIENCE: MailboxAlert should be used by everyone that does have at least one email account that is not multi-gigabyte (notably GMail) or unlimited (notably Yahoo). Generally all email accounts from Internet Service Providers (ISPs) have very very low storage limits. MailboxAlert is also useful if you have a multi-gigabyte account and actually use that much space. CoreCode has determined in a decade of writing thousands of support emails that about 5 percent of Mac users are unreachable at some point in time because of filled-up mailboxes. Don't let that happen to you - use MailboxAlert. Limitations: MailboxAlert will not work if your e-mail account is secured by 'two factor authentication'. This means you will not be able to use it with either Google's Gmail or Apple's iCloud. However, those services generally provide 'large enough' storage anyway. System Requirements: • macOS 10.10 'Yosemite' or later License & Cost: MailboxAlert is completely free of charge and the source code is licensed under the Open Source "MIT License". Documentation & Support: Technical support for MailboxAlert is no longer available. Read Me | F.A.Q. | Version History | Privacy Policy Screenshots: Download: ▶ ▶ ◀ ◀ • MailboxAlert 1.1.2 for Mac OS X 10.7 & 10.8 [1.4 MB] • MailboxAlert Source Code {@GitHub}'''
year_published = 2025
