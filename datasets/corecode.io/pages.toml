["http://corecode.io/free_apps.html"]
title = "CoreCode - Free Mac Apps"
full_description = '''SMARTReporter protect your data with disk failure prediction SMARTReporter is a free application that can warn you of some hard disk drive failures before they actually happen! It does so by periodically polling the S.M.A.R.T. status of your hard disk drives. S.M.A.R.T. (Self-Monitoring Analysis and Reporting Technology) is a technology built into most modern hard disk drives that acts as an "early warning system" for pending hard disk drive problems. UninstallPKG remove unwanted packages from your system UninstallPKG is a free application that allows you to completely remove/erase/uninstall so called "packages" (file-extension: "pkg") and all their installed contents from your Mac. UninstallPKG can also be used to reclaim precious disk-space by removing unwanted functionality like unused printer drivers or clean-up your Mac by purging apps that you have already partially removed manually. SSDReporter check & monitor your SSD / Flash Storage health SSDReporter is a free application that checks the health of your internal Solid State Disks ("SSD" aka "Flash Storage"). Since SSDs have a limited life-time determined by the number of write operations it's important to keep an eye on your SSD status. SSDReporter can warn you by e-mail or on-screen when the health of your SSD decreases and displays current status via its icon (Dock or Menubar). MKV2MP4 convert MKV videos to more compatible MP4 files MKV2MP4 is a free application that can convert video files in the MKV container format to more compatible MP4 video files. MKV2MP4 can convert most common MKV files very quickly and has a queue for converting hundreds of files at once. Because the video track is not re-encoded, conversion is fast and the resulting video has the exact same high video-quality as the source file. TableEdit edit spreadsheets in a simple, clean & elegant way TableEdit is a simple, clean, elegant & free spreadsheet app designed specifically for macOS. TableEdit features a minimalistic yet intuitive interface and has convenient features like cell formatting, seamless CSV / Excel file import & export as well as exhaustive cell styling options. We've also implemented a comprehensive formulae system and support for visualizing using charts & graphs.'''
