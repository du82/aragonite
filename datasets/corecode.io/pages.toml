["http://corecode.io/musicmaster/index.html"]
title = "Mac MusicMaster – manage and tidy up your digital music collection"
description = "mac app to edit and manage music tags and more"
full_description = '''MusicMaster 1.3.5 manage and tidy up your music library MusicMaster is an application that allows you to perform a number of useful operations on your digital music collection like changing the case of the titles, removing broken files or performing search & replace across all "tags". MusicMaster can operate on your whole Music library, on selected playlists or on folders of music. TAG CAPITALIZATION: The "Tag Capitalization" tools allows you to change the capitalization of the titles (or other tags) of the tracks in your music collection to a number of presets, e.g. capitalize the first character in all words of the tag. SEARCH & REPLACE: The "Search & Replace" tool allows you to perform a search & replace operation within the tags of the tracks of your music collection. For example this tool allows you to replace "Part 2" with "Part II" in the title of every track in your music collection. The tool is particularly powerful because you can also use so called "regular expressions" to perform replacements that are not possible with plain text searches. FILENAME CHANGER: This tool allows you change the actual filenames of your music files, based on the "tags" of your music files. E.g. to make all files have names containing the artist and the title, separated by a hyphen. BROKEN TRACK MANAGER: "Broken tracks" (tracks with an exclamation mark next to them) are files that the Music app can no longer find or play them because they have been moved or deleted after being added to the Music app. The Broken Track Manager allows you to repair these broken tracks by searching for the files (if they have been moved) or remove them from your library (if they have been deleted). PLAYLIST MANAGER: The Playlist Manager allows you to add or remove songs from Music app playlists. This is similar to creating a "Smart Playlist" in the Music app, but allows you operate on normal playlists and also allows to use more and more advanced criteria, e.g. you can add or remove all songs with empty lyrics to a playlist. DATA MOVER: The "Data Mover" tools allows you swap tags with other tags or copy/prepend/append from one tag to another tag. The tool allows you to automatically repair the tags of files that have systematically been mis-tagged. NUMERIC TAG CHANGER: This allows you to change the numeric tags of your music tracks, like play count or rating of the tracks currently selected in Music app. You can either set the tag to a specific numeric value, or subtract or add some numeric value (e.g. increase the play-count of files you've played elsewhere). User Reviews: System Requirements: • macOS 10.15 'Catalina' or later License & Cost: MusicMaster is completely free of charge & supported by showing info about our other apps. Documentation & Support: Technical support for MusicMaster is no longer available. Read Me | F.A.Q. | Version History | Privacy Policy Screenshots: Free Download MusicMaster: ▶ ▶ ◀ ◀ Download Size: 3.0 MB Release Date: 2023-09-06'''
