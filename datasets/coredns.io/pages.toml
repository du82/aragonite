title = "any"
description = "*any* gives a minimal response to ANY queries."
full_description = 'any Source any gives a minimal response to ANY queries. Description any basically blocks ANY queries by responding to them with a short HINFO reply. See RFC 8482 for details. Syntax any Examples example.org { whoami any } A dig +nocmd ANY example.org +noall +answer now returns: example.org. 8482 IN HINFO "ANY obsoleted" "See RFC 8482" See Also RFC 8482. canonical source of this file Description any basically blocks ANY queries by responding to them with a short HINFO reply. See RFC 8482 for details. Syntax any Examples example.org { whoami any } A dig +nocmd ANY example.org +noall +answer now returns: example.org. 8482 IN HINFO "ANY obsoleted" "See RFC 8482" See Also RFC 8482. canonical source of this file'
