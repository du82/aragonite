title = "ipin"
description = "*ipin* - returns IP address and port based on you domain name."
full_description = "ipin Source Home Enable with ipin:github.com/wenerme/coredns-ipin ipin - returns IP address and port based on you domain name. Description ipin returns IP address and port based on you domain name. Your IP address is returned in the answer section, currently only support ipv4, so A record only. The optional port are included in the additional section as a SRV record. ._port.qname. 0 IN SRV 0 0 <port> . Syntax ipin Examples Start a server on the default port and load the ipin plugin. . { ipin } When queried for “192-168-1-1.example.org A”, CoreDNS will respond with: ;; QUESTION SECTION: ;192-168-1-1.example.org. IN A ;; ANSWER SECTION: 192-168-1-1.example.org. 0 IN A 192.168.1.1 When queried for “127-0-0-1-8080.example.org A”, CoreDNS will respond with: ;; QUESTION SECTION: ;127-0-0-1-8080.example.org. IN A ;; ANSWER SECTION: 127-0-0-1-8080.example.org. 0 IN A 127.0.0.1 ;; ADDITIONAL SECTION: _port.127-0-0-1-8080.example.org. 0 IN SRV 0 0 8080 . source of this file"
