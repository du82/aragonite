full_description = "CoreDNS-1.11.4 Release CoreDNS-1.11.4 Release Notes. 2 minute read Modified: 2024-11-22 CoreDNS Authors This release adds some new features and fixes some bugs. New features of note: forward plugin: new option next, to try alternate upstreams when receiving specified response codes upstreams on (functions like the external plugin alternate) dnssec plugin: new option to load keys from AWS Secrets Manager rewrite plugin: new option to revert EDNS0 option rewrites in responses Brought to You By AdamKorcz, Anifalak, Ben Kochie, Chris O’Haver, Frederic Hemery, Grant Spence, Harshita Sao, Jason Joo, Jasper Bernhardt, Johnny Bergström, Keith Coleman, Kevin Lyda, Lan, Lin-1997, Manuel Rüger, Nathan Currier, Nicolai Søborg, Nikita Usatov, Paco Xu, Reinhard Nägele, Robbie Ostrow, TAKAHASHI Shuuji, Till Riedel, Tobias Klauser, YASH JAIN, cedar-gao, chenylh, wmkuipers, xinbenlv, zhangguanzhang Noteworthy Changes core: set cache-control max-age as integer, not float (https://github.com/coredns/coredns/pull/6764) plugin/metadata: evaluate metadata in plugin order (https://github.com/coredns/coredns/pull/6729) plugin/dnssec: dnssec load keys from AWS Secrets Manager (https://github.com/coredns/coredns/pull/6618) plugin/rewrite: Add “revert” parameter for EDNS0 options (https://github.com/coredns/coredns/pull/6893) container: Restored backwards compatibility of Current Workdir (https://github.com/coredns/coredns/pull/6731) plugin/auto: call OnShutdown() for each zone at its own OnShutdown() (https://github.com/coredns/coredns/pull/6705) plugin/dnstap: log queue and buffer memory size configuration (https://github.com/coredns/coredns/pull/6591) plugin/bind: add zone for link-local IPv6 instead of skipping (https://github.com/coredns/coredns/pull/6547) plugin/kubernetes: only create PTR records for endpoints with hostname defined (https://github.com/coredns/coredns/pull/6898) plugin/rewrite: execute the reversion in reversed order (https://github.com/coredns/cored