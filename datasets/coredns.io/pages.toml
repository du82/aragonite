["https://coredns.io/2024/04/24/coredns-1.11.3-release"]
title = "CoreDNS-1.11.3 Release"
description = "CoreDNS-1.11.3 Release Notes."
full_description = "CoreDNS-1.11.3 Release CoreDNS-1.11.3 Release Notes. 2 minute read Modified: 2024-11-22 CoreDNS Authors This release contains some new features, bug fixes, and package updates. Because of the deployment issues with the previous release, all changed features from 1.11.2 have been included in this release. New features include: When the forward plugin receives a malformed upstream response that overflows, it will now send an empty response to the client with the truncated (TC) bit set to prompt the client to retry over TCP. The rewrite plugin can now rewrite response codes. The dnstap plugin now supports adding metadata to the dnstap extra field. Brought to You By Amila Senadheera, Ben Kochie, Benjamin, Chris O’Haver, Grant Spence, John Belamaric, Keita Kitamura, Marius Kimmina, Michael Grosser, Ondřej Benkovský, P. Radha Krishna, Rahil Bhimjiani, Sri Harsha, Tom Thorogood, Willow (GHOST), Yong Tang, Yuheng, Zhizhen He, guangwu, journey-c, pschou Ted Ford Noteworthy Changes plugin/tls: respect the path specified by root plugin (https://github.com/coredns/coredns/pull/6138) plugin/auto: warn when auto is unable to read elements of the directory tree (https://github.com/coredns/coredns/pull/6333) plugin/etcd: the etcd client adds the DialKeepAliveTime parameter (https://github.com/coredns/coredns/pull/6351) plugin/cache: key cache on Checking Disabled (CD) bit (https://github.com/coredns/coredns/pull/6354) plugin/forward: Use the correct root domain name in the forward plugin’s health checks (https://github.com/coredns/coredns/pull/6395) plugin/forward: Handle UDP responses that overflow with TC bit (https://github.com/coredns/coredns/pull/6277) plugin/rewrite: fix multi request concurrency issue in cname rewrite (https://github.com/coredns/coredns/pull/6407) plugin/rewrite: add rcode as a rewrite option (https://github.com/coredns/coredns/pull/6204) plugin/dnstap: add support for “extra” field in payload (https://github.com/coredns/coredns/pull/6226) plugin/cache: fix keepttl parsing (https://github.com/coredns/coredns/pull/6250) Return RcodeServerFailure when DNS64 has no next plugin (https://github.com/coredns/coredns/pull/6590) Change the log flags to be a variable that can be set (https://github.com/coredns/coredns/pull/6546) Bump go version to 1.21 (https://github.com/coredns/coredns/pull/6533) replace the mutex locks in logging with atomic bool for the “on” flag (https://github.com/coredns/coredns/pull/6525) Enable Prometheus native histograms (https://github.com/coredns/coredns/pull/6524) CoreDNS Authors Published: 2024-04-24 and tagged 1.11.3, Notes and Release using 279 words. Related Content CoreDNS-1.12.0 Release – 1 minutes CoreDNS-1.11.4 Release – 2 minutes CoreDNS-1.11.2 Release – 1 minutes CoreDNS-1.11.1 Release – 1 minutes CoreDNS-1.11.0 Release – 2 minutes CoreDNS-1.10.1 Release – 1 minutes CoreDNS-1.10.0 Release – 1 minutes canonical source of this file"
