["https://coredns.io/plugins/whoami"]
title = "whoami"
description = "*whoami* returns your resolver's local IP address, port and transport."
full_description = "whoami Source whoami returns your resolver’s local IP address, port and transport. Description The whoami plugin is not really that useful, but can be used for having a simple (fast) endpoint to test clients against. When whoami returns a response it will have your client’s IP address in the additional section as either an A or AAAA record. The reply always has an empty answer section. The port and transport are included in the additional section as a SRV record, transport can be “tcp” or “udp”. ._<transport>.qname. 0 IN SRV 0 0 <port> . The whoami plugin will respond to every A or AAAA query, regardless of the query name. If CoreDNS can’t find a Corefile on startup this is the default plugin that gets loaded. As such it can be used to check that CoreDNS is responding to queries. Other than that this plugin is of limited use in production. Syntax whoami Examples Start a server on the default port and load the whoami plugin. example.org { whoami } When queried for “example.org A”, CoreDNS will respond with: ;; QUESTION SECTION: ;example.org. IN A ;; ADDITIONAL SECTION: example.org. 0 IN A 10.240.0.1 _udp.example.org. 0 IN SRV 0 0 40212 See Also Read the blog post on how this plugin is built, or explore the source code. canonical source of this file"
