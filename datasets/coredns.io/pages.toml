["https://coredns.io/explugins/pdsql"]
title = "pdsql"
description = "*pdsql* - uses powerdns generic sql as backend."
full_description = '''pdsql Source Home Enable with pdsql:github.com/wenerme/coredns-pdsql pdsql - uses powerdns generic sql as backend. Description pdsql uses PowerDNS generic sql as backend. Use jinzhu/gorm database drivers, supports as many databases as Gorm does. Syntax pdsql <dialect> <arg> { // enable debug mode debug [db] // create table for test auto-migrate } Install Driver pdsql needs db drivers for dialect, to install a driver you need to add an import in plugin.cfg, like pdsql_mysql:github.com/jinzhu/gorm/dialects/mysql pdsql_sqlite:github.com/jinzhu/gorm/dialects/sqlite pdsql_mysql and pdsql_sqlite are meaningless, specified to prevent duplicates. Examples Start a server on port 1053, use test.db as backend. test.:1053 { pdsql sqlite3 ./test.db { debug db auto-migrate } } Prepare data for test. # Insert records for wener.test sqlite3 ./test.db 'insert into records(name,type,content,ttl,disabled)values("wener.test","A","192.168.1.1",3600,0)' sqlite3 ./test.db 'insert into records(name,type,content,ttl,disabled)values("wener.test","TXT","TXT Here",3600,0)' When queried for “wener.test. A”, CoreDNS will respond with: ;; QUESTION SECTION: ;wener.test. IN A ;; ANSWER SECTION: wener.test. 3600 IN A 192.168.1.1 When queried for “wener.test. ANY”, CoreDNS will respond with: ;; QUESTION SECTION: ;wener.test. IN ANY ;; ANSWER SECTION: wener.test. 3600 IN A 192.168.1.1 wener.test. 3600 IN TXT "TXT Here" Wildcard # domain id 1 sqlite3 ./test.db 'insert into domains(name,type)values("example.test","NATIVE")' sqlite3 ./test.db 'insert into records(domain_id,name,type,content,ttl,disabled)values(1,"*.example.test","A","192.168.1.1",3600,0)' When queried for “first.example.test. A”, CoreDNS will respond with: ;; QUESTION SECTION: ;first.example.test. IN A ;; ANSWER SECTION: first.example.test. 3600 IN A 192.168.1.1 source of this file'''
