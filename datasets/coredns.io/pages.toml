["https://coredns.io/explugins"]
title = "External Plugins"
full_description = "External Plugins Out of tree plugins for CoreDNS. A plugin listed here is not automatically endorsed by the CoreDNS team. Issues should be reported to owner(s) of the plugin. Writing Plugins Enabling Plugins When External? Add Yours fanout fanout - parallel proxying DNS messages to upstream resolvers. Source Home k8s_cache k8s_cache is a caching plugin with early refreshes for specified pods Source Home gathersrv gathersrv plugin allows to gather DNS responses with SRV records from several domains (for example k8s clusters) and hide them behind a single common/distributed domain Source Home meship meship allows to resolve decentralized .meship domains Source Home meshname meshname allows to resolve decentralized .meshname domains Source Home multicluster multicluster plugin is an implementation of Multicluster DNS specification. Source Home Maintained by CoreDNS recursor recursor resolves domains using defined IP addresses or resolving other mapped domains using defined resolvers Source Home k8s_event k8s_event - reports CoreDNS status to Kubernetes events. Source Home Maintained by CoreDNS redis redis - enables reading zone data from redis database. Source Home finalize finalize - resolves CNAMEs to their IP address. Source Home kubenodes kubenodes - creates records for Kubernetes nodes. Source Home ebpf ebpf - attach an eBPF XDP program to a specified interface. Source Home rrl rrl - mitigate amplification attacks with response rate limiting Source Home Maintained by CoreDNS mysql mysql - MySQL backend for CoreDNS Source Home warnlist warnlist emits logs and Prometheus metrics when a listed domain is requested. Source Home git git - pull git repositories. Source Home alternate alternate - allow redirecting queries to an alternate set of upstreams based on RCODE Source Home Maintained by CoreDNS k8s_dns_chaos k8s_dns_chaos - enables inject DNS chaos in a Kubernetes cluster for Chaos Engineering. Source Home records records - enables serving (basic) zone data directly from the Corefile. Source Home Maintained by CoreDNS k8s_gateway k8s_gateway - plugin to resolve all types of external Kubernetes resources. Source Home netbox netbox - enables reading zone data from a netbox instance. Source Home mdns mdns - serves ‘.local’ mDNS info over normal DNS. Source Home wgsd wgsd - serves WireGuard peer information via DNS-SD semantics to enable endpoint discovery and NAT traversal. Source Home alias alias - replaces zone apex CNAMEs. Source Home lighthouse lighthouse - facilitate DNS discovery in multi-cluster connected environments. Source Home idetcd idetcd - etcd-based CoreDNS plugin used for identifying nodes in a cluster without domain name collision. Source Home gravwell gravwell - integrate into Gravwell auditing. Source Home amazondns amazondns - enables serving an authoritative name server using Amazon DNS Server as the backend. Source Home kubernetai kubernetai - serve multiple Kubernetes within a Server. Source Home Maintained by CoreDNS redisc redisc - enables a networked cache using Redis. Source Home unbound unbound - perform recursive queries using libunbound. Source Home Maintained by CoreDNS on on - executes a command when a specified event is triggered. Source Home Enabled by default Maintained by CoreDNS dump dump - dumps all incoming queries on standard output. Source Home pdsql pdsql - uses powerdns generic sql as backend. Source Home ipin ipin - returns IP address and port based on you domain name. Source Home demo demo - returns 1.1.1.1 for 172.0.0.0/8 or 127.0.0.0/8 and 8.8.8.8 otherwise Source Home Maintained by CoreDNS example example - prints ‘example’ on every query received. Source Home Maintained by CoreDNS ens ens - serve DNS records from the Ethereum Name Service. Source Home ipecho ipecho - parses the IP out of a subdomain and echos it back as an record Source Home Maintained by CoreDNS: CoreDNS maintainers take care of this plugin. Enabled by default: CoreDNS has this plugin by default."
