["https://www.coredump.ch/2018/03/02/e-voting-in-rapperswil-jona"]
title = "E-Voting in Rapperswil-Jona – Coredump"
full_description = 'Anlässlich des Pilotversuchs zu E-Voting in Rapperswil-Jona haben wir eine ausführliche Stellungnahme geschrieben. Stellungnahme: E-Voting-Pilot in der Gemeinde Rapperswil-Jona Wir vom Verein Coredump legen der Verwaltung des Kantons St. Gallen, der Verwaltung der Stadt Rapperswil-Jona sowie den Schweizer Stimmbürgerinnen und Stimmbürgern dringend nahe, auf E-Voting in naher und ferner Zukunft zu verzichten, solange die fundamentalen Probleme mit der elektronischen Stimmabgabe nicht behoben sind. Vermutlich wird dies nie der Fall sein. Wir befürworten E-Government, nicht jedoch E-Voting. Weitere Informationen finden sich in der oben verlinkten Stellungnahme. One Comment das-g sagt: März 28, 2018 um 13:57 Uhr Inzwischen gibt es eine mir sinnvoll erscheinende parlamentarische Initiative zum Thema: https://www.parlament.ch/de/ratsbetrieb/suche-curia-vista/geschaeft?AffairId=20180420 “Vertrauen in die Abstimmungs- und Wahlresultate als Grundlage der Demokratie sichern” Diese würde das Bundesgesetz über die politischen Rechte https://www.admin.ch/opc/de/classified-compilation/19760323/index.html um folgendes ergänzen: “1 Alle wesentlichen Schritte zur Durchführung von Wahlen und Abstimmungen unterliegen der öffentlichen Überprüfbarkeit. 2 Das Verfahren zur Ermittlung von Wahl- und Abstimmungsergebnissen muss von den Stimm- und Wahlberechtigten ohne besondere Sachkenntnis überprüft werden können.” Damit würde technikneutral (und ohne Technik-Verbot!) ein Vertrauenswürdigkeits-Gebot festgeschrieben, an dem sich herkömmliche und neuartige Stimm- und Wahlverfahren (egal ob persönlich, papieren, postalisch, elektronisch, digital, online oder sonstwie) gleichermassen zu messen hätten. Antworten Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
