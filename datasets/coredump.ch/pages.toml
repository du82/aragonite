["https://www.coredump.ch/2018/01/22/einzug-im-neuen-raum"]
title = "Einzug im neuen Raum – Coredump"
full_description = 'Am Samstag, dem 20. Januar war es soweit! Wir verfrachteten den ganzen Inhalt unseres Hackerspaces in einen Laster und fuhren damit ins Vinora Areal. In diesem Moment findet bereits die erste “Weekly Hacknight” (bei der übrigens auch Gäste herzlich willkommen sind) statt! Erste Hacknight am neuen Ort! Heute sind wir noch mit Aufräumen und Einrichten beschäftigt. Der Umzug verlief nach Plan, der alte Raum war schnell geleert und um 14:00 hatten wir unseren Laster bereits voll beladen. Fast alles eingepackt… …und verladen! Dank tatkräftiger Hilfe unserer Mitglieder und vorgängiger Planung war der Raum ein paar Stunden später mehr oder weniger komplett eingerichtet 3D-Modell mit geplanter Raumaufteilung Eingerichteter Raum Da wir nun doppelt so viele Quadratmeter zur Verfügung haben, fühlt sich der Raum momentan noch ein wenig leer an. Doch das wird sich bestimmt schnell ändern! Wir werden sicher in den nächsten Wochen noch mit Einrichten, Beschildern und Verbessern beschäftigt sein. Besucher (und Neumitglieder) sind trotzdem schon willkommen! Melde dich einfach bei uns 🙂 One Comment Pingback: Werkstattberichte: Neues aus den Fablabs und der Makerszene Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
