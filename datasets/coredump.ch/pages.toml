title = "Gönner und Sponsoren – Coredump"
full_description = "Da die Mitgliederbeiträge unsere Kosten nicht vollständig decken, freuen wir uns sehr über Gönner und Sponsoren! Gönnerschaft Die Gönnerschaft ist ideal wenn du dich nicht als Mitglied verpflichten willst, uns aber trotzdem unterstützen möchtest. Gönner: Ab 10 CHF / Monat Super-Gönner: Ab 20 CHF / Monat 1337-Gönner: Ab 40 CHF / Monat Die Gönnerschaft ist nicht bindend und muss nicht gekündet werden, ganz unkompliziert. Die Bankdaten für einen Dauerauftrag findest du auf der Kontakt-Seite. Sponsoring Wir versuchen auf klassische Sponsoren zu verzichten, um unsere Unabhängigkeit zu wahren. Falls du den Verein unterstützen möchtest, wie wäre es mit dem Sponsoring eines Gfrörli-Sensors?"
