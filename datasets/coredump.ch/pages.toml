title = "Projekt: Seifenhalter – Coredump"
full_description = 'Hier zeige ich ein Beispiel, wie die digitalen Fertigungstechniken von Coredump dazu genutzt werden können, Alltagsprobleme effizient zu lösen. Zu Weihnachten erhielt ich eine Seife als Geschenk. Das Problem war, dass die Schnur in der Seife die Verwendung eines herkömmlichen Seifenhalters erschwerte. Um das Problem zu lösen, habe ich mir einen Haken vorgestellt, an dem die Seife aufgehängt werden kann. Zuerst habe ich einen Halter aus Papier ausgeschnitten. Dann habe ich eine 1-zu-1-Zeichnung mit Bleistift und Papier gemacht. Diese Zeichnung habe ich dann abfotografiert und etwas mit GIMP nachbearbeitet. Anschliessend habe ich in Inkscape das Pixelbild mit einem Vektor nachgezeichnet. Diese .svg konnte ich dann auf dem Lasercutter in 4 mm Birkenholz ausschneiden. Von der Idee bis zum Endprodukt hatte ich rund 30 Minuten. Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
