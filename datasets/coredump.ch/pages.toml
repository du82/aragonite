["https://www.coredump.ch/2018/09/17/ruckblick-eroffnungsfest"]
title = "Rückblick Eröffnungsfest – Coredump"
full_description = 'Mittlerweile ist es rund einen Monat her, seit wir unser Eröffnungsfest hatten. Es ist also höchste Zeit für einen Rückblick! Wir hatten über den Tag hinweg ungefähr 80 Gäste, wobei zur Spitzenzeit 50 Personen anwesend waren. Da der neue Raum mehr als 100 m² Platz bietet und sich die Leute auch nach draussen verteilten, war es trotz der vielen Besucher nie eng. Eröffnungsfest Innenraum Die grössten Highlights waren: Das Buffet Einige Mitglieder des Coredump haben sich heftig ins Zeug gelegt und ein wunderbares Buffet mit Bezug zu nerdigen Themen erschaffen. 🙂 Eröffnungsfest-Buffet Linux-Pinguine “Tux” 1up- und PowerUp-Pilze aus Super Mario Flüssigstickstoff-Glace Wie auch schon am Stadtfest Rapperswil-Jona und am Seenachtfest boten wir wieder an, Glace mit Flüssigstickstoff selber zu mischen. Glace zum Selbermachen! Nach einer kurzen Einführung zur Sicherheit im Umgang mit Flüssigstickstoff wurden sogleich Glaces mit allerlei Geschmacksvarianten hergestellt. Lötkurs Wie auch schon mehrmals am Ferienpass boten wir einen Lötworkshop an. Diese wurden vor allem von Kindern rege besucht. Retro-Games Neben unserem C64, auf dem eine Variante von Flappy Bird und Pacman zum Spielen vorhanden waren, war das selbstgebaute Arcade-System mit Snake ein grosses Highlight! Im Verlauf des Abends wurden regelmässig neue Highscores erreicht und mittels lautem Rufen verkündet 😉 Auch der Counter, welcher nur aus einem Taster und einem Display besteht, wurde rege verwendet! Snake: 223 Flappy Bird: 54 Counter: 17634 Vortrag Zwischendurch erklärte Raphael den interessierten Gästen, was eigentlich genau ein Hackerspace ist und woher der Begriff “Hacker” ursprünglich kommt. Vortrag: Was ist ein Hackerspace? Projektvorstellungen An unserer Plakatwand wurden einige der zahlreichen Coredump-Projekte vorgestellt. Plakatwand Da die meisten der Leute, welche an den jeweiligen Projekten arbeiten, auch anwesend waren, bot sich eine prima Gelegenheit, um ins Gespräch zu kommen und Details zu den Projekten zu erfahren. Zeitungsartikel Da eine Journalistin der Südostschweiz anwesend war (aufgrund eines Hinweis ihres Sohnes, welcher bei uns am Seenachtfest Glace gemacht hatte), erschien kurz später ein Artikel über unser Fest. See You Next Year? Das Eröffnungsfest hat allen Beteiligten viel Spass bereitet, auch wenn die Vorbereitungen teilweise etwas zeitintensiv waren. Wir überlegen uns nun, ob wir jährlich ein Sommerfest durchführen wollen. Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
