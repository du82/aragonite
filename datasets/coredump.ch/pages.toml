["https://www.coredump.ch/der-hackerspace"]
title = "Der Hackerspace – Coredump"
full_description = "Location Unser kombinierter Hacker- und Makerspace ist 120m² gross und befindet sich an der Eichwiesstrasse 4 in Rapperswil-Jona. Erreichbar ist er in 5 Minuten zu Fuss vom Bahnhof Jona oder Blumenau. History Begonnen haben wir im Jahr 2013 an der Spinnereistrasse 2, in einem 17m² grossen Raum. Da der Platz schnell zu knapp wurde, konnten wir im April 2016 in den Sonnenhof umziehen, in einen 50m² grossen Büroraum. Ende 2017 bot sich dann die Gelegenheit, in das Vinora-Areal umzuziehen, und unseren Hackerspace auf über 200m² auszuweiten, wo wir bis im Sommer 2020 blieben. Weil das Gebäude voraussichtlich im 2021 abgerissen wird, entschieden wir uns, vorzeitig zum vierten Mal umzuziehen. Seit September 2020 befindet sich unser Vereinsraum an der Eichwiesstrasse! Wir hoffen, hier eine Weile bleiben zu können. Inventar Unser Inventar / Equipment ist unter https://interna.coredump.ch/inventory/ erfasst. Status Wir implementieren die Space API v0.13: http://status.crdmp.ch"
