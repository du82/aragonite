["https://www.coredump.ch/2017/11/05/rapperswil-jona-kriegt-einen-makerspace"]
title = "Rapperswil-Jona kriegt einen Makerspace! – Coredump"
full_description = 'Good news, everyone! Per Februar 2018 ziehen wir nach Jona um. Im ehemaligen Vinora-Areal entsteht auf 200m² ein kombinierter Hacker- und Makerspace! Wir planen, dort unser Angebot für Vereinsmitglieder und Interessierte weiter auszubauen. Das Vinora-Areal Anfangs 2017 wurde die traditionsreiche Joner Verpackungs-Firma Petroplast Vinora geschlossen. Auf dem Firmengelände soll in Zukunft eine neue Wohn- und Gewerbezone entstehen. Bis es soweit ist, können jedoch noch Jahre vergehen. Bis dahin werden die Räumlichkeiten an Vereine und Privatpersonen vermietet. Das Gelände befindet sich an der Holzwiesstrasse 50, etwa 800m entfernt vom Bahnhof Jona. Unten Links der aktuelle Coredump-Standort im Sonnenhof, oben rechts der neue Standort im Vinora-Areal. Karten-Material © OpenStreetMap contributors Die Räumlichkeiten Im ehemaligen Fabrikgebäude konnten wir uns 100m² Fläche sichern. Hier wird ab Februar der neue Hackerspace entstehen. Der zukünftige Hackerspace Das coole daran: Gleich gegenüber entsteht auf weiteren 100m² bereits jetzt schon ein Makerspace mit voll ausgerüsteter Werkstatt – der einzige im Umkreis von ca. 30km! Der zukünftige Makerspace Ein paar unserer Mitglieder haben letzte Woche tatkräftig mitgeholfen, die erste Wand einzubauen um den Raum so etwas abzutrennen. https://files.coredump.ch/videos/20171026-makerspace-timelapse.mp4 Hier ein paar weitere Impressionen vom Umbau: (Übrigens, für sportbegeisterte: Gleich über uns wurde gestern eine Boulder-Halle eröffnet!) Vereinsstruktur / Angebote Da der Makerspace und wir als Coredump die selben Ziele verfolgen, möchten wir uns langfristig zu einem kombinierten Hacker- und Makerspace zusammenschliessen. Bis zur nächsten Vereinsversammlung im Herbst 2018 sind die zwei Vereine noch separat, arbeiten aber zusammen. Wir planen, Mitgliedschaftspakete anzubieten mit denen du entweder nur beim Coredump Mitglied sein kannst, oder aber als Kombimitglied auch gleichzeitig den Makerspace nutzen darfst! Mehr Infos dazu folgen nächstes Jahr. Bis es soweit ist, finden die Montags-Treffen und alle anderen Coredump-Aktivitäten (soweit nicht anders angegeben) ausser dem Vorbereiten und Einrichten des neuen Raums weiterhin an unserem derzeitigen Standort im Sonnenhof statt. Wir freuen uns auf die grössere Fläche (im Sonnenhof waren es “nur” 50m²) und haben schon viele kreative Ideen, wie wir diese nutzen könnten! Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
