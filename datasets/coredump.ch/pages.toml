["https://www.coredump.ch/der-verein/mitgliedschaft"]
title = "Mitgliedschaft – Coredump"
full_description = "Als Mitglieder in unserem Verein ist jeder willkommen, der sich für kreativen Umgang mit Technik interessiert und die Vereinsziele unterstützen kann. Um als Mitglied aufgenommen zu werden, wende dich an ein Vorstandsmitglied oder sende eine Email an vorstand@coredump.ch. Kosten für Mitglieder Die Mitgliederbeiträge werden benötigt um die Kosten für den Raum und die Einrichtung zu decken. Es gibt verschiedene Mitgliedschafts-Pakete: PaketKosten pro JahrBeschreibungStarter60 CHFAls Einstieg für Studierende oder Nichterwerbstätige, die sich keine CHF 10.–/Mt. leisten können oder wollen.Student120 CHFFür Studierende, Nichterwerbstätige sowie andere Personen mit geringem oder keinem regelmässigen Einkommen.Standard360 CHFFür normal arbeitende Personen mit regelmässigem Einkommen ist dies der Mindestbeitrag.Supporter600 CHFFür alle die das Angebot vom Coredump sehr schätzen und diesen zusätzlich finanziell unterstützen möchten.All‑Inclusive999 CHFDas Luxuspaket: Getränke, 3D-Drucker und Lasercutter sind für den persönlichen Bedarf bei normaler Nutzung kostenlos. Gönnerschaft / Sponsoring Falls du kein Aktivmitglied werden möchtest, aber uns trotzdem unterstützen möchtest, könnte eine Gönnerschaft oder ein Sponsoring interessant für dich sein: https://www.coredump.ch/der-verein/gonner-und-sponsoren/"
