["https://www.coredump.ch/3d-druck"]
title = "3D-Druck – Coredump"
full_description = "Wir haben in unserem Hackerspace seit Anfangs 2015 einen Ultimaker 2 3D-Drucker. 3D-Drucken als Mitglied Der 3D-Drucker steht primär unseren Mitgliedern zur Verfügung, bereits ab 10 CHF (Nichtverdiener) bzw 30 CHF (Verdiener) im Monat kannst du jederzeit den Drucker zu sehr günstigen Preisen benutzen (first come first serve). Druckservice Wir bieten jedoch auch auswärtigen Personen einen Druckservice an. Da die Druckzeit, die Lieferzeit und die Kosten sich stark von Fall zu Fall unterscheiden, solltest du uns per E-Mail an 3d@coredump.ch kontaktieren. Wir melden uns dann möglichst zeitnah bei Dir mit weiteren Infos und den konkreten Kosten. Wir benötigen jeweils folgende Angaben: Anhang oder Link zu gewünschtem 3D-Modell (entweder selber modellieren oder auf Websites wie Thingiverse oder Youmagine herunterladen). Gewünschte Druckgrösse Gewünschte Farbe (wir melden uns dann, ob wir die gewünschte Farbe an Lager haben) So sehen unsere Materialkosten für externe Aufträge aus: Kunststoff (PLA) normal: 14 Rappen pro Gramm Konststoff (PLA) fluoreszierend oder nachtleuchtend: 18 Rappen pro Gramm Generell sind 3D-Drucke sehr leicht, für einen Schlüsselanhänger oder ein kleines Toaster-Ersatzteil kann man beispielsweise mit 5-10 Gramm rechnen. Zusätzlich kommen Auftrags- und Versandkosten: Pro Druck: Bis 5h Druckzeit: 5 CHF 5-20h Druckzeit: 10 CHF Über 20h Druckzeit: 20 CHF Versandkosten: Abholung: gratis Couvert A-Post: 5 CHF Paket B-Post: 10 CHF Paket A-Post: 12 CHF Grundsätzlich solltest du uns ein druckfertiges 3D-Modell schicken, wir bieten generell keine Modellierung an. Falls du aber ein sehr einfaches Objekt brauchst oder eine spannende Idee hast, kannst du uns gerne mit Details per E-Mail kontaktieren. Bezahlung bei Abholung ist uns am liebsten, Postversand ist nach Absprache jedoch auch möglich. Falls du noch irgendwelche Fragen hast, kontaktiere uns einfach unter 3d@coredump.ch. Shop Fertige 3D-Drucke kannst du auch direkt in unserem Shop kaufen. Das Sortiment wird in Zukunft noch ausgebaut werden."
