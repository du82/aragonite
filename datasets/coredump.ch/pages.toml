["https://www.coredump.ch/2020/08/25/ultimaker-2-repair"]
title = "Ultimaker 2+ Repair – Coredump"
full_description = 'After ~4600 printing hours and almost 3.5 km of filament, our trusty old Ultimaker 2+ 3D printer suddenly turned off while heating up for a print. After some initial debugging we removed and inspected the “Ultimainboard” controller PCB. The inspection with our USB microscope quickly revealed the following problem: The component at U6 literally blew up. And apparently our printer was not the only one affected by this. After checking against the schematics / BOM, we identified the chip as the Allegro A4403GEUTR-T 3A switching regulator (1.68$ on Digikey). Some further testing showed that the Schottky diode SSB44-E3/52T at D16 (0.40$ on Digikey) was also destroyed. We also found a few bugs 😄 Once the spare parts arrived from Digikey, we desoldered the two components using our hot-air rework station. Replacing them was a bit tricky, because the regulator is in a QFN package with a big thermal pad that must be well connected to the ground plane. But by using solder paste and some flux and carefully heating the region around the component with the hot air gun, we apparently managed to reflow it properly. Afterwards, only some small corrections with the soldering iron were required. A quick test showed that – after replacing the two parts – the Ultimainboard works again! 🎉 2 Comments Marco sagt: Juli 27, 2022 um 16:27 Uhr My Ultimaker 2 board is also dead. 24V is present but 5V is dead. Can I send the board to you? I don’t have any equipment to repair. greets from germany Antworten Danilo sagt: September 25, 2022 um 20:36 Uhr Hi Marco. Sorry, your comment got caught in the spam filter… We don’t really offer repair services, but the best would be if you ask either an electronics repair company, or visit a hackerspace / makerspace / fablab around you (see https://mapall.space/ for a list of such spaces). With the link to this blogpost, some people should be able to help you. Antworten Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
