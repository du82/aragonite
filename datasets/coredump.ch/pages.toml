["https://www.coredump.ch/2015/10/14/photogrammetrie-evaluation"]
title = "3D-Rekonstruktion Schloss Rapperswil und Photogrammetrie-Software-Evaluation – Coredump"
full_description = 'Vor bald einem Jahr haben wir eine Crowdfunding-Aktion zum Kauf eines 3D-Druckers gestartet. Dank der tatkräftigen Unterstützung von 32 Personen haben wir 214% des Zielbetrages erreicht! Danke nochmals allen Beteiligten. Einige der Belohnungen für die Unterstützer beinhalteten einen 3D-Druck des Schloss Rapperswils. Wir planten zunächst, ein existierendes 3D-Modell als Druckvorlage zu verwenden. Leider stellte sich daraufhin heraus, dass das Modell diverse Fehler aufweist und so nicht druckbar ist. Deshalb haben wir uns daran gemacht, das Schloss selber als 3D-Modell zu erfassen. Das Geometa Lab am IFS der HSR hat uns dabei freundlicherweise unterstützt. Die Dokumentation soll zeigen, wie man ausgehend von Luftaufnahmen zu 3D-Modellen und Orthofotografien kommt, inklusive einer Beschreibung des Workflows, der Tools etc. Die fertige Dokumentation kann hier heruntergeladen werden. 3D-Rekonstruktion Schloss Rapperswil Als Erstes mussten wir viele Fotos des Schlosses von allen Seiten machen. Dafür hat uns Michael Suter von lightmoment.ch mit seinem Quadrokopter unterstützt. Mithilfe des Quadrokopters und einer kompakten Kamera haben wir ca. 2200 Fotos des Schlosses gemacht. Aus diesen Bildern wurde dann mithilfe diverser Tools (VisualSFM, MeshLab, Blender, Cura, etc) und viel manueller Arbeit ein 3D-Modell erzeugt. Unterstützt wurden wir dabei beim Mesh-Rework von der Firma Drei-De aus Rapperswil. 3D-Druck Das Modell des Schlosses haben wir dann auf unserem Ultimaker 2 etwa 15 mal ausgedruckt und unseren Unterstütztern geschickt. Das Ausdrucken eines Modells in der Grösse von ca. 10cm³ dauert etwa 11 Stunden. Falls du gerne selbst ein solches 3D-Schloss haben möchtest, kannst du es in unserem Shop kaufen oder herunterladen zum Selberdrucken. Dokumentation Wir haben den gesamten Prozess der 3D-Rekonstruktion in einem technischen Bericht festgehalten. Du kannst diesen Bericht vom Server der HSR oder direkt von unserem Server herunterladen. Alle verwendeten Rohdaten sowie die Resultate findest du auf photogrammetry.coredump.ch. Die Lizenz steht jeweils in der README-Datei. Über Feedback würden wir uns natürlich jederzeit freuen 🙂 Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
