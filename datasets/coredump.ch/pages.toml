title = "Rückblick Repair Day – Coredump"
full_description = 'Das erste Repair Café im Coredump war ein voller Erfolg! Insgesamt vierzehn Gegenstände wurden zur Reparatur zu uns gebracht: Zwei Rasiergeräte, eine Jacke, ein Tablet, ein Drucker, eine Taschenlampe, zwei Nespresso-Maschinen, ein Dünger-Streuwagen, ein Rollkoffer, ein paar USB-Kabel, ein Smartphone-Display, ein Handmixer und ein Topfdeckel. Zehn davon konnten dank Mithilfe durch insgesamt 11 Reparateurinnen und Reparateure erfolgreich repariert und vor der Mülltonne gerettet werden. Und natürlich gab es neben den Reparaturen auch Kaffee, Gipfeli und selbstgebackenen Kuchen. Der Tag hat Spass gemacht und das Feedback der Besucher war äusserst positiv! So freuen wir uns darauf, nächstes Jahr am Reparaturtag voraussichtlich erneut ein Repair Café durchzuführen. Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
