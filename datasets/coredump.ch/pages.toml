["https://www.coredump.ch/2016/06/27/fairphone-1-power-button-reparatur"]
title = "Fairphone 1 Power-Button-Reparatur – Coredump"
full_description = 'Das Fairphone 1 eines unserer Mitglieder war kurz davor, das Zeitliche zu segnen: Der Power-Button versagte den Dienst und funktionierte nicht mehr richtig. Heutiger Konsumgeist würde ja diktieren, das inzwischen 2-jährige Gerät schleunigst zu entsorgen und sich einen Ersatz zu kaufen. Ein Hinweis in der Fairphone-Community brachte uns jedoch darauf, dass der Power-Button für das Galaxy Note GT-N7000 mit dem des Fairphone 1 identisch ist. Für 1.69€ konnten wir deshalb mit etwas Löt-Skills eines anderen Mitgliedes die Lebensdauer des Smartphones verlängern! Der originale Button Button abgelötet Button abgelötet Button ist ersetzt! Der neue Knopf funktioniert wieder einwandfrei. Recycling statt Wegwerfgesellschaft! 3 Comments Tobias sagt: April 29, 2018 um 15:07 Uhr Wow, it worked. I was skeptical because I saw a video from another smartphone, where it needed a long time to get the old button removed, because of additional glue. But here the button went off quite easy, when heating the solder with the soldering iron and pressing against the button with a toothpick. And also the new button was easy to mount, by laying it on the board and then let the solder float in from the sides. Me and my son had fun and now I can rescue the data from my fairphone to my new smartphone. Thank you very much for the encouragement through this post. Tobias Antworten Philipp sagt: Oktober 27, 2020 um 19:04 Uhr Dank euer beider Hilfe – also den Hinweis auf die Baugleichheit des Knopfes im Text und den Tipp mit dem Zahnstocher – habe ich gerade den Aus-An-Schalter meines Fairphones ausgetauscht. Es lädt jetzt. Ich bin mal gespannt, ob ich den Schalter nicht durch zu viel Hitze zerstört habe. Schönen Gruß Philipp Antworten Danilo sagt: Oktober 27, 2020 um 21:24 Uhr Cool, viel Erfolg! 🙂 Antworten Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
