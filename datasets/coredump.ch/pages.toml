["https://www.coredump.ch/2015/01/10/ein-3d-drucker-fur-rapperswil-jona"]
title = "Ein 3D-Drucker für Rapperswil-Jona! – Coredump"
full_description = '3D-Druck ist dabei, die Art, wie wir Produkte herstellen, zu revolutionieren. Brauchst du einen Türstopper oder einen Kleiderhaken? Du kannst dir einen aus dem Internet herunterladen und ausdrucken. Ist ein Plastikteil am Toaster abgebrochen? Du musst deswegen keinen neuen Toaster mehr kaufen, druck dir einfach ein Ersatzteil. Egal ob Eiskratzer, Kabel-Halter, ein Gitarren-Plektrum, Drohnen, Spielzeug, Lampen, Yoda-Stiftehalter oder Kunst – alles wird durch 3D-Druck ermöglicht. Während 3D-Drucker in den Medien schon sehr präsent sind, haben sie sich in Privathaushalten noch nicht flächendeckend durchgesetzt. Für die meisten Personen sind die Anschaffungskosten von ca. 1500–5000 Franken zu hoch. Wir möchten deshalb als Verein einen 3D-Drucker beschaffen und diesen der Bevölkerung von Rapperswil-Jona zur Verfügung stellen. Zum Einen wird der Drucker unseren Mitgliedern zur Verfügung stehen, daneben möchten wir aber auch einen 3D-Druckservice anbieten. Weitere Details, sowie eine Möglichkeit dieses Projekt zu unterstützen, findest du auf unserer Wemakeit-Seite. Wir sind dankbar für jede Unterstützung. Es lohnt sich! https://wemakeit.com/projects/3d-drucker-fuer-rapperswil Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
