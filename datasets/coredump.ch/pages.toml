["https://www.coredump.ch/2023/08/02/verbesserungstag-2023"]
title = "Verbesserungstag 2023 – Coredump"
full_description = 'Immer wieder mal hörte man im Coredump Aussagen wie z.B. “hier sollte man mal aufräumen”, “es wäre cool, wenn wir das Werkzeug besser organisieren könnten”, “hier ist zu wenig Platz” oder “den Lasercutter sollte man besser nicht am Verlängerungskabel betreiben”. Um diese Ideen nicht nur immer vor uns herzuschieben, sondern auch mal umzusetzen, haben wir am 1. August spontan den ersten Coredump-Verbesserungstag durchgeführt. Brainstorming und Ideensammlung Wir trafen uns am Mittag zu sechst im Space und führten zuerst mal eine Brainstorming-Session durch: Die zwei Räume wurden in je 4 Quadranten aufgeteilt, und wir überlegten uns zu jeder Ecke, was man hier verbessern könnte. Die gesammelten Ideen notierten wir. Anschliessend ging’s an die Umsetzung! Jeder wählte aus der Liste etwas aus, und begann mit der Arbeit. Nachfolgend einige Dinge, die dabei verbessert wurden. Demontage Spraykabine Die ehemalige Spraykabine stand seit mehreren Monaten mitten im Makerspace und verbrauchte viel Platz. Nach kurzer Diskussion entschieden wir uns, sie zu demontieren und das Material anders zu verwerten. Die Spraykabine wird auseinandergeschraubt. Nun hat’s wieder viel mehr Platz! Nach der Demontage wirkt der Raum plötzlich wieder massiv grösser, und wir haben mehr Platz zum Arbeiten 🙂 Eigene Steckdose für Lasercutter Der Lasercutter war bisher an einem Verlängerungskabel, welches quer durch den Raum verlief, eingesteckt. Diese eigentlich provisorische Lösung war inzwischen zum “providurium” geworden und musste durch eine eigene Steckdose ersetzt werden. An unserer Unterverteilung war sogar noch eine Phase frei, und so machten wir uns an’s Verlegen des Kabels. Entlang der Holz-Kabine installierten wir noch zwei Abzweigdosen für zukünftige Erweiterungen. Der geöffnete Unterverteiler Kabel in Kabelkanal einziehen, Teil 1 Kabel in Kabelkanal einziehen, Teil 2 Kabelrohre an die Decke schrauben Installation Abzweigdosen für zukünftige Erweiterungen Die Laser-Steckdose! Die Glaswolle der Deckenplatten hat zwar in der Haut viele unangenehm juckende Spuren hinterlassen, aber dafür ist nun endlich auch der Laser sauber verkabelt und wir brauchen das Verlängerungskabel nicht mehr! ⚡ Optimierung Metall-Ecke In der Metall-Ecke mit Drehbank und Fräse war noch zu wenig Platz für Werkzeuge. Wir schraubten eine der ehemaligen Spraykabinen-Wände hin und bauten einige Werkzeughalterungen für die Fräser. Zudem wurde die Arbeitsbeleuchtung an der Fräsmaschine montiert und angeschlossen. Bau der Fräser-Halterung Wo man arbeitet, fliegen Späne! Die Werkezughalterung Metall-Ecke mit der neuen Werkzeugwand Aufräumen Materiallager Das Materiallager war ziemlich unordentlich, vieles wurde bei unserem Einzug mal irgendwo eingeräumt und danach nie mehr berührt. Wir machten eine Inventur, ordneten den Inhalt der Regale neu an und entsorgten viele Dinge. Das Resultat sieht viel ordentlicher aus, und wir haben plötzlich auch wieder freien Platz im Regal! Das aufgeräumte Materiallager Ein Teil des zu entsorgenden Materials Reparatur Holz-Kabinen-Türe Die Türe in den Holz-Raum klemmte schon seit langem. Nach einigen Optimierungen geht sie nun perfekt auf und zu! (Leider kein Foto.) Montage Feuerlöscher Der Feuerlöscher hat nun einen festen Standort erhalten und wurde an der Wand montiert. (Leider ebenfalls kein Foto.) Druckluftverteilung Wir haben mit der Installation der Druckluftverteilung begonnen. Sie ist zwar noch nicht fertig, sollte uns aber an mehreren Orten den Zugang zum Luftkompressor ermöglichen. Möglicherweise können wir auch den Air Assist des Lasercutters damit “belüften”. Konfektionierung und Installation des Luft-Schlauchs Das Zwischen-Resultat Fazit Der erste Verbesserungstag war sehr erfolgreich! Wir konnten vieles verbessern, und haben beim Aufräumen des Lagers Sachen entdeckt, von denen wir nicht mal mehr wussten, dass wir sie besitzen 😄 Vielen Dank an alle, die dabei mitgeholfen haben. Der Raum ist aber natürlich noch lange nicht “fertig”, und wird es auch nie sein. Alle Mitglieder (oder Gäste!) dürfen sich gerne daran beteiligen, um unseren Vereinsraum immer cooler einzurichten. Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
