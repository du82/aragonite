["https://www.coredump.ch/2019/10/14/age-of-empires-ii-lan"]
title = "Age of Empires II LAN – Coredump"
full_description = 'Wer erinnert sich noch ans Jahr 1999? Ich selber war knapp 10 Jahre alt und hauptsächlich mit der Primarschule beschäftigt. An was ich mich aber gut erinnern mag, war das Erscheinen von Age of Empires II – The Age of Kings im deutschsprachigen Raum am 28. Oktober 1999! Nur schon der Trailer dazu war atemberaubend! Das Gameplay war eine echte Verbesserung zum Vorgänger und auch heute spiele ich das Spiel noch gelegentlich, meistens mittels Wine unter Linux. Mittlerweile sind verschiedene Remakes des Spiels erschienen, unter anderem der Community-Mod Age of Forgotten Empires, welcher schlussendlich zu Age of Empires II – HD Edtion führte, oder der Voobly Mod, welcher sich vor allem im kompetitiven Bereich von AoE 2 verbreitet hat. Doch genug des Schwelgen in Erinnerungen! Da AoE 2 am 28. Oktober 2019 20 Jahre alt wird, wollen wir das mit einer entsprechenden LAN-Party im Coredump feiern! Wir laden euch also alle herzlich ein, uns am 28. Oktober im Coredump zu besuchen um ein wenig in den alten Zeiten zu schwelgen. Anmelden (mit Pizzabestellung) könnt ihr euch via E-Mail (siehe https://www.coredump.ch/kontakt/) oder einfach im Pad direkt eintragen. Ihr dürft natürlich auch gerne einfach spontan vorbeischauen. Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
