["https://www.coredump.ch/der-verein"]
title = "Der Verein – Coredump"
full_description = "Der Verein Coredump in Rapperswil-Jona wurde am 26. August 2013 von fünf HSR-Studenten aus den Studienrichtungen Informatik und Elektrotechnik gegründet. Das Ziel des Vereines ist der Betrieb eines Hackerspaces in Rapperswil. Ein Hackerspace ist ein Raum oder Gebäude, in dem sich an Wissenschaft, Technologie oder digitaler Kunst (und vielen anderen Bereichen) Interessierte treffen und austauschen sowie an gemeinsamen Projekten arbeiten können. Mehr Informationen zu verschiedenen Hackerspaces weltweit gibt es auf http://hackerspaces.org/. Der Begriff Hacker wird dabei gemäss der ursprünglichen Deﬁnition verwendet. Er bezeichnet nicht etwa Kriminelle, welche in fremde Computernetze eindringen, sondern Technikenthusiasten, welche sich kreativ und intensiv mit Technologie auseinandersetzen. Die zwei Ziele des Vereins gemäss Vereinsstatuten sind: Bereitstellung der Infrastruktur zur Arbeit an nicht-kommerziellen technischen Projekten. Förderung des Informationsaustausches an regelmässigen Treffen, speziell im Bereich der Technologie. In unserem Hackerspace möchten wir einerseits die Möglichkeiten und das Umfeld zur Umsetzung von interessanten Projekten anbieten, andererseits auch den Austausch von Wissen fördern. Dies kann regelmässige Treffen, öffentliche Kurzvorträge oder auch Bildungsangebote und Workshops für interessierte Aussenstehende beinhalten. In verschiedenen Schweizer Städten (Zürich, Basel, Ostermundigen, St. Gallen, Luzern, Genf, etc…) gibt es bereits ähnliche Projekte. In der Linthgegend mit dem Einzugsgebiet rund um Rapperswil-Jona gibt es jedoch noch keine vergleichbaren Angebote. Diese Lücke möchten wir mit unserem Hackerspace füllen. Als Mitglieder in unserem Verein ist jeder willkommen, der sich für kreativen Umgang mit Technik interessiert und die Vereinsziele unterstützen kann."
