["http://www.coredump.ch/2018/01/03/neu-im-hackerspace-digital-mikroskop"]
title = "Neu im Hackerspace: Digital-Mikroskop – Coredump"
full_description = 'Da unsere Mitglieder immer wieder mal SMD-Lötarbeiten durchführen (z.B. für unsere LoRaWAN-Backplane) und man dafür öfter Bauteile, PCBs oder Lötstellen optisch inspizieren muss, haben wir uns intern ein Mikroskop gecrowdfunded. Das Gerät ist ein Andonstar ADSM201 und hat auf AliExpress zum Zeitpunkt der Bestellung 159$ gekostet. Das Mikroskop: Andonstar ADSM201 Das Mikroskop hat brauchbare Mechanik, gute Optik, einen integrierten kleinen Bildschirm und einen HDMI-Anschluss. PCB unter dem Mikroskop Der integrierte Bildschirm Das selbe Bauteil auf dem 1920×1080 LCD. Dank des integrierten Bildschirms kann man das Mikroskop relativ mobil verwenden, allerdings kommt die für den Preis wirklich sehr gute Bildqualität erst an einem grossen Bildschirm gut zur Geltung. Hier auf einem 24″-LCD: Ein SOT-23-6 IC und ein 0603 Widerstand …und auf einem 55″-TV: Raspberry Pi Platine Wenn man eine SD-Karte verwendet, kann man über die seitlichen Tasten am Screen auch direkt Bilder und Videos aufnehmen. Das haben wir bisher aber nicht getestet. Der Hersteller gibt einen Zoom-Faktor (bei Verwendung eines 22″-Screens) von bis zu 300× an. Hier eine SMD-LED auf der grössten Zoomstufe: 0805 SMD LED Bei so einer Zoomstufe fällt natürlich jedes kleinste Stück Dreck auf. Und Dreck versteckt sich überall. Hier zum Beispiel der Lötkolben-Reinigungs-Schwamm unter dem Mikroskop: Ein Löt-Reinigungs-Schwamm Auch gut sichtbar ist natürlich ein Fingerabdruck: Ein Fingerabdruck …oder die Schichten eines 3D-gedruckten Objektes: Layer aus dem 3D-Drucker Wer sich schonmal mit dem Thema der Tracking Dots befasst hat, wird diese gelben Punkte auf dem Papier kennen: Tracking Dots eines Laserdruckers von Canon Als Letztes noch eine Nahaufnahme eines Ausdruckes von einem älteren Schwarzweiss-Laserdrucker von HP: Ausdruck von einem älteren HP Schwarzweiss-Laserdrucker Wir hatten schon sehr viel Spass mit dem Mikroskop und sind begeistert von der Bildqualität. Eine Demo des Herstellers kann man sich hier ansehen. Hier gibt’s noch ein Review. Wir haben auch schon ein paar Ideen zur Verbesserung gefunden, z.B. die Kopfüber-Montage der Halterung. Auch die Polarisationsfilter haben wir uns bereits bestellt. Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
