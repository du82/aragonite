["https://www.coredump.ch/2018/04/25/neue-sitzecke-im-coredump"]
title = "Neue Sitzecke im Coredump – Coredump"
full_description = 'Nach dem Einzug in unseren neuen Hackerspace war die Sitzecke noch etwas leer. Deshalb entstand die Idee einer Sitzecke aus Europaletten. Mit etwas Planung und fleissigen Helfern konnten wir diese Idee realisieren. Planung der Sitzecke im 3D-Programm Zuerst verteilten wir Paletten, um die gewünschte Höhe zu erreichen. Danach wurden diese mit Verlegeplatten zugedeckt und verschraubt. So wurde der gewünschte Effekt des Zusammenhalts der Paletten erzielt und man konnte das Laminat sauber darauf verlegen. So sah’s vorher aus. Das Material steht bereit Paletten verlegen Die Paletten sind bereit Alles passt! Verlegplatten zuschneiden Verlegeplatten verlegen Verlegeplatten verschrauben Fertig! Auf die Verlegeplatten haben wir in einer etwas chaotischen Aktion noch eine dünne Dämm-Folie verlegt, um Unebenheiten der darunter liegenden Holzplatten auszugleichen. Das Laminat – ein Geschenk vom Ruum42 – hatten wir im März mitten in einem Schneesturm von St. Gallen nach Jona transportiert. Nach etwas Einarbeitungszeit konnten wir das Laminat zügig verlegen. Den seitlichen Rahmen um das Podest herum haben wir ebenfalls aus den Verlegeplatten angefertigt. Laminat Abholen: Autobahn während eines Schneesturms Länge abmessen Laminat verlegen Alles muss genau passen! Die letzten Platten … Fertig! So hebt sich die Sitzecke noch ein wenig mehr vom Rest des Raumes ab und lädt zum Verweilen ein. Das Endresultat Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
