["https://www.coredump.ch/2020/10/15/ferienpass-2020"]
title = "Ferienpass 2020 – Coredump"
full_description = 'Zum sechsten Mal fand am vergangenen Samstag ein Ferienpass-Tag im Coredump statt. Sechs Kinder konnten dabei – wie auch schon letzten Herbst – eine solarbetriebene Gurkenglaslampe bauen und dabei das Löten erlernen. Aufgrund der Corona-Pandemie gab es anders als in den Vorjahren einige Regeln zu beachten. Beispielsweise durften nur noch 2 Kinder an einem Tisch sitzen, es wurde häufiger gelüftet und wir achteten so gut wie möglich auf die Hygienemassnahmen und den nötigen Abstand zwischen Teilnehmern und Kursleitern. Da wir bereits 45 Minuten vor Ende des Kurses mit den Solarlampen fertig waren, konnten wir die Kinder noch eine Weile lang für alte MS-DOS-Games auf einem Toshiba T3100-Laptop von 1986 begeistern. Cool, zu sehen dass ein einfaches, monochromes Game auf einer Diskette so schnell süchtig machen kann, wie ein modernes 3D-Smartphone-Game 🙂 Der Kurs verlief sehr angenehm und alle Anwesenden hatten Spass dabei. Wir freuen uns schon auf nächstes Jahr 🙂 Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
