["https://www.coredump.ch/2022/10/07/coredump-repair-day-2022"]
title = "Coredump Repair Day 2022 – Coredump"
full_description = 'Am 15. Oktober findet der 7. Schweizer Reparaturtag statt. Der Coredump macht dieses Jahr auch mit und betreibt an dem Tag ein Repair Café! Das heisst, dass ihr endlich einmal den alten Mixer mit dem defekten Stecker, die Pfanne mit dem abgebrochenen Griff oder die Hose ohne Knopf vorbeibringen und zusammen mit uns reparieren könnt. Ihr erhaltet dabei Hilfe durch fachkundige Personen. Es wird gemeinsam repariert, was repariert werden kann – unentgeltlich und in gemütlicher Atmosphäre bei Kaffee und Kuchen. Eckdaten Wann: 15. Oktober 2022 von 10 bis 16 UhrWo: Verein Coredump, Eichwiesstrasse 4, 8645 Jona (siehe Wegbeschreibung) Was kann repariert werden? Natürlich können wir keinerlei Reparatur-Garantie geben. Unser KnowHow ist nicht in jedem Bereich gleich gut. Aber wo immer möglich, versuchen wir gemeinsam, das defekte Objekt zu reparieren. Elektronik und Elektrogeräte (Mixer, Fön, Radio, Smartphone, MP3-Player, Kopfhörer, …)Holz (Holzgegenstände, Spielsachen, kleine Möbel, …)Mechanik (Velo, Trottinett, …)Feinmechanik (gebrochene Bolzen, mechanische Uhren, …)Plastikgegenstände (z.B. ein abgebrochener Plastikgriff)Textilien… In unserem Vereinsraum können wir ein breites Sortiment an Werkzeug und Geräten bieten, die uns helfen, Dinge zu reparieren: Von einem Elektronik-Labor über 3D-Drucker bis zu einer Holzwerkstatt und einem Lasercutter. Im Zweifelsfall kommst du am besten einfach mal vorbei und wir schauen zusammen, was sich machen lässt. Muss ich mich anmelden? Grundsätzlich nicht. Wenn du aber eine Reparatur durchführen möchtest, wo Ersatzteile gebraucht werden, dann ist es hilfreich, wenn du dich kurz unter repaircafe@coredump.ch meldest, damit wir uns – falls möglich – darauf vorbereiten können. Was kostet die Reparatur? Die Reparatur ist kostenlos und wird von ehrenamtlichen Helfern unterstützt. Einige Ersatzteile haben wir vor Ort, diese werden zum Selbstkostenpreis abgegeben. Bei fehlenden Ersatzteilen unterstützen wir bei der Bestellung im Internet. Wir freuen uns aber über freiwillige Spenden zur Unterstützung unseres Vereins! Kann man bei euch mithelfen? Ja, sehr gerne! Wenn du etwas reparieren kannst – ganz egal was – freuen wir uns natürlich über weitere ehrenamtliche Helfer! Melde dich unter repaircafe@coredump.ch. Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
