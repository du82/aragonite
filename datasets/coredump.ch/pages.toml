full_description = 'Am 8. April habe ich mit meiner sechswöchigen Reise durch Europa begonnen. Mein Ziel ist es, dabei einige Hackerspaces in Europa kennenzulernen. Die Planung, wann ich wohin reise, geschieht mehr oder weniger spontan. Bisher habe ich bereits dem shackspace und dem chaosdorf einen Besuch abgestattet. Damit ihr auch etwas über diese Hackerspaces erfahren könnt, dokumentiere ich die Reise auf Twitter und auf meinem Blog. Falls ihr also Interesse daran habt, könnt ihr euch dort gerne informieren 🙂 Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
