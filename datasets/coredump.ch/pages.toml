["https://www.coredump.ch/2016/11/01/ferienpass-2016"]
title = "Ferienpass 2016 – Coredump"
full_description = 'Wie bereits in den Jahren 2014 und 2015 haben wir auch dieses Jahr im Coredump zwei Ferienpass-Kurse durchgeführt: Einen Lötkurs und einen 3D-Druck-Kurs. Hier ein kurzer Rückblick dazu. Einstieg in die Elektronik mit RGB LEDs Im Elektronik-Kurs lernten die Kinder, wie bereits in den Jahren zuvor, grundlegende Löt- und Elektronikkenntnisse anhand einer Steuerung für einen RGB-LED-Streifen. Löten Während wir im 2014 und 2015 sehr einfache Platinen verwendet hatten, die den Strom komplett über drei Potis regeln, wechselten wir dieses Jahr zu einer mikrokontroller-gesteuerten Platine welche bis zu 5m LED-Streifen interaktiv und programmierbar ansteuern kann. Das komplette RGB-LED-Kit Für das Löten der Bauteile rechneten wir eigentlich mit 1.5 bis 2h Zeitaufwand, die 6 Kinder lernten jedoch extrem schnell und waren bereits nach rund einer Stunde mit dem Löten fertig 🙂 Konzentriert am Löten Unsere Helfer geben Tipps Anschliessend schauten wir mit den Teilnehmern die Funktionsweise der elektronischen Schaltungen an und fanden zum Schluss sogar noch etwas Zeit um die Arduino-Boards mit neuen Algorithmen zu programmieren. Die Kinder hatten viele kreative Ideen und entwickelten zum Beispiel ein Spiel bei welchem eine Kombination von Poti-Positionen erraten werden musste! Dank vielen Helfern war der Kurs kurzweilig und stressfrei. Wir hoffen, dass die Kinder eben so viel Spass daran hatten wie wir 🙂 (Das RGB-LED Kit kann übrigens auch in unserem Shop gekauft werden.) 3D-Druck Kennenlernen Im zweiten Kurs – eine Woche später – konnten sich 8 Kinder mit unserem 3D-Drucker vertraut machen. Wir erklärten die Funktionsweise des FDM-Druckers und wie man ein 3D-Modell für den Druck erstellen kann. Gestalten eigener 3D-Designs Mit Tinkercad konnten die Teilnehmer direkt im Webbrowser eigene Ideen in 3D umsetzen. Unter den Designs gab es Namensschilder, Uhrenblätter, Gehäuse für die RGB-LED-Steuerung, Handy-Hüllen und sogar ein komplettes Modell eines DJ-Pultes! Modellieren eines DJ-Pultes Uns haben die Kurse gefallen. Dank useren neuen Räumlichkeiten hatten wir viel mehr Platz als in den Jahren davor, was die Organisation vereinfachte. Wir freuen uns darauf, auch nächses Jahr beim Ferienpass dabei zu sein! One Comment Pingback: Ferienpass 2018 | coredump Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
