["https://www.coredump.ch/2018/07/19/einladung-zum-eroffnungsfest-am-sa-8-august"]
title = "Einladung zum Eröffnungsfest am Sa 18.8. – Coredump"
full_description = 'Am 18. August von 13 bis 19 Uhr weihen wir unseren neuen Vereinsraum ein. Da wir nicht alleine feiern wollen, sind alle Besucher herzlich willkommen! An diesem Nachmittag bieten wir euch: Apéro Flüssigstickstoff-Glace Löt-Workshop (ab 7 Jahren) 3D-Druck Retro-Games Projektvorstellungen / Poster Session Wir vom Verein Coredump betreiben im Vinora-Areal in Jona einen Hackerspace: Ein 100m2-Raum mit Infrastruktur für kreative, nicht-kommerzielle Projekte im Bereich Elektronik, Software-Entwicklung, 3D-Druck, digitale Kunst und vieles mehr. Dieses neue Vereinslokal haben wir Anfang Jahr bezogen und sind inzwischen so weit eingerichtet, dass wir den Einzug mit euch feiern wollen. Dabei wollen wir der Öffentlichkeit uns, unseren Raum und unsere Projekte und Infrastruktur vorstellen. Einladungs-Flyer Programm Apéro Was wäre ein Fest ohne Speis und Trank? Eben! Wir sorgen für euer (und unser) leibliches Wohl! Flüssigstickstoff-Glace Unsere Luft besteht zu fast 80% aus Stickstoff. Doch das Zeugs gibt es nicht nur Gasförmig: Bei unter 77 Grad über dem absoluten Nullpunkt (also unter 77 Kelvin oder −196 °C) ist Stickstoff flüssig und sieht fast aus wie Wasser. Was passiert, wenn man diese Flüssigkeit mit Rahm oder Milch mischt? Die Temperaturen gleichen sich an: Die Milchprodukte kühlen unter 0 °C ab und gefrieren, gleichzeitig wärmt sich der Stickstoff auf über 77 K auf und verdunstet (wird gasförmig), wodurch die Milch (oder der Rahm) während dem Einfrieren aufschäumen. Süsst man vorher Milch und Rahm, hat man innert Sekunden feines, selbst gemachtes Glace. Und sieht dabei verdammt cool aus! Flüssigstickstoff-Glace am #stadtfestRJ 🤓🍦 pic.twitter.com/d1ca4qhQg7 — Coredump Rapperswil (@coredump_ch) August 21, 2017 Wie schon am Stadtfest bieten wir diesen erfrischenden Versuch zum Selbermachen an! Stickstoff ist zwar völlig ungiftig, aber in flüssiger Form aufgrund der extremen Kälte nicht ganz ungefährlich. Bitte haltet euch daher an die Weisungen der Verantwortlichen vor Ort und die dort angeschlagenen Vorsichtsmassnahmen. Die Wahl der Aromen erfolgt auf eigene kulinarische Verantwortung. Löt-Workshop (ab 7 Jahren) Wir haben einige kleine Elektronik-Bausätze besorgt, die du unter unserer fachkundigen Anleitung selbst zusammenlöten kannst. Das Ergebnis darfst du natürlich mit nach Hause nehmen! 3D-Druck Der Ultimaker 2 in unserem Raum wird in Betrieb sein. Sieh zu wie 3D-Objekte entstehen! Retro-Games Spiel und Spass gibt es auch elektronisch schon länger. Versuche dein Glück oder beweise dein Können in pixeligen Computer-Spielen aus der Vor-3D-Zeit. Früher war zwar nicht alles besser™, aber spassig konnte man es da auch schon haben! Wir lassen Retro-Games wieder aufleben, evtl. sogar auf original-alter Hardware. Projektvorstellungen Was wir vom Verein Coredump sonst noch so treiben? Am Eröffnungfest erfährst du es, denn wir werden einige unserer Projekte vorstellen! Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
