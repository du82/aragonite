["https://www.coredump.ch/2023/12/26/projekt-spulenaufbewahrung-unterfaeden"]
title = "Projekt: Spulenaufbewahrung Unterfäden – Coredump"
full_description = 'Seit längerem bin ich (Jessy) auf der Suche nach einer guten Aufbewahrung für meine Nähmaschinen-Unterfäden im Nähtreff, bei dem ich mithelfe. Vorher war es ein ziemliches Chaos, bei dem man schnell den Überblick verlor. Die erste Idee war, vertikale Stifte zu nutzen, auf welche die Spulen gesteckt werden. Das Problem dabei: Man erkennt dann die Farbe nicht mehr, die aufgespult ist. Nach längerer Überlegung und Diskussionen mit verschiedenen Leuten in unserem Hackerspace fanden wir dann eine Lösung: Eine Halterung, auf welcher die Spulen seitlich stehen, damit man die Farben erkennen kann und den Überblick darüber behält. Da der Lasercutter schneller und exakter ist, als 3D-Druck oder Handarbeit, war das für mich die beste Option, um die Halterung herzustellen. Nun musste ich die drei Schichten noch zusammenkleben. In den Ecken bekam die untere Halterung noch vier Dübel verpasst. Die Obere bekam auf der Unterseite vergrösserte Löcher. So kann man die Obere auf die Untere stellen, um die Spulen platzsparend zu lagern. Und so macht Aufräumen auch wieder mehr Spass! Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
