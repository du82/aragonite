["https://www.coredump.ch/jitsi"]
title = "Jitsi: Kostenlose Videokonferenzen – Coredump"
full_description = "➡️ Direktlink: https://meet.coredump.ch/ ⬅️ Auf https://meet.coredump.ch/ bieten wir seit dem Beginn der Corona-Pandemie eine öffentliche Jitsi-Instanz zur freien Benutzung für “Friends & Family” an. Um Missbrauch zu verhindern, benötigst du zum Erstellen eines Jitsi-Raumes einen Benutzer-Account, welchen wir dir auf Anfrage an jitsi@coredump.ch gerne kostenlos erstellen. Im Gegensatz zu Zoom musst nichts bezahlen und wirst nicht getrackt. Es gibt auch keine Zeit-Limiten. Einzige Einschränkung: Wir betreiben den Dienst als öffentlichen Dienst auf einer Best-Effort-Basis und können keinerlei Funktions-Garantie geben. Wie erhalte ich ein Login? Um Missbrauch zu verhindern, setzen wir seit Oktober 2024 ein Login voraus um neue Räume zu erstellen. Ohne Login kann man Räumen beitreten, aber keine neuen Räume erstellen. (Anders gesagt: Eine Person mit Login muss den Raum “eröffnen” und kann danach den Link teilen, Teilnehmer benötigen aber kein Login.) Wenn du ein Login möchtest, dann schreib eine kurze E-Mail an jitsi@coredump.ch und erkläre, wofür du Jitsi benutzen möchtest, dann schicken wir dir gerne kostenlos Login-Daten zu! Was ist Jitsi? Jitsi ist ein Open Source-Projekt. Der Code ist unter der Apache-Lizenz veröffentlicht und kann auf GitHub komplett eingesehen werden: https://github.com/jitsi/jitsi-meet Entwickelt wird Jitsi sowohl von der Community wie auch von der Firma 8×8. Die Video-Konferenz-Funktionalität basiert dabei auf dem offenen WebRTC-Standard. (Wer mehr über die technischen Aspekte von WebRTC lernen will, dem sei https://webrtcforthecurious.com/ empfohlen!) Was ist eine “Instanz”? Jitsi ist eine Software, die auf einem Server installiert werden muss. Wir haben diese Software auch auf unserem Server installiert, du findest sie unter https://meet.coredump.ch/. Diese Installation nent sich eine “Instanz”. Wie nutze ich Jitsi? Im Web-Browser Öffne https://meet.coredump.ch/ in deinem Browser. Auf der Startseite findest du ein Eingabefeld, hier kannst du deinem Video-Anruf einen Namen geben. Achtung: Jede Person, die den Namen deines Anrufs kennt, kann daran teilnehmen! Wenn du Persönliches besprechen willst, benutze besser einen langen, schwer zu erratenden Namen, also eher nicht “familie” sondern besser “familie-hghghwrzgzr89r”. Danach klickst du auf “GO” und schon bist du in der Konferenz drin! (Deine Kamera und dein Mikrofon musst du natürlich ebenfalls freigeben.) Den Link in der Adresszeile kannst du nun über deinen bevorzugten Kommunikationskanal teilen. Am Smartphone Hierfür installierst du am besten die Jitsi-App aus dem Play Store, App Store oder F-Droid. In der Jitsi-App musst du dann bei “Room Name” die komplette URL (also auch inklusive “meet.coredump.ch”) eingeben, sonst landest du auf einer anderen Instanz! Einfach die URL einfügen und auf den “Teilnehmen” bzw. “Join”-Button tippen. Kann ich für einen Passwort für einen Video-Anruf setzen? Ja, dafür klickst du unten rechts auf das Icon mit dem gelben Schild. In den sich daraufhin öffnenden Einstellungen kannst du ein Passwort setzen. Wenn jemand dem Anruf beitreten will, muss dieses Passwort eingegeben werden. Sind die Anrufe verschlüsselt? Anrufe sind zwischen dir und dem Server verschlüsselt! Es besteht allerdings aus technischen Gründen keine Ende-zu-Ende-Verschlüsselung, das heisst, wir als Serverbetreiber könnten theoretisch Anrufe mithören. Das tun wir aber in der Regel nicht. Selbstverständlich dürfen jedoch keine illegalen Inhalte über unsere Plattform geteilt werden. Wenn du wichtige Dinge sicher besprechen möchtest, empfehlen wir einen ende-zu-ende-verschlüsselten Messenger mit Unterstützung für Videoanrufe, zum Beispiel Threema oder Signal. Bei denen kann auch der Server-Betreiber nicht mithören. (Achtung: Zoom, Skype oder Microsoft Teams sind hier keine guten Alternativen!) Wie lautet die Datenschutzerklärung? Wir haben kein Interesse an deinen Daten. Wir geben keinerlei personenbezogene Daten von dir an Dritte weiter. Der Service ist ein kostenloser Dienst für die Community und kein kommerzielles Angebot. Selbstverständlich tolerieren wir keinen Missbrauch unserer Jitsi-Instanz zu illegalen Zwecken. Falls wir auf solche Nutzung aufmerksam werden, sperren wir entsprechende Logins. Ich mag Statistiken. Habt ihr Statistiken? Klar, wir haben ein Grafana-Board mit Jitsi-Statistiken! https://grafana.coredump.ch/d/-e894Q-Gk/jitsi-stats"
year_published = 2025
