["https://www.coredump.ch/2014/11/03/der-c64-nackt"]
title = "Der C64 Nackt – Coredump"
full_description = 'Falls du dich schonmal gefragt hast wie ein C64 von innen aussieht, können wir Abhilfe schaffen: Wir haben nämlich ein paar Fotos davon gemacht. Der C64 von aussen Durch das Lösen von drei Schrauben kann man die Gehäuseabdeckung entfernen. C64 ohne Gehäuseabdeckung Die Tastatur kann auch sehr einfach entfernt werden. Tastatur entfernt Nun kann die Kartonabdeckung entfernt werden, wodurch der Blick auf das Motherboard freigelegt wird. Das Motherboard Ein paar Nahaufnahmen der Platine: Bestückung Links Bestückung Rechts Hier sieht man noch den Berühmten SID-Chip (MOS 8580R5 SID) zur Audiogenerierung: MOS 8580R5 SID Chip Und zu guter Letzt noch die Rückseite: Die Rückseite des Motherboard Das Coole an der alten Hardware: Das Motherboard ist auch ohne Gehäuse lauffähig. Und durch die Herstellung (alles through-hole gelötet) wäre es auch trivial, defekte Bauteile zu ersetzen. Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
