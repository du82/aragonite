full_description = 'Vor einer Woche haben wir im neuen Hackerspace eine Trennwand gebaut. Hier das Timelapse-Video und ein paar Fotos 🙂 https://files.coredump.ch/videos/20180113-hackerspace-timelapse.mp4 Gallerie: Und hier das fertige Resultat (noch ohne Tür): Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
