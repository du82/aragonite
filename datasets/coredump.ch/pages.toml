["https://www.coredump.ch/2018/12/31/ferienpass-2018"]
title = "Ferienpass 2018 – Coredump"
full_description = 'Auch dieses Jahr (wie schon in den Jahren 2016, 2015 und 2014) fanden zwei Ferienpass-Kurse bei uns im Hackerspace statt. Dabei konnten je 8 Kinder entweder das Löten von Elektronik-Kits oder das Programmieren eines einfachen Roboters erlernen. Einstieg in die Elektronik mit Löt-Kits Im ersten Kurs war Löten angesagt! Von 13:30 bis 17 Uhr lernten die 8 Teilnehmerinnen und Teilnehmer, wie man mit dem Lötkolben umgeht und worauf man achten muss, damit die gelöteten Kits am Ende auch funktionieren. Wir haben zwei Kits zusammengelötet: Ein LED-Lauflicht und einen Linien-Folge-Roboter, welcher mittels IR-Dioden und Fototransistoren einer schwarzen Linie entlang fahren kann. Links: Fertig zusammengebauter Linienfolger / Rechts: LED Lauflicht Kontrolle der Lötstellen mit Mikroskop Am Schluss hatten alle ein funktionsfähiges Fahrzeug, welches autonom einer schwarzen Linie auf einem Blatt folgen kann! Test des Linienfolgers Einstieg in die Programmierung mit BOB3 Im zweiten Kurs lag der Fokus auf dem Programmieren eines “Roboters”. Dafür verwendeten wir das Kit “BOB3” von Nicai Systems. Der BOB3 wird bereits erfolgreich an vielen Schulen eingesetzt und wird begleitet von einer interaktiven, webbasierten Programmierumgebung. (Ein Vortrag zu Digitaler Bildung in der Schule mit dem BOB3 findet sich hier.) Der BOB3 ist ein PCB in Form eines Roboters, mit LED-Augen, kapazitiven (berührungsempfindlichen) Armen, einer Infrarot-Diode + Phototransistor zur Datenübertragung, einem Lichtsensor und einem Temperatursensor. Die Steuerung wird von einem Arduino-basierten Atmel-Mikrocontroller übernommen. Der Mikrocontroller kann mithilfe einer interaktiven Web-Oberfläche programmiert werden. Bevor wir anfangen konnten zu programmieren, musste aber auch dieser Bausatz zusammengelötet werden. Die Lötarbeit war schnell erledigt, danach folgte der schrittweise Einstieg in die Programmierung. Die Kinder lernten schnell und schon bald leuchteten und blinkten LEDs in Farben abhängig von der Lufttemperatur 🙂 Sowohl wir als Team wie auch die Besucher des Kurses hatten an dem Nachmittag viel Spass. Wir hoffen, dass wir einen guten (wenn auch kurzen) Einblick in die Welt von Elektronik und Computer geben konnten und freuen uns schon auf den Ferienpass 2019! One Comment Sabine H. sagt: Dezember 12, 2019 um 20:58 Uhr Sehr schöner Beitrag. Auch wir finden, dass man von der Grundschule bis zur Ausbildung programmieren lernen sollte und da mein Mann Wirtschaftsingenieur ist, darf unser Sohn Constantin seit kurzem Arduino programmieren. Dem Constantin macht das sehr viel Spaß, weil er die Ergebnisse sofort sieht, wenn beispielsweise eine LED leuchtet. Da Constantin so viel Spaß mit der Arduino Programmierung hat, bekommt er nun eine Programmierwerkstatt (https://kinderprogrammieren.de/spielsachen/experimentierkaesten/franzis-baubox-programmier-werkstatt-erfahrungsbericht/) zu Weihnachten geschenkt. Ich bin wirklich gespannt, ob er mit der derzeitigen Leidenschaft auch die neuen Projekte angeht. Aber ich bin guter Dinge, weil das sicherlich für die Zukunft braucht. Antworten Schreibe einen Kommentar Antworten abbrechenDeine E-Mail-Adresse wird nicht veröffentlicht. Erforderliche Felder sind mit * markiertKommentar * Name * E-Mail * Website Meinen Namen, meine E-Mail-Adresse und meine Website in diesem Browser für die nächste Kommentierung speichern. Δdocument.getElementById( "ak_js_1" ).setAttribute( "value", ( new Date() ).getTime() );'
