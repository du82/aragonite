["https://www.corelan.be/index.php/2008/04/18/securing-windows-server-2008-and-active-directory"]
title = "Securing Windows Server 2008 and Active Directory | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = "According to Microsoft, Windows Server 2008 is the most secure Windows server version ever. Windows 2008 does include many features that will help increase overall security of the OS, or assist you with securing AD, the network, etc. Most of the features/roles available in Windows 2008 are not being installed in a default installation of"
full_description = "Windows 2008 does include many features that will help increase overall security of the OS, or assist you with securing AD, the network, etc. Most of the features/roles available in Windows 2008 are not being installed in a default installation of Windows 2008, leaving the OS in a more or less ‘secure’ state right after installation. The attack surface of a default Windows 2008 server may be smaller than it was under NT4, 2000 and 2003, but concluding that Windows Server 2008 is secure, may be one bridge too far. Microsoft has published a paper on the differences between 2003 and 2008, which includes some security related information. The document can be downloaded from “Changes in Functionality from Windows Server 2003 with SP1 to Windows Server 2008” I’ll use this post to explain some of the recommended hardening techniques, and list some additional tweaks/settings that can (and imho should) be applied to a Windows 2008 server in an attempt to further harden the OS. For Windows 2008/AD servers : – Using GPOAccelerator to create GPO’s that can be applied to AD and to regular servers – Provide some recommended settings that should be configured to a Domain GPO, including Domain Password Policies and Fine Grained Password Policies – Provide some recommended settings that should be configured to the Domain Controller’s GPO, – Provide some recommended settings that should be configured to regular server GPO’s – Using GPOAccelerator SCE Extensions to further secure AD and servers using GPO’s – Create your own extensions and create custom Security Templates – Use the custom Templates to actually set out the various GPO’s (based on the recommendations that are given in this document). You don’t want to go in and change all the GPO’s manually. It is better to create your own templates and then apply these templates to the corresponding GPO’s. – Using Security Configuration Wizard to secure servers that have a specific role For standalone/”high security” servers : – Using GPOAccelerator and Security Templates to secure “standalone” servers"
author = "Peter Van Eeckhoutte (corelanc0d3r)"
