["https://www.corelan.be/index.php/2014/05/30/hitb2014ams-day-2-on-her-majestys-secret-service-grx-a-spy-agency"]
title = "HITB2014AMS – Day 2 – On Her Majesty’s Secret Service: GRX & A Spy Agency | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = 'Last year, Belgacom got hacked by an intelligence service (GCHQ?), Rob says. "What is so interesting about this hack, why did they hack into Belgacom, what would or could be the purpose of a similar hack?" Before answering those questions, we need to take a quick look on how mobile networks work and how mobile'
full_description = "Last year, Belgacom got hacked by an intelligence service (GCHQ?), Rob says. “What is so interesting about this hack, why did they hack into Belgacom, what would or could be the purpose of a similar hack?” Before answering those questions, we need to take a quick look on how mobile networks work and how mobile data travels the network. In a mobile data network, it’s necessary to know where you are. KPN has about 5000 cells throughout the country, and each site has a Cell Identifier (CI). To group them together, an RAC (Route Area Code) is used. Every country has its own unique number. MCC 204, for example, corresponds with The Netherlands. Additionally, each provider has a unique number. To access the network, you need an APN (Access Point Name), an IMSI (International Mobile Subscriber Identify) and an UICC (Universal Integrated Circuit Card), which is stored on the SIM card. From a network perspective, Rob explains, even more components are needed and used. Radio (BTS/nodeB), a Home Location Register, a Service GPRS Support Node (SGSN), a Gateway GPRS Support Node and DNS servers are needed to provide connectivity. When the phone sends a data packet, it will hit the data network first. The packet reaches the SGSN/S-GW and gets authenticated (HLR/HSS). After successful authentication, the device will resolve the APN name (using DNS). Traffic is then sent to a gateway, and everything behind the gateway is plain TCP/IP. To make sure all devices can use their own tunnel, GPRS Tunneling protocol was created, Rob explains, to allow devices to have their own GPRS tunnel. The protocol (GTPv0 GPRS, GTPv1 GPRS/UMTS, GTPv2 LTE) is based on UDP. The GTP specification can be found at http://www.3gpp.org/DynaReport/29060.htm When a telco gets hacked, there are a number of fields in the GPRS protocol that may be interesting for hackers. The IMSI may be interesting, the APN (if it’s hidden) and some other information such as MCC, MNC, LAC, CI and IMEI. The setup for Mobile roaming is quite similar to a domestic setup. A device first connects to a local network and the local SGSN will connect to the HLR of the home country to authenticate the device. After authentication, traffic is sent to the gateway in the home country…. and to make that happen, the operators use GRX (GPRS Roaming Exchange). GRX is a concept based on GSMA, but *should* be segmented/isolated from the rest of the network. To understand why access to GRX traffic could be interesting to spy agencies, Stephen continues, we need to look at what the GTP traffic looks like and what is inside the packets."
