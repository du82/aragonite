["https://www.corelan.be/index.php/2014/05/30/hitb2014ams-day-2-keynote-4-hack-it-forward"]
title = "HITB2014AMS – Day 2 – Keynote 4: Hack It Forward | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = "Good morning Amsterdam, good morning readers, welcome to the second day of the Hack In The Box conference. The speaker for the first keynote didn't show up, so we'll jump right into the next keynote. Jennifer starts her keynote by explaining that she's fortunate to be able to travel to a lot of conferences and"
full_description = "Good morning Amsterdam, good morning readers, welcome to the second day of the Hack In The Box conference. The speaker for the first keynote didn’t show up, so we’ll jump right into the next keynote. Jennifer starts her keynote by explaining that she’s fortunate to be able to travel to a lot of conferences and meet a lot of amazing people. When talking to people in infosec/hackers, they often mention that they are inspired by a lot of things, and often driven by the “live free” ideology. Some hackers are inspired by movies, and inspiring movies. Hackers are even inspiring comics, Jennifer explains. Quoting Confucius (“Choose a job you love and you will never have to work a day in your life”), Jennifer explains that she really enjoys working in Infosec and can’t think of any other industry to work in. Although things can be hard and things are not perfect all the time, it’s fun and there’s a lot of great stuff that the technology gives us. Infosec should figure out ways to use that new technology and do so in a secure way. Security is hard. It’s one of the hardest thing anyone can do. We must think outside of the box, how we can do things differently so we can provide more/bettter security. But if it wasn’t hard, we would all be bored. If you’re scared by that idea, perhaps you should pick a different industry, Jennifer continues. “Bring it on”, she says. If you do the same things over and over again, you shouldn’t be surprised you get breached. The industry has limitless possibilities. Everyone can do great things, make good money, have fun… rinse & repeat. Bug bounties allow researchers to get paid for the work they do. If we want to take advantage of those opportunities, we need to change our game and think about things differently. Security is a game of give and take, pull and give. The Internet of Things proves that there are crazy ways to use the technology available. “Captain” Jennifer continues by sharing some “Pirate Tales” from IOActive, tales that show the motivation and inspiration of people at IOActive, including projects that involve car hacking, ATM takeovers, Medical devices, Satellite communications and Nuclear bombs."
