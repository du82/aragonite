["https://www.corelan.be/index.php/2016/01/31/encfsgui-gui-wrapper-around-encfs-for-osx"]
title = "EncFSGui – GUI Wrapper around encfs for OSX | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = "Introduction 3 weeks ago, I posted a rant about my frustration/concern related with crypto tools, more specifically the lack of tools to implement crypto-based protection for files on OSX, in a point-&-click user-friendly way. I listed my personal functional and technical criteria for such tools and came to the conclusion that the industry seem to"
full_description = "3 weeks ago, I posted a rant about my frustration/concern related with crypto tools, more specifically the lack of tools to implement crypto-based protection for files on OSX, in a point-&-click user-friendly way. I listed my personal functional and technical criteria for such tools and came to the conclusion that the industry seem to think otherwise about those criteria. In fact, the only tool that met all of my criteria in the past (BoxCryptor Classic) is no longer supported on current OS versions, and was replaced by a tool that is based on different technology, removing most of the features that I found were important enough to justify paying for their application in the first place. I tweeted about my rant a couple of times, but unfortunately I have not received any solutions. At least, nobody pointed out that my list of criteria doesn’t make any sense either… but given the lack of feedback overall, I’m not sure if that means anything. Anyway, as I decided to start learning C++ again back in december 2015, I figured it would be an interesting challenge to write something myself that would be easy enough to use, implements the required functionality and works on the systems that I use (mainly OSX Yosemite and El Capitan). Today, I’m ready to present the EncFSGui project. You can find the project repository on https://github.com/corelan/EncFSGui. The repository contains the source code, Makefile and compiled binary. It is open-source, but not free. (At least, it wasn’t free for me. I spent quite some time writing the app, which required me to make choices between work, family, and doing other fun things). Anyways. there is no free lunch. Donations are always welcome. (I could have sold the app on the App Store too… probably same effort for me) EncFSGui is an OSX application, written in C++. It relies on the wxWidgets framework for its GUI aspect. EncFSGui relies on the presence of certain binaries/tools on your system and simply launches those tools with the necessary arguments, captures and processes the output. In other words, it is a wrapper. It doesn’t implement crypto itself, and it doesn’t implement the creation of a filesystem either, but it merely relies on 2 tools (that are not present on OSX by default): encfs and OSXFuse. Additionally, it uses standard tools such as ‘mount’, ‘umount’ and ‘expect’. To limit the number of dependencies you have to install yourself, EncFSGui is statically linked with wxWidgets and libcurl."
