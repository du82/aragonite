["https://www.corelan.be/index.php/2008/01/07/setting-up-infoexpress-cyberarmor-suite-35"]
title = "Setting up InfoExpress CyberArmor Suite 3.5 | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = "CyberArmor is a really excellent personal firewall. The CyberArmor suite consists of a Policy Server (and Policy Manager) used to create policies, a CyberServer (used to capture logs and alarms, optional), a Secure Ping Server (optional) and an MSDE back-end. More information can be found at http://www.infoexpress.com/security_products/firewall_overview.php The product runs on Windows platforms and allows"
full_description = 'CyberArmor is a really excellent personal firewall. The CyberArmor suite consists of a Policy Server (and Policy Manager) used to create policies, a CyberServer (used to capture logs and alarms, optional), a Secure Ping Server (optional) and an MSDE back-end. More information can be found at http://www.infoexpress.com/security_products/firewall_overview.php The product runs on Windows platforms and allows for centralized management (including updating rulesets) of personal firewalls. The nice thing about CyberArmor is that it allows a lot of flexibility in terms of determining where a computer is located, and the ability to apply different rulesets based on the location. This location awareness is the core foundation of the tool, and goes much further than the location awareness found in products such as Symantec or Microsoft. Futhermore, the tool does not only block or allow traffic based on rules, but it also contains application filtering, and intrusion prevention. You’ll need a Windows server (2003 R2 in my case), with IIS installed. You’ll need a web server certificate (but you can generate a certificate with SelfSSL from the IIS resource kit if you don’t have access to a CA). Before you begin, make sure NOT to put the server in a domain. CyberArmor suite 3.5 doesn’t support servers that are member of a domain, so make sure not to put in in a domain. Ever. Second, make sure to turn off DEP. Edit the boot.ini of the server and change /noexecute=optin to /noexecute=AlwaysOff In my environment, the installation of CyberArmor Suite 3.5 failed on Windows 2003 R2, so I had to install 3.2 and then upgraded to 3.5, which did the trick just fine. Once you have v3.5 installed, log on to the policy manager. You’ll see the 3 default End User Systems. If you are installing a new system, the first thing you should do now is create a Region and bind a End User System to a region (or create a new end user system and bind it to a region). You’ll have to "check out" before you can modify settings. Don’t forget to check in again when you have finished editing. When you have created the policies and tested the policy, you can deploy a new policy. This will create a folder under c:\inetpub\wwwroot\cyberarmor containing the current date/time of deployment, the region, the end user system, and then the installation packages. You can install new clients using pcainst.exe (Win2K/XP) or pcamsiinst.exe (Vista) from this folder. Once the clients have been installed (and when you’ve configured automatic updates), your clients will automatically pull down updates when new versions have been deployed.'
