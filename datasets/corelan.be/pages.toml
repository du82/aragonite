["https://www.corelan.be/index.php/2009/04/10/free-tool-windows-2008-certificate-authority-certificate-list-utility-for-pending-requests-and-about-to-expire-certificates"]
title = "Free tool : Windows 2003/2008 Certificate Authority Certificate List Utility for pending requests and about-to-expire certificates | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = "In one of my earlier posts, I have talked about setting up a Windows 2008 based Certificate Authority/PKI. Once your Windows 2008 CA setup is in place and configured, you can go ahead and starting issuing certificates. But at the same time, you need to put a maintenance/management procedure in place so you can stay"
full_description = 'In one of my earlier posts, I have talked about setting up a Windows 2008 based Certificate Authority/PKI. Once your Windows 2008 CA setup is in place and configured, you can go ahead and starting issuing certificates. But at the same time, you need to put a maintenance/management procedure in place so you can stay on top of certain tasks, such as processing pending certificate requests or identify certificates that will expire and need manual renewal. Unfortunately there is no easy way to get notified when new requests are pending, or certificates will expire somewhere in the future. This free utility requires .Net framework and requires proper permissions to connect to the CA admin interface. It uses the Windows Server 2003, 2008 or Vista version of certutil and will run against a 2003 or 2008 CA. – list all certificates that will expire in a given number of days (or have expired in the last x days) You can configure the tool to send you an email based on the results of these 2 queries. What I usually do is run this script in 2 separate schedules : After unpacking the zip file, you will get a single .exe file. After launching the tool without specifying any parameters, you will get this : -s : if you run the utility on the CA server itself, you don’t need to specify the –s parameter. If you are running the utility from a remote machine, you need to specify the CA Servername\CA name using the –s parameter. You can get the exact CA Servername\CA name string by running “certutil” on the CA server, look for “Config:”. This is the string you need to use. (Put the string between double quotes if it contains spaces) -e : if you want to look for certificates that will expire in a given number of days, specify the –e parameter, followed by the number of days that you want to look ahead. You can use a negative value to look back in time (to list certificates that have expired) -i : only show certificates that match with the specified templatename. You can only provide one template name.'
