description = "This page gathers generic/universal ROP chains that are solely based on gadgets taken from a single dll. The main requirements for a ROP chain to be listed here are: it must work on XP, Vista, Windows 7, 2003 and 2008 server. (the dll should not rebase and should not be ASLR enabled). If your ROP"
full_description = "This page gathers generic/universal ROP chains that are solely based on gadgets taken from a single dll. Ideally, the dll should be not application specific, unless it’s shipped with a major application and/or has the option to get loaded from f.i. a web browser. If you want to submit your own chain, make sure to include details about the module (name, version, applications it gets shipped with), and indicate if and how the dll can be loaded on demand (if applicable). Write your chain in the format shown below (ruby) and send it to peter [dot] ve {at} corelan [dot] be Feel free to use the chains below in your exploits, just don’t forget to credit the original author(s) Note : the IAT entry in advapi32.dll (NtSetInformationProcess() at 0x77dd1404) is static on all versions os XP Pingback: Ongoing analysis of unknown exploit targeting Office 2007-2013 UTAI MS15-022 | ropchain.com – Security blog a. Corelan respects your privacy. Most information accessible on or via the Corelan Website is available without the need to provide personal information. In certain cases you may however be requested to submit personal information. In such case your personal information shall be treated in accordance with the General Data Protection Regulation and any amendments hereof. b. All personal information made available by you will be treated solely for the purpose of making available to you the requested information or services. Your personal information will not be shared with third parties, but it may be used for authentication, support & marketing purposes in relation with services provided by Corelan. c. We will only keep your personal information for as long as is required to provide you with the requested information or services, or for any longer period as may legally be required. d. It is our goal to reasonably protect the personal information made available by you from third parties. e. You have the right to consult, correct, adjust or have removed your personal details by written request to Corelan. If you decide to get your information removed, you understand and accept that you will lose all access to any resources that require the use of these personal details, such as parts of the website that require authentication."
