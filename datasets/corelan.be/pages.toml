["https://www.corelan.be/index.php/2008/04/14/monitoring-disk-space-utilization-growthincrease-with-operations-manager-2007"]
title = "Monitoring disk space utilization growth/increase with Operations Manager 2007 | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = "By default, Microsoft Operations Manager includes some monitors / rules that have the ability to monitor the disk utilization of system and/or data disks of your servers (and clients). This is a really nice feature, however there may be reasons why this kind of monitoring would still leave you one step behind of your users."
full_description = 'By default, Microsoft Operations Manager includes some monitors / rules that have the ability to monitor the disk utilization of system and/or data disks of your servers (and clients). This is a really nice feature, however there may be reasons why this kind of monitoring would still leave you one step behind of your users. After all, there would be no way to monitor if a set of data on a disk starts growing faster than you would like. You would get an alert – sure – but it might be too late already. Let’s say you have a disk on a fileserver, that contains all of the data/shares of your end users, and all of the homefolders. Assuming that the (for example) 300Gb disk contains 260Gb worth of data already. No problems so far, life is good, OpsMgr would not get trigger and alert yet (unless you have changed the default threshold values). Suppose one of your users starts copying a DVD to his homefolder… the available space would increase with 4Gb. OpsMgr would still not generate an alert. But let’s be honest – this would be something you would like to know, right ? If your data folders increase by 4Gb a day, then you would like to know this sooner – even before the “low level” threshold gets triggered. Out of the box, there is no way to do this. So I decided to write a small vbs script, and used the vbscript in an OpsMgr monitor. The script requires 3 parameters, each separated with a single blank (space), and one optional parameter : 1. The absolute path to the folder (or disk) that needs to be monitored. You can use multiple paths/folders by separating them using a comma. So if you want to look at d:\shares and d:\homefolders, then the first parameter should be “d:\shares”,”d:\homefolders” Note : the current version of script will look at all folders (1 level deep) inside the folder that you’ve specified as a parameter. So if d:\shares only contains files, then you should use d:\ as parameter (which would include d:\shares, as well as all other folders on drive d:)'
author = "Peter Van Eeckhoutte (corelanc0d3r)"
year_published = 2008
year_updated = 2021
