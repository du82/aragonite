["https://www.corelan.be/index.php/2007/10/23/free-tool-free-pop3-collector"]
title = "Free tool – Free POP3 Collector | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = "Keywords : Free generic POP3 collector for Microsoft Exchange 2000 Exchange 2003 Exchange 2007 Lotus Domino Server download email from POP3 and forward to SMTP server Over the last 12 years, I have created multiple email addresses hosted with various Internet Providers, or other companies. I'm still using some of those addresses, and my wife"
full_description = "Keywords : Free generic POP3 collector for Microsoft Exchange 2000 Exchange 2003 Exchange 2007 Lotus Domino Server download email from POP3 and forward to SMTP server Over the last 12 years, I have created multiple email addresses hosted with various Internet Providers, or other companies. I’m still using some of those addresses, and my wife has a couple of email addresses as well, so the result is that I have (had) to configure multiple email accounts in Outlook (Express) to download emails from all of the email mailboxes. Those were the good old days. Despite the fact that mailbox storage space has become less restrictive, some of the old email addresses still require me to download emails at least once a day, otherwise the ISP mailbox tends to fill up. So I set up a mailserver and started looking for ways to periodically connect to my (POP3) ISP mailboxes, download the emails and deliver them to my local mailserver. After all, this technique speeds up the process of downloading emails (because the emails will be downloaded and forwarded to your local mailserver, so you only need to access your local mailserver) and also bypasses the need to manually download emails on a regular basis in order to avoid the mailbox to “overflow”. There are a couple of tools available to collect emails from POP3 mailboxes and forward them to a user on a local smtp server, but they are either not free, lack features, limit the number of email accounts that can be created, are complex to set up, are product specific, have weak logging, do not support Secure POP3 (SSL) or Secure SMTP (SSL/TLS) with authentication, or corrupt attachments and so on. So I decided to write a more or less generic POP3 Collector tool myself, with focus on ease of use, stability and logging, and share the tool with everyone. The tool works with any mail platform that supports POP3 (to collect emails from) and SMTP (to send email to), including Lotus Domino, Exchange, and so on. When you first launch the tool, 2 config files will be created : appconfig.xml and userconfig.xml. Do NOT edit those files yourself, the application will interface between you and those configuration files. If you edit them yourself and if the application doesn’t like what you did to the files, then just remove the files and they will be recreated."
