["https://www.corelan.be/index.php/2008/08/17/exchange-2007-multi-account-domain-to-single-resource-forest-replication-with-iifp-and-custom-rules-extension"]
title = "Exchange 2007 – Multi Account Domain to Single Resource Forest replication with IIFP and custom Rules Extension | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = "Introduction The title of this post may be a bit misleading - synchronizing multiple account domains to a single domain or forest is not limited to Exchange. There may be other reasons (e.g. Identity Management solution) that require you to replicate users from multiple domains into a single domain/forest, or even ADAM instance. In this"
full_description = "The title of this post may be a bit misleading – synchronizing multiple account domains to a single domain or forest is not limited to Exchange. There may be other reasons (e.g. Identity Management solution) that require you to replicate users from multiple domains into a single domain/forest, or even ADAM instance. In this blog post, I will show you a possible IIFP implementation that has some specific requirements. In my scenario, IIFP will be used to replicate user objects from multiple account domains into one centralized resource forest, and it will be used replicate back the “mail” and “proxyAddresses” attributes from the Resource Forest to the account domains. Furthermore, I also need to replicate user objects from a domain that is not used for authenticate users or link mailboxes to, but merely to add the users as contacts in the Resource Forest in order to further populate the address book. In order to accomplish this, we need MIIS (now ILM) or IIFP. Since IIFP is free and will do what we want to do, we’ll use IIFP for this purpose. You can download IIFP from here : Download details- Microsoft Identity Integration Feature Pack SP2. Before installing IIFP, make sure to check the system requirements (see Microsoft Download Page) In a default installation, IIFP can only be used to “join” existing objects in multiple domains/ADAM instances together and synchronize attributes. (Note : if you need to sync objects from instances other than AD or ADAM, you need to purchase the MIIS/ILM tool from Microsoft). This means that, out of the box, IIFP cannot create new objects. You need custom scripting for that. There is a second limitation : it cannot synchronize the unicodePwd field, which contains the AD password. If you want passwords to be synched, you need to set up PCNS on your Domain Controllers, which will catch all password change events, and notify IIFP to set this new password on the target object. IIFP uses a SQL database, called the “Metaverse” to host all objects and links between those objects (connectors). When you are getting information from an Account Domain, you will be importing objects/attributes to the metaverse. When you want to write information to the Resource Forest, you will be exporting objects and/or attributes from the metaverse. When you want to get the “mail” and “proxyAddresses” attributes from the Resource Forest and sync them to the corresponding object in the Account Domain, you will be “importing” from the Resource Forest and “exporting” to the Account Domain."
author = "Peter Van Eeckhoutte (corelanc0d3r)"
year_published = 2008
year_updated = 2021
