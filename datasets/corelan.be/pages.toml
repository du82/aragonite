["https://corelan.be/index.php/2009/01/28/monitoring-your-network-with-powershell"]
title = "Monitoring your network with Powershell | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = "I have written a small powershell script that will help you to monitor various hosts on your network. Instead of using ping to see if a host is alive, this script will connect to tcp ports, so you can also monitor hosts behind firewalls (or hosts that cannot be pinged). In addition to this, you"
full_description = "I have written a small powershell script that will help you to monitor various hosts on your network. Instead of using ping to see if a host is alive, this script will connect to tcp ports, so you can also monitor hosts behind firewalls (or hosts that cannot be pinged). In addition to this, you can also test that a port is closed (and report that this is ok if that is what you want); and only report a problem when the port is found open (instead of closed) 2. Create a text file in the same folder, containing the hosts you want to monitor. You can only put one entry per line. This is the syntax : so suppose you want to monitor a host called www.myserver.com and verify that port 80 is open, add a line that says www.myserver.com:80:open If you want to monitor port 22 of host server1.mydomain.com, which should be closed by default, add a line that says server1.mydomain.com:22:closed 3. Create a file called smtp.cfg and with the following entries (and replace the text surrounded by <> with your own settings) As you can see, you can use 3 variables in the Subject field. (and of course, you are free to build your own subject field.) You should have 3 files : the powershell script, the smtp.cfg file, and the file that contains the host entries. From a powershell command line, launch the script, and use the filename of the “host entries” file as parameter. The script will assume that smtp.cfg is in the local path. smtp.cfg is configured to send reports with all entries, to peter.ve@telenet.be and peter.ve@corelan.be, but only when there is something wrong (so alertmode = 1, reportmode = 2) Of course, you would need to schedule this script in order to be able to continuously monitor the hosts on your network. You can use the explanation at the bottom of this post to find out how to launch the script from a batch file. All that is left for you is to schedule the batch file thru Task Scheduler / Scheduled Tasks. You need to be logged in to download this script. Click this link to register if you don’t have a useraccount yet"
