["https://corelan.be/index.php/2009/01/31/nessus-wrapper-for-ike-scan"]
title = "Nessus/OpenVAS wrapper for ike-scan | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = "ike-scan is a great tool to audit VPN/IPSec implementations. This tool, which runs under Lunix, Unix, MacOS and Windows, can be found at www.nta-monitor.com/tools/ike-scan/ (Latest version at time of writing is 1.9). My Nessus ike-scan NASL wrapper may or may not work with earlier versions or newer versions, so test test test) Some of the"
full_description = "ike-scan is a great tool to audit VPN/IPSec implementations. This tool, which runs under Lunix, Unix, MacOS and Windows, can be found at www.nta-monitor.com/tools/ike-scan/ (Latest version at time of writing is 1.9). My Nessus ike-scan NASL wrapper may or may not work with earlier versions or newer versions, so test test test) Some of the great features of ike-scan include extracting the PSK, or transform attributes to find all algorithms that are enabled on a device. Especially this last function may require some scripting and lots of time to go through the log files in order to see whether your solution is configured the way it should be configured. The plugin is in fact a wrapper around ike-scan and will parse the output, looking for specific settings : In addition to this, the wrapper will attempt to find and display the device vendor. (will generate a security_warning) All of these tests are hardcoded in the script, so if you want to look for different things, feel free to edit the plugin. Both Nessus (www.nessus.org) and openVAS (www.openvas.com) are Network Vulnerability Scanner, free to download, offering various sets of plugins for Home Users and Professionals. My nasl plugin does not depend on existing or new plugins, so you can run the plugin with both free and paying plugin subscriptions. I will explain some configuration specifications for Nessus, I’m sure you can figure out yourself how to achieve the same goal in openVAS. This plugin requires some specific settings to be configured in nessus. First of all, since the plugin is not signed, you will need to edit nessusd.conf (/opt/nessus/etc/nessus/) and all non-signed scripts : If you want to use the transform functionalities and vendor fingerprinting (via the backoff technique), you will need to configure nessus to allow a long plugin timeout. Both of these functionalities can take a long time to complete, so I would advise you to change the plugins_timeout value in nessusd.conf and set it to a high value (f.i. 1800 seconds)"
