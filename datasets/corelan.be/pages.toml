["https://corelan.be/index.php/2008/07/21/free-tool-attachment-filtering-with-exchange-2007-custom-transport-agent"]
title = "Free tool – Attachment filtering with Exchange 2007/2010 (custom transport agent) | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = "Keywords : microsoft exchange 2007 attachment size filtering quarantine block reject small zip files attached When messaging admins need to implement some sort of attachment filtering, they mostly think about antivirus products, or using transport rules in Exchange 2007. I have discovered that not a lot of antivirus products nor the Exchange 2007 built-in functionalities"
full_description = "Keywords : microsoft exchange 2007 attachment size filtering quarantine block reject small zip files attached When messaging admins need to implement some sort of attachment filtering, they mostly think about antivirus products, or using transport rules in Exchange 2007. I have discovered that not a lot of antivirus products nor the Exchange 2007 built-in functionalities really allow a lot of flexibility when it comes down to filtering attachments based e.g. on attachment size. Suppose you want to block individual zip files based on their size (e.g. block or quarantine zip files that are smaller than 60kb), then you will have a hard time doing this. While this may sound basic functionality, the reality is that not a lot of AV products can do this, or the products that can, are quite expensive. Most of the tools can take drop/strip/quarantine actions based on email size, but not on the individual attachment size. So if your policy states that you are not allowing zip files smaller than 60Kb, somebody could easily bypass this rule by sending 61 zip files of 1Kb… Big problem. Especially when you realize that some of the commercial tools have this feature available in earlier versions of Exchange, and Lotus Domino as well. I had a call with the support center of one of these vendors 2 days ago, and they told me that they simply cannot implement this because of Exchange 2007… Can you imagine this ? Anyways, they’ll probably fix it in the future, but I need the attachment filter today. Period. Anyways… to prove that they are wrong – no really, to fix my own problem (and perhaps your problem), for free, I decided to write my own Transport Agent for Exchange 2007. I wrote this tool over the weekend, so I have not been able to fully stress-test it, but it works just fine in my environment. Mandatory : – PVEExchAttachFilterTptAgent.dll : this is the transport agent that will take care of the attachment filtering. Every email that is processed by this dll will be stamped by a custom header entry called “X-PVEExchAttachFilter”. Emails that already contain this header will not be processed by the Transport Agent. This ensures that we will be able to release emails from quarantine later on. Of course, this also introduces a security risk. After all, if someone decides to craft a custom email from the internet to your network, already containing this header, that email would not get processed. That is why I have written another transport agent called “PVEExchAttachFilterTptAgentCleanEdge” (see later). You can put that second Agent on your Edge servers. This agent will simply remove the X-PVEExchAttachFilter from all emails. – chilkatDotNet2.dll : this is the helper dll that will allow me to send emails etc"
