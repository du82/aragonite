["https://www.corelan.be/index.php/security/corelan-team-members/membership-how-to"]
title = "Corelan Team Membership | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = "This page outlines the process/procedure and rules on how to become a Corelan Team Member, and what rules to follow if you want to remain a Corelan Team member. How to become a Corelan Team Member ? 1. Don't beg. Don't solicit. You need to be invited/contacted by a Corelan Team Member. 2. You will"
full_description = "This page outlines the process/procedure and rules on how to become a Corelan Team Member, and what rules to follow if you want to remain a Corelan Team member. 2. You will need to provide proof that you have found at least one vulnerability, and provide proof that you have performed responsible disclosure. (send us a copy of your communication with vendor/developer and include contact info/other proof so we can verify that the vulnerability discovery and communication is legit) 3. You need to provide proof that you are dedicated and willing to help other people (on Corelan forums, other forums, IRC, etc). Just telling people to “Google” for info is not what we consider to be helpful. Tips : You need to be active. We are looking for proof that shows that you help other people on public forums. You can also register on the Corelan forum and help other people… Just make sure your work is visible & make sure we can see it (you can send us a link to your forum profile using the contact form at the bottom of this page) 4. You will need to pass a little chat with corelanc0d3r or anyone else from the Corelan Inner Circle (MSN). (Make sure to install OTR (cypherpunks) prior to the chat. 5. When the first 4 steps have been taken, you will become a junior member of the team. At that point, you will be requested to 1. Never use the knowledge, bugs, exploits, tools etc for illegal hacking/activity. Don’t do anything illegal in general. You can use tools/scripts/bugs/exploits/… as part of professional assignments, or in a controlled environment / an environment that you own. In any case, do not perform any activity on a host or network if you were not given explicit permission to do so. No member of Corelan Team can ever be held responsible for illegal activities performed by members of the team. 2. Don’t sell/spread ‘secrets’ / ‘techniques’ / ‘new bugs’ / … discovered by Corelan Team members, or discussed in the team unless all members agree. If new bugs are found, and poc/exploit code is written, do not make the code public until the team agrees. Do not even make the bug public until the team agrees (even if it does not mention the application name). (also, see step 4 about responsible disclosure)"
