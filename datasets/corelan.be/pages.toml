["https://corelan.be/index.php/disclosure-policy"]
title = "Corelan Vulnerability Disclosure Policy | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = 'Corelan Vulnerability Disclosure Policy This document describes the security vulnerability disclosure policy of Corelan Team. It is the official policy of Corelan Team members (referred to as "us" or "we" hereafter) to exercise the responsible/coordinated disclosure of security vulnerabilities in a manner which is of maximum value to all affected parties. Corelan reserves the right'
full_description = "It is the official policy of Corelan Team members (referred to as “us” or “we” hereafter) to exercise the responsible/coordinated disclosure of security vulnerabilities in a manner which is of maximum value to all affected parties. Corelan reserves the right to change this policy at any time, without prior notice. Current version : v1.7, last changed on april 29, 2011, 10:26 Brussels time : added link to attrition First of all, Corelan has nothing but good intentions. We want to report a bug in your application, and we want to have the freedom to make details about the bug publicly available after you have fixed the bug, or if you ignored our report, or if you decide not to work with us. We assume that none of these actions are illegal, unless you specify otherwise (and can prove that it is). The idea behind this policy is to define some agreements in terms of timings and procedures, and to express our good intentions to you. At the same time, we like you to approach this in a positive and constructive way. If you believe (and can prove) that disclosing the details about a given vulnerability in your application is illegal, you have to mention this specifically and provide us with that proof. So if you believe we are breaking laws or agreements by finding a bug/vulnerability or by reporting this bug/vulnerability to you, or to the public, you will have to tell us explicitly in your first response after we have reported something to you (within 7 working days). After all, at this point we only want to report a bug/vulnerability in your application and we believe it is fair to state that reporting or exposing details about a bug is not illegal. Keep in mind that bugs/vulnerabilities are disclosed every day. A good amount of these disclosures are not the result of a responsible/coordinated disclosure process. So the fact that we have contacted you means that we want to work with you and don’t want to cause any damage. We believe, from a commercial point of view, it makes sense for you to get the opportunity to fix the bug before we publish the details."
