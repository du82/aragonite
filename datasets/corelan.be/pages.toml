["https://www.corelan.be/index.php/2008/07/27/free-tool-cisco-ironport-c350-safelist-blocklist-merge-utility"]
title = "Free Tool – Cisco Ironport C350 Safelist / Blocklist merge utility | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = "If you have multiple Cisco Ironport C350 devices, you may have noticed that safelist / blocklist entries are bound to an individual device. So if your Ironport devices are both installed to handle incoming mails, end users need to manage safelists/blocklists on both devices in order to be sure that both devices operate in the"
full_description = "If you have multiple Cisco Ironport C350 devices, you may have noticed that safelist / blocklist entries are bound to an individual device. So if your Ironport devices are both installed to handle incoming mails, end users need to manage safelists/blocklists on both devices in order to be sure that both devices operate in the same way. This is a problem, because, to an end user, it should not matter where they manage the safelist/blocklist, they only want to do it just one time and on one device, and not multiple times. In order to capture the safelist/blocklist database from multiple devices, merge the lists, and then activate the merged lists on all devices, you would need to use the backup & restore features. The Cisco Ironport CLI allows admins to create a backup of the configuration, but surprisingly this does not include the safelist/blocklist database. The management GUI allows administrators to backup & restore safelists/blacklists, but it cannot be scheduled. Cisco Ironport support has told me that there is no way to do this. All of these actions are CLI commands, so you can build a batch script file and use Windows Scheduled Tasks to run this at any given time. 1. The server/computer running the script must have access to the Ironport interfaces that are activated for management. 2. The Ironport must be configured for management over HTTPS and SSH, and must allow FTP access as well. If there is a firewall between the server/computer running the scripts and the interface that hosts the management ports, the ports for HTTPS, SSH and FTP must be open ------------------------------------------------------- PVE Cisco Ironport Safelist and Blocklist Merge utility http://freetools.corelan.be peter.ve@telenet.be July 2008 Version 1.0.0.1 ------------------------------------------------------- Current date & time : 27/07/2008 13:09 ------------------------------------------------------- ===== Unlicensed copy ===== Usage : ------- Create request for license file : -lic Get Safelist & blocklist from device : -h <Ironport host> -p <https port> -fp <ftp port> _"
