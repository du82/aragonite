full_description = "Scenario : OpsMgr SP1 (RC, but problem also exists in the RTM version) on Windows Server 2003 SP2 fully patched, OpsMgr agents deployed to various servers. WMI ADAP was unable to create the object Win32_PerfRawData_ASPNET_2050727_ASPNETAppsv2050727 for Performance Library ASP.NET_2.0.50727 because error 0x80041001 was returned Event ID 35 Source : WinMgmt Category : None Type : Warning WMI ADAP was unable to load the ASP.NET_2.0.50727 performance library because it returned invalid data: 0x0 Event ID 40 Source : WinMgmt Category : None Type : Warning WMI ADAP was unable to create the object Win32_PerfRawData_ASPNET_2050727_ASPNETAppsv2050727 for Performance Library ASP.NET_2.0.50727 because error 0x80041001 was returned I filed a bug report to Microsoft regarding this issue (in februari 2008, see http://connect.microsoft.com/OpsMgrFeedback/feedback/ViewFeedback.aspx?FeedbackID=328738). Other people indicated that they could reproduce the bug, and Microsoft was able to reproduce the bug and determined that this was caused by certain .Net framework updates. So far so good. This Microsoft KB article that explains how to fix this can be found at http://support.microsoft.com/kb/951683/en-us Also, have a look at http://mcpguides.com/?p=38, which explains how to set up a workaround for this (basically, it explains how to disable the performance counters for ASP.Net). If you want to fix this problem as opposed to bypass the problem, you will either have to contact CSS (http://support.microsoft.com/contactus/?ws=support) or visit this hotfix page in order to get the fix. Are you interested in learning how to write exploits for Windows, but perhaps looking for updated materials? Are you struggling to fully grasp the concepts based on what you find online? Would you perhaps prefer to learn in a classroom setting instead? Did you know that we travel to strategic places around the world, to teach our world-renowned exploit development classes. In order to preserve and ensure a top-quality learning experience, all of our classes are delivered in-person."
