["https://www.corelan.be/index.php/2014/06/03/cso-common-sense-operatoroperations"]
title = "CSO : Common Sense Operator/Operations | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = '''As the CSO/CISO/person responsible for Information Security, your job is to... well ... do you even know? Does upper management know? "Our crappy CSO ..." and "Our stupid CSO ..." are statements commonly used by various (techie) people, throwing their hands up in despair, attempting to prove that their CSO doesn't understand technology and has'''
full_description = 'As the CSO/CISO/person responsible for Information Security, your job is to… well … do you even know? Does upper management know? "Our crappy CSO …" and "Our stupid CSO …" are statements commonly used by various (techie) people, throwing their hands up in despair, attempting to prove that their CSO doesn’t understand technology and has no idea what he or she is doing. Point taken, some of the CSO’s/CISO’s I know don’t have a background in Systems Administration, System Engineering and have no hands-on experience with Information Security work. At the same time, the CSO position is often driven by a need to be compliant to X and Y and by business economics/priorities (growth, revenue, stability, performance, etc). Even though the CSO may understand the need for a Risk Management based approach, including all bells and whistles, his or her problem may not be around failing to understand "what he should or shouldn’t do", but about "what he or she is allowed to do". It doesn’t make the CSO stupid, life is not that black and white, but if he or she fails to share these constraints with co-workers, he or she might be badly understood in general. In order to still achieve certain things in a pragmatic way, it might help if both CSO’s & tech people try to take some steps to close the gap between technology and business requirements. Or, in other words, it might help the CSO to do the things that *should* be done, without compromising the business goals. I started my career as a Systems Administrator, Systems Engineer and Network Engineer more than 15 years ago. Information Security was just a "hobby" and wasn’t added to my responsibilities until later. I became the CISO for a pan-European company 2.5 years ago and I must admit, I have struggled to make the transition from being a techie to working on less techie stuff. In fact, one of the things that can be quite difficult as a former-techie-now-manager, is when you realize that a certain defense measure won’t be 100% effective because you *know* that there are ways around it. At the same time, it’s still a good idea to apply the defensive technique because it’s better than doing nothing. Putting things in perspective, we’re merely trying to implement various layers of defense, in an attempt to make the life of a criminal as hard as possible, in all phases of a potential attack. In this short blog post, I’ll share some of my experiences and I’ll try to provide my 2 cents on some of the things you can do to make your environment more secure, by applying common sense.'
