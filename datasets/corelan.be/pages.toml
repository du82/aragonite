["https://www.corelan.be/index.php/2008/05/19/free-tool-exchange-2007-outbound-smtp-gateway-redundancy"]
title = "Free Tool – Exchange 2007 Outbound SMTP gateway redundancy | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = "(a.k.a. PVE Exch2007 Rerouter manual) Keywords : Exchange 2007 outbound SMTP relay redundancy SendConnector outgoing mail high availability Microsoft Exchange 2007 allows you to consolidate your messaging infrastructure and host more users on one server. Combined with the introduction of new server roles, Exchange 2007 allows for high levels of redundancy and resilience, ensuring uptime"
full_description = "Keywords : Exchange 2007 outbound SMTP relay redundancy SendConnector outgoing mail high availability Microsoft Exchange 2007 allows you to consolidate your messaging infrastructure and host more users on one server. Combined with the introduction of new server roles, Exchange 2007 allows for high levels of redundancy and resilience, ensuring uptime and availability. However, there might be a specific yet not uncommon scenario where availability may not be guaranteed without administrator intervention. This scenario is related to outgoing SMTP emails, using a third party relay server, and 2 sites that are connected over a (very expensive) WAN connection. Note : I have intentionally left out some redundancy components such as clustering, because they are irrelevant in this post. Site A has a mailbox server, a HUB/CAS server, a local internet connection, and a third party SMTP relay server that is hosted in the DMZ Site B has a standby mailbox server, a HUB/CAS server, a local internet connection with a different ISP, and a third party SMTP relay sitting in its own DMZ. Building redundancy for incoming smtp emails from the internet is not very hard. Each domain name has 2 MX records. One pointing to the relay server in site A, the other one pointing to the relay server in site B. But there is a problem with outgoing emails. Each HUB server has a SendConnector that points to the local SMTP 3rd party relay server in the local DMZ. But what will happen if the local internet connection in site A goes down, and the SMTP relay server is still up and running ? The HUB server in Site A is not aware of the internet connection state, and will still continue to route outgoing emails to the local SMTP relay. Emails will be queued until the connection becomes available again. But sometimes you don’t know when the connection will be up and running, and you may not even be able to change routing configuration because the internet connection went down at night and you cannot VPN into the office to solve the problem."
