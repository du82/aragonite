["https://www.corelan.be/index.php/2011/07/14/mona-py-the-manual"]
title = "mona.py – the manual | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = "This document describes the various commands, functionality and behaviour of mona.py. Released on june 16, this pycommand for Immunity Debugger replaces pvefindaddr, solving performance issues and offering numerous new features. pvefindaddr will still be available for download until all of its functionality has been ported over to mona."
full_description = 'Released on june 16, this pycommand for Immunity Debugger replaces pvefindaddr, solving performance issues, offering numerous improvements and introducing tons of new features. pvefindaddr will still be available for download until all of its functionality has been ported over to mona. Together with the release of this documentation, we are also proud to be able to release mona.py v1.1 . When you have downloaded mona.py, simply save the file into the PyCommands folder. In a typical installation, this folder is located here : Open the log window (ALT-L) and you should get a full page of information about mona (options and commands) At the top, you can find the global options. The second half of the output contains all available commands. Before using mona, I strongly recommend making sure you are running the latest version. If you are using the stable release, you won’t see updates that often (new version releases are often announced on twitter or Google+). Updating is very simple. Make sure your device has access to redmine.corelan.be (https or http) and run By default, a connection is made to https://redmine.corelan.be. If, for whatever reason, you are unable to use https, you can use the -http switch to force the use of http: One of the issues we had with pvefindaddr was the fact that all output was written into the Immunity Debugger program folder. Since the output files for a given command, ran on different applications, carry the same name, you would basically end up overwriting the previous output. Mona allows you to group the output and write then into application specific folders. In order to activate this feature, you will need to set a configuration parameter, for example : This will tell mona to write the output to subfolders of c:\logs. The %p variable will be replaced with the process name currently being debugged. Note that, if you are not debugging an application, Immunity returns the name of the previously debugged application. In order to prevent mona from writing files into an application folder at that time, mona also checks for the process ID of the debugged app. If the pid is 0 (= not attached), then output will be written into a folder “_no_name”'
