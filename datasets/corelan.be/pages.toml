["https://www.corelan.be/index.php/2007/10/12/exchange-2007-administration-antispam-and-content-filtering"]
title = "Exchange 2007 Administration : Antispam and Content Filtering | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = 'Enable content filtering on a HUB Transport server If you want to enable the content filter on a HUB transport server, run the "./install-AntispamAgents.ps1" script from the %Program Files%\Exchange Server\Scripts folder. Next, restart the Microsoft Exchange Transport Service by running Restart-Service MSExchangeTransport. (http://www.exchangepedia.com/blog/2006/09/how-to-install-anti-spam-agents-on-hub.html) Enabling IPBlockListProvider on a HUB that does not directly accept incoming internet'
full_description = 'If you want to enable the content filter on a HUB transport server, run the "./install-AntispamAgents.ps1" script from the %Program Files%\Exchange Server\Scripts folder. Next, restart the Microsoft Exchange Transport Service by running Restart-Service MSExchangeTransport. (http://www.exchangepedia.com/blog/2006/09/how-to-install-anti-spam-agents-on-hub.html) If the Hub transport is responsible for performing content filtering, and the HUB does not receive incoming internet emails itself (but receives the messages from a relay server), then all incoming connections will appear to be coming from that relay server (and not from the "real" IP address of the sender’s mailserver). This means that options such as Real Time block lists (IP Block List Provider in 2007) won’t work properly. You can solve this by telling the transport engine on the HUB to treat certain IP addresses as internal and skip those IP addresses in the email header. Suppose you want to define 192.168.1.3 and the entire 10.1.2.0/24 IP range as internal, run this script on the HUB transport : set-transportconfig -InternalSMTPServers "192.168.1.3","10.1.2.0/24" You can read more info about IP Block List providers at http://technet.microsoft.com/en-us/library/bb124369.aspx and http://exchangepedia.com/blog/2006/12/exchange-server-2007-how-are-rbls.html . Depending on your setup, you may need to add 127.0.0.1 to the list of InternalSMTPServers. Use a sniffer such as wireshark to ensure that everything is set up correctly. Example : I have installed a POP3 collector on one of my servers. This connector connects to the POP3 mailserver of my ISP and downloads my emails. Next, it uses SMTP to connect to my own internal Exchange server to deliver the messages to my local user. The connection to my Exchange server always originates from a local IP address in my network. And if I skip those local IP addresses, I even have to skip the IP address of my ISP’s SMTP servers. So I created a transportconfig that looks like this : [PS] C:\>set-transportconfig -InternalSMTPServers "195.130.137.0/24","195.130.136.0/24","195.130.132.0/24","192.168.0.0/16","127.0.0.1" [PS] C:\>Get-TransportConfig ClearCategories : True GenerateCopyOfDSNFor : {5.4.8, 5.4.6, 5.4.4, 5.2.4, 5.2.0, 5.1.4} InternalSMTPServers : {195.130.132.0/24, 192.168.0.0/16, 127.0.0.1, 195.130.137.0/24, 195.130.136.0/24} JournalingReportNdrTo : <> MaxDumpsterSizePerStorageGroup : 18MB MaxDumpsterTime : 7.00:00:00 MaxReceiveSize : unlimited MaxRecipientEnvelopeLimit : unlimited MaxSendSize : unlimited TLSReceiveDomainSecureList : {} TLSSendDomainSecureList : {} VerifySecureSubmitEnabled : False VoicemailJournalingEnabled : True Xexch50Enabled : True As you can see, I’m ignoring my local IP addresses and the ISP IP addresses, and localhost. The "IP block List provider" filter will now ignore those IP addresses and (hopefully) only look for the IP address of the server that delivered the email to my ISP’s mail server (which is exactly what I want my server to look for). I’ve sent a test email from my mailserver at work (81.246.74.58) and the wireshark sniffer shows this :'
