["https://www.corelan.be/index.php/2014/05/30/hitb2014ams-day-2-exploring-and-exploiting-ios-web-browsers"]
title = "HITB2014AMS – Day 2 – Exploring and Exploiting iOS Web Browsers | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = "iOS Browsers & UIWebview iOS is very popular (according to StatCounter, it's the 3rd most popular platform used). Mobile browsers take about 20% to 25% of the market share. iOS offers integration with desktop browsers and cloud (so the same data is available to an attacker). Many 3rd party IOS browsers have similar weaknesses which"
full_description = "iOS is very popular (according to StatCounter, it’s the 3rd most popular platform used). Mobile browsers take about 20% to 25% of the market share. iOS offers integration with desktop browsers and cloud (so the same data is available to an attacker). Many 3rd party IOS browsers have similar weaknesses which are sitll copied to new browsers… and iOS is adopted by certain bug bounties :) The default iOS browser is Mobile Safari. According to the iOS App Store Review Guidelines, “2.17 apps that browse the web must use the iOS WebKit Framework and WebKit Javascript”. Of course, Mobile Safari is not the only browser available in the Apple Store, some of them are also used on Desktops. Browsers are built using UIWebView, which is a component that allows you to include web content inside an application. The key differences between UIWebView and the native Mobile Safari are focused around the UI. They both use WebKit at the core, but the native browser uses Viewport instead of UIWebView. The UIWebVIew API is quite simple and straightforward. It allows you to get remote files/html strings/binary data and you can program some basic navigation functions (goBack, goForward, stopLoading, reload). the stringByEvaluatingJavaScriptFromString function allows you to execute javascript from a string, and it will have the same privileges as the page it was taken from (request.mainDocumentURL). The remote webserver can block the execution of javascript by using a Content-Security-Policy (CSP). Javascript is used to implement browser features and to override native functions to bridge them with Objective-C code to, for instance, implement multiple tabs. Finally, the UIWebViewDelegate API allows you to respond to certain events in the loaded documents. The presenters explain that their research was primarily focused on the behaviour around multiple tabs, address bar, autocomplete & password manager, downloads, support for untrusted SSL certificate and other features (safety ratings, malware protection, cloud integration). They explain that they were inspired by the “Browser Security Handbook” (http://browsersec.googlecode.com), which offers a set of testcases that you can run on your browser. (see http://browsersec.googlecode.com/files/browser_tests-1.03.tar.gz). Additionally, they performed black-box testing from a web perspective, review of Javascript code and a bit of reversing/debugging. They prepared some cross-browser test cases and made them available at https://ios.browsr-tests.com"
