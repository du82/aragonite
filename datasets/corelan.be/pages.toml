["https://www.corelan.be/index.php/2016/01/06/crypto-in-the-box-stone-age-edition"]
title = "Crypto in the box, stone age edition | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = "Introduction First of all, Happy New Year to everyone! I hope 2016 will be a fantastic and healthy year, filled with fun, joy, energy, and lots of pleasant surprises. I remember when all of my data would fit on a single floppy disk. 10 times. The first laptops looked like (and felt like) mainframes on"
full_description = 'First of all, Happy New Year to everyone! I hope 2016 will be a fantastic and healthy year, filled with fun, joy, energy, and lots of pleasant surprises. I remember when all of my data would fit on a single floppy disk. 10 times. The first laptops looked like (and felt like) mainframes on wheels and the entire internet could probably be stored on a single hard drive. Things have changed. Technology allows us to be truly mobile. Mobility is no longer a device, but a concept, a way of living. We’ve gotten used to being able to access anything anywhere, anytime; so "storing a floppy in a locked desk to keep it safe" is no longer a viable option for most of us. The increased digitalization and portability comes with an increase of exposure and risk. This is 2016, and luckily we found ways to keep our stuff safe, right? Just "encrypt your stuff", people say. Encrypt your communications, encrypt your data. Encrypt encrypt encrypt. We’ve been hearing this for years, so technology must be ready for it too, right? As the amount of data and the importance of data increases, and as a person who travels a lot, I decided to start using "cloud" storage as my main form of backup a few years ago. To make things clear, I consider "cloud" to be "someone else’s computer", and thus – by definition – a location that I don’t trust. Also, the use of cloud storage is not necessarily a result of my frequent travel endeavours, but rather just an easy way to store data (and backups) off-site. It solves many problems, but it also comes with a new challenge: fix the "trust" issue. Of course I am using full hard drive encryption. Piece of cake. Pretty much all Operating Systems allow you to do this out-of-the box, in certain cases your hard-drive even supports it natively. Guess what, it doesn’t really protect my data when it gets synced to the cloud. On top of that, as soon as my laptop is running, the hard drive encryption doesn’t do much more than slowing down my machine (sigh). Overall, it’s probably a smart thing to do (layered defense and all), but it doesn’t solve anything as soon as you want to use your device.'
author = "Peter Van Eeckhoutte (corelanc0d3r)"
year_published = 2016
