["https://www.corelan.be/index.php/2008/02/20/monitoring-modems-with-opsmgr-2007"]
title = "Monitoring modems with OpsMgr 2007 | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = "In this short post, I'll explain one of the techniques to monitor whether a modem is listening for incoming calls on a machine, using Operations Manager 2007. Assuming that you may have some modems that get turned on when someone needs to dial in (for whatever reason), and *should* be disconnected afterwards. So you would"
full_description = 'In this short post, I’ll explain one of the techniques to monitor whether a modem is listening for incoming calls on a machine, using Operations Manager 2007. Assuming that you may have some modems that get turned on when someone needs to dial in (for whatever reason), and *should* be disconnected afterwards. So you would like to get alerted when a modem is turned on and RRAS is configured to put the modem in listening mode. Target Windows Operating System. Keep the monitor disabled for now. Save the monitor in a custom management pack. Script : choose a good name for the script (e.g. checkifmodemison.vbs) and set the timeout (1 minute should be ok) Call oAPI.LogScriptEvent(Wscript.ScriptName,101,2,Wscript.ScriptName + " script was called without the necessary 2 arguments ( and was not executed.") Call oAPI.LogScriptEvent(Wscript.ScriptName,101,0,Wscript.ScriptName+" script was launched with " + Cstr(oArgs.Count) + " arguments.") Call oAPI.LogScriptEvent(WScript.ScriptName,101,0,WScript.ScriptName+" script completed successfully. ModemTurnedOn : "+modemturnedon) If the modem is turned off again and RRAS does no longer grab the comport , the alert will be resolved (if that is how you’ve set up the alerting properties) Are you interested in learning how to write exploits for Windows, but perhaps looking for updated materials? Are you struggling to fully grasp the concepts based on what you find online? Would you perhaps prefer to learn in a classroom setting instead? Did you know that we travel to strategic places around the world, to teach our world-renowned exploit development classes. In order to preserve and ensure a top-quality learning experience, all of our classes are delivered in-person. I also teach private classes! For larger groups, I’ll glady come to you. For smaller groups, willing to travel to Belgium, I’ll provide a training room near Bruges. >>> Our classes tend to sell out fast, so sign up today and secure your seat in one of our classes !! <<<'
