["https://www.corelan.be/index.php/2010/10/12/death-of-an-ftp-client"]
title = "Death of an ftp client / Birth of Metasploit modules | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = 'Over the past few weeks, Corelan Team has given its undivided attention to fuzzing ftp client applications. Using a custom built ftp client fuzzer, now part of the Metasploit framework, the team has audited several ftp clients and applications that use an embedded client ftp component. One example of such an application is a tool that would synchronize / backup data from a computer to a remote ftp server. The 3 main audit/attack vectors that were used during the "project" were send back overly long responses to ftp commands / requests sent by the ftp client to the server send back a file/directory listing that contains overly long file/folder names try to download a file that has an overly long filename.'
full_description = 'Over the past few weeks, Corelan Team has given its undivided attention to fuzzing ftp client applications. Using a custom built ftp client fuzzer, now part of the Metasploit framework (svn r10658 and up), the team has audited several ftp clients and applications that use an embedded client ftp component. One example of such an application is a tool that would synchronize / backup data from a computer to a remote ftp server. As mentioned earlier, in order to facilitate the initiative and fuzzing process, a custom ftp client fuzzer was implemented as a Metasploit module. Since this fuzzer was added to the Metasploit trunk, you can get a copy of the module by installing/updating the svn (trunk) version of metasploit : When the process completes, you’ll have a copy of a svn version of Metasploit in /pentest/exploits/trunk. I used the /pentest/exploits folder because that folder is where metasploit3 (and some other stuff) is located in BackTrack 4. If all went well, you should find a file called “client_ftp.rb” under /pentest/exploits/trunk/modules/auxiliary/fuzzers/ftp. The fuzzer acts as an ftp server and is designed to send specific responses back to the connected ftp client. The module can handle PASV connections. This is how you can launch the fuzzer from inside a Metasploit console, and list the available options : (I used the -n option to load msfconsole without database support, which makes the console load a little faster) As soon as a client connects, some logging will be written to the Metasploit console, so you can trace back what happens and find out how long the fuzzdata payload was at the time the ftp client crashed : If you want to change some of the settings, simply press CTRL+C, change the options, and issue "run" again. Using the Metasploit module, Corelan Team has discovered more than a dozen ftp client applications that were vulnerable. A lot of older applications appeared to be vulnerable to classic stack based buffer overflows / memory corruption, but also a number of more recent applications were found vulnerable too. In any case, we tested the most up-to-date versions of the ftp clients, available at the time of the tests (august/september 2010).'
