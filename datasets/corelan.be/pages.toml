["https://www.corelan.be/index.php/about-us/about-me"]
title = "About me | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = "Hi, My name is Peter Van Eeckhoutte. I was born in 1975 and spent my childhood in a small town called Vichte, Belgium. 14 years later, I got my first computer and about 5 years later I started working in a computer shop where I was responsible for the technical department, servers/network installations, etc... I"
full_description = "My name is Peter Van Eeckhoutte. I was born in 1975 and spent my childhood in a small town called Vichte, Belgium. 14 years later, I got my first computer and about 5 years later I started working in a computer shop where I was responsible for the technical department, servers/network installations, etc… I finished my Bachelor degree in IT at the same time. In 2000, right after the Y2K hype, I was hired by a big company to serve as Systems Administrator. My main responsibility was taking care of the servers and network, and shortly after I became part of the Center of Excellence for Security and Messaging for our European sister companies. About one year later, I became a member of the Core Active Directory Team and Security Competence Center for the entire corporation (worldwide) and was appointed “IT Security Officer”. In 2006/2007, our European group of companies has been acquired by another big company and we have merged with another large company early 2009. All of this has given me the opportunity to work with some great people all over the world, manage complex projects and keep my never-ending drive to gather knowledge alive. Until mid June 2009, I have been serving as IT Infrastructure Manager (and IT Security Officer) at the very same company, managing an excellent team of Helpdesk/PC Support/Network Engineering/Systems Engineering folks, trying to do as much “hands-on” operations as possible. On June 15th 2009, I was appointed IT Infrastructure Manager Northern Europe, adding our sister companies in the Netherlands and Germany to my responsibilities. In September 2009, I founded the Corelan Security Team, gathering a group of security enthusiasts, who all share the same common interests : research, learn and share. Since that date, the team has been working with tons of vendors, reporting numerous bugs, requesting vendors to fix, and performing coordinated disclosure, with the aim to make this digital world a little bit safer. In April 2011, I founded Corelan GCV,the legal entity behind the corelan training activities. In January 2012, I became the CISO | Corporate IST Security Officer at the company I have been working for since 2000. In September 2014, I became the Director of IST Infastructure Services and Security at the same company."
