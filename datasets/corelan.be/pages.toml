["https://www.corelan.be/index.php/2010/11/12/metasploit-module-http-form-field-fuzzer"]
title = "Metasploit module : HTTP Form field fuzzer | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = "Introduction About a month after releasing an ftp client fuzzer module for Metasploit, I decided to release yet another fuzzer module I have been working on over the last few weeks. This new module can be used to audit web servers/web server plugins/components/filters, by fuzzing form fields and optionally fuzz some header fields. While this"
full_description = 'About a month after releasing an ftp client fuzzer module for Metasploit, I decided to release yet another fuzzer module I have been working on over the last few weeks. This new module can be used to audit web servers/web server plugins/components/filters, by fuzzing form fields and optionally fuzz some header fields. While this type of fuzzing/audits most likely won’t reveal bugs in the most common webserver platforms themselves (Apache, IIS, etc), I am convinced that there are a lot of other web server components out there that may not properly validate input from form fields or header fields. This new fuzzer module was added to the Metasploit framework earlier today (svn release r11013 and up), and can be found in /modules/auxiliary/fuzzers/http. The module file is called http_form_field.rb If you are using a svn based copy of the framework, you can get the module very easily (and all future updates) by updating your svn copy. More info about creating a svn copy and about updating the svn can be found in the post about the client ftp fuzzer module. Important note : if you want to clear a certain option, don’t set it to an empty string (set ""), but use the unset command : unset Let’s use the module to test the Integard admin login page (and reproduce the vulnerability that was reported here). I installed a vulnerable copy of Integard Home on a test computer (192.168.201.1). From my attacker machine, I can access the login page on port 18881 : Configuring the Metasploit form field fuzzer for this case is really easy. We only have one form, so we can try to let the plugin auto-configure itself. The only 3 parameters we’ll need to specify are : The URL option already contains "/", so that will work fine in this case. The default field types are "text", "password" and "inputtextbox", so that means that the fuzzer will only look at the password field. You will notice that the fuzzer will report a "No response" when fuzzing the password field with 2000 bytes. Look at the debugger :'
