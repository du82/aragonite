["https://www.corelan.be/index.php/2008/07/14/windows-2008-pki-certificate-authority-ad-cs-basics"]
title = "Windows 2008 PKI / Certificate Authority (AD CS) basics | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = "Keywords : Windows 2008 PKI Certificate Authority certutil certreq template root CA Enterprise CA convert pfx to pem generate custom certificate request subject alternate name san attribute Today's blog post targets the deployment of a Windows 2008 server based Certificate Authority (AD CS) and will discuss some common scenario's where certificates are used / required."
full_description = "Keywords : Windows 2008 PKI Certificate Authority certutil certreq template root CA Enterprise CA convert pfx to pem generate custom certificate request subject alternate name san attribute Today’s blog post targets the deployment of a Windows 2008 server based Certificate Authority (AD CS) and will discuss some common scenario’s where certificates are used / required. Finally, I will show some scripts that can be used to manage your CA, backup your CA, distribute CRL’s, create custom certificate requests, convert keys etc… Before starting the installation of the Certificate Authority components on a 2008 server, it is important to think about the design of your CA infrastructure. In any case, even if you are just a small company, I would highly recommend deploying at least a 2 tier model, which consists of an offline standalone root CA, and one or more issuing/policy CA’s. Let’s asume that we are going to set up a classic 2 tier CA topology. If your hierarchy looks different, then most of the settings will still apply, but you need to think about the pathlength in your Issuing or Intermediate CA setup CAPolify.inf file (see later). The standalone root CA will work fine on a Windows 2008 server standard edition. 32bit – 64bit… it doesn’t matter. The machine should be offline anyway. This machine will only be used to create the primary (root CA) certificate, and to sign the certificate for the issuing CA. Furthermore, the root CA should not be member of a domain, and should be hardened. You can use the SCW and/or GPO Accelerator tools to secure the host. If budget permits, I would highly recommend using Windows 2008 server Enterprise edition for the issuing CA. This will allow you to create custom templates, which will provide you with much more flexibility in the end. Of course, if you don’t have budget, 2008 standard edition will work as well. Even 2003 or 2000 CA’s will work. This blog post will assume that you are using Windows 2008 server Enterprise edition. If you are using standard editions, skip everything about custom templates (see later). Keep in mind : CA running on Windows server standard edition only supports v1 templates."
