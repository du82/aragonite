title = "PVE TCP Ping Utility | Corelan Cybersecurity ResearchCorelan Cybersecurity Research"
description = "PVE TCP Ping Utility"
full_description = "I wanted to share a small utility that I wrote a while ago, allowing you to run a non-interactive ‘ping’ to a tcp port (e.g. from within a script). This could for example allow you to bring up a VPN tunnel from a script (by generating traffic to a target host), to determine whether a tcp port is open or not and so on… I’m sure all of you are creative enough to see the wide range of possibilities and applications for this utility. The tool is a command-line utility, should run on Windows 32bit and 64bit, and requires .Net framework 2.0. Unzip the file and place the file pvetcpping.exe somewhere on your harddrive, preferable in a folder that is part of your PATH variable (e.g. c:windowssystem32) As you can see, there are 3 possible parameters. The target host and target port number are mandatory, the number of pings is optional. If you don’t specify a number of pings, then 4 pings will be performed. Are you interested in learning how to write exploits for Windows, but perhaps looking for updated materials? Are you struggling to fully grasp the concepts based on what you find online? Would you perhaps prefer to learn in a classroom setting instead? Did you know that we travel to strategic places around the world, to teach our world-renowned exploit development classes. In order to preserve and ensure a top-quality learning experience, all of our classes are delivered in-person. I also teach private classes! For larger groups, I’ll glady come to you. For smaller groups, willing to travel to Belgium, I’ll provide a training room near Bruges. >>> Our classes tend to sell out fast, so sign up today and secure your seat in one of our classes !! <<< a. Corelan respects your privacy. Most information accessible on or via the Corelan Website is available without the need to provide personal information. In certain cases you may however be requested to submit personal information. In such case your personal information shall be treated in accordance with the