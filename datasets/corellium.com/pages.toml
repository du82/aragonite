["https://www.corellium.com/blog/corellium-virtualization-tools"]
title = "New Mobile Security Testing, Research & Virtualization Tools"
description = "Our new product lines Corellium Solo™, Corellium Viper™ and Corellium Falcon™ offer virtualization tools for mobile security testing and research. Learn more."
full_description = "The Future of Mobile Security With All New Corellium Products Our new product lines Corellium Solo™, Corellium Viper™ and Corellium Falcon™ offer powerful tools for mobile security testing and research. Corellium has been a go-to solution for mobile security researchers, developers, and organizations. We provide a comprehensive set of groundbreaking mobile security testing, research, and virtualization tools. We recognized the need for tailored solutions that better cater to different users’ goals and evolving industry demands. With this in mind, we have expanded our offerings by introducing three product lines: Corellium Solo™, Corellium Viper™, and Corellium Falcon™. Watch our recent webinar hosted by our Chief Evangelist Brian Robison to learn about each product in detail and get an exclusive demo of our latest technology, Corellium with MATRIX™ for automated mobile app security testing. Corellium Solo™: Empowering individual mobile security professionals Corellium Solo™ is designed for individual use and is ideal for those interested in mobile security discovery. For those familiar with Corellium’s core product, Corellium Solo™ is a revamped version of Corellium’s original single-use product account, now offering far more flexibility and power. Its key features include, among many others: support for any device, removing the previous limitations to devices with only two cores snapshotting and cloning capabilities for mobile security testing instant jailbreak access for rapid experimentation Corellium Solo™ is a lightweight solution with enough depth to conduct low-level experiments. While it focuses on individual testing, it doesn't skimp on the critical features that make Corellium such a robust platform. However, for those looking to engage in team-level research or advanced mobile security testing, other product lines may be better suited. Corellium Viper™: Elevating mobile app security testing For businesses and professional services requiring comprehensive mobile application security testing, Corellium Viper™ is the ideal solution. Viper is designed for mobile app security testing (MAST) for iOS and Android. Viper equips your security teams with unprecedented tools for both manual and automated testing, freeing up valuable engineering time and saving money. With the ability to spin up any OS version and hardware model on demand, and to jailbreak or root any version, Viper helps close the security testing gap in your mobile app development lifecycle. The same Viper platform can be used by security teams for pentesting, QA teams for replicating bugs, and dev teams for remediation work. Viper is Available in Two Versions: Viper Essentials Aimed at teams engaging primarily in manual penetration testing, Viper Essentials includes all the core tools necessary for effective security testing but doesn’t include MATRIX automation. Viper Advanced Designed for teams to leverage automated testing, this version brings full automation capabilities through MATRIX. It supports both manual and automated pentesting, enabling faster and more streamlined vulnerability detection. Introducing automated mobile app security testing with MATRIX MATRIX is our latest technology for automated mobile app security testing and reporting. With MATRIX, running hundreds of static and dynamic tests and generating an easy-to-understand assessment doesn’t require special expertise — just install an app on a virtual device, configure the settings, and click a button. Integrating these automated tests with existing CI/CD frameworks is a breeze with our robust set of APIs. Corellium Falcon™: New depths of vulnerability research At the deepest level of mobile security research lies Corellium Falcon™, designed for organizations performing sophisticated mobile vulnerability and threat research. Corellium’s virtual devices are uniquely designed to run natively on Arm processors, providing the performance and fidelity of a real device with the efficiency, scalability, and control of an emulator. Falcon includes purpose-built tools for root access, filesystem manipulation, process tracing, executing self-signed binaries and scripts, kernel debugging and hooking, and much more. With a comprehensive API and connectivity tools like USBFlux, integrating with leading development, security, and forensics tools is seamless. Discovering iOS and Android exploits, researching mobile malware, and validating mitigations has never been simpler. Falcon Comes in Two Versions: Falcon Essentials Falcon Essentials offers all core app pentesting capabilities built-in with additional tooling purpose-built for mobile security research. It is available in all three environments - onsite appliances, cloud environment, and private servers. Falcon Premium Exclusively available for on-premises deployment, Falcon Premium offers deep introspection tools for conducting detailed vulnerability research in an air-gapped environment on-prem. Watch Our Webinar Our new product lines and updates to our Corellium MATRIX™ technology reflect our ongoing commitment to innovate and support security practitioners in performing efficient yet effective mobile app security testing and research. Watch our webinar to learn more about our new products and capabilities. You can also try any of our new product lines for free on our website. Posted November 19, 2024 Tags Corellium Author Corellium Share Copied Copy link LinkedIn Twitter Facebook Keep reading See more Chris Magistrado • Feb 06, 2025 Mastering CTF Mobile Challenges with Corellium Our new product lines Corellium Solo™, Corellium Viper™ and Corellium Falcon™ offer powerful tools for mobile security testing and research. Brian Robison • Jan 29, 2025 Corellium Virtual iOS Devices vs. Apple’s iOS Simulator and Physical Devices: The Ultimate Tool for Penetration Testing Our new product lines Corellium Solo™, Corellium Viper™ and Corellium Falcon™ offer powerful tools for mobile security testing and research. Brian Robison • Jan 13, 2025 2024: Wrestling the Mobile Hydra—No Jailbreaks, More Data Leaks, and Paradigm Shifts Our new product lines Corellium Solo™, Corellium Viper™ and Corellium Falcon™ offer powerful tools for mobile security testing and research. Blog New Mobile Security Testing, Research & Virtualization Tools"
