full_description = '''FOR BUSINESS Corellium Viper Mobile App Security Testing Security pentesting and AppSec teams will love the simplicity of automated report generation combined with powerful mobile app security testing tools for advanced testing and remediation. Learn more Request a trial FOR GOVERNMENT & RESEARCH Corellium Falcon Mobile Vulnerability Research Purpose-built for government organizations and researchers, providing OS-level capabilities and powerful introspection tools not available with physical devices. Learn more Request a trial FOR COMMUNITY INDIVIDUALS Corellium Solo Mobile Security Discovery Community solution for researchers and students for exploring and shifting work from physical to virtual iOS and Android devices. Prices start at $3/device-hour Learn more Request a trial FOR IOT & AUTO Arm Virtual Hardware Powered by Corellium Revolutionize embedded software development with virtualized hardware models. We've partnered with Arm to create a library of processor and system board models. Prices start at $0.50/core-hour Learn more Request a trial Trial FAQ More information to assist you in your trial experience. 01 What does a Corellium free trial request entail? For Falcon and Viper, once we receive your trial request, we'll contact you to confirm a few things. If approved, you will receive a trial invitation by email. For Solo and AVH, once we receive your trial request, we'll contact you only if more information is needed. In all cases, if a trial request is denied, we'll let you know by email usually within 1 business day depending on request volume. 02 What is provided in a Viper trial? Viper trials are Advanced Edition which includes advanced security testing features and our MATRIX automation technology. Learn more about our Viper editions here. 03 What is provided in a Falcon trial? Falcon trials are Essentials Edition. Premium Edition is not available as a cloud service and only provided as onsite Corellium appliances. Learn more about our Falcon editions here. 04 What is provided in a Solo trial? Corellium's Solo trial is for community individuals and students. Learn more about Solo here. 05 What is provided in an AVH trial? We've partnered with Arm in creating "Arm Virtual Hardware (AVH)". You can request a trial and explore a library of available processor and system board models. Please contact us about creating your own custom device models. 06 How long do trials last? The duration period of a trial is typically 14 days unless we specify otherwise. 07 Do you provide sample mobile apps to use during my trial? Yes. After you log in, you'll see a home screen with resources to help you on your way. This includes Corellium iOS and Android test apps to play with. To learn more, visit corellium.com/scenarios. 08 Do I need to provide a credit card? No. You'll only need to provide a payment method if you decide to signup for a subscription. 09 Can I request multiple trials? You may, but you'll have to speak with us to better understand your needs and how we can help. 10 If I sign up after a trial, what payment methods do you accept? For Viper and Falcon, we offer annual subscriptions that are invoiced to your business. For Solo, we offer monthly subscriptions for which we only accept credit cards online. For Arm Virtual Hardware (AVH), you can provide a credit card online or purchase through business invoicing. 11 What is a "device-hour" and a "core-hour?" A device-hour signifies virtual active device usage for one hour, regardless of the number of CPU cores they contain. Devices that are turned off do not consume device-hours. At the end of each subscription period, we round up to the next whole hour after we sum all of the individual device usages together. For example, if 1 device is active for 1.6 hours, and 2 devices are active for 1.1 hours each, total usage is 4 device-hours. A core-hour is similar, but instead of measuring devices, it measures the total CPU cores used within devices. For example, a RPi4 virtual device has a 4 core CPU while an Android-based IoT device may have a 2 core CPU.'''
