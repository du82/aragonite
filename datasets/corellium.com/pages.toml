["https://www.corellium.com/blog/introducing-rd-1ae"]
title = "Introducing the Arm RD-1AE Virtual Hardware Platform"
description = "The RD-1AE is now available as a virtual model on the Arm Virtual Hardware platform powered by Corellium. The RD-1AE virtual hardware platform can execute the entirety of Arm's reference software deliverables which include type one hypervisors on the application cores and safety islands."
full_description = "Introducing the Arm RD-1AE Virtual Hardware Platform This spring, Arm introduced RD-1AE an advanced automotive reference design featuring Neoverse-V3AE application processors as well as Cortex-R82AE based safety islands and a Cortex-M55 based Runtime Security Engine. The release also included a complete set of open source software showcasing the platform's many features. The RD-1AE is now available as a virtual model on the Arm Virtual Hardware platform powered by Corellium. The RD-1AE virtual hardware platform can execute the entirety of Arm's reference software deliverables which include type one hypervisors on the application cores and safety islands. For more details on all the software features, check out the Arm RD-1AE page at Arm Developer. RD-1AE Virtual Hardware Baremetal Features The diagram above, taken from the Arm Automotive Solutions page shows the architecture of RD-1AE. With the exception of the core count for the applications cluster, the virtual hardware platform faithfully represents the entirety of this architecture including SystemReady IR support, trusted services and Arm Trusted Firmware. The applications core count was reduced to four instead of 16 as listed in the diagram to make the platform more affordable to run. If you need a platform with more than the four provided, please let us know at support@corellium.com. RD-1AE Virtual Hardware Virtualization Features In addition to supporting all the baremetal features of RD-1AE, the virtual hardware platform also implements the entirety of the RD-1AE virtualization features including the ability to run Type 1 and Type 2 hypervisors. The Arm software package includes the Xen hypervisor. While multiple commercial hypervisors have been validated on Corellium virtual hardware platforms they are not included. The execution speed of the platform continues the Corellium tradition for silicon-like performance. The system boots to a Linux prompt in just under 30 seconds. Building the Software The RD-1AE virtual hardware platform executes all the software examples provided by Arm and many of these are available as pre-built images which can be chosen at device creation time. If you want to build your own versions of the software or if you wish to replace any component with your own, be sure to check out the support page for guidance. There are a few minor tweaks to the package to increase the available memory and remove PCI devices from the device tree as the model does not contain any PCI devices. Finally, since the platform is currently running on AWS Graviton 3 instances, the support page also shows how to compile without SVE support. This limitation will be removed once the platform is migrated to run on Graviton 4 servers. Stay tuned! Availability The RD-1AE virtual hardware platform is available today. If you don't already have an account you can request a trial here. If you have an existing Arm ID, you can simply login and access your free trial. All trial accounts receive 100 free core-hours to use over 30 days. Once you have your account, you can login here. What's Next? We're far from finished rolling out auto-focused systems and solutions. We'll have a number of exciting follow ups coming out in the upcoming months. Stay tuned! Revolutionize Your Device DevOps with Corellium Modernize the development of your IoT embedded software and companion mobile apps with virtual devices that tie into your SDLC process. Learn how Corellium’s high-precision virtual models enable faster development, enhanced security, and lower costs. Set up a meeting to learn how Corellium accelerates software development lifecycles with Arm-native virtual models and powerful tools and APIs. Learn More Posted October 28, 2024 Tags IoT Auto Author Bill Neifert Share Copied Copy link LinkedIn Twitter Facebook Keep reading See more Chris Magistrado • Feb 06, 2025 Mastering CTF Mobile Challenges with Corellium This spring, Arm introduced RD-1AE an advanced automotive reference design featuring Neoverse-V3AE application processors as well as Cortex-R82AE based safety islands and a Cortex-M55 based Runtime Security Engine. The release also included a complete set of open source software showcasing the platform's many features. The RD-1AE is now available as a virtual model on the Arm Virtual Hardware platform powered by Corellium. Brian Robison • Jan 29, 2025 Corellium Virtual iOS Devices vs. Apple’s iOS Simulator and Physical Devices: The Ultimate Tool for Penetration Testing This spring, Arm introduced RD-1AE an advanced automotive reference design featuring Neoverse-V3AE application processors as well as Cortex-R82AE based safety islands and a Cortex-M55 based Runtime Security Engine. The release also included a complete set of open source software showcasing the platform's many features. The RD-1AE is now available as a virtual model on the Arm Virtual Hardware platform powered by Corellium. Brian Robison • Jan 13, 2025 2024: Wrestling the Mobile Hydra—No Jailbreaks, More Data Leaks, and Paradigm Shifts This spring, Arm introduced RD-1AE an advanced automotive reference design featuring Neoverse-V3AE application processors as well as Cortex-R82AE based safety islands and a Cortex-M55 based Runtime Security Engine. The release also included a complete set of open source software showcasing the platform's many features. The RD-1AE is now available as a virtual model on the Arm Virtual Hardware platform powered by Corellium. Blog Introducing the Arm RD-1AE Virtual Hardware Platform"
