on type and status. Set environment temperature, lighting, pressure and humidity. Configure GPS location coordinates, altitude and time offset. Modify acceleration, gyroscope, magnetic and orientation settings. Kernel research Use advanced tooling purpose-built for advanced security research and kernel debugging. Upload custom kernels and device trees, and enable/disable kernel patches. Pass boot arguments or boot from a custom ramdisk instead of from NAND. Use iBoot to start the application processor instead of booting from the kernel. Modify trust caches, set Device IDs, simulate PAC instructions and more. Auditing and collaboration Easily snapshot and clone device environments. Pause and resume firmware and app operations to facilitate security research. Save and restore device states to simplify reproducibility, record vulnerabilities, and perform audits. Accelerate cross-team research, compliance testing, and researcher training.'''
