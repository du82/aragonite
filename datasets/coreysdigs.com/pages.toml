title = "ABOUT - coreysdigs.com"
description = "Investigative Journalist Corey Lynn connects dots in a world of corruption where nothing is as it seems, and publishes her findings on CoreysDigs."
full_description = "ABOUT Corey’s Digs was created by Investigative Journalist Corey Lynn for the purpose of digging for truth in a world where nothing is as it seems, then connecting the dots and presenting her findings to you. Corey focuses on larger webs and nests, and areas that are seldom covered by mainstream media. She exposes operations, oftentimes with detailed timelines, maps, and documentation to provide the full scope of what may be transpiring, and she always cites sources with links to back it up. A message from Corey: We have been spoonfed twisted narratives and deep forms of manipulation for centuries. Yes, centuries. It was much more difficult to seek out the truth long ago, but we live in an age where endless amounts of information is right at our fingertips. There is no longer an excuse to live in fantasy land, turning a blind eye to the destruction happening all around us, and hoping maybe things will get better one day. What will become of your children and their children? It is time to pull together evidence and expose those whom have brought us to this stage of the game. This goes deep folks. This is a worldwide web of corruption at the deepest levels of ones darkest imagination. You will not like much of what you discover, and some of it may leave you dazed and confused for weeks, but it is important information to understand in order to move forward. It is time to wake up – for many have been asleep far too long. “Within the web lies the truth.” I encourage everyone to do their own digging, use discretion and question everything. Over time you begin to spot the enemy, recognize the symbolism, see their strategies in play, and ultimately be able to quickly assess the liars from the truthers – the illusions from reality. We have been living in an illusion far too long. It is time to become aware and make others aware before it’s too late. It’s time to do some digging!"
