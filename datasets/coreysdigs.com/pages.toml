description = "Welcome to the Solution Series with Corey Lynn & James White, exclusively available on solari.com and coreysdigs.com. Get in here!"
full_description = "The Solution Series Welcome to The Solution Series with Corey Lynn and James White – Exclusively Available on Corey’s Digs and The Solari Report! We have produced 24 timeless episodes to bring you solutions, resources, and tools from brilliant individuals. We focused on areas such as food resources and how-tos, local community building, alternative resources, wellness and healthcare, big financial tips, survival and preparedness, radio comms, technology, and so much more. This is all about solutions, not problems, so get in here! The Solution Series is NOW FREE! If you previously logged in to review any of the 24 episodes, it is no longer necessary, nor has it ever been set to auto-renew. Simply open any of the episodes below and start watching! We also have an incredible Resource Page to provide you with more great resources and tools. The Solution Series: Building Wealth with Catherine Austin Fitts and Ricardo Oskam August 15, 2023 No Comments “We have no more right to consume happiness without producing it than to consume wealth without producing it.”~ George Bernard Shaw “You can build wealth, you can build poverty, or you can build nothing. Which do you prefer?”~ Catherine Austin Fitts Preview Full episode Download the full transcript in PDF here. By Corey Lynn and James White It is with both a sense of accomplishment and a bit of sadness that we present to you, our valued listeners, this last episode of the year-long Solution Series, jointly presented by the Solari Report and Corey’s Digs. Over the last 12 months… Read More The Solution Series: Small Farm Republic with John Klar July 25, 2023 No Comments “Agriculture is our wisest pursuit, because it will in the end contribute most to real wealth, good morals and happiness.”~ Thomas Jefferson Preview Full episode Download the full PDF transcript here. By Corey Lynn and James White There was a time in this nation’s history when families were more united, when there was less homelessness, and when talk of potential famine was virtually non-existent. That time in our history was when the majority of Americans were farmers. When we say “majority,” keep in mind that some estimates put the number of Americans who lived at, worked at, or owned a… Read More The Solution Series: Electroculture and Energy with Matt Roeske June 27, 2023 No Comments “If you want to find the secrets of the universe, think in terms of energy, frequency, and vibration.”~ Nikola Tesla Preview Full episode By Corey Lynn and James White As the growing season arrives in the Northern Hemisphere, there is no better time to havea Solution Series interview addressing the newest (oldest) technology used to grow fruitsand vegetables in abundance, known as “electroculture.” Contrary to what the name wouldseem to imply, there is no need to “plug into” a standard outlet. Instead, electrocultureplugs into the energy all around us. Matt Roeske is a well-researched and intelligent guy who seems to… Read More The Solution Series: How to Become a Local Activist with Patrick Wood June 13, 2023 No Comments “Those who say it can’t be done are usually interrupted by others doing it.”~ James Baldwin Preview Full episode Download the full transcript in pdf here. By Corey Lynn and James White As the experiment of big spending, big government, and big corporations appears to be waning, one has to ask what will take its place if the system as we know it fails. For many years running, those who have foreseen what is now happening have been educating citizens to “go local” in all that they do. Our guest on this episode of the Solution Series, Patrick Wood, has… Read More The Solution Series: Mastering Field and Radio Tactics with Matt “NC Scout” May 30, 2023 No Comments “As long as you remain true to yourself and continue training with sincerity, nobody can stop you from achieving excellence.”~ Milkha Singh Preview Full episode Download the full transcript in PDF here. By Corey Lynn and James White There are a few levels of learning that we all must traverse before we can say that we have mastered a particular skill. Historically, the best way to get through the learning curve of a new idea or concept is to just do it—but to take that course of action, one needs to obtain advanced skills and knowledge from someone who has… Read More The Solution Series: A Journey Through Self-Empowerment, RV-ing, EMF Protections, and Manifesting with Fiona Price May 9, 2023 No Comments “To live a fulfilled life, we need to keep creating the ‘what is next’ of our lives. Without dreams and goals there is no living, only merely existing, and that is not why we are here.”~ Mark Twain Preview Full episode Download PDF of transcript here. By Corey Lynn and James White One question that has puzzled humanity through the ages is, “Why do some people succeed, and some people fail?” The answer to that question runs deep and is too complex for this format. That being said, our guest today, Fiona Price, has achieved magnificent success through planning, consistency,… Read More The Solution Series: The Power of Constitutional Education with KrisAnne Hall April 25, 2023 No Comments “I think myself that we have more machinery of government than is necessary, too many parasites living on the labor of the industrious. Government big enough to supply everything you need is big enough to take everything you have. … The course of history shows that as a government grows, liberty decreases. The two enemies of the people are criminals and government, so let us tie the second down with the chains of the constitution so the second will not become the legalized version of the first.”~ Thomas Jefferson Preview Full episode Download the full transcript in pdf format here.… Read More The Solution Series: RV Living and Traveling Tips with Thom and Robin Walker April 11, 2023 No Comments “The RV lifestyle is a cost-effective way to live your dreams.”~ Jeffrey Webber, RVing & Your Retirement Lifestyle Preview Full episode Download the full transcript here. By Corey Lynn and James White One thing is certain about the human species, and that’s the fact that we love to travel. But while our ancestors made their way from Point A to Point B in covered wagons, today we have the option (if our pockets are deep enough) of essentially having a fully functioning home on wheels. The adventures that await those who choose this lifestyle are boundless. Our guests on this… Read More The Solution Series: Self Defense & Situational Awareness with Richard Merfert March 28, 2023 No Comments “When seconds count, police are minutes away!”~ National Rifle Association slogan Preview Full episode Download the full transcript here. By Corey Lynn and James White The deterioration in our sense of personal safety comes from many directions. After a break-in at our neighbor’s home, we start to read the local reports of crimes and arrests. Or we hear reports of or see videos of predatory street crime and violence. Or we go to a protest that turns violent. Or our car is vandalized—lucky that we were not in it. Whatever the threats that have touched you and your family, the… Read More The Solution Series: Securing Your Privacy from Big Tech with Rob Braxman March 14, 2023 No Comments “The telephone is the greatest nuisance among conveniences, the greatest convenience among nuisances.”~ Robert Staughton Lynd Preview Full episode Download the full transcript in pdf here. By Corey Lynn and James White For those of us who are old enough to remember, making a series of phone calls once entailed collecting a pocketful of dimes, then using your MacGyver driving skills to pull close enough to the payphone while not demolishing your side mirror in the process. Oh, how things have changed! Rob Braxman is certainly old enough to remember the now outdated payphone, but as technology has advanced throughout… Read More The Solution Series: Protecting Your Home and Real Estate Assets with Marie McDonnell February 28, 2023 No Comments “The strength of a nation derives from the integrity of the home.”~ Confucius Preview Full episode Download the full transcript in pdf here. By Corey Lynn and James White It has often been said that the average person’s greatest lifetime purchase will be their home. Statistically, the numbers support that statement as being factual. With that in mind, logic would dictate that after purchasing a home or other hard assets, one should take the necessary steps to protect said assets. Well, you’re in luck because the guest on this edition of the Solution Series, Marie McDonnell, is an expert at… Read More The Solution Series: Protecting Your Family’s Assets Through Wills and Trusts with Ann Christensen February 14, 2023 No Comments “If you want to live a happy life, tie it to a goal, not to people or things.”~ Albert Einstein Preview Full episode Download the full transcript here. By Corey Lynn and James White We all reach a point in our lives when we have to face the inevitable reality: There will come a day when we pass away from this existence to the next, with only our legacy, loved ones’ memories, photos, and our accumulated assets to remember us by. You can enjoy the many wonderful days that you have left to live—without stressing about posthumous events—by creating a… Read More The Solution Series: Navigating a Failed Health Care System with Jennifer Walters and Matt R. Hale January 24, 2023 No Comments “I will use those dietary regimens which will benefit my patients according to my greatest ability and judgement, and I will do no harm or injustice to them. I will not give a lethal drug to anyone if I am asked, nor will I advise such a plan; and similarly, I will not give a woman a pessary to cause an abortion.”~ From the Hippocratic Oath Preview Full episode Download the full transcript in pdf format here. By Corey Lynn and James White Sadly, we have reached a point in 2023 in the United States that most Americans would never… Read More The Solution Series: Off-Grid Living with Rich Scheben January 10, 2023 No Comments “When we try to pick out anything by itself, we find it hitched to everything else in the Universe.”~ John Muir Preview Full episode Download the full transcript here. By Corey Lynn and James White This edition of the Solution Series tackles “off-grid” living. Although we suspect our audience is well-informed about what that term means, we first define what it is and what it entails. Unsurprisingly, when someone describes themselves as “living off-grid,” they mean precisely that, describing the decision to live outside the municipal grid and voluntarily forego city services that most Americans take for granted like electricity,… Read More The Solution Series: Homeopathic Health & Homeschooling with Paola Brown December 15, 2022 No Comments “My kind of slogan is ‘generations of health.’ We hear that ‘generational wealth’ thing; we’re talking about generations of health, and that is my goal.”~ Paola Brown Preview Full episode Download the full transcript here. By Corey Lynn and James White Whether as a form of protest, or spurred out of necessity, the last several years have seen millions of American parents make the decision to ditch the government-controlled education system and take a life-changing step into the realm of homeschooling their children. For any educational program—whether inside the four walls of a schoolhouse or the four walls of your… Read More The Solution Series: Holistic Health with Nancy O’Brien December 8, 2022 No Comments “It’s hard to separate just the body, just the physical because we are very complicated beings…. We are spirit, we are physical, we are soul, so you can’t really touch on one without touching on all of them.”~ Nancy O’Brien Preview Full episode Download the full transcript in PDF. By Corey Lynn and James White The rapidly changing landscape of today’s modern health care systems, coupled with the increased availability of online health information, has encouraged more and more people to look for ways to manage their own health without doctors and, in some cases, without prescription medications. Regardless of… Read More The Solution Series: Bountiful Food and Self-Reliance with David DuByne November 24, 2022 No Comments “I’m a shelf-life investigator and really believe that is the key to thriving during this time by knowing what the healthy foods will be and what is their expiration date.”~ David DuByne Preview Full episode Download the full transcript in pdf format here. By Corey Lynn and James White One only has to watch a few minutes of any network newscast to ascertain that some kind of food shortage might be on the horizon for some parts of the world, including the United States. Sadly, throughout history, governments have used food scarcity as a way to push their populations into… Read More The Solution Series: Transitioning into Real Money with Franklin Sanders November 10, 2022 No Comments “The fact is, over time if you stay in dollars they’re stealing from you. That’s the whole point of inflation … they’re stealing from you, and if you keep your wealth in that system, you’re strengthening that system.”~ Franklin Sanders Preview Full episode Download the full transcript in pdf format here. By Corey Lynn and James White What is money? Depending on who you ask, you will receive a variety of different answers to that very important question. Currency, often confused with real money, is the paper notes we hold in our pockets and use for day-to-day transactions; but do… Read More The Solution Series: Building a Local Force with Your Sheriff with Sheriff Richard Mack October 20, 2022 No Comments “The solution for liberty, and to restore our Constitution today and make the federal government’s corruption irrelevant in the lives of our citizens, is for sheriffs to do what they already promised to do when they took their oath of office.”~ Sheriff Richard Mack Preview Full episode Download the transcript in PDF. By Corey Lynn and James White The history of the sheriff goes back some 1200 years, but the first Sheriff’s office in America wasn’t established until 1641, in Maryland. Either way you slice it, the office of the Sheriff—which means keeper or chief of the county—is a long-standing,… Read More The Solution Series: Equip Yourself with Grid-Down Comms with John Jacob Schmidt October 6, 2022 No Comments “People are just as hungry for information as they are for food.” ~ John Jacob Schmidt Preview Full episode Download the transcript in PDF. By Corey Lynn and James White For a long time now, Americans have been urged to prepare for some inevitable calamity such as the power grid going down, a financial collapse, or a dozen other scenarios, depending on which pundit you follow. We, at the Solution Series, cannot predict the future, nor do we intend to try. What we do know is that whatever happens going forward—good or bad—will be much more manageable and livable with… Read More The Solution Series: Family Preparedness an"
