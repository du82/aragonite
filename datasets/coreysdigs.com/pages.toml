f is aged 21 days right on the ranch. They control their entire supply chain! Learn More EMP Shield EMP Shield is the World’s first EMP protection technology for an entire home and vehicle tested to military and UL 1449 standards from ETL. It is designed to protect an entire home from lightning, solar flare (coronal mass ejection), power surges, and an electromagnetic pulse. Their family of technologies have been tested at Keystone Compliance, in accordance with all military standards. Be sure to use promo code “digs” for $50 off each item! Shop Now NordVPN It’s important to use a Virtual Private Network (VPN) when surfing the internet in order to protect your privacy and for security purposes, especially if you are doing online shopping. Anytime you jump on the internet, whether in your home or on public Wi-Fi, you should always keep your personal information private and secure. NordVPN has a strict no-logs policy, and you can set it up on multiple devices. It’s simple to setup and use, and they are always running special sales. Learn More Truthfinder Whether you are researching individuals in an organization or moving to a new location and want to search for local sex offenders or look into others to protect your children, Truthfinder is a great place to start. It can provide details on social media, sex offenders, criminal and traffic, civil judgments, contact information and much more all in one handy location. It’s a quick, convenient tool for journalists to get a jump on investigating individuals in a corrupt company. Learn More Food Forest Abundance Over 40 million lawns packed with chemicals reside in the US. It’s time to turn your lawns into food forests! No matter how small or how big your land is, there is always room to grow food. Food Forest Abundance’s permaculture experts help you create this vision and bring it to life. Be sure to use code COREYLYNN for 5% off. Learn More FarmMatch Supporting our local farmers and getting fresh produce and healthy food for our families are both vitally important right now. FarmMatch is so simple! You just enter your zip code and it finds your local farmers so you can begin ordering direct from them with either scheduled pickups or shipped to your door. Get 10% off your first order! Shop Now Seeds for Generations At Seeds for Generations, this wonderful family of nine work hard to bring you the best heirloom seeds, webinars, free resources, and a wealth of information on how to grow your own food. And, they do it all from a place of love. Get 100% heirloom/open-pollinated seeds to start growing your own food and create your own family adventure! Shop Now Corey’s Camp Whether you are looking to stock up on food, grab prepping and off grid supplies, or get some cool items for camping, this is a great place to get all of the above! From first aid and survival kits to water filtration and storage, single pack and bulk food, and the famous Kelly Kettle, you’ll find it all right here! Shop Now Paola Brown Paola Brown takes homeopathy to a whole new level with this incredible educational series that teaches the entire family through books, cards, music, and games on everything you need to know when it comes to using homeopathy for your health. This is a great supplement to a homeschool curriculum! Shop Now Get Your Digs! Grab some swag from Corey’s shop! Pick up a tee and make a statement, keep your head warm with a Dig It! beanie hat or baseball cap, or get a mug or hoodie as a gift for a friend. It’s the perfect way to spread a message and support Corey’s work at the same time, plus… you’ll look extra cool! 😉 Shop Now"
