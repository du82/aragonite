full_description = "LEARN HOW TO..., SOLUTIONS Get Crafty with 10 DIY Projects for Self Reliance and Fun June 2, 2021 / 5 Comments By James Fitzgerald The lockdowns across the western world had people scratching their heads and pacing their carpets threadbare — but the enforced seclusion and introspection has also produced a flurry of creativity and artistry as personal values are reassessed and commute times evaporate. The increased transparency over corporate agendas and the questionable ethics of some retail supply chains means that leisure pursuits can be practical ways to disengage and gain more autonomy from the “connected” world of smart tech and draconian social mandates. As someone once said, Rome wasn’t built in a day — although that may be just the imperial behemoth we are trying to escape. Here we list a handful of pursuits that will stimulate the grey matter and soothe the soul, while offering domestic and social applications. A Stitch in Time — Leather Goods While visiting a saddle-maker a couple weeks ago, my ten-year-old daughter got… Read More James Fitzgerald You May Also Like Americans Feel The Crunch as Food Lines Grow December 3, 2020 Compelling Testimonies from Covid Whistleblowers October 7, 2021 Historical Hypocrisy & Psychological Warfare June 18, 2020 FOOD SUPPLY CHAIN, GLOBAL, LEARN HOW TO..., SOLUTIONS, U.S. SAS Legend Gives Preppers Food For Thought October 21, 2020 / 4 Comments By James Fitzgerald We live in a world where people wait in line for what is already theirs — food, water, and shelter. When the European immigrants landed on the shores of the American continent in the first wave of settlement in the 1600s, they quickly cast off the burdens of feudalism and adopted the symbiotic lifestyle of the Native inhabitants. It wasn’t long though until the concept of store credit reared its head among the cash-poor but time-rich pioneers. Modern society now largely relies on debt to purchase things, and that has given the central banks and corporations a stranglehold on resources, policies and control over who lives or dies. It didn’t take the New World immigrants long to become serfs once again — even though from all mature philosophical and rational viewpoints we all deserve to share in all the resources of the planet, with the utmost respect… Read More James Fitzgerald You May Also Like The Death of George Floyd: The Real Timeline November 2, 2022 The Solution Has Always Been YOU May 18, 2020 You Were Lied To – You Do Exist September 13, 2019"
