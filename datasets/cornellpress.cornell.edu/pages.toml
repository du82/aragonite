title = "Celebrating Black History Month 2025 - Cornell University Press"
description = "In order to help inform dialogues and promote understanding about antiracism and racial justice during Black History Month, Cornell University Press highlights titles on our list that speak to these critical issues."
full_description = "Return to Home Thursday, February 13, 2025 As we commemorate Black History Month this February, Cornell University Press reflects on our ongoing commitment to publishing vital works that illuminate the Black experience, challenge historical narratives, and advance our understanding of African American history, culture, and achievement. In order to help inform dialogues and promote understanding about antiracism and racial justice, we are highlighting titles on our list that speak to these critical issues. All of the books listed are available to read for free as open access ebooks (through 3/13/2025). Using our special promo code 09SAVE, you can also save 33% off any print edition of the books within this collection. Looking for a starting point as you seek to explore this lineup of different titles to choose from? Check out these six books! Barack ObamaBurton I. KaufmanIn this insightful biography, Burton I. Kaufman explores how the political career of Barack Obama was marked by conservative tendencies that frustrated his progressive supporters and gave the lie to socialist fearmongering on the right. Obama’s was a landmark presidency that paradoxically, Kaufman shows, resulted in few, if any, radical shifts in policy. In estimating the course and impact of Obama’s full political life, Kaufman makes clear that both the desire for and fear of change in the American polity affected the popular perception but not the course of action of the forty-fourth US president. Black France, White EuropeEmily Marker Black France, White Europe illuminates the deeply entangled history of European integration and African decolonization. Emily Marker maps the horizons of belonging in postwar France as leaders contemplated the inclusion of France’s old African empire in the new Europe-in-the-making. European integration intensified longstanding structural contradictions of French colonial rule in Africa: Would Black Africans and Black African Muslims be French? If so, would they then also be European? What would that mean for republican France and united Europe more broadly? Black Lives and Spatial MattersJodi RiosBlack Lives and Spatial Matters is a call to reconsider the epistemic violence that is committed when scholars, policymakers, and the general public continue to frame Black precarity as just another racial, cultural, or ethnic conflict that can be solved solely through legal, political, or economic means. Jodi Rios argues that the historical and material production of blackness-as-risk is foundational to the historical and material construction of our society and certainly foundational to the construction and experience of metropolitan space. Campus CounterspacesMicere KeelsFrustrated with the flood of news articles and opinion pieces that were skeptical of minority students’ “imagined” campus microaggressions, Micere Keels, a professor of comparative human development, set out to provide a detailed account of how racial-ethnic identity structures Black and Latinx students’ college transition experiences. In this critique of how universities have responded to the challenges these students face, Keels offers a way forward that goes beyond making diversity statements to taking diversity actions. Funk the ClockRahsaan MahadeoFunk the Clock is about those said to be emblematic of the future yet denied a place in time. Hence, this book is both an invitation and provocation for Black youth to give the finger to the hands of time, while inviting readers to follow their lead. In revealing how time is racialized, how race is temporalized, and how racism takes time, Rahsaan Mahadeo makes clear why conventional sociological theories of time are both empirically and theoretically unsustainable and more importantly, why they need to be funked up/with. The Black WoodsAmy GodineThe Black Woods chronicles the history of Black pioneers in New York’s northern wilderness. From the late 1840s into the 1860s, they migrated to the Adirondacks to build farms and to vote. On their new-worked land, they could meet the $250 property requirement New York’s constitution imposed on Black voters in 1821, and claim the rights of citizenship. Use code 09SAVE to save 33% on this special collection of Black History titles. See all Black History Month books available here. Start reading now with FREE ebook access to these Black History Month books.See all books published in February 2025. Browse other blog posts here."
