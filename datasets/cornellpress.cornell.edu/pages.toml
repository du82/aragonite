["https://www.cornellpress.cornell.edu/roots-of-resilience-party-machines-grassroots-politics-southeast-asia-02-11-2025"]
title = "Understanding Grassroots Politics with The Roots of Resilience - Cornell University Press"
description = "Cornell University Press fosters a culture of broad and sustained inquiry through the publication of scholarship that is engaged, influential, and of lasting significance."
full_description = "Return to Home Tuesday, February 11, 2025 In The Roots of Resilience: Party Machines and Grassroots Politics in Southeast Asia, Meredith L. Weiss examines governance from the ground up in the world’s two most enduring electoral authoritarian or “hybrid” regimes—Singapore and Malaysia—where politically liberal and authoritarian features blend, evading substantive democracy. First published in August 2020, we learn more as we celebrate its paperback release this month. We’re excited to announce that Meredith L. Weiss’s book The Roots of Resilience is now available in paperback, making this important scholarly contribution more accessible to students, researchers, and political enthusiasts. The Roots of Resilience examines how political parties maintain their power and influence at the grassroots level in Southeast Asia, with particular focus on Malaysia and Indonesia. Through detailed comparative analysis, Weiss explores the intricate relationships between political organizations and local communities, revealing how party machines operate and adapt over time. The paperback edition arrives at a crucial time when understanding grassroots political movements and party organizations is more important than ever. Whether you’re a student of political science, a researcher focused on Southeast Asian studies, or simply interested in comparative politics, this book offers valuable insights into the mechanics of political resilience. For those interested in Southeast Asian politics, party organizations, or comparative political studies, The Roots of Resilience provides an essential framework for understanding how political parties maintain their influence through local-level engagement and organization. Learn more about The Roots of Resilience Meredith L. Weiss is Professor of Political Science in the Rockefeller College of Public Affairs and Policy at the University at Albany, State University of New York. Her previous books include Protest and Possibilities, Student Activism in Malaysia, and Mobilizing for Elections."
