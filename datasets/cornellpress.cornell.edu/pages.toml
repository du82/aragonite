full_description = '''Books Authors Posts Showing Results for: Filter Your Results <a href="javascript:void(0);" class="facet-link toggle-refine {{#disjunctive}}facet-disjunctive{{/disjunctive}} {{#isRefined}}facet-refined{{/isRefined}}" data-facet="{{ facet }}" data-value="{{ name }}">{{ name }}</a> <div id="no-results-message" class="no-results-message"> <p>Didn't find any results for the search? </p> <p><a id="search-results-new-search" class="clear-all">Try a new search?</a></p> </div> {{ query }} <a href="{{item.permalink}}" title="{{ item.title }}" aria-label="Go on {{ item.title }} book page"> <div class="books__item"> <div class="books__item-wrap"> {{#if item.imageResized }} <div class="books__item-image"> <img alt="book cover" src="{{ item.imageResized }}"> </div> {{/if}} <div class="books__item-content"> {{#if item.title }} <div class="books__item-title">{{ item.title }}</div> {{/if}} {{#if item.subtitle }} <div class="books__item-subtitle">{{ item.subtitle }}</div> {{/if}} {{#if item.contributorByLine }} <div class="books__item-author"> {{ item.contributorByLine }} </div> {{/if}} </div> <div class="books__item-overlay"> <div class="books__item-overlay-content"> {{#if item.title }} <div class="books__item-overlay-title">{{ item.title }}</div> {{/if}} {{#if item.subtitle }} <div class="books__item-overlay-subtitle">{{ item.subtitle }}</div> {{/if}} </div> <div class="books__item-overlay-icons"> {{#if item.googlePreviewUrl }} <a href="{{ item.googlePreviewUrl }}" title="Open Google Preview for {{ item.title }}" aria-label="Google Preview Link" class="fa fa-eye" target="_blank"></a> {{/if}} {{#if item.permalink }} <a href="{{item.permalink}}" aria-label="Go on {{ item.title }} book page" title="{{ item.title }}" class="fa fa-info-circle" target="_blank"></a> {{/if}} {{#if item.buyLink }} <a href="{{ item.buyLink }}" aria-label="Add to Cart {{ item.title }}" title="Add to Cart {{ item.title }}" class="fa fa-cart-plus" target="_blank"></a> {{/if}} </div> </div> </div> </div> </a> Return to Home About About Our Publishing Profile For Authors For Booksellers For Educators For Media Rights and Permissions About Click here to learn key facts about the Press in under a minute. Click here to read our 2024 Look Book. Cornell University Press fosters a culture of broad and sustained inquiry through the publication of scholarship that is engaged, influential, and of lasting significance. Established in 1869 as the first American university press, shortly after the founding of Cornell, the press embodies and advances the university’s core values by disseminating fundamental and practical knowledge, while commanding its own distinct editorial profile. The press, as part of a land-grant institution, is also dedicated to transforming research into publications that reach and benefit the wider public. Works published under its imprints reflect a commitment to excellence through rigorous evaluation, skillful editing, thoughtful design, strategic marketing, and global outreach. Since early 1993, the acquisitions, editorial, production, and marketing departments of the Press have been located in Sage House, where the staff keeps company with the house’s carved bats and stained-glass birds. Sage House was built in the 1880s by Henry Williams Sage, then chairman of the University’s Board of Trustees, and was designed by William Henry Miller, the architect later responsible for many important buildings on the Cornell campus. Contractor and chief mason were master craftsmen who had come to Ithaca from England, bringing old-world skills to the construction of the early campus. To learn more about Cornell University Press read our history of the Press published to celebrate our 150th anniversary in 2019. Cornell University Press is a proud member of the Association of University Presses, which serves to advance the essential role of a global community of publishers whose mission is to ensure academic excellence and cultivate knowledge. Our Publishing Profile Cornell University Press publishes peer-reviewed, nonfiction books (and two journals) for diverse readerships under several distinct imprints, each of which have their own faculty and expert advisory boards. The Press also publishes fiction under its Three Hills imprint. The Cornell University Press imprint has particular strengths in anthropology and sociology; classics and archaeology; geography and urban studies; higher education; history (U.S., Western and Central Europe, East Asia, and military); law and society; literary and cultural studies; medieval and early modern studies; political science (international relations, security studies, humanitarianism and human rights, political economy and the politics of money, and area studies concentrating on the EU, the Middle East, Eastern Europe and Eurasia, and East and Southeast Asia); and the history and politics of New York State. (The journal New York History is also published under the CUP imprint). The ILR Press imprint publishes books in labor and industrial relations; management and human resources; labor history; issues of class; workplace culture; and health care policy and practice. Our Comstock Publishing Associates imprint publishes scholarly and general-interest books in life sciences (including ornithology, entomology, herpetology and ichthyology, mammalogy, botany, and ecology); natural history; and environmental studies; as well as nature writing and field guides. In collaboration with Cornell’s Southeast Asia Program, Southeast Asia Program Publications (SEAP) publishes books on Southeast Asian history, culture, and society, as well as the journal Indonesia. The Cornell East Asia Series (CEAS) imprint, published jointly with Cornell’s East Asia Program, focuses on China and Taiwan, Japan, and the Korean peninsula, covering topics in history, culture and society, and translations of literary works. The Three Hills imprint publishes books of general interest about the history, politics, cultures, communities, and the environment of New York State and City. Novels, short stories, and other creative writing projects are also published under Three Hills. The Northern Illinois University Press imprint, a collaboration with NIU, publishes books in Slavic, East European, and Eurasian studies; Orthodox Christian studies; Southeast Asian history; politics; and books about the Midwest, with a particular focus on Illinois and Chicago. Active Series by Subject Anthropology & Sociology Cornell Modern Indonesia Project Corpus Juris: The Humanities in Politics and Law The Culture and Politics of Health Care Work Expertise: Cultures and Technologies of Knowledge Histories and Cultures of Tourism Police/Worlds: Studies in Security, Crime, and Governance> Classics Agora Editions Cornell Studies in Classical Philology Myth & Poetics II East Asian and Southeast Asian Studies Cornell Modern Indonesia Project The Environments of East Asia New Japanese Horizons NIU Southeast Asian Studies Studies of the Weatherhead Institute, Columbia University Education Histories of American Education Publicly Engaged Scholars: Identities, Purposes, Practices Geography & Urban Studies Cornell Series on Land: New Perspectives on Territory, Development, and Environment European History Battlegrounds: Cornell Studies in Military History Histories and Cultures of Tourism Islandica Medieval Societies, Religions, and Cultures NIU Series in Slavic, East European, and Eurasian Studies Labor and Workplace Studies The Culture and Politics of Health Care Work Legal Studies Corpus Juris: The Humanities in Politics and Law Literary & Cultural Studies Corpus Juris: The Humanities in Politics and Law Islandica Myth & Poetics II New Japanese Horizons Signale: Modern German Letters, Cultures, and Thought signale | TRANSFER: German Thought in Translation Medieval Studies Islandica Medieval Societies, Religions, and Cultures Military History Battlegrounds: Cornell Studies in Military History Medieval Societies, Religions, and Cultures New York Region Fall Creek Books Political Science Agora Editions Brown Democracy Medal Books Cornell Modern Indonesia Project Cornell Studies in Money Cornell Studies in Security Affairs Corpus Juris: The Humanities in Politics and Law The Culture and Politics of Health Care Work Religion and Conflict Religion Cornell Studies in Classical Philology Medieval Societies, Religions, and Cultures NIU Series in Orthodox Christian Studies Religion and Conflict Science and Natural History Cornell Series in Environmental Education The Liberty Hyde Bailey Library The Northern Forest Atlas Guides WCS Birds of Brazil Field Guides Zona Tropical Publications Slavic, East European, and Eurasian Studies Battlegrounds: Cornell Studies in Military History Histories and Cultures of Tourism NIU Series in Slavic, East European, and Eurasian Studies Religion and Conflict U.S. History Battlegrounds: Cornell Studies in Military History Histories and Cultures of Tourism Histories of American Education New Netherland Institute Studies The United States in the World For Authors Cornell University Press’s Policy on the Use of AI Tools by Authors Click here to read our AI policy for CUP authors. For Prospective Authors For information on submitting book proposals, click here. For Authors under Contract Overview of the Publishing Process A brief explanation of how the Press prepares your manuscript for publication and your responsibilities during that time. Guidelines for Preparing Your Manuscript for Publication These guidelines are intended for authors submitting the final version of their manuscripts for publication. Please consult with your editor if you have any questions. Author Guidelines These general guidelines provide detailed information on formatting and submitting your manuscript. Citation Style Guide The Citation Guidelines offer a concise overview of Cornell-preferred citation styles. Copyright and Permissions Guidelines Please read these guidelines with special care if in your book you have (1) quoted published or unpublished material, (2) used any tables, photographs, or other illustrations that are not your own, or (3) reused work of your own that has been published elsewhere. Guidelines for Submitting Illustrations These guidelines will help you collect, organize, and submit illustrations for your publication. Alt Text Style Guide The Alt Text Style Guide shows authors how to prepare descriptive text for illustrations that will be included in ebook editions for the visually impaired. Alt text is required for all figures. Guidelines for Submitting Commissioned Maps A supplement to our Guidelines for Submitting Illustrations, this detailed guide and checklist will help you and your cartographer meet requirements for line art maps for your publication. Special Characters Guide The Special Characters Guide explains how to prepare your manuscript if it has characters with diacritical marks or non-Roman characters. Inclusive Editorial Style Guide The Inclusive Editorial Style Guide will help you analyze your work’s sensitivity toward people of all abilities, ages, ethnicities, cultures, races, genders, and sexual orientations. Forms Required in Order to Put Your book into Production Please fill out these forms and submit them with your final manuscript. Manuscript Information Form and Checklist Special Characters Checklist This checklist is used to identify nonstandard characters in your manuscript, including carons/haceks, hamzas, and characters with dots under or over them. Permissions Questionnaire (for text permissions) Permissions Log (for illustrations) Permissions Request Form Use or adapt this form when requesting permission to use images in your book. Fair Use Checklist To help determine if you may claim Fair Use for previously published materials included in your book. Interview Release Form If your manuscript includes interviews with identifiable individuals, please have your interviewees complete 