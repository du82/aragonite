["https://www.cornellpress.cornell.edu/three-questions-jordan-h-kraemer-mobile-city-emerging-media-berlin-01-22-2025"]
title = "Exploring the Emerging Social Media of Contemporary Berlin: Three Questions with Jordan H. Kraemer - Cornell University Press"
description = "Cornell University Press fosters a culture of broad and sustained inquiry through the publication of scholarship that is engaged, influential, and of lasting significance."
full_description = "Return to Home Wednesday, January 22, 2024 In Mobile City, Jordan H. Kraemer charts the rise of social media and an emerging “knowledge” class in early-2000s Berlin. Many young Germans and EU-Ausländer (foreigners from other EU countries), attracted to Berlin’s vibrant post-unification counterculture, moved to the city just as they began using social media like Facebook and Twitter. 1. What is your favorite anecdote from your research for this book? I don’t think I can pick just one! But I especially loved when one of my research participants showed me his grandmother’s farm on Google Maps, reminiscing about his family after we’d eaten a springtime meal of Spargel (white asparagus). The way networked technologies allowed him to move between his life in Berlin, as a music journalist into indie and electronic music scenes, and warm feelings of home in a nearby rural region, encapsulated many of the themes of the book. 2. What do you wish you had known when you started writing your book that you know now? I wish I knew how to distill my findings better. It took me a long time to get the hang of ethnographic writing, finding key ideas and arguments, and then supporting them with ethnographic description. I also think it helps to have a sense of historical perspective that’s hard to grasp at the time. It took me a long time to complete the book, but the analysis benefited from the additional hindsight. 3. How do you wish you could change your field? I’d love to see anthropology build better connections with the non-academic world. Many anthropologists go into more applied fields like NGOs and industry, but they sometimes lose connection with academic anthropology when they do. In my current field, tech policy, anthropological perspectives are sorely underrepresented, even though they offer critical insight and cultural context that’s missing in tech policy research. I’d like to see graduate departments facilitate stronger connections with policymakers, civil society, foundations, journalists, and the like to help address this missed opportunity. Learn more about Mobile City Jordan H. Kraemer is a cultural anthropologist of emerging media and placemaking. She is Director of Research at ADL’s Center for Technology and Society. Find her on Bluesky at @jordanaut.bsky.social"
author = "Ashley"
year_published = 2025
year_updated = 2025
