title = "ABOUT - CorporetteMoms"
description = "Kat Griffin is the founder, publisher, and editor-in-chief of Corporette and CorporetteMoms (and mama to two beautiful boys!). She started Corporette in"
full_description = "ABOUT Kat Griffin is the founder, publisher, and editor-in-chief of Corporette and CorporetteMoms (and mama to two beautiful boys!). She started Corporette in May 2008, after five years of working as a litigator. She realized that had to learn fashion truths the hard way: by showing up to her conservative Wall Street office in outfits that seemed perfectly fashionable and normal when she left the house, only to realize upon arrival to the office that they were either horribly frumpy or incredibly inappropriate. She cursed the magazine editors who told her that work-appropriate wear consisted of mini-skirts and gladiator sandals, and wondered why no one wrote about beautiful suits. She finally decided to start the dialog herself. (You can read Kat’s “Introductions” post, along with some introductory videos, here.) Kat has wanted to start CorporetteMoms since she got pregnant with her first son (born August 2011) but only got around to launching it in April 2014 — she hopes to discuss pregnancy (pregnancy fashion and working while pregnant), maternity leave, and beyond. Kat grew up in Ohio and moved to New York to work as a writer and magazine editor (Family Circle magazine, Time’s college guide, and Sportswear International) after getting her BS from Northwestern University’s Medill School of Journalism. After working for a few years, she took a three-year detour to D.C., where she received her JD with honors from Georgetown University Law Center, and then returned to New York to work at Cahill Gordon & Reindel LLP, where she worked as a litigator for six years; she then worked as a staff attorney at the Media Law Resource Center for two years. You can contact Kat here."
