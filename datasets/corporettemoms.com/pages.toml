title = "4 Things to Do When You Find Out You're Pregnant - CorporetteMoms"
description = "What are some of the non-obvious things to do once you find out you're pregnant? We're rounding up the practical stuff..."
full_description = 'ByKate Antoniades Hours UpdatedApr 8, 2024 Comments 13 Comments 4 Things to Do When You Find Out You’re Pregnant Pregnant This post may contain affiliate links and CorporetteMoms may earn commissions for purchases made through links in this post. As an Amazon Associate, I earn from qualifying purchases. We all know the basic steps to take after after celebrating that positive pregnancy test: Schedule an appointment with your OB-GYN, think about when you want to share the good news, and so on. Other things to do when you find out you’re pregnant can be a little less obvious, so we’re rounding up a few today. Add these important tasks to your pregnancy to-do list in addition to the fun stuff like building your registry and picking out baby clothes. While they don’t exactly qualify as “Must do ASAP!” issues, they’re important to get out of the way — or at least educate yourself about — while you can. Things to Do When You Find Out You’re Pregnant Review Your Travel Plans Do you have any vacations booked that you might need to cancel or reschedule? Ask your doctor regarding your specific situation, but the American College of Obstetricians and Gynecologists (ACOG) recommends mid-pregnancy (around 14-28 weeks) as the sweet spot for enjoyable travel. (That page also has a ton of safety tips for pregnancy travel!) If you have any trips planned with potentially dangerous activities like skiing or horseback riding, you’ll probably want to rethink those. And if you’re going to travel internationally, ask your OB-GYN whether the recommended vaccines for your destination countries are safe during pregnancy. Some countries may be best to avoid altogether, such as those where malaria is a risk, because malaria is especially harmful during pregnancy. (Also, decide whether you’re going to do a babymoon, and start daydreaming!) Find Out Which Vaccines and Boosters You’ll Need Speaking of vaccines, while you should ask your own doctor for advice regarding vaccines during pregnancy, and when to receive them, the CDC’s guidelines are clear. According to the CDC, getting the flu vaccine is a good idea if you’re pregnant or trying to conceive during flu season. Ideally, relatives and others who will be around your baby should also be vaccinated for influenza. Receiving the COVID-19 vaccine during pregnancy is also safe. The CDC recommends that pregnant people receive the Tdap vaccine (diphtheria, tetanus, and pertussis) to guard against whooping cough, as the disease can be especially dangerous for babies. (Early in your third trimester is ideal.) It’s also smart to ask that family members and others who will be around your baby check with their doctors if they need a Tdap a booster. (If you expect any resistance, you might as well start asking now!) {related: readers’ best tips to hide a baby bump} Create or Update Your Will If possible, do as much as you can to update your estate planning details BEFORE your baby arrives. The postpartum haze is not exactly conducive to concentrating on weighty things like a will or living trust! What to Expect has a straightforward guide for parents on creating a will. While it’s not essential to hire a lawyer, it gives some parents more peace of mind to work on it with a professional. (We did!) As part of the process of creating a will, you’ll need to consider whom to designate as your child’s legal guardians for that worst-case scenario. This article from Motherly lists seven important questions to ask potential guardians, and here’s a thorough guide from the NYT (gift link). Related: Check out our post on getting your accounts in order before childbirth. When Kat was pregnant (both times!), she provided her husband with things like key bill due dates and important passwords. {related: taking a new job while pregnant [Corporette]} Think About Opening a 529 Account Did you know you can open a 529 account to start saving for college before your baby even arrives? Excited grandparents may be especially ready to get started ASAP! If you want an early start — and you’re comfortable with what you’re currently saving for retirement — simply designate yourself as the beneficiary for now. Once your baby is born and has a Social Security number, you can make them the beneficiary instead. It’s important to know that 529 plans aren’t just for college anymore. As of 2017, you can also use the funds for K-12 tuition — up to $10,000 per year — though there are pros and cons. Check your state’s rules, though; the impact on your state income taxes can vary. And as of 2024, parents can roll unused 529 funds into a Roth IRA for their child without tax penalty. The 529 clearinghouse CollegeSavings.org is a good place to start your research. You can review and compare states’ 529 plans (you aren’t limited to your own state’s plans, by the way), learn about the advantages and benefits of a 529, and more. {related: working through your first trimester of pregnancy} Readers, what advice do you have about the pregnancy to-dos we listed above? What are the most important things to do when you find out you’re pregnant? Stock photo via Stencil. (function(d, s, id) { var js, pjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.async = true; js.src = "//cdn.pubexchange.com/modules/partner/corporettemoms"; pjs.parentNode.insertBefore(js, pjs); }(document, "script", "pubexchange-jssdk"));FacebookTweetPinLinkedInPrintEmail Post Tags: #posts'
