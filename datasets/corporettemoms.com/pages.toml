full_description = "About the Authors Kat Griffin (she/her) – Kat Griffin is the founder, publisher, and editor-in-chief of Corporette and CorporetteMoms. You can read more about her here, and see all of her posts for Corporette and CorporetteMoms. Kate Antoniades (she/her) – Editor of Corporette/CorporetteMoms since 2014, Kate lives in Rochester, NY, and has one son (born in 2010). A cat person and Oxford comma loyalist, she loves Ben & Jerry’s Phish Food and her Hello Kitty Converse. You can see all of her posts for Corporette and CorporetteMoms and also find her on Twitter and Instagram. Ann (she/her) – Ann is a working mom and longtime reader of Corporette and CorporetteMoms, and has been writing our morning fashion advice for working moms since November 2020! She has a daughter (born winter 2014) and a son (born fall 2019) and is a public interest lawyer in Washington, D.C. You can see all of her posts here. Occasionally, several CorporetteMoms writers collaborate on a piece to the extent that we use the byline “CorporetteMoms Staff.” This happens regularly with our news posts, but occasionally with others. You can see all of the pieces by “CorporetteMoms Staff” here. We regularly publish A Week in the Life of a Working Mom, in which readers give us a sense of their work-life balance, their time obligations, and the general flow of their week. Submit yours here! Previous Writers April (she/her) – April is a working mom and a longtime reader of CorporetteMoms, and wrote our morning fashion advice for working moms from April 2018 through October 2020. She has one child (born 2/17!) and she’s a public interest lawyer in NYC. See all of April’s posts for CorporetteMoms here."
