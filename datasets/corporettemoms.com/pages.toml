title = "3 Great Podcasts for Working Moms - CorporetteMoms"
description = "We rounded up three excellent podcasts aimed at parents... which are your favorites podcasts for working moms?"
full_description = 'ByKate Antoniades Hours UpdatedApr 1, 2024 Comments 6 Comments 3 Great Podcasts for Working Moms Lifestyle · Mom Issues This post may contain affiliate links and CorporetteMoms may earn commissions for purchases made through links in this post. As an Amazon Associate, I earn from qualifying purchases. If you’re like me, you’ve bought lots of parenting books with good intentions, but then never cracked open most of them — especially after the baby/toddler years. If that sounds familiar, today’s roundup of three great podcasts for working moms is for you. Sure, many books about parenting ARE worth the time and effort (I’m a second-generation reader of How to Talk So Kids Will Listen & Listen So Kids Will Talk, for example), but when you want something more digestible that requires less commitment, parenting podcasts are the perfect substitute. So when you want a break from your favorite news or true crime podcasts, check out these three excellent options aimed at parents — and we’d love to hear your recommendations! {related: 5 great books for working mothers} 3 Great Podcasts for Working Moms Care & Feeding (formerly Mom and Dad Are Fighting) <img src="https://corporettemoms.com/wp-content/uploads/podcasts-for-working-moms-care-and-feeding.jpg" height="400" width="400" srcset="https://corporettemoms.com/wp-content/uploads/podcasts-for-working-moms-care-and-feeding.jpg 400w, https://corporettemoms.com/wp-content/uploads/podcasts-for-working-moms-care-and-feeding-300x300.jpg 300w, https://corporettemoms.com/wp-content/uploads/podcasts-for-working-moms-care-and-feeding-150x150.jpg 150w" sizes="(max-width: 400px) 100vw, 400px" class="wp-image-75429 sp-no-webp" alt="Text &quot;Care &amp; Feeding&quot; and &quot;Slate&quot; on a green background with an image of a teddy bear&#039;s head" decoding="async" > As of 2024, Slate’s parenting advice podcast, Mom and Dad Are Fighting, has a new name: Care and Feeding, which is also the name of the site’s parenting column. This popular podcast is a reader favorite and is hosted by Zak Rosen, Lucy Lopez, Jamilah Lemieux, and Elizabeth Newcamp. (Always good to see successful podcasts not hosted solely by cishet white dudes!) As Slate’s website describes it, the hosts “share triumphs and fails and offer advice on parenting kids from toddler to teens.” Sample titles from the 300+ episodes are “My Kid Is Neurodivergent. Do We Need a Formal Diagnosis?”, “Traveling the World With a Blended, Mixed-Race Family”, “How Many Activities Are Too Many Activities?”, and “Supporting My Nonbinary Teen.” Occasional guests have included authors, parenting experts, and more recognizable names (Sarah Polley! Hari Kondabolu!). {related: what are your favorite podcasts? [Corporette]} The Holderness Family Podcast <img src="https://corporettemoms.com/wp-content/uploads/podcasts-for-working-moms-holderness-family.jpg" height="400" width="400" srcset="https://corporettemoms.com/wp-content/uploads/podcasts-for-working-moms-holderness-family.jpg 400w, https://corporettemoms.com/wp-content/uploads/podcasts-for-working-moms-holderness-family-300x300.jpg 300w, https://corporettemoms.com/wp-content/uploads/podcasts-for-working-moms-holderness-family-150x150.jpg 150w" sizes="(max-width: 400px) 100vw, 400px" class="wp-image-75438 sp-no-webp" alt="An image of Penn and Kim Holderness on a striped background with text &quot;The Holderness Family Podcast&quot;" decoding="async" > I have to say, Kat and I are both big fans of the Holderness family. As Gen X/Xennial moms, how could we not relate to songs like “We Survived ’80s Halloween” or “The Pile on the Stairs“? Besides their social media channels, blog, book, AND board games, Kim and Penn Holderness produce The Holderness Family Podcast. In the weekly episodes, the couple talks about their life as a family of four, answer reader questions, and discuss topics as varied as ADHD, menopause, youth sports, and gun violence. Their guests include authors, doctors, and other experts. (Speaking of ADHD, the couple’s new book, now available for preorder, is ADHD is Awesome: A Guide to (Mostly) Thriving with ADHD (Amazon/Bookshop).) And if you need a quick laugh, check them out on TikTok. {related: registry series: essential books for new working mothers} Brilliant Balance <img src="https://corporettemoms.com/wp-content/uploads/podcasts-for-working-moms-brilliant-balance.jpg" height="400" width="400" srcset="https://corporettemoms.com/wp-content/uploads/podcasts-for-working-moms-brilliant-balance.jpg 400w, https://corporettemoms.com/wp-content/uploads/podcasts-for-working-moms-brilliant-balance-300x300.jpg 300w, https://corporettemoms.com/wp-content/uploads/podcasts-for-working-moms-brilliant-balance-150x150.jpg 150w" sizes="(max-width: 400px) 100vw, 400px" class="wp-image-75443 sp-no-webp" alt="A photo of Cherylanne Skolnicki in a white shirt and jeans with text &quot;Brilliant Balance with Cherylanne Skolnicki&quot; " decoding="async" > Cherylanne Skolnicki, a mom of three, left the corporate world years ago to become an entrepreneur, and now offers coaching for women. Skolnicki’s website describes her podcast, Brilliant Balance, as offering “ideas, inspiration, and insight on balance, business, and getting it all done gracefully” (ha, “grace”). The podcast isn’t specifically aimed at working mothers, but it has a lot of valuable insight for moms trying to balance work and family. Brilliant Balance episodes, which feature occasional guests, include “An Overachiever’s Guide to Avoiding Burnout”, “Are You Doing It All or Doing It Well?”, and “Stop Yelling! How To Speak To Your Child So They Listen.” To help you navigate the 300+ episodes, a feature on Skolnicki’s website (scroll down to “Looking for a Podcast Prescription?”) suggests ones that align with search terms you enter. Also helpful are the episode summaries, which include linked time stamps! Readers, do tell: What are your favorite podcasts for working moms and for parents in general? How do you listen to podcasts, and when/where? (function(d, s, id) { var js, pjs = d.getElementsByTagName(s)[0]; if (d.getElementById(id)) return; js = d.createElement(s); js.id = id; js.async = true; js.src = "//cdn.pubexchange.com/modules/partner/corporettemoms"; pjs.parentNode.insertBefore(js, pjs); }(document, "script", "pubexchange-jssdk"));FacebookTweetPinLinkedInPrintEmail Post Tags: #podcasts#posts'
