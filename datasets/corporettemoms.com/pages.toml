["http://corporettemoms.com/privacy-policy"]
title = "Privacy Policy - CorporetteMoms"
description = "CorporetteMoms takes very seriously the private nature of your personal information. This Privacy Policy describes how we treat the information we collect"
full_description = "Privacy Policy CorporetteMoms takes very seriously the private nature of your personal information. This Privacy Policy describes how we treat the information we collect when you visit our Web site and/or register for our e-mail newsletter. Personal InformationWhen you leave a comment at CorporetteMoms or subscribe to any of our e-mail newsletters, we may collect personal details about you. If you correspond with us by e-mail, we may retain the content of your e-mail messages, your e-mail address and our responses. CorporetteMoms will not disclose your personal information to any third party without your consent or as required by law, except to a third party as required to help us send your information to you. Upon request, we will provide you with the information that we maintain about you. Non-Personal InformationWe may also request non-personally identifiable information, such as annual income, buying preferences, or age, also known as demographic and profile data, though this information is optional. We may use this data to improve our site and/or tailor your experience at our site, showing you content that we think you might be interested in, and displaying content according to your preferences. We may also share this information with others, such as advertisers interested in advertising with CorporetteMoms, in aggregate, anonymous form, which means that the information will not contain any personally identifiable information about you or any other person. Usage InformationWhen you visit the site, we also collect web site usage information and information about your computer and internet connection, including your computer’s IP address, the type and version of browser and operating system you use, your internet domain and, if you arrived at CorporetteMoms via a link from another website, the URL of the linking page. The collection of this information allows us to, among other things, prepare for traffic load demands and to efficiently deliver content to you. Choice/Opt-OutIf we ever send you an e-mail that you did not expressly request, we will provide you with an e-mail address by which you may request to receive no future notices. CookiesCorporetteMoms and some of our partners may make use of cookies (small text tiles placed on your computer’s hard disk by our server). They are used to collect non-personal traffic information such as the number of visits to our site and pages visited. This information will only be used to assess how subscribers are using our services so that we may better serve you. This data will also allow us to manage the functionality of the site, determine which site features are most popular, and show you relevant content and advertising. CorporetteMoms will never use cookies to retrieve information from a computer that is unrelated to our site or services.You can delete cookies from your hard drive at any time. Further information on the use of cookies can be found at: http://www.cookiecentral.com. E-mailsCorporetteMoms uses reputable third parties to deliver the e-mails you will receive from our site if you subscribe to our e-mail newsletters or have chosen to receive information about CorporetteMoms products and offers. These third parties use unique identifiers and invisible images (often called “pixel tags” or “clear GIFs”) to perform message open sensing, message format sensing, and clickthrough sensing on behalf of CorporetteMoms in order to bring you more relevant information.Content and some ad services in these e-mails are provided by CorporetteMoms or a third party ad server. AdsWe use third-party advertising companies to serve ads when you visit our Web site. These companies may use aggregated information (not including your name, address, email address or telephone number) about your visits to this and other Web sites in order to provide advertisements about goods and services of interest to you. If you would like more information about this practice and to know your choices about not having this information used by these companies, please see: http://www.networkadvertising.org/managing/opt_out.asp. For specific details regarding Mediavine Programmatic Advertising, please see the bottom of the Privacy Policy. Links to Other SitesAlthough CorporetteMoms may provide links to third party sites, we are not responsible for the content that appears on those sites nor do we endorse these sites. Please review each site’s privacy policy to determine their use of information. SecurityCorporetteMoms has taken reasonable commercial precautions to prevent the misuse of users’ personal details. Occasions will arise when customer information is passed outside CorporetteMoms to other data processors but they will only act upon instruction from CorporetteMoms in order to perform the services required. Modification to this PolicyCorporetteMoms may change this privacy policy. Any changes will be reflected on this privacy policy page. If you are concerned about how your information will be used, you should check back at this privacy policy page periodically. ContactIf you should have any questions about our privacy policy, please contact us. Mediavine Programmatic Advertising (Ver 1.0) The Website works with Mediavine to manage third-party interest-based advertising appearing on the Website. Mediavine serves content and advertisements when you visit the Website, which may use first and third-party cookies. A cookie is a small text file which is sent to your computer or mobile device (referred to in this policy as a “device”) by the web server so that a website can remember some information about your browsing activity on the Website. First party cookies are created by the website that you are visiting. A third-party cookie is frequently used in behavioral advertising and analytics and is created by a domain other than the website you are visiting. Third-party cookies, tags, pixels, beacons and other similar technologies (collectively, “Tags”) may be placed on the Website to monitor interaction with advertising content and to target and optimize advertising. Each internet browser has functionality so that you can block both first and third-party cookies and clear your browser’s cache. The “help” feature of the menu bar on most browsers will tell you how to stop accepting new cookies, how to receive notification of new cookies, how to disable existing cookies and how to clear your browser’s cache. For more information about cookies and how to disable them, you can consult the information at https://www.allaboutcookies.org/manage-cookies/. Without cookies you may not be able to take full advantage of the Website content and features. Please note that rejecting cookies does not mean that you will no longer see ads when you visit our Site. In the event you opt-out, you will still see non-personalized advertisements on the Website. The Website collects the following data using a cookie when serving personalized ads: IP AddressOperating System typeOperating System versionDevice TypeLanguage of the websiteWeb browser typeEmail (in hashed form) Mediavine Partners (companies listed below with whom Mediavine shares data) may also use this data to link to other end user information the partner has independently collected to deliver targeted advertisements. Mediavine Partners may also separately collect data about end users from other sources, such as advertising IDs or pixels, and link that data to data collected from Mediavine publishers in order to provide interest-based advertising across your online experience, including devices, browsers and apps. This data includes usage data, cookie information, device information, information about interactions between users and advertisements and websites, geolocation data, traffic data, and information about a visitor’s referral source to a particular website. Mediavine Partners may also create unique IDs to create audience segments, which are used to provide targeted advertising. If you would like more information about this practice and to know your choices to opt-in or opt-out of this data collection, please visit Opt Out – NAI: Network Advertising Initiative. You may also visit http://optout.aboutads.info/#/ and http://optout.networkadvertising.org/# to learn more information about interest-based advertising. You may download the AppChoices app at YourAdChoices.com | AppChoices to opt out in connection with mobile apps, or use the platform controls on your mobile device to opt out. For specific information about Mediavine Partners, the data each collects and their data collection and privacy policies, please click here."
