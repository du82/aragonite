["https://coryd.dev/watching/movies/310131"]
title = "Movies / The Witch / Cory Dransfeldt"
description = "In 1630, a farmer relocates his family to a remote plot of land on the edge of a forest where strange, unsettling things happen. With suspicion and paranoia mounting, each family member&#039;s faith, loyalty and love are tested in shocking ways."
full_description = "The Witch (2016) ⭐⭐⭐⭐⭐ This is one of my favorite movies! This movie is in my collection! Last watched on February 18, 2025. There are probably spoilers after this banner — this is a warning about them. My thoughts Picking apples, making pies. The atmosphere throughout this movie is so weighty it could sink a ship. Maybe it should have. Every step of it is brilliantly acted, shot in gray-ish, desaturated hues and hellishly dark. Move to the new world, bring the kids, it'll be a fresh start. IN HELL. Not the scariest movie, but a remarkable debut for Eggers and horrifying in its own way. The real monster here is the family's religious zeal. And maybe the goat. The goat is fine for most of it though. Or perhaps it's malnourishment and whatever's in the water. Strike out (get cast out?) on your own with the kids, have the oldest one parent the youngest, blame her when it goes sideways, coddle all the other kids that you prefer to her and then get even angrier when it goes even further sideways. I'd argue it would've gone better if you hadn't tried to pray your way out of it (that's a lot of firewood too — do you need that much?). I'm not surprised Thomasin and Black Phillip snapped after all that. Anyways. Fantastic movie in all respects and baffling that this is Eggers' debut. I liked Nosferatu more, but I'll be watching whatever he slaps his name on next (and whatever I've missed that he already has). Overview In 1630, a farmer relocates his family to a remote plot of land on the edge of a forest where strange, unsettling things happen. With suspicion and paranoia mounting, each family member's faith, loyalty and love are tested in shocking ways."
year_published = 2025
clearnet = "https://coryd.dev/watching/movies/310131"
