["https://coryd.dev/posts/2025/live-music"]
title = "Live music"
description = "I went to my first metal show in a while this weekend — at a nice venue in one of the worst neighborhoods I've ever been in."
full_description = '''February 19, 2025 Live music I went to my first metal show in a while this weekend — at a nice venue in one of the worst neighborhoods I've ever been in.[1] Four death metal bands, two I was interested in, two hours driving and about 5 hours a venue. (That's at least two hours of dodging a pit.[2]) The place filled out and I'm consistently struck by how nice crowds for music that abrasive remain. Everyone at a metal show comes in a uniform. There's variation, but it's a uniform. Colors are dark, band shirts are everywhere, vests and jackets are covered in pins and patches. It's a dedicated crowd and I love how much everyone cares and comes out to support bands that are playing loud music because they love loud music. Bring earplugs. Have fun. "There is no need to worship these heroes from afar. You can walk up to them, say hello, and smell them up close." — Scott Carlson, Repulsion Both industrial and abandoned — with the advice that it's fine to park on the red because nobody comes down here. ↩︎ I'm not that old but I'm too old for that. Kudos to that one person at every show that invariably takes it upon themselves to supervise the pit. ↩︎ Discuss this post on Mastodon. If you found this post helpful, you can buy me a coffee.'''
