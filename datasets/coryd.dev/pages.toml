full_description = '''Timecrimes (2007) ⭐⭐⭐⭐ Last watched on February 17, 2025. There are probably spoilers after this banner — this is a warning about them. My thoughts A smart, brief, low-budget time travel tale. You step right into the loop in what you're told is the start of it, but could have been at any point in Hector's time travel cycle. It "concludes" with Hector 3 but could have — conceivably — gone on in perpetuity. Hop in the machine, break something, hop in the machine, go further back, break more things, hop in the machine, go further back, break the machine, wait for another version of yourself to fix it and keep cycling. You'll get it right, don't worry. Makes for a cheap Halloween costume and an either gripping or dreadfully boring conversation in which you try and explain it to anyone who asks. Overview A man accidentally gets into a time machine and travels back in time nearly an hour. Finding himself will be the first of a series of disasters of unforeseeable consequences.'''
