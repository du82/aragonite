title = "Books / Children of Ruin by Adrian Tchaikovsky / Cory Dransfeldt"
description = "The astonishing sequel to Children of Time, the award-winning novel of humanity&#039;s battle for survival on a terraformed planet. Thousands of years ago, Earth&#039;s terraforming program took to the stars. On the world they called Nod, scientists..."
full_description = "Children of Ruin ⭐⭐⭐⭐⭐ By Adrian Tchaikovsky This is one of my favorite books! Finished on: February 20, 2025 There are probably spoilers after this banner — this is a warning about them. My thoughts 🐙🌊🚀🕷️🧑‍🚀 The octopus book! I enjoyed the hell out of this — more than Children of Time even. It benefits from the historical context so thoroughly laid out in its predecessor and expands beautifully upon it. Explorers from Kern’s world — an alliance of humans and spiders – find yet another human-seeded world and an altogether different uplifted evolutionary branch in the form of an advanced civilization of octopuses. Oh! And alien life on nod and a prologue of peaceful exploration and expansion. Everything I want out of sci-fi, meticulously researched and eloquently presented. Now to dive into Children of Memory (as different as I’m told it is from the first two entries in the series). Related book(s)Children of Memory by Adrian TchaikovskyChildren of Time by Adrian Tchaikovsky Overview The astonishing sequel to Children of Time, the award-winning novel of humanity's battle for survival on a terraformed planet. Thousands of years ago, Earth's terraforming program took to the stars. On the world they called Nod, scientists discovered alien life — but it was their mission to overwrite it with the memory of Earth. Then humanity's great empire fell, and the program's decisions were lost to time. Aeons later, humanity and its new spider allies detected fragmentary radio signals between the stars. They dispatched an exploration vessel, hoping to find cousins from old Earth. But those ancient terraformers woke something on Nod better left undisturbed."
