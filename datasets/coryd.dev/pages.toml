full_description = '''I'm a software developer based in Camarillo, California. I enjoy hanging out with my beautiful family and 3 rescue dogs, technology, automation, music, writing, reading, tv and movies. 🪂 Notice Me (Live at Studio 4) by Balance and Composure <span class="music">🪂 Notice Me (Live at Studio 4) by <a href="https://www.coryd.dev/music/artists/balance-and-composure-united-states">Balance and Composure</a></span> Lifetime 50 plays Last Leg of the Human Table Cloakroom Grave Infestation 48 plays Festering Nihilistic Hatred Misanthropic ⭐⭐⭐⭐⭐ S1E5 ⭐⭐⭐⭐ ⭐⭐⭐⭐ S3E4 ⭐⭐⭐ Subscribe to my movies, books, links or activity feed(s). Recent activity Posts / Links / Watching / Books [Book]: Smoke and Ashes (⭐⭐⭐⭐) / February 28, 2025 [Post]: Make yourself less valuable to tech companies / February 26, 2025 [Link]: Creating connections with music and technology via Damian Walsh / February 25, 2025 [Link]: This page is under construction via Sophie Koonin / February 25, 2025 [Post]: Are we self-segregating on social media? / February 24, 2025 [Link]: New site, new domain, same me via Sean Voisen / February 24, 2025 [Book]: Ask Not (⭐⭐⭐) / February 23, 2025 [Book]: Children of Ruin (⭐⭐⭐⭐⭐) / February 20, 2025 [Post]: Live music / February 19, 2025 [Movie]: The Witch (⭐⭐⭐⭐⭐) / February 18, 2025 [Link]: Your Site Is a Home via Naz Hamid / February 18, 2025 [Link]: Boring Web Development via Jens Oliver Meiert / February 17, 2025 [Movie]: Timecrimes (⭐⭐⭐⭐) / February 17, 2025 [Book]: The Exvangelicals (⭐⭐⭐⭐) / February 17, 2025 [Movie]: The Gorge (⭐⭐⭐) / February 16, 2025 [Concert]: Nile at 1720 / February 15, 2025 [Concert]: Psycroptic at 1720 / February 15, 2025 [Concert]: Embryonic Autopsy at 1720 / February 15, 2025 [Link]: I Have Joined the light-dark() Side via Helen Chong / February 15, 2025 [Movie]: Smile 2 (⭐⭐⭐⭐) / February 14, 2025'''
