["https://coryd.dev/posts"]
title = "All posts / Cory Dransfeldt"
description = "I'm a software developer in Camarillo, California. I write about software development, technology and music."
full_description = "February 26, 2025 Make yourself less valuable to tech companies John Oliver dedicated the primary segment of his most recent episode on Meta and it's many moderation and privacy failures and violations. It was a well-reasoned take if not a redundant one for everyone who's spent time following these issues. What I found most compelling was his guidance to — if you're using their platforms — make yourself less valuable to them. February 24, 2025 Are we self-segregating on social media? Are we? Yes and that's ok. If everything is political, then it follows that everything is as toxic as our politics. It's perfectly ok to avoid toxicity. February 19, 2025 Live music I went to my first metal show in a while this weekend — at a nice venue in one of the worst neighborhoods I've ever been in. February 12, 2025 Dynamic pages with PHP and 11ty When I moved this site to my own hosting I rewrote the dynamic code that had previously been handled by edge functions in PHP. To speed up build times and make things scale nicely as I add more content and pages, I recreated my media pages as an amalgam of PHP and Liquid templates that 11ty writes out as complete pages at build time. February 1, 2025 403ing questionable referrals I'm 403ing AI crawlers and now I'm 403ing what I find to be questionable referrers. January 31, 2025 Blog questions and whatnot I've seen the blog question challenge going around recently among folks I follow and bacardi55 was kind enough to tag me to participate. So, without further delay, here we go! January 30, 2025 Chronological feeds, slow feeds RSS has always been the best way to consume news online. I first used Google Reader soon after it launched (RIP), have cycled through Feedbin, Inoreader and NewsBlur and the slow, orderly chronologically ordered list of items the form provides puts the user in control of what they consume and the pace at which they consume it. January 28, 2025 Migrating from Plex to Jellyfin for music I've been using a hosted Plex instance for my media consumption for a bit now and while I've been happy with it, I've moved my listening over to a Jellyfin server. I've been working to self-host more of the infrastructure and services I rely on and moving my music consumption and streaming under that umbrella felt like a logical next step."
