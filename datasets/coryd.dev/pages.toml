full_description = '''Balance and Composure United States 159 plays 🪂 emo Related post(s)2024 in review (December 3, 2024) Overview Balance and Composure are an American alternative rock band with melodic punk, post-hardcore, and shoegaze influences from Doylestown, Pennsylvania. The band consisted of lead vocalist/guitarist Jonathan 'Jon' Simmons, bassist Matthew Warner, drummer Bailey Van Ellis and guitarists Erik Petersen and Andy Slaymaker. The band formed in the winter of 2007; their first release being a 6-song EP entitled I Just Want To Be Pure in 2008. The EP is now out of print. A 12"/CD EP entitled Only Boundaries (2009) and a split with Tigers Jaw (2010) followed. The band has also released 3 full length albums: Separation (released May 10, 2011 on No Sleep Records), The Things We Think We're Missing (released Sept 10, 2013 on No Sleep Records), and Light We Made (released October 7, 2016 on Vagrant Records). The band broke up in 2016 but announced their comeback, along with 2 singles under the title "Too Quick to Forgive", on April 11th, 2023. The singles were produced by Will Yip and released under Memory Music. Show more I've seen this artist live! On March 23, 2019 at The Regent Notes When I Come Undone Quake I Can't Do This Alone Parachutes Back of Your Head Void Fade Keepsake Stonehands Cut Me Open Midnight Zone Spinning Postcard Reflection I Tore You Apart in My Head Encore Tiny Raindrop Notice Me Album Plays Year I Just Want To Be Pure 1 2008 No Sleep 'Till Christmas - 2008 Only Boundaries 1 2009 No Sleep 'Till Christmas 3 - 2010 Split w/Tigers Jaw - 2010 Separation 4 2011 Mixed Signals - 2011 Acoustic - 2012 The Things We Think We're Missing 16 2013 Split w/Braid - 2013 Light We Made 14 2016 Too Quick to Forgive 4 2023 with you in spirit 107 2024 The Things We Think We're Missing (Live at Studio 4) 12 2025'''
