["https://coryd.dev/colophon"]
title = "Colophon / Cory Dransfeldt"
description = "The tools I use to build and maintain this site."
full_description = "Cory Dransfeldt Posts Music Watching Books Links About Search Feeds Mastodon Colophon This site is built and maintained using a number of tools. The frontend of the site is built using 11ty and is hosted on a standard LAMP box. It rebuilds hourly. Media pages are rendered on request using PHP in templates built by 11ty. These pages are cached on the server using redis and the final markup is again cached by bunny.net's CDN. Posts, links, and media data (music, watching, and books) are stored in a PostgresSQL database and managed via a Directus instance deployed using Coolify. I use API calls to PostgREST to access data. My contact form is routed through an API written in PHP, emails are sent through forwardemail.net and reponses are persisted in Directus. Posts are composed in Obsidian before being saved in Directus. Images are hosted on Backblaze B2 and served by bunny.net. I use DNSimple to register my domains and DNSControl to configure and manage records. The DNS records for this site sit at bunny.net and traffic is routed through their CDN."
