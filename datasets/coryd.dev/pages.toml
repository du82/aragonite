["https://coryd.dev/books/9781529349252"]
title = "Books / Smoke and Ashes by Amitav Ghosh / Cory Dransfeldt"
description = "When Amitav Ghosh began his research for the Ibis Trilogy some twenty years ago, he was startled to find how the lives of the nineteenth-century sailors and soldiers he wrote of were dictated not only by the currents of the Indian Ocean, but also by..."
full_description = '''Smoke and Ashes ⭐⭐⭐⭐ By Amitav Ghosh Finished on: February 28, 2025 There are probably spoilers after this banner — this is a warning about them. My thoughts This made for a fascinating read about a historical topic I only had a vague familiarity with[1]. It's detailed inasmuch as it connects the spread of opium's history, production and consumption — meticulous research as narrative. Chinese rulers had banned opium, the British grew it in India and fought two wars with China to force legalization, knowing full well how addictive it was. He traces the impact on India, China and everywhere in between as colonial Britain fought for the right to profit off of addictive human suffering (the Dutch played their part two). He pulls in his own experience writing fiction that touches on the opium trade, transforms what could be dry history into a compelling narrative, pulls in the Sackler family's involvement with a well-deserved reference to Patrick Radden Keefe's Empire of Pain[2]. One of the better, more thorough, pieces of historical non-fiction I've read recently. By vague familiarity I mean that I'd heard that opium wars had happened. ↩︎ A more compelling, focused read that covers Purdue's actions in isolation. ↩︎ Related book(s)Empire of Pain by Patrick Radden Keefe Overview When Amitav Ghosh began his research for the Ibis Trilogy some twenty years ago, he was startled to find how the lives of the nineteenth-century sailors and soldiers he wrote of were dictated not only by the currents of the Indian Ocean, but also by a precious commodity carried in enormous quantities on those: opium. Most surprising of all was the discovery that his own identity and family history were swept up in the story. Smoke and Ashes is at once a travelogue, a memoir and an excursion into history, both economic and cultural. Ghosh traces the transformative effect the opium trade had on Britain, India and China, as well as on the world at large. Engineered by the British Empire, which exported opium from India to sell in China, the trade and its revenues were essential to the Empire's survival. Upon deeper exploration, Ghosh finds opium at the origins of some of the world's biggest corporations, several of America's most powerful families and institutions, and contemporary globalism itself. In India the long-term consequences were even more profound. Moving deftly between horticultural histories, the mythologies of capitalism and the social and cultural repercussions of colonialism, Smoke and Ashes reveals the pivotal role one small plant has played in the making of the world as we know it — a world that is now teetering on the edge of catastrophe. "In thinking about the opium poppy's role in history it is hard to ignore the feeling of an intelligence at work. The single most important indication of this is the poppy's ability to create cycles of repetition, which manifest themselves in similar phenomena over time. What the opium poppy does is clearly not random; it builds symmetries that rhyme with each other. It is important to recognize that these cycles will go on repeating, because the opium poppy is not going away anytime soon. In Mexico, for instance, despite intensive eradication efforts the acreage under poppy cultivation has continued to increase. Indeed, there is more opium being produced in the world today than at any time in the past. Only by recognizing the power and intelligence of the opium poppy can we even begin to make peace with it."'''
year_published = 2025
clearnet = "https://coryd.dev/books/9781529349252"
