title = "Books / Empire of Pain by Patrick Radden Keefe / Cory Dransfeldt"
description = "The gripping and shocking story of three generations of the Sackler family and their roles in the stories of Valium, OxyContin and the opioid crisis. The inspiration behind the Netflix series Painkiller, starring Uzo Aduba and Matthew Broderick. The..."
full_description = '''Empire of Pain By Patrick Radden Keefe This is one of my favorite books! Finished on: August 1, 2021 Related book(s)Smoke and Ashes by Amitav Ghosh Overview The gripping and shocking story of three generations of the Sackler family and their roles in the stories of Valium, OxyContin and the opioid crisis. The inspiration behind the Netflix series Painkiller, starring Uzo Aduba and Matthew Broderick. The Sunday Times Bestseller Winner of the 2021 Baillie Gifford Prize for Non-Fiction A BBC Radio 4 'Book of the Week' Shortlisted for the 2021 Financial Times/McKinsey Business Book of the Year Award One of Barack Obama’s Favorite Books of 2021 Shortlisted for the Crime Writers' Association Gold Dagger for Non-Fiction 'I gobbled up Empire of Pain . . . a masterclass in compelling narrative nonfiction.' – Elizabeth Day, The Guardian '30 Best Summer Reads' ‘You feel almost guilty for enjoying it so much’ – The Times The Sackler name adorns the walls of many storied institutions – Harvard; the Metropolitan Museum of Art; Oxford; the Louvre. They are one of the richest families in the world, known for their lavish donations in the arts and the sciences. The source of the family fortune was vague, however, until it emerged that the Sacklers were responsible for making and marketing Oxycontin, a blockbuster painkiller that was a catalyst for the opioid crisis – an international epidemic of drug addiction which has killed nearly half a million people. In this masterpiece of narrative reporting and writing, award-winning journalist and host of the Wind of Change podcast Patrick Radden Keefe exhaustively documents the jaw-dropping and ferociously compelling reality. Empire of Pain is the story of a dynasty: a parable of twenty-first-century greed. 'There are so many "they did what?" moments in this book, when your jaw practically hits the page' – Sunday Times'''
