["https://coryd.dev/posts/2025/make-yourself-less-valuable-to-tech-companies"]
title = "Make yourself less valuable to tech companies"
description = "John Oliver dedicated the primary segment of his most recent episode on Meta and it's many moderation and privacy failures and violations. It was a well-reasoned take if not a redundant one for everyone who's spent time following these issues. What I found most compelling was his guidance to —..."
full_description = "February 26, 2025 Make yourself less valuable to tech companies John Oliver dedicated the primary segment of his most recent episode on Meta and it's many moderation and privacy failures and violations. It was a well-reasoned take if not a redundant one for everyone who's spent time following these issues. What I found most compelling was his guidance to — if you're using their platforms — make yourself less valuable to them.[1] It is, however, worth exploring how to take the same steps for other platforms. Many of these platforms are either engaged in privacy violations, data extraction, pursuit of military contracts or the appeasement of a US administration that's actively assaulting civil rights, minorities and anyone outside of the billionaire set supporting them. Google Navigate to the Data & privacy section of your account. Scroll down and disable Web & App Activity, Timeline, YouTube History, Personalized ads and Search personalization. If you use Fit, open Manage Google Fit privacy and disable all of the options under Data sharted with Google Assistant, Fit personalization options and Fit data permissions. Scroll down to the Profile section and change each item you can edit to Only you. Remove any information you may habe provided (Contact info, About, Work & education). If you're using Google analytics, replace it with one of the available options that respects user privacy: Fathom Plausible Umami Goatcounter Microsoft Privacy settings for Microsoft are available here. Navigate to the Location tab and delete any data contained therein. If you use Bing for search[2], go to Browsing and search and clear y our activity. Open Apps and services and click Clear all activities. In the pop up that follows select 30 days for the Clear this data every prompt. Navigate to each section that follows and clear any data contained therein: Spelling and text, People suggestions, Search and news personalization and Copilot. Open Personalized ads & offers and disable each option. If you use Windows, follow the instructions to turn off personalized ads on your machine. Open Promotional communications and unsubscribe from everything. Review privacy settings for any other Microsoft products you may be using. Apple Disable personalized ads by navigating to Settings > Privacy & Security > Apple Advertising on each device you own and turn Personalized Ads off. Disable location-based ads by navigating to Settings > Privacy & Security* > Location Services and select App Store and News and set Allow Location Access to Never. Disable app tracking by navigating to Settings > Privacy > Tracking and turning the toggle for each app. Turn Allow apps to Request to Track off. Consider using a service like NextDNS to disable native Apple tracking by blocking connections to metrics.icloud.com and other Apple analytics domains. This may also be accomplished using a Pi-hole. Amazon Go to Advertising Privacy and Preferences and select Do not show me interest-based ads provided by Amazon. Scroll down and click Delete ad data. Go to Manage Your Alexa Data. Under Voice Recordings click Choose how long to save recordings, select Don't save recordings and hit Confirm. Under Smart Home Device History and click Choose how long to save history, select Save history for 3 months and hit Confirm. Optionally, click One-time deletion of history and hit Delete. Under Detected Sounds History open Choose how long to save history, select Save history for 3 months and hit Confirm. Uner Interest-Based Ads from Amazon on Alexa turn off Receive interest-based ads delivered by Amazon on Alexa. Under Help improve Alexa turn off Use of voice recordings. Under Use messages to improve transcriptions toggle each user's setting to off. Navigate to Amazon Devices Privacy, open each device and turn off Device Usage Data, Interest-based Ads and Collect App Usage Data. Navigate to Your Browsing History click the gear in the top right hand corner of the page, click Remove items, click More settings and toggle Browsing History to off. X/Twitter Don't use it. Delete your account or — if you feel you need to preserve your username — delete your posts and make your account private. OpenAI Navigate to Settings > Data controls click on Improve the model for everyone and toggle the setting to off. Additionally, on any web properties you control or work on, update your robots.txt to ask AI crawlers not to crawl your site. There's a list of said crawlers here. TikTok Navigate to your profile, tap on the hamburger menu in the top right, tap Settings and privacy, consider toggling Private account on, toggle Activity status off. Turn off the option to Sync contacts if available. Uber Open the app, select Account, navigate to Settings > Privacy > Offers and Promos from Uber and tuen off Allow personalized offers and promos from Uber. Go back to Privacy, select Ads on Uber Eats and turn off Personalize your ads on Uber and Postmates. Go back to Privacy, select Ads on Rides and turn off Personalize ads you see on rides. Go back to Privacy, open Gender identity, tap the pencil icon and tap Remove my gender information to prevent the company from using this data for personalization. PayPal Open Settings > Data & privacy > Manage shared info > Personalized shopping and toggle this setting off. General advice Use an adblocker on all of your browsers. Disable any settings similar to those outlined above for each tech company you interact with. Delete any apps from your device that you don't actively need or use. If a company offers an app and a mobile website, use the latter. Use masked emails when signing up for services. This functionality is offered via iCloud, Fastmail and SimpleLogin/Proton. Cancel subscriptions and reduce spending with any or all of the companies above. It's hard to exit the Apple and Google ecosystems depending on which devices you use. Explorer third party services from smaller companies available in either ecosystem. Make media purchases from other companies and providers. Consider buying music instead of streaming it. I'm confident I've missed plenty here but I'd urge you to examine the privacy policies, public stances, support and actions taken by these companies and adjust your financial interactions with and value you provide to each of them. Individual consumer action is a difficult way to create broad-based change, but it's action worth taking all the same. In true John Oliver fashion, this information is available at a truly memorable domain name. ↩︎ Haha. ↩︎ Take a look at the GitHub repository for this project. (Give it a star if you feel like it.) Discuss this post on Mastodon. If you found this post helpful, you can buy me a coffee."
