["https://coryd.dev/books/9780316452496"]
title = "Books / Children of Time by Adrian Tchaikovsky / Cory Dransfeldt"
description = "Winner of the 2023 Hugo Award for Best Series! Adrian Tchaikovsky&#039;s award-winning novel Children of Time, is the epic story of humanity&#039;s battle for survival on a terraformed planet. Who will inherit this new Earth? The last remnants of..."
full_description = "Children of Time ⭐⭐⭐⭐⭐ By Adrian Tchaikovsky This is one of my favorite books! Finished on: January 27, 2025 There are probably spoilers after this banner — this is a warning about them. My thoughts A beautiful, absorbing sci-fi tale: mankind at its worst, aimlessly seeking a new home and declaring their manifest right to the first habitable planet that they encounter. Never mind that said planet grew out of terraforming efforts undertaken in a previous human, imperial era that self-destructed (as humans so often do). The last remnants of humanity versus the last human of a previous era, defending an experiment that failed on her terms and succeeded on its own. I never thought I'd find spiders, a civilization of spiders so engrossing, sympathetic and — often — admirable. Instead of conquering as humans are inclined to they collaborate. Instead of consuming their environment, they respect it and grow with it. First contact with an alien species that you unwittingly created and they show you the mercy you would refuse them. Humanity unintentionally births something unlike them and it is all the better for those differences. This is one of the more imaginative sci-fi books I've read since The Expanse and I can't wait to dig into the rest. Related book(s)Children of Memory by Adrian TchaikovskyChildren of Ruin by Adrian Tchaikovsky Overview Winner of the 2023 Hugo Award for Best Series! Adrian Tchaikovsky's award-winning novel Children of Time, is the epic story of humanity's battle for survival on a terraformed planet. Who will inherit this new Earth? The last remnants of the human race left a dying Earth, desperate to find a new home among the stars. Following in the footsteps of their ancestors, they discover the greatest treasure of the past age—a world terraformed and prepared for human life. But all is not right in this new Eden. In the long years since the planet was abandoned, the work of its architects has borne disastrous fruit. The planet is not waiting for them, pristine and unoccupied. New masters have turned it from a refuge into mankind's worst nightmare. Now two civilizations are on a collision course, both testing the boundaries of what they will do to survive. As the fate of humanity hangs in the balance, who are the true heirs of this new Earth?"
