["https://coryd.dev/books/9780316276177"]
title = "Books / Ask Not by Maureen Callahan / Cory Dransfeldt"
description = "From New York Times bestseller Maureen Callahan, a fierce, character-driven exposé of the real Kennedy Curse — the family’s generations-long legacy of misogyny, murder, and mayhem — and the women who have paid the price for our obsession with..."
full_description = "Ask Not ⭐⭐⭐ By Maureen Callahan Finished on: February 23, 2025 There are probably spoilers after this banner — this is a warning about them. My thoughts The author's qualifier that they've taken creative license with some of these accounts is...well, it does a lot to strike down a lot of trust you might have had in what follows. Everything that's described is both salacious and not exactly beyond belief. The Kennedy family is often regarded as royalty, the entire concept of which is (or was?) anathema to the American experiment (the results of which haven't been great, but that's a larger discussion). There have always been rumors about JFK's affairs that get played down, the incident in Chappaquiddick with Ted and, well, on and on. People in power do whatever they can to stay in power. Rich people ascribe to themselves admirable qualities that they neither possess nor exhibit while trampling on whoever they please to retain that status. Big family name, seriously questionable history (lord knows what harm will be caused by the family member in the current, viciously cruel administration) and artistic license taken in the retelling. Not the best book, but the family it covers has an often sterling reputation that isn't deserved. Overview From New York Times bestseller Maureen Callahan, a fierce, character-driven exposé of the real Kennedy Curse — the family’s generations-long legacy of misogyny, murder, and mayhem — and the women who have paid the price for our obsession with Camelot The Kennedy name has long been synonymous with wealth, power, glamor, and — above all else — integrity. But this carefully constructed veneer hides a dark truth: the pattern of Kennedy men physically and psychologically abusing women and girls, leaving a trail of ruin and death in each generation’s wake. Through decades of scandal after scandal — from sexual assaults to reputational slander, suicides to manslaughter — the family and their defenders have kept the Kennedy brand intact. Now, in Ask Not, bestselling author and journalist Maureen Callahan reveals the Kennedys’ hidden history of violence and exploitation, laying bare their unrepentant sexism and rampant depravity while also restoring these women and girls to their rightful place at the center of the dynasty’s story: from Jacqueline Onassis and Marilyn Monroe to Carolyn Bessette, Martha Moxley, Mary Jo Kopechne, Rosemary Kennedy, and many others whose names aren’t nearly as well known but should be. Drawing on years of explosive reportage and written in electric prose, Ask Not is a long-overdue reckoning with this fabled family and a consequential part of American history that is still very much with us. At long last Callahan redirects the spotlight to the women in the Kennedys’ orbit, paying homage to those who freed themselves and giving voice to those who, through no fault of their own, could not."
