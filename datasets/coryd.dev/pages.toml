["https://coryd.dev/now"]
title = "Now / Cory Dransfeldt"
description = "See what I'm doing now."
full_description = "Cory Dransfeldt Posts Music Watching Books Links About Search Feeds Mastodon Now Family Hanging out with and spending as much time as possible with my lovely wife, kids and rescue dogs (we've got a guinea pig too). Work I started a new job in August and love it. Getting tattooed It's been an ongoing process of recovering from sessions, resuming my exercising routine and returning for the next session. I have two chest pieces, a new piece above my left knee and we've been working away on my right arm. Making Scrobbling and data ownership: I've been building and improving my self-hosted scrobbling solution. I've been working to bring my movie, TV and reading data in-house too. Ad and tracker-blocking: I've been updating and maintaining a list of ad and tracker-blocking tools that I'm happy to take contributions to. Modern advertising is awful and intrusive. Do what you can to block it. Fiddling with simple web components: I've been working on and incorporating some web components into this site. I've built a theme toggle, select-based pagination and one that loads text from an API (used on my home page). Encouraging folks to block AI web crawlers: they're insidious, abusive and should be blocked. I'm happy to take contributions, once again, as we encourage folks to block them as best they can. Mentoring I've been mentoring through Underdog Devs on and off for a few years now and find it incredibly rewarding. This is a now page, and if you have your own site, you should make one too."
