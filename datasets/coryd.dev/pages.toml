["https://coryd.dev/posts/2025/are-we-self-segregating-on-social-media"]
title = "Are we self-segregating on social media?"
description = "Are we? Yes and that's ok. If everything is political, then it follows that everything is as toxic as our politics. It's perfectly ok to avoid toxicity."
full_description = '''February 24, 2025 Are we self-segregating on social media? Are we? Yes and that's ok. If everything is political, then it follows that everything is as toxic as our politics. It's perfectly ok to avoid toxicity. If you went to a local restaurant expecting wait staff to bring you food and drinks, and instead a monkey screamed at you and threw its own poop, you would leave. That's a pretty extreme example but not an inaccurate one. If a bar becomes a nazi bar, you should leave. If a social media platform reinstates and amplifies fascists, you should leave. Self-segregation is a fair description of what we're seeing, but fleeing a toxic space for one that — well — is a perfectly reasonable course of action. We should be less worried about echo chambers and more worried about harassment and user safety. "Free speech" advocates have and will continue to have free speech. What they often want — and need not be granted — is a captive audience to harass. Discuss this post on Mastodon. If you found this post helpful, you can buy me a coffee.'''
year_published = 2025
