["https://coryd.dev/uses"]
title = "Uses / Cory Dransfeldt"
description = "Software, tools and services that I use regularly."
full_description = '''Cory Dransfeldt Posts Music Watching Books Links About Search Feeds Mastodon Uses Software and services that I use for work and my own enjoyment. Computer setup Midnight MacBook Air (2022 - M2) 27" Dell Monitor Apple Magic Keyboard with Touch ID + number pad Apple Magic Trackpad Homepod Mini for audio Desk and chair My desk is a custom-made corner desk I bought on Etsy years ago. It's sturdy, has tons of storage, and finally arrived with a chip on the surface to add some character after the first one got lost by the freight company on the journey from Michigan to Los Angeles. I probably wouldn't repeat the experience, but I do love the desk. Herman Miller Aeron chair: it's pretty comfortable and makes swiveling around my corner desk easy. macOS + iOS Vivaldi: an extremely configurable Chromium-based browser without any AI cruft. Obsidian: fast and configurable (or minimal) as you'd like, I use it for all of my notes and writing. Amperfy: a native Subsonic client that works nicely with Navidrome. Mona: an incredibly flexible and reliable Mastodon client. NetNewsWire: I have it connected to a self-hosted instance of FreshRSS for syncing. I use Obsidian to capture pages for reference and Safari reading list for what I plan to (someday) read (or listen to via Safari's listen to page functionality). Parcel: the most flexible and reliable package tracker for Apple's ecosystem. iOS LinkThing: an open source client for the linkding bookmarking app. FontCase: for managing/installing fonts. macOS Magnet: flexible, powerful window management. Meta: the best utility for tagging and organizing music files on macOS. Permute: a useful utility for quickly converting files to different formats. noTunes: a lightweight utility that prevents Music.app from launching. It also allows you to set a new default music player. Dev tools Sublime Text: fast, stable and reliable. iTerm2: a feature rich terminal app — more flexible and powerful than the native macOS terminal. Catppuccin: nearly as ubiquitous as Dracula but lighter and more playful, I've started using this theme wherever I'm looking at/reading/writing code. Mono Lisa: a relatively new find, I've been enjoying how pleasant and readable this font is (and have even gone so far as to install it on iOS via FontCase). Services Proton: the most secure email provider around. I use their VPN, Drive and Calendar services as well. NextDNS: a privacy-focused, set it and forget it DNS service. I use their security features on my home network and a profile with strict ad-blocking rules on all of my devices. DNSimple: a robust, user-friendly DNS provider and registrar. I moved my domains here after my old provider was acquired. Hetzner: hosting for my site and applications. Coolify: for web application management and deployment. Directus: an extremely flexible backend application that I use as the content management system for this site. Navidrome: a self-hosted, performant, music-streaming application. linkding: a self-hosted bookmark manager for things I want to reference or read later. Umami: self-hosted web analytics. bunny.net: an affordable and altogether user-friendly CDN. I host the images for my site with them and use their optimizer/transforms heavily. forwardemail.net: a simple and reliable service for forwarding and routing emails from a few of the domains I own. I use it to handle emails for Coolify, Cal.com, Directus and some notifications from edge functions (usually to inform me that something failed). Arq: It backs up my MacBook Air and attached storage drive to Backblaze B2. Check out uses.tech for more lists like this one.'''
