Patrick Radden Keefe has garnered prizes..."""
full_description = 'Rogues By Patrick Radden Keefe Overview From the prize-winning, New York Times bestselling author of Say Nothing and Empire of Pain, twelve enthralling stories of skulduggery and intrigue by one of the most decorated journalists of our time. Patrick Radden Keefe has garnered prizes ranging from the National Magazine Award to the Orwell Prize to the National Book Critics Circle Award for his meticulously reported, hypnotically engaging work on the many ways people behave badly. Rogues brings together a dozen of his most celebrated articles from The New Yorker. As Keefe says in his preface, "They reflect on some of my abiding preoccupations: crime and corruption, secrets and lies, the permeable membrane separating licit and illicit worlds, the bonds of family, the power of denial." Keefe brilliantly explores the intricacies of forging $150,000 vintage wines, examines whether a whistleblower who dared to expose money laundering at a Swiss bank is a hero or a fabulist, spends time in Vietnam with Anthony Bourdain, chronicles the quest to bring down a cheerful international black market arms merchant, and profiles a passionate death penalty attorney who represents the "worst of the worst," among other bravura works of literary journalism. The appearance of his byline in The New Yorker is always an event, and collected here for the first time readers can see his work forms an always enthralling but deeply human portrait of criminals and rascals, as well as those who stand up against them.'
