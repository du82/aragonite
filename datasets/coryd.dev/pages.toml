["https://coryd.dev/books/9781250284471"]
title = "Books / The Exvangelicals by Sarah McCammon / Cory Dransfeldt"
description = """
The first definitive book that names the massive social movement of people leaving the church: the exvangelicals.
Growing up in a deeply evangelical family in the Midwest in the ‘80s and ‘90s, Sarah McCammon was strictly taught to fear God, obey..."""
full_description = "The Exvangelicals ⭐⭐⭐⭐ By Sarah McCammon Finished on: February 17, 2025 There are probably spoilers after this banner — this is a warning about them. My thoughts An explanation of the cult-like Christian right[1] as the author works through her own exit from it. You gain empathy, compassion and a freedom to think while losing the friends and family still tightly enmeshed in the institution. I never grew up in an institution like this and McCammon gave (and continues to give) it and its adherents more grace than I would (and do). Central to being a parent is helping your kids grow and flourish. You give them the space to try and fail. You cheer them when you succeed. You love them unconditionally, do your best to guide them and support them. The evangelical method(s) of parenting as I understand it (and as McCammon explains it) is far sterner, dictatorial and rife with fire and brimstone. There's a zealous conviction about what is or isn't wrong with no wiggle room. There's suppression, admonishment and self-righteous hubris. There are many religions I'm not a part of (all of them?) and that's great. Do your thing, let other folks do their thing, be kind and move on. Seems simple. Instead, we have a bucket (basket?) of evangelicals so utterly hypocritical it would be funny if not for the harm they're inflicting. McCammon speaks at length about the harm caused by growing up in this institution, the extent to which it hampers social development, experience — you name it. Now said institution has put a fascist in power and will gladly damage the country and the world as enthusiastically as they do the members of their own church. Cult adjacent? right-wing Christian cult? It's a shameful institution, pick a name and a characterization. ↩︎ Overview The first definitive book that names the massive social movement of people leaving the church: the exvangelicals. Growing up in a deeply evangelical family in the Midwest in the ‘80s and ‘90s, Sarah McCammon was strictly taught to fear God, obey him, and not question the faith. Persistently worried that her gay grandfather would go to hell unless she could reach him, or that her Muslim friend would need to be converted, and that she, too, would go to hell if she did not believe fervently enough, McCammon was a rule-follower and — most of the time — a true believer. But through it all, she was increasingly plagued by fears and deep questions as the belief system she'd been carefully taught clashed with her expanding understanding of the outside world. After spending her early adult life striving to make sense of an unraveling worldview, by her 30s, she found herself face-to-face with it once again as she covered the Trump campaign for NPR, where she witnessed first-hand the power and influence that evangelical Christian beliefs held on the political right. Sarah also came to discover that she was not alone: she is among a rising generation of the children of evangelicalism who are growing up and fleeing the fold, who are thinking for themselves and deconstructing what feel like the “alternative facts” of their childhood. Rigorously reported and deeply personal, The Exvangelicals is the story of the people who make up this generational tipping point, including Sarah herself. Part memoir, part investigative journalism, this is the first definitive book that names and describes the post-evangelical movement: identifying its origins, telling the stories of its members, and examining its vast cultural, social, and political impact."
