full_description = '''Lifetime United States 50 plays 😢 emo Related artist(s)Kid Dynamite 40 playsPaint It Black 47 plays Overview Lifetime, a melodic hardcore/emo band from New Brunswick, NJ, was formed in 1990 by vocalist Ari Katz and guitarist Dan Yemin (also known for Kid Dynamite, Paint It Black, and Armalite). Emerging from the New York/New Jersey hardcore scene, Lifetime stood out by focusing on personal and positive themes, contrasting with the more aggressive tone of their peers. Their debut album, Background (1992), reflected a rawer sound before shifting toward a more melodic style. By 1995, the band's lineup stabilized with the addition of Pete Martin (guitar), David Palaitis (bass), and Scott Golley (drums). That year, they released Hello Bastards on Jade Tree Records, which blended melodic punk with a fast-paced hardcore tempo. The album included introspective lyrics about relationships and youth, along with a cover of Hüsker Dü's "It's Not Funny Anymore." In 1996, Lifetime released a compilation of 7" singles and unreleased tracks. Their third album, Jersey's Best Dancers (1997), delivered 12 songs in under 24 minutes and further refined their melodic hardcore sound. Shortly after its release, the band disbanded. Following Lifetime's breakup, Dan Yemin formed Kid Dynamite and Paint It Black, while Ari Katz, David Palaitis, and Tannis Kristanjson started Zero Zero. In August 2005, Lifetime reunited for three shows after the cancellation of Hellfest. They played in Philadelphia at The Trocadero Theatre and Starlight Ballroom (alongside hardcore band 108) and finished at The Stone Pony in Asbury Park, NJ, with The Loved Ones and The Bouncing Souls. Proceeds from these shows supported various charities. More reunion shows followed in January 2006 in California. By November 2005, Lifetime officially reformed. In 2006, they signed with Decaydence (an imprint of Fueled by Ramen), and their self-titled fourth album was released in February 2007. Show more Album Plays Year Dwell - 1991 Background - 1993 Tinnitus 4 1994 Hello Bastards 21 1995 The Boy's No Good - 1996 Jersey's Best Dancers 12 1997 Somewhere in the Swamps Of Jersey - 2006 Two Songs 2 2006 Lifetime 11 2007'''
