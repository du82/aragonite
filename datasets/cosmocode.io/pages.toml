full_description = '<img data-lazy-fallback="1" decoding="async" fetchpriority="high" width="233" height="300" src="https://i0.wp.com/cosmocode.io/wp-content/uploads/2020/10/shadab-dp-1.jpeg?resize=233%2C300&#038;ssl=1" alt="" class="wp-image-5189" srcset="https://i0.wp.com/cosmocode.io/wp-content/uploads/2020/10/shadab-dp-1.jpeg?resize=233%2C300&amp;ssl=1 233w, https://i0.wp.com/cosmocode.io/wp-content/uploads/2020/10/shadab-dp-1.jpeg?resize=794%2C1024&amp;ssl=1 794w, https://i0.wp.com/cosmocode.io/wp-content/uploads/2020/10/shadab-dp-1.jpeg?resize=768%2C990&amp;ssl=1 768w, https://i0.wp.com/cosmocode.io/wp-content/uploads/2020/10/shadab-dp-1.jpeg?resize=1191%2C1536&amp;ssl=1 1191w, https://i0.wp.com/cosmocode.io/wp-content/uploads/2020/10/shadab-dp-1.jpeg?w=1241&amp;ssl=1 1241w" sizes="(max-width: 233px) 100vw, 233px" data-recalc-dims="1" />Just not to sound egotist, I’ve named this section About Us. Otherwise, it is all About Me. Knowledge is not an Intellectual Property, it is an Intellectual Liability. As we gain knowledge, we become liable to spread it. Like money, knowledge should keep floating across geographical, cultural and economic boundaries. That is the sole reason I have founded CosmoCode.io, a free coding website. By profession, I am a Senior Software Engineer in a US-based MNC. I live in London. My primary role is to take care of Test Automation projects. I have also done DevOps and frontend development in my previous roles. I can communicate with my computer in multiple languages (except the one they actually understand i.e. assembly). My memory, heart, and mailbox, all are large enough to accommodate more people. I can be reached out at contact(at)CosmoCode(dot)io. Please feel free to use Contact Us form in the footer of the website to leave your feedback, queries or just a Hello. Signing off ~ Shadab Ansari https://www.linkedin.com/in/ContactShadab/https://twitter.com/ContactShadabhttps://github.com/ContactShadab'
