title = "Handling Alert dialog, Popup windows and Frames | Handling Alert dialog – CosmoCode (Formerly TeachMeSelenium)"
description = "In the Previous Tutorial, we learned how to handle timeout issues in Selenium. In this tutorial, we will learn how to handle Alert windows. What is an Alert window? You must have noticed that …"
full_description = 'What is an Alert window?Switch to Alert windowRead the text of Alert windowAccept an Alert (click on OK/Yes) Dismiss an Alert (click on Cancel/No)Complete code In the Previous Tutorial, we learned how to handle timeout issues in Selenium. In this tutorial, we will learn how to handle Alert windows. What is an Alert window? You must have noticed that on clicking some links/buttons, the page displays an alert window that asks the user to confirm if she or he wants to do this action by clicking on OK/Cancel or Yes/No buttons. Some of them display text like this – “Are you sure you want to perform this action?”. You can check it out yourself by going to the Automation Practice page. When you’ll click on the link – ‘Click Me to get Alert’, the page will prompt this alert: <img data-lazy-fallback="1" decoding="async" src="https://i2.wp.com/4.bp.blogspot.com/-pzfryX2swpA/U2813W8dgEI/AAAAAAAABPw/j7xTeBdIUzo/s1600/Untitled.png" alt="" /> This popup window is not part of the web page so normal Selenium code won’t be able to perform any action on it. It is a JavaScript Alert window. To handle these type of scenarios WebDriver has given Alerts interface. Switch to Alert window Launch the browser and navigate to the Automation Practice page. Java Python System.setProperty("webdriver.chrome.driver", "C:\\teachmeselenium\\chromedriver.exe"); WebDriver driver = new ChromeDriver(); driver.get("https://cosmocode.io/automation-practice"); from selenium import webdriver chrome_driver_path = "C:\teachmeselenium\chromedriver.exe" driver = webdriver.Chrome(chrome_driver_path) driver.get("https://cosmocode.io/automation-practice") Click on the link – Click Me to get Alert Java Python driver.findElement(By.linkText("Click Me to get Alert")).click(); driver.find_element_by_link_text("Click Me to get Alert").click() As this statement is executed, the browser will prompt an alert as displayed in the above screenshot. To perform any action on this alert window, WebDriver first, needs to switch to it. Java Python Alert alert = driver.switchTo().alert(); You need to import package org.openqa.selenium.Alert for the Alert interface. alert = driver.switch_to_alert() Now we have an Alert object, we can perform actions on it. Read the text of Alert window Java Python String strAlertText = alert.getText(); alertText = alert.text; Accept an Alert (click on OK/Yes) Java Python alert.accept(); alert.accept() Dismiss an Alert (click on Cancel/No) Java Python alert.dismiss(); alert.dismiss() Looks like it has only three methods to remember? When we type alert followed by a dot(.), your code editor will suggest some more options. Try it out and let me know your finding in comments. Complete code Java Python System.setProperty("webdriver.chrome.driver", "C:\\teachmeselenium\\chromedriver.exe"); WebDriver driver = new ChromeDriver(); driver.get("https://cosmocode.io/automation-practice"); driver.findElement(By.linkText("Click Me to get Alert")).click(); Alert alert = driver.switchTo().alert(); String strAlertText = alert.getText(); System.out.println(strAlertText); alert.accept(); //alert.dismiss(); driver.quit(); from selenium import webdriver chrome_driver_path = "C:\teachmeselenium\chromedriver.exe" driver = webdriver.Chrome(chrome_driver_path) driver.get("https://cosmocode.io/automation-practice") #Click on the link driver.find_element_by_link_text("Click Me to get Alert").click() #Switch to alert window alert = driver.switch_to_alert() #Get Text print(alert.text) #Accept alert alert.accept() #Reject alert # alert.dismiss() driver.quit() This tutorial was so short and crispy. Wasn’t it? In the Next Tutorial, we will explore real-world challenges like handling popup windows. Share this:TweetMore Waits | Explicit waitHandling Alert dialog, Popup windows and Frames | Handling Popup windows'
