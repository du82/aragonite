description = "CotEditor 5.0.1の変更点"
full_description = "CotEditor 5.0.1 リリース: 2024-09-22 改良 ファイルブラウザのプレビュー表示に「プレーンテキストで開く」ボタンを追加 FinderでCotEditorがデフォルトアプリとして設定されているファイルがファイルブラウザで選択されたときは必ずそのファイルをプレビューではなくテキストとして開くよう変更 フォルダブラウザのパフォーマンスを改善 Fixes 開いたフォルダにアーカイブファイルが含まれていたときにアプリがクラッシュするmacOS 14の不具合を修正 フォルダブラウザに表示されているファイル/フォルダが実際のストレージで削除されても表示に反映されていなかった不具合を修正 インデントスタイルの検知が反映されていなかった不具合を修正 新機能ウインドウの日本語、中国語、韓国語表示を修正 AppStore版: 「寄付」設定ペインでユーザがアクションをキャンセルしたときに不必要なアラートが表示されることがあった不具合を修正 CotEditor 5.0.0 リリース: 2024-09-16 新機能 フォルダナビゲーション: CotEditorでフォルダを開いて、新しいサイドバーからフォルダ内容をブラウズし書類を切り替え macOS 15 Sequoiaに対応 Apple Intelligenceの作文ツールに対応 AppStore版: アプリ内課金でユーザがCotEditorプロジェクトにドネーションができる「ドネーション」設定ペインを追加 「編集」>「選択」メニューに新しい「内包する記号を選択」コマンドと「選択範囲を行に分割」コマンドを追加 「ファイル」メニューに「Finderに表示」コマンドを追加 CotEditorで書類を作成するショートカット用アクションを追加 CotEditorテーマのフォーマットに「ハイライト」を追加 テーマの現在の行カラーでアルファ値をサポート 韓国語ローカリゼーションを追加（Minseok Choeさんに感謝!） Assemblyシンタックスを追加 「Resinifictrix (Dark)」テーマを追加 改良 システム要件をmacOS 14 Sonoma以降に変更 「編集」>「選択」メニューに「上/下の列を選択」コマンドを追加 AppleScriptによるスクリプティングで扱う文字範囲の単位をUTF-16ベースからUnicode書記素ベースに変更（これはMac OS X 10.5で導入されたAppleScript 2.0の仕様変更に追従するものです） クイックアクションバーのVoiceOverサポートを改良 バンドルされているすべてのテーマを更新し、ハイライト色を追加、また現在行のハイライトの不透明度を70%に変更 ステータスバーと書類インスペクタでのエディタのカウントのパフォーマンスを改善し更新時のチラつきを抑止 エディタのフォントが「フォント」パネルから変更されたときに、フォントが等幅ならばカーニングをゼロに cotコマンドを更新し、開くファイルが指定されていた場合はパイプされたテキストを無視するように変更 「選択範囲を含む新規書類をCotEditorで開く」サービスを「選択部分を含む新しいCotEditorウインドウを開く」に改名 書類が開いていないときも「カラーコード」ウインドウを開けるように変更 空のアウトライン項目を無視 テーマの値が欠損していたときにテーマ読み込みエラーになるのを抑止 より多くの表のカラムをソート可能に Swiftシンタックスを更新 C++シンタックスを更新（Léo Natanさんに感謝!） ユーザガイドを更新 Solarizedテーマをバンドルから削除 trivial: 「編集」メニューの構成を整理 trivial: 即時のアウトライン抽出でナビゲーションバーに一瞬だけ「抽出中」メッセージが出るのを抑止 trivial: 「CotEditorについて」ウインドウのコード貢献者の名前を選択可能に trivial: 新規設定作成ですでに同名の設定があったときの数字付加規則を改良 開発: ビルド環境をXcode 16（Swift 6, macOS 15 SDK）に更新 開発: すべてのユニットテストをSwift Testingに移行 開発: ナビゲーションバーと「スニペット」設定ペインをSwiftUIに移行 開発: Yamsを5.1.2から5.1.3に更新 修正 矩形選択が最後から2行目までで選択を止められない不具合を修正 不具合の報告テンプレートで英語のラベルが不要に訳されていた不具合を修正 以前のリリースノート"
