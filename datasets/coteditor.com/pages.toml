title = "Archives - CotEditor"
description = "Archives for the earlier CotEditor and other additional files"
full_description = "Archives CotEditor non-AppStore version CotEditor is distributed on the Mac App Store. However, there is also a non-AppStore version just for in case. CotEditor 5.0.8 released on 2025-01-19 release notes en ja requirements macOS 14 or later What is the difference between the Mac App Store version and non-AppStore version? There is no difference on the software itself except the updater. The non-AppStore version has an updater framework (Sparkle) to notify new releases and update to them while the macOS system manages versions of the Mac App Store version. Other things are exactly the same. Both versions are Sandboxed. In addition, non-AppStore versions are notarized by Apple. CotEditor for earlier macOS The followings are the latest releases for the macOS which are no more supported on the current CotEditor. The project team doesn't provide any support for the earlier versions. download supported systems release date CotEditor 4.8.7 macOS 13 Ventura 2024-09-17 CotEditor 4.5.9 macOS 12 Monterey 2023-09-11 CotEditor 4.3.6 macOS 11 Big Sur 2022-10-01 CotEditor 4.0.9 macOS 10.15 Catalina 2021-11-28 CotEditor 3.9.7 macOS 10.13 High Sierra - macOS 10.14 Mojave 2020-10-19 CotEditor 3.7.8 OS X 10.12.2 Sierra 2019-06-30 CotEditor 3.5.4 OS X 10.11 El Capitan - OS X 10.12.1 Sierra 2018-09-18 CotEditor 3.2.8 OS X 10.10 Yosemite 2018-01-22 CotEditor 2.5.7 OS X 10.8 Mountain Lion - OS X 10.9 Mavericks 2016-08-22 CotEditor 1.5.4 OS X 10.7 Lion 2014-06-29 CotEditor 1.3.1 Mac OS X 10.4 Tiger - Mac OS X 10.6 Snow Leopard 2012-02-12 CotEditor 1.0.1 Mac OS X 10.3 Panther 2009-05-01 Complete list for released CotEditor. Sample Scripts A set of sample scripts to demonstrate how CotEditor scripts work. Sample Scripts SampleScripts.zip -> Repository on GitHub. CotEditor Scripts See CotEditor Scripts page on the wiki. Additional Syntax Styles See Additional Syntax Styles page on the wiki. Additional Themes See Additional Themes page on the wiki."
