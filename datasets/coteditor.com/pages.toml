["https://coteditor.com/releasenotes/5.0.1.en"]
title = "What's new on CotEditor 5.0.1 - CotEditor"
description = "What's new on CotEditor 5.0.1"
full_description = "CotEditor 5.0.1 release: 2024-09-22 Improvements Add the “Open as Plain Text” button to the preview view for the file browser. Open a file selected in the file browser as plain text when the default app set in the Finder for it is CotEditor. Optimize the performance of the folder browser. Fixes Fix an issue on macOS 14 that the app crashed when opening a folder containing archive files. Fix an issue that the Donation settings pane displayed an unnecessary alert when the user cancels an action. Fix an issue that the indent style detection was not applied. Fix the display of the What’s New window in CJK localizations. AppStore ver.: Fix an issue that the file/folder in the file browser was not removed even when it was deleted in the actual file storage. CotEditor 5.0.0 release: 2024-09-16 New Features Folder Navigation: Open folders in CotEditor and browse their contents from the new sidebar to switch documents. Support macOS 15 Sequoia. Support Writing Tools with Apple Intelligence. AppStore ver.: Now, the user can donate to the CotEditor project via in-app purchase in the new Donate settings pane. Add new “Select Enclosing Symbols” and “Split Selection by Lines” commands to the Edit > Select menu. Add new “Show in Finder” command to the File menu. Add new “Create Document in CotEditor” shortcut action. Add the “Highlight” color to the CotEditor theme format. Support the alpha channel for the current line in theme settings. Add Korean localization (Thanks to Minseok Choe!). Add Assembly syntax. Add new “Resinifictrix (Dark)” theme. Improvements Change the system requirement to macOS 14 Sonoma and later. Add “Select Column Up/Down“ commands to the Edit > Select menu. Change the unit of character ranges handled in CotEditor Scripting for AppleScript from UTF-16 based to the Unicode grapheme cluster-based (This is to follow the specification change in AppleScript 2.0 introduced in Mac OS X 10.5). Improve VoiceOver support in the Quick Action bar. Update all the bundled themes to have the custom highlight color and a 70% opacity in the current line highlight. Improve the performance of counting values in the editor for the status bar and the document inspector to avoid flicking of the display. Set the editor's kerning to zero when a monospaced font is set via the Font panel. Update the cot command to ignore piped text if a file to open is specified. Rename the “New CotEditor Document with Selection” service with “New CotEditor Window Containing Selection.” Enable opening the Color Code window even without any documents. Ignore empty outline items. Avoid the theme loading error when a value is missing. Make more table columns sortable. Update the Swift syntax. Update C++ syntax (Thanks to Léo Natan!). Improve the User Guide contents. Remove Solarized themes from the bundle. trivial: Organize the structure of the Edit menu. trivial: Suppress display of the “Extracting” message on the navigation bar in instantaneous parsing. trivial: Make names of code contributors in the About window selectable. trivial: Better numbering when adding a new setting whose name is the same as an existing one. dev: Update the build environment to Xcode 16 (Swift 6, macOS 15 SDK). dev: Migrate all unit tests to Swift Testing. dev: Migrate the navigation bar and the Snippets settings view to SwiftUI. dev: Update Yams from 5.1.2 to 5.1.3. Fixes Fix an issue that the rectangular selection cannot stop the selection just until the second line from the end. Fix an issue that the English labels in the issue report template were unnecessarily localized. previous release notes"
