description = "CotEditor 5.0.6の変更点"
full_description = "CotEditor 5.0.6 リリース: 2024-12-09 新機能 ファイルブラウザで選択した画像ファイルの情報をプレビュービューに表示 「モード」設定に「スペースバーを2回押してピリオドを入力」オプションを追加（デフォルトは非選択） ツールバーのカスタマイズオプションに作文ツールのツールバー項目を追加（macOS 15.2以降でかつ作文ツール機能が利用可能な場合のみ） 改良 矩形選択時に同じ折り返し行目にだけ挿入ポイントを追加 上または下の列を選択したときに同じ折り返し行目にだけ選択範囲を追加 ファイルブラウザでファイル名を変更したときに書類のシンタックスをファイル名に合わせて更新 シンタックスで定義されている拡張子やファイル名は常にプレーンテキストで開くように変更 「次/前のエディタを操作対象にする」コマンドを改良し、フォーカスがエディタにないときはエディタにフォーカスを移動するように変更 エディタ分割に関連するコマンドのデフォルトキーボードショートカットを変更 ファイルブラウザで選択したファイルがエイリアスファイルのときは「外部エディタで開く」ボタンを「Finderに表示」ボタンに変更 シンボリックリンクをフォルダブラウザで選択したときに非対応のアラートの代わりにアイコンプレビューを表示 クイックアクションバーのドラッグで掴める範囲を拡張 JavaScriptシンタックスを更新し.mjs拡張子を定義に追加 trivial: macOSシステムのsudden termination機能を有効化 trivial: 「CotEditorについて」ウインドウの閉じるボタンを標準サイズに変更 trivial: ユーザガイドを更新 開発: ビルド環境をXcode 16.2（macOS 15.2 SDK）に更新 修正 書類が開いていない状態でアプリがバックグラウンドに行っても自動でアプリが終了しなくなっていた不具合を修正 ファイルブラウザでファイル名を変更するときにファイル名に改行が含まれるとアプリが反応しなくなった不具合を修正 フォルダに壊れたリンクが含まれているとそのフォルダの中身が空になったファイルブラウザの不具合を修正 行番号をプリントする設定のときにプリントプレビューで一部の範囲が表示されなかった不具合を修正 ファイルブラウザから書類を縦書きで開くとウインドウの高さが予期せず縮んだ不具合を修正 --waitオプションを付けたときに対象の書類を閉じる代わりにアプリを終了するとアプリが再起動されたcotコマンドの不具合を修正 コマンド実行時にアプリが起動していないと、--waitオプションを付けてもウインドウが閉じるのを待たなかったcotコマンドの不具合を修正 いくつかの入力ダイアログで変換を確定していない入力が無視された不具合を修正 trivial: 「寄付」設定ペインのヘルプボタンを修正 以前のリリースノート"
