description = "Text Editor for macOS"
full_description = "CotEditor The Plain-Text Editor for macOS It's free! light-weight, neat, yet powerful Why you should choose CotEditor? Just for macOS CotEditor is exactly made for macOS. It looks and behaves just as macOS applications should. Rapid Launch CotEditor launches so quick that you can write your text immediately when you want to. Open Source CotEditor is developed as an open-source project that allows anyone to contribute. features Syntax Highlighting Colorize more than 50 pre-installed major languages like HTML, PHP, Python, Ruby or Markdown. You can also create your own settings. Powerful Find & Replace Super powerful find and replace using the ICU regular expression engine. Setting via Click There are no complex configuration files that require geek knowledge. You can access all your settings including syntax definitions and themes from a standard settings window. Auto Backup You don't need to lose your unsaved data anymore. CotEditor backups your documents automatically while editing. Outline Menu Extract specified lines with the predefined syntax, and you can jump to the corresponding line. Split Editor Split a window into multiple panes to see different parts of your document at the same time. Character Inspector Inspect Unicode character data of each selected character in your document and display them in a popover. Scriptable Make your own macro in your favorite language, whether it is Python, Ruby, Perl, PHP, UNIX shell, AppleScript or JavaScript. Incompatible Characters Check and list-up the characters in your document that cannot convert into the desired encoding. CJK Language Friendly Estimate various file encodings accurately, toggle to vertical text mode and keep its line height correctly. We welcome your feedback ♡ Please don't hesitate to report any bugs or feature requests to our issue tracker. Project Page on GitHub"
