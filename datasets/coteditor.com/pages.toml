description = "CotEditor 4.6.1の変更点"
full_description = 'CotEditor 4.6.1 リリース: 2023-09-28 修正 「すべて検索」の結果が更新されなかった不具合を修正 「一般」設定の「何も開かれていなければ」オプションの変更が反映されていなかった不具合を修正 ドイツ語のタイポを修正 非AppStore版: 「一般」設定のレイアウトを修正 CotEditor 4.6.0 リリース: 2023-09-25 新機能 macOS 14 Sonomaに対応 シンタックス定義に「種類」という項目を追加し、各シンタックスが一般用途かコード用途を選べるように エディタのフォントをシンタックスの種類に応じて切り替える機能を追加 「外観」設定ペインに等幅フォントの設定欄を追加 ツールバーの「フォント」項目に表示フォントをプロポーショナルか等幅かを切り替えられる機能を追加 検索結果ビューで行を選択してコピーすることで一致した行をコピー可能に 改行コードの混在警告ダイアログを全面的に抑止するオプションを追加（利用は非推奨） スペイン語のローカリゼーションを追加（Agustin Borregoさんに感謝!） 改良 システム要件をmacOS 13 Ventura以降に変更 インスペクタの振る舞いと見た目をアップデート テーマのカーソルカラーに「システムカラーを使用」オプションを追加 文字インスペクタの各情報の頭に項目ラベルを追加し、文字のUnicodeバージョンも表示するよう改良 ユーザが明示的に書類を保存したときに、末尾空白の自動削除機能が必ず実行されるように変更 共有インターフェイスを最新のものに移行 設定ウインドウを整理 設定ウインドウの「プリント」設定を削除（代わりに、プリントダイアログで直接設定してください） 「プリント」ダイアログにフォントサイズ欄を追加 起動したとき何も開かれていない場合になにもしないオプションを廃止 カーソルのスタイルを選べる機能を廃止 ¥と\のキーを入れ替えるオプションを廃止 常に行頭からコメントアウトするオプションを廃止（この振る舞いは常に有効になりました） 「カラーコード」ツールバーボタンを廃止 文字インスペクタに表示されるUnicodeブロック名のリストをUnicode 15.1.0に更新 Swiftシンタックススタイルを更新してSwift 5.9のキーワードを追加 trivial: macOS 14（以降）で不透明度ツールバー項目の表示方法を変更 trivial: 検索ウインドウのズームボタンを無効に trivial: ショートカット入力フィールドで無効なコンテキストメニューが出ないように抑制 trivial: エディタを分割できる回数を制限 trivial: シンタックス定義を複製したときにシンタックスエディタを開くのではなく直ちに複製したシンタックスを作成するように変更 trivial: 「シンタックススタイル」を「シンタックス」に名称変更 非AppStore版: Sparkleを2.4.2から2.5.0に更新 開発: ビルド環境をXcode 15 (Swift 5.9)に更新 修正 開いている設定ウインドウが「ウインドウ」メニューに含まれていなかった不具合を修正 その他 ツールバーカスタマイズはCotEditor 4.6.1の初回起動時にリセットされます 以前のリリースノート'
