full_description = "CotEditor 4.8.0 release: 2024-04-15 New Features Add the Mode feature that enables altering the editor’s behavior depending on the document’s syntax (Go Settings > Mode settings pane to set). Add the Restore Defaults button to the File Drop settings. Add Dutch localization (thanks to Yasin Gunaydin!). Improvements Improve the look and feel of the syntax editor. Renew the “About CotEditor” window. Change the line count behavior to ignore the new line character at the end of the last line. Improve selected line number emphasis in the line number view by the vertical text orientation. Change the filter field for the outline inspector to apply the selection of the filter history immediately. Make the encoding priority view undoable. Disable the pane transition animation in the Settings window when the user sets to reduce motion in the system Accessibility settings. Deprecate “Append a space to comment delimiter” option. Remove wrapped line marks in the line number view. Update the Makefile syntax to add “GNUmakefile” to the filename mapping. non-AppStore ver.: Update Sparkle from 2.5.2 to 2.6.0. trivial: Enable delete selected separators in the encoding priority view with the Delete key. trivial: Avoid users using reserved syntax names. trivial: Remove the dialog urging to restart the application by changing the “Reopen windows from last session” option in the General settings pane. dev: Migrate the settings window, syntax editor, and status bar to SwiftUI. dev: Migrate all localizable strings to String Catalog. dev: Update the build environment to Xcode 15.3 (Swift 5.10). dev: Update Yams from 5.0.6 to 5.1.2. Fixes Fix an issue that the application crashed when trying to share a custom syntax. Fix an issue on the filter field for the outline inspector that the filter history was initially empty. Fix an issue on macOS 14 that multiple cursors in editors remained when they are inactive. Fix missing localizations. previous release notes"
