["https://coteditor.com/releasenotes/5.0.6.en"]
title = "What's new on CotEditor 5.0.6 - CotEditor"
description = "What's new on CotEditor 5.0.6"
full_description = "CotEditor 5.0.6 release: 2024-12-09 New Features Display information about the selected image in the preview view for the file browser. Add the “Add period with double-space” option to the Mode setting options (deselected by default). Add the toolbar item for Writing Tools to the toolbar customization options (only for macOS 15.2 and later and when the Writing Tools feature is available). Improvements Allow insertion points only at the same number of wrapped lines by rectangular selection. Allow selections only at the same number of wrapped lines by selecting the column up/down. Update the document’s syntax based on the filename when renaming it in the file browser. Always open a file as a plain-text document if its file extension or filename is determined by syntaxes. Enhance the “Move Focus to Next/Previous Editor” commands to move the focus to the main editor if it’s outside the editors. Update the default keyboard shortcuts for split editor-related commands. Replace the “Open with External Editor” button with the “Show in Finder” button when the file selected in the file browser is alias. Display the icon preview for a symbolic link selected in the file browser instead of showing a dialog. Expand the draggable area in the Quick Action bar. Update the JavaScript syntax to include the .mjs file extension. trivial: Enable the sudden termination feature provided by the macOS system. trivial: Make the close window in the About window the standard size. trivial: Update the User Guide. dev: Update the build environment to Xcode 16.2 (macOS 15.2 SDK). Fixes Fix an issue that the application no longer automatically terminated when the app went to the background without open documents. Fix an issue that the application became unresponsive when renaming a filename in the file browser that contained newline characters. Fix an issue that the file browser showed nothing for folders containing broken links. Fix an issue that the printing area in the print preview was trimmed when line numbers were drawn. Fix an issue that the window height unexpectedly shrunk when opening a document with the vertical layout orientation from the file browser. Fix an issue in the cot command that the --wait option relaunched CotEditor when the app was quit instead of closing the document. Fix an issue in the cot command that the --wait option did not wait for the window to close if the application was not yet launched when running th e command. Fix an issue that undetermined text conversions were ignored when submitting in some dialogs. trivial: Fix the Help button in the Donation settings pane. previous release notes"
