full_description = "CotEditor 4.8.0 リリース: 2024-04-15 新機能 書類のシンタックスに応じてエディタの振る舞いを変更できるモード機能を追加（設定 > 「モード」設定ペインで設定） ファイルドロップ設定に「デフォルトに戻す」ボタンを追加 オランダ語ローカリゼーションを追加（Yasin Gunaydinさんに感謝!） 改良 シンタックスエディタの見た目を刷新 「CotEditorについて」ウインドウを刷新 行カウントで最後の改行コードをカウントしないように変更 縦書きのときの行番号ビューの選択行強調を改良 アウトラインインスペクタのフィルタ履歴の選択をすぐフィルタに反映するように変更 エンコーディング優先度編集でアンドゥ/リドゥを可能に ユーザがシステムのアクセシビリティ設定で視差効果を減らしている場合は、設定ウインドウのペイン切り替えアニメーションを無効に 「コメント記号にスペースを追加」オプションを廃止 行番号ビューの行折り返しマークを削除 Makefileシンタックスを更新し「GNUmakefile」をファイル名マッピングに追加 非AppStore版: Sparkleを2.5.2から2.6.0に更新 trivial: Deleteキーで選択した区切り線を削除できるようにエンコーディング優先度編集を改良 trivial: 予約されたシンタックス名をユーザが使用することを防止 trivial: 一般設定の「最後のセッションのウインドウを開く」オプションを変更したときに表示されていたアプリケーションの再起動を促すダイアログを削除 開発: 設定ウインドウとシンタックスエディタ、ステータスバーを全面的にSwiftUIに移行 開発: すべてのローカリゼーション文字列管理をString Catalogに移行 開発: ビルド環境をXcode 15.3（Swift 5.10）に更新 開発: Yamsを5.0.6から5.1.2に更新 修正 カスタムシンタックスを共有しようとするとアプリケーションがクラッシュする不具合を修正 初期表示時の履歴メニューが空だったアウトラインインスペクタのフィルタ欄の不具合を修正 マルチカーソルのカーソル描画がエディタがアクティブでないときも残ることがあるmacOS 14の不具合を修正 ローカライズされていなかったテキストを修正 以前のリリースノート"
