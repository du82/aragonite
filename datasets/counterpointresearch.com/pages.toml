description = "Overview: The global smartwatch market experienced a 9% year-over-year decline, primarily due to reduced shipments from major brands such as Apple and leading Indian brands. Conversely, Chinese brands like Huawei, Xiaomi, and BBK (Imoo) saw growth. Shipments in the China region increased by 29% year-over-year, while the India and North America (NAM) regions experienced 46% and 16% decline, respectively. Basic smartwatches saw a 26% year-over-year decline, largely driven by a slowdown in the Indian market.Published Date: February 2025"
