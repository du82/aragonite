["https://counterpointresearch.com/insight/post-insight-research-notes-blogs-china-smartphone-sales-fall-32-yoy-in-q4-only-quarter-with-yoy-decline-in-2024"]
title = "China Smartphone Sales Fall 3.2% YoY in Q4, Only Quarter With YoY Decline in 2024"
description = "During the quarter, Huawei secured the top spot, followed by Xiaomi. Huawei’s sales grew 15.5% YoY, supported by the release of the Mate 70 series in early December.Xiaomi maintained strong momentum in the high-end and flagship segments. In Q4, its market share rose to 17.2%For the full year, China’s smartphone sales increased by 1.5% YoY. vivo retained the top spot with a market share of 17.8%.Beijing, Boston, Buenos Aires, Hong Kong, London, New Delhi, San Diego, Seoul, Taipei, Tokyo – January 21, 2025China’s smartphone sales declined 3.2% YoY in Q4 2024, marking the only quarter in 2024 to see a YoY decline, according to Counterpoint’s Market Pulse Service. During the quarter, Huawei took the top spot, followed by Xiaomi and Apple.Commenting on the market dynamics, Associate Director Ethan Qi said, “The country’s smartphone market saw a rebound in the first three quarters of the year, with positive YoY growth each quarter. However, momentum began to slow in Q4 as consumers adopted cautious spending behavior.”Source: Counterpoint Market Pulse ServiceNotes: OPPO includes OnePlus; Xiaomi includes Redmi; vivo includes iQOO; Figures may not add up to 100% due to rounding; Numbers are preliminary and may change during finalization.Commenting on OEM performance, Senior Research Analyst Mengmeng Zhang said, “In Q4 2024, Huawei climbed to the top spot with an 18.1% share. This is the first time since the US ban that Huawei regained the leading position. Huawei’s sales increased 15.5% YoY driven by the launch of the mid-end Nova 13 series and high-end Mate 70 series.”Xiaomi secured the second spot in Q4 2024 with a 17.2% market share, driven by strong growth from Q3 into Q4. This growth was fueled by the popularity of its flagship Mi 15 series, launched in October. Xiaomi has made significant progress in premiumization this year. Besides, the success of Xiaomi’s electric vehicle (EV) venture has further enhanced its brand image and contributed to a boost in its smartphone sales.Amid intensifying market competition from Huawei and other Chinese OEMs expanding into the premium market, Apple ranked third during the quarter, capturing a 17.1% market share.From an annual perspective, China’s smartphone sales increased 1.5% YoY, compared to a 1.4% YoY decline in 2023. vivo ranked first with a market share of 17.8%, followed by Huawei (16.3%) and Xiaomi (15.7%).Source: Counterpoint Market Pulse ServiceNotes: OPPO includes OnePlus; Xiaomi includes Redmi; vivo includes iQOO; Figures may not add up to 100% due to rounding; Numbers are preliminary and may change during finalization.Looking ahead to 2025, Counterpoint Research expects China’s smartphone market to continue its low-single-digit growth. The nationwide smartphone subsidy program announced in January could serve as a catalyst for boosting sales, especially during Q1 2025. However, given the challenging economic environment in China, we maintain a cautiously optimistic outlook for China’s smartphone market in 2025. BackgroundCounterpoint Technology Market Research is a global research firm specializing in products in the TMT (technology, media, and telecom) industry. It services major technology and financial firms with a mix of monthly reports, customized projects, and detailed analyses of the mobile and technology markets. Its key analysts are seasoned experts in the high-tech industry."
full_description = "During the quarter, Huawei secured the top spot, followed by Xiaomi. Huawei’s sales grew 15.5% YoY, supported by the release of the Mate 70 series in early December. Xiaomi maintained strong momentum in the high-end and flagship segments. In Q4, its market share rose to 17.2% For the full year, China’s smartphone sales increased by 1.5% YoY. vivo retained the top spot with a market share of 17.8%. Beijing, Boston, Buenos Aires, Hong Kong, London, New Delhi, San Diego, Seoul, Taipei, Tokyo – January 21, 2025 China’s smartphone sales declined 3.2% YoY in Q4 2024, marking the only quarter in 2024 to see a YoY decline, according to Counterpoint’s Market Pulse Service. During the quarter, Huawei took the top spot, followed by Xiaomi and Apple.Commenting on the market dynamics, Associate Director Ethan Qi said, “The country’s smartphone market saw a rebound in the first three quarters of the year, with positive YoY growth each quarter. However, momentum began to slow in Q4 as consumers adopted cautious spending behavior.” Notes: OPPO includes OnePlus; Xiaomi includes Redmi; vivo includes iQOO; Figures may not add up to 100% due to rounding; Numbers are preliminary and may change during finalization. Commenting on OEM performance, Senior Research Analyst Mengmeng Zhang said, “In Q4 2024, Huawei climbed to the top spot with an 18.1% share. This is the first time since the US ban that Huawei regained the leading position. Huawei’s sales increased 15.5% YoY driven by the launch of the mid-end Nova 13 series and high-end Mate 70 series.” Xiaomi secured the second spot in Q4 2024 with a 17.2% market share, driven by strong growth from Q3 into Q4. This growth was fueled by the popularity of its flagship Mi 15 series, launched in October. Xiaomi has made significant progress in premiumization this year. Besides, the success of Xiaomi’s electric vehicle (EV) venture has further enhanced its brand image and contributed to a boost in its smartphone sales. Amid intensifying market competition from Huawei and other Chinese OEMs expanding into the premium market, Apple ranked third during the quarter, capturing a 17.1% market share."
