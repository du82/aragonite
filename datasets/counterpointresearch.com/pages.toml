description = "Overview:As the global automotive sector transitions towards electric vehicles, it is very important to have an idea of how electric vehicles will reshare the automotive sector. This report gives an idea of how alternative fuel powertrains like Battery EV (BEV), Plug-in EV (PHEV), Hybrid EV (HEV), Mild-hybrid EV (MHEV), Fuel-cell EV (FCEV) shape up in future compared to Internal Combustion Engine vehicles (ICE). The report explores the share of different powertrain across 12 regions such as China, USA, Europe, Japan, Korea, NAM-Others, SEA, Latin America, Middle East & Africa, India, Oceania and Rest of the world. The report also showcases the share of different powertrains across the 35 automotive groups like Toyota, BYD Auto, BMW, Mercedes-Benz, Hyundai-Kia, Honda, SAIC, Tesla, NIO, XPeng, Xiaomi, etc. from 2022 to 2035.Table of Contents:Pivot TableFlatfileAssumptionsDefinitionsPublished Date: January 2025"
