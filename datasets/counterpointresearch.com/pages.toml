["https://counterpointresearch.com/insight/post-insight-research-notes-blogs-smartphone-market-recovers-in-2024-after-two-years-of-decline"]
title = "Smartphone Market Recovers In 2024 After Two Years Of Decline"
description = "Global smartphone sell-through grew 4% YoY in 2024, following the weakest year in a decade in 2023.The top two brands, Samsung and Apple, were largely flat YoY in 2024. Xiaomi grew fastest among the top five and ranked #3. OPPO lost volume but held on to #4 ahead of fast-growing vivo that did well in selected markets.The global market’s recovery was further augmented by the aggressive global expansion of challenger brands like HONOR, Motorola and those of the Transsion Group. Huawei also made a resurgence in China. Seoul, Beijing, Buenos Aires, Hong Kong, London, New Delhi, San Diego, Taipei, Tokyo – January 13, 2025The global smartphone market returned to growth in 2024 after two consecutive years of annual declines, according to preliminary results from Counterpoint Research’s Market Pulse. Global smartphone sales grew 4% YoY in 2024, as consumer sentiment fared better than in previous years following macroeconomic improvements. Smartphone sales in 2023 were the lowest in a decade.Commenting on market dynamics, Research Director Tarun Pathak said, “2024 was a year of recovery and normalization after a difficult 2023. Smartphones continue to be an essential product, pivotal to people’s daily lives, and as macroeconomic pressures softened, the market started showing signs of recovery from Q4 2023 and has now grown for five consecutive quarters. Almost all markets showed growth, led by Europe, China and Latin America.”Samsung continued to lead the market in 2024, led by strong demand for its S24 series and A-series product lines. The S24 series, the first phone positioned as an AI device, outperformed its predecessors and was received especially well in Western Europe and the USA. Apple, with an 18% share took the #2 spot. Apple’s iPhone 16 series was met with a mixed response, partly due to a lack of availability of Apple Intelligence at launch. However, Apple continued to grow strongly in its non-core markets like Latin America, Africa and Asia-Pacific-Others.Xiaomi grew fastest among the top five brands in 2024, helped by its portfolio realignment, premium push and aggressive expansion activities. OPPO came in fourth, with a YoY decline, but it ended the year with stronger momentum. vivo rounded off the top five, led by strong performance in India and China, where it ended the year as the top-ranked OEM. The top 5 remained the same as in 2023 but lost some share to aggressive competition from Huawei, HONOR and Motorola, the fastest-growing OEMs among all the top 10 brands.2024 also brought GenAI to smartphones, a potentially revolutionary technology. While GenAI-capable smartphones remain limited to the premium segment for now, we expect GenAI to become a norm for mid-range devices as well. By 2028, we expect nine out of ten smartphones priced above $250 to be GenAI-capable.While smartphone volumes are unlikely to reach the peak levels seen in pre-COVID times, premiumization means that revenues will continue to rise as average selling prices grow. Sales of ultra-premium smartphones, those priced above $1000, grew fastest in 2024 as consumers showed a preference for spending more on their next smartphone. This was enabled by device subsidies in developed markets and the easy availability of low-cost finance in emerging markets. In 2025, we expect revenue growth to continue to outpace volume growth, with revenues growing 8% YoY, compared to 4% volume growth.BackgroundCounterpoint Technology Market Research is a global research firm specializing in products in the TMT (technology, media, and telecom) industry. It services major technology and financial firms with a mix of monthly reports, customized projects, and detailed analyses of the mobile and technology markets. Its key analysts are seasoned experts in the high-tech industry.Follow Counterpoint Researchpress(at)counterpointresearch.com"
full_description = "Seoul, Beijing, Buenos Aires, Hong Kong, London, New Delhi, San Diego, Taipei, Tokyo – January 13, 2025 The global smartphone market returned to growth in 2024 after two consecutive years of annual declines, according to preliminary results from Counterpoint Research’s Market Pulse. Global smartphone sales grew 4% YoY in 2024, as consumer sentiment fared better than in previous years following macroeconomic improvements. Smartphone sales in 2023 were the lowest in a decade. Commenting on market dynamics, Research Director Tarun Pathak said, “2024 was a year of recovery and normalization after a difficult 2023. Smartphones continue to be an essential product, pivotal to people’s daily lives, and as macroeconomic pressures softened, the market started showing signs of recovery from Q4 2023 and has now grown for five consecutive quarters. Almost all markets showed growth, led by Europe, China and Latin America.” Samsung continued to lead the market in 2024, led by strong demand for its S24 series and A-series product lines. The S24 series, the first phone positioned as an AI device, outperformed its predecessors and was received especially well in Western Europe and the USA. Apple, with an 18% share took the #2 spot. Apple’s iPhone 16 series was met with a mixed response, partly due to a lack of availability of Apple Intelligence at launch. However, Apple continued to grow strongly in its non-core markets like Latin America, Africa and Asia-Pacific-Others. Xiaomi grew fastest among the top five brands in 2024, helped by its portfolio realignment, premium push and aggressive expansion activities. OPPO came in fourth, with a YoY decline, but it ended the year with stronger momentum. vivo rounded off the top five, led by strong performance in India and China, where it ended the year as the top-ranked OEM. The top 5 remained the same as in 2023 but lost some share to aggressive competition from Huawei, HONOR and Motorola, the fastest-growing OEMs among all the top 10 brands."
