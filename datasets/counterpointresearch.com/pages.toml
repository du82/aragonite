["https://counterpointresearch.com/report/counterpoint-research-ces-2025-roundup"]
title = "Counterpoint Research CES 2025 Round-Up"
description = "Overview: This year we had a contingent of 10 analysts attending CES to track the latest across PCs, TVs, the broader consumer electronics sector as well as automotive. We have condensed a week’s worth of executive meetings, key announcements and things that caught our eye from the show floor into a 50-page report.The report is for clients, but if you share your details via the ‘Contact Us’ form on this page, we can send you a copy with our compliments.Table of Contents:AutomotiveSemiconductorsTVsDisplaysFrom The Show FloorNumber of pages: 48Published Date: Januray 2025"
full_description = "Overview: This year we had a contingent of 10 analysts attending CES to track the latest across PCs, TVs, the broader consumer electronics sector as well as automotive. We have condensed a week’s worth of executive meetings, key announcements and things that caught our eye from the show floor into a 50-page report. The report is for clients, but if you share your details via the ‘Contact Us’ form on this page, we can send you a copy with our compliments. David joined DSCC in May 2021 as Senior Director. David has more than 20 years’ experience in the consumer and commercial electronics industry. David’s professional background includes a wide range of responsibilities in product development, product planning, product management, product marketing, data analytics, and executive /operational management. Prior experience includes working in the consumer and commercial electronics industry as Director of Business Line Management at ViewSonic, Director of Product Planning at Samsung Electronics, Director of Connected Products at Kenmore, Director of Product Management at Mitsubishi Digital Electronics and Group Manager at Panasonic. David has a Bachelor of Electrical Engineering and an MBA in Finance and Marketing. Robert J (Bob) O’Brien joined Counterpoint Research as part of its acquisition of DSCC, where he was Co-Founder, Principal and CFO of DSCC. Bob has decades of experience turning market and business analysis into strategic insights in the display and electronics industries. At DSCC, Bob takes the lead role in analysis of display materials, including glass and AMOLED materials, and covers developments in TV and other large-screen display applications. He is the principal author of DSCC’s AMOLED Material Report, the Advanced TV Shipment Report, and the Display Glass Report, and Bob contributes regularly to the DSCC Weekly Review. Murtuza is a Senior Analyst at Counterpoint Research based out of the UK. In Counterpoint, he closely tracks the Automotive Industry and Markets with a focus on pivotal technologies such as Electric Vehicles, Autonomous Vehicles, Software Defined Vehicle, Infotainment & Digital Cockpit, Mobility and Connectivity. He started his career at Tata Motors developing Electric Vehicles graduating into Strategy roles. His most recent experience prior to joining Counterpoint Research has been as a Consulting Manager at the Transport & Mobility consultants Ricardo UK. He holds an Executive MBA from Warwick University, MSc in Automotive Systems Engineering from Loughborough University and a BEng. in Automobile Engineering from Mumbai University."
