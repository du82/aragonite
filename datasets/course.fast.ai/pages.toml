title = "Practical Deep Learning for Coders - Bonus: Data ethics"
description = "Learn Deep Learning with fastai and PyTorch, 2022"
full_description = "Part 1Bonus: Data ethics Bonus: Data ethics Because deep learning is such a powerful tool and can be used for so many things, it becomes particularly important that we consider the consequences of our choices. The philosophical study of ethics is the study of right and wrong, including how we can define those terms, recognize right and wrong actions, and understand the connection between actions and consequences. The field of data ethics has been around for a long time, and there are many academics focused on this field. It is being used to help define policy in many jurisdictions; it is being used in companies big and small to consider how best to ensure good societal outcomes from product development; and it is being used by researchers who want to make sure that the work they are doing is used for good, and not for bad. Video This lesson, taught by Dr Rachel Thomas, the founding director of the Center for Applied Data Ethics at the University of San Francisco, was recorded in 2020 during the previous iteration of this course. It discusses some useful ways of thinking about data ethics, particularly through the lens of a number of case studies. It is based partly on chapter 3 of the book. Useful links Datasheets for datasets Weapons of math destruction AI Generated Faces Papers/repos/tools on how to check for bias Markkula Center - Ethical Toolkit The Pollyannish Assumption Understanding the context and consequences of pre-trial detention Fast.ai community ethics resources & discussion Montreal AI Ethics Institute Weekly Newsletter"
