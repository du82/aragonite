title = "Practical Deep Learning for Coders - 11: Matrix multiplication"
description = "Learn Deep Learning with fastai and PyTorch, 2022"
full_description = "Part 211: Matrix multiplication 11: Matrix multiplication In this lesson, we discuss various techniques and experiments shared by students on the forum, such as interpolating between prompts for visually appealing transitions and improving the update process in text-to-image generation, and a novel approach to decreasing the guidance scale during image generation. We then dive into a new paper called DiffEdit, which focuses on semantic image editing using text-conditioned diffusion models. We walk through the process of reading and understanding the paper, emphasizing the importance of grasping the main idea and not getting bogged down in every detail. We then embark on a deep exploration of matrix multiplication using Python, compare APL with PyTorch, and introduce the concept of Frobenius norm. We also discuss the powerful concept of broadcasting, which allows for operations between tensors of different shapes, and demonstrate its efficiency in speeding up matrix multiplication. The techniques introduced in this lesson allow us to speed up our initial Python implementation by a factor of around five million, including leveraging the GPU for massive parallelism! Concepts discussed Diffusion improvements Interpolating between prompts for visually appealing transitions Improving the update process in text-to-image generation Decreasing the guidance scale during image generation Understanding research papers Matrix multiplication using Python and Numba Comparing APL with PyTorch Frobenius norm Broadcasting in deep learning and machine learning code Video Lesson resources Discuss this lesson DiffEdit: Diffusion-based semantic image editing with mask guidance Math notation Greek letters All in one mathematics cheat sheet (PDF) Glossary of mathematical symbols (wikipedia) pix2tex (open source) or Mathpix (commercial) Greek Letters for Deep Learning - Anki deck containing fastai-related Greek letters Detexify Draw math symbols"
