description = "You can find information about us and how we collect, use and store your personal data in each section of this privacy notice. Learn online and earn valuable credentials from top universities like Yale, Michigan, Stanford, and leading companies ..."
full_description = 'Privacy NoticeU.S. State Privacy Laws NoticeData Protection AddendumCookies PolicyTerms of UsePrivacy NoticeEffective: January 1, 2025.Key InformationCoursera, Inc. is the data controller of the Personal Data we collect about you (i.e., the entity that determines the means and purposes of collecting, using, and disclosing the Personal Data (as defined below)), unless you are part of a degree, certain other certificate programs where you are required to enroll with the academic institution, or certain other circumstances as communicated to you, in which case Coursera is the data processor.We collect the Personal Data set out in the "What Personal Data We Collect" section of this Privacy Notice below, including account registration details such as name and email, details of Content Offerings you undertake, survey information (where you provide it), identity verification data, and information about your use of our site and Services.We use your Personal Data for the purposes set out in the "How We Use Personal Data" section of this Privacy Notice below, including providing our site and Services to you, ensuring the security and performance of our site, conducting research relating to Content Offerings, sharing information with our Content Providers and our suppliers, direct marketing, and performing statistical analysis of the use of our site and Services.You have a number of rights that you can exercise in relation to our use of your Personal Data, as set out in the "Your Rights" section of this Privacy Notice below.You can find information about us and how we collect, use and store your personal data in each section of this Privacy Notice:Purpose and who we areWhat Information this Privacy Notice CoversLegal Bases for Collecting and Using Personal DataWhat Personal Data We CollectHow We Use Personal DataExternal LinksRetention of Personal DataConfidentiality & Security of Personal DataYour RightsQuestions, Suggestions and ComplaintsU.S. State Privacy RightsInternational Privacy PracticesChanging Our Privacy NoticeNo Information from Children Under 13Live2Coursera Privacy NoticePurpose and who we areThe purpose of this Privacy Notice is to describe how Coursera, Inc., our subsidiaries, and our international branches, ("Coursera," "us," "we," or "our") collects, uses, and shares information about you through our online interfaces (e.g., websites and mobile applications) owned and controlled by us, including but not limited to coursera.org and rhyme.com (collectively referred to herein as the "Site"). Please read this Privacy Notice carefully to understand what we do. If you do not understand any aspects of our Privacy Notice, please feel free to contact us at privacy@coursera.org. Your use of our Site is also governed by our Terms of Use.Terms used but not defined in this Privacy Notice can be found in our Terms of Use. Coursera, Inc. is a Delaware corporation with a principal place of business at 2440 West El Camino Real, Suite 500, Mountain View, CA 94040, USA. If you reside or are located in the European Economic Area ("EEA") Coursera is the data controller of all Personal Data (as defined below) collected via the Site and of certain Personal Data collected from third parties, as set out in this Privacy Notice unless you are part of a degree, certain certificate programs, or certain other circumstances as communicated to you, in which case Coursera is the data processor.What Information this Privacy Notice CoversThis Privacy Notice covers information we collect from you through our Site. Some of our Site’s functionality can be used without revealing any Personal Data, but for features or Services related to the Content Offerings, Personal Data is required. In order to access certain features and benefits on our Site, you may need to submit, or we may collect, "Personal Data" (i.e., information that can be used to identify you and which may also be referred to as “personally identifiable information” or “personal information”). Personal Data can include information such as your name, email address, IP address, and device identifier, among other things. You are responsible for ensuring the accuracy of the Personal Data you submit to Coursera. Inaccurate information may affect your ability to use the Site, the information you receive when using the Site, and our ability to contact you. For example, your email address should be kept current because that is one of the primary manners in which we communicate with you.Legal Bases for Collecting and Using Personal DataWe consider that the legal bases for using your Personal Data as set out in this Privacy Notice are as follows:to perform our obligations under any contract with you (for example, to comply with the Terms of Use of our Site which you accept by browsing our website and/or to comply with our contract to provide Services to you, your academic institution, your employer, or other organization that may be providing you with access to our Services);to comply with our legal obligations;for our legitimate interests or the legitimate interests of others. Our legitimate interests are to:run, grow and develop our business;operate our Site and provide our Services;select appropriately skilled and qualified suppliers;build relationships with partners and academic institutions;carry out research and statistical analysis;carry out marketing and business development; andfor internal administrative and auditing purposes.where you have given consent, for example, to send you certain communications or where you submit certain information to us, or where required to rely upon consent by local law.Which legal basis applies to a specific activity will depend on the type of personal information used and the context in which it is being used. If we rely on our (or another party’s) legitimate interests for using your personal information, we will undertake a balancing test to ensure that our (or the other party’s) legitimate interests are not outweighed by your interests or fundamental rights and freedoms which require protection of the personal information.We may process your personal information in some cases for marketing purposes on the basis of your consent (which you may withdraw at any time as described below).If we rely on your consent for us to use your personal information in a particular way, but you later change your mind, you may withdraw your consent by visiting your profile page and clicking the box to remove consent and we will stop doing so. If you withdraw your consent, this may impact the ability for us to provide some of our Services to you.What Personal Data We CollectWe gather the following types of information about users through the Site:Information relating to your use of our Site. When users come to our Site, we may track, collect, and aggregate information indicating, among other things, which pages of our Site were visited, the order in which they were visited, when they were visited, and which hyperlinks were clicked. We also collect information from the URLs from which you linked to our Site. Collecting such information may involve logging the IP address, operating system, and browser software used by each user of the Site. We may be able to determine from an IP address a user’s Internet Service Provider and the geographic location of their point of connectivity. Location data may be used to route your traffic to the nearest regional server to reduce latency and improve your experience. We may also use cookies, web beacons, and other similar technologies when you visit our Site. For more information on our use of cookies and web beacons, please refer to our Cookies Policy. We also use session-replay technologies, such as those provided by FullStory, who employs software code to record users’ interactions with the Site in a manner that allows us to watch video replays of those user sessions. The replays capture data such as mouse movements, page visits, network requests and responses, console logs, JavaScript exceptions, and browser performance metrics. These replays help us diagnose usability problems and identify areas for improvement. You can learn more about FullStory at https://www.fullstory.com/legal/privacy-policy and you can opt-out of session recording by FullStory at https://www.fullstory.com/optout/.Personal Data provided directly by you or via third parties. We collect Personal Data that you provide to us when you register for an account, update or change information for your account, purchase products or Services, complete a survey, sign-up for email updates, participate in our public forums, send us email messages, and/or participate in Content Offerings or other Services on our Site. We may use the Personal Data that you provide to respond to your questions, provide you the specific Content Offering and/or Services you select, send you updates about Content Offerings or other Coursera events, and send you email messages about Site maintenance or updates.Account Registration. If you register for an account on our Site, you may be required to provide us with certain Personal Data such as your name and email address. You may also voluntarily provide us with additional Personal Data.Updates. Coursera may offer you the ability to receive updates either via email or by posting on portions of the Site only accessible to registered users. In order to subscribe to these Services, you may be required to provide us with Personal Data such as your name and email address.Forums. Coursera may offer public forums from time to time (the "Forums") where you can share comments and thoughts. In order to participate in the Forums, you may be required to register with us and/or provide us with Personal Data such as your name and email address. Please keep in mind that information you post or make available in Forums will be publicly available. You should not include any Personal Data or other information of a personal or sensitive nature, whether relating to you or another person, in a Forum post. Please also reference our Terms of Use and our Code of Conduct for additional information about proper use of our Forums.Participation in Content Offerings. Coursera offers users the opportunity to participate in Content Offerings on or through the Site. If you desire to participate in a Content Offering, you will be asked to provide us with certain information necessary to conduct such a Content Offering. This information may include, among other things, your name and email address.If you participate in a Content Offering, we may collect certain user-generated content, such as assignments you submit, peer-graded assignments, and peer grading feedback. We also collect course data, such as responses to in-video quizzes, standalone quizzes, exams, and surveys. You should not include any Personal Data or other information of a personal or sensitive nature, whether relating to you or another person, on assignments, exams, or surveys, except for information required to participate in or submit such assignments, exams, or surveys.Identity Verification. Coursera may offer you the ability to verify your identity for select Services. In order to enroll for these Services, you may be required to provide us or our third-party identity verification vendor with Personal Data such as your name, address, date of birth, a headshot taken using a webcam, and a photo identification document. Additionally, if you apply for financial aid in connection with these Services, you may be required to provide information regarding your income.Communications with Coursera. We may receive and record Personal Data when you send us an email message or otherwise contact us, including through the use of an in-platform messaging/chat feature.Third Party Sites. We may receive Personal Data when you access or log-in to a third party site, e.g., Facebook, from our Sites. This may include the text and/or images of your Personal Data available from the third party site.Surveys. We may receive Personal Data when you provide information in response to a survey operated by us or a Content Provider.Partner sites. Partner sites providing Content Offering-related tools and services to Coursera users may collect nonfinancial individual-level user data regarding the individual’s use of that partner site while the partner sites provide those services to Coursera. The partner sites may share that data with Coursera for the purpose of improving our Services, the partner site’s services, and the individual’s education experience. This data includes information such as the amount of time spent on the partner site and pages viewed.Third Party Payment Processing. Coursera provides you with the ability to pay for Content Offerings and other Services using a credit card or other methods through a third party payment processing service provider. Please note that our service provider – not Coursera – collects and processes your financial information. Our third party payment processing service providers include Stripe, Braintree, GPay, ApplePay, PayPal, and CashApp. Each of these payment processors may use your financial information in accordance with their privacy policy, which is linked below. Stripe - https://stripe.com/privacy Braintree - https://www.braintreepayments.com/legal/braintree-privacy-policy GPay - https://payments.google.com/legaldocument?family=0.privacynotice&hl=en-GB ApplePay - https://www.apple.com/legal/privacy/data/en/apple-pay/ PayPal - https://www.paypal.com/us/webapps/mpp/ua/privacy-full CashApp - https://cash.app/legal/us/en-us/privacyHow We Use Personal DataCoursera collects and uses Personal Data for the purposes described in this section. Coursera may share such Personal Data for these purposes with third parties, such as service providers, university and industry partners, and other commercial partners.Providing the Site and our Services. We use Personal Data which you provide to us in order to allow you to access and use the Site and in order to provide any information, products, or Services that you request from us.Technical support and security. We may use Personal Data to provide technical support to you, where required, and to ensure the security of our Services and the Site.Updates. We use Personal Data collected when you sign-up for our various email or update services to send you the messages in connection with the Site or Content Offerings. We may also archive this information and/or use it for future communications with you, where we are legally entitled to do so.Analyzing and improving the Site and Services. We use Personal Data, and share such Personal Data with third-party service providers, relating to your use of the Site and Services to record and analyze how learners interact with the Site, its features and content, and our Services. This analysis may involve using techniques such as machine learning, or AI tools. We use this information to better understand demand for Coursera'
