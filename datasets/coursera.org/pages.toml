are communicated to you at the time that consent is requested.Disclosure of Personal InformationWe may disclose the personal information identified in the “Collection and Use of Personal Information” section of this U.S. State Privacy Laws Notice to third parties as follows (depending on how and why you interact with the Site and Services):Service ProvidersWe may disclose personal information to our service providers in order to have them perform services that assist us in fulfilling the purposes listed above. Our service providers provide us with a range of services including: hosting our Site, processing payments, legal, auditing and accounting professional services, postal and email delivery, conducting analysis to improve our products and Site, fulfilling requests you make, managing payments, performing identity verification, and answering your questions. We may disclose personal information to our service providers in order to improve our Site and Services, such as to identify bugs, repair errors, or ensure that services function as intended, or conduct internal research and analysis to improve our technology.Coursera PartnersWe may disclose personal information to Coursera partners (e.g. Universities, educational institutions, or industry partners) who (i) offer degree Programs hosted on the Site, in which you enroll or express an interest; or (ii) create content, programs, projects or other courses which Coursera provides on the Site and in which you enroll.Coursera CustomersWhere your access to our Services is provided to you as part of your relationship with your employer, academic institution, or corporate sponsor we may disclose to them (or an authorized entity acting on their behalf) information about your participation and learning progress on Coursera.Advertising PartnersWe may disclose limited personal information to advertising partners in order to show you advertising that is more likely to be of interest to you. You can learn more about this in the