["https://www.coursera.org/articles/what-does-a-data-analyst-do-a-career-guide"]
title = "What Does a Data Analyst Do? Your 2025 Career Guide | Coursera"
description = "Data analyst taking notes on a computer screen"
full_description = "A data analyst gathers, cleans, and studies data sets to help solve problems. Here's how you can start on a path to become one. Data analysts collect, clean, and interpret data sets to solve problems or answer questions, such as: What kind of customers should a business target in its next ad campaign? What age group is most vulnerable to a particular disease? What patterns in behavior are connected to financial fraud? Data analysts work in many industries, including business, finance, criminal justice, science, medicine, and government. In this article, we'll discuss more about what data analysts do, what skills you'll need to pursue this career, and how you can start on a path to becoming one. Afterward, if you want to start working toward a data career by building job-relevant skills and earning a respected credential, consider enrolling in the Google Data Analytics Professional Certificate. Data analysis is the process of gleaning insights from data to inform better business decisions. The process of analyzing data typically moves through five iterative phases: Data analysis can take different forms, depending on the question you’re trying to answer. Descriptive analysis tells us what happened; diagnostic analysis tells us why it happened; predictive analytics forms projections about the future; and, finally, prescriptive analysis creates actionable advice on what actions to take. A data analyst gathers and interprets data in order to solve a specific problem. The role involves plenty of time spent with data but also entails communicating findings to stakeholders. Gather data: Analysts often collect data themselves. This could include conducting surveys, tracking visitor characteristics on a company website, or buying datasets from data collection specialists. Clean data: Raw data might contain duplicates, errors, or outliers. Cleaning the data means maintaining the quality of data in a spreadsheet or through a programming language so that your interpretations won’t be wrong or skewed."
