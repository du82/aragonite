tners or customers(a) Providing our Site and Services; (b) Improving our Site and Services; (c) Enable the security features of our Site and Services; (d) Providing technical support; (e) Enabling participation in content offerings and Forums; (f) Communicating with you; (g) Enabling research; (h) Marketing, advertising, and business development; (i) Exercising/protecting legal rights and complying with legal obligationsService Providers; Coursera Partners; Coursera Customers; Research PartnersInternet or Other Electronic Network Activity Information (e.g., browsing history, search history, and information regarding your interactions with our Services)Your interactions with our Site and Services(a) Providing our Site and Services; (b) Improving our Site and Services; (c) Enable the security features of our Site and Services; (d) Providing technical support; (e) Enabling participation in content offerings and Forums; (f) Communicating with you; (g) Enabling research; (h) Marketing, advertising, and business development; (i) Exercising/protecting legal rights and complying with legal obligationsService Providers; Coursera Partners; Coursera Customers; Advertising Partners; Research PartnersGeolocation DataInformation you provide to us directly or through your interactions with our Site and Services(a) Providing our Site and Services; (b) Improving our Site and Services; (c) Enable the security features of our Site and Services; (d) Providing technical support; (e) Enabling participation in content offerings and Forums; (f) Performing identity verification; (g) Communicating with you; (h) Enabling research; (i) Marketing, advertising, and business development; (j) Exercising/protecting legal rights and complying with legal obligationsService Providers; Coursera Partners; Coursera Customers; Advertising Partners; Research PartnersProfessional or Employment-Related Information / Education informationInformation you provide to us directly; Information from our customers or partners(a) Providing our Site and Services; (b) Improving our Site and Services; (c) Enable the security features of our Site and Services; (d) Providing technical support; (e) Enabling participation in content offerings and Forums; (f) Communicating with you; (g) Enabling research; (h) Marketing, advertising, and business development; (i) Exercising/protecting legal rights and complying with legal obligationsService Providers; Coursera Partners; Coursera Customers; Research PartnersInferencesInformation you provide to us directly or through your interactions with our Site and Services; Information from our partners or customers(a) Providing our Site and Services; (b) Improving our Site and Services; (c) Enable the security features of our Site and Services; (d) Providing technical support; (e) Enabling participation in content offerings and Forums; (f) Performing identity verification; (g) Communicating with you; (h) Enabling research; (i) Marketing, advertising, and business development; (j) Exercising/protecting legal rights and complying with legal obligationsService Providers; Coursera Partners; Coursera Customers; Research PartnersAudio, electronic, visual or similar informationInformation you provide directly or through your interactions with our Services, customers, or partners(a) Providing our Site and Services; (b) Improving our Site and Services; (c) Enable the security features of our Site and Services; (d) Providing technical support; (e) Enabling participation in content offerings and Forums; (f) Performing identity verification; (g) Communicating with you; (h) Enabling research; (i) Exercising/protecting legal rights and complying with legal obligationsService Providers; Coursera Partners; Coursera Customers; Research PartnersSensitive Personal Information CategoriesDepending on how and why you interact with the Site and Services, some of the personal information that Coursera may collect and use about you, identified in “Collection and Use of Pers