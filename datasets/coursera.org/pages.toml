title = "Cookies Policy | Coursera"
description = "Please read this Cookies Policy in conjunction with our Privacy Policy, which sets out additional details on how we use personally identifiable information and your various rights. Learn online and earn valuable credentials from top universities ..."
full_description = '''Privacy NoticeU.S. State Privacy Laws NoticeData Protection AddendumCookies PolicyTerms of UseCookies Policy Effective: March 1, 2024.Coursera ("us", "we", or "our") uses cookies, web beacons, and similar technologies (“cookies and related technologies”) on coursera.org and affiliated websites (collectively the "Site").Our Cookies Policy explains what cookies and related technologies are, how we use cookies and related technologies, how third-parties we partner with may use cookies and related technologies on the Site, and your choices regarding cookies and related technologies. Please read this Cookies Policy in conjunction with our Privacy Notice, which sets out additional details on how we use personal data (including personally identifiable information) and your various rights.What are cookies and related technologiesCookies are small pieces of text sent by your web browser by a website you visit. A cookie file is stored in your web browser and allows the Site or a third-party to recognize you and make your next visit easier and the Site more useful to you. Essentially, cookies are a user’s identification card for the Coursera servers. Web beacons are small graphic files linked to our servers that allow us to track your use of our Site and related functionalities. Cookies and web beacons allow Coursera to serve you better and more efficiently, and to personalize your experience on our Site. Cookies can be "persistent" or "session" cookies.Cookies can be "persistent" or "session" cookies.How Coursera uses cookies and related technologiesManage PreferencesWhen you use and access the Site, we may place a number of cookies and/or web beacon files in your web browser. Coursera uses or may use cookies and/or web beacons to help us determine and identify repeat visitors, the type of content and sites to which a user of our Site links, the length of time each user spends at any particular area of our Site, and the specific functionalities that users choose to use. To the extent that such collected data constitutes personally identifiable information, we process such data as set out in our Privacy Notice. We use both session and persistent cookies and related technologies, of different types, on the Site: Essential cookies and related technologies. Necessary for the operation of the Site. We may use essential cookies to authenticate users, prevent fraudulent use of user accounts, or offer Site features.Analytical/performance cookies and related technologies. Allow us to recognize and count the number of visitors and see how visitors move around the Site when using it. This helps us improve the way the Site works.Functionality cookies and related technologies. Used to recognize you when you return to the Site. This enables us to personalize our content for you, greet you by name, and remember your preferences (for example, your choice of language or region).Targeting cookies and related technologies. Record your visit to the Site, the pages you have visited, and the links you have followed. We will use this information to make the Site and the content more relevant to your interests. We may also share this information with third parties for this purpose.To view a list of Coursera cookies, please view our Cookies Table.Third-party cookies and related technologiesIn addition to our own cookies, we may also use various third-party cookies and/or web beacons to report usage statistics of the Site and refine marketing efforts.Tracking cookies/web beacons. Follow on-site behavior and tie it to other metrics allowing better understanding of usage habits.Optimization cookies/web beacons. Allow real-time tracking of user conversion from different marketing channels to evaluate their effectiveness.Partner cookies/web beacons. Provide marketing conversion metrics to our partners so they can optimize their paid marketing efforts.To view a list of Coursera cookies, please view our Cookies Table.What are your choices regarding cookies and related technologiesIf you'd like to delete cookies or instruct your web browser to delete or refuse cookies, please visit the help pages of your web browser. You can also use the “Manage Preferences” link in the “How Coursera uses cookies” section above to change your settings in respect of cookies and related technologies, depending on your location. Coursera does not currently recognize do-not-track signals from your web browser.Please note, however, that if you delete, reject, or refuse to accept cookies and related technologies, you might not be able to use some or all of the features we offer. You may not be able to log in, store your preferences, and some of our pages might not display properly.California law requires us to let you know how we respond to web browser Do Not Track (DNT) signals. Because there is currently no industry or legal standard for recognizing or honoring DNT signals, we do not respond to them at this time.RevisionsBelow is a list of all the revisions made to the content of our Cookies Policy, with links to view the difference between each revision.2024-03-01: Updated to improve clarity of information about technologies used on the Coursera platform2020-12-18: Updated for clarity regarding the choices you have with respect to cookies'''
