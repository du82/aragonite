he Live2Coursera Services.6. Additional Privacy Disclosure for Live2Coursera UsersTo review how Live2Coursera collects and uses Personal Data, please review our site-wide Privacy Notice and in the specific section on Live2Coursera.If you have any questions about how we handle your information, please contact us at privacy@coursera.org."
