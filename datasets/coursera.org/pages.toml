rty Offering will be subject to the terms of use, privacy policy, and any other applicable terms and conditions, required by the provider of such Third-Party Offering. Coursera provides these Third-Party Offerings only as a convenience and does not review, approve, monitor, endorse, warrant, or make any representations with respect to Third-Party Offerings, and you access and/or use all such Third-Party Offerings at your own risk.2. Registering for Live2Cousera Services 2.1. In order to access certain features of the Live2Coursera Services, you may be required to become a Registered User. For purposes of the Live2Coursera Terms, a “Registered User” is a user who has registered an account on the Coursera website (“Account”) or has a valid account on a Third-Party Offering through which you have connected to the Live2Coursera Services (“Third-Party Account”). 2.2. If you access the Live2Coursera Services through a Third-Party Offering, you may link your Account with Third-Party Account(s), by allowing Coursera to access your Third-Party Account, as is permitted under the applicable terms and conditions that govern your use of each Third-Party Account. You represent that you are entitled to disclose your Third-Party Account login information to Coursera and/or grant Coursera access to your Third-Party Account (including, but not limited to, for use for the purposes described herein) without breach by you of any of the terms and conditions that govern your use of the applicable Third-Party Account and without obligating Coursera to pay any fees or making Coursera subject to any usage limitations imposed by such third-party service providers. By granting Coursera access to any Third-Party Accounts, you understand that Coursera may access, make available and store (if applicable) any content that you have provided to and stored in your Third-Party Account (“Third-Party Account Content”) so that it is available on and through the Services via your Account. Depending on the