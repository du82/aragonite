["https://www.coursera.org/articles/the-pmp-certification-a-guide-to-getting-started"]
title = "How to Get a PMP Certification: An Overview | Coursera"
description = "With over a million certification holders worldwide, the PMP is widely recognized and has been linked to multiple benefits for project managers. Here's what you need to know to get started."
full_description = "With over a million certification holders worldwide, the PMP is widely recognized and has been linked to multiple benefits for project managers. Here's what you need to know to get started. The Project Management Professional (PMP)® certification is a globally recognized project management certification that tests a candidate’s ability to manage people, processes, and business priorities. According to the Project Management Institute (PMI), which administers the certification, there are over one million PMP-certified professionals worldwide. It applies to project managers in virtually any industry, including health, construction, information technology (IT), and business. To earn this certification, you’ll first need to acquire 35 hours of project management education. You can meet this experience requirement while simultaneously earning a certificate from another industry leader by enrolling in the self-paced, online Google Project Management Professional Certificate program. You must validate your project management experience and education to take the certification exam. There are three sets of training requirements to choose from: 35 hours of project management training, which means coursework that specifically addressed learning objectives in project management. This can be substituted with a Certified Associate in Project Management (CAPM)® certification. 35 hours of project management training, which means coursework that specifically addressed learning objectives in project management. This can be substituted with a Certified Associate in Project Management (CAPM)® certification. 35 hours of project management training, which means coursework that specifically addressed learning objectives in project management. This can be substituted with a Certified Associate in Project Management (CAPM)® certification. As of October 2024, the exam fee is $675 for non-PMI members and $425 for PMI members [1]. A PMI membership costs $159 a year, with special membership options for eligible students and retirees."
