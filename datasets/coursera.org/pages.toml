full_description = '''Acceptable Use PolicyCopyright and Trademark PolicyPayments and Refund PolicyHonor CodeRevisionsTerms of UseEffective: January 1, 2025.Thank you for using Coursera!Coursera offers products and services provided by Coursera, Inc., our subsidiaries, and our international branches, including Coursera Europe B.V., a limited liability company incorporated in the Netherlands (VAT number NL861937016B01) (collectively, "Coursera," "us," "we," or "our"). These Terms of Use ("Terms") govern your use of our website, apps, and other products and services ("Services"). As some of our Services may be software that is downloaded to your computer, phone, tablet, or other device, you agree that we may automatically update this software, and that these Terms will apply to such updates. Please read these Terms carefully, and contact us if you have any questions, requests for information, or complaints. By clicking “I accept” (or for those who have not yet created an account, by using our Services), you agree to be bound by these Terms, including the policies referenced in these Terms. By using our Services, you agree to be bound by these Terms, including the policies referenced in these Terms.THESE TERMS INCLUDE AN ARBITRATION AGREEMENT, JURY TRIAL WAIVER AND CLASS ACTION WAIVER THAT APPLY TO ALL CLAIMS BROUGHT AGAINST COURSERA. PLEASE READ THEM CAREFULLY AS THEY AFFECT YOUR LEGAL RIGHTS: (1) YOU WILL ONLY BE PERMITTED TO PURSUE DISPUTES OR CLAIMS AND SEEK RELIEF AGAINST US ON AN INDIVIDUAL BASIS, NOT AS A PLAINTIFF OR CLASS MEMBER IN ANY CLASS OR REPRESENTATIVE ACTION OR PROCEEDING AND YOU WAIVE YOUR RIGHT TO PARTICIPATE IN A CLASS ACTION LAWSUIT OR CLASS-WIDE ARBITRATION; AND (2) YOU ARE WAIVING YOUR RIGHT TO PURSUE DISPUTES OR CLAIMS AND SEEK RELIEF IN A COURT OF LAW AND TO HAVE A JURY TRIAL. THE TERMS OF THE ARBITRATION AGREEMENT SHALL NOT APPLY IF UNENFORCEABLE UNDER THE LAWS OF THE COUNTRY IN WHICH YOU RESIDE.1. Using CourseraWho May Use Our ServicesAny use or access by anyone under the age of 13 is strictly prohibited.Additionally, you may use our Services only if you: can form a binding contract with Coursera;comply with these Terms, all applicable laws, and our policies (including the Acceptable Use Policy, Honor Code, course-specific eligibility requirements, and any other policies that may be applicable from time to time (“Policies”)); andare over the age at which you can provide consent to data processing under the laws of your country. Certain regions and Content Offerings may have additional requirements and/or different age restrictions. Any violation of our Terms, applicable laws, or Policies may result in your access to all or part of the Services being suspended, disabled, or terminated.When you create your Coursera account, and when you subsequently use certain features, you must provide us with accurate and complete information, and you agree to update your information to keep it accurate and complete. Our License to YouSubject to these Terms and our Policies, we grant you a limited, personal, non-exclusive, non-transferable, and revocable license right to use our Services. The rights granted herein are only for your personal, non-commercial use, unless you obtain our written permission otherwise. You also agree that you will create, access, and/or use only one user account, unless expressly permitted by Coursera, and you will not share access to your account or access information for your account with any third party. Using our Services does not give you ownership of or any intellectual property rights in our Services or the content you access.Commercial UseAny use of our Services for commercial purposes is strictly prohibited. Any commercial use must be subject to a separate agreement with Coursera, Inc. Refer to our Enterprise page for more information. If you are an organization already using our Services, separate terms apply. These terms do not govern the relationship between your organization and Coursera.2. Content OfferingsChanges to Content OfferingsCoursera offers courses and content ("Content Offerings") from universities and other providers ("Content Providers"). While we seek to provide world-class Content Offerings from our Content Providers, unexpected events do occur. Coursera reserves the right to cancel, interrupt, reschedule, or modify any Content Offerings, or change the point value or weight of any assignment, quiz, or other assessment, either solely, or in accordance with Content Provider instructions. Content Offerings are subject to the Disclaimers and Limitation of Liability sections below.No Academic CreditCoursera does not grant academic credit for the completion of Content Offerings. Unless otherwise explicitly indicated by a credit-granting institution, participation in or completion of Content Offerings does not confer any academic credit. Even if credit is awarded by one institution, there is no presumption that other institutions will accept that credit. You agree not to accept credit for completing a Content Offering unless you have earned a course certificate or other equivalent documentation of your completion of the Content Offering. Coursera, instructors, and the associated Content Providers have no obligation to have Content Offerings recognized by any educational institution or accreditation organization.Disclaimer of Student-Content Provider RelationshipExcept as described in the Degree, MasterTrack, and University Certificate Programs section below, nothing in these Terms or otherwise with respect to your participation in any Content Offerings by Content Providers : (a) establishes any relationship between you and any Content Provider; (b) enrolls or registers you in any Content Provider institution, or in any Content Offering offered by any Content Provider institution; or (c) entitles you to use the resources of any Content Provider institution beyond participation in the Content Offering.3. Your ContentUser ContentThe Services enable you to share your content, such as homework, quizzes, exams, projects, other assignments you submit, posts you make in the forums, and the like ("User Content"), with Coursera, instructors, and/or other users. You retain all intellectual property rights in, and are responsible for, the User Content you create and share. User Content does not include course content or other materials made available on or placed on to the Coursera platform by or on behalf of Content Providers or their instructors using the Services or Content Offerings. As between Coursera and Content Providers, such Content Offerings are governed by the relevant agreements in place between Coursera and Content Providers.How Coursera and Others May Use User ContentTo the extent that you provide User Content, you grant Coursera a fully-transferable, royalty-free, perpetual, sublicensable, non-exclusive, worldwide license to copy, distribute, modify, create derivative works based on, publicly perform, publicly display, and otherwise use the User Content. This license includes granting Coursera the right to authorize Content Providers to use User Content with their registered students, on-campus learners, or other learners independent of the Services. Nothing in these Terms shall restrict other legal rights Coursera may have to User Content, for example under other licenses. We reserve the right to remove or modify User Content for any reason, including User Content that we believe violates these Terms or other policies including our Acceptable Use Policy and Code of Conduct.FeedbackWe welcome your suggestions, ideas, comments, and other feedback regarding the Services ("Feedback"). By submitting any Feedback, you grant us the right to use the Feedback without any restriction or any compensation to you. By accepting your Feedback, Coursera does not waive any rights to use similar or related Feedback previously known to Coursera, developed by our employees, contractors, or obtained from other sources.4. SecurityWe care about the security of our users. While we work to protect the security of your account and related information, Coursera cannot guarantee that unauthorized third parties will not be able to defeat our security measures. Please notify us immediately of any compromise or unauthorized use of your account by emailing security@coursera.org or submitting via HackerOne.5. Third Party ContentThrough the Services, you will have the ability to access and/or use content provided by instructors, other users, and/or other third parties and links to websites and services maintained by third parties. Coursera cannot guarantee that such third party content, in the Services or elsewhere, will be free of material you may find objectionable or otherwise inappropriate or of malware or other contaminants that may harm your computer, mobile device, or any files therein. Coursera disclaims any responsibility or liability related to your access or use of, or inability to access or use, such third party content.6. Copyright and TrademarkCoursera respects the intellectual property rights of our users, Content Providers, and other third parties and expects our users to do the same when using the Services. We have adopted and implemented the Coursera Copyright and Trademark Policy below in accordance with applicable law, including the Digital Millennium Copyright Act.7. Education ResearchCoursera is committed to advancing the science of learning and teaching, and records of your participation in courses may be used for education research. In the interest of this research, you may be exposed to variations in the Content Offerings. Research findings will typically be reported at the aggregate level. Your personal identity will not be publicly disclosed in any research findings without your express consent.8. Paid Services from CourseraCoursera offers paid Services (e.g., course certificates for certain courses) for a fee. Unless otherwise stated, fees are quoted in local currency. You are responsible for paying all fees charged by or for Coursera and applicable taxes in a timely manner with a payment mechanism associated with the applicable paid Services. If your payment method fails or your account is past due, we may collect fees using other collection mechanisms. Fees may vary based on your location and other factors, and Coursera reserves the right to change any fees at any time at its sole discretion. Any change, update, or modification will be effective immediately upon posting through the relevant Services. Refunds may be available for paid Services as described in our Payments and Refund Policy below.Degree, MasterTrack, and University Certificate ProgramsThe Services may allow you to enroll in Degree, MasterTrack, and University Certificate programs or similar programs offered by our Content Providers on the Coursera platform. Our Content Providers serve as the distance education providers of these programs and determine admissions, refund, and graduation or completion policies and requirements. Nothing in these Terms shall restrict the applicability to you of any institutional policies established by our Content Provider in connection with these programs (e.g., student codes of conduct); such policies shall supplement these Terms and to the extent there is a conflict between such policies and these Terms, as between you and our Content Provider, our Content Provider’s policies shall govern.Depending on the program, tuition and fee payments for these programs may be collected by Coursera or our Content Partners. If your payment method fails or your account is past due, we or our Content Partners may collect tuition and fees using other collection mechanisms. Tuition and fees may vary based on your location and other factors, and Coursera and its Content Partners reserve the right to change any tuition and fees for future semesters or equivalent payment periods at their sole discretion. Refunds may be available for paid Services as described in our Refund Policy below. You are encouraged to research and consider whether the tuition and fees required for Content Offerings align with your professional and financial goals. Professional licensure, certification, and job requirements for various professions may vary in each state and country, and job requirements may vary by employer. Coursera does not guarantee licensure, certification or qualification for any profession or job on the basis of your completion of a Content Offering on Coursera. You are advised to research, understand and comply with the requirements in the applicable state and/or country in which you work or intend to work, and to investigate whether the Content Offering in which you intend to enroll meets your academic and/or professional needs before enrolling.9. Modifying or Terminating our ServicesWe are constantly changing and improving our Services. We may add or remove functions, features, or requirements, and we may suspend (to the extent allowed by applicable law) or stop part of our Services altogether. Accordingly, Coursera may terminate your use of any Service for any reason. If your use of a paid Service is terminated, a refund may be available under our Refund Policy. We may not be able to deliver the Services to certain regions or countries for various reasons, including due to applicable export control requirements or internet access limitations and restrictions from governments, or for commercial or reputational reasons. None of Coursera, its Content Providers and instructors, its contributors, sponsors, and other business partners, and their employees, contractors, and other agents (the "Coursera Parties") shall have any liability to you for any such action. You can stop using our Services at any time, although we'll be sorry to see you go.10. DisclaimersTO THE MAXIMUM EXTENT PERMITTED BY LAW, THE SERVICES AND ALL INCLUDED CONTENT ARE PROVIDED ON AN "AS IS" BASIS WITHOUT WARRANTY OF ANY KIND, WHETHER EXPRESS OR IMPLIED. THE COURSERA PARTIES SPECIFICALLY DISCLAIM ANY AND ALL WARRANTIES AND CONDITIONS OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE, AND NON-INFRINGEMENT, AND ANY WARRANTIES ARISING OUT OF COURSE OF DEALING OR USAGE OF TRADE. THE COURSERA PARTIES FURTHER DISCLAIM ANY AND ALL LIABILITY RELATED TO YOUR ACCESS OR USE OF THE SERVICES OR ANY RELATED CONTENT. YOU ACKNOWLEDGE AND AGREE THAT ANY ACCESS TO OR USE OF THE SERVICES OR SUCH CONTENT IS AT YOUR OWN RISK.11. Limitation of LiabilityTO THE MAXIMUM EXTENT PERMITTED BY LAW, COURSERA SHALL NOT BE LIABLE FOR ANY INDIRECT, INCIDENTAL, SPECIAL, CONSEQUENTIAL, OR PUNITIVE DAMAGES, OR ANY LOSS OF PROFITS OR REVENUES, WHETHER INCURRED DIRECTLY OR INDIRECTLY, OR ANY LOSS OF DATA, USE, GOODWILL, OR OTHER INTANGIBLE LOSSES, RESULTING FROM: (A) YOUR ACCESS TO OR USE OF OR INABILITY TO ACCESS OR USE THE SERVICES; (B) ANY CONDUCT OR CONTENT OF ANY PARTY OTHER THAN THE APPLICABLE COURSERA PARTY, INCLUDING WITHOUT LIMITATION, ANY DEFAMATORY, OFFENSIVE, '''
