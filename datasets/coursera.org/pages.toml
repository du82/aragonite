cy Laws.A summary of the rights that may be applicable to you is as follows:Rights of access, deletion and portabilityYou may have the right to request access, deletion and portability in respect of your personal information.Right of correctionYou may have the right to request that inaccuracies in your personal information are corrected.Rights to opt-out of sale/sharing of Personal Information and/or personalized/targeted advertisingYou may have the right to opt-out of sales of your personal information, the right to opt-out of sharing (as the term “sharing” is defined under the CCPA) of your personal information, and/or the right to opt-out of personalized/targeted advertising.As some U.S. State Privacy Laws define “sale” or “sharing” of personal information very broadly, we may “sell” or “share” personal information with third parties if we disclose personal information to advertising partners in order to show you advertising that is more likely to be of interest to you. The personal information disclos'
