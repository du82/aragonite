graphic material, defined by Webster’s Dictionary as “explicit descriptions or displays of sexual organs or activities intended to stimulate erotic rather than aesthetic or emotional feelings.”Post or share content that harasses, threatens or harms others, including but not limited to defamatory, discriminatory, or mean-spirited content, including references or commentary about religion, race, sexual orientation, gender, national/ethnic origin, or other targeted groups, particularly if the app is likely to humiliate, intimidate, or harm a targeted individual or group.Upload, post, e-mail, transmit or otherwise make available any unsolicited or unauthorized advertising, promotional materials, “junk mail,” “spam,” “chain letters,” “pyramid schemes,” or any other form of solicitation, including, without limitation, posting comments promoting other third-party products, services and websites.Collect, harvest, transmit, distribute, post or submit any information concerning any other person or entity, including without limitation, photographs of others without their permission, personal contact information or credit, debit, calling card or account numbers. 3.2. We reserve the right, but do not assume the obligation, to investigate any violation of these Posting Terms or misuse of the Live2Coursera Services. We may:investigate violations of these Posting Terms or misuse of the Live2Coursera Services; orremove, disable access to, or modify any content or resource that violates these Live2Coursera Terms or any other agreement we have with you for use of the Live2Coursera Services.3.3. We may report any activity that we suspect violates any law or regulation to appropriate law enforcement officials, regulators, or other appropriate third parties. Our reporting may include disclosing appropriate customer information. We also may cooperate with appropriate law enforcement agencies, regulators, or other appropriate third parties to help with the investigation and prosecution of 