rvices enable you to share your content, such as homework, quizzes, exams, projects, other assignments you submit, posts you make in the forums, and the like ("User Content"), with Coursera, instructors, and/or other users. You retain all intellectual property rights in, and are responsible for, the User Content you create and share. User Content does not include course content or other materials made available on or placed on to the Coursera platform by or on behalf of Content Providers or their instructors using the Services or Content Offerings. As between Coursera and Content Providers, such Content Offerings are governed by the relevant agreements in place between Coursera and Content Providers.How Coursera and Others May Use User ContentTo the extent that you provide User Content, you grant Coursera a fully-transferable, royalty-free, perpetual, sublicensable, non-exclusive, worldwide license to copy, distribute, modify, create derivative works based on, publicly perform, publicly display, and otherwise use the User Content. This license includes granting Coursera the right to authorize Content Providers to use User Content with their registered students, on-campus learners, or other learners independent of the Services. Nothing in these Terms shall restrict other legal rights Coursera may have to User Content, for example under other licenses. We reserve the right to remove or modify User Content for any reason, including User Content that we believe violates these Terms or other policies including our Acceptable Use Policy and Code of Conduct.FeedbackWe welcome your suggestions, ideas, comments, and other feedback regarding the Services ("Feedback"). By submitting any Feedback, you grant us the right to use the Feedback without any restriction or any compensation to you. By accepting your Feedback, Coursera does not waive any rights to use similar or related Feedback previously known to Coursera, developed by our employees, contractors, or obtained from other sources.4. SecurityWe care about the security of our users. While we work to protect the security of your account and related information, Coursera cannot guarantee that unauthorized third parties will not be able to defeat our security measures. Please notify us immediately of any compromise or unauthorized use of your account by emailing security@coursera.org or submitting via HackerOne.5. Third Party ContentThrough the Services, you will have the ability to access and/or use content provided by instructors, other users, and/or other third parties and links to websites and services maintained by third parties. Coursera cannot guarantee that such third party content, in the Services or elsewhere, will be free of material you may find objectionable or otherwise inappropriate or of malware or other contaminants that may harm your computer, mobile device, or any files therein. Coursera disclaims any responsibility or liability related to your access or use of, or inability to access or use, such third party content.6. Copyright and TrademarkCoursera respects the intellectual property rights of our users, Content Providers, and other third parties and expects our users to do the same when using the Services. We have adopted and implemented the Coursera Copyright and Trademark Policy below in accordance with applicable law, including the Digital Millennium Copyright Act.7. Education ResearchCoursera is committed to advancing the science of learning and teaching, and records of your participation in courses may be used for education research. In the interest of this research, you may be exposed to variations in the Content Offerings. Research findings will typically be reported at the aggregate level. Your personal identity will not be publicly disclosed in any research findings without your express consent.8. Paid Services from CourseraCoursera offers paid Services (e.g., course certificates for certain courses) for a fee. Unless otherwise stated, fees are quoted in local currency. You are responsible for paying all fees charged by or for Coursera and applicable taxes in a timely manner with a payment mechanism associated with the applicable paid Services. If your payment method fails or your account is past due, we may collect fees using other collection mechanisms. Fees may vary based on your location and other factors, and Coursera reserves the right to change any fees at any time at its sole discretion. Any change, update, or modification will be effective immediately upon posting through the relevant Services. Refunds may be available for paid Services as described in our Payments and Refund Policy below.Degree, MasterTrack, and University Certificate ProgramsThe Services may allow you to enroll in Degree, MasterTrack, and University Certificate programs or similar programs offered by our Content Providers on the Coursera platform. Our Content Providers serve as the distance education providers of these programs and determine admissions, refund, and graduation or completion policies and requirements. Nothing in these Terms shall restrict the applicability to you of any institutional policies established by our Content Provider in connection with these programs (e.g., student codes of conduct); such policies shall supplement these Terms and to the extent there is a conflict between such policies and these Terms, as between you and our Content Provider, our Content Provider’s policies shall govern.Depending on the program, tuition and fee payments for these programs may be collected by Coursera or our Content Partners. If your payment method fails or your account is past due, we or our Content Partners may collect tuition and fees using other collection mechanisms. Tuition and fees may vary based on your location and other factors, and Coursera and its Content Partners reserve the right to change any tuition and fees for future semesters or equivalent payment periods at their sole discretion. Refunds may be available for paid Services as described in our Refund Policy below. You are encouraged to research and consider whether the tuition and fees required for Content Offerings align with your professional and financial goals. Professional licensure, certification, and job requirements for various professions may vary in each state and country, and job requirements may vary by employer. Coursera does not guarantee licensure, certification or qualification for any profession or job on the basis of your completion of a Content Offering on Coursera. You are advised to research, understand and comply with the requirements in the applicable state and/or country in which you work or intend to work, and to investigate whether the Content Offering in which you intend to enroll meets your academic and/or professional needs before enrolling.9. Modifying or Terminating our ServicesWe are constantly changing and improving our Services. We may add or remove functions, features, or requirements, and we may suspend (to the extent allowed by applicable law) or stop part of our Services altogether. Accordingly, Coursera may terminate your use of any Service for any reason. If your use of a paid Service is terminated, a refund may be available under our Refund Policy. We may not be able to deliver the Services to certain regions or countries for various reasons, including due to applicable export control requirements or internet access limitations and restrictions from governments, or for commercial or reputational reasons. None of Coursera, its Content Providers and instructors, its contributors, sponsors, and other business partners, and their employees, contractors, and other agents (the "Coursera Parties") shall have any liability to you for any such action. You can stop using our Services at any time, although we'll be sorry to see you go.10. DisclaimersTO THE MAXIMUM EXTENT PERMITTED BY LAW, THE SERVICES AND ALL INCLUDED CONTENT ARE PROVIDED ON AN "AS IS" BASIS WITHOUT WARRANTY OF ANY KIND, WHETHER 