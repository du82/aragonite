full_description = '{"@context":"http://schema.org","@type":"WebPage","name":" | Coursera","image":"https://images.ctfassets.net/00atxywtfxvd/3pZsUDCy8M43PlCSyVlhU7/2a77646d2c7ea03b07f3536bbb698617/BC-1495_B2C_New_Content_Email_Top_Banner-No_Logo.jpg"} ECTS Credit RecommendationThe Foundation for International Business Administration Accreditation (FIBAA) has certified 15 Professional Certificates from Google and IBM, with European Credit Transfer and Accumulation System (ECTS) credit recommendations available exclusively on Coursera.Universities and learners across 49 member countries in the EHEA and Bologna Process can now recognize, transfer and earn ECTS credits for these industry certificates towards a degree, supporting accessible, flexible learner mobility in higher education.Google Cybersecurity Professional CertificateGet on the fast track to a career in cybersecurity. In this certificate program, you’ll learn in-demand skills at your own pace, no degree or experience required.Learning outcomes:Understand the importance of cybersecurity practices and their impact for organizations.Identify common risks, threats, and vulnerabilities, as well as techniques to mitigate them.Protect networks, devices, people, and data from unauthorized access and cyberattacks using Security Information and Event Management (SIEM) tools.Gain hands-on experience with Python, Linux, and SQL.Additional information:Recommended credits: 7Workload: approximately 166 hoursMinimum passing score: 80%The learning outcomes and skills acquired can be recognized as modules in subsequent educational courses, with a recommendation for recognition at EQF levels 5 and 6 for their designated ECTS credits.Learn moreGoogle Advanced Data Analytics Professional CertificateGet on the fast track to a career in data analytics. In this certificate program, you’ll learn in-demand skills at your own pace, no degree or experience required.Learning outcomes:Explore the roles of data professionals within an organizationCreate data visualizations and apply statistical methods to investigate dataBuild regression and machine learning models to analyze and interpret dataCommunicate insights from data analysis to stakeholdersAdditional information:Recommended credits: 8Workload: approximately 201 hoursMinimum passing score: 80%The learning outcomes and skills acquired can be recognized as modules in subsequent educational courses, with a recommendation for recognition at EQF levels 5 and 6 for their designated ECTS credits.Learn moreGoogle Business Intelligence Professional CertificateGet on the fast track to a career in business intelligence. In this certificate program, you’ll learn in-demand skills at your own pace, no degree or experience required.Learning outcomes:Explore the roles of business intelligence (BI) professionals within an organizationPractice data modeling and extract, transform, load (ETL) processes that meet organizational goalsDesign data visualizations that answer business questionsCreate dashboards that effectively communicate data insights to stakeholdersAdditional information:Recommended credits: 3Workload: approximately 76 hoursMinimum passing score: 80%The learning outcomes and skills acquired can be recognized as modules in subsequent educational courses, with a recommendation for recognition at EQF levels 5 and 6 for their designated ECTS credits.Learn moreGoogle Project Management: Professional CertificateGet on the fast track to a career in project management. In this certificate program, you’ll learn in-demand skills at your own pace, no degree or experience required.Learning outcomes:Gain an immersive understanding of the practices and skills needed to succeed in an entry-level project management roleLearn the foundations of Agile project management, with a focus on implementing Scrum events, building Scrum artifacts, and understanding Scrum rolesLearn how to create effective project documentation and artifacts throughout the various phases o