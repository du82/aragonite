["https://courses.csail.mit.edu/6.803"]
title = "6.xxx (aka 6.803/6.833)"
full_description = "We regret that the 2019 edition of 6.803/6.833, The Human Intelligence Enterprise, was heavily oversubscribed with four times as many students registered as we had hoped. Because of the discussion-oriented nature of the subject, we had to limit enrollment via a lottery following the first day of class. This is the promised list of great works. Send me a note when you think of something that belongs on the list. You cannot lead if you cannot communicate. A corollary is that you should hone your communication skills for the rest of your life. Available fall, 2019, probably. See my home page for updates. Communication is to be 6.xxx on paper, both more and less. More on communication, less on leadership. Just after I distributed a draft of my first textbook, a student lobbed the dreaded question at me. “Have you read Strunk and White?” she said. I was betrayed because I had not deployed active verbs. Once Strunk and White is in your blood, read Dupre. She is a developmental editor; that is, she not only performs the lessor, comma-correcting function of a copy editor, she also comments on clarity and structure. After I wrote a few books, I thought I had learned what ordinary copy editors have to teach, so I asked my publisher to find an editor who could make me cry. They found Dupre. She did. Because we think with our eyes as well as our mouth, illustrations should properly stimulate your reader's visual problem solving apparatus. In this domain, Tufte's book reigns supreme. Look at the illustrations and discover what he has to say about them. Note, however, that you are likely to be disappointed by the writing style at the sentence and paragraph level. If I don't feel like Shakespeare, I read McPherson, who does Strunk and White great honor in the way he uses verbs. The Battle Cry of Freedom is the best one-volume treatment of the American Civil War and takes you beyond high-school simplifications toward an understanding of the complex economic and political roots of a horrible war."
year_published = 2025
clearnet = "https://courses.csail.mit.edu/6.803"
