title = "PHYS 213 :: Physics Illinois :: University of Illinois at Urbana-Champaign"
full_description = "PHYS 213 Fall 2024 PHYS 213 :: Physics Illinois :: University of Illinois at Urbana-Champaign Home page Announcements Welcome to Physics 213! Note that class starts ONE WEEK EARLY compared to most 8-week courses: October 14 will be the first day of class. We will meet in Loomis 141 at the lecture time you've signed up for. Below please find some useful information on getting set up for the first day of class: Lecture Students must be on time and prepared for lecture. Read the prelecture notes available on the schedule and complete the checkpoint questions on smart.physics. The lectures will be recorded and available on mediaspace. After the lectures are delivered, the PDFs will be available on the syllabus. Discussion Students must be on time and prepared for discussion. Students arriving more than 10 minutes late for discussion will receive a grade of 0. You will turn in your work at the end of the class to be graded on participation. The turned in work is just so you can receive feedback. Laboratory Students must be on time and prepared for labs. Students arriving more than 10 minutes late for labs will receive a grade of 0. Homework Homework assignments are on smart.physics. Consult the course schedule for due dates. Exams View Formula Sheet There are two hour exams and a final two-hour exam. See the course schedule. Exams will be administered at the the CBTF. All exams must be scheduled in advance using the CBTF scheduling system. Review the exam information page for details. Read and understand the information posted here before the first exam. Excused Absences Please submit your excused absence no later than 12 business days after your absence via the Excused Absences application. For more information regarding this course's excuses policy, please refer to the Attendance Policy page. Academic Integrity All activities in this course, including documentation submitted for petition for an excused absence, are subject to the Academic Integrity rules as described in Article 1, Part 4, Academic Integrity, of the Student Code."
