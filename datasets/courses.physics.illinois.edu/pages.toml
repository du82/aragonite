title = "PHYS 213 :: Physics Illinois :: University of Illinois at Urbana-Champaign"
full_description = "PHYS 213 Fall 2024 PHYS 213 :: Physics Illinois :: University of Illinois at Urbana-Champaign Attendance Policy Section Attendance Students are expected to attend the laboratory and discussion section in which they are registered. Section swapping is not allowed. Tardiness If you show up to your discussion section 10 or more minutes late, you will receive a 20% deduction on your score for that section. Note that if you are late enough that you cannot fully participate in the discussion, you may recieve a commensurately lower score. If you show up to your lab section 10 or more minutes late, you will not be allowed to participate. If you show up to an exam 10 or more minutes late, you will not be given any extra time to complete the exam. Please be on time for all sections/exams. Absences Types of Absence Two types of absence can be recorded in the gradebook: Excused absences--issued a grade of EX Unexcused absences--issued a grade of ABS Equates to a grade of zero (0) for the missed course component. The only course components eligible to be issued a grade of EX: Discussions Exams Labs The consequences of absences, excused or otherwise, are discussed in the course grading policy. Excused Absences Excused absences will be granted and documented in accordance with University policy as described in Article 1, Part 5 Class Attendance, of the Student Code. Acceptable forms of documentation include a Return to Work/School document from a medical provider, a Dial-A-Nurse event confirmation, an obituary or confirmation letter from a funeral director, a letter from a potential employer, a letter from the Department of Intercollegiate Athletics (DIA), Military Orders, Passport or Immigration appointment documentation, Graduate School Interview Confirmation or a letter from the Office of the Dean of Students. Excused absences fall into the following categories as defined by the code: illness emergency beyond the student's control (e.g. an auto accident or death in the family) required attendance at a University event (e.g. varsity athletics) religious observance or practice Requires request for accommodation for religious observances form. Form must be uploaded to the Excused Absences application. More information available from the Office of the Dean of Students. serving as an volunteer emergency worker Procedures The Excused Absences application will guide students through the procedure for documenting missed classes, including the effects of the absence on students' grades. Final Exams Failing to show-up for a final exam will result in an AB grade resulting in failure (F) for the course. In accordance with University policy as described in Article 3, Part 1 Grades and Grading Systems of the Student Code, only an authorized member of the Dean's Office of the student's college can change an AB final exam grade to an EX. University policy will apply for EX grades so granted, as described in Article 3, Part 2 Examinations of the Student Code. Course Completion and Irregular Attendance In compliance with the Student Code, the instructor of this course determines the amount of coursework which must be completed to pass. Attendance is required to meet the requirements. Discussion: Students are allowed a maximum of 2 excused absences in discussion. Starting with the next absence, the absence will be marked ABS. Lab: Students are allowed a maximum of 1 excused absence in Lab. Starting with the next absence, the absence will be marked ABS. To see how EXs will affect your grade calculation at the end of the semester, be sure to review the course grading page. If a student reaches either of these absence thresholds in discussion or labs, your conduct will be considered irregular attendance and the Dean of your college will be notified in compliance with Article 1, Part 5, Section 501, item (g) and (h) and Article 3, Part 3, Section 3-312 of the Student Code."
