full_description = "PHYS 213 Fall 2024 PHYS 213 :: Physics Illinois :: University of Illinois at Urbana-Champaign Exam Information There will be two hour exams and a final exam in this course. Hour Exam 1 will cover units 1-4. Hour Exam 2 will cover units 5-8. The final exam covers all of the course material. The exams include both conceptual questions and physical problems. When will I take my exam? Check the course schedule What should I bring to the exam? A digital copy of the Equation Sheet will be provided. Please do not bring a printed copy with you. Computer-Based Testing Facility (CBTF) This course uses the Grainger College of Engineering’s Computer-Based Testing Facility for its exams. The policies of the CBTF are the policies of this course, and academic integrity infractions related to the CBTF are infractions in this course. If you have accommodations identified by the Division of Rehabilitation-Education Services (DRES) for exams, please submit your Letter of Accommodations (LOA) here before you make your first exam reservation. This must be done each semester you use the CBTF. If you have any issue during an exam, inform the proctor immediately. Work with the proctor to resolve the issue at the time before logging off. If you do not inform a proctor of a problem during the test then you forfeit all rights to redress. If you do not have a physical i-card, and therefore no ID photo with the i-card office, submit a photo to the CBTF as soon as possible to avoid problems when checking in for exams. Email photos to cbtf@illinois.edu. Review all instructions on the CBTF website before your first exam: https://cbtf.illinois.edu/students About the CBTF All exams must be scheduled in advance using the CBTF scheduling system. All students should read and understand the information posted on the CBTF website. Mid-semester Review Final Exam The final exam will be two hours in length and will cover material from the whole semester. The final exam will be proctored by the CBTF. For more information see the Office of the Registrar and the CBTF. Final Exam Preparation View the practice problems on the PrairieLearn system. View the final midterm review"
