["https://courses.physics.illinois.edu/phys213/fa2024/iclicker.html"]
title = "PHYS 213 :: Physics Illinois :: University of Illinois at Urbana-Champaign"
full_description = '''PHYS 213 Fall 2024 PHYS 213 :: Physics Illinois :: University of Illinois at Urbana-Champaign I>Clicker Information Introduction Participation in the PHYS 213 lectures requires the use of I>Clickers. Using an audience response system, such as I>Clickers, improves lecturer-student interactions.Â The more you interact with your lecturer the better you will learn the material! You must: get one at the bookstore (new or used) register it in the student gradebook bring it to every lecture, including the first lecture. Registration Please register your I>Clicker in the student gradebook. Points You will receive credit for every lecture in which you participate using the I>Clicker. Participate means answering at least 75% of the questions (not necessarily correctly, though) asked in that lecture. NOTE: Although we encourage you to attend the lecture to which you are assigned (to keep the sizes balanced), you can get clicker credit at any of the lectures on a given day. However, each student can get credit for only one lecture per day. (This means that you should NOT share your clicker with another student registered for the same course -- only ONE student will get the credit.) The awarded points will show up in the gradebook approximately at the end of each week. How do I know if the system registered my answer? There are two different versions of the I>Clicker: Version 1 (no LCD) will have a solid green light appear next to status when the system has successfully logged your answer. Version 2 (with LCD) will have a checkmark appear in the screen when the system has successfully logged your answer. Batteries The batteries should easily last the entire semester. In any event, if they are starting to go, the clicker will flash, letting you know; you should still have enough power for another few lectures after that, i.e., there's no good excuse for not getting new batteries. FAQs Q: I have purchased and registered an I>Clicker for Psych 100. Can I use it in this class also? A: You can use any kind of I>Clicker in this class, old or new. Q: How can I register my I>Clicker for this class? A: You can register it in your course gradebook. Q: My clicker always says "NO BASE" when I try to send a vote. What can I do? A: Make sure your frequency is set to the frequency announced by your lecturer at the beginning of class. Q: Do I have to change the frequency of the I>Clicker? A: Your lecturer will announce the frequency used in the lecture hall.Â Make sure your I>Clicker is set to the frequency announced by your lecturer. Q: How can I tell if my I>Clicker is working? A: If a green light flashes on the models without the LCD screen, or if you see a check-mark on the LCD screen, then you can be sure that your vote was counted. If you don't see this you may be on the wrong frequency, or you may just need to vote again.'''
