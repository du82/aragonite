 @media screen and (min-width: 768px) { .b-114471281-top { padding-top: 60px; } .b-114471281-bottom { padding-bottom: 60px; } } Course DescriptionThis course teaches privilege escalation in Windows, from basics such as how permissions work, to in-depth coverage and demonstrations of actual privilege escalation techniques. The course comes with a full set of slides (150+), and a script which can be used by students to create an intentionally vulnerable Windows 10 configuration to practice their own privilege escalation skills on. This is a 100% privilege escalation course, with absolutely no filler!Please note that this course is aimed at students currently taking, or planning to take the OSCP, and thus covers more common forms of privilege escalation. Some extra methods are included, and more methods may be added in the future, however this course was not designed to cover every possible (or obscure) method.What will I learn? Multiple methods for escalating privileges on a Windows system. In depth explanations of why and how these methods work. Tools which can help identify potential privilege escalation vulnerabilities on a Windows system. A setup script you can run on a (free) trial version of Windows 10, creating an intentionally vulnerable VM to practice privilege escalation on. Requirements A basic understanding of Windows systems. A familiarity with hacking tools such as Kali Linux and metasploit / msfvenom. .b-114471282-top { padding-top: 16.8px; } .b-114471282-bottom { padding-bottom: 16.8px; } .b-114471282-content_width { width: 710px; } .b-114471282-background_color { background-color: #FFFFFF; } .b-114471282-heading_text_color { color: #36414D; } .b-114471282-lecture_name_background_color { background-color: #F9FAFD; } .b-114471282-section_name_background_color { background-color: #EFEFF5; } @media screen and (min-width: 768px) { .b-114471282-top { padding-top: 30px; } .b-114471282-bottom { padding-bottom: 30px; } } .block__curriculum__section__title.b-11