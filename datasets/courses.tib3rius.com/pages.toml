title = "Windows Privilege Escalation for OSCP & Beyond! | Tib3rius Institute"
description = "Finding and exploiting Windows vulnerabilities and misconfigurations to gain an administrator shell."
full_description = '.b-114471280-top { padding-top: 16.8px; } .b-114471280-bottom { padding-bottom: 16.8px; } .b-114471280-alignment { text-align: center; } .b-114471280-content_width { max-width: 668px; } .b-114471280-image_overlay { opacity: 0.5; } .b-114471280-background_color { background-color: #000; } .b-114471280-heading_text_color { color: #FFFFFF; } .b-114471280-button_border_radius { border-radius: 25px; } .b-114471280-subheading_text_color { color: #FFFFFF; } .banner .b-114471280-heading_text_color { color: #FFFFFF } .banner .b-114471280-subheading_text_color { color: #FFFFFF } .banner__button.b-114471280-button_border_radius { border-radius: 25; } @media screen and (min-width: 768px) { .b-114471280-top { padding-top: 30px; } .b-114471280-bottom { padding-bottom: 30px; } } .bl { width: 100%; } Windows Privilege Escalation for OSCP & Beyond! Finding and exploiting Windows vulnerabilities and misconfigurations to gain an administrator shell. Enroll Now! .b-114471281-top { padding-top: 33.6px; } .b-114471281-bottom { padding-bottom: 33.6px; } .b-114471281-text_color { color: #36414D; } .b-114471281-content_width { max-width: 590px; } .b-114471281-background_color { background-color: #F5F5F8; } .b-114471281-heading_text_color { color: #36414D; } .block__text .b-114471281-text_color { color: #36414D } .block__text .b-114471281-content_width { width: 590px; } .block__text .b-114471281-heading_text_color h1, .block__text .b-114471281-heading_text_color h2, .block__text .b-114471281-heading_text_color h3, .block__text .b-114471281-heading_text_color h4, .block__text .b-114471281-heading_text_color h5, .block__text .b-114471281-heading_text_color h6 { color: #36414D } .block__text .block__text-wrapper h2{ margin-bottom: 2px; } .block__text .block__text-wrapper h3{ margin-bottom: 5px; } .block__text .block__text-wrapper h4{ margin-bottom: 9px; } .block__text .block__text-wrapper h5{ margin-bottom: 11px; } .block__text .block__text-wrapper h6{ margin-bottom: 14px; } @media screen and (min-width: 768px) { .b-114471281-top { padding-top: 60px; } .b-114471281-bottom { padding-bottom: 60px; } } Course DescriptionThis course teaches privilege escalation in Windows, from basics such as how permissions work, to in-depth coverage and demonstrations of actual privilege escalation techniques. The course comes with a full set of slides (150+), and a script which can be used by students to create an intentionally vulnerable Windows 10 configuration to practice their own privilege escalation skills on. This is a 100% privilege escalation course, with absolutely no filler!Please note that this course is aimed at students currently taking, or planning to take the OSCP, and thus covers more common forms of privilege escalation. Some extra methods are included, and more methods may be added in the future, however this course was not designed to cover every possible (or obscure) method.What will I learn? Multiple methods for escalating privileges on a Windows system. In depth explanations of why and how these methods work. Tools which can help identify potential privilege escalation vulnerabilities on a Windows system. A setup script you can run on a (free) trial version of Windows 10, creating an intentionally vulnerable VM to practice privilege escalation on. Requirements A basic understanding of Windows systems. A familiarity with hacking tools such as Kali Linux and metasploit / msfvenom. .b-114471282-top { padding-top: 16.8px; } .b-114471282-bottom { padding-bottom: 16.8px; } .b-114471282-content_width { width: 710px; } .b-114471282-background_color { background-color: #FFFFFF; } .b-114471282-heading_text_color { color: #36414D; } .b-114471282-lecture_name_background_color { background-color: #F9FAFD; } .b-114471282-section_name_background_color { background-color: #EFEFF5; } @media screen and (min-width: 768px) { .b-114471282-top { padding-top: 30px; } .b-114471282-bottom { padding-bottom: 30px; } } .block__curriculum__section__title.b-11