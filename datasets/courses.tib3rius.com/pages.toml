ion information but doing so may prevent them from engaging in certain School related activities.How we use collected informationThe School may collect and use Students’ personal identification information for the following purposes: To improve customer serviceInformation you provide helps us respond to your customer service requests and support needs more efficiently. To personalize user experienceWe may use information in the aggregate to understand how our Students as a group use the services and resources provided in our School. To send periodic emailsWe may use Student email addresses to send Students information and updates pertaining to their order. Student email addresses may also be used to respond to Student inquiries, questions, or other requests. Sharing your personal informationWe do not sell, trade, or rent Student personal identification information to others.Third party websitesStudent may find advertising or other content in our School that link to the websites and services of our partners, suppliers, advertisers, sponsors, licensors and other third parties. We do not control the content or links that appear on these websites and are not responsible for the practices employed by websites linked to or from our School. In addition, these websites or services, including their content and links, may be constantly changing. These websites and services may have their own privacy policies and customer service policies. Browsing and interaction on any other website, including websites which have a link to our Student, is subject to that website's own terms and policies.Changes to this Privacy PolicyThe School has the discretion to update this Privacy Policy at any time. We encourage Students to frequently check this page for any changes. You acknowledge and agree that it is your responsibility to review this Privacy Policy periodically and become aware of modifications.Your acceptance of these termsBy enrolling in the School, you signify your acceptance of this Privacy Policy. If you do not agree to this Privacy Policy, please do not enroll in the School. Your continued enrollment in the School following the posting of changes to this Privacy Policy will be deemed your acceptance of those changes."
