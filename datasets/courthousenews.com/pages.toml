["https://www.courthousenews.com/abuse-victims-say-mormon-bishop-neglected-duty-to-report"]
title = "Abuse victims say Mormon bishop neglected duty to report | Courthouse News Service"
description = "A three-judge panel on Arizona’s court of appeals issued a draft decision siding with the plaintiffs, finding that clergy-pertinent privilege didn’t exempt a Mormon church leader from reporting evidence of child sexual abuse."
full_description = '''TUCSON, Ariz. (CN) — Three children sexually abused by their father asked the Arizona Court of Appeals to reverse a summary judgment action clearing the children’s physician, who didn’t report the abuse because it was disclosed to him under religious confession.The children’s attorney argued Tuesday that John Herrod — bishop of a small Mormon congregation in Bisbee, Arizona — waived his clergy-pertinent privilege to keep the abuser’s confession confidential when he told the children’s mother about the abuse. The plaintiffs asked the court to reverse a lower ruling that says Herrod never waived that privilege. Paul Adams sexually abused all six of his children for at least seven years until his arrest, confession and subsequent suicide in 2017. He regularly raped Jane Doe 1, now 15, when she was as young as six years old and posted videos to the internet, which eventually led to his demise.In 2021, three of Adams’ children sued the church, formally known as the Church of Jesus Christ of Latter-day Saints, claiming that clergy members knew of the extent of the abuse for years but never reported it for fear of tainting the church’s reputation. Roped in as defendants are John Herrod; his wife, Sherrie Farnsworth Herrod; and their company, Lezner Medical Services, through which John Herrod served as the Adams family physician.Herrod said in a declaration to the court that Adams disclosed his regular sexual abuse of Jane Doe 1 in a formal confession sometime between 2010 and 2011. Because of the religious context of the disclosure, Herrod was advised by church leaders in Salt Lake City not to report the abuse to legal authorities. Instead, he invited Adams and his wife, Leizza Adams, back to his office the next day, demanded that Adams tell her what he was doing and insisted that she report him to the police.Adams confessed — but his wife did nothing about it — and later pleaded guilty to two counts of child abuse. John Trebon, representing the plaintiffs, told a three-judge panel Tuesday afternoon that Herrod waived his clergy privilege the moment he discussed the confession with Leizza Adams.“There’s no expectation of privacy,” Trebon said. “The privilege is waived the first day after the confession. If there’s no privilege, there is automatically a duty to report.”Leizza Adams said in her deposition that she never took that conversation to be confidential, and Herrod declined to discuss it further in his. Trebon argued that Paul Adams couldn't have assumed the conversation to be private given that he willingly shared details of the abuse with his wife, whom Herrod directed to notify the police of the situation. “The evidence is overwhelming that the conversation was never intended to remain in secrecy,” Trebon said.He added that posting videos of the sexual acts online serves as an “implicit waiver” of confidentiality.Representing Herrod and his medical practice, Joseph Roth pushed back on the panel’s draft decision, which sides with the plaintiffs.“We cannot let tragic facts make bad law,” Roth told the panel. “This draft decision makes bad law.”Rather than eliminate the confidentiality of the confession, Roth argued, Herrod telling Leizza Adams to report her husband only underscores it, highlighting the fact that Herrod was spiritually preempted from doing so.The question isn’t whether a right was waived, he said, but simply whether the information was taken as confidential by the clergy member.Though the discovery phase closed more than a year ago, the plaintiffs want to add to the record new depositions from their plaintiffs about their relationship with Herrod as a physician. Trial Judge Timothy Dickerson called the request “an egregious example of a late disclosure.”Roth agreed, saying Tuesday that to allow the depositions now would prejudice the case and potentially “ambush” the defendants at trial.“That cannot be what our rules stand for,” he said.The plaintiffs were only 11 years old, seven years old and six months old when the complaint was filed.“These are kids,” Trebon said. “They get old enough to recall and articulate, and now, my gosh, they can’t testify? They can’t say these things? Discovery is closed?”Trebon added that he offered depositions to the defendants during discovery, and the defendants turned them down.State Judges Christopher O'Neill, Lacey Stover Guard and Sean Brearcliffe made up the panel. It’s unclear when they will rule. Follow @JournalistJoeAZ Categories / Appeals, Courts, Regional, Religion Subscribe to Closing Arguments Sign up for new weekly newsletter Closing Arguments to get the latest about ongoing trials, major litigation and hot cases and rulings in courthouses around the U.S. and the world. window.CustomSubstackWidget = { substackUrl: "courthousenews.substack.com", placeholder: "example@gmail.com", buttonText: "Subscribe", theme: "custom", colors: { primary: "#2b3a42", input: "#FFFFFF", email: "#1F1F1F", text: "#FFFFFF", }, }; Additional Reads Farm workers group sues federal government over illegal stops, arrests February 26, 2025 Chief Justice Roberts lets US foreign aid bills go unpaid as SCOTUS considers Trump appeal February 26, 2025 Top House Republican remains noncommittal as lawmakers expand crusade against federal judges February 26, 2025 North Carolina Senate moves to penalize sanctuary cities, limit Democratic attorney general February 26, 2025'''
