["https://www.courthousenews.com/trump-ends-military-aid-to-ukraine-eu-calls-for-840b-military-boost"]
title = "Trump ends military aid to Ukraine; EU calls for $840B military boost | Courthouse News Service"
description = "U.S. President Donald Trump is pushing to force Kyiv to the negotiating table with Russia. Ukraine vowed to continue fighting, but the shutoff of American supplies is a major blow."
full_description = "(CN) — In a bid to force Kyiv to sue for peace with Moscow, U.S. President Donald Trump on Tuesday stopped the delivery of military supplies to Ukraine, a decision that threatened to leave the war-ravaged country badly vulnerable to Russia's attacks.Meanwhile, the European Union solidified its role as Ukraine's chief ally with its chief executive announcing an ambitious proposal to boost military spending across the bloc by more than $840 billion.EU leaders will discuss its historic rearmament plans at a summit Thursday focused on Ukraine and the threat from Russia. In recent days, European leaders have vowed to step up their support for Ukraine in defiance of Trump's efforts to bully Kyiv into accepting a peace deal that would likely favor Russia, a disastrous outcome in the view of many European leaders.Washington's decision to halt military supplies to Ukraine emerged over the course of Tuesday in Europe through news reports. Anonymous White House officials said it was a “pause” in the shipment of missiles, ammunition, vehicles and other equipment. However, the U.S. reportedly had not stopped providing Ukraine with battlefield intelligence.At a news briefing late Monday, Trump continued to castigate Ukrainian President Volodymyr Zelenskyy as ungrateful for the billions of dollars in U.S. military aid his country received and an impediment to ending the conflict, which is one of Trump's chief priorities. The shutoff of aid comes in the wake of a falling out between Trump and Zelenskyy on Friday during a televised meeting in the Oval Office.“I just think you should be more appreciative because this country has stuck with them through thick and thin,” Trump said.Speaking on Fox News, U.S. Vice President JD Vance said Trump set “a very clear goal” to “stop the killing” by getting Zelenskyy and Russian President Vladimir Putin “to the negotiating table.”“And that's ultimately where things broke apart,” Vance said. “I think Zelenskyy wasn't yet there, and I think, frankly, now still isn't there, but I think we'll get there eventually. He has to.”In Ukraine, the halt in American weapons was met with a mixture of despair and defiance. Ukraine has relied heavily on American weapons and intelligence to hold the front lines and go on the attack against Russian forces.Oleksandr Merezhko, the chair of the Ukrainian parliament's foreign affairs committee, called it “a disastrous decision” that benefited Putin.“Especially right now when we are in desperate need of American weaponry, American support,” he told BBC.He said it appeared Trump wanted to compel Ukraine to capitulate. “It looks like siding with Russia,” he said.With the prospect of running out of air defense missiles, he warned Ukraine would not be able to protect Kyiv and other cities from Russian bombardment.“I'm appealing to Mr. Trump not to play with these dangerous issues because we're talking about lives,” he said.Zelenskyy also faced criticism for rejecting Trump's proposals, which included signing a minerals deal that would give the U.S. a major stake in the country's natural resources. Zelenskyy rejected the deal because Trump refused to include American security guarantees in the deal.Oleksiy Goncharenko, a Ukrainian parliamentarian in an opposition party, urged Zelenskyy to reconcile with Trump.“We are completely dependent on the U.S. and we need to play with Trump, not against him,” he said on social media. “We already have enough enemies, let’s at least not lose our friends.”On Tuesday, Zelenskyy said he wanted to patch up his relationship with Trump.“Our meeting in Washington, at the White House on Friday, did not go the way it was supposed to be. It is regrettable that it happened this way. It is time to make things right,” Zelenksyy wrote on social media. “We would like future cooperation and communication to be constructive.”"
