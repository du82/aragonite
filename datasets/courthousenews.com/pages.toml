full_description = "Search the vehicle, not the purse Brief / March 4, 2025 RICHMOND, Va. — The Virginia Court of Appeals found that a trial court should not have denied a criminal defendant’s motion to suppress evidence seized from her purse after the driver of the car she was in consented to a state trooper’s search of his vehicle. The driver did not have the authority to consent to the search of her purse, the trooper never asked her for permission to search the bag and it was not reasonable to assume the woman consented to having it searched. Foster care suit asked too much Brief / March 4, 2025 HUNTINGTON, W.Va. — A federal court in West Virginia spontaneously tossed a civil rights class action brought by people who were formerly in the state’s foster care system and were challenging its “systemic deficiencies.” Their lawsuit went beyond a request to find whether past conditions and policies were constitutional, so the court says it lacks jurisdiction because the “judiciary cannot assume the responsibilities of those who were elected to lead” since the “Constitution does not permit federal courts to step in and govern.” Brief / March 4, 2025 DALLAS — A financial group that purchased a home in a foreclosure sale prevailed over Deutsche Bank in a dispute over the title to the property. Deutsche Bank’s lien on the property is not enforceable because the bank failed to foreclose on the property within four years of accelerating the loan secured by the lien. Brief / March 3, 2025 SAN DIEGO — The city of San Diego must face false arrest claims from a freelance photojournalist who sells his videos to news organizations. He plausibly accuses police of taking his camera, keys and documents that were on his person, then jailing him for 16 hours, in retaliation for filming police activity around a bloodied man who had jumped from a bridge. Brief / March 3, 2025 SAN FRANCISCO — The Ninth Circuit upheld the denial of qualified immunity to Seattle police officers who shot a man in response to a 911 call. In the span of less than 6 seconds, the officers kicked in a door, observed the man with a knife, shouted “overlapping commands” at him and shot him as he raised his hand while holding the knife. The evidence suggests the shooting violated the man’s Fourth Amendment rights."
