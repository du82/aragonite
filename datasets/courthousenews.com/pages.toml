description = "Two days after signing an executive order to ramp up and “prosecute anti-Christian violence” in the United States, President Donald McMuskPuppet cut aid to South Africa, for discriminating against white people."
full_description = 'You can’t make this stuff up.McMuskPuppet claims that self-described Christians — who comprise 72% of the population of the United States (49% Protestants, 23% Catholics) — need His special protection, though Jews, Black folks of any persuasion, Mexicans, Muslims and Arabs suffer far more violence and discrimination here every day.McMuskPuppet announced his ukase at the famous National Prayer Breakfast on Feb. 6. His bigoted and willfully ignorant document claims that “the previous [Biden] Administration engaged in an egregious pattern of targeting peaceful Christians, while ignoring violent, anti-Christian offenses.”The “peaceful Christians” are abortion opponents who blocked access to medical clinics, with threats and violence, and in at least one case, assassinated a doctor who performed abortions.President McMuskPuppet (let’s call him the Muffin) has pardoned dozens of these fanatics, who — let’s be clear about the anti-abortion movement — demand the right to interfere with other people’s families, with violence.President Muffin is a demented thug, reinstituting religious persecution, secreted and funded by his Musk gland. They are profoundly ignorant people, if ignorance can ever be profound.Here is how the Muffin presumed to talk about religious liberty in the United States: “You’ve never had that before,” he said, at the Prayer Breakfast, “but this is a very powerful document I’m signing. You got it now — first time you’ve had it.”This is the first time we’ve had religious freedom? Since 1620? Is he out of his mind?Yes.Ever heard of the Pilgrims? William Penn?Well, the Muffin hadn’t been born yet, way back when, so maybe it wasn’t the Pilgrims’ fault that the Muffin couldn’t save us then, from people like him.Or was it? O yeah, let’s blame the Pilgrims!As Al Smith — the first Catholic candidate for U.S. president — said in 1928, “Let’s look at the record.”So let’s see what the Bible says, and that guy Jesus said, and what our own spiteful sex molester and his flunkies tell us, seeking revenge for what they never suffered, and never will.Suffering? What is that?Now, as they told us in middle school, let’s “compare and contrast."Hebrews 13:1-3:Do not neglect to show hospitality to strangers, for by doing that some have entertained angels without knowing it. Remember those who are in prison, as though you were in prison with them; those who are being tortured, as though you yourselves were being tortured.Zechariah 7:9-10:Thus says the Lord of hosts: Render true judgments, show kindness and mercy to one another; do not oppress the widow, the orphan, the alien, or the poor; and do not devise evil in your hearts against one another.Matthew 19:24:Again I tell you, it is easier for a camel to go through the eye of a needle than for someone who is rich to enter the kingdom of God.Yet Our Slimy Muffin’s personal pastor, Paula White, a Florida televangelist, preaches a “prosperity gospel,” which claims that piling up money in this life will earn you valuable points in Heaven!And speaking of money, Vice President Jimmy D. Vance — a breast-beating pseudo-Catholic — accused the U.S. Conference of Catholic Bishops last week of comforting and helping “illegal immigrants” — not because of the bishops’ religious faith, or for doing what Jesus preached, but “to get federal funding.”(But The Washington Post reported on Monday that Catholic groups spend more money on immigrant services than they receive from the federal government, according to an annual financial audit.)So, in this internet age, let’s dial up Jesus, and Matthew 25:35:I was hungry and you gave me food, I was thirsty and you gave me drink, I was a stranger and you welcomed me.Imagine the impudence of that guy, Jesus. I bet he was a migrant hisself. Prob’ly illegitimate, too. Who was his daddy? Yeah, right. And where did he and his daddy come from? You know how those Jews live, in their ghettos. Coulda been anyone. You know how those Jewish girls are.Now let’s see what the Old Testament says, in Leviticus 19:34:The alien who resides with you shall be to you as the citizen among you; you shall love the alien as yourself, for you were aliens in the land of Egypt: I am the Lord your God.And as McMusk and his Puppet Muffin and their unelected, ignorant flunkies inflict untold harm upon the sick, the motherless, the poor, the lost and harmless, in our country and around the world, let us recall the words of Jesus, in Matthew 25:40:Truly I say to you, as you did it to one of the least of my brethren you did it to me.Now, as The Richest Man in the World whispers sweeping plans of revenge (for what?) into his puppet’s ears — begging him to spare white South Africans — may we recall, or even utter, Jesus’s words, in Matthew 5:43-44:You have heard that it was said, ‘you shall love your neighbor and hate your enemy.’ But I say to you, love your enemy and pray for those who persecute you.Pray for who, for what? As if Muffin and his overlord ever sought anything but money and power.Finally, let us consider Psalm 146:9:The Lord watches over the strangers; he upholds the orphan and the widow, but the way of the wicked he brings to ruin.Well, the Lord better get busier upholding the orphan and the widow, and a bit quicker bringing the wicked to ruin, if you ask me, in these United States.Christians? The Republican Party got a lot of gall to call itself Christian.Compare and contrast.(Bible citations are from the New Revised Standard Version.) Categories / Op-Ed Subscribe to our columns Want new op-eds sent directly to your inbox? Subscribe below! Please enable JavaScript in your browser to complete this form.Email *AuthorSubmit Additional Reads Arrest me February 28, 2025 Death of American good works February 25, 2025 Cake war February 24, 2025 Why report? Just decide February 21, 2025'
