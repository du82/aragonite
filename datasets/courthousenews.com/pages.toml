full_description = "Seattle cops on the hook after shooting Brief / March 3, 2025 SAN FRANCISCO — The Ninth Circuit upheld the denial of qualified immunity to Seattle police officers who shot a man in response to a 911 call. In the span of less than 6 seconds, the officers kicked in a door, observed the man with a knife, shouted “overlapping commands” at him and shot him as he raised his hand while holding the knife. The evidence suggests the shooting violated the man’s Fourth Amendment rights. Cop’s immunity partially reversed Brief / February 26, 2025 NEW ORLEANS — The Fifth Circuit upheld a Texas federal court’s denial of qualified immunity to former cop Aaron Dean, who shot and killed Atatiana Jefferson in her home within seconds of encountering her and without first identifying himself as police, on her family’s excessive force claim. The lower court also denied him immunity on the family’s unreasonable search claim, but the appellate panel reverses, seeing no case law establishing that Dean’s perimeter sweep of the house was objectively unreasonable. Brief / February 24, 2025 HARRISON, Ark. — An Arkansas federal court did not award summary judgment to a sheriff’s deputy who was sued by a motorist, arrested for a misdemeanor, for her deliberate indifference to his medical needs. The driver was arrested on traffic charges and then kept from being able to empty the feces from his internal ileostomy pouch; as a result of damage to the pouch, he was permanently catheterized. The deputy was laughing about the man vomiting in his cell, but “chose to do nothing,” wrote the court. Caitlyn Rosen / February 24, 2025 Robert Crimo III faces over 100 criminal charges in connection to a 2022 Fourth of July parade shooting that killed seven people and injured dozens more in Illinois. Brief / February 21, 2025 BOSTON — The First Circuit held that a high school principal, who involved himself in a girl’s troubled home life before beginning to inquire about her sex and dating life and calling her “cupcake” and “too hot for [her] own good,” must face civil rights claims for sexually harassing the girl even though, as he argues, the harassment was not physical. The right to be free of non-physical harassment is a clearly established constitutional right, so he cannot claim qualified immunity in response to her lawsuit."
