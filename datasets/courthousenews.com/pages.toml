["https://www.courthousenews.com/arab-leaders-endorse-egypts-plan-to-rebuild-gaza-as-an-alternative-to-trumps-proposal"]
title = "Arab leaders endorse Egypt’s plan to rebuild Gaza as an alternative to Trump’s proposal | Courthouse News Service"
description = "The White House welcomed input from Arab nations, but insisted Hamas could not remain in power in the territory."
full_description = '''CAIRO (AP) — Arab leaders on Tuesday endorsed Egypt's postwar plan for the Gaza Strip that would allow its roughly 2 million Palestinians to remain, in a counterproposal to U.S. President Donald Trump’s plan to depopulate the territory and redevelop it as a beach destination.The $53 billion plan's endorsement by Arab leaders at a summit in Cairo amounted to a rejection of Trump’s proposal. The summit conclusions were welcomed by Hamas, rejected by Israel and given a lukewarm response by the Trump administration.Egyptian President Abdel Fattah el-Sissi expressed his appreciation for “the consensus among the Arab countries to support the reconstruction plan for the Gaza Strip, which allows the Palestinian People to stay on their land without displacement.”In a social media post after the summit, el-Sisi said: “We welcome any proposals or ideas from the international community to ensure the success of this plan, which needs to be implemented side by side with a greater plan for peace." He added that he looked forward to working with Trump, other Arab nations and the international community “to adopt a plan that aims for a comprehensive and just settlement of the Palestinian Issue, ends the root causes of the Israeli Palestinian conflict, guarantees the security and stability of the peoples of the region and establishes the Palestinian State."Initial reactions The White House welcomed input from Arab nations, but insisted Hamas could not remain in power in the territory.“President Trump has been clear that Hamas cannot continue to govern Gaza,” White House National Security Council spokesman Brian Hughes said. “While the President stands by his bold vision for a post-war Gaza, he welcomes input from our Arab partners in the region. It’s clear his proposals have driven the region to come to the table rather than allow this issue to devolve into further crisis.”A spokesperson for Israel's foreign ministry, Oren Marmorstein, said in a post on X that the Egyptian plan “fails to address the realities of the situation" and said the summit's joint communique does not mention Hamas' Oct. 7, 2023 attack that sparked the war or condemn the militant group. The plan, he said, remains “rooted in outdated perspectives."Marmorstein reiterated Israel’s support for Trump’s plan to resettle Gaza's population elsewhere, describing it as “an opportunity for the Gazans to have free choice based on their free will."Hamas welcomed the summit’s outcome, saying it marked a new phase of Arab and Islamic alignment with the Palestinian cause and that it valued Arab leaders’ rejection of attempts to transfer Palestinians from their territories in Gaza and the occupied West Bank.Israel has embraced what it says is an alternative U.S. proposal for the ceasefire itself and the release of hostages taken in Hamas' attack on southern Israel on Oct. 7, 2023, which triggered the war. Israel has blocked the entry of food, fuel, medicine and other supplies to Gaza to try to get Hamas to accept the new proposal and has warned of additional consequences, raising fears of a return to fighting.The suspension of aid drew widespread criticism, with human rights groups saying that it violated Israel's obligations as an occupying power under international law.The alternative proposal would require Hamas to release half its remaining hostages — the militant group’s main bargaining chip — in exchange for a ceasefire extension and a promise to negotiate a lasting truce. Israel made no mention of releasing more Palestinian prisoners — a key component of the first phase.Egypt’s postwar plan Egypt’s plan foresees rebuilding Gaza by 2030 without removing its population. The first phase calls for starting the removal of unexploded ordnance and clearing more than 50 million tons of rubble left by Israel’s bombardment and military offensives.'''
