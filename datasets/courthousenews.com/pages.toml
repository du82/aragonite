["https://www.courthousenews.com/sidebar-season-five-episode-3-post-conviction-purgatory"]
title = "Sidebar: Post-conviction purgatory | Courthouse News Service"
description = "Since 1973, 4% of death row inmates are now exonerees, but that doesn’t tell you anything about how many people with misdemeanors or drug charges might have also faced wrongful convictions."
full_description = 'It took decades for death row inmate Richard Glossip to convince Oklahomans and, later, the U.S. Supreme Court that he deserved a new trial. Glossip is just one of many inmates who say they faced convictions for crimes they did not commit. Read about enough of these cases, and you’ll be asking, “Is innocence enough?” For the wrongfully convicted, tearful reunions and proclamations of justice from the courthouse steps only come after an arduous exoneration process paved with years of litigation. The average person wrongfully convicted loses a decade of their life behind bars, learning the legal system and advocating for their innocence. As the number of exonerations rises annually, there is still no way to track how many people have suffered unjust convictions.In the third episode of our fifth season, we journey through the highs and lows of post-conviction purgatory for people claiming innocence, from one Oklahoma man’s hand-written petitions to a New York man who waited nearly two decades for evidence to emerge for a lawyer to take his case. Special guests: Andrea Miller, legal director of the Oklahoma Innocence Project Maurice Possley, researcher at the National Registry of Exonerations Justin Brooks, co-founder of the California Innocence Project Laneshia Jordan, Texas attorney Jeffrey Deskovic, exoneree and attorney Michael Grant, exoneree and assistant director of The Liberation Foundation Retired U.S. Magistrate Judge Kristen Mix Carl Wyatt, Oklahoma inmate asserting innocence Sidebar tackles the top stories you need to know from the legal world. Join reporters Hillel Aron, Kirk McDaniel, Amanda Pampuro, Kelsey Reichmann and Josh Russell as they take you in and out of courtrooms in the U.S. and beyond and break down developments to help you understand how they affect your day-to-day life.This episode was produced by Kirk McDaniel. Intro music by The Dead Pens. A transcript will be available later this week.Editorial staff is Ryan Abbott, Sean Duffy and Jamie Ross.More death row appeals: Supreme Court resurrects Oklahoma woman’s claim that sex-shaming landed her on death row Texas AG files to block testimony on eve of death row inmate’s appearance before state House North Carolina inmate fights to get off death row in case that could affect death penalty statewide Categories / Appeals, Criminal, Podcast Subscribe to Closing Arguments Sign up for new weekly newsletter Closing Arguments to get the latest about ongoing trials, major litigation and hot cases and rulings in courthouses around the U.S. and the world. window.CustomSubstackWidget = { substackUrl: "courthousenews.substack.com", placeholder: "example@gmail.com", buttonText: "Subscribe", theme: "custom", colors: { primary: "#2b3a42", input: "#FFFFFF", email: "#1F1F1F", text: "#FFFFFF", }, }; Additional Reads 10th Circuit blows off environmentalist concerns over Colorado air cleanup plan March 4, 2025 Arizona’s out-of-state wine restrictions don’t discriminate, Ninth Circuit says March 4, 2025 Justices dump cold water on Mexico push to pin cartel violence on US gunmakers March 4, 2025 Supreme Court deals blow to wastewater regulations, nixing generic restrictions on discharge permits March 4, 2025'
