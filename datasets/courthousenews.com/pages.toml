title = "Search the vehicle, not the purse | Courthouse News Service"
description = "RICHMOND, Va. — The Virginia Court of Appeals found that a trial court should not have denied a criminal defendant’s motion to suppress evidence seized from her purse after the driver of the car she was in consented to a state trooper’s search of his vehicle. The driver did not have the authority to consent to the search of her purse, the trooper never asked her for permission to search the bag and it was not reasonable to assume the woman consented to having it searched."
