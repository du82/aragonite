["https://www.courthousenews.com/as-warming-climate-hammers-coffee-crops-this-rare-bean-may-someday-be-your-brew"]
title = "As warming climate hammers coffee crops, this rare bean may someday be your brew | Courthouse News Service"
description = "Excelsa's deep roots, thick leathery leaves and big trunk allow it to thrive in extreme conditions, where other coffees cannot. It’s also resistant to many common pests and diseases."
full_description = "NZARA COUNTY, South Sudan (AP) — Catherine Bashiama runs her fingers along the branches of the coffee tree she's raised from a seedling, searching anxiously for its first fruit buds since she planted it three years ago. When she grasps the small cherries, Bashiama beams.The farmer had never grown coffee in her village in western South Sudan, but now hopes a rare, climate-resistant species will help pull her family from poverty. “I want to send my children to school so they can be the future generation,” said Bashiama, a mother of 12.Discovered more than a century ago in South Sudan, excelsa coffee is exciting cash-strapped locals and drawing interest from the international community amid a global coffee crisis caused mainly by climate change. As leading coffee-producing countries struggle to grow crops in drier, less reliable weather, prices have soared to the highest in decades and the industry is scrambling for solutions. Experts say estimates from drought-stricken Brazil, the world’s top coffee grower, are that this year’s harvest could be down by some 12%.“What history shows us is that sometimes the world doesn’t give you a choice, and right now there are many coffee farmers suffering from climate change that are facing this predicament,” said Aaron Davis, head of coffee research at the Royal Botanic Gardens, Kew, in London. Davis and his team have been researching excelsa for almost a decade, and work with excelsa producers in several counties, notably Uganda.Excelsa could play a key role in adapting.Native to South Sudan and a handful of other African countries, including Congo, Central African Republic and Uganda, excelsa is also farmed in India, Indonesia and Vietnam. The tree's deep roots, thick leathery leaves and big trunk allow it to thrive in extreme conditions such as drought and heat where other coffees cannot. It’s also resistant to many common coffee pests and diseases.Yet it comprises less than 1% of the global market, well behind the arabica and robusta species that are the most consumed coffees in the world. Experts say excelsa will have to be shown to be practical at a much larger scale to bridge the gap in the market caused by climate change. For now, it’s mostly only available for purchase online.Coffee’s history in South Sudan Unlike neighboring Ethiopia or Uganda, oil-rich South Sudan has never been known as a coffee-producing nation.Its British colonizers grew robusta and arabica, but much of that stopped during decades of conflict that forced people from their homes and made it hard to farm. Coffee trees require regular care such as pruning and weeding and take at least three years to yield fruit.During a visit earlier this month to Nzara County in Western Equatoria state — regarded as the country's breadbasket — residents reminisced to Associated Press reporters about their parents and grandparents growing coffee, yet much of the younger generation hadn't done it themselves.Many were familiar with excelsa, but didn’t realize how unique it was, or what it was called, referring to it as the big tree, typically taller than the arabica and robusta species that are usually pruned to be bush- or hedge-like. The excelsa trees can reach 15 meters (about 49 feet) in height, but may also be pruned much shorter for ease of harvesting.Coffee made from excelsa tastes sweet — unlike robusta — with notes of chocolate, dark fruits and hazelnut. It’s more similar to arabica, but generally less bitter and may have less body.“There’s so little known about this coffee, that we feel at the forefront to trying to unravel it and we’re learning every day,” said Ian Paterson, managing director of Equatoria Teak, a sustainable agro-forestry company that’s been operating in the country for more than a decade."
