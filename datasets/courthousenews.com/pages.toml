full_description = "Brief / February 28, 2025 CHICAGO — The Seventh Circuit ruled that it is too early to weigh in on former Illinois State University football coach Kurt Beathard’s lawsuit claiming he was fired for removing a Black Lives Matter poster from his door and replacing it with a handwritten note that read, “All Lives Matter to Our Lord & Savior Jesus Christ.” Because the lower court has not yet addressed whether head coach Brock Spack and a former university athletic director are entitled to qualified immunity, their appeal of the court’s decision to deny dismissal can’t yet be heard. Brief / February 28, 2025 DENVER — A federal judge ordered the man charged with carrying out the 2015 Planned Parenthood shooting in Colorado Springs, which left three people dead and another nine injured, to be given antipsychotic medications “involuntarily and forcibly, if necessary.” Criminal proceedings against Robert Dear, 66, stalled after he was repeatedly declared mentally incompetent to stand trial and refused to take medication. The latest ruling by U.S. District Judge Robert Blackburn comes days after the U.S. Supreme Court declined to hear Dear’s case. Brief / February 27, 2025 CINCINNATI — Former telehealth company CEO Samuel Johnson, who was fired after a video showing him confronting a gay teenage boy who was going to the prom in a dress went viral, can’t sue one of the company’s customers, University Hospitals, for allegedly pressuring the company to fire him, the Sixth Circuit ruled. Even if University Hospitals did threaten the company, its motive for protecting its business from public criticism was not improper. Johnson’s separate case against comedian Kathy Griffin for posting the video to her social media remains pending."
