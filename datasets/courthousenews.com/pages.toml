["https://www.courthousenews.com/sidebar-season-four-episode-11-constitutional-woodchipper-the-scotus-preview"]
title = "Sidebar: Constitutional woodchipper — the SCOTUS preview | Courthouse News Service"
description = "The U.S. Supreme Court is back in action with an upcoming session that looks at an infamous death penalty case, Tennessee's transgender health care ban and how the Biden administration wants to address the ghost gun crisis."
full_description = '''It's October, so you know what that means … spooky season is finally here! And with it, the Supreme Court is back in session, complete with ghosts of the gun variety.In this year's SCOTUS preview, we bring you the cases you need to know. The court will weigh in on a Biden administration rule to redefine firearms to address the public safety risk of ghost guns in America. We delve into the complexities and legal arguments that ignited a heated debate with gun manufacturers and the NRA over what truly constitutes a firearm.The court will also hear about the death penalty case of Richard Glossip, who has faced the specter of execution nine times for a crime he claims he didn't commit. From the dubious testimony of the actual murderer to the systemic failures that have kept Glossip on death row, the case has led even unlikely proponents to question the mechanics of our justice system.And we tackle Tennessee's controversial SB1 law, which bans gender-affirming care for transgender minors. This controversial legislation pits the state's focus on the experimental nature of such treatments against the medical community's endorsement of their necessity. This legal battle doesn't just impact Tennessee; it could reshape the landscape for transgender rights nationwide. Special guests: Don Knight, Richard Glossip’s attorney Robert Dunham, director at the Death Penalty Policy Project and special counsel at Phillips Black Oklahoma state Representative Justin Humphrey Sasha Buchert, director of the Non-Binary and Transgender Rights Project at Lambda Legal Eric Tirschwell, executive director of Everytown Law Cody Wilson, director of Defense Distributed Kevin Tobia, a professor of law and philosophy at Georgetown Erin Erhardt, litigation counsel at the National Rifle Association Sidebar tackles the top stories you need to know from the legal world. Join reporters Hillel Aron, Kirk McDaniel, Amanda Pampuro and Kelsey Reichmann as they take you in and out of courtrooms in the U.S. and beyond and break down developments to help you understand how they affect your day-to-day life.This episode was produced by Kirk McDaniel. Intro music by The Dead Pens. A transcript is available.Editorial staff is Bill Dotinga, Sean Duffy and Jamie Ross.For more Supreme Court in the news: Supreme Court’s 2024 term puts a finger on the scale for the next president Supreme Court keeps federal horse racing law on books, for now Supreme Court keeps lock on Biden’s student loan repayment plan Categories / Civil Rights, Courts, Podcast Subscribe to Closing Arguments Sign up for new weekly newsletter Closing Arguments to get the latest about ongoing trials, major litigation and hot cases and rulings in courthouses around the U.S. and the world. window.CustomSubstackWidget = { substackUrl: "courthousenews.substack.com", placeholder: "example@gmail.com", buttonText: "Subscribe", theme: "custom", colors: { primary: "#2b3a42", input: "#FFFFFF", email: "#1F1F1F", text: "#FFFFFF", }, }; Additional Reads Contractors urge Supreme Court to hold Trump accountable after he cuts off foreign aid February 28, 2025 Judge quashes Blake Lively’s ‘overly intrusive’ subpoenas of Justin Baldoni phone records February 28, 2025 Nuclear waste debacle at SCOTUS could blow up congressionally mandated review February 28, 2025 ‘Bucky’ creator testifies about his shock seeing Disney’s ‘Moana’ in theater February 27, 2025'''
