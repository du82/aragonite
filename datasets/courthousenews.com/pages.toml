["https://www.courthousenews.com/author/gicontributor"]
title = "Courthouse News Service | Probably the best news site in the world"
description = "Live news, opinions, and photo coverage by the journalists of Courthouse News. Subscribe to stay informed of breaking legal news from federal and state courts across the US and around the world."
full_description = '''Supreme Court frees up foreign aid in blow to Trump Supreme Court clips EPA wings on rules for wastewater release Continuing the rout of the EPA's authority undertaken by the Trump Administration, the Supreme Court overturned rules limiting the discharge of wastewater into harbors and coastal zones of America. Scientists detect higher microplastic levels in brains linked to dementia Researchers say human brains contain approximately a spoonful of microplastics, with higher levels in those with dementia. Dems protest and Republicans exalt Trump during president’s first joint address to Congress Closing Arguments A roundup of our top stories, delivered Fridays to your inbox. Subscribe for free here! Justices dump cold water on Mexico push to pin cartel violence on US gunmakers Column Whose democracy is rotting Underneath the daily sturm und drang in the brief life of the new administration, tectonic plates in an old alliance are shifting. And as the old world reveals its democratic core, the new world is losing it. by Bill Girdner Virginia blasted for deceit in battle with national press Virginia has set up a two-tier system of access to court records, one for officials and lawyers that is remote, and another for plebes that is not. Top News Trump ends military aid to Ukraine; EU calls for $840B military boost U.S. President Donald Trump is pushing to force Kyiv to the negotiating table with Russia. Ukraine vowed to continue fighting, but the shutoff of American supplies is a major blow. Lawmakers sound off as trade war begins Mexican and US markets feel shock of Trump trade war escalation Health officials concerned as measles outbreak in northwest Texas grows to 159 cases Texas Senate committee approves bills aimed at putting Christianity in classrooms First Circuit debates whether running water is a constitutional right 10th Circuit blows off environmentalist concerns over Colorado air cleanup plan California AI sextortion bill passes first legislative hurdle No injunction for Elon Musk in suit against OpenAI CEO Sam Altman Jay-Z files defamation suit against accuser in dropped sex assault case Panel rejects for-profit university’s efforts to dismiss whistleblower case Podcast New on Sidebar: Post-conviction purgatory Since 1973, 4% of death row inmates are now exonerees, but that doesn’t tell you anything about how many people with misdemeanors or drug charges might have also faced wrongful convictions. Arizona’s out-of-state wine restrictions don't discriminate, Ninth Circuit says Retailers that ship directly to consumers must have a physical storefront in the state, but a panel said the requirement doesn’t unfairly burden businesses based outside Arizona. Around the Nation Aid groups get second try in State Department lawsuit over refugee admissions Judge advances suit by asylum-seekers kicked out of US after giving birth Funeral home owner accused of letting bodies rot in warehouse withdraws guilty plea Judge rules Trump bid to fire employee appeals board chairman illegal North Carolina Senate cracks down on illegal immigration, phones in schools Despite apology, Hawaii mobster gets 9 years for role in crime syndicate Most Popular Contractors urge Supreme Court to hold Trump accountable after he cuts off foreign aid by Kelsey Reichmann Ninth Circuit partially backs Montana logging project in grizzly territory, faults Forest Service over road use by Monique Merrill ‘Bucky’ creator testifies about his shock seeing Disney’s ‘Moana’ in theater by Edvard Pettersson Democrats demand details from AG Bondi on Trump's directive to review gun regulations by Benjamin S. Weiss Disney goes on trial over ‘Moana’ copyright infringement claims by Edvard Pettersson Democrats challenge Trump effort to control Federal Election Commission by Ryan Knappenberger Second Circuit eradicates Amish fight over NY school vaccination mandate by Nick Rummell From the Walt Girdner Studio Rulings & Quick Hits Foster care suit asked too much A federal court in West Virginia spontaneously tossed a civil rights class action brought by people who were formerly in the state’s foster care system and were challenging its “systemic deficiencies.” Their lawsuit went beyond a request to find whether past conditions and policies were constitutional, so the court says it lacks jurisdiction because the “judiciary cannot assume the responsibilities of those who were elected to lead” since the “Constitution does not permit federal courts to step in and govern.” Anti-DEI executive order stays on pause President Donald Trump and other government officials’ motion to stay a preliminary injunction barring an anti-DEI executive order failed in a Maryland federal court. The executive order, which told agencies to terminate "equity-related grants" and contracts, plausibly constitutes viewpoint- and content-based regulation of speech, so they might violate the First and Fifth Amendments. Since the government’s appeal is unlikely to succeed, the injunction is upheld. Search the vehicle, not the purse The Virginia Court of Appeals found that a trial court should not have denied a criminal defendant’s motion to suppress evidence seized from her purse after the driver of the car she was in consented to a state trooper’s search of his vehicle. The driver did not have the authority to consent to the search of her purse, the trooper never asked her for permission to search the bag and it was not reasonable to assume the woman consented to having it searched. Too slow to foreclose A financial group that purchased a home in a foreclosure sale prevailed over Deutsche Bank in a dispute over the title to the property. Deutsche Bank’s lien on the property is not enforceable because the bank failed to foreclose on the property within four years of accelerating the loan secured by the lien. Freelancer’s false arrest The city of San Diego must face false arrest claims from a freelance photojournalist who sells his videos to news organizations. He plausibly accuses police of taking his camera, keys and documents that were on his person, then jailing him for 16 hours, in retaliation for filming police activity around a bloodied man who had jumped from a bridge. Eurozone inflation The inflation rate in the 20-state euro area ticked down a tenth of a point in February to 2.4%, Eurostat reported Monday. Texans star sues for assault Football star Stefon Diggs says a reality TV personality assaulted him, lied to doctors that Diggs assaulted her and then teamed up with a friend to try to extort him for $1 million. Save the sand-verbena moth A species of moth found in sand dunes along the Salish Sea in Washington state and British Columbia deserves listing as an endangered or threatened species under the Endangered Species Act. Delivery app discord Uber accuses DoorDash of unfair competition by forcing restaurants into exclusive contracts for first-party delivery and threatening penalties if restaurants contract with Uber or other delivery app competitors. More News Serbia opposition disrupts parliament with flares, smoke to support protests Calls grow in Germany to revive compulsory military service Writing on the wall as Chinese businesses fret over US trade war Chameleon phones and smart contact lenses: The gadgets of Mobile World Congress 2025 Arab leaders endorse Egypt’s plan to rebuild Gaza as an alternative to Trump’s proposal 12 killed, 30 wounded in Pakistan military base attack launched by suicide bombers BlackRock strikes deal to bring ports on both sides of Panama Canal under American control Demonstrators across 50 states look to unify a disparate opposition to Trump and his sweeping agenda ACC, Clemson, Florida State approve settlement to end legal fight, change revenue-distribution model Scientists genetically engineer mice with thick hair like the extinct woolly mammoth Peru’s Indigenous leaders raise concerns over oil and gas projects at a human rights hearing Groceries around the country remain expensive. That’s why more states want to stop taxing them Places Traffic jam in Mumbai, India, September 2010. (Adam Angione/Courthouse News)'''
