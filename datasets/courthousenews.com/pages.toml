["https://www.courthousenews.com/sidebar-season-four-episode-10-election-undercard-2024"]
title = "Sidebar: Election undercard 2024 | Courthouse News Service"
description = "Right-wing voter roll challenges and ACLU signature curing complaints are influencing how people think about voting and foreshadowing the post-election litigation to come in November and beyond."
full_description = 'Zombie voters. Sham elections. Voter fraud.In the months leading up to the 2024 presidential election, election lawsuits are flooding courts across the U.S., with the timing of some geared more toward grabbing headlines than achieving legal resolutions. Allegations aren’t considered true until a judge’s final order, but that doesn’t stop people from believing them.In our 10th episode this season, we uncover the raw truths behind the politicized world of election integrity starting in Grand Junction, Colorado, where a 2021 municipal election became a flashpoint for ideological battles and unfounded claims of voter fraud leading to the intricate legal quagmire surrounding Tina Peters, a former Colorado election official embroiled in controversy.From there, we zero in on the world of pre-election litigation and voter registration errors in legal battles raging across states like Arizona, Ohio and Pennsylvania, touching on the delicate balance between security and transparency. Special guests: Attorney Bruce L. Castor Jr. Bobbie Gross, clerk and recorder for Mesa County, Colo. Abe Herman, mayor of Grand Junction, Colo. Marly Hornik, chief executive officer of United Sovereign Americans Leah Tulin, senior counsel at the Brennan Center for Justice’s Democracy Program Witold “Vic” Walczak, legal director of the ACLU of Pennsylvania Sidebar tackles the top stories you need to know from the legal world. Join reporters Hillel Aron, Kirk McDaniel, Amanda Pampuro and Kelsey Reichmann as they take you in and out of courtrooms in the U.S. and beyond and break down developments to help you understand how they affect your day-to-day life.This episode was produced by Kirk McDaniel. Intro music by The Dead Pens. A transcript is available.Editorial staff is Bill Dotinga, Sean Duffy and Jamie Ross. A special thanks to Joe Duhownik.For more election-related lawsuits in the news: Judge skeptical of Robert F. Kennedy Jr. election interference suit against Meta State appeals court overturns 2022 election results in tiny Texas county Nebraska election officials sued for blocking voter registration for ex-felons despite state law Categories / Elections, Podcast, Politics Subscribe to Closing Arguments Sign up for new weekly newsletter Closing Arguments to get the latest about ongoing trials, major litigation and hot cases and rulings in courthouses around the U.S. and the world. window.CustomSubstackWidget = { substackUrl: "courthousenews.substack.com", placeholder: "example@gmail.com", buttonText: "Subscribe", theme: "custom", colors: { primary: "#2b3a42", input: "#FFFFFF", email: "#1F1F1F", text: "#FFFFFF", }, }; Additional Reads Executive branch’s power to suspend refugee admissions has limitations, federal judge says February 28, 2025 Trump’s top prosecutor in DC demotes several supervisors who handled politically sensitive cases February 28, 2025 Bangladeshi students who led uprising that ousted ex-premier Sheikh Hasina form new political party February 28, 2025 A Myanmar online news site says its jailed journalist is tortured for revealing abuses of prisoners February 28, 2025'
