["https://www.courthousenews.com/california-state-senator-bids-farewell-to-x-cites-extremist-content-and-unending-spam-posts"]
title = "California state senator bids farewell to X, cites ‘extremist content’ and unending spam posts | Courthouse News Service"
description = "State Senator Scott Wiener joins a growing number of people who say they've left Elon Musk's social media site."
full_description = '''SAN FRANCISCO (CN) — California state Senator Scott Wiener is signing off as a regular poster on social media site X.The San Francisco Democrat made the announcement Wednesday in an email and on the site formerly called Twitter. Citing changes that he said have degraded the site’s ability to function, Wiener said he’ll instead post regularly on other platforms like Bluesky, Instagram, Threads and TikTok. He’ll continue to post on X but only occasionally and for unusual situations.“Given the escalating negative changes at X — filled with extremist content, unending junk/spam posts, and bizarre changes to the algorithm — it’s no longer a reliable or effective platform for me to reach my constituents, members of the press & others who may be interested in my work,” the senator posted. “A change in the algorithm in January appears to have impacted engagement with my posts across the board.“I hope X gets fixed at some point — I enjoyed using it for so many years — but at this point, it’s a garbage fire,” he added.Changes to the algorithm aren’t the only reason people have announced their departure from X over the past few years. Several public figures have publicly announced they’d leave X since its 2022 purchase by Elon Musk, the billionaire owner of companies like SpaceX and Tesla and now the face of the federal Department of Government Efficiency under President Donald Trump.Mark Hamill, who portrayed Luke Skywalker in the “Star Wars” films, last posted on X in November. He still regularly posts on Bluesky, a social media site similar to X where many users have fled since Musk’s purchase.“They say we get the leaders we deserve,” Hamill posted the day after the presidential election. “Either that has just been disproven, or this is not the America we all thought we were living in.”George Takei, who played Mr. Sulu in “Star Trek,” continues to post on X, though he pinned a post in November directing people to his Bluesky account. Takei is a vocal critic of Trump.And Matthew Waterhouse, who took on the role of Adric in the long-running British sci-fi show “Doctor Who,” bowed out around the same time.“Farewell!” Waterhouse posted. “This is my last post on X/Twitter. I'm hardly alone in feeling increasingly uncomfortable with it over the last several years, and now Musk has jumped the final ethical shark it's goodbye from me.”Some media outlets have also bailed on X, including The Guardian and National Public Radio. The Guardian called X a "toxic media platform" and argued Musk has used his influence to affect political discourse. NPR said it left because X, then called Twitter, labeled it "state-affiliated media."UDW, the United Domestic Workers, left X on Feb. 10, said Dan Arel, the group's communications director. He said the group opted to leave after seeing the website become a safe haven for the far-right. Arel said his executive director urges other unions and social justice organizations to follow their lead. The group, which already had a presence on other social media, has since ramped up its activity on sites like Bluesky and LinkedIn."We're getting better engagement there," Arel said of Bluesky. Others also have complained about a change in the tone now found on X. One writer described it as a global public forum that morphed into a wasteland of hate and rumor. Musk himself tells X users that they are now the media while posting misinformation to his 219 million followers.Wiener is no stranger to hate on X. Gay and Jewish, as well as the author of controversial legislation over the years, Wiener has regularly received hateful responses to his X posts.His post announcing his departure from X was no exception. It quickly garnered responses that called him names and told him to enjoy the “echo chamber” of Bluesky.“Bluesky has less than a tenth of the engagement,” one user replied to Wiener. “X/Twitter is where the discussions take place. You want to argue your positions? This is where to do it. Trolls are part of life on social media. If you’re an elected official, you need a thick skin.”X has over 500 million users across the world. Bluesky has some 31 million users, adding 14 million since November. Categories / Government, Media, Technology Subscribe to Closing Arguments Sign up for new weekly newsletter Closing Arguments to get the latest about ongoing trials, major litigation and hot cases and rulings in courthouses around the U.S. and the world. window.CustomSubstackWidget = { substackUrl: "courthousenews.substack.com", placeholder: "example@gmail.com", buttonText: "Subscribe", theme: "custom", colors: { primary: "#2b3a42", input: "#FFFFFF", email: "#1F1F1F", text: "#FFFFFF", }, }; Additional Reads Apple sued over ‘carbon neutral’ watch marketing February 26, 2025 Federal judge inclined to side with USPS over seized Black Lives Matter merch February 26, 2025 Chief Justice Roberts lets US foreign aid bills go unpaid as SCOTUS considers Trump appeal February 26, 2025 Top House Republican remains noncommittal as lawmakers expand crusade against federal judges February 26, 2025'''
