full_description = 'Virginia blasted for deceit in battle with national press Bill Girdner / March 4, 2025 Virginia has set up a two-tier system of access to court records, one for officials and lawyers that is remote, and another for plebes that is not. Anti-DEI executive order stays on pause Brief / March 4, 2025 BALTIMORE — President Donald Trump and other government officials’ motion to stay a preliminary injunction barring an anti-DEI executive order failed in a Maryland federal court. The executive order, which told agencies to terminate "equity-related grants" and contracts, plausibly constitutes viewpoint- and content-based regulation of speech, so they might violate the First and Fifth Amendments. Since the government’s appeal is unlikely to succeed, the injunction is upheld. Brief / March 3, 2025 SAN DIEGO — The city of San Diego must face false arrest claims from a freelance photojournalist who sells his videos to news organizations. He plausibly accuses police of taking his camera, keys and documents that were on his person, then jailing him for 16 hours, in retaliation for filming police activity around a bloodied man who had jumped from a bridge. Nick Rummell / March 3, 2025 A New York State law requiring school immunizations does not violate the constitutional rights of Amish parents or their school-age children. Brief / February 27, 2025 NASHVILLE — The Tennessee Supreme Court upheld the revocation of a woman’s license plate reading “69PWNDU,” ruling that personalized plates are considered government speech, not private speech, and are not protected under the First Amendment. The woman, who had been using the license plate for 11 years, argued that the letters “pwnd” referred to a video game term and “69” was a reference to the year of the moon landing, but the state revoked the plate because of the sexual connotation of the numbers.'
