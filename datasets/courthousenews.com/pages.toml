title = "ASL at Six Flags | Courthouse News Service"
description = "SACRAMENTO, Calif. — A federal court in California issued a permanent injunction against Six Flags after a deaf employee sued for its failure to provide him an ASL interpreter. The court denied all but one of Six Flags’ objections to the employee’s proposed injunction addressing Six Flags’ accommodations, compliance with the ADA and its provision of interpreter services. The injunction is not nationwide, and only applies to the Six Flags Discovery Kingdom and the national call center’s interactions with guests who need accommodations there."
