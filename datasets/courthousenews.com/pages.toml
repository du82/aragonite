["https://courthousenews.com/about-us"]
title = "About Us | Courthouse News Service"
description = "Courthouse News Service covers news, both national and international, that moves society and its many elements in one direction or another. Established in 1990, Courthouse News now includes our public website, courthousenews.com, which publishes a wide range of news stories on political events, natural cataclysms, scientific discoveries, and, with a focus on the law, cases,"
full_description = 'Courthouse News Service covers news, both national and international, that moves society and its many elements in one direction or another.Established in 1990, Courthouse News now includes our public website, courthousenews.com, which publishes a wide range of news stories on political events, natural cataclysms, scientific discoveries, and, with a focus on the law, cases, major rulings, trials, arguments and opinions within the state and federal courts. Our subscriber-supported reports publish additional news on the ever-evolving civil law of our nation, the rules and reasoning that govern our society.The subscriber reports include review and analysis of new civil cases that, at their core, claim an injustice to someone or to a larger class of people. The reports are written by human news reporters, and they are relied on by journalists, lawyers, law firms, universities and government institutions that seek to know about court pleadings that affect them or provide news about the direction of the law and the professions tied to its course. The subscriber reports also analyze the opinions that represent the outcome of disputes where the public power of the courts has been invoked, after facts and testimony have been assembled and legal arguments made. Those opinions are written by judges in the trial courts up through the state and federal courts of appeal and on to the highest court in our land.In between first filing and the ruling on the merits, subscribers can track these cases as they play out in the courts. The trackers allow subscribers to learn the tactics and arguments made as a case proceeds towards resolution.In the fast-receding time when newspapers were many and were powerful, they relied on both subscribers and advertisers to pay the costs of reporting and distributing the news. Today, most advertising dollars go to the giants of the Internet. At Courthouse News, it is the subscribers who pump the financial lifeblood into our news service, allowing us to hire the journalists who gather news and write the copy that is read on average by more than 1 million people per month.For more information about subscriptions, visit www.cnscaseportal.com or contact us at [email protected] or (909) 483-6165. Subscribe to Closing Arguments Sign up for new weekly newsletter Closing Arguments to get the latest about ongoing trials, major litigation and hot cases and rulings in courthouses around the U.S. and the world. window.CustomSubstackWidget = { substackUrl: "courthousenews.substack.com", placeholder: "example@gmail.com", buttonText: "Subscribe", theme: "custom", colors: { primary: "#2b3a42", input: "#FFFFFF", email: "#1F1F1F", text: "#FFFFFF", }, }; Additional Reads Contributor-Test-Post-2025-02-27 February 27, 2025 Contributor-Test-Post-2025-02-27 February 27, 2025 Contributor-Test-Post-2025-02-27 February 26, 2025 Upscale milk brand Fairlife accused of animal abuse, environmental wrongs February 26, 2025'
