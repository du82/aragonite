["https://www.courthousenews.com/serbia-opposition-disrupts-parliament-with-flares-smoke-to-support-protests"]
title = "Serbia opposition disrupts parliament with flares, smoke to support protests | Courthouse News Service"
description = "We are updating our Terms of Use. Please carefully review the updated Terms before proceeding to our website."
full_description = '''BELGRADE, Serbia (AFP) — Serbian opposition lawmakers lit flares and discharged suspected tear gas during the opening day of the spring session of parliament on Tuesday, in a sign of support for ongoing anti-corruption protests.Footage shared online showed opposition members holding colorful flares and throwing what appeared to be smoke canisters as the session began to review the legislative agenda.A live video feed showed parliamentary speaker Ana Brnabic lambasting the opposition's protest and the alleged use of "tear gas" in the assembly."Your color revolution has failed, and this country will live, this country will work and this country will continue to win," she told them.Serbia has been rocked for months by student-led anti-corruption protests following the fatal collapse of a train station roof last year that killed 15 people.The movement has put increasing pressure on the Serbian government and President Aleksandar Vucic, spurring the resignation of several high-ranking officials, including the prime minister in January.Tuesday's session was the first since Prime Minister Milos Vucevic stepped down, where they were set to formalize his resignation.The parliament was also set to debate a new higher education bill that would slash tuition fees for university students — a demand of the protesters.In chaotic scenes, the speaker said plans would go ahead to vote on the legislation, after opposition members launched their protest and threw eggs and water at members of the ruling Serbian Progressive Party."Do you defend students' demands like this?" said Brnabic during the session.Opposition lawmakers also waved Serbian flags and held signs saying: "Your hands are bloody and "Fulfil the students' demands!" Melee The speaker later said that multiple lawmakers were injured during the melee.Serbia's Health Minister Zlatibor Loncar said that one lawmaker was taken to an intensive care unit after suffering a stroke.Hours after the first, more chaotic scenes erupted in the parliament when a fire extinguisher was discharged, flares were lit and smoke canisters set off.Belgrade's public prosecutor's office said it had ordered police "to establish the relevant facts and gather all available evidence to identify the individuals who brought and used pyrotechnic devices" and find out who else threw objects during the session.The collapse of a railway station roof in the city of Novi Sad in November followed extensive renovations to the building.It ignited long-simmering anger in the country over corruption and the alleged lack of oversight for construction and development projects.Vucic and other government officials have swung between calling for talks and firing off allegations that the demonstrators are being backed by foreign powers.To quell the protests, the government has sought to meet several of the student organizers' demands.Those steps have included releasing a raft of documents related to the renovations at the station; pardoning protesters arrested at rallies; boosting funding for higher education; and launching criminal proceedings against suspects accused of attacking demonstrators.Outside parliament, student protesters also rallied as the session opened, where they held 15 minutes of silence in tribute to the victims of the Novi Sad tragedy.University students have emerged as the leaders of the protest movement and have been blockading campuses across the country for weeks.Student protesters however have refrained from making a formal alliance with Serbia's fractured political opposition.The protest comes after thousands of demonstrators flocked to the southern city of Nis over the weekend, during the latest in a series of mass demonstrations.Protests have called for another large rally to be held in the capital Belgrade on March 15.— By MINA PEJAKOVIC Agence France-Presse Categories / Education, Government, International, Politics Subscribe to Closing Arguments Sign up for new weekly newsletter Closing Arguments to get the latest about ongoing trials, major litigation and hot cases and rulings in courthouses around the U.S. and the world. window.CustomSubstackWidget = { substackUrl: "courthousenews.substack.com", placeholder: "example@gmail.com", buttonText: "Subscribe", theme: "custom", colors: { primary: "#2b3a42", input: "#FFFFFF", email: "#1F1F1F", text: "#FFFFFF", }, }; Additional Reads Mexican and US markets feel shock of Trump trade war escalation March 4, 2025 Trump ends military aid to Ukraine; EU calls for $840B military boost March 4, 2025 Whose democracy is rotting March 4, 2025 Chameleon phones and smart contact lenses: The gadgets of Mobile World Congress 2025 March 4, 2025'''
