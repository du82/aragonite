["https://www.courthousenews.com/chameleon-phones-and-smart-contact-lenses-the-gadgets-of-mobile-world-congress-2025"]
title = "Chameleon phones and smart contact lenses: The gadgets of Mobile World Congress 2025 | Courthouse News Service"
description = "The trade show in Barcelona showcases the latest tech gadgets, including an ultra-realistic robot that could be connected to a large language model."
full_description = '''BARCELONA (AFP) — As the world's biggest wireless technology fair, the Mobile World Congress in Barcelona is packed with manufacturers showing off their latest gadgets and inventions.This year's stands have looked to wow visitors with an ultra-lifelike humanoid robot, color-changing smartphones, smart contact lenses and many more.‘Spatial sound’ in phone calls Mobile equipment builder Nokia and operator Vodafone say their "3D spatial sound" will offer users "truly immersive audio" on phone calls, with the person on the line sounding as if they are in the same room.Where current calls use only a single audio channel to transmit the voice, the new system allows for sounds seeming to come from different directions.Dubbed "Immersive video and audio services" or Ivas, the technology requires handsets fitted with two microphones.That combined with the need for a high-speed 5G connection means the technology could take several years to reach most users. High-fidelity robot Sporting a black dress, red jacket and long brown hair, ultra-realistic humanoid robot Amira is on display by Emirati telecom operator Etisalat.While imitating human features with high fidelity, Amira's movements remain recognizably slow and jerky.Elliott White of the robot's creators Engineered Arts said that the device could be connected to any generative AI "large language model" to allow interactions with people.Remote driving There is no shortage of connected cars on the floors at MWC, but visitors were able to test-drive a vehicle 1,800 miles away in Finland at the stand of congress organizer GSMA.The setup — nothing but a wheel and some screens — was created by Estonian firm Elmo, which has fitted the cars with a custom controller and multiple cameras, alongside Nokia.Chameleonic smartphone Chinese manufacturer Realme has developed a smartphone that changes color as the outside temperature shifts.The body of its 14 Pro line, textured to look like a seashell, is infused with thermochromic pigments that shift to blue below 61 degrees Fahrenheit or white when it gets warmer.The smartphone maker admits that the purely decorative feature has a limited shelf-life."The cold-sensitive color-changing function will gradually lose effect due to daily use," Realme says.Smart contact lenses Dubai-based startup Xpanceo is aiming to fit smart features including an "extended reality" display, health monitoring and wireless power reception into a flexible contact lens.Demonstrator models at their stand show off proofs of concept for each of the capabilities that co-founder Roman Axelrod says they want to pack into a single prototype device "by the end of 2026."For now the devices are relatively clunky, with a large metal coil needed to receive the wireless power to light up a single pixel on one demonstration lens.Those components would be miniaturized using "two-dimensional materials ... only one atom thick," Axelrod said. "That is the scientific know-how that differentiates us".Solar-powered laptop Chinese PC builder Lenovo has built solar panels into the lid of its Yoga Solar laptop to extend battery life.Its 84 solar cells are able to feed power into the device even when not exposed to direct sunlight, Lenovo says.The laptops will be fitted with a power monitoring system to manage when the solar panel comes into play."This innovation allows the solar panel to absorb and convert enough direct sunlight in 20 minutes to power up to one hour of video playback on the PC," Lenovo said.‘Cat Eye’ to spot cataracts Spanish mobile operator Telefonica has joined forces with startup Edgendria Innovacion to build its "Cat Eye" tool.Users can carry out an ophthalmological exam on themselves to determine whether they have a cataract serious enough to require surgical intervention.A simple photo of each eye is churned through an AI-powered platform to detect the ailment.This means doctors can "delegate certain tasks to their team so that they can intervene at the right time, making better use of their time," Telefonica said.— By VALENTIN BONTEMPS, MONA GUICHARD and TOM BARFIELD, Agence France-Presse Categories / Business, International, Technology Subscribe to Closing Arguments Sign up for new weekly newsletter Closing Arguments to get the latest about ongoing trials, major litigation and hot cases and rulings in courthouses around the U.S. and the world. window.CustomSubstackWidget = { substackUrl: "courthousenews.substack.com", placeholder: "example@gmail.com", buttonText: "Subscribe", theme: "custom", colors: { primary: "#2b3a42", input: "#FFFFFF", email: "#1F1F1F", text: "#FFFFFF", }, }; Additional Reads Trump ends military aid to Ukraine; EU calls for $840B military boost March 4, 2025 Calls grow in Germany to revive compulsory military service March 4, 2025 Serbia opposition disrupts parliament with flares, smoke to support protests March 4, 2025 Writing on the wall as Chinese businesses fret over US trade war March 4, 2025'''
