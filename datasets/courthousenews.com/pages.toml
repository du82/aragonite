["https://www.courthousenews.com/asteroid-2024-yr4-is-no-longer-a-threat-to-earth-scientists-say"]
title = "Asteroid 2024 YR4 is no longer a threat to Earth, scientists say | Courthouse News Service"
description = "Discovered in December, the asteroid is an estimated 130 feet to 300 feet across, and swings our way every four years."
full_description = '''CAPE CANAVERAL, Fla. (AP) — Scientists have finally given the all-clear to Earth from a newly discovered asteroid.After two months of observations, scientists have almost fully ruled out any threat from the asteroid 2024 YR4, NASA and the European Space Agency said Tuesday.At one point, the odds of a strike in 2032 were as high as about 3% and topped the world’s asteroid-risk lists.ESA has since lowered the odds to 0.001%. NASA has it down to 0.0017% — meaning the asteroid will safely pass Earth in 2032 and there's no impact threat for the next century.Paul Chodas, who heads NASA’s Center for Near Earth Objects Studies, said there is no chance the odds will rise at this point and that an impact in 2032 has been ruled out."That’s the outcome we expected all along, although we couldn’t be 100% sure that it would happen,” he said in an email. But there’s still a 1.7% chance that asteroid could hit the moon on Dec. 22, 2032, according to NASA. Chodas expects the odds of a moon strike will also fade.The world's telescopes will continue to track the asteroid as it heads away from us, with the Webb Space Telescope zooming in next month to pinpoint its size. It's expected to vanish from view in another month or two.Discovered in December, the asteroid is an estimated 130 feet to 300 feet (40 meters to 90 meters) across, and swings our way every four years.“While this asteroid no longer poses a significant impact hazard to Earth, 2024 YR4 provided an invaluable opportunity" for study, NASA said in a statement.___By MARCIA DUNN AP Aerospace WriterThe Associated Press Health and Science Department receives support from the Howard Hughes Medical Institute’s Science and Educational Media Group and the Robert Wood Johnson Foundation. The AP is solely responsible for all content. Categories / Science Subscribe to Closing Arguments Sign up for new weekly newsletter Closing Arguments to get the latest about ongoing trials, major litigation and hot cases and rulings in courthouses around the U.S. and the world. window.CustomSubstackWidget = { substackUrl: "courthousenews.substack.com", placeholder: "example@gmail.com", buttonText: "Subscribe", theme: "custom", colors: { primary: "#2b3a42", input: "#FFFFFF", email: "#1F1F1F", text: "#FFFFFF", }, }; Additional Reads Computer simulations show nightmare Atlantic current shutdown less likely this century February 26, 2025 Research links human joints to ancient fish February 25, 2025 A swarm of underwater drones can help artificial reefs off Cyprus bring back sea life, officials say February 24, 2025 Theranos executives can’t shake fraud charges on appeal, says Ninth Circuit February 24, 2025'''
