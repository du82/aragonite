["https://www.courthousenews.com/sidebar-season-four-episode-12-the-trial-of-lizzie-borden"]
title = "Sidebar: The trial of Lizzie Borden | Courthouse News Service"
description = "Did Lizzie Borden really take an axe and give her mother 40 whacks? We bring you all the salacious details that have kept the trial of the 19th century thriving in the public consciousness."
full_description = '''Sensational headlines, societal upheaval and a gruesome crime that shook Fall River, Massachusetts, to its core.Turn off the lights and cozy up to the fireplace as we bring you the spookiest type of story we can — one straight from the history books.America's first trial of the century came from an unusual source: Lizzie Borden, a 32-year-old unmarried upper-class woman in 1892 New England. Borden's father and stepmother met their final moments in one of the most brutal of ways, at the hands of someone with an axe.Did she do it? With the help of two writers, we bring you inside the courtroom for Borden's trial, a legal spectacle set against the backdrop of yellow journalism and a nation gripped by details of a crime among the affluent, complete with an all-star cast of attorneys. Special guests: Cara Robertson, author of The Trial of Lizzie Borden Mark Olshaker, co-author of The Cases That Haunt Us Sidebar tackles the top stories you need to know from the legal world. Join reporters Hillel Aron, Kirk McDaniel, Amanda Pampuro and Kelsey Reichmann as they take you in and out of courtrooms in the U.S. and beyond and break down developments to help you understand how they affect your day-to-day life.This episode was produced by Hillel Aron. Intro music by The Dead Pens. A transcript is available.Editorial staff is Sean Duffy and Jamie Ross.For more ghastly news from this century: Accused Davis stabber enters insanity plea in murder case Family members ask for Menendez brothers to be resentenced in parents’ murders Vegas politician gets life in prison, parole after 28 years, for murdering reporter Categories / History, Podcast Subscribe to Closing Arguments Sign up for new weekly newsletter Closing Arguments to get the latest about ongoing trials, major litigation and hot cases and rulings in courthouses around the U.S. and the world. window.CustomSubstackWidget = { substackUrl: "courthousenews.substack.com", placeholder: "example@gmail.com", buttonText: "Subscribe", theme: "custom", colors: { primary: "#2b3a42", input: "#FFFFFF", email: "#1F1F1F", text: "#FFFFFF", }, }; Additional Reads Scientists genetically engineer mice with thick hair like the extinct woolly mammoth March 4, 2025 In New Orleans’ Tremé, historic skeleton krewe rings in Mardi Gras March 4, 2025 Sidebar: Post-conviction purgatory March 4, 2025 Black graves are being moved to make way for an industrial park, drawing a mix of emotions March 3, 2025'''
