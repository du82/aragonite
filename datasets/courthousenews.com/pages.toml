["https://www.courthousenews.com/california-ai-sextortion-bill-passes-first-legislative-hurdle"]
title = "California AI sextortion bill passes first legislative hurdle | Courthouse News Service"
description = "Two other, unrelated bills focused on fire-related crimes didn't make it out of the Assembly Public Safety Committee on Tuesday."
full_description = 'SACRAMENTO, Calif. (CN) — California middle school students, using artificial intelligence, created nude images of classmates to share, Orange County Sheriff’s Office investigator Brenden Billinger said.He added that over some 18 months, the FBI received 13,000 reports of online financial sextortion of minors and learned of at least 20 related suicides.“Some face relentless online harassment and social isolation,” Billinger said Tuesday to the Assembly Public Safety Committee about Assembly Bill 355.Written by Assemblymember Kate Sanchez, a Rancho Santa Margarita Republican, the bill would expand the definition of “fear” as it relates to extortion in existing law. If passed, it would include a threat to post, distribute or make AI-generated images or videos of someone.The bill passed out of Public Safety and now proceeds to the Assembly Appropriations Committee.Sanchez said the dangers the technology poses are rapidly increasing, especially for minors. Sextortion — threatening to release private materials if someone doesn’t provide sexual content, favors or money — is growing, Billinger said. It’s a crime that’s shifted online.“Offenders can hide behind their screens,” the investigator said.Sanchez said it’s the rise in such crimes that led her to introduce the bill, which will help prosecutors.Opponents pushed back on that argument.George Parampathu, a legislative attorney with ACLU California Action, said Tuesday the bill doesn’t define what technology is considered AI. He said the wording is broad and feared that elected officials could use the law to prosecute creators who make images they don’t like, violating the First Amendment.“We need a definition in the law,” he said of AI.Sanchez said she would continue working with opponents about their concerns. Committee members then unanimously passed the bill.The committee also passed Assembly Bill 15 — the California Homicide Victims’ Families’ Rights Act. Now advancing to Appropriations, the bill written by Assemblymember Mike Gipson, a Carson Democrat, would create a procedure to require a new law enforcement investigation into a homicide.Gipson said no procedure currently exists. His bill would allow certain people, like a family member of a homicide victim, to petition law enforcement to review a case file of an open, unsolved murder. That review would determine if a reinvestigation would spark new leads.An application for review could occur every five years.“California needs to do more to solve homicides,” Gipson said.Janiesha Grisham, whose brother died in an unsolved homicide over a decade ago, said she’s waited 5,177 days for justice and keeps counting. Gipson’s bill would give families like hers another chance at justice, she said.Cory Salzillo, speaking against the bill on behalf of the California State Sheriffs’ Association, argued the legislation creates a rigid process with little flexibility.“The bill moves these case reviews to the front of the line,” he said.While these bills made it out of committee, others didn’t.Two fire-related bills, both championed by Republicans, failed to pass the hurdle. However, one of them — Assembly Bill 297, written by Assemblymember Heather Hadwick of Alturas, was granted reconsideration.Hadwick’s bill would add another category to the crime of arson, giving a judge the option of adding three to five years to someone’s sentence if the fire they caused burned over 500 acres of forest.The Assembly member said the economic cost of forest fires is staggering. Her bill would discourage arsonists and offer relief to Californians.Parampathu argued against the bill, saying existing law already provides punishment for arsonists. Additionally, increasing prison time wouldn’t reduce crime.“Throwing someone in prison for 11 years isn’t going to bring back any trees,” he said.Assemblymember Nick Schultz, a Burbank Democrat and committee chair, said he recommended a “no” vote because existing law already provides adequate punishment.Schultz also issued a “no” recommendation on Assembly Bill 336, written by Assemblymember Greg Wallis, a Bermuda Dunes Republican. The bill would have made the crime of recklessly starting a fire that burned a structure, forest or property a felony, instead of the current choice of a felony or misdemeanor.Schultz said if enacted, Wallis’ bill could lead someone who recklessly started a fire to serve six years in prison and someone facing an arson conviction to serve only five years. The chairman argued that was inequitable. Categories / Government, Law, Technology Subscribe to Closing Arguments Sign up for new weekly newsletter Closing Arguments to get the latest about ongoing trials, major litigation and hot cases and rulings in courthouses around the U.S. and the world. window.CustomSubstackWidget = { substackUrl: "courthousenews.substack.com", placeholder: "example@gmail.com", buttonText: "Subscribe", theme: "custom", colors: { primary: "#2b3a42", input: "#FFFFFF", email: "#1F1F1F", text: "#FFFFFF", }, }; Additional Reads Anti-DEI executive order stays on pause March 4, 2025 Search the vehicle, not the purse March 4, 2025 Aid groups get second try in State Department lawsuit over refugee admissions March 4, 2025 10th Circuit rejects for-profit university’s efforts to dismiss whistleblower case March 4, 2025'
