title = "3rd Circuit tosses cheer mom’s defamation suit | Courthouse News Service"
description = "PHILADELPHIA — The Third Circuit affirmed the dismissal of a Pennsylvania cheer mom’s defamation and fabrication-of-evidence claims against a county DA and police, who had accused the mom of deepfaking images of minors to appear as they were smoking, drinking underage or nude. The charges were dropped when it became clear the police had not seen most of these videos and had scant evidence the footage was deepfaked. Her federal claims did not properly state a claim and the federal courts were right not to exercise jurisdiction over the state-law claims."
