["https://www.courthousenews.com/baby-box-at-small-town-hospital-marks-first-in-idaho"]
title = "Baby box at small-town hospital marks first in Idaho | Courthouse News Service"
description = "In the small town of Blackfoot in eastern Idaho, mothers can now safely abandon their babies without the need for human interaction and the shame that might come with it."
full_description = 'BLACKFOOT, Idaho (CN) — Like a lot of changes, it began small. At Grove Creek Medical Center in the small town of Blackfoot, bereavement coordinator Hailey Dahle wanted to install a so-called baby box.These boxes, special drop-off sites for babies, come outfitted with temperature controls and ventilation systems. An alarm alerts nearby emergency responders once a baby is placed inside. The origins of baby boxes are somewhat murky, but their modern incarnation dates back to 2017. That’s when nonprofit Safe Haven Baby Boxes installed its first box in Indiana.Fast forward to 2024, and Dahle thought just such a box could serve Blackfoot. “We just want to extend compassion to moms in these situations,” she said at the time. “Being a mom today looks different for everyone in this world.”But there was a problem: Under Idaho law, a baby could only be surrendered to another human being. The baby could not be left in a box, even one designed for just that purpose.In Blackfoot, change was already coming. Blackfoot city council in early 2024 passed an ordinance that allowed baby boxes in the town of 13,000. But there was still technically a conflict with state law — and besides, Dahle believed such reforms could also benefit the rest of the Potato State. She reached out to state Senator Julie VanOrden, pitching her vision.VanOrden liked the idea. The Idaho Republican began a push to amend the state’s safe haven laws. The measure, an update to the Idaho Safe Haven Act, saw overwhelming bipartisan support in the state legislature. It passed unanimously last March and was signed into law by Republican Governor Brad Little.Last July, Blackfoot got its baby box. Safe Haven Baby Boxes installed the device outside Grove Creek Medical Center, marking the 245th box in the country and the first in Idaho. Sadly, the box soon saw tragedy after an 18-year-old in November placed her deceased infant inside. The mother was soon arrested, and investigators determined the baby had died earlier. Safe Haven Baby Boxes released a statement, calling the tragedy an “illegal, deadly abandonment” that did not fit the criteria of legal surrender under any safe haven laws.The story of the modern baby box starts in the 1970s, when a young mother abandoned her daughter at a hospital in Ohio. That former infant, Monica Kelsey, would go on to start Safe Haven Baby Boxes.Proponents say the boxes let mothers surrender infants without the shame of having to interact with another person. Critics say there are inherent problems with abandoning babies in boxes, including a lack of knowledge about the infant’s medical history. “We know things like prenatal care are more integral to the health of an infant,” said Lori Bruce, a bioethicist at Yale School of Medicine. She’d rather see a regime in which women can give birth at hospitals anonymously, then surrender their infants.Monica Kelsey, the Safe Haven founder, doesn’t totally disagree. She says baby boxes are an imperfect antidote to child abandonment but can still be an important last resort. She wishes people would “wrap their heads around the fact that baby boxes are not a good option.”“It’s only a good option if it’s the last option a parent has left,” she said in an interview. “There is still education that people need to understand.”Baby-ethics debates aside, Blackfoot’s new status as one of the westernmost baby box locations largely comes down to circumstance. Institutions like hospitals and city governments have to be the ones to reach out to Safe Haven Baby Boxes, and in this case, it just so happens that Blackfoot was the first city in Idaho to embrace the box. Only time will tell if other communities follow suit. The Boise mayor’s office did not respond when asked about a potential baby box in the city, nor did lawmakers from other parts of the state. For Kelsey’s part, she says she’s happy to work with any community. “The more boxes we have, the more availability there is for a mom that needs it,” she said. “What we don’t want is for a mother to need it and not have it.”The tragic beginning to Blackfoot’s baby box prompted a smattering of news stories reassuring Idahoans that the boxes were safe.It may be that this novel idea for addressing infant abandonment is still catching on in the Gem State. Surveying some random mothers in the Boise area, reviews were mixed. “I just think there’s a lot of other ideas and solutions I would focus on first,” said one mother, Rebecca. Another mom, Breanne, said she could see the value. “If it saves just one baby and helps that one mom,” she said, “that’s a victory to celebrate, right?” Follow @CarsonAndLloyd Categories / Features, Health, Regional Subscribe to Closing Arguments Sign up for new weekly newsletter Closing Arguments to get the latest about ongoing trials, major litigation and hot cases and rulings in courthouses around the U.S. and the world. window.CustomSubstackWidget = { substackUrl: "courthousenews.substack.com", placeholder: "example@gmail.com", buttonText: "Subscribe", theme: "custom", colors: { primary: "#2b3a42", input: "#FFFFFF", email: "#1F1F1F", text: "#FFFFFF", }, }; Additional Reads Texas Senate debates proposals to purge DEI from public education February 27, 2025 Huntington Beach sued for moving ‘sexually explicit’ books out of children’s section February 27, 2025 Southern California politician can’t sue city for censuring her, federal judge rules February 27, 2025 Iowa lawmakers erase gender identity from state civil rights law February 27, 2025'
year_published = 2025
year_updated = 2025
clearnet = "https://www.courthousenews.com/baby-box-at-small-town-hospital-marks-first-in-idaho"
