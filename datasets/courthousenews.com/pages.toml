["https://www.courthousenews.com/sarah-silverman-and-acclaimed-authors-fight-metas-bid-to-dismiss-their-ai-lawsuit"]
title = "Sarah Silverman and acclaimed authors fight Meta’s bid to dismiss their AI lawsuit | Courthouse News Service"
description = "The comedian and 12 other authors opposed the tech giant’s efforts to dismiss claims it illegally used pirated books to train its “Llama” AI model."
full_description = '''SAN FRANCISCO (CN) — What do comedian Sarah Silverman, award-winning author Junot Diaz and Ta-Nehisi Coates all have in common? They’re all suing Meta because it used their books to train its flagship AI model, Llama.Facebook's parent company appeared before a federal judge on Thursday, seeking to dismiss claims by 13 award-winning and acclaimed authors that it violated U.S. copyright law by using their works to train its Llama AI without their permission.In court, U.S. District Judge Vince Chhabria appeared to side with the authors, stating that though he didn’t think they would prevail on their accusations Meta violated the Digital Millenium Copyright Act, they likely had enough to survive dismissal. “At this point, it seems like they’ve alleged a violation,” the Barack Obama-appointed judge said.However, the judge also criticized the plaintiffs for their “over-the-top” rhetoric in the case, and warned that if it continues, it could hurt their credibility with the court.“The rhetoric you’ve been using in court and in your letters is, on a scale of one to 10, an 11. And you need to dial it back,” Chhabria told attorney Maxwell Pritt of law firm Boies Schiller Flexner, who represented the authors.At issue is Meta’s practice of including copyrighted works, like the authors’ books, in the datasets it used to train Llama. Although the AI itself is open source, the authors claim the Silicon Valley giant pirated their unlicensed works through “shadow libraries” online, like Library Genesis and Anna’s Archive, and stripped them of relevant copyright information like ISBNs, copyright symbols and disclaimers to conceal their wrongdoing.The authors also argued that the AI’s response outputs were a direct result of copywritten works, which they claim translates to Meta unlawfully benefitting from their works by failing to license them through their authors.“A large language model’s output is entirely and uniquely reliant on the material in its training dataset. It does not invent new things or reason, but instead outputs what it has trained on,” the plaintiffs argue in their class action.Meanwhile, Meta insists that its use of the authors’ work qualifies as fair use, and that the lawsuit should be dismissed because the writers lack standing to sue. According to Meta, the writers fail to identify a “concrete” injury they suffered.At one point, Chhabria pressed Meta on their motion, saying he “didn’t understand” their reasoning.“If you steal my book, and you remove the CMI to increase the chances you won’t get caught, why is that not a valid injury?” the judge asked Attorney Kathleen Hartnett of law firm Cooley, who represented Meta.The authors maintain that their claims of copyright infringement and unjust enrichment are both “concrete” and traditionally recognized as the basis for lawsuits in American courts.“You know, this is one of those weird situations where you have allegations in the complaint, but you’ve already had the chance to look at a lot of evidence,” Chhabria said.Earlier this month, the court released email documents from Meta employees close to the project who expressed concern at the time over the legality of their work.“Torrenting from a corporate laptop doesn’t feel right,” Meta research engineer Nikolay Bashlykov said in one email, following it up with a laughing emoji.The judge said he would consider proposals for additional discovery based on this new evidence and gave the attorneys until Mar. 5 to submit them.The judge did not indicate when he would issue a ruling. But, he did express mild frustration at the end of the hearing, calling for a brief break before the next case.“Everyone in the next hearing, excuse me. I’m gonna step into the back room and bang my head against the wall for a second,” he joked.Attorneys for both sides did not immediately respond to a request for comment.In its motion, Meta also briefly denied claims that it acted as a “distributor” of the unlicensed works and facilitated further copyright infringement and data piracy with others around the world. The company maintained that it didn’t seed any works via BitTorrent but said it would seek to dismiss those claims later during a future motion for summary judgment.The authors’ case has come a long way over its nearly two-year lifespan. They filed their class action against Meta in July 2023, and the case was initially dismissed in November 2023. However, the judge allowed the plaintiffs a chance to repair their lawsuit.This motion to dismiss concerns the lawsuit’s fourth iteration.The authors are seeking a declaration that Meta violated U.S. copyright law, as well as damages to be determined at trial.Meta released Llama in February 2023 as an open-source competitor to Chat-GPT. The program’s name, originally stylized as “LLaMA” is a near-acronym for “Large Language Model Meta AI,” and it was marketed as a more customizable model that would better suit the needs of software developers and researchers.Meta said that since its 2023 release, Llama has been downloaded an average of 1 million times per day. The company released its most recent version Llama 3.3 at the end of 2024.Silverman is a stand-up comedian and the author of several books, famous for her routines on taboo subjects like racism, sexism, homophobia and religion. She is the most well-known plaintiff in the lawsuit, which also includes authors Junot Diaz, Ta-Nehisi Coates, David Henry Hwang and Laura Lippman, among others.Silverman is also party to a similar lawsuit concerning AI model training on copywritten works, which has yet to be resolved.The case was filed in the Northern District of California and heard at the Phillip Burton Federal Courthouse in San Francisco, California. Categories / Business, Courts, Entertainment, Technology Subscribe to Closing Arguments Sign up for new weekly newsletter Closing Arguments to get the latest about ongoing trials, major litigation and hot cases and rulings in courthouses around the U.S. and the world. window.CustomSubstackWidget = { substackUrl: "courthousenews.substack.com", placeholder: "example@gmail.com", buttonText: "Subscribe", theme: "custom", colors: { primary: "#2b3a42", input: "#FFFFFF", email: "#1F1F1F", text: "#FFFFFF", }, }; Additional Reads DOJ unseals plea agreement against former sailor who admitted to planning attack on Naval Station Great Lakes February 27, 2025 Economic blackout: Will a 24-hour boycott make a difference? February 27, 2025 SoCal man pleads guilty to stealing trade secrets for Chinese company February 27, 2025 Oscar-winner Gene Hackman, wife Betsy Arakawa and their dog were dead for some time, warrant shows February 27, 2025'''
