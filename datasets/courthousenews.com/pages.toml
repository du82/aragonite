full_description = "Minnesota Supreme Court skeptical high penalties for unemployment fraud are unconstitutional Mark Wasson / March 3, 2025 “We do want to leave things up to the legislature, but we don’t want to let the legislature do things that go too far or grossly disproportionate or, in this case, impose administrative penalties that exceed criminal ones,” Russell Squire of Southern Minnesota Regional Legal Services told the court. Mother suspended for outburst Brief / March 3, 2025 EL DORADO, Ark. — An Arkansas county school district prevailed on the sex discrimination lawsuit brought by an employee, who cursed at the coach of her disabled son in front about 50 people, telling the coach he needed to get his “shit together” and his “ass in gear” about her son’s bullies. Because her public outburst constituted inappropriate behavior under the school’s code of conduct, the school relied on a legitimate reason to suspend her for a semester. Brief / February 28, 2025 CHICAGO — The Seventh Circuit ruled that it is too early to weigh in on former Illinois State University football coach Kurt Beathard’s lawsuit claiming he was fired for removing a Black Lives Matter poster from his door and replacing it with a handwritten note that read, “All Lives Matter to Our Lord & Savior Jesus Christ.” Because the lower court has not yet addressed whether head coach Brock Spack and a former university athletic director are entitled to qualified immunity, their appeal of the court’s decision to deny dismissal can’t yet be heard. Rox Laird / February 28, 2025 The governor said Iowa’s Civil Rights Act “blurred the biological line between the sexes” and “forced Iowa taxpayers to pay for gender reassignment surgeries. That is unacceptable to me.” Michael Gennaro / February 27, 2025 The judge said that the Office of Personnel Management had no authority to order government organizations to fire workers."
