["https://www.courthousenews.com/oscar-winner-gene-hackman-wife-betsy-arakawa-and-their-dog-were-dead-for-some-time-warrant-shows"]
title = "Oscar-winner Gene Hackman, wife Betsy Arakawa and their dog were dead for some time, warrant shows | Courthouse News Service"
description = "We are updating our Terms of Use. Please carefully review the updated Terms before proceeding to our website."
full_description = '''SANTA FE, N.M. (AP) — Oscar-winner Gene Hackman, his wife and their dog were found dead in different rooms of their Santa Fe home and had apparently been dead for some time, according to investigators.Hackman, 95, was found dead Wednesday in a mudroom and his 63-year-old wife, Betsy Arakawa, was found dead in a bathroom next to a space heater, Santa Fe County Sheriff’s Office detectives wrote in a search warrant. There was an open prescription bottle and pills scattered on a countertop near Arakawa.Denise Avila, a sheriff's office spokesperson, said there was no indication that any of them had been shot or had other types of wounds.The New Mexico Gas Co. is working with the Santa Fe County Sheriff’s Department in the investigation, spokesperson Tim Korte told The Associated Press. The utility tested the gas lines in and around the home after the bodies were discovered, according to the warrant. At the time, it didn't find any signs of problems. A detective noted that people exposed to gas leaks or carbon monoxide may not show signs of poisoning, but also noted there were no obvious signs of a gas leak.The Associated Press left email and phone messages Thursday for sheriff’s officials seeking more details. A spokesperson for the University of New Mexico Health Sciences Center, which runs the state’s medical examiner operations, declined to comment on whether the cause and manner of deaths had been determined.A worker reported that the home's front door was open when he arrived for routine maintenance and that he called police after finding the bodies. Two workers told police that they rarely saw the homeowners and that their last contact with them had been about two weeks earlier.A dead German shepherd was found in a bathroom closet near Arakawa, police said. Two healthy dogs were found on the property.The gruff-but-beloved Hackman was among the best actors of his generation, appearing as villains, heroes and antiheroes in dozens of dramas, comedies and action films from the 1960s until his retirement in the early 2000s.He routinely showed up on Hollywood list of greatest American actors of the 20th century. He could play virtually any kind of role, from comic book villain Lex Luthor in “Superman” to a coach finding redemption in the sentimental favorite “Hoosiers.”Hackman was a five-time Oscar nominee who won for “The French Connection” in 1972 and “Unforgiven” two decades later. His death comes just four days before this year’s ceremony.Tributes quickly poured in from Hollywood.“The loss of a great artist, always cause for both mourning and celebration: Gene Hackman a great actor, inspiring and magnificent in his work and complexity," director Francis Ford Coppola posted on Instagram.Hackman met Arakawa, a classically trained pianist who grew up in Hawaii, when she was working part-time at a California gym in the mid-1980s, the New York Times reported in 1989. They soon moved in together, and by the end of the decade had decamped to Santa Fe.Their Southwestern-style ranch on Old Sunset Trail sits on a hill in a gated community with views of the Rocky Mountains. The 8,700 square-foot (808 square-meter), four-bedroom home on six acres was built in 1997 and had an estimated market value of a little over $4 million, according to Santa Fe County property tax records.Hackman and his wife also owned a more modest 2,000 square-foot (186 square-meter) home next door that was built in 2000.Hackman also co-wrote three novels, starting with the swashbuckler, “Wake of the Perdido Star,” with Daniel Lenihan in 1999, according to publisher Simon & Schuster. He then penned two by himself, concluding with “Pursuit" in 2013, about a female police officer on the tail of a predator.In his first couple decades in New Mexico, Hackman was often seen around the historic state capital, which known as an artist enclave, tourism destination and retreat for celebrities.He served as a board member of the Georgia O’Keeffe Museum in the 1990s, according to the local paper, The New Mexican.In recent years, he was far less visible, though even the most mundane outings caught the attention of the press. The Independent wrote about him attending a show at the Lensic Performing Arts Center in 2018. The New York Post reported on him pumping gas, doing yard work and getting a chicken sandwich at Wendy's in 2023.Aside from appearances at awards shows, he was rarely seen in the Hollywood social circuit and retired from acting about 20 years ago. His was the rare Hollywood retirement that actually lasted.Hackman had three children from a previous marriage. He and Arakawa had no children together but were known for having German shepherds.Hackman told the film magazine Empire in 2020 that he and Arakawa liked to watch DVDs she rented."We like simple stories that some of the little low-budget films manage to produce,” he said.An email sent to his publicist was not immediately returned early Thursday.___By SUSAN MONTOYA BRYAN, FELICIA FONSECA and BRIAN MELLEY Associated PressFonseca reported from Flagstaff, Arizona, and Melley reported from London. Associated Press writers Andrew Dalton in Los Angeles, Jacques Billeaud in Phoenix and Sylvia Hui in London contributed. Categories / Entertainment Subscribe to Closing Arguments Sign up for new weekly newsletter Closing Arguments to get the latest about ongoing trials, major litigation and hot cases and rulings in courthouses around the U.S. and the world. window.CustomSubstackWidget = { substackUrl: "courthousenews.substack.com", placeholder: "example@gmail.com", buttonText: "Subscribe", theme: "custom", colors: { primary: "#2b3a42", input: "#FFFFFF", email: "#1F1F1F", text: "#FFFFFF", }, }; Additional Reads Gene Hackman and his wife tested negative for carbon monoxide, sheriff says February 28, 2025 Judge quashes Blake Lively’s ‘overly intrusive’ subpoenas of Justin Baldoni phone records February 28, 2025 Can ‘The Girl with the Needle’ win an Oscar? February 28, 2025 Bureaucratic hurdles slow the beat of Rio’s Carnival street parades February 28, 2025'''
