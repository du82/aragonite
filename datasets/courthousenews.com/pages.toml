["https://www.courthousenews.com/bucky-creator-testifies-about-his-shock-seeing-disneys-moana-in-theater"]
title = "‘Bucky’ creator testifies about his shock seeing Disney’s ‘Moana’ in theater | Courthouse News Service"
description = "Under cross-examination, Buck Woodall appeared unsure about who he met with and to whom he pitched his story about a young surfer's adventures in Hawaii's mythological past."
full_description = '''LOS ANGELES (CN) — An animator suing Walt Disney Co. claiming the company stole his story about the adventures of a young surfer boy in Hawaii testified on Thursday about the shock he experienced seeing "Moana" in the theater in 2016.Buck Woodall told the jury in downtown Los Angeles that he immediately recognized the characters from a "Bucky" project that he had shared more than 12 years earlier with his brother's sister-in-law, who worked for Mandeville Films on the Disney lot in Burbank, California, at the time."I was immediately shocked," Woodall testified under questioning by Gustavo Lage, one of his attorneys. "I was very suspicious they had copied my materials."Maui, the Polynesian shape-shifting demigod who is one of the main characters in "Moana," strongly resembled Kamapua'a, the Hawaiian shape-shifting half man-half hog demigod who features prominently in his "Bucky" script, Woodall claimed. Likewise, he said, Moana's parents and grandmother were very much like characters that he created for "Bucky."Woodall said he saw a Spanish-language version of "Moana" for the first time in a crowded and humid theater in Mexico, shortly after its release on Thanksgiving in 2016. He obtained an English-version DVD of the movie a few months later to confirm his suspicions."I watched it over and over again on my computer," he testified. "I felt more convinced that I had been robbed."Unfortunately for Woodall, he didn't sue Disney for copyright infringement until 2020, more than three years after he first suspected that his work had been illegally copied. By then, the statute of limitations had run out for most of his claims other than against Disney's Buena Vista Home Entertainment business, which distributes home video copies of "Moana" and is the sole defendant in the case.The jury will decide if Woodall has proven that Disney's animation studio had access to the copyrighted "Bucky" materials that he shared with his stepsister-in-law and whether "Moana" and "Bucky" are substantially similar in look and feel to the ordinary observer, the so-called intrinsic test for copyright infringement.U.S. District Judge Consuelo Marshall, who is presiding over the trial, will apply the additional, more objective extrinsic test whether there are protectable elements, as opposed to mere generic elements, in the "Bucky" materials, such as characters and plot twists, that are also found in "Moana."Woodall, a New Mexico native who lived for decade on Hawaii, created the story of Bucky, a blond 13-year-old who lives on Kauai. In the story, Bucky gets mistakenly transported back in time with his new group of surfing friends and has to figure out a riddle he’s told by Pele, the Hawaiian goddess of fire, to get back to the present and save a sacred piece of Hawaiian land from being destroyed."Moana’s island, Motunui, substantially resembles Hanalei Bay, Kauai, the island Bucky saves and where Woodall lived and created Bucky," he says in his complaint. "Both Hanalei Bay and Motunui’s bay are markedly crescent shaped. Both bays have an estuary at the same spot of the crescent bay — a river that runs into the ocean"According to Woodall, he met with the Jenny Marchick, the stepsister of his brother's wife, sometime in early 2004 and gave her his initial treatment of "Bucky" consisting of an outline of the story and illustration in the hope that she would help him get the project turned into a movie.He claims that Marchick somehow schemed with Disney, with which Mandeville Films had a first-look agreement for the studio to distribute the movies the production company developed, and that his treatment ended up in the hands of the makers of "Moana" at Walt Disney Animation Studios.Marchick has said in court filings that she made a call to the animation studio only to quickly learn that they don't look at outside pitches and develop their movies in-house only. Marchick also arranged for Woodall to meet someone at Disney TV, but according to her, this person had no interest in Woodall's project.Woodall testified he spent $200,000 the next couple of years to create a trailer for "Bucky." The judge stopped him, however, from telling the jury that he had been urged to do so by Marchick because that would be impermissible hearsay.Under cross-examination by Disney's attorney Robert Klieger, Woodall's recollection appeared shaky when it came to with whom and when he discussed "Bucky."He couldn't recall who at Disney TV he had met with, or whether it had been a man or woman. He also testified that he pitched the "Bucky" story to someone, "a friend of a friend," who worked at Disney around 2003 or 2004 while in Hawaii but again he couldn't provide any details.In response, Klieger pulled up Woodall's sworn answers to studio's pretrial interrogatories that showed he had only acknowledged to talking about "Bucky" with two Disney-connected individuals — Marchick and a line producer, someone who handles production logistics, for a Disney TV show who Woodall had hired to write the script for his trailer.And although Woodall testified he had shared updates and additional "Bucky" materials, including the trailer and a full-length screenplay, as recently as 2014 with Marchick, Krieger pointed out to him that he did so after Marchick had left Mandeville to work at 20th Century Fox and Sony Pictures. Follow @edpettersson Categories / Courts, Entertainment, Trials Subscribe to Closing Arguments Sign up for new weekly newsletter Closing Arguments to get the latest about ongoing trials, major litigation and hot cases and rulings in courthouses around the U.S. and the world. window.CustomSubstackWidget = { substackUrl: "courthousenews.substack.com", placeholder: "example@gmail.com", buttonText: "Subscribe", theme: "custom", colors: { primary: "#2b3a42", input: "#FFFFFF", email: "#1F1F1F", text: "#FFFFFF", }, }; Additional Reads DOJ unseals plea agreement against former sailor who admitted to planning attack on Naval Station Great Lakes February 27, 2025 Sarah Silverman and acclaimed authors fight Meta’s bid to dismiss their AI lawsuit February 27, 2025 Oscar-winner Gene Hackman, wife Betsy Arakawa and their dog were dead for some time, warrant shows February 27, 2025 Influencer Tate brothers, who face human trafficking charges in Romania, arrive in the US February 27, 2025'''
