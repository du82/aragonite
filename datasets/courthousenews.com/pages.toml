["https://www.courthousenews.com/republicans-roll-out-red-carpet-for-trump-ahead-of-joint-address-to-congress"]
title = "Republicans roll out red carpet for Trump ahead of joint address to Congress | Courthouse News Service"
description = "The president is expected to use his speech to highlight a whirlwind two months in office, which saw the administration attempt to drastically expand executive power, clamp down on immigration and undertake a sea change in U.S. foreign policy."
full_description = '''WASHINGTON (CN) — Hours before President Donald Trump was scheduled to address a joint session of Congress, lawmakers set the stage for his remarks and promised a speech that would highlight what they framed as the myriad accomplishments of his new administration.Tuesday's joint address — the first of Trump’s second administration — comes as the White House is aggressively pursuing an ambitious agenda that has already ignited controversy both domestically and on the international stage. And Republican lawmakers have said the president’s remarks will focus on the breakneck speed of that effort.“In just less than two months, it’s been a riveting pace that President Trump took to start getting our country back on track,” House Majority Leader Steve Scalise told reporters during a news conference Tuesday morning.Michigan Representative Lisa McClain, who chairs the House Republican caucus, succinctly laid out the theme of Trump’s planned address.“America is back,” she said.In the short time that the president has been back in office, his administration has taken significant steps to implement an ambitious agenda, largely by executive order. The White House has ordered a crackdown on immigration enforcement, ordering U.S. troops to the country’s southern border and campaigning to arrest and deport millions of people here illegally.The Trump administration has also taken steps to unilaterally shave off parts of the federal government it deems wasteful or fraudulent. Under the auspices of Elon Musk’s Department of Government Efficiency, the White House has effectively shuttered the U.S. Agency for International Development and has taken steps to slash the federal workforce, leaving scores of government employees out of work. Those steps have raised questions about whether the administration is trampling on authority constitutionally allocated to Congress — though Republican lawmakers have largely rejected those concerns.Trump’s first few weeks in office have also yielded some controversial developments in foreign policy. A set of tariffs against Canada, Mexico and China, announced by the White House last month, went into effect Tuesday. That move spooked financial markets and kicked off a trade war, with all three countries saying they would retaliate in kind.And the administration on Monday said that it would pause aid to Ukraine as its war against invading Russian forces drags into its third year. Last week, a tense Oval Office meeting between Trump, Vice President JD Vance and Ukrainian President Volodymyr Zelenskyy left many speculating about the future of U.S. support for Kyiv.Republicans, though, have framed the first few weeks of Trump’s presidency as a laundry list of wins, arguing that he has successfully carried out the will of Americans who elected him to a second nonconsecutive term in office.“If he just stood at the speaker’s rostrum and read off his list of accomplishments since January 20th, we’d be here all night,” House Speaker Mike Johnson said Tuesday. “He’s going to give a truncated version, but there really is so much to celebrate.”Democrats, meanwhile, teed up their reply to Trump’s expected remarks. Senate Democrats held a news conference on the Capitol steps during which lawmakers held up photos of federal workers who had been fired amid the White House’s government agency purges, as well as other Americans who they said had fallen victim to the administration’s policy agenda.“By now, the American people know what to expect from the president, that he will tell you mistruths and falsehoods,” Senate Minority Leader Chuck Schumer said. “But what Donald Trump is incapable of is being straight with the American people about the mess he’s already created in his short time in office.”Schumer argued that there was little for the president to brag about in his remarks set for Tuesday night, pointing to the administration’s new tariffs, rising inflation and potential threats to Medicaid and Social Security.“He promised a golden age,” the Democratic leader said. “One month later, that promise seems like ancient history.”Following Trump’s remarks before the joint session of Congress, Democrats are expected to give a formal rebuttal, which Michigan Senator Elissa Slotkin is expected to deliver. Follow @BenjaminSWeiss Categories / Government, National, Politics Subscribe to Closing Arguments Sign up for new weekly newsletter Closing Arguments to get the latest about ongoing trials, major litigation and hot cases and rulings in courthouses around the U.S. and the world. window.CustomSubstackWidget = { substackUrl: "courthousenews.substack.com", placeholder: "example@gmail.com", buttonText: "Subscribe", theme: "custom", colors: { primary: "#2b3a42", input: "#FFFFFF", email: "#1F1F1F", text: "#FFFFFF", }, }; Additional Reads Judge rules Trump bid to fire employee appeals board chairman illegal March 4, 2025 Arizona’s out-of-state wine restrictions don’t discriminate, Ninth Circuit says March 4, 2025 Justices dump cold water on Mexico push to pin cartel violence on US gunmakers March 4, 2025 First Circuit debates whether running water is a constitutional right March 4, 2025'''
