full_description = '''(CN) — A three-judge panel of the Fifth Circuit Court of Appeals on Monday grilled attorneys for environmental activists and the state of Louisiana over the constitutionality of a Louisiana law restricting protests near pipelines."This is no ordinary trespass statute of the kind that U.S. courts have been accustomed to dealing with for over 200 years," attorney Baher Azmy with the Center for Constitutional Rights, a progressive legal group, told the judges. Azmy argued the law chills speech and is unconstitutionally vague because it doesn't properly define what the "premises" of a pipeline is."Its scope, covering 125,000 miles of frequently unmarked and underground pipelines, including on public property; its vagueness, lacking any of the limiting features of the neighboring statutory provisions which require complete enclosure, and which has led the defendants in this case to take four different positions on the [definition of] premises and the district court to define it two different ways, and then its criminal consequences producing a felony conviction, not for damage or obstruction, but for mere presence, make this unconstitutional," the attorney told the panel.Louisiana law makes it a felony to enter the premises of "critical infrastructure" without authorization. In 2018, Louisiana became one of several states to add pipelines to its definition of critical infrastructure. The plaintiffs argue that the law is unconstitutionally vague, as pipelines — unlike other categories of critical infrastructure under Louisiana law like power plants and water treatment facilities — do not have a clearly defined "premises." They also claim the law was passed to prevent anti-pipeline protests in violation of the First Amendment.U.S. Circuit Judge Cory Wilson, a Donald Trump appointee, pointed out that the statute only criminalizes a person's presence on critical infrastructure if they refuse to leave after an authorized person tells them to do so, but Azmy said that if the statute is unconstitutional then no one is authorized to tell the person to leave.U.S. Circuit Judge Stephen Higginson wondered if the law could criminalize a landowner protesting on their own property, and pointed out that in the case of two of the plaintiffs, who were arrested for protesting at a pipeline construction site, a Louisiana court later found that the pipeline company was actually the one trespassing on the landowners' property.The court found the company failed to either get permission from all of the property's owners to build on the property or obtain an expropriation order from a court.Autumn Patterson, a lawyer representing the Louisiana Attorney General, said that it would depend on whether they were standing in the pipeline's right-of-way. "That means they misread the same [property] records that you are saying would tell all the rest of us [whether someone is trespassing]," Higginson, a Barack Obama appointee, said. "The very person who said, 'I've got trespassers on my easement,' turned out they were the trespasser. How can that then give somebody notice if they couldn't get it right?""I think the fact that a law has potentially been applied improperly in one instance is not enough to show that the unlawful application would actually outweigh the law," Patterson said.The law emerged amid a surge of protests against fossil fuel pipelines, primarily driven by Native American advocates concerned over the environmental impact of pipelines as well as potential damage to sacred Indigenous sites.Shortly after the law took effect, several activists were arrested for protesting the construction of the Bayou Bridge Pipeline in southern Louisiana and charged with violating the law. Although the local district attorney later announced they wouldn't be prosecuted, two of the activists and a journalist who was arrested while covering the protests, along with several other plaintiffs, sued in 2019 over the constitutionality of the law.In March 2024, U.S. District Judge Robert Summerhays in the U.S. District Court for the Western District of Louisiana ruled the law is not unconstitutional. Summerhays, a Donald Trump appointee, found that the statute only applies to people who trespass on private property or non-public forums. The plaintiffs challenge this interpretation, arguing that nothing in the text of the law suggests it's limited to private property.U.S. Circuit Judge James Graves, an Obama appointee, joined Higginson and Wilson on the panel. Categories / Appeals, Energy, Environment, First Amendment Subscribe to Closing Arguments Sign up for new weekly newsletter Closing Arguments to get the latest about ongoing trials, major litigation and hot cases and rulings in courthouses around the U.S. and the world. window.CustomSubstackWidget = { substackUrl: "courthousenews.substack.com", placeholder: "example@gmail.com", buttonText: "Subscribe", theme: "custom", colors: { primary: "#2b3a42", input: "#FFFFFF", email: "#1F1F1F", text: "#FFFFFF", }, }; Additional Reads Fired coach’s suit lives on February 28, 2025 New stove that plugs into a normal wall outlet could be major gain for health and the climate February 28, 2025 California pins hopes on March to bolster snowpack February 28, 2025 11th Circuit orders new sentence for Grindr attacker February 28, 2025'''
