["https://www.courthousenews.com/computer-simulations-show-nightmare-atlantic-current-shutdown-less-likely-this-century"]
title = "Computer simulations show nightmare Atlantic current shutdown less likely this century | Courthouse News Service"
description = "We are updating our Terms of Use. Please carefully review the updated Terms before proceeding to our website."
full_description = '''(AP) — The nightmare scenario of Atlantic Ocean currents collapsing, with weather running amok and putting Europe in a deep freeze, looks unlikely this century, a new study concludes.In recent years, studies have raised the alarm about the slowing and potential abrupt shutdown of the Atlantic end of the ocean conveyor belt system. It transports rising warm water north and sinking cool water south and is a key factor in global weather systems. A possible climate change-triggered shutdown of what's called the Atlantic Meridional Overturning Circulation, or AMOC, could play havoc with global rain patterns, dramatically cool Europe while warming the rest of the world and goose sea levels on America's East Coast, scientists predict.It's the scenario behind the 2004 fictionalized disaster movie “The Day After Tomorrow,” which portrays a world where climate change sparks massive storms, flooding and an ice age. Scientists at the United Kingdom's Met Office and the University of Exeter used simulations from 34 different computer models of extreme climate change scenarios to see if the AMOC would collapse this century, according to a study in Wednesday's journal Nature. No simulation showed a total shutdown before 2100, said lead author Jonathan Baker, an oceanographer at the Met Office.It could happen later, though, he said. The currents have collapsed in the distant past.Still, the computer simulations should be “reassuring" to people, Baker said.“But this is no greenlight for complacency,” Baker warned. “The AMOC is very likely to weaken this century and that brings its own major climate impacts.”The Atlantic current flows because warm water cools as it reaches the Arctic, forming sea ice. That leaves salt behind, causing the remaining water to become more dense, sinking and pulled southward. But as climate change warms the world and more fresh water flows into the Arctic from the melting Greenland ice sheet, the Arctic engine behind the ocean conveyor belt slows down. Previous studies predict it stopping altogether with one of them saying it could happen within a few decades.But Baker said the computer models and basic physics predict that a second motor kicks in along the Southern Ocean that surrounds Antarctica. The winds there pull the water back up to the surface, called upwelling, where it warms, Baker said. It's not as strong, but it will likely keep the current system alive, but weakened, through the year 2100, he said.Baker's focus on the pulling up of water from the deep instead of just concentrating on the sinking is new and makes sense, providing a counterpoint to the studies saying collapse is imminent, said Oregon State University climate scientist Andreas Schmittner, who wasn't part of the research.Those Southern Ocean winds pulling the deep water up act “like a powerful pump keeps the AMOC running even in the extreme climate change scenarios,” Baker said.As the AMOC weakens, a weak Pacific version of it will likely develop to compensate a bit, the computer models predicted.If the AMOC weakens but not fully collapses, many of the same impacts — including crop losses and changes in fish stock — likely will still happen, but not the big headline one of Europe going into a deep freeze, Baker said.Scientists measure the AMOC strength in a unit called Sverdrups. The AMOC is now around 17 Sverdrups, down two from about 2004 with a trend of about 0.8 decline per decade, scientists said.One of the debates in the scientific world is the definition of an AMOC shutdown. Baker uses zero, but other scientists who have been warning about the shutdown implications, use about 5 Sverdrups. Three of Baker's 34 computer models went below 5 Sverdrups, but not to zero.That's why Levke Caesar and Stefan Rahmstorf, physicists at the Potsdam Institute for Climate Research and authors of an alarming 2018 study about potential shutdown, said this new work doesn't contradict theirs. It's more a matter of definitions.“An AMOC collapse does not have to mean 0 (Sverdrups) overturning and even if you would want to follow that definition one has to say that such a strong AMOC weakening comes with a lot (of) impacts,” Caesar wrote in an email. “The models show a severe AMOC weakening that would come with severe consequences.” ___BY SETH BORENSTEIN AP Science Writer Categories / Environment, International, Science Subscribe to Closing Arguments Sign up for new weekly newsletter Closing Arguments to get the latest about ongoing trials, major litigation and hot cases and rulings in courthouses around the U.S. and the world. window.CustomSubstackWidget = { substackUrl: "courthousenews.substack.com", placeholder: "example@gmail.com", buttonText: "Subscribe", theme: "custom", colors: { primary: "#2b3a42", input: "#FFFFFF", email: "#1F1F1F", text: "#FFFFFF", }, }; Additional Reads Save the sand-verbena moth February 26, 2025 Romania prosecutors indict far-right election candidate February 26, 2025 BP ditches climate targets in pivot back to oil and gas February 26, 2025 Iran significantly increased stocks of highly enriched uranium: IAEA February 26, 2025'''
