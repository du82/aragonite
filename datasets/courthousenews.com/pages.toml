title = "‘BRAVE Cave’ suit proceeds | Courthouse News Service"
description = "BATON ROUGE, La. — A Louisiana federal court declined to dismiss civil rights claims brought by a grandmother who was detained and subjected to a body-cavity strip-search by cops at an unofficial police warehouse near Baton Rouge dubbed the “BRAVE Cave.” The court says the police detained the woman without probable cause and conducted the search with neither reasonable suspicion nor probable cause, which prevents the officers from pleading immunity."
