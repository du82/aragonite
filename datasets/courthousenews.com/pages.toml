title = "Privacy Policy | Courthouse News Service"
description = "This policy describes how Courthouse News Service (“Courthouse News”) collects, uses, discloses, and safeguards personal information in various contexts, both online and offline, including when you access or use our websites, or any other services that link to this privacy policy, or communicate with us. This Privacy Policy also tells you about your rights and"
full_description = "This policy describes how Courthouse News Service (“Courthouse News”) collects, uses, discloses, and safeguards personal information in various contexts, both online and offline, including when you access or use our websites, or any other services that link to this privacy policy, or communicate with us. This Privacy Policy also tells you about your rights and choices with respect to your personal information, and how you can reach us to get answers to your questions.You can jump to particular topics by going to the headings below: Types Of Information We Collect Sources of Information Use And Processing Of Information Disclosure Of Information Your Rights & Choices How We Protect Personal Information How Long We Retain Personal Information Authorized User Accounts Other Important Information Contact Information Types Of Information We Collect “Personal information” refers to information that identifies, relates to, describes, or can be associated with you. The following provides examples of the type of information that we collect, and have collected in the preceding 12 months, and how we use that information. Context Types of Data Primary Purpose for Collection and Use of Data CasePortal Registration We collect basic identifying and contact information, such as your name, phone number (optional), profile photo (optional), and contact information when you register as an authorized user of CasePortal. We also collect information relating to the actions that you perform while logged into your account. We have a legitimate interest in providing account-related functionalities to our users and performing contract with you for the provision of our services. Browsing Activity and Website Usage When you visit our websites, we collect certain information about how you use and navigate our websites, such as which links you click on, which pages or content you view, and other similar information or statistics. We also collect technical and identifying information about your device, operating systems, Internet Protocol (IP) address (a number that is automatically assigned to a computer when the Internet is used), domain name, click-activity, referring website, and/or a date/time stamp for visitors, and web browser type. We have a legitimate interest in making our websites operate efficiently and monitoring our networks and the visitors to our websites. Among other things, it helps us understand which of our services is the most popular. We also have an interest in detecting and preventing fraud. Subscriber Information We collect basic identifying and contact information, such as the name and contact information of our subscribers and their employees with whom we may interact. We also collect billing information. We use this information to perform our contract with you to provide you with the products and/or services you request. We have a legitimate interest in contacting our subscribers and communicating with them concerning normal business administration such as subscription services and billing. Correspondence with Customer Service If you contact our customer service team, such as by email or phone, we generally collect basic identifying and contact information, such as your name, employer, email address, telephone number, and any other information you choose to provide. We have a legitimate interest in managing customer relations with respect to any requests for information or complaints that we receive. We also have a legitimate interest in responding to inquiries related to support, employment opportunities, and other requests. Cookies and first party tracking We use cookies, web beacons, clear GIF, pixels, internet tags, and other similar tracking technologies (collectively “tracking technologies”) to monitor how you interact with our websites. This may include which links you click on or identifying information about your device or browser. See our Cookies and Similar Tracking Technologies section below for more information. We have a legitimate interest in making our websites operate efficiently, providing account-related functionalities, understanding how you interact with our websites to better improve them, and maintaining security standards. We also have an interest in detecting and preventing fraud. Cookies and Third-Party Tracking We collect information about your internet activity and certain device identifiers so that we can provide advertising about products and services tailored to your interests on our websites, or on other websites. See our Cookies and Similar Tracking Technologies section below for more information. We have a legitimate interest in engaging in behavior-based advertising and capturing website analytics. Where required by law, we will obtain your consent for the deployment of cookies on our websites. Feedback/Support If you provide us feedback or contact us for support we will collect your name and e-mail address, as well as any other content that you send to us, in order to reply. We have a legitimate interest in receiving, and acting upon, your feedback or issues. Mobile Devices We collect information from your mobile device such as unique identifying information broadcast from your device when visiting our website. We have a legitimate interest in identifying unique visitors, and in understanding how users interact with us on their mobile devices. Newsletters and Communications When you subscribe to our newsletter or sign up to receive special alters, we collect your email address. We may also collect certain information about how you interact with the emails and promotional messages we send you. We share information with individuals that consent to receive such information. We also have a legitimate interest in sharing information about our reporting, as well as understanding how users interact with our communications. Surveys When you participate in a survey we collect information that you provide through the survey. If the survey is provided by a third party service provider, the third party’s privacy policy applies to the collection, use, and disclosure of your information. We have a legitimate interest in understanding your opinions, and collecting information relevant to our organization. Sources of Information We collect your personal information in the following ways, pursuant to applicable law: Directly From You, when you engage with our websites, register for an account, contact us, respond to a survey, sign up to receive emails, text messages, and/or postal mailings. Through Our Use of Cookies and Other Automatic Data Collection Technologies, when you visit our websites, open or click on emails we send you, or interact with our advertisements. We or third parties we work with automatically collect certain information using technologies such as cookies, web beacons, clear GIF, pixels, internet tags, web server logs, and other data collection tools. For more information, please see the “Cookies and Similar Tracking Technologies” section below. From Our ThirdParty Partners, including from third parties that we have partnered with to provide you the products and services that you have requested from us. Other Sources, including data analytics providers or publicly available sources. Cookies & Similar Tracking TechnologiesWe use cookies and similar tracking technologies, including pixel tags or web beacons (collectively “cookies”), to collect certain information on our websites, and through our services. We also permit certain third parties to use cookies and similar tracking technologies to collect information about your use of our websites. The information collected by these tracking technologies may include (a) your internet protocol (IP) address, unique device identifiers, location, browser type, and Internet service provider information; (b) information about when and how you access and use our websites, such as the domains you visit, what features you used and for how long, the website that referred you to us, and date/time stamps associated with your usage; (c) information about the device you use to access the websites such as device type, device ID, and device/browser settings; and (d) location of the device used to access the websites derived from GPS or WiFi use.We differentiate between cookies that are essential for the technical features of our services and optional analytics and advertising cookies. Cookie Type Description Essential Cookies These are cookies that our websites need in order to function, and that enable you to move around our websites and features. Without these essential cookies, our websites will not perform as smoothly for you as we would like them to and we may not be able to provide certain services or features you request. Examples of where these cookies are used include to determine when you are signed in, to determine when your account has been inactive, and for other troubleshooting and security purposes. Analytics Cookies Analytics cookies allow us to understand more about how many visitors we have to our websites, how many times they visit us, and how many times a user viewed specific pages within our websites. Although analytics cookies allow us to gather specific information about the pages that you visit and whether you have visited our websites multiple times, we cannot use them to find out details such as your name or address. We use Google Analytics. For more information about Google Analytics, please refer to “How Google Uses Information From Sites or Apps that Use Our Services,” which can be found at www.google.com/policies/privacy/partners/, or any other URL Google may provide from time to time. Advertising Cookies Depending on your location and in certain circumstances, we may work with third-party online or mobile network advertisers that use cookies to help us manage advertising and measure its effectiveness. These cookies enable third-party ad networks to recognize a unique cookie on your computer or mobile device and may be placed by us or our network advertising firm that works with our third-party network advertiser. The information that is collected and shared by cookies may be linked to the device identifier of the device you are using to allow us to keep track of all the sites you have visited that are associated with the ad network. This information may be used for the purpose of targeting advertisements on our websites and third-party sites based on those interests. Depending on your location and applicable laws, we may give you the option of adjusting your preferences with regard to the advertising cookies we use. Where this option is available, you can configure your personal settings by clicking the “Do Not Share or Sell or Share My Personal Information” link (discussed below in the Your Rights & Choices section), or via other options that may be available on the relevant website in your specific locations.Use And Processing Of Information In addition to the purposes and uses described above, we use information in the following ways: To identify you when you visit our website. To provide products and services. To administer, maintain, evaluate, and improve our websites and services, and to develop new products and services. To streamline the subscription process. To conduct research and analytics, including improving our services and product offerings. To respond to inquiries related to support, employment opportunities, or other requests. To send marketing and promotional materials, including information relating to our products and services. To detect security incidents, and to investigate, prevent, or take action regarding possible malicious, deceptive, fraudulent, or illegal activity, including attempts to manipulate or violate our policies, procedures, and terms and conditions. To comply with legal obligations, to establish or exercise our rights, and to defend against a legal claim. To provide and maintain the functionality of our website, including identifying and repairing errors or problems. For internal administrative purposes, to manage our business operations, to perform our obligations and exercise our rights under any agreement that you or your organization has with us. Although the sections above describe our primary purpose in collecting your information, in many situations we have more than one purpose. Our collection and processing of your information is based in different contexts upon your consent, our need to perform a contract, our obligations under law, and/or our legitimate interest in conducting our business.Disclosure Of Information In addition to the specific situations discussed elsewhere in this policy, we disclose information in the following situations: Acquisitions. If another company acquires, or plans to acquire, our company, business, or our assets, we will disclose information to that company, including at the negotiation stage. Other Disclosures With Your Consent. We may ask if you would like us to disclose your information to other unaffiliated third parties who are not described elsewhere in this policy. Compliance with Law or Other Legal Process. We may disclose personal information to third parties in response to subpoenas, warrants, court orders, or other requests from legal or regulatory authorities; in connection with any legal process; or to comply with relevant legal, regulatory or treaty obligations. We may also disclose your personal information in order to establish or exercise our rights, to defend against a legal claim, to investigate, prevent, or take action regarding possible illegal activities, suspected fraud, safety of person or property, or a violation of our policies. Public Forums. Some of our websites may provide the opportunity to post comments in a public forum. If you decide to submit information on these pages, that information may be publically available. Service Providers. We may disclose your information to service providers. Among other things service providers may help us to administer our website, provide technical support, process payments, and assist in the fulfillment of services. De-identified Personal Information. We may disclose or use aggregated or de-identified data for any lawful purpose. De-identified information is generally not considered to be Personal Information under applicable laws. Your Rights & Choices Pursuant to applicable data protection law, you can make the following choices regarding your personal information: Access to Your Personal Information. You have the right to request access to the personal information we hold about you, along with other information such as the purposes of the processing, the recipients or categories of recipients to whom the personal information has been or will be disclosed, the sources of the personal information, retention, transfers of personal information, and a list of third party recipients of personal information that we process. If required by law, upon request, we will grant you with r"
