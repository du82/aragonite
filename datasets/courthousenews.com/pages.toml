["https://www.courthousenews.com/thomas-alito-dissent-as-scotus-refuses-to-review-free-speech-concerns-over-university-bias-response-teams"]
title = "Thomas, Alito dissent as SCOTUS refuses to review free speech concerns over university ‘bias response’ teams | Courthouse News Service"
description = "Dissenting Justices Clarence Thomas and Samuel Alito said the court ultimately will need to intervene on a controversial free speech issue at universities across the country."
full_description = '''(CN) — The Supreme Court on Monday declined to rule on the constitutionality of college bias response teams, but two justices argued that the high court soon will need to solve the issue that has split federal appeals courts.In a dissenting opinion Justice Clarence Thomas noted that more than 450 U.S. colleges and universities have "bias response teams" that "encourage students to report one another for expressions of 'bias,' and then review and act upon reports." Whether those efforts violate First Amendment rights and chill student speech has split the U.S. Circuit Courts of Appeals. Both Thomas, a George H. W. Bush appointee, and Justice Samuel Alito, a George W. Bush appointee, would have granted the petition for a writ of certiorari. The latter did not elaborate on his reasoning. It was not the first time the two justices have dissented with the majority over concerns that such policies deter students' free speech rights.In the case at hand, Speech First, a group formed by of five Indiana University students who say they hold political views that are unpopular on campus, including on “gender identity, immigration, affirmative action, and the Israel-Palestine conflict.” The group sued Indiana University to prevent it from enforcing its "bias incidents" policy, arguing they are forced to self-censor their views out of fear that others will report them to university officials. They lost at the Seventh Circuit, which agreed with a lower federal court that the students failed to show they faced an "objectively reasonable chilling effect" on their speech or a credible threat of discipline. For Thomas, "This case presents an opportunity to resolve an important Circuit split." The Fifth, Sixth and 11th Circuits have held that bias response teams do objectively chill students’ speech, while the Fourth and Seventh Circuits determined they don’t.The Seventh Circuit also sided against Speech First in the dismissal of a separate suit against the University of Illinois at Urbana-Champaign, holding that the college's bias response team itself could not sanction students, and its meetings were technically optional."The Seventh Circuit’s approach is also very likely wrong," Thomas added.Defining ‘bias’ Under the challenged Indiana University policy behind Monday's ruling, after a student files a bias incident report, its team reviews the submission — then can either invite the student reported for an offensive comment to attend a meeting to discuss their behavior, or refer the affected student to support services.However, the university loosely defines the term “bias incidents” to include "any conduct, speech, or expression, motivated in whole or in part by bias or prejudice meant to intimidate, demean, mock, degrade, marginalize, or threaten individuals or groups based on that individual or group’s actual or perceived identities."“Unsurprisingly, such an expansive policy has prompted students to report any and all perceived slights," Thomas wrote. Thomas pointed to examples of reports from students that included a Facebook post featuring a picture of a sticker that said "Diversity Divides Nations," and another complaint about a student's comments expressing dislike for "China" or "Chinese things."While the bias response team doesn't discipline students or conduct formal investigations, it does assess whether there have been “potential violations of university policy and/or criminal law.” If so, the team can refer the matter to other campus offices with disciplinary power. The team also logs all reports in a database, which it tracks for trends."Given the number of schools with bias response teams, this court eventually will need to resolve the split over a student’s right to challenge such programs. The court’s refusal to intervene now leaves students subject to a 'patchwork of First Amendment rights,' with a student’s ability to challenge his university’s bias response policies varying depending on accidents of geography," Thomas wrote. "Because one of our 'primary functions is to resolve ‘important matter[s]’ on which the courts of appeals are ‘in conflict,' we should not let this confusion persist," he added. Follow @Megwiththenews Categories / Uncategorized Subscribe to Closing Arguments Sign up for new weekly newsletter Closing Arguments to get the latest about ongoing trials, major litigation and hot cases and rulings in courthouses around the U.S. and the world. window.CustomSubstackWidget = { substackUrl: "courthousenews.substack.com", placeholder: "example@gmail.com", buttonText: "Subscribe", theme: "custom", colors: { primary: "#2b3a42", input: "#FFFFFF", email: "#1F1F1F", text: "#FFFFFF", }, }; Additional Reads Contributor-Test-Post-2025-03-03 March 3, 2025 Contributor-Test-Post-2025-03-03 March 3, 2025 Contributor-Test-Post-2025-03-03 March 3, 2025 Contributor-Test-Post-2025-03-03 March 3, 2025'''
