["https://www.courthousenews.com/sidebar-season-five-episode-1-the-war-for-infowars"]
title = "Sidebar: The war for Infowars | Courthouse News Service"
description = "In the quest by Sandy Hook families to collect on judgments against Alex Jones in Texas and Connecticut, Jones has turned those historic defamation cases into a blockbuster bankruptcy case, putting his very own platform, Infowars, on the line."
full_description = '''Welcome back, listeners, to our humble show’s fifth season.As America welcomes a new president, a particular media company welcomes a new owner. Well, almost.That's why we're here to guide you through the uncertainty of a certain bankruptcy process, promising to determine who will own one of the nation’s most controversial media companies, one whose name sums it all up with a bow: Infowars.Despite over a billion dollars in defamation judgments, Alex Jones remains vocal online as he continues to operate his media empire while a bankruptcy court determines its future owner.Will satirical news outlet The Onion eventually wrest control away from Jones? And what sort of implications does the case have on disinformation and free speech? All we know is the battle for Infowars is far from over. Special guests: Dan Friesen, co-host of the Knowledge Fight podcast Christopher Hampson, professor of law at the University of Florida Nolan Higdon, critical media literacy scholar and lecturer at the University of California Santa Cruz Sidebar tackles the top stories you need to know from the legal world. Join reporters Hillel Aron, Kirk McDaniel, Amanda Pampuro, Kelsey Reichmann and Josh Russell as they take you in and out of courtrooms in the U.S. and beyond and break down developments to help you understand how they affect your day-to-day life.This episode was produced by Kirk McDaniel. Intro music by The Dead Pens. A transcript is available.Editorial staff is Ryan Abbott, Sean Duffy and Jamie Ross. Special thanks to Cameron Thompson.More on the bankruptcy proceedings: Judge green lights liquidation of Alex Jones’ personal assets Alex Jones asks bankruptcy judge to disqualify The Onion’s bid for Infowars assets The Onion snatches up Alex Jones’ Infowars IP, online store assets at auction Categories / Courts, Media, Podcast Subscribe to Closing Arguments Sign up for new weekly newsletter Closing Arguments to get the latest about ongoing trials, major litigation and hot cases and rulings in courthouses around the U.S. and the world. window.CustomSubstackWidget = { substackUrl: "courthousenews.substack.com", placeholder: "example@gmail.com", buttonText: "Subscribe", theme: "custom", colors: { primary: "#2b3a42", input: "#FFFFFF", email: "#1F1F1F", text: "#FFFFFF", }, }; Additional Reads Chief Justice Roberts lets US foreign aid bills go unpaid as SCOTUS considers Trump appeal February 26, 2025 Top House Republican remains noncommittal as lawmakers expand crusade against federal judges February 26, 2025 California state senator bids farewell to X, cites ‘extremist content’ and unending spam posts February 26, 2025 Wisconsin appeals court shuts down state-funded college grant program for minority students February 26, 2025'''
