["https://www.courthousenews.com/author/alan-riquelmy"]
title = "Alan Riquelmy | Courthouse News Service"
description = "We are updating our Terms of Use. Please carefully review the updated Terms before proceeding to our website."
full_description = '''Alan Riquelmy / February 26, 2025 The group says "Operation Return to Sender" terrorized a predominantly Latino community in Southern California in early January. Alan Riquelmy / February 26, 2025 State Senator Scott Wiener joins a growing number of people who say they've left Elon Musk's social media site. Alan Riquelmy / February 25, 2025 The U.S. magistrate judge overseeing the case gave the plaintiffs leave to amend their complaint. We are updating our Terms of Use. Please carefully review the updated Terms before proceeding to our website. Alan Riquelmy is a writer with 20 years of experience in the newspaper and online publishing industry. Alan has worked in a variety of fields since he graduated the University of Montevallo with a bachelor's of English and a minor in history. Immediately after graduating, he worked for Southern Progress Corporation, which publishes magazines such as “Southern Living.” His name has appeared in the masthead for “Cooking Light,” another publication of SPC. An opportunity then opened with “Hecklers Entertainment,” an Internet start-up. Alan worked with a team on antagonist.com, a now defunct website that reviewed video games across several platforms, ran online games for its readers and built a community through online chats and message boards. Alan then worked in Japan for 18 months, teaching English in a suburb of Osaka. While overseas, Alan taught in classrooms and open discussion settings. Returning home after his stint overseas, Alan began working in the newspaper industry. Alan has covered local and state governments, cops, courts on local, state and the federal levels and general assignment. He's worked at newspapers in Selma, Alabama; Rome, Georgia; Columbus, Georgia; and most recently Grass Valley, California. Alan served as a Sunday editor in Columbus and became adept at drawing readers to the paper's website through headlines, content and search engine optimization. His stories routinely appeared in the top 10 of each month's page views. Alan chose to return to Rome, Georgia, after working in Columbus. Spending almost another three years in Rome, Alan then relocated to California. He's served as the county government reporter, city editor, managing editor and editor for The Union newspaper in Grass Valley. After 20 years in journalism, Alan transitioned to a trade association. However, the pull toward journalism proved strong and within months Alan had returned to the industry. He's currently serving as a reporter for Courthouse News Service.'''
