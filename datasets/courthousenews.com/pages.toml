full_description = "Clinical trials corner-cutting Brief / February 25, 2025 SAN JOSE, Calif. — Investors may proceed with the bulk of their securities claims against an oncology firm that allegedly misled them regarding the future of its drug candidate, milademeta. The firm skipped Phase 2 of clinical trials for the drug, increasing the chances that the drug would fail during its Phase 3 trial — which it did, causing the price of shares to drop from $9.93 to $1.22. Robinhood says SEC has closed its investigation into the company Associated Press / February 24, 2025 The crypto industry, which complained of unfair treatment by former SEC chairman Gary Gensler, spent heavily to help elect Donald Trump and other crypto-friendly lawmakers. Brief / February 10, 2025 BROOKLYN — A New York federal court allowed a putative securities class action to proceed against Gaotu, a Chinese online tutoring company, which allegedly misrepresented the impact that China’s after-school tutoring regulations would have on its business; such firms can no longer raise capital or go public. Notably, several of the company’s officials helm an advisory group for a foreign company that sold nearly $140 million in Gaotu stock, suggesting they were aware of how the regulations would affect the firm’s fortunes. Brief / January 28, 2025 BOSTON — The maker of Roomba consumer cleaning robots prevailed over a class action brought in Massachusetts federal court by an investment firm, which accused iRobot of refusing to inform investors of questions sent by the European Commission to Amazon related to its since-abandoned merger with iRobot. Even if iRobot’s agents made misleading statements, the investment firm could not show they did so knowingly. Kayla Goggin / January 17, 2025 The former executive told an 11th Circuit panel he would not have pleaded guilty to charges that landed him in prison for 10 years if he'd received proper legal advice."
