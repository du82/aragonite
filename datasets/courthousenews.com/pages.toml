title = "Influencer Tate brothers, who face human trafficking charges in Romania, arrive in the US | Courthouse News Service"
description = "Andrew Tate has repeatedly claimed that prosecutors in Romania have no evidence against him and that there is a political conspiracy to silence him."
full_description = '''BUCHAREST, Romania (AP) — Influencer brothers Andrew and Tristan Tate, who are charged with human trafficking in Romania, arrived Thursday in the U.S. after authorities lifted travel restrictions imposed as part of the case.A spokesperson for the brothers, Mateea Petrescu, said the two landed in Fort Lauderdale, Florida, around midday.The Tates — who are dual U.S.-British citizens and have millions of online followers — were arrested in late 2022 and formally indicted last year on charges they participated in a criminal ring that lured women to Romania, where they were sexually exploited. Andrew Tate was also charged with rape. They deny the allegations.In December, a court ruled that the case couldn’t go to trial because of multiple legal and procedural irregularities on the part of the prosecutors. The case, however, remained open, and there is also another ongoing investigation against them in Romania. Romania’s anti-organized crime agency, DIICOT, said in a statement Thursday that prosecutors approved a request to change the travel restrictions on the Tates, but didn't say who made the request.The brothers are still required to appear before judicial authorities when summoned. “The defendants have been warned that deliberately violating these obligations may result in judicial control being replaced with a stricter deprivation of liberty measure,” the statement said.A court also ruled on Thursday in favor of an appeal by the Tates to lift the seizure of multiple assets, according to the brothers’ spokesperson, Mateea Petrescu. The assets include six luxury vehicles, land and properties, and company shares. All previously frozen bank accounts have been unfrozen, she said.“While some assets remain under precautionary seizure, this ruling marks a significant step toward justice,” she said.Andrew Tate, 38, a former professional kickboxer and self-described misogynist who has amassed more than 10 million followers on X, has repeatedly claimed that prosecutors in Romania have no evidence against him and that there is a political conspiracy to silence him. He and Tristan Tate, 36, are vocal supporters of U.S. President Donald Trump.The Tates' departure came after Foreign Minister Emil Hurezeanu said this month that a Trump administration official expressed interest in the brothers’ case at the recent Munich Security Conference. The minister insisted no pressure was applied to lift restrictions on the Tates after a Financial Times report on the meeting caused a stir in Romania.The Bucharest Court of Appeal's decision that the Tate case could not proceed was a huge setback for DIICOT, but it didn't mean the defendants could walk free, and the case hasn't been closed.Last August, DIICOT also launched a second case against the brothers, investigating allegations of human trafficking, the trafficking of minors, sexual intercourse with a minor, influencing statements and money laundering. They have denied those charges as well.The Tate brothers' legal battles aren't limited to Romania.Four British women who accused Andrew Tate of sexual violence and physical abuse are suing him in the U.K., after the Crown Prosecution Service decided not to prosecute him.The women said Thursday in a joint statement that they are “in disbelief and feel re-traumatized” by news that the travel restrictions were lifted.Matthew Jury, a lawyer with McCue Jury & Partners, which is representing the women, called the decision to lift the travel ban “disgusting and dismaying.”In March, the Tate brothers appeared at the Bucharest Court of Appeal in a separate case after U.K. authorities issued arrest warrants over allegations of sexual aggression in a case dating back to 2012-2015.The appeals court granted the U.K. request to extradite the Tates, but only after legal proceedings in Romania have concluded.Late last year, a U.K. court ruled that police can seize more than 2.6 million pounds ($3.3 million) to cover years of unpaid taxes from the pair and freeze some of their accounts. Andrew Tate called it “outright theft” and said it was “a coordinated attack on anyone who dares to challenge the system.”___By STEPHEN McGRATH and ANDREEA ALEXANDRU Associated PressMcGrath reported from Sighisoara, Romania. Follow @SeanDuffyCNS Categories / Criminal, Entertainment Subscribe to Closing Arguments Sign up for new weekly newsletter Closing Arguments to get the latest about ongoing trials, major litigation and hot cases and rulings in courthouses around the U.S. and the world. window.CustomSubstackWidget = { substackUrl: "courthousenews.substack.com", placeholder: "example@gmail.com", buttonText: "Subscribe", theme: "custom", colors: { primary: "#2b3a42", input: "#FFFFFF", email: "#1F1F1F", text: "#FFFFFF", }, }; Additional Reads Former mafia associate testifies against Nassau County detective at trial February 26, 2025 Jury in ‘Moana’ copyright trial gets primer on Polynesian, Hawaiian culture on day 1 February 26, 2025 Judge weighs continued freedom for Adnan Syed in ‘Serial’ murder case February 26, 2025 Extradition to Hawaii ordered in 1977 murder case February 26, 2025'''
