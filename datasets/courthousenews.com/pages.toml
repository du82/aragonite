["https://www.courthousenews.com/aid-groups-get-second-try-in-state-department-lawsuit-over-refugee-admissions"]
title = "Aid groups get second try in State Department lawsuit over refugee admissions  | Courthouse News Service"
description = "The State Department canceling contracts with all 10 stateside resettlement agencies the day after a court order preserved refugee admissions was a “remarkable coincidence,” but didn’t exactly violate the order, U.S. District Judge Jamal Whitehead said."
full_description = '''SEATTLE (CN) — Refugees and aid groups on Tuesday asked a federal judge in Seattle to find that the State Department circumvented a court order blocking the government from suspending the country’s refugee program, an argument the judge will consider in additional filings from the plaintiffs — though he determined the action didn’t run afoul of a preliminary injunction issued last week."The timing of the government's decision to terminate the contracts just one day after the preliminary injunction raises serious concerns about what actions are intended to circumvent the court's ruling,” U.S. District Judge Jamal Whitehead said. However, Whitehead found that nothing in his previous order directly prevented the government from canceling its contracts.After President Donald Trump on his first day in office issued an executive order calling for U.S. refugee admissions to come to an abrupt halt, a cohort of refugees and aid organizations that assist with refugee services sued the government. A federal court issued a temporary restraining and then a preliminary injunction, finding the order placed the plaintiffs in concrete irreparable harm. On Wednesday, one day after the court issued a preliminary injunction from the bench — but before the written order was filed on Friday — the State Department sent termination notices to contractors processing refugee admissions, effectively killing the U.S. Refugee Admissions Program, the plaintiffs argued in a motion for an emergency conference. “Taken 24 hours after a preliminary injunction hearing in this case took place, where the court made clear its intention to ‘preserve the status quo’ prior to January 20, 2025, these actions violate the Refugee Act, the [Administrative Procedure Act], and regulatory requirements,” the aid organizations wrote. Whitehead called the timing of the notices a “remarkable coincidence” and questioned Justice Department attorney August Flentje about the intent.“Tell me, why did the State Department issue termination notices to these resettlement agencies the very day after the court issued its preliminary injunction dealing with suspension of USRAP funding?” Whitehead asked.Flentje told the court that the timing hinged on a related case being litigated in Washington, D.C.Church World Service and HIAS, two of the three plaintiff aid organizations, both received emailed termination notices saying the cooperative agreements that fund U.S. Refugee Admissions Program activities were being terminated for the “convenience of the U.S. government.”The aid organizations said all 10 resettlement agencies that provide reception and placement services received nearly identical notices canceling their agreements with the government. “By their plain language, these termination notices appear to supersede the notices of suspension to the resettlement agencies issued on Jan, 24, 2025, and effectively make permanent the allegedly temporary — albeit ‘catastrophic’ — suspension of millions of dollars in funding to the [U.S. Refugee Admissions Program],” the plaintiffs argued in the motion. In a preliminary injunction order, Whitehead said the executive order “effectively nullifies” the congressionally-established program. “Though the executive enjoys considerable latitude to suspend refugee admissions, that discretion is not boundless,” the Joe Biden-appointed judge wrote. He also described the highly regulated process that is applying for admission to the country as a refugee. Only certain refugees who are determined to be of special humanitarian concern to the country are eligible, and multiple procedural steps follow once eligibility is determined.The executive order asserted that the country “lacks the ability to absorb large numbers of migrants, and in particular, refugees, into its communities in a manner that does not compromise the availability of resources for Americans, that protects their safety and security, and that ensures the appropriate assimilation of refugees.”It was slated to take effect on Jan. 27, but it was implemented immediately, literally and figuratively stranding thousands of refugees who were in the process of resettling in the United States. The aid organizations working with the government to provide services to refugees were also left without reimbursement, with millions owed dating back to the latter months of 2024. Whitehead found that the order unlawfully overrode the U.S. Refugee Admissions Program in its entirety, allowing Trump to determine when allowing refugees in the country aligns with the interests of the United States without setting a timeline or criteria on that decision.“Given these terms, President Trump could effectively suspend [U.S. Refugee Admissions Program] permanently based solely on his judgment about American interests,” Whitehead wrote. Under the terms of the preliminary injunction, the government is barred from enforcing or implementing the executive order. This includes suspending refugee processing, decisions and admissions as well as withholding reimbursements to resettlement partners for work performed before Jan. 20. Congress enacted the Refugee Act in 1980. It details the policies and procedures governing refugee admission and resettlement in the country known collectively as the U.S. Refugee Admissions Program. The act allows the president to determine the number of refugees the country can admit in a year. Late last year, former President Joe Biden set that number at 125,000 for fiscal year 2025. In 2024, just over 100,000 refugees were admitted. Follow @kndrleon Categories / Government, Immigration, Law, National Subscribe to Closing Arguments Sign up for new weekly newsletter Closing Arguments to get the latest about ongoing trials, major litigation and hot cases and rulings in courthouses around the U.S. and the world. window.CustomSubstackWidget = { substackUrl: "courthousenews.substack.com", placeholder: "example@gmail.com", buttonText: "Subscribe", theme: "custom", colors: { primary: "#2b3a42", input: "#FFFFFF", email: "#1F1F1F", text: "#FFFFFF", }, }; Additional Reads California AI sextortion bill passes first legislative hurdle March 4, 2025 Lawmakers sound off on Trump tariffs as trade war begins March 4, 2025 Republicans roll out red carpet for Trump ahead of joint address to Congress March 4, 2025 Judge rules Trump bid to fire employee appeals board chairman illegal March 4, 2025'''
