["https://courts.ca.gov/programs-initiatives/racial-justice"]
title = "Racial Justice | Judicial Branch of California"
description = "A Judicial Council Initiative to Promote Diversity on the Bench"
full_description = "Racial Justice Ensuring access, fairness, diversity, and inclusion in the courts. Overview Access, Fairness, Diversity, and Inclusion is the first goal listed in the California Judicial Branch’s Strategic Plan (See all Branch Goals). The branch serves an increasingly diverse population and must ensure access and fairness by being responsive to the state’s cultural, ethnic, socioeconomic, linguistic, physical, gender, sexual orientation, and age diversities. The branch must work to remove barriers, promote inclusion, and remain receptive to the needs of all constituents. Branch efforts in this regard must include: Eliminating bias and the appearance of bias; Meeting the needs of self-represented litigants; Ensuring fair and understandable court procedures; and, Providing socially and culturally responsive programs and services. Finding effective strategies for removing barriers in all case types will require a continued branchwide commitment to innovation, excellence in public service, and strong leadership at local and state levels. In addition, to serve the people of California effectively, public servants in the judicial branch should be representative of the diversity of the state's population and continue efforts to enhance public trust and confidence by working with other branches of government toward a strongly diverse judiciary. Judicial Council Access, Fairness, Diversity, and Inclusion Initiatives Pathways to Judicial Diversity Toolkit A Judicial Council Initiative to Promote Diversity on the Bench Explore the Toolkit Language Access in California’s Courts Our mission is to provide statewide resources for justice partners and court interpreters, promoting equitable access to language services in the courts. Go to Language Access Jury Service and Fairness: Understanding the Challenges of Implicit Bias Video for jurors aligns with Council's strategic plan to promote education on unconscious bias. Watch the Video Judicial Diversity Summit Stronger Together: Judicial Diversity Summit was the fourth summit in the series focusing on the status of diversity in the California Judiciary and was co-sponsored by the California Judges Association, the California Lawyers Association and the Judicial Council of California. Prior summits were convened in 2006, 2011 and 2016. The 2021 Summit served as a five-year review of accomplishments since 2016 and encouraged open dialogue on key issues and solutions impacting judicial diversity. The 2026 Summit is currently being planned. See Summit Details"
