["https://courts.ca.gov/policy-administration/chief-justice-patricia-guerrero"]
title = "Chief Justice Patricia Guerrero | Judicial Branch of California"
full_description = "Image Chief Justice Patricia Guerrero Chief Justice Patricia Guerrero is the 29th Chief Justice of California. She was sworn into office on January 2, 2023, making history as the first Latina to serve as California’s Chief Justice. About the Chief Justice Chief Justice Guerrero was nominated to office by Governor Gavin Newsom in August 2022, unanimously confirmed by the Commission on Judicial Appointments the same month and overwhelmingly approved by voters in the November 2022 general election. The California State Bar Judicial Nominees Evaluation Commission rated Chief Justice Guerrero as exceptionally well qualified for the position prior to her public confirmation hearing. As Chief Justice, she chairs the Commission on Judicial Appointments and the Judicial Council of California, the administrative policymaking body of the state courts. In her 2024 State of the Judiciary Address, Chief Justice Guerrero highlighted the importance of three-branch solutions to challenging issues, including the use of remote technology and climate change, her concern about partisan attacks on the judiciary, and the evolving issue of generative artificial intelligence. Learn More From California Courts Newsroom Civic Learning & Engagement Chief Justice Guerrero also renewed her commitment to civic learning and engagement with the Judicial Branch Power of Democracy Civic Learning Initiative appointing Administrative Presiding Justice Judith McConnell to serve as the chair to the Initiative with Santa Clara Superior Court Judge Julia Alloggiamento appointed to serve as vice-chair. They will continue to oversee programs including the Civic Learning Awards and Judges in the Classroom, as well as assist with the development of new programs to foster improved civic learning opportunities for California's K-12 students. Learn More About Civic Learning Initiative Legal Career & Life During her legal career, Chief Justice Guerrero has contributed many hours of volunteer work, including as a member of the Advisory Board of the Immigration Justice Project, which promotes due process and access to justice at all levels of the immigration and appellate court system. She has also assisted clients on a pro bono basis in immigration matters, including asylum applications and protecting vulnerable families by litigating compliance with fair housing laws. While a justice on the Fourth District Court of Appeal, Chief Justice Guerrero was chair of the State Bar’s Blue Ribbon Commission on the Future of the Bar Exam and chair of the Judicial Council of California’s Advisory Committee on Criminal Jury Instructions. Chief Justice Guerrero is the daughter of Mexican immigrants and was born and raised in California’s Imperial Valley. She attended the University of California, Berkeley as an undergraduate and earned a Juris Doctor degree from Stanford Law School in 1997. Timeline 2023 Sworn into Office on January 2, 2023 Chief Justice Guerrero was nominated to office by Governor Gavin Newsom in August 2022, unanimously confirmed by the Commission on Judicial Appointments the same month, and overwhelmingly approved by voters in the November 2022 general election. 2022 Joined California Supreme Court She first joined the California Supreme Court as an associate justice in March 2022, making her the first Latina on the state’s high court. 2017 Associate Justice on the Fourth District Court of Appeal In December 2017, her appointment was confirmed as an associate justice on the Fourth District Court of Appeal, Division One in San Diego. 2013 Superior Court of San Diego County From 2013 to 2017, she served as a judge on the Superior Court of San Diego County and was the supervising judge of its Family Law Division in 2017. 2006 Partner at Latham & Watkins LLP 2002 U.S. Attorney’s Office, Southern District of California Served as an assistant U.S. attorney at the U.S. Attorney’s Office, Southern District of California from 2002 to 2003. 1997 Associate at Latham & Watkins LLP Prior to her appointment to the bench, Chief Justice Guerrero worked as an associate at Latham & Watkins LLP starting in 1997. 1997 Earned J.D. from Stanford Law School Chief Justice Guerrero attended the University of California, Berkeley as an undergraduate and earned a Juris Doctor degree from Stanford Law School in 1997. Awards In July 2022, Chief Justice Guerrero was elected to the American Law Institute, an independent national organization that produces scholarly work to clarify, modernize and otherwise improve the law. Chief Justice Guerrero has also received the following awards, prior to and during her time as Chief Justice: Lifetime Achievement – Unity Bar of Yolo County October 2024 Speaker of the Year – Silicon Valley Urban Debate League September 2024 Cruz Reynoso Champion of Justice – California Latino Judges Association September 2024 HERstory Makers – California Legislative Women’s Caucus March 2024 Judge of the Year Award – La Raza Lawyers of Santa Clara County October 2023 Judge of the Year Award – La Raza Lawyers of Santa Clara County June 2023 Latino Spirit Award (Achievement in Law and Public Service) – California Latino Legislative Caucus May 2023 Lifetime Achievement Award – Orange County Hispanic Bar Association March 2023 Justice Cruz Reynoso Community Service Award – Mexican American Bar Association March 2023 California Woman of the Year – USA Today March 2023 STARBlazer Award – Philippine American Business Improvement and Development February 2023 Person of the Year – American Academy of Matrimonial Lawyers January 2023 Trailblazers in the Law – Asian Pacific American Bar Association December 2022 Bernard E. Witkin award for Excellence in the Adjudication of the Law October 2022 Mary V. Orozco Abriendo Caminos (Opening Pathways) Award – Latina Lawyers Bar Association October 2022 Judicial Officer of the Year – American Board of Trial Advocates, San Bernardino/Riverside Chapter October 2022 Judge of the Year – San Diego La Raza Lawyers Association September 2022 Judicial Officer of the Year – San Diego Family Law Bar Association November 2017 Distinguished Jurist Award - American Academy of Matrimonial Lawyers January 2017 Want to Learn More? Learn more about California's Chief Justice in the California Courts Newsroom. Visit California Courts Newsroom"
year_published = 2025
