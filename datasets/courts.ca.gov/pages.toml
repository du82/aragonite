full_description = "Distinguished Service Awards Image Since 1993, the council has recognized outstanding contributions to the administration of justice through the Distinguished Service Awards. These awards honor individuals and organizations who demonstrate unwavering commitment to fair and equal access to justice, thereby advancing the strategic goals of the Judicial Council for the betterment of California’s judicial branch: Access, Fairness, Diversity, and Inclusion Independence and Accountability Modernization of Management and Administration Quality of Justice and Service to the Public Education for Branchwide Professional Excellence Branchwide Infrastructure for Service Excellence Adequate, Stable, and Predictable Funding for a Fully Functioning Branch While the foundational obligations of our court system remain constant, the public service contributions made by individuals have continued to evolve and diversify in scope over the years. For a list of past recipients, visit Distinguished Service Award recipients 1993–2024. The annual nomination cycle typically begins between May and June. Note: Current Judicial Council members are not eligible to receive the Distinguished Service Award."
