["https://courts.ca.gov/programs-initiatives/collaborative-justice-courts/adult-courts/reentry-courts"]
title = "Reentry Courts | Judicial Branch of California"
full_description = 'Reentry Courts Collaborative Justice Courts Adult Courts Community/Homeless Courts Homeless Court Technical Assistance for Courts Drug Courts DUI Courts Mental Health Courts Reentry Courts Veterans Treatment Courts Grants/Funding Juvenile Collaborative Courts How do reentry courts work? Although reentry courts operate slightly different across counties, the following program components are common to reentry courts in California. The reentry court team makes decisions about a participant’s court case. Reentry court teams are led by the judge and usually includes a defense attorney, a prosecutor, a parole agent, a probation officer, and treatment staff and/or case managers. Reentry court participants are assessed for their risk of re-offending and treatment needs. This information is used to create supervision and treatment plans. The program connects participants to a variety of supports including mental health treatment, substance use treatment, and housing. Participants attend scheduled court sessions usually one to four times a month to discuss their progress. The court can recommend early discharge from community supervision when a participant successfully completes the program. Participants usually stay in the program for approximately 12-18 months. Expand all Close all 2016 Reentry Court Roundtable The one-day session convened judges, probation and parole officers, service providers and criminal justice partners to explore lessons learned, differences between parole and probation, evaluation and research as well as strengthening partnerships. Materials and Resources The resources and materials distributed during and after the “Reentry Court Roundtable” are included here for your use. It includes articles, faculty PowerPoint presentations, model court documents and forms, information covering funding services and programs and a roster of attendees Additionally, we have attached a Department of Health Care Services flier, which answers frequently asked questions, defines case management services, and who might be eligible to, in limited circumstances, receive payment for providing those services. 2014 Reentry Court Summit Click here to view the agenda and faculty materials for the event. A Reentry Court Summit titled "Court Programs and Practices for Working with Reentry, PRCS, and Mandatory Supervision Populations" was held on APRIL 21, 2014 in San Francisco, CA at the offices of the Judicial Council. Invitations were sent to existing programs and to courts interested in starting up a reentry court program. Topics covered included: Parolee Reentry Courts Reentry Courts for the Mandatory Supervision and PRCS populations Affordable Care Act Harlem Reentry Court: National Prospective Innovative Programs that Serve Reentry Populations Probation and Parole Staff Service Providers'
