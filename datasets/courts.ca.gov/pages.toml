["https://courts.ca.gov/about/careers/student-volunteers-and-interns"]
title = "Student Volunteers and Interns | Judicial Branch of California"
full_description = "Student Volunteers and Interns Careers Classification & Salary Lists Employee Benefits Judicial Branch Agencies Student Volunteers and Interns Superior Courts of California Careers Tips for Job Applicants Ready to embark on your legal career within California's Judicial Branch? Our student programs and internships allow students and volunteers to gain legal experience in the policymaking body of the California courts. Judicial Council Internships Interns take the knowledge and skills learned in the classroom and apply them in real-life work situations, learning from professionals while they explore and experience career options. The Judicial Council offers unpaid internships in all divisions during the fall, spring, and summer academic sessions, when needed. Click on our application portal and search for internship opportunities. Judicial Fellowships This award winning 10-month student internship experience, offered through Sacramento State University, is treated like a full-time role that earns graduate credit, and has been summed up by alumni as “life changing” as it expands your understanding of how our state justice system works. If you have questions regarding the fellowship or the application process, please contact the Sacramento State’s Center for California Studies at (916)-278-6906 or click for more information on the Capital Fellows Program. JusticeCorps The nationally recognized JusticeCorps internship is a part of the AmeriCorps Network whose aim is to expand access to justice for Californians going to civil, small claims, and family law issues courts without an attorney. With both a Graduate Fellows program as well as a Student Members program – open to a variety of majors in and outside of law, you can participate at the level that fits your life. Ready to apply? Learn more about our process."
