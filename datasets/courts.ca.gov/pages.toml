title = "Programs & Initiatives | Judicial Branch of California"
full_description = "Image Programs & Initiatives Welcome to the California Courts Programs and Initiatives. This section features Judicial Council programs and activities designed to enhance the quality of justice in California's courts. Families & Children Learn about programs that serve the diverse needs of children, youth, parents, families, and other users of the California courts. Image Family Law The Center for Families, Children & the Courts (CFCC) work to assist courts in handling a variety of case types including family law. Family Court Services Child Support Services Access to Visitation Learn More About Family Law Image Juvenile Law Work alongside executives at the state government and contribute to ensuring timely, accessible administration of justice. Delinquency Dependency Learn More About Juvenile Law Image Mental Health Work alongside executives at the state government and contribute to ensuring timely, accessible administration of justice. Adult Civil Mental Health Conservatorship Children, Youth and Families Mental Health Learn More About Mental Health Learn More About Families & Children Collaborative Justice Courts Collaborative Justice Courts, also known as problem-solving courts, combine judicial supervision with rehabilitation services that are rigorously monitored and focused on recovery to reduce recidivism and improve offender outcomes. Adult Courts The collaborative justice model aims to help court program participants reduce recidivism and improve offender outcome. Community/Homeless Courts Drug Courts DUI Courts Homeless Court Technical Assistance for Courts Mental Health Courts Reentry Courts Veterans Treatment Courts Learn More About Adult Courts Juvenile Courts Collaborative courts may be used in lieu of the delinquency court process to receive treatment and court supervision. DUI Court in Schools Girls’ Courts/CSEC Courts Juvenile Drug Courts Juvenile Mental Health Courts Peer/Youth Courts Youth Domestic Violence/Dating Courts Learn More About Juvenile Courts Grants / Funding Supporting grants and court programs across case types like family law, juvenile justice, and criminal cases Research & Publications The Collaborative Justice Program undertakes research on the collaborative courts of California. Learn More About Collaborative Courts More Programs & Initatives Criminal Justice Collaborative courts may be used in lieu of the delinquency court process to receive treatment and court supervision. Behavioral Health Education and Resources California Pretrial Release Program Community Corrections Performance Incentives Act Data Dashboards: Trends in Felony Court Case Processing MyCitations – Can’t afford to pay your ticket? Proposition 64: The Adult Use of Marijuana Act Prior Reforms Learn More About Criminal Justice Program Tribal/ State The collaborative justice model aims to help court program participants reduce recidivism and improve offender outcome. Tribal Court-State Court Forum Indian Child Welfare Act (ICWA) Family Violence California Tribal Communities Tribal Justice Systems Tribal/State Joint-Jurisdiction Courts Learn More About Tribal/State Alternative Dispute Resolution (ADR) Most civil disputes are resolved without filing a lawsuit, and most civil lawsuits are resolved without a trial. The courts and others offer a variety of Alternative Dispute Resolution (ADR) processes to help people resolve disputes without a trial. Court Outreach Efforts to improve the courts are ongoing and engaging with court leaders and surveying the general public are top priorities. Domestic Violence resources for courts Learn how the Judicial Council is working to develop rules, forms, legislation, provide education to judicial officers and court professionals, and specialized resources for the courts. Facilities See how the Council supports court facilities, including the Supreme Court, the Courts of Appeal, and trial courts by providing a broad range of services from design to security coordination. Learn about current court construction projects, the Facilities Advisory Committee, and how vendors can do business with the courts. Language Access Services Find statewide resources to ensure that limited English proficient (LEP) court users receive meaningful access to language services in the courts. Racial Justice in the Courts California’s judicial branch serves a diverse population and must ensure access and fairness by addressing cultural, ethnic, socioeconomic, linguistic, physical, gender, sexual orientation, and age differences, while being inclusive of everyone. Working With the Courts JusticeCorps Work alongside executives at the state government and contribute to ensuring timely, accessible administration of justice. Judicial Fellowship Program Opportunities through the Judicial Fellowship Program and JUSTICECORPS to participate in the most diverse, complex court system in the nation. Become a Court Interpreter To be a California certified and/or a registered court interpreter, a person must be at least 18 years of age and possess applicable language skills. Find out if a career in court interpreting is right for you. Self-Help Guide The Judicial Council’s Self-Help Guide provides resources and information to those appearing in court without legal counsel. It includes step-by-step guides for following procedures and help with understanding your options to navigate court cases. Visit the Self-Help Guide Image"
