["https://courts.ca.gov/courts/superior-courts/civil-case-coordination"]
title = "Civil Case Coordination | Judicial Branch of California"
full_description = '''Civil Case Coordination Superior Courts Civil Case Coordination Judges Roster Local Rules Reduced Court Services Coordination allows two or more civil actions (cases) that share common questions of fact or law and that are pending in different counties to be joined in one court. When complex actions are sought to be coordinated, a petition to coordinate the actions is submitted to the Chair of the Judicial Council (the Chief Justice), who assigns a motion judge to decide the merits of the petition. If coordination is granted by the motion judge, the Chief Justice assigns a trial judge. The coordination attorney at the Judicial Council administers petitions to coordinate complex actions, at the direction of the Chief Justice. Contact Info Civil Case Coordination Unit 415-865-7630Coordination@jud.ca.gov Defining a Complex Civil Action Rule 3.400 of the California Rules of Court defines a complex civil action. If the actions are complex, a petition is filed with the Chair of the Judicial Council. (Code Civ. Proc., § 404.) If the actions are not complex, a motion to coordinate is filed directly in the court where the actions are to be transferred and where one of the included actions is pending, rather than with the Chair of the Judicial Council. (Code Civ. Proc., § 403.) Some typical complex actions include: Antitrust claims; Construction defect claims involving many parties or structures; Securities claims or investment losses involving many parties; Environmental claims involving many parties; Mass tort claims; and Claims involving class actions. View the Civil Case Coordination Fact Sheet for more information. Judicial Council Coordination Proceedings (JCCP) Log Pursuant to California Rule of Court 3.550(b)(2), the Judicial Council of California maintains a register (log) of complex coordination proceedings for public inspection. Civil Case Coordination 2018 to Present (Last Updated: December 05, 2024) Civil Case Coordination Archive Log 2017 and Older JCCP No: 3216-4961 (Last Updated: December 05, 2024) Frequently Asked Questions What kinds of actions can be coordinated? When is coordination appropriate? What is a complex action? Must all the plaintiffs or all the defendants in one of the actions agree that coordination is appropriate? Are the actions automatically stayed when a petition for coordination is filed? Who can submit a petition for coordination to the chair of the Judicial Council? What are the methods for initiating coordination of complex civil actions? Is there a fee for filing a petition for coordination? What documents does the petitioner submit to the chair of the Judicial Council? Where is a petition for coordination submitted? What documents are filed with the superior court? What is a "Proof of Service of Filing"? How can a petitioner obtain a stay of the actions pending the ruling on the Petition for Coordination? When is an opposition or other response to a petition due? Where is an Opposition to/Support for a petition for coordination sent? Who assigns the coordination motion judge? When coordination has been granted, what is the next step? How is the location of the coordination trial judge selected? After a coordination trial judge has been assigned, what happens next? Once coordination has been granted, how are the documents filed? Once coordination has been granted, what documents are filed with the Judicial Council? Is more information available? What kinds of actions can be coordinated? Coordination brings to one court two or more "civil actions sharing a common question of fact or law [that] are pending in different courts." (Code Civ. Proc., § 404) The statutory reference to "different courts" means courts in different counties. Distinct from coordination is the process of consolidation. Consolidation is the procedure for uniting separate actions involving common questions of fact or law that are pending in the same county. (Code Civ. Proc., §§ 403, 404, 1048(a).) When is coordination appropriate? Not all separate actions sharing common questions of fact or law should be coordinated. Coordination is appropriate if it will promote the ends of justice, taking into account whether (a) the common question of fact or law predominates and is significant to the litigation; (b) the convenience of the parties, witnesses, and counsel; (c) the relative development of the actions and the work product of counsel; (d) the efficient use of judicial resources;(e) the calendar of the courts; (f) the disadvantage of duplicative and inconsistent rulings, orders, or judgments; (g) and the likelihood of settlement without further litigation if coordination is denied. (Code Civ. Proc., § 404.1.) What is a complex action? Rule 3.400 of the California Rules of Court defines a complex civil action. If the actions are complex, a petition is filed with the Chair of the Judicial Council. (Code Civ. Proc., § 404.) If the actions are not complex, a motion to coordinate is filed directly in the court where the actions are to be transferred and where one of the included actions is pending, rather than with the Chair of the Judicial Council. (Code Civ. Proc., § 403.)1 1On September 21, 1996, the statutes and rules were changed so that they now direct parties to file a motion to coordinate noncomplex actions directly with one of the courts in which an action is pending. Must all the plaintiffs or all the defendants in one of the actions agree that coordination is appropriate? For actions involving complex issues, only all the parties plaintiff or all the parties defendant in one of the actions to be coordinated may submit a petition directly to the chair of the Judicial Council. (Code Civ. Proc., § 404.) Are the actions automatically stayed when a petition for coordination is filed? Actions are not automatically stayed upon the filing of a petition to coordinate, but they may be stayed by the coordination motion judge. (Cal. Rules of Court, rule 3.515.) Additionally, no trial of an included action may be started after the court receives an order assigning a coordination motion judge, and a coordination motion judge may stay pretrial proceedings. It takes time-approximately 30 to 60 days-to process the petition for coordination from filing to issuance of an order by the chair of the Judicial Council assigning the coordination motion judge. A motion to stay proceedings may be filed with the petition for coordination. (Cal. Rules of Court, rule 3.515(a).) Who can submit a petition for coordination to the chair of the Judicial Council? A petition for coordination may be submitted by any of the following: A presiding judge of any court in which one of the included actions is pending. All plaintiffs or all defendants to one of the included actions. This means that all the parties on one side of one lawsuit must join in the petition in order to submit the petition directly to the Judicial Council without prior leave of court. Any party to one of the actions, after obtaining an order granting permission from the presiding judge. The party must include the order granting permission when it submits its petition to coordinate to the Chair of the Judicial Council. (Code Civ. Proc., § 404, Cal. Rules of Court, rule 3.520(b).) What are the methods for initiating coordination of complex civil actions? First-time petitioners frequently think that the procedural rule 3.520(b) (of the California Rules of Court) is an alternative to the petition procedure. This is incorrect. The petitioner avoids delay and duplication of effort by petitioning the Judicial Council directly, but the petitioner must satisfy "the all parties plaintiff or defendant rule" set forth in Code of Civil Procedure section 404 in order to do so. In contrast, rule 3.520(b) provides a means to obtain leave of the court to petition for coordination if the rule has not been satisfied. No other coordination procedure exists in the superior court for complex actions pending in more than one county. Is there a fee for filing a petition for coordination? The Judicial Council does not charge a filing fee. What documents does the petitioner submit to the chair of the Judicial Council? A petition packet submitted to the chair of the Judicial Council should contain an original and one copy, and an additional copy plus a self-addressed stamped envelope if a conformed copy is requested, of the following documents: Petition for Coordination; Supporting Memorandum of Points and Authorities; Supporting Declaration (that the actions sought to be coordinated are complex and meet the standards for coordination); and An order from the presiding judge granting permission to submit a Petition for Coordination, if a direct petition is not authorized by Code of Civil Procedure section 404. The following documents must be submitted within five calendar days of submitting the Petition for Coordination: Notice of Submission of Petition for Coordination; Proof of Service of Petition for Coordination, Points and Authorities, Declaration and Notice of Submission on all parties in the included actions; Proof of Service of Petition for Coordination, Points and Authorities, Declaration and Notice of Submission on clerk for filing in each included action; Proof of Filing Notice of Submission of Petition for Coordination in each included action; and Application for Stay Order with proof of service (if a stay is requested from the coordination motion judge). (Cal. Rules of Court, rules 3.510; 3.511; 3.515; 3.521; 3.522; 3.523.) Where is a petition for coordination submitted? A petition for coordination and other required documents are submitted to the Chair of the Judicial Council at the following address: Chair, Judicial Council of California Attn: Appellate Court Services (Civil Case Coordination) 455 Golden Gate Avenue, 5th Floor San Francisco, California 94102-3688 What documents are filed with the superior court? The following documents are filed with the superior court in each included action: Notice of Submission of Petition for Coordination; and Copy of the Petition for Coordination with supporting Memorandum of Points and Authorities and Declaration. (Cal. Rules of Court, rule 3.522.) What is a "Proof of Service of Filing"? Under rule 3.522 of the California Rules of Court, the documents submitted to the Chair of the Judicial Council must demonstrate proof that the Notice of Submission of Petition for Coordination was filed in each included superior court action. Within five calendar days after submitting the Petition for Coordination, the petitioner must submit to the Chair of the Judicial Council proof of filing of the Notice of Submission of Petition and Proof of Service of the Notice of Submission of Petition and of the Petition (Cal. Rules of Court, rule 3.522.). Following are suggested methods for satisfying this requirement: List the clerks of the courts and addresses for each included action on the proof of service by mail. Submit a declaration of service by mail that states under penalty of perjury that the Notice of Submission of Petition for Coordination for the included action was transmitted to the court for filing in that included action. When the court returns a file-stamped copy of the Notice of Submission of Petition for Coordination, send a copy to the chair of the Judicial Council at the address shown above. How can a petitioner obtain a stay of actions pending the ruling on the Petition for Coordination? The stay procedures are described in rule 3.515 of the California Rules of Court. Important factors to note are the following: The Chair of the Judicial Council never issues a stay. There is an automatic stay of trial and stay of entry of judgment when the Chair of the Judicial Council's order assigning a coordination motion judge (or delegating that authority to a presiding judge) is filed in the action unless the trial has already begun (Cal. Rules of Court, rule 3.515.) A stay of anything other than a trial and entry of judgment may be requested and included with the petition for coordination or may be submitted and served at any time before the petition for coordination is determined. Opposition to a stay request must be served on all parties and submitted to the Judicial Council within 10 days after service of the application (Cal. Rules of Court, rule 3.515(a).) An order granting coordination that is filed in an included action acts as a stay of the superior court action, except as directed by the coordination motion judge for urgent matters pending assignment of a coordination trial judge or by the coordination trial judge (Cal. Rules of Court, rule 3.529(b)(c).) As noted above, it takes approximately 30 to 60 days to process a petition for coordination from the date the Judicial Council receives it until the Chair of the Judicial Council assigns a coordination motion judge (or delegates the authority to assign a motion judge to the superior court presiding judge). When a coordination motion judge is assigned, he or she may summarily deny the petition on the ground that trial is imminent (Cal. Rules of Court, rule 3.521(d).) Accordingly, it is usually safer to move to continue a trial in the superior court where the action is pending than to risk delayed assignment of a coordination motion judge, or a summary denial by the coordination motion judge. When is an opposition or other response to a petition due? Any party to an included action who opposes coordination may serve and submit a memorandum and declarations in opposition to the petition. Any response in opposition must be served and filed at least nine court days before the date set for hearing. A response in support is also due at least nine court days before the hearing. (Cal. Rule of Court, rules 3.525; 3.526.) Where is an Opposition to/Support for a petition for coordination sent? If the Chair of the Judicial Council has not yet issued an order assigning a coordination motion judge, send an original and a copy of the opposition to or support for the petition to coordinate directly to the Chair. If the Chair of the Judicial Council has already issued an order assigning a coordination motion judge, send the original opposition to or support for the petition directly to the presiding judge of the court where the coordination motion judge is assigned and send a copy to the Judicial Council. If the assignment order is issued to the Superior Court of Los Angeles County, papers should be sent to the Managing Judge of the Complex Litigation Program at the following address: Superior Court of California County of Los Angeles Spring Street Courthouse, Department 14 312 North Spring Street Los Angeles, CA 90012 Who assigns the coordination motion judge? The Chair of the Judicial Council assigns a coordination motion judge to determine whether coordination is appropriate. The chair of the Judicial Council may authorize a presiding judge to assign a judge to make that determination. (Cal. Rules of Court, rule 3.52'''
