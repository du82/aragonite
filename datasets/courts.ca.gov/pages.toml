["https://courts.ca.gov/job/procurement-facilities-contracts-supervisor-fiscal-supervisor-6371"]
title = "Procurement Facilities Contracts Supervisor (Fiscal Supervisor) | Judicial Branch of California"
description = "Overview The Judicial Council of California is accepting applications for the position of a Procurement Facilities Contracts Supervisor in the Facilities Contracts unit for the Branch Accounting and Procurement (BAP) office."
full_description = "Procurement Facilities Contracts Supervisor (Fiscal Supervisor) Job Id: 6371 Full/Part-Time: Full-Time Location: San Francisco or Sacramento Office: Branch Accounting & Procurement Department: Procurement-Facilities Salary: $8,264.00 to $12,394.00 per month Regular/Temporary: Regular Deadline: Open Until Filled Posted: February 28, 2025 Apply to Job Overview The Judicial Council of California is accepting applications for the position of a Procurement Facilities Contracts Supervisor in the Facilities Contracts unit for the Branch Accounting and Procurement (BAP) office. Under the general direction of Procurement’s Contracts Manager, the Procurement Facilities Contracts Supervisor oversees the daily operations of the Procurement Facilities Contracts unit, supervising assigned staff and managing complex procurement and contracting activities. This includes developing, recommending, and implementing operating policies, procedures, and business processes while setting performance standards. The role involves planning, organizing, assigning, supervising, reviewing, and evaluating staff work; recommending staff selection; providing ongoing training and development; and conducting performance evaluations. The Fiscal Supervisor ensures compliance with policies, regulations, and laws while also developing meeting content, leading discussions, and preparing and delivering presentations to senior stakeholders. Additional responsibilities include training internal and external customers, coordinating and overseeing complex projects and business initiatives, managing and negotiating contract actions, researching industry standards and emerging regulations, and implementing necessary changes in accordance with organizational protocols. Furthermore, the Facilities Contracts Unit Supervisor has limited signature authority to approve contracts and amendments. The Judicial Council The Judicial Council of California is the policy setting body for the state court system and has constitutionally conferred statewide rule-making authority. This authority includes developing, advocating for, and allocating the judicial branch budget. A majority of Council members are California state justices and judges; however, the Council also includes lawyers, legislators, and court administrators. By enhancing its role as a leadership, knowledge, and service resource for the judicial branch, the Judicial Council’s staff organization seeks to continue to evolve as one of California’s most dynamic public service entities, focused on improving access to justice for all Californians by innovating and responding to the changing needs of the courts and the public. As a government body charged with improving the statewide administration of justice, the Judicial Council has multiple offices with diverse responsibilities relating to court policy and operations. As employees of the council, every member of staff should view and approach their work as one Judicial Council with a public service mission that is greater than the sum of its parts. The Judicial Council strives for work-life balance, including substantial vacation and holiday time. In addition, we offer an excellent benefits package, including pension, medical, dental, and vision coverage, flexible spending, up to $130 per month reimbursement for qualifying commuting costs, and retirement savings plans. In San Francisco, the office is only a 7-minute walk from the downtown Civic Center BART station. In Sacramento, the office is minutes from downtown, just north of Discovery Park. The Judicial Council offers hybrid work arrangements for many positions. The successful candidate will be expected to work in person at the Judicial Council’s San Francisco or Sacramento office at least two days per week, based on their office leader’s direction, and reside in the areas surrounding these locations. Responsibilities Supervises or directly handles the drafting, issuance, and termination of various contract documents, including master agreements, standard agreements, ordering documents, construction change orders, and amendments. Manages contracts related to construction, facility modification, or maintenance for Judicial Branch entities, occasionally handling the most complex projects. Reviews project specifications or Statements of Work to determine appropriate contract types and language. Works with project managers and direct reports to clarify objectives, research industry standards, and ensure requirements are met. Drafts and revises contracts, specifications, Statements of Work, or amendments as necessary. Oversees FI$Cal entries related to contract documents and routes them for approval. Drafts and administers solicitations, including complex Requests for Proposals (RFPs) and Requests for Qualifications (RFQs), ensuring compliance with contracting policies and regulations. Coordinates with Legal Services' transactional and real estate attorneys to review and improve contract documents. Prepares solicitation documents, such as RFPs, RFQs, Procurement Schedules, and Statements of Work, ensuring clarity and compliance with Judicial Council policies. Responds to contract inquiries, monitors assignments progress, and provides status updates to project managers and leadership. Contributes to process improvements and best practices within Procurement, ensuring efficiency and compliance. Negotiates contract terms and conditions as part of the Judicial Council team, addressing exceptions through solicitations or the non-competitive bid process. Manages the unit’s Vendor Management Program to encourage vendor participation in facility project solicitations. Serves as a point of contact for Public Access to Judicial Administrative Records (PAJAR) requests related to facility procurements and contracts (Rule of Court 10.500). Supervisory Duties: Recommends selection of staff; Trains staff and proposes internal and external training courses and workshops; Provides for career development and planning for staff; Approves time off requests; Reviews and approves time sheets; Evaluates employee performance and conducts performance reviews; and Administers discipline as required. Qualifications Bachelor’s degree, preferably in business, finance, accounting or directly related field, and five (5) years of professional experience in accounting, finance, budgetary analysis, or contract administration, which includes at least one (1) year of supervisory experience. An additional four years of professional experience in the assigned function as noted above may substitute for the bachelor’s degree. Or, additional directly related experience and/or education may be substituted on a year-for-year basis. OR Juris doctor, master’s of business administration or a master’s degree in a directly related field for the assigned discipline such as finance, contract administration or accountancy, and two (2) year of experience as identified above, including one (1) year of previous supervisory experience. OR One (1) year as a Senior Fiscal Analyst or other level (C43) class or three (3) years as a Fiscal Analyst or other level (C42) class with the Judicial Council of California or one (1) year of experience performing the duties of a class comparable in the level of responsibility to that of an exempt-level Senior Fiscal Analyst, or three (3) years as an exempt-level Fiscal Analyst, in a California Superior Court or California state-level government entity and a) completion of training courses on topics related to effective supervision within 6 months of promotion; or b) one year of previous supervisory experience. Desirable Qualifications: Previous experience in the solicitation, contract development, and administration for construction or facilities management related contracts. Other Information Please note, if you are selected for hire, verification of employment authorization to work in the United States will be required. How To Apply This position is Open Until Filled and requires the submission of our official application, a cover letter, responses to the supplemental questions, and a resume. To ensure consideration of your application for the earliest round of interviews, please apply by Friday, March 14, 2025. To complete the online application, please click on the Apply For Job button. The Judicial Council provides reasonable accommodation to applicants with disabilities who request such accommodation. Reasonable accommodation needs should be requested through Human Resources at (415) 865-4260. Pay and Benefits $8,264 - $12,394 per month Some highlights of our benefits package include: Health/Dental/Vision benefits program 14 paid holidays per calendar year Choice of Annual Leave or Sick/Vacation Leave 1 personal holiday per year Up to $130 per month reimbursement for qualifying commuting costs CalPERS Retirement Plan 401(k) and 457 deferred compensation plans Employee Assistance Program Basic Life and AD&D Insurance FlexElect Program Pretax Parking Long Term Disability Program (employee paid/optional) Group Legal Plan (employee paid/optional) Equal Employment Opportunity The Judicial Council of California Is an Equal Opportunity Employer. Supplemental Questions To better assess the qualifications of each applicant, we will review your responses to the following questions. Please indicate for which employer you performed these functions. Your answers should not exceed a total of three pages. Please tell us about your experience as a supervisor, including the number and types of staff supervised and the types of duties you performed as a supervisor. The Judicial Council of California Is an Equal Opportunity Employer. Apply to Job"
year_published = 2025
