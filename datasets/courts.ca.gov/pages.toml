["https://courts.ca.gov/programs-initiatives/judicial-fellowship"]
title = "Judicial Fellowship | Judicial Branch of California"
full_description = "Judicial Fellowship The application period for the 2025-2026 Judicial Fellowship Program is now open! If you have any questions regarding the fellowship or the application process, please contact Sacramento State's Center for California Studies at (916) 278-6906, or visit the Capital Fellows Program page. 2024-2025 Judicial Fellows The 2024-2025 class of the Judicial Fellowship Program began their year of service in September with a week-long orientation of team building and intensive learning. Their program orientation involved panels with branch administrators and directors, briefings on major challenges facing the judicial branch, and advice from program directors and former fellows on how to make the most of the fellowship year. The fellows reported to their respective offices in the judicial branch in mid-September for training unique to their diverse placements. The Judicial Fellowship Program is one of four fellowships that make up the Capital Fellows Programs. Voted one of the Top 10 internships nationwide in 2010, 2011, 2012, and 2014 by Vault.com, the Capital Fellows Programs were ranked highly for their combination of meaningful work experience and career opportunities. Each year, Vault's editors evaluate the internship programs profiled in their annual guide and select from those the Top 50 internship programs they feel represent the best all-around opportunities. 2024-2025 Judicial Fellowship Class Image About the Judicial Fellowship Program The fellowship offers a unique opportunity to participate in court administration, policymaking, program analysis, development, and implementation and to gain first-hand experience in the governance and leadership of the most diverse, complex court system in the nation. Judicial Fellows work 10 months as full-time, paid staff members of the Center for California Studies at Sacramento State University. Fellows are placed in leadership offices at Superior Courts throughout the state or with the Judicial Council. Fellows also attend monthly graduate seminars conducted by their program's academic advisor and receive graduate credits from the Public Policy and Administration Program through Sacramento State. Prospective Judicial Fellows must have a bachelor’s degree (in any major) by September 1 of their service year and a demonstrated interest in state government and public service. In addition to the Judicial Fellowship, the Center for California Studies offers fellowships in legislative and executive offices. Applicants may apply to one or more of the Capital Fellows Programs that meet their interests and qualifications. Applications are posted in the fall. Fellows are interviewed and selected in the spring of the following year. Recent graduates, graduate, postgraduate and mid-career applicants are welcome. If you have any questions regarding the fellowship or the application process, please contact Sacramento State’s Center for California Studies at (916) 278-6906, or visit the Capital Fellows Program page. Resources Judicial Fellowship Brochure Learn More Judicial Fellowship Program Eligibility Learn More Contact Laura Speed Judicial Council of California Leadership Support Services 2860 Gateway Oaks Drive, Suite 400 Sacramento, CA 95833Telephone: 916-263-2972E-mail: laura.speed@jud.ca.go"
year_published = 2025
clearnet = "https://courts.ca.gov/programs-initiatives/judicial-fellowship"
