["https://courts.ca.gov/programs-initiatives/alternative-dispute-resolution-adr"]
title = "Alternative Dispute Resolution (ADR) | Judicial Branch of California"
description = "Mediation, arbitration, settlement conferences, neutral evaluation, learn more about the most common types of ADR for civil cases, and watch videos demonstrating these processes."
full_description = "Alternative Dispute Resolution (ADR) What is Alternative Dispute Resolution (ADR)? Most civil disputes are resolved without filing a lawsuit, and most civil lawsuits are resolved without a trial. The courts and others offer a variety of Alternative Dispute Resolution (ADR) processes to help people resolve disputes without a trial. ADR is usually less formal, less expensive, and less time-consuming than a trial. Learn more about the types of ADR processes that are available and the political benefits of using ADR by clicking on the links below. ADR Types & Benefits Types of ADR Mediation, arbitration, settlement conferences, neutral evaluation, learn more about the most common types of ADR for civil cases, and watch videos demonstrating these processes. Learn More Benefits of ADR Using ADR may have a variety of benefits, depending on the type of ADR and the circumstances of the particular case. Learn more about the benefits of ADR. Learn More Additional Resources Resolve Your Case Video Series Watch videos on how to resolve specific types of cases through the normal court process and alternative dispute resolution (ADR) processes. Court ADR Programs Learn more about superior court's ADR programs for civil cases. Mediation Week The Judicial Council and State Bar of California recognize the third week of March as Mediation week. During this week, many organizations hold events to inform the public about the availability and benefits of mediation programs, and to acknowledge the mediators and others who make those programs successful. View ADR Events What is Mediation? Mediation is a form of alternative dispute resolution (ADR) and is a way of resolving disputes between two or more parties. Learn More About the Types of ADR See the Benefits of ADR"
