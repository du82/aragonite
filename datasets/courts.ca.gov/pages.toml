["https://courts.ca.gov/job/appellate-court-attorney-level-d-or-senior-appellate-court-attorney-6361"]
title = "Appellate Court Attorney, Level A-D or Senior Appellate Court Attorney | Judicial Branch of California"
full_description = "Appellate Court Attorney, Level A-D or Senior Appellate Court Attorney Job Id: 6361 Full/Part-Time: Full-Time Location: Sacramento Office: Courts of Appeal Department: Third District Court of Appeal Salary: $11,307.00 to $15,091.00 per month Regular/Temporary: Regular Deadline: Open Until Filled Posted: February 14, 2025 Apply to Job Overview The California Court of Appeal, Third Appellate District, located in Sacramento, decides consequential cases impacting the development of California’s criminal and civil jurisprudence. The court is currently recruiting talented lawyers who exhibit a commitment to excellence and who enjoy thinking and writing about legal issues to serve on the court’s central staff. The daily work of appellate court attorneys includes reviewing briefs and records in civil, criminal, and juvenile matters; working collaboratively with other attorneys and jurists to resolve varied legal questions; thoroughly researching and analyzing the law; drafting clear, concise, and well-written memoranda and proposed opinions; reviewing and proofreading opinions; and performing other related work as required. Candidates should possess exceptional analytical, research, and writing skills; the ability to work collaboratively with others; strong attention to detail; and sound judgment. The individuals selected for the positions will be appointed at a level commensurate with their qualifications. Litigation or appellate advocacy experience or a prior judicial clerkship are desirable, but proven interest in legal writing and analysis, and a desire to contribute to the judiciary are essential. The court values its highly engaged attorney staff and, to promote continued engagement, offers a generous compensation and benefits package, including substantial paid leave and holiday time and flexible work schedules. Additionally, remote work privileges are available. Responsibilities • Review, evaluate, and analyze briefs, petitions, motions, and other pertinent documents filed in a particular case to determine factual accuracy, identify legal issues on appeal, and comprehend scope and complexity of issues raised.• Prepare complete and concise written statements of facts pursuant to rules of appellate review. • Analyze legal issues raised by parties. • Read and apply relevant authority from cases, statutes, constitutional provisions, and rules of court cited by parties or as otherwise identified through independent research. • Research legislative history and intent of particular statutes. • Draft conference memoranda, opinions, orders, and requests for supplemental briefing. • Use citator services to verify precedential value of citations. • Consult with other attorneys and/or professional staff regarding issues on appeal. • Attend oral arguments. • Review, evaluate, and analyze petitions for rehearing. • Serve on court committees as required. • Work collaboratively and collegially with other attorneys and/or professional staff. • Conduct special legal research and assignments when requested, including editing of work prepared by court Qualifications Level A: Active membership in the State Bar of California. Level B: Active membership in the State Bar of California and the equivalent of two years of post-bar legal experience in a legal setting such as a private law practice, corporation, government agency, law school, court, or legal publishing company. OR Equivalent to two years of post-bar legal experience in a legal setting as described above, including one year of experience as an appellate attorney, Level A, with the judicial branch. Level C: Active membership in the State Bar of California and the equivalent of three years of post-bar legal experience in a legal setting such as a private law practice, corporation, government agency, law school, court, or legal publishing company. OR One year of experience as an appellate attorney, Level B, with the judicial branch. Level D: Active membership in the State Bar of California and the equivalent of four years of post-bar legal experience in a legal setting such as a private law practice, corporation, government agency, law school, court, or legal publishing company. OR One year of experience as an appellate attorney, Level C, with the judicial branch. Senior: Active membership in the State Bar of California and the equivalent of six years of post-bar legal experience, including substantial appellate experience, in a legal setting such as a private law practice, corporation, government agency, law school, court, or legal publishing company. OR Two years of experience as an appellate attorney, Level D, with the judicial branch. NOTES:• Work experience as a law clerk to a federal judge after passing a state bar but prior to formal state bar admission will be considered equivalent to post-bar legal experience. • For external candidates for the Senior Appellate Court Attorney class, the Administrative Presiding Justice must certify that the candidate possesses “substantial appellate experience.”externs. Other Information Please note, if you are selected for hire, verification of employment eligibility or authorization to work in the United States will be required. How To Apply This position requires the submission of our official application, a cover letter, a resume, and a response to the supplemental questions listed below. The positions will remain open until filled, but to ensure consideration of your application for the earliest round of interviews, please apply by noon (12:00 P.M.) on April 14, 2025. To complete an online application, please click the Apply for Job button. Please do not submit a writing sample. The Judicial Council provides reasonable accommodation to applicants with disabilities who request such accommodation. Reasonable accommodation needs should be requested through Human Resources at (415) 865-4260. Pay and Benefits Equal Employment Opportunity The Third District Court of Appeal Is an Equal Opportunity Employer. Supplemental Questions Supplemental Questionnaire for Appellate Court Attorney A – D, or Senior Appellate Court Attorney To better assess the qualifications of each applicant, we ask that you respond to the following inquiries. Your response should be no more than two pages in length. 1. The position of appellate court attorney involves drafting legal memoranda and assisting the court in researching and drafting appellate opinions in a wide variety of matters. Extensive independent research, analysis, and writing on complex legal issues are required. Please describe, in some detail, the relevant experience you have had in performing comparable work and indicate why you believe your experience and skills qualify you for the position. Also, please explain why you are interested in this position. 2. Please provide your date of admission to the State Bar of California. 3. Please provide three professional references. The Judicial Council of California Is an Equal Opportunity Employer. Apply to Job"
