["https://courts.ca.gov/programs-initiatives/collaborative-justice-courts/adult-courts"]
title = "Adult Courts | Judicial Branch of California"
full_description = "Adult Courts Collaborative Justice Courts Adult Courts Community/Homeless Courts Homeless Court Technical Assistance for Courts Drug Courts DUI Courts Mental Health Courts Reentry Courts Veterans Treatment Courts Grants/Funding Juvenile Collaborative Courts The collaborative justice model is being applied to several adult court types throughout California with great benefit. To learn more about these types of collaborative justice courts, select from topics below. Community/Homeless Courts Community courts are an experiment in community-based justice. Like other collaborative justice courts, community courts aim to improve efficiency in judicial proceedings, match sanctions and services to offenders, and build bridges between public and private agencies that serve offenders. Drug Courts Drug Courts are specially designed court calendars that provide an alternative to traditional criminal justice prosecution for non violent drug-related offenses. These courts combine close judicial oversight and monitoring with probation supervision and substance abuse treatment services. DUI Courts DUI Courts are modeled after drug courts as they address violations/crimes where addiction is at the foundation. Mental Health Courts Mental health courts combine judicial supervision with community mental health treatment and other support services in order to reduce criminal activity and improve the quality of life of participants. Reentry Courts With an increasing number of prisoners being released each year in California, the need for a comprehensive and collaborative court approach to parolee reentry is also increasing. Veterans Courts Veterans courts are hybrid drug and mental health courts that use the drug court model to serve veterans struggling with addiction, serious mental illness and/or co-occurring disorders."
