["https://courts.ca.gov/news-reference/research-data/judicial-officer-demographics"]
title = "Judicial officer demographics | Judicial Branch of California"
full_description = '''Research and data Judicial Officer Demographics Data updated December 2024 PDF Report Demographic Data Provided by Justices and Judges • Latest report Get the PDF Overview Each year the Judicial Council surveys California judges and justices to get a snapshot of the demographic makeup of California's judges. Government Code section 12011.5(n) requires the Judicial Council to collect and release aggregate data from this survey by March 1 each year. Responding to the questionnaire is voluntary, and the data only reflects the responses provided. Why this matters California’s judicial branch serves an increasingly diverse population. To serve the people of California effectively, public servants in the judicial branch should be representative of the state's diversity. The Judicial Council recently updated its Strategic Plan for California’s Judicial Branch, making explicit the branch’s commitment to a diverse and inclusive court system. The charts below track changes in key demographic characteristics of the California bench over time, including gender, sexual orientation & gender identity, race & ethnicity, as well as veteran or disability status. The data reflects demographic background information self-reported by justices and judges on the bench as of December 31, 2024, with a response rate of over 93%. Use the dashboard at the bottom of the page to explore by court and demographic characteristic. Explore by: 1. Gender 2. Sexual Orientation & Gender Identity 3. Race & Ethnicity 4. Veteran & Disability Status 5. All data by court and demographic characteristics Gender The percentage of female justices and judges has increased to 41%, compared to 26% in 2006, continuing a steady upward trend. Your browser does not support inline frames document.addEventListener("DOMContentLoaded", function() { let iframe = document.getElementsByTagName("iframe")[0]; if (iframe) { let iframeID = '#' + document.getElementsByTagName("iframe")[0].id; iFrameResize({lowestElement: true}, iframeID); } }); Sexual Orientation & Gender Identity This is the 14th year that the study includes data on gender identity and sexual orientation, as required by a law passed in 2011. More than 80% of respondents provided information about gender identity/sexual orientation. Your browser does not support inline frames document.addEventListener("DOMContentLoaded", function() { let iframe = document.getElementsByTagName("iframe")[0]; if (iframe) { let iframeID = '#' + document.getElementsByTagName("iframe")[0].id; iFrameResize({lowestElement: true}, iframeID); } }); Race & Ethnicity Since 2006, there has been an increase in the percentage of respondents reported in all BIPOC (Black, Indigenous, and people of color) categories. The most dramatic increase was seen in Hispanic, Asian, and Black judicial officers. These changes reflect judicial retirements and other departures from the bench, new judicial appointments, and an increase in the number of trial court judges who voluntarily provided race/ethnicity information. Your browser does not support inline frames document.addEventListener("DOMContentLoaded", function() { let iframe = document.getElementsByTagName("iframe")[0]; if (iframe) { let iframeID = '#' + document.getElementsByTagName("iframe")[0].id; iFrameResize({lowestElement: true}, iframeID); } }); Veteran & Disability Status In addition, this is the 11th year that the study includes data on veteran and disability status. These questions were first asked of justices and judges who were new to the bench during the 2014 calendar year. Judges appointed before this date are free to update this aspect of their demographic profile as well. Your browser does not support inline frames document.addEventListener("DOMContentLoaded", function() { let iframe = document.getElementsByTagName("iframe")[0]; if (iframe) { let iframeID = '#' + document.getElementsByTagName("iframe")[0].id; iFrameResize({lowestElement: true}, iframeID); } }); “A judiciary that looks like California fulfills our democratic ideal of equal and impartial justice under law.” Secretary Luis Céspedes, Judicial Appointments Secretary to Governor Gavin Newsom Explore all data Filter the data by courts and specific demographics to focus on trends in specific California counties. Your browser does not support inline frames Your browser does not support inline frames document.addEventListener("DOMContentLoaded", function() { let iframe = document.getElementsByTagName("iframe")[0]; if (iframe) { let iframeID = '#' + document.getElementsByTagName("iframe")[0].id; iFrameResize({lowestElement: true}, iframeID); } }); Prior Years of Judicial Officer Demographic Data 2024 2024 JO Demographic Data 2023 2023 JO Demographic Data 2022 2022 JO Demographic Data 2021 2021 JO Demographic Data 2020 2020 JO Demographic Data 2019 2019 JO Demographic Data 2018 2018 JO Demographic Data 2017 2017 JO Demographic Data 2016 2016 JO Demographic Data 2015 2015 JO Demographic Data 2014 2014 JO Demographic Data Download data Download a CSV file of the data used for the dashboard Download Notes Government Code section 12011.5(n) requires the Judicial Council to collect and release aggregate demographic data on California state justices and judges by March 1 every year. This is the report’s 18th year. Responding to the questionnaire is voluntary for judges, and the data only reflects the responses provided. Race and ethnicity category descriptions were adapted from definitions used by the U.S. Census Bureau in Census 2020. Sexual Orientation and Gender Identity data began collection in 2012 Court specific data was not collected in the survey prior to 2013 Veteran and Disability data began collection in 2014'''
