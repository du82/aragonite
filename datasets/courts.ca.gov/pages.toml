["https://courts.ca.gov/courts/jury-service/employer-information"]
title = "Employer Information | Judicial Branch of California"
full_description = "Employer Information Jury Service About the Trial Process Employer Information Resources for Judges, Attorneys, Court Staff, and the Public Civil Grand Jury Jury Innovations Jury Service Glossary Why Compensate? Jury service is an investment in America, in your employees, and in your business. State law does not require employers to compensate employees who are absent because of jury service. Many employers do, however, have jury-leave policies that provide compensation to employees for the time they are needed at court for jury service. An Investment in America Many prospective jurors cite a loss of pay as a legitimate reason for not serving on a jury. Yet juries play an important and crucial role in our country's democratic process. Without them, our legal system would grind to a halt. Your help is essential in ensuring that all citizens are available to serve on juries when called. One of the ways you can help is to consider compensating your employees during jury service if you don't already. An Investment in Your Employees Lack of compensation for jury service—a fundamental civic duty—places a financial burden on many employees. Paying your staff during their service boosts morale as they recognize that their employer values their civic service. Offering paid jury service is a values statement about your company and may differentiate your business in offering a competitive employment package. An Investment in Your Business Businesses benefit from the jury system. Cases dealing with contracts, environmental issues, product defects, malpractice, intellectual fraud, and wrongful termination are brought by or against business in civil courts. Wouldn't you want people like yourself and your employees deciding these cases? Please weigh all these factors when considering your company's jury service compensation policy. It's another way to show your support for American ideals, for your community, and for your employees. What it Costs: Try thinking about it this way: If employee John makes $35,000 per year, the cost of providing compensation for jury service compared to other benefits is quite small. Benefit: Total Annual Cost: 14 vacation days $1,900 10 sick days $1,350 8 paid holidays $1,100 Vision, dental & medial insurance $3,600 Tuition reimbursement $1,900 Jury Service: Total Annual Cost: 1-day jury service or 7-day trial $135-$945 Employer FAQS Sample Policy Employer FAQS Q. Can an employee seek a postponement of jury service?A. Yes, recognizing that some businesses may be seasonal, the courts will allow in most cases one postponement of service to a date chosen by the employee. The deferred date can be up to 6 months from the original date. This enables employees to select a more convenient time to serve. Q. My business can't afford to let our employees serve. What can I do to get my employees out of their jury service?A. The courts understand that jury service may pose challenges to both employers and their employees, and that is why the one-day or one-trial system has been adopted. However, the employer has a legal obligation to let the employee serve without fear of harassment or dismissal resulting from jury service. The California Labor Code prohibits an employer from firing or harassing an employee who is summoned to court to serve as a juror. Employees who are harassed or fired can file a claim with the state's Division of Labor Standards Enforcement and employers can also be prosecuted criminally and face misdemeanor charges if found guilty. Q. Is it mandatory for my firm to pay an employee during jury service?A. Employers are not required by law to compensate employees while they serve on a jury, but many do. These employers recognize that without juries our legal system will come to a halt and that financial hardship may discourage employees from fulfilling their civic duty. Q. Will the state reimburse me if I compensate my employees to fulfill their jury service?A. The courts currently reimburse those jurors not compensated by their employers $15/day after the first day of service and 34 cents per mile round trip. In lieu of mileage, jurors may receive up to $12 for using public transit, beginning on the first day. If an employer compensates the employee for jury service, those funds paid by the courts to the juror are refundable by the employee to the employer. However, the courts do not reimburse the employer directly. Q. Are there human resources guidelines available to help my firm adopt a jury duty compensation policy?A. Yes, a sample jury leave policy is available here (28 KB). Q. Can I stay in communication with my employee during a trial?A. You are free to communicate with your employee during trial recess at the employee's discretion. However, you are not permitted to communicate in any way about the trial with your employee. See our brochure for additional information. Sample Policy INTRODUCTION [Firm’s name] encourages employees to fulfill their civic obligations by performing jury service when called. Our jury service policy applies to full-time and part-time regular staff members. ENTITLEMENT An employee called for jury duty will be provided an excused absence to perform this service and will receive time off with regular base pay for the length of the service. While on an excused absence for jury duty, all benefits shall remain in effect and the employee will continue to accrue vacation and sick days. GUIDELINES If an employee does not have to attend court, s/he is expected to report to work. If an employee who works evenings is required to attend court during the day, individual arrangements with the direct supervisor can be made to facilitate the situation. RESPONSIBILITY ACTION Employee 1. Upon receipt of a juror summons, the employee must immediately present a copy of the notice to his/her supervisor. 2. The employee must then forward the copy to the human resources manager for placement in the employee’s file. Requests for leave or changes to the leave required should be forwarded to the supervisor and the human resources manager. 3. On completion of service, the employee obtains documentary proof of time served for submittal to the supervisor and human resources manager. 4. Absence for jury duty must be recorded on the employee’s time sheet. Supervisor 1. Ensure you are in receipt of a copy of the summons from employee. 2. Ensure you are in receipt of documentary proof of the employee’s time served. 3. Process appropriate attendance records to reflect time served."
year_published = 2025
clearnet = "https://courts.ca.gov/courts/jury-service/employer-information"
