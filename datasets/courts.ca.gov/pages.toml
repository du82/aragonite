["https://courts.ca.gov/news-reference/research-data/shortage-court-reporters-california"]
title = "Shortage of Court Reporters in California | Judicial Branch of California"
full_description = '''Research and data Shortage of Court Reporters in California Data updated December 2024 Fact sheet Shortage of Certified Shorthand Reporters in California • Published January 2025 Download PDF Overview Courts across California are experiencing a persistent and deepening shortage of court reporters. Courts rely on Certified Shorthand Reporters (“court reporters”) to capture verbatim records of court proceedings in case types where electronic recordings are not authorized by current California law.1 More than a million hearings in unlimited civil, family law, and probate proceedings have been held without a verbatim record since January 2023.2 California courts need an additional 458 full-time court reporters to meet the demand of the current caseload. Why does this matter? The absence of a verbatim record makes it nearly impossible for an individual to appeal their case. The California Supreme Court, in a 2018 opinion, stated the lack of a verbatim record will "frequently be fatal" to a litigant’s ability to have an appeal decided on the merits.3 The shortage of court reporters threatens access to justice for court users, especially Californians who can’t afford to pay for their own court reporter. Summary 1. The vast majority of family law, probate, and unlimited civil hearings go without a verbatim record 2. Number of court-employed reporters falls far short of need 3. There is a shrinking workforce of California licensed court reporters 4. Courts must compete with the private sector - and each other – for a shrinking pool of court reporters 5. Despite widespread use of incentives, courts continue to lose reporters faster than they can hire them The vast majority of family law, probate, and unlimited civil hearings go without a verbatim record State law authorizes the use of electronic recording to create a verbatim record for infractions, misdemeanors, and limited civil hearings, but not in family law, probate, and unlimited civil proceedings. In fact, California law currently prohibits courts from using electronic recording in these cases.5 Your browser does not support inline frames document.addEventListener("DOMContentLoaded", function() { let iframe = document.getElementsByTagName("iframe")[0]; if (iframe) { let iframeID = '#' + document.getElementsByTagName("iframe")[0].id; iFrameResize({lowestElement: true}, iframeID); } }); Of the 1,765,914 family law, probate, and unlimited civil hearings reported by Courts between April 2023 to August 2024, an estimated 1,268,418 hearings had no verbatim record (72%).6 The inability to create a verbatim record limits people’s ability to appeal significant and life-changing decisions regarding child custody, paternity, conservatorship assets, and more. This is a direct consequence of the court reporter shortage in California. Number of court-employed reporters falls far short of need To meet the demands of the current caseload, California courts need an additional 458 full-time court reporters.7 In recent surveys, California courts reported that — between January 2023 and September 2024 — 168 (FTE) court reporters were hired. But 38.0 (FTE) of those new hires came from other courts (21% of all hires) and 186.7 (FTE) court reporters have left positions at the courts, resulting in a net loss of 18.7 (FTE) reporters employed across the Branch.9 Your browser does not support inline frames document.addEventListener("DOMContentLoaded", function() { let iframe = document.getElementsByTagName("iframe")[0]; if (iframe) { let iframeID = '#' + document.getElementsByTagName("iframe")[0].id; iFrameResize({lowestElement: true}, iframeID); } }); California courts need at least 458 additional full-time court reporters to meet minimum requirements. There is a shrinking workforce of California licensed court reporters There were 4,587 California-licensed court reporters residing in the state as of January 1, 2025.10 According to the California Department of Consumer Affairs, the total number of licensees declined 20.9% between FY 2013-14 and FY 2022-23 and the number of new license applications declined 42.9% in the same period, suggesting the pool of licensed court reporters available to fill vacant positions will continue to shrink.11 Your browser does not support inline frames document.addEventListener("DOMContentLoaded", function() { let iframe = document.getElementsByTagName("iframe")[0]; if (iframe) { let iframeID = '#' + document.getElementsByTagName("iframe")[0].id; iFrameResize({lowestElement: true}, iframeID); } }); Court reporters likely nearing retirement Making matters worse, nearly half of Court reporters are likely nearing retirement. In California, approximately 45.9% of all active licenses were issued more than 30 years ago and an estimated 50% of court-employed reporters were eligible to retire as of December 1, 2023.12,13 Challenging pathway to licensure Growth in the court reporter workforce is limited by the significant hurdles to getting a license in California. Only sixty-eight new licenses were issued statewide in 2022–23.14,15 Of the 350 individuals who applied to take the skills (dictation) portion of the past three California certified shorthand reporter exams (held Mar. 2023, July 2024, and Nov. 2024), 46.3% passed.6 Courts compete with the private sector - and each other - to hire new court reporters Your browser does not support inline frames document.addEventListener("DOMContentLoaded", function() { let iframe = document.getElementsByTagName("iframe")[0]; if (iframe) { let iframeID = '#' + document.getElementsByTagName("iframe")[0].id; iFrameResize({lowestElement: true}, iframeID); } }); Court reporters in California courts are paid, on average, 51% more than other nonmanager court positions. At the same time, the declining number of court reporters in California has created a tight and competitive labor market, exacerbating compensation pressures. The median total salary plus benefits for each court reporters is estimated to be $200,101.17 This is significantly lower than the cost to hire a court reporter through a private company: $2,580/day for a deposition and $3,300/day for a trial, on average.18 Additionally, transcripts must be purchased from court reporters. In 2021, the Legislature increased the statutory transcript fees by approximately 30%.19 In FY 2023–24, California courts spent $23.7 million on transcripts.20 Your browser does not support inline frames Your browser does not support inline frames document.addEventListener("DOMContentLoaded", function() { let iframe = document.getElementsByTagName("iframe")[0]; if (iframe) { let iframeID = '#' + document.getElementsByTagName("iframe")[0].id; iFrameResize({lowestElement: true}, iframeID); } }); Despite widespread use of incentives, courts continue to lose reporters faster they can hire them Between January 2023 and June 2024, approximately 89.7% of trial courts had used at least one incentive to recruit and retain court reporters. These incentives included signing bonuses (75.6% of actively recruiting courts), retention and longevity bonuses (56.1%), finder’s fees (48.8%), increased salary ranges (21.9%), and more.21 Your browser does not support inline frames Your browser does not support inline frames document.addEventListener("DOMContentLoaded", function() { let iframe = document.getElementsByTagName("iframe")[0]; if (iframe) { let iframeID = '#' + document.getElementsByTagName("iframe")[0].id; iFrameResize({lowestElement: true}, iframeID); } }); Examples of incentives: The Riverside Court offers up to $32,500 in retention payments over three years. Contra Costa provides a $50,000 tuition reimbursement fund for existing court employees to use toward pursuing court reporter certification. The San Francisco Court created a first-in-the-nation court reporter internship program. The Los Angeles Court is offering a $50,000 signing bonus, a $15,000 student loan and equipment allowance, and a $15,000 finder’s fee for court employees who refer a court reporter. In addition, the Court offers a program to its employees that includes a full court reporting tuition scholarship (including all fees and equipment costs), the ability to attend classes during work hours, and guaranteed employment as a court reporter upon licensing. Download data Download an Excel file of the data. Download Notes 1,5 Electronic recording is not authorized except in limited civil, misdemeanor, and infraction proceedings when a court reporter is unavailable (Gov. Code, § 69957(a)). 2,6 Courts were asked to provide the number of hearings without a verbatim record and the number of total hearings for each of these case types or in the aggregate. Where a court provided the number of hearings without a verbatim record for a case type but not the corresponding total hearings (or vice versa), that case type data was removed from the data set. 3Jameson, supra, 5 Cal.5th at 608, fn. 1. 4 Courts must also provide an official court reporter in civil cases when a party with a fee waiver requests one, and the proceeding cannot otherwise be electronically recorded. 7Covering all case types where a court reporter is required or electronic recording is not authorized. 8 Court reporter need is calculated by adapting the approach used in the Resource Assessment Study (www.courts.ca.gov/29305.htm). For all case types except misdemeanor, infraction, and limited civil, where Government Code Section 69957 permits electronic recording, the latest biennial Judicial Workload Assessment (https://www.courts.ca.gov/12922.htm) is multiplied by a factor of 1.25 or, for Civil Unlimited and Estates and Trust, 0.6125. 9 Reported in surveys completed by California trial courts. Courts have been asked to report explicitly in FTEs since April 2023. Before then, we must assume that counts reported are FTEs and not simple headcounts. 10 Department of Consumer Affairs data portal, www.dca.ca.gov/data/annual_license_stats.shtml. 11 Court Reporters Board: April 4, 2024, Board Meeting Packet, www.courtreportersboard.ca.gov/about-us/20240404_packet.pdf. 12 Department of Consumer Affairs, Licensee List (as of Jan. 2025), www.dca.ca.gov/consumers/public_info/index.shtml. 13 Estimation based on data collected in a December 2023 survey of California Trial Courts. 14 Court Reporters Board: April 4, 2024, Board Meeting Packet, www.courtreportersboard.ca.gov/about-us/20240404_packet.pdf. 15 Only eight court reporting programs recognized by the state remain open (down from 17 schools in 2010), www.courtreportersboard.ca.gov/applicants/school_info.shtml. However, students may also qualify for California’s Certified Shorthand Reporter exam by obtaining national certification demonstrating proficiency in machine shorthand reporting or voice writing. 16 Court Reporters Board, School Examination Statistics, www.courtreportersboard.ca.gov/applicants/examstats.shtml. 17 Median value of estimated salary and benefit costs statewide by the filled court reporter FTEs, Schedule 7A. 18 Data provided by a survey of 49 private consumer attorneys. It is unknown how much of the court reporter rate charged by companies is provided to the reporter in the form of compensation and how much is kept by the company. 19 Sen. Bill 170 (Stats. 2021, ch. 240). 20 2022–23 Schedule 7A total court statewide transcript expenditures, excluding Electronic Recording. 21Surveys completed by California Trial Courts.'''
