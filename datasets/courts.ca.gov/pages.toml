["https://courts.ca.gov/job/fiscal-analyst-6362"]
title = "Fiscal Analyst | Judicial Branch of California"
description = "Overview The Judicial Council of California is accepting applications for the position of Fiscal Analyst for Budget Services."
full_description = "Fiscal Analyst Job Id: 6362 Full/Part-Time: Full-Time Location: San Francisco or Sacramento Office: Budget Services Department: Court Budget Salary: $7,294.00 to $10,942.00 per month Regular/Temporary: Regular Deadline: Open Until Filled Posted: February 18, 2025 Apply to Job Overview The Judicial Council of California is accepting applications for the position of Fiscal Analyst for Budget Services. This Fiscal Analyst position provides support to the Judicial Council’s advisory body responsible for trial court funding and budget policy: the Trial Court Budget Advisory Committee (TCBAC) and various TCBAC subcommittees and working groups. The Fiscal Analyst provides professional analytical work in managing projects, conducting research, and writing, editing, and finalizing comprehensive, original reports, proposals, memoranda, and other formal documents for public committee meetings, including agendas, minutes, and various meeting materials. This position provides support for the distribution of $3 billion annually to the trial courts and other budgetary processes and programs that support court operations. The Fiscal Analyst provides training and technical assistance to the trial courts, responds to inquiries and special assignments from the trial courts and Judicial Council management, and completes special projects as required. The Judicial Council The Judicial Council of California is the policy setting body for the state court system and has constitutionally conferred statewide rule-making authority. This authority includes developing, advocating for, and allocating the judicial branch budget. A majority of Council members are California state justices and judges; however, the Council also includes lawyers, legislators, and court administrators.By enhancing its role as a leadership, knowledge, and service resource for the judicial branch, the Judicial Council’s staff organization seeks to continue to evolve as one of California’s most dynamic public service entities, focused on improving access to justice for all Californians by innovating and responding to the changing needs of the courts and the public. As a government body charged with improving the statewide administration of justice, the Judicial Council has multiple offices with diverse responsibilities relating to court policy and operations. As employees of the council, every member of staff should view and approach their work as one Judicial Council with a public service mission that is greater than the sum of its parts. The Judicial Council strives for work-life balance, including substantial vacation and holiday time. In addition, we offer an excellent benefits package, including pension, medical, dental, and vision coverage, flexible spending, up to $130 per month reimbursement for qualifying commuting costs, and retirement savings plans. In San Francisco, the office is only a 7-minute walk from the downtown Civic Center BART station. In Sacramento, the office is minutes from downtown, just north of Discovery Park. The Judicial Council offers hybrid work arrangements for many positions. The successful candidate will be expected to work in person at the Judicial Council’s San Francisco or Sacramento office at least two days per week, based on their office leader’s direction, and reside in the areas surrounding these locations. Responsibilities • Perform professional-level support duties to the TCBAC and its subcommittees and working groups related to trial court funding and budget policy. • Analyze budget issues, review data, conduct research, and prepare summary and briefing documents as required. • Write, edit, and finalize comprehensive, original reports, proposals, memoranda, and other formal documents for public committee meetings, including agendas, minutes, and various meeting materials. • Provide analytical and technical support for the monthly distribution of trial court funding.• Develop and build the preliminary annual trial court allocation model.• Request and compile budget information from various entities, including the trial courts and other Judicial Council offices, to calculate trial court allocations funded by the Trial Court Trust Fund. • Manage the Funds Held on Behalf of the Trial Courts program, which is an annual process that assists the trial courts in funding multi-year projects that support court operations. • Prepare various communications with internal and external partners, including other Judicial Council offices and the State Controller’s Office related to the monthly trial court distribution process.• Provide training and technical assistance to the trial courts on specific budget processes, and monitor and respond to inquiries from the courts. • Maintain vacancy and cost data and prepare reports for judicial officers and judges’ salaries. Qualifications Bachelor’s degree, preferably in business, finance accounting, or a directly related field, and three (3) years of professional experience in accounting, finance, budgetary, or contract administration. An additional four years of professional experience in the assigned function as noted above may substitute for the bachelor’s degree. Or additional directly related experience and/or education may be substituted on a year-for-year basis. OR Juris doctor, Master of Business Administration, or master’s degree in a directly related field for the assigned discipline such as finance or accountancy. OR Two years as an Associate Fiscal Analyst, in the assigned field, with the Judicial Council of California or two years of experience performing the duties of a class comparable in the level of responsibility to that of an Associate Fiscal Analyst in a California Superior Court or California state-level government entity. DESIRABLE QUALIFICATIONS• Excellent communication, interpersonal, public speaking, and presentation skills. • Experience with state, local, or federal budget processes. • Professional experience writing, editing, and finalizing comprehensive, original reports, proposals, memoranda, and other formal documents. • Strong analytical, problem-solving, and customer service skills. • Strong Microsoft Suite skills. Other Information Please note, if you are selected for hire, verification of employment authorization to work in the United States will be required. How To Apply To ensure consideration of your application for the earliest round of interviews, please apply by 5:00 P.M. on March 7, 2025. This position will remain Open Until Filled and requires the submission of our official application, a resume and a response to the supplemental questions. To complete an online application, please click the Apply for Job button. The Judicial Council provides reasonable accommodation to applicants with disabilities who request such accommodation. Reasonable accommodation needs should be requested through Human Resources at (415) 865-4260. Pay and Benefits $7,294.00 - $10,942.00 per month Some highlights of our benefits package include:• Health/Dental/Vision benefits program• 14 paid holidays per calendar year• Choice of Annual Leave or Sick/Vacation Leave• 1 personal holiday per year• Up to $130 per month reimbursement for qualifying commuting costs• CalPERS Retirement Plan• 401(k) and 457 deferred compensation plans• Employee Assistance Program• Basic Life and AD&D Insurance• Flex Elect Program• Pretax Parking• Long Term Disability Program (employee paid/optional)• Group Legal Plan (employee paid/optional) Equal Employment Opportunity The Judicial Council of California Is an Equal Opportunity Employer. Supplemental Questions To better assess the qualifications of each applicant, please provide a response to the following questions: 1. Please explain why you are interested in this position and why your experience and skills would be a good fit. 2. Please describe your experience writing, reviewing, and finalizing original comprehensive reports, proposals, memoranda, and other professional documents for executive audiences and/or public meetings. The Judicial Council of California Is an Equal Opportunity Employer. Apply to Job"
