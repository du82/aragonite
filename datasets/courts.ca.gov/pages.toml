["https://courts.ca.gov/job/appellate-court-attorney-division-six-6365"]
title = "Appellate Court Attorney – Division Six | Judicial Branch of California"
full_description = "Appellate Court Attorney – Division Six Job Id: 6365 Full/Part-Time: Full-Time Location: Ventura Office: Second District Court of Appeal Department: Second District, Div. Six Salary: $10,234.00 to $13,659.00 per month Regular/Temporary: Regular Deadline: Open Until Filled Posted: February 21, 2025 Apply to Job Overview The California Court of Appeal, Second Appellate District, Division Six, located in downtown Ventura, decides cases at the forefront of California’s civil and criminal jurisprudence. The court is currently recruiting a talented lawyer with a love for the law and writing, a strong work ethic and a dedication to excellence to serve in Associate Justice Hernaldo J. Baltodano’s chambers. The court values diversity and inclusion in our workplace. Your work at the court would include drafting proposed opinions in all areas of appellate law including criminal, civil, and juvenile. An appellate court attorney must have superior legal research and writing skills and the ability to present a statement of facts, law, and argument clearly, concisely and logically in written form. Litigation experience or a prior judicial clerkship are desirable, but a proven interest in legal writing and analysis, and a desire to contribute to the judicial branch are a must. The Court offers a generous compensation and benefits package, including opportunities for remote work and flexible scheduling, subject to the direction and approval of the justice. The position is being recruited at levels B to D and will be staffed at a level commensurate with the qualifications of the selected individual. Qualifications DESIRABLE QUALIFICATIONSApplicants should have appellate court experience, or experience in either appellate litigation or trial litigation with substantial writing experience. They should also have exceptional research, analytical, and writing skills; broad and practical knowledge of the law; familiarity with appellate practice; mature and sound judgment; attention to detail; good time-management skills; and the ability to work both independently and cooperatively with other members of the court staff, including the ability to accept editing of one’s work product and the willingness to learn from the editing process. Experience with computerized legal research, word processing skills, and knowledge of software applications are also essential. In addition to the foregoing minimum qualifications, a candidate with at least three years’ experience as a judicial staff attorney, as an appellate practitioner, or in a position involving a comparable legal writing and analysis focus and the exercise of adjudicatory (as opposed to solely advocacy) skills is desirable. MINIMUM QUALIFICATIONSLevel B: Active membership in the State Bar of California and the equivalent of two years of post-bar legal experience in a legal setting such as a private law practice, corporation, government agency, law school, court, or legal publishing company. OR Equivalent to two years of post-bar legal experience in a legal setting as described above, including one year of experience as an appellate attorney, Level A, with the judicial branch. Level C: Active membership in the State Bar of California and the equivalent of three years of post-bar legal experience in a legal setting such as a private law practice, corporation, government agency, law school, court, or legal publishing company. OR One year of experience as an appellate attorney, Level B, with the judicial branch. Level D:Active membership in the State Bar of California and the equivalent of four years of post-bar legal experience in a legal setting such as a private law practice, corporation, government agency, law school, court, or legal publishing company. OR One year of experience as an appellate attorney, Level C, with the judicial branch. How To Apply To complete the online application, please click the Apply for Job button. The following items are required. Completed online application. Cover letter Resume Two professional references Writing Sample To ensure consideration of your application for the earliest round of interviews, please apply by 5:00 p.m. on March 30, 2025, and include all required items listed above. The position will remain open until it is filled. Pay and Benefits PAY AND BENEFITS Level B: $8,809 to $10,274 per month (Starting salary will be between $8,809 to $8,898 per month) Level C: $8,891 to $11,301 per month (Starting salary will be between $8,891 to $9,708 per month) Level D: $10,234 to $13,659 per month (Starting salary will vary between $10,234 to $11,257 per month) Salary is based on qualifications and experience. BENEFITS: Health/Dental/Vision benefits program 14 paid holidays per calendar year Choice of Annual Leave or Sick/Vacation Leave 1 personal holiday per year Up to $130 per month reimbursement for qualifying commuting costs CalPERS Retirement Plan 401(k) and 457 deferred compensation plans Employee Assistance Program Basic Life and AD&D Insurance FlexElect Program Long Term Disability Program (employee paid/optional) Group Legal Plan (employee paid/optional) Equal Employment Opportunity The Court of Appeal, Second Appellate District is an Equal Opportunity Employer. Supplemental Questions To better assess the qualifications of each applicant, the Court asks that you respond to the following questions. Your responses should be no more than two pages in length total. Please include your responses in your cover letter. Please provide your date of admission to the State Bar of California. Please explain why you are interested in this position. Please describe, in some detail, your experience in conducting legal research and writing on complex legal issues. The Judicial Council of California Is an Equal Opportunity Employer. Apply to Job"
