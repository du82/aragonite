["https://courts.ca.gov/job/fiscal-supervisor-6363"]
title = "Fiscal Supervisor | Judicial Branch of California"
description = "Overview The Judicial Council of California is accepting applications for the position of a Fiscal Supervisor in the Trust Accounting unit for the Branch Accounting and Procurement (BAP) office."
full_description = "Fiscal Supervisor Job Id: 6363 Full/Part-Time: Full-Time Location: Sacramento Office: Branch Accounting & Procurement Department: TCAS Shared Services Salary: $8,264.00 to $12,394.00 per month Regular/Temporary: Regular Deadline: March 24, 2025 Posted: February 21, 2025 Apply to Job Overview The Judicial Council of California is accepting applications for the position of a Fiscal Supervisor in the Trust Accounting unit for the Branch Accounting and Procurement (BAP) office. This position oversees the daily activities of the Trial Court Administrative Services’ (TCAS) – Shared Services Center’s (SSC) Trust Accounting unit. Primary responsibilities include direct supervision, development, and guidance of staff involved in providing accounting and administrative controls for revenue received by trial courts for trust activities, including reconciliation of deposits to trial court bank accounts (operations, trust, distribution, and Uniform Civil Fees), allocation of interest earnings, disbursement of interest-bearing and non-interest-bearing trust and agency funds, preparation and issuance of 1099-INT tax forms, and report analysis and preparation. This position routinely interacts with internal and external stakeholders, trial court staff, and TCAS SSC supervisors to meet the trial courts’ financial and reporting needs. Additionally, this position serves as a subject matter expert on issues related to trust accounting and financial reporting. The Judicial Council The Judicial Council of California is the policy setting body for the state court system and has constitutionally conferred statewide rule-making authority. This authority includes developing, advocating for, and allocating the judicial branch budget. A majority of Council members are California state justices and judges; however, the Council also includes lawyers, legislators, and court administrators. By enhancing its role as a leadership, knowledge, and service resource for the judicial branch, the Judicial Council’s staff organization seeks to continue to evolve as one of California’s most dynamic public service entities, focused on improving access to justice for all Californians by innovating and responding to the changing needs of the courts and the public. As a government body charged with improving the statewide administration of justice, the Judicial Council has multiple offices with diverse responsibilities relating to court policy and operations. As employees of the council, every member of staff should view and approach their work as one Judicial Council with a public service mission that is greater than the sum of its parts. The Judicial Council strives for work life balance and includes substantial vacation and holiday time. In addition, we offer an excellent benefits package including pension, medical, dental, and vision coverage, flexible spending, up to $130 per month reimbursement for qualifying commuting costs, and retirement savings plans. The Sacramento office is located minutes from downtown, just north of Discovery Park. The Judicial Council offers hybrid work arrangements for many positions. The successful candidate will be expected to work in person at the Judicial Council’s Sacramento office at least two days per week, based on their office leader’s direction, and reside in the areas surrounding these locations. Responsibilities Provide daily leadership to the Trust Accounting unit, focusing on premier customer service to courts and internal partners. Approve/review the work product of the Trust Accounting unit, including trust disbursements, agency distributions, and daily cash reports for the trial courts. Diagnose various issues brought forward by staff or other departments when general understanding or resolution is needed. Lead strategy for the Trust Accounting unit. Maintain an inventory of all Trust activities performed by the courts and seek to harmonize activities across courts. Seek process improvements to assist courts and ensure the Trust Accounting unit continues to operate efficiently. Manage special requests/projects/training/testing and annual tasks. Review open system tickets and coordinate and complete system testing related to the Trust Accounting unit. Review, update, and finalize Trust Accounting desk procedures and actively assist in updating the Trial Court Financial Policies and Procedures Manual. Coordinate the development and/or update of desktop procedures for the Trust Accounting unit. Other Duties and Responsibilities: Respond to requests for statistical information from management. Attend management meetings, conduct bi-monthly Trust Accounting unit meetings, and attend group calls with courts. Review new rules and regulations that will affect accounting and assist in developing recommendations. Complete Judicial Council of California education requirements. Supervisory Duties: Recommends selection of staff; Trains staff and proposes internal and external training courses and workshops; Provides for career development and planning for staff; Approves time off requests; Reviews and approves time sheets; Evaluates employee performance and conducts performance reviews; and Administers discipline as required. Qualifications Bachelor’s degree, preferably in business, finance, accounting or directly related field, and five (5) years of professional experience in accounting, finance, budgetary analysis, or contract administration, which includes at least one (1) year of supervisory experience. An additional four years of professional experience in the assigned function as noted above may substitute for the bachelor’s degree. Or, additional directly related experience and/or education may be substituted on a year-for-year basis. OR Juris doctor, master’s of business administration or a master’s degree in a directly related field for the assigned discipline such as finance, contract administration or accountancy, and two (2) year of experience as identified above, including one (1) year of previous supervisory experience. OR One (1) year as a Senior Fiscal Analyst or other level (C43) class or three (3) years as a Fiscal Analyst or other level (C42) class with the Judicial Council of California or one (1) year of experience performing the duties of a class comparable in the level of responsibility to that of an exempt-level Senior Fiscal Analyst, or three (3) years as an exempt-level Fiscal Analyst, in a California Superior Court or California state-level government entity and a) completion of training courses on topics related to effective supervision within 6 months of promotion; or b) one year of previous supervisory experience. Desirable Qualifications: Strong knowledge and skills to interpret and apply Generally Accepted Accounting Principles, Governmental Accounting Standards Board, and Generally Accepted Government Auditing Standards. Specific experience with Fund, Governmental, and General Ledger accounting. Ability to maintain accurate financial records and prepare accurate and timely reports. Strong Microsoft Suite skills – specifically Excel, Planner, and SharePoint. Early adopter of new technology. Experience collaborating with state and local level control agencies. Ability to interact with all stakeholders positively and professionally. Other Information Please note, if you are selected for hire, verification of employment authorization to work in the United States will be required. How To Apply This position requires the submission of our official application, a cover letter, responses to the supplemental questions, and a resume. To ensure consideration of your application for the earliest round of interviews, please apply by Monday, March 24, 2025. To complete the online application, please click on the Apply For Job button. The Judicial Council provides reasonable accommodation to applicants with disabilities who request such accommodation. Reasonable accommodation needs should be requested through Human Resources at (415) 865-4260. Pay and Benefits $8,264 - $12,394 per month Some highlights of our benefits package include: Health/Dental/Vision benefits program 14 paid holidays per calendar year Choice of Annual Leave or Sick/Vacation Leave 1 personal holiday per year Up to $130 per month reimbursement for qualifying commuting costs CalPERS Retirement Plan 401(k) and 457 deferred compensation plans Employee Assistance Program Basic Life and AD&D Insurance FlexElect Program Pretax Parking Long Term Disability Program (employee paid/optional) Group Legal Plan (employee paid/optional) Equal Employment Opportunity The Judicial Council of California Is an Equal Opportunity Employer. Supplemental Questions To better assess the qualifications of each applicant, we will review your responses to the following questions. Please indicate for which employer you performed these functions. Your answers should not exceed a total of three pages. Please describe your approach to building and leading a cohesive and motivated financial analyst team. What would your strategic approach be in taking over a new team? What are the first things you would look at in determining the strategic vision and how would you enact that vision over time? How do you view the role of technology in making a group more efficient? The Judicial Council of California Is an Equal Opportunity Employer. Apply to Job"
year_published = 2025
