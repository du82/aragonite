full_description = "Policy & Administration Image Chief Justice of California The Chief Justice leads the state's third branch of government, the judicial branch. Chief Justice Patricia Guerrero is the 29th Chief Justice of California. She was sworn into office on January 2, 2023, making history as the first Latina to serve as California’s Chief Justice. In addition to her role on the California Supreme Court, Chief Justice Patricia Guerrero's constitutional duties include chairing both the Judicial Council and the Commission on Judicial Appointments. Meet the Chief Justice Learn about Chief Justice Patricia Guerrero and her path to the office. Civic Learning Initiative The Chief Justice is committed to improving civic learning and engagement in California. Newsroom Find news and features related to the Chief Justice. The Judicial Council The Judicial Council The Judicial Council is responsible for improving the statewide administration of justice in the California courts, the largest court system in the nation. Meetings Find information on the staff agency of the Judicial Council, including organizational charts, request for proposals, careers and records. Advisory Bodies Find information on the staff agency of the Judicial Council, including organizational charts, request for proposals, careers and records. Judicial Council Staff Staff The Judicial Council is responsible for improving the statewide administration of justice in the California courts, the largest court system in the nation. Budget & Finance Find financial reports and budget information for the California court system and learn about budget cut impacts throughout the judicial branch. Strategic Plan The Judicial Council is responsible for improving the statewide administration of justice in the California courts, the largest court system in the nation. Governmental Affairs Find information on the staff agency of the Judicial Council, including organizational charts, request for proposals, careers and 