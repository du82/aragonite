["https://courts.ca.gov/programs-initiatives/collaborative-justice-courts/adult-courts/mental-health-courts"]
title = "Mental Health Courts | Judicial Branch of California"
full_description = "Mental Health Courts Collaborative Justice Courts Adult Courts Community/Homeless Courts Homeless Court Technical Assistance for Courts Drug Courts DUI Courts Mental Health Courts Reentry Courts Veterans Treatment Courts Grants/Funding Juvenile Collaborative Courts What is a Mental Health court? Mental health courts (MHC) are a form of collaborative court that provides specific services and treatment to defendants dealing with mental illness. Mental health courts provide an alternative to the traditional court system by emphasizing a problem-solving model and connecting defendants to a variety of rehabilitative services and support networks. Each MHC has different participant requirements and available services. The goal of a mental health court is to: support participants successful return to society and reduce recidivism; increase public safety; and, improve individual’s quality of life. How do they work? Mental health courts only accept people with demonstrable mental illnesses that can be connected to the individual’s illegal behavior. Participation in a mental health court is voluntary and the defendant must consent to involvement in the program. Screening and referral to a mental health court should occur as soon as possible after arrest to insure early intervention. Screening is also used to determine whether a mental health court can provide appropriate resources and support to the individual. Mental health courts use a structure of case management based in intensive supervision/monitoring and individual accountability. Case management is supervised by a team of professionals; teams are typically comprised of members of the justice system, mental health providers, and other support systems. The judge oversees the treatment and supervision process, and facilitates collaboration among team members. In 2008, the Council of State Government Justice Center published a report outlining the 10 Essential Elements of Mental Health Courts. These essential elements provide guidelines for developing and operating a mental health court; including target participants, various types of services and support, and the creation of an effective court team. The original report can be found here. Are Mental Health Courts Effective? Yes. Most studies find that adult mental health courts have a positive effect on participants’ rehabilitation and criminal behavior during and after their participation. Specifically, studies have found that mental health court participants are significantly more likely to utilize treatment services, less likely to be rearrested, and spent fewer days in jail as opposed to nonparticipants. Studying the effectiveness of mental health courts can be challenging due to several factors including the difficulty of measuring the outcome of rehabilitative services and finding appropriate control groups. As such, continued research will be especially helpful for increasing the sample size of studies and determining the lasting effects of MHC participation over time. Expand all Close all Judicial Council Webinars Adult Drug Court Standards Webinar Series The Judicial Council of California partnered with drug court subject matter experts to create a 12-month “lunch box” series of live, interactive, on-line trainings that focused on each Adult Drug Court Best Practice Standard from All Rise, formerly the National Association of Drug Court Professionals (NADCP). See the Judicial Council YouTube Adult Drug Court Standards Webinar Series to watch. Mental Health: Lived Experiences This presentation explores how judges and courts staff can effectively address court users who have a mental illness. This webinar includes interviews of people involved in the justice system who have a mental illness sharing their court experiences and practical takeaways for improved court sessions. Presentation Video Partnering with County Behavioral Health to Serve Justice-Involved Populations This three-part webinar discusses the services that county behavioral health agencies provide, including the different treatment options, levels of care, and types of treatment providers. Video Part 1 Video Part 2 Video Part 3 Serious Mental Health Disorders This webinar defines ‘serious mental health disorder’, and discusses common diagnoses in the criminal justice system, symptoms of these disorders, and effective treatments. Presentation Video Organizations California Department of Health Care Services, Mental Health Services County Behavioral Health Directors Association Council on Criminal Justice and Behavioral Health Behavioral Health Education and Resources Publications Mental Health Services Act (MHSA) Information Sheet (Updated April 2022) Literature Review: Mental Health Courts (April 2012) An overview of the literature on mental health diversion programs and mental health courts. Mental Health Courts: A Guide to Research-Informed Policy and Practice Improving Responses to People with Mental Illnesses: The Essential Elements of a Mental Health Court A Guide to the Role of Crime Victims in Mental Health Courts Mental Health Courts: A Primer for Policymakers and Practitioners A Guide to Mental Health Court Design and Implementation A Guide to Collecting Mental Health Court Outcome Data"
