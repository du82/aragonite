full_description = "Facilities The Judicial Council supports the court facilities of California's Supreme Court, Courts of Appeal, and trial courts by providing a broad range of services: facility planning, design and construction, quality compliance, facility operations management, environmental compliance and sustainability, real estate services and asset management, and emergency planning and security coordination. To Report Facilities Issues, please contact:Facilities Services, Customer Support Center 2860 Gateway Oaks Drive, 4th Floor Sacramento, California 95835-4336 888-225-3583 or facilities@jud.ca.gov Program Information Program Overview and Resources Program Timeline Doing Business With Us Building California Courthouses Currently, the Judicial Council is managing 16 active or in-progress capital projects. A total of 35 projects and 2 studies have been completed to date. Learn More Facilities Advisory Committees These Judicial Council committees provide ongoing oversight of the work of Judicial Council staff in its effort to implement the facilities programs of the judicial branch: Court Facilities Advisory Committee This committee makes recommendations to the Judicial Council concerning the judicial branch capital programs for trial and appellate courts throughout the state. Learn More Trial Court Facility Modification Advisory Committee This committee makes recommendations to the Judicial Council on facility modifications, maintenance, and operations; environmental services; and utility management for existing trial courts facilities throughout the state. Learn More Court Security Advisory Committee This committee makes recommendations to the Judicial Council for improving court security, including personal security and emergency response planning. Learn More Real Estate Policies Subcommittee This subcommittee of the Executive and Planning Committee makes recommendations on policies, procedures, and guidelines governing various real estate matters for court facilities throughout the state. Learn More"
