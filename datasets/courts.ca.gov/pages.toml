full_description = "Welcome to the California Courts The largest judicial system in the country, bringing equal access to justice for all Californians. Search Serving California Courts Image Chief Justice Patricia Guerrero Chief Justice Guerrero is the 29th Chief Justice of California, making history as the first Latina to serve in the position. Find Your Court Pay traffic violations, access jury information, find a local self-help desk, and much more. Search Popular Links Court Forms Rules of Court Citable Opinions Public Access to Records Docket Information Requests for Proposals Branch Policies & Administration Currently Soliciting Nominations The Executive and Planning Committee is currently soliciting nominations to fill vacancies on the Judicial Council advisory and education committees. Please visit the nominations page for more information. Engage with the courts through the Judicial Council to better understand how we work for you and to learn more about our branch policies and administration. Judicial Council Learn about the policymaking body of the California courts, its members, attend meetings, and more. Advisory Bodies The Judicial Council fulfills its mission through committees and task forces. Attend open meetings and learn about members or initiatives. Administrative Offices Learn more about Judicial Council staff and their work, including the advisory bodies they support. Court-Related Legislation Search by topic for active legislation that affects the courts or is of general interest to the courts. Invitations to Comment The Judicial Council values and seeks public comment on proposals related to judicial administration. Learn about latest proposals. Research & Data See how the judicial branch uses statistics, analytics, and research to provide data-informed reports. Programs Judicial Council programs and activities are designed to enhance the quality of justice in California's courts. Image For Families & Children Learn about programs that serve the diverse needs of children, youth, parents, families, and other users of the California courts. Image Collaborative Justice Courts Collaborative justice courts take a team approach to decision making, integrating social, judicial, and community resources. Image Criminal Justice Programs Managing Criminal Justice initiatives for the benefit of California courts, justice partners, and the public. Image Court Outreach Local court outreach efforts and the statewide Power of Democracy Civic Learning initiative aim to educate the public about the judicial branch. View all Programs Looking for the Self-Help Guide? Californians looking for information on case types or to represent themselves in court can find step-by-step instructions, court forms, and other resources on the Self-Help Guide. View Self-Help Guide Of Current Interest March 03, 2025 2025 Judicial Demographics Report: California Bench Continues to Grow More Diverse March 03, 2025 2025 Civic Learning Award Application Period is Now Open February 25, 2025 Los Angeles Court Staff Assist Court Users Affected by Wildfires February 21, 2025 Council Receives Preview of New Model Policy That Provides Guidelines, Safeguards on Use of Generative AI by Courts Visit Newsroom Image Learn about the Judicial Branch The branch has three levels of courts. The Supreme Court is the highest court in the state. Cases move up from the Courts of Appeal and the superior (trial) courts. In support of the courts, there is the Judicial Council, which is the policy making body for the branch. Learn more about each. Supreme Court Courts of Appeal Superior Courts"
