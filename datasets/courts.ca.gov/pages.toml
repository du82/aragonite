["https://courts.ca.gov/courts"]
title = "Courts | Judicial Branch of California"
full_description = "Courts Overview Learn about the three tiers of the judicial branch and how the jury system is an integral part of the courts. The Three Levels of Courts Image Supreme Court The Supreme Court is the state's highest court. Its decisions are binding on all other California state court. Read opinions, find docket information, and learn more about the justices on the bench. Image Courts of Appeal The appeals court is the intermediate court of review for the state. It is divided geographically into six districts where each district is comprised of multiple counties. Learn more about each district. Image Superior Courts Also known as trial courts, there are 58, one for each county in the state. These courts provide information on jury status, traffic tickets, self-help resources, and other case-related information. Jury Service Juries play an important and crucial role in our country's democratic process. Without them, our legal system would grind to a halt. Your help is essential in ensuring that all citizens are available to serve on juries when called. Learn more about Jury Service and your role in it. Jurors General information for potential jurors. Employers Learn about when your employees are called to jury duty. Judges, Attorneys, & Court Staff See Civil or Criminal Jury instructions Find Your Jury Court The Judicial Council does not provide individual jury summons information. Search for your local court for those details. Search Jury Service Glossary Referring to the Jury Glossary may help you better understand the jury process."
