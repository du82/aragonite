full_description = "Alerta sobre estafa de jurado Image Más de 12 estados, entre ellos California, han publicado advertencias sobre llamadas telefónicas de personas que dicen ser funcionarios judiciales o de las fuerzas del orden. No divulgue ninguna información sobre su cuenta bancaria o tarjeta de crédito a ninguna persona que se presente como funcionario judicial o de las fuerzas del orden. Si recibe una comunicación de alguien que solicita sus datos personales, llame a la unidad de fraude de su departamento de policía inmediatamente y a la oficina del jurado de su corte local. Tenga en cuenta que es posible que el personal oficial de la corte lo llame por teléfono, pero nunca le pedirá información personal. Para obtener información adicional: Sitio web del FBI Preguntas comunes sobre jurados El sitio web de su corte local"
