["https://courts.ca.gov/programs-initiatives/justicecorps"]
title = "JusticeCorps | Judicial Branch of California"
full_description = '''Applications are now being accepted for the 25-26 JusticeCorps Service Year. Increasing access to justice through the power of national service. JusticeCorps Image Apply for the JusticeCorps Graduate Fellowship Apply to serve as a Legal Access Intern in Los Angeles, the Bay Area, and San Diego. JusticeCorps is dedicated to increasing access within California’s legal system by offering support to the thousands of individuals representing themselves in civil cases each year. We train undergraduates and recent graduates to provide direct service and neutral assistance (not legal advice) to self-represented litigants in one of the many court-based self-help centers across the state. JusticeCorps members serve under the supervision of attorneys to offer essential support for those navigating the court system on their own, by providing one-on-one support and assisting with workshops. JusticeCorps members empower litigants to understand their options, to have their voices heard, and to confidently move forward with their legal matter. Image JusticeCorps Members on Their Service Experience... "You have so much that you can take away from this internship, connections, knowledge, and experience; this isn't like your normal internship, it stands out, you get onsite experience with court documents and get to help others who need it." "I never in a million years thought I would be able to read court documents and understand what's going on. However, now I have that skill which isn't a common one and definitely stands out." What You’ll Do in JusticeCorps Work directly with litigants: All JusticeCorps members receive training in a variety of legal areas so they can offer essential support to those representing themselves by helping litigants complete legal forms, assisting with community legal education workshops, providing referrals, and listening to people’s stories. Learn from attorneys: JusticeCorps members serve in courts around California and work under the guidance of self-help center attorneys to support the public. Attorneys provide supervision, mentorship, and feedback. At the end of every service shift, attorneys run a case review with JusticeCorps members to review the details of the day’s cases so they can go over the experience with the litigants served that day. Develop Professional Skills: JusticeCorps offers a unique experience to learn about the law from within a courthouse. In addition to gaining deep legal training and customer service skills, workshops and experiences are curated so JusticeCorps members can grow their professional skills outside of the self-help centers. These include visits to law schools, resume workshops, self-care and financial literacy sessions, and others! Promote access to justice: At the center of JusticeCorps is providing greater access to navigating California’s court and legal systems. By offering these direct services to members of the public, JusticeCorps helps thousands of people gain greater understanding of their cases and ability to navigate the legal system with more certainty. Participate in National Service: JusticeCorps members are AmeriCorps members. JusticeCorps is a program of the California Courts, administered by CaliforniaVolunteers and sponsored by AmeriCorps, a federal agency that improves lives, strengthens communities, and fosters civic engagement through service and volunteering. As a JusticeCorps member you’ll join a cohort of nearly 300 active members and 5,000+ alumni dedicated to increasing access to justice throughout California. Image JusticeCorps Service Opportunities JusticeCorps members serve a 300-hour or 1,700-hour AmeriCorps term of service. 300-hour Legal Access Interns are students enrolled at one of JusticeCorps' partner campuses, and complete their service over one academic year. JusticeCorps Graduate Fellows are full-time AmeriCorps members, who complete their term of service over 12 months. JusticeCorps Legal Access Interns (300-hr AmeriCorps Members) Legal Access Interns (LAI’s) are undergraduate students enrolled at JusticeCorps partner campuses in Los Angeles, the Bay Area, and San Diego. Legal Access Interns come from a variety of majors and are trained to provide legal education to litigants by assisting in leading community workshops or providing one-on-one services. LAI Minimum Eligibility: In addition to meeting AmeriCorps eligibility requirements, LAI applicants must be an undergraduate student enrolled during the entire 2025-2026 academic year at one of JusticeCorps’ participating partner campuses. LAI Service Commitment: LAI’s must complete 300 hours of service beginning September 2025 and concluding as early as May 2026. JusticeCorps LAI members are expected to serve 6-8 hours per week, primarily during the academic year. Los Angeles JusticeCorps also offers a 300-hr summer program, during which Legal Access Interns serve full-time while school is not in session. Los Angeles Summer LAI Minimum Eligibility: In addition to meeting AmeriCorps eligibility requirements, LAI applicants must be an undergraduate student. Summer Legal Access Interns are not required to attend a JusticeCorps partner campus. Los Angeles Summer LAI Service Commitment: Summer LAI’s must complete 300 hours of service beginning June 2025 and concluding August 2025. Summer LAI members serve 5 days a week during their 8-10-week term. JusticeCorps Graduate Fellows (1,700-hr AmeriCorps Members) JusticeCorps Graduate Fellows commit to a Full-Time AmeriCorps term—1,700 hours served over 12 months, 5 days a week—and receive a number of benefits in exchange. Fellows may lead legal education workshops for the public and all Fellows provide direct one-on-one service to litigants seeking to represent themselves in court. In addition to providing self-represented litigants with information about procedures, options, and referrals to appropriate services, Fellows take a leadership role, and are mentors for the Legal Access Interns with whom they serve. JusticeCorps Fellows must be college graduates but do not have to be affiliated with a JusticeCorps partner campus. Minimum Eligibility: In addition to meeting AmeriCorps eligibility requirements, Fellowship applicants must have received an undergraduate degree by August 10, 2025. Fellows are not required to be affiliated with a JusticeCorps partner campus. Service Commitment: Fellows must complete 1,700 hours of service beginning August 2025 and concluding in August 2026. See the JusticeCorps Member Position Descriptions. JusticeCorps Graduate Fellow Benefits JusticeCorps Graduate Fellows will receive the following benefits during their service term: $34,500 Living Allowance (before taxes) spread evenly over 12 months $10,000 combined Segal Education Award and California For All Education Award (upon completion of service) SNAP (Food Stamps) – for those eligible Health Insurance AmeriCorps Member Assistance Program (MAP)—wellness benefits including mental health support and life coaching Forbearance on existing qualifying student loans and payment of interest accrued during service Child care assistance to qualifying Fellows, paid to an eligible provider of your choice Learn more about AmeriCorps service and benefits. Image Bay Area Bay Area Fellowship Application Deadline: Monday, February 17, 2025 Bay Area LAI Application Deadline: Monday, February 24, 2025 Bay Area service sites are located in Alameda, Contra Costa, San Francisco, Solano, and San Mateo counties. Bay Area Campus Partners • University of California at Berkeley • San Francisco State University • California State University East Bay • San Jose State University • Stanford University • Cañada College • College of San Mateo • Skyline College • Santa Clara University Image Los Angeles Los Angeles Fellowship Application Deadline: Monday, February 17, 2025 Los Angeles LAI Application Deadline: Priority deadline for all CSU campuses and USC is Monday, March 10, 2025. Priority deadline for UCLA is Monday, April 7, 2025. Applications received by the priority deadline will be given first consideration, however applications will be accepted until all positions are filled. Los Angeles Summer LAI Application Deadline: Monday, February 17, 2025 Los Angeles service sites are located throughout the county, including Downtown Los Angeles, Chatsworh, Pomona, Pasadena, Compton, Long Beach, and Whittier. Los Angeles Campus Partners • California State University at Dominguez Hills • California State University at Long Beach • California State University at Northridge • California State Polytechnic University Pomona • University of California at Los Angeles • University of Southern California Image San Diego San Diego Fellowship Application Deadline: Monday, February 17, 2025 San Diego LAI Application Deadline: Monday, March 3, 2025 San Diego service sites are located in North, East, South and Downtown San Diego. San Diego Campus Partners • University of California at San Diego • San Diego State University • California State University, San Marcos Contact JusticeCorps For Questions About Applying to Los Angeles JusticeCorps: Jennifer Kalish, Program Director 213-633-0692 For Questions About Applying to Bay Area JusticeCorps: Dan Siskind, Program Director 510-891-6406 For Questions About Applying to San Diego JusticeCorps: Amoreena Urbeck, Program Director 619-844-2329 For Questions About Statewide Program Administration: Nicole Claro, Judicial Council Senior Analyst 415-865-4504 Judicial Council of California 455 Golden Gate Avenue San Francisco, California 94102-3688'''
