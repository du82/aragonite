title = "Court statistics | Judicial Branch of California"
full_description = "Research and data Court statistics Current report 2025 Court Statistics Report: Statewide Caseload Trends View PDF Overview The Court Statistics Report contains essential information about the annual caseload of the California judicial branch, with a particular emphasis on the number and types of cases that are filed and disposed of in the courts. Explore data from the report The Court Statistics Report is published annually by the Judicial Council of California and is designed to fulfill the provisions of article VI, section 6 of the California Constitution, which requires the Judicial Council to survey the condition and business of the California courts. The Court Statistics Report combines 10-year statewide summaries of superior court filings and dispositions with similar workload indicators for the California Supreme Court and Courts of Appeal. The 2025 Court Statistics Report also provides more detailed information on filings and dispositions in the individual superior courts for the most recent fiscal year for which data are available, 2023–24. Image Trial court operations Filings and dispositions per county and by casetype. See data Image Judicial officers and court employees Compare numbers of authorized judges and filled Full-Time Employees by appellate district and county. See data Past reports 2021 to present 2025 Full Report 2024 Full Report 2023 Full Report 2022​ Full Report 2021 Full Report NOTE: Fiscal Year 2019-20 data were significantly impacted due to the COVID-19 pandemic as court operations were limited between March and June 2020. 2011 to 2020 2020 Full Report Introduction 2019​ Full Report Introduction 2018 Preface Introduction Full Report 2017 Preface Introduction Full Report 2016 Preface Introduction Full Report 2015 Preface Introduction Full Report News Release: Complex Court Filings Continue to Rise 2014 Preface Introduction Full Report News Release: Court Filings Decrease in Fiscal Year 2012–2013 2013 Preface Introducti