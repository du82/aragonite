full_description = '''Unpublished/Non-Citable Opinions Unpublished or "non-citable" opinions are opinions that are not certified for publication in Official Reports and generally may not be cited or relied on by other courts or parties in other actions (see California Rules of Court, rule 8.1115). Unpublished opinions are available on this website as follows: Unpublished opinions from the last 60 days are posted together on this page as public information about actions taken by the Courts of Appeal. Use the pull-down menu below to select the unpublished opinions that you want to view and click on the 'view' button to activate your selection. After 60 days, these opinions remain available via our Case Information Search Please note that copies of unpublished opinions may also be available from or searchable through sources other than this website. Search and Filter - Source -1st District Court of Appeal2nd District Court of Appeal3rd District Court of Appeal4th District Court of Appeal, Division One4th District Court of Appeal, Division Two4th District Court of Appeal, Division Three5th District Court of Appeal6th District Court of Appeal Source Case Number Title 1 - 50 of 1316 results Show 50 per pageShow 100 per pageShow 200 per page A172049 March 4, 2025 1st District Court of Appeal • Unpublished Opinion D.R. v. Superior Court CA1/3 filed 3/4/25 PDF Other Formats G063106 March 4, 2025 4th District Court of Appeal, Division Three • Unpublished Opinion Route Four v. Hawthorne Hydroponics CA4/3 filed 3/4/25 PDF Other Formats G063705 March 4, 2025 4th District Court of Appeal, Division Three • Unpublished Opinion P. v. Amsbaugh CA4/3 filed 3/4/25 PDF Other Formats F088219 March 4, 2025 5th District Court of Appeal • Unpublished Opinion P. v. Crane CA5 filed 3/4/25 PDF Other Formats A166371 March 4, 2025 1st District Court of Appeal • Unpublished Opinion Evariste Group v. Security National Guaranty CA1/1 filed 3/4/25 PDF Other Formats B333772 March 4, 2025 2nd District