["https://courts.ca.gov/courts/courts-appeal"]
title = "Courts of Appeal | Judicial Branch of California"
description = "Serves Alameda, Contra Costa, Del Norte, Humboldt, Lake, Marin, Mendocino, Napa, San Francisco, San Mateo, Solano, and Sonoma counties."
full_description = "California Courts of Appeal About The California Courts of Appeal were established by constitutional amendment in 1904 and are the state's intermediate courts of review. The primary function of the Courts of Appeal is to ensure that the law is interpreted and applied correctly, not to hear testimony, consider evidence outside of the record, or retry cases. An appeal from a superior court judgment is decided based on the record from the original trial or proceeding. There are six districts throughout the state and the Courts of Appeal website is organized by each district. Learn about the districts, their processes, justices on the bench, view oral arguments, and more. Continue to Courts of Appeal Image What You'll Find on the Courts of Appeal Site 1st District Court of Appeal Serves Alameda, Contra Costa, Del Norte, Humboldt, Lake, Marin, Mendocino, Napa, San Francisco, San Mateo, Solano, and Sonoma counties. Visit 1st District 2nd District Court of Appeal Serves Los Angeles, Ventura, San Luis Obispo, and Santa Barbara counties. Visit 2nd District 3rd District Court of Appeal Serves Alpine, Amador, Butte, Calaveras, Colusa, El Dorado, Glenn, Lassen, Modoc, Mono, Nevada, Placer, Plumas, Sacramento, San Joaquin, Shasta, Sierra, Siskiyou, Sutter, Tehama, Trinity, Yolo, and Yuba counties. Visit 3rd District 4th District Court of Appeal Serves Imperial, Inyo, Orange, Riverside, San Bernardino, and San Diego counties. Visit 4th District 5th District Court of Appeal Serves Fresno, Kern, Kings, Madera, Mariposa, Merced, Stanislaus, Tulare, and Tuolumne counties. Visit 5th District 6th District Court of Appeal Serves Monterey, San Benito, Santa Clara, and Santa Cruz counties. Visit 6th District Statewide Appellate Programs The California Courts of Appeal have programs that apply across the state. Explore each of our programs, including the California Judicial Mentorship Program, the Court-Appointed Counsel Program, and Habeas Counsel (Prop 66). Explore Statewide Appellate Programs"
