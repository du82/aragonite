["https://courts.ca.gov/programs-initiatives/criminal-justice-services"]
title = "Criminal Justice Services | Judicial Branch of California"
description = "The Behavioral Health Education and Resources page focuses on the intersection of criminal justice and behavioral health, and provides resources for courts to better address the needs of court users. This page is intended for California court judicial officers, court employees, and justice partner agencies."
full_description = "Criminal Justice Services Data Dashboards: Trends in Felony Court Case Processing Interactive dashboards display quarterly court data on felony sentencing, petitions for modifications/revocation of supervision, and presentence warrants for failures to appear in felony cases. Learn More. Introduction Criminal Justice Services (CJS) oversees and coordinates the Judicial Council's efforts related to criminal justice. CJS performs a broad range of legal, program, and research functions to facilitate the Council’s obligations related to criminal justice policy, procedure, and court administration. CJS provides assistance to courts, justice system partners, and the public. California has embarked on a wide-ranging program of criminal justice reforms over the past decades that have had fundamental impact. Click here to see Prior Reforms Current Criminal Justice Services Office Programs Behavioral Health Education and Resources The Behavioral Health Education and Resources page focuses on the intersection of criminal justice and behavioral health, and provides resources for courts to better address the needs of court users. This page is intended for California court judicial officers, court employees, and justice partner agencies. Learn More Collaborative Justice Courts (Adult Criminal) Collaborative justice courts, also known as problem-solving courts, combine judicial supervision with rehabilitation services to reduce recidivism and improve criminal justice and health outcomes. Examples of collaborative justice courts include community courts, drug courts, mental health courts, reentry courts, and veterans courts. Learn More California Pretrial Release Program The Budget Act of 2021 (SB 129) provided funding for “the implementation and operation of ongoing court programs and practices that promote the safe, efficient, fair, and timely pretrial release of individuals booked into jail.” Learn More Community Corrections Performance Incentives Act (SB 678) The Judicial Council is involved in the administration of two community supervision initiatives that promote the use of evidence-based practices in the sentencing and supervising of felony offenders. Learn More MyCitations – Online Ability to Pay Can’t afford to pay your ticket? MyCitations allows litigants experiencing financial hardship to look up their citation(s), answer a series of simple questions, and submit a request to the court for a possible reduction in the amount owed completely online. Learn More Proposition 64: The Adult Use of Marijuana Act Effective November 9, 2016, Proposition 64 legalized specified personal use and cultivation of marijuana for adults 21 years of age or older; reduced criminal penalties for specified marijuana-related offenses for adults and juveniles; and authorized resentencing or dismissal and sealing of prior, eligible marijuana-related convictions. The proposition included provisions on regulation, licensing, and taxation of legalized use. Learn More Report on the Compassionate Release Program – 2023 Penal Code section 1172.2 authorizes the California Department of Corrections and Rehabilitation to recommend that the courts recall prison sentences in instances in which an incarcerated person has a serious illness with an end-of-life trajectory or is medically incapacitated. It also requires the Judicial Council to publicly release data regarding these release decisions. View PDF Additional Resources Bail Schedules 2025 Bail Schedule 2024 Bail Schedule 2023 Bail Schedule 2022 Bail Schedule 2021 Bail Schedule 2020 Bail Schedule 2019 Bail Schedule 2018 Bail Schedule 2017 Bail Schedule Red Light Camera Pursuant to Vehicle Code 21455.5 (i), red light camera vendors must submit an annual report to the Judicial Council that includes, but is not limited to, information regarding alleged violations, citations, and traffic collisions. Please submit these reports by April 1st to the following email address: RedLightCamera@jud.ca.gov. Contact Criminal Justice Services 455 Golden Gate Avenue San Francisco, CA 94102 Phone: 415-865-8994 Fax: 415-865-8795crimjusticeoffice@jud.ca.gov"
