["https://courts.ca.gov/policy-administration/judicial-council/apply-or-nominate-membership"]
title = "Apply or Nominate for Membership | Judicial Branch of California"
full_description = "Apply or Nominate for Membership Judicial Council Judicial Council Meetings Judicial Council Members Advisory Bodies Apply or Nominate for Membership Judicial Council Nominations Advisory Body Nominations Education Committee Nominations The Judicial Branch Strategic Plan Judicial Council Staff Judicial Council Resources Nominations and Appointment Process The Executive and Planning Committee of the Judicial Council is responsible for coordinating the nominations process to fill vacancies on the Judicial Council and its advisory bodies and education committees. The nominations and appointment process and the duties, roles, and responsibilities are described in the California Rules of Court (Title 10, Judicial Administration Rules). As chair of the Judicial Council, the Chief Justice may also appoint task forces and working groups, comprised of judges, court officials, attorneys, and members of the public, to advise the council in studying the condition of court business, improving judicial administration, and assisting the council. Task forces and working groups handle particular projects or proposals and make recommendations to the council. How to Apply The Executive and Planning Committee looks forward to receiving your nominations. The nomination memo, form, deadlines, and other information are available on the links below. • Judicial Council Nominations • Advisory Body Nominations • Education Committee Nominations"
year_published = 2025
