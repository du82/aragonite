["https://courts.ca.gov/programs/tribalstate-programs"]
title = "Tribal/State Programs | Judicial Branch of California"
full_description = "Tribal/State Programs Judicial Council Resources Juvenile Cases, Articles, Resources, Trainings (JCART) Resources for Tribal/State Court Collaborations Statewide Directory of Services for Native American Families Tribal/State Programs Fact Sheet ICWA Webinars Committed to fostering justice for Native American communities, the Tribal/State Programs work to strengthen collaboration between tribal and state courts in California. The Tribal/State Programs is a unit of the Center for Families, Children & the Courts. With federal and state funding, the Tribal-State Programs provide legal services and technical assistance to local courts on inter-jurisdictional issues across all case types and assists with the development of policies, positions, and programs to ensure the highest quality of justice and service for California’s Native American communities. Tribal Court-State Court Forum Tribal and state court judges come together as equal partners to address areas of mutual concern to the state and tribal justice systems in California. A tribal court judge or justice together with a state court judge or justice both co-chair the forum. Learn More About Tribal Court-State Court Forum California Tribal Communities According to most recent census data, California is home to more people of Native American/Alaska Native heritage in urban and rural areas than any other state in the country. There are approximately 110 federally recognized tribes in California and 78 entities petitioning for recognition. Federally recognized tribes have a unique government to government relationship with local, state and federal entities, and are recognized as sovereign nations. Tribes can create their own laws, governmental structure and enrollment or membership rules for the land and citizens of their nation. Learn More About California Tribal Communities Indian Child Welfare Act (ICWA) The Indian Child Welfare Act (ICWA) (25 U.S.C. §§ 1901 et seq.) is federal legislation, which establishes minimum federal standards for state court child welfare proceedings and many other “child custody” proceedings involving Indian children. In 2006, with the passage of California Senate Bill 678, effective January 1, 2007, codified many of these requirements into the Welfare & Institutions Code, Family Code, and Probate Code that govern Indian child custody proceedings. This legislation affects California dependency, delinquency, guardianship and some family proceedings involving Indian children. ICWA fact sheets: Adoptive Couple v. Baby Girl (2013) 133 S. Ct. 2552 and Its Application Under California Law Delinquency, Native American Identification and ICWA Tribal Participation in State Court Proceedings Governed by ICWA Learn More About ICWA Family Violence Family violence occurs throughout every community, but for tribes there may be crossover and jurisdictional issues that are important to understand when working with Native American communities. Areas of family violence addressed in our unit include: domestic violence, dating violence, sexual assault, trafficking, elder abuse and stalking. Learn More About Family Violence Tribal Justice Systems Currently there are at least 32 tribal courts located in California. The number of tribes with access to a tribal court is at least 50 because some courts serve multiple tribes. For example, the Intertribal Court of Northern California, the Intertribal Court of Southern California , and the Northern California Intertribal Court System all serve multiple tribes. Learn More About Tribal Justice Systems Tribal/State Joint-Jurisdiction Courts In California, state and tribal courts share concurrent jurisdiction over many case types. Rather than choosing between either state or tribal court jurisdiction, in a joint-jurisdiction court the tribal court judge and the state (or federal) court judge come together to simultaneously exercise their respective jurisdiction. Sharing and coordinating jurisdiction allows the leveraging of resources from each jurisdiction to improve outcomes. There are currently joint-jurisdiction courts operating in El Dorado, Humboldt, and Del Norte Counties. This page includes information on how these courts work and how they can be established in California. Learn More About Tribal/State Joint-Jurisdiction Courts More Resources State California Attorney General-Native American Affairs Office California Department of Social Services (CDSS)-Office of Tribal Affairs Governor’s Office of Tribal Affairs Federal Bureau of Indian Affairs (BIA) Bureau of Indian Affairs-Pacific Division Bureau of Indian Affairs Indian Child Welfare Act resources ICWA Designated Agents Listing Representing Tribes in ICWA Cases Tribal Dependency Representation Program: Information Sheet for California Courts Mitchell Hamline School of Law Certificate in Advocacy of the Indian Child Welfare Act California Tribal Families Coalition Performance Standards for Attorney who Represent Tribal Governments in State ICWA Proceedings Ethical Considerations when Representing Tribal Governments (Federal Bar Association 2019) Judicial Council ICWA Webinars, Training and Educational Resources Indian Child Welfare Act Laws, Regulation, State Implementing Statues, Rule of Court and Forms Legal Ethics and Indian Country (Federal Lawyer April 2016)"
