["https://courts.ca.gov/about/accessibility"]
title = "Accessibility | Judicial Branch of California"
full_description = "Accessibility for Persons with Disabilities The Judicial Branch follows the Americans with Disabilities Act (ADA), a federal statute that requires reasonable accommodations for persons with disabilities. Learn more about accommodations and how to get help. Services for Persons with Disabilities The California Courts want to make sure that people with disabilities can fully access the court system. California Rule of Court 1.100 lays out the process for requesting accommodations for court proceedings. Disability Accommodations in California Courts Disability Accommodations in California Courts (for court’s use) Persons with Disabilities A person with a disability might have a physical or medical condition that limits major life activities, has a history of such a condition, or is seen as having one. A major life activity is something that a person does every day that is important for living. This can include but is not limited to things like taking care of oneself, seeing, hearing, eating, sleeping, walking, standing, lifting, bending, speaking, breathing, learning, reading, concentrating, thinking, communicating, and working Who can ask for an accommodation? Any lawyer, party, witness, juror, or other person with an interest in attending a court proceeding may request an accommodation. What kind of help or accommodations can the court provide? Accommodations may include making reasonable modifications in practices and procedures or furnishing auxiliary aids and services, equipment, devices, or materials. Providing free legal counsel is not an accommodation. A court also cannot extend the statute of limitations for filing an action because of a disability. Are requests for accommodations private? Yes. The court keeps all information about accommodation requests private, unless the law says otherwise or the person asking for the accommodation gives written permission to share it. Visit the Online Self Help Guide How to ask for a disability accommodation in Court How to Make a Request for Accommodations If you have a disability or limitation and need an accommodation while in court, you can call or go to court and ask the ADA coordinator for an accommodation. Visit our online Self-Guide for instructions on how to ask for a disability accommodation. The page has instructions on how to fill out and turn in a form called Disability Accommodation Request (Form MC-410). Some things to have ready include: A description of what you need; A statement of the medical condition that needs accommodation; and, An explanation of why you need these accommodations The court may require the applicant to provide additional information about the medical condition. When should you make the request? Requests for accommodations should be made as early as possible, but at least five court days before you need them. The court can choose to overlook this five-day rule. What Happens After You Ask for an Accommodation The court will promptly let you know if your request is approved or denied. If it’s denied, the court will provide a written explanation. Accommodations can be granted for an unlimited time, for a specific time period, or for a particular court hearing. Why the Court May Deny a Request for Accommodation The request for accommodation may be denied if: It doesn't meet the requirements of California Rule of Court 1.100, including not providing enough explanation why a medical condition needs an accommodation. It would cause undue financial or administrative burdens or problems for the court. It would change the service, program, or activity in a fundamental or significant way. For Persons With Disabilities Requesting Accommodations: Questions and Answers About Rule of Court 1.100 for Court Users (2016) Developed by the Judicial Council Access and Fairness Advisory Committee Accessibility at the Courthouse Who Can Help Me with Access Issues at the Court? A person with a disability who needs a reasonable accommodation should contact the ADA coordinator or the Access coordinator. Every court has an ADA or Access coordinator to address requests for reasonable accommodations. The coordinator can help you to access court services and to participate in the judicial process. When calling or visiting the court, you can ask a court clerk to refer you to the court's ADA or Access Coordinator. Find your court's telephone number or address on their website: See a listing of all the courts. Resources on Access & Fairness More Advisory Committee on Providing Access and Fairness Historical Archive of Access & Fairness Reports & Publications Complaints About Disability Discrimination If you believe you’ve been treated unfairly because of a disability, you can file a complaint using the ADA Grievance Procedures for the following: Supreme Court and Courts of Appeal Grievance Procedure Local superior or trial court: contact the court directly by visiting their websites. See a listing of all trial courts and their websites. The Judicial Council’s Grievance Procedure Accessibility Accommodations at the Judicial Council To request an accessibility accommodation for any Judicial Council related business, including accommodation requests for Judicial Council meetings, to report an issue with accessibility, to report a question about accessibility, or to request information in an alternative format, please email or contact us at: Access Coordinator Judicial Council | Leadership Services Division 455 Golden Gate Avenue San Francisco, CA 94102 Tel. 415-865-7737JCCAccessCoordinator@jud.ca.gov. To enable us to respond, please indicate: The nature of the accessibility problem; Your preferred electronic format; The web address of the requested material (if applicable); and Your contact information so we can reach you if we have questions about your request. Your request will be routed for response."
