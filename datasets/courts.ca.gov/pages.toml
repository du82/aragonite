title = "Families and Children | Judicial Branch of California"
full_description = "Families and Children Helpful Links Families Change Publications What's Happening in Court? Introduction This section includes resources and program information in the areas of Family and Juvenile law. It also includes conference materials and a comprehensive list of publications produced by the Center for Families, Children and the Courts (CFCC). Family Law Juvenile Law Behavioral Health Conferences & Trainings Of Current Interest CARE Act Implementation The Community Assistance, Recovery, and Empowerment (CARE) Act authorizes specified adult persons to petition a civil court to create a voluntary CARE agreement or a court-ordered CARE plan that can include treatment, housing support, and other services for persons with untreated schizophrenia or other psychotic disorders. For more information about the CARE Act, visit the Adult Civil Mental Health page. Image CARE Act Eligibility Criteria This five-minute video walks through the seven eligibility criteria that must be met in order for someone to be eligible for services under the CARE Act. Video Transcript Community Assistance, Recovery, and Empowerment (CARE) Act Funding The August Trial Court Trust Fund Court Operations Distribution included CARE Act funding for all courts, both the Cohort 1 courts implementing the CARE Act in fiscal year 2023-24 and Cohort 2 courts planning implementation for 2024-25. Funding is intended to support hearing costs and other court operations costs including clerk and administrative support, court coordinators, self-help centers, and other costs associated with planning for and hearing cases in this new case type. Please consult with JC IT before making technology purchases and JC Facilities Office for facility improvements. For any questions, please contact CFCC@jud.ca.gov. California Courts Juvenile Portal: Juvenile Cases, Articles, Resources, and Trainings (JCART) CFCC’s online learning repository has moved from CalDOG to Juvenile Cases, Articles, Resources, Training - also known as JCART. Users accounts have moved to JCART; to access JCART you need to do a one-time password reset. If you receive a login error, need to update your email address, or need to start a new account, please contact jcart@jud.ca.gov and we will be more than happy to assist you. For your convenience here are two videos on how to access and navigate our new site. About Juvenile Collaborative Court Models This series of briefings provides an introduction to juvenile collaborative courts, including what types of courts exist, how they work, and how they can be replicated, as well as an overview of various juvenile collaborative court models, information about starting a juvenile collaborative court model, and potential impacts of new laws on juvenile collaborative courts. Historical Documents Center for Families, Children & the Courts Journal Image Volume 1 — 1999Volume 2 — 2000Volume 3 — 2001Volume 4 — 2003Volume 5 — 2004Volume 6 — 2005 Contact Center for Families, Children & the CourtsOperations & Programs Division Judicial Council of California 455 Golden Gate Avenue, 6th Floor San Francisco, California 94102-3688Email: CFCC@jud.ca.gov"
