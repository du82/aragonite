["https://courts.ca.gov/job/facilities-analyst-6285"]
title = "Facilities Analyst | Judicial Branch of California"
description = "Overview The Judicial Council of California is accepting applications for the position of Facilities Analyst for Facilities Services."
full_description = "Facilities Analyst Job Id: 6285 Full/Part-Time: Full-Time Location: San Francisco or Sacramento Office: Facilities Services Department: Planning - FUND 3037 Salary: $7,294.00 to $10,942.00 per month Regular/Temporary: Regular Deadline: March 15, 2025 Posted: March 3, 2025 Apply to Job Overview The Judicial Council of California is accepting applications for the position of Facilities Analyst for Facilities Services. The Facilities Analyst performs facilities budgeting, planning, regulatory compliance management, project review, and support project management activities under general direction and supervision. The incumbent is involved with Master Facility Modification Planning, Facilities Maintenance Management, and Trial Court Facility Modification Advisory Committee support. This position improves the Judicial Council of California’s (JCC) ability to plan for, administer and perform current and future facility modifications efficiently. The Judicial Council The Judicial Council of California is the policy setting body for the state court system and has constitutionally conferred statewide rule-making authority. This authority includes developing, advocating for, and allocating the judicial branch budget. A majority of Council members are California state justices and judges; however, the Council also includes lawyers, legislators, and court administrators. By enhancing its role as a leadership, knowledge, and service resource for the judicial branch, the Judicial Council’s staff organization seeks to continue to evolve as one of California’s most dynamic public service entities, focused on improving access to justice for all Californians by innovating and responding to the changing needs of the courts and the public. As a government body charged with improving the statewide administration of justice, the Judicial Council has multiple offices with diverse responsibilities relating to court policy and operations. As employees of the council, every member of staff should view and approach their work as one Judicial Council with a public service mission that is greater than the sum of its parts. The Judicial Council strives for work-life balance, including substantial vacation and holiday time. In addition, we offer an excellent benefits package, including pension, medical, dental, and vision coverage, flexible spending, up to $130 per month reimbursement for qualifying commuting costs, and retirement savings plans. In San Francisco, the office is only a 7-minute walk from the Civic Center BART station. In Sacramento, the office is minutes from downtown, just north of Discovery Park. The Judicial Council offers hybrid work arrangements for many positions. The successful candidate will be expected to work in person at the Judicial Council’s San Francisco or Sacramento office at least two days per week, based on their office leader’s direction, and reside in the areas surrounding these locations. Responsibilities Provide planning support to the facility modification program: Analysis and documentation preparation for the Trial Court Facility Modification Advisory Committee meetings. Facilities budget management. Manage facilities modification project review process and outside agency compliance. Perform facilities planning analytics and reports. Perform updates to CAFM from the TCFMAC approved projects. Support project management. Provide support to the Facilities Maintenance Program: Prepares and reviews court facility maintenance guidelines. Participates in and conducts training on facilities issues. Write articles on design, engineering, and other facilities related issues for publication. Data analysis for data driven decision making. Supports the management and deliverables of the Trial Court Facility Modification Advisory Committee: Prepares or reviews budget proposals for state or county funded projects. Prepares, review, or monitors consultants in the preparation of periodic and special reports on various aspects of court facilities programming and utilization, such as facilities surveys and building capacity analyses; system lifecycle costing, program performance analysis; and other requirements as requested by the committee. Prepares and reviews documentation supporting annual major and minor capital improvement program budgets and requirements, including but not limited to Budget Change Proposal development, Annual and Quarterly FM reports, Annual Budget proposals or other similar reporting requirements. Prepares and recommends new or revised court facilities guidelines reflecting changing requirements for court facilities utilization. Develops meeting reports and presentations as required. Support Engineering and Study efforts relative to facility modifications within court and appellate facilities: Project manage studies, retro-commissioning efforts, and FM when assigned. Conduct site walks and develop scope of work, budget, and method of execution for assigned task. Provide project updates to stake holders utilizing CAFM and regional monthly FM review meetings. Update lessons learned database. Generate Deferred Maintenance List and Annual Agenda, Annual Reports for TCFMAC. Other Information Please note, if you are selected for hire, verification of employment authorization to work in the United States will be required. How To Apply To ensure consideration of your application for the earliest round of interviews, please apply by 5:00 P.M. on March 15, 2025. This position requires the submission of our official application, a resume and a response to the supplemental questions. To complete an online application, please click the Apply for Job button. The Judicial Council provides reasonable accommodation to applicants with disabilities who request such accommodation. Reasonable accommodation needs should be requested through Human Resources at (415) 865-4260. Equal Employment Opportunity The Judicial Council of California Is an Equal Opportunity Employer. Supplemental Questions To better assess the qualifications of each applicant, please provide a response to the following questions: 1. Please provide specific examples of your experience with collecting and analyzing data and formulating reports for managers. 2. Do you have a current valid California’s driver’s license. Qualifications Bachelor’s degree, and three (3) years of professional experience providing analytical and technical support to facilities management. An additional four years of professional experience in the assigned function as noted above may substitute for the bachelor’s degree. Or, additional directly related experience and/or education may be substituted on a year-for-year basis. OR Master’s degree in a directly related field such as architecture, civil engineering, or construction or building management. OR Two years as an Associate Facilities Analyst, in the assigned field, with the Judicial Council of California or two years of experience performing the duties of a class comparable in the level of responsibility to that of an Associate Facilities Analyst in a California Superior Court or California state-level government entity. LICENSING AND CERTIFICATIONS − Valid driver’s license, as assigned. Pay and Benefits $7,294.00 - $10,942.00 per month Some highlights of our benefits package include:• Health/Dental/Vision benefits program• 14 paid holidays per calendar year• Choice of Annual Leave or Sick/Vacation Leave• 1 personal holiday per year• Up to $130 per month reimbursement for qualifying mass transit costs• CalPERS Retirement Plan• 401(k) and 457 deferred compensation plans• Employee Assistance Program• Basic Life and AD&D Insurance• Flex Elect Program• Pretax Parking• Long Term Disability Program (employee paid/optional)• Group Legal Plan (employee paid/optional) The Judicial Council of California Is an Equal Opportunity Employer. Apply to Job"
year_published = 2025
