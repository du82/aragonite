["https://courts.ca.gov/job/facilities-management-administrator-6364"]
title = "Facilities Management Administrator | Judicial Branch of California"
description = "Overview The Judicial Council of California is accepting applications for the position of Facilities Management Administrator for Facilities Services."
full_description = "Facilities Management Administrator Job Id: 6364 Full/Part-Time: Full-Time Location: Dublin Office: Facilities Services Department: Facility Operations - R3 West Salary: $6,901.00 to $10,353.00 per month Regular/Temporary: Regular Deadline: March 17, 2025 Posted: February 24, 2025 Apply to Job Overview The Judicial Council of California is accepting applications for the position of Facilities Management Administrator for Facilities Services. The Facilities Management Administrator is responsible for the administration of a comprehensive facility management, operations and maintenance program in their assigned region; independently planning and coordinating all staff and contracted services engaged in managing and maintaining court facilities. The position ensures alignment of facility management priorities with those of superior court administration and performs daily and periodic work personally and via supervised staff associated with facilities management services including procurement and contracting of facilities operations and maintenance activities at designated court locations. The position implements strategic and routine programs for operating and maintaining safe, secure and healthy court facilities, consistent with applicable codes, regulations, guidelines, and industry standard practices. The position ensures facilities and asset preservation and sound energy management; assessing facilities critical infrastructure needs and ensuring systems and equipment operate efficiently while supporting the needs of the court. The Judicial Council The Judicial Council of California is the policy setting body for the state court system and has constitutionally conferred statewide rule-making authority. This authority includes developing, advocating for, and allocating the judicial branch budget. A majority of Council members are California state justices and judges; however, the Council also includes lawyers, legislators, and court administrators.By enhancing its role as a leadership, knowledge, and service resource for the judicial branch, the Judicial Council’s staff organization seeks to continue to evolve as one of California’s most dynamic public service entities, focused on improving access to justice for all Californians by innovating and responding to the changing needs of the courts and the public. As a government body charged with improving the statewide administration of justice, the Judicial Council has multiple offices with diverse responsibilities relating to court policy and operations. As employees of the council, every member of staff should view and approach their work as one Judicial Council with a public service mission that is greater than the sum of its parts. The Judicial Council strives for work-life balance, including substantial vacation and holiday time. In addition, we offer an excellent benefits package, including pension, medical, dental, and vision coverage, flexible spending, up to $130 per month reimbursement for qualifying commuting costs, and retirement savings plans. In San Francisco, the office is only a 7-minute walk from the downtown Civic Center BART station. In Sacramento, the office is minutes from downtown, just north of Discovery Park. The Judicial Council offers hybrid work arrangements for many positions. The successful candidate will be expected to work in person at Dublin location at least two days per week, based on their office leader’s direction, and reside in the areas surrounding this locations. Responsibilities Administers a comprehensive facility management, operations, maintenance and project management program in the Southern California region and surrounding counties; independently planning and coordinating staff and contracted services engaged in managing and maintaining court facilities. Authorize, verify, and approve work conducted by service providers and contractors. Conduct comprehensive on-site facilities review and evaluation to ensure facilities meet operational, maintenance, and asset preservation goals: Coordinate with staff and service providers to ensure that demand and preventive maintenance is conducted in a timely manner to meet contract and industry quality standards and prolong life of equipment and assets. Collaborate as required to plan, control, and determine necessary project work to preserve, maintain, and improve court facilities. Verify work quality of service providers and contractors to meet established requirements and provide feedback for validation of work or improvement as necessary. Analyze and review operational building practices to ensure that equipment is operating efficiently while meeting the needs of the court. Conduct onsite facilities review and evaluation and anticipate facilities operations. Maintenance, and asset preservation needs Align facility management priorities with those of Superior Court administration and perform daily and periodic work associated with facilities management services including procurement and contracting of facilities operations and maintenance activity: Conduct ongoing and periodic review of facility management priorities to ensure they continue to support court needs and devise, plan, or delegate project work as necessary to support the changing needs of the court, while maintaining the priorities of an established facilities management program. Provide project management and oversight for work related to maintenance, operations, asset preservation, and court facilities improvements. Analyze and process proposals for work scope, cost, schedule, and work value. Conduct job-site review before, during, and after project work to ensure project deliverables are satisfactorily met. Collaborate with Superior Court administration to compile, analyze, and appraise court facilities needs to support ongoing and future court operations. Develop short and long-term facilities plans that meet current and future needs of the court.• Implements strategic and routine programs for operating and maintaining safe, secure, and healthy court facilities, consistent with applicable codes, regulations, guidelines, and industry standard practices: Approve and authorize work in conjunction with established policies and procedures, review and verify completed work, and process assigned electronic work orders. Implement a comprehensive software-supported facilities maintenance program for planning, management, tracking, and reporting of facilities operations and maintenance activities. Collaborate with in-house and third-party regulatory agencies for on-going review of facilities management program elements to ensure compliance with necessary regulations, guidelines, and industry standard practices. • Support design, development, and transition of facilities capital projects: Collaborate with architectural and building systems design teams, and project managers to ensure new facilities meet facilities management priorities and court needs. Conduct comprehensive plan review of planned capital projects with focus on maintenance activities, operational efficiency, materials suitability and maintainability, and energy use. Provide recommendations and approve as necessary facilities components and systems that support established facilities maintenance management program. Qualifications Bachelor’s degree, and two (2) years of building structure/systems management, facilities maintenance, project management and budgeting/cost analysis experience. An additional four years of professional experience in the assigned function as noted above may substitute for the bachelor’s degree. Or, additional directly related experience and/or education may be substituted on a year-for-year basis. OR Two years as an Associate Facilities Analyst with the Judicial Council of California or two years of experience performing the duties of a class comparable in the level of responsibility to that of an Associate Facilities Analyst in a California Superior Court or California state-level government entity. LICENSING AND CERTIFICATIONS − Valid driver’s license. Other Information Please note, if you are selected for hire, verification of employment authorization to work in the United States will be required. How To Apply To ensure consideration of your application for the earliest round of interviews, please apply by 5:00 P.M. on March 17, 2025. This position requires the submission of our official application, a resume and a response to the supplemental questions. To complete an online application, please click the Apply for Job button. The Judicial Council provides reasonable accommodation to applicants with disabilities who request such accommodation. Reasonable accommodation needs should be requested through Human Pay and Benefits $6,901.00 – $10,353.00 per month Some highlights of our benefits package include:• Health/Dental/Vision benefits program• 14 paid holidays per calendar year• Choice of Annual Leave or Sick/Vacation Leave• 1 personal holiday per year• Up to $130 per month reimbursement for qualifying commuting costs• CalPERS Retirement Plan• 401(k) and 457 deferred compensation plans• Employee Assistance Program• Basic Life and AD&D Insurance• Flex Elect Program• Pretax Parking• Long Term Disability Program (employee paid/optional)• Group Legal Plan (employee paid/optional) Equal Employment Opportunity The Judicial Council of California Is an Equal Opportunity Employer. Supplemental Questions To better assess the qualifications of each applicant, please provide a response to the following questions: 1. Discuss any specific experience you have in the facility management, maintenance, or construction fields. 2. Describe your experience with facilities management, lease management, building operations, and/or project management. 3. Do you have a current valid California’s driver’s license? 4. Judicial Council policy dictates that an employee's remote work location must be in the State of California and that their primary residence must be in the greater San Francisco Bay Area to ensure that the employee will be able to report on-site on short notice if called to work on-site for business needs. If offered a position, will you have a primary residence in the San Francisco Bay Area by your start date? The Judicial Council of California Is an Equal Opportunity Employer. Apply to Job"
