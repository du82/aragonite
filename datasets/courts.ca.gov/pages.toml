["https://courts.ca.gov/about/judicial-branch-awards/aranda-access-justice-awards"]
title = "Aranda Access to Justice Awards | Judicial Branch of California"
full_description = "Aranda Access to Justice Awards Judicial Branch Awards Award for Exemplary Service and Leadership Aranda Access to Justice Awards Distinguished Service Award: Past Recipients The Aranda Access to Justice Award is cosponsored the Judicial Council, California Lawyers Association, and the California Judges Association, in association with the California Commission on Access to Justice. Presented for the first time in 1999, the Aranda Award honors a judicial officer who has demonstrated a long-term commitment to improving access to our courts and who has significantly improved access for low- and moderate-income Californians. The Aranda Award is named in honor of the late Judge Benjamin Aranda III, who was known for his tireless efforts promoting fairness and access in the courts. 2023 Aranda Award Honoree Image Judge Mark A. Juhas Superior Court of California, County of Los Angeles News Release Past Aranda Award Recipients Year Recipient 2022 Hon. Bobbi Tillmon 2019 Hon. Carol S. Brosnahan 2016 Hon. Julia Kelety and Hon. Colleen Toy White 2015 Hon. Garry Ichikawa 2014 Hon. Sue Alexander 2013 Hon. James R. Lambden (Ret.) 2012 Hon. Juan Ulloa 2011 Hon. Maria Rivera 2011* William C. Vickrey 2010 Hon. Laurie Zelon 2009 Hon. Gordon Baranco 2008 Hon. Francisco F. Firmat 2007 Hon. Kathleen O’Leary 2006 Hon. Donna M. Petre 2005 Hon. Aviva K. Bobb 2004 Hon. Earl Johnson, Jr 2003 Hon. Kenneth M. Kawaichi 2002 Hon. Donna J. Hitchens 2001 Hon. Charles W. Campbell, Jr. 2000 Hon. Veronica S. McBeth 1999 Hon. Judith McConnell *2011 Special Benjamin Aranda III Award Recipient Award Criteria Criteria to be used in the selection of the award recipient include one or more of the following: Demonstrated dedication to improving access to our judicial system for low- and moderate-income Californians Demonstrated commitment to increasing the involvement of volunteer attorneys in the representation of the indigent Successful establishment of a model system for providing assistance to self-represented litigants Successful establishment of a model cooperative effort with local legal services programs or bar associations designed to improve available representation for low- or moderate-income litigants Other significant activities demonstrating a long-term commitment 2019 Award Presentation Related Links Aranda Award Cosponsors: State Bar of CaliforniaCalifornia Judges Association In association with the California Commission on Access to Justice"
