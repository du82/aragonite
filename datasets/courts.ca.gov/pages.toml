["https://courts.ca.gov/courts/supreme-court"]
title = "Supreme Court | Judicial Branch of California"
description = "This section provides access to the Court’s oral arguments library, docket case search, and other documents related to recent and upcoming cases argued before the Court. Information about these cases is updated daily. The Docket Search connects to an external database of case information provided by the California Courts system."
full_description = "Supreme Court of California About The California Supreme Court was established in 1849. It is the highest court in the state with a bench comprised of the Chief Justice and six associate justices. Learn more about the justices, the structure, scope, people, processes, and history of the court by visiting the Supreme Court Website. You'll also find information on career and internship opportunities. Continue to Supreme Court Image What you'll find on the Supreme Court site Case or Docket Information This section provides access to the Court’s oral arguments library, docket case search, and other documents related to recent and upcoming cases argued before the Court. Information about these cases is updated daily. The Docket Search connects to an external database of case information provided by the California Courts system. Search Case Information Opinions Find the most recent Supreme Court opinions. The court’s opinions establish precedent that must be followed by all California appellate and superior courts. Opinions of the California Supreme Court are published in bound volumes called the Official California Reports, as well as by private publishers, in hard copy and online. View Opinions E-Filing & Procedures Cases brought before the Supreme Court are governed by a series of rules and procedures that are updated from time to time. In this section find FAQs, standing orders, and other administrative guidance for attorneys, litigants and other interested stakeholders Go to E-Filing & Procedures Oral Arguments The Court publishes full documentation of recent cases as well as upcoming oral arguments. View oral argument calendars, briefs of argued cases, and a library of webcasts. View Oral Arguments The Justices The Supreme Court of California consists of the Chief Justice of California and six Associate Justices, each appointed or nominated by the Governor. Learn more about each justice by reviewing their bios. Meet the Justices"
year_published = 2025
