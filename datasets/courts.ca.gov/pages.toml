["https://courts.ca.gov/about/state-branch-resources/habeas-corpus-resource-center"]
title = "Habeas Corpus Resource Center | Judicial Branch of California"
full_description = "Habeas Corpus Resource Center State & Branch Resources Commission on Judicial Appointments Commission on Judicial Performance Habeas Corpus Resource Center State Bar of California The Habeas Corpus Resource Center (HCRC) provides counsel to represent indigent men and women under sentence of death in California. The HCRC employs attorneys, investigators, paralegals, and other support staff. The HCRC's mission is to provide timely, high-quality legal representation for indigent petitioners in death penalty habeas corpus proceedings before the Supreme Court of California and the federal courts, to recruit and train attorneys to expand the pool of private counsel qualified to accept appointments in death penalty habeas corpus proceedings, and to serve as a resource to appointed counsel, thereby reducing the number of unrepresented indigents on California's death row. Established in 1998, the center initially focused on recruitment and training and developing its comprehensive online Resource Assistance Database. It is now actively engaged in providing representation in capital cases, providing training for private attorneys appointed in capital cases, and assisting the Supreme Court of California in recruiting attorneys to accept capital habeas appointments. The HCRC is located in downtown San Francisco. For more information, e-mail HCRC at info@hcrc.ca.gov"
year_published = 2025
