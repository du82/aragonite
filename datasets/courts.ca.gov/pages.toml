his Website and the Content. If any provision of these Terms of Use is unlawful, void or unenforceable, then that provision will be deemed severable from the remaining provisions and will not affect their validity and enforceability. The failure by a Judicial Branch Entity to enforce any provision in these Terms of Use will not constitute or be construed as a waiver of such provision or of the right to enforce it at a later time. California law, without regard to conflict of laws provisions, will govern these Terms of Use and any matter or dispute arising out of this Website or the Content. The state and federal courts located in San Francisco, California will have exclusive jurisdiction over any dispute relating to these Terms of Use, this Website or the Content. The Judicial Council of California may change these Terms of Use from time to time by posting a new version on this Website. Your continued use of or access to this Website after such changes constitutes acceptance of such changes. The Judicial Branch Entities will have the right to use for any purpose, free of charge, all information or content submitted via this site except those submissions made under separate legal contract. This Website and the Content do not constitute legal advice, and no attorney-client relationship is formed. If you have any questions about these Terms of Use, please Contact Us using our Website Feedback Form. Please do not, however, ask for legal advice or specific information about a case. If you need information about a particular case, please contact the court that has jurisdiction over it. Google Translations This website has been translated for your convenience using a translation process powered by Google Translate™. Google Translate™ translations are done by an automated computer process, not a certified professional translator. For that reason, the translations may be inaccurate, incomplete, or unreliable. Use Google Translate™ translations with caution. The translations 