full_description = "Language Access Services About The Judicial Council of California's Language Access Services Program is comprised of the Court Interpreters Program (CIP) and the Language Access Implementation (LAI) Unit. The Language Access Services site has information for justice partners and court staff, including court interpreters or those who want to become one. Continue to Language Access Services Image What You'll Find on Language Access Court Interpreter Resources Find our latest news and resources relating to court interpreting in California. Aspiring interpreters can find exam information, self-assessments, and other resources. Credentialed court interpreters can find information on jobs with the superior courts, continuing education, compliance, and other topics. Find Court Interpreter Resources Become a Court Interpreter Have you ever wanted to be part of the court process as a court interpreter? Working directly with court users of limited English proficiency, court interpreters play an integral role in one of the largest and most diverse judicial branch court systems in the nation. Become a Court Interpreter Language Access Resources for Courts The Judicial Council of California provides recommendations, guidance, and a consistent statewide approach to ensure language access in the courts. Explore our resources and learn about how we can work to be more inclusive of the limited English proficient (LEP) court users who speak over 200 languages in California. Find Language Access Resources for Courts"
