["https://courts.ca.gov/job/senior-analyst-data-and-analytics-6368"]
title = "Senior Analyst (Data and Analytics) | Judicial Branch of California"
full_description = "Senior Analyst (Data and Analytics) Job Id: 6368 Full/Part-Time: Full-Time Location: San Francisco Office: Business Management Services Department: Court Research Salary: $7,710.00 to $11,565.00 per month Regular/Temporary: Regular Deadline: March 27, 2025 Posted: February 25, 2025 Apply to Job Overview This position provides professional-level analytical work for the Research, Analytics, and Data office on major data and analytic initiatives in the Judicial Branch. This position is part of a team that is implementing a new statewide data reporting and analytics system for trial courts. This position will support the design and implementation of a branch-wide data governance model, including policy development and implementation. This position will also serve as a consultant to other parts of the Judicial Council to identify new opportunities and make suggestions for adjustments using advanced data and analytic methodologies. This position works independently and with limited supervision in support of major initiatives that have statewide impact. The Judicial CouncilThe Judicial Council of California is the policy setting body for the state court system and has constitutionally conferred statewide rule-making authority. A majority of Council members are California state justices and judges; however, the Council also includes lawyers, legislators, and court administrators. The Judicial Council’s staff organization is a leadership, knowledge and service resource focused on improving access to justice for all Californians by innovating and responding to the changing needs of the courts and the public. As a government body charged with improving the statewide administration of justice, the Judicial Council has diverse responsibilities relating to court policy and operations. As employees of the council, every member of staff should view and approach their work as one Judicial Council with a public service mission that is greater than the sum of its parts. The Judicial Council strives for work life balance and offers an excellent benefits package that includes substantial vacation and holiday time, pension, medical, dental, and vision coverage, flexible spending, up to $130 per month reimbursement for qualifying commuting costs, and retirement savings plans. The office is only a 7-minute walk from the Civic Center BART station in San Francisco. The Judicial Council offers hybrid work arrangements for many positions. The successful candidate will be expected to work in person at the Judicial Council’s San Francisco office at least two days per week (Tuesdays and Wednesdays) and reside in the areas surrounding this location. Additional in-office days may be required to meet business needs and occasional travel within the state of California may be required. Responsibilities Support branch data collection and validation in statewide data warehouse.• Create and execute implementation plan for data reporting for data analytics projects including JBSIS, Appellate, jury, and other data sources.• Coordinate project planning and implementation with IT counterparts, court testers, case management system vendors. Lead projects to design and implement branch-wide data governance model.• Research best practices, collaborate with other agency data and information users, partner with Legal Services to design new policies and protocols for data usage and management.• Provide policy and analytic support to advisory bodies that use data and information for policymaking and that oversee policy development for data and analytics. Serve as data analytics consultant to courts and JCC offices.• Use advanced statistical methods and analytical techniques to formulate and test hypotheses, implement research design.• Use complex, inferential statistical analysis to clean, weight, validate, and aggregate data. Manage and support internal data governance, data, or analytic projects to support future advisory body efforts related to data analytics.• Create project plans and timelines to manage various internal efforts to enhance branch’s use of data and analytics, such as data literacy program.• Hold regular meetings with stakeholders, gather requirements, execute annual agenda. Qualifications Bachelor’s degree, and four (4) years of analytical experience in program analysis, policy development, implementation, research, and/or evaluation. Possession of a bachelor’s degree in a directly related field for the assigned discipline such as political science, public administration, statistics, mathematics, etc., may be substituted for one of the years of required experience. An additional four years of professional experience as noted above may substitute for the bachelor’s degree. Or, additional directly related experience and/or education may be substituted on a year-for-year basis. OR Master’s degree in a directly related field for the assigned discipline such as political science, public administration, statistics, mathematics, etc. that included qualitative and quantitative research, and one (1) year of analytical experience in program analysis, development, implementation, research, and/or evaluation. OR One year in the Analyst classification with the Judicial Council of California or one year of experience performing the duties of a class comparable in the level of responsibility to that of an Analyst in a California Superior Court or California state-level government entity. Desirable Qualifications:• Knowledge of court case processing• Expertise in database creation, management• Knowledge in R, SQL, Stata and other data management programs• Experience using Tableau, Power BI Other Information Please note, if you are selected for hire, verification of employment authorization to work in the United States will be required. How To Apply This position requires the submission of our official application, a cover letter, responses to the supplemental questions, and a resume. To ensure consideration of your application for the earliest round of interviews, please apply by 5PM on Thursday, March 27, 2025. To complete the online application, please click the Apply for Job button. The Judicial Council provides reasonable accommodation to applicants with disabilities who request such accommodation. Reasonable accommodation needs should be requested through Human Resources at (415) 865-4260. Pay and Benefits $7,710 - $11,565 per month Some highlights of our benefits package include:• Health/Dental/Vision benefits program• 14 paid holidays per calendar year• Choice of Annual Leave or Sick/Vacation Leave• 1 personal holiday per year• Up to $130 per month reimbursement for qualifying commuting costs• CalPERS Retirement Plan• 401(k) and 457 deferred compensation plans• Employee Assistance Program• Basic Life and AD&D Insurance• FlexElect Program• Pretax Parking• Long Term Disability Program (employee paid/optional)• Group Legal Plan (employee paid/optional) Equal Employment Opportunity The Judicial Council of California Is an Equal Opportunity Employer. Supplemental Questions To better assess the qualifications of each applicant, we will review your responses to the following questions. Please indicate for which employer you performed these functions. Your answers should not exceed a total of three pages. 1. Please explain why you are interested in this position and how your skills and experience make you qualified for this role. 2. Talk about a time when you worked with or coordinated with an Information Technology department on a project. What was the project and what was your role? What worked well in the partnership and what were the challenges? The Judicial Council of California Is an Equal Opportunity Employer. Apply to Job"
year_published = 2025
