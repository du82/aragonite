["https://courts.ca.gov/about/accessibility/americans-disabilities-act-grievance-procedure"]
title = "Americans with Disabilities Act Grievance Procedure | Judicial Branch of California"
full_description = "Supreme Court & Courts of Appeal Americans with Disabilities Act Grievance Procedure This Grievance Procedure is established in accordance with the requirements of the Americans with Disabilities Act of 1990 (ADA). It may be used by anyone who wishes to file a complaint alleging discrimination on the basis of disability in the provision of services, activities, programs, or benefits by the following courts: Supreme Court of California Court of Appeal, First Appellate District Court of Appeal, Second Appellate District Court of Appeal, Third Appellate District Court of Appeal, Fourth Appellate District Court of Appeal, Fifth Appellate District Court of Appeal, Sixth Appellate District 1. The complaint should be in writing and contain the complainant’s name, address, and phone number, as well as a detailed description of the incident or condition, and the location, date, and time of any incident. Upon request to the respective court's ADA Coordinator (contact information provided below) complaints may be filed in another format, such as in person or by telephone, that accommodates the complainant. 2. The complaint should be submitted by the complainant and/or his/her designee as soon as possible, but no later than 60 calendar days after the incident occurred, to the respective court’s ADA Coordinator: Court ADA Coordinator Contact Supreme Court of California ATTN: ADA Coordinator Supreme Court of California 350 McAllister Street, Room 1295 San Francisco, CA 94102 Telephone: (415) 865-7000S.C.-ADA-Public@jud.ca.gov Court of Appeal, First Appellate District ATTN: ADA Coordinator Court of Appeal, First Appellate District 350 McAllister Street San Francisco, CA 94102 Telephone: (415) 865-7300First.District@jud.ca.gov Court of Appeal, Second Appellate District ATTN: ADA Coordinator Court of Appeal, Second Appellate District 300 South Spring Street, Room 2217 Los Angeles, CA 90013 Telephone: (213) 830-70002DCA.ADA@jud.ca.gov Court of Appeal, Third Appellate District ATTN: ADA Coordinator Court of Appeal, Third Appellate District 914 Capitol Mall Sacramento, CA 95814 Telephone: (916) 654-02093DCA-ADA-Public@jud.ca.gov Court of Appeal, Fourth Appellate District ATTN: ADA Coordinator Fourth District Court of Appeal, Division One 750 B Street, Suite 300 San Diego, CA 92101 Telephone: (619) 744-07604dca1ADACoordinator@jud.ca.gov ATTN: ADA Coordinator Fourth District Court of Appeal, Division Two 3389 Twelfth Street Riverside, CA 92501 Telephone: (951) 782-25004dca2ADACoordinator@jud.ca.gov ATTN: ADA Coordinator Fourth District Court of Appeal, Division Three 601 W. Santa Ana Blvd. Santa Ana, CA 92701 Telephone: (714) 571-26004dca3ADACoordinator@jud.ca.gov Court of Appeal, Fifth Appellate District ATTN: ADA Coordinator Court of Appeal, Fifth Appellate District 2424 Ventura Street Fresno, CA 93721 Telephone: (559) 445-54915DCA-ADA-Public@jud.ca.gov Court of Appeal, Sixth Appellate District ATTN: ADA Coordinator Court of Appeal, Sixth Appellate District 333 W. Santa Clara Street, Suite 1060 San Jose, CA 95113 Telephone: 408-277-1004Sixth.District@jud.ca.gov 3. Upon receipt of a complaint, the ADA Coordinator or designee will investigate the complaint. The ADA Coordinator may, at his or her discretion, discuss the complaint or possible resolution of the complaint with the complainant, or seek additional information from the complainant. The complainant’s failure to respond to a request for additional information may be deemed an abandonment of the complaint. The ADA Coordinator or designee may, in his/her discretion, seek assistance from other sources in responding to the complaint. 4. Within a reasonable timeframe of receiving the complaint, the ADA Coordinator or designee will respond in writing to the complainant. The response will explain the position of the respective court, and if applicable, offer options for resolution of the complaint. Upon request to the ADA Coordinator, responses may be presented in another format, such as in person or by telephone, that accommodates the complainant. If more than 30 days is required to respond to the complaint, the ADA Coordinator will promptly notify the complainant of the expected date that a written response will be provided. 5. If the complainant and/or designee is dissatisfied with the response by the ADA Coordinator or designee, the complainant may request reconsideration of the response within 20 calendar days after the date of the response. 6. Requests for reconsideration should be in writing, and include the complainant’s name, address, and phone number, a copy of the original complaint, a copy of the respective court’s response, and a description of issues for reconsideration. Upon request to the ADA Coordinator, requests for reconsideration may be filed in another format, such as in person or by telephone, that accommodates the complainant. Requests for reconsideration must be submitted to: Court Contact Supreme Court of California ATTN: ADA Administrator Supreme Court of California 350 McAllister Street, Room 1295 San Francisco, CA 94102 Telephone: (415) 865-7000S.C.-ADA-Public@jud.ca.gov Court of Appeal, First Appellate District ATTN: ADA Administrator Court of Appeal, First Appellate District 350 McAllister Street San Francisco, CA 94102 Telephone: (415) 865-7300First.District@jud.ca.gov Court of Appeal, Second Appellate District ATTN: ADA Administrator Court of Appeal, Second Appellate District 300 South Spring Street, Room 2217 Los Angeles, CA 90013 Telephone: (213) 830-70002DCA.ADA@jud.ca.gov Court of Appeal, Third Appellate District ATTN: ADA Administrator Court of Appeal, Third Appellate District 914 Capitol Mall Sacramento, CA 95814 Telephone: (916) 654-02093DCA-ADA-Public@jud.ca.gov Court of Appeal, Fourth Appellate District ATTN: ADA Administrator Fourth District Court of Appeal, Division One 750 B Street, Suite 300 San Diego, CA 92101 Telephone: (619) 744-07604dca1ADAAdministrator@jud.ca.gov ATTN: ADA Administrator Fourth District Court of Appeal, Division Two 3389 Twelfth Street Riverside, CA 92501 Telephone: (951) 782-25004dca2ADAAdministrator@jud.ca.gov ATTN: ADA Coordinator Fourth District Court of Appeal, Division Three 601 W. Santa Ana Blvd. Santa Ana, CA 92701 Telephone: (714) 571-26004dca3ADACoordinator@jud.ca.gov Court of Appeal, Fifth Appellate District ATTN: ADA Administrator Court of Appeal, Fifth Appellate District 2424 Ventura Street Fresno, CA 93721 Telephone: (559) 445-54915DCA-ADA-Public@jud.ca.gov Court of Appeal, Sixth Appellate District ATTN: ADA Administrator Court of Appeal, Sixth Appellate District 333 W. Santa Clara Street, Suite 1060 San Jose, CA 95113 Telephone: 408-277-1004Sixth.District@jud.ca.gov 7. The ADA Administrator will review the initial complaint, written response of the ADA Coordinator or designee, and the request for reconsideration, and may at his or her discretion, discuss the complaint or possible resolution of the request for reconsideration with the complainant, or seek additional information from the complainant. The complainant’s failure to respond to a request for additional information may be deemed an abandonment of the request for reconsideration. The ADA Administrator or designee may, in his/her discretion, seek assistance from other sources in responding to the request for reconsideration. 8. Within 30 calendar days of receiving the request for reconsideration, the ADA Administrator will respond in writing to the complainant with a final resolution of the complaint. Upon request to the ADA Administrator, the response may be presented in another format, such as in person or by telephone, that accommodates the complainant. If more than 30 days is required to respond to the request for reconsideration, the ADA Administrator will promptly notify the complainant of the expected date that a written response will be provided. 9. All written complaints, requests for reconsideration, and responses will be retained by the court for at least three years. This Grievance Procedure is not intended to resolve employment-related complaints of disability discrimination or harassment. Each court has an Equal Employment Opportunity Policy; Policy Against Harassment; and/or Discrimination, Harassment, and Retaliation Complaint Resolution Policy govern employment-related complaints."
