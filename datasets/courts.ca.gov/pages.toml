["https://courts.ca.gov/job/fiscal-services-coordinator-6358"]
title = "Fiscal Services Coordinator | Judicial Branch of California"
description = "Overview The Judicial Council of California is accepting applications for the position of a Fiscal Services Coordinator in the Accounts Payable unit for the Branch Accounting and Procurement (BAP) office."
full_description = "Fiscal Services Coordinator Job Id: 6358 Full/Part-Time: Full-Time Location: San Francisco Office: Branch Accounting & Procurement Department: Accounting Services Salary: $5,760.00 to $8,063.00 per month Regular/Temporary: Regular Deadline: Open Until Filled Posted: February 13, 2025 Apply to Job Overview The Judicial Council of California is accepting applications for the position of a Fiscal Services Coordinator in the Accounts Payable unit for the Branch Accounting and Procurement (BAP) office. Under the supervision of the Fiscal Services Support Supervisor of the Accounts Payable unit, the Fiscal Services Coordinator is responsible for auditing and processing compensation and travel claims for judges participating in the Temporary Assigned Judges Program (TAJP). This position works closely with TAJP staff to review and submit compensation claims and travel reimbursement vouchers timely using the Automatic Data Processing (ADP) WorkForce Now system; reviews TAJP bank account activity and performs required transactions; remits payroll taxes and related reporting to the State Controller’s Office (SCO); remits retirement contribution payments and related reporting to CalPERS; and records proper accounting transactions in FI$Cal. Incumbent also reviews and approves AP vouchers for Judicial Council offices and serves as backup for processing payments out of the Office Revolving Fund. The Judicial CouncilThe Judicial Council of California is the policy setting body for the state court system and has constitutionally conferred statewide rule-making authority. This authority includes developing, advocating for, and allocating the judicial branch budget. A majority of Council members are California state justices and judges; however, the Council also includes lawyers, legislators, and court administrators. By enhancing its role as a leadership, knowledge, and service resource for the judicial branch, the Judicial Council’s staff organization seeks to continue to evolve as one of California’s most dynamic public service entities, focused on improving access to justice for all Californians by innovating and responding to the changing needs of the courts and the public. As a government body charged with improving the statewide administration of justice, the Judicial Council has multiple offices with diverse responsibilities relating to court policy and operations. As employees of the council, every member of staff should view and approach their work as one Judicial Council with a public service mission that is greater than the sum of its parts. The Judicial Council strives for work life balance and includes substantial vacation and holiday time. In addition, we offer an excellent benefits package including pension, medical, dental and vision coverage, flexible spending, up to $130 per month reimbursement for qualifying commuting costs, and retirement savings plans. The San Francisco office is only a 7-minute walk from the downtown Civic Center BART station. The Judicial Council offers hybrid work arrangements for many positions. The successful candidate will be expected to work in person at the Judicial Council’s San Francisco office at least two days per week, based on their office leader’s direction, and reside in the areas surrounding this location. Responsibilities Audit and process compensation and travel reimbursement claims (taxable and non-taxable) for judges participating in the Temporary Assigned Judges Program (TAJP), utilizing the Automatic Data Processing (ADP) WorkForce Now system. Review travel claims to determine which are taxable and must be submitted for tax withholding in the monthly payroll process. Ensure that travel claims are approved, and the required pre-approval documents are provided by the approver. Audit taxable and non-taxable travel claims for compliance with JCC policies and procedures, including validity of required receipts and other related documentation. Prepare reports for remittance to the SCO and to CalPERS for the Judges Retirement System (JRS) fund. Calculate federal and state payroll tax liabilities for proper disbursement to SCO and calculate judges’ retirement contributions for proper disbursement to the CalPERS/JRS fund. Review TAJP Bank of America account activity and perform required transactions. Review the daily Positive Pay exception file in the Bank of America CashPro portal and take appropriate action. Perform employee maintenance in the ADP WorkForce Now payroll system and JIS. Maintain personal profiles for over 400 judges within the ADP WorkForce Now system to ensure employee's withholding tax information is coded in compliance with Internal Revenue Service (IRS) regulations and the required custom payroll guidelines. Perform complex accounts payable tasks in FI$Cal. Review and approve vouchers in FI$Cal for payments charged to the Judicial Council, Supreme Court, Courts of Appeal, Habeus Corpus Resource Center, and Commission on Judicial Performance. Verify all FI$Cal chartfields have been coded correctly and proper supporting documentation has been included before approving the voucher in FI$Cal and forwarding to SCO for payment. Qualifications EDUCATION AND EXPERIENCE Three (3) years of accounting experience, including some experience in area of assignment (such as procurement, accounting operations and bookkeeping duties for accounts payable, and general ledger). OR Associate’s degree, preferably in accounting or business-related field, and one (1) year of accounting experience, including some experience in area of assignment (such as procurement, accounting operations and bookkeeping duties for accounts payable, and general ledger). Additional directly related experience and/or education may be substituted on a year-for-year basis. OR One year as a Fiscal Services Specialist with the Judicial Council of California or one year of experience performing the duties of a class comparable in the level of responsibility to that of a Fiscal Services Specialist in a California Superior Court or California state-level government entity. Desirable Qualifications: Experience working with FI$Cal Intermediate Microsoft Office skills Other Information Please note, if you are selected for hire, verification of employment eligibility or authorization to work in the United States will be required. How To Apply This position is Open Until Filled and requires the submission of our official application, a resume and a response to the supplemental questions. To ensure consideration of your application for the earliest round of interviews, please apply by 5:00 P.M. on March 3, 2025. To complete the online application, please click the Apply for Job button. The Judicial Council provides reasonable accommodation to applicants with disabilities who request such accommodation. Reasonable accommodation needs should be requested through Human Resources at (415) 865-4260. Pay and Benefits $5,760 - $8,063 per month Some highlights of our benefits package include: Health/Dental/Vision benefits program 14 paid holidays per calendar year Choice of Annual Leave or Sick/Vacation Leave 1 personal holiday per year Up to $130 per month reimbursement for qualifying commuting costs CalPERS Retirement Plan 401(k) and 457 deferred compensation plans Employee Assistance Program Basic Life and AD&D Insurance FlexElect Program Pretax Parking Long Term Disability Program (employee paid/optional) Group Legal Plan (employee paid/optional) Equal Employment Opportunity The Judicial Council of California Is an Equal Opportunity Employer. Supplemental Questions To better assess the qualifications of each applicant, please provide a response to the following questions. Your answers should not exceed a total of three pages. Please explain why you are interested in this position. The Judicial Council of California Is an Equal Opportunity Employer. Apply to Job"
