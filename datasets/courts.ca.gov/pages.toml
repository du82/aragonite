["https://courts.ca.gov/about/state-branch-resources"]
title = "State & Branch Resources | Judicial Branch of California"
full_description = "State & Branch Resources State & Branch Resources Commission on Judicial Appointments Commission on Judicial Performance Habeas Corpus Resource Center State Bar of California California Government's Three Co-Equal Branches In California, as in the federal government, the power to govern is divided among three equal branches: the executive, the legislative, and the judicial. Executive The executive branch of government executes the laws enacted by the Legislature. Supreme executive power of the State of California is vested in the Governor. The Governor has authority not only to appoint positions throughout the executive branch, but also to make judicial appointments subject to the Legislature's approval. Visit California State Portal | CA.gov to learn more. Legislative The legislative branch of government is the State's law-making authority. The California State Legislature is made up of two houses: the Senate and the Assembly. There are 40 Senators and 80 Assembly members representing the people of the State of California. Visit the Legislature's Website for more information Judicial The judicial branch of government is charged with interpreting the laws of the State of California. It provides for the orderly settlement of disputes between parties in controversy, determines the guilt or innocence of those accused of violating laws, and protects the rights of individuals. The California court system, the nation's largest, serves more than 39 million people with approximately 1,800 judicial officers and 18,000 court employees. The head of the judicial branch is the Chief Justice of California. California Judicial Branch Resources Branch Agencies Commission on Judicial AppointmentsCommission on Judicial PerformanceHabeas Corpus Resource Center State Bar of California State Bar of CaliforniaCommission on Judicial Nominees Other Government Websites California Government California state government home page Attorney General of California Legislative 