["https://courts.ca.gov/rules-forms"]
title = "Rules & Forms | Judicial Branch of California"
full_description = 'Rules & Forms Judicial Council Forms You can search all Judicial Council of California forms by form number, title or category, or you can simply browse all forms. You can also find guidance on how to use Judicial Council forms. See Forms Rules of Court The California Rules or Court can be viewed by the individual titles and can also be downloaded as a full set. Recent amendments adopted by the Judicial Council are posted under New and Amended Rules. See the Rules of Court Latest Form Changes The new and revised forms listed below will be available for download a week before the effective date. See Changes Additional Resources for Forms Expand all Close all Using Forms The Judicial Council adopts legal forms in one of two ways. Under Government Code section 68511, the council may "prescribe" certain forms. Use of those forms is mandatory. The council may also "approve" forms. Use of an approved form is not mandatory, but the form must be accepted by all courts in appropriate cases (rule 1.35). Forms thus are "adopted" for mandatory use and "approved" for optional use. Optional vs. mandatory (How to tell): The lower left corner of the first page of each form indicates whether the form was "adopted" (mandatory) or was "approved" (optional) by the Judicial Council. (Note: Local rules of many courts make the use of some or all optional council forms mandatory in those courts. Please check local court rules.) Format: Judicial Council forms are not subject to the requirements of rules 2.100, which specify the format of papers filed in the superior courts. Computer versions of forms: A party may file a "duplicate" of a council form produced entirely by computer (rule 1.44). True copies required: The party or attorney who files either a printed or computer version of a legal form, certifies by filing the form that it is a true and correct copy of the original form (rule 2.132). How to fill out forms: Most forms can be downloaded to a local computer and filled out. You can also print any form and fill it out by hand. If you need help to fill out the court forms online, please read our section on "How to fill out court forms." Trouble viewing a file? For information on how to view files, please view the FAQ on how to view files. For more information on how to fill out forms, please visit the section "How to fill out court forms." Please note that our site currently does not support Chrome’s built-in PDF Reader. You may select another browser to view Forms, or disable the Chrome PDF Reader and select an alternate PDF Reader. Additionally, Adobe offers information on adding the Acrobat plugin to your browser. Statutory Forms The forms below are provided for by the Legislature in statutes and are made available by the Judicial Council. Please refer to each form to locate the relevant statute for more information. Form Year Description CP10 2015 Claim of Right to Possession and Notice of Hearing CP10.5 2015 Prejudgment Claim of Right to Possession BOF 1022 2018 Prohibited Persons Relinquishment Form (rev. 1/18) BOF 1023 2018 Defendant Firearm Relinquishment Information (rev. 1/18) BOF 1024 2018 Designee Firearm Relinquishment Information BOF 1025 2018 Firearm Disposition Receipt (rev. 1/18) BOF 1026 2020 Probation Officer Verification Forms (rev. 11/20) Trouble viewing a file? For information on how to view files, please view the FAQ on how to view files. For more information on how to fill out forms, please visit the section "How to fill out court forms." Please note that our site currently does not support Chrome’s built-in PDF Reader. You may select another browser to view Forms, or disable the Chrome PDF Reader and select an alternate PDF Reader. Additionally, Adobe offers information on adding the Acrobat plugin to your browser. Appellate Claim Form Appellate Court Compensation Claim Form The following instructions and claim form should be used to submit claims for the California Supreme Court and all California Courts of Appeal. Instructions for Completing Claim Form Adobe Acrobat format Appellate Claim Form PDF format Fillable and savable Word format How to use a fillable Adobe Acrobat form Tab to each field and type in information. Use mouse or Enter key to check and uncheck boxes. The compensation claim form cannot be saved in Adobe Acrobat, please print your document before exiting the program. How to use a fillable and savable Word form Tab to each field and type in information. Use mouse or space bar to check and uncheck boxes. The compensation claim form can be saved, printed and emailed as a Word'
