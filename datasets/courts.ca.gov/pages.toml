["https://courts.ca.gov/partners/california-courts-protective-order-registry-ccpor"]
title = "California Courts Protective Order Registry (CCPOR) | Judicial Branch of California"
full_description = "California Courts Protective Order Registry (CCPOR) CCPOR is a judicial branch project to create a statewide protective order repository that will provide more complete, accessible information on restraining and protective orders. The California Courts Protective Order Registry (CCPOR) is: A statewide registry for storing data and images of restraining and protective orders; A system that provides courts with access to protective orders issued by other courts. A system that helps judicial officers issue non-conflicting orders across departments and counties. A gateway for entering orders into the Department of Justice's California Restraining and Protective Order System (CARPOS). CCPOR Goal The goal is to implement CCPOR in all 58 courts across the state. CCPOR is currently deployed in 46 Superior Courts. Tribal/State Collaboration Using CCPOR, state courts and tribal courts can view each other’s protective orders. The courts that have access are better able to protect the public, particularly victims of domestic violence, and avoid issuing conflicting orders. More Information Download Active CCPOR Courts/Counties CCPOR Deployment Map (October 2024)"
