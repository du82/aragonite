title = "California Jury Instructions | Judicial Branch of California"
full_description = 'California Jury Instructions Plain Language Civil and Criminal Jury Instructions Jury Instructions For Judges and Attorneys The Judicial Council of California has adopted award-winning plain language civil and criminal jury instructions that accurately convey the law using language that is understandable to jurors. California Criminal Jury Instructions (CALCRIM) California Civil Jury Instructions (CACI) Image To address possible inappropriate use of social media and the internet by jurors, the attached poster was developed for distribution to California trial courts. The poster is a tool to remind jurors that existing bans on research and dissemination of trial-related information apply to all forms of electronic and wireless communication. Use of the poster is optional. PDF versions of the poster are provided in two sizes:8.5" x 11" and 11" x 17".'
