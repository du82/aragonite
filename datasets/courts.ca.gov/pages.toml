["https://courts.ca.gov/partners/funds-and-revenue"]
title = "Funds and Revenue | Judicial Branch of California"
full_description = "Funds and Revenue Welcome to the Funds and Revenue Unit Website Funds and Revenue Unit This site is designed to provide guidelines and standards, reference documents, tools and resources to assist in the development of enhanced court collections programs. Unit Overview The Judicial Council's Funds and Revenue Unit is a dedicated entity that provides technical support and training to the 58 courts and counties across California. Our primary role is to assist in the collection of court-ordered fines, fees, and penalties. In addition to this, we offer support and training on the distribution of these revenues. This dual approach has established us as a central source of expertise on collections and revenue distribution, benefiting trial courts and counties statewide. Please note that while the Funds and Revenue Unit does not have direct access to case information, we do provide assistance to the courts with collection-oriented information. For more detailed information, we encourage you to find your specific court. Find Your Court Pay traffic violations, access jury information, find a local self-help desk, and much more. Search Statewide Traffic Tickets / Infractions Amnesty Program Learn More Collections Resources Learn More Latest News Learn More Related Links Image State Controller's Office Accounting Forms and Information Image Revenue Distribution Information & Training Contact Us For more information, contact:collections@jud.ca.gov Request Technical Assistance For questions or further assistance in establishing and/or enhancing your collection program, please contact us at collections@jud.ca.gov."
