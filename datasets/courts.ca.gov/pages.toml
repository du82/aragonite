full_description = "Commission on Judicial Appointments State & Branch Resources Commission on Judicial Appointments Commission on Judicial Performance Habeas Corpus Resource Center State Bar of California Related Links COJA Webcast FAQs California Courts Newsroom Supreme Court Courts of Appeal About The commission is comprised of three members: California Chief Justice (Chief Justice Patricia Guerrero) California Attorney General (Attorney General Rob Bonta) The most senior Presiding Justice of the Court of Appeal of the affected district(s). When a Supreme Court appointee is being considered, the third member of the commission is the state's most senior presiding justice of the Courts of Appeal Any candidate nominated or appointed by the Governor to the Supreme Court or a Court of Appeal must be reviewed by the Commission on Judicial Appointments. The commission holds a public hearing to consider the candidate’s qualifications, and the nomination or appointment is effective if and when confirmed by the commission. When a Court of Appeal candidate is being reviewed, the commission consists of the Chief Justice of California, the Attorney General of California, and the most senior Presiding Justice of the Court of Appeal of the affected district(s). Guidelines for the Commission on Judicial Appointments (Adopted effective May 18, 1999; amended effective July 1, 2005, March 1, 2006, and November 19, 2007.) Playlist of Most Recent Appointments (select menu in upper right corner of the player for list): View on YouTube"
