["https://courts.ca.gov/job/analyst-6367"]
title = "Analyst | Judicial Branch of California"
full_description = "Analyst Job Id: 6367 Full/Part-Time: Full-Time Location: San Francisco or Sacramento Office: Center for Families, Children and the Courts Department: Juvenile Mental Hlth Srvs Fund Salary: $7,294.00 to $10,942.00 per month Regular/Temporary: Regular Deadline: Open Until Filled Posted: February 25, 2025 Apply to Job Overview The Judicial Council of California is accepting applications for the position of Analyst for the Center for Families, Children & the Courts’ Mental Health unit.The purpose of this position is to provide professional level data analytics to drive programs related to the response of the courts to mental health needs of families and children. This position fulfills the mandates of the Mental Health Services Act for projects to “Identify methods for evaluating the long-term effectiveness of mental health programs in the courts”, “Identify the best/promising practices that improve case processing and outcomes with projects”, and “Track and monitor the performance of special court-related programs designed to more effectively serve mentally ill juvenile offenders and court users.” The Analyst performs research and statistical analysis and conducts complex, multi-source linkages and analyses of data from other governmental and health care agencies including MediCal, California Department of Social Services, county probation departments, and court case management systems to create data analytics and visualizations to guide court decision makers. The position requires proficiency in analysis of big data, coding with R, SAS or Python, and data visualization in Power BI or Tableau. THE JUDICIAL COUNCILThe Judicial Council of California is the policy setting body for the state court system and has constitutionally conferred statewide rule-making authority. This authority includes developing, advocating for, and allocating the judicial branch budget. A majority of Council members are California state justices and judges; however, the Council also includes lawyers, legislators, and court administrators. By enhancing its role as a leadership, knowledge, and service resource for the judicial branch, the Judicial Council’s staff organization seeks to continue to evolve as one of California’s most dynamic public service entities, focused on improving access to justice for all Californians by innovating and responding to the changing needs of the courts and the public. As a government body charged with improving the statewide administration of justice, the Judicial Council has multiple offices with diverse responsibilities relating to court policy and operations. As employees of the council, every member of staff should view and approach their work as one Judicial Council with a public service mission that is greater than the sum of its parts. The Judicial Council strives for work life balance and includes substantial vacation and holiday time. In addition, we offer an excellent benefits package including pension, medical, dental, and vision coverage, flexible spending, up to $130 per month reimbursement for qualifying commuting costs, and retirement savings plans. In Sacramento, the office is located minutes from downtown, just north of Discovery Park. In San Francisco, the office is only a 7-minute walk from the Civic Center BART station in downtown San Francisco. The Judicial Council offers hybrid work arrangements for many positions. The successful candidate will be expected to work in person at the Judicial Council’s San Francisco or Sacramento office at least two days per week, based on their office leader’s direction, and reside in the areas surrounding these locations. Responsibilities Research, analyze and provide data analytics and metrics related to mental health issues in the courts to assist judicial officers and court executive officers in meeting the needs of this population. Assess needs and priorities for data analytics and metrics drawn from (for example) MediCal, EPSDT (Early and Periodic Screening, Diagnostic and Treatment Program), psychotropic medication prescription rates in dependency and delinquency populations, or court access to behavioral health services. Access data providers, if necessary, draft and execute memoranda of understanding for data sharing. Develop code in R or Python to bring data sets into structure, format and compliance used for analysis at Judicial Council. Develop code in R or Python to link with existing data sets. Create, revise, and update documentation related to data governance, quality assurance, and data analysis. Design and implement data collection projects to assist courts in evaluating needs and court process changes required for clients with mental health issues. Project may include the growth of remote hearings and services and the ability of clients to adept to them; inappropriate county referrals to family and probate court; crossover needs of litigants with mental health issues and limited English proficiency, ability of problems solving court models to function in a remote or partially remote-access environment. Develop code in R or Python to bring data sets into structure, format and compliance used for analysis at Judicial Council. Develop code in R or Python to link data sets. Create, revise, and update documentation related to data governance, quality assurance, and data analytics. Assess needs and priorities for data collection on specific topics related to evaluating court process changes and outcomes with mental health staff, advisory committee members and court partners. Assess the ability to access and analyze required data from existing data sources including court case management systems and county and state agency administrative systems. Design and create data analytics dashboards and visualizations for web posting and dissemination to the courts to assist them in serving this population: Use R, Python, Power BI, Tableau, Qualtrics and other tools to build dynamic and flexible dashboards to allow court users to view and create dynamic models of data relevant to their courts; Collaborate with Office of Court Research in assessing needs and producing dashboards, visualizations and other products for the courts and Judicial Council users; Collaborate with Information Technology office in using and accessing enterprise data tools. Data analytics liaison to mental health related projects. Provide consultation on other research projects in juvenile, language access, family court services, child support, and self-help. Align data analytics, metrics, and collection design and documentation across projects to ensure all groups are using consistent practices and incorporation mental health topic needs into data analytics. Oversee grant program funding allocation methodology, data collection plan, and compliance outcomes reporting for all mental health related grant programs. Assist in creating and maintaining a comprehensive resource exchange on mental health data, mental health services and other resources to assist courts in serving the mental health needs of children and families in non-criminal court proceedings. Qualifications MINIMUM QUALIFICATIONS Bachelor’s degree, and three (3) years of analytical experience in program analysis, development, implementation, research and/or evaluation. An additional four years of professional experience as Analyst noted above may substitute for the bachelor’s degree. Or, additional directly related experience and/or education may be substituted on a year-for-year basis. OR Master’s degree in a directly related field for the assigned discipline such as political science, public administration, statistics, mathematics, etc. that included qualitative and quantitative research. OR Two years as an Associate Analyst with the Judicial Council of California or two years of experience performing the duties of a class comparable in the level of responsibility to that of an Associate Analyst in a California Superior Court or California state-level government entity. Other Information Please note: if you are selected for hire, verification of employment eligibility or authorization to work in the United States will be required. How To Apply To ensure consideration of your application for the earliest round of interviews, please apply by 5:00 P.M. on March 14, 2025. However, this posting will remain open until filled. This position requires the submission of our official application, a resume and a response to the supplemental questions. To complete an online application, please click the Apply for Job button. The Judicial Council provides reasonable accommodation to applicants with disabilities who request such accommodation. Reasonable accommodation needs should be requested through Human Resources at (415) 865-4260. Pay and Benefits $7,294 - $10,942 per month Some highlights of our benefits package include: Health/Dental/Vision benefits program 13 paid holidays per calendar year Choice of Annual Leave or Sick/Vacation Leave 1 personal holiday per year $130 transit pass subsidy per month CalPERS Retirement Plan 401(k) and 457 deferred compensation plans Employee Assistance Program Basic Life and AD&D Insurance FlexElect Program Pretax Parking Long Term Disability Program (employee paid/optional) Group Legal Plan (employee paid/optional) Equal Employment Opportunity The Judicial Council of California Is an Equal Opportunity Employer. Supplemental Questions To better assess the qualifications of each applicant, please provide a response to the following questions: Describe your experience sourcing publicly available data. Please provide an example of a data dashboard and/or infographic you created. The Judicial Council of California Is an Equal Opportunity Employer. Apply to Job"
