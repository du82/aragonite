["https://courts.ca.gov/programs/collaborative-justice-courts"]
title = "Collaborative Justice Courts | Judicial Branch of California"
full_description = "Collaborative Justice Courts Learn more about: Collaborative Justice Courts Fact Sheet Introduction Collaborative justice courts-also known as problem-solving courts- combine judicial supervision with rehabilitation services that are rigorously monitored and focused on recovery to reduce recidivism and improve offender outcomes. Examples of collaborative justice courts are community courts, drug courts, DUI courts, homeless courts, mental health courts, reentry courts, veterans courts, and courts where the defendant may be a minor or where the child's welfare is at issue. These include dating/youth domestic violence courts, drug courts, DUI court in schools programs, mental health courts, and peer/youth courts. Adult Collaborative Courts The collaborative justice model is being applied to several adult court types throughout California with great benefit. Juvenile Collaborative Courts The Center for Families, Children, and the Courts (CFCC) works in collaboration with California’s courts and communities to support the development and enhancement of juvenile collaborative court programs. Grants/Funding California collaborative courts receive funding from federal, state, and local sources. Research and Publications The Collaborative Justice Program undertakes research on the collaborative courts of California. Monterey County's DUI Treatment Court The Superior Court of Monterey County operates a Driving Under the Influence Treatment Court offering high-risk offenders the option of rehabilitation instead of incarceration. Contact Center for Families, Children & the CourtsCollaborative Justice 455 Golden Gate Avenue, 6th Floor San Francisco, California 94102 Email: collabjusticecomm@jud.ca.gov"
year_published = 2025
