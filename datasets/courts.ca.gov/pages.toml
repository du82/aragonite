title = "Advisory Committee on Providing Access and Fairness | Judicial Branch of California"
description = "The committee makes recommendations for improving access to the judicial system, fairness in the state courts, diversity in the judicial branch, and court services for self-represented parties. Key projects of this advisory body are outlined in the annual agenda."
full_description = "Print Advisory Committees Advisory Committee on Providing Access and Fairness The committee makes recommendations for improving access to the judicial system, fairness in the state courts, diversity in the judicial branch, and court services for self-represented parties. Key projects of this advisory body are outlined in the annual agenda. Meetings Members Subcommittees News & reports About Meetings No Upcoming Meetings Scheduled Check back for new meeting information or visit Past Meetings page. Past Meetings Advisory Committee on Providing Access and Fairness Past Meetings Members Rule 10.55 provides that the Advisory Committee on Providing Access and Fairness must include representatives from the following categories: Appellate justice; Trial court judicial officer; Lawyer with expertise or interest in disability issues; Lawyer with expertise or interest in additional access, fairness, and diversity issues addressed by the committee; Lawyer from a trial court self-help center; Legal services lawyer; Court executive officer or trial court manager who has experience with self-represented litigants; County law librarian or other related professional; Judicial administrator; and Public member The Chief Justice appoints two advisory committee members to serve as co-chairs. Each co-chair is responsible for leading the advisory committee's work in the following areas: Physical, programmatic, and language access; fairness in the courts; and diversity in the judicial branch; and Issues confronted by self-represented litigants and those of limited or moderate income, including economic, education, and language challenges. Download the Committee Roster. Hon. Kevin C. Brazile, Cochair, Judge of the Superior Court of California, County of Los Angeles Hon. Victor A. Rodriguez, Cochair, Associate Justice of the Court of Appeal, First Appellate District, Division Three Ms. Morgan Baxter, Deputy Court Executive Officer of Operations, Superior Court of Californ