title = "Court-Related Legislation | Judicial Branch of California"
full_description = "2024 Court-Related Legislation Governmental Affairs Court-Related Legislation Past Legislation Judicial Council Legislative Position Letters & Fiscal Impact Statements Assembly Bill 1208 Outreach Activities About Governmental Affairs In this section: Active Legislation Legislative Status Charts/Judicial Council Positions Legislative Summaries Bills Affecting Appellate Courts Legislative Policy Summary Governmental Affairs Advocacy Contacts Expand all Close all Active Legislation Search by topic for active legislation that affects the courts or is of general interest to the courts. To perform further research on bills of interest Go to Bill Search. Click to view a list of Governmental Affairs advocates by assigned subject area or program. Assigned Subject area or Program Assigned Subject area or Program Appellate Fines, Fees, Forfeitures Artificial Intelligence Grand Jury Bail Schedule Initiatives Benefits Judges/Judicial Officers Budget Judicial Council-Sponsored Legislation CARE Juries CEQA Juvenile Del (Juvenile Justice) Child Welfare Juvenile Dep (Child Welfare) Civil Labor Collections Mental Health Contracts/Procurement Miscellaneous Court Interpreters Other Employee/Employer Issues Court Operations Probate Court Records Redistricting Court Reporters Small Claims Court Security State Bar Criminal Law Traffic Domestic Violence Trial Court Facilities Employment Issues Trial Court Funding Family Law Water Law Legislative Status Charts Each year, the Governmental Affairs Office maintains a chart showing the status of all legislation the Legislation Committee has taken a position on or reviewed on the council's behalf that year. The current year chart is updated after each Legislation Committee meeting. Year Year 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 2012 2011 2010 2009 2008 2007 2006 2005 2004 2003 2002 2001 2000 1999 2024 Summary of Court–Related Legislation The 2024 Summary of Court–Related Legislation has brief descriptions of new laws, arranged according to subject matter, that affect the courts or that are of general interest to the judicial branch. The summary includes a statement for each new or amended statute that is determined to impact court operations and procedures, as well as a table summarizing new laws that create or expand crimes. Access the page numbers of specific bill summaries using an index at the back of the document. Current and prior-year summaries can be accessed below. Annual Summaries of Court-Related Legislation Comprehensive, annual summaries of court-related legislation, which include brief descriptions of measures, organized by subject. Year Year Year Year 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 2012 2011 2010 2009 2008 2007 2006 2005 Judicial Branch Legislative Priorities Each year, the Judicial Council adopts legislative and budget priorities to pursue with the legislative and executive branches. Current Judicial Branch Legislative Priorities Bills Affecting Appellate Courts Each year, the Governmental Affairs Office distributes to all appellate courts a table of bills that affect appellate courts. The current year chart is updated periodically throughout the year. Legislative Policy Summary The Judicial Council's Governmental Affairs office monitors legislative activity and represents the Judicial Council before the Legislature, the Governor’s Office, and executive branch agencies and departments. The 2024 Legislative Policy Summary is an abstract of council action regarding court-related legislation. The summary is organized by policy area and includes how the actions further the objectives of the seven goals of Justice in Focus: The Strategic Plan for California’s Judicial Branch, 2006-2016. The table that follows each policy area shows actions taken on legislation that illustrate the policy. The table does not include every bill on which a council position was taken. This document is updated annually. The document contains hyperlinks for viewing the text of the bills. Past Legislation To view legislation from 2013 - 2020, go to Past Legislation."
