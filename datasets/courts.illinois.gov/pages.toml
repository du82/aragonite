full_description = '''Illinois Pattern Civil Jury Instructions | State of Illinois Office of the Illinois Courts The following represents Illinois Pattern Civil Jury Instructions, drafted by the Supreme Court Committee on Jury Instructions in Civil Cases. ﻿ All instructions are in pdf format. ﻿To download a Word compatible version, select "Download complete set of Illinois Pattern Civil Jury Instructions (Rich Text Format)" on the left side of page. Search Submit Cautionary and General Rule # Rule Title 1.00 General Cautionary Instructions 1.01 - Revised February 2023 2.00 Instructions During Trial 2.01 - Revised September 2020 3.00 General Instructions 3.03 - Revised February 2023 4.00 Instructions Recommended not to be Given 4.01, 4.13, 4.14 - Revised February 2023 Failure to Testify or Produce Evidence Rule # Rule Title 5.00 Introduction Negligence--Risk--Misconduct--Proximate Cause Rule # Rule Title 10.00 Negligence and Ordinary Care 11.00 Contributory Negligence Notes on Use in the 30 Series (32.02, 32.05, 34.01, 34.02, B11.06 and B11.06.01) - Revised August 2021 12.00 Specific Factors Affecting Negligence and Contributory Negligence 12.04, 12.05 - Instructions withdrawn August 2021 13.00 Assumption of Risk 14.00 Willful and Wanton Conduct 15.00 Proximate Cause 15.01 - Revised February 2023 Issues--Burden of Proof Rule # Rule Title 20.00 Issues in the Case 20.01, 20.01.01, 20.02 - Revised August 2023 21.00 Burden of Proof 22.00 Burden of Proof -- Res Ipsa Loquitor 23.00 Admitted Liability Damages Rule # Rule Title 30.00 Damage Instructions 30.05.01 - Comment - Revised December 2021 31.00 Damages--Wrongful Death 31.09, 31.10, 31.12 Instruction and Comment, 31.13 Instruction and Comment - Revised June 2021 32.00 Injury to Spouse and Family Members 32.05 - Comment - Revised October 2021 33.00 Damages--Mitigation 34.00 Damages--Future Damages--Length of Time Damages will Continue--Discount of Damages--Mortality Tables Notes on Use in the 30 Series (32.02, 32.05, 34.01, 34.02, B11.06 and B11.06.01) - Revised August 2021 35.00 Punitive Damages 36.00 No Liability--No Damages Multiple Parties and Pleadings--Verdict Forms Rule # Rule Title 41.00 Multiple Parties and Pleadings 45.00 Forms of Verdicts 45.04A, 45.04B & 45.04C - Approved May 2014 Agency Rule # Rule Title 50.00 Agency 50.03 & 50.04 - Revised July 2015 Construction Negligence Rule # Rule Title 55.00 Construction Negligence Revised December 2018 Statutory Violations Rule # Rule Title 60.00 Statutory Violations Motor Vehicles Rule # Rule Title 70.00 Motor Vehicles 72.00 Automobile Guests--Joint Enterprise--Passengers 72.03 - Revised February 2023 73.00 Railroad Crossings Particularized Standards of Conduct Rule # Rule Title 100.00 Common Carriers 100.02 - Revised February 2023 105.00 Professional Negligence 105.03.01 - Revised August 2024 110.00 Animals 115.00 Ultrahazardous Activities Owners and Occupiers of Land Rule # Rule Title 120.00 Premises 125.00 Liability for Falls on Snow and Ice 128.00 Concluding Paragraphs--No Contributory Negligence--Contributory Negligence--Affirmative Defense 130.00 Landlord and Tenant 130.01, 130.02, 130.03 - Revised February 2023 135.00 Abutting Property Owner 140.00 Municipality Actions Based on Statutes Rule # Rule Title 150.00 Dram Shop Act Introduction - Revised February 2023 155.00 The Drug or Alcohol Impaired Minor Responsibility Act 155.04 - Revised February 2023 160.00 Federal Employers' Liability Act Revised January 2019 170.00 Safety Appliance and Boiler Inspection Acts Revised January 2019 180.00 Structural Work Act 185.00 Magnuson-Moss Act 190.00 Nursing Home Care Act New section - Approved May and July 2014 200.00 Will Contest 205.00 Tortious Interference with Expectancy 250.00 Retaliatory Discharge 255.00 Illinois Human Rights Act 300.00 Eminent Domain 400.00 Strict Product Liability 400.04 - Revised September 2015 500.00 Implied ("Active-Passive") Indemnity 600.00 Contribution - 600.14 & 600.14A Approved June 1, 2012 Contracts Rule # Rule Title 700.00 Contracts 700.12G & 700.12VG - Revised August 2016 710.00 Liability Insurance 710.01 & Notes, 710.02 & Notes, 710.03, 710.04 Notes on Use, 710.05 & Notes, 710.07 & Notes - Revised March 2021 800.00 Fraud and Deceit ﻿Note: While Supreme Court Rule 239(a) prescribes the use of Illinois Pattern Jury Instructions, an instruction is approved or rejected only after it has been judicially questioned and considered. Powers v. Illinois Central Gulf Railroad Company, 91 Ill. 2d 375 (1982).'''
