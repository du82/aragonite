["https://courts.illinois.gov/1455/Illinois-Supreme-Court-eBusiness-Initiative/procurement-detail"]
title = "Illinois Supreme Court e-Business Initiative | ilcourts"
description = "Administrative Office of the Illinois Courts contains Supreme, Appellate and Circuit Court information, including judges, and the opinions of the Supreme and Appellate Courts."
full_description = "Procurement Opportunities | State of Illinois Office of the Illinois Courts Illinois Supreme Court e-Business Initiative StatusClosed Publish Date03/14/2011 Due Date04/29/2011 AttachmentsRequest for Proposal for Illinois Supreme Court e-Business Initiative List of Bidder's Conference Attendees e-Business Initiative Questions and Answers - Revised 4/22/11 Directed To Notice of Attendance to Bidder's Conference: 03/25/2011(Potential Vendors Only)Bidder's Conference: 03/30/2011, 10:00 a.m. (CST)Location: Chicago and SpringfieldProposal Due Date: 04/29/2011(No deadline extensions) Overview: The Administrative Office of the Illinois Courts (AOIC) is requesting offers from responsible vendors to meet the Judicial Branch's needs. A brief description is set forth below for your convenience, with detailed requirements in subsequent sections of this solicitation. If you are interested and able to meet these requirements, we would appreciate and welcome an offer. This solicitation is for proposals to design, develop, and deliver a functional e-Business prototype as described in this RFP and information packet. The Supreme Court’s e-Business Initiative provides centralized applications and services that facilitate the electronic filing of documents to trial courts; allows electronic guilty pleas; and develops a trial court and probation department data warehouse. By centralizing these applications through the Court’s Judicial Portal, based upon the exchange of data with each trial court, modifications and costs are minimized for each trial court and probation department to participate in e-Business activities; uniform procedures exist for attorneys, the general public, and stakeholders across the state; and all Illinois counties are better able to offer e-Business commerce to their constituents. Proposals are welcomed from all organizations experienced and able to respond to the requirements in this RFP and deliver a functional e-Business system. The vendor’s proposal is to include proposals for two phases of this project, Discovery phase and a Prototype Delivery phase. The Discovery phase will yield critical information which will then, most likely, modify and refine the Prototype Delivery proposal, which the AOIC will review prior to authorizing the continuance of the project. The Discovery phase is expected to be completed in 90 days from the initial contract. The Prototype Delivery phase is expected to be completed, delivering a functional e-Business prototype, 12 - 15 months from the execution of a second contract."
author = "State of Illinois Office of the Illinois Courts"
year_published = 2025
