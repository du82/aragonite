["https://courts.illinois.gov/511/Court-Security-Officer-/employment-opportunities-detail"]
title = "Court Security Officer  | State of Illinois Office of the Illinois Courts"
description = "Administrative Office of the Illinois Courts contains Supreme, Appellate and Circuit Court information, including judges, and the opinions of the Supreme and Appellate Courts."
full_description = "Court Security Officer | State of Illinois Office of the Illinois Courts Court Security Officer Vacancy Announcement LocationElgin, IllinoisOfficeSecond Appellate District CourtPosted Date01/27/25Closing DateThis position will remain open until filled. However, those individuals submitting materials by Friday, March 7, 2025, will be given first consideration.BenefitsAn attractive judicial branch benefits package is offered, including pension, medical, dental, vision and life insurance, as well as deferred compensation and generous leave time. Please refer to the following Benefits Information Sheet for additional details.Salary$48,198 per year, commensurate with experience ﻿﻿Applicant may be required to submit additional material or complete job specific tests for the position.ESSENTIAL DUTIES: The Supreme Court – Court Security Officer is a sworn law enforcement officer position under the direct authority of the Supreme Court of Illinois, Office of the Marshal, and assigned to the protection of the Supreme and Appellate Courts, responsible for the physical security and safety of the Court, employees and public.AUTHORITY RESTRICTION: Court Security Officers (CSO) are certified law enforcement officers under the authority of the Marshal of the Court, who directly support Supreme Court Marshals assigned to Judicial Protection. Supreme Court CSOs maintain limited authority and jurisdiction in the execution of duties and responsibilities. CSO authority is limited to conducting official duties while at Supreme and Appellate Court facilities. CSOs have no off-duty law enforcement authorityFUNCTIONS INCLUDE:Conducting physical security and safety operations at the Supreme and Appellate Court buildings, and other locations as necessary.Monitoring premises via CCTV, managing access control, and screening patrons utilizing threat detection devices.Patrolling courthouses and satellite buildings, keeping in contact with the Marshal’s Communications Center through the use of hand-held radios and other communication devices.Responding to security issues at the respective location., and completely and accurately reporting and documenting issues, threats, and potential risks that may affect the Court and Judiciary.Utilizing the Supreme Court’s threat database, the Court Security Information System (CSIS).Performs other duties as assigned.EDUCATION/EXPERIENCE: Completion of a High School Diploma or General Equivalency Diploma; or an equivalent combination of education and experience enough to successfully perform the essential duties of the job such as those listed.REQUIREMENTS:Must be qualified to carry a firearm during employment and successfully complete all required training.Obtain CPR, AED, and First Aid Certification within the first six (6) months of employment.Be a certified Court Security Officer, Corrections Officer, or Law Enforcement Officer in good standing with the State of Illinois. Successful completion of required training and probation protocols established by the Marshal of the Supreme Court.Available to be on-call and respond 24 hours a day 7 days a week; including but not limited to weekends, holidays, and nights during the Court Terms of the Supreme and Appellate Courts, as well as occasional travel which may include overnight staysMaintain proficiency with all weapons, first-aid equipment, tactics, skills and any electronic communication equipment that is applicable and maintain an up-to-date knowledge of federal and state statutes and court cases.Carry a firearm in the performance of duties and maintain current required training qualification standards established by the Marshal.Perform basic computer skills, to include sending and receiving electronic mail.Effectively and accurately document enforcement activities in handwritten and/or computer-generated reports.Effectively exhibits the ability to recognize and maintain important, sensitive, and confidential information related to Court business.Requires the ability to sit, stand and walk, occasionally for extended periods of time.Must possess a valid Illinois driver’s license and demonstrate proof of automobile insurance to operate a personal vehicle on state business, as well as maintain a safe driving record.Successful completion of a law enforcement background investigation.Interested individuals should submit - via email - a letter of interest, resume, and completed Judicial Branch Employment Application to:courtemployment@IllinoisCourts.govThis position will remain open until filled. However, those individuals submitting materials by Friday, March 7, 2025, will be given first consideration.EQUAL OPPORTUNITY EMPLOYER More Opportunities﻿"
author = "State of Illinois Office of the Illinois Courts"
year_published = 2025
