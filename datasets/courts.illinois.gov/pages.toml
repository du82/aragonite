full_description = "Assistant Counsel | State of Illinois Office of the Illinois Courts Assistant Counsel Vacancy Announcement LocationSpringfield, Illinois Posted Date02/20/25Closing DateThis position will remain open until filled. However, those individuals submitting materials by March 3, 2025, will be given first consideration.DivisionOffice of Statewide Pretrial Services, Director’s OfficeBenefitsAn attractive judicial branch benefits package is offered, including pension, medical, dental, vision and life insurance, as well as deferred compensation and generous leave time. Click Here for State Employee General Benefits | Click Here for OSPS Summary of BenefitsSalary$83,528 - $105,000; starting salary commensurate with experience The Office of Statewide Pretrial Services’ (OSPS or Office) is a statewide office that provides pretrial services under the Pretrial Services Act, 725 ILCS 185. The Office’s mission is to assist in the administration of justice and promote community safety by ensuring fairness and equality in the pretrial process. OSPS prepares pretrial investigation reports for the courts and supervises individuals released from custody as directed by the court.ESSENTIAL DUTIES: The Assistant Counsel assists the General Counsel by researching legal issues related to pretrial matters, criminal procedure, and employment law. The Assistant Counsel interprets state and federal law, reviews appellate opinions and newly filed legislation, working under the general supervision of the General Counsel.FUNCTIONS INCLUDE:﻿Provides legal opinions on criminal procedure, subpoenas, contracts, procurement, employment, and confidentiality issues.Reviews and summarizes relevant appellate court opinions on the Pretrial Services Act, Illinois Criminal Code, Illinois Code of Criminal Procedure, employment laws and other relevant matters.Provides litigation support such as drafting and reviewing motions and pleadings and discovery responses for review by the General Counsel.Analyzes pending legislation and prepares bill summaries for review by the General Counsel.Tracks and responds to subpoenas and information requests.Assists with employment related legal matters such as wage garnishments, unemployment insurance, discrimination, wrongful termination, Family Medical Leave Act, Americans with Disability Act, and Fair Labor Standards Act.Instructs and prepares OSPS staff for testifying in court.Reviews pretrial standards and practices to determine compliance with state and federal legislation and case law.Assists with internal investigations by reviewing supporting documentation, interviewing witnesses, and summarizing findings as directed.Under the direction of the general counsel, reviews contracts, grant applications, grant agreements, procurement documents and leases.Performs other duties as assigned.EDUCATION AND EXPERIENCE:﻿Minimum Qualifications:A Juris Doctorate Degree from a law school accredited by the American Bar AssociationLicensed to practice law in Illinois.Five or more years professional working experience in a public or private organization.One or more years of practicing law.Ability to be LEADS certified.Must possess a valid Illinois Driver’s License and demonstrate proof of automobile insurance to operate a personal vehicle on state business, as well as maintain a safe driving record.Proficient in the use of Microsoft Office products (i.e., Word, Excel, Access, PowerPoint, Outlook).Preferred Qualifications:Five years in the practice of law.Three years of experience with legal research and writing.One year of experience drafting, researching, or analyzing legislation.One year of experience with criminal procedure in Illinois or federal courts.One year of experience with preparing and/or delivering training on statutory or regulatory provisions.PHYSICAL REQUIREMENTS: Ability to sit for extended time periods.Professional office working environment requiring telephone usage and ability to process written documents.Ability to travel, including overnight stays, as required.The required working hours for these positions are: Monday – Friday 8:30 am – 5:00 pmBENEFITS:An attractive judicial branch benefits package is offered, including pension, medical, dental, vision and life insurance, as well as deferred compensation and generous leave time. Click Here for State Employee General BenefitsClick Here for OSPS Summary of BenefitsHOW TO APPLY:Interested individuals should submit a resume and cover letter through the form below. https://app.smartsheet.com/b/form/cfdfd666f464473185cdbbd0a5b7b361A judicial branch application is not required to apply, but it will be required before final hiring decisions are made. The application can be downloaded from the Illinois Courts website:https://ilcourtsaudio.blob.core.windows.net/antilles-resources/resources/b0377255-a5e8-4c75-af0b-65925622d97b/Judicial%20Branch%20Employment%20Application.pdfThis position will remain open until filled. However, those individuals submitting materials by March 3, 2025, will be given first consideration.Any questions about this position or the application process can also be submitted via email at the following address: pretrialservices@illinoiscourts.gov .EQUAL OPPORTUNITY EMPLOYER More Opportunities﻿"
