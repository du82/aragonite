["https://courts.illinois.gov/courts/circuit-court/illinois-pattern-jury-instructions-criminal"]
title = "Illinois Pattern Criminal Jury Instructions"
description = "Administrative Office of the Illinois Courts contains Supreme, Appellate and Circuit Court information, including judges, and the opinions of the Supreme and Appellate Courts."
full_description = '''Illinois Pattern Criminal Jury Instructions | State of Illinois Office of the Illinois Courts The following represents Illinois Pattern Criminal Jury Instructions, drafted by the Supreme Court Committee on Jury Instructions in Criminal Cases. All instructions are in pdf format. ﻿To download a Word compatible version, select "Download complete set of Illinois Pattern Criminal Jury Instructions (Rich Text Format)" on the left side of page. Search Submit Rule # Rule Title Introduction to IPI Criminal Revised July 26, 2024 User's Guide 1.00 Function of Court, Jury, and Counsel Revised 1.01A, 1.01B - Approved April 30, 2021 2.00 Burden of Proof 3.00 Particular Types of Evidence New & Revised 3.20, 3.20A, 3.20B, 3.23, & 3.24 - Approved April 26, 2024 4.00 Definitions of Certain Words New 4.46 - Approved October 25, 2024 5.00 Mental State, Accountability, and Responsibility Revised 5.03 - Approved April 28, 2023 6.00 Inchoate Offenses New Section incorporating CLEAR legislation revisions - Approved October 17, 2014 7.00 Homicide Revised 7.15 - Approved July 29, 2022 8.00 Kidnapping Nov 13; 8.31, 8.31A, 8.31B, 8.32, 8.32A, 8.33, 8.34, and 8.34A. and Oct 30; 8.16, 8.17, 8.18, 8.19, 8.19A, 8.19B, 8.20, 8.21, 8.22, 8.23, 8.24, 8.24A, 8.25, 8.26A, 8.27, 8.28, 8.29, 8.30 9.00 Sex Offenses Revised 9.29 & 9.29B - Approved April 26, 2024 10.00 Abortion New Instructions - Approved October 28, 2016 11.00 Assault, Battery, and Related Crimes Revised 11.65E - Approved April 26, 2024 12.00 Eavesdropping 13.00 Theft New & Revised 13.77, 13.77A, 13.78, 13.78A - Revised January 28, 2022 14.00 Robbery and Burglary New & Revised 14.07, 14.07A, 14.08, 14.09, 14.10, 14.13, 14.13A, 14.13B, 14.14, 14.14A, 14.14B - Approved July 29, 2022 15.00 Arson and Related Offenses Revised Section - Approved October 26, 2018 16.00 Criminal Damage and Trespass 16.01, 16.01X, 16.02, 16.02X, 16.03, 16.04, 16.05, 16.06 - Approved December 1, 2017 17.00 Cannabis and Controlled Substances 17.01, 17.02, 17.03, 17.04, 17.05, 17.06, 17.07, 17.08, 17.09, 17.10, 17.11, 17.12 - Approved January 26, 2018 18.00 Weapons Revised 18.07B, 18.08B, 18.23X, 18.24X, 18.25, 18.26 - Approved July 26, 2024 19.00 Mob Action 20.00 Gambling 21.00 Bribery Revised 21.15, 21.16 - Approved January 25, 2019 22.00 Interference with Judicial and Other Governmental Functions New & Revised 22.75, 22.75X, 22.76, & 22.76X - Approved April 26, 2024 23.00 Traffic Revised 23.39, 23.40, & 23.43B - Approved April 26, 2024 24.00-25.00 Defenses Revised 24-25.04 - Approved January 27, 2023 26.00 Concluding Instructions and Forms of Verdicts 27.00 Sample Sets of Instructions 28.00-28A.00 Enhancement/Extended Term Sentencing ﻿Note: Supreme Court Rule 451(a) prescribes the use of Illinois Pattern Jury Instructions in criminal cases. These instructions are prepared by the Supreme Court Committee on Jury Instructions in Criminal Cases. There is no advanced approval of jury instructions in criminal cases by the Court, they are approved only after they have been tested in the courts. People v. Hester, 131 Ill.2d 91 (1989), citing Powers v. Illinois Central Gulf Railroad Company, 91 Ill.2d 375 (1982).'''
author = "State of Illinois Office of the Illinois Courts"
year_published = 2025
