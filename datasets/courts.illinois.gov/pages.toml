["https://courts.illinois.gov/courts/supreme-court"]
title = "The Supreme Court of Illinois"
description = "Administrative Office of the Illinois Courts contains Supreme, Appellate and Circuit Court information, including judges, and the opinions of the Supreme and Appellate Courts."
full_description = "Public Find information helpful to the public Judges Find information helpful to judges Lawyers Find information helpful to lawyers Media Media links CourtsSupreme Court Supreme Court | State of Illinois Office of the Illinois Courts Supreme Court Opinions Learn More Orders and Announcements Learn More Supreme Court Rules Learn More High-Profile Cases Learn More The Supreme Court of Illinois, in addition to being the state’s highest Court, is responsible for the state’s trial courts, one appellate court with five districts, and several supporting units. General administrative and supervisory authority over the court system is vested in the Supreme Court. Several advisory bodies assist with this mission by making recommendations to the Court. These include the Judicial Conference of Illinois﻿ and the various committees of the Court. The Supreme Court also makes appointments to other committees, commissions, and boards﻿. The Chief Justice is responsible for exercising the Court’s general administrative and supervisory authority in accordance with the court’s rules. The Supreme Court appoints an Administrative Director﻿ to assist the Chief Justice in their duties. The staff of the Administrative Office of the Illinois Courts﻿ supports this function. Key support personnel exist at each level of the court to assist judges with the administration of justice. At the Supreme Court level, this includes the clerk, research director, marshal, librarian, reporter of decisions﻿ and their staffs.The state is divided into five judicial districts, with three justices elected from the first district (Cook County) and one justice elected from each of the other four districts. Justices are elected in partisan elections for 10 years and may be retained in office for additional terms of 10 years. A chief justice is elected by the other justices for a term of three years. The Court convenes in the Illinois Supreme Court Building in Springfield on the second Monday in the months of September, November, January, March, and May. Illinois Supreme Court Justices: Past & Present Current Supreme Court Justices Chief Justices of the Supreme Court History of Illinois Supreme Court Justices Additional Resources Judicial Branch Reports﻿ Judicial Branch Policies & Standards﻿ Access for People with Disabilities﻿ Volunteer Pro Bono Program﻿Bar Admission Ceremonies﻿Certificate of Registration (Rule 721)﻿Name Change - Supreme Court's Roll of Attorneys﻿Certificate of Admission/Good Standing﻿ Style Manual for the Supreme and Appellate Court﻿ Supreme Court Policy on Assistance to Court Patrons﻿ Supreme Court Language Access PolicySupreme Court Caseload Statistics﻿Declaration of Economic Interest Forms (Rule 68)﻿ Get Notifications Illinois Courts now offers three ways to be notified of news and court-related information. Follow Illinois Courts Twitter Account Subscribe to Receive Email and Text Notifications Courts Supreme Court Meet the Justices Illinois Judicial Conference Docket & Briefs Oral Argument Audio and Video Anticipated Filing Dates and Opinions List Petition for Leave to Appeal Dispositions Committees and Commissions MCLE Credit for Service Statutory Court Fees Task Force Public Hearings Rules Committee Public Hearings Illinois Rules of Evidence Attorney Licensure Certificate of Registration (Rule 721) Staff and Contact Information Supreme Court Library Supreme Court Courtroom and Resources High-Profile Cases Access for People With Disabilities Opinions Supreme Court Library Ask a Reference Question Topical Research Guides Annual Report of the Illinois Courts Annual Reports to the General Assembly Supreme Court Caseload Statistics Supreme Court Courtroom Etiquette Supreme Court Building Information Appellate Court Meet the Justices First District Second District Third District Fourth District Fifth District Workers' Compensation Oral Arguments Calendars Oral Argument Audio Meet the Appellate Court Clerks Appellate Court Local Rules High-Profile Cases Appellate Court Access for People with Disabilities Appellate Court General Information Appellate Court Caseload Statistics First District Statistics Second District Statistics Third District Fourth District Fifth District Appellate Court Total Caseload Statistics Appellate Court Districts and Resources Circuit Court Chief Judges and Administrative Staff Circuit Court Clerks Jury Information Judicial Directory Plead and Pay Traffic / Conservation Tickets (e-Guilty) Remote Jury Information Illinois Circuit Court Statistical Reports Manual on Recordkeeping Circuit Courts and Resources Additional Resources Find Your Court Judicial Events Remote Proceedings High-Profile Cases 2020 Appellate Court High Profile Cases 2023 Appellate Court High-Profile Cases Employment Opportunities Probation Eligible Employment Application Procurement Opportunities Holidays & Closings COVID-19 Resources Judicial Directory Judicial Branch Policies & Standards Illinois Judicial Conference Office of Statewide Pretrial Services Pretrial Data and Opinions"
