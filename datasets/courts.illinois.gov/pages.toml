full_description = "Administrative Office of the Illinois Courts | State of Illinois Office of the Illinois Courts The Administrative Office of the Illinois Courts (AOIC) was created pursuant to Article VI, Section 16 of the Illinois Constitution to assist the Supreme Court with its general administrative and supervisory authority over all Illinois courts. Appointed by the Supreme Court, the Administrative Director leads the AOIC and its staff. The AOIC provides support and programming to courts statewide through its offices and divisions: Access to Justice Division, Administrative Services Division, Office of Communications, Children and Family Division, ﻿Court Services Division, Human Resources Division, Judicial College, Judicial Education Division, Judicial Management Information Services Division, Office of Statewide Pretrial Services and Probation Services Division. AOIC Director Marcia M. Meis Marcia M. Meis was appointed Director of the Administrative Office of the Illinois Courts (AOIC) on August 1, 2017. Ms. Meis is a graduate of the University of Missouri (Bachelor of Journalism) and DePaul University College of Law. After working briefly in private practice, Ms. Meis served as an Illinois Appellate Court law clerk for several years before joining the AOIC as an Executive Office Attorney in 1999. She subsequently served as Chief Legal Counsel before becoming AOIC Deputy Director in 2014. In accordance with Article VI, section 16 of the Illinois Constitution, the Supreme Court appoints the Administrative Director who serves at its pleasure to assist the Chief Justice in his or her duties. In addition to these administrative duties, the Administrative Director serves as Secretary to the Illinois Courts Commission, as well as an ex officio member of the Illinois Judicial Conference and the Supreme Court Historical Preservation Commission. Get Notifications Illinois Courts now offers three ways to be notified of news and court-related information. Follow Illinois Courts Twitter Account Subscribe to Receive Email and Text Notifications"
