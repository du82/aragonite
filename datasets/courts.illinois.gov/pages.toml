title = "Electronic Monitoring Officer | State of Illinois Office of the Illinois Courts"
description = "The Electronic Monitoring Officer is an advanced pretrial position. This position oversees electronic monitoring of pretrial defendants and conducts criminal history investigations."
full_description = "Electronic Monitoring Officer | State of Illinois Office of the Illinois Courts Electronic Monitoring Officer Vacancy Announcement LocationSpringfield, ILPosted Date02/20/25Closing DateThis position will remain open until filled. However, those individuals submitting materials by March 3, 2025, will be given first consideration.DivisionOffice of Statewide Pretrial Services, Division of Pretrial Operations BenefitsAn attractive judicial branch benefits package is offered, including pension, medical, dental, vision and life insurance, as well as deferred compensation and generous leave time. Click Here for State Employee General Benefits | Click Here for OSPS Summary of BenefitsSalary$62,355 - $ 78, 991; starting salary commensurate with experience The Office of Statewide Pretrial Services’ (OSPS or Office) is a statewide office that provides pretrial services under the Pretrial Services Act, 725 ILCS 185. The Office’s mission is to assist in the administration of justice and promote community safety by ensuring fairness and equality in the pretrial process. OSPS prepares pretrial investigation reports for the courts and supervises individuals released from custody as directed by the court. The Electronic Monitoring Officer is an advanced pretrial position within the Centralized Operations Section. This position oversees electronic monitoring of pretrial defendants and conducts criminal history investigations. The Electronic Monitoring Officer works under the general direction of a supervisor within the Division of Pretrial Operations. The required working hours for this position is: ﻿Wednesday to Saturday, 2:00 PM to 12:00 AM BENEFITS: An attractive judicial branch benefits package is offered, including pension, medical, dental, vision and life insurance, as well as deferred compensation and generous leave time. State Employee General Benefits OSPS Summary of Benefits ESSENTIAL FUNCTIONS Manages defendants placed on electronic monitoring by verifying location, ensuring alert resolution in a timely manner, enrolling defendants into tracking software and ensuring accuracy, and establishing and monitoring movement to comply with established zones and times.Travels to sites across the state to perform installation and retrieval of Electronic Monitoring Hardware.Troubleshoots, diagnoses, and escalates electronic monitoring hardware and software issues.Generates case management notes, progress and violation reports related to defendants’ non-compliance.Contacts and coordinates with law enforcement entities related to defendants’ non-compliance.Communicates with OSPS staff regarding defendants’ status, including location and compliance history.Accesses LEADS and other criminal databases to identify prior criminal history of defendants.Enters criminal history information into OSPS case management system.Ensures criminal history data entered into OSPS’ case management system is complete and accurate, including entering information not available at the time of the investigation such as the SID number, DCN number, case number, dispositions.Reviews pretrial assessments compiled based on criminal history data.Performs and directs periodic criminal history checks of defendants released from custody pretrial.Responds to internal and external inquiries regarding pretrial operations, including the status of pending court cases and conditions of pretrial release.Conducts interviews of pretrial defendants as requested.Ensures protected personal information is only distributed as allowed.Performs other duties as assigned. EDUCATION AND EXPERIENCE Minimum Qualifications: A Bachelor’s Degree.Ability to be LEADS certified.A valid Illinois Driver’s License and proof of automobile insurance to operate a personal vehicle on state business, as well as maintain a safe driving record.Proficient in the use of Microsoft Office products (i.e., Word, Excel, Access, PowerPoint, Outlook). Preferred Qualifications: Bachelor’s Degree in Criminal Justice or a social services related field.Three or more years of professional working experience in a public or private organization.One or more years of experience working with criminal justice electronic monitoring systems.Current certification as a LEADS operator.Master’s Degree. Physical Requirements Ability to sit for extended time periods.Professional office working environment requiring telephone usage and ability to process written documents.Ability to travel, including overnight stays, as required. HOW TO APPLY: Interested individuals should submit a resume and cover letter through the form below. https://app.smartsheet.com/b/form/cfdfd666f464473185cdbbd0a5b7b361 A judicial branch application is not required to apply, but it will be required before final hiring decisions are made. The application can be downloaded from the Illinois Courts website: https://ilcourtsaudio.blob.core.windows.net/antilles-resources/resources/b0377255-a5e8-4c75-af0b-65925622d97b/Judicial%20Branch%20Employment%20Application.pdf This position will remain open until filled. However, those individuals submitting materials by March 3, 2025, will be given first consideration. Any questions about this position or the application process can also be submitted via email at the following address: pretrialservices@illinoiscourts.gov . EQUAL OPPORTUNITY EMPLOYER More Opportunities﻿"
author = "State of Illinois Office of the Illinois Courts"
year_published = 2025
