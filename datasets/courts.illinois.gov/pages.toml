full_description = "Appellate Court Access for People with Disabilities | State of Illinois Office of the Illinois Courts The Illinois Supreme Court Policy on Access for People with Disabilities applies to all courts in Illinois, including all five Appellate Districts. The policy allows people with disabilities to make requests for reasonable accommodations, accessibility aids, and services to ensure equal access to court activities. Every court is required to have a Court Disability Coordinator, a point person for accessibility considerations at court. If you have a disability (defined as a physical or mental characteristic that substantially limits one or more major life activities) and would like to request an accommodation to participate in a court activity, please complete a Request for Accommodation or contact the relevant Appellate Court’s Court Disability Coordinator. These forms and the Court Disability Coordinator contact information can be found under the Appellate District accessibility pages, below: First District Second District Third District Fourth District Fifth District"
author = "State of Illinois Office of the Illinois Courts"
