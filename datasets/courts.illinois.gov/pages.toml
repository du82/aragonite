title = "Senior Custodian  | State of Illinois Office of the Illinois Courts"
description = "Administrative Office of the Illinois Courts contains Supreme, Appellate and Circuit Court information, including judges, and the opinions of the Supreme and Appellate Courts."
full_description = "Senior Custodian | State of Illinois Office of the Illinois Courts Senior Custodian Vacancy Announcement LocationSpringfield, IllinoisOfficeSupreme Court Posted Date01/17/25Closing DateApplicant's information must be received by Friday, February 28, 2025.DivisionSupreme Court Building and Maintenance BenefitsAn attractive judicial branch benefits package is offered, including pension, medical, dental, vision and life insurance, as well as deferred compensation and generous leave time. Please refer to the following Benefits Information Sheet for additional details.Salary$48,198 per year ﻿ESSENTIAL DUTIES: This position provides assistance to the Supreme Court Physical Facilities Manager in supervising and the management of the custodial staff. This position also performs manual tasks in the care, cleaning, and maintenance of the Supreme Court Building including, cleaning and maintaining floor surfaces, ceilings, windows, restroom facilities. This Senior Custodian performs other custodial services, including assisting staff in grounds-keeping activities, removing and cleaning debris from work sites, moving equipment and furniture within the building, stocking inventory, and other duties as assigned. EXPERIENCE AND EDUCATION REQUIREMENTS: Applicant must possess in-depth knowledge in the use of standard hand and power tools; possess working knowledge of preventative and general building maintenance skills, including an understanding of basic plumbing; at least two years of experience with floor care, including stripping, waxing and buffing; the ability to recognize hazards and take measures to ensure a safe work environment; the ability to follow oral and written instructions; the ability to operate a computer; demonstrate strong interpersonal and communication skills; the ability to work successfully in a team environment; and be detail oriented and thorough in work performance.PHYSICAL REQUIREMENTS: Ability to work 7 a.m. – 3 p.m., Monday through Friday. Ability to safely lift, stoop, reach, and bend to perform building and grounds maintenance work. Interested individuals should submit - via email - a letter of interest, resume, and completed Judicial Branch Employment Application to:courtemployment@IllinoisCourts.govApplicant's information must be received by Friday, February 28, 2025.EQUAL OPPORTUNITY EMPLOYER More Opportunities﻿"
author = "State of Illinois Office of the Illinois Courts"
year_published = 2025
