title = "Judicial Branch Procurement Opportunities | Office of the Illinois Courts"
description = "Administrative Office of the Illinois Courts contains Supreme, Appellate and Circuit Court information, including judges, and the opinions of the Supreme and Appellate Courts."
full_description = '''Procurement Opportunities | State of Illinois Office of the Illinois Courts Administrative Office of the Illinois Courts State of Illinois Judicial Branch Human Resources Information System Request for Proposal - Open StatusOpen Publish Date02/28/25 Due DateApril 18, 2025, no later than 5:00 P.M. CDT The AOIC invites the submission of proposals for a Human Resources Information System (HRIS) for management of sensitive and confidential employee information of judicial and non-judicial staff and associated implementation services in compliance with the terms and conditions set forth in this Request for Proposal (RFP) and accompanying documents. Learn More Administrative Office of the Illinois Courts Request for Proposal to Guide the Strategic Planning Work of the Illinois Judicial Conference - Closed StatusClosed Publish Date01/24/25 Due DateWe invite individuals to submit a proposal to us by close of business February 14, 2025 for consideration. The IJC seeks a consultant with expertise in organizational psychology, meeting facilitation, and strategic planning to guide the IJC through implementation of its 2025 Operational Plan Learn More Reducing Barriers to Meaningful Participation in Court Grant Request for Proposals - Closed StatusClosed Publish Date01/06/25 Due DateCompleted grant proposals must be submitted before 5:00 pm on Tuesday, February 18, 2025 The Illinois Supreme Court created the ATJ Commission in 2012 to develop policies and programs to reduce barriers. Learn More Administrative Office of the Illinois Courts Probation Services Division Request for Proposals to Provide Grant Management and Administration - Closed StatusClosed Publish Date11/14/24 Due DateWe invite individuals to submit a proposal to us by close of business December 15, 2024, for consideration. The Administrative Office of the Illinois Courts (Administrative Office) Probation Services Division is accepting proposals for contractual employment to act as a Program Coordinator, dedicated to the administration and oversight of a Swift Certain Fair (SCF) grant. Learn More Office of Statewide Pretrial Services State of Illinois Judicial Branch Human Resources Information System Request for Proposal - Closed StatusClosed Publish Date09/13/24 Due DateDue November 10, 2024, no later than 5:00 P.M. CST - See "Key Dates" for additional deadlines. The Office invites submissions of proposals for a Human Resources Information System (HRIS) for management of sensitive and confidential employee information for around 300 to 400 OSPS employees and associated implementation services in compliance with the terms and conditions set forth in this request for proposal (RFP) and accompanying documents. Learn More Illinois Supreme Court Commission on Access to Justice Disability Accessibility Improvement Grant 2025 - Closed StatusClosed Publish Date09/03/24 Due DateProposals Due October 15, 2024 Title II of the Americans with Disabilities Act (ADA) and the Illinois Human Rights Act (IHRA) are examples of comprehensive civil rights laws that prohibit discrimination based on disability in state and local governments, including courts. Courts must work towards meeting the requirements of the ADA, IHRA, and corresponding laws and regulations. To forward this objective, and to ensure more uniform access to resources for courts, the ATJ Commission will award grant funds in support of projects or activities from local courts that promote dignity, advance accessibility, and reduce barriers to equal access to courts for people with disabilities. Learn More Illinois Supreme Court Commission on Access to Justice Request for Proposals to Provide Audit Services - Closed StatusClosed Publish Date06/20/24 Due DateBy close of business July 26, 2024. The Illinois Supreme Court Commission on Access to Justice (Commission) is accepting proposals from CPA firms to provide audit services to our organization. This audit is for the fiscal year ending June 30, with the option of auditing its financial statements for each of the four subsequent fiscal years. We invite your firm to submit a proposal to us by close of business July 26, 2024, for consideration. Learn More Illinois Supreme Court Commission on Access to Justice Improvement Grant - Closed StatusClosed Publish Date05/15/24 Due DateProposals Due 06/28/24 The goal of this program is twofold. The first is to provide funds to jurisdictions so that they are able to develop access to justice initiatives locally (the ATJ Improvement Grant). The second is to offer training and support to people working at courthouses throughout the state who assist self-represented litigants (SRLs) and other court users as part of the Court Navigator Network (Network). Learn More Administrative Office of the Illinois Courts - Remote Interpreting Services Request for Proposal - Closed StatusClosed Publish Date05/14/24 Due DateProposals Due 07/12/24 The AOIC is using a competitive selection process (referred to herein as the Request for Proposals or RFP) to select a vendor to provide only remote (phone or online platforms like Zoom) foreign language interpretation services for Limited English Proficient (LEP) individuals and American Sign Language (ASL) interpretation services for individuals who are hearing impaired in court and court-annexed proceedings throughout Illinois. Learn More Supreme Court of Illinois / Administrative Office of the Illinois Courts - Adult Risk Assessment - Juvenile Risk Assessment Validation Request for Proposals - Closed StatusClosed Publish Date03/11/24 Due Date05/01/24 The Administrative Office of the Illinois Courts (AOIC), on behalf of the Supreme Court of Illinois, is using a competitive selection process (referred to herein as the “Request for Proposals” or “RFP”) to select a Vendor to conduct a comprehensive validation of the Adult Risk Assessment (ARA) and Juvenile Risk Assessment (JRA). In addition, the selected Vendor will be required to assess the current ARA and JRA tools and propose changes to address any identified taking into consideration Judicial Branch requirements, and all applicable statutes, rules, and policies. The RFP response may serve as the basis for subsequent contract negotiations with the selected Vendor. Learn More Access to Justice Improvement Grant and Court Navigator Network Membership Request for Proposal - Closed StatusClosed Publish Date05/11/23 Due DateAll application materials must be submitted before 5:00 pm on June 26, 2023 by email to Jill Roberts, Deputy Director, Access to Justice Division, AOIC at jroberts@illinoiscourts.gov Learn More Office of Statewide Pretrial Services State of Illinois Judicial Branch Electronic Monitoring System - Closed StatusClosed Publish Date10/07/22 Due Date October 7, 2022 Request for Proposal issued October 28, 2022 All vendor questions submitted via email to pretrialservices@illinoiscourts.gov November 14, 2022 Answers to all vendor questions released December 30, 2022 Proposal submission deadline not later 5:00 PM CST and submitted via email to pretrialservices@illinoiscourts.gov The Office of Statewide Pretrial Services’ invites submissions of proposals for electronic monitoring systems to provide remote location monitoring, confinement monitoring and alcohol monitoring in accordance with the conditions set forth in this request for proposal (RFP), accompanying documents, and in accordance with the law. With this request for proposal, OSPS is soliciting proposals for all three types of electronic monitoring. Learn More Office of Statewide Pretrial Services State of Illinois Judicial Branch Drug Testing Request for Proposal - Closed StatusClosed Publish Date8/5/2022 Due Date August 5, 2022 Request for Proposal issued September 6, 2022 All vendor questions submitted via email to pretrialservices@illinoiscourts.gov September 8, 2022 Answers to all vendor questions released September 20, 2022 Proposal submission deadline not later 5:00 PM CST and submitted via email to pretrialservices@illinoiscourts.gov The Office of Statewide Pretrial Services is seeking competitive proposals from interested and qualified vendors with a proven track record in providing quality drug testing kits. Vendors shall submit proposals for drug testing supplies to pretrialservices@illinoiscourts.gov no later than 5:00 p.m. CST on September 13, 2022. Vendors who are deemed to have submitted responsive proposals must provide product samples for review and evaluation of quality. Learn More Illinois Supreme Court Commission on Access to Justice Self-Represented Litigant Coordinator Grants - Closed StatusClosed Publish Date5/16/2022 Due DateCompleted grant applications must be submitted before 5:00 pm on June 21, 2022 by email to Jill Roberts Deputy Director, Access to Justice Division, AOIC at jroberts@illinoiscourts.gov﻿. Learn More Illinois Supreme Court Commission on Access to Justice Online Dispute Resolution Grants - Closed StatusClosed Publish Date5/16/2022 Due DateCompleted grant applications must be submitted before 5:00 pm on June 21, 2022 by email to Sarah Song, Supervising Senior Program Manager, Access to Justice Division, AOIC at ssong@illinoiscourts.gov. Learn More Pretrial Case Management System Request for Proposal - Closed StatusClosed Publish Date3/8/2022 Due Date March 8, 2022 Request for Proposal issued March 24, 2022 All questions for the March 29 meeting due not later than 5:00 PM CST and submitted via email to pretrialservices@illinoiscourts.gov March 29, 2022 Meeting held at 2:00 PM CST with all interested vendors to answer submitted questions April 15, 2022 All additional questions from vendors due not later than 5:00 PM CST and submitted via email to pretrialservices@illinoiscourts.gov April 22, 2022 Answers to all vendor questions released May 13, 2022 Proposal submission deadline not later than 5:00 PM CST via email to pretrialservices@illinoiscourts.gov The Office of Statewide Pretrial Services’ (OSPS or Office) mission is to assist in the administration of justice and promote community safety by ensuring fairness and equality in the pretrial process. The Office invites submissions of proposals for an integrated, comprehensive, pretrial case management system (CMS) and associated implementation services in compliance with the terms and conditions set forth in this request for proposal (RFP) and accompanying documents. Learn More Illinois Supreme Court Commission on Access to Justice Online Dispute Resolution Program - Closed StatusClosed Publish Date5/19/2021 Due DateCompleted grant applications must be submitted before 5:00 pm on June 30, 2021 Learn More Illinois Supreme Court Commission on Access to Justice Self-Represented Litigant Coordinator Grants - Closed StatusClosed Publish Date5/19/2021 Due DateCompleted grant applications must be submitted before 5:00 pm on June 30, 2021 Learn More Supreme Court of Illinois / Administrative Office of the Illinois Courts - Data Collection and Management application. - Closed StatusClosed Publish Date11/26/19 Due Date12/31/19 The Administrative Office of the Illinois Courts (AOIC) is seeking to contract with a vendor to design, develop, and deliver a functional Data Collection and Management application. Learn More Illinois Supreme Court Commission on Access to Justice & Administrative Office of the Illinois Courts – Self-Represented Litigant Coordinators – Request for Proposal - Closed StatusClosed Publish Date08/22/19 Due Date10/01/19 The Illinois Supreme Court Commission on Access to Justice & Administrative Office of the Illinois Courts (AOIC) seeks to recruit, train and support a statewide network of Self-Represented Litigant Coordinators. Learn More Administrative Office of the Illinois Courts - Conference and Event Management Application- Request for Proposals - Closed StatusClosed Publish Date12/14/18 Due Date01/19/19 The Administrative Office of the Illinois Courts (AOIC) of the Illinois Courts (AOIC) is seeking to contract with a vendor for the design and development of a conference / event management and registration application. Learn More Administrative Office of the Illinois Courts - Job Classification and Compensation Study - Request for Proposals - Closed StatusClosed Publish Date04/17/17 Due Date06/16/17 The Administrative Office of the Illinois Courts (AOIC) is requesting proposals from responsible vendors to conduct a comprehensive job classification and compensation study. Learn More Illinois Supreme Court - Statewide e-Filing and Electronic Filing Manager - Request for Information (RFI) - Closed StatusClosed Publish Date01/22/16 Due Date03/11/16 The Administrative Office of the Illinois Courts (AOIC) is seeking to contract with a vendor for the implementation of a central electronic filing manager (EFM) to facilitate statewide e-Filing in the Illinois judiciary Learn More Illinois Supreme Court - Payroll/Human Resource/Timekeeping - Request for Proposal - - Closed StatusClosed Publish Date09/22/14 Due Date11/17/14 - Extended until 12/05/14 The Administrative Office of the Illinois Courts (AOIC) is requesting proposals from responsible vendors to meet the Judicial Branch's needs for an integrated Payroll, Human Resource, and Timekeeping/Leave application (Payroll/HR). Learn More Illinois Supreme Court - Invitation for Bids - Quality Assurance Review of Supreme Court Internal Audit - - Closed StatusClosed Publish Date08/15/14 Due Date09/12/14, at 4:00 p.m. Central Standard Daylight Savings Time The purpose of this procurement is to solicit bids from qualified and independent reviewers or review teams for an External Quality Assurance Review of Supreme Court Internal Audit for compliance with the Institute of Internal Auditors’ International Standards for the Professional Practice of Internal Auditing, Code of Ethics, and Definition of Internal Auditing. Learn More Illinois Supreme Court - Reviewing Courts' Case Management System - Request for Information - Closed StatusClosed Publish Date04/13/12 Due Date05/18/12, close of business The Supreme Court of Illinois is requesting vendor responses to this Request for Information (RFI) that will be used to rewrite and expand the capabilities of the Reviewing Courts' case management systems (CMS). The selected vendor will work with the Supreme Court and Appellate Court Clerks' offices and the Administrative Office to define the requirements of a new CMS for use in the Supreme Court and each Appellate Court District. The vendor is to deliver a rapid development project plan, timeline, and costs to program and implement a fully functional CMS and related applications that are populated with past court data and meet the specifications stated during this project. The new CMS will incorporate the functionality of the current case management systems and be designed to include new capabilities that support the workflow of the Supreme Court and each Appellate Court District. Learn More Illinois Supreme Court - Pattern Jury Instructions - Request for'''
