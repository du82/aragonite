title = "Illinois Supreme Court - Payroll/Human Resource/Timekeeping - Request for Proposal - | ilcourts"
description = "Administrative Office of the Illinois Courts contains Supreme, Appellate and Circuit Court information, including judges, and the opinions of the Supreme and Appellate Courts."
full_description = "Procurement Opportunities | State of Illinois Office of the Illinois Courts Illinois Supreme Court - Payroll/Human Resource/Timekeeping - Request for Proposal - StatusClosed Publish Date09/22/14 Due Date11/17/14 - Extended until 12/05/14 AttachmentsRequest for Proposal for Payroll, Human Resource, and Timekeeping/Leave Application RFP Questions and Answers - updated 11/17/14 Standard Vendor Agreement Vendor Bid Certification Vendor's Conference: October 8, 2014 10:00 am cst Location: Administrative Office of the Illinois Courts 3101 Old Jacksonville Road Springfield, IL 62704 Video Conference Location Available at: Administrative Office of the Illinois Courts 222 N. LaSalle St., 13th Floor Chicago, IL 60601 Teleconference Available: Teleconference information will be provided at a later date. Directed ToRSVP no later than 5:00 PM cst on October 3, 2014, to rfppayrollproposal@illinoiscourts.govRSVP response should indicate attendance and location for Vendor's Conference Overview: The Administrative Office of the Illinois Courts (AOIC) is requesting proposals from responsible vendors to meet the Judicial Branch's needs for an integrated Payroll, Human Resource, and Timekeeping/Leave application (Payroll/HR). This project's scope of work includes defining and documenting the Functional Requirements for an integrated Payroll/HR application, which includes a description of application workflows, menus and screens, online and printed reporting capabilities, ad hoc report capabilities, and the technical specifications for the delivery of this application. Responses to this RFP must includes a project plan, milestones, timelines, and itemized costs to install and deliver a fully functional Payroll/HR application which meets the needs of the Judicial Branch. The proposal must describe and detail all annual licensing and support requirements, costs, and system maintenance requirements. The project must also include data migration from all existing applications and spreadsheets into the new system, system testing, end-user and technical training, and system/program documentation. The vendor's proposal can include the option to customize a Commercial-off-the-Shelf (COTS) application or to fully design and develop a Payroll/HR application."
