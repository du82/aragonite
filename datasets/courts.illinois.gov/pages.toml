efits Salary $62,355 - $ 78, 991; starting salary commensurate with experience Learn More Pretrial Services Officer - Vermilion County Location Vermilion County, Illinois Description The Pretrial Services Officer has two primary responsibilities which include the interviewing of detained pretrial defendants, accurately scoring pretrial release assessments, and preparation of pretrial release reports. Posted Date 02/18/25 Closing Date This position will remain open until filled. However, those individuals submitting materials by February 28, 2025, will be given first consideration. Division Office of Statewide Pretrial Services, Division of Pretrial Operations Benefits An attractive judicial branch benefits package is offered, including pension, medical, dental, vision and life insurance, as well as deferred compensation and generous leave time. Click Here for State Employee General Benefits | Click Here for OSPS Summary of Benefits Salary $48,198 - $59,277; starting salary commensurate with experience Learn More Court Security Officer Location Elgin, Illinois Office Second Appellate District Court Description The Supreme Court – Court Security Officer is a sworn law enforcement officer position under the direct authority of the Supreme Court of Illinois. Posted Date 01/27/25 Closing Date This position will remain open until filled. However, those individuals submitting materials by Friday, March 7, 2025, will be given first consideration. Benefits An attractive judicial branch benefits package is offered, including pension, medical, dental, vision and life insurance, as well as deferred compensation and generous leave time. Please refer to the following Benefits Information Sheet for additional details. Salary $48,198 per year, commensurate with experience Learn More Supreme Court Marshal 1 Location Chicago, Illinois Office First District Appellate Court Description : The Supreme Court Marshal 1 provides physical and personal security and safety protection for the Supreme and Appellate Courts Posted Date 01/27/25 Closing Date This position will remain open until filled. However, those individuals submitting materials by Friday, March 7, 2025, will be given first consideration. Benefits An attractive judicial branch benefits package is offered, including pension, medical, dental, vision and life insurance, as well as deferred compensation and generous leave time. Please refer to the following Benefits Information Sheet for additional details. Salary $62,355 per year, commensurate with experience Learn More Operations Manager Location Hybrid (Remote/In Person) Chicago AOIC Office Office Administrative Office of the Illinois Courts Description Operations Manager positions are in the AOIC Judicial College Division Operations and Event Management Unit and report directly to the Unit Associate Deputy Director. Posted Date 01/23/25 Closing Date This position will remain open until filled. Division Judicial College Division Benefits An attractive judicial branch benefits package is offered, including pension, medical, dental, vision and life insurance, as well as deferred compensation and generous leave time. Please refer to the following Benefits Information Sheet for additional details. Salary $71,132 – commensurate with experience Learn More Senior Custodian Location Springfield, Illinois Office Supreme Court Description This position provides assistance to the Supreme Court Physical Facilities Manager in supervising and the management of the custodial staff. Posted Date 01/17/25 Closing Date Applicant's information must be received by Friday, February 28, 2025. Division Supreme Court Building and Maintenance Benefits An attractive judicial branch benefits package is offered, including pension, medical, dental, vision and life insurance, as well as deferred compensation and generous leave time. Please refer to the following Benefits Information Sheet for additional details. Salary $48,198 per year Learn More Senior Deputy Clerk – S