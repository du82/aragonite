full_description = "Procurement Opportunities | State of Illinois Office of the Illinois Courts Illinois Supreme Court - Pattern Jury Instructions - Request for Information StatusClosed Publish Date10/11/11 Due Date11/10/11 AttachmentsRequest for Information for the Publication of Print and Online Illinois Pattern Instructions PDF format Illinois Supreme Court - Pattern Jury Instructions RFI Questions and Answers - 11/01/11 Directed To Overview: The Administrative Office of the Illinois Courts seeks responses to this Request for Information (RFI) that will be used to assist in the selection of a print and/or online publisher for the Illinois Pattern Jury Instructions (Civil and Criminal). The purpose of this RFI is to gather information from experienced vendors and service providers that currently publish print and/or online legal documents. The information received from this RFI will be used to assist in the selection of a legal publisher for the above-referenced jury instructions. Those vendors and service providers who are experienced with print and/or online legal publishing are encouraged to respond."
