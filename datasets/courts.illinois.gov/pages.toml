full_description = 'Procurement Opportunities | State of Illinois Office of the Illinois Courts Administrative Office of the Illinois Courts Request for Proposal to Guide the Strategic Planning Work of the Illinois Judicial Conference StatusClosed Publish Date01/24/25 Due DateWe invite individuals to submit a proposal to us by close of business February 14, 2025 for consideration. Attachments Request for ProposalAttachment A - Vendor Bid Certification FormAttachment B - Standard Vendor Agreement for Goods and Services Form Directed To Key Contact - Please direct any questions to Marisa Wiesman, Deputy Director of Strategic Planning, Administrative Office of the Illinois Courts: mwiesman@illinoiscourts.gov﻿ or 217-814-6439﻿. Submission - Please submit your response to this request for proposal to Alison Spanner, aspanner@illinoiscourts.gov﻿, and Marisa Wiesman, mwiesman@illinoiscourts.gov﻿, by the close of business February 14, 2025. The Administrative Office of the Illinois Courts (AOIC) is using a competitive selection process (referred to herein as the Request for Proposals or RFP) to select a consultant with expertise in organizational psychology, meeting facilitation, and strategic planning to guide the IJC through implementation of its 2025 Operational Plan and an update to its strategic agenda for 2025-2028. We invite individuals to submit a proposal to us by close of business February 14, 2025 for consideration. Background of the Illinois Judicial Conference The Illinois Judicial Conference (IJC) is a committee of the Illinois Supreme Court charged with considering the work of the courts, suggesting improvements in the administration of justice, and strategic planning for the Illinois Judicial Branch. The IJC is comprised of 29 voting members: 15 judges and 14 non-judges, including attorneys, court clerks, trial court administrators, and members of the public. The Chief Justice of the Illinois Supreme Court serves as Chair. Guided by its mission, the IJC has developed a Judicial Branch Strategic Agenda for 2022- 2025 titled "Charting the Course: Innovations and Transformations within the Illinois Judicial Branch." This agenda emphasizes the following strategic goals: Accessible Justice and Equal Protection Under the LawFair, Timely, and Efficient CourtsProfessionalism and Accountability throughout the Judicial BranchUnderstanding of, and Confidence in, the Judicial BranchFunding and Use of Judicial Branch Resources For 2025, the IJC has adopted an Operational Plan that identifies 10 strategic initiatives designed to advance these goals. The IJC seeks a consultant with expertise in organizational psychology, meeting facilitation, and strategic planning to guide the IJC through implementation of its 2025 Operational Plan and an update to its strategic agenda for 2025-2028. Services to Be Performed Provide consulting services related to the implementation and development of the Illinois Judicial Branch Strategic Agenda including but not limited to: preparing project and meeting materials; facilitating, leading and attending meetings of the Illinois Judicial Conference; providing guidance to Illinois Judicial Conference subcommittees, taskforces, and workgroups as needed; developing implementation strategies for the Agenda; facilitating updates to the Strategic Agenda for 2025-2028; and other duties as assigned and agreed to by the parties. In 2025, the consultant will specifically be expected to help plan and to facilitate a 1-day in person meeting in Springfield, IL in June and a 1.5-day-in-person meeting in Chicago, IL in October. The purpose of these meetings is to review progress and accomplishments on the 2025 strategic initiatives (as outlined in the yearly operational plan, see Additional Materials below), refresh the strategic agenda for 2025-2028, and identify strategic initiatives for 2026. There is a strong possibility of ongoing consultant needs beyond 2025. This work will be done in collaboration with Illinois Judicial Conference staff, which includes Alison Spanner, Director of Access to Justice and Strategic Planning with the AOIC, and Marisa Wiesman, Deputy Director of Strategic Planning with the AOIC. Your Response to this Request for Proposal Proposals need not be lengthy, but should include: ﻿Qualifications: Names and bios/CVs of the individuals who will work on this project, including any familiarity/experience with courts, legal professions, or government operations (desired but not required). Approach and Methodology: Please provide statements regarding your approach to the following skills and tangible examples of your application of those skills. Group Facilitation: Successful consultants will understand and have experience in designing and leading multi-stakeholder day-long meetings that encourage healthy group dynamics, including fostering constructive disagreement, building consensus, and maintaining healthy norms. The consultant will use techniques to encourage creative, non-traditional thinking while ensuring alignment with organizational goals. Strategic Thinking and Planning: Expertise in using tools and frameworks to facilitate long-term, strategic planning for complex organizations. Promote long-term, holistic thinking across diverse stakeholders while avoiding siloed or single-interest planning. Developing a clear, comprehensive roadmap to guide the Branch’s strategic initiatives. Ability to Understand and Synthesize Large Data Sets: Analyze and synthesize large volumes of data and diverse opinions from stakeholders. Summarize complex discussions and build consensus around common themes and goals. Ability to understand and distill large sets of information into actionable insights. References: Contact information (phone and email) for at least three professional references who can speak to your experience in facilitating projects similar to the Illinois Judicial Conference in complex organizational settings. Budget: Detailed cost estimate, including hourly rates, anticipated travel expenses, and any additional costs. Vendor Bid Certification: Complete the Vendor Bid Certification and submit it with your proposal (see attachment A).Proposals Due: February 14, 2025 Timeline Proposals Due: February 14, 2025Consultant Selection: Late March 2025Project Commencement: May 1, 2025Project Completion: December 31, 2025 (with the possibility of extending the contract for future years) Evaluation of Proposals Proposals must comply with all RFP requirements, including adherence to submission instructions, completeness, and responsiveness to all elements specified. The evaluation process will involve scoring proposals based on these criteria, with the highest-scoring submissions potentially advancing to further discussions, interviews, or presentations. Key Contact Please direct any questions to Marisa Wiesman, Deputy Director of Strategic Planning, Administrative Office of the Illinois Courts: mwiesman@illinoiscourts.gov or 217-814-6439﻿. Submission Please submit your response to this request for proposal to Alison Spanner, aspanner@illinoiscourts.gov, and Marisa Wiesman, mwiesman@illinoiscourts.gov, by the close of business February 14, 2025. Additional Materials Illinois Judicial Branch 2022-2025 Strategic Agenda Strategic Agenda 2024 Operational Plan﻿ Strategic Agenda 2025 Operational Plan﻿'
