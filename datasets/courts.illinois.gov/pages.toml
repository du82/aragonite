escription The Network Security Engineer is responsible for implementing, managing, and maintaining the Office of Statewide Pretrial Service’s (OSPS) network security system. Posted Date 02/20/25 Closing Date This position will remain open until filled. However, those individuals submitting materials by March 3, 2025 will be given first consideration. Benefits An attractive judicial branch benefits package is offered, including pension, medical, dental, vision and life insurance, as well as deferred compensation and generous leave time. Click Here for State Employee General Benefits | Click Here for OSPS Summary of Benefits Salary $83,528 – $105,810; starting salary commensurate with experience Learn More Network Cloud Engineer Location Springfield, Illinois Office Office of Statewide Pretrial Services (OSPS) Description The Network Cloud Engineer is responsible for installation and configuration of network equipment. This position will ensure connectivity and security. Posted Date 02/20/25 Closing Date This position will remain open until filled. However, those individuals submitting materials by March 3, 2025 will be given first consideration. Benefits An attractive judicial branch benefits package is offered, including pension, medical, dental, vision and life insurance, as well as deferred compensation and generous leave time. Click Here for State Employee General Benefits | Click Here for OSPS Summary of Benefits Salary $83,528 – $105,810; starting salary commensurate with experience Learn More Assistant Counsel Location Springfield, Illinois Description The Office of Statewide Pretrial Services’ (OSPS or Office) is a statewide office that provides pretrial services under the Pretrial Services Act, 725 ILCS 185. Posted Date 02/20/25 Closing Date This position will remain open until filled. However, those individuals submitting materials by March 3, 2025, will be given first consideration. Division Office of Statewide Pretrial Services, Director’s Office Benefit