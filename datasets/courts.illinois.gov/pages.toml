["https://courts.illinois.gov/3305/Pretrial-Case-Management-System-Request-for-Proposal/procurement-detail"]
title = "Pretrial Case Management System Request for Proposal | ilcourts"
description = "Administrative Office of the Illinois Courts contains Supreme, Appellate and Circuit Court information, including judges, and the opinions of the Supreme and Appellate Courts."
full_description = "Procurement Opportunities | State of Illinois Office of the Illinois Courts Pretrial Case Management System Request for Proposal StatusClosed Publish Date3/8/2022 Due Date March 8, 2022 Request for Proposal issued March 24, 2022 All questions for the March 29 meeting due not later than 5:00 PM CST and submitted via email to pretrialservices@illinoiscourts.gov March 29, 2022 Meeting held at 2:00 PM CST with all interested vendors to answer submitted questions April 15, 2022 All additional questions from vendors due not later than 5:00 PM CST and submitted via email to pretrialservices@illinoiscourts.gov April 22, 2022 Answers to all vendor questions released May 13, 2022 Proposal submission deadline not later than 5:00 PM CST via email to pretrialservices@illinoiscourts.gov Attachments Request For Proposal﻿ ﻿ Attachment A: Bid Form﻿ Attachment B: Company Organization and Diversity Questionnaire﻿ ﻿ Attachment C: Budget Template﻿ Attachment D: Vendor Bid Certification Form﻿ Attachment E: Standard Vendor Agreement for Goods and Services Attachment F: OSPS Pretrial CMS System Requirements Attachment G: Pretrial Data Set Vendor Question & Answers from 3/29/22﻿ Vendor Question & Answers - New questions/responses added 4/29/22 ﻿﻿ Slides from Vendor Question & Answer Session Directed To ﻿pretrialservices@illinoiscourts.gov Overview: The Office of Statewide Pretrial Services’ (OSPS or Office) mission is to assist in the administration of justice and promote community safety by ensuring fairness and equality in the pretrial process. The OSPS is a statewide office that provides pretrial services, serving as the designated pretrial service agency under the Pretrial Services Act, 725 ILCS 185. The Office develops pretrial standards throughout Illinois, including employing direct service pretrial staff who conduct pretrial investigations and provide pretrial supervision. The Office invites submissions of proposals for an integrated, comprehensive, pretrial case management system (CMS) and associated implementation services in compliance with the terms and conditions set forth in this request for proposal (RFP) and accompanying documents. In 2022, OSPS will provide pretrial services in at least 63 of 102 counties in Illinois and plans to expand its pretrial services to all Illinois counties by 2025. The Office is soliciting proposals for a comprehensive case management system for pretrial services to criminal defendants (clients) in Illinois. The two primary job functions of the Office are to perform pretrial investigations prior to initial bail hearings and to provide pretrial supervision of clients released during the pretrial phase."
author = "State of Illinois Office of the Illinois Courts"
