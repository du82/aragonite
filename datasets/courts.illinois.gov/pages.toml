["https://courts.illinois.gov/516/Pretrial-Services-Officer---Vermilion-County/employment-opportunities-detail"]
title = "Pretrial Services Officer - Vermilion County | State of Illinois Office of the Illinois Courts"
description = "The Pretrial Services Officer has two primary responsibilities which include the interviewing of detained pretrial defendants, accurately scoring pretrial release assessments, and preparation of pretrial release reports."
full_description = "Pretrial Services Officer - Vermilion County | State of Illinois Office of the Illinois Courts Pretrial Services Officer - Vermilion County Vacancy Announcement LocationVermilion County, IllinoisPosted Date02/18/25Closing DateThis position will remain open until filled. However, those individuals submitting materials by February 28, 2025, will be given first consideration.DivisionOffice of Statewide Pretrial Services, Division of Pretrial Operations BenefitsAn attractive judicial branch benefits package is offered, including pension, medical, dental, vision and life insurance, as well as deferred compensation and generous leave time. Click Here for State Employee General Benefits | Click Here for OSPS Summary of BenefitsSalary$48,198 - $59,277; starting salary commensurate with experience The Office of Statewide Pretrial Services’ (OSPS or Office) is a statewide office that provides pretrial services under the Pretrial Services Act, 725 ILCS 185. The Office’s mission is to assist in the administration of justice and promote community safety by ensuring fairness and equality in the pretrial process. OSPS prepares pretrial investigation reports for the courts and supervises individuals released from custody as directed by the court. The Pretrial Services Officer has two primary responsibilities which include the interviewing of detained pretrial defendants, accurately scoring pretrial release assessments, and preparation of pretrial release reports for the local court. This position will also be responsible for the community supervision of those defendants released by the local court on pretrial release supervision. ﻿The required working hours for this position are: Monday to Friday, 8:00 AM to 4:00 PM BENEFITS: An attractive judicial branch benefits package is offered, including pension, medical, dental, vision and life insurance, as well as deferred compensation and generous leave time. State Employee General Benefits OSPS Summary of Benefits ESSENTIAL DUTIES: Pretrial Services Officers prepare pretrial reports and provide pretrial supervision to adults arrested on criminal charges. Pretrial Services Officers work under the general supervision of a District Supervisor or Regional Chief within the Division of Pretrial Operations. FUNCTIONS INCLUDE: Completes pretrial assessments for defendants arrested on criminal charges.Interviews and assembles information and data concerning employment, residency, criminal record, and social background of arrested persons.Collects records of criminal history and failure to appear history through electronic judicial case management systems, pretrial case management systems, LEADS/NCIC and other sources.Verifies and documents information collected from the defendant through collateral contacts to ensure accuracy and completeness of pretrial reports.Prepares and files with the court pretrial reports including a pretrial assessment, social background information, criminal history, specific recommendations based on assessed risk and status updates on the defendant’s compliance with pretrial conditions.Attends and testifies at court hearings where the status of defendant’s pretrial release or conditions are determined, reviewed or evaluated, modified, or stricken.Administers pretrial intakes and monitors defendant’s compliance with pretrial conditions through regular, documented, contact with defendants in person, by telephone, text message, email, or virtually.Refers clients on pretrial supervision to appropriate services and maintains regular contact with referral sources.Observes, collects and processes drug and alcohol testing samples.Assists the Division’s Electronic Monitoring Unit by installing, removing, and retrieving electronic equipment.Informs the court, state’s attorney and public defender of noncompliance with conditions of pretrial supervision.Provides written notification to defendants of court appearances by letter, email or text message.Oversees inventory of drug tests, electronic monitoring equipment, personal protective equipment, and other supervision materials located in the county.Travels to surrounding counties to perform the duties of a Pretrial Services Officer.Attends OSPS pretrial services trainings and maintains a working knowledge of state laws and national standards pertaining to pretrial services.Performs other duties as assigned. EDUCATION AND EXPERIENCE: Minimum Qualifications: A Bachelor’s Degree from an accredited university. Proficient in the use of Microsoft Office products (i.e., Word, Excel, Access, PowerPoint, Outlook.) A valid Illinois Driver’s License, a safe driving record and proof of automobile insurance to operate a personal vehicle on state business. Ability to travel 25% of the time. Preferred Qualifications: Bachelor’s Degree in Criminal Justice or a social services related field. Two or more years professional working experience in a public or private organization. Two or more years of professional working experience within the criminal justice system including community corrections, law enforcement, law, or trial court administration. Two or more years providing social services, such as mental health or substance abuse treatment, to justice involved individuals. One year of experience in pretrial services. Master’s Degree from an accredited university. Excellent communication and interpersonal skills. Ability to positively and professionally interact with co-workers. ﻿PHYSICAL REQUIREMENTS: Ability to sit for extended time periods. Normal office working environment requiring telephone usage and ability to process written documents. Travel within Illinois required. ﻿HOW TO APPLY: Interested individuals should submit a resume and cover letter through the form below. https://app.smartsheet.com/b/form/cfdfd666f464473185cdbbd0a5b7b361 A judicial branch application is not required to apply, but it will be required before final hiring decisions are made. The application can be downloaded from the Illinois Courts website: https://ilcourtsaudio.blob.core.windows.net/antilles-resources/resources/b0377255-a5e8-4c75-af0b-65925622d97b/Judicial%20Branch%20Employment%20Application.pdf This position will remain open until filled. However, those individuals submitting materials by February 28, 2025, will be given first consideration. Any questions about this position or the application process can also be submitted via email at the following address: pretrialservices@illinoiscourts.gov . EQUAL OPPORTUNITY EMPLOYER More Opportunities﻿"
author = "State of Illinois Office of the Illinois Courts"
year_published = 2025
