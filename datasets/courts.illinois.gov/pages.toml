full_description = "Procurement Opportunities | State of Illinois Office of the Illinois Courts Illinois Supreme Court - Reviewing Courts' Case Management System - Request for Information StatusClosed Publish Date04/13/12 Due Date05/18/12, close of business AttachmentsRequest for Information for the Reviewing Courts' Case Management System PDF format Reviewing Courts' Case Management System - RFI Questions and Answers - Revised May 16, 2012 Standard Vendor Agreement Vendor Bid Certifications Directed ToOverview: The Supreme Court of Illinois is requesting vendor responses to this Request for Information (RFI) that will be used to rewrite and expand the capabilities of the Reviewing Courts’ case management systems (CMS). The purpose of this RFI is to gather information from responsible and experienced vendors to partner with the Court to deploy a fully functional CMS. On behalf of the Illinois Supreme Court, the AOIC is seeking to contract with a third-party partner to assist with the design and development of a Reviewing Courts’ case management systems (CMS). The CMS is expected to leverage the existing Oracle hardware and software platform, be written using existing development and reporting tools, and operate using the existing Oracle RAC enterprise database and corresponding middleware. The selected vendor will work with the Supreme Court and Appellate Court Clerks’ offices and the AOIC’s JMIS Division to define the requirements of a new CMS to be used in the Supreme Court and each Appellate Court District. The vendor is to deliver a rapid development project plan, timeline, and costs to implement a fully functional CMS and related applications that are populated with past court data and meet the specifications stated during this project. The new CMS will incorporate the functionality of the current case management systems and be designed to include new capabilities that support the workflow of the Supreme Court and each Appellate Court District."
