ch benefits package is offered, including pension, medical, dental, vision and life insurance, as well as deferred compensation and generous leave time. Please refer to the following Benefits Information Sheet for additional details. Remote work is available. Salary $66,280 per year or commensurate with experience Learn More Information Systems Technical Consultant Location Springfield, IL Description The Administrative Office of the Illinois Courts' JMIS Division is seeking two (2) Information Systems Technical Consultants to join JMIS’ Hardware/Software group. Posted Date 01/06/25 Closing Date The position will remain open until filled. Division Judicial Management Information Services (JMIS) Benefits An attractive judicial branch benefits package is offered, including pension, medical, dental, vision and life insurance, as well as deferred compensation and generous leave time. Please refer to the following Benefits Information Sheet for additional details. Remote work is available. Salary $66,280 per year or commensurate with experience; salary to be determined upon hire Learn More Appellate Court Research Attorney Location Elgin Office Second District, Illinois Appellate Court Description The Second District Appellate Court is seeking new graduates and experienced attorneys with a passion for legal writing and a strong interest in appellate law. Posted Date 11/25/24 Closing Date This position will remain open until filled. However, those individuals submitting materials by Wednesday, January 15, 2025, will be given first consideration. Division Legal Research Division Benefits The Judicial Branch offers an attractive benefits package that includes pension, medical, dental, vision, life insurance, deferred compensation, and generous leave time. Salary $83,528 Learn More Maintenance Custodian Location Mount Vernon, Illinois Office Fifth District Appellate Court Description Performs cleaning, cooking, housekeeping and maintenance work in the Fifth District Appellate Courthouse and grounds. Posted Date 12/20/24 Closing Date This position will remain open until filled. However, those individuals submitting materials by January 17, 2025, will be given first consideration. Benefits An attractive judicial branch benefits package is offered, including pension, medical, dental, vision and life insurance, as well as deferred compensation and generous leave time. Salary $43,818 per year Learn More Associate Deputy Director, Learning and Development Location Hybrid (Remote/In Person) Chicago, Illinois Office Administrative Office of Illinois Courts Description The Associate Deputy Director of the Learning & Development Unit shares a collaborative leadership role with Associate Deputy Directors of other Units within the... Posted Date 10/16/24 Closing Date This position will remain open until filled. Division Supreme Court of Illinois Judicial College Benefits An attractive judicial branch benefits package is offered, including pension, medical, dental, vision, life insurance"
