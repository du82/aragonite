["https://courts.illinois.gov/480/Maintenance-Custodian/employment-opportunities-detail"]
title = "Maintenance Custodian | State of Illinois Office of the Illinois Courts"
description = "Administrative Office of the Illinois Courts contains Supreme, Appellate and Circuit Court information, including judges, and the opinions of the Supreme and Appellate Courts."
full_description = "Maintenance Custodian | State of Illinois Office of the Illinois Courts Maintenance Custodian Vacancy Announcement LocationMount Vernon, IllinoisOfficeFifth District Appellate CourtPosted Date12/20/24Closing DateThis position will remain open until filled. However, those individuals submitting materials by January 17, 2025, will be given first consideration.BenefitsAn attractive judicial branch benefits package is offered, including pension, medical, dental, vision and life insurance, as well as deferred compensation and generous leave time.Salary$43,818 per year ﻿﻿ESSENTIAL RESPONSIBILITIES: Performs cleaning, cooking, housekeeping and maintenance work in the Fifth District Appellate Courthouse and grounds. Work is performed under the supervision of the Physical Facilities Manager and the Clerk of the Appellate Court. ﻿FUNCTIONS INCLUDE:Operates hand and power equipment to sweep, mop, scrub, strip, wax, and buff floors, hallways and stairways; vacuums, dusts, cleans windowsills, and railings; repairs furniture, equipment, and fixtures; pours, mixes and safely stores cleaning chemicals.Collects and removes wastepaper and trash from offices, rooms, halls, and restrooms; washes walls, interior and exterior windows, mirrors, light fixtures, and drinking fountains, disinfects toilets, wash bowls, and urinals.Replenishes towels, tissues, soaps, and other restroom supplies.Moves and arranges furniture; receives, stores and transports supplies to proper locations.Removes and replaces drapes for cleaning; cleans blinds, patches plaster and paints.Estimates food quantities when required, places orders, receives, and stores food supplies.Plans and prepares meals.Cleans kitchen appliances, kitchen and dining room floors, furniture, cookware, dishes, glasses, and utensils; polishes silverware.Washes towels, aprons, cloth napkins, and any other related kitchen or dining materials.Maintains light fixtures; performs minor electrical repairs; cleans and oils fans and motors; replaces furnace filters.Performs minor plumbing repairs; replaces washers, faucets, and unclogs drains. Flushes pump strainers; drains air compressors; cleans humidifiers; calibrates temperature controls and thermostats; cleans boiler burners and flue; charges fire extinguishers; adds chemicals to cooling water tower.Performs grounds maintenance tasks such as mowing, trimming hedges, raking leaves, removing snow, and sweeping walkways; performs minor maintenance on snow blower and riding mower.Performs other duties as assigned.﻿EDUCATION AND EXPERIENCE: Six months’ cooking and kitchen experience and a minimum of one year of custodial and building maintenance experience is required; food handler certification preferred.﻿Candidates will have working knowledge of chemicals and equipment used to clean building interiors; working knowledge of janitorial methods; the ability to estimate food quantities and prepare meals from standard recipes; the ability to operate kitchen equipment including stoves and dishwashers safely, the ability to clean floors and utensils, the ability to transport trash to receptacles, and the ability to operate clothes washers and dryers safely; the ability to associate with employees and the public in a pleasant, courteous, and helpful manner; plumbing, heating, ventilation, and air conditioning equipment sufficient to perform minor maintenance and repairs according to codes and trade practices; working knowledge of the safe operation of grounds maintenance equipment such as hand and powered mowers, trimmers, and snow blowers; the ability to work independently and to follow instructions.﻿PHYSICAL REQUIREMENTS: This position requires the ability to safely lift, stoop, reach, and bend to perform grounds and building maintenance work; the ability to safely operate janitorial equipment such as commercial buffers; and the ability to safely move furniture and equipment. ﻿Interested individuals should submit a resume, letter of interest, and three references, via e-mail, to:AC5@illinoiscourts.gov This position will remain open until filled. However, those individuals submitting materials ﻿﻿by January 17, 2025, will be given first consideration.Offers of employment may be conditional upon successful completion of a criminal history background check.EQUAL OPPORTUNITY EMPLOYER More Opportunities﻿"
author = "State of Illinois Office of the Illinois Courts"
year_published = 2025
