full_description = "Judicial Management Information Services Division (IT) | State of Illinois Office of the Illinois Courts (217) 785-3906﻿ (Springfield Office) Skip Robertson, Chief Information OfficerThe Judicial Management Information Services division (JMIS / IT) division is one of ten divisions in the Administrative Office of the Illinois Courts (AOIC). At the direction of the Supreme Court and Administrative Director, JMIS provides technology to the offices and staff of the Illinois Supreme Court and five Appellate Court Districts, all divisions within the AOIC, and mandatory arbitration offices. JMIS also supports Supreme Court technology initiatives in the circuit courts, including remote hearings and digital recording systems, which provides an audio or video recording of court hearings and is currently installed in 439 trial court courtrooms.JMIS works with judges and courts to support their remote hearing needs as the Supreme Court’s technology initiatives encourage courthouse and courtroom technologies to aid in efficiencies and remote hearing capabilities. Digital recording systems are enhanced to integrate evidence presentation systems, remote hearing technologies, and other courtroom technologies. JMIS also provides technical insight and leadership in supporting the Supreme Court’s statewide e-filing initiative where all Illinois courts accept civil filings (approximately 500,000 filings per month) and approximately72 counties and the reviewing courts accept criminal filings through a central e-filing hub (EFM). In addition, JMIS staff are working with judges and courts on the Supreme Court’s statewide data and online reporting initiative. Divisions in the AOIC are identifying data needs and integration processes to connect case management systems and other data sources directly with a central online reporting platform for real-time, caseload data, case specific statistical, and financial reports. JMIS is staffed by 25 professionals consisting of six groups skilled in specific IT professions and able to respond to Supreme Court initiatives, employee needs and technology initiatives. JMIS’ IT Security group manages the Courts’ statewide infrastructure and cybersecurity systems. The Hardware / Software group manages server applications, desktop and laptop computers, peripherals, and productivity software. The Hardware / Software group is also the primary group responsible for the installation and support of the digital recording systems in the Supreme Court, Appellate Court, and Circuit Courts. JMIS’ Internet Services group is responsible for the design and upkeep of the Supreme Court’s public website (www.illinoiscourts.gov﻿) and other websites developed for use within the branch. The User Services group staffs JMIS’ Help Desk, supports telecommunication services and phone systems, and manages assets, tracking their location throughout the judicial branch. The Application Group is responsible for the design and enhancements to sixteen Oracle enterprise database applications. JMIS’ Data and Online Reporting group is responsible for the technologies and reporting needed to support the Court’s online reporting initiative. Remaining JMIS staff provide critical services, skills, and manage technologies and infrastructures for the judicial branch."
