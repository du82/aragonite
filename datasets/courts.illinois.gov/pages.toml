["https://courts.illinois.gov/1392/Administrative-Office-of-the-Illinois-Courts-Job-Classification-and-Compensation-Study-Request-for-Proposals/procurement-detail"]
title = "Administrative Office of the Illinois Courts - Job Classification and Compensation Study - Request for Proposals | ilcourts"
description = "Administrative Office of the Illinois Courts contains Supreme, Appellate and Circuit Court information, including judges, and the opinions of the Supreme and Appellate Courts."
full_description = '''Procurement Opportunities | State of Illinois Office of the Illinois Courts Administrative Office of the Illinois Courts - Job Classification and Compensation Study - Request for Proposals StatusClosed Publish Date04/17/17 Due Date06/16/17 AttachmentsAOIC Compensation RFP, attachments included Directed ToProposals and Pricing (in separate cover) submitted to: RFPCompStudy@illinoiscourts.govRFP proposals submitted in searchable PDF documents attached to email. Questions Due: Monday, May 15, 2017Directed To: Constance M. Brown, Compensation Manager: RFPCompStudy@illinoiscourts.govAnswers Posted: Tuesday, May 30, 2017Vendor's Conference: To be determined. Overview: The Illinois Judicial Branch is a unified court system responsible for applying the Constitution and law of Illinois. The Illinois Supreme Court is the state's highest court and consists of seven justices. General administrative and supervisory authority over the court system is vested in the Supreme Court. The state is divided into five judicial districts, with three Supreme Court justices elected from the First District (Cook County) and one justice elected from each of the other four districts. Several support units assist the Supreme Court with its work. These include: the AOIC Administrative Director, the Clerk of the Supreme Court, the Reporter of Decisions, the Supreme Court Marshal, the Supreme Court Chief Internal Auditor, the Supreme Court Research Director, and the Supreme Court Librarian. The mid-level reviewing court, the Illinois Appellate Court, is comprised of 54 judges serving the five judicial districts, administratively centered in Chicago, Elgin, Ottawa, Springfield, and Mt. Vernon. In addition to personal staff, the presiding judge and judges of each appellate district are assisted by an appellate court clerk and research director. The court of "original jurisdiction" is the circuit court. Illinois is divided into 24 circuits, each comprising one or more of Illinois' 102 counties. Each circuit is administered by a chief judge, and the chief judge is assisted by an administrative assistant and/or trial court administrator and other support staff. This Job Classification and Compensation Study will encompass the approximately 650 non-judicial state-paid positions within the support units of the Supreme, Appellate and Circuit Courts. For more information on the Illinois Judicial Branch please visit www.illinoiscourts.gov. The Illinois Supreme Court is committed to applying principles of fair pay and internal equity in accordance with all applicable laws and statutes while maintaining a competitive market position to attract, retain, and compensate its employees. Through this Job Classification and Compensation Study, the Illinois Supreme Court seeks to ensure that the salary structure for state-paid, non-judicial positions is aligned with the appropriate external labor markets in which it competes for talent while maintaining internal equity among its job classifications. The project will result in a comprehensive job classification and compensation study that will allow the AOIC to make recommendations to the Illinois Supreme Court regarding the appropriate job classification and pay for all state-paid non-judicial classified positions under the Supreme Court’s Job Classification and Compensation Rules, as well as non-classified positions that are unique in nature to the court system. If the study suggests that adjustments should be made, the project will also include a plan for implementation, cost, and proposed policy changes.'''
author = "State of Illinois Office of the Illinois Courts"
year_published = 2025
clearnet = "https://courts.illinois.gov/1392/Administrative-Office-of-the-Illinois-Courts-Job-Classification-and-Compensation-Study-Request-for-Proposals/procurement-detail"
