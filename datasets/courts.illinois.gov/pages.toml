description = "Administrative Office of the Illinois Courts contains Supreme, Appellate and Circuit Court information, including judges, and the opinions of the Supreme and Appellate Courts."
full_description = "Remote Proceedings | State of Illinois Office of the Illinois Courts Illinois Courts remained open throughout the COVID-19 pandemic by moving many court proceedings, where appropriate, to remote hearings in almost every type of case. The Illinois Supreme Court has recognized the importance of remote hearings in Supreme Court Rules 45﻿, 46﻿ and 241﻿ and emphasized that remote appearances should not be viewed as merely temporary COVID-induced measures. In addition, remote hearings constitute a boon not only to self-represented litigants but also attorneys and other court participants who have reaped numerous benefits. Remote hearings have brought greater party participation, fewer defaults and failures to appear, and enhanced case management and scheduling. Remote Proceedings Directory & Resources View Remote Proceedings Availability by Court View Remote Court Resources like FAQs and videos on How to Zoom from a Computer or Smart Phone Remote Proceeding Guidelines ﻿ Helpful Videos Preparing for a Court Appearance via Zoom Preparación para una comparecencia ante el tribunal a través de Zoom Related Links Illinois Supreme Court Creates Remote Proceedings Task Force Illinois Courts Response to COVID-19 Emergency/Remote Proceedings in Mortgage Foreclosure Matters Illinois Courts Response to COVID-19 Emergency/ Remote Jury Selection in Civil Cases Illinois Courts Response to COVID-19 Emergency/Remote Proceedings in Criminal Matters Illinois Courts Response to COVID-19 Emergency/Remote Proceedings in Adult Criminal Matters Illinois Courts Response to COVID-19 Emergency / Remote Service of Process or Personal Service of Protective Orders Illinois Supreme Court Amends Rules to Support Use of Remote Hearings in Court Proceedings Illinois Courts Response to COVID-19 Emergency / Reduction of Unnecessary In-Person Court Appearances Illinois Courts Response to COVID-19 Emergency / Remote Proceedings in Criminal Matters Resources Remote Jury Guidelines"
