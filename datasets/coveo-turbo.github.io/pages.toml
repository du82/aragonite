["https://coveo-turbo.github.io/docs/Getting-Started"]
title = "Getting Started with Coveo Turbo"
full_description = 'Coveo Turbo is a CLI-based tool designed to speed up development by standardizing and automating common tasks to quick start the creation of a reusable custom component or implementation project. This article explains how to get started using Coveo Turbo to create, modify, and publish a component. To learn how to test an existing component without cloning an existing project, see Testing Coveo Turbo Components. To install Coveo Turbo, you need a Node environment with npm. You can download and install both on the node.js website. Coveo Turbo is compatible with version 12 to 14 of Node.js. While using previous or newer versions may work for certain commands, it’s possible that other commands will not work properly. For example, when creating a new project, run ‘nvm use 14’ before creating the project. If you want to use JavaScript instead of TypeScript, you should add --template vanilla to the command. Similarly, to use pure CSS instead of Sass, add --styles-template vanilla to the command. The search page is not automatically connected to a Coveo Cloud organization; this can be added when serving the component. Once you have created your component, you can start modifying the created template to develop your functionality. In the generated src folder, you should be able to find a TestComponent.ts (where TestComponent is replaced with the name you gave your component). This file handles the logic of your component, and is written in Typescript. To learn how to create custom TypeScript components, see Advanced Integration With Custom TypeScript Component (Implementation). If you’ve created a JavaScript component instead, see Implementing a Custom Component in JavaScript. You can also change the styling of the component by changing the src\stylesheets\TestComponent.scss Sass file (where TestComponent is replaced with the name you gave your component). Once you have modified your component and are ready to test it, you need to run the build command, so the code can be built.'
year_published = 2025
clearnet = "https://coveo-turbo.github.io/docs/Getting-Started"
tags = ["build", "component", "creating", "install", "modifying", "prerequisites", "project", "serving"]
language = "en"
internal-references = ["none"]
external-references = ["connect.coveo.com", "coveo.com", "docs.coveo.com", "github.com", "levelup.coveo.com", "marketplace.visualstudio.com", "nodejs.org", "platform.cloud.coveo.com", "sass-lang.com"]

["https://coveo-turbo.github.io/docs/Testing-Components.html"]
title = "Testing Coveo Turbo Components"
full_description = "Coveo Turbo offers a bunch of components that work hand in hand with the Coveo JavaScript Search Framework. To use an existing Coveo Turbo component, it is usually recommended to install it through npm. However, when you just want to quickly test a component to see if it answers your requirements, you can use a reference to the compiled JavaScript instead. The format of the compiled JavaScript looks like this, where {component-name} is replaced with the name of the component: You are discouraged from using unpkg as a production CDN. However, to ease the early steps of development, you are welcome to reference the unpkg code directly. Once you have loaded the script on your page, you can reference the Coveo Turbo component like any other Coveo component. The exact name is usually indicated in the readme of the component, but it typically looks like this: You add the following tag in the header of your page, so the script loads from unpkg. Since this is a test environment on your local machine, you are not worried about being throttled. In the CoveoSearchInterface component of the search page where you are testing the component, you add the following markup: Because the counted-tabs component expects a field to be used, you add it in the data attributes, as such:"
