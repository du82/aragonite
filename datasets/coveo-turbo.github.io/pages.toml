["https://coveo-turbo.github.io/docs/Salesforce-Integration.html"]
title = "Using Coveo Turbo with Coveo for Salesforce"
full_description = "This article explains how to use Coveo Turbo to build customizations that will be deployed to the Salesforce cloud. All the translation steps are currently manual. Start by creating a new Turbo project - you can use the --page-layout option as a shortcut to specify a starter layout. To ease development, you may need to use the viewAllContent argument locally so that templates you otherwise won’t see are accessible during development. To enable this in your local environment, add the following piece of Javascript code within the DOMContentLoaded event handler found in the <head> section of the markup of your page. Your local API key will require the View All Content permission to be granted, see Privilege Reference - View all Content Domain To integrate custom Javascript and CSS that is compiled by Turbo in the dist folder into a Lightning component, there are a few main steps that are necessary to get started: Create a new static resource (preferably a zip type) in Salesforce with the compiled assets from Coveo Turbo. When you use the build command, Coveo Turbo compiles your src folder and adds the final minified code to the dist folder. Here is the relative mapping of files you want to include in the static resource: The static resource file does not have to have the same name as the output in the dist folder, but for simplicity this guide will refer to them on a one-to-one basis. The index.min.js file in the root of the static resource path must be wrapped in the following code snippet. Copy-paste the code from the dist/index.min.js within the code block as shown. Replace 'default' with the name of the visualforce component using this script if necessary. More concretely, the minified Javascript generated by Coveo Turbo will look similar to the following screenshot - which also replicates the default folder structure. In order for this code to work within Salesforce, the block in the dist file will sit within a function call which returns a promise. Create a custom lightning component to wrap the out of the box Coveo for Salesforce lightning components and add references to your static resource."
year_published = 2025
clearnet = "https://coveo-turbo.github.io/docs/Salesforce-Integration.html"
