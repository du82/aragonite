title = "Cli Reference"
full_description = "Replace the COMMAND with the appropriate one from the table below with its corresponding arguments and options. You can also add the command to your package.json scripts to continue using familiar hooks like npm run build Coveo injects custom components into its root object by using a custom utility called SwapVar. With Coveo Turbo, this utility is injected into the root index of the code during build time, so no additional effort or integration is necessary in a project. Thanks to the SwapVar utility, the exported component is referenced in implementation JavaScript code as such: Without the SwapVar utility, achieved by using the disable-swapvar option in the build, the exported component library is referenced in implementation JavaScript code such: If no org-id or token are used, then a sample Coveo organization with some already indexed content is used. For example, importing a component installed from @coveops/test-component will have the following assets served: Alternatively, these installed components can be bundled into the library via the corresponding index file in the src before being built. The serve command generates a JavaScript snippet that is injected into the page by importing the /config.js file, which contains some of the information that was passed through environment variables or CLI arguments in a global demoConfig variable. This allows a page to remain decoupled from the test settings to allow portability between environments where component-level dependencies permit. The following information is passed in the demoConfig object and is available to use within the application at runtime: This command adds the necessary files to kick-start a project to create a shareable component and optionally the component itself. When ran using npx, the create:project utility initializes a package.json and installs itself as a dev dependency for you. This command creates a blank component to be used to canvas for your needs. It is currently available as vanilla and typescript types."
