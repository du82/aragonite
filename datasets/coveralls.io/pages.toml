full_description = "We help you deliver code confidently by showing which parts of your code aren’t covered by your test suite. Free for open source repos. Pro accounts for private repos. Instant sign up through GitHub, Bitbucket, and Gitlab. “Coveralls has been an extremely valuable tool for helping us gain insight into our testing suite health beyond the binary red or green metric. We won’t merge a PR without it!” - Marc Campbell (Co-Founder and CTO Replicated) Figuring out where your tests are lacking can be painful. You're already running your tests on a continuous integration server, so shouldn't it be doing the heavy lifting? Coveralls works with your CI server and sifts through your coverage data to find issues you didn't even know you had before they become a problem. If you're just running your code coverage locally, you won't be able to see changes and trends that occur during your entire development cycle. Display your coverage percentage like a badge of honor with our — well — Badges of Honor. Encourage others to join the movement for code coverage! There might be an entire area of your application that is an apocalyptic hellstorm of bugs just waiting to attack your customers. And their families."
