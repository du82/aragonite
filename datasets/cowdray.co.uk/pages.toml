full_description = '''Challens Yarde CHECK IN/OUT MONDAYS WEDNESDAYS & FRIDAYS BOOK NOW Contact Us Scroll for moreChallens YardeA truly luxurious home away from homeSleeps 8Challens Yarde is a beautifully appointed grade II listed luxury cottage newly available for holiday rental. Formerly a wheelwright’s shop and three cottages, Challens is a large double fronted cottage, providing spacious, bright, and airy accommodation for up to eight people, with its own private garden and off-street parking. Just two minutes’ drive from the centre of Easebourne and Cowdray Farm Shop & Café, the cottage has four double bedrooms all with king-size beds, three with en-suite bathrooms, and the fourth bedroom having a bathroom next door.Downstairs is spacious with a contemporary, well-equipped kitchen with modern appliances. To the back of the house is a boot room with plenty of storage capacity that leads straight out to the large private garden, featuring a patio dining area and hot tub. There is a snug off the kitchen with large comfortable sofa and chairs, providing the perfect space to relax whilst supper is cooking. The sitting room is spacious and bright, with an open fireplace. Positioned to the back of the cottage benefitting from plenty of natural light, the dining room features a large table that comfortably seats eight people.Sure to be a favourite with both families and groups of friends alike, its location provides easy access to all that Cowdray Estate and West Sussex has to offer, as well as plenty of local options for dining out locally. Up to two dog’s welcome. Book your self catering holiday stay at CowdrayPlease note that our holiday cottage check in / check out days are Mondays, Wednesdays and Fridays.No Availability? View and book all self catering holiday cottagesIf you have a specific date you would like us to look at, please call our reservation team on +44 (0)1730 814522 or email [email protected]. Your booking calendar is loading and will appear here very soon. What's IncludedSecret Linen Store bed linenCowdray Farm Shop welcome hamperFreeview & wifiIla bathroom productsTowels & bathrobesHairdryerIron & ironing boardOpen fire, fire pit & a complimentary basket of logsAmple off-street parkingLarge private gardenPrivate Hot TubBarbecueWashing machine & dishwasherMicrowave & ovenFridge & freezerNespresso MachineUp to two dogs welcome (additional £35 charge)A private yet central hideawayThe Perfect luxury staycationWhether looking for a retreat from a fast paced life or a base to explore everything that Cowdray Estate has to offer, with its a private yet central location Challens Yarde is ideal for family stays or holidays with friends, with everything you need right on your doorstep. //<![CDATA[ window.__mirage2 = {petok:"ulKsJF8tvXl7k4UE5lqV0d5rFzh1xQeETJrgq0nBZ_M-1800-0.0.1.1"}; //]]> <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2022/05/challens-yarde-63.jpg?resize=600%2C600&ssl=1" alt=""> <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2022/05/challens-yarde-31.jpg?resize=600%2C600&ssl=1" alt=""> <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2022/05/challens-yarde-6.jpg?resize=600%2C600&ssl=1" alt="One of the sitting rooms of Challens Yarde, part of the Cowdray Collection of luxury holiday cottages." class="img-responsive" rel="gallery"> <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2022/05/challens-yarde-5.jpg?resize=600%2C600&ssl=1" alt="One of the sitting rooms of Challens Yarde, part of the Cowdray Collection of luxury holiday cottages." class="img-responsive" rel="gallery"> <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2024/07/Challens-Hot-tub-2.jpg?resize=600%2C600&ssl=1" alt="" class="img-responsive" rel="gallery"> <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2022/05/challens-yarde-21.jpg?resize=600%2C600&ssl=1" alt="The dining room of Challens Yarde, part of the Cowdray Collection of luxury holid