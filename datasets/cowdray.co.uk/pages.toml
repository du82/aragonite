full_description = '''Ambersham House CHECK IN/OUT MONDAYS WEDNESDAYS & FRIDAYS BOOK NOW Contact Us Scroll for moreAmbersham HouseA truly luxurious home away from home in the heart of polo countrySleeps 6Ambersham House is a picturesque Grade II newly renovated country house which overlooks Cowdray’s world renowned polo fields. It is the most recent property to be added to Cowdray’s holiday let portfolio. Located in a rural hamlet, this stylish holiday home is tucked away in beautiful hidden West Sussex countryside and is within easy walking distance of Ambersham Grounds where 7 of Cowdray’s 12 polo pitches are found.Situated in the South Downs National Park, this characterful property, built in the 1800s, has been lovingly restored retaining original features such as beams and tiles. It has three bedrooms, two of which are super king size with ensuite bathrooms and one is a king size room with a separate bathroom nearby.The large entrance hall leads into a spacious downstairs living space with a fully equipped kitchen with an island in the middle. The stunning kitchen opens up into a light dining room with views to the front of the property. The dual aspect sitting room has a cosy library at one end complete with a working fireplace, and a relaxing sitting area at the other with terrace doors opening onto a large private garden. There is also a cloakroom/boot room and a garage for parking.The garden is well equipped to enjoy the summer sunshine and the tranquillity of the English countryside with a BBQ, sun loungers and garden furniture.Ambersham House is ideal for families and couples alike looking to enjoy a rural getaway. It’s location two miles from Midhurst and eleven miles from Chichester make it well situated to enjoy everything that Cowdray and the surrounding area has to offer. Up to two dogs are welcome. Book your self catering holiday stay at CowdrayPlease note that our holiday cottage check in / check out days are Mondays, Wednesdays and Fridays.No Availability? View and book all self catering holiday cottagesIf you have a specific date you would like us to look at, please call our reservation team: +44 (0)1730 814522 or email [email protected]. Your booking calendar is loading and will appear here very soon. What's IncludedSecret Linen Store bed linenCowdray Farm Shop welcome hamperFreeview & wifiIla bathroom productsTowels & bathrobesHairdryerIron & ironing boardOpen fire, fire pit & a complimentary basket of logsPrivate GarageLarge private gardenBarbecueWashing machine & dishwasherMicrowave & ovenFridge & freezerNespresso MachineUp to two dogs welcome (additional £35 charge) //<![CDATA[ window.__mirage2 = {petok:"8J98JphOr7VOStqPb3nhJmeQ0ERjkzg1xEB_kMOVCMs-1800-0.0.1.1"}; //]]> <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2024/06/903A2275-scaled.jpg?resize=600%2C600&ssl=1" alt="In this exquisite home away from home, a stone's throw away from Ambersham Polo Grounds">Relax and unwindIn this exquisite home away from home, a stone's throw away from Ambersham Polo GroundsThe open style of the hallway into the kitchen and dining room, makes this the perfect spot to enjoy quality time together, entertaining friends or family, with stunning views of the fields and garden from both the front and back of the house. <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2024/06/903A2075-scaled.jpg?resize=600%2C600&ssl=1" alt="In this exquisite home away from home, a stone's throw away from Ambersham Polo Grounds">Relax and unwindIn this exquisite home away from home, a stone's throw away from Ambersham Polo GroundsThe open style of the hallway into the kitchen and dining room, makes this the perfect spot to enjoy quality time together, entertaining friends or family, with stunning views of the fields and garden from both the front and back of the house. <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2024/06/903A2100-scaled.jpg?resize=600%2C600&ssl=1" alt="In this exquisite home away from home, a stone's throw away from Ambersham Polo Grounds">Relax and unwindIn this exquisite home away from home, a stone's throw away from Ambersham Polo GroundsThe open style of the hallway into the kitchen and dining room, makes this the perfect spot to enjoy quality time together, entertaining friends or family, with stunning views of the fields and garden from both the front and back of the house. <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2024/06/903A2120-scaled.jpg?resize=600%2C600&ssl=1" alt="In this exquisite home away from home, a stone's throw away from Ambersham Polo Grounds">Relax and unwindIn this exquisite home away from home, a stone's throw away from Ambersham Polo GroundsThe open style of the hallway into the kitchen and dining room, makes this the perfect spot to enjoy quality time together, entertaining friends or family, with stunning views of the fields and garden from both the front and back of the house. <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2024/06/903A2148-scaled.jpg?resize=600%2C600&ssl=1" alt="In this exquisite home away from home, a stone's throw away from Ambersham Polo Grounds">Relax and unwindIn this exquisite home away from home, a stone's throw away from Ambersham Polo GroundsThe open style of the hallway into the kitchen and dining room, makes this the perfect spot to enjoy quality time together, entertaining friends or family, with stunning views of the fields and garden from both the front and back of the house.Set in the heart of Cowdray ParkPolo at your doorstepDuring the summer months, the fabulous game of polo can be seen from the house, or for those who are keen to watch a match it is on your doorstep with complimentary tickets provided for guests. Set in the centre of the grounds is Ambersham Clubhouse, open throughout the summer season for lunch, afternoon tea and dinner. Cowdray Park Polo Club <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2024/03/MB9_6635WSussex-scaled.jpg?resize=600%2C600&ssl=1" alt=""> <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2024/03/MB96344WSussex-scaled-e1710935205855.jpg?resize=600%2C600&ssl=1" alt=""> Ambersham CommonStunning SurroundingsAmbersham House is situated a stone's throw from Ambersham Common a nature reserve and 141.6-hectare biological Site of Special Scientific Interest ideal for walking. Wander through sandy heathlands, old forests and on to chalky downland. <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2019/05/1G7A7843.jpg?resize=1200%2C800&ssl=1" alt="Stunning Surroundings "> <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2024/06/903A2278-scaled.jpg?resize=600%2C600&ssl=1" alt="" class="img-responsive" rel="gallery"> <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2024/06/903A2283-scaled.jpg?resize=600%2C600&ssl=1" alt="" class="img-responsive" rel="gallery"> <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2024/06/903A2310-scaled.jpg?resize=600%2C600&ssl=1" alt="" class="img-responsive" rel="gallery"> <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2024/06/903A2311-scaled.jpg?resize=600%2C600&ssl=1" alt="" class="img-responsive" rel="gallery"> <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2024/06/903A2322-scaled.jpg?resize=600%2C600&ssl=1" alt="" class="img-responsive" rel="gallery"> <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2024/06/903A2339-scaled.jpg?resize=600%2C600&ssl=1" alt="" class="img-responsive" rel="gallery"> <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2024/06/903A2344-scaled.jpg?resize=600%2C600&ssl=1" alt="" class="img-responsive" rel="gallery"> <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2024/06/903A2110-2-scaled.jpg?resize=600%2C600&ssl=1" alt="" class="img-responsive" rel="gallery"> <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2024/06/903A