full_description = "Corporate at Cowdray House Enquire Now Scroll for moreThe perfect venue for any business occasionLocated in the rolling hills of the Sussex countryside, with easy access to central London and its major airports, the 110 acres of Cowdray House are exclusively yours for the duration of your stay. Ideal for entertaining VIP clients, corporate retreats, product launches or conferences, Cowdray House will be a home away from home. A truly bespoke countryside haven where your team and clients can relax, bond and create new ideas.Your corporate stay at Cowdray House includes:22 Bedrooms with more on the EstateIndoor & outdoor poolTennis CourtCroquet Lawn & cricket pitchBowling AlleySpring PackageEnjoy the beginning of 2025 at Cowdray HouseCowdray House is the perfect place to look to the year ahead with your colleagues and partners. Our team are experts at planning bespoke events and have taken the hassle out of planning with our festive offer.Email [email protected] to find out more.OFFER DETAILS A country house forMODERN MEETINGSWith a multitude of spaces available, you can choose to get down to business in true grandeur with a formal boardroom meeting or keep things casual with a poolside BBQ. The versatility of the House means nothing is off-limits, and our experienced team will work alongside you to ensure that everything runs smoothly. The best business deals are done out of the officeActivities & FacilitiesWhy not take your afternoon meeting to our 18-hole golf course, give your clients an experience to remember with our Estate forager or learn to ride at the home of British Polo in a group lesson? You can even try your hand at axe throwing or duck herding. Activities at Cowdray HouseA place toRESTWith 22 beautiful bedrooms to choose from, you and your team are guaranteed to wake up refreshed and ready to take on the day. Desks are available in the rooms for remote work. We also have a portfolio of holiday cottages, B&B accommodation and even Treehouses all managed by our exacting hospitality team. Stay at Cowdray FEAST AND DINEA passion for foodCulinary CreativityDinner is ServedDelicious food is central to stays at Cowdray. Enjoy bespoke menus catering exactly to your taste for the duration of your stay, created using the finest fresh and local ingredients by one of our recommended caterers.Bespoke dining experiencesThe House ChefFrom a meeting over breakfast to a long buffet lunch select from a range of menus and packages curated by our own House chef or from selected local suppliers.Seating up to 150Dine in LuxuryFrom intimate informal gatherings to larger company wide celebrations Cowdray House's flexible dining spaces offer a range of choice. Whether that be dining under the opulent vaulted ceilings of Buck Hall to enjoying a barbeque together on the terrace, our in-house team will find the perfect solution for you.Get in touch below about your Corporate EventWant to find out more?Contact the House Sales team to find out about our day and 24 hour delegate rates for your bespoke event. t: 01730 814522Cowdray House, Cowdray Park, Midhurst, GU29 0AYContact the team Where to find usCowdray House, Midhurst, UK Scroll for more"
