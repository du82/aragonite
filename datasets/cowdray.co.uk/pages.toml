full_description = "Welcome to Cowdray Explore a unique country estate in West Sussex Join our newsletter Scroll for moreA holistic Estate which cares about the landCowdray is a dynamic and progressive Estate. As a destination Cowdray offers a range of premium country pursuits from golf on our Championship course, our award winning clay-pigeon shooting school, fly fishing on the river Rother, walking, cycling, riding, polo, both spectating and learning to play, to hospitality at the Farm Shop & Café, holiday cottages, wedding venues and the stunning Cowdray House, set at the heart of the Estate, available for private stays and events. Sunday 30th MarchMother's Day Afternoon TeaJoin us for a special Mother's Day Afternoon Tea at the beautiful Walled Garden. Prepared by our team of pastry chefs, The Yellow Kitchen Afternoon Tea follows the traditional combination of sweet and savoury, using locally sourced ingredients.BOOK NOW Thursday 3rd AprilSpringtime Fireside DiningJoin us for our Springtime Fireside Dining experience. With a welcome cocktail to enjoy during golden hour before sitting down to this delicious seasonal feast and surprise entertainment, this evening promises to hold delight for all.BOOK NOW Saturday 5th AprilConfused About CholesterolJoin us at Cowdray Hall with Nicola Russell, our in-house Registered Nutritional Therapist, to discover the real deal about Cholesterol. This will be a fascinating insight into cholesterol, dispelling the myths and including tips around lifestyle.BOOK NOW Sunday 6th AprilThe Walled Garden Wedding Open DayYou're invited to The Walled Garden Wedding Open Day on Sunday 6th April.Join us between 11am and 3pm to discover the delights of this charming and romantic wedding venue, perfect for all seasons.FIND OUT MORE Saturday 12th AprilCelebrate Easter at Cowdray Farm Shop & CaféSave the date, and join us for delicious seasonal food, live music, and children's activities this Easter!Find out more Various dates in 2025ForagingJoin Estate Forager George and explore the Cowdray Estate, learning all about the wonderful world of foraging and wild foods.Find out moreCowdray Heritage TrustCowdray Ruins Visitor CentreCowdray Heritage Visitor Centre is open every Saturday and Sunday, from 10am - 3.30pm.Come and visit us, or click below to find out What's On.FIND OUT MORE Shop at Cowdray Farm Shop & Lifestyle Fine food and produce atCowdray Farm ShopThe Farm Shop has a traditional butchery, a well stocked deli and a wide range of carefully selected artisan products which are sourced from local suppliers as well as other producers further afield. Find out more A handpicked selection of homeware items and giftsCowdray LifestyleOffering a unique, curated selection of homeware and lifestyle items, as well as gifts and Cowdray branded products, Cowdray Lifestyle is the ideal place for gifting inspiration. Find out moreSo many places toStay at CowdrayA secluded countryside breakCosters LodgeA newly refurbished country retreat, Costers Lodge is sure to be a favourite with families and groups of friends alike. Sleeping up to six guests with bright, open-plan living and a beautiful terrace, Costers is the perfect holiday home for entertaining and for exploring Cowdray and the South Down National Park. Find out more...A truly luxurious home away from homeChallens YardeChallens Yarde is a beautifully appointed grade II listed luxury holiday cottage. Formerly a wheelwright’s shop and three cottages, Challens is a large double fronted cottage, providing spacious, bright, and airy accommodation for up to eight people, with its own private garden and off-street parking. Find out more...The ultimate rural retreatApsley CottageLocated just outside Bepton village, a short drive from Midhurst town, Apsley is a beautiful cottage tucked away in a stunning rural location, available as a short-term luxury rental. The property has three bedrooms; one double and two singles with a downstairs bathroom, cosy sitting room, separate dining room and well-appointed contemporary kitchen. Find out more...Enjoy a stay in ourBenbow Pond Holiday CottagesNestled behind Benbow Pond are four luxury holiday cottages with an extensive range of outdoor pursuits and leisure activities on the doorstep, along with a myriad of footpaths. Perfect for couples and families, the Cottages lend themselves to a long weekend away, allowing guests to escape the hustle and bustle of city life, or a longer stay... Find out more...Not just for golfersThe Golf Lodge & The BothyProviding Bed and Breakfast, ensuites bedrooms at The Lodge are open to everyone, not just golfers. Overlooking the Polo Grounds and Cowdray Ruins and located opposite Cowdray Golf Club, ideal for those who wish to tee-off at sunrise or catch some polo during the summer months. Sleeps up to 16 guests. Find out more...16,000-acres ofThe Cowdray EstateOur team strive to create a symbiotic existence between the old and the new through good stewardship of the landscape, holistic management of the land, thorough understanding of wildlife, landscape conservation and a strong estate community. Find out more... Enjoy the taste of local produceEat at CowdrayEnjoy home-cooked food at ourFarm Shop CaféOur Farm Shop Café is the perfect location to enjoy our home cooked food. We take great care sourcing local ingredients wherever possible and all food, including our delicious cakes, is made on-site. View Menu & Opening TimesOn the goCowdray ExpressSituated across from Cowdray Farm Shop & Café, Cowdray Express suits those who are ‘on the go’, serving a variety of healthy snacks and refreshments. (Hours may vary depending upon seasons.)Cowdray Park Golf ClubThe ClubhouseLocated at the Clubhouse, Cowdray Golf’s The Clubhouse Restaurant is open to all, not just golfers. Breakfast, lunch and brunch are available seven days a week. During the summer months, we recommend enjoying refreshments on the terrace with beautiful views across to Cowdray Ruins and the South Downs. When the temperature drops, why not join us for a roast? Find out more Weddings, Celebrations, Corporate Plan your Cowdray Event Cowdray houseAvailable for exclusive use, and offering complete privacy, Cowdray House is a stunning location for a range of events including weddings, celebrations and corporates. Cowdray House lends itself to large parties as well. Find Out More The Walled GardenThe historic and charming venue, which is located next to Cowdray Ruins, offers a diverse setting for any occasion and is available for a wide variety of events including weddings, ceremonies, birthdays and celebrations. Find Out MoreExhilaration awaits atA great Sporting estateThe home of British PoloCowdray Park Polo ClubThe game of Polo has been played at Cowdray for over a century. Over 400 matches are played each season, with the highlight being the British Open Polo Championship for the Cowdray Gold Cup. Spectators are welcome throughout the polo season which runs from April until September. Find out more...Year-round golfing atCowdray GolfA true Sussex sporting institution. Golf has been played on our scenic Cowdray Golf course for well over a century. Its combination of sandy soil with the latest in irrigation and sprinkler systems means superb conditions can be maintained throughout the year, making it a true all year round course. Find out more...Expert tuitionShooting at HownhallNestled in the woods just north of Midhurst, Hownhall Shooting is an award-winning school that delivers professional shooting experiences to the complete novice up to the accomplished shot. Find out more...The iconicCocking ShootThe iconic Cocking Shoot has been included in the country’s top 10 shoots and is renowned for producing high birds in the spectacular setting of the South Downs. Find out more...a diverse portfolio of filming locationsFilming at CowdrayCowdray welcomes film crews of all sizes all year round to the Estate, with a dedicated and experienced in-house team to help enable and facilitate all shoots with ease. We have a huge number of private locations many of which have easy access for large vehicles, as well as space for unit bases on site. Find out more Relax & unwind Wellbeing at Cowdray A haven of tranquility atCowdray HallCowdray Hall hosts inspirational workshops and events, weekly classes and one-to-one therapy sessions focussing on all areas of self-development. Classes include Yoga, Pilates and Mindfulness. Find out more... In expert hands at ourTherapy RoomsSituated next to Cowdray Hall, our beautifully appointed Therapy Rooms provide an accessible but private space for therapists, consultants and their clients with Shiatsu, Osteopathy, Nutritional Therapy and more. Find out more...Step back in time atCowdray HeritageCowdray Heritage is one of England’s most important early Tudor houses. Visited by King Henry VIII and Queen Elizabeth I this impressive Tudor house was partially destroyed by fire in 1793. One tower remained intact and following a recent refurbishment is now a venue for art workshops, specialising in the Renaissance Period. Find out more... Find Your Way Around Cowdray Click/Tap on the icons to view more information Fine food and produce in theFarm ShopCowdray Farm Shop has a traditional butchery, well-stocked deli and a wide range of carefully selected artisan products which come from local suppliers as well as other producers further afield.Year-round golfing atCowdray GolfGolf has been played on Cowdray’s scenic course for well over a century.Its combination of sandy soil with the latest in irrigation and sprinkler systems, means superb conditions can be maintained even in wet weather.Find out moreDelicious food at ourFarm Shop CaféOur Café is the perfect location to enjoy our home cooked food. We take great care sourcing local ingredients wherever possible and all food, including our cakes, is made on-site.Find out moreEnjoy a restful stay at Benbow PondHoliday CottagesOur delightful cottages have undergone a major refurbishment and offer improved facilities alongside beautiful décor and furnishingsFind out moreFind inspiration atCowdray HallA venue for inspirational workshops, events and weekly classes focusing on all areas of self-development.Find out moreThe Home of British PoloCowdray Park Polo ClubThe game of Polo has been played at Cowdray for over a century. Today, approximately 400 matches are played each season, with the highlight being the King Power Gold Cup for the British Open Championships. Spectators are welcome throughout the polo season which runs from April until September.Find out moreExplore history atCowdray HeritageCowdray Heritage is one of England’s most important early Tudor houses. It was partially destroyed by fire in 1793. One tower remained intact and following a recent refurbishment is now a venue for Renaissance art workshops.Find out moreA space for healing at ourTherapy RoomsSituated next to Cowdray Hall, our new beautifully appointed Therapy Rooms provide an accessible but private space for therapists, consultants and their clients with Shiatsu, Osteopathy, Nutritional Therapy and more.Find out moreLearn to play polo atCowdray Park Polo AcademyCowdray Park Polo Academy offers private lessons, group lessons, corporate days and instructional chukkas for both the experienced and novice rider.Find out moreSustainable ForestryWoodsCowdray has three times the national average of woodland with over 36% of the 16,000 acre Estate dedicated to growing mainly conifers, broadleaf high forest and chestnut coppice. Our objective is to produce high quality timber with a well-managed look whilst also providing benefits for wildlife.Find out moreCowdray HomeFarmMoor Farm is the hub of Cowdray's farming activity and from where the Estate's dairy, arable and livestock operations are managed. The Farm's policy is to operate in a sustainable and environmentally responsible manner.Find out moreEnjoy country pursuitsClay Pigeon ShootingAvailable for groups and corporate events as well as individual lessons. The award-winning shooting school caters from the complete novice to the accomplished shot.Find out moreThe River Rother awaitsFly FishingCowdray has excellent Fly Fishing opportunities on the River Rother, from a day pass to season pass for individuals to small fishing groups including corporate fishing days.Find out moreExclusive venue for hireCowdray HouseCowdray House is available for exclusive-use hire for a wide range of events including country house parties, weddings, corporate retreats, celebrations and film shoots.Find out moreHost your celebration atThe Walled GardenThe Walled Garden at Cowdray, is a historic and charming setting for weddings, celebrations and corporate events. Surrounded by beautiful, private gardens set against the stunning backdrop of Cowdray Ruins.Find out more"
