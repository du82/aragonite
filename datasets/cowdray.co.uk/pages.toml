full_description = "Costers Lodge CHECK IN/OUT MONDAYS, WEDNESDAYS & FRIDAYS BOOK NOW Contact Us Scroll for moreCosters LodgePart of the Cowdray CollectionSleeps 6Costers Lodge can be found tucked a stone’s throw away from Cowdray House, making it an ideal location for a secluded countryside break close to local amenities, countryside walks and fantastic pubs. Just a five-minute drive from the centre of Midhurst, and with Cowdray Farm Shop & Café in walking distance along public footpaths, Costers sleeps six guests in three individually decorated bedrooms, each with their own en-suite bathroom.Downstairs guests will find tall ceilings and bright open spaces, a modern open-plan kitchen diner, and an adjoining living room, with double doors onto the garden and patio dining area. Available as a short-term luxury getaway, Costers is a warm and welcoming 100-year-old sandstone cottage surrounded by fields with no other properties overlooking.With its own private garden and ample off-road parking, Costers Lodge provides plenty of space to entertain, seating six comfortably for dinner inside, or outside on the patio terrace in the summer. Sure to be a favourite with couples, families and groups of friends, Costers Lodge is an ideal retreat from a fast-paced life, or as a base to explore all that Cowdray and the South Down National Park has to offer. Up to two dogs welcome. Book your self catering holiday stay at CowdrayPlease note that our holiday cottage check in / check out days are Mondays, Wednesdays and Fridays.No Availability? View and book all self catering holiday cottagesIf you have a specific date you would like us to look at, please call our reservation team on +44 (0)1730 814522 or email [email protected]. Your booking calendar is loading and will appear here very soon. What's IncludedSecret Linen Store bed linenCowdray Farm Shop welcome hamperFreeview and wifiIla bathroom productsTowels and bathrobesHairdryerIron and ironing boardAmple off-street parking and a