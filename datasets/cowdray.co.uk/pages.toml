-road trails; and there is no better way to enjoy the scenic landscape than on two wheels. Find out more <img width="600" height="320" src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2022/01/Screenshot-2022-01-05-at-15.32.07.png?resize=600%2C320&amp;ssl=1" class="attachment-news_thumb size-news_thumb" alt="" decoding="async" srcset="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2022/01/Screenshot-2022-01-05-at-15.32.07.png?resize=260%2C140&amp;ssl=1 260w, https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2022/01/Screenshot-2022-01-05-at-15.32.07.png?resize=600%2C320&amp;ssl=1 600w, https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2022/01/Screenshot-2022-01-05-at-15.32.07.png?zoom=2&amp;resize=600%2C320&amp;ssl=1 1200w" sizes="(max-width: 600px) 100vw, 600px" data-attachment-id="43115" data-permalink="https://www.cowdray.co.uk/gundog-training/screenshot-2022-01-05-at-15-32-07/" data-orig-file="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2022/01/Screenshot-2022-01-05-at-15.32.07.png?fit=1558%2C1178&amp;ssl=1" data-orig-size="1558,1178" data-comments-opened="0" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="Screenshot 2022-01-05 at 15.32.07" data-image-description="" data-image-caption="" data-medium-file="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2022/01/Screenshot-2022-01-05-at-15.32.07.png?fit=300%2C227&amp;ssl=1" data-large-file="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2022/01/Screenshot-2022-01-05-at-15.32.07.png?fit=945%2C714&amp;ssl=1"/> Gundog trainingWhether you’re a beginner starting out with your first gundog, an experienced handler wanting to improve your performance at field trials or you’re wanting to improve your picking-up experience at your local shoot, Jason Mayhew can provide the training you and your dog need. Find out more <img width="600" height="320" src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2019/12/Polo-Academy-KJ2-scaled.jpg?resize=600%2C320&amp;ssl=1" class="attachment-news_thumb size-news_thumb" alt="Cowdray Experiences" decoding="async" srcset="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2019/12/Polo-Academy-KJ2-scaled.jpg?resize=260%2C140&amp;ssl=1 260w, https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2019/12/Polo-Academy-KJ2-scaled.jpg?resize=600%2C320&amp;ssl=1 600w, https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2019/12/Polo-Academy-KJ2-scaled.jpg?zoom=2&amp;resize=600%2C320&amp;ssl=1 1200w" sizes="(max-width: 600px) 100vw, 600px" data-attachment-id="28582" data-permalink="https://www.cowdray.co.uk/sport/cowdray-polo-academy/learning-to-play/behind-the-scenes-of-cowdray-estate-polo-training-ground-and-farm-15/" data-orig-file="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2019/12/Polo-Academy-KJ2-scaled.jpg?fit=1600%2C1065&amp;ssl=1" data-orig-size="1600,1065" data-comments-opened="0" data-image-meta="{&quot;aperture&quot;:&quot;4.5&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;NIKON D3S&quot;,&quot;caption&quot;:&quot;Behind the scenes of Cowdray Estate Polo training ground and farm&quot;,&quot;created_timestamp&quot;:&quot;1434617574&quot;,&quot;copyright&quot;:&quot;No usage without written prior&quot;,&quot;focal_length&quot;:&quot;200&quot;,&quot;iso&quot;:&quot;500&quot;,&quot;shutter_speed&quot;:&quot;0.0002&quot;,&quot;title&quot;:&quot;Behind the scenes of Cowdray Estate Polo training ground and farm&quot;,&quot;orientation&quot;:&quot;1&quot;}" data-image-title="Behind the scenes of Cowdray Estate Polo training ground and farm" data-image-description="" data-image-caption="&lt;