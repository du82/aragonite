full_description = '''Cowdray Farm Shop Scroll for moreLocated at the heart of The Estate is the award-winning Cowdray Farm Shop.With a passion for locally sourced produce, we pride ourselves on our varied selection of the freshest seasonal fruit and vegetables and the extensive range of meats available from our butchery. You will be spoilt for choice with Cowdray products, with delicious cheeses from our Deli, freshly baked breads, cakes and pastries made by our team of in-house chefs and store cupboard choices handpicked by our knowledgeable team.Useful LinksOpening HoursCowdray Farm Shop Online //<![CDATA[ window.__mirage2 = {petok:"v_uPosg7U0MI6HWgVYcr5.v6KwxxpeU95VA0Axc9U1k-1800-0.0.1.1"}; //]]> <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2024/11/Cowdray-Christmas-Market-2024.jpg?resize=600%2C600&ssl=1" alt="Late Night Shopping">Farm ShopLate Night ShoppingCowdray Farm Shop, Butchery, and Lifestyle will be staying open until 8pm on select Thursday nights during December to give our customers the opportunity to pick up their festive essentials and treats in the lead up to Christmas Day.Available for collection from Cowdray Farm ShopLittle Fish Sushi in the SticksLittle Fish are on a mission to bring exceptional sushi and pan-Asian cuisine to food lovers in rural communities. Crafted by Michelin-trained, multi-award-winning chef, Neil Witney - the mastermind behind some of the UK’s top pan-Asian restaurants,Order Today <img src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2023/08/Sushi-and-Pizza-24-scaled.jpg?resize=600%2C600&ssl=1" alt="Little Fish Sushi in the Sticks"> Available from Cowdray Farm Shop Guild of Fine Food Great Taste Award Winners <img width="600" height="320" src="https://i0.wp.com/www.cowdray.co.uk/wp-content/uploads/2022/08/quiche-lorraine-1.jpg?resize=600%2C320&amp;ssl=1" class="attachment-news_thumb size-news_thumb" alt="" decoding="async" fetchpriority="high" srcset="https://i0.wp.com/www.cowdray.co.uk/wp-con