["https://cpdinosaurs.org/index.php/blog/post/highlights-of-2023"]
title = "Highlights of 2023"
full_description = "We collaborated with Friends of CP Park (FoCPP) and the CP Museum to produce ‘Saturday at the Museum’ on 14th January. This was a huge success, with well over 350 visitors during the day, mainly from the local community – thank you to GoodGym volunteers who delivered so many promotional flyers. FCPD friend and artist David Vallade led creative activities with the public related to the Dinosaurs with help from volunteers Amy, Maggie, Cass, Andy, Sue, Dustin, Ross, Alexandra, Heather & Chris. We again collaborated with FoCPP and the Museum for a free ‘Crystal Palace Park Quiz’ night kindly hosted by the Gipsy Hill Taproom on 8th March. It was a great success and the Taproom’s biggest ever quiz night with 92 attendees. FCPD volunteers Colette, Geraldine, Maggie, Ross, Sarah B & Alexandra supported Sarah J and David Vallade to deliver the quiz activities, including a bonus round in which teams created their own CP Dinosaurs from plasticine. We provided guided walks throughout the summer with the help of stalwart FCPD volunteers Maggie, Sue, Andy, Geraldine, Amy, Sarah B, Meg, Alexandra, Steve, Leah and Colette. The most recent date in October also included a trail designed by Dodo and Dinosaur - volunteers gave out 60 trail maps to park attendees, with successful completion of the trail earning a sticker prize. The Park hosted the London Festival of Architecture (LFA) – Swing Bridge event on 11th June. This event reunited the team responsible for reinstating the Swing Bridge and included presentations from Tonkin Liu (architects), Arup (engineers) and Cake Industries (fabricators, constructors) as well as FCPD. The bridge has now received 12 awards – including from the Civic Trust, and two from RIBA – which we are so proud of. On 2nd July FCPD hosted a dual event to unveil our new Palaeotherium magnum sculpture and launch the guidesheets from our Beyond the Dinosaurs project which was really well attended. The original P. magnum sculpture disappeared in the 1960s and has been lovingly reconstructed by renowned palaeoartist Bob Nicholls, in collaboration with Mark Witton, and FCPD trustees Ellinor Michel and Adrian Lister, and funded by CPP Trust and FCPD."
