["https://cpdinosaurs.org/index.php/visit/statue-details/background"]
title = "Background – information about the Crystal Palace statues"
full_description = "The Victorian Geological Court at Crystal Palace Park does not just feature life-sized reconstructions of extinct creatures. The landscape itself was also carefully designed to show Victorian understandings of Earth’s history, and the geology and mineral resources of the UK. The new science of geology was fascinating for Victorians, changing understandings of the world and providing mineral resources driving the industrial revolution (like coal and metals). It is full of models called ‘Geological Illustrations’ that represent rocks from different sections of British geology. Only a few of the original illustrations remain from the 1850s, most of what you see today are restorations from the early 2000s. It’s tricky to itemise all the geological features in the park, as they also include very small features such as replica fossil ammonites and fossil cycads on Dinosaur island. Indeed we cannot even be sure we have a full inventory of them all. Therefore, depending on definitions, estimates of the number of geological features ranges from ~15-40. The Geological Court designers incorporated geological knowledge into the very fabric of the display, showing how the earth’s history could be divided into periods of time with distinct climates, environments, animals and plants. To organise Earth’s history, 19th century scientists divided it into three large epochs: the Primary, Secondary, and Tertiary (called today ‘Palaeozoic,’ ‘Mesozoic’ and ‘Cenozoic’). As you can see from the map below, these different epochs were represented in the park separated by water, and these divisions provide names for regions of the site, including the “Secondary Island” (with the dinosaur sculptures) and “Tertiary Island” (mammals). The sculptures of extinct animals were arranged in order of geological age across the landscape and were all placed upon geologically appropriate layers of rock (‘strata’) representing where they were found. Other geological features across the park, such as the ‘cliffs’ represented the mineral wealth upon which Britain’s industry was based."
year_published = 2025
clearnet = "https://cpdinosaurs.org/index.php/visit/statue-details/background"
