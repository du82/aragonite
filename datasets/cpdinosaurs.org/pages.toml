["https://cpdinosaurs.org/conservation"]
title = "Conservation work and latest improvements to the Crystal Palace Dinosaurs"
description = "Previous work done and money spent restoring the dinosaurs and latest news stories concerning their conservation."
full_description = "Our primary mission is to improve the conservation and interpretation of the sculptures, geological illustrations and site in Crystal Palace Park. The Crystal Palace Dinosaurs are world famous heritage assets. Dating from the 1850s, they are listed “Grade 1” on Historic England’s National Register of Heritage Monuments. This is their highest rating. Maintaining this display of over 30 large outdoor sculptures and numerous geological formations over several acres of land is an enormous task. In 2020 they were also officially declared ‘At Risk’ by Historic England, making them the highest priority for conservation. We collaborate with the local and historical authorities to get professional work done, engage volunteers, and do outreach on conservation in general. The Dinosaurs are inspiring for everyone to see why historic conservation is needed and how it is done. .embed-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; } .embed-container iframe, .embed-container object, .embed-container embed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; } For conservation professionals, the Canadian Conservation Institute’s framework of ‘Ten Agents of Deterioration’ is a familiar and well-established way of describing risk factors to cultural heritage. We wanted to reach new audiences to give an intuitive sense why conservation is necessary and technically challenging. This paper, written by FCPD Board members, describes our project translating this framework into a short animated film (below) about risks to outdoor sculpture, using the Crystal Palace Dinosaurs to deliver the message in an entertaining, yet accurate and enlightening way. The film is aimed at a broad audience of all ages, even kids. .embed-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; } .embed-container iframe, .embed-container object, .embed-container embed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }"
