["https://cpdinosaurs.org/index.php/visit/statue-details/iguanodon"]
title = "Iguanodon – information about the Crystal Palace statues"
full_description = "The species that the Iguandon statues were based on has since been renamed Mantellodon (meaning ‘Mantell’s tooth’) after the famous scientist Gideon Mantell who described their fossil remains. Mary Ann Mantell (Gideon Mantell’s wife) is generally credited with discovering the first ever remains of iguanodon (fossil teeth) in Cuckfield, Sussex. Lived: Most Iguanodon fossils have been found in southern England but they are also known from mainland Europe. Related, similar species have been found globally. Statues: Two models illustrate the conflicting ideas in the 1850s about how this dinosaur might have stood: one on four legs, like an elephant and the other sprawled like an iguana on the trunk of a cycad, a tropical plant whose fossils have been found near iguanodon remains. Fun facts: The famous Dinner in the Iguanodon was held in the mould for the standing iguanodon sculpture in 1853. The famous Maidstone Slab fossil, preserving one of the most complete finds of Iguanodon, is also known as the ‘Mantell-piece’ after Gideon Mantell who described it. The Crystal Palace statues vs modern scientific reconstructions: Iguanodon was probably the best known dinosaur to science in the mid-nineteenth century, which might explain why this dinosaur was captured in two models rather than just one. Today, it’s hard to say exactly what animals the Crystal Palace models truly represent. Until relatively recently Iguanodon was a wastebasket for iguanodont material from the southern UK and several distinct taxa have now been identified among the British Iguanodon material. Twenty years after the Crystal Palace statues were constructed, new skeleton finds showed that the bones that had been placed as horns on their noses should have been placed on the hand as they are in fact thumb spikes, probably used for defence against predators. At the time the sculptor, Benjamin Waterhouse Hawkins, was probably inspired by the presence of nose horns in many iguana species. Iguanas may have informed the models in other ways too such as the presence of their large conspicuous ‘eardrums’ on the side, dewlaps, the midline body and tail spines, and details of their overall scalation. The beak and blunt claws are deviations from iguanas and were correctly restored for Iguanodon, these presumably being based on lower jaws and digit bones recovered during the early 1800s."
year_published = 2025
clearnet = "https://cpdinosaurs.org/index.php/visit/statue-details/iguanodon"
