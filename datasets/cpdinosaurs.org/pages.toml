title = "Governance information for Friends of Crystal Palace Dinosaurs"
description = "Find the Friends of Crystal Palace Dinosaurs mission statement, equality statement, ethics concerning fundraising, and the FCPD constitution document."
full_description = "Download our latest annual report to find out more about our ongoing activities. You can also view our past annual reports on the Charity Commission website. The Friends of Crystal Palace Dinosaurs aim to create an inclusive environment in which individual differences and the contributions of our trustees and volunteers are recognised and valued. We believe it is important to have a range of diverse viewpoints when making decisions and designing services and activities. Our charity aims are to promote and protect the much-loved sculptures, and we work to ensure our activities are inclusive and that our local outreach programmes engage with communities representative of the diversity within southeast London. We are firmly committed to meeting all expectations under the Equality Act 2010 and other relevant legislation. We commit to treating all people equally, with dignity and respect, irrespective of age, disability, gender reassignment, marriage and civil partnership, pregnancy and maternity, race (including colour, nationality and ethnic or national origin), religion or belief, sex, and sexual orientation. We also recognise that diversity encompasses a wide range of individual differences which may not be protected characteristics under the Equality Act, including but not limited to gender identity, immigration status, mental health, neurodiversity, and socio-economic status."
