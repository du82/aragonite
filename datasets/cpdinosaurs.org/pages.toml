title = "Books and original sources about the Crystal Palace Dinosaurs"
description = "A list of literature for people wanting to learn more about the statues."
full_description = "Many sources mention Crystal Palace Dinosaurs, and some are more useful than others. This list of materials is meant to offer a good start for those wanting to learn a bit more. First and foremost, in 2022 our very own Chair of Trustees, Dr Ellinor Michel, and palaeontological artist and researcher Dr Mark Witton published the first new book on the Crystal Palace Dinosaurs in over a quarter of a century. It presents fascinating new research on the history of the sculptures, uncovering new information, insights and even new sculptures! You can find more information, including on how to buy it, here."
