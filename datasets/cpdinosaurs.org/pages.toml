["https://cpdinosaurs.org/index.php/blog/post/national-lottery-heritage-fund"]
title = "National Lottery Heritage Fund success!"
full_description = "Friends of Crystal Palace Dinosaurs is delighted at the recent announcement by the London Borough of Bromley of a successful National Lottery Heritage Funding bid to kickstart a restoration project for the ‘lower Paxton axis’ at Crystal Palace Park. This will include funding to conserve the much-loved Crystal Palace Dinosaur sculptures and restore the surrounding landscape and waterways. We have campaigned intensively for nearly a decade to maintain the high profile of the Dinosaurs and ensure they remain a priority for conservation funding as an historical and community asset that must be passed on to future generations. We are therefore thrilled that this grant has highlighted the Grade 1 listed Dinosaurs as a unique but vulnerable historical asset that requires significant long-term investment. We look forward to working closely with the London Borough of Bromley, Crystal Palace Park Trust, Historic England and other partners to identify conservation priorities at the site, and secure the necessary funding to deliver high-quality restoration of the Geological Court and wider landscape. We also welcome the grant’s proposal to redevelop the Information Centre. We will encourage the project to maximise this unique opportunity to incorporate an exciting new interpretation, learning and engagement hub to help us share the fascinating history and relevance of the Crystal Palace Dinosaurs with the local community and be a destination that draws visitors from far and wide. Ellinor Michel, Chair of Crystal Palace Dinosaurs said: “It is profoundly gratifying to see that the collective voices of CP Dinosaur fans have been heard and the major organisational stakeholders are now all working together to get things happening for the Geological Court. The next few years look like busy, happy times!” Eilish McGuinness, Chief Executive, The National Lottery Heritage Fund, said: “Crystal Palace Park embodies the joy of heritage: from its nature walks and unique Dinosaurs to the kaleidoscope of sporting and cultural activities held in its magnificent grounds. It’s as important to local communities as its history is significant internationally. We’re delighted that thanks to players of the National Lottery, we can save much loved heritage like the Crystal Palace Park all over the UK and create benefits for people, places and our natural environment. In 1852, Crystal Palace Park was designed to impress, educate, entertain and inspire. Our funding will help ensure that it continues to do just that for generations to come.”"
year_published = 2025
