["https://cpdinosaurs.org/index.php/visit/statue-details/megatherium"]
title = "Megatherium – information about the Crystal Palace statues"
full_description = "The giant ground sloth probably became extinct due to a combination of human hunting and changes in climate at the end of the last Ice Age. Fun fact: The Crystal Palace Megatherium statue once lost its left arm after the tree supporting the model grew too wide and the limb snapped off. The Crystal Palace statues vs modern scientific reconstructions: Megatherium only became extinct relatively recently so intact skeletons were available to base the reconstructions on, including fossils collected by Charles Darwin during his famous voyage aboard the HMS Beagle. The research history of Megatherium americanum began nearly six decades before the sculptor, Benjamin Waterhouse Hawkins, commenced work on his model. Yet despite this long research lead, Hawkins’ standing, tree-grasping Megatherium was ultra-progressive for the time, one of the first depictions in a pose that chimes with our modern understanding of giant sloth habits, and actually pre-dating publication of ideas that it was capable of such feats. Prior to this it had been mostly depicted as a flat-footed, trunked quadruped. Studies on another giant sloth, Mylodon darwinii, helped elucidate many aspects of lifestyle and anatomy that would inform Hawkins’ model. Mylodon, for instance, demonstrated that giant sloths walked on the sides of their feet and the shorter, clawless fingers of their hands. Exactly how they lived remained a matter of conjecture however, and ideas such as burrowing and tree-climbing were still being discussed into the 1850s. The Crystal Palace Megatherium is of further note for being one of the oldest restorations of a ground sloth beyond simply a skeleton and is still well regarded as a portrayal of ground sloth form. The model correctly depicts its large, muscular proportions, long shaggy hair, slender shoulders sloping down to wide pelvis, inturned feet, standing upright on its ‘tripod’ of two hind legs and tail, and arms grasping the tree to access vegetation or push it over. Note that it would probably still have walked on four legs, if not all the time."
year_published = 2025
clearnet = "https://cpdinosaurs.org/index.php/visit/statue-details/megatherium"
