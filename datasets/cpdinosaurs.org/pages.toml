title = "Privacy policy statement"
description = "Privacy policy statement for the Friends of Crystal Palace Dinosaurs website."
full_description = "Friends of Crystal Palace Dinosaurs is a registered charity (no. 1165231) in the United Kingdom. Our registered business address is 88B Thicket Road, London SE20 8DR. This privacy notice has been designed to inform you of what kind of data we collect, and for what purpose, and to inform you of how you can manage what data we keep and use. We collect information from you when you sign up to our mailing list or contact us through the website or social media channels. We also collect information if you register to attend one of our events, or sign up to a donation. The personal information we collect may include your name, address and email address. If you make a donation on our website, or buy a ticket to an event, we do not collect your financial information. Our online payment transactions are processed by our third-party payment processor Paypal, which specialises in the secure online capture and processing of credit/debit card transactions. If you have any questions regarding the processing of your financial information please contact us. We review our retention periods for personal information on a regular basis. We are legally required to hold some types of information to fulfil our statutory obligations. We will hold your personal information on our systems for as long as is necessary for the relevant activity, or as long as is set out in any relevant contract you hold with us. We will not share your information with any third party, for marketing purposes or otherwise, unless required to do so by law. Our mailings and payment processing mechanisms are all in house and as such your information will not be shared with any external members (except online card payments which are collected through Paypal, as mentioned above). You can elect not to receive communication from us at any time. If you do not want to receive direct marketing communications from us about the work we do to promote, inform on, and conserve the Crystal Palace Dinosaur statues, then you can do so by ticking the relevant boxes on the form on which we collect your information."
