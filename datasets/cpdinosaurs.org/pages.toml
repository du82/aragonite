["https://cpdinosaurs.org/projects/palaeo-planting"]
title = "Palaeo Planting Project – horticultural work at Crystal Palace Park"
description = "About our project to restore the living horticulture of the plants around the Crystal Palace Dinosaurs that would have existed 400 million years ago."
full_description = "The famous Crystal Palace Dinosaur landscapes are missing the plants that tell the full story of the lost worlds. You can join Friends of Crystal Palace Dinosaurs (FCPD) in bringing the story of evolution of plants back to life with a unique horticultural project. In 2018 we are organising hands-on planting work with a team of volunteers on the Dinosaur Islands, interesting talks throughout the summer and a vibrant ‘Dino Days’ event in September. The Crystal Palace Park site was the world’s first large-scale science ‘edu-tainment’. Life-sized reconstructions of extinct animals were set out in a time series that covered 400 million years and surrounded by palaeo-plantings that aimed to be appropriate to different geologic ages over deep time. This living horticultural feature has largely been lost, so we aim restore it with the help of the community. The Dinosaurs are Grade 1 listed monuments and are the most visited attraction in the Park, drawing half of its 1.8 million annual visitors. Our volunteers will contribute to long-term maintenance both directly and through friendly pressure on the park’s owners and managers. The Dinosaur Days will amplify and expand the message from the landscape project, weaving plants in to the big story of how science uncovers evidence for ecosystems in palaeo-history. During the Dinosaur Days there will be a range of events including expert talks and panel discussions, spectacular street theatre, participatory family events and behind-the-scenes conservation tours. .embed-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; } .embed-container iframe, .embed-container object, .embed-container embed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; } Bring your enthusiasm and skills of all kinds, from gardening to outreach, for our monthly working meetings. We are particularly looking for committed people who want to contribute to the long-term sustainability of the project. The palaeo plants will need friends into the future!"
year_published = 2025
