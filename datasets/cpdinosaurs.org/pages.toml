["https://cpdinosaurs.org/projects/digital-dinosaur-archive"]
title = "Digital Archive of the Crystal Palace Dinosaurs"
full_description = "The sculptures that make up the Crystal Palace Dinosaurs are over 170 years old and have suffered significant damage and subsequent rounds of conservation and maintenance over the years. As outdoor sculptures they are exposed to the elements on a daily basis, making their long-term conservation an ongoing challenge. It’s vital to be able to restore the sculptures as faithfully as possible in order to conserve their historical significance. For this, we need a reliable record of what they look like to be able to refer to and monitor their conservation status. Since 2018, Rhys Griffin (a digital professional and animator) and Anthony Lewis (film maker and FCPD board member) have volunteered their skills to 3D scan the sculptures using state-of-the-art techniques. This careful digital documentation has allowed us to establish ultra-high resolution archival images for a number of sculptures for future conservation and condition monitoring. We have also since partnered with Historic England to complete scanning of 29 sculptures at the Geological Court, giving us the most complete physical documentation of the sculptures that we have ever had. This will allow conservators to benchmark the condition of the sculptures and focus and prioritise future efforts for restoration and maintenance. It has been fascinating to see the models from different angles that have not previously been shown and has highlighted many previously unappreciated aspects and details of the sculptures that weren’t easily visible. The digital assets can also be used for art engagement, 3D printing and animation and we have collaborated with artists such as Emma Jude in public art classes based on the 3D images. In the first conservation application of the 3D archive we showed stresses and deep cracks in the Megalosaurus sculpture before the 2020 collapse, and the exposed support armature after the event. We made a film to show our new digital restoration of before and after the damage and how conservation work can be undertaken based on such scans. Dinosaurs of the Prime is a piece of music composed for the film."
year_published = 2025
clearnet = "https://cpdinosaurs.org/projects/digital-dinosaur-archive"
