["https://cpdinosaurs.org/blog/post/how-were-the-crystal-palace-dinosaurs-made"]
title = "How were the Crystal Palace Dinosaurs made?"
full_description = "Benjamin Waterhouse Hawkins’s magnificent creatures were clearly a time consuming and labour intensive project, but it’s not obvious exactly how they were made by looking at them. We’ve been lucky enough to get up close to the dinosaurs and you can actually look inside several of them to see that they’re made of a lot of different materials you might associate more with building houses than making sculptures. 600 bricks 650 half round drain tiles 900 plain tiles 38 casks of cement 90 casks of broken stone 100 feet of iron hooping 20 feet of 1” square bar Waterhouse Hawkins began the project with a period of research. He examined fossils and other material at the British Museum, the Royal College of Surgeons and the Geological Society and started to create a series of detailed sketches. From these he then made a series of clay models around 1/6th or 1/12thof the final size to explore how to give the forms a realistic look. Although he is supposed to have discussed these with the anatomist and palaeontologist Sir Richard Owen to ensure they were accurate according to theories and common knowledge of the time, it is uncertain how much input Owen had in developing the models. We do know that Waterhouse Hawkins was regarded as the best natural history illustrator at the time, and an expert at bringing animals ‘to life’ from limited information. It is certain that his interpretation and artistry was the major determinant in the forms of the Crystal Palace Dinosaurs. Once alterations had been made and agreed, work on the final models could begin. This long process started with the creation of full sized clay models with internal wooden supports. Waterhouse Hawkins had a team of workmen who would make the structure and shape of each animal before he himself added the final details. Once he was happy with each creature, the team were then ready to create the mould from which the final external details would be cast. Etching showing the mould being created from the full size clay model of the iguanodon from Illustrated London News, Dec 31 1853"
year_published = 2025
clearnet = "https://cpdinosaurs.org/blog/post/how-were-the-crystal-palace-dinosaurs-made"
