["https://cpdinosaurs.org/about/trustees-board"]
title = "Management Board and Trustees of Friends of Crystal Palace Dinosaurs"
full_description = "Friends also operates a management board. This meets meets on a regular basis to co-ordinate our many projects and our month-to-month activities. We are all volunteers. I am a taxonomist and evolutionary biologist at the Natural History Museum. My research focus is on African freshwaters, especially the species radiations in ancient lakes of the East African Rift. I’ve always had a strong interest in the history and philosophy of science; that, combined with my commitment to making a difference to my local community, made it pretty clear that the Crystal Palace Dinosaurs would become a focus for my efforts. The ‘Dinos’ are stellar for a range of reasons – their construction heralded a major paradigm shift in the history of science, as they were the first life-sized reconstructions of extinct animals; they were ground-breaking for the history of public engagement, as the first big scale edu-tainment on natural history; and they are also just incredibly beautiful and stunningly cool as sculptures. When you walk among them you feel like you are living ‘Where the Wild Things Are’. By preserving these Grade 1 heritage assets and building an educational engagement programme around them, we hope to convey excitement about key ideas in natural science for generations to come. I am a palaeontologist specialising in the fossil mammals of the Quaternary ice ages. I taught palaeontology and evolutionary biology at UCL for many years before joining the Natural History Museum in 2007. For several years I have researched the fossil mammals discovered by Darwin in South America, that were subsequently studied and named by Richard Owen in the 1830s-1840s. This has led to a fascination with this critical period in the history of palaeontology and Owen’s part it in, a period preserved in time, as it were, in the Crystal Palace Dinosaurs. As a mammal specialist I am also at pains to point out that some of the statues are only honorary ‘dinosaurs’, including the giant sloth Megatherium, with Owen’s interpretation of it (then new, but still considered valid) as supported on a tripod of its hind legs and tail; and the ‘Irish Elk’ Megaloceros, with its magnificent antlers, which has special meaning for me as it was the subject of my PhD work. These treasures have to preserved – and that is our commitment as the Friends of Crystal Palace Dinosaurs."
year_published = 2025
clearnet = "https://cpdinosaurs.org/about/trustees-board"
