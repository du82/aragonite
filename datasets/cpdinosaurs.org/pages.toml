["https://cpdinosaurs.org/visit/statue-details/megaloceros"]
title = "Megaloceros – information about the Crystal Palace statues"
full_description = "Visitors to Crystal Palace would have had this species presented to them under the anatomist Richard Owen’s 1844 name, Cervus (Megaceros) hibernicus. The nomenclatural history of Megaloceros is confused by several names being coined for this species by authors in the 18th and 19th centuries. However, it is now recognised as one species, Megaloceros giganteus. Common name: Giant deer, Irish elk (many of the best preserved specimens have come from lakes and peat bogs in Ireland). The giant deer survived until as recently as a few thousand years ago. Current evidence suggests it started to disappear in western Europe due to deteriorating climate at the end of the Ice Age from ca. 13,000 years ago, and finally became extinct from eastern Europe and Siberia following the spread of closed forests after the onset of the warmer Holocene Epoch ca. 11,500 years ago. However, the expansion of human populations in Eurasia may also have had a role in its disappearance. Size: Megaloceros giganteus, one of the largest deer known to have existed, stood up to 2 metres at the shoulder with antlers up to 3.5 metres wide. Statues: Family of two standing stags and a reclining doe. The small ‘fawn’ that sits among the Megaloceros is now known to be a mis-identified specimen of Anoplotherium gracilis. Fun fact: One of the stags originally had actual fossil antlers but they had to be replaced when the statue couldn’t support them. The Crystal Palace statues vs modern scientific reconstructions: The Megaloceros family are probably the most accurate of all the statues. As it became extinct relatively recently, lots of intact fossil skeletons (discovered as early as the 1600s and described by the 1800s) were available to base the reconstructions on. They could also be modelled on living deer species; whilst some of the earliest interpretations of the Megaloceros were as a moose-like cervid, its closest living relative is actually the fallow deer which possesses similar, albeit much smaller, flattened (palmate) antlers."
year_published = 2025
clearnet = "https://cpdinosaurs.org/visit/statue-details/megaloceros"
