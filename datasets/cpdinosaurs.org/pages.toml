["https://cpdinosaurs.org/projects/the-art-and-science-crystal-palace-dinosaurs"]
title = "The Art and Science of the Crystal Palace Dinosaurs Book"
full_description = "We are delighted to present The Art and Science of the Crystal Palace Dinosaurs, written by palaeontological artist and researcher at the University of Portsmouth, Mark Witton, and evolutionary biologist at the Natural History Museum London and Chair of Friends of Crystal Palace Dinosaurs, Ellinor Michel. This is the first new book on the site in over a quarter of a century and presents the most in-depth research this globally significant historic site has ever had, bringing together new archival sources to synthesise, re-analyse and re-compile our understanding of how the Geological Court came to be. The book, which is published by The Crowood Press, includes hundreds of historic and modern photos and original paintings that offer a detailed study of the art and science behind each sculpture, and covers: Using new archive sources, the authors have revealed how grand the site was in its heyday before almost 20 per cent of the original constructed animal sculptures went missing in following decades, mostly under unknown circumstances. In addition, 14 planned extinct animal sculptures were never made due to funding restrictions. Several mysteries about how the non-dinosaur animal models were manufactured have also been answered. Using new analysis of historic images, the authors discovered that the smaller sculptures were probably built indoors and moved around with carts, sometimes in pieces, to be assembled on site. The largest models, including the dinosaurs, were assembled in place, under tents to protect them from poor weather. Evidence for numerous missing models at the world-famous Crystal Palace Dinosaurs and re-identification of a sculpture as one of the park’s “lost species” are also revealed in the new book. The book’s co-author, Dr Mark Witton, said: “We’ve uncovered a lot of new insights into the Dinosaurs and their park home in this project, but the evidence for so many lost models blew us away. They weren’t small, obscure sculptures either, but included pony-sized, tapir-like Palaeotherium magnum and a horse-sized female Megaloceros. More amazingly, we found lots of evidence for a hitherto overlooked species, “Anoplotherium gracile”, which we call Xiphodon gracilis today."
year_published = 2025
clearnet = "https://cpdinosaurs.org/projects/the-art-and-science-crystal-palace-dinosaurs"
