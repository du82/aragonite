["https://cpdinosaurs.org/about/past-trustees-board"]
title = "Past trustees and board members of Friends of Crystal Palace Dinosaurs"
full_description = "Our past board members and project partners have contributed significantly to the success of FCPD. Thanks to each and every one for their input! I was formerly project director of Jurassica, an attempt to recreate a vast immersive Mesozoic environment under a huge glass roof designed by Renzo Piano, aiming to engage the public with deep time and the big ideas of science past and present. I live in a house full of dinosaurs and rocks and wish I had been a geologist. Instead, I am a cultural sector professional specialising in project management, business planning, and impact evaluation. I am also a doctoral researcher at Bournemouth University and am interested in public engagement in museums. I’ve lived in Crystal Palace for nearly 14 years. I have a passionate interest in history and love walking and spending time outdoors, so it is perhaps not surprising that I loved the Dinosaurs from the first time I saw them. I’m fascinated by the history of the sculptures and how they represent a particular moment in the history of science, but perhaps more so I love the way that they’ve come to represent our local community – a symbol of our past (the Crystal Palace itself) – our present and our future (I love all the kids running around, roaring and telling people all about them!) They can only be part of the future if we look after them now, though, which is why I volunteer with FCPD – we need to make sure that the Dinosaurs survive the next 170 years! Dinosaurs dominated my childhood reading and viewing habits – from the creatures of Conan Doyle’s Lost World and Edgar Rice Burroughs Pellucidar/At the Earth’s Core, to the Savage Land of Marvel Comic’s Ka-Za and the wonderful stop-frame animated creations of Ray Harryhausen (The Valley Of Gwangi left an indelible mark with its mind-blowing combination of jerk-motion Triceratops and live action cowboys…). They fed endlessly into my imagination and stoked my creative appetite for realising the impossible… so there’s a nice sense of completion in that my most recent art project – Ghosts of Gone Birds – set about the task of breathing life back into all the extinct bird species we have lost over the last 250 years through the imaginative power of painters, sculptors, poets and writers. Art vs. Extinction seems a fairly worthy fight to undertake. And when I’m not curating the resurrection of Laughing Owls and Red-Moustached Fruit Doves, I like to dedicate my creative energies to any other cause-related communications project that seems to challenge the usual way of the world – like staging music festivals inside book stores, opening up empty art galleries or reinventing Peanuts for the C21st."
year_published = 2025
