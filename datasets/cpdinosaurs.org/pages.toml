["https://cpdinosaurs.org/visit/what-are-crystal-palace-dinosaurs"]
title = "What are the ‘Crystal Palace Dinosaurs’?"
description = "A guide to the history of the Crystal Palace Dinosaurs – who built them and what for."
full_description = "The term “Dinosaurs” actually refers to the sum total of the approximately 30 palaeontological statues, five geological displays, and related landscaping in the vicinity of the tidal lake in Crystal Palace Park. Of the 30+ statues, only four represent dinosaurs in the strict, technical zoological sense of the word (the two Iguanodon, the Hylaeosaurus and the Megalosaurus). The statues also include plesiosaurs and icthyosaurs discovered by Mary Anning in Lyme Regis, as well as pterodactyls, crocodilians, amphibians and mammals, such as a South American Megatherium (giant ground sloth) brought back to Britain by Charles Darwin on his voyage on HMS Beagle. This section of the park was constructed in 1853-1855 and has remained largely in the places we find them today. The statues represent the first ever attempt anywhere in the world to model extinct animals as full-scale, three-dimensional, active creatures from fossil remains. The sculptor, Benjamin Waterhouse Hawkins, was a natural history illustrator and sculptor of international reputation. His work combined the pursuit of technical accuracy and animate expression. His sculptures were set in a landscape designed by Joseph Paxton that also included hillside illustrations of economic geology created by Professor David Ansted. Queen Victoria and Prince Albert were fascinated by the dinosaur displays in Crystal Palace, and they visited the site several times. View of “Secondary Island” in Crystal Palace Park, including “Iguanodon (lower left), Hylaeosaurus (upper left), and Megalosaurus. Some of the statues are wildly inaccurate compared with modern interpretations. Who decided what they should look like is a subject of historical debate. However, research by historians shows clearly that experts in the 1850s had different interpretations, and these differences in view are reflected in the statues on display. The story of these evolving interpretations demonstrates how scientific ideas evolve when new evidence and ideas comes to light. Read our sculpture pages to find out more about the individual statues."
year_published = 2025
clearnet = "https://cpdinosaurs.org/visit/what-are-crystal-palace-dinosaurs"
