["https://cpdinosaurs.org/projects/CPStation-Iguanodon"]
title = "Crystal Palace Station Iguanodon head"
description = "Replica of the standing Iguanodon head in Crystal Palace Station"
full_description = "There is a new resident at Crystal Palace Station: a life-size replica of the head of our internationally famous, standing Iguanodon! Iggy’s head now surveys the ticket hall at Crystal Palace, with the installation funded by ARL and FCPD. It was unveiled by Arriva Rail London (ARL), which operates the London Overground on behalf of Transport for London (TfL), and Friends of Crystal Palace Dinosaurs (FCPD) on Thursday, 12th December. The replica was kindly donated to Friends of Crystal Palace Dinosaurs by Bompas & Parr, a creative food and drink company, from its 2010 event, The Complete History of Food. The event took the form of an experiential meal, charting key periods in England’s glorious and often bizarre culinary history, including the recreation of the epic 1853 Dinner in the Iguanodon. The sculpture will welcome visitors and residents with its beady gaze to the historic park and neighbourhoods in south London."
