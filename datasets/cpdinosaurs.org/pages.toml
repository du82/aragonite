["https://cpdinosaurs.org/index.php/visit/statue-details/plesiosaur"]
title = "Plesiosaur – information about the Crystal Palace statues"
full_description = "It was given this name by the scientists William Conybeare and Henry de la Beche to indicate that it was more like a normal reptile than Ichthyosaurus, which had been found in the same fossil bed a few years earlier. Diet: They would have probably eaten a range of fish, squid, molluscs and other sea creatures. Although the models look sedate, they were actually ferocious predators, with their paddle-shaped limbs helping power them through the water. Statues: Three different species of plesiosaur are represented in the water scattered in front of the large marine reptile island. Fun fact: The first complete skeleton of Plesiosaurus was discovered by the fossil hunter Mary Anning on the Jurassic coast in Dorset. Experts thought its long neck looked so unlikely they thought it was a fake. The Crystal Palace statues vs modern scientific reconstructions: In the mid nineteenth century there were relatively complete skeletons of plesiosaurs so they were constructed in a generally credible light by today’s standards. A noteworthy detail is the varying proportions of the three restored species: “Plesiosaurus” macrocephalus (meaning ‘large head’, located on the far left facing away from the island towards the bank); Plesiosaurus dolichodeirus (meaning ‘long-necked’, located in the middle facing towards the island); and Thalassiodracon hawkinsi (named after the fossil collector Thomas Hawkins, located on the far right). Though the proportions are not exact to fossil data, they capture the main characteristics of each species. “P”. macrocephalus is especially realistic with its robust, deep tail and powerful-looking shoulders. These attributes perhaps make it the most ‘modern looking’ of all three sculptures. Additional fine details include the eyes being angled upwards, and the obvious teeth reflects a suggestion that they were permanently visible. Our understanding of plesiosaur facial tissues is less clear, but it’s not unreasonable to assume liplessness, or at least lipless regions. The presence of smooth skin does not entirely align with what we know of their anatomy, but it’s not a bad inference given that their scales were actually tiny – literally millimetres across. It’s difficult to imagine how the materials available to their sculptor (Benjamin Waterhouse Hawkins) and his team could have been crafted to show such fine detail even if such data was available to them."
year_published = 2025
