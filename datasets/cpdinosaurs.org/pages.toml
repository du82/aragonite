["https://cpdinosaurs.org/index.php/visit/statue-details/ichthyosaur"]
title = "Ichthyosaur – information about the Crystal Palace statues"
full_description = "Scientific name: The models depict three different species: Ichthyosaurus communis and I. tenuirostris (now Leptonectes tenuirostris) meaning ‘fish lizard’, and the larger Temnodontosaurus platydon, meaning ‘cutting-tooth lizard’ Fun fact: 10 years after the models were built, Jules Verne described an epic sea battle between ‘fearless’ Ichthyosaurus and ‘monstrous’ Plesiosaurus in A Journey to the Centre of the Earth. The Crystal Palace statues vs modern scientific reconstructions: The Crystal Palace statues were based on some of the earliest fossils of marine reptiles ever discovered by Mary Anning from the Jurassic Coast in Dorset in the early nineteenth century. Much of the interpretation of the fossil material remains correct today. For example, Richard Owen, one of the scientists who advised on the models, specifically mentions the presence of smooth, scale-less skin, large eyes and predicts some sort of fin at the end of their tails, although he was uncertain of the shape. His assumption about the function of the distinctive bony eye ring in supporting and protecting the eye was also correct, although it would not have been exposed like those on the Crystal Palace models. When the models were constructed in the mid-nineteenth century there were no detailed fossils showing the outline shape of the ichthyosaurs, in particular the dorsal and tall, crescent-shaped tail fins, so scientists assumed they were amphibious rather than fully aquatic and depicted them only partially submerged in water, coming ashore to sleep and reproduce. This is a now long-abandoned view. Owen also assumed the shape of the flipper bones would be reflected in the skin which is unlikely given what we know of fossilised ichthyosaur skin and the relationships between bone texture and skin anatomy. The three sculpted species likely had varied capacity for tail flexion in life, with two species (Temnodontosaurus platydon and Leptonectes tenuirostris, as we know them today) likely having more flexible tails than the relatively advanced, more ‘fish-like’ Ichthyosaurus communis. But none likely had an ability to attain an eel-like tail shape reflected in the Crystal Palace models."
year_published = 2025
clearnet = "https://cpdinosaurs.org/index.php/visit/statue-details/ichthyosaur"
