["https://cpdinosaurs.org/bridge"]
title = "Crystal Palace Dinosaur bridge"
description = "Find out more information about our new bridge design and fill in our public consultation feedback form"
full_description = "Please see our blog for the latest updates on the Bridge Project, including its construction, its installation and the several awards that the bridge has since been nominated for and won! Safe, secure access to the Crystal Palace Dinosaurs is vital for conservation monitoring, repair of the sculptures and grounds maintenance to protect this magnificent Grade-1 listed historic site. As a local heritage asset we are also keen to enhance volunteer and outreach opportunities. All this was made significantly more challenging when the original bridge to the islands was removed in 2017. Do you remember the old dino bridge? Here is a still from a 2016 video (@tomscott https://youtu.be/QWItLyDzMyE) In 2018 Friends of Crystal Palace Dinosaurs launched a successful Crowdfund London effort to raise money to reinstate a bridge to the Dinosaurs islands. It has been supported by the council, the Mayor of London, numerous professional societies, historical societies, working specialists including many conservators and over 600 individual contributors. We have worked with architects Tonkin Liu, engineers Arup and metal fabricators Cake Industries to design a beautiful and fit-for-purpose pedestrian bridge. We have support from the park’s landowner, London Borough of Bromley (LBB), and Historic England (HE), for the project and for our current design. We also ran a public consultation on the designs for the bridge and held several events to present designs and gather feedback. We will reinstate a secure, lockable bridge to the Dinosaur islands. We have selected the new location to the south of the site as being more sympathetic to the landscape, logistically easier and more appropriate to the narrative of the geological walk through time. The previous bridge location is no longer easily accessible due to the new weir and interferes with the landscape views. Maintenance and conservation work is the priority for access using the bridge. Public access will only be in tours and escorted by responsible parties such as volunteer sessions. It will not be continuously open."
