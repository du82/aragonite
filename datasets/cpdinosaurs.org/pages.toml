["https://cpdinosaurs.org/index.php/blog/post/welcome-to-our-new-trustees"]
title = "Welcome to our new trustees!"
full_description = "We are thrilled to have them join our group of existing volunteers, all working hard to help secure a future for the Dinosaurs and sharing the history of the Geological Court with the public. The new trustees have a variety of backgrounds and experience, so will be able to bring a wealth and diversity of skills to bear. We hope you will get a chance to meet them soon at our various events and wish them a very warm welcome to our Dino community. I have been a resident of Southeast London since 2015 when I moved from the Canadian Prairies. It was love at first sight when I first visited the Crystal Palace Dinosaurs. They remind me so much of roadside monumental sculpture back home. I have a Bachelors and Masters Degrees in Fine Art with majors in Ceramics and Sculpture. My masters degree at Carnegie Mellon University focused on collaborating with audiences and communities outside the art world and also strongly encouraged relationships between arts and science. My own practice and research focuses on combining traditional and digital skills to make either miniature of large scale works. Prior to and during my education I worked in retail for over 10 years, in sales, management and display. I currently work for University of the Arts London (UAL) across 3 colleges as a Technical Operations Manager. My remit is to manage all the 3D workshops and the staff within them to help make sure they operate reliably and safely for students and staff. These workshops include foundries, moldmaking, metalwork, ceramics, woodwork, plastics, and digital fabrication. My remit also extends to include serviced resources such as digital print, equipment loan store and AV support. I hope to use the skills I’ve gathered to help ensure the ‘Dinosaurs’ have the care, protection, admiration and popularity they deserve. As the curator of meteorites at the Natural History Museum, I usually answer questions about how the dinosaurs became extinct, but as a proud Penge resident, I’m thrilled to be contributing to the conservation of my dino neighbours."
year_published = 2025
