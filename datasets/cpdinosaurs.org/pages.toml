["https://cpdinosaurs.org/blog/post/transatlantic-connection-dinosaurs-crystal-palace"]
title = "The Transatlantic Connection: Dinosaurs after the Crystal Palace"
full_description = "Britain was the birthplace of the dinosaur. The first ‘fossilists’ making major collections of dinosaur bones were renowned British geologists and zoologists and the taxonomic group was given its name, Dinosauria, and thus its conceptual framing, by Richard Owen in 1842. From the 1820s to the 1850s, while many of these bones were being discovered, a great tradition of popular writing by British palaeontologists such as William Buckland, Gideon Mantell, and Hugh Miller vividly brought the prehistoric world to the public in romantic and evocative books. Dinosaurs were ‘given flesh’ in the first attempt at three-dimensional life-like reconstructions when they formed the centrepieces of Benjamin Waterhouse Hawkins’s inspired Crystal Palace geological islands. Yet, by the 1890s, they had become better known from elsewhere—sometimes Belgium and most definitely from America. This is an overview of how dinosaurs evolved in popular culture on both sides of the Atlantic after the great discoveries of the late nineteenth century. Although the Crystal Palace Dinosaurs were convincingly lifelike for the Victorian public, the dethroning of Hawkins’s models as accurate reconstructions was brutally swift. Excavations in New Jersey just four years after the Crystal Palace’s opening suggested to American savant Joseph Leidy (“the last man who knew everything”) that dinosaurs may have been bipedal, in contrast with Hawkins’s elephantine and crocodilian Iguanodons. Even worse for the enduring concrete creations that had been interpreted from disparate bones, complete skeletons of Iguanodon itself were discovered in 1878 in a coal mine at Bernissart, Belgium, confirming the obsolescence of the Crystal Palace attempts once and for all. Nonetheless it was Hawkins himself who took the lead role in introducing Americans to the discoveries from New Jersey when he moved to the United States in 1868. He did this by constructing the first-ever mounted dinosaur skeleton of the famous Hadrosaurus in Philadelphia, made in collaboration with Leidy, by an extensive East Coast lecture circuit, and by a series of evocative mural paintings at the College of New Jersey (now Princeton University). Less successfully, his ambitious ‘Palæozoic Museum’ in Central Park, New York City, was vandalised by political gangsters in 1871 before it could be completed. Had it survived, this was to have been a grand American equivalent to the geological islands at the Crystal Palace."
year_published = 2025
clearnet = "https://cpdinosaurs.org/blog/post/transatlantic-connection-dinosaurs-crystal-palace"
