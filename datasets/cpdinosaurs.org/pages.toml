["https://cpdinosaurs.org/index.php/visit/statue-details/secondary-island"]
title = "Secondary Island – information about the Crystal Palace statues"
full_description = "On the Secondary Island (representing the “Mesozoic” Era) the prehistoric reptiles are all on or around rocks representing strata where their fossils were discovered. There are also a few scattered replica ammonites and cycad plants on the island. These illustrations represent geological formations from southern England. You can see in sequence from south to north: New Red Sandstone: From the Triassic (251-201 million years ago), the first period in the Mesozoic. These small cliffs, located near the Dicynodon, are the largest surviving original Secondary Island illustration. They represent a desert environment during this period of British geological history. Lias Cliff: A simulated Early Jurassic (201-174 million years ago) limestone cliff represents a tropical sea that once covered most of what is now southern England. These were the same formations where Mary Anning collected fossils in the early-19th century, including those of the ichthyosaurs and plesiosaurs located next to it. Oolitic Limestone: These are rocks from the Middle Jurassic (174-163 million years ago), when Britain was a series of shallow seas and tropical islands. The Megalosaurus is surrounded by limestone which is from the Cotswolds, a stone used locally for building. Wealden Sandstones: The sandstone blocks around the Iguanodon and Hylaeosaurus represent the geology of Sussex, where some of the first dinosaur fossils were found. They are from the Early Cretaceous (145-100 million years ago), but were considered Jurassic by the geologists building the Geological Court. Chalk: A simulated chalk cliff, with Pterosaurs perched on it, illustrates the Late Cretaceous (100-66 million years ago), the final major division of the Mesozoic. It represents a deep sea, through which swam Mosasaurus. Ammonites: Three (inaccurate) ammonite sculptures were added as part of the 2001 reconstruction. These presumably were meant to be Late Cretaceous (100-66 million years ago) given the location on the north slope of the Mesozoic island. However, they appear to have been constructed from sets of fragments of ammonites of different species and so may be remains of specimens of almost any age."
year_published = 2025
