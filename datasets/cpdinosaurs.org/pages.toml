["https://cpdinosaurs.org/blog/post/dino-day-2019"]
title = "Dino Day is back 15th September!"
full_description = "Love the Crystal Palace Dinosaurs? As part of Heritage Open Days Friends of Crystal Palace Dinosaurs are offering a day of fun for the whole family including: There will be talks to stimulate your curiosity, art inspired by the Dinosaurs and ancient plants brought back to life. 10am, 10.30am, 1pm, 1.30pm (booking in advance via Eventbrite essential) Meet at the Info Centre 15 mins before your allotted time Local author Judy Skidmore will read ‘The Mysterious Dinosaurs of Crystal Palace’ on the island where the dinosaurs live. If your children love stories and dinosaurs there’s no better place to hear about how the sculptures come alive when all the visitors have gone home! We think younger children will enjoy this, but all ages are welcome. 11am, noon, 2pm, 3pm and 4pm (booking in advance via Eventbrite essential) Meet at the Info Centre 15 mins before your allotted time If you’ve ever wanted to see the Crystal Palace Dinosaurs up close and personal, this is your chance. This 45-minute tour will take you back in time and explore the history of the unique sculptures and the ancient creatures who inspired them. Best suited for adults and older children (approx 8+). Younger children might enjoy our Storytime on Dinosaur Island more. Please note: Access to the Dinosaur Island is via a long narrow bridge and a small, steep, muddy path and hill. Unfortunately it is not suitable for wheelchairs or buggies. Visitors are advised to wear sturdy footwear. You must enter with the group, so latecomers will not be able to join us. 11.30am (booking in advance via Eventbrite advisable), picnic area (near the giant sloth) Local author Judy Skidmore will read ‘The Mysterious Dinosaurs of Crystal Palace’ in the park where the dinosaurs live. If your children love stories and dinosaurs there’s no better place to hear about how the sculptures come alive when all the visitors have gone home! We think younger children will enjoy this, but all ages are welcome. 12.30- 4pm, Info Centre Dr David Hone, palaeontologist, Crystal Palace Dinosaur enthusiast, and author of The Tyrannosaur Chronicles will be available to show you some real fossils and answer your questions. His research focuses on the behaviour and ecology of the dinosaurs and their flying relatives, the pterosaurs, so get your questions ready."
