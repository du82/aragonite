description = "How to donate to the Friends of Crystal Palace Dinosaurs charity by PayPal, cheque, and other methods."
full_description = "There are several ways that you can get involved to help Friends of Crystal Palace Dinosaurs from donating money and time to buying great CP Dino themed gifts and products. We are a small, volunteer-led charity and rely on the generosity and kindness of our Friends and the community. Friends of Crystal Palace Dinosaurs is a charitable incorporated organisation registered with the Charity Commission for England and Wales, operating with strict financial controls overseen by our Management Board. You can donate any amount. Donations support the aims of the Friends. The button below takes you to our secure PayPal service where you can make a one-off or recurring donation. You can contribute any amount, in any currency. Our primary currency is GBP sterling. If you have a UK PayPal account, you can send us money directly to our donations address, which will save us the small transactions fee charged by PayPal for donations: [email protected] Please write cheques in GBP sterling, made payable to “Friends of Crystal Palace Dinosaurs”. These should be sent to: Dr Ellinor Michel, c/o Natural History Museum, Cromwell Rd, Kensington, London, SW7 5BD, United Kingdom We have a number of fantastic local business friends who support us by making CP Dino themed products and donating a portion of the profit to us. So buy something fun for yourself and help us out at the same time! Boho & Bowie have made some brilliant ‘Megalosaurus Needs Us’ t-shirts (in adult and children sizes), including limited edition Christmas versions! Crystal Palace local, Emma @bymorethanldn, has created a collection of illustrated gifts and linocut print artwork inspired by Crystal Palace Dinosaurs. Illustrator Dan has created a range of products including clothes, phone covers, prints, masks and soft furnishings on Redbubble based on a beautiful illustration of the Dinosaurs. You may recognise the distinctive designs from around Crystal Palace Park of one of our oldest friends David Va