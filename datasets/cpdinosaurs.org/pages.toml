["https://cpdinosaurs.org/index.php/blog/post/3D-digital-dinosaur-archive"]
title = "Creating a 3D digital dinosaur archive"
full_description = "Friends of Crystal Palace Dinosaurs has partnered with Historic England to produce state-of-the-art 3D scans of 29 of the Crystal Palace Dinosaur sculptures. Interactive photogrammetric models have now been made from the scans, allowing anyone to get up close and personal with the famous, Grade-1 listed sculptures for the first time. It is an incredible opportunity to view them from previously unseen angles up close, all whilst protecting them from further damage. These scans will play a vital role in allowing conservators to benchmark the condition of the sculptures, identify breakages and weaknesses and prioritise future repair and maintenance work. The scans have already been used to aid repair of the Megalosaur sculpture after damage to its jaw in 2021. Scans from before and after the fracture were used to print a temporary prosthesis to protect the sculpture. The digital assets can also be used for art engagement, 3D printing and animation and we have collaborated with artists such as Emma Jude in public art classes based on the 3D images. You can find out more about the project on our project page and take a look at of all of the scans on Historic England’s dedicated sketchfab page."
