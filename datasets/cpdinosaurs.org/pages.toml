["https://cpdinosaurs.org/index.php/blog/post/megalosaurus-month"]
title = "Megalosaurus month"
full_description = "February 2024 marks a significant moment in the palaeontological community – the 200th anniversary of the first formal scientific description of a dinosaur. On 20th February 1824 William Buckland, Professor of Geology at Oxford University and president of the Geological Society, presented a paper entitled “Notice on the Megalosaurus or great Fossil Lizard of Stonesfield” to the Geological Society. This represented the first description of a dinosaur as a distinct animal. At the time it was not clear exactly what this animal was other than a very large reptile, but marked the beginning of intense debate about what these animals looked like and how they functioned. Richard Owen would subsequently coin the term ‘dinosaur’ to recognise that Megalosaurus, together with the later-described Iguanodon and Hylaeosaurus, shared key characteristics and were likely from a closely related group of prehistoric animals. We are proud to host the first ever life-sized representation of Megalosaurus built thirty years after its description in Crystal Palace Park. You can find our more information about Megalosaurus on our statue page. The Geological Society are hosting ‘Megalosaurus Month’ from 12-29th February to celebrate this landmark moment with a series of talks and events and will include the display of a life-sized skeletal reconstruction of Megalosaurus at Burlington House in Piccadilly, London. You can find more information here https://www.geolsoc.org.uk/megalosaurus."
year_published = 2025
