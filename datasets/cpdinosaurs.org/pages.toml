["https://cpdinosaurs.org/blog/post/dinosaur-days-2018"]
title = "Dinosaur Days! 15-16 September 2018"
full_description = "Behind-the-scenes tours of the Dinosaur Islands and Ice Age mammal sculptures. Both Saturday and Sunday, led by experts in palaeontology, conservation and London history. 2:30pm – Mammal Tour led by Adrian Lister 2:30pm – Island Tour led by Darren Naish 3:30pm – Island Tour led conservators Sophia Oelman, Birthe Kruse and FCPD trustee Sarah Jayne 3:45pm – Mammal Tour led by Adrian Lister 4:30pm – Island Tour led conservators Sophia Oelman, Birthe Kruse and FCPD trustee Sarah Jayne 11am – Lost Valley of London, led by Anthony Lewis & conservator Patricia Falcão 12pm – Lost Valley of London, led by Anthony Lewis & conservator Patricia Falcão 2pm – Lost Valley of London, with Anthony Lewis & conservator Alice Tate-Harte 3pm – Lost Valley of London, with Anthony Lewis & conservator Alice Tate-Harte 4pm - Lost Valley of London, with Anthony Lewis The Iguanodon Restaurant – a hilarious, historically accurate street theatre performed in a life-sized, moving, travelling Iguanodon! Hands-on events for kids, including drawing, mask and badge-making on extinct and endangered animals, with David Vallade of ‘David Draws…’, Ben Courtney, Hugh Dames of Adventure Learning Crystal Palace. Palaeo Planting Project around the Dinosaurs, bringing ancient landscapes back to life around the sculptures in a volunteer gardening session. Talks – ‘Brain food’ for enquiring minds on myriad topics around our historic site including science, art and conservation. Approximately 30-40 minutes long. The Crystal Palace dinosaurs and other prehistoric animals were a watershed moment in the history of palaeoart, but they represent a relatively early entry into the palaeoart canon. In this talk, find out how scientists and artists have continued to refine and better understand the life appearance of prehistoric animals, and how we can increasingly credibly restore them in art. Dr Mark Witton is a globally recognised palaeoartist and a vertebrate palaeontologist, specialised on flying reptiles. You can follow his work at his blog markwitton-com.blogspot.com and on Twitter @MarkWitton."
