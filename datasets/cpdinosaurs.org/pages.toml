["https://cpdinosaurs.org/index.php/visit/statue-details/xiphodon"]
title = "Xiphodon – information about the Crystal Palace statues"
full_description = "Statues: Xiphodon is a very recently discovered animal at the Crystal Palace Park site. For years one of the statues has hidden in plain site, thought to be a giant deer (Megaloceros) fawn, and placed with these animals in the heather on the Quaternary island. In 2021, whilst undertaking research for the new book, Friends of Crystal Palace Dinosaurs realised that this baby ‘deer’ actually displayed more camel-like features, including its large cleft lip and long neck, and appeared misplaced among the deer. In fact it looked much more similar to the Anoplotherium on the Tertiary island and was suspected that it was actually a more slender form of these animals, known as ‘Anoplotherium gracile’, now referred to as Xiphodon gracilis. This prompted us to search archival material for more evidence of its historical presence at Crystal Palace Park. To our astonishment we realised it was originally one of four such animals, featured in sketches from Benjamin Waterhouse Hawkins’ worskshop from the 1850s (the individual lying down at the front left, seen in the black and white image above). None of the other three Xiphodon sculptures have been found and their whereabouts remain unknown. Written works corroborate their existence, too. Several articles and guidebooks mention four antelope- or camel-like sculptures that, as described, do not match the other species depicted in the park. McDermott’s (1854) Routledge’s Guide mentions ‘four graceful llama-like’ Anoplotherium sculptures (p.192) and an 1854 Hogg’s Instructor article describes them as ‘like a number of antelopes or deer’ (p. 285). Official park guides, including corrected and updated versions released after the park opened, also continually mention the presence of ‘Anoplotherium gracile’ (e.g. Phillips, 1855, 1856), with one – the anonymous 1871 edition – giving their location as ‘under a tree’. The Crystal Palace statues vs modern scientific reconstructions: As with most of Hawkins’ mammal sculptures, his ‘A. gracile’ work has stood the test of time. Today, we would reconstruct this species broadly as he did, with our main distinctions incurred through modern ideas of where Xiphodon fits among mammalian evolution."
year_published = 2025
clearnet = "https://cpdinosaurs.org/index.php/visit/statue-details/xiphodon"
