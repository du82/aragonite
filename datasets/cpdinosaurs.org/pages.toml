["https://cpdinosaurs.org/index.php/visit/statue-details/pterosaur"]
title = "Pterosaur – information about the Crystal Palace statues"
full_description = "Two main species were originally depicted at Crystal Palace. “Pterodactylus” cuvieri (the darker stone models in the pictures above) and “Pterodactylus bucklandi” (the smaller, sandy coloured set of models). Both of these species have since been renamed (see below). However, neither of these animals was well known when the statues were built in the 1850s (and, indeed, they remain poorly known today) so it’s likely that all four models were based on complete Pterodactylus antiquus skeletons known from Germany, based on their long necks and teeth. Whilst they were formerly known as ‘pterodactyl’, this term is now outdated and not used as a common name as it only describes one species in the wider pterosaur group. Lived: Whilst Pterodactylus antiquus was known mostly from Europe, pterosaurs in general had a worldwide distribution. Size: Pterosaur body size varied hugely but wingspans could stretch from the size of a sparrow to a fighter jet. The models depict pterosaurs with a 5-6 metre wingspan. Diet: Different pterosaur species had widely varied diets from meat eating to plant eating. Stomach contents for some pterosaur species show they ate fish, whilst others have very clear feeding adaptions like filter-feeders and those with teeth to crush molluscs. Statues: Two sets of pterosaurs were created for the Crystal Palace display: two larger individuals representing pterodactyloids from British Chalk deposits, and two smaller animals from the Great Oolite Group. The original models of the latter went missing in the 1930s and fibreglass replacements installed in 2002 were stolen and destroyed by vandals in 2005. The larger models remain but are in disrepair, owing to their relative delicacy. Fun facts: Pterosaurs are not dinosaurs! Although pterosaurs are close relatives of dinosaurs, they are not part of the same evolutionary group. The Crystal Palace statues vs modern scientific reconstructions: Early documentation of the pterosaur models show that all four shared a similar form: long necks with smallish, toothed heads; scaly skin; large torsos; crouching hindlimbs and - of course - enormous, membranous wings supported by long forelimb bones and elongated wing fingers."
year_published = 2025
clearnet = "https://cpdinosaurs.org/index.php/visit/statue-details/pterosaur"
