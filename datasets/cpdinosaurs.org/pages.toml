["https://cpdinosaurs.org/projects/palaeotherium-magnum"]
title = ""
full_description = "The Friends of Crystal Palace Dinosaurs has embarked upon an exciting new project to restore one of the park’s most important missing sculptures. The Crystal Palace Dinosaurs, built between 1852 and 1855, were the first effort to reconstruct extinct animals at life-size. They are internationally unique for their vintage and snapshot of early palaeontological interpretation. There are 30+ sculptures in the park but there were many more planned and several we know were made but have been lost. FCPD undertakes ongoing research to understand the Dinosaurs, and discovered through historical archives that there was a missing sculpture from the Palaeotherium assemblage. Palaeotherium magnum was a large 2.2 m long, extinct mammal distantly related to horses. It was a highly distinctive and engaging component of the Eocene mammal assemblage in the park but its sculpture apparently went missing in the middle of the twentieth century. It appears several times in etchings and paintings of Hawkins’ workshop and photos of the original site build in the early 1850s. More recent images of it from 1958 and 1962/63 have now been uncovered through historical archives and a crowd-sourced photo archiving project. Palaeotherium magnum in several early images: A & B) details from engravings of BWH’s workshop, showing the sculpture just after it was constructed, before being moved on site, 1854; C) a photo of the sculpture in place on the Geological Court (Dinosaur Landscape) during construction, 1854-5 Its whereabouts are entirely unknown, especially as the sculptures have been moved around more than once in the twentieth century, but its absence is now a sad missing element of the park. The Victorian sculpture of this charmingly dour beast stood very visibly on the water’s edge for over 110 years. It made the palaeothere group much more notable to visitors, whereas now that mammal group is largely hidden, diminished and very overlooked. It was the largest animal in the assemblage of mammals from the ‘Eocene’ section of the first-ever constructed walk through geological time. Fossils of this extinct animal occur in southern England and other sites in Europe, and date from 48-34 million years ago when the climate was very warm and the vegetation was tropical and subtropical."
year_published = 2025
