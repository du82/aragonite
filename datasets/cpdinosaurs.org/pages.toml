["https://cpdinosaurs.org/engagement/public-engagement"]
title = "Public engagement and outreach – Friends of Crystal Palace Dinosaurs"
full_description = "Friends of Crystal Palace Dinosaurs are passionate about telling the story of the Dinosaurs and ensuring their legacy for the future. The sculptures are both internationally recognised for their importance in the history of science and loved by locals as a charismatic community asset. We undertake a number of activities to keep promoting these fascinating sculptures and to encourage the public to get involved in learning about and conserving them. We run regular events including talks, film showings and open days. We visit schools and give fun, interactive talks on the Dinosaurs. We take part in Heritage Open Days in September, as well as other heritage and park-based annual outreach events. We are extremely fortunate to have our friends, Emerald Ant, who run entertaining and educational plays about the history of the Dinosaurs set in an incredible, life-size Iguanodon! They have undertaken outdoor theatre performances of their 35 minute show to over 20,000 people around the UK, including at our very own Dino Day in Crystal Palace Park, as part of Heritage Open Days. Calling all teachers! Emerald Ant also now have a brilliant new schools pack of visual, creative and fun activities for teaching geology and Victorian history. This includes a unique series of 22 online teaching units that can be incorporated into the Key Stage 2 curriculum with worksheets on earth science, the history of fossil discoveries, and related art and english activities, to engage and inspire students. If you are an interested school or teacher please contact Sarah Butterworth, Creative Director at Emerald Ant. We want the public to get up close and personal to the Dinosaurs to fully appreciate their scale, artistry and historic importance. To stand next to one of these magnificent beasts is hugely awe inspiring. However, as Grade 1 listed sculptures they are protected by law and, at over 150 years old and living outside exposed to the elements, they are fragile. Therefore in order to protect them we organise bespoke tours led by experts on the Dinosaurs who can safely and respectfully guide members of the public around the site. We regularly run tours as part of Heritage Open Days in September so keep an eye out for these on our social media. Safe, regular access to the site is an ongoing challenge, but following a successful crowdfunding campaign we will be reinstating a permanent, secure bridge to the site in 2020 which will enable us to run regular tours and also ensure better and safe access to the sculptures for vital conservation work."
year_published = 2025
