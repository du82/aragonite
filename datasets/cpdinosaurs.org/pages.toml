["https://cpdinosaurs.org/about/who-are-friends-of-crystal-palace-dinosaurs"]
title = "Who are Friends of Crystal Palace Dinosaurs?"
description = "Friends of Crystal Palace Dinosaurs is a charity registered with the Charity Commission for England and Wales whose purpose is to promote the long-term conservation of the statues."
full_description = "Friends of Crystal Palace Dinosaurs is a charity registered with the Charity Commission for England and Wales (no.1165231) whose purpose is to promote the long-term conservation of these statues and the larger geological site. We don’t own the statues, and we don’t control access to the site. Instead, work closely with the London Borough of Bromley and Crystal Palace Park Trust, other Friends groups, and key national organisations (such as Historic England) to ensure the dinosaurs get the care and attention they need. Our aim is to ensure the dinosaurs survive our generation intact, so they can be enjoyed for future generations. We also care deeply about public engagement. Everyone loves the Dinosaurs, and the site is as alive visitors today as when the park opened in 1854. The Friends develop engagement programmes, give public lectures, encourage visitors to do more than take a few quick photographs, and help school children think about the importance of science in their daily lives. We particularly aim to provide resources that will encourage others to draw their own meaning from the site. A key part of engagement relates to history and heritage. The Victorian story of these statues is one that fascinates all who encounter it. Yet, there is much that still remains a mystery to the historian. The Friends are working to unravel some of that narrative through our research. Our recently published book The Art and Science of the Crystal Palace Dinosuars, is the first new book on the site in over a quarter of a century and presents the most in-depth research this globally significant historic site has ever had, synthesising existing research and revealing new discoveries. Friends of Crystal Palace Dinosaurs started in 2013. When we began, we were a small group of local residents living near the park. We saw the Dinosaurs slowly declining due to lack of maintenance. We saw vandalism. We saw how hard it was to find simple, clear interpretation. In talking with those who work in the park, we also heard stories of declining resources and declining commitment. After a harsh winter hit the statues particularly hard, we decided it was time to do something. That’s when the Friends came together."
year_published = 2025
