["https://cpdinosaurs.org/projects/dinosaur-monitor"]
title = "Dinosaur monitor"
description = "Dinosaur monitor"
full_description = "Dinosaur Monitor is an exciting new project that was launched in 2021 by FCPD that will use historical visitor photographs of the Crystal Palace Dinosaurs to inform conservation monitoring efforts. The Crystal Palace Dinosaurs and the accompanying Geological Illustrations have been in place for over 150 years and have experienced changes in colour, surrounding vegetation and conservation state. Unfortunately, the site’s history has not always been well documented, but this information is vital for informing conservation efforts and preventing further damage. We will use these photographs to monitor long term issues affecting the sculptures, such as discolouration and colour change, moss and lichen growth, cracks and other damage, and historical conservation work. We are also interested in changes to vegetation, water levels and erosion of the surrounding environment. Dinosaur Monitor originated from the Monument Monitor project, a research collaboration between Historic Environment Scotland and the Institute of Sustainable Heritage at University College London that focuses on long-term monitoring of remote heritage sites in Scotland. Before you decide whether to take part in this project, please read this this page carefully. If you have any questions please contact us using the details below. What is the project about? The purpose of this project is to research whether, and to what extent, visitors’ images of the Crystal Palace Dinosaurs and Geological Illustrations can be used for conservation purposes. We want to see wether we can extract valuable conservation data, such as colour information, scale and erosion to help with condition assessments of the sculptures and wider site. Things we’ve discovered so far and what we hope to find out about: One of our amazing initial discoveries was that the standing iguanodon lost half its face in 2010. This doesn’t see to have been recorded in any archival documents we’ve seen and it’s not clear how it was repaired."
year_published = 2025
