["https://cpdinosaurs.org/index.php/blog/post/LFA-2024"]
title = "London Festival of Architecture events hosted by FCPD"
full_description = "Friends of Crystal Palace Dinosaurs are hosting three Dinosaur-related talks and tours to celebrate the London Festival of Architecture this June. The team that brought the Dinosaur Swing Bridge to life will describe the process of the bridge’s inception, evolution, and construction, how the design emerged and improved, and how a community deepened their relationship with this pivotal structure that bridges heritage old and new. We will show you design models, drawings, prototypes and crowd-funding tools that grew support from over 600 small and major donors. You will see the bridge in action and create your own part-model of the Swing Bridge’s structural principles with a laser-cut print-out and demo. Meet architects Tonkin Liu, fabricators Cake Industries and the client, FCPD. More information: https://www.londonfestivalofarchitecture.org/event/dinosaur-swing-bridge-in-crystal-palace-park/ This guided tour will bring you through the sequence of strata represented (with close-up views of the rocks and animal sculptures) and an opportunity to discuss the influence of geology on vernacular architecture of Southern Britain. Led by Dr Jeremy Young (UCL), stratigraphic geologist and FCPD Trustee. More information: https://www.londonfestivalofarchitecture.org/event/the-building-stones-in-the-landscapes-of-the-crystal-palace-geological-court-with-a-few-dinosaur-diversions/ We’ve recently initiated a 3D scanning effort and digital archive that has resulted in detailed digital models of the iconic Crystal Palace Dinosaur sculptures. It is now possible to visualise these unique sculptures fully in three dimensions, helping us to better understand the intentions of the original artist and the layers of conservation history in the years since. This demonstration talk will be presented by Rhys Griffin, digital animator and FCPD Project Partner, with opportunities for Q&A. More information: https://www.londonfestivalofarchitecture.org/event/reimagining-the-crystal-palace-dinosaur-sculptures-in-3d/"
year_published = 2025
