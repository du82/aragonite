["https://cpdinosaurs.org/blog/post/dinner-in-the-iguanodon"]
title = "Dinner in the Iguanodon"
full_description = "The “Dinner in the Iguanodon Model” is the best known story about Crystal Palace Dinosaurs. It took place on New Year’s Eve 31 December 1853 and was immortalised in the picture published in Illustrated London News, 7 January 1854, p. 22. “Mr Waterhouse Hawkins requests the honour of—at dinner in the mould of the Iguanodon at the Crystal Palace on Saturday evening December the 31st at five o’clock 1853 An answer will oblige.” The scene depicts a collection of gentlemen sitting around a table inside one of the Iguanodon models under construction over the winter 1853-54. In the image, waiters deliver dinner. On the floor are pieces of the mould used to cast the model. Different reports put Richard Owen at the head of the table and Benjamin Waterhouse Hawkins standing centre and facing the viewer. The model is surrounded by a tent decorated with a chandelier and four plaques honouring famous palaeontologists (William Buckland, Georges Cuvier, Richard Owen, Gideon Mantell). Because the Iguanodon model stood tall, a stage was required for waiters and guests to reach inside. The famous “Dinner in the Iguanodon Model” was immortalised in this picture, published in Illustrated London News, 7 January 1854, p. 22. This picture in Illustrated London News was based on a drawing made by Benjamin Waterhouse Hawkins, preserved in the Academy of Natural Science of Drexel University. This drawing was meant to be a report to the geologist Joseph Prestwich, but Waterhouse Hawkins intended it for wider circulation. At the time, much was made of the fact that Professor Richard Owen was placed at the head of the table - quite literally, sitting where the brain was located. The Dinner in the Mould of the Iguanodon Given By Benjamin Waterhouse Hawkins. Drawn by Benjamin Waterhouse Hawkins. Location: Academy of Natural Sciences of Drexel University. To Prof R Owen, Prof Edward Forbes, Mr Joseph Prestwich and 18 other Scientific and literary gentlemen at the Crystal Palace, Sydenham on the 31st of December 1853"
year_published = 2025
clearnet = "https://cpdinosaurs.org/blog/post/dinner-in-the-iguanodon"
