["https://cpdinosaurs.org/visit/visitors-guide"]
title = "A visitor's guide to the Crystal Palace Dinosaurs"
description = "How to get to Crystal Palace Park, what to expect in the park, and how to find all of the dinosaurs."
full_description = "A visit to the Dinosaurs makes for a great day out, and they are a popular visitor attraction — free to visit and open daily. Before you visit why not learn more about the statues or download our new guidesheets on the mammals, Geological Illustrations and plants at Crystal Palace Park? You can also explore our webpages to find out more about the history of the site and ongoing efforts to conserve the sculptures. The Dinosaurs are located in Crystal Palace Park, one of London’s great green spaces. The Crystal Palace Dinosaurs section of the park is free to visit and is open during the park’s opening hours. Getting to the park is easy. It is served by Transport for London (buses and London Overground) and numerous rail operators. The current Crystal Palace rail station (CYP) at the side of the park dates from the 19th century and was used by visitors to the original amusement park. Other nearby train stations include Penge West and Penge East. There is also free parking available. The closest car park to the Dinosaurs is at the Penge entrance off Thicket Road, where there is also an information centre, public toilets and a cafe. The other two car parks are accessed from Anerley Hill and Crystal Palace Park Road. The Dinosaurs and geological landscapes are located by the lakes in the south section of the park near the Penge entrance and the Information Centre. The statues are outdoors, so please be mindful of local weather conditions. The site is step-free and accessible on an unpaved footpath, though this can be muddy in wet weather. The location is well sign-posted within the park. As you go round the lakes keep an eye out for signage with more information on all the statues and geological landscapes. The Penge end of the park includes a small information centre open on weekends, public toilets open when the park gates are open and a new cafe opened in April 2019. The park is owned and managed by London Borough of Bromley. Surrounding the park are substantial villages, including Crystal Palace, Penge, Anerley, and Sydenham. There is an excellent range of restaurants and pubs nearby."
year_published = 2025
