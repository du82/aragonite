["https://cpdinosaurs.org/history/about-history"]
title = "Learn about the history of the Crystal Palace Dinosaurs and the details of their creation"
description = "We research information about the dinosaurs and engage the public in the re-telling of the history of the 30 Grade-1 listed sculptures that make up the Crystal Palace Dinosaurs."
full_description = "We research information about the Dinosaurs and engage the public in the re-telling of their history. The 30+ Grade-1 listed sculptures that make up the Crystal Palace Dinosaurs are absolutely vital objects in the history of science. They were the first ever attempt to model full-scale replicas of extinct animals, especially dinosaurs, and one of the first examples of natural history-based ‘edu-tainment’. Perhaps (unfairly) best known for their inaccuracies now, they were in fact pioneering reconstructions for the mid-nineteenth century, reflecting the latest scientific knowledge and skilled artistry, as well as being visual spectacles. We have written a short history of the Dinosaurs below and you can find out more about the individual statues here. These pages include information on the statues themselves, what we known about these species today and how palaeoartistic reconstructions have changed over time, including a wonderful set of new, up-to-date artistic interpretations. There is also increased signage at the site itself for visitors on the individual statues. You can also find more information on our blog, for example on how the sculptures were made, the famous ‘Dinner in the Iguandon’ hosted by Benjamin Waterhouse Hawkins, and the history of dinosaurs after Crystal Palace. This video also provides a nice summary of the story of the Crystal Palace Dinosaurs. Finally, in 2022 our very own Chair of Trustees Dr Ellinor Michel and palaeontological artist and researcher Dr Mark Witton published ‘The Art and Science of the Crystal Palace Dinosaurs’, the first new book on the site in over a quarter of a century. It presents the most in-depth research this globally significant historic site has ever had, bringing together new archival sources to synthesise, re-analyse and re-compile our understanding of how the Geological Court came to be. Find out more about the new book and how to buy it. Benjamin Waterhouse Hawkins was the sculptor responsible for the statues that today are remembered as the Crystal Palace Dinosaurs. He was a natural history artist of international reputation. His sculptures were set in a landscape designed by Joseph Paxton that also included hillside illustrations of economic geology created by Professor David Ansted. This section of the park was constructed 1853-1855 to accompany the relocation of the Crystal Palace from Hyde Park to Sydenham Hill in south London following the Great Exhibition of 1851, and has remained largely as it appeared to visitors when the park opened. The statues are the first ever attempt to interpret paleontological discoveries as full-scale, full-bodied, living animals."
year_published = 2025
