["https://cpdinosaurs.org/visit/statue-details/palaeotherium"]
title = "Palaeotherium – information about the Crystal Palace statues"
full_description = "Size: Palaeotherium was a relatively small mammal, standing around 75cm at the shoulder on average, although the largest species were the size of a small horse. Statues: Two small tapir-like statues, one sitting (Plagiolophus minor) and one standing (Palaeotherium medium), on the Tertiary island close to the water, also near the Anoplotherium. A third restored model of the larger Palaeotherium magnum stands close by. The sitting model lost its head and was fitted with a replacement in the late twentieth century, but unfortunately it is once again headless. We also suspect that the replacement head was not an accurate reconstruction of the original, as it differs somewhat from older images of Plagiolophus minor. We hope to eventually replace the head with a version that was more faithful to the original. While doing recent archival research, FCPD also discovered nineteenth century documentation and photographs from as recently as 1963 that indicated a third larger, pony-sized model (Palaeotherium magnum) once existed that was distinct from the surviving models (see photos below) but sadly there is no record of where this is. However, FCPD embarked upon an exciting project to restore Palaeotherium magnum in the park. The replica model was built by the palaeoartist Bob Nicholls and unveiled in the summer of 2023. Fun facts: Palaeotherium is one of the historically oldest known fossil animals, having been studied by the famous French anatomist Georges Cuvier in the early 1800s. The Crystal Palace statues vs modern scientific reconstructions: The first fossil skeletons of Palaeotherium that were recovered from France were nearly complete, so its anatomy was known in fairly good detail from early on. However, it’s somewhat difficult to evaluate the Palaeotherium models against the science of their day because of modifications that have been made to them since their original installation, including a replaced head on the sitting model and an apparently lost, larger third model."
year_published = 2025
