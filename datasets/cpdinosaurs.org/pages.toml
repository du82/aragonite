["https://cpdinosaurs.org/index.php/blog/post/heritage-open-days-2023"]
title = "Heritage Open Days 2023"
full_description = "On Saturday 9th and Sunday 10th September 2023, the hottest weekend of the year, Friends of Crystal Palace Dinosaurs hosted a two day event as part of Heritage Open Days. We gave park visitors an introduction to the Crystal Palace Dinosaurs and their history. We gave four guided walks around the site, led by our volunteer guides Amy, Alexandra, Steve and Andrew. These site walks are a fantastic way of learning about the history of the Crystal Palace Dinosaurs, the concept and layout of the site and the range of animals depicted. Dodo and Dinosaur provided a beautifully illustrated trail designed especially for the Crystal Palace Dinosaurs, to tie in with the launch of their new book, sales of which support FCPD. On Saturday we were lucky to be joined by Emma Jude, who provided an art class for adults, using the Dinosaurs as inspiration and using experimental artistic techniques to produce original work. On Sunday three local actors braved the heat to perform in Victorian dress as Benjamin Waterhouse Hawkins, Mary Anning, and Richard Owen. They walked around near the Dinosaurs and chatted in character to park visitors, telling them about the way they were connected to the site. Volunteers Leah and Tom were on hand with more detailed specialist knowledge, and water! Back at the Info Centre, children and adults alike put their artistic efforts into colouring in their own CP Dinosaur badges to take away for free! Our volunteers chatted with visitors about the heritage of the site and its significance to scientific history. We would like to thank all of our fantastic and dedicated volunteers who helped out across the weekend, including Sue, Steve, Leah, Tom, Amy, Ross, Meg, Andrew and Alexandra. We really couldn’t have done it without you."
