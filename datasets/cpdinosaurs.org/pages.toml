["https://cpdinosaurs.org/index.php/blog/post/fcpd-is-recruiting"]
title = "FCPD is recruiting!"
full_description = "Do you have experience that you could channel into helping our small charity deliver projects around conservation and interpretation of this globally significant history of science site? The Friends of Crystal Palace Dinosaurs have an urgent need for a treasurer and conservator (see below) but would also welcome people with other skills like science and history engagement, gardening, imaging, archiving and web projects…. there’s probably a place for you if you’ve got enthusiasm. Give us a shout if you think you might want to join us, and we can chat more about our organisational structure, time commitments and whether it’s a good match for both sides. We’re looking for someone who is good with ‘the books’, has a grasp of good governance appreciates our mission, and would find being part of our group of voluntary trustees a satisfying thing to do. We are all active doers as well as decision-makers. We’re looking for someone who has professional experience in historic conservation and is prepared to work in friendly, collaborative advocacy with our major stakeholder organisations such as Historic England, the Crystal Palace Park Trust, Bromley Council. They will appreciate our mission and would find being part of our group of voluntary trustees a satisfying thing to do. We are all active doers as well as decision-makers. If you might be interested, for starters contact: Ellinor Michel, Chair of FCPD, E: [email protected], M: 07506071547"
