["https://cpdinosaurs.org/index.php/visit/statue-details/megalosaurus"]
title = "Megalosaurus – information about the Crystal Palace statues"
full_description = "Fun fact: Charles Dickens imagined meeting a Megalosaurus on the muddy streets of London in the opening lines of Bleak House. It is also mentioned in Conan Doyle’s Lost World. The Crystal Palace statues vs modern scientific reconstructions: Megalosaurus has the honour of being the first dinosaur to be described in a scientific way (by William Buckland in 1824), although the term ‘dinosaur’ was not coined by the anatomist Richard Owen for another 18 years. Its ‘fearful’ teeth were compared to a collection of knives, swords and saws. At the time of the model’s construction the available fossil material was a jaw bone and teeth, a few vertebrae, pelvic bones and some hindlimb material. Today M. bucklandi is regarded as the only species of Megalosaurus and, though still incompletely known, is understood as a stocky, 6-7 m long predatory species. This is ultimately mid-sized for a theropod dinosaur, but large for a Middle Jurassic species. Many of the key features remain in modern reconstructions from the Crystal Palace model, including its large stature, long tail and general head shape. In the image below, gone is the large shoulder hump and of course it is now depicted as bipedal (standing on two legs) rather than a quadruped (standing on four legs) with short forelimbs with a robust, three-fingered hand. Interestingly, its exact proportions remain unknown. The sculptor, Benjamin Waterhouse Hawkins, did a good job of distinguishing Megalosaurus from the other plant-eating dinosaurs in terms of its anatomy and it bears several hallmarks of predatory species that reflect close observation of living animals. The limbs, for instance, are not held as pillars as in the Iguanodon, but are have flexed knees, elbows, wrists and ankles, as well as bulging musculature. This pose suggests a motion and energy lacking in the pillar-like limbs of the Iguanodon, and recalls the limbs of rhinos - relatively fast, sprightly giants - more than the columnar-limbs of slower paced elephants."
year_published = 2025
clearnet = "https://cpdinosaurs.org/index.php/visit/statue-details/megalosaurus"
