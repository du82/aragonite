["https://cpdinosaurs.org/index.php/visit/statue-details/primary-rocks"]
title = "Primary Rocks – information about the Crystal Palace statues"
full_description = "The oldest and most elaborate rocks placed in the Geological Court represent the Primary Epoch (“Palaeozoic” Era). Old Red Sandstone: Huge blocks of hard sandstone form a wide, low waterfall below the Paxton Bridge and prominent outcrops around the edge of the lake. These sandstones have recently been identified as Carboniferous Millstone Grit (326-315 mya), although there are records of Devonian Old Red Sandstone (416-359 mya) in the area between the Tidal Lake and the outcrop valley. At this point in prehistory plants were starting to colonise the land and all animals lived in the water. Mountain Limestone Cliff: Further along the site, you can see blocks of Carboniferous strata, from a tropical period 359-299 million years ago. The was rebuilt in the early 2000s, with 110 tons of limestone transported from the Once-a-Week Quarry in Derbyshire. Alongside this limestone cliff is a simulated mine: a tunnel leads into a cave which contained manufactured and real stalactites and stalagmites, mineral veins to simulate a lead-mine, and even a crystal grotto. The mine entrances are now closed owing to the collapsed and potentially dangerous interior and, access is impossible. The Coal Measures and Millstone Grit Illustration: this is perhaps the most dramatic geological illustration on the site and has survived largely intact into the present. It shows the type of geology you can see in mining districts in the UK, and especially in northern England and Wales. The size of this simulated rock face shows the importance that coal and geology had for the Victorians. Four distinct rock types are present: at the bottom, a sandstone base representing Millstone Grit, then three layers together representing the overlying Coal Measures - a thick, black coal seam, an orangish ironstone, and shale beds. This constructed ‘outcrop’ also includes two ‘faults,’ where the alignment of the strata has been displaced by the movement of the earth. Flanked on the right by a waterfall, these indicate dynamic geological processes."
year_published = 2025
clearnet = "https://cpdinosaurs.org/index.php/visit/statue-details/primary-rocks"
