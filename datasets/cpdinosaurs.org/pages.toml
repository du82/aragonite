["https://cpdinosaurs.org/blog/post/dinosaurs-declared-at-risk-by-historic-england"]
title = "Dinosaurs declared ‘At Risk’ by Historic England"
full_description = "Historic England, the public body that champions and protects England’s historic places, has confirmed that the Crystal Palace Dinosaurs are being added to their Heritage at Risk Register. Many of the 30+ iconic sculptures of dinosaurs and other extinct animals depicted in Crystal Palace Park have large cracks in their bodies and limbs, and some are in danger of losing toes, teeth, tails and antlers. The causes of the deterioration are not yet fully understood, but ground movement on the artificial islands which are home to the statues and changing water conditions in the surrounding lakes are suspected. Outdoor sculptures are particularly at risk from damage and deterioration, and the Crystal Palace Dinosaurs have so far endured over 150 years exposed to the elements. Despite major specialist conservation work undertaken in 2003 and 2016-17, Historic England, Bromley Borough Council and the Friends of Crystal Palace Dinosaurs are once again very concerned about their condition. By adding the much-loved sculptures to its Heritage at Risk Register, Historic England is raising awareness of their plight and is focusing attention on their repair and conservation. They will work in partnership with Bromley Borough Council, the National Lottery Heritage Fund and the Friends of Crystal Palace Dinosaurs to ensure their long-term survival. Future conservation work will be facilitated by the building of a new bridge in 2020 to the islands that will reinstate access for guided, up close-and-personal interpretation visits and maintenance. The bridge project, led by Friends of Crystal Palace Dinosaurs, was crowdfunded by many hundreds of members of the public, businesses, the mayor’s office, and council, and supported by Historic England. Duncan Wilson, Chief Executive of Historic England said: “These wonderful creatures are in a state of disrepair and require significant conservation works. We don’t want them to become extinct again! By adding them to our Heritage at Risk Register, we can focus attention on them and ensure a lasting programme of repairs and on-going maintenance is carried out. Working in partnership with Bromley Council and the Friends of Crystal Palace Dinosaurs, we hope to secure their long-term future.”"
year_published = 2025
