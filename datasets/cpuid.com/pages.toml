["https://cpuid.com/news.html"]
title = "News | CPUID"
description = """
Qualcomm is about to introduce its new Snapdragon X Elite/Plus platform to the laptop market. CPU-Z and HWMonitor were updated so they can report all information about the new Soc, including :
- the Snapdragon X Elite/Plus Oryon™ CPU
- the Snapdragon X Elite/Plus Adreno™ GPU
- the Snapdragon X Elite /Plus Hexagon™ NPU

Download CPU-Z 1.03 for ARM64.
Download HWMonitor 1.02 for ARM64."""
full_description = "Qualcomm Snapdragon X Elite supported by CPU-Z and HWMonitor for ARM64 April 21th, 2024 Qualcomm is about to introduce its new Snapdragon X Elite/Plus platform to the laptop market. CPU-Z and HWMonitor were updated so they can report all information about the new Soc, including : - the Snapdragon X Elite/Plus Oryon™ CPU - the Snapdragon X Elite/Plus Adreno™ GPU - the Snapdragon X Elite /Plus Hexagon™ NPU Download CPU-Z 1.03 for ARM64. Download HWMonitor 1.02 for ARM64. Share this news on Facebook Twitter Email Read more CPU-Z for Windows ARM64 updated with new SOCs and benchmark February 06th, 2024 Less than one month after the first release, CPU-Z for Windows ARM64 was updated to support a lot of new SOCs, such as Qualcomm Snapdragon 808, 810, 845, 855, 860, as well as several Broadcom and Rockchip models. In addtion, the benchmark tab was added, based on the same benchmark used in the x64 version (but of course compiled for ARM64). This update was made possible thanks to Stas'M and the Windows on R discord server who sent us lots of reports, helped in debugging, and tested over and over until the program worked as expected. Please check the CPU-Z for Windows ARM64 page for more information and a download link. Share this news on Facebook Twitter Email Read more 2024, CPU-Z for Windows ARM64 January 11th, 2024 We're happy to present today the first ARM64 native version of CPU-Z, aimed to run on Windows ARM64. This software is following the HWMonitor version for that operating system..In comparison to the x86/x64 version, the interface was slightly modified to report the ARM SoC information as clearly as possible. Some features are still missing, but we are currently working on adding them. So please stay tuned to the CPU-Z for ARM64 dedicated page and check for updates. Happy New Year 2024 ! Share this news on Facebook Twitter Email Read more HWMonitor on ARM64 July 19th, 2023 We're glad to introduce our new version of HWMonitor dedicated to Windows on ARM64. This version was designed to natively run on ARM64 platforms equipped with Microsoft Windows. Please visit the HWMonitor for Windows ARM64 page to get your copy of the 1st release (version 1.01). Share this news on Facebook Twitter Email Read more"
