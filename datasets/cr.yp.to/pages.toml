title = "D. J. Bernstein / Talks"
full_description = '''2025.01.15 30 min invited lecture online researchers [horizontal PDF slides] Private seminar. "PQConnect." 2024.12.27 15:25 Taipei time 45 min invited lecture online researchers [horizontal PDF slides] Academia Sinica. "CryptAttackTester: high-assurance attack analysis." 2024.10.11 10:30 Hillsboro time 30 min invited lecture online researchers [horizontal PDF slides] Intel Crypto Frontiers Workshop. "PQSRC highlights." 2024.09.19 90 min invited lecture online researchers [horizontal PDF slides] [Ogg audio] Private seminar. "Understanding patent incentives." 2024.09.17 10:00 D.C. time 60 min invited lecture online researchers [horizontal PDF slides] NIST PQC Seminar. "Classic McEliece: conservative code-based cryptography." 2024.09.09 90 min invited lecture online researchers [horizontal PDF slides] Private seminar. "eBACS: ECRYPT Benchmarking of Cryptographic Systems." 2024.07.22 60 min invited lecture online researchers [horizontal PDF slides] Private seminar. "Cryptographic code snippets." 2024.07.18 16:10 Seoul time 60 min invited lecture online researchers [horizontal PDF slides] KpqC Workshop. "Software analysis of the KpqC candidates." 2024.07.17 13:45 Chengdu time 115 min invited lecture online students [horizontal PDF slides] 1st Post-Quantum Cryptography Summer School in Universities, South-West China, 2024. "The McEliece cryptosystem." 2024.06.24 10:00 Szczecin time 60 min invited lecture online researchers [horizontal PDF slides] NuTMiC 2024: Number-Theoretic Methods in Cryptology. "Slow-boiled frogs." Abstract: In 2013, I introduced a name for cryptography that simply works, solidly resists attacks, and never needs any upgrades: I called it boring cryptography. This talk is about the opposite extreme, which is called lattice-based cryptography. I'll talk about some general context and some number-theoretic issues that appear in the area. 2024.05.10 16:00 Seoul time 90 min invited lecture online researchers [horizontal PDF slides] KpqC seminar. "Algorithms for attacking lattices." 2024.01.11 30 min invited lecture online researchers [horizontal PDF slides] Private seminar. "Post-quantum cryptography for developers." 2023.10.25 14:30 Taipei time 60 min invited lecture online researchers [horizontal PDF slides] Quantum Safe Migration Center. "Migrating to the McEliece cryptosystem." 2023.10.06 15:10 Hillsboro time 30 min invited lecture online researchers [horizontal PDF slides] Intel Crypto Frontiers Workshop. "McEliece verification." 2023.07.11 09:20 20 min invited lecture Netherlands researchers [horizontal PDF slides] Machine-Checked Mathematics. Lorentz Center, Universiteit Leiden. "Formal proofs in applied cryptography." 2023.06.15 15:00 DC time 60 min invited lecture online researchers [horizontal PDF slides] Seminar, Federal Reserve TechLab. "Post-quantum cryptography: risk assessment." 2023.02.01 11:00 Bangkok time 90 min invited lecture online students [horizontal PDF slides] IACR School on Applied Cryptography, Chulalongkorn University, Bangkok, Thailand. "Hash-based signatures." 2022.12.29 20:00 Berlin time 40 min refereed lecture online researchers [horizontal PDF slides] FireShonks 2022. "Post-quantum cryptography: detours, delays, and disasters." Talk given jointly with Tanja Lange. 2022.12.14 15:20 Kolkata time 25 min refereed lecture online researchers [vertical PDF slides] [horizontal PDF slides] Indocrypt 2022. TCG-CREST, Kolkata, India. "A one-time single-bit fault leaks all previous NTRU-HRSS session keys to a chosen-ciphertext attack." 2022.11.10 17:00 Berlin time 90 min invited lecture online researchers [horizontal PDF slides] Seminar, Präsidiumsarbeitskreis "Datenschutz und IT-Sicherheit" der Gesellschaft für Informatik, Germany. "NSA's influence on cryptographic standards." 2022.08.25 09:40 Tampa time 40 min invited lecture online researchers [horizontal PDF slides] USF-QSancus Workshop on Post-Quantum Cryptography. USF Research Foundation, Tampa, Florida, USA. "Introduction to post-quantum cryptography." Talk given jointly with Tanja Lange. 2022.08.20 10:10 Taipei time 45 min invited lecture online researchers [horizontal PDF slides] HITCON 2022: Hacks in Taiwan Conference 2022. Nangang Exhibition Center, Taipei, Taiwan. "Post-quantum cryptography: detours, delays, and disasters." Talk given jointly with Tanja Lange. 2022.08.12 15:00 Bristol time 30 min refereed lecture online researchers [vertical PDF slides] [horizontal PDF slides] [video] Algorithmic Number Theory Symposium (ANTS) XV. University of Bristol, England. "Fast norm computation in smooth-degree Abelian number fields." 2022.07.12 13:30 Taiwan time 75 min invited lecture online students [vertical PDF slides] [horizontal PDF slides] Post-Quantum Crypto Minischool. Academia Sinica, Taiwan. "Lattice-based cryptography, part 2: efficiency." 2022.07.12 10:45 Taiwan time 75 min invited lecture online students [vertical PDF slides] [horizontal PDF slides] Post-Quantum Crypto Minischool. Academia Sinica, Taiwan. "Lattice-based cryptography, part 1: simplicity." 2022.04.01 15:30 60 min invited lecture Taiwan students [horizontal PDF slides] Class talk, National Taiwan University. "Hash-based signatures I: hash functions and one-time signatures." 2022.04.01 13:00 120 min invited lecture Taiwan students [horizontal PDF slides] EECS International Distinguished Lecture Series, National Taiwan University. "The transition to post-quantum cryptography." Talk given jointly with Tanja Lange. 2022.01.14 14:35 25 min invited lecture Taiwan researchers [PDF slides] Post-Quantum Cryptography Forum. National Taipei University of Technology. "U.S. activities in post-quantum cryptography." 2022.01.14 10:50 40 min invited lecture Taiwan researchers [PDF slides] Post-Quantum Cryptography Forum. National Taipei University of Technology. "Lattice KEMs, the round-3 candidates: NTRU, NTRU Prime, SABER, Kyber, Frodo." 2021.12.12 14:30 Jaipur time 150 min invited lecture online students [vertical PDF slides] [horizontal PDF slides] [video] Tutorial session; INDOCRYPT 2021. "Quantum cryptanalysis." 2021.11.26 14:55 45 min invited lecture Taiwan researchers [horizontal PDF slides] HITCON 2021: Hacks in Taiwan Conference 2021. Academia Sinica, Taipei. "Fast verified post-quantum software." 2021.09.03 11:00 Eastern time 30 min invited lecture online researchers [horizontal PDF slides] ICMC 2021: International Cryptographic Module Conference. "Fast verified post-quantum software." Abstract: Cryptographic performance pressure produces many different cryptographic specifications, and a much larger number of pieces of software trying to make those cryptographic functions run quickly in various environments. The pre-quantum software ecosystem is already large and complicated but the post-quantum software ecosystem is rapidly shaping up to be much more complicated. We’ve already seen the post-quantum optimization process producing disastrous mistakes that weren’t caught by tests, and at this point we have only a limited understanding of what further mistakes to expect. Fortunately, there are tools to verify that optimizations work for all possible inputs, and there are some cases where these tools have been successfully applied to post-quantum software. This talk will look at what these tools mean for the post-quantum software engineer. 2021.08.20 13:20 Eastern time 60 min invited lecture online researchers [horizontal PDF slides] [video] Plenary talk. SIAM Conference on Applied Algebraic Geometry 2021. "S-unit attacks." Abstract: Within post-quantum cryptography, lattice-based cryptography has attracted attention for its efficiency. Typical proposals for lattice-based encryption systems fit public keys and ciphertexts into only about 1KB, and take very little CPU time. This efficiency relies on using systems built from algebraic number fields. The most common choices are cyclotomic number fields, such as the smallest field containing the complex number ζ=exp(πi/512), a 512th root of −1. Lattice-based cryptosystems are frequently claimed to have proofs of security assuming the "worst-case" hardness of certain lattice problems. For a cyclotomic lattice system, the problem is to find a short nonzero element of I, given a nonzero ideal I of the smallest ring containing ζ. The conjecture that this problem is hard is frequently claimed to be well studied. However, the problem has in fact suffered dramatic security losses. This talk will introduce the audience to recent advances in algorithms to solve this problem, with an emphasis on techniques to exploit multiplicative structure in general, automorphisms in the Galois case, extra subfields when they exist, and additional features of cyclotomic fields. The audience is not assumed to be familiar with algebraic number theory. 2021.06.09 10:50 D.C. time 15 min refereed lecture online researchers [horizontal PDF slides] [video] Third PQC Standardization Conference. "Fast verified post-quantum software, part 1: RAM subroutines." [white paper] 2021.06.08 15:25 D.C. time 15 min invited lecture online researchers [horizontal PDF slides] [video] Third PQC Standardization Conference. "NTRU Prime: round-3 updates." 2021.05.14 14:20 75 min invited lecture Taiwan students [horizontal PDF slides] Class talk, National Taiwan University. "Hash-based signatures I: hash functions and one-time signatures." 2021.01.15 11:00 D.C. time 60 min invited lecture online researchers [vertical PDF slides] [horizontal PDF slides] [video] NIST 3rd Round Seminar Series. "Valuations and S-units." Abstract: This talk reviews a standard infinite-dimensional number-theoretic lattice that simultaneously shows how large numbers are and how they factor. The ability to decode this lattice in some surprisingly large cases plays a critical role in a new wave of attacks against ideal-lattice problems. This talk will focus on defining the lattice, with many examples to illustrate. This is an introductory talk aimed at a broad audience. Prerequisites: mathematics education up to and including a course in undergraduate abstract algebra (commutative rings and fields). 2020.10.07 14:00 EDT 5 min refereed lecture online researchers [horizontal PDF slides] [video] Virtual Workshop on Considerations in Migrating to Post-Quantum Cryptographic Algorithms. "OpenSSLNTRU: experiences integrating a post-quantum KEM into TLS 1.3 via an OpenSSL ENGINE." 2020.10.07 16:00 Taipei time 30 min contributed lecture online researchers [vertical PDF slides] [horizontal PDF slides] Post-Quantum Cryptography for Embedded Systems. "Constant-time square-and-multiply." 2020.10.04 03:00 Taipei time 90 min invited lecture online researchers [horizontal PDF slides] [video] Post-Quantum Cryptography for Embedded Systems. "Does cryptographic software work correctly?" 2020.09.12 16:20 50 min invited lecture Taiwan researchers [horizontal PDF slides] HITCON 2020: Hacks in Taiwan Conference 2020. Academia Sinica, Taipei. "Post-quantum cryptography." Talk given jointly with Tanja Lange. 2020.08.13 12:30 PDT 15 min refereed lecture online researchers [horizontal PDF slides] [video] USENIX Security Symposium 2020. "McTiny: fast high-confidence post-quantum key erasure for tiny network servers." Talk given jointly with Tanja Lange. 2020.07.21 16:10 55 min invited lecture Taiwan students [vertical PDF slides] [horizontal PDF slides] PQCRYPTO Mini-School. Academia Sinica, Taipei. "Lattice-based cryptography, day 2: efficiency." Part 2. 2020.07.21 13:55 60 min invited lecture Taiwan students [vertical PDF slides] [horizontal PDF slides] PQCRYPTO Mini-School. Academia Sinica, Taipei. "Lattice-based cryptography, day 2: efficiency." Part 1. 2020.07.20 16:10 55 min invited lecture Taiwan students [vertical PDF slides] [horizontal PDF slides] PQCRYPTO Mini-School. Academia Sinica, Taipei. "Lattice-based cryptography, day 1: simplicity." Part 2. 2020.07.20 13:55 60 min invited lecture Taiwan students [vertical PDF slides] [horizontal PDF slides] PQCRYPTO Mini-School. Academia Sinica, Taipei. "Lattice-based cryptography, day 1: simplicity." Part 1. 2020.07.06 03:05 55 min invited lecture online researchers [vertical PDF slides] [horizontal PDF slides] Workshop on the Mathematics of Post-Quantum Crypto. "Exploring the parameter space in lattice attacks." Talk given jointly with Tanja Lange. 2020.02.19 14:45 45 min contributed lecture USA researchers [vertical PDF slides] [horizontal PDF slides] Lattices: Geometry, Algorithms and Hardness. Simons Institute for the Theory of Computing. "Challenges in evaluating costs of known lattice attacks." Talk given jointly with Tanja Lange. 2020.02.06 16:30 60 min invited lecture Germany researchers [horizontal PDF slides] Security Network Munich, Talking Heads. Giesecke + Devrient. "Crypto horror stories." Talk given jointly with Tanja Lange. 2020.01.30 09:30 60 min invited lecture USA researchers [horizontal PDF slides] The Quantum Wave in Computing Boot Camp. Simons Institute for the Theory of Computing. "Post-quantum cryptography." 2020.01.20 17:30 30 min invited lecture Germany researchers [vertical PDF slides] [horizontal PDF slides] Symmetric cryptography. Schloss Dagstuhl. "Speed, speed, speed." 2019.12.29 17:30 60 min refereed lecture Germany researchers [horizontal PDF slides] 36C3: 36th Chaos Communication Congress. Congress Center Leipzig. "High-assurance crypto software." Talk given jointly with Tanja Lange. 2019.11.27 13:00 60 min invited lecture Germany researchers [vertical PDF slides] [horizontal PDF slides] CASA Distinguished Lecture, Ruhr-University Bochum. "Sorting integer arrays: security, speed, and verification." Abstract: This talk will explain (1) the security concept of "constant-time" software; (2) how to build constant-time software to sort arrays of integers; (3) how to make constant-time sorting software run so quickly that it beats Intel's "Integrated Performance Primitives" library; and (4) how to automatically verify that the result