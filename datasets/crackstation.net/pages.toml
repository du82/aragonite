title = "CrackStation Contact"
description = "What CrackStation is and why we exist"
full_description = "About CrackStation CrackStation is a security awareness project started by Defuse Security. Its purpose is to raise awareness about insecure password storage in web applications, and to provide guidance to implementors of user authentication systems. By making large hash lookup tables freely available to the public, we make it easier for security researchers to demonstrate why password storage solutions, like non-salted hashing, are insecure. While CrackStation does provide paid services, its goal is not to make a profit. The money is used to pay for the hardware required to run CrackStation, and any left-overs go toward other security research projects (the results of which are released into the public domain). You may support CrackStation and other Defuse Security projects by donating using the PayPal donate button above. If you have any questions, comments, or concerns about CrackStation, or would like help implementing secure password storage in an authentication system, please contact us. You can find our contact information on the Contact Information Page."
