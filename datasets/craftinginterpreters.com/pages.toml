title = "Calls and Functions · Crafting Interpreters"
full_description = '24 Calls and Functions Any problem in computer science can be solved with another level of indirection. Except for the problem of too many layers of indirection. David Wheeler This chapter is a beast. I try to break features into bite-sized pieces, but sometimes you gotta swallow the whole meal. Our next task is functions. We could start with only function declarations, but that’s not very useful when you can’t call them. We could do calls, but there’s nothing to call. And all of the runtime support needed in the VM to support both of those isn’t very rewarding if it isn’t hooked up to anything you can see. So we’re going to do it all. It’s a lot, but we’ll feel good when we’re done. Eating—consumption—is a weird metaphor for a creative act. But most of the biological processes that produce “output” are a little less, ahem, decorous. 24 . 1Function Objects The most interesting structural change in the VM is around the stack. We already have a stack for local variables and temporaries, so we’re partway there. But we have no notion of a call stack. Before we can make much progress, we’ll have to fix that. But first, let’s write some code. I always feel better once I start moving. We can’t do much without having some kind of representation for functions, so we’ll start there. From the VM’s perspective, what is a function? A function has a body that can be executed, so that means some bytecode. We could compile the entire program and all of its function declarations into one big monolithic Chunk. Each function would have a pointer to the first instruction of its code inside the Chunk. This is roughly how compilation to native code works where you end up with one solid blob of machine code. But for our bytecode VM, we can do something a little higher level. I think a cleaner model is to give each function its own Chunk. We’ll want some other metadata too, so let’s go ahead and stuff it all in a struct now. struct Obj* next; }; object.h add after struct Obj typedef struct { Obj obj; int arity; Chunk chunk; ObjString* name; } ObjFunction; struct ObjString { object.h, add after struct Obj Functions are first class in Lox, so they need to be actual Lox objects. Thus ObjFunction has the same Obj header that all object types share. The arity field stores the number of parameters the function expects. Then, in addition to the chunk, we store the function’s name. That will be handy for reporting readable runtime errors. Humans don’t seem to find numeric bytecode offsets particularly illuminating in crash dumps. This is the first time the “object” module has needed to reference Chunk, so we get an include. #include "common.h" object.h #include "chunk.h" #include "value.h" object.h Like we did with strings, we define some accessories to make Lox functions easier to work with in C. Sort of a poor man’s object orientation. First, we’ll declare a C function to create a new Lox function. uint32_t hash; }; object.h add after struct ObjString ObjFunction* newFunction(); ObjString* takeString(char* chars, int length); object.h, add after struct ObjString The implementation is over here: object.c add after allocateObject() ObjFunction* newFunction() { ObjFunction* function = ALLOCATE_OBJ(ObjFunction, OBJ_FUNCTION); function->arity = 0; function->name = NULL; initChunk(&function->chunk); return function; } object.c, add after allocateObject() We use our friend ALLOCATE_OBJ() to allocate memory and initialize the object’s header so that the VM knows what type of object it is. Instead of passing in arguments to initialize the function like we did with ObjString, we set the function up in a sort of blank state—zero arity, no name, and no code. That will get filled in later after the function is created. Since we have a new kind of object, we need a new object type in the enum. typedef enum { object.h in enum ObjType OBJ_FUNCTION, OBJ_STRING, } ObjType; object.h, in enum ObjType When we’re done with a function object, we must return the bits it borrowed back to the operating system. switch (object->type) { memory.c in freeObject() case OBJ_FUNCTION: { ObjFunction* function = (ObjFunction*)object; freeChunk(&function->chunk); FREE(ObjFunction, object); break; } case OBJ_STRING: { memory.c, in freeObject() This switch case is responsible for freeing the ObjFunction itself as well as any other memory it owns. Functions own their chunk, so we call Chunk’s destructor-like function. We don’t need to explicitly free the function’s name because it’s an ObjString. That means we can let the garbage collector manage its lifetime for us. Or, at least, we’ll be able to once we implement a garbage collector. Lox lets you print any object, and functions are first-class objects, so we need to handle them too. switch (OBJ_TYPE(value)) { object.c in printObject() case OBJ_FUNCTION: printFunction(AS_FUNCTION(value)); break; case OBJ_STRING: object.c, in printObject() This calls out to: object.c add after copyString() static void printFunction(ObjFunction* function) { printf("<fn %s>", function->name->chars); } object.c, add after copyString() Since a function knows its name, it may as well say it. Finally, we have a couple of macros for converting values to functions. First, make sure your value actually is a function. #define OBJ_TYPE(value) (AS_OBJ(value)->type) object.h #define IS_FUNCTION(value) isObjType(value, OBJ_FUNCTION) #define IS_STRING(value) isObjType(value, OBJ_STRING) object.h Assuming that evaluates to true, you can then safely cast the Value to an ObjFunction pointer using this: #define IS_STRING(value) isObjType(value, OBJ_STRING) object.h #define AS_FUNCTION(value) ((ObjFunction*)AS_OBJ(value)) #define AS_STRING(value) ((ObjString*)AS_OBJ(value)) object.h With that, our object model knows how to represent functions. I’m feeling warmed up now. You ready for something a little harder? 24 . 2Compiling to Function Objects Right now, our compiler assumes it is always compiling to one single chunk. With each function’s code living in separate chunks, that gets more complex. When the compiler reaches a function declaration, it needs to emit code into the function’s chunk when compiling its body. At the end of the function body, the compiler needs to return to the previous chunk it was working with. That’s fine for code inside function bodies, but what about code that isn’t? The “top level” of a Lox program is also imperative code and we need a chunk to compile that into. We can simplify the compiler and VM by placing that top-level code inside an automatically defined function too. That way, the compiler is always within some kind of function body, and the VM always runs code by invoking a function. It’s as if the entire program is wrapped inside an implicit main() function. One semantic corner where that analogy breaks down is global variables. They have special scoping rules different from local variables, so in that way, the top level of a script isn’t like a function body. Before we get to user-defined functions, then, let’s do the reorganization to support that implicit top-level function. It starts with the Compiler struct. Instead of pointing directly to a Chunk that the compiler writes to, it instead has a reference to the function object being built. typedef struct { compiler.c in struct Compiler ObjFunction* function; FunctionType type; Local locals[UINT8_COUNT]; compiler.c, in struct Compiler We also have a little FunctionType enum. This lets the compiler tell when it’s compiling top-level code versus the body of a function. Most of the compiler doesn’t care about this—that’s why it’s a useful abstraction—but in one or two places the distinction is meaningful. We’ll get to one later. compiler.c add after struct Local typedef enum { TYPE_FUNCTION, TYPE_SCRIPT } FunctionType; compiler.c, add after struct Local Every place in the compiler that was writing to the Chunk now needs to go through that function pointer. Fortunately, many chapters ago, we encapsulated access to the chunk in the currentChunk() function. We only need to fix that and the rest of the compiler is happy. It’s almost like I had a crystal ball that could see into the future and knew we’d need to change the code later. But, really, it’s because I wrote all the code for the book before any of the text. Compiler* current = NULL; compiler.c add after variable current replace 5 lines static Chunk* currentChunk() { return &current->function->chunk; } static void errorAt(Token* token, const char* message) { compiler.c, add after variable current, replace 5 lines The current chunk is always the chunk owned by the function we’re in the middle of compiling. Next, we need to actually create that function. Previously, the VM passed a Chunk to the compiler which filled it with code. Instead, the compiler will create and return a function that contains the compiled top-level code—which is all we support right now—of the user’s program. 24 . 2 . 1Creating functions at compile time We start threading this through in compile(), which is the main entry point into the compiler. Compiler compiler; compiler.c in compile() replace 2 lines initCompiler(&compiler, TYPE_SCRIPT); parser.hadError = false; compiler.c, in compile(), replace 2 lines There are a bunch of changes in how the compiler is initialized. First, we initialize the new Compiler fields. compiler.c function initCompiler() replace 1 line static void initCompiler(Compiler* compiler, FunctionType type) { compiler->function = NULL; compiler->type = type; compiler->localCount = 0; compiler.c, function initCompiler(), replace 1 line Then we allocate a new function object to compile into. compiler->scopeDepth = 0; compiler.c in initCompiler() compiler->function = newFunction(); current = compiler; compiler.c, in initCompiler() I know, it looks dumb to null the function field only to immediately assign it a value a few lines later. More garbage collection-related paranoia. Creating an ObjFunction in the compiler might seem a little strange. A function object is the runtime representation of a function, but here we are creating it at compile time. The way to think of it is that a function is similar to a string or number literal. It forms a bridge between the compile time and runtime worlds. When we get to function declarations, those really are literals—they are a notation that produces values of a built-in type. So the compiler creates function objects during compilation. Then, at runtime, they are simply invoked. We can create functions at compile time because they contain only data available at compile time. The function’s code, name, and arity are all fixed. When we add closures in the next chapter, which capture variables at runtime, the story gets more complex. Here is another strange piece of code: current = compiler; compiler.c in initCompiler() Local* local = &current->locals[current->localCount++]; local->depth = 0; local->name.start = ""; local->name.length = 0; } compiler.c, in initCompiler() Remember that the compiler’s locals array keeps track of which stack slots are associated with which local variables or temporaries. From now on, the compiler implicitly claims stack slot zero for the VM’s own internal use. We give it an empty name so that the user can’t write an identifier that refers to it. I’ll explain what this is about when it becomes useful. That’s the initialization side. We also need a couple of changes on the other end when we finish compiling some code. compiler.c function endCompiler() replace 1 line static ObjFunction* endCompiler() { emitReturn(); compiler.c, function endCompiler(), replace 1 line Previously, when interpret() called into the compiler, it passed in a Chunk to be written to. Now that the compiler creates the function object itself, we return that function. We grab it from the current compiler here: emitReturn(); compiler.c in endCompiler() ObjFunction* function = current->function; #ifdef DEBUG_PRINT_CODE compiler.c, in endCompiler() And then return it to compile() like so: #endif compiler.c in endCompiler() return function; } compiler.c, in endCompiler() Now is a good time to make another tweak in this function. Earlier, we added some diagnostic code to have the VM dump the disassembled bytecode so we could debug the compiler. We should fix that to keep working now that the generated chunk is wrapped in a function. #ifdef DEBUG_PRINT_CODE if (!parser.hadError) { compiler.c in endCompiler() replace 1 line disassembleChunk(currentChunk(), function->name != NULL ? function->name->chars : "<script>"); } #endif compiler.c, in endCompiler(), replace 1 line Notice the check in here to see if the function’s name is NULL? User-defined functions have names, but the implicit function we create for the top-level code does not, and we need to handle that gracefully even in our own diagnostic code. Speaking of which: static void printFunction(ObjFunction* function) { object.c in printFunction() if (function->name == NULL) { printf("<script>"); return; } printf("<fn %s>", function->name->chars); object.c, in printFunction() There’s no way for a user to get a reference to the top-level function and try to print it, but our DEBUG_TRACE_EXECUTION diagnostic code that prints the entire stack can and does. It is no fun if the diagnostic code we use to find bugs itself causes the VM to segfault! Bumping up a level to compile(), we adjust its signature. #include "vm.h" compiler.h function compile() replace 1 line ObjFunction* compile(const char* source); #endif compiler.h, function compile(), replace 1 line Instead of taking a chunk, now it returns a function. Over in the implementation: compiler.c function compile() replace 1 line ObjFunction* compile(const char* source) { initScanner(source); compiler.c, function compile(), replace 1 line Finally we get to some actual code. We change the very end of the function to this: while (!match(TOKEN_EOF)) { declaration(); } compiler.c in compile() replace 2 lines ObjFunction* function = endCompiler(); return parser.hadError ? NULL : function; } compiler.c, in compile(), replace 2 lines We get the function object from the compiler. If there were no compile errors, we return it. Otherwise, we signal an error by returning NULL. This way, the VM doesn’t try to execute a function that may contain invalid bytecode. Eventually, we will update interpret() to handle the new declaration of compile(), but first we have some other changes to make. 24 . 3Call Frames It’s time for a big conceptual leap. Before we can implement function declarations and calls, we need to get the VM ready to handle them. There are two main problems we need to worry about: 24 . 3 . 1Allocating local variables The compiler allocates stack slots for local variables. How should that work when the set of local variables in a program is distributed across multiple functions? One option would be to keep them totally separate. Each function would get its own dedicated set of slots in the VM stack that it woul'
