title = "Local Variables · Crafting Interpreters"
full_description = '''22 Local Variables And as imagination bodies forth The forms of things unknown, the poet’s pen Turns them to shapes and gives to airy nothing A local habitation and a name. William Shakespeare, A Midsummer Night’s Dream The last chapter introduced variables to clox, but only of the global variety. In this chapter, we’ll extend that to support blocks, block scope, and local variables. In jlox, we managed to pack all of that and globals into one chapter. For clox, that’s two chapters worth of work partially because, frankly, everything takes more effort in C. There’s probably some dumb “think globally, act locally” joke here, but I’m struggling to find it. But an even more important reason is that our approach to local variables will be quite different from how we implemented globals. Global variables are late bound in Lox. “Late” in this context means “resolved after compile time”. That’s good for keeping the compiler simple, but not great for performance. Local variables are one of the most-used parts of a language. If locals are slow, everything is slow. So we want a strategy for local variables that’s as efficient as possible. Function parameters are also heavily used. They work like local variables too, so we’ll use the same implementation technique for them. Fortunately, lexical scoping is here to help us. As the name implies, lexical scope means we can resolve a local variable just by looking at the text of the program—locals are not late bound. Any processing work we do in the compiler is work we don’t have to do at runtime, so our implementation of local variables will lean heavily on the compiler. 22 . 1Representing Local Variables The nice thing about hacking on a programming language in modern times is there’s a long lineage of other languages to learn from. So how do C and Java manage their local variables? Why, on the stack, of course! They typically use the native stack mechanisms supported by the chip and OS. That’s a little too low level for us, but inside the virtual world of clox, we have our own stack we can use. Right now, we only use it for holding on to temporaries—short-lived blobs of data that we need to remember while computing an expression. As long as we don’t get in the way of those, we can stuff our local variables onto the stack too. This is great for performance. Allocating space for a new local requires only incrementing the stackTop pointer, and freeing is likewise a decrement. Accessing a variable from a known stack slot is an indexed array lookup. We do need to be careful, though. The VM expects the stack to behave like, well, a stack. We have to be OK with allocating new locals only on the top of the stack, and we have to accept that we can discard a local only when nothing is above it on the stack. Also, we need to make sure temporaries don’t interfere. Conveniently, the design of Lox is in harmony with these constraints. New locals are always created by declaration statements. Statements don’t nest inside expressions, so there are never any temporaries on the stack when a statement begins executing. Blocks are strictly nested. When a block ends, it always takes the innermost, most recently declared locals with it. Since those are also the locals that came into scope last, they should be on top of the stack where we need them. This alignment obviously isn’t coincidental. I designed Lox to be amenable to single-pass compilation to stack-based bytecode. But I didn’t have to tweak the language too much to fit in those restrictions. Most of its design should feel pretty natural. This is in large part because the history of languages is deeply tied to single-pass compilation and—to a lesser degree—stack-based architectures. Lox’s block scoping follows a tradition stretching back to BCPL. As programmers, our intuition of what’s “normal” in a language is informed even today by the hardware limitations of yesteryear. Step through this example program and watch how the local variables come in and go out of scope: See how they fit a stack perfectly? It seems that the stack will work for storing locals at runtime. But we can go further than that. Not only do we know that they will be on the stack, but we can even pin down precisely where they will be on the stack. Since the compiler knows exactly which local variables are in scope at any point in time, it can effectively simulate the stack during compilation and note where in the stack each variable lives. We’ll take advantage of this by using these stack offsets as operands for the bytecode instructions that read and store local variables. This makes working with locals deliciously fast—as simple as indexing into an array. In this chapter, locals start at the bottom of the VM’s stack array and are indexed from there. When we add functions, that scheme gets a little more complex. Each function needs its own region of the stack for its parameters and local variables. But, as we’ll see, that doesn’t add as much complexity as you might expect. There’s a lot of state we need to track in the compiler to make this whole thing go, so let’s get started there. In jlox, we used a linked chain of “environment” HashMaps to track which local variables were currently in scope. That’s sort of the classic, schoolbook way of representing lexical scope. For clox, as usual, we’re going a little closer to the metal. All of the state lives in a new struct. } ParseRule; compiler.c add after struct ParseRule typedef struct { Local locals[UINT8_COUNT]; int localCount; int scopeDepth; } Compiler; Parser parser; compiler.c, add after struct ParseRule We have a simple, flat array of all locals that are in scope during each point in the compilation process. They are ordered in the array in the order that their declarations appear in the code. Since the instruction operand we’ll use to encode a local is a single byte, our VM has a hard limit on the number of locals that can be in scope at once. That means we can also give the locals array a fixed size. We’re writing a single-pass compiler, so it’s not like we have too many other options for how to order them in the array. #define DEBUG_TRACE_EXECUTION common.h #define UINT8_COUNT (UINT8_MAX + 1) #endif common.h Back in the Compiler struct, the localCount field tracks how many locals are in scope—how many of those array slots are in use. We also track the “scope depth”. This is the number of blocks surrounding the current bit of code we’re compiling. Our Java interpreter used a chain of maps to keep each block’s variables separate from other blocks’. This time, we’ll simply number variables with the level of nesting where they appear. Zero is the global scope, one is the first top-level block, two is inside that, you get the idea. We use this to track which block each local belongs to so that we know which locals to discard when a block ends. Each local in the array is one of these: } ParseRule; compiler.c add after struct ParseRule typedef struct { Token name; int depth; } Local; typedef struct { compiler.c, add after struct ParseRule We store the name of the variable. When we’re resolving an identifier, we compare the identifier’s lexeme with each local’s name to find a match. It’s pretty hard to resolve a variable if you don’t know its name. The depth field records the scope depth of the block where the local variable was declared. That’s all the state we need for now. This is a very different representation from what we had in jlox, but it still lets us answer all of the same questions our compiler needs to ask of the lexical environment. The next step is figuring out how the compiler gets at this state. If we were principled engineers, we’d give each function in the front end a parameter that accepts a pointer to a Compiler. We’d create a Compiler at the beginning and carefully thread it through each function call . . . but that would mean a lot of boring changes to the code we already wrote, so here’s a global variable instead: In particular, if we ever want to use our compiler in a multi-threaded application, possibly with multiple compilers running in parallel, then using a global variable is a bad idea. Parser parser; compiler.c add after variable parser Compiler* current = NULL; Chunk* compilingChunk; compiler.c, add after variable parser Here’s a little function to initialize the compiler: compiler.c add after emitConstant() static void initCompiler(Compiler* compiler) { compiler->localCount = 0; compiler->scopeDepth = 0; current = compiler; } compiler.c, add after emitConstant() When we first start up the VM, we call it to get everything into a clean state. initScanner(source); compiler.c in compile() Compiler compiler; initCompiler(&compiler); compilingChunk = chunk; compiler.c, in compile() Our compiler has the data it needs, but not the operations on that data. There’s no way to create and destroy scopes, or add and resolve variables. We’ll add those as we need them. First, let’s start building some language features. 22 . 2Block Statements Before we can have any local variables, we need some local scopes. These come from two things: function bodies and blocks. Functions are a big chunk of work that we’ll tackle in a later chapter, so for now we’re only going to do blocks. As usual, we start with the syntax. The new grammar we’ll introduce is: statement → exprStmt | printStmt | block ; block → "{" declaration* "}" ; When you think about it, “block” is a weird name. Used metaphorically, “block” usually means a small indivisible unit, but for some reason, the Algol 60 committee decided to use it to refer to a compound structure—a series of statements. It could be worse, I suppose. Algol 58 called begin and end “statement parentheses”. Blocks are a kind of statement, so the rule for them goes in the statement production. The corresponding code to compile one looks like this: if (match(TOKEN_PRINT)) { printStatement(); compiler.c in statement() } else if (match(TOKEN_LEFT_BRACE)) { beginScope(); block(); endScope(); } else { compiler.c, in statement() After parsing the initial curly brace, we use this helper function to compile the rest of the block: This function will come in handy later for compiling function bodies. compiler.c add after expression() static void block() { while (!check(TOKEN_RIGHT_BRACE) && !check(TOKEN_EOF)) { declaration(); } consume(TOKEN_RIGHT_BRACE, "Expect '}' after block."); } compiler.c, add after expression() It keeps parsing declarations and statements until it hits the closing brace. As we do with any loop in the parser, we also check for the end of the token stream. This way, if there’s a malformed program with a missing closing curly, the compiler doesn’t get stuck in a loop. Executing a block simply means executing the statements it contains, one after the other, so there isn’t much to compiling them. The semantically interesting thing blocks do is create scopes. Before we compile the body of a block, we call this function to enter a new local scope: compiler.c add after endCompiler() static void beginScope() { current->scopeDepth++; } compiler.c, add after endCompiler() In order to “create” a scope, all we do is increment the current depth. This is certainly much faster than jlox, which allocated an entire new HashMap for each one. Given beginScope(), you can probably guess what endScope() does. compiler.c add after beginScope() static void endScope() { current->scopeDepth--; } compiler.c, add after beginScope() That’s it for blocks and scopes—more or less—so we’re ready to stuff some variables into them. 22 . 3Declaring Local Variables Usually we start with parsing here, but our compiler already supports parsing and compiling variable declarations. We’ve got var statements, identifier expressions and assignment in there now. It’s just that the compiler assumes all variables are global. So we don’t need any new parsing support, we just need to hook up the new scoping semantics to the existing code. Variable declaration parsing begins in varDeclaration() and relies on a couple of other functions. First, parseVariable() consumes the identifier token for the variable name, adds its lexeme to the chunk’s constant table as a string, and then returns the constant table index where it was added. Then, after varDeclaration() compiles the initializer, it calls defineVariable() to emit the bytecode for storing the variable’s value in the global variable hash table. Both of those helpers need a few changes to support local variables. In parseVariable(), we add: consume(TOKEN_IDENTIFIER, errorMessage); compiler.c in parseVariable() declareVariable(); if (current->scopeDepth > 0) return 0; return identifierConstant(&parser.previous); compiler.c, in parseVariable() First, we “declare” the variable. I’ll get to what that means in a second. After that, we exit the function if we’re in a local scope. At runtime, locals aren’t looked up by name. There’s no need to stuff the variable’s name into the constant table, so if the declaration is inside a local scope, we return a dummy table index instead. Over in defineVariable(), we need to emit the code to store a local variable if we’re in a local scope. It looks like this: static void defineVariable(uint8_t global) { compiler.c in defineVariable() if (current->scopeDepth > 0) { return; } emitBytes(OP_DEFINE_GLOBAL, global); compiler.c, in defineVariable() Wait, what? Yup. That’s it. There is no code to create a local variable at runtime. Think about what state the VM is in. It has already executed the code for the variable’s initializer (or the implicit nil if the user omitted an initializer), and that value is sitting right on top of the stack as the only remaining temporary. We also know that new locals are allocated at the top of the stack . . . right where that value already is. Thus, there’s nothing to do. The temporary simply becomes the local variable. It doesn’t get much more efficient than that. The code on the left compiles to the sequence of instructions on the right. OK, so what’s “declaring” about? Here’s what that does: compiler.c add after identifierConstant() static void declareVariable() { if (current->scopeDepth == 0) return; Token* name = &parser.previous; addLocal(*name); } compiler.c, add after identifierConstant() This is the point where the compiler records the existence of the variable. We only do this for locals, so if we’re in the top-level global scope, we just bail out. Because global variables are late bound, the compiler doesn’t keep track of which declarations for them it has seen. But for local variables, the compiler does need to remember that the variable exists. That’s what declaring it does—it adds it to the compiler’s list of variables in the current scope. We implement that using another new function. compiler.c add after identifierConstant() static void addLocal(Token name) { Local* local = &current->locals[current->localCount++]; local->name = name; local->depth = current->scopeDepth; } compiler.c, add '''
