title = "Classes and Instances · Crafting Interpreters"
full_description = '''27 Classes and Instances Caring too much for objects can destroy you. Only—if you care for a thing enough, it takes on a life of its own, doesn’t it? And isn’t the whole point of things—beautiful things—that they connect you to some larger beauty? Donna Tartt, The Goldfinch The last area left to implement in clox is object-oriented programming. OOP is a bundle of intertwined features: classes, instances, fields, methods, initializers, and inheritance. Using relatively high-level Java, we packed all that into two chapters. Now that we’re coding in C, which feels like building a model of the Eiffel tower out of toothpicks, we’ll devote three chapters to covering the same territory. This makes for a leisurely stroll through the implementation. After strenuous chapters like closures and the garbage collector, you have earned a rest. In fact, the book should be easy from here on out. People who have strong opinions about object-oriented programming—read “everyone”—tend to assume OOP means some very specific list of language features, but really there’s a whole space to explore, and each language has its own ingredients and recipes. Self has objects but no classes. CLOS has methods but doesn’t attach them to specific classes. C++ initially had no runtime polymorphism—no virtual methods. Python has multiple inheritance, but Java does not. Ruby attaches methods to classes, but you can also define methods on a single object. In this chapter, we cover the first three features: classes, instances, and fields. This is the stateful side of object orientation. Then in the next two chapters, we will hang behavior and code reuse off of those objects. 27 . 1Class Objects In a class-based object-oriented language, everything begins with classes. They define what sorts of objects exist in the program and are the factories used to produce new instances. Going bottom-up, we’ll start with their runtime representation and then hook that into the language. By this point, we’re well-acquainted with the process of adding a new object type to the VM. We start with a struct. } ObjClosure; object.h add after struct ObjClosure typedef struct { Obj obj; ObjString* name; } ObjClass; ObjClosure* newClosure(ObjFunction* function); object.h, add after struct ObjClosure After the Obj header, we store the class’s name. This isn’t strictly needed for the user’s program, but it lets us show the name at runtime for things like stack traces. The new type needs a corresponding case in the ObjType enum. typedef enum { object.h in enum ObjType OBJ_CLASS, OBJ_CLOSURE, object.h, in enum ObjType And that type gets a corresponding pair of macros. First, for testing an object’s type: #define OBJ_TYPE(value) (AS_OBJ(value)->type) object.h #define IS_CLASS(value) isObjType(value, OBJ_CLASS) #define IS_CLOSURE(value) isObjType(value, OBJ_CLOSURE) object.h And then for casting a Value to an ObjClass pointer: #define IS_STRING(value) isObjType(value, OBJ_STRING) object.h #define AS_CLASS(value) ((ObjClass*)AS_OBJ(value)) #define AS_CLOSURE(value) ((ObjClosure*)AS_OBJ(value)) object.h The VM creates new class objects using this function: } ObjClass; object.h add after struct ObjClass ObjClass* newClass(ObjString* name); ObjClosure* newClosure(ObjFunction* function); object.h, add after struct ObjClass The implementation lives over here: object.c add after allocateObject() ObjClass* newClass(ObjString* name) { ObjClass* klass = ALLOCATE_OBJ(ObjClass, OBJ_CLASS); klass->name = name; return klass; } object.c, add after allocateObject() Pretty much all boilerplate. It takes in the class’s name as a string and stores it. Every time the user declares a new class, the VM will create a new one of these ObjClass structs to represent it. I named the variable “klass” not just to give the VM a zany preschool “Kidz Korner” feel. It makes it easier to get clox compiling as C++ where “class” is a reserved word. When the VM no longer needs a class, it frees it like so: switch (object->type) { memory.c in freeObject() case OBJ_CLASS: { FREE(ObjClass, object); break; } case OBJ_CLOSURE: { memory.c, in freeObject() The braces here are pointless now, but will be useful in the next chapter when we add some more code to the switch case. We have a memory manager now, so we also need to support tracing through class objects. switch (object->type) { memory.c in blackenObject() case OBJ_CLASS: { ObjClass* klass = (ObjClass*)object; markObject((Obj*)klass->name); break; } case OBJ_CLOSURE: { memory.c, in blackenObject() When the GC reaches a class object, it marks the class’s name to keep that string alive too. The last operation the VM can perform on a class is printing it. switch (OBJ_TYPE(value)) { object.c in printObject() case OBJ_CLASS: printf("%s", AS_CLASS(value)->name->chars); break; case OBJ_CLOSURE: object.c, in printObject() A class simply says its own name. 27 . 2Class Declarations Runtime representation in hand, we are ready to add support for classes to the language. Next, we move into the parser. static void declaration() { compiler.c in declaration() replace 1 line if (match(TOKEN_CLASS)) { classDeclaration(); } else if (match(TOKEN_FUN)) { funDeclaration(); compiler.c, in declaration(), replace 1 line Class declarations are statements, and the parser recognizes one by the leading class keyword. The rest of the compilation happens over here: compiler.c add after function() static void classDeclaration() { consume(TOKEN_IDENTIFIER, "Expect class name."); uint8_t nameConstant = identifierConstant(&parser.previous); declareVariable(); emitBytes(OP_CLASS, nameConstant); defineVariable(nameConstant); consume(TOKEN_LEFT_BRACE, "Expect '{' before class body."); consume(TOKEN_RIGHT_BRACE, "Expect '}' after class body."); } compiler.c, add after function() Immediately after the class keyword is the class’s name. We take that identifier and add it to the surrounding function’s constant table as a string. As you just saw, printing a class shows its name, so the compiler needs to stuff the name string somewhere that the runtime can find. The constant table is the way to do that. The class’s name is also used to bind the class object to a variable of the same name. So we declare a variable with that identifier right after consuming its token. We could have made class declarations be expressions instead of statements—they are essentially a literal that produces a value after all. Then users would have to explicitly bind the class to a variable themselves like: var Pie = class {} Sort of like lambda functions but for classes. But since we generally want classes to be named anyway, it makes sense to treat them as declarations. Next, we emit a new instruction to actually create the class object at runtime. That instruction takes the constant table index of the class’s name as an operand. After that, but before compiling the body of the class, we define the variable for the class’s name. Declaring the variable adds it to the scope, but recall from a previous chapter that we can’t use the variable until it’s defined. For classes, we define the variable before the body. That way, users can refer to the containing class inside the bodies of its own methods. That’s useful for things like factory methods that produce new instances of the class. Finally, we compile the body. We don’t have methods yet, so right now it’s simply an empty pair of braces. Lox doesn’t require fields to be declared in the class, so we’re done with the body—and the parser—for now. The compiler is emitting a new instruction, so let’s define that. OP_RETURN, chunk.h in enum OpCode OP_CLASS, } OpCode; chunk.h, in enum OpCode And add it to the disassembler: case OP_RETURN: return simpleInstruction("OP_RETURN", offset); debug.c in disassembleInstruction() case OP_CLASS: return constantInstruction("OP_CLASS", chunk, offset); default: debug.c, in disassembleInstruction() For such a large-seeming feature, the interpreter support is minimal. break; } vm.c in run() case OP_CLASS: push(OBJ_VAL(newClass(READ_STRING()))); break; } vm.c, in run() We load the string for the class’s name from the constant table and pass that to newClass(). That creates a new class object with the given name. We push that onto the stack and we’re good. If the class is bound to a global variable, then the compiler’s call to defineVariable() will emit code to store that object from the stack into the global variable table. Otherwise, it’s right where it needs to be on the stack for a new local variable. “Local” classes—classes declared inside the body of a function or block, are an unusual concept. Many languages don’t allow them at all. But since Lox is a dynamically typed scripting language, it treats the top level of a program and the bodies of functions and blocks uniformly. Classes are just another kind of declaration, and since you can declare variables and functions inside blocks, you can declare classes in there too. There you have it, our VM supports classes now. You can run this: class Brioche {} print Brioche; Unfortunately, printing is about all you can do with classes, so next is making them more useful. 27 . 3Instances of Classes Classes serve two main purposes in a language: They are how you create new instances. Sometimes this involves a new keyword, other times it’s a method call on the class object, but you usually mention the class by name somehow to get a new instance. They contain methods. These define how all instances of the class behave. We won’t get to methods until the next chapter, so for now we will only worry about the first part. Before classes can create instances, we need a representation for them. } ObjClass; object.h add after struct ObjClass typedef struct { Obj obj; ObjClass* klass; Table fields; } ObjInstance; ObjClass* newClass(ObjString* name); object.h, add after struct ObjClass Instances know their class—each instance has a pointer to the class that it is an instance of. We won’t use this much in this chapter, but it will become critical when we add methods. More important to this chapter is how instances store their state. Lox lets users freely add fields to an instance at runtime. This means we need a storage mechanism that can grow. We could use a dynamic array, but we also want to look up fields by name as quickly as possible. There’s a data structure that’s just perfect for quickly accessing a set of values by name and—even more conveniently—we’ve already implemented it. Each instance stores its fields using a hash table. Being able to freely add fields to an object at runtime is a big practical difference between most dynamic and static languages. Statically typed languages usually require fields to be explicitly declared. This way, the compiler knows exactly what fields each instance has. It can use that to determine the precise amount of memory needed for each instance and the offsets in that memory where each field can be found. In Lox and other dynamic languages, accessing a field is usually a hash table lookup. Constant time, but still pretty heavyweight. In a language like C++, accessing a field is as fast as offsetting a pointer by an integer constant. We only need to add an include, and we’ve got it. #include "chunk.h" object.h #include "table.h" #include "value.h" object.h This new struct gets a new object type. OBJ_FUNCTION, object.h in enum ObjType OBJ_INSTANCE, OBJ_NATIVE, object.h, in enum ObjType I want to slow down a bit here because the Lox language’s notion of “type” and the VM implementation’s notion of “type” brush against each other in ways that can be confusing. Inside the C code that makes clox, there are a number of different types of Obj—ObjString, ObjClosure, etc. Each has its own internal representation and semantics. In the Lox language, users can define their own classes—say Cake and Pie—and then create instances of those classes. From the user’s perspective, an instance of Cake is a different type of object than an instance of Pie. But, from the VM’s perspective, every class the user defines is simply another value of type ObjClass. Likewise, each instance in the user’s program, no matter what class it is an instance of, is an ObjInstance. That one VM object type covers instances of all classes. The two worlds map to each other something like this: Got it? OK, back to the implementation. We also get our usual macros. #define IS_FUNCTION(value) isObjType(value, OBJ_FUNCTION) object.h #define IS_INSTANCE(value) isObjType(value, OBJ_INSTANCE) #define IS_NATIVE(value) isObjType(value, OBJ_NATIVE) object.h And: #define AS_FUNCTION(value) ((ObjFunction*)AS_OBJ(value)) object.h #define AS_INSTANCE(value) ((ObjInstance*)AS_OBJ(value)) #define AS_NATIVE(value) \ object.h Since fields are added after the instance is created, the “constructor” function only needs to know the class. ObjFunction* newFunction(); object.h add after newFunction() ObjInstance* newInstance(ObjClass* klass); ObjNative* newNative(NativeFn function); object.h, add after newFunction() We implement that function here: object.c add after newFunction() ObjInstance* newInstance(ObjClass* klass) { ObjInstance* instance = ALLOCATE_OBJ(ObjInstance, OBJ_INSTANCE); instance->klass = klass; initTable(&instance->fields); return instance; } object.c, add after newFunction() We store a reference to the instance’s class. Then we initialize the field table to an empty hash table. A new baby object is born! At the sadder end of the instance’s lifespan, it gets freed. FREE(ObjFunction, object); break; } memory.c in freeObject() case OBJ_INSTANCE: { ObjInstance* instance = (ObjInstance*)object; freeTable(&instance->fields); FREE(ObjInstance, object); break; } case OBJ_NATIVE: memory.c, in freeObject() The instance owns its field table so when freeing the instance, we also free the table. We don’t explicitly free the entries in the table, because there may be other references to those objects. The garbage collector will take care of those for us. Here we free only the entry array of the table itself. Speaking of the garbage collector, it needs support for tracing through instances. markArray(&function->chunk.constants); break; } memory.c in blackenObject() case OBJ_INSTANCE: { ObjInstance* instance = (ObjInstance*)object; markObject((Obj*)instance->klass); markTable(&instance->fields); break; } case OBJ_UPVALUE: memory.c, in blackenObject() If the instance is alive, we need to keep its class around. Also, we need to keep every object referenced by the instance’s fields. Most live objects that are not roots are reachable because some instance refers to the object in a field. Fortunately, we already have a nice markTable() function to make tracing them easy. Less critical but still important is printing. break; object.c in printObject() case OBJ_INSTANCE: printf("%s instance", AS_INSTANCE(value)->klass->name->chars); break; case OBJ_NATIVE: object.c, in printObject() An instance prints its name followed by “instance”. (The “instance” part is '''
