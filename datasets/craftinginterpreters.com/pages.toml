title = "Methods and Initializers · Crafting Interpreters"
full_description = '''28 Methods and Initializers When you are on the dancefloor, there is nothing to do but dance. Umberto Eco, The Mysterious Flame of Queen Loana It is time for our virtual machine to bring its nascent objects to life with behavior. That means methods and method calls. And, since they are a special kind of method, initializers too. All of this is familiar territory from our previous jlox interpreter. What’s new in this second trip is an important optimization we’ll implement to make method calls over seven times faster than our baseline performance. But before we get to that fun, we gotta get the basic stuff working. 28 . 1Method Declarations We can’t optimize method calls before we have method calls, and we can’t call methods without having methods to call, so we’ll start with declarations. 28 . 1 . 1Representing methods We usually start in the compiler, but let’s knock the object model out first this time. The runtime representation for methods in clox is similar to that of jlox. Each class stores a hash table of methods. Keys are method names, and each value is an ObjClosure for the body of the method. typedef struct { Obj obj; ObjString* name; object.h in struct ObjClass Table methods; } ObjClass; object.h, in struct ObjClass A brand new class begins with an empty method table. klass->name = name; object.c in newClass() initTable(&klass->methods); return klass; object.c, in newClass() The ObjClass struct owns the memory for this table, so when the memory manager deallocates a class, the table should be freed too. case OBJ_CLASS: { memory.c in freeObject() ObjClass* klass = (ObjClass*)object; freeTable(&klass->methods); FREE(ObjClass, object); memory.c, in freeObject() Speaking of memory managers, the GC needs to trace through classes into the method table. If a class is still reachable (likely through some instance), then all of its methods certainly need to stick around too. markObject((Obj*)klass->name); memory.c in blackenObject() markTable(&klass->methods); break; memory.c, in blackenObject() We use the existing markTable() function, which traces through the key string and value in each table entry. Storing a class’s methods is pretty familiar coming from jlox. The different part is how that table gets populated. Our previous interpreter had access to the entire AST node for the class declaration and all of the methods it contained. At runtime, the interpreter simply walked that list of declarations. Now every piece of information the compiler wants to shunt over to the runtime has to squeeze through the interface of a flat series of bytecode instructions. How do we take a class declaration, which can contain an arbitrarily large set of methods, and represent it as bytecode? Let’s hop over to the compiler and find out. 28 . 1 . 2Compiling method declarations The last chapter left us with a compiler that parses classes but allows only an empty body. Now we insert a little code to compile a series of method declarations between the braces. consume(TOKEN_LEFT_BRACE, "Expect '{' before class body."); compiler.c in classDeclaration() while (!check(TOKEN_RIGHT_BRACE) && !check(TOKEN_EOF)) { method(); } consume(TOKEN_RIGHT_BRACE, "Expect '}' after class body."); compiler.c, in classDeclaration() Lox doesn’t have field declarations, so anything before the closing brace at the end of the class body must be a method. We stop compiling methods when we hit that final curly or if we reach the end of the file. The latter check ensures our compiler doesn’t get stuck in an infinite loop if the user accidentally forgets the closing brace. The tricky part with compiling a class declaration is that a class may declare any number of methods. Somehow the runtime needs to look up and bind all of them. That would be a lot to pack into a single OP_CLASS instruction. Instead, the bytecode we generate for a class declaration will split the process into a series of instructions. The compiler already emits an OP_CLASS instruction that creates a new empty ObjClass object. Then it emits instructions to store the class in a variable with its name. We did something similar for closures. The OP_CLOSURE instruction needs to know the type and index for each captured upvalue. We encoded that using a series of pseudo-instructions following the main OP_CLOSURE instruction—basically a variable number of operands. The VM processes all of those extra bytes immediately when interpreting the OP_CLOSURE instruction. Here our approach is a little different because from the VM’s perspective, each instruction to define a method is a separate stand-alone operation. Either approach would work. A variable-sized pseudo-instruction is possibly marginally faster, but class declarations are rarely in hot loops, so it doesn’t matter much. Now, for each method declaration, we emit a new OP_METHOD instruction that adds a single method to that class. When all of the OP_METHOD instructions have executed, we’re left with a fully formed class. While the user sees a class declaration as a single atomic operation, the VM implements it as a series of mutations. To define a new method, the VM needs three things: The name of the method. The closure for the method body. The class to bind the method to. We’ll incrementally write the compiler code to see how those all get through to the runtime, starting here: compiler.c add after function() static void method() { consume(TOKEN_IDENTIFIER, "Expect method name."); uint8_t constant = identifierConstant(&parser.previous); emitBytes(OP_METHOD, constant); } compiler.c, add after function() Like OP_GET_PROPERTY and other instructions that need names at runtime, the compiler adds the method name token’s lexeme to the constant table, getting back a table index. Then we emit an OP_METHOD instruction with that index as the operand. That’s the name. Next is the method body: uint8_t constant = identifierConstant(&parser.previous); compiler.c in method() FunctionType type = TYPE_FUNCTION; function(type); emitBytes(OP_METHOD, constant); compiler.c, in method() We use the same function() helper that we wrote for compiling function declarations. That utility function compiles the subsequent parameter list and function body. Then it emits the code to create an ObjClosure and leave it on top of the stack. At runtime, the VM will find the closure there. Last is the class to bind the method to. Where can the VM find that? Unfortunately, by the time we reach the OP_METHOD instruction, we don’t know where it is. It could be on the stack, if the user declared the class in a local scope. But a top-level class declaration ends up with the ObjClass in the global variable table. If Lox supported declaring classes only at the top level, the VM could assume that any class could be found by looking it up directly from the global variable table. Alas, because we support local classes, we need to handle that case too. Fear not. The compiler does know the name of the class. We can capture it right after we consume its token. consume(TOKEN_IDENTIFIER, "Expect class name."); compiler.c in classDeclaration() Token className = parser.previous; uint8_t nameConstant = identifierConstant(&parser.previous); compiler.c, in classDeclaration() And we know that no other declaration with that name could possibly shadow the class. So we do the easy fix. Before we start binding methods, we emit whatever code is necessary to load the class back on top of the stack. defineVariable(nameConstant); compiler.c in classDeclaration() namedVariable(className, false); consume(TOKEN_LEFT_BRACE, "Expect '{' before class body."); compiler.c, in classDeclaration() Right before compiling the class body, we call namedVariable(). That helper function generates code to load a variable with the given name onto the stack. Then we compile the methods. The preceding call to defineVariable() pops the class, so it seems silly to call namedVariable() to load it right back onto the stack. Why not simply leave it on the stack in the first place? We could, but in the next chapter we will insert code between these two calls to support inheritance. At that point, it will be simpler if the class isn’t sitting around on the stack. This means that when we execute each OP_METHOD instruction, the stack has the method’s closure on top with the class right under it. Once we’ve reached the end of the methods, we no longer need the class and tell the VM to pop it off the stack. consume(TOKEN_RIGHT_BRACE, "Expect '}' after class body."); compiler.c in classDeclaration() emitByte(OP_POP); } compiler.c, in classDeclaration() Putting all of that together, here is an example class declaration to throw at the compiler: class Brunch { bacon() {} eggs() {} } Given that, here is what the compiler generates and how those instructions affect the stack at runtime: All that remains for us is to implement the runtime for that new OP_METHOD instruction. 28 . 1 . 3Executing method declarations First we define the opcode. OP_CLASS, chunk.h in enum OpCode OP_METHOD } OpCode; chunk.h, in enum OpCode We disassemble it like other instructions that have string constant operands. case OP_CLASS: return constantInstruction("OP_CLASS", chunk, offset); debug.c in disassembleInstruction() case OP_METHOD: return constantInstruction("OP_METHOD", chunk, offset); default: debug.c, in disassembleInstruction() And over in the interpreter, we add a new case too. break; vm.c in run() case OP_METHOD: defineMethod(READ_STRING()); break; } vm.c, in run() There, we read the method name from the constant table and pass it here: vm.c add after closeUpvalues() static void defineMethod(ObjString* name) { Value method = peek(0); ObjClass* klass = AS_CLASS(peek(1)); tableSet(&klass->methods, name, method); pop(); } vm.c, add after closeUpvalues() The method closure is on top of the stack, above the class it will be bound to. We read those two stack slots and store the closure in the class’s method table. Then we pop the closure since we’re done with it. Note that we don’t do any runtime type checking on the closure or class object. That AS_CLASS() call is safe because the compiler itself generated the code that causes the class to be in that stack slot. The VM trusts its own compiler. The VM trusts that the instructions it executes are valid because the only way to get code to the bytecode interpreter is by going through clox’s own compiler. Many bytecode VMs, like the JVM and CPython, support executing bytecode that has been compiled separately. That leads to a different security story. Maliciously crafted bytecode could crash the VM or worse. To prevent that, the JVM does a bytecode verification pass before it executes any loaded code. CPython says it’s up to the user to ensure any bytecode they run is safe. After the series of OP_METHOD instructions is done and the OP_POP has popped the class, we will have a class with a nicely populated method table, ready to start doing things. The next step is pulling those methods back out and using them. 28 . 2Method References Most of the time, methods are accessed and immediately called, leading to this familiar syntax: instance.method(argument); But remember, in Lox and some other languages, those two steps are distinct and can be separated. var closure = instance.method; closure(argument); Since users can separate the operations, we have to implement them separately. The first step is using our existing dotted property syntax to access a method defined on the instance’s class. That should return some kind of object that the user can then call like a function. The obvious approach is to look up the method in the class’s method table and return the ObjClosure associated with that name. But we also need to remember that when you access a method, this gets bound to the instance the method was accessed from. Here’s the example from when we added methods to jlox: class Person { sayName() { print this.name; } } var jane = Person(); jane.name = "Jane"; var method = jane.sayName; method(); // ? This should print “Jane”, so the object returned by .sayName somehow needs to remember the instance it was accessed from when it later gets called. In jlox, we implemented that “memory” using the interpreter’s existing heap-allocated Environment class, which handled all variable storage. Our bytecode VM has a more complex architecture for storing state. Local variables and temporaries are on the stack, globals are in a hash table, and variables in closures use upvalues. That necessitates a somewhat more complex solution for tracking a method’s receiver in clox, and a new runtime type. 28 . 2 . 1Bound methods When the user executes a method access, we’ll find the closure for that method and wrap it in a new “bound method” object that tracks the instance that the method was accessed from. This bound object can be called later like a function. When invoked, the VM will do some shenanigans to wire up this to point to the receiver inside the method’s body. I took the name “bound method” from CPython. Python behaves similar to Lox here, and I used its implementation for inspiration. Here’s the new object type: } ObjInstance; object.h add after struct ObjInstance typedef struct { Obj obj; Value receiver; ObjClosure* method; } ObjBoundMethod; ObjClass* newClass(ObjString* name); object.h, add after struct ObjInstance It wraps the receiver and the method closure together. The receiver’s type is Value even though methods can be called only on ObjInstances. Since the VM doesn’t care what kind of receiver it has anyway, using Value means we don’t have to keep converting the pointer back to a Value when it gets passed to more general functions. The new struct implies the usual boilerplate you’re used to by now. A new case in the object type enum: typedef enum { object.h in enum ObjType OBJ_BOUND_METHOD, OBJ_CLASS, object.h, in enum ObjType A macro to check a value’s type: #define OBJ_TYPE(value) (AS_OBJ(value)->type) object.h #define IS_BOUND_METHOD(value) isObjType(value, OBJ_BOUND_METHOD) #define IS_CLASS(value) isObjType(value, OBJ_CLASS) object.h Another macro to cast the value to an ObjBoundMethod pointer: #define IS_STRING(value) isObjType(value, OBJ_STRING) object.h #define AS_BOUND_METHOD(value) ((ObjBoundMethod*)AS_OBJ(value)) #define AS_CLASS(value) ((ObjClass*)AS_OBJ(value)) object.h A function to create a new ObjBoundMethod: } ObjBoundMethod; object.h add after struct ObjBoundMethod ObjBoundMethod* newBoundMethod(Value receiver, ObjClosure* method); ObjClass* newClass(ObjString* name); object.h, add after struct ObjBoundMethod And an implementation of that function here: object.c add after allocateObject() ObjBoundMethod* newBoundMethod(Value receiver, ObjClosure* method) { ObjBoundMethod* bound = ALLOCATE_OBJ(ObjBoundMethod, OBJ_BOUND_METHOD); bound->receiver = receiver; bound->method = method; return bound; } object.c, add after allocateObject() The constructor-like function simply stores the given closure and receiver. When t'''
