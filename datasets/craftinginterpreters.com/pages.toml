title = "Garbage Collection · Crafting Interpreters"
full_description = '26 Garbage Collection I wanna, I wanna, I wanna, I wanna, I wanna be trash. The Whip, “Trash” We say Lox is a “high-level” language because it frees programmers from worrying about details irrelevant to the problem they’re solving. The user becomes an executive, giving the machine abstract goals and letting the lowly computer figure out how to get there. Dynamic memory allocation is a perfect candidate for automation. It’s necessary for a working program, tedious to do by hand, and yet still error-prone. The inevitable mistakes can be catastrophic, leading to crashes, memory corruption, or security violations. It’s the kind of risky-yet-boring work that machines excel at over humans. This is why Lox is a managed language, which means that the language implementation manages memory allocation and freeing on the user’s behalf. When a user performs an operation that requires some dynamic memory, the VM automatically allocates it. The programmer never worries about deallocating anything. The machine ensures any memory the program is using sticks around as long as needed. Lox provides the illusion that the computer has an infinite amount of memory. Users can allocate and allocate and allocate and never once think about where all these bytes are coming from. Of course, computers do not yet have infinite memory. So the way managed languages maintain this illusion is by going behind the programmer’s back and reclaiming memory that the program no longer needs. The component that does this is called a garbage collector. Recycling would really be a better metaphor for this. The GC doesn’t throw away the memory, it reclaims it to be reused for new data. But managed languages are older than Earth Day, so the inventors went with the analogy they knew. 26 . 1Reachability This raises a surprisingly difficult question: how does a VM tell what memory is not needed? Memory is only needed if it is read in the future, but short of having a time machine, how can an implementation tell what code the program will execute and which data it will use? Spoiler alert: VMs cannot travel into the future. Instead, the language makes a conservative approximation: it considers a piece of memory to still be in use if it could possibly be read in the future. I’m using “conservative” in the general sense. There is such a thing as a “conservative garbage collector” which means something more specific. All garbage collectors are “conservative” in that they keep memory alive if it could be accessed, instead of having a Magic 8-Ball that lets them more precisely know what data will be accessed. A conservative GC is a special kind of collector that considers any piece of memory to be a pointer if the value in there looks like it could be an address. This is in contrast to a precise GC—which is what we’ll implement—that knows exactly which words in memory are pointers and which store other kinds of values like numbers or strings. That sounds too conservative. Couldn’t any bit of memory potentially be read? Actually, no, at least not in a memory-safe language like Lox. Here’s an example: var a = "first value"; a = "updated"; // GC here. print a; Say we run the GC after the assignment has completed on the second line. The string “first value” is still sitting in memory, but there is no way for the user’s program to ever get to it. Once a got reassigned, the program lost any reference to that string. We can safely free it. A value is reachable if there is some way for a user program to reference it. Otherwise, like the string “first value” here, it is unreachable. Many values can be directly accessed by the VM. Take a look at: var global = "string"; { var local = "another"; print global + local; } Pause the program right after the two strings have been concatenated but before the print statement has executed. The VM can reach "string" by looking through the global variable table and finding the entry for global. It can find "another" by walking the value stack and hitting the slot for the local variable local. It can even find the concatenated string "stringanother" since that temporary value is also sitting on the VM’s stack at the point when we paused our program. All of these values are called roots. A root is any object that the VM can reach directly without going through a reference in some other object. Most roots are global variables or on the stack, but as we’ll see, there are a couple of other places the VM stores references to objects that it can find. Other values can be found by going through a reference inside another value. Fields on instances of classes are the most obvious case, but we don’t have those yet. Even without those, our VM still has indirect references. Consider: We’ll get there soon, though! fun makeClosure() { var a = "data"; fun f() { print a; } return f; } { var closure = makeClosure(); // GC here. closure(); } Say we pause the program on the marked line and run the garbage collector. When the collector is done and the program resumes, it will call the closure, which will in turn print "data". So the collector needs to not free that string. But here’s what the stack looks like when we pause the program: The "data" string is nowhere on it. It has already been hoisted off the stack and moved into the closed upvalue that the closure uses. The closure itself is on the stack. But to get to the string, we need to trace through the closure and its upvalue array. Since it is possible for the user’s program to do that, all of these indirectly accessible objects are also considered reachable. This gives us an inductive definition of reachability: All roots are reachable. Any object referred to from a reachable object is itself reachable. These are the values that are still “live” and need to stay in memory. Any value that doesn’t meet this definition is fair game for the collector to reap. That recursive pair of rules hints at a recursive algorithm we can use to free up unneeded memory: Starting with the roots, traverse through object references to find the full set of reachable objects. Free all objects not in that set. Many different garbage collection algorithms are in use today, but they all roughly follow that same structure. Some may interleave the steps or mix them, but the two fundamental operations are there. They mostly differ in how they perform each step. If you want to explore other GC algorithms, The Garbage Collection Handbook (Jones, et al.) is the canonical reference. For a large book on such a deep, narrow topic, it is quite enjoyable to read. Or perhaps I have a strange idea of fun. 26 . 2Mark-Sweep Garbage Collection The first managed language was Lisp, the second “high-level” language to be invented, right after Fortran. John McCarthy considered using manual memory management or reference counting, but eventually settled on (and coined) garbage collection—once the program was out of memory, it would go back and find unused storage it could reclaim. In John McCarthy’s “History of Lisp”, he notes: “Once we decided on garbage collection, its actual implementation could be postponed, because only toy examples were being done.” Our choice to procrastinate adding the GC to clox follows in the footsteps of giants. He designed the very first, simplest garbage collection algorithm, called mark-and-sweep or just mark-sweep. Its description fits in three short paragraphs in the initial paper on Lisp. Despite its age and simplicity, the same fundamental algorithm underlies many modern memory managers. Some corners of CS seem to be timeless. As the name implies, mark-sweep works in two phases: Marking: We start with the roots and traverse or trace through all of the objects those roots refer to. This is a classic graph traversal of all of the reachable objects. Each time we visit an object, we mark it in some way. (Implementations differ in how they record the mark.) Sweeping: Once the mark phase completes, every reachable object in the heap has been marked. That means any unmarked object is unreachable and ripe for reclamation. We go through all the unmarked objects and free each one. It looks something like this: A tracing garbage collector is any algorithm that traces through the graph of object references. This is in contrast with reference counting, which has a different strategy for tracking the reachable objects. That’s what we’re gonna implement. Whenever we decide it’s time to reclaim some bytes, we’ll trace everything and mark all the reachable objects, free what didn’t get marked, and then resume the user’s program. 26 . 2 . 1Collecting garbage This entire chapter is about implementing this one function: Of course, we’ll end up adding a bunch of helper functions too. void* reallocate(void* pointer, size_t oldSize, size_t newSize); memory.h add after reallocate() void collectGarbage(); void freeObjects(); memory.h, add after reallocate() We’ll work our way up to a full implementation starting with this empty shell: memory.c add after freeObject() void collectGarbage() { } memory.c, add after freeObject() The first question you might ask is, When does this function get called? It turns out that’s a subtle question that we’ll spend some time on later in the chapter. For now we’ll sidestep the issue and build ourselves a handy diagnostic tool in the process. #define DEBUG_TRACE_EXECUTION common.h #define DEBUG_STRESS_GC #define UINT8_COUNT (UINT8_MAX + 1) common.h We’ll add an optional “stress test” mode for the garbage collector. When this flag is defined, the GC runs as often as it possibly can. This is, obviously, horrendous for performance. But it’s great for flushing out memory management bugs that occur only when a GC is triggered at just the right moment. If every moment triggers a GC, you’re likely to find those bugs. void* reallocate(void* pointer, size_t oldSize, size_t newSize) { memory.c in reallocate() if (newSize > oldSize) { #ifdef DEBUG_STRESS_GC collectGarbage(); #endif } if (newSize == 0) { memory.c, in reallocate() Whenever we call reallocate() to acquire more memory, we force a collection to run. The if check is because reallocate() is also called to free or shrink an allocation. We don’t want to trigger a GC for that—in particular because the GC itself will call reallocate() to free memory. Collecting right before allocation is the classic way to wire a GC into a VM. You’re already calling into the memory manager, so it’s an easy place to hook in the code. Also, allocation is the only time when you really need some freed up memory so that you can reuse it. If you don’t use allocation to trigger a GC, you have to make sure every possible place in code where you can loop and allocate memory also has a way to trigger the collector. Otherwise, the VM can get into a starved state where it needs more memory but never collects any. More sophisticated collectors might run on a separate thread or be interleaved periodically during program execution—often at function call boundaries or when a backward jump occurs. 26 . 2 . 2Debug logging While we’re on the subject of diagnostics, let’s put some more in. A real challenge I’ve found with garbage collectors is that they are opaque. We’ve been running lots of Lox programs just fine without any GC at all so far. Once we add one, how do we tell if it’s doing anything useful? Can we tell only if we write programs that plow through acres of memory? How do we debug that? An easy way to shine a light into the GC’s inner workings is with some logging. #define DEBUG_STRESS_GC common.h #define DEBUG_LOG_GC #define UINT8_COUNT (UINT8_MAX + 1) common.h When this is enabled, clox prints information to the console when it does something with dynamic memory. We need a couple of includes. #include "vm.h" memory.c #ifdef DEBUG_LOG_GC #include <stdio.h> #include "debug.h" #endif void* reallocate(void* pointer, size_t oldSize, size_t newSize) { memory.c We don’t have a collector yet, but we can start putting in some of the logging now. We’ll want to know when a collection run starts. void collectGarbage() { memory.c in collectGarbage() #ifdef DEBUG_LOG_GC printf("-- gc begin\n"); #endif } memory.c, in collectGarbage() Eventually we will log some other operations during the collection, so we’ll also want to know when the show’s over. printf("-- gc begin\n"); #endif memory.c in collectGarbage() #ifdef DEBUG_LOG_GC printf("-- gc end\n"); #endif } memory.c, in collectGarbage() We don’t have any code for the collector yet, but we do have functions for allocating and freeing, so we can instrument those now. vm.objects = object; object.c in allocateObject() #ifdef DEBUG_LOG_GC printf("%p allocate %zu for %d\n", (void*)object, size, type); #endif return object; object.c, in allocateObject() And at the end of an object’s lifespan: static void freeObject(Obj* object) { memory.c in freeObject() #ifdef DEBUG_LOG_GC printf("%p free type %d\n", (void*)object, object->type); #endif switch (object->type) { memory.c, in freeObject() With these two flags, we should be able to see that we’re making progress as we work through the rest of the chapter. 26 . 3Marking the Roots Objects are scattered across the heap like stars in the inky night sky. A reference from one object to another forms a connection, and these constellations are the graph that the mark phase traverses. Marking begins at the roots. #ifdef DEBUG_LOG_GC printf("-- gc begin\n"); #endif memory.c in collectGarbage() markRoots(); #ifdef DEBUG_LOG_GC memory.c, in collectGarbage() Most roots are local variables or temporaries sitting right in the VM’s stack, so we start by walking that. memory.c add after freeObject() static void markRoots() { for (Value* slot = vm.stack; slot < vm.stackTop; slot++) { markValue(*slot); } } memory.c, add after freeObject() To mark a Lox value, we use this new function: void* reallocate(void* pointer, size_t oldSize, size_t newSize); memory.h add after reallocate() void markValue(Value value); void collectGarbage(); memory.h, add after reallocate() Its implementation is here: memory.c add after reallocate() void markValue(Value value) { if (IS_OBJ(value)) markObject(AS_OBJ(value)); } memory.c, add after reallocate() Some Lox values—numbers, Booleans, and nil—are stored directly inline in Value and require no heap allocation. The garbage collector doesn’t need to worry about them at all, so the first thing we do is ensure that the value is an actual heap object. If so, the real work happens in this function: void* reallocate(void* pointer, size_t oldSize, size_t newSize); memory.h add after reallocate() void markObject(Obj* object); void markValue(Value value); memory.h, add after reallocate() Which is defined here: memory.c add after reallocate() void markObject(Obj* object) { if (object == NULL) return; object->isMarked = true; } memory.c, add after reallocate() The NULL check is unnecessary when called from markValue(). A Lox Value that is some kind of Obj type will always have a valid pointer. But later we'
