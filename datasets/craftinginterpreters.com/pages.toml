["https://craftinginterpreters.com/compiling-expressions.html"]
title = "Compiling Expressions · Crafting Interpreters"
full_description = '''17 Compiling Expressions In the middle of the journey of our life I found myself within a dark woods where the straight way was lost. Dante Alighieri, Inferno This chapter is exciting for not one, not two, but three reasons. First, it provides the final segment of our VM’s execution pipeline. Once in place, we can plumb the user’s source code from scanning all the way through to executing it. Second, we get to write an actual, honest-to-God compiler. It parses source code and outputs a low-level series of binary instructions. Sure, it’s bytecode and not some chip’s native instruction set, but it’s way closer to the metal than jlox was. We’re about to be real language hackers. Bytecode was good enough for Niklaus Wirth, and no one questions his street cred. Third and finally, I get to show you one of my absolute favorite algorithms: Vaughan Pratt’s “top-down operator precedence parsing”. It’s the most elegant way I know to parse expressions. It gracefully handles prefix operators, postfix, infix, mixfix, any kind of -fix you got. It deals with precedence and associativity without breaking a sweat. I love it. Pratt parsers are a sort of oral tradition in industry. No compiler or language book I’ve read teaches them. Academia is very focused on generated parsers, and Pratt’s technique is for handwritten ones, so it gets overlooked. But in production compilers, where hand-rolled parsers are common, you’d be surprised how many people know it. Ask where they learned it, and it’s always, “Oh, I worked on this compiler years ago and my coworker said they took it from this old front end . . . ” As usual, before we get to the fun stuff, we’ve got some preliminaries to work through. You have to eat your vegetables before you get dessert. First, let’s ditch that temporary scaffolding we wrote for testing the scanner and replace it with something more useful. InterpretResult interpret(const char* source) { vm.c in interpret() replace 2 lines Chunk chunk; initChunk(&chunk); if (!compile(source, &chunk)) { freeChunk(&chunk); return INTERPRET_COMPILE_ERROR; } vm.chunk = &chunk; vm.ip = vm.chunk->code; InterpretResult result = run(); freeChunk(&chunk); return result; } vm.c, in interpret(), replace 2 lines We create a new empty chunk and pass it over to the compiler. The compiler will take the user’s program and fill up the chunk with bytecode. At least, that’s what it will do if the program doesn’t have any compile errors. If it does encounter an error, compile() returns false and we discard the unusable chunk. Otherwise, we send the completed chunk over to the VM to be executed. When the VM finishes, we free the chunk and we’re done. As you can see, the signature to compile() is different now. #define clox_compiler_h compiler.h replace 1 line #include "vm.h" bool compile(const char* source, Chunk* chunk); #endif compiler.h, replace 1 line We pass in the chunk where the compiler will write the code, and then compile() returns whether or not compilation succeeded. We make the same change to the signature in the implementation. #include "scanner.h" compiler.c function compile() replace 1 line bool compile(const char* source, Chunk* chunk) { initScanner(source); compiler.c, function compile(), replace 1 line That call to initScanner() is the only line that survives this chapter. Rip out the temporary code we wrote to test the scanner and replace it with these three lines: initScanner(source); compiler.c in compile() replace 13 lines advance(); expression(); consume(TOKEN_EOF, "Expect end of expression."); } compiler.c, in compile(), replace 13 lines The call to advance() “primes the pump” on the scanner. We’ll see what it does soon. Then we parse a single expression. We aren’t going to do statements yet, so that’s the only subset of the grammar we support. We’ll revisit this when we add statements in a few chapters. After we compile the expression, we should be at the end of the source code, so we check for the sentinel EOF token. We’re going to spend the rest of the chapter making this function work, especially that little expression() call. Normally, we’d dive right into that function definition and work our way through the implementation from top to bottom. This chapter is different. Pratt’s parsing technique is remarkably simple once you have it all loaded in your head, but it’s a little tricky to break into bite-sized pieces. It’s recursive, of course, which is part of the problem. But it also relies on a big table of data. As we build up the algorithm, that table grows additional columns. If this chapter isn’t clicking with you and you’d like another take on the concepts, I wrote an article that teaches the same algorithm but using Java and an object-oriented style: “Pratt Parsing: Expression Parsing Made Easy”. I don’t want to revisit 40-something lines of code each time we extend the table. So we’re going to work our way into the core of the parser from the outside and cover all of the surrounding bits before we get to the juicy center. This will require a little more patience and mental scratch space than most chapters, but it’s the best I could do. 17 . 1Single-Pass Compilation A compiler has roughly two jobs. It parses the user’s source code to understand what it means. Then it takes that knowledge and outputs low-level instructions that produce the same semantics. Many languages split those two roles into two separate passes in the implementation. A parser produces an AST—just like jlox does—and then a code generator traverses the AST and outputs target code. In fact, most sophisticated optimizing compilers have a heck of a lot more than two passes. Determining not just what optimization passes to have, but how to order them to squeeze the most performance out of the compiler—since the optimizations often interact in complex ways—is somewhere between an “open area of research” and a “dark art”. In clox, we’re taking an old-school approach and merging these two passes into one. Back in the day, language hackers did this because computers literally didn’t have enough memory to store an entire source file’s AST. We’re doing it because it keeps our compiler simpler, which is a real asset when programming in C. Single-pass compilers like we’re going to build don’t work well for all languages. Since the compiler has only a peephole view into the user’s program while generating code, the language must be designed such that you don’t need much surrounding context to understand a piece of syntax. Fortunately, tiny, dynamically typed Lox is well-suited to that. Not that this should come as much of a surprise. I did design the language specifically for this book after all. What this means in practical terms is that our “compiler” C module has functionality you’ll recognize from jlox for parsing—consuming tokens, matching expected token types, etc. And it also has functions for code gen—emitting bytecode and adding constants to the destination chunk. (And it means I’ll use “parsing” and “compiling” interchangeably throughout this and later chapters.) We’ll build the parsing and code generation halves first. Then we’ll stitch them together with the code in the middle that uses Pratt’s technique to parse Lox’s particular grammar and output the right bytecode. 17 . 2Parsing Tokens First up, the front half of the compiler. This function’s name should sound familiar. #include "scanner.h" compiler.c static void advance() { parser.previous = parser.current; for (;;) { parser.current = scanToken(); if (parser.current.type != TOKEN_ERROR) break; errorAtCurrent(parser.current.start); } } compiler.c Just like in jlox, it steps forward through the token stream. It asks the scanner for the next token and stores it for later use. Before doing that, it takes the old current token and stashes that in a previous field. That will come in handy later so that we can get at the lexeme after we match a token. The code to read the next token is wrapped in a loop. Remember, clox’s scanner doesn’t report lexical errors. Instead, it creates special error tokens and leaves it up to the parser to report them. We do that here. We keep looping, reading tokens and reporting the errors, until we hit a non-error one or reach the end. That way, the rest of the parser sees only valid tokens. The current and previous token are stored in this struct: #include "scanner.h" compiler.c typedef struct { Token current; Token previous; } Parser; Parser parser; static void advance() { compiler.c Like we did in other modules, we have a single global variable of this struct type so we don’t need to pass the state around from function to function in the compiler. 17 . 2 . 1Handling syntax errors If the scanner hands us an error token, we need to actually tell the user. That happens using this: compiler.c add after variable parser static void errorAtCurrent(const char* message) { errorAt(&parser.current, message); } compiler.c, add after variable parser We pull the location out of the current token in order to tell the user where the error occurred and forward it to errorAt(). More often, we’ll report an error at the location of the token we just consumed, so we give the shorter name to this other function: compiler.c add after variable parser static void error(const char* message) { errorAt(&parser.previous, message); } compiler.c, add after variable parser The actual work happens here: compiler.c add after variable parser static void errorAt(Token* token, const char* message) { fprintf(stderr, "[line %d] Error", token->line); if (token->type == TOKEN_EOF) { fprintf(stderr, " at end"); } else if (token->type == TOKEN_ERROR) { // Nothing. } else { fprintf(stderr, " at '%.*s'", token->length, token->start); } fprintf(stderr, ": %s\n", message); parser.hadError = true; } compiler.c, add after variable parser First, we print where the error occurred. We try to show the lexeme if it’s human-readable. Then we print the error message itself. After that, we set this hadError flag. That records whether any errors occurred during compilation. This field also lives in the parser struct. Token previous; compiler.c in struct Parser bool hadError; } Parser; compiler.c, in struct Parser Earlier I said that compile() should return false if an error occurred. Now we can make it do that. consume(TOKEN_EOF, "Expect end of expression."); compiler.c in compile() return !parser.hadError; } compiler.c, in compile() I’ve got another flag to introduce for error handling. We want to avoid error cascades. If the user has a mistake in their code and the parser gets confused about where it is in the grammar, we don’t want it to spew out a whole pile of meaningless knock-on errors after the first one. We fixed that in jlox using panic mode error recovery. In the Java interpreter, we threw an exception to unwind out of all of the parser code to a point where we could skip tokens and resynchronize. We don’t have exceptions in C. Instead, we’ll do a little smoke and mirrors. We add a flag to track whether we’re currently in panic mode. There is setjmp() and longjmp(), but I’d rather not go there. Those make it too easy to leak memory, forget to maintain invariants, or otherwise have a Very Bad Day. bool hadError; compiler.c in struct Parser bool panicMode; } Parser; compiler.c, in struct Parser When an error occurs, we set it. static void errorAt(Token* token, const char* message) { compiler.c in errorAt() parser.panicMode = true; fprintf(stderr, "[line %d] Error", token->line); compiler.c, in errorAt() After that, we go ahead and keep compiling as normal as if the error never occurred. The bytecode will never get executed, so it’s harmless to keep on trucking. The trick is that while the panic mode flag is set, we simply suppress any other errors that get detected. static void errorAt(Token* token, const char* message) { compiler.c in errorAt() if (parser.panicMode) return; parser.panicMode = true; compiler.c, in errorAt() There’s a good chance the parser will go off in the weeds, but the user won’t know because the errors all get swallowed. Panic mode ends when the parser reaches a synchronization point. For Lox, we chose statement boundaries, so when we later add those to our compiler, we’ll clear the flag there. These new fields need to be initialized. initScanner(source); compiler.c in compile() parser.hadError = false; parser.panicMode = false; advance(); compiler.c, in compile() And to display the errors, we need a standard header. #include <stdio.h> compiler.c #include <stdlib.h> #include "common.h" compiler.c There’s one last parsing function, another old friend from jlox. compiler.c add after advance() static void consume(TokenType type, const char* message) { if (parser.current.type == type) { advance(); return; } errorAtCurrent(message); } compiler.c, add after advance() It’s similar to advance() in that it reads the next token. But it also validates that the token has an expected type. If not, it reports an error. This function is the foundation of most syntax errors in the compiler. OK, that’s enough on the front end for now. 17 . 3Emitting Bytecode After we parse and understand a piece of the user’s program, the next step is to translate that to a series of bytecode instructions. It starts with the easiest possible step: appending a single byte to the chunk. compiler.c add after consume() static void emitByte(uint8_t byte) { writeChunk(currentChunk(), byte, parser.previous.line); } compiler.c, add after consume() It’s hard to believe great things will flow through such a simple function. It writes the given byte, which may be an opcode or an operand to an instruction. It sends in the previous token’s line information so that runtime errors are associated with that line. The chunk that we’re writing gets passed into compile(), but it needs to make its way to emitByte(). To do that, we rely on this intermediary function: Parser parser; compiler.c add after variable parser Chunk* compilingChunk; static Chunk* currentChunk() { return compilingChunk; } static void errorAt(Token* token, const char* message) { compiler.c, add after variable parser Right now, the chunk pointer is stored in a module-level variable like we store other global state. Later, when we start compiling user-defined functions, the notion of “current chunk” gets more complicated. To avoid having to go back and change a lot of code, I encapsulate that logic in the currentChunk() function. We initialize this new module variable before we write any bytecode: bool compile(const char* source, Chunk* chunk) { initScanner(source); compiler.c in compile() compilingChunk = chunk; parser.hadError = false; compiler.c, in compile() Then, at the very end, when we’re done compiling the chunk, we wrap things up. consume(TOKEN_EOF, "Expect end of expression."); compiler.c in compile() endCompiler(); return !parser.hadError; compiler.c, in compile() That calls this: compiler.c add after emitByte() static void endCompiler() { emitReturn(); } compi'''
