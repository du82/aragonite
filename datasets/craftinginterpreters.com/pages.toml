title = "Jumping Back and Forth · Crafting Interpreters"
full_description = '''23 Jumping Back and Forth The order that our mind imagines is like a net, or like a ladder, built to attain something. But afterward you must throw the ladder away, because you discover that, even if it was useful, it was meaningless. Umberto Eco, The Name of the Rose It’s taken a while to get here, but we’re finally ready to add control flow to our virtual machine. In the tree-walk interpreter we built for jlox, we implemented Lox’s control flow in terms of Java’s. To execute a Lox if statement, we used a Java if statement to run the chosen branch. That works, but isn’t entirely satisfying. By what magic does the JVM itself or a native CPU implement if statements? Now that we have our own bytecode VM to hack on, we can answer that. When we talk about “control flow”, what are we referring to? By “flow” we mean the way execution moves through the text of the program. Almost like there is a little robot inside the computer wandering through our code, executing bits and pieces here and there. Flow is the path that robot takes, and by controlling the robot, we drive which pieces of code it executes. In jlox, the robot’s locus of attention—the current bit of code—was implicit based on which AST nodes were stored in various Java variables and what Java code we were in the middle of running. In clox, it is much more explicit. The VM’s ip field stores the address of the current bytecode instruction. The value of that field is exactly “where we are” in the program. Execution proceeds normally by incrementing the ip. But we can mutate that variable however we want to. In order to implement control flow, all that’s necessary is to change the ip in more interesting ways. The simplest control flow construct is an if statement with no else clause: if (condition) print("condition was truthy"); The VM evaluates the bytecode for the condition expression. If the result is truthy, then it continues along and executes the print statement in the body. The interesting case is when the condition is falsey. When that happens, execution skips over the then branch and proceeds to the next statement. To skip over a chunk of code, we simply set the ip field to the address of the bytecode instruction following that code. To conditionally skip over some code, we need an instruction that looks at the value on top of the stack. If it’s falsey, it adds a given offset to the ip to jump over a range of instructions. Otherwise, it does nothing and lets execution proceed to the next instruction as usual. When we compile to bytecode, the explicit nested block structure of the code evaporates, leaving only a flat series of instructions behind. Lox is a structured programming language, but clox bytecode isn’t. The right—or wrong, depending on how you look at it—set of bytecode instructions could jump into the middle of a block, or from one scope into another. The VM will happily execute that, even if the result leaves the stack in an unknown, inconsistent state. So even though the bytecode is unstructured, we’ll take care to ensure that our compiler only generates clean code that maintains the same structure and nesting that Lox itself does. This is exactly how real CPUs behave. Even though we might program them using higher-level languages that mandate structured control flow, the compiler lowers that down to raw jumps. At the bottom, it turns out goto is the only real control flow. Anyway, I didn’t mean to get all philosophical. The important bit is that if we have that one conditional jump instruction, that’s enough to implement Lox’s if statement, as long as it doesn’t have an else clause. So let’s go ahead and get started with that. 23 . 1If Statements This many chapters in, you know the drill. Any new feature starts in the front end and works its way through the pipeline. An if statement is, well, a statement, so that’s where we hook it into the parser. if (match(TOKEN_PRINT)) { printStatement(); compiler.c in statement() } else if (match(TOKEN_IF)) { ifStatement(); } else if (match(TOKEN_LEFT_BRACE)) { compiler.c, in statement() When we see an if keyword, we hand off compilation to this function: compiler.c add after expressionStatement() static void ifStatement() { consume(TOKEN_LEFT_PAREN, "Expect '(' after 'if'."); expression(); consume(TOKEN_RIGHT_PAREN, "Expect ')' after condition."); int thenJump = emitJump(OP_JUMP_IF_FALSE); statement(); patchJump(thenJump); } compiler.c, add after expressionStatement() Have you ever noticed that the ( after the if keyword doesn’t actually do anything useful? The language would be just as unambiguous and easy to parse without it, like: if condition) print("looks weird"); The closing ) is useful because it separates the condition expression from the body. Some languages use a then keyword instead. But the opening ( doesn’t do anything. It’s just there because unmatched parentheses look bad to us humans. First we compile the condition expression, bracketed by parentheses. At runtime, that will leave the condition value on top of the stack. We’ll use that to determine whether to execute the then branch or skip it. Then we emit a new OP_JUMP_IF_FALSE instruction. It has an operand for how much to offset the ip—how many bytes of code to skip. If the condition is falsey, it adjusts the ip by that amount. Something like this: The boxes with the torn edges here represent the blob of bytecode generated by compiling some sub-clause of a control flow construct. So the “condition expression” box is all of the instructions emitted when we compiled that expression. But we have a problem. When we’re writing the OP_JUMP_IF_FALSE instruction’s operand, how do we know how far to jump? We haven’t compiled the then branch yet, so we don’t know how much bytecode it contains. To fix that, we use a classic trick called backpatching. We emit the jump instruction first with a placeholder offset operand. We keep track of where that half-finished instruction is. Next, we compile the then body. Once that’s done, we know how far to jump. So we go back and replace that placeholder offset with the real one now that we can calculate it. Sort of like sewing a patch onto the existing fabric of the compiled code. We encode this trick into two helper functions. compiler.c add after emitBytes() static int emitJump(uint8_t instruction) { emitByte(instruction); emitByte(0xff); emitByte(0xff); return currentChunk()->count - 2; } compiler.c, add after emitBytes() The first emits a bytecode instruction and writes a placeholder operand for the jump offset. We pass in the opcode as an argument because later we’ll have two different instructions that use this helper. We use two bytes for the jump offset operand. A 16-bit offset lets us jump over up to 65,535 bytes of code, which should be plenty for our needs. Some instruction sets have separate “long” jump instructions that take larger operands for when you need to jump a greater distance. The function returns the offset of the emitted instruction in the chunk. After compiling the then branch, we take that offset and pass it to this: compiler.c add after emitConstant() static void patchJump(int offset) { // -2 to adjust for the bytecode for the jump offset itself. int jump = currentChunk()->count - offset - 2; if (jump > UINT16_MAX) { error("Too much code to jump over."); } currentChunk()->code[offset] = (jump >> 8) & 0xff; currentChunk()->code[offset + 1] = jump & 0xff; } compiler.c, add after emitConstant() This goes back into the bytecode and replaces the operand at the given location with the calculated jump offset. We call patchJump() right before we emit the next instruction that we want the jump to land on, so it uses the current bytecode count to determine how far to jump. In the case of an if statement, that means right after we compile the then branch and before we compile the next statement. That’s all we need at compile time. Let’s define the new instruction. OP_PRINT, chunk.h in enum OpCode OP_JUMP_IF_FALSE, OP_RETURN, chunk.h, in enum OpCode Over in the VM, we get it working like so: break; } vm.c in run() case OP_JUMP_IF_FALSE: { uint16_t offset = READ_SHORT(); if (isFalsey(peek(0))) vm.ip += offset; break; } case OP_RETURN: { vm.c, in run() This is the first instruction we’ve added that takes a 16-bit operand. To read that from the chunk, we use a new macro. #define READ_CONSTANT() (vm.chunk->constants.values[READ_BYTE()]) vm.c in run() #define READ_SHORT() \ (vm.ip += 2, (uint16_t)((vm.ip[-2] << 8) | vm.ip[-1])) #define READ_STRING() AS_STRING(READ_CONSTANT()) vm.c, in run() It yanks the next two bytes from the chunk and builds a 16-bit unsigned integer out of them. As usual, we clean up our macro when we’re done with it. #undef READ_BYTE vm.c in run() #undef READ_SHORT #undef READ_CONSTANT vm.c, in run() After reading the offset, we check the condition value on top of the stack. If it’s falsey, we apply this jump offset to the ip. Otherwise, we leave the ip alone and execution will automatically proceed to the next instruction following the jump instruction. In the case where the condition is falsey, we don’t need to do any other work. We’ve offset the ip, so when the outer instruction dispatch loop turns again, it will pick up execution at that new instruction, past all of the code in the then branch. I said we wouldn’t use C’s if statement to implement Lox’s control flow, but we do use one here to determine whether or not to offset the instruction pointer. But we aren’t really using C for control flow. If we wanted to, we could do the same thing purely arithmetically. Let’s assume we have a function falsey() that takes a Lox Value and returns 1 if it’s falsey or 0 otherwise. Then we could implement the jump instruction like: case OP_JUMP_IF_FALSE: { uint16_t offset = READ_SHORT(); vm.ip += falsey() * offset; break; } The falsey() function would probably use some control flow to handle the different value types, but that’s an implementation detail of that function and doesn’t affect how our VM does its own control flow. Note that the jump instruction doesn’t pop the condition value off the stack. So we aren’t totally done here, since this leaves an extra value floating around on the stack. We’ll clean that up soon. Ignoring that for the moment, we do have a working if statement in Lox now, with only one little instruction required to support it at runtime in the VM. 23 . 1 . 1Else clauses An if statement without support for else clauses is like Morticia Addams without Gomez. So, after we compile the then branch, we look for an else keyword. If we find one, we compile the else branch. patchJump(thenJump); compiler.c in ifStatement() if (match(TOKEN_ELSE)) statement(); } compiler.c, in ifStatement() When the condition is falsey, we’ll jump over the then branch. If there’s an else branch, the ip will land right at the beginning of its code. But that’s not enough, though. Here’s the flow that leads to: If the condition is truthy, we execute the then branch like we want. But after that, execution rolls right on through into the else branch. Oops! When the condition is true, after we run the then branch, we need to jump over the else branch. That way, in either case, we only execute a single branch, like this: To implement that, we need another jump from the end of the then branch. statement(); compiler.c in ifStatement() int elseJump = emitJump(OP_JUMP); patchJump(thenJump); compiler.c, in ifStatement() We patch that offset after the end of the else body. if (match(TOKEN_ELSE)) statement(); compiler.c in ifStatement() patchJump(elseJump); } compiler.c, in ifStatement() After executing the then branch, this jumps to the next statement after the else branch. Unlike the other jump, this jump is unconditional. We always take it, so we need another instruction that expresses that. OP_PRINT, chunk.h in enum OpCode OP_JUMP, OP_JUMP_IF_FALSE, chunk.h, in enum OpCode We interpret it like so: break; } vm.c in run() case OP_JUMP: { uint16_t offset = READ_SHORT(); vm.ip += offset; break; } case OP_JUMP_IF_FALSE: { vm.c, in run() Nothing too surprising here—the only difference is that it doesn’t check a condition and always applies the offset. We have then and else branches working now, so we’re close. The last bit is to clean up that condition value we left on the stack. Remember, each statement is required to have zero stack effect—after the statement is finished executing, the stack should be as tall as it was before. We could have the OP_JUMP_IF_FALSE instruction pop the condition itself, but soon we’ll use that same instruction for the logical operators where we don’t want the condition popped. Instead, we’ll have the compiler emit a couple of explicit OP_POP instructions when compiling an if statement. We need to take care that every execution path through the generated code pops the condition. When the condition is truthy, we pop it right before the code inside the then branch. int thenJump = emitJump(OP_JUMP_IF_FALSE); compiler.c in ifStatement() emitByte(OP_POP); statement(); compiler.c, in ifStatement() Otherwise, we pop it at the beginning of the else branch. patchJump(thenJump); compiler.c in ifStatement() emitByte(OP_POP); if (match(TOKEN_ELSE)) statement(); compiler.c, in ifStatement() This little instruction here also means that every if statement has an implicit else branch even if the user didn’t write an else clause. In the case where they left it off, all the branch does is discard the condition value. The full correct flow looks like this: If you trace through, you can see that it always executes a single branch and ensures the condition is popped first. All that remains is a little disassembler support. return simpleInstruction("OP_PRINT", offset); debug.c in disassembleInstruction() case OP_JUMP: return jumpInstruction("OP_JUMP", 1, chunk, offset); case OP_JUMP_IF_FALSE: return jumpInstruction("OP_JUMP_IF_FALSE", 1, chunk, offset); case OP_RETURN: debug.c, in disassembleInstruction() These two instructions have a new format with a 16-bit operand, so we add a new utility function to disassemble them. debug.c add after byteInstruction() static int jumpInstruction(const char* name, int sign, Chunk* chunk, int offset) { uint16_t jump = (uint16_t)(chunk->code[offset + 1] << 8); jump |= chunk->code[offset + 2]; printf("%-16s %4d -> %d\n", name, offset, offset + 3 + sign * jump); return offset + 3; } debug.c, add after byteInstruction() There we go, that’s one complete control flow construct. If this were an ’80s movie, the montage music would kick in and the rest of the control flow syntax would take care of itself. Alas, the ’80s are long over, so we’ll have to grind it out ourselves. My enduring love of Depeche Mode notwithstanding. 23 . 2Logical Operators You probably remember this from jlox, but the logical operators and and or aren’t just another pair of binary operators like + and -. Because they short-circuit and may not evaluate their right operand depending on the value '''
