title = "Scanning on Demand · Crafting Interpreters"
full_description = '''16 Scanning on Demand Literature is idiosyncratic arrangements in horizontal lines in only twenty-six phonetic symbols, ten Arabic numbers, and about eight punctuation marks. Kurt Vonnegut, Like Shaking Hands With God: A Conversation about Writing Our second interpreter, clox, has three phases—scanner, compiler, and virtual machine. A data structure joins each pair of phases. Tokens flow from scanner to compiler, and chunks of bytecode from compiler to VM. We began our implementation near the end with chunks and the VM. Now, we’re going to hop back to the beginning and build a scanner that makes tokens. In the next chapter, we’ll tie the two ends together with our bytecode compiler. I’ll admit, this is not the most exciting chapter in the book. With two implementations of the same language, there’s bound to be some redundancy. I did sneak in a few interesting differences compared to jlox’s scanner. Read on to see what they are. 16 . 1Spinning Up the Interpreter Now that we’re building the front end, we can get clox running like a real interpreter. No more hand-authored chunks of bytecode. It’s time for a REPL and script loading. Tear out most of the code in main() and replace it with: int main(int argc, const char* argv[]) { initVM(); main.c in main() replace 26 lines if (argc == 1) { repl(); } else if (argc == 2) { runFile(argv[1]); } else { fprintf(stderr, "Usage: clox [path]\n"); exit(64); } freeVM(); return 0; } main.c, in main(), replace 26 lines If you pass no arguments to the executable, you are dropped into the REPL. A single command line argument is understood to be the path to a script to run. The code tests for one and two arguments, not zero and one, because the first argument in argv is always the name of the executable being run. We’ll need a few system headers, so let’s get them all out of the way. main.c add to top of file #include <stdio.h> #include <stdlib.h> #include <string.h> #include "common.h" main.c, add to top of file Next, we get the REPL up and REPL-ing. #include "vm.h" main.c static void repl() { char line[1024]; for (;;) { printf("> "); if (!fgets(line, sizeof(line), stdin)) { printf("\n"); break; } interpret(line); } } main.c A quality REPL handles input that spans multiple lines gracefully and doesn’t have a hardcoded line length limit. This REPL here is a little more, ahem, austere, but it’s fine for our purposes. The real work happens in interpret(). We’ll get to that soon, but first let’s take care of loading scripts. main.c add after repl() static void runFile(const char* path) { char* source = readFile(path); InterpretResult result = interpret(source); free(source); if (result == INTERPRET_COMPILE_ERROR) exit(65); if (result == INTERPRET_RUNTIME_ERROR) exit(70); } main.c, add after repl() We read the file and execute the resulting string of Lox source code. Then, based on the result of that, we set the exit code appropriately because we’re scrupulous tool builders and care about little details like that. We also need to free the source code string because readFile() dynamically allocates it and passes ownership to its caller. That function looks like this: C asks us not just to manage memory explicitly, but mentally. We programmers have to remember the ownership rules and hand-implement them throughout the program. Java just does it for us. C++ gives us tools to encode the policy directly so that the compiler validates it for us. I like C’s simplicity, but we pay a real price for it—the language requires us to be more conscientious. main.c add after repl() static char* readFile(const char* path) { FILE* file = fopen(path, "rb"); fseek(file, 0L, SEEK_END); size_t fileSize = ftell(file); rewind(file); char* buffer = (char*)malloc(fileSize + 1); size_t bytesRead = fread(buffer, sizeof(char), fileSize, file); buffer[bytesRead] = '\0'; fclose(file); return buffer; } main.c, add after repl() Like a lot of C code, it takes more effort than it seems like it should, especially for a language expressly designed for operating systems. The difficult part is that we want to allocate a big enough string to read the whole file, but we don’t know how big the file is until we’ve read it. The code here is the classic trick to solve that. We open the file, but before reading it, we seek to the very end using fseek(). Then we call ftell() which tells us how many bytes we are from the start of the file. Since we seeked (sought?) to the end, that’s the size. We rewind back to the beginning, allocate a string of that size, and read the whole file in a single batch. Well, that size plus one. Always gotta remember to make room for the null byte. So we’re done, right? Not quite. These function calls, like most calls in the C standard library, can fail. If this were Java, the failures would be thrown as exceptions and automatically unwind the stack so we wouldn’t really need to handle them. In C, if we don’t check for them, they silently get ignored. This isn’t really a book on good C programming practice, but I hate to encourage bad style, so let’s go ahead and handle the errors. It’s good for us, like eating our vegetables or flossing. Fortunately, we don’t need to do anything particularly clever if a failure occurs. If we can’t correctly read the user’s script, all we can really do is tell the user and exit the interpreter gracefully. First of all, we might fail to open the file. FILE* file = fopen(path, "rb"); main.c in readFile() if (file == NULL) { fprintf(stderr, "Could not open file \"%s\".\n", path); exit(74); } fseek(file, 0L, SEEK_END); main.c, in readFile() This can happen if the file doesn’t exist or the user doesn’t have access to it. It’s pretty common—people mistype paths all the time. This failure is much rarer: char* buffer = (char*)malloc(fileSize + 1); main.c in readFile() if (buffer == NULL) { fprintf(stderr, "Not enough memory to read \"%s\".\n", path); exit(74); } size_t bytesRead = fread(buffer, sizeof(char), fileSize, file); main.c, in readFile() If we can’t even allocate enough memory to read the Lox script, the user’s probably got bigger problems to worry about, but we should do our best to at least let them know. Finally, the read itself may fail. size_t bytesRead = fread(buffer, sizeof(char), fileSize, file); main.c in readFile() if (bytesRead < fileSize) { fprintf(stderr, "Could not read file \"%s\".\n", path); exit(74); } buffer[bytesRead] = '\0'; main.c, in readFile() This is also unlikely. Actually, the calls to fseek(), ftell(), and rewind() could theoretically fail too, but let’s not go too far off in the weeds, shall we? Even good old printf() can fail. Yup. How many times have you handled that error? 16 . 1 . 1Opening the compilation pipeline We’ve got ourselves a string of Lox source code, so now we’re ready to set up a pipeline to scan, compile, and execute it. It’s driven by interpret(). Right now, that function runs our old hardcoded test chunk. Let’s change it to something closer to its final incarnation. void freeVM(); vm.h function interpret() replace 1 line InterpretResult interpret(const char* source); void push(Value value); vm.h, function interpret(), replace 1 line Where before we passed in a Chunk, now we pass in the string of source code. Here’s the new implementation: vm.c function interpret() replace 4 lines InterpretResult interpret(const char* source) { compile(source); return INTERPRET_OK; } vm.c, function interpret(), replace 4 lines We won’t build the actual compiler yet in this chapter, but we can start laying out its structure. It lives in a new module. #include "common.h" vm.c #include "compiler.h" #include "debug.h" vm.c For now, the one function in it is declared like so: compiler.h create new file #ifndef clox_compiler_h #define clox_compiler_h void compile(const char* source); #endif compiler.h, create new file That signature will change, but it gets us going. The first phase of compilation is scanning—the thing we’re doing in this chapter—so right now all the compiler does is set that up. compiler.c create new file #include <stdio.h> #include "common.h" #include "compiler.h" #include "scanner.h" void compile(const char* source) { initScanner(source); } compiler.c, create new file This will also grow in later chapters, naturally. 16 . 1 . 2The scanner scans There are still a few more feet of scaffolding to stand up before we can start writing useful code. First, a new header: scanner.h create new file #ifndef clox_scanner_h #define clox_scanner_h void initScanner(const char* source); #endif scanner.h, create new file And its corresponding implementation: scanner.c create new file #include <stdio.h> #include <string.h> #include "common.h" #include "scanner.h" typedef struct { const char* start; const char* current; int line; } Scanner; Scanner scanner; scanner.c, create new file As our scanner chews through the user’s source code, it tracks how far it’s gone. Like we did with the VM, we wrap that state in a struct and then create a single top-level module variable of that type so we don’t have to pass it around all of the various functions. There are surprisingly few fields. The start pointer marks the beginning of the current lexeme being scanned, and current points to the current character being looked at. Here, we are in the middle of scanning the identifier bacon. The current character is o and the character we most recently consumed is c. We have a line field to track what line the current lexeme is on for error reporting. That’s it! We don’t even keep a pointer to the beginning of the source code string. The scanner works its way through the code once and is done after that. Since we have some state, we should initialize it. scanner.c add after variable scanner void initScanner(const char* source) { scanner.start = source; scanner.current = source; scanner.line = 1; } scanner.c, add after variable scanner We start at the very first character on the very first line, like a runner crouched at the starting line. 16 . 2A Token at a Time In jlox, when the starting gun went off, the scanner raced ahead and eagerly scanned the whole program, returning a list of tokens. This would be a challenge in clox. We’d need some sort of growable array or list to store the tokens in. We’d need to manage allocating and freeing the tokens, and the collection itself. That’s a lot of code, and a lot of memory churn. At any point in time, the compiler needs only one or two tokens—remember our grammar requires only a single token of lookahead—so we don’t need to keep them all around at the same time. Instead, the simplest solution is to not scan a token until the compiler needs one. When the scanner provides one, it returns the token by value. It doesn’t need to dynamically allocate anything—it can just pass tokens around on the C stack. Unfortunately, we don’t have a compiler yet that can ask the scanner for tokens, so the scanner will just sit there doing nothing. To kick it into action, we’ll write some temporary code to drive it. initScanner(source); compiler.c in compile() int line = -1; for (;;) { Token token = scanToken(); if (token.line != line) { printf("%4d ", token.line); line = token.line; } else { printf(" | "); } printf("%2d '%.*s'\n", token.type, token.length, token.start); if (token.type == TOKEN_EOF) break; } } compiler.c, in compile() That %.*s in the format string is a neat feature. Usually, you set the output precision—the number of characters to show—by placing a number inside the format string. Using * instead lets you pass the precision as an argument. So that printf() call prints the first token.length characters of the string at token.start. We need to limit the length like that because the lexeme points into the original source string and doesn’t have a terminator at the end. This loops indefinitely. Each turn through the loop, it scans one token and prints it. When it reaches a special “end of file” token or an error, it stops. For example, if we run the interpreter on this program: print 1 + 2; It prints out: 1 31 'print' | 21 '1' | 7 '+' | 21 '2' | 8 ';' 2 39 '' The first column is the line number, the second is the numeric value of the token type, and then finally the lexeme. That last empty lexeme on line 2 is the EOF token. Yeah, the raw index of the token type isn’t exactly human readable, but it’s all C gives us. The goal for the rest of the chapter is to make that blob of code work by implementing this key function: void initScanner(const char* source); scanner.h add after initScanner() Token scanToken(); #endif scanner.h, add after initScanner() Each call scans and returns the next token in the source code. A token looks like this: #define clox_scanner_h scanner.h typedef struct { TokenType type; const char* start; int length; int line; } Token; void initScanner(const char* source); scanner.h It’s pretty similar to jlox’s Token class. We have an enum identifying what type of token it is—number, identifier, + operator, etc. The enum is virtually identical to the one in jlox, so let’s just hammer out the whole thing. #ifndef clox_scanner_h #define clox_scanner_h scanner.h typedef enum { // Single-character tokens. TOKEN_LEFT_PAREN, TOKEN_RIGHT_PAREN, TOKEN_LEFT_BRACE, TOKEN_RIGHT_BRACE, TOKEN_COMMA, TOKEN_DOT, TOKEN_MINUS, TOKEN_PLUS, TOKEN_SEMICOLON, TOKEN_SLASH, TOKEN_STAR, // One or two character tokens. TOKEN_BANG, TOKEN_BANG_EQUAL, TOKEN_EQUAL, TOKEN_EQUAL_EQUAL, TOKEN_GREATER, TOKEN_GREATER_EQUAL, TOKEN_LESS, TOKEN_LESS_EQUAL, // Literals. TOKEN_IDENTIFIER, TOKEN_STRING, TOKEN_NUMBER, // Keywords. TOKEN_AND, TOKEN_CLASS, TOKEN_ELSE, TOKEN_FALSE, TOKEN_FOR, TOKEN_FUN, TOKEN_IF, TOKEN_NIL, TOKEN_OR, TOKEN_PRINT, TOKEN_RETURN, TOKEN_SUPER, TOKEN_THIS, TOKEN_TRUE, TOKEN_VAR, TOKEN_WHILE, TOKEN_ERROR, TOKEN_EOF } TokenType; typedef struct { scanner.h Aside from prefixing all the names with TOKEN_ (since C tosses enum names in the top-level namespace) the only difference is that extra TOKEN_ERROR type. What’s that about? There are only a couple of errors that get detected during scanning: unterminated strings and unrecognized characters. In jlox, the scanner reports those itself. In clox, the scanner produces a synthetic “error” token for that error and passes it over to the compiler. This way, the compiler knows an error occurred and can kick off error recovery before reporting it. The novel part in clox’s Token type is how it represents the lexeme. In jlox, each Token stored the lexeme as its own separate little Java string. If we did that for clox, we’d have to figure out how to manage the memory for those strings. That’s especially hard since we pass tokens by value—multiple tokens could point to the same lexeme string. Ownership gets weird. Instead, we use the original source string as our character store. We represent a lexeme by a pointer to its first character and the number of characters it contains. This means we don’t need to worry about managing memory for lexemes at all and we can freely copy tokens around. As l'''
