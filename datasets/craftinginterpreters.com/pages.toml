title = "Closures · Crafting Interpreters"
full_description = '25 Closures As the man said, for every complex problem there’s a simple solution, and it’s wrong. Umberto Eco, Foucault’s Pendulum Thanks to our diligent labor in the last chapter, we have a virtual machine with working functions. What it lacks is closures. Aside from global variables, which are their own breed of animal, a function has no way to reference a variable declared outside of its own body. var x = "global"; fun outer() { var x = "outer"; fun inner() { print x; } inner(); } outer(); Run this example now and it prints “global”. It’s supposed to print “outer”. To fix this, we need to include the entire lexical scope of all surrounding functions when resolving a variable. This problem is harder in clox than it was in jlox because our bytecode VM stores locals on a stack. We used a stack because I claimed locals have stack semantics—variables are discarded in the reverse order that they are created. But with closures, that’s only mostly true. fun makeClosure() { var local = "local"; fun closure() { print local; } return closure; } var closure = makeClosure(); closure(); The outer function makeClosure() declares a variable, local. It also creates an inner function, closure() that captures that variable. Then makeClosure() returns a reference to that function. Since the closure escapes while holding on to the local variable, local must outlive the function call where it was created. Oh no, it’s escaping! We could solve this problem by dynamically allocating memory for all local variables. That’s what jlox does by putting everything in those Environment objects that float around in Java’s heap. But we don’t want to. Using a stack is really fast. Most local variables are not captured by closures and do have stack semantics. It would suck to make all of those slower for the benefit of the rare local that is captured. There is a reason that C and Java use the stack for their local variables, after all. This means a more complex approach than we used in our Java interpreter. Because some locals have very different lifetimes, we will have two implementation strategies. For locals that aren’t used in closures, we’ll keep them just as they are on the stack. When a local is captured by a closure, we’ll adopt another solution that lifts them onto the heap where they can live as long as needed. Closures have been around since the early Lisp days when bytes of memory and CPU cycles were more precious than emeralds. Over the intervening decades, hackers devised all manner of ways to compile closures to optimized runtime representations. Some are more efficient but require a more complex compilation process than we could easily retrofit into clox. Search for “closure conversion” or “lambda lifting” to start exploring. The technique I explain here comes from the design of the Lua VM. It is fast, parsimonious with memory, and implemented with relatively little code. Even more impressive, it fits naturally into the single-pass compilers clox and Lua both use. It is somewhat intricate, though. It might take a while before all the pieces click together in your mind. We’ll build them one step at a time, and I’ll try to introduce the concepts in stages. 25 . 1Closure Objects Our VM represents functions at runtime using ObjFunction. These objects are created by the front end during compilation. At runtime, all the VM does is load the function object from a constant table and bind it to a name. There is no operation to “create” a function at runtime. Much like string and number literals, they are constants instantiated purely at compile time. In other words, a function declaration in Lox is a kind of literal—a piece of syntax that defines a constant value of a built-in type. That made sense because all of the data that composes a function is known at compile time: the chunk of bytecode compiled from the function’s body, and the constants used in the body. Once we introduce closures, though, that representation is no longer sufficient. Take a gander at: fun makeClosure(value) { fun closure() { print value; } return closure; } var doughnut = makeClosure("doughnut"); var bagel = makeClosure("bagel"); doughnut(); bagel(); The makeClosure() function defines and returns a function. We call it twice and get two closures back. They are created by the same nested function declaration, closure, but close over different values. When we call the two closures, each prints a different string. That implies we need some runtime representation for a closure that captures the local variables surrounding the function as they exist when the function declaration is executed, not just when it is compiled. We’ll work our way up to capturing variables, but a good first step is defining that object representation. Our existing ObjFunction type represents the “raw” compile-time state of a function declaration, since all closures created from a single declaration share the same code and constants. At runtime, when we execute a function declaration, we wrap the ObjFunction in a new ObjClosure structure. The latter has a reference to the underlying bare function along with runtime state for the variables the function closes over. The Lua implementation refers to the raw function object containing the bytecode as a “prototype”, which is a great word to describe this, except that word also gets overloaded to refer to prototypal inheritance. We’ll wrap every function in an ObjClosure, even if the function doesn’t actually close over and capture any surrounding local variables. This is a little wasteful, but it simplifies the VM because we can always assume that the function we’re calling is an ObjClosure. That new struct starts out like this: object.h add after struct ObjString typedef struct { Obj obj; ObjFunction* function; } ObjClosure; object.h, add after struct ObjString Right now, it simply points to an ObjFunction and adds the necessary object header stuff. Grinding through the usual ceremony for adding a new object type to clox, we declare a C function to create a new closure. } ObjClosure; object.h add after struct ObjClosure ObjClosure* newClosure(ObjFunction* function); ObjFunction* newFunction(); object.h, add after struct ObjClosure Then we implement it here: object.c add after allocateObject() ObjClosure* newClosure(ObjFunction* function) { ObjClosure* closure = ALLOCATE_OBJ(ObjClosure, OBJ_CLOSURE); closure->function = function; return closure; } object.c, add after allocateObject() It takes a pointer to the ObjFunction it wraps. It also initializes the type field to a new type. typedef enum { object.h in enum ObjType OBJ_CLOSURE, OBJ_FUNCTION, object.h, in enum ObjType And when we’re done with a closure, we release its memory. switch (object->type) { memory.c in freeObject() case OBJ_CLOSURE: { FREE(ObjClosure, object); break; } case OBJ_FUNCTION: { memory.c, in freeObject() We free only the ObjClosure itself, not the ObjFunction. That’s because the closure doesn’t own the function. There may be multiple closures that all reference the same function, and none of them claims any special privilege over it. We can’t free the ObjFunction until all objects referencing it are gone—including even the surrounding function whose constant table contains it. Tracking that sounds tricky, and it is! That’s why we’ll write a garbage collector soon to manage it for us. We also have the usual macros for checking a value’s type. Perhaps I should have defined a macro to make it easier to generate these macros. Maybe that would be a little too meta. #define OBJ_TYPE(value) (AS_OBJ(value)->type) object.h #define IS_CLOSURE(value) isObjType(value, OBJ_CLOSURE) #define IS_FUNCTION(value) isObjType(value, OBJ_FUNCTION) object.h And to cast a value: #define IS_STRING(value) isObjType(value, OBJ_STRING) object.h #define AS_CLOSURE(value) ((ObjClosure*)AS_OBJ(value)) #define AS_FUNCTION(value) ((ObjFunction*)AS_OBJ(value)) object.h Closures are first-class objects, so you can print them. switch (OBJ_TYPE(value)) { object.c in printObject() case OBJ_CLOSURE: printFunction(AS_CLOSURE(value)->function); break; case OBJ_FUNCTION: object.c, in printObject() They display exactly as ObjFunction does. From the user’s perspective, the difference between ObjFunction and ObjClosure is purely a hidden implementation detail. With that out of the way, we have a working but empty representation for closures. 25 . 1 . 1Compiling to closure objects We have closure objects, but our VM never creates them. The next step is getting the compiler to emit instructions to tell the runtime when to create a new ObjClosure to wrap a given ObjFunction. This happens right at the end of a function declaration. ObjFunction* function = endCompiler(); compiler.c in function() replace 1 line emitBytes(OP_CLOSURE, makeConstant(OBJ_VAL(function))); } compiler.c, in function(), replace 1 line Before, the final bytecode for a function declaration was a single OP_CONSTANT instruction to load the compiled function from the surrounding function’s constant table and push it onto the stack. Now we have a new instruction. OP_CALL, chunk.h in enum OpCode OP_CLOSURE, OP_RETURN, chunk.h, in enum OpCode Like OP_CONSTANT, it takes a single operand that represents a constant table index for the function. But when we get over to the runtime implementation, we do something more interesting. First, let’s be diligent VM hackers and slot in disassembler support for the instruction. case OP_CALL: return byteInstruction("OP_CALL", chunk, offset); debug.c in disassembleInstruction() case OP_CLOSURE: { offset++; uint8_t constant = chunk->code[offset++]; printf("%-16s %4d ", "OP_CLOSURE", constant); printValue(chunk->constants.values[constant]); printf("\n"); return offset; } case OP_RETURN: debug.c, in disassembleInstruction() There’s more going on here than we usually have in the disassembler. By the end of the chapter, you’ll discover that OP_CLOSURE is quite an unusual instruction. It’s straightforward right now—just a single byte operand—but we’ll be adding to it. This code here anticipates that future. 25 . 1 . 2Interpreting function declarations Most of the work we need to do is in the runtime. We have to handle the new instruction, naturally. But we also need to touch every piece of code in the VM that works with ObjFunction and change it to use ObjClosure instead—function calls, call frames, etc. We’ll start with the instruction, though. } vm.c in run() case OP_CLOSURE: { ObjFunction* function = AS_FUNCTION(READ_CONSTANT()); ObjClosure* closure = newClosure(function); push(OBJ_VAL(closure)); break; } case OP_RETURN: { vm.c, in run() Like the OP_CONSTANT instruction we used before, first we load the compiled function from the constant table. The difference now is that we wrap that function in a new ObjClosure and push the result onto the stack. Once you have a closure, you’ll eventually want to call it. switch (OBJ_TYPE(callee)) { vm.c in callValue() replace 2 lines case OBJ_CLOSURE: return call(AS_CLOSURE(callee), argCount); case OBJ_NATIVE: { vm.c, in callValue(), replace 2 lines We remove the code for calling objects whose type is OBJ_FUNCTION. Since we wrap all functions in ObjClosures, the runtime will never try to invoke a bare ObjFunction anymore. Those objects live only in constant tables and get immediately wrapped in closures before anything else sees them. We don’t want any naked functions wandering around the VM! What would the neighbors say? We replace the old code with very similar code for calling a closure instead. The only difference is the type of object we pass to call(). The real changes are over in that function. First, we update its signature. vm.c function call() replace 1 line static bool call(ObjClosure* closure, int argCount) { if (argCount != function->arity) { vm.c, function call(), replace 1 line Then, in the body, we need to fix everything that referenced the function to handle the fact that we’ve introduced a layer of indirection. We start with the arity checking: static bool call(ObjClosure* closure, int argCount) { vm.c in call() replace 3 lines if (argCount != closure->function->arity) { runtimeError("Expected %d arguments but got %d.", closure->function->arity, argCount); return false; vm.c, in call(), replace 3 lines The only change is that we unwrap the closure to get to the underlying function. The next thing call() does is create a new CallFrame. We change that code to store the closure in the CallFrame and get the bytecode pointer from the closure’s function. CallFrame* frame = &vm.frames[vm.frameCount++]; vm.c in call() replace 2 lines frame->closure = closure; frame->ip = closure->function->chunk.code; frame->slots = vm.stackTop - argCount - 1; vm.c, in call(), replace 2 lines This necessitates changing the declaration of CallFrame too. typedef struct { vm.h in struct CallFrame replace 1 line ObjClosure* closure; uint8_t* ip; vm.h, in struct CallFrame, replace 1 line That change triggers a few other cascading changes. Every place in the VM that accessed CallFrame’s function needs to use a closure instead. First, the macro for reading a constant from the current function’s constant table: (uint16_t)((frame->ip[-2] << 8) | frame->ip[-1])) vm.c in run() replace 2 lines #define READ_CONSTANT() \ (frame->closure->function->chunk.constants.values[READ_BYTE()]) #define READ_STRING() AS_STRING(READ_CONSTANT()) vm.c, in run(), replace 2 lines When DEBUG_TRACE_EXECUTION is enabled, it needs to get to the chunk from the closure. printf("\n"); vm.c in run() replace 2 lines disassembleInstruction(&frame->closure->function->chunk, (int)(frame->ip - frame->closure->function->chunk.code)); #endif vm.c, in run(), replace 2 lines Likewise when reporting a runtime error: CallFrame* frame = &vm.frames[i]; vm.c in runtimeError() replace 1 line ObjFunction* function = frame->closure->function; size_t instruction = frame->ip - function->chunk.code - 1; vm.c, in runtimeError(), replace 1 line Almost there. The last piece is the blob of code that sets up the very first CallFrame to begin executing the top-level code for a Lox script. push(OBJ_VAL(function)); vm.c in interpret() replace 1 line ObjClosure* closure = newClosure(function); pop(); push(OBJ_VAL(closure)); call(closure, 0); return run(); vm.c, in interpret(), replace 1 line The compiler still returns a raw ObjFunction when compiling a script. That’s fine, but it means we need to wrap it in an ObjClosure here, before the VM can execute it. The code looks a little silly because we still push the original ObjFunction onto the stack. Then we pop it after creating the closure, only to then push the closure. Why put the ObjFunction on there at all? As usual, when you see weird stack stuff going on, it’s to keep the forthcoming garbage collector aware of some heap-allocated objects. We are back to a working interpreter. The user can’t tell any difference, but the compiler now generates code telling the VM to create a closure for each function declaratio'
