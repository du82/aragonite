title = "Global Variables · Crafting Interpreters"
full_description = '''21 Global Variables If only there could be an invention that bottled up a memory, like scent. And it never faded, and it never got stale. And then, when one wanted it, the bottle could be uncorked, and it would be like living the moment all over again. Daphne du Maurier, Rebecca The previous chapter was a long exploration of one big, deep, fundamental computer science data structure. Heavy on theory and concept. There may have been some discussion of big-O notation and algorithms. This chapter has fewer intellectual pretensions. There are no large ideas to learn. Instead, it’s a handful of straightforward engineering tasks. Once we’ve completed them, our virtual machine will support variables. Actually, it will support only global variables. Locals are coming in the next chapter. In jlox, we managed to cram them both into a single chapter because we used the same implementation technique for all variables. We built a chain of environments, one for each scope, all the way up to the top. That was a simple, clean way to learn how to manage state. But it’s also slow. Allocating a new hash table each time you enter a block or call a function is not the road to a fast VM. Given how much code is concerned with using variables, if variables go slow, everything goes slow. For clox, we’ll improve that by using a much more efficient strategy for local variables, but globals aren’t as easily optimized. This is a common meta-strategy in sophisticated language implementations. Often, the same language feature will have multiple implementation techniques, each tuned for different use patterns. For example, JavaScript VMs often have a faster representation for objects that are used more like instances of classes compared to other objects whose set of properties is more freely modified. C and C++ compilers usually have a variety of ways to compile switch statements based on the number of cases and how densely packed the case values are. A quick refresher on Lox semantics: Global variables in Lox are “late bound”, or resolved dynamically. This means you can compile a chunk of code that refers to a global variable before it’s defined. As long as the code doesn’t execute before the definition happens, everything is fine. In practice, that means you can refer to later variables inside the body of functions. fun showVariable() { print global; } var global = "after"; showVariable(); Code like this might seem odd, but it’s handy for defining mutually recursive functions. It also plays nicer with the REPL. You can write a little function in one line, then define the variable it uses in the next. Local variables work differently. Since a local variable’s declaration always occurs before it is used, the VM can resolve them at compile time, even in a simple single-pass compiler. That will let us use a smarter representation for locals. But that’s for the next chapter. Right now, let’s just worry about globals. 21 . 1Statements Variables come into being using variable declarations, which means now is also the time to add support for statements to our compiler. If you recall, Lox splits statements into two categories. “Declarations” are those statements that bind a new name to a value. The other kinds of statements—control flow, print, etc.—are just called “statements”. We disallow declarations directly inside control flow statements, like this: if (monday) var croissant = "yes"; // Error. Allowing it would raise confusing questions around the scope of the variable. So, like other languages, we prohibit it syntactically by having a separate grammar rule for the subset of statements that are allowed inside a control flow body. statement → exprStmt | forStmt | ifStmt | printStmt | returnStmt | whileStmt | block ; Then we use a separate rule for the top level of a script and inside a block. declaration → classDecl | funDecl | varDecl | statement ; The declaration rule contains the statements that declare names, and also includes statement so that all statement types are allowed. Since block itself is in statement, you can put declarations inside a control flow construct by nesting them inside a block. Blocks work sort of like parentheses do for expressions. A block lets you put the “lower-precedence” declaration statements in places where only a “higher-precedence” non-declaring statement is allowed. In this chapter, we’ll cover only a couple of statements and one declaration. statement → exprStmt | printStmt ; declaration → varDecl | statement ; Up to now, our VM considered a “program” to be a single expression since that’s all we could parse and compile. In a full Lox implementation, a program is a sequence of declarations. We’re ready to support that now. advance(); compiler.c in compile() replace 2 lines while (!match(TOKEN_EOF)) { declaration(); } endCompiler(); compiler.c, in compile(), replace 2 lines We keep compiling declarations until we hit the end of the source file. We compile a single declaration using this: compiler.c add after expression() static void declaration() { statement(); } compiler.c, add after expression() We’ll get to variable declarations later in the chapter, so for now, we simply forward to statement(). compiler.c add after declaration() static void statement() { if (match(TOKEN_PRINT)) { printStatement(); } } compiler.c, add after declaration() Blocks can contain declarations, and control flow statements can contain other statements. That means these two functions will eventually be recursive. We may as well write out the forward declarations now. static void expression(); compiler.c add after expression() static void statement(); static void declaration(); static ParseRule* getRule(TokenType type); compiler.c, add after expression() 21 . 1 . 1Print statements We have two statement types to support in this chapter. Let’s start with print statements, which begin, naturally enough, with a print token. We detect that using this helper function: compiler.c add after consume() static bool match(TokenType type) { if (!check(type)) return false; advance(); return true; } compiler.c, add after consume() You may recognize it from jlox. If the current token has the given type, we consume the token and return true. Otherwise we leave the token alone and return false. This helper function is implemented in terms of this other helper: It’s helpers all the way down! compiler.c add after consume() static bool check(TokenType type) { return parser.current.type == type; } compiler.c, add after consume() The check() function returns true if the current token has the given type. It seems a little silly to wrap this in a function, but we’ll use it more later, and I think short verb-named functions like this make the parser easier to read. This sounds trivial, but handwritten parsers for non-toy languages get pretty big. When you have thousands of lines of code, a utility function that turns two lines into one and makes the result a little more readable easily earns its keep. If we did match the print token, then we compile the rest of the statement here: compiler.c add after expression() static void printStatement() { expression(); consume(TOKEN_SEMICOLON, "Expect ';' after value."); emitByte(OP_PRINT); } compiler.c, add after expression() A print statement evaluates an expression and prints the result, so we first parse and compile that expression. The grammar expects a semicolon after that, so we consume it. Finally, we emit a new instruction to print the result. OP_NEGATE, chunk.h in enum OpCode OP_PRINT, OP_RETURN, chunk.h, in enum OpCode At runtime, we execute this instruction like so: break; vm.c in run() case OP_PRINT: { printValue(pop()); printf("\n"); break; } case OP_RETURN: { vm.c, in run() When the interpreter reaches this instruction, it has already executed the code for the expression, leaving the result value on top of the stack. Now we simply pop and print it. Note that we don’t push anything else after that. This is a key difference between expressions and statements in the VM. Every bytecode instruction has a stack effect that describes how the instruction modifies the stack. For example, OP_ADD pops two values and pushes one, leaving the stack one element smaller than before. The stack is one element shorter after an OP_ADD, so its effect is -1: You can sum the stack effects of a series of instructions to get their total effect. When you add the stack effects of the series of instructions compiled from any complete expression, it will total one. Each expression leaves one result value on the stack. The bytecode for an entire statement has a total stack effect of zero. Since a statement produces no values, it ultimately leaves the stack unchanged, though it of course uses the stack while it’s doing its thing. This is important because when we get to control flow and looping, a program might execute a long series of statements. If each statement grew or shrank the stack, it might eventually overflow or underflow. While we’re in the interpreter loop, we should delete a bit of code. case OP_RETURN: { vm.c in run() replace 2 lines // Exit interpreter. return INTERPRET_OK; vm.c, in run(), replace 2 lines When the VM only compiled and evaluated a single expression, we had some temporary code in OP_RETURN to output the value. Now that we have statements and print, we don’t need that anymore. We’re one step closer to the complete implementation of clox. We’re only one step closer, though. We will revisit OP_RETURN again when we add functions. Right now, it exits the entire interpreter loop. As usual, a new instruction needs support in the disassembler. return simpleInstruction("OP_NEGATE", offset); debug.c in disassembleInstruction() case OP_PRINT: return simpleInstruction("OP_PRINT", offset); case OP_RETURN: debug.c, in disassembleInstruction() That’s our print statement. If you want, give it a whirl: print 1 + 2; print 3 * 4; Exciting! OK, maybe not thrilling, but we can build scripts that contain as many statements as we want now, which feels like progress. 21 . 1 . 2Expression statements Wait until you see the next statement. If we don’t see a print keyword, then we must be looking at an expression statement. printStatement(); compiler.c in statement() } else { expressionStatement(); } compiler.c, in statement() It’s parsed like so: compiler.c add after expression() static void expressionStatement() { expression(); consume(TOKEN_SEMICOLON, "Expect ';' after expression."); emitByte(OP_POP); } compiler.c, add after expression() An “expression statement” is simply an expression followed by a semicolon. They’re how you write an expression in a context where a statement is expected. Usually, it’s so that you can call a function or evaluate an assignment for its side effect, like this: brunch = "quiche"; eat(brunch); Semantically, an expression statement evaluates the expression and discards the result. The compiler directly encodes that behavior. It compiles the expression, and then emits an OP_POP instruction. OP_FALSE, chunk.h in enum OpCode OP_POP, OP_EQUAL, chunk.h, in enum OpCode As the name implies, that instruction pops the top value off the stack and forgets it. case OP_FALSE: push(BOOL_VAL(false)); break; vm.c in run() case OP_POP: pop(); break; case OP_EQUAL: { vm.c, in run() We can disassemble it too. return simpleInstruction("OP_FALSE", offset); debug.c in disassembleInstruction() case OP_POP: return simpleInstruction("OP_POP", offset); case OP_EQUAL: debug.c, in disassembleInstruction() Expression statements aren’t very useful yet since we can’t create any expressions that have side effects, but they’ll be essential when we add functions later. The majority of statements in real-world code in languages like C are expression statements. By my count, 80 of the 149 statements, in the version of “compiler.c” that we have at the end of this chapter are expression statements. 21 . 1 . 3Error synchronization While we’re getting this initial work done in the compiler, we can tie off a loose end we left several chapters back. Like jlox, clox uses panic mode error recovery to minimize the number of cascaded compile errors that it reports. The compiler exits panic mode when it reaches a synchronization point. For Lox, we chose statement boundaries as that point. Now that we have statements, we can implement synchronization. statement(); compiler.c in declaration() if (parser.panicMode) synchronize(); } compiler.c, in declaration() If we hit a compile error while parsing the previous statement, we enter panic mode. When that happens, after the statement we start synchronizing. compiler.c add after printStatement() static void synchronize() { parser.panicMode = false; while (parser.current.type != TOKEN_EOF) { if (parser.previous.type == TOKEN_SEMICOLON) return; switch (parser.current.type) { case TOKEN_CLASS: case TOKEN_FUN: case TOKEN_VAR: case TOKEN_FOR: case TOKEN_IF: case TOKEN_WHILE: case TOKEN_PRINT: case TOKEN_RETURN: return; default: ; // Do nothing. } advance(); } } compiler.c, add after printStatement() We skip tokens indiscriminately until we reach something that looks like a statement boundary. We recognize the boundary by looking for a preceding token that can end a statement, like a semicolon. Or we’ll look for a subsequent token that begins a statement, usually one of the control flow or declaration keywords. 21 . 2Variable Declarations Merely being able to print doesn’t win your language any prizes at the programming language fair, so let’s move on to something a little more ambitious and get variables going. There are three operations we need to support: I can’t help but imagine a “language fair” like some country 4H thing. Rows of straw-lined stalls full of baby languages mooing and baaing at each other. Declaring a new variable using a var statement. Accessing the value of a variable using an identifier expression. Storing a new value in an existing variable using an assignment expression. We can’t do either of the last two until we have some variables, so we start with declarations. static void declaration() { compiler.c in declaration() replace 1 line if (match(TOKEN_VAR)) { varDeclaration(); } else { statement(); } if (parser.panicMode) synchronize(); compiler.c, in declaration(), replace 1 line The placeholder parsing function we sketched out for the declaration grammar rule has an actual production now. If we match a var token, we jump here: compiler.c add after expression() static void varDeclaration() { uint8_t global = parseVariable("Expect variable name."); if (match(TOKEN_EQUAL)) { expression(); } else { emitByte(OP_NIL); } consume(TOKEN_SEMICOLON, "Expect ';' after variable declaration."); defineVariable(global); } compiler.c, add after expression() The keyword is followed by the variable name. That’s compiled by parseVariable(), which we’ll get to in a second. Then we look for an = followed by an initializer expression. If the user doesn’t initialize the variable, the compiler implicitly init'''
