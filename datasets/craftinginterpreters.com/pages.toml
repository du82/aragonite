title = "Evaluating Expressions · Crafting Interpreters"
full_description = '7 Evaluating Expressions You are my creator, but I am your master; Obey! Mary Shelley, Frankenstein If you want to properly set the mood for this chapter, try to conjure up a thunderstorm, one of those swirling tempests that likes to yank open shutters at the climax of the story. Maybe toss in a few bolts of lightning. In this chapter, our interpreter will take breath, open its eyes, and execute some code. A decrepit Victorian mansion is optional, but adds to the ambiance. There are all manner of ways that language implementations make a computer do what the user’s source code commands. They can compile it to machine code, translate it to another high-level language, or reduce it to some bytecode format for a virtual machine to run. For our first interpreter, though, we are going to take the simplest, shortest path and execute the syntax tree itself. Right now, our parser only supports expressions. So, to “execute” code, we will evaluate an expression and produce a value. For each kind of expression syntax we can parse—literal, operator, etc.—we need a corresponding chunk of code that knows how to evaluate that tree and produce a result. That raises two questions: What kinds of values do we produce? How do we organize those chunks of code? Taking them on one at a time . . . 7 . 1Representing Values In Lox, values are created by literals, computed by expressions, and stored in variables. The user sees these as Lox objects, but they are implemented in the underlying language our interpreter is written in. That means bridging the lands of Lox’s dynamic typing and Java’s static types. A variable in Lox can store a value of any (Lox) type, and can even store values of different types at different points in time. What Java type might we use to represent that? Here, I’m using “value” and “object” pretty much interchangeably. Later in the C interpreter we’ll make a slight distinction between them, but that’s mostly to have unique terms for two different corners of the implementation—in-place versus heap-allocated data. From the user’s perspective, the terms are synonymous. Given a Java variable with that static type, we must also be able to determine which kind of value it holds at runtime. When the interpreter executes a + operator, it needs to tell if it is adding two numbers or concatenating two strings. Is there a Java type that can hold numbers, strings, Booleans, and more? Is there one that can tell us what its runtime type is? There is! Good old java.lang.Object. In places in the interpreter where we need to store a Lox value, we can use Object as the type. Java has boxed versions of its primitive types that all subclass Object, so we can use those for Lox’s built-in types: Lox type Java representation Any Lox value Object nil null Boolean Boolean number Double string String Given a value of static type Object, we can determine if the runtime value is a number or a string or whatever using Java’s built-in instanceof operator. In other words, the JVM’s own object representation conveniently gives us everything we need to implement Lox’s built-in types. We’ll have to do a little more work later when we add Lox’s notions of functions, classes, and instances, but Object and the boxed primitive classes are sufficient for the types we need right now. Another thing we need to do with values is manage their memory, and Java does that too. A handy object representation and a really nice garbage collector are the main reasons we’re writing our first interpreter in Java. 7 . 2Evaluating Expressions Next, we need blobs of code to implement the evaluation logic for each kind of expression we can parse. We could stuff that code into the syntax tree classes in something like an interpret() method. In effect, we could tell each syntax tree node, “Interpret thyself”. This is the Gang of Four’s Interpreter design pattern. It’s a neat pattern, but like I mentioned earlier, it gets messy if we jam all sorts of logic into the tree classes. Instead, we’re going to reuse our groovy Visitor pattern. In the previous chapter, we created an AstPrinter class. It took in a syntax tree and recursively traversed it, building up a string which it ultimately returned. That’s almost exactly what a real interpreter does, except instead of concatenating strings, it computes values. We start with a new class. lox/Interpreter.java create new file package com.craftinginterpreters.lox; class Interpreter implements Expr.Visitor<Object> { } lox/Interpreter.java, create new file The class declares that it’s a visitor. The return type of the visit methods will be Object, the root class that we use to refer to a Lox value in our Java code. To satisfy the Visitor interface, we need to define visit methods for each of the four expression tree classes our parser produces. We’ll start with the simplest . . . 7 . 2 . 1Evaluating literals The leaves of an expression tree—the atomic bits of syntax that all other expressions are composed of—are literals. Literals are almost values already, but the distinction is important. A literal is a bit of syntax that produces a value. A literal always appears somewhere in the user’s source code. Lots of values are produced by computation and don’t exist anywhere in the code itself. Those aren’t literals. A literal comes from the parser’s domain. Values are an interpreter concept, part of the runtime’s world. In the next chapter, when we implement variables, we’ll add identifier expressions, which are also leaf nodes. So, much like we converted a literal token into a literal syntax tree node in the parser, now we convert the literal tree node into a runtime value. That turns out to be trivial. lox/Interpreter.java in class Interpreter @Override public Object visitLiteralExpr(Expr.Literal expr) { return expr.value; } lox/Interpreter.java, in class Interpreter We eagerly produced the runtime value way back during scanning and stuffed it in the token. The parser took that value and stuck it in the literal tree node, so to evaluate a literal, we simply pull it back out. 7 . 2 . 2Evaluating parentheses The next simplest node to evaluate is grouping—the node you get as a result of using explicit parentheses in an expression. lox/Interpreter.java in class Interpreter @Override public Object visitGroupingExpr(Expr.Grouping expr) { return evaluate(expr.expression); } lox/Interpreter.java, in class Interpreter A grouping node has a reference to an inner node for the expression contained inside the parentheses. To evaluate the grouping expression itself, we recursively evaluate that subexpression and return it. We rely on this helper method which simply sends the expression back into the interpreter’s visitor implementation: Some parsers don’t define tree nodes for parentheses. Instead, when parsing a parenthesized expression, they simply return the node for the inner expression. We do create a node for parentheses in Lox because we’ll need it later to correctly handle the left-hand sides of assignment expressions. lox/Interpreter.java in class Interpreter private Object evaluate(Expr expr) { return expr.accept(this); } lox/Interpreter.java, in class Interpreter 7 . 2 . 3Evaluating unary expressions Like grouping, unary expressions have a single subexpression that we must evaluate first. The difference is that the unary expression itself does a little work afterwards. lox/Interpreter.java add after visitLiteralExpr() @Override public Object visitUnaryExpr(Expr.Unary expr) { Object right = evaluate(expr.right); switch (expr.operator.type) { case MINUS: return -(double)right; } // Unreachable. return null; } lox/Interpreter.java, add after visitLiteralExpr() First, we evaluate the operand expression. Then we apply the unary operator itself to the result of that. There are two different unary expressions, identified by the type of the operator token. Shown here is -, which negates the result of the subexpression. The subexpression must be a number. Since we don’t statically know that in Java, we cast it before performing the operation. This type cast happens at runtime when the - is evaluated. That’s the core of what makes a language dynamically typed right there. You’re probably wondering what happens if the cast fails. Fear not, we’ll get into that soon. You can start to see how evaluation recursively traverses the tree. We can’t evaluate the unary operator itself until after we evaluate its operand subexpression. That means our interpreter is doing a post-order traversal—each node evaluates its children before doing its own work. The other unary operator is logical not. switch (expr.operator.type) { lox/Interpreter.java in visitUnaryExpr() case BANG: return !isTruthy(right); case MINUS: lox/Interpreter.java, in visitUnaryExpr() The implementation is simple, but what is this “truthy” thing about? We need to make a little side trip to one of the great questions of Western philosophy: What is truth? 7 . 2 . 4Truthiness and falsiness OK, maybe we’re not going to really get into the universal question, but at least inside the world of Lox, we need to decide what happens when you use something other than true or false in a logic operation like ! or any other place where a Boolean is expected. We could just say it’s an error because we don’t roll with implicit conversions, but most dynamically typed languages aren’t that ascetic. Instead, they take the universe of values of all types and partition them into two sets, one of which they define to be “true”, or “truthful”, or (my favorite) “truthy”, and the rest which are “false” or “falsey”. This partitioning is somewhat arbitrary and gets weird in a few languages. In JavaScript, strings are truthy, but empty strings are not. Arrays are truthy but empty arrays are . . . also truthy. The number 0 is falsey, but the string "0" is truthy. In Python, empty strings are falsey like in JS, but other empty sequences are falsey too. In PHP, both the number 0 and the string "0" are falsey. Most other non-empty strings are truthy. Get all that? Lox follows Ruby’s simple rule: false and nil are falsey, and everything else is truthy. We implement that like so: lox/Interpreter.java add after visitUnaryExpr() private boolean isTruthy(Object object) { if (object == null) return false; if (object instanceof Boolean) return (boolean)object; return true; } lox/Interpreter.java, add after visitUnaryExpr() 7 . 2 . 5Evaluating binary operators On to the last expression tree class, binary operators. There’s a handful of them, and we’ll start with the arithmetic ones. lox/Interpreter.java add after evaluate() @Override public Object visitBinaryExpr(Expr.Binary expr) { Object left = evaluate(expr.left); Object right = evaluate(expr.right); switch (expr.operator.type) { case MINUS: return (double)left - (double)right; case SLASH: return (double)left / (double)right; case STAR: return (double)left * (double)right; } // Unreachable. return null; } lox/Interpreter.java, add after evaluate() Did you notice we pinned down a subtle corner of the language semantics here? In a binary expression, we evaluate the operands in left-to-right order. If those operands have side effects, that choice is user visible, so this isn’t simply an implementation detail. If we want our two interpreters to be consistent (hint: we do), we’ll need to make sure clox does the same thing. I think you can figure out what’s going on here. The main difference from the unary negation operator is that we have two operands to evaluate. I left out one arithmetic operator because it’s a little special. switch (expr.operator.type) { case MINUS: return (double)left - (double)right; lox/Interpreter.java in visitBinaryExpr() case PLUS: if (left instanceof Double && right instanceof Double) { return (double)left + (double)right; } if (left instanceof String && right instanceof String) { return (String)left + (String)right; } break; case SLASH: lox/Interpreter.java, in visitBinaryExpr() The + operator can also be used to concatenate two strings. To handle that, we don’t just assume the operands are a certain type and cast them, we dynamically check the type and choose the appropriate operation. This is why we need our object representation to support instanceof. We could have defined an operator specifically for string concatenation. That’s what Perl (.), Lua (..), Smalltalk (,), Haskell (++), and others do. I thought it would make Lox a little more approachable to use the same syntax as Java, JavaScript, Python, and others. This means that the + operator is overloaded to support both adding numbers and concatenating strings. Even in languages that don’t use + for strings, they still often overload it for adding both integers and floating-point numbers. Next up are the comparison operators. switch (expr.operator.type) { lox/Interpreter.java in visitBinaryExpr() case GREATER: return (double)left > (double)right; case GREATER_EQUAL: return (double)left >= (double)right; case LESS: return (double)left < (double)right; case LESS_EQUAL: return (double)left <= (double)right; case MINUS: lox/Interpreter.java, in visitBinaryExpr() They are basically the same as arithmetic. The only difference is that where the arithmetic operators produce a value whose type is the same as the operands (numbers or strings), the comparison operators always produce a Boolean. The last pair of operators are equality. lox/Interpreter.java in visitBinaryExpr() case BANG_EQUAL: return !isEqual(left, right); case EQUAL_EQUAL: return isEqual(left, right); lox/Interpreter.java, in visitBinaryExpr() Unlike the comparison operators which require numbers, the equality operators support operands of any type, even mixed ones. You can’t ask Lox if 3 is less than "three", but you can ask if it’s equal to it. Spoiler alert: it’s not. Like truthiness, the equality logic is hoisted out into a separate method. lox/Interpreter.java add after isTruthy() private boolean isEqual(Object a, Object b) { if (a == null && b == null) return true; if (a == null) return false; return a.equals(b); } lox/Interpreter.java, add after isTruthy() This is one of those corners where the details of how we represent Lox objects in terms of Java matter. We need to correctly implement Lox’s notion of equality, which may be different from Java’s. Fortunately, the two are pretty similar. Lox doesn’t do implicit conversions in equality and Java does not either. We do have to handle nil/null specially so that we don’t throw a NullPointerException if we try to call equals() on null. Otherwise, we’re fine. Java’s equals() method on Boolean, Double, and String have the behavior we want for Lox. What do you expect this to evaluate to: (0 / 0) == (0 / 0) According to IEEE 754, which specifies the behavior of double-precision numbers, dividing a zero by zero gives you the special NaN (“not a number”) value. Strangely enough, NaN is not equal to itself. In Java, the == operator on primitive doubles preserves that behavior, but the equals() meth'
