full_description = '''13 Inheritance Once we were blobs in the sea, and then fishes, and then lizards and rats and then monkeys, and hundreds of things in between. This hand was once a fin, this hand once had claws! In my human mouth I have the pointy teeth of a wolf and the chisel teeth of a rabbit and the grinding teeth of a cow! Our blood is as salty as the sea we used to live in! When we’re frightened, the hair on our skin stands up, just like it did when we had fur. We are history! Everything we’ve ever been on the way to becoming us, we still are. Terry Pratchett, A Hat Full of Sky Can you believe it? We’ve reached the last chapter of Part II. We’re almost done with our first Lox interpreter. The previous chapter was a big ball of intertwined object-orientation features. I couldn’t separate those from each other, but I did manage to untangle one piece. In this chapter, we’ll finish off Lox’s class support by adding inheritance. Inheritance appears in object-oriented languages all the way back to the first one, Simula. Early on, Kristen Nygaard and Ole-Johan Dahl noticed commonalities across classes in the simulation programs they wrote. Inheritance gave them a way to reuse the code for those similar parts. You could say all those other languages inherited it from Simula. Hey-ooo! I’ll, uh, see myself out. 13 . 1Superclasses and Subclasses Given that the concept is “inheritance”, you would hope they would pick a consistent metaphor and call them “parent” and “child” classes, but that would be too easy. Way back when, C. A. R. Hoare coined the term “subclass” to refer to a record type that refines another type. Simula borrowed that term to refer to a class that inherits from another. I don’t think it was until Smalltalk came along that someone flipped the Latin prefix to get “superclass” to refer to the other side of the relationship. From C++, you also hear “base” and “derived” classes. I’ll mostly stick with “superclass” and “subclass”. “Super-” and “sub-” mean “above” and “below” in Latin, respectively. Picture an inheritance tree like a family tree with the root at the top—subclasses are below their superclasses on the diagram. More generally, “sub-” refers to things that refine or are contained by some more general concept. In zoology, a subclass is a finer categorization of a larger class of living things. In set theory, a subset is contained by a larger superset which has all of the elements of the subset and possibly more. Set theory and programming languages meet each other in type theory. There, you have “supertypes” and “subtypes”. In statically typed object-oriented languages, a subclass is also often a subtype of its superclass. Say we have a Doughnut superclass and a BostonCream subclass. Every BostonCream is also an instance of Doughnut, but there may be doughnut objects that are not BostonCreams (like Crullers). Think of a type as the set of all values of that type. The set of all Doughnut instances contains the set of all BostonCream instances since every BostonCream is also a Doughnut. So BostonCream is a subclass, and a subtype, and its instances are a subset. It all lines up. Our first step towards supporting inheritance in Lox is a way to specify a superclass when declaring a class. There’s a lot of variety in syntax for this. C++ and C# place a : after the subclass’s name, followed by the superclass name. Java uses extends instead of the colon. Python puts the superclass(es) in parentheses after the class name. Simula puts the superclass’s name before the class keyword. This late in the game, I’d rather not add a new reserved word or token to the lexer. We don’t have extends or even :, so we’ll follow Ruby and use a less-than sign (<). class Doughnut { // General doughnut stuff... } class BostonCream < Doughnut { // Boston Cream-specific stuff... } To work this into the grammar, we add a new optional clause in our existing classDecl rule. classDecl → "class" IDENTIFIER ( "<" IDENTIFIER )? "{" function* "}" ; After the class name, you can have a < followed by the superclass’s name. The superclass clause is optional because you don’t have to have a superclass. Unlike some other object-oriented languages like Java, Lox has no root “Object” class that everything inherits from, so when you omit the superclass clause, the class has no superclass, not even an implicit one. We want to capture this new syntax in the class declaration’s AST node. "Block : List<Stmt> statements", tool/GenerateAst.java in main() replace 1 line "Class : Token name, Expr.Variable superclass," + " List<Stmt.Function> methods", "Expression : Expr expression", tool/GenerateAst.java, in main(), replace 1 line You might be surprised that we store the superclass name as an Expr.Variable, not a Token. The grammar restricts the superclass clause to a single identifier, but at runtime, that identifier is evaluated as a variable access. Wrapping the name in an Expr.Variable early on in the parser gives us an object that the resolver can hang the resolution information off of. The new parser code follows the grammar directly. Token name = consume(IDENTIFIER, "Expect class name."); lox/Parser.java in classDeclaration() Expr.Variable superclass = null; if (match(LESS)) { consume(IDENTIFIER, "Expect superclass name."); superclass = new Expr.Variable(previous()); } consume(LEFT_BRACE, "Expect '{' before class body."); lox/Parser.java, in classDeclaration() Once we’ve (possibly) parsed a superclass declaration, we store it in the AST. consume(RIGHT_BRACE, "Expect '}' after class body."); lox/Parser.java in classDeclaration() replace 1 line return new Stmt.Class(name, superclass, methods); } lox/Parser.java, in classDeclaration(), replace 1 line If we didn’t parse a superclass clause, the superclass expression will be null. We’ll have to make sure the later passes check for that. The first of those is the resolver. define(stmt.name); lox/Resolver.java in visitClassStmt() if (stmt.superclass != null) { resolve(stmt.superclass); } beginScope(); lox/Resolver.java, in visitClassStmt() The class declaration AST node has a new subexpression, so we traverse into and resolve that. Since classes are usually declared at the top level, the superclass name will most likely be a global variable, so this doesn’t usually do anything useful. However, Lox allows class declarations even inside blocks, so it’s possible the superclass name refers to a local variable. In that case, we need to make sure it’s resolved. Because even well-intentioned programmers sometimes write weird code, there’s a silly edge case we need to worry about while we’re in here. Take a look at this: class Oops < Oops {} There’s no way this will do anything useful, and if we let the runtime try to run this, it will break the expectation the interpreter has about there not being cycles in the inheritance chain. The safest thing is to detect this case statically and report it as an error. define(stmt.name); lox/Resolver.java in visitClassStmt() if (stmt.superclass != null && stmt.name.lexeme.equals(stmt.superclass.name.lexeme)) { Lox.error(stmt.superclass.name, "A class can't inherit from itself."); } if (stmt.superclass != null) { lox/Resolver.java, in visitClassStmt() Assuming the code resolves without error, the AST travels to the interpreter. public Void visitClassStmt(Stmt.Class stmt) { lox/Interpreter.java in visitClassStmt() Object superclass = null; if (stmt.superclass != null) { superclass = evaluate(stmt.superclass); if (!(superclass instanceof LoxClass)) { throw new RuntimeError(stmt.superclass.name, "Superclass must be a class."); } } environment.define(stmt.name.lexeme, null); lox/Interpreter.java, in visitClassStmt() If the class has a superclass expression, we evaluate it. Since that could potentially evaluate to some other kind of object, we have to check at runtime that the thing we want to be the superclass is actually a class. Bad things would happen if we allowed code like: var NotAClass = "I am totally not a class"; class Subclass < NotAClass {} // ?! Assuming that check passes, we continue on. Executing a class declaration turns the syntactic representation of a class—its AST node—into its runtime representation, a LoxClass object. We need to plumb the superclass through to that too. We pass the superclass to the constructor. methods.put(method.name.lexeme, function); } lox/Interpreter.java in visitClassStmt() replace 1 line LoxClass klass = new LoxClass(stmt.name.lexeme, (LoxClass)superclass, methods); environment.assign(stmt.name, klass); lox/Interpreter.java, in visitClassStmt(), replace 1 line The constructor stores it in a field. lox/LoxClass.java constructor LoxClass() replace 1 line LoxClass(String name, LoxClass superclass, Map<String, LoxFunction> methods) { this.superclass = superclass; this.name = name; lox/LoxClass.java, constructor LoxClass(), replace 1 line Which we declare here: final String name; lox/LoxClass.java in class LoxClass final LoxClass superclass; private final Map<String, LoxFunction> methods; lox/LoxClass.java, in class LoxClass With that, we can define classes that are subclasses of other classes. Now, what does having a superclass actually do? 13 . 2Inheriting Methods Inheriting from another class means that everything that’s true of the superclass should be true, more or less, of the subclass. In statically typed languages, that carries a lot of implications. The subclass must also be a subtype, and the memory layout is controlled so that you can pass an instance of a subclass to a function expecting a superclass and it can still access the inherited fields correctly. A fancier name for this hand-wavey guideline is the Liskov substitution principle. Barbara Liskov introduced it in a keynote during the formative period of object-oriented programming. Lox is a dynamically typed language, so our requirements are much simpler. Basically, it means that if you can call some method on an instance of the superclass, you should be able to call that method when given an instance of the subclass. In other words, methods are inherited from the superclass. This lines up with one of the goals of inheritance—to give users a way to reuse code across classes. Implementing this in our interpreter is astonishingly easy. return methods.get(name); } lox/LoxClass.java in findMethod() if (superclass != null) { return superclass.findMethod(name); } return null; lox/LoxClass.java, in findMethod() That’s literally all there is to it. When we are looking up a method on an instance, if we don’t find it on the instance’s class, we recurse up through the superclass chain and look there. Give it a try: class Doughnut { cook() { print "Fry until golden brown."; } } class BostonCream < Doughnut {} BostonCream().cook(); There we go, half of our inheritance features are complete with only three lines of Java code. 13 . 3Calling Superclass Methods In findMethod() we look for a method on the current class before walking up the superclass chain. If a method with the same name exists in both the subclass and the superclass, the subclass one takes precedence or overrides the superclass method. Sort of like how variables in inner scopes shadow outer ones. That’s great if the subclass wants to replace some superclass behavior completely. But, in practice, subclasses often want to refine the superclass’s behavior. They want to do a little work specific to the subclass, but also execute the original superclass behavior too. However, since the subclass has overridden the method, there’s no way to refer to the original one. If the subclass method tries to call it by name, it will just recursively hit its own override. We need a way to say “Call this method, but look for it directly on my superclass and ignore my override”. Java uses super for this, and we’ll use that same syntax in Lox. Here is an example: class Doughnut { cook() { print "Fry until golden brown."; } } class BostonCream < Doughnut { cook() { super.cook(); print "Pipe full of custard and coat with chocolate."; } } BostonCream().cook(); If you run this, it should print: Fry until golden brown. Pipe full of custard and coat with chocolate. We have a new expression form. The super keyword, followed by a dot and an identifier, looks for a method with that name. Unlike calls on this, the search starts at the superclass. 13 . 3 . 1Syntax With this, the keyword works sort of like a magic variable, and the expression is that one lone token. But with super, the subsequent . and property name are inseparable parts of the super expression. You can’t have a bare super token all by itself. print super; // Syntax error. So the new clause we add to the primary rule in our grammar includes the property access as well. primary → "true" | "false" | "nil" | "this" | NUMBER | STRING | IDENTIFIER | "(" expression ")" | "super" "." IDENTIFIER ; Typically, a super expression is used for a method call, but, as with regular methods, the argument list is not part of the expression. Instead, a super call is a super access followed by a function call. Like other method calls, you can get a handle to a superclass method and invoke it separately. var method = super.cook; method(); So the super expression itself contains only the token for the super keyword and the name of the method being looked up. The corresponding syntax tree node is thus: "Set : Expr object, Token name, Expr value", tool/GenerateAst.java in main() "Super : Token keyword, Token method", "This : Token keyword", tool/GenerateAst.java, in main() The generated code for the new node is in Appendix II. Following the grammar, the new parsing code goes inside our existing primary() method. return new Expr.Literal(previous().literal); } lox/Parser.java in primary() if (match(SUPER)) { Token keyword = previous(); consume(DOT, "Expect '.' after 'super'."); Token method = consume(IDENTIFIER, "Expect superclass method name."); return new Expr.Super(keyword, method); } if (match(THIS)) return new Expr.This(previous()); lox/Parser.java, in primary() A leading super keyword tells us we’ve hit a super expression. After that we consume the expected . and method name. 13 . 3 . 2Semantics Earlier, I said a super expression starts the method lookup from “the superclass”, but which superclass? The naïve answer is the superclass of this, the object the surrounding method was called on. That coincidentally produces the right behavior in a lot of cases, but that’s not actually correct. Gaze upon: class A { method() { print "A method"; } } class B < A { method() { print "B method"; } test() { super.method(); } } class C < B {} C().test(); Translate this program to Java, C#, or C++ and it will print “A method”, which is what we want Lox to do too. When this program runs, inside the body of test(), this is an instance of C. The superclass of C is B, but that is not where the lookup should start. If it did, we would hit B’s method(). Instead, lookup should start on the superclass of the class containing the super expr'''
