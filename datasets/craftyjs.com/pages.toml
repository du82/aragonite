full_description = '''Components An overview over components made by the community. If you would like your component listed here, create an issue or PR on Github. Note that some components may be outdated and may no longer work with the most recent Crafty version. var ComponentModel = Backbone.Model.extend({}); var ComponentView = Backbone.View.extend({ template: _.template('<li><a href="<%= link %>"><%= name %></a></li>'), initialize: function() { this.listenTo(this.model, "change", this.render); }, render: function() { this.$el.html(this.template(this.model.attributes)); return this; } }); var ComponentCollection = Backbone.Collection.extend({ model: ComponentModel, url: '/components/components.json' }); var Components = new ComponentCollection; var AppView = Backbone.View.extend({ el: $('#appView'), initialize: function(){ Components.fetch(); this.listenTo(Components, 'add', this.addOne); this.listenTo(Components, 'reset', this.addAll); this.listenTo(Components, 'all', this.render); }, addOne: function(component) { var view = new ComponentView({model: component}); this.$('#component-list').append(view.render().el); }, addAll: function() { Components.each(this.addOne, this); }, render: function() { this.$el.find('.component-count').text('There are ' + Components.length + ' components:'); // Nothing really change in the app yet // TODO Search, Columns } }); var App = new AppView;'''
