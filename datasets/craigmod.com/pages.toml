["https://craigmod.com/essays/membership_programs"]
title = "Running a Paid Membership Program — by Craig Mod"
description = "How to run a successful paid membership program"
full_description = "Running a Paid Membership Program What I learned from the first year of running my SPECIAL PROJECTS membership program When I launched my SPECIAL PROJECTS (“Explorers Club” on launch; name changed mid-2020) membership program in January of 2019, I did so with crippling trepidation. So much trepidation that I never once announced it on Twitter or Instagram out of a certain shame. I only announced it in my newsletters, and even then, did so with considerable hemming and hawing. The reasons for this were many: The program didn’t have super clear deliverables, I didn’t know if I would be able to produce anything of value (so said the tiny voice in my head), and I didn’t know if the program would provide spiritual lift or become wholly burdensome. Impostor syndrome is real! So I spent the first few months one-foot-in-one-foot-out. But then I began to produce, proved (to myself) I could publish on schedule, and the year took on a momentum all its own. Words begat walks and images which begat essays which begat more thinking about walks which begat the scheduling of bigger walks which begat bigger essays and articles and books and so on and so forth in an ever-forward tumbling, snowballing way. In the end, launching a paid membership program is maybe the smartest thing I’ve done: 2019 was the most productive and creatively engaged year of my life. And I owe the brunt of that to SPECIAL PROJECTS. A rapturous THANK YOU to everyone who joined. It has not been “easy,” or effortless. In fact, 2019 was the year I worked harder and with more question marks lingering over my head than ever. But the membership program created a formality and from that formality I divined a permission — both financially and spiritually (my members are incredibly supportive) — to work deeply on topics I find interesting and important. Everyone’s needs are different. I can’t explicitly recommend every writer or photographer or YouTuber to start their own membership program. What I can do is tell you about my experience, and hope that it’s instructive to those readers out there who might, too, be membership-curious. Contents Why start a membership program? Finances Launching Pricing Member Acquisition Technical Gobbledygook Conclusions #Why start a membership program? I started SPECIAL PROJECTS out of a desire for greater creative autonomy.1 I wanted to go deep on: the literature and phenomenology of walking, the anthropology and cultural geography of old pilgrimage routes in Japan, Shinto and Buddhist syncretic histories, publishing experiments, digital tool-building, our relationship with technology, et cetera, without the need for a “gatekeeper” to grant permission. In truth, I had spent a big chunk of 2018 pitching magazines and largely failing to publish around those topics. I was frustrated. And yet! I had been publishing essays, articles, and newsletters for over a decade, building up a not-inconsiderable base of readers. I thought a membership program might help to do two things: Formalize my relationship with some of my most fervent readers, and Give me an even more robust and sustainable publishing platform. It worked. Even though I had a built-in base of supporters, I didn’t start the SPECIAL PROJECTS lightheartedly.2 I gave extended thought to going in-house at a publication. I flew to New York, met with editors. I spent close to two months deliberating if a membership program really was the best way to achieve my goals as a writer, photographer, and technologist. I planned out what a membership year could look like, built assets, tested software, arranged dozens of coffee meetings in person and on skype with friends (thank you patient friends) to solicit feedback (strategic and pragmatic) in trying to figure out how to frame my value to my audience. In the end, my conclusion was that given my existing audience and the clear set of topics that I wanted to investigate, I would be remiss to not try and go the membership route. Worst case scenario: Nobody joins and I close up shop, tail between my legs. #Finances As of year one, I am sad to report: I cannot yet retire or purchase a yacht. I am delighted, however, to report that the SPECIAL PROJECTS covers my base costs of living. I live fairly simply so these costs are perhaps lower than yours. That said, I don’t live like a hermit, have a comfortable studio / home, big enough to frequently host other artists and writers, and like to cook with fancy butter. For the first year of a membership program, having costs of living (food, rent, membership-related travel expenses (hotels, trains) and equipment (hiking gear, recording equipment, et cetera)) covered feels like a huge milestone. And if growth continues as it has these past six months, then by year three the program should essentially allow me to work in perpetuity on whatever I want without fear of “market viability” or the need to take on the occasional non-membership-related consulting project. This is the ultimate goal, and aligns with Kevin Kelly’s oft-referenced “1000 true fans” theory of creator independence. #Launching Although year one was good, it wasn’t as great as it could have been. I believe there are a number of ways in which I could have more smartly launched the SPECIAL PROJECTS. By far, my biggest screw-up was launching the Ridgeline newsletter weeks before the membership program. I should have launched it in tandem with memberships. A few weeks after I launched my program, Tim Carmody launched his Amazon Chronicles newsletter, and included a very smart feature: If he crested a certain number of paid subscribers, the newsletter was “unlocked” for all readers. He called it “unlocking the commons.” Tim’s a genius. I only wish he had been smart enough to launch before me so I could have copied him. ;) Because: The Ridgeline newsletter proved to be far more popular than I expected. I had thousands of signups in the first day alone. I suspect if I had made it a paid benefit of the membership program, and if I had set an “unlock” number, we would have hit that number quickly. As is also the case with Kickstarter projects, would-be paying supporters are motivated by goals (“stretch goals!!”), and goals that benefit all are (I think?) extra enticing. The tandem launch would have also “focused” the membership program — Ridgeline could have been a banner benefit. I suspect it would have boosted launch signups, and unlocked itself in the process effectively allowing for simultaneous cake having and eating. This highlights a specific case of a more general problem I was wrestling with: For years I had been producing a lot of “free content,” and wanted to keep doing that, but to do it with more focus and the rigor of a full-time job. I didn’t want to artificially throw a bunch of my work behind a paywall and say: OK, now pay me. The reasons for keeping the bulk of my work free were philosophically and morally grounded. I believe (however Pollyannaish the thought may be) in the base-ethos of the web as a platform for information “intertwingularity” and as an academic space for sharing ideas. I’ve benefited from countless freely-shared online essays. And I wanted to (and want to) pay back into that system. So the thrust of my membership pitch was something like: Consider this program a mini-NPR. And consider your membership a way of saying: Craig, ya weird bird, I wanna see more of your work in the world. Which is fine, but perhaps unrefined, as a pitch. Folks want something for a buck beyond feeling good. This is, undoubtably, why NPR has so many tote bag giveaways — the number of folks (and average donation) rises significantly thanks to a sweet tote. Still! I didn’t give away nothing. In becoming a member you got some smartphone wallpapers, PDFs of my books, and discount codes to buy physical copies. But, really, you had to be a super fan to even find that on the membership page. I recently relaunched for year two, and while the pitch is still far from perfect, I think I learned from some of my mistakes. The membership page is much clearer and the first screen immediately answers three critical questions: What is being made? What do members get? How do you become a member? The rest of the page is dedicated to digging more deeply into #1 and #2. Most important to note here is the confidence. This is a far more confident page than my original launch page. Largely free from any weird verbal hedging. And the reason for this confidence was 2019 itself — the vast treasure of things I was able to produce thanks to the membership program. All of my sheepishness has been sanded away, replaced with: Good lord, membership programs can be EXCELLENT and in fact, this is what SPECIAL PROJECTS produced. Let’s keep this going! I can now also offer genuinely “exclusive” content to members. I have a year of Inside Explorers members-only newsletters, and have started to produce “Pop-Up” walks. By joining you get immediate access to these archives. How do I square this members-only content with my above free-for-all philosophy? Non-members get a Pop-Up Walk highlights reel, and any ideas worth exploring exclusive to the membership program make their way into my free newsletters. Members essentially get extra-beta access to upcoming essays. The members-only content also has a (password protected) home on my website, making it easier for members to see what they have access to: This includes: Discount codes on books PDF downloads 12 walking-in-Japan phone wallpapers Archives of members-only newsletters Archives of full-length Pop-up Walk videos Access to the SMS Project archive In 2019 members have gotten tickets to sold out talks, early access to retreats I’ve co-run, and in January 2020 I gave away two tickets (~$300/each) to members to a sold-out conference in San Francisco. Starting this year I’m launching “office hours,” both local and virtual. Slowly but surely I’m finding ways that align with my own creative impulses (as opposed to “membership busywork”) to generate more and more value for members. #Pricing I find simplicity is critical.3 Assume every additional option you add to your program will at least double the amount of work on your end (in updating pages, updating perks, providing refunds, helping people “upgrade” or “downgrade”, et cetera). I believe member tiers — much like on Kickstarter — quickly become overly complex. The only option I offer for SPECIAL PROJECTS is frequency of payment — monthly, yearly, or lifetime. Everyone gets the same stuff. (Essentially, folks are voting on how long they think I can keep doing this.) I like my pricing model. $10/mo or $100/yr feels about right. $10/mo might seem like a lot, but I’d rather try and stretch to “provide that value” than lower the cost of the tiers. It goes unspoken, but SPECIAL PROJECTS members get priority in my inbox. This is somewhat inevitable. Even exchanging just $1 changes the nature of a relationship. So I’d rather sell that priority for a price that feels commensurate to my time — which is (I hope!) worth a lot more than a couple bucks a month. Related: Each time someone joins the program I respond with a simple thank you letter. I’ve never had anyone, ever, send me a personalized “thank you for joining” letter for any of the other membership programs I’ve joined. This seems bonkers. It takes all of 5 seconds to send the “thank you” and immediately increases the intimacy of the membership-relationship. 99% of the time the response to my thank you is, “Thank you!! I’ve been a fan since PROJECT-X or BOOK-Y.” It feels great to get that response and gives me (valuable) context around who is becoming a member. I added the $1000/Lifetime tier as a lark. I should have made it more expensive. The very first member to join was a Lifetime member. I’ve had roughly a billion billion more Lifetime members join than I expected. I still haven’t done anything specifically for these lifetimers,4 but I intend to offer some gifts and special deals later this year. The biggest surprise of Lifetimers is how much of a psychological boost they provide. Often, they’re people I deeply respect, have a tremendous fondness for, and yet! to whom I have no personal connection. A one-two shock. One: Wow, you know my work? and Two: You like it enough to throw me a thousand bucks? The biggest push-back I had on launching the program was from people for whom $10/mo was too much. $10USD is a weird number — an absolute nothing for some people, and the difference between paying or missing rent or a meal for others. The most angry or upset or sad emails were from super-fans who wanted to join but couldn’t afford to do so. It broke their heart (and mine). I have tried to hammer home that the bulk of the membership program is to support work that is free and available to non-members. And that simply being a reader and sharing my work is an exceedingly valuable form of support. I don’t have a good solution to this issue — but because so much of what I produce is not behind a paywall, I don’t think I need one. Other membership programs — like Stratechery and The New Consumer — have gotten around this by publishing one free article each week. For a limited time I had a $3/mo tier that was in part for folks for whom $10 was too much, and also for students. It had slightly different perks, and ultimately I found it created too much complexity. I’ve since stopped offering the tier. I’d rather have fewer members paying in at a higher rate than more paying less. As for students,5 I now offer a free tier. They just have to email me to be added: craig@specialprojects.jp. To conclude on pricing, let me just reiterate a point that may have been lost above: I believe it’s better to charge more and figure out how to “reach” that value than to charge less. Considering the amount of work a membership program requires, I’d strongly reconsider launching with anything less than $10/mo or $100/year. And depending on your audience, I believe you can charge significantly more. Don’t undervalue yourself. (Also: It’s always easier to lower prices later.) #Member Acquisition Over the course of the first year I had three main member “acquisition moments.” The first was during launch week, which by far and away produced the most number of new members. Sadly, you only get to launch once. That said, I consider last year a “soft” launch and am attempting a “hard” launch in February 2020 with this very essay. It took me a year to figure things out and I only now feel confident in providing $100/year in value to my members. So I’ll be blasting links to this essay and my membership page from the rooftops. We’ll see how it goes. I’ll report back next year. The second large acquisition moment was when I ran a “Core 300” campaign in February to get us over the 300 member mark. I made a graph on the membership page to show real-time progress, and ran an A/B “empathy” test to see what kind of target phraseology would generate the most conversions."
