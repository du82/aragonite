title = "Running a Membership Program: Four Years In — by Craig Mod"
description = "Everything I've learned in the first four years of running a successful membership program"
full_description = '''Running a Membership Program: Four Years In Everything I've learned in the first four years of running SPECIAL PROJECTS I kept trying to write this Year Four review of my SPECIAL PROJECTS membership program, and life kept getting in the way. But it was life born from and nurtured by SPECIAL PROJECTS. It’s almost as if the program itself had barged in and said: Look, bud, I know you want to reflect on the last year, but we got stuff to do. This makes me happy, the program getting in the way of the program. So here I am, pushing back against all that stuff — good stuff, exciting stuff, creative stuff, book stuff — to look back, because looking back is valuable (not just to me, but to those of you out there looking to do similar things). So here we go, a month late, but better late than never. Contents Introduction Years in Review Membership "Perks" Over the Years Costs & Equipment Entering Year Five #Introduction I started SPECIAL PROJECTS some four years ago now. That feels like several lifetimes back. We had yet to meet Covid-19, the world had yet to experience the violent heaving of 2020, 2021, and 2022. The public markets had yet to halve themselves (and recover slightly). If you take away only one thing, take away this: Four years is a long time, and four committed and focused years can yield a tremendous portfolio of work. If you’re thinking about running a membership program, you’re probably a bit wacky. Everything I write about membership programs should be filtered through the lens that: I live a somewhat uncommon, sometimes extremely wacky life. It’s good to keep that in mind. My work is mostly, inherently, non-commercial. Or less commercial than it might be “optimized” for. When people ask me: Who are you? What do you do? And I tell them — I walk, I write, I photograph, I make books, I run a membership program. Their suspicion is plainly visible: No, but what do you do to survive? As if the soul itself wasn’t a thing to be nourished. This is survival, I want to say. But instead I say: And from those activities I make several hundred-thousand dollars a year. That changes the tenor quickly. Cashflow, sadly, validates. And if even further validation is necessary I can say: Sometimes I, uh, write for The New York Times. Game over. I’m now a “real” person grounded in their universe. It’s easy to forget how much cultural sway that single media entity holds over the minds of everyone around the world. Which is all to say: If you run a membership program, and do so full time, with total gusto, folks will look at you askance. And you will need to shore up your internal mechanisms for letting askance-ness bounce off (easier said than done). #Lookback Through The Years Much of what I’ve learned over the last four years has been written up in previous reports: Year 1 (2019): Running a Paid Membership Program (5k words) Year 2 (2020): Running a Successful Membership Program (8k words) Year 3 (2021): Memberships Work (9k words) I’ve written some 22,000+ words about membership programs. Most everything that can be covered is covered in those previous writeups. You’re welcome to read them all, but I thought it might be helpful to look back through the highlights: #Launch essay (published Jan 2019): I launched the program in my Roden newsletter in late January 2019 (it was called Explorers(’?) Club back then). And I did so almost as if I was hiding in a closet, whispering out to my audience: I don’t start this membership program lightly, and I do it with all the fear and trepidation you’d expect of someone who isn’t a psychopath, who respects their audience, is generally self aware, who treats these sorts of asks like handling plutonium in a paper sack. Context: I had been trying to sell various essays to various publications, and had failed to do so. And I had failed to sell a book. And I was feeling despondent and, quite frankly, a little bit bummed out on the whole. In a throw me a bone, man, kind of way. I was working hard and it felt like I was in a ditch and had no footholds to get out. I flew to New York looking for a job, I met with editors. I thought about leaving Japan and going in-house somewhere to “learn” what it took to write for a bigger audience. Friends in the industry said, Look, you’re where we want to be. You have an audience. You know what you want to write about. Can’t you leverage that?. I had just written about membership software for WIRED a few months prior. I had lectured about memberships at the Yale Publishing Course the previous summer. It was on my mind. I started planning, launched a couple months later, and felt immediately like a failure. Which I wrote about in the Year One review: #Year One (2019) Lookback (published Jan 2020): Year One key points: extreme trepidation many unknowns leaning into the “formalization of work” gained from memberships screwed up launch? sort of interesting to look back on how fearful I was — important to not forget this On the depression / coyness of the opening shot: So I spent the first few months one-foot-in-one-foot-out. But then I began to produce, proved (to myself) I could publish on schedule, and the year took on a momentum all its own. Words begat walks and images which begat essays which begat more thinking about walks which begat the scheduling of bigger walks which begat bigger essays and articles and books and so on and so forth in an ever-forward tumbling, snowballing way. And from this, perhaps the most important element of the membership program came to be: But the membership program created a formality and from that formality I divined a permission — both financially and spiritually (my members are incredibly supportive) — to work deeply on topics I find interesting and important. 2019 ended up being incredibly generative. The timing of the launch was somewhat fortuitous. I had the wind of that first year in my sails as the pandemic hit in 2020. As the world shut down, I was able to lean hard into the “formal permissions” of the program. Travel stopped and I found myself alone, at home. I did what I knew best: I made a book, and tried to share as much of that process with the members as I could: #Year Two (2020) Lookback (published Jan 2021): Year two key points: making things is, in a way, the only thing making Kissa by Kissa leaning into video work livestreams starting to play with documentaries on-the-road “boring” vignettes Office Hours podcast Year two was when things went into so-called “hyperdrive.” Kissa by Kissa came out in August and reconfigured my entire financial and creative world. It validated my intuition of audience into tangible audience. We sold thousands of books and memberships. From the start of the program to finding this massive “product-market fit” took eighteen months. Noting the unique position I now found myself in: I harbor no illusions — it’s unlikely for a magazine or publisher to bankroll a thirty-day walk from Tokyo to Kyoto along an old highway, chatting up nearly-dead barbers and looking to place 200-year-old woodblock prints by Hiroshige in conversation with the road of today. Sure, you can cover a small bit of the walk with a magazine commission, but to take the bigger risk of months of research, action, and follow up, you need a more durable foundation. This is where membership programs soar — they are implicit and durable permission machines. Permission permission permission. I see a theme developing. Implicit in that the support itself is a signal, and durable in that those signals are “distributed.” Permission via members is an assemblage of diffuse permissions, indie permissions, not a kingmaker bestowing some canonical singular permission. Creatively, I find this arrangement freeing. In praxis it has led to bigger, more audacious and ambitious projects than I would have attempted on my own. On formalization: I find that by “formalizing” a newsletter, for example, I write more and better newsletters. By “formalizing” a walk, I walk with a sharper eye, open to more finely-grained details, with a greater empathy for those I meet along the road, and with an ever-stronger impulse to transmute those encounters into something much larger than the moment itself. Business insight: The biggest insight I had in 2020 was a banal but powerful one: Digital memberships and physical things make for superb bedmates. Don’t do physical just for members: I highly recommend not making things just for members. Instead, make something (a book, a print, a poster, a documentary, a whatever) that you would have made no matter what, and offer it up to members at a significant discount. As SPECIAL PROJECTS grew, I became increasingly aware of the itch to do more “meta” stuff just for member. BUT, I wanted to avoid that. I didn’t want to become “beholden” to program “deliverables:” You start a membership program with certain goals in mind — producing a book or film or writing a newsletter for example — but because the program is successful, you twist yourself to be entirely membership focused. You’ve gone from being an artist to someone who “does” a membership program, which often involves a dominant meta-component of how to successfully run one. Which can be good or bad depending on your aims. Thankfully, I framed membership in a way that largely mitigated members “demanding” more. They knew what they were getting (I try to be brutally honest) and were OK with that. In spite of the pandemic, Year Two was financially and spiritually one of the best years of my life. And that’s in no small part thanks to SPECIAL PROJECTS. Onward, to Year Three: #Year Three (2021) Lookback (published Jan 2022): Year Three key points: a year of refinement hiring a studio manager moving to a big distribution center switching printers Pizza Toast & Coffee short film The Craft of Kissa by Kissa documentary Years passed. The more I committed to SPECIAL PROJECTS, the more inspiring became the folks I found myself in contact with: Committing to big, messy, creative projects is a reliable way to increase the number and quality of healthy, talented archetypes within your orbit. The highest signal you can send a busy, accomplished person is that you are someone who makes, not just talks. SPECIAL PROJECTS was causing me to make, and make in heaps. The stagnancy I found myself in back before the start of launching the program (trying to get essays and books published, failing to do so), was in part, I now see, a lack of producing.1 I was working hard, but a lot of that work was a kind of churning, not a forward moving work. That is, I was sitting with the same essays, the same chapters of books for years. SPECIAL PROJECTS — by unlocking the permission to go on larger adventures, with more formality — generated incredible forward momentum. A momentum that led to more words written, more books made, more things produced in three years than the entirety of my life up to that point. In a way, it was a bit depressing. If only I had started doing this earlier! On all that: Fundamentally, what I really needed was much simpler: to write more, with more urgency, looser, with fewer boundaries, and much less preciousness. It sounds silly, but that small exchange of cash back in 2019 — between me and a few hundred people, a formalizing of some unwritten contract with members — was all it took to flip a switch in my mind, to go from relying entirely on self-driven motivation to feeling the (useful!) pull of Hired Writer. Suddenly, a walk was no longer a navel-gazing stroll, it was a job with curious rules and exigency. My members were members because they wanted to “support” my writing, and that was all I needed to get More Butt into More Chair and do more work with more formal rigor than I had ever done before. The results are present not only in volume, but also quality. Sure, these past three years I’ve written tons, but within that tonnage is some of the best writing of my life. Year Three was also when the arc of product-market fit could be seen with a bit more clarity: 2019: MVP, just ship something, anything, goddamnit, you fool, get it out there, see if there’s a modicum of interest / market 2020: Iterate until we find product-market fit; and boy did we find pretty good product market fit (Books + Memberships) 2021: Hire a competent and creative assistant, a new accounting firm, move our physical books & prints to a proper warehouse and fulfillment center, collaborate with an even higher-quality printer; effectively “refactor” the “codebase” and infrastructure of the membership program I was also able to distill the essence of it all to a single sentence: The purpose of SP is to enable a continuous and rigorous production of book-shaped projects until I’m dead. During Year Three we also began to see the effects of SP spilling out into the real world. I went back to check in on Shimane-san — the protagonist of our Pizza Toast & Coffee short film. He said, “I thought the footage was useless, that you didn’t make anything.” No, no, I told him, we made something, and it’s been seen by tens of thousands of people. I played it for him and scrolled through the comments. He was in disbelief, teared up, shot videos of my laptop screen to show to his sister. In the Year Three Lookback, I also established some tips for not losing your mind while running programs like this. They’re all good enough to quote in full: Never look at subscription data more than once a quarter. And even then, don’t really look at it. Glance timidly and not for long. SP crested a line in 2020 that I define as the “enough” line. Everything above that line is Good. I ambiently “see” the line when I send out members-only emails because my newsletter software tells me how many recipients are out there, but I try to never gaze directly into the beating heart of those digits. Books and education are the goals, not eternal, mythic GDP-style growth of membership revenue. Don’t get notified when anyone unsubscribes from anything. I can’t believe some newsletter / membership software DEFAULTS — d e f a u l t s — to emailing you when someone unsubscribes or cancels a membership. are. you. mad? Who are these Sadist Engineers of the Fifth Circle of Hell setting these defaults? The quickest route to declining mental health is to open yourself up to this attack vector. Close it down and keep it shut. Members leave for all sorts of reasons, and “you suck and are a dumb dumb and I hate you” is almost certainly not the (main?) one. (Though it is the one your mind will scream at you upon arrival of each unsubscribe email.) Don’t “bend” yourself or your membership program to the assumed “needs” of members. That is, be clear in what you want to achieve, and communicate those goals directly, upfront. Members will self-select in support of those goals and you won’t feel the need to generate a “Second Self” to somehow placate members who joined for the wrong reason. Year Three also saw me understand with more clarity my '''
