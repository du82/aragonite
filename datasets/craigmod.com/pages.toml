["https://craigmod.com/essays/offscreen_interview"]
title = "Offscreen Magazine Interview — by Craig Mod"
description = "Craig Mod, interviewed by Offscreen Magazine — talking about writing, publishing, startups, life, and disconnection."
full_description = "Photo by Martin Holtkamp Offscreen Magazine Interview Notes on writing, publishing, startups, life, and disconnection Originally published by: Offscreen Magazine In late 2017 I was interviewed by Kai Brach for Offscreen Magazine. Many thanks to him and Martin Holtkamp, who photographed me with good humor, for many hours, on a fine day in late fall in Japan for this very interview. I’ve significantly expanded / edited these answers from the published originals. For those randomly landing here, here’s how Offscreen introduced me (and my general about page): Craig is a digital savant in love with the analogue. In code, design, and photography, but mostly through his writing, he explores our collective struggle to find focus in a world of perpetual distraction. He lives a quiet life in a seaside town south of Tokyo – sometimes escaping to remote writing retreats around the US – where he revels in his various creative outlets while hidden from the public eye. When he’s ready, he emerges from hibernation with thought-provoking, introspective essays, books, and talks that examine the meaning of a connected life. [Offscreen] Let’s just get this question out of the way: How would you describe the current state of the book as a medium? If print is not dead, and ebooks are not what they promise to be, where are we headed from here? What’s clear is that Amazon won (in the US). There is a line of arguing that goes: Amazon’s de-facto monopoly on the medium has cut short the evolution of ebooks. I don’t know if that’s entirely true, but I do know Amazon is the worst kind of company to compete against because they don’t mind burning money to grab market share. And they are able to funnel cash from, for example, their profitable AWS services into unprofitable arms, indefinitely. Good luck raising money if you’re a startup and your main competitor is Amazon. It creates a very desolate landscape. Seven years ago, the ebook space was invigorated with young energy. Remember Nook, Kobo, or even iBooks on the then newly launched iPad? Flipboard emerged from that era, too. But now that the Kindle owns the majority of the market, these other platforms1 folded or got swallowed by Amazon. And the Kindle turns out to be a good enough solution for enough people — it sells well enough as is — which has, I believe, disincentivized its evolution. It hasn’t changed much since it launched.2 So here we are. Kindle and non-Kindle book sales account for less than two percent of Amazon’s market cap.3 The Kindle could disappear tomorrow, and Amazon would not be materially affected. Even from a branding perspective, I don’t think Amazon = Books anymore, certainly not to younger consumers. Amazon = Prime. Prime = a 3D printer on a one-day time-delay that deposits anything you can imagine on your doorstep. Operating as a company with the best interests of shareholders in mind, it’s clear that putting money into innovating ebooks won’t carry much of a return. Publishing is tricky. What’s the old aphorism? How do you make small fortune in publishing? Start with a large fortune. Financial returns can’t be the only metric driving a lot of publishing houses. I mean this on a philosophical level, and obviously it isn’t true across the board or between all divisions or publishers. But inside certain publishers — the best publishers — there is a sense of a respect for the medium and a recognition of its cultural importance. Maybe I’m being overly generous, but this has been the case in conversations and relationships I’ve been privy to. I mean, you’re (Offscreen) probably not making a ton of money publishing an indie magazine, right? So why do you do it? Because you feel it in your bones. This must exist. Sadly I don’t get the impression that the publishing arms of Amazon or Apple operate under this ethos. To call iBooks a throwaway “feature” of iOS is too dismissive, but the output does not give off the impression of a thing that must exist in the world, and must exist at the highest level of grace. But there’s a silver lining: The publishing industry is now able to relax (a bit). Seven years ago, there were a lot of question marks. Is print going to survive? Which platform should we build for? Oh my god, do we need an apps division? Now, it’s okay. There’s Kindle. That’s it. We can mostly ignore everything else. The market has spoken. Nobody wants apps. Or book trailers. And guess what? Print sales are going up again and indie bookstores are seeing a resurgence. Turns out things aren’t much different than they were ten years ago, just that — for better or for worse — we now have Amazon as the uber-ubiquitous distribution vector for print and digital.4 [Offscreen] What do you think drives a reader’s decision to go for either the printed or the digital edition? I’m not sure if readers spend a lot of time consciously thinking about that choice. Personally, I think Kindle Samples are divine. I don’t buy a book unless I can read the sample. That’s my threshold. If I can’t get through the sample, I won’t buy the book. If I really like it, then I buy the physical book. I think the return of print is in line with the other fetishizations of offline activities and objects – vinyl records, Moleskins, expensive pens, et cetera. Anything that gets you away from a screen has gone up in perceived value. All of these objects promise a context switch to a quieter mode. But I think books are the perfect disconnected objects. They require no energy. They offer a fully immersive, quiet experience for hours or days. The medium dissolves but never becomes translucent. It’s quiet, but present. An exceptional technology. [Offscreen] When it comes to making time for reading and writing, do you have a set of self-imposed rules you try to adhere to? When you sit down with a book, you understand the parameters of engagement. You know how long the book is. The book isn’t changing as you read it. It’s a solid, immutable thing. You and the book are on equal terms in many ways, as least from a physics point of view. You know what’s going to happen, and the book abides by its implicit contract, which is to be a book. However, in digital-land many spaces (apps, games) quickly turn into slithering creatures beneath your feet. You never know where you stand. Their worlds are optimized to pull you back in for one more minute, one more click. Over and over. Cascades of chemical reactions in your noggin’ tell you to keep going, just one more hit; I feel this persona of the addict very strongly when I am online or using certain apps or devices.5 That’s why I try to subvert my weaknesses, to subvert that persona. The easiest way is to turn off the internet. When I go to bed at night, the internet goes off. Phone into airplane mode. It doesn’t come back on until after lunch the next day (at the earliest). The difference in the quality of the day ahead between starting my morning with the internet on versus off is enormous. If I wake up and touch my phone, I’ve already lost hours. Not because I’m browsing social media for hours, but because the mind has already been agitated, made unquiet, and the context switch back into thoughtfulness can take the whole morning. In other words, the addict part of my brain takes over and contaminates my ability to be contemplative. I lose the grace to dive into other worlds, the worlds of writing or programming or images. And so much of my life is structured around rescuing that lost grace, making space for thinking. Much of what I do boils down to that. Because I’m really wimpy. Like so many of us. I’m weak when it comes to resisting the bounty of online goodness. [Offscreen] How has the omnipresence of the internet changed the rules of becoming a writer? The barriers to entry are lower. It’s more democratic. If you put in the legwork, you can find an audience, be a writer. A similar shift has happened in photography. Whereas thirty years ago you had to spend tens of thousands of dollars on equipment, today you can make a name for yourself as a photographer with just your mobile phone. The flip side of democratization is that making money as a writer can be more difficult. In part because many people are willing to do it for next to nothing. In part it’s because the Ad Bucks from the old generation of publishing are gone. So much “writing” online today is incentivized and measured by clicks and volume rather than quality or nuance. Volume can be a good forcing function to produce work, but rarely leads us to a state of nuanced thought. I’ve been reading about John McPhee’s process of writing his giant New Yorker essays thirty or forty years ago, and wow, it sounds like an alien world. The process is so slow and deliberate. At the end, he would hand in an eighty-thousand-word piece. That’s a book! Whatever structure allowed McPhee to write this way back then, it barely exists today. Unless you cobble it together yourself, or hunt it down through non-profit institutions. [Offscreen] Was there a turning point when you realised that writing was your thing? In 2009 I hiked up to Annapurna base camp in Nepal. Along the way I met so many kind, generous Nepalese folk. Especially my guide. He became like a younger brother to me. We were in tears as we parted. As we came down the mountain back to Kathmandu, ending our little adventure, I was overwhelmed. All this beauty — the mountains, the people — and yet I felt this solid lump of … darkness? in my chest. I was struggling to process a lot of different events in my life then, and had screwed up in a number of big ways. And so my response to all that beauty, my dumb, lazy, sad-with-a-dollop-of-self-hate response was to drink myself into a blackout in a Kathmandu hotel. It was the best response I had. I woke up the next morning with a big gash on my forehead and a slightly worrisome feeling of fluid trickling behind my ear. My flight back to Tokyo was that afternoon. I went straight to the ER to get an MRI. Thankfully everything was alright but I knew those demons needed to be addressed. This weird, tumultuous internal strife or angst or whatever it was needed to be addressed. I was certain of this, although I was not certain how to fix it. How is it that a man can stand before so much beauty and want to die? How do you deal with a feeling like that? My response was to excavate the heart. Dig, look closely. That’s all I could do. I felt very constrained. I didn’t have any archetypes or mentors that I could look towards. Excavate and write. Excavate and run. I started running marathons then. I didn’t write about that full experience head-on, though. The world still felt too brittle for that. I wrote about the mountains. I wrote in the guise of a camera review. Along the hike I had been using the new Panasonic GF1 camera. This camera and the photos I shot became a big online essay. It took me months to write and edit and design that piece, but when I finally published it on my site it took off in a way like nothing else I had worked on. Through affiliate links in that single post I sold enough of those little cameras to pay for two or three years of living.6 But more importantly, psychologically, for me it was a major turning point. I remember crying from the response. It was so positive and additive. The feeling of transmuting however small a portion of that garbage in my heart into something that was not self-destructive but instead instructive and inspiring to others. That was a hell of a moment. I thought: Something is happening here that hasn’t happened before. Keep digging. A few months later I published Annapurna Moonrise. And then after that, I published another essay called Books in the Age of the iPad just before I got on a plane to New York. By the time I landed, it had been picked up by the New York Times and I had two non-fiction book offers in my inbox. [Offscreen] Wow, what a flying start to a new career! I wouldn’t wish my journey to that point on anyone. It was a pretty shitty (a self-imposed kind of shitty, an of-the-own-mind kind of shitty) journey, and in hindsight, there were definitely easier roads which I chose not to take for whatever reasons. It was not an overnight success story. It took me seven years of book making to be able to think about writing that post about books. And even then, six-months of actual writing and editing and rewriting to complete it. The response I got turned out to be an important external validator. Of course, I had to almost kill myself to finally start working on it. There’s a mean fallacy in the world: that all you need to produce big, meaty pieces of work is internal gumption. “Pull yourself up by the bootstraps!” they say. “The onus is on you to make your life better!” et cetera. You see this bandied about by political nudniks when talking about down-and-out folks, folks in low-income situations, folks who’ve turned to drugs. It’s one of the meanest and laziest ways to frame the world. Sometimes you feel so small, and the room you’re in so suffocating that you want to drink yourself into the ground. Sometimes that spot in the dirt is the softest, coolest place you might have in your life. Locking yourself into a room for weeks or months to get your thoughts out is tough. It’s lonely. It’s dark. That’s why even a smidgen of external validation can be powerful – not as the sole purpose of working hard but as a nudge that says, “You’re not crazy. You’re on the right track.” This applies to everything in life, not just “art.” Past successes become future archetypes of hope. When you are inevitably stuck in a rough patch and start doubting yourself, you can look back at some of those achievements and go: “OK, at one point, I knew what I was doing, so let’s keep going. Let’s have faith in this thing I’m working on now and hope this one works out too.” Love, books, children, paying your bills, whatever. [Offscreen] Some time after writing those essays you took on a design role at Flipboard, but you eventually went back to being independent so that you could focus on writing. Was working for a tech company not what you expected? It was everything I expected. Working with Marcos Weskamp and the team at Flipboard is one of the highlights of my life. They were outstanding humans and outstanding designers and engineers. I’ve never been in a room with more talent. And all of us were moving in synchronicity, with aligned goals, during the headiest time of digital publishing, the iPad fresh, infinite possibility with a nearly infinite budget — nothing was constrained except for our imaginations. Truly. A once in a millennium moment in an ancient industry. And we spent some acid-trip like adventures exploring bizarro interface tendrils that never made it out into the world. I learned a lot. I learned how vital a strong mythology was for leading a company, for raising a huge sum of money. You need product, you need market-fit, but you also need a helluva story. It was all a high. And I h"
