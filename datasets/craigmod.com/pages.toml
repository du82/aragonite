["https://craigmod.com/essays/media_accounting"]
title = "Stab a Book, the Book Won't Die — by Craig Mod"
description = "On the resilience of books in the face of apps, attention monsters, and an ad-driven online economy"
full_description = "Stab a Book, the Book Won't Die On the resilience of books in the face of apps, attention monsters, and an ad-driven online economy Originally published by: Roden 030 How do we account for the resilient nature of books? They’re not dead, though according to a hundred years of prognostications of their demise, they should be. To understand why books are still around, and why they delight as they do, we need to do some “media accounting” — What are the costs (individually, socially) of engaging with certain media and mediums, apps and publications? Understanding the contracts into which we enter with media helps demystify why physical books (and, similarly, vinyl, analog film, et cetera) not only remain compelling, but become more compelling the more their digital twins grow vast and fuzzy. This essay is just a cursory document. A light expansion on a lecture I gave at Yale for the 2019 Yale Publishing Course. #Books Let’s begin with printed books. Printed books have clear contracts. I’ve written about this in passing before, over in Ridgeline: We buy a book, we know what we’re getting. There is no other “business model” at play. No other information being (necessarily, relatively) sold. This clarity of contract is especially lucid in physical form. The book has edges. The transaction has edges. The transaction completes. Given time, we complete the book. It has an ending. Contracts are clear. Usually, there’s no tracking. A printed book is an object over which no third party has agency once in your possession. It’s protected (in the US, at least) by first sale doctrine. Digital books, not to the same degree. Amazon, for example, famously deleted editions of “1984” from everyone’s Kindles. Simultaneously, today (2019), courts in France are challenging the general inability to resell digital goods. The immutability of printed books is their superpower. Remember this, because it’s from this immutability that books derive their dead-simple “contract.” #Attention Monsters: Things that Eat Attention The main adversary of books and book publishing is: Anything that eats attention. Publishing has always been a game of competing for attention. Any number of media inventions have threatened to eviscerate the book market: radio, movies, television, et cetera. But smartphones tip the scales unlike any previous object. They do so by placing into our pockets a perfect, always-at-hand vector for “lopsided user contracts,” arriving in the form of apps and websites. These suboptimal contracts are at their most exaggeratedly worst in what I call “attention monsters.” That is, any app / service / publication whose business is predicated on keeping a consumer engaged and re-engaged for the benefit of the organization (often to the detriment of the mental and physical health of the user), dozens if not hundreds or thousands of times a day. A simple heuristic for determining if something is an attention monster: “Free” apps built around advertising models tend to become attention monsters.1 Especially if they’ve taken on a lot of venture capital, a tendency even further exacerbated if they’re a public company.2 Instagram is a great example. The more you scroll, the more money they make. Consider the “agreement” into which you’ve entered with the application the next time you find yourself mindlessly scrolling. What’s keeping you there? Why are the algorithms showing you what they’re showing? What benefits are you accruing? Why do you feel the need to post what you’re posting? For what are are you trading your time and mental energy? Most likely, you’re stuck in a “tiny loop:” — a senseless series of actions that span minutes, hours, days, consume years, and add up to nothing or almost nothing, and that benefit (ideally: tranquility, growth, curiosity) no one but the company (in reality: engagement, ad views) who owns the container in which the loop takes place.3 Because of a need to show consistent growth over time, attention monster methods of consuming user attention become more aggressive the larger the user base becomes. A once simple contract (“connect with your friends online,” “post photos with cool filters,” et cetera) into which we may have entered with a free app begins to change by small degrees when that app or publication is pushed to increase profitability.4 As a grossly-simplified counter example: Consider almost any piece of open source software. The version control software ‘Git’ is used by hundreds of millions of people, as are Apache and nginx web servers, but none of these examples contains user experience dark patterns, nor are they concerned with consuming attention. Apps that feed off of and grow based on attention are often dopaminergic. They are built to amplify reward seeking behavior, releasing unpredictable hits of dopamine: Another like. A DM. A new QAnon video in a sidebar. A “related article” about vaccination dangers. Something — anything — to increase engagement time in service to ad revenue. #Publications (are different from books) Publications also fall into this bucket. The New York Times is a partially dopaminergic publication. That is, the success of it as a business is still contingent on readers looking at a lot of ads. It’s also dependent on subscriptions, which is why the writing is usually high-caliber; quality is necessary to convert casual readers into subscribers (hyperbole is necessary to multiply ad views); becoming a subscriber is often a proxy vote for quality. But the Times makes a significant portion of its profits from ads, so eating your attention is still good for the organism. Hence, click-bait headlines. And horrible, horrible election needles: real-time “content machinery” adjacent to ads from which you can’t avert your gaze. Of course, The Times is not the only publication that functions like this. Most legacy or incumbent news organizations do, too. When these incumbent newspapers were print only, there was only one way to “enter” the content: Through the front page. The front page was all you could see on the news stand. Once you bought the thing, you were converted to a paying participant. Make note: Design and contract parameters go hand in hand. When the front page is the only entry point, only a single page of the publication requires hyperbole to convert passers-by to readers. Online, every article becomes a potential entry point. And so there is an incentive for pervasive hyperbole in order to “convert” eyeballs in service to ads and the consumption of more attention. In contrast, publications like The Information or Stratechery or The New Consumer — recently founded publications — are (almost?) entirely subscriber based, and thereby shed themselves of attention gorging.5 The contract a reader enters with The Information is very clear: We pay, they write. Enough of us pay so they can keep writing. They write in a way that provides value via knowledge (ostensibly leading to smarter business decisions or investments on the part of the reader; i.e., extremely clear value proposition), not shock. Their model is not contingent on us looking at their writing from morning until night. Once a day is more than enough. Entry points are limited. It’s a healthy model for all parties. As The Information says on their about page: Quality stories breed quality subscribers. As our subscriber community grows, we’re investing aggressively in our team and reporting. We believe this formula is far more scalable than relying on traffic or conferences, and it’s totally—100 percent—aligned with our readers. Our contract with The New York Times is more slippery. Yes, we pay and they write, but also, they take our viewing patterns, biases, reading habits, estimated income and sell that to advertisers. That’s a weirder contract. And one into which most people don’t realize they’ve entered. 6 All of this attention eating is relatively new. It is, as I said above, largely reliant on the smartphones in our pockets. The rise of attention monsters and this scale of attention consumption and lopsided contracts is one of many unintended consequences of the last ten years of internet growth and pocket supercomputers. #Media Contracts Consider the contracts of these two images. People on a train today: People on a train in Philadelphia 65 years ago: Superficially these images look similar: folks committed to a horizontal surface held in front of their faces. But the contract of these two objects couldn’t be more different. The printed newspaper of 1919 had edges, ended. There were ads but they were passive, not active members of the reading experience. They were not reading you. You paid. You got some paper. The paper did not continue forever. Most readers may be too young to remember this, but once upon a time, even television ended. There was an implicit contract in that eventually you’d be allowed — nay, forced — to sleep. Like, you’d be watching some late-night show and the broadcast would just … finish. Kaput. The national anthem would blare and then the broadcast completion tone would wake any fools still perched in their living room Lay-Z-Boys. #Netflix vs. Criterion Compare that era of television with opening the Netflix app.7 CEO Reed Hastings: “Sleep is our competitor.” Netflix8 is a company with a 134 billion dollar market capitalization and 6,000+ employees. Competition is rapidly rising: Disney+, Amazon Prime, HBO Go / Now / MAX, Apple TV+. Netflix is a public company. They must continue to grow. Netflix can’t lose us as subscribers, but they also can’t charge much more. In fact, it’s likely they’ll have to reduce prices. And so, one imagines an internal doctrine: Netflix must become a downtime habit humans cannot live without. The service must become a teat, an irreplaceable and inexhaustible binge conveyance.9 Unsubscribe? Unthinkable! Their current strategy in achieving this is to produce an endless profusion of well-funded shows. Some of which are superb. They produced 700 — 7-0-0 — shows in 2018 alone. Compare now with Criterion Collection. Both services are nearly technically identical: Monthly subscriptions that allow a customer to watch, from a vast catalog, a moving image on any of their devices at any moment. But, again, the numbers. Criterion is a: $33,000,000 / year business with 40 employees. Scale matters. No, Criterion won’t be producing $100,000,000 TV shows, but as a service, a company at their chosen scale, they can operate under a sustainable ethos of: Deliver one amazing piece of classic, independent, or foreign film a week.10 The contracts users enter into when using Criterion or Netflix manifest most clearly in design. Browsing Netflix is an endless sensation of falling forward into ever more content. Previews auto-play. As soon as one episode in a series ends, the next begins before credits finish rolling. If there’s no other episodes in the series, random trailers begin to play. The very design of Netflix itself is constructed to reduce your ability to: think about what you want to do, or step away from the service It’s designed to be a boundless slurry of content poured directly into your eyeballs. In a way, it’s training us to never step back or even consider, say, reading a book or going for a walk. The binge is dopaminergic to the max, satisfying the completionist instinct. In breathless doublespeak, Hastings has said, “Binge-watching is great because it puts you in control.” Take a moment to consider: The scale at which this system is operating, the original contract you felt you had entered into, and your relationship to and sense of contract with the service today.11 Now go browse Criterion. There’s clearly value in both models. Netflix, in producing its infinitude of content will invariably create some classics, give voice to folks who’ve yet to be voiced. And Criterion, in time, will help us wade through the muck for gems. The publishing industry has similar analogs: Big publishers produce lightweight bestsellers, the profits from which find their way into more complex and challenging, less commercial books. However, the big difference is books (mostly) don’t autoload themselves into your head; they require a constant opting-in on the part of the reader. Worth noting: I don’t think a company like Netflix has to operate at its current extremes and could be more balanced; my example above may be somewhat binary, but companies can and do choose to occupy greyer zones. The takeaway: The contract — emotionally, physically (bingeing is as much a physical decision as it is mental) — with Criterion is far simpler, clearer, and I’d argue, healthier in the long term than the contract we currently enter into with Netflix. #Publishers, huh, what are they good for At Yale I was speaking to a bunch of publishers. So I proposed the following: Our goal as publishers should be: To make it easier for readers to choose the habit of (longform) reading. And then: The adversary of books is anything that eats attention — attention monsters. The way to fight attention monsters is by helping potential readers habituate the very act of reading. Habits and identities are intertwined. Increased self-awareness around media contracts makes it easier to convert the identities of wanna-be readers into full-fledged bag-o-books readers. Our goal is not to get someone to read a single book, but become a reader. That said: I have no idea how to reliably do that! I can only share how I’ve converted myself into a more fervent reader: I always have a Kindle Paperwhite in my bag. I dislike much about this device. It is a device of sadness, of unrealized potential. But, it is also a device (in my case) with a bunch of good, long form articles and books on it. The battery lasts for weeks. It is always in my bag because I never want an excuse to not engage with a long form piece of text. I want it to be as easy to reach for a book as it is to reach for my phone. I choose the Paperwhite because it’s small and light.12 In service to helping me read more books, I’ve also turned off all non-tool apps on my phone. All I can do on my iPhone is check Google Maps, text, and read email. I use Freedom to block all media, social and otherwise. Using this combination I’ve read more books this year than I have in the past three combined. #Contracts and Habits James Clear’s book Atomic Habits has had a profound effect on the way I understand many of the patterns I’ve constructed in my life over these last five years. I had intuited what was and wasn’t working, but Clear’s book gave me a framework for understanding why. You should read the entire thing. Here are two big takeaways that are relevant to our contracts, attention monsters, and books discussion: True behavior change is identity change. “Motion” is the act of researching; “action” is getting your reps in. Never mistake the two. James makes the argument that identity change (via an ever increasing belief in both your goal identity itself and the processes"
