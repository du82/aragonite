l or Clif Bar, finishing the day at another inn, slipping into a scalding-hot bath and replenishing our spent calories with whatever the proprietors had cooked for us. Finally, gratefully, we crawled into bed earlier than a grandparent might. Things we saw: Bear warnings. Fresh tracks. Pit viper signs. Wart-covered toads the size of a baby’s head. A deer, recently mauled, wet viscera spread in the middle of our path. Layered vistas out upon the wrinkled earth that engulfs Koya-san — our final destination — and the seemingly endless mountain ranges comprising the Kii Peninsula. People we met: Three young city transplants mixing clay and straw for traditional walls, rebuilding an old house, preparing to open an onigiri shop along the trail. A stern old man, head wrapped in a towel, who reminded us of a better path, a turn-off we had just missed. Stray dogs, drunken fishermen overly eager to share their mysterious alcoholic elixir that tasted not unlike warm kerosene. Dan and I took about 3,000 photos. On the day we finished the walk, we hopped on a train and were whisked off to a 150-year-old house in Hida Furukawa, where we hid for a week, poring over the images, attempting to distill the experience into some manageable and comprehensible subset. The images in this book are the result. The book you hold in your hands isn't meant to be a guide. There are no captions. No tips. It's simply a catalog of moments. It says: There is a place in the world that looks and feels like this. Given a little gumption, similar places can probably be found near wherever you may be. We believe that a good walk begins with a clear goal—a mountaintop, a far-off village, a superb pizza shack in the middle of the woods — but that a great walk is born from a bit of circuity and a little uncertainty. Thoreau had a rather extreme notion of preparing for a walk: “If you are ready to leave father and mother, and brother and sister, and wife and child and friends, and never see them again — if you have paid your debts, and made your will, and settled all your affairs, and are a free man—then you are ready for a walk.” We prefer Clark’s minimalism — as long as you have a pair of sensible shoes, the rest fades away. — Craig Mod Daikanyama, Tokyo, October 2, 2016 Craig Mod is a writer and photographer based in Japan. He's the author of the books Things Become Other Things and Kissa by Kissa and is a MacDowell, Ragdale, and VCCA writing fellow. His essays and articles have appeared in The New York Times, Eater, The Atlantic, California Sunday Magazine, Wired, Aeon, New Scientist, Virginia Quarterly Review, The New Yorker, The Morning News, Codex: Journal of Typography, and elsewhere. He writes newsletters, oh yes, newsletters: Roden & Ridgeline. The work on this site is supported 100% by paid memberships and book & print sales. Whatever you do, don't follow @craigmod on Bluesky or Instagram."
