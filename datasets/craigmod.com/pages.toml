full_description = "Hi, I'm Craig Mod. Join the thousands of other SPECIAL PROJECTS members and together we'll produce books, newsletters, longform essays, podcasts, walks, & more. But members also get access to exclusive discounts, members-only newsletters and podcasts, lectures, board meeting calls, and other goodies. Your candor in bringing us into your work and process has really helped me in my own non-“job job” work (ie the work I'd really like to be doing) and I find that super valuable. Also very happy to be able to help, in whatever small way :) I’m partial to artists who lead their lives as a Gesamtkunstwerk, and let folks into many different layers of their creative process (the business parts, the raw materials & idea generating, the edit, etc.). You do that super effectively and it’s probably the biggest perk for me. Thank you for sharing with us. It’s great to be along for the ride and glad you are able to sustain your art in this way. Please don’t stop. If we need to pay more we will! I love the work you’re doing, but I’m more inspired by the way you’re doing that work than the specifics of any given project and I truly find your (public) worldview extremely invigorating. I consider you a mentor-from-afar. Thanks Craig for sharing so much about your process and being thoughtful about your members. Love your work and using it as an archetype for my own. One of my favorite things about your membership is feeling like I'm part of a community without investing a ton of energy into socializing with people. My nephew is 18 yrs old and I want to someday show him yr life and say, dream of things that might seem impossible, but you can do whatever you want if you work at it. I’m so glad you exist in the world and do what you love. It’s such an inspirational bright spot for me. I get so much joy from what you do because of how you do it. I love the sense of inclusion in your work, that my participation means something. I also love enabling you to do whatever you fancy creatively as I appreciate the power of that (and the older I get, the less I can abide the waste of human potential; if I can help someone enrich their own creative life, I will)."
