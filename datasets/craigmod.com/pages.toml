title = "Six Tōkaidō Moments — Ridgeline issue 099"
description = "Six moments on the Tōkaidō"
full_description = "Six Tōkaidō Moments Ridgeline Transmission 099 All of my word-energy is being poured into Pachinko Road. Tomorrow’s my last day of walking. The bed calls. So let me keep this simple. Six moments from the last few weeks. Falling ginko leaves at Josen-ji A pirate boat on lake Ashinoko Walking a pine grove in Hara-juku Sitting in Seikenji in Okitsu Shinkansen hunting near Futagawa A suspension bridge near Seki The next Ridgeline is number 100! Crazy. Thank you all for following along and your support these past few years. More soon, more soon, C Fellow Walkers Grew up wandering, to my parent’s chagrin. Sneaking off to the woods behind the golf course in Virginia; once I had a car, it was hidden fields behind highway off ramps in North Carolina. Now a West Coast transplant, walking is still how I come back to myself but also the fuel for my painting practice. Abstract works that capture a glimmer of what it’s like to walk alone through the Southern California landscape. On the 4th of July, when I was 16, I walked out of my summer camp and up a nearby mountain, down and into town for fireworks, and back. One of the first days that I spent only walking. My feet have lived, and were formed by walking paths in the forests by the Wissahickon Creek and Schuylkill River, the salt marshes of Cape Cod, and the White Mountains. Now, I walk city blocks when I need to clear my head, nostalgic for routes with no sidewalks and no roads. (“Fellow Walkers” are short bios of the other folks subscribed to this newsletter. In Ridgeline 001 I asked: “What shell were you torn from?” and got hundreds of responses. We’re working our way through them over the year. You’re an amazing, diverse crew. Grateful to be walking with you all. Feel free to send one in if you haven’t already.) Not subscribed to Ridgeline?(A weekly letter on walking in Japan) Subscribe This essay is from the Ridgeline newsletter, mailed out November, 2020. Thoughts? Email me@craigmod.com. Craig Mod is a writer and photographer based in Japan. He's the author of the books Things Become Other Things and Kissa by Kissa and is a MacDowell, Ragdale, and VCCA writing fellow. His essays and articles have appeared in The New York Times, Eater, The Atlantic, California Sunday Magazine, Wired, Aeon, New Scientist, Virginia Quarterly Review, The New Yorker, The Morning News, Codex: Journal of Typography, and elsewhere. He writes newsletters, oh yes, newsletters: Roden & Ridgeline. The work on this site is supported 100% by paid memberships and book & print sales. Whatever you do, don't follow @craigmod on Bluesky or Instagram. Previous / Next 098COVID-19 and Walking Japan What it's like to walk across Japan during the pandemic 100Nara, Wonderful Nara Exploring the mountains south of Nara"
