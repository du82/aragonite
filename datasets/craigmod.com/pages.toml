title = "Memberships Work — by Craig Mod"
description = "How to run a successful paid membership program in 2022"
full_description = 'Memberships Work What I learned during the third year of running my SPECIAL PROJECTS membership program Year Three of running my membership program was bonkers, prodigious, a blast, inspiring, and of course, exhausting. Mega exhausting. But exhausting in a well-used, full-life exhausting kinda way. A fabulous exhaustion. It was a year that left my head sometimes spinning, and my feet sometimes aching. Because: 2021 was one of the most productive and rigorous years of my life. I published some 150,000+ words to my newsletters, shot and premiered two short documentary films, walked and extensively documented some 1,000+km of trails and towns across Japan, produced a new edition of my book Kissa by Kissa, ran a few board meetings, a bunch of livestream work sessions, and produced a few podcast episodes with writers I admire … and that was all made possible by my membership program, SPECIAL PROJECTS.1 It’s not easy, the running of a membership program. But it has inspired and catalyzed, for me, a sustained and vast interval of intense writing, photographing, bookmaking, and general “creative output.” It’s by far and away, consistently, unrelentingly, the most work I’ve ever put into anything. But I keep doing it. And want to continue doing it. The work carries with it a deep sense of fulfillment. (More on this below.) It even — gauche may it be to mention this — pays pretty well.2 In aggregate, I take all of the above to signal that this is good and right and to keep going. Before we get into the meaty 8,000-word heart of memberships, let me announce a free public livestream Q&A I’m going to run this next Sunday, Feb 6, at 11:00 a.m. and 9:30 p.m. Japan Time (for many of you, this will be Saturday night (5th) or Sunday morning (6th); the links below will localize the times to your timezone): Let’s Talk About Membership Programs, Session 1 (Sunday, Feb 6, 11:00 JST) Let’s Talk About Membership Programs, Session 2 (Sunday, Feb 6, 21:30 JST) Feel free to pop in and ask questions. I may give a 30-min presentation covering why I started SP / how it has evolved, but the bulk of the time will be for Q&A. Feel free to email me questions beforehand, too: craig@specialprojects.jp. I’ll draw from that list to get things going. Writeups for 2019 and 2020 on running SPECIAL PROJECTS In preparing to write this reflection on Year Three, I went back and re-read the 2019 and 2020 essays. They’re good! Surprisingly rich in emotional context. If you’re thinking about launching a paid membership program to fund your work, then I highly recommend you go and read them along with this year’s essay. Contents Permission Finding "Product-Market Fit" The Year of Video Strategies for Not Losing Your Mind Jobs to be Done Me Hiring Members Members Hiring Me Costs & Equipment Measuring Our Lives Conclusions #Permission from Members As I’ve written in past reviews, “permission” seems to be my biggest psychological takeaway from SPECIAL PROJECTS. That is: Feeling bestowed with a permission to do the kind of work I believed I was capable of, but perhaps not strong enough to do entirely on my own. Ten years ago I received my first writing residency. I was lucky. It was prestigious. I felt like a full-blown imposter. I was in the woods in New Hampshire right at this very moment (early January, 2012), trying to stay sober (and failing),3 working on a draft of a novel I’d then go on to revise and rewrite and revise and rewrite some more, for, frankly, too many years. It wasn’t all bad, though — I used various drafts of that book to get accepted into other residencies, workshops, and fellowships. It was in those spaces that I met brilliant Actual Writers (as opposed to me, the Fumbling Buffoon), some of whom became dear friends, and through those friendships I was exposed to books and lives I’d have otherwise never imagined. This all flowed from (somewhat foolishly) committing myself to the novel.4 And my main takeaway from this was: Committing to big, messy, creative projects is a reliable way to increase the number and quality of healthy, talented archetypes within your orbit. The highest signal you can send a busy, accomplished person is that you are someone who makes, not just talks. I also banged my head against the brick wall of the New York publishing industry in ways that made me realize I had more work to do to become the kind of writer I wanted to be. There’s that Ira Glass quote about taste and talent, and working on this book showed me my talent wasn’t yet matching my taste. For years, I got my butt kicked. I needed those kicks. They were helpful, humbling kicks. But, fundamentally, what I really needed was much simpler: to write more, with more urgency, more loosely, with fewer boundaries, and much less preciousness. SPECIAL PROJECTS knocked me out of “gem polishing schmuck” mode, into “working writer” mode. It sounds silly, but that small exchange of cash back in 2019 — between me and a few hundred people, a formalizing of some unwritten contract with members — was all it took to flip a switch in my mind, to go from relying entirely on self-driven motivation to feeling the (useful!) pull of Hired Writer. Suddenly, a walk was no longer a navel-gazing stroll, it was a job with curious rules and exigency. My members were members because they wanted to “support” my writing, and that was all I needed to get More Butt into More Chair and do more work with more formal rigor than I had ever done before. The results are present not only in volume, but also quality. Sure, these past three years I’ve written tons, but within that tonnage is some of the best writing of my life. I failed to publish that novel, but by committing to, and working on it, I experienced how big projects lead to inspiring connections and growth. The dovetailing of that insight — with the formality of membership — seeded the permission I now feel, and fuels the impulse to keep going. #Finding Product Market Fit Looking at SPECIAL PROJECTS from the angle of “running a startup,” my three years of membershipping can be broken down thusly: 2019: MVP, just ship something, anything, goddamnit, you fool, get it out there, see if there’s a modicum of interest / market 2020: Iterate until we find product-market fit; and boy did we find pretty good product market fit (Books + Memberships) 2021: Hire a competent and creative assistant, a new accounting firm, move our physical books & prints to a proper warehouse and fulfillment center, collaborate with an even higher-quality printer; effectively “refactor” the “codebase” and infrastructure of the membership program When I started SPECIAL PROJECTS, I didn’t think “books” would be the cornerstone of the work. But they are. As I wrote last year: The purpose of SP is to enable a continuous and rigorous production of book-shaped projects until I’m dead. The incidental corollary of this is: education. Meaning, the membership program is meant to provide folks with precisely what I needed while, say, working on my novel. Namely: A strong archetype, and demystification about how it looks / feels to be work on big projects. This is why I offer membership up to “students”5 for free. When I launched in 2019, there were essentially no “perks” for members. The program existed simply to support my free newsletters. The main pitch was: This membership program is, at its core, like a mini NPR — of course, there are perks, but the main reason to become a member should be: Craig, ya weird bird, I want to see more of your work in the world. It wasn’t until the start of the pandemic in March 2020 that I began to double down on members-only livestreams, began to run “board meetings,” and began to focus on books in earnest. And it wasn’t until August 2020 until I found true “product market fit” — I sold more memberships in tandem with the launch of Kissa by Kissa than I did during any other period. As I break down in last year’s review, the percentage of people who were not members, who bought my book and also became members (the “conversion to membership rate”) was about 20%. This feels like a great rate and seems to imply a good confluence between pricing, discounts, and membership value. I had no “roadmap” to get to my current position. I’ve mainly followed my interests. As I wrote about last year, I’ve most deliberately maintained a self-awareness around “trapping myself” in a kind of horrible meta-loop of running a membership program only to talk about membership programs. Instead, I’ve been pretty “selfish.” Meaning: I’ve been uncompromising in not “bending” the program to meet the “needs” or “desires” of members, but rather to enable and further work on my books. And I make sure my messaging around the program is clear about this. It’s not to say I’m not interested in creating membership value. But that I want the focus of membership-derived value to be activities (livestreams, Q&As) directly related to book, book-adjacent (videos, walks), and education (Office Hours, Board Meetings, et cetera) specific work. Paradoxically, I think this is why the program provides the value it provides — namely, members get access to behind-the-scenes peeks at someone Doing The Work (as opposed to meditating on the possibility of work). From a callous business perspective, SPECIAL PROJECTS is not nearly as big as it could be because of this. I could be creating “classes” and running “seminars” and I’m sure the program would be making more money. But it would also take away from the main goal, the bookmaking goal, and by having that goal firmly set, it makes it easy to say no to distractions. #The Year of Video If 2020 was the year of considering video as a compliment to the membership program and my work at large, then 2021 was the year of committing to it with some formal oomph. I published some eighty-nine videos in 2021. Sixty-eight were public facing. Composed mainly of my “Nothing Exciting” series taken on my Kii Peninsula and Tiny Barber walks. Here’s a supercut of the “more exciting” Tiny Barber moments: Giving a members-only mid-walk update from Karatsu; walking members through a draft laying out of my next book. The other twenty-one videos were members-only: livestreams, walk updates, packing videos, and board meetings. (All new members get access to those archives.) YouTube stats for 2021 This commitment to video has paid off handsomely. Without trying to intentionally build or grow a YouTube channel, we had decent results, cresting some 90,000 views and garnering a few thousand subscribers. It’s become an interesting tertiary channel through which to promote my work. More than that, the video commitment means I now regularly run members-only sessions, and am able to give talks online with minimal worry about sound, lighting, or video, since my home studio is now dialed in. This significantly removes the “activation energy” required to try something new or run a video session. I also shot and produced two short documentaries: In February I shot the first documentary about a kissaten I had walked past during my Nakasendō walk in 2019. The place served up a great helping of pizza toast, cut in a funky way. So I went back, asked if I could film the proprietor at work. He was flabbergasted. I prodded, he ultimately relented. The resulting video, Pizza Toast & Coffee came out pretty well, I think; certainly pretty well for a first go. I learned a ton working on this project, and somewhat unexpectedly, earned a new friendship in my connection with the owner.6 Later in the year, I took the reprinting of my book Kissa by Kissa as an opportunity to shoot a behind-the-scenes production video. The result, The Craft of Kissa by Kissa, is largely about elevation: Elevation of the folks who made the book so damned nice. These were the craftspeople and specialists working as print operators and binders and sewers. The folks who ushered the book from files-in-a-folder to fully-realized object, an object that then found its way into the hands of thousands of people spread out over dozens of countries. I felt like they deserved some screen time, and figured readers would enjoy the journey as well. My dipping into video during the pandemic was unique. I’ve noticed a number of folks suddenly doing great video work. Of note is the photographer Alec Soth. His YouTube channel has become a masterclass in photography and photo book making. Truly, it is an astounding, free resource. One of the most delightful professional moments of 2021 was when I got an email from a friend saying, “Hey, have you seen this?” linking to a new Alec video on “Photos + (foreign) Words:” You can imagine my shock at seeing this. Anyway, dumb as it may sound, I felt like this “validated” my work in a “formal” way, and makes me only want to work harder on future projects. I am extremely grateful for the nod. #Strategies for Not Losing Your Mind (Memberships & Mental Health) I have a variety of strategies for keeping myself sane while running SPECIAL PROJECTS. Maybe they’re be helpful for you, too? Here are my rules: Never look at subscription data more than once a quarter. And even then, don’t really look at it. Glance askance and not for long. SP crested a line last year that I define as the “enough” line. Everything above that line is Good. I ambiently “see” the line when I send out members-only emails because my newsletter software tells me how many recipients are out there (I’m tempted to write some custom CSS to hide it …), but I try to never gaze directly into the beating heart of those digits. Books and education are the goals, not eternal, mythic GDP-style growth of membership revenue. Don’t get notified when anyone unsubscribes from anything. I can’t believe some newsletter / membership software DEFAULTS — D E F A U L T S — to emailing you when someone unsubscribes or cancels a membership. ARE. YOU. MAD? Who are these Sadist Engineers of the Fifth Circle of Hell setting these defaults? The quickest route to declining mental health is to open yourself up to this attack vector. Close it down and keep it shut. Members leave for all sorts of reasons, and “you suck and are a dumb dumb and I hate you” is almost certainly not the (main?) one. (Though it is the one your mind will scream at you upon arrival of each unsubscribe email.) Don’t “bend” yourself or your membership program to the assumed “needs” of members. That is, be clear in what you want to achieve, and communicate those goals directly, upfront. Members will self-select in support of those goals and you won’t feel the need to generate a “Second Self” to somehow placate members who joined for the wrong reason. #Jobs to be Done Clayton Christensen’s most famous business theory is probably his theory of “Jobs to be Done.” It boils down to: Folks don’t “buy” stuff, they “hire” stuff. So goes the prime example: You don’t “buy” a milkshake from McDonald’s, you “hire” it to do the job of “satiating your hunger, slowly, via straw while you commute in a '
