["https://craigmod.com/essays/successful_memberships"]
title = "Running a Successful Membership / Subscription Program — by Craig Mod"
description = "How to run a successful paid membership program in 2020"
full_description = 'Running a Successful Membership / Subscription Program What I learned from the second year of running my SPECIAL PROJECTS membership program Let’s be honest, behind every membership program or subscription newsletter lingers a half-cocked suspicion: Hey, bucko, what gives? Why don’t you get a real job? Well, because: Against the prevailing winds of pandemic and political and social unrest, against an ever-present whisper in the ear of impostor syndrome and a thick fog of anxiety threatening to snuff out my lifeforce, against endless worry for the welfare of my family and friends, 2020 was the most creatively, spiritually, and financially successful year of my life. I published some 160,000+ words in newsletters and essays, produced a strange book about pizza toast, launched an open-source crowdfunding tool, and once again walked across Japan. And that was mostly just the second half. The driving engine behind it all? My SPECIAL PROJECTS membership program.1 February 2021 marks entry into year three — three! — of SPECIAL PROJECTS. Much of what I wrote last year in my “Running a Paid Membership Program” essay reflecting on year one still holds true. That essay is a fine companion to this one. If you’re membership-curious — that is, a masochist, thinking about starting a paid newsletter (2020: the year “Substack” entered the realm of “Kleenex”) or launching a Patreon community or GitHub Sponsorship or, like me, rolling your own Memberful-driven jumble of offerings — then read on. I’ll try to relay my experience with the hope of demystifying the work and stresses of setting off on your own through the creative wilds of the world. Contents A Thing You Must Do Finances The Triumph of Pizza Toast Dangerous Cages, Horizon Goals Members The Year of Video Limiting Memberships? Launching, Relaunching, Re-Relaunching Pricing Technical Nuts and Bolts Conclusion #A Thing You Must Do A membership program should be seen as an accelerant for work you must do.2 That is, it should be born from the desire for creative autonomy and for an untethered opportunity to explore with great curiosity and rigor, topics that may or may not be explicitly “commercially” friendly. I harbor no illusions — it’s unlikely for a magazine or publisher to bankroll a thirty-day walk from Tokyo to Kyoto along an old highway, chatting up nearly-dead barbers and looking to place 200-year-old woodblock prints by Hiroshige in conversation with the road of today. Sure, you can cover a small bit of the walk with a magazine commission, but to take the bigger risk of months of research, action, and follow up, you need a more durable foundation. This is where membership programs soar — they are implicit and durable permission machines. Implicit in that the support itself is a signal, and durable in that those signals are “distributed.” Permission via members is an assemblage of diffuse permissions, indie permissions, not a kingmaker bestowing some canonical singular permission. Creatively, I find this arrangement freeing. In praxis it has led to bigger, more audacious and ambitious projects than I would have attempted on my own. There is, however, a bargain to be struck. Namely: You must work. Perhaps harder than you’ve worked at any other job. A promise is made. You are granted permission by your members and in return you must work with an energy such that no question remains that your promise of rigor and curiosity are present in your output. I don’t think of this bargain as being “beholden” to members. I think of this bargain as a formalization, and, boy does it help me get work done. I find that by “formalizing” a newsletter, for example, I write more and better newsletters. By “formalizing” a walk, I walk with a sharper eye, open to more finely-grained details, with a greater empathy for those I meet along the road, and with an ever-stronger impulse to transmute those encounters into something much larger than the moment itself. Some folks are adept at self-formalizing. Novelists that hide in their shed for years toiling away are a good example. After years of attempting that variant of creative schedule, I realized that I thrive on external formalities and my work lives and dies by deadlines. So for me, a membership program has been an accelerant in the best possible way. 2020 simply wouldn’t have been what it was without SPECIAL PROJECTS. #Money Money Money I am sad to report: As of January 2021, I am still yet unable to purchase a yacht. I am exceedingly happy to report, however, that because of my membership program, book sales, and photographic print sales, revenue-wise 2020 was the most financial successful year of my life.3 The biggest insight I had in 2020 was a banal but powerful one: Digital memberships and physical things make for superb bedmates. Here are monthly sign ups for new members — January 2019 to mid-January 2021: New sign ups vs launch events The conclusion is obvious: Membership programs thrive on “conversion events.” Do you know why NPR is so numbingly relentless during their pledge drives? It’s because casual conversions for “cultural” goods4 are exceedingly difficult to pull off. Folks need a “reason” to flip from unpaid to paid, and one of the most effective ways to do this is to offer a semi-unique object or token; totebags convert better than fuzzy feelings alone. However, ye solo-proprietor, be wary! Production of physical things (anything, even just a sticker) can be onerous and complex and making a small thing and making a big thing share fundamental difficulties. So I highly recommend not making things just for members. Instead, make something (a book, a print, a poster, a documentary, a whatever) that you would have made no matter what, and offer it up to members at a significant discount. Which is precisely what I did with my book launch in August, 2020. #The Triumph of Pizza Toast The biggest shock-delight of 2020 was the success of my book Kissa by Kissa. We sold 1,000 copies in the first three days and almost 2,000 copies in three months. It’s a $95USD retail book. That’s bonkers. Thank you thank you thank you to everyone who bought the book and to everyone who has written in with kind words. I have a bit of experience in book making and publishing and so I had set my expectations appropriately: I anticipated a bump of about 400 sales on launch and then a nice smooth glide of 600 sales over the next two or three years. A sweet background hum of gentle revenue. So I feign no false modesty in saying I was absolutely shocked to see the first run of 1,000 copies sell out almost instantly. Looking back, I chalk up the success of this book to a few factors: I “primed the pump” of interest by writing about book production leading up to launch in my weekly Ridgeline newsletter: part 1, part 2, part 3, part 4, part 5. The venn diagram of my fans who are interested in photography + literature + Japan is almost a single overlapping circle. Pizza toast! And Japanese kissaten! The hook for the book was obvious and clear and unique. Limited edition: Scarcity can be a big value add (and simplify production/fulfillment logistics). Strong luck in immediate blog mentions: Daring Fireball, Swiss Miss, and Kottke. I also timed the book launch with the launch of “Craigstarter” — which provided its own interest bump. The stroke of unintended “business” genius of the launch was tying Yearly Memberships to a big discount on the book. Existing Yearly members got a $50 discount off that first edition. But I also offered a bundle for non-members wherein you could get a Yearly membership and the book all at once, discount inclusive. The Yearly Membership costs $100 for the year. The total cost for the bundle was $145. Roughly 20% of all buyers of Kissa by Kissa who were not members bought the bundle. That feels like an incredibly high conversion rate for such a high-price item, and signals above all a sense of trust in me and my work. While the financial aspects of the launch were powerful, that sense of trust and validation was significantly more powerful. 2020 was the year I understood the business model of the membership program: Make books. Which is great because that — bookmaking — has always been my “horizon goal." #Dangerous Cages, Horizon Goals Perhaps the most unintuitively dangerous pitfall of running a successful membership program is that of trapping yourself in a lambent cage of your own design. A cage so golden, so shiny that you sometimes forget it’s even a cage. A cage of such unparalleled seduction that you convince yourself that the cage was the thing you were desiring all along! I am deeply suspicious of the cage. What I mean: You start a membership program with certain goals in mind — producing a book or film or writing a newsletter for example — but because the program is successful, you twist yourself to be entirely membership focused. You’ve gone from being an artist to someone who “does” a membership program, which often involves a dominant meta-component of how to successfully run one. Which can be good or bad depending on your aims. For me, it would be bad. So once a year I embark on this review. It helps me remember what we’ve done, and further clarify where we’re going. Mainly, it helps keep me on track for the bigger goals that memberships enable, and helps keeps me from being an insufferable year-round membership barker. A spread from the SMS book Meaning, SPECIAL PROJECTS is a community and tool enabling progress towards horizon goals. My main horizon goal is embarrassingly simple: A continuous and rigorous production of book-shaped projects until I’m dead. 5 It’s a “horizon goal” because you never arrive. You learn to wrest fulfillment from the endless pain of moving towards the goal. Often you feel like a complete dingdong walking towards it, sometimes with hail smashing you in the face, sometimes with an exciting tailwind and perfect humidity, sometimes the earth opens and covers your legs in lava — you simply have to keep walking, crawling, slithering towards that point on the horizon. Books have been my horizon goal for roughly thirty years. Like many others, since childhood I’ve seen books as artifacts of work to aspire to. And now having produced several, I believe more than ever in their powers. You could say that books, like, anneal the diaphanous nature of loosely held ideas, man. Or, in the words of buddy Robin Sloan, “a book requires collimation:” Writing a book requires collimation: getting your material pointed in the same direction, filtering out the bits that wander elsewhere. I don’t mean to suggest that a book, fiction or nonfiction, ought to be just one thing; some of the very best feel polyphonic, full to bursting. But I’d argue that, in those cases, it is full-to-bursting-ness that provides the axis of collimation. The material has been aimed at that objective. Collimated light is different. It doesn’t scatter and diffuse into darkness. A billion tweets fade instantly. A thousand copies of a book will be with the world for at least a few centuries. A thing to be found by a future bunkerchild: pizza … toast? Maybe these timeframes are equally irrelevant within the long-now frame of things, but the mediums and the output produced therein feel spiritually antipodal. When I post a tweet I almost always think: Ugh, what am I doing? When I finish writing a book I almost always think: Ugh, what am I doing? But, the path to the book — collimating experiences into book form — nourishes and challenges in ways I fail to believe a million tweets ever can.6 And so, whenever I embark on a new membership-adjacent project — walk, newsletter, members-only zoom session, podcast, et cetera — the main question in mind is: How does this help us make a book? 2020 end-of-year members-only call #Members I have been very lucky — my members are supportive, generous, and largely “get” what we’re doing. They form an incredible community.7 Members are super fans (see Mr. Kelly’s classic: 1,000 true fans), and their subscriptions carry three huge benefits: Many of your members are certain to be more successful, accomplished, and wiser than you. By some dint of dumb luck, you’re now one degree away from these incredible people.8 Recurring membership revenue is akin to “seed capital”9 for horizon-goal work to be done. Members form thoughtful communities; they become an invaluable crew to bounce ideas off of, run “tests”, get feedback on half-baked ideas. The capital aspect of memberships is pragmatic and is most likely the driving reason most folks start a membership / subscription program. Working capital is critical because working capital murders excuses. One of the biggest excuses for not executing is a lack of capital; mitigating that issue eliminates your biggest excuse for procrastination. That’s great! But once that line has been crossed the real benefits of a membership program start to reveal themselves. Personally: I’ve found that the community / “idea bounce” aspect of members to be of tremendous creative and spiritual value. Members-only update video on my November mega-walk #The Year of Video Member idea bouncing happens over emails or video. And, boy, was 2020 the year of “doing video.” I started running production livestreams for the Ise-ji online book, which turned into quirky coworking sessions of discussing tools, editing techniques, photo management, meditation, and more. I also started running quarterly-ish “Office Hours” one-on-one chats. Those office hours chats were great, but I found a lot of folks asking the same questions, and the fact that membership numbers were rising meant the chances of getting a slot were exceedingly low. (The fifteen or so slots would fill up in about a minute.) Still, it was valuable to put faces to memberships, and I ended up launching the members-only Office Hours podcast in order to more evenly distribute the answers to many of those oft asked questions. Questions like: “How do you build connections through work?” “How do you become a better writer?” “How do you do interesting work / live a unique life?” “How do you ‘measure’ success?” … and more. But that only grew out of the one-on-one video calls. And I’ve replaced the one-on-ones with group Zooms, which offers a bit of that old intimacy but with far greater access. This evolution and overlap of one-on-one to podcasts to group zooms is a great example of being nimble within the confines of a membership program. State hypotheses! Test! Iterate some more! You’re free to mix it up because you own the space within which you’re working. This is but one of many great pleasures of running a membership program. In April I ran another “Pop-Up Walk” at the start of the pandemic. Pop-up walks are basically little micro-documentaries of walks. I produced the first one in December 2019 along the Ise-ji route in Mie Prefecture. In June we had a guest lecturer give a members-only talk about the art islands in the Japanese Inland Sea. I'
