full_description = "Contact / Follow Craig Mod me@craigmod.com Bluesky Instagram Twitter / X 作家、写真家。 メディア / 新聞 / インタビューの問い合わせについては、media@specialprojects.jpまでご連絡ください。 クレイグ・モドは作家であり写真家です。著書には「Things Become Other Things」(2023年)、「Kissa by Kissa: 日本の歩き方」(2020年)、「Koya Bound: 熊野古道の8日間」(2016年)、「僕らの時代の本」(2015年)、そして「Art Space Tokyo」(2010年)などがあります。特に、2016年にライカカメラとのコラボレーションによって出版された『Koya Bound』は、『50 Books/50 Covers』のデザイン賞を受賞しました。 「Kissa by Kissa」の日本語版は、今井栄一氏が翻訳し、盛岡の書店兼出版社であるBOOKNERDによって出版されました。日本語版のタイトルは『KISSA BY KISSA: 路上と喫茶店 — 僕が日本を歩いて旅する理由』。 2023年には、「The New York Times」の「2023年に訪れるべき52の場所」にて盛岡市を推薦し、ロンドンに次ぐ第2位に選ばれました。この推薦により、2023年から2024年にかけてテレビ、新聞、雑誌で50回以上のインタビューを受けました。2024年には山口市を推薦し、「The New York Times」の同リストで第3位にランクインしました。 寄稿も多数行っており、「The New York Times」、「Eater」、「The Atlantic」、「The New Yorker」、「WIRED (米国と日本)」などに寄稿しています。 現在はオンラインサロン「SPECIAL PROJECTS」を運営しており、4万人以上のメルマガ登録者に向けて定期的に発信しています。メールマガの目次はこちらにあります。 また、2011年から2019年にかけて、イエール大学の夏期特別講習(出版関係)にゲスト講師やアドバイザーとして招聘されました。作家としてもMacDowell, Virginia Center for Creative Arts, Ragdale Foundationからライティングフェローに選ばれています。 過去には、米国シリコンバレーでプロジェクトデザイナーやアントレプレナーとして活躍し、Mediumやスマートニュースなど著名企業のアドバイザーを務めました。現在はThe Designer Fund社の有限責任社員(リミテッド・パートナー)でもあります。 さらに、2024年3月からモドはJ-Waveの「People's Roastery」ラジオ番組に月1回ゲスト出演しており、日本や東京、海外での歩き方、また本作りや写真撮影について語っています。 英語の詳しい自己紹介はこちらへ。"
