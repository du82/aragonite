title = "Five Years of Memberships — by Craig Mod"
description = '''I've been running the <span class="sp">SPECIAL PROJECTS</span> membership program for five years; here's what I know.'''
full_description = "Five Years of Memberships I've been running the SPECIAL PROJECTS membership program for five years; here's what I know. 2023 was amazing, bewildering, inspiring, gnomic, exhausting, bacterial, and mostly, fun. I mean — by the end of the year I was but a swollen forearm fighting for my life (OK, maybe not quite that bad), but wow … WOW. 2023: Easily the most monumental and generative year of my life. I owe that fullness to SPECIAL PROJECTS, my membership program. Now, a somewhat unbelievable five years old. Here is everything I learned last year. Contents Introduction Impact Members Only Website Books in 2023 Tech Stack / Running Costs Finances The Next Five Months, the Next Five Years #Introduction This is my fifth time writing about the program. I’ve covered almost everything you can think about covering in the past four years. If you’re thinking about embarking on the long, lonely road that is a membership / subscription-driven life, then I highly — HIGHLY — recommend reading through all of these look-backs chronologically. They’re long: All told, I’ve written 30,000+ words about running this thing. But reading them will give you a sense of the evolution of SPECIAL PROJECTS — from naive and extremely humble(d) Year One, to the utterly bonkers impact and career jumps of Year Five. 2019 — Launch Essay: The Explorers Club Membership 1 2020 — Part 1: Running a Paid Membership Program 2021 — Part 2: Running a Successful Membership Program 2022 — Part 3: Memberships Work 2023 — Part 4: Running a Membership Program: Four Years In 2024 — Part 5: This essay With two “supplementary” essays: 2020 — Membership Programs, Year Two 2022 — Oh, no, Memberships Otherwise, if you just want to see what I’ve been up to the past year, and how SPECIAL PROJECTS has played a major part in enabling this life and work of mine, then by all means, here we go — a look back at 2023. Me appearing in an interview article about Morioka, where I somehow managed to time travel from 1958 as a computer science lecturer. #Impact By far and away the biggest “impact” the program had (not just in last year, but of all the years) was in getting the mid-sized northern-Japanese city of Morioka listed at #2 in the New York Times “52 Places to Visit in 2023” list. That listing, combined with the media savvy of one Mr. Baba — proprietor of Azumaya Soba — rocketed Japan’s collective national attention onto the sparkling sweetness that is Morioka in Iwate Prefecture. Measuring the precise impact my “article” (just the shortest, barest of things, hardly 200 words) had in economic terms is difficult, but it’s probably safe to say some additional $100M USD+ found its way into Morioka.2 For Tohoku (the northern area of Japan), having this kind of attention (and spillover from the attention), and the economic benefits of such, is a sweeping thing. Especially considering fewer than 1.5% of all inbound tourists ever even find their way into Tohoku overall. Now, you might rightly question how we can draw a line between this membership program and $100M USD flowing north — but I think we can. I “found” Morioka thanks to an SP project I ran in 2021 — Tiny Barber, Post Office. A “walk” through Japan where I: Wrote an extensive pop-up newsletter each and every day (archived for members on the SPECIAL PROJECTS Member Site), and visited ten mid-sized cities, spending three nights and four days in each, walking and talking and observing them as closely and rigorously as possible. That pop-up was directly funded and catalyzed by SPECIAL PROJECTS (as all my pop-ups are). No magazine would have paid for me to go on such a tour. No newspaper would have green lit that jaunt. But, with the open permissiveness of a membership program — especially one where you’ve cultivated the prime “deliverable” of Being Interesting — well, if you want to run off to ten cities a bunch of folks have never heard of? Go right ahead. That was a profound tour for me. Not only because it expanded and strengthened my relationship to Japan (my home of some twenty-four years), but because it established archetypes of good living: The scale of the mid-sized cities felt far more “human sized” than, say, Tokyo, and they abounded with entrepreneurial opportunities, fullness, life, kindness, generosity. When the Morioka news hit in January 2023, I was in the middle of one of my TOKIO TŌKYŌ TOKYO walks. (Part 2! Also: Archived for members.) I took newspaper interviews in random parks around the city. Television crews crammed into my hotel room. I accepted every interview request that came in and ran with it. I felt I had to. I felt responsibility for “unleashing” this fire hose of attention on Morioka, and I wanted them to believe in their value — as astonishing as it may seem — at being placed at #2 (after London) of places to visit in 2023. I had never “done media” before. Certainly never in Japan, never in Japanese. Not to this extent, anyway. But by the end of 2023 I had done some 40+ Japanese interviews across every type of media — TV, newspaper, magazine, web journal, radio — and had gone from shaking with fear and nervousness, to being fairly at ease with it all. Now, don’t get me wrong, doing anything media related is exhausting (for this introvert, anyway), but the gauntlet of 2023 was valuable in demystifying the experience. And thereby normalizing it. And thereby allowing for more interesting conversations to happen by the end than were happening at the start. This is maybe what I’m most proud of: Subtly shifting the conversation from “Why Morioka?” to “What qualities of cities like Morioka in Japan enable people to live meaningful lives?” (For those keeping score: Healthcare, reasonable costs of living, walkability, reliable and vast infrastructure, history and craft, youthful entrepreneurship, easy access to nature, and more.) Highlighting what might be so obvious as to be invisible to the average Japanese person, but which can feel miraculous to certain folks from certain other counties. And thereby a set of qualities worth protecting and nurturing. None of this would have happened without SPECIAL PROJECTS. I wouldn’t have felt the permission to do that 10 city tour. To look closely and intimately. To write extensively about those experiences. So that when — a year later — my editor at the New York Times came knocking, asking for recommendations, I was able to say without hesitation: Morioka! Catalyzing the whole fabulous cascade of 2023. (With a follow-up in February 2023.) This is what I mean when I say it’s sometimes impossible to know where a membership program will take you. And why it can be difficult to “plan” out your years. 2023 was maximally aberrational, but thanks to SPECIAL PROJECTS (and the implicit looseness the program enables), I was able to lean into, and both extract and deliver from that aberration (the interviews, the media, the returning to Morioka) tremendous value. But, it came at a price. As I began writing in the Year Two review — the core purpose of this program (and all the work I do — the pop-ups, the videos, everything) is to produce books. It turns out, gauntlets of media interviews suck from the same energy source as writing / editing / drafting books. So going into Year Six, I’m now fully aware of these trade-offs, and already I am protecting my time in a way I don’t think I would have known how to, had 2023 not happened. As it turns out, the new 52 City list came out, and my pick was placed at #3: Yamaguchi City. I spent January dodging incoming media requests, and will be batching them together at the end of March. Wish me luck. Members illustration by longtime collaborator and bud Luis Mendo #Members Only Website Starting this year, I’ve finally launched a “true” members-only site: members.specialprojects.jp. I never intended to make much “members only” stuff when I launched SPECIAL PROJECTS. In fact, it launched without anything you could call a “perk.” The framing was like that of NPR: become a member and “unlock the commons” of my free-for-all work. Over time, however, some members-only stuff percolated up through the grist of life and work. This was not deliberate, but more a byproduct of wanting to share / educate but keep the scope of that sharing somewhat “controlled.” When live-streaming to 10,000 people, I feel far less able to be vulnerable or explicitly honest vs live-streaming to several hundred people. So it was that during the early days of the pandemic, March 2020, I began to live stream my work sessions — laying out books in InDesign, designing websites like the Ise-ji mini-site, thinking about designing Kissa by Kissa and more — to members. Finally; it only took five years to make a proper members-only site Over time, I began to run “board meetings” — initially quarterly but now twice a year. (Quarterly was just too much; twice a year is the perfect balance of pain and value.) I’ve done other members-only Q&As related to books and projects and walks. We’ve done members-only launch events. All of that adds up over time, and the /videos page of the members’ website now contains some 69 videos totaling 112 hours. This was utterly unintentional and goes to show the power of how doing something consistently (if somewhat irregularly) results in an impressive corpus of work. What else lives on that members-only website? Well, we have some sweet wallpapers for your smartphone (finally updated after five years). You get access to the members-only podcast (Office Hours) which I updated zero times last year, but does have a few episodes. The biggest perk (to the point where all other perks could be removed and the program would still be valuable) is the discounts on books and photographic prints. I wrote about this extensively in the 2020 look back: The biggest shock-delight of 2020 was the success of my book Kissa by Kissa. We sold 1,000 copies in the first three days and almost 2,000 copies in three months. It’s a $95USD retail book. That’s bonkers. Thank you thank you thank you to everyone who bought the book and to everyone who has written in with kind words. … The stroke of unintended “business” genius of the launch was tying Yearly Memberships to a big discount on the book. Existing Yearly members got a $50 discount off that first edition. But I also offered a bundle for non-members wherein you could get a Yearly membership and the book all at once, discount inclusive. The conversion rate of non-members converting to members and buying the book is still extremely high. As we say in startup land: This here’s a fine “product-market fit.” The other value-rich perk (at least in my mind, and in terms of raw words) is access to the full archives of my pop-up newsletters from the last five years. Here is what is available as of February 2024: Nightingalingale — (ongoing) diary of writing and producing Things Become Other Things (210+ issues) TOKIO TŌKYŌ TOKYO³ — a week of walking Tokyo (7 issues) TOKIO TŌKYŌ TOKYO² — a week of walking Tokyo (7 issues) TOKIO TŌKYŌ TOKYO — a week of walking Tokyo (7 issues) BASIE!BOP!JAMAICA! — 16 days touring jazz kissa of northern Japan (16 issues) Kiiiiiiiiiiiiii — 14 days of research on the Kii Peninsula (14 issues) M,IBAW — A month-long photo journal of heading back into the world post-Covid (30 issues and I, of course, got Covid immediately) Tiny Barber, Post Office — walking 350 kilometers of mid-sized Japanese cities (30 issues) Where are all the Nightingales? — 550-kilometer walk through Kii (30 issues) Pachinko Road — 670-kilometer walk along the Tōkaidō (30 issues) SMS Project — 700-kilometer walk along the Nakasendō, my first “pop-up” newsletter / walk document (30+ issues) A considerable amount of “content!” (In total, some 200,000+ words of newsletters.) Why don’t I make these public? Because they’re all rough drafts, written in the moment. For most newsletter issues, I’ve spent some 6-8 hours walking and documenting before sitting down in the evening to write and edit and publish. This kind of work has become a sort of “ascetic practice” (to put an insufferable spin on it). But I make these archives available for members because the membership is what enabled these walks, funded these walks — both financially and spiritually. That’s the most potent thing I derive from SPECIAL PROJECTS:3 Permission to go, explore, unshackled from, say, pitching to a media incumbent. So offering an archive feels both like a thank you, and in the spirit of “education.” #Books in 2023 The biggest piece of tangible output in 2023 was the Fine Art Edition of my latest book, Things Become Other Things (“TBOT”). I had been working on this book since 2021 — kicked off by my Where Are All the Nightingales? pop-up walk that May. From there, I started a “21-Day Diary” called Nightingalingale, which was to chronicle the writing of what would become TBOT. Hilariously, I thought I would be done in 21 days. I just sent out the 210th issue in February 2024. Here are what some readers have written in to say about TBOT: I just finished reading TBOT. It is a tremendous piece of work. I was a blubbering mess when I finished it, always a good sign. I finished Things Become Other Things yesterday. Thank you, Craig. Beautiful (in form and word), honest, funny, and true … I don’t think there’s another book in my house that I feel like handling with such care AND carrying with me everywhere. My goodness, man, what a beautiful book … Weeping softly through the final pages I wanted nothing more than to begin again, paging through your magnificent words and images, feeling as though, somehow, I am on this journey with you … Thank you for this look into your life, spread across kilometers and pages, filled with pain and anger, sure, but so much more joy and kindness. I finished reading your book. Incredible. I really loved Kissa by Kissa, but this books intimacy really pulls you in. The last string of photographs was perfect. The book was really quite affecting. I don’t normally email authors like a maniac. The cover, paper, pictures are all very nice and wow, but… for a category of people, including me, the words manage to tackle a feeling that just doesn’t show up elsewhere except within. You wouldn’t mistake me for an editor/critic but I adored the writing form-rhythm-choice of words. Though I like what you write anyways the book is on its separate shelf when it comes to quality to the point that I stopped to admire it occasionally, thinking ’nicely done Craig!!’ and ‘Mr McPhee would approve’. I just read it, and wow! The way you weave the story of your walks and the passage rural Japan has been passing through and the story of your early life and its transformation and the story of Bryan is truly remarkable on both an intellectual and emotional level. This book will stay with me. And many more. (Nice notes like these go into my special hey, you're not a piece of shit.md file. Everyone should keep a you're not a piece of shit.md.) Unexpectedly, over th"
