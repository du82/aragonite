description = "An extensive review of the Leica Q camera — taken on a six month test in the field, in multiple shooting scenarios and multiple environments."
full_description = "The Leica Q A six month field test — by Craig Mod The Leica Q is the best travel camera I’ve ever used. Over these last six months, the Q joined me while on assignment in South Korea, trekking across Myanmar, hiking the mountains of Shikoku, and spending a few freezing nights on Mt. Kōya. It was used in searing heat, 100% humidity, covered in sweat amid rice fields beneath a relentless sun. And in subzero temples, as candlelit Shinto and Buddhist fire ceremonies ushered in a new year.[1] I traveled to these places mainly for work. And because I had no plans to return to them soon, I often had but one chance to get the necessary shots. The Q did not disappoint, hiccup, lock up, or stutter. The images in the essay are a testament to its capabilities. Leica Q The Q is small but substantial. Solid. It becomes an effortless all-day companion. Strapped across my chest, it was banged sideways against rocks, motorcycles, stone walls, metal water bottles, farmers, cats.[2] It captured everything thrown at it and into it. And while I was suspicious of the value of the camera at first, these past six months have made it clear that this machine has serious legs. I now understand the limitations of this photographic instrument, of which there are few. And I trust and enjoy it more than any other camera I’ve owned. Yes, even more than my iPhone. I believe that in hindsight — and I realize this sounds kind of crazy, as if I’ve binge-inhaled all of the Leica Kool-Aid at once — the Leica Q will be seen as one of the greatest fixed-prime-lens travel photography kits of all time. Fire up the percolator, pour over another single-origin, steep some English Breakfast, or just grab a flask of rye and your pitchforks and let’s deconstruct this beautiful thing. Dog — Kumano Shrine, Usui Pass, Nagano [f1.7, 1/8000s, ISO 100] view 1:1 “Photography is so linked to science that technical explanations are inevitable in any discussion of the esthetics of the camera.” — The History of Photography Framing the Q: Things that shouldn’t exist The Q was announced in June 2015, but it has been so popular (according to the Leica NYC store staff, it's the most popular launch they’ve ever seen), people are still on wait lists to get it. It took me three months to get mine. The Q has a “full-frame” (the equivalent surface area of a single frame of 35mm film) 24.2 megapixel CMOS sensor paired with a fixed, 28mm Leica Summilux f1.7 lens. You can’t remove the lens and it doesn’t zoom so you can only shoot at 28mm. 28mm is similar to the field of view of an iPhone. Incense, hand, Shikoku [f1.7, 1/125s, ISO 125] view 1:1 Make no mistake: The Q is a surgical, professional machine. It pairs best-of-class modern technology (superb autofocus, an astounding electronic view finder, workable ISOs up to and beyond 10,000, a fast processor, beefy sensor) with a minimalist interface packed into a small body, all swaddled in the iconic industrial design for which Leica has become famous. The result is one of the least obtrusive, most single-minded image-capturing devices I’ve laid hands on. The Panasonic GF1, announced September 2009; the Q’s great grandfather If the GF1 so many years ago[3] set in motion an entirely new genre of camera with micro four-thirds, the Q epitomizes it. If the iPhone is the perfect everyperson’s mirrorless, then the Q is some specialist miracle. It should not exist. It is one of those unicorn-like consumer products that so nails nearly every aspect of its being — from industrial to software design, from interface to output — that you can’t help but wonder how it clawed its way from the R&D lab. Out of the meetings. Away from the committees. How did it manage to maintain such clarity in its point of view?[4] Front of the Q; banged-up metal lens hood; hidden logos Focus — Auto and Manual The Q’s autofocus is fast and dependable. It makes my other cameras feel downright sluggish. Out of the approximately 8,000 photos I’ve taken over the last six months, only a dozen or so were missed because of improper target lock. I can’t count how many shots would have been missed without autofocus. The scale definitely tips in favor of autofocus. However! The Q also has a splendid manual focus mode. In fact, this may be the most satisfying manual focus lens I’ve ever used. It’s certainly the best I’ve ever felt on a digital camera. Manual focus is engaged by pressing an ingenious little tab on the focusing guide ring. This tab unlocks the ring and switches the camera into manual mode. In doing so, the Q merges both the manual focus interface and the engagement switch. It’s a creative and natural combination. The viewfinder then uses both magnification and focus peaking[5] to make it straightforward to acquire your target, even in near pitch-black, candlelit settings. This also has the added benefit of total discretion — autofocus activates the red focus-assist lamp below a certain lumen threshold. By focusing manually through the electronic viewfinder, and using the silent electronic shutter, the entire contraption operates in total stealth. The Q’s manual focus toggle / nib — the best instantiation of this interface element I've yet seen I can’t say enough good things about the Q’s manual focus mechanism. I’m smitten. Swooning, even. Of all the little touches on this device, manual focus may be my favorite. Unlike other digital camera manual focus rings, this one has a hard start and stop. It doesn’t keep rotating. There are edges to the mechanism and, from those edges, affordances to the experience. The result is that two meters away is always the same distance in ring rotation. Distance guides can be printed on the lens barrel allowing for dependable street photography zone focusing. As M rangefinder users know, there’s a certain muscle memory that allows for fast, accurate manual focus at shallow depths of field. The Q allows, if you so choose, to develop the same set of muscle intuitions. Shinto Fire Ceremony, New Year's Eve, 2015 — Koyasan, Wakayama, Japan [f1.7, 1/640s, ISO 640] view 1:1 Cropping I’ve never been a cropper. Having grown up photographing with film and spending years developing black and white photos in my university apartment in Philadelphia, cropping has always felt like a hack, a lie. Of course, all photos are lies, all photos are crops. The very definition of a photograph is to add edges to the world, slice off some snippet, place it in a tiny box. Or, as the late Chilean photographer Sergio Larrain put it, “The game [of photography] is to organize the rectangle.” I realize now that a “perfect” rectangle — pulled back so you see the edges of the negative in the exposed print (to “prove” you haven’t cropped) — is a parlor trick more than anything. Calligrapher, Ohenro [Uncropped] Calligrapher, Ohenro [Cropped] [f1.7, 1/125s, ISO 1250] view 1:1 The Q shoots only at 28mm. 28mm is pretty darn wide. And so I’ve found that in the last six months I’ve not only become a cropper, but I relish cropping. In fact, I even crop on the iPhone now, something I’ve never done before. Winterwalk, Koyasan [Uncropped] Winterwalk, Koyasan [Cropped] [f1.7, 1/125s, ISO 1600] view 1:1 The quality and resolution of Q sensor data far exceeds what’s needed for most use cases. You can zoom and zoom and crop and crop and the image still feels like archival data. Whispermonks, Shikoku [Uncropped] Whispermonks, Shikoku [Cropped] [f1.7, 1/500s, ISO 100] view 1:1 Of course, you lose the compression coupled with resolution that comes from the optics of a long lens, but you can eke far more play and versatility from this 28mm lens than I first imagined possible. If the thought of a fixed 28mm lens has you on the fence, consider reconsidering. Restaurant, Kyoto [Uncropped] Restaurant, Kyoto [Cropped] [f1.7, 1/125s, ISO 1250] view 1:1 The Q allows you to shoot in “auto-cropped” 35mm and 50mm modes. This just means that 35mm or 50mm frame lines are presented in the viewfinder and, when you press the shutter, the Q saves the image within those lines, approximating having a 35mm or 50mm lens. Of course, you lose resolution — it doesn’t magically make a 24.2 megapixel 50mm equivalent image. The Q ships with the frameline switcher mapped to the button most cameras use for exposure lock. This is probably to keep it from wallowing in some purgatory of menu obscurity. Thankfully, the Q allows you to remap that button. One of the first things I did when I got the Q was change it back to exposure lock. I shot using crop-mode for a few hours but, honestly, it didn’t make much sense. Of all the little touches on this camera, this crop-mode function is the only one that feels like a gimmick. Like some acquiescence to marketing department demands on the part of engineering and design. I find it far more pragmatic and fun to crop after-the-fact in Lightroom or Snapseed. I’m not concerned with precise “35mm” or “50mm” lens mimicry, but rather with the best crop for the image at hand. This philosophy feels like the natural way to approach digital photography — the crop being not only acceptable, but also an intuitive and native part of the digital development process itself. To shoot and not consider cropping is to somehow deny the medium part of what it does best. Sunset, Paju Bookcity guesthouse, South Korea [f1.7, 1/200s, ISO 100] view 1:1 Of all the “surprises” I’ve experienced shooting with the Q, this newfound delight in cropping has been the most effecting on the way I shoot and think about images — both before and after the decisive moment. If the prime metaphor for this camera is a scalpel, then the striking thing is that it keeps cutting — finer and finer — long after the image is captured. A stop along the Ohenro pilgrimage walk in Shikoku [f1.7, 1/3200s, ISO 100] view 1:1 Goodies in the dark “Lately it’s been striking me how I really love what I can’t see in a Photograph.” — Diane Arbus: A Biography The Q loves shadows. For years I’ve habitually underexposed a few stops to save highlights. Now I do so with even greater relish knowing the Q’s RAW files will allow me to tease out several more stops of detail from the shadows. Take, for instance, this image from New Year's Eve. I captured it as I ran alongside men carrying a giant burning torch towards a Shinto shrine for a pre-midnight ritual: Shinto Torch, original Shinto Torch, shadow detail Shinto Torch, shadow detail + cropped, Koyasan [f1.7, 1/125s, ISO 640] view 1:1 The details revealed are subtle but absorbing; we keep the energy and structure of the flame but also gain a bit of context: The stone lamp becomes a fully fledged object, the men below and aside the flame visible. Will they ignite themselves? We don't know. But now we can ponder it because we can see them. And that brush of spotlight upon the waterman’s shoe? A nice little twinkle in the corner. Do hulking Nikons and Canon perform similarly? Probably. Are they as easy to carry, minimal in interface, and as joyful to use as the Q? Probably not. Intermission #1: Storytime — A family Do you see this photo below? This family? It was my birthday. Our first day in the field. We were led through rice paddies in the countryside of Burma. This way, he said, the man who arranged the interviews for our work. We were there for work. But what’s important is this family. Birthday family [f1.7, 1/60s, ISO 3200] view 1:1 It was my birthday, you see. I had been sick, was still sick. And there is a certain brand of melancholy that descends only with sickness. A feeling amplified by a foreign setting, far from typical comforts. You feel vulnerable. Compounded by an overly dramatic, borderline ridiculous, fatalistic certainty that it will end (your birthday, the cold, life itself), that you are fallible, certainly not invincible. And that’s OK. I was in that fragile state on this day, my birthday, in the rice fields of Burma. We spoke with the head of this family for an hour and a half. Two hours. Part of the ritual of the work was to photograph them at the end. To take a snapshot. A memento that would be printed and returned to them as a token of gratitude. Here we were, in a room without electricity. Their home. And they all sat facing the slanting late afternoon light of the early Burmese summer crop season. The father is in the doorway, shirtless. He laughs. I photographed. Everyone was present. They were glad we were there. We were happy to have gotten their time. I felt my ailments lift, a little strength return. They were full of a love. A love we received. And although there was hesitation at first — rightful suspicion (you can still see it in the mother’s eyes; she gives this many shits: zero) — through translation we found common ground. Can you see that? I just puffed my cheeks and pulled my ear like a monkey behind the camera, which is not attached to my face, but rather held a bit below. The little girl laughs. She broke her arm riding a bicycle through the fields. Snap. This picture emerges. A perfect birthday present. Video I think the Q does video. Battery I bought an additional battery but I’ve never needed to use it in the field.[6] I’ve done full-day shoots of 300+ images and the battery has gone low, but never to zero. Still, it makes sense — if only for peace of mind — to carry an extra. You can even buy Panasonic branded ones identical to Leica’s and save some money. The unfortunate Leica Q charger, and a much cheaper Panasonic battery Unfortunately the Q does not allow for charging via USB. Meaning: You must carry around an external battery charger as you romp through the world. You can, however, hack your charger using Apple’s power adaptor plugs to avoid having to also carry a cable. I hope that Leica is able to add charging via USB in a future firmware update, but I fear it might be impossible. A lake boat, Okkan, Myanmar [f1.7, 1/640s, ISO 100] view 1:1 10,000 ISO The Q is the first camera I’ve felt comfortable pushing past 3,200 ISO. But I wasn’t comfortable initially. In fact, for the first two months, I shot only with its auto-ISO set to 3,200 max at a minimum shutter of 1/60th of a second. Boy, was I missing out. I now shoot with the Q maxed at 10,000 ISO and the shutter low-capped at 1/120th of a second. You almost never need 10,000 ISO. Technically, the Q maxes out at an absurd 50,000 ISO. I've never used it. I find the camera rarely breaches 6,400, and I do a lot of lowlight shooting. But when it needs the extra bump, it’s nice to have. The ISO 6,400 Q images are wholly usable. And images taken at 10,000 — if needed — work. Additionally, 1/60th of a second is quite slow. And by shooting at it, you're opening yourself up to motion blur or camera shake. I find that by forcing a minimum of 1/120th of a second means almost no lost shots. And because the Q has such capable high-ISO, I don’t mind trading low ISO for higher-speed shutters. On New Year’s Eve, during a goma taki fire ceremony at Eikoin Temple, I shot from 10,000 ISO down to 1,250 ISO, "
