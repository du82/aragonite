full_description = '''A transformative 300-mile walk along Japan’s ancient pilgrimage routes and through depopulating villages inspires a heart-rending remembrance of a long-lost friend, documented alongside remarkable photographs. 128 pp., 40 full-color photographs, printed and hand-bound in Japan, 1st ed. (2020): 1,000 signed copies. Current edition: 5th. I'm the author of several books including Things Become Other Things (SP 2023, Random House 2025), and Kissa by Kissa (SP 2020). Much of my writing chronicles my giant walks across Japan, a country that has been my home since 2000. Just to prove I'm not some total nudnik: I also write for The New York Times, The Atlantic, Eater, and other "big, fancy" publications. Want even more dorky, formal status callouts? Sure: I've been a MacDowell, VCCA, Tin House, and Ragdale writing fellow. (In the end, the only thing that matters is the quality and care of work you put out into the world.) My books occupy the intersection between "classic photography books," narrative non-fiction essays, and auto-fiction. Anyway, thanks for visiting my little nook on the web. And please consider subscribing to my newsletters: Always one-click to unsub. (Plus — I never look at unsubscription data so you don't even have to worry about hurting my feelings.) Preceding that film, the 1st ed. of my new book, Kissa by Kissa (2020), sold out in 48 hours. The 2nd ed. sold out in May, 2021. The third edition is also sold out (August, 2022). And now, unbelievably, we're on a fourth fifth edition! The campaign was run on Shopify using my open source crowdfunding templates — Craigstarter. Please let me know if you use them! I run a membership program called SPECIAL PROJECTS and it provides the emotional and financial backbone for almost all of the work I do. SP members get access to all sorts of SPECIAL stuff (work livestreams, "board member" meetings, members-only podcasts, and more).'''
