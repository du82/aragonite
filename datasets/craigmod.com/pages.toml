title = "Post-Artifact Books and Publishing — by Craig Mod"
description = "How does digital affect publishing spaces? How do we talk about these effects?"
full_description = '''Post-Artifact Books and Publishing: Digital's effect on how we produce, distribute and consume content. — Craig Mod, June 2011 "Roger Bacon held that three classes of substance were capable of magic: the herbal, the mineral, and the verbal. With their leaves of fiber, their inks of copperas and soot, and their words, books are an amalgam of the three." — Matthew Battles, Library: An Unquiet History1 What is a book, anymore, anyway? 2 We will always debate: the quality of the paper, the pixel density of the display; the cloth used on covers, the interface for highlighting; location by page, location by paragraph. Stop there.3 Hunting surface analogs between the printed and the digital book is a dangerous honeypot. There is a compulsion to believe the magic of a book lies in its surface. In reality, the book worth considering consists only of relationships. Relationships between ideas and recipients. Between writer and reader. Between readers and other readers — all as writ over time. The future book — the digital book — is no longer an immutable brick. It's ethereal and networked, emerging publicly in fits and starts. An artifact ‘complete’ for only the briefest of moments. Shifting deliberately. Layered with our shared marginalia. And demanding engagement with the promise of community implicit in its form. The book of the past reveals its individual experience uniquely. The book of the future reveals our collective experience uniquely. For those of us looking to shape the future of books and publishing, where do we begin? Simply, these are our truths: The way books are written has changed. The canvas for books has changed. The post-published life of a book has changed. To think about the future of the book is to understand the links between these changes. To think about the future of the book is to think about the future of all content. So intertwined are our words and images and platforms, that to consider individual parts of the publishing process in isolation is to miss transformative connections. These connections shaping books and publishing live in emergent systems behind the words. Between the writing and the publishing, publishing and consuming, consuming and sharing. We have an opportunity now to shape these systems. And in doing so, to refine the relationships between authors, publishers, readers and texts. What tools will we embed within digital artifacts to signal this shifting relationship with literature? To surface our shared experience? To bridge the raw pre- and post- artifact spaces that so define the future of publishing? To build the future book? Summary of Sections 1.The Book, a System 2.Pre-artifact Systems 2a.Examples 3.No Longer Great, nor Immutable, Artifact 4.Post-artifact Systems 5.Shifting Expectations 1. The Book, a System Classic Publishing Two+ years between Idea and Reader A lonely, isolated pre-artifact system. An immutable non-networked artifact. A near non-existent post-artifact system. Books are systems. They emerge from systems. They themselves are systems — the best of which are as complex as is necessary, and not one bit more. And once complete, new systems develop around their content. To understand where books and publishing are moving, it is critical to understand the following three systems: the pre-artifact system the system of the artifact the post-artifact system A system of isolation, involving very few people. The pre-artifact system is where the book or story or article is made. It’s a system full of (and fueled by) whiskey, self-doubt, confusion, debauchery and a general sense of hopelessness. Traditionally, it’s been a system of isolation, involving very few people. The key individuals within the classic manifestation of this system are the author and the editor. A publisher, perhaps. A muse. But generally, not the reader. The end product of this system is what we usually define as ‘the book’ — the Idea made tangible. The artifact — the book — too, is a system. Traditionally, an island unto itself. Immutable. A system self-contained. One requiring great efforts to extend beyond the binding. When finished, it becomes a souvenir of a private journey.4 Finally, the post-artifact system. This is the space in which we engage the artifact. Again, traditionally a relatively static space. Isolated. Friends can gather to discuss the artifact. Localized classes can be constructed in universities around the artifact. But, generally, there is an overwhelming sense of disconnection from the other systems. Digital changes this. Most fundamentally digital removes isolation. Removes it from the pre-, artifact, and post- systems. The corollaries: an increase in connectivity. Mutability of artifact. Continuous engagement with readers. And most excitingly, a potentially public record of change, comment, discussion — digital marginalia — layered atop the artifact, adding to the artifact, and redefining ‘complete.’ With the connection of these systems, our classic definition of a literary artifact no longer applies. And our common understanding of publishing systems is irrevocably disrupted. 2. Pre-Artifact Systems With the emergence and growing adoption of the Kindle and the iPad, publishers, writers, readers and software-makers have concerned themselves with shoehorning the old-media image of a book into new media. Everyone asks, ‘How do we change books to read them digitally?’ But the more interesting question is, ‘How does digital change books?’ And, similarly, ‘How does digital change the authorship process?’5 This authorial shift is critical to the understanding of the new pre-artifact system. fig. 01The injection of readers early into the authorial process. With digital impermanence (a new kind of ephemerality) comes two concepts key to the future of storytelling and books: We can continuously develop a text in realtime, erasing the preciousness imbued by printing. And because of this ... Time itself becomes an active ingredient in authorship (in contrast to authorship happening in a seemingly timeless place, a finished product suddenly emerging). Wikipedia is a fully realized example of how digital drastically affects authorship. By creating a system that allows collective edits in real-time, Wikipedia has embedded iterative writing into its foundation. Nothing on that site is precious. No letter, word, sentence or article is immune to reconsideration. And yet, by tracking changes on a micro scale, they’ve built trust around a continuously evolving system. Consider the physical analog to Wikipedia — the encyclopedia set. In the early naughts, it would have been difficult to imagine that a website written and edited by hundreds of thousands of people, constantly mutating, could have possibly formed the replacement for that dusty set of leather bound books on your bookshelf. And yet, not only has Wikipedia replaced the physical encyclopedia for many of us, but it’s surpassed it in usefulness, quality, timeliness6 and perhaps most significantly, convenience. The core editorial ethos of the physical encyclopedia still informs Wikipedia, but the ways in which content is created, shared, and edited are born from digital. fig. 02James Bridle's The Iraq War7The entire Wikipedia editorial history for the Iraq War entry, printed and bound — the pre-artifact system manifest physically Take a set of encyclopedias and ask, “How do I make this digital?” You get a Microsoft Encarta CD. Take the philosophy of encyclopedia-making and ask, “How does digital change our engagement with this?” You get Wikipedia. When we think about digital’s effect on storytelling, we tend to grasp for the lowest hanging imaginative fruits. The common cliche is that digital will ‘bring stories to life.’ Words will move. Pictures become movies. Narratives will be choose-your-own-adventure. While digital does make all of this possible, these are the changes of least radical importance brought about by digitization of text. These are the answers to the question, “How do we change books to make them digital?” The essence of digital’s effect on publishing requires a subtle shift towards the query: “How does digital change books?” 2a. A few examples (Companies and individuals leveraging changes in publishing systems): Getting Real — Jason Fried & David H. H. Poke The Box — Seth Godin Codex — ilovetypography My Blood Approves — Amanda Hocking The Shape of Design — Frank Chimero Annabel Scheme — Robin Sloan Art Space Tokyo — Ashley Rawlings & Craig Mod As much as it may pain literary purists to admit, blogs have been laying the foundation for this kind of on-the-fly contemporary book writing for over a decade. 37Signals’ title, Getting Real, was composed over the course of years on their blog Signal vs. Noise.8 RSS subscribers to Signal vs. Noise had been reading Getting Real without knowing it. Heck, 37Signals had been writing Getting Real without knowing it. Consider that they sold 30,000 PDFs at $19 a piece. That’s over half a million dollars in revenue (profit, really — there are no distribution costs or middle men). For a book that was authored publicly. And this, in 2006. Frank Chimero9 has been sketching a book live. It’s his blog. He’s been working hard at fleshing out ideas around creativity and design for years now. And he’s built up such a community of supporters, they paid him $100,000 in February 2011 to go deeper. The Shape of Design promises to continue exploring the narrative threads on his site. To formalize. In Spring of 2010, Ashley Rawlings and I ran a campaign to crowd-fund the production and publication of the second edition of Art Space Tokyo. 10 We raised $24,000 in a month. And shared the entire process in painstaking detail for others to replicate. 11 Robin Sloan12 has been writing and releasing short stories in digital formats for the grateful many of us fans. He is now returning to dive deeper into those pieces that had particular resonance with his intended audience — fleshing out shorter works into full length novels. Amanda Hocking13 writes a blog. She also publishes her novels independently on the Amazon Kindle platform. They’ve done well. In the past year she’s sold over a million Kindle books. John from I Love Typography14 has been writing a publication live. It’s — surprise! — his blog. And now he, too, (with the help of editor Carolyn Wood15 and friends) is formalizing his ideas into the bona-fide journal, Codex.16 Beautifully produced, masterfully edited, Codex is a collection of thoughtfully curated pieces on typography. A compendium of John's love for type wrapped, marketed and priced in a way that takes advantage of his amazing community. It leverages changes to the classic publishing system to make it self-sustainable. Seth Godin has been so deeply influenced by his blog’s readership and the strength of his community that he threw his hands up and flat-out started his own publishing company. Domino17 comes from ideas that emerged in front of the audience he was ultimately trying to reach. It's a beautiful example of a sustainable ecosystem emerging from wholesome conversation. The list continues indefinitely. To be even more hyperbolic: we are amidst undeniable, fundamental change to authoring processes. The friction and distance between you and your readership? Gone.18 ... the subtle editorial push and pull by the number of page views and comments. The ‘live iteration‘ born from these changes frees authors from isolation (but still allows them to write in isolation). The audience and author become conversant sooner. Writers can gauge reader interest as the story unfolds and decide which topics are worth further exploration. As 37Signals, Frank, John, Robin, Amanda and Seth refined their authorial philosophy before an audience of tens (if not hundreds) of thousands of readers, it’s easy to imagine the subtle editorial push and pull by the number of page views and comments they received on each blog entry. Which is to say, these frictionless, often indirect reader actions brought by digital to the pre-artifact system can manifest in the final authorial output. Richard Nash of Soft Skull19 publishing fame and more recently founder of literary startup Cursor,20 has placed this pre-artifact system squarely in his sights. On why the disruption of the pre-artifact system is so necessary — hell, even morally required — he says: 21 We have tended to speak of the model of publishing for the last hundred years as if it were a perfect one, but look at all the indie presses that arose in the last 20 years, publishing National Book Award winners, Pulitzer winners, Nobel winners. What happened to those books before? They weren’t published! They. Were. Not. Published. Sure, some were, but most? Nope. We cannot know how much magnificent culture went unpublished by the white men in tweed jackets who ran publishing for the past century but just because they did publish some great books doesn’t mean they didn’t ignore a great many more ... So we’re restoring the, we think, the natural balance of things the ecosystem of writing and reading. His new imprint, Red Lemonade, is built to elicit conversations around books. Often before they're complete. Certainly a terrifying notion for many, but also an inevitable product of the opening of the pre-artifact system. And like many things inevitable in the evolution of entrenched methodologies — you can either bemoan and lament and eulogize the old, or become an active participant in the shaping of the future. Of course, no author is obligated to embrace or engage these changes. But these changes do beg the question: just where does the digital artifact begin and end? When is it ‘completed?’ 3. The Fall of the Great Immutable Artifact The digital book is a strange beast. It’s intangible and yet wholly mutable. Everywhere and nowhere. We own it, but yet, don’t.22 Its qualities mimic physical books only on a meta-level. Have you ever edited and sent files to a printer to be reproduced several thousand times? It’s terrifying. To truly understand how strange and special they are, it helps to have experience with their analog cousins. Have you ever made a physical book before? What I mean is, have you ever edited and sent the files to a printer to be reproduced several thousand times? It’s terrifying. There is a pervasive hopelessness to the entire process. You know there must be mistakes. Check page numbers and punctuation a hundred times still, and by the sheer magnitude of molecules composing a book, you will miss something. So submitting that file to be printed is to place ultimate faith in the book. To believe — because you must for the sake of sanity! — that this is the best you can do given the constraints. And you will have to live with the results forever.23 This is what makes physical so weighty. So precious. No matter how much you prepare, if you haven’t executed well, any misstep will be writ a thousand times over. fig. 03The multiplicity of books. W'''
year_published = 2025
clearnet = "https://craigmod.com/journal/post_artifact"
