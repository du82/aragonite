description = "W. David Marx and I talk about his book Ametora, Japanese culture, and books in translation."
full_description = '''An interview with designer and letterer Jessica Hische, author of the best-selling children's book, Tomorrow I'll Be Brave. An interview with Lisa Brennan-Jobs, author of the best selling memoir, Small Fry. Lisa and Craig Mod discuss the design, production, and writing of this fascinating book about family, identity, and the complications of growing up in Palo Alto as the daughter of Steve Jobs. A walk in the woods with Craig Mod, talking about the economics and production of his book made in collaboration with Dan Rubin, Koya Bound. Elena Favilli is the co-creator (along with Francesca Cavallo) of Timbukutu Labs, a company that used to make apps and now makes international best selling books. Technologist, futurist, author, and photographer Kevin Kelly discusses traveling during the golden age of global exploration. We cover how photography has changed over the years, his decades cavorting through Asia in the 1970s and 80s, and how he self-produced (eventually getting it published by Taschen!) his Asia Grace book in the 90s. Designer and author Frank Chimero discusses the process behind his seminal design book, "The Shape of Design." We dig into the normalization of paying creative people to make things via crowd funding and patronage platforms, and why there's never been a better time to make books. Researcher and author Jan Chipchase has a new book — "The Field Study Handbook." We discuss how he came to produce this 500+ page magnum opus — a distillation of his life's work — and why he is self publishing.'''
