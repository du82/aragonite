["https://www.cravath.com/pro-bono/index.html"]
title = "Pro Bono | Cravath, Swaine & Moore LLP"
description = """
Challenging pro bono work has long been a cornerstone of our practice. It is a fundamental part of who we are and it is critically important to those whom we help. The full resources of the Firm are brought to bear in support of every pro bono matter, whether the client is a low‑income single mother or a coalition of U.S. Congress members. 
Our pro bono work also provides a meaningful way for our…"""
full_description = "Challenging pro bono work has long been a cornerstone of our practice. It is a fundamental part of who we are and it is critically important to those whom we help. The full resources of the Firm are brought to bear in support of every pro bono matter, whether the client is a low‑income single mother or a coalition of U.S. Congress members. Our pro bono work also provides a meaningful way for our lawyers to develop and strengthen their legal skills. Associates and summer associates are strongly encouraged to take on pro bono clients, and they’re instructed to provide them with the same top‑tier representation we offer our paying clients. Under a partner’s supervision, associates have taken the lead in cases where they represent domestic violence survivors, political asylum seekers, hospitalized children, wrongfully convicted inmates, victims of racial and gender discrimination, and many others. Associates have provided transactional advice to non‑profit organizations, and they have worked on precedent‑setting litigation in areas that range from civil rights to copyright law. From defending one of the first Native Americans tried for the murder of a white man in New York to helping establish the Miranda doctrine, our attorneys have achieved landmark victories in civil rights cases that have changed society for the better. Pro bono opportunities are readily available to lawyers in all the Firm’s practice areas. Our legal services partners include the ACLU, American Immigrant Representation Project, Brennan Center for Justice, CAIR NY, Catholic Charities, Center for Global Enterprise, City Bar Justice Center, Disability Rights Advocates, Equal Justice Initiative, Harvard Law & Entrepreneurship Project, Her Justice, Human Rights First, Immigrant Defense Project, Immigrant Justice Corps, Immigration Equality, Innocence Project, KIND, Lambda Legal, Lawyers Alliance, Lawyers Committee for Civil Rights Under Law, The Legal Aid Society of New York, Legal Services NYC, National Center for Law and Economic Justice, Neighborhood Defender Service of Harlem, New York City Anti‑Violence Project, New York Lawyers for the Public Interest, New York Legal Assistance Group, NYU Veterans Legal Services Project, Office of the Appellate Defender, Sanctuary for Families, Transgender Legal Defense & Education Fund, Trustlaw, Vera Institute of Justice, Volunteer Lawyers for the Arts, and Volunteers of Legal Service, and many of them have recognized the Firm with awards for our pro bono work."
year_published = 2025
