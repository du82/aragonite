["https://www.cravath.com/news-insights/citis-dollar25-billion-private-credit-direct-lending-program-with-apollo.html"]
title = "Citi’s $25 Billion Private Credit, Direct Lending Program with Apollo | Cravath, Swaine & Moore LLP"
description = "On September 26, 2024, Citigroup Inc. (“Citi”) and Apollo announced they have entered into an exclusive agreement for a subsidiary of Citi and certain affiliates of Apollo to form a landmark $25 billion private credit, direct lending program initially in North America, with the potential to expand to additional geographies. The program will include participation from Mubadala Investment Company as…"
full_description = "On September 26, 2024, Citigroup Inc. (“Citi”) and Apollo announced they have entered into an exclusive agreement for a subsidiary of Citi and certain affiliates of Apollo to form a landmark $25 billion private credit, direct lending program initially in North America, with the potential to expand to additional geographies. The program will include participation from Mubadala Investment Company as Apollo’s strategic partner as well as Apollo’s subsidiary, Athene, both of which will have the opportunity to join commitments appropriate for their respective mandates. The firms anticipate the program will finance approximately $25 billion of debt opportunities over the next several years, encompassing both corporate and financial sponsor transactions, and maintain the flexibility to significantly expand the size of the program beyond the initial $25 billion. Cravath is representing Citi in connection with the agreement. The Cravath team is led by partners Andrew J. Pitts, Stephen M. Kessing and Ryan J. Patrone and includes associates Kelly N. King and Benjamin B. Deutsch on financing matters; and partners Jelena McWilliams and Jeffrey T. Dinwoodie, of counsel Will C. Giles and associate Jonathan A. Gordon on bank regulatory matters. Cravath represented QUALCOMM Incorporated in connection with its $4 billion revolving credit. QUALCOMM Incorporated is a global leader in the development and commercialization of foundational technologies for the wireless industry. The transaction closed on August 8, 2024. Cravath represented the administrative agent, joint lead arrangers and joint bookrunners in connection with $3.1 billion of credit facilities made available to Aptiv PLC and certain of its subsidiaries. Aptiv PLC is a leading global technology and mobility architecture company primarily serving the automotive sector. The facilities consisted of a $2.5 billion bridge credit facility, used to partially finance the accelerated share repurchase of up to $3.0 billion of Aptiv PLC’s ordinary shares, and a $600 million term loan facility. The transactions closed on August 1, 2024, and August 19, 2024."
