["https://www.cravath.com/alumni-journal/articles/two-manhattan-west-nods-to-cravaths-future-in-both-design-and-function.html"]
title = "Two Manhattan West Nods to Cravath’s Future in Both Design and Function | Cravath, Swaine & Moore LLP"
description = """
After 35 years at Worldwide Plaza, Cravath’s New York employees stepped into their new office for the first time in April 2024. The move to 375 Ninth Avenue was years in the making, with the lease signed in October 2019 and construction starting later that year, finishing in January 2024.
In the intervening period, Firm decisionmakers and Gensler architects created a vision for—and then completely…"""
full_description = "The bespoke space—occupying 13 full floors in the building and designed in close collaboration with global architecture firm Gensler—is centered around communal areas that embody Cravath’s longstanding culture of collaboration and collegiality, while its technology‑forward capabilities bolster on‑site functionality for clients and attorneys alike. After 35 years at Worldwide Plaza, Cravath’s New York employees stepped into their new office for the first time in April 2024. The move to 375 Ninth Avenue was years in the making, with the lease signed in October 2019 and construction starting later that year, finishing in January 2024. In the intervening period, Firm decisionmakers and Gensler architects created a vision for—and then completely reimagined, all during a global pandemic—what a state‑of‑the‑art workplace for a law firm entering its third century might look like. One question was how the space could best be equipped for Cravath to serve its clients and visitors; another, how its design and floorplan might facilitate the most effective working environment for the Firm’s lawyers and staff. With those principles in mind, each detail was imbued with the goal of enhancing the Firm’s ability to host clients for collaborative work while also providing organic opportunities for its people to connect across practices and departments. The result is a purposefully designed space that aligns with how Cravath attorneys and staff do their jobs today while allowing flexibility for the evolving needs of the legal industry well into the future. “Nothing was predetermined, and in some ways that is what makes the space so quintessentially Cravath,” said David Perkins, one of six partners on the internal Design Committee. Envisioning and executing the office to the highest standards possible was a “true team effort” between the committee, Gensler and numerous other Firm stakeholders—including senior and junior partner leadership and staff members responsible for technology, hospitality and security—throughout the entire process, according to Perkins."
year_published = 2025
