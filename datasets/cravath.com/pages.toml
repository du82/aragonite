["https://www.cravath.com/alumni-journal/articles/a-conversation-with-mohammad-vakil.html"]
title = "A Conversation with Mohammad Vakil | Cravath, Swaine & Moore LLP"
description = """
Let’s talk a bit about your role and responsibilities…
What do you enjoy most about your job?
Outside of family, being General Counsel of Tempur Sealy has been one of the most meaningful experiences of my life. I love our team, I love our products and I love the fact that every day we bring better sleep to more people around the world—something that helps them live healthier, happier lives. And I…"""
full_description = "Mohammad (Mo) Vakil is the General Counsel of Tempur Sealy International, Inc. He started at Tempur Sealy in February 2018, and was previously Associate General Counsel at the company. Outside of family, being General Counsel of Tempur Sealy has been one of the most meaningful experiences of my life. I love our team, I love our products and I love the fact that every day we bring better sleep to more people around the world—something that helps them live healthier, happier lives. And I love representing and working for the 13,000 employees we have around the world who make this all happen. We really are a global team and I know that what I do every day affects their lives and their families’ lives just as what they do affects me and my family. We work hard for our customers and our shareholders, but we also work hard for each other. I see everything from employment matters to multi‑year M&A deals to near decade-long IP litigations. We have a presence in over 130 countries—so each day can bring something new and exciting. How has the scope of your work changed from the time that you started until now? What are some of the new (or unexpected) challenges you’ve had to prepare for and solve? We’ve been very acquisitive since I took on my current position. Between financing initiatives and M&A, we’ve done almost $8 billion in transactions. And we’ve also doubled our workforce since I started with the company. I was in private practice for several years before going in-house. My practice was weighted toward litigation, but I always had a role in governance and M&A matters. After my time as an associate at Cravath, I served a multi-year posting in the Middle East with an international law firm, helping open its offices in the UAE. There, I worked on the country’s largest judicial and legal reform project up to that point, advising on modernizing the country’s laws, training its judiciary and building government agencies from the ground up. I also served a posting in the Netherlands."
year_published = 2025
