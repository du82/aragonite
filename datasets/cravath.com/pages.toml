["https://www.cravath.com/people/stephen-m-kessing.html"]
title = "Stephen M. Kessing | Cravath, Swaine & Moore LLP"
description = "Stephen M. Kessing is Co-Head of the Banking and Credit Practice. He advises financial institutions, corporate borrowers and private equity sponsors on a broad range of finance transactions, including complex syndicated loan and direct lending transactions, capital markets transactions, restructurings and debtor‑in‑possession financing, as well as mergers and acquisitions."
full_description = "Stephen M. Kessing is Co-Head of the Banking and Credit Practice. He advises financial institutions, corporate borrowers and private equity sponsors on a broad range of finance transactions, including complex syndicated loan and direct lending transactions, capital markets transactions, restructurings and debtor‑in‑possession financing, as well as mergers and acquisitions. Mr. Kessing has extensive experience representing U.S. and international companies across such diverse industries as aerospace (AerCap, Alliant Techsystems, Atlas Air, SMBC Aviation Capital, Tenax Aerospace), consumer (Anheuser‑Busch InBev, ASOS, British American Tobacco, Unilever, Vista Outdoor, Worldstrides), financial services (Element Financial, Lazard, White Mountains), healthcare (Akorn, AmerisourceBergen, HLS Therapeutics, Johnson & Johnson, Novartis), hospitality and leisure (Starwood Hotels, Universal Orlando), industrials (AdvanSix, Honeywell, J.M. Huber, Martin Marietta, Minerals Technologies, Olin, Stanley, Synthomer), information technology (Conduent, Genpact, Xerox), media and entertainment (Cox Enterprises, Graham Holdings, Hasbro, Reservoir Media Management, Univision), technology (D+H, FactSet, IBM, JD Power, Orbotech, Zotec Partners), telecommunications (altafiber, CyrusOne, Frontier) and utilities (PG&E). Mr. Kessing has also represented J.P. Morgan, Citibank, Bank of America, Jefferies, Wells Fargo, Credit Suisse and Goldman Sachs in syndicated loan, equity, high‑yield bond and leveraged acquisition transactions. The Legal 500 US reports Mr. Kessing is “a key name for sports financing” and he has advised on financings involving teams in each of the major sporting leagues. His private equity clients have included Eurazeo, NTC Group and Sound Point Capital. Mr. Kessing has been repeatedly recognized as a leading lawyer in banking and finance by Chambers USA, Chambers Global, The Legal 500 US, IFLR1000, Lawdragon and Super Lawyers. He is described as “incredibly savvy and very commercial.” Mr. Kessing is a repeat author on market trends in leveraged finance published by Lexis Practice Advisor and he serves as the Board Secretary of the National Action Council for Minorities in Engineering. Mr. Kessing also serves on the Board of Trustees of Canterbury School."
