["https://www.cravath.com/diversity-and-inclusion/policy.html"]
title = "Policy | Cravath, Swaine & Moore LLP"
description = """
Equal Employment Opportunity Policy Statement
Cravath, Swaine & Moore LLP is committed to maintaining a work environment in which all individuals are treated with respect and dignity. Each individual has the right to work in a professional atmosphere that promotes equal employment opportunities and prohibits discriminatory practices, including harassment. To that end, Cravath expects that all…"""
full_description = "Cravath, Swaine & Moore LLP is committed to maintaining a work environment in which all individuals are treated with respect and dignity. Each individual has the right to work in a professional atmosphere that promotes equal employment opportunities and prohibits discriminatory practices, including harassment. To that end, Cravath expects that all relationships among persons in the workplace will be business-like and free of bias, prejudice and harassment. Cravath is an equal opportunity employer. It is the policy of the Firm to ensure equal employment opportunity without harassment or discrimination on the basis of race, religion or religious belief, sex (with or without sexual conduct), gender identity/expression, color, national origin, immigration or citizenship status, disability, sexual orientation, age, military status, genetic predisposition or carrier status, marital or civil partnership status, pregnancy or related medical conditions, caregiver status, status as a victim of domestic violence, stalking or sex offenses, sexual and reproductive health decisions, credit information, criminal history or any other basis protected by federal, state or local law, ordinance or regulation. This Policy applies to recruiting, hiring, placement, promotions, training, discipline, terminations, layoffs, transfers, leaves of absence, compensation and all other terms and conditions of employment. The Firm strictly prohibits harassment or discrimination on the basis of race, religion or religious belief, sex (with or without sexual conduct), gender identity/expression, color, national origin, immigration or citizenship status, disability, sexual orientation, age, military status, genetic predisposition or carrier status, marital or civil partnership status, pregnancy or related medical conditions, caregiver status, status as a victim of domestic violence, stalking and sex offenses, sexual and reproductive health decisions, credit information, criminal history or any other basis protected by federal, state or local law, ordinance or regulation. Employees who believe they are the subject of discrimination or harassment are encouraged to refer to the Firm’s Policy Against Discrimination and Harassment and to report such perceived offenses to the Committee that administers the Policy Against Discrimination and Harassment. The Firm also prohibits retaliation against any individual who reports discrimination or harassment or participates in an investigation of such reports. Appropriate disciplinary action may be taken against any employee whose conduct is inconsistent with this Policy."
year_published = 2025
