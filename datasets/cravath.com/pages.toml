["https://www.cravath.com/practices/practices/executive-compensation-and-benefits.html"]
title = "Executive Compensation and Benefits | Cravath, Swaine & Moore LLP"
description = "Cravath has been known as one of the premier U.S. law firms for two centuries. Each of our practice areas is highly regarded, and our lawyers are recognized around the world for their commitment to the representation of our clients’ interests. Throughout our history, we have played a central role in developing how law is practiced, how lawyers are trained and how business risk is managed. We are not, and do not strive to be, the largest law firm measured by number of offices or lawyers. Our goal is to be the firm of choice for clients with respect to their most challenging legal issues, most significant business transactions and most critical disputes."
full_description = "Cravath’s Executive Compensation and Benefits Department advises U.S. and multinational clients in all aspects of compensation and benefits. Executive compensation and employee benefit issues are central concerns in most corporate transactions. Our lawyers are experienced at analyzing the corporate governance implications and legal and financial risks associated with compensation and benefit arrangements, as well as navigating interrelated securities law, disclosure, investor relations, tax, ERISA and accounting issues. The compensation and benefit matters that arise in merger and acquisition transactions are the primary focus of the Department. Our lawyers negotiate key terms of acquisition agreements, develop executive succession arrangements and design and implement new compensation and benefit plans. In addition to our transactional experience, our executive compensation and benefits lawyers work closely with our litigators to handle matters involving employment, employee benefits and ERISA issues, including in class action lawsuits that may be intertwined with securities and shareholder derivative cases. We have broad experience in disputes that involve employee noncompetition and nonsolicitation agreements, internal investigations of claims of executive misconduct, modifications of employee retirement and benefits agreements and whistleblower claims. We also advise our clients in connection with the complexities of their ongoing compensation and benefits practices. We help prepare the executive compensation disclosure in annual proxy statements for public companies, including the CD&A and any management compensation proposals, such as say‑on‑pay and approval of new equity compensation plans. In addition, we counsel our clients on the increasingly important issue of investor relations, including the management of relations with corporate governance watchdogs such as ISS/Glass Lewis and major institutional shareholders, as well as in defense against activist shareholders. We are also frequently asked to represent CEOs and other senior executives and corporate clients in crafting individual employment and severance agreements."
year_published = 2025
