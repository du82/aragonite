["https://www.cravath.com/practices/practices/litigation/index.html"]
title = "Litigation | Cravath, Swaine & Moore LLP"
description = "Cravath has been known as one of the premier U.S. law firms for two centuries. Each of our practice areas is highly regarded, and our lawyers are recognized around the world for their commitment to the representation of our clients’ interests. Throughout our history, we have played a central role in developing how law is practiced, how lawyers are trained and how business risk is managed. We are not, and do not strive to be, the largest law firm measured by number of offices or lawyers. Our goal is to be the firm of choice for clients with respect to their most challenging legal issues, most significant business transactions and most critical disputes."
full_description = "For generations, Cravath’s litigators have devised creative resolutions to complex disputes—consistently pushing beyond the “playbook” to deliver the best results for our clients. Drawing on our deep bench of trial‑ready attorneys, we have repeatedly secured precedent‑setting results that have reshaped the legal and business landscapes. Cravath stands out “for its persistence and ability to help define industries,” and we are among the few top firms of choice for clients facing their most difficult and critical litigation. (Financial Times) Cravath trains generalist litigators with the tools to tackle complex cases from every angle. We see the broader picture, so we can devise and deliver innovative approaches to the problem at hand, regardless of the subject matter, industry or client’s role in a particular dispute. The credibility and experience we bring to each matter and our preparation of each case from the outset as if it is going to trial give us a strategic advantage in all steps of litigation. Our litigators “have repeatedly gone the distance in some of the thorniest, most complex trials and appeals,” understanding how to explain complex issues and technology simply and clearly without getting lost in the weeds. (The American Lawyer) Because Cravath’s litigators are trained across a broad array of legal areas, the same team can handle general commercial claims as well as disputes involving more specialized areas of the law, allowing us to use small teams and be more cost‑effective. We also work closely with clients to understand and appreciate their business objectives and culture to provide both short- and long‑term solutions. Cravath’s litigators are not just legal advisors—we are our clients’ partners in developing workable solutions to the wide range of issues they face. Cravath’s litigation department is uniformly recognized as among the best in the country. Our team has been named New York Law Journal’s overall “Litigation Department of the Year” three times in the past six years, most recently in 2024, as well as the publication’s “Class Action Litigation Department of the Year.” The American Lawyer, which has twice shortlisted the Firm for its nationwide “Litigation Department of the Year” award, notes that “Cravath stands out for its novel arguments” and is “at the ready to handle any complex, pivotal case that comes its way.” Benchmark Litigation further describes Cravath as “the standard bearer... command[ing] respect on the national stage for its prestige and unassailable brand,” and has repeatedly honored the Firm, including as “Trial Firm of the Year” and “General Commercial Firm of the Year.” In addition, Cravath received Legalweek’s Leaders in Tech Law Award for “Litigation and E‑Discovery,” and has earned recognition from the Financial Times as both “Most Innovative Law Firm for Legal Expertise” and “Most Innovative for Dispute Resolution.”"
