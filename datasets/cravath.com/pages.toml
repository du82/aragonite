["https://www.cravath.com/alumni-journal/articles/sam-butler-retired-from-cravath-since-2003-remains-a-beacon-for-todays-lawyers.html"]
title = "Sam Butler Remained a Beacon for Cravath Lawyers Long After His Retirement | Cravath, Swaine & Moore LLP"
description = """
Sam Butler, who passed away on January 4, 2025, at the age of 94, was one of Cravath’s longest‑serving Presiding Partners and widely considered one of the most respected lawyers of his generation—“a living legend of the New York bar,” as The Wall Street Journal described him in a 2007 Law Blog Q&A.
After retiring from the Firm in 2003, Sam became Partner Emeritus and held the title until his…"""
full_description = "Over his almost 50‑year career, Samuel C. Butler represented clients in several of the largest M&A transactions ever completed and mentored countless colleagues at the Firm. An extraordinary lawyer recognized both for his business acumen and generosity of spirit, his legacy continues on through the current and next generation of attorneys. Sam Butler, who passed away on January 4, 2025, at the age of 94, was one of Cravath’s longest‑serving Presiding Partners and widely considered one of the most respected lawyers of his generation—“a living legend of the New York bar,” as The Wall Street Journal described him in a 2007 Law Blog Q&A. After retiring from the Firm in 2003, Sam became Partner Emeritus and held the title until his death. He remained widely admired by the attorneys and clients who worked with and opposite him: for his high‑caliber practice, his personal grace and collegiality, and his longstanding commitment to mentorship. His steadfast leadership left ripples throughout the Cravath community and deeply impacted the legal world at large. Corporate partner Mark Greene recalled working with Sam as a first‑year Cravath associate in 1990. Witnessing the depth, wisdom and work ethic Sam brought to his practice inspired Mark, now the Head of the Corporate Department and Leader of the International Practice, to follow in his M&A footsteps. Of those initial impressions, Mark told Law360 in his 2021 MVP interview: “At that point in his career, Sam was the trusted adviser to C‑suites and boards across the country. And I looked at that role and I said, ‘That looks like a great career, because it looks to me like you only get better at this with age.’” Reflecting further on his relationship with Sam, Mark said in a recent conversation: “Working for Sam when I started at the Firm was the single most formative experience of my legal career. It was from observing him that I knew I wanted to become a counselor to senior executives and directors in their most difficult and complex dealings.”"
year_published = 2025
