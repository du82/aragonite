["https://www.cravath.com/people/david-h-korn.html"]
title = "David H. Korn | Cravath, Swaine & Moore LLP"
description = "David H. Korn focuses his practice on complex litigation, particularly in the areas of antitrust, securities and general commercial. Mr. Korn’s clients have included American Express, the Blue Cross Blue Shield Association and various member plans, Credit Suisse, First Solar, GTT Communications, PG&E Corporation, Sabre, The Walt Disney Company and The Williams Companies."
full_description = "David H. Korn focuses his practice on complex litigation, particularly in the areas of antitrust, securities and general commercial. Mr. Korn’s clients have included American Express, the Blue Cross Blue Shield Association and various member plans, Credit Suisse, First Solar, GTT Communications, PG&E Corporation, Sabre, The Walt Disney Company and The Williams Companies. Representing the Blue Cross Blue Shield Association (“BCBSA”) and more than a dozen member plans in consolidated multidistrict antitrust class action litigation—one of the largest class actions in the country—alleging that the Association and its members have used the Association’s agreements to fix prices and limit competition. He also represents BCBSA and various member plans in related opt‑out litigation across the country brought by large subscribers and providers. Representing PG&E in connection with mass tort litigation related to the California wildfires between 2019 and 2021. Represented GTT Communications and certain of its officers and directors in a securities class action concerning GTT’s $2.3 billion acquisition of Interoute Communications Holdings S.A. The parties reached a settlement in December 2020, which received final court approval in April 2021. Mr. Korn has been named to Benchmark Litigation’s “40 & Under List,” which recognizes the “best and brightest litigators across the U.S. and Canada.” He has also been recommended by The Legal 500 US for his work in media and entertainment, and included in Lawdragon’s “500 Leading Litigators in America,” “500 Leading Global Antitrust & Competition Lawyers” and “500 X – The Next Generation” lists. Mr. Korn is from Jacksonville, Florida. He received an A.B. with honors from Princeton University in 2008, where he was a member of the Varsity Football Team. He received a J.D. magna cum laude from Harvard Law School in 2013, where he was an editor of the Law Review. After graduation, he served as a law clerk to Hon. Stanley Marcus of the U.S. Court of Appeals for the Eleventh Circuit."
