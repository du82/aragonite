["https://www.cravath.com/diversity-and-inclusion/recruiting-student-outreach.html"]
title = "Recruiting & Student Outreach | Cravath, Swaine & Moore LLP"
description = """
Recruiting & Student Outreach
At Cravath, we aim to hire and retain law students who will grow to become exceptional lawyers, which means accessing the widest possible talent pool. We achieve this by recruiting outstanding law students who have a wide variety of lived experiences. 
We are committed to cultivating an inclusive environment where all our attorneys can thrive. To ensure that our…"""
full_description = "At Cravath, we aim to hire and retain law students who will grow to become exceptional lawyers, which means accessing the widest possible talent pool. We achieve this by recruiting outstanding law students who have a wide variety of lived experiences. We are committed to cultivating an inclusive environment where all our attorneys can thrive. To ensure that our lawyers receive the most rewarding professional experience possible, we provide unparalleled legal training, along with mentors and role models to offer support and encouragement. We want students to be able to see themselves here, as practicing attorneys who have fulfilling careers. The key to this is providing opportunities for our attorneys and students to get to know each other. We are always seeking avenues to partner with student groups. As such, we sponsor and participate in diversity‑related events with many student organizations, including Asian Pacific American Law Students Associations, Black Law Students Associations, First Generation Professionals, Jewish Law Sudents Associations, Latino Law Students Associations, OutLaws, South Asian Law Students Associations, Veterans associations and women student groups. Cravath is a member of the Leadership Council on Legal Diversity (LCLD), which includes over 400 corporate chief legal officers and law firm managing partners dedicated to creating a more diverse legal profession. LCLD programs provide both practicing attorneys and law students from diverse backgrounds with leadership training, career‑development strategies, peer networking, mentorship and more. Each of our 1L summer associates has the opportunity to participate in the 1L LCLD Scholars Program, which includes networking opportunities and attending a professional development summit. At Cravath, we are committed to “pipeline” efforts that cultivate the next generation of great lawyers. To that end, the Firm has participated in the SEO Corporate Law Program for over 20 years. Each summer, we provide underrepresented pre-law students with internships, enabling them to experience firm life for eight weeks before starting law school. We also co-host a panel and reception for SEO fellows throughout New York City."
year_published = 2025
