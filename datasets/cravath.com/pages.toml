["https://www.cravath.com/news-insights/law360-names-cravath-a-2024-competition-practice-group-of-the-year.html"]
title = "Law360 Names Cravath a 2024 “Competition Practice Group of the Year” | Cravath, Swaine & Moore LLP"
description = "On February 20, 2025, Cravath was featured by Law360 as a “Competition Practice Group of the Year.” The profile highlighted the Firm’s representations across litigation and antitrust clearance, including a “trailblazing antitrust verdict” for Epic Games in its trial victory against Google and the Firm’s successful antitrust guidance of Cisco Systems in its $28 billion acquisition of Splunk and of…"
full_description = "On February 20, 2025, Cravath was featured by Law360 as a “Competition Practice Group of the Year.” The profile highlighted the Firm’s representations across litigation and antitrust clearance, including a “trailblazing antitrust verdict” for Epic Games in its trial victory against Google and the Firm’s successful antitrust guidance of Cisco Systems in its $28 billion acquisition of Splunk and of Aon PLC in its $13 billion acquisition of NFP. The profile also recognized Cravath’s successful defense of Robinhood Markets Inc. in antitrust claims before the Eleventh Circuit and victories for Meta in putative class action and individual antitrust litigation resulting in the dismissal of all claims. Speaking about the significance of Epic Games’ win against Google, which the profile noted as a “standout achievement,” Cravath partner and Co‑Head of the Litigation Department Gary A. Bornstein described the victory as “the first big trial verdict against a big tech company in an antitrust case in a really long time,” and one that compelled Google to make “material changes to its app store and the way that it contracts with developers.” Gary also noted the “global dimension” of the victory, which has generated scrutiny in other jurisdictions concerning the structure of Google’s app store. The profile also recognized the Firm’s success in navigating the “intricacies of antitrust clearance,” including securing “antitrust approvals from a dozen antitrust authorities, including in the United States and European Union.” Cravath partner Margaret T. Segall discussed best practices in navigating the antitrust process, highlighting the importance of maintaining “a clear and straightforward dialogue” with agencies and “ensuring that you’re really listening closely to any questions you get, so you can be as responsive as possible.” On December 11, 2023, a jury unanimously ruled in favor of Cravath client Epic Games (“Epic”) on all counts in its closely watched antitrust case against Google in the U.S. District Court for the Northern District of California, determining—after a multiweek trial—that Google has engaged in anticompetitive behavior in the distribution of mobile apps and in the handling of in‑app payments."
year_published = 2025
year_updated = 2025
