["https://www.cravath.com/careers/legal-hiring/index.html"]
title = "Legal Hiring | Cravath, Swaine & Moore LLP"
description = "Cravath has been known as one of the premier U.S. law firms for two centuries. Each of our practice areas is highly regarded, and our lawyers are recognized around the world for their commitment to the representation of our clients’ interests. Throughout our history, we have played a central role in developing how law is practiced, how lawyers are trained and how business risk is managed. We are not, and do not strive to be, the largest law firm measured by number of offices or lawyers. Our goal is to be the firm of choice for clients with respect to their most challenging legal issues, most significant business transactions and most critical disputes."
full_description = "There is no Cravath “type.” Our lawyers represent a wide range of backgrounds and interests. Yet, all share important qualities—intelligence, creativity, energy, dedication and a commitment to excellence. All Cravath lawyers embrace challenge and practice law with the commitment that has built and sustained our singular reputation for more than two centuries. Each recruiting season, we aim to hire a summer class comprised of exceptional second‑year law students from schools across the United States and Canada. We also welcome applications from outstanding third‑year law students interested in joining us as incoming associates following graduation. We make every effort to ensure that your life at Cravath is rewarding. Our Firm’s unique position in the legal profession is built on our distinctive system of developing outstanding law students into outstanding lawyers. Cravath is an exceptional place to begin and build your career. Our distinguished lawyers and clients—along with our unique training system and collaborative environment—provide an unparalleled opportunity for professional and personal development. Quality is the hallmark of our practice. Each of our departments is recognized as among the finest in the world. Challenging pro bono work has long been a cornerstone of our practice. It is a fundamental part of who we are and it is critically important to those whom we help. Celebrating 200 years of partnership. In 2019, we celebrated our bicentennial. Our history mirrors that of our nation. Integral to our story is our culture."
