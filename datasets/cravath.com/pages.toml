["https://www.cravath.com/news-insights/tim-cameron-authors-us-chapter-of-lexology-indepths-dispute-resolution-edition-17.html"]
title = "Tim Cameron Authors U.S. Chapter of Lexology In‑Depth’s “Dispute Resolution - Edition 17” | Cravath, Swaine & Moore LLP"
description = "Cravath partner Timothy G. Cameron and associate Michael Cheng authored the United States chapter of Lexology In‑Depth’s “Dispute Resolution - Edition 17,” which was published on January 24, 2025. The chapter provides an in‑depth overview of the U.S. federal and state court systems, covering how district, bankruptcy and other special trial courts are organized, as well as the procedural rules…"
full_description = "Cravath partner Timothy G. Cameron and associate Michael Cheng authored the United States chapter of Lexology In‑Depth’s “Dispute Resolution - Edition 17,” which was published on January 24, 2025. The chapter provides an in‑depth overview of the U.S. federal and state court systems, covering how district, bankruptcy and other special trial courts are organized, as well as the procedural rules applicable in federal courts. The chapter also reviews several notable U.S. Supreme Court decisions from 2024. On October 7, 2024, the U.S. District Court for the Northern District of California entered a post‑trial order in favor of Cravath client Epic Games imposing a nationwide three‑year permanent injunction against Google. The injunction, which follows Epic’s jury trial win against Google last year, prohibits Google from paying competitors not to compete and requires Google to distribute alternative app stores on the Google Play Store and provide alternative app stores with access to the Google Play Store’s catalog of apps. On December 11, 2023, a jury unanimously ruled in favor of Cravath client Epic Games (“Epic”) on all counts in its closely watched antitrust case against Google in the U.S. District Court for the Northern District of California, determining—after a multiweek trial—that Google has engaged in anticompetitive behavior in the distribution of mobile apps and in the handling of in‑app payments. Cravath represented Amgen, one of the world’s largest biopharmaceutical companies, in successfully defending against a Federal Trade Commission (“FTC”) challenge to Amgen’s pending $27.8 billion acquisition of Horizon Therapeutics (“Horizon”)—securing a consent order on September 1, 2023 that The Wall Street Journal described as “a rare instance” of the FTC “throwing in the towel on litigation.” On July 13, 2023, a three judge panel for the U.S. Court of Appeals for the Third Circuit ruled in favor of Cravath clients Louis Dreyfus Company LLC (“LDC”) and Imperial Sugar Company (“Imperial Sugar”) and unanimously affirmed an earlier decision by the U.S. District Court for the District of Delaware denying U.S. Department of Justice’s (“DOJ”) request for an injunction to block LDC’s sale of the assets and business of Imperial Sugar to U.S. Sugar."
year_published = 2025
year_updated = 2025
