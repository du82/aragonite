title = "Corporate | Cravath, Swaine & Moore LLP"
description = "Cravath has been known as one of the premier U.S. law firms for two centuries. Each of our practice areas is highly regarded, and our lawyers are recognized around the world for their commitment to the representation of our clients’ interests. Throughout our history, we have played a central role in developing how law is practiced, how lawyers are trained and how business risk is managed. We are not, and do not strive to be, the largest law firm measured by number of offices or lawyers. Our goal is to be the firm of choice for clients with respect to their most challenging legal issues, most significant business transactions and most critical disputes."
full_description = "From the construction of the American railroads in the nineteenth century to the launch of global media companies in the twenty‑first, Cravath has been at the center of many of the world’s most important transactions. The hallmark of our corporate practice is our ability to bring together all of the Firm’s disciplines in an integrated and collaborative approach. Cravath’s distinctive and rigorous system of training enables our lawyers to develop experience in a diverse range of areas, including mergers and acquisitions, capital markets, banking and credit, regulatory matters, corporate governance and board advisory, intellectual property and financial restructuring and reorganization. Our generalist training and internal cohesion allow us to draw upon a unique depth of corporate expertise in a highly efficient and effective way, delivering exceptional value to our clients. Our counsel extends to helping companies, boards and executives navigate the opportunities and challenges presented by emerging technologies and trends in a global economy. This includes data security and privacy, Committee on Foreign Investment in the United States (CFIUS) concerns, environmental, social and governance (“ESG”) considerations and other stakeholder engagement. Our Corporate Department is a seven‑time winner of the Chambers USA Award for Excellence. Cravath has been recognized as a Law Firm of the Year by Law360 and the “Most Innovative Law Firm for Legal Expertise” by the Financial Times in its North America Innovative Lawyers report, which noted that the Firm “stood out for its persistence and ability to help define industries.” We have earned repeated praise from clients and the market: Cravath’s distinctive and rigorous system of training enables our lawyers to develop experience in a diverse range of areas, including mergers and acquisitions, capital markets, banking and credit, regulatory matters, corporate governance and board advisory, intellectual property and financial restructuring and reorganization. Our generalist training and internal cohesion allow us to draw upon a unique depth of corporate expertise in a highly efficient and effective way, delivering exceptional value to our clients."
