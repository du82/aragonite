["https://www.cravath.com/diversity-and-inclusion/index.html"]
title = "Diversity & Inclusion | Cravath, Swaine & Moore LLP"
description = "At Cravath, we focus on delivering excellent legal services to our clients. We are a talent‑driven organization and we invest in our people through training and opportunities to develop. We aim to recruit the most promising individuals and foster a supportive and inclusive environment where they can bring their unique backgrounds and experiences to our Firm, feel a sense of belonging and grow to…"
full_description = "At Cravath, we focus on delivering excellent legal services to our clients. We are a talent‑driven organization and we invest in our people through training and opportunities to develop. We aim to recruit the most promising individuals and foster a supportive and inclusive environment where they can bring their unique backgrounds and experiences to our Firm, feel a sense of belonging and grow to realize their full potential as professionals. Our Firm’s diversity and inclusion efforts are spearheaded by our Diversity Committee, with the support and involvement of our full partnership. Our efforts encompass all employees across the Firm, and we hold inclusion among our core values, enhancing our culture of excellence, collegiality and respect. Our Diversity Committee develops and implements practices to promote diversity and inclusion across the Firm, regularly analyzing and tracking our progress. At Cravath, we aim to hire and retain law students who will grow to become exceptional lawyers, which means accessing the widest possible talent pool. We achieve this by recruiting outstanding law students from a wide variety of backgrounds. At Cravath, our most important long-term goal is the professional development of our lawyers, and we take a holistic approach to this objective—one that recognizes the importance of training, relationship-building, mentoring and balancing career and personal obligations and interests. In 1971, Cravath became one of the first “Wall Street” law firms to elect a woman partner. Since that time, we have remained committed to ensuring that women are represented and supported at all levels of the Firm. Currently, our Presiding Partner, Managing Partner of our Litigation Department, Head of our Tax Department and Managing Partner of our Washington, D.C. office are all women. We recognize that balancing the demands of professional and personal life can be challenging at times, and we want our lawyers to enjoy satisfaction in both arenas. That is why we offer a solid support system and extensive work/life benefits. The Firm is also engaged in an ongoing conversation about the practices that will best help our lawyers experience fulfillment in both their careers and their personal lives."
year_published = 2025
