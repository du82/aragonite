["https://www.cravath.com/diversity-and-inclusion/affinity-groups.html"]
title = "Affinity Groups | Cravath, Swaine & Moore LLP"
description = """
Affinity Groups
At Cravath, our most important long-term goal is the professional development of our lawyers, and we take a holistic approach to this objective—one that recognizes the importance of training, relationship-building, mentoring and balancing career and personal obligations and interests.
Our lawyers come from a wide variety of lived experiences, but they all share important…"""
full_description = "At Cravath, our most important long-term goal is the professional development of our lawyers, and we take a holistic approach to this objective—one that recognizes the importance of training, relationship-building, mentoring and balancing career and personal obligations and interests. Our lawyers come from a wide variety of lived experiences, but they all share important qualities—intelligence, creativity, a strong work ethic and a desire to excel. In order to reach their full potential, our lawyers must feel comfortable bringing their authentic selves to work, so we devote substantial time, energy and resources to enhance the experiences of our attorneys. Through our internal affinity groups, our associates have the opportunity to build and strengthen professional relationships, enhance their sense of community, receive informal mentoring and advice and discuss matters of importance to the group. Our affinity groups have attorneys of varying seniority, enabling junior and mid-level lawyers to gain valuable work-related insight from their more senior colleagues. The groups also provide a forum through which associates can make suggestions and raise concerns to the partners. To facilitate this dialogue, each group has at least two partner liaisons, who actively seek input from members on topics for future programming, Firm sponsorships of professional organizations and events, and general feedback about their experiences at Cravath. The partner liaisons also identify resources within and outside of the Firm that might benefit affinity group members. Our affinity groups include: Partner Liaisons: Heather Benjamin (Trusts and Estates), Helam Gebremariam (Litigation) and Andy Pitts (Corporate) Partner Liaisons: Tim Cameron (Litigation), Alyssa Caples (Corporate), Ting Chen (Corporate), Sharon Goswami (Litigation) and Minh Van Ngo (Corporate) Partner Liaisons: Richard Hall (Corporate), Damaris Hernández (Litigation), Sasha Rosenthal‑Larrea (Corporate) and Adam Sanchez (Corporate)"
