["https://www.cravath.com/practices/practices/corporate/capital-markets.html"]
title = "Capital Markets | Cravath, Swaine & Moore LLP"
description = "Cravath has been known as one of the premier U.S. law firms for two centuries. Each of our practice areas is highly regarded, and our lawyers are recognized around the world for their commitment to the representation of our clients’ interests. Throughout our history, we have played a central role in developing how law is practiced, how lawyers are trained and how business risk is managed. We are not, and do not strive to be, the largest law firm measured by number of offices or lawyers. Our goal is to be the firm of choice for clients with respect to their most challenging legal issues, most significant business transactions and most critical disputes."
full_description = "Cravath has one of the most respected capital markets practices in the world. We hold a distinctive reputation for devising and executing the innovative, sophisticated deal structures underlying landmark financing transactions, including the first simultaneous cross‑border tender offer, direct listings, high‑profile IPOs and acquisition financings for many of the largest U.S. and cross‑border transactions. Our practice is balanced between representing issuers and underwriters on debt, equity and hybrid offerings, both domestically and internationally. Cravath’s substantial presence in London, where we have one of the largest contingents of U.S. lawyers in the city, enhances our ability to provide seamless, round‑the‑clock coverage. We execute complex, cross-border deals issued in multiple currencies, as well as IPOs and other high‑profile transactions for companies ranging from emerging startups to leading multinational corporations in the United States and abroad. Our lawyers have led offerings in a broad range of industries and we also regularly advise on SEC‑registered and Rule 144A offerings by sovereign and supranational entities. Our U.S. and foreign private issuer clients rely on Cravath’s expertise to resolve their most challenging issues before the SEC, including on difficult accounting or other disclosure matters, as well as potential reporting and compliance issues. Cravath lawyers maintain strong relationships with members of the SEC staff and our representation includes alerting our clients to newly enacted U.S. securities laws and SEC and exchange rules and regulations, as well as advising them with respect to compliance with these requirements. We also counsel clients on how U.S. securities laws and regulations interact with evolving areas such as crypto and data privacy. Our lawyers’ ability to execute all offering types, our client-targeted expertise and our commercial understanding of business situations are highly recommended by clients and peers:"
