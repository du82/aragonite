["https://www.cravath.com/news-insights/aptiv-plcs-dollar31-billion-of-credit-facilities.html"]
title = "Aptiv PLC’s $3.1 Billion of Credit Facilities | Cravath, Swaine & Moore LLP"
description = "Cravath represented the administrative agent, joint lead arrangers and joint bookrunners in connection with $3.1 billion of credit facilities made available to Aptiv PLC and certain of its subsidiaries. Aptiv PLC is a leading global technology and mobility architecture company primarily serving the automotive sector. The facilities consisted of a $2.5 billion bridge credit facility, used to…"
full_description = "Cravath represented the administrative agent, joint lead arrangers and joint bookrunners in connection with $3.1 billion of credit facilities made available to Aptiv PLC and certain of its subsidiaries. Aptiv PLC is a leading global technology and mobility architecture company primarily serving the automotive sector. The facilities consisted of a $2.5 billion bridge credit facility, used to partially finance the accelerated share repurchase of up to $3.0 billion of Aptiv PLC’s ordinary shares, and a $600 million term loan facility. The transactions closed on August 1, 2024, and August 19, 2024. The Cravath team included partner Tatiana Lapushchik, of counsel Kimberly A. Grousset and associates Diane K. Mokoro, Nastassia Shcherbatsevich Li and Hannah Gehringer on banking matters; partners Andrew J. Pitts and C. Daniel Haaren and associates Sarah R. Brathwaite and Courtney T. Seager on capital markets matters; and partner Andrew T. Davis and associates Josh Banafsheha and Megan Samayoa on tax matters. Cravath represented iBanFirst, a portfolio company of Marlin Equity Partners, in connection with the amendment and restatement of its senior facilities agreement to implement a new term loan facility. Marlin Equity Partners is a leading global investment firm. The transaction closed on December 19, 2024. Cravath represented Morgan Stanley, as administrative agent, joint lead arranger, joint bookrunner and collateral agent, in connection with a $500 million revolving credit facility made available to DraftKings Inc. and certain of its subsidiaries. DraftKings Inc. operate as a digital sports entertainment and gaming company in the United States and internationally. The transaction closed on November 7, 2024. Cravath represented the lead bookrunner in connection with a $700 million revolving credit facility made available to Reynolds Consumer Products Inc. Reynolds Consumer Products Inc. produces and sells products in cooking, waste and storage, and tableware product categories in the United States and internationally. The transaction closed on October 17, 2024."
