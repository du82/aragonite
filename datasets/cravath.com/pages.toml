["https://www.cravath.com/practices/practices/corporate/private-equity.html"]
title = "Private Equity | Cravath, Swaine & Moore LLP"
description = "Cravath has been known as one of the premier U.S. law firms for two centuries. Each of our practice areas is highly regarded, and our lawyers are recognized around the world for their commitment to the representation of our clients’ interests. Throughout our history, we have played a central role in developing how law is practiced, how lawyers are trained and how business risk is managed. We are not, and do not strive to be, the largest law firm measured by number of offices or lawyers. Our goal is to be the firm of choice for clients with respect to their most challenging legal issues, most significant business transactions and most critical disputes."
full_description = "Cravath’s global private equity practice advises private equity firms and their portfolio companies on all aspects of private equity investing. Our private equity clients encompass traditional leveraged buyout funds, real estate, credit and hedge funds, as well as new and non‑traditional participants in the private equity space, including pension plans, family offices, insurance companies and sovereign wealth funds. We also advise on transactions involving special purpose acquisition companies (SPACs) and private investments in public equity (PIPEs). Cravath’s culture of training and developing our lawyers across our core corporate practice areas produces uniquely skilled practitioners who approach private equity transactions holistically and with a depth of knowledge across all aspects of private equity investing. We combine the knowledge and experience of our mergers and acquisitions partners, together with the exceptional expertise of our finance and investment management and funds partners, to provide a significant advantage to our private equity clients, whose transactions often traverse several of these areas. Our renowned mergers and acquisitions practice advises on a broad array of U.S., cross‑border and international transactions, ranging from strategic and minority equity investments to large precedent‑setting combinations. Our mergers and acquisitions representations often involve private equity firms, independently or as part of a consortium, which enables us to provide unique insight into the perspective of a corporate target. Our market‑leading finance practice devises efficient and business‑oriented financing structures to meet clients’ most important capital‑raising needs. While not every matter requires complex, multicurrency, multijurisdictional financings, our private equity clients benefit from our lawyers’ deep expertise with the latest market trends and innovative financing techniques. Cravath has also been at the forefront of legal innovation in the private equity sphere. The Firm successfully pioneered the process of creating publicly listed funds for the established U.S. private equity community. Clients further benefit from the Firm’s unparalleled expertise in antitrust, intellectual property, tax and regulatory enforcement and compliance matters."
year_published = 2025
