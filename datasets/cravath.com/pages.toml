["https://www.cravath.com/practices/practices/corporate/financial-institutions-group.html"]
title = "Financial Institutions Group (FIG) | Cravath, Swaine & Moore LLP"
description = "Cravath has been known as one of the premier U.S. law firms for two centuries. Each of our practice areas is highly regarded, and our lawyers are recognized around the world for their commitment to the representation of our clients’ interests. Throughout our history, we have played a central role in developing how law is practiced, how lawyers are trained and how business risk is managed. We are not, and do not strive to be, the largest law firm measured by number of offices or lawyers. Our goal is to be the firm of choice for clients with respect to their most challenging legal issues, most significant business transactions and most critical disputes."
full_description = "Cravath represents leading financial institutions in connection with domestic and cross‑border transactional, regulatory, supervisory, enforcement and governance matters. Our lawyers also advise fintech companies and non‑bank firms in evaluating charter options, bank partnerships and acquisitions of banks. Cravath is uniquely positioned among leading U.S. firms by our deep bench of regulatory attorneys and legal knowledge at the intersection of law and policy. The strength of this practice is grounded in our attorneys’ collective regulatory and legislative expertise, comprehensive knowledge of the financial services and fintech sectors and solutions‑oriented practical judgment. Our integrated Financial Institutions Group (FIG) Practice draws upon the experience of our seasoned attorneys, many of whom were formerly with government organizations, regulatory agencies and legislative bodies, including the Board of Governors of the Federal Reserve System, the Federal Deposit Insurance Corporation, the U.S. Securities and Exchange Commission, the U.S. Department of the Treasury, the U.S. Department of Justice, the U.S. Senate Committee on Banking, Housing, and Urban Affairs, and various U.S. Attorneys’ Offices. These varied regulatory, enforcement and policymaking experiences have allowed our attorneys to understand not only legal issues at hand but why the law was written the way it was written and what policy objectives the law intended to accomplish. We are able to leverage this knowledge as we negotiate complex regulatory and enforcements matters with governmental agencies on behalf of clients. Our clients, which include many of the world’s leading financial institutions, fintechs and other financial services providers, rely on our lawyers’ strategic advice to navigate the changing regulatory environment and the increasingly complex challenges it presents. Cravath’s position at the forefront of regulatory developments enables us to provide invaluable insight when advising our financial services clients across a broad array of issues, including:"
