title = "News & Insights | Cravath, Swaine & Moore LLP"
description = "Cravath has been known as one of the premier U.S. law firms for two centuries. Each of our practice areas is highly regarded, and our lawyers are recognized around the world for their commitment to the representation of our clients’ interests. Throughout our history, we have played a central role in developing how law is practiced, how lawyers are trained and how business risk is managed. We are not, and do not strive to be, the largest law firm measured by number of offices or lawyers. Our goal is to be the firm of choice for clients with respect to their most challenging legal issues, most significant business transactions and most critical disputes."
full_description = "On February 26, 2025, Cravath and Harvard Law School hosted a program to celebrate the work of the Cravath International Fellows, which was held in Cambridge, Massachusetts. Established in 2006 by Cravath partners who are Harvard Law School alumni, under the leadership of the late Robert D. Joffe, the Cravath International Fellowships program provides financial assistance, including travel and living expenses, to students pursuing academic projects during their Winter Term with an international, transnational or comparative law focus. Approximately 12 Cravath International Fellowships are awarded annually. Cravath represented the initial purchasers in connection with the €325 million 144A/Reg. S high‑yield senior secured notes offering of Flora Food Management B.V. (f/k/a Upfield B.V.). Flora Food Management B.V. operates as a plant‑based consumer product company. The transaction closed on February 3, 2025. Cravath represented the underwriter in connection with the $499 million registered secondary offering of class A common stock of Hess Midstream LP, a fee‑based, growth‑oriented, limited partnership formed by Hess Midstream GP LP and Hess Infrastructure Partners GP LLC to own, operate, develop and acquire a diverse set of midstream assets and provide fee‑based services to Hess Corporation and third‑party customers. The shares were listed on the New York Stock Exchange. The transaction closed on February 12, 2025. Cravath represented the underwriters in connection with the $2 billion registered notes offering of Union Pacific Corporation, owner of one of America's leading transportation companies. The transaction closed on February 13, 2025. Cravath represented the European Investment Bank (“EIB”) in connection with its $3 billion SEC registered notes offering. The purpose of the EIB is to contribute to the balanced and steady development of the internal market among Member States of the European Union. The notes were listed on the Luxembourg Stock Exchange. The transaction closed on February 12, 2025."
