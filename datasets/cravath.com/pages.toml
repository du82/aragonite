["https://www.cravath.com/our-story/index.html"]
title = "Our Story | Cravath, Swaine & Moore LLP"
description = """
Our story began on the 22nd day of March in 1819, when Richard Blatchford established a law office at 140 Water Street in New York City. Four years later, his lifelong colleague and friend, William Seward, began a partnership with Elijah Miller in Auburn. In 1854, the New York and Auburn offices formally combined.
These two great families of lawyers, the Blatchfords and the Sewards, were the…"""
full_description = "Our story began on the 22nd day of March in 1819, when Richard Blatchford established a law office at 140 Water Street in New York City. Four years later, his lifelong colleague and friend, William Seward, began a partnership with Elijah Miller in Auburn. In 1854, the New York and Auburn offices formally combined. These two great families of lawyers, the Blatchfords and the Sewards, were the foundation of our Firm. During the Civil War, Richard Blatchford and William Seward each served President Lincoln. Samuel Blatchford, our second Presiding Partner, would go on to become a Justice of the United States Supreme Court. Our model, developed by Paul Cravath, became the blueprint for the modern American law firm and many other professional services firms powered by human capital. The Cravath family legacy extended from the founding of Fisk University during the era of Reconstruction to the formation of the Council on Foreign Relations to seek a more peaceful world through the promotion of diplomacy and alliances among nations. As we embark on our third century, our partnership continues to derive strength from timeless and enduring values: a passion for lawyering as a noble calling, a commitment to pursuing excellence and a belief in the power of collaboration. Throughout Cravath’s history, we have served our clients by delivering consistently high-quality services. Cravath attorneys have a long and distinguished history of service to the governments of the United States, the State of New York and the City of New York. Whether through reading programs or food drives, Cravath staff members and lawyers have the opportunity to volunteer their time and make a difference in someone’s life. Our lawyers in our New York, London and Washington, D.C. offices are committed to an international practice of the highest quality. Celebrating 200 years of partnership. In 2019, we celebrated our bicentennial. Our history mirrors that of our nation. Integral to our story is our culture."
year_published = 2025
