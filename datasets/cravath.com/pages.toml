["https://www.cravath.com/news-insights/outbrains-financing-of-its-dollar1-billion-acquisition-of-teads.html"]
title = "Outbrain’s Financing of its $1 Billion Acquisition of Teads | Cravath, Swaine & Moore LLP"
description = "On August 1, 2024, Outbrain, a technology platform that drives business outcomes through engagement, announced it has entered into a definitive agreement to acquire Teads, the global omnichannel video platform, from Altice. Total estimated consideration for the Teads acquisition is approximately $1 billion, on a cash free, debt free basis, including an upfront payment of $725 million, subject to…"
full_description = "On August 1, 2024, Outbrain, a technology platform that drives business outcomes through engagement, announced it has entered into a definitive agreement to acquire Teads, the global omnichannel video platform, from Altice. Total estimated consideration for the Teads acquisition is approximately $1 billion, on a cash free, debt free basis, including an upfront payment of $725 million, subject to standard adjustments, and a deferred cash payment of $25 million. Outbrain intends to finance the transaction with existing cash resources and $750 million in committed debt financing, subject to customary funding conditions. Outbrain will also issue to Altice 35 million shares of common stock, valued at approximately $169 million based on a one‑month volume‑weighted average price of Outbrain’s common stock as of July 30, 2024, of $4.82, and $105 million in convertible preferred equity. Additionally, Outbrain obtained commitments for a $100 million revolving credit facility, a portion of which will be available to pay a portion of the cash consideration for the transaction and related fees and expenses, and which will otherwise be available for working capital and general corporate purposes. Cravath is representing Outbrain in connection with the financing of the transaction. The Cravath team is led by partners Nicholas A. Dorsey and Joseph D. Zavaglia and includes associates Fay E. Faught and Ori Oren on financing matters; and partner Arvind Ravichandran and associate William Swisher on tax matters. On July 22, 2024, Terex Corporation, a global manufacturer of materials processing machinery and aerial work platforms, announced it has signed a definitive agreement to acquire Dover Corporation’s Environmental Solutions Group, in a $2.0 billion all‑cash transaction. Cravath is representing the lead arranger and bookrunner of committed debt financing in connection with the transaction. On July 9, 2024, Altus Group Limited (“Altus Group”), a leading provider of asset and fund intelligence for commercial real estate, announced that it has signed a definitive agreement to sell its global Property Tax business to Ryan, LLC (“Ryan”), a leading global tax services and software provider, for total cash consideration of C$700 million. In addition to the definitive agreement, Ryan has also committed to enter a C$15 million Altus Market Insights subscription agreement at the close of the transaction, with an initial three‑year term of C$5 million per year. Cravath is representing Altus Group as U.S. counsel in connection with the transaction."
