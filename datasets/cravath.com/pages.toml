["https://www.cravath.com/people/michael-p-addis.html"]
title = "Michael P. Addis | Cravath, Swaine & Moore LLP"
description = "Michael P. Addis primarily focuses his practice on complex civil litigation related to general commercial, contractual, securities, shareholder derivative, antitrust and mergers and acquisitions disputes. He also devotes a significant portion of his practice to pro bono service and was selected as a United States Presidential Leadership Scholar."
full_description = "Michael P. Addis primarily focuses his practice on complex civil litigation related to general commercial, contractual, securities, shareholder derivative, antitrust and mergers and acquisitions disputes. He also devotes a significant portion of his practice to pro bono service and was selected as a United States Presidential Leadership Scholar. Mr. Addis has represented a wide range of clients, including 260 Twelfth Avenue Holdings LLC, Allied World Assurance Company, Biogen, Colgate‑Palmolive, Costamare, JPMorgan Chase, Mylan, Novartis, Qualcomm, Root, Spirit AeroSystems, The Walt Disney Company and The Williams Companies. Represented Qualcomm Incorporated in numerous high‑stakes disputes and investigations around the world relating to the company’s patent licensing and modem chipset businesses, including: Mr. Addis is a fellow of the American Bar Foundation. He has been repeatedly included on Benchmark Litigation’s “40 & Under List,” which recognizes the “best and brightest litigators across the U.S. and Canada,” and has been named a “Future Star” by the publication. The Legal 500 US has also recommended him for his work in general commercial and financial services litigation. He has additionally been included in Lawdragon’s “500 Leading Litigators in America,” “500 Leading Global Antitrust & Competition Lawyers” and “500 X – The Next Generation” lists. Mr. Addis is a member of the Board of Directors of the Jericho Project, a nonprofit based in New York City that works to end homelessness. Mr. Addis was born in Kansas City, Missouri. He received an A.B. magna cum laude in English from Princeton University in 2005, where he received the English Department’s Senior Comprehensive Examination Prize. In 2007, while teaching for Teach for America in New York City, he received an M.S.T. in Teaching Secondary English from Pace University. Mr. Addis received a J.D. from Harvard Law School in 2010, where he was the Assistant Managing Editor and a Senior Editor of the International Law Journal, the Captain of the Jessup International Moot Court Team, the teacher of a self‑advocacy seminar for juvenile offenders and a Harvard Teach for America Scholar. Following graduation, Mr. Addis practiced pro bono indigent criminal defense and civil rights law in Jackson, Mississippi and was an Adjunct Professor at the Mississippi College School of Law."
