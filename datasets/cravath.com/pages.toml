["https://www.cravath.com/alumni-journal/articles/tina-perry-on-finding-her-path-from-big-law-to-the-business-of-entertainment.html"]
title = "Tina Perry on Finding Her Path from Big Law to the Business of Entertainment | Cravath, Swaine & Moore LLP"
description = """
If Tina Perry had to give advice to her younger self, she would tell her not to sweat the small stuff; that life is malleable, and very rarely is a single choice set in stone. 
“I knew I wanted to work in entertainment, but my route wasn’t direct,” she says. “I always felt like I was behind because I didn’t start out in Los Angeles and didn’t have the typical career or background.
“But my journey…"""
full_description = "As a teenager in Oklahoma City, Tina Perry spent weekends at the movie theater enthralled by stories on the silver screen before focusing on the business of entertainment in law school. After graduation and several years as an associate in Cravath’s Corporate Department, she leveraged her experience to forge a career path that would lead to her current role as President of OWN: Oprah Winfrey Network and OTT Streaming. If Tina Perry had to give advice to her younger self, she would tell her not to sweat the small stuff; that life is malleable, and very rarely is a single choice set in stone. “I knew I wanted to work in entertainment, but my route wasn’t direct,” she says. “I always felt like I was behind because I didn’t start out in Los Angeles and didn’t have the typical career or background. “But my journey was the right one for me,” she adds. “I learned and grew every step of the way, keeping my North Star ahead of me.” Her path started in Oklahoma City, where Tina was born and raised. Her parents—her father owned Black barbershops and her mother was a public school teacher—helped foster a love of cinema, “dropping me off at the movie theater on the weekend when I would beg and ask.” She notes: “I’ve always been a person who loved entertainment and loved storytelling, but I didn’t really know about the industry.” It wasn’t until Tina started college that she started to learn more about the business side of entertainment. She received a bachelor’s degree in political science from Stanford University and considered whether to pursue an M.B.A. or a J.D., deciding on the latter after taking a year off and reading “voraciously” about the industry. “I realized what interested me was the opportunity to help people who had ideas and stories bring those to fruition—to be the enabler, the support network, and the business mind for them,” Tina recalls. “And when I looked around in music, film or television, people with law degrees and lawyers played a big role.” That discovery led her to law school, where everything “clicked.”"
year_published = 2025
