["https://www.cravath.com/careers/administrative-staff/index.html"]
title = "Administrative Staff | Cravath, Swaine & Moore LLP"
description = "It takes more than great lawyers to make a great law firm. It takes an administrative staff that shares our lawyers’ commitment to quality and excellence. Cravath’s dedicated staff helps sustain our preeminent position among the world’s law firms. Our collaborative environment and singular record of success combine to provide you with an unparalleled opportunity to develop both professionally and…"
full_description = "It takes more than great lawyers to make a great law firm. It takes an administrative staff that shares our lawyers’ commitment to quality and excellence. Cravath’s dedicated staff helps sustain our preeminent position among the world’s law firms. Our collaborative environment and singular record of success combine to provide you with an unparalleled opportunity to develop both professionally and personally. Life at Cravath is shaped by our staff’s dedication to quality and excellence in everything we do. Our people are guided by a set of staff principles that mirror our lawyers’ commitment to excellence. We offer more than administrative jobs. We offer careers. At Cravath, staff members are respected as full team members in every sense. Paralegals are essential to the work we do for our clients. With the solid foundation of training and support provided by our Paralegal Program, these professionals provide critical support to our legal teams. Paralegals at Cravath work directly with partners and associates, gain substantial practical experience and develop valuable organizational and professional skills. Celebrating 200 years of partnership. In 2019, we celebrated our bicentennial. Our history mirrors that of our nation. Integral to our story is our culture."
