title = "Homepage | Cravath, Swaine & Moore LLP"
description = "Cravath has been known as one of the premier U.S. law firms for two centuries. Each of our practice areas is highly regarded, and our lawyers are recognized around the world for their commitment to the representation of our clients’ interests. Throughout our history, we have played a central role in developing how law is practiced, how lawyers are trained and how business risk is managed. We are not, and do not strive to be, the largest law firm measured by number of offices or lawyers. Our goal is to be the firm of choice for clients with respect to their most challenging legal issues, most significant business transactions and most critical disputes."
full_description = "Cravath has been known as one of the premier U.S. law firms for more than two centuries. Each of our practice areas is highly regarded, and our lawyers are recognized around the world for their commitment to the representation of our clients’ interests. Throughout our history, we have played a central role in developing how law is practiced, how lawyers are trained and how business risk is managed. We are not, and do not strive to be, the largest law firm measured by number of offices or lawyers. Our goal is to be the firm of choice for clients with respect to their most challenging legal issues, most significant business transactions and most critical disputes. Quality is the hallmark of our practice. Each of our departments is recognized as among the finest in the world. There is no Cravath “type.” Our lawyers represent a wide range of backgrounds and interests. Yet, all share important qualities—intelligence, creativity, energy, dedication and a commitment to excellence. It takes more than great lawyers to make a great law firm. It takes an administrative staff that shares our lawyers’ commitment to quality and excellence. Celebrating 200 years of partnership. In 2019, we celebrated our bicentennial. Our history mirrors that of our nation. Integral to our story is our culture."
