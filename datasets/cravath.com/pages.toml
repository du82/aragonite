["https://www.cravath.com/people/jelena-mcwilliams.html"]
title = "Jelena McWilliams | Cravath, Swaine & Moore LLP"
description = "Jelena McWilliams is Managing Partner of the Washington, D.C. office and Head of the Financial Institutions Group (FIG) Practice. She is a former Chairman of the Federal Deposit Insurance Corporation (FDIC). Ms. McWilliams focuses her practice on advising public and private companies, financial institutions, fintechs, and early-stage and venture companies on regulatory and corporate matters, as…"
full_description = "Jelena McWilliams is Managing Partner of the Washington, D.C. office and Head of the Financial Institutions Group (FIG) Practice. She is a former Chairman of the Federal Deposit Insurance Corporation (FDIC). Ms. McWilliams focuses her practice on advising public and private companies, financial institutions, fintechs, and early-stage and venture companies on regulatory and corporate matters, as well as on mergers and acquisitions, IPO and other capital markets transactions. While at the FDIC, Ms. McWilliams managed over 6,000 employees supervising approximately 5,000 banks, including through the COVID-19 pandemic. She participated in interagency negotiations, policy developments and joint agency rulemakings both as agency principal and as a voting member of the Financial Stability Oversight Council (FSOC). Ms. McWilliams chaired the Resolution Group at the Financial Stability Board (FSB); chaired and served on the Federal Financial Institutions Examination Council (FFIEC); and served on the Financial and Banking Information Infrastructure Committee (FBIIC). She testified before U.S. Congress on numerous occasions and engaged extensively with U.S. and international regulators, including the Basel Committee on Banking Supervision and the International Association of Deposit Insurers. She established the agency’s first office of innovation to implement technological advancements through supervisory channels and collaborative partnerships between banks and fintechs. Ms. McWilliams also spearheaded the agency’s effort to develop prudential banking policy on digital assets, including through a “crypto sprint” with the Office of the Currency Comptroller (OCC) and the Federal Reserve Board (FRB), and in collaboration with the President’s Working Group multiagency effort on stablecoins. She envisioned and created Mission Driven Bank Fund, a novel private/public partnership investment fund to support investments in low- and moderate-income communities served by the Minority Depository Institutions and Community Development Financial Institutions."
