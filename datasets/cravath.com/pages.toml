["https://www.cravath.com/diversity-and-inclusion/work-life-programming.html"]
title = "Work/Life Programming | Cravath, Swaine & Moore LLP"
description = """
Work/Life Programming
We recognize that integrating the demands of professional and personal life can be challenging at times, and we want our lawyers to enjoy fulfillment in both arenas. That is why we offer a solid support system and extensive work/life benefits. The Firm is also engaged in an ongoing conversation about the practices that will best allow our lawyers to fully engage in both their…"""
full_description = "We recognize that integrating the demands of professional and personal life can be challenging at times, and we want our lawyers to enjoy fulfillment in both arenas. That is why we offer a solid support system and extensive work/life benefits. The Firm is also engaged in an ongoing conversation about the practices that will best allow our lawyers to fully engage in both their careers and their personal lives. All our lawyers—regardless of circumstances—have obligations and interests outside of work. We want everyone at the Firm to have a fulfilling personal life and maintain their health, family ties, friendships and overall well-being. To that end, we offer our employees support throughout their life stages, whether they are buying a home, caring for a pet or participating in a community-service project. To assist our attorneys as they pursue financial goals, such as buying a home, Cravath has entered banking partnerships that offer support and discounts. The Chase Manhattan Preferred Mortgage Program is an exclusive program designed to save employees time and money when purchasing a home or refinancing the mortgage on their current residences. The innovative program offers personalized service, a wide array of products and money-saving discounts not available to the general public. In addition to encouraging our lawyers’ personal interests, Cravath offers many opportunities to participate in community service activities through the Firm, including the annual March of Dimes of Walk, the reading-mentorship program Read Ahead and The Fresh Air Fund’s “Counselor For a Day” program. The Firm also works with students from The Brooklyn School for Law & Justice high school throughout the year on activities like mock trials and SAT preparation. In honor of Dr. Martin Luther King, Jr. Day, the Firm hosts a virtual service initiative with Food Bank For New York City, a nonprofit dedicated to ending food poverty in our five boroughs since 1983. As part of our continued focus on supporting our attorneys, we signed onto the American Bar Association’s Well‑Being Pledge. This pledge is a collaborative effort across legal employers that expressly reinforces our belief that our attorneys’ well‑being is of the utmost importance. From bringing in outside speakers who address well‑being from a variety of perspectives to incorporating a number of events that focus on physical fitness and self‑care, we want our attorneys to lead healthy and mindful lives. For example, we have brought in a speaker to present to the Firm on the topic of mindfulness; a psychology professor and expert in behavioral change, who shared insights and research regarding scientifically‑validated strategies for living a more satisfying life; and a lawyer and licensed and board‑certified alcohol and drug counselor who discussed the issue of substance use and mental health challenges in the legal profession and offered strategies for protecting personal well‑being during stressful times."
year_published = 2025
