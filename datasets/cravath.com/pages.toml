["https://www.cravath.com/people/richard-w-clary.html"]
title = "Richard W. Clary | Cravath, Swaine & Moore LLP"
description = "Richard W. Clary retired from Cravath’s Litigation Department in December 2020. His practice focused on securities defense; antitrust (plaintiff and defense sides); patent, trade secret and trademark litigation (plaintiff and defense sides); bankruptcy litigation (debtor and creditor sides); commercial litigation; fiduciary duty litigation; fraud, FCPA and bribery litigation; Anti‑Terrorism Act…"
full_description = "Richard W. Clary retired from Cravath’s Litigation Department in December 2020. His practice focused on securities defense; antitrust (plaintiff and defense sides); patent, trade secret and trademark litigation (plaintiff and defense sides); bankruptcy litigation (debtor and creditor sides); commercial litigation; fiduciary duty litigation; fraud, FCPA and bribery litigation; Anti‑Terrorism Act litigation; and civil rights and constitutional rights litigation. Mr. Clary had extensive federal and state court experience, including jury trials and bench trials, and argued numerous appeals. He also handled both international and domestic arbitrations and numerous pro bono cases. Mr. Clary was born in Tarboro, North Carolina. He received a B.A. magna cum laude from Amherst College in 1975, where he was elected to Phi Beta Kappa, and a J.D. magna cum laude from Harvard Law School in 1978, where he was Developments Officer of the Law Review and awarded the Sears Prize. Mr. Clary served as a law clerk to Hon. Walter R. Mansfield of the U.S. Court of Appeals for the Second Circuit and to Justice Thurgood Marshall of the U.S. Supreme Court. Mr. Clary joined Cravath in 1980 and was elected a partner in 1985. Mr. Clary served as the Firm’s Litigation Managing Partner from February 1997 to November 2005, and as Head of Litigation from November 2005 to September 2010. Mr. Clary was born in Tarboro, North Carolina. He received a B.A. magna cum laude from Amherst College in 1975, where he was elected to Phi Beta Kappa, and a J.D. magna cum laude from Harvard Law School in 1978, where he was Developments Officer of the Law Review and awarded the Sears Prize. Mr. Clary served as a law clerk to Hon. Walter R. Mansfield of the U.S. Court of Appeals for the Second Circuit and to Justice Thurgood Marshall of the U.S. Supreme Court. Mr. Clary joined Cravath in 1980 and was elected a partner in 1985. Mr. Clary served as the Firm’s Litigation Managing Partner from February 1997 to November 2005, and as Head of Litigation from November 2005 to September 2010."
