["https://www.cravath.com/diversity-and-inclusion/external-partnerships.html"]
title = "External Partnerships | Cravath, Swaine & Moore LLP"
description = """
Maintaining a diverse legal environment is important outside the Firm, not just inside it. The profession as a whole benefits from a multiplicity of views and backgrounds. Inclusivity in the legal profession is essential for all our clients, community members and attorneys.
We are proud to have robust relationships with many professional organizations dedicated to diversity and inclusion,…"""
full_description = "Maintaining a diverse legal environment is important outside the Firm, not just inside it. The profession as a whole benefits from a multiplicity of views and backgrounds. Inclusivity in the legal profession is essential for all our clients, community members and attorneys. We are proud to have robust relationships with many professional organizations dedicated to diversity and inclusion, including: The Firm is proud to be a member of the IILP, an organization that works to promote diversity and inclusion throughout the legal profession. The IILP undertakes research to assess progress made with respect to diversity and inclusion, as well as provides educational programming that brings together diversity and inclusion experts with practicing attorneys to discuss best practices. LFAA is a nonprofit working to help bring about systemic change and racial equity in the law. Cravath, and over 290 other law firms, have signed onto LFAA as Alliance Firms and have committed to leveraging their pro bono resources to support this work. Cravath is a member of the LCLD, which includes over 300 corporate chief legal officers and law firm managing partners dedicated to creating a more diverse legal profession. LCLD programs provide both practicing attorneys and law students from diverse backgrounds with leadership training, career-development strategies, peer networking, mentorship and more. Cravath is a signatory to the Statement of Diversity Principles adopted by the New York City Bar Association and a strong supporter of City Bar initiatives. We are a Leadership Sponsor of the New York City Bar’s Diversity and Inclusion Celebration Dinner, which each year honors law professionals who have made significant contributions to diversity and inclusion efforts. Cravath sponsors NYU Law’s Center for Diversity, Inclusion, and Belonging Speaker Series. The Center spotlights leaders who discuss topics relating to diversity and inclusion. Recent speakers have included Justice Sonia Sotomayor, Associate Justice of the United States Supreme Court; Brian Welle, Director of People Analytics at Google; Iris Bohnet, Professor of Public Policy at Harvard Kennedy School; and Sherrilyn Ifill, President and Director‑Counsel of the NAACP Legal Defense and Educational Fund."
year_published = 2025
