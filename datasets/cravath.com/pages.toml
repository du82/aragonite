["https://www.cravath.com/alumni-journal/articles/london-offices-english-law-offering-finds-footing-in-cross-border-financings.html"]
title = "London Office’s English Law Offering Finds Footing in Cross-Border Financings | Cravath, Swaine & Moore LLP"
description = """
When Korey Fevzi and Philip Stopford joined Cravath as its first English law‑qualified partners in March 2023, they regarded their arrival as just the latest step in a long history of commitment to meet client demand exactly where it is needed.
The European leveraged finance market had changed such that the Firm decided having both U.S. and English law elements in‑house seemed necessary components…"""
full_description = "Open since 1973, Cravath’s London office didn’t hire its first English law‑qualified lawyers until 50 years later. Corporate partners Korey Fevzi and Philip Stopford discuss how the strategic move has been meeting clients’ demand for cross‑border legal guidance and the many ways the Firm’s network is stronger for it. When Korey Fevzi and Philip Stopford joined Cravath as its first English law‑qualified partners in March 2023, they regarded their arrival as just the latest step in a long history of commitment to meet client demand exactly where it is needed. The European leveraged finance market had changed such that the Firm decided having both U.S. and English law elements in‑house seemed necessary components for effective client service on a deal. In response, Cravath — as it has often done over its more than 200‑year-old history — opted to find a solution by evolving. A thorough consideration of market conditions and plenty of careful planning played into the decision to hire Korey and Philip, who brought with them a team of English law‑qualified counsel and associates to CityPoint. They’ve since hit the ground running. “This was a targeted step in expanding Cravath’s capabilities in a very particular area,” Korey, the Firm’s Head of Banking and Credit Practice for EMEA, says. “One of the drivers was listening to our clients — leading global investment banks and other finance providers — that they really wanted a firm that could handle both New York and English law elements because it makes for a more complete offering.” “Cravath’s culture allows us to provide all the pieces of a financing transaction,” Philip adds. “It is easier and more productive to work together as a single, unified group of people. You have more commonality in terms of the solutions you’re providing.” While the addition of English law‑qualified attorneys to the London office hasn’t yet reached its second anniversary, Cravath’s presence in Europe stretches back much longer."
year_published = 2025
clearnet = "https://www.cravath.com/alumni-journal/articles/london-offices-english-law-offering-finds-footing-in-cross-border-financings.html"
