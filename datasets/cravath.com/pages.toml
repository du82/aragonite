["https://www.cravath.com/diversity-and-inclusion/women-s-initiative.html"]
title = "Women’s Initiative | Cravath, Swaine & Moore LLP"
description = """
Women’s Initiative
In 1971, Cravath became one of the first “Wall Street” law firms to elect a woman partner. Since that time, we have remained committed to ensuring that women are represented and supported at all levels of the Firm. Currently, our Presiding Partner, Managing Partner of our Litigation Department, Head of our Tax Department and Managing Partner of our Washington, D.C. office are…"""
full_description = "In 1971, Cravath became one of the first “Wall Street” law firms to elect a woman partner. Since that time, we have remained committed to ensuring that women are represented and supported at all levels of the Firm. Currently, our Presiding Partner, Managing Partner of our Litigation Department, Head of our Tax Department and Managing Partner of our Washington, D.C. office are all women. In 1936, Cravath hired its first woman lawyer. On January 14, 2016, the Cravath partners hosted a reception at The Metropolitan Museum of Art to celebrate the contributions—to Cravath and to the legal profession—of the more than 1,000 women lawyers who have worked at the Firm since that time. As part of a multi-faceted effort to recruit and retain excellent women lawyers, the Women’s Initiative hosts events throughout the year that encourage the development of professional relationships. These include: To foster deeper connections, associates are encouraged to participate in small group sessions within the Women’s Initiative. These groups, comprising of partners and associates, convene regularly for substantive discussions and informal check-ins. Our associates have spearheaded a number of events that address topics of particular interest to them. For example, groups of associates have organized lunchtime discussions about women and leadership, “the imposter syndrome” and effective communication. Programs like these provide a welcome opportunity to engage in candid, small-group discussions with partners and associates. The Women’s Initiative includes several associate-led working groups that focus on organizing special events, recruiting women law students and implementing programming that enhances women's experiences at the Firm. The Women’s Initiative hosts speakers from both the nonprofit and corporate sectors to speak to our associates. An alumnae panel included the General Counsels of Tiffany & Co., ANN INC. and FactSet Research Systems, each of whom discussed her career path and shared insights about in-house counsels’ expectations of the lawyers they retain."
year_published = 2025
