["https://www.cravath.com/people/andrew-j-pitts.html"]
title = "Andrew J. Pitts | Cravath, Swaine & Moore LLP"
description = "Andrew J. Pitts is Co-Head of the Capital Markets Practice for North America. He has a significant corporate finance practice and advises clients on a broad range of corporate issues. Mr. Pitts is widely regarded in the legal community as exceptionally responsive and pragmatic with a wide range of experience addressing clients’ most complex legal issues."
full_description = "Andrew J. Pitts is Co-Head of the Capital Markets Practice for North America. He has a significant corporate finance practice and advises clients on a broad range of corporate issues. Mr. Pitts is widely regarded in the legal community as exceptionally responsive and pragmatic with a wide range of experience addressing clients’ most complex legal issues. Mr. Pitts’s finance practice focuses on public and private securities offerings for investment banking clients and issuers. Principal areas of concentration include the financial institutions, insurance, industrials, natural resources, technology and transportation industries. In addition to traditional capital‑raising transactions, Mr. Pitts regularly advises on transactions involving convertible securities, equity‑linked securities and equity derivatives, including public and private hedging transactions using collars and forward contracts. Mr. Pitts also regularly represents investment banking clients and issuers in connection with liability management transactions, including debt tender and exchange offers and consent solicitations. Mr. Pitts’s advisory work principally involves corporate governance, public company disclosure obligations and director and officer liability issues (including D&O insurance). He frequently teams with other Cravath partners in complex merger and acquisition transactions. Mr. Pitts is the Contributing Editor to “Getting the Deal Through: Securities Finance,” an annual survey of the securities laws in 15 jurisdictions, and regularly participates in other industry activities, including SIFMA. Mr. Pitts is also actively involved in legal opinion matters. He is the Chair of Cravath’s opinion committee, a member of the TriBar Opinion Committee and is the former Chair of the ABA Subcommittee on Securities Law Opinions. Mr. Pitts is a member of the New York City Bar Association and the International Bar Association. Mr. Pitts has been repeatedly cited as one of the leading practitioners in capital markets by, among others, Chambers USA, Chambers Global, The Legal 500 US, IFLR1000, Lawdragon, The Best Lawyers in America and Who’s Who Legal: Capital Markets."
