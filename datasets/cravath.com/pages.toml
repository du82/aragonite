["https://www.cravath.com/news-insights/cravath-publishes-tech-explainer-on-scaling-web3.html"]
title = "Cravath Publishes “Tech Explainer” on Scaling Web3 | Cravath, Swaine & Moore LLP"
description = """
In February 2025, Cravath continued its “Tech Explainers” series, which introduces and explains technical, cutting-edge concepts and describes their importance in a way that is accessible to and easily understood by business and legal professionals outside the technical community.
The new installment in the series focuses on Layer 2 blockchains, which are blockchains built upon Layer 1 blockchains…"""
full_description = "In February 2025, Cravath continued its “Tech Explainers” series, which introduces and explains technical, cutting-edge concepts and describes their importance in a way that is accessible to and easily understood by business and legal professionals outside the technical community. The new installment in the series focuses on Layer 2 blockchains, which are blockchains built upon Layer 1 blockchains such as Ethereum in order to allow the scaling of transaction volumes through increased efficiency and cost‑effectiveness. The article describes the various types of Layer 2 solutions—including optimistic rollups, zero‑knowledge rollups, plasma and validiums—and their advantages and challenges, and also provides an overview of other blockchain scaling projects. Celebrating 200 years of partnership. In 2019, we celebrated our bicentennial. Our history mirrors that of our nation. Integral to our story is our culture."
