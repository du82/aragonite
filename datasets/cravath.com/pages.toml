title = "Johnson & Johnson’s $14.6 Billion Acquisition of Intra‑Cellular Therapies, Inc. | Cravath, Swaine & Moore LLP"
description = "On January 13, 2025, Johnson & Johnson and Intra‑Cellular Therapies, Inc. announced that they have entered into a definitive agreement under which Johnson & Johnson will acquire all outstanding shares of Intra‑Cellular Therapies, a biopharmaceutical company focused on the development and commercialization of therapeutics for central nervous system (CNS) disorders, for $132 per share in cash for a…"
full_description = "On January 13, 2025, Johnson & Johnson and Intra‑Cellular Therapies, Inc. announced that they have entered into a definitive agreement under which Johnson & Johnson will acquire all outstanding shares of Intra‑Cellular Therapies, a biopharmaceutical company focused on the development and commercialization of therapeutics for central nervous system (CNS) disorders, for $132 per share in cash for a total equity value of approximately $14.6 billion. Cravath is representing Johnson & Johnson in connection with the transaction. The Cravath team is led by partners Robert I. Townsend III, Ting S. Chen and Jin‑Kyu Baek and includes associates Maria Ricaurte, Armin Hoss and Priya Patel on M&A matters; partners J. Leonard Teti II and Andrew T. Davis and associate Christopher M. Winters on tax matters; partner Matthew J. Bobby, of counsel Sarah W. Colangelo and associate Caroline Wyatt on executive compensation and benefits matters; partner Sasha Rosenthal‑Larrea and associates Lucille Dai‑He and Vincent Joralemon on intellectual property matters; partner Matthew Morreale and associate Star S. Gulant on environmental matters; and senior attorney Joyce Law and practice area attorney Brian M. Budnick on real estate matters. Amy Chun also worked on M&A matters and Jay Kober worked on executive compensation and benefits matters. On February 24, 2025, Bridge Investment Group Holdings Inc. (“Bridge”), a leading alternative investment manager diversified across specialized asset classes, and Apollo Global Management, Inc. (“Apollo”) announced they have entered into a definitive agreement for Apollo to acquire Bridge in an all‑stock transaction with an equity value of approximately $1.5 billion. Under the terms of the transaction, Bridge stockholders and Bridge OpCo unitholders will receive 0.07081 shares of Apollo stock for each share of Bridge Class A common stock and each Bridge OpCo Class A common unit, respectively, valued by the parties at $11.50 per each share of Bridge Class A common stock and Bridge OpCo Class A common unit, respectively. Cravath is representing the special committee of the Bridge Board of Directors in connection with the transaction."
