["https://www.cravath.com/people/will-c-giles.html"]
title = "Will C. Giles | Cravath, Swaine & Moore LLP"
description = "Will C. Giles focuses his practice on advising international and domestic banking organizations and other financial institutions on transactional, regulatory, supervisory, enforcement and governance matters."
full_description = "Will C. Giles focuses his practice on advising international and domestic banking organizations and other financial institutions on transactional, regulatory, supervisory, enforcement and governance matters. Mr. Giles has significant experience advising both large financial companies and government agencies regarding bank regulation. From 2010 to 2018, he was an attorney in the Legal Division at the Board of Governors of the Federal Reserve System, rising to the level of Special Counsel. During his time at the Federal Reserve, he advised its principals and senior staff on a host of issues regarding merger and acquisition proposals, change in control matters, implementation of the Dodd-Frank Wall Street Reform and Consumer Protection Act and other high priorities for the agency, including rulemakings and other agency efforts regarding resolution planning, qualified financial contracts, total loss absorbing capacity, physical commodities and merchant banking. He also served as a member on the Governance and Controls steering committee of the Large Institution Supervision Coordinating Committee and led the review of a range of novel and complex proposals under the Bank Holding Company Act, Change in Bank Control Act, and Federal Reserve Act. Mr. Giles’s practice after leaving the Federal Reserve has focused on advising financial companies and trade organizations regarding a broad range of financial reform, regulatory policy and other regulatory advocacy and compliance matters. Mr. Giles received a B.S.B.A. from the University of Arkansas in 2004, a J.D. from the University of Virginia School of Law in 2007 and an LL.M. in Banking and Financial Law from the Boston University School of Law in 2010. Mr. Giles has significant experience advising both large financial companies and government agencies regarding bank regulation. From 2010 to 2018, he was an attorney in the Legal Division at the Board of Governors of the Federal Reserve System, rising to the level of Special Counsel. During his time at the Federal Reserve, he advised its principals and senior staff on a host of issues regarding merger and acquisition proposals, change in control matters, implementation of the Dodd-Frank Wall Street Reform and Consumer Protection Act and other high priorities for the agency, including rulemakings and other agency efforts regarding resolution planning, qualified financial contracts, total loss absorbing capacity, physical commodities and merchant banking. He also served as a member on the Governance and Controls steering committee of the Large Institution Supervision Coordinating Committee and led the review of a range of novel and complex proposals under the Bank Holding Company Act, Change in Bank Control Act, and Federal Reserve Act."
