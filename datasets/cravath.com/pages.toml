["https://www.cravath.com/practices/practices/corporate/banking-and-credit.html"]
title = "Banking and Credit | Cravath, Swaine & Moore LLP"
description = "Cravath has been known as one of the premier U.S. law firms for two centuries. Each of our practice areas is highly regarded, and our lawyers are recognized around the world for their commitment to the representation of our clients’ interests. Throughout our history, we have played a central role in developing how law is practiced, how lawyers are trained and how business risk is managed. We are not, and do not strive to be, the largest law firm measured by number of offices or lawyers. Our goal is to be the firm of choice for clients with respect to their most challenging legal issues, most significant business transactions and most critical disputes."
full_description = "Cravath’s banking and credit lawyers are highly regarded for crafting sophisticated and business‑oriented financing solutions. Our lawyers, including our English law‑qualified lawyers based in London, have significant experience advising on European and cross‑border bank financings. We draw upon a depth of financing expertise and extensive knowledge across our corporate practice to structure innovative and market‑clearing deals that are uniquely tailored to the needs of borrowers and lenders. Cravath has been consistently ranked a leading firm for banking and credit by numerous third‑party publications. The Firm is a five‑time winner of the Chambers USA Award for Excellence in Finance and a four‑time winner of Law360’s Banking Practice Group of the Year award. Our banking and credit lawyers regularly earn plaudits from their clients and peers in the market: Cravath represents borrowers, lenders, private equity firms and other participants in complex leveraged financing transactions in connection with acquisitions, recapitalizations and refinancings. We advise on syndicated loans, bank‑to‑bond financings and mezzanine financing arrangements, and provide strategic, bespoke advice to help borrowers achieve their financing objectives while ensuring lender protections. We represent U.S. and non‑U.S. corporate borrowers and financial institutions in connection with high‑grade lending transactions ranging from routine revolving credit facilities to some of the largest acquisition financings in history. We represent credit funds and other alternative lenders in structuring, documenting and executing direct lending and private credit transactions. We leverage our deep knowledge of broadly syndicated markets, as well as the collective experience of our capital markets, private equity and financial restructuring and reorganization practices, to provide a significant advantage to our direct lending clients. Cravath has advised on the financing transactions underpinning some of the most notable spin‑off and separation transactions in recent history. Our banking and credit lawyers work closely with the Firm’s preeminent tax and other corporate practices to provide seamless advice in connection with the financing of these complex transactions. We serve as a trusted partner throughout all stages of a transaction, from initial planning and structuring to closing and post‑closing considerations, and work efficiently with all parties to ensure the financings and other related spin‑off transactions remain on the timeline set forth at announcement."
year_published = 2025
