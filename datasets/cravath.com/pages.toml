["https://www.cravath.com/people/william-v-fogg.html"]
title = "William V. Fogg | Cravath, Swaine & Moore LLP"
description = "William V. Fogg is Co‑Head of the Capital Markets Practice for North America. His practice focuses on representing companies and major investment banks in public and private capital markets transactions, as well as on corporate governance, general corporate and disclosure matters. The Financial Times featured Mr. Fogg’s work on behalf of Cincinnati Bell in converting its data center business into…"
full_description = "William V. Fogg is Co‑Head of the Capital Markets Practice for North America. His practice focuses on representing companies and major investment banks in public and private capital markets transactions, as well as on corporate governance, general corporate and disclosure matters. The Financial Times featured Mr. Fogg’s work on behalf of Cincinnati Bell in converting its data center business into a “first‑of‑its‑kind” REIT and its subsequent carve‑out IPO of CyrusOne as one of the most innovative deals of the year in its U.S. Innovative Lawyers 2013 special report. Mr. Fogg has been repeatedly cited as one of the country’s leading capital markets practitioners by numerous professional publications, including Chambers USA, Chambers Global, The Legal 500 US, IFLR1000 and The Best Lawyers in America. Clients praise his “breadth of knowledge, unmatched experience and collaborative style” and describe him as having a “rare combination of subject matter expertise and excellent client service skill” (Chambers USA). One client says Mr. Fogg “is truly top notch, and has made himself invaluable to our company” as he “consistently demonstrates an incredible knowledge and understanding of our business,” “exercises good judgment in time sensitive and high pressure situations” and “is incredibly responsive” (The Best Lawyers in America). Mr. Fogg was named the 2020 New York City “Lawyer of the Year” by The Best Lawyers in America for Securities/Capital Markets Law. In 2019, he was named a Capital Markets Trailblazer by The National Law Journal. Mr. Fogg has also been named one of the “500 Leading Lawyers in America” and “500 Leading Dealmakers in America” by Lawdragon. Mr. Fogg is designated underwriters’ counsel for a number of companies, including JPMorgan Chase, Freeport‑McMoRan, The Mosaic Company, TG Therapeutics, United Rentals, WW (Weight Watchers) and Zimmer Biomet. His corporate clients have included Alliant Energy, Burlington Northern Santa Fe, Cincinnati Bell, Convey Health Solutions, CyrusOne, Evolent Health, Home Depot, IsoPlexis, Jones Apparel Group, Martin Marietta, Monogram Health, Mylan, TerraForm Power, UAL and Wisconsin Power and Light Company."
