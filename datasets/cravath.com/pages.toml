["https://www.cravath.com/practices/industries/consumer-products-and-services.html"]
title = "Consumer Products and Services | Cravath, Swaine & Moore LLP"
description = "Cravath has been known as one of the premier U.S. law firms for two centuries. Each of our practice areas is highly regarded, and our lawyers are recognized around the world for their commitment to the representation of our clients’ interests. Throughout our history, we have played a central role in developing how law is practiced, how lawyers are trained and how business risk is managed. We are not, and do not strive to be, the largest law firm measured by number of offices or lawyers. Our goal is to be the firm of choice for clients with respect to their most challenging legal issues, most significant business transactions and most critical disputes."
full_description = "Cravath regularly represents consumer products and services leaders in a wide range of corporate and litigation matters in the U.S. and around the world. Our clients include companies throughout the consumer products and services industries, from traditional brick-and-mortar stores to multinational e‑commerce businesses. Our lawyers have outstanding capabilities in the areas of food and beverage, household products and personal care, leisure and recreation and luxury goods. Cravath’s corporate lawyers advise our consumer products and services clients in domestic and cross-border mergers and acquisitions, as well as in divestitures of brands and products. We have significant experience in executing bank financings, IPOs and other securities offerings in the consumer products and services space. The Firm has also handled critical litigation for companies in these industries involving diverse areas of the law, including product liability, antitrust, RICO, trademarks, general commercial and securities. Our lawyers have outstanding capabilities in the areas of food and beverage, household products and personal care, leisure and recreation and luxury goods. Cravath’s corporate lawyers advise our consumer products and services clients in domestic and cross-border mergers and acquisitions, as well as in divestitures of brands and products. We have significant experience in executing bank financings, IPOs and other securities offerings in the consumer products and services space. The Firm has also handled critical litigation for companies in these industries involving diverse areas of the law, including product liability, antitrust, RICO, trademarks, general commercial and securities. Cravath represented the initial purchasers in connection with the €325 million 144A/Reg. S high‑yield senior secured notes offering of Flora Food Management B.V. (f/k/a Upfield B.V.). Flora Food Management B.V. operates as a plant‑based consumer product company. The transaction closed on February 3, 2025."
