["https://www.cravath.com/people/tatiana-lapushchik.html"]
title = "Tatiana Lapushchik | Cravath, Swaine & Moore LLP"
description = "Tatiana Lapushchik is Co-Head of the Banking and Credit Practice. Her practice spans both leveraged and investment grade bank financings across a variety of industries, including industrials, oil and gas, consumer and technology and media. Ms. Lapushchik dedicates a significant portion of her practice to advising on financings for private equity clients and their portfolio companies."
full_description = "Tatiana Lapushchik is Co-Head of the Banking and Credit Practice. Her practice spans both leveraged and investment grade bank financings across a variety of industries, including industrials, oil and gas, consumer and technology and media. Ms. Lapushchik dedicates a significant portion of her practice to advising on financings for private equity clients and their portfolio companies. Ms. Lapushchik has been repeatedly recognized as a leading lawyer in banking and finance by, among others, Chambers USA, Chambers Global, The Legal 500 US, IFLR1000, The Best Lawyers in America and Who’s Who Legal. Her work has been recognized in the Financial Times’ U.S. Innovative Lawyers Report and by the New York Law Journal. Ms. Lapushchik has received the “Best in Banking & Finance” award at Euromoney Legal Media Group’s Americas Women in Business Law Awards. She has also been named to Crain’s New York Business’s list of “Notable Women in Law,” IFLR1000’s list of “Women Leaders - United States” and Lawdragon’s lists of the “500 Leading Lawyers in America” and the “500 Leading Dealmakers in America.” In her leveraged finance practice, Ms. Lapushchik has been involved in numerous private equity and strategic leveraged financings, recapitalizations and debt restructurings, including financings for Lindsay Goldberg in connection with its acquisitions of The Kleinfelder Group, ARYZTA’s North American bakery business (now Aspire Bakeries), Liquid Tech Solutions, Summit Interconnect and other portfolio companies; American Securities and Lindsay Goldberg in connection with the acquisition of Amentum, subsequent acquisitions of DynCorp and PAE and Amentum’s Reverse Morris Trust merger with Jacobs’ Critical Mission Solutions and Cyber and Intelligence businesses; Six Flags in connection with its merger of equals with Cedar Fair; Entegris in connection with its acquisitions of CMC Materials and ATMI; Bakelite in connection with its carve-out acquisition of Georgia Pacific Chemicals; Fathom Manufacturing in connection with its SPAC merger; and White Mountains in connection with its acquisitions of NSM Insurance Group and other portfolio companies."
