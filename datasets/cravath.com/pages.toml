description = "Doug Dolan focuses his practice on representing corporate issuers and investment banking firms in capital markets transactions, including initial public offerings, other equity financings and investment grade and high‑yield bond offerings. He also has significant experience representing clients in mergers and acquisitions, syndicated loan and direct lending transactions, public disclosure and…"
full_description = "Doug Dolan focuses his practice on representing corporate issuers and investment banking firms in capital markets transactions, including initial public offerings, other equity financings and investment grade and high‑yield bond offerings. He also has significant experience representing clients in mergers and acquisitions, syndicated loan and direct lending transactions, public disclosure and general corporate matters. Mr. Dolan’s corporate clients have included AerCap, Atlas Air, Biogen, Cable One, Canadian National Railway, Cincinnati Bell, Cox Communications, CyrusOne, Enerflex, Forward Air, GuideWell, IBM, Johnson & Johnson, Kenvue, Minerals Technologies, Mylan, Occidental Petroleum, Rogers Communications and US Foods. Mr. Dolan has been recognized by Chambers USA, The Legal 500 US and IFLR1000 for his work in capital markets and has been named to the Lawdragon 500 X – The Next Generation list. Mr. Dolan is from Penn Valley, California. He received a B.A. from Cornell University in 2011 and a J.D. magna cum laude from New York University School of Law in 2014. Mr. Dolan has been recognized by Chambers USA, The Legal 500 US and IFLR1000 for his work in capital markets and has been named to the Lawdragon 500 X – The Next Generation list. Mr. Dolan is from Penn Valley, California. He received a B.A. from Cornell University in 2011 and a J.D. magna cum laude from New York University School of Law in 2014. Cravath represented Rogers Communications Inc. in connection with its $2.1 billion registered fixed‑to‑fixed rate subordinated notes. Rogers Communications is one of Canada's largest providers of wireless communication services, including cable television, high‑speed internet and telephony services. The transaction closed on February 12, 2025. Cravath represented the initial purchasers in connection with the $850 million 144A/Reg. S high‑yield senior guaranteed notes offering of Cleveland‑Cliffs Inc., a leading North America‑based steel producer. The transaction closed on February 6, 2025."
