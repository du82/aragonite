description = "Cravath partners John W. White, Michael L. Arnold, Helam Gebremariam and Ryan J. Patrone participated in the 41st Annual Federal Securities Institute, which was hosted by the Business Law Section of the Florida Bar in Tampa, Florida from February 24‑25, 2025 and brought together corporate, M&A and securities practitioners, in‑house counsel, executives and advisors to discuss various topics in…"
full_description = "Cravath partners John W. White, Michael L. Arnold, Helam Gebremariam and Ryan J. Patrone participated in the 41st Annual Federal Securities Institute, which was hosted by the Business Law Section of the Florida Bar in Tampa, Florida from February 24‑25, 2025 and brought together corporate, M&A and securities practitioners, in‑house counsel, executives and advisors to discuss various topics in corporate law, including structuring acquisitions and capital‑raising transactions, navigating regulatory enforcement issues and corporate governance. John moderated a panel entitled “Accounting and Financial Reporting in 2025: What Lawyers Should Focus On!” Michael spoke on a panel entitled “Shareholder Activism: Chess or Chicken?” Helam moderated a panel entitled “Private Securities Litigation – Is this a State of Upheaval?” Ryan spoke on a panel entitled “Regulatory Concerns for Capital Raising.” Celebrating 200 years of partnership. In 2019, we celebrated our bicentennial. Our history mirrors that of our nation. Integral to our story is our culture."
