["https://www.cravath.com/news-insights/epic-games-wins-posttrial-injunction-in-antitrust-case-against-google.html"]
title = "Epic Games Wins Post‑Trial Injunction in Antitrust Case Against Google | Cravath, Swaine & Moore LLP"
description = "On October 7, 2024, the U.S. District Court for the Northern District of California entered a post‑trial order in favor of Cravath client Epic Games imposing a nationwide three‑year permanent injunction against Google. The injunction, which follows Epic’s jury trial win against Google last year, prohibits Google from paying competitors not to compete and requires Google to distribute alternative…"
full_description = "On October 7, 2024, the U.S. District Court for the Northern District of California entered a post‑trial order in favor of Cravath client Epic Games imposing a nationwide three‑year permanent injunction against Google. The injunction, which follows Epic’s jury trial win against Google last year, prohibits Google from paying competitors not to compete and requires Google to distribute alternative app stores on the Google Play Store and provide alternative app stores with access to the Google Play Store’s catalog of apps. In addition to partners Gary A. Bornstein, Yonatan Even and Lauren A. Moskowitz, the Cravath trial team included partners Timothy G. Cameron, Justin C. Clarke and Michael J. Zaken; senior attorney Brent Byars; and associates Allison C. Tilden, Daniel L. Ottaunick, Catherine G. Sheets, Malikah I. Williams, Lauren N. Reisig, Charles Bloom, Anissa L. Badea and Panya Gupta. Partners Christine A. Varney and Wes Earnhardt were also critical members of the team. On December 11, 2023, a jury unanimously ruled in favor of Cravath client Epic Games (“Epic”) on all counts in its closely watched antitrust case against Google in the U.S. District Court for the Northern District of California, determining—after a multiweek trial—that Google has engaged in anticompetitive behavior in the distribution of mobile apps and in the handling of in‑app payments. Celebrating 200 years of partnership. In 2019, we celebrated our bicentennial. Our history mirrors that of our nation. Integral to our story is our culture."
