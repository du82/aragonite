title = "Dev Blog «  Dungeon Crawl Stone Soup"
full_description = "Wednesday, September 25th, 2024 04:32 0.32 Tournament Results by gammafunk The 0.32 tournament is over. On behalf of the Dev Team, many thanks to all the server admins, outside contributors, bug reporters, and to the many DCSS players who made the 0.32 release and tournament possible! For 16 days, players could compete for tournament points and banners by playing 0.32 games on the public servers. The only major rule change compared to the 0.31 tournament is that the Ziggurat category scoring was capped at 5 completed zigs. Zigs completed past 5 are still displayed for bragging rights, of course! Congratulations to Flugkiller for taking first place in the individual competition, with 114,782 points and 27 wins! Flugkiller won the most Nemelex Choice combos (19), got all tier 3 banners, one of only two players to do this, and took 1st in the Piety category. He also got the second-fastest real-time win, a MiFi won in 00:24:58, and won the second-highest scoring game, an AtCj with 74M points. Other big winners: TheMeInTeam: 2nd place overall with 97,543 points and 22 wins. TheMeInTeam tied for the longest win streak of the tournament with 10 wins, and was 2nd in Nemelex Choice combos (18 wins) and Piety categories. He was also 2nd in the Combo High Scores category, with species high scores for Coglin (CoWn) and Kobold (KoCa), the Hexslinger class high score (MDHs), and high scores for 8 combos in total. BerryKnight: 3rd place overall with 93,883 points and 11 wins. They won the 2nd most pacific game of the tournament, a MiFi with just 1044 kills, and took 3rd in the Combo High Scores category with a DgSh that took the Dg species and Sh class high scores and the Na species high score. TallOdds (aka CarefulOdds): Tied with TheMeInTeam for the longest win streak with 10 wins. Sapher: Highest scoring win at 98M points with an FoEE that also set the all-time Formicid species high score! p0werm0de: Fastest realtime win with a 0:24:57 MiFi. acrobatsimulacrum: The only other player along with Flugkiller to collect all 24 tier 3 banners. RepoMan: 1st place in the Combo High Scores category with 6 species and 6 class high scores. Legends say that RepoMan won all these games using Wu Jian and a certain wiki guide. zran (aka narz): Lowest turncount win, a GnEE won in 11,445 turns. sentinel: Most pacific win, a TrDe with only 964 kills. qw (bot): The third win of the tournament, a GrFi of Okawaru won in only 8 attempts. A 12.5% winrate is very good for qw and represents a combination of good luck and recent improvements to its code. The first three wins of the tournament were by EnegeticOcto (a MiFi in 0:54:59), tempest (a MiBe in 1:37:22), and qw (a GrFi in 1:50:46). The clan competition was won by XOMS CoCKtail Party (captained by EnegeticOcto) with 131,548 points. They bested the 2nd place clan in the Combo High Scores (1st overall), Best High Score (1st overall), Fastest Realtime Win (2nd overall), Lowest Turncount win (1st overall), Most Pacific win (1st overall), Banner Collection (tied for 1st overall), and Piety (1st overall) categories. In 2nd place was Artifact Hats Only – Cosplay (captained by TheMeInTeam) with 117,174 points, 1st place in the Streak Length and Nemelex Choice categories, 2nd place in the Piety and Banner Collection categories, and 3rd place in the Fastest Realtime Win category. In 3rd place was TeamSplat (captained by Mandevil) with 98,358 points and 2nd place in the Most Pacific Win category. To close out, here are some overall tournament statistics (with the 0.31 numbers in brackets for comparison). 2,904 non-bot players started a game at some point during the tournament; of those 2,838 completed a game without quitting or leaving the dungeon sadly orbless. This definition of “player” (players who completed a non-boring game) is used for subsequent calculations and was used for the 0.31 statistics. Players: 2,838 (0.31: 2,728) Total player time: 29,114 hrs (0.31: 30,498 hrs) Average player time: 10.26 hrs (0.31: 11.18 hrs) Games played: 76,121 (0.31: 71,851) Players who got a rune: 871 (0.31: 861) 421 winners and 1319 wins (0.31: 454 winners and 1367 wins) Win rate: 1.73% (0.31: 1.90%) WebTiles win rate: 1.63% (0.31: 1.85%) / Console win rate: 5.43% (0.31: 3.59%) Thanks to you all for playing! Many thanks as well to server admins, developers, and contributors who made the 0.32 release and tournament possible! The 0.33 season has begun, and changes are already commit storming in. In the development branch, you can already try out several new player mutations, experience new and reworked Pandemonium monsters (both holy and demonic), and see some awesome new tile art! Also look for an important 0.32.1 bugfix release to made this week. That’s all for now, and until next time, happy crawling! Comments Off Friday, August 30th, 2024 00:20 0.32 “Gods and Makers” by gammafunk We are pleased to announce the release of Dungeon Crawl: Stone Soup 0.32 “Gods and Makers”! DCSS 0.32 features redesigns of four gods, two new playable species, eleven new spells, many new and revamped monsters, as well as new decorations throughout the Dungeon! For the complete list of these and the many other changes included in this version, see the release page here. Packages of DCSS 0.32 for Windows, OS X, and Linux are all available from the download page. You can also play it online on one of many servers across the world! The tournament starts on Friday August 30th, 8pm UTC and runs through Sunday September 15th, 8pm UTC, with all online 0.32 games counting towards your score. See the tournament page for more details, including how to join or setup a clan. Clans membership can be changed until Friday September 6th, 8pm UTC. Many thanks to all those who have contributed to DCSS over the years. Thanks especially to the DCSS development team, whose contributions made 0.32 possible, and to the admins who run and maintain the official servers. A special thanks to the following community members who contributed to 0.32 and a warm welcome to the first-time contributors. 910rd, Alex Jurkiewicz, Aliscans, Andrew O’Neill, bjiorn, caryoscelus, Christopher Partin, Chuck Sellick, CipHuK, DevJac, elliottbernstein, geekosaur, grumposus, Isaac Clancy, Lexi Hattaway, mainiacjoe, mgdelmonte, michaelhunter27, Monkooky, NormalPerson7, orjb1, Quinten Konyn, RypoFalem, Rytis Petronis, Sean Dewar, SentientSupper, Wizard Ike, yrdzrfxndfvh, Zhang Kai 4 comments! Monday, August 19th, 2024 05:34 0.32 Release and Tournament by gammafunk Hello crawlers! We’ve entered feature freeze for 0.32, in preparation for the impending release and tournament. The tournament will run from Friday August 30th 2024 at 20:00 UTC until Sunday September 15th 2024 at 20:00 UTC. An initial version of the official 0.32 tournament page is now available for bookmarking. We don’t expect many rule changes compared to 0.31, but any such changes will be noted at the bottom of that page before the tournament begins. Note that the pages will be in Test Mode and may have random test data in coming days, but any such data will be wiped before the tournament starts. The 0.32 release will happen a day or two before August 30th. Also stay tuned for a forthcoming Trunk Update covering all the changes in 0.32. This post will mostly be a summary of the now up-to-date changelog, so take a look there if you’re dying to know what spells Xom has taught rats to cast. Best of luck to you all in the tournament! 2 comments! Saturday, July 20th, 2024 02:57 New Crawl Servers and a Possible Server Retirement by gammafunk Greetings, Dungeon Crawlers, as I once again bring you important server information! We have a new server hosted in South Korea at crawl.nemelex.cards, known officially as CNC. This server is owned by ASCIIPhilia, who has worked with us to make addition of a new server as painless as possible. This server uses a snapshot of the CPO user database from June 19th, 2024 as its starting user database, which means users already registered on CPO at that time won’t have to re-register on CNC. Please see the the drop-down instructions at the top of the CNC lobby for detailed instructions on dealing with any account conflicts. On the CNC lobby page you’ll also find a link to the CNC chat Discord as well info on an improved version of the famous multi-purpose WebTiles extension module that ASCIPhilia developed for CWZ. Many thanks for ASCIIPhilia for generously hosting our newest official server! Speaking of CWZ, unfortunately it suffered an SSD failure and is offline until further notice. Although the CWZ owner and admin, hong, is trying to have the server’s data recovered, it’s not clear if or when that will be completed. In any case, many thanks to hong for hosting CWZ, which has supported the South Korean DCSS community for over nine years! If CWZ does ever make a triumphant return, we’ll be sure to let you know. Regardless of this, CNC will continue to exist as its own independent server. Next, XTAHUA IS REJOICING because CXC has a new owner and admin that has migrated all data to a new host! Many thanks to melvinkitnick for providing the new server long-term and for working with Namanix, the previous owner and admin, to migrate the data. This transition should be seamless for CXC users, since the user database, morgues, ttyrecs, etc were all copied over from the old host. And of course, many thanks to Namanix for providing a host for CXC for almost 5 years! Unfortunately, the CPO server may be going offline in October unless a new owner can come forward and provide a replacement server. The CPO owner and admin, chequers, is able to provide the current server as-is as well as transfer the hostname to a new admin who’s willing provide the funding and has the necessary technical expertise. See the CPO Lobby Page for further details. Many thanks to chequers for hosting CPO and supporting the Australian and Oceania DCSS community for 10 years! Finally, a quick note that all games from CDI and CNC are now finally integrated into CAO Scoring. If you have games on any official server that aren’t showing up in the score pages, please let us know in #crawl-dev on Freenode or in the Roguelikes Discord. That’s all I have for now, so until next time, happy crawling! 1 comment... Sunday, April 7th, 2024 03:05 CDI is Now Official and CKO is Going Offline by gammafunk Greetings Dungeon Crawlers! The official crawl.kelbi.org server, also known as CKO, is going offline tomorrow. Many thanks to floraline for generously hosting what was often our busiest crawl server since 2018! Additionally, floraline contributed several aspects to WebTiles configuration that continue to be used by other official servers to this day. Your CKO game records will of course continue to be available in Sequell and CAO scoring. We also have a new long-term home for your CKO morgue files. Those should become accessible at the new host in the next couple weeks, after which Sequell and CAO scoring will point to the new morgue URLs for all past CKO games. Speaking of official servers, I’m upgrading the development server crawl.dcss.io aka CDI to become official! We’re using the cbro.berotato.org aka CBR2 account db as the starting db for CDI’s accounts. Players who were already registered on CBR2 as of Friday March 30 can log into CDI with their CBR2 credentials, otherwise please register a new account on CDI. Users migrating from CKO should see very similar latency, since CDI is hosted in the same New York City data center where CKO was located. Finally, I’ve set up a Patreon to help cover hosting costs for CDI. Head over there for more details, and thanks for any support you can provide! Observant gizmo inventors might notice qw trying out the new Coglin species in trunk on CDI at some point soon. And who knows what kind of memes one might eventually find on our newest server? As always, happy crawling! Comments Off Monday, February 12th, 2024 06:02 0.31 Tournament Results by gammafunk The 0.31 tournament is over. On behalf of the Dev Team, many thanks to all the server admins, outside contributors, bug reporters, and to the many DCSS players who made the 0.31 release and tournament possible! For 16 days, players could compete for tournament points and banners by playing 0.31 games on the public servers. The only major rule changes compared to the 0.30 tournament were the addition of a Gem Collection category, making Uskayaw’s banner be based on gems, and allowing Felids to win the Ruthless Efficiency banner. Congratulations to Sergey, for once again taking first place in the individual competition, with 115,521 points and 16 wins! Sergey got the most points for combos won, with species high scores for HO and Hu, and class scores for Hu and Wn, won the most pacific game (a SpEn with only 421 kills), achieved an 8 win streak (3rd best overall), a 64M HuEE high score (3rd best overall), collected 17 tier 3 banners, and won 6 Nemelex’s Choice combos. Other big winners: Wizard1ke: 2nd place overall with 106,191 points and 28 wins. Wizard1ke was the only player to collect all 24 tier 3 banners, and had the most points in the piety category, reaching max piety with 21 gods and winning with 21 gods. They also got the second most points for combos won, including the Te, Dj, and On species high scores, and won 13 Nemelex Choice combos. Flugkiller: 3rd place overall with 99,209 points and 13 wins. He got a 0:25:20 realtime MiFi win (2nd overall), collected 19 tier 3 banners (2nd overall), won a TrFi in only 14,063 turns (3rd overall), got a 7 win streak, and won 6 Nemelex Choice combos. TheMeInTeam: Longest win streak with 19 wins and highest in the winrate category (won 22 of 23 games played). Sapher: Highest scoring win at 91M points with an OpEE. EnegeticOcto: Fastest realtime win with a 0:22:48 MiFi. qw: Fastest realtime win by a bot with a 0:10:50 DjHu. qw won 3 games this tournament, including first ever wins of Dj and Dg (with DgHu). It also got 3 runes twice this tournament with SpHu. zran: Lowest turncount win with an AtCj winning in 10,274 turns. bookman: 23 Nemelex’s Choice wins, the most in the tournament. The first three wins of the tournament were by FlugKiller (a MiFi in 0:46:25), ShadowRider38 (a MiFi in 0:41:59), and p0werm0de (a MiFi in 0:27:52; 3rd fastest realtime win overall!). The last win of the tournament was by sewnkin, an OnEE that ascended 14 seconds before the end of tournament. The clan competition was won by Retired Ogres Bocce Club (captained by EnegeticOcto) with 132,494 points. They bested the 2nd place clan in the Combo High Scores (1st overall), Best High Score (1st overall), Fastest Realtime Win (1st overall), Most Pacific Win (1st overall), Fastest Realtime (1st overall), Low Turncount (1st overall), Banner Collection (tied for 1st overall), and Piety (1st overall) categories. In 2nd place was The TeAM in MeEE-Cosplay(captained by TheMeInTeam) with 102,015 points, and first place in the Streak Length categor"
