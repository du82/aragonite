title = "DCSS v0.28 Tournament"
full_description = '''Dungeon Crawl Stone Soup v0.28 Tournament Welcome! The tournament starts at 08:00PM Friday 04 February UTC and runs for 16 days until 08:00PM Sunday 20 February UTC . Contents Introduction How To Play Scoring Individual Categories Clan Categories Banners Changes Conduct How To Play All games of DCSS v0.28 played on official servers (CXC, CUE, CWZ, CAO, CPO, CKO, CDO, LLD, and CBR2) will count for the tournament! Playing in a Clan If you would like to create a clan, add the following as the first lines in your v0.28 rc file: # TEAMNAME nameofteam # TEAMMEMBERS player1 player2 player3 player4 player5 Clan names can contain letters, numbers, underscores, and hyphens. There can be a maximum of six people (including the captain) in a clan. If you'd like to play in an existing clan, add # TEAMCAPTAIN nameofcaptain as the first line of your v0.28 rc file. The captain doesn't need a # TEAMCAPTAIN line in their rc file! You can create, join, and leave clans for the first seven days of the tournament, until 20:00PM Friday 11 February UTC . If you're looking for a clan (or players to fill out your clan), try Reddit's /r/dcsstourney. Scoring Players earn points across a number of categories (listed below), which either award points proportionally or relative to the category leader. Your overall rank is the sum of points gained across all 14 categories. In a proportionally scored category you receive points based on your progress towards a maximum score in the category. The points recieved are: (progress / category maximum) * 10,000. In a relative category your performance in that category determines how many point you win from it. The points received are either: (your result / category best) * 10,000 or (category best / your result) * 10,000, depending on whether the category asks to maximize or minimize its result (for example, high score uses the first formula, low turn count the second). If you place last in a category, you will always receive 0 points. The points you receive in each relative category will change as the tournament progresses and the leader changes. Clans are scored separately using the same system, except with clan categories instead of individual categories. Individual Categories Exploration Ashenzari wants players to explore the dungeon and seek out runes of Zot. In this category, players earn 3 points per distinct rune of Zot collected and 1 point each for distinct branch entry and end floor reached. Okawaru's divine Arena does not interest Ashenzari. This is a proportionally scored category with a maximum possible score of 100. View full ranking. Piety Elyvilon thinks it's important to evaluate what all the gods have to offer. Elyvilon awards 1 point for becoming the champion (****** piety) of the first god worshipped in a game and an additional point for a win after championing that god. Three gods (Gozag, Ignis, and Xom) do not have the usual ****** piety system; to get the points for these gods, you must never worship another god during the game. This is a proportionally scored category with a maximum possible score of 50. View full ranking. Unique Harvesting Yredelemnul demands that players kill as many distinct uniques as possible as well as three player ghosts, and scores the number of such kills. This is a proportionally scored category with a maximum possible score of 81. View full ranking. Winning The Shining One values perseverance and courage in the face of adversity. In this category, TSO awards players points for winning a game, and additional points for winning a second distinct combo. This is a proportionally scored category with a maximum possible score of 2. Full ranking not available. Win Rate Cheibriados believes in being slow and steady, and recognises players who are careful enough to excel consistently. This category scores players by their adjusted win percentage, calculated as the number of wins divided by the number of games played plus 1. This is a proportionally scored category with a maximum possible score of 100. View full ranking. Streak Length Jiyva ranks players by their streak length. Jiyva favours the flexibility of a gelatinous body—the length of a streak is defined as the number of distinct species or backgrounds won consecutively (whichever is smaller). Every game in a streak must be the first game you start after winning the previous game in the streak. This will always be the case if you play all your games on one server. This is a proportionally scored category with a maximum possible score of 25. View full ranking. Nemelex' Choice Nemelex Xobeh wants to see players struggle against randomness and ranks players who persevere with combos randomly chosen and announced throughout the tournament. The first nine players to win a given Nemelex' choice combo earn a point in this category and Nemelex ranks players by their score in this category. The possible combos are those with no more than 49 online wins that were also not chosen in the last tournament. View full ranking. Combo High Scores Dithmenos ranks players by the combo high scores they can acquire and defend from rivals. Each combo high score at XL ≥ 9 gives 1 point, with bonus points for winning the game (+9) and being a species/background high score (+27 each). (Therefore, a single game can give a maximum of 64 points.) View full ranking. Best High Score Okawaru is all about getting as many points as possible, and ranks players based on their best high score. View full ranking. Lowest Turncount Win The Wu Jian Council favours the unquestioned excellence and efficient combat of the Sifu. The Council ranks players based on their lowest turn count win. View full ranking. Fastest Real Time Win Makhleb wants to see bloodshed as quickly as possible and ranks players according to their fastest win. View full ranking. Lowest XL Win Vehumet values ruthless efficiency, and recognises the players who win at the lowest XL. Waiting around for an ancestor to return from memory is inefficient, as is dying repeatedly, so Felid games and games where Hepliaklqana is worshipped do not count in this category. For the purposes of this category, players who have not won and players who have won only at XL 27 are both ranked last. View full ranking. Ziggurat Diving Xom is entertained by a player's descent into madness, and ranks players by the number of consecutive Ziggurat floors they reach in a single game. Exiting a Ziggurat from the lowest floor counts as "reaching a floor" for scoring in this category, and at most 27 Ziggurats count for scoring in this category. Ziggurats past the 27th are displayed for bragging rights. This is a proportionally scored category with a maximum possible score of 756. View full ranking. Banner Collection The other DCSS gods are too busy with divine affairs to rank an entire category, but every DCSS god rewards players for certain achievements with tiered banners. Players are awarded points for each banner, with tier one banners worth 1 point, tier 2 worth 2 points, and tier 3 worth 4 points. This is a proportionally scored category with a maximum possible score of 100. View full ranking. Clan Categories Exploration Clans are awarded points and subsequently ranked in the same way as the individual Exploration category using all of the members' games. This is a proportionally scored category with a maximum possible score of 100. View full ranking. Piety Clans are awarded points and subsequently ranked in the same way as the individual Piety category using all of the members' games. This is a proportionally scored category with a maximum possible score of 50. View full ranking. Unique Harvesting Clans are awarded points and subsequently ranked in the same way as the individual Unique Harvesting category using all of the members' games. This is a proportionally scored category with a maximum possible score of 81. View full ranking. Winning Clans are awarded points for distinct first combo wins by clan members. The total number of wins in this category is capped at 12, and the total number of wins from any member is capped at 4. For a win to count in this category it must be the first win of the combo by the clan. For example, if Player A's 5th win is a DgWn and they win before Player B's win of DgWn then Player B's win will not count in this category. This is a proportionally scored category with a maximum possible score of 12. Full ranking not available. Nemelex' Choice The clan is awarded points in this category in the same way as the indvidual Nemelex' Choice using all of the members' games: one point to each of the first nine clans to win a Nemelex combo. Note: multiple clan members may win a Nemelex combo to deny other individuals Nemelex points, but this will not affect clan Nemelex scoring. View full ranking. Combo High Scores The clan is awarded points in this category in the same way as the individual Combo High scores category using all of the members' games. Each combo high score at XL ≥ 9 gives 1 point, with bonus points for winning the game (+9) and being a species/background high score (+27 each). (Therefore, a single game can give a maximum of 64 points.) View full ranking. Streak Length Clans are ranked in this category based on the streak of their best player, calculated according to the individual Streak Length category. This is a proportionally scored category with a maximum possible score of 25. View full ranking. Best High Score Clans are ranked by the highest scoring game by any of their members. View full ranking. Low Turncount Win Clans are ranked by the lowest turncount win of any of their members. View full ranking. Fastest Real Time Win Clans are ranked by the fastest realtime win of any of their members. View full ranking. Ziggurat Diving Clans are ranked in this category based on the Ziggurat Dive of their best player. This is a proportionally scored category with a maximum possible score of 756. View full ranking. Banner Collection Clans are awarded banner points based on all of the members' banners. Banner points are awarded in the same way as the individual banner points based on the highest banner tier earned by the clan's members for each banner. This is a proportionally scored category with a maximum possible score of 100. View full ranking. Banners Banner progress in the individual & clan banner categories described above. Banner tiers are worth 1, 2, and 4 points for tiers one, two, and three respectively. Explorer Ashenzari thinks that an EXPLORER should be be busy looking for runes of Zot. Tier 1: Enter a rune branch other than the Abyss Tier 2: Collect 5 distinct runes Tier 3: Collect all 17 runes Heretic Beogh hates all the other gods and admires HERETICS who go out of their way to incur their wrath. The good gods (Elyvilon, the Shining One, and Zin) and Ru are insufficiently wrathful, so abandoning them does not impress Beogh. Any god except the good gods, Ru, and Beogh are hence applicable for this banner. Only the first god abandoned in a game counts for this banner, Beogh wants the heresies spread around! Tier 1: Abandon a god and do not rejoin them during the game Tier 2: Abandon and mollify one god Tier 3: Abandon and mollify 3 different gods in 3 different games Slow & Steady Cheibriados believes in being SLOW AND STEADY and will so recognize players who are careful enough to excel in consecutive games. Tier 1: Reach experience level 9 in two consecutive games. Tier 2: Achieve a two-win streak. Tier 3: Achieve four-win streak with four distinct species and four distinct backgrounds. Politician Dithmenos appreciates the subtlety of a POLITICIAN and will thus reward any player who steals a high score from another player. Tier 1: Steal a combo high score that was previously of at least 1,000 points. Tier 2: Steal a combo high score for a previously won combo. Tier 3: Steal a species or background high score that was previously of at least 10,000,000 points. Pious Elyvilon thinks it's important to check out what all the gods have to offer and thus will recognize as PIOUS any player who becomes the Champion (******) of as many gods as possible. Tier 1: Champion a god. Tier 2: Champion 5 gods. Tier 3: Champion 13 gods. Nature's Ally Fedhas thinks that the Crypt and the Tomb are abominations against nature and will bestow the title of NATURE'S ALLY on a player who works towards destroying them. Tier 1: Enter the Crypt. Tier 2: Get the golden rune. Tier 3: Enter Tomb for the first time after picking up the Orb of Zot, and then get the golden rune. Avarice Gozag wants players to demonstrate their AVARICE by collecting certain valuable metals. Tier 1: Find 1000 gold in a single game. Tier 2: Find the silver rune. Tier 3: Find the iron rune before entering Pandemonium or any branch of the dungeon containing any other rune. This means that only Temple, Lair, Orc, Elf, Depths, Abyss, Hell, and Dis can be entered. Inheritor Hepliaklqana bestows a geas upon you: recall the forgotten deities forth from the mists. Worship at a faded altar to become THE INHERITOR of memory! Tier 1: Enter the Lair of Beasts while worshipping a god from a faded altar, having worshipped no other gods. Tier 2: Collect a rune while worshipping a god from a faded altar, having worshipped no other gods. Tier 3: Win a game while worshipping a god from a faded altar, having worshipped no other gods. Gelatinous Body Jiyva thinks that it is important to be flexible and will gift players who excel with at least 5 distinct species and at least 5 distinct backgrounds with a GELATINOUS BODY. Tier 1: Reach experience level 9 with at least 5 distinct species and at least 5 distinct backgrounds. Tier 2: Get a rune with at least 5 distinct species and at least 5 distinct backgrounds. Tier 3: Win with at least 5 distinct species and at least 5 distinct backgrounds. Lord of Darkness Kikubaaqudgha wants players to demonstrate their mastery over the forces of darkness without delay, and will recognise a player who shows disdain for the Lair as a LORD OF DARKNESS. Tier 1: Reach the last level of the Orcish Mines without having entered the Lair. Tier 2: Reach the last level of the Depths without having entered the Lair. Tier 3: Win a game without having entered the Lair, the Orcish Mines, or the Vaults. Spiteful Lugonu hates all the other gods. At the moment, Lugonu is especially SPITEFUL towards Ru and admires those who make sacrifices to Ru and then abandon Ru's worship. Tier 1: Become the champion of Ru (the first step towards betraying Ru). Tier 2: After becoming the champion of Ru, abandon Ru and become the champion of a different god. Tier 3: Win a game in which you become the champion of Ru and then abandon Ru before entering any branches other than the Temple and the Lair. Speed Demon Makhleb wants to see bloodshed as quickly as possible and will give players the bare minimum of time needed to prove themselves as SPEED DEMONS. Makhleb isn't interested in digging (and has cacodemons for that), so formi'''
year_published = 2025
