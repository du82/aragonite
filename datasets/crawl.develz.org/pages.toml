tering any branches other than the Temple and the Lair. Speed Demon Tier 1: Reach D:15 in 27 minutes as a non-Formicid. Tier 2: Find a rune in 81 minutes. Tier 3: Win the game in 3 hours. Nemelex' Choice Tier 1: Reach experience level 9 with a Nemelex' choice combo. Tier 2: Get a rune with a Nemelex' choice combo. Tier 3: Win a given Nemelex' choice combo. (Awarded even if you're not in the first 9.) Conqueror Tier 1: Achieve a personal high score of 1,000,000. Tier 2: Achieve a personal high score of 9,000,000. Tier 3: Achieve a personal high score of 27,000,000. Prophet Tier 1: Enter the Lair of Beasts with Invocations as your highest skill. Tier 2: Win the game with Invocations as your highest skill. Tier 3: Over the course of the tournament, win with three different different gods and Invocations as your highest skill. Ascetic Tier 1: Reach the Ecumenical Temple without using any potions or scrolls. Tier 2: Reach the last level of the Lair of Beasts without using any potions or scrolls. Tier 3: Collect a rune without using any potions or scrolls. This rune cannot be the slimy or abyssal rune: Ru requires you to undergo this sacrifice for longer. Lorekeeper Tier 1: Reach the last level of the Lair as a non-formicid without raising any skill to 13. Tier 2: Win without raising any skill to 20. Tier 3: Win without raising any skill to 13. Vow of Courage Tier 1: In a single game, kill Sigmund before entering the Depths. Tier 2: In a single game, get four runes before entering the Depths. Tier 3: In a single game, get six runes before entering the Depths. Brute Force Tier 1: Reach the last level of the Lair as a non-demigod without worshipping a god. Tier 2: Find a rune as a non-demigod without worshipping a god. Tier 3: Win a game as a non-demigod without worshipping a god. Graceful Tier 1: Collect a rune from a Lair branch within 810 turns of entering the branch end. Tier 2: Collect the silver rune within 540 turns of entering Vaults:5. Tier 3: Collect the orb of Zot within 270 turns of entering Zot:5. Ruthless Efficiency Tier 1: Reach the last level of the Lair as a non-formicid before reaching experience level 12. Tier 2: Find a rune before reaching experience level 14. Tier 3: Win the game before reaching experience level 19. Sifu Tier 1: Enter the Temple in under 3,000 turns. Tier 2: Enter the third floor of the Elven Halls in under 9,000 turns. Tier 3: Enter the final floor of Gehenna in under 27,000 turns. Descent Into Madness Tier 1: Enter a Ziggurat. Tier 2: Reach the 10th floor of a Ziggurat. Tier 3: Exit a Ziggurat from its lowest floor. Harvest Tier 1: Kill 27 distinct uniques over the course of the tournament. Tier 2: Kill 54 distinct uniques over the course of the tournament. Tier 3: Kill 78 distinct uniques over the course of the tournament. Angel of Justice Tier 1: Enter either Pandemonium or any branch of Hell. Tier 2: Kill at least one unique pan lord and at least one unique hell lord over the course of the tournament. Tier 3: Kill all four unique pan lords, all four unique hell lords, and the Serpent of Hell (at least once) over the course of the tournament. Last updated 2022-02-21 00:59:28 UTC."
