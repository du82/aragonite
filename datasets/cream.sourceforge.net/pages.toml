["https://cream.sourceforge.net/contributors.html"]
title = "Cream :: a modern configuration of the Vim text editor"
full_description = '''Thanks to the following individuals who have contributed code or gave permission for their code to be used within the project (in reverse chronological order): Ciaran McCreesh and Thomas de Grenier de Latour build Cream for Gentoo and have fixed several bugs as a result. Ciaran also wrote the smoldering Inkpot color scheme, as well as the secure modelines for Vim that Cream uses. Gerald Williams wrote the visually tasty ChocolateLiquor color scheme, a flavor enhancement to the Cream already in Vim. Preben "Peppe" Guldberg wrote the right and center justification functions and the string inversion add-on logic. Yegappan Lakshmanan authored taglist.vim which Cream uses to list all the valid functions and variables within the current file, as well as obtain function prototypes for our pop up prototype menus. Srinath Avadhanula wrote the original version of the clever imaps.vim template script now modified in Cream to add a virtually unlimited number of expansions. (An improved version might be found in the Vim-LaTeX suite's CVS repository.) Gontran Baerts wrote EasyHtml.vim, the powerful listing script once included for listing HTML and CSS items. (Now obsolete by Vim's Omni-Completion feature.) Xavier Nodet, Christian Göebel and Jean-Philippe Leboeuf assisted in assembling the original French spell check and dictionary. Patrick Schiel created the Opsplorer file explorer that Cream used until it began using the operating system's file manager. Wolfgang Hommel assembled the original German spell check dictionary. He also wrote wordlist utilities used to create Cream dictionaries and was instrumental in propelling the project's spell check to multi-lingual flexibility and case sensitivity. Hari Krishna Dara wrote the most useful multvals.vim array library Cream depends on. Equally useful is his genutils.vim library. Both libraries are well-written pieces of code that help Cream be both smarter and smoother. Matthew Hawkins created the continues-to-grow-on-you Navajo Night color scheme based on the psychedelic experience caused by his sticky Esc key while using Navajo. ;)'''
year_published = 2025
