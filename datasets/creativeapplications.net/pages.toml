title = "CreativeApplications.Net – Technology, Society, and Critical Making (Since 2008)"
description = "Driving the conversations about technology, society and critical making."
full_description = "Created by Niklas Roy, Generative Art 1€ is a coin-operated vending machine for unique plotter drawings. A generative algorithm continuously draws an animated black line on a screen, offering an endless stream of potential artworks. Each piece exists in a transient digital state until someone intervenes by spending a coin. The installation questions the intrinsic value of machine-generated art, while also democratizing art consumption and collection by making original artworks affordable to all. ‘Étude on Painting’ is a series of works by Kynd that explore the process of creating digital painting tools. The process involves creating a variety of painting tools—code-driven patterns for brushwork and mark-making—then allowing these tools to generate images autonomously. The process of their creation and use is recorded as part of the piece. Not I explores the problematics at the heart of contemporary vocal forensics’ use of statistical learning techniques. The work develops a form of investigative aesthetics which seeks to open up the epistemic assumptions that ground the development of these socio-technical objects through a ‘counterculture’ of machine learning. By means of two formulations – image and word – ‘Tempo e Tempo’ investigates the juxtaposition of time and weather to search for a world where many worlds are possible to fit in: a dreamlike time where past, present and future meet. Brain Processing Unit explores the adaptation of artificial brain tissues alongside custom electronics to stimulate, analyze data, and develop the necessary APIs, networks, and other interface technologies required for these operations. Rosetta is a narrative installation inspired by the ESA mission of the same name, told from the perspective of the probe itself. The text and custom graphic elaborations alternate on a vertical display whereas the soundtrack incorporates words from the story as punctuation. The entire system stays at the critical threshold of the Larsen effect, generating a sonic tension and spatialization that reflects the time and distances suggested by the tale itself."
