full_description = "CC Learning and Training: 2024 Year in Review by Jennryn Wetzler, Shanna Hollich CC Certificate, Licenses & Tools People Walking on Brown Concrete Floor by Mehmet Turgut Kirkgoz . Public Domain. People Walking on Brown Concrete Floor by Mehmet Turgut Kirkgoz . Public Domain. Creative Commons training efforts strengthen our mission to “empower individuals and communities around the world through technical, legal, and policy solutions that enable the sharing of education, culture, and science in the public interest.” In 2024, our Learning & Training team focused… Meet the Recipients of the Fall 2024 CC Certificate Scholarship by Shanna Hollich CC Certificate, Licenses & Tools School by Thomas Hawk is licensed under CC BY-NC 2.0. School by Thomas Hawk is licensed under CC BY-NC 2.0. The Creative Commons (CC) Certificate courses are widely considered an essential resource for open access education and for increasing capacity for individuals and institutions using the CC licenses to increase open access. The CC Certificate program offers in-depth courses about CC licenses, open practices, and… CC Certificate Alumni Making a Global Impact by Shanna Hollich CC Certificate, Open Education, Policy “Farmer Melese Tsegaye blows to clean and select wheat seed in his field, Kingbird variety wheat from Kulumsa Research Station” by International Maize and Wheat Improvement Center is licensed via CC BY-NC-SA 2.0. Launched in 2018, the Creative Commons Certificate program has trained and graduated nearly 1800 people from 66 countries. The Certificate program offers in-depth courses about CC licenses, open practices, and the ethos of the Commons. Our staff is constantly inspired by our community of Certificate alumni, accomplishing incredible things. In this interview, we were delighted… New Revisions to CC Certificate Course Content = New Opportunities for Translations by Shanna Hollich, Jennryn Wetzler CC Certificate We are delighted to share the latest revisions of our Creative Commons Certificate Course content, available on our website as an OER in multiple formats."
