description = "The Creative Commons Global Network includes 289 community members who serve as CC representatives in over 60 countries. The Creative Commons Global Network recently undertook a community-led strategic process to revamp, revitalize, and strengthen the network. This included a research lead by Anna Mazgal, from Poland, with a series of researchers working with her from inside…"
full_description = "Global Network Who We Are Global Network Team Opportunities Annual Reports Get Involved Store Downloads Contact The Creative Commons Global Network includes 289 community members who serve as CC representatives in over 60 countries. The Creative Commons Global Network recently undertook a community-led strategic process to revamp, revitalize, and strengthen the network. This included a research lead by Anna Mazgal, from Poland, with a series of researchers working with her from inside and outside the network. A dedicated team of CC community members designed an entirely new model for collaboration – helping the network grow in a sustainable manner. The result of this process is a new structure and strategy document for the Creative Commons Global Network. Here you can find more information about the Global Network Strategy. We’re currently in the process of implementing this new strategy and as we do this, we invite you to join our community Slack channel or alternatively email your requests and queries to the Network Manager at network@creativecommons.org. Another way to get involved is to join the conversation of the Creative Commons Community Platforms. Creative Commons Summit 2015. Photo from CC Korea, CC BY"
