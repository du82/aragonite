description = "The Open Culture program is dedicated to making our resources available to our diverse global audience. Many of our resources are available in multiple languages and we are grateful to our community of volunteers for expanding CC’s linguistic reach."
full_description = "Open Culture Resources What We Do Legal Open Culture Open Culture Resources Advocacy Open Education Open Science Open Preprints Open Climate Copyright Policy Software: Free and Open-Source Code Training & Consulting The Open Culture program is dedicated to making our resources available to our diverse global audience. Many of our resources are available in multiple languages and we are grateful to our community of volunteers for expanding CC’s linguistic reach. Note that the original English version is the authoritative version on which all unofficial translations are based. Creative Commons does not guarantee the accuracy or completeness of the translations. Video Series Top Questions about Open Culture Answered in Short Videos Open Culture VOICES is a series of interviews with a wide range of experts from around the world on the benefits, challenges, and transformative power of open access to cultural heritage for institutions and the public alike. Studies, Reports, and Guidelines 2024 Nudging Users to Reference Institutions When Using Public Domain Materials, Creative Commons Guidelines English, français, italiano, 日本語, español, العربيّة, Nederlands, Shqip Don’t be a Dinosaur; or, The Benefits of Open Culture English, español, العربيّة Summary – Key Benefits of Open Culture English 2023 Towards a Recommendation on Open Culture (TAROC) — Two-Pager* English, Shqip, français, español, 日本語, Türkçe, italiano, العربيّة, Bahasa Indonesia Updated in 2024: TAROCH Informational Brief (English) Are the Creative Commons Public Domain Tools Fit-for-Purpose in the Cultural Heritage Sector? A Creative Commons Needs Assessment Report English, français, Ελληνικά, italiano Pioneers of Open, Three Case Studies of Library and Museum Early Adopters English, français, Igbo, Ελληνικά, Bahasa Indonesia, Tamil Recommended Practices for Attribution English, Igbo, Ελληνικά, Nederlands, Bahasa Indonesia, français, Türkçe, Swahili, italiano 2022 Creative Commons Policy Guide: Towards Better Sharing of Cultural Heritage — A Call to Action to Policymakers English, français, Português Brasileiro, español, Hausa, Nederlands, Ελληνικά, italiano, Yoruba, Shqip, عربي, 汉语, What are the Barriers to Open Culture? A Report by Creative Commons English, français, cрпски, Igbo, Ελληνικά, Türkçe, Shqip, Bahasa Indonesia, Hausa Creative Commons Policy Paper: Towards Better Sharing of Cultural Heritage — An Agenda for Copyright Reform English, français, Português, Ελληνικά, हिंदी, italiano, cрпски, Igbo Webinar Recordings Open Culture Live — Webinar Series (2023) Ethics of Open Sharing Webinar with Creative Commons and Wiki Loves Living Heritage ResiliArt x Mondiacult — From Access to Culture to Contemporary Creativity 3D Scanning for Cultural Heritage Preservation, Access and Revitalization — Panel Recap Towards Better Sharing of Cultural Heritage — Workshop Recording Other Resources Glossary on Open Culture/GLAM — Developed by an Open Culture Platform Working Group in 2022 Bibliography on Open Culture/GLAM — Developed by an Open Culture Platform Working Group in 2022 We Like to Share — Creative Commons community blog hosted on Medium. Here you can also submit content! Reach out to the team at info@creativecommons.org to request to join. Open Minds Podcast: Brigitte Vézina of Creative Commons on the CC Open Culture Program (February 2022) To keep abreast of the Open Culture Program’s activities and to contribute community news and opportunities, sign up to our Open Culture Matters newsletter."
