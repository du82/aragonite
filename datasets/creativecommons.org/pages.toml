description = "Many questions are answered in our FAQ and you can find out more about our Global Network. If you are unable to find your answer via our FAQ or website, please use the contact form below or email us at info@creativecommons.org. Contact CC Press For press/media related inquiries, please contact: communications@creativecommons.org Mailing address Please note:…"
full_description = "Contact Who We Are Global Network Team Opportunities Annual Reports Get Involved Store Downloads Contact Many questions are answered in our FAQ and you can find out more about our Global Network. If you are unable to find your answer via our FAQ or website, please use the contact form below or email us at info@creativecommons.org. @import url(https://s3.amazonaws.com/assets.freshdesk.com/widget/freshwidget.css); Contact CC <br /> Press For press/media related inquiries, please contact: communications@creativecommons.org Mailing address Please note: we are a distributed team working all over the world. We don’t have an office, but if you need to mail us correspondence, please send it to: Creative Commons PO Box 1866 Mountain View CA 94042 USA Or if you would like to mail us a donation, please send it to this address: Creative Commons Corporation PO Box 741107 Los Angeles CA 90074-1107 The best way to contact us is to write to info@creativecommons.org. Reporting bugs and problems with a Creative Commons website, license, wiki or project webpage You can write to us using the form above, or you can file an issue on GitHub. Get involved There are numerous ways to connect with CC. Learn more > Copyright infringement notifications If you have reason to believe that any material or activity on a site controlled or operated by Creative Commons (such as creativecommons.org or wiki.creativecommons.org is infringing of the right(s) owned by you or someone else, for whom you have authority to act, please follow our DMCA Notice & Takedown Procedure. Complaints about financial impropriety and other misconduct As a nonprofit entity, the integrity of CC’s financial information is paramount. We have adopted Codes of Conduct that prohibit financial impropriety and protect whistle blowers who bring such irregularities to our attention. Additionally, we take seriously other misconduct that may involve the violation of our policies including, but not limited to, harassment. If you are aware of any conduct prohibited by law or by our policies, you are encouraged to make a complaint, anonymously if you wish, to the members of the company’s Audit Committee. The email address for such complaints is audit@creativecommons.org which will forward your message automatically to the members of the Audit Committee. The Committee members are identified on our Board page. You may also submit a complaint by post or fax to the attention of the “Audit Committee” at our Mountain View address. Creative Commons is a Massachusetts-chartered 501(c)(3) tax-exempt charitable corporation. For more information, see the corporate charter, by-laws, most recent tax return, and most recent audited financial statement."
