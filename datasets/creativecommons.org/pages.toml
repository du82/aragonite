["https://creativecommons.org/category/about-cc/page/2"]
title = "About CC Archives - Page 2 of 101 - Creative Commons"
full_description = 'Anna Tumadóttir Appointed as CEO of Creative Commons by Creative Commons About CC CC staff photos are licensed under CC BY 4.0. Gratitude to Sara Jordan Photography. The Board of Directors of Creative Commons (CC) is pleased to announce the appointment of Anna Tumadóttir as the Chief Executive Officer (CEO) of CC. Creative Commons joins the Digital Public Goods Alliance by Cable Green, Creative Commons About CC Today, Creative Commons (CC) joins the Digital Public Goods Alliance (DPGA) as a new member. The DPGA is a multi-stakeholder initiative with a mission to accelerate the attainment of the sustainable development goals in low- and middle-income countries by facilitating the discovery, development, use of, and investment in digital public goods (DPGs). What Lies Ahead in 2024 by Anna Tumadóttir About CC "We Shine Together" by Ana Lopes, here, cropped, is licensed under CC BY-NC-SA 4.0. Greetings to the CC Community! A lot of exciting and critical work awaits us in 2024. While I steer Creative Commons as interim CEO, I wanted to take a moment to introduce myself and share details of our key priorities in the upcoming year. CC Open Education Platform Activities: 2023 in Review by Jennryn Wetzler, Werner Westermann, Tetiana Kolesnykova, Dan McGuire, Dr. Suma Parahakaran, Lisa Di Valentino, John Okewole, Fernando Daguanno About CC, Community, Open Education, Open Knowledge The CC Open Education community had a busy 2023! Five project teams, spanning nine countries, worked on open education projects ranging from developing STEAM, interactive, and climate change-related OER, to international curriculum alignment and translation work. Community members also worked on multimedia resources supporting the UNESCO Recommendation on OER, and presented in CC’s biannual Open… Thank You Catherine Stihler by Delia Browne About CC Today Creative Commons CEO Catherine Stihler is announcing the conclusion of her time leading the organization. On behalf of the Board of Directors, staff, and global community, we want to offer Catherine our sincere thanks. We are grateful to her for over three years of leadership at CC. During her tenure as CEO, Catherine demonstrated…'
