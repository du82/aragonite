["https://creativecommons.org/annual-reports"]
title = "Annual Reports - Creative Commons"
description = "We are pleased to present Creative Commons’ 2023 Annual Report.  This past year, our Open Culture program and Open Climate Campaign entered their third and second years, respectively. We also launched our Open Infrastructure Circle to ensure that our CC Licenses and public domain tools are funded well into the future. We are so grateful…"
full_description = "Annual Reports We are pleased to present Creative Commons’ 2023 Annual Report. This past year, our Open Culture program and Open Climate Campaign entered their third and second years, respectively. We also launched our Open Infrastructure Circle to ensure that our CC Licenses and public domain tools are funded well into the future. We are so grateful to the early supporters of this initiative. In 2023, we continued to connect virtually and in person with our Global Network via training, education, and events. We are thrilled to report that, as of this year, we have 1,705 graduates across 65 countries of our CC Certificate. We also hosted our first in-person CC Global Summit since 2019 in Mexico City, and brought together over 300 attendees from 45 countries. The theme was AI & the Commons, a timely issue relevant to CC’s work. Summit participants drafted community-driven principles on AI that will inform our strategy and approach moving forward. We invite you to learn more about CC’s work in 2023, and extend a huge thank you to the 30 foundations and companies, and over 2,700 individual donors that helped make this all possible. What lies ahead in 2024? Find out here. Past Creative Commons Annual Reports 2022 2021 2020 2019 2017 2016 2015 2013-2014"
