title = "Shanna Hollich - Creative Commons"
description = "As Learning and Training Manager, Shanna supports all of CC’s programs and projects by identifying and developing professional development and learning opportunities that are relevant to CC’s mission, including (but not limited to) the CC Certificates. Prior to joining CC, Shanna worked for 15 years as a librarian across multiple institutions – K-12 school, public,…"
full_description = "CC Learning and Training: 2024 Year in Review by Jennryn Wetzler, Shanna Hollich CC Certificate, Licenses & Tools People Walking on Brown Concrete Floor by Mehmet Turgut Kirkgoz . Public Domain. Creative Commons training efforts strengthen our mission to “empower individuals and communities around the world through technical, legal, and policy solutions that enable the sharing of education, culture, and science in the public interest.” In 2024, our Learning & Training team focused… CC Open Education: 2024 Year in Review by Cable Green, Jennryn Wetzler, Shanna Hollich Open Education Photo of Empty Classroom by Diana. Public Domain. The Open Education program at Creative Commons works to support CC’s mission through education, advocacy, and outreach on using open licenses and open licensing policies to maximize the benefits of open education (content, practices and policy). We work closely with governments, educational institutions and organizations to open… Meet the Recipients of the Fall 2024 CC Certificate Scholarship by Shanna Hollich CC Certificate, Licenses & Tools School by Thomas Hawk is licensed under CC BY-NC 2.0. The Creative Commons (CC) Certificate courses are widely considered an essential resource for open access education and for increasing capacity for individuals and institutions using the CC licenses to increase open access. The CC Certificate program offers in-depth courses about CC licenses, open practices, and… CC Certificate Alumni Making a Global Impact by Shanna Hollich CC Certificate, Open Education, Policy Launched in 2018, the Creative Commons Certificate program has trained and graduated nearly 1800 people from 66 countries. The Certificate program offers in-depth courses about CC licenses, open practices, and the ethos of the Commons. Our staff is constantly inspired by our community of Certificate alumni, accomplishing incredible things. In this interview, we were delighted… Learn More with Creative Commons: Recent Training Highlights by Jennryn Wetzler, Shanna Hollich CC Certificate, Open Education In this blog post, we share some highlights and recordings from recent trainings offered by the Creative Commons Learning and Training team."
