full_description = 'CC Launches its 2025-2028 Strategic Plan by Anna Tumadóttir, Creative Commons About CC Kaleidoscope 2 by Sheila Sund is licensed under CC BY 2.0. Kaleidoscope 2 by Sheila Sund is licensed under CC BY 2.0. For over 20 years, Creative Commons (CC) has provided self-serve solutions to address the limitations of copyright in a digital world. CC is a beloved symbol of sharing and knowledge freedom that resists a restrictive sharing and re-use environment and brings people together. Thanks… Welcoming Angela Oduor Lungati as CC Board Chair by Anna Tumadóttir, Creative Commons About CC "Yellow Chair, The High Line" by Shawn Hoke is licensed under CC BY-NC-ND 2.0. “Yellow Chair, The High Line” by Shawn Hoke is licensed under CC BY-NC-ND 2.0. Creative Commons (CC) has—and continues to be—fortunate to have an expert and passionate board of directors, many of whom have been instrumental to the success of CC at both the organizational level, as well as nationally and regionally. A healthy board… Open Movement’s Common(s) Causes by Creative Commons Community, Events “Open movement’s common(s) causes: Report from a Wikimania 2024 side event is licensed via CC BY 4.0. This report maps current threats and opportunities facing the open movement, based on the ongoing work of the organizations behind the Common(s) Cause event, which took place in Katowice, Poland, as a pre-conference event for Wikimania 2024 on August 6, 2024. The meeting was organized by Creative Commons, Open Knowledge Foundation, Open Future, and Wikimedia… CC Legal Tools Recognized as Digital Public Goods by Cable Green, Creative Commons About CC, Licenses & Tools, Sustaining the Commons “Power Grid” by Ram Joshi is licensed via CC BY-NC-ND 2.0. “Power Grid” by Ram Joshi is licensed via CC BY-NC-ND 2.0. We’re proud to announce Creative Commons’ Legal Tools have been reviewed and accepted into the Digital Public Goods Alliance (DPGA) DPG Registry. The DPGA is a multi-stakeholder initiative, endorsed by the United Nations Secretary-General, that is working to accelerate the attainment of the UN…'
