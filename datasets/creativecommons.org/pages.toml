title = "About CC Archives - Page 3 of 101 - Creative Commons"
full_description = 'CC’s #BetterSharing Collection | October: Better Sharing, Better Future by Corrine Murray About CC, Open Creativity “Better Sharing, Better Future” by Maria Picassó i Piquer for Creative Commons & Fine Acts, here cropped, is licensed under CC BY-SA 4.0. For September, we’re excited to showcase “Better Sharing, Better Future” by Spanish illustrator, Maria Picassó i Piquer as part of our #20CC anniversary #BetterSharing collection of illustrations. Francisco “Tito” Rivas to Keynote CC Global Summit 2023 by Creative Commons Events, Open Creativity, Open Heritage A headshot of Francisco J. Rivas Mesa used by permission from the Ministry of Culture of Mexico, here cropped, next to Somos El Bien Común" by Eréndira Derbez for Creative Commons, here cropped, licensed via CC BY 4.0. We are deeply honored to announce that the 2023 Summit’s opening keynote will be from Mexican sound artist, musician, researcher, and cultural leader Francisco J. Rivas Mesa, also known by his stage name Tito Rivas. Francisco “Tito” Rivas Será un Orador Principal en la Cumbre Mundial CC 2023 by Creative Commons Events, Open Creativity, Open Heritage A headshot of Francisco J. Rivas Mesa used by permission from the Ministry of Culture of Mexico, here cropped, next to Somos El Bien Común" by Eréndira Derbez for Creative Commons, here cropped, licensed via CC BY 4.0. Nos sentimos profundamente honrados de anunciar que el discurso de apertura de la Cumbre CC 2023 estará a cargo del artista sonoro, músico, investigador, y gestor cultural mexicano Francisco J. Rivas Mesa, también conocido por su nombre artístico Tito Rivas. Explore the 2023 CC Global Summit Program by Creative Commons Events “Somos El Bien Común” by Eréndira Derbez, here cropped, is licensed via CC BY 4.0. The CC Global Summit is now just one week away! As we make the final preparations for this first opportunity to gather in person at a Summit in several years, we are excited to unveil the program that will take place 3–6 October in Mexico City.'
