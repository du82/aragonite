title = "Technology Archives - Creative Commons"
full_description = "Six Insights on Preference Signals for AI Training by Rebecca Ross Events, Licenses & Tools, Policy, Technology “Eagle Traffic Signals - 1970s” by RS 1990 is licensed via CC BY-NC-SA 2.0.. “Eagle Traffic Signals – 1970s” by RS 1990 is licensed via CC BY-NC-SA 2.0.. At the intersection of rapid advancements in generative AI and our ongoing strategy refresh, we’ve been deeply engaged in researching, analyzing, and fostering conversations about AI and value alignment. Our goal is to ensure that our legal and technical infrastructure remains… CC Responds to the United States Copyright Office Notice of Inquiry on Copyright and Artificial Intelligence by Creative Commons Better Internet, Copyright, Licenses & Tools, Technology Detail from “AI Outputs” by CC0. In August, the United States Copyright Office issued a Notice of Inquiry seeking public responses to 34 questions (and several sub-questions) about the intersection of copyright law and artificial intelligence. The comment period closed on 30 October with over 10,000 individuals and organizations responding, representing a broad spectrum of interests on how copyright should apply in relation to generative AI. CC joined in the conversation to provide our own thoughts on copyright and AI to the copyright office. Announcing CC’s Open Infrastructure Circle by Creative Commons Licenses & Tools, Sustaining the Commons, Technology CC Licenses make it possible to share content legally and openly. Over the past 20 years, they have unlocked approximately 3 billion articles, books, research, artwork, and music. CC’s Legal Tools are a free and reliable public good. Yet most people are unaware that their infrastructure and stewardship takes a lot of money and work to maintain. That’s why we’re launching the Open Infrastructure Circle (OIC) — an initiative to obtain annual or multi-year support from foundations, corporations, and individuals for Creative Commons’ core operations and license infrastructure."
