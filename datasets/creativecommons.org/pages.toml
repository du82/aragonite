["https://creativecommons.org/person/cable-green"]
title = "Cable Green - Creative Commons"
description = "Dr. Cable Green works with open education, science and research communities to leverage open licensing, content, practices and policies to expand equitable access and contributions to open education."
full_description = "Why Digital Public Goods, including AI, Should Depend on Open Data by Cable Green, Creative Commons Policy Acknowledging that some data should not be shared (for moral, ethical and/or privacy reasons) and some cannot be shared (for legal or other reasons), Creative Commons (CC) thinks there is value in incentivizing the creation, sharing, and use of open data to advance knowledge production. As open communities continue to imagine, design, and build digital… CC Open Education: 2024 Year in Review by Cable Green, Jennryn Wetzler, Shanna Hollich Open Education Photo of Empty Classroom by Diana. Public Domain. The Open Education program at Creative Commons works to support CC’s mission through education, advocacy, and outreach on using open licenses and open licensing policies to maximize the benefits of open education (content, practices and policy). We work closely with governments, educational institutions and organizations to open… CC Legal Tools Recognized as Digital Public Goods by Cable Green, Creative Commons About CC, Licenses & Tools, Sustaining the Commons “Power Grid” by Ram Joshi is licensed via CC BY-NC-ND 2.0. We’re proud to announce Creative Commons’ Legal Tools have been reviewed and accepted into the Digital Public Goods Alliance (DPGA) DPG Registry. The DPGA is a multi-stakeholder initiative, endorsed by the United Nations Secretary-General, that is working to accelerate the attainment of the UN… Creative Commons joins the Digital Public Goods Alliance by Cable Green, Creative Commons About CC Today, Creative Commons (CC) joins the Digital Public Goods Alliance (DPGA) as a new member. The DPGA is a multi-stakeholder initiative with a mission to accelerate the attainment of the sustainable development goals in low- and middle-income countries by facilitating the discovery, development, use of, and investment in digital public goods (DPGs). Recommended Best Practices for Better Sharing of Climate Data by Taylor Campbell, Wanying Li, Cable Green Open Data At Creative Commons, we believe that addressing global challenges like the climate crisis requires opening the knowledge about those challenges. We are thrilled to announce the release of our “Recommendations for Better Sharing of Climate Data”— the culmination of a nine-month research initiative from our Open Climate Data project. These guidelines are a result of…"
