["https://creativecommons.org/category/about-cc/events"]
title = "Events Archives - Creative Commons"
full_description = "Open Movement’s Common(s) Causes by Creative Commons Community, Events “Open movement’s common(s) causes: Report from a Wikimania 2024 side event is licensed via CC BY 4.0. This report maps current threats and opportunities facing the open movement, based on the ongoing work of the organizations behind the Common(s) Cause event, which took place in Katowice, Poland, as a pre-conference event for Wikimania 2024 on August 6, 2024. The meeting was organized by Creative Commons, Open Knowledge Foundation, Open Future, and Wikimedia… Six Insights on Preference Signals for AI Training by Rebecca Ross Events, Licenses & Tools, Policy, Technology “Eagle Traffic Signals - 1970s” by RS 1990 is licensed via CC BY-NC-SA 2.0.. “Eagle Traffic Signals – 1970s” by RS 1990 is licensed via CC BY-NC-SA 2.0.. At the intersection of rapid advancements in generative AI and our ongoing strategy refresh, we’ve been deeply engaged in researching, analyzing, and fostering conversations about AI and value alignment. Our goal is to ensure that our legal and technical infrastructure remains… More California Community Colleges Get CC Certified! by Shanna Hollich, Jennryn Wetzler CC Certificate, Events, Open Education This December, Creative Commons led a CC Certificate Bootcamp, or condensed Certificate training, for faculty and staff from 16 different California Community Colleges implementing Zero Textbook Cost (ZTC) degree programs. This marked the second CC Bootcamp for California Community Colleges after the California legislature invested $115 million to expand ZTC degrees and the use of… CC Global Summit 2023: Reflections by Catherine Stihler CC Global Network, Events “Somos El Bien Común” by Eréndira Derbez, here cropped, is licensed via CC BY 4.0. CC has long been at the forefront of enabling innovation and promoting access to knowledge and creativity. The Creative Commons 2023 Summit brought together creators, academics, technologists, and policymakers from around the world to discuss the future of open culture and how CC can continue to drive positive change. This blog post reflects on the key challenges of the summit and shares the insightful learnings that emerged from these discussions."
