description = "Jocelyn manages projects and programs related to the CC Global Community & License Stewardship. Prior to this role, she worked for over a year as CC’s Open Culture Manager. Before CC, Jocelyn worked at The New York Public Library for over five years, first as a Special Projects Manager in the President’s Office, and later…"
full_description = "CC Is Refreshing Its Strategy. Here’s Why Your Voice Matters. by Creative Commons, Jocelyn Miyara, Rebecca Ross About CC Image by Mario Jr. Nicorelli is licensed via CC BY-NC 2.0 Over the past weeks, the CC board and team have been working behind the scenes on our strategy refresh. We are excited to share our progress as we enter the community engagement phase of the refresh and explain how you can contribute to the process.… Recap & Recording: “Open Culture in the Age of AI: Concerns, Hopes and Opportunities” by Brigitte Vézina, Connor Benedict, Jocelyn Miyara Open Culture, Open Heritage In May, CC’s Open Culture Program hosted a new webinar in our Open Culture Live series titled “Open Culture in the Age of AI: Concerns, Hopes and Opportunities.” In this blog post we share key takeaways and a link to the recording. Open Culture Platform Activity Fund Winners 2024 by Brigitte Vézina, Jocelyn Miyara Open Culture As part of the Open Culture Platform’s 2024 work plan, we at Creative Commons are offering funding for community activities. We called for proposals and invited the community to vote on the activities. The projects needed to have a focus on building community through outreach and helping institutions move toward open. Here are the four… Webinar: Open Culture in the Age of AI: Concerns, Hopes and Opportunities by Brigitte Vézina, Jocelyn Miyara, Connor Benedict Open Culture On Wednesday, 8 May 2024, at 2:00 pm UTC, CC’s Open Culture Program will be hosting a new webinar in our Open Culture Live series titled “Open Culture in the Age of AI: Concerns, Hopes and Opportunities.” Recap & Recording: Maximizing the Value(s) of Open Access in Cultural Heritage Institutions by Brigitte Vézina, Jocelyn Miyara, Connor Benedict Uncategorized In February, we hosted a webinar in our Open Culture Live series titled “Maximizing the Value(s) of Open Access in Cultural Heritage Institutions.” In this blog post, we summarize the key points raised in the discussion and share a link to the recording."
