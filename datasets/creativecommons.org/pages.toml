["https://creativecommons.org/about/training-and-consulting"]
title = "Training & Consulting - Creative Commons"
description = "Whether you have particular training needs for your institution or consortia, need customized support, or simply want to learn about CC licensing, Creative Commons is here to serve you. We offer a variety of trainings, including regular CC Certificate courses, office hours with our legal team, as well as customized consulting and facilitation. Contact us…"
full_description = "Training & Consulting What We Do Legal Open Culture Open Culture Resources Advocacy Open Education Open Science Open Preprints Open Climate Copyright Policy Software: Free and Open-Source Code Training & Consulting Whether you have particular training needs for your institution or consortia, need customized support, or simply want to learn about CC licensing, Creative Commons is here to serve you. We offer a variety of trainings, including regular CC Certificate courses, office hours with our legal team, as well as customized consulting and facilitation. Contact us via our online form! Or learn more about our training and consulting offerings. Creative Commons believes that if we are to solve our shared global challenges, the knowledge and culture about these challenges must be open. We help institutions develop and implement open policies, work toward greater open practices, build capacity in open licensing, and connect with the open advocates to promote open governance, open science, open education, open access, and open culture. CC has provided consulting, facilitation, training and support to education institutions, corporations, governments, museums, foundations, libraries, NGOs and INGOs. We welcome collaboration with any institutions seeking to expand access to knowledge and culture. “Ideate and prototype” by ME from Noun Project is licensed via CC BY 3.0."
