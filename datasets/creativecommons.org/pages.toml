title = "Events Archives - Creative Commons"
full_description = 'The AI Action Summit & Civil Society’s (Possible) Impact by Anna Tumadóttir Events, Sustaining the Commons The Conciergerie, Paris by Mustang Joe is marked with CC0 1.0. The Conciergerie, Paris by Mustang Joe is marked with CC0 1.0 On February 10 and 11, 2025, the government of France convened the AI Action Summit, bringing together heads of state, tech leaders, and civil society to discuss global collaboration and action on AI. The event was co-chaired by French President Macron and Indian Prime Minister… Open Movement’s Common(s) Causes by Creative Commons Community, Events “Open movement’s common(s) causes: Report from a Wikimania 2024 side event is licensed via CC BY 4.0. This report maps current threats and opportunities facing the open movement, based on the ongoing work of the organizations behind the Common(s) Cause event, which took place in Katowice, Poland, as a pre-conference event for Wikimania 2024 on August 6, 2024. The meeting was organized by Creative Commons, Open Knowledge Foundation, Open Future, and Wikimedia… Six Insights on Preference Signals for AI Training by Rebecca Ross Events, Licenses & Tools, Policy, Technology “Eagle Traffic Signals - 1970s” by RS 1990 is licensed via CC BY-NC-SA 2.0.. “Eagle Traffic Signals – 1970s” by RS 1990 is licensed via CC BY-NC-SA 2.0.. At the intersection of rapid advancements in generative AI and our ongoing strategy refresh, we’ve been deeply engaged in researching, analyzing, and fostering conversations about AI and value alignment. Our goal is to ensure that our legal and technical infrastructure remains… More California Community Colleges Get CC Certified! by Shanna Hollich, Jennryn Wetzler CC Certificate, Events, Open Education This December, Creative Commons led a CC Certificate Bootcamp, or condensed Certificate training, for faculty and staff from 16 different California Community Colleges implementing Zero Textbook Cost (ZTC) degree programs. This marked the second CC Bootcamp for California Community Colleges after the California legislature invested $115 million to expand ZTC degrees and the use of… CC Global Summit 2023: Reflections by Catherine Stihler CC Global Network, Events “Somos El Bien Común” by Eréndira Derbez, here cropped, is licensed via CC BY 4.0. CC has long been at the forefront of enabling innovation and promoting access to knowledge and creativity. The Creative Commons 2023 Summit brought together creators, academics, technologists, and policymakers from around the world to discuss the future of open culture and how CC can continue to drive positive change. This blog post reflects on the key challenges of the summit and shares the insightful learnings that emerged from these discussions. Making AI Work for Creators and the Commons by Creative Commons Better Internet, Community, Events, Licenses & Tools, Open Culture, Open Knowledge, Technology "CC Global Summit 2023 Day 0" by Creative Commons is licensed CC BY 4.0. On the eve of the CC Global Summit, members of the CC global community and Creative Commons held a one-day workshop to discuss issues related to AI, creators, and the commons. Emerging from that deep discussion and in subsequent conversation during the three days of the Summit, this group identified a set of common issues and values. Francisco “Tito” Rivas to Keynote CC Global Summit 2023 by Creative Commons Events, Open Creativity, Open Heritage A headshot of Francisco J. Rivas Mesa used by permission from the Ministry of Culture of Mexico, here cropped, next to Somos El Bien Común" by Eréndira Derbez for Creative Commons, here cropped, licensed via CC BY 4.0. We are deeply honored to announce that the 2023 Summit’s opening keynote will be from Mexican sound artist, musician, researcher, and cultural leader Francisco J. Rivas Mesa, also known by his stage name Tito Rivas. Francisco “Tito” Rivas Será un Orador Principal en la Cumbre Mundial CC 2023 by Creative Commons Events, Open Creativity, Open Heritage A headshot of Francisco J. Rivas Mesa used by permission from the Ministry of Culture of Mexico, here cropped, next to Somos El Bien Común" by Eréndira Derbez for Creative Commons, here cropped, licensed via CC BY 4.0. Nos sentimos profundamente honrados de anunciar que el discurso de apertura de la Cumbre CC 2023 estará a cargo del artista sonoro, músico, investigador, y gestor cultural mexicano Francisco J. Rivas Mesa, también conocido por su nombre artístico Tito Rivas. Explore the 2023 CC Global Summit Program by Creative Commons Events “Somos El Bien Común” by Eréndira Derbez, here cropped, is licensed via CC BY 4.0. The CC Global Summit is now just one week away! As we make the final preparations for this first opportunity to gather in person at a Summit in several years, we are excited to unveil the program that will take place 3–6 October in Mexico City. Explorar el Programa de la Cumbre Mundial CC 2023 by Creative Commons Events “Somos El Bien Común” by Eréndira Derbez, here cropped, is licensed via CC BY 4.0. [read this post in English >] “Somos El Bien Común” by Eréndira Derbez is licensed via CC BY 4.0. ¡Falta solo una semana para la Cumbre Mundial CC! Mientras hacemos los preparativos finales para esta primera oportunidad de reunirnos en persona en una Cumbre en varios años, estamos entusiasmados de presentar el programa que se…'
