full_description = 'Open Movement’s Common(s) Causes by Creative Commons Community, Events “Open movement’s common(s) causes: Report from a Wikimania 2024 side event is licensed via CC BY 4.0. This report maps current threats and opportunities facing the open movement, based on the ongoing work of the organizations behind the Common(s) Cause event, which took place in Katowice, Poland, as a pre-conference event for Wikimania 2024 on August 6, 2024. The meeting was organized by Creative Commons, Open Knowledge Foundation, Open Future, and Wikimedia… The CC Open Education Platform Funds Five New Community Projects by Jennryn Wetzler Community, Open Education “Together We Can Move Mountains” by Steve McCarthy for Fine Acts x OBI is licensed via https://creativecommons.org/licenses/by-nc-sa/4.0/. Thanks to the CC Open Education Platform community’s time proposing projects and voting on the proposals, we now have five winning ideas to advance open education globally. CC will fund five projects in 2024, spanning Brazil, Ghana, Nepal, and Nigeria. The CC Open Education Platform is also funding ongoing global community work supporting the UNESCO… Join the Creative Commons Board of Directors by Creative Commons About CC, Community “Community Needs Care” by Camila Leão for Fine Acts x OBI is licensed via https://creativecommons.org/licenses/by-nc-sa/4.0/. We are now welcoming nominations to the CC Board of Directors. Each year, we seek nominations from the Creative Commons community for thoughtful and talented individuals invested in the future of the organization. The CC Board of Directors guides the strategic direction of Creative Commons, provides valuable expertise in key programmatic areas, and champions the… CC Open Education Platform Activities: 2023 in Review by Jennryn Wetzler, Werner Westermann, Tetiana Kolesnykova, Dan McGuire, Dr. Suma Parahakaran, Lisa Di Valentino, John Okewole, Fernando Daguanno About CC, Community, Open Education, Open Knowledge The CC Open Education community had a busy 2023! Five project teams, spanning nine countries, worked on open education projects ranging from developing STEAM, interactive, and climate change-related OER, to international curriculum alignment and translation work. Community members also worked on multimedia resources supporting the UNESCO Recommendation on OER, and presented in CC’s biannual Open… CC Certificate Translations in Slovak, Bengali, and localized French by Jennryn Wetzler, Shanna Hollich CC Certificate, Community, Open Education, Uncategorized Side by Side, by Anina Takeff, licensed Creative Commons-Attribution-NonCommercial-ShareAlike 4.0 International (CC-BY-NC-SA) As we end 2023, we want to showcase the incredible work of CC community members to translate the CC Certificate content. Thanks to 21 volunteers this year and numerous volunteers in the past, the reading content of our CC Certificate training is now… CC Global Summit 2023: Reflections by Catherine Stihler CC Global Network, Events “Somos El Bien Común” by Eréndira Derbez, here cropped, is licensed via CC BY 4.0. CC has long been at the forefront of enabling innovation and promoting access to knowledge and creativity. The Creative Commons 2023 Summit brought together creators, academics, technologists, and policymakers from around the world to discuss the future of open culture and how CC can continue to drive positive change. This blog post reflects on the key challenges of the summit and shares the insightful learnings that emerged from these discussions. Making AI Work for Creators and the Commons by Creative Commons Better Internet, Community, Events, Licenses & Tools, Open Culture, Open Knowledge, Technology "CC Global Summit 2023 Day 0" by Creative Commons is licensed CC BY 4.0. On the eve of the CC Global Summit, members of the CC global community and Creative Commons held a one-day workshop to discuss issues related to AI, creators, and the commons. Emerging from that deep discussion and in subsequent conversation during the three days of the Summit, this group identified a set of common issues and values. Marina Núñez Bespalova Será una Oradora Principal en la Cumbre Mundial CC 2023 by Creative Commons Community, Events, Open Culture A headshot of Marina Núñez Bespalova used by permission from the Ministry of Culture of Mexico next to Somos El Bien Común" by Eréndira Derbez for Creative Commons, here cropped, licensed via CC BY 4.0. [read this post in English >] Tenemos un grupo increíble de personas preparadas para ser oradores principales en la Cumbre Global 2023, que se llevará a cabo del 3 al 6 de octubre en la Ciudad de México. En nuestros primeros anuncios, dimos la bienvenida a la escritora Anya Kamenetz y al líder de medios… Marina Núñez Bespalova to Keynote CC Global Summit 2023 by Creative Commons Community, Events, Open Culture A headshot of Marina Núñez Bespalova used by permission from the Ministry of Culture of Mexico next to Somos El Bien Común" by Eréndira Derbez for Creative Commons, here cropped, licensed via CC BY 4.0. [lee esta entrada en español >] We have an incredible group of people lined up to be keynote speakers at the 2023 CC Global Summit, to be held 3–6 October in Mexico City. In our first announcements, we welcomed writer Anya Kamenetz and Māori media leader Peter-Lucas Jones. We are now deeply honored to announce… CC Community Input: Better Sharing for Generative AI by Nate Angell Better Internet, CC Global Network, Licenses & Tools, Open Creativity, Technology “Input” by jputman, here slightly cropped, is licensed via CC BY-SA 2.0. Over the last year, innovation and use of generative artificial intelligence (AI) has proliferated, providing new ways for people to create content from art to zines, and everything in between. At CC, we’ve been watching these experiments in creativity while considering what it all means for what we call better sharing: sharing that is contextual,…'
