full_description = "CC Launches its 2025-2028 Strategic Plan by Anna Tumadóttir, Creative Commons About CC Kaleidoscope 2 by Sheila Sund is licensed under CC BY 2.0. For over 20 years, Creative Commons (CC) has provided self-serve solutions to address the limitations of copyright in a digital world. CC is a beloved symbol of sharing and knowledge freedom that resists a restrictive sharing and re-use environment and brings people together. Thanks… Welcoming Angela Oduor Lungati as CC Board Chair by Anna Tumadóttir, Creative Commons About CC “Yellow Chair, The High Line” by Shawn Hoke is licensed under CC BY-NC-ND 2.0. Creative Commons (CC) has—and continues to be—fortunate to have an expert and passionate board of directors, many of whom have been instrumental to the success of CC at both the organizational level, as well as nationally and regionally. A healthy board… CC Welcomes Sarah Pearson Back as General Counsel by Anna Tumadóttir About CC As part of CC’s renewed commitment to investing in the core open infrastructure it stewards, we are excited to announce several updates to our legal team. Sarah Hinchliff Pearson is returning to Creative Commons as General Counsel. She will manage in-house legal work and play a leading role in shaping CC’s stewardship program and its… Questions for Consideration on AI & the Commons by Anna Tumadóttir About CC, Licenses & Tools, Policy “Eight eyes. Engraving after C. Le Brun” by Charles Le Brun is licensed via CC0. The intersection of AI, copyright, creativity, and the commons has been a focal point of conversations within our community for the past couple of years. We’ve hosted intimate roundtables, organized workshops at conferences, and run public events, digging into the… Time for a Refresh by Anna Tumadóttir About CC The CC team has been evaluating our progress toward our 2021-2025 strategy. Through that process, we have noticed the ways we have been organically adjusting to the social and technical shifts around us, as well as the ebbs and flows of funding availability. It would be an understatement to say that much has changed since…"
