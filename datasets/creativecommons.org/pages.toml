title = "Policy Archives - Creative Commons"
full_description = "Why Digital Public Goods, including AI, Should Depend on Open Data by Cable Green, Creative Commons Policy Open Data by Auregann is licensed under CC BY-SA 3.0. Acknowledging that some data should not be shared (for moral, ethical and/or privacy reasons) and some cannot be shared (for legal or other reasons), Creative Commons (CC) thinks there is value in incentivizing the creation, sharing, and use of open data to advance knowledge production. As open communities continue to imagine, design, and build digital… Six Insights on Preference Signals for AI Training by Rebecca Ross Events, Licenses & Tools, Policy, Technology “Eagle Traffic Signals - 1970s” by RS 1990 is licensed via CC BY-NC-SA 2.0.. “Eagle Traffic Signals – 1970s” by RS 1990 is licensed via CC BY-NC-SA 2.0.. At the intersection of rapid advancements in generative AI and our ongoing strategy refresh, we’ve been deeply engaged in researching, analyzing, and fostering conversations about AI and value alignment. Our goal is to ensure that our legal and technical infrastructure remains… CC Certificate Alumni Making a Global Impact by Shanna Hollich CC Certificate, Open Education, Policy “Farmer Melese Tsegaye blows to clean and select wheat seed in his field, Kingbird variety wheat from Kulumsa Research Station” by International Maize and Wheat Improvement Center is licensed via CC BY-NC-SA 2.0. Launched in 2018, the Creative Commons Certificate program has trained and graduated nearly 1800 people from 66 countries. The Certificate program offers in-depth courses about CC licenses, open practices, and the ethos of the Commons. Our staff is constantly inspired by our community of Certificate alumni, accomplishing incredible things. In this interview, we were delighted… Questions for Consideration on AI & the Commons by Anna Tumadóttir About CC, Licenses & Tools, Policy “Eight eyes. Engraving after C. Le Brun” by Charles Le Brun is licensed via CC0. “Eight eyes. Engraving after C. Le Brun”