["https://creativecommons.org/support-cc/other-ways-to-give"]
title = "Donor FAQ - Creative Commons"
description = "How do I make a donation to Creative Commons? We offer many ways to donate. We invite you to use our secure and encrypted online donation form hosted by Classy. Classy supports payments by credit card, ACH, digital wallets, and cryptocurrency, including Apple Pay, Microsoft Pay, Google Pay, PayPal, Venmo, and Coinbase. You can also make…"
full_description = "Donor FAQ Support Us Open Infrastructure Circle Supporters Donor FAQ CC Contributions Policy CC Guidelines for Screening Donors US State Nonprofit Disclosures Bassel Khartabil Fellowships & Memorial Fund How do I make a donation to Creative Commons? We offer many ways to donate. We invite you to use our secure and encrypted online donation form hosted by Classy. Classy supports payments by credit card, ACH, digital wallets, and cryptocurrency, including Apple Pay, Microsoft Pay, Google Pay, PayPal, Venmo, and Coinbase. You can also make a donation via check. Please make your check payable to “Creative Commons,” and mail to our address below: Creative Commons PO Box 741107 Los Angeles CA 90074-1107 I’d like to become a monthly donor. How do I do this? Visit our secure and encrypted online donation page hosted by Classy to set up a monthly contribution. Classy Pay supports payments by credit card, ACH, digital wallets, and cryptocurrency, including Apple Pay, Microsoft Pay, Google Pay, PayPal, Venmo, and Coinbase. I’m already a monthly donor. How can I adjust, update or cancel my donation? You can manage your recurring donation on our fundraising platform, Classy. Click here for detailed information on how to edit or cancel your monthly donation. Are donations tax-deductible? Creative Commons Corporation is a 501(c)3 tax-exempt organization and your donation is tax-deductible within the guidelines of U.S. law. To claim a donation as a deduction on your U.S. taxes, please keep your email donation receipt as your official record. We’ll always send it your way upon successful completion of your donation. What is your federal employment identification number? Our federal employment identification number (FEIN) is 04-3585301. Do you accept donations through PayPal? Yes, we do! You can make a donation to Creative Commons through PayPal here. I would like to make a wire transfer donation to Creative Commons. How do I do this? If you would like to make a gift via wire transfer, please contact development@creativecommons.org. I’d like to add Creative Commons to my will. How do I do this? Creative Commons does not currently have a planned giving program. If you would like to make a lasting impact by including us in your will, we suggest you visit FreeWill or consult an attorney or estate planning professional. You can also check out this useful resource from Fidelity Charitable on bequests and how to include nonprofits in your will or trust. Do you accept gifts via stocks or securities? Yes, we do. To make a gift via stock or securities, please contact development@creativecommons.org for account information. Do you accept employer matching donations? Yes, we do. Matching gifts are a great way to double your impact. We encourage you to check in with your employer about the matching programs available at your company. If you do move forward with an employer match, please let us know at development@creativecommons.org. Do you accept cryptocurrency? Yes. We currently accept donations of cryptocurrency on Classy (via Coinbase), Every and Endaoment. I’ve heard you sell Creative Commons merchandise. Where can I buy some? Yes, we offer Creative Commons merchandise! Check out our store for CC-branded merch. Are there other ways to support CC besides donating money? There are many ways to get involved with Creative Commons. We encourage you to sign up for our newsletter, check out our blog and visit our Twitter, Facebook, Instagram, Mastodon, and LinkedIn pages. We always appreciate our supporters who spread the word about our work! Other questions? If you have any other donation related questions, please don’t hesitate to reach to development@creativecommons.org."
