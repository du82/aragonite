["https://creativecommons.org/tag/policy"]
title = "policy Archives - Creative Commons"
full_description = 'Why Digital Public Goods, including AI, Should Depend on Open Data by Cable Green, Creative Commons Policy Open Data by Auregann is licensed under CC BY-SA 3.0. Acknowledging that some data should not be shared (for moral, ethical and/or privacy reasons) and some cannot be shared (for legal or other reasons), Creative Commons (CC) thinks there is value in incentivizing the creation, sharing, and use of open data to advance knowledge production. As open communities continue to imagine, design, and build digital… An Invitation for Creators, Activists, and Stewards of the Open Movement by Shannon Hong, Creative Commons Licenses & Tools, Policy “AI Alignment Assembly” by Jakub Koźniewski for the Open Future Foundation is licensed under CC BY 4.0. Dear Open Movement Creators, Activists, and Stewards, A key question facing Creative Commons as an organization, and the open movement in general, is how we will respond to the challenge of shaping artificial intelligence (AI) towards the public interest, growing and sustaining a thriving commons of shared knowledge and culture. So much of generative AI… What does the CC Community Think about Regulating Generative AI? by Shannon Hong, Timid Robot Zehta, Nate Angell, Kat Walsh Policy Somos El Bien Común" by Eréndira Derbez for Creative Commons, here cropped, licensed via CC BY 4.0. In the past year, Creative Commons, alongside other members of the Movement for a Better Internet, hosted workshops and sessions at community conferences like MozFest, RightsCon, and Wikimania, to hear from attendees regarding their views on artificial intelligence (AI). In these sessions, community members raised concerns about how AI is utilizing CC-licensed content, and discussions… CC’s Key Insights from WIPO’s Meeting on Copyright by Brigitte Vézina, Catherine Stihler Copyright, Open Heritage “WIPO SSCR Screenshot” by Creative Commons is licensed via CC BY 4.0. From 6 to 8 November 2023, Creative Commons participated remotely in the 44th session of the World Intellectual Property Organization Standing Committee on Copyright and Related Rights. In this blog post, we look back on the session’s highlights on broadcasting, exceptions and limitations, and generative AI, from CC’s perspective.'
