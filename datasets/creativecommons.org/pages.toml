ucation community had a busy 2023! Five project teams, spanning nine countries, worked on open education projects ranging from developing STEAM, interactive, and climate change-related OER, to international curriculum alignment and translation work. Community members also worked on multimedia resources supporting the UNESCO Recommendation on OER, and presented in CC’s biannual Open…"
