title = "Share your work - Creative Commons"
description = "Use Creative Commons tools to help share your work. Our free, easy-to-use copyright licenses provide a simple, standardized way to give your permission to share and use your creative work — on conditions of your choice. You can adopt one of our licenses by sharing on a platform, sharing your work with an open license,…"
full_description = "Share your work Licenses and Tools About CC Licenses Use & remix FAQ Technology Platforms Made with Creative Commons Made with CC Community Search the Commons Use Creative Commons tools to help share your work. Our free, easy-to-use copyright licenses provide a simple, standardized way to give your permission to share and use your creative work — on conditions of your choice. You can adopt one of our licenses by sharing on a platform, sharing your work with an open license, or dedicating your work to the public domain. Choose a license Our chooser helps you determine which Creative Commons License is right for you in a few easy steps. If you are new to Creative Commons, you may also want to read licensing considerations before you get started with the chooser > Share your work on a CC platform Over 2.5 billion CC-licensed works exist across millions of websites. The majority are hosted on content platforms that provide CC license options for their users. CC platforms make it easy for users to discover and collaborate on images, video, music, research and educational texts. This page highlights some of the best known platforms for sharing CC content. Content on these platforms is searchable and shareable across the web thanks to CC licenses. Learn more about enabling CC on platforms > What our licenses do Our licenses enable collaboration, growth, and generosity in a variety of media."
