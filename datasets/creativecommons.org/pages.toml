full_description = "Celebrating Two Years of CC’s Open Culture Voices by Brigitte Vézina, Connor Benedict, Jocelyn Miyara Open Culture Today we conclude the Open Culture Voices series, which over two years has showcased more than 65 open culture experts and practitioners from around the world. Over these two years we have had the privilege of engaging with remarkable individuals, each bringing their unique insights and stories to our community. Thank you! Dave Hansen — Open Culture VOICES, Season 2 Episode 33 by Brigitte Vézina, Connor Benedict Open Culture Dave talks about how many “institutions are on a mission to expose their collections to the world and make them available for everyone.” Dave sees this as a major evolution from a time not too long ago when it was only those with means who could access collections in any way. Open Culture VOICES is… Kyle K. Courtney — Open Culture VOICES, Season 2 Episode 32 by Brigitte Vézina, Connor Benedict Open Culture Kyle believes that “the artistic and creative expressions of humanity is the best way to experience our human efforts” and open GLAM makes this a reality for much more than what you can see on a given day in a museum. Open GLAM also helps drive more digitization of collections around the world in an… Maarten Zeinstra — Open Culture VOICES, Season 2 Episode 31 by Brigitte Vézina, Connor Benedict Open Culture Maarten believes that “Open GLAM is a necessity of a disbalanced copyright framework.” Maarten talks about how open access policies help institutions achieve their public missions. Open access policies in instutions provides good evidence that society and communities need access to cultural heritage to flourish. Open Culture VOICES is a series of short videos… Marike van Roon — Open Culture VOICES, Season 2 Episode 30 by Brigitte Vézina, Connor Benedict Open Culture Marike van Roon shares that “the main benefit of open culture is accessibility” because if you are not fortunate enough to be part of organization that pays for you to have access to collections and you don’t live in city with public collections it’s almost impossible to access a lot of cultural heritage. In this…"
