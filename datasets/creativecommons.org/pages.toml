title = "Sustaining the Commons Archives - Creative Commons"
full_description = "CC Legal Tools Recognized as Digital Public Goods by Cable Green, Creative Commons About CC, Licenses & Tools, Sustaining the Commons “Power Grid” by Ram Joshi is licensed via CC BY-NC-ND 2.0. “Power Grid” by Ram Joshi is licensed via CC BY-NC-ND 2.0. We’re proud to announce Creative Commons’ Legal Tools have been reviewed and accepted into the Digital Public Goods Alliance (DPGA) DPG Registry. The DPGA is a multi-stakeholder initiative, endorsed by the United Nations Secretary-General, that is working to accelerate the attainment of the UN… Announcing CC’s Open Infrastructure Circle by Creative Commons Licenses & Tools, Sustaining the Commons, Technology CC Licenses make it possible to share content legally and openly. Over the past 20 years, they have unlocked approximately 3 billion articles, books, research, artwork, and music. CC’s Legal Tools are a free and reliable public good. Yet most people are unaware that their infrastructure and stewardship takes a lot of money and work to maintain. That’s why we’re launching the Open Infrastructure Circle (OIC) — an initiative to obtain annual or multi-year support from foundations, corporations, and individuals for Creative Commons’ core operations and license infrastructure. Chan Zuckerberg Initiative Funds New Project to Openly License Life Sciences Preprints by Creative Commons Open Access, Open Data, Open Science, Sustaining the Commons CZI brand marks used by permission from the Chan Zuckerberg Initiative. Creative Commons is excited to announce new programmatic support from the Chan Zuckerberg Initiative to help make openly licensed preprints the primary vehicle of scientific dissemination. Announcing Our 20th Anniversary “Better Sharing” Campaign by Catherine Stihler Sustaining the Commons Creative Commons is turning 20! We are delighted to be celebrating this milestone with our global community, honoring our commitment as a nonprofit to creating a world where everyone has access to knowledge and creativity. As we considered CC’s goals for the next 20 years, we kept returning to a simple idea: Better Sharing for…"
