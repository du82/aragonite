["https://creativecommons.org/person/brigittevezina"]
title = "Brigitte Vézina - Creative Commons"
description = "Brigitte is passionate about all things spanning culture, arts, handicraft, traditions, fashion and, of course, copyright law and policy.  She gets a kick out of tackling the fuzzy legal and policy issues that stand in the way of access, use, re-use and remix of culture, information and knowledge. Before joining CC, she worked for a decade as…"
full_description = "CC Open Culture: 2024 Year in Review by Brigitte Vézina Open Culture, Open Heritage Interesting Story by Laura Muntz Lyall. Public Domain via Wikimedia Commons. With new publications, events, and the launch of a new coalition, the CC Open Culture Program accomplished a lot! Here are some highlights: At the Open Culture Strategic Workshop in Lisbon, Portugal, we gathered nearly 50 experts from every continent to co-create a strategic… Top Questions about Open Culture Answered in Short Videos by Connor Benedict, Brigitte Vézina Open Culture, Open Heritage Autumn Landscape by Magnus Ecknell is marked with CC0 1.0. We are excited to share a new video series titled Open Culture Capsules. In this multi-series video collection, we address some of the most frequently asked questions about our work in Creative Commons’ (CC) Open Culture Program. You can preview the series below and find… Creative Commons Launches TAROCH Coalition for Open Access to Cultural Heritage by Brigitte Vézina, Beverley Francis Open Culture, Open Heritage Creative Commons (CC) is proud to launch the TAROCH Coalition (Towards a Recommendation on Open Cultural Heritage), a collaborative effort to achieve the adoption of a UNESCO standard-setting instrument to improve open access to cultural heritage. We are grateful to the Arcadia Fund for supporting this initiative. Below we share an overview of TAROCH and… CC strategic workshop reveals big opportunities for open access to cultural heritage by Brigitte Vézina, Connor Benedict Open Culture, Open Heritage In May 2024, CC organized a strategic workshop in Lisbon to develop a roadmap for future action to advance our work towards a UNESCO instrument on open cultural heritage. In this blog post, we share the full report and some of its key highlights. A Quick Look at the CC Strategic Workshop on Open Heritage by Brigitte Vézina, Connor Benedict Open Culture One year after Creative Commons (CC) hosted an exploratory Open Culture Roundtable, in Lisbon, Portugal, which initiated the Towards a Recommendation on Open Culture (TAROC) global initiative, nearly 50 stakeholders from all continents gathered again for a strategic workshop, in Lisbon in May 2024. In this blog post, we share a snapshot of key highlights."
