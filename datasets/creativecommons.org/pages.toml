["https://creativecommons.org/privacy"]
title = "Creative Commons Privacy Policy - Creative Commons"
description = "Last Updated: December 9, 2019 This Privacy Policy (“Policy”) explains the information collection, use, and sharing practices of Creative Commons Corporation (“CC”, “Creative Commons,” “we,” “us,” and “our”). This Policy is incorporated into and part of Creative Commons Master Terms of Use (“Master Terms”) located at https://creativecommons.org/terms. Unless otherwise noted on a particular website or…"
full_description = "Creative Commons Privacy Policy Last Updated: December 9, 2019 This Privacy Policy (“Policy”) explains the information collection, use, and sharing practices of Creative Commons Corporation (“CC”, “Creative Commons,” “we,” “us,” and “our”). This Policy is incorporated into and part of Creative Commons Master Terms of Use (“Master Terms”) located at https://creativecommons.org/terms. Unless otherwise noted on a particular website or service hosted by Creative Commons, this Policy describes and governs the information collection, use, and sharing practices of Creative Commons with respect to your use of our websites that link to this Privacy Policy, including: https://creativecommons.org, https://wiki.creativecommons.org, https://network.creativecommons.org, https://search.creativecommons.org, https://labs.creativecommons.org, http://openpolicynetwork.org, http://open4us.org, https://rightsback.org, http://teamopen.cc, and http://thepowerofopen.org (collectively, the “Websites”), and the services we provide through our Websites and/or host on our servers, including without limitation the license chooser, legal tools, search engine, the CC Login Services (defined below), and the CC Global Network community website (collectively, the Websites, and the services available through them are referred to as the “Services”). Please note that Creative Commons does not operate the website at http://ccmixter.org. In addition, supplemental Privacy Policy terms (“Supplemental Privacy Policy Terms”) may apply to a particular Service, such as rightsback.org (https://rightsback.org/privacy-policy/). All such Supplemental Privacy Policy Terms will be accessible for you to read either within, or through your use of, that particular Service. Before you use or submit any information through or in connection with the Services, please carefully review this Privacy Policy. By using any part of the Services, you understand that your information will be collected, used, and disclosed as outlined in this Privacy Policy. IF YOU DO NOT AGREE TO THIS PRIVACY POLICY, PLEASE DO NOT USE THE SERVICES. 1. Our Principles Creative Commons has designed this policy to be consistent with the following principles: Privacy policies should be human readable and easy to find. Data collection, storage, and processing should be simplified as much as possible to enhance security, ensure consistency, and make the practices easy for users to understand. Data practices should meet the reasonable expectations of users. 2. Information We Collect We collect information in multiple ways, including when you provide information directly to us; when we passively collect information from you, such as from your browser or device; and from third parties. Information You Provide Directly to Us We will collect any information you provide to us. We may collect information from you in a variety of ways, such as when you: (a) create an online account, (b) apply for membership to the Creative Commons Global Network (“CCGN”), (c) vouch for someone’s application to the CCGN, (d) make a donation or purchase, (e) select a CC license or tool, (f) register for an event, (g) apply for a scholarship, grant, or fellowship, (h) contact us or provide feedback, (i) sign a petition distributed by Creative Commons, (j) upload your creative work or images, (k) subscribe to our newsletter, or (l) apply for a job at Creative Commons. This information may include but is not limited to your name, email address, phone number, mailing address, payment information, photo, geographic location, and your social media handles. We may also collect additional demographic and other information about you in connection with our conferences and events (e.g., dietary and other preferences), and the provision of this information to us by you is optional. Information that Is Automatically Collected Device/Usage Information We may automatically collect certain information about the computer or devices (including mobile devices or tablets) you use to access the Services. As described further below, we may collect and analyze (a) device information such as IP addresses, location information (by country and city), unique device identifiers, IMEI and TCP/IP address, browser types, browser language, operating system, mobile device carrier information, and (b) information related to the ways in which you interact with the Services, such as referring and exit web pages and URLs, platform type, the number of clicks, domain names, landing pages, pages and content viewed and the order of those pages, statistical information about the use of the Services, the amount of time spent on particular pages, the date and time you used the Services, the frequency of your use of the Services, error logs, and other similar information. As described further below, we may use third-party analytics providers and technologies, including cookies and similar tools, to assist in collecting this information. Cookies and Other Tracking Technologies We also collect data about your use of the Services through the use of Internet server logs and online tracking technologies, like cookies and/or tracking pixels. A web server log is a file where website activity is stored. A cookie is a small text file that is placed on your computer when you visit a website, that enables us to: (a) recognize your computer; (b) store your preferences and settings; (c) understand the web pages of the Services you have visited and the referral sites that have led you to our Services; (d) enhance your user experience by delivering content specific to your inferred interests; (e) perform searches and analytics; and (f) assist with security administrative functions. Tracking pixels (sometimes referred to as web beacons or clear GIFs) are tiny electronic tags with a unique identifier embedded in websites, online ads and/or email, and that are designed to provide usage information like ad impressions or clicks, measure popularity of the Services and associated advertising, and to access user cookies. We may also use tracking technologies in our license buttons and/or icons that you can embed on other sites/services to track the website addresses where they are embedded, gauge user interaction with them, and determine the number of unique viewers of them. If you receive email from us (such as the CC newsletter, campaign updates, or other ongoing email communications from CC), we may use certain analytics tools, such as clear GIFs, to capture data such as whether you open our message, click on any links or banners our email contains, or otherwise interact with what we send. This data allows us to gauge the effectiveness of our communications and marketing campaigns. As we adopt additional technologies, we may also gather additional information through other methods. Please note that you can change your settings to notify you when a cookie is being set or updated, or to block cookies altogether. Please consult the “Help” section of your browser for more information (e.g., Internet Explorer; Google Chrome; Mozilla Firefox; or Apple Safari). Please note that by blocking any or all cookies, you may not have access to certain features or offerings of the Services. For more information about how we use cookies, please see our Cookies Notice. Information from Third Parties We may also collect information about you or others through third parties. For example, if you apply for CCGN membership, we may collect information from the references or vouchers you identified in your membership application. To the extent permitted by law, we may also collect information from third parties, including public sources, social media platforms, and marketing and market research firms. Depending on the source, this information collected from third parties could include name, contact information, demographic information, information about an individual’s employer, information to verify identity or trustworthiness, and information for other fraud or safety protection purposes. 3. How We Use Your Information We may use the information we collect from and about you to: Fulfill the purposes for which you provided it; Evaluate your application for a scholarship, grant, fellowship, or CCGN membership; Distribute funds to scholarship and grant recipients; Provide and improve the Services, including to develop new features or services, promote CC community collaboration, take steps to secure the Services, and for technical and customer support; Fundraise, accept donations, or process purchases of CC merchandise; Host events and programs such as the annual CC Summit or the CC Certificate course; Send you information about your relationship or transactions with us, account alerts, or other communications, such as newsletters to which you have subscribed; Process and respond to your inquiries or to request your feedback; Conduct analytics, research, and reporting, including to synthesize and derive insights from your use of our Services; Evaluate job candidates during our hiring process; Comply with the law and protect the safety, rights, property, or security of Creative Commons, the Services, our users, and the general public; and Enforce our Master Terms, including to investigate potential violations thereof. Please note that we may combine information that we collect from you and about you (including automatically collected information) with information we obtain about you from our affiliates and/or non-affiliated third parties, and use such combined information in accordance with this Privacy Policy. We may aggregate and/or de-identify information collected through the Services. We may use de-identified and/or aggregated data for any purpose, including without limitation for research and marketing purposes. 4. When We Disclose Your Information We may disclose and/or share your information under the following circumstances: Service Providers. We may disclose your information with third parties who perform services on our behalf, including without limitation, event management, candidate selection, marketing, customer support, data storage, data analysis and processing, and legal services. For example, when you apply for a scholarship, grant, fellowship, or to be selected to participate in one of our other programs, CC may share that information with the individuals designated to select participants in, and help manage, those programs, which may include people not employed by Creative Commons. Or, when you register for an event, we may share your information with vendors, third party contractors, partner organizations, and volunteers for the purpose of organizing and running the event and related activities. Legal Compliance and Protection of Creative Commons and Others. We may disclose your information if required to do so by law or on a good faith belief that such disclosure is permitted by this Privacy Policy or reasonably necessary or appropriate for any of the following reasons: (a) to comply with legal process; (b) to enforce or apply our Master Terms and this Privacy Policy, or other contracts with you, including investigation of potential violations thereof; (c) enforce our Charter including the Code of Conduct and policies contained and incorporated therein, (d) to respond to your requests for customer service; and/or (e) to protect the rights, property, or personal safety of Creative Commons, our agents and affiliates, our users, and the public. This includes exchanging information with other companies and organizations for fraud protection, and spam/malware prevention, and similar purposes. Business Transfers. As we continue to develop our business, we may engage in certain business transactions, such as the transfer or sale of our assets. In such transactions, (including in contemplation of such transactions, e.g., due diligence) your information may be disclosed. If any of Creative Commons’ assets are sold or transferred to a third party, customer information (including your email address) would likely be one of the transferred business assets. Affiliated Companies. We may disclose your information with current or future affiliated companies. Consent. We may disclose your information to any third parties based on your consent to do so. Aggregate/De-identified Information. We may disclose de-identified and/or aggregated data for any purpose to third parties, including advertisers, promotional partners, and/or others. CCGN Membership. o In connection with you CCGN membership application, we may provide your information to the individuals you’ve selected to vouch for you, and with those reviewing your application, including the Membership Council whose members include people not employed by Creative Commons and who are located in various countries around the world. o If you vouch for someone’s application to the CCGN, your information will be shared with those reviewing the application, including the Membership Council, and if you provide a positive vouching statement, that statement will be shared with the applicant if and when they are admitted for membership. o Once you are a CCGN member, we may provide you with a public profile page, editable by you, and pre-populated with certain information you provided in your application such as your name, areas of interest, images or other content you upload, which will be publicly displayed to anyone who visits the site while logged in with their CCID. Other information contained in your profile such as your biographical information, email address, languages spoken, country of residence, social media account information, or URL details will be displayed only to CC and CCGN members. 5. Legal Basis for Processing Personal Data The laws in some jurisdictions require companies to tell you about the legal ground they rely on to use or disclose information that can be directly linked to or used to identify you. To the extent those laws apply, our legal grounds for processing such information are as follows: To Honor Our Contractual Commitments to You. Much of our processing of information is to meet our contractual obligations to provide services to our users. Legitimate Interests. In many cases, we handle information on the ground that it furthers our legitimate interests in ways that are not overridden by the interests or fundamental rights and freedoms of the affected individuals, these include: Customer service Marketing, advertising, and fundraising Protecting our users, personnel, and property Managing user accounts Organizing and running events and programs Analyzing and improving our business Managing legal issues We may also process information for the same legitimate interests of our users and business partners. Legal Compliance. We may need to use and disclose information in certain ways to comply with our legal obligations. Consent. Where required by law, and in some other cases where legally permissible, we handle information on the basis of consen"
