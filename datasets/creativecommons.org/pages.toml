title = "CC Open Education: 2024 Year in Review - Creative Commons"
description = "The Open Education program at Creative Commons works to support CC’s mission through education, advocacy, and outreach on using open licenses and open licensing policies to maximize the benefits of open education (content, practices and policy). We work closely with governments, educational institutions and organizations to open up knowledge for everyone. As we explore new solutions for sharing in 2025 and the years to come, we want to take a moment to reflect back on some of our work in 2024."
