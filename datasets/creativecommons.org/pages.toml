title = "Homepage - Creative Commons"
description = "Creative Commons is an international nonprofit organization that empowers people to grow and sustain the thriving commons of shared knowledge and culture we need to address the world's most pressing challenges and create a brighter future for all.    Learn more"
full_description = "Better Sharing, Brighter Future “Twenty Years of Creative Commons (in Sixty Seconds)” by Ryan Junell and Glenn Otis Brown for Creative Commons is licensed via CC BY 4.0 and includes adaptations of the multiple open and public domain works. View full licensing and attribution information about all works included in the video on Flickr. Creative Commons is an international nonprofit organization that empowers people to grow and sustain the thriving commons of shared knowledge and culture we need to address the world's most pressing challenges and create a brighter future for all. Learn more The nonprofit behind the licenses and tools the world uses to share For over 20 years, Creative Commons has supported a global movement built on a belief in the power of open access to knowledge and creativity. From Wikipedia to the Smithsonian, organizations and individuals rely on our work to share billions of historic images, scientific articles, cultural artifacts, educational resources, music, and more! “Farmer and his brother making music” by Russell Lee, here cropped, is marked with CC PDM 1.0. “Flickr photowalk at the Creative Commons Global Summit 2019, Lisbon” by Sebastiaan ter Burg, here cropped, is licensed via CC BY 2.0. “Novel Coronavirus SARS-CoV-2” by NIAID, here cropped, is licensed via CC BY 2.0. “Children kabuki theater in Nagahama (warrior Kumagai, 12 y.o.)” by lensonjapan, here cropped, is licensed via CC BY 2.0. Wikipedia 55+ million articles Every one of Wikipedia's 55 million plus articles are shared openly and freely using a CC license. The Met 492,000+ images All images of public-domain works in the Met's collection are openly available under Creative Commons Zero (CC0). Khan Academy 100,000+ lessons Many of the lessons found on Khan Academy are openly licensed under CC-BY-NC-SA. Wikipedia 55+ million articles Every one of Wikipedia's 55 million plus articles are shared openly and freely using a CC license. The Met 492,000+ images All images of public-domain works in the Met's collection are openly available under Creative Commons Zero (CC0). Khan Academy 100,000+ lessons Many of the lessons found on Khan Academy are openly licensed under CC-BY-NC-SA."
