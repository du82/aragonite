description = "Creative Commons is a nonprofit that depends on the donations of supporters like you. If you believe in open access, please consider making a one-time or monthly donation. Your contributions help us continue to advocate for global access to research, educational texts, art, cultural heritage, scientific articles, and other valuable resources needed to solve society’s…"
full_description = "Support CC Support Us Open Infrastructure Circle Supporters Donor FAQ CC Contributions Policy CC Guidelines for Screening Donors US State Nonprofit Disclosures Bassel Khartabil Fellowships & Memorial Fund Creative Commons is a nonprofit that depends on the donations of supporters like you. If you believe in open access, please consider making a one-time or monthly donation. Your contributions help us continue to advocate for global access to research, educational texts, art, cultural heritage, scientific articles, and other valuable resources needed to solve society’s most pressing challenges — from climate change to education access. Donate online Make a one time donation or become a monthly donor using our secure and encrypted online donation form hosted by Classy. Classy Pay supports payments by credit card, ACH, digital wallets, and cryptocurrency, including Apple Pay, Microsoft Pay, Google Pay, PayPal, Venmo, and Coinbase. Donate via check Please make checks payable to “Creative Commons” and mail to our address below: Creative Commons PO Box 741107 Los Angeles CA 90074-1107 Donate cryptocurrency We currently accept donations of cryptocurrency on Classy (via Coinbase), Every and Endaoment. Other ways to give If you would like to make a gift via stocks, securities, employee match, or wire transfer, please email development@creativecommons.org. For additional information and answers to your donation related questions, please visit our Donor FAQ. For details regarding gift acceptance, please see our CC Contributions Policy and CC Donor Screening Guidelines. Creative Commons’ financials, including Annual Reports, 990’s, and Audit Reports are all available to view on Guidestar."
