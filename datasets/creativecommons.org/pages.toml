full_description = 'The AI Action Summit & Civil Society’s (Possible) Impact by Anna Tumadóttir Events, Sustaining the Commons The Conciergerie, Paris by Mustang Joe is marked with CC0 1.0. The Conciergerie, Paris by Mustang Joe is marked with CC0 1.0 On February 10 and 11, 2025, the government of France convened the AI Action Summit, bringing together heads of state, tech leaders, and civil society to discuss global collaboration and action on AI. The event was co-chaired by French President Macron and Indian Prime Minister… Why Digital Public Goods, including AI, Should Depend on Open Data by Cable Green, Creative Commons Policy Open Data by Auregann is licensed under CC BY-SA 3.0. Acknowledging that some data should not be shared (for moral, ethical and/or privacy reasons) and some cannot be shared (for legal or other reasons), Creative Commons (CC) thinks there is value in incentivizing the creation, sharing, and use of open data to advance knowledge production. As open communities continue to imagine, design, and build digital… CC Launches its 2025-2028 Strategic Plan by Anna Tumadóttir, Creative Commons About CC Kaleidoscope 2 by Sheila Sund is licensed under CC BY 2.0. Kaleidoscope 2 by Sheila Sund is licensed under CC BY 2.0. For over 20 years, Creative Commons (CC) has provided self-serve solutions to address the limitations of copyright in a digital world. CC is a beloved symbol of sharing and knowledge freedom that resists a restrictive sharing and re-use environment and brings people together. Thanks… CC Open Science: 2024 Year in Review by Monica Granados, Taylor Campbell Open Climate, Open Science Science by Steve Rotman is licensed under CC BY-NC-ND 2.0. Science by Steve Rotman is licensed under CC BY-NC-ND 2.0 Access to science is a fundamental human right, and yet, much of that public good is inaccessible because of paywalls and limited in its reuse because of restrictive copyright licenses. The CC licenses are an essential part of open science infrastructure and provide a legal… CC Open Culture: 2024 Year in Review by Brigitte Vézina Open Culture, Open Heritage Interesting Story by Laura Muntz Lyall. Public Domain via Wikimedia Commons. Interesting Story by Laura Muntz Lyall. Public Domain via Wikimedia Commons. With new publications, events, and the launch of a new coalition, the CC Open Culture Program accomplished a lot! Here are some highlights: At the Open Culture Strategic Workshop in Lisbon, Portugal, we gathered nearly 50 experts from every continent to co-create a strategic… CC Learning and Training: 2024 Year in Review by Jennryn Wetzler, Shanna Hollich CC Certificate, Licenses & Tools People Walking on Brown Concrete Floor by Mehmet Turgut Kirkgoz . Public Domain. People Walking on Brown Concrete Floor by Mehmet Turgut Kirkgoz . Public Domain. Creative Commons training efforts strengthen our mission to “empower individuals and communities around the world through technical, legal, and policy solutions that enable the sharing of education, culture, and science in the public interest.” In 2024, our Learning & Training team focused… CC Open Education: 2024 Year in Review by Cable Green, Jennryn Wetzler, Shanna Hollich Open Education Photo of Empty Classroom by Diana. Public Domain. Photo of Empty Classroom by Diana. Public Domain. The Open Education program at Creative Commons works to support CC’s mission through education, advocacy, and outreach on using open licenses and open licensing policies to maximize the benefits of open education (content, practices and policy). We work closely with governments, educational institutions and organizations to open… From Recommendations to Implementation: Increasing Access to Climate Data for Earth Intelligence by Taylor Campbell, Jan Ainali Open Access, Open Climate, Open Science "Earth" by Kevin Gill is licensed under CC BY 2.0. Screenshot by Creative Commons is licensed under CC BY 4.0. Earlier this year, Creative Commons published our Recommendations for Better Sharing of Climate Data, a seminal resource to help national and intergovernmental climate data-producing agencies use legal terms, licenses, and metadata values that ensure climate data is accessible, shareable, and reusable. Our goal is to… Welcoming Angela Oduor Lungati as CC Board Chair by Anna Tumadóttir, Creative Commons About CC "Yellow Chair, The High Line" by Shawn Hoke is licensed under CC BY-NC-ND 2.0. “Yellow Chair, The High Line” by Shawn Hoke is licensed under CC BY-NC-ND 2.0. Creative Commons (CC) has—and continues to be—fortunate to have an expert and passionate board of directors, many of whom have been instrumental to the success of CC at both the organizational level, as well as nationally and regionally. A healthy board… Open Movement’s Common(s) Causes by Creative Commons Community, Events “Open movement’s common(s) causes: Report from a Wikimania 2024 side event is licensed via CC BY 4.0. This report maps current threats and opportunities facing the open movement, based on the ongoing work of the organizations behind the Common(s) Cause event, which took place in Katowice, Poland, as a pre-conference event for Wikimania 2024 on August 6, 2024. The meeting was organized by Creative Commons, Open Knowledge Foundation, Open Future, and Wikimedia…'
