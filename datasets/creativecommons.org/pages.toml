full_description = "Why Digital Public Goods, including AI, Should Depend on Open Data by Cable Green, Creative Commons Policy Open Data by Auregann is licensed under CC BY-SA 3.0. Acknowledging that some data should not be shared (for moral, ethical and/or privacy reasons) and some cannot be shared (for legal or other reasons), Creative Commons (CC) thinks there is value in incentivizing the creation, sharing, and use of open data to advance knowledge production. As open communities continue to imagine, design, and build digital… Six Insights on Preference Signals for AI Training by Rebecca Ross Events, Licenses & Tools, Policy, Technology “Eagle Traffic Signals - 1970s” by RS 1990 is licensed via CC BY-NC-SA 2.0.. “Eagle Traffic Signals – 1970s” by RS 1990 is licensed via CC BY-NC-SA 2.0.. At the intersection of rapid advancements in generative AI and our ongoing strategy refresh, we’ve been deeply engaged in researching, analyzing, and fostering conversations about AI and value alignment. Our goal is to ensure that our legal and technical infrastructure remains… CC Certificate Alumni Making a Global Impact by Shanna Hollich CC Certificate, Open Education, Policy “Farmer Melese Tsegaye blows to clean and select wheat seed in his field, Kingbird variety wheat from Kulumsa Research Station” by International Maize and Wheat Improvement Center is licensed via CC BY-NC-SA 2.0. Launched in 2018, the Creative Commons Certificate program has trained and graduated nearly 1800 people from 66 countries. The Certificate program offers in-depth courses about CC licenses, open practices, and the ethos of the Commons. Our staff is constantly inspired by our community of Certificate alumni, accomplishing incredible things. In this interview, we were delighted… Questions for Consideration on AI & the Commons by Anna Tumadóttir About CC, Licenses & Tools, Policy “Eight eyes. Engraving after C. Le Brun” by Charles Le Brun is licensed via CC0. “Eight eyes. Engraving after C. Le Brun” by Charles Le Brun is licensed via CC0. The intersection of AI, copyright, creativity, and the commons has been a focal point of conversations within our community for the past couple of years. We’ve hosted intimate roundtables, organized workshops at conferences, and run public events, digging into the… CC at WIPO: Slow progress on copyright exceptions for cultural heritage institutions by Brigitte Vézina Copyright, Open Culture Last week, Creative Commons (CC) participated in the 45th session of the World Intellectual Property Organization (WIPO) Standing Committee on Copyright and Related Rights (SCCR). In this post, we report on the session discussions on exceptions and limitations for cultural heritage institutions (CHIs), a topic of utmost relevance to our Open Culture Program. Exploring a Books Data Commons for AI Training by Creative Commons Policy What role do books play in training AI models, and how might digitized books be made widely accessible for the purposes of training AI? What dataset of books could be constructed and under what circumstances? A new paper investigates the concept of a responsibly designed, broadly accessible dataset of digitized books to be used in training AI models. CC Joins Civil Society Letter Urging U.S. to Support Openness and Transparency in AI by Creative Commons Policy “Artificial Intelligence” by Oksana Latysheva from NounProject.com is licensed via CC BY 3.0. CC joins civil society letter urging U.S. to support openness and transparency in AI. EU adopts landmark Artificial Intelligence Act by Brigitte Vézina, Mark Foster Copyright “L'Europe by Delisle” by Guillaume de, 1675-1726 - 1700 - National Library of Portugal, Portugal - Public Domain. Creative Commons welcomes the adoption by the European Parliament of the EU’s Artificial Intelligence Act. We engaged intensively with EU policymakers to safeguard the appropriate interplay with EU copyright legislation. The EU must now ensure implementation allows broad, open access to harness the full potential of generative AI whilst enforcing the safeguards provided. CC Supports a new Digital Knowledge Act for Europe by Brigitte Vézina, Monica Granados Copyright, Open Access, Open Data, Open Knowledge, Open Science, Policy Anonymous, “Prudence, Wisdom and Knowledge”, National Library of the Netherlands, Public Domain Mark. Anonymous, “Prudence, Wisdom and Knowledge”, National Library of the Netherlands, Public Domain Mark. In December last year, the Communia Association for the Public Domain — of which Creative Commons (CC) is a member — asked the European Commission and European Parliament to consider the development of a Digital Knowledge Act. In this blog post, we… An Invitation for Creators, Activists, and Stewards of the Open Movement by Shannon Hong, Creative Commons Licenses & Tools, Policy “AI Alignment Assembly” by Jakub Koźniewski for the Open Future Foundation is licensed under CC BY 4.0. Dear Open Movement Creators, Activists, and Stewards, A key question facing Creative Commons as an organization, and the open movement in general, is how we will respond to the challenge of shaping artificial intelligence (AI) towards the public interest, growing and sustaining a thriving commons of shared knowledge and culture. So much of generative AI…"
