["https://creativecommons.org/mission/get-involved"]
title = "Get Involved - Creative Commons"
description = "Subscribe to our newsletter The CC newsletter is an excellent resource for all members of our community who care about CC and want to stay up to date with our happenings across the globe. Subscribe > Make a donation Creative Commons is a nonprofit that depends on the donations of supporters like you. If you…"
full_description = "Get Involved Who We Are Global Network Team Opportunities Annual Reports Get Involved Store Downloads Contact Subscribe to our newsletter The CC newsletter is an excellent resource for all members of our community who care about CC and want to stay up to date with our happenings across the globe. Subscribe > Make a donation Creative Commons is a nonprofit that depends on the donations of supporters like you. If you believe in open access, we hope you’ll consider making a one-time or monthly contribution. You can donate online or visit our Donor FAQ for more information on how to make gifts via check or wire transfer as well as details on donating stock, securities, and cryptocurrency. For details regarding gift acceptance, please see Creative Commons Guidelines for Screening Donors. Follow us on social media Find us on Facebook Follow us on LinkedIn Follow us on Mastodon Follow us on Twitter Follow us on Instagram Share your work under a CC license Creative Commons licenses would do little without enthusiastic use by creators across disciplines. If you’ve created any sort of copyrightable material, such as video, text, images, websites or blogs, license them! Take a CC Certificate course CC Certificates are in-depth courses about CC licenses, open practices, and the ethos of the Commons. They are open to everyone! Learn more > Slack Slack is a free messaging and collaboration tool that operates much like IRC, but allows users to have public and private channels as well as direct messages. You can access Slack through the browser, the desktop app (for Linux, Mac OS, and PC,) or the mobile app on iOS and Android. Join the CC Slack Community today! CC Global Network Working alongside CC staff are a worldwide group of volunteers which includes individuals, organizations and formal chapters supporting and promoting CC activities around the world. These affiliates and volunteers are a vital part of the success of Creative Commons. Visit the CC Global Network online > Community Platforms CC volunteers and staff collaborate on specific projects by coordinating in communities of interest called “platforms” that anyone can join, including the Copyright Platform, the Open Culture Platform, and the Open Education Platform. Developers We are continuously updating and introducing new tools to help users license their work more easily. Please visit Creative Commons Open Source to learn more about our projects and how to contribute to them. Wiki Our public wiki is a place to develop a collective memory about Creative Commons, contribute to our on-going projects, and a great place to find ample amounts of ways to help grow the commons."
