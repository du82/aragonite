full_description = 'CC Open Science: 2024 Year in Review by Monica Granados, Taylor Campbell Open Climate, Open Science Science by Steve Rotman is licensed under CC BY-NC-ND 2.0 Science by Steve Rotman is licensed under CC BY-NC-ND 2.0 Access to science is a fundamental human right, and yet, much of that public good is inaccessible because of paywalls and limited in its reuse because of restrictive copyright licenses. The CC licenses are an essential part of open science infrastructure and provide a legal… From Recommendations to Implementation: Increasing Access to Climate Data for Earth Intelligence by Taylor Campbell, Jan Ainali Open Access, Open Climate, Open Science "Earth" by Kevin Gill is licensed under CC BY 2.0. Screenshot by Creative Commons is licensed under CC BY 4.0. Earlier this year, Creative Commons published our Recommendations for Better Sharing of Climate Data, a seminal resource to help national and intergovernmental climate data-producing agencies use legal terms, licenses, and metadata values that ensure climate data is accessible, shareable, and reusable. Our goal is to… Open Climate Campaign at UNFCCC Conference of the Parties 28 by Monica Granados Open Climate Wetland at Expo City Dubai by Monica Granados is licensed via CC BY 4.0. The complexity of climate change is on display at the United Nations Framework Convention on Climate Change (UNFCCC) Conference of the Parties (COP). The conference is arranged into two major zones, blue and green, with the former accessible only by parties with UNFCCC accreditation. The green zone is a landscape dotted by venues with booths… A Year in the Open Climate Campaign by Monica Granados, Cable Green Open Climate "River Banner" by Impact Media Lab for Creative Commons is licensed via CC BY 4.0. This month marks the first anniversary of the Open Climate Campaign — a four-year project working to make the open sharing of research the norm in climate science. We celebrate the success of the campaign in this initial year and look forward to the upcoming year.'
