["https://creativecommons.org/about/program-areas/education-oer"]
title = "OER - Creative Commons"
description = "1. General Search 1.1 Google Many people start out looking for OER using Google. A general search with Google returns vast amounts of resources, most of which are not openly licensed for reuse. If you want to use Google to search for openly licensed resources we recommend you use Google Advanced Search. Scroll down in…"
full_description = "OER 1. General Search 1.1 Google Many people start out looking for OER using Google. A general search with Google returns vast amounts of resources, most of which are not openly licensed for reuse. If you want to use Google to search for openly licensed resources we recommend you use Google Advanced Search. Scroll down in advanced search and set “usage rights” parameters to be “Free to use, share, or modify”. If you want content for commercial use be sure to select the appropriate option. Google search returns a vast array of openly licensed resources that may require extensive sifting to yield useful nuggets. The other search recommendations on this page are likely to yield more targeted results. 2. Photo/Image Search Searching for photos or images? 2.1 Openverse Openverse, orginally incubated at CC and now stewarded by the WordPress community, is an extensive library of free stock photos, images, and audio available for free use. All Openverse content is under a CC license or is in the public domain. 2.2 Wikimedia Commons 2.3 Flickr 2.4 Google Images Be sure to scroll down in advanced search and set “usage rights” parameters to be “Free to use, share, or modify”. If you want content for commercial use be sure to select the appropriate option. 2.5 Pixabay Note that Pixabay images are public domain images you can freely use for personal and commercial use without attribution to the original author. While Pixabay can be a good way to find public domain images your search will also return proprietary professional images Pixabay offers for sale. 2.6 ClipSafari Note that ClipSafari images are public domain images you can freely use for personal and commercial use without attribution to the original author. 2.7 The Noun Project The Noun Project is a platform empowering the community to build a global visual language of icons and symbols that everyone can understand. Symbols and icons on The Noun Project are licensed using CC. The sources above are online image databases. In addition to these sources there are many openly licensed electronic publications and journals with images embedded throughout that you are also free to use. Here are just a few of many examples: 2.8 Encyclopedia of Life The Encyclopedia of Life is an online collaborative encyclopedia providing global access to knowledge about biological life on earth. Entries are composed as written content with one or more pictures usually in the form of color photographs. Content is provided by a wide variety of contributors but is reviewed for accuracy. All content on EOL is licensed under CC licenses, but each contributor defines what level of CC licensing is applicable to their content. Specific licensing information can be found adjacent to media or by clicking on desired media. If no reuse information is included then it is understood that there are no reuse restrictions other than providing credit when reusing the image. 2.9 Public Library of Science (PLOS) PLOS is a non-profit publisher and advocacy organization focused on science and medicine. Every article they publish is open access. All written content and images are licensed using a CC Attribution license. Searching through PLOS journals and collections can yield many highly useful images including figures, tables, and graphs. In addition to electronic publications and journals some galleries, museums and archives publish historical images online. For a great example see: 2.10 Europeana Europeana provides access to the digital resources of Europe’s museums, libraries, archives and audio-visual collections including paintings, drawings, maps, photos and pictures of museum objects. Not all the works are openly licensed so be sure to check for usage rights. 3. Video Search Searching for video? Try: 3.1 YouTube The best way to find a video that is licensed under the CC license on YouTube is to use the CC Search tool described above in the General Search and Photo/Image Search sections. Unfortunately YouTube does not provide a filter or advanced search capability on their home page for finding all CC-licensed videos on YouTube. However, YouTube has a view that enables you to see the most viewed and most reused CC-licensed videos. In addition if you are the YouTube home page and type in your search term followed by a comma and then “creativecommons” the videos returned are CC licensed. You can mark your videos with a CC license when uploading them to YouTube. You can also incorporate the millions of CC-licensed videos on YouTube when creating your own videos using the YouTube Video Editor. Within the YouTube Video Editor you can click on the CC tab to find content available under a CC license. 3.2 Vimeo Vimeo lets you easily post and find CC licensed videos. 3.3 Internet Archive The Internet Archive has a great collection of old video and movie footage. Looking for old cartoons, sports videos, ephemeral films, news footage? Check out the Internet Archive. 3.4 TED TED is a nonprofit devoted to “Ideas Worth Spreading.” It started out (in 1984) as a conference bringing together people from three worlds: Technology, Entertainment, Design. Since then its scope has become ever broader. On TED.com, the best talks and performances from TED and partners are made available to the world, for free. More than 900 TEDTalks are now available, with more added each week. All of the talks are subtitled in English, and many are subtitled in various languages. These videos are released under a CC BY-NC-ND license, so they can be freely shared and reposted. 3.5 Al Jazeera The Al Jazeera CC Repository hosts select broadcast quality footage that Al Jazeera has released under various CC licenses. Select Al Jazeera video footage is available for free to be downloaded, shared, remixed, subtitled and eventually rebroadcasted by users and TV stations across the world with acknowledgement to Al Jazeera. This is the first time that video footage produced by a news broadcaster is released under the CC 3.0 Attribution license which allows for commercial and non-commercial use. 4. Audio/Music Search Searching for openly licensed audio sounds or music? Try: 4.1 Jamendo Jamendo offers more than 350,000 free music tracks licensed under CC, all available for streaming and unlimited download without ads. It allows the public to discover thousands of artists of all genres who have chosen to distribute their music independently outside the traditional system of collecting societies. Jamendo artists can choose to join the Jamendo PRO service that allows them to sell commercial licenses of their music for professional uses, such as music synchronization for audio-visual productions or broadcasting in public spaces. You can search for music on Jamendo using the CC Search tool or directly on the Jamendo. 4.2 ccMixter ccMixter is a community music site featuring remixes licensed under CC where you can listen to, sample, mash-up, or interact with music in whatever way you want. Looking for music for a video, school project, game you’re developing, or podcast? Find music liberally licensed using the dig.ccMixter music discovery tool. 4.3 Internet Archive In addition to video mentioned above, the Internet Archive has a great collection of audio. If you are searching for animal sounds, old time radio shows, sound effects and even music, the Internet Archive may have what you’re looking for. 4.4 Free Music Archive The Free Music Archive offers free downloads under CC and other licenses. Please visit the track page to discover what you can and cannot do with each track. 4.5 SoundCloud SoundCloud is a social sound platform for people to create and share music and sounds. Recording and uploading sounds to SoundCloud lets people easily share them privately with their friends or publicly to blogs, sites and social networks. Many SoundCloud songs and sounds are licensed with CC. Visit soundcloud.com/creativecommons to see SoundCloud sounds and songs licensed with CC. The search tools profiled above are for educators who are simply looking for individual media elements to use within their courses. However, an even higher value can be gained by finding Open Educational Resources (OER) that other educators have already vetted and assembled into education content such as full courses, workshops, textbooks, tests and assessments. This search section is focused on helping you find this kind of OER. 5. General Education Search Looking to search across multiple OER initiatives? Try: 5.1 OER Commons OER Commons has forged alliances with over 120 major content partners to provide a single point of access through which educators and learners can search across collections to access over 30,000 items, find and provide descriptive information about each resource, and retrieve the ones they need. These resources are publicly available for all to use principally through CC licensing. 5.2 The Orange Grove Digital Repository The Orange Grove digital repository provides an environment for educators to search for, use, remix, share, and contribute educational resources. A wide range of K-12 and post-secondary resources are available. The repository can also be integrated with a Learning Management Systems (e.g., Blackboard, Desire 2 Learn, Canvas) . Resources are free for educational use but may be protected through various copyright statements associated with each resource. 6. Recorded Lectures & Video Tutorials Search Many institutions have recorded on-campus lectures and published them as OER licensed with CC. Short video tutorials on a particular subject are also available. Searching for recorded lectures or video tutorials? Try: 6.1 Open Yale Courses Open Yale Courses (OYC) provide lectures and other materials from selected Yale College courses licensed using CC. The courses span the full range of liberal arts disciplines, including humanities, social sciences, and physical and biological sciences. Each course includes a full set of class lectures produced in high-quality video accompanied by such other course materials as syllabi, suggested readings, and problem sets. The lectures are available as downloadable videos, and an audio-only version is also offered. In addition, searchable transcripts of each lecture are provided. 6.2 MIT MIT has their own MIT YouTube channel where recorded lectures are uploaded. MIT is also well known for the MIT OpenCourseWare (OCW) initiative, a CC-licensed, web-based publication of virtually all MIT on campus course content online including lecture notes, exams, and videos. Courses with substantial video and/or audio components are listed here. 6.3 UC Berkeley UC Berkeley’s webcast.berkeley is a central service for online video and audio lectures. From the home page you can search for a particular course or simply choose to view all courses. Video and audio lectures are licensed as CC Attribution Non-Commercial No-Derivatives (CC BY-NC-ND) and made available through YouTube and/or iTunes. 6.4 Khan Academy The Khan Academy has a large library of videos covering math, biology, chemistry, physics and even the humanities, finance and history. Khan videos aren’t so much recorded lectures as short 10 minute long tutorials with an instructor narrating explanations and working things out on a board by hand on your computer screen. Check out Khan’s library of videos. 7. Open Textbook Search Searching for open textbooks? Try: 7.1 Open Textbook Library The costs of college is going up every year, and it’s not just tuition that weighs on student’s minds and bank accounts. According to the College Board, undergraduates spend an average of $1200 on textbooks annually. Faced with these costs, the academic impact is seen in classrooms across the country–many students choose to not buy a required text, take fewer courses, and some even drop or fail a course completely. Open textbooks are a solution. The Open Textbook Library provides a growing catalog of free, peer-reviewed, and openly-licensed textbooks. As part of their service they provide a listing of Open Textbooks by Subject. 7.2 BCcampus OpenEd The goal of the project is to make higher education more accessible by reducing student cost through the use of openly licensed textbooks. BCcampus was tasked with co-ordination of the project because of our 10-year experience funding OER in British Columbia, Canada. Specifically, the project was asked to create a collection of open textbooks aligned with the top 40 highest-enrolled subject areas in the province. A second phase was announced in the spring of 2014 in which an additional 20 textbooks targeting trades, technology, and skills training would be developed. As part of their service they provide a listing of Open Textbooks by Subject. 7.3 College Open Textbooks The Community College Open Textbooks Collaborative, funded by The William and Flora Hewlett Foundation is focused on driving awareness and adoptions of open textbooks. This includes providing training for instructors adopting open resources, peer reviews of open textbooks, and mentoring online professional networks that support for authors opening their resources, and other services. As part of their service they provide a listing of Open Textbooks by Subject. 7.4 Open Stax College OpenStax College is a nonprofit organization committed to improving student access to quality learning materials. OpenStax free textbooks are developed and peer-reviewed by educators to ensure they are readable, accurate, and meet the scope and sequence requirements of courses. See the free, CC BY licensed, high quality textbooks they provide here. 7.5 Siyavula Siyavula supports and encourages communities of teachers to work together, openly share their teaching resources and benefit from the use of technology. Siyavula has created a series of open textbooks for math and science Grades 10-12. They have also developed an online practice service, modelled on exam questions, which allows learners to practise math andscience questions they may find in their tests and exams. This practice service is well integrated with the Siyavula textbooks and these resources work together to ensure learners excel in Mathematics and Physical Sciences. Learners are able to practise using their mobile phones or computers. 7.6 CK-12 CK-12 offers free high-quality, standards-aligned, open content in the Science, Technology, Engineering and Math (STEM) subjects. By providing these free resources, CK-12 is working toward educational equity for all. CK-12 provides an integrated set of tools for learning including digital textbooks, concept-based learning, SAT prep, and interactive Algebra curriculum (with additional math and science subjects in progress). CK-12 resources are openly licensed using CC. 7.7 Boundless Boundless is offering services that use OER to create a free replacement to a student’s assigned textbook that covers the same key concepts more efficiently. Boundless is currently focused on AP High School and Introductory level Coll"
