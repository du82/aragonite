full_description = "CC Open Education: 2024 Year in Review by Cable Green, Jennryn Wetzler, Shanna Hollich Open Education Photo of Empty Classroom by Diana. Public Domain. Photo of Empty Classroom by Diana. Public Domain. The Open Education program at Creative Commons works to support CC’s mission through education, advocacy, and outreach on using open licenses and open licensing policies to maximize the benefits of open education (content, practices and policy). We work closely with governments, educational institutions and organizations to open… CC Certificate Alumni Making a Global Impact by Shanna Hollich CC Certificate, Open Education, Policy “Farmer Melese Tsegaye blows to clean and select wheat seed in his field, Kingbird variety wheat from Kulumsa Research Station” by International Maize and Wheat Improvement Center is licensed via CC BY-NC-SA 2.0. Launched in 2018, the Creative Commons Certificate program has trained and graduated nearly 1800 people from 66 countries. The Certificate program offers in-depth courses about CC licenses, open practices, and the ethos of the Commons. Our staff is constantly inspired by our community of Certificate alumni, accomplishing incredible things. In this interview, we were delighted… The CC Open Education Platform Funds Five New Community Projects by Jennryn Wetzler Community, Open Education “Together We Can Move Mountains” by Steve McCarthy for Fine Acts x OBI is licensed via https://creativecommons.org/licenses/by-nc-sa/4.0/. Thanks to the CC Open Education Platform community’s time proposing projects and voting on the proposals, we now have five winning ideas to advance open education globally. CC will fund five projects in 2024, spanning Brazil, Ghana, Nepal, and Nigeria. The CC Open Education Platform is also funding ongoing global community work supporting the UNESCO… Learn More with Creative Commons: Recent Training Highlights by Jennryn Wetzler, Shanna Hollich CC Certificate, Open Education LTHE : Learn - Teach -