title = "Creative Commons joins the Digital Public Goods Alliance - Creative Commons"
description = "Today, Creative Commons (CC) joins the Digital Public Goods Alliance (DPGA) as a new member. The DPGA is a multi-stakeholder initiative with a mission to accelerate the attainment of the sustainable development goals in low- and middle-income countries by facilitating the discovery, development, use of, and investment in digital public goods (DPGs)."
