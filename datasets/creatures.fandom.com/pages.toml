["https://creatures.fandom.com/fr/wiki/COB"]
title = "COB | Creatures Wiki France | Fandom"
description = "Un COB (ou cob, COb) est un Creatures Object - un objet du jeu dans Creatures ou Creatures 2. Ces objets sont stockés dans un fichier .cob, qui contient une ou plusieures images, une description, et du code CAOS. Voir Fichier COB pour davantage d'informations sur les formats de fichier. Dans Creatures 3 et Docking Station, les COBs sont appelés agents. Les créateateurs de COBs sont appelés COBblers. De nombreux anciens COBs de C1 sont trouvables par CObfinder General, Norntropolis ou TazzMann's"
full_description = '''dans : COBs, Lexique COB Se connecter pour modifier Historique Discussion (0) <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Un COB (ou cob, COb) est un Creatures Object - un objet du jeu dans Creatures ou Creatures 2. Ces objets sont stockés dans un fichier .cob, qui contient une ou plusieures images, une description, et du code CAOS. Voir Fichier COB pour davantage d'informations sur les formats de fichier. Dans Creatures 3 et Docking Station, les COBs sont appelés agents. Les créateateurs de COBs sont appelés COBblers. Trouver un COB[] De nombreux anciens COBs de C1 sont trouvables par CObfinder General, Norntropolis ou TazzMann's CREATUREs UNIVERSE, et une bonne liste de COBs de C2 peut être trouvée sur Creatures of Avalon. Malheureusement, un bon site couvrant tous les jeux (Where's The COB?) a disparu fin 2001/début 2002. Si vous aimez un COB, pourquoi ne pas l'ajouter à la liste des COBs connus ? Liens internes[] Agents Informations sur les fichiers COB Liens externes[] BoBWare (C1/C2) Creatures Labs COB artwork tutorial (archived, C2) Liste des catégories Catégorie : COBs Lexique Sauf mention contraire, le contenu de la communauté est disponible sous licence CC-BY-SA.'''
