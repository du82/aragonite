title = "CAOS | Creatures Wiki | Fandom"
description = "CAOS (Creatures Agent Object Script) is the generic name for the embedded scripting language used in all games in the Creatures series. Note that the details of CAOS vary from engine to engine, but all incarnations have some overarching similarities. CAOS is used to make objects such as COBs or..."
full_description = '''in: CAOS CAOS Sign in to edit History Purge Talk (4) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> CAOS (Creatures Agent Object Script) is the generic name for the embedded scripting language used in all games in the Creatures series. Note that the details of CAOS vary from engine to engine, but all incarnations have some overarching similarities. CAOS is used to make objects such as COBs or agents, and even controls breeding patterns in worlds - there are many tutorials (see External links) which can help you to learn the CAOS language. Looking for a quick fix? Here are some C3/DS CAOS Codes. CAOS is itself the name of a CAOS command! See CAOS (command). Contents 1 Overview 2 Lists of CAOS Commands by Game 3 History of CAOS versions 4 Full commented scripts 5 Tutorials 6 External links Overview[] CAOS is a register-based language, with a set of opcodes with fixed argument lists. Local variables are not supported. The basic unit of CAOS code is the command which can be injected and executed by the engine. However, CAOS is mostly used in scripts, blocks of code identified by four integers - three identifying the object for which the script applies (0 may be used as a wildcard), and one identifying the event the script triggers on. Those form the backbone of the actual game, declaring the different forms of interactions between the different COBs or agents (a term for the programming objects introduced with Creatures 3 - every gadget or even creature in the world is an agent) by defining actions to be taken when certain events happen (from time triggered ones to collisions with other objects or even clicks). Each script may contain subroutines; however as these cannot be shared and do not have local variables, they are little more than a convenience. CAOS scripts have 100 registers of the form VAxx to use to hold temporary variables. In addition, an object may be selected into the special register TARG, and then 100 attributes of the object may be accessed with registers of the form OVxx. In most cases an object must be selected into TARG before it is acted upon. Using the command AVAR to access the OVxx variables of an agent without having to fiddle with TARG, one can implement simple arrays. Note that while Creatures and Creatures 2, for performance reasons, use unsigned bytes (0-255) as integer types, later versions of the engine use 'normal' 32-bit integers (which can be very large) as well as floating point numbers (eg: 3.141593). Lists of CAOS Commands by Game[] Note: These are incomplete. Creatures 1 Creatures 2 Creatures 3 Also all C3 CAOS commands listed in a batch file C3CAOSLister Statistics of commands used in the games History of CAOS versions[] Creatures: Initial incarnation of CAOS. Creatures 2: Improved game engine. CAOS now supports physics. Creatures Adventures: New game engine - the Creatures Evolution Engine. Support for strings and file I/O is added. CAOS exceptions are much less likely to cause engine crashes. Creatures 3: Incremental improvements and changes to Creatures Adventures engine. Docking Station: Incremental improvements to Creatures 3 engine. Includes networking support (Babel). Sea-Monkeys: Incremental improvements and changes to Docking Station engine, without DS's Babel. Full commented scripts[] Creatures 1 scripts Creatures 2 scripts Creatures 3/DS scripts Tutorials[] CAOS Chaos - A pair of tutorials for C3/DS by AquaShee External links[] Creatures 1 CAOS guide (PDF) Creatures 2 CAOS guide (DOC) How to generate the Creatures 3 CAOS guide C1 and C3 CAOS tutorials Getting Started with CAOS - C3/DS Discussion on CAOS as image based programming language, and history of CAOS Categories Categories: CAOS Community content is available under CC-BY-SA unless otherwise noted.'''
