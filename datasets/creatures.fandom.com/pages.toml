full_description = '''in: Creatures games English Français Creatures Adventures Sign in to edit History Purge Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> CV Alba Norn Creatures Adventures Creatures Adventures is the first of two titles in the Creatures series intended particularly for young children (ages 4-10), the second being Creatures Playground. In these games the norns are bigger, rooms are brighter, and it generally feels more like a game than other incarnations of Creatures. When both the original Creatures Adventures and Creatures Playground games are installed, they can be merged to form a single game known as Creatures Village. Creatures Village is also the name of the remastered Windows and Mac OS X compilation games that include both titles. Did you know? Creatures Adventures actually came out before Creatures 3, despite using the engine designed for Creatures 3. They were both published by Mindscape in 1999 and was produced by Ben Simpson, now Creative Director for NiceTech (formerly Nicely Crafted). Official breeds[] When run with the Merger with Creatures Playground, the two games become one (known as Village) and will also add Tiger Norns and Okapi Norns. However since you can play Adventures standalone unaffected, Tiger Norns and Okapi Norns won't actually be installed onto Adventures. Primrose Norn Alba Norn Pippin Norn Malay Norn Contents[] Adventures is a world where all sorts of activities can be done and where unlockables can be found. Here is a listing of some of the things you can do; Outside of the Nestery is a dressing room, where you can dress up your norns with clothing. There is a variety of clothing including gloves, boots, wigs and hats. The wardrobe only contains one clothing piece the first time, the other two have to be found and unlocked. In the Kitchen you can choose to bake cakes for your norns to eat. Click on the book and select what you want to make. All of the ingredients will go inside a cake pan. Place the pan into the oven, close the door and click the egg timer. You can make three cakes anytime but to make the carrot cake or the slimy bone cake, you must find the ingredients first. The Playroom, which is just upstairs and accessed from the Kitchen, includes many toys for norns to play with... and so can you. You can play a basket ball game by clicking the score board. Click onto the basketball and try to shoot hoops for points before the timer runs out. Every time the timer runs out, your last score is saved so you can try to beat it the next time. Outside of the house is a small crop yard where you can grow carrots, radishes, tomatoes, watermelons, flowers plus more. You can grow them at any season except Winter. First till the soil until it is just right, click the seed packets to begin planting and remember to water the plants with water from the pail. You can choose to place the vegetables into the pelican's mouth to deliver to your Kitchen. Related links[] Creatures Village category CA and CP Merger Tool Creatures Village Categories Categories: Creatures games Languages Français Community content is available under CC-BY-SA unless otherwise noted.'''
