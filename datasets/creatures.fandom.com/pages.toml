full_description = '''Billets de blog récents Billets de blog 1 billet <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> TreehuggerNorn • 12 décembre 2012 1 Appel aux fans Faut-il refonder Creatures Wiki France ? Je ne demande pas s'il est nécessaire de déménager, changer de nom ou autre, mais si, d'après-vous, il ne serait pas bénéfique à notre Wiki de faire peau neuve dans ses catégories et son organisation pour sembler plus rempli, plus jeune, plus français. Je trouve, en effet, que certaines catégories ne se prêtent pas à la création de grands articles car ils n'ont pas forcément de réalité dans la communauté française ou la communauté actuelle. Cela me semble encombrer inutilement la page d'accueil et donne réellement une impression de vide. Voici un exemple : La catégorie "Communauté" comprend ces catégories : Histoire - MembresSites - LexiqueGroupes - Humouralt.games.creatures (newsGroup anglais)Personages … Lire le billet Liste des catégories Catégorie cachée : BlogListingPage Sauf mention contraire, le contenu de la communauté est disponible sous licence CC-BY-SA.'''
