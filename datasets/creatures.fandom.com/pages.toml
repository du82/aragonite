full_description = '''in: Development, Agents, File formats Agent Sign in to edit History Purge Talk (3) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> An agent is an object in Creatures 3 and other games based on its engine, such as Docking Station, Creatures Adventures and Creatures Playground. They are comparable to COBs from Creatures and Creatures 2. They consist of a set of CAOS scripts and their dependencies (such as sprites and sound files). C3 and the other games mentioned consist almost entirely of agents, including the interface and the Creatures themselves. Contents 1 Finding Agents 2 Characteristics 3 Agent files 4 Related links Finding Agents[] If you like an agent, why not add it to the list of known agents? Characteristics[] Each agent is identified by a (usually) unique three-part number (classifier) consisting of a family, genus, and species. Each one is more specific than the last; for instance, family might indicate 'creature', genus 'grendel', and species 'male'. CAOS scripts are associated with agents by these numbers. An agent's interactions in the world are characterised largely by its scripts: each classifier has particular event scripts attached to it, which fire when things happen to an agent using that classifier, and allow it to respond to the world. A specific agent is also characterised by its internal state - this consists of many variables, among them various pieces of physics data and 100 generic agent variables (OVxx). Agent files[] Files with the .agent extension contain an agent and its dependencies in a compressed format (PRAY). This is the usual method for distributing agents, as installing a single .agent file is much easier than moving many sprites and sounds to the corrent folders. To install an .agent file, simply place it in the "My Agents" folder inside the main Creatures 3 or Docking Station folder. The process of .agent file creation can be summarised as follows: Create a COS file that contains the scripts and installation routine you desire Create a PRAY template text document. This is used by the PRAY Builder to construct an agent file. Place the PRAY Builder, COS and template file in the same folder ... along with any files needed by the agents (sprites, sounds, etc) Run PRAY Builder and after a short time you will have a .agent file that can be placed in the 'My Agents' folder of Creatures 3. From the Creature Labs' Making Agents for Creatures 3 tutorial. Related links[] C1/C2 COBs "How To Add Agents To Docking Station" - http://www.youtube.com/watch?v=5JuXoglEtyY Categories Categories: Development Agents File formats Community content is available under CC-BY-SA unless otherwise noted.'''
