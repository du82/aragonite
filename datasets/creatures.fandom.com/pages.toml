hitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> A-life is short for Artificial life. This entails the study of artificial, simulated organisms - like Norns. A-life is different from Artificial Intelligence (AI) and Virtual life. As Steve Grand once put it: There's much more to intelligence than logic. Most of the AI pioneers were mathematical magicians and philosophers and to them, thinking was about logic, about reason. But it has to grow out of more primitive systems, and most intelligence is not logical. Most of the time we are not reasoning people. Dogs tend not to argue about syllogisms, but they still seem bright. Chuck IBM's Deep Blue chess computer and a dog into a pond, and see which one climbs out first. Which means that intelligence is grounded in survival. If you haven't got a reason to think, you won't think, and survival is what motivates us. [1] For more information, see the Wikipedia article on Artificial life. Categories Categories: Terms Community content is available under CC-BY-SA unless otherwise noted.'''
