full_description = '''français English Accueil Voir le texte source Historique Discussion (0) <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Bienvenue sur Creatures Wiki France - Un endroit où vous pourez découvrir le jeu de vie artificielle Creatures et trouver de nouveaux agents intéressants, des metarooms, des COBs, des outils Et plus encore pour vos norns. Si ce que vous cherchez n'est pas encore ici, vous pouvez aisément compléter ce site avec ce que vous connaissez dès maintenant. Faites un saut et faites de nouvelles pages ou éditez les 280 existantes. Faites d'abords un tour sur l'aide ! Vous ne pouvez pas le faire maintenant? Ajoutez nous à vos favoris (Ctrl+D). Creatures Wiki France en est encore à ses débuts, participez à la traduction du Wiki anglais. Un grand hommage ici à Creatures Wiki dont nous entreprenons la traduction pour les joueurs français de Creatures et à la communauté anglophone avec laquelle nous maintenons d'exellentes relations. So, if you speak english, vous pouvez aller voir et contribuer à son développement. Thank you all for all the help and the support you give us. Jeux Creatures Creatures 2 Creatures 3 Creatures Online Docking Station - Gratuit! Creatures Adventures Creatures Playground Suppléments Races : Norns - Ettins - Grendels - Geats Salles : Mondes - Metarooms- Environnements Objets : COBs - Agents Nourriture - Plantes - Animaux Machines - Distributeurs - Jouets Logiciels Autour des jeux Trucs, Astuces et Oeufs de Pâques Histoire de Creatures Histoire de Docking Station Chronologie - Interviews Groupes de développeurs Steve Grand Communauté CreaturesFrance Sites - CCSF Groupes Membres Lexique Humour Fiction - Art Fonctionnement Scripts CAOS Codes CAOS Formats de fichier Système de Classification Biologie Le Cerveau Creatures Wiki France Modèles d'article et d'habillage Projet de traduction Guide de Traduction Articles nécessitant une