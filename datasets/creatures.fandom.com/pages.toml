full_description = '''in: Creatures games, Creatures 3 English Français Creatures 3 Sign in to edit History Purge Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> The Shee Ark has a modular metaroom design Creatures 3 is the third game in the Creatures series. The game features a spaceship called the Ark with terrariums in which Albian environments have been recreated, and which the Shee have now abandoned. The ship can be docked with the free Docking Station addon to provide a link to transfer Creatures to other users through the Warp. This game is no longer available in the shops in its original form, but it can be purchased as part of the Windows-only Creatures Exodus for Windows, the Windows+Mac dual format Creatures Exodus for Mac OS X, or the Linux-only Creatures Internet Edition for Linux. Game Requirements[] Windows 95/98/ME/NT Pentium 200MMX or faster 4x speed CD-ROM drive or faster 16-Bit sound card 2MB 16-Bit color SVGA display adapter (800x600 resolution minimum) 32 Mb RAM (64 Mb recommended) 300Mb of free hard drive space Creatures 3 was not made to work on the Windows XP operating system. Though similiar, this operating system is different from Windows 95/98/ME and thus it may be unstable or refuse to work at all. However, some users have reported that things work fine as long as: The game / addon is installed by a user with complete administrator privileges. The game / addon is run only by a user with complete administrator privileges.So make sure that this is the case. You must install (or reinstall if already installed) under a Windows XP user that has complete administrator privileges. Also, the game can only run (be played) by a user with the same privileges - ie, complete administrator privileges. History[] Creatures 3 was widely anticipated prior to its release in November 1999; although many who were still bitter about the rushed release of Creatures 2 decided not to buy it, some later relented. There were indeed a few problems at launch, but not on the same scale as the last game; most notably, some of the norns did not use the full range of facial expressions available to them, and a new genome had to be released to fix this problem. Read the Creatures 3 Credits, or find out more about how the backdrop images were made (more here). Interesting facts[] The engine designed for Creatures 3 was actually released first in Creatures Adventures. Room list[] The rooms in Creatures 3 are: Bridge Engineering Norn Terrarium Jungle Terrarium Desert Terrarium Marine Terrarium The Crypt Learning Room Many other metarooms have been created as third-party addons - many of these require the use of the free Docking Station addon. Machines[] There are numerous machines all doing different things in C3. They may be linked together to do different things. Breed list[] Creatures 3 has the following creature breeds: Bruin Norn Bengal Norn Civet Norn Jungle Grendel Desert Ettin Docking Station breeds: ChiChi Norn Free breeds: Magma Norn Zebra Norn Fallow Norn Siamese Norn Astro Norn Harlequin Norn Creatures Mall breeds: Bondi Norn Treehugger Norn Toxic Norn Hardman Norn Banshee Grendel There is an extensive list of breeds for Creatures 3 (and Docking Station). Game information[] C3/DS CAOS Codes Related links[] Creatures 3 category Creatures Internet Edition Creatures Exodus External links[] Creatures 3 chemical list (backup) Creatures 3 in the gameinfo wiki, including a detailed guide Creatures3.com website (approved mirror) Gameware's Creatures 3 Downloads Free downloads for Creatures 3 including Magma Norns, Yule Pack, Grettin Switch, BioPellets and Update. Buy Creatures Exodus at GOG.com (Creatures 3 and Docking Station) Categories Categories: Creatures games Creatures 3 Languages Français Community content is available under CC-BY-SA unless otherwise noted.'''
