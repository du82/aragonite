title = "Classification system | Creatures Wiki | Fandom"
description = "Every agent in the Creatures series is classified within a hierarchy of types, which tells the engine what kind of object it is. The hierarchy includes three levels, family genus and species. For example, the spinning top is classified in the simple object family, in the toy genus, and it is the..."
full_description = '''in: Cleanup, Internals Classification system Sign in to edit History Purge Talk (8) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> This article could be cleaned up to make it more readable. Every agent in the Creatures series is classified within a hierarchy of types, which tells the engine what kind of object it is. The hierarchy includes three levels, family genus and species. For example, the spinning top is classified in the simple object family, in the toy genus, and it is the first species in that genus. Creatures only recognize broad categories, which correspond to the genus level, and cannot distinguish between objects beyond that level. This can be useful in terms of vocabulary and behaviour learning, as Creatures can learn one word and behaviour for a particular 'toy', and it will extend to all others (so that if it's nice to activate the ball, it's also nice to do it to the spinning top). Steve Grand initially saw this as 'cheating' when he made the first Creatures game, preferring a model in which Creatures learnt to generalise more naturally, but limitations of programming power and time have meant that this system has been used throughout the series. The class number is the family, genus and species written together: for example 2 13 1 is the class number for the spinning top, and 2 6 65 is the class number for the Breaded Hatchling Norn. Agents with exactly the same class number generally behave identically due to sharing scripts. In all Creatures games, family and genus range from 1 to 255. In C1, species has a maximum of 255, and in C2 and CEE-based games, species has a maximum of 65535. Numbers over the maximum wrap around (so species 268 in C1 is equivalent to 12). 0 in any part of the classifier acts as a wildcard (see ENUM, for instance). Lists of known C1 class numbers and C3/DS class numbers are maintained in addition to the overview below. Contents 1 Creatures 1 genus numbers 2 Creatures 2 genus numbers 3 Creatures 3/Docking Station genus numbers 4 Item ID numbers 5 External links Creatures 1 genus numbers[] 1 2 Simple objects System Call Button Invisible Herbs Eggs Food Drink Vendors Instruments ("music") Animals Hot Soothing ("shower") Toys Bigtoys Weeds 3 Compound objects Vehicle ("mover") Lift Computer A/V Equipment ("Fun") Cannon ("Bang") 4 Creatures Norns Grendels Ettins (third-party addon species) Shee (Geat in later games, third-party addon species) Creatures 2 genus numbers[] 1 2 System Call Button Nature Good Plant Creature Egg Processed Food Drinks and fountains Food dispensor Implements Cliff Edge Detritus Toys Weather Bad Plant Animal Nest Bad Bug Bug Bad Critter Critter Seeds Root Vegetables Flowers Fruit 3 Movers Lifts Computers Fun Messages LeftRight Incubators Teleporters Machines 4 Norn Grendel Ettin Geat Creatures 3/Docking Station genus numbers[] 1 Invisible to norns User interface and system parts Favourite place signposts Favourite place icons 2 Hand Door Seed Good plant Bad plant Leaf Flower Good Fruit Bad Fruit or Manky Detritus Food Button or Switch Good Bug Bad Bug or Pest Good Critter Bad Critter or Beast Nest Agent Egg Weather Bad Toy Incubator Vendor Tool Potion 3 Lift Teleporter Machinery Creature Egg Norn Home Grendel Home Ettin Home Gadget Portal 4 Norn Grendel Ettin Geat(?) Other classes can be used, but by default they have no help name, and creatures cannot see them; you can change this, but it involves editing game files, and is therefore quite tricky to do multiple times without knowledge of how the game works - so is not good for players. Item ID numbers[] Creature genes (e.g. instincts) use a different set of numbers than the list above to identify objects. 0 : Self Hand Door Seed Plant Weed Leaf Flower Fruit Manky Detritus Food Button Bug Pest Critter Beast Nest Animal egg Weather Bad Toy Incubator Dispenser Tool Potion Elevator Teleporter Machinery Creature egg Norn home Grendel home Ettin home Gadget Portal Vehicle Norn Grendel Ettin Something (Geat) External links[] C3/DS classifiers list over at the Creatures Developer Network - NOTE: This list is not an accurate list of all agent classifiers! A few agents, especially recent ones are missing from the list. Also it does not list what ranges are 'owned' by who, and so choosing a classifier based on the information there could cause a clash! Bibbleworld's Script reservation System - IF you are new to CAOS coding, you will need to get a range here. Classification and clashing - The very basics of the the Creatures Classification System Categories Categories: Cleanup Internals Community content is available under CC-BY-SA unless otherwise noted.'''
