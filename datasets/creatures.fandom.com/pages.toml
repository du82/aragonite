["https://creatures.fandom.com/fr/wiki/Agent"]
title = "Agent | Creatures Wiki France | Fandom"
description = "Un agent est un objet dans Creatures 3 et dans les autres jeux basés sur son moteur, tel que Docking Station, Creatures Adventures ou Creatures Playground. Ils sont comparables aux COBs de Creatures et Creatures 2. Ils consistent en un ensemble de scripts CAOS et de leurs dépendances (comme les sprites ou les fichiers sons). C3 et les autres jeux mentionnés sont entièrement constitués d'agents, y compris l'interface et les Créatures elles-même. Si vous aimez un agent, pourquoi ne pas l'ajouter à"
full_description = '''dans : Agents, Développement, Formats de fichier Agent Se connecter pour modifier Historique Discussion (0) <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Un agent est un objet dans Creatures 3 et dans les autres jeux basés sur son moteur, tel que Docking Station, Creatures Adventures ou Creatures Playground. Ils sont comparables aux COBs de Creatures et Creatures 2. Ils consistent en un ensemble de scripts CAOS et de leurs dépendances (comme les sprites ou les fichiers sons). C3 et les autres jeux mentionnés sont entièrement constitués d'agents, y compris l'interface et les Créatures elles-même. Sommaire 1 Trouver un agent 2 Caractéristiques 3 Fichiers agent 4 Liens internes Trouver un agent[] Si vous aimez un agent, pourquoi ne pas l'ajouter à la liste des agents connus ? Caractéristiques[] Chaque agent est identifé par un nombre à trois parties nommées family, genus, et species. Chacune étant plus spécifique que la précédente ; par exemple, family pourrait indiquer 'creature', genus 'grendel', et species 'male'. Les scripts CAOS sont associés aux agents selon ces nombres. Accessoirement, '0' peut être utilisé pour insérer un joker. Chaque agent possède cent variables définies par l'utilisateur de la forme OV00, OV01, ... jusqu'à OV99. Auquelles il faut ajouter les valeurs correspondant à la vitesse, à l'acceleration due à la gravité, à la friction, etc. Fichiers agent[] Les fichiers ayant l'extension .agent contiennent un agent et ses dépendances compressés au format (PRAY). C'est la méthode de standarde de distribution des agents, dans la mesure où installer un unique fichier .agent est plus simple que de ranger les sprites et les fichiers son à leurs emplacement respectifs. Pour installer un fichier .agent, il suffit de le placer dans le dossier "Mes Agents" du répértoire de Creatures 3 ou de Docking Station. La création d'un fichier .agent peut se résummer ainsi : Creez un fichier COS contenant les scripts et le programme d'installation désiré. Creez un document PRAY template. Il est utilisé par le PRAY Builder pour construire le fichier .agent. Placez le PRAY Builder et les fichiers COS et template dans le même répertoire avec tous les autres fichiers utilisés par l'agent (sprites, sons, etc.) Lancez PRAY Builder et après un court insant, vous obtenz un fichier .agent que vous pourrez placer dans le dossier 'Mes Agents' de Creatures 3. D'après the Creature Labs' Making Agents for Creatures 3 tutorial. Liens internes[] C1/C2 COBs Liste des catégories Catégorie : Agents Développement Formats de fichier Sauf mention contraire, le contenu de la communauté est disponible sous licence CC-BY-SA.'''
