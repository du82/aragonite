["https://creatures.fandom.com/fr/wiki/Aide:Aide"]
title = "Creatures Wiki France:Aide | Creatures Wiki France | Fandom"
description = "Pour l'instant, nous nous référons à l'aide de Wikipedia qui a le même fonctionnement que le notre. Merci donc de passer sur leur aide pour comprendre comment complèter Creatures Wiki France. Pour..."
full_description = '''Creatures Wiki France:Aide Se connecter pour modifier Historique Discussion (0) <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Pour l'instant, nous nous référons à l'aide de Wikipedia qui a le même fonctionnement que le notre. Merci donc de passer sur leur aide pour comprendre comment complèter Creatures Wiki France. Traduction de Creatures Wiki:Help[] Pour apprendre à utiliser Mediawiki, le logiciel utilisé par ce wiki, rendez vous sur le Manuel de MediaWiki Il y a d'autre petites aides : Pour apprendre à faire des modifications, passez sur le Bac à sable. Ouvrez le dans un nouvel onglet ou une nouvelle fenètre pour pouvoir toujours visualiser cette page. Vous pouvez modifier n'importe quelle page en cliquant sur l'onglet modifier en haut de chaque page. Faites le si vous voulez ajouter une information ou corriger une erreur. Vous pouvez aussi voir la syntaxe du wiki en modifiant un article. Faites tout de même attention à ne pas sauvegarder si vous ne le voulez pas. Quand vous voyez un lien rouge, vous pouvez créer un nouvel article. Vous pouvez aussi simplement ajouter le nom de l'article dans la barre d'adresse après /index.php/ ou /wiki/. Il est possible de créer un lien dans le bac à sable et cliquer dessus. Pourquoi pas commencer avec un article demandé ou une ébauche ? Pour lier une page (même si elle n'existe pas encore), écrivez le copmme suit : [[Nom de l'article]]. La casse est modifiable exepté pour la première lettre. Pour rediriger une page vers une autre (utile pour les différentes façons de nommer les choses), écrivez ceci : #REDIRECT[[Autre article]] Ecrivez vos pluriels comme suit à moins que l'article soit au pluriel : [[Article]]s Pour avoir un texte différent sur le lien, écrivez : [[Article|description]] Vous pouvez utiliser aussi des images, mais vous devrez d'abord vous identifier et Copier le fichier sur le serveur. Ajoutez l'image avec [[Image:nom de l'image.png|left,right ou rien|frame ou thumb(si vous voulez un cadre ou une réduction, sinon ne mettes rien)|Description]] Exemples : [[Image:Wiki.png|left|frame|C'est le logo de [[Creatures Wiki]] ! ]] [[Image:Imagetest.png|right|Ce texte n'apparait que si vous passez votre curseur sur l'image]] Pour mettre un article dans une catégorie, écrivez ceci n'importe où : [[Catégorie:Nom de la catégorie]] Si vous le faites dans une page de catégorie, cela définit cette catégorie comme étant une sous catégorie. Ex : Dans Catégorie:Chose vous inscrivez [[Catégorie:Machin]]. Ainsi Chose sera une sous catégorie de Machin. Pour lier une catégorie dans un article, utilisez [[:Catégorie:Quelquechose|catégorie quelquechose]] Si vous avez fait une modification qui ne vous plait pas, cliquez sur l'onglet historique, cliquez sur la date de la version précédente, cliquez sur l'onglet modifier et enfin, sauvegardez cette version. Si vous avez besoin de signer votre nom, utilisez ~~~, ou ~~~~ pour y inclure la date. Vous ne devriez normalement pas l'utiliser à moins que vous ne parliez sur une page de discution. S'il vous plait, rappelez vous de cliquer d'abord sur Prévisualisation avant de sauvegarder. Vérifiez tous vos liens ! Si vous avez besoin d'aide ou de parler à quelqu'un, posez votre question sur une des pages de discution d'un des Administrateurs. Sauf mention contraire, le contenu de la communauté est disponible sous licence CC-BY-SA.'''
