description = "Another year has sped past without having any free time for myself. The contract I'm going all out for at work at the moment is nearly complete, although of course it keeps spilling over in the..."
full_description = '''in: Blog posts November, How Time Flies Don • 13 November 2010 • User blog:Don <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Another year has sped past without having any free time for myself. The contract I'm going all out for at work at the moment is nearly complete, although of course it keeps spilling over in the usual way as more things get added and changed. I had been looking forward to getting a lot of stuff sorted in the Creatures world this year, but sadly it all seems to be getting postponed by necessity. I'm still hoping for a little down time before Christmas though, if I can press on now. Let's hope I find some freedom soon. Categories Categories: Blog posts Community content is available under CC-BY-SA unless otherwise noted.'''
