full_description = '''in: Websites Creatures Caves Sign in to edit History Purge Talk (0) (function () { // we can't use mw.config here because it's too early so we need to pass this data in different way const videoDetails = { mapping: {"mediaId":"CR0MZ2ZP","connatixPlaylistId":"fa733fa7-0131-48d3-a444-611bc76031fe","impressionsPerSession":3,"isDefaultMapping":true}, impressionsPerSession: 3, }; const videoBridgeCountries = ["AE","AG","AL","AM","AR","AT","AU","AZ","BA","BB","BD","BG","BH","BN","BO","BR","BS","BY","CA","CH","CL","CN","CO","CR","CU","CY","CZ","DE","DK","DO","DZ","EC","EE","EG","ES","FI","FR","GB","GE","GF","GG","GH","GP","GR","GT","GU","GY","HK","HN","HR","HU","ID","IE","IL","IM","IN","IQ","IR","IS","IT","JE","JM","JO","JP","KE","KG","KH","KR","KW","KY","KZ","LA","LB","LK","LT","LU","LV","LY","MA","MD","ME","MK","MM","MN","MO","MQ","MT","MU","MV","MX","MY","NG","NI","NO","NP","NZ","OM","PA","PE","PH","PK","PL","PR","PS","PT","PY","QA","RE","RO","RS","RU","SA","SC","SE","SG","SI","SK","SV","TD","TH","TN","TR","TT","TW","UA","US","UY","UZ","VE","VI","VN","ZA","ZW"]; const tier3VideoBridgeCountries = ["GB","BE","NL","DE","AU","MX","AR","FR","MD","CA","ES","IT","PE","CO","CL","NZ"]; let hasVideoOnPage = null; function getCookieValue(cookieName) { const cookieSplit = ('; ' + document.cookie).split('; ' + cookieName + '='); return cookieSplit.length === 2 ? cookieSplit.pop().split(';').shift() : null; } function hasMaxedOutPlayerImpressionsInWiki() { const impressionsSoFar = Number(getCookieValue('playerImpressionsInWiki')) || 0; const allowedImpressions = Number(videoDetails.impressionsPerSession); return impressionsSoFar >= allowedImpressions; } function getCountryCode() { try { return JSON.parse(decodeURIComponent(getCookieValue('Geo'))).country.toLowerCase(); } catch { return null; } } function isVideoBridgeAllowedForCountry() { const countryCode = getCountryCode(); if (!countryCode) { return false; } // If it's a default mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Web address: http://www.creaturescaves.com/ Webmaster: Rascii Contributors/Staff: angel51431, Astro, AquaShee, C-Rex, DarbyDoo, Deskman, Don, edash, Erin, Ghosthande, Grendel Man, Gryph, Jessica, Karias, kezune, Laura, Malkin, Moe Ran from/to dates: 2000 - Current Contents 1 Summary Of Content 2 History Of Website 3 Staff 3.1 Current Staff 3.2 Former Staff (Incomplete) 4 Interesting Facts Summary Of Content[] Just about everything a community portal site needs - forums, artwork, links, a CC Chat applet, news, fan-art, wallpapers and a downloads gallery with metarooms, COBs and agents. Also features the Ask Laura column and an archive of CAOS Chaos. History Of Website[] It all began many years ago with AOLPress and a really bad server called Angelfire. A small, ugly website with a picture of a cave as the background and basically no content, Creatures Caves had probably zero visitors. Shortly after, there was a revamp done in Frontpage and the website moved to Geocities. The blue scheme was unveiled and has stuck with the website ever since. A white background and bad coding were some of the downsides to this version of the website, but it was certainly an improvement. Millennium Creatures, HomeCreatures, and Sharon's Creatures Village were the main community sites at this point and completely overshadowed the small, only HTML site. In 2001 the site was revamped yet again, this time with tons of little graphics and a very clean color scheme. (You can view an archived version of this design here.) Focusing mostly on content and still completely HTML, the website had moved to it's own domain () and was now hosted by DirectNIC, the company that registered the domain. This company did not allow PHP or HTML but did allow SSL which made the site easier to update. The webmaster realized that in order to keep up with the huge sites in the community, a dynamic design was a necessity. A year after that, Creatures Caves moved to WorldZonePro, a paid hosting company that allowed both PHP and MySQL, as well as everything else that Rascii could possibly ask for. With help from JacketFan, Dan, Helen, and a few others, the webmaster was able to conquer the programming language and open the first PHP version of Creatures Caves. The design had some further improvements and forums were opened for the first time. They were hand-coded and full of bugs, but that was okay. Any place to discuss was fine. Creatures Caves underwent a revamp on 1 August 2012 which includes a new colour scheme and a new logo to fit in with the new Creatures game, Creatures 4 due out in mid 2013, in addition to an array of new features such as commenting on downloads and news posts. Staff[] Currently the staff levels are Super Administrator, Administrator, Manager and Moderator. There used to be a Staff Member level. The Staff Member level had a brief comeback in 2013, but was replaced by the user title system shortly thereafter. Current Staff[] Rascii: Super Administrator/Site owner Laura: Administrator Ghosthande: Manager Malkin: Manager C-Rex: Moderator DarbyDoo: Moderator Grendel_Man: Moderator Jessica: Moderator kezune: Moderator Former Staff (Incomplete)[] angel51431 Astro AquaShee Deskman Don edash Erin Gryph Karias Moe Interesting Facts[] As of 1/5/2005, the most users ever online at once was 22 on 7/19/2003. GreenReaper made the 11000th forum post on 7 May 2005 Creatures Caves user Jacob created Creatures Caves Day Creatures Caves has a Facebook page. Categories Categories: Websites Community content is available under CC-BY-SA unless otherwise noted.'''
