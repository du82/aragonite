mapping, then check the country whitelist from the default mapping. if (videoDetails?.mapping?.isDefaultMapping) { // If the wiki is classified as a tier3 wiki, then check the country whitelist from the tier3VideoBridge whitelist. const allowedCountriesForTier3Wikis = tier3VideoBridgeCountries.map(function (allowedTier3CountryCode) { return allowedTier3CountryCode.toLowerCase(); }) return allowedCountriesForTier3Wikis.indexOf(countryCode) !== -1; } else { // If not a default mapping wiki (so it's a wiki mapping), then check the country whitelist from the videoBridge whitelist const allowedCountries = videoBridgeCountries.map(function (allowedCountryCode) { return allowedCountryCode.toLowerCase(); }); return allowedCountries.indexOf(countryCode) !== -1; } } window.fandomIsVideoPossible = function () { if (hasVideoOnPage === null) { hasVideoOnPage = videoDetails.mapping && isVideoBridgeAllowedForCountry() && !hasMaxedOutPlayerImpressionsInWiki(); } return hasVideoOnPage; }; window.canPlayVideo = function () { return window.fandomIsVideoPossible() }; if (!window.canPlayVideo()) { document.body.classList.add('no-featured-video'); } else { document.body.classList.add('has-featured-video'); } })(); <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6XD44P" height="0" width="0" style="display:none;visibility:hidden"></iframe> Creatures Release Date(s) 24 July 1996 Platform(s) Windows and Macintosh System Requirements see Game Requirements Creatures is the first game in the Creatures series (full listing). The game is no longer available by itself, but can be purchased as part of Creatures: The Albian Years. The word Creatures is also used in plural to refer to the A-life animals which are the focus of the games. Creatures, the Game[] A hatching Norn The original Creatures game was set in Albia. It featured Norns, Grendels, and a few minor inhabitants of Albia Creatures Introduction The Creatures Introductory Video to occupy the player's creatures. There was no set objective - although players were given a "score" in the Performance Kit, no restrictions were placed on gameplay, and breeders, COBblers, and even norn torturers were free to pursue their own objectives. The game was limited by the technology of 1996, being restricted to a 256-colour palette (background images are available at C2 Back), bamboo architecture and occasional background sounds rather than the ambient music which evolved in later titles. Read the Creatures Credits. Game Requirements[] Creatures was published for two platforms - Windows 3.1/95, and Mac OS 7.5 Original Windows System Requirements[] Windows 3.1 or Windows 95 Pentium 60 or faster Double Speed CD-ROM (300k/sec) 16-bit Sound Card 256 Colours @640x480 8MB RAM & 40MB of hard drive disk space Windows NT/2k/XP compatibility is possible through an installer patch and upgrading to at least Creatures 1.02. A version of Creatures: The Albian Years may be purchased from GOG.com, which is designed to work on newer Windows systems, such as Windows Vista and Windows 7. Official Breeds[] Banana Norn White Haired Pixie Norn Horse Norn Santa Norn '96 Purple Mountain Norn Forest Norn Ron Norn Santa Norn '97 Classic Grendel Interesting Facts[] A real model was used to create the Albian backdrop in Creatures. The original boxed edition of the game was accompanied by a helpful booklet, The Chronicles of Nornia. Creatures was first pitched by Steve Grand in the form of a 'Mouse for Windows' - a little desktop pet that would need to be fed and watered, and who would interact with the desktop icons and windows. Millennium didn't bite. A second attempt at a pitch was dubbed 'Little Computer Ewoks' (compare Little Computer People) by Steve Grand himself, for lack of a better name. It is interesting to note that this proposal appears to be the earliest manifestation of Creatures as we know it today. It also interesting to note that the phrase 'Little Computer Ewoks' was also used by Erin's father when he was first shown the game! The development title for Creatures was eventually set to 'Small Furry Creatures' - the game also became known as 'Creatures 1' (or just 'C1') after Creatures 2 was (eventually) released. Creatures was first envisaged and developed as a top-down adventure/RPG game set in the Amazon, where the player would find an abandoned Norn community; much time was spent on this before deciding to base the game around the A-life concept itself (See Vanimals) The final design of the Norn as we know it is actually quite different that the original: Steve Grand originally imagined Norns to be 'gawky and awkward' - early images of Norns even resembled chickens! Grendels were originally described as monsters, resembling huge, titanium spiders, complete with eight eyes and a voracious appetite for Norns. Eek! As aging and disease was introduced late in the game (See history), the death of Norns was meant to be enforced by a gene... however, the gene misfired and had no effect! Norns died through illness though, as originally intended, which greatly pleased Steve Grand. (Tarlia later created the Edited C1 Genomes, which included a working "die of old age" gene.) The music from the title movie ended up as part of a published CD from the Cyberlife musician Andrew Barnabas - You can listen to the extended version of the Creatures Montage! Related links[] Macintosh Creatures Creatures 1 category External links[] Creatures History as told by Steve Grand Mythology behind Creatures Wikipedia article on Creatures Review of Creatures Categories Categories: Creatures Games Creatures Languages Français Community content is available under CC-BY-SA unless otherwise noted.'''
