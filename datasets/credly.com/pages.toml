["https://www.credly.com/docs/badge_templates_extended"]
title = "Badge Templates (Extended) - Developer API - Credly"
description = "Credly is a global Open Badge platform that closes the gap between skills and opportunities. We work with academic institutions, corporations, and professional associations to translate learning outcomes into digital credentials that are immediately validated, managed, and shared."
full_description = '''Badge Templates (Extended) Create a Badge Template An image, at least three skills, criteria URL (global_activity_url), and at least one activity (badge_template_activities) are required. Note that the method used to send an image in the request body uses a remote url, however one can also send the image as Base64 encoded data. Documentation on how to include image data as part of the request body can be found in the Badge Template Images section. Request POST /organizations/<organization_id>/badge_templates Request Body { "image": { "remote_upload_url": "https://cdn.example.com/path/to/image.png" }, "alignments": [ { "name": "Educational Standard Name", "url": "https://www.example.com/educational_standard_details", "description": "Consectetur adipisicing elit, sed do eiusmod tempor." } ], "description": "Fencing club champion.", "global_activity_url": "https://www.example.com/bar", "name": "Fencing", "cost": "Paid", "level": "Advanced", "lock_badge_state": false, "time_to_earn": "Years", "translatable": false, "type_category": "Experience", "recommendations": [ { "title": "foo", "type": "information", "activity_url": "http://www.example.com/recommendation" } ], "skills": [ "Fencing" ], "badge_template_activities": [ { "activity_type": "Award", "title": "Placed in annual tournament", "activity_url": "https://www.example.com/award" }, { "activity_type": "Badge", "required_badge_template_id": "e37c0539-5039-47ee-9b44-82dad63f8d59" } ] } Response 201 Created Location: <badge_template_url> { "data": { "id": "804c7c23-d414-4e01-a5b3-d4b66d0fd758", "allow_duplicate_badges": false, "cost": "Paid", "description": "Fencing club champion.", "default_expires_at": null, "default_expires_at_date": null, "default_expires_at_type": null, "earn_this_badge_url": null, "enable_earn_this_badge": false, "enable_detail_attribute_visibility": true, "global_activity_url": "https://www.example.com/bar", "level": "Advanced", "lock_badge_state": false, "name": "Fencing", "state": "active", "public": true, "badges_count": 0, "recipient_type": "User", "send_expiring_badge_notifications": false, "settings_enable_related_badges": true, "show_badge_lmi": false, "show_lmi_jobs": false, "show_skill_tag_links": true, "vanity_slug": "fencing", "record_to_blockchain": null, "time_to_earn": "Years", "translatable": false, "type_category": "Experience", "printing_disabled": false, "visibility": "public", "variants_allowed": false, "variant_type": null, "allow_delete": true, "allow_archive": false, "available_locales": [ ], "only_one_skill_required": false, "criteria_url_name": null, "criteria_url": null, "certification": true, "state_updated_at": null, "created_at": "2014-04-01T14:41:00.000Z", "updated_at": "2014-04-01T14:41:00.000Z", "show_template_settings": true, "get_issue_count": 0, "image": { "id": "d2e58f21-76f5-4f42-8d43-74cba0db25aa", "url": "https://cdn.example.com/path/to/image.png" }, "image_url": "https://cdn.example.com/path/to/image.png", "url": "https://www.credly.com/org/organization-1/badge/fencing", "owner": { "type": "Organization", "id": "365d1819-2da0-4fdf-b769-288beb465a01", "name": "Organization 1", "url": "https://api.credly.com/v1/organizations/365d1819-2da0-4fdf-b769-288beb465a01", "vanity_url": "https://www.credly.com/org/organization-1", "vanity_slug": "organization-1", "verified": true, "viewable": true }, "alignments": [ { "id": "f44d695c-0261-454b-8e4b-199bac4a4a5a", "name": "Educational Standard Name", "url": "https://www.example.com/educational_standard_details", "description": "Consectetur adipisicing elit, sed do eiusmod tempor." } ], "recommendations": [ { "id": "05aa9552-67a9-4d31-8170-52d65485feb7", "title": "foo", "type": "information", "activity_url": "http://www.example.com/recommendation" } ], "required_badge_templates": [ ], "badge_template_activities": [ { "id": "af035331-2bbf-48c7-adc3-86c15f1be5a7", "title": "Placed in annual tournament", "activity_type": "Award", "activity_url": "https://www.example.com/award", "required_badge_template_id": null }, { "id": "571eca70-c8c5-4976-81df-d9ba6eac0d97", "title": "Badge Template 2", "activity_type": "Badge", "activity_url": null, "required_badge_template_id": "bbd1413f-a174-42b6-8be4-fe4701763040", "required_badge_template_name": "Badge Template 2", "required_badge_template_url": "https://www.credly.com/org/organization-1/badge/badge-template-2" } ], "skills": [ "Fencing" ], "reporting_tags": [ ] }, "metadata": { } } Badge Template Images Published Badge Templates require an image. Images can be sent via curl or a multipart-aware library such as HTTMultiParty. Images can also be sent via a JSON payload. For example: curl -u 'YiGpgYUfl5lTAmDDa5T2':'' \ -F description="The earner of this badge won the fencing club championship." \ -F name="Fencing Club Champion" \ -F image=@fencing.png \ https://api.credly.com/v1/organizations/99/badge_templates To send an image via a url. Set the image param in your JSON payload to a hash { remote_upload_url: <remote_upload_url> }. Be sure to prepend the scheme, http:// or https://, to your url. //Badge Template Request Body { "image": { "remote_upload_url": 'https://cdn.example.com/path/to/image.png} //rest of payload } To send an image via a data uri. Set the image param in your JSOn payload to a hash { remote_upload_url: data:image/png;base64,<base64_encoded_data> }. //Badge Template Request Body { "image": { remote_upload_url: 'data:image/gif;base64,' + <base64_encoded_data> } //rest of payload } Badge Template Enumerated Attributes Several Badge Template attributes take values from lists, they are: Attribute Possible Values cost Free, Paid level Foundational, Intermediate, Advanced time_to_earn Hours, Days, Weeks, Months, Years type_category Experience, Learning, Validation, Certification Badge Template Recommendations When creating or updating a Badge Template, recommendations may be included in the outgoing data. Recommendations are related badges or URLs -- "next steps" the user can consider after earning a badge. Including this section when updating will replace the entire list of Recommendations. However, Recommendations created by other issuers will not be changed. (Note: the ability for multiple issuers to add recommendations to the same template may not yet be supported). The example below ennumerates the three ways to add a recommendation: 1. By id. This will add an already-created recommendation to the Badge Template (see the Recommendations API. 2. By Badge Template id. This will use an already-created recommendation if one exists, or create a new one based on the given template id. This type recommends another badge template as the "next step." The recommended_badge_template_id property is required. All other properties will be derived from the badge template. 3. By type. This will use an already-created recommendation if one exists, or create a new one. These types recommend a URL as the "next step." The type, activity_url and title properties are required. description is optional. Valid types include: - badge - information - education - employment - participation - offer { "data": { "recommendations": [ { "id": "670e7174-4a04-4e80-8ebb-6369c406990d" }, { "recommended_badge_template_id": "8c982b0f-bf24-4281-839a-0ddfc6a2c809" }, { "type": "information", "activity_url": "http://example.com", "title": "Sample recommendation", "description": "Recommendation description" } ] } } Update a Badge Template Request PUT /organizations/<organization_id>/badge_templates/<badge_template_id> Request Body { "image": { "remote_upload_url": "https://cdn.example.com/path/to/image.png" }, "alignments": [ { "name": "Educational Standard Name", "url": "https://www.example.com/educational_standard_details", "description": "Consectetur adipisicing elit, sed do eiusmod tempor." } ], "description": "Fencing club grand champion.", "global_activity_url": "https://www.example.com/biz", "name": "Fencing", "owner_id": "1b60d19e-b024-4c7b-aa82-722f3267a7b1