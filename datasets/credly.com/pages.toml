title = "Badge Templates - Developer API - Credly"
description = "Credly is a global Open Badge platform that closes the gap between skills and opportunities. We work with academic institutions, corporations, and professional associations to translate learning outcomes into digital credentials that are immediately validated, managed, and shared."
full_description = 'Badge Templates Get Badge Templates Request GET /organizations/<organization_id>/badge_templates Query Param Description filter=<filter> Gets badge templates that match the specified filter sort=<sort> Sorts the results based on the sort parameter page=<page_number> Gets the specified page of badge templates Filtering The filter parameter has the following format: key::value. You can combine keys for stricter searches, e.g. state::active|query::archery. Results can be filtered with the following keys: Key Description query Partial matches on badge template name or description name Partial matches on badge template name or strict match by enclosing value in double-quotes public Matches badge templates that are public true or not false reporting_tags Matches on reporting tags as a comma delimited list recommendation_ids Matches on recommendation ids as a comma delimited list skills Matches badge templates matching any of the skills specified as a comma delimited list state Matches badge templates in the specified state as a comma delimited list (active, archived, draft) created_at_min Matches badge templates created on or after the specified date (YYYY-MM-DD) created_at_max Matches badge templates created on or before the specified date (YYYY-MM-DD) updated_at_min Matches badge templates where updated on or after the specified date (YYYY-MM-DD) updated_at_max Matches badge templates where updated on or before the specified date (YYYY-MM-DD) owner_id Matches badge templates owned by the given organization; allows multiple IDs delimited by comma collection_id Matches badge templates in the given collection; allows multiple IDs delimited by comma Sorting The sort parameter has the following format: key1|key2. You can optionally include a - to indicate descending order. e.g. -name would return results in reverse-alphabetical order. Results can be sorted with the following keys: Key Description badges_count Number of times the badge template has been is