title = "Issued Badges - Developer API - Credly"
description = "Credly is a global Open Badge platform that closes the gap between skills and opportunities. We work with academic institutions, corporations, and professional associations to translate learning outcomes into digital credentials that are immediately validated, managed, and shared."
full_description = '''Issue a Badge Issue a Badge Please note that an archived badge template cannot be used to issue new badges. Duplicate Badges A badge is considered a duplicate if it shares the same badge_template as another badge and if it fulfills one or more of the following criteria: Has the same recipient_email Issued to the same user Has the same issuer_earner_id Duplicate badges cannot be issued by default. However, organization admins can allow earners to receive duplicate badges from a particular badge template via editing the badge template settings. Required Fields recipient_email issued_to_first_name issued_to_last_name badge_template_id issued_at Optional Fields issued_to_middle_name the user's middle name issuer_earner_id allows you to attach your own system's user ID to a badge for recordkeeping. The issuer_earner_id will be returned in API calls and in reports, but it will not be shown to the user on the Credly site. Default: null locale allows you to define the language badge notification emails will be sent in. Available locales include: "en", "fr", "de", "ko", "ja", "zh-CN", "pt", "es-ES", "es-US", "fr-CA", "pt-BR". Default: "en" suppress_badge_notification_email prevents Credly from sending notification or reminder emails to the user about this badge. This allows you to send your own badge notification to the user without sending a duplicate email. Default: false. expires_at allows you to specify an expiration date for the badge. If left null the badge template's default expiration is used. Set this to false to indicate "no expiration". country_name allows you to indicate what country the earner of this badge is from state_or_province allows you to indicate what state or province the earner of this badge is from evidence Request POST /organizations/<organization_id>/badges Request Body { "recipient_email": "user1@example.com", "badge_template_id": "cfaf2910-ea5f-46f1-89a5-db525dad6e58", "issued_at": "2014-04-01 09:41:00 -0500", "issued_to_first_name": "Earner First Name", "issued_to_last_name": "Earner Last Name", "expires_at": null, "issuer_earner_id": "abc123", "locale": "en", "suppress_badge_notification_email": false } Response 201 Created Location: <badge_url> { "data": { "user": { "id": "08cba456-8063-4001-a6d9-9ad7a8e8bd6e", "email": "08cba456-8063-4001-a6d9-9ad7a8e8bd6e@example.com", "first_name": "Alfred", "middle_name": "Beaker", "last_name": "Skiles", "current_position_name": "*****", "current_organization_name": "*****", "confirmed": true, "photo": null, "photo_url": null, "url": "https://www.credly.com/users/alfred-beaker-skiles" }, "created_by": { "type": "Organization", "id": "e6eda68e-e3b9-4824-8176-2ea8d74570f7", "name": "Organization 267", "url": "https://api.credly.com/v1/organizations/e6eda68e-e3b9-4824-8176-2ea8d74570f7", "vanity_url": "https://www.credly.com/org/organization-267", "internationalize_badge_templates": false, "share_to_ziprecruiter": true, "twitter_url": "https://twitter.com/example", "verified": true }, "issuer": { "summary": "issued by Organization 267", "entities": [ { "label": "Issued by", "primary": true, "entity": { "type": "Organization", "id": "e6eda68e-e3b9-4824-8176-2ea8d74570f7", "name": "Organization 267", "url": "https://api.credly.com/v1/organizations/e6eda68e-e3b9-4824-8176-2ea8d74570f7", "vanity_url": "https://www.credly.com/org/organization-267", "internationalize_badge_templates": false, "share_to_ziprecruiter": true, "twitter_url": "https://twitter.com/example", "verified": true } } ] }, "printing_enabled": false, "print_method": null, "badge_template": { "primary_badge_template_id": null, "variant_name": null, "id": "a5396cfb-7c87-4982-b830-82973564fe26", "allow_duplicate_badges": true, "description": "Dynamically deliver go forward e-tailers", "default_expires_at": null, "default_expires_at_date": null, "default_expires_at_type": null, "earn_this_badge_url": null, "enable_earn_this_badge": false, "enable_detail_attribute_visibility": true, "global