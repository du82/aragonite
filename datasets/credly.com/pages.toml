["https://www.credly.com/docs/webhooks.md"]
title = "Webhooks - Developer API - Credly"
description = "Credly is a global Open Badge platform that closes the gap between skills and opportunities. We work with academic institutions, corporations, and professional associations to translate learning outcomes into digital credentials that are immediately validated, managed, and shared."
full_description = '''Webhooks Overview You can use webhooks to receive information about events that happen in Credly. For example, you can use webhooks to be informed when a user accepts or rejects a badge on Credly. A full list of event types is below. When an event occurs, Credly creates an Event object to keep track of the type of event, the time when it occurred, and the data associated with the event. If configured, Credly will post the event information to your server via an HTTPS POST request. When sending webhooks, Credly will wait for a success response for a short time, after which the delivery will be considered a failure, and the event will re-queued for later delivery. We recommend using a message queue or other means of processing webhooks asynchronously, to maximize the reliability and timeliness of webhook deliveries. Configuration Requirements There are four requirements to enable webhooks: You must create a page on your website or server that can receive an HTTPS POST request from Credly. This page must be publicly visible (as to be accessible by Credly's servers), and it should be configured to receive JSON data via HTTPS POST. Your endpoint must use a valid signed SSL certificate. Your OAuth application must have data services enabled. Your customer success manager can ensure this is enabled for you. You must update your organization profile to specify the webhook_url attribute. Credly will post a JSON object to the URL you specify whenever an event occurs. Finally, to choose which events to receive webhook notifications for, navigate to organization management and select "Developers" > "Webhooks". Here you will see all available webhooks and you can choose which ones to subscribe to. Receiving Events After completing the requirements above, Credly will automatically begin posting events to your server. Your server must return an HTTP status code of 200 to indicate that the webhook was received. If Credly receives any other status code or no response, the webhook will automatically be retried at progressively less frequent intervals up to 25 days after the first attempt. The JSON object that Credly posts to your webhook_url will be a summary of the event and contain the following attributes: { "id": "628fcaa9-cfd3-4a9b-aa62-9973ac938ad6", "organization_id": "a0d325d9-d8cb-466f-b515-c767949f7e9a", "event_type": "badge.created", "occurred_at": "2014-04-01T14:41:00Z" } You can then fetch the event object from Credly's servers using the id attribute of the payload above by making a request to GET /organizations/<organization_id>/events/<event_id> The response will be a 200 OK and the shape of this response will vary depending on the event type. You can also list all events for an organization by making a request to GET /organizations/<organization_id>/events[?page=1] At most 50 results are returned at a time. Include an optional page parameter to fetch the next page of results. Event Types Credly will notify you about the following events: badge.created: This event is triggered whenever a badge is issued. A badge might be created via the web service or via the Credly user interface. badge.deleted: This event is triggered whenever a badge is deleted. This should rarely occur. Usually a badge will change its state to revoked or replaced instead. badge.privacy.changed: This event is triggered whenever a user changes the privacy setting for a badge. badge.state.changed: This event is triggered whenever the state of a badge changes. When the user accepts a badge, for example, the state changes from pending to accepted. badge_template.created: This event is triggered whenever a badge template is created. badge_template.changed: This event is triggered whenever a badge template is changed. badge_template.deleted: This event is triggered whenever a badge template is delete. pending_badge_notification.sent: This event is triggered whenever a user is notified of a pending badge. pending_badge_notification.no_user.sent: This event is triggered whenever an email is sent to a non registered user for a pending badge. pending_badge_notification.unconfirmed_email.sent: This event is triggered whenever an unconfirmed user is notified of a pending badge. user.account_merged: This event is triggered whenever a user merges two accounts. user.connect_access.removed: This event is triggered when a user removes access to an OAuth application. user.public_badges.changed: This event is triggered whenever a user has changes to their set of publicly viewable badges. user.public_badges.added: This event is triggered when a badge becomes visible via Credly Connect user.public_badges.removed: This event is triggered when a badge becomes invisible via Credly Connect Note on badge.* event types: When you receive webhook events that are related to a badge, here are a few things to keep in mind: * Events might include badges issued on your behalf by an authorized issuer * Events might include badges you issued on behalf of another organization Example Event Detail Responses (Note that all event detail responses will include [id, organization_id, event_type, and occured_at]. This documentation goes over what additional fields are present in the responses) badge.* events All badge.* event types will return information about the badge using the standard badge shape. Examples can be found in the Issued Badges Documentation badge_template.* events All badge_template.* event types will return information about the badge template using the standard badge template shape. Examples can be found in the Badge Templates Documentation user.account_merged This event will additionally include the following two attributes in the response body { "source_user_id": "628fcaa9-cfd3-4a9b-aa62-9973ac938ad6", "destination_user_id": "e36a911b-f4aa-46a0-bafb-bbfd9e3329c0" } For this event, source_user_id is the user who was merged INTO destination_user_id. I.e destination_user_id is the id of the user who remains after the merge. user.connect_access.removed This event will include the following attribute: json { "user_id": "628fcaa9-cfd3-4a9b-aa62-9973ac938ad6" } user.public_badges.* These events will include user_id and also information about the badge using the standard badge shape. Examples can be found in the Issued Badges Documentation These events may or may not contain additional information about user secondary emails. Contact your customer success manager for more information. Examples Here's the workflow as it relates to webhooks when you issue a user a badge and they accept it: You issue a badge to a user via the web service or Credly user interface. Credly generates an event and posts the data to your webhook_url. Here's an example webhook payload: Badge Created Webhook Request Body { "id": "628fcaa9-cfd3-4a9b-aa62-9973ac938ad6", "organization_id": "a0d325d9-d8cb-466f-b515-c767949f7e9a", "event_type": "badge.created", "occurred_at": "2014-04-01T14:41:00Z", "delivered_at": "2014-04-01T14:41:00Z" } Your server responds with HTTP status code 200 to Credly. You can optionally use the event's id to request more information about the event from Credly. Sometime later, the user accepts the badge via the Credly user interface. Credly generates an event and posts the data to your webhook_url. Badge State Changed Webhook Request Body { "id": "9e2ab7e1-c690-4756-b683-ee99a8b49b6c", "organization_id": "1e2a5091-a445-4a46-b8ba-85906b401172", "event_type": "badge.state.changed", "occurred_at": "2014-04-01T14:41:00Z", "delivered_at": "2014-04-01T14:41:00Z" } You can now use the id to request more information about the event from Credly as mentioned above. Workforce Credly allows organizations to receive webhooks specific to the context of events related to employees to accommodate the syncing of employee and badge data for Workforce Organizations. Workforce Event Types In addition to the event types listed above, the following are workforce event types that will trigger a webhook to be sent to an organizations webhook url. employment.badges.added: This event is triggered for a Workforce organization when a badge associated with an employee becomes viewable to the employer employment.badges.removed: This event is triggered for a Workforce organization when a badge associated with an employee becomes not viewable to the employer employment.badges.state_changed: This event is triggered for a Workforce organization when a badge associated with an employee viewable to the employer has its state updated employment.badges.privacy_changed: This event is triggered for a Workforce organization when a badge associated with an employee viewable to the employer has its privacy status updated employment.created: This event is triggered for a Workforce organization when an employee record is created employment.updated: This event is triggered for a Workforce organization when an employee record is updated employment.deleted: This event is triggered for a Workforce organization when an employee record is destroyed employment.connection.pending: This even is triggered for a Workforce organization when an employee enters the "pending" state, meaning they will see a prompt to connect with their employer when they log into Credly. employment.connection.accepted: This event is triggered for a Workforce organization when an employee accepts their connection to the employer. Employers will now be able to potentially view badges from other issuers associated to the employee. employment.connection.rejected: This event is triggered for a Workforce organization when the connection is rejected. employment.user_account.associated: This event is triggered for a Workforce organization when an employee record is associated with a Credly User Account. Employers will now be able to potentially view badges associated with the employees personal Credly account. employment.user_account.disassociated: This event is triggered for a Workforce organization when an employee record has become disassociated with its Credly User Account Employment Created Webhook Similar to non workforce webhooks, when an action occurs on Credly that triggers a webhook request (e.g. an employment record is created on Credly), then the initial payload to the organization's webhook url will look like the following: Request Body { "id": "8fce56cf-f11b-460d-a523-c73984e3699e", "organization_id": "12bc9b3a-0f49-4e7e-ba9e-e5ca73fa1513", "event_type": "employment.created", "occurred_at": "2014-04-01T14:41:00Z", "delivered_at": "2014-04-01T14:41:00Z" } And again, more data can be fetched by using the id of the incoming event. Workforce Event Api Responses The response from the Events api will return varying data dependent on the event_type as well as whether or not the organization making the request is still authorized to access Workforce data (i.e. is still a Workforce Organization). For all event_types except employment.badges.added, employment.badges.removed, and employment.deleted. The response from the Events api when querying for a Workforce event will show full data related to the employee including all badges associated with the employee viewable to the employer. Employment Created / Employment Updated Event Response Example Response { "data": { "id": "8bec6807-a1f9-40c4-a53f-c33789b63f60", "event_type": "employment.created", "organization_id": "9aba1150-5cca-4278-844d-9bfc88966ae1", "occurred_at": "2014-04-01T14:41:00.000Z", "employment": { "id": "a9a47a03-dd80-4ef0-a8b3-41269451b2ab", "email": "email15@example.com", "created_at": "2014-04-01T14:41:00.000Z", "last_updated_by_organization_at": "2014-04-01T14:41:00.000Z", "employee_state": "accepted", "employee_state_updated_at": "2014-04-01T14:41:00.000Z", "last_invitation_sent_at": null, "first_name": "John", "last_name": "Doe", "full_name": "John Doe", "photo_url": null, "team": null, "external_id": "ext-id", "position_title": "Software Engineer", "manager_first_name": null, "manager_last_name": null, "manager_external_id": "manager-000001", "country": null, "zip_code": null, "state_or_province": null, "department": "Engineering", "job_family": "f100", "level": null, "organization_level_1": "Farming", "organization_level_2": "Aquatic", "organization_level_3": "Kelp", "employer": { "id": "9611e677-b64d-4d1a-aeeb-8081531c09c1", "name": "Organization 94", "bio": "Function-based eco-centric standardization gurus", "industry": "J" }, "badges": [ { "id": "01dc2925-80a4-4f16-9e58-f8ace871a9a1", "issued_to": "Alfred Beaker Skiles", "issued_to_first_name": "Alfred", "issued_to_middle_name": "Beaker", "issued_to_last_name": "Skiles", "issued_at": "2014-04-01T14:41:00.000Z", "issued_at_date": "2014-04-01", "expires_at": "2016-04-01T14:41:00.000Z", "expires_at_date": "2016-04-01", "state": "accepted", "public": true, "badge_url": "https://localhost/badges/01dc2925-80a4-4f16-9e58-f8ace871a9a1/userdataservice", "badge_template": { "id": "216e1fea-a9b4-4b4f-9947-c6c559df4c7a", "image": null, "image_url": null, "description": "Dynamically deliver go forward e-tailers", "name": "Badge Template 96", "skills": [ "Skill 286", "Skill 287", "Skill 288" ] }, "issuer": { "name": "Organization 95", "image_url": null } }, { "id": "7e0f160c-80d5-4a1f-928a-97f92281567d", "issued_to": "Alfred Beaker Skiles", "issued_to_first_name": "Alfred", "issued_to_middle_name": "Beaker", "issued_to_last_name": "Skiles", "issued_at": "2014-04-01T14:41:00.000Z", "issued_at_date": "2014-04-01", "expires_at": "2016-04-01T14:41:00.000Z", "expires_at_date": "2016-04-01", "state": "accepted", "public": true, "badge_url": "https://localhost/badges/7e0f160c-80d5-4a1f-928a-97f92281567d/userdataservice", "badge_template": { "id": "f95634a5-1d28-419a-84ff-4bd67f6ae3a3", "image": null, "image_url": null, "description": "Dynamically deliver go forward e-tailers", "name": "Badge Template 97", "skills": [ "Skill 289", "Skill 290", "Skill 291" ] }, "issuer": { "name": "Organization 96", "image_url": null } }, { "id": "bee8c120-2e84-47da-adc