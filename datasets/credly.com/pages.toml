["https://www.credly.com/docs/issuer_authorizations"]
title = "Issuer Authorizations - Developer API - Credly"
description = "Credly is a global Open Badge platform that closes the gap between skills and opportunities. We work with academic institutions, corporations, and professional associations to translate learning outcomes into digital credentials that are immediately validated, managed, and shared."
full_description = 'Issuer Authorizations Get Issuers Retrieve the set of authorized issuers for an organization. Request GET /organizations/<organization_id>/issuers Response 200 OK { "data": [ { "id": "99f39b22-f58e-40d0-8193-db2f7b73a3cb", "authorization_type": "platform", "display_issuer_as": "grantor", "restrict_by_badge_templates": false, "subscription_type": null, "allowed_badge_templates": [ ], "collections": [ ], "issuer": { "type": "Organization", "id": "d5572648-04e4-41c3-97fc-9de49e457314", "name": "Organization 2", "url": "http://www.example.com/", "badge_template_count": 0, "photo": { "id": "7c5e4b37-12ea-425c-b376-d26ef6676b25", "url": "https://cdn.example.com/path/to/image.png" }, "photo_url": "https://cdn.example.com/path/to/image.png" }, "grantor": { "type": "Organization", "id": "b225efad-7819-4276-8f2c-44cab33273f5", "name": "Organization 3", "url": "http://www.example.com/", "badge_template_count": 0, "photo": { "id": "4c3de057-b4e0-4c4e-8d0b-5f1904315e98", "url": "https://cdn.example.com/path/to/image.png" }, "photo_url": "https://cdn.example.com/path/to/image.png" } } ], "metadata": { "count": 1, "current_page": 1, "total_count": 1, "total_pages": 1, "per": 50, "previous_page_url": null, "next_page_url": null } } Get Grantors Retrieve the list of organizations that have added an organization as an issuer Request GET /organizations/<organization_id>/grantors Response 200 OK { "data": [ { "id": "91ce80cb-7c43-437e-b0b8-2298dc084287", "grantor": { "type": "Organization", "id": "30612748-d0b6-473f-8a77-356b79147569", "name": "Organization 1", "url": "http://www.example.com/", "badge_template_count": 0, "photo": { "id": "7c5e4b37-12ea-425c-b376-d26ef6676b25", "url": "https://cdn.example.com/path/to/image.png" }, "photo_url": "https://cdn.example.com/path/to/image.png" } } ], "metadata": { "count": 1, "current_page": 1, "total_count": 1, "total_pages": 1, "per": 50, "previous_page_url": null, "next_page_url": null } } Deauthorize an Issuer Remove an organization from the list of authorized issuers. Request DELETE /organizations/<organization_id>/issuers/<id> Response 204 No Content'
