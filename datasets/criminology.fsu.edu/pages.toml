["https://criminology.fsu.edu/degrees/undergraduate-programs/scholarships"]
title = "Undergraduate Scholarships | College of Criminology & Criminal Justice"
description = "Apply for Scholarships today! The College of Criminology & Criminal Justice is accepting scholarship applications. Application deadline is September 3, 2024. To apply: Click here, sign in, and complete the general application plus the criminology conditional application. If you qualify for any additional scholarships, complete those applications as well."
full_description = "Related Links Downloads 2023-2024 Scholarship Award Recipients Links Computer Criminology Scholarships Scholarship Applications Apply for Scholarships today! The College of Criminology & Criminal Justice is accepting scholarship applications. Application deadline is September 3, 2024. To apply: Click here, sign in, and complete the general application plus the criminology conditional application. If you qualify for any additional scholarships, complete those applications as well. Frank A. and Lynn W. Baker Scholarship Award Preference is given to junior and senior undergraduates from Jackson County, Florida, who are focused on the areas of corrections, law enforcement, and security administration and demonstrate financial need. Jerry W. Billett Seminole Scholarship Fund Full-time student in good standing in the College of Criminology and Criminal Justice. Preference to a student who is officially enrolled and registered as an intern with a qualifying employment partner in the College of Criminology and Criminal Justice Program. Undergraduate student, with preference to a first-generation student. If applicable, the internship must be taken for academic credit or in place of a minor to meet graduation requirements. Seminole Tribe of Florida Tom Bowers Memorial Seminole Law Enforcement Fund Recipient must be in good academic standing and participate in the Criminology Internship Program with the Seminole Police Department. Preference given to first generation students and students enrolled in the Center for Academic Retention and Enhancement (CARE) Program. This scholarship was established in memory of Tom Bowers, as a tribute to his vision and commitment to the Seminole Tribe of Florida and the Seminole Police Department. Dona R. Cormier Internship in Criminology Endowment Established to provide much needed support to the Criminology Internship Program. Junior, Senior, or Master’s level students in Criminology with a minimum 2.0 GPA. Student must be accepted into the College’s Internship Program. For internship program requirements and application, click here. Crocket Family Fund for Excellence The purpose of this scholarship is to increase diversity at Florida State University and the College of Criminology and Criminal Justice. Any student may apply to be considered for the award; however, it is the preference of the donor that the recipient be an African American student from the Broward County Public School System, that demonstrates financial need and a passion for community. The scholarship is for a deserving student of need with the following preferences: Is enrolled in the Center for Academic Retention and Enhancement (CARE). All eligible students may apply and will be fully considered; however, preference will be given to an African American/Black student, consistent with the Donor's intent and in accordance with applicable University policies, regulations, and federal and state law. Is a graduate of Blanche Ely High School in Pompano Beach, Florida or from surrounding communities: First preference is for a resident of Broward County Florida. If not a resident of Broward County, alternatively, is a resident of Palm Beach County Florida or Miami-Dade County, Florida. Eugene and Rosalind Czajkoski Scholarship Fund Students enrolled in the FSU College of Criminology and Criminal Justice. Student must submit a 1500-2000 word essay demonstrating his or her interest in exploring, within criminology, issues involving the First Amendment of the U.S. Constitution. Winning essays often connect a first amendment constitutional issue such as discussing case law in the process, to an existing area of criminological research, such as discussing studies. Corey D. Dahlem Memorial Endowed Scholarship Junior level undergraduate with a minimum GPA of 2.75. Applicants must not have been convicted of any alcohol-related offense, reckless driving, or any type of driving or operating under the influence charge. Applicants must demonstrate financial need. First preference is given to children of current sworn law enforcement officers in the Gainesville, Florida Police Department. Subsequent preferences are given to the children of current then former sworn law enforcement officers in other Florida law enforcement agencies and then to any candidate seeking to pursue a degree in law enforcement. This scholarship was established as a lasting tribute to Gainesville Police Department Lieutenant Corey D. Dahlem, who was killed in the line of duty April 2007. The two-year award is contingent on the recipient maintaining a 2.75 GPA or higher. Gregory D. Ereckson Endowed Scholarship Fund Junior or Senior level Criminology majors with a minimum 3.25 GPA in Criminology courses and a reputation for academic excellence. Additional consideration shall be extended, but not limited, to residents of the State of Florida and participants in the Criminology Internship Program. Fallen Officer Memorial Scholarship Students of academic excellence who are intending to enter a career in law enforcement upon graduation from the College of Criminology and Criminal Justice. Jerry A. and Carolyn S. Glass Scholarship Award Undergraduate or graduate student who demonstrates proven academic ability along with financial need Preference given to students from Jackson County, Florida who are lineal descendants of current or deceased members of the Marianna Kiwanis Club or of current or deceased members of the Fishermen’s Sunday School Class of the First Baptists Church of Marianna, Florida. Kelly Ivey Memorial Scholarship Junior level undergraduate. Preference will be given to a student who demonstrates academic ability and financial need and is from Escambia or Santa Rosa counties. Second preference is given to a student from the Florida Panhandle. Award is presented to the recipient at a Pensacola Seminole Booster Club meeting, which the student is required to attend. Relgalf Scholarship For Current Police Officers This scholarship is a three-year education forgiveness loan created by the Relgalf Charitable Foundation to increase the resources of small police departments. The scholarship pays tuition and fees for an undergraduate degree in FSU’s College of Criminology & Criminal Justice Distance Learning Program for current police officers with an AA degree. To receive this award, the recipient must serve as a sworn officer in a small police department for three years after graduation. If the recipient does not meet the above requirement, they must re-pay the award in full. Robert Williams Endowed Scholarship This scholarship was established in memory of Robert J. “Rob” Williams, a Bureau of Alcohol, Tobacco, and Firearms agent slain in the line of duty of February 1993. The scholarship is awarded to senior level undergraduates interested in pursuing a career in law enforcement, preferably in the Bureau of Alcohol, Tobacco, and Firearms. Doyle E. Young Endowed Memorial Scholarship For former military or military dependents and federal law enforcement dependents pursing full-time undergraduate or graduate degrees in Criminology or Criminal Justice. Requires a minimum 3.0 GPA. Established to serve as a lasting tribute to the vision and commitment of Doyle E. Young to the development of future law enforcement officers. This scholarship serves as a testament to Doyle E. Young’s appreciation for the men and women serving their country in either the military or federal services. Law Enforcement Academy Program (LEAP) Scholarships Several scholarship opportunities are available to Criminology undergraduate students pursing their state law enforcement officer certification at an accredited law enforcement academy while enrolled in the Criminology Internship Program. These scholarships help students alleviate the stress of paying multiple tuition, allowing them to focus on maximizing their education and training to continue the Florida State tradition of preparing the next generation of law enforcement leaders. To be eligible, students must be enrolled in the criminology internship program at the time of the award. For information on the Criminology Internship Program go to https://criminology.fsu.edu/internships-and-careers/bachelors-internship-program List of LEAP Scholarships Florida Sheriffs Association Law Enforcement Academy Scholarship Established to assist Criminology interns enrolled at the Pat Thomas Law Enforcement Academy earning their state officer certification. For full-time undergraduate students, participating in the Criminology Internship Program at the Pat Thomas Law Enforcement Academy, or a similar law enforcement academy. First preference given, but not limited to, students with demonstrated academic success (minimum 3.5 cumulative GPA), participation in the accelerated BS to MS program, and demonstrated financial need. The Florida Sheriffs Association Memorial Scholarship serves as a lasting tribute to the vision and commitment of the Florida Sheriffs Association, its members, and the sheriffs of the state of Florida. Ernest K. Ponce de Leon Memorial Law Enforcement Academy Scholarship Established to assist Criminology interns enrolled at the Pat Thomas Law Enforcement Academy earning their state officer certification. For full-time undergraduate students, participating in the Criminology Internship Program at the Pat Thomas Law Enforcement Academy, or a similar law enforcement academy. First preference given, but not limited to, students with demonstrated academic success (minimum 3.5 cumulative GPA), participation in the accelerated BS to MS program, and demonstrated financial need. The Ernest K. Ponce de Leon Memorial scholarship serves as a lasting tribute to Ernest K. Ponce de Leon, Tallahassee Police Officer and FSU alumnus, slain in the line of duty in July 1988. Sgt. Daniel “Dale” Green Memorial Law Enforcement Academy Program Scholarship Established to assist high performing Criminology students enrolled at the Pat Thomas Law Enforcement Academy earning their state officer certification. For full-time undergraduate students, participating in the Criminology Internship Program at the Pat Thomas Law Enforcement Academy, or a similar law enforcement academy. First preference given, but not limited to, students who are Tallahassee natives and members of the Lambda Alpha Epsilon Criminology fraternity, with a history of academic success, and demonstrated financial need. This scholarship serves as a tribute to Sgt. Daniel “Dale” Green, a thirteen year veteran of the Tallahassee Police Department, husband, and father of three who was slain in the line of duty in 2002. May this scholarship stand in perpetuity as a tribute to Sgt. Green’s life, service, and sacrifice. Jacksonville Sheriff’s Office Endowed Scholarship For full-time undergraduate students, participating in the Criminology Internship Program at the Pat Thomas Law Enforcement Academy, or a similar law enforcement academy. Recipient must have demonstrated academic success, a minimum 3.0 GPA, and demonstrated financial need. First preference given to a resident of Duval County in Florida and/or the children of Duval County residents. Altman Malloy Memorial LEAP Scholarship For full-time undergraduate students, participating in the Criminology Internship Program at the Pat Thomas Law Enforcement Academy, or a similar law enforcement academy. Recipient must have demonstrated academic success (minimum 3.0 GPA), participate in the Lambda Alpha Epsilon Criminology Fraternity, and demonstrated financial need. First preference given to a resident of Walton County, Florida, and/or children of Walton County residents. Palm Beach County LEAP Program Endowment For full-time undergraduate students, participating in the Criminology Internship Program at the Pat Thomas Law Enforcement Academy, or a similar law enforcement academy. Provides a scholarship to a student from Palm Beach County, Florida enrolled in the FSU College of Criminology and Criminal Justice Internship program pursing their state law enforcement certification at the Pat Thomas Law Enforcement Academy. The recipient must be a resident of Palm Beach County, Florida Sarasota County LEAP Endowed Fund For full-time undergraduate students, participating in the Criminology Internship Program at the Pat Thomas Law Enforcement Academy, or a similar law enforcement academy. First preference given to Sarasota County residents and/or the children of Sarasota County residents, with demonstrated academic success (minimum 3.0 GPA), participation in the Lambda Alpha Epsilon Criminology Fraternity, and demonstrated financial need. The scholarship will assist the Sarasota County Sheriff's Office in the recruitment of qualified law enforcement personnel by directing qualified, certified applicants to the Sarasota County Sheriff's Office for employment. The Sarasota County Leap Fund serves as a lasting tribute to the vision of the Sarasota County Sheriff’s Office, whose commitment to higher education requires all administrators to hold a college degree."
