["https://criminology.fsu.edu/giving-alumni/ways-give"]
title = "Ways to Give | College of Criminology & Criminal Justice"
description = "Ways to Give There are many ways to give to the College of Criminology and Criminal Justice. Whether your gift qualifies as an Annual Gift, Endowed Gift or Planned Gift, each type of gift makes an impact on current as well as future students and faculty at Florida State."
full_description = "Related Links Make an online gift Ways to Give There are many ways to give to the College of Criminology and Criminal Justice. Whether your gift qualifies as an Annual Gift, Endowed Gift or Planned Gift, each type of gift makes an impact on current as well as future students and faculty at Florida State. Annual Gifts Annual gifts offer a unique opportunity for alumni, parents and friends to ensure the continued success of the College. Through annual gifts, you may choose to designate your support for students, faculty or research Endowed Gifts The basic plan underlying an endowed fund is simple. The principal of the fund is never spent. It is invested and the earnings are used to fulfill the purpose(s) for which the fund was created. Funds may be created for scholarships, fellowships, lectureships, research, professorships, library acquisitions, academic chairs, scientific and technical equipment, capital improvements or any other educational purpose of Florida State University. Planned Gifts Careful estate planning yields special advantages for donors and their heirs while enabling them to support the important work of Florida State in a significant and lasting way. The FSU Foundation Office of Planned Giving can help donors meet their philanthropic and financial goals while they provide significant support to the University and its various academic programs. There are many ways contributors can ensure the future of the institution. Learn more about how you can make a planned gift to FSU. Dean's Club By making a gift to the college’s annual fund, you provide critical investment in the continued success of our students, faculty and communities around the nation and world that feel the direct impact of our research brought to life. You also inspire fellow alumni and friends to share their support in scholarship, enrichment and research. Learn more about joining the Dean's Club."
year_published = 2025
