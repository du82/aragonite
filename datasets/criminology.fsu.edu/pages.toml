["https://criminology.fsu.edu/faculty-and-staff/kevin-beaver"]
title = "Kevin M. Beaver | College of Criminology & Criminal Justice"
description = "Beaver’s research examines the biosocial underpinnings to antisocial behaviors. He has employed behavioral genetic and molecular genetic methodologies to unpack the gene-environmental basis to a range of criminal and delinquent outcomes. He is the past recipient of the American Society of Criminology Ruth Shonle Cavan Young Scholar Award and the National Institute of Justice’s graduate research fellowship. Beaver has published more than 150 articles and more than 25 book chapters and is the author/editor of 10 books including Biosocial Criminology: A Primer."
full_description = "Judith Rich Harris Professor of Criminology Director, Distance Learning Program Beaver’s research examines the biosocial underpinnings to antisocial behaviors. He has employed behavioral genetic and molecular genetic methodologies to unpack the gene-environmental basis to a range of criminal and delinquent outcomes. He is the past recipient of the American Society of Criminology Ruth Shonle Cavan Young Scholar Award and the National Institute of Justice’s graduate research fellowship. Beaver has published more than 150 articles and more than 25 book chapters and is the author/editor of 10 books including Biosocial Criminology: A Primer. His research has appeared in journals as diverse as American Journal of Public Health, Biological Psychiatry, Criminology, Developmental Psychology, and Sexual Abuse. Research Interests Biosocial Criminology | Genetic/Biological Correlates of Offending | Life-Course/Developmental Criminology | Stability of Violent Behaviors Education Ph.D. 2006, University of Cincinnati; Criminal Justice M.S. 2001, University of Cincinnati; Criminal Justice B.A. 2000, Ohio University; Sociology Recent Publications Thomas G. Blomberg, Julie Mestre Brancale, Kevin M. Beaver, William D. Bales. 2016. “Advancing Criminology and Criminal Justice Policy” Routledge. Boccio, Cashen M. and Kevin M. Beaver. 2015. “Psychopathic Personality Traits, Intelligence, and Economic Success” Journal of Forensic Psychiatry and Psychology 26 (July/August): 551-569.. Jackson, Dylan B. and Kevin M. Beaver. 2015. “The Influence of Nutritional Factors on Verbal Deficits and Psychopathic Personality Traits: Evidence of the Moderating Role of MAOA Genotype” International Journal of Environmental Research and Public Health 12 (December):15739-15755. Boutwell, Brian B., J.C. Barnes, and Kevin M. Beaver. 2015. “When Love Dies: Further Elucidating the Existence of a Mate Ejection Module” Review of General Psychology 19 (March):30-38. Jackson, Dylan B. and Kevin M. Beaver. 2015. “The Role of Adolescent Nutrition and Physical Activity in the Prediction of Verbal Intelligence during Early Adulthood: A Genetically Informed Analysis of Twin Pairs” International Journal of Environmental Research and Public Health 12 (January):385-401. Selected Publications Barnes, J.C., John Paul Wright, Brian B. Boutwell, Joseph A. Schwartz, Eric J. Connolly, Joseph L. Nedelec, and Kevin M. Beaver 2014 “Demonstrating the Validity of Twin Research in Criminology.” Criminology. Forthcoming. Contact Phone 850.644.4050 Email kbeaver@fsu.edu Office 301B College of Criminology and Criminal Justice BLDG (CRM) Mail Code: 1273 Office Hours Tuesday: 6:30AM - 8:30AM Resume / CV Beaver CV 2018462.38 KB"
