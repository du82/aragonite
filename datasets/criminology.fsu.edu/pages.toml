["https://criminology.fsu.edu/news/student-spotlight-ashley-funes"]
title = "Student Spotlight: Ashley Funes | College of Criminology & Criminal Justice"
description = "Hi everyone, my name is Ashley Funes and I am a senior obtaining a dual degree in Criminology and Editing, Writing, and Media alongside two minors in Psychology and Sociology."
full_description = "October 31, 2024 Hi everyone, my name is Ashley Funes and I am a senior obtaining a dual degree in Criminology and Editing, Writing, and Media alongside two minors in Psychology and Sociology. I am a first-generation student from Miami, FL and I entered Florida State through the CARE (Center for Academic Retention & Enhancement) Program. I will graduate in the Spring of 2025. I have had the privilege of becoming a member, now newly elected President of Lambda Alpha Epsilon (LAE), a Co-ed Professional Criminal Justice Fraternity within the College of Criminology and Criminal Justice. LAE is not just a space where students for the College of Criminology and Criminal Justice to join but for all colleges to join, network, and make connections that can provide an enduring experience within their college years and future. This organization has been a home to all, but to me especially. I have made connections that will last a lifetime. Dr. George Pesta, our advisor, has been a great help in providing contact information with other criminology organizations and faculty/staff and we have been able to grow LAE immensely. As President of LAE, I hope to leave a long-lasting impact for future leaders to continue the legacy that this organization has been building since it was founded. Majoring in Criminology and Editing, Writing, and Media (EWM) has given me the knowledge base I need to further my career within law enforcement and integrated marketing. Combining both fields will give me the opportunity to advocate for policies that need to be reformed within the criminal justice system. I hope to expand my skills within law enforcement by working in a state or federal government agency."
year_published = 2024
clearnet = "https://criminology.fsu.edu/news/student-spotlight-ashley-funes"
