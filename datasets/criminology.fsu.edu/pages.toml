["https://criminology.fsu.edu/center-for-criminology-and-public-policy-research/real-time-crime-center-research-policy-institute"]
title = "Real Time Crime Center Research & Policy Institute | College of Criminology & Criminal Justice"
description = "The Real Time Crime Center Research & Policy Institute examines the development, operation, and effectiveness of real time crime centers and the technologies they utilize."
full_description = "Certificate in Crime and Intelligence Analysis The Real Time Crime Center Research & Policy Institute examines the development, operation, and effectiveness of real time crime centers and the technologies they utilize. Real time crime centers (RTCCs) centralize a variety of law enforcement technologies and databases into one centralized location with the goal of providing critical information to officers and deputies in real time. RTCCs are proliferating in law enforcement agencies large and small across the United States. However, little empirical work has been conducted on their effectiveness. The Real Time Crime Center Research & Policy Institute seeks to conduct rigorous research on RTCCs and provide needed evidence to law enforcement officials. The Real Time Crime Center Research & Policy Institute also serves as the research arm of the Capital Region Real Time Crime Center (CRRTCC). The CRRTCC is a multi-agency RTCC staffed by analysts from the Florida State University Police Department, Leon County Sheriff’s Office, and Tallahassee Police Department. Faculty and graduate students conduct ongoing process and outcome evaluations, regular surveys of local law enforcement personnel, surveys of community members, interviews with agency stakeholders, literature reviews, and peer-reviewed publications. PARTNERSHIPS Florida Department of Law Enforcement Florida State University Police Department Leon County Sheriff's Office Tallahassee Police Department PROJECTS Continuous Evaluation of the Capital Region Real Time Crime Center (CRRTCC) Addressing Violence and Gun Crime in Tallahassee and Leon County, Florida Through the Multi-Agency Real Time Crime Center: An Operational and Research Partnership REPORTS Use and Perceptions of Technology and Real Time Crime Centers Among Law Enforcement Personnel in Tallahassee and Leon County HIGHLIGHTED/FEATURED LINKS FSU Brings Together Local Law Enforcement and Criminology Researchers at New Real-time Crime Center- Florida State University News, March 30, 2021 DIRECTOR | Thomas Blomberg CO-DIRECTORS | Julie Brancale, Young-An Kim, Brian Stults GRADUATE STUDENTS | Alex Billmeier, Jonathan Caswell, and Dequan Cowell"
year_published = 2025
