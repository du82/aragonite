title = "Juvenile and Adult Correctional Education Research & Policy Institute | College of Criminology & Criminal Justice"
description = "Improving Educational Services for Justice System-Involved Youth and Adults through Research and Evaluation."
full_description = "Improving Educational Services for Justice System-Involved Youth and Adults through Research and Evaluation. The Juvenile and Adult Correctional Education Research & Policy Institute examines the educational programming offered to justice system-involved youth and adults. The Institute’s goal is to ensure high quality educational services are provided to youth and adults within juvenile and correctional facilities. Through research and evaluation, the Institute partners with juvenile and adult correctional education agencies to use research to improve student outcomes such as graduation rates, return to school post release, and employment. PARTNERS Florida Department of Juvenile Justice Maryland State Department of Education and the Juvenile Services Education System PROJECTS The Maryland Juvenile Justice Education Partnership 2019-2024 School Safety and Student Performance Partnership 2015-2018 FSU and Florida Department of Juvenile Justice Research Partnership Project 2014-2017 Assessing School-to-Prison Pipeline An Evaluation of the Education Services Provided to Juveniles in the Polk County Jail 2013-2017 Juvenile Justice Educational Enhancement Program (JJEEP) 1998-2010 Florida Safe and Drug-Free Schools Quality Data Management Project: Increasing the Capacity of Florida’s Schools and Communities to Collect, Analyze, and Use Data to Improve the Quality of Drug and Violence Prevention and Intervention Programs 2005-2008 Juvenile Justice No Child Left Behind Collaboration Project: Education in Juvenile Justice and Adult Corrections 2005-2008 DIRECTOR | Thomas G. Blomberg, Ph.D. CO-DIRECTOR | George B. Pesta, Ph.D. CONTACT INFORMATION For more information on the Juvenile and Adult Correctional Education Research & Policy Institute, contact Dr. George B. Pesta."
