["https://criminology.fsu.edu/certificate-crime-and-intelligence-analysis"]
title = "Certificate in Crime and Intelligence Analysis | College of Criminology & Criminal Justice"
full_description = "The Undergraduate Certificate in Crime and Intelligence Analysis equips students with critical skills that law enforcement agencies are increasingly seeking to address evolving crime trends. This program is perfect for those interested in roles within crime analysis units or Real-Time Crime Centers (RTCC), such as the Capital Region Real Time Crime Center (CRRTCC). The program offers a strong foundation in the analytical methods used in crime and intelligence analysis, preparing students to support investigations, inform decision-making, and contribute to enhancing public safety. The program provides specialized training in analyzing crime patterns, trends, and data—skills that are highly sought after in law enforcement, security, and research roles. Graduates gain proficiency in essential tools, including crime mapping and Geographic Information Systems (GIS), statistical analysis software, data analytics, and the advanced technologies commonly used in RTCCs, such as surveillance systems and social media monitoring. These skills enable students to thrive in dynamic environments where data-driven decisions are crucial. The Future of Law Enforcement is Here According to Recruiter.com, a leading talent-search platform, the need for intelligence analysts has increased by 20 percent nationally since 2004. This growth reflects the broader shift toward data-driven decision making in law enforcement. As agencies increasingly rely on data to shape their strategies and tactics, the demand for skilled crime and intelligence analysts will continue to increase. With growing demand comes an increase earnings for crime analysts. Salaries for crime analysts have jumped 11 percent since 2014. Pursuing a certificate in crime and intelligence analysis is a strategic choice for those looking to launch a career that is integral to modern law enforcement. An Opportunity Found Nowhere Else Students in the program will work and learn at the CRRTCC, the nation’s leading real-time crime center, and the only one of its kind with a college as a founding partner. The College of Criminology and Criminal Justice’s role is embedded into the center's daily operations, providing an unparalleled partnership. This means students gain invaluable and unmatched hands-on learning experiences. Key components of the program include: Integration of Theory and Practice: Learn to apply theoretical concepts to real-world scenarios, enhancing your ability to leverage technology in crime analysis and mapping. Courses in Quantitative Skills: Develop the data-management, mapping other computer-based skills necessary for analyzing crime patterns and providing real-time intelligence to officers and deputies in the field. Spatial Crime Analysis: Gain expertise in the spatial analyses of crime and create mapping products tailored to the specific needs of law enforcement. Communication Strategies: Learn how to effectively present and communicate critical information to law enforcement leaders. Exposure to the Capital Region Real Time Crime Center: Work alongside analysts and staff, at the crime center, gaining a one-of-a-kind opportunity for hands-on learning and practical experience in crime analysis. Certificate Requirements The certificate requires the completion of four related courses (12 total credit hours), including three required and one elective. Most courses will be offered in the Learning Lab of the CRRTCC located at Innovation Park (where FSU’s MagLab is located). Applicants may apply one previously completed course toward fulfilling the certificate requirement. Required courses: CJE 4732 Introduction to Crime Analysis CCJ 4724 GIS Application in Criminology CCJ 4751 Data Management and Crime Analysis Elective courses (choose one): CCJ 4070 Crime Hotspots CCJ 4450 Criminal Justice Administration CJE 3110 Law Enforcement Application Requirements For admission consideration, students must fulfill the following requirements: Be accepted as a major in Criminology & Criminal Justice, pre-criminology, or Cyber Criminology Have overall GPA of 3.0 or higher Submit a statement of career goals (500-word limit) addressing how the certificate program will aid in accomplishing these goals Submit a current resume/CV Application Deadlines Applications must be submitted to Dr. Young-An Kim via email at: youngan.kim@fsu.edu by February 21. The review of applications will conclude by February 24. For additional information, please contact Dr. Young-An Kim at: youngan.kim@fsu.edu."
year_published = 2025
clearnet = "https://criminology.fsu.edu/certificate-crime-and-intelligence-analysis"
