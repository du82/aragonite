["https://criminology.fsu.edu/faculty-and-staff/julie-brancale"]
title = "Julie Brancale | College of Criminology & Criminal Justice"
description = "Julie Brancale's research focuses on understanding the causes, consequences, and justice system responses to financial exploitation and victimization of older adults. Additionally, she studies the impact of juvenile justice system involvement on education, desistence, and delinquency. Through all of her research, Dr. Brancale seeks to translate the findings into actionable policy and practice recommendations."
full_description = "Assistant Professor Julie Brancale's research focuses on understanding the causes, consequences, and justice system responses to financial exploitation and victimization of older adults. Additionally, she studies the impact of juvenile justice system involvement on education, desistence, and delinquency. Through all of her research, Dr. Brancale seeks to translate the findings into actionable policy and practice recommendations. Research Interests Criminal and Juvenile Justice Policy | Education and Delinquency | Financial Exploitation and Victimization of Older Adults | Life Course Education Ph.D. 2017, Florida State University; Criminology M.S. 2011, Florida State University; Criminology B.S. 2008, Florida State University; Criminology Selected Publications Brancale, Julie, Thomas G. Blomberg, and Kevin M. Beaver. 2024. The Connection of Place, Routine Activity, and Financial Exploitation of Older Adults in a Large Retirement Community. Online First. Journal of Aging and Social Policy. https://doi.org/10.1080/08959420.2024.2422670 Brancale, Julie, and Thomas G. Blomberg. 2022. The Role of Normative Age-Graded Transitions and Human Agency in Patterns and Variations of Financial Exploitation of Older Adults. 2022. Journal of Research in Crime and Delinquency. DOI: 10.1177/0022427822107516. Brancale, Julie, Thomas G. Blomberg, Sonja Siennick, George B. Pesta, Nic Swagar, Kaylee Noorman, Jonathan Caswell, and Cecilia Chouhy. 2021. Building Collaborative Evidence-Based Frameworks for Criminal Justice Policy. Criminal Justice Policy Review. DOI: 10.177/0887403421101234. Blomberg, Thomas G., Julie Mestre Brancale, Kevin Beaver, and William D. Bales, eds. 2016. Advancing Criminology and Criminal Justice Policy. London: Routledge. Contact Phone 850.644.4990 Email julie.brancale@fsu.edu Office 201B College of Criminology and Criminal Justice BLDG (CRM) Mail Code: 1273 Office Hours Tuesday: 8:30 AM - 9:30 AM / 11:30 AM - 1:30 PM Thursday: 8:30 AM - 9:30 PM Resume / CV Brancale CV_ February 2025.pdf298.82 KB"
