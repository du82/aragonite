["https://criminology.fsu.edu/degrees/graduate-programs/financial-assistance/assistantships"]
title = "Assistantships | College of Criminology & Criminal Justice"
description = "Teaching and Research Assistantships Teaching and research assistantships are awarded to our most qualified doctoral students each academic year. Students are assigned to assistantships in the College and in the Center for Criminology and Public Policy Research."
full_description = "Related Links Links Student Research Center for Criminology and Public Policy Research FSU Student Financial Services Teaching and Research Assistantships Teaching and research assistantships are awarded to our most qualified doctoral students each academic year. Students are assigned to assistantships in the College and in the Center for Criminology and Public Policy Research. Research appointments provide students with valuable research experience and the opportunity to work side-by-side with leading scholars on important research projects that result in conference presentations, publications, and policy improvement recommendations. College teaching appointments give students valuable experience that builds marketable teaching and presentation skills. Assistantships pay $21,000 per academic year for 20-hour work weeks plus nine hours of tuition waivers. Eligible graduate assistants may also receive a health insurance subsidy toward a university-sponsored health insurance plan. The most current tuition information can be found on the University’s Student Financial Services Web site. To be considered for funding, students must submit all application materials by January 15. There is no separate application for the assistantship. All students who have submitted application materials by the deadline will be considered. For more information, please contact our Program Director of Academic and Student Services, Margarita Frankeberger."
year_published = 2025
