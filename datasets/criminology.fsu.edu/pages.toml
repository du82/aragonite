["https://criminology.fsu.edu/center-for-criminology-public-policy-research/institutes/corrections-research-and-policy-institute"]
title = "Corrections Research & Policy Institute | College of Criminology & Criminal Justice"
description = "Examining and improving correctional policies, practices, and experiences through basic and applied research."
full_description = "Examining and improving correctional policies, practices, and experiences through basic and applied research. The Corrections Research & Policy Institute provides evidence-based policy and practice recommendations that address challenges facing the correctional system. The Institute has a strong working relationship with the Florida Department of Corrections (FDC) and frequently partners with FDC to tackle important research questions. The mission of the Institute is to develop evidence-based correctional policies and practices to improve the efficiency of the correctional system and encourage positive outcomes for inmates during incarceration and upon their release. PARTNERSHIPS Florida Department of Corrections PROJECTS Felony Re-Enfranchisement in the Era of Decarceration and Reform: An Empirical Analysis of the Changing Nature of Criminal Justice Control and Felony Re-Enfranchisement in Florida The Impacts of Restrictive Housing on Inmate Behavior, Mental Health, and Recidivism, and Prison Systems and Personnel 2017 – 2019 Validation of and recommendations for the Florida Department of Corrections’ Correctional Integrated Needs Assessment System (CINAS) 2018 Understanding Differences in the Relationship Between Prison Visitation and Recidivism 2015 – 2017 Research Partnership with the Florida Department of Corrections 2012 – 2015 Assessing the Post-Release Impact of Prison-Based Substance Abuse Treatment on Employment, Recidivism, and Re-Imprisonment Assessing the Post-Release Impact of Work Release Programs on Employment, Recidivism, and Re-Imprisonment Assessing the Impact of Post-Release Supervision on Employment, Recidivism, and Re-Imprisonment Re-Validation of the Florida Department of Corrections’ Correctional Operations Trend Analysis System (COTAS) 2013 Revising the Florida Objective Parole Guidelines to Improve Prison Release Decisions 2013 GPS Monitoring Technologies and Domestic Violence: An Evaluation Study 2011 Correctional Operations Trend Analysis System (COTAS) Validation 2011 Assessment of the Effectiveness of Electronic Monitoring on Supervision and Post-Supervision Outcomes 2007 – 2009 DIRECTOR | Daniel Mears, Ph.D. FACULTY AFFILIATE | William D. Bales, Ph.D. CONTACT INFORMATION For more information on the Corrections Research & Policy Institute, contact Drs. George B. Pesta or Julie Brancale."
