title = "Aging Adult Fraud Research & Policy Institute | College of Criminology & Criminal Justice"
description = "Improving the physical and financial security of elderly Americans through evidence-based research."
full_description = "Improving the physical and financial security of elderly Americans through evidence-based research. The Aging Adult Fraud Research & Policy Institute conducts rigorous scientific research about the risk factors, protective factors, and consequences of elder exploitation and victimization. The population of elderly Americans is rapidly increasing and the elderly represent a vulnerable target for violent victimization, sexual victimization, and financial exploitation. As a result, the Institute seeks to use evidence-based research to develop policy and practice recommendations that are presented to local, state, and national policymakers and practitioners to reduce the risk of victimization. PARTNERSHIPS Financial Industry Regulatory Authority (FINRA) The Florida Department of Agriculture and Consumer Services | Division of Consumer Services Seniors vs. Crime PROJECTS Exploratory Study of Elder Financial Exploitation 2015 – 2016 Consumer Fraud Project 2004 – 2006 HIGHLIGHTED/FEATURED LINKS Presentation to Osher Lifelong Learning Institute | Aging Adults, Turning Points, and Thresholds Resulting in Financial Exploitation OLLI Times Dec. 2019 DIRECTOR | Thomas G. Blomberg, Ph.D. CO-DIRECTOR | Julie Brancale, Ph.D. CONTACT INFORMATION For more information on the Aging Adult Fraud Research & Policy Institute, contact Drs. George B. Pesta or Julie Brancale."
year_published = 2025
