["https://criminology.fsu.edu/news/jerrys-legacy-turning-challenges-opportunities"]
title = "Jerry’s Legacy: Turning Challenges into Opportunities | College of Criminology & Criminal Justice"
description = "Jerry Billett remembers attending his first FSU football game at age 10, and it was then that he decided to follow in his father’s footsteps and become a Nole."
full_description = "October 31, 2024 Jerry Billett remembers attending his first FSU football game at age 10, and it was then that he decided to follow in his father’s footsteps and become a Nole. As a student at FSU, Jerry worked full-time at UPS, and juggled work with a full course load. Although he was ineligible for grant funding, he graduated debt-free, relying on hard work and support from the faculty. One of those supports was Internship Director Laura Bedard, the College’s Internship Director. Although Jerry was not quite eligible for the internship program due to guidelines at the time, Denard made an exception, recognizing his dedication to graduating on time and maintaining his rigorous work schedule. The internship program was key for Jerry to graduate on time and inspired him to help others in similar situations. Today, Jerry funds a scholarship for first-generation Criminology students who, like him, need a boost to cross the finish line. His scholarship isn’t about grades—it’s about grit and the drive the student has to succeed. Reflecting on his own experience, Jerry said, “To know that I can impact someone’s life... it’s gratifying.” Jerry’s memories of FSU include Dean Blomberg’s “bar exams” hanging out at the Phyrst Bar and the Late Night Library and supporting FSU football. FSU gave him more than an education—it gave him a community. Now, Jerry’s giving back to ensure others find their place here too. Jerry believes in the power of giving. It’s not just about financial benefits; it’s about real change in students’ lives. Your support can make that difference."
year_published = 2024
clearnet = "https://criminology.fsu.edu/news/jerrys-legacy-turning-challenges-opportunities"
