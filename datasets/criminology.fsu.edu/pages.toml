["https://criminology.fsu.edu/center-for-criminology-and-public-policy-research/institutes/jail-research-policy-institute"]
title = "Jail Research & Policy Institute | College of Criminology & Criminal Justice"
description = "Guiding data-driven policy recommendations for the fair and effective functioning of local jails."
full_description = "Guiding data-driven policy recommendations for the fair and effective functioning of local jails. The mission of the Jail Research & Policy Institute is to promote evidence-informed policy and practice through research and evaluation. In partnership with key stakeholders, we address the many challenges facing local jails and the populations they serve. This includes research related to pretrial practices, correctional programming, and recidivism, among other topics. In addition, we are experienced in jail population forecasting, risk assessments, and program evaluations. Jails have been largely neglected in academic research, however, the institute aims to address this gap through rigorous, policy-related research and evaluation. PARTNERSHIPS Florida Sheriff’s Association Leon County Sheriff’s Office Palm Beach County Criminal Justice Commission Walton County Sheriff's Office PROJECTS Advising and Evaluation of Jail and Reentry Programming: A Partnership Between Florida State University and the Walton County Sheriff's Office Review of the State of Jail Research in America 2019 A Validation of the Palm Beach County Jail Risk Assessment Instrument for the Palm Beach County Criminal Justice Commission 2016 – 2019 Evidence-Based Policy Planning for the Leon County Detention Center: Population Trends and Forecasts 2017 Evaluation of the Palm Beach County Family Drug Court 2013 Broward County Jail Forecast, Risk Assessment Evaluation, and Cost-Benefit Analysis 2009 – 2010 DIRECTOR | Jennifer E. Copp, Ph.D. CO- DIRECTOR | Thomas G. Blomberg, Ph.D. FACULTY AFFILIATE | William D. Bales, Ph.D. CONTACT INFORMATION For more information on the Jail Research & Policy Institute, contact Drs. Jennifer E. Copp,or George B. Pesta."
