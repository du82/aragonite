["https://criminology.fsu.edu/doctoral-candidates"]
title = "Doctoral Candidates | College of Criminology & Criminal Justice"
description = "LAISA F. ABREU RIVERA Orlando, Florida Education B.A. Criminology, University of Florida M.S. Criminology, Florida State University"
full_description = "LAISA F. ABREU RIVERA Orlando, Florida Education B.A. Criminology, University of Florida M.S. Criminology, Florida State University Professional Summary: Laisa’s research interests include immigration, capital punishment, criminal justice attitudes, victimization, race, and crime. She has published articles in the British Journal of Criminology and the European Journal of Criminology. She has assisted in research projects funded by the National Science Foundation. She has taught and assisted courses centering on corrections, the courts, research methods, and comparative criminology and criminal justice. Her dissertation focuses on victimization and punitive attitudes among college students. Alex Bilmeier Daytona Beach, Florida Education B.A. Criminology, Florida State University M.S. Criminology, Florida State University Professional Summary: Alex's research focuses on policing with an emphasis on developing policing technologies. Additionally, he studies the dynamics of residential segregation and racial threat. His dissertation examines the growth of private police in cities and how this may be impacted by changes in the populations of racial minorities or widespread social movements. DEQUAN COWELL Pensacola, Florida Education B.A. Criminal Justice, University of South Alabama M.S. Criminology, Florida State University Professional Summary: Dequan's research interests include racial disparities in crime and arrest rates, juvenile justice, and policing practices. EMILY EGAN Howell, Michigan Education B.A. Psychology, Sienna Heights University M.A. Criminology, Florida State University Professional Summary: Emily's research focuses on understanding the causes, correlates, and later life outcomes of youth in the juvenile justice system, with an emphasis on youth who engage in status offending. EMILY M. HARGROVE Garner, North Carolina Education B.S. Psychology, Ferrum College M.A. Psychological Science, University of North Carolina Wilmington Professional Summary: Emily is a social science researcher who examines the impact of crime and victimization throughout the life course. She is passionate about research that seeks to serve vulnerable populations (i.e., children, minorities, and military members) and using evidence-based findings to bring research to life through programs, policies and intervention efforts. She is also interested in how crime and victimization impact health and well-being. JACOB JUDD Clinton, Iowa Education B.S. Law Enforcement and Justice Administration, Western Illinois University M.A. Law Enforcement and Justice Administration, Western Illinois University Professional Summary: Jacob's primary research focuses on the variability of self-control and its impacts over the life-course. Additionally, he has a secondary research interest in the effects of various criminal justice policies and practices on offending, recidivism, and victimization. He is currently working on his dissertation, which investigates within-individual change in self-control. NAN LI Jinan City, Shandong, China Education B.A. Sociology, University of Macau, China M.S. Criminal Justice, University of Cincinnati Professional Summary: Nan Li’s research focuses on policing, crime and place, and victimization. She applies advanced quantitative methods—including spatial-temporal analyses, multilevel modeling, and variation mediation methodologies—to investigate critical questions in these areas. Her current research agenda centers on her dissertation, which uses longitudinal multilevel modeling to examine the relationship between police agency attributes and crime rates, arrest rates, clearance rates, and racial disparities in arrests. KAYLEE NOORMAN Grand Rapids, Michigan Education B.S. Criminology and Psychology, Florida State University M.S. Criminology, Florida State University Professional Summary: Kaylee's research focuses on juvenile justice education, felony disenfranchisement, and translational criminology. Her work on juvenile justice education examined barriers to school reentry and the mechanisms underlying the relationship between juvenile justice system contact and high school dropout. Her work on felony disenfranchisement focused on contextualizing it and its consequences for civic participation. Underlying her research has been a translational criminology focus to apply research to policy and practice. MATTHEW VANDEN BOSCH Burlington, Ontario, Canada Education B.A. Criminal Justice, Marshall University M.S. Criminal Justice, Marshall University Professional Summary: Matthew's research interests focus on hate crime, public opinion & policy, and sexual violence. His recent publications have appeared in Crime & Delinquency among others. His own research has been funded by Arizona State University’s Law & Science Dissertation Grant (funded by the National Science Foundation) and by Florida State University’s Institute of Politics. He has taught courses on peer influence in delinquency and on gangs, as well as assisting in courses on research methods and punitiveness. His dissertation focuses on beliefs in hate crime myths."
