description = "Joint Graduate Pathway in Criminology and Social Work Expand your understanding of the connection between criminology and social work. Gain expertise in working with forensic clients. Become licensed (LCSW) in the state of Florida with additional coursework. A Master’s in Social Work and Criminology requires 79 credit hours, 30 in criminology and 49 in social work. Sample Courses:"
full_description = "Related Links Links FSU College of Social Work Joint Graduate Pathway in Criminology and Social Work Expand your understanding of the connection between criminology and social work. Gain expertise in working with forensic clients. Become licensed (LCSW) in the state of Florida with additional coursework. A Master’s in Social Work and Criminology requires 79 credit hours, 30 in criminology and 49 in social work. Sample Courses: Prevention and Treatment of Crime and Delinquency addresses causes of crime and explores theoretical development of crime prevention, punishment, and treatment. Juvenile Justice investigates special forms of justice applied to juveniles during arrest, detention, adjudication, and corrections, and examines the juvenile offender processing system. Those interested in learning more about this option should contact the Graduate Program Administrator, Ana Palomino, for more information. Application deadlines Fall semester: July 1 Please visit the College of Social Work for additional information."
