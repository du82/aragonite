description = "Marin Wenger received her Ph.D. in Sociology from Pennsylvania State University. Her work focuses on stratification, communities and crime, deviance, and quantitative methods."
full_description = "Associate Professor Marin Wenger received her Ph.D. in Sociology from Pennsylvania State University. Her work focuses on stratification, communities and crime, deviance, and quantitative methods. Research Interests Communities and Crime | Contextual Effects | Stratification | Hate Crime | Deviance | Quantitative Methods Education Ph.D. 2016, Pennsylvania State University; Sociology M.A. 2012, Pennsylvania State University; Crime, Law and Justice B.A. 2008, University of Michigan; Sociology Grants The Consequences and Impacts of Hate Crime and Post-Victimization Experiences: The Longitudinal Hate Crime Victimization Survey (LHCVS). Seed Grant, Council on Research and Creativity, Florida State University ($85,687), Co-Principal Investigator, 2023-2024. The Individual, Situational, and Contextual Risk Factors for Violent Firearm Injury and Firearm Homicide: A Comparative, Policy-Focused Approach. National Institutes of Health/National Institute on Minority Health and Health Disparities ($490,436), Co-Investigator, 2021-2024. Understanding Curfew and Curfew Violations. Florida Department of Juvenile Justice ($40,000), Principal Investigator, 2021. Considering Collateral Consequences of the COVID-19 Pandemic: Examining the Impact of the Pandemic on Prejudice, Hate Crime, and Victimization. Office of Research Development Collaborative Collision, Florida State University ($13,125), Co-Principal Investigator, 2020. The Context of Racial Disparity in Arrest: A Quasi-Experimental Examination of the Moderating Influence of Community Characteristics. Committee on Faculty Research Support, Council on Research and Creativity, Florida State University ($14,000), Principal Investigator, 2020. “The Longitudinal Multilevel Effects of Community Disadvantage, Income Inequality, and Residential Instability on Crime Rates” First Year Assistant Professor Award, Florida State University ($20,000), 2017. Recent Publications Wenger, Marin R. 2023. “The Multilevel Effects of Changes in Disadvantage.” Crime & Delinquency 69(11):2102-23. Lantz, Brendan, *Zachary T. Malcom, and Marin R. Wenger. 2023. “The Consequences of Hate Crime Victimization: Considering Prejudicial Attitudes as an Outcome of Interracial Bias-Motivated Conflict.” Advance Online Publication, Journal of Research in Crime and Delinquency. doi: 10.1177/00224278231179418 Lantz, Brendan, Marin R. Wenger, and *Chloe J. Craig. 2023. “What if They Were White? The Differential Arrest Consequences of Victim Characteristics for Black and White Co-Offenders.” Social Problems 70(2):297-320. Lantz, Brendan and Marin R. Wenger. 2023. “Anti-Asian Xenophobia, Hate Crime Victimization, and Fear of Victimization During the COVID-19 Pandemic.” Journal of Interpersonal Violence 38(1-2):1088-116. Lantz, Brendan, Marin R. Wenger, and Jack M. Mills. 2023. “Fear, Political Legitimization, and Racism: Examining Anti-Asian Xenophobia During the COVID-19 Pandemic.” Race and Justice 13(1):80-104. Selected Publications Wenger, Marin R., Brendan Lantz, and Gabriella Gallardo. 2022. “The Role of Hate Crime Victimization, Fear of Victimization, and Vicarious Victimization in COVID-19-Related Depression.” Criminal Justice and Behavior 49(12):1746-62. Lantz, Brendan, Marin R. Wenger, and *Zachary T. Malcom. 2022. “Historical Markers or Markers of White Supremacy? Confederate Memorialization, Racial Threat, and Hate Crime.” Social Problems. Advance Online Publication. doi: 10.1093/socpro/spac033 Wenger, Marin R. and Brendan Lantz. 2022. “Generalized Hate: Bias Victimization Against Non-Asian Racial/Ethnic Minorities During the COVID-19 Pandemic.” Victims & Offenders 17(6):848-71. Wenger, Marin R. and Brendan Lantz. 2022. “Hate Crime and Place: The Spatial and Temporal Concentration of Bias-Motivated Crime in Washington, DC.” Journal of Interpersonal Violence 37(13-14):NP10683-708. Wenger, Marin R. 2021. “Omitted Level Bias in Multilevel Research: An Empirical Test Distinguishing Block-Group, Tract, and City Effects of Disadvantage on Crime.” Justice Quarterly 38(5):792-826. Contact Phone 850.644.1780 Email mwenger@fsu.edu Office 411 College of Criminology and Criminal Justice BLDG (CRM) Mail Code: 1273 Office Hours Tuesday: 12:30 PM – 2:30 PM Or by appointment Resume / CV Wenger CV - Fall 2023198.13 KB"
