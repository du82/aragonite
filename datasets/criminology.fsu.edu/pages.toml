["https://criminology.fsu.edu/degrees/non-degree-program/criminology-and-criminal-justice-specialized-studies"]
title = "Criminology and Criminal Justice Specialized Studies | College of Criminology & Criminal Justice"
description = "The College offers specialized studies in criminology and criminal justice for non-majors in an easy-to-follow, online format."
full_description = "The College offers specialized studies in criminology and criminal justice for non-majors in an easy-to-follow, online format. The specialized studies program offers non-traditional students, such as those currently working in the field of criminal justice, the flexibility to take coursework while balancing a busy schedule that can lead to completion of a bachelor’s degree. Successful completion of the program will satisfy part of the requirements for the bachelor’s degree in criminology and criminal justice* for those students interested in continuing beyond the program. In order to transfer the credits toward the bachelors’ degree, a minimum of a “C” must have been achieved in CCJ 2020 and CCJ 3011. Students have five years to complete the specialized studies program and they must achieve a 2.0 GPA to graduate. *Fifteen (15) hours of coursework taken as a non-degree seeking student can apply toward the bachelor’s degree in Criminology. Specialized Studies Program Admission apply to FSU (either as a degree or non-degree seeking student) resume and personal statement must have a 2.0 GPA from previous institution attended Please note the program is not open to main campus students whose major is in the College of Criminology and Criminal Justice. Specialized Studies Program Completion Requirements The successful completion of the specialized studies program will consist of 21 credit hours, to include 6 courses (18 credits), all of which must be taken from the College of Criminology and Criminal Justice at Florida State University. These must include two required courses (CCJ 2020 Introduction to Criminal Justice and CCJ 3011 Criminology) and four elective courses. A capstone project (3 credits) that consists of taking an independent study course where the student will write a research paper on a topic of his/her choosing is also required. This course will be a graded DIS and a “C” will be required for credit. The program must be completed in five years, with an overall GPA of 2.0 in all courses applicable to the certificate, including a “C” or better in the two required courses. Failure to earn a “C” in CCJ 2020 and/or CCJ 3011 will require that the course(s) be repeated. For more information regarding the specialized studies program in criminology and criminal justice online please contact our advising team. For more information about fees and how to apply, click here."
