title = "Online Job Database | College of Criminology & Criminal Justice"
description = "The College of Criminology and Criminal Justice has partnered with the Career Center to bring you SeminoleLink, a one-stop shop for all your career needs. This online system links FSU students and alumni to potential employers and offers numerous career resources."
full_description = "Related Links Downloads PDF: SeminoleLink User's Guide Links FSU Career Center SeminoleLink The College of Criminology and Criminal Justice has partnered with the Career Center to bring you SeminoleLink, a one-stop shop for all your career needs. This online system links FSU students and alumni to potential employers and offers numerous career resources. Here students and alumni can explore internships and full-time jobs, receive job notifications via email that match your profile, and upload a resume to be included in online resume books and referral to potential employers.There are also links for events such as career fairs, employer information sessions, mock interviews, and career/job search workshops. Student and alumni job-seekers also have access to other career resources including CareerShift, GoingGlobal, and Resume Builder. Students and alumni also have the opportunity to submit a career portfolio through Secure Apps on Blackboard or FSU Portfolio, which prepares them for a real job through planning, reflection, skill development and portfolio documentation. SeminoleLink also provides students with access to ProfessioNole, a program that connects students with professionals in their future career field to learn more about the industry and employment opportunities. Visit SeminoleLink to learn more about the system and learn how to activate your SeminoleLinkPlus! Services. Employers have the option to post open positions on SeminoleLink and choose from the best human capital in the United States. Visit the FSU Career Center’s website for more information."
