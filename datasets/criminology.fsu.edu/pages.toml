["https://criminology.fsu.edu/center-for-criminology-and-public-policy-research/institutes/life-course-research-policy-institute"]
title = "Life Course Research & Policy Institute | College of Criminology & Criminal Justice"
description = "Life Course Research & Policy Institute Applying a life course perspective to study the causes and consequences of crime and victimization"
full_description = "Value of Life Course Research History of Life Course Criminology Life Course Research & Policy Institute Applying a life course perspective to study the causes and consequences of crime and victimization The Life Course Research & Policy Institute adopts a life course perspective to study crime and victimization and views crime and victimization as significant events that shape development. The institute encourages an evidence-based approach to inform policy and translate findings into practice. The mission of the institute is to (1) champion prospective, longitudinal data sets that can better discern the complex processes giving rise to crime and victimization and the consequences stemming from these experiences, (2) engage in research spanning various developmental periods, including neo-natal and early childhood, childhood, adolescence, emerging adulthood, adulthood, and advanced adulthood, in order to provide a more comprehensive understanding of crime and victimization as impactful life events, (3) conduct research using a variety of methodologies to address research questions, and (4) develop evidence-based recommendations for prevention and intervention programming as well as victim services at the local, state, national, and international level RESEARCH PROJECTS Rochester Youth Development Study (RYDS; 1987-current) Rochester Intergenerational Study (RIGS; 1999-current) Challenges of Safety and Transitions Study (COSTs; 2021-2023) SECONDARY RESEARCH National Longitudinal Study of Adolescent to Adult Health National Longitudinal Survey of Youth Pathways to Desistance Study PROSPER DIRECTOR | Megan Bears Augustyn, Ph.D. CO-DIRECTORS | Sonja E. Siennick, Ph.D. and Jennifer Copp, Ph.D. CONTACT INFORMATION For more information on the Life Course Research & Policy Institute, contact Drs. George B. Pesta or Megan Bears Augustyn."
