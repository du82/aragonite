title = "Juvenile Justice Research & Policy Institute | College of Criminology & Criminal Justice"
description = "Positively impacting the life course of delinquent youth through research and evaluation."
full_description = "Related Links Downloads PDF: Perceptions of Ed. Reentry Prep. among Detained/Committed Youth PDF: NIJ Civil Citation Final Report_published PDF: NIJ Family Visitation Final Report_published PDF: NIJ School Arrests Final Report_published Positively impacting the life course of delinquent youth through research and evaluation. The Juvenile Justice Research & Policy Institute examines the unique challenges of youthful crime. Through rigorous research and evaluation, the Institute’s goal is to understand the adverse life events and risk factors associated with juvenile delinquency. Through this understanding, the Institute aims to ensure that juveniles receive effective care from the juvenile justice system to prevent future delinquent and criminal behavior. The Institute has a strong partnership with the Florida Department of Juvenile Justice. Through this partnership, the Institute has positively impacted the lives of many delinquent youths. PARTNERSHIPS Florida Department of Juvenile Justice Oregon Youth Authority PROJECTS A Mixed-Methods Examination of the Unique Root Causes Of School Violence Perceptions of Educational Reentry Preparedness among Detained and Committed Youth A Two-State Examination of Varied Measurement Strategies for Juvenile Reoffending Friendship Networks and Substance Use in Adolescence 2018 An Evaluation of the Florida Department of Juvenile Justice Risk Assessment Instruments 2017 – 2018 School Safety and Student Performance Partnership 2015-2018 FSU and Florida Department of Juvenile Justice Research Partnership Project 2014-2017 Assessing Civil Citations as an Alternative to Arrest Family Attachment and Juvenile Justice Outcomes Assessing School-to-Prison Pipeline Standardized Program Evaluation Protocol (SPEP) Validation 2017 Assessing the Department of Juvenile Justice’s (DJJ) Sourcebook of Delinquency Interventions 2017 Residential Positive Achievement Change Tool (R-PACT) Validation 2012 – 2013 Palm Beach County Youth Violence Reduction Project: Phase II 2007 – 2009 Palm Beach County Youth Violence Prevention Program: Phase I 2005 – 2006 CO-DIRECTORS | Carter Hay, Ph.D. and Sonja E. Siennick, Ph.D. CONTACT INFORMATION For more information on the Juvenile Justice Research & Policy Institute contact Dr. George B. Pesta."
