["https://criminology.fsu.edu/news/fsu-criminology-students-research-earns-accolades-for-innovation"]
title = "FSU Criminology Student's Research Earns Accolades for Innovation | College of Criminology & Criminal Justice"
description = "A doctoral student in Florida State University’s College of Criminology and Criminal Justice is being recognized for his innovative research into the role family history and supportive environments play in alcohol use disorders."
full_description = "December 9, 2024 Tags Awards News Students A doctoral student in Florida State University’s College of Criminology and Criminal Justice is being recognized for his innovative research into the role family history and supportive environments play in alcohol use disorders. Chris Jodis, a fifth-year doctoral student from Savannah, Georgia is the winner of the Rolf Loeber Student Innovation Award from the Division of Biopsychocosial Criminology, in the American Society of Criminology. The award was presented at last month’s ASC conference. “Chris brought a different and unique perspective to this research,” said Joseph Schwartz, associate professor in the College. “As an advisor, when you see that, you try to encourage it. The award is well deserved and a great recognition of his hard work.” Jodis’ investigation included factors that went beyond previous work, which centered on yes or no answers to questions regarding a family history of alcoholism. His study’s expanded factors included the size of the family and the density of the condition within it. He said it was the use of empirical testing in this field that set this research apart. “It makes sense that having a family history of alcohol use disorders is associated with increased risks of having these disorders,” he said. “But this hasn’t been tested as much as you would expect.” Jodis said he is grateful for Schwartz’s mentorship and the team at the College for exposing him to different approaches and encouraging him to use interdisciplinary methods to solve research questions. “Without that encouragement, this paper doesn't get written and this award doesn't happen,” he said. “The award shows that hard work is paying off and that we're doing things the right way. It shows that the program here at FSU is giving us all the skills to excel.” For more information, visit the Biosocial Criminology Research & Policy Institute."
year_published = 2024
