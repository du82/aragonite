["https://criminology.fsu.edu/our-fallen-officers"]
title = "Our Fallen Officers | College of Criminology & Criminal Justice"
full_description = '''These brave men and women are all alumni of the College of Criminology and Criminal Justice. They leave behind a legacy that represents the hallmarks of the College: character, vision, and intellect. It takes a special person to respond to the call to become a law enforcement officer. Their sacrifices serve as a reminder to all of us as we resolve to better understand and prevent these tragedies. Click on the names below to learn more about the College's alumni featured on the Fallen Officer Memorial. Livio "Al" Beccaccio Livio "Al" Beccaccio Deputy Commissioner, United Nations International Police Task Force / End of Watch: September 17, 1997 (Age 58) B.S. 1963 Livio ''Al" Beccaccio was a husband and father of five. Mr. Beccaccio served as Chief of the National Academy Unit at the FBI Academy from 1987 to 1994. He supervised the training of thousands of local officers nationwide, who later rose to leadership in their departments. Before that, he was Chief of the Physical Training Unit at Quantico and had multiple assignments since joining the FBI in 1968. After retirement, Mr. Beccaccio joined the International Police Task Force mission to help rebuild Bosnia's civilian police forces. He died on September 17, 1997, in a helicopter crash, which took the lives of 12 members of the U.N. international peace mission in Bosnia and Herzegovina. Corey Dahlem Corey Dahlem Lieutenant, Gainesville Police Department / End of Watch: April 4, 2007 (Age 45) B.S. 1984 Lt. Corey Dahlem was a husband, father of two, and 22-year veteran of the Gainesville Police Department before his untimely death in 2007. Dahlem enjoyed biking, playing the guitar, and attending his children's sporting events. On April 4, 2007, Lt. Dahlem was struck and killed by a drunk driver while on foot patrol after celebrating the University of Florida's basketball national championship win. Lt. Dahlem is missed by his family, friends, fellow officers, and community. Christopher Nicholas Fariello Christopher Nicholas Fariello Officer, Tallahassee Police Department / End of Watch: June 8, 2022 (Age 34) B.S. 2012 Christopher Nicholas Fariello had served with the Tallahassee Police Department for four years and had previously served with the Wilton Manors Police Department. Many citizens were impacted by his warm and generous personality. Officer Fariello was killed when his patrol car was struck head-on by a vehicle being pursued by other officers. He is survived by his parents, brother, and cousin. Daniel "Dale" Green Daniel "Dale" Green Field Training Sergeant, Tallahassee Police Department / End of Watch: November 13, 2002 (Age 47) B.S. 1977 Daniel "Dale" Green was a husband, father of three, and 13-year veteran of the Tallahassee Police Department (TPD). He joined the TPD in 1989 as a patrol officer, was promoted to sergeant in 1996, and served as sniper team leader, COPP Squad Sergeant, and K-9 team sergeant. On November 13, 2002, Sgt. Green was slain in the line of duty while responding to a home invasion robbery. His peers remember Sgt. Green as a devoted family man and a respected police officer and sergeant known for his character and integrity. Rogerio "Roger" R. Morales Rogerio "Roger" R. Morales Officer, Davie Police Department / End of Watch: January 13, 2011 (Age 27) B.S. 2006 Rogerio "Roger" R. Morales married his junior high school sweetheart and joined the Davie Police Department. After a year of service as an officer, Roger collapsed from heat stroke while participating in physical agility testing for SWAT team tryouts. He passed away after being in a coma for three days. Officer Morales loved being a police officer and serving his community. He enjoyed working out, reading, and outdoor activities. Ernest "Ernie" K. Ponce de Leon Ernest "Ernie" K. Ponce de Leon Officer, Tallahassee Police Department / End of Watch: July 8, 1988 (Age 40) B.S. 1973 Ernest "Ernie" K. Ponce de Leon of the Tallahassee Police Department (TPD) served in the U.S. Air Force (including a tour in Vietnam). He worked as a caseworker for troubled and delinquent children at Florida's Department of Health and Rehabilitative Services before he began working for TPD. On July 8, 1988, Officer Ponce De Leon was shot and killed in the line of duty while he attempted to run a routine registration check on a vehicle that turned out to be occupied by three armed interstate fugitives. Officer Ponce de Leon is remembered for his friendliness and compassion. His family and community miss him. Scott "Scotty" M. Roberson Scott "Scotty" M. Roberson Security Officer, Central Intelligence Agency / End of Watch: December 30, 2009 (Age 39) B.S. 1992 Scott "Scotty" M. Roberson was a husband and father who began his career as an officer with the Atlanta Police Department and rose to the rank of detective while working undercover in the narcotics division. His international service started with U.N. security forces in Kosovo and continued with several tours of duty in Iraq, where his responsibilities included protecting high-risk officials. His last assignments were in support of U.S. efforts in Afghanistan. On December 30, 2009, Mr. Roberson died under hostile fire while serving his country as a CIA Security Officer in Khost, Afghanistan. Dana S. Seetahal Dana S. Seetahal Senior Counsel, Trinidad and Tobago Senate / End of Watch: May 4, 2014 (Age 59) B.S. 1985 Dana S. Seetahal was a prominent and fearless prosecutor in the twin­island Caribbean nation of Trinidad & Tobago. She worked in the Solicitor General's Department as a Magistrate and State Prosecutor and held a Private Practice in Juscitia Omnibus. She was appointed in 2002 as an Independent Senator in the Parliament of Trinidad & Tobago. She was awarded the 'Senior Counsel' status in 2006, one of only three women to attain the distinction. On May 4, 2014, she was ambushed and murdered in a carefully planned operation orchestrated by an international drug organization. At the time of her death, she was one of the lead prosecutors in the trial of 12 men accused of kidnapping and murdering a prominent businesswoman. Robert "Rob" J. Williams Robert "Rob" J. Williams Special Agent, U.S. Department of the Treasury - Bureau of Alcohol, Tobacco, Firearms and Explosives / End of Watch: February 28, 1993 (Age 27) B.S. 1988 Robert "Rob" J. Williams was a husband and five-year veteran special agent with the Bureau of Alcohol, Tobacco, Firearms and Explosives (ATF). Rob worked out of the Little Rock, Arkansas office with the New Orleans Field Division. He served with the ATF for over four years, starting in 1988. Williams was one of four ATF Special Agents killed while serving a federal arrest and search warrant on the Branch Davidian compound near Waco, Texas. He was also an accomplished and certified SCUBA diver.'''
