["https://criminology.fsu.edu/alumni-friends/support-the-college"]
title = "Why Give? | College of Criminology & Criminal Justice"
description = "Impact on Students Preparing students to thrive in an increasingly competitive and global economy is a top priority at Florida State University. This undertaking starts by recruiting the best, most deserving students and providing them with the financial resources they need to succeed."
full_description = "Related Links Links FSU Foundation Impact on Students Preparing students to thrive in an increasingly competitive and global economy is a top priority at Florida State University. This undertaking starts by recruiting the best, most deserving students and providing them with the financial resources they need to succeed. Alumni, leaders at the College of Criminology and Criminal Justice, and others are committed to help provide these resources. If you’re considering making a gift with a lasting impact, consider the following areas where philanthropy can make the greatest difference to students studying criminology and criminal justice: Scholarships Endowed scholarships enable the College to assist undergraduate and pre-professional students with tuition and other college expenses according to donor stipulations. Scholarships reward high achievement and bring the region’s best students to FSU. They also enable deserving students with financial need to develop their gifts and experience careers and futures they might never have had. Private giving is the primary means for providing students with these resources. Your gifts increase the funds available for attracting top students, primarily by creating new undergraduate scholarships and graduate fellowships. Fallen Officer Scholarship Please help us continue to honor our fallen and assist our future law enforcement leaders by supporting the Fallen Officer Scholarship. Your meaningful gift will make a tremendous impact in a student’s ability to obtain a world-class education here at the College of Criminology and Criminal Justice. An education they will use to serve and protect our communities in the future. For more information on the programs listed above and ways you can give, please contact Director of Development Claire Knox at 850-645-7585 or email her at cknox@fsu.edu."
