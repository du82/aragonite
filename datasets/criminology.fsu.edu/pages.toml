description = "Joint Graduate Pathway in Criminology and Public Administration Prepare for careers in criminal justice management. Gain criminology and management knowledge necessary for positions in related public, private, and nonprofit organizations. Prepare for leadership or research positions within justice agencies. A Master’s in Public Administration and Criminology requires 66 credit hours, 33 in each discipline. Sample Courses:"
full_description = "Related Links Links FSU Askew School of Public Administration Joint Graduate Pathway in Criminology and Public Administration Prepare for careers in criminal justice management. Gain criminology and management knowledge necessary for positions in related public, private, and nonprofit organizations. Prepare for leadership or research positions within justice agencies. A Master’s in Public Administration and Criminology requires 66 credit hours, 33 in each discipline. Sample Courses: Criminal Justice Administration applies organization and administration theories to the criminal justice system and examines contemporary events in criminal justice administration from a historical perspective. Crime Policy Evaluation explores current topics in crime programs and factors that influence policymaking. Those interested in learning more about this option should contact the Graduate Program Administrator, Ana Palomino, for more information. Application deadlines Fall semester: July 1 Spring semester: November 1 Please visit the Askew School of Public Administration for more information."
