title = "Joint Graduate Pathways | College of Criminology & Criminal Justice"
description = "Joint graduate pathways are designed for ambitious students seeking a more hands-on career in the field of criminal justice. Advanced study at the graduate level allows students to pursue careers in criminal justice management in public, private, and not-for-profit organizations or as a Licensed Clinical Social Worker (LCSW) in the State of Florida while working with forensic clients."
full_description = "Related Links Downloads PDF: FAQs: Campus Graduate Program Joint graduate pathways are designed for ambitious students seeking a more hands-on career in the field of criminal justice. Advanced study at the graduate level allows students to pursue careers in criminal justice management in public, private, and not-for-profit organizations or as a Licensed Clinical Social Worker (LCSW) in the State of Florida while working with forensic clients. Interested students are invited to explore their potential in the joint graduate pathway with Public Administration or Social Work. All pathway programs are campus programs only and are not available through online study."
