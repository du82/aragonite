["https://criminology.fsu.edu/faculty-and-staff/emma-fridel"]
title = "Emma E. Fridel | College of Criminology & Criminal Justice"
description = "Emma E. Fridel received her Ph.D. in Criminology and Justice Policy from Northeastern University. She primarily studies violence and aggression with a focus on homicide, including school violence, homicide–suicide, serial and mass murder. Dr. Fridel’s work has been published in Criminology, Social Forces, and Justice Quarterly, and she is a co-author of Extreme Killing: Understanding Serial and Mass Murder."
full_description = 'Assistant Professor Emma E. Fridel received her Ph.D. in Criminology and Justice Policy from Northeastern University. She primarily studies violence and aggression with a focus on homicide, including school violence, homicide–suicide, serial and mass murder. Dr. Fridel’s work has been published in Criminology, Social Forces, and Justice Quarterly, and she is a co-author of Extreme Killing: Understanding Serial and Mass Murder. Research Interests Lethal Violence | Communities and Crime | Quantitative Methods | Homicide | Homicide-suicide | Serial and Mass Murder | School Violence | Lethal Violence Education Ph.D. 2020, Northeastern University; Criminology and Justice Policy M.A. 2018, Northeastern University; Criminology and Criminal Justice B.S. and B.A. 2014, Duke University; Biology and Asian and Middle Eastern Studies, Spanish minor Selected Publications Fridel, Emma E. 2025. "Revisiting the Structural (in)variances of homicide: Examining the differential effects of context across homicide types." Journal of Research in Crime and Delinquency, 62(1): 50-89. Fridel, Emma E. and Gregory M. Zimmerman. “Coercive control or self-defense? Examining firearm use in male- and female-perpetrated intimate partner homicide.” Available online first in the Journal of Research in Crime and Delinquency. Fridel, Emma E. 2021. “The contextual correlates of school shootings.” Justice Quarterly, 38(4): 596-625. Fridel, Emma E. and Gregory M. Zimmerman. 2019. “Putting homicide followed by suicide in context: Do macro-environmental characteristics impact the odds of committing suicide after homicide?” Criminology, 57(1): 34-73. Fridel, Emma E. and Gregory M. Zimmerman. 2019. “Examining homicide-suicide as a current in the stream analogy of lethal violence.” Social Forces, 97(3): 1177-1204. Contact Email efridel@fsu.edu Office 408 College of Criminology and Criminal Justice BLDG (CRM) Mail Code: 1273 Office Hours Monday: 1:00 PM - 2:30 PM or by appointment Resume / C