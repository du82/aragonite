title = "Alumni | College of Criminology & Criminal Justice"
full_description = "In this Section Alumni Awards Careers Distance Learning Events Faculty Featured Internship Internships News Rankings Research Students The Center for Criminology and Public Policy Research Recent News College of Criminology & Criminal Justice Launches Crime and Intelligence Certificate Program Criminology student Gladine Lamarre named FSU Student Star Criminology Researcher's Book Earns Top Honors from the Academy of Criminal Justice Sciences Undergraduate Certificate in Crime and Intelligence Analysis Launches FSU Criminology Student's Research Earns Accolades for Innovation College Researchers Spotlighted in October Faculty and Staff Briefs Jerry’s Legacy: Turning Challenges into Opportunities Student Spotlight: Ashley Funes Dr. Thomas Blomberg: Translating Research into Real-World Impact FSU criminology researcher receives early career award from the American Society of Criminology More News Alumni FSU Ph.D. Program Produces Academic Leader in Criminal JusticeMay 30, 2023 College of Criminology and Criminal Justice Doctoral Program alumnus Dr. J.C. Barnes has been appointed Director of the University of Cincinnati's (U.C.) School of Criminal Justice. Dr. Barnes joined the U.C. School of Criminal Justice in 2014 when he accepted a position as associate professor. In May 2020, he was named interim Director of the School. Dean Lawrence Johnson of the U.C. College of Education, Criminal Justice and Human Services appointed Dr. Barnes as Director starting in September 2023.Tagged: Alumni, News Retired Police Chief Reflects on Degree Leading to Successful Career in Law EnforcementApril 17, 2023 FSU College of Criminology and Criminal Justice graduate, John Carbone knew what he wanted to do at an early age. “I remember having a mock trial in my eighth-grade Government class. They walked us through the entire process, and I was fascinated. I knew I wanted to play a part in that process, and ultimately that interest led to my career in law enforcement.”Tagged: Alumni, Careers, News College of Criminology and Criminal Justice Alum Earns ACJS Academy New Scholar AwardJanuary 18, 2023 College of Criminology and Criminal Justice alumnus Dr. Peter Lehmann has been selected as the 2023 Academy New Scholar awardee by the Academy of Criminal Justice Sciences.Tagged: Alumni, News Retired Collier County Sheriff explains how bringing “Research to Life” bolstered his 35-year law enforcement career.August 25, 2022 Don Hunter, a graduate of the FSU College of Criminology and Criminal Justice, has dedicated his life to public safety in the state of Florida. Tagged: Alumni, Careers, News, Students President Emeritus Thrasher Joins College as Faculty Affiliate November 5, 2021 Florida State University President Emeritus John Thrasher has joined the College of Criminology & Criminal Justice as a faculty affiliate. President Thrasher retired this August, after serving as Florida State University’s 15th president for seven years. Tagged: Alumni, Faculty, News, Research, The Center for Criminology and Public Policy Research Dean Blomberg Discusses Importance of Criminology in PodcastNovember 3, 2021 Dean Blomberg was a recent guest on the podcast College Knowledge. In the episode, Criminology: Beyond Criminal Justice - A discussion with Dr. Tom Blomberg of FSU, Dean Blomberg discusses how the field of Criminology goes far beyond Criminal Justice and working in law enforcement. Dr. Blomberg explains how the research, analytics and data gathered by criminologists are being used to make the world a safer place. To listen to the full interview click here. Tagged: Alumni, Careers, Faculty, News, Research, The Center for Criminology and Public Policy Research College Institute Co-Director Brian M. Stephens appointed as Teneo Senior Managing Director October 6, 2021 Brian M. Stephens, co-director of the College’s Policing, Security Technology, and Private Security Research and Policy Institute, was appointed by Teneo as a Senior Managing Director with its Security Risk Advisory business segment.Tagged: Alumni, Careers, News, The Center for Criminology and Public Policy Research Chiricos Named 2021 ASC Fellow August 17, 2021 The College is pleased to announce that Dr. Ted Chiricos, William Julius Wilson Professor Emeritus of Criminology, has recently been named a Fellow of the American Society of Criminology (ASC).Tagged: Alumni, Awards, Faculty, News, Research Alumni Spotlight | Jason KaelinMarch 15, 2021 A sense of service, faith, family, and 1970s television programs led College of Criminology & Criminal Justice alumnus Jason Kaelin to his career in law enforcement and, ultimately, to his current position with the Federal Bureau of Investigation (FBI).Tagged: Alumni, Careers, News, Students College Alumnus Among Top 25 Most Influential CriminologistsFebruary 4, 2021 Matthew Robinson, College of Criminology & Criminal Justice alumnus and professor at Appalachian State University, was recently named among the Top 25 most influential criminologists by AcademicInfluence.com, coming in at the 19th most influential in the field.Tagged: Alumni, Awards, Careers, Faculty, News, Research, Students Pagination Current page 1 Page 2 Page 3 Page 4 Page 5 Page 6 Next page ›› Subscribe to Alumni"
