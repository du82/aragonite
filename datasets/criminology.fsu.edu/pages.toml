["https://criminology.fsu.edu/current-students/internships-and-opportunities/masters-internship-program"]
title = "Master’s Internship Program | College of Criminology & Criminal Justice"
description = "Below is information regarding the College’s Master’s Internship Program. Please also view documents located in the Related Links box for information on the Internship Process, FAQs, and the Internship Application. Full Time Internship (On Campus & Distance Learning):"
full_description = "Related Links Downloads PDF: MASTERS FIELD PRACTICUM PROCESS PDF: MASTERS FIELD PRACTICUM 2022 FAQS Links MASTERS FIELD PRACTICUM APPLICATION Fair Labor Standards Act Below is information regarding the College’s Master’s Internship Program. Please also view documents located in the Related Links box for information on the Internship Process, FAQs, and the Internship Application. Full Time Internship (On Campus & Distance Learning): Work 40 hours per week at affiliated agency Earn 9 credit hours of electives (for on campus) Earn 6 credit hours of electives (for on distance learning) Part Time Internship (Distance Learning Only): Work 20 hours per week at affiliated agency. Earn 3 credit hours of electives Academic Component: Students are required to complete academic assignments to receive a pass fail grade. Since interns are located in a multitude of locations, most of the communication between the faculty and interns is conducted electronically, via e-mail and Web-based instruction. Thus, a working knowledge of these media is necessary. Eligibility: Students must meet the following requirements to qualify for the program: Criminology master’s student Complete the five core courses with a grade of C or better: On Campus: CCJ 5109, CCJ 5285, CCJ 5606, CCJ 5705, CCJ 5706 Distance Learning: CCJ 5078, CCJ 5285, CCJ 5606, CCJ 5705, CCJ 5706 Minimum FSU GPA of 3.0 Registration: To participate in an internship, you must complete the following: Meet all eligibility requirements (see above) Decide what area of the field you are interested in or which specific agency you would like to intern with Meet application deadline and complete all required forms located on the right of this page under “Related Links” Register for CCJ 5945 (Full-time Internship) or CCJ 5946 (part-time Internship) Attend a mandatory orientation session Meet the University’s deadline date for fee payment Scholarships: There are several scholarships available to students who do an internship for academic credit, including a few specifically for students going to Pat Thomas Law Enforcement Academy. Please go to the website for more information about scholarships including deadlines and application information. Please note: Scholarship applications are due the year before you would like to intern so plan accordingly. Deadlines: Applications for academic credit should be turned in the semester prior to the start of your internship. Fall Application Deadline – June 1 Spring Application Deadline – November 1 Summer Application Deadline – March 1 Remember that agencies may have their own separate applications and deadlines, which may differ from those set by the College of Criminology. It is the student’s responsibility to clarify and meet all deadlines. For internship information contact: Tess Mattison Sr. Academic Program Specialist Internship Program Administrator tmattison@fsu.edu"
year_published = 2025
