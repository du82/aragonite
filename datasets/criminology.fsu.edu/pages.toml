["https://criminology.fsu.edu/news/college-criminology-criminal-justice-launches-crime-and-intelligence-certificate-program"]
title = "College of Criminology & Criminal Justice Launches Crime and Intelligence Certificate Program | College of Criminology & Criminal Justice"
description = "As law enforcement agencies increasingly rely on technology and data analysis expertise, demand for personnel equipped with these skills rises."
full_description = "February 7, 2025 Tags Careers News Students As law enforcement agencies increasingly rely on technology and data analysis expertise, demand for personnel equipped with these skills rises. A new program launched by the College of Criminology and Criminal Justice (CCCJ) at Florida State University aims to empower students with the tools to meet that growing need: the undergraduate Certificate in Crime and Intelligence Analysis. “This program is a logical extension of our college’s mission of translational research,” Dean Thomas Blomberg said. “The program ensures its students will gain theoretical grounding and practical hands-on learning opportunities to position them for success in this growing sector of law enforcement.” Central to that hands-on experience is the Capital Region Real Time Crime Center (CRRTCC). The center is a collaboration of the CCCJ, the Tallahassee Police Department, the Leon County Sheriff’s Office, the FSU Police Department and the Florida Department of Law Enforcement. The center, which launched in 2023, was recently named Center of the Year by the National Real Time Crime Center Association. Among its functions, the CRRTCC provides 24-hour, real-time data to local law enforcement on everything from car accidents to crimes in progress. Julie Brancale, assistant professor and co-director of the Real Time Crime Center Research and Policy Institute said the college’s role as an embedded research partner makes the CRRTCC one of a kind—and offers unmatched opportunity for students. In addition to working alongside researchers and CRRTCC analysts, students gain proficiency in essential tools, including crime mapping and Geographic Information Systems (GIS), statistical analysis software, data analytics, and the advanced technologies commonly used in RTCCs, such as surveillance systems and social media monitoring. But it is the college’s role as a founding partner at the CRRTCC that helps set it —and the certificate program—apart, Brancale said. “No other real time crime center has had a research partner embedded in its operations from the start,” she said. “The center offers a unique opportunity to provide students with tangible skills working in a cutting-edge environment.” Professor Brian Stults, who is also a co-director of the Real Time Crime Center Research and Policy Institute, agreed and said the program will position students for today’s job market. “Most people entering this field have very little knowledge of crime and intelligence analysis and they do most of their learning on the job,” he said. “This certificate allows our students to come out of FSU with a credential that shows they have specific knowledge and experience with these technologies and strategies — that's a tremendous advantage.” The program requires the completion of three required courses and one elective. Most of the classes will take place in the Learning Lab at the CRRTCC. “This is one of the fastest growing sectors of law enforcement, so we want our students equipped with the academic knowledge and the practical skills and hands-on experience,” said Young-An Kim, associate professor and co-director of the Real Time Crime Center Research and Policy Institute. “The demand for this expertise is soaring so this is very good timing for launching this program.” For more information, visit the Certificate in Crime and Intelligence Analysis or the Real Time Crime Center Research and Policy Institute."
