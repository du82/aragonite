description = "The most important response to crime has always been - and will always be - the human mind."
full_description = "Related Links Links Criminology Course Descriptions Cyber Criminology Course Descriptions Program Requirements The most important response to crime has always been - and will always be - the human mind. Welcome to Florida State University’s College of Criminology and Criminal Justice! We are thrilled you have chosen to learn more about the nation’s best programs in criminology and criminal justice. Our college is second to none in its access to industry-shaping minds and policy-defining research. Our top priority is to turn out graduates who possess critical, independent thinking skills and go on to fill top positions in academia, law, research, and many other criminal justice fields. A collaborative study environment and leadership engagement opportunities are just a few of the ingredients that help mold these skills. The College offers campus bachelor’s, master’s, and doctoral degrees and online bachelor’s and master’s degrees. We invite you to join our collaborative learning community and inspire your intellectual curiosity. Explore our degree programs to discover which path is right for you. Questions? Contact the Undergraduate or Graduate Criminology Advising team."
