["https://criminology.fsu.edu/degrees/graduate-programs/financial-assistance/fellowships"]
title = "Fellowships | College of Criminology & Criminal Justice"
description = "Joseph Harris Outstanding Teaching Fellowship  Candidate may nominate themselves or be nominated by students or faculty who have had direct experience or observations of their teaching abilities. Applicant must be a current doctoral student with a completed master’s degree in the College of Criminology and Criminal Justice. Applicant must be able to present evidence of excellence as a classroom instructor."
full_description = "Related Links Links FSU Office of Graduate Studies Joseph Harris Outstanding Teaching Fellowship Candidate may nominate themselves or be nominated by students or faculty who have had direct experience or observations of their teaching abilities. Applicant must be a current doctoral student with a completed master’s degree in the College of Criminology and Criminal Justice. Applicant must be able to present evidence of excellence as a classroom instructor. A three-course teaching load will be assigned to recipient. Courses may be taught either two in the fall and one in the spring, or vice versa. Application materials required: (1) letter of intent (2) formal teaching evaluations (3) written statement of teaching philosophy (4) nomination by student or faculty member (not required to apply). Learn more. Gordon P. Waldo Fellowship Awarded to highly motivated FSU criminology doctoral students with the intellectual curiosity necessary to challenge popular ideas about the causes, consequences, and control of crime. Partners Waldo Fellow with College faculty who are leading researchers in a field the fellow is interested in pursuing. Criminology and Public Policy and Social Problems Fellowships Funded by their related associations, these fellowships provide a fall, spring, and summer stipend of $19,000-$22,000 in addition to tuition waivers. Provides each fellow with valuable editorial experience and exposure to the publication process as the managing editor for each journal. Richard L. Rachin Fellowship Established in memory of Richard L. Rachin, founder of the Journal of Drug Issues. Awarded annually to an academically ambitious and successful student pursuing a Ph.D. in Criminology. Presents tuition waivers and a fall, spring, and summer stipend of approximately $16,000 per year. Provides the fellow with valuable editorial experience and exposure to cutting-edge drug research experience as the assistant editor for the Journal of Drug Issues. University Fellowships (Application deadline is January 15 for these fellowships.) The University Fellowship Program, administered by the Office of Graduate Studies, is a University-wide competition open to new and continuing graduate students. It provides a stipend of $18,000 plus a tuition waiver of up to twelve hours for Fall and Spring. Presidential University Fellowships are awarded to newly enrolling Ph.D. students. These awards are multi-year and provide a stipend of $23,000 for the first and fourth years each, plus a tuition waiver of up to twelve hours for each Fall and Spring, funded by the Office of Graduate Studies. The second and third year stipends and tuition waivers are funded by the College. The College also awards a one-year, $11,000 University fellowship to an outstanding incoming graduate student. Additionally, the University Fellow receives a tuition waiver of up to twelve hours for Fall and Spring. The Delores Auzenne Fellowship for Minorities awards a $5,000 stipend for the academic year, which is distributed in equal increments at the beginning of the Fall and Spring semesters. It is awarded to minority students enrolled as regular full-time graduate students or currently accepted for study in the graduate program. The McKnight Doctoral Fellow receives a $12,000 annual stipend plus tuition waivers. The fellowship is awarded to newly enrolling African-American students seeking a doctoral degree. It is renewable up to five years. The Leslie N. Wilson Assistantship provides $5,000 per year plus tuition waivers for newly enrolling Black American graduate students. Application forms are available in the Office of the Dean of Graduate Studies or from the director of graduate studies of the student’s program. The application deadline is February 1. National Graduate Awards and Fellowships The American Society of Criminology offers several award and fellowship opportunities for graduate students. ASC is an international organization whose members pursue scholarly, scientific, and professional knowledge concerning the measurement, etiology, consequences, prevention, control, and treatment of crime and delinquency. The National Institute of Justice Graduate Research Fellowship Program is an annual program that provides assistance to universities for dissertation research support to outstanding doctoral students undertaking independent research on issues related to crime and justice. Ford Foundation Fellowship Awards are offered at the Predoctoral, Dissertation and Postdoctoral levels. Through its Fellowship Programs, the Ford Foundation seeks to increase the diversity of the nation’s college and university faculties by increasing their ethnic and racial diversity, to maximize the educational benefits of diversity, and to increase the number of professors who can and will use diversity as a resource for enriching the education of all students. The American Association of University Women offers fellowship and grant opportunities for graduate students. AAUW has a long and distinguished history of advancing educational and professional opportunities for women in the United States and around the globe."
year_published = 2025
