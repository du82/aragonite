full_description = "Related Links Downloads Alpha Phi Sigma - Application Alpha Phi Sigma is a nationally recognized honor society for students in criminology and criminal justice. The society recognizes academic excellence by undergraduates and graduate students. To become a member, students must: Have completed one-third of the total hours required for graduation at The Florida State University Be recommended by the local chapter adviser or a faculty member Maintain a 3.2 overall GPA and a 3.2 GPA in their major courses (Undergraduates) Rank in the top thirty-five percent (35%) of their class and have completed a minimum of four (4) courses within the criminal justice curriculum The honorary is open to students with a declared criminal justice major or minor. To learn more, visit the Alpha Phi Sigma website. Questions? Contact: Alysia Pringle Apply here!"
