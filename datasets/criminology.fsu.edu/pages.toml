["https://criminology.fsu.edu/news/dr-thomas-blomberg-translating-research-real-world-impact"]
title = "Dr. Thomas Blomberg: Translating Research into Real-World Impact | College of Criminology & Criminal Justice"
description = "Dr. Thomas Blomberg, Dean and Sheldon L. Messinger Professor of Criminology in the College of Criminology and Criminal Justice at FSU, began his academic journey at the University of California, Berkeley."
full_description = "October 31, 2024 Dr. Thomas Blomberg, Dean and Sheldon L. Messinger Professor of Criminology in the College of Criminology and Criminal Justice at FSU, began his academic journey at the University of California, Berkeley. He was originally an engineering student but the social upheaval of the 1960s drew him to sociology. “The world was chaotic,” he recalled. “The Vietnam War, riots, and student rebellions were unfolding all around us. I wanted to understand what was happening, so I took a sociology course. That decision opened up a world of questions and shaped my career.” Blomberg’s passion for teaching emerged early. As a graduate student, he guided students to apply their research to real life changes in their community. “I’ve always loved teaching,” he said. “There’s no greater honor than seeing the light bulbs go off for students. Watching them go on to achieve great things is the ultimate reward.” After earning his undergraduate, master’s, and doctorate degrees at Berkeley, Blomberg joined FSU as an assistant professor. Despite initial reservations about moving to Florida, he and his wife Jeanine now see FSU as home. Today, Blomberg focuses on translational criminology—turning research into policies and practices that reduce crime. A principle he learned at Berkeley still drives him: “If your contribution to criminology doesn’t reduce the pain and suffering of crime, you’re missing the mark.” This belief underpins his work, including a partnership with Dr. Julie Brancale, a former student turned colleague. Together, they study financial exploitation of older adults, discovering that a strong sense of self-efficacy—not just age—helps prevent victimization. Looking forward, Blomberg envisions the College leading the nation’s translational research in criminology. The growth of the College, with the addition of the Kellogg building on the horizon, presents new opportunities. “We’ll have the space to bring practitioners and policymakers to campus, working side by side to address real-world problems with evidence-based solutions. Our students will learn how to apply research in tangible ways, setting an example that extends beyond Florida State, impacting the nation and beyond.” Blomberg believes that progress in criminology requires collaboration. “We need to step out of our ivory towers and work hand in hand with those on the front lines. It’s a team effort to tackle crime and its consequences.” Under Blomberg’s leadership, the College of Criminology and Criminal Justice is poised to make a lasting impact, in the classroom and beyond."
