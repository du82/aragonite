title = "College Faculty | College of Criminology & Criminal Justice"
full_description = "Home About the College College Faculty Dean's Office College Faculty College Staff Doctoral Candidates Directory Visiting Faculty/Post Doctoral Scholars/Adjunct Faculty Center for Criminology & Public Policy Faculty Undergraduate Advising Graduate Advising College Documents News Rankings & Recognition Recent News College of Criminology & Criminal Justice Launches Crime and Intelligence Certificate Program Criminology student Gladine Lamarre named FSU Student Star Criminology Researcher's Book Earns Top Honors from the Academy of Criminal Justice Sciences Undergraduate Certificate in Crime and Intelligence Analysis Launches FSU Criminology Student's Research Earns Accolades for Innovation College Researchers Spotlighted in October Faculty and Staff Briefs Jerry’s Legacy: Turning Challenges into Opportunities Student Spotlight: Ashley Funes Dr. Thomas Blomberg: Translating Research into Real-World Impact FSU criminology researcher receives early career award from the American Society of Criminology More News College Faculty Thomas G. Blomberg Dean and Sheldon L. Messinger Professor of CriminologyExecutive Director, Center for Criminology and Public Policy ResearchBlomberg’s research is focused upon identifying ways to more effectively link research knowledge to public policy. This includes examining the relationship between educational achievement among incarcerated youthful offenders and successful community reintegration.tblomberg@fsu.edu Claudia Anderson Assistant ProfessorClaudia Anderson’s research focuses on punishment, incarceration and correctional policies. ca24d@fsu.edu Megan Augustyn Associate ProfessorMegan Augustyn’s research focuses on the study of the causes and consequences of crime, victimization, and other health-risk behaviors across the life course. ma22br@fsu.edu William D. Bales Professor EmeritusFaculty Affiliate, Center for Criminology and Public Policy ResearchPrior to joining the faculty in the College of Criminology and Criminal Justice at Florida State University in August of 2003, Bill Bales was the director of research with the Florida Department of Corrections since 1991.wbales@fsu.edu Kevin M. Beaver Judith Rich Harris Professor of CriminologyDirector, Distance Learning ProgramBeaver’s research examines the biosocial underpinnings to antisocial behaviors. He has employed behavioral genetic and molecular genetic methodologies to unpack the gene-environmental basis to a range of criminal and delinquent outcomes.kbeaver@fsu.edu Julie Brancale Assistant ProfessorJulie Brancale's research focuses on understanding the causes, consequences, and justice system responses to financial exploitation and victimization of older adults. Additionally, she studies the impact of juvenile justice system involvement on education, desistence, and delinquency.julie.brancale@fsu.edu Cecilia Chouhy Associate ProfessorCecilia Chouhy received her Ph.D. in Criminal Justice from University of Cincinnati.cchouhy@fsu.edu Billy R. Close Assistant ProfessorDr. Billy Close is currently an Assistant Professor and Director of Service Learning and Mentoring in the College of Criminology & Criminal Justice at Florida State University. Dr. Close is married to Fran T. Close, Ph.D.bclose@fsu.edu Jennifer Copp Associate ProfessorJennifer Copp received her Ph.D. in Sociology from Bowling Green State University. Her research focuses broadly on the social influences on crime and other problem behaviors, in addition to the marginalizing effects of criminal justice involvement.jcopp@fsu.edu Kimberly M. Davidson Assistant Professor Kimberly M. Davidson received her Ph.D. in Criminology from The Pennsylvania State University. Her research focuses on corrections, programming and rehabilitation, community reentry, substance use. kdavidson@fsu.edu Emma E. Fridel Assistant ProfessorEmma E. Fridel received her Ph.D. in Criminology and Justice Policy from Northeastern University. She primarily studies violence and aggression with a focus on homicide, including school violence, homicide–suicide, serial and mass murder. Dr.efridel@fsu.edu Marc Gertz Professor EmeritusFaculty Affiliate, Institute for the Prevention of Financial FraudGertz is most well known for successfully conducting thousands and thousands of surveys, which have been used by professors and doctoral students within and outside the college for high quality research and publications in some of the top journals in the field.mgertz@fsu.edu Carter Hay ProfessorDirector, Graduate ProgramHay’s research examines the causes and prevention of crime with special attention to the family environment, the development of self-control, and policy efforts to reduce juvenile crime. chay@fsu.edu Bryan Holmes Assistant ProfessorBryan Holmes received his Ph.D in Criminal Justice from the University of Cincinnati. His research focuses on discretion, sentencing, courts, and punishment. bmh20bb@fsu.edu Young-An Kim Associate ProfessorYoung-An Kim received his Ph.D. in Criminology from the University of California-Irvine. His research interests include neighborhoods and crime, criminology of place, geo-spatial analysis, urban sociology, and quantitative research methods.youngan.kim@fsu.edu Gary Kleck Professor Emeritus | David J. Bordua ProfessorProfessor Kleck's recent research has found that employing more police officers or increasing police productivity in the form of more arrests per officer has no measurable effect on the public’s level of fear of crime.gkleck@fsu.edu Brendan Lantz Associate ProfessorBrendan Lantz received his Ph.D. from The Pennsylvania State University. His research interests focus on hate crime, violence, victimization, and co-offending.blantz@fsu.edu Daniel P. Mears Distinguished Research ProfessorMark C. Stafford Professor of CriminologyMears’ current research examines crime causation and criminal and juvenile justice. dmears@fsu.edu George B. Pesta Associate Professor Director, Center for Criminology and Public Policy ResearchAssociate Professor George Pesta is the Director of the Center for Criminology and Public Policy Research. At the Center, he manages funded research projects, supervises GRAs and collaborates with faculty on project deliverables, research reports, and presentations.gpesta@fsu.edu Sylwia J. Piatkowska Associate ProfessorSylwia J. Piatkowska received her Ph.D. in Sociology from State University of New York at Albany. Her areas of interest include crime and deviance, as well as international and comparative criminology. spiatkowska@fsu.edu Joseph A. Schwartz Associate ProfessorJoseph Schwartz’s research is focused on the interplay between biological and environmental influences in the development of behavior and health outcomes across major stages of the life course. jaschwartz@fsu.edu Keller Sheppard Assistant ProfessorKeller Sheppard received his Ph.D. in Criminology and Justice Policy from Northeastern University. His primary research focus is on police decision making and juvenile justice processes.ksheppard@fsu.edu Sonja E. Siennick ProfessorSonja Siennick studies criminal offending and mental health problems in the contexts of the life course and kinship and friendship relations.ssiennick@fsu.edu Brian J. Stults ProfessorStults' research focuses on the role of neighborhood context in shaping crime, delinquency, and criminal justice outcomes.bstults@fsu.edu Gordon P. Waldo Professor EmeritusDr. Waldo’s experience covers a wide range of activities related to academic criminology and the criminal justice system.gwaldo@fsu.edu Patricia Y. Warren ProfessorDirector, Undergraduate ProgramPatricia Warren Hightower received her Ph.D. in Sociology from North Carolina State University. pwarren@fsu.edu Marin R. Wenger Associate ProfessorMarin Wenger received her Ph.D. in Sociology from Pennsylvania State University. Her work focuses on stratification, communities and crime, deviance, and quantitative methods. mwenger@fsu.edu Steven Zane Assistant ProfessorSteven Zane received his Ph.D. in Criminology from the School of Criminology and Criminal Justice at Northeastern University. Additionally, Dr. Zane holds a J.D. from Boston College Law School. His research interests are juvenile justice, crime prevention, and criminal law and punishment. Dr.szane@fsu.edu"
