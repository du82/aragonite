full_description = "In this Section Alumni Awards Careers Distance Learning Events Faculty Featured Internship Internships News Rankings Research Students The Center for Criminology and Public Policy Research Recent News College of Criminology & Criminal Justice Launches Crime and Intelligence Certificate Program Criminology student Gladine Lamarre named FSU Student Star Criminology Researcher's Book Earns Top Honors from the Academy of Criminal Justice Sciences Undergraduate Certificate in Crime and Intelligence Analysis Launches FSU Criminology Student's Research Earns Accolades for Innovation College Researchers Spotlighted in October Faculty and Staff Briefs Jerry’s Legacy: Turning Challenges into Opportunities Student Spotlight: Ashley Funes Dr. Thomas Blomberg: Translating Research into Real-World Impact FSU criminology researcher receives early career award from the American Society of Criminology More News News College of Criminology & Criminal Justice Launches Crime and Intelligence Certificate ProgramFebruary 7, 2025 As law enforcement agencies increasingly rely on technology and data analysis expertise, demand for personnel equipped with these skills rises. Tagged: Careers, News, Students FSU Criminology Student's Research Earns Accolades for InnovationDecember 9, 2024 A doctoral student in Florida State University’s College of Criminology and Criminal Justice is being recognized for his innovative research into the role family history and supportive environments play in alcohol use disorders. Tagged: Awards, News, Students FSU criminology researcher receives early career award from the American Society of CriminologyOctober 25, 2024 A Florida State University researcher is being recognized by the American Society of Criminology (ASC) as one of the top early career scholars in her field. Tagged: Awards, Faculty, News FSU researcher finds differing labels for rape undermine public opinion of the crime's severityOctober 8, 2024 Years of re-labelling the crime rape using different terms such as sexual assault, has led to significant variation in public opinions on the crime’s severity, sparking consequences that can compound victim trauma and reduce perpetrator accountability, a Florida State University researcher has found.Tagged: News, Research Associate Professor Joseph Schwartz is tapped by Science Magazine for his ExpertiseOctober 3, 2024 Associate Professor Joseph Schwartz, of the College of Criminology and Criminal Justice, was tapped by Science Magazine to provide insights into a recent study brain trauma's effects on criminal behavior in children. Read the article here: Mild brain injuries don't predispose kids to criminal behavior, Danish study suggestsTagged: Faculty, News One year after launch, Capital Region Real Time Crime Center at FSU is recognized as national leaderOctober 2, 2024 Barely a year since the Capital Region Real Time Crime Center (CRRTCC) opened its tech-driven headquarters at Florida State University, it is already earning accolades and acclaim. Fresh off being named the Center of the Year by the National Real Time Crime Center Association (NRTCCA), officials say the CRRTCC stands at the vanguard of a field that is reshaping law enforcement.Tagged: News, Research FSU criminology researcher awarded $1 million to study effects of red flag lawsJune 3, 2024 A researcher at Florida State University’s College of Criminology and Criminal Justice (CCCJ) was awarded $1 million in funding to study red flag laws, which allow law enforcement agencies to petitioTagged: News A drive for real-world answers fuels College of Criminology & Criminal Justice graduate, Diana FishbeinMay 22, 2024 As a fifth grader growing up in a rough neighborhood outside Washington D.C., Diana Fishbein frequently wondered, “Why?”Tagged: News FSU criminology researchers spotlight evidence-based practices in new bookFebruary 23, 2024 Since the mid-1800s, efforts to identify evidence-based policies in criminology research have been scattershot, leaving a gap between the demand for effective policy and a precise understanding of what it is. Tagged: Faculty, News College of Criminology & Criminal Justice Celebrates FSU Day at the CapitolFebruary 9, 2024 The College of Criminology and Criminal Justice celebrated FSU Day at the Capitol last week. Graduate Program Administrator, Ana Palomino was thrilled to meet several of our alumni, including Angela Robinson, a reservation coordinator at the Capitol. She shared some fond memories of Dean Blomberg, who taught several of her courses. Ana also met Stephen Roberts, who graduated in 1984 and serves as a security guard at the Capitol after working for 40 years in the Sergeant at Arms office. Tagged: News Pagination Current page 1 Page 2 Page 3 Page 4 Page 5 Page 6 Page 7 Page 8 Page 9 Next page ›› Subscribe to News"
