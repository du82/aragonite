["https://criminology.fsu.edu/center-for-criminology-public-policy-research/journals"]
title = "Journals | College of Criminology & Criminal Justice"
description = "An indicator of the College’s national reputation and major achievement has been the selection of the College and College faculty to edit respected and widely read professional journals: Criminology and Public Policy, Justice Quarterly, Journal of Research in Crime and Delinquency, Journal of Criminal Justice Education, and Social Problems."
full_description = "An indicator of the College’s national reputation and major achievement has been the selection of the College and College faculty to edit respected and widely read professional journals: Criminology and Public Policy, Justice Quarterly, Journal of Research in Crime and Delinquency, Journal of Criminal Justice Education, and Social Problems. These selections have positioned the College as an influential presence in criminological research and publications and provides valuable experience for several graduate students each year who assist in various journal editorial processes. Dr. Theodore Chiricos, William Julius Wilson Professor of Criminology, held the editorship of Social Problems, one of the most widely read journals in the social sciences, from 2008-2010. Since 2007 the College has held the editorship of one of the most prominent journals in the field of Criminology. Criminology and Public Policy is a top research and policy journal and an official publication of the American Society of Criminology (ASC). It is a peer-review journal that is devoted to the study of criminal justice policy and practice. Graduate students gain insightful publications experience as managing editors. Dr. William Bales has been co-editor of Criminology and Public Policy since 2013. Prior to that, Dr. Thomas Blomberg, Dean and Sheldon L. Messinger Professor of Criminology, served as editor from 2007 – 2012. The College holds ownership of the Journal of Drug Issues. As a leader in its field, the Journal of Drug Issues is an instrument widely used by research scholars, public policy analysts, and those involved in the day-to-day struggle against the problem of drug abuse. Published quarterly, it is dedicated to providing a professional and scholarly forum centered on the national and international problems associated with drugs, especially illicit drugs. It is a refereed publication with international contributors and subscribers."
