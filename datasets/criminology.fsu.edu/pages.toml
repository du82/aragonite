["https://criminology.fsu.edu/degrees/undergraduate-programs/combined-bachelors-masters-pathways"]
title = "Combined Bachelor’s/Master’s Pathways | College of Criminology & Criminal Justice"
description = "Combined bachelor’s/master’s pathways are designed for ambitious students seeking a more hands-on career in the field of criminal justice. Undergraduates are invited to learn more about the combined bachelor’s/master’s pathway, which gives motivated students the opportunity to complete both a bachelor’s and master’s degree in just five years. The 3+3 Program opens doors for aspiring lawyers. Admission into this program allows students to earn their bachelor’s and Juris Doctorate degrees in just six years."
