["https://criminology.fsu.edu/degrees/undergraduate-programs/majors/cyber-criminology/cyber-criminology-course-descriptions"]
title = "Cyber Criminology Course Descriptions | College of Criminology & Criminal Justice"
description = "Cyber Criminology Program Course Descriptions Criminology CCJ 2020 Introduction to Criminal Justice (3): Designed to provide freshmen and sophomore students with knowledge of terminology, classification systems, trends, and theories of criminal justice. CCJ 3011 Criminology (3): This course introduces an examination of the field of criminology, including its theories, basic assumptions, and definitions."
full_description = "Related Links Links FSU College of Computer Science Cyber Criminology Program Course Descriptions Criminology CCJ 2020 Introduction to Criminal Justice (3): Designed to provide freshmen and sophomore students with knowledge of terminology, classification systems, trends, and theories of criminal justice. CCJ 3011 Criminology (3): This course introduces an examination of the field of criminology, including its theories, basic assumptions, and definitions. CCJ 3644 White Collar Crime (3): An overview of major issues in the study of white-collar crime. Topics include conceptual and definitional debates; forms of white-collar crime; theories and causes; offenders, victims, and costs; and investigation, prosecution, and sentencing. CCJ 3666 Victimology (3): This course introduces students to the field of victimology and explores its conceptual boundaries, basic concepts and literature within various subareas. CCJ 4497 Criminal Justice and Public Policy (3) This course examines historically significant and recent crime and criminal justice policies in terms of their antecedent factors, their impact on measurable outcomes, and their unintended consequences. CCJ 4614 Criminal and Delinquent Behavior (3): Examination of patterns of criminal and delinquent behaviors in light of theories and classification concepts. CCJ 4700 Introduction to Research Methods in Criminology (3): Basic methodological and statistical issues in criminology. CCJ 4746 Statistics in Criminology (3): This course introduces the fundamentals of statistics in criminology, criminal justice, and social science. Connecting abstract statistical concepts with real data is used to illustrate real life applications. CCJ 4938 Criminal Justice System Responses to Cybercrime (3): Major types of cybercrimes and their criminological motivations. Current law enforcement and prosecutorial responses to cybercrime. Protected rights of computer users and procedural law protections of the accused (cyberlaw). Current prosecution of cybercrimes and existing punishment mandates. Transnational issues in cybercrime enforcement and prosecution. CJC 3010 Corrections (3) This course provides an overview of correctional philosophies, practices, and procedures. CJE 3110 Law Enforcement (3): Advanced survey of law enforcement concentrating on the police, with emphasis on functions (law enforcement, order maintenance, public service) and responsibilities (e.g., preservation of constitutional rights, community relations), including organizational and management aspects. CJE 4610 Crime Detection and Investigation (3): Introduction to the lawful gathering and evaluation of information concerning criminal acts, with attention to the fundamentals of investigation, the organization and management of the investigative process, and the knowledge and skills necessary for investigation. CJJ 4010 Juvenile Justice (3): This course provides an examination of juvenile delinquency and juvenile justice, including legal and social history, definition and explanation of delinquency, and assessment of delinquency prevention and correctional programs, with emphasis on application of philosophical, legal, and procedural principles to problems and cases of juvenile justice. May require community service hours. CJL 3510 The Courts (3): This course examines the jurisdiction, policies, and procedures of courts in the administration of criminal justice. CJL 4064 Individual Rights and the Criminal Justice System (3): Examination of the full range of rights in criminal justice, dealing with them not only in broad philosophical and social terms but also in terms of specific instances, including the rights of the accused and extending to the rights of convicts, witnesses, victims, probationers, ex-convicts, officials, journalists, and the more generalized rights of participation by interest group advocates, taxpayers, and citizens in criminal justice policy and administration. COMPUTER SCIENCE CDA 3100 Computer Organization I (3): Co-requisites: COP3330, MAD2104. This is a core course intended for computer science majors with previous C/C++ background. The course introduces fundamental concepts in computer organization and digital logic design, including numbering systems and number representation, logic gates and design, the Von-Neumann architecture principle, and the machine instruction cycle. Assembly language programming with C language interfacing is also presented, reinforcing basic computer structure and machine cycle operation principles. CIS 3250 Ethics and Computer Science: This is a theory and skills course intended for students with a basic knowledge of computer science principles and programming languages. The course introduces fundamental concepts and analytical methods in Ethics, along with ethical, legal and social issues and questions in computer science that call for ethical analysis. The course also presents basic theories and skills in oral argument presentation and extemporaneous debate, including argument structure and debate practice. COP 3363: Introduction to Programming in C++ for Majors (3): Prerequisite: MAC 1140 or higher; or instructor permission. This course covers fundamental concepts and skills of programming in C++ in the Unix Environment. Students are instructed on efficient program design using a combination of procedural and Object Oriented paradigms. This course can be taken in place of COP 3014 and COP 3353. CEN 4020 Software Engineering I: This course starts with a rigorous study of object oriented design techniques and an introduction to current practices in Software Engineer. By the end of the course, students participate in a group design project putting into practice what they have learned to date. Topics include UML, Object Oriented Design, theory and practice of software engineering, ethics in Computer Science and Software Engineering, Software Engineering tools, requirements elicitation, software-requirements specification, requirements review, software development, software-development life cycle, teams, and project management. This course satisfies the University’s Scholarship in Practice as well as the Upper Division Writing requirements. CIS 4360 Introduction to Computer Security (3): Prerequisite: COP 3014 or equivalent programming course. Course covers computer security threats and attacks, covert channels, trusted operation systems, access control, entity authentication, security policies, models of security, database security, administering security, physical security and TEMPEST, and brief introductions to network security and legal and ethical aspects of security. CIS 4385 Cybercrime Detection and Forensics (3): Prerequisite: CDA 3100. Cybercrime activities leave a trail of incriminating evidence. In this course, students will focus on learning tools, techniques, and procedures for detecting cybercrime and analyzing collected data related to past and ongoing cyber offenses. The focus will be on forensic approaches that preserve the legal value of the collected evidence. CNT 4406 Network Security and Cryptography (3): Prerequisites: CDA 3100. This course examines threats to computer networks, network vulnerabilities, techniques for strengthening passive defenses, tools for establishing an active network defense, and policies for enhancing forensic analysis of crimes and attacks on computer networks. Topics include private and public key cryptography, digital signatures, secret sharing, security protocols, formal methods for analyzing network security, electronic mail security, firewalls, intrusion detection, Internet privacy and public key infrastructures. CNT 4504 Introduction to Computer Networks (3): Prerequisite: COP 4530. Circuit switched and packet switched networks, protocols, protocol layering, application layer, socket programming, transport layer, mulitplexing and demultiplexing. CNT 4603 Computer and Network System Administration (3): Prerequisites: CGS 3406 or COP 3014. This course offers a hands-on introduction to Unix and Microsoft Windows systems and network administration. Topics include the following: installation, maintenance, and extension of a multi-user computer system; development of administrative policies and procedures; user assistance and education; specifics of the Unix and Windows operating systems; and practical troubleshooting and problem solving. COP 3014 Programming I (3): Prerequisite: MAC 1140. Fundamental concepts and skills of programming in a high-level language. Flow of control: sequence, selection, iteration, subprograms. Data structures: arrays, strings, structs, ADT lists and tables. Algorithms using selection and iteration (decision making, finding maxima and minima, basic searching and sorting, simulation, etc.). Good program design using a procedural paradigm, structure and style are emphasized. Interactive and file IO. Testing and debugging techniques. Intended primarily for Computer Science or Computer Engineering majors, or anyone who is required to take COP 3330. COP 3252 Internet Applications Programming with Java: This course covers the applications of the Java language to education, electronic commerce, scientific research, and distributed systems in general. Topics include the following: the architecture of the Web, including software and protocols for passing information in typical Web applications; introduction to the Java programming language; developing Graphical User Interfaces using Swing; an introduction to distributed objects using Java Remote Method Invocation (RMI); and server-side programming using Servlets and JDBC. Emphasis is placed on practical programming using these technologies. COP 3330 Object Oriented Programming (3): Prerequisite: COP 3014 or a comparable course in C or C++ programming. Pre- or Corequisite: COP 3353. Object-oriented programming in a modern programming language; classes, objects, inheritance, and polymorphism; introduction to data structures and container classes. COP 3353 Introduction to UNIX (1): This is an introductory course in the use of the UNIX operating system designed for both majors and non-majors. Topics include: UNIX history, requesting UNIX accounts, logging in to a UNIX system, basic operating system concepts and file structure, basic commands, text editor(s)(to include emacs, vi, and pico), printing, mail, and online help. The goals of this course are to enable students to log in to their UNIX accounts from any type of computer and have a basic understanding of the commands and utilities. COP 4020 Programming Languages: This course covers the principles of programming languages, including language constructs, syntactic and semantic specification methods, runtime structures, implementation techniques, and alternative programming paradigms. The course involves programming assignments in a variety of languages and individual investigations accompanied by a required written report and oral presentation. COP 4342 Unix Tools (3): Prerequisites: COP 3330. This course is an introduction to selected Unix tools and utilities that are useful for advanced users, programmers, and system administrators, such as shell scripts, the perl language, revision control systems, debuggers, editors, and the make, awk, sed, and expect utilities. COP 4530 Data Structures, Algorithms, and Generic Programming (3): Prerequisites: COP 3330; MAD 2104 or 3107. Pre- or corequisite: CDA 3100. Definition, use and implementation of generic data structures using a modern programming language; reusable program components. COP 4610 Operating Systems and Concurrent Programming (3): Prerequisite: COP 4530. Pre- or Corequisite: CDA 3101. Design principles of batch, multiprogramming, and time-sharing operating systems; linking, loading, input-output systems, interacting processes, storage management, process and resource control, file systems. COP 4710 Theory and Structure of Databases (3): Prerequisites: COP 3330, MAD 2104. Theory of relational and object-oriented databases; relational database management systems and SQL; design, developmental, and implementation issues in database systems. MAD 2104 Discrete Mathematics I (3): Prerequisite: MAC 1140. Credit is not also allowed for MGF 3301. Mathematical techniques of definition and proof, with application to discrete domains; formal logic; elementary combinatorics; digraphs and relations; graphs, trees, and multigraphs; applications. IDC 4140. Introduction to Data Science (3) Prerequisite: COP 4530. This course is an introduction and overview of the fundamentals of Data Science. Students become familiar with the Data Science process and how to use the methodologies and algorithms to approach real world problems."
