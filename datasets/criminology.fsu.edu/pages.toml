title = "Policing Research & Policy Institute | College of Criminology & Criminal Justice"
description = "The Policing Research and Policy Institute is committed to advancing research on policing and private security and contributing to evidence-based public and private policing policies and practices. The Institute partners with the police, the private sector, and other security agencies to conduct research and evaluations that inform agencies’ and corporations’ policies and practices."
full_description = "Related Links Downloads Leon County Gun Violence Assessment Presentation.pdf Violence Intervention Comparisons Presentation.pdf Leon County Community-Based Violence Intervention and Prevention Initiative-Phase I Report.pdf Police & Private Security Roundtable Final Report.pdf The Policing Research and Policy Institute is committed to advancing research on policing and private security and contributing to evidence-based public and private policing policies and practices. The Institute partners with the police, the private sector, and other security agencies to conduct research and evaluations that inform agencies’ and corporations’ policies and practices. Law enforcement agencies in America face numerous challenges as they grapple with losing community confidence, increasing violence and gun crime rates in many urban centers, and an increased reliance on the technology required for their daily duties. Private security is also facing similar daunting challenges and companies are turning to their security, safety, and resiliency functions to help them navigate the myriad of threats and disruptions they face. The Institute informs both police and security policy with rigorous research that engages the community, increases public safety, and secures government and private assets. PARTNERSHIPS Florida Department of Law Enforcement Florida Police Chiefs Association Florida State University Police Department Florida Sheriffs Association Leon County Sheriff’s Office Major Cities Chiefs Association Palm Beach County Criminal Justice Commission Tallahassee Police Department Walton County Sheriff’s Office PROJECTS Evidence-based Criminal Justice System Planning in Palm Beach County FSU and Florida Department of Law Enforcement Research Partnership Project Leon County Community-Based Violence Intervention and Prevention Initiative Innovative Approaches to Advancing Traffic Safety and Enforcement The Future of Police and Private Security: An Executive Roundtable PODCAST The Community Safety Web Podcast FEATURED LINKS College Partners with Leon County Sheriff’s Office to Reduce Violent Crime- College of Criminology and Criminal Justice News, January 31, 2023 DIRECTORS | Thomas Blomberg, Darrel Stephens CO-DIRECTORS | Keller Sheppard, Brian Stephens and Nicolas Swagar."
