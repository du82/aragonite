ght evidence-based practices in new bookFebruary 23, 2024 Since the mid-1800s, efforts to identify evidence-based policies in criminology research have been scattershot, leaving a gap between the demand for effective policy and a precise understanding of what it is. Tagged: Faculty, News Three New Faculty Members join FSU CriminologySeptember 15, 2023 Tagged: Faculty, News FSU Partners with Johns Hopkins University to Reduce Traffic FatalitiesJuly 11, 2023 The FSU College of Criminology and Criminal Justice, Center for Criminology and Public Policy Research, is collaborating with the Johns Hopkins University Bloomberg School of Public Health to make our nation's roads safer.Tagged: Faculty, News, Research, The Center for Criminology and Public Policy Research Translational Criminology: Shaping America's Response to Crime (video)June 5, 2023 A new course at the FSU College of Criminology and Criminal Justice is designed to help eliminate the barriers between research and effective policy and practice. Translational Criminology & Politics (CCJ-6920) is co-instructed by FSU President Emeritus John Thrasher and Dean Thomas Blomberg.Tagged: Faculty, News, Research, The Center for Criminology and Public Policy Research Daniel Mears Op-ed on Policing Featured in Orlando SentinelJune 1, 2023 FSU's College of Criminology and Criminal Justice Distinguished Research Professor Daniel Mears co-wrote an op-ed on policing in America, recently published in the Orlando Sentinel. In the op-ed, Dr. Daniel Mears along with Dr. William R. Kelly from the University of Texas in Austin examines why America needs to reevaluate its public safety system.Tagged: Faculty, News, Research, The Center for Criminology and Public Policy Research Marin Wenger Honored with FSU Undergraduate Teaching AwardMay 24, 2023 Florida State University’s College of Criminology & Criminal Justice is pleased to congratulate Associate Professor Marin R. Wenger, who was recently honored by the University with an Undergraduate Teaching Award for Outstanding Teaching in the Major. Dr. Wenger was one of only 10 Florida State University faculty members to receive the award for the 2022-2023 academic year award.Tagged: Awards, Faculty, News, The Center for Criminology and Public Policy Research Podcast Brings the Policing, Security Technology, and Private Security Research & Policy Institute to Your Streaming DeviceMarch 23, 2023 The Co-Directors of the Policing, Security Technology, and Private Security Research & Policy Institute want to deliver the work of the Institute through an on-demand podcast. The Community Safety Web podcast, hosted by the father/son duo of Darrel and Brian Stephens, was created to promote the Institute within the fast-growing world of on-demand audio. The podcast publishes a new 30-minute episode each month, discussing a variety of policing and private security topics curated by Brian and Darrel. Tagged: Faculty, News, The Center for Criminology and Public Policy Research Pagination Current page 1 Page 2 Page 3 Page 4 Page 5 Page 6 Page 7 Page 8 Page 9 Next page ›› Subscribe to Faculty"
