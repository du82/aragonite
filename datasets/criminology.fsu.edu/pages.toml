["https://criminology.fsu.edu/news/criminology-researchers-book-earns-top-honors-academy-criminal-justice-sciences"]
title = "Criminology Researcher's Book Earns Top Honors from the Academy of Criminal Justice Sciences | College of Criminology & Criminal Justice"
description = "A researcher from Florida State University’s College of Criminology and Criminal Justice is being recognized by one of the field’s leading associations."
full_description = "February 3, 2025 Tags Awards Faculty A researcher from Florida State University’s College of Criminology and Criminal Justice is being recognized by one of the field’s leading associations. Professor Daniel Mears’ book, The Reinvention of Policing: Crime Prevention, Community, and Public Safety, was named Policing Book of the Year, by the Academy of Criminal Justice Sciences. The ACJS bestows the award to recognize “a significant publication that has substantially contributed to the understanding, development, or practice of policing.” “This award celebrates authors who have provided fresh insights, rigorous research, and innovative perspectives on law enforcement,” the association wrote in its statement announcing the award. Dr. Thomas Blomberg, dean of the College of Criminology and Criminal Justice, said Mears’ award is well deserved. “Dan brings a unique perspective and unbridled passion to his work, so it’s gratifying to see him get this recognition,” Blomberg said. “His topic is especially pertinent, given how much policing as an institution is being reevaluated throughout society.” Mears is a Distinguished Research Professor, the Mark C. Stafford Professor of Criminology, and Director of the Corrections Research and Policy Institute in the College’s Center for Criminology and Public Policy Research. He co-authored the book with William Kelly, professor of sociology and Director of the Center for Criminology and Criminal Justice Research at the University of Texas at Austin. The book identifies the many problems that confront and affect contemporary policing, and points to issues, such as insufficient training and mission creep, that make it difficult to effectively combat crime or to create trust or productive working relationships with communities. “Mission creep is a huge factor. Every time a new problem in society emerges, the police are asked to address it,” Mears said. “The police can’t do everything, and often they get pushed into addressing social problems that have nothing to do with crime.” Mears and Kelly provide a comprehensive roadmap of steps that can be taken. Foremost among them is the creation of agencies specifically tasked with crime prevention. “Step back and ask, ‘What is the institution in our society that is responsible for preventing crime?’” The answer: “There isn’t one.” Mears and Kelly highlight that a large amount of policing is reactive. Crime happens and then the police respond. They note that many law enforcement agencies take some steps to prevent crime, but by and large they do not have the resources or the mandate to systematically target the known causes of crime. “I think that's one of the appeals of the book is that it provides a comprehensive analysis that identifies problems in policing and what is known about effective policing practices. In addition, it identifies systemic changes—including creating agencies whose sole priority is crime prevention—that can be adopted to compliment changes to policing in ways that increase public safety and justice.” For more information, visit the Corrections Research & Policy Institute."
