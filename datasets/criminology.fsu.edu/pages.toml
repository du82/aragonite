["https://criminology.fsu.edu/prospective-students/degrees"]
title = "Degrees | College of Criminology & Criminal Justice"
description = "The most important response to crime has always been - and will always be - the human mind. Criminology is the scientific study of the causes, consequences, prevention, and control of crime. Knowledge gained from the scientific study of crime and criminal justice serves as the foundation for public policies and programs that improve the quality of life and promote social justice."
full_description = "The most important response to crime has always been - and will always be - the human mind. Criminology is the scientific study of the causes, consequences, prevention, and control of crime. Knowledge gained from the scientific study of crime and criminal justice serves as the foundation for public policies and programs that improve the quality of life and promote social justice. FSU’s College of Criminology and Criminal Justice sets the standard for education and scientific study of crime and criminal justice. Our top priority is to provide our graduates with critical and independent thinking skills. Our policy-defining research, collaborative study, and leadership engagement opportunities are just a few of the ingredients that help develop these important skills. The College offers campus bachelor’s, master’s, and doctoral degrees and online bachelor’s and master’s degrees. We invite you to join our collaborative learning community and inspire your intellectual curiosity."
