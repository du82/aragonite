["https://criminology.fsu.edu/current-students/internships-and-opportunities/workshops"]
title = "Workshops | College of Criminology & Criminal Justice"
description = "Designed to facilitate the shift between undergraduate life and the professional arena or graduate school, the College’s Career Development office provides services that are targeted specifically for the discipline of criminology and criminal justice. From time to time, other specialty workshops are provided to our students. To make sure you receive an up-to-date list of these workshops, subscribe to our student newsletter on the bottom of our home page."
full_description = "Related Links Links FSU Career Center Designed to facilitate the shift between undergraduate life and the professional arena or graduate school, the College’s Career Development office provides services that are targeted specifically for the discipline of criminology and criminal justice. From time to time, other specialty workshops are provided to our students. To make sure you receive an up-to-date list of these workshops, subscribe to our student newsletter on the bottom of our home page. In partnership with the FSU Career Center, students are given access to the following workshops: Resume Writing for Criminology Majors If you aren’t sure where to begin in writing your resume, this workshop is for you! The Resume Writing workshop involves a discussion of the purpose of a resume, the various sections within a resume, different resume styles, and strategies for formatting your resume. Common mistakes made in writing resumes are discussed, as are “Do’s” and “Don’ts” of resume writing. Writing cover letters and developing lists of references are also part of this hour-long workshop. Career Portfolio Become informed on how to use FSU’s newest career resource – the online Career Portfolio! Learn which skills employers value the most and how to document your experiences in an innovative way while gaining useful tips on how to manage your Career Portfolio. The online Career Portfolio is an unique tool that students can use to showcase their transferable skills to potential employers. Build Your Brand Have you ever wondered what employers think when they see your Facebook, Twitter, or other social media account? Learn to build your personal brand to ensure what you are showing them puts you in the best possible light. Interview and mock interview This hour long workshop is designed to help you learn how to prepare for the interview in terms of researching yourself, thinking about why an employer would want to hire you, researching the employer, knowing what to expect in an interview, how to dress properly, how to deal with anxiety. The workshop will cover typical interview questions, questions you might wish to ask the employer, steps to take following the interview. The FSU Career Center also offers Skype Mock Interviews. The program runs until November 21, 2014, so make sure you register today. Graduate school: To go or not to go Making the decision to go to graduate school is an important one. Pursuing a graduate or professional degree requires a significant investment of time and resources. This workshop will help you explore key factors in making the career decision to pursue an advanced degree. Information will be provided on the steps to follow in applying to graduate or professional school, and Career Center resources that can be helpful in this process. Internship for Academic Credit Information Session Learn about internships offered through the College of Criminology. The internship program in criminology gives students work experience that counts as academic credit. For the designated semester, students work 40 hours per week for a criminology or criminal justice affiliated agency and complete academic requirements outlined in the orientation session. Upon successful completion of the program, students earn 15 credit hours: 3 credit hours toward major requirements and 12 toward general electives. The internship is graded on a pass/fail (S/U) basis. Students also have the option of working part-time for 20 hours per week for a criminology or criminal justice affiliated agency and complete academic requirements outlined in the orientation session. Upon successful completion of the program, students earn 8 credit hours: 3 credit hours toward major requirements and 5 toward general electives. Also, the possibility of working part-time is ultimately up to the agency. Some agencies will not take part-time interns. Contact Jessica Webber, our Internship Director. Researching Potential Employers and Job Search Strategies Get in the know about the many types of employers that exist in the world of work, and find out more about those that best match your interests, values and abilities. This workshop will present strategies for obtaining employer information through various online, print and people resources, organizing employer information effectively, using resources and information for interviews, and making decisions about potential employment opportunities."
year_published = 2025
