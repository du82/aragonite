["https://criminology.fsu.edu/faculty-and-staff/george-pesta"]
title = "George B. Pesta | College of Criminology & Criminal Justice"
description = "Associate Professor George Pesta is the Director of the Center for Criminology and Public Policy Research. At the Center, he manages funded research projects, supervises GRAs and collaborates with faculty on project deliverables, research reports, and presentations. He has extensive experience in conducting program evaluations and field research, including designing and administering surveys, conducting qualitative observations, and conducting interviews and focus groups. He has primarily worked in the field of juvenile justice and correctional education for the past 22 years."
full_description = "Associate Professor Director, Center for Criminology and Public Policy Research Associate Professor George Pesta is the Director of the Center for Criminology and Public Policy Research. At the Center, he manages funded research projects, supervises GRAs and collaborates with faculty on project deliverables, research reports, and presentations. He has extensive experience in conducting program evaluations and field research, including designing and administering surveys, conducting qualitative observations, and conducting interviews and focus groups. He has primarily worked in the field of juvenile justice and correctional education for the past 22 years. His publications have been focused on the effectiveness and outcomes of juvenile justice programs. George Pesta also serves as the Veterans’ Liaison for the College of Criminology and Criminal Justice, the Faculty Advisor for the Student Leadership Council, and the Faculty Liaison for the College Development Council. Research Interests Translational Criminology | Correctional Education | Juvenile Justice | Delinquency & Education Education PhD. 2012, Florida State University, Education Leadership & Policy Studies M.A. 1996, DePaul University, English Composition B.A. 1992, Florida State University, English Literature Grants Principal Investigator, Translational Criminology: Research and Public Policy. $58,545 funded by the U.S. Department of Justice, National Institute of Justice. Principal Investigator, Assessing the Department of Juvenile Justice’s Sourcebook of Delinquency Interventions. $25,000 funded by the Florida Department of Juvenile Justice. Principal Investigator, Phase II, An Evaluation of the Educational Services in the Polk County Jail. $15,000 funded by the Polk County School Board. Principal Investigator, An Evaluation of the Educational Services in the Polk County Jail. $10,000 funded by the Polk County School Board. Project Director, Research Partner Project with the School Board of Palm Beach County to evaluate a School-Based Delinquency Intervention $981,481 funded by the U.S. Department of Justice, National Institute of Justice. Project Director, “Building and Enhancing Criminal Justice Researcher-Practitioner Partnerships,” a three year $495,329 project with the Florida Department of Juvenile Justice and funded by the U.S. Department of Justice, National Institute of Justice, January 1, 2014. Contact Phone 850.645.6101 Email gpesta@fsu.edu Office 403 College of Criminology and Criminal Justice BLDG (CRM) Mail Code: 1273 Office Hours By appointment Resume / CV Pesta CV February 2025_0.pdf256.34 KB Additional Documents CJC3010-Corrections Syllabus Spring 2024.pdf137.49 KB"
