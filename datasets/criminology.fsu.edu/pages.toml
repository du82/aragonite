title = "Research Brought to Life | College of Criminology & Criminal Justice"
description = "The FSU College of Criminology and Criminal Justice is a nationally-ranked and fast-growing College because we strive to be different. Our mission is to build an intellectual community that is comprised of students, professors, alumni, practitioners, and policy makers. Through our community’s focus on research, education, and service, we seek to bring research to life by directing our academic efforts to make a lasting societal difference, contributing to improving society by reducing the suffering, pain, and cost of crime in all aspects of the criminal justice system."
full_description = "The FSU College of Criminology and Criminal Justice is a nationally-ranked and fast-growing College because we strive to be different. Our mission is to build an intellectual community that is comprised of students, professors, alumni, practitioners, and policy makers. Through our community’s focus on research, education, and service, we seek to bring research to life by directing our academic efforts to make a lasting societal difference, contributing to improving society by reducing the suffering, pain, and cost of crime in all aspects of the criminal justice system. Through these efforts, we seek to create future leaders in our field that possess critical, research, and application skills, helping them succeed in their future careers and achieve their goals to improve society at large."
