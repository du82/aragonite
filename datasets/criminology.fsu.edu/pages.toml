["https://criminology.fsu.edu/degrees/graduate-programs/graduate-syllabi"]
title = "Graduate Course Descriptions | College of Criminology & Criminal Justice"
description = "Current students may log in to Student Central to view the current semester’s course schedule. CCJ 5016 Crimes of the Powerful (3) This course provides an in-depth examination of the many types of crimes committed by the powerful. Powerful people, corporations, and governments commit a variety of serious, deadly acts that if committed by “ordinary” or powerless people would be labeled and treated as criminal behavior."
full_description = "Current students may log in to Student Central to view the current semester’s course schedule. CCJ 5016 Crimes of the Powerful (3) This course provides an in-depth examination of the many types of crimes committed by the powerful. Powerful people, corporations, and governments commit a variety of serious, deadly acts that if committed by “ordinary” or powerless people would be labeled and treated as criminal behavior. CCJ 5028 Seminar in Criminal Justice (3) This course investigates in detail some special problems of criminal justice policy and practice. May be repeated to a maximum of nine semester hours. CCJ 5050 Proseminar in Criminology (3) This course provides an overview of various important issues in criminological theory and research and the administration of criminal justice. CCJ 5285 Survey of Criminal Justice Theory and Research (3) An overview of the theoretical issues and research on the law and legal control of deviance in society. CCJ 5456 Criminal Justice Administration (3) This course is an application of organization and administration theories to the criminal justice system. CCJ 5546 Prevention and Treatment of Crime and Delinquency (3) Theoretical development of crime prevention, punishment, and treatment. Topics include historical models of crime control, growth of crime prevention, and aspects such as environmental design, community action programs, and technology systems. CCJ 5606 Survey of Criminological Theories (3) Covers the major theories of criminal Involvement, with attention to each theory’s history, hypothesis, and empirical adequacy. CCJ 5607 History of Criminological Thought (3) An historical review of thought about crime and punishment with emphasis on the origin and evaluation of basic theories of crime-causation and community response as they arose in the nineteenth and early twentieth centuries. CCJ 5625 Ecology of Crime (3) An analysis of crime, delinquency, and victimization within various demographic and ecological systems of society. The course will focus on characteristics of offenders and offenses. CCJ 5636 Comparative Criminology and Criminal Justice (3) This course offers a comparative analysis of crime issues worldwide and reviews criminal justice system responses to both localized and transnational crime. CCJ 5669 Race, Ethnicity, Crime and Social Justice (3) This course considers the relationships among race, ethnicity, and crime in the justice system. The effect of social policy on racial and ethnic inequality is studied, and theories of ethnic and racial justice are presented in terms of their effect on crime and criminal justice. CCJ 5672 Gender, Crime and Justice (3) This course considers the impact of gendered relations on crime and justice. Theories of gender and society are presented and the special relationship between gender and crime is studied. CCJ 5704r Introduction to Research Methods and Statistics (3) A basic introduction for graduate students to statistics and research methods as they are used in criminology. It is intended for students who have not had undergraduate courses in methods or statistics. May be repeated to a maximum of six semester hours. CCJ 5705 Research Methods in Criminology I (3) Research design for criminological studies with an emphasis on data collection methods, measurement of validity and reliability, and causal analysis. CCJ 5706 Applied Statistics in Criminology I (3) This course focuses on the use of statistical techniques in criminology. CCJ 5707 Qualitative Methods in Criminology (3) Aimed at familiarizing students with the nature and utility of qualitative field work in various areas of criminological research. CCJ 5709 Survey Research Methods in Criminology and Criminal Justice (3) Prerequisites: CCJ 5705, CCJ 5706. This course is an introduction to the use of survey research in criminology and criminal justice. CCJ 5740 Data Analysis in Criminology and Criminal Justice (3) This course covers at an intermediate level, data analysis problems in quasi-experimental designs and theory testing in criminology. CCJ 5944 Supervised Teaching (3) (S/U grade only.) A practicum with the student in teaching, guided by an experienced teacher with whom the student meets from time to time for discussion of readings and classroom experiences. CCJ 5945 Field Practice in Criminology (9) (S/U grade only.) Prerequisite: Successful completion of CCJ 5605, 5606, 5705, or 5706; or instructor permission. CCJ 5946r Criminal Justice Practicum (3-6) (S/U grade only.) Prerequisites: CCJ 5078, 5285, 5606, 5704; nine semester hours of electives. This variable credit course serves as a capstone experience for students who have completed the other requirements for the master’s degree in criminology with a criminal justice studies major. The course culminates with a master’s paper that consists of an in-depth analysis of a subject related to the application of criminology and criminal justice. CCJ 5971r Thesis (1–6) (S/U grade only.) A minimum of six semester hours of credit must be earned. CCJ 5974r Area Paper in Criminology (1-6) (S/U grade only.) Prerequisite: instructor permission. The course offers an analysis and evaluation of literature within a substantive area of criminology. May be repeated to a maximum of six semester hours. CCJ 5981r Directed Individual Study (3) (S/U grade only.) A course with contents determined by the student in consultation with the instructor, with whom the student meets regularly for supervision of the study. May be repeated to a maximum of twelve semester hours. CCJ 6065 Professional Development in Criminology (3) This course provides students with the key training needed to engage in the professional activities central to a successful scholarly career in criminology. CCJ 6109r Advanced Seminar in Criminological Theory (3) An examination of the conceptual, logical, and empirical adequacy of major criminological theories. May be repeated to a maximum of nine semester hours. CCJ 6665 Victimology (3) Prerequisites: CCJ 5705, CCJ 5706. This course introduces students to the field of victimology and explores its conceptual boundaries, basic concepts and literature within various subareas. CCJ 6708 Seminar in Crime Research (3) Encourages advanced students to approach the multifaceted problem of research as a set of interrelated issues ranging from tasks of concept formation and theory construction through research design and data collection to the assessment and analysis of the generated data. CCJ 6741 Advanced Data Analysis in Criminology and Criminal Justice (3) A survey of advanced data analysis approaches used in criminological research. The course will generally cover problems of constructing indices and scales, procedures for analyzing limited dependent variable, structural equation models, models with latent variable and time series analysis. CCJ 6920r Seminar in Theoretical Criminology (3) Contents will vary as instructors present different developments, problems, and controversies. May be repeated to a maximum of twelve semester hours as content varies. CCJ 6980r Dissertation (1–12) (S/U grade only.) CCJ 8968r Preliminary Examination Preparation (1–12) (S/U grade only.) Preparation for doctoral preliminary examinations. Consent of major professor required. May be repeated to a maximum of twelve semester hours. CCJ 8969r Preliminary Doctoral Examination (0) (P/F grade only.) CCJ 8976r Master’s Thesis Defense (0) (P/F grade only.) CCJ 8985r Dissertation Defense (0) (P/F grade only.) CJC 5020 Penology (3) A survey of approaches to corrections, correctional institutions, their residents, programs and management, and special problems such as probation and parole, riots, outside contacts, and special institutions. CJE 5024 Police and Society (3) A social psychological examination of current issues and problems in municipal law enforcement, including such topics as the informal exercise of police authority, police role conflict, the relative significance of law enforcement and social service, and interactional dynamics of police subculture. CJJ 5020 Juvenile Justice (3) This course considers the processing of offenders through the juvenile justice system. It investigates the special forms of justice applied to non-adults by arrest, detention, adjudication and juvenile corrections. CJL 5420 Criminal Laws, Criminal Procedure and Individual Rights (3) The criminal justice system is based upon substantive and procedural criminal law. It is also a system of rights. This class considers the definitions and development of criminal law, criminal procedure and criminal rights, with special attention to constitutional theory and practice. CJL 5520 Structure and Process of the American Court System (3) Development of a positive and normative framework for analyzing criminal courts and an introduction of students to the basics of planning tools with applications to the management of criminal courts."
