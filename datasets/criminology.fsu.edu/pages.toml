["https://criminology.fsu.edu/degrees/graduate-programs/financial-assistance/scholarships"]
title = "Graduate Scholarships | College of Criminology & Criminal Justice"
description = "Apply for Scholarships today! The College of Criminology & Criminal Justice is accepting scholarship applications. Application deadline is September 3, 2024. To apply: Click here, sign in, and complete the general application plus the criminology conditional application. If you qualify for any additional scholarships, complete those applications as well."
full_description = "Related Links Downloads 2023-2024 Award Recipients Links Computer Criminology Scholarships Scholarship Applications Apply for Scholarships today! The College of Criminology & Criminal Justice is accepting scholarship applications. Application deadline is September 3, 2024. To apply: Click here, sign in, and complete the general application plus the criminology conditional application. If you qualify for any additional scholarships, complete those applications as well. Robert L. Clark Scholarship Competent and deserving graduate student. All new graduate students with completed graduate applications by January 15, are automatically considered for this scholarship pending acceptance into the graduate program. No application is required. Preference is given to students beginning their graduate work. The Dona R. Cormier Internship in Criminology Endowment Established to provide much needed support to the Criminology Internship Program. Junior, Senior, or Master’s level students in Criminology with a minimum 2.0 GPA. Student must be accepted into the College’s Internship Program. For internship program requirements and application, click here. Eugene and Rosalind Czajkoski Scholarship Fund Students enrolled in the FSU College of Criminology and Criminal Justice. Student must submit a 1500-2000 word essay demonstrating his or her interest in exploring, within criminology, issues involving the First Amendment of the U.S. Constitution. Winning essays often connect a first amendment constitutional issue such as discussing case law in the process, to an existing area of criminological research, such as discussing studies. Jerry A. and Carolyn S. Glass Scholarship Award Undergraduate or graduate student who demonstrates proven academic ability along with financial need. Preference given to students from Jackson County, Florida who are lineal descendants of current or deceased members of the Marianna Kiwanis Club or of current or deceased members of the Fishermen’s Sunday School Class of the First Baptists Church of Marianna, Florida. Charles Richter Reusing Scholarship This scholarship was established for full-time graduate students enrolled in the College of Criminology & Criminal Justice who have worked or plan to work in juvenile corrections upon completion of their graduate studies. Darrel W. Stephens Future Police Leaders Fund Established for graduate students enrolled in good standing in the College of Criminology & Criminal Justice who are actively employed in a law enforcement agency. The agency employer can be a local or regional police or sheriff’s department. Preference is given to first-generation students. Doyle E. and Janet T. Young Endowed Memorial Scholarship For former military or military dependents and federal law enforcement dependents pursing full-time undergraduate or graduate degrees in Criminology or Criminal Justice. Requires a minimum 3.0 GPA. Established to serve as a lasting tribute to the vision and commitment of Doyle E. Young to the development of future law enforcement officers. This scholarship serves as a testament to Doyle E. Young’s appreciation for the men and women serving their country in either the military or federal services."
year_published = 2025
