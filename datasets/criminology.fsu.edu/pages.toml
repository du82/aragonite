["https://criminology.fsu.edu/current-students/criminology-student-organizations/student-leadership-council"]
title = "Student Leadership Council | College of Criminology & Criminal Justice"
description = "College of Criminology and Criminal Justice Student Leadership Council (SLC) About: The Student Leadership Council (SLC) is a Recognized Student Organization (RSO) by Florida State University’s Student Government Association. The SLC serves as the liaison between the student body, the college administration, and the FSU student government."
full_description = "Related Links Downloads PDF: Crim SLC Constitution 7.1.2019 (1) College of Criminology and Criminal Justice Student Leadership Council (SLC) About: The Student Leadership Council (SLC) is a Recognized Student Organization (RSO) by Florida State University’s Student Government Association. The SLC serves as the liaison between the student body, the college administration, and the FSU student government. The council is composed of undergraduate majors and graduate students in criminology and criminal justice who work directly with the Dean, a faculty adviser, and the college administration to provide a student perspective. They create and oversee beneficial programming for students in an attempt to improve opportunities for personal and professional growth within the discipline. Activities: Each semester the SLC hosts or assists in hosting a variety of events in the college including: General Body Meetings The SLC hosts a speaker from the college to discuss opportunities to enhance student education and participation within the college. Such opportunities include directed individual studies, internship credits, career counseling, among others. In addition, the general body meeting is used to update SLC members on events and activities. Research Brought to Life Research brought to life is a speaker series that exposes students to research currently being conducted in the College of Criminology and Criminal Justice. Many of the research projects discussed are conducted in partnership with criminal justice agencies. Past speakers for this event include the Director of Research for the Florida Department of Juvenile Justice, professors, as well as graduate students. Criminology in Context Speaker Series Alumni working in the criminal justice field are invited to discuss their career and how their degree in criminology has benefited them. Past speakers include an FBI agent, attorneys, and a forensic psychologist, among others. Criminology Internship Fair and Criminology Career Panel Each year the SLC assists the college with executing a criminology specific internship fair in the fall semester and a career panel in the spring semester. Specifically, we assist by providing advertising and refreshments. Fallen Officer Memorial Spring 2018 the SLC assisted in the planning and dedication of the Fallen Officer Memorial. The Fallen Officer Memorial is located within the Eppes Memorial Garden, creating a reflective atmosphere to remember and honor FSU Criminology and Criminal Justice alumni who have lost their lives while serving in the line of duty. Faculty Advisor: Dr. George Pesta Joining the Criminology Student Leadership Council: Joining the SLC gives you an opportunity to build up yourself, your college, and your university as a whole. For information on events or how to apply contact us at crimslc@admin.my.fsu.edu. To get active updates on open positions and upcoming events visit the SLC’s Nole Central page and like the FSU College of Criminology - Student Leadership Council Facebook page."
year_published = 2025
clearnet = "https://criminology.fsu.edu/current-students/criminology-student-organizations/student-leadership-council"
