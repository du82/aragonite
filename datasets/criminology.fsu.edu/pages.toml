["https://criminology.fsu.edu/news/fsu-criminology-researcher-receives-early-career-award-american-society-criminology"]
title = "FSU criminology researcher receives early career award from the American Society of Criminology | College of Criminology & Criminal Justice"
description = "A Florida State University researcher is being recognized by the American Society of Criminology (ASC) as one of the top early career scholars in her field."
full_description = "October 25, 2024 Tags Awards Faculty News A Florida State University researcher is being recognized by the American Society of Criminology (ASC) as one of the top early career scholars in her field. The ASC bestowed Emma Fridel, assistant professor in the College of Criminology and Criminal Justice, with the 2024 Ruth Shonle Cavan Young Scholar Award, which recognizes scholarly contributions to the discipline of criminology by someone who received their graduate degree in the past five years. Thomas Blomberg, dean of the College of Criminology and Criminal Justice said he was thrilled —but not too surprised by Fridel’s acknowledgment. “Emma is a standout in our field who brings a unique, multidisciplinary approach to her work,” he said. “It’s gratifying to see the ASC acknowledge her work with an honor she richly deserves.” Blomberg added that the award underscores Fridel’s bright future: “It’s amazing to think that she’s just getting started.” Fridel’s work includes the study of violence and aggression with a focus on homicide, including school violence, homicide–suicide, serial and mass murder, and fatal officer-citizen encounters. “I’m incredibly honored and grateful to everybody who has helped me along the way,” Fridel said. “That includes advisors and colleagues and the College of Criminology and Criminal Justice for the opportunity to do this work.” Earlier this year, Fridel was awarded $1 million in funding from the National Institute of Justice and the National Collaborative on Gun Violence Research to study red flag laws, which allow law enforcement agencies to petition for the temporary removal of firearms from those deemed a danger to themselves or others. Fridel joins previous winners from FSU’s CCCJ, including Professor Kevin Beaver and Jillian Turanovic, who is now at the University of Colorado, Boulder. For more information, visit the Violence & Victimization Research & Policy Institute."
year_published = 2024
