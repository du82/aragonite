["https://criminology.fsu.edu/current-students/undergraduate-programs/majors"]
title = "Majors | College of Criminology & Criminal Justice"
description = "Designed with the idea of possibility in mind, the FSU Criminology and Criminal Justice undergraduate program offers a wide array of programs of study. The Criminology and Criminal Justice major is intentionally broad, giving students the opportunity to experience all the facets of the field and inspiring them to achieve their career aspirations. The Cyber Criminology major is just the opposite. This program is full of challenging coursework that equips students with the tools they need to fight cyber crime."
full_description = "Related Links Links Program Guide Designed with the idea of possibility in mind, the FSU Criminology and Criminal Justice undergraduate program offers a wide array of programs of study. The Criminology and Criminal Justice major is intentionally broad, giving students the opportunity to experience all the facets of the field and inspiring them to achieve their career aspirations. The Cyber Criminology major is just the opposite. This program is full of challenging coursework that equips students with the tools they need to fight cyber crime. No matter what your interest is, the College of Criminology and Criminal Justice is a great place to start."
