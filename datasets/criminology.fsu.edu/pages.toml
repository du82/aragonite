title = "Giving & Alumni | College of Criminology & Criminal Justice"
description = "The field of criminology is vastly different today than when the college graduated its first Ph.D. student in 1951. In fact, the rise of technology and instant global communications present new crime-fighting challenges. Yet we remain on the cutting-edge of those challenges by modeling timely, innovative research that results in public policy solutions for the entire criminal justice community."
full_description = "Related Links Links Make an online gift The field of criminology is vastly different today than when the college graduated its first Ph.D. student in 1951. In fact, the rise of technology and instant global communications present new crime-fighting challenges. Yet we remain on the cutting-edge of those challenges by modeling timely, innovative research that results in public policy solutions for the entire criminal justice community. We are fortunate to have some of the most generous and passionate supporters of any college of our kind in the nation – board members, alumni, individual donors, foundations, corporations, and within the criminal justice community. For our vital mission to continue at the highest possible level, your continued support will be foundational. As always, we are deeply grateful for your engagement and contributions. We look forward to hearing from you soon!"
