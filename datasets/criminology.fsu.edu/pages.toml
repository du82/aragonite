["https://criminology.fsu.edu/faculty-and-staff/gary-kleck"]
title = "Gary Kleck | College of Criminology & Criminal Justice"
description = "Professor Kleck's recent research has found that employing more police officers or increasing police productivity in the form of more arrests per officer has no measurable effect on the public’s level of fear of crime. Other recent research found that support for harsher punishment of criminals is not affected by a person’s exposure to crime as a crime victim, living in a high-crime area, or knowing others who have been victimized. Nor is it affected by their fear of crime or perceived risk of future victimization."
full_description = '''Professor Emeritus | David J. Bordua Professor Professor Kleck's recent research has found that employing more police officers or increasing police productivity in the form of more arrests per officer has no measurable effect on the public’s level of fear of crime. Other recent research found that support for harsher punishment of criminals is not affected by a person’s exposure to crime as a crime victim, living in a high-crime area, or knowing others who have been victimized. Nor is it affected by their fear of crime or perceived risk of future victimization. Instead, Americans’ punitiveness is driven by frequent viewing of local TV news, race (being white rather than black), and residence in a politically conservative area. Other recent research found that serious property offending (robbery, burglary) is unrelated to official unemployment (jobless and actively seeking employment) but instead is related to being out of the labor force – lacking a job and not actively seeking one. Finally, other research suggests that the use of large-capacity magazines by mass shooters does not affect the number of victims they kill or injure, mainly because nearly all mass shooters use multiple guns and/or multiple magazines, and therefore do not need large-capacity magazines to fire many rounds without reloading. Research Interests Gun Control | Deterrence | Crime Control | Violence Education Ph.D. 1979, University of Illinois at Urbana; Sociology M.A. 1975, University of Illinois at Urbana; Sociology B.A. 1973, University of Illinois, with High Honors and with Distinction; Sociology Grants 1994: "The Impact of Drug Enforcement on Urban Drug Use Levels and Crime Rates." $9,500 awarded by the U.S. Sentencing Commission. 1997: "Testing a Fundamental Assumption of Deterrence-Based Crime Control Policy." $80,590 awarded by the Charles E. Culpeper Foundation to study the link between actual and perceived punishment levels. Recent Publications Gary Kleck. 2018. “Response errors in survey estimates of defensive gun use.” Crime & Delinquency, Online, 3-26-18. Gary Kleck. 2018. “Macro-level research on the effect of firearms prevalence on suicide rates: a systematic review and new evidence.” Social Science Quarterly, in press. Kleck, Gary, and Dylan Jackson. 2017. “Does crime cause punitiveness?” Crime & Delinquency 63(12):1572-1599. Will Hauser and Gary Kleck. 2017. “The impact of police strength and arrest productivity on fear of crime and subjective assessments of the police.” American Journal of Criminal Justice 42:86-111. Gary Kleck and Bethany Mims. 2017. “Article productivity among the faculty of criminology and criminal justice doctoral programs, 2010-2014.” Journal of Criminal Justice Education 28(4):467-487. Selected Publications Kleck, Gary, Brion Sever, Spencer Li, and Marc Gertz. 2005. “The Missing Link in General Deterrence Research.” Criminology 43(3):623-659. Kleck, Gary and Jongyeon Tark. 2005. “Resisting Crime: The Effects of Victim Action on the Outcomes of Crimes.” Criminology 42(4):861-909. Kleck, Gary. 1997. Targeting Guns: Firearms and their Control. Hawthorne, N.Y.: Aldine de Gryter, Kleck, Gary and Marc Gertz. 1995. “Armed Resistance to Crime: the Prevalence and Nature of Self-defense with a Gun.” Journal of Criminal Law & Criminology 86(1):150-187. Kleck, Gary. 1991. Point Blank: Guns and Violence in America. Hawthorne, N.Y.:Aldine de Gruyter. Winner of the Michael J. Hindelang Award of the American Society of Criminology. Contact Email gkleck@fsu.edu Resume / CV Kleck CV 2021271.23 KB'''
