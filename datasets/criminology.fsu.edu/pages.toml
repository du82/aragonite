["https://criminology.fsu.edu/degrees/undergraduate-programs/majors/criminology-criminal-justice/criminology-course-descriptions"]
title = "Major Criminology Course Descriptions | College of Criminology & Criminal Justice"
description = "Current students may log in to Student Central to view the current semester’s course schedule. CCJ 2020 Introduction to Criminal Justice (3) This course is designed to provide freshmen and sophomore students with knowledge of terminology, classification systems, trends, and theories of criminal justice."
full_description = "Current students may log in to Student Central to view the current semester’s course schedule. CCJ 2020 Introduction to Criminal Justice (3) This course is designed to provide freshmen and sophomore students with knowledge of terminology, classification systems, trends, and theories of criminal justice. CCJ 3011 Criminology (3) This course introduces an examination of the field of criminology, including its theories, basic assumptions, and definitions. CCJ 3286 Psychology and Law (3) This course explores the intersection of criminal and civil law with psychology. It covers psychological principles in investigations, police interrogations, eyewitness testimony, and jury selection and dynamics. CCJ 3604 Forensic Psychology (3) This course introduces the basics of the forensic psychology, its application to specific crime types, and its relevance to various stages of criminal justice system processing. CCJ 3068 The Social Reality of Black Males (3) This course critically examines different viewpoints and non-reconciled positions about the current economic, social and political status of Black males in America. The relationship between stereotypical images and the complicated search among Black males for identity and manhood will also be explored. CCJ 3644 White Collar Crime (3) This course provides an overview of major issues in the study of white-collar crime. Topics covered include conceptual and definitional debates; forms of white-collar crime; theories and causes; offenders, victims, and costs; and investigation, prosecution, and sentencing. CCJ 3658 War on Drugs (3) This course analyzes the origins, escalation, and current status of the U.S. war on illegal drugs. Police, court, correctional, and community responses to drug use and drug crime will be examined. CCJ 3666 Victimology (3) This course examines the role of victims in crimes, their treatment by the criminal justice system, their decisions to report crimes and help prosecute offenders, victim assistance, and victim compensation. Special focus on sexual battery and domestic violence. CCJ 3677 Crimes against Humanity (3) This course is a multi-disciplinary examination of the emergence and impact of modern conceptions of human rights, including inquiry into the nature and sources of rights and of institutions for their enforcement, such as International War Tribunals and Peace and Reconciliation Commissions. Particular attention focuses on case studies of the violation or abrogation of human rights doctrines, drawing on literature, law, philosophy, history, religion, and the social sciences to explain and respond to the phenomena of crimes against humanity. CCJ 3688 Religion and Crime (3) This course examines the influence of religion on crime from historical, sociological, and criminological perspectives. Students learn how religion operates both as a protection against crime and as a motivation for crime. CCJ 3713 Crime Prevention (3) This course provides an overview of issues related to crime prevention, both from criminological and criminal justice points of view. The course examines crime prevention programs that encompass both the individual and community levels, as well as the integration of such levels. CCJ 4004 Comparative Criminology and Criminal Justice (3) This course introduces students to a global, comparative approach to the study of crime and criminal justice systems, beginning with the discussion of transnational crime and issues related to its measurement and continuing with the study of the four major legal traditions (common law, civil law, socialist law, and Islamic law) and the analysis of specific components of the criminal justice system across the world, including the police, courts, and corrections. CCJ 4031 The Individual and Society (3) This course introduces an understanding of normal human behavior and development in social context. CCJ 4036 – Communities and Crime (3) This course provides an overview of the studies of communities and crime. Existing criminological theories, and how they can be applied to the study of crime levels will be discussed. Attention will be given to the factors that influence community-level crime rates, as well as the ways in which community characteristics influence the behaviors and outcomes of individuals. CCJ 4037 Crime Victimization and the Media (3) This course examines how the news media cover crime and victimization impacts the the criminal justice system and crime victims. CCJ 4070 – Crime Hotspots (3) This course addresses the characteristics of places that promote criminal activity and those features of places that increase or decrease crime. Principal theoretical perspectives that link crime to place will be considered. CCJ 4075 Cybercrime (3) This course will focus on the ever-evolving effects of cybercrime in today’s society. Various aspects of cybercrime and the linkages of traditional crime to cybercrime and mainstream society at large will be explored. CCJ 4344 Punishment and Punitiveness (3) This course addresses different perspectives regarding punishment in contemporary societies. Particular attention will be given to contemporary discussions about punitiveness, its causes, consequences, and alternatives. CCJ 4450 Criminal Justice Administration (3) This course is an application of organization and administration theories to the criminal justice system. CCJ 4497 Criminal Justice and Public Policy (3) This course examines historically significant and recent crime and criminal justice policies in terms of their antecedent factors, their impact on measurable outcomes, and their unintended consequences. CCJ 4505 Juvenile Delinquency (3) This course focuses on sociological theory and research on juvenile delinquency in the United States. Basic concepts and principles taught in the major theoretical traditions in sociology are explored. CCJ 4507 Peers, Groups and Gangs (3) Peers influence offending behavior, both directly and indirectly. This course examines the role of peers in criminal behavior, beginning with an overview of theories and knowledge on peer influence and crime. CCJ 4601 Human Behavior (3) This course studies the origins of human and deviant behavior from a multidisciplinary approach (biological, psychological, sociological, criminological); addresses major theories and research, including case studies illustrative of deviant behavior such as drug abuse, suicide, mental illness, and sexual deviance. CCJ 4614 Criminal and Delinquent Behavior (3) This course is an examination of patterns of criminal and delinquent behaviors in light of theories and classification concepts. CCJ 4622 Life-Course Criminology (3) This course provides an overview of the major issues in life-course criminology. Major theoretical approaches to the topic, original research in the area, and applying knowledge to real-life scenarios will be explored. CCJ 4623 Violence in America (3) This course will explore definitions, patterns, and theoretical explanations of aggression and violence in the United States. Issues related to violent offending will be discussed as well as the main issues associated with violence in America. CCJ 4633 Gun Violence and Crime (3) This course introduces students to the gun violence debate in the United States. CCJ 4662 Minorities, Crime, and Social Policy (3) This course examines the involvement of minorities, especially African-Americans, in crime and in the criminal justice system. Special attention is paid to the role of racism in theories of crime and in American law and to the treatment of minorities by the various components of the criminal justice system. May require community service hours. CCJ 4663 Women, Crime and Justice (3) This course provides a flexible forum for the study and discussion of female crime and delinquency and gender issues in the criminal justice system. CCJ 4667 Crime and Victim Services (3) This course will introduce students to the various entities that provide assistance to victims of crime and examine the critical role of victim service providers in advocating for crime victims. In addition, students will consider the responsibilities of the criminal justice system to crime victims and the impact of the justice system’s involvement. CCJ 4684 Family Violence (3) This course will introduce the concept of family violence and the issues that surround criminal justice responses, protections, and policy in the United States. CCJ 4687 Evaluation and Assessment of Victim Services (3) This course offers a comprehensive overview of current research in the field and evidence based practices as well as explores the gaps and areas of needed research in victim service program evaluation and assessment. CCJ 4700 Introduction to Research Methods in Criminology (3) This course covers basic methodological and statistical issues in criminology. CCJ 4724 GIS application in Criminology (3) This course prepares students to become proficient interactive users of a GIS. This course covers basic geographic, cartographic, and GIS concepts as well as more advanced geospatial analysis techniques. CCJ 4746 Statistics in Criminology (3) This course introduces the fundamentals of statistics in criminology, criminal justice, and social science. Connecting abstract statistical concepts with real data will be used to illustrate real life applications. CCJ 4751 Data Management and Crime Analysis (3) Students will work with data and information sources that are regularly used for crime and intelligence analysis in law enforcement agencies. Students will learn how to use software tools and techniques used by crime analysts to gather, combine, analyze, and summarize data in support of criminal investigations and other responses to crime. CCJ 4905r Directed Individual Study (1–4) Prerequisites: Instructor and dean permission. A student registered for an individual-study course must submit a prospectus, outline, and bibliography and schedule at least one conference a week on campus. May be repeated to a maximum of twelve semester hours. CCJ 4909r Honors in Criminology (3) This course is designed for upper-division students with a grade point average of 3.2 in all courses. May be repeated to a maximum of twelve semester hours. CCJ 4933r Seminar in Criminology (3) This course introduces varying topics of selected interest and contemporary significance, discussed in a seminar format. May be repeated to a maximum of six semester hours. CCJ 4938r Special Topics in Criminology (3) This course content varies as instructors present different developments, problems, and controversies. May be repeated to a maximum of fifteen semester hours. May be repeated during the same semester. CCJ 4940 Internship in Criminology (15) (S/U grade only.) This internship facilitates field placement in an approved criminal justice agency for integration of theory and practice through participant observation study. CCJ 4942 Part Time Internship in Criminology (8) (S/U grade only.) Prerequisites: CCJ 2020, CCJ 3011, and CCJ 4700.This course facilitates part time field placement in an approved criminal justice agency for integration of theory and practice through participant observation study. CJC 3010 Corrections (3) This course provides an overview of correctional philosophies, practices, and procedures. CJC 4410 Theories and Methods of Offender Treatment (3) This course introduces theories and techniques that may be employed within the boundaries of probation, parole, or prison to influence and alter the attitudes, values, and behaviors of persons adjudicated guilty by the criminal justice system. CJE 3110 Law Enforcement (3) This course provides an advanced survey of law enforcement concentrating on the police, and places emphasis on functions (law enforcement, order maintenance, public service) and responsibilities (e.g., preservation of constitutional rights, community relations), including organizational and management aspects. CJE 4114 Police Problems and Practices (3) This course provides an analysis of both the traditional and contemporary issues and problems existing in the law enforcement community. Topics represent a wide variety of concerns, including such areas as corruption, police use of deadly force, and the utilization of law enforcement to combat corporate crime, computer crime, and terrorism. CJE 4339 Law and Ethics in Victim Services (3) This course will provide an overview of ethical standards within the criminal justice profession in general and specifically analyze ethical issues as they relate to crime victim advocacy. The course will also explore common ethical conflicts and how to apply ethical and legal standards and decision making to resolve them as well as multi-cultural competency and ethical responsibilities. CJE 4610 Crime Detection and Investigation (3) This course offers an introduction to the lawful gathering and evaluation of information concerning criminal acts, with attention to the fundamentals of investigation, the organization and management of the investigative process, and the knowledge and skills necessary for investigation. CJE 4732 Introduction to Crime Analysis (3) This course provides an introduction to crime and intelligence analysis in law enforcement agencies. Theoretical backgrounds of crime analysis and analytical crime prevention techniques from strategic, tactical, and administrative perspectives will be explored. CJJ 4010 Juvenile Justice (3) This course provides an examination of juvenile delinquency and juvenile justice, including legal and social history, definition and explanation of delinquency, and assessment of delinquency prevention and correctional programs, with emphasis on application of philosophical, legal, and procedural principles to problems and cases of juvenile justice. May require community service hours. CJL 3410 Procedural Criminal Law (3) This course offers an examination of the law of criminal procedure in the United States. Procedural criminal law consists of the principles and rules that must be followed by the government in its attempt to enforce criminal laws. Major procedural protections for suspects and criminal defendants provided by the United States Constitution will be explored. CJL 3510 The Courts (3) This course examines the jurisdiction, policies, and procedures of courts in the administration of criminal justice. CJL 4038 Law, Society and the Administration of Justice (3) This course examines how law shapes and is shaped by economic relations, morality, social solidarity, state institutions, political domination, democratic governance, and legal consciousness, and how law impacts and is influenced by race, gender, and class relations. The course explores how social groups use law and legal ideology to press their rights to remedy social inequalities and to what extent these groups are successful. Students become familiar with major theoretical traditions in law and society as well as sociological issues such as "
