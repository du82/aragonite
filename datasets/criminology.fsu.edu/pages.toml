title = "Joseph A. Schwartz | College of Criminology & Criminal Justice"
description = "Joseph Schwartz’s research is focused on the interplay between biological and environmental influences in the development of behavior and health outcomes across major stages of the life course."
full_description = "Associate Professor Joseph Schwartz’s research is focused on the interplay between biological and environmental influences in the development of behavior and health outcomes across major stages of the life course. Research Interests Biosocial Criminology | Life-course/Developmental Criminology | Traumatic Brain Injury | Behavioral Endocrinology | Behavior Genetics | Quantitative Research Methods | Criminological Theory Education Ph.D. 2014, Florida State University; Criminology and Criminal Justice M.A. 2009, California State University, San Bernardino; Criminal Justice B.A. 2007, California State University, San Bernardino; Criminal Justice Grants Examining the Role of Physiological and Psychological Responses to Critical Incidents in Prisons in the Development of Mental Health Problems among Correctional Officers. National Institute of Justice (#2017-R2-CX-0032), $787,907, Co-Principal Investigator (with Benjamin Steiner). Selected Publications Schwartz, Joseph A., Emily M. Wright, Ryan Spohn, Michael F. Campagna, Benjamin Steiner, & Ebonie Epinger (2022). Changes in Jail Admissions Before and After Traumatic Brain Injury. Journal of Quantitative Criminology, 38, 1033-1056. https://doi.org/10.1007/s10940-021-09524-7. Schwartz, Joseph A., Eric J. Connolly, & Abdulaziz Alsolami (2022). Within-Individual Changes in Impulsivity and Sensation Seeking from Childhood to Early Adulthood and Educational Attainment. Journal of Youth and Adolescence, 51, 2190-2204. https://doi.org/10.1007/s10964-022-01663-9. Connolly, Eric J., Joseph A. Schwartz, & Kristina Block (2022). The Role of Poor Sleep on the Development of Self-Control and Antisocial Behavior from Adolescence to Adulthood. Journal of Criminal Justice, 82, 101995. https://doi.org/10.1016/j.jcrimjus.2022.101995. Schwartz, Joseph A. (2021). A Longitudinal Assessment of Head Injuries as a Source of Acquired Neuropsychological Deficits and the Implications for Criminal Persistence. Justice Quarterly, 38(2), 196-223. https://doi.org/10.1080/07418825.2019.1599044. Schwartz, Joseph A., Eric J. Connolly, & Jonathan R. Brauer (2017). Head Injuries and Changes in Delinquency from Adolescence to Emerging Adulthood: The Importance of Self-Control as a Mediating Influence. Journal of Research in Crime and Delinquency, 54(6), 869-90. Contact Phone 850.644.7949 Email jaschwartz@fsu.edu Office 304A College of Criminology and Criminal Justice BLDG (CRM) Mail Code: 1273 Office Hours Monday: 9 AM - 10 AM Wednesday: 9 AM - 10 AM (and by appointment) Resume / CV Schwartz CV 2024297.4 KB Additional Documents CCJ5706 Syllabus Spring 2024277.19 KB CCJ6741 Syllabus Spring 2024254.6 KB"
