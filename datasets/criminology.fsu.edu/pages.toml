["https://criminology.fsu.edu/faculty-and-staff/keller-sheppard"]
title = "Keller Sheppard | College of Criminology & Criminal Justice"
description = "Keller Sheppard received his Ph.D. in Criminology and Justice Policy from Northeastern University. His primary research focus is on police decision making and juvenile justice processes. Prior to joining Florida State University, he worked as a Senior Research Analyst for the Florida Department of Juvenile Justice."
full_description = 'Assistant Professor Keller Sheppard received his Ph.D. in Criminology and Justice Policy from Northeastern University. His primary research focus is on police decision making and juvenile justice processes. Prior to joining Florida State University, he worked as a Senior Research Analyst for the Florida Department of Juvenile Justice. Research Interests Police Use of Force | Criminal Investigations | Juvenile Risk Assessment Instrument | Juvenile Justice Violence Prevention | Implementation Science | Trauma-Informed Care Education Ph.D. 2023, Northeastern University; Criminology and Criminal Justice M.A. 2020, Northeastern University; Criminology and Criminal Justice B.A. 2015, University of Georgia; Sociology and Criminal Justice Selected Publications Sheppard, Keller G., Michaela M. Wilson, Lacy H. Reddick, Garrett O. Tucker, and Ashley H. Schwab. 2022. “Reducing staff burnout and turnover intentions in juvenile justice residential commitment programs: The promise of trauma-informed care.” Journal of Criminal Justice, 82: 1-10. Sheppard, Keller G. and Riley Tucker. 2022. “Police Shooting Mortality: Investigating Individual, Incident, and Contextual Factors Differentiating Fatal and Non-Fatal Police Shootings.” Journal of Ethnicity in Criminal Justice, published online before print September 19, 2022, DOI: 10.1080/15377938.2022.2122648. Sheppard, Keller G. 2022. “Florida Trauma Responsive and Caring Environment (TRACE): Exploratory factor analysis of a staff and youth Trauma-Informed Self-Assessment Tools in juvenile residential programs.” Youth Violence and Juvenile Justice, published online before print August 4, 2022, DOI: 10.1177/15412040221116057. Sheppard, Keller G., and Brandon C. Welsh. 2022. “Can police use of less-than-lethal weapons reduce harm during violent police-citizen encounters? A systematic review and directions for future research.” Aggression and Violent Behavior, 64: 101748. Sheppard, Keller G., Gregory M. Zimmerman, and Emma E. Fridel. 2022. "Examining the Relevance of Contextual Gun Ownership on Fatal Police Shootings." Justice Quarterly, 39(6): 1214-1236. Sheppard, Keller G., and Jacob I. Stowell. 2021. "Police fatal force and crime reporting: a test of community responses to fatal police-civilian encounters." Journal of Interpersonal Violence, 37(21): 1-29. Contact Phone 850-644-1763 Email ksheppard@fsu.edu Office 310B Office Hours Monday: 9:30 a.m. to 11:30 a.m. Wednesday: 10:30 a.m. to 12:30 p.m. Resume / CV FSU CV_Sheppard Fall 2023_0.docx26.3 KB'
