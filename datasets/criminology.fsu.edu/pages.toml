description = "Kaylee Noorman ​​​ Office: 402C College of Criminology & Criminal Justice Building (CRM)  kmfitzpatrick@fsu.edu"
full_description = "Kaylee Noorman ​​​ Office: 402C College of Criminology & Criminal Justice Building (CRM) kmfitzpatrick@fsu.edu Noorman received her PhD in Criminology and Criminal Justice from Florida State University. Her research focuses on juvenile justice education, felony disenfranchisement, and translational criminology. Her work on juvenile justice education examined barriers to school reentry and the mechanisms underlying the relationship between juvenile justice system contact and high school dropout. Her work on felony disenfranchisement focused on contextualizing it and its consequences for civic participation. Underlying her research has been a translational criminology focus to apply research to policy and practice. Tiffaney Tomlinson ​​​ Office: 315B College of Criminology & Criminal Justice Building (CRM) ttomlinson@fsu.edu Tomlinson received her Ph.D. in Criminology and Criminal Justice from Florida State University. Her research interests include the causes and consequences of mass incarceration, offending, and victimization. She has published in Crime and Delinquency, the Journal of Interpersonal Violence and Justice Quarterly."
