["https://criminology.fsu.edu/news/college-researchers-spotlighted-october-faculty-and-staff-briefs"]
title = "College Researchers Spotlighted in October Faculty and Staff Briefs | College of Criminology & Criminal Justice"
description = "Five researchers from the College of Criminology and Criminal Justice were singled out for their work in this month's Faculty and Staff Briefs, published by FSU News. Emma Fridel, Ph.D. (College of Criminology and Criminal Justice) earned the 2024 Ruth Shonle Cavan Young Scholar Award from the American Society of Criminology. For more information, visit the Violence & Victimization Research & Policy Institute."
full_description = "November 13, 2024 Five researchers from the College of Criminology and Criminal Justice were singled out for their work in this month's Faculty and Staff Briefs, published by FSU News. Emma Fridel, Ph.D. (College of Criminology and Criminal Justice) earned the 2024 Ruth Shonle Cavan Young Scholar Award from the American Society of Criminology. For more information, visit the Violence & Victimization Research & Policy Institute. Brendan Lantz, Ph.D., Marin Wenger, Ph.D. (College of Criminology and Criminal Justice) and doctoral student Jack Mills earned lead article honors for “Understanding Community Hate Crimes as an Incorrigible Proposition: Local Political Attitudes, Path Dependance, and the Ceremonious Reporting of Hate Crime Statistics” from the Journal of Criminology. For more information, visit the Hate Crime Research & Policy Institute. Megan Augustyn, Ph.D. (College of Criminology and Criminal Justice) co-authored “What is Rape? Elements of Rape and Application of the Criminal Label” in the Journal of Experimental Criminology. For more information, visit the Life Course Research & Policy Institute."
