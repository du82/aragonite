nal Justice and working in law enforcement. Dr. Blomberg explains how the research, analytics and data gathered by criminologists are being used to make the world a safer place. To listen to the full interview click here. Tagged: Alumni, Careers, Faculty, News, Research, The Center for Criminology and Public Policy Research Dean Blomberg to lead session on Translational Criminology & Politics at JRSAOctober 28, 2021 College of Criminology & Criminal Justice Dean Thomas G. Blomberg will be a main presenter at this year’s Justice Research and Statistics Association Fall Criminal Justice Series. Dean Blomberg will be presenting a session on translational criminology and politics.Tagged: Careers, Events, Faculty, News, Research, Students, The Center for Criminology and Public Policy Research Join Us | Criminology Internship Fair | Oct. 28October 7, 2021 Criminology Internship Fair Join Us: Thursday, October 28 Noon – 4:00 p.m. SSB | Rm. 203 Business casual attire preferred, but not required If you are thinking of interning anytime in the next year, don’t miss out on this opportunity to meet representatives from agencies encompassing private, public, and non profit sectors. Questions: Contact Internship Director Katie Dean Moore. Tagged: Careers, Events, Internships, News, Students Pagination Current page 1 Page 2 Page 3 Page 4 Page 5 Page 6 Page 7 Page 8 Next page ›› Subscribe to Careers"
