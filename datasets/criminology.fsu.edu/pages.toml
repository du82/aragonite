["https://criminology.fsu.edu/careers/professional-organizations-2"]
title = "Professional Organizations | College of Criminology & Criminal Justice"
description = "Connect with other professionals in the field of criminology and criminal justice As soon as students are accepted into the College of Criminology and Criminal Justice, they are encouraged to connect with professional organizations with ties to their area(s) of interest. Some of the most notable organizations include membership from hundreds of FSU Criminology students and alumni that are introduced and stay connected at conferences around the globe. Take a moment to explore these organizations and consider getting involved today."
full_description = "Related Links Links American Society of Criminology Academy of Criminal Justice Sciences American Sociological Association Law and Society Association European Society of Criminology Connect with other professionals in the field of criminology and criminal justice As soon as students are accepted into the College of Criminology and Criminal Justice, they are encouraged to connect with professional organizations with ties to their area(s) of interest. Some of the most notable organizations include membership from hundreds of FSU Criminology students and alumni that are introduced and stay connected at conferences around the globe. Take a moment to explore these organizations and consider getting involved today. Lambda Alpha Epsilon Lambda Alpha Epsilon (LAE) is a national organization dedicated to improving criminal justice through educational activities. LAE Goals Foster professionalism in law enforcement personnel and agencies Promote professional, academic, and public awareness of criminal justice issues Encourage the establishment and expansion of higher education and professional training in criminal justice Provide a unified voice for professionals in, and students of, criminal justice Promote high standards of ethical conduct, professional training, and higher education within the criminal justice field. To become a member of the Florida State University chapter of LAE, students must meet the following requirements each semester: Participate in half of the scheduled fundraising events. Complete two-thirds of scheduled LAE community service events. Attend/participate in half of the LAE Intramural Events. Attend two-thirds of LAE social events. Attend all guest speaker lectures. Speakers will attend regularly scheduled Sunday meetings at least once a month. Pay a $85 induction fee to the Lambda Chapter within six weeks of the beginning of the semester. Each semester, $60 dues are owed to the Lambda Chapter. Pay a $36 induction fee to the American Criminal Justice Association within six weeks of the beginning of the semester. Each year, $30 dues are owed to the National Chapter. Regular attendance at scheduled meetings. Meetings are held on Sundays at 7 p.m. in Bellamy room 21. Competition is not a requirement, but strongly encouraged. There is a regional competition held every Fall and a national competition held every Spring. Competitions include five academic tests (juvenile justice, corrections, LAE knowledge, courts, and police administration) and two physical skills tests (an agility portion, consisting of a police academy obstacle course, and a 48-round pistol-shooting course.)"
year_published = 2025
clearnet = "https://criminology.fsu.edu/careers/professional-organizations-2"
