["https://criminology.fsu.edu/degrees/online-degree-programs/online-bachelors-program"]
title = "Online Bachelor’s Program | College of Criminology & Criminal Justice"
description = "Online Bachelor’s Degree in Criminology A bachelor’s degree in criminology and criminal justice at FSU prepares you to be a critical thinker and problem solver in many careers. It also builds an excellent foundation of knowledge for students to pursue graduate degrees or law school."
full_description = "Related Links Downloads PDF: Criminology Match Major Sheet Online Bachelor’s Degree in Criminology A bachelor’s degree in criminology and criminal justice at FSU prepares you to be a critical thinker and problem solver in many careers. It also builds an excellent foundation of knowledge for students to pursue graduate degrees or law school. Get the prestige of an FSU criminology degree with the flexibility of online coursework. Receive the same diploma as on-campus criminology students. No on-campus visits required Designed specifically for the non-traditional student, the online program allows those who are currently working, or who are not geographically located close to campus, the flexibility to take coursework while balancing a busy schedule that can lead to the completion of a bachelor’s degree. Quality and Flexibility Take classes with professors who are leaders in the field. Use state-of-the-art technology supported by one of the most “wired” universities in the country. Tailor your schedule to the demands of your job and family. Guidance through every phase of the program. For students who choose to pursue the criminology major, careers to consider include detective, child welfare caseworker, crime intelligence analyst, victim advocate, corporate security specialist, private investigator, fish and wildlife officer, and social services case manager. Coursework/Program Requirements for Online Bachelor’s Degree in Criminology To graduate, a student must meet the following requirements: Associate of Arts Degree from a Florida public institution, or completion of FSU’s liberal studies requirements Completion of the oral competency requirement Complete a total of 36 semester hours in criminology Make a grade of C or better in the three core courses: CCJ 2020, CCJ 3011, CCJ 4700, CCJ 4746 (for students entering FSU in Fall 2024 and after) Maintain an overall GPA of 2.0 and receive no more than two grades below C- in criminology coursework Complete the requirements necessary to earn a minor or second major in another department. A full-time internship may be completed in lieu of a minor. Internships are not available in every state. For more information, visit the Office of Distance Learning. Earn at least 27 (of the 36) semester hours in CCJ coursework directly from the College. (A maximum of 9 semester hours may be transferred in to the major.) Fulfill the CLAST requirement before being admitted to the College Fulfill University requirements for the Bachelor of Science (BS) degree Textbook Information Some of your online learning courses may require you to purchase a Course Packet, which will include some combination of the following: Study Guide — This is your key to the course, as it contains your course syllabus, descriptions of course activities and resources, assignments, and a course calendar. It may also provide additional course content. Textbooks — Most courses have required readings, which include textbooks and other published materials. Media — These could include video and audiotapes and/or CD-ROMs. How to order Course packets and materials for the online classes are usually available at one of the bookstores listed below. Individual instructors may choose to make materials available through other outlets. Florida State University (Follett) Mailing address FSU Bookstore Main Level – Parking Garage Florida State University Tallahassee, FL 32306-4113 Online ordering Order your books online with Efollett E-mail address Email the FSU Bookstore Phone # (toll free) 1-800-255-3781 Fax # 1-850-644-9953 Method of payment accepted Visa, MasterCard, American Express, Discover, check, or money order Shipping Charge Yes System Requirements You need basic computer ware to take distance courses. You must own or have regular access to: A Computer An Internet Service Provider A telephone Computer Specs Required Check the recommended minimums for new computers."
