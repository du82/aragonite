["https://criminology.fsu.edu/center-for-criminology-and-public-policy-research/institutes/biosocial-criminology-research-policy"]
title = "Biosocial Criminology Research & Policy Institute | College of Criminology & Criminal Justice"
description = "Producing cutting-edge research examining the intersection between genetic and environmental factors in the prediction of serious and violent antisocial behaviors."
full_description = "Producing cutting-edge research examining the intersection between genetic and environmental factors in the prediction of serious and violent antisocial behaviors. The Biosocial Criminology Research & Policy Institute is committed to producing cutting-edge research examining the intersection between genetic and environmental factors in the prediction of serious and violent antisocial behaviors. Moreover, the Institute is also concerned with developing and empirically testing biosocial policies that are designed to prevent the development of violent offenders and to effectively rehabilitate criminals. Toward this end, the Institute is designed to focus on the following: Developing new samples that allow for the study of criminal behavior from a truly biosocial criminological perspective Conducting experiments that allow for empirical assessment of biosocial instruments, measurements, and hypotheses Fostering cross-disciplinary collaboration to advance knowledge on the biosocial underpinnings to antisocial behaviors Developing new and empirically based approaches to preventing crime and rehabilitating offenders Creating new and innovative quantitative approaches that allow for a thorough examination of issues related biosocial theories, explanations, and ideas Training undergraduate and graduate students on how to conduct biosocial criminological research, how to use and apply biosocial methods and statistical approaches, and how to collect biosocial data Securing external grants that will allow for a more comprehensive understanding on the biosocial basis to criminal offending PARTNERSHIPS Florida Department of Corrections Minnesota Department of Corrections PROJECTS Examining the Role of Physiological and Psychological Responses to Critical Incidents in Prisons in the Development of Mental Health Problems among Correctional Officers HIGHLIGHTED/FEATURED LINKS Science Magazine: Mild brain injuries don't predispose kids to criminal behavior, Danish study suggests DIRECTOR | Kevin M. Beaver, Ph.D. CO-DIRECTOR | Joseph A. Schwartz, Ph. D. CONTACT INFORMATION For more information on the Biosocial Criminology Research & Policy Institute, contact Drs. Kevin M. Beaver,or George B. Pesta."
year_published = 2025
