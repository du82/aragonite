title = "Brian J. Stults | College of Criminology & Criminal Justice"
description = "Stults' research focuses on the role of neighborhood context in shaping crime, delinquency, and criminal justice outcomes. He examines how social and environmental factors-such as neighborhood disadvantage, family dynamics, and peer networks-shape both criminal behavior and broader justice system outcomes. His work also evaluates advancements in law enforcement, with particular attention to their impact on and perceptions among community residents."
full_description = '''Professor Stults' research focuses on the role of neighborhood context in shaping crime, delinquency, and criminal justice outcomes. He examines how social and environmental factors-such as neighborhood disadvantage, family dynamics, and peer networks-shape both criminal behavior and broader justice system outcomes. His work also evaluates advancements in law enforcement, with particular attention to their impact on and perceptions among community residents. Using advanced quantitative methods, he assesses policies and interventions to provide evidence-based insights into crime and justice policy. Research Interests Communities and Crime | Contextual Influences on Crime and Behavior | Advanced Quantitative Methods | Law Enforcement Evaluation | Translational Criminology Education Ph.D. 2003, University at Albany, State University of New York; Sociology B.A. 1994, Western Michigan University; Sociology Recent Publications Tomlinson, Tiffaney A., Daniel P. Mears, Brian J. Stults, Ryan C. Meldrum, Jillian J. Turanovic, and Jacob T. N. Young. 2022. "The Legacy of Troubled Childhoods: Adverse Childhood Experiences, Sleep, and Delinquency." Crime & Delinquency, advance online publication. Stults, Brian J., and Myunghee You. 2022. "Self-control, Cyberbullying, and the Moderating Effect of Opportunity." Deviant Behavior, 42:1267-1284. Stults, Brian J., Jorge Luis Hernandez, and Carter Hay. 2021. "Low Self-Control, Peer Delinquency, and Crime: Considering Gendered Pathways." Journal of Research in Crime and Delinquency, 58:666-709. Stults, Brian J., and Nic Swagar. 2021. "The Role of Neighborhood Context in the Relationship between Parenting Effectiveness and Self-control." Crime & Delinquency, 67:1459–1490. Selected Publications Stults, Brian J., Jorge Luis Hernandez, and Carter Hay. 2021. "Low Self-Control, Peer Delinquency, and Crime: Considering Gendered Pathways." Journal of Research in Crime and Delinquency, 58:666-709. Stults, Brian J., and Nic Swagar. 2021. "The Role of Neighborhood Context in the Relationship between Parenting Effectiveness and Self-control." Crime & Delinquency, 67:1459–1490. Stults, Brian. J., & Hasbrouck, Matthew. 2015. The Effect of Commuting on City-Level Crime Rates. Journal of Quantitative Criminology, 31, 331-350. Stults, Brian. J., & Baumer, Eric. P. 2007. Racial Threat and Police Force Size: Evaluating the Empirical Validity of the Minority Threat Perspective. American Journal of Sociology, 113, 507-546. Contact Phone 850.645.7376 Email bstults@fsu.edu Office 302A College of Criminology and Criminal Justice BLDG (CRM) Mail Code: 1273 Office Hours Tuesday: 1:30 PM - 5:00 PM Resume / CV Stults CV 2022163.86 KB Additional Documents CCJ4614 Syllabus Spring 2024309.96 KB CCJ4700 Syllabus Spring 2024169.83 KB CCJ5625 Syllabus Spring 2024239.18 KB'''
