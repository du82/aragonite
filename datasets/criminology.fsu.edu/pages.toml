full_description = "Real Lives. Real Problems. Real Solutions. The Florida State University College of Criminology & Criminal Justice’s Center for Criminology & Public Policy Research (the Center) expands the influence of scholarship in the public policy arena. The Center promotes the use of evidence-based criminological research in policy and practice at the local, state, and national levels. The Center’s primary goal is to promote evidence-informed criminal justice policymaking and practice at the local, state, and national levels. The Center facilitates and supports data collection and research initiatives that both advance the academic discipline of criminology and inform juvenile and criminal justice policy and practice. The Center pursues these goals through the following research institutes: Aging Adult Fraud Research & Policy Institute Biosocial Criminology Research & Policy Institute Corrections Research & Policy Institute Hate Crime Research & Policy Institute International & Comparative Criminology Research and Policy Institute Jail Research & Policy Institute Juvenile and Adult Correctional Education Research & Policy Institute Juvenile Justice Research & Policy Institute Life Course Research & Policy Institute Native American Crime and Justice Research & Policy Institute Policing Research & Policy Institute Crime and Social Control Research & Policy Institute Real Time Crime Center Research & Policy Institute Violence & Victimization Research & Policy Institute Each institute produces rigorous, policy-relevant research in close partnership with local, state, and national criminal justice agencies. Some of the Center’s partner agencies include the Florida Department of Corrections (FDC), the Florida Department of Juvenile Justice (DJJ), and the Palm Beach County Criminal Justice Commission. Through partnering agencies and other outlets, research findings are disseminated to policymakers, practitioners, and citizens to guide policy and practice. Finally, each research institute contributes to the discipline of criminology with theoretically relevant and methodologically sound research published in leading academic journals. Click here for projects conducted within the Center that don't fall under the purview of individual institutes. RELATIONSHIP WITH THE COLLEGE The College of Criminology & Criminal Justice has built nationally ranked programs around three overlapping principles: Research, Education, and Service. Combined, these principles are the foundation from which the College achieves its top priorities of creating future leaders in the field who will ultimately reduce the pain and suffering associated with crime through the creation of evidence-based criminal justice policy. As a branch of the College of Criminology & Criminal Justice, the Center works closely with college faculty and graduate students. Several of the Center’s institutes are directed by college faculty or have faculty affiliates, and the College’s faculty members lead most of the Center’s projects. In addition, master's and doctoral students gain valuable experience working as research assistants on externally funded projects. Through the Center, graduate students are provided excellent opportunities to gain a wide array of experiences and diverse perspectives while training to be tomorrow’s leaders in criminal justice academia, policy, and practice. EXECUTIVE DIRECTOR | Thomas G. Blomberg, Ph.D. DIRECTOR | George B. Pesta, Ph.D. CONTACT INFORMATION For more information on the Center for Criminology & Public Policy Research, contact George B. Pesta, Ph.D., Director, (850) 645-6101; gpesta@fsu.edu. Related Downloads Center Annual Report 2023-2024 Center Annual Report 2022-2023 Center Annual Report 2021-2022 Center Annual Report 2021 Center Annual Report 2020 Center Annual Report 2018-2019 Center Annual Report 2017-2018 Center Annual Report 2016-2017 Center Annual Report-2015-2016 Center Annual Report 2014-2015 Center Annual Report 2013-2014 Strategic Plan 2015-2016 Society for Prevention Research Plenary 6.1.18_Pesta Blomberg - Making a Difference 9.10.18 Making a Difference in Criminology Building Effective Partnerships Between Researchers and Practitioners"
