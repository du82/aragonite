ertain features and remember your preferences. For example, cookies keep you logged in, allow you to purchase items, and maintain your language and volume settings. Third parties set cookies for both essential and non-essential purposes including analytics (e.g., Google Analytics) and advertising (e.g., Google DoubleClick for Publishers). Third-party cookies may differ among Producer Sites depending on a number of factors, including whether the Producer has enabled advertising, and which analytics providers are being utilized. Producer Apps: Producer apps do not use cookies, but may use tracking technologies to, for example, authenticate you as a registered user, allow you to use the app’s features, and help the Producer understand how the app is being used. You cannot opt out of these mobile tracking technologies, but you may delete the app and use the web version instead.Vimeo OTT video player: Vimeo OTT’s embeddable video player uses first-party cookies that we consider essential to the video player experience. Please note that a third-party website may place cookies of its own. We have no control over third-party websites or the cookies they set.Changing Your Cookie PreferencesYou may limit the cookies set in your browser by taking the steps described below. Note that declining cookies may impact your ability to use our services.Browser settings: You may change your browser’s settings to delete cookies that have already been set and to reject new cookies. To learn more, visit the help pages of your browser:FirefoxChromeSafariMicrosoft EdgeInternet ExplorerYou may also visit our sites in your browser’s “private” or “incognito” mode, in which case cookies will be set, but deleted when you close your browser.Opt-out (EU users): Users from the EU may opt out of non-essential cookies by selecting the option below. Upon opting out, we will, to the extent possible, delete any non-essential first party cookies in your browser and remember your cookie preference for your