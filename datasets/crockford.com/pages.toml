["https://www.crockford.com/contextcoloring.html"]
title = "Context Coloring"
full_description = "Syntax coloring is very popular, especially with coders who still struggle with basic syntax. I think we can do better. Color can more profitably help us to quickly understand the structure of a program. We have a color for the top level stuff (say black). Functions defined at the top level are green. Inner functions are brown. Inner inner functions are blue, and so on. Spotting the functions in a program and their nesting is much more important than an assist in discriminating between identifiers and strings. Each level of function is given a specific color, but variables retain the color of the function (or context) in which they are declared. I call this Context Coloring. This allows us to instantly see how the nested functions close over the outer functions. Syntax coloring isn't useless, it is childish, like training wheels or school paste. It is great for a while, and then you might grow up. I no longer need help in separating operators from numbers. But assistance in finding the functions and their contexts and influences is valuable."
