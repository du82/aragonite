["https://www.crockford.com/dom.html"]
title = "DOM Is As DOM Does"
full_description = "I started writing JavaScript in 2000. Our first two applications were social: a trading collecting game and a graphical chat system. I had previously invested tens of millions of dollars in Java projects, and was very disappointed in the results. So in a fit of desperation, I decided to give the browser a try. The number of browsers at that time was either 2 or n, depending on how you did your reckoning. There was Netscape Navigator and Microsoft Internet Explorer. There were others, like Mosaic and Lynx, but they did not run JavaScript, and their marketshare was insignificant. NN was up to its 4th edition. IE was up to 5.5. There was no sort of auto-update yet, so the majority of users tended to stay on the first version they installed. Macintosh versions were quite different from Windows versions. Making things worse, there were frequent bug fixes released, which sometimes introduced new bugs. You could not depend on fixes getting installed, which meant that the number of testable browsers was huge and constantly growing, approaching n. The set of potential browsers bugs only grew. The API that the browser presented to JavaScript was the strangely named Document Object Model, or DOM. It was at its core a badly designed model which Netscape and Microsoft interpreted and extended in incompatible ways. It was a difficult time to be a web developer, which is why we saw virtually no successful web development (as we currently understand it) until the Ajax Revolution of 2005. Two important things happened to make the Ajax Revolution possible. The first was that Netscape failed to deliver Navigator 5. They did deliver Navigator 6 and 7, but they were so unstable that they failed to get much adoptions. So use of Netscape Navigator slowly declined as old computers that had it installed failed or were replaced. The second was that Microsoft disbanded the Internet Explorer team thinking that the Browser War was over. They put IE6 into maintenance, and put all of their creative energy into Dot Net, WPF, and the failure that would become Silverlight."
author = "Douglas Crockford"
year_published = 2025
