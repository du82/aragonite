["https://www.crockford.com/about.html"]
title = "About Douglas Crockford"
full_description = "Douglas Crockford is the author of How JavaScript Works. He has been called a JavaScript Guru, but he is more of a Mahatma. He was born in Frostbite Falls, Minnesota, but left when he was only six months old because it was just too damn cold. He has worked in broadcasting, learning systems, small business systems, office automation, games, interactive music, multimedia, location-based entertainment, social systems, and programming languages. He is the inventor of Tilton, the ugliest programming language that was not specifically designed to be an ugly programming language. He is best known for having discovered that there are good parts in JavaScript. That was the first important discovery of the Twenty First Century. He also discovered the JSON Data Interchange Format, the world’s most loved data format. I wrote and published How JavaScript Works, A Million And One Random Digits, and A Million Nines. I am currently writing Lower Mathematics. I wrote a best selling book, JavaScript: The Good Parts, published by O'Reilly in May, 2008. My series of instructional videos is elevating the art of web development. I am developing platforms for secure programming. I put together an alliance of companies to restore discipline to the process that manages the ECMAScript Programming Language Standard. I have founded an effort to transform JavaScript into a secure language, which is part of my plan to transform the web into a safe platform for mashups, advertising, and commerce. Faceless was the working title for what might have been my next company. I had been exploring opportunities in software development tools, social networking systems, language systems, games, and medical sensors. I developed and established an industry standard data interchange format: JSON. JSON has become the preferred way of representing information in network applications. I am an international standards body. I have been developing a secure programming language. It is similar in expressive power to JavaScript, but with a more robust syntax and much faster virtual machine. It provides security by capability containment."
