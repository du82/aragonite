["https://www.crockford.com/impeachment.html"]
title = "Impeachment"
full_description = "I changed my mind about Bill Clinton. I think that the Senate should have convicted and removed him from office. He committed perjury while President. He was unworthy of the office. By remaining in office, Clinton established a low standard of honesty and compentence that has plagued us ever since. Far worse crimes have followed his bad example, but Congress has lost its will to act. The Clinton legacy leaves us in a state where open defiance of the Congress's right and responsibility to check the Executive is no longer impeachable. President Clinton lied about sex. It seems incredible today, but there was a time in Our Nation's History when if a President was caught lying on any matter, including the personal and irrelevant, then that was grounds for impeachment. Long established rules on broadcast obscenity were relaxed in the 90's so that the news and opinion shows could focus at great length and detail on such important issues of the day as semen and oral copulation. President Clinton was impeached but the Senate did not convict. His term ended and we had a regime change. And television is still reporting on subjects such as semen and oral copulation, not so much in the news shows now as in the entertainment shows. The Religious Right is alarmed at this unintended consequence of its pursuit of Clinton, and has been putting pressure on the Broadcast Industry to turn the clock back about 50 years. They have succeeded in driving Howard Stern into space, but they are not content. They now want Federal obscenity rules on Basic Cable. The Broadcasters want this too because they are losing to Cable and they want Cable to suffer under the same rules that they do. Cable offers channel blocking, which allows any subscriber to completely restrict the channels that are received. This is not enough for the Religious Right because channel blocking only restricts what is on your TV. It has no effect on what other people get to watch. President Clinton was impeached because he perjured himself during a witch hunt when he tried to keep Mrs. Clinton from finding out that he had received a blowjob in the White House from a woman who was not his wife. Such goings on are unheard of in Our Nation's Capital. The Republicans in the House of Representatives had no tolerance for a President who lies, and successfully prosecuted his impeachment. Cooler heads in the Senate looked at the context, and decided that a blowjob wasn't a federal case. Clinton remained in office to finish his term, but the witch hunt and and its prolonged aftermath were a huge distraction which set us up for the events of September, 2001."
