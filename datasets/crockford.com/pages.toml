["https://www.crockford.com/wota.html"]
title = "Wota Message Format"
full_description = "This note describes a message format called Wota that was developed for use in Misty's local messaging system. It is very similar to Nota, but works at word granularity rather than byte granularity. The arrangements Wota produces are less compact than Nota, but are faster to arrange and consume. In network transfers, compactness is highly prized. In local inter-process communication, copying arrangements from one memory space to another, compactness is less beneficial. On 64 bit systems, a Wota word is 64 bits with no straddling. Every Wota value starts with a preamble. The least significant byte (aka the red bits) contains a type. The interpretation of the most significant remaining 56 bits (aka the blue bits) depends on the type. A blob is a string of bits. The remaining field contains the number of bits. The number of words that follow: The first bit of the blob goes into the most significant bit of the first word. The final word is padded with 0 as necessary. The text is a string of UTF-32 characters packed 2 per word. The remaining field contains the number of characters. The number of words that follow: An array is an ordered sequence of values. The remaining field contains the number of elements. Following the preamble are the elements of the array. Each element begins with one of the preambles. As with JSON, nesting is encouraged. A record is a set of key:value pairs. The keys must be text. The values can be any Wota values. The remaining field contains the number of pairs. Numbers are represented as DEC64. To arrange an integer in Wota, simply shift the integer up 8 bits. The number is incorporated into the preamble. To arrange a floating point number, place the number in the word following the floating point preamble. The remaining field is not used. Currently there are only five symbols. All other symbols are reserved. The remaining field contains the symbol."
author = "Douglas Crockford"
year_published = 2025
clearnet = "https://www.crockford.com/wota.html"
