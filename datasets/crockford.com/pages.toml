["https://www.crockford.com/cards.html"]
title = "Playing Cards"
full_description = "Playing cards are the most versatile game equipment ever invented. Most game sets can only be used to play a single game or a small set of variations. Playing cards are much more flexible. The number of games that can be played with playing cards is vast, including families of games like Baccarat, Bridge, Casino, Cheat, Cribbage, Euchre, Pinochle, Poker, Rummy, Solitaire, Veintiuna, War, Whist, and Fifty-two Pickup. Cards can be used with accessories like score pads, peg boards, and chips, or they can be used by themselves. Cards have been banned many times in many places because they are so much fun. The Bible says nothing about playing cards because they were invented long after the Bible was written. Cards effectively keep game state, distinguishing public state, private state, and secrets. They can be ordered, or they can be shuffled, adding a source of randomness. When their faces are turned up, they are a display system. They are individually moveable, allowing for state to be exchanged or transferred in various ways. They are pleasing to hold and manipulate. Decorative cards can be works of art. Closeup magic is performance art that usually incorporates cards. Decks of cards are usually included in survival equipment. Cards are used by fortune tellers to entertain and deceive. Cards influence speech: house of cards, close to the vest, lay your cards on the table, follow suit, penny ante, know when to run, ace in the hole. Playing cards have thirteen ranks and four suits. The suits seem random. If you look closely at the suits, they make little sense. How did this peculiar set of four symbols become the suits of humanity's most popular gaming system? This is the tale. Playing cards were invented one thousand years ago in China, based on the Song development of paper money, which was itself based on the earlier developments of block printing and coinage. Coins were made with holes in the center. A string could be passed through the hole to neatly tie coins together.0"
author = "Douglas Crockford"
year_published = 2025
