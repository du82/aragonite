["https://www.crockford.com/20js.html"]
title = "It Was Twenty Years Ago Today"
full_description = '''In the early 1990's I co-founded a company called Electric Communities. We were going to develop a system for interactive socialization and commerce. Unlike the current Wobbly Wobbly Wobbly, our goal was to produce a global social network that was secure and decentralized. Since the current state of the web is insecure and highly centralized, you might rightly guess that our company was not successful. The worst technical decision I will ever make was to build it in Java. Java was a brand new language at the time. The hype around it was hysterical. Wild claims were made about its security, which we didn't trust, but Sun claimed it was going to be an open language which would give us the opportunity to fix it. When Sun reneged on the openness thing, we were trapped. I invested tens of millions into making Java into a language suitable for secure, distributed programming. Martin ("Scala") Odersky developed our compiler. Our first demonstration was a massively multiplayer 3D virtual world. It looked great, and it was fun to play. And it took 3 minutes to load the class files. So we pivoted. We acquired two other failing social networking companies, OnLive and The Palace. In 2000 we received a contract from a major media company to develop an online gaming system. We thought that we could modify The Palace to meet their specifications. We had reengineered The Palace server into something workable, but we were lacking a client. There had been two prior attempts to make a client in Java, and both were disappointments. I didn't want to do that again. I got this crazy idea that maybe we could do it in the web browser using JavaScript. When I first saw JavaScript in 1995, I thought it was the stupidest thing I had ever seen. The language had improved a little with ES3. I wrote a demonstration in which you could drag and drop cartoon figures on a web page. Most of the people who saw it were amazed. It was widely assumed that JavaScript could not do that. Our customer liked that it did not require an installation process, which was important because children were expected to use their site, and there are laws about what online systems can ask minors to do.'''
author = "Douglas Crockford"
year_published = 2025
clearnet = "https://www.crockford.com/20js.html"
