["https://www.crockford.com/ascii.html"]
title = "ASCII"
full_description = "The American Standard Code for Information Interchange was developed in the 1960s for use in teletype machines and similar devices. It also anticipated use by computers, although computer networking at the time was still largely theoretical. It was not intended to be used as an internal computer character set, but it became the standard character set, partly due to the influence of UNIX. It still exists today as the first 128 code points of Unicode. The first 32 characters and the last character are control codes. Each control code has a very specific function. Some of these codes are still reflected in modern keyboards (del bs tab esc) but now have very different meanings. The original purpose of the ctrl key was to generate these control characters by subtracting 64 from certain codes. ctrlA generated soh. ctrlZ generated sub. Six of the control characters could be generated by using ctrlshift together."
