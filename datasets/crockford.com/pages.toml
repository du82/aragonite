["https://www.crockford.com/blisscii.html"]
title = "BLISSCI"
full_description = "Blissymbolics began as a Chinese-like graphical language that could be written with specialized typewriters. Communicating computers were still far in the future. But today, they are common, so I reformulated Charles Bliss's line letters for computerization. Most of the line letters are non-spacing, and are combined with spacing characters that can display the blissgrid. The five lines were inspired by the lines of the musical staff. The sky line and earth line bound the space in which blissymbols are formed. The earth line is the text base line. The sky line is placed around the same height as upper case letters. The vertical distance between the earth line and sky line is one bliss unit. The space is divided in half by the middle line, and into quarters by the middle sky line and the middle earth line. The lines form the vertical boundaries of three half unit high zones, the sky zone, middle zone, and earth zone. There is also an ultra zone which is used to hold the grammatical indicators. The ultra zone and infra zone also are the homes of two SEMI elements. The elements (or line letters) are positioned with a line or a zone. Blissymbols are created by combining elements on the grid as described below. A blissymbol is made up of many elements and base characters, much as words are made up of letters. Unlike conventional characters, the elements are non-spacing. This is to allow the combining of elements to form complex blissymbols. Spacing is provided by the base characters. This scheme allows for huge flexibility in permitting the design and use of new blissymbols with a very small character set. The six characters in this class are spacing like conventional characters. They are used as prefixes to identify the parts-of-speech of symbols. Bliss originally called for these indications to be centered above symbols, like accent marks. This is difficult to do with naïve software, so the prefix form is now used for greater utility. These examples show the construction of blissymbols. First a space (base) character is placed. Then one or more elements are placed. These can then be followed by additional base characters and elements. The final base element must include an addition quarter unit of space which is used for an eighth unit bumper on both sides of the symbol."
