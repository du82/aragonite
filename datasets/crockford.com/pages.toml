["https://www.crockford.com/anguish.html"]
title = "Anguish Languish"
full_description = '''Here further verse thyme in book firm is the extraordinary version of LITTLE RED RIDING HOOD that Arthur Godfrey read aloud on his program — and made famous. And with it are more FURRY TELLS, NOISER RAMS, FEY MOUSE TELLS, and THONGS, especially transcended by Prof. H. L. Chace, the originator of ANGUISH LANGUISH, for you, your friends, and your family to half pun wit. Copyright 1956 by Prentice-Hall, Inc. Englewood Cliffs, N. J. All rights reserved, including the right to reproduce this book, or any portions thereof, in any form except for the in- clusion of brief quotations in a review. English words are astonishingly versatile and could readily be made to serve a new and extraordinary purpose, but nobody seems to care about this except SPAL (Society for the Promotion of the Anguish Languish).* In keeping with its lofty ideals and its slogan, ANGUISH FOR EVERYBODY, the Society is sponsoring this little text, which has three aims: A visiting professor of Anguish, Dr. ________,* who, while learning to understand spoken English, was continually bewildered and embarrassed by the similarity of such expressions as boys and girls and poisoned gulls, used to exclaim: "Gracious! What a lot of words sound like each other! If it wasn't [sic] for the different situations in which we hear 'em, we'd have a terrible time saying which was which." Of course, these may not have been the professor's exact words, because he often did his exclaiming in Anguish rather than in English. In that case he would say: "Crashes! Water larders warts sunned lack itch udder! Effervescent further delerent saturations an witch way harem, wade heifer haliver tam sang witch worse witch." Dr. ________ was right, both in English and Anguish. Although other factors than the pronunciation of words affect our ability to understand them, the situation in which the words are uttered is of prime importance. You can easily prove this, right in the privacy of your own kitchen, by asking a friend to help you wash up a dozen cops and sorcerers. Ten to one, she'll think you said a dozen cups and saucers, and be genuinely surprised if you put her to work cleaning up even one police officer, let alone all the others, and the magicians, too.'''
