["https://www.crockford.com/got.html"]
title = "ウェステロス: 不気味大陸現象"
full_description = "The superfans are really upset about the final seasons of HBO's Game of Thrones. They have been spewing contempt for the producers of the show all over the internet. They have been victimized, the show has caused them injury, and they are fighting back by lashing out. Some want reparations. Some want a redo. Some just want to vent. The series did not surprise them in the way they expected to be surprised. Characters stopped developing in their arcs, and then did things that they previously would not have done. They complained that there was gratuitous fan service, but they were not served. They are really angry, and while they have meticulous critiques, charges, and particulars, they do not really understand why they are angry, why they think they were betrayed. There were early complaints that the show was too violent and too sexual. There were complaints that the books were better, but that isn't a proper complaint. The book is always better. In looking at an adaptation, we should instead be asking if it stands on its own. The show is an epic fantasy based on books by George R. R. Martin, who improves on the Tolkien tradition by adding women and an abundance of moral grayness. The showrunners simplified Martin's story, as they had to, but they did not dumb it down. They did not employ titles or narrations to tell us where we are, or who is there, or what they are thinking, or how much time has passed. The show had a very large cast, many of whom were divided into several great houses, all with strange names and rich backstories. The show expected the audience to pay attention and keep up. And remarkably, it did. The show wasn't just popular, it was culturally important. In robotics and computer graphics, there is a thing called The Uncanny Valley. In the development of synthetic human forms, as our skills and tools allowed our forms to become increasingly realistic, there is a point short of perfection where the result becomes alarmingly creepy. All we can see is that the thing is not properly human. We can not see that it is remarkably close, an improvement over earlier, more primitive forms that looked less real."
author = "Douglas Crockford"
year_published = 2025
clearnet = "https://www.crockford.com/got.html"
