["https://www.crockford.com/blissbib.html"]
title = "Bliss Bibliography"
full_description = '''Bliss, Charles Kasiel and Shirley McNaughton. The Book to the Film 'Mr. Symbol Man'. Semantography Press: Sidney, 1975. Charles's work was discovered by Shirley McNaughton, a teacher in Toronto who was searching for a symbol system that could be used to give the tools of language to severely handicapped children. It turned out that Charles's language actually worked. Children could learn Blissymbolics more easily than learning to read and write their own native languages. A documentary film was made about Charles and the work in Toronto, called Mr. Symbol Man. Charles produced this paperback, hoping to use the documentary to generate broader interest in Blissymbolics. Charles was a chemist in Vienna. He was captured by the Nazis and sent to the concentration camp at Buchenwald. He managed to get released and escaped to England. His wife was a German citizen, so could not join him there. The only place on earth that would accept both of them without documentation was Shanghai. In Shanghai, Charles was a filmmaker. Some of his footage can be seen in the documentary Port of Last Resort. Then the Japanese took over Shanghai, and Charles and Claire were moved to the Hongkew ghetto. Charles attempted to learn Chinese. He loved the pictographic and ideographic aspects of it, but was frustrated by its complexity. He got the idea to make a 20th century ideographic language that could be produced with a modified typewriter. It would be easy to learn, and could become an international second language. He called it World Writing. After the war, they moved to Sydney. They loved Australia. In his spare time, Charles haunted the libraries, reading on language and semantics, and wrote the first draft of his book. Unable to find a publisher, he self-published the first draft in three volumes. Bliss, Charles Kasiel. The Invention and Discovery that will Change Our Lives. Semantography Press: Sidney, 1970. Blissymbolics signs depicting objects of the perceptual world are clearly what Mieczyslaw Wallis (1975) would have called "schemata" (outline) rather than "pleromata" (full) — that is, they depict relatively few perceptual properties of the objects in question. Martin Krampen (1988) observes rightly that there is a continuous scale from highly schematic to highly pleromatic pictures and that this scale is independent of the one going from high degrees of iconicity to total conventionality, as are the corresponding processes of historical change. It should be noted, however, that decreasing pictoriality does not necessarily mean decreasing iconicity.'''
