["https://www.crockford.com/pronouns.html"]
title = "Pronouns"
full_description = "The first person pronouns are used by a speaker to refer to the speaker and possibly others as well. They suffer from a lot of problems. The word I is capitalized even when it is not at the beginning of a sentence. The I is capitalized as if it is a proper noun. It is the only pronoun that does this. This was due to the slightness of the miniscule i, which could easily be confused with a stray mark. We eventually added a dot to the i to strengthen its recognizability as a letter. With that improvement, capitalization of I became unnecessary, but we continue to do it anyway. I is a singular pronoun, but it takes a plural verb. I, being a singular pronoun, should take a singular verb. I does not go with is or be. Instead, I goes with am. That is the only thing that am can do. We do not need am. In nominative (or subject) position, we use I and we. In accusative (or object) position, we use me and us. One of my favorite things about English is that it does not bother with nominative/accusative case distinction, except for the pronouns. This exception is unnecessary complexity. The first person pronouns have extra possessive forms. In the singular, my is used as an adjective, and mine is used as a noun. In the plural, our is used as a adjective, and ours is used as a noun. Ordinarily, the possessive form can be used in either position. Delete I and us, using me and we instead. Delete am, using be instead.. There are some dialects that already do this. I think they got it right. And while we are at it, delete is and are, using be instead, and delete was and were, using been instead. With is gone, the confusion between contractions and possessives disappears. The complexity of verb noun agreement leads to errors. We do not need singular verbs. They add a lot of hissy sibilance and unnecessarily double the number of verbs in the language. So, delete likes, using like instead. The same goes for all of the singular verbs. The second person pronouns do not have any of the case, capitalization, or verb agreement problems of the first person pronouns, but they have another problem."
author = "Douglas Crockford"
year_published = 2025
clearnet = "https://www.crockford.com/pronouns.html"
