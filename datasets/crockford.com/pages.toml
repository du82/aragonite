["https://www.crockford.com/cycles.html"]
title = "Cycles"
full_description = "Most people measure angles in degrees (0 ... 360). Most mathematicians measure angles in radians (0 ... 2π). But as a programmer, I think it is best to measure in cycles (0 ... 1). It is trivial to correct over-rotation (discard the integer part). It is trivial to find the quadrant (the two most significant bits). Table lookup implementations of sine are trivial as well. When converting between radians and degrees, there is an implicit step where values are first converted to cycles. Programming languages should make cycles the standard angular unit. It is the most convenient for programming. It is less baffling to normal people than radians. If you know how to give a dial a quarter turn, you understand cycles. Computers can express cycles exactly. Computers have trouble with π. Mathematicians may still have reasons to prefer radians, but they are smart enough to know how to do the conversion if they have to."
author = "Douglas Crockford"
