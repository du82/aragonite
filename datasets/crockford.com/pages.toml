["https://www.crockford.com/ca_cards.html"]
title = "California Playing Cards"
full_description = "The French playing card design was adopted by the English. It eventually found its way to America where corner indexes were added, making it easier to hold and manage a handful of cards. America also reintroduced tarot's fool as the joker, and developed plastics to make the cards more durable. As a design exercize, I want to take this centuries-old success, and refresh it for the 21st. There are problems that I want to address: I agree with the Second Continental Congress that people of noble birth are no better than anyone else. The French design, however, ranks the royalty above the other pips and peeps. We fought a war of revolution to become free of those assholes, but somehow they are still on our cards. Compounding the insult, ranking is determined by gender. As a programmer, I know that the numbering of things begins at zero. The French design does not start at zero. It doesn't even start at one! In the Chinese design, the numbers were quantities. But since the corner index innovation, these numbers are now understood to be ordinals. Programmers know that the ordinals start with zero. Someday, the rest of humanity will also know. We can use playing cards to teach the next generations to count correctly. The ten rank was added using the Hindu Arabic numerals, which is great except that the corner index for ten rank cards contains two digits, whilst all of the other cards have only one digit or letter. That is just sloppy. The original Chinese suits were denominations of money. The French suits are the result of centuries of mistakes and misunderstandings which accidentally led to an improvement. By making the suits more abstract, more game applications are afforded. Any four random symbols would work, but the French set has problems, at least as practiced by the English. The ranks include the digits 0 thru 9, and the letters A thru C. Instead of court cards or face cards, we have letter cards. Programmers call this base 13. This then is the basic design of California Playing Cards. Card makers have liberty to improve on the presentation of the basic sequence."
author = "Douglas Crockford"
year_published = 2025
clearnet = "https://www.crockford.com/ca_cards.html"
