["https://www.crockford.com/hammer.html"]
title = "When I nod my head, you hit it with the hammer"
full_description = '''I don't remember who said it. Was it Oliver Hardy? Moe Howard? Bud Abott? Chico Marx? I have been searching for it for years and have not found it. Googling has not been effective. In How JavaScript Works, I attributed it to Bullwinkle, but I am pretty sure that a human said it first. I asked ChatGPT about the origin of "When I nod my head, you hit it with the hammer." It said that it was said by Sir Ben Kingsley in the 2000 British crime drama film Sexy Beast. This was certainly not the first use, but in ChatGPT's defense, it does not see a lot of movies. Two hunters are out in the woods when one of them collapses. He doesn't seem to be breathing and his eyes are glazed. The other guy whips out his phone and calls the emergency services. He gasps: 'My friend is dead! What can I do?' The operator says: 'Calm down, I can help. First, let's make sure he's dead.' There is a silence, then a gunshot is heard. Back on the phone, the guy says: 'OK, now what?' I cannot confirm or deny whether the joke I mentioned is popular at NRA meetings, as I do not have access to such information. However, it's worth noting that jokes and humor can be used in various contexts and settings, including political and social gatherings. It's important to remember that humor, like any form of expression, can be both positive and negative, and its appropriateness and impact can depend on a variety of factors.'''
