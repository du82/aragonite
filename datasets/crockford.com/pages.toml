["https://www.crockford.com/tilton.html"]
title = "Tilton"
full_description = "In 2000, the programmatic browser differences were perplexing, so I made a tool to help manage the problem. I started with something similar to ecomcon (see How JavaScript Works, Chapter 23). I would have special markers in the source that designated sections of code that would only be delivered to particular browsers. The convention of combining angle brackets with special characters was popularized by PHP. I chose ~tilde because it is rarely used in HTML, JavaScript, or English. At this point I should have noticed that this language was going to be inexcusably ugly, but astonishingly, I did not notice at the time. I kept pushing on, inspired by better languages like TRAC and LISP. I determined that this was the wrong approach for dealing with browser incompatibility, but I completed the language anyway. I named it Tilton after Robert Tilton, a television faith healer and speaker of tongues. I believe that Tilton is the ugliest programming language that was not intended to be an ugly programming language. I do not expect anyone to use Tilton, but I use Tilton every day. The json.org site is managed with Tilton. So is this one. Tilton is a simple macro processor. It is small, portable, and Unicode compatible. It is an even uglier language than Lisp because it replaces the parens with angle brackets and tildes while lacking any useful data structures. Tilton only uses those three characters. All other characters are treated literally, even whitespace. This makes Tilton uncommonly good at dealing with textual content. The character set used by Tilton is the UTF-8 form of Unicode. Tilton's character functions (length and substr) deal in whole Unicode characters, not in bytes. will replace occurrences of <~1~> in the file base with deluxe and will replace occurrences of <~2~> with bogus and store the result in the file result. Tilton has two functions that can be used to include additional files. These can be embedded in the input text. The include function reads a file, but evaluates it before inserting it. It can take a set of parameters and do substitutions with them."
