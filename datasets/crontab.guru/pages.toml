["https://crontab.guru/cron-bug.html"]
title = "crontab.guru - Cron bug"
full_description = '''I'm one of the guys behind WDT.io, a monitoring service for cronjobs. While testing some scheduling edge cases, I discovered an old bug in cron. TL;DR: As long as your crontab schedules' day-of-month and day-of-week fields' values are just simple asterisks (*) or don't contain a * at all, you'll be fine. Otherwise, definitely keep on reading. If you are an experienced system administrator, you've likely set up your fair share of scheduled jobs using cron and are familiar with the scheduling syntax. And you are well aware of how these five fields are interpreted by cron to determine when your job is supposed to run. That is, minute and hour and month all need to match the current time plus either day-of-month or day-of-week need to match as well. For example 0 12 1 * 1-5 runs at noon on the 1st day of every month and also on every work-weekday. It is basically the union of 0 12 1 * * and 0 12 * * 1-5. The day of a command's execution can be specified in the following two fields - 'day of month', and 'day of week'. If both fields are restricted (i.e., do not contain the "*" character), the command will be run when either field matches the current time. For example, 30 4 1,15 * 5 would cause a command to be run at 4:30 am on the 1st and 15th of each month, plus every Friday. To better understand the bug, we first have to dig a little into the implementation. The way cron decides whether the time right now matches a crontab schedule can be described with the set notation. If neither day-of-month nor day-of-week are *, cron takes the union (∪) of their values days-of-month ∪ days-of-week. Otherwise cron takes the intersection (∩) of their values days-of-month ∩ days-of-week. For example, if day-of-month is 10 and day-of-week is *, i.e. one of them is an asterisk, we take the 10th of the month intersected with all days-of-week which results in "the 10th of the month regardless of the day-of-week". So the schedule fires on exactly one day every month. If day-of-month is 10 and day-of-week is TUE, i.e. none of them are an asterisk, we take the 10th of the month in a union with all Tuesdays which results in "the 10th of the month plus on all Tuesdays". So this schedule fires on four, five, or even six days of the month, depending on how many Tuesdays the month has and whether the 10th falls on a Tuesday.'''
year_published = 2025
clearnet = "https://crontab.guru/cron-bug.html"
