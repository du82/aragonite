["https://www.croteam.com/announcing-the-talos-principle-2-2-2-3"]
title = "The Talos Principle 2 is out now! - Croteam - Croteam"
description = "The wait is finally over. The Talos Principle 2 is OUT NOW, and we can’t stress enough how excited we are to see you experience this new chapter in The Talos Principle series. The original game launched in 2014 and completely shifted the perspective everyone had on Croteam. At that point, we stopped being developers who knew how to do shooters and not much else and proved to everyone that we could do much more. The Talos Principle is, to this day, our most critically acclaimed title, and we are confident that the sequel will do it justice. We hope you enjoy playing it just as much as we enjoyed making it Enjoy The Talos Principle 2 now!"
full_description = "The Talos Principle 2 is out now! Thursday, November 2, 2023 The wait is finally over. The Talos Principle 2 is OUT NOW, and we can’t stress enough how excited we are to see you experience this new chapter in The Talos Principle series. The original game launched in 2014 and completely shifted the perspective everyone had on Croteam. At that point, we stopped being developers who knew how to do shooters and not much else and proved to everyone that we could do much more. The Talos Principle is, to this day, our most critically acclaimed title, and we are confident that the sequel will do it justice. We hope you enjoy playing it just as much as we enjoyed making it Enjoy The Talos Principle 2 now!"
