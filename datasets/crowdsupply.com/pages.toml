full_description = "Conexio Stratus Pro is a tiny-yet-powerful development kit for creating cellular-connected electronic projects and products. Powered by the cutting-edge nRF9161 cellular modem from Nordic Semiconductor, Stratus Pro offers unparalleled versatility, reliability, and ease of use, making it the go-to solution for IoT developers worldwide. It is a battery-operated platform, making it ideal for prototyping cellular IoT systems, such as asset tracking, environmental monitoring, smart metering, and even industrial automation. With LTE-M, NB-IoT, and GPS connectivity packed into a compact form factor, Stratus Pro ensures your devices stay connected in any environment. It enables real-time data transmission and location tracking with minimal power consumption. Future-proof your IoT projects with DECT NR+ readiness, ensuring compatibility with emerging cellular standards for enhanced performance and longevity. Stratus Pro also supports platforms like Edge Impulse, Memfault, and Golioth, leveraging machine learning (ML) to provide seamless Over-the-Air (OTA) updates to your devices. ML capabilities are extremely helpful in implementing predictive maintenance in scenarios where uninterrupted operation is particularly important, such as in smart factories. For easy data visualization and dashboard creation, Stratus Pro also connects to Datacake, a low-code IoT platform that requires no programming. Thanks to the nPM1300 PMIC and fuel gauge, you can remotely monitor your Stratus Pro’s battery vitals and charging status. Stratus Pro also has built-in charging circuitry that makes it easier to connect to and recharge the Li-Po battery, creating fully energy-autonomous applications. In numerous battery-operated IoT applications, devices primarily spend most of its time in low-power mode. Hence, minimizing overall power consumption of Stratus Pro during this mode was a paramount design objective. We are thrilled with the outcome and have confirmed that Stratus Pro 