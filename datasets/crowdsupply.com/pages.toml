["https://crowdsupply.com/about"]
title = "About Us | Crowd Supply"
full_description = "A Crowd Supply project should add something new and exciting to the world. Improvements on existing projects are fine, knock-offs are not. A Crowd Supply project should address a real need. Just because it’s possible, doesn’t mean it should be done - no one needs more landfill. A Crowd Supply project should honor user rights: curiosity, independence, association, longevity, transfer, discourse, privacy, and security. Success at Crowd Supply means delivering products to backers. In practice, this means taking a hands-on approach to helping creators, like shipping packages out of our own warehouse. The results speak for themselves: Delivery is paramount, but we also care a lot about what gets delivered, which is why we have a Proclamation of User Rights to guide us. At Crowd Supply, we vet products not only for originality, usefulness, and feasibility, but also for their commitment to user rights. Below are the rights our users can expect and our creators agree to uphold. We’ve also provided an example of a way (but not every way) each right can be enacted in the covenant between user and creator. Undoubtedly, edge cases, ambiguity, and uncertainty will arise and so any legal contract would quickly crumble. Instead, we rely on a good faith effort from creators to hold these users’ rights in the highest regard rather than sacrifice them in the name of profit, efficiency, or carelessness. Similarly, we rely on users to assert their rights both by supporting projects they care about and by speaking up when their rights are threatened. In all cases, we will lend as much guidance as we can. User: The user has the right to explore, hack, investigate, reverse-engineer, and circumvent the product. Creator: The creator agrees not to take any legal action that would prevent users from circumventing and exploring the product. Example: The creator will not sue the user under section 1201 of the US Digital Millennium Copyright Act, or similar anti-circumvention laws. User: The user has the right to use the product unencumbered by a subscription or any other connection to the creator."
year_published = 2025
clearnet = "https://crowdsupply.com/about"
