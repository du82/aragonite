full_description = "Welcome to Altera Innovation Lab at Crowd Supply, the place to find out about the latest and greatest Crowd Supply projects built on FPGAs from Altera. Subscribe for email updates to keep apprised of giveaways, workshops, livestreams, and in-person events by Altera, Crowd Supply, and other partners. Altera’s vision is to help shape the future by enabling innovation that unlocks extraordinary possibilities for everyone on the planet. The flexibility and adaptability of FPGAs make them ideal for delivering new digital innovations quickly. With a full set of design automation tools, Altera FPGAs allow engineers to rapidly prototype and iterate a new concept into a market ready product. In-field re-programmability also allows developers to add and optimize features even after the hardware and software has shipped. This can be a great competitive advantage in the fast-moving electronics industry, where time-to-market is key to success. Learn more about Altera FPGAs. To be eligible, your project must uniquely showcase Altera FPGA technology and pass the usual vetting process applied to all Crowd Supply projects. Eligibility is determined on a case-by-case basis and solely at the discretion of Altera and Crowd Supply. To get started, submit your Crowd Supply project proposal and mention your interest in participating in Altera Innovation Lab. In this Teardown Session, Crowd Supply's Helen Leigh talks with Greg Steiert from Altera. Greg has figured out how to build a $5 drag-n-drop FPGA loader using a Raspberry Pi Pico and open-source software, and now he's working on an upgraded version. Join us in Portland, Oregon, USA June 21-23 for Teardown 2024! Two lucky subscribers to the Innovation Lab email updates list will win a free Teardown event pass! Subscribe by Friday, May 31, 2024 for your chance to be one of the two randomly selected winners to receive one (1) pass each to Teardown 2024. Limit one subscription per individual. Learn how to turn the $4 R