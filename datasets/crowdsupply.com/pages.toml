title = "Contact Us | Crowd Supply"
full_description = '''You can contact us via the forms linked to from this page. We will try to respond to requests within five business days. To find out if a project's manufacturing and delivery schedule has changed, check the "Updates" page for the project or contact the creator directly through the "Ask a Question" link near the bottom of the project page. International packages sometimes appear to "stall" for several weeks while in transit. You may be able to get better tracking information on local carriers from a third-party tracking service such as AfterShip or Track It. In some cases, tracking may indicate a package has been "delivered" when it is actually at a local customs or postal office. If a long time has passed without a tracking update, contact your local post office and/or customs agency before contacting us. However, be aware that you have a limited amount of time, usually 60 days, to file a claim if you think your package is lost. You may be able to change your shipping address by going to your Crowd Supply account page, choosing the open order you want to change, and then clicking the Update Shipping Address button. If that is not available, please fill out this form. We are unable to update billing addresses. If you must use a different billing address, please cancel and replace your order. See our Guide for more information. See our Returns & Cancellations policy for detailed information on canceling an order. To request a change or cancellation, please fill out this form. If you have a question about how a product works or anything regarding the actual use and function of a project, you can communicate with project creators directly by using the "Ask [creator] a question" button near the bottom of every project page. Many projects also have discussion forums where users can compare notes and troubleshoot. These are usually linked from the project page. You can view and print-to-pdf an invoice for your orders by going to your Crowd Supply account page and selecting the order. An account was automatically created for you when you placed your first order; it is linked to the email address you used for the order. Lastly, your order confirmation email can also serve as an invoice. If you need something beyond this, please fill out this form.'''
year_published = 2025
