["https://crowdsupply.com/amd/fpga-playground"]
title = "AMD FPGA Playground | Crowd Supply"
full_description = "Want to learn about FPGAs, but don’t know where to start? You’re in the right place! AMD, in partnership with Crowd Supply and other partners, is pleased to welcome you to the AMD FPGA Playground, where we’ll showcase Crowd Supply projects built on AMD FPGAs and hold giveaways, workshops, livestreams, and other events around the latest FPGA technologies and tools. To be eligible, your project must uniquely showcase AMD technology and pass the usual vetting process applied to all Crowd Supply projects. Eligibility is determined on a case-by-case basis and solely at the discretion of AMD and Crowd Supply. To get started, submit your Crowd Supply project proposal and mention your interest in participating in the AMD FPGA Playground. In these episodes of The Teardown Sessions, we take a deeper dive into some of the Crowd Supply projects using AMD FPGAs. In this episode of the Teardown Sessions, Crowd Supply's Helen Leigh celebrates the launch of the Thunderscope oscilloscope with creator Aleksa Bjelogrlic. In this episode, we speak with Aleksa Bjelogrlic, creator of ThunderScope, the open source software defined oscilloscope. On the next episode of the Teardown Sessions we will be talking with Colin O'Flynn, renowned embedded security expert and creator of ChipWhisperer-Husky. Join Host Helen Leigh for a tour through the world of FPGAs with her guide, Ryan Cousins from Snickerdoodle. Many Crowd Supply projects depend on the quality and functionality of AMD FPGA parts. Below are some examples sorted by product family. There is also a more complete listing. An open video development board in a PCI express form factor that supports overlaying content on encrypted video signals. Let's bring open video to the digital age! Hardware Happy Hour is an informal way to socialize, show off your projects, and talk about the world of hardware. Learn more Join us for an insightful workshop exploring the capabilities of ultra-small form factor software-defined radios (uSDRs) and the powerful Web Platform for SDR (WSDR.IO) that streamlines usability. Learn more"
