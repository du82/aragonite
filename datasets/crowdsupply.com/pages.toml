["https://crowdsupply.com/cariboulabs/cariboulite-rpi-hat"]
title = "CaribouLite RPi HAT | Crowd Supply"
description = "A fully open source dual-channel SDR Raspberry Pi HAT with a tuning range up to 6 GHz"
full_description = "CaribouLite is an affordable, open-source, dual-channel software-defined radio (SDR) platform—and an SDR-focused FPGA development framework—implemented as a Raspberry Pi (RPi) HAT. CaribouLite turns your Raspberry Pi single-board computer (SBC) into a self-contained, dual-channel radio Tx/Rx that spans a wide tunable frequency spectrum up to 6 GHz. CaribouLite gives you full control of its hardware, including the FPGA, its firmware, and all of its supporting software. With the deeply integrated IceStorm toolchain, writing your own FPGA application couldn’t be easier. You can reuse many Verilog modules, such as SPI and SMI modules, to support custom applications of CaribouLite hardware. We created two versions of CaribouLite: the full version and the ISM version. Both versions include an internal TCXO clock-source, a low-noise amplifier (NF < 4 dB under 3 GHz) and high Tx power (up to 14 dBm). They also provide fully controllable, 8-bit, read/write PMOD expansion ports to facilitate advanced applications such as direction finding, GPS synchronization, etc. On the software side, Raspberry Pi’s high-level APIs like Soapy / GNU Radio, and Jupyter notebooks are fully supported, through which the HAT’s complete feature-set can be accessed. The 4 MSPS I/Q samples (both Tx and Rx) are transmitted over the RPi’s secondary memory interface, where CaribouLite acts as a high-throughput memory peripheral. The ISM version of CaribouLite supports the native 2.4-GHz and sub-1-GHz bands available within the Microchip chipset used. In testing, CaribouLite exceeded the frequency capabilities described above. The lower bound of the wide channel measured closer to 1 MHz, for example. We are sticking with the official component specifications, however, in full confidence that the SDR community will drive the board to its limits and determine its actual capabilities. As mentioned above, we decided to offer a CaribouLite variant optimized for the unlicensed ISM bands. It contains a bare modem, without additional frequency-conversion capabilities. As a result, it can transmit over 2.4 GHz and Sub-1-GHz bands. This variant is not only significantly less expensive than the full version of CaribouLite, it closely implements the reference design of its Microchip modem so as to comply with various countries’ radio regulations (ETSI, FCC, etc.). While neither of the CaribouLite variants have undergone a regulation-compliance process, it might be easier for a third party to navigate such a process using the ISM version."
