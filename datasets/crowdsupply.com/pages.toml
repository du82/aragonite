["https://crowdsupply.com/chipperdoodles-chippydootles/anwaar"]
title = "Anwaar (أنوار) | Crowd Supply"
description = "Hardware Platform for Personal, Portable PCB Tokens"
full_description = 'Anwaar, which is Arabic for "a collection of lights," combines art and circuitry into a convenient, attractive, wearable medium of expression. Each of our products includes a microcontroller, power-management circuitry, breakouts, a hybrid supercapacitor, and a beautifully designed faceplate, which is where the magic happens. You can wear your Anwaar as a necklace or brooch, hang it as an ornament, carry it as a pocket token, build it into a product, or put it to use in a million other ways. The Anwaar collection will include several different families of boards that differ in size, shape, and microcontroller location. All families share certain design principles, however. They are all two-piece products that include a baseboard connected to a faceplate by a low-profile header and M.2 machine screws. faceplates are swappable and used to display circuit art while baseboards handle energy storage and power management. This campaign will focus on the Amulet family. Our Amulets are small disks, 36 mm in diameter and 7.2 mm thick. They are extremely satisfying to hold in your hand and small enough that you can hang them from or attach them to just about anything. We built Anwaar so that folks who are just getting started with PCB design can produce their own Anwaar-compatible faceplates. Depending on what components you choose to incorporate into your creation, you may need intermediate soldering skills, but we selected SMD headers with a 1.27 mm pitch because they’re reasonably easy to solder by hand. And all of the components we use to construct Anwaar are available "off the shelf" from semiconductor and component distributors. All of the Amulets in this campaign include our A-TINY-15F baseboard and a compatible faceplate. One of the faceplates we’re making available is our A-Proto board, which you can use to prototype your own design. Anwaar is OSHWA-certified open hardware, and our baseboards are licensed under CERN-OHL-S V2.0. We relied on free and open-source tools like KiCad, FreeCad, and Krita to build it, and our design files are available on Gitlab. We also provide KiCad templates to help you with your own faceplate designs. Just add them to your third-party templates folder, and create a new project to get started. Thanks to a wonderful third-party Arduino core, Anwaar boards are easy to program. (Here’s some sample code!) Last but not least, we’re working to improve our documentation and tutorials.'
