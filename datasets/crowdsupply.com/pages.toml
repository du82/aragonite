["https://crowdsupply.com/andy-haas/haasoscope-pro"]
title = "Haasoscope Pro | Crowd Supply"
description = "An Affordable, High-Bandwidth, Real-Time Sampling USB Oscilloscope"
full_description = "Haasoscope Pro is a full redesign of the original Haasoscope, a successful Crowd Supply campaign from 2018 that introduced the world’s first open-everything USB oscilloscope. The new Pro version increases the bandwidth from 60 MHz to an impressive 2 GHz, the resolution from 8 to 12 bits, and the sample rate from 125 MS/s to 3.2 GS/s. It’s the first open-everything, affordable, high-bandwidth, real-time sampling USB oscilloscope. Until now, scopes with bandwidths of 1 GHz or more have primarily targeted the professional market, where price is of little concern, often costing tens of thousands of dollars. Haasoscope Pro is designed to be low cost, while maintaining super-fast performance. Extensive R&D and testing has made possible a design that uses standard PCB material (impedance controlled, but no blind or buried vias), off-the-shelf components, and automated SMT / BGA assembly processes, ensuring affordability without compromising on quality. Haasoscope Pro works with standard x10 passive oscilloscope probes, but they are typically limited to under 500 MHz bandwidth. For higher bandwidth, one generally needs active probes, typically costing thousands of dollars. To unlock the full bandwidth of the Haasoscope Pro, this campaign also includes an affordable 2 GHz bandwidth active probe, making it accessible to hobbyists and professionals alike. The oscilloscope is an indispensable tool for designing, testing, repairing, and learning about electronics. With 2 GHz bandwidth, Haasoscope Pro allows hobbyists, designers, technicians, researchers, and students to explore the world of high-speed electronics and high-frequency signals like never before. Having a scope as capable as this on your bench is a dream come true for any electronics enthusiast. Electronic parts that produce fast signals are common and inexpensive today. Microprocessors, low-end FPGAs, and even digital logic chips often have outputs with rise times of 500 ps or less. Standard protocols like USB 2.0, DDR3 RAM, HDMI, Ethernet, etc., all use signals with rise times of about 250 ps. Until now, users of these devices could only dream of seeing these signals accurately without access to $20k of test equipment."
