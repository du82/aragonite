title = "ESP32 Rainbow | Crowd Supply"
description = "A ZX Spectrum single-board computer with a built-in keyboard and display"
full_description = "The ESP32 Rainbow is our modern recreation of the Sinclair ZX Spectrum, a classic personal computer first released in 1982. It emulates the look and feel of the original 48K machine, replicating its iconic keyboard. It has a built-in color LCD, a microSD card slot for storage, and USB Type-C port for power. This project brings a beloved retro computer back to life, blending nostalgia with cutting-edge technology to create a unique device for enthusiasts and new users alike. For those looking to relive their childhood gaming experiences, the ESP32 Rainbow emulates both the 48K and 128K ZX Spectrums. We’ve recreated the iconic keyboard in full color, and it looks amazing! Whether you’re reminiscing about classic games, remembering your first Basic program, or filling a display case with nostalgia, ESP32 Rainbow is both fully functional and nice to look at. ESP32 Rainbow is more than just a retro emulator—it’s an open-source hardware project designed for learning and innovation. With two built-in QWIIC connectors and an expansion port that provides access to the GPIO pins, the display, and the microSD card, it can easily interface with external peripherals and sensors. This flexibility, along with the powerful ESP32-S3 processor, allows for the creation of a wide range of applications, from simple experiments to more advanced projects. If you’re feeling adventurous, you can cobble together a ZX Spectrum emulator from various development boards either by building the entire thing on a breadboard or by using one of the RP2040-based HDMI or ESP32-based VGA boards. Some of these even have built-in PS/2 ports and or USB ports so you can connect a keyboard. You can also find bare boards that are compatible with the old ZX Spectrum membrane keyboards, which can be purchased from various retro suppliers. Below are some boards that are great for the hobbyist who wants to build their own system. This is not an exhaustive list, and most solutions will require an external PS/2 or USB keyboard as well."
