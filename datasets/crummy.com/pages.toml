["http://www.crummy.com/2024/07/10/0"]
title = "June Film Roundup"
full_description = '''Wed Jul 10 2024 10:50 June Film Roundup: A little late this month since everything sucks and Sumana and I have been watching a lot of TV shows instead of movies. But that just means you'll get a big Television Spotlight at the end of this post. I think you could have made a big movie musical enjoyed by kids in 1984, but the kids in question would have been theater kids, right? Not the punks. This movie and Pennies From Heaven (1981) are off the mark with their fixation on recreating a time in the past when musicals had mass appeal. You need modern sleaze and transgression, a la Rocky Horror Picture Show. I made a bet that at some point in the movie a street would be literally lit on fire. Reader, I won that bet. There's also a classic "make this character a woman but change nothing else about the screenplay" character here, a la Ellen Ripley, which creates a sadly compelling female character by 1984 movie standards. I haven't looked into this in detail, but I have to assume there was major turmoil behind the scenes at Discovery, since the showrunner kept changing early on and the show kept lurching in different creative directions, occasionally doing things like casually spinning off a much better Star Trek series. But Discovery never lost sight of its pole star: the belief that Michael Burnham is the most important person in history and has to save the universe all by herself once a year. Honorable mention to the way Star Trek's traditional countdown-to-everything-blowing-up timers would inexplicably pause for minutes at a time so that everyone could have their character beat, though they did tone that down in the final season. My biggest Discovery regret is that Michelle Yeoh and Jason Isaacs spent so much time playing contemptible Mirror Universe characters that we barely or never got to see their (presumably) heroic, Star Trek-y Prime Universe equivalents. Doing a show that doesn't focus on the captain was a bold experiment but it left a void at the core of the show that took a really long time for Michael and Saru to grow to fill... by becoming captains.'''
