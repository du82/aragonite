["http://www.crummy.com/2024/02/03/0"]
title = "January Film Roundup"
full_description = '''Even dull movies like this usually have a couple interesting bits, and I think Diller is the interesting bit here—I'd never seen her act before and she's got a lot of what I think of as "Kate McKinnon energy." Oh yeah, here's another thing: a while ago I mentioned that there's a span of decades where Hollywood movies don't seem to have car chases. Well, they definitely do by 1966. This is one of those comedies that ends with a wacky car chase that I find boring (see also: A Funny Thing Happened on the Way to the Forum). You do get to see Bob Hope hijack a cop car, which I thought I'd only be able to see in the alternate universe of The Man in the High Castle. Something must have happened in the early 60s to make car chases safer or cheaper to film. Maybe a technological advancement, maybe a streamlined permitting system, maybe the formation of the Stuntmen's Association in 1961. Maybe it was simply a lost technique rediscovered so they could film It's a Mad, Mad, Mad, Mad World (1963). I don't know. Someone's got to have a master's thesis on this, I'm just going by what I see in the movies. I imagine Hungary in 1965 was a tetchy place to make a WWII movie, and the balancing act here is quite noticeable: the Nazis are portrayed as monstrous buffoons and the regular Hungarian army isn't that much better, while the advancing Soviets (Hungary's nominal enemy) are mainly represented by one hapless draftee. I think this works in the movie's favor as a comedy, driving home the fact that nobody is going to help these desertees, they've got to help each other. This enthusiastic IMDB user review gives some historical context. Includes a great, messy scene where a bunch of watermelons are shot up, like The Untouchables meets Double Dare. Also includes a good, exciting car chase scene. Maybe they just shouldn't be in comedies? The Indian scientist in this film is credited as simply "Jayant." There is an Indian actor who acted under the name Jayant, but he died in 1975. This is Nikil Jayant, an actual scientist who ended up playing an evil scientist in a movie about evil scientists. He was at Bell Labs at the time, and I have to assume Marshall Brickman met him there while researching the film.'''
