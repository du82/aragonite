["https://www.crummy.com/2014/04/01"]
title = "News You Can Bruise for 2014 April 1"
full_description = '''(1) Tue Apr 01 2014 13:21 March Film Roundup: April Fools! As part of an elaborate prank spanning over a year I have slowly turned NYCB into mostly a film review blog! Hahahahaha... ah... Anyway, I'm trying out a new strategy for spending less time writing these film roundups. Instead of trying to analyze each movie in detail I'm going to write only as much about a movie as I feel like writing in the moment. Sometimes this will still be a lot, but most of the time I think a paragraph's worth of text will suffice. I was momentarily excited because the opening credits introduced everyone by given name ("Written by Francis and Sophie") and when the credits introduced "Giancarlo" I thought maybe Giancarlo Esposito was in this film. But no, it was just well-known Italian actor Giancarlo Giannini. Dammit! In general the moments I loved in this movie—and there were a lot of them—were in the interstices. It's always lampshading its ridiculous plot and escalating sight gags into absurdity. It's funny, and certainly in the keeping of the classic Muppet movies, but it betrays the sweaty hand of the punch-up gag screenwriter. I think the Muppets have a lot of the same problems The Simpsons has at this point. Misc notes: I loved the repurposing of Kermit's catchphrases into action-movie taglines. The songs are good, but nothing as catchy as "Life's A Happy Song" or "Man or Muppet". Sam the Eagle finally gets an entire movie subplot, and it's great. One misstep: the gulag? Maybe not the best idea? I don't think massive human rights violations are totally off-limits for humor, but maybe not in a PG Muppet movie? A while back we were talking Muppet with someone and I mentioned that I can't tell the difference between the Jim Henson Kermit voice and the Steve Whitmire Kermit voice. Well, now I can, and it's kind of sad. I don't like doing Silent Movie Racism Watch, but I feel like it's a service I must provide. There's one kinda-iffy joke in Seven Chances, but this movie also features the only non-racist race-based joke I've seen in a silent movie. The main problem here is sexism. The premise of the second half of the movie is pretty sexist, but you also have huge crowds of assertive women in the final chase sequence, sending policemen to flight, commandeering vehicles, a sight that surely had reactionaries of the time grumping "I told you this would happen if they got the vote!" So maybe it's a wash?'''
