["http://www.crummy.com/2024/01/31/0"]
title = "Schickele Mix Archive"
full_description = "(1) Wed Jan 31 2024 14:12 Schickele Mix Archive: To commemorate the recent passing of composer Peter Schickele (R.I.P.), I've created The Schickele Mix Online Fan Archive. This site presents all of the extant information online about Schickele's amazing music-education radio show Schickele Mix, which stopped airing in 2007 and has been in copyright clearance hell ever since—an inevitable but undeserved fate. I've scraped the now-defunct official Perl CGI that gave out Schickele Mix listings, and reformatted the listings with links to archived recordings of all the episodes that have been saved by fans. About 130 of about 180 episodes total have been archived, thanks entirely to two people, both of whom show up in this Reddit thread to take credit. Thanks, Frodo_Picard and gattgun, from a grateful world. All this metadata is now available as a big JSON file (so no one else has to download those old listings from the Wayback Machine and rewrite my scraping code), and I also created a podcast RSS feed that lets you experience Schickele Mix in its haphazard original broadcast order. (This is different from the benofsky.com Schickele Mix podcast mainly in that it includes the gattgun archive, not just the Frodo_Picard archive.) I've got one more big piece of this project planned, but this is enough to tell the world, I think. The web page makes it clear which episodes of Schickele Mix are still missing fan-archive recordings. If you think you might have one of the missing episodes on an old cassette tape or something, please email me at leonardr@segfault.org."
