["http://www.crummy.com/2024/06/05/0"]
title = "May Film Roundup"
full_description = '''If the megacorps really wanted to turn their bloodthirsty audience against Rollerball, they should have gotten Jonathan to take a knee during the corporate anthem. I do have more than jokes, let me check my notes. Oh yeah, I was spellbound by the bits of this movie that are just people setting up the arena for a fictional sport (e.g. the first few minutes). Unlike most fictional sports, Rollerball has consistent rules that make perfect sense. The Rollerball scenes are shot like a sporting event, not a feature film—it reminds me of footage of stock car races and the like. The only reason Rollerball isn't played in real life is that the creator refused to sell the rights to people who didn't get that it's a satire, you dolt, on the "sickness and insanity of contact sports and their allure." All of that's pretty unique, even if the film is a little slow. This is filmed on the Izu Peninsula, where Laid-Back Camp also takes place, eighty years later. Both have shots of cars driving on the same seaside cliffs. I've seen lots of old movies filmed in vanished versions of places I've lived, New York and San Francisco and Los Angeles, but I've never been conscious of so much difference in the way life has changed than when I compare Mr. Thank You and Laid-Back Camp. Jake Berendes sampled a couple of lines from this movie for his song "What Is The Mind", notably the absurd "I'll have a hamburger and a flashlight." I just about jumped out of my seat when that line happened, I tell you. Also it took me a while to figure out it was one of Jake's songs, because originally I thought I was thinking of "Where Is My Mind?" by The Pixies. I'm not a big Pixies fan, is what I'm saying. I grew up with those Ralphs generic brand products (you see an updated version of the design in the opening scene of The Big Lebowski), so I had trouble distinguishing between the items that signified frugality and the ones intended to be satirical. Also, what kind of liquor store stocks so many grocery products? Anyway, I don't think I'm going to join the cult, but it was a fun movie.'''
