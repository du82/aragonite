["http://www.crummy.com/2024/12/08/0"]
title = "November Film Roundup"
full_description = "Emblematic of the conceptual problems with this movie is a scene where it's explained that the AI-generated heroes have been programmed not to pursue their ideological clashes/historical rivalries with one another. This would basically require removing their opinions about what is best for Japan--that is, their ability to do politics. It's a technocratic fantasy that, even though it falls apart inside the movie, doesn't fall apart quickly or disastrously enough to satisfy my cranky ass. To put it in American terms, if you brought back Thomas Jefferson and FDR and Ronald Reagan to rule the country, what course of action would they agree on?"
