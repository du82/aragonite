["http://www.crummy.com/2024/06/10/0"]
title = "My PyCon US 2024 talk"
full_description = "Mon Jun 10 2024 15:38 My PyCon US 2024 talk: I've put up a transcript of the talk I gave at the PyCon US Maintainers Summit last month, about the lessons I learned while being the solo maintainer of Beautiful Soup, over 20 years and through two periods of professional burnout: The quick takeaway is that strong boundaries are important: both the software boundaries provided by published APIs and packaging dependencies, and the decision as to where your volunteer open source work ends and the rest of your life begins. I have some suggestions for the ways the two interact, and an anecdote about how we mentally rewrite our memories of our struggles to make ourselves more active participants. If you're the maintainer of an open source project, I recommend checking it out!"
