["https://www.crummy.com/2014/09/01/0"]
title = "August Film Roundup"
full_description = '''Mon Sep 01 2014 09:49 August Film Roundup: Another month full of major progress on major projects, but I managed to squeeze in four features: As usual, I would have done things differently. This time I did do things differently, and you will eventually be able to read the result as Situation Normal. But just as an example, consider "Four Kinds of Cargo", the acorn that became SN. If the POV character of that story were the Captain, it would be a by-the-numbers space opera, like Guardians of the Galaxy, because that's how the Captain experiences life. So instead the POV character is Kol, the guy who is just trying to survive, who is trying to make the Captain's space-opera fantasy work, simultaneously intrigued and frustrated by her ability to change everyone's minds with an inspirational speech. In GotG terms, the correct POV character is Rocket. You can have the doofy white guy who brings everyone together, but he shouldn't be the POV character. The American people understand this. I've seen people talking about this movie as if Rocket is the lead, because that's the right way to do it. But that's not the way it happened. The one place my ignorance of the comic book let me down was when the unaccountable police force/military/governing body led by Glenn Close with her big swoopy hairdo and Peter Serafinowicz with his creepy British accent turned out... not to be evil? Not guilty of anything worse than imposing the bourgeois values of its Federation-type civilization on a band of criminals? That was unexpected, and I'm not sure whether my cognitive dissonance was the intention or if they're just saving the evil for the sequel. PS: there's a lot of tasing in this movie. I guess that's how horrifying violence becomes comedy violence. I'm not going to accuse this movie of 'ruining my childhood', because it's just a dumb movie, but... it's a dumb movie. I am a fan of Chuck Jones's fluid gag-packed animation, but it's a bad fit with the cerebral subject matter of The Phantom Tollbooth, except in a couple cases like the integration of typography into everything in Dictionopolis, and the ever-shifting bodies of the Demons of Ignorance. The demands of the animated-feature-film medium require changes to the plot that frequently undercut the message of the book. An example will suffice: as Milo sinks into the Doldrums, the Lethargians stop being lethargic and become very enthusiastic indeed about sneaking up on Milo and violently killing him. Why? Because a book may vividly describe procrastination and laziness as perils in themselves, but when you're watching a cartoon all the evil things have to have pointy teeth and nasty Grinch faces.'''
