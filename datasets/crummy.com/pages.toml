["http://www.crummy.com/2024/07/27/0"]
title = "When does The Phantom Tollbooth take place?"
full_description = '''(1) Sat Jul 27 2024 13:10 When does The Phantom Tollbooth take place?: I just read The Annotated Phantom Tollbooth, with annotations by Leonard S. Marcus. The annotations were excellent regarding earlier drafts of the manuscript, and the correspondence between Norton Juster and Jules Feiffer. But some of the annotations brought in scholarly analysis of the book's concepts, and I thought a lot of those fell flat compared to the gold standard of annotated children's books, Martin Gardner's The Annotated Alice. However, a couple things I noticed as I reread the book with those annotations put me in the mood to answer a specific high-concept question: when does this story take place, exactly? I did come up with an exact answer: though published in 1961, The Phantom Tollbooth begins on Tuesday, April 11, 1967. But getting there requires several leaps of logic. I think these leaps make sense, but I also don't think the story was designed to support this kind of analysis. Certainly Norton Juster didn't plan this, since the answer relies on societal trends that played out after the book was published. But here we go: Several of the inferences I'm going to make depend on an assumed geographic or cultural background. The Lands Beyond is, well, beyond, but it's an extremely American sort of fantasy world. Everyone speaks English, all the puns are in English, all the spellings are American, and Dictionopolis only recognizes the 26 characters of the Latin alphabet. Two characters in chapter 16 refer to American currency ("ten dollars apiece", "dollars or cents"). Specifically, I argue that the Lands Beyond are a New York tri-state area fantasy world, mainly because of the titular tollbooth. I grew up in Los Angeles, land of freeways, and when I first read this book as a child, a "tollbooth" seemed as weird and magical as a talking dodecohedron. For this analysis I will assume that Milo lives in or near New York City, both for Doyleist reasons (that's where Norton Juster lived when he wrote the book) and Watsonian reasons (Milo lives in an apartment building with at least eight stories and knows what a turnpike tollbooth is). The background assumptions of the Lands Beyond are the midcentury East Coast American assumptions Milo will recognize; there's no Watsonian reason given for this but it seems indisputable. In the 1969 film, Milo lives in San Francisco, but that's only one of the problems with that movie.'''
year_published = 2025
clearnet = "http://www.crummy.com/2024/07/27/0"
