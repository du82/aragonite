title = "Don't tell me about seeing you!"
full_description = "Hi, I'm Leonard Richardson. I answer to Leonard or leonardr. I like dinosaurs, turtles, trilobites, and humans. This is my website. It's been around, in one form or another, since 1996. I was born in Los Angeles and raised in Arvin, California. Now I live in New York City. I write programs and prose, including a weblog. My wonderful wife, Sumana Harihareswara, has a proportionately wonderful weblog. My hobby is entertaining people. Thus, this web site. I have a lot of ideas, and I hope you find their fruits fun and useful. Who can tell what the future may bring? I may rise to conquer the world, or my plans may be dashed by a rag-tag band of misfits. In any event, it should be interesting. My email address is leonardr@segfault.org. I don't get a whole lot of encrypted email, but maybe you should send me some. Here's my GPG key. This document is part of Crummy, the webspace of Leonard Richardson (contact information). It was last modified on Thursday, September 28 2023, 12:56:36 Nowhere Standard Time and last built on Sunday, March 02 2025, 04:00:02 Nowhere Standard Time. Crummy is © 1996-2025 Leonard Richardson. Unless otherwise noted, all text licensed under a Creative Commons License."
