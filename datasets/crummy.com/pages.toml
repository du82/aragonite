["http://www.crummy.com/2024/08/11/0"]
title = "July Film Roundup"
full_description = '''Sun Aug 11 2024 15:56 July Film Roundup: Pressed for time this month so I'm just gonna write some quick reviews and head off to resume my apparently busy life. Reading IMDB trivia about the different drafts this screenplay went through was comforting to me, as I go through my own creative struggles. Adding the wacky peasant-pretending-to-be-a-samurai was a good decision. Now that I think of it, you could film an X-Files episode entirely running in the background of this movie. Many of the characters have a "wacky but sinister X-Files side character" feel. I guess that really was the vibe of the 90s. Since Slacker and X-Files now have me in the conspiracy mindset, time for me to share one of my patented cinematic conspiracy theories with you. I believe Richard Linklater has been secretly working on a film since 1990, with the cast and crew sworn to secrecy, to be released only after he dies. Anyway, fun movie, especially if you like the Goes Wrong Show type of chaos. Probably not as fun as the original play, but the great thing about movies is you can now watch them anytime, without spending thousands of dollars to stage a new production. Rather than harp on this, I want to present another crackpot cinematic theory, this time about an earlier draft of the Inside Out 2 screenplay. I believe that the new emotions introduced by Riley's puberty were originally intended as warped versions of the original five Inside Out emotions, rather than brand new characters. Disgust→Envy, Fear→Embarrassment, Sadness→Ennui, Anger→Anxiety. This plan fell apart when it became clear that the warped version of Joy could only be Horniness, and nobody wants that. I don't have a way to quantify this, but my gut says that older comedies like this have more stuff than modern ones. This movie has detailed technical subplots about running a mail-order business, the legal system, small town democracy, and railroad freight logistics; on top of the usual rom-com antics about mercenary journalists and sex segregation of lobsters. Also a song about the Cub Scouts, which has lyrics written by the director and which I must assume was included as some sort of residuals scam. I wouldn't say all of this comes together in a cohesive whole, but it definitely all happened to Jane.'''
