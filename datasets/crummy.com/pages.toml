["http://www.crummy.com/2024/09/04/0"]
title = "August Film Roundup"
full_description = '''Wed Sep 04 2024 23:15 August Film Roundup: Sumana was gone for much of the month, and you know what that means: lots of movies from the 60s and 70s with below-average IMDB ratings! I dunno, it's still OK. I feel like I don't encounter many movies like this, movies that are nominally mimetic but operate on a mythic or archetypal level. Most likely these movies are still around but I actively avoid them. Like, Evil Does Not Exist (2023) and The Killing of a Sacred Deer (2017) seem like they're going for a similar feel but I have no desire to see either one of those movies. Overall I didn't think this was great, but the ending was sweet. I guess what I'm saying is you take the good, you take the bad, you take them all, and... no, wait... sixty years ago we had Ball and Hope, and now... where was I going with this? The characters are unrecognizable as well (just as well that most of them are renamed from the book). The point of the book is that Dortmunder's genius at planning and staffing heists is exactly balanced out by his terrible luck. In this movie he's a super-criminal abetted by, and going up against, buffoons. They moved the setting from Long Island to LA just because it was easier to film. Not enjoyable. What was enjoyable was discovering, while writing this entry, that Donald Westlake wrote the screenplay for Cops and Robbers (1973)—a darkly comic heist with a great gimmick that's also a good movie. And man, this movie has Gene Roddenberry humanism sermonizing like nobody's business. "An insane creator? Good thing humans don't have an insane creator! How horrible that would be!" (Not a direct quote.) I would not watch this if it had been picked up as a series, but as a time capsule showing an early draft of one of my favorite things, I loved it. PS: Ol' Gene reuses the Vulcan nerve pinch in this one. It's a low-violence way to put your enemies out of action—perfect for network TV! If there was some way to skip act 2 altogether I'd be more sanguine about recommending this film. It kind of drags, but you can't just cut it, because it's setting up all the character development for act 3.'''
