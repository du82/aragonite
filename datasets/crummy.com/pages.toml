["http://www.crummy.com/2025/01/12/0"]
title = "2024 Japan trip"
full_description = "(1) Sun Jan 12 2025 13:56 2024 Japan trip: I've hinted at this before in NYCB but now I've got my photos organized and I'm ready to talk about the vacation I took in Japan last November. I was nominally on vacation with my friend James, but he was working most days, so I spent a lot of time walking around exploring before meeting him for dinner, which I found to be a great way to run a vacation. I've put up a huge photo gallery of pictures full of wacky and interesting stuff, but in case you're planning your own visit, here are some of my recommendations: Finally I want to mention a couple stores that I didn't take pictures of. B-Side Label has cool laptop stickers. There are a few locations; I went to the one in Kyoto. Second, New Yorkers might remember City Bakery, which sold really great pastries including the legendary pretzel croissant, plus hot chocolate which was way too rich for my taste. In 2019 City Bakery went out of business, leaving Americans croissant-less. But there are twenty City Bakery locations in Japan! We were randomly walking through a mall in Nagoya—bam! City Bakery! Heading to the Kyoto shopping district—City Bakery! They're quite a nostalgia trip, with everything looking and tasting exactly like it did the old City Bakery on 19th street, or maybe 18th, I could never remember. Anyway, that's why I've now got a freezer full of pretzel croissants from halfway across the world."
