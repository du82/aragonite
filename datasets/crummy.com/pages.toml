["http://www.crummy.com/2024/01/20/1"]
title = "The 2023 Crummy Review of Things, Part 2: Books and Games"
full_description = "(1) Sat Jan 20 2024 18:25 The 2023 Crummy Review of Things, Part 2: Books and Games: OK, I've finished looking over my records and I'm ready to do book and game recommendations. As often happens, the Crummy.com Review of Things will proceed in fits and starts this year, but I'll eventually get it all done. I've discovered that this is now how I keep track of the passage of my life, rather than blogging the things I do right as I do them like a normal person. The Crummy.com Book of the Year 2023 is Happy Snak, because it's the only book I wanted to do its own blog post about. Other good books I read in 2023 include Rescuing Prometheus: Four Monumental Projects That Changed the Modern World by Thomas P. Hughes, and the conceptually very similar The Backroom Boys: The Secret Return of the British Boffin, by Francis Spufford. The Crummy.com Game of the Year is Mr. Sun's Hatbox by solo developer Kenny Sun, which sets roguelike combinatorics in a platforming environment with a slapstick style to create a comedic, customizable Spelunky-style experience. Other games I really enjoyed include: The Legend of Zelda: Breath of the Wild, Mosa Lina, Factorio and Void Scrappers."
