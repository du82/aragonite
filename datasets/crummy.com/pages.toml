["http://www.crummy.com/2024/03/03/0"]
title = "February Film Roundup"
full_description = '''I thought the setup was somewhat preposterous, and upon reflection, it is exceedingly preposterous. But afterwards I discovered this is a sequel to Dentist in the Chair (1960), so I'm a little less weirded out by the casual "I'm trying to find a sinecure for these two incompetent dentists who are best friends with a thief" setup in the opening scenes. Those characters have already had a whole movie to set their dynamic, and we're just shoehorning them in to this one. Kay Lenz reminds me of my sister Susanna, and Eddie Albert has another great role (cf. The Heartbreak Kid) that I really didn't expect from "the Green Acres guy." Of course, Fred MacMurray is best known for being in a dull sitcom, but he was great in noir and western roles. Actors take the jobs they can get, is what I'm saying. Good news for Leonard's Japanese reading practice, but bad news for any gaijin trying to watch this movie: there is so much on-screen Japanese text in this one that subtitles weren't enough to follow the story. When it was just corporate emails and text messages, it was usually clear from context what was happening, but once we started getting "we're in a time loop" Powerpoint presentations and Ken Burns pans over pages of manga, Sumana and I were pausing a lot and making heavy use of Google Lens. The only other movie I can think of that's so text-heavy was Shin Godzilla (2016) and there the details of the text, like all human efforts to thwart Godzilla, turned out not to matter. Also, as I recall there was an English translation layer superimposed over the Japanese text, like what you see in subtitled anime, so if you read quick enough you could catch it all. Speaking of which, the Television Spotlight this month shines on Laid-Back Camp, a relaxing anime series that Sumana and I both enjoyed watching, and she didn't mind me constantly pausing to sound out signs or text messages. Fun and calming, with lots of katakana on the signs so I felt like I'd figured out what they were saying once I decoded the sounds.'''
