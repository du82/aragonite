["https://www.crummy.com/2015/03/02/0"]
title = "January Film roundup"
full_description = '''The 2003 version does a couple things better—notably the mayor— but most of the actors in the 2003 version are too young for the part and look even younger than they are. Matthew Broderick doesn't have the gravitas to play Professor Hill. More like Graduate Student Hill, amirite? There's a line where he tells Marian she's "twenty-six years late" to her Lovers' Lane assignation. Kristin Chenoweth is 35 in this movie and she looks about 28. Some shots had to be redone with a stunt double because Broderick's umbilical cord was visible. Overall, the 1962 version is still the best. I mean, Cary Grant refused to play Harold Hill because he wanted to see Robert Preston do it like he did on Broadway. That's a hell of an endorsement. And one thing we hadn't noticed before was that Preston isn't afraid to massively camp it up when he's putting the con on River City. I guess what I'm saying is it takes judgement, brains and maturity to play—I say that any fool can fast-talk his way through the Harold Hill part, and I call that sloth. Unaccountably other people don't consider this a deal-breaker. The movie was made, Sumana recommends it, and Sarah scoffed when I mentioned the possibility that a whale's gory death was a reason to dislike the movie. I am alone! I was afraid this would happen so I went online ahead of time looking for a Whale Death Warning, but even with hindsight the best I can find it this vague statement in an Amazon review: "Also, having the movie scenes with the Mother whale and the baby were to raw and disgusting for under aged people to watch.." I'm not even sure whether this is talking about the death scene or the (completely unobjectionable) nursing scene. That's why I'm starting a new website, doesthewhaledie.com, as a public service to whales and whale allies who want to be spared these graphic portrayals. Here's the initial site mockup I used to secure VC funding: MovieDoes the whale die? Star Trek IV No! 🐳 The Pirates Yes The Little Mermaid (initial establishing shot)Probably not That National Geographic special from the 80s OH GOD'''
