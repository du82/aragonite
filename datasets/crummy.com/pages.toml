["http://www.crummy.com/2024/05/04/0"]
title = "April Film Roundup"
full_description = '''Sat May 04 2024 11:27 April Film Roundup: Quite a few films this month despite work and two out-of-town trips: to Ohio to see the solar eclipse (spectacular!) and upstate to Storm King to see modernist sculpture too big to fit in a gallery (big!). I can recommend Arlene Schechet's Girl Group sculptures mentioned in this recent NYT article. The exhibit hadn't opened yet, but you can't exactly hide art at Storm King. Well, an interesting bit happened pretty quickly in The Fastest Gun Alive—a classic puppy-kick scene, but well executed—and I started paying full attention and never stopped. This is really good! It plays like a noir drama, with its exploration of human weakness, but it's not a noir with Western trappings: it's specifically focused on the interaction between masculinity and firearms, which is as Western as it gets. It took me a while to figure all of this out, because The Fastest Gun Alive is also the kind of movie that's padded with an unnecessary tap-dance number. So for a while I was baffled by this movie that seemed to be veering back and forth between Double Indemnity and Oklahoma!. (IMDB trivia: "Glenn Ford at first demanded that Russ Tamblyn's choreography not be included in the film. But at the premiere, the audience noticed that the choreography, performed by Russ Tamblyn, was written into the credits. They asked why there was no choreography in the movie and the studio eventually put it back." Easier than re-filming the credits, I guess!) Glenn Ford does a very good sort of Martin Freeman everyman in the lead, but the quality of the underlying story probably comes from the chemistry between noir director Russell Rouse and screenwriter Frank D. Gilroy. Like Dentist on the Job, I only found out after watching this that it's a sequel and we're supposed to remember the characters from the previous movie instead of just reading the stereotypes (which totally worked). I assumed that "as you know, Bob, you served in the war with these unbearable secondary characters" was a common enough plot device not to need a whole other movie backing it up. And although those secondary characters can get pretty unbearable, they each get a scene in I'm All Right, Jack that humanizes them and makes them more sympathetic—something American comedies generally don't bother with.'''
