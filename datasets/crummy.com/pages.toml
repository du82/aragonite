["http://www.crummy.com/2024/03/21/0"]
title = "Tapes And Transcripts Are Available!"
full_description = '''Thu Mar 21 2024 20:32 Tapes And Transcripts Are Available!: I've updated The Schickele Mix Online Fan Archive with... transcripts! All of the 130-ish episodes archived by fans now include transcripts of Peter Schickele's wisdom and silliness, cross-referenced to the corresponding timestamps on the Internet Archive. Here's a random example: the transcript of Episode 84, "Clarinet Plus". Some of these transcripts were created by running Whisper on my computer; others I created by paying someone else to run Whisper on their more powerful computer. Now that I've put it all up, one transcript per page, it doesn't seem that impressive, but it's a solid [runs script] 63.80 hours of transcribed text; that's after all the music was filtered out. I've also updated the dataset with some previously missing information, thanks to Reddit user kiyyik. Remember, if you've got any Schickele Mix recordings, I'll take 'em! Although the .srt files available for download are the originals as they came out of my/someone else's Whisper process, I wrote some code to tidy up the transcripts for the HTML views. Apart from cleaning up common hallucinations such as transcribing orchestral music as "¶¶" or "Thank you.", I caught and corrected forty different ways to misspell Peter Schickele's name. Here they are:'''
