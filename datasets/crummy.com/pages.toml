["http://www.crummy.com/2024/04/03/0"]
title = "March Film Roundup"
full_description = '''There's some of what I call "Cornetto trilogy foreshadowing" at the beginning, but it foreshadows the way the film is shot and edited, rather than the plot. (The director brought this up in the discussion afterwards, so for once it's not just me spouting off on something I think I noticed.) Other 20th-century crime authors I've been trying out, BTW: Kyril Bonfiglioli (hilarious!), Dick Francis (meh). Overall a real comedic surprise from a director I associate with Philadelphia and Silence of the Lambs. This movie has more arcade games than any movie I can think of that doesn't actually feature a video arcade. It's 1986, the peak year for arcade games being in (and outside!) every random convenience store and gas station. A period piece set in 1986 would make sure to feature classics like Ms. Pac-Man and Defender, but only a movie shot in real 1986 convenience stores would showcase Yie Ar Kung-Fu. (In case you weren't there, as I recall the outdoor arcade games were usually chained to something; you couldn't just pull up with a pickup truck after hours and steal them.)'''
