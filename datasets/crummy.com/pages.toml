["http://www.crummy.com/2021/09/02/0"]
title = "August Film Roundup"
full_description = '''Thu Sep 02 2021 22:12 August Film Roundup: Sumana was unavailable for a lot of this month, so I spent a lot of time watching films she doesn't want to watch. Yes, we're "going stag" to this month's Film Roundup. Lots of violence and dudes doing dudely things. I saw Lagaan like twenty years ago, so it's not officially in Film Roundup, but definitely catch that one if you haven't seen it. It's... I just realized it's an underdog sports movie. Oh well! The rest of the film... pretty good, I guess? Very style over substance, like a pre-post-apocalyptic Mad Max. The Taking of Pelham One Two Three is the most in-depth film I've seen about running the subway, but this film is really smart about the mechanics of riding the subway. There's a scene near the end of The Warriors where there's basically a little arcade set up in the middle of a subway station. There's no way something like that would actually exist; there's a pinball machine just sitting there in a 1980 New York subway station with no one keeping an eye on it. It had to be props. But why set up those props? I kept expecting an action scene to break out that would result in the smashing of the props, and there was an action scene shortly thereafter but it was filmed on a sound stage. So, did they just put some props in a subway station to add visual interest to a few shots? Were they going to have an action scene but it was too expensive to film, or it got cut? Was that a real subway-station pinball machine that everyone agreed not to vandalize, out of awe, like the baby in Children of Men? I doubt I'll ever know. From IMDB trivia: "The coffee shop scene sold Robert De Niro on the idea of making the film. He, Al Pacino, and Michael Mann later admitted that they couldn't wait to shoot that one scene." Yeah, no kidding! Just shoot that scene and wrap it, guys. You've had your fun. Apart from the coffee shop scene and the heartbreaking bit at the end, there was a lot of slogging through this movie for me. I know they put a ton of work into this, but I'd watch something that took an enormous effort to film and think "yeah, if you had a huge shootout with the cops in downtown L.A. it would definitely look like that."'''
