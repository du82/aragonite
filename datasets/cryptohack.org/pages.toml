["https://cryptohack.org/challenges/isogenies"]
title = "CryptoHack – Isogenies challenges"
full_description = '''Isogeny-based cryptography is a relatively new area of cryptography which began in the early 2000s with work by Couveignes (which was unpublished for more than a decade) and Rostovtsev and Stolbunov, who worked with hard homogenous spaces and isogeny-based protocols. Due to the mathematical complexity of the area, it's a fairly intimidating topic for many young researchers, but the mathematical richness is also a beautiful and alluring aspect which has driven a lot of research attention for the past twenty years.Of particular interest to cryptographers are supersingular elliptic curves. Considering the collection of isogenies between these curves as a graph, with (isomorphism classes) of curves as nodes and isogenies as edges, supersingular isogeny graphs have particular properties which make them attractive to designing asymmetric cryptographic primitives where public values are the start and end nodes, and the secret values are the paths between them.In 2022, isogeny-based cryptography went through its "second-wave" when it was shown that the isogeny-based key exchange mechanism known as "SIDH" could be broken in polynomial time thanks to work by the mathematician Kani from a paper published in 1996. As SIKE (built form SIDH) was a fourth-round candidate in the NIST post-quantum cryptography project, the complete break of the most well-known isogeny-based primitive has had a big impact on isogeny-based primitives.In a post-SIDH world, isogeny-based cryptography is now experiencing rapid progress in many different primitives thanks to constructive applications of the SIDH attack. One of the first descriptions of this is the PKE FESTA, and the variant QFESTA. More recently, an updated version of SQIsign (a digital signature algorithm currently in the NIST competition) was published which used work based on the SIDH-attack to dramatically improve performance of key generation, signing and verification.'''
year_published = 2025
clearnet = "https://cryptohack.org/challenges/isogenies"
