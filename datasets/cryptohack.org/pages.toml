["https://cryptohack.org/faq"]
title = "CryptoHack – FAQ"
description = "A free, fun platform to learn about cryptography through solving challenges and cracking insecure code."
full_description = '''CryptoHack is a free, fun platform for learning cryptography. The emphasis is on breaking bad implementations of "modern" crypto, such as AES, RSA, and Elliptic-curve. The format is a series of puzzles that teach small lessons and motivate further research. We took inspiration from Capture The Flag contests but wanted to build something that's permanent, focusses exclusively on cryptography, and is more accessible. All challenges have the same goal which is to discover a piece of secret information called the "flag". A flag is a string of characters that looks like: crypto{th15_1s_4_fl4g}. After submitting the correct flag on the platform, you will receive points. Sometimes the flag is in a different format and if so, the challenge will clearly specify that. Most challenges involve coding up a small solution, however we provide snippets of Python source code which you can adapt to your own purposes. Almost all of our challenges are written in Python 3, and we make extensive use of the PyCryptodome library to perform common cryptographic operations. A few of the more advanced challenges are written in Sage 9 (based on Python 3). Python is a fantastic language for fast prototyping of cryptography. It's readable and has native support for large integers; strong mathematics modules that call directly into C code for maximum speed (e.g. gmpy2); even a built-in modular exponentiation operator (pow()). Finally, SageMath is the open source tool with the most sophisticated support for modern cryptography, and it's built on top of Python. We provide an official Docker image that contains all the recommended technologies installed. If you have Docker, it's as simple as running: docker run -p 127.0.0.1:8888:8888 -it hyperreality/cryptohack:latest Alternatively, if you don't already have Python, you can install it on by following this guide. Next you'll need to install a few Python packages: On Linux and Mac, this could be as simple as opening up a terminal then running pip install PyCryptodome gmpy2 pwntools. You may first need to install the Pip package manager (sudo apt install python3-pip on Ubuntu) and then gmpy2 dependencies (sudo apt install libgmp-dev libmpc-dev libmpfr-dev on Ubuntu). On Windows, check this guide for how to get the Python package manager pip working.'''
