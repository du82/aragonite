["https://cryptohack.org/privacy-policy"]
title = "CryptoHack – FAQ"
full_description = "CryptoHack is a hobby project and not a business entity. You can contact us by email at admin [at] cryptohack [dot] org We are not required to have a data protection officer, so any enquiries about our use of your personal data should be addressed to the contact details above. Certain visitors to our websites choose to interact with CryptoHack in ways that require CryptoHack to gather personally-identifying information. The amount and type of information that CryptoHack gathers depends on the nature of the interaction. For example, we ask visitors who sign up at CryptoHack.org to provide an email address. In each case, CryptoHack collects such information only insofar as is necessary or appropriate to fulfill the purpose of the visitor’s interaction with CryptoHack. CryptoHack does not disclose personally-identifying information other than as described below. Visitors can always refuse to supply personally-identifying information, with the caveat that it may prevent them from engaging in certain website-related activities. Like most website operators, CryptoHack collects non-personally-identifying information of the sort that web browsers and servers typically make available, such as the browser type, language preference, referring site, and the date and time of each visitor request. Our purpose in collecting non-personally identifying information is to better understand how our visitors use the website. From time to time, CryptoHack may release non-personally-identifying information in the aggregate, e.g., by publishing a report on trends in the usage of the website. When you use our website to browse our content and view the information we make available, a cookie is used by us to allow you to remain logged in. CryptoHack visitors who do not wish to have cookies placed on their computers should set their browsers to refuse cookies before using the website, with the drawback that certain features of our websites may not function properly without the aid of cookies."
