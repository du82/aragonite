["https://cryptohack.org/careers"]
title = "CryptoHack – Careers"
description = "Many companies are interested in hiring people with cryptography and CTF skills. On this page you can browse job postings for companies who appreciate and sponsor CryptoHack."
full_description = "In the current public blockchain paradigm, users and entities unknowingly broadcast data in the public, compromising privacy and security to get trustlessness. Not only are unencrypted blockchains inherently privacy-exposing, they require significant redundancy to compute and verify the legitimacy of transactions. Implementing scalable encryption in a public blockchain paradigm requires cutting-edge math and engineering. Thankfully, our team of scientists and engineers invented Plonk, the industry-standard zkSNARK, and Noir, the universal language of zero knowledge. Now, we’re building a first of its kind Layer 2 with private smart contracts. And it’s now time to bring it to market. We’ve raised $125 million from industry-leading investors including a16z crypto, Paradigm, Variant, Consensys, and a_capital, and we’re growing quickly. We are looking for an applied cryptographer or a cybersecurity professional with love for applied cryptography, and with experience in auditing and breaking cryptographic protocols to join our security team. The goal of the team is to secure a large codebase including: You will need to find potential security issues, write novel tooling and apply existing mechanisms to detect bugs, assist internal software teams and external contractors with audits. Aztec Labs is an equal opportunity employer and we value creativity, diversity, and intellectual curiosity. If you're passionate about leveraging your creative talents to make a real-world impact, and if you want to be part of a team that's shaping the future of digital privacy, then we would love to hear from you. Right now we're looking for full-time application hacking experts, and we do mean experts. Experience in finding awesome vulns during web app pentests/code reviews is a must, but we also end up doing a fair number of mobile apps, client apps, server apps, APIs, and embedded devices/IoT as well. If your well-researched advisories or bug bounties show up around the web that's a really good sign. That being said, public advisories/bounties are not a requirement, we know there are plenty of good folks in the world who prefer not to publish any of their findings and we'd love to talk to all of you folks as well. We also do a bit of Reversing every now and then, so that experience helps for the occasion it arises."
year_published = 2025
