["https://cryptohack.org/blog"]
title = "CryptoHack Blog | Updates about the CryptoHack platform, cryptography news, and CTF writeups."
description = "Updates about the CryptoHack platform, cryptography news, and CTF writeups."
full_description = "Jun 2, 2024 New Challenges 07/2024 AnnouncementCryptoHackHello CryptoHackers! It’s been ages since our last challenge release. However, we hope to make it up to you by delivering an enormous release with almost 50 fresh challenges. Dec 10, 2022 New Challenges 12/2022 AnnouncementCryptoHackHello CryptoHackers! It’s been a quieter Autumn/Fall for CryptoHack, but we’ve still had a few things going on. And here’s an exciting challenge release. Aug 8, 2022 Cryptography CTF Archive AnnouncementCryptoHackNewsJack and I met up this weekend to build a feature which a lot of players have requested: a cryptography CTF archive. Jun 15, 2022 New Challenges 06/2022 AnnouncementCryptoHackHello CryptoHackers! I’m currently writing this post from Athens, Greece, where we are helping out with the International Cybersecurity Challenge. Feb 14, 2022 Announcing Matrix Bridge For CryptoHack Discord Chat AnnouncementCryptoHackCryptoHack chat is based on Discord, which has worked well for us so far. Discord is free, has a great UI, and has enabled the creation of the awesome CryptoHacker bot which links CryptoHack accounts to Discord profiles. Jan 5, 2022 Real-World Cryptography by David Wong Book Review BookReviewBest practices in applied cryptography have changed drastically over the last few decades. We know that if a cryptosystem can go wrong, in practice it will go wrong. A classic example is nonce reuse, which a wide number of symmetric ciphers, signature schemes, and authentication protocols are susceptible to (see CryptoHack challenges “ProSign 3” and “Forbidden Fruit”). In response, cryptographers have come up with algorithms such as EdDSA and AES-GCM-SIV which are designed to thwart such common and catastrophic usage errors. Further, in a perfect world developers wouldn’t be touching primitives at all, but would instead be making use of modern high-level libraries with well-documented APIs and a strong set of algorithms under the hood (libsodium, pyca/cryptography, Tink). Sep 18, 2021 CSAW Quals 2021 | Bits WriteupCSAWCryptoHack was asked to make some challenges for CSAW 2021 and Bits was our submission for the qualifiers, written by Robin and Jack. For those who qualified for the finals, you’ll have the chance to solve a few more CryptoHack challenges, but for now, we wanted to go through Bits, explain some potential solutions and some cover a few interesting things we learnt when building the challenge itself. Aug 6, 2021 CryptoCTF 2021 - Easy WriteupCryptoCTFLast week, CryptoHackers got together to play CryptoCTF for the second time as a team. We solved 26/29 of the challenges during the 24 hour window and came third overall. First and second places went to Super Guessers (Rkm and Rbtree are very friendly faces from CryptoHack) and a Vietnamese team working together to support the spirit of Ho Chi Minh city and nearby provinces. Congratulations to them both. Aug 5, 2021 CryptoCTF 2021 - Medium WriteupCryptoCTFLast week, CryptoHackers got together to play CryptoCTF for the second time as a team. We solved 26/29 of the challenges during the 24 hour window and came third overall. First and second places went to Super Guessers (Rkm and Rbtree are very friendly faces from CryptoHack) and a Vietnamese team working together to support the spirit of Ho Chi Minh city and nearby provinces. Congratulations to them both. Aug 4, 2021 CryptoCTF 2021 - Hard WriteupCryptoCTFLast week, CryptoHackers got together to play CryptoCTF for the second time as a team. We solved 26/29 of the challenges during the 24 hour window and came third overall. First and second places went to Super Guessers (Rkm and Rbtree are very friendly faces from CryptoHack) and a Vietnamese team working together to support the spirit of Ho Chi Minh city and nearby provinces. Congratulations to them both. Jun 24, 2021 New Challenges 06/2021 AnnouncementCryptoHackHello CryptoHackers! This week we’ll be releasing a new set of challenges, mostly made up of great community submissions. But first, a quick recap of what we’ve been up to in our mission to spread cryptography knowledge. May 21, 2021 Crypto Spammers Are Attacking Our Discord Community DiscordCryptoHackRecently our Discord community has come under attack by spammers advertising “cryptocurrency giveaways”. We have taken several steps to try to prevent spam but they have not been effective. This post explores how we think the spammers are automatically obtaining the member list and bypassing the verification and anti-abuse protections on Discord. At the end we consider some possible solutions. Apr 23, 2021 Cyber Apocalypse CTF 2021 | Part 1 WriteupEasyMediumHardThis week possibly the biggest cybersecurity Capture The Flag (CTF) ever was held as a joint event between HackTheBox and CryptoHack. With 9900 players participating in 4740 teams; plentiful prizes including cash and swag; and donations to charity for each challenge solved, this was a fantastic event to be part of. Apr 23, 2021 Cyber Apocalypse CTF 2021 | Part 2 WriteupInsaneIn the second part of our wrap-up after the success of Cyber Apocalypse CTF 2021, we break down the four hardest challenges we included. RuneScape was a challenge based on the Imai-Matsumoto cryptosystem. Tetris 3D built on the classic cipher given in Tetris. Hyper Metroid required computing the order of the Jacobian of a special class of hyperelliptic curves and SpongeBob SquarePants was a backdoored sponge hash collision. We loved making these challenges and hope you enjoy the write-up. Mar 24, 2021 Recovering a full PEM Private Key when half of it is redacted TwitterRSAPEMThe @CryptoHack__ account was pinged today by ENOENT, with a CTF-like challenge found in the wild: Source tweet. Here’s a write-up covering how given a partially redacted PEM, the whole private key can be recovered. Jan 26, 2021 New Challenges 01/2021 and T-shirts AnnouncementCryptoHackHappy new year CryptoHackers! It’s almost time for us to release our next set of challenges, once again dominated by great community submissions. Jan 22, 2021 Factoring in logarithmic time: a mathemagic trick RSABroken-CryptographyWhen you have an interest in cryptography, and you occasionally browse reddit, you’ve probably seen something like this before. Someone creates a new post on r/crypto or r/cryptography, claiming to be able to efficiently factor integers or RSA moduli. This then usually goes hand in hand with a serious lack of context and explanation, notation that is questionable at best, often just plain unreadable, and an aversion to providing even minimal proof by factoring an actual, cryptographically big modulus. Yet because it’s hard to understand, and sometimes there’s math involved that at first glance seems like it might have some deeper meaning, you’re left wondering, is there some insight to be found here. Spoiler alert: nope… Jan 11, 2021 Cracking a Chinese Proxy Tunnel: Real World CTF Personal Proxy Writeup WriteupBlock-CiphersAESNetworkingReal World CTF is a Chinese CTF focussing on realistic vulnerabilities. It’s one of the hardest, if not the hardest yearly CTF competition. LiveOverflow has a great video from the 2018 finals showing the impressive prizes, cyberpunk environment, and physical security at the event. This time an in-person finals could obviously not be held; the organisers donated money to charity instead. Jan 6, 2021 Finite Groups, Gaussian Integers & TetCTF 2021 WriteupFinite-FieldsGaussian-IntegersLast weekend TetCTF held their new year CTF competition. I felt particularly nostalgic playing this, as it was the TetCTF 2020 CTF where Hyper and I played the crypto challenges and soon after decided to make CryptoHack together. Something about Ndh’s crypto challenges really make me want to keep learning. Nov 24, 2020 ECDSA Side Channel Attack: Projective Signatures Ledger Donjon CTF Writeup WriteupECDSASide-ChannelsSignaturesThis challenge involved a special side channel attack on elliptic curve cryptography. It was one of the hardest challenges in the Ledger Donjon CTF. Writeup by esrever and joachim. Nov 24, 2020 Bruteforcing Bitcoin BIP39 Seeds: Scissors Secret Sharing Ledger Donjon CTF Writeup WriteupCryptocurrencyBlockchainThis challenge was one of the most straightforward to understand in the Ledger Donjon CTF. It involved bruteforcing a 12-word Bitcoin seed passphrase by starting off with partial information about it. Writeup by joachim. Nov 23, 2020 Side Channels: Remote Lab and Glitching AES Ledger Donjon CTF Writeup WriteupSide-ChannelsAESThese two challenges were part of the side channels category of Ledger Donjon CTF, and involved exploiting fault attacks. Writeups by joachim and esrever respectively. Nov 23, 2020 BLS Signatures and Secret RNG Donjon CTF Writeup WriteupECCRNGSignaturesFollowing on from our Fast Multisignatures and One Time-Based Signature writeups for Ledger Donjon CTF, here are two more for vulnerable signatures schemes from the pure cryptography category. Writeups by Robin_Jadoul. Nov 19, 2020 Hardware Wallet Sudoku: Elliptic Relations Ledger Donjon CTF Writeup WriteupsECCReversingCryptocurrencyThis challenge was the only one in the reverse engineering category of Ledger Donjon CTF. Writeup by rbtree. Nov 19, 2020 Atmega Pwn: PicoHSM Challenges Donjon CTF Writeup WriteupHardwarePwnThis was a series of three hardware exploitation challenges in Ledger Donjon CTF. All three challenges built on each other and ran on the same physical hardware hosted by the organizers. Writeup by Robin_Jadoul. Nov 18, 2020 Hacking EOS: Modern Cryptocomputer Ledger Donjon CTF Writeup WriteupBlockchainCryptocurrencySmart-ContractsThese two challenges in the Hardware/Pwn category of Ledger Donjon CTF saw us exploit an EOS node with smart contracts. Nov 18, 2020 Fast Multisignatures and One Time-Based Signature Ledger Donjon CTF Writeup WriteupMultisignaturesThese two challenges in the Crypto category of Ledger Donjon CTF involved exploiting vulnerable signature schemes. Writeup by josephsurin. Nov 14, 2020 Can't open apps on macOS: an OCSP disaster waiting to happen NewsMacOSOCSPPKITwo days ago, macOS users experienced worrying hangs when opening applications not downloaded from the Mac App Store. Many users suspected hardware issues with their devices, but as they took to social media, they found it was a widespread problem. And it was no coincidence that it was happening so soon after the launch of macOS “Big Sur”. Nov 11, 2020 New Challenges 11/2020 AnnouncementCryptoHackWe’re really excited to be sharing a new set of challenges with you all, with puzzles contributed by CryptoHack as well as the community. One of our motivations for CryptoHack was to create an excuse to learn as much as we could, and we love having the opportunity to play your puzzles and learn new areas of maths and cryptography. Sep 7, 2020 New Challenges 09/2020 AnnouncementCryptoHackAs CryptoHack has grown, we’ve released more and more challenges submitted by the community. We love receiving new challenges especially in those areas which are currently not well-covered on the site. Aug 21, 2020 Open Band, Open Problem WriteupMobius-TransformationsLast week, CryptoHack played in CryptoCTF as a big team and managed to grab second place. We shared a write up of the challenges we solved soon after the competition ended. Of all the challenges we saw, two of them managed to stump us during the 24 hours that the CTF was running for. Aug 15, 2020 CryptoCTF 2020 WriteupCryptoCTFHere are our challenge writeups from the CryptoCTF 2020 competition. Members of the CryptoHack community played under the team “CryptoHackers” and came second overall, solving 18 of the 20 challenges during the 24 hour competition. This was the first time we all played a CTF together, and we will definitely be doing it again in the future. It was truly a pleasure to get so many cryptographic brains together in one chatroom and collaborate on cracking some mindbending puzzles."
year_published = 2025
