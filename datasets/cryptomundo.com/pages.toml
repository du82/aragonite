full_description = "Archive for the “Eyewitness Accounts” Beasts in the Mist Posted by: Craig Woolheater on October 22nd, 2024 “What a bankrupt world it would be if you refused to believe things existed until you actually had seen a specimen in a museum. I mean, there are lots of things we are prepared to believe exist without having seen them,” Read: Beasts in the Mist » Categorized as: Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Extinct, Eyewitness Accounts, Mapinguary, Megafauna | Comments Off on Beasts in the Mist Scientist Claims He Solved the Mystery of Bigfoot Posted by: Craig Woolheater on February 3rd, 2023 A data scientist thinks he’s solved the mystery of Bigfoot ― not by searching for the creature out in the wilds, but by examining the math instead. Read: Scientist Claims He Solved the Mystery of Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Books, Breaking News, Cryptozoology, Eyewitness Accounts, Forensic Science, Sasquatch, Skeptical Discussions | Comments Off on Scientist Claims He Solved the Mystery of Bigfoot It’s a Giant! CryptoConspiracy? Posted by: Craig Woolheater on February 1st, 2023 He found Giants then the Government Found Him | What really happened to Andrew Dawson? Read: It’s a Giant! CryptoConspiracy? » Categorized as: Bigfoot, Bigfoot Report, Conspiracies, Cryptozoology, Eyewitness Accounts, Folklore, Pop Culture, Sasquatch, Videos, Viral Videos | Comments Off on It’s a Giant! CryptoConspiracy? Sasquatch Discovered: The Biography of Dr. John Bindernagel Posted by: Craig Woolheater on January 30th, 2023 “Sasquatch Discovered: The Biography of Dr. John Bindernagel” was written by Courtenay, B.C., resident Terrance James, who was friends with Bindernagel for 25 years. Read: Sasquatch Discovered: The Biography of Dr. John Bindernagel » Categorized as: Bigfoot, Bigfoot Report, Books, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Sasquatch | Comments Off on Sasquatch Discovered: The Biography of Dr. John Bindernagel 2018 Ogopogo Footage Posted by: Craig Woolheater on December 21st, 2021 Me and my dad where fishing off a doc in Kelowna BC and spotted something massive in the water. Read: 2018 Ogopogo Footage » Categorized as: Bigfoot Report, Cryptozoology, Evidence, Eyewitness Accounts, Lake Monsters, Ogopogo, Videos | Comments Off on 2018 Ogopogo Footage In Search of Monsters: Bigfoot Posted by: Craig Woolheater on April 3rd, 2019 It’s the world’s most famous cryptid – Bigfoot. Terrifying new eyewitness accounts of Bigfoot encounters, in combination with recently uncovered anthropological evidence, reveal a creature far fiercer and more predatory than the gentle, lumbering giant often depicted. Read: In Search of Monsters: Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Sasquatch, Television | Comments Off on In Search of Monsters: Bigfoot Wild Thing Letters Posted by: Craig Woolheater on February 15th, 2019 Letters about people’s own Bigfoot experiences Read: Wild Thing Letters » Categorized as: Bigfoot, Bigfoot Report, CryptoRadio, Cryptozoology, Eyewitness Accounts, Podcast, Pop Culture, Sasquatch | Comments Off on Wild Thing Letters Wild Thing: Eyewitness Posted by: Craig Woolheater on October 31st, 2018 A Bigfoot sighting can apparently change your life and even lead to obsession. Thousands of people claim to have laid eyes on Sasquatch over the past century and Laura’s spoken to dozens of them—compelling stories that will set your hair on end. If they didn’t see Bigfoot, what did they see? Read: Wild Thing: Eyewitness » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Eyewitness Accounts, Podcast, Pop Culture, Sasquatch | Comments Off on Wild Thing: Eyewitness Wild Thing: We Interrupt Your Regularly-Scheduled Sasquatch Posted by: Craig Woolheater on October 25th, 2018 Wild Thing fans! We ran into a production issue and have to delay the release of episode 4 “Eyewitness” by a week. Our apologies. But while there’s no full episode today, you can listen to a little preview of what’s to come. Read: Wild Thing: We Interrupt Your Regularly-Scheduled Sasquatch » Categorized as: Bigfoot, Bigfoot Report, CryptoRadio, Cryptozoologists, Cryptozoology, Eyewitness Accounts, Podcast, Pop Culture, Sasquatch | Comments Off on Wild Thing: We Interrupt Your Regularly-Scheduled Sasquatch Wild Thing: Bob Gimlin Posted by: Craig Woolheater on October 24th, 2018 Bob Gimlin is half of the famous duo that was there that day in 1967, when the Patterson-Gimlin film was shot. Despite years of ridicule and harassment, he stands by his story. Now, fifty years after that fateful day, he sits down to tell us about what happened and the fallout he experienced. Read: Wild Thing: Bob Gimlin » Categorized as: 50th Anniversary Tributes, Bigfoot, Bigfoot Report, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Footprint Evidence, Podcast, Pop Culture, Sasquatch | Comments Off on Wild Thing: Bob Gimlin Wild Thing: The Evidence Posted by: Craig Woolheater on October 16th, 2018 Let’s look at the evidence. There are footprints and sounds, grainy pictures, and the notorious Patterson-Gimlin film—that shaky 1967 video of a big, hairy beast striding through the forest. But how well does it hold up? We hear from a variety of people—the skeptics and the certain—who make their case for what evidence is out there. How much of it stands up to scrutiny? Read: Wild Thing: The Evidence » Categorized as: Bigfoot, Bigfoot Report, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Footprint Evidence, Forensic Science, Podcast, Pop Culture, Sasquatch | 1 Comment » Wild Thing: Distant Relative or Kissing Cousin? Posted by: Craig Woolheater on October 10th, 2018 Just what is Bigfoot? Descendant of ancient apes? Close human ancestor? Evolution might hold the answer to this question. Homo sapiens may rule the planet now but once upon a time, we weren’t the only hominid creatures walking around. Who’s to say that Bigfoot wasn’t—and still isn’t—among us? We talk to evolution experts and anthropologists, including Ian Tattersall, curator at the American Museum of Natural History in New York. Read: Wild Thing: Distant Relative or Kissing Cousin? » Categorized as: Bigfoot, Bigfoot Report, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Forensic Science, Podcast, Pop Culture, Sasquatch | 1 Comment » Wild Thing: Grover Posted by: Craig Woolheater on October 8th, 2018 Laura Krantz is a veteran public radio editor and producer. So how did she end up in the wilds of the Pacific Northwest, eyeballing some giant ground nests… that might have been made by Bigfoot? You can place the blame squarely on the shoulders of a guy named Grover. He was a tenured professor of anthropology at Washington State University and one of world’s preeminent experts on Sasquatch. And it turns out that Grover is also Laura’s long-lost cousin. How could she not do a story about this guy? Read: Wild Thing: Grover » Categorized as: Bigfoot, Bigfoot Report, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Forensic Science, Podcast, Pop Culture, Sasquatch | Comments Off on Wild Thing: Grover The ‘Wild Thing’ podcast is like ‘Serial’ for Sasquatches Posted by: Craig Woolheater on October 5th, 2018 For more than a year, Laura Krantz searched for Sasquatches and the people who love them. She tromped through the Pacific Northwest looking for Bigfoot nests, frequented Sasquatch-enthusiast chat rooms, and talked to scientists about how DNA testing may be able to be used to help prove — or at least explain — the hairy fella’s existence. Read: The ‘Wild Thing’ podcast is like ‘Serial’ for Sasquatches » Categorized as: Bigfoot, Bigfoot Report, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Podcast, Pop Culture, Sasquatch | Comments Off on The ‘Wild Thing’ podcast is like ‘Serial’ for Sasquatches The Bray Road Beast Reviewed Posted by: Loren Coleman on September 18th, 2018 It takes you on a trip you never saw coming! Read: The Bray Road Beast Reviewed » Categorized as: Cinema News, Cryptid Canids, Cryptid Cinema, CryptoZoo News, Cryptozoology, Eyewitness Accounts, Small Town Monsters | 1 Comment » var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '803977', Size: '300250'}; « Older Posts | |Top | Content|"
