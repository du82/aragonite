full_description = "Archive for the “Bigfoot Lunch Club” Today in Bigfoot History | 1999 | SF Chronicle Reports New Technology for Bigfooting Posted by: Guy Edwards on January 24th, 2016 On this day, January 24th, in 1999, The San Francisco Chronicle noted a change in the way bigfooters did their research. New call blasting techniques and somebody named Matthew Moneymaker with a database called BFRO are mentioned. Read: Today in Bigfoot History | 1999 | SF Chronicle Reports New Technology for Bigfooting » Categorized as: Bigfoot, Bigfoot Lunch Club, Call Blasting, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Pop Culture, Sasquatch | Comments Off on Today in Bigfoot History | 1999 | SF Chronicle Reports New Technology for Bigfooting Today in Bigfoot History | 2008 | Mike Rugg Exposes Pogonip Hoax Posted by: Guy Edwards on January 20th, 2016 Today, January 20, 2008, Mike Rugg posted in his newsletter Bigfoot Discovery Project (Vol. 3 No. 9) a series of events that lead him to believe he was dealing with a hoaxer. Read: Today in Bigfoot History | 2008 | Mike Rugg Exposes Pogonip Hoax » Categorized as: Bigfoot, Bigfoot Lunch Club, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Hoaxes, Photos, Pop Culture, Sasquatch | 1 Comment » Today in Bigfoot History | 2009 | Hopeful Skeptic Says Both Bigfoot Camps Need Help Posted by: Guy Edwards on January 14th, 2016 Today in 2009 Eugenie Scott spoke at the Ask a Scientist event in San Francisco. The topic that night was Bigfoot. As an anthropologist and a skeptic Eugenie seems to have more patience for bigfooters than she has for creationist. Read: Today in Bigfoot History | 2009 | Hopeful Skeptic Says Both Bigfoot Camps Need Help » Categorized as: Bigfoot, Bigfoot Lunch Club, Cryptozoologists, Cryptozoology, Evidence, Sasquatch, Skeptical Discussions | Comments Off on Today in Bigfoot History | 2009 | Hopeful Skeptic Says Both Bigfoot Camps Need Help Today in Bigfoot History | 2001 | Bigfoot Gains Traction With Scientists Posted by: Guy Edwards on January 14th, 2016 Today in 2001, Theo Stein of the Denver Post wrote an article originally titled, “Not All Scientists Doubt Bigfoot Now.” it was later retitled when it was archived as, “Legend of Bigfoot put to test, Mounting evidence gives many reason to believe.” Read: Today in Bigfoot History | 2001 | Bigfoot Gains Traction With Scientists » Categorized as: Bigfoot, Bigfoot Lunch Club, Cryptozoologists, Cryptozoology, Evidence, Footprint Evidence, Sasquatch | Comments Off on Today in Bigfoot History | 2001 | Bigfoot Gains Traction With Scientists Meet Ron Morehead in Portland Oregon Posted by: Guy Edwards on August 14th, 2015 Ron Morehead speaks at HopsSquatch Aug 16th Read: Meet Ron Morehead in Portland Oregon » Categorized as: Bigfoot, Bigfoot Lunch Club, Books, Conferences, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Evidence, Eyewitness Accounts, Men in Cryptozoology, Pop Culture, Sasquatch | Comments Off on Meet Ron Morehead in Portland Oregon New Stabilization of Patterson/Gimlin Film Prompts New Skepticism Posted by: Guy Edwards on August 14th, 2015 “At the end of the day, there’s just too much dirt surrounding the Patterson film to use it as any reliable source for debate about the existence of Bigfoot…” –Micah Hanks; Mysterious Universe Read: New Stabilization of Patterson/Gimlin Film Prompts New Skepticism » Categorized as: Bigfoot, Bigfoot Lunch Club, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Pop Culture, Sasquatch, Social Media, Videos | 14 Comments » Bigfoot Protection Required for Chewbacca Actor Posted by: Guy Edwards on June 25th, 2015 Peter Mayhew (Chewbacca) was required to be accompanied by crew-members who wore brightly-colored vests while in the forests of the Pacific Northwest filming scenes set on Endor, so as not to be mistaken for Bigfoot and shot. Read: Bigfoot Protection Required for Chewbacca Actor » Categorized as: Bigfoot, Bigfoot Lunch Club, Cinema News, Cryptid Cinema, Cryptozoology, Movie Monsters, Pop Culture, Sasquatch | 2 Comments » A Limited Deal for Bigfoot Readers Posted by: Guy Edwards on June 21st, 2015 ONE DAY ONLY!!! Sunday June 21st! You can buy the Kindle version of Thom Powell’s much-anticipated book, Edges of Science for only $1.99! Read: A Limited Deal for Bigfoot Readers » Categorized as: Bigfoot Lunch Club, Books, CryptoConsumerism, Cryptozoologists, Cryptozoology, Lake Monsters, Men in Cryptozoology, Paranormal Investigators, Sasquatch | Comments Off on A Limited Deal for Bigfoot Readers Meet the Author of The Oregon Bigfoot Highway Posted by: Guy Edwards on May 11th, 2015 Join us at HopsSquatch for a book signing to meet the author Joe Beelart as he spins tales from one of the most anticipated books on Sasquatch research. This biggest names in the Bigfoot community have waited years for this book and now you can get your own copy signed by the “King of Clackamas” himself; Joe Beelart. Read: Meet the Author of The Oregon Bigfoot Highway » Categorized as: Bigfoot, Bigfoot Lunch Club, Books, Cryptotourism, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Evidence, Expedition Reports, Eyewitness Accounts, Folklore, Footprint Evidence, Pop Culture, Sasquatch | Comments Off on Meet the Author of The Oregon Bigfoot Highway Living Sasquatch Legend Larry Lund Speaks in Portland Oregon Posted by: Guy Edwards on April 17th, 2015 This is a HopsSquatch you will not want to miss. Larry Lund doesn’t travel the Bigfooot circuit as much as he used to. His last public event was possibly three years ago at the annual Skamania County Bigfoot Bash. It is a rare honor to have the opportunity to meet the man who did research with all the original four pillars of Bigfoot research. Read: Living Sasquatch Legend Larry Lund Speaks in Portland Oregon » Categorized as: Bigfoot, Bigfoot Lunch Club, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Pop Culture, Sasquatch | Comments Off on Living Sasquatch Legend Larry Lund Speaks in Portland Oregon Award-Winning Scientist Presents New Solutions for Academic Acceptance of Bigfoot Research Posted by: Guy Edwards on March 10th, 2015 Ask anybody who has been bigfooting in the last 10 years and they will tell you, despite technology and the suggestion of paranormal activity there haven’t been many new ideas since the original four pillars of bigfooting (Byrne, Dehinden, Green, and Krantz) started to investigated the elusive Sasquatch. Read: Award-Winning Scientist Presents New Solutions for Academic Acceptance of Bigfoot Research » Categorized as: Bigfoot, Bigfoot Lunch Club, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Pop Culture, Sasquatch | Comments Off on Award-Winning Scientist Presents New Solutions for Academic Acceptance of Bigfoot Research Today in Bigfoot History | 1999 | SF Chronicle Reports New Technology for Bigfooting Posted by: Craig Woolheater on January 24th, 2015 On this day, January 24th, in 1999, The San Francisco Chronicle noted a change in the way bigfooters did their research. New call blasting techniques and somebody named Matthew Moneymaker with a database called BFRO are mentioned. Read: Today in Bigfoot History | 1999 | SF Chronicle Reports New Technology for Bigfooting » Categorized as: Bigfoot, Bigfoot Lunch Club, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Pop Culture, Sasquatch | Comments Off on Today in Bigfoot History | 1999 | SF Chronicle Reports New Technology for Bigfooting Today in Bigfoot History | 2008 | Mike Rugg Exposes Pogonip Hoax Posted by: Guy Edwards on January 20th, 2015 Today, January 20, 2008, Mike Rugg posted in his newsletter Bigfoot Discovery Project (Vol. 3 No. 9) a series of events that lead him to believe he was dealing with a hoaxer. Read: Today in Bigfoot History | 2008 | Mike Rugg Exposes Pogonip Hoax » Categorized as: Bigfoot, Bigfoot Lunch Club, Cryptozoologists, Cryptozo