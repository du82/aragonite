full_description = "Archive for the “Alien Big Cats” Sinister Swamps: Monsters and Mysteries from the Mire Posted by: Lyle Blackburn on June 17th, 2020 Join me on another exciting journey as I examine legends and sighting reports of strange phenomenon in some of North America’s most notorious swamplands. Read: Sinister Swamps: Monsters and Mysteries from the Mire » Categorized as: Alien Big Cats, Bigfoot, Books, Cryptid Canids, Cryptozoology, Feral People, Living Dinosaurs, Lizard People, Monstro Bizarro, Mystery Cats, River Monsters, Sasquatch, Skunk Apes | Comments Off on Sinister Swamps: Monsters and Mysteries from the Mire Zanzibar Leopard Captured on Camera, Despite Being Declared Extinct Posted by: Craig Woolheater on June 8th, 2018 The Zanzibar leopard was officially declared extinct 25 years ago, but the classification has been called into question after a wildlife biologist caught the elusive predator on camera. Read: Zanzibar Leopard Captured on Camera, Despite Being Declared Extinct » Categorized as: Alien Big Cats, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Extinct, Mystery Cats, Phantom Panthers, Television | 1 Comment » Extinct or Alive Posted by: Craig Woolheater on June 8th, 2018 What if extinct animals weren’t really extinct? The methods used to declare a species extinct are not as fool proof as people might assume. From eyewitness accounts to last known photographs, there is evidence that suggests some of these creatures are still very much alive in the wild. Read: Extinct or Alive » Categorized as: Alien Big Cats, Bigfoot Report, Cryptozoologists, Cryptozoology, Expedition Reports, Extinct, Mystery Cats, Phantom Panthers, Television, Thylacine | Comments Off on Extinct or Alive Coast to Coast AM: Shape-Shifting Monsters Posted by: Nick Redfern on September 7th, 2017 Shapeshifters presents a menagerie of otherworldly creatures and half-human monsters, from were-cats to blood-suckers to aliens. Discover legends and lore from around the world and experience first-hand encounters with shape-changing beasts that lurk in the night. Nick Redfern takes you deep into their domain, opening your eyes to paranormal secrets and cryptozoological wonders. Just be sure to keep some silver bullets close at hand. Read: Coast to Coast AM: Shape-Shifting Monsters » Categorized as: Abominable Snowman, Alien Big Cats, Bigfoot, Books, Cryptid Canids, Cryptozoology, Lair of the Beasts, Lake Monsters, Lizard People, Loch Ness Monster, Media Appearances, Mothman, Pop Culture, Sasquatch | Comments Off on Coast to Coast AM: Shape-Shifting Monsters Coast to Coast AM: Cryptids & Strange Entities Posted by: Nick Redfern on January 3rd, 2017 Author Nick Redfern is notorious for digging into secret, classified government and military files. He’ll share the lore and legends, as well as the first-person accounts of bizarre freaks of nature and spine-tingling paranormal entities including werewolves, Bigfoot, the Loch Ness monster, chupacabras, Mothman, the Abominable Snowman, the Mongolian Death Worm and more. Read: Coast to Coast AM: Cryptids & Strange Entities » Categorized as: Abominable Snowman, Alien Big Cats, Avian Mysteries, Bigfoot, Books, Chupacabras, Cryptid Canids, CryptoRadio, Cryptozoologists, Cryptozoology, Expedition Reports, Eyewitness Accounts, Flying Humanoids, Folklore, Giant Cryptid Reptiles, Lair of the Beasts, Lake Monsters, Living Dinosaurs, Lizard People, Loch Ness Monster, Mothman, Mystery Cats, Phantom Panthers, Podcast, Pop Culture, Sasquatch, Sea Monsters, Sea Serpents, Thunderbirds, Winged Weirdies, Yeti | Comments Off on Coast to Coast AM: Cryptids & Strange Entities Texas Bigfoot Conference Swag Posted by: Craig Woolheater on September 4th, 2016 Michael and Diana Esordi of googz & co have designed and created some really cool merchandise for the upcoming 15th Anniversary Texas Bigfoot Conference coming up October 15th in Jefferson, TX. Read: Texas Bigfoot Conference Swag » Categorized as: Alien Big Cats, Bigfoot, Bigfoot Report, Conferences, Cryptotourism, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Evidence, Expedition Reports, Eyewitness Accounts, Flying Humanoids, Folklore, Footprint Evidence, Forensic Science, Mothman, Mystery Cats, Phantom Panthers, Pop Culture, Sasquatch, Swamp Monsters, Winged Weirdies, Yeti | 1 Comment » 15th Anniversary Texas Bigfoot Conference Updates Posted by: Craig Woolheater on June 10th, 2016 The Texas Bigfoot Research Center celebrates the 15th anniversary of the Original Texas Bigfoot Conference held on September 15, 2001 with this year’s event to be held the weekend of October 14-16, 2016. This is the official Texas Bigfoot Weekend as proclaimed by the mayor of Jefferson in 2005. Read: 15th Anniversary Texas Bigfoot Conference Updates » Categorized as: Alien Big Cats, Bigfoot, Bigfoot Report, Books, Conferences, Cryptotourism, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Evidence, Expedition Reports, Eyewitness Accounts, Festivals, Flying Humanoids, Folklore, Footprint Evidence, Forensic Science, Mothman, Mystery Cats, Phantom Panthers, Pop Culture, Sasquatch, Swamp Monsters, Winged Weirdies, Yeti | Comments Off on 15th Anniversary Texas Bigfoot Conference Updates Eastern Mountain Lions May Be Extinct, but Locals Still See Them Posted by: Craig Woolheater on September 1st, 2015 Wildlife officials say they think sightings in the East have been Western cougars that wandered eastward, freed pets or a Florida panther. Read: Eastern Mountain Lions May Be Extinct, but Locals Still See Them » Categorized as: Alien Big Cats, Bigfoot, Bigfoot Report, Cryptozoology, Evidence, Eyewitness Accounts, Footprint Evidence, Mystery Cats, Out of Place, Phantom Panthers | 9 Comments » Michigan Police Look for Horse-Killing Sasquatch or Big Cat Posted by: Craig Woolheater on June 12th, 2015 Police and wildlife officials in Sanilac County, Michigan, are warning residents to lock up their pets and livestock and keep their children indoors until they determine what kind of large creature or animal killed a 1,200 pound horse in broad daylight. In this part of Michigan known as “the Thumb,” locals fear the killer could be anything from a coyote to a cougar to a Sasquatch. Read: Michigan Police Look for Horse-Killing Sasquatch or Big Cat » Categorized as: Alien Big Cats, Bigfoot, Bigfoot Report, Cryptozoology, Folklore, Mystery Cats, Phantom Panthers, Sasquatch | 2 Comments » The Beast of Bladenboro Posted by: Nick Redfern on June 10th, 2015 “Although many eye-witnesses described the animal as looking like a black leopard, there were some who said it was more akin to a sleek-looking bear. Adding to the confusion, the tracks of the creature were said to be dog-like, rather than feline in appearance.” Read: The Beast of Bladenboro » Categorized as: Alien Big Cats, Cryptozoology, Eyewitness Accounts, Lair of the Beasts, Mystery Cats, Phantom Panthers | 1 Comment » Marsupial Sabre-Tooths, Queensland Tigers, Blue Mountains Lions, and a Most Elusive Crypto-Cutting Posted by: Karl Shuker on June 8th, 2015 In 1980, a very popular television series screened in the UK was Arthur C. Clarke’s Mysterious World, produced by Yorkshire TV, in which the renowned, eponymous science-fiction writer presented a wide range of unexplained phenomena. Four episodes in this series were devoted to cryptozoological subjects. One of these dealt with sea monsters, one with lake monsters, one with man-beasts, and one with a wide assortment of other mystery creatures – including giant snakes, the king cheetah, the New Guinea dragon, the mokele-mbembe, and the thylacine or Tasmanian wolf Thylacinus cycnocephalus. Read: Marsupial Sabre-Tooths, Queensland Tigers, Blue Mountains Lions, and a Most Elusive Crypto-Cutting » Categorized as: Alien Big Cats, Cryptozoologists, Cryptozoology, Extinct, Eyewitness Accounts, Mystery Cats, Pop Culture, ShukerNature, Television, Thylacine | Comments Off on Marsupial Sabre-Tooths, Queensland Tigers, Blue Mountains Lions, and a Most Elusive Crypto-Cutting Any Truth to The Walker County Incident? Posted by: Craig Woolheater on May 23rd, 2015 Was this show last night on Animal Planet, I Was Bitten: The Walker County Incident, scripted or based on a true story? The following article offers some background on the incidents. Read: Any Truth to The Walker County Incident? » Categorized as: Alien Big Cats, Bigfoot, Bigfoot Report, Cryptozoology, Evidence, Eyewitness Accounts, Folklore, Mystery Cats, Phantom Panthers, Pop Culture, Sasquatch, Television, Videos | 5 Comments » Reviewing the Creature Weekend Posted by: Nick Redfern on May 8th, 2015 “This past weekend I flew out to Ohio to speak at the annual Creature Weekend, which was organized by Bruce Harrington (and with great help from a fine team of volunteers, including friends Brian and Terrie Seech). This was the fourth such event, but the first that I had attended – and I’m very glad I did.” Read: Reviewing the Creature Weekend » Categorized as: Alien Big Cats, Bigfoot, Conferences, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Lair of the Beasts, Mystery Cats, Phantom Panthers, Sasquatch | Comments Off on Reviewing the Creature Weekend Exploring American Monsters: Arkansas Posted by: Craig Woolheater on May 6th, 2015 The state of Arkansas in the southern U.S. is known for its lush green mountains, roaring rivers, and University of Arkansas football. It’s the headquarters of the world’s number one retailer, Wal-Mart, and is the birthplace of musician Johnny Cash, and former U.S. President Bill Clinton. It’s also the home of monsters. The most famous of these is the Fouke Monster, a sasquatch-type creature immortalized in the 1972 movie “The Legend of Boggy Creek.” But this series, “Exploring American Monsters,” isn’t about well-known beasts, it’s about the lesser-known creatures the world sees from the corner of its eye, like the Ozark Howler. Read: Exploring American Monsters: Arkansas » Categorized as: Alien Big Cats, Bigfoot, Bigfoot Report, Cryptid Canids, Cryptozoology, Eyewitness Accounts, Folklore, Giant Cryptid Reptiles, Lake Monsters, Mystery Cats, Phantom Panthers, Pop Culture, River Monsters, Sasquatch, Swamp Monsters, Winged Weirdies | Comments Off on Exploring American Monsters: Arkansas Monsters and Mysteries in America: Demon Panthers, Helicopter Crew Meets UFO, Doppelganger Posted by: Craig Woolheater on March 25th, 2015 Across Southern Illinois, townsfolk arm themselves against a demonic feline predator. A teenage girl tangles with a terrifying doppelganger that attempts to take her place. Two police chopper pilots in air combat with a UFO trying to shoot them down. Read: Monsters and Mysteries in America: Demon Panthers, Helicopter Crew Meets UFO, Doppelganger » Categorized as: Alien Big Cats, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Footprint Evidence, Mystery Cats, Phantom Panthers, Pop Culture, Television | Comments Off on Monsters and Mysteries in America: Demon Panthers, Helicopter Crew Meets UFO, Doppelganger var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '803977', Size: '300250'}; « Older Posts | |Top | Content|"
