full_description = "Archive for the “Cryptozoologists” Beasts in the Mist Posted by: Craig Woolheater on October 22nd, 2024 “What a bankrupt world it would be if you refused to believe things existed until you actually had seen a specimen in a museum. I mean, there are lots of things we are prepared to believe exist without having seen them,” Read: Beasts in the Mist » Categorized as: Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Extinct, Eyewitness Accounts, Mapinguary, Megafauna | Comments Off on Beasts in the Mist Sasquatch Discovered: The Biography of Dr. John Bindernagel Posted by: Craig Woolheater on January 30th, 2023 “Sasquatch Discovered: The Biography of Dr. John Bindernagel” was written by Courtenay, B.C., resident Terrance James, who was friends with Bindernagel for 25 years. Read: Sasquatch Discovered: The Biography of Dr. John Bindernagel » Categorized as: Bigfoot, Bigfoot Report, Books, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Sasquatch | Comments Off on Sasquatch Discovered: The Biography of Dr. John Bindernagel Survivorman Bigfoot | Episode 1 | Alberta | Les Stroud | Todd Standing Posted by: Craig Woolheater on December 21st, 2020 Les finds himself in a remote track of forested land in Alberta, Canada, a renowned Bigfoot hot spot. Read: Survivorman Bigfoot | Episode 1 | Alberta | Les Stroud | Todd Standing » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Expedition Reports, Pop Culture, Sasquatch, Television, Videos | Comments Off on Survivorman Bigfoot | Episode 1 | Alberta | Les Stroud | Todd Standing Expedition Bigfoot Posted by: Craig Woolheater on November 5th, 2019 Team Believes an Advanced Algorithm is the Missing Key to Solving the Bigfoot Legend Read: Expedition Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Breaking News, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Forensic Science, Pop Culture, Sasquatch, Television | 5 Comments » Bigfoot and Beyond Podcast with Cliff & Bobo Posted by: Craig Woolheater on May 28th, 2019 Welcome to the very first episode of “Bigfoot and Beyond with Cliff and Bobo”! Cliff Barackman and James “Bobo” Fay discuss this brand new podcast, how they met each other, how they came to be cast members of Animal Planet’s Finding Bigfoot, answer fan questions, and much more! Read: Bigfoot and Beyond Podcast with Cliff & Bobo » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Finding Bigfoot, Podcast, Pop Culture, Sasquatch, Videos | 1 Comment » Finding Rick Perry: The Missing Secretary Of Energy Posted by: Craig Woolheater on May 24th, 2019 Finding Bigfoot spoof Read: Finding Rick Perry: The Missing Secretary Of Energy » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Pop Culture, Sasquatch, Television, Videos | 2 Comments » Bigfoot Caught on Video in Wyoming? Posted by: Craig Woolheater on May 21st, 2019 This video look legit. It’s from Wyoming. Indeed, there are Bigfoots in Wyoming.Matt Moneymaker Read: Bigfoot Caught on Video in Wyoming? » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Sasquatch, Videos | 4 Comments » Yetis Are Not White! Posted by: Ken Gerhard on May 15th, 2019 you should tune into the Travel Channel tonight for the latest episode of ‘In Search of Monsters!’ Read: Yetis Are Not White! » Categorized as: Abominable Snowman, Cryptozoologists, Cryptozoology, Pop Culture, Television, Texas Monster Hunter | Comments Off on Yetis Are Not White! In Search of Monsters: Bigfoot Posted by: Craig Woolheater on April 3rd, 2019 It’s the world’s most famous cryptid – Bigfoot. Terrifying new eyewitness accounts of Bigfoot encounters, in combination with recently uncovered anthropological evidence, reveal a creature far fiercer and more predatory than the gentle, lumbering giant often depicted. Read: In Search of Monsters: Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Sasquatch, Television | Comments Off on In Search of Monsters: Bigfoot In Search of Monsters Posted by: Craig Woolheater on April 3rd, 2019 Travel Channel’s new series, “In Search of Monsters,” takes viewers on a frightening hunt for the truth behind infamous and iconic monsters that brings their legends to all-too-real life. Read: In Search of Monsters » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Loch Ness Monster, Mothman, Sasquatch, Television | Comments Off on In Search of Monsters Forthcoming Cryptozoology Books in 2019 Posted by: Loren Coleman on December 19th, 2018 What lies ahead? Read: Forthcoming Cryptozoology Books in 2019 » Categorized as: Books, Breaking News, CryptoZoo News, Cryptozoologists, Cryptozoology | 1 Comment » Wild Thing: Why We Want to Believe Posted by: Craig Woolheater on December 5th, 2018 Bigfoot researchers remain optimistic that Sasquatch is out there; that the creature will one day be found. Why? Why do people continue to believe? We’ll talk to professional skeptic Michael Shermer about the nature of belief. And we’ll look at why—even for those who think Bigfoot is a complete myth—the idea of Bigfoot holds so much appeal. What makes us so fascinated by this creature? Why do we want so badly to believe that it’s out there? Read: Wild Thing: Why We Want to Believe » Categorized as: Bigfoot, Bigfoot Report, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Forensic Science, Podcast, Pop Culture, Sasquatch, Skeptical Discussions | 4 Comments » Wild Thing: Peter Byrne Posted by: Craig Woolheater on November 26th, 2018 Of the Four Horsemen of Sasquatchery – the four men held up as the pioneers of Bigfoot research – only one remains: Peter Byrne. The 93-year-old tracker has looked for Bigfoot for decades but, as we learned when we sat down with him, that’s only one adventure in a life that’s jam-packed with them. Read: Wild Thing: Peter Byrne » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Podcast, Pop Culture, Sasquatch | Comments Off on Wild Thing: Peter Byrne Wild Thing: Taboo Posted by: Craig Woolheater on November 24th, 2018 Who are the people who build their lives around Bigfoot, the people who’ve risked their professional careers and personal reputations, and expended a lot of time, money and energy seeking out Sasquatch? We’ll attend an exclusive Bigfoot symposium, for the crème de la crème of Bigfoot researchers, and hear from many who’ve been ridiculed for their interest in Bigfoot. Read: Wild Thing: Taboo » Categorized as: Bigfoot, Bigfoot Report, Conferences, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Podcast, Pop Culture, Sasquatch | Comments Off on Wild Thing: Taboo Wild Thing: Bump in the Night Posted by: Craig Woolheater on November 13th, 2018 Tired of waiting around for other people to find Bigfoot, Laura goes on an expedition of her own. This particular outing is led by Cindy Caddell and three other seasoned ‘Squatchers, out in Oregon’s Mt. Hood National Forest. Once the sun sets, we’ll hear a few hair-raising stories around the campfire before heading out on a nighttime hike. Read: Wild Thing: Bump in the Night » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Expedition Reports, Podcast, Pop Culture, Sasquatch | 1 Comment » var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '803977', Size: '300250'}; « Older Posts | |Top | Content|"
