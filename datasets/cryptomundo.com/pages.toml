sted by: Craig Woolheater on September 29th, 2015 Ogopogo, Bownessie and the Lagarfjlot Worm profiled Wednesday morning. Read: Aquatic Cryptid Marathon » Categorized as: Bigfoot's bLog, Cryptozoology, Evidence, Eyewitness Accounts, Folklore, Lake Monsters, Ogopogo, Pop Culture, Television | Comments Off on Aquatic Cryptid Marathon Update: Mystery Creature Carcass Identified? Posted by: Markus Hemmler on September 14th, 2015 Let me add some explanations: In general it’s obviously a larger marine creature, so I considered larger known, recent marine creatures (namely cetacean or sharks) at first for identification and not a sturgeon as suggested. Read: Update: Mystery Creature Carcass Identified? » Categorized as: Bigfoot Report, Books, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Globster, Lake Monsters, Ogopogo, Photos, Sea Monsters | 6 Comments » Mystery Creature Carcass Identified? Posted by: Karl Shuker on August 24th, 2015 Has the creature in these two photos from Arlene Gaal’s book In Search of Ogopogo ever been conclusively identified and, if so, what was it and does anyone have any published sources for the identification? Read: Mystery Creature Carcass Identified? » Categorized as: Books, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Globster, Ogopogo, Photos, Sea Monsters, ShukerNature | 4 Comments » Water Cryptid Discussion Posted by: Craig Woolheater on July 22nd, 2015 Cryptomundian springheeledjack adds to the discussion of this Cryptomundo post: Fourth of July Champ Sighting Read: Water Cryptid Discussion » Categorized as: Bigfoot Report, Cadborosaurus, Champ/Lake Champlain Monster, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Lake Monsters, Loch Ness Monster, Ogopogo, River Monsters, Sea Monsters, Sea Serpents | 6 Comments » Mystery Moose vs. Ogopogo Posted by: Craig Woolheater on July 10th, 2015 Cryptomundian springheeledjack adds to the discussion of this Cryptomundo post from a few days ago: Mysterious Moose in Okanagan Read: Mystery Moose vs. Ogopogo » Categorized as: Bigfoot Report, Cryptozoologists, Cryptozoology, Eyewitness Accounts, Lake Monsters, Ogopogo | 4 Comments » Mysterious Moose in Okanagan Posted by: John Kirk on July 7th, 2015 Witness and news anchors make comparison to Ogopogo… Read: Mysterious Moose in Okanagan » Categorized as: Cryptid Universe, Cryptozoology, Evidence, Eyewitness Accounts, Lake Monsters, Ogopogo, Pop Culture, Television, Videos | 5 Comments » More Info: Boaters Spot Ogopogo Posted by: Craig Woolheater on April 29th, 2015 Cryptomundian Spookysr has tipped us off to an article with additional information about this Ogopogo sighting last week. Read: More Info: Boaters Spot Ogopogo » Categorized as: Bigfoot Report, Cryptozoology, Eyewitness Accounts, Giant Cryptid Reptiles, Lake Monsters, Ogopogo | 2 Comments » Boaters Spot Ogopogo Posted by: Craig Woolheater on April 24th, 2015 “It is true, it does exist, I saw it with my own eyes,” says a Kelowna boater of a surprise experience with Ogopogo. Read: Boaters Spot Ogopogo » Categorized as: Bigfoot Report, Cryptozoology, Eyewitness Accounts, Lake Monsters, Ogopogo | 6 Comments » Reminder: Sea Monsters: Fact Or Fiction? Posted by: Craig Woolheater on March 24th, 2015 Watch the event streamed live here starting at 6:30 PM Pacific tonight! Read: Reminder: Sea Monsters: Fact Or Fiction? » Categorized as: Bigfoot Report, Cadborosaurus, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Evidence, Eyewitness Accounts, Lake Monsters, Ogopogo, Pop Culture, Sea Monsters, Sea Serpents, Videos | 1 Comment » Sea Monsters: Fact Or Fiction? Posted by: Craig Woolheater on March 23rd, 2015 Join the Vancouver Aquarium for a presentation on prehistoric and modern day sea monsters. Date: Tuesday, March 24, 2015 Time: 6:30 p.m. Read: Sea Monsters: Fact Or Fiction? » Categorized as: Bigfoot Report, Cadborosaurus, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Evidence, Eyewitn