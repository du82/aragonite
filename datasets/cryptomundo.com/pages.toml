full_description = "Archive for the “Living Fossils” Return of the Dodo? Posted by: Craig Woolheater on February 2nd, 2023 Return of the Dodo? Scientists launch project to bring back the extinct species using stem cell technology – more than 350 YEARS after it was wiped out Read: Return of the Dodo? » Categorized as: Bigfoot Report, Extinct, Living Fossils, Pop Culture, Thylacine, Weird Animal News | Comments Off on Return of the Dodo? The Jaws of Megalodon – Shark of Nightmare…and Reality? Posted by: Karl Shuker on August 17th, 2017 It was only ever going to be a matter of time before my blog ShukerNature boldly went where it had never gone before, by confronting what may well be not only the most terrifying cryptid of all time but also the most controversial one – the cryptid that dare not speak its name, in fact, because that name is…Megalodon! Read: The Jaws of Megalodon – Shark of Nightmare…and Reality? » Categorized as: Books, Cryptozoology, Extinct, Eyewitness Accounts, Fossil Finds, Living Fossils, Megalodon, Sea Monsters, ShukerNature | 3 Comments » Fisher Pigs, Swamp Pigs, Hell Pigs, and Terminator Pigs – Entelodonts Emergent? Posted by: Karl Shuker on August 5th, 2017 Whereas Arthurian legend had its Fisher King, rural Hungarian lore apparently once included an ostensibly real but presently-unidentified mystery beast known as the fisher pig. Read: Fisher Pigs, Swamp Pigs, Hell Pigs, and Terminator Pigs – Entelodonts Emergent? » Categorized as: Books, Cryptozoologists, Cryptozoology, Hogs, Living Fossils, Megafauna, ShukerNature, Swamp Monsters | Comments Off on Fisher Pigs, Swamp Pigs, Hell Pigs, and Terminator Pigs – Entelodonts Emergent? Cryptozoologist and Cryptozoology Book of 2016 – Two Awesome Birthday Presents! Posted by: Karl Shuker on December 18th, 2016 The second week of December 2016 is not one that I shall long remember – and for all the right reasons! Not only did it contain my birthday but it also presented me with two unique birthday presents – Loren Coleman and his International Cryptozoology Museum did me the immense double honour of presenting me […] Read: Cryptozoologist and Cryptozoology Book of 2016 – Two Awesome Birthday Presents! » Categorized as: Books, CryptoZoo News, Cryptozoologists, Cryptozoology, International Cryptozoology Museum, Living Dinosaurs, Living Fossils, Loch Ness Monster, Media Appearances, Men in Cryptozoology, Reviews, Sea Monsters, ShukerNature, Social Media, Thunderbirds, Winged Weirdies, Year In Review | 1 Comment » Still In Search Of Prehistoric Survivors Posted by: Karl Shuker on November 29th, 2016 It has been 21 years since the original publication back in 1995 of In Search of Prehistoric Survivors, considered by many to be my finest cryptozoological volume. Not surprisingly, then, in subsequent years there has been a growing, persistent clamour among its numerous fans worldwide for me to prepare a new, updated edition. Now, at last, fulfilling a longstanding promise, I have done so – and what an update it is! Read: Still In Search Of Prehistoric Survivors » Categorized as: Avian Mysteries, Books, Cadborosaurus, Champ/Lake Champlain Monster, Coelacanth, Cryptid Canids, Cryptoart, Cryptozoology, Extinct, Eyewitness Accounts, Giant Cryptid Reptiles, Lake Monsters, Living Dinosaurs, Living Fossils, Loch Ness Monster, Mapinguary, Megafauna, Megalodon, Mokele-Mbembe, Mystery Cats, Ogopogo, River Monsters, Sea Monsters, Sea Serpents, ShukerNature, Swamp Monsters, Thunderbirds, Thylacine, Winged Weirdies | Comments Off on Still In Search Of Prehistoric Survivors The Yukon Beaver Eater, and Ground Sloths in New Zealand? Posted by: Karl Shuker on March 9th, 2016 When we think of sloths, we generally picture those famously sluggish, dog-sized, tree-dwelling beasts that spend much of their time hanging upside-down from branches in modern-day Central and South America. Millions of years ago, however, there were several additional, very different morphological types – of which the most famous and dramatic were the ground sloths. Read: The Yukon Beaver Eater, and Ground Sloths in New Zealand? » Categorized as: Cryptozoology, Eyewitness Accounts, Folklore, Living Fossils, Mapinguary, Megafauna, Out of Place, ShukerNature | Comments Off on The Yukon Beaver Eater, and Ground Sloths in New Zealand? Commentary: Pterosaur Captured in Flight Over Boise? Posted by: Craig Woolheater on September 10th, 2015 Special effects or the return of a Pterosaur? Amateur footage appears to capture extinct reptile flying over Idaho Read: Commentary: Pterosaur Captured in Flight Over Boise? » Categorized as: Avian Mysteries, Bigfoot Report, Cryptozoology, Evidence, Eyewitness Accounts, Giant Cryptid Reptiles, Living Dinosaurs, Living Fossils, Pop Culture, Social Media, Videos, Winged Weirdies | 4 Comments » Pterosaur Captured in Flight Over Boise? Posted by: Craig Woolheater on September 8th, 2015 Special effects or the return of a Pterosaur? Amateur footage appears to capture extinct reptile flying over Idaho Read: Pterosaur Captured in Flight Over Boise? » Categorized as: Avian Mysteries, Bigfoot Report, Cryptozoology, Evidence, Eyewitness Accounts, Giant Cryptid Reptiles, Living Dinosaurs, Living Fossils, Pop Culture, Videos, Winged Weirdies | 11 Comments » Megalania – A Monster Still Among Us? Posted by: Nick Redfern on July 23rd, 2015 Is it feasible that the subtropical rainforests of Australia are home to gigantic, marauding lizards of twenty to thirty feet in length? Could such Jurassic Park-like beasts really remain hidden, undetected, and free to rampage around in near-unstoppable fashion? Just maybe, the answer is “yes.” Read: Megalania – A Monster Still Among Us? » Categorized as: Cryptozoology, Extinct, Eyewitness Accounts, Giant Cryptid Reptiles, Lair of the Beasts, Living Dinosaurs, Living Fossils, Megafauna, Movie Monsters | 6 Comments » Dung-Heaps, Devil-Pigs, and Monckton’s Gazeka Posted by: Karl Shuker on September 6th, 2014 With an area of more than 340,000 square miles, New Guinea is second only to Greenland as the largest island in the world (Australia is bigger than both but is officially deemed an island continent, rather than a mere island). Throughout its length and breadth, however, are dense and often little-explored rainforests where various surprising […] Read: Dung-Heaps, Devil-Pigs, and Monckton’s Gazeka » Categorized as: Cryptozoology, Evidence, Expedition Reports, Extinct, Eyewitness Accounts, Folklore, Footprint Evidence, Living Fossils, Megafauna, Out of Place, ShukerNature | Comments Off on Dung-Heaps, Devil-Pigs, and Monckton’s Gazeka Free E-Book: Live Pterosaurs in Australia and Papua New Guinea Posted by: Craig Woolheater on August 26th, 2014 Jonathan David Whitcomb offers his e-book titled Live Pterosaurs in Australia and Papua New Guinea for free! Read: Free E-Book: Live Pterosaurs in Australia and Papua New Guinea » Categorized as: Avian Mysteries, Bigfoot Report, Books, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Living Dinosaurs, Living Fossils, Winged Weirdies | Comments Off on Free E-Book: Live Pterosaurs in Australia and Papua New Guinea Whither the Water Elephant? Posted by: Karl Shuker on July 9th, 2014 Whereas the African pygmy elephant has attracted appreciable interest and even more appreciable controversy, both within and beyond the cryptozoological community, a second contentious proboscidean reported from the Dark Continent has received far less attention, but in my view is much more intriguing. This latter cryptid is the so-called water elephant. ((c) Markus Bühler The […] Read: Whither the Water Elephant? » Categorized as: Cryptozoology, Eyewitness Accounts, Lake Monsters, Living Fossils, ShukerNature, Swamp Monsters | 2 Comments » Nessie Is Not A Plessie Posted by: Nick Redfern on June 17th, 2014 “When the Wiltshire-based host asked me to comment on the theory that the Nessies are plesiosaurs, I replied it was complete nonsense. For a second or so, there was a noticeable silence…” Read: Nessie Is Not A Plessie » Categorized as: Cryptozoologists, Cryptozoology, Evidence, Extinct, Eyewitness Accounts, Giant Cryptid Reptiles, Lair of the Beasts, Lake Monsters, Living Dinosaurs, Living Fossils, Loch Ness Monster | 9 Comments » Are Dinosaurs Really Extinct? Posted by: Craig Woolheater on May 27th, 2014 Numerous eyewitnesses have reported seeing a living dinosaur in the jungles of Cameroon. The locals refer to the creature as Mokele-Mbembe and it may be the last living sauropod dinosaur. The dinosaur sightings report a creature with a heavily armored body, a fringe of scales down its back, three foot circumference footprints, long neck, snake like head, a body as big as an elephant, claw-like feet and a long tail. In the MonsterQuest Episode “The Last Dinosaur”, the team goes to Africa in search of this last living dinosaur. Read: Are Dinosaurs Really Extinct? » Categorized as: Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Folklore, Footprint Evidence, Lake Monsters, Living Dinosaurs, Living Fossils, Mokele-Mbembe, MonsterQuest, Pop Culture, Television, Videos | 3 Comments » In Search of the Congo Dinosaur Posted by: John Kirk on May 27th, 2014 I want to let you in on a great documentary series done by my mate Wayne Hall. It’s called In Search of the Congo dinosaur. Yes, there are creationist overtones which some may not agree with, but the essence of Mokele-mbembe research is captured in this series. This is a real passion of mine and I reckon that all the deprivations that me (my) mates and I have undergone has been worth it. Read: In Search of the Congo Dinosaur » Categorized as: Cryptid Universe, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Footprint Evidence, Giant Cryptid Reptiles, Living Dinosaurs, Living Fossils, Mokele-Mbembe, MonsterQuest, Swamp Monsters, Television, Videos | 4 Comments » var ACE_AR = {Site: '794