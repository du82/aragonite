full_description = "Archive for the “Abominable Snowman” Yetis Are Not White! Posted by: Ken Gerhard on May 15th, 2019 you should tune into the Travel Channel tonight for the latest episode of ‘In Search of Monsters!’ Read: Yetis Are Not White! » Categorized as: Abominable Snowman, Cryptozoologists, Cryptozoology, Pop Culture, Television, Texas Monster Hunter | Comments Off on Yetis Are Not White! Bigfoot Bonanza Posted by: Craig Woolheater on March 2nd, 2018 Two days of cult classic Bigfoot and Yeti flicks, documentaries, and Guest Speakers in a haunted and historic movie theatre on the Barbary Coast of California!​ Read: Bigfoot Bonanza » Categorized as: Abominable Snowman, Bigfoot, Bigfoot Report, Cinema News, Cryptid Cinema, CryptoConsumerism, Cryptotourism, Cryptozoologists, Cryptozoology, Pop Culture, Sasquatch, Skunk Apes, Yeti | Comments Off on Bigfoot Bonanza On Exhibit: The “Yeti Memo” Posted by: Craig Woolheater on October 18th, 2017 In 1959, the U.S. State Department received a curious memo from the new U.S. Embassy in Nepal concerning the regulations for Yeti hunting. This memo is now on display… Read: On Exhibit: The “Yeti Memo” » Categorized as: Abominable Snowman, Cryptozoologists, Cryptozoology, Museums, Pop Culture, Yeti | Comments Off on On Exhibit: The “Yeti Memo” Coast to Coast AM: Shape-Shifting Monsters Posted by: Nick Redfern on September 7th, 2017 Shapeshifters presents a menagerie of otherworldly creatures and half-human monsters, from were-cats to blood-suckers to aliens. Discover legends and lore from around the world and experience first-hand encounters with shape-changing beasts that lurk in the night. Nick Redfern takes you deep into their domain, opening your eyes to paranormal secrets and cryptozoological wonders. Just be sure to keep some silver bullets close at hand. Read: Coast to Coast AM: Shape-Shifting Monsters » Categorized as: Abominable Snowman, Alien Big Cats, Bigfoot, Books, Cryptid Canids, Cryptozoology, Lair of the Beasts, Lake Monsters, Lizard People, Loch Ness Monster, Media Appearances, Mothman, Pop Culture, Sasquatch | Comments Off on Coast to Coast AM: Shape-Shifting Monsters Searching for the Yeti Posted by: Craig Woolheater on August 15th, 2017 There is a Yeti animal. But explaining the animal mystery turns out not to explain the Yeti’s story. Read: Searching for the Yeti » Categorized as: Abominable Snowman, Bigfoot Report, Books, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Folklore, Footprint Evidence, Yeti | 3 Comments » After Hours with Peter Byrne Posted by: Craig Woolheater on June 1st, 2017 When he was a child in Ireland, Peter Byrne’s father used to tell him bedtime stories about the yeti. As a young man, Byrne spent years in the Himalayas, and later—once he was convinced by bigfoot tracks and Native American lore—he traveled across five continents in search of bigfoot. This man is one of the four horsemen of Bigfoot, a true living legend. Enjoy this very special After Hours with Rictor. Read: After Hours with Peter Byrne » Categorized as: Abominable Snowman, Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Folklore, Footprint Evidence, Podcast, Pop Culture, Sasquatch, Yeti | 1 Comment » Adam Davies Talks Bigfoot Posted by: Craig Woolheater on May 26th, 2017 One of the most controversial and riveting episodes of BoA:Audio gets a long overdue revisiting as extreme explorer Adam Davies returns to the show to rehash his infamous ‘Bigfoot portal’ experience as well as update us on all of the strange and unusual adventures he’s had since the last time we chatted. Plus the requisite update on the pesky Orang Pendek. Read: Adam Davies Talks Bigfoot » Categorized as: Abominable Snowman, Almas, Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Men in Cryptozoology, Orang Pendek, Podcast, Pop Culture, Sasquatch, Yeren, Yeti | 1 Comment » The Unbelievable Cryptozoology Coloring Book Posted by: Craig Woolheater on March 21st, 2017 Discover hidden monsters of dark forests, vast wilderness, and ocean depths! Cryptozoology concerns the study of animals whose existence is not yet proven — and this coloring book ranges all over the globe to recapture mysterious creatures. Read: The Unbelievable Cryptozoology Coloring Book » Categorized as: Abominable Snowman, Avian Mysteries, Bigfoot, Bigfoot Report, Chupacabras, Cryptoart, Cryptozoology, Lake Monsters, Loch Ness Monster, Megalodon, Pop Culture, Sasquatch, Winged Weirdies, Yeti | Comments Off on The Unbelievable Cryptozoology Coloring Book Reminder: Bigfoot Bonanza This Weekend! Posted by: Craig Woolheater on March 11th, 2017 Come to San Francisco for three days of classic Bigfoot and Yeti movies with documentaries on both screens in the haunted and historic Balboa Theatre! Guest Speakers Cliff Barackman, Kathy Strain, John Freitas & Montra L. Freitas, Lex, Samantha and Sara of The Ultimate Female Bigfoot Team, Plus Film-makers Seth Breedlove of Small Town Monsters from Ohio and Craig Flipy from Portland, showing their films and doing a Q & A! Read: Reminder: Bigfoot Bonanza This Weekend! » Categorized as: Abominable Snowman, Bigfoot, Bigfoot Report, Cinema News, Conspiracies, Cryptid Cinema, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Festivals, Movie Monsters, Pop Culture, Sasquatch, Skunk Apes, Swamp Monsters, Television, Yeti | Comments Off on Reminder: Bigfoot Bonanza This Weekend! Bigfoot Bonanza Posted by: Craig Woolheater on March 9th, 2017 Come to San Francisco for three days of classic Bigfoot and Yeti movies with documentaries on both screens in the haunted and historic Balboa Theatre! Guest Speakers Cliff Barackman, Kathy Strain, John Freitas & Montra L. Freitas, Lex, Samantha and Sara of The Ultimate Female Bigfoot Team, Plus Film-makers Seth Breedlove of Small Town Monsters from Ohio and Craig Flipy from Portland, showing their films and doing a Q & A! Read: Bigfoot Bonanza » Categorized as: Abominable Snowman, Bigfoot, Bigfoot Report, Cinema News, Conferences, Cryptid Cinema, Cryptotourism, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Evidence, Eyewitness Accounts, Festivals, Finding Bigfoot, Footprint Evidence, Movie Monsters, Pop Culture, Sasquatch, Swamp Monsters, Television, Yeti | Comments Off on Bigfoot Bonanza Coast to Coast AM: Cryptids & Strange Entities Posted by: Nick Redfern on January 3rd, 2017 Author Nick Redfern is notorious for digging into secret, classified government and military files. He’ll share the lore and legends, as well as the first-person accounts of bizarre freaks of nature and spine-tingling paranormal entities including werewolves, Bigfoot, the Loch Ness monster, chupacabras, Mothman, the Abominable Snowman, the Mongolian Death Worm and more. Read: Coast to Coast AM: Cryptids & Strange Entities » Categorized as: Abominable Snowman, Alien Big Cats, Avian Mysteries, Bigfoot, Books, Chupacabras, Cryptid Canids, CryptoRadio, Cryptozoologists, Cryptozoology, Expedition Reports, Eyewitness Accounts, Flying Humanoids, Folklore, Giant Cryptid Reptiles, Lair of the Beasts, Lake Monsters, Living Dinosaurs, Lizard People, Loch Ness Monster, Mothman, Mystery Cats, Phantom Panthers, Podcast, Pop Culture, Sasquatch, Sea Monsters, Sea Serpents, Thunderbirds, Winged Weirdies, Yeti | Comments Off on Coast to Coast AM: Cryptids & Strange Entities Hunt For The Yeti: Unmasking the Myth Posted by: Craig Woolheater on October 27th, 2016 In the finale of Josh Gates’ hunt for the Yeti, he rafts into the remotest corners of Bhutan to capture some of his best evidence yet of the reclusive creature. Then, Josh returns to the USA, where all of his samples are analyzed to answer the question…is the Yeti real? Read: Hunt For The Yeti: Unmasking the Myth » Categorized as: Abominable Snowman, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Expe