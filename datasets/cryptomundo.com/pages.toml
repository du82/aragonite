full_description = "Archive for the “Evidence” Beasts in the Mist Posted by: Craig Woolheater on October 22nd, 2024 “What a bankrupt world it would be if you refused to believe things existed until you actually had seen a specimen in a museum. I mean, there are lots of things we are prepared to believe exist without having seen them,” Read: Beasts in the Mist » Categorized as: Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Extinct, Eyewitness Accounts, Mapinguary, Megafauna | Comments Off on Beasts in the Mist Sasquatch Discovered: The Biography of Dr. John Bindernagel Posted by: Craig Woolheater on January 30th, 2023 “Sasquatch Discovered: The Biography of Dr. John Bindernagel” was written by Courtenay, B.C., resident Terrance James, who was friends with Bindernagel for 25 years. Read: Sasquatch Discovered: The Biography of Dr. John Bindernagel » Categorized as: Bigfoot, Bigfoot Report, Books, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Sasquatch | Comments Off on Sasquatch Discovered: The Biography of Dr. John Bindernagel 2018 Ogopogo Footage Posted by: Craig Woolheater on December 21st, 2021 Me and my dad where fishing off a doc in Kelowna BC and spotted something massive in the water. Read: 2018 Ogopogo Footage » Categorized as: Bigfoot Report, Cryptozoology, Evidence, Eyewitness Accounts, Lake Monsters, Ogopogo, Videos | Comments Off on 2018 Ogopogo Footage Expedition Bigfoot Posted by: Craig Woolheater on November 5th, 2019 Team Believes an Advanced Algorithm is the Missing Key to Solving the Bigfoot Legend Read: Expedition Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Breaking News, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Forensic Science, Pop Culture, Sasquatch, Television | 5 Comments » Bigfoot Caught on Video in Wyoming? Posted by: Craig Woolheater on May 21st, 2019 This video look legit. It’s from Wyoming. Indeed, there are Bigfoots in Wyoming.Matt Moneymaker Read: Bigfoot Caught on Video in Wyoming? » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Sasquatch, Videos | 4 Comments » In Search of Monsters: Bigfoot Posted by: Craig Woolheater on April 3rd, 2019 It’s the world’s most famous cryptid – Bigfoot. Terrifying new eyewitness accounts of Bigfoot encounters, in combination with recently uncovered anthropological evidence, reveal a creature far fiercer and more predatory than the gentle, lumbering giant often depicted. Read: In Search of Monsters: Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Sasquatch, Television | Comments Off on In Search of Monsters: Bigfoot In Search of Monsters Posted by: Craig Woolheater on April 3rd, 2019 Travel Channel’s new series, “In Search of Monsters,” takes viewers on a frightening hunt for the truth behind infamous and iconic monsters that brings their legends to all-too-real life. Read: In Search of Monsters » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Loch Ness Monster, Mothman, Sasquatch, Television | Comments Off on In Search of Monsters Russian Bigfoot Caught on Camera? Posted by: Craig Woolheater on December 13th, 2018 Google translated text of original article: A strange creature fell into the lens of the driver’s camera near Severodvinsk. The man, who shared the video on the Web, said that he had casually noticed how a mysterious creature was moving along the highway, completely covered with either fur or hair. The humanlike figure moved strangely, […] Read: Russian Bigfoot Caught on Camera? » Categorized as: Almas, Bigfoot, Bigfoot Report, Cryptozoology, Evidence, Pop Culture, Sasquatch, Social Media, Videos, Viral Videos, Yeti | 3 Comments » Wild Thing: Why We Want to Believe Posted by: Craig Woolheater on December 5th, 2018 Bigfoot researchers remain optimistic that Sasquatch is out there; that the creature will one day be found. Why? Why do people continue to believe? We’ll talk to professional skeptic Michael Shermer about the nature of belief. And we’ll look at why—even for those who think Bigfoot is a complete myth—the idea of Bigfoot holds so much appeal. What makes us so fascinated by this creature? Why do we want so badly to believe that it’s out there? Read: Wild Thing: Why We Want to Believe » Categorized as: Bigfoot, Bigfoot Report, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Forensic Science, Podcast, Pop Culture, Sasquatch, Skeptical Discussions | 4 Comments » Saskatchewan Sasquatch Caught on Camera? Posted by: Craig Woolheater on November 7th, 2018 It looks like a bear when on all fours, but then it stands up! Read: Saskatchewan Sasquatch Caught on Camera? » Categorized as: Bigfoot, Bigfoot Report, Cryptozoology, Evidence, Sasquatch, Videos | 5 Comments » Wild Thing: A-C-G-T Spells B-G-F-T Posted by: Craig Woolheater on November 6th, 2018 Everywhere you go, you leave bits of yourself behind and Bigfoot is no different. But now, those DNA droppings are easier than ever to analyze, making it possible to identify a species, even without a body. We’ll talk to Dr. Todd Disotell, a molecular primatologist at NYU and a regular on Spike TV’s $10 Million Bigfoot Bounty, about the magic of DNA analysis and what it might mean for Bigfoot. Read: Wild Thing: A-C-G-T Spells B-G-F-T » Categorized as: 10 Million Dollar Bigfoot Bounty, Bigfoot, Bigfoot Report, Cryptozoology, Evidence, Forensic Science, Podcast, Pop Culture, Sasquatch | Comments Off on Wild Thing: A-C-G-T Spells B-G-F-T Wild Thing: Bob Gimlin Posted by: Craig Woolheater on October 24th, 2018 Bob Gimlin is half of the famous duo that was there that day in 1967, when the Patterson-Gimlin film was shot. Despite years of ridicule and harassment, he stands by his story. Now, fifty years after that fateful day, he sits down to tell us about what happened and the fallout he experienced. Read: Wild Thing: Bob Gimlin » Categorized as: 50th Anniversary Tributes, Bigfoot, Bigfoot Report, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Footprint Evidence, Podcast, Pop Culture, Sasquatch | Comments Off on Wild Thing: Bob Gimlin Wild Thing: The Evidence Posted by: Craig Woolheater on October 16th, 2018 Let’s look at the evidence. There are footprints and sounds, grainy pictures, and the notorious Patterson-Gimlin film—that shaky 1967 video of a big, hairy beast striding through the forest. But how well does it hold up? We hear from a variety of people—the skeptics and the certain—who make their case for what evidence is out there. How much of it stands up to scrutiny? Read: Wild Thing: The Evidence » Categorized as: Bigfoot, Bigfoot Report, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Footprint Evidence, Forensic Science, Podcast, Pop Culture, Sasquatch | 1 Comment » Wild Thing: Distant Relative or Kissing Cousin? Posted by: Craig Woolheater on October 10th, 2018 Just what is Bigfoot? Descendant of ancient apes? Close human ancestor? Evolution might hold the answer to this question. Homo sapiens may rule the planet now but once upon a time, we weren’t the only hominid creatures walking around. Who’s to say that Bigfoot wasn’t—and still isn’t—among us? We talk to evolution experts and anthropologists, including Ian Tattersall, curator at the American Museum of Natural History in New York. Read: Wild Thing: Distant Relative or Kissing Cousin? » Categorized as: Bigfoot, Bigfoot Report, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Forensic Science, Podcast, Pop Culture, Sasquatch | 1 Comment » Wild Thing: Grover Posted by: Craig Woolheater on October 8th, 2018 Laura Krantz is a veteran public radio editor and producer. So how did she end up in the wilds of the Pacific Northwest, eyeballing some giant ground nests… that might have been made by Bigfoot? You can place the blame squarely on the shoulders of a guy named Grover. He was a tenured professor of anthropology at Washington State University and one of world’s preeminent experts on Sasquatch. And it turns out that Grover is also Laura’s long-lost cousin. How could she not do a story about this guy? Read: Wild Thing: Grover » Categorized as: Bigfoot, Bigfoot Report, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Forensic Science, Podcast, Pop Culture, Sasquatch | Comments Off on Wild Thing: Grover var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '803977', Size: '300250'}; « Older Posts | |Top | Content|"
