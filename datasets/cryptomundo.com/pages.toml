full_description = "Archive for the “Lake Monsters” 2018 Ogopogo Footage Posted by: Craig Woolheater on December 21st, 2021 Me and my dad where fishing off a doc in Kelowna BC and spotted something massive in the water. Read: 2018 Ogopogo Footage » Categorized as: Bigfoot Report, Cryptozoology, Evidence, Eyewitness Accounts, Lake Monsters, Ogopogo, Videos | Comments Off on 2018 Ogopogo Footage The Small Town Monsters 2018 Kickstarter Ends this Week Posted by: Seth Breedlove on February 23rd, 2018 Creators of high-quality para-themed entertainment, Small Town Monsters, will be wrapping up the crowdfunding campaign to fund production of their 2018 output this weekend. The campaign is being run through the Kickstarter platform and includes three titles that “STM” will be releasing this year; The Flatwoods Monster: A Legacy of Fear, On the Trail of… Champ (web series), and The Bray Road Beast. Read: The Small Town Monsters 2018 Kickstarter Ends this Week » Categorized as: Champ/Lake Champlain Monster, Crowdsourcing, Cryptid Canids, Cryptid Cinema, Cryptotourism, Cryptozoologists, Cryptozoology, Eyewitness Accounts, Lake Monsters, Movie Monsters, Small Town Monsters | Comments Off on The Small Town Monsters 2018 Kickstarter Ends this Week Hidden Nessie Ranger Posted by: Craig Woolheater on January 31st, 2018 Car manufacturers, among many other entities, have used Nessie and other cryptids to market their products. Check out this promotional photo for the upcoming 2019 Ford Ranger pickup truck. Read: Hidden Nessie Ranger » Categorized as: Bigfoot Report, CryptoConsumerism, Cryptozoology, Lake Monsters, Loch Ness Monster, Photos, Pop Culture | Comments Off on Hidden Nessie Ranger On the Trail of… Champ: Small Town Monsters Kickstarter Launch Posted by: Seth Breedlove on January 12th, 2018 For centuries, tales have been told of a massive, unknown, aquatic creature living in the waters of Lake Champlain. The “beast” is said to be anywhere from ten to thirty feet long with an abnormally long neck, flippers and a dinosaur-like appearance. Sightings of the animal known as Champ reached their peak during the 1970s but history tells of a bizarre “water horse” said to reside in the lake long before the area became inhabited by settlers. Today, Champ is celebrated in local towns and villages along the lake and has even become a mascot for the local minor league baseball team and will soon be the focus of a new documentary series titled On the Trail of… Champ. Read: On the Trail of… Champ: Small Town Monsters Kickstarter Launch » Categorized as: Champ/Lake Champlain Monster, Crowdsourcing, Cryptid Cinema, Cryptozoologists, Cryptozoology, Eyewitness Accounts, Lake Monsters, Small Town Monsters | 1 Comment » On the Trail of… Champ Sets Sail Posted by: Seth Breedlove on September 27th, 2017 From director Aleksandar Petakov and producer Seth Breedlove, comes the first salvo in a new ongoing series from Small Town Monsters titled “On the Trail of…”. The first mini-series will dive into the decades-long history of sightings of the lake monster known as “Champ”, said to inhabit the waters of Vermont and New York’s Lake Champlain. More On the Trail of… series will follow from Small Town Monsters. Read: On the Trail of… Champ Sets Sail » Categorized as: Champ/Lake Champlain Monster, Crowdsourcing, Cryptid Cinema, Cryptozoologists, Cryptozoology, Lake Monsters, Small Town Monsters | Comments Off on On the Trail of… Champ Sets Sail Cryptozoologist Launches Kickstarter Posted by: Seth Breedlove on September 26th, 2017 Bigfoot, dog men, the Tasmanian Tiger, and the Loch Ness Monster—real or not, a new feature-length documentary film “Cryptozoologist” will tell the stories of the passionate researchers searching for the truth. “Cryptozoologist” gives dedicated professional researchers, authors, and adventurers an unbiased platform to tell the history of cryptozoology and share their research and evidence. Read: Cryptozoologist Launches Kickstarter » Categorized as: Bigfoot, Cinema News, Crowdsourcing, Cryptid Canids, Cryptid Cinema, Cryptozoologists, Cryptozoology, Lake Monsters, Loch Ness Monster, Small Town Monsters, Thylacine | Comments Off on Cryptozoologist Launches Kickstarter Hitchhiking Sasquatch Posted by: Craig Woolheater on September 18th, 2017 Once again Toyota is using cryptozoology in advertising Read: Hitchhiking Sasquatch » Categorized as: Bigfoot, Bigfoot Report, CryptoConsumerism, Cryptozoology, Lake Monsters, Loch Ness Monster, Pop Culture, Sasquatch, Television | Comments Off on Hitchhiking Sasquatch The Bray Road Beast Posted by: Seth Breedlove on September 11th, 2017 Just announced at CryptidCon! In autumn, 2018 STM tackles the Bray Road Beast as the first film in the Monsters of the Midwest trilogy. Read: The Bray Road Beast » Categorized as: Champ/Lake Champlain Monster, Cinema News, Cryptid Canids, Cryptid Cinema, Cryptozoologists, Cryptozoology, Eyewitness Accounts, Lake Monsters, Pop Culture, Small Town Monsters | Comments Off on The Bray Road Beast Coast to Coast AM: Shape-Shifting Monsters Posted by: Nick Redfern on September 7th, 2017 Shapeshifters presents a menagerie of otherworldly creatures and half-human monsters, from were-cats to blood-suckers to aliens. Discover legends and lore from around the world and experience first-hand encounters with shape-changing beasts that lurk in the night. Nick Redfern takes you deep into their domain, opening your eyes to paranormal secrets and cryptozoological wonders. Just be sure to keep some silver bullets close at hand. Read: Coast to Coast AM: Shape-Shifting Monsters » Categorized as: Abominable Snowman, Alien Big Cats, Bigfoot, Books, Cryptid Canids, Cryptozoology, Lair of the Beasts, Lake Monsters, Lizard People, Loch Ness Monster, Media Appearances, Mothman, Pop Culture, Sasquatch | Comments Off on Coast to Coast AM: Shape-Shifting Monsters Maine’s first International Crypto Con. Dogmen? Check. Bigfoot? You bet. Posted by: Craig Woolheater on September 2nd, 2017 It starts bright and early with lake monsters and wraps up more than 12 hours later with the first New England screening of “The Mothman of Pleasant Point.” Read: Maine’s first International Crypto Con. Dogmen? Check. Bigfoot? You bet. » Categorized as: 50th Anniversary Tributes, Bigfoot, Bigfoot Report, Conferences, Cryptid Canids, Cryptid Cinema, Cryptotourism, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Folklore, International Cryptozoology Museum, Lake Monsters, Mothman, Museums, Pop Culture, Sasquatch, Sea Monsters, Sea Serpents | Comments Off on Maine’s first International Crypto Con. Dogmen? Check. Bigfoot? You bet. International Cryptozoology Conference Posted by: Craig Woolheater on August 29th, 2017 The International Cryptozoology Conference 2017 (ICC17), presented by the International Cryptozoology Society and International Cryptozoology Museum, will be held in Portland, Maine, on Labor Day Weekend, specifically on Sunday, September 3, 2017. Read: International Cryptozoology Conference » Categorized as: 50th Anniversary Tributes, Bigfoot, Bigfoot Report, Conferences, Cryptid Cinema, Cryptotourism, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Evidence, Eyewitness Accounts, Folklore, International Cryptozoology Museum, Lake Monsters, Mothman, Pop Culture, Sasquatch, Sea Monsters, Sea Serpents | Comments Off on International Cryptozoology Conference Sasquatch Conservation Before Discovery Posted by: Craig Woolheater on August 8th, 2017 On the face of it, cryptozoology has little in common with mainstream conservation. First, it is widely held to be a “pseudoscience”, because it does not follow the scientific methods so central to conservation biology. Many conservation scientists would find the idea of being identified with monsters and monster-hunters embarrassing. Read: Sasquatch Conservation Before Discovery » Categorized as: Bigfoot, Bigfoot Report, Cryptotourism, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Extinct, Lake Monsters, Loch Ness Monster, Pop Culture, Sasquatch | 1 Comment » Happy Sea Serpent Day! Posted by: Craig Woolheater on August 7th, 2017 The far reaches of the ocean are dark and cold and unsettling. Who even knows what creatures lurk in the murky waters of the Northern Atlantic or near the Mariana Trench. Though uncertain, there are certainly things living in these places; unusual sea creatures, with long sinewy bodies and razor sharp teeth; sea serpents. Strange ocean creatures that are the reason for today’s zany holiday, Sea Serpent Day! Read: Happy Sea Serpent Day! » Categorized as: Bigfoot Report, Cryptozoology, Folklore, Lake Monsters, Pop Culture, River Monsters, Sea Monsters, Sea Serpents | 1 Comment » Monsters Among Us Podcast Posted by: Shannon LeGro on June 13th, 2017 Monsters Among Us is a call in show about monsters, and the unexplained. On the latest episode, host Derek Hayes discusses a pair of U.F.O. sightings, a run in with possible MIB’s and yet another mirrored men encounter. New shows released every Thursday evening. Read: Monsters Among Us Podcast » Categorized as: Bigfoot, Chupacabras, Conspiracies, Cryptozoology, Evidence, Eyewitness Accounts, Flying Humanoids, Folklore, Forteana, Into The Fray, Lake Monsters, Mothman, Mystery Cats, Out of Place, Phantom Panthers, Podcast, Pop Culture, River Monsters, Sasquatch, Sea Monsters, Skeptical Discussions, Swamp Monsters, Thunderbirds, Yeren, Yeti, Yowie | 2 Comments » The Loch Ness Monster isn’t dead after all Posted by: Craig Woolheater on May 10th, 2017 This is the moment the fabled Loch Ness Monster was “officially” spotted for the first time this year — bringing more than eight months of uncertainty to an end. Read: The Loch Ness Monster isn’t dead after all » Categorized as: Bigfoot Report, Cryptozoology, Evidence, Lake Monsters, Loch Ness Monster, Photos, Pop Culture | 2 Comments » var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '8