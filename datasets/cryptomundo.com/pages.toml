full_description = "Archive for the “Cryptid Canids” Sinister Swamps: Monsters and Mysteries from the Mire Posted by: Lyle Blackburn on June 17th, 2020 Join me on another exciting journey as I examine legends and sighting reports of strange phenomenon in some of North America’s most notorious swamplands. Read: Sinister Swamps: Monsters and Mysteries from the Mire » Categorized as: Alien Big Cats, Bigfoot, Books, Cryptid Canids, Cryptozoology, Feral People, Living Dinosaurs, Lizard People, Monstro Bizarro, Mystery Cats, River Monsters, Sasquatch, Skunk Apes | Comments Off on Sinister Swamps: Monsters and Mysteries from the Mire The Bray Road Beast Reviewed Posted by: Loren Coleman on September 18th, 2018 It takes you on a trip you never saw coming! Read: The Bray Road Beast Reviewed » Categorized as: Cinema News, Cryptid Canids, Cryptid Cinema, CryptoZoo News, Cryptozoology, Eyewitness Accounts, Small Town Monsters | 1 Comment » The ‘Bray Road Beast’ is coming! Posted by: Lyle Blackburn on August 21st, 2018 The new Small Town Monsters film, The Bray Road Beast, will be let loose on the countryside October 5th! Read: The ‘Bray Road Beast’ is coming! » Categorized as: Cinema News, Cryptid Canids, Cryptid Cinema, Cryptozoology, Eyewitness Accounts, Monstro Bizarro, Small Town Monsters | Comments Off on The ‘Bray Road Beast’ is coming! The Small Town Monsters 2018 Kickstarter Ends this Week Posted by: Seth Breedlove on February 23rd, 2018 Creators of high-quality para-themed entertainment, Small Town Monsters, will be wrapping up the crowdfunding campaign to fund production of their 2018 output this weekend. The campaign is being run through the Kickstarter platform and includes three titles that “STM” will be releasing this year; The Flatwoods Monster: A Legacy of Fear, On the Trail of… Champ (web series), and The Bray Road Beast. Read: The Small Town Monsters 2018 Kickstarter Ends this Week » Categorized as: Champ/Lake Champlain Monster, Crowdsourcing, Cryptid Canids, Cryptid Cinema, Cryptotourism, Cryptozoologists, Cryptozoology, Eyewitness Accounts, Lake Monsters, Movie Monsters, Small Town Monsters | Comments Off on The Small Town Monsters 2018 Kickstarter Ends this Week Cryptozoologist Launches Kickstarter Posted by: Seth Breedlove on September 26th, 2017 Bigfoot, dog men, the Tasmanian Tiger, and the Loch Ness Monster—real or not, a new feature-length documentary film “Cryptozoologist” will tell the stories of the passionate researchers searching for the truth. “Cryptozoologist” gives dedicated professional researchers, authors, and adventurers an unbiased platform to tell the history of cryptozoology and share their research and evidence. Read: Cryptozoologist Launches Kickstarter » Categorized as: Bigfoot, Cinema News, Crowdsourcing, Cryptid Canids, Cryptid Cinema, Cryptozoologists, Cryptozoology, Lake Monsters, Loch Ness Monster, Small Town Monsters, Thylacine | Comments Off on Cryptozoologist Launches Kickstarter Is the Ozenkadnook Tiger a Cardboard Cryptid? Posted by: Karl Shuker on September 12th, 2017 One of cryptozoology’s most iconic images is the so-called Ozenkadnook Tiger Photograph, reproduced below. It depicts a large, seemingly dark-bodied, white-striped Australian mystery beast supposedly snapped in b/w during 1964 by Melbourne-based Rilla Martin while holidaying in Victoria. She had apparently been driving along a dirt track near Ozenkadnook when she saw the creature at the edge of some woods, and after stopping the car she managed to snap a single photo of it before it ran off. Read: Is the Ozenkadnook Tiger a Cardboard Cryptid? » Categorized as: Cryptid Canids, Cryptozoology, Extinct, Eyewitness Accounts, Hoaxes, Photos, ShukerNature, Thylacine, Women in Cryptozoology | 1 Comment » The Bray Road Beast Posted by: Seth Breedlove on September 11th, 2017 Just announced at CryptidCon! In autumn, 2018 STM tackles the Bray Road Beast as the first film in the Monsters of the Midwest trilogy. Read: The Bray Road Beast » Categorized as: Champ/Lake Champlain Monster, Cinema News, Cryptid Canids, Cryptid Cinema, Cryptozoologists, Cryptozoology, Eyewitness Accounts, Lake Monsters, Pop Culture, Small Town Monsters | Comments Off on The Bray Road Beast Coast to Coast AM: Shape-Shifting Monsters Posted by: Nick Redfern on September 7th, 2017 Shapeshifters presents a menagerie of otherworldly creatures and half-human monsters, from were-cats to blood-suckers to aliens. Discover legends and lore from around the world and experience first-hand encounters with shape-changing beasts that lurk in the night. Nick Redfern takes you deep into their domain, opening your eyes to paranormal secrets and cryptozoological wonders. Just be sure to keep some silver bullets close at hand. Read: Coast to Coast AM: Shape-Shifting Monsters » Categorized as: Abominable Snowman, Alien Big Cats, Bigfoot, Books, Cryptid Canids, Cryptozoology, Lair of the Beasts, Lake Monsters, Lizard People, Loch Ness Monster, Media Appearances, Mothman, Pop Culture, Sasquatch | Comments Off on Coast to Coast AM: Shape-Shifting Monsters Maine’s first International Crypto Con. Dogmen? Check. Bigfoot? You bet. Posted by: Craig Woolheater on September 2nd, 2017 It starts bright and early with lake monsters and wraps up more than 12 hours later with the first New England screening of “The Mothman of Pleasant Point.” Read: Maine’s first International Crypto Con. Dogmen? Check. Bigfoot? You bet. » Categorized as: 50th Anniversary Tributes, Bigfoot, Bigfoot Report, Conferences, Cryptid Canids, Cryptid Cinema, Cryptotourism, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Folklore, International Cryptozoology Museum, Lake Monsters, Mothman, Museums, Pop Culture, Sasquatch, Sea Monsters, Sea Serpents | Comments Off on Maine’s first International Crypto Con. Dogmen? Check. Bigfoot? You bet. Picasso of the Paranormal, Jean St. Jean Posted by: Craig Woolheater on May 6th, 2017 In this episode we talk to sculptor, musician, Bigfoot enthusiast, and right down cool guy, Jean St. Jean. Listen in to the ensuing Bigfoot Buffet, and be enthralled at the Sasquatch Smorgasbord. Read: Picasso of the Paranormal, Jean St. Jean » Categorized as: Bigfoot, Bigfoot Report, Cryptid Canids, Cryptoart, Cryptozoology, Podcast, Pop Culture, Replica Cryptia, Sasquatch, Swamp Monsters, Yeti | Comments Off on Picasso of the Paranormal, Jean St. Jean iTF 70 The Dogman Posted by: Shannon LeGro on February 2nd, 2017 Vic Cundiff of Dogman Encounters Radio joins Shannon to talk all about the creature. They have been reported for hundreds of years. They are notoriously aggressive and highly territorial. On this episode, Vic speaks of them coming into people’s homes, their hunting behaviors, frightening physical traits and more. Listen to Vic’s “Dogman Encounters Radio” on YouTube, and find Vic Cundiff on his website, DogmanEncounters.com Read: iTF 70 The Dogman » Categorized as: Bigfoot, Cryptid Canids, Cryptid Tales, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Into The Fray, Men in Cryptozoology, Paranormal Investigators, Podcast, Pop Culture, Sasquatch, Small Town Monsters | 3 Comments » Coast to Coast AM: Cryptids & Strange Entities Posted by: Nick Redfern on January 3rd, 2017 Author Nick Redfern is notorious for digging into secret, classified government and military files. He’ll share the lore and legends, as well as the first-person accounts of bizarre freaks of nature and spine-tingling paranormal entities including werewolves, Bigfoot, the Loch Ness monster, chupacabras, Mothman, the Abominable Snowman, the Mongolian Death Worm and more. Read: Coast to Coast AM: Cryptids & Strange Entities » Categorized as: Abominable Snowman, Alien Big Cats, Avian Mysteries, Bigfoot, Books, Chupacabras, Cryptid Canids, CryptoRadio, Cryptozoologists, Cryptozoology, Expedition Reports, Eyewitness Accounts, Flying Humanoids, Folklore, Giant Cryptid Reptiles, Lair of the Beasts, Lake Monsters, Living Dinosaurs, Lizard People, Loch Ness Monster, Mothman, Mystery Cats, Phantom Panthers, Podcast, Pop Culture, Sasquatch, Sea Monsters, Sea Serpents, Thunderbirds, Winged Weirdies, Yeti | Comments Off on Coast to Coast AM: Cryptids & Strange Entities Remembrance Day for Lost Species Posted by: Craig Woolheater on November 30th, 2016 Not only is today the Remembrance Day for Lost Species, but this year also marked the 80th anniversary of the death of the last known Tasmanian Tiger in captivity, Benjamin. Read: Remembrance Day for Lost Species » Categorized as: Bigfoot Report, Cryptid Canids, Cryptozoology, Extinct, Megafauna, Thylacine, Videos | Comments Off on Remembrance Day for Lost Species Still In Search Of Prehistoric Survivors Posted by: Karl Shuker on November 29th, 2016 It has been 21 years since the original publication back in 1995 of In Search of Prehistoric Survivors, considered by many to be my finest cryptozoological volume. Not surprisingly, then, in subsequent years there has been a growing, persistent clamour among its numerous fans worldwide for me to prepare a new, updated edition. Now, at last, fulfilling a longstanding promise, I have done so – and what an update it is! Read: Still In Search Of Prehistoric Survivors » Categorized as: Avian Mysteries, Books, Cadborosaurus, Champ/Lake Champlain Monster, Coelacanth, Cryptid Canids, Cryptoart, Cryptozoology, Extinct, Eyewitness Accounts, Giant Cryptid Reptiles, Lake Monsters, Living Dinosaurs, Living Fossils, Loch Ness Monster, Mapinguary, Megafauna, Megalodon, Mokele-Mbembe, Mystery Cats, Ogopogo, River Monsters, Sea Monsters, Sea Serpents, ShukerNature, Swamp Monsters, Thunderbirds, Thylacine, Winged Weirdies | Comments Off on Still In Search Of Prehistoric Survivors A Menagerie of Mysterious Beasts Posted by: Ken Gerhard on October 22nd, 2016 My new book (graciously published by Llewellyn) will highlight some of my investigations around the world… Read: A Menagerie of Mysterious Beasts » Categorized as: Bigfoot, Books, Cryptid Canids, Cryptozoologists, Cryptozoology, Eyewitness Accounts, Flying Humanoids, Sasquatch, Texas Monster Hunter | Comments Off on A Menagerie of Mysterious Beasts var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '803977', Size: '300250'}; « Older Posts | |Top | Content|"
