full_description = "Archive for the “Bigfoot’s bLog” Aquatic Cryptid Marathon Posted by: Craig Woolheater on September 29th, 2015 Ogopogo, Bownessie and the Lagarfjlot Worm profiled Wednesday morning. Read: Aquatic Cryptid Marathon » Categorized as: Bigfoot's bLog, Cryptozoology, Evidence, Eyewitness Accounts, Folklore, Lake Monsters, Ogopogo, Pop Culture, Television | Comments Off on Aquatic Cryptid Marathon Bluff Creek Historical Videos Posted by: Steven Streufert on August 5th, 2015 Two classics from Bluff Creek history, to which I’ve added the stabilization from YouTube. I’ve posted these so that they won’t ever disappear from the internet. Read: Bluff Creek Historical Videos » Categorized as: Bigfoot, Bigfoot's bLog, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Footprint Evidence, Sasquatch, Videos | 1 Comment » A Canadian Bestiary Posted by: Nick Redfern on September 8th, 2014 For more than ten years, amateur folklorist Todd H. C. Fischer has researched hundreds of creatures, monsters, strange locales, heroes and spirits from all across Canada, collecting them here, for the first time, in one comprehensive volume. Read: A Canadian Bestiary » Categorized as: Bigfoot, Bigfoot's bLog, Books, Cryptozoology, Evidence, Eyewitness Accounts, Lair of the Beasts, Lake Monsters, Pop Culture, Sasquatch | Comments Off on A Canadian Bestiary Bigfoot and Cryptid Marathon Sunday Posted by: Craig Woolheater on January 5th, 2014 Starting at 4 PM ET today on Destination America there will be a marathon of Bigfoot and Cryptid documentaries. Read: Bigfoot and Cryptid Marathon Sunday » Categorized as: Avian Mysteries, Bigfoot, Bigfoot's bLog, Chupacabras, Cryptid Canids, Cryptozoologists, Cryptozoology, Dover Demon, Evidence, Eyewitness Accounts, Flying Humanoids, Folklore, Momo, Pop Culture, Sasquatch, Swamp Monsters, Television, Winged Weirdies | Comments Off on Bigfoot and Cryptid Marathon Sunday Bluff Creek Trail Camera Survey Project Posted by: Steven Streufert on September 13th, 2012 As a spin-off from the recent successful effort to relocate and document the true site of the Patterson-Gimlin Film Site, the Bluff Creek Film Site Project team is now collaborating to place games cameras on and around the actual site for an over-winter documentary project. This will be an open project, with all results made public upon camera retrieval. And on top of this, you can be a part of it. Read: Bluff Creek Trail Camera Survey Project » Categorized as: Bigfoot, Bigfoot's bLog, Crowdsourcing, Cryptomundo Exclusive, Cryptozoology, Evidence, Expedition Reports, Sasquatch | 23 Comments » Help Save The Bigfoot Discovery Museum! Posted by: Steven Streufert on June 11th, 2012 If a little over four grand isn’t raised by June 29th of this year the world-famous and much beloved Bigfoot Discovery Museum may be closed and sold off on auction. Michael Rugg, the museum proprietor is a very dedicated guy who has put not only his heart and soul into this project, but also his life savings, car and home. He has never charged a dime for admission to one of the best Bigfoot-related collections around, nor for the knowledge he freely dispenses. YOU CAN HELP by donating, buying something, or visiting the place. But do it now, before it is too late. If you ever thought of visiting there, donate something and think of it as an investment in the future. Read: Help Save The Bigfoot Discovery Museum! » Categorized as: Bigfoot, Bigfoot's bLog, Cryptotourism, Cryptozoologists, Cryptozoology, Evidence, Museums, Pop Culture, Sasquatch | Comments Off on Help Save The Bigfoot Discovery Museum! Patterson-Gimlin Bigfoot Film Site Rediscovered! Posted by: Steven Streufert on November 19th, 2011 The Patterson-Gimlin Film Site has been rediscovered! After being “lost” in confusion and multiple theories of its location for decades, The Bluff Creek Film Site Project has followed the disparate evidence and finally documented the site location. We have found the Big Tree, and many other historical landmarks still there on-site, 44 years after the famous Bigfoot film was shot in Northern California. Read: Patterson-Gimlin Bigfoot Film Site Rediscovered! » Categorized as: Bigfoot, Bigfoot's bLog, Breaking News, Cryptotourism, Cryptozoologists, Cryptozoology, Expedition Reports, Photos, Sasquatch | 13 Comments » Finding Bigfoot All Over the Place in Willow Creek Posted by: Steven Streufert on November 12th, 2011 Bigfoot’s bLog: Finding Bigfoot Comes to the Willow Creek area, and Bob Gimlin too… The popular Animal Planet show, Finding Bigfoot, recently invaded our sleepy little mountain town. Willow Creek often bustles with Squatching enthusiasts, but the last month or so has been simply ridiculous. What Mecca is to Islam, what Jerusalem is to those other religions, this place seems to be for Bigfooters. It was a fun time had by all, but also an interesting view into the process of “Reality” TV production. Bob Gimlin, Al Hodgson, Jerry Crew’s sons and many others were there. Read more… Read: Finding Bigfoot All Over the Place in Willow Creek » Categorized as: Bigfoot, Bigfoot's bLog, Cryptotourism, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Finding Bigfoot, Footprint Evidence, Sasquatch, Television | Comments Off on Finding Bigfoot All Over the Place in Willow Creek Willow Creek Celebrates in a Squatchy Way Posted by: Steven Streufert on September 13th, 2011 Every year over the Labor Day weekend the Bigfoot Capital of the World, Willow Creek, California, celebrates the town’s community and the icon that has made a name for it during Bigfoot Days. This year is the fifty-first anniversary of the event. Read: Willow Creek Celebrates in a Squatchy Way » Categorized as: Bigfoot, Bigfoot Report, Bigfoot's bLog, Conferences, Cryptotourism, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Folklore, Photos, Pop Culture, Reviews, Sasquatch | Comments Off on Willow Creek Celebrates in a Squatchy Way Al Hodgson Interview, Rip Lyttle’s Bigfoot Class, Tour of Willow Creek, and More Posted by: Steven Streufert on July 23rd, 2011 BIGFOOT’S BLOG has been taking some time off from blogging, and having some fun on YouTube. Listen to Bigfooting elder, Al Hodgson, walk down the Squatchy streets of Willow Creek, attend Bigfoot University, and all kinds of other fun. Read: Al Hodgson Interview, Rip Lyttle’s Bigfoot Class, Tour of Willow Creek, and More » Categorized as: Bigfoot, Bigfoot Report, Bigfoot's bLog, Books, Finding Bigfoot, Photos, Pop Culture, Sasquatch, Videos | Comments Off on Al Hodgson Interview, Rip Lyttle’s Bigfoot Class, Tour of Willow Creek, and More Conversations with Bigfoot: A Fictional Hoax? Posted by: Steven Streufert on April 21st, 2011 When dealing with issues of “the paranormal” quite often the realms of Fiction and Non-Fiction tend to blur. Sometimes the imagination or wishful thinking precedes Science and verification. At times there is cognitive dissonance where facts, however obvious, are not accepted, as they contradict desired beliefs. Sometimes an oddity comes along that one cannot help but feel is too good, or too strange, to be true. Such is the case, as we’ve found, with a curious little handbound booklet called Conversations with Bigfoot. Not only is this not a true story, it is an implausible one; and Bigfoot’s bLog has found its real author, a novelist residing in Northern California. His name is Jim Dodge. Read: Conversations with Bigfoot: A Fictional Hoax? » Categorized as: Bigfoot, Bigfoot's bLog, Books, Hoaxes, Sasquatch | 9 Comments » Long-Time Bigfooter and Cryptozoologist, Richard “Rip” Lyttle Posted by: Steven Streufert on April 5th, 2011 Periodically, Bigfoot’s bLog conducts lengthy email interviews with prominent and interesting figures in the Bigfooting world, trying to get to the bottom of the personal aspects of The Quest for our favorite Hairy Hominoid. Richard “Rip” Lyttle, originally from Maryland, has spent so much time in the woods, seeking Bigfoot and the elusive, once-“extinct” Ivory-Billed Woodpecker, that his personality and ideas sometimes seem to have blended with the nature of his quarry. Read an excerpt here featuring one of Rip’s Bigfoot encounters. Find links to the full interview and photos here as well. Read: Long-Time Bigfooter and Cryptozoologist, Richard “Rip” Lyttle » Categorized as: Bigfoot, Bigfoot's bLog, Cryptotourism, Cryptozoologists, Cryptozoology, Expedition Reports, Eyewitness Accounts, Ivory-Billed Woodpecker, Sasquatch | Comments Off on Long-Time Bigfooter and Cryptozoologist, Richard “Rip” Lyttle Bigfoot’s bLog: Leroy Blevins, Pareidolia and Blobsquatching in PGF Analysis Posted by: Steven Streufert on March 30th, 2011 The Art of Seeing Something That Isn’t Really There… Read: Bigfoot’s bLog: Leroy Blevins, Pareidolia and Blobsquatching in PGF Analysis » Categorized as: Bigfoot, Bigfoot's bLog, Conspiracies, Cryptozoology, Evidence, Photos, Reviews, Sasquatch | 1 Comment » Bigfoot’s bLog: Bluff Creek Film Site Project, Summation Series Videos Posted by: Steven Streufert on March 9th, 2011 Did you know that the true and exact site of the Patterson-Gimlin Film is a topic of extreme controversy and debate? It may come as a surprise to some, but the site is not absolutely established any longer. It seems odd that such an important spot could apparently be lost to time and fading memories. Read: Bigfoot’s bLog: Bluff Creek Film Site Project, Summation Series Videos » Categorized as: Bigfoot, Bigfoot's bLog, Cryptotourism, Cryptozoology, Expedition Reports, Sasquatch, Videos | 4 Comments » From Bigfoot’s bLog: Argosy and National Wildlife PGF Bigfoot Articles Posted by: Steven Streufert on February 18th, 2011 Hello to all Cryptomundo readers! This is Bigfoot Books calling, from Willow Creek, California, the heart of Bigfoot Country. Steven Streufert, proprietor and Bigfoot investigator and historian, writes the periodically confrontational, humorous, and historically analytical site, Bigfoot’s bLog. We hope the posts you find here on Cryptomundo will lead you from time to time to check out what we do on the homefront, on our own blog site, Bigfoot’s bLog. Read: From Bigfoot’s bLog: Argosy and National Wildlife PGF Bigfoot Articles » Categorized as: Abominable Snowman, Bigfoot, Bigfoot's bLog, Books, Evidence, Expedition Reports, Pop Culture, Sasquatch | 1 Comment » var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '803977', Size: '300250'}; | |Top | Content|"
