full_description = "Bio of John Kirk The author of the award-winning book In the Domain of the Lake Monsters, John Kirk is one of the world’s leading cryptozoological investigators. As president of the British Columbia Scientific Cryptozoology Club (BCSCC), John is part of a team of investigators that have searched for cryptids such as Ogopogo, Sasquatch, Cadborosaurus, black alligators, unknown cameloids, lacustrean cryptids and giant salamanders in the province of British Columbia. The club is scientifically based with a large portion consisting of open-minded academics who feel the existence of new species of animals lying undiscovered is not such a farfetched idea. John is also Editor and Publisher of the BCSCC Quarterly well-known for its balanced approached to the enigma of mystery animals and also author of the club website. John has ventured far afield in his quest for evidence for the mystery animals of the world in many areas of the world including Scotland, the Republic of Cameroon and the Republic of the Congo. In 2001 and one John was part of the Cryptosafari team which investigated reports of an animal called Mokele Mbembe which bears an uncanny resemblance to a sauropod dinosaur. While on this expedition the Cryptosafari team unearthed the first reports of a manlike creature standing over six feet tall, with three toes and fingers which in habits the Cameroon-Congo border region known to locals as the Dodu. Another mystery animal, the Ngoubou, was also described and this animal has features consistent with those a styracosaurus, part of the family of ceratopsians said to have been extinguished from the planet millions of years ago. In addition to his cryptozoological research, John is a keen student of police methodologies and investigation techniques which he feels are very useful in the field of cryptozoological research. Analyzing and then organizing clues and evidentiary materials is an important part of the cryptozoological method and John is keen to share this with other researchers in this field. John has also extensively studied the musculature of the creature in the Patterson film and in 1999 was the first to report specifically on the substantial musculature differences between the creature and a human being which were detailed in the BCSCC Quarterly. It is John’s hope that the day will come when cryptozoological researchers will be at the forefront of using technologies and equipment that are of the cutting edge variety in their search for cryptids. |Top | Content|"
