full_description = "About Cryptomundo We welcome you! Cryptomundo is a place to enjoy the adventures, treks, theories, and wisdom of some of the most respected leaders in the field of Cryptozoology. This is a place for all ages to share, read, see, and learn about the finds and evidence of the most elusive and rare animals (cryptids) on this planet Earth … Bigfoot, Yeti, Chupacabras, Ivory Billed Woodpecker, Nessie, Yowie, and more. Come back often and be part of the community for Cryptozoology breaking news, new views, fun, and yes occasional humor. We’re glad you’re here and look forward to hearing from you soon. The Leaders: Journey with Craig Woolheater off the beaten track and along on his hunts to find the hidden in his blog Bigfoot Report. Email Craig Trek the world of cryptozoology with Loren Coleman’s wit and wisdom in his Cryptomundo blog CryptoZoo News. Email Loren Take the plunge, and swim along with John Kirk as he explores the watery and land-based worlds of unknown animals in his Cryptid Universe. Email John Learn from the adventures documented by Rick Noll in his easy to read blog Bigfoot Hunter. Email Rick Other Contributors: Brent Swancer of Mystery Man’s Menagerie. Email Brent Lyle Blackburn of Monstro Bizarro. Email Lyle Guy Edwards of Bigfoot Lunch Club. Email Guy Steven Struefert of Bigfoot’s bLog. Email Steven Sean Whitley of Bigfoot Movies That Might Have Been. Email Sean David Coleman of The Bigfoot Filmography. Email David Adam Davies of Extreme Expeditions. Email Adam See more engaging, entertaining, authoritative, and educational content here, everyday, on cryptids than any other place on the planet. Join us now. If you would like to contact Cryptomundo with a request, an announcement, or just want to send feedback, you can contact us using the contact form. We love to hear from our readers, so drop us a line! Cryptomundians may also reach us by snail mail @: Cryptomundo, Inc. PMB 421 900 N. Walnut Creek Dr., Suite 100 Mansfield, TX 76063 Email us at editor @ cryptomundo dot com |Top | Content|"
