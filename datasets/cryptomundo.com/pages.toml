full_description = "Archive for the “Bigfoot Hunter” What Does The Press Overseas Think Of Bigfoot And The People Who Search For Them? Posted by: Monster Island News on March 28th, 2014 It is hard to get a good feel for tonight’s BBC documentary “Shooting Bigfoot: America’s Monster Hunters”. At first I was under the impression that it would be a serious program about the Bigfoot phenomena and those of us who try to approach the subject from a scientific point of view. Read: What Does The Press Overseas Think Of Bigfoot And The People Who Search For Them? » Categorized as: Bigfoot, Bigfoot Hunter, Cryptozoologists, Cryptozoology, Men in Cryptozoology, Monster Island News, Pop Culture, Sasquatch, Television | 2 Comments » Beast Hunter Pat Spain Interviewed on Weirld.com Posted by: Craig Woolheater on March 12th, 2011 Looking a bit like Justin Timberlake with an easy grin and an enthusiasm that’s infectious, Pat Spain is a wildlife scientist with a special interest in crypto-zoological creatures, ones that may or may not exist, and he’s traveled the globe to investigate them for the new National Geographic Channel series Beast Hunter, premiering Mar. 4. Having grown up the middle of three kids in Wynantskill, New York and earned his Bachelor of Science from Suffolk University in Boston, Spain created a Web series called Nature Calls in 2005, which ultimately put him on Nat Geo’s radar. “I’m so excited to be doing this and it means a lot that other people are getting interested in it too,” he says. He had a lot more to say in the following conversation. Read: Beast Hunter Pat Spain Interviewed on Weirld.com » Categorized as: Beast Hunter, Bigfoot Hunter, Cadborosaurus, Cryptotourism, Cryptozoologists, Cryptozoology, Expedition Reports, Eyewitness Accounts, Folklore, Forteana, Giant Cryptid Reptiles, Lake Monsters, Living Dinosaurs, Mokele-Mbembe, Orang Pendek, Sea Serpents, Television | 1 Comment » Reported Bigfoot Sightings In Spotsylvania – UPDATE Posted by: Monster Island News on May 27th, 2010 “To me, the sound of hearing this thing was scarier than seeing it. It (the sounds) started with a low rumble and ended in a high-pitch scream.” Read: Reported Bigfoot Sightings In Spotsylvania – UPDATE » Categorized as: Bigfoot, Bigfoot Hunter, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Footprint Evidence | 7 Comments » Reported Bigfoot Sightings Heating Up In Spotsylvania Posted by: Monster Island News on May 26th, 2010 Over the past two years I have been tracking the latest surge of Bigfoot sightings in the Eastern half of the United States. Pennsylvania, North Carolina and West Virginia have been extremely active over the past year. Read: Reported Bigfoot Sightings Heating Up In Spotsylvania » Categorized as: Bigfoot, Bigfoot Hunter, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Footprint Evidence | 1 Comment » Flashback 2005: The Skeptical Inquirer Posted by: Rick Noll on September 13th, 2008 I am fascinated by a variety of topics. I can lose myself to the consternation of others looking for me, blending in with the rows and rows of books on shelves. I recently found a new book on mutants. Read: Flashback 2005: The Skeptical Inquirer » Categorized as: Bigfoot, Bigfoot Hunter, Books, Cryptomundo Exclusive, Cryptozoology, Media Appearances, Pop Culture, Public Forum, Reviews, Sasquatch | 2 Comments » High School Principal Chasing Bigfoot Posted by: Craig Woolheater on July 28th, 2007 David Raygoza shows pictures taken while searching for Bigfoot. (Joe Proudman/The Sentinel) Chasing Bigfoot David Raygoza has heard it all: The sniggers, the jokes, the “crackpot” comments. It doesn’t much faze the high school principal from Fresno as he pursues the passion that has consumed much of his free time for years: Tracking Bigfoot, a […] Read: High School Principal Chasing Bigfoot » Categorized as: Bigfoot, Bigfoot Hunter, Breaking News, Conferences, Cryptotourism, Cryptozoology, Evidence, Eyewitness Accounts, Sasquatch | 5 Comments » Beyond Invention – Cryptozoology Posted by: Rick Noll on May 24th, 2007 Beyond Invention airing on Discovery Science Channel May 25th at 10:00 PM ET. Airing again on May 26th at 1:00 AM, 5:00 AM and 11:00 AM ET. Bigfoot in your backyard? Sea Serpent stalks Fisherman! Extinct Mutant Creature Lives! Believe it or not, these headlines are real! Featuring Rick Noll, Bigfoot Hunter. Read: Beyond Invention – Cryptozoology » Categorized as: Bigfoot, Bigfoot Hunter, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Lake Monsters, Sasquatch, Sea Serpents, Television | 10 Comments » P/G Film Roll #1 versus Roll #2 Posted by: Rick Noll on May 13th, 2007 Just an exercise here but I was thinking about just what was on these two rolls of film. The creature walking along the creeks sand bar is only in 23′ 9 and 1/4″ of a 100′ roll (Bigfoot Times, Danny Perez, Center for Bigfoot Studies, pg.2) and is at the end of that roll. Danny […] Read: P/G Film Roll #1 versus Roll #2 » Categorized as: Bigfoot, Bigfoot Hunter, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Sasquatch | 22 Comments » Where is Bigfoot now? The cycle… Posted by: Rick Noll on May 3rd, 2007 Does it seem that there hasn’t been any good Bigfoot track ways found lately? Have we gotten so good at looking at this type of evidence that the preponderance of new finds have people not wanting to come forward with their pictures, tracks or casts of them? We now can look at these tracks and […] Read: Where is Bigfoot now? The cycle… » Categorized as: Artifacts, Bigfoot, Bigfoot Hunter, Cryptozoology, Evidence, Eyewitness Accounts, Sasquatch | 6 Comments » Ultimate Bigfoot Conference Posted by: Rick Noll on April 26th, 2007 Many things go into setting one of these conferences up, including location, logistics, availability, politics, ideology and entertainment value but I am curious as to what the potential attendees think would make the ultimate line-up of speakers. Doesn’t matter if they are no longer with us…Here is a fun list I would love to see […] Read: Ultimate Bigfoot Conference » Categorized as: Bigfoot, Bigfoot Hunter, Conferences, Cryptotourism, Cryptozoology, Public Forum, Sasquatch | 18 Comments » Sasquatch Niche, How Might Sasquatch Live Posted by: Rick Noll on April 19th, 2007 If Sasquatch had a large sized population, what might we see that we are not now? We would have more sightings and track finds then we do now, forest workers and visitors would be seeing them more. If they numbered as many as black bear we may still not be finding bones but we would […] Read: Sasquatch Niche, How Might Sasquatch Live » Categorized as: Artifacts, Bigfoot, Bigfoot Hunter, Cryptozoology, Evidence, Eyewitness Accounts, Folklore, Fossil Finds, Sasquatch | 35 Comments » Bigfoot Field Note #1***– Part IV Posted by: Rick Noll on February 10th, 2006 Casting Bigfoot tracks in snow is not as difficult as people think or make it out to be. Hardest part is going to be finding them. Sure you can take to surfing the internet and find dozens of sites describing the process using molten sulfur to the adding of a pinch of Potassium Sulfate* and […] Read: Bigfoot Field Note #1***– Part IV » Categorized as: Artifacts, Bigfoot, Bigfoot Hunter, Cryptozoology, Evidence, Forensic Science, Sasquatch | 3 Comments » Bigfoot in Twisp… Part V Posted by: Rick Noll on February 9th, 2006 (Nine Inch Nails – Into The Void) Cliff and Betty invited us to spend the night with them. This is their winter home… 500 feet or so away is their summer home. This one takes less energy to heat so they move over here when the snow comes. We accepted and they took us over […] Read: Bigfoot in Twisp… Part V » Categorized as: Bigfoot Hunter, Cryptozoology, Evidence, Forensic Science, Sasquatch | Comments Off on Bigfoot in Twisp… Part V Bigfoot in Twisp… Part IV Posted by: Rick Noll on February 7th, 2006 (Blur – Jets) The tracks appeared very early on a Saturday morning, January 31, 1976… Dave and I arrived 7 days later. It all began at about 9:00PM the night before though when Betty smelled a terrible odor coming from outside the cabin. Cliff had fallen asleep in front of the TV earlier watching the […] Read: Bigfoot in Twisp… Part IV » Categorized as: Bigfoot, Bigfoot Hunter, Cryptozoology, Evidence, Eyewitness Accounts, Forensic Science, Sasquatch | 5 Comments » Bigfoot in Twisp… Part III Posted by: Rick Noll on February 4th, 2006 (Cracker – Loser) We finally got to the Libby’s place, parked the rambler in the driveway (luckily it had a slight incline to it for restarting purposes if needed) and knocked on their front door. It was nailed shut. We could hear someone inside yell to us to go around out back to the other […] Read: Bigfoot in Twisp… Part III » Categorized as: Bigfoot, Bigfoot Hunter, Cryptozoology, Evidence, Eyewitness Accounts, Forensic Science, Sasquatch | 2 Comments » var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '803977', Size: '300250'}; « Older Posts | |Top | Content|"
