full_description = "Archive for the “Mystery Cats” Sinister Swamps: Monsters and Mysteries from the Mire Posted by: Lyle Blackburn on June 17th, 2020 Join me on another exciting journey as I examine legends and sighting reports of strange phenomenon in some of North America’s most notorious swamplands. Read: Sinister Swamps: Monsters and Mysteries from the Mire » Categorized as: Alien Big Cats, Bigfoot, Books, Cryptid Canids, Cryptozoology, Feral People, Living Dinosaurs, Lizard People, Monstro Bizarro, Mystery Cats, River Monsters, Sasquatch, Skunk Apes | Comments Off on Sinister Swamps: Monsters and Mysteries from the Mire Zanzibar Leopard Captured on Camera, Despite Being Declared Extinct Posted by: Craig Woolheater on June 8th, 2018 The Zanzibar leopard was officially declared extinct 25 years ago, but the classification has been called into question after a wildlife biologist caught the elusive predator on camera. Read: Zanzibar Leopard Captured on Camera, Despite Being Declared Extinct » Categorized as: Alien Big Cats, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Extinct, Mystery Cats, Phantom Panthers, Television | 1 Comment » Extinct or Alive Posted by: Craig Woolheater on June 8th, 2018 What if extinct animals weren’t really extinct? The methods used to declare a species extinct are not as fool proof as people might assume. From eyewitness accounts to last known photographs, there is evidence that suggests some of these creatures are still very much alive in the wild. Read: Extinct or Alive » Categorized as: Alien Big Cats, Bigfoot Report, Cryptozoologists, Cryptozoology, Expedition Reports, Extinct, Mystery Cats, Phantom Panthers, Television, Thylacine | Comments Off on Extinct or Alive Monsters Among Us Podcast Posted by: Shannon LeGro on June 13th, 2017 Monsters Among Us is a call in show about monsters, and the unexplained. On the latest episode, host Derek Hayes discusses a pair of U.F.O. sightings, a run in with possible MIB’s and yet another mirrored men encounter. New shows released every Thursday evening. Read: Monsters Among Us Podcast » Categorized as: Bigfoot, Chupacabras, Conspiracies, Cryptozoology, Evidence, Eyewitness Accounts, Flying Humanoids, Folklore, Forteana, Into The Fray, Lake Monsters, Mothman, Mystery Cats, Out of Place, Phantom Panthers, Podcast, Pop Culture, River Monsters, Sasquatch, Sea Monsters, Skeptical Discussions, Swamp Monsters, Thunderbirds, Yeren, Yeti, Yowie | 2 Comments » Coast to Coast AM: Cryptids & Strange Entities Posted by: Nick Redfern on January 3rd, 2017 Author Nick Redfern is notorious for digging into secret, classified government and military files. He’ll share the lore and legends, as well as the first-person accounts of bizarre freaks of nature and spine-tingling paranormal entities including werewolves, Bigfoot, the Loch Ness monster, chupacabras, Mothman, the Abominable Snowman, the Mongolian Death Worm and more. Read: Coast to Coast AM: Cryptids & Strange Entities » Categorized as: Abominable Snowman, Alien Big Cats, Avian Mysteries, Bigfoot, Books, Chupacabras, Cryptid Canids, CryptoRadio, Cryptozoologists, Cryptozoology, Expedition Reports, Eyewitness Accounts, Flying Humanoids, Folklore, Giant Cryptid Reptiles, Lair of the Beasts, Lake Monsters, Living Dinosaurs, Lizard People, Loch Ness Monster, Mothman, Mystery Cats, Phantom Panthers, Podcast, Pop Culture, Sasquatch, Sea Monsters, Sea Serpents, Thunderbirds, Winged Weirdies, Yeti | Comments Off on Coast to Coast AM: Cryptids & Strange Entities Still In Search Of Prehistoric Survivors Posted by: Karl Shuker on November 29th, 2016 It has been 21 years since the original publication back in 1995 of In Search of Prehistoric Survivors, considered by many to be my finest cryptozoological volume. Not surprisingly, then, in subsequent years there has been a growing, persistent clamour among its numerous fans worldwide for me to prepare a new, updated edition. Now, at last, fulfilling a longstanding promise, I have done so – and what an update it is! Read: Still In Search Of Prehistoric Survivors » Categorized as: Avian Mysteries, Books, Cadborosaurus, Champ/Lake Champlain Monster, Coelacanth, Cryptid Canids, Cryptoart, Cryptozoology, Extinct, Eyewitness Accounts, Giant Cryptid Reptiles, Lake Monsters, Living Dinosaurs, Living Fossils, Loch Ness Monster, Mapinguary, Megafauna, Megalodon, Mokele-Mbembe, Mystery Cats, Ogopogo, River Monsters, Sea Monsters, Sea Serpents, ShukerNature, Swamp Monsters, Thunderbirds, Thylacine, Winged Weirdies | Comments Off on Still In Search Of Prehistoric Survivors Coast to Coast AM: Mysterious Cryptids Posted by: Ken Gerhard on October 21st, 2016 Cryptozoologist Ken Gerhard, who has traveled around the world searching for evidence of mysterious animals, discussed a wide variety of creatures including Bigfoot, the Loch Ness Monster, chupacabras, flying creatures, werewolves, lizard men, giant spiders, the Minnesota Iceman, and the Texas T. rex. Read: Coast to Coast AM: Mysterious Cryptids » Categorized as: Bigfoot, Books, Chupacabras, Cryptid Canids, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Flying Humanoids, Folklore, Giant Cryptid Reptiles, Lake Monsters, Living Dinosaurs, Loch Ness Monster, Media Appearances, Men in Cryptozoology, Minnesota Iceman, Mothman, Mystery Cats, Pop Culture, Sasquatch, Sea Monsters, Sea Serpents, Skunk Apes, Swamp Monsters, Texas Monster Hunter, Thunderbirds, Winged Weirdies | Comments Off on Coast to Coast AM: Mysterious Cryptids Texas Bigfoot Conference Swag Posted by: Craig Woolheater on September 4th, 2016 Michael and Diana Esordi of googz & co have designed and created some really cool merchandise for the upcoming 15th Anniversary Texas Bigfoot Conference coming up October 15th in Jefferson, TX. Read: Texas Bigfoot Conference Swag » Categorized as: Alien Big Cats, Bigfoot, Bigfoot Report, Conferences, Cryptotourism, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Evidence, Expedition Reports, Eyewitness Accounts, Flying Humanoids, Folklore, Footprint Evidence, Forensic Science, Mothman, Mystery Cats, Phantom Panthers, Pop Culture, Sasquatch, Swamp Monsters, Winged Weirdies, Yeti | 1 Comment » 15th Anniversary Texas Bigfoot Conference Updates Posted by: Craig Woolheater on June 10th, 2016 The Texas Bigfoot Research Center celebrates the 15th anniversary of the Original Texas Bigfoot Conference held on September 15, 2001 with this year’s event to be held the weekend of October 14-16, 2016. This is the official Texas Bigfoot Weekend as proclaimed by the mayor of Jefferson in 2005. Read: 15th Anniversary Texas Bigfoot Conference Updates » Categorized as: Alien Big Cats, Bigfoot, Bigfoot Report, Books, Conferences, Cryptotourism, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Evidence, Expedition Reports, Eyewitness Accounts, Festivals, Flying Humanoids, Folklore, Footprint Evidence, Forensic Science, Mothman, Mystery Cats, Phantom Panthers, Pop Culture, Sasquatch, Swamp Monsters, Winged Weirdies, Yeti | Comments Off on 15th Anniversary Texas Bigfoot Conference Updates Eastern Mountain Lions May Be Extinct, but Locals Still See Them Posted by: Craig Woolheater on September 1st, 2015 Wildlife officials say they think sightings in the East have been Western cougars that wandered eastward, freed pets or a Florida panther. Read: Eastern Mountain Lions May Be Extinct, but Locals Still See Them » Categorized as: Alien Big Cats, Bigfoot, Bigfoot Report, Cryptozoology, Evidence, Eyewitness Accounts, Footprint Evidence, Mystery Cats, Out of Place, Phantom Panthers | 9 Comments » A Manifestation of Monsters Posted by: Karl Shuker on July 17th, 2015 Exclusive!! Here, making its official public debut, is the front cover for my latest, 22nd book, A Manifestation of Monsters, to be published in September. Read: A Manifestation of Monsters » Categorized as: Bigfoot, Books, Coelacanth, Cryptozoologists, Cryptozoology, Flying Humanoids, Lake Monsters, Living Dinosaurs, Men in Cryptozoology, Mothman, Mystery Cats, Sasquatch, Sea Monsters, Sea Serpents, Winged Weirdies | Comments Off on A Manifestation of Monsters Michigan Police Look for Horse-Killing Sasquatch or Big Cat Posted by: Craig Woolheater on June 12th, 2015 Police and wildlife officials in Sanilac County, Michigan, are warning residents to lock up their pets and livestock and keep their children indoors until they determine what kind of large creature or animal killed a 1,200 pound horse in broad daylight. In this part of Michigan known as “the Thumb,” locals fear the killer could be anything from a coyote to a cougar to a Sasquatch. Read: Michigan Police Look for Horse-Killing Sasquatch or Big Cat » Categorized as: Alien Big Cats, Bigfoot, Bigfoot Report, Cryptozoology, Folklore, Mystery Cats, Phantom Panthers, Sasquatch | 2 Comments » The Beast of Bladenboro Posted by: Nick Redfern on June 10th, 2015 “Although many eye-witnesses described the animal as looking like a black leopard, there were some who said it was more akin to a sleek-looking bear. Adding to the confusion, the tracks of the creature were said to be dog-like, rather than feline in appearance.” Read: The Beast of Bladenboro » Categorized as: Alien Big Cats, Cryptozoology, Eyewitness Accounts, Lair of the Beasts, Mystery Cats, Phantom Panthers | 1 Comment » Marsupial Sabre-Tooths, Queensland Tigers, Blue Mountains Lions, and a Most Elusive Crypto-Cutting Posted by: Karl Shuker on June 8th, 2015 In 1980, a very popular television series screened in the UK was Arthur C. Clarke’s Mysterious World, produced by Yorkshire TV, in which the renowned, eponymous science-fiction writer presented a wide range of unexplained phenomena. Four episodes in this series were devoted to cryptozoological subjects. One of these dealt with sea monsters, one with lake monsters, one with man-beasts, and one with a wide assortment of other mystery creatures – including giant snakes, the king cheetah, the New Guinea dragon, the mokele-mbembe, and the thylacine or Tasmanian wolf Thylacinus cycnocephalus. Read: Marsupial Sabre-Tooths, Queensland Tigers, Blue Mountains Lions, and a Most Elusive Crypto-Cutting » Categorized as: Alien Big Cats, Cryptozoologists, Cryptozoology, Extinct, Eyewitness Accounts, Mystery Cats, Pop Culture, ShukerNature, Television, Thylacine | Comments Off on Marsupial Sabre-Tooths, Queensland Tigers, Blue Mountains Lions, and a Most Elusive Crypto-Cutting From Bigfoot to big cats: What’s rumored to be hiding in Alabama’s woods? Posted by: Craig Woolheater on June 3rd, 2015 Bigfoot is, of course, the most well-known and widespread strange creature, and reported sightings of the large apelike beast aren’t unheard of in Alabama. They’re common enough that a man named Jim Smith created the Alabama Bigfoot Society, and the group’s website tracks recent sighting reports. One from January near Lake Guntersville, when a woman and her young son were reportedly trapped in a deer stand by a Bigfoot-like creature. Read: From Bigfoot to big cats: What’s rumored to be hiding in Alabama’s woods? » Categorized as: Bigfoot, Bigfoot Report, Cryptozoology, Evidence, Eyewitness Accounts, Folklore, Mystery Cats, Phantom Panthers, Pop Culture, Sasquatch, Skunk Apes, Television | 1 Comment » var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '803977', Size: '300250'}; « Older Posts | |Top | Content|"
