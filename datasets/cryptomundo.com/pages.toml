full_description = "Archive for the “Cryptid Universe” New Ogopogo Video Posted by: John Kirk on July 24th, 2016 On July 11th a group of hikers from Calgary were in the Paul’s Tomb area when they spotted something in Okanagan Lake. They recorded the object briefly. Whatever it is, appears to be below the surface. Read: New Ogopogo Video » Categorized as: Cryptid Universe, Cryptozoology, Evidence, Eyewitness Accounts, Lake Monsters, Videos | 7 Comments » Rememberances of Rene Dahinden Posted by: John Kirk on April 18th, 2016 It was a truly sad day 15 years ago when I learned that my great friend Rene Dahinden had succumbed to cancer. Read: Rememberances of Rene Dahinden » Categorized as: Bigfoot, Cryptid Universe, Cryptozoologists, Cryptozoology, Men in Cryptozoology, Obituaries, Sasquatch | 1 Comment » Not Nessie, It’s the River Tay Monster Posted by: John Kirk on September 4th, 2015 There is a long history of the River Tay cryptid. It has nothing whatsoever to do with the Loch Ness Monster. This is a separate entity that rises to the surface occasionally. There is footage of a similar animal here Read: Not Nessie, It’s the River Tay Monster » Categorized as: Cryptid Universe, Cryptozoology, Evidence, Eyewitness Accounts, Lake Monsters, Loch Ness Monster, Photos, Pop Culture, River Monsters, Videos | 6 Comments » Mysterious Moose in Okanagan Posted by: John Kirk on July 7th, 2015 Witness and news anchors make comparison to Ogopogo… Read: Mysterious Moose in Okanagan » Categorized as: Cryptid Universe, Cryptozoology, Evidence, Eyewitness Accounts, Lake Monsters, Ogopogo, Pop Culture, Television, Videos | 5 Comments » Beyond the Edge Radio: John Kirk Posted by: John Kirk on March 22nd, 2015 Tonight at 7 PM Central 3/22/2015 John Kirk III Cryptozoologist Author and President of the British Columbia Scientific Cryptozoology Club Read: Beyond the Edge Radio: John Kirk » Categorized as: Bigfoot, Cadborosaurus, Cryptid Universe, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Lake Monsters, Men in Cryptozoology, Mokele-Mbembe, Ogopogo, Podcast, Pop Culture, Sasquatch | Comments Off on Beyond the Edge Radio: John Kirk Discovering Cadborosaurus Posted by: John Kirk on February 12th, 2015 As of today Cryptomundians will be able to order the long awaited Discovering Cadborosaurus by Paul LeBlond, John Kirk and Jason Walton from Hancock House books. Read: Discovering Cadborosaurus » Categorized as: Books, Cadborosaurus, Cryptid Universe, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Lake Monsters, Sea Monsters | 3 Comments » Tree Twists = Sasquatch? Posted by: John Kirk on February 4th, 2015 Thomas Steenburg weighs in on purported Sasquatch evidence Read: Tree Twists = Sasquatch? » Categorized as: Bigfoot, Cryptid Universe, Cryptozoologists, Cryptozoology, Evidence, Footprint Evidence, Sasquatch | Comments Off on Tree Twists = Sasquatch? Top 10 Mystery Animals of Africa Posted by: John Kirk on January 11th, 2015 Over the years my friends and I who have combed the rivers, swamps and savannahs of Africa in search of animals that remain elusive to this day. My great friend Bill Gibbons has compiled his top ten list of animals that are sometimes so dangerous to approach that doing so would be absolute folly. Read: Top 10 Mystery Animals of Africa » Categorized as: Cryptid Universe, Cryptozoologists, Cryptozoology, Expedition Reports, Mokele-Mbembe, Videos | 6 Comments » Big Foot Exists: An interview with Thomas Steenburg Posted by: John Kirk on December 11th, 2014 Thomas Steenburg is a very close old friend and a colleague in the field of sasquatch field research. When Thomas talks, people listen. He is sagacious and circumspect in what he says and his dialogues are often laced with a high degree of intelligent skepticism and wisdom. A few days ago, Thomas made a rare appearance on internet radio. Read: Big Foot Exists: An interview with Thomas Steenburg » Categorized as: Bigfoot, Cryptid Universe, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Podcast, Sasquatch | Comments Off on Big Foot Exists: An interview with Thomas Steenburg Happy 47th Patty! Posted by: John Kirk on October 20th, 2014 Today is the 47th anniversary of the Patterson-Gimlin film. Read: Happy 47th Patty! » Categorized as: Bigfoot, Cryptid Universe, Cryptozoologists, Cryptozoology, Photos, Pop Culture, Sasquatch | Comments Off on Happy 47th Patty! Talking Bigfoot in Texas Posted by: John Kirk on September 29th, 2014 Read: Talking Bigfoot in Texas » Categorized as: Bigfoot, Bigfoot Report, Conferences, Cryptid Universe, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Evidence, Expedition Reports, Eyewitness Accounts, Sasquatch | Comments Off on Talking Bigfoot in Texas Searching for Sasquatch Posted by: John Kirk on September 27th, 2014 One club’s 25-year quest around a B.C. resort town Every few weeks, members of the B.C. Scientific Cryptozoology Club head into the wooded hills around this resort town – pins on their backpacks reading “Sasquatch research” – looking for proof of something that few people think is there. For a quarter century, the club’s hobbyists, scientists and other laymen have passed through Harrison Hot Springs and continued the search they have mounted for longer than any other group in Canada. Read: Searching for Sasquatch » Categorized as: Bigfoot, Cryptid Universe, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Folklore, Pop Culture, Sasquatch | 1 Comment » Update: Yakima Bigfoot Round-Up 2014 Posted by: John Kirk on September 19th, 2014 The Yakima Bigfoot Round-up 2014 presented by the Friends of Bob Gimlin and the Yakima Valley Museum begins just three weeks from today and the excitement is building to fever pitch now! Read: Update: Yakima Bigfoot Round-Up 2014 » Categorized as: Bigfoot, Conferences, Cryptid Universe, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Evidence, Eyewitness Accounts, Finding Bigfoot, Folklore, Footprint Evidence, Museums, Pop Culture, Sasquatch | Comments Off on Update: Yakima Bigfoot Round-Up 2014 Bownessie Captured on Photo? Posted by: John Kirk on September 12th, 2014 Photographer Ellie Williams captured this amazing image of what she believes to be a creature from the deep while taking snaps in the Lake District. The 24-year-old had set up her camera tripod to automatically take photos throughout the day at Windermere. Read: Bownessie Captured on Photo? » Categorized as: Cryptid Universe, Cryptozoology, Evidence, Lake Monsters, Loch Ness Monster, Photos | 6 Comments » Attenborough Reveals Yeti Ambition Posted by: Craig Woolheater on September 5th, 2014 I love his nature programs. He’s eighty something, but the Yeti remains on the list of creatures he wants to find. What a guy! Read: Attenborough Reveals Yeti Ambition » Categorized as: Abominable Snowman, Cryptid Universe, Cryptozoology, Evidence, Pop Culture, Yeti | Comments Off on Attenborough Reveals Yeti Ambition var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '803977', Size: '300250'}; « Older Posts | |Top | Content|"
