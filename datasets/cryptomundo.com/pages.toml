full_description = "Archive for the “Lizard People” Sinister Swamps: Monsters and Mysteries from the Mire Posted by: Lyle Blackburn on June 17th, 2020 Join me on another exciting journey as I examine legends and sighting reports of strange phenomenon in some of North America’s most notorious swamplands. Read: Sinister Swamps: Monsters and Mysteries from the Mire » Categorized as: Alien Big Cats, Bigfoot, Books, Cryptid Canids, Cryptozoology, Feral People, Living Dinosaurs, Lizard People, Monstro Bizarro, Mystery Cats, River Monsters, Sasquatch, Skunk Apes | Comments Off on Sinister Swamps: Monsters and Mysteries from the Mire Lizard Man Festival, June 8-10 Posted by: Lyle Blackburn on May 23rd, 2018 I’ll be doing a presentation and book signing at the upcoming Lizard Man Festival in Bishopville, South Carolina. It’s a new cryptid event debuting this year! Read: Lizard Man Festival, June 8-10 » Categorized as: Cryptotourism, Cryptozoology, Festivals, Lizard People, Monstro Bizarro, Small Town Monsters, Swamp Monsters | 1 Comment » Coast to Coast AM: Shape-Shifting Monsters Posted by: Nick Redfern on September 7th, 2017 Shapeshifters presents a menagerie of otherworldly creatures and half-human monsters, from were-cats to blood-suckers to aliens. Discover legends and lore from around the world and experience first-hand encounters with shape-changing beasts that lurk in the night. Nick Redfern takes you deep into their domain, opening your eyes to paranormal secrets and cryptozoological wonders. Just be sure to keep some silver bullets close at hand. Read: Coast to Coast AM: Shape-Shifting Monsters » Categorized as: Abominable Snowman, Alien Big Cats, Bigfoot, Books, Cryptid Canids, Cryptozoology, Lair of the Beasts, Lake Monsters, Lizard People, Loch Ness Monster, Media Appearances, Mothman, Pop Culture, Sasquatch | Comments Off on Coast to Coast AM: Shape-Shifting Monsters Agencies advise on possible ‘Lizard Man,’ ‘Bigfoot’ sightings in South Carolina during eclipse Posted by: Craig Woolheater on August 21st, 2017 “SCEMD does not know if Lizardmen become more active during a solar eclipse,” the agency explains. “But we advise that residents of Lee and Sumter counties should remain ever vigilant.” Read: Agencies advise on possible ‘Lizard Man,’ ‘Bigfoot’ sightings in South Carolina during eclipse » Categorized as: Bigfoot, Bigfoot Report, Cryptozoology, Eyewitness Accounts, Giant Cryptid Reptiles, Lizard People, Pop Culture, Sasquatch, Social Media | Comments Off on Agencies advise on possible ‘Lizard Man,’ ‘Bigfoot’ sightings in South Carolina during eclipse Are Lizard Men Hairless Sasquatches? Posted by: Ken Gerhard on January 25th, 2017 What do you think? Read: Are Lizard Men Hairless Sasquatches? » Categorized as: Bigfoot, Cryptozoologists, Cryptozoology, Eyewitness Accounts, Lizard People, Sasquatch, Texas Monster Hunter | 1 Comment » Coast to Coast AM: Cryptids & Strange Entities Posted by: Nick Redfern on January 3rd, 2017 Author Nick Redfern is notorious for digging into secret, classified government and military files. He’ll share the lore and legends, as well as the first-person accounts of bizarre freaks of nature and spine-tingling paranormal entities including werewolves, Bigfoot, the Loch Ness monster, chupacabras, Mothman, the Abominable Snowman, the Mongolian Death Worm and more. Read: Coast to Coast AM: Cryptids & Strange Entities » Categorized as: Abominable Snowman, Alien Big Cats, Avian Mysteries, Bigfoot, Books, Chupacabras, Cryptid Canids, CryptoRadio, Cryptozoologists, Cryptozoology, Expedition Reports, Eyewitness Accounts, Flying Humanoids, Folklore, Giant Cryptid Reptiles, Lair of the Beasts, Lake Monsters, Living Dinosaurs, Lizard People, Loch Ness Monster, Mothman, Mystery Cats, Phantom Panthers, Podcast, Pop Culture, Sasquatch, Sea Monsters, Sea Serpents, Thunderbirds, Winged Weirdies, Yeti | Comments Off on Coast to Coast AM: Cryptids & Strange Entities Monster Men: Lyle Blackburn Posted by: Lyle Blackburn on December 1st, 2016 Check out the new video episode of Monster Men… I talk with the guys about my new Monstro Bizarro book, the Boggy Creek Monster documentary, and more! Read: Monster Men: Lyle Blackburn » Categorized as: Bigfoot, Books, Chupacabras, Cryptid Cinema, Cryptozoologists, Cryptozoology, Jersey Devil, Lizard People, Mokele-Mbembe, Monstro Bizarro, Movie Monsters, Museums, Podcast, Pop Culture, Replica Cryptia, Sasquatch, Small Town Monsters, Swamp Monsters, Television, Videos | Comments Off on Monster Men: Lyle Blackburn Coast to Coast AM: Monsters Among Us Posted by: Craig Woolheater on October 21st, 2016 Researcher and monster investigator Linda Godfrey will discuss her strange creature investigations and the bizarre discoveries associated with them. She’ll talk about such cases as Wolfmen that glow blue, a black furred creature that preys on deer, and even a woman that transforms into a hooded beast in a church. Read: Coast to Coast AM: Monsters Among Us » Categorized as: Bigfoot, Cryptid Canids, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Folklore, Footprint Evidence, Lizard People, Pop Culture, Sasquatch | Comments Off on Coast to Coast AM: Monsters Among Us Monsters Among Us Posted by: Craig Woolheater on September 28th, 2016 Have you ever seen something you couldn’t explain? Read: Monsters Among Us » Categorized as: Bigfoot, Bigfoot Report, Books, Cryptid Canids, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Footprint Evidence, Lizard People, Pop Culture, Sasquatch | Comments Off on Monsters Among Us Lizard Man Photographed? Posted by: Craig Woolheater on September 23rd, 2016 Cryptomundo received an anonymous photo submission of a strange being that appears to be bipedal. It was purported to have been taken in the US is all we know. Is it the mysterious Lizard Man? Read: Lizard Man Photographed? » Categorized as: Bigfoot Report, Cryptomundo Exclusive, Cryptozoology, Evidence, Lizard People, Photos | 7 Comments » Lyle Blackburn: Beyond Reality Posted by: Lyle Blackburn on August 23rd, 2016 I’ll be on Beyond Reality Radio tonight at 12:15am EST. Read: Lyle Blackburn: Beyond Reality » Categorized as: Bigfoot, Books, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Folklore, Lizard People, Media Appearances, Men in Cryptozoology, Monstro Bizarro, Podcast, Pop Culture, Sasquatch, Swamp Monsters | Comments Off on Lyle Blackburn: Beyond Reality Monstro Bizarro Posted by: Craig Woolheater on August 23rd, 2016 All the cryptozoological marvels are here, including Bigfoot, Yeti, the Loch Ness Monster and Chupacabra, along with lesser known monsters like Ogopogo, the Mongolian Death Worm, Jersey Devil, Boggy Creek Monster, Momo, Mokele-Mbembe, Real Wolfmen and many more! Read: Monstro Bizarro » Categorized as: Avian Mysteries, Bigfoot, Books, Chupacabras, Cryptid Canids, Cryptid Cinema, Cryptotourism, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Folklore, Footprint Evidence, Jersey Devil, Lake Monsters, Living Dinosaurs, Lizard People, Loch Ness Monster, Momo, Monstro Bizarro, Mothman, Museums, Ogopogo, Pop Culture, Replica Cryptia, Sasquatch, Sea Monsters, Sea Serpents, Skunk Apes, Swamp Monsters, Television, Winged Weirdies, Yeti | Comments Off on Monstro Bizarro What the Fouke? Posted by: Craig Woolheater on June 10th, 2016 A Skeptical discussion of the Boggy Creek Monster with Lyle Blackburn on the MonsterTalk podcast. Read: What the Fouke? » Categorized as: Bigfoot, Bigfoot Report, Books, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Folklore, Footprint Evidence, Lizard People, Men in Cryptozoology, Podcast, Pop Culture, Sasquatch, Skeptical Discussions, Swamp Monsters | Comments Off on What the Fouke? Sonic Cryptids Posted by: Craig Woolheater on June 2nd, 2016 Read: Sonic Cryptids » Categorized as: Abominable Snowman, Bigfoot, Bigfoot Report, CryptoConsumerism, Cryptozoology, Lizard People, Pop Culture, Replica Cryptia, Sasquatch, Sea Monsters, Yeti | Comments Off on Sonic Cryptids Free Frogman Friday! Posted by: Craig Woolheater on April 29th, 2016 The Loveland Frogman? Read: Free Frogman Friday! » Categorized as: Bigfoot, Bigfoot Report, Books, Cryptofiction, Cryptozoologists, Cryptozoology, Lizard People, Merbeings, Pop Culture, Sasquatch | Comments Off on Free Frogman Friday! var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '803977', Size: '300250'}; « Older Posts | |Top | Content|"
