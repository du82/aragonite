 1 Comment » Bigfoot starring Peter Mayhew Posted by: Sean Whitley on January 6th, 2011 While shooting “Return of the Jedi” in the redwood forests of Northern California, Peter Mayhew, the seven foot, three inch actor who portrayed Chewbacca the Wookiee, was warned not to walk off set in costume for fear of being shot by hunters. “Remember, this is Bigfoot country,” he was told by concerned crew members. Read: Bigfoot starring Peter Mayhew » Categorized as: Bigfoot, Bigfoot Movies That Might Have Been, Bigfoot Report, Cryptofiction, Cryptozoology, Movie Monsters, Pop Culture, Sasquatch | 4 Comments » Danny Vail’s remake of The Legend of Boggy Creek Posted by: Sean Whitley on March 24th, 2010 For the uninitiated, 1972’s The Legend of Boggy Creek is a drive-in classic about the legend of Arkansas’ Fouke Monster. Its theatrical and drive-in run, and its subsequent airings on broadcast and cable television throughout the 1970s and 80s, garnered the film a large cult following. Like a lot of cult films of its era, a remake of “LOBC” has been rumored for years. However, there was only one official attempt to remake the movie and Ohio-based filmmaker Danny Vail was at its helm from 2002-2005. Read: Danny Vail’s remake of The Legend of Boggy Creek » Categorized as: Bigfoot, Bigfoot Movies That Might Have Been, Bigfoot Report, Cinema News, Cryptid Cinema, Cryptomundo Exclusive, Guest Blog, Movie Monsters, Pop Culture, Sasquatch, Swamp Monsters | 4 Comments » The Bigfoot Movies That Might Have Been: An Intro Posted by: Sean Whitley on March 23rd, 2010 For every movie that gets made, there are hundreds more that don’t. Over the last few years, I’ve come into contact with a number of filmmakers who tried to get feature films about Bigfoot made, but for several reasons, these projects never ended up never seeing the light of day. Some didn’t progress beyond the scripting stage, while others saw financing fall through before production began. Read: The Bigfoot Movies That Might Have Been: An Intro » Categorized as: Bigfoot, Bigfoot Movies That Might Have Been, Bigfoot Report, Cinema News, Cryptomundo Exclusive, Guest Blog, Movie Monsters, Pop Culture, Sasquatch, Swamp Monsters | 6 Comments » var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '803977', Size: '300250'}; | |Top | Content|"
