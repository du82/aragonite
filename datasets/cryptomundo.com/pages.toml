full_description = '''Why Dan Aykroyd Is ‘All In’ On Bigfoot Posted by: Craig Woolheater on September 13th, 2019 Joe Rogen and Dan Aykroyd talk Bigfoot. About Craig Woolheater Co-founder of Cryptomundo in 2005. I have appeared in or contributed to the following TV programs, documentaries and films: OLN's Mysterious Encounters: "Caddo Critter", Southern Fried Bigfoot, Travel Channel's Weird Travels: "Bigfoot", History Channel's MonsterQuest: "Swamp Stalker", The Wild Man of the Navidad, Destination America's Monsters and Mysteries in America: Texas Terror - Lake Worth Monster, Animal Planet's Finding Bigfoot: Return to Boggy Creek and Beast of the Bayou. Email • Facebook • Twitter • Pinterest • Instagram • This entry was posted on Friday, September 13th, 2019 at 8:29 am and is filed under Bigfoot, Bigfoot Report, Cryptozoology, Podcast, Pop Culture, Sasquatch. You can follow responses via our RSS 2.0 feed. Both comments and pings are currently closed. Facebook Google+ Twitter Pinterest Email Print Delicious Digg Fark Google Instapaper LinkedIn MySpace Newsvine Pocket Readability Reddit StumbleUpon Tumblr Yahoo! Related Posts Scientist Claims He Solved the Mystery of Bigfoot It’s a Giant! CryptoConspiracy? Sasquatch Discovered: The Biography of Dr. John Bindernagel Bang! Zoom! To The Moon! Momo Is Here! One Response to “Why Dan Aykroyd Is ‘All In’ On Bigfoot” norman-uk responds: September 28th, 2019 at 6:29 am Interesting discussion ! But a bit out of date as it is clear that there were many different early types of hominids. Some very large like gigantopithicus and now there is another possible contender Denisovan man. Of which a very large tooth has been found. Scientists are now working on proteins in fossils where there is no dna with some success, which is promising to reveal the stature (Morphology) of the source. Which I am hoping will be some form of relic hominid and at least confirm one of the many reports from all over the world of huge smelly gorilla like creatures. I’m like jeff meldrum who reportedly would cut off a finger if this would prove the existence of Bigfoot, sasquatch yowie etc- if there are any left. Based on science of course which to my mind is not doing its job at he moment. Sorry. Comments have been closed. |Top | Content|'''
