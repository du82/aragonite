Is Here! » Categorized as: Bigfoot, Books, Cryptozoology, Momo, Monstro Bizarro, Napes, Sasquatch | 1 Comment » New Book Coming Soon… Momo! Posted by: Lyle Blackburn on January 30th, 2019 Join me on a strange and spooky journey as I examine one of the greatest monster tales to ever rise from the hills and hollers of the American Midwest. Read: New Book Coming Soon… Momo! » Categorized as: Bigfoot, Books, Cryptozoology, Momo, Monstro Bizarro | 1 Comment » Wild Thing: Virginia Wade Posted by: Craig Woolheater on December 19th, 2018 Sasquatch sells. So does sex. And Sasquatch sex? Well, you can make quite a living off of that. We talk to Virginia Wade, renowned Bigfoot erotica author, about her work and how she started writing steamy Sasquatch scenes. (This one’s probably not for the kiddos…) Read: Wild Thing: Virginia Wade » Categorized as: Bigfoot, Bigfoot Report, Books, CryptoConsumerism, Cryptozoology, Podcast, Pop Culture, Sasquatch | Comments Off on Wild Thing: Virginia Wade Forthcoming Cryptozoology Books in 2019 Posted by: Loren Coleman on December 19th, 2018 What lies ahead? Read: Forthcoming Cryptozoology Books in 2019 » Categorized as: Books, Breaking News, CryptoZoo News, Cryptozoologists, Cryptozoology | 1 Comment » 2018 Texas Bigfoot Conference Posted by: Craig Woolheater on September 6th, 2018 Michael and Diana Esordi of googz & co have designed and created some really cool merchandise for the upcoming 2018 Texas Bigfoot Conference coming up October 20th in Jefferson, TX. Read: 2018 Texas Bigfoot Conference » Categorized as: Bigfoot, Bigfoot Report, Books, Conferences, Cryptid Cinema, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Evidence, Expedition Reports, Eyewitness Accounts, Festivals, Folklore, Footprint Evidence, Pop Culture, Sasquatch, Swamp Monsters | Comments Off on 2018 Texas Bigfoot Conference Coast to Coast AM: Loren Coleman and Mothman Posted by: Loren Coleman on December 18th, 2017 Tonight I will be talking about my two Mothman books, 2002’s Mothman and Other Curious Encounters, and 2017’s Mothman: Evil Incarnate. Read: Coast to Coast AM: Loren Coleman and Mothman » Categorized as: Avian Mysteries, Books, CryptoZoo News, Cryptozoologists, Cryptozoology, Eyewitness Accounts, Flying Humanoids, Mothman, Podcast, Pop Culture | Comments Off on Coast to Coast AM: Loren Coleman and Mothman A Wish for Giants Posted by: Craig Woolheater on November 11th, 2017 Sophie, a young volunteer, meets her kindred spirit in Roxie, a girl with a life threatening medical condition and a unique wish to meet Bigfoot. Read: A Wish for Giants » Categorized as: Bigfoot, Bigfoot Report, Books, Cryptid Cinema, Cryptozoology, Pop Culture, Sasquatch | Comments Off on A Wish for Giants Sasquatch: Legend Meets Science Posted by: Craig Woolheater on November 2nd, 2017 Anthropologist, author and scientist Jeff Meldrum talks about the evidence for (and against) the existence of Bigfoot. Are there animals hiding in the woods that we know nothing about? Read: Sasquatch: Legend Meets Science » Categorized as: Bigfoot, Bigfoot Report, Books, Cryptozoologists, Cryptozoology, Evidence, Footprint Evidence, Forensic Science, Podcast, Pop Culture, Sasquatch | Comments Off on Sasquatch: Legend Meets Science Bigfoot belongs and its habitat needs protection Posted by: Craig Woolheater on September 24th, 2017 “Bigfoot shows what could have been and what still could be, if we only treated the land as if it were really there,” he writes. “The very wildness from which the Bigfoot myth emanates is disappearing fast.” Read: Bigfoot belongs and its habitat needs protection » Categorized as: Bigfoot, Bigfoot Report, Books, Cryptozoology, Expedition Reports, Folklore, Pop Culture, Sasquatch | 1 Comment » 50 Years Ago: Sasquatch Sightings Flap in Washington Posted by: Loren Coleman on September 13th, 2017 Sept 1967 ~ 50 years ago ~ large flap of Bigfoot sightings near Marietta, Nooksack River, WA. Mostly forgotten due to Patterson-Gimlin Film. Read: 50 Years Ago: Sasquatch Sightings Flap in Washington » Categorized as: 50th Anniversary Tributes, Bigfoot, Books, CryptoZoo News, Cryptozoologists, Cryptozoology, Eyewitness Accounts, International Cryptozoology Museum, Museums, Pop Culture, Sasquatch, Television | Comments Off on 50 Years Ago: Sasquatch Sightings Flap in Washington Count Dracula, Van Helsing, and Giant Spiders in the Cathedral Posted by: Karl Shuker on September 9th, 2017 Many years ago, while reading Bram Stoker’s classic vampire novel Dracula, which was originally published in 1897, I was intrigued by the following short but memorable aside spoken by the eminent vampire hunter Prof. Abraham Van Helsing to his former student Dr John Seward: “Can you tell me why, when other spiders die small and soon, that one great spider lived for centuries in the tower of the old Spanish church and grew and grew, till, on descending, he could drink the oil of all the church lamps?” Read: Count Dracula, Van Helsing, and Giant Spiders in the Cathedral » Categorized as: Books, Cryptozoology, ShukerNature, Weird Animal News | Comments Off on Count Dracula, Van Helsing, and Giant Spiders in the Cathedral Coast to Coast AM: Shape-Shifting Monsters Posted by: Nick Redfern on September 7th, 2017 Shapeshifters presents a menagerie of otherworldly creatures and half-human monsters, from were-cats to blood-suckers to aliens. Discover legends and lore from around the world and experience first-hand encounters with shape-changing beasts that lurk in the night. Nick Redfern takes you deep into their domain, opening your eyes to paranormal secrets and cryptozoological wonders. Just be sure to keep some silver bullets close at hand. Read: Coast to Coast AM: Shape-Shifting Monsters » Categorized as: Abominable Snowman, Alien Big Cats, Bigfoot, Books, Cryptid Canids, Cryptozoology, Lair of the Beasts, Lake Monsters, Lizard People, Loch Ness Monster, Media Appearances, Mothman, Pop Culture, Sasquatch | Comments Off on Coast