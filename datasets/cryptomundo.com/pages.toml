full_description = "Yetis Are Not White! Posted by: Ken Gerhard on May 15th, 2019 YETIS ARE NOT WHITE! That’s what my friends Richard Freeman and Loren Coleman will emphatically tell you. Regardless, you should tune into the Travel Channel tonight for the latest episode of ‘In Search of Monsters!’ The legendary Yeti will be the featured subject… and yours truly may even make an appearance. 😉 9pm EST/8pm CST About Ken Gerhard Ken has investigated reports of mysterious beasts around the world including Bigfoot, the Loch Ness Monster, the Chupacabra, giant winged creatures and even werewolves. In addition to appearing in three episodes of the television series Monster Quest (History Channel), Ken is featured in the History Channel special The Real Wolfman, as well as Legend Hunters (Travel Channel/A&E), Paranatural (National Geographic), Ultimate Encounters (truTV) and William Shatner's Weird or What? (History Television). His credits include multiple appearances on Coast to Coast AM, major news broadcasts and Ireland’s Newstalk radio, as well as being featured in major books and in articles by the Associated Press, Houston Chronicle and Tampa Tribune. Ken is author of the books Big Bird: Modern Sightings of Flying Monsters and A Menagerie of Mysterious Beasts: Encounters with Cryptid Creatures, as well as the co-author of Monsters of Texas (with Nick Redfern) and has contributed to trade publications including Fate Magazine, Animals and Men, The Journal of the British Columbia Scientific Cryptozoology Club and Bigfoot Times. He currently lectures and exhibits at events across America. Born on Friday the 13th of October, 1967 (exactly one week before the famous Patterson Bigfoot film was shot), Ken has traveled to twenty-six different countries on six continents and most of the United States. An avid adventurer, he has camped along the Amazon, explored the Galapagos, hiked the Australian Outback and has visited many ancient and mysterious sites, from Machu Pichu to Stonehenge. Email • Facebook • Twitter • This entry was posted on Wednesday, May 15th, 2019 at 6:49 pm and is filed under Abominable Snowman, Cryptozoologists, Cryptozoology, Pop Culture, Television, Texas Monster Hunter. You can follow responses via our RSS 2.0 feed. Both comments and pings are currently closed. Facebook Google+ Twitter Pinterest Email Print Delicious Digg Fark Google Instapaper LinkedIn MySpace Newsvine Pocket Readability Reddit StumbleUpon Tumblr Yahoo! Related Posts On Exhibit: The “Yeti Memo” Searching for the Yeti Sorry. Comments are closed. |Top | Content|"
