full_description = "Archive for the “Forensic Science” Scientist Claims He Solved the Mystery of Bigfoot Posted by: Craig Woolheater on February 3rd, 2023 A data scientist thinks he’s solved the mystery of Bigfoot ― not by searching for the creature out in the wilds, but by examining the math instead. Read: Scientist Claims He Solved the Mystery of Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Books, Breaking News, Cryptozoology, Eyewitness Accounts, Forensic Science, Sasquatch, Skeptical Discussions | Comments Off on Scientist Claims He Solved the Mystery of Bigfoot Expedition Bigfoot Posted by: Craig Woolheater on November 5th, 2019 Team Believes an Advanced Algorithm is the Missing Key to Solving the Bigfoot Legend Read: Expedition Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Breaking News, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Forensic Science, Pop Culture, Sasquatch, Television | 5 Comments » Wild Thing: Why We Want to Believe Posted by: Craig Woolheater on December 5th, 2018 Bigfoot researchers remain optimistic that Sasquatch is out there; that the creature will one day be found. Why? Why do people continue to believe? We’ll talk to professional skeptic Michael Shermer about the nature of belief. And we’ll look at why—even for those who think Bigfoot is a complete myth—the idea of Bigfoot holds so much appeal. What makes us so fascinated by this creature? Why do we want so badly to believe that it’s out there? Read: Wild Thing: Why We Want to Believe » Categorized as: Bigfoot, Bigfoot Report, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Forensic Science, Podcast, Pop Culture, Sasquatch, Skeptical Discussions | 4 Comments » Wild Thing: A-C-G-T Spells B-G-F-T Posted by: Craig Woolheater on November 6th, 2018 Everywhere you go, you leave bits of yourself behind and Bigfoot is no different. But now, those DNA droppings are easier than ever to analyze, making it possible to identify a species, even without a body. We’ll talk to Dr. Todd Disotell, a molecular primatologist at NYU and a regular on Spike TV’s $10 Million Bigfoot Bounty, about the magic of DNA analysis and what it might mean for Bigfoot. Read: Wild Thing: A-C-G-T Spells B-G-F-T » Categorized as: 10 Million Dollar Bigfoot Bounty, Bigfoot, Bigfoot Report, Cryptozoology, Evidence, Forensic Science, Podcast, Pop Culture, Sasquatch | Comments Off on Wild Thing: A-C-G-T Spells B-G-F-T Wild Thing: The Evidence Posted by: Craig Woolheater on October 16th, 2018 Let’s look at the evidence. There are footprints and sounds, grainy pictures, and the notorious Patterson-Gimlin film—that shaky 1967 video of a big, hairy beast striding through the forest. But how well does it hold up? We hear from a variety of people—the skeptics and the certain—who make their case for what evidence is out there. How much of it stands up to scrutiny? Read: Wild Thing: The Evidence » Categorized as: Bigfoot, Bigfoot Report, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Footprint Evidence, Forensic Science, Podcast, Pop Culture, Sasquatch | 1 Comment » Wild Thing: Distant Relative or Kissing Cousin? Posted by: Craig Woolheater on October 10th, 2018 Just what is Bigfoot? Descendant of ancient apes? Close human ancestor? Evolution might hold the answer to this question. Homo sapiens may rule the planet now but once upon a time, we weren’t the only hominid creatures walking around. Who’s to say that Bigfoot wasn’t—and still isn’t—among us? We talk to evolution experts and anthropologists, including Ian Tattersall, curator at the American Museum of Natural History in New York. Read: Wild Thing: Distant Relative or Kissing Cousin? » Categorized as: Bigfoot, Bigfoot Report, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Forensic Science, Podcast, Pop Culture, Sasquatch | 1 Comment » Wild Thing: Grover Posted by: Craig Woolheater on October 8th, 2018 Laura Krantz is a veteran public radio editor and producer. So how did she end up in the wilds of the Pacific Northwest, eyeballing some giant ground nests… that might have been made by Bigfoot? You can place the blame squarely on the shoulders of a guy named Grover. He was a tenured professor of anthropology at Washington State University and one of world’s preeminent experts on Sasquatch. And it turns out that Grover is also Laura’s long-lost cousin. How could she not do a story about this guy? Read: Wild Thing: Grover » Categorized as: Bigfoot, Bigfoot Report, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Forensic Science, Podcast, Pop Culture, Sasquatch | Comments Off on Wild Thing: Grover Sasquatch: Legend Meets Science Posted by: Craig Woolheater on November 2nd, 2017 Anthropologist, author and scientist Jeff Meldrum talks about the evidence for (and against) the existence of Bigfoot. Are there animals hiding in the woods that we know nothing about? Read: Sasquatch: Legend Meets Science » Categorized as: Bigfoot, Bigfoot Report, Books, Cryptozoologists, Cryptozoology, Evidence, Footprint Evidence, Forensic Science, Podcast, Pop Culture, Sasquatch | Comments Off on Sasquatch: Legend Meets Science Science Vs. Bigfoot Posted by: Craig Woolheater on November 1st, 2017 All over the world people report sightings of big, hairy, human-like beasts, so could Bigfoot really be out there… somewhere? We ask Dr. Jeff Meldrum, Prof. Bryan Sykes, Prof. Todd Disotell, and the Round Rock, Texas, Department of Parks and Recreation. Read: Science Vs. Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Footprint Evidence, Forensic Science, Podcast, Pop Culture, Sasquatch | Comments Off on Science Vs. Bigfoot On the Plausibility of Another Bipedal Primate Species Existing in North America Posted by: Craig Woolheater on October 26th, 2017 Jeff Meldrum is one of the very few scientists who has not been dissuaded from pursuing research on sasquatch, despite taking heavy flak from mainstream peers. In numerous field trips to remote areas in the north-western part of the United States Jeff has collected interesting evidence that is consistent with the existence in that area of a relict population of an unknown reclusive primate species. Here is his story. Read: On the Plausibility of Another Bipedal Primate Species Existing in North America » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Footprint Evidence, Forensic Science, Sasquatch | Comments Off on On the Plausibility of Another Bipedal Primate Species Existing in North America Sasquatch Nest eDNA Study Posted by: Craig Woolheater on July 5th, 2017 Finding Bigfoot’s Cliff Barackman weighs in on the suspected Sasquatch nests being studied by the Olympic Project and Dr. Jeff Meldrum Read: Sasquatch Nest eDNA Study » Categorized as: Bigfoot, Bigfoot Report, Crowdsourcing, Cryptozoologists, Cryptozoology, Evidence, Forensic Science, Sasquatch | 1 Comment » Sasquatch Nests eDNA Study Posted by: Craig Woolheater on June 23rd, 2017 Environmental DNA (eDNA) analysis of ground nests attributed to sasquatch on Olympic Peninsula. Read: Sasquatch Nests eDNA Study » Categorized as: Bigfoot, Bigfoot Report, Crowdsourcing, Cryptozoologists, Cryptozoology, Evidence, Forensic Science, Sasquatch | 2 Comments » Creatures Posted by: Craig Woolheater on May 30th, 2017 Creatures is a true story suspense movie based on the incidents at the Bridges family residence. Directed and written by Stacy Brown Jr. Read: Creatures » Categorized as: Bigfoot, Bigfoot Report, Cinema News, Cryptid Cinema, Cryptozoology, Evidence, Eyewitness Accounts, Forensic Science, Movie Monsters, Pop Culture, Sasquatch | Comments Off on Creatures The Discovery of the Sasquatch as a Prolonged Process Posted by: Craig Woolheater on May 5th, 2017 Discussion by Dr. John Bindernagel Read: The Discovery of the Sasquatch as a Prolonged Process » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Footprint Evidence, Forensic Science, Sasquatch | Comments Off on The Discovery of the Sasquatch as a Prolonged Process Dr. Meldrum moves closer to Scientific acceptance of Bigfoot Posted by: Craig Woolheater on May 1st, 2017 Todd Standing and Dr. Jeff Meldrum discuss some very interesting Sasquatch theories and evidence. Read: Dr. Meldrum moves closer to Scientific acceptance of Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Breaking News, Cryptozoologists, Cryptozoology, Evidence, Footprint Evidence, Forensic Science, Podcast, Sasquatch | 3 Comments » var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '803977', Size: '300250'}; « Older Posts | |Top | Content|"
