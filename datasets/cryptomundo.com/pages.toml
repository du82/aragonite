full_description = "New Book Coming Soon… Momo! Posted by: Lyle Blackburn on January 30th, 2019 Coming March 5th! Join me on a strange and spooky journey as I examine one of the greatest monster tales to ever rise from the hills and hollers of the American Midwest. With fantastic cover art and illustrations by Claudio Bergamin. About Lyle Blackburn Lyle Blackburn’s research and writing on the subject of legendary creatures and unexplained phenomenon has been widely recognized as some of the best in the field of cryptozoology. His previous books, including The Beast of Boggy Creek and Momo: The Strange Case of the Missouri Monster, offer a balanced view of the subjects while delivering gripping accounts of real-life mysteries. Lyle is a frequent guest on radio programs such as Coast To Coast AM, and has appeared on television shows such as Monsters and Mysteries in America, Finding Bigfoot, and Strange Evidence. Lyle has also been featured in several award-winning documentary films, including Boggy Creek Monster and The Mothman of Point Pleasant. For more information, visit Lyle's website at: www.lyleblackburn.com Email • Facebook • Twitter • Youtube • Instagram • This entry was posted on Wednesday, January 30th, 2019 at 8:32 am and is filed under Bigfoot, Books, Cryptozoology, Momo, Monstro Bizarro. You can follow responses via our RSS 2.0 feed. Both comments and pings are currently closed. Facebook Google+ Twitter Pinterest Email Print Delicious Digg Fark Google Instapaper LinkedIn MySpace Newsvine Pocket Readability Reddit StumbleUpon Tumblr Yahoo! Related Posts It Came From the Woods Boggy and Beyond The Ottine Swamp Thing One Response to “New Book Coming Soon… Momo!” springheeledjack responds: February 1st, 2019 at 10:41 pm Cool. Lyle Blackburn does good stuff. Sorry. Comments have been closed. |Top | Content|"
