full_description = "Archive for the “Mapinguary” Beasts in the Mist Posted by: Craig Woolheater on October 22nd, 2024 “What a bankrupt world it would be if you refused to believe things existed until you actually had seen a specimen in a museum. I mean, there are lots of things we are prepared to believe exist without having seen them,” Read: Beasts in the Mist » Categorized as: Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Extinct, Eyewitness Accounts, Mapinguary, Megafauna | Comments Off on Beasts in the Mist Still In Search Of Prehistoric Survivors Posted by: Karl Shuker on November 29th, 2016 It has been 21 years since the original publication back in 1995 of In Search of Prehistoric Survivors, considered by many to be my finest cryptozoological volume. Not surprisingly, then, in subsequent years there has been a growing, persistent clamour among its numerous fans worldwide for me to prepare a new, updated edition. Now, at last, fulfilling a longstanding promise, I have done so – and what an update it is! Read: Still In Search Of Prehistoric Survivors » Categorized as: Avian Mysteries, Books, Cadborosaurus, Champ/Lake Champlain Monster, Coelacanth, Cryptid Canids, Cryptoart, Cryptozoology, Extinct, Eyewitness Accounts, Giant Cryptid Reptiles, Lake Monsters, Living Dinosaurs, Living Fossils, Loch Ness Monster, Mapinguary, Megafauna, Megalodon, Mokele-Mbembe, Mystery Cats, Ogopogo, River Monsters, Sea Monsters, Sea Serpents, ShukerNature, Swamp Monsters, Thunderbirds, Thylacine, Winged Weirdies | Comments Off on Still In Search Of Prehistoric Survivors The Yukon Beaver Eater, and Ground Sloths in New Zealand? Posted by: Karl Shuker on March 9th, 2016 When we think of sloths, we generally picture those famously sluggish, dog-sized, tree-dwelling beasts that spend much of their time hanging upside-down from branches in modern-day Central and South America. Millions of years ago, however, there were several additional, very different morphological types – of which the most famous and dramatic were the ground sloths. Read: The Yukon Beaver Eater, and Ground Sloths in New Zealand? » Categorized as: Cryptozoology, Eyewitness Accounts, Folklore, Living Fossils, Mapinguary, Megafauna, Out of Place, ShukerNature | Comments Off on The Yukon Beaver Eater, and Ground Sloths in New Zealand? Bobo Gets News of a Recent Mapinguari Sighting Posted by: Craig Woolheater on June 12th, 2015 Bobo speaks with a local person who provides details on an encounter with a Mapinguari, the Amazon’s bigfoot legend. The person claims to have seen it as recent as six months ago. Read: Bobo Gets News of a Recent Mapinguari Sighting » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Eyewitness Accounts, Finding Bigfoot, Mapinguary, Pop Culture, Sasquatch, Television, Videos | Comments Off on Bobo Gets News of a Recent Mapinguari Sighting Searching For the Amazon’s Bigfoot, the Mapinguari, By Night Posted by: Craig Woolheater on June 11th, 2015 The team is on a night mission in the Amazon jungle – will they find the elusive Mapinguari among the scary spiders and snakes? Read: Searching For the Amazon’s Bigfoot, the Mapinguari, By Night » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Finding Bigfoot, Folklore, Mapinguary, Pop Culture, Sasquatch, Television, Videos | Comments Off on Searching For the Amazon’s Bigfoot, the Mapinguari, By Night Communicate With the Mapinguari, But Don’t Let It See You Posted by: Craig Woolheater on June 8th, 2015 While out with the Shaman, Ranae makes a few calls to the Mapiguari – and gets a warning. Read: Communicate With the Mapinguari, But Don’t Let It See You » Categorized as: Bigfoot, Bigfoot Report, Call Blasting, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Finding Bigfoot, Folklore, Mapinguary, Pop Culture, Sasquatch, Television, Videos | Comments Off on Communicate With the Mapinguari, But Don’t Let It See You Beasts in the Mist – The Mapinguari Posted by: Craig Woolheater on May 31st, 2015 I wanted to share this article in light of the fact that Dr. David Oren and his search for the mapinguari is featured on tonight’s episode of Animal Planet’s Finding Bigfoot entitled Amazon Squatchin’. In August of 1999 or so, I ran across the article in Discover magazine. It chronicled an ornithologist named David Oren’s treks into the Amazon in search of the Mapinguari, what is thought to be the still living giant ground sloth. The article detailed the derision that Oren suffered from his fellow scientists. Read: Beasts in the Mist – The Mapinguari » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Finding Bigfoot, Folklore, Footprint Evidence, Mapinguary, Pop Culture, Sasquatch, Television | 1 Comment » Knock Once for the Mapinguari Posted by: Craig Woolheater on May 30th, 2015 The team gets a lesson in survival and in hunting for the Mapinguari from the Tatuyo tribe. Read: Knock Once for the Mapinguari » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Finding Bigfoot, Folklore, Footprint Evidence, Mapinguary, Pop Culture, Sasquatch, Television, Videos | Comments Off on Knock Once for the Mapinguari The Devil in the Amazon Posted by: Craig Woolheater on May 29th, 2015 The team heads to Brazil and meets with Dr. David Oren, who is one of the only researchers known to study the mapinguari, the Amazonian equivalent of Bigfoot. Read: The Devil in the Amazon » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Finding Bigfoot, Folklore, Footprint Evidence, Mapinguary, Pop Culture, Sasquatch, Television, Videos | Comments Off on The Devil in the Amazon Finding Bigfoot: Season Premiere May 31st Posted by: Craig Woolheater on May 13th, 2015 For six seasons of FINDING BIGFOOT, four fearless explorers have covered thousands of miles of uncharted territory in 38 states and eight countries on a mission to locate elusive sasquatches. On, Sunday, May 31, at 9 PM, the unstoppable quartet head to South America for the first time with the hope of finally tracking down one of the most unique creatures of the world. Read: Finding Bigfoot: Season Premiere May 31st » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Folklore, Mapinguary, Pop Culture, Sasquatch, Television | Comments Off on Finding Bigfoot: Season Premiere May 31st Monsters Underground: Graveyard Gulch Mapinguari Posted by: Craig Woolheater on October 24th, 2014 Bill Brock and his team suspect recent black bear deaths are due to the Mapinguari: a descendant of the giant prehistoric sloth. Together they travel to Graveyard Gulch, a treacherous cave in Northern California to hunt this deadly monster. Read: Monsters Underground: Graveyard Gulch Mapinguari » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Mapinguary, Pop Culture, Sasquatch, Television | Comments Off on Monsters Underground: Graveyard Gulch Mapinguari Monsters Underground Moves to Discovery Posted by: Craig Woolheater on September 4th, 2014 The Monsters Underground premiere was postponed and moved from Destination America to Discovery. Tonight the show premieres with two episodes at 10:02/9:02c and 10:32/9:32c. Read: Monsters Underground Moves to Discovery » Categorized as: Avian Mysteries, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Folklore, Mapinguary, Pop Culture, Television, Videos, Winged Weirdies | Comments Off on Monsters Underground Moves to Discovery CryptoCast Archive: Swamp Monsters and Monsters Underground Posted by: Craig Woolheater on August 15th, 2014 Archive from last Sunday’s show with guests Bill Brock and Elliot Guidry. Read: CryptoCast 