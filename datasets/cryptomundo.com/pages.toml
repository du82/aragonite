full_description = '''Bang! Zoom! To The Moon! Posted by: Craig Woolheater on January 12th, 2023 One small step for man, one giant step for Bigfoot: Fremont artist’s sasquatch sculpture to be archived on the moon Dan Chudzinski’s sculpture, titled ‘Evasive Species,’ will be archived on microfilm in a time capsule and sent to the moon as part of the Lunar Codex project. Bigfoot is mostly known for trekking the forests of the western United States. But the hairy behemoth plans to chart new territory as well: the moon. Dan Chudzinski, a northwest Ohio artist and sculptor, began his larger-than-life rendition of the classic folklore monster — titled “Evasive Species” — during the COVID-19 lockdown in 2020 when the Norman Rockwell Museum in Massachusetts tasked him with creating the art piece for an exhibit.Jonathan Monk Read the rest of the story here. About Craig Woolheater Co-founder of Cryptomundo in 2005. I have appeared in or contributed to the following TV programs, documentaries and films: OLN's Mysterious Encounters: "Caddo Critter", Southern Fried Bigfoot, Travel Channel's Weird Travels: "Bigfoot", History Channel's MonsterQuest: "Swamp Stalker", The Wild Man of the Navidad, Destination America's Monsters and Mysteries in America: Texas Terror - Lake Worth Monster, Animal Planet's Finding Bigfoot: Return to Boggy Creek and Beast of the Bayou. Email • Facebook • Twitter • Pinterest • Instagram • This entry was posted on Thursday, January 12th, 2023 at 8:30 am and is filed under Bigfoot, Bigfoot Report, Cryptoart, Cryptozoology, Pop Culture, Replica Cryptia, Sasquatch, Videos. You can follow responses via our RSS 2.0 feed. Both comments and pings are currently closed. Facebook Google+ Twitter Pinterest Email Print Delicious Digg Fark Google Instapaper LinkedIn MySpace Newsvine Pocket Readability Reddit StumbleUpon Tumblr Yahoo! Related Posts Scientist Claims He Solved the Mystery of Bigfoot It’s a Giant! CryptoConspiracy? Sasquatch Discovered: The Biography of Dr. John Bindernagel Momo Is Here! New Book Coming Soon... Momo! Sorry. Comments are closed. |Top | Content|'''
