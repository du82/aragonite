title = "Cryptomundo » Scientist Claims He Solved the Mystery of Bigfoot"
description = "Cryptomundo » Scientist Claims He Solved the Mystery of Bigfoot"
full_description = '''Scientist Claims He Solved the Mystery of Bigfoot Posted by: Craig Woolheater on February 3rd, 2023 A data scientist thinks he’s solved the mystery of Bigfoot ― not by searching for the creature out in the wilds, but by examining the math instead. Credit: Unsplash/CC0 Public Domain In a new preprint study published online in bioRxiv, data analyst Floe Foxon says many sightings could actually be black bears, which can be roughly the size and shape of a Sasquatch when walking on their hind legs. Study abstract: It has been suggested that the American black bear (Ursus americanus) may be responsible for a significant number of purported sightings of an alleged unknown species of hominid in North America. Previous analyses have identified correlation between ‘sasquatch’ or ‘bigfoot’ sightings and black bear populations in the Pacific Northwest using ecological niche models and simple models of expected animal sightings. The present study expands the analysis to the entire US and Canada by regressing sasquatch sightings on bear populations in each state/province while adjusting for human population and land area in a generalized linear model. Sasquatch sightings were statistically significantly associated with bear populations such that, on the average, one ‘sighting’ is expected for every few hundred bears. Based on statistical considerations, it is likely that many supposed sasquatch are really misidentified known forms. If bigfoot is there, it may be many bears.Floe Foxon He’s even come up with a simple formula: Sasquatch sightings were statistically significantly associated with bear populations such that, on the average, one ‘sighting’ is expected for every 900 bears. Based on statistical considerations, it is likely that many supposed Sasquatch are really misidentified known forms. “If Bigfoot is there,” he writes, “it may be many bears.” The study includes a map showing black bear populations and Bigfoot sightings overlapping in some places, especially the Pacific Northwest. But it also shows two big exceptions: Texas and Florida. The two states have had plenty of Bigfoot sightings, but Texas has no real bear population and Florida has only a small presence. Foxon’s analysis cites previous studies, including a 2009 report published in the Journal of Biogeography that also found a distinct overlap between black bear populations and Bigfoot sightings. The authors of that study wrote that the overlap suggests “that many sightings of this cryptozoid may be cases of mistaken identity.” Predicting the distribution of Sasquatch in western North America: anything goes with ecological niche modelling Source Field guide illustration from Dr. John Bindernagel’s book: North America’s Great Ape: the Sasquatch – a Wildlife Biologist Looks at the Continent’s Most Misunderstood Large Mammal About Craig Woolheater Co-founder of Cryptomundo in 2005. I have appeared in or contributed to the following TV programs, documentaries and films: OLN's Mysterious Encounters: "Caddo Critter", Southern Fried Bigfoot, Travel Channel's Weird Travels: "Bigfoot", History Channel's MonsterQuest: "Swamp Stalker", The Wild Man of the Navidad, Destination America's Monsters and Mysteries in America: Texas Terror - Lake Worth Monster, Animal Planet's Finding Bigfoot: Return to Boggy Creek and Beast of the Bayou. Email • Facebook • Twitter • Pinterest • Instagram • This entry was posted on Friday, February 3rd, 2023 at 8:30 am and is filed under Bigfoot, Bigfoot Report, Books, Breaking News, Cryptozoology, Eyewitness Accounts, Forensic Science, Sasquatch, Skeptical Discussions. You can follow responses via our RSS 2.0 feed. Both comments and pings are currently closed. Facebook Google+ Twitter Pinterest Email Print Delicious Digg Fark Google Instapaper LinkedIn MySpace Newsvine Pocket Readability Reddit StumbleUpon Tumblr Yahoo! Related Posts Sasquatch Discovered: The Biography of Dr. John Bindernagel Bang! Zoom! To The Moon! So, Why Do People Believe In Bigfoot Anyway? Does Science Benefit From the Search for Sasquatch? A Legend In The Making: The Early Years of Grover Krantz The Man, The Myth, and The Legend of Grover Krantz Sorry. Comments are closed. |Top | Content|'''
