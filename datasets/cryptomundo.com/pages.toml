description = "Cryptomundo » Nite Callers BF Radio Presents: John Kirk & Winona Alexis of British Columbia"
full_description = '''Nite Callers BF Radio Presents: John Kirk & Winona Alexis of British Columbia Posted by: Craig Woolheater on October 15th, 2015 Tonight at 8 PM Central. Listen live at this link. Winona Alexis is Lakota, Nakota and Dakota from the Rosebud reservation in South Dakota but she grew up in Virginia. Winona first became interested in Sasquatch in the 70’s when she was about 11 after finding a book in her school library. She now lives in Alberta Canada on the Alexis Nakota First Nations Reserve and has lived there for 16 years. Since moving here her interest in Sasquatch has gone up to a new level. Winona has had some encounters in which she saw what might have been a Sasquatch cross the road with a baby one evening and has has several more including, hearing them slam into her house and what sounded like one speaking. Her children and other children visiting her house on the First Nations reserve have had sightings and heard vocals as well. John Kirk is president of the British Columbia Scientific Cryptozoology Club (BCSCC), and is the author of the award-winning book, In the Domain of the Lake Monsters. John is part of a team of investigators that have searched for cryptids such as Ogopogo, Sasquatch, Cadborosaurus, black alligators, unknown cameloids, lacustrean cryptids and giant salamanders in the province of British Columbia. John has ventured far afield in his quest for evidence for the mystery animals of the world in many areas of the world including Scotland, the Republic of Cameroon and the Republic of the Congo. John is a keen student of police methodologies and investigation techniques which he feels are very useful in the field of cryptozoological research. It is John’s hope that the day will come when cryptozoological researchers will be at the forefront of using technologies and equipment that are of the cutting edge variety in their search for cryptids. About Craig Woolheater Co-founder of Cryptomundo in 2005. I have appeared in or contributed to the following TV programs, documentaries and films: OLN's Mysterious Encounters: "Caddo Critter", Southern Fried Bigfoot, Travel Channel's Weird Travels: "Bigfoot", History Channel's MonsterQuest: "Swamp Stalker", The Wild Man of the Navidad, Destination America's Monsters and Mysteries in America: Texas Terror - Lake Worth Monster, Animal Planet's Finding Bigfoot: Return to Boggy Creek and Beast of the Bayou. Email • Facebook • Twitter • Pinterest • Instagram • This entry was posted on Thursday, October 15th, 2015 at 5:12 pm and is filed under Bigfoot, Bigfoot Report, Cadborosaurus, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Folklore, Footprint Evidence, Forensic Science, Lake Monsters, Ogopogo, Podcast, Pop Culture, Sasquatch, Sea Monsters, Sea Serpents. You can follow responses via our RSS 2.0 feed. Both comments and pings are currently closed. Facebook Google+ Twitter Pinterest Email Print Delicious Digg Fark Google Instapaper LinkedIn MySpace Newsvine Pocket Readability Reddit StumbleUpon Tumblr Yahoo! Related Posts Scientist Claims He Solved the Mystery of Bigfoot It’s a Giant! CryptoConspiracy? Sasquatch Discovered: The Biography of Dr. John Bindernagel Bang! Zoom! To The Moon! 2018 Ogopogo Footage Sorry. Comments are closed. |Top | Content|'''
