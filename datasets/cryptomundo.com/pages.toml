full_description = '''Expedition Bigfoot Posted by: Craig Woolheater on November 5th, 2019 From press release: FOR THE FIRST TIME EVER, AN ELITE TEAM OF RESEARCHERS HAVE THE CLUES TO FIND ELUSIVE EVIDENCE IN TRAVEL CHANNEL’S UNCANNY NEW SERIES ’EXPEDITION BIGFOOT’ – PREMIERING WEDNESDAY, DECEMBER 4 AT 10 P.M. ET/PT Team Believes an Advanced Algorithm is the Missing Key to Solving the Bigfoot Legend November 4, 2019 NEW YORK (November 4, 2019) – Every year hundreds of eyewitnesses log their alleged encounters with the legendary creature Bigfoot. All told, there have been more than 10,000 reported modern-day sightings of Bigfoot in the continental United States, with more than one-third of them emanating from the Pacific Northwest. And while many have searched for the elusive beast, no one knows where or when this legendary cryptid will be seen next, nor have they put forth credible, indisputable evidence of the creature’s existence. Until now… Old legend meets new modern-day technology as an elite team of skilled searchers are using an advanced data algorithm and groundbreaking science and tools to analyze five decades of Bigfoot sightings and to pinpoint when and where to encounter this elusive beast. With these results and gadgetry at their disposal, they now know the time and place to search for evidence of Bigfoot. Travel Channel’s new eight-part investigative-adventure series “Expedition Bigfoot,” premiering Wednesday, December 4 at 10 p.m. ET/PT, tracks the expert team throughout their harrowing experience and pioneering endeavor. With a unique blend of expertise, the team – including Bryce Johnson (Expedition Operations); Dr. Mireya Mayor (Primatologist); Russell Acord (Ex-Military/Survivalist); Ronny LeBlanc (Bigfoot Researcher); and Ryan “RPG” Golembeske (Bigfoot Investigator) – may finally take one of the world’s greatest mysteries out of the pages of legend and lore and into reality. Throughout their three-week sojourn to an undisclosed, remote location in a 90,000-acre swath of land in central Oregon, they use the latest advanced technologies to narrow their search within the target zone. As the investigation intensifies, evidence that Bigfoot is in the area begins to pile up. Possible nesting sites, footprints and vocalizations lead the team to a hot spot where inexplicable events occur and one of the greatest pieces of video evidence in Bigfoot history is recorded. “Travel Channel has assembled the very best team of experts in Bigfoot lore and science to give us proof of the creature’s existence once and for all,” said Matthew Butler, general manager, Travel Channel. “The journey is formidable, and the jeopardy is real. Skeptics and believers alike will both agree the trek this team makes is something they have never seen before.” To learn more about “Expedition Bigfoot,” visit TravelChannel.com for show extras, behind-the-scenes photos and exclusive videos. Follow @TravelChannel and #TRVLBigfoot on Facebook, Twitter and Instagram for additional content and updates. “Expedition Bigfoot” is produced by Railsplitter Pictures for Travel Channel. For Railsplitter Pictures, the executive producers are Matt Ginsburg and Tim Healy. For Travel Channel, the executive producer is Charles Norlander, Julie Meisner Eagle is vice president of production and development, Matthew Butler is general manager, and Henry Schleiff is group president of Investigation Discovery, Travel Channel, American Heroes Channel and Destination America. ABOUT THE ‘EXPEDITION BIGFOOT’ CAST Bryce Johnson: Acclaimed actor/producer as well as creator and host of the popular podcast “Bigfoot Collectors Club,” Bryce has been obsessed with Bigfoot ever since he was a young boy. Although acting is his profession, researching the strange and unexplained along with crypto-zoological creatures is his passion. Those two pursuits converged in 2013 when Bryce starred in the critically lauded movie “Willow Creek,” a found-footage horror film about a quest to find evidence of Bigfoot. While researching his role, Bryce met Robert “Bob” Gimlin, the man who, along with Roger Patterson, captured the legendary footage of Bigfoot in 1967. That meeting and their subsequent friendship, cemented Bryce’s commitment to pursuing the truth about the existence of Bigfoot. He can be found on Twitter, Instagram and Facebook. Dr. Mireya Mayor: World-renowned primatologist, Fulbright Scholar and National Science Foundation Fellow, Mireya Mayor is not your typical scientist. For nearly two decades, she has been a wildlife correspondent, reporting on wildlife and habitat loss while advocating for solutions to the alarming trends. Mireya has been hailed as a “female Indiana Jones,” in the media and is an inspiration to young women interested in science and exploration. A two-time Emmy Award-nominated field correspondent for the National Geographic Channel, Mireya reports to audiences worldwide on pertinent wildlife and habitat issues. Her explorations have led to several scientific discoveries, most notably her co-discovery of the world’s smallest primates, a brand-new species to science. The daughter of Cuban immigrants, Mireya grew up in Miami and earned her bachelor’s degree in anthropology and English at the University of Miami and went on to earn her Ph.D. from Stony Brook University. She recently joined Florida International University as Director of the Exploration and Science Communication Initiative. Mireya is also the author of Pink Boots and a Machete: My Journey from NFL Cheerleader to National Geographic Explorer. She can be found on Twitter, Instagram and Facebook, as well as on the Web. Russell Acord: Author of Footprints of a Legend and Bigfoot and the Tripwire, event coordinator for The International Bigfoot Conference and skilled survivalist, retired Army Sergeant Russell Acord spends his free time traveling the Pacific Northwest looking for evidence of Bigfoot. Raised in the mountains of Montana, Russell takes a solid scientific approach to his Bigfoot research. His interest in the subject began when he saw the famous Patterson/Gimlin film, and he has been actively searching for Bigfoot since the late 70s. He can be found on Twitter, Instagram and Facebook. Ronny LeBlanc: Ronny LeBlanc is a globally recognized figure in the world of paranormal, Bigfoot and UFOs. Ronny is an independent researcher, screenwriter and author of the critically-acclaimed and best-selling book Monsterland: Encounters with UFOs, Bigfoot and Orange Orbs, which details the history and connection between the various phenomena, highlighting his experience and a research area called Monsterland in central Massachusetts. Ronny was the first person ever to cast a Bigfoot print in the Bay State from a trackway discovered by a couple in Leominster State Forest in the summer of 2010. He is a regular speaker at the Exeter UFO Festival, New England UFO Conference and ParaFest and has been featured on nationally syndicated radio programs like “Coast to Coast AM with George Noory” and “Fade to Black with Jimmy Church.” He was recently highlighted for his research experience in a cover story for The Boston Herald. He is the founder and host of the “Monsterland” podcast. He can be found on Twitter, Instagram and Facebook, as well as the Web. Ryan “RPG” Golembeske: Ryan Golembeske is a born Bigfooter, raised in a family that believed in all things “Crypto.” Their summer vacations were spent trudging through dense forest in search of Sasquatch and traveling to Scotland to find proof of the Loch Ness Monster. As an adult, Ryan has continued his family’s passions. He has travelled the world following the reports of strange animals and the “cousins” of Bigfoot – from the jungles of the Amazon looking for Mapinguari to the mountains of east Asia in search of the Orang Pendak. His quests and his strong connection with nature only deepen his understanding of Bigfoot and the mysterious. He can be found on Twitter, Instagram and Facebook. ABOUT TRAVEL CHANNEL For the bold, daring and spontaneous; those adventurers who embrace the thrill of the unexpected; those risk-takers who aren’t afraid of a little mystery; if you’re up for anything, down for whatever, and above all, love great stories, journey on to Travel Channel. We’re more than you expect and everything you didn’t know you were looking for. Reaching more than 82 million U.S. cable homes, Travel Channel is the world’s leading travel media brand. Fans also can visit Travel Channel for more information or interact with other fans through Facebook, Twitter, Pinterest and Instagram. Travel Channel is owned by Discovery, Inc., a global leader in real life entertainment spanning 220 countries and territories, whose portfolio also includes Discovery Channel, HGTV, Food Network, TLC, Investigation Discovery and OWN: Oprah Winfrey Network. About Craig Woolheater Co-founder of Cryptomundo in 2005. I have appeared in or contributed to the following TV programs, documentaries and films: OLN's Mysterious Encounters: "Caddo Critter", Southern Fried Bigfoot, Travel Channel's Weird Travels: "Bigfoot", History Channel's MonsterQuest: "Swamp Stalker", The Wild Man of the Navidad, Destination America's Monsters and Mysteries in America: Texas Terror - Lake Worth Monster, Animal Planet's Finding Bigfoot: Return to Boggy Creek and Beast of the Bayou. Email • Facebook • Twitter • Pinterest • Instagram • This entry was posted on Tuesday, November 5th, 2019 at 7:52 am and is filed under Bigfoot, Bigfoot Report, Breaking News, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Forensic Science, Pop Culture, Sasquatch, Television. You can follow responses via our RSS 2.0 feed. Both comments and pings are currently closed. Facebook Google+ Twitter Pinterest Email Print Delicious Digg Fark Google Instapaper LinkedIn MySpace Newsvine Pocket Readability Reddit StumbleUpon Tumblr Yahoo! Related Posts Scientist Claims He Solved the Mystery of Bigfoot It’s a Giant! CryptoConspiracy? Sasquatch Discovered: The Biography of Dr. John Bindernagel Bang! Zoom! To The Moon! Survivorman Bigfoot | Episode 1 | Alberta | Les Stroud | Todd Standing 5 Responses to “Expedition Bigfoot” Peter Von Berg responds: January 20th, 2020 at 2:00 pm I don’t know. So much of this seems so staged and phony. Peter Von Berg responds: January 27th, 2020 at 4:26 pm Well, the first season is over. At first I really liked the show. All the participants seemed to be highly competent scientists/explorers. And they were using the latest technologies – drones and the like. Then I started getting wary. Because the show started veering into the paranormal. I was happy when people like Jeff Meldrum were on. But in the next to last episode we’re suddenly in the middle of a graveyard, we’re getting spooky night shots of the participants, and the female member of the group gasps in her best strangled voice straight out of a horror film, “These (Graves) are all CHILDREN !! she had heard children’s laughter outside her tent the night before. Puleeeaaase ! We started with something out of The Museum of Natural History/National Geographic, and suddenly we’re in The Blair Witch Project. And I had hopes this would be a serious show. Most disappointing. dconstrukt responds: February 14th, 2020 at 10:12 am I was like HOLY SHIT when watching this show. it sounded so damn cool! the howls… the way they were doing things…. you felt like that other show was pure garbage…. and this one might have some luck. The THERMAL VIDEO WAS INSANE! WTF was that? its either faked by the show OR its legit. has to be one or the other. It didnt move like a person and the heat signature was not like a person either. So WTF was that???? Then… the “nest”…. the eDNA…. “we can now find proof” I was thinking. What ever happened with the eDNA? NOTHING. If you know there’s a living animal in that area…. it MUST drink water. 10000% must. why not take water samples from EVERY water source and test for eDNA… surely the proof is there. NOTHING ON THAT EITHER I’m not a rocket scientist but even I figured that out. – them? nothing. then someone on FB sent me this and it started to make more sense. https://www.youtube.com/watch?v=Mv45vfWmPj8&feature=youtu.be norman-uk responds: February 23rd, 2020 at 6:24 pm My wife and I watched this together and looked forward to and enjoyed each episode. We expected it to have lots of faults but forgave it for the technical innovations and the promise they gave. Though we did expect to be disappointed and we often were. Our eyes were open to its theatrics though they were bit more than we expected. The drone was absolutely brilliant and maybe it will be designed to pick up samples for DNA.in future. It was really great to hear the interim result given that they were human with a difference. This is real progress unlike years and years of Todd Disotell dismissing results because they were human. The programmes so far seemed like a bit of a rehearsal and we are looking forward to next series. I have some sympathy for Dr, Mayor showing some emotion at the children’s graves it was more than normal and I hope she is in the next series. LadyPhoenix responds: May 29th, 2020 at 1:31 am I really enjoyed the first season. The people involved all behaved as professionals, with none of the nonsense we see on so many other shows. Some of the evidence found was truly amazing, as far as I am concerned, and having a serious scientist along of the caliber of Dr Mayor is a welcome change. She seemed to invoke some unusual responses as well, compared to the men on the team. I never had the impression that they were faking anything. We see a lot of that these days, but I don’t believe we saw it here. They could easily have done so, but were level-headed throughout even the most compelling situations. Sorry. Comments have been closed. |Top | Content|'''
