full_description = "Archive for the “Expedition Reports” Survivorman Bigfoot | Episode 1 | Alberta | Les Stroud | Todd Standing Posted by: Craig Woolheater on December 21st, 2020 Les finds himself in a remote track of forested land in Alberta, Canada, a renowned Bigfoot hot spot. Read: Survivorman Bigfoot | Episode 1 | Alberta | Les Stroud | Todd Standing » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Expedition Reports, Pop Culture, Sasquatch, Television, Videos | Comments Off on Survivorman Bigfoot | Episode 1 | Alberta | Les Stroud | Todd Standing Expedition Bigfoot Posted by: Craig Woolheater on November 5th, 2019 Team Believes an Advanced Algorithm is the Missing Key to Solving the Bigfoot Legend Read: Expedition Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Breaking News, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Forensic Science, Pop Culture, Sasquatch, Television | 5 Comments » Wild Thing: Bump in the Night Posted by: Craig Woolheater on November 13th, 2018 Tired of waiting around for other people to find Bigfoot, Laura goes on an expedition of her own. This particular outing is led by Cindy Caddell and three other seasoned ‘Squatchers, out in Oregon’s Mt. Hood National Forest. Once the sun sets, we’ll hear a few hair-raising stories around the campfire before heading out on a nighttime hike. Read: Wild Thing: Bump in the Night » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Expedition Reports, Podcast, Pop Culture, Sasquatch | 1 Comment » 2018 Texas Bigfoot Conference Posted by: Craig Woolheater on September 6th, 2018 Michael and Diana Esordi of googz & co have designed and created some really cool merchandise for the upcoming 2018 Texas Bigfoot Conference coming up October 20th in Jefferson, TX. Read: 2018 Texas Bigfoot Conference » Categorized as: Bigfoot, Bigfoot Report, Books, Conferences, Cryptid Cinema, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Evidence, Expedition Reports, Eyewitness Accounts, Festivals, Folklore, Footprint Evidence, Pop Culture, Sasquatch, Swamp Monsters | Comments Off on 2018 Texas Bigfoot Conference Zanzibar Leopard Captured on Camera, Despite Being Declared Extinct Posted by: Craig Woolheater on June 8th, 2018 The Zanzibar leopard was officially declared extinct 25 years ago, but the classification has been called into question after a wildlife biologist caught the elusive predator on camera. Read: Zanzibar Leopard Captured on Camera, Despite Being Declared Extinct » Categorized as: Alien Big Cats, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Extinct, Mystery Cats, Phantom Panthers, Television | 1 Comment » Extinct or Alive Posted by: Craig Woolheater on June 8th, 2018 What if extinct animals weren’t really extinct? The methods used to declare a species extinct are not as fool proof as people might assume. From eyewitness accounts to last known photographs, there is evidence that suggests some of these creatures are still very much alive in the wild. Read: Extinct or Alive » Categorized as: Alien Big Cats, Bigfoot Report, Cryptozoologists, Cryptozoology, Expedition Reports, Extinct, Mystery Cats, Phantom Panthers, Television, Thylacine | Comments Off on Extinct or Alive Monster Week returns to Animal Planet Memorial Day Weekend Posted by: Craig Woolheater on May 25th, 2018 Monster Week returns to Animal Planet next with all-new expeditions in search of the mysterious and unknown; a monster party packed with all types of monsters, including monsters from the forest, monsters from far way islands and monsters from the deep. The week-long celebration will unlock mysteries about animals and creatures rumored to exist, using new technologies, experts, the latest findings and people engaging like never before. MONSTER WEEK will feature a trio of hosts – Rhys Darby (Flight of the Conchords, Jumanji), Dan Schreiber and Buttons – from popular podcast The Cryptid Factor, who will add their expert insight and humor as they celebrate all things cryptid. Read: Monster Week returns to Animal Planet Memorial Day Weekend » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Finding Bigfoot, Loch Ness Monster, Podcast, Pop Culture, Sasquatch, Sea Monsters, Television, Yeti | Comments Off on Monster Week returns to Animal Planet Memorial Day Weekend Finding Bigfoot Finale Posted by: Craig Woolheater on May 25th, 2018 Whether you liked Finding Bigfoot or not, there’s no denying that it brought the subject of Bigfoot/Sasquatch to a wide, general audience. The series finale airs this Sunday, nearly 7 years to the day when the first episode aired on May 29, 2011 on Animal Planet. Read: Finding Bigfoot Finale » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Festivals, Finding Bigfoot, Pop Culture, Sasquatch, Television | 4 Comments » Bigfoot belongs and its habitat needs protection Posted by: Craig Woolheater on September 24th, 2017 “Bigfoot shows what could have been and what still could be, if we only treated the land as if it were really there,” he writes. “The very wildness from which the Bigfoot myth emanates is disappearing fast.” Read: Bigfoot belongs and its habitat needs protection » Categorized as: Bigfoot, Bigfoot Report, Books, Cryptozoology, Expedition Reports, Folklore, Pop Culture, Sasquatch | 1 Comment » Daniel Perez Talks Patty Posted by: Craig Woolheater on September 5th, 2017 If you live in Southern California now is your opportunity to hear one of the foremost experts on the famous Patterson-Gimlin film. Read: Daniel Perez Talks Patty » Categorized as: Bigfoot, Bigfoot Report, Cryptotourism, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Evidence, Expedition Reports, Eyewitness Accounts, Footprint Evidence, Pop Culture, Sasquatch | 1 Comment » Why do people believe in Bigfoot? Posted by: Craig Woolheater on August 25th, 2017 Meldrum and Barackman both said the main reason people don’t believe in Bigfoot is because they have never considered the evidence. Read: Why do people believe in Bigfoot? » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Finding Bigfoot, Footprint Evidence, Pop Culture, Sasquatch | 1 Comment » Searching for the Yeti Posted by: Craig Woolheater on August 15th, 2017 There is a Yeti animal. But explaining the animal mystery turns out not to explain the Yeti’s story. Read: Searching for the Yeti » Categorized as: Abominable Snowman, Bigfoot Report, Books, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Folklore, Footprint Evidence, Yeti | 3 Comments » 2017 Texas Bigfoot Conference Swag Posted by: Craig Woolheater on August 14th, 2017 Michael and Diana Esordi of googz & co have designed and created some really cool merchandise for the upcoming 2017 Texas Bigfoot Conference coming up October 7th in Jefferson, TX. Read: 2017 Texas Bigfoot Conference Swag » Categorized as: Bigfoot, Bigfoot Report, Books, Conferences, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Evidence, Expedition Reports, Eyewitness Accounts, Festivals, Finding Bigfoot, Folklore, Footprint Evidence, Pop Culture, Sasquatch | Comments Off on 2017 Texas Bigfoot Conference Swag Bigfoot sighting in North Carolina was just me dressed in animal skins, says shaman Posted by: Craig Woolheater on August 11th, 2017 Gawain MacGregor, 36, was performing a ‘shamanic’ ritual in the woods when a group mistook him for ‘Bigfoot’ Gawain MacGregor A recent “sighting” of Bigfoot in the US was nothing more than a man wearing a traditional animal skin outfit carrying out a shamanic ritual in the woods, it has emerged. Read: Bigfoot sighting in North Carolina was just me dressed in animal skins, says shaman » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Expedition Reports, Eyewitness Accounts, Pop Culture, Sasquatch, Social Media | 2 Comments » South Carolina police ask residents not to shoot Bigfoot Posted by: Craig Woolheater on August 10th, 2017 A police department in South Carolina issued a warning to residents after there was an alleged Bigfoot sighting in a nearby county. Read: South Carolina police ask residents not to shoot Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Expedition Reports, Eyewitness Accounts, Pop Culture, Sasquatch, Social Media | Comments Off on South Carolina police ask residents not to shoot Bigfoot var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '803977', Size: '300250'}; « Older Posts | |Top | Content|"
