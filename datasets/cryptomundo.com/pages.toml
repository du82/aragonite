News, CryptoZoo News, Cryptozoologists, Cryptozoology, Eyewitness Accounts, Folklore, Footprint Evidence, Pop Culture, Sasquatch | 1 Comment » Dr. Meldrum moves closer to Scientific acceptance of Bigfoot Posted by: Craig Woolheater on May 1st, 2017 Todd Standing and Dr. Jeff Meldrum discuss some very interesting Sasquatch theories and evidence. Read: Dr. Meldrum moves closer to Scientific acceptance of Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Breaking News, Cryptozoologists, Cryptozoology, Evidence, Footprint Evidence, Forensic Science, Podcast, Sasquatch | 3 Comments » Creepy Jungle Giant caught on Video Posted by: Craig Woolheater on October 17th, 2016 Bigfoot, Sasquatch, or even a creepy clown? Read: Creepy Jungle Giant caught on Video » Categorized as: Bigfoot, Bigfoot Report, Breaking News, Cryptozoology, Evidence, Orang Pendek, Photos, Pop Culture, Sasquatch, Videos | 2 Comments » Here’s Nessie! Posted by: Karl Shuker on September 20th, 2016 The Loch Ness Monster (LNM) is not only the premier mystery beast of the United Kingdom, it also vies with the bigfoot or sasquatch as the most famous one anywhere in the world. Read: Here’s Nessie! » Categorized as: Books, Breaking News, Cryptozoologists, Cryptozoology, Giant Cryptid Reptiles, Lake Monsters, Loch Ness Monster, ShukerNature | Comments Off on Here’s Nessie! International Cryptozoology Society Established Posted by: Loren Coleman on January 26th, 2016 The logo harkens back to an old favorite in cryptozoology. Read: International Cryptozoology Society Established » Categorized as: Breaking News, CryptoZoo News, Cryptozoologists, Cryptozoology, International Cryptozoology Museum, International Cryptozoology Society | Comments Off on International Cryptozoology Society Established Happy Holidays Crypto Sale!! Posted by: Loren Coleman on December 15th, 2015 End of 2015 Crypto Sale!! Read: Happy Holidays Crypto Sale!! » Categorized as: Breaking News, CryptoZoo News, Cryptozoology, Pop Culture | Comments Off on Happy Holidays Crypto Sale!! Author, Friend, Bigfooter Rob Riggs Dies Posted by: Craig Woolheater on November 5th, 2015 I received word a few hours ago that friend and fellow Bigfooter Rob Riggs passed away a few days ago. I first met Rob when he spoke at my 2001 Texas Bigfoot Conference. That event was impacted by 9/11, which happened 4 days earlier. Several speakers were unable to fly in for the event, but Rob drove up for the event. He had many interesting theories about the Big Thicket Wildman (Bigfoot) that he hopefully has the answers to now. Godspeed Rob! Read: Author, Friend, Bigfooter Rob Riggs Dies » Categorized as: Bigfoot, Bigfoot Report, Books, Breaking News, Cryptozoologists, Cryptozoology, Folklore, Men in Cryptozoology, Obituaries, Paranormal Investigators, Sasquatch | 2 Comments » Bigfooter Jared Hosack, 39, Dies Posted by: Loren Coleman on November 4th, 2015 A young Bigfoot enthusiast, who graced the pages of this blog in 2008, died suddenly last month. Read: Bigfooter Jared Hosack, 39, Dies » Categorized as: Bigfoot, Breaking News, CryptoZoo News, Cryptozoology, Men in Cryptozoology, Obituaries, Sasquatch | Comments Off on Bigfooter Jared Hosack, 39, Dies Corfu Cryptid Posted by: Loren Coleman on October 28th, 2015 What is it? Read: Corfu Cryptid » Categorized as: Breaking News, CryptoZoo News, Cryptozoology, Photos, Sea Monsters | 18 Comments » Into the Fray Radio Debut Tonight Posted by: Shannon LeGro on September 17th, 2015 Shannon LeGro’s new show, Into the Fray is here. It is a multi-topic venture featuring guests and investigators covering a broad range. With collaborators such as UFO Journalist, Ryan Sprague and Crypto Dark Artist, Sam Shearon, each show will be unique and offer a fresh take on the heavily debated topics in the community. Read: Into the Fray Radio Debut Tonight » Categorized as: Bigfoot, Breaking News, CryptoRadio, Cryptozoologists, Cryptozoology, Expedition Reports, Eyewitness Accounts, Into The Fray, Men in Cryptozoology, Paranormal Investigators, Podcast, Pop Culture, Sasquatch | Comments Off on Into the Fray Radio Debut Tonight Caught on Video: Terrier Saves Owner From Bigfoot Posted by: Chalupacabra on August 10th, 2015 A man visiting North Carolina with his Yorkshire Terrier was on the look out for bears – until a Bigfoot came along. Fortunately, Zippy sprung into action and scared the hairy intruder away. And it was all caught on video! Read: Caught on Video: Terrier Saves Owner From Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Breaking News, Cryptozoology, Evidence, Eyewitness Accounts, Pop Culture, Sasquatch, Social Media, Videos | 6 Comments » var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '803977', Size: '300250'}; « Older Posts | |Top | Content|"
