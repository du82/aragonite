full_description = '''Bigfoot Caught on Video in Wyoming? Posted by: Craig Woolheater on May 21st, 2019 https://youtu.be/XTGPTf6bO4k This video look legit. It’s from Wyoming. Indeed, there are Bigfoots in Wyoming.Matt Moneymaker About Craig Woolheater Co-founder of Cryptomundo in 2005. I have appeared in or contributed to the following TV programs, documentaries and films: OLN's Mysterious Encounters: "Caddo Critter", Southern Fried Bigfoot, Travel Channel's Weird Travels: "Bigfoot", History Channel's MonsterQuest: "Swamp Stalker", The Wild Man of the Navidad, Destination America's Monsters and Mysteries in America: Texas Terror - Lake Worth Monster, Animal Planet's Finding Bigfoot: Return to Boggy Creek and Beast of the Bayou. Email • Facebook • Twitter • Pinterest • Instagram • This entry was posted on Tuesday, May 21st, 2019 at 8:30 am and is filed under Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Sasquatch, Videos. You can follow responses via our RSS 2.0 feed. Both comments and pings are currently closed. Facebook Google+ Twitter Pinterest Email Print Delicious Digg Fark Google Instapaper LinkedIn MySpace Newsvine Pocket Readability Reddit StumbleUpon Tumblr Yahoo! Related Posts Yetis Are Not White! Just Enough Time to Miss Bigfoot Man says he was shot after being mistaken for Bigfoot Russian Bigfoot Caught on Camera? Saskatchewan Sasquatch Caught on Camera? 4 Responses to “Bigfoot Caught on Video in Wyoming?” cakelaw responds: May 23rd, 2019 at 9:03 am Based on the scientific narration this one is most likely genuine Doug responds: May 23rd, 2019 at 4:58 pm As usual it is too far away to tell. The narrator doesn’t seem too impressed and the other person just laughed. It did seem to be bulky enough, but I just do not think the world’s hide and seek champion would be caught out in the open on the prairie like that. Peter Von Berg responds: May 28th, 2019 at 10:07 am AS USUAL too far away. AS USUAL blurry. AS USUAL just a glimpse. A giggling teenager. Doesn’t exactly inspire confidence. LadyPhoenix responds: May 29th, 2020 at 1:34 am The commentary leads me to believe they knew this was a person. The man’s words seem geared to try to half convince us, not even doing so well, and the giggling of the other person makes the whole thing look even more faked. The video itself, you can’t really tell anything. Nothing for size reference, no details, etc. I think they are real, but this isn’t solid evidence. Sorry. Comments have been closed. |Top | Content|'''
