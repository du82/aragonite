full_description = '''Man v. Monster: Brazilian Bigfoot on Nat Geo Wild Tonight! Posted by: Craig Woolheater on December 7th, 2012 Man v. Monster: Brazilian Bigfoot Premieres on Nat Geo Wild at 10pm ET Friday 7th December Photograph by Nat Geo Wild / Optomen / Jeff Allen Richard Terry sets up cameras in the Brazilian rainforest. For generations, tales of a creature called the mapinguari have been passed down among Amazonian villagers. They describe a tall, shaggy beast that attacks with little warning, calling out with a deafening roar. In the world’s largest rainforest, new species are discovered every few days, and after hearing stories from villagers who claim they came face to face with the creature, Richard Terry tries to determine whether the mapinguari is more than a myth. Richard Terry, host of the show and a fan of Cryptomundo, offered his personal thoughts for this episode to be shared with the Cryptomundians: For Man v Monster series 2 we filmed two stories in Brazil back-to-back, ‘Amazon River Beast’ & ‘Brazilian Bigfoot’. The second of these was the story that concerned me the most as it would be directly dealing with a mythical Bigfoot-like creature known in Brazil as the Mapinguari. On the previous episodes, our aim was to find out what were the real animals behind mythological creatures that indigenous people from some pretty far-flung locations, believe were responsible for gruesome and often fatal attacks on their kin. We also set out to discover why animals known to us from the outset such as the Bengal tiger, had been on a man-eating spree – incidence of which are on the rise in the Sundarbans region of India and Bangladesh. As the team & I entered the arrival hall of Manaus airport, gateway to the Amazon region, I saw the familiar face of my guide Samuel who I’d previously spent a memorable couple of weeks a year earlier, looking for a Goliath Bird Eating spider. As soon as we started to catch-up over strong coffee, he started to tell me about his exhaustive efforts to find people who could give me eye witness accounts of encounters with the Mapinguari. It was in the airport that my enthusiasm for this story changed when I saw in the eyes of a man I trust, excitement and belief as he explained the accounts of one man’s encounter with this legendary beast – a man that Samuel trusts beyond any other, his own father. He told me these discussions had never happened in any depth until now during his research quest. He was shocked to discover that his own family had a connection to the Mapinguari legend and had experienced a graphic and memorable attack. Samuel explained that his father could clearly recount what he had been told by his own father, Samuel’s grandfather, about a terrifying encounter with the Mapinguari in the remote border region of Brazil & Venezuela. He said that he came face to face with an unearthly beast. He was convinced it was the Mapinguari, which had entered his remote cabin at night. It was so large that when it stood upright roaring at him, it lifted the wooden ceiling. Apparently the creature knocked the man to the ground with one powerful lunge of its arm, breaking his jaw. He believes he was only able to save himself having had a gun which he used to fire a round directly into the shaggy haired monster that fled leaving a trail of blood. When I looked directly into master tracker & guide Samuel’s eyes and saw not a glimmer of mischievousness, I knew the story was on. The premiere of Brazilian Bigfoot is broadcast in the US on Nat Geo Wild at 10pm ET Friday 7th December.Richard Terry About Craig Woolheater Co-founder of Cryptomundo in 2005. I have appeared in or contributed to the following TV programs, documentaries and films: OLN's Mysterious Encounters: "Caddo Critter", Southern Fried Bigfoot, Travel Channel's Weird Travels: "Bigfoot", History Channel's MonsterQuest: "Swamp Stalker", The Wild Man of the Navidad, Destination America's Monsters and Mysteries in America: Texas Terror - Lake Worth Monster, Animal Planet's Finding Bigfoot: Return to Boggy Creek and Beast of the Bayou. Email • Facebook • Twitter • Pinterest • Instagram • This entry was posted on Friday, December 7th, 2012 at 9:00 am and is filed under Bigfoot, Bigfoot Report, Cryptomundo Exclusive, Cryptotourism, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Folklore, Mapinguary, Men in Cryptozoology, Photos, Sasquatch, Television, Videos. You can follow responses via our RSS 2.0 feed. Both comments and pings are currently closed. Facebook Google+ Twitter Pinterest Email Print Delicious Digg Fark Google Instapaper LinkedIn MySpace Newsvine Pocket Readability Reddit StumbleUpon Tumblr Yahoo! Related Posts Beasts in the Mist Momo Is Here! Bobo Gets News of a Recent Mapinguari Sighting Searching For the Amazon's Bigfoot, the Mapinguari, By Night Squatch and Learn About Bigfoot's Eating Habits 8 Responses to “Man v. Monster: Brazilian Bigfoot on Nat Geo Wild Tonight!” DWA responds: December 7th, 2012 at 9:54 am The thing next to the game camera! That’s what happens: THEY GET ATTRACTED TO THE WRONG SIDE OF THE CAMERA… Anybody notice how NatGeo is like all over this, and we have one running around our own backyards…? John Thompson via Facebook responds: December 7th, 2012 at 10:31 am mapinguari-saw a show about it a while ago believed to be Giant Ground Sloth that has survived since the Pleistocene MR JOSHUA responds: December 7th, 2012 at 12:36 pm Mainstream media is all over Bigfoot now because the subject brings in the ratings which equals the $$. The more shows like this the better, keeps my DVR nice and full. @DWA – Richard Terry is probably afraid of getting jumped in the woods by MoneyMaker since the USA is “his turf.” If we have learned anything from the Ketchum situation it is that Matt Moneymaker is the only person allowed to discover Bigfoot in the USA. Alamo responds: December 7th, 2012 at 2:08 pm Hah, yah right DWA, Somebody told him, “You got to BE the Sasquatch ” and this guy went all the way… if they filmed the episode in the Pacific Northwest then the producers wouldn’t get to play in Rio, the star wouldn’t get to tromp around the jungle harassing half nekked Amazonian chicks, Bigfoot might actually get discovered… nobody wins… bl00p responds: December 7th, 2012 at 2:32 pm The “Beast Hunter” program, also on Nat Geo Wild, if I remember correctly, had an episode dealing with the mapinguari, but they seemed to characterize it more as some sort of relic giant sloth than a Sasquatch. sasquatch responds: December 8th, 2012 at 1:34 am I think it’d be cool if they found a giant sloth still kicking around the amazon. cryptokellie responds: December 8th, 2012 at 5:04 pm Much ado about nothing but an OK show anyway…you got to give the guy his due for tromping around all that…The only thing I dislike about these shows are the “What was that” hold your breath – teaser into the commercial breaks. You know certainly that nothing is going to happen or we would have heard about it already. From Ghost Hunters to Destination Truth, they all do it. I kinda like Destination Truth though…some nice humor and…did I just see Jael? sasquatch responds: December 8th, 2012 at 6:05 pm Yeah, there’s more humor in Destination Truth. When’s that coming back? I just hate it when they do the Ghost Hunters shtick on there. “If you can hear us, can you make your presence known?” I yi, yi…hue boy…I tune in for critters, NOT puff of smoke, cold spot in the room stuff….yeah right. Sorry. Comments have been closed. |Top | Content|'''
