full_description = "Archive for the “Extinct” Beasts in the Mist Posted by: Craig Woolheater on October 22nd, 2024 “What a bankrupt world it would be if you refused to believe things existed until you actually had seen a specimen in a museum. I mean, there are lots of things we are prepared to believe exist without having seen them,” Read: Beasts in the Mist » Categorized as: Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Extinct, Eyewitness Accounts, Mapinguary, Megafauna | Comments Off on Beasts in the Mist Return of the Dodo? Posted by: Craig Woolheater on February 2nd, 2023 Return of the Dodo? Scientists launch project to bring back the extinct species using stem cell technology – more than 350 YEARS after it was wiped out Read: Return of the Dodo? » Categorized as: Bigfoot Report, Extinct, Living Fossils, Pop Culture, Thylacine, Weird Animal News | Comments Off on Return of the Dodo? Zanzibar Leopard Captured on Camera, Despite Being Declared Extinct Posted by: Craig Woolheater on June 8th, 2018 The Zanzibar leopard was officially declared extinct 25 years ago, but the classification has been called into question after a wildlife biologist caught the elusive predator on camera. Read: Zanzibar Leopard Captured on Camera, Despite Being Declared Extinct » Categorized as: Alien Big Cats, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Extinct, Mystery Cats, Phantom Panthers, Television | 1 Comment » Extinct or Alive Posted by: Craig Woolheater on June 8th, 2018 What if extinct animals weren’t really extinct? The methods used to declare a species extinct are not as fool proof as people might assume. From eyewitness accounts to last known photographs, there is evidence that suggests some of these creatures are still very much alive in the wild. Read: Extinct or Alive » Categorized as: Alien Big Cats, Bigfoot Report, Cryptozoologists, Cryptozoology, Expedition Reports, Extinct, Mystery Cats, Phantom Panthers, Television, Thylacine | Comments Off on Extinct or Alive The Meg: Pleased To Eat You Posted by: Craig Woolheater on April 13th, 2018 In the film, a deep-sea submersible—part of an international undersea observation program—has been attacked by a massive creature, previously thought to be extinct, and now lies disabled at the bottom of the deepest trench in the Pacific…with its crew trapped inside. With time running out, expert deep sea rescue diver Jonas Taylor (Jason Statham) is recruited by a visionary Chinese oceanographer (Winston Chao), against the wishes of his daughter Suyin (Li Bingbing), to save the crew—and the ocean itself—from this unstoppable threat: a pre-historic 75-foot-long shark known as the Megalodon. What no one could have imagined is that, years before, Taylor had encountered this same terrifying creature. Now, teamed with Suyin, he must confront his fears and risk his own life to save everyone trapped below…bringing him face to face once more with the greatest and largest predator of all time. Read: The Meg: Pleased To Eat You » Categorized as: Bigfoot Report, Cinema News, Cryptid Cinema, Cryptozoology, Extinct, Megalodon, Pop Culture, Sea Monsters | 1 Comment » Is the Ozenkadnook Tiger a Cardboard Cryptid? Posted by: Karl Shuker on September 12th, 2017 One of cryptozoology’s most iconic images is the so-called Ozenkadnook Tiger Photograph, reproduced below. It depicts a large, seemingly dark-bodied, white-striped Australian mystery beast supposedly snapped in b/w during 1964 by Melbourne-based Rilla Martin while holidaying in Victoria. She had apparently been driving along a dirt track near Ozenkadnook when she saw the creature at the edge of some woods, and after stopping the car she managed to snap a single photo of it before it ran off. Read: Is the Ozenkadnook Tiger a Cardboard Cryptid? » Categorized as: Cryptid Canids, Cryptozoology, Extinct, Eyewitness Accounts, Hoaxes, Photos, ShukerNature, Thylacine, Women in Cryptozoology | 1 Comment » The Jaws of Megalodon – Shark of Nightmare…and Reality? Posted by: Karl Shuker on August 17th, 2017 It was only ever going to be a matter of time before my blog ShukerNature boldly went where it had never gone before, by confronting what may well be not only the most terrifying cryptid of all time but also the most controversial one – the cryptid that dare not speak its name, in fact, because that name is…Megalodon! Read: The Jaws of Megalodon – Shark of Nightmare…and Reality? » Categorized as: Books, Cryptozoology, Extinct, Eyewitness Accounts, Fossil Finds, Living Fossils, Megalodon, Sea Monsters, ShukerNature | 3 Comments » Sasquatch Conservation Before Discovery Posted by: Craig Woolheater on August 8th, 2017 On the face of it, cryptozoology has little in common with mainstream conservation. First, it is widely held to be a “pseudoscience”, because it does not follow the scientific methods so central to conservation biology. Many conservation scientists would find the idea of being identified with monsters and monster-hunters embarrassing. Read: Sasquatch Conservation Before Discovery » Categorized as: Bigfoot, Bigfoot Report, Cryptotourism, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Extinct, Lake Monsters, Loch Ness Monster, Pop Culture, Sasquatch | 1 Comment » Tasmanian Tiger Footage? Posted by: Craig Woolheater on July 6th, 2017 Could This be a Tasmanian Tiger? Read: Tasmanian Tiger Footage? » Categorized as: Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Extinct, Eyewitness Accounts, Pop Culture, Thylacine, Videos | 12 Comments » How Embarrassing: New Red-Faced Parrot Species! Posted by: Chalupacabra on July 3rd, 2017 Ornithologists stress importance of conserving the blue-winged Amazon parrot, with no more than 100 of the birds thought to be in existence Read: How Embarrassing: New Red-Faced Parrot Species! » Categorized as: Bigfoot Report, Cryptozoology, Evidence, Extinct, New Species | Comments Off on How Embarrassing: New Red-Faced Parrot Species! Remembrance Day for Lost Species Posted by: Craig Woolheater on November 30th, 2016 Not only is today the Remembrance Day for Lost Species, but this year also marked the 80th anniversary of the death of the last known Tasmanian Tiger in captivity, Benjamin. Read: Remembrance Day for Lost Species » Categorized as: Bigfoot Report, Cryptid Canids, Cryptozoology, Extinct, Megafauna, Thylacine, Videos | Comments Off on Remembrance Day for Lost Species Still In Search Of Prehistoric Survivors Posted by: Karl Shuker on November 29th, 2016 It has been 21 years since the original publication back in 1995 of In Search of Prehistoric Survivors, considered by many to be my finest cryptozoological volume. Not surprisingly, then, in subsequent years there has been a growing, persistent clamour among its numerous fans worldwide for me to prepare a new, updated edition. Now, at last, fulfilling a longstanding promise, I have done so – and what an update it is! Read: Still In Search Of Prehistoric Survivors » Categorized as: Avian Mysteries, Books, Cadborosaurus, Champ/Lake Champlain Monster, Coelacanth, Cryptid Canids, Cryptoart, Cryptozoology, Extinct, Eyewitness Accounts, Giant Cryptid Reptiles, Lake Monsters, Living Dinosaurs, Living Fossils, Loch Ness Monster, Mapinguary, Megafauna, Megalodon, Mokele-Mbembe, Mystery Cats, Ogopogo, River Monsters, Sea Monsters, Sea Serpents, ShukerNature, Swamp Monsters, Thunderbirds, Thylacine, Winged Weirdies | Comments Off on Still In Search Of Prehistoric Survivors New Homo Floresiensis Dates May Quash Cryptozoology Theories About ‘Hobbits’ Posted by: Craig Woolheater on July 5th, 2016 Originally placed at 100,000-12,000 years ago, Homo floresiensis would have overlapped in time with modern humans, long after H. erectus and even Neandertals essentially disappeared. One of the more fascinating proposed connections between the “hobbits” and humans comes from Indonesian folklore, in the form of Ebu Gogo and Orang Pendek. Read: New Homo Floresiensis Dates May Quash Cryptozoology Theories About ‘Hobbits’ » Categorized as: Cryptozoologists, Cryptozoology, Evidence, Extinct, Fossil Finds, Homo floresiensis, Orang Pendek | 1 Comment » Megalania – A Monster Still Among Us? Posted by: Nick Redfern on July 23rd, 2015 Is it feasible that the subtropical rainforests of Australia are home to gigantic, marauding lizards of twenty to thirty feet in length? Could such Jurassic Park-like beasts really remain hidden, undetected, and free to rampage around in near-unstoppable fashion? Just maybe, the answer is “yes.” Read: Megalania – A Monster Still Among Us? » Categorized as: Cryptozoology, Extinct, Eyewitness Accounts, Giant Cryptid Reptiles, Lair of the Beasts, Living Dinosaurs, Living Fossils, Megafauna, Movie Monsters | 6 Comments » The Last of the Irish Elks? Posted by: Karl Shuker on July 15th, 2015 One of the most spectacular members of the Eurasian Pleistocene megafauna was the Irish elk Megaloceros giganteus. Formally described in 1799, it is also aptly known as the giant deer, as its largest known representatives were only marginally under 7 ft tall at the shoulder and bore massive antlers spanning up to 12 ft, but did this magnificent species linger on into historic times? Read: The Last of the Irish Elks? » Categorized as: Cryptozoology, Evidence, Extinct, Folklore, Forensic Science, Fossil Finds, Megafauna, ShukerNature | Comments Off on The Last of the Irish Elks? var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '803977', Size: '300250'}; « Older Posts | |Top | Content|"
