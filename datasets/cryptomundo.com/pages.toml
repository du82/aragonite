full_description = "New Ogopogo Video Posted by: John Kirk on July 24th, 2016 On July 11th a group of hikers from Calgary were in the Paul’s Tomb area when they spotted something in Okanagan Lake. They recorded the object briefly. Whatever it is, appears to be below the surface. It is certainly not conclusive, merely interesting. Visitors from Calgary noticed an interesting swimming object off Paul’s Tomb on July 11, 2016. (Video contributed by Kaiden Phan, posted by Carmen Weld) About John Kirk One of the founders of the BCSCC, John Kirk has enjoyed a varied and exciting career path. Both a print and broadcast journalist, John Kirk has in recent years been at the forefront of much of the BCSCC’s expeditions, investigations and publishing. John has been particularly interested in the phenomenon of unknown aquatic cryptids around the world and is the author of In the Domain of the Lake Monsters (Key Porter Books, 1998). In addition to his interest in freshwater cryptids, John has been keenly interested in investigating the possible existence of sasquatch and other bipedal hominids of the world, and in particular, the Yeren of China. John is also chairman of the Crypto Safari organization, which specializes in sending teams of investigators to remote parts of the world to search for animals as yet unidentified by science. John travelled with a Crypto Safari team to Cameroon and northern Republic of Congo to interview witnesses among the Baka pygmies and Bantu bushmen who have sighted a large unknown animal that bears more than a superficial resemblance to a dinosaur. Since 1996, John Kirk has been editor and publisher of the BCSCC Quarterly which is the flagship publication of the BCSCC. In demand at conferences, seminars, lectures and on television and radio programs, John has spoken all over North America and has appeared in programs on NBC, ABC, CBS, PBS, TLC, Discovery, CBC, CTV and the BBC. In his personal life John spends much time studying the histories of Scottish Clans and is himself the president of the Clan Kirk Society. John is also an avid soccer enthusiast and player. Email • Facebook • Twitter • This entry was posted on Sunday, July 24th, 2016 at 2:06 pm and is filed under Cryptid Universe, Cryptozoology, Evidence, Eyewitness Accounts, Lake Monsters, Videos. You can follow responses via our RSS 2.0 feed. Both comments and pings are currently closed. Facebook Google+ Twitter Pinterest Email Print Delicious Digg Fark Google Instapaper LinkedIn MySpace Newsvine Pocket Readability Reddit StumbleUpon Tumblr Yahoo! Related Posts 2018 Ogopogo Footage Momo Is Here! Monstro Bizarro Nite Callers BF Radio Presents: John Kirk & Winona Alexis of British Columbia Aquatic Cryptid Marathon 7 Responses to “New Ogopogo Video” KnuckleHead responds: July 26th, 2016 at 1:06 am What are supposed to be looking at? Looks like breaching bait fish no large shadows or anything like that. Is that what Is supposed to be ogopogo? Oh well I knew it would hard to see anything but this is ridiculous. mandors responds: July 26th, 2016 at 10:26 am Interesting. We have white water. That means something is actively disturbing the water. So often, these “monster” videos are nothing but cross currents or waves flowing over the surface. White water, absent a river, means froth, either from something in the water, wind blowing over the water or both. So something is going on. The other thing to remember is that whatever is in the water, the people can see it better than the camera phone. If there’s a “body” or “neck,” the people can see it when the camera doesn’t. They are pretty far from the action, so I’d guess that it’s a sizable occurrence. So the question quite literally is what’s making so big a splash. dconstrukt responds: July 26th, 2016 at 3:39 pm @Mandor’s – something is making the splash…. but the question anyone with half a brain is asking… why on earth would someone ASSume its a lake monster? god forbid its a FISH. 🙂 Dr. Scholl responds: July 28th, 2016 at 5:17 pm I do see something large, serpentine (as ogopogo is reported to be), and lightly-colored under the water that looks like it is looped over itself that is present both before the splash is seen and after. It seems to have been swimming to the left side of the screen then changed direction looping over itself up and to the right as the photographer starts filming. The splash comes out of the end of the “coiled” part where I suppose a head would be if this large object was in fact a large living creature. It is interesting and telling that there is not more footage showing what this object does next; it actually seems to moving to the right while the camera shifts to the right, loses it a bit, and then back a bit to the left. The photographer has a clear view of the area, and the object is right under the surface; now this short clip is suspect to me. If the object had kept moving under the surface of the water, or dove and just disappeared while the film had kept rolling focused on it we could hopefully determine that the object is single living thing and not a shoal of fish or eels that is on the move, and coincidentally swimming over a sandbar while jumping. It would be good to see a shot of this same view from another day to see if that shape is still under the water; it is really big, far bigger than a boat would be gaging from the size of objects/plants on the edge of the lake it appears to be right in the middle of the lake. Videos like this are fine, but honestly I can’t understand why no one can seem to film things like this in a more useful manner. I would have done everything I could to keep my camera on that thing! So disappointing… dconstrukt responds: July 29th, 2016 at 7:20 am lol… how the hell are you seeing all this from that video? i don’t see anything remotely to what you’re describing! mandors responds: August 1st, 2016 at 9:54 am @Dconstrukt — Yeah, the whole jumping to lake monster is a bit much. The more important point is that unlike a rip current, there IS something in the water. What it is we don’t know. That’s what makes it interesting. It’s not a boat. I am of the school that says if it’s an unrecorded species of carp or sturgeon–that’s cool. Because isn’t that what we’re really after: not “monsters” but new species? How many people geeked out when they first saw the giant squid footage a few years ago? I did. So that’s how I look at all these “lake monster” sightings and video. dconstrukt responds: August 2nd, 2016 at 8:28 am @Mandors – yeah… but they’ve also studied the lake and found GASES rising to the top can and do cause those “unexplained” bubbles…. and why wouldn’t this just be a fish? or a school of fish? why the giant leap to “lake monster”? dunno what “it” is… is there like really good video of “it”? I remember hearing stuff back in the 80’s as a kid about this… could it be a fish that migrates there? so its only seen occasionally? could it be a really MASSIVE sturgeon? who knows. Sorry. Comments have been closed. |Top | Content|"
