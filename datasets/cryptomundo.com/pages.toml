full_description = "Archive for the “Folklore” It’s a Giant! CryptoConspiracy? Posted by: Craig Woolheater on February 1st, 2023 He found Giants then the Government Found Him | What really happened to Andrew Dawson? Read: It’s a Giant! CryptoConspiracy? » Categorized as: Bigfoot, Bigfoot Report, Conspiracies, Cryptozoology, Eyewitness Accounts, Folklore, Pop Culture, Sasquatch, Videos, Viral Videos | Comments Off on It’s a Giant! CryptoConspiracy? 2018 Texas Bigfoot Conference Posted by: Craig Woolheater on September 6th, 2018 Michael and Diana Esordi of googz & co have designed and created some really cool merchandise for the upcoming 2018 Texas Bigfoot Conference coming up October 20th in Jefferson, TX. Read: 2018 Texas Bigfoot Conference » Categorized as: Bigfoot, Bigfoot Report, Books, Conferences, Cryptid Cinema, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Evidence, Expedition Reports, Eyewitness Accounts, Festivals, Folklore, Footprint Evidence, Pop Culture, Sasquatch, Swamp Monsters | Comments Off on 2018 Texas Bigfoot Conference Earthquake and Tsunami Warnings Send Alaska Bigfoot Heading for the Hills Posted by: Loren Coleman on January 24th, 2018 …during the recent tsunami warning there, three Native families saw “Bigfoot-like creatures heading up the hills to higher grounds.” Multiple tracks were seen. Read: Earthquake and Tsunami Warnings Send Alaska Bigfoot Heading for the Hills » Categorized as: Bigfoot, Breaking News, CryptoZoo News, Cryptozoologists, Cryptozoology, Eyewitness Accounts, Folklore, Footprint Evidence, Pop Culture, Sasquatch | 1 Comment » Bigfoot belongs and its habitat needs protection Posted by: Craig Woolheater on September 24th, 2017 “Bigfoot shows what could have been and what still could be, if we only treated the land as if it were really there,” he writes. “The very wildness from which the Bigfoot myth emanates is disappearing fast.” Read: Bigfoot belongs and its habitat needs protection » Categorized as: Bigfoot, Bigfoot Report, Books, Cryptozoology, Expedition Reports, Folklore, Pop Culture, Sasquatch | 1 Comment » Maine’s first International Crypto Con. Dogmen? Check. Bigfoot? You bet. Posted by: Craig Woolheater on September 2nd, 2017 It starts bright and early with lake monsters and wraps up more than 12 hours later with the first New England screening of “The Mothman of Pleasant Point.” Read: Maine’s first International Crypto Con. Dogmen? Check. Bigfoot? You bet. » Categorized as: 50th Anniversary Tributes, Bigfoot, Bigfoot Report, Conferences, Cryptid Canids, Cryptid Cinema, Cryptotourism, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Folklore, International Cryptozoology Museum, Lake Monsters, Mothman, Museums, Pop Culture, Sasquatch, Sea Monsters, Sea Serpents | Comments Off on Maine’s first International Crypto Con. Dogmen? Check. Bigfoot? You bet. Expedition: BIGFOOT! Posted by: Craig Woolheater on August 30th, 2017 Expedition: BIGFOOT! Is a 4000sqft complex where you will see the countries largest permanent display of genuine Bigfoot artifacts, life sized exhibits, photos, sketches, large up to date sighting maps, and the World’s only Bigfoot Research and Tech Vehicle on display. Read: Expedition: BIGFOOT! » Categorized as: Bigfoot, Bigfoot Report, Cryptotourism, Cryptozoology, Folklore, Footprint Evidence, Museums, Pop Culture, Sasquatch | Comments Off on Expedition: BIGFOOT! International Cryptozoology Conference Posted by: Craig Woolheater on August 29th, 2017 The International Cryptozoology Conference 2017 (ICC17), presented by the International Cryptozoology Society and International Cryptozoology Museum, will be held in Portland, Maine, on Labor Day Weekend, specifically on Sunday, September 3, 2017. Read: International Cryptozoology Conference » Categorized as: 50th Anniversary Tributes, Bigfoot, Bigfoot Report, Conferences, Cryptid Cinema, Cryptotourism, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Evidence, Eyewitness Accounts, Folklore, International Cryptozoology Museum, Lake Monsters, Mothman, Pop Culture, Sasquatch, Sea Monsters, Sea Serpents | Comments Off on International Cryptozoology Conference Searching for the Yeti Posted by: Craig Woolheater on August 15th, 2017 There is a Yeti animal. But explaining the animal mystery turns out not to explain the Yeti’s story. Read: Searching for the Yeti » Categorized as: Abominable Snowman, Bigfoot Report, Books, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Folklore, Footprint Evidence, Yeti | 3 Comments » 2017 Texas Bigfoot Conference Swag Posted by: Craig Woolheater on August 14th, 2017 Michael and Diana Esordi of googz & co have designed and created some really cool merchandise for the upcoming 2017 Texas Bigfoot Conference coming up October 7th in Jefferson, TX. Read: 2017 Texas Bigfoot Conference Swag » Categorized as: Bigfoot, Bigfoot Report, Books, Conferences, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Evidence, Expedition Reports, Eyewitness Accounts, Festivals, Finding Bigfoot, Folklore, Footprint Evidence, Pop Culture, Sasquatch | Comments Off on 2017 Texas Bigfoot Conference Swag Monsters Among Us: Part Deux Posted by: Shannon LeGro on August 10th, 2017 Derek Hayes of the Monsters Among Us Podcast brings to this episode, three of his favorite calls shared into his hotline. These are the encounters as told by the witnesses. A mysterious creature spotted in the road in Vermont, a massive Grasshopper/Mantis walking near cornfields in Illinois, and the infamous Mirrored Men as shared originally on Monsters Among Us. Read: Monsters Among Us: Part Deux » Categorized as: Bigfoot, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Folklore, Forteana, Into The Fray, Megafauna, Out of Place, Paranormal Investigators, Podcast, Pop Culture, Sasquatch | Comments Off on Monsters Among Us: Part Deux Happy Sea Serpent Day! Posted by: Craig Woolheater on August 7th, 2017 The far reaches of the ocean are dark and cold and unsettling. Who even knows what creatures lurk in the murky waters of the Northern Atlantic or near the Mariana Trench. Though uncertain, there are certainly things living in these places; unusual sea creatures, with long sinewy bodies and razor sharp teeth; sea serpents. Strange ocean creatures that are the reason for today’s zany holiday, Sea Serpent Day! Read: Happy Sea Serpent Day! » Categorized as: Bigfoot Report, Cryptozoology, Folklore, Lake Monsters, Pop Culture, River Monsters, Sea Monsters, Sea Serpents | 1 Comment » Wildman: My Search for Sasquatch Posted by: Craig Woolheater on July 20th, 2017 This feature length documentary by Mountain Beast Entertainment chronicles the search for the legendary Bigfoot by filmmaker and adventurer Justin Chernipeski. Read: Wildman: My Search for Sasquatch » Categorized as: Bigfoot, Bigfoot Report, Cryptid Cinema, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Folklore, Pop Culture, Sasquatch | Comments Off on Wildman: My Search for Sasquatch Skinwalker Captured on Video? Posted by: Craig Woolheater on July 14th, 2017 Shapeshifter or Sasquatch? Read: Skinwalker Captured on Video? » Categorized as: Bigfoot, Bigfoot Report, Cryptozoology, Evidence, Folklore, Pop Culture, Sasquatch, Social Media, Videos | 6 Comments » Monsters Among Us Podcast Posted by: Shannon LeGro on June 13th, 2017 Monsters Among Us is a call in show about monsters, and the unexplained. On the latest episode, host Derek Hayes discusses a pair of U.F.O. sightings, a run in with possible MIB’s and yet another mirrored men encounter. New shows released every Thursday evening. Read: Monsters Among Us Podcast » Categorized as: Bigfoot, Chupacabras, Conspiracies, Cryptozoology, Evidence, Eyewitness Accounts, Flying Humanoids, Folklore, Forteana, Into The Fray, Lake Monsters, Mothman, Mystery Cats, Out of Place, Phantom Panthers, Podcast, Pop Culture, River Monsters, Sasquatch, Sea Monsters, Skeptical Discussions, Swamp Monsters, Thunderbirds, Yeren, Yeti, Yowie | 2 Comments » After Hours with Peter Byrne Posted by: Craig Woolheater on June 1st, 2017 When he was a child in Ireland, Peter Byrne’s father used to tell him bedtime stories about the yeti. As a young man, Byrne spent years in the Himalayas, and later—once he was convinced by bigfoot tracks and Native American lore—he traveled across five continents in search of bigfoot. This man is one of the four horsemen of Bigfoot, a true living legend. Enjoy this very special After Hours with Rictor. Read: After Hours with Peter Byrne » Categorized as: Abominable Snowman, Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Folklore, Footprint Evidence, Podcast, Pop Culture, Sasquatch, Yeti | 1 Comment » var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '803977', Size: '300250'}; « Older Posts | |Top | Content|"
