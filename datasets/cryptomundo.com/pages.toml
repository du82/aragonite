full_description = "Archive for the “Conspiracies” It’s a Giant! CryptoConspiracy? Posted by: Craig Woolheater on February 1st, 2023 He found Giants then the Government Found Him | What really happened to Andrew Dawson? Read: It’s a Giant! CryptoConspiracy? » Categorized as: Bigfoot, Bigfoot Report, Conspiracies, Cryptozoology, Eyewitness Accounts, Folklore, Pop Culture, Sasquatch, Videos, Viral Videos | Comments Off on It’s a Giant! CryptoConspiracy? Monsters Among Us Podcast Posted by: Shannon LeGro on June 13th, 2017 Monsters Among Us is a call in show about monsters, and the unexplained. On the latest episode, host Derek Hayes discusses a pair of U.F.O. sightings, a run in with possible MIB’s and yet another mirrored men encounter. New shows released every Thursday evening. Read: Monsters Among Us Podcast » Categorized as: Bigfoot, Chupacabras, Conspiracies, Cryptozoology, Evidence, Eyewitness Accounts, Flying Humanoids, Folklore, Forteana, Into The Fray, Lake Monsters, Mothman, Mystery Cats, Out of Place, Phantom Panthers, Podcast, Pop Culture, River Monsters, Sasquatch, Sea Monsters, Skeptical Discussions, Swamp Monsters, Thunderbirds, Yeren, Yeti, Yowie | 2 Comments » Reminder: Bigfoot Bonanza This Weekend! Posted by: Craig Woolheater on March 11th, 2017 Come to San Francisco for three days of classic Bigfoot and Yeti movies with documentaries on both screens in the haunted and historic Balboa Theatre! Guest Speakers Cliff Barackman, Kathy Strain, John Freitas & Montra L. Freitas, Lex, Samantha and Sara of The Ultimate Female Bigfoot Team, Plus Film-makers Seth Breedlove of Small Town Monsters from Ohio and Craig Flipy from Portland, showing their films and doing a Q & A! Read: Reminder: Bigfoot Bonanza This Weekend! » Categorized as: Abominable Snowman, Bigfoot, Bigfoot Report, Cinema News, Conspiracies, Cryptid Cinema, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Festivals, Movie Monsters, Pop Culture, Sasquatch, Skunk Apes, Swamp Monsters, Television, Yeti | Comments Off on Reminder: Bigfoot Bonanza This Weekend! Bigfoot, “Government Agents,” and “Giants” Posted by: Nick Redfern on August 9th, 2016 Back in the mid-1950s, a highly unusual and brief account of a cryptozoological nature surfaced. Read: Bigfoot, “Government Agents,” and “Giants” » Categorized as: Bigfoot, Conspiracies, Cryptozoology, Eyewitness Accounts, Folklore, Lair of the Beasts, Sasquatch, True Giant | Comments Off on Bigfoot, “Government Agents,” and “Giants” Watch the Were-Monster Here! Posted by: Craig Woolheater on February 4th, 2016 Watch the full episode of the X-Files here! Read: Watch the Were-Monster Here! » Categorized as: Bigfoot Report, Conspiracies, Cryptozoology, Giant Cryptid Reptiles, Lizard People, Pop Culture, Television, Videos | Comments Off on Watch the Were-Monster Here! The X-Files | Case Files: “Mulder and Scully Meet The Were-Monster” Posted by: Craig Woolheater on February 2nd, 2016 The X-Files cast and crew open the case files and tease the frightening mystery behind the “Were-Monster.” Read: The X-Files | Case Files: “Mulder and Scully Meet The Were-Monster” » Categorized as: Bigfoot Report, Conspiracies, Cryptozoology, Giant Cryptid Reptiles, Lizard People, Pop Culture, Television, Videos | 1 Comment » The X-Files: Mulder & Scully Meet the Were-Monster Posted by: Craig Woolheater on February 1st, 2016 Mulder & Scully are in search of a “man-size horn lizard with human teeth.” Guest starring cryptid enthusiast Rhys Darby of The Cryptid Factor. Read: The X-Files: Mulder & Scully Meet the Were-Monster » Categorized as: Bigfoot Report, Conspiracies, Cryptozoology, Giant Cryptid Reptiles, Lizard People, Pop Culture, Television, Videos | Comments Off on The X-Files: Mulder & Scully Meet the Were-Monster The X-Files: Mulder & Scully Meet the Were-Monster Posted by: Craig Woolheater on February 1st, 2016 Witnesses claim a strange creature was responsible for killing a person in the woods; Mulder confronts some of his own demons. Read: The X-Files: Mulder & Scully Meet the Were-Monster » Categorized as: Bigfoot Report, Conspiracies, Cryptozoology, Giant Cryptid Reptiles, Lizard People, Pop Culture, Television, Videos | 1 Comment » Another Team Is Caught DRAGGING Bigfoot’s DEAD Body! Posted by: Craig Woolheater on January 27th, 2016 Appalachian Investigators of Mysterious Sightings travel to Harrison County, Ohio to investigate “The Stonish Giant”, a Bigfoot that Native American folklore says has a coat of fur so thick that it cannot be pierced by arrows. Read: Another Team Is Caught DRAGGING Bigfoot’s DEAD Body! » Categorized as: Bigfoot, Bigfoot Report, Conspiracies, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Pop Culture, Sasquatch, Television, Videos | 3 Comments » iNTO THE FRAY-Boundaries Crossed Tonight Posted by: Shannon LeGro on October 22nd, 2015 So far, iTF has covered UFO’s, serial killers and even massive flying insects. We now travel to the woods and hear a terrifying Sasquatch encounter from David. Read: iNTO THE FRAY-Boundaries Crossed Tonight » Categorized as: Bigfoot, Conspiracies, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Into The Fray, Podcast, Pop Culture, Sasquatch | Comments Off on iNTO THE FRAY-Boundaries Crossed Tonight iNTO THE FRAY Mister-Sam Shearon Tonight Posted by: Shannon LeGro on October 1st, 2015 Dark Artist, Mister-Sam Shearon rounds out my team for iNTO THE FRAY. He encouraged me throughout the process of creating the show and is also the brainchild behind my logos, artwork and upcoming merchandise. I am lucky to call him a friend as well as a colleague and will be joining us on our many adventures down the rabbit hole. He has had many interesting personal experiences, a few of which we touch on in this episode. P.S. Send me the emails about your anomalous, large insect sightings. You’ll understand why later. But first, Ryan and I discuss big Interstellar news, and then touch on a flying humanoid report out of PA. Read: iNTO THE FRAY Mister-Sam Shearon Tonight » Categorized as: Conspiracies, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Flying Humanoids, Folklore, Into The Fray, Mothman, Podcast, Pop Culture | Comments Off on iNTO THE FRAY Mister-Sam Shearon Tonight Strange Sasquatch Encounter And The Government Posted by: Craig Woolheater on September 2nd, 2015 This is a very interesting encounter. The creature approached this home and was seen by multiple witnesses. Read: Strange Sasquatch Encounter And The Government » Categorized as: Bigfoot, Bigfoot Report, Conspiracies, Cryptozoologists, Cryptozoology, Eyewitness Accounts, Footprint Evidence, Pop Culture, Sasquatch, Sasquatch Chronicles, Television, Videos | 4 Comments » Bigfoot and the BLM Posted by: Craig Woolheater on August 16th, 2015 The BLM does not necessarily believe in the existence of Bigfoot. Or do they? Read: Bigfoot and the BLM » Categorized as: Bigfoot, Bigfoot Report, Conspiracies, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Pop Culture, Sasquatch, Social Media, Videos | 2 Comments » Les Stroud Talks About Government Involvement With Bigfoot Posted by: Craig Woolheater on August 7th, 2015 Survivorman describes the plausible efforts of global timber barons who want nothing more than to shroud the Bigfoot phenomena. Read: Les Stroud Talks About Government Involvement With Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Conferences, Conspiracies, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Pop Culture, Sasquatch, Social Media, Videos | 1 Comment » Coast to Coast AM: Nick Redfern Tonight! Posted by: Nick Redfern on May 24th, 2015 I’ll be on Coast to Coast AM tomorrow morning, 2AM to 4AM central time, speaking about my new book, “Secret History.” Then sleeping until I wake! Read: Coast to Coast AM: Nick Redfern Tonight! » Categorized as: Conspiracies, Cryptozoology, Evidence, Lair of the Beasts, Paranormal Investigators | 