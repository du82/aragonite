er, how they came to be cast members of Animal Planet’s Finding Bigfoot, answer fan questions, and much more! Read: Bigfoot and Beyond Podcast with Cliff & Bobo » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Finding Bigfoot, Podcast, Pop Culture, Sasquatch, Videos | 1 Comment » Finding Rick Perry: The Missing Secretary Of Energy Posted by: Craig Woolheater on May 24th, 2019 Finding Bigfoot spoof Read: Finding Rick Perry: The Missing Secretary Of Energy » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Pop Culture, Sasquatch, Television, Videos | 2 Comments » Bigfoot Caught on Video in Wyoming? Posted by: Craig Woolheater on May 21st, 2019 This video look legit. It’s from Wyoming. Indeed, there are Bigfoots in Wyoming.Matt Moneymaker Read: Bigfoot Caught on Video in Wyoming? » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Sasquatch, Videos | 4 Comments » Russian Bigfoot Caught on Camera? Posted by: Craig Woolheater on December 13th, 2018 Google translated text of original article: A strange creature fell into the lens of the driver’s camera near Severodvinsk. The man, who shared the video on the Web, said that he had casually noticed how a mysterious creature was moving along the highway, completely covered with either fur or hair. The humanlike figure moved strangely, […] Read: Russian Bigfoot Caught on Camera? » Categorized as: Almas, Bigfoot, Bigfoot Report, Cryptozoology, Evidence, Pop Culture, Sasquatch, Social Media, Videos, Viral Videos, Yeti | 3 Comments » Saskatchewan Sasquatch Caught on Camera? Posted by: Craig Woolheater on November 7th, 2018 It looks like a bear when on all fours, but then it stands up! Read: Saskatchewan Sasquatch Caught on Camera? » Categorized as: Bigfoot, Bigfoot Report, Cryptozoology, Evidence, Sasquatch, Videos | 5 Comments » The Devil’s Creek Posted by: DatusPerry on September 4th, 2018 A couple purchases a house, only to find that what they thought was their dream home would soon become a nightmare. The Devil’s Creek is a documentary about this fascinating and confounding story. Read: The Devil’s Creek » Categorized as: Bigfoot, Cinema News, Crowdsourcing, Cryptid Cinema, Cryptozoology, Evidence, Finding Bigfoot, Into The Fray, Movie Monsters, OK Talk, Podcast, Sasquatch, Videos, Wood Knocking | 3 Comments » New Bigfoot Footage? Posted by: Craig Woolheater on February 9th, 2018 Is this legit Sasquatch Footage? Read: New Bigfoot Footage? » Categorized as: Bigfoot, Bigfoot Report, Cryptozoology, Pop Culture, Sasquatch, Social Media, Videos | 24 Comments » Malaysian Swamp Monster Emerges from Sewer Posted by: Craig Woolheater on October 10th, 2017 The stomach churning footage of the enormous beast was filmed inside a family bathroom and the creature is believed to have been born in pipes and has survived by feeding off sewage. Read: Malaysian Swamp Monster Emerges from Sewer » Categorized as: Cryptozoology, Pop Culture, Social Media, Swamp Monsters, Videos | 1 Comment » Climate Change vs. Bigfoot Posted by: Craig Woolheater on September 19th, 2017 You’ve heard we’re killing off the animal kingdom? Well, the crypto-animal kingdom is poised for a boom, says researcher Benjamin Radford. Read: Climate Change vs. Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Chupacabras, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Media Appearances, Pop Culture, Sasquatch, Television, Videos, Weird Animal News | 2 Comments » Brunei River Monster Captured on Video! Posted by: Craig Woolheater on August 13th, 2017 What the heck is this? Real or fake? Read: Brunei River Monster Captured on Video! » Categorized as: Bigfoot Report, Cryptozoology, Evidence, Giant Cryptid Reptiles, River Monsters, Videos | 6 Comments » Mystery Mud Monster From Down Under Posted by: Craig Woolheater on August 12th, 2017 What IS that? Mystery creature pokes its head out of a mud pool by a Queensland river – before slowly sinking beneath the surface when it realises it has been spotted Read: Mystery Mud Monster From Down Under » Categorized as: Bigfoot Report, Cryptozoology, Evidence, River Monsters, Videos, Weird Animal News | 3 Comments » var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '803977', Size: '300250'}; « Older Posts | |Top | Content|"
