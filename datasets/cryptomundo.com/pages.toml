full_description = "Archive for the “Bigfoot Report” Beasts in the Mist Posted by: Craig Woolheater on October 22nd, 2024 “What a bankrupt world it would be if you refused to believe things existed until you actually had seen a specimen in a museum. I mean, there are lots of things we are prepared to believe exist without having seen them,” Read: Beasts in the Mist » Categorized as: Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Extinct, Eyewitness Accounts, Mapinguary, Megafauna | Comments Off on Beasts in the Mist Scientist Claims He Solved the Mystery of Bigfoot Posted by: Craig Woolheater on February 3rd, 2023 A data scientist thinks he’s solved the mystery of Bigfoot ― not by searching for the creature out in the wilds, but by examining the math instead. Read: Scientist Claims He Solved the Mystery of Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Books, Breaking News, Cryptozoology, Eyewitness Accounts, Forensic Science, Sasquatch, Skeptical Discussions | Comments Off on Scientist Claims He Solved the Mystery of Bigfoot Return of the Dodo? Posted by: Craig Woolheater on February 2nd, 2023 Return of the Dodo? Scientists launch project to bring back the extinct species using stem cell technology – more than 350 YEARS after it was wiped out Read: Return of the Dodo? » Categorized as: Bigfoot Report, Extinct, Living Fossils, Pop Culture, Thylacine, Weird Animal News | Comments Off on Return of the Dodo? It’s a Giant! CryptoConspiracy? Posted by: Craig Woolheater on February 1st, 2023 He found Giants then the Government Found Him | What really happened to Andrew Dawson? Read: It’s a Giant! CryptoConspiracy? » Categorized as: Bigfoot, Bigfoot Report, Conspiracies, Cryptozoology, Eyewitness Accounts, Folklore, Pop Culture, Sasquatch, Videos, Viral Videos | Comments Off on It’s a Giant! CryptoConspiracy? Sasquatch Discovered: The Biography of Dr. John Bindernagel Posted by: Craig Woolheater on January 30th, 2023 “Sasquatch Discovered: The Biography of 