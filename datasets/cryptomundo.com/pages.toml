full_description = "Archive for the “Feral People” Sinister Swamps: Monsters and Mysteries from the Mire Posted by: Lyle Blackburn on June 17th, 2020 Join me on another exciting journey as I examine legends and sighting reports of strange phenomenon in some of North America’s most notorious swamplands. Read: Sinister Swamps: Monsters and Mysteries from the Mire » Categorized as: Alien Big Cats, Bigfoot, Books, Cryptid Canids, Cryptozoology, Feral People, Living Dinosaurs, Lizard People, Monstro Bizarro, Mystery Cats, River Monsters, Sasquatch, Skunk Apes | Comments Off on Sinister Swamps: Monsters and Mysteries from the Mire Cryptomundian’s Vietnam Rock Ape Encounter Posted by: Craig Woolheater on August 12th, 2016 An artist conception of the Nguoi Rung, the Vietnamese name for the Rock Ape. Read: Cryptomundian’s Vietnam Rock Ape Encounter » Categorized as: Bigfoot, Bigfoot Report, Cryptozoology, Eyewitness Accounts, Feral People | 4 Comments » Exploring American Monsters: Hawaii Posted by: Craig Woolheater on July 21st, 2015 Hawaii is, well, it’s Hawaii. A series of islands in the Central Pacific with more gorgeous beaches, cliffs, waterfalls, volcanoes, and girls in bikinis than it knows what to do with. Apart from its geography, and lush tropical vegetation, Hawaii is famous for its love of Spam, the late singer Don Ho, the lei, and the luau. Europeans discovered the islands on 18 January 1778 when English explorer Captain James Cook landed on one of the sandy beaches. Cook was killed by islanders on Valentine’s Day the next year for being a jerk (attempting to kidnap the king will get you that short-lived reputation). Shark attacks occur on Hawaiian shores, although in 2014, only three out of eight million visitors were attacked by a shark. Hawaiians have more to fear by Axis deer wandering into the roadway than being bitten by a shark. Although Hawaii is the one state in the Union that has no reports of Bigfoot, there are still plenty of creepy, crawly monsters to go around. Read: Exploring American Monsters: Hawaii » Categorized as: Bigfoot, Bigfoot Report, Cryptozoology, Eyewitness Accounts, Feral People, Giant Cryptid Reptiles, Pop Culture, Sasquatch | Comments Off on Exploring American Monsters: Hawaii Zana, The Wild Woman of Russia Posted by: Craig Woolheater on May 27th, 2015 Is This The Missing Element in the Bigfoot Mystery? Read: Zana, The Wild Woman of Russia » Categorized as: Almas, Bigfoot, Bigfoot Report, Cryptozoology, Evidence, Feral People, Forensic Science, Podcast, Pop Culture, Sasquatch, Social Media, Yeti | 3 Comments » 12 Feet From A Female Bigfoot Posted by: Craig Woolheater on March 26th, 2015 The late Bobbie Short, proprietress of Bigfoot Encounters, tells her story of the incident that started her interest in Bigfoot. Read: 12 Feet From A Female Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Feral People, Footprint Evidence, Sasquatch, Women in Cryptozoology | 1 Comment » Doll-Headed Monkeys of Jakarta Posted by: Nick Redfern on November 17th, 2014 “…Its movements are somewhat odd and jerky. The dimensions of the body are also somewhat off. Then you may notice the tail and the hairy, clawed fingers…” Read: Doll-Headed Monkeys of Jakarta » Categorized as: Bigfoot Report, Cryptozoology, Feral People, Lair of the Beasts | Comments Off on Doll-Headed Monkeys of Jakarta Sasquatch Sightings Posted by: Craig Woolheater on November 10th, 2014 Colleen McDonald and her two grown up children have all seen Bigfoot. This first nations family have had a range of encounters which defy explanation and help build the case for Bigfoot. Read: Sasquatch Sightings » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Eyewitness Accounts, Feral People, Sasquatch, Television, Videos | Comments Off on Sasquatch Sightings Who Were the Original Inhabitants of North America? Posted by: Craig Woolheater on September 8th, 2014 In my estimation, such a trans-Beringian migration dovetails nicely with the theory of Gigantopithicus immigration via the same route as humans; albeit much earlier. ~ Todd Neiss Read: Who Were the Original Inhabitants of North America? » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Feral People, Fossil Finds, Sasquatch | 10 Comments » ‘Enigma Man’ May Be New Human Species Posted by: Craig Woolheater on June 21st, 2014 Enigma Man: A figure based on the remains found in a remote cave in South West China. Fresh light on China’s Red Deer Cave People raises big questions. Read: ‘Enigma Man’ May Be New Human Species » Categorized as: Bigfoot Report, Cryptozoology, Evidence, Feral People, New Species, Pop Culture, Television, Videos | 15 Comments » Feral Humans in the USA Posted by: Nick Redfern on June 14th, 2014 “I thought it was a feral human,” Mike Wooley recalls of the incident, arguably the strangest to occur during his time as an outdoorsmen… Read: Feral Humans in the USA » Categorized as: Cryptozoology, Evidence, Eyewitness Accounts, Feral People, Lair of the Beasts | Comments Off on Feral Humans in the USA Survivorman: Bigfoot Radium Springs Re-Airs Tomorrow! Posted by: Craig Woolheater on April 22nd, 2014 In the second episode of this 2-part special, Les continues his survival in the remote area of Northern Alberta to get as close as he can, if that’s possible, to the legend known as Sasquatch. But Les isn’t easily swayed and needs 100% irrefutable proof. Read: Survivorman: Bigfoot Radium Springs Re-Airs Tomorrow! » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Feral People, Folklore, Footprint Evidence, Pop Culture, Sasquatch, Television, Videos | 1 Comment » Wildmen in Norway and Selkies on Skis Posted by: Craig Woolheater on April 22nd, 2014 Today’s adventure in historic monster-hunting comes from Holinshed’s Chronicles of England, Scotland, and Ireland, first printed in 1577. It seems to be describing wild men in Norway. Norwegian woodwose? Read: Wildmen in Norway and Selkies on Skis » Categorized as: Bigfoot Report, Cryptozoology, Feral People, Folklore, Forteana | Comments Off on Wildmen in Norway and Selkies on Skis Record Breaking Season for Mountain Monsters Posted by: Craig Woolheater on April 20th, 2014 The season-two premiere of Destination America’s hit series MOUNTAIN MONSTERS produced stellar ratings for the network on Friday night at 10/9c, earning its best telecast ever among HH rating and delivery (0.81/473k) and second best among P2+ (672k) delivery. Friday was also the network’s best Friday night ever in key demos P/M25-54/18-49 for HH and P2+ delivery. Read: Record Breaking Season for Mountain Monsters » Categorized as: Bigfoot, Bigfoot Report, Cryptid Canids, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Feral People, Folklore, Footprint Evidence, Mystery Cats, Pop Culture, Sasquatch, Television | 1 Comment » Bigfoot Has Australian genes! Posted by: Craig Woolheater on April 19th, 2014 Now Yowie hunter Rex Gilroy believes he has found evidence that proves North America’s Bigfoot is a distant relative of the Australian bush monster. Read: Bigfoot Has Australian genes! » Categorized as: Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Feral People, Folklore, Footprint Evidence, Men in Cryptozoology, Yowie | Comments Off on Bigfoot Has Australian genes! Mountain Monsters: Uncaged Posted by: Craig Woolheater on April 3rd, 2014 Starting at 3 PM CST Friday, April 4 and leading all the way up to the Season 2 Premiere episode Kentucky Hellhound of Pike County at 9 PM, and then continuing on until 4 AM CST, Destination America is running “enhanced episodes from Season 1 that they are calling Mountain Monsters: Uncaged. Full of cast facts, tweets, and bonus scenes Read: Mountain Monsters: Uncaged » Categorized as: Bigfoot, Bigfoot Report, Cryptid Canids, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Feral People, Folklore, Footprint Evidence, Mystery Cats, Pop Culture, Sasquatch, Television | 1 Comment » var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '803977', Size: '300250'}; « Older Posts | |Top | Content|"
