full_description = "Archive for the “Mystery Man’s Menagerie” Mothman in Japan? Posted by: mystery_man on November 2nd, 2013 The creature then came toward us, flying at least 25-30 feet off the ground. The younger couple who had noticed the creature first were now screaming and cowering, the man shielding the woman while shielding his head with a jacket. My friend and I looked in awe as this creature flew over us. That’s when I noticed the two large red eyes; they seemed to glow from within and with a blood red hue. They were unblinking in the 3-4 seconds we saw them, we knew they were looking straight at us, we knew this creature knew we could see it and it made no attempt to disguise itself. Read: Mothman in Japan? » Categorized as: Avian Mysteries, Cryptotourism, Cryptozoology, Eyewitness Accounts, Mothman, Mystery Man's Menagerie, Winged Weirdies | 20 Comments » Man Eating River Monsters Posted by: mystery_man on March 23rd, 2013 There are many mysterious monsters dwelling in the lakes and rivers of the world, but the ones that really intrigue and terrify us are the ones that are purported to attack humans. When a cryptid goes from an undiscovered organism to a man eater, it becomes not only a mystery, but a menace. It becomes something that not only lurks in the murky depths, but in our nightmares as well. Read: Man Eating River Monsters » Categorized as: Cryptozoology, Folklore, Guest Blog, Lake Monsters, Mystery Man's Menagerie, River Monsters, Swamp Monsters | 4 Comments » The Takitaro Posted by: mystery_man on December 7th, 2012 Something strange is said to lurk in the depths of Otori-ike Lake in Japan. What sort of monstrous fish inhabits this remote body of water? Read: The Takitaro » Categorized as: Cryptotourism, Cryptozoology, Eyewitness Accounts, Lair of the Beasts, Lake Monsters, Mystery Man's Menagerie, Out of Place | 2 Comments » The Namitaro Posted by: mystery_man on November 29th, 2012 Some sort of mysterious giant fish is said to inhabit Takanami Pond in Niigata, Japan. Read: The Namitaro » Categorized as: Cryptotourism, Cryptozoology, Eyewitness Accounts, Lake Monsters, Mystery Man's Menagerie, Out of Place | 4 Comments » Kusshie: Japanese Lake Monster Mystery Posted by: mystery_man on November 23rd, 2012 What lurks in the cold waters of Hokkaido’s Lake Kussharo? Read: Kusshie: Japanese Lake Monster Mystery » Categorized as: Cryptotourism, Cryptozoology, Eyewitness Accounts, Lake Monsters, Loch Ness Monster, Mystery Man's Menagerie | 3 Comments » The Akkorokamui Posted by: mystery_man on November 17th, 2012 The indigenous Ainu people of Japan have long told of an enormous, tantacled marine beast known as the Akkorokamui. Read: The Akkorokamui » Categorized as: Cryptotourism, Cryptozoology, Eyewitness Accounts, Folklore, Mystery Man's Menagerie, Sea Monsters | 5 Comments » Mossie: The Nessie of Mt. Fuji Posted by: mystery_man on November 9th, 2012 What lurks in the lakes at the base of picturesque Mt. Fuji? I revisit an old mystery. Read: Mossie: The Nessie of Mt. Fuji » Categorized as: Cryptozoology, Eyewitness Accounts, Lair of the Beasts, Lake Monsters, Loch Ness Monster, Mystery Man's Menagerie | 1 Comment » The Jinmenken: Human Faced Dogs Posted by: mystery_man on October 31st, 2012 Here’s an article suitably creepy for Halloween. It is a report on the stories of mysterious human faced dogs in Japan that I wrote here awhile back. Happy Halloween. Read: The Jinmenken: Human Faced Dogs » Categorized as: Cryptid Canids, Cryptotourism, Cryptozoology, Folklore, Forteana, Mystery Man's Menagerie | 5 Comments » World War II Cryptids Of The Pacific Posted by: mystery_man on October 27th, 2012 In World War II Japanese forces were spread too far flung islands throughout the Pacific theater. These remote, exotic new locales occasionally presented strange, unknown creatures. Let’s take a crypto tour of some of these cryptozoological mysteries. Read: World War II Cryptids Of The Pacific » Categorized as: Cryptotourism, Cryptozoology, Eyewitness Accounts, Merbeings, Mystery Man's Menagerie, Proto-Pygmies, Sea Monsters, True Giant | 5 Comments » The Curious Case Of The Orang Ikan Posted by: mystery_man on October 26th, 2012 A strange account from World War II. Here I revisit a case I have written of before that has always intrigued me. Read: The Curious Case Of The Orang Ikan » Categorized as: Cryptotourism, Cryptozoology, Eyewitness Accounts, Merbeings, Mystery Man's Menagerie, Proto-Pygmies | 14 Comments » New Squid Species Or Not? Posted by: mystery_man on October 13th, 2012 It’s sometimes hard to tell if you’ve got a new species or not based on appearances alone. Read: New Squid Species Or Not? » Categorized as: Breaking News, CryptoZoo News, Cryptozoology, Mystery Man's Menagerie, New Species, Sea Monsters, Sea Serpents, Weird Animal News | 1 Comment » The Giant Worms of Japan Posted by: mystery_man on October 12th, 2012 What sorts of strange things might lurk in the ground beneath our feet? An investigation of mysterious giant worms in Japan. Read: The Giant Worms of Japan » Categorized as: Cryptotourism, Cryptozoology, Evidence, Eyewitness Accounts, Mystery Man's Menagerie, Out of Place, Weird Animal News | 4 Comments » The Giant Crayfish of Lake Mashu Posted by: mystery_man on October 11th, 2012 Hokkaido’s Lake Mashu has long been the purported home of gigantic mystery crayfish. What is going on in the cold depths of this remote lake? Read: The Giant Crayfish of Lake Mashu » Categorized as: Cryptotourism, Cryptozoology, Eyewitness Accounts, Lake Monsters, Mystery Man's Menagerie, Out of Place, Weird Animal News | 13 Comments » Winged Weirdies in Japan Posted by: mystery_man on October 5th, 2012 A round up of mysterious flying creatures in Japan. Read: Winged Weirdies in Japan » Categorized as: Avian Mysteries, Cryptotourism, Cryptozoology, Eyewitness Accounts, Folklore, Mystery Man's Menagerie, New Species, Out of Place, Thunderbirds, Winged Weirdies | 2 Comments » The Giant Mystery Snakes Of Japan Posted by: mystery_man on October 4th, 2012 There have long been reports of mysterious giant snakes lurking in the remote wilderness of Japan. Let’s take a journey to the forests of Japan to investigate these gargantuan, enigmatic serpents and perhaps find some answers. Read: The Giant Mystery Snakes Of Japan » Categorized as: Cryptotourism, Cryptozoology, Evidence, Eyewitness Accounts, Giant Cryptid Reptiles, Mystery Man's Menagerie, Out of Place | 1 Comment » var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '803977', Size: '300250'}; « Older Posts | |Top | Content|"
