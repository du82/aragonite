scovered: The Biography of Dr. John Bindernagel” was written by Courtenay, B.C., resident Terrance James, who was friends with Bindernagel for 25 years. Investigate Further: Sasquatch Discovered: The Biography of Dr. John Bindernagel » Categorized as: Bigfoot, Bigfoot Report, Books, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Sasquatch | Comments Off on Sasquatch Discovered: The Biography of Dr. John Bindernagel Bang! Zoom! To The Moon! Posted by: Craig Woolheater on January 12th, 2023 Bigfoot is mostly known for trekking the forests of the western United States. But the hairy behemoth plans to chart new territory as well: the moon. Investigate Further: Bang! Zoom! To The Moon! » Categorized as: Bigfoot, Bigfoot Report, Cryptoart, Cryptozoology, Pop Culture, Replica Cryptia, Sasquatch, Videos | Comments Off on Bang! Zoom! To The Moon! 2018 Ogopogo Footage Posted by: Craig Woolheater on December 21st, 2021 Me and my dad where fishing off a doc in Kelowna BC and spotted something massive in the water. Investigate Further: 2018 Ogopogo Footage » Categorized as: Bigfoot Report, Cryptozoology, Evidence, Eyewitness Accounts, Lake Monsters, Ogopogo, Videos | Comments Off on 2018 Ogopogo Footage Survivorman Bigfoot | Episode 1 | Alberta | Les Stroud | Todd Standing Posted by: Craig Woolheater on December 21st, 2020 Les finds himself in a remote track of forested land in Alberta, Canada, a renowned Bigfoot hot spot. Investigate Further: Survivorman Bigfoot | Episode 1 | Alberta | Les Stroud | Todd Standing » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Expedition Reports, Pop Culture, Sasquatch, Television, Videos | Comments Off on Survivorman Bigfoot | Episode 1 | Alberta | Les Stroud | Todd Standing Sinister Swamps: Monsters and Mysteries from the Mire Posted by: Lyle Blackburn on June 17th, 2020 Join me on another exciting journey as I examine legends and sighting reports of strange phenomenon in some of North America’s most notorious swamplands. Investigate Further: Sinister Swamps: Monsters and Mysteries from the Mire » Categorized as: Alien Big Cats, Bigfoot, Books, Cryptid Canids, Cryptozoology, Feral People, Living Dinosaurs, Lizard People, Monstro Bizarro, Mystery Cats, River Monsters, Sasquatch, Skunk Apes | Comments Off on Sinister Swamps: Monsters and Mysteries from the Mire Expedition Bigfoot Posted by: Craig Woolheater on November 5th, 2019 Team Believes an Advanced Algorithm is the Missing Key to Solving the Bigfoot Legend Investigate Further: Expedition Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Breaking News, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Forensic Science, Pop Culture, Sasquatch, Television | 5 Comments » Why Dan Aykroyd Is ‘All In’ On Bigfoot Posted by: Craig Woolheater on September 13th, 2019 Joe Rogen and Dan Aykroyd talk Bigfoot. Investigate Further: Why Dan Aykroyd Is ‘All In’ On Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Cryptozoology, Podcast, Pop Culture, Sasquatch | 1 Comment » Bigfoot and Beyond Podcast with Cliff & Bobo Posted by: Craig Woolheater on May 28th, 2019 Welcome to the very first episode of “Bigfoot and Beyond with Cliff and Bobo”! Cliff Barackman and James “Bobo” Fay discuss this brand new podcast, how they met each other, how they came to be cast members of Animal Planet’s Finding Bigfoot, answer fan questions, and much more! Investigate Further: Bigfoot and Beyond Podcast with Cliff & Bobo » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Finding Bigfoot, Podcast, Pop Culture, Sasquatch, Videos | 1 Comment » Finding Rick Perry: The Missing Secretary Of Energy Posted by: Craig Woolheater on May 24th, 2019 Finding Bigfoot spoof Investigate Further: Finding Rick Perry: The Missing Secretary Of Energy » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Pop Culture, Sasquatch, Television, Videos | 2 Comments » Bigfoot Caught on Video in Wyoming? Posted by: Craig Woolheater on May 21st, 2019 This video look legit. It’s from Wyoming. Indeed, there are Bigfoots in Wyoming.Matt Moneymaker Investigate Further: Bigfoot Caught on Video in Wyoming? » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Evidence, Sasquatch, Videos | 4 Comments » Yetis Are Not White! Posted by: Ken Gerhard on May 15th, 2019 you should tune into the Travel Channel tonight for the latest episode of ‘In Search of Monsters!’ Investigate Further: Yetis Are Not White! » Categorized as: Abominable Snowman, Cryptozoologists, Cryptozoology, Pop Culture, Television, Texas Monster Hunter | Comments Off on Yetis Are Not White! « Older Posts | |Top | Content|"
