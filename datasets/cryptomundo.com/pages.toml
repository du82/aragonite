full_description = '''2018 Ogopogo Footage Posted by: Craig Woolheater on December 21st, 2021 Me and my dad where fishing off a doc in Kelowna BC and spotted something massive in the water. The thing looks like it is close in the video but it was a few hundred yards off shore and it was huge, I would say atleast 60 feet long you could visually see it rolling in the water. During this video there was a small group of people videoing off shore as well. Toward the end it goes into a small bay so me and my dad hopped in the truck and drove toward the area it was headed but when we got to the bay it was nowhere to be seen.Blake Neudorf About Craig Woolheater Co-founder of Cryptomundo in 2005. I have appeared in or contributed to the following TV programs, documentaries and films: OLN's Mysterious Encounters: "Caddo Critter", Southern Fried Bigfoot, Travel Channel's Weird Travels: "Bigfoot", History Channel's MonsterQuest: "Swamp Stalker", The Wild Man of the Navidad, Destination America's Monsters and Mysteries in America: Texas Terror - Lake Worth Monster, Animal Planet's Finding Bigfoot: Return to Boggy Creek and Beast of the Bayou. Email • Facebook • Twitter • Pinterest • Instagram • This entry was posted on Tuesday, December 21st, 2021 at 4:57 pm and is filed under Bigfoot Report, Cryptozoology, Evidence, Eyewitness Accounts, Lake Monsters, Ogopogo, Videos. You can follow responses via our RSS 2.0 feed. Both comments and pings are currently closed. Facebook Google+ Twitter Pinterest Email Print Delicious Digg Fark Google Instapaper LinkedIn MySpace Newsvine Pocket Readability Reddit StumbleUpon Tumblr Yahoo! Related Posts Momo Is Here! Monstro Bizarro New Ogopogo Video Nite Callers BF Radio Presents: John Kirk & Winona Alexis of British Columbia Aquatic Cryptid Marathon Sorry. Comments are closed. |Top | Content|'''
