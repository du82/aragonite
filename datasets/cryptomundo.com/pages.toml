 It’s a new cryptid event debuting this year! Read: Lizard Man Festival, June 8-10 » Categorized as: Cryptotourism, Cryptozoology, Festivals, Lizard People, Monstro Bizarro, Small Town Monsters, Swamp Monsters | 1 Comment » Strange Carcass on Georgia Beach Posted by: Lyle Blackburn on March 21st, 2018 I was asked by First Coast News to comment on a photo of a strange “carcass” allegedly found on a beach in Georgia which has been circulating on the internet this week. Read: Strange Carcass on Georgia Beach » Categorized as: Cryptozoology, Monstro Bizarro, Photos, River Monsters, Sea Monsters, Sea Serpents | 1 Comment » The Ottine Swamp Thing Posted by: Lyle Blackburn on April 24th, 2017 It’s said to be a dark, black thing; a thing that can blend so well into the murky bog that it’s virtually invisible. Known locally as the “Ottine Swamp Thing” or simply “The Thing,” this alleged cryptid falls somewhere between a Skunk Ape and something far more unexplainable. The creature has long been on my radar, but only recently did I get an opportunity to visit Ottine Swamp and delve more deeply into the details of this intriguing legend. Read: The Ottine Swamp Thing » Categorized as: Bigfoot, Cryptotourism, Cryptozoologists, Cryptozoology, Monstro Bizarro, Sasquatch, Skunk Apes, Swamp Monsters | 2 Comments » Nebraska Bigfoot Conference Posted by: Lyle Blackburn on February 17th, 2017 This weekend is the 1st Annual Nebraska Bigfoot Conference in Hastings, Nebraska Read: Nebraska Bigfoot Conference » Categorized as: Bigfoot, Conferences, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Evidence, Eyewitness Accounts, Footprint Evidence, Monstro Bizarro, Movie Monsters, Pop Culture, Sasquatch | Comments Off on Nebraska Bigfoot Conference Beyond Boggy Creek is here! Posted by: Lyle Blackburn on February 1st, 2017 I’m proud to announce the release of my new book, Beyond Boggy Creek: In Search of the Southern Sasquatch. If you’re a fan of my work, I’m confident you’ll enjoy the new one. Beyond Boggy Creek is undoubtedly the most ambitious of my literary projects to date. It’s an in-depth exploration of the history and modern encounters with Sasquatch-like creatures across the southern United States Read: Beyond Boggy Creek is here! » Categorized as: Bigfoot, Books, Cryptozoology, Eyewitness Accounts, Monstro Bizarro, Movie Monsters, Napes, Sasquatch, Skunk Apes, Swamp Monsters | Comments Off on Beyond Boggy Creek is here! Beyond Boggy Creek Posted by: Lyle Blackburn on January 30th, 2017 Coming in February! Read: Beyond Boggy Creek » Categorized as: Bigfoot, Books, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Folklore, Footprint Evidence, Monstro Bizarro, Pop Culture, Sasquatch, Swamp Monsters | Comments Off on Beyond Boggy Creek Coming Soon: Beyond Boggy Creek Posted by: Craig Woolheater on January 20th, 2017 In search of the Southern Sasquatch Read: Coming Soon: Beyond Boggy Creek » Categorized as: Bigfoot, Bigfoot Report, Books, Cryptozoology, Evidence, Eyewitness Accounts, Folklore, Footprint Evidence, Monstro Bizarro, Movie Monsters, Pop Culture, Sasquatch, Swamp Monsters | Comments Off on Coming Soon: Beyond Boggy Creek Monster Men: Lyle Blackburn Posted by: Lyle Blackburn on December 1st, 2016 Check out the new video episode of Monster Men… I talk with the guys about my new Monstro Bizarro book, the Boggy Creek Monster documentary, and more! Read: Monster Men: Lyle Blackburn » Categorized as: Bigfoot, Books, Chupacabras, Cryptid Cinema, Cryptozoologists, Cryptozoology, Jersey Devil, Lizard People, Mokele-Mbembe, Monstro Bizarro, Movie Monsters, Museums, Podcast, Pop Culture, Replica Cryptia, Sasquatch, Small Town Monsters, Swamp Monsters, Television, Videos | Comments Off on Monster Men: Lyle Blackburn Beyond Boggy Creek Posted by: Lyle Blackburn on November 2nd, 2016 In Search of the Southern Sasquatch Read: Beyond Boggy Creek » Categorized as: Bigfoot, Books, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Folklore, Monstro Bizarro, Pop Culture, Sasquatch, Swamp Monsters | Comments Off on Beyond Boggy Creek ‘Bigfoot’ expert says creature highly likely present in Oklahoma Posted by: Lyle Blackburn on September 30th, 2016 It’s a legend older than all of us. A creature — half man, half ape — walking the woods. Read: ‘Bigfoot’ expert says creature highly likely present in Oklahoma » Categorized as: Bigfoot, Conferences, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Evidence, Eyewitness Accounts, Festivals, Folklore, Footprint Evidence, Monstro Bizarro, Pop Culture, Sasquatch | 2 Comments » Lyle Blackburn: Beyond Reality Posted by: Lyle Blackburn on August 23rd, 2016 I’ll be on Beyond Reality Radio tonight at 12:15am EST. Read: Lyle Blackburn: Beyond Reality » Categorized as: Bigfoot, Books, CryptoRadio, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Eyewitness Accounts, Folklore, Lizard People, Media Appearances, Men in Cryptozoology, Monstro Bizarro, Podcast, Pop Culture, Sasquatch, Swamp Monsters | Comments Off on Lyle Blackburn: Beyond Reality var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '803977', Size: '300250'}; « Older Posts | |Top | Content|"
