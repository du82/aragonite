, my dad said that two apes ran out the door with food & fruit in their hands, grunting and huffing. He said their speed was incredible and in no time they were crashing through the hammock of trees that surrounded the shack. Read: Florida Skunk Ape Encounter in the Everglades » Categorized as: Bigfoot, Bigfoot Report, Cryptoart, Cryptomundo Exclusive, Cryptozoology, Eyewitness Accounts, Pop Culture, Sasquatch, Skunk Apes, Swamp Monsters | 9 Comments » The Unbelievable Cryptozoology Coloring Book Posted by: Craig Woolheater on March 21st, 2017 Discover hidden monsters of dark forests, vast wilderness, and ocean depths! Cryptozoology concerns the study of animals whose existence is not yet proven — and this coloring book ranges all over the globe to recapture mysterious creatures. Read: The Unbelievable Cryptozoology Coloring Book » Categorized as: Abominable Snowman, Avian Mysteries, Bigfoot, Bigfoot Report, Chupacabras, Cryptoart, Cryptozoology, Lake Monsters, Loch Ness Monster, Megalodon, Pop Culture, Sasquatch, Winged Weirdies, Yeti | Comments Off on The Unbelievable Cryptozoology Coloring Book The Hairy Man at The Tube Posted by: Craig Woolheater on February 24th, 2017 The pictures have become part of American counterculture and started a 50 year search. The tall hairy man-like figure walking in a half step and looking cautiously around, unaware of the photographer. It was these images that inspired a generation to hunt for a primitive bipedal beings. Read: The Hairy Man at The Tube » Categorized as: Artifacts, Bigfoot, Bigfoot Report, Cryptoart, Cryptotourism, Cryptozoologists, Cryptozoology, Cryptozoology Conferences, Evidence, Folklore, Footprint Evidence, Forensic Science, Museums, Pop Culture, Sasquatch | 4 Comments » Everything Sasquatch Posted by: Craig Woolheater on February 8th, 2017 Sasquatch, the creature long-documented in First Nations artwork, is now the subjects of a month-long exhibit in Cumberland. Read: Everything Sasquatch » Categorized as: Bigfoot, Bigfoot Report, Cryptoart, Cryptozoologists, Cryptozoology, Evidence, Folklore, Footprint Evidence, Photos, Pop Culture, Replica Cryptia, Sasquatch, Television, Videos | Comments Off on Everything Sasquatch A Scaly Statuette of the Mokele-Mbembe? Posted by: Karl Shuker on December 23rd, 2016 …it portrays a scaly long-necked, sturdy quadrupedally-bodied, long-tailed creature bearing more than a passing resemblance to eyewitness descriptions of the sauropod dinosaur-like cryptid known as the mokele-mbembe in the Congo and by other names elsewhere in tropical Africa. Read: A Scaly Statuette of the Mokele-Mbembe? » Categorized as: Artifacts, Books, Cryptoart, Cryptozoology, Evidence, Giant Cryptid Reptiles, Lake Monsters, Living Dinosaurs, Mokele-Mbembe, ShukerNature, Swamp Monsters | 3 Comments » Still In Search Of Prehistoric Survivors Posted by: Karl Shuker on November 29th, 2016 It has been 21 years since the original publication back in 1995 of In Search of Prehistoric Survivors, considered by many to be my finest cryptozoological volume. Not surprisingly, then, in subsequent years there has been a growing, persistent clamour among its numerous fans worldwide for me to prepare a new, updated edition. Now, at last, fulfilling a longstanding promise, I have done so – and what an update it is! Read: Still In Search Of Prehistoric Survivors » Categorized as: Avian Mysteries, Books, Cadborosaurus, Champ/Lake Champlain Monster, Coelacanth, Cryptid Canids, Cryptoart, Cryptozoology, Extinct, Eyewitness Accounts, Giant Cryptid Reptiles, Lake Monsters, Living Dinosaurs, Living Fossils, Loch Ness Monster, Mapinguary, Megafauna, Megalodon, Mokele-Mbembe, Mystery Cats, Ogopogo, River Monsters, Sea Monsters, Sea Serpents, ShukerNature, Swamp Monsters, Thunderbirds, Thylacine, Winged Weirdies | Comments Off on Still In Search Of Prehistoric Survivors Happy Thanksgiving Cryptomundians! Posted by: Craig Woolheater on November 24th, 2016 As a Cryptomundian, what are you thankful for this year? Read: Happy Thanksgiving Cryptomundians! » Categorized as: Bigfoot Evidence, Bigfoot Report, Cryptoart, Cryptomundo Exclusive, Cryptozoology, Pop Culture, Sasquatch | 2 Comments » Monsters in America Cryptid Art Show at the International Cryptozoology Museum Posted by: Loren Coleman on October 28th, 2016 Read: Monsters in America Cryptid Art Show at the International Cryptozoology Museum » Categorized as: Artifacts, Cryptoart, Cryptotourism, CryptoZoo News, Cryptozoologists, Cryptozoology, Folklore, International Cryptozoology Museum, Museums, Orang Pendek, Pop Culture, Replica Cryptia | Comments Off on Monsters in America Cryptid Art Show at the International Cryptozoology Museum var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '803977', Size: '300250'}; « Older Posts | |Top | Content|"
