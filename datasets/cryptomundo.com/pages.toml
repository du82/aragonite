full_description = '''Monstro Bizarro Posted by: Craig Woolheater on August 23rd, 2016 Big news! My upcoming book from the Rue Morgue library edition series is now available for pre-order. The book – named after my column in the magazine – explores the entertaining world of cryptozoology in horror cinema and culture. It features articles, photo galleries, cryptid files, and much more with a Foreword by “Exists” director and “Blair Witch Project” co-creator, Eduardo Sanchez, and contributions by my cryptid-chasing cohorts Ken Gerhard, Nick Redfern, David Weatherly, Dave Alexander, and others! The Rue Morgue Library is back with its highly anticipated 7th installment, MONSTRO BIZARRO, in which columnist and author LYLE BLACKBURN takes you on a sightseeing tour of a world of mysterious monsters. All the cryptozoological marvels are here, including Bigfoot, Yeti, the Loch Ness Monster and Chupacabra, along with lesser known monsters like Ogopogo, the Mongolian Death Worm, Jersey Devil, Boggy Creek Monster, Momo, Mokele-Mbembe, Real Wolfmen and many more! Plus: Cryptid Cinema, Monstrous Museums, Monster Toys, Beastly Art, Travelogues of Terror, Real Case Files, Cryptid Television, Photo Galleries and lots more! Also features a Foreword by Blair Witch Project co-creator EDUARDO SANCHEZ, along with contributions by KEN GERHARD, NICK REDFERN, DAVID WEATHERLY and others. The 132-page, perfect bound soft cover book retails for $14.95 and is available for pre-order NOW! MONSTRO BIZARRO ships October 1, 2016 FREE to anywhere in the US and Canada. Canadian residents: use coupon code ILOVECANADA Source About Craig Woolheater Co-founder of Cryptomundo in 2005. I have appeared in or contributed to the following TV programs, documentaries and films: OLN's Mysterious Encounters: "Caddo Critter", Southern Fried Bigfoot, Travel Channel's Weird Travels: "Bigfoot", History Channel's MonsterQuest: "Swamp Stalker", The Wild Man of the Navidad, Destination America's Monsters and Mysteries in America: Texas Terror - Lake Worth Monster, Animal Planet's Finding Bigfoot: Return to Boggy Creek and Beast of the Bayou. Email • Facebook • Twitter • Pinterest • Instagram • This entry was posted on Tuesday, August 23rd, 2016 at 1:05 pm and is filed under Avian Mysteries, Bigfoot, Books, Chupacabras, Cryptid Canids, Cryptid Cinema, Cryptotourism, Cryptozoologists, Cryptozoology, Evidence, Eyewitness Accounts, Folklore, Footprint Evidence, Jersey Devil, Lake Monsters, Living Dinosaurs, Lizard People, Loch Ness Monster, Momo, Monstro Bizarro, Mothman, Museums, Ogopogo, Pop Culture, Replica Cryptia, Sasquatch, Sea Monsters, Sea Serpents, Skunk Apes, Swamp Monsters, Television, Winged Weirdies, Yeti. You can follow responses via our RSS 2.0 feed. Both comments and pings are currently closed. Facebook Google+ Twitter Pinterest Email Print Delicious Digg Fark Google Instapaper LinkedIn MySpace Newsvine Pocket Readability Reddit StumbleUpon Tumblr Yahoo! Related Posts Scientist Claims He Solved the Mystery of Bigfoot It’s a Giant! CryptoConspiracy? Sasquatch Discovered: The Biography of Dr. John Bindernagel Bang! Zoom! To The Moon! 2018 Ogopogo Footage Sorry. Comments are closed. |Top | Content|'''
