description = "Cryptomundo » Survivorman Bigfoot | Episode 1 | Alberta | Les Stroud | Todd Standing"
full_description = '''Survivorman Bigfoot | Episode 1 | Alberta | Les Stroud | Todd Standing Posted by: Craig Woolheater on December 21st, 2020 Les finds himself in a remote track of forested land in Alberta, Canada, a renowned Bigfoot hot spot. Inundated by requests from fans to uncover the truth about Bigfoot since revealing his own possible Bigfoot encounter while shooting Survivorman in Alaska in 2009, Les seeks to uncover the truth about this elusive and possibly fictitious creature. Enlisting the help of Bigfoot researcher Todd Standing, Les goes in as a skeptic, debunking myths and exploring the possibility of purposely broken trees and structures made in ways that seem highly unlikely to be made by natural causes. Les makes camp in bowl-like topography to give the beasts of the wilderness the high ground. Armed with nothing more than a camera, belt knife and extreme night-vision cameras. Directed By Les Stroud Starring Les Stroud About Craig Woolheater Co-founder of Cryptomundo in 2005. I have appeared in or contributed to the following TV programs, documentaries and films: OLN's Mysterious Encounters: "Caddo Critter", Southern Fried Bigfoot, Travel Channel's Weird Travels: "Bigfoot", History Channel's MonsterQuest: "Swamp Stalker", The Wild Man of the Navidad, Destination America's Monsters and Mysteries in America: Texas Terror - Lake Worth Monster, Animal Planet's Finding Bigfoot: Return to Boggy Creek and Beast of the Bayou. Email • Facebook • Twitter • Pinterest • Instagram • This entry was posted on Monday, December 21st, 2020 at 8:30 am and is filed under Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Expedition Reports, Pop Culture, Sasquatch, Television, Videos. You can follow responses via our RSS 2.0 feed. Both comments and pings are currently closed. Facebook Google+ Twitter Pinterest Email Print Delicious Digg Fark Google Instapaper LinkedIn MySpace Newsvine Pocket Readability Reddit StumbleUpon Tumblr Yahoo! Related Posts Scientist Claims He Solved the Mystery of Bigfoot It’s a Giant! CryptoConspiracy? Sasquatch Discovered: The Biography of Dr. John Bindernagel Bang! Zoom! To The Moon! Expedition Bigfoot Sorry. Comments are closed. |Top | Content|'''
