["https://cryptomundo.com/bigfoot-report/beasts-in-the-mist-the-mapinguari"]
title = "Cryptomundo » Beasts in the Mist – The Mapinguari"
description = "Cryptomundo » Beasts in the Mist – The Mapinguari"
full_description = '''Beasts in the Mist – The Mapinguari Posted by: Craig Woolheater on October 24th, 2005 Several years back, actually in August of 1999 or so, I ran across a very interesting article in Discover magazine. It chronicled an ornithologist named David Oren’s treks into the Amazon in search of the Mapinguari, what is thought to be the still living giant ground sloth. The article detailed the derision that Oren suffered from his fellow scientists. Some interesting quotes from the article: “Oren has gathered a certain amount of derision in the scientific community over the last few years because of his determination to keep tramping through the jungle in search of the giant ground sloth. His detractors suspect he’s as likely to find the beast as other adventurers are to find Bigfoot, the mythical creature said to be roaming the wilderness of the Pacific Northwest.” I felt that this article had many parallels to Bigfoot research. The Mapinguari was known to the locals, much as the anecdotal evidence we are collecting regarding sightings of Bigfoot here in our country. “One might argue how much faith Oren should put in anecdotal evidence provided to him by 50 or so people who say they’ve had encounters with the sloth. Still, it seems odd that scientists, of all people, would question the search for anything thought to be elusive or even impossible to find. Think of the naysayers who used to scoff every time Carl Sagan said there had to be other planets orbiting other suns in other solar systems; now other planets are discovered so often it’s hard to keep track of how many there are.” People think that every inch of the earth has been explored. Quite the contrary… “You’d think that the science establishment, having been proven wrong so many times, would adopt a bit more humility. If there’s one thing we keep learning, it’s that we don’t know as much as we think we do. Holloway says, ‘People seem to have trouble admitting that not everything has been found. The Amazon is a huge, largely unexplored area.'” She is hoping Oren will find his elusive beast, if only to offer the doubters a little comeuppance: “We have a lot of hubris about nature, and when we find things we don’t expect, it shows us that nature is more complicated than we ever guessed and that there must be a lot more to find.” She is impressed that, wherever he goes, Oren treats other people as equals. That respect has led him to trust accounts many have given him of encounters with the beast. It seems ironic that Oren himself isn’t offered the same level of respect and trust by some of his peers. “Other scientists are willing to accept more on faith. ‘What a bankrupt world it would be if you refused to believe things existed until you actually had seen a specimen in a museum. I mean, there are lots of things we are prepared to believe exist without having seen them,’ says Wildlife Conservation Society biologist Kent Redford.” As a matter of fact, the descriptions of the creature in question sounded more like a bipedal primate than a giant ground sloth to me. “Covered in long red hair, standing more than 6 feet on its hind legs, emanating a stench so foul it disorients everyone in sniffing distance, the mapinguari is reputed to be the wildest, rarest, most mysterious and terrifying denizen of the rain forest. The mapinguari is also said to be another Bigfoot, a figment of the imagination of people like Dos Santos–and of a prominent scientist named David C. Oren, whose relentless quest to find one is growing as legendary as the beast itself.” Full article from the September 1999 issue of Discover Magazine available here. About Craig Woolheater Co-founder of Cryptomundo in 2005. I have appeared in or contributed to the following TV programs, documentaries and films: OLN's Mysterious Encounters: "Caddo Critter", Southern Fried Bigfoot, Travel Channel's Weird Travels: "Bigfoot", History Channel's MonsterQuest: "Swamp Stalker", The Wild Man of the Navidad, Destination America's Monsters and Mysteries in America: Texas Terror - Lake Worth Monster, Animal Planet's Finding Bigfoot: Return to Boggy Creek and Beast of the Bayou. Email • Facebook • Twitter • Pinterest • Instagram • This entry was posted on Monday, October 24th, 2005 at 10:33 pm and is filed under Bigfoot, Bigfoot Report, Cryptotourism, Cryptozoologists, Cryptozoology, Expedition Reports, Extinct, Eyewitness Accounts, Living Fossils, Mapinguary, Men in Cryptozoology. You can follow responses via our RSS 2.0 feed. Both comments and pings are currently closed. Facebook Google+ Twitter Pinterest Email Print Delicious Digg Fark Google Instapaper LinkedIn MySpace Newsvine Pocket Readability Reddit StumbleUpon Tumblr Yahoo! Related Posts Beasts in the Mist Scientist Claims He Solved the Mystery of Bigfoot It’s a Giant! CryptoConspiracy? Sasquatch Discovered: The Biography of Dr. John Bindernagel Bang! Zoom! To The Moon! 4 Responses to “Beasts in the Mist – The Mapinguari” Loren Coleman responds: October 25th, 2005 at 4:59 pm While in correspondence I have found Dr. David Oren humble, good-natured, and generally a good cryptozoologist, I have to agree wholeheartedly here with Craig. Back through the work of Ivan T. Sanderson and Bernard Heuvelmans, the Amazon’s Mapinguari seems to reflect primate traits. Reports of a giant ground sloth still alive, however, are frequent and appear more likely for Patagonia. Melissa responds: October 25th, 2005 at 7:59 pm Excellent article – Thank you craig. Someone in the Scientific community should print that out and make all the scientists read it — How do we as humans discover or make new findings for anything from new animals to even drugs that save lives– if we do not search? Its sad really, at least I think so. P.S. Wonder if anyone is laughing at Carl Sagan now? lol 🙂 bill green responds: October 26th, 2005 at 7:19 am hi everyone this a great article about the mapinguari. i hope more research done about those creatures. please keep me updated. thanks bill 🙂 CryptoInformant responds: January 22nd, 2006 at 11:31 pm I agree that the Mapinguari is probably a primate, although GGSs (giant ground sloths) were probably smelly and aggressive, and we already know they were shaggy. Why doesn’t anyone look for the Amazon tyrannosaur? (If no one else does, I will, anyone got funding for me?) Sorry. Comments have been closed. |Top | Content|'''
