full_description = "Archive for the “Pop Culture” Return of the Dodo? Posted by: Craig Woolheater on February 2nd, 2023 Return of the Dodo? Scientists launch project to bring back the extinct species using stem cell technology – more than 350 YEARS after it was wiped out Read: Return of the Dodo? » Categorized as: Bigfoot Report, Extinct, Living Fossils, Pop Culture, Thylacine, Weird Animal News | Comments Off on Return of the Dodo? It’s a Giant! CryptoConspiracy? Posted by: Craig Woolheater on February 1st, 2023 He found Giants then the Government Found Him | What really happened to Andrew Dawson? Read: It’s a Giant! CryptoConspiracy? » Categorized as: Bigfoot, Bigfoot Report, Conspiracies, Cryptozoology, Eyewitness Accounts, Folklore, Pop Culture, Sasquatch, Videos, Viral Videos | Comments Off on It’s a Giant! CryptoConspiracy? Bang! Zoom! To The Moon! Posted by: Craig Woolheater on January 12th, 2023 Bigfoot is mostly known for trekking the forests of the western United States. But the hairy behemoth plans to chart new territory as well: the moon. Read: Bang! Zoom! To The Moon! » Categorized as: Bigfoot, Bigfoot Report, Cryptoart, Cryptozoology, Pop Culture, Replica Cryptia, Sasquatch, Videos | Comments Off on Bang! Zoom! To The Moon! Survivorman Bigfoot | Episode 1 | Alberta | Les Stroud | Todd Standing Posted by: Craig Woolheater on December 21st, 2020 Les finds himself in a remote track of forested land in Alberta, Canada, a renowned Bigfoot hot spot. Read: Survivorman Bigfoot | Episode 1 | Alberta | Les Stroud | Todd Standing » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Expedition Reports, Pop Culture, Sasquatch, Television, Videos | Comments Off on Survivorman Bigfoot | Episode 1 | Alberta | Les Stroud | Todd Standing Expedition Bigfoot Posted by: Craig Woolheater on November 5th, 2019 Team Believes an Advanced Algorithm is the Missing Key to Solving the Bigfoot Legend Read: Expedition Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Breaking News, Cryptozoologists, Cryptozoology, Evidence, Expedition Reports, Forensic Science, Pop Culture, Sasquatch, Television | 5 Comments » Why Dan Aykroyd Is ‘All In’ On Bigfoot Posted by: Craig Woolheater on September 13th, 2019 Joe Rogen and Dan Aykroyd talk Bigfoot. Read: Why Dan Aykroyd Is ‘All In’ On Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Cryptozoology, Podcast, Pop Culture, Sasquatch | 1 Comment » Bigfoot and Beyond Podcast with Cliff & Bobo Posted by: Craig Woolheater on May 28th, 2019 Welcome to the very first episode of “Bigfoot and Beyond with Cliff and Bobo”! Cliff Barackman and James “Bobo” Fay discuss this brand new podcast, how they met each other, how they came to be cast members of Animal Planet’s Finding Bigfoot, answer fan questions, and much more! Read: Bigfoot and Beyond Podcast with Cliff & Bobo » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Finding Bigfoot, Podcast, Pop Culture, Sasquatch, Videos | 1 Comment » Finding Rick Perry: The Missing Secretary Of Energy Posted by: Craig Woolheater on May 24th, 2019 Finding Bigfoot spoof Read: Finding Rick Perry: The Missing Secretary Of Energy » Categorized as: Bigfoot, Bigfoot Report, Cryptozoologists, Cryptozoology, Pop Culture, Sasquatch, Television, Videos | 2 Comments » Yetis Are Not White! Posted by: Ken Gerhard on May 15th, 2019 you should tune into the Travel Channel tonight for the latest episode of ‘In Search of Monsters!’ Read: Yetis Are Not White! » Categorized as: Abominable Snowman, Cryptozoologists, Cryptozoology, Pop Culture, Television, Texas Monster Hunter | Comments Off on Yetis Are Not White! Wild Thing Letters Posted by: Craig Woolheater on February 15th, 2019 Letters about people’s own Bigfoot experiences Read: Wild Thing Letters » Categorized as: Bigfoot, Bigfoot Report, CryptoRadio, Cryptozoology, Eyewitness Accounts, Podcast, Pop Culture, Sasquatch | Comments Off on Wild Thing Letters The Man Who Killed Hitler and Then the Bigfoot Posted by: Craig Woolheater on January 18th, 2019 How can you not want to see a movie called The Man Who Killed Hitler and Then the Bigfoot? Read: The Man Who Killed Hitler and Then the Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Cinema News, Cryptid Cinema, Cryptozoology, Pop Culture, Sasquatch | 1 Comment » Just Enough Time to Miss Bigfoot Posted by: Craig Woolheater on January 4th, 2019 According to Stop the Texts, Stop the Wrecks, the average text message takes the driver’s eyes off the road for five seconds. Five seconds is just long enough for someone to miss something important … like a Bigfoot hunter missing the cryptozoological beast as it crosses the road in front of him. Read: Just Enough Time to Miss Bigfoot » Categorized as: Bigfoot, Bigfoot Report, CryptoConsumerism, Cryptozoology, Pop Culture, Sasquatch, Television | 6 Comments » The Legend of Boggy Creek – Restored, Remastered and Re released Posted by: Craig Woolheater on December 20th, 2018 Relive your childhood memories with your friends and family this summer with the tale of a Big Foot-like creature, or as we colloquially know him, the Fouke Monster, in Charles B. Pierce’s The Legend of Boggy Creek. The film was recently fully restored and remastered in 4k by Pierce’s daughter and is ready for rerelease at the historic Perot Theatre. Tickets go on sale this Friday, December 21, 2018, at 10:00 AM Read: The Legend of Boggy Creek – Restored, Remastered and Re released » Categorized as: Bigfoot, Bigfoot Report, Cinema News, Conferences, Cryptid Cinema, Cryptozoology, Festivals, Pop Culture, Sasquatch, Swamp Monsters | 2 Comments » Wild Thing: Virginia Wade Posted by: Craig Woolheater on December 19th, 2018 Sasquatch sells. So does sex. And Sasquatch sex? Well, you can make quite a living off of that. We talk to Virginia Wade, renowned Bigfoot erotica author, about her work and how she started writing steamy Sasquatch scenes. (This one’s probably not for the kiddos…) Read: Wild Thing: Virginia Wade » Categorized as: Bigfoot, Bigfoot Report, Books, CryptoConsumerism, Cryptozoology, Podcast, Pop Culture, Sasquatch | Comments Off on Wild Thing: Virginia Wade Man says he was shot after being mistaken for Bigfoot Posted by: Craig Woolheater on December 19th, 2018 “[The shooter] said, ‘I was out hunting Bigfoot.’ Thought he was Bigfoot, and he said no he wasn’t Bigfoot, and then the guy said you should be wearing orange. Read: Man says he was shot after being mistaken for Bigfoot » Categorized as: Bigfoot, Bigfoot Report, Cryptozoology, Pop Culture, Sasquatch | 1 Comment » var ACE_AR = {Site: '794928', Size: '300250'}; var ACE_AR = {Site: '803977', Size: '300250'}; « Older Posts | |Top | Content|"
