full_description = "A Beast, Bolivia & Brazil Posted by: Nick Redfern on June 24th, 2012 Although far less well reported and commented on than the Bigfoot of North America, the Mapinguari – whatever it may be – is no less intriguing. And you can find a new post all about it at Bigfoot Lunch Club. Our very own Craig Woolheater is cited, too! Here is the link to the original article on Cryptomundo that is cited on Bigfoot Lunch Club: Beasts in the Mist – The Mapinguari. About Nick Redfern Punk music fan, Tennents Super and Carlsberg Special Brew beer fan, horror film fan, chocolate fan, like to wear black clothes, like to stay up late. Work as a writer. Email • Facebook • Twitter • This entry was posted on Sunday, June 24th, 2012 at 9:00 pm and is filed under Bigfoot, Eyewitness Accounts, Lair of the Beasts, Mapinguary. You can follow responses via our RSS 2.0 feed. Both comments and pings are currently closed. Facebook Google+ Twitter Pinterest Email Print Delicious Digg Fark Google Instapaper LinkedIn MySpace Newsvine Pocket Readability Reddit StumbleUpon Tumblr Yahoo! Related Posts Beasts in the Mist Scientist Claims He Solved the Mystery of Bigfoot It’s a Giant! CryptoConspiracy? Sasquatch Discovered: The Biography of Dr. John Bindernagel Bang! Zoom! To The Moon! Sorry. Comments are closed. |Top | Content|"
