["https://crystal-lang.org/2024/02/02/crystal-the-lingua-franca"]
title = "Crystal: the lingua franca at Bright - The Crystal Programming Language"
description = "Bright Security is a developer-centric Dynamic Application Security Testing Solution, also known as a DAST. Founded in 2018, their mission is to help organizations ship secure Applications and APIs at the speed of business, by enabling quick & iterative scans to identify true and critical security vulnerabilities without compromising quality or software delivery speeds."
full_description = 'Crystal: the lingua franca at Bright 02 Feb 2024 Beta Ziliani Success Bright Security is a developer-centric Dynamic Application Security Testing Solution, also known as a DAST. Founded in 2018, their mission is to help organizations ship secure Applications and APIs at the speed of business, by enabling quick & iterative scans to identify true and critical security vulnerabilities without compromising quality or software delivery speeds. Bright is responsible for the development of an intelligent exploiter for securing web apps and APIs, which searches for endpoints and attacks them with a large set of potential security threats. These attacks are conceived by a specialized group of AppSec researchers. Previously, when Bright was called NeuraLegion, they started coding their exploiter in Ruby. However, the need for performance and safety made them quickly switch to Crystal. Fast-forward to today, many developers came and went, each with their own language of choice: those working in the core functionalities of the exploiter are mostly proficient in Ruby or C++, while AppSec researchers typically work in Python. How do they find a common language to develop the engine and the attacks? Crystal sits well between dynamic languages like Ruby or Python and static languages like Java and C++. Thus, it sounds like it could be the language to help developers communicate, no matter from which end of the spectrum they come from. As C++ developer Alexander Kutsan explained at length in CrystalConf 2023, learning Crystal is not only easy for Ruby devs: those coming from backgrounds as different as Python and C++ can also learn it pretty quickly. This eliminates the need to hire specialized Crystal devs: the language has low entry barriers, and more advanced topics can be learned on the way. As a concrete example, AppSec researchers now code their attacks directly in Crystal. There is no need to translate them from Python. Afterwards, core application developers only need to ensure the quality of the code meets the standards of the rest of the application. Having a common language like Crystal meeting the requirements of low- and high-level developers helps reduce work, and increase efficiency, both, on the team operations level and on the application level. DiscourseEmbed = { discourseUrl: "https://forum.crystal-lang.org/", discourseEmbedUrl: "https://crystal-lang.org/2024/02/02/crystal-the-lingua-franca/", }; (function() { var d = document.createElement("script"); d.type = "text/javascript"; d.async = true; d.src = DiscourseEmbed.discourseUrl + "javascripts/embed.js"; (document.getElementsByTagName("head")[0] || document.getElementsByTagName("body")[0]).appendChild(d); })(); Comment archive for this post'
