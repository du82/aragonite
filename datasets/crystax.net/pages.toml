понсирования. Деньги мы зарабатывали другими способами (выполнением работ по консультированию и разработке ПО на заказ), а затем вкладывали их в развитие CrystaX NDK. В связи с этим, эффективность нашей работы над NDK была не настолько высока, как нам хотелось бы. Получая поддержку от сообщества, мы сможем уделять больше времени и внимания дальнейшему развитию CrystaX NDK, не отвлекаясь на заказную разработку. Это, очевидно, ускорит разработку и поможет лучше поддерживать наших пользователей. По желанию, спонсоры проекты (те, кто присылают нам $200 в месяц или больше) получают взамен некоторые привилегии - их заявки получают больший приоритет, они могут быть указаны на главной странице нашего сайта, указаны в README CrystaX NDK и т.д. Здесь это описано более подробно. ВНИМАНИЕ! Когда скачивание завершится, не забудьте проверить, что скачанный файл не испорчен! Его SHA-256 hash должен быть . Вот пример, как это можно проверить с помощью OpenSSL: $ CHECKSUM= && \ FILE= && \ echo "$CHECKSUM $FILE" | sha256sum --check'
