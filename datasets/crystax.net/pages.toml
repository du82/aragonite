title = "CrystaX"
full_description = "About us CrystaX is a US company founded in 2012 to continue development of CrystaX NDK, a personal project of Dmitry Moskalchuk. CrystaX NDK was always the main project for CrystaX, even though it was fully free and open-source. Our business model is providing software development and consulting services for businesses, investing all earnings into further evolvement of the CrystaX NDK, and making native development for Android easier. At the same time, CrystaX NDK, being open-source and free-to-use, works as the best advertisement for us, proving that we're experts in Android development and helping us receive paid contracts. Read more Contact us For more information on how CrystaX can help you, go ahead and email us at contact@crystax.net or simply fill in the form below. If your question is related to the CrystaX NDK, you can use the public discussion group to ask about CrystaX NDK (for example, if you're unsure if something is a bug or feature). You can post a question via the web interface or use it as a good old mailing list: send e-mail to crystax-ndk@googlegroups.com. This is a pre-moderated group, so don't worry if you don't see your post immediately; give us some time to see and approve it. Also, you can file a ticket on our public bug tracker. Please check first that your problem has not yet been reported, searching by key words. Your name Your e-mail Drop us a note"
