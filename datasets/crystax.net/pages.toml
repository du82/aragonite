ed up CrystaX NDK development as well as bug fixing and support. Optionally, sponsors (those who send us $200/month or more) get in exchange a number of perks - they get priority for consulting or training needs, they can be listed on the front page of the CrystaX website and mentioned in the project README, etc. Please read here for more details about sponsoring options. WARNING! When the download is finished, please check that the downloaded file is not corrupted! The SHA-256 hash must be . Here is an example of how to check it using OpenSSL: $ CHECKSUM= && \ FILE= && \ echo "$CHECKSUM $FILE" | sha256sum --check'''
