title = "CrystaX"
full_description = 'Консалтинг Мы предоставляем консалтинговые услуги в области разработки для мобильных устройств. Мы можем помочь вам с портированием ваших проектов под Android и выполнить эту работу с сохранением максимальной переносимости на другие платформы (iOS, Blackberry, Linux, OS X, Windows и т.д.). Примеры проектов, с которыми мы можем помочь: Разработка игр, предназначеных для запуска на широком спектре мобильных платформ. Бизнес-приложения с устоявшимся и стабильным ядром, уже находящиеся в эксплуатации, для которых возникла необходимость портирования под Android. Приложения для обработки аудио/видео, такие как VoIP проекты. Мы работаем по гибким расценкам, в зависимости от проекта. Свяжитесь с нами, и мы сделаем все возможное, чтобы помочь с вашим проектом в рамках вашего бюджета и в удобные для вас сроки! Спонсирование Если вы заинтересованы в использовании CrystaX NDK, вы можете выступить в роли спонсора, и тем самым помочь нам и дальше вести проект, который приносит пользу вам и многим другим разработчикам под Android. Для того, чтобы стать спонсором, вам необходимо ежемесячно переводить на счет нашей фирмы не менее $200 (верхний предел не устанавливается). Если необходимо, мы можем высылать спонсору ежемесячный счет. Также, по желанию спонсора, может быть заключен письменный договор. Для спонсоров может быть организован канал прямой связи с разработчиками. Проблемы спонсоров, возникающие при использовании CrystaX NDK, имеют больший приоритет, чем любые остальные некритические проблемы. Спонсоры имеют приоритет при необходимости консалтинга или обучения по проекту CrystaX NDK. По желанию спонсора, он может быть "ассоциирован" с CrystaX NDK. По сути, это реклама через спонсорство. Его имя будет указано в файле README, поставляемом с дистрибутивом и/или на главной странице проекта, которую каждый день посещают сотни разработчиков. Спонсирование может быть прекращено в любой момент.'
