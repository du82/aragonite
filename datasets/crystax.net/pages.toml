full_description = '''ВНИМАНИЕ!!! Вы находитесь на странице устаревшего выпуска CrystaX NDK. Новый CrystaX NDK 10.3.2 доступен для скачивания, предлагая многочисленные исправления и улучшения; скорее всего, вам стоило бы попробовать новую версию вместо устаревшей. Описание Здесь выложены дистрибутивы Android NDK 1.6_r1, пересобранные мной из официальных исходников. Добавлена поддержка C++ exceptions, RTTI и Standard C++ Library (в частности, STL). Изменения вносились только в сборочные скрипты и настроечные включаемые файлы. Лицензия Содержимое CrystaX NDK покрывается различными open-source лицензиями. Более детально можно узнать, заглянув в каждый интересующий файл и прочитав copyright disclaimer. Обратите внимание, что CrystaX NDK дистрибутивы также содержат уже собранные двоичные файлы - компилятор, линкер и т.д. Их исходные коды доступны на GitHub-е (вы можете использовать сборочный скрипт, чтобы скачать их автоматически). GCC и сопутствующие инструменты (GDB, binutils и т.д.) покрываются либо GNU General Public License (GPL), либо GNU Lesser General Public License (LGPL). Вы можете найти более детальную информацию о них в файлах COPYING и COPYING.LIB, находящихся в каталогах $NDK/toolchains/$tc/prebuilt/$system. Набор инструментов LLVM/Clang покрывается LLVM "BSD" лицензией. По существу, правила лицензирования такие же, как у Android NDK от Google - т.е. разрешается любое использование, как коммерческое, так и некоммерческое. Единственное добавление к этим правилам - это CrystaX-специфичный код, который покрывается разрешительной 'BSD 2-clause' лицензией. CrystaX NDK contains code from libc library of FreeBSD project which by-turn contains code from other projects. Also, several another open-source projects used, such as GNU gcc, GNU binutils, LLVM clang, LLVM libc++ etc. To see specific authors and/or licenses, look into appropriate source file. Here is license for those parts which are not derived from any other projects but written by CrystaX. Copyright (c) 