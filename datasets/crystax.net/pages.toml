.713 MB a3f4b6227e9d9fe...134c4da4aa1a96 android-ndk-r3-linux-x86-crystax-3.tar.bz2 106.269 MB a13a9f42bc0d610...e733a698ae1cb6 android-ndk-r3-darwin-x86-crystax-3.tar.bz2 109.896 MB 27ac9e1aaead6b3...a45b65aa155d43 android-ndk-r3-windows-crystax-2.zip 127.337 MB 09e24b3c41f94d0...e6790e4db24e1c android-ndk-r3-linux-x86-crystax-2.tar.bz2 106.285 MB c5fa062cca651cc...df02ad2d519301 android-ndk-r3-darwin-x86-crystax-2.tar.bz2 109.679 MB 158815c99352f4a...84cbcbbbf80ecc CrystaX NDK r2 File Size SHA256 android-ndk-r2-windows-crystax-1.zip 110.442 MB 030fc7f644b3bc4...2f29bf165ea352 android-ndk-r2-linux-x86-crystax-1.tar.bz2 88.356 MB 190c1a9cb424b5a...ef3eeea7d7dbff android-ndk-r2-darwin-x86-crystax-1.tar.bz2 90.833 MB 389bbfb6ecdb813...ca4e5611d8a40a Thank you for downloading CrystaX NDK (will start in seconds)! CrystaX NDK is a fully open source project, free to use in any open-source and commercial environment. We provide it free for use and don't ask our users to pay in exchange. However, we appreciate your support, through sending us pull requests, spreading the news about CrystaX NDK over the world, or just donating: Who we are We're a small team of developers who want to make development for Android easier. Our goal is to create a comprehensive toolkit for native development for Android on C, C++, Objective-C, and, potentially, in other programming languages already working on modern POSIX systems (Swift, D, Haskell, Ocaml, Python, Ruby - you name it). We've already done a lot (as you can see on our main project page), but we want to do even more. We have a long way to go, but we know how to do it and can clearly see the steps required to make it happen. You can read more about us here. Why we need your support Since we started working on CrystaX NDK, we have funded ourselves without any sponsorship. That has led us to make money in other ways (such as working as contractors and doing consulting jobs on other projects) and invest our earnings in the CrystaX NDK project. Because of this we have only been able to work on NDK part-time, which means it is not as powerful as it could be. Having support from the community, we could pay more attention to CrystaX NDK development, without the distraction on paid contracts. This will speed up CrystaX NDK development as well as bug fixing and support. Optionally, sponsors (those who send us $200/month or more) get in exchange a number of perks - they get priority for consulting or training needs, they can be listed on the front page of the CrystaX website and mentioned in the project README, etc. Please read here for more details about sponsoring options. WARNING! When the download is finished, please check that the downloaded file is not corrupted! The SHA-256 hash must be . Here is an example of how to check it using OpenSSL: $ CHECKSUM= && \ FILE= && \ echo "$CHECKSUM $FILE" | sha256sum --check'''
