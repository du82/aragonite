["https://crystax.net/cn/about"]
title = "CrystaX"
full_description = "公司 CrystaX是一家成立于2012年的美国企业，旨在持续研发CrystaX NDK， 它源于Dmitry Moskalchuk发起的一个个人项目。 CrystaX NDK始终是CrystaX的主营业务，尽管它完全免费和开源。 我们的商业模式是为企业提供软件研发和咨询服务，将所有收益投入到CrystaX NDK的后续研发， 推动更加轻松简易地Android原生开发技术。与此同时，开源免费的CrystaX NDK， 作为我们的最佳品牌宣传，证明了我们在Android开发领域的专业技术水平，并帮助我们赢得大量有偿合同。 作为移动互联网开发领域的专家, 我们灵活使用业界稳定成熟方案和最新尖端技术。 我们利用自身技术优势, 使用最佳技术方案研发CrystaX NDK，解决客户的疑难杂症, 打造优质产品。 最后还有重要的一点, 我们是一家小型和充满活力的公司, 所以我们做事高效, 摒弃冗繁流程。 团队 我们的领导团队拥有数十年在许多公司领导大型项目的经验, 从大型企业到初创团队。 我们与大量企业保持良好合作, 包括移动, 电信, 金融和其他领域。 通过多年经验, 我们掌握了如何实现最佳方案的秘诀。 每个人都懂得如何建立高效开发流程（跟踪缺陷，持续集成，自动化测试，可重现的构建， 以及其他的正确方法），但是知易行难，很少人能够真正在实践中贯彻执行。 CrystaX的理念是质量至上，同时我们坚持用正确的方法做事，因为这是赢得成功的唯一途径。 与庞大的企业不同，我们无法容忍低效率，也没有大量的员工可以去做千篇一律的机械性工作。 相反，我们努力建设流畅并实用的研发流程，以此推动团队前进。 我们崇尚开源文化。在开源世界中，开发者们公开讨论，向用户提供实时反馈，向社区分享工作成果。 事实上，这也是我们努力研发CrystaX NDK的源动力。 核心领导 Dmitry Moskalchuk Dmitry 拥有十年软件开发经验和技术团队领导经验. 他最近的从业经历包括 Unison(Unified Communications Software)的架构师和开发者, Rhomobile Rhodes产品的核心开发者, CrystaX NDK的核心开发者, 并参与了许多其他商业和开源项目的架构设计和实现. Alexander Zhukov Alexander 是我们的明星开发人员. 他是一个拥有20多年服务器和移动开发经验的专家. 他能解决任何别人可能早已放弃了的困难技术问题. 许多公司都依靠Alexander来使用强大的, 优雅的代码解决最棘手的问题。 他擅长的知识领域包括但不限于C, C++, Java, Erlang和许多其他技术."
