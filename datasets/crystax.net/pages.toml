["https://www.crystax.net/ru/about"]
title = "CrystaX"
full_description = 'Компания CrystaX - американская компания, основанная в 2012-ом году для продолжения работы над CrystaX NDK, персональным проектом Дмитрия Москальчука. CrystaX NDK всегда был основным проектом для CrystaX, хоть он и был всегда полностью бесплатным и открытым. Наша бизнес-модель заключается в предоставлении услуг по заказной разработке ПО и консультированию для коммерческих организаций. Заработанные деньги мы инвестируем в дальнейшее развитие CrystaX NDK, делая разработку под Android более простой. В то же время CrystaX NDK, будучи открытым и бесплатным для использования продуктом, является наилучшей рекламой для нас, доказывая фактически наш опыт и умение работы в сфере разработки под Android, и тем самым приносит нам заказы. Будучи экспертами в сфере разработки мобильного и серверного ПО, мы тем не менее постоянно изучаем новые технологии и используемым наиболее релевантные из них для разработки CrystaX NDK и для решения проблем наших заказчиков, получая в результате качественные продукты. Также, что немаловажно, мы - маленькая и динамичная компания, поэтому все делаем быстро и не осложняем жизнь бюрократическими процедурами. Команда Наша команда состоит из экспертов, имеющих многолетний опыт в разработке больших продуктов в различных компаниях, от больших корпораций до стартапов. Мы работали во многих отраслях, включая мобильную разработку, телеком, финансы и т.д. Благодаря этому мы умеем доводить взятые на себя задачи до завершения. Наиболее интересно здесь то, что практически каждый знает, как организовать и вести проект разработки ПО (багтрекер, continuous integration, автоматическое тестирование, воспроизводимые сборки и другие правильные вещи); но фактически мало компаний могут похвастаться наличием подобного у себя в процессе разработки, по крайней мере в достаточном объеме. Мы же нацелены на качество производимых продуктов, поэтому мы действительно внедряем все эти правильные вещи - просто потому, что это единственный способ для нас оставаться на плаву. В отличии от Больших Корпораций, мы не можем позволить себе неэффективность работы, и у нас нет тысяч наемных сотрудников, выполняющих работу роботов. Вместо этого мы автоматизируем все, что только возможно (но следя за тем, чтобы процесс разработки оставался удобным) и это позволяет нам двигаться вперед. Также нам нравится культура open source движения, где разработчики участвуют в публичных дискуссиях, быстро отвечают на вопросы пользователей их продуктов, и делятся результатами своей работы с сообществом. Фактически это основной побудительный мотив наших непрекращающихся усилий по разработке CrystaX NDK. Руководство Дмитрий Москальчук Дмитрий - специалист с более чем 10-летним опытом разработки ПО и руководства техническими командами в качестве "играющего тренера". Его текущий послужной список содержит разработку и реализацию коммуникационного сервера известного как Unison Communications, разработку ключевого продукта Rhodes в проекте Rhomobile, создание и развитие CrystaX NDK, а также участие в разработке многих других коммерческих и открытых продуктов. Александр Жуков Александр - наш супер-эксперт. Он специалист с более чем 20-летним стажем в разработке серверного и мобильного ПО. Он может разобраться с любыми техническими проблемами. Множество компаний с успехом воспользовались его огромным опытом и невероятным умением распутывать самые сложные проблемы с помощью простых, но мощных и элегантных решений. Его багаж знаний включает (но не ограничивается этим) фундаментальные знания C, C++, Java, Erlang и много, много другого.'
