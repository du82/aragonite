версия) GIT (для скачивания исходников android toolchain) Наиболее свежая версия GNU Libtool (automake, autoconf и т.д.) GNU C/C++ 3.x или выше (для Windows, это должна быть именно 3.x, не 4.x) Библиотека ncurses (в случае Cygwin это должен быть пакет ncurses-devel) GNU flex (наиболее свежая версия) Утилита patch. Скорее всего она уже установлена если вы используете Linux или Mac OS X; в Cygwin она должна быть установлена отдельно Инструкции Скачайте мой патч и сохраните его где-нибудь Скачайте android-ndk-1.6_r1 для вашей платформы с официального сайта Распакуйте полученный архив и перейдите в каталог android-ndk-1.6_r1 Примените мой патч: patch -p1 <path-to-my-patch Установите переменную окружения ANDROID_NDK_ROOT так, чтобы она указывала на текущий каталог: export ANDROID_NDK_ROOT=`pwd` Для Windows, установите переменную окружения CC так, чтобы она указывала на GCC 3: export CC=gcc-3 Запустите команду сборки: ./build/tools/build-toolchain.sh Эта команда скачает исходники android toolchain (включая binutils, gcc и gdb), пропатчит их и запустит компиляцию. Это может занять довольно много времени в зависимости от вашей конфигурации, поэтому будьте терпеливы. Теперь вы можете попробовать протестировать вашу сборку. Соберите приложение hello-jni по стандартной инструкции (я модифицировал его так, что теперь там используется STL и исключения) и запустите на эмуляторе/устройстве Наслаждайтесь! Спасибо за скачивание CrystaX NDK (начнется через секунд)! CrystaX NDK - полностью открытый продукт, свободный для использования в любых open-source и коммерческих проектах. Мы предоставляем его полностью бесплатно, не требуя ничего взамен от наших пользователей. Тем не менее, мы очень признательны за любую поддержку: pull request-ы, распространение новостей о нашем проекте, или просто финансовую помощь: Кто мы Мы - маленькая команда разработчиков, желающих сделать разработку под Android более простой. Наша цель - создание полноценного набора инструментов для разработки под Android на C, C++, Objective-C и, потенциально, на других языках программирования, доступных для программирования под современные операционные системы (Swift, D, Haskell, Ocaml, Python, Ruby - список можно продолжить). Мы уже сделали немало (как вы можете убедиться на главной странице нашего проекта), но мы хотим сделать еще больше. Это дорога в тысячу миль, но мы знаем, как это сделать и четко видим шаги, необходимые для достижения цели. Здесь вы можете почитать о нас более подробно. Почему нам нужна ваша помощь С момента начала работы над CrystaX NDK мы финансировали себя самостоятельно, без какого-либо спонсирования. Деньги мы зарабатывали другими способами (выполнением работ по консультированию и разработке ПО на заказ), а затем вкладывали их в развитие CrystaX NDK. В связи с этим, эффективность нашей работы над NDK была не настолько высока, как нам хотелось бы. Получая поддержку от сообщества, мы сможем уделять больше времени и внимания дальнейшему развитию CrystaX NDK, не отвлекаясь на заказную разработку. Это, очевидно, ускорит разработку и поможет лучше поддерживать наших пользователей. По желанию, спонсоры проекты (те, кто присылают нам $200 в месяц или больше) получают взамен некоторые привилегии - их заявки получают больший приоритет, они могут быть указаны на главной странице нашего сайта, указаны в README CrystaX NDK и т.д. Здесь это описано более подробно. ВНИМАНИЕ! Когда скачивание завершится, не забудьте проверить, что скачанный файл не испорчен! Его SHA-256 hash должен быть . Вот пример, как это можно проверить с помощью OpenSSL: $ CHECKSUM= && \ FILE= && \ echo "$CHECKSUM $FILE" | sha256sum --check'''
