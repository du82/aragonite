title = "CrystaX"
full_description = '''ВНИМАНИЕ!!! Вы находитесь на странице устаревшего выпуска CrystaX NDK. Новый CrystaX NDK 10.3.2 доступен для скачивания, предлагая многочисленные исправления и улучшения; скорее всего, вам стоило бы попробовать новую версию вместо устаревшей. Описание Здесь выложены дистрибутивы улучшенного Android NDK (Native Development Kit) от Google. Этот NDK является полной заменой Google NDK и может использоваться везде, где используется оригинальный. CrystaX NDK предоставляет функциональность, идентичную предоставляемой Google-ом, а также множество дополнительных улучшений и исправлений. Этот проект изначально был создан Дмитрием Москальчуком (CrystaX) для добавления C++ возможностей (таких как C++ исключения, RTTI и STL) в Google NDK но вскоре после этого выяснилось, что улучшение CrystaX NDK шаг за шагом - это наилучший путь для развития средств родной (native) разработки под Android. Многие open-source и коммерческие проекты воспользовались CrystaX NDK для портирования и разработки под Android с минимальными усилиями. Ключевые улучшения в CrystaX NDK: Wide characters. Google NDK не поддерживает wide chars - ни для C, ни для C++. Используя же CrystaX NDK вы получаете полноценную поддержку wchar. Теперь вы можете легко портировать существующий код, содержащий работу с wide characters/strings/streams или написать новый. Наиболее свежие средства разработки CrystaX NDK наряду со стабильными версиями включает в себя наиболее свежие версии компиляторов GCC и Clang. Это позволяет разработчикам использовать новые языковые возможности (такие как новый C++ 11). Все компиляторы собраны с включением различных высоко- и низко-уровневых оптимизаций. Это позволяет генерировать наиболее эффективный код под целевые аппаратные платформы. Поддержка C++11 Благодаря тому, что CrystaX NDK включает наиболее свежие версии GCC и Clang, в нем поддерживаются очень многие фичи C++11. Детальное описание можно найти на страницах C++0x/C++11 Support in GCC и C++98 and C++11 Support in Clang. Также, CrystaX NDK предоставляет полностью рабочие C++11 классы std::thread, std::mutex, std::chrono и т.д. Эти классы отсутствуют в Google NDK из за отсутствия некоторых базовых возможностей в Android Bionic libc. Мы выяснили, в чем корень проблемы и починили это в CrystaX NDK так что теперь вы может просто использовать эту стандартную функциональность и забыть про ifdef-ы. Поддержка Objective-C Единственные языки программирования, доступные для разработки в Google NDK, это C и C++. CrystaX NDK дает возможность использовать также Objective-С в дополнение к C и C++. На данный момент доступен только базовый язык; работа над Cocoa-like библиотеками продолжается. Чтобы начать использовать Objective-C в вашем проекте, просто добавьте исходники с расширениями .m (Objective-C) или .mm (Objective-C++) и укажите их в LOCAL_SRC_FILES в Android.mk. Продолжение следует... Не стесняйтесь связываться с нами, если вы не видите некоторых классных фич в этом списке. Вы можете также использовать наш багтрекер для сообщений об ошибках. И конечно же, мы всегда рады помощи! Лицензия Содержимое CrystaX NDK покрывается различными open-source лицензиями. Более детально можно узнать, заглянув в каждый интересующий файл и прочитав copyright disclaimer. Обратите внимание, что CrystaX NDK дистрибутивы также содержат уже собранные двоичные файлы - компилятор, линкер и т.д. Их исходные коды доступны на GitHub-е (вы можете использовать сборочный скрипт, чтобы скачать их автоматически). GCC и сопутствующие инструменты (GDB, binutils и т.д.) покрываются либо GNU General Public License (GPL), либо GNU Lesser General Public License (LGPL). Вы можете найти более детальную информацию о них в файлах COPYING и COPYING.LIB, находящихся в каталогах $NDK/toolchains/$tc/prebuilt/$system. Набор инструментов LLVM/Clang покрывается LLVM "BSD" лицензией. По существу, правила лицензирования такие же, как у Android NDK от Google - т.е. разрешается любое использование, как коммерческое, так и некоммерческое. Единственное добавление к этим правилам - это CrystaX-специфичный код, который покрывается разрешительной 'BSD 2-clause' лицензией. CrystaX NDK contains code from libc library of FreeBSD project which by-turn contains code from other projects. Also, several another open-source projects used, such as GNU gcc, GNU binutils, LLVM clang, LLVM libc++ etc. To see specific authors and/or licenses, look into appropriate source file. Here is license for those parts which are not derived from any other projects but written by CrystaX. Copyright (c) 2011-2025 CrystaX. All rights reserved. Redistribution and use in source and binary forms, with or without modification, are permitted provided that the following conditions are met: 1. Redistributions of source code must retain the above copyright notice, this list of conditions and the following disclaimer. 2. Redistributions in binary form must reproduce the above copyright notice, this list of conditions and the following disclaimer in the documentation and/or other materials provided with the distribution. THIS SOFTWARE IS PROVIDED BY CrystaX ''AS IS'' AND ANY EXPRESS OR IMPLIED WARRANTIES, INCLUDING, BUT NOT LIMITED TO, THE IMPLIED WARRANTIES OF MERCHANTABILITY AND FITNESS FOR A PARTICULAR PURPOSE ARE DISCLAIMED. IN NO EVENT SHALL CrystaX OR CONTRIBUTORS BE LIABLE FOR ANY DIRECT, INDIRECT, INCIDENTAL, SPECIAL, EXEMPLARY, OR CONSEQUENTIAL DAMAGES (INCLUDING, BUT NOT LIMITED TO, PROCUREMENT OF SUBSTITUTE GOODS OR SERVICES; LOSS OF USE, DATA, OR PROFITS; OR BUSINESS INTERRUPTION) HOWEVER CAUSED AND ON ANY THEORY OF LIABILITY, WHETHER IN CONTRACT, STRICT LIABILITY, OR TORT (INCLUDING NEGLIGENCE OR OTHERWISE) ARISING IN ANY WAY OUT OF THE USE OF THIS SOFTWARE, EVEN IF ADVISED OF THE POSSIBILITY OF SUCH DAMAGE. The views and conclusions contained in the software and documentation are those of the authors and should not be interpreted as representing official policies, either expressed or implied, of CrystaX. Скачать Файл Размер SHA256 android-ndk-r8-crystax-1-windows-x86.zip 514.186 MB 0505aff64ff8b11...c47dbd1897011a android-ndk-r8-crystax-1-windows-x86_64.zip 547.004 MB 29a58b115cb4d89...118b35f235e330 android-ndk-r8-crystax-1-darwin-x86.tar.bz2 552.304 MB c7d270896666222...ab13bfab535fcc android-ndk-r8-crystax-1-darwin-x86_64.tar.bz2 566.709 MB 1aeadea2dc0b1ac...7b662384e735c2 android-ndk-r8-crystax-1-linux-x86.tar.bz2 523.324 MB 15ea846b05c9d2a...de4d6526566391 android-ndk-r8-crystax-1-linux-x86_64.tar.bz2 532.166 MB 0381508609d43b9...f0ee5a32a81a73 Инструкции по сборке Вы также можете пересобрать эти дистрибутивы из исходников, если вас по каким-либо причинам не устраивают уже собранные версии. Для этого просто следуйте инструкциям ниже. Настройка рабочего окружения для сборки: Выполните настройку рабочего окружения, как это указано на сайте AOSP, за исключением части, касающейся Java. Далее, установите утилиту repo как описано здесь. Удостоверьтесь, что путь к repo прописан в PATH. ВНИМАНИЕ!!! Сборка Windows версии CrystaX NDK возможна только на Linux машине (используется кросс-сборка). Сборка на Windows машине не тестировалась и не поддерживается. Инструкции Скачайте build script и запустите его: wget -O - https://crystax.net/download/ndk-crystax-r8-build.sh | /bin/sh Сборка займет много времени, вплоть до нескольких часов. По окончании сборки скрипт выведет на экран путь к архиву, содержащему только что собранный NDK release. Это все! Используйте этот архив вместо Google NDK! Спасибо за скачивание CrystaX NDK (начнется через секунд)! CrystaX NDK - полностью открытый продукт, свободный для использования в любых open-source и коммерческих проектах. Мы предоставляем его полностью бесплатно, не требуя ничего взамен от наших пользователей. Тем не менее, мы очень признательны за любую поддержку: pull request-ы, распространение новостей о нашем проекте, или просто финансовую помощь: Кто мы Мы - маленькая команда разработчиков, желающих сделать разработку под Android более простой. Наша цель - создание полноценного набора инструментов для разработки под Android на C, C++, Objective-C и, потенциально, на других языках программирования, доступных для программирования под современные операционные системы (Swift, D, Haskell, Ocaml, Python, Ruby - список можно продолжить). Мы уже сделали немало (как вы можете убедиться на главной странице нашего проекта), но мы хотим сделать еще больше. Это дорога в тысячу миль, но мы знаем, как это сделать и четко видим шаги, необходимые для достижения цели. Здесь вы можете почитать о нас более подробно. Почему нам нужна ваша помощь С момента начала работы над CrystaX NDK мы финансировали себя самостоятельно, без какого-либо спонсирования. Деньги мы зарабатывали другими способами (выполнением работ по консультированию и разработке ПО на заказ), а затем вкладывали их в развитие CrystaX NDK. В связи с этим, эффективность нашей работы над NDK была не настолько высока, как нам хотелось бы. Получая поддержку от сообщества, мы сможем уделять больше времени и внимания дальнейшему развитию CrystaX NDK, не отвлекаясь на заказную разработку. Это, очевидно, ускорит разработку и поможет лучше поддерживать наших пользователей. По желанию, спонсоры проекты (те, кто присылают нам $200 в месяц или больше) получают взамен некоторые привилегии - их заявки получают больший приоритет, они могут быть указаны на главной странице нашего сайта, указаны в README CrystaX NDK и т.д. Здесь это описано более подробно. ВНИМАНИЕ! Когда скачивание завершится, не забудьте проверить, что скачанный файл не испорчен! Его SHA-256 hash должен быть . Вот пример, как это можно проверить с помощью OpenSSL: $ CHECKSUM= && \ FILE= && \ echo "$CHECKSUM $FILE" | sha256sum --check'''
