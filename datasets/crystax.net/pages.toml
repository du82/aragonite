full_description = '''WARNING!!! You are looking for outdated CrystaX NDK release. New CrystaX NDK 10.3.2 is available, offering numerous great features and improvements; perhaps you should check it out instead of using old one. Description Here are customized distribution of Android NDK 1.6_r1 which I have rebuilt from official sources. Support of C++ exceptions, RTTI and Standard C++ Library added. Actually only some build scripts and configuration include files were changed. License The content of the CrystaX NDK is covered by various open-source licenses. See the copyright disclaimers in each respective file for details. Note that the CrystaX NDK release packages also contain prebuilt binaries for the compiler, linker, archiver, etc. The source codes for the toolchains are available at GitHub (you can use the build script to download it automatically). The prebuilt GCC and companion binaries (GDB, binutils etc) are covered by either the GNU General Public License (GPL) or the GNU Lesser General Public License (LGPL). For details, see the files COPYING and COPYING.LIB under $NDK/toolchains/$tc/prebuilt/$system. The prebuilt LLVM/Clang toolchains are covered by the LLVM "BSD" license. Basically, licensing rules are the same as for Google's Android NDK - i.e., both commercial and non-commercial usage allowed. The only additions are regarding CrystaX parts, which are covered by a permissive BSD 2-clause license. CrystaX NDK contains code from libc library of FreeBSD project which by-turn contains code from other projects. Also, several another open-source projects used, such as GNU gcc, GNU binutils, LLVM clang, LLVM libc++ etc. To see specific authors and/or licenses, look into appropriate source file. Here is license for those parts which are not derived from any other projects but written by CrystaX. Copyright (c) 2011-2025 CrystaX. All rights reserved. Redistribution and use in source and binary forms, with or without modification, are permitted provided that the following conditions are met: 1. Redistributions of source code must retain the above copyright notice, this list of conditions and the following disclaimer. 2. Redistributions in binary form must reproduce the above copyright notice, this list of conditions and the following disclaimer in the documentation and/or other materials provided with the distribution. THIS SOFTWARE IS PROVIDED BY CrystaX ''AS IS'' AND ANY EXPRESS OR IMPLIED WARRANTIES, INCLUDING, BUT NOT LIMITED TO, THE IMPLIED WARRANTIES OF MERCHANTABILITY AND FITNESS FOR A PARTICULAR PURPOSE ARE DISCLAIMED. IN NO EVENT SHALL CrystaX OR CONTRIBUTORS BE LIABLE FOR ANY DIRECT, INDIRECT, INCIDENTAL, SPECIAL, EXEMPLARY, OR CONSEQUENTIAL DAMAGES (INCLUDING, BUT NOT LIMITED TO, PROCUREMENT OF SUBSTITUTE GOODS OR SERVICES; LOSS OF USE, DATA, OR PROFITS; OR BUSINESS INTERRUPTION) HOWEVER CAUSED AND ON ANY THEORY OF LIABILITY, WHETHER IN CONTRACT, STRICT LIABILITY, OR TORT (INCLUDING NEGLIGENCE OR OTHERWISE) ARISING IN ANY WAY OUT OF THE USE OF THIS SOFTWARE, EVEN IF ADVISED OF THE POSSIBILITY OF SUCH DAMAGE. The views and conclusions contained in the software and documentation are those of the authors and should not be interpreted as representing official policies, either expressed or implied, of CrystaX. Download File Size SHA256 android-ndk-r2-windows-crystax-1.zip 110.442 MB 030fc7f644b3bc4...2f29bf165ea352 android-ndk-r2-darwin-x86-crystax-1.tar.bz2 90.833 MB 389bbfb6ecdb813...ca4e5611d8a40a android-ndk-r2-linux-x86-crystax-1.tar.bz2 88.356 MB 190c1a9cb424b5a...ef3eeea7d7dbff How to build You can also build your own distribution if you don't want to use my prebuilt versions. To do it, follow instructions below. Required development tools: For Windows, a recent release of Cygwin is required GNU Make 3.81 or later GNU Makeinfo (most recent version) GIT (for downloading toolchain sources) Most recent GNU Libtool packages (automake, autoconf etc) GNU C/C++ 3.x or later (for Windows, it should be exactly 3.x, not 4.x) ncurses library (for Cygwin, it should be ncurses-devel package) GNU flex (most recent version) patch utility. Most likely, it is already installed if you are using Linux or Mac OS X; however, in Cygwin it should be installed explicitly Instructions Download my patch and store it somewhere Download android-ndk-1.6_r1 for your platform from android web site Unpack downloaded file and go to directory android-ndk-1.6_r1 Apply my patch: patch -p1 <path-to-my-patch Point environment variable ANDROID_NDK_ROOT to the current directory: export ANDROID_NDK_ROOT=`pwd` For Windows, point environment variable CC to the GCC 3: export CC=gcc-3 Run build script: ./build/tools/build-toolchain.sh It will download android toolchain sources (including binutils, gcc and gdb), patch and compile them. It could take lot of time depending on your configuration so be patient. Now you are ready to test it. Try to compile application hello-jni (I've modified it, so there are STL and exceptions in the code) using instructions from Android team Enjoy! Thank you for downloading CrystaX NDK (will start in seconds)! CrystaX NDK is a fully open source project, free to use in any open-source and commercial environment. We provide it free for use and don't ask our users to pay in exchange. However, we appreciate your support, through sending us pull requests, spreading the news about CrystaX NDK over the world, or just donating: Who we are We're a small team of developers who want to make development for Android easier. Our goal is to create a comprehensive toolkit for native development for Android on C, C++, Objective-C, and, potentially, in other programming languages already working on modern POSIX systems (Swift, D, Haskell, Ocaml, Python, Ruby - you name it). We've already done a lot (as you can see on our main project page), but we want to do even more. We have a long way to go, but we know how to do it and can clearly see the steps required to make it happen. You can read more about us here. Why we need your support Since we started working on CrystaX NDK, we have funded ourselves without any sponsorship. That has led us to make money in other ways (such as working as contractors and doing consulting jobs on other projects) and invest our earnings in the CrystaX NDK project. Because of this we have only been able to work on NDK part-time, which means it is not as powerful as it could be. Having support from the community, we could pay more attention to CrystaX NDK development, without the distraction on paid contracts. This will speed up CrystaX NDK development as well as bug fixing and support. Optionally, sponsors (those who send us $200/month or more) get in exchange a number of perks - they get priority for consulting or training needs, they can be listed on the front page of the CrystaX website and mentioned in the project README, etc. Please read here for more details about sponsoring options. WARNING! When the download is finished, please check that the downloaded file is not corrupted! The SHA-256 hash must be . Here is an example of how to check it using OpenSSL: $ CHECKSUM= && \ FILE= && \ echo "$CHECKSUM $FILE" | sha256sum --check'''
