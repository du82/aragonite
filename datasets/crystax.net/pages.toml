title = "CrystaX"
full_description = "О нас CrystaX - американская компания, основанная в 2012-ом году для продолжения работы над CrystaX NDK, персональным проектом Дмитрия Москальчука. CrystaX NDK всегда был основным проектом для CrystaX, хоть он и был всегда полностью бесплатным и открытым. Наша бизнес-модель заключается в предоставлении услуг по заказной разработке ПО и консультированию для коммерческих организаций. Заработанные деньги мы инвестируем в дальнейшее развитие CrystaX NDK, делая разработку под Android более простой. В то же время CrystaX NDK, будучи открытым и бесплатным для использования продуктом, является наилучшей рекламой для нас, доказывая фактически наш опыт и умение работы в сфере разработки под Android, и тем самым приносит нам заказы. Далее Связь Чтобы узнать, как CrystaX может помочь вам, напишите нам по адресу contact@crystax.net или просто заполните форму ниже. В случае, если ваш вопрос касается CrystaX NDK, вы можете задать его в публичной группе рассылки, воспользовавшись web интерфейсом, либо просто послав e-mail на адрес crystax-ndk@googlegroups.com. Это пре-модерируемая группа, поэтому не беспокойтесь, если не увидите отосланный вопрос немедленно; дайте нам немного времени, чтобы увидеть его и одобрить. Вы также можете сообщить об ошибке, используя наш публичный багтрекер. Пожалуйста, проверьте сперва с помощью поиска по ключевым словам, что подобная проблема еще не была сообщена. Ваше имя Ваш e-mail Ваше сообщение"
