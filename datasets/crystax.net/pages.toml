title = "CrystaX"
full_description = "公司信息 CrystaX是一家成立于2012年的美国企业，旨在持续研发CrystaX NDK， 它源于Dmitry Moskalchuk发起的一个个人项目。 CrystaX NDK始终是CrystaX的主营业务，尽管它完全免费和开源。 我们的商业模式是为企业提供软件研发和咨询服务，将所有收益投入到CrystaX NDK的后续研发， 推动更加轻松简易地Android原生开发技术。与此同时，开源免费的CrystaX NDK， 作为我们的最佳品牌宣传，证明了我们在Android开发领域的专业技术水平，并帮助我们赢得大量有偿合同。 阅读全文 联系我们 想了解更多关于CrystaX企业的信息, 欢迎发送邮件至 contact@crystax.net或直接填写以下表格。 有关CrystaX NDK的技术问题，您可以在公共讨论组询问 （例如，当您不确定某些问题是缺陷或特性）。您可以通过网页提交问题，或使用邮件列表：发送电子邮件至 crystax-ndk@googlegroups.com。 这是一个自组织的讨论小组，所以如果您没能即时查看到您发布的内容，请不要担心；请容许我们花一些时间来查看和处理。 您的姓名 您的邮件地址 留言信息"
