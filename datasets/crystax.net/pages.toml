title = "CrystaX"
full_description = 'GCC 6的Android进展 2016.02.26 12:24 如您所知，GCC 6来了。它拥有许多新特性， 包括针对C++17的实验性支持（新规范，std::invoke ，std::shared_mutex , 等等） 和许多新警告，帮助开发者编写更加安全可靠的代码。事实上，GCC 6， 如果启用所有警告功能，可以完全替代某些静态代码扫描分析工具。 没有必要在此列出所有GCC 6的特性。对此感兴趣者可以到其他网站查阅即将发布的GCC 6的相关信息 （例如，这里 和 这里 ）。但是我想分享一些关于使用GCC 6进行Android开发的信息，特别是，CrystaX NDK 中GCC的未来发展。 阅读全文 Android Studio 实验性 Gradle 插件与 CrystaX NDK 的配合使用 2015.12.14 06:20 之前我们介绍过如何在 Android Studio 中使用 CrystaX NDK 。 前些时候 Google 发布了一个 Android Studio 相关支持 NDK 开发的新(实验性)Gradle插件。 让我们来看看 如何基于这个新插件使用 CrystaX NDK。 为了保持连贯性， 我们配合新插件的使用来重新梳理之前的文章， 依然是一个简单的UI应用程序，使用 Boost.Serialization。 使用 Boost 并不是为了配合 Gradle 实验性插件的新功能；我们使用 Boost 举例只 是为了覆盖更多的使用场景。 阅读全文 CrystaX NDK 10.3.0 已发布! 2015.12.14 06:18 我们很高兴的宣布 CrystaX NDK 10.3.0 已发布! 这次发布的重大更新有： 更新GCC和LLVM/clang工具链Objective-C v2支持的重大优化初步支持 Android 平台 Python (2.7 和 3.5) 另外，我们修复大量缺陷并增加若干优化改进。详见下文。 阅读全文 CrystaX NDK 10.2.0 已发布! 2015.06.24 07:01 我们很高兴的宣布CrystaX NDK 10.2.0 已发布! 我们如约前行, 在这个版本中, 我们修复大量缺陷并实现大量优化改进. 请阅读以下内容, 查看该版本带来了哪些重要新特性. 阅读全文 筹款宣传活动开启 2015.03.24 11:12 我是Dmitry Moskalchuk, CrystaX NDK(Android原生开发套件)的作者. 我在2009年开始了这个项目， 通过添加完整C++语言支持和C++标准库到谷歌Android NDK中(谷歌第一版Android NDK不支持C++). CrystaX NDK第一版发布后迅速流行起来, 因为人们真的需要C++, 使得他们的应用程序/库可以运行在Android上, 而不是用Java重写. 对于C++的支持, 谷歌两年后才达到了CrystaX NDK第一版的程度. 这让我清晰的认识到Android NDK中有很多其他部分值得去改进, 所以我把这个项目的目标"Android NDK扩展C++支持"重新定义为"Android NDK增强版", 并持续投入精力. 现在我已经为这个项目工作了五年, 为NDK增加了越来越多的功能来改进Android原生开发. 两年前, Alexander Zhukov也加入了这个项目, 所以现在我们一起工作. 我们从最初开发CrystaX NDK时起, 就一直自费, 没有任何外部赞助. 这使得我们只能依靠其他方式赚钱(例如承包一些其他项目, 做一些咨询工作), 再投入到我们项目中. 因此我们只能兼职做CrystaX NDK, 这意味着它无法变得更强大, 其实它可以做到的. 在过去的八个月, 我们开始改成全职开发CrystaX NDK, 现在我们已经取得了显著的成果, 你可以阅读 NDK页面 查看. 展望未来, 我们计划把CrystaX NDK变成一个强大的全面综合性的开发套件, 使得开发人员可以使用他们最喜爱的编程语言, 框架和库 - 即让Android开发更友好, 而不是把开发人员划分成第一类(Java)和其他类. 阅读全文 使用Android Studio构建基于NDK和Boost C++库的应用程序 2015.01.29 11:40 在 上一篇, 我们介绍了如何构建一个简单的使用Boost C++库的Android可执行程序. 这个例子很好的说明了工作流程和内部原理. 但是从实用角度出发, 我们需要了解如何构建一个可以提交Google Play商店的完整Android应用程序. 本篇将举例说明. 阅读全文 Boost + Android? CrystaX NDK! 2015.01.20 14:40 你是否代码中使用了Boost C++库? 你是否想轻松移植这些代码到Android? 或者你只是想使用Boost开始创建一个Android平台的新项目? 通过CrystaX NDK 10.1.0, 你就可以同时拥有Android原生开发套件和Boost C++库! 接下来看看如何实现. 阅读全文 Android原生本地化? 是的, 通过CrystaX NDK! 2015.01.20 14:40 好的应用必定要有好的用户体验. 首先这意味着应用程序应该支持用户所熟知的语言. 但是仅仅翻译文字和段落是远远不够的 - 不同语言文化之间还有很多其他不同元素, 包括日期格式, 货币, 格式化规则等等. 这些具体的信息都以 locales 来界定. ISO C和ISO C++标准定义了locale相关的输入输出操作规范, 所以通常只要按照标准正确本地化你的应用就够了. 不幸的是, 这种方法不适用于Android C/C++. Android libc (Bionic)不支持locales, 所以在native代码中使用本地化输入输出的唯一方法是通过JNI调用Java本地化实现. 显然这种方法增加了显著的运行时开销, 但这是你使用谷歌Android NDK的唯一选择. 阅读全文'
