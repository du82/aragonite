["https://www.cs.cmu.edu/~noamb"]
title = "Noam Brown"
description = "noam@openai.com"
full_description = "I am a Research Scientist at OpenAI working on multi-step reasoning, self-play, and multi-agent AI. I previously worked at FAIR (Meta), where my teammates and I developed CICERO, the first AI to achieve human-level performance in the strategy game Diplomacy. The paper is available here. I have also applied my research to making the first AI to defeat top humans in no-limit poker. With my CMU advisor, I created Libratus and Pluribus, which defeated top human poker professionals in Human vs. Machine competitions. Libratus received the Marvin Minsky Medal for Outstanding Achievements in AI. Pluribus was on the cover of Science Magazine and was a runner-up for Science's Breakthrough of the Year for 2019. I was also named one of MIT Tech Review's 35 Innovators Under 35. I received a PhD in computer science from Carnegie Mellon. Before CMU, I worked at the Federal Reserve Board in the International Financial Markets section, where I researched algorithmic trading in financial markets. Before that, I worked in algorithmic trading."
