["https://cs.cmu.edu/academics/faq"]
title = "Frequently Asked Questions"
full_description = '''The School of Computer Science offers a wide range of professional and academic Ph.D. and master's programs across its seven departments. Admissions and requirements vary by program, and are determined by the program's home department. Below you will find a variety of frequently asked questions about our application process. If you will be studying on an F-1 or J-1 visa, and English is not a native language for you ("native language" meaning spoken at home and from birth), we are required to formally evaluate your English proficiency. We require applicants who will be studying on an F-1 or J-1 visa, and for whom English is not a native language, to demonstrate English proficiency via one of these standardized tests: TOEFL (preferred), IELTS or Duolingo. We discourage the use of the "TOEFL ITP Plus for China", since speaking is not scored. We do not issue waivers for non-native speakers of English. In particular, we do not issue waivers based on previous study at a U.S. high school, college or university. We also do not issue waivers based on previous study at an English-language high school, college or university outside of the United States. No amount of educational experience in English, regardless of which country it occurred in, will result in a test waiver. NOTE: Unfortunately, previous studies at a U.S. high school, college or university are NOT grounds for a language-test waiver. Also, previous studies at a non-U.S. English-language-instruction high school, college or university are NOT grounds for a language-test waiver. The SCS Graduate Application Support Program is a student-led initiative to offer feedback to potential applicants, particularly those from underrepresented groups.'''
year_published = 2025
