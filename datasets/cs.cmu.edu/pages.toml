["http://www.cs.cmu.edu/~yangp"]
title = ""
full_description = "NOTE: due to load constraints, I can only start new research projects with students with IMO18-24 scores at least 30, or IOI18-24 rank top 9, or consistently reproducible equivalents. This is entirely due to limits of my bandwidth and resources. My research is broadly in the design and analysis of fast algorithms for solving fundamental computational problems, including graph algorithms, dynamic algorithms, and linear algebraic algorithms. My representative results include linear systems solvers, max-flow/min-cut algorithms, and time/space efficient data structures for matchings, resistances, and matrices. I teach courses on algorithms and data structures, and supervise research projects at all levels. I am also actively involved with outreach activities in the programming contest community, with focus at the high-school level. I am the point of contact for organizing the CMU teams attending the International Collegiate Programming Contest. I am part of the wonderful theory@cs.cmu group. I was an assistant, then associate, professor at Georgia Tech from 2015 to 2021, and was an associate professor at the University of Waterloo from 2021 to 2023. Prior to that, I received my BMath from Waterloo, PhD from CMU, and was a postdoc at MIT. I am recipient of the NSF Career Award, the 2011 Microsoft Research PhD Fellowship, the 2013 CMU SCS Distinguished Dissertation Award, the 2021 SODA Best Paper Award, and the 2022 FOCS Best Paper Award. When not thinking about problems, I enjoy biking, baseball, swimming, road trips, and flight simulators."
