["http://www.cs.cmu.edu/~glennj"]
title = "Glenn Judd"
full_description = '''I research the most dynamic and rapidly changing areas in computer systems: datacenter systems and mobile systems. "Clouds", "BigData", or "NoSQL", are all different terms for datacenter-resident systems that enable massive amounts of computational power to process huge amounts of data. I am developing new techniques for improving the scale and reliability of such systems. Systems employing my techniques are in active production use at massive scale. I also research improvements to the mobile systems and networks that are increasingly the human interface to datacenter-resident systems. Efficient Channel-aware Rate Adaptation in Dynamic Environments. Glenn Judd, Xiaohui Wang, and Peter Steenkiste. Proceedings of MobiSys 2008. Breckenridge, Colorado. June 2008. Using Emulation to Understand and Improve Wireless Networks and Applications. Glenn Judd and Peter Steenkiste. Proceedings of NSDI 2005. Boston, Massachusetts. May 2005. Link-level Measurements from an 802.11b Mesh Network. Daniel Aguayo, John Bicket, Sanjit Biswas, Glenn Judd, Robert Morris. Best Student Paper. Proceedings of SIGCOMM 2004. Portland, Oregon. August 2004. Self-management in Chaotic Wireless Deployments. Aditya Akella, Glenn Judd, Srinivasan Seshan, and Peter Steenkiste. Wireless Networks. October. 2006. The CMU Wireless Emulator that I developed is available for external users. This has been a key element in papers and courses both internal and external to CMU, and has been in active use for over six years. See the Emulator homepage for more information. Sample external paper using the CMU Wireless Emulator: A Case for Adapting Width in Wireless Networks. Ranveer Chandra, Ratul Mahajan, Thomas Moscibroda, Ramya Raghavendra, and Victor Bahl. Proceedings of SIGCOMM 2008. I am originally from Watsonville, California, home of an earthquake, lots of strawberries, and some apple cider. This should not be confused with the "Artichoke Capital of the World" Castroville, California , but it frequently is anyway; I've been asked about it worldwide. Castroville's publicity is amazing given its size.'''
