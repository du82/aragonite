["https://www.cs.cmu.edu/funds"]
title = "Explore Our Funds"
full_description = "One of the strengths of the School of Computer Science is the entrepreneurial nature of its students, faculty and researchers. The Dean's Innovation Fund allows the dean to quickly support new ideas that emerge during the year that aren't covered by the operational budget or research grants. The dean can also use this fund to improve the quality of life for graduate and undergraduate students. The Graduate Education Fellowship Fund helps SCS recruit and support talented graduate students who are underrepresented at CMU. The Research Experience for Undergraduates Fund provides resources and funding for summer educational programs across SCS that expand our reach and give underrepresented students the opportunity to explore a research career. A pooled, current-use fund awarded annually to SCS students who need assistance in lowering the cost barrier of attending CMU. When you support our SCS Outreach Initiatives, you help us give students, teachers and community organizations more access to the computer science resources they need to provide students of all backgrounds with the CS education they - and we - need for a better future. CMU's student chapter of the Association for Computing Machinery provides career development, training and a social outlet for our students. When you support this fund, you help prepare students for life beyond CMU and provide vital experience they need for their careers. Provides general support for the Artificial Intelligence undergraduate major within the School of Computer Science. This fellowship honors faculty member and Turing Award winner Ed Clarke. Ed was passionate about his research and proud of the many accomplishments of his students, who often spoke of his unwavering support. Founded by Mark Stehlik and David Kosbie — two of the School of Computer Science's award-winning teaching professors — CMU CS Academy aims to create an entirely free, online, interactive high school computer science curriculum. Provides support for student and faculty projects in space exploration and related areas, at SCS and across the university."
