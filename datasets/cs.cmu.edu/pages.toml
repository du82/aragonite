["https://www.cs.cmu.edu/~ref"]
title = "Robert Frederking's home page"
full_description = '''RIP "finger": the Unix command "finger" shows if a user is logged in, or else displays their "plan" file, with contact info. It used to be connected to the web, but that turns out to be dangerous. Quotes from my finger plan file. (This was what we used before the web.) New in 2023: Online Computational Data Science Certificate: Carnegie Mellon University has a brand-new online graduate certificate in Computational Data Science! R.I.P. Roe vs. Wade: I feel driven by recent events to state this clearly: I am a pro-choice religiously-conservative Christian. I'm not the only one. Here's something I wrote a while ago (with some help by co-authors) about The Universal Translator and why it will probably never exist! I finally got around to writing down the best story from the times I visited East Berlin in the late 1980s. Finally in digital form: "Don't Blame the Computer", the 3.5-minute-long film that Gregg Podnar and I made in 1977. We saw the 2017 total solar eclipse in Hendersonville, TN. Woohoo! It was nice that many family members were able to see one with us for a change. The photo is by Sam Rieger, my nephew. More photos here. The 2024 eclipse was cloudy enough where I was (NY) to not get good photos. Still impressive, though. I finally got around to writing down the best story from my 2001 trip to Africa. Includes a cool Google Map of the Okavango "Delta" (swamp). (I need to fix the inset map, but clicking on the larger view link still works.) Favorite 2017 quote about Trump: David Gergen, moderate Republican comentator, said that Donald Trump may have had the worst first 100 days of any President. One of the other commentators pointed out that William Henry Harrison died in his first 100 days, so it's not clear which one was worse. Best Trump joke so far (2016): Trump's secret plan to destroy ISIS: He's going to buy it, and run it like one of his casinos. On a serious note: (December 2016) It bothers me that people seem to think "the polls were all wrong". The polls predicted a very close race, and they have margins of error. In particular, Nate Silver at 538 was actually right, contrary to many people's opinions.'''
