["https://cs.cmu.edu/academics/undergraduate/honors-research-thesis"]
title = "The Honors Undergraduate Research Thesis"
full_description = "If you're thinking about graduate school, you should get involved in independent research as early as possible — typically no later than your junior year. One way to do this is through the SCS Honors Undergraduate Research Thesis Program. Any CMU undergraduate (including non-SCS students) can complete an honors thesis on any computational topic within SCS. The SCS Honors Undergraduate Research Thesis Program introduces you to the tasks involved in independent research, including library work, problem formulation, experimentation and analysis and/or theoretical proofs of computational principles, technical writing, and public speaking. You'll begin by writing a summary of prior results that will become part of your final thesis. At the end of your first semester of research, you'll present a poster, short talk and progress report at an SCS research event held during finals. Finally, you'll present your results with a poster and an oral presentation in May at CMU's undergraduate research symposium, the Meeting of the Minds, and submit a written thesis for review by an SCS faculty panel. You must select an advisor and develop a plan for your thesis. While your work must be advised by an SCS faculty member, you can also have a faculty co-advisor from elsewhere at CMU if you'd like to explore a multidisciplinary problem. To propose and complete an honors thesis, you should be in good academic standing. There is no GPA requirement for proposing or completing an honors thesis — honors will be conferred solely on the merits of the work produced. Once you've begun your honors thesis, you'll be enrolled in course 07-599 during two semesters and receive a letter grade based on activities assigned in the course and the recommendation from your research advisor. At the end of each semester, you will present your work to a panel from the SCS Undergraduate Review Committee (URC), which will first decide if you can continue to the second semester and then decide to confer honors."
