["https://www.cs.cmu.edu/~emilybla"]
title = "Emily Black"
full_description = "I'm Emily and I'm a fourth year PhD student in the Accountable Systems Lab at Carnegie Mellon University, advised by Matt Fredrikson. My research centers around understanding the impacts of machine learning and deep learning models in society. In particular, my research focuses on showing ways in which commonly used machine learning models may act unfairly; finding ways to pinpoint when models are behaving in a harmful manner in practice; and developing ways to mitigate harmful behavior when possible. Currently, I am especially interested in the intersection between fairness, model stability, and procedural justice. Increasingly, rules governing societal decisions are not just made in government but at tech startups and in academia--anywhere where predictive algorithms are created and reasoned about. Predictive algorithms now make decisions ranging from whether or not a an applicant gets a loan to whether a person is forced to go to jail or allowed to pay bail. It has been shown over the past few years that these algorithms do not always work in an equitable fashion, and there are more and more headlines as algorithms are used in more and more sensitive places: for example, racially biased healthcare distribution systems, image recognition systems, and predictive policing programs. For the most part, this is not a problem only of the models--they act as a mirror to the biases already present in our world. My research concentrates on finding ways to identify when a model is acting unfairly, curtailing this behavior when possible, and demonstrating that in some situations it is not possible. This research can take different shapes: it often concerns transparency and explainability in AI, since in order to understand how a model is unfair, we need to understand how it works in the first place. It also can consist of bringing attention to unexplored ways in which models can behave unfairly--for example, ways in which model instability can lead to unfairness. I also work on more practical methods of identifying discrimination, such as developing auditing techniques for machine learning models. Finally, I am also interested in connecting my theoretical work with practices surrounding the use machine learning systems."
year_published = 2025
clearnet = "https://www.cs.cmu.edu/~emilybla"
