["https://cs.cmu.edu/academics/international-students"]
title = "For International Students"
full_description = "With some of the world's best programs in computer science and robotics, the School of Computer Science attracts students from many nations. More than 40 percent of our students are natives of countries other than the United States. We pride ourself on creating a welcoming and supportive environment for different cultures, languages and traditions. CMU and SCS offer a variety of resources to help students interested in earning a degree at our Pittsburgh campus. All undergraduate applications are handled by the Carnegie Mellon Office of Undergraduate Admission. Students from outside the United States are not eligible for CMU financial aid. Deadlines for international students are the same as those posted for U.S. students. Students whose native language is not English must complete either the Test of English as a Foreign Language or the International English Language Testing System exam. Scores must be sent no later than Jan. 1. For more information about undergraduate studies at SCS, see the Undergraduate Programs and Undergraduate Admissions pages. Admission to master's and doctoral programs are handled by the seven degree-granting departments in SCS. International students should contact these departments directly to learn about admission requirements and deadlines. See our Master's Programs, Master's Admissions, Doctoral Programs and Doctoral Admissions pages for more information specific to your program of interest."
