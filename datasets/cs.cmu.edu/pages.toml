["https://www.cs.cmu.edu/masters-admissions"]
title = "SCS Graduate Admissions Overview"
full_description = '''Thank you for your interest in graduate studies at Carnegie Mellon's School of Computer Science! We offer a wide range of professional and academic Ph.D. and master's programs across our seven departments. Admissions and requirements vary by program and are determined by the program's home department. You can apply to up to three of our Ph.D. programs and any of our master’s programs. All applicant materials must be submitted by the deadline below, and application fees must be paid by these deadlines. If you submit your application early, your recommenders still have until Dec. 11, 2024, to submit recommendations. If you need to take/retake your TOEFL, IELTS and/or GRE for this application, we highly recommend you take the exam no later than Nov. 27, 2024. Reportable scores can take two weeks to process, and we may not be able to review any scores that arrive after our Dec. 11, 2024, deadline. If you will be studying on an F-1 or J-1 visa, and English is not a native language for you (native language…meaning spoken at home and from birth), an official copy of an English proficiency score report is required. The English proficiency requirement cannot be waived for any reason. Find more information under "Test Scores" on our FAQ page. Note: Some of our programs follow different deadlines, see application information and links below for more information. Note: To apply to the doctoral track in Algorithms, Combinatorics and Optimization (ACO) or in Pure and Applied Logic (PAL), you must apply to the Ph.D. program in Computer Science. You should state in the first paragraph of your Statement of Purpose that you are interested in either ACO or PAL. If admitted, you will be allowed to choose that program during your first year. Master of Human-Computer Interaction ApplicationNote: MHCI has a deadline that has yet to be determined. Master of Software Engineering For applicants with two or more years of software engineering experience in industry Master of Software Engineering - Embedded Systems ApplicationFor applicants with less than two years of software engineering experience'''
