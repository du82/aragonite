["https://www.cs.cmu.edu/news/maxwell-wang-awarded-hertz-fellowship"]
title = "Maxwell Wang Awarded Hertz Fellowship"
description = "Maxwell Wang has received a 2020 Hertz Fellowship."
full_description = 'The Fannie and John Hertz Foundation announced today that Maxwell Wang is one of the recipients of the 2020 Hertz Fellowship. Wang, a M.D./Ph.D. student at Carnegie Mellon University and the University of Pittsburgh, is one of 16 researchers to receive the prestigious award, chosen from more than 800 applicants from 24 universities across the nation. Hertz Fellows receive up to five years of research funding, giving them the freedom to pursue innovative ideas. At CMU, Wang is studying machine learning and neuroscience, working with mentors Avniel Ghuman, Max G’Sell and Rob Kass. He is conducting research to understand how brain networks change during neuro-interventions, such as deep brain stimulation, and to link these changes to endpoints such as symptom improvement and adverse side-effect profiles. He plans to use the Hertz funding to further explore how brain functioning is assessed. Once he completes another machine learning course, Wang will apply to enter the joint Ph.D. program in neural computation and machine learning, which is offered jointly by the Center for the Neural Basis of Cognition and the Machine Learning Department. Wang began his career as an electrical engineer, earning a bachelor’s degree from Washington University in St. Louis. He said that taking a cross-disciplinary approach to research makes for better and more interesting science. "One of the biggest advantages of this community is that people come from so many different backgrounds. You have scientists, engineers, clinicians, data scientists — the brain is where all of these fields come together, and where we can make something truly amazing happen," Wang said. Richard Steinman, an associate professor of medicine at the University of Pittsburgh, helped Wang with his application for the Hertz Fellowship. "Maxwell has an uncanny ability to absorb material and suggest next steps in an experimental, design or analytical process," Steinman said. "He is ferocious about learning and doing good," he said.'
