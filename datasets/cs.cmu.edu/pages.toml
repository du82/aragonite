["https://www.cs.cmu.edu/cs-pathways"]
title = "CS Pathways"
full_description = "The Tools to SucceedGive students the tools they need to succeed: devices, broadband access and places to learn. Resources and SupportOffer resources and support that consider students' backgrounds and prioritize treating everyone with dignity and respect. The FundamentalsTeach students important fundamentals: numeracy, literacy and computational thinking. We believe that all students — especially those who have been historically excluded from and are traditionally underresourced and underestimated in STEM fields — deserve access to programs that help them decide if theirs is a future in computer science. No one should have that decision dictated to them by their circumstances. CS Pathways exists to achieve that goal: To develop programs and initiatives that create a more equitable and inclusive journey to computer science opportunities. Offer resources and support that consider students' backgrounds and prioritize treating everyone with dignity and respect. Communities know what they need and have essential resources to help solve systemic problems. We recognize the leadership that already exists in our neighborhoods and commit our resources and connections to help solve those problems. America's educational opportunities aren't equally distributed across race, gender, socioeconomic status and geographic location. Our programs take into account the history and ongoing impact of this inequity, and prioritize the needs of students who have been historically excluded. Students should decide their own futures. We don't manufacture computer scientists — we create the conditions students need to determine if computer science is right for them. We lead with authenticity and honor the unique perspectives each person brings to solving problems. We value people for who they are and not what they do."
