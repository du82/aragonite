["https://www.cs.cmu.edu/news/2022/amazon-fellowships"]
title = "SCS Ph.D. Students Selected for Amazon Graduate Research Fellowship"
description = "Emily Black, Saurabh Garg, Natalia Lombardi de Oliveira, Emre Yolcu and Minji Yoon have received Amazon research fellowships."
full_description = "Amazon awarded its second round of research fellowships to five graduate students with ties to the School of Computer Science. They include Emily Black, Saurabh Garg, Natalia Lombardi de Oliveira, Emre Yolcu and Minji Yoon. The program supports graduate students researching automated reasoning, computer vision, robotics, language technology, machine learning, operations research and data science. The students will be invited to interview for a science internship at Amazon. Black is a Ph.D. candidate in the Computer Science Department (CSD) whose research centers on understanding the impact of machine learning models in society. In particular, she focuses on showing novel ways that common machine learning models may act unfairly; finding ways to pinpoint when models are behaving in a harmful manner in practice; developing ways to mitigate harmful behavior when possible; and translating technical insight into technology policy recommendations. Her faculty advisor is Matt Fredrikson, an associate professor in CSD and the Institute for Software Research who specializes in algorithmic fairness. Garg, a Ph.D. candidate in the Machine Learning Department (MLD), is interested in building robust and interpretable machine learning systems. He is researching the behavior of machine learning models in real-world scenarios and building provable methods to make progress toward relaxing simplifying assumptions to make robust and trustworthy models. Garg's faculty advisors are Zachary Lipton, assistant professor of operations research and machine learning in MLD and the Heinz College of Information Systems and Public Policy, and a deputy dean in the Tepper School of Business; and Sivaraman Balakrishnan, associate professor of statistics in MLD and the Dietrich College of Humanities and Social Sciences. De Oliveira, a student in Dietrich's Department of Statistics and Data Science, is pursuing her Ph.D. in data science and machine learning. She is focused on estimating generalization — the difference between the test and training performance of a predictive algorithm. Her faculty advisor is Ryan Tibshirani, a professor of statistics and machine learning in MLD and Dietrich and an Amazon Scholar."
year_published = 2025
