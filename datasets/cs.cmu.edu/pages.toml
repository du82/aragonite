["https://cs.cmu.edu/news/2018/carnegie-mellon-will-help-build-3d-cellular-map-human-body"]
title = "Carnegie Mellon Will Help Build 3D Cellular Map of Human Body"
description = "CMU scientists are part of a research team that received $2 million to help the National Institutes of Health build a 3D map of the human body."
full_description = '''Carnegie Mellon University computer scientists are helping the National Institutes of Health build a 3D map of the human body showing how tissues differ on a cellular level and providing deep insights into the body's inner workings. The NIH today announced its first set of research funding awards for the Human BioMolecular Atlas Program (HuBMAP). The NIH anticipates spending $54 million on HuBMAP over the next four years, pending available funds, including more than $2 million for the CMU scientists and their colleagues at the University of California Santa Cruz and the Wellcome Sanger Institute in the U.K. "This is really the next step in the Human Genome Project," said Ziv Bar-Joseph, a professor of computational biology and machine learning in Carnegie Mellon's School of Computer Science who will lead the CMU-based center. "Though the genome — the complete set of genes — is present in all cells, it's clearly doing different things in different organs and tissues. The job now is to create a map that shows which genes and proteins are activated in each part of the body." HuBMAP will provide scientists with a deeper understanding of how the tens of trillions of cells that constitute the body are organized in tissues to carry out the daily processes that keep people alive and healthy. The organization, specialization and cooperation of different cells in each tissue have a profound effect on tissue growth, function and aging. The ability to detect subtle changes in the activity of individual immune cells, for instance, might provide an early warning of disease before symptoms are clinically detectable. "We're excited for HuBMAP to start its journey to expand our understanding of the principles of tissue organization," said Dr. James Anderson, director of the NIH Division of Program Coordination, Planning and Strategic Initiatives. "We expect HuBMAP to provide a vital framework for global efforts to comprehensively understand the human body at a biomolecular level."'''
year_published = 2025
