["https://cs.cmu.edu/academics/phd/application-support"]
title = "Graduate Application Support Program"
full_description = "The SCS Graduate Application Support Program is an annual student-led initiative made available to applicants to our doctoral programs, particularly those from underrepresented groups. Historically, underrepresented groups have not had access to guidance from people familiar with the graduate application process. This initiative aims to help applicants improve their content by connecting them with students in the School of Computer Science (SCS) to provide feedback on their application materials. When you apply to an SCS doctoral program, you can also apply to work with a student mentor to receive input on your Statement of Purpose and general information about applying to doctoral programs. This support program is an unofficial resource independent of the SCS graduate application. You can learn more about the application process on our Graduate Admissions Overview and Frequently Asked Questions pages."
