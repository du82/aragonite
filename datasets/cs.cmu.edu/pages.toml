["https://www.cs.cmu.edu/funds/dean-s-innovation-fund-scs"]
title = "Dean's Innovation Fund (SCS)"
full_description = "One of the strengths of the School of Computer Science is the entrepreneurial nature of its students, faculty and researchers. The Dean's Innovation Fund allows the dean to quickly support new ideas that emerge during the year that aren't covered by the operational budget or research grants. The dean can also use this fund to improve the quality of life for graduate and undergraduate students. This past year, your support of the Dean’s Innovation Fund helped SCS defray the costs for the first year of our groundbreaking undergraduate degree in artificial intelligence — the first of its kind in the nation. Thanks to donors to this fund, our students will be the first in the country to earn a B.S. in AI. That's the amazing kind of work we can do when we pull together."
