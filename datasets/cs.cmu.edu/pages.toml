["https://cs.cmu.edu/about-scs/employment-scs"]
title = "Employment at SCS"
full_description = "The School of Computer Science hires faculty candidates with strong interests in graduate and undergraduate education, track records of innovative research, and outstanding academic credentials. Tenure- and research-track faculty positions become available at unscheduled intervals, as needs and programs change. Applications should be submitted online. More information is available on the SCS Dean's Business Office faculty hiring page. In addition to our seven core areas — computer science, computational biology, human-computer interaction, language technologies, machine learning, software research and robotics — we especially encourage applications in computer vision, computer-assisted learning, cybersecurity, data-intensive computing, machine learning, medical informatics and VLIS. SCS offers career opportunities ranging from entry-level positions to high-level management and administrative roles. Our environment is often demanding and fast-paced, but it's also innovative, flexible and highly collaborative. CMU offers professional and personal development opportunities for staff who wish to grow their skills and long-term careers with the university. View the latest job openings on the Human Resources website. In addition, CMU offers outstanding benefits, including medical, prescription, dental and vision insurance; tuition benefits for employees and children; retirement plans; life insurance; paid time off; exercise and recreation facilities; and free access to public transportation."
