["https://cs.cmu.edu/alumni/index"]
title = "SCS Alumni"
full_description = "In the SCS Office of Alumni Relations, we know that our graduates are our best and most important resource for helping current students change the world. We aim to connect you with the most meaningful opportunities to give back — whether it’s mentoring current students or donating to a fund that’s important to you. We’re here to help. Reach out to let us know where you are and how we can contact you for events and engagement opportunities. Be sure to follow SCS on Facebook, Twitter and YouTube. The Office of Alumni Relations sponsors numerous ways to become involved with SCS. Whether you're a recent grad excited to volunteer or an established professional interested in mentoring current students, we have an opportunity that fits your interests and means. Check out a few of the ways you can participate in SCS below. As a CMU volunteer, you can share your Tartan pride, enjoy new experiences, and connect with old friends — or make new ones. Discover opportunities in SCS and across campus today! Whether you're looking for professional development opportunities or a chance to network with currents students and alumni, our events have you covered. Check out what's coming up on our Events page. The Executive Education Program in the School of Computer Science provides organizations and people with access to the skills and tools necessary to solve real-world technical problems by equipping the next generation of technology leaders with the experience, insights and novel solutions developed by our community of computer science experts."
