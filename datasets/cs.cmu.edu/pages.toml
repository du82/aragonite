full_description = "This is my old graduate student webpage. Please visit my other web page to see work from when I was a postdoc at the School of Information and Computer Sciences at the University of California, Irvine. I'm a Ph.D. student in the Human-Computer Interaction Institute (HCII) at the School of Computer Science (SCS) at Carnegie Mellon University (CMU), working with Jason Hong and Dan Siewiorek. My research interests are in ubiquitous computing and social computing, particularly in building and evaluating usable privacy interaction techniques for context-aware mobile social applications. Prior to coming to CMU, I earned a B.S.E, with honors, in Electrical Engineering from Princeton University. I've also spent time working at Microsoft and have completed summer internships at Intel Labs Seattle and AT&T Labs Research."
