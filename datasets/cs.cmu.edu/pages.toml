["https://www.cs.cmu.edu/news/al-shedivat-receives-google-phd-fellowship"]
title = "Al-Shedivat Receives Google Ph.D. Fellowship"
description = "Maruan Al-Shedivat, a Ph.D. student in the Machine Learning Department, has received a 2019 Google Ph.D. fellowship."
full_description = "Maruan Al-Shedivat, a Ph.D. student in the School of Computer Science's Machine Learning Department, has been chosen as a 2019 Google Ph.D. fellow. He is one of 54 students from around the globe to receive a fellowship. Google has identified this international group for its exceptional work on computer science and related disciplines. The two-year fellowship includes tuition, fees and a yearly stipend, as well as a Google Research mentor. Al-Shedivat will join the other fellows at Google's Mountain View, California, campus to learn more about Google's research and connect with the company's research community. Al-Shedivat's research interests include sequential decision making, multitask learning, deep learning and graphic models. His work has explored applications in healthcare, natural language, and multi-agent systems. Before coming to CMU, Al-Shedivat received his M.Sc. in computer science at King Abdullah University of Science and Technology in Saudi Arabia."
