["https://www.cs.cmu.edu/outreach/summer-research-opportunities"]
title = "Summer Research Opportunities"
full_description = "Research experience can be life-changing for undergraduate students, but it isn't always easy to find summer opportunities that are both educational and financially possible. The School of Computer Science aims to solve that problem by offering the following intensive summer programs on the Carnegie Mellon campus. Most programs offer financial support, as well as out-of-the-classroom opportunities for enrichment and networking. The Summer Research Program in the Human-Computer Interaction Institute (HCII) is an opportunity for undergraduate students to spend 10 weeks in the HCII conducting cutting-edge research on meaningful projects with some of the world’s best researchers. This work will have the potential for publication and significant impact on the future of the field. Research projects could include smart classroom sensors, educational games, accessibility, online health support groups, smartphone privacy tools and the future of work. Research Experiences for Undergraduates in Software Engineering (REUSE) allows undergraduate students to spend a summer working with some of the world's leading software engineering faculty researchers. Project areas range from automated bug repair to usable programming tools. Some of our past REUSE students have gone on to top Ph.D. programs in computer science such as those at CMU, Berkeley and the University of Washington. Launched in 2006, the Robotics Institute Summer Scholars (RISS) program provides opportunities for students from across the country and around the world to conduct research with CMU leaders in robotics and artificial intelligence. Scholars build knowledge, skills and a network that will open doors for years to come. Renowned scientists and thought leaders in autonomy, computer vision, field robotics and artificial intelligence PLUS partners across the university in student development, service learning and student affairs anchor the scholar experience. RISS is a community that cares. It fosters a working and learning environment where all students are actively welcomed, included and supported. We work to create an atmosphere where students can explore and develop their identities as scientists. This is the first step in a mentored journey with the CMU community. The program has hosted students from more than 50 home countries and hundreds of home institutions, and participants have ranged from those with no research experience to more advanced students. The RISS community is committed to actively supporting the success of the summer scholars during their research immersion and beyond. Summer scholars present and publish their research results."
year_published = 2025
