["http://www.cs.cmu.edu/news/dunietz-receives-aaas-mass-media-fellowship"]
title = "Dunietz Receives AAAS Mass Media Fellowship"
description = "Ph.D student Jesse Dunietz will spend 10 weeks this summer at Scientific American magazine as an American Association for the Advancement of Science Mass Media fellow."
full_description = "Jesse Dunietz, a Ph.D. candidate in the Computer Science Department, will spend 10 weeks this summer at the New York offices of Scientific American magazine as an American Association for the Advancement of Science Mass Media fellow. The highly competitive Mass Media Science and Engineering Fellowship program places science, engineering and mathematics students at leading media organizations nationwide. By reporting, writing and editing for publications and broadcasts, fellows sharpen their communication skills and learn how to make scientific and engineering issues easy for the public to understand. Dunietz, who earned a bachelor's degree in computer science at MIT, works with Jaime Carbonell and Lori Levin of the Language Technologies Institute to study the semantics of natural-language text. He also has a long-standing interest in communicating science to non-technical audiences. Since coming to Carnegie Mellon in 2011, he's helped found Public Communication for Researchers, a professional development program that helps graduate students improve their ability to explain science to non-experts."
