["https://cs.cmu.edu/news/2025/roboloop"]
title = "CMU Robot Works Inside E-Waste Recycling Facility"
description = "An SCS researcher is using robotics to speed up e-waste recycling for flat-screen displays."
full_description = '''A researcher from Carnegie Mellon University's School of Computer Science is using robotics to improve e-waste recycling. E-waste is one of the fastest-growing types of waste in the world, with an estimated 62 million tons produced in 2022 alone. But only about 20% of that was recycled. As reliance on tech devices grows, finding ways to salvage and recycle their components becomes critical. Matt Travers, a senior systems scientist in the School of Computer Science's Robotics Institute, has launched a new company, roboLoop, that uses technology inspired by his e-waste recycling research partnership with Apple to help disassemble flat panel displays. roboLoop's robot was recently installed at a facility in State College, Pennsylvania. The new robot speeds up e-waste recycling for flat-screen displays. Flat panel displays, Travers said, are one of the fastest growing types of e-waste because they don't have a large resale market. "When your flat panel display breaks down, you're not calling the TV repairman," Travers said. "Instead, you buy another one. Then it becomes this problem of, 'Now I have this display. What do I do with it?' Everybody has some collection of screens that they've been trying to get rid of. They don't know where to bring it, or what days garbage collection may take them." Currently, the roboLoop robot locates and removes screws from the backs of flat panel displays, saving employees time at the facility and allowing a small team to move through disassembly more efficiently. Travers has always been interested in using robotics to address societal issues, and his work has included efforts to develop and deploy search-and-rescue robots in natural disaster situations. His research to address e-waste began with an Apple partnership that launched six years ago. During the partnership with Apple, Travers and his team developed machine learning models that enabled robots to teach themselves how to disassemble an unfamiliar device. The team first generated a 3D model of a phone by scanning it with a laser. Then they simulated cracks, cases or missing batteries to train the model to recognize the different conditions a device could be in when it arrived at a recycling center.'''
