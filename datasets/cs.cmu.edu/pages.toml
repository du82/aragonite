["http://www.cs.cmu.edu/~scsfacts/needham.html"]
title = "SCS STUDENT AWARDS"
full_description = "I am truly honored by this award. I am honored in particular because it recognizes that educating students can take place not only in the classroom but in other activities. I teach students every day about how to evaluate the commercial potential of their innovation or inventions. This learning and these skills are as relevant to their future success as knowledge that they gain from their formal studies. They learn how to be innovative, which will apply whether they pursue a career as an entrepreneur, work in larger, more established companies, or in academic institutions. Learning how to start a startup while still in school is a safe place to take risks. In Olympus, we have developed a strong curriculum through our various programs which mixes traditional learning with the practical experience of actually starting something. It is rewarding to see that CMU recognizes this contribution as valuable. I have been working at Olympus since 2008. It has been my privilege to work with close to 1000 startup teams – composed of bright, talented and motivated 'founders', eager to learn. Our startups have raised over $407 million of follow on investments, prizes and awards and are creating hundreds of jobs."
