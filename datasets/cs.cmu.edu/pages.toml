["https://cs.cmu.edu/news/2025/national-tutoring-observatory"]
title = "CMU Researchers Help Launch Project To Improve Education"
description = "SCS researchers are part of a nationwide project harnessing data from virtual tutoring services to advance teaching and learning."
full_description = '''Researchers at Carnegie Mellon University's School of Computer Science (SCS) are part of a nationwide project harnessing data from virtual tutoring services to advance teaching and learning. School districts across the country invested in tutoring programs during the pandemic to supplement learning while students were at home. As a result, these virtual tutoring platforms collected large amounts of data about effective teaching practices. Led by Cornell University, researchers from CMU, the Massachusetts Institute of Technology and the nonprofit research organization RAND launched the National Tutoring Observatory (NTO) to create the Million Tutoring Moves open-access dataset. It will be the largest dataset of its kind on effective teaching practices, and will support students while also aiding researchers and developers studying teaching and learning. The NTO received $5 million in grants from the Gates Foundation and the Chan Zuckerberg Initiative to leverage artificial intelligence and transform that data into insights that can accelerate the science of teaching and learning. Ken Koedinger, the Hillman Professor in CMU's Human-Computer Interaction Institute (HCII) and director of its Master of Educational Technology and Applied Learning Sciences (METALS) program, likened the NTO's impact to the invention of the telescope. "Like any science, collecting data on what's happening drives our understanding and improves applications," he said. "For example, astronomers wanted to understand how planets, stars and galaxies move, so they built telescopes. For tutoring, it's critical that technique should lead technology. We want to discover the ideal techniques for supporting learning through tutoring and especially in supporting student engagement." The NTO will bring together school districts, tutoring platforms, educators and researchers to collect virtual tutoring data that will be used to create an open-access dataset on effective teaching practices. While tutoring happens in every school, Koedinger said there's little known about what teaching methods are effective. Researchers can use the data from the NTO to improve teaching and develop better AI-powered tutoring tools.'''
year_published = 2025
