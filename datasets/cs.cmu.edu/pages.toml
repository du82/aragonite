full_description = "SCS undergraduates generally participate in research projects in two ways: as independent study or as an honors undergraduate research thesis. (Often, in fact, the former leads to the latter.) You can start your research journey by exploring faculty research projects on the SCS Research Portal and comparing how they align with your own goals and interests. You can also examine our list of undergraduate thesis topics and advisors from previous years to understand what's possible at the undergrad level. Finally, you can check out the university's Meeting of the Minds during the spring semester, when students present the results of their work. SCS also hosts summer research programs designed to give undergrads the chance to gain valuable research experience while considering their plans after graduation."
