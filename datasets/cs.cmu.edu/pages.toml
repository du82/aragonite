["https://cs.cmu.edu/bs-in-artificial-intelligence/minor"]
title = "Minor"
full_description = 'The AI minor aims to introduce students to both technical and societal issues associated with artificial intelligence, and provides students with exposure to some of the mathematical and algorithmic underpinnings of the field — including problem solving and machine learning. Students will be introduced to applications of AI in areas as diverse as computer vision, speech recognition and language understanding, robotics, human-AI interaction, and engineering. They’ll also get a taste of ethical, policy and economic issues that arise from the growth of AI, as well as the connections between artificial and human intelligence. The AI minor is designed to be widely accessible to CMU students who have an appropriate background in math and programming. Note: The AI minor is not available to SCS students, nor is there an AI concentration. Instead, SCS students can take a concentration in related areas, including machine learning, robotics, language technologies and human-computer interaction. The minor consists of six courses, including three courses in the AI core, two technical electives and one elective in societal aspects of AI. Students are required to take an approved course from two of the following three cluster areas. Each course must be a minimum of 9 units. Students are required to take an approved course from one of the following two cluster areas. Each course must be a minimum of 9 units. (Note: two minis can be combined to form one 9-unit course.) Apply for an Additional Major or MinorComplete our application including a statement (maximum one page) of why you want to take the minor and how it fits into your career goals. Students must have all prerequisites completed and 15-281 or 10-301/10-315, while maintaining a "C" average in aforementioned courses. Students must apply for admission no later than the semester before they intend to graduate. An admission decision will usually be made within one month. Students are encouraged to apply as early as possible in their undergraduate careers so the advisor of the AI minor can provide advice on their curriculum. Applications can be accepted based on midterm grades.'
