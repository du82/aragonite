["https://www.cs.cmu.edu/giving"]
title = "Giving to SCS"
full_description = '''Computer science underpins nearly everything in our lives in ways we might not have imagined a generation ago, and SCS has played a huge role in sparking that sea change. But while we celebrate our history, we're focused on the future. We're training the innovators and dreamers creating the technologies that will change how the next generation lives and works. Your gift to SCS supports these dreamers, but it doesn't stop there. It also allows us to help faculty members achieve their research goals. It gives us the flexibility to move quickly to meet educational and quality-of-life needs. It helps us develop new ways to work with the community, to spread the word about SCS and encourage future generations to consider computer science as a career. Generosity takes many forms! You can support SCS in ways that go beyond traditional cash donations. In fact, many of our donors can make a larger contribution by giving stock — particularly stock that has appreciated in value. Visit the university's Securities and Wire Transfers page to learn more. We’re expanding, and we’d love for you to be a part of it! Construction is underway on multiple renovation projects and new buildings, including: Carnegie Mellon was so instrumental for my life's journey. When I entered CMU for the Ph.D. program, I had just come to the U.S. and didn't know much about anything. Carnegie Mellon taught me everything: from fundamentals of computer science and how to do world-class research to effective communication and even surviving the cultural shock of coming to America! I learned so much, and the learning laid the foundation for my future development and my happiness in the years to come. I can't say enough of "Thank You!" to Carnegie Mellon, and it's only appropriate that I now do my part to support CMU and more students, so they can enjoy their own journey!'''
year_published = 2025
