["https://www.cs.cmu.edu/giving"]
title = "Giving to SCS"
full_description = "Computer science underpins nearly everything in our lives in ways we might not have imagined a generation ago, and SCS has played a huge role in sparking that sea change. But while we celebrate our history, we're focused on the future. We're training the innovators and dreamers creating the technologies that will change how the next generation lives and works. Your gift to SCS supports these dreamers, but it doesn't stop there. It also allows us to help faculty members achieve their research goals. It gives us the flexibility to move quickly to meet educational and quality-of-life needs. It helps us develop new ways to work with the community, to spread the word about SCS and encourage future generations to consider computer science as a career. Generosity takes many forms! You can support SCS in ways that go beyond traditional cash donations. In fact, many of our donors can make a larger contribution by giving stock — particularly stock that has appreciated in value. Visit the university's Securities and Wire Transfers page to learn more. We’re expanding, and we’d love for you to be a part of it! Construction is underway on multiple renovation projects and new buildings, including: The Carol Karnell Lampe Endowed Robotics Research Fund, for example, provides support to the university’s Robotics Institute. Carol Karnell Lampe, a 1967 graduate of the Margaret Morrison Carnegie College, established this fund in 2022 in honor of her mom and dad for realizing the value of education and as encouragement to her lineal generations to seek the path of higher education. Carol created this fund with a preference for work that continues the exploration for potable drinking water on land, sea, the poles of the moon or any planet beyond earth. “In my travels around the globe, I’ve seen so much inequality, and a lack of clean water is one of them. I’ve always wanted to do something to help our planet; therefore, in my heart, my endowed fund is a small start for the good of the world.”"
