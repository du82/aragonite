["https://cs.cmu.edu/dei/student-groups-leadership-opportunities"]
title = "Diversity, Equity and Inclusion"
full_description = "Women@SCS is a group for those interested in creating, encouraging and supporting women's academic, social and professional opportunities in the computer sciences and promoting the breadth of the field and its diverse community. Learn more. SCS4ALL is an initiative that works to develop social programs, professional activities and leadership opportunities to broaden interest and participation in computing. Learn more. SCS4Accessibility is a group designated to educate the SCS community of important issues related to the disability community and provide a supportive environment for those within the community. CMU’s chapter of ColorStack, a nonprofit organization that aims to increase diversity among technologists, provides community building, academic support and career development services to help Black and Latinx students find jobs. Each year, the DEI Office offers sponsorships to SCS students to attend diversity-centered conferences within the United States. Traditionally, we send students to conferences like Grace Hopper, TAPIA, SACNAS and SHPE. Whenever possible, we provide sponsorship to cover the cost of conference registration, travel, lodging and a per diem for meals during travel. Students attending conferences may be expected to staff a booth for the DEI Office. Students in undergraduate and graduate programs within the School of Computer Science are encouraged to apply for sponsorship each spring. Students should be prepared to submit the following information to the DEI Office through the application form that will be live in February or March: The DEI office then reviews applications and makes selections for the fall conference schedule. Preference is given to students who have not attended conferences previously. You must be a current student when attending conferences. The Office of Diversity, Equity and Inclusion is always seeking student volunteers to support the work of our office. If you are interested in getting involved in some of our programming, we welcome your participation and help in staffing events scheduled throughout the academic year. Contact us if you'd like to work with us!"
