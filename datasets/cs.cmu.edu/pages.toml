["https://cs.cmu.edu/news/scs-media-kit-press-contacts"]
title = "SCS Media Kit & Press Contacts"
full_description = "The School of Computer Science is the point of contact for questions regarding computer science and related disciplines including robotics, machine learning, language technologies, human-computer interaction, software research and computational biology. Chief Marketing and Communications OfficerSchool of Computer ScienceOffice: 412-268-8919emilyprice@cmu.edu Ray and Stephanie Lane Computational Biology DepartmentComputer Science DepartmentHuman-Computer Interaction InstituteLanguage Technologies InstituteMachine Learning DepartmentRobotics InstituteSoftware and Societal Systems Department Faculty (full- and part-time): 33913 current and emeritus faculty members have received the A.M. Turing Award, the most prestigious technical award for computing.Sponsored research (FY24): $270 million The Gates and Hillman centers, opened in 2009, include 217,000 square feet of classroom, office and laboratory space. Designed by Mack Scoggin Merrill Elam Architects of Atlanta, the buildings are LEED Gold certified as a green building in 2011 and won the American Institute of Architects Honor Award for Architecture in 2012. The buildings are home to the School of Computer Science offices, Computer Science Department, Ray and Stephanie Lane Computational Biology Department, Machine Learning Department, and the Language Technologies Institute. Newell-Simon Hall, opened in 2000, includes 140,000 square feet of classroom, office and laboratory space. The building is home to the Robotics Institute and the Human-Computer Interaction Institute. This 90,000-square-foot new addition to CMU is the first major construction across Junction Hollow from the main part of campus. The building primarily houses the School of Computer Science' Software and Societal Systems Department research, but includes other tenants as well. Wean Hall, opened in 1971, once housed the bulk of the School of Computer Science and remains home to some of our faculty, staff and students. CMU includes computer-related resources beyond SCS. Some of the major organizations and their contacts are listed below."
