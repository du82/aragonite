full_description = "Theory Lunch is an informal seminar run by the Algorithms and Complexity Theory Group. The seminar meets on Wednesdays, noon till 1pm, in GHC 8102. It is open to faculty, graduate and undergraduate students interested in theoretical aspects of Computer Science. The food at Theory Lunch is sponsored in part by Smart Contract Research Forum. The meetings have various forms: talks on recently completed results, joint reading of an interesting paper, presentations of current work in progress, exciting open problems, etc. All talks are recorded and are available on the CMU Theory Youtube channel. If you would like to receive notifications for the talks, as well as invitations to the Zoom meetings, you can sign up for our mailing list."
