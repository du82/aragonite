title = "Annie Lu Luo's Home Page"
description = "Research and work of computer scientist Annie Lu Luo"
full_description = '''Contact Permanent CMU Email: Education Carnegie Mellon University, Pittsburgh, PA PhD in Software Engineering, May 2008 MS in Software Engineering, December 2007 IBM Ph.D. Fellowship 2002-2003 Harbin Institute of Technology (HIT) , Harbin, China MEng in Computer Science and Engineering, July 1999 BEng in Computer Science and Engineering, July 1997 HIT Bada Inc. Scholarship 1998 HIT Most Outstanding Graduate of 1997 Neptune Foundation Scholarship 1996 South Korea Foundation Scholarship 1995 Publications Conference Papers "KLEM: A Method for Predicting User Interaction Time and System Energy Consumption during Application Design" (PDF) Lu Luo and Daniel P. Siewiorek 11th International Symposium on Wearable Computers, Boston, MA, October 2007. (Talk slides PDF) "Predicting Task Execution Time on Handheld Devices Using the Keystroke-Level Model"(PDF) Lu Luo and Bonnie E. John Conference on Human Factors in Computing Systems (CHI '05) extended abstracts on Human factors in computing systems, Portland, OR, April 2005. (Talk slides PDF) "PAWP: A Power Aware Web Proxy for Wireless LAN Clients"(PDF) Marcel C. Rosu, C. Michael Olsen, Chandrasekhar Narayanaswami, and Lu Luo 6th IEEE Workshop on Mobile Computing Systems & Applications (WMCSA '04), UK, December 2004. "The Power-Aware Streaming Proxy Architecture"(PDF) M. Rosu, C. Olsen, L. Luo, and C. Narayanaswami First International Workshop on Broadband Wireless Multimedia: Algorithms, Architectures and Applications (BroadWim '04), San Jose, CA, October 2004. "A System Design and Rapid Prototyping of Wearable Computers Course"(PDF) Asim Smailagic, Daniel Siewiorek, and Lu Luo IEEE International Conference on Microelectronic Systems Education, June 2003. "Energy-Adaptive Display System Designs for Future Mobile Environments"(PDF) Subu Iyer, Lu Luo, Robert Mayo and Parthasarathy Ranganathan First International Conference on Mobile Systems, Applications, and Services (MobiSys '03), San Francisco, CA, May 2003. (Talk slides PDF) "Energy-Adaptive Display System Designs for Future Mobile Environments"(PDF) Subu Iyer, Lu Luo, Robert Mayo and Parthasarathy Ranganathan Hewlett-Packard Labs Tech Report: HPL-2003-91 "Fault Manifestation Model for Predicting Anomalous System Behavior"(PDF) Lu Luo International Conference on Dependable Systems and Networks (DSN '02) student forum, Bethesda, MD, June 2002. Posters "A Computer System for Accessing Ambient Display and Computing Resources in Wearable Environments" (PDF) Harvey Vrsalovic, Matthew Hornyak, Lu Luo, Daniel P. Siewiorek, and Asim Smailagic. To appear on the Tenth International Symposium on Wearable Computers (ISWC 2006), Montreux, Switzerland, October 2006. "HTTP Proxy for Low-Power Operation of Wireless Clients" C. Michael Olsen, Lu Luo, Marcel C. Rosu, and Chandrasekhar Narayanaswami. Second International Conference on Mobile Systems, Applications, and Services (MobiSys 2004), Boston, MA, June 2004. Thesis "Designing Energy and User Efficient Interactions with Mobile Systems" (PDF) Lu Luo, PhD Dissertation, CMU-ISR-08-102, Institute for Software Research, School of Computer Science, Carnegie Mellon University, April 2008. Work Experience IBM T. J. Watson Research Center I spent summers 2003 and 2004 working with Marcel Rosu, Michael Olsen, and Chandra Narayananswami at the Pervasive Computing Platforms group. I researched and built an energy-aware proxy architecture for wireless LANs. HP Labs (Compaq Western Research Lab) I spent summer 2002 at the former Compaq WRL and experienced the merger to HP Labs! My mentors were Partha Ranganathan and Bob Mayo. During the summer I built an energy-adaptive display system for mobile environments based on OLED technologies. Inmedius, Inc. During January to May 2002, I worked as a part-time consultant and developer at this Pittsburgh local company. The major purpose is to gain reflective experience on a real industry software developmeng project. I participated in the design and development of Inmedius's customized mobile software solutions based on J2EE. Bell Laboratories, Lucent Technologies (China) I worked as a R&D member of technical stuff at Bell Labs China from 1999 to 2000. I worked in the digital access cross-connect system software group, my responsibilities include maintaining legacy systems based on modification requirements, designing and developing legacy-model transformation. I received trainings on telecommunication essentials, dynamic cross-connect principles, SONET/SDH standards and applications, and OOA/OOD practices in industries. Teaching Introduction to Computer Systems CMU course 15-213 (Fall 2002) As a teaching assistant, I led recitations and tutorials, monitored code for labs, graded homework and tests, and held office hours. Rapid Prototyping of Computing Systems CMU course 18-745 (Spring 2003) This is a heavily project oriented class for senior undergraduate and graduate students. I gave introductive lectures, led group discussions, provided guidelines and suggestions on projects. Women | Cars | GM CMU course 05-589 (Spring 2004) This is a research-oriented class, focusing on the driving experience and practical needs of professional women. As a teaching assitant, I led class discussions, provided guidelines and suggestions on projects, and helped on drafting consent forms, etc. Coursework A list of my past graduate coursework and projects.'''
