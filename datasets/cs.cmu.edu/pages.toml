title = "Additional Major"
full_description = 'The additional major in artificial intelligence is designed for undergraduates in another major who also want a deep dive into artificial intelligence and machine learning. It provides students with the opportunity to study the technologies and learn how to apply them to their own primary field of interest. The additional major is open to all CMU students, although the required technical courses and pre-requisites may prove challenging for students who lack the necessary background. Students who find the additional major difficult to fit into their schedules might consider the artificial intelligence minor. The additional major in artificial intelligence has almost the same requirements as the primary major. The curriculum is as follows: The additional major also requires a course in ethics and a course in cognitive psychology or cognitive science. Ethics is an essential component of an AI education, due to the roles AI systems will play in society. Human cognition is an important aspect to study, as much of AI is modeled after human intelligence. Note that Concepts in Artificial Intelligence (07-180) is not required for additional majors, although students interested in the additional major in AI are encouraged to take 07-180 prior to taking 15-281 or 10-315, in order to get a general overview of the field. Students pursuing an additional major in AI can double count at most five courses total from the AI course requirements toward all other majors and minors they’re pursuing. The mathematics, ethics and human cognition courses may double count without restriction, except for 36-402 (Advanced Methods for Data Analysis), which is part of the Machine Learning cluster. Students with majors that overlap substantially with AI should consult with the program coordinator to review their audit for any potential issues. Apply for an Additional Major or MinorComplete our application including a statement (maximum one page) of why you want to take the additional major and how it fits into your career goals. Students must have all prerequisites completed, 15-122, 15-150, and one of 15-210, 15-213 or 15-251, as well as 15-281 or 10-315. (10-301 taken prior to fall 2022 will be accepted.) Maintaining a "B" average in aforementioned courses is required for admittance to the additional major.'
year_published = 2025
clearnet = "https://cs.cmu.edu/bs-in-artificial-intelligence/additional-major"
