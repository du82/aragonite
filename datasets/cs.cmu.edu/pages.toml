["https://cs.cmu.edu/academics/phd/doctoral-programs/phd-s3d"]
title = "Software and Societal Systems Department"
full_description = "This Ph.D. program in the integrated, innovative discipline of societal computing provides the techniques, theories and research methods to address societal issues and create technologies that impact society. Building on a decade of world-leading research, ISR-SC is shaping a new scientific discipline that is changing the world. Graduates have the knowledge and skills to frame the digital landscape. The software engineering Ph.D. program infuses its research agenda with a deep appreciation of the practical issues of developing product-quality software-intensive systems. Activities include experimental prototyping, empirical modeling, codification of experience, formal analysis, creating design/development strategies for modern software, and developing public policy positions. Educational activities are tightly integrated with research and demonstration projects. Our Ph.D. program in software engineering seeks to educate the next generation of high-impact software engineering research, development and educational leaders who will solve the problems associated with building large-scale and critical software systems. The Ph.D. in Societal Computing aims to tackle the complex challenges at the intersection of computation, society and policy. With a multidisciplinary approach, the program prepares tomorrow's leaders to design technologies addressing societal needs and guide their implementation. S3D Societal Computing OverviewS3D Societal Computing Admissions OverviewS3D Software Engineering OverviewS3D Software Engineering Admissions OverviewS3D Software Engineering/Dual Degree Portugal OverviewS3D Software Engineering/Dual Degree Portugal Admissions OverviewS3D Societal Computing/Dual Degree Portugal OverviewS3D Societal Computing/Dual Degree Portugal Admissions Overview"
