["http://www.cs.cmu.edu/~mkburke"]
title = "Moira Burke"
full_description = '''I'm a computational social scientist on the Social Impact team at Meta. I do a combination of large scale data science, international surveys, and qualitative work to understand how technology affects social support, happiness, loneliness, and social capital. This work has influenced the design of Facebook's News Feed, suicide prevention tools and privacy settings. I have a Ph.D. from the Human-Computer Interaction Institute at Carnegie Mellon University. FACEBOOK (Summer 2008 and 2009) Research Intern Advisor: Cameron Marlow Modeled newcomer socialization strategies associated with future content contribution to Facebook. Modeled communication patterns associated with perceived social capital and loneliness. AT&T RESEARCH (Summer 2005) Research Intern Advisor: Brian Amento Evaluated multimodal interfaces for error correction of automatically generated voicemail transcripts. UNIVERSITY OF OREGON (2000 to 2005) Research Intern Advisor: Anthony Hornof, with Erik Nilsen Investigated human attentional capacity for animation concurrent with visual search tasks. GRAPHICS, VISUALIZATION, USABILITY CENTER: GEORGIA INSTITUTE OF TECHNOLOGY (Summer 2000) Research Intern Advisor: Jessica Hodgins Analyzed play-balancing techniques in massively multi-player games. COMPUTER GRAPHICS LAB, BROWN UNIVERSITY (Summer 1999) Research Intern Advisor: Nancy Pollard Developed tools to visualize aspects of motion, such as center-of-mass position and trajectory. UNIVERSITY OF OREGON (Summer 1998) Programmer Advisor: Steve Fickas Designed and implemented Java bots in an online "office hours" environment. WEB AND MULTIMEDIA DESIGNER (1997 to 2002) http://www.thoughtcrumbs.com/portfolio Designed websites for non-profit organizations Conducted usability testing, card sorting, heuristic evaluation Composed creative standalone applications and Shockwave movies in Director Programmed dynamic content with PHP, ColdFusion, MySQL'''
year_published = 2025
