["http://www.cs.cmu.edu/~scsfacts/arcs.html"]
title = "SCS STUDENT AWARDS"
full_description = "ARCS Foundation: Achievement Rewards for College Scientists Scholarships – The ARCS Foundation, Inc. (Achievement Rewards for College Scientists) is a national volunteer women's organization dedicated to strengthening American science and technology by providing scholarships to the best and brightest U.S. graduate and undergraduate students in the natural sciences, medicine and engineering. Four Carnegie Mellon University doctoral students will each receive $15,000 scholarship from the ARCS Foundation, Inc. (installments over 3-years). Nationwide, the ARCS Foundation has 1,400 members in 14 chapters throughout the United States. Since the organization's founding in 1958, scholarship funding has totaled more than $53 million at more than 45 of the country's best universities, making the ARCS Foundation the single largest contributor to basic scientific education of any private membership organization in the United States."
