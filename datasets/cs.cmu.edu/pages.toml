["https://www.cs.cmu.edu/bs-in-artificial-intelligence"]
title = "B.S. in Artificial Intelligence"
full_description = "Artificial intelligence is rapidly changing the world, with applications in fields ranging from autonomous vehicles, fraud detection and medicine to personal assistants, epidemiology, industrial robots and smart appliances. Carnegie Mellon has led the world in artificial intelligence education and innovation since the field was created. It's only natural, then, that the School of Computer Science would offer the nation's first bachelor's degree in artificial intelligence, which we introduced in fall 2018. The BSAI program gives you the in-depth knowledge you need to transform large amounts of data into actionable decisions. The program and its curriculum focus on how complex inputs — such as vision, language and huge databases — can be used to make decisions or enhance human capabilities. The curriculum includes coursework in computer science, math, statistics, computational modeling, machine learning and symbolic computation. Because CMU is devoted to AI for social good, you'll also take courses in ethics and social responsibility, with the option to participate in independent study projects that change the world for the better — in areas like healthcare, transportation and education. Just as AI unites disciplines from machine learning to natural language processing, instruction in the BSAI program includes faculty members from the school's Computer Science Department, Human-Computer Interaction Institute, Language Technologies Institute, Machine Learning Department, Robotics Institute, and Software and Societal Systems Department. When you graduate with a B.S. in AI from SCS, you'll have the computer science savvy and skills our students are known for, with the added expertise in machine learning and automated reasoning that you'll need to build the AI of tomorrow. If you’re applying to CMU, you first need to be accepted into the School of Computer Science. Once you’re at CMU and enrolled in SCS, you can declare a BSAI major in the spring of your first year. If you are already at CMU but not in SCS, you can transfer into the program after your sophomore year (See more on our Transfer Guidelines page.)"
year_published = 2025
