title = "SCS Tour Policy"
full_description = "The School of Computer Science and all its divisions frequently receive requests for public tours. Due to incredibly high demand, we cannot offer tours of SCS for prospective students. We invite you to take our virtual tour instead. Most of our robots are located within laboratories and are not accessible to the public. But Tank, the Roboceptionist (an interactive social robot) operates on most weekdays at the third-floor entrance to Newell-Simon Hall. Victor the Gamebot, who loves playing Scrabble, resides in the third floor common area in the Gates Hillman Center and is always up for a match. Both robots invite you to visit."
