["https://cs.cmu.edu/dei/events-and-news"]
title = "Diversity, Equity and Inclusion"
full_description = "The SCS DEI team hosts virtual and in-person OurCS workshops to introduce undergraduate students from across the country to the world of research. Attendees work on exploratory problems in teams led by researchers from industry, academia and other computing-related domains while networking with peers from across the country. The SCS DEI Seminar Series aims to educate, inspire and encourage discussion among members of the SCS community by highlighting the work of local and nationally recognized researchers, educators and advocates in computer science and STEM-related organizations. TechNights is a free outreach program held each semester for middle school students in the Pittsburgh area. Hosted by Women@SCS, TechNights is designed for attendees to explore STEM careers through fun and interactive activities such as biological experiments and maze-solving games."
