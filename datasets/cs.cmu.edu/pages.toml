["http://www.cs.cmu.edu/~scsfacts/richards.html"]
title = "SCS STUDENT AWARDS"
full_description = "When our own Herb Simon related his parable of the two skilled watchmakers – one who, building watches from a thousand atomic components, grew poorer and eventually failed; the other, creating stable sub-assemblies and treating each watch as the product of assemblies, grew prosperous – he would not have foreseen Arthur Koestler using it as a foundation for a philosophical construct called a holon. A holon is a living fractal; an entity that exists as a self-contained whole with autonomy and self-reliance, simultaneously composed of smaller holons and a part of larger holons. Recursive definitions should have some appeal in this crowd. We ourselves are holons, not in the Matryoshka doll sense of self-identical fractals, but holons nonetheless. We are an assembly of many individual parts we do not directly control: our hearts, our guts, brains; they are holons of molecules, in turn holons of atoms. It's turtles all the way down. We are also a part of something greater: we are a part of humanity, the mother of all complex holons, and humanity would be fundamentally different and incomplete without our individual contributions. The holon before you is the product of two amazing parents, Francis and Georgene, seated among you, who raised me and my sister in the belief that advantage in life is also a responsibility to help the less advantaged; that victories are sweeter when celebrated with those who kept you from defeat; and that leadership, compassion, and humility are best taught through demonstration. I began as a teaching assistant my first year as an undergraduate. I was lucky to discover so early something I enjoy, I do reasonably well, and that allows me to contribute. My teaching duties have varied across countries, roles, and disciplines, but my commitment to education has not changed or wavered. It's the way I choose to serve. You must find your own way. If you would like some help getting started, I invite you to come talk to me; I'm easy enough to find. You are here today because you are gifted, hardworking, and above all, lucky. You may have studiously advanced a natural talent for computer science, or developed a work ethic to shame mere mortals, or cultivated a sense of humor based on an Assistant Dean that shall remain... named Mark. But in this chaotic universe you were one butterfly wing's flap from being born in a place without access to clean water, without gender equality, without schools, without Twitter, or without some of the things that made you, you."
