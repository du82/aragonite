["http://www.cs.cmu.edu/~sss"]
title = "SCS Student Seminar Series"
full_description = 'Spring 2023 Schedule Mon, Jan 16 GHC 6501 available Fri, Jan 20 NSH 3002 available Mon, Jan 23 GHC 6501 available Fri, Jan 27 NSH 3002 available Mon, Jan 30 GHC 6501 available Fri, Feb 03 NSH 3002 available Mon, Feb 06 GHC 6501 available Fri, Feb 10 NSH 3002 available Mon, Feb 13 GHC 6501 available Fri, Feb 17 NSH 3002 available Mon, Feb 20 GHC 6501 available Fri, Feb 24 NSH 3002 available Mon, Feb 27 GHC 6501 available Mon, Mar 03 GHC 6501 available Mon, Mar 06 GHC 6501 available Mon, Mar 10 GHC 6501 Machine Knitting Program Semantics and Equivalence Presented by Jenny Lin Abstract: Machine knitting is a well-established fabrication technique for complex soft objects, and both companies and researchers have developed tools for generating increasingly complex machine knitting programs. This increasing complexity has brought to the forefront a seemingly trivial question: how do we know whether a given program produces the correct object? A semantics approach to this problem requires mathematically characterizing the object made by a machine knitting program; however this is particularly difficult for knitting, which takes several continuous strands of yarn and manipulates them into many stable, interlocking loops. Existing representations for machine knitted objects are incomplete (do not cover the complete domain of machine knittable objects) or overly specific (do not account for symmetries and equivalences among knitting instruction sequences). In this talk, I present a formal semantics for knitout, a low-level Domain Specific Language for knitting machines. This is accomplished using labeled tangle, which extends concepts from knot theory to allow for a definition of equivalence that matches the intuition behind knit objects. This formalism allows for low-level program rewrites to be proven correct under topological equivalence, which in turn provides the foundation for high-level tasks such as machine-specific compilation and optimization. Mon, Mar 13 GHC 6501 available Mon, Mar 13 GHC 6501 available Fri, Mar 17 NSH 3002 available Mon, Mar 20 GHC 6501 available Fri, Mar 24 NSH 3002 available Mon, Mar 27 GHC 6501 available Fri, Mar 31 NSH 3002 available Mon, Apr 03 GHC 6501 available Fri, Apr 07 NSH 3002 available Mon, Apr 10 GHC 6501 not available Fri, Apr 14 NSH 3002 available Mon, Apr 17 GHC 6501 available Fri, Apr 21 NSH 3002 available Mon, Apr 24 GHC 6501 Mediation in Extensive-Form Games: Mechanism Design, Information Design, and Correlated Equilibria under a Unified Framework Presented by Brian Zhang Abstract: Mechanism design, information design, and correlated equilibria are three problems that are usually treated separately in literature. Mechanism design is the problem faced by a principal attempting to *elicit* information from agents. Information design is the problem faced by a principal attempting to strategically *reveal* information to agents. Finally, correlated equilibria in games are distributions of strategy profiles from which no player has any incentive to deviate. In this talk, we introduce a unified framework under which these three problems are special cases. Under this framework, we show that polynomial-time algorithms exist under certain conditions, and we argue that the difference between (extensive-form) correlated equilibria and information design is that the former contains *privacy* constraints, prohibiting the principal from "leaking" information from one player to another. Fri, Apr 28 NSH 3002 available Mon, May 01 GHC 6501 available Fri, May 05 NSH 3002 available Mon, May 08 GHC 6501 available Fri, May 12 NSH 3002 available Mon, May 15 GHC 6501 available Fri, May 19 NSH 3002 available'
