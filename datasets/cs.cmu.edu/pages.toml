["https://cs.cmu.edu/news/2025/satya-nae"]
title = "Satyanarayanan Elected to National Academy of Engineering"
description = "Mahadev Satyanarayanan, the Jaime Carbonell University Professor of Computer Science at Carnegie Mellon University, has been elected to the National Academy of Engineering."
full_description = '''Mahadev Satyanarayanan, the Jaime Carbonell University Professor of Computer Science at Carnegie Mellon University, has been elected to the National Academy of Engineering. The NAE honored Satya, faculty in the School of Computer Science's Computer Science Department, for his contributions to distributed file systems, edge computing and mobile computing. Satya is viewed as "the father of edge computing" for his seminal 2009 paper "The Case for VM-based Cloudlets in Mobile Computing" and decades of pioneering contributions to the field. His research has focused on the challenges of performance, scalability, availability and trust in information systems that reach from the cloud to the mobile edge of the internet. Satya leads the Living Edge Lab at CMU. He earned his Ph.D. in computer science from CMU after completing bachelor's and master's degrees from the Indian Institute of Technology Madras in Chennai, India. The NAE elected 128 new members and 22 international members to the class of 2025. Election to the NAE is among the highest professional distinctions accorded to an engineer. Individuals in the new class will be formally inducted during the NAE's Annual Meeting in October. Learn more about the NAE and its class of 2025 on the academy's website.'''
