full_description = "This is the home page for the Artificial Intelligence Seminar Series, sponsored by SambaNova Systems, at the School of Computer Science of Carnegie Mellon University. The faculty coordinator is Zico Kolter and the student coordinators are Asher Trockman, Eungyeup Kim and Victor Akinwande. The mailing list for upcoming AI Seminar talk announcements is on the SCS mailman server. Unless otherwise noted, the meetings are on Tuesdays at 12:00 PM Eastern Time (always available virtually, and usually in person in GHC 6115). This seminar aims to cover a wide variety of AI topics, such as computer vision, natural language processing (NLP), theoretical ML, AI fairness & ethics, cognitive science, AI hardware, etc. See more about CMU AI initiative here. Please contact Victor for arrangements or questions about this page."
