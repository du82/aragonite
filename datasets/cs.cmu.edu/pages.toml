["http://www.cs.cmu.edu/~scsfacts/mallory-cawley.html"]
title = "SCS STUDENT AWARDS"
full_description = "Thanks to its unique position in Carnegie Mellon University's School Of Computer Science, CMU CS Academy is able to provide an incredible learning platform and resources to schools around the globe. As a member of this university community we are able to foster an environment where we are building resources and providing ongoing support to K-12 computer science educators and their students in a way that feels very supportive and engaging for our users. They are able to work closely with some of the brightest minds, from the professors that volunteer their time to support our work to the undergraduate students that work on the project. It is very clear that all members of the CMU CS Academy team put their heart and soul into the work and the classrooms that use our resources and attend our professional development sessions greatly benefit from their efforts. We were lucky enough to be tasked with leading these efforts and our varying backgrounds helps to bring our team together. As we continue to grow as a project we are excited to see all that CMU CS Academy and the greater SCS community is able to do for K-12 CS Education."
