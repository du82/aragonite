["https://www.cs.cmu.edu/academics/masters/programs"]
title = "Master's Programs"
full_description = "SCS offers a wide range of professional and academic master's programs across its seven departments. Admissions and requirements vary by program and are determined by the program's home department. Links to all departments and master's programs appear below. Additionally, our Master's Programs Comparison Data includes statistics, facts and other information for each program. If you're interested in applying, be sure to visit our Graduate Admissions Overview page or read our Frequently Asked Questions. The M.S. in Automated Science program is the first of its kind and provides training for students to play roles in the development of highly automated systems for doing science. It provides training in the principles and hands-on use of robotic laboratory equipment, the fundamental computational biological methods for constructing predictive models in biology and medicine, and the methods of active machine learning and AI for automatically and iteratively choosing experiments to achieve a given goal. The program is designed for a diverse applicant pool and will be especially valuable to students with undergraduate degrees in biology seeking to gain advanced computational skills for jobs in the laboratory automation industry. Opportunities also exist for successful graduates to transition to Ph.D. programs. The M.S. in Computational Biology program seeks to train the world's best computational biologists at the master's level. The curriculum provides both breadth and depth of training in computational biology, and is built on a solid foundation of biology, computer science, statistics and machine learning (data sciences). The program is designed for students with backgrounds in quantitative and/or life sciences. Students often participate in summer research internships in life sciences, industry or academic research laboratories. MSCB graduates are prepared for rewarding jobs in industry or to pursue their doctoral degrees at top universities. The Fifth Year Master's in Computer Science is a direct master's program for students receiving a bachelor of computer science from Carnegie Mellon. The purpose and goal of the program is to encourage our very brightest undergraduates to become involved with research that broadens their often hectic undergraduate experience."
