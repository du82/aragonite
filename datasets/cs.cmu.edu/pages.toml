e and Data Engineering. Jan 2015: Program committee member for WebDB 2015, at SIGMOD 2015. Nov 2014: A workshop paper accepted in Automated Knowledge Base Construction Workshop AKBC 2014, at NIPS 2014. October 2014: A full paper accepted in WSDM 2015!! October 2014: Gave a guest lecture in CS-601 Machine Learning class at CMU. Slides in [PPT], [PDF] October 2014: Program committee member for AKBC 2014 4th Workshop on Automated Knowledge Base Construction at NIPS 2014 August 2014: Awarded Honorable mention for presentation at the 2014 LTI Student Research Symposium (SRS 2014) held in CMU on 21st Aug'14. June 2014: A workshop paper published in Entity Recognition and Disambiguation Challenge ERD 2014, at SIGIR 2014. Mar 2014: Program committee member for EMNLP 2014 (Information Extraction track) Dec 2013: Presented Thesis proposal. Committee members: Prof. William Cohen(CMU), Prof. Jamie Callan(CMU), Prof. Tom Mitchell(CMU), and Dr. Alon Halevy(Google Research). August 2013: Awarded Honorable mention for presentation at the 2013 LTI Student Research Symposium (SRS 2013) held in CMU on 21st Aug'13. June 2013: Received 2013 Google U.S./Canada Fellowship in Information Extraction : (List of recipients) April 2013: Student travel award for SDM 2013 Jan 2013: Got married to an awesome person Aditya Mishra :) Summer 2012: Intern at Google research, Mountain View. Host : Anish Das Sarma, Team lead by : Alon Halevy Program committee member for EMNLP 2012, NAACL HLT 2013, AKBC 2013, AKBC 2014, EMNLP 2014, WebDB 2015, IJCAI 2016, AKBC 2016 Reviewer for Journal of Internet and Information Systems 2011, WWW Journal 2011, ECML/PKDD 2013 Journal track, WSDM 2014 (secondary reviewer), VLDB 2014 (secondary reviewer), TKDE Journal 2015 (IEEE Transactions on Knowledge and Data Engineering). Fall 2012, Spring 2011: Teaching assistant for Analysis of Social Media 10-802 Contact Email: bhavana DOT dalvi AT gmail DOT com Resume [PDF] [Last updated: Spring 2015] Hobbies Listening to music R