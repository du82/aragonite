["https://cs.cmu.edu/dei/dei-seminars/index"]
title = "Seminar Series on DEI in CS"
full_description = 'In 2021, the School of Computer Science established a diversity, equity and inclusion seminar series. The seminar series contributes to the depth of ongoing, university-wide discussions on dimensions of diversity, equity, inclusion and belonging by highlighting the work of researchers, educators, advocates and industry in CS & STEM-related organizations. The SCS DEI Seminar Series aims to educate, inspire and encourage discussion among SCS members about diversity, equity and inclusion in general and about DEI(B). The seminar series is open to all members of the SCS, CMU and wider communities. Seminar speakers are intentionally chosen as a mix of local and nationally recognized experts to inspire reflection, promote conversation, expose new approaches and create opportunities for collaboration. The speakers are drawn from across CMU and industry. Other seminars in SCS and CMU also focus on DEI topics, including the HCII Seminar Series and CyLab Seminar Series. In "One Can of Carrots," Thompson shares her experience of food insecurity and connects it and other poverty experiences to trauma and how that trauma influences decision-making, self-perception and the ability to recognize opportunity. Learn how drone technology — an emerging tech industry using AI and computer vision — requires diverse voices, research and inclusive thought leadership to advance further societal needs and human-centric approaches developed by various representatives from all backgrounds that can provide academic research in a range of scientific fields and technical disciplines. Use cases of AI-enabled drone technology. AI tools and resources for effective research, the voice of the research community. Roles, responsibilities and representation to build and develop an inclusive thought drone ecosystem based on scientific and technological research practices to bridge the gap between science and technology. Societal and environmental impacts of AI open source research practicalities. Develop AI drone technology research areas (examples).'
