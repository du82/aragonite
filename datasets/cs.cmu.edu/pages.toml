["https://cs.cmu.edu/news/2025/bar-joseph-genbio-ai"]
title = "Bar-Joseph To Join GenBio AI"
description = "SCS faculty member Ziv Bar-Joseph will join biotech startup GenBio AI as the company's co-founder and chief scientific officer."
full_description = '''Ziv Bar-Joseph, faculty in Carnegie Mellon University's School of Computer Science, will join biotech startup GenBio AI as the company's co-founder and chief scientific officer. In this role, Bar-Joseph will lead work on the integration and use of the company's multiscale foundation models to set a new course for drug discovery, medicine and biological understanding. "GenBio AI is building a world-class research environment to develop the first AI-driven Digital Organism, and I'm excited to be part of the team advancing AI-driven biology," Bar-Joseph said. "GenBio AI's vision is unique in its ambition to create such an innovative model, and I look forward to leading the team in pushing the boundaries of discovery." Bar-Joseph, the FORE Systems Professor of Computer Science in the Machine Learning and Ray and Stephanie Lane Computational Biology departments, specializes in biological systems modeling and AI applications in genomics and systems biology. He was a vice president and head of R&D data and computational sciences at Sanofi, a global pharmaceutical company, where he led multidisciplinary teams in machine learning, computational biology and data science to accelerate drug and vaccine discovery. He received the 2012 Overton Prize in computational biology. Bar-Joseph's role at GenBio AI will build on his experience leading the computational work for the Human BioMolecular Atlas Program (HuBMAP), a 3D cellular map of the human body, and the Cellular Senescent Network (SenNet), a program to locate and study senescent cells in the human body to gain new insights about aging. These are both large-scale, National Institute of Health-funded efforts led by CMU researchers using computational tools to learn more about the human body and human health. GenBio AI will use these and other large datasets to develop models for virtual cells and organs to improve the understanding of biology and medicine. "Bar-Joseph is a highly accomplished colleague from CMU and his expertise in computational biology and AI is unparalleled," said Eric Xing, an SCS faculty member and a co-founder and chief scientist at GenBio AI. "His leadership will be instrumental in shaping GenBio AI research and development directions. We are thrilled to have him on board as we push the frontiers of scientific discovery."'''
