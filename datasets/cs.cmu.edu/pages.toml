full_description = '''The Allen Newell Award for Research Excellence is awarded by the School of Computer Science at Carnegie Mellon. It recognizes an outstanding body of work that epitomizes Allen Newell's research style as expressed in his words: "Good science responds to real phenomena or real problems.""Good science is in the details.""Good science makes a difference." This award may be made for a body of work to an individual or to a group of individuals. Recipients need not be currently at Carnegie Mellon. However, key aspects of the work being recognized must have been done at Carnegie Mellon. Recent accomplishments will be favored over older ones, with the caveat that the early steps of a recently-completed piece of work may have occurred many years ago.'''
