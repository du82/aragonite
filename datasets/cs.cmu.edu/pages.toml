["https://cs.cmu.edu/academics/overview-programs"]
title = "Overview of Programs"
full_description = "Since its founding more than 25 years ago, the Carnegie Mellon School of Computer Science has been a world leader in computing research and education. Our graduate programs consistently rank among the top in the nation, and we're highly ranked in specialty areas such as programming languages, artificial intelligence, systems and theory. At the undergraduate level, we introduced the nation's first bachelor's degree in artificial intelligence in 2018, added a bachelor's program in human-computer interaction to our offerings in 2020 and expanded to offer a bachelor's degree in robotics in 2023. Our students from these and our programs in computer science and computational biology leave CMU set to join industry without missing a beat, or to attend some of the best graduate schools in the country. In fact, a survey by editors of The Wall Street Journal ranked our undergraduate computer science program best in the United States among corporate recruiters. SCS offers bachelor of science degrees in five areas: computer science, computational biology, artificial intelligence, human-computer interaction and robotics. SCS also offers interdisciplinary majors in computer science and the arts, and music and technology. Admissions to all bachelor's degree programs are administered through CMU's Office of Undergraduate Admission. SCS also offers additional majors in artificial intelligence, computational biology, computer science, human-computer interaction and robotics. Many of our departments also offer minors for non-SCS students and concentrations for SCS students. Graduate admissions are handled on a case-by-case basis by SCS's seven degree-granting departments. Policies and procedures may vary. See the departmental program links below, or our Master's Programs and Doctoral Programs pages for more information. The programs listed below are not administered by the School of Computer Science, but may be of interest to our current and prospective students, and may include SCS coursework. Please contact the School which administers the program for more information."
