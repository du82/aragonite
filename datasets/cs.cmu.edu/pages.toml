["https://www.cs.cmu.edu/news/2024/ai4bio"]
title = "CMU Launches Center for AI-Driven Biomedical Research"
description = "The new Center for AI-Driven Biomedical Research (AI4BIO) will use novel artificial intelligence and machine learning methods to illuminate fundamental aspects of gene regulation, cellular function, tissue development and disease progression."
full_description = '''Mysteries surround the complex information encoded within human genomes and cells. Deciphering the intricate language that governs cell structure, function and communication could vastly improve the understanding of human health and disease. Carnegie Mellon University's new Center for AI-Driven Biomedical Research (AI4BIO) aims to unlock these mysteries by developing and applying novel artificial intelligence and machine learning methods. These tools seek to illuminate fundamental aspects of gene regulation, cellular function, tissue development and disease progression. AI4BIO will tackle the challenges of applying the latest AI advancements to biomedicine, enabling research to fully incorporate new technologies and tools. "AI-driven biomedical research holds tremendous potential for addressing intractable problems related to cellular mechanisms and for advancing our understanding of some of the most devastating, incurable diseases," said Jian Ma, the Ray and Stephanie Lane Professor of Computational Biology and director of AI4BIO. "CMU has the talent and creativity to rise to these challenges." Based in the Ray and Stephanie Lane Computational Biology Department within CMU's School of Computer Science (SCS), AI4BIO will forge new connections across CMU and beyond and establish new frontiers in medicine, advancing treatments for cancer, Alzheimer's and other diseases. "Advances in AI are transforming scientific inquiry, with the potential for groundbreaking discoveries that could shape the future of medicine," said Martial Hebert, dean of the School of Computer Science. "This initiative positions the School of Computer Science to play a critical role in the development of AI tools and will impact the biomedical research conducted across CMU." AI4BIO has established its inaugural leadership group, including Ma; Russell Schwartz, head of the Lane Computational Biology Department; Carl Kingsford, the Herbert A. Simon Professor of Computer Science; and Kathryn Roeder, the UPMC Professor of Statistics and Life Sciences.'''
year_published = 2025
clearnet = "https://www.cs.cmu.edu/news/2024/ai4bio"
