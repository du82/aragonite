["http://www.cs.cmu.edu/~careers"]
title = "SCS Careers"
full_description = "Recruiters are encouraged to connect with our students through SCS Let's Talk!, campus career fairs, information sessions, technical presentations, course sponsorships, the SCS Professional Series, the Ph.D. Seminar, meet-and-greet programs, resume collections, and involvement in an array of unique student and division programming. This year, because of the changing circumstances, we are embracing the power of virtual. See our scheduled programs. We also welcome an opportunity to talk with you directly to better assess your needs, to discuss opportunities and worthwhile programs for interacting with all our students, and to explore our academic programs and scientific/research parallels. You can reach us via telephone at 412-268-8525 or email careers@cs.cmu.edu. Our SCS Career Center Events page connects you with employers through career fairs, conferences and special events — offering the opportunity to showcase your research and educational accomplishments. It also allows you to view current events and deadlines. A variety of jobs within CMU are available for motivated students to provide professional experience and advancement, while affording additional financial resources. Students should search for work-study and federal community service positions using Handshake. You are welcome to submit resumes online, sign up for interviews and learn more about potential campus employers."
