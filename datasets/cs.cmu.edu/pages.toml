["https://cs.cmu.edu/partnerships/index"]
title = "Partnerships"
full_description = "Carnegie Mellon’s School of Computer Science is a world leader in innovative thinking. Solving real-world problems is what we do best. We offer a variety of partnership opportunities. In addition to research, recruitment and workforce development, there are many exciting educational projects and programs, capstone projects, and outreach programs. The Partnerships Team is always available to help you connect with the SCS community. We also publish a newsletter, Engage, that highlights ways to partner with students, staff and faculty. You can read past issues here. We look forward to hearing from you soon! The new Center for AI-Driven Biomedical Research (AI4BIO) will use novel artificial intelligence and machine learning methods to illuminate fundamental aspects of gene regulation, cellular function, tissue development and disease progression. CMU recently hosted WebAssembly Research Day, bringing together researchers from academia and industry and the W3C Community Group overseeing the standards governing the platform. SCS researchers worked with the World Wildlife Fund for Nature to develop a tool that monitors and identifies media articles related to environmental conservation and possible threats to at-risk animals, including rhinos like the ones shown here. Researchers at CMU and Iowa State University created an agricultural robot platform that can autonomously insert nitrate sensors into corn stalks and monitor macronutrient levels in the crops."
