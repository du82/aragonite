["https://cs.cmu.edu/outreach/index"]
title = "Outreach Initiatives"
full_description = "Computer science as a field faces incredible challenges. Only one in four schools offer any form of digital literacy classes — a staggering number, given that the U.S. will have about 1.4 million computer science-related jobs in 2020. As it stands now, we’ll only have enough CS grads nationally to fill about a third of them. To make matters worse, most of the schools that offer CS classes reside in affluent school districts, creating a big knowledge gap between kids from different socioeconomic backgrounds.In SCS, we’re working hard to bridge that gap and introduce students to computer science well before they get to college. Check out how we’re giving students, teachers and community organizations more access to computer science resources, and how you can help us in our efforts. We've also included programs that help current SCS students during their time at CMU. This list will grow and change over time, so be sure to check back frequently. AI for Teachers supports high school educators who want to gain familiarity with AI and offer AI-related educational activities for their students. The workshop covers an introduction to a broad range of artificial intelligence topics including machine learning, deep learning, search algorithms, information retrieval and recommender systems. AI Scholars will take a deep dive into the world of artificial intelligence through a combination of classroom instruction, hands-on research projects, faculty lectures, and industry engagement with leading tech companies around the country. As an AI Scholar you will engage in college-level courses, as well as weekly seminars that explore college admissions, financial aid, building independence, mental health, emotional wellness and more. You will have the opportunity to develop meaningful connections with peers and mentors while being fully immersed in the college experience. AI Scholars will take a deep dive into the world of artificial intelligence through a combination of classroom instruction, hands-on research projects, faculty lectures, and industry engagement with leading tech companies around the country. As an AI Scholar you will engage in college-level courses, as well as weekly seminars that explore college admissions, financial aid, building independence, mental health, emotional wellness and more. You will have the opportunity to develop meaningful connections with peers and mentors while being fully immersed in the college experience."
