["https://www.cs.cmu.edu/undergraduate-admissions"]
title = "Undergraduate Admissions"
full_description = '''Carnegie Mellon's Office of Undergraduate Admission processes applications for admission to the School of Computer Science (SCS), which currently offers five undergraduate majors. When completing the Common Application, students considering admission for fall 2025 have the option to indicate any departments within the School of Computer Science that interest them. Most majors align with departments. If you would like to share your primary interest in computational biology, computer science, human-computer interaction or robotics, select the corresponding department. If your primary interest is artificial intelligence (AI), select "SCS Undecided" and indicate your interest in AI in the application's first short-answer response, which asks you to reflect on your academic/artistic passions. (AI is an interdepartmental major that does not correspond to the departments in the application.) Note that CMU admits into SCS and not directly to departments within SCS. Major declaration occurs during the spring semester of your first year as an SCS student, and all enrolling SCS students have the option to declare any of the five primary majors SCS offers. The department you select in your application does not factor in the admissions process and is only used to provide us with data on student interests for outreach after admission. For additional application requirements, deadlines and information, refer to the Undergraduate Admission website. Students who have already been admitted to Carnegie Mellon can apply for our dual-degree offerings in any primary SCS major, or can apply to transfer into SCS. If you're interested in either of these options, complete our transfer form. Note that transfer into (or dual degree with) SCS has strict requirements and is not guaranteed. Admission will depend on coursework and related activities, overall justification of transfer and availability of seats in the program. We offer additional majors in artificial intelligence, computational biology, computer science, human-computer interaction and robotics. Students interested in these programs must already be accepted and enrolled in another CMU undergraduate program. Each department administers admissions for their programs, and admission requirements and application deadlines vary. If you're interested in these programs, visit the appropriate department program page for more information.'''
