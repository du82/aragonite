["https://cs.cmu.edu/partnerships/industry-government/research"]
title = "Research"
full_description = "SCS faculty and staff are busy thinking big, working hard and making the next great idea a reality. We welcome research collaborations and work closely with partners to develop and mature technologies from concept through delivery to end-users. Contact us to learn how you can participate in any of the sample research projects or programs listed below. AI fusion can augment what humans do and increase quality of life, safety, productivity and efficiency in meaningful, transformative ways. The Center for AI-Driven Biomedical Research (AI4BIO) aims to develop new AI technologies to decipher the intricate language governing cellular structure and functions across a wide range of biological contexts. The goal of CMU's Center for IDeaS is to enhance social-cybersecurity to preserve and support an informed democratic society. The CIH advances digital health research and technology through the development of AI and computational solutions, collaborative partnerships, and transfer of knowledge and methods. Unprecedented resources through the Center for Machine Learning and Health have the potential to turn CMU's novel, interdisciplinary research and innovation into data-driven health solutions that matter. The Center for Transformational Play uses the power of play to tackle educational, industrial and social challenges, from teaching children about robotics to helping adults with their aphasia rehabilitation exercises. The CMU FLAME Center fosters fundamental research into powerful, open, and responsible foundation models applicable to all sectors of science and technology. CMU's DARPA Triage Challenge Team seeks technology partners and funding sponsors to join this important effort combining health technology, robotics and the advancement of sensing capabilities to identify and classify human injuries in the field, with no physical contact, from 1 to 10 meters away. The Delphi Group develops the theory and practice of epidemiological forecasting, with a long-term vision of making this technology as universally accepted and useful as weather forecasting is today."
