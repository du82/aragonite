["https://www.cs.cmu.edu/~yongkiat"]
title = "Yong Kiam Tan"
full_description = "I also hold a joint appointment as a Nanyang Assistant Professor at the College of Computing and Data Science, NTU, Singapore. I completed my PhD in Computer Science (Pure and Applied Logic) at Carnegie Mellon University, where I was supported by a National Science Scholarship (BS-PhD) from A*STAR, Singapore. I am an alumnus of the Logical Systems Lab, where I was fortunate to be advised by Prof. André Platzer. I am looking for students and postdocs to work on topics related to my research interests listed below. They are based in Singapore at the College of Computing and Data Science, NTU and at the Institute for Infocomm Research, A*STAR. In general, I like to learn and explore new areas of math / computer science, and theorem proving gives me a great excuse way to do so. Please get in touch with me (contacts below) if you are interested in collaborating on any of these topics. My PhD thesis examined the proof theory of Differential Dynamic Logic (dL), in particular, the continuous fragment of dL, which allows users to syntactically reason about systems of ordinary differential equations. Current: Wei-Lin Wu (research scientist), Joe Watt (research engineer), Yuzhi Zeng (NTU undergrad), Kwangjoo Park (NUS undergrad), Irvin Ng (TP student) Past: Soohyeon Choi (ARAP co-supervisor), Derrick Wan (NTU undergrad), Sunpill Kim (ARAP co-supervisor), Bora Jeong (SIPGA co-supervisor), James Gallicchio (CMU undergrad) Please feel free to contact me for preprints if they are not available below; use the DOI links for official publications. Formal Methods in System Design (FMSD). Extended version of our FM'19 paper. (tool,arXiv,doi,ICSE'23 Showcase slides) Oskar Abrahamsson, Son Ho, Hrutvik Kanabar, Ramana Kumar, Magnus O. Myreen, Michael Norrish, Yong Kiam Tan Hannes Ihalainen, Andy Oertel, Yong Kiam Tan, Jeremias Berg, Matti Järvisalo, Magnus O. Myreen, Jakob Nordström Thomas Sewell, Magnus O. Myreen, Yong Kiam Tan, Ramana Kumar, Alexander Mihajlovic, Oskar Abrahamsson, Scott Owens"
