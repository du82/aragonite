title = "SCS Videotape Collection - DLS"
full_description = '''INVENTING THE FUTURE: AI and CS in the 21st Century A Symposium in Honor of Raj Reddy's 60th Birthday AI and Computer Science have had a profound impact on society during the last four decades. Carnegie Mellon hosted this symposium to coincide with and in honor of Raj Reddy's "Over the Hill" 60th Birthday. Raj has been an influential figure in the Computer Science Community at Carnegie Mellon and on the national scene. We used this occasion for reviewing the past successes and future challenges in AI and Computer Science. The selection of topics for the symposium were limited to areas in which Raj has had substantial influence. The symposium used past successes and failures as a prologue for future opportunities in the 21st century in the areas of Speech, Vision, Language, Robotics, Digital Libraries, Computer Systems and AI Grand Challenges. The list of speakers included experts in these areas, who Raj has had an opportunity to interact with during the past 30 years.'''
