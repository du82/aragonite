["http://www.cs.cmu.edu/~cdoersch"]
title = "Carl Doersch's Homepage"
full_description = "Welcome! I am a staff research scientist at DeepMind working closely with Andrew Zisserman. I completed my PhD in the Machine Learning Department at CMU, working with Alyosha Efros and Abhinav Gupta. I graduated from CMU in 2010 with a B.S. in computer science and cognitive science, with a minor in neural computation, completing an undergraduate thesis with Tai Sing Lee. I'm interested in computer vision and all the learning problems that are associated with it. In particular, I'm interested self-supervised learning and transfer. In computer vision, the standard labels we use (e.g. bounding boxes, keypoint annotations) are not only expensive to collect, but they also tend to be a poor approximation to what we actually know about images. My work aims to learn better representations from real-world image and video structure like motion and context relationships on huge datasets, as well as synthetic data where ground truth can be obtained easily. This naturally leads to questions about how to transfer representations from self-supervised tasks to tasks of interest, as well as transferring knowledge from simulation to reality. Thanks to Google for a Fellowship supporting my PhD."
