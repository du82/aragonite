["https://www.cs.cmu.edu/news/2024/newsserow-wildlife-conservation-tool"]
title = "New CMU Tool Monitors Wildlife Conservation in Low-Resource Languages"
description = "SCS researchers worked with the World Wildlife Fund for Nature to develop a tool that monitors and identifies media articles related to environmental conservation and possible threats to at-risk animals, including rhinos like the ones shown here."
full_description = '''Activists on the frontlines of wildlife conservation routinely monitor news articles for information about infrastructure projects that could threaten at-risk animals. But that monitoring required more staff time than organizations on the ground could spare. Researchers at Carnegie Mellon University helped ease this burden by working with the World Wildlife Fund for Nature (WWF) to develop a tool that monitors and identifies media articles related to environmental conservation. Once a week, WWF India needed two full-time workers to monitor news and identify issues related to wildlife conservation, said Fei Fang, an associate professor in the Software and Societal Systems Department (S3D) at Carnegie Mellon University's School of Computer Science. CMU researchers worked with the WWF to develop media-monitoring tools that allow staff to spend less time analyzing news about infrastructure and environmental conservation and more time advocating for and protecting wildlife. The tools have been expanded to include media monitoring in low-resourced languages like Hindi and Nepali to gather news from communities where wildlife is especially at risk. "We are trying to identify the news articles relevant to environmental conservation in a timely fashion for multiple languages and especially for those low-resource languages where we don't have a lot of label data," Fang said. Fang deployed her first model, NewsPanda, in the United Kingdom, India and Nepal in 2022. On a weekly basis, the toolkit automatically detected and analyzed news and government articles written in English describing threats to conservation areas. A pretrained large language model (LLM) classified the articles as relevant to conservation and infrastructure. The NewsPanda team created their dataset with WWF Nepal and India, labeling more than 1,000 articles. Along with scraping and analyzing the articles, NewsPanda also placed them on a map and created a bot to share articles via social media. Workers at WWF who used NewsPanda asked Fang if her team could update this tool for articles written in local languages, like Hindi and Nepali. But staff at these organizations did not want to label 1,000 articles again to create the training data needed for these languages.'''
year_published = 2025
