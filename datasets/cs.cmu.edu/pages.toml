["https://cs.cmu.edu/news/2025/brain-food-selectivity"]
title = "Researchers Propose Framework To Identify Food Selectivity Origins in the Brain"
description = "CMU researchers have identified a region in the brain's visual cortex that responds to food and have developed a theoretical framework that could explain the origins of this selectivity."
full_description = '''Human evolution has revolved around food, from identifying and foraging for it to growing and preparing it. Carnegie Mellon University researchers have identified a region in the brain's visual cortex that responds to food and have developed a theoretical framework that could explain the origins of this selectivity. "It's crazy how many different aspects of life food touches and how many different factors might contribute to creating any particular category of food," said Leila Wehbe, an associate professor in the School of Computer Science's Machine Learning Department and CMU's Neuroscience Institute. "If you think about it, food is even more primal than social cognition. If you don't have food, you die. It's necessary for survival in all species. Even the ones that don't have that much social interaction need food. And so, I like to think of it as the brain has evolved to either help you find food or keep you from being food." Wehbe was part of a team that recently published a paper in Trends in Neurosciences that outlines how visual and nonvisual signals contribute to the brain's cortical responses when people were shown images of food. Team members include Michael Tarr, the Kavčić-Moura Professor of Cognitive and Brain Science in the Dietrich College of Humanities and Social Sciences Department of Psychology and the Neuroscience Institute; and Maggie Henderson, an assistant professor in the Psychology Department and the Neuroscience Institute. Tarr said there are regions of the brain that show some specialization for behaviorally critical domains, such as processing images of faces or tools. Until recently, researchers hadn't identified a similar region involved in processing images of food. Recent studies using the Natural Scenes Dataset, however, have identified a food region in the brain. The Natural Scenes Dataset is a large-scale fMRI dataset comprising scans taken of people's brains while they were looking at images of objects, such as food, in their natural context or environment — like dishes at a buffet, or a hot dog and soda at a picnic table. The dataset's growth has made research into the brain's food region possible.'''
year_published = 2025
clearnet = "https://cs.cmu.edu/news/2025/brain-food-selectivity"
