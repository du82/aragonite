["https://www.cs.cmu.edu/undergraduate-programs"]
title = "Undergraduate Programs"
full_description = "Interdisciplinary majors in computer science and the arts, and music and technology are also available. Admission to all bachelor of science programs in SCS are administered through the Carnegie Mellon Office of Undergraduate Admission. Students accepted into SCS as first-year students are undeclared until the second half of their second semester. At that time, students will select one of the five available primary SCS majors. Program objectives are available in the CMU undergraduate catalog for our majors in artificial intelligence, computational biology, computer science, human-computer interaction and robotics. SCS offers additional majors in artificial intelligence, computational biology, computer science, human-computer interaction and robotics. Students wishing to earn an additional SCS major must meet the requirements for their primary major as well as their additional major as defined by the department overseeing the additional major. Students should consult with the director or administrator of the additional major for more information on requirements and double-counting rules. The School of Computer Science offers a number of undergraduate minors for non-SCS students. Accepted and enrolled non-SCS undergraduate students interested in a minor should contact their academic advisor for more information. SCS undergraduates can pursue a concentration in a specific computing area to gain additional depth. These concentrations assume that students have taken some or all of the SCS undergraduate core courses so they're prepared for advanced study. Each concentration resides in a specific SCS department or institute. Carnegie Mellon's diverse and top-ranked departments in computing, engineering, design and arts are uniquely positioned to serve students who have interdisciplinary interests bridging technology and creative practice. The IDeATe curriculum and minors connect students and faculty from across the university through coursework and collaborative studio experiences. As an SCS student, you will have the opportunity to integrate in your degree a minor in one of nine creative industry areas: game design, animation and special effects, media design, design for learning, sonic arts, innovation and entrepreneurship, intelligent environments, physical computing, or soft technologies."
