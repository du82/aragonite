["https://cs.cmu.edu/academics/undergraduate/gen-ed-requirements"]
title = "Undergraduate General Education Requirements"
full_description = "All SCS undergraduates dive deep into their particular field of study, but they also must meet general education requirements that provide depth. These requirements give students the chance to learn more about the world from scientific and humanistic points of view — skills our students will need as they solve problems with scientists and engineers, artists, social and cognitive scientists, historians, linguists, economists and business experts. Plus, SCS students will need to communicate effectively and understand the ethical implications of their work. The general education requirements help our students gain this broad perspective so they can work well in a changing, connected world. All SCS students must complete a minimum of 63 units of humanities and arts requirements and a minimum of 36 units of science and engineering requirements. For the humanities and arts requirements, SCS students must complete: Mini courses may be allowed as a half course for some of these requirements. SCS students should consult with an advisor for details. All SCS students must also complete Core@CMU (3 units), typically during their first year, to gain exposure to the core competencies that all CMU students should demonstrate upon graduation. Review your Stellic audit for any recent changes, as it may reflect additions made after the Undergraduate Course Catalog was published."
