["http://www.cs.cmu.edu/~haiyiz"]
title = "Dr. Haiyi Zhu, Carnegie Mellon University – Dr. Haiyi Zhu, Carnegie Mellon University"
description = "Dr. Haiyi Zhu, Carnegie Mellon University"
full_description = "Home About me How to pronounce my first name: “High-ee” I am the Daniel P. Siewiorek Associate Professor of Human-Computer Interaction and the Director of HCI Undergraduate Programs at Carnegie Mellon University. I am actively mentoring students, leading collaborative projects with academic, government, and community partners, and contributing to cutting-edge research in human-computer interaction and responsible AI. I have received over 10 paper awards at venues such as CHI, CSCW, Human Factors, and CHIWORK, along with the Allen Newell Award for Research Excellence. About my research I study Human-AI Interaction, Social Computing, and Responsible AI. My research focuses on the integration of AI technologies and algorithms into various aspects of social groups, communities, and societies to improve, automate, or optimize social processes, interactions, and decision-making. I explore how we can enhance the benefits of these technologies while reducing potential harms. I have conducted several projects that focus on studying the design and use of AI in real-world high-stakes domains such as child welfare, mental health, gig work, and online content moderation. You can download my CV here and check out the class I teach: Human AI Interaction (2020-present) Selected research AI in Child Welfare and Social Services Understanding Frontline Workers’ and Unhoused Individuals’ Perspectives on AI Used in Homeless Services [ACM Link, CHI 2023 Best Paper Award 🏆] How Child Welfare Workers Reduce Racial Disparities in Algorithmic Decisions? [ACM Link, CHI 2022] Improving Human-AI Partnerships in Child Welfare: Understanding Worker Practices, Challenges, and Desires for Algorithmic Decision Support [ACM Link, CHI 2022 Best Paper Honorable Mention🏆] AI in Mental Health, Support, and Well-Being What Makes Digital Support Effective? How Therapeutic Skills Affect Clinical Well-Being [ACM Link, CSCW 2024] “If This Person is Suicidal, What Do I Do?”: Designing Computational Approaches to Help Online Volunteers Respond to Suicidality [ACM Link, CHI 2024] Join, Stay or Go? A Closer Look at Members’ Life Cycles in Online Health Communities [ACM Link, CSCW 2021 Best Paper Honorable Mention🏆] Generalizable Principles and Methods for Human-AI Interaction Factors Influencing Perceived Fairness in Algorithmic Decision-Making: Algorithm Outcomes, Development Procedures, and Individual Differences [ACM Link, CHI 2020]. Explaining Decision-Making Algorithms through UI: Strategies to Help Non-Expert Stakeholders [ACM Link, CHI 2019]. Keeping Community in the Loop: Understanding Wikipedia Stakeholder Values for Machine Learning-Based Systems [ACM Link, CHI 2020 Best Paper Honourable Mention🏆]. Value-Sensitive Algorithm Design: Method, Case Study, and Lessons [ACM Link, CSCW 2018]. Gig Workers and Gig Economy Designing Individualized Policy and Technology Interventions to Improve Gig Work Conditions [ACM Link, CHIWORK 2023 Best Paper Award 🏆] Co-Designing Alternatives for the Future of Gig Worker Well-Being: Navigating Multi-Stakeholder Incentives and Preferences [ACM Link, DIS’2023] A Little Too Personal: Effects of Standardization versus Personalization on Job Acquisition, Work Completion, and Revenue for Online Freelancers [ACM Link, CHI 2022] Public Technologies Transforming Work of the Public and the Public Sector [ACM Link, CHIWORK 2024 Best Paper Award 🏆] The Sharing Economy in Computing: A Systematic Literature Review [ACM Link, CSCW 2018] Designing platforms that allow people to share under-utilized resources and seek help from friends [ACM Link, CHI 2016 Best Paper Honorable Mention🏆] Online Communities, Content Moderation, and AI Wikibench: Community-Driven Data Curation for AI Evaluation on Wikipedia. [ACM Link, CHI 2024] Algorithmic content moderation systems on Wikipedia [ACM Link, FAccT 2022]. Understanding the effects of emotional cues (e.g., NFL game outcomes) on the contributions of Wikipedia editors. [ACM Link, CSCW’2018] Understanding how to organize individual contributors with differing goals, experience, and commitment to achieve a collective outcome [CSCW’2012a],[CSCW’2012b🏆][CHI’2013🏆]. Scientific Media Production Design Opportunities for Enhancing Collaboration in Scientific Media Production [CHI’2018] Disseminating Research News in HCI: Perceived Hazards, How-To’s, and Opportunities for Innovation [CHI’2020] Social Networking Understanding Relationship Overlapping on Social Network Sites: A Case Study of Weibo and Douban [CSCW’2018] How often people’s choices are changed by others’ recommendations [American Behavioral Scientist 2013]. News 2024.08 – I am very honored to be named to the 2024 Class of Pittsburgh’s 40 Under 40. 2024.07 – Our paper – “Public Technologies Transforming Work of the Public and the Public Sector” [link] – received best paper award at CHIWORK 2024! 2023.07 – Our paper – “Designing Individualized Policy and Technology Interventions to Improve Gig Work Conditions” [link] – received best paper award at CHIWORK 2023! 2023.04 – Our paper – “Understanding Frontline Workers’ and Unhoused Individuals’ Perspectives on AI Used in Homeless Services” [link] – received best paper award at CHI 2023! 2023.02 – Our paper -“A Validity Perspective on Evaluating the Justified Use of Data-driven Decision-making Algorithms”[link] – received best paper award at IEEE Conference on Secure and Trustworthy Machine Learning (SaTML) 2023! 2022.04 – The AP article reported our CHI paper – “How Child Welfare Workers Reduce Racial Disparities in Algorithmic Decisions” [Link]. Some new follow-up [AP 2023.01]. 2022.04 – Three papers accepted by CHI 2022. Please check out our Honorable Mention paper “Improving Human-AI Partnerships in Child Welfare: Understanding Worker Practices, Challenges, and Desires for Algorithmic Decision Support” [Link]. 2022.06 – Four papers appeared at FAccT 2022. These papers explored a wide range of topics related to fair and responsible AI, including imagining new futures beyond predictive systems in child welfare [link], designing model card authoring toolkit [link], exploring how practitioners (try to) use fairness toolkits [link], and studying algorithmic content moderation systems [link]. 2021.10 – Our paper “Join, Stay or Go? A Closer Look at Members’ Life Cycles in Online Health Communities” has been awarded an Honorable Mention at CSCW 2021 [link] 2021.3 – Check out our new CHI 2021 paper on “Soliciting Stakeholders’ Fairness Notions in Child Maltreatment Predictive Systems” [link] 2021.1 – Check out our FAccT 2021 paper on “Value Cards: An Educational Toolkit for Teaching Social Impacts of Machine Learning through Deliberation” [link]! 2020.8 – Our 2 million, 3-year NSF award on “Empowering and Enhancing Workers Through Building A Community-Centered Gig Economy” has been funded [Award Abstract]! 2020.2 – Our paper “Keeping Community in the Loop: Understanding Wikipedia Stakeholder Values for Machine Learning-Based Systems” [link] has received an Honourable Mention Award at CHI 2020. 2020.1 – Our proposal on advancing fairness in AI with human-algorithm collaborations, with Steven Wu (PI), Alex Chouldechova, and Min Kyung Lee, is awarded [Award Abstract] [Press Release]! 2019.9 – Two NSF proposals on which I am PI – CHS core and EAGER on AI and society – are awarded! [CHS Award Abstract] [EAGER Award Abstract] 2019 Summer Travels: June 23-27 HCIC; July 8-10 UC Berkeley; July 16-19 MSR Faculty Summit; Aug 2-4 CSCW Summer School; Aug 16-18 ChineseCSCW 2019.5 – My student, Hao Fei Cheng, presents our paper at CHI 2019. Check the paper [link]. 2019.4 – Our paper on “Towards Value-Sensitive Learning Analytics Design” [link] is presented at LAK 2019. 2018.12 – Our proposal, Promoting Diversity in Peer Production through Mechanism Design with PI Steven Wu to Facebook’s Mechanism Design for Social Good RFP, is selected for $50,000 in funding (top 3 in total of 58). 2018.11 – 7 papers (6 from the first round, 1 from the second round) will be presented at CSCW’2018. 2018.02 – Our paper on Design Opportunities for Enhancing Collaboration in Scientific Media Production receives CHI’2018 best paper honorable mention! 2018.01 – 3 papers accepted by CHI’2018! 2017.08 – 6 papers accepted by CSCW’ 2018 online first! 2016.08 – Receive NSF CRII CISE Research Initiation Award (expected to total $174,355) 2016.05 – CHI’2016 best paper honorable mention! Paper: A Market in Your Social Network: The Effects of Extrinsic Rewards on Friendsourcing and Relationships [download pdf] 2016.04- Allen Newell Award for Research Excellence (shared with Bob Kraut, Niki Kittur, Moira Burke, and Ching Ren)! 2014.02 – Winner of Facebook Fellowship 2014-2015! 2013.10 – Win the Human Factors Prize 2013 (a $10K prize)! The Human Factors Prize recognizes excellence in HF/E research through an annual competition in which authors are invited to submit papers on a specific topic for that year. The topic of 2013 is social media. 2013.04 – Receive best paper honorable mention award from CHI 2013. Paper title: Effects of Peer Feedback on Contribution: A Field Experiment in Wikipedia.[download pdf] 2012.02 – Receive best paper honorable mention award from CSCW 2012. Paper title: Effectiveness of Shared Leadership in Online Communities. [download pdf]"
