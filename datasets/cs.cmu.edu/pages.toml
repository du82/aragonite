title = "Directions, Maps & Parking"
full_description = "Our physical address (for GPS and sat-nav devices and online mapping programs) is: 4902 Forbes Ave., Pittsburgh, PA. You can also find directions on Google Maps. The School of Computer Science is in Pittsburgh's Oakland neighborhood and is accessible from Interstate 376 via Exit 72A (eastbound), Exit 73B (westbound) and Exit 74. Frequent bus service along the Forbes Avenue corridor is provided by Port Authority of Allegheny County to points in Downtown Pittsburgh and the city's East End. The 28X bus connects the CMU campus with Pittsburgh International Airport. » Download a map of the SCS complex and nearby parking areasMost offices and classrooms used by the School of Computer Science are located in six buildings on our Pittsburgh Campus. Limited on-street parking is available on Frew Street, Tech Street and Margaret Morrison Street, and adjacent to the campus in Schenley Park. Prices vary. Parking is controlled by electronic meters, which are vigorously enforced by the Pittsburgh Parking Authority. You will need cash or a Visa or Mastercard to use these meters, or you can pay using the Go Mobile PGH app."
