["https://cs.cmu.edu/news/2021/compbio-nih-sennet"]
title = "CMU CompBio Researchers Take Leading Roles in NIH SenNet Program"
description = "The Computational Biology Department will lend leadership, expertise and resources to an ambitious NIH program to locate and study senescent cells in the human body."
full_description = '''Carnegie Mellon University's Computational Biology Department will lend leadership, critical expertise and computational resources to an ambitious National Institutes of Health program to locate and study senescent cells in the human body. Senescent cells — cells that no longer divide and multiply — play both positive and negative roles in biological processes. They can aid in wound repair or preventing tumor growth in some cancers, but they can also contribute to cancer and age-related disorders such as osteoporosis, frailty, cardiovascular disease and dementia by producing signals that damage neighboring tissue. The NIH Common Fund today announced the establishment of the Cellular Senescent Network (SenNet) program and $125 million in funding over the next five years. SenNet is an effort to map senescent cells in the body to better understand how and why they develop and set the course for new therapies for age-related diseases. "Senescent cells have an impact on a lot of different processes in the body," said Ziv Bar-Joseph, one of the CMU researchers involved in SenNet. "The thinking is, if we can find them and characterize them, then maybe we can come up with drugs that will remove them." CMU researchers will be involved in three areas of SenNet. Bar-Joseph, the FORE Systems Professor of Computer Science with appointments in computational biology and machine learning, is one of three leaders for the Consortium Organization and Data Coordinating Center. This center will function as the hub for all 16 teams working across SenNet. Bar-Joseph is also leading the computational analysis core of the TriState SenNet Tissue Mapping Center, which will focus on mapping senescent cells in the heart and lungs. Jian Ma, the Ray and Stephanie Lane Professor of Computational Biology, is among three leaders of a Technology Development and Application Project through SenNet. The project, called Spatial Omics Technologies To Map the Senescent Cell Microenvironment, aims to develop technologies to help the entire program better identify and characterize senescent cell locations throughout the human body. SenNet will bring several million dollars in NIH research funding to CMU and connect the university to ground-breaking developments across the program.'''
year_published = 2025
clearnet = "https://cs.cmu.edu/news/2021/compbio-nih-sennet"
