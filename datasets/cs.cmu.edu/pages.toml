["https://www.cs.cmu.edu/news/scs-students-receive-apple-aiml-fellowships"]
title = "SCS Students Receive Apple AI/ML Fellowships"
description = "Graham Gobieski (top) and Xinyi Wang (bottom) have received fellowships in artificial intelligence and machine learning from Apple."
full_description = "Apple has announced that two Ph.D. students in the School of Computer Science — Graham Gobieski and Xinyi Wang — have received fellowships in artificial intelligence (AI) and machine learning (ML). They're two of a dozen students who earned fellowships through Apple Scholars, a program that supports students in computer science and engineering. The scholars were selected based on their innovative research, demonstrated thought leadership, and willingness to take risks and push the envelope in AI/ML. Gobieski, a student in the Computer Science Department, works primarily on developing software and hardware to enable machine learning and sensing applications on ultra-low-power devices. He has developed a system to deploy neural networks to resource-constrained devices and is building an energy-efficient microcontroller. Wang, a student in the Language Technologies Institute, develops methods that allow artificial neural networks to intelligently and efficiently use data for machine translation. Building on these methods, she plans to design natural language processing models that not only support major languages but also serve people who speak minority languages, or those who speak language variations such as dialects and personal language styles. Each scholar will receive support for their research and academic travel for two years, internship opportunities, and a two-year mentorship with an Apple researcher."
year_published = 2025
