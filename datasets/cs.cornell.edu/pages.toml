["https://cs.cornell.edu/information/jobpostings/facultypositionsnyctech"]
title = "Faculty Positions: New York City | Department of Computer Science"
description = "The Cornell University Department of Computer Science (CS) in the Cornell Bowers College of Computing and Information Science (Bowers CIS) has tenure-track and tenured faculty positions available at the Cornell Tech campus in New York City. Cornell CS is ranked among the top computer science departments in the country. Applications are welcome from all areas of computer"
full_description = "The Cornell University Department of Computer Science (CS) in the Cornell Bowers College of Computing and Information Science (Bowers CIS) has tenure-track and tenured faculty positions available at the Cornell Tech campus in New York City. Cornell CS is ranked among the top computer science departments in the country. Applications are welcome from all areas of computer science and related fields. We especially welcome applicants whose scholarship and service further the department's goals around diversity and inclusion. Faculty hired in these positions at Cornell Tech will be members of the Department of Computer Science, which spans the Ithaca and New York City campuses. Their teaching and research will be based in New York City. A separate application is needed to be considered for a Computer Science position at the Ithaca campus; please visit the website http://www.cs.cornell.edu/information/jobpostings or further information about the Ithaca application process. Cornell Tech is a research and graduate education campus of Cornell University located on Roosevelt Island in New York City. In addition to world-class academic research, a distinguishing characteristic of our work is that it engages deeply with external communities, organizations, and industry to address real-world problems and contexts that amplify the direct societal and commercial impact of our research. Applicants must hold the equivalent of a Ph.D. degree. Applicants must have demonstrated an ability to conduct outstanding research, and should have a strong commitment to engagement and impact outside of academia. Successful candidates are expected to pursue an active research program, to teach Masters and Ph.D.-level graduate courses, and to supervise graduate students. To ensure full consideration, applications should be received by December 1, 2024, but will be accepted until all positions are filled. Applicants should submit a curriculum vitae and statements of research and teaching interests, identify one or two top publications to which they have made significant contributions, and arrange to have at least three reference letters submitted. In accordance with Cornell Tech’s emphasis of external engagement, the candidate should address prior accomplishments and future plans related to the commercial and/or broader public engagement and societal impact dimensions of their research, within a clearly identified subsection of the Research Statement. We ask applicants for all faculty positions to share their experiences and/or approaches (past, current, or future) to fostering learning, research service, and/or outreach in a diverse community. Applicants may choose to submit a stand-alone statement or embed the information in other parts of their application materials. The application should be submitted online at: https://academicjobsonline.org/ajo/jobs/28427. Salary Range: $79,400 - $329,600 The salary range reflects an aggregate of qualifications and disciplines across Cornell University. Actual salary offers for Cornell Tech will be based on education, experience, discipline, and relevant skills. Inquiries about your application may be directed to frecruit@cs.cornell.edu. Fostering an inclusive environment is a core value of the Computer Science Department, Cornell Tech, and Cornell as a whole. In line with Cornell’s historical commitment to educating “… any person … in any study…”, we seek candidates who will create a climate that helps attract and is inclusive of all students, including students from historically underrepresented groups and students who have overcome personal challenges. Cornell is a recognized employer and educator valuing AA/EEO, Protected Veterans, and Individuals with Disabilities. We also recognize a lawful preference in employment practices for Native Americans living on or near Indian reservations. Cornell University is an innovative Ivy League university and a great place to work. Our inclusive community of scholars, students, and staff impart an uncommon sense of larger purpose, and contribute creative ideas to further the university's mission of teaching, discovery, and engagement. AboutDiversity, Equity, and InclusionValues of Inclusion 2020 Antiracism Task Force 2022 DEI Report News Research News Department Life AwardsListed by Recipient Listed by Category Oral History of Cornell CS CS 40th Anniversary Booklet ABC Book for Computer Science at Cornell by David Gries BooksBooks by Author Books Chronologically Department TimelineThe 60's The 70's The 80's The 90's The 00's The 2010's The 2020's Job PostingsFaculty Positions: Ithaca Faculty Positions: New York City Lecturer Position: Ithaca Post-doc Position: Ithaca Staff/Technical Positions Ugrad Course Staff Ithaca Info Internal info EventsCalendar Graduation Information Cornell Learning Machines Seminar Student Colloquium BOOM Spring 2025 Colloquium Conway-Walker Lecture Series Salton 2024 Lecture Series Seminars / LecturesSpring 2025 Artificial Intelligence Seminar Spring 2025 Robotics Seminar Spring 2025 Systems Research Seminar Spring 2025 Theory Seminar Big Red Hacks Cornell University / Cornell Tech - High School Programming Workshop and Contest 2025 Game Design Initiative CSMore: The Rising Sophomore Summer Program in Computer Science Explore CS Research ACSU Research Night Cornell Junior Theorists' Workshop 2024Cornell Junior Theorists' Workshop 2023 PeopleChair Faculty Researchers Staff Ph.D. Students M.Eng. Students M.S. Students Ph.D. Alumni M.S. Alumni CoursesList of Courses Enrollment Exams Course and Room Roster CS Advanced Standing Exam ResearchArchitecture Artificial Intelligence Computational Biology Database Systems Graphics Human Interaction Machine Learning Natural Language Processing Programming Languages Robotics Scientific Computing Security Software Engineering Systems and Networking Theory of Computing Vision UndergraduateAdmissions Contact UGrad OfficeContact Academic Advisor Your First CS Co