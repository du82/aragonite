["https://cs.cornell.edu/content/high-dimensional-expansion-random-geometric-graphs"]
title = "High-Dimensional Expansion in Random Geometric Graphs | Department of Computer Science"
description = "High-Dimensional Expansion in Random Geometric Graphs Abstract: High-dimensional expansion is a generalization of expansion to hypergraphs where the expansion of certain random walks are witnessed by local neighborhoods.This talk is on the topic of constructing natural probability distributions over sparse high-dimensional expanders (HDXes). On one hand,"
full_description = "SpeakerSidhanth Mohanty, UC Berkeley Thursday, May 11, 2023 - 09:15 to 10:00Gates G01Categories: Cornell Junior Theorists' Workshop 2023High-Dimensional Expansion in Random Geometric Graphs Abstract: High-dimensional expansion is a generalization of expansion to hypergraphs where the expansion of certain random walks are witnessed by local neighborhoods.This talk is on the topic of constructing natural probability distributions over sparse high-dimensional expanders (HDXes). On one hand, (standard/1-dimensional) sparse expanders are plentiful, since a constant degree random graph is an expander with high probability. On the other hand, most natural random models over hypergraphs fail to exhibit 2-dimensional expansion unless the average degree exceeds sqrt(number of vertices). However, sparse HDXes are known to exist due to algebraic and number theory based construction. We describe some progress towards constructing sparse HDXes based on random geometrics graphs on the unit sphere. Based on joint work with Siqi Liu (Berkeley), Tselil Schramm (Stanford), and Elizabeth Yang (Berkeley). Bio: Sidhanth is a PhD student at UC Berkeley advised by Prasad Raghavendra, and is broadly interested in spectral graph theory, random matrices, and their applications in theoretical computer science. AboutDiversity, Equity, and InclusionValues of Inclusion 2020 Antiracism Task Force 2022 DEI Report News Research News Department Life AwardsListed by Recipient Listed by Category Oral History of Cornell CS CS 40th Anniversary Booklet ABC Book for Computer Science at Cornell by David Gries BooksBooks by Author Books Chronologically Department TimelineThe 60's The 70's The 80's The 90's The 00's The 2010's The 2020's Job PostingsFaculty Positions: Ithaca Faculty Positions: New York City Lecturer Position: Ithaca Post-doc Position: Ithaca Staff/Technical Positions Ugrad Course Staff Ithaca Info Internal info EventsCalendarHigh-Dimensional Expansion in Random Geometric G