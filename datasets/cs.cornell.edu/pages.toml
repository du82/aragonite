description = "Query-Optimal Estimation of Unitary Channels in Diamond Distance Abstract: We will present an algorithm to learn an unknown unitary channel acting on a d-dimensional qudit to diamond-norm error ε, using O(d²/ε) applications of the unknown channel and only one qudit. This algorithm uses the optimal number of qudits and number of queries, even if one has access to the inverse or"
full_description = "SpeakerEwin Tang, University of WashingtonThursday, May 11, 2023 - 10:05 to 22:50Gates G01Categories: Cornell Junior Theorists' Workshop 2023Query-Optimal Estimation of Unitary Channels in Diamond Distance Abstract: We will present an algorithm to learn an unknown unitary channel acting on a d-dimensional qudit to diamond-norm error ε, using O(d²/ε) applications of the unknown channel and only one qudit. This algorithm uses the optimal number of qudits and number of queries, even if one has access to the inverse or controlled versions of the unknown unitary. This improves over prior work, which achieves entanglement infidelity δ using O(d²/√δ) applications in parallel, thereby requiring Ω(d²) qudits. Based on joint work with Jeongwan Haah, Robin Kothari, and Ryan O'Donnell. Bio: Ewin Tang is a fifth-year graduate student in computer science at the University of Washington, advised by James Lee. Her interests are broadly in randomized and quantum algorithms. Specifically, her work focuses on quantum linear algebra and learning of quantum systems. In one line of work, using techniques from sketching and sampling algorithms, she showed major barriers to practical speedups for several significant quantum machine learning algorithms. AboutDiversity, Equity, and InclusionValues of Inclusion 2020 Antiracism Task Force 2022 DEI Report News Research News Department Life AwardsListed by Recipient Listed by Category Oral History of Cornell CS CS 40th Anniversary Booklet ABC Book for Computer Science at Cornell by David Gries BooksBooks by Author Books Chronologically Department TimelineThe 60's The 70's The 80's The 90's The 00's The 2010's The 2020's Job PostingsFaculty Positions: Ithaca Faculty Positions: New York City Lecturer Position: Ithaca Post-doc Position: Ithaca Staff/Technical Positions Ugrad Course Staff Ithaca Info Internal info EventsCalendarQuery-Optimal Estimation of Unitary Channels in Diamond Distance Graduation Information Cornell Learnin