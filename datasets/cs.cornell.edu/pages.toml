title = "ACSU Research Night Spring, 2025! | Department of Computer Science"
description = "ACSU Research Night is an event held every semester that introduces undergraduates to research opportunities in the Cornell Ann S. Bowers College of Computing and Information Science (Cornell Bowers CIS). Hosted by the Association of Computer Science Undergraduates (ACSU), the event has two parts: a panel discussion about how and why to do computer science research, and a"
full_description = "ACSU Research Night is an event held every semester that introduces undergraduates to research opportunities in the Cornell Ann S. Bowers College of Computing and Information Science (Cornell Bowers CIS). Hosted by the Association of Computer Science Undergraduates (ACSU), the event has two parts: a panel discussion about how and why to do computer science research, and a poster session where prospective undergraduate researchers can meet doctoral students and forge potential collaborations. Research Night Spring, 2025 will be convened in person on Monday, February 24th with the following schedule: Panel Discussion, 5-6 p.m. in Gates G01 Introductions by Thorsten Joachims, Interim Dean of Cornell Bowers CIS and Lorenzo Alvisi, Chair of Computer Science Department. Discussion among panelists (with a Q&A portion) Poster Session, 6-7 p.m. outside of Gates G01 and the first floor atrium Poster session with Cornell Bowers CIS undergraduate and PhD students presenting their research Refreshments will be served. AboutDiversity, Equity, and InclusionValues of Inclusion 2020 Antiracism Task Force 2022 DEI Report News Research News Department Life AwardsListed by Recipient Listed by Category Oral History of Cornell CS CS 40th Anniversary Booklet ABC Book for Computer Science at Cornell by David Gries BooksBooks by Author Books Chronologically Department TimelineThe 60's The 70's The 80's The 90's The 00's The 2010's The 2020's Job PostingsFaculty Positions: Ithaca Faculty Positions: New York City Lecturer Position: Ithaca Post-doc Position: Ithaca Staff/Technical Positions Ugrad Course Staff Ithaca Info Internal info EventsCalendar Graduation Information Cornell Learning Machines Seminar Student Colloquium BOOM Spring 2025 Colloquium Conway-Walker Lecture Series Salton 2024 Lecture Series Seminars / LecturesSpring 2025 Artificial Intelligence Seminar Spring 2025 Robotics Seminar Spring 2025 Systems Research Seminar Spring 2025 Theory Seminar Big Red Hacks 