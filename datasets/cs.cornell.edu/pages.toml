title = "Faculty Positions: New York City | Department of Computer Science"
description = "The Cornell University Department of Computer Science (CS) in the Cornell Bowers College of Computing and Information Science (Bowers CIS) has tenure-track and tenured faculty positions available at the Cornell Tech campus in New York City. Cornell CS is ranked among the top computer science departments in the country. Applications are welcome from all areas of computer"
full_description = "The Cornell University Department of Computer Science (CS) in the Cornell Bowers College of Computing and Information Science (Bowers CIS) has tenure-track and tenured faculty positions available at the Cornell Tech campus in New York City. Cornell CS is ranked among the top computer science departments in the country. Applications are welcome from all areas of computer science and related fields. We especially welcome applicants whose scholarship and service further the department's goals around diversity and inclusion. Faculty hired in these positions at Cornell Tech will be members of the Department of Computer Science, which spans the Ithaca and New York City campuses. Their teaching and research will be based in New York City. A separate application is needed to be considered for a Computer Science position at the Ithaca campus; please visit the website http://www.cs.cornell.edu/information/jobpostings or further information about the Ithaca application process. Cornell Tech is a research and graduate education campus of Cornell University located on Roosevelt Island in New York City. In addition to world-class academic research, a distinguishing characteristic of our work is that it engages deeply with external communities, organizations, and industry to address real-world problems and contexts that amplify the direct societal and commercial impact of our research. Applicants must hold the equivalent of a Ph.D. degree. Applicants must have demonstrated an ability to conduct outstanding research, and should have a strong commitment to engagement and impact outside of academia. Successful candidates are expected to pursue an active research program, to teach Masters and Ph.D.-level graduate courses, and to supervise graduate students. To ensure full consideration, applications should be received by December 1, 2024, but will be accepted until all positions are filled. Applicants should submit a curriculum vitae and statements of research and teaching interests, identify one or two top publications to which they have made significant contributions, and arrange to have at least three reference letters submitted. In accordance with Cornell Tech’s emphasis of external engagement, the candidate should address prior accomplishments and future plans related to the commercial and/or broader public engagement and societal impact dimensions of their research, within a clearly identified subsection of the Research Statement. We ask applicants for all faculty positions to share their experiences and/or approaches (past, current, or future) to fostering learning, research service, and/or outreach in a diverse community. Applicants may choose to submit a stand-alone statement or embed the information in other parts of their application materials. The application should be submitted online at: https://academicjobsonline.org/ajo/jobs/28427. Salary Range: $79,400 - $329,600 The salary range reflects an aggregate of qualifications and disciplines across Cornell University. Actual salary offers for Cornell Tech will be based on education, experience, discipline, and relevant skills. Inquiries about your application may be directed to frecruit@cs.cornell.edu. Fostering an inclusive environment is a core value of the Computer Science Department, Cornell Tech, and Cornell as a whole. In line with Cornell’s historical commitment to educating “… any person … in any study…”, we seek candidates who will create a climate that helps attract and is inclusive of all students, including students from historically underrepresented groups and students who have overcome personal challenges. Cornell is a recognized employer and educator valuing AA/EEO, Protected Veterans, and Individuals with Disabilities. We also recognize a lawful preference in employment practices for Native Americans living on or near Indian reservations. Cornell University is an innovative Ivy League university and a great place to work. Our inclusive community of s