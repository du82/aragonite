). Where is Cornell Bowers CIS? Cornell Bowers CIS operates out of several buildings on Cornell's Ithaca campus: it is centered in Bill and Melinda Gates Hall, but also found in Comstock, Rhodes, Upson, and other buildings. A new four-story, 135,000 square-foot building will open in spring 2025. What is Cornell Tech and Where is it? Cornell Tech is a graduate school conceived and implemented expressly to integrate the study of technology with business, law, and design. There are now over a half-dozen masters programs on offer as well as doctoral studies. Cornell University began creating a new and prominent campus in New York City, with its first, newly constructed buildings opening in September 2017. Located on Roosevelt Island (between the east side of Manhattan and Long Island City, Queens; under the Queensboro/Ed Koch Bridge), the new campus is called Cornell Tech. How are Ithaca CS and CS at Cornell Tech related? Computer Science is one department operating on two campuses. Each CS faculty member is based either in Ithaca or in New York City. Likewise, a prospective graduate student will typically work in the location of his or her principal advisor. Currently we have 49 faculty in residence at the Ithaca campus while 13 sit at the Cornell Tech campus. Who are the Leaders? Despite having two campuses, the CS faculty in Ithaca and in New York City report to the same Chair, Lorenzo Alvisi, who resides in Ithaca. Meanwhile, Cornell Bowers CIS and Cornell Tech each have their own Deans: The Interim Dean of Cornell Bowers CIS, in Ithaca, is Thorsten Joachims, the Jacob Gould Schurman Professor of Computer Science and Information Science. Joachims was named interim dean January 2025 when Kavita Bala, professor of computer science and inaugural dean of the college, was named Cornell's 17th provost. CS Professor Greg Morrisett is the Jack and Rilla Neafsey Dean and Vice Provost of Cornell Tech in New York City. He was appointed in Fall 2019, having served immediately p