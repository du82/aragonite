ald Bold'), local('Oswald-Bold'), url(http://www.cs.cornell.edu/50years/timeline/assets/styles/bH7276GfdCjMjApa_dkG6VtXRa8TVwTICgirnJhmVJw.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2212, U+2215, U+E0FF, U+EFFD, U+F000; } .timelineMainWrapper { width: 100%; margin: 0px; padding-top: 150px; position: relative; } .INTROimage { background-image: url(http://www.cs.cornell.edu/50years/timeline/assets/images/bkgnd.jpg); background-repeat: no-repeat; background-attachment: fixed; background-size: cover; background-position: left top; } .BCSimage { background-image: url(http://www.cs.cornell.edu/50years/timeline/assets/images/bcs.jpg); background-repeat: no-repeat; background-attachment: fixed; background-size: cover; background-position: left top; } .the60simage { background-image: url(http://www.cs.cornell.edu/50years/timeline/assets/images/05.jpg); background-repeat: no-repeat; background-attachment: fixed; background-size: cover; background-position: left top; } .the70simage { background-image: url(http://www.cs.cornell.edu/50years/timeline/assets/images/01.jpg); background-repeat: no-repeat; background-attachment: fixed; background-size: cover; background-position: left top; } .the80simage { background-image: url(http://www.cs.cornell.edu/50years/timeline/assets/images/02.jpg); background-repeat: no-repeat; background-attachment: fixed; background-size: cover; background-position: left top; } .the90simage { background-image: url(http://www.cs.cornell.edu/50years/timeline/assets/images/03.jpg); background-repeat: no-repeat; background-attachment: fixed; background-size: cover; background-position: left top; } .y2ksimage { background-image: url(http://www.cs.cornell.edu/50years/timeline/assets/images/04.jpg); background-repeat: no-repeat; background-attachment: fixed; background-size: cover; background-position: left top; } .the2010simage { background-image: url(http://www.cs.cornell.edu/50years/timeline/assets/images/06.jpg); background-repeat: no-repeat; background-attachment: fixed; background-size: cover; background-position: left top; } .the2020simage { background-image: url(http://www.cs.cornell.edu/50years/timeline/assets/images/06.jpg); background-repeat: no-repeat; background-attachment: fixed; background-size: cover; background-position: left top; } .hdwrapper { width: 500px; padding-top: 15px; padding-right: 15px; padding-bottom: 15px; padding-left: 15px; background-color: #FDFDFD; margin-top: 30px; font-family: Oswald; font-weight: 300; display: block; margin-bottom: 0px; opacity: .8; -moz-opacity: .8; } .tintro { padding-left: 15px; padding-top: 25px; padding-right: 15px; padding-bottom: 25px; background-color: #FFFFFF; font-family: Oswald; font-weight: 300; font-size: 18px; line-height: 32px; text-align: left; color: #707070; } .hdwrapper h2 { font-weight: 300; font-size: 32px; color: #006fc6; line-height: 38px; width: auto; } .hdwrapper h3 { font-weight: 300; font-size: 24px; color: #006fc6; line-height: 28px; } .tbodycopy { padding-top: 15px; padding-right: 15px; padding-left: 15px; padding-bottom: 35px; background-color: #FFFFFF; font-family: Oswald; font-weight: 300; font-size: 16px; line-height: 19px; text-align: left; color: #707070; } .tbodycopy h4 { color: #006fc6; font-size: 22px; line-height: 24px; border-bottom: 1px solid #D7D7D7; margin-top: 10px; font-weight: 300; padding-bottom: 2px; margin-bottom: 3px; } .tbodycopy p{ margin-bottom: 10px; margin-left: 15px; } Cornell Department of Computer Science 50 Years of Innovation Since 1965, our department has been an academic leader in the study and science of computing. Cornell has made groundbreaking achievements in distributed computing systems, information retrieval, computational theory, trustworthy computing, artificial intelligence, social networking, and computer graphics. What will we be doing over the next five decades, or even the next five months? To find out, visit our website at www.cs.cornell.edu Before Computer Science Dick Conway and Bill Maxwell of Operations Research and Industrial Engineering develop CORC on the Burroughs B-220 and Control Data 1604 to provide a simpler language for teaching than Fortran or Algol. CORC can be described on a single page. CORC is taught beginning in Fall 1962. In 1963, Cornell forms a committee of three (Anil Nerode, Mathematics, and also Acting Director of the Field of Applied Mathematics, as Chair; Dick Conway, ORIE; and Bob Walker, Mathematics) to develop plans for a Computer Science Department. A $1 million grant from the Sloan Foundation would be used to start and maintain the Department. As a first step, the committee creates a Graduate Field of Computer Science, which can grant Masters and PhD degrees. Cornell's graduate field system made this possible. The Field was in place before the Department was formed. Based on the committee's recommendations, the CS Department is set up to report to both the College of Engineering and the College of Arts & Sciences and the CS faculty members are given appointments in both colleges. This visionary step serves CS well, allowing it to develop both scientific and engineering aspects of the field without friction and competition from others. The 60's 1965-66 The Department of Computer Science (CS) is formed, with Juris Hartmanis (emeritus since 2002), as Chair. Also joining are Dick Conway (joint with ORIE, emeritus since 2002, Johnson Grad School of Management), Pat Fischer (1965-68), Chris Pottle (joint with EE, 1965-74), Gerard Salton (deceased 1995, click here for a memorial statement), Sid Saltzman (joint with ORIE, 1965-66), and Bob Walker (joint with Math, 1965-74). Gerard Salton, “the father of Information Retrieval”, brings his SMART system to Cornell from Harvard. His work with SMART (System for the Mechanical Analysis and Retrieval of Text) forms the basis for 35 years of research in IR and lays the conceptual foundation for Google and other modern search engines. Juris Hartmanis publishes the paper that starts the field of computational complexity, with Dick Stearns: On the computational complexity of algorithms, Trans. Amer. Math. Soc. 117 (1965), 285-306. Later, they receive the ACM Turing Award for this work. CS produces its first PhD, Joel Sturman, a transfer from Electrical Engineering. 1966-67 Ken Brown (1966-71) and Peter Wegner (1966-69) join the faculty. Juris Hartmanis and colleague Dick Stearns publish the first of many influential texts by CS: Algebraic Structure: Theory of Sequential Machines (Prentice Hall). 1967-68 John Hopcroft, Roland Sweet (1967-70), and Bill Worley (1967-69) join the faculty. Dick Conway, Bill Maxwell, and Louis Miller publish the classic text Theory of Scheduling (Addison-Wesley). 1968-69 Bob Constable, Bill Maxwell (joint with ORIE, 1968-74), Howard L. Morgan (1968-73), Alan Shaw (1968-71), and Robert Wagner (1968-71) join the faculty. Gerry Salton publishes the classic IR text Automatic Information Organization and Retrieval (McGraw-Hill). 1969-70 John Dennis (1969-79) and David Gries (emeritus since 2011) join the faculty. Gerry Salton becomes Editor-in-Chief of the Journal of the ACM —the first of many influential editorial positions held by members of CS. John Hopcroft and and colleague Jeff Ullman publish their classic text Formal Languages and Their Relation to Automata (Addison-Wesley). The 70's 1970-71 Ellis Horowitz (1970-73), Jorge More (1970-75), and John Williams (1970-78) join the faculty. Dick Conway's group develops PL/C, a subset of PL/1, designed for instructional purposes. The PL/C compiler is distributed to 100 institutions and instantly becomes the standard instructional PL/1 compiler. 1971-72 Gerry Salton becomes Department Chair. Jim Bunch (1971-74) joins the faculty Faculty members Jim Bunch and Jorge More win Householder Prizes for their PhD theses in numerical analysis. David Gries publishes the first text on compiler construction: Compiler Construction for Digital Computers (John Wiley & Sons). Gerry Salton publishes The SMART Retrieval System Experiments in Automatic Document Processing (Prentice Hall). 1972-73 Alan Demers (now Principal Research Scientist), Charles Moore (1972-75), and Bob Tarjan (1972-73) join the faculty. 1973-74 CS grows to 15 faculty members, with Larry Kou (1973-75) and Ray Teitelbaum (now emeritus) joining. Juris Hartmanis becomes the founding editor of Springer-Verlag's LNCS series (Lecture Notes in Computer Science) and continues as editor for 30+ years. LNCS now publishes 600+ volumes annually. David Gries becomes the founding Editor of Springer-Verlag's Text and Monograph Series (TMCS). He still edits the series, along with Fred Schneider. John Hopcroft becomes Managing Editor of the SIAM Journal on Scientific Computing. Dick Conway and David Gries publish the first programming text to deal with issues of correctness, like loop invariants: An Introduction to Programming, a Structured Approach Using PL/1 and PL/C (Winthrop). 1974-75 Greg Andrews (1974-79), S.P. Han (1974-78), and David Kirkpatrick (1974-75) join the faculty. The Program of Computer Graphics is started under the leadership of Don Greenberg --the first major computer graphics facility supported by the NSF. John Hopcroft and colleagues Al Aho and Jeff Ullman publish their classic text The Design and Analysis of Computer Algorithms (Addison-Wesley). John Dennis and Jorge More publish their landmark paper Quasi-Newton Methods, Motivation and Theory, which changes the game of non-linear equation-solving through the use of approximate Jacobian matrices. 1975-76 Jim Donahue (1975-81), Charlie Van Loan, Susan Owicki (1975-76), and Allan Borodin (1975-76) join the faculty. Gerry Salton's new book, Dynamic Information Library Processing (Prentice Hall), receives the Best Information Science Book of 1975 from the American Society for Information Science (ASIS). Bob Constable starts the development of PL/CV. Developed over nine years, PL/CV eventually results in Nuprl, a system for mathematical reasoning which is still widely used today. Thirty PhD students learned how to do research using PL/CV and Nuprl. 1976-77 Corky Cartwright (1976-80) joins the faculty. Dick Conway becomes series editor for Winthrop Publishers. John Dennis and Charlie Van Loan procure HP-67 programmable calculators which make it possible to execute a stored program—a departmental first. 1977-78 Juris Hartmanis becomes Department Chair for the second time. CS acquires its first computer, a PDP 11/60. David Gries and Susan Owicki (PhD '75) receive the ACM Programming Languages and Systems Award for An axiomatic proof technique for parallel programs. Based on Susan's PhD thesis, this paper introduces interference freedom as the basis for proving parallel programs correct. 1978-79 Dick Conway is Acting Department Chair while Hartmanis is on sabbatic. Frank Luk (1978-84) and Fred Schneider join the faculty. CS introduces two undergrad degrees: BA in Arts & Sciences and BS in Engineering. Bob Constable and student Mike O'Donnell publish A Programming Logic (Winthrop). 1979-80 Daniel Leivant (1979-81) joins the faculty. Cornell adopts the Cornell Program Synthesizer for instruction in programming. Tim Teitelbaum and student Tom Reps develop this precursor to today's integrated development environments (IDEs) for teaching a subset of PL/1 on Terak microcomputers. In 1980-1981, the Cornell Program Synthesizer is distributed to 80 institutions. Gerry Salton becomes Chair of ACM SIGIR (Special Interest Group on Information Retrieval). David Gries is editor of the book Programming Methodology, a collection of articles by members of IFIP Working Group 2.3 (Springer Verlag). The 80's 1980-81 Bengt Aspvall (1980-83), John Gilbert (1980-88), and Sam Toueg (1980-2001) join the faculty. CS obtains a $2.6 million, 5-year CER (Coordinated Experimental Research) grant from the National Science Foundation (NSF), a major step in increasing its presence in experimental computing. Cornell Engineering pioneers the use of advanced computer graphics in undergraduate education with the establishment of CADIF: the Computer Aided Design Instructional Facility. Don Greenberg is its first Director, and David Gries is head of the oversight committee. 1981-82 Ozalp Babaoglu (1981-88), Tom Coleman (1981-2005), Dale Skeen (1981-85), and Paul Pritchard (1981-84) join the faculty. David Gries publishes The Science of Programming (Springer-Verlag), bringing ideas on the formal development of programs to the undergrad level. New Professional Society Fellows. AAAS: Juris Hartmanis. 1982-83 David Gries becomes Department Chair. Ken Birman and Kevin Karplus (joint with EE, 1982-86) join the faculty. CS grows to 20 faculty. The 1982 National Research Council (NRC) Assessment of Research Doctorate CS programs places Cornell fifth out of 58 departments. Gerry Salton receives the first ACM SIGIR Award for outstanding contributions to information "
