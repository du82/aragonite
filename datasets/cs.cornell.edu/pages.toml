title = "CRA recognizes 19 outstanding undergrad researchers from Cornell Bowers CIS | Department of Computer Science"
full_description = "Date Posted: 1/29/2025The Computing Research Association (CRA) recognized 19 undergraduates from the Cornell Ann S. Bowers College of Computing and Information Science as part of the organization’s 2024-2025 Outstanding Undergraduate Researcher Award. Cornell Bowers CIS students received either runner-up, finalist, or honorable mention honors for the CRA award, which recognizes undergraduate students at North American colleges and universities who demonstrate exceptional potential in computing research. Runner-up Juntao Ren ’24, computer science and mathematics major Finalist Jiayue (Gaveal) Fan ’25, information science and sociology Honorable Mention Computer Science Reevu Adakroy, ‘25 Daniel Cao, ‘25 Josh De Leeuw, ‘25 Adam Jovine, ‘25 James Kim ‘25 Jason Klein ‘26 Kian Mahmoodi, ‘26 Luis Hernandez Rocha, ‘26 Benny Rubin ‘24 Deniz Boloni-Turgut ‘26 Information Science Amber Arquilevich, ‘25 Muhammad Jee ‘25 Maaya Kanvar ‘25 Luis Miguel Sy Malenab ‘25 Manru (Mary) Zhang ‘24 Statistics and Data Science Jaclyn Liquori, ’24 (biometry and statistics) Anisha Tehim ’26 (biometry and statistics) The selection of these budding researchers from Cornell Bowers highlights the college's dedication to providing opportunities for hands-on experiences and underlines the impact of programs like the Bowers Undergraduate Research Experience, or BURE, which gives undergraduates a taste of research life. Of the above recognized students, the four computer science majors who received honorable mentions – Kim, Klein, Rubin, and Boloni-Turgut – previously participated in BURE, which began in 2023. The 10-week summer program pairs each participating undergraduate with one of nearly 40 faculty mentors and their doctoral students to tackle a specific research project. Among other recent honors by BURE participants: Andrew Kang ‘27 – a computer science and mathematics major – presented virtually at the Institute of Electrical and Electronics Engineers (IEEE) International Conference on Big Data in December. A paper from Joyce Yang ‘27 – a computer science major – was accepted at the Human Robot Interaction conference, to be held March 4-6. Nam Anh Dang ‘27, an information science major, and Peter He ‘27, an electrical and computer engineering major, both had papers accepted at the Association for Computing Machinery (ACM) CHI conference on Human Factors in Computing Systems, to be held April 26-May 1.​ By Louis DiPietro, a writer for the Cornell Ann S. Bowers College of Computing and Information Science. AboutDiversity, Equity, and InclusionValues of Inclusion 2020 Antiracism Task Force 2022 DEI Report NewsCRA recognizes 19 outstanding undergrad researchers from Cornell Bowers CIS Research News Department Life AwardsListed by Recipient Listed by Category Oral History of Cornell CS CS 40th Anniversary Booklet ABC Book for Computer Science at Cornell by David Gries BooksBooks by Author Books Chronologically Department TimelineThe 60's The 70's The 80's The 90's The 00's The 2010's The 2020's Job PostingsFaculty Positions: Ithaca Faculty Positions: New York City Lecturer Position: Ithaca Post-doc Position: Ithaca Staff/Technical Positions Ugrad Course Staff Ithaca Info Internal info EventsCalendar Graduation Information Cornell Learning Machines Seminar Student Colloquium BOOM Spring 2025 Colloquium Conway-Walker Lecture Series Salton 2024 Lecture Series Seminars / LecturesSpring 2025 Artificial Intelligence Seminar Spring 2025 Robotics Seminar Spring 2025 Systems Research Seminar Spring 2025 Theory Seminar Big Red Hacks Cornell University / Cornell Tech - High School Programming Workshop and Contest 2025 Game Design Initiative CSMore: The Rising Sophomore Summer Program in Computer Science Explore CS Research ACSU Research Night Cornell Junior Theorists' Workshop 2024Cornell Junior Theorists' Workshop 2023 PeopleChair Faculty Researchers Staff Ph.D. Students M.Eng. Students M.S. Students Ph.D. Alumni M.S. Alumni CoursesList of Courses