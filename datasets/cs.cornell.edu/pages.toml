["http://www.cs.cornell.edu/information/diversity-inclusion/2020-antiracism-task-force"]
title = "2020 Antiracism Task Force Report | Department of Computer Science"
description = "Report of the 2020 Computer Science Task Force on Fighting Racism and Fostering Inclusion of Black Community Members National events during the summer of 2020, and the June Town Hall for faculty, staff, and PhD students held during that time, highlighted the importance of strengthening our policies and practices to actively fight racism and strategically foster the inclusion"
full_description = "Report of the 2020 Computer Science Task Force on Fighting Racism and Fostering Inclusion of Black Community Members National events during the summer of 2020, and the June Town Hall for faculty, staff, and PhD students held during that time, highlighted the importance of strengthening our policies and practices to actively fight racism and strategically foster the inclusion of Black community members. In response to input from the community, the Department of Computer Science established a Task Force for achieving these goals. The Task Force members are Becky Stewart, Bobby Kleinberg (DGS), David Bindel, Eva Tardos (Task Force Chair), Hakim Weatherspoon, Haym Hirsh (DMeng), Kavita Bala until August 15th (department Chair), Tammy Gardner, Wil Thomason (CSGO, added July 28). In this report we summarize the Computer Science Department’s efforts (ongoing, newly started, and recommended by the Task Force) to help achieve an inclusive environment for our Black community members. Summary of Recommendations The Computer Science department needs to take explicit and constructive actions to improve the inclusion of Black community members from the staff, all levels of students, as well as the faculty. This report is organized by general recommendations that apply to the whole community, and offers more detailed recommendations for each subgroup. We recommend that the CS department agree on a Statement of Values of Inclusion, and offer mechanisms to help the department leadership become aware if these values are not fully lived by. We recommend that CIS start an Office of Diversity and Inclusion that can develop, innovate, and facilitate programs to improve the help inclusivity of our programs and our in the community. We recommend that many programs aimed at improving diversity and inclusion should be made available to staff, students, and faculty to help educate the community on issues of racial injustice. We recommend that the CS department focus on hiring a set of Black and other underrepresented minority faculty, as well as women. We recommend that the CS department enhance and add to programs such as the (1) CSMore program and the (2) University’s Prefreshman Summer Program (PSP), and (3) work on creating new programs that help level the playing field for undergraduates from underrepresented or disadvantaged backgrounds, as well as support the (4) undergraduate group URMC, which can serve as a complementary resource for the community. We recommend that the department continue to work on building and supporting a strong community of the underrepresented students. For the graduate programs we recommend that the CS department continue to work on recruiting a set of strong, diverse PhD students, and ensuring that all groups of students feel welcomed and included, and can expect to have support on the way to a successful academic career at Cornell and beyond. We recommend enhancing the Student Mentor Programs to help ensure this goal. We recommend the CS department’s diversity and inclusion committee to conduct an annual review, during which time an analysis of data on current programming can be assessed and changes or additional programming to the departmental and unit-level administrations can be recommended. General Recommendations Statement of Values. The CS department is in the process of developing and agreeing on a Computer Science Community Statement of Values of Inclusion; a draft of the document was put in circulation during Fall 2020 graduate student orientations. Bias reporting. We recommend that the CS department Chair work with the Cornell Office of Institutional Equity and Title IX to ensure that all cases of alleged bias can be safely and confidentially reported and are thereafter effectively responded to by Cornell. CIS Office of Diversity and Inclusion. We recommend the establishment of a CIS Office of Diversity and Inclusion to work together with the Diversity Programs in Engineering to help oversee and run programs including those suggested in this report. As a first step, last year CIS introduced the position Associate Dean of Diversity and Inclusion. This position is now held by Professor Hakim Weatherspoon in an interim capacity. Reading Group. We recommend that the CS department undertake activities that educate members of the community about the ways computing professionals are implicated in perpetuating and amplifying social inequities and injustices, and that furthermore provide a window onto issues of racial injustice more generally. The CS department will run a “race and technology” reading group activity in Fall 2020 for faculty, staff, and graduate students focused on engaging the CS community on issues of racial injustice and the intersection of race and technology. Upon the conclusion of this first installment of the reading group, the CS department should consider whether some version of the activity can or should be repeated in future years, likely with evolving content and varied texts in response to areas of concern. Bystander Training. We all bear responsibility for ensuring that the CS department is a place where every individual—regardless of personal identity characteristics—is treated with dignity and respect. Such a responsibility extends not only to times when we are the victims of behavior that violates protocols in the Statement of Values but also when we witness it occurring to and among others. To this end, we recommend that the CS department offer a Bystander Intervention Training Program to develop a culture in which all members of the community feel well-equipped to take personal responsibility for individual and group behavior and intervene when witnessing such behavior in others. The CS department is currently interacting with members of Cornell’s Human Resources diversity and inclusion team on offering, in Fall 2020, a version of their new bystander intervention training seminar. Computer Science Staff Currently there are training opportunities for staff and faculty in subjects pertinent to the development of historical awareness of racism and ways to combat it through the CULearn system. Most if not all of the staff have participated in a number of offerings including these most recent additions: HR 3046: Urban Policing: What’s underlying the tension between Black communities and the police department? HR 3044: Why Are People Protesting? HR 3046: Allyship: How Can I Support My Black Colleagues Right Now? HR 202: Maintaining a Harassment Free Workplace (Mandatory for staff, faculty, and PhD students). Additionally, in September 2020, a required course for Cornell staff with training on equity and cultural competency will be available. The course entitled, “Advancing Diversity, Equity, and Inclusion at Cornell,” will consist of six modules, each with a required online component and voluntary community chats to deepen engagement with the material. The first module is now available through CULearn as of mid-September. Subsequent modules will be released monthly, and all required components must be completed by every staff member by September 2021. CIS offered the community, including staff, the opportunity to access the book How to Be an Anti-racist by Ibram X. Kendi during the summer of 2020. CIS staff have also engaged in college-wide activities (including webinars) lead by University leaders, such as Mary Opperman, in an effort to broaden their knowledge of diversity and inclusion issues.. We recommend that CS staff be offered a version of the bias training originally developed for undergraduate TAs, and also afforded continued opportunities to engage in discussion on current events both within Cornell and on the national level. We will continue to build the CS staff repository of opportunities on the confluence site with an eye toward deepening and strengthening our culture at the individual and group levels. Computer Science Faculty Over the last several years, the CS department paid attention to the goal of improving the diversity of the faculty through the hiring process, yet we still have a long way to go to achieve representation of faculty from diverse backgrounds. No doubt, we will need to continue to work on improving the diversity of the faculty. To this end, we strongly recommend that the CS Department continues to pay close attention to expanding the diversity of faculty candidates that are invited to interview, subsequently receive offers, as well as accept offers at Cornell. The department is already working with a number of peer institutions (through the FLIP alliance) to try to prepare a cohort of faculty candidates from underrepresented groups, and we hope, by these means, to be able attract some of these diverse students as prospective faculty. Hiring faculty, of course, first involves simply getting candidates to apply, then having them interview, making them offers, and negotiating to acceptance, and we recommend the CS Department put into place record-keeping mechanisms to see at what phases we lose candidates from underrepresented groups, and to monitor whether proposed actions have in fact improved retention of these sought-after candidates through the different stages of hiring. We are continually asking: what can we do, first, to attract diverse talent? And then, how can we succeed in having such talent join the ranks of the faculty—feeling welcomed and supported in the transitional stages from new hire to permanent member? In recent months, the CS faculty have participated in a number of training sessions conducted during faculty meetings to improve faculty understanding of these issues. Presentations included: Sara Hernandez, Associate Dean for Inclusion and Student Engagement at the Graduate School, who offered training on implicit bias and microaggressions. There was a faculty meeting devoted to understanding Title IX rules. Faculty took turns in helping run the undergraduate TA training—a session that included a component on understanding and combating implicit bias. All faculty took the mandatory HR training “Maintaining a Harassment Free Workplace.” The CS department is committed to expanding the range of faculty representation at each year’s ACM Richard Tapia conference. We recommend that the CS department continue the policies and training described above, and also continue to bring innovative new learning opportunities to the department, including the bystander training mentioned above and other programs that improve the quality of the academic and work environment. We also recommend that the faculty should practice all of the Practical Steps for Supporting Social Justice & Addressing Inequities recommended by the graduate school. Undergraduate program In this section we summarize some initiatives that have been planned, proposed, or executed to help URM Computer Science undergraduate students. To support students as they become interested in joining the CS major, and throughout their career in the department, we have (or plan to instantiate) a number of programs that support our efforts to increase diversity, equity, and inclusivity. For instance: Last summer we started the CSMore program, a program for rising sophomores from underrepresented or disadvantaged backgrounds who are interested in becoming computer science majors. Through the close analysis of data, we have seen clear evidence that the Sophomore year of the Computer Science curriculum is crucial, filled as it is with a number of challenging classes. These classes inadvertently often become gatekeepers to joining the major. To directly address this unfortunate outcome, the CSMore program was created to help level the playing field and aid the formation of a social and academic network among underrepresented students who meet in the summer cohort. When the students begin Sophomore year—after participating in CSMore—they not only have an expanded repertoire of CS skills to help them succeed in these difficult classes, but also a group of friends, many from similar backgrounds, whom they can draw on for peer support. In future years, we plan to hire previous CSMore graduates as TAs in the CSMore program, expand CSMore to include a module on software engineering tools, and we suggest giving the CSMore graduates enrollment priority in the relevant CS courses during their sophomore year—as if they were already part of the major—to help them take the relevant CS courses in a timely manner and with a vote of confidence from the department. Starting next year we hope to help reserve spots in Cornell’s Prefreshman Summer Program (PSP) for a few additional students interested in computer science both in the Engineering college (COE) as well as the College of Arts and Sciences (CAS). A number of the PSP students take the introduction to computing course (CS 1110) during their prefreshman summer. The CS department intends to hire a special TA assigned to the PSP students who take the course in the summer, thereby lending even more informed support to the students as they navigate new terrain socially and intellectually. We recommend that the department expand the offering of Academic Excellence Workshops. At the moment such workshops are only associated with the Freshman courses, so we would like to see such workshops (for one credit) also associated with the sophomore courses, or possibly, ideally,associated with all required CS courses. The CS department and CIS continue to support URMC. The CS department and CIS fund a large cohort of students attending the ACM Richard Tapia conference each year. Require each TA in any computer science course to attend a TA training that was designed by the CS department. The training includes discussion of implicit bias in addition to topics like office hours, grading practices, helping students in distress, as well as setting boundaries. We are increasingly aware of the role that computing plays in perpetuating and amplifying societal inequity. We recommend that such information be thoughtfully integrated across the entire CS curriculum, such as we see taking place in existing courses like “Foundations of AI” (CS 4700), where these topics are brought to light over the course of the semester, as well as integrated into new courses, such as “Ethics and Computing” (CS 1340) We recommend running a panel discussion supported by all three CIS departments (CS, IS, SDS), as well as several student groups addressing implicit bias and bystander action suggestions. We recommend that the department invite Ruha Benjamin to talk about Race and Technology in a colloquium that would be widely advertised to undergraduates (as well as the wider CS and CIS communities). MEng program The vast majority of students in the CS MEng program fall into two largely distinct populations: (1) students who were Cornell CS undergraduates, most typically enrolled through the “early admit” program that allows students to add the MEng to the conclusion of their undergraduate stud"
