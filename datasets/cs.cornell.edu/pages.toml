title = "Information about Ithaca | Department of Computer Science"
description = '''"What's stunning about [Ithaca], though, is the sheer volume and quality of social innovation, pragmatic activism, spiritual seeking, open debate, and homemade and imported cultural fun that goes on here--in an atmosphere of robust local pride." --Jon Spayde Utne Reader, 6/97 Ithaca is a unique town, nestled in the hills overlooking Cayuga Lake in the Finger Lakes region of'''
full_description = '''"What's stunning about [Ithaca], though, is the sheer volume and quality of social innovation, pragmatic activism, spiritual seeking, open debate, and homemade and imported cultural fun that goes on here--in an atmosphere of robust local pride." --Jon Spayde Utne Reader, 6/97 Ithaca is a unique town, nestled in the hills overlooking Cayuga Lake in the Finger Lakes region of New York state. The gorgeous scenery and abundant natural beauty are complemented by a vigorous and diverse intellectual and social mix. There is a little of everything in Ithaca, whether you're looking for outstanding ethnic cooking, art house movies, or cross-country ski trails. Once you've been here for a short while it will come as no surprise to find that many of the area's residents came here to school and decided to make Ithaca a permanent home. Some Ithaca highlights are mentioned below, but there is much more going on here than a few short paragraphs can describe. Ithaca Visitor's Center - General guide to Ithaca hotels, attractions, dining, shopping, and recreation with maps and driving directions. Ithaca Events - Event listing for Ithaca and Tompkins County Dining in Ithaca - Ithaca has more restaurants per capita than NYC and a wide range of options to choose from. Buttermilk Falls State Park - Buttermilk Falls State Park takes its name from the foaming cascade formed by Buttermilk Creek as it flows down the steep valley side toward Cayuga Lake. Cayuga Nature Center - Discover nature! Hike more than five miles of scenic trails, climb a six-story tree house, watch and learn from live animals indoors and outdoors, and stroll through the nature exhibits. Cinemapolis / Cornell Cinema - Three area cinemas devoted to showcasing quality new and classic films. These theaters show art movies, cult classics, foreign films, and the best of the independents - in short, any great movie that might be missed by mega-movie complexes. Cornell Lab of Ornithology - The Cornell Lab of Ornithology is a world leader in the study, appreciation, and conservation of birds. Cornell Botanic Gardens - Cornell Botanic Gardens is alive with plants, including a mature botanical garden, arboretum, and diverse network of nature preserves that help make Cornell one of the most beautiful campuses anywhere. Downtown Ithaca - Downtown Ithaca is the place to enjoy the best that upstate New York has to offer. Surrounded by waterfalls, lakes, and forests, nowhere else in the region can you find such a wide variety of shops, restaurants, theaters, and historic architecture. Farmers' Market - Hosted in a large, airy, waterfront pavilion, the Ithaca Farmer’s Market has something for everyone. With cuisine ranging from Sri Lankan to Korean to the standard breakfast burrito, you can snack as you peruse the local vendors and merchants, pick up a fresh bouquet of flowers, or just sit by the water and listen to the live musicians. Fingerlakes NYS Fingerlakes Region Hangar Theatre - A professional regional summer theatre that attracts nationally acclaimed actors, directors, and designers. Five mainstage productions are staged each year from June through August. Herbert F. Johnson Museum of Art - The Johnson Museum boasts a permanent collection of more than 35,000 pieces and is regarded among the nation's best university galleries. The museum is especially well known for its Asian art and prints. Notable names in the galleries include Rembrandt, Matisse, Manet, Alberto Giacommetti, James McNeill Whistler and Alfred Stieglitz, among others. Moosewood Restaurant - The nationally recognized vegetarian restaurant, made famous by the cookbook "Sundays at Moosewood." Taughannock Falls - A glorious waterfall, cascading 215 feet down through natural rock walls that rise in places to 400 feet. The surrounding state park includes miles of trails, tent and trailer sites, showers, cabins, and a swimming beach. In the winter, the sledding slope opens for old-fashioned thrills. Treman State Park - Robert H. Treman State Park an area of wild beauty, with the rugged gorge called Enfield Glen as its scenic highlight Watkins Glen/Schuyler County - Seneca Lake wineries, racing, parks, dining Wine Tours - The Finger Lakes region is well-known in the East for wine production. The Cayuga Wine Trail stops at estate wineries located on routes 89N and 96N. Close to Cornell, the Six Mile Creek Vineyard is the only winery situated inside the limits of Ithaca. AboutDiversity, Equity, and InclusionValues of Inclusion 2020 Antiracism Task Force 2022 DEI Report News Research News Department Life AwardsListed by Recipient Listed by Category Oral History of Cornell CS CS 40th Anniversary Booklet ABC Book for Computer Science at Cornell by David Gries BooksBooks by Author Books Chronologically Department TimelineThe 60's The 70's The 80's The 90's The 00's The 2010's The 2020's Job PostingsFaculty Positions: Ithaca Faculty Positions: New York City Lecturer Position: Ithaca Post-doc Position: Ithaca Staff/Technical Positions Ugrad Course Staff Ithaca Info Internal info EventsCalendar Graduation Information Cornell Learning Machines Seminar Student Colloquium BOOM Spring 2025 Colloquium Conway-Walker Lecture Series Salton 2024 Lecture Series Seminars / LecturesSpring 2025 Artificial Intelligence Seminar Spring 2025 Robotics Seminar Spring 2025 Systems Research Seminar Spring 2025 Theory Seminar Big Red Hacks Cornell University / Cornell Tech - High School Programming Workshop and Contest 2025 Game Design Initiative CSMore: The Rising Sophomore Summer Program in Computer Science Explore CS Research ACSU Research Night Cornell Junior Theorists' Workshop 2024Cornell Junior Theorists' Workshop 2023 PeopleChair Faculty Researchers Staff Ph.D. Students M.Eng. Students M.S. Students Ph.D. Alumni M.S. Alumni CoursesList of Courses Enrollment Exams Course and Room Roster CS Advanced Standing Exam ResearchArchitecture Artificial Intelligence Computational Biology Database System