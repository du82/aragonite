title = "About the department | Department of Computer Science"
description = "Welcome to Computer Science at Cornell University With Greetings from the Chair, Lorenzo Alvisi Cornell's Computer Science department is one of the first of its kind, founded in 1965. Today, more than a half-century later, CS is part of the Cornell Ann S. Bowers College of Computing and Information Science (Cornell Bowers CIS), which was first known as an academic unit"
full_description = "Welcome to Computer Science at Cornell University With Greetings from the Chair, Lorenzo Alvisi Cornell's Computer Science department is one of the first of its kind, founded in 1965. Today, more than a half-century later, CS is part of the Cornell Ann S. Bowers College of Computing and Information Science (Cornell Bowers CIS), which was first known as an academic unit (Faculty of Computing and Information Science) and celebrated its twentieth anniversary in October 2019. The following year, with a transformative gift from Ann S. Bowers '59, CIS became the Cornell Ann S. Bowers College of Computing and Information Science. The two-campus department—in Ithaca and New York City—has a full-time faculty of 62 members: of these, 49 are in residence at the Ithaca campus while 13 sit at the Cornell Tech campus in New York City. There are about 1,400 undergraduate CS majors (of which more than 500 are women), approximately 200 resident Ph.D. students and 140 masters students. Over 300 undergraduate students graduate each year. 39.29% of majors are female; 12.78% are URM. In the incoming Ph.D. class, 45% are female and 5% are URM. Cornell University is located in Ithaca, a city of about 30,000 people in the heart of the Finger Lakes region of Central New York. Both Cornell and Ithaca offer a wide range of cultural activities, sports events, and outdoor activities with the pleasures of both city and country close at hand. What they say is true: Ithaca is gorges. Click this link for information about visiting Cornell. When I'm not teaching, hosting Cornell CS events, or traveling to academic conferences, you can usually find me in my office in Gates Hall. Please do come by for a visit. —Lorenzo FAQ: What is Cornell Bowers CIS? The Cornell Ann S. Bowers College of Computing and Information Science (Cornell Bowers CIS) comprises three distinct but interconnected departments: Computer Science (CS), Information Science (IS), and Statistics and Data Science (SDS). Where is Cornell Bowers CIS? Cornell Bowers CIS operates out of several buildings on Cornell's Ithaca campus: it is centered in Bill and Melinda Gates Hall, but also found in Comstock, Rhodes, Upson, and other buildings. A new four-story, 135,000 square-foot building will open in spring 2025. What is Cornell Tech and Where is it? Cornell Tech is a graduate school conceived and implemented expressly to integrate the study of technology with business, law, and design. There are now over a half-dozen masters programs on offer as well as doctoral studies. Cornell University began creating a new and prominent campus in New York City, with its first, newly constructed buildings opening in September 2017. Located on Roosevelt Island (between the east side of Manhattan and Long Island City, Queens; under the Queensboro/Ed Koch Bridge), the new campus is called Cornell Tech. How are Ithaca CS and CS at Cornell Tech related? Computer Science is one department operating on two campuses. Each CS faculty member is based either in Ithaca or in New York City. Likewise, a prospective graduate student will typically work in the location of his or her principal advisor. Currently we have 49 faculty in residence at the Ithaca campus while 13 sit at the Cornell Tech campus. Who are the Leaders? Despite having two campuses, the CS faculty in Ithaca and in New York City report to the same Chair, Lorenzo Alvisi, who resides in Ithaca. Meanwhile, Cornell Bowers CIS and Cornell Tech each have their own Deans: The Interim Dean of Cornell Bowers CIS, in Ithaca, is Thorsten Joachims, the Jacob Gould Schurman Professor of Computer Science and Information Science. Joachims was named interim dean January 2025 when Kavita Bala, professor of computer science and inaugural dean of the college, was named Cornell's 17th provost. CS Professor Greg Morrisett is the Jack and Rilla Neafsey Dean and Vice Provost of Cornell Tech in New York City. He was appointed in Fall 2019, having served immediately prior as Dean of CIS in Ithaca. More questions? If you have further questions, please don't hesitate to be in touch with the department. You can reach the Chair's office at < chair@cs.cornell.edu >. For communications-related inquiries, please use < communications@cs.cornell.edu > Department of Computer Science Cornell Ann S. Bowers College of Computing and Information Science 402 Gates Hall Ithaca, NY 14853-7501 Phone: 607-255-0983 Fax: 607-255-9143 AboutDiversity, Equity, and InclusionValues of Inclusion 2020 Antiracism Task Force 2022 DEI Report News Research News Department Life AwardsListed by Recipient Listed by Category Oral History of Cornell CS CS 40th Anniversary Booklet ABC Book for Computer Science at Cornell by David Gries BooksBooks by Author Books Chronologically Department TimelineThe 60's The 70's The 80's The 90's The 00's The 2010's The 2020's Job PostingsFaculty Positions: Ithaca Faculty Positions: New York City Lecturer Position: Ithaca Post-doc Position: Ithaca Staff/Technical Positions Ugrad Course Staff Ithaca Info Internal info EventsCalendar Graduation Information Cornell Learning Machines Seminar Student Colloquium BOOM Spring 2025 Colloquium Conway-Walker Lecture Series Salton 2024 Lecture Series Seminars / LecturesSpring 2025 Artificial Intelligence Seminar Spring 2025 Robotics Seminar Spring 2025 Systems Research Seminar Spring 2025 Theory Seminar Big Red Hacks Cornell University / Cornell Tech - High School Programming Workshop and Contest 2025 Game Design Initiative CSMore: The Rising Sophomore Summer Program in Computer Science Explore CS Research ACSU Research Night Cornell Junior Theorists' Workshop 2024Cornell Junior Theorists' Workshop 2023 PeopleChair Faculty Researchers Staff Ph.D. Students M.Eng. Students M.S. Students Ph.D. Alumni M.S. Alumni CoursesList of Courses Enrollment Exams Course and Room Roster CS Advanced Standing Exam ResearchArchitecture Artificial Intelligence Computational Biology Database Systems Graphics Human Interaction Machine Learning Natural Language Processing Programming Languages Robotics Scientific Computing Security Software Engineering Systems and Networking Theory of Computing Vision UndergraduateAdmissions Contact UGrad OfficeContact Academic Advisor Your First CS Course CS MajorTechnical Electives CS with Other Majors/Areas Transfer Credits CS Honors Program CPT for International CS Undergrads Graduation Requirements Useful Forms Electives Becoming a CS Major CS EngineeringRequirements CS Arts & SciencesRequirements Graduation Information MinorsCS Minor Game Design Minor Career InformationCo-op Program Undergrad ResearchCornell Bowers CIS Undergraduate Research Experience (BURE) Independent Research (CS 4999) Student Groups UGrad Events Undergraduate Learning Center UGrad Course Staff Info M EngAdmissionsThe Review Process Early M.Eng Credit Approval Financial Aid FAQ Prerequisites The Application Process AcademicsThe Project FAQ Pre-approved Electives Degree Requirements Current StudentsFAQ M.Eng Lab MEng Forms The Course Enrollment Process Advising Tips Entrepreneurship Cornell Tech Programs Professional Development Graduation Information Contact MEng Office Career Success MSAdmissionsApplicant FAQ Current StudentsComputer Science Graduate Office Hours Exam Scheduling Guidelines Degree Requirements Graduate TA Handbook MS Degree Checklist MS Student Financial Support Special Committee Selection Diversity and Inclusion Graduation Information Contact MS Office PhDAdmissionsPh.D. Applicant FAQ Graduate Housing Non-Degree Application Guidelines Ph. D. Visit Day Robotics PhD prgram Current StudentsComputer Science Graduate Office Hours Advising Guide for Research Students Business Card Policy Cornell Tech Curricular Practical Training A & B Exam Scheduling Guidelines Fellowship Opportunities Field of Computer Science Ph.D. Student Handbook Graduate TA Handbook Field A Exam Summary Form Graduate School Forms Instructor / TA Application Ph.D. Requirements Ph.D. 