title = "Faculty Positions: Ithaca | Department of Computer Science"
description = "The Cornell University Department of Computer Science (CS) in the Cornell Ann S. Bowers College of Computing and Information Science (Bowers CIS) has multiple faculty positions available at its Ithaca campus (tenured and tenure-track). Cornell CS is ranked among the top computer science departments in the country (http://www.cs.cornell.edu/). Ithaca, NY is in the heart of the"
full_description = "The Cornell University Department of Computer Science (CS) in the Cornell Ann S. Bowers College of Computing and Information Science (Bowers CIS) has multiple faculty positions available at its Ithaca campus (tenured and tenure-track). Cornell CS is ranked among the top computer science departments in the country (http://www.cs.cornell.edu/). Ithaca, NY is in the heart of the Finger Lakes region, which offers a vibrant cultural life and a wide range of sporting and outdoor activities with the pleasures of both city and country close at hand. Applications from all areas of computer science and related fields are welcome. Faculty hired in these positions will be members of the Department of Computer Science, which spans the Ithaca and New York City campuses, but their teaching and research will be based in Ithaca. A separate application is needed to be considered for a Computer Science position at the New York City campus; please visit the website https://www.cs.cornell.edu/information/jobpostings/facultypositionsnyctech for further information about the New York City application process. Tenured and tenure-track faculty must hold the equivalent of a Ph.D. Applicants must have demonstrated an ability to conduct outstanding research. Successful candidates are expected to pursue an active research program, to teach graduate and undergraduate courses, and to supervise graduate students. To ensure full consideration, applications should be received by December 1, 2024, but applications will be accepted until all positions are filled. Fostering an inclusive environment is a core value of the Computer Science Department and Cornell as a whole. In line with Cornell’s historical commitment to educating “… any person … in any study…”, we seek candidates who will create a climate that helps attract and is inclusive of all students, including students from historically underrepresented groups and students who have overcome personal challenges. Applicants should submit a curriculum vitae and brief statements of research and teaching interests, identify one or two top publications to which they have made significant contributions, and arrange to have at least three reference letters submitted at: https://academicjobsonline.org/ajo/jobs/28414. We ask applicants for all faculty positions to share their experiences and/or approaches (past, current, or future) to fostering learning, research service, and/or outreach in a diverse community. Applicants may choose to submit a stand-alone statement or embed the information in other parts of their application materials. Salary Range: $79,400 – 329,600 The salary range reflects an aggregate of qualifications and disciplines across Cornell University. Actual salary offers in Bowers CIS will be based on education, experience, discipline, and relevant skills. Inquiries about your application may be directed to frecruit@cs.cornell.edu Cornell University seeks to meet the needs of dual career couples, has a Dual Career program, and is a member of the Upstate New York Higher Education Recruitment Consortium to assist with dual career searches. Diversity and Inclusion are a part of Cornell University's heritage. We are a recognized employer and educator valuing AA/EEO, Protected Veterans, and Individuals with Disabilities. We also recognize a lawful preference in employment practices for Native Americans living on or near Indian reservations. Cornell University is an innovative Ivy League university and a great place to work. Our inclusive community of scholars, students, and staff impart an uncommon sense of larger purpose, and contribute creative ideas to further the university's mission of teaching, discovery, and engagement. AboutDiversity, Equity, and InclusionValues of Inclusion 2020 Antiracism Task Force 2022 DEI Report News Research News Department Life AwardsListed by Recipient Listed by Category Oral History of Cornell CS CS 40th Anniversary Booklet ABC Book for Computer Science