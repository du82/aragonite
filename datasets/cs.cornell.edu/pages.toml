description = "At the Computer Science Department of the Cornell Ann S. Bowers College of Computing and Information Science, we are committed to increasing diversity; increasing participation of underrepresented groups; promoting an inclusive climate and sense of belonging for students, staff, and faculty; and promoting equitable policies across the Department and the College. The CS"
