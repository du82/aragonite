["https://cs.cornell.edu/information/news/newsitem13699/dutta-and-ellis-advance-ai-coding-grant-meta"]
title = "Dutta and Ellis to advance AI coding with grant from Meta | Department of Computer Science"
full_description = '''Research Areas: Artificial IntelligenceRelated People: Saikat Dutta Kevin Ellis Date Posted: 2/13/2025Saikat Dutta and Kevin Ellis, both assistant professors of computer science in the Cornell Ann S. Bowers College of Computing and Information Science, have received a grant from Meta to further develop the capabilities of artificial intelligence (AI) in software development. Through this support, they will develop a next-generation benchmark that will enable researchers to measure their progress in using generative AI for software development and to expand the scope of the problems these models can address. The benchmark will cover areas such as fixing bugs, responding to human code reviews, generating software tests, and translating one programming language into another. "The future impact of AI-automated software development will be far-ranging," said Dutta and Ellis in a statement. "Beyond building and improving apps, AI will help us write more comprehensive software tests, review code, and perform many other tasks that are part of the software development life cycle." Dutta and Ellis received one of four grants awarded by Meta through their Large Language Model (LLM) Evaluation Research Grant program. The program was designed to create new benchmarks for the behavior of LLMs, which are AI-based models designed to process human language – both to ensure that the models can be trusted and to expand the scope of their performance. "The teams at Meta are really excited to collaborate with Dr. Saikat Dutta and his team at Cornell on building new benchmarks for evaluations of large language models, and more broadly, to continue working with the broader academic community on pushing the boundaries of new research in the LLM space," said Nivi Obla, program manager, GenAI at Meta. This work is in line with Dutta’s and Ellis' larger research programs. Dutta's team focuses on software engineering, specifically developing software testing and debugging techniques. He aims to build tools and techniques that improve the reliability of machine learning-based systems and is also exploring how to leverage the latest machine learning techniques to solve software engineering problems. Ellis' work centers around neural program synthesis, and, more broadly, on ways of using machine learning to generate programs and other forms of human-understandable symbolic models. Patricia Waldron is a writer for the Cornell Ann S. Bowers College of Computing and Information Science AboutDiversity, Equity, and InclusionValues of Inclusion 2020 Antiracism Task Force 2022 DEI Report NewsDutta and Ellis to advance AI coding with grant from Meta Research News Department Life AwardsListed by Recipient Listed by Category Oral History of Cornell CS CS 40th Anniversary Booklet ABC Book for Computer Science at Cornell by David Gries BooksBooks by Author Books Chronologically Department TimelineThe 60's The 70's The 80's The 90's The 00's The 2010's The 2020's Job PostingsFaculty Positions: Ithaca Faculty Positions: New York City Lecturer Position: Ithaca Post-doc Position: Ithaca Staff/Technical Positions Ugrad Course Staff Ithaca Info Internal info EventsCalendar Graduation Information Cornell Learning Machines Seminar Student Colloquium BOOM Spring 2025 Colloquium Conway-Walker Lecture Series Salton 2024 Lecture Series Seminars / LecturesSpring 2025 Artificial Intelligence Seminar Spring 2025 Robotics Seminar Spring 2025 Systems Research Seminar Spring 2025 Theory Seminar Big Red Hacks Cornell University / Cornell Tech - High School Programming Workshop and Contest 2025 Game Design Initiative CSMore: The Rising Sophomore Summer Program in Computer Science Explore CS Research ACSU Research Night Cornell Junior Theorists' Workshop 2024Cornell Junior Theorists' Workshop 2023 PeopleChair Faculty Researchers Staff Ph.D. Students M.Eng. Students M.S. Students Ph.D. Alumni M.S. Alumni CoursesList of Courses Enrollment Exams Course and Room Roster CS