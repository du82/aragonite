["http://www.cs.cornell.edu/content/spring-2025-theory-seminar"]
title = "Spring 2025 Theory Seminar | Department of Computer Science"
full_description = "03.03.25 3:45pm A Zero-Knowledge PCP Theorem Speaker: Jack O'Connor, Cambridge Host: Nick Spooner 03.05.25 3:00pm When Connectivity is Hard, Random Walks are Easy (with Nondeterminism) Speaker: Ted Pyne, MIT Host: Eshan Chattopadhyay 03.10.25 3:45pm TBD Speaker: Henry Yuen, Columbia Host: Nick Spooner 03.17.25 3:45pm TBD Speaker: Jon Kleinberg, Cornell Host: Eshan Chattopadhyay 04.07.25 3:45pm TBD Speaker: Princewill Okoroafor, Cornell Host: Eshan Chattopadhyay 04.14.25 3:45pm TBD Speaker: Jesse Goodman, UT Austin Host: Eshan Chattopadhyay 04.21.25 3:45pm TBD Speaker: TBD Host: Eshan Chattopadhyay 04.28.25 3:45pm TBD Speaker: Alex Lombardi, Princeton Host: Nick Spooner 05.05.25 3:45pm TBD Speaker: Cynthia Dwork, Harvard Host: Eshan Chattopadhyay Past Events 01.28.25 11:45am A quest for an algorithmic theory for high-dimensional statistical inference 01.28.25 11:45am Speaker: Sidhanth Mohanty, MIT Host: Eshan Chattopadhyay 02.03.25 3:45pm An efficient quantum parallel repetition theorem and applications 02.03.25 3:45pm Speaker: Nick Spooner, Cornell Host: Eshan Chattopadhyay 02.10.25 3:45pm Hypergraph Projection and Reconstruction 02.10.25 3:45pm Speaker: Yanbang Wang, Cornell Host: Jon Kleinberg 02.24.25 3:45pm Improved Approximation Algorithms for the Joint Replenishment Problem with Outliers, and with Fairness Constraints 02.24.25 3:45pm Speaker: Varun Suriyanarayana, Cornell Host: David Shmoys To join (or subscribe to) the theory mailing list, email cs-theory-seminar-l-request@cornell.edu and put join in the subject line. Leave the body of the email blank. More info is here if you need an example: https://it.cornell.edu/lyris/join-e-lists-lyris Archives Fall 2024 | Spring 2024 | Fall 2023 | Spring 2023 | Fall 2022 | Spring 2022 | Fall 2021 | Spring 2021 | Fall 2020 | Spring 2020 | Fall 2019 | Spring 2019 | Fall 2018 | Spring 2018 | Fall 2017 | Fall 2017 | Spring 2017 | Fall 2016 | Spring 2016 | Fall 2015 | Spring 2015 | Fall 2014 | Spring 2014