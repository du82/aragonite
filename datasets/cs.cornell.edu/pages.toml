["https://cs.cornell.edu/information/jobpostings/lecturerpositionithaca"]
title = "Lecturer Position: Ithaca | Department of Computer Science"
description = "The Cornell University Department of Computer Science (CS) in the Cornell Ann S. Bowers College of Computing and Information Science (Bowers CIS) invites applications from outstanding candidates with a passion for undergraduate teaching for a Lecturer & Senior Lecturer position at Cornell’s Ithaca campus. Lecturers & Senior Lecturers are non-tenure track teaching faculty"
full_description = "The Cornell University Department of Computer Science (CS) in the Cornell Ann S. Bowers College of Computing and Information Science (Bowers CIS) invites applications from outstanding candidates with a passion for undergraduate teaching for a Lecturer & Senior Lecturer position at Cornell’s Ithaca campus. Lecturers & Senior Lecturers are non-tenure track teaching faculty members who are hired on multi-year appointments with the expectation of renewal and promotion. Candidates for the position should hold a PhD in a computing-related field, have demonstrated commitment to teaching excellence and innovation, and be dedicated to fostering a diverse, equitable, and inclusive environment. We are seeking candidates who can teach large lower- and upper-level undergraduate and master’s level courses across a range of computer science subfields. A typical full-time (100% effort) load for a Lecturer & Senior Lecturer in Computer Science is two courses per semester, where teaching and managing the course staff of large required undergraduate level courses counts as two courses. The department offers a collaborative and stimulating culture and a competitive salary and benefits package. Lecturers & Senior Lecturers play a full and active part in departmental life and work with other faculty members and our excellent students in a broad range of ways, such as teaching upper-level courses, curriculum design and innovation, advising undergraduate and M.Eng. student projects, mentoring Ph.D. students interested in teaching careers, and participating in wider faculty governance and decision-making. Fostering an inclusive environment is a core value of the Computer Science Department and Cornell as a whole. See https://diversity.cis.cornell.edu/ for some Bowers CIS activities in this area. In line with Cornell’s historical commitment to educating “ … any person … in any study…”, we seek candidates who will create a climate that is inclusive of all students, including students from historically underrepresented groups and students who have overcome personal challenges. Cornell University is located in Ithaca, New York, with a county population of about 100,000 people in the heart of the Finger Lakes region. Both Cornell and Ithaca offer a wide range of cultural activities, sports, and outdoor activities with the pleasures of both city and country close at hand. Interested applicants should submit a cover letter, curriculum vitae, and a teaching statement speaking to experience, skills, distinct strengths, and evidence of past teaching success and ability and make arrangements for three letters of reference speaking to the candidates teaching skills and abilities to be submitted electronically. We ask applicants for all faculty positions to share their experiences and/or approaches (past, current, or future) to fostering learning, research service, and/or outreach in a diverse community. Applicants may choose to submit a stand-alone statement or embed the information in other parts of their application materials. Application materials should be submitted at: https://academicjobsonline.org/ajo/jobs/29038 Evaluation of applicants will begin November 15, 2024, and continue until the positions are filled. Salary Range: $49,700-$164,000 The salary range reflects an aggregate of qualifications and disciplines across Cornell University. Actual salary offers in Bowers CIS will be based on education, experience, discipline, and relevant skills. For more information about Cornell Computer Science, please visit our website at: https://www.cs.cornell.edu. More information on our current undergraduate programs and course offerings is available at: http://www.cs.cornell.edu/undergrad. Diversity and Inclusion are a part of Cornell University's heritage. We are a recognized employer and educator valuing AA/EEO, Protected Veterans, and Individuals with Disabilities. We also recognize a lawful preference in employment practices for Native Americans living on or near Indian reservations. Cornell University is an innovative Ivy League university and a great place to work. Our inclusive community of scholars, students, and staff impart an uncommon sense of larger purpose, and contribute creative ideas to further the university's mission of teaching, discovery, and engagement. AboutDiversity, Equity, and InclusionValues of Inclusion 2020 Antiracism Task Force 2022 DEI Report News Research News Department Life AwardsListed by Recipient Listed by Category Oral History of Cornell CS CS 40th Anniversary Booklet ABC Book for Computer Science at Cornell by David Gries BooksBooks by Author Books Chronologically Department TimelineThe 60's The 70's The 80's The 90's The 00's The 2010's The 2020's Job PostingsFaculty Positions: Ithaca Faculty Positions: New York City Lecturer Position: Ithaca Post-doc Position: Ithaca Staff/Technical Positions Ugrad Course Staff Ithaca Info Internal info EventsCalendar Graduation Information Cornell Learning Machines Seminar Student Colloquium BOOM Spring 2025 Colloquium Conway-Walker Lecture Series Salton 2024 Lecture Series Seminars / LecturesSpring 2025 Artificial Intelligence Seminar Spring 2025 Robotics Seminar Spring 2025 Systems Research Seminar Spring 2025 Theory Seminar Big Red Hacks Cornell University / Cornell Tech - High School Programming Workshop and Contest 2025 Game Design Initiative CSMore: The Rising Sophomore Summer Program in Computer Science Explore CS Research ACSU Research Night Cornell Junior Theorists' Workshop 2024Cornell Junior Theorists' Workshop 2023 PeopleChair Faculty Researchers Staff Ph.D. Students M.Eng. Students M.S. Students Ph.D. Alumni M.S. Alumni CoursesList of Courses Enrollment Exams Course and Room Roster CS Advanced Standing Exam ResearchArchitecture Artificial Intelligence Computational Biology Database Systems Graphics Human Interaction Machine Learning Natural Language Processing Programming Languages Robotics Scientific Computing Security 