["http://www.cs.cornell.edu/events/cornell-university-cornell-tech-high-school-programming-workshop-and-contest-2025"]
title = "Cornell University / Cornell Tech - High School Programming Workshop and Contest 2025 | Department of Computer Science"
description = "2025 Women in Computing at Cornell (WiCC) High School Programming Contest Workshop Date: Sunday, February 9, 2025 Register Here! Schedule: 12:00pm: Arrival and registration 12:30pm: Introduction to programming contests 1pm: Problem walk-through 2pm: Solve problem in small groups 2:45: Share solutions 3:00: Solve problem in small groups 3:45: Share solutions Programming"
full_description = "2025 Women in Computing at Cornell (WiCC) High School Programming Contest Workshop Date: Sunday, February 9, 2025 Register Here! Schedule: 12:00pm: Arrival and registration 12:30pm: Introduction to programming contests 1pm: Problem walk-through 2pm: Solve problem in small groups 2:45: Share solutions 3:00: Solve problem in small groups 3:45: Share solutions Programming contests are fun and challenging, help build computing skills, and add significantly to students’ profile in college applications. The more students compete, the stronger their skills become. But students from groups underrepresented in tech, including women, Black, Hispanic, and Indigenous students, and students with disabilities, are also underrepresented in programming competitions. On February 9 , 2025, Cornell and Cornell Tech will partner with Women in Computing at Cornell (WiCC) to host a hands-on programming contest workshop to build and practice skills for students with less experience competing. Our goal is to prepare you for our March 29th contest. This workshop is open to all but focused on women and students from groups underrepresented in computer science to create a diverse, inclusive and egalitarian competition. The workshop will include problems from prior contests ranging from “very easy” to “medium-hard”. Only limited programming experience is required, but you should be able to write some code in C, C++, Java (not JavaScript), or Python. You can see sample questions from previous years here. The WiCC HS Programming Contest Workshop will be held in person on both the Cornell Ithaca and Cornell Tech NYC campuses. We will take you step-by-step through several problems, then give you some time to work on problems in small groups. Cornell and Cornell Tech student mentors will be there to help groups strategize and debug. Students will learn how to submit solutions, and read error messages. Snacks, drinks, and ice cream will be provided. Just bring your laptops and your love for problem solving! Cornell’s HS Programming Contest events are open to all high school students living in New York, New Jersey, Connecticut, or Pennsylvania. 2025 High School Programming Contest Information Date: Saturday, March 29, 2025 Register Here! We’re excited to announce that the 2025 High School Programming Contest will be held on March 29. Our contest is open to students who live or attend school in New York, New Jersey, Connecticut, or Pennsylvania. The contest will be held in person on Cornell’s Ithaca and NYC Cornell Tech campuses. We can’t wait to see you on campus! Students will compete in teams of 3. The Cornell HS Programming Contest generally includes 6-7 problems of varying difficulty (easy to very challenging) to be solved in 3 hours. Competitors will sharpen not only their computer science problem solving skills, but their strategy and teamwork as well. Students may compete using Python, Java, C, or C++. You can see sample questions from previous years here. Schedule 11:30am: Arrival and registration 12:00pm: Logistics and introduction to the competition 12:30pm: Contest begins 3:30pm: Contest ends 3:45pm: Guest Speaker 4:00pm: Awards Ceremony Frequently Asked Questions Have more questions? Want more information? Contact Elizabeth Estabrook (Ithaca Campus) at ee54@cornell.edu or Sophie Lanchez (NYC Tech Campus) at k12@tech.cornell.edu Archives Contest 2024 I Contest 2023 | Contest 2022 | Contest 2021 | Contest 2020 | Contest 2019 | Contest 2018 | Contest 2017 | Contest 2016 | Contest 2015 | Contest 2014 AboutDiversity, Equity, and InclusionValues of Inclusion 2020 Antiracism Task Force 2022 DEI Report News Research News Department Life AwardsListed by Recipient Listed by Category Oral History of Cornell CS CS 40th Anniversary Booklet ABC Book for Computer Science at Cornell by David Gries BooksBooks by Author Books Chronologically Department TimelineThe 60's The 70's The 80's The 90's The 00's The 2010's The 2020's Job PostingsFaculty P