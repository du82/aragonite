title = "Values of Inclusion | Department of Computer Science"
description = "Computer Science Community Statement of Values of Inclusion Our community thrives when every individual is valued and treated with dignity and respect. Only then will we achieve the open exchange of ideas that drives forward scientific discovery. All members of the Computer Science (CS) community have the right to feel safe and welcome, and to participate in our intellectual"
full_description = "Computer Science Community Statement of Values of Inclusion Our community thrives when every individual is valued and treated with dignity and respect. Only then will we achieve the open exchange of ideas that drives forward scientific discovery. All members of the Computer Science (CS) community have the right to feel safe and welcome, and to participate in our intellectual life in a positive and professional working environment. To foster this environment, we make the following commitments: We will cultivate inclusive and collaborative working relationships and communicate positively with all individuals, inside and outside of our community. Our interactions will reflect the inherent worth of every person and group, regardless of their race, national or ethnic origin, color, religion, age, sex, marital status, family status, political preference, disability status, sexual orientation, gender identity, or any other line of difference. We believe that impact matters. Harassment or biased behavior can occur when there is no deliberate intention to offend. Harassment or bias committed in a joking manner or framed as a compliment still constitutes unacceptable behavior. When our impact does not align with our intent, we will take responsibility for it and do better. We will speak up when a member of our community does not act in accordance with these commitments. We are all responsible for our environment. The Computer Science leadership will uphold these commitments, including through implementing the Campus Code of Conduct. AboutDiversity, Equity, and InclusionValues of Inclusion 2020 Antiracism Task Force 2022 DEI Report News Research News Department Life AwardsListed by Recipient Listed by Category Oral History of Cornell CS CS 40th Anniversary Booklet ABC Book for Computer Science at Cornell by David Gries BooksBooks by Author Books Chronologically Department TimelineThe 60's The 70's The 80's The 90's The 00's The 2010's The 2020's Job Posting