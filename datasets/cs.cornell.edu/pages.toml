["https://cs.cornell.edu/information/news/newsitem13447/schmidt-sciences-names-sarah-dean-ai2050-fellow"]
title = "Schmidt Sciences names Sarah Dean an AI2050 Fellow | Department of Computer Science"
full_description = '''Research Areas: Artificial IntelligenceRelated People: Sarah Dean Date Posted: 12/17/2024Sarah Dean, assistant professor of computer science in the Cornell Ann S. Bowers College of Computing and Information Science, has received an AI2050 Early Career Fellowship from Schmidt Sciences. Dean will receive the funding over two years to support her efforts to develop tools that prevent unanticipated negative consequences of large-scale AI systems, like chatbots and personal recommendation systems. "I'm thrilled to receive this award, both for the research it will enable me to carry out with my students and postdocs, and because I'm excited to join such an impressive cohort of AI2050 fellows," Dean said. Schmidt Sciences' AI2050 program invites scientists to imagine a world in the year 2050, in which AI has helped solve global challenges and benefited humanity. Their Early Career Fellows program supports researchers who are working to develop exactly these kinds of AI applications, especially those that are ambitious, multidisciplinary, and difficult to fund. Dean is among 20 Early Career Fellows selected this year. For this project, Dean will create tools that anticipate, detect, and intervene in situations where AI systems have the potential to create harm, such as addiction or radicalization. She will draw from control theory, a branch of applied mathematics that uses feedback to control the behavior of a system to achieve a desired goal, and causal inference, a set of methods to determine if an observed association is a cause-and-effect relationship. In her larger research work, Dean focuses on the interplay between optimization, machine learning, and dynamics in real-world systems. Ultimately, she hopes to establish guardrails that will result in more safe, secure, and robust AI systems that will be worthy of public trust. Dean's work has received best paper awards at the International Conference on Machine Learning and the NeuRIPS Joint Workshop on AI for Social Good, and a best paper finalist award at the Conference on Robot Learning. She earned her doctorate and masters degree in electrical engineering and computer sciences at the University of California, Berkeley, where she received a Berkeley Fellowship and an NSF Graduate Research Fellowship. By Patricia Waldron, a writer for the Cornell Ann S. Bowers College of Computing and Information Science. AboutDiversity, Equity, and InclusionValues of Inclusion 2020 Antiracism Task Force 2022 DEI Report NewsSchmidt Sciences names Sarah Dean an AI2050 Fellow Research News Department Life AwardsListed by Recipient Listed by Category Oral History of Cornell CS CS 40th Anniversary Booklet ABC Book for Computer Science at Cornell by David Gries BooksBooks by Author Books Chronologically Department TimelineThe 60's The 70's The 80's The 90's The 00's The 2010's The 2020's Job PostingsFaculty Positions: Ithaca Faculty Positions: New York City Lecturer Position: Ithaca Post-doc Position: Ithaca Staff/Technical Positions Ugrad Course Staff Ithaca Info Internal info EventsCalendar Graduation Information Cornell Learning Machines Seminar Student Colloquium BOOM Spring 2025 Colloquium Conway-Walker Lecture Series Salton 2024 Lecture Series Seminars / LecturesSpring 2025 Artificial Intelligence Seminar Spring 2025 Robotics Seminar Spring 2025 Systems Research Seminar Spring 2025 Theory Seminar Big Red Hacks Cornell University / Cornell Tech - High School Programming Workshop and Contest 2025 Game Design Initiative CSMore: The Rising Sophomore Summer Program in Computer Science Explore CS Research ACSU Research Night Cornell Junior Theorists' Workshop 2024Cornell Junior Theorists' Workshop 2023 PeopleChair Faculty Researchers Staff Ph.D. Students M.Eng. Students M.S. Students Ph.D. Alumni M.S. Alumni CoursesList of Courses Enrollment Exams Course and Room Roster CS Advanced Standing Exam ResearchArchitecture Artificial Intelligence Computational Biology Database Systems G