title = "Department Life | Department of Computer Science"
description = "There's a lot going on in computer science. CS faculty members are readily available to graduate students and one another. Professors' offices are interspersed with graduate students' offices, and most work with their doors open. But it's not all work and no play; professors and students have been members of the same intramural athletic teams—and even a string quartet."
