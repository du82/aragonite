["https://cs.cornell.edu/content/unique-games-and-high-dimensional-expansion"]
title = "On Unique Games and High Dimensional Expansion | Department of Computer Science"
description = "On Unique Games and High Dimensional Expansion Abstract: The Unique Games Conjecture (UGC) is a central open question in computational complexity and algorithms. In short, the UGC stipulates that almost satisfiable instances of Unique Games, a certain 2-variable constraint satisfaction problem (CSP), are NP-hard to distinguish from highly unsatisfiable instances. The UGC is"
full_description = "SpeakerMitali Bafna, Carnegie Mellon UniversityFriday, May 12, 2023 - 10:05 to 10:50Gates G01Categories: Cornell Junior Theorists' Workshop 2023On Unique Games and High Dimensional Expansion Abstract: The Unique Games Conjecture (UGC) is a central open question in computational complexity and algorithms. In short, the UGC stipulates that almost satisfiable instances of Unique Games, a certain 2-variable constraint satisfaction problem (CSP), are NP-hard to distinguish from highly unsatisfiable instances. The UGC is known to imply a vast number of hardness-of-approximation results in combinatorial optimization. In the first part of the talk I will discuss my recent works that give algorithms for Unique Games (UG) on a large class of restricted instances: certifiable small-set expanders and graphs with certifiable global hypercontractivity. Our first algorithm solves UG instances whenever low-degree sum-of-squares (SoS) proofs certify good bounds on the small-set-expansion of the underlying constraint graph. A more complicated version of our algorithm succeeds even when the constraint graph is not a small-set expander as long as the structure of non-expanding small sets is “characterized” by a low-degree SoS proof, a property we call certified global hypercontractivity. The latter algorithm gives us new insights into the source of hardness in the breakthrough result that proved the 2-2 games conjecture. In the second part of the talk, I will discuss our work that develops a new theory of global hypercontractivity on high dimensional expanders (HDX), an important class of graphs that generalize the well-studied Johnson graphs. Combined with the algorithmic framework discussed above our results imply algorithms for UG on HDX. Our algorithmic techniques add to the (currently short) list of general tools for analyzing SoS relaxations for worst-case optimization problems and connect the UGC to the small-set expansion hypothesis and the theory of high-dimensional expansion. Bio: Mitali ia a postdoc at CMU hosted by Prof. Aayush Jain and Prof. Pravesh Kothari. Before this, she was a graduate student in theoretical computer science at Harvard University where she was advised by Prof. Madhu Sudan. She did my undergrad in computer science from IIT Madras.Her research is focussed on complexity theory and algorithms, specifically the complexity of combinatorial optimization problems, sum of squares algorithms and high dimensional expanders. AboutDiversity, Equity, and InclusionValues of Inclusion 2020 Antiracism Task Force 2022 DEI Report News Research News Department Life AwardsListed by Recipient Listed by Category Oral History of Cornell CS CS 40th Anniversary Booklet ABC Book for Computer Science at Cornell by David Gries BooksBooks by Author Books Chronologically Department TimelineThe 60's The 70's The 80's The 90's The 00's The 2010's The 2020's Job PostingsFaculty Positions: Ithaca Faculty Positions: New York City Lecturer Position: Ithaca Post-doc Position: Ithaca Staff/Technical Positions Ugrad Course Staff Ithaca Info Internal info EventsCalendarOn Unique Games and High Dimensional Expansion Graduation Information Cornell Learning Machines Seminar Student Colloquium BOOM Spring 2025 Colloquium Conway-Walker Lecture Series Salton 2024 Lecture Series Seminars / LecturesSpring 2025 Artificial Intelligence Seminar Spring 2025 Robotics Seminar Spring 2025 Systems Research Seminar Spring 2025 Theory Seminar Big Red Hacks Cornell University / Cornell Tech - High School Programming Workshop and Contest 2025 Game Design Initiative CSMore: The Rising Sophomore Summer Program in Computer Science Explore CS Research ACSU Research Night Cornell Junior Theorists' Workshop 2024Cornell Junior Theorists' Workshop 2023 PeopleChair Faculty Researchers Staff Ph.D. Students M.Eng. Students M.S. Students Ph.D. Alumni M.S. Alumni CoursesList of Courses Enrollment Exams Course and Room Roster CS Advanced Standing Exam ResearchArchite