title = "Approximation Algorithms for Maximum Directed Cut in Streaming Settings | Department of Computer Science"
description = "Approximation algorithms for Maximum Directed Cut in Streaming Settings Abstract: Given a directed graph, the Maximum Directed Cut (Max-DICUT) problem asks to estimate the size of the largest directed cut, an ordered partition of the vertex set whose size is given by the number of edges from one set to the other. The Max-DICUT problem has emerged as a central problem in the"
full_description = "SpeakerSanthoshini Velusamy, Harvard University Thursday, May 11, 2023 - 13:00 to 13:45Gates G01Categories: Cornell Junior Theorists' Workshop 2023Approximation algorithms for Maximum Directed Cut in Streaming Settings Abstract: Given a directed graph, the Maximum Directed Cut (Max-DICUT) problem asks to estimate the size of the largest directed cut, an ordered partition of the vertex set whose size is given by the number of edges from one set to the other. The Max-DICUT problem has emerged as a central problem in the study of Constraint Satisfaction Problems (CSPs) in the streaming model of computation. In the talk, I will discuss our algorithms for Max-DICUT in various settings of the streaming model and will briefly touch upon generalizations to arbitrary CSPs. I will conclude with a discussion of several open problems in this area. Bio: Santhoshini is a fifth-year computer science graduate student at Harvard University, advised by Prof. Madhu Sudan. She received her dual degree of BTech(Hons.) and MTech in Computer Science from IIT Madras.Broadly interested in the design and analysis of algorithms for combinatorial optimization problems. Mainly studies algorithms in settings where there’s limited access to the input data or uncertainty in it. These include streaming and online settings, and game theory settings where the input to the algorithm is provided by strategic agents.Supported by the Google PhD fellowship. Will be joining TTIC as a Research Assistant Professor in Fall 2023. AboutDiversity, Equity, and InclusionValues of Inclusion 2020 Antiracism Task Force 2022 DEI Report News Research News Department Life AwardsListed by Recipient Listed by Category Oral History of Cornell CS CS 40th Anniversary Booklet ABC Book for Computer Science at Cornell by David Gries BooksBooks by Author Books Chronologically Department TimelineThe 60's The 70's The 80's The 90's The 00's The 2010's The 2020's Job PostingsFaculty Positions: Ithaca Faculty Pos