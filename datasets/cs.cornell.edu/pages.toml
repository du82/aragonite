description = "Please use email to contact the Computer Science Master of Engineering Program: For general program inquiries: meng@cs.cornell.edu For questions pertaining to applying and the admissions process: meng-admissions@cs.cornell.edu The Master of Engineering (M.Eng.) program in Computer Science is a two-semester professional degree program designed to enhance practical skills. It"
full_description = '''Please use email to contact the Computer Science Master of Engineering Program: For general program inquiries: meng@cs.cornell.edu For questions pertaining to applying and the admissions process: meng-admissions@cs.cornell.edu The Master of Engineering (M.Eng.) program in Computer Science is a two-semester professional degree program designed to enhance practical skills. It roughly involves six courses and a project. Flexible requirements make it possible to realize a broad range of CS-related career possibilities. The program is energized by the diversity of research within the department and across the campus. If you majored in CS or a related field as an undergraduate, then the program can be used to deepen your technical expertise. The program also works for those students who "minored" in CS and who wish to push the computing envelope in their undergraduate field of study, e.g., chemistry, civil engineering, sociology, etc. Students with entrepreneurial ambitions can take specially designed courses from the Johnson Graduate School of Management. They can also develop projects that respond to IT needs that surface all over campus. Students who have limited or no formal CS coursework should review our pre-requisite information available here and make sure they have met those requirements before applying. Application deadlines are February 1 for fall admissions and October 1 for spring admissions. New Diversity Scholarship for CS M.Eng applicants established: Click for more information. Cornell Tech in New York City also offers a Master of Engineering Program in Computer Science. The program incorporates both technical and business classes and focuses on entrepreneurial thinking. For more information on the programs offered at Cornell Tech and the admission process, please visit tech.cornell.edu. The Department of Computer Science also offers a small two-year Master of Science Program. If you are interested in a Research Master's degree, plea