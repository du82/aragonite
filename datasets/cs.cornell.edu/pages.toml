["https://cs.cornell.edu/information/diversity-inclusion/2022-dei-report"]
title = "2022 DEI Report | Department of Computer Science"
description = "Diversity, Equity, and Inclusion Activity Report Cornell, Computer Science, September 2022 The Department of Computer Science Diversity, Equity, and Inclusion (DEI) committee: Haym Hirsh (chair), Alexandra Silva, Becky Stewart, Bobby Kleinberg, David Bindel, Eva Tardos, Hakim Weatherspoon, Robbert van Renesse, Stephanie Meik, Tammy Gardner, Tom Ristenpart. The DEI committee"
full_description = "Diversity, Equity, and Inclusion Activity Report Cornell, Computer Science, September 2022 The Department of Computer Science Diversity, Equity, and Inclusion (DEI) committee: Haym Hirsh (chair), Alexandra Silva, Becky Stewart, Bobby Kleinberg, David Bindel, Eva Tardos, Hakim Weatherspoon, Robbert van Renesse, Stephanie Meik, Tammy Gardner, Tom Ristenpart. The DEI committee met regularly during the semester. Here we document the activities and actions taken during the past two years, and our plans for the next academic year. General updates The dean’s office has established the new Cornell Ann S, Bowers College of Computing and Information Science Office of Diversity, Equity, and Inclusion with associate dean David Bindel, director Dr. LeeAnn Roberts, Cass D’Amato assistant director, as well as a number of students working on them with projects. The Department’s DEI committee has been actively collaborating with the office. Dr. LeeAnn Roberts attended a couple of the committee meetings to inform us about her office’s activities, and discuss how to best collaborate. One general role that Dr. Roberts has been taking on is to help to connect people to central reporting resources for bias and discrimination reporting. The CS department and Cornell Bowers CIS is funding a large cohort of students attending the ACM Richard Tapia and the Grace Hopper Celebration of Women in Computing conferences each year. This year, a total of 37 undergraduate and graduate students are going to the Tapia Celebration of Diversity in Computing Conference in Washington, DC. Additionally, 48 undergraduate and graduate students will attend the Grace Hopper Celebration of Women in Computing in Orlando, FL in partnership with Women in Computing at Cornell (WICC). CS staff and faculty also attend both events. In 2021, TAPIA was a virtual conference. The lower costs gave us the opportunity to expand our presence, although participation was a lower-quality experience. Last year we had four faculty members (Haym Hirsh, Eva Tardos, David Bindel, Emma Pierson, and Robbert van Renesse), the Assistant Director of the MEng program Stephanie Meik, graduate assistant Jess Beebe, and 33 students registered for the conference. In 2022, we have faculty David Bindel, Robbert van Renesse, and Hakim Weatherspoon attending, as well as Stephanie Meik and Renee Milligan, and CIS is registering 33 undergraduate students, and all 4 PhD/MS students who expressed interest in participating. The Grace Hopper conference was also online last year and is hybrid this year. Last year we were represented by Eva Tardos, David Bindel, Haym Hirsh, and Robbert van Renesse, 41 undergraduates sponsored in collaboration with CIS/IS, and by Becky Stewart, and Stephanie Meik. This year, we have faculty Rachit Agarwal, and Anne Bracy attending, as well as Stephanie Meik, Rebecca Stewart, and Renee Milligan, and CIS is registering 32 undergraduates for in person participation, plus 4 online. In addition, WICC is sponsoring 5 additional undergraduates for in person attendance. CS is sponsoring additional 2 PhD/MS students who expressed interest in participating. The department agreed on a statement of values of inclusion, which is now posted on the department web page. This statement is in addition to the Cornell University Core Values. Activities supporting Undergraduate students To support students as they become interested in joining the CS major, and throughout their career in the department, we have a number of programs that support our efforts to increase diversity, equity, and inclusivity. CS More In the summer of 2020 we started the CSMore program, a program for rising sophomores from underrepresented or disadvantaged backgrounds who are interested in becoming computer science majors. Through the close analysis of data, we have seen clear evidence that the Sophomore year of the Computer Science curriculum is crucial, filled as it is with a number of challenging classes. These classes inadvertently often become gatekeepers to joining the major. To directly address this unfortunate outcome, the CSMore program was created to help level the playing field and aid the formation of a social and academic network among this group of students who meet in the summer cohort. When the students begin Sophomore year—after participating in CSMore—they not only have an expanded repertoire of CS skills to help them succeed in these difficult classes, but also a group of friends, many from similar backgrounds, whom they can draw on for peer support. The CSMore program is now in its 3rd year, and is now coordinated by the CIS Diversity office. This year for the first time, we had over 70 applications for the 30 spots in the program. So far. 12 different faculty have been part of the program with most faculty doing two summers. The CIS DEI office also added a CSMore Works component for mentoring and supporting students who complete the program through the next year. Pre-Collegiate Summer Scholars Program There are an increasingly large number of prospective computer science majors in Cornell's Pre-Collegiate Summer Scholars Program (PSSP) both in the Engineering college (COE) as well as the College of Arts and Sciences (CAS) in part due to support from the CIS DEI office. A number of the PSSP students take the introduction to computing course (CS 1110) during their pre-freshman summer. For the last two summers the Computer Science department offered a dedicated TA to support the PSSP students who take the course in the summer, thereby lending even more informed support to the students as they navigate new terrain socially and intellectually. The two last summers we also organized an ice-cream social to facilitate the meeting of CS interested PSSP students with the CSMore participants. Academic Excellence Workshops (AEW) AEWs are designed to be informal, supportive learning environments, in which students get to know their peers, work on practice problems, and feel comfortable to ask questions and discuss their understanding of the course material. The typical structure of an AEW workshop includes: fun icebreakers and grouping techniques; full-group time, in which facilitators check for understanding and engage students through interactive recall activities to refresh current course topics; small-group problem-solving using worksheets created by the facilitators. The bulk of the workshop time is dedicated to small-group work. Historically such AEW have been only offered for the freshmen CS courses: 1110, 1112, and 2110. The offering of Academic Excellence Workshops have been extended to also offer support of the key sophomore Computer Science courses: 2800, 3110, 3410. The 3110 and 3410 sections use existing course materials, while for 2800 during the summer of 2021 Matt Eichhorn (CAM graduate student) with the help of Anke van Zuylen and Eva Tardos developed materials that help support the course. The CS courses with matching AEWs collaborate closely with the coordinator to make sure the materials are up to date and students get the best outcome. Each course has a coordinating TA (from CS course staff) attending the coordination meetings and helping with sections. The CSMore Works participants are encouraged to take these workshops as a group, and work on the courses together. Student groups There are two very active student groups devoted to diversity: Underrepresented Minorities in Computing (URMC) and Women in Computing (WICC). The URMC leadership is doing an excellent job supporting their membership, with over 150 active members, 26 in the e-board, they are currently co-advised by Eva and LeeAnn Roberts, and once back from sabbatical Hakim Wheterspoon will join the advisory committee. WICC leadership is also doing an excellent job supporting their membership, with over 215 active members and 36 in the e-board. WICC organizes regular events, including a “Lunch Bunch” networking event with CIS faculty for a group of freshmen interested in computing. They also reach out and organize events that aim to support the broader computing community, including a partner finding social (financed by the department) at the start of each semester to help students identify possible project partners in their CS courses. The URMC and WICC leadership has monthly meetings with their advisors. TA training The CS department developed a TA training that is required for each TA or consultant in any Computer Science course. The training includes discussion of implicit bias in addition to topics like office hours, grading practices, helping students in distress, as well as setting boundaries. All Computer Science faculty participate in offering this training. Curriculum development We are increasingly aware of the role that computing plays in perpetuating and amplifying societal inequity. We recommend that such information be thoughtfully integrated across the entire CS curriculum, such as we see taking place in existing courses like “Foundations of AI” (CS 4700), where these topics are brought to light over the course of the semester, as well as integrated into new courses, such as “Ethics and Computing”. The course focusing on such topics, CS 1340 (entitled: Choices and Consequences in Computing) was offered in the spring 2022 for the second time by Jon Kleinberg and Karen Levy . The course has an enrollment of over 700 students. Activities supporting MEng student The vast majority of students in the CS MEng program fall into two largely distinct populations: (1) students who were Cornell CS undergraduates, most typically enrolled through the “early admit” program that allows students to add the MEng to the conclusion of their undergraduate studies; and (2) students who are new to Cornell, most typically arriving from other countries. Many of the initiatives discussed in the undergraduate section of this document also pertain to the segment of the MEng community that were Cornell undergraduates. MEng TAs are also required to attend the TA training mentioned above. Diversity fellowships In the academic year 2021-22 CS, began offering MEng diversity fellowships to grow the diversity of our students and applicant pool. In the academic year 2022-23 we will have our first cohort of 3 M.Eng. diversity scholarship recipients (1 deferred from AY 2021-22). Activities supporting MS/PhD students Admissions Beginning in 2018, there has been a concerted effort in the field of Computer Science to improve PhD student recruitment and admissions to improve the diversity of the applicant pool, in turn, of the student body, and ultimately, the profession. This initiative owes its initial successes to the creativity and effort of a number of Cornell students, faculty, and staff. A summary of the measures taken to diversify Cornell CS PhD admissions was written by David Bindel after he chaired the CS Graduate Admissions Committee in 2018. We are continuing to reform the graduate admissions process to further improve outcomes with respect to diversity. In 2020, we formalized the role of “faculty advocates,” that is, professors who “advocate” for admitting a student and indicate a willingness to try working with them. With this approach, our intent is to improve the process whereby admitted students find advisors upon matriculating at Cornell (see further discussion of faculty advocates below under the “advising and mentoring” subtopic). During the PhD admission process, we assigned a designated faculty member to be in charge of considering applicants who would diversify our class, such as Black, Latinx students. Between the increased effort to recruit applicants, and the special attention to watch over these applications, the result is promising, over 17% of the admitted students in the 2022 academic year were from underrepresented backgrounds (as opposed to 8-10% in the best of the previous years). We have also created a diversity fellowship with the support of the Hopper-Dean foundation (awarded 4 in 2022). In 2022, we admitted 35 students to the PhD program, of which 7 were women, and 6 diversity students. In 2021, at the recommendation of the Graduate School’s Office of Inclusion and Student Engagement, we will add a new, required prompt to the CS graduate application: Please describe how your personal background and experiences influenced your decision to pursue a graduate degree. Additionally, provide insight on your potential to contribute to a community of inclusion, belonging, and respect where scholars representing diverse backgrounds, perspectives, abilities, and experiences can learn and innovate productively and positively together. Finally, while all of the aforementioned reforms pertain to the PhD admission process, we also working to improve diversity in the MS program in Computer Science. 14% of the admitted students in the 2022 academic year were from underrepresented backgrounds. In 2022, we admitted 14 students to the PhD program, of which 3 were women, and 2 diversity students. This move is important both for the diversity of the MS program itself and because the program could serve as a stepping stone to our PhD programs, especially for historically marginalized students who show promise (and have great teaching experience as TAs) but lack the research preparation to get accepted directly to PhD programs. Since the MS program recruits almost exclusively from Cornell undergraduates, the first and most important step is to advertise the MS program to historically marginalized students at Cornell, identify qualified individuals (e.g., those who have worked as undergrad TAs for CS courses but who may have self-selected as prospective graduate candidates), and move to directly solicit applications from them. Increasing the Applicant Pool We have run special sessions to talk to prospective students and help them apply to our programs multiple venues at Tapia (9/22), Grace Hopper (9/22), NAM Mathfest (10/21), the Cornell STEM Preview Event (11/21), the Karsh STEM Scholars meeting (11/21), the LEAP Graduate School Session (11/21), and the Morehouse McNair Scholars meeting (2/22). In the fall 2020 and 2021 our PhD students run an online program to help with application essays for prospective students from underrepresented backgrounds. Commenting on and helping with as many as 90 applications each year. We will be running the same program for Fall 2022. In another recruiting initiative to increasing diversity of the candidate pool, we have also run for several years now the Sonic one week summer workshops (this is now run by CIS with support of CS faculty members, in 2022 Tapo Bhattacharjee). It targets students who are pursuing an undergraduate or master’s degree in the computer science or engineering and though SoNIC is open to all students, we encourage the participation of students who identify as underrepresented in the science, technology, engineering, and mathematics field. Advising and Mentoring Over the past two years"
