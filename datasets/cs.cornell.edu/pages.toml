title = "Requirements FAQ | Department of Computer Science"
description = 'FAQ Q: Can I take non-CS courses for M.Eng. credit? Yes, provided they are both "technical" and "advanced". More information can be found along with a list of pre-approved non-CS courses. Note that at least 15 credits must be CS courses; not counting any project courses, seminars or courses not taken for a letter grade. Q: What is the maximum number of credits I can take in a'
full_description = '''FAQ Q: Can I take non-CS courses for M.Eng. credit? Yes, provided they are both "technical" and "advanced". More information can be found along with a list of pre-approved non-CS courses. Note that at least 15 credits must be CS courses; not counting any project courses, seminars or courses not taken for a letter grade. Q: What is the maximum number of credits I can take in a semester? M.Eng students are allowed to enroll in no more than 20 credits in a semester. Q: Can I apply credits I earned at Cornell before I started my M.Eng. degree? Yes, you can take up to 9 credits of MEng courses at Cornell to count toward your M.Eng. degree. These course credits cannot be counted for any of your undergraduate requirements. There is a petition form you need to fill out to "transfer" these credits towards your CS MEng program. Q: Am I allowed to extend for an additional semester? Currently, we are only permitted to admit students into a two-semester program. We understand that some students wish to stay for an additional semester to establish a greater breadth and depth of knowledge, however, we cannot approve an extension at this time. AboutDiversity, Equity, and InclusionValues of Inclusion 2020 Antiracism Task Force 2022 DEI Report News Research News Department Life AwardsListed by Recipient Listed by Category Oral History of Cornell CS CS 40th Anniversary Booklet ABC Book for Computer Science at Cornell by David Gries BooksBooks by Author Books Chronologically Department TimelineThe 60's The 70's The 80's The 90's The 00's The 2010's The 2020's Job PostingsFaculty Positions: Ithaca Faculty Positions: New York City Lecturer Position: Ithaca Post-doc Position: Ithaca Staff/Technical Positions Ugrad Course Staff Ithaca Info Internal info EventsCalendar Graduation Information Cornell Learning Machines Seminar Student Colloquium BOOM Spring 2025 Colloquium Conway-Walker Lecture Series Salton 2024 Lecture Series Seminars / LecturesSpring 2025 Artificial I