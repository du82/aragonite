description = "Computer Science Graduate Recognition Ceremony and Reception Saturday, May 24, 2025 Computer Science undergraduate, professional, and graduate students graduating in December 2024, May 2025, or August 2025 and their loved ones are cordially invited to our Computer Science Graduate Recognition Ceremony and reception. The recognition ceremony is where graduates traverse the"
full_description = ".nonphd { margin-bottom: 10px; } .person-listing h6 { font-size: 16px; } h5 {margin-top: 35px; margin-bottom: 20px;} Computer Science Graduate Recognition Ceremony and Reception Saturday, May 24, 2025 Computer Science undergraduate, professional, and graduate students graduating in December 2024, May 2025, or August 2025 and their loved ones are cordially invited to our Computer Science Graduate Recognition Ceremony and reception. The recognition ceremony is where graduates traverse the stage and are individually recognized by name. Key Details Date: Saturday, May 24, 2025 Timing: Ceremony: 4:30 - 6:45 p.m. EDT Reception: 6:45 - 7:45 p.m. EDT Location: Barton Hall Recognized Degree Programs: Computer Science Ph.D., M.S., M.Eng, B.A., and B.S. students graduating in December 2024, May 2025, or August 2025. Ticketing: No ticketing is required. Graduates may invite unlimited guests. Attire: Graduates wear regalia (cap and gown), which is ordered through the Office of University Commencement Events. Livestream Option: The ceremony will be broadcast live online for guests unable to travel from afar. The link will be available on this page two to three days prior to the event. Parking and Road Closures: Review the May Commencement Weekend parking & directions information page for details about lot and road closures, plus free park-n-ride bus locations. Use the Cornell Campus Map to find your way on campus. Accessibility Planning: If you have guests with mobility challenges, limited stamina, and/or who might need other accommodations, please note that you will not be able to drop them off at Barton Hall as the roads around Barton will be closed on Saturday for the university ceremonies. To apply for special parking permits and learn about other accessibility resources, please review the University’s Commencement accessibility planning information. Please note that both our department ceremony and the Saturday university ceremony will include American Sign Language interpreters. Ceremony Photography: We have hired professional photographers to take an individual portrait of each graduate, as well as a photo as they traverse the stage. These photos—along with candid shots—will be shared, free of charge, with graduates after the event. As such, we ask that guests please refrain from standing in the aisles to take pictures so that we can ensure safety and visibility for all attendees. Thank you. University Commencement Ceremony Information Please visit the university’s May 2025 Commencement Information website for information about the Saturday University Commencement Ceremony, as well as logistical details for the entire weekend, including parking, accessibility planning, lodging, directions, and more. ••• AboutDiversity, Equity, and InclusionValues of Inclusion 2020 Antiracism Task Force 2022 DEI Report News Research News Department Life AwardsListed by Recipient Listed by Category Oral History of Cornell CS CS 40th Anniversary Booklet ABC Book for Computer Science at Cornell by David Gries BooksBooks by Author Books Chronologically Department TimelineThe 60's The 70's The 80's The 90's The 00's The 2010's The 2020's Job PostingsFaculty Positions: Ithaca Faculty Positions: New York City Lecturer Position: Ithaca Post-doc Position: Ithaca Staff/Technical Positions Ugrad Course Staff Ithaca Info Internal info EventsCalendar Graduation Information Cornell Learning Machines Seminar Student Colloquium BOOM Spring 2025 Colloquium Conway-Walker Lecture Series Salton 2024 Lecture Series Seminars / LecturesSpring 2025 Artificial Intelligence Seminar Spring 2025 Robotics Seminar Spring 2025 Systems Research Seminar Spring 2025 Theory Seminar Big Red Hacks Cornell University / Cornell Tech - High School Programming Workshop and Contest 2025 Game Design Initiative CSMore: The Rising Sophomore Summer Program in Computer Science Explore CS Research ACSU Research Night Cornell Junior Theorists' Workshop 2024Cornell Junior Theorist