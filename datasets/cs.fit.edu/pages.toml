["https://cs.fit.edu/Portal/modules/submitServer"]
title = "Submit Server - Florida Tech Department of Computer Sciences"
description = "Welcome to the Florida Institute of Technology. We know you will enjoy exploring all our university has to offer: quality\tprograms, excellent faculty, a focus on effective teaching, hands on research conducted by undergraduates and graduate students, and a championship tradition in athletics."
full_description = 'Before submitting you must be registered with the server. All registrations are deleted before each fall semester; thus, fall registrations are still valid for the following Spring. To submit a file, enter the class and assignment code given to you by your instructor (class and assignment codes in a comment header will override values entered below) as well as your control code. Click the Browse button to select a file for upload. To submit multiple files, use the Add Another File button to create another file upload box to select another file with. To register with the submit server, enter your name and email address below. A Control Code will be emailed to the address given. To recover a lost Control Code, enter your first and last name below. Your code will be emailed to the email address that registered it. Q: How do I find out if my submission was successful? Q: How can I find out which files I have submitted for the assignment? A: You can view all submissions for an assignment in a class here. Navigate to the directory for your course, then click on the assignment you wish to check. Look for your name in the list. To see all submissions rather than just the latest, click on the <assignmentname>-all.html file. If your name and files are not listed your submission was *not* successful. The tags "course" and "project" direct the file to the proper location. Each of these keywords must appear on a line of its own toward the beginning of the file. White space is ignored, case is ignored, as is everything on the line starting with the comma. The first example above is appropriate as the header for a Java program, but since the leading characters are ignored, a header can be constructed for most any line-oriented file format.'
year_published = 2025
clearnet = "https://cs.fit.edu/Portal/modules/submitServer"
