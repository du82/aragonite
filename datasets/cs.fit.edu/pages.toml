full_description = "Some courses offered by the department are not available every semester. The following document details which courses will be offered each semester through Summer 2013. Fall 2011-Summer 2013(pdf) (xls) The Fast Track Master's Degree Program allows students to take on graduate course work while still an undergraduate, allowing you to finish a masters degree in less time than a traditional program. This form is only appropriate for College of Engineering undergraduate honors students who are applying for the program; who have completed at least 95 credit hours toward their undergraduate degree; and who at the time of application have a minimum cumulative GPA of 3.4, based on more than 35 credits earned at Florida Tech. A Minor degree in Computer Science requires 21 credits; 15 credits of required coursework plus 6 credits of electives. Please refer to the CS minor flowchart for more details. CS Minor Flow Chart: (doc) (pdf) These forms are the class requirements for the selected majors based upon your year of entry into the program. The order that classes are taken can be altered. Computer Science Road to Graduation (doc)This link may be out of date.Click here for more information(pdf)This link may be out of date.Click here for more information Software Engineering Road to Graduation (doc)This link may be out of date.Click here for more information(pdf)This link may be out of date.Click here for more information Information Assurance & Cybersecurity Road to Graduation (doc)This link may be out of date.Click here for more information(pdf)This link may be out of date.Click here for more information Florida Tech maintains a listing of its graduate policies, available through the Office of Graduate Programs. Graduate Policy This is a list of the classes you may take if you have a TOEFL hold on your account. Approved Courses for Students with TOEFL Hold (pdf)This link may be out of date.Click here for more information If you enroll in CSE5501 then at the end of your internship you must submit a written report about your job and duties. Your employer must also submit an evaluation pertaining to your performance. Final Report Guidelines Employer Final Evaluation"
