full_description = "The CS Page Tracking System is a tool that provides visitors with information about how up-to-date a given page or document is. Many pages on this site will contain a few small icons that help relay this information. Documents/Pages are automatically tracked and the appropriate parties notified when a document needs to be reviewed. Some of the types of information displayed and their meanings are listed below: Last Reviewed - represents the last time the document was reviewed and confirmed to be up-to-date by the document owner Expiration Date - is the date that the document expires, after which it should not be considered current Document Owner - The responsible party(s). If the document is outdated, this is who you should ask to for an updated copy. These two icons will be found at the top right of the page, and provide information about the content on the current page Last reviewed: Mar 5th, 2025(11 hours ago)Expiration Date: Mar 9th, 2025 (4 days from now)Document owner: Bill SmithClick here for more informationClick here to update this page - the current page is up to date Last reviewed: Mar 5th, 2025.Out-of-Date - Please contact Bill SmithClick here for more informationClick here to update this page - the current page is expired These icons will be shown inline with text/links and provide information about the link they are near. Last reviewed: Mar 5th, 2025(11 hours ago)Expiration Date: Mar 9th, 2025 (4 days from now)Document owner: John DoeClick here for more information - an up-to-date document This document has expired.Last reviewed: Mar 5th, 2025(11 hours ago)Document owner: John DoeClick here for more information - an expired document Link Last reviewed: Mar 5th, 2025(11 hours ago)Click here for more information - an up-to-date link This link may be out of date.Click here for more information - an expired link Additionally, at the bottom of pages that are monitored, you will find a block of text containing when the page was last updated, when it expires (or if it has expired) and the owner(s) of the page. See the example below:"
