["https://cs.gmu.edu/events/detail/640"]
title = """
Understanding and Improving Reasoning in Large Language Models |         George Mason Department of Computer Science"""
full_description = "Understanding and Improving Reasoning in Large Language Models Events / CS Seminar When: Thursday, October 24, 2024 from 11:00 AM to 12:00 PM Speakers: Xiang Yue Location: Nguyen Engineering Bldg., Room 4801 Export to iCal Abstract: Large language models (LLMs) have made significant strides, yet challenges remain in advancing their reasoning capabilities, particularly in expert-level and multimodal contexts. In this talk, I will present our research on evaluating and improving LLM reasoning. First, I will introduce the MMMU and MMMU-Pro benchmarks, designed to rigorously evaluate multimodal reasoning across a wide range of disciplines and subjects. These benchmarks expose key limitations in current models’ reasoning abilities and highlight critical paths for improvement. Next, I will discuss the MAmmoTH series, a set of methods aimed at enhancing reasoning within LLMs. MAmmoTH-1 focuses on Hybrid of Thoughts, combining programming and natural language approaches to teach models more flexible reasoning. MAmmoTH-2 scales up high-quality synthetic reasoning data from the web to enhance the depth and breadth of reasoning abilities. Finally, I will briefly talk about our future efforts for building and measuring the next-generation intelligent AI systems. Brief bio: Xiang Yue (https://xiangyue9607.github.io/index.html) is a Postdoctoral Fellow at Carnegie Mellon University. He received his PhD from The Ohio State University in 2023. His research focuses on understanding and enhancing the reasoning capabilities of large language models. He has been awarded a postdoctoral fellowship from the Carnegie Bosch Institute, a Generative AI rising star from University of Massachusetts Amherst, a Best Paper Finalist at CVPR 2024, a Best Paper Honorable Mention at ACL 2023, a Best Paper Award at IEEE BIBM 2021, and two prestigious research awards from The Ohio State University. Xiang's recent work on developing the MMMU evaluation benchmark has garnered attention beyond academia, being featured in the releases of OpenAI o1/GPT-4o, Google Gemini, and Anthropic Claude. Posted 3 months, 1 week ago Categories AI Tea Seminar (6) Booz Allen Hamilton Distinguished Lecture Series (8) CEC Seminar (4) Colloquium (1) CS Seminar (222) Department of Computer Science (43) Distinguished Lecture Series (55) GRAND Seminar (24) Mason Humanity-Centered Design Seminar (1) Oral Defense of Doctoral Dissertation (88) Oral Defense of Masters Thesis (5) PhD CS Oral Comprehensive Exam (118) SANG Seminar (11) SWE Seminar (9) Volgenau School of Engineering (6)"
