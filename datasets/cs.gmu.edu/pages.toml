["http://cs.gmu.edu/~ashehu"]
title = "Research in the Shehu Lab | Welcome  to the Shehu Laboratory"
full_description = "We advance foundational and use-inspired research in Artificial Intelligence. What drives us is a deep passion to push the barriers of our understanding of the physical and biological world.Real-world, complex, wicked problems prompt us to design novel AI and ML frameworks and algorithms. At a ten-thousand mile-up view, what we do is knowledge-grounded AI for science, connecting theory, methodology, and scientific discovery. Highlights of our recent work include optimization for deep learning, deep generative (latent variable) models in generative AI for modeling small and large molecules, and advancing large language models for bio & health informatics. Generative AI for modeling complex dynamic systems is a main thrust of research in our lab. This NotebookLM-generated podcast that summarizes our work on knowledge-grounded foundation models for protein prediction tasks is a fun if a bit shallow way to enter this thrust of our research. Here is one that summarizes our work on GenAI work on small molecule generation with property control. Our lab was one of the first to advance GenAI for molecular biology and for an important open problem, GenAI for Protein Structural Plasticity. We have done a lot of work over the past two decades to advance modeling structural plasticity and dynamics, and our core focus before deep learning was on advancing optimization algorithms for navigating and mapping protein structure spaces with complex energy landscapes. Some of our recent work leverages our knowledge on what makes powerful optimization algorithms for complex landscapes but now for loss landscapes in deep learning. Our research interests vary and span a broad spectrum, from AI for civil engineering to AI for AI policy. The podcasts can be fun, but the papers contain more substantive information. Fardina becomes Dr. Alam Irina Defends Ph.D. Parastoo becomes Dr. Kamranfar Taseef becomes Dr. Rahman All Masked-Up Lab Meeting Kevin defends Ph.D. COS and VSE 