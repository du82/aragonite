["https://cs.gmu.edu/current-students/undergraduates/undergraduate-research"]
title = """
Undergraduate Research Opportunities |         George Mason Department of Computer Science"""
description = "There are several opportunities for undergraduate students to be involved in Computer Science research. Here are some pointers that can get you started."
full_description = '''Undergraduate Research Opportunities Undergraduates Getting started in CS at GMU BS in Computer Science BS in Applied Computer Science CS Honors Program Accelerated Master's Programs Minor in Computer Science Minor in Software Engineering Advising Course Prerequisite Chains Undergraduate Research Opportunities University-wide Sponsorship Opportunities Faculty Mentors with Undergraduate Research Projects Educational Data Mining REU Undergraduate Certificate There are several opportunities for undergraduate students to be involved in Computer Science research. Here are some pointers that can get you started. Why do research ? A focused research project provides you the opportunity to pursue your interests, sharpen problem-solving skills, learn something new and create something tangible and useful. Some of you may have had work experiences but a research process is different. It involves thinking critically, brain-storming different solutions, evaluating ideas, presenting results and sharing the knowledge with a wider audience. Working on a faculty-mentored research project allows you to learn the research process and an experienced researcher helps steer your ideas and shape your final product. Final products are software, experiments, research papers and presentations. XKCD shows a common misconception between research in academic setting versus development in the industry setting :) "Academia Vs Business", http://xkcd.com/664/ Are there special computer science classes that are research project focused ? Yes! There are three highly recommended classes: CS 491 Industry-Sponsored Senior Design Project CS 390 Research and Project Design Principles CS 490 Design Exhibition Students in the BS CS program can use CS 390 as a CS-related elective and CS 490 as a CS-senior elective. CS 491 is a two-semester sequence that starts every Fall. Both semesters are required and contribute 3 credits to CS-senior elective requirements and 3 credits to CS-related elective requirements.'''
