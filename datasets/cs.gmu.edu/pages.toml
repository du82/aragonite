full_description = "Tracking Degree Progress Undergraduates Getting started in CS at GMU BS in Computer Science BS in Applied Computer Science CS Honors Program Accelerated Master's Programs Minor in Computer Science Minor in Software Engineering Advising Your Faculty Advisor Your Academic Advisors General FAQs Mason Core FAQs Tracking Degree Progress Applying for Graduation Course Prerequisite Chains Undergraduate Research Opportunities Undergraduate Certificate How do I keep track of my degree progress? The GMU Catalog lists the official requirements for each degree. Print out your Degree Evaluation from PatriotWeb each semester. It can be used as a guide to determine any courses that you still need to take to complete your degree requirements. The PatiotWeb degree evaluation does not guarantee that you meet all degree requirements. For example, it may not check for the extra humanities course that is required for the BS CS major. The following degree planners should be used for planning purposes only. The GMU catalog is the official reference for all degree requirements. Degree Planners (22-23 Catalog) Computer Science Degree Planners (20-21 Catalog) Computer Science Applied Computer Science Game Design Concentration Applied Computer Science Software Engineering Concentration Degree Planners (19-20 Catalog) Computer Science Applied Computer Science Game Design Concentration Applied Computer Science Software Engineering Concentration Degree Planners (18-19 Catalog) Computer Science Applied Computer Science Game Design Concentration Applied Computer Science Software Engineering Concentration Degree Planners (17-18 Catalog) Computer Science Applied Computer Science Game Design Concentration Applied Computer Science Software Engineering Concentration Degree Planner (16-17 Catalog) Computer Science Applied Computer Science Bioinformatics Concentration Applied Computer Science Game Design Concentration Applied Computer Science Geography Concentration Applied Computer S