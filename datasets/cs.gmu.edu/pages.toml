full_description = "Undergraduate Programs Undergraduate Programs Why Choose CS@Mason BS in Computer Science BS in Applied Computer Science FAQs Admissions Visiting the Department Financial Aid and Scholarships Accelerated Master's Programs Minors Undergraduate Certificate Welcome! Thank you for your interest in our undergraduate programs. The Computer Science Department at Mason ranks among the Top 50 Computer Science Departments in the US. The department offers two Bachelor of Science degrees: the BS in Computer Science and the inter-disciplinary BS in Applied Computer Science. Students pursing the BS in Applied Computer Science degree will select one of four concentration: Bioinformatics, Computer Game Design, Geoinformatics, Software Engineering, Business Management, Business Marketing, or Technology Policy. The Department also offers two minors: the Minor in Computer Science and the Minor in Software Engineering for students pursuing other undergraduate degree programs, as well as an Undergraduate Certificate in Computer Science for students who possess an undergraduate degree in a technical (science or engineering) field but lack a formal credential in the computer science field. Check out the short video below for an overview of our undergraduate programs and to hear what faculty, students and alumni have to say about CS@Mason"
