full_description = "News Using AI to uncover Human Smuggling Networks 3 weeks, 2 days ago / Categories: News, Research Highlights Professor Carlotta Domeniconi in the Department of Computer Science at George Mason University is using artificial intelligence (AI) to combat human smuggling networks. She is the principal investigator (PI) on a groundbreaking project aimed at understanding and modeling human smuggling networks. GMU CS Students Win First Place in Cyber Warfare Challenge 2 months, 2 weeks ago / Categories: Announcements, News Congratulations to Sam Best (CS BS) and Tommy Chin (CS PhD) and teammate Noah Korzak (CYSE BS/BAM) for winning first place among 11 teams from universities across the nation in the Cyber Warfare Challenge hosted by the Naval Surface Warfare Center Dahlgren Division (NSWCDD). The team earned a $60,000 prize for designing a powerful toolkit to analyze network risks and resilience against a number of Advanced Persistent Threat attacks. Their work, praised by the NSWCDD Technical Director Dale Sisson Jr., P.E., SES, and Commanding Officer Joe Oravec for its potential to shape cybersecurity’s future, highlights the depth of the security expertise at George Mason. GMU Robotics Faculty and Students Shine at IROS'24 4 months ago / Categories: Research Highlights GMU robotics faculty, postdoc, and students attend the 2024 IEEE/RSJ International Conference on Intelligent Robots and Systems, one of the flagship robotics conferences, in Abu Dhabi, UAE. Computer Science faculty Gregory J. Stein and Xuesu Xiao, along with Electrical and Computer Engineering faculty Xuan Wang, present nine papers at the conference and showcase the recent research progress made by Mason roboticists. Prof. Alex Brodsky is a keynote speaker at the 36th IEEE International Conference on Tools with Artificial intelligence (ICTAI-2024) 4 months ago / Categories: Announcements, News Celebrating Excellence: Faculty Achievements in Spring'24 9 months, 3 weeks ago / Categorie