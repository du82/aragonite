full_description = "Aditya Johri Aditya Johri Professor, Dept. IST Office Nguyen Engineering Room 4509 Phone 703-993-5397 Email johri@gmu.edu Web mason.gmu.edu/~johri/ Biography PhD, Learning Sciences and Technology Design, Stanford University Dr. Johri studies how the use of technology shapes learning in both formal and informal spaces, including the workplace, online communities, and extra-curricular activities. He publishes broadly in engineering and computing education, educational technology, and computer-supported collaborative work and learning. His recent research is focused on ethics education with an emphasis on AI, algorithms, and data ethics."
