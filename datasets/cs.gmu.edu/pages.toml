["https://cs.gmu.edu/current-students/doctoral-students/milestones-and-deadlines"]
title = """
Milestones and Deadlines |         George Mason Department of Computer Science"""
description = "The students are expected to make steady progress in the program by completing the required course work and research-related milestones within the specified deadlines. Students who fail to meet the deadlines will be dismissed from the program unless there are extenuating circumstances approved by the department."
full_description = "Milestones and Deadlines Doctoral Students Advising Degree Requirements Breadth Requirement Advisor Selection Comprehensive Exam Milestones and Deadlines Annual Evaluation Dissertation Committee Selection Dissertation Proposal Dissertation FAQs Useful Links The students are expected to make steady progress in the program by completing the required course work and research-related milestones within the specified deadlines. Students who fail to meet the deadlines will be dismissed from the program unless there are extenuating circumstances approved by the department. Successful completion of CS 700 Research Methodology in Computer Science: Within the first two semesters in the program Successful completion of CS 701 Research Experience in Computer Science: Within the first 18 credits in the program Determining the research advisor: Within the first 24 credits in the program (cannot be postponed beyond three years) Students must submit a Research Advisor Declaration Form to the CS office for declaring their research advisor Satisfy the breadth requirement: Within the first 24 credits in the program (cannot be postponed beyond three years) Students must submit a Breadth Requirement form to the CS office upon completing the requirements for the breadth requirement Successful completion of both instances of CS 800 Computer Science Colloquium: Within the first 36 credits in the program (cannot be postponed beyond five years) Taking the comprehensive exam: Within the first 36 credits in the program (cannot be postponed beyond five years). The student must pass the exam in at most two attempts Students must submit a Comprehensive Exam form at least four months prior to the oral exam date Advancing to candidacy and graduation: Time limits are determined by the general university rules that apply to the PhD Programs."
year_published = 2025
