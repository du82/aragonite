["https://cs.gmu.edu/current-students/undergraduates/advising/your-academic-advisors"]
title = """
Your Academic Advisors |         George Mason Department of Computer Science"""
description = "What are academic advisors?The undergraduate academic advisors are specially trained to help our students with academic policy, process, and other assistance. All undergraduate students in the Computer Science department can seek assistance with any of our undergraduate academic advisors. They are all in effect your advisors, from day one."
full_description = "Your Academic Advisors Undergraduates Getting started in CS at GMU BS in Computer Science BS in Applied Computer Science CS Honors Program Accelerated Master's Programs Minor in Computer Science Minor in Software Engineering Advising Your Faculty Advisor Your Academic Advisors General FAQs Mason Core FAQs Tracking Degree Progress Applying for Graduation Course Prerequisite Chains Undergraduate Research Opportunities Undergraduate Certificate What are academic advisors? The undergraduate academic advisors are specially trained to help our students with academic policy, process, and other assistance. All undergraduate students in the Computer Science department can seek assistance with any of our undergraduate academic advisors. They are all in effect your advisors, from day one. You can schedule an appointment with an academic advisor on the Advising tab at the top of the page. What can my academic advisors do? Academic advisors are an integral part of your education. They’ll support you during your academic journey and help you make the most of your Mason experience. The advisors can help students plan courses each semester to stay on track for graduation. They can answer many questions and guide students through many processes, including ones that require paperwork such as adding concentrations, requesting third attempts, requesting to Study Elsewhere, among many other things. Meet the Advisors Vernell - Vernell Wilks joined the School of Engineering as an Academic Advisor in July of 2022. Prior to joining George Mason, she wore many hats including Teacher and Mentor Coordinator at a Prince William County Private School. From George Mason University, she earned her M. Ed in Education, a certificate in Technical Writing and she is currently working towards a certificate in Instructional Design. She received her bachelor’s degree in English from Binghamton University. FUN FACT: Vernell has a twin brother named “Burnell” who stands 6’6. Linda joined the Computer Science advising team in 2018. Her various higher ed stints include 4-VA, ODU, NVCC and an online education start-up. Linda earned an MA in Counselor Education from Virginia Tech and a BA in Economics and Political Science from Mary Washington College. She is a left-handed vegan that loves a good book and a cup of tea. Kristi – Kristi has been with the CS Department at Mason since November 2022. Previously she worked as a College Advisor at the high school level for seven years, as well as an Admissions Reader at the University of California Irvine. She has a Master's Degree in Guidance Counseling from Loyola Marymount University in Los Angeles CA and her Bachelor’s Degree in Sociology with a Concentration in Social Work from California State University San Bernardino. She is a Disney FANATIC and loves everything Mickey! She frequents Disneyworld even though she lives close to Disneyland. Her hobbies include 1,000-piece jigsaw puzzles, reading Danielle Steel books and spending time with her family. She hopes to one day earn her EdD in Counseling. Josh – Joshua has been with CS Department as an Academic Advisor since Fall 2019. Before joining George Mason, he was a School Counselor at a middle school in Florida for four years. He earned his Master’s in Counseling Education and a Specialist degree in K-12 Counseling from the University of Florida in 2016. He also earned a Bachelor’s in Sociology from the University of Florida as well. Joshua recently earned a Higher Education Administration certificate from George Mason University in Fall 2021. In his free time, he enjoys visiting DC, watching anime and attending comic cons."
