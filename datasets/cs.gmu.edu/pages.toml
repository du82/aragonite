["http://cs.gmu.edu/~duminda"]
title = "Welcome to Duminda Wijesekera's Home Page"
full_description = "E-mail: dwijesek@gmu.edu Telephone number: 703-993-1578/5030 Fax number: 703-993-1710 Office: Room 436, Research Hall or Room 5333, Engineering Building Mailing address: 4400 University Drive, MS 4A5, Fairfax, VA 22030, USA. Duminda Wijesekera is a Professor in the Computer Science Department at George Mason University and a Visiting Research Scientist at the National Institute for Standards and Technology. His main research area is information security and its applications. His current research projects span logical models of security policies and protocols, safety and security of wireless controlled trains, privacy and security of healthcare applications and large-scale financial crime. Prior to George Mason, he was with Honeywell�s Military Avionics and Space Systems divisions in providing real-time systems support for airborne and space-borne applications. He holds PhDs from Cornell University (Mathematics) and the University of Minnesota (Computer Science), and a BSc in Mathematics from the University of Colombo. Please consult the department webpage for teaching assignments and information."
