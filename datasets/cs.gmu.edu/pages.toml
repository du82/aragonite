["https://cs.gmu.edu/events/detail/632"]
title = """
AI-Assisted Automated Programming and Automated Program Repair |         George Mason Department of Computer Science"""
full_description = "AI-Assisted Automated Programming and Automated Program Repair Events / CS Seminar When: Thursday, June 13, 2024 from 11:00 AM to 12:00 PM Speakers: He Ye, postdoctoral researcher at Software and Societal Systems (S3D) at Carnegie Mellon University Location: ENGR 4201 Export to iCal Abstract: Software has become increasingly pervasive, and so have software bugs. Currently, software debugging remains labor-intensive and costly for software developers. In this talk, we will discuss our research in automated program repair, aiming to alleviate the burden on software developers in debugging and repairing software bugs. Specifically, we will focus on how this research is empowered by the recent advancements in generative AI, incorporating fault localization and test generation techniques, and highlighting the key challenges in project-specific knowledge learning, training networks and meaningfully evaluating effectiveness. Finally, we will introduce potential future opportunities in the AI-based software development process. We will also discuss future work to enhance the trustworthiness of AI for software engineering, as well as the creation of collaborative and executable behavioral specifications to guide AI4SE tasks. Bio: He Ye is a postdoctoral researcher at Software and Societal Systems (S3D) at Carnegie Mellon University. Her main research interest is in Software Engineering (SE), focusing on building automated tools to improve software developers productivity and software quality, to help developers predict, detect, localize, and fix software bugs automatically. Her research also involves the synergy between Machine Learning and Software Engineering. She obtained her Ph.D. from KTH Royal Institute of Technology in Sweden under supervision of Prof. Martin Monperrus and Prof. Benoit Baudry. She completed her B.Sc. in software engineering from Sichuan University in China. Posted 8 months, 2 weeks ago Categories AI Tea Seminar (6) Booz Allen Hamilton Distinguished Lecture Series (8) CEC Seminar (4) Colloquium (1) CS Seminar (222) Department of Computer Science (43) Distinguished Lecture Series (55) GRAND Seminar (24) Mason Humanity-Centered Design Seminar (1) Oral Defense of Doctoral Dissertation (88) Oral Defense of Masters Thesis (5) PhD CS Oral Comprehensive Exam (118) SANG Seminar (11) SWE Seminar (9) Volgenau School of Engineering (6)"
