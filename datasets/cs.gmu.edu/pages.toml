title = """
Master's and Graduate Certificate Advising |         George Mason Department of Computer Science"""
description = "MS and Graduate Certificate AdvisingThe Department of Computer Science has four Graduate Program Specialists available to provide advising for students in our MS and Graduate Certificate programs:"
full_description = "Master's and Graduate Certificate Advising Advising Undergraduate Advising Master's and Graduate Certificate Advising Doctoral Advising MS and Graduate Certificate Advising The Department of Computer Science has four Graduate Program Specialists available to provide advising for students in our MS and Graduate Certificate programs: Imekom Inyang Lauren Nyilas Beth Posocco Alyssa Tsukamoto CS Office Location: Engineering Building Suite #4300 on the fourth floor If you have simple questions or need quick answers, contact us here: Email: csgrad@gmu.edu Phone: (703) 993-1530 **NOTE: The following advising options are for MS students only. PhD CS students should email csphd@gmu.edu or book an appointment through the PhD bookings link for advising.** Virtual and In-Person Advising is available here: Book an Appointment Appointments are recommended and preferred! Otherwise, you can choose to take advantage of the walk-in advising hours noted below. Be sure to select the correct format for your appointment (in-person or virtual). In-person advising is held in the CS Office. Walk-In Advising is available Tuesday/Wednesday/Friday from 1PM to 4PM in the CS Office If you do not schedule an appointment, you are welcome to visit the office during the walk-in advising hours above. Please note that appointments take priority! You may need to wait until an advisor is free to meet with you. FERPA:Advising appointments are one-on-one meetings with an advisor. Other students, friends, or family are not permitted to participate in the meeting unless FERPA permission has been granted by the student and applied to their account prior to that day's meeting. We do not provide advising for the following programs. Please use the correct points of contact listed below: MS INFS (Fall 2022 or later): msinfs@gmu.edu MS CS Online Program Prospective Students: online2@gmu.edu or click here Current Students: Contact your assigned MS CS online advisor Mason INTO Program: intomason@gmu.edu"
