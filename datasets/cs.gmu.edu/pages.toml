["https://cs.gmu.edu/events/detail/633"]
title = """
Object-level Planning: Bridging Human Knowledge to Task and Motion Planning |         George Mason Department of Computer Science"""
full_description = "Object-level Planning: Bridging Human Knowledge to Task and Motion Planning Events / CS Seminar When: Friday, June 14, 2024 from 11:00 AM to 12:00 PM Speakers: David Paulius, postdoctoral researcher in the Intelligent Robot Lab at Brown University Location: ENGR 4201 Export to iCal Abstract: A fundamental obstacle to developing autonomous, goal-directed robots lies in grounding high-level knowledge (from various sources like language models, recipe books, and internet videos) in perception, action, and reasoning. Approaches like task and motion planning (TAMP) promise to reduce the complexity of robotic manipulation for complex tasks by integrating higher-level symbolic planning (task planning) with lower-level trajectory planning (motion planning). However, task-level representations must include a substantial amount of information expressing the robot's own constraints, mixing logical object-level requirements (e.g., a bottle must be open to be poured) with robot constraints (e.g., a robot's gripper must be empty before it can pick up an object). I propose an additional level of planning that naturally exists above the current TAMP pipeline which I call object-level planning (OLP). OLP exploits rich, object-level knowledge to bootstrap task-level planning by generating informative plan sketches. I will show how object-level plan sketches can initialize TAMP processes via bootstrapping, where PDDL domain and problem definitions are created for manipulation planning and execution. Bio: David Paulius (he/him) is a postdoctoral researcher in the Intelligent Robot Lab at Brown University, working jointly with Professors George Konidaris and Stefanie Tellex. Before working at Brown, he was a postdoctoral researcher at the Technical University of Munich, Germany. He received his PhD in Computer Science & Engineering from the University of South Florida, where he was advised by Professor Yu Sun and began his journey in robotics and AI. He received his BSc in Computer Science from the University of the Virgin Islands; St. Thomas, USVI. He was recognized as a Robotics: Science and Systems (RSS) Pioneer in 2022. David is interested in enabling robots to solve complex goal-directed tasks in human-centered environments by exploiting semantic knowledge representations to facilitate seamless planning and execution for long-term autonomy and generalization across robots, tasks, and domains. Posted 8 months, 2 weeks ago Categories AI Tea Seminar (6) Booz Allen Hamilton Distinguished Lecture Series (8) CEC Seminar (4) Colloquium (1) CS Seminar (222) Department of Computer Science (43) Distinguished Lecture Series (55) GRAND Seminar (24) Mason Humanity-Centered Design Seminar (1) Oral Defense of Doctoral Dissertation (88) Oral Defense of Masters Thesis (5) PhD CS Oral Comprehensive Exam (118) SANG Seminar (11) SWE Seminar (9) Volgenau School of Engineering (6)"
