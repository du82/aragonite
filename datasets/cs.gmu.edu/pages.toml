["http://cs.gmu.edu/media/uploads/ComputingNews/Spring2017/html/cs_faculty_win.html"]
title = "Computing News"
full_description = "Teaching is at the heart of what we do at George Mason University. The CS Department is fortunate to have some of the best instructional faculty in the Commonwealth, from tenured faculty researchers, dedicated assistant professors, and adjunct staff who provide a vital link from the classroom to careers in CS. Since 2000, seven faculty members have received the prestigious Teaching Excellence Award. This past year, two more of our outstanding teaching faculty members, Kinga Dobolyi and Mark Snyder were awarded the 2016 University Teaching Excellence Award from the Center for Teaching and Faculty Excellence. This University award “acknowledges the significant work that faculty members devote to course planning and preparation; curriculum development, and innovative teaching, advising, and undergraduate and graduate mentoring.” It is unusual for two faculty members in the same department to win the award in the same cycle. For both Kinga and Mark, this award puts an exclamation mark on their work. The process begins with an anonymous nomination. Each candidate puts together a portfolio of his or her work and completes a lengthy application. Kinga won the award with the additional distinction of the general education category. She says, “It’s gratifying to see all my hard work come together. This award is a better way to measure my teaching effectiveness.” Part of Kinga’s portfolio is her teaching, design, and mentoring work on a three-year Google Grant to find a way to teach more CS students and change how CS material is taught. She along with several Mason faculty members, with advice from co-winner Mark Snyder, developed SPARC. This is a self-paced flipped classroom model. Now in its second year, SPARC data is still coming in with students progressing through the program. Kinga was responsible for overseeing the development of the coursework, writing new software to establish the testing model, and teaching. In addition to teaching the SPARC model, she is also teaching a traditional class as a control. “George Mason University is a great place to teach,” says Kinga. She’s excited about her future."
