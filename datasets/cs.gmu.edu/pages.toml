title = """
GMU CS Students Win First Place in Cyber Warfare Challenge |         George Mason Department of Computer Science"""
description = "Congratulations to Sam Best (CS BS) and Tommy Chin (CS PhD) and teammate Noah Korzak (CYSE BS/BAM) for winning first place among 11 teams from universities across the nation in the Cyber Warfare Challenge hosted by the Naval Surface Warfare Center Dahlgren Division (NSWCDD). The team earned a $60,000 prize for designing a powerful toolkit to analyze network risks and resilience against a number of Advanced Persistent Threat attacks. Their work, praised by the NSWCDD Technical Director Dale Sisson Jr., P.E., SES, and Commanding Officer Joe Oravec for its potential to shape cybersecurity’s future, highlights the depth of the security expertise at George Mason."
