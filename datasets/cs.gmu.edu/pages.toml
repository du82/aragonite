full_description = "Master's Programs Master's Programs Key Features MS in Computer Science MS in Software Engineering MS in Information Systems Software Engineering Graduate Certificate Accelerated Master's Programs Admissions Foundation Courses FAQs Welcome! Thank you for your interest in our Masters programs. The department offers a wide range of masters programs: Computer Science and Software Engineering. The Department also offers additional graduate certificates in a variety of topics; course work toward the certificates can be used for credit toward various Masters programs. Graduate classes are offered in the late afternoon and evening to accommodate the professionally employed students. The MS in Computer Science program is now offered with the option of a 100% online format. Financial aid in the form of graduate assistantships may be available for full- time degree-seeking students. Appropriate courses may be transferred, with advisor approval, into the degree program. Undergraduate students in CS or IT at George Mason University may also enroll in a Bachelor's/Accelerated Master's Program as part of their BS degree."
