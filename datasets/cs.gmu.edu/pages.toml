["https://cs.gmu.edu/media/uploads/ComputingNews/Spring2017/html"]
title = "Computing News"
full_description = "GENERATION CS – that’s the title of a recent report from the Computing Research Association (CRA) highlighting the phenomenal growth in Computer Science enrollments in North American universities over the last decade. Generation CS is well represented at Mason – the number of incoming freshmen in the CS undergraduate programs has more than tripled between Fall 2011 and Fall 2016. Indeed, CS is now the most popular major among incoming freshmen (348 students in Fall 2016) at Mason, having overtaken perennially popular majors such as Biology and Psychology over the last couple of years. While the popularity of CS among students is gratifying, it does pose significant challenges. The department has responded to the enrollment surge by hiring additional faculty and by redirecting resources to the undergraduate programs. In Fall 2011, for example, the department offered nine sections at the senior undergraduate (400) level with an average class size of thirty-three students whereas in Fall 2016 this number had more than doubled to twenty-two sections with an average class size of thirty-nine students. In comparison to most of our peer universities (where senior CS classes of 100 or more students are increasingly commonplace), we have managed to keep class sizes at roughly the same levels. Ironically one of the reasons for the relatively stable average class size for senior level courses is that there is a severe shortage of large classrooms with capacity above eighty at Mason. We have resisted the urge to schedule classes at 7:30 AM (or on Friday evenings) when there is greater availability of large classrooms, but I am afraid that if the enrollments keep growing at their current rate, CS students – and faculty – may need to get used to early mornings! Reconnaissance, weaponization, and payloads are not terms often associated with computer programs. They are the vocabulary of conflict and military engagements. But it is appropriate when considering how to counter the actions of state-sponsored cybersecurity attacks, rogue cyber terrorists, and organized crime. The growing sophistication of cyber attacks and the ease of hackers to plumb the depths of seemingly secure systems, is a threat to national security, financial institutions, commerce, and infrastructure"
