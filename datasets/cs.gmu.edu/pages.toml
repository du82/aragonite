["https://cs.gmu.edu/prospective-students/ms-programs/faqs"]
title = """
FAQs |         George Mason Department of Computer Science"""
description = "My previous degree is not in Computer Science. What are my chances of being admitted?"
full_description = "FAQs Master's Programs Key Features MS in Computer Science MS in Software Engineering MS in Information Systems Software Engineering Graduate Certificate Accelerated Master's Programs Admissions Foundation Courses FAQs My previous degree is not in Computer Science. What are my chances of being admitted? Our Master's program in Software Engineering has more than a third students who did not have a previous degree in Computer Science. Most, but not all, were in a STEM field. To join the MS-SWE program, an applicant must courses in object-oriented programming, data structures and algorithms, discrete math (logic and set theory), and computer architecture including assembly language. Students who need one or more of those courses may take undergraduate equivalents, courses elsewhere, or courses that we offer as part of our Foundations in Computing certificate. Our Master's program in Computer Science requires students with a non-Computer Science undergraduate degree to have the four subjects in the previous pargraph, plus automata theory and formal languages, and a second advanced computer systems course. Can I be admitted to an MS program provisionally? Provisional admission is available to domestic students who have some deficiencies in preparation, but is otherwise a strong applicant. Students entering the MS SWE, MS INFS, or MS ISA programs must have coursework or equivalent knowledge in the areas of object-oriented programming, discrete math, machine organization, and data structure. When admitted provisionally, you must meet these requirements by taking the following courses in our Bridge Foundation Certificate program: COMP 501, COMP 502, COMP 503, and COMP 511. The foundation courses must be taken first before beginning the core curriculum. These courses do not count as credit towards your MS degree. If you believe you already have equivalent knowledge, you have one opportunity to test out of your foundation courses before beginning your first semester. More information regarding the foundation courses can be found here. Due to federal requirements, students on F1/J1 visas are not eligible for provisional admission. However, students who need prep work may join the Foundations in Computing certificate. If those four courses are completed with Bs or better, students are guaranteeed admission into the MS-SWE or MS-INFS program. Do all applicants need to take the GRE? What is the minimum score required? None of our MS programs require a GRE. Do you accept unofficial copies of TOEFL scores? No. Your official scores must be sent directly from the testing agency. More information on standardized test requirements can be found here. Note: delays in submitting official GRE and/or TOEFL scores will delay your application review. Do you accept unofficial transcripts of prior academic work? Yes. We will evaluate your application using unofficial transcripts. However, upon admission, you will need to provide official transcripts before you can enroll in the program. How much will it cost to complete a Master’s degree? For information regarding tuition and fees, please visit the Student Accounts website at studentaccounts.gmu.edu/tuition-fees. Do you offer Financial Aid for MS students? The department offers funding through Graduate Teaching Assistantship (GTA) positions. MS students are not offered positions upon admission, but do have the opportunity to apply once they are admitted to their program. We seek students who have demonstrated a thorough knowledge of our curriculum. The most frequently successful way to do this is by outstanding performance in the core courses of the MS program. As such, MS students are rarely eligible for positions in their first semester, but will be able to apply for each subsequent semester. More information about GTA positions is available here. In addition, a variable number of Research Assistantships are available each year through faculty member’s research grants. More information can be found here. Note: Students with provisional status are not eligible for teaching assistantships. Do I really need to take the courses listed in my provisional admission letter? I already have taken equivalent course work at the undergraduate level Yes, you need to take the courses listed in your letter of admission and pass the courses with a B or better grade. If you believe the admissions committee has overlooked courses you may have taken as undergraduate, you can appeal the foundation course requirement. See this page for more details. If you believe you already know the material that is covered in these classes, you may test out by attempting exams that correspond to various foundation courses. The test out exams are administered in the week before the beginning of the semester. I am an undergraduate student at Mason or Mason alum. Is there an expedited path for admission to the MS programs offered by the CS department? If you are a current undergraduate student in BS ACS, BS CS, or BS IT with two semesters or more remaining in your degree program, you may wish to consider enrolling in an accelerated BS/MS program. If you are a Volgenau School or Engineering alum or current undergraduate within one semester of graduation and have a GPA of 3.0 or higher, you can take advantage of the Fast-Track Graduate Admissions process, which requires fewer supplementary admission materials. Can I visit the department and meet the faculty? While there are no scheduled tours of the CS Department, the College of Engineering and Computing hosts several Open Houses and Information Sessions for Prospective Graduate Students throughout the academic year. At these events you can meet administrative staff who can answer your questions regarding the admissions process and our graduate degrees. Faculty from the CS department are also available at several of these events. For more details, see the CEC Graduate Admissions web page."
