["https://cs.gmu.edu/media/uploads/ComputingNews/Spring2017/new_cs_faculty.html"]
title = "Computing News"
full_description = "The CS Department’s newest faculty members join the department with a variety of research interests and a love of teaching. Foteini Baldimtsi came to Mason after a stint as a post-doctoral researcher at Boston University. She earned her PhD from Brown University. Her research specialty is cryptography with an emphasis on the bitcoin economy, blockchain technologies, and private authentication. She was interested in Mason as a place to work because of its excellent research reputation and its proximity to Washington, DC where there are a lot of scientists who are working in her field. She appreciates that there are so many other women faculty members at Mason and is working to organize CS events on campus to speak to women and minorities about CS fields. Currently she is teaching a graduate class on network security where she says she is working with students to get them to “think as an attacker,” as she teaches them how to spot vulnerabilities. She will also be teaching a new class on bitcoin and blockchain technologies where she plans introduce her research interests to students and discuss research issues in electronic payments and anonymity. Shvetha Soundararajan came to Mason after completing her MS and PhD degrees at Virginia Tech. Her research specialty is software engineering, with an emphasis on agile transformation and assessment. The CS department’s software engineering reputation was a huge draw for her. “This department values both teaching and research and that excited me,” she says. She is teaching object oriented programming and an undergraduate software engineering class for juniors and seniors. She will also be teaching an introductory programming class as part of the SPARC project – a three-year Google Grant research initiative to find innovative ways to teach programming to large numbers of students. Shvetha says that coming from Virginia Tech, she was surprised at the number of part-time students and students who come with strong industry backgrounds. She likes the mix and the experience they bring to the classes."
