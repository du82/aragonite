title = """
Doctoral Advising |         George Mason Department of Computer Science"""
description = "PhD Student AdvisingThe Department of Computer Science has one Graduate Program Specialist available to provide advising for students in our PhD Computer Science program:"
full_description = "Doctoral Advising Advising Undergraduate Advising Master's and Graduate Certificate Advising Doctoral Advising PhD Student Advising The Department of Computer Science has one Graduate Program Specialist available to provide advising for students in our PhD Computer Science program: Alyssa Tsukamoto **NOTE** Appointments are only available for current students at this time. Prospective students interested in the program should email csphd@gmu.edu for guidance.In-Person Advising is available here: Book an Appointment Appointments are recommended and preferred! Otherwise, you can choose to take advantage of the walk-in advising hours noted below. Virtual advising: Currently suspended until further notice Walk-In Advising is available Tuesday/Wednesday/Friday from 1:00 PM to 4:00 PM in the CS Office If you do not schedule an appointment, you are welcome to visit the office during the walk-in advising hours above. Please note that appointments take priority! You may need to wait until an advisor is free to meet with you. The office reserves the right to decline walk-in advising if advisor’s are not present, in a meeting, or overbooked and unable to speak with you in a timely manner. Walk-in appointments will not be taken 10 minutes before closing at 4:00 PM. CS Office Location: Engineering Building Suite #4300 on the fourth floorIf you have simple questions or need quick answers, contact us here:Email: csphd@gmu.eduPhone: (703) 993-1530Due to staff changes, our Graduate Program Specialists are continuing to learn the administrative processes and policies related to our PhD CS program. We appreciate your patience and understanding during advising appointments.Unable to attend appointment:If you are unable to attend your appointment, cancellation through your confirmation email, or sending an email to csphd@gmu.edu would be greatly appreciated.FERPA:Advising appointments are one-on-one meetings with an advisor. Other students, friends, or family are not permitted to participate in the meeting unless FERPA permission has been granted by the student and applied to their account prior to that day's meeting."
