["https://cs.gmu.edu/prospective-students/computing-foundations-graduate-certificate"]
title = """
Computing Foundations Graduate Certificate |         George Mason Department of Computer Science"""
description = "Computing Foundations Certificate OverviewThe Graduate Certificate in Computing Foundations provides a bridge to computing opportunities for students with undergraduate backgrounds in disciplines other than computer science-related areas of study."
full_description = 'Computing Foundations Graduate Certificate Computing Foundations Graduate Certificate Computing Foundations Certificate Overview The Graduate Certificate in Computing Foundations provides a bridge to computing opportunities for students with undergraduate backgrounds in disciplines other than computer science-related areas of study. Students will learn how computers work and how software is designed, written, and deployed. Students will learn practical skills in developing software. Students will be prepared to conceptualize, design, and implement software. Graduates will be able to analyze problems and design software to solve those problems. Graduates will be able to develop effective and efficient software implementations. Program Outcomes Students will learn important mathematical underpinnings of computing Students will learn essential design principles of computer systems Students will learn techniques for developing software for computer systems Students will learn to design, develop, test, and debug moderate-size programs to perform useful functions and provide effective solutions to problems Admission Requirements In addition to general admission requirements of the university, applicants to the certificate are normally expected to have earned a GPA of 3.00 or higher in the last 60 credits of undergraduate study. Applicants must also submit a goals statement and a resume *In the application portal under: Apply Now, you should click on "Graduate" to begin your application for the Graduate Computing Foundations Certificate. DO NOT apply for non-degree. Degree Requirements This certificate may be pursued on a full-or part-time basis. All students complete four required (core) courses, then two of three additional courses, depending on their future plans and interests. Core Courses (All Courses are 3 Credits) COMP 501 Computer Programming Foundations I COMP 502 Mathematical Foundations of Computing I COMP 503 Computer Systems Foundations I COMP 511 Computer Programming Foundations II Total Credits: 12 Restricted Electives (Non-bridge Pathway Students) - (All Courses are 3 Credits) Students select two of the following courses to complete the Certificate: COMP 512 Mathematical Foundations of Computing II COMP 513 Computer Systems Foundations II CS 504 Principles of Data Management and Mining Total Credits: 6 Restricted Electives (MS Computer Science) -(All Courses are 3 Credits) Students select two of the following courses to complete the Certificate: COMP 512 Mathematical Foundations of Computing II COMP 513 Computer Systems Foundations II Total Credits: 6 Restricted Electives (MS Software Engineering) - (All Courses are 3 Credits) Students select two of the following courses to complete the Certificate: SWE 619 Object-Oriented Software Specification and Construction SWE 621 Software Design and Architecture Total Credits: 6 Certificate Policies The program will allow substitution of course requirements on a case-by-case basis, depending on prior undergraduate preparation and approved course appeal request. Students are assumed to have had prior preparation in algebra. Students who intend to undertake more advanced or specialized coursework, or degree studies in computing beyond what is taught in the certificate program, may need to supplement their learning with additional preparation in subjects such as calculus or statistics. Admission Opportunities for MS Programs Upon Completion MS-CS Admissions: If a student completes the entire 6-course certificate, with COMP 512 and COMP 513 (not CS 504), with grades of B or better, they are guaranteed admission into the MS-CS program. MS-SWE Admissions: If a student completes COMP 501, 502, 503, and 511 with grades of B or better, they are guaranteed admission into any one of the MS-SWE program.'
