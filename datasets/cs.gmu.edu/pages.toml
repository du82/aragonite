["https://cs.gmu.edu/blog/gadget-pioneering-sustainability-solutions-for-carbon-neutrality-at-mason-by-2040"]
title = '''
"GADGET: Pioneering Sustainability Solutions for Carbon Neutrality at Mason by 2040" |         George Mason Department of Computer Science'''
description = "Green Assessment and Decision Guidance Tool (GADGET) is probably the least visible Living Lab project, but it’s among the most comprehensive and complex. Computer Science professor Alex Brodsky in the College of Engineering and Computing and his team are working to develop a tool that will help Mason reduce our carbon footprint and achieve carbon neutrality by 2040 in the most cost-effective way. PhD candidate Bedor Alyahya, who is guided by Dr. Brodsky, is working on her dissertation related to this topic. Mason's Director of University Sustainability, Greg Farley, is instrumental in this project as well, and facilitates close collaboration with Mason's facilities and carbon neutrality task force. Read more about the Living Lab project at GMU."
