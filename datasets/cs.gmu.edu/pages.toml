description = "Faculty members from Mason’s Computer Science and other departments from the College of Engineering and Computing made a significant impact at IROS, the flagship robotics conference. The team, which included Greg Stein and Xuesu Xiao from the Computer Science department, Xuan Wang and Ningshi Yao from Electrical and Computer Engineering, Daigo Shishika from Mechanical Engineering, and more than a dozen students, contributed to more than 10 papers, including six full research papers. Their joint paper from CS, ECE, and ME faculty and students also was nominated among the finalists for the Best Paper Award in Cognitive Robotics."
