description = 'Mason CS Professors Bo Han (PI), Songqing Chen (co-PI), Craig Yu (co-PI), and Parth Pathak (co-PI) won an NSF CCRI award for their proposal titled, "CoMIC: A Collaborative Mobile Immersive Computing Research Infrastructure for Multi-user XR."'
full_description = '''Bo Han, Songqing Chen, Craig Yu, and Parth Pathak win an NSF CCRI Award Mason CS Professors Bo Han (PI), Songqing Chen (co-PI), Craig Yu (co-PI), and Parth Pathak (co-PI) won an NSF CCRI award for their proposal titled, "CoMIC: A Collaborative Mobile Immersive Computing Research Infrastructure for Multi-user XR." This is a collaborative project with Prof. Amitabh Varshney at the Computer Science Department of the University of Maryland, College Park. The team will receive $2 million from the NSF to design and develop the infrastructure for Collaborative Mobile Immersive Computing (CoMIC), which lays the technical foundation for realizing the grand vision of the Metaverse. More details about the award can be found here. Congratulations to the team! Posted 1 year, 9 months ago ← Previous: Prof. Kevin Moran receives the MobileSoft Rising Star Award for 2023 Next: Prof. Sanmay Das named to DARPA ISAT Study Group → Categories Announcements (30) News (193) Research Highlights (29) Department of Computer Science Nguyen Engineering Building 4400 University Drive Fairfax, VA 22030 Contact 703-993-1530 (P) 703-993-1710 (F) (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){ (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o), m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m) })(window,document,'script','//www.google-analytics.com/analytics.js','ga'); ga('create', 'G-XR8SL57MF4', 'auto'); ga('send', 'pageview');'''
