["https://cs.gmu.edu/directory/detail/150"]
title = """
Shima Mohebbi |         George Mason Department of Computer Science"""
full_description = "Shima Mohebbi Shima Mohebbi Assistant Professor Office Engineering 2212 Phone 703-993-3069 Email smohebbi@gmu.edu Web volgenau.gmu.edu/pr... Biography Shima Mohebbi develops scalable mathematical models and data analytics to address grand engineering challenges focusing on societal needs. She is motivated to understand how decision-makers' behavior, coupled with the inherent uncertainty in environmental systems, impacts the design and operations of cyber-physical systems. Her specific interests include game theory, simulation, stochastic models, and interpretable data mining with applications in healthcare systems, interdependent infrastructure systems, sustainable urban water systems, and smart cities. Her research is mainly supported by the National Science Foundation and the U.S. Department of Transportation. Mohebbi is a core faculty of C-RASC (Center for Resilient and Sustainable Communities) at Mason. She is passionate about engineering education and outreach activities. She strives to create a teaching environment that promotes problem-solving and communication skills, self-reflection, and collaboration among students. She has also served as a board director in the Modeling and Simulation Division of the Institute of Industrial and Systems Engineers. Prior to joining Mason, Mohebbi was an assistant professor in the School of Industrial and Systems Engineering/Data Science and Analytics Institute at the University of Oklahoma, and a visiting scholar at the University of Exeter’s Center for Water Systems, UK."
