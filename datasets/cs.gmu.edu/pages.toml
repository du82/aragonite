["https://cs.gmu.edu/media/uploads/ComputingNews/Spring2017/artificial_intelligence.html"]
title = "Computing News"
full_description = "One of the most pressing needs in today’s data-flooded world is for accurate data interpretation. This is especially true in the intelligence community. The US government works diligently to build barriers against cyber-attacks that can take down our financial systems and wreak havoc on our nation’s infrastructure; terrorism both domestic and international; chemical, nuclear, and conventional weapon strikes, and even threats against our democracy and election processes. Professors Gheorghe Tecuci, Mihai Boicu, and Dorin Marcu, researchers from George Mason University’s, Learning Agents Center are on to something big. A creative, technical solution that combines their research in artificial intelligence and learning agents with crowdsourcing. The goal is to develop a reliable, flexible technical assistant that can help intelligence analysts evaluate evidence, determine what is credible versus a red herring, and to share that information with other analysts, who working together, can quickly assess critical situations. The system is called Co-Arg (Cogent Argumentation System with Crowd Elicitation). The Learning Agents Center team’s research has just been published in two books, Knowledge Engineering: Building Cognitive Assistants for Evidence-Based Reasoning and Intelligence Analysis as Discovery of Evidence, Hypotheses, and Arguments: Connecting the Dots. They’ve also taken their work into the classroom and out into the field.” This past January, the LAC team, which is also supported by several researchers from Mason and five other universities, was awarded a $7.4-million-dollar contract from the Intelligence Advanced Research Project Activity (IARPA). The aptly named CREATE program: Crowdsourcing Evidence, Argumentation, Thinking and Evaluation is charged with finding technical solutions to assist intelligence analysts with data analysis, to dramatically improve analytic reasoning and the resulting analytic products. Gheorghe Tecuci, the project PI speaks for his team when he says how eager and excited they all are to expand their work and ideas. They are confident they can develop a novel working solution and point to the fact that they are well on their way with the research."
year_published = 2017
