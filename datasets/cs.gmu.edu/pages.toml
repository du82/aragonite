["https://cs.gmu.edu/current-students/ms-students/faqs"]
title = """
FAQs |         George Mason Department of Computer Science"""
description = "Can I change MS programs?"
full_description = "FAQs Master's Students Advising Plan of Study Applying for Graduation FAQs Foundation Courses MS in Computer Science MS in Information Systems MS in Software Engineering Graduate Certificates Accelerated Master's Programs MS in Information Security and Assurance Can I change MS programs? Students can apply to change from one MS program to another by submitting a Graduate Change of Program form. The change needs to be approved by the program directors of both the programs and a minimum of 18 credits must be taken after transferring to a new degree program. If both old and new programs are within the CS department, all we need is the form. If you want to change from another department within the College of Engineering and Computing, you will also need to submit a copy of your undergraduate transcript so we can evaluate preparedness. If you want to change to a program outside of the College of Engineering and Computing, you will need to open a new application. I was recently admitted to MS CS. Do I have to take CS 530 and CS 531? CS 530 and CS 531 are required by the MS-CS program and students should take them as soon as possible, preferably in their first semester. Students with exceptional undergraduate preparation can request to substitute electives for CS 530 and CS 531 in one of two ways. First, students can file a Substitution Request for CS 530 and CS 531. Second, or if the substitution request is denied, students can take a test out exam before beginning the first semester. The exams are given in person only the week before classes start. The schedule will be posted on the department's website.Students who pass the test out exams or whose substitution requests are approved must take other elective courses instead of CS 530 or CS 531. I was admitted provisionally. How do I remove my provisional status? To fulfill the provisional requirements of your admission, you must pass your foundation courses with a grade of B or better or pass the corresponding test out exams. Upon doing so, e-mail csgrad@gmu.edu to request that your provisional status be removed. I don't want to take the foundation courses. How can I skip the requirement? Foundation course requirements are required for students who do not have sufficient background in computing to succeed in our graduate courses. As thus, they are there to protect our graduate students and cannot be skipped. If, however, you believe you have taken an equivalent course to any of those required with your provisional admission, you can submit a Foundation Course Appeal. Otherwise, you are required to pass the courses with a B or better or pass the corresponding test out exams. I’m required to take COMP 502 (formerly INFS 501) as part of my provisional admission, but it is not being offered next semester. What should I do? If ICOMP 502 is not being offered, you may take MATH 125 Discrete Mathematics in its place to satisfy the provisional admission requirement. Please consult the program director of your MS program before registering for MATH 125. I don't satisfy the prerequisite for a class, but I have the background experience. Can I take the class? Generally, no. However, the instructor can grant approval for you to take the class if they determine that your prior academic preparation is sufficient. How do I get permission to take an elective course that is not on the pre-approved list for my degree program? You will need to get permission from the director of your degree program before taking a course that is not on the list of pre-approved electives. Please see the list of program directors here. I took an undergraduate course that appears to be equivalent to one of the core courses in my MS program. Can I skip the core course? No. Graduate courses cover more material and are more challenging than the corresponding courses at the undergraduate level. How can I get a GTA position? Applications for GTA positions will be available each semester through Handshake. Positions are posted well in advance of the start of each semester. More information about assistantships can be found here. How do I apply for graduation? See this page for details on applying for graduation."
