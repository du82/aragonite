description = "The Defense Advanced Research Projects Agency (DARPA) has named Professor Sanmay Das of George Mason University to the Information Science & Technology (ISAT) Study Group beginning in July 2023. The group brings 40 of the brightest scientists and engineers together to identify new areas of development in computer science and information technology and to recommend future possible research directions.The ISAT Study Group was established by DARPA in 1987 to support its technology offices and provide continuing and independent assessment of the state of advanced Information Science technology as it relates to the U.S. Department of Defense."
