["https://cs.gmu.edu/inclusive-computing"]
title = """
Inclusive Computing |         George Mason Department of Computer Science"""
description = "Computing is for AllComputing impacts all aspects of life, and there is an increasing need for computationally literate students in every discipline. According to the Bureau of Labor Statistics, there will be 1.5 million computing jobs by 2021, which is three times more than all other STEM fields combined. However, the US can only meet 35% percent of this need. The best way to close this gap is to expand the CS workforce."
full_description = "Inclusive Computing Inclusive Computing Break Through Tech: For Women in Computing Broadening Participation in Computing Plan Computing is for All Computing impacts all aspects of life, and there is an increasing need for computationally literate students in every discipline. According to the Bureau of Labor Statistics, there will be 1.5 million computing jobs by 2021, which is three times more than all other STEM fields combined. However, the US can only meet 35% percent of this need. The best way to close this gap is to expand the CS workforce. Today, approximately 70% of computing jobs are held by white professionals. Only 20% of computer science careers are held by women. Only 4% of computer scientists are black, even though 12% of the US population is black (Bureau of Labor Statistics, 2017). Faculty, staff, students and alumni want this to change. We seek to substantially increase the representation of women and minorities majoring in computing. As part of this effort the department developed a Broadening Participation in Computing Plan. We won a grant -- Break Through Tech DC propels students who identify as women and non-binary into computing degrees and careers in tech—through curriculum innovation, career access, and community building."
