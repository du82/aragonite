title = "JML - Jyh-Ming Lien"
full_description = "Table of Contents CV Teaching Research Selected publications Publications Contact info: Department of Computer Science George Mason University, MSN 4A5 Fairfax, VA, 22030, USA http://cs.gmu.edu/~jmlien/ jmlien@cs.gmu.edu office hours: no office hours I am current on leave at iRobot and not taking new students. I direct the Motion and Shape Computing (MASC) Group that is affiliated with the GMU Autonomous Robotics Laboratory. Visit MASC group project page for our most recent research and publications. Our research goal is to develop efficient, robust and practical algorithms for representing, manipulating and analyzing massive geometric data of shape and motion. Our research finds applications in the areas of computational geometry, computer graphics, GIS, visualization and robotics. I also organize GRAND seminar. If you are visiting Washington DC area, I would certainly love to have you stop by and give a talk. CV pdf (last update: Jan 2022) Teaching Not teaching See All Past Courses Research MASC Group Members Projects Publications Software GRAND seminar Google Scholar Profile Selected publications (A full list of my publications) Computational Origami & Kirigami (see details) Computational kirigami wrapping: a universal method to wrap 3D-curved surfaces beyond materiality, Lee and Xi et al., Science Advances, April 10, 2020 (paper) Computational Laser Forming Origami of Convex Surfaces, Yue Hao and Jyh-Ming Lien, Proceedings of the ACM Symposium on Computational Fabrication (SCF), Jun 2019 (paper) (project page) Creating Foldable Polyhedral Nets Using Evolution Control, Yue Hao and Yun-Hyeong Kim and Zhonghua Xi and Jyh-Ming Lien, Proceedings of the Robotics: Science and Systems Conference (RSS), Jun. 2018 (paper) (project page) Learning to Segment and Unfold Polyhedral Mesh from Failures, Zhonghua Xi and Yun-Hyeong Kim and Young J. Kim and Jyh-Ming Lien, Shape Modeling International (SMI), Jun. 2016; also appears in Journal of Computers & Grap