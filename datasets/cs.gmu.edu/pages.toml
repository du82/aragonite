["https://cs.gmu.edu/current-students/undergraduates/minors"]
title = """
Minor in Computer Science |         George Mason Department of Computer Science"""
description = "Computer Science is a discipline concerned with the design, implementation, and maintenance of the computer software systems used in almost all other professions."
full_description = '''Minor in Computer Science Undergraduates Getting started in CS at GMU BS in Computer Science BS in Applied Computer Science CS Honors Program Accelerated Master's Programs Minor in Computer Science Minor in Software Engineering Advising Course Prerequisite Chains Undergraduate Research Opportunities Undergraduate Certificate Computer Science is a discipline concerned with the design, implementation, and maintenance of the computer software systems used in almost all other professions. The Minor in Computer Science is intended for those pursuing other undergraduate degree programs who feel the need to pursue Computer Science to complement their other studies. Regardless of their discipline, undergraduates find a knowledge of Computer Science to be helpful in today's world. This Minor is not a "computer literacy" program; all the courses are the same as taken by Computer Science majors. Download the Computer Science Minor Brochure (PDF) Requirements Requirement Hours Course CS 112 4 hours Introduction to Computer Programming CS 211 3 hours Object-oriented Programming CS 310 3 hours Data Structures CS 3xx or CS 4xx 3-4 hours Three of: 222 or 262, 306, 321, 325, 330, 332, 367, 450, 451, 455, 463, 465, 468, 471, 480, 483, 484 CS 3xx or CS 4xx 3 hours CS 3xx or CS 4xx 3 hours This totals 19-20 hours of credit. Students should pay careful attention to prerequisites when selecting courses and be aware that at least 4 semesters are needed to complete the Minor. Students should be aware that at least 8 credits must be applied only to the minor and may not be used to fulfill requirements of the student's major, concentration, an undergraduate certificate, or another minor. Students must complete at least 6 credits in their minor at Mason and achieve a minimum 2.00 GPA in courses applied to the minor. No more than 3 hours of "D" in the CS Minor are accepted. Please see the Academic Policies section of the GMU Catalog for general university requirements for a minor. Declaring the Minor To declare for the minor in Computer Science, you will need to submit a Undergraduate Minor declaration form. The form (in PDF) can be downloaded from the registrar's website. Please complete the form and either email it to csug@gmu.edu or drop it off in the CS department office.'''
