["https://cs.gmu.edu/current-students/undergraduates/advising/applying-for-graduation"]
title = """
Applying for Graduation |         George Mason Department of Computer Science"""
description = "To apply for graduation:"
full_description = '''Applying for Graduation Undergraduates Getting started in CS at GMU BS in Computer Science BS in Applied Computer Science CS Honors Program Accelerated Master's Programs Minor in Computer Science Minor in Software Engineering Advising Your Faculty Advisor Your Academic Advisors General FAQs Mason Core FAQs Tracking Degree Progress Applying for Graduation Course Prerequisite Chains Undergraduate Research Opportunities Undergraduate Certificate To apply for graduation: Whenever you register for classes using Patriot Web, you should confirm or declare an "expected graduation date." When you reach your second to last semester (the semester before you intend to graduate), you must file an electronic Graduation Intent Form which can be found on Patriot Web. Once you file the Graduation Intent Form, go to the next step on the graduation site. Complete the Mandatory Student Survey on the same page at Patriot Web. Go to https://patriotweb.gmu.edu/ and print out a copy of your "degree evaluation" report. Then meet/contact your advisor to review your degree evaluation and ensure you have met all requirements for graduation. Be sure to bring a copy of your degree progress report with you to meet with your advisor. You may find your advisor's contact information and available office hours at Faculty Office Hours. The Administrative Staff will coordinate your Graduation Application paperwork with your faculty advisor on record. Be careful to plan ahead to meet the graduation filing deadlines. Filing deadlines for each semester are now in the middle of the second to last semester before you intend to graduate. August graduates follow the deadlines for the previous May graduation. See the registrar's webpage for specific deadlines for each semester. Your graduation application will then go through final review by the registrar's office at the end of the semester and diplomas will be mailed within a month or two after commencement if there are no further problems with your application.'''
