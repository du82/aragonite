["https://cs.gmu.edu/blog/category/announcements"]
title = """
News
\t
 |         George Mason Department of Computer Science"""
full_description = '''Announcements GMU CS Students Win First Place in Cyber Warfare Challenge 2 months, 2 weeks ago / Categories: Announcements, News Congratulations to Sam Best (CS BS) and Tommy Chin (CS PhD) and teammate Noah Korzak (CYSE BS/BAM) for winning first place among 11 teams from universities across the nation in the Cyber Warfare Challenge hosted by the Naval Surface Warfare Center Dahlgren Division (NSWCDD). The team earned a $60,000 prize for designing a powerful toolkit to analyze network risks and resilience against a number of Advanced Persistent Threat attacks. Their work, praised by the NSWCDD Technical Director Dale Sisson Jr., P.E., SES, and Commanding Officer Joe Oravec for its potential to shape cybersecurity’s future, highlights the depth of the security expertise at George Mason. Prof. Alex Brodsky is a keynote speaker at the 36th IEEE International Conference on Tools with Artificial intelligence (ICTAI-2024) 4 months ago / Categories: Announcements, News Celebrating Excellence: Faculty Achievements in Spring'24 9 months, 3 weeks ago / Categories: Announcements, News As we approach the end of the school year, we are proud to announce achievements received by our faculty this Spring semester. These awards highlight their contributions to both research and teaching. Prof. Wing Lam receives the NSF CAREER Award for work on Flaky Tests 10 months, 3 weeks ago / Categories: Announcements, News Prof. Lam is awarded the NSF CAREER Award for the project "Enhanced Reliability and Efficiency of Software Regression Testing in the Presence of Flaky Tests". Congratulations!List of all Career Awardees at CS@GMU: https://cs.gmu.edu/about/faculty-awards/ "GADGET: Pioneering Sustainability Solutions for Carbon Neutrality at Mason by 2040" 1 year, 2 months ago / Categories: Announcements, News Green Assessment and Decision Guidance Tool (GADGET) is probably the least visible Living Lab project, but it’s among the most comprehensive and complex. Computer Science professor Alex Brodsky in the College of Engineering and Computing and his team are working to develop a tool that will help Mason reduce our carbon footprint and achieve carbon neutrality by 2040 in the most cost-effective way. PhD candidate Bedor Alyahya, who is guided by Dr. Brodsky, is working on her dissertation related to this topic. Mason's Director of University Sustainability, Greg Farley, is instrumental in this project as well, and facilitates close collaboration with Mason's facilities and carbon neutrality task force. Read more about the Living Lab project at GMU. ← previous 1 2 3 4 5 6 next → Recent Announcements GMU CS Students Win First Place in Cyber Warfare Challenge Nov 28 Prof. Alex Brodsky is a keynote speaker at the 36th IEEE International Conference on Tools with Artificial intelligence (ICTAI-2024) Oct 15 Celebrating Excellence: Faculty Achievements in Spring'24 Apr 30 Prof. Wing Lam receives the NSF CAREER Award for work on Flaky Tests Mar 25 "GADGET: Pioneering Sustainability Solutions for Carbon Neutrality at Mason by 2040" Dec 14 CEC Faculty Shine at IROS Robotics Conference Oct 08 Prof. Sanmay Das receives gift from Hewlett Foundation for AI and education policy research Sep 28 Keren Zhou won SIGHPC Doctoral Dissertation Award Aug 08 > See more Categories Announcements (30) News (193) Research Highlights (29)'''
