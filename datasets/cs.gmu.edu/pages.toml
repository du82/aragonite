["http://cs.gmu.edu/media/syllabi/Fall2016/CS100OttenJ.html"]
title = "CS 100: Principles of Computing"
full_description = '''Instructor: Prof. John Otten Email address: jotten2@gmu.edu Office Phone: 703-993-1669 Office Location: ENGR, Room 5335; Office Hours: T/R 10:30 - 11:30 or by appointment Class Day/Time: T/R 12:00 - 1:15 p.m. Class Location: Art and Design Building, Room L008 Online Class Syllabus: http://www.cs.gmu.edu/syllabus/syllabi-fall16/CS100OttenJ.html DESCRIPTION: CS 100 is intended to help students learn to think in the manner necessary to fully grasp the nature and power of the digital world around us. The early era of the Internet and the personal computer lead to the need for "computer literacy." Now, the changing nature of our global society requires that students learn new ways to think about problems and how to solve them, regardless of students' specific fields of endeavor. Through this course, students will explore major issues related to the "big ideas" of computational thinking (namely, (i) Creativity, (ii) Abstraction, (iii) Data, (iv) Algorithms, (v) Programming, (vi) Internet, and (vii) Societal Impact), as well as how these issues will impact their future lives. LEARNING OUTCOMES: By the end of the semester, a passing student will be able to carry out the following types of activities: TEXTBOOK: There is no required textbook to purchase. Readings will be assigned via various sources, such as internet articles, and freely available downloadable textbooks. Graduate Teaching Assistant: Mingrui Han Email: mhan8@masonlive.gmu.edu Office Hours: Thurs/Fri 3:00-4:30 Class: Class lectures will be held on Tuesdays and Thursdays, from 12:00 - 1:15 p.m. Students are expected to attend the full lecture each week and are responsible for all material covered during lecture. Electronic Devices: Use of electronic devices (including laptops, tablets, cell phones, etc.) is strongly discouraged during class, except during selected group work exercises. Please make sure all such devices are turned off or silenced while class is in session. Computing Resources: You are required to have access to an internet enabled computer. Some university labs provide computers for this purpose but most students find it more convenient to have a personal computer. Some lecture time may be devoted to showing the use of online applications. If it will be difficult for you to gain access to computing resources, contact the instructor.'''
