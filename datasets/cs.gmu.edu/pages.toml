["https://cs.gmu.edu/events/detail/636"]
title = """
Towards a science of human-AI Teams |         George Mason Department of Computer Science"""
full_description = "Towards a science of human-AI Teams Events / Distinguished Lecture Series When: Tuesday, October 22, 2024 from 11:00 AM to 12:00 PM Speakers: Valerie Chen, PhD Student Location: Nguyen Engineering Bldg, Conference Room 4201 Export to iCal Abstract: AI models have the potential to support and complement human decision-makers and users. And yet, the deployment of human-AI teams still faces practical challenges. I’m interested in developing a more principled workflow for building human-AI teams, which involves carefully examining points in the team setup and asking the following questions: (i) what are the right metrics to optimize the AI model for, and (ii) how can we facilitate effective communication between humans and AI. In this talk, I will discuss how existing literature has attempted to answer each of these questions, their limitations, and promising alternatives. Bio: Valerie (https://valeriechen.github.io/) is a Machine Learning Ph.D. student at Carnegie Mellon University. Her research aims to improve human-AI interactions through a use-case-grounded lens and to leverage insights from practical user studies to design new interactive systems. Her research sits at the intersection of ML, NLP, and HCI. Valerie is a recipient of the NSF Graduate Research Fellowship, a former intern at MSR’s Fairness, Accountability, Transparency & Ethics in AI group, and a rising star in Data Science. Valerie completed her B.S. in Computer Science at Yale University. Posted 4 months, 1 week ago Categories AI Tea Seminar (6) Booz Allen Hamilton Distinguished Lecture Series (8) CEC Seminar (4) Colloquium (1) CS Seminar (222) Department of Computer Science (43) Distinguished Lecture Series (55) GRAND Seminar (24) Mason Humanity-Centered Design Seminar (1) Oral Defense of Doctoral Dissertation (88) Oral Defense of Masters Thesis (5) PhD CS Oral Comprehensive Exam (118) SANG Seminar (11) SWE Seminar (9) Volgenau School of Engineering (6)"
