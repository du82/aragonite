["https://cs.gmu.edu/current-students/undergraduates/advising/advising-faq"]
title = """
Your Faculty Advisor |         George Mason Department of Computer Science"""
description = "What Can My Faculty Advisor Do?A faculty advisor can:"
full_description = '''Your Faculty Advisor Undergraduates Getting started in CS at GMU BS in Computer Science BS in Applied Computer Science CS Honors Program Accelerated Master's Programs Minor in Computer Science Minor in Software Engineering Advising Your Faculty Advisor Your Academic Advisors General FAQs Mason Core FAQs Tracking Degree Progress Applying for Graduation Course Prerequisite Chains Undergraduate Research Opportunities Undergraduate Certificate What Can My Faculty Advisor Do? A faculty advisor can: Help you decide which courses to take Help you evaluate your degree progress Answer general questions pertaining to your academics and coursework How do I find out who my faculty advisor is? The CS Department maintains a list of advisors for each student. You should contact the department office (csug@gmu.edu) to obtain the name of your faculty advisor if it has not already been emailed to you. In following semesters, you will generally have the same advisor as before, as long as they are not on leave that semester. When are advisors assigned? Faculty advisors are assigned to students upon admittance to the CS program, shortly after the semester begins (the advisor-assigning process can't begin until after add/drop deadlines). How do I meet with my advisor? Bring your degree progress report or academic transcript with you any time you go to speak to your advisor! There are two times you are required to get advising, though you are invited to do so each semester. In CS 110, you meet with one of the departmental academic advisors. Bring the filled out CS 110 Advising Form. In CS 330, you meet with your faculty advisor. We do our best to maintain the same advisor for you throughout your time at GMU. Bring the filled out CS 330 Advising Form. If you have an academic question or a question that the staff cannot answer, ask your faculty advisor. All faculty members maintain office hours for their advisees, and/or class students. These hours are posted on the CS "Student Information" bulletin board outside Room 4300 in the Engineering Building or online at Faculty Office Hours. You may see your advisor on a walk-in basis during these times, or make an appointment by email. Many routine questions can be answered by email. To make the most productive use of time with your advisor, please bring a copy of your current degree audit with you. Don't wait until just before your registration time to attempt to meet with your advisor! What if my faculty advisor isn't available? Consider that if you wait until the very end of the semester to try scheduling an advisor appointment, everyone's response times may be delayed during the ramp up to exams week. It's far better for you to get advised before Registration Week, which is often roughly mid-semester. In general, if you haven't gotten a response within a week, please write them once again and wait before contacting the department directly about it. If your faculty advisor is proving impossible to meet with, contact the CS Staff (csug@gmu.eduand let them know who your current advisor is, and they will figure out what to do next. Be sure to bring evidence of repeated attempts, e.g. emails on multiple occasions. Can I change my faculty advisor? You may request a change of advisors from the CS Staff. Some faculty advisors may not be assigned new advisees due to their current overload of advisees.'''
