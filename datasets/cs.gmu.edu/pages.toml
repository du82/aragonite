title = """
Undergraduate Advising |         George Mason Department of Computer Science"""
description = "Undergraduate Student AdvisingThe Department of Computer Science has four undergraduate advisors on staff who are qualified to answer many student questions on both policy and procedure:"
full_description = "Undergraduate Advising Advising Undergraduate Advising Master's and Graduate Certificate Advising Doctoral Advising Undergraduate Student Advising The Department of Computer Science has four undergraduate advisors on staff who are qualified to answer many student questions on both policy and procedure: Josh Fletcher, Undergraduate Academic Advisor Kristi Morrow, Undergraduate Academic Advisor Linda Sheridan, Undergraduate Academic Advisor Vernell Wilks, Undergraduate Academic Advisor **ADVISING IS BY APPOINTMENT ONLY** Follow this link to book in-person or virtual advising: Book an Appointment Be sure to select the correct format for your appointment! Note the location for in-person advising: Undergraduate Advising Office, Buchanan Hall D215 You can use the following contact information for quick assistance: Email: csug@gmu.edu Phone: (703) 993-1530 FERPA:Advising appointments are one-on-one meetings with an advisor. Other students, friends, or family are not permitted to participate in the meeting unless FERPA permission has been granted by the student and applied to their account prior to that day's meeting. Required Advising Appointments In CS 110, you meet with one of the Undergraduate Academic Advisors listed above. Email the filled out CS 110 Advising Form at least 48 hours prior to the scheduled appointment. Do not arrive to your appointment with your form in hand or on your laptop. In CS 330, you meet with your faculty advisor. We do our best to maintain the same advisor for you throughout your time at GMU. Bring the filled out CS 330 Advising Form to your faculty meeting. Faculty Advisors If you have formally declared Computer Science as your major, you will have an assigned faculty advisor to assist you with scheduling, the CS 330 Advising Form, and other academic decisions. We recommend that you meet with your faculty advisor on a regular basis. For additional information, see the Your Faculty Advisor page."
