title = "Systems & Networking - Department of Computer Science"
description = "Our Systems & Networking faculty are undertaking research into all aspects of computer systems."
full_description = 'Systems and networking underpin nearly every aspect of our lives, from business and health care to transportation and entertainment. Research advances are crucial for providing new services and ensuring reliability and security in our increasingly digital world. Through theoretical advances, practical implementations, and open-source contributions, our research groups continue to push the boundaries of what’s possible in connecting systems and users. Our networking groups examine topics ranging from wireless and mobile networking, massively parallel hardware for ML/AI, the Internet of Things, cybersecurity, V2X-based transportation systems, software-defined networking, applications of ML/AI for network operations, and more. Meanwhile, our systems faculty are engaged in research projects that will lead to more robust, reliable, and secure computer systems for the real world, conducting state-of-the-art work in systems for big data, networks and network architectures, mobile security, cloud computing, and data-intensive computing and databases. Research Groups and Labs Distributed Systems and Networks Lab The DSN Lab focuses on dependable infrastructure research, making the computerized networked infrastructure our society relies upon resilient, performant, and secure. Distributed Systems and Networks Lab Order Lab The overarching goal of the lab is to advance the principles and practices in building next-generation dependable systems for emerging platforms. Order Lab People Yair Amir Professor Emeritus Department of Computer Science﻿ Email: yairamir@jhu.edu Phone: 301-806-4803 Randal Burns Bill and Lisa Stromberg Department Head and Professor Department of Computer Science﻿ Email: randal@cs.jhu.edu Phone: 410-516-8775 Yinzhi Cao Technical Director of the JHU Information Security Institute and Associate Professor Department of Computer Science﻿ Email: yinzhi.cao@jhu.edu Phone: 410-516-6718 Anton Dahbura Executive Director of the Johns Hopkins University Information Security Institute and Co-Director of the Johns Hopkins Institute for Assured Autonomy Department of Computer Science﻿ Email: AntonDahbura@jhu.edu Phone: 410-516-0211 Soudeh Ghorbani Assistant Professor Department of Computer Science﻿ Email: sghorba1@jhu.edu Phone: 410-516-6781 Alex Marder Assistant Professor Department of Computer Science﻿ Email: amarder@jhu.edu Krishan Sabnani Homewood Professor of Computer Science Department of Computer Science﻿ Email: ksabnan2@jhu.edu Phone: 908-385-3642 Scott Smith Director of Graduate Studies and Professor Department of Computer Science﻿ Email: scott@cs.jhu.edu Phone: 410-516-5299 Alex Szalay Bloomberg Distinguished Professor Department of Computer Science﻿ Email: szalay@jhu.edu Phone: 410-516-7217 <img class="visual_image" src="https://www.cs.jhu.edu/wp-content/uploads/2023/12/Alex-Marder-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2023/12/Alex-Marder.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2023/12/Alex-Marder-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2023/12/Alex-Marder-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2023/12/Alex-Marder-300x200.jpg 300w" sizes="100vw" alt="Alex Marder" itemprop="image"> New CS faculty Alex Marder receives $5 million NSF grant Alex Marder, an assistant professor of computer science, has received the grant as part of the National Science Foundation’s Convergence Accelerator program. Learn more'
