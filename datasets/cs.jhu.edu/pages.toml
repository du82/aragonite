title = "Master of Science in Security Informatics (MSSI) - Department of Computer Science"
description = "The full-time MSSI program is an immersive, three-semester program providing educational, research, and professional opportunities that are simply unparalleled in this rapidly expanding field."
full_description = 'The flagship educational experience offered by the Johns Hopkins University in the area of information security and assurance is represented by the Master of Science in Security Informatics (MSSI) degree. While being mentored by recognized leaders in the field, you will combine applied disciplines—including computer science, computer engineering, information technology, and management and policy—while you benefit from our proximity to Washington, D.C. and our deep connections with federal agencies, key R&D institutions, and diverse industrial sectors. We offer core courses in the most current topics in information security, such as Security and Privacy in Computing, Modern Cryptography, Computer Forensics, Software Vulnerability Analysis, Computer Intrusion Detection, Cloud Computing Security, Rights in the Digital Age, and Financial Issues in Managing a Secure Operation. In addition to our core course requirements, students have the opportunity to pursue one of two tracks of study: Technology & Research or Policy & Management. As part of the Home to Hopkins program, full-time students are eligible to take up to two online courses through the Whiting School’s Engineering for Professionals program the summer before they start their full-time, residential master’s program. These courses apply to their master’s degree if satisfactorily completed. You can view the list of approved courses here. Email admissions@cs.jhu.edu to request more information. We offer unparalleled dual degree and joint program opportunities in computer science, applied mathematics, health science, and national security. Supported by the research and educational programs at Johns Hopkins’ renowned School of Medicine, we are the nation’s first information security program to focus on healthcare information security. We offer many opportunities for paid research, teaching, and work experience on our campuses and qualified students may benefit from unique scholarship opportunities, including the National Science Foundation CyberCorps®: Scholarship for Service and the Department of Defense Cyber Service Academy. Our technology and recruitment seminar series provides direct access to technical and business leaders in the field and to the latest trends and challenges in the rapidly changing sector of information security. Schedule a time to talk with one of our faculty members directly by sending an email to JHUISI-MSSI@jhu.edu. About the MSSI Program Everything you need to know about the Master of Science in Security Informatics (MSSI) program at Johns Hopkins University. MSSI Admissions Program Requirements Faculty and Lecturers MSSI Course Distribution Dual Degree Opportunities Scholarships News <img class="visual_image" src="https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU3608-300x200.jpeg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU3608-980x654.jpeg 980w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU3608-740x494.jpeg 740w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU3608-500x334.jpeg 500w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU3608-300x200.jpeg 300w" sizes="100vw" alt="A view of Gilman Hall from the Krieger Quad." itemprop="image"> National Science Foundation CyberCorps®: Scholarship for Service Program CyberCorps®: Scholarship For Service (SFS) is a unique, fully-funded scholarship program designed to increase and strengthen the cadre of federal information assurance professionals that protect the government’s critical information infrastructure. This program provides scholarships that may fully fund the typical costs incurred by full-time students, including tuition and education-related fees; participating graduate students currently receive additional annual stipends of $34,000. After graduation, participants must fulfill a government service obligation for a period equivalent to the length of their scholarship (up to two years, odd-semester programs are rounded up). Scholarships are funded through grants awarded by the National Science Foundation. Learn More <img class="visual_image" src="https://www.cs.jhu.edu/wp-content/uploads/2021/11/Untitled-design-47-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2021/11/Untitled-design-47.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2021/11/Untitled-design-47-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2021/11/Untitled-design-47-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2021/11/Untitled-design-47-300x200.jpg 300w" sizes="100vw" alt="An eye with a digital target overlay." itemprop="image"> Looking for part-time and online programs? Consistently rated as one of the best online master’s degrees in cybersecurity, the Johns Hopkins Engineering for Professionals cybersecurity program combines knowledge from instructors who are working to fight cybersecurity threats on the front lines with relevant courses designed to put you ahead. Johns Hopkins Engineering for Professionals Cybersecurity Program'
