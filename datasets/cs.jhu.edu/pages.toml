["https://www.cs.jhu.edu/faculty/mark-dredze"]
title = "Mark Dredze - Department of Computer Science"
description = "Mark Dredze is a John C. Malone Professor of Computer Science, the interim deputy director of the Data Science and AI Institute, and the associate head of research and strategic…"
full_description = '{ "@context": "http://schema.org", "@type": "Person", "email": "mailto:mdredze@cs.jhu.edu", "image": "", "jobTitle": "Interim Deputy Director of the Data Science and AI Institute, Associate Head of Research and Strategic Initiatives, and John C. Malone Professor", "name": "Mark Dredze", "telephone": "", "url": "https://www.cs.jhu.edu/faculty/mark-dredze/", "address": "339 Malone Hall" } Contact mdredze@cs.jhu.edu Location 339 Malone Hall Research Areas Artificial intelligence Machine learning Natural language processing Health informatics Connect Google Scholar Twitter Website Mark Dredze is a John C. Malone Professor of Computer Science, the interim deputy director of the Data Science and AI Institute, and the associate head of research and strategic initiatives for the Department of Computer Science at the Johns Hopkins University. He develops artificial intelligence systems based on natural language processing and explores their applications to public health and medicine. His research centers around statistical models of language with applications to social media analysis, public health, and clinical informatics. Within natural language processing he focuses on statistical methods for information extraction, but has considered a wide range of NLP tasks, including syntax, semantics, sentiment, and spoken language processing. Dredze’s work in public health addresses the areas of tobacco control, vaccinations, infectious disease surveillance, mental health, drug use, and gun violence prevention. He also develops new methods for clinical NLP on medical records. Dredze is affiliated with multiple Johns Hopkins institutions, among them the Malone Center for Engineering in Healthcare and the Center for Language and Speech Processing; he also holds a joint appointment in the School of Medicine’s Biomedical Informatics & Data Science Section in the Department of Medicine within the Division of General Internal Medicine. Beyond publications in core areas of computer science, Dredze has pioneered new applications in public health informatics. He has published widely in health journals, including the Journal of the American Medical Association, the American Journal of Preventive Medicine, Vaccine, and the Journal of the American Medical Informatics Association. His work is regularly covered by major media outlets, including NPR, The New York Times, and CNN. He obtained his PhD from the University of Pennsylvania in 2009. Related News View All News <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2025/01/swisher_panel-scaled-1-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2025/01/swisher_panel-scaled-1-980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/swisher_panel-scaled-1-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/swisher_panel-scaled-1-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/swisher_panel-scaled-1-300x200.jpg 300w" sizes="100vw" alt="Gillian Hadfield, Mark Dredze, Kara Swisher, and Rumman Chowdhury converse while sitting on a stage."> Four expert takes on artificial intelligence Categories Department News Johns Hopkins faculty members Gillian Hadfield and Mark Dredze joined veteran tech journalist Kara Swisher and Humane Intelligence founder and CEO Rumman Chowdhury for a wide-ranging discussion. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2021/07/Gate_JHU9036-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2021/07/Gate_JHU9036-980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2021/07/Gate_JHU9036-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2021/07/Gate_JHU9036-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2021/07/Gate_JHU9036-300x200.jpg 300w" sizes="100vw" alt="A gate featuring the Johns Hopkins academic seal."> CS faculty to lead new Bloomberg Distinguished Professorships clusters Categories Department News The new clusters will advance interdisciplinary research efforts at the Johns Hopkins University’s Data Science and AI Institute. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/08/Dredze-Horizontal-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/08/Dredze-Horizontal.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Dredze-Horizontal-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Dredze-Horizontal-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Dredze-Horizontal-300x200.jpg 300w" sizes="100vw" alt="Headshot of Mark Dredze on the Homewood campus."> Mark Dredze receives Optum Research Award Categories Awards and Honors The award will support his research on using large language models to build clinical question-answering systems that preserve patient privacy.'
