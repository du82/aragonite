description = "Joanne Selinski is an associate teaching professor of computer science and currently serves as the associate head for education and the director of undergraduate studies for the Department of Computer…"
full_description = '{ "@context": "http://schema.org", "@type": "Person", "email": "mailto:joanne@cs.jhu.edu", "image": "", "jobTitle": "Director of Undergraduate Studies, Associate Head for Education, and Associate Teaching Professor", "name": "Joanne Selinski", "telephone": "410-516-4117", "url": "https://www.cs.jhu.edu/faculty/joanne-selinski/", "address": "225 Malone Hall" } Contact 410-516-4117 joanne@cs.jhu.edu Location 225 Malone Hall Connect Website Joanne Selinski is an associate teaching professor of computer science and currently serves as the associate head for education and the director of undergraduate studies for the Department of Computer Science. She is a member of numerous departmental committees in addition to serving on the Whiting School of Engineering Faculty Senate. Her research interests lie in computer science education, particularly as it relates to core courses and active learning approaches. A recipient of the Robert B. Pond, Sr. Excellence in Teaching Award in 2017, Selinski is also an advocate for diversity and inclusion, particularly within the field of computer science. Selinski earned her bachelor’s degree in mathematics from Chestnut Hill College in 1984, after which she earned her MSE in electrical engineering and computer science and her PhD in computer science from Johns Hopkins University in 1986 and 1996, respectively. Related News View All News <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2019/04/Untitled-design-2-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2019/04/Untitled-design-2.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2019/04/Untitled-design-2-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2019/04/Untitled-design-2-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2019/04/Untitled-design-2-300x200.jpg 300w" sizes="100vw" alt="Kelly Culotta poses with a plaque outside of the breezeway between Hackerman and Malone Halls."> CS staff member named 2019 WSE Rookie of the Year Categories Department News Senior Academic Program Coordinator Kelly Culotta received this year’s “Rookie of the Year” Staff Excellence Award from the Whiting School of Engineering. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2018/11/2-people-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2018/11/2-people.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2018/11/2-people-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2018/11/2-people-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2018/11/2-people-300x200.jpg 300w" sizes="100vw" alt="Headshots of Yu-Chi “Kiki” Chang and Nirmal Krishnan in Malone Hall."> CS Department offers new fellowship for students in combined bachelor’s/master’s program Categories Department News Yu-Chi “Kiki” Chang and Nirmal Krishnan are among the first to be awarded the Gerald Masson Fellowship. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2018/10/Kelly-C-e1730137033331-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2018/10/Kelly-C-e1730137033331-980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2018/10/Kelly-C-e1730137033331-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2018/10/Kelly-C-e1730137033331-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2018/10/Kelly-C-e1730137033331-300x200.jpg 300w" sizes="100vw" alt="Headshot of Kelly Culotta."> JHU CS welcomes new senior academic program coordinator Categories Department News Kelly Culotta will assist the Director of Undergraduate Studies in supporting the undergraduate program by helping with academic advising, course scheduling, and event logistics.'
