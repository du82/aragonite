full_description = '{ "@context": "http://schema.org", "@type": "Person", "email": "mailto:scott@cs.jhu.edu", "image": "", "jobTitle": "Director of Graduate Studies and Professor", "name": "Scott Smith", "telephone": "410-516-5299", "url": "https://www.cs.jhu.edu/faculty/scott-smith/", "address": "219 Malone Hall" } Contact 410-516-5299 scott@cs.jhu.edu Location 219 Malone Hall Research Areas Programming languages Formal methods Connect Google Scholar Lab Website Website Scott Smith, a professor of computer science at the Johns Hopkins University, has research interests in a number of areas in programming languages. He served as chair of the Department of Computer Science from 2004 to 2010 and currently serves as its director of graduate studies. Smith directs the Programming Languages Laboratory at Johns Hopkins, which focuses on fundamental problems in programming languages. Its current work includes the development of demand-driven program analysis, an analysis that extends well-known demand-driven lookup techniques found in first-order program analyses to higher-order programs. Through its Big Bang project, his team aims to create a typed programming language with the feel and convenience of modern scripting languages. A member of the ACM, Smith has been a panelist and program committee member for many professional conferences. He sits on the editorial board for ACM Computing Surveys and has been a reviewer for numerous conferences and journals. Smith received his bachelor’s degree in computer science and chemistry from Purdue University in 1983. He then went on to Cornell University, completing a master’s degree and PhD in computer science in 1985 and 1989, respectively. Smith joined the Whiting School of Engineering faculty in 1988. Related News View All News <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2023/12/ScottSmithBackyard-300x200.jpeg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2023/12/ScottSmithBackyard-980x654.jpeg 980w, https://www.cs.jhu.edu/wp-content/uploads/2023/12/ScottSmithBackyard-740x494.jpeg 740w, https://www.cs.jhu.edu/wp-content/uploads/2023/12/ScottSmithBackyard-500x334.jpeg 500w, https://www.cs.jhu.edu/wp-content/uploads/2023/12/ScottSmithBackyard-300x200.jpeg 300w" sizes="100vw" alt="Scott Smith poses on a ladder in front of an Asian pear tree. He holds a pear in his hand with a bite taken out of it."> A forum for fruit Categories Department News Learn about Professor Scott Smith’s “other life” as an orchard enthusiast. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2023/12/wug-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2023/12/wug.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2023/12/wug-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2023/12/wug-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2023/12/wug-300x200.jpg 300w" sizes="100vw" alt="A drawing of one bird-like creature, labeled &quot;This is a wug.&quot; Under it is a drawing of two bird-like creatures, labeled &quot;Now there is another one. There are two of them. There are two _____.&quot;"> One wug, two wugs: Sofia Rest’s research studies nonword pluralization Categories Awards and Honors Undergraduate Stories The third-year computer science student has been selected for a Provost’s Undergraduate Research Award to pursue this research.'
