["https://www.cs.jhu.edu/academic-programs/graduate-studies/ms-in-security-informatics/scholarships"]
title = "Scholarships - Department of Computer Science"
description = "The Information Security Institute offers several scholarships for outstanding applicants interested in pursuing an MSSI degree. All scholarships are subject to funding availability."
full_description = "The Information Security Institute offers several scholarships for outstanding applicants interested in pursuing an MSSI degree. All scholarships are subject to funding availability. DoD Cyber Service Academy (DoD CSA) U.S. citizens only The National Security Agency, in conjunction with the Department of Defense (DoD), funds the DoD Cyber Service Academy (CSA). The purpose of the CSA is to fill the ranks of higher education with a steady stream of promising candidates to staff the nation’s network security agencies. Selected students will have a service requirement equal to the length of their scholarship plus a summer internship with a federal, state, local, or tribal government in a position related to cybersecurity. If you are interested in and eligible for this opportunity, you must first submit a completed application to the MSSI program. Secondly, you must fully complete the CSA application found here. Lastly, please notify Revelie Williams once all materials for both the MSSI and DoD applications have been submitted. Full consideration will be given for notifications received by 11:59 PM EST on February 1st. NSF Cybercorps®: Scholarship for Service Program (SFS) U.S. citizens only The National Science Foundation (NSF) CyberCorps: Scholarship for Service program provides fellowship funding for students interested in pursuing a career in a cybersecurity-related field. Funding under this program covers tuition, fees, and required books, as well as an additional stipend. Selected students will have a service requirement equal to the length of the scholarship plus a summer internship with a federal, state, local, or tribal government in a position related to cybersecurity. If you are interested in and eligible for this opportunity, you must first apply to the MSSI program, including an additional 1-page supplemental document detailing your interest in this scholarship. Applications must be received no later than 11:59 PM EST on November 15th for the spring semester and March 1st for the fall semester. Please notify Revelie Williams once your completed application has been submitted. Information Security Institute Fellowship (ISIF) To attract the brightest minds in cybersecurity, the ISI has established the Information Security Institute Fellowship (ISIF). This prestigious fellowship is awarded as follows: The ISIF is merit-based and awarded to selected MSSI applicants with outstanding academic credentials; The first half of this fellowship, upon your accepting your admission and enrolling into the MSSI program with full-time status, is to be used in the first semester toward your tuition; The second half is to be applied in the second semester, provided that you maintain good academic performance, including an average grade of B or above in your coursework and continuous full-time status; This fellowship can only be used if you do not receive other scholarships that provide a full tuition waiver and/or stipend, including but not limited to the CySP or SFS scholarships. To ensure full consideration for the ISIF, please submit your admission application by the application deadline. There is no separate application required to apply for the ISIF at this time. Information Security Institute Fellowship for Veterans (ISIF-V) Veterans who have provided service to our nation are among the best students in our program; as such, the ISI has established the Information Security Institute Fellowship for Veterans (ISIF-V). This prestigious fellowship is awarded as follows: The ISIF-V is a merit-based award given to selected MSSI applicants with outstanding academic credentials who have completed at least one year service in the US military; Eligibility for the ISIF-V is similar to that specified for veterans’ benefits. During the application process you must work with the Veterans Affairs Certifying Official on our campus to submit your eligibility document. Please note that this process can be separate from your enrollment for other veterans’ benefits on campus. The first half of this fellowship, upon your accepting your admission and enrolling into the MSSI program with full-time status, is to be awarded in the first semester; The second half is to be applied in the second semester, provided that you maintain good academic performance, including an average grade of B or above in coursework and continuous full-time status; This fellowship can only be used if you do not receive other scholarships that provide a full tuition waiver and/or stipend, including but not limited to the CySP or SFS scholarships. To ensure full consideration for the ISIF-V, please submit your admission application by the application deadline. Please let us know of your interest in the ISIF-V in your application and work with us to finish your eligibility verification. National Science Foundation Graduate Research Fellowship Program (NSF GRFP) The NSF GRFP recognizes and supports outstanding graduate students in NSF-supported STEM disciplines who are pursuing research-based master’s and doctoral degrees at accredited U.S. institutions. The five-year fellowship includes three years of financial support, including an annual stipend of $34,000 and a cost of education allowance of $12,000 to an accredited institution. The Graduate Research Fellowship Operations Center is responsible for processing applications and responding to requests for information. General inquiries regarding the GRFP should be made to: Graduate Research Fellowship Operations Center Phone: 866-NSF-GRFP, 866-673-4737 (toll-free from the U.S. and Canada), or 202-331-3542 (international) Email: info@nsfgrfp.org"
