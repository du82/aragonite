["https://www.cs.jhu.edu/research/human-computer-interaction"]
title = "Human-Computer Interaction - Department of Computer Science"
description = "Placing people at the center of technological innovation."
full_description = 'As we build and transition into the autonomous future, it is critical to place people at the center of our technological innovations. These technologies must be designed for users from the ground up, and how they will be used must shape the research of such technology. Human-computer interaction must take a leadership role in ensuring that the technology introduced into our world is usable, safe and secure—and promotes a better society. At Johns Hopkins, HCI research is highly multidisciplinary, with relevant faculty spread across areas within Computer Science, as well as other departments in the Whiting School of Engineering, the School of Medicine, the Bloomberg School of Public Health, the School of Nursing, and the Applied Physics Laboratory. Research Groups and Labs Advanced Robotics and Computationally AugmenteD Environments Lab The ARCADE Lab develops collaborative intelligent systems that support clinical workflows to increase access to—and expand the possibilities of—highest-quality health care. In designing these systems, they pioneer human-centered solutions that are enabled by synergistic advancements across imaging, computer vision, machine learning, and interaction design and that are embodied in emerging technology such as mixed reality and robotics. ARCADE Lab Intuitive Computing Laboratory The Intuitive Computing Laboratory focuses on designing and building intuitive interaction capabilities for computing and robotics technologies to be integrated into human environments to enhance supported task performance and user experience. Intuitive Computing Laboratory Laboratory for Computational Sensing and Robotics The LCSR’s mission is to create knowledge and foster innovation to further the field of robotics science and engineering. The center’s researchers see robotics as an essential link between computation and action that enhances the health, safety, and efficacy of humanity. Laboratory for Computational Sensing and Robotics Malone Center for Engineering in Healthcare The Malone Center for Engineering in Healthcare brings together engineers, clinicians, and care providers who are leveraging data analytics in novel ways, pioneering new technologies, and applying systems engineering principles to speed the deployment of research-based innovations that will enhance the efficiency, effectiveness, and consistency of health care. Malone Center for Engineering in Healthcare People Mark Dredze Interim Deputy Director of the Data Science and AI Institute, Associate Head of Research and Strategic Initiatives, and John C. Malone Professor Department of Computer Science﻿ Email: mdredze@cs.jhu.edu Anjalie Field Assistant Professor Department of Computer Science﻿ Email: afield6@jhu.edu Chien-Ming Huang John C. Malone Assistant Professor Department of Computer Science﻿ Email: chienming.huang@jhu.edu Phone: 410-516-4537 Daniel Khashabi Assistant Professor Department of Computer Science﻿ Email: danielk@jhu.edu Tom Lippincott Associate Research Professor Department of Computer Science﻿ Email: tom@cs.jhu.edu Tianmin Shu Assistant Professor Department of Computer Science﻿ Email: tianmin.shu@jhu.edu Russell Taylor John C. Malone Professor Department of Computer Science﻿ Department of Mechanical Engineering﻿ Email: rht@jhu.edu Phone: 410-516-4639 Mathias Unberath John C. Malone Associate Professor Department of Computer Science﻿ Email: mathias@jhu.edu Phone: 410-516-4253 Ziang Xiao Assistant Professor Department of Computer Science﻿ Email: ziang.xiao@jhu.edu <img class="visual_image" src="https://www.cs.jhu.edu/wp-content/uploads/2022/12/bigstock-Future-Artificial-Intelligence-349070134-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2022/12/bigstock-Future-Artificial-Intelligence-349070134-980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2022/12/bigstock-Future-Artificial-Intelligence-349070134-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2022/12/bigstock-Future-Artificial-Intelligence-349070134-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2022/12/bigstock-Future-Artificial-Intelligence-349070134-300x200.jpg 300w" sizes="100vw" alt="Two human hands are typing on a laptop. A robotic hand emerges from the laptop screen to point to blue technological figures floating in the air." itemprop="image"> Putting users at the center of explainable AI development In new commentary, researchers explain why developers must tailor AI systems and algorithms to their intended users. Learn more'
