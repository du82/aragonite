title = "Graduate Studies - Department of Computer Science"
description = "Our goal is to create a collaborative and empowering environment for over 350 graduate students."
full_description = 'Working side-by-side with faculty who are redefining their fields of inquiry, graduate students in the Department of Computer Science apply their skills to topics ranging from mitigating the effects of nefarious computer hackers to building smart AI into novel systems to improving our ability to diagnose and treat disease. Over the past two years alone, the links between our field and the most influential world events have been a constant. There are direct connections to the COVID-19 response, such as the role of computational biology in characterizing variants and the use of geographical data systems in tracking infections, mortality, and vaccinations. The worldwide struggle for racial and social justice also needs to be supported by machine learning and artificial intelligence algorithms that are anti-racist. Fair elections and trustworthy news rely on information technology tools that combat disinformation. We invite you to learn more about our graduate programs and consider the many ways we can help you make an impact on the world. Graduate Programs in Computer Science <img class="topic_image" src="https://www.cs.jhu.edu/wp-content/uploads/2021/10/deep-learning-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2021/10/deep-learning-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/deep-learning-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/deep-learning-300x200.jpg 300w" sizes="100vw" alt="A student presents his poster to his classmates." itemprop="image"> Master of Science in Engineering in Computer Science Students in our MSE program gain firsthand knowledge of current research and its applications and can develop an academic program that meets their academic and professional interests and goals. MSE in Computer Science <img class="topic_image" src="https://www.cs.jhu.edu/wp-content/uploads/2021/11/Untitled-design-47-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2021/11/Untitled-design-47-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2021/11/Untitled-design-47-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2021/11/Untitled-design-47-300x200.jpg 300w" sizes="100vw" alt="A digital target centers on an iris." itemprop="image"> Master of Science in Security Informatics (MSSI) The full-time MSSI program is an immersive, three-semester program providing educational, research, and professional opportunities that are simply unparalleled in this rapidly expanding field. MS in Security Informatics <img class="topic_image" src="https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU9827-300x200.jpeg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU9827-740x494.jpeg 740w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU9827-500x334.jpeg 500w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU9827-300x200.jpeg 300w" sizes="100vw" alt="Professor Ehsan Azimi wears augmented reality glasses and probes a phantom skull." itemprop="image"> PhD in Computer Science Students who complete our PhD program are well-prepared for careers in academia, research, government, and industry. PhD in Computer Science “The department’s combination of theoretical foundation and hands-on experience prepared me to understand and tackle research challenges. The faculty also actively promote industry collaborations and helped connect me with world-leading researchers within JHU and beyond. ” <img class="testimonial_image" src="https://www.cs.jhu.edu/wp-content/uploads/2023/08/Li-Zhaoshuo-photo-e1692372701403-100x100.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2023/08/Li-Zhaoshuo-photo-e1692372701403-300x300.jpg 300w, https://www.cs.jhu.edu/wp-content/uploads/2023/08/Li-Zhaoshuo-photo-e1692372701403-100x100.jpg 100w" sizes="100vw" alt="Headshot of Zhaoshuo &quot;Max&quot; Li."> Zhaoshuo “Max” Li ‘19 (MSE), ‘22 (PhD) <img class="topic_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/10/Untitled-design-1-1-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/10/Untitled-design-1-1.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/10/Untitled-design-1-1-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/10/Untitled-design-1-1-300x200.jpg 300w" sizes="100vw" alt="Home to Hopkins." itemprop="image"> Home to Hopkins Full-time students are eligible to take up to two online courses through the Engineering for Professionals program the summer before they start their full-time, residential master’s program. These courses apply to their master’s degree if satisfactorily completed. It’s a new, transformative way to earn your master’s degree! Request Info Join us Learn about the graduate admissions process of Johns Hopkins engineering and start your application today. Learn about graduate admissions Start your application today <img class="visual_image" src="https://www.cs.jhu.edu/wp-content/uploads/2020/01/Deep-learning-19-class-pic-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2020/01/Deep-learning-19-class-pic-980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2020/01/Deep-learning-19-class-pic-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2020/01/Deep-learning-19-class-pic-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2020/01/Deep-learning-19-class-pic-300x200.jpg 300w" sizes="100vw" alt="Students present final projects for Machine Learning: Deep Learning in Hackerman Hall." itemprop="image"> For Current Students Policies, resources, forms, course information, and services for graduate students. RESOURCES FOR GRADUATE STUDENTS'
