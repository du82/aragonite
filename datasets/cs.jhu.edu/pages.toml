["https://www.cs.jhu.edu/faculty/suchi-saria"]
title = "Suchi Saria - Department of Computer Science"
description = "Suchi Saria is the John C. Malone Associate Professor of computer science at the Whiting School of Engineering and of statistics and health policy at the Bloomberg School of Public…"
full_description = '{ "@context": "http://schema.org", "@type": "Person", "email": "mailto:ssaria1@jhu.edu", "image": "", "jobTitle": "John C. Malone Associate Professor", "name": "Suchi Saria", "telephone": "410-516-4126", "url": "https://www.cs.jhu.edu/faculty/suchi-saria/", "address": "342 Malone Hall" } Contact 410-516-4126 ssaria1@jhu.edu Location 342 Malone Hall Research Areas Machine learning Computational health informatics Probabilistic Methods Time Series Models Information extraction in domains with structured and unstructured data Predictive modeling in healthcare. Connect Google Scholar Website Twitter Suchi Saria is the John C. Malone Associate Professor of computer science at the Whiting School of Engineering and of statistics and health policy at the Bloomberg School of Public Health. She directs the Machine Learning and Healthcare Lab and is the founding research director of the Malone Center for Engineering in Healthcare. She is also a member of the Data Science and Artificial Intelligence Institute. Saria’s goal is to use sophisticated computer science and the deluge of data available in health care and other settings to individualize patient care and to save lives. Her pioneering work centers on enabling new classes of diagnostic and treatment planning tools for health care—tools that use statistical machine-learning techniques to tease out subtle information from “messy” observational datasets and provide reliable inferences for individualizing care decisions. Saria’s work provides an entry point into a future in which the data collected from a large number of patients may reliably inform physicians about the best treatment plans for individual patients. For instance, algorithms that she created are being used today in hospitals to predict with startling accuracy which patients will succumb to deadly sepsis (a condition that annually kills more people than breast and prostate cancer combined)— work that led to her being named to Business Insider’s 2024 AI Power List; one of Popular Science magazine’s “Brilliant 10” (2016); one of MIT’s “35 Innovators Under 35” (2017); and a member of the World Economic Forum’s Young Global Leaders (2018). For another project, Saria and her team created an app that allows patients with Parkinson’s disease to track their symptoms on their personal smartphones. Rather than relying on the subjective observations of a medical staff member in a clinical setting, giving patients the ability to report on their symptoms at any time of day, in a clinic or within their own home, can better capture the day-to-day variability of Parkinson’s symptoms and provide doctors with a clearer picture of their patients’ overall health and how well their medications are working. This work is considered groundbreaking because though other mobile studies also collect data “in the wild,” few have found ways to validate it clinically because that process requires the expensive and laborious collection of benchmark (also called “gold standard”) data at home. Saria solved this issue by developing a machine learning framework that uses “weak supervision”—information that is inexpensive and readily collected at home—to train algorithms for progression monitoring from mobile data. Saria’s work has received recognition, including: best paper awards at machine learning, informatics, and medical venues; a Rambus Fellowship (2004-2010); an NSF Computing Innovation Fellowship (2011); selection by IEEE Intelligent Systems to Artificial Intelligence’s “10 to Watch” (2015); the DARPA Young Faculty Award (2016); and the Sloan Research Fellowship (2018). In 2017, Saria’s work was among four research contributions presented by France Córdova, Director of the National Science Foundation, to the U.S. House of Representatives” Commerce, Justice Science Appropriations Committee. She was invited to join the National Academy of Engineering’s Frontiers of Engineering program in 2017 and, in 2018, to join the National Academy of Medicine’s program for Emerging Leaders in Health and Medicine. Saria came to Johns Hopkins in 2012. Prior to that, she received her Ph.D. from Stanford University working with Daphne Koller. Related News View All News <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/11/3-people-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/11/3-people.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/11/3-people-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/11/3-people-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/11/3-people-300x200.jpg 300w" sizes="100vw" alt="Headshots of Drew Prinster, Yiqing Shen, and Yunjuan Wang."> Three graduate students named 2024–2025 AI2AI Fellows Categories Graduate Stories Awards and Honors Drew Prinster, Yiqing Shen, and Yunjuan Wang were selected based on their outstanding publication records, research proposals, and mentor support. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/10/Untitled-design-1-3-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/10/Untitled-design-1-3.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/10/Untitled-design-1-3-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/10/Untitled-design-1-3-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/10/Untitled-design-1-3-300x200.jpg 300w" sizes="100vw" alt="Grayscale image of Suchi Saria on a green geometric background."> Suchi Saria named to Business Insider’s 2024 AI Power List Categories Awards and Honors The list identifies Saria as one of “the 100 most powerful people in artificial intelligence.” <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2018/02/Suchi-Saria-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2018/02/Suchi-Saria.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2018/02/Suchi-Saria-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2018/02/Suchi-Saria-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2018/02/Suchi-Saria-300x200.jpg 300w" sizes="100vw" alt="Headshot of Suchi Saria wearing a white scarf in front of a whiteboard."> Suchi Saria named 2024 WebMD Health Hero Categories Awards and Honors This year’s WebMD Health Hero Awards recognize individuals who are leveraging AI to transform health care.'
