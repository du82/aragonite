title = "Department Seminars - Department of Computer Science"
description = "Details: WHERE: B-17 Hackerman Hall, unless otherwise noted WHEN: 10:30 a.m. refreshments available, seminar runs from 10:45 a.m. to 12 p.m., unless otherwise noted Recordings will be available online after…"
full_description = "Details: WHERE: B-17 Hackerman Hall, unless otherwise noted WHEN: 10:30 a.m. refreshments available, seminar runs from 10:45 a.m. to 12 p.m., unless otherwise noted Recordings will be available online after each seminar. Schedule of Speakers Click to expand for talk title, abstract, and speaker biography. 3/6/25 Yangruibo “Robin” Ding Columbia University Please note this seminar will take place in 228 Malone Hall. Zoom link >> Computer Science Seminar Series “Advancing Code Intelligence with Language Models” Abstract: Large language models have broadly revolutionized programming and software development. In this talk, Yangruibo “Robin” Ding will discuss his research on enabling LLMs to meet the real-world demands of software engineering. First, he will describe how we can improve LLMs’ code reasoning capabilities by training them with comprehensive program semantics, enhancing their effectiveness in code generation, runtime analysis, and self-debugging. Second, Ding will discuss how we can adapt LLMs for realistic programming practice, enabling these models to retrieve additional context, interact with symbolic tools to collect feedback, and iteratively refine their solutions. Third, he will introduce his efforts to develop code-embedding language models that represent program functionalities with vectors to support non-generative tasks, such as code search, clone retrieval, and vulnerability detection. Finally, Ding will envision the future of AI systems for software engineering, which will achieve the next level of automation in a more reliable, intelligent, and cost-efficient way. Speaker Biography: Yangruibo “Robin” Ding is a PhD candidate in the Department of Computer Science at Columbia University. His research is at the intersection of software engineering and machine learning, focusing on developing large language models for code. Ding trains LLMs to generate, analyze, and refine software programs and constructs benchmarks to systematically evaluate LLMs in solving software engineering tasks. He also studies how to improve LLMs’ reasoning capabilities to tackle complex programming tasks such as debugging and patching. His interdisciplinary research has been published in top-tier conferences of software engineering, programming languages, natural language processing, and machine learning. His work has won an ACM SIGSOFT Distinguished Paper Award and was an IEEE Transactions on Software Engineering Best Paper Runner-Up; he has also received an IBM PhD Fellowship Award. 3/6/25 Tamar Rott Shaham Massachusetts Institute of Technology Please note this seminar will take place at 12:15 p.m. in 228 Malone Hall. Refreshments will be available at noon. Zoom link >> Computer Science Seminar Series “Understanding and Enhancing Deep Neural Networks with Automated Interpretability” Abstract: Deep neural networks are becoming incredibly sophisticated; they can generate realistic images, engage in complex dialogues, analyze intricate data, and execute tasks that appear almost humanlike. But how do such models achieve these abilities? In this talk, Tamar Rott Shaham will present a line of work that aims to explain behaviors of deep neural networks. This includes a new approach for evaluating cross-domain knowledge encoded in generative models, tools for uncovering core mechanisms in large language models, and their behavior under fine-tuning. She will show how to automate and scale the scientific process of interpreting neural networks with the Automated Interpretability Agent, a system that autonomously designs experiments on models’ internal representations to explain their behaviors. Shaham will demonstrate how such understanding enables mitigating biases and enhancing models’ performance. The talk will conclude with a discussion of future directions, including developing universal interpretability tools and extending interpretability methods to automate scientific discovery. Speaker Biography: Tamar Rott Shaham is a postdoctoral researcher at the Massachusetts Institute of Technology’s Computer Science and Artificial Intelligence Laboratory working with Antonio Torralba. Shaham earned her PhD from the Technion Faculty of Electrical and Computer Engineering, supervised by Tomer Michaeli. She has received several awards, including the 2019 International Conference on Computer Vision Marr Prize, a Google Women Techmakers Scholarship, an Adobe Research Fellowship, a Rothschild Fellowship, the VATAT Zuckerman Israeli Postdoctoral Scholarship, and the Schmidt Sciences Israeli Women’s Postdoctoral Award. 3/10/25 Xinyu “Crystina” Zhang University of Waterloo Please note this seminar will take place at 12:00 p.m. Zoom link >> Computer Science and Center for Language and Speech Processing Seminar Series “Information-Seeking Beyond English” Abstract: Pre-trained language models have brought revolutionary progress to information-seeking in the English world. While the advance is exciting, how to transfer such progress into non-English—and especially lower-resource—languages presents new challenges that require developing new resources and methodologies. In this talk, Xinyu “Crystina” Zhang will present her research on building effective information-seeking systems for non-English speakers. She will begin by introducing the benchmarks and datasets developed to support the evaluation and training of the multilingual search systems. These resources have since become widely adopted within the community and enable the development of effective multilingual embedding models. The next part of her talk will share the best training practices found in such model development, including strategies for enhancing backbone models and surprising transfer effects across languages. Building on these foundations, Zhang’s work expanded to understand how language models process multilingual text and facilitate knowledge transfer across languages. Her talk will conclude with a vision for the future of multilingual language model development, with the goal of adapting these models to unseen languages with minimal data and resource requirements and thus bridging the gap for underrepresented linguistic communities. Speaker Biography: Xinyu “Crystina” Zhang is a PhD candidate at the University of Waterloo, where she is advised by Professor Jimmy Lin. Zhang’s research focuses on enhancing search systems in multilingual scenarios, with works featured at top natural language processing and information retrieval conferences and journals such as Transactions of the Association for Computational Linguistics, ACM Transactions on Information Systems, the Meeting of the Association for Computational Linguistics, and the International ACM SIGIR Conference on Research and Development in Information Retrieval. Zhang has hosted competitions on multilingual retrieval in the 2022 ACM International Conference on Web Search and Data Mining Cup and the 2023 ACM Forum for Information Retrieval Evaluation, and received Outstanding Paper Awards at the 2024 Conference on Empirical Methods in Natural Language Processing and a Best Paper Award nomination at SIGIR 2024. She has interned at Google DeepMind, Cohere, the Max Planck Institute for Informatics, and NAVER. Prior to graduate school, she received her bachelor’s degree in computer science from the Hong Kong University of Science and Technology in 2020. 3/11/25 Yiwei Lyu Carnegie Mellon University Please note this seminar will take place at 12:15 p.m. in 228 Malone Hall. Refreshments will be available at noon. Zoom link >> Computer Science Seminar Series “Conscience in Motion: Safe Decision-Making Towards Responsible Robotics” Abstract: As robots become increasingly integrated into our daily lives, ranging from household assistants to autonomous vehicles, ensuring that they make safe, reliable, and ethically sound decisions is more urgent than ever. In this talk, Yiwei Lyu will present her research on achieving provable safety for robots operating in uncertain, unstructured environments. She will begin by introducing a control-theoretic framework that provides a mathematical foundation for guaranteeing safety in probabilistic settings while allowing a robot to accomplish its tasks without being overly conservative. Building on this, Lyu will explore the challenge of collective safety in multi-agent systems, where robots must collaborate with heterogeneous teammates in a decentralized manner and make context-aware decisions. She will show how a novel responsibility reasoning approach, combined with rigorous control-theoretic methods, can lead to group intelligence with formal safety assurances. Next, she will discuss how to learn under-defined safety specifications by blending data-driven learning with control-theoretic techniques, addressing the question, “How safe is safe?” and enabling robots to adapt and refine safety constraints in real time. Lyu will conclude by outlining a vision for responsible robotics—systems that not only guarantee physical safety, but also align their behavior with human values, comply with ethical and legal standards, and seamlessly integrate into sectors such as health care, transportation, and domestic environments. Speaker Biography: Yiwei Lyu is a final-year PhD candidate in the Department of Electrical and Computer Engineering at Carnegie Mellon University, advised by Dr. John Dolan. Lyu’s research in robotics sits at the intersection of control theory, machine learning, and social science, with broad interests in safe control and verification, behavior planning, and human-robot interaction. Specifically, she develops principled methods to enable safe robot autonomy in multi-agent systems, supporting effective collaboration among robots and between robots and humans in uncertain, dynamic environments. Lyu is a recipient of the Qualcomm Innovation Fellowship and received an honorable mention for the Jane Street Graduate Research Fellowship. She was also recognized as an IEEE/ACM Human-Robot Interaction Pioneer and named a 2024 Massachusetts Institute of Technology Electrical Engineering and Computer Science Rising Star. Her work has earned best paper awards and nominations at multiple conferences, including the International Conference on Autonomous Agents and Multiagent Systems, the AAAI Conference on Artificial Intelligence, and the IFAC Workshop on Cyber-Physical Human Systems, as well as workshops at the IEEE International Conference on Robotics and Automation, the IEEE/RSJ International Conference on Intelligent Robots and Systems, and the International Joint Conference on Artificial Intelligence. Prior to joining Carnegie Mellon in 2019, Lyu earned her bachelor’s degree in electronic and information engineering from the Chinese University of Hong Kong, Shenzhen. 3/13/25 Tiziano Piccardi Stanford University Please note this seminar will take place in 228 Malone Hall. Zoom link >> Computer Science Seminar Series “Tuning Our Algorithmic Amplifiers: Embedding Pro-Social Values Into Online Platforms” Abstract: The design of online platforms plays a critical role in shaping public discourse—yet these same platforms can unintentionally contribute to misinformation, polarization, and social harm. Tiziano Piccardi’s research investigates how to reorient these platforms toward positive societal outcomes by re-imagining the algorithmic and design principles at their core. In this talk, Piccardi will present AI-driven designs that (1) reduce the harmful societal effects of social media and (2) enhance the reliability of open knowledge platforms like Wikipedia. He will introduce a framework for running large-scale algorithmic reranking field experiments without platform collaboration and share results from a large-scale experiment on X (formerly Twitter), where a large language model-based system reranked feeds in real-time to mitigate political polarization. Piccardi will then discuss tools and studies that have shaped Wikipedia’s design, reinforcing its role as the world’s largest online encyclopedia and a trusted global information source accessed by millions daily. By translating research into deployable tools and real-world applications, Piccardi’s work demonstrates how embedding societal values into platform design can foster healthier online information environments. Speaker Biography: Tiziano Piccardi is a postdoctoral scholar in the Computer Science Department at Stanford University, working in its human-computer interaction group. He earned his PhD in data science from the École Polytechnique Fédérale de Lausanne. Piccardi’s research focuses on social computing and web research, aiming to improve the design of online platforms, including social media and open knowledge ecosystems. He is a long-term formal collaborator with Wikimedia Research, contributing to the enhancement of Wikipedia. He is also a fellow of the Swiss National Science Foundation and Stanford Impact Labs. 3/13/25 Uthsav Chitra Eric and Wendy Schmidt Center at Broad Institute Please note this seminar will take place at 12:15 p.m. in 228 Malone Hall. Refreshments will be available at noon. Zoom link >> Computer Science & Biomedical Engineering Seminar Series “Machine Learning for Spatial and Network Biology” Abstract: Biological systems are organized across a hierarchy of scales, from the spatial organization of cells in tissues to networks of interactions between genes and proteins. However, the systematic study of spatial and network processes is challenged by high levels of heterogeneity, sparsity, and other forms of noise in modern sequencing data. In this talk, Uthsav Chitra presents new statistical and machine learning methodologies for spatial and network biology. First, he introduces “gene expression topography,” a fundamentally new paradigm for modeling spatial gradients and tissue geometry from sparse spatial data. He derives algorithms for learning “topographic maps” of 2D tissue slices using tools from complex analysis and interpretable deep learning. These maps reveal the spatial and molecular organization of tissues from the brain, skin, and tumor microenvironment. Second, Chitra introduces a statistical framework for anomaly detection in biological interaction networks, or the problem of identifying anomalous subnetworks of interacting disease genes and proteins. He proves that many widely used algorithms are statistically biased—resolving a 20-year-old open question on why these methods identify large and unrealistic subnetworks—and derives asymptotically unbiased and efficient algorithms for network anomaly detection. Taken together, Chitra’s research underscores the need for specialized, principled, and interpretable ML approaches for advancing biomedical discovery. Speaker Biography: Uthsav Chitra is a postdoctoral fellow at the Eric and Wendy Schmidt Center at the Eli and Edythe L. Broad Institute of MIT and Harvard. He recently received his PhD in computer science from Princeton University. Chitra’s re"
