["https://www.cs.jhu.edu/research/information-security"]
title = "Information Security - Department of Computer Science"
description = "Hopkins researchers are working to safeguard our digital world."
full_description = 'As we become more reliant on digital technologies, protecting online information and data is of critical importance. To address this need, our department has developed a large research portfolio related to computer security, privacy, and assurance. Housed within the Department of Computer Science is the Johns Hopkins Institute for Information Security, a leading hub for research and education in cryptography, privacy, medical information security, and software and system security. Through ISI’s leadership, the National Security Agency and the Department of Homeland Security have designated Johns Hopkins University as a Center of Academic Excellence in Information Assurance in Research and Education. Research Centers and Labs Advanced Research in Cryptography Lab Research at the ARC Lab covers all aspects of theoretical and applied cryptography. Advanced Research in Cryptography Lab Information Security Institute The JHU ISI is the university’s focal point for research and education in computer security, privacy, and assurance. Johns Hopkins Information Security Institute Security and Privacy in the Lifecycle of IoT for Consumer Environments The Security and Privacy in the Lifecycle of IoT for Consumer Environments Project, or SPLICE, addresses Internet of Things risks by examining the human, social, and technological scope of the security and privacy challenges emerging in smart homes across a wide range of residential stakeholders, including owners, occupants, renters, visitors, and domestic workers. SPLICE People Yinzhi Cao Technical Director of the JHU Information Security Institute and Associate Professor Department of Computer Science﻿ Email: yinzhi.cao@jhu.edu Phone: 410-516-6718 Anton Dahbura Executive Director of the Johns Hopkins University Information Security Institute and Co-Director of the Johns Hopkins Institute for Assured Autonomy Department of Computer Science﻿ Email: AntonDahbura@jhu.edu Phone: 410-516-0211 Matthew Green Associate Professor Department of Computer Science﻿ Email: mgreen@cs.jhu.edu Phone: 410-861-0344 Susan Hohenberger-Waters Research Professor Department of Computer Science﻿ Email: susan@cs.jhu.edu Abhishek Jain Associate Professor Department of Computer Science﻿ Email: abhishekjain@jhu.edu Phone: 410-516-4276 Xiangyang Li Master of Science in Security Informatics Program Director and Associate Teaching Professor Department of Computer Science﻿ Email: xyli@jhu.edu Phone: 410-516-8521 Alex Marder Assistant Professor Department of Computer Science﻿ Email: amarder@jhu.edu Aviel D. Rubin Professor Emeritus Department of Computer Science﻿ Email: rubin@jhu.edu Phone: 410-516-8177 <img class="visual_image" src="https://www.cs.jhu.edu/wp-content/uploads/2023/11/laptop-nighttime100123-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2023/11/laptop-nighttime100123-980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2023/11/laptop-nighttime100123-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2023/11/laptop-nighttime100123-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2023/11/laptop-nighttime100123-300x200.jpg 300w" sizes="100vw" alt="Laptop on table at night." itemprop="image"> AI image generators can be tricked into making NSFW content New safety tests by Johns Hopkins researchers reveal vulnerabilities of popular systems like DALL-E 2. Learn more'
