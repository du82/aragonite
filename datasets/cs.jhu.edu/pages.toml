["https://www.cs.jhu.edu/about"]
title = "About - Department of Computer Science"
description = "Johns Hopkins Computer Science offers a variety of bachelor’s, master’s, and doctoral programs. Research encompasses core computer science topics and a range of application areas, including medical robotics, AI, and cybersecurity."
full_description = 'Welcome to the Department of Computer Science at Johns Hopkins University, the nation’s first research institution. The department is dedicated to upholding the university’s long-standing tradition of excellence in research, education, and civic engagement. Research-Focused Our faculty and students collaborate across Johns Hopkins divisions, including with colleagues at the School of Medicine and the Applied Physics Laboratory, and are advancing discovery in areas ranging from AI, computational biology and medicine, and information security to machine learning, robotics, and speech and language processing. Excellence in Academics We offer BS, BA, and multiple graduate degree programs, which means our students can pursue a course of study that suits their specific interests and career goals while also ensuring that they have the foundational knowledge experiences they need to achieve professional success—no matter what path they choose. Active and Engaged Alumni Join our community and you’ll be part of a global network of alumni that includes entrepreneurs and leaders in a wide variety of industries—from cutting-edge tech firms to finance and medicine—as well as in academia, all of whom are invested and involved in our students’ success. Quick Facts <img class="card_group_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU4667-1-300x169.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU4667-1-740x416.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU4667-1-500x282.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU4667-1-300x169.jpg 300w" sizes="100vw" alt="Students walking on Keyser Quad."> 704Undergraduate students Many of our undergraduates participate in research and work in laboratories. <img class="card_group_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2019/05/Ryan-Demo-2Masters-Graduation_0233-300x169.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2019/05/Ryan-Demo-2Masters-Graduation_0233-740x416.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2019/05/Ryan-Demo-2Masters-Graduation_0233-500x282.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2019/05/Ryan-Demo-2Masters-Graduation_0233-300x169.jpg 300w" sizes="100vw" alt="Ryan Demo stands next to the Johns Hopkins University Homewood campus sign in graduation garb."> 308Master’s students We offer two highly-ranked master’s programs in computer science and information security, giving students the advanced technical skills they’ll need to take on leadership roles in the field. <img class="card_group_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU5140-300x169.jpeg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU5140-740x416.jpeg 740w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU5140-500x282.jpeg 500w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU5140-300x169.jpeg 300w" sizes="100vw" alt="Students in the Robotorium programming a robotic arm."> 231PhD students PhD students work closely with our faculty experts. We are proud to train the next generation of scholars in computer science research. <img class="card_group_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2021/10/WKB7939-300x169.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2021/10/WKB7939-740x416.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/WKB7939-500x282.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/WKB7939-300x169.jpg 300w" sizes="100vw" alt="The Johns Hopkins University sign. Blue and white flowers are planted in front of it."> #19Computer science program At the undergraduate level per the annual U.S. News and World Report Best Colleges rankings. Apply Now Learn about the admissions process and become a Hopkins Engineer Undergraduate Admissions Graduate Admissions Making an Impact <img class="card_group_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/08/About-Page-Making-an-Impact-Thumbnail-300x169.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/08/About-Page-Making-an-Impact-Thumbnail.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/About-Page-Making-an-Impact-Thumbnail-500x282.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/About-Page-Making-an-Impact-Thumbnail-300x169.jpg 300w" sizes="100vw" alt="Someone holding a smartphone records footage of a city scene."> Curating more nuanced news footage Smartphone videos are often the first to capture news events. Johns Hopkins researchers are developing a tool to make that footage more searchable and contextualized. <img class="card_group_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/08/About-Page-Making-an-Impact-Thumbnail-1-300x169.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/08/About-Page-Making-an-Impact-Thumbnail-1.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/About-Page-Making-an-Impact-Thumbnail-1-500x282.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/About-Page-Making-an-Impact-Thumbnail-1-300x169.jpg 300w" sizes="100vw" alt="Mark Dredze presents “AI and Language” at the AI Essentials for Congressional Staffers Information Session."> Navigating AI in policy Experts including John C. Malone Professor of Computer Science Mark Dredze briefed policymakers about the potential of AI to advance everything from national security to medicine. <img class="card_group_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/08/About-Page-Making-an-Impact-Thumbnail-4-300x169.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/08/About-Page-Making-an-Impact-Thumbnail-4.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/About-Page-Making-an-Impact-Thumbnail-4-500x282.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/About-Page-Making-an-Impact-Thumbnail-4-300x169.jpg 300w" sizes="100vw" alt="A robot arm with a neuroendoscope positioned in relation to a human head “phantom” for the experimental validation of an augmented neuroendoscopy system."> A SLAM dunk for safer brain surgery Johns Hopkins computer scientists are part of a team working on a surgical visualization method that doesn’t require additional equipment or expose patients to the extra radiation or long scan times typically associated with live imaging. <img class="card_group_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/08/About-Page-Making-an-Impact-Thumbnail-6-300x169.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/08/About-Page-Making-an-Impact-Thumbnail-6.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/About-Page-Making-an-Impact-Thumbnail-6-500x282.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/About-Page-Making-an-Impact-Thumbnail-6-300x169.jpg 300w" sizes="100vw" alt="Wearing a medal, Jeong Kim poses with President Biden."> A national honor Jeong Kim, Engr ’82, ’89 (MS) received the National Medal of Technology and Innovation, the country’s highest award for technological achievement.'
