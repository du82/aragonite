https://www.cs.jhu.edu/wp-content/uploads/2025/03/unberath_lab-980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2025/03/unberath_lab-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2025/03/unberath_lab-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2025/03/unberath_lab-300x200.jpg 300w" sizes="100vw" alt="A group of 7 ARCADE Lab members and Mathias Unberath pose in the Mock OR."> America’s global scientific edge relies on its investment in research Categories Department News Johns Hopkins computer scientist Mathias Unberath, a leading expert in AI-assisted medicine, says cuts to research funding imperil the nation’s ability to attract the world’s best and brightest scientists. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/12/DaVinci-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/12/DaVinci-980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/12/DaVinci-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/12/DaVinci-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/12/DaVinci-300x200.jpg 300w" sizes="100vw" alt="The da Vinci robotic surgical system."> AI’s stitch in time Categories Research Johns Hopkins researchers successfully taught an AI simulation to close incisions by breaking the complicated suturing process down into simpler subtasks. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-2-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-2.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-2-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-2-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-2-300x200.jpg 300w" sizes="100vw" alt="Computer rendering of human torso, half of it in a semi-transparent, graphical surface style. Blue binary code and neural pathways are in the background."> A touchstone 