["https://www.cs.jhu.edu/academic-programs/graduate-studies/ms-in-security-informatics/mse-admissions"]
title = "Admissions - Department of Computer Science"
description = "The MSSI program is open to outstanding candidates who hold a bachelor's degree with sufficient technical exposure to information technology as preparation for the program's core technology courses."
full_description = "The MSSI program is open to outstanding candidates who hold a bachelor’s degree with sufficient technical exposure to information technology as preparation for the program’s core technology courses. MSSI students are expected to have good knowledge of computer architecture/networking, programming, data structures, and discrete math. This can be shown through courses and, in some cases, through working experience and professional certifications. Application Resources Admissions Information Full-Time Engineering Graduate Program Application Process Combined/Concurrent Degree Application Process Application materials: 2 letters of recommendation TOEFL/IELTS (for international applicants only) Statement of purpose Transcripts Resume/CV Apply free! No application fee required. The Department of Computer Science reviews applications on a holistic basis and does NOT require a GRE score. Standardized Test Information As general reference ONLY, the preferred scores are as follows: Applicants to the MSSI program are not required to submit GRE scores. It is an optional material to submit with your application. TOEFL: 100 OR IELTS Test: 7.0 (for international applicants only) Questions regarding admissions can be sent via email to JHUISI-MSSI@jhu.edu. Application Deadlines We encourage all prospective students to apply as early as possible. To ensure full consideration, all application materials must received by the deadline listed below. Review of applications received after the deadline is not guaranteed. MSSI Degree Applicants: Fall admission – March 15 by 11:59 PM EST (The deadline has been extended. Applications received after March 1 may not receive a decision by March 31.) Spring admission – October 1 by 11:59 PM EST U.S. citizens or permanent residents who are interested in applying for the Department of Defense Cyber Service Academy should complete their application no later January 15th for the fall term. U.S. citizens or permanent residents who are interested in applying for the NSF CyberCorps: Scholarship for Service program should complete their application no later than November 15th for the spring or March 1st for fall admission. BS/MSSI Degree Applicants: Fall admission – March 1 by 11:59 PM EST Spring admission – November 15 by 11:59 PM EDT Contact Information For questions regarding your graduate application, please contact Johns Hopkins University Graduate Admissions."
