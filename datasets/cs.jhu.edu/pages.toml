["https://www.cs.jhu.edu/faculty/russell-taylor"]
title = "Russell Taylor - Department of Computer Science"
description = "Russell H. Taylor is a John C. Malone Professor in the Department of Computer Science with secondary appointments in the Department of Mechanical Engineering and the School of Medicine’s Departments…"
full_description = '{ "@context": "http://schema.org", "@type": "Person", "email": "mailto:rht@jhu.edu", "image": "", "jobTitle": "John C. Malone Professor", "name": "Russell Taylor", "telephone": "410-516-4639", "url": "https://www.cs.jhu.edu/faculty/russell-taylor/", "address": "127 Hackerman Hall" } Contact 410-516-4639 rht@jhu.edu Location 127 Hackerman Hall Research Areas Artificial intelligence Robotics Surgical robots Embodied intelligence Digital twins Human-machine cooperative systems Medical imaging and modeling Computer-integrated interventions Connect Google Scholar Lab Website Website Russell H. Taylor is a John C. Malone Professor in the Department of Computer Science with secondary appointments in the Department of Mechanical Engineering and the School of Medicine’s Departments of Otolaryngology—Head and Neck Surgery, Radiology and Radiological Science, and Surgery. He is also the director of the Laboratory for Computational Sensing and Robotics and of the NSF Engineering Research Center for Computer-Integrated Surgical Systems and Technology. Russell is also a member of the Data Science and Artificial Intelligence Institute. Taylor’s research interests include artificial intelligence, robotics, human-machine cooperative systems, medical imaging and modeling, and computer-integrated interventional systems. In addition to his more than 40 years of professional experience in the fields of computer science, robotics, and computer-integrated interventional medicine, Taylor is editor-in-chief emeritus of the IEEE Transactions on Robotics and Automation and has served on numerous other editorial and scientific advisory boards. In 1994, he was elected as a Fellow of the Institute of Electrical and Electronics Engineers (IEEE) “for contributions in the theory and implementation of programmable sensor-based robot systems and their application to surgery and manufacturing.” He is also a Fellow of the National Academy of Inventors, the American Institute for Medical and Biological Engineering (AIMBE), the Medical Image Computing and Computer Assisted Intervention (MICCAI) Society, and the Engineering School at the University of Tokyo. In 2020, Taylor was elected to the National Academy of Engineering “for contributions to the development of medical robotics and computer-integrated systems.” He is also a recipient of numerous awards, including four IBM Outstanding Achievement Awards, four IBM Invention Awards, the Maurice Müller Award for Excellence in Computer-Assisted Orthopaedic Surgery, the IEEE Pioneer in Robotics and Automation Award, the IEEE Engineering in Medicine and Biology Society’s Technical Field Award, the MICCAI Society Enduring Impact Award, and the Honda Prize. Taylor received a BSE from Johns Hopkins University in 1970 and a PhD in computer science from Stanford University in 1976. He joined IBM Research in 1976, where he developed the AML robot programming language and managed the automation technology department. He then managed IBM’s computer-assisted surgery group before returning to Johns Hopkins in 1995. Related News View All News <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/11/Untitled-design-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/11/Untitled-design.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/11/Untitled-design-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/11/Untitled-design-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/11/Untitled-design-300x200.jpg 300w" sizes="100vw" alt="AI conceptual image."> AI brings autonomous procedures closer, but surgeons still key Categories Department News At a recent Johns Hopkins briefing, Russell Taylor and Mathias Unberath explored the evolving role of robotics and artificial intelligence in surgery. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/10/infiltration-for-lumbar-hernia-2024-06-28-05-07-30-utc-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/10/infiltration-for-lumbar-hernia-2024-06-28-05-07-30-utc-980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/10/infiltration-for-lumbar-hernia-2024-06-28-05-07-30-utc-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/10/infiltration-for-lumbar-hernia-2024-06-28-05-07-30-utc-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/10/infiltration-for-lumbar-hernia-2024-06-28-05-07-30-utc-300x200.jpg 300w" sizes="100vw" alt="A doctor performs a lumbar puncture on a patient."> New wearable augmented reality device could improve accuracy of spinal tap procedures Categories Research Johns Hopkins researchers partnered with a local imaging device company to develop an efficient, real-time lumbar puncture guidance system. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/08/arpa-h-pi-feature-980x654-1-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/08/arpa-h-pi-feature-980x654-1.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/arpa-h-pi-feature-980x654-1-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/arpa-h-pi-feature-980x654-1-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/arpa-h-pi-feature-980x654-1-300x200.jpg 300w" sizes="100vw" alt="The ARPA H logo with a rendering representing precision medicine."> Hopkins team awarded up to $20.9 million in ARPA-H funding to further tumor-removal research Categories Research Awards and Honors A Johns Hopkins-led interinstitutional research team will develop a novel photoacoustic endoscope and fluorescent contrast agent to ensure total tumor removal and preservation of healthy tissue.'
