full_description = 'Researchers in the Natural Language Processing group work at the intersection of computer science, artificial intelligence, and computational linguistics. Projects in this area aim to understand how human language is used to communicate ideas and to develop technology for machine analysis, translation, and transformation of multilingual speech and text. Computer scientists in this group work closely with researchers in other departments via the Whiting School’s Center for Language and Speech Processing. Research Centers and Labs Center for Language and Speech Processing The CLSP conducts research across a broad spectrum of fundamental and applied topics, including acoustic processing, automatic speech recognition, big data, cognitive modeling, computational linguistics, information extraction, machine learning, machine translation, and text analysis. Center for Language and Speech Processing Human Language Technology Center of Excellence The HLTCOE focuses on advanced technology for automatically analyzing a wide range of speech, text, and document data in multiple languages. HLTCOE Linguistics at JHU Within the Department of Cognitive Science, linguistics research focuses on integrating formal linguistics within a broader cognitive science perspective by addressing questions about the nature of linguistic representations themselves, their processing, the architecture and learnability of the grammar, the implementation of linguistic theories in terms of neural computations, and language acquisition in the broader context of cognitive development. Linguistics at JHU People Mark Dredze Interim Deputy Director of the Data Science and AI Institute, Associate Head of Research and Strategic Initiatives, and John C. Malone Professor Department of Computer Science﻿ Email: mdredze@cs.jhu.edu Kevin Duh Assistant Research Professor Department of Computer Science﻿ Email: kevinduh@cs.jhu.edu Jason Eisner Professor Department of Computer Science﻿ Email: eisner@jhu.edu Phone: 410-516-8438 Anjalie Field Assistant Professor Department of Computer Science﻿ Email: afield6@jhu.edu Daniel Khashabi Assistant Professor Department of Computer Science﻿ Email: danielk@jhu.edu Philipp Koehn Professor Department of Computer Science﻿ Email: phi@jhu.edu Phone: 410-516-3427 Tom Lippincott Associate Research Professor Department of Computer Science﻿ Email: tom@cs.jhu.edu Benjamin Van Durme Associate Professor Department of Computer Science﻿ Email: vandurme@jhu.edu Ziang Xiao Assistant Professor Department of Computer Science﻿ Email: ziang.xiao@jhu.edu David Yarowsky Professor Department of Computer Science﻿ Email: yarowsky@cs.jhu.edu Phone: 410-516-5372 Alan Yuille Bloomberg Distinguished Professor Department of Computer Science﻿ Email: ayuille1@jhu.edu Phone: 410-516-5331 <img class="visual_image" src="https://www.cs.jhu.edu/wp-content/uploads/2023/12/MLM-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2023/12/MLM.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2023/12/MLM-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2023/12/MLM-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2023/12/MLM-300x200.jpg 300w" sizes="100vw" alt="Overlapping talk bubbles in multiple colors: pink, red, orange, yellow, green, blue, purple." itemprop="image"> Multi-language mastery: minimized hardware, maximized efficiency Johns Hopkins computer scientists introduce a new method to reduce the size of multilingual language models. Learn more'
