["https://www.cs.jhu.edu/faculty/vladimir-braverman"]
title = "Vladimir Braverman - Department of Computer Science"
description = "Vladimir Braverman is the associate head of faculty and a professor in the Johns Hopkins University Department of Computer Science. His current research focuses on the algorithmic and practical aspects…"
full_description = '{ "@context": "http://schema.org", "@type": "Person", "email": "mailto:vbraver1@jhu.edu", "image": "", "jobTitle": "Associate Head of Faculty and Professor", "name": "Vladimir Braverman", "telephone": "410-516-4975", "url": "https://www.cs.jhu.edu/faculty/vladimir-braverman/", "address": "" } Contact 410-516-4975 vbraver1@jhu.edu Research Areas Machine learning Algorithms Health care applications Connect Google Scholar Website Vladimir Braverman is the associate head of faculty and a professor in the Johns Hopkins University Department of Computer Science. His current research focuses on the algorithmic and practical aspects of large-scale machine learning and their applications to data science and health care. He additionally holds a without-salary appointment in the Department of Diagnostic and Interventional Imaging in the McGovern Medical School at the University of Texas Health Science Center at Houston and is a visiting researcher at Google Research. Previously, he led a research group at HyperRoll, a startup company providing fast solutions for financial analytics that was acquired by Oracle in 2009. Braverman works on efficient and provable methods, tools, and algorithms for massive datasets. His methods find applications in large-scale machine learning, software-defined networks, medical imaging, and cosmological simulations. He has published over 100 articles on these topics and his research has been partially supported by the NSF, DARPA, the Office of Naval Research, and the National Institutes of Health. He has received a number of awards, including an NSF Early CAREER Award, a Google Faculty Award, and a Cisco Faculty Award. He also received a Best Paper Award at the 2019 USENIX Conference on File and Storage Technologies, as well as a Silver Best Paper Award at the 2021 International Conference on Machine Learning (ICML) workshop on adversarial machine learning. Braverman serves on the editorial board for the Journal of Computer and System Sciences, has served as an area chair for ICML and the Conference on Neural Information Processing Systems, and has served on program committees for numerous other conferences, including the Institute of Electrical and Electronics Engineers International Conference on Computer Communications, the Annual ACM Symposium on Theory of Computing, the ACM Symposium on Discrete Algorithms, and ACM SIGMETRICS. Braverman received his PhD from the University of California, Los Angeles, where he received the Edward K. Rice Outstanding Doctoral Student Award from the Samueli School of Engineering in 2011. Related News View All News <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/10/Untitled-design-3-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/10/Untitled-design-3.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/10/Untitled-design-3-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/10/Untitled-design-3-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/10/Untitled-design-3-300x200.jpg 300w" sizes="100vw" alt="Vladimir Braverman and Xin Jin pose in a server room."> System processing: Hopkins engineers design software to reduce page load time Categories Research Their new distributed caching mechanism won a Best Paper Award at the USENIX Conference on File and Storage Technologies earlier this year.'
