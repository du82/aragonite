["https://www.cs.jhu.edu/academic-programs"]
title = "Academic Programs - Department of Computer Science"
description = "At the undergraduate, master's, and doctoral levels, Johns Hopkins University's Department of Computer Science provides students with exceptional academic programs, opportunities to be mentored by faculty who are defining their fields, and professional preparation and access to a vast alumni network that helps position them for success, no matter what their area of interest may be."
full_description = 'At the undergraduate, master’s, and doctoral levels, Johns Hopkins University’s Department of Computer Science provides students with exceptional academic programs, opportunities to be mentored by faculty who are defining their fields, and professional preparation and access to a vast alumni network that helps position them for success, no matter what their area of interest may be. The department has a diverse culture of students from across the country and around the world who are active and engaged in campus life as well as within the greater Baltimore community. Explore Our Programs <img class="topic_image" src="https://www.cs.jhu.edu/wp-content/uploads/2021/10/CS-minor--300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2021/10/CS-minor-.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/CS-minor--500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/CS-minor--300x200.jpg 300w" sizes="100vw" alt="Students in a shared space gather around one working on a laptop." itemprop="image"> Undergraduate Programs One of the most distinctive features of undergraduate education at Johns Hopkins is the access that all undergraduates have to the research laboratories of some of the most outstanding faculty members in the world. Through this contact with our faculty, students are able to develop skills not easily taught in the classroom. Undergraduate Studies <img class="topic_image" src="https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU8722-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU8722-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU8722-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU8722-300x200.jpg 300w" sizes="100vw" alt="Students with laptops meet in a conference room." itemprop="image"> Graduate Programs Today’s industry demands computer scientists with deep skill sets and the ability to keep on the cutting edge of technology. An advanced degree from the Department of Computer Science at Johns Hopkins University will significantly enhance your career possibilities—our graduates are always in high demand. MS in Security Informatics MSE in Computer Science PhD Program <img class="topic_image" src="https://www.cs.jhu.edu/wp-content/uploads/2021/10/students-at-board-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2021/10/students-at-board-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/students-at-board-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/students-at-board-300x200.jpg 300w" sizes="100vw" alt="A student gestures to a blackboard." itemprop="image"> Combined Bachelor’s/Master’s A combined BS/MSE in Computer Science or Security Informatics allows students to earn a graduate degree in five years and increase their earning power after graduation. Combined Bachelor’s/Master’s in Computer Science or Security Informatics <img class="topic_image" src="https://www.cs.jhu.edu/wp-content/uploads/2021/10/aerial-homewood-4-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2021/10/aerial-homewood-4-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/aerial-homewood-4-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/aerial-homewood-4-300x200.jpg 300w" sizes="100vw" alt="Aerial view of Johns Hopkins Homewood campus." itemprop="image"> Accreditation and Program Statistics View accreditation information for the BS program and explore each year’s enrollment numbers for our majors, minors, and graduate programs, as well as graduation numbers over the last 10 years. Accreditation and Program Statistics Apply Now Are you ready to become a Hopkins Engineer? Apply For Undergraduate Admission Apply for Graduate Admission <img class="visual_image" src="https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU8502-300x200.jpeg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU8502-980x654.jpeg 980w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU8502-740x494.jpeg 740w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU8502-500x334.jpeg 500w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU8502-300x200.jpeg 300w" sizes="100vw" alt="A group of young adults walking on the street." itemprop="image"> Living in Baltimore Baltimore is where JHU students grow and build their lives. From popular tourist attractions—the Inner Harbor, the National Aquarium, and Fort McHenry (birthplace of “The Star Spangled Banner”)—to more off-the-beaten-path destinations—the Edgar Allan Poe House and Museum or the tranquil Sherwood Gardens—there is always something new to discover. Explore Baltimore Future leaders in computer science Our department is a lively community that enables students to achieve their full potential. <img class="gallery_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-2-1-300x169.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-2-1.jpg 1220w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-2-1-980x552.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-2-1-740x416.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-2-1-500x282.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-2-1-300x169.jpg 300w" sizes="100vw" alt="Students from the Johns Hopkins Multidisciplinary Engineering Design course showcase their bobcat feeding system in front of the bobcat enclosure at the Maryland Zoo." itemprop="image"> Solving puzzles for prey at the Maryland Zoo - Johns Hopkins undergraduate engineers brought the thrill of the hunt to bobcats Kilgore and Josie with their high-tech take on the classic “Whac-A-Mole” arcade game. <img class="gallery_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-3-1-300x169.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-3-1.jpg 1220w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-3-1-980x552.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-3-1-740x416.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-3-1-500x282.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-3-1-300x169.jpg 300w" sizes="100vw" alt="A man signing in front of a computer." itemprop="image"> Signs of change - PhD student Xuan Zhang is researching sign language recognition and translation tasks with the aim of developing a large vision-language model capable of translating signed words into spoken language. <img class="gallery_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-5-e1724261859814-300x169.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-5-e1724261859814.jpg 1220w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-5-e1724261859814-980x552.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-5-e1724261859814-740x416.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-5-e1724261859814-500x282.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-5-e1724261859814-300x169.jpg 300w" sizes="100vw" alt="HopHacks student at a chalkboard." itemprop="image"> Hack to the future - HopHacks is a 36-hour annual hackathon held at the Johns Hopkins University that encourages engineers, designers, and entrepreneurs to explore new ideas and create new applications. <img class="gallery_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-4-300x169.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-4.jpg 1220w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-4-980x552.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-4-740x416.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-4-500x282.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-4-300x169.jpg 300w" sizes="100vw" alt="An image of Tad Berkery with his laptop is superimposed over a hockey rink." itemprop="image"> Probing the importance of faceoffs - Fourth-year computer science student Tad Berkery believes AI can bolster hockey analytics.'
