["https://www.cs.jhu.edu/news/cs-alum-appointed-director-of-defense-information-systems-agency"]
title = "CS alum appointed director of Defense Information Systems Agency - Department of Computer Science"
description = "Army Lieutenant General Paul T. Stanton, Engr ’11 (PhD) recently assumed the roles of director of DISA and commander of the Joint Force Headquarters-Department of Defense Information Network."
full_description = 'Published: February 7, 2025 Category: Alumni Spotlight Share Options Share This Story Share toTwitter Share toFacebook Share toLinkedIn <img class="news_entry_image" src="https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4-300x200.jpg 300w" sizes="100vw" alt="Portrait of Paul Stanton."> Army Lieutenant General Paul T. Stanton, Engr ’11 (PhD). Image Credit: Defense Information Systems Agency Johns Hopkins alumnus Army Lieutenant General Paul T. Stanton, Engr ’11 (PhD) recently assumed directorship of the Defense Information Systems Agency, or DISA, and command of the Joint Force Headquarters-Department of Defense Information Network. DISA is a U.S. Department of Defense combat support agency that provides information technology and communications support to the nation’s armed forces. Stanton was nominated for these roles by former President Joe Biden last June in recognition of his extensive experience in cyber operations and information warfare. Previously, he served as commanding general of the U.S. Army Cyber Center of Excellence at Fort Eisenhower in Georgia and as deputy commanding general for operations within Army Cyber Command. “I’m honored for the opportunity to join this amazing team in stride as we remain trusted to connect, protect and serve,” Stanton said at the ceremonial passing of the flags that took place in October. Stanton obtained his PhD in computer science under the advisement of Professor Randal Burns, the Bill and Lisa Stromberg Head of the Department of Computer Science. “Paul Stanton has a unique combination of technical depth and leadership skills,” Burns said. “He demonstrated both during his PhD and continues to do so. I congratulate him on the appointment and I am thrilled to see DISA leadership embrace the professionalism and expertise that Paul brings. “At Johns Hopkins, we are truly proud of his achievements. He exemplifies the values of scholarship, integrity, and service that we aspire to convey through our research and education programs.”'
