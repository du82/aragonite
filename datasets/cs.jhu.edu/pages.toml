["https://www.cs.jhu.edu/faculty/gillian-hadfield"]
title = "Gillian Hadfield - Department of Computer Science"
description = "Gillian K. Hadfield is a professor of computer science with a joint appointment in the School of Government and Policy. Her research is focused on innovative design for legal and…"
full_description = '{ "@context": "http://schema.org", "@type": "Person", "email": "mailto:ghadfield@jhu.edu", "image": "", "jobTitle": "Research Professor", "name": "Gillian Hadfield", "telephone": "", "url": "https://www.cs.jhu.edu/faculty/gillian-hadfield/", "address": "363 Malone Hall" } Contact ghadfield@jhu.edu Location 363 Malone Hall Research Areas AI alignment Multi-agent systems Cooperative AI Human normative systems AI governance Legal and regulatory design Institutional and organizational economics Connect Google Scholar LinkedIn Twitter Gillian K. Hadfield is a professor of computer science with a joint appointment in the School of Government and Policy. Her research is focused on innovative design for legal and regulatory systems for AI and other complex global technologies, computational models of human normative systems, and working with machine learning (ML) researchers to build ML systems that understand and respond to human values and norms. Hadfield believes normativity—the practice of classifying behaviors as acceptable or unacceptable and then coordinating third-party enforcement schemes to channel behaviors away from those classified as unacceptable—is at the root of everything that distinguishes us from our primate ancestors. Human normative systems—such as social norms, informal dispute resolution, and formal systems of law—are the fundamental infrastructure of human groups. Hadfield is currently working on the challenge of AI governance and alignment problems and computational models to analyze the phenomenon and characteristics of normativity and legal order. For AI to be beneficial to society, it will have to integrate into our normative systems; at a minimum, it must not break these complex, dynamic processes—the systems that underpin our willingness to engage in the phenomenal levels of interdependence and cooperation that characterize modern human societies. This involves determining how to build AI systems that advance human normative efforts, enabling us to find and live by better rules; achieve fairer, more just, and more peaceful societies; and support human flourishing. In addition to her roles at Johns Hopkins University, Hadfield is a Canadian Institute for Advanced Research AI Chair, faculty at the Vector Institute in Toronto, and a faculty affiliate at both the University of California, Berkeley Center for Human-Compatible AI and the University of Toronto Schwartz Reisman Institute for Technology and Society, where she previously served as its inaugural director and held the Schwartz Reisman Chair in Technology and Society. Among Hadfield’s awards and honors are the 2024 Carolyn Tuohy Impact on Public Policy Award and President’s Impact Award from the University of Toronto; the 2019 Mundell Medal for Excellence in Legal Writing for her book, Rules for a Flat World: Why Humans Invented Law and How to Reinvent It for a Complex Global Economy; and a 2018 Phi Kappa Phi Faculty Recognition Award. She was additionally named to Maclean’s 2024 The Power List: AI, named a Schmidt Sciences AI2050 senior fellow in 2023, awarded a Rockefeller Foundation Bellagio Centre Residency in 2022, and was a fellow of the Center for Advanced Study in the Behavioral Sciences at Stanford from 2006 to 2007 and again from 2010 to 2011. Hadfield has published in leading journals, including Science, Science Advances, Nature, Proceedings of the National Academy of Sciences of the United States of America, and the Annual Review of Political Science, as well as in the Proceedings of the AAAI/ACM Conference on AI Ethics and Society. Prior to joining Johns Hopkins, Hadfield was a professor of law and strategic management at the University of Toronto. She earned her bachelor’s from Queen’s University and her JD from Stanford Law School, after which she completed her PhD in economics at Stanford University. Related News View All News <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2025/01/swisher_panel-scaled-1-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2025/01/swisher_panel-scaled-1-980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/swisher_panel-scaled-1-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/swisher_panel-scaled-1-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/swisher_panel-scaled-1-300x200.jpg 300w" sizes="100vw" alt="Gillian Hadfield, Mark Dredze, Kara Swisher, and Rumman Chowdhury converse while sitting on a stage."> Four expert takes on artificial intelligence Categories Department News Johns Hopkins faculty members Gillian Hadfield and Mark Dredze joined veteran tech journalist Kara Swisher and Humane Intelligence founder and CEO Rumman Chowdhury for a wide-ranging discussion.'
