full_description = "BS Program Objectives and Student Outcomes The BS in computer science degree program is accredited by the Computing Accreditation Commission of ABET under the General Criteria and Program Criteria for Computer Science and similarly named computing programs. Click here for more information regarding ABET-accredited programs within the Whiting School of Engineering. Program Educational Objectives What our graduates should be able to do several years after graduation: (Revised Fall 2022) Successfully engage in professional practice in the computing sciences or apply computer science tools and techniques to solving problems in other disciplines. Engage in continuous learning, including advanced study in the computing sciences. Work successfully in both independent and team environments, including diverse and interdisciplinary teams. Lead teams and provide vision for innovation. Behave in a professional and ethical manner. Practice inclusion and advocate for diversity. Student Outcomes Upon graduation, our graduates should possess the skills to: Analyze a complex computing problem and apply principles of computing and other relevant disciplines to identify solutions. Design, implement, and evaluate a computing-based solution to meet a given set of computing requirements in the context of the program’s discipline. Communicate effectively in a variety of professional contexts. Recognize professional responsibilities and make informed judgments in computing practice based on legal and ethical principles. Function effectively as a member or leader of a team engaged in activities appropriate to the program’s discipline. Apply computer science theory and software development fundamentals to produce computing-based solutions. var divElement = document.getElementById('viz1643737381864'); var vizElement = divElement.getElementsByTagName('object')[0]; if ( divElement.offsetWidth > 800 ) { vizElement.style.width='800px';vizElement.style.height='477px';} else if 