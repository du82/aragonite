["https://www.cs.jhu.edu/distinguished-lecture-series"]
title = "CS Distinguished Lecture Series - Department of Computer Science"
description = "The Department of Computer Science is proud to host two lecture series: Gerald M. Masson Distinguished Lecture Series Association for Computing Machinery Lecture Series in Memory of Nathan Krasnopoler  …"
full_description = "The Department of Computer Science is proud to host two lecture series: Gerald M. Masson Distinguished Lecture Series Association for Computing Machinery Lecture Series in Memory of Nathan Krasnopoler Gerald M. Masson Distinguished Lecture Series In 2016, the Department of Computer Science recognized Masson’s visionary leadership with a series of special events marking 30 years of computing at Johns Hopkins. That celebration included the establishment of the Gerald M. Masson Distinguished Lecture Series, which each year brings computer science researchers to the Homewood campus to talk about important topics in the field. To learn more about Gerald Masson, click here. 2024-25 Gerald M. Masson Distinguished Lecture Series Lectures to be presented at 10:30 a.m. in Hackerman B-17, unless otherwise noted. Suchi Saria Johns Hopkins University Title: AI for Augmenting Clinical Teams: Opportunities, Technical Hurdles, Promising Results, and Open Problems Date: October 1, 2024 Abstract: The use of AI in improving medical decision-making is one of the most promising avenues for impact. However, turning these ideas into commonly used tools has been significantly harder and slower than predicted. Suchi Saria’s research has focused on closing fundamental technical gaps related to the development and robust translation of AI-based medical tools from messy, multimodal observational datasets. Her industry experience has given her a firsthand view into hurdles that must be tackled for scaling these solutions in the real world. In 2022, her team published three manuscripts featured on the cover of Nature Medicine that shared results from one of the largest real-world evaluations of a medical AI tool to date; these studies were also the first to show the impact of AI on saving lives. Based on these results, her team achieved FDA Breakthrough status. This talk will give an overview on what it takes to go from an idea to a bedside tool. Along the way, Saria will give pointers on new technical ideas and open research problems in AI safety, human-machine teaming, and modeling multimodal temporal data. View the recording >> Jason Corso University of Michigan Title: Curious Embeddings, Hazy Oracles, and the Path to Safe, Cooperative AI Date: December 5, 2024 Abstract: Cooperation through safe and trustworthy communication and interaction is fundamental to how human teams accomplish complex tasks. Yet, despite significant—and sometimes revolutionary—advances in AI, we have barely begun to unlock the potential of safe, cooperative AI. This may stem from our limited understanding of how multimodal, large-scale AI models function; the one-sided nature of contemporary, fully-supervised AI approaches; or social concerns about human-AI collaboration. In this talk, Jason Corso will delve into these layers of inquiry, beginning with a principled exploration of what the embeddings in large-scale foundation models reveal about the underlying problem and data, including new results disentangling sample-size from Bayes error and decision-boundary complexity. He will then introduce the concept of the human collaborator as a “hazy oracle”—a fallible partner rather than an omniscient information source—and establish a framework for modeling human-supplied error during collaboration. Building on these foundational insights, Corso will conclude with applications of these ideas to foster safe and effective human-AI collaboration in the health sciences. View the recording >> Additional speakers TBA. 2023-24 Gerald M. Masson Distinguished Lecture Series Lectures to be presented at 10:30 a.m. in Hackerman B-17, unless otherwise noted. Stefano Soatto, with CLSP Amazon, UCLA Computer Vision Title: Toward Foundational Models of Physical Scenes: From Large Language Models to World Models and Back Date: September 28, 2023 Abstract: Now that a significant fraction of human knowledge has been shared through the internet, scraped and squashed into the weights of large language models, do we still need embodiment and interaction with the physical world to build representations? Is there a dichotomy between LLMs and “large world models?” What is the role of visual perception in learning such models? Can perceptual agents trained by passive observation learn world models suitable for control? To begin tackling these questions, Stefano Soatto will first address the issue of controllability of LLMs and propose a simplistic definition of “meaning” that reflects the functional characteristics of a trained LLM. He will show that a well-trained LLM establishes a topology in the space of meanings, represented by equivalence classes of the trajectories of an underlying dynamical model. Then, he will describe both necessary and sufficient conditions for controllability in such a space of meanings. He will highlight the relation between meanings induced by a trained LLM upon the set of sentences that can be uttered and “physical scenes” underlying sets of images that can be observed. Lastly, he will show that popular models ostensibly used to represent the 3D scene (neural radiance fields) can at most represent the images on which they are trained, but not the underlying physical scene; however, composing a NeRF with a latent diffusion model or another inductively-trained generative model yields a viable representation of the physical scene. View the recording >> Ohran Firat Google LLMs, AI, NLP Title: Ten Insights from a Machine Learning Researcher and Practitioner on Scaling Models and Languages in NLP in Ten Years Date: October 24, 2023 Abstract: The field of natural language processing has seen rapid growth in recent years, driven by advances in machine learning. As a result, NLP models have become increasingly large and complex, capable of performing a wide range of tasks and understanding many languages. This talk will discuss the evolution of NLP models from specialized to generalist, drawing on the speaker’s personal experience working in the field for over ten years. Topics covered will include: building massively multilingual and large neural machine translation systems (M4); infrastructure and system research enabling the construction of such systems (GPipe, GShard); foundational machine learning research that has advanced the state-of-the-art predictability (aka scaling laws); deployment and organizational challenges in the large language model space; and more. The talk will conclude with a discussion of the future of NLP and the potential of LLMs to unlock new frontiers. View the recording >> Q. Vera Liao Microsoft Research HCI, AI Title: Human-Centered AI Transparency Date: November 2, 2023 Abstract: Transparency—enabling appropriate understanding of AI models or systems—is considered a pillar of responsible AI. The AI research community and industry have developed an abundance of techniques and artifacts in the hope of achieving transparency, including transparent model reporting, model evaluation, explainable AI, and communication of model uncertainty. Meanwhile, the human-computer interaction community has taken human-centered approaches to these topics, building on its long-standing interests in design to support user understanding and appropriate mental models. In this talk, Q. Vera Liao will give an overview of common approaches and lessons learned from HCI research on AI transparency. With the recent rise of large language models and LLM-infused systems, she will also reflect on their unique challenges in providing transparency and discuss open questions. View the recording >> Justine Sherry Carnegie Mellon Networking Title: The I/O-Driven Server: Shifting Control of Data Movement in Future Data Centers Date: November 13, 2023 Abstract: Accelerators are everywhere in computer systems research today, and in this context, it is easy to see “smart” Network Interface Cards—which embed some programmable compute power in the network interface of the server—as simply another chapter in this story. In this talk, Justine Sherry will discuss how SmartNICs do more than simply “accelerate” network-intensive computing. Instead, she argues that SmartNICs radically reorient the control of data movement within the server in a way that is necessary for server hardware to scale with the deluge of network traffic in data centers. She will illustrate a few exemplary systems—Pigasus IDS, the Ensō NIC protocol, and the KOPI OS architecture—from her own research group, as well as exciting work in other labs, all of which reorient server data movement using programmable NICs. View the recording >> Aniruddha Kembhavi Allen Institute for AI Computer Vision Title: Building Foundation Models for Vision and Robotics Date: March 26, 2024 Abstract: Large language models support a whole gamut of tasks in natural language. In contrast, unification has been more challenging in computer vision, partly due to the heterogeneity of tasks in the visual domain and a scarcity of robotics data in the physical world. How do we create powerful unified systems for vision and robotics that can be as capable and creative as their language counterparts? Aniruddha Kembhavi will first present his work on Unified IO, the first single neural model to perform a large and diverse set of AI tasks spanning classical computer vision, image synthesis, vision-and-language, and natural language processing, and his follow-up work, Unified IO 2, that brings in video, audio, and action. Then he will present his recent surprising finding in robotics: Imitating shortest path planners in simulation can produce agents that can proficiently navigate, explore, and manipulate objects in the real world, with no human data or RL and with just RGB sensing—made possible by his recent works on ProcTHOR, HoloDeck, and ObjaVerse. Finally, he will present a compelling alternative to building unified models, Visual Programming, which uses language models as code generators to invoke smaller specialized vision models. This paradigm is efficient and effective, leverages models sourced from the entire community, and scales easily to large sets of diverse tasks. View the recording >> Zhiqiang Lin Ohio State University Cybersecurity Title: Rethinking the Security and Privacy of Bluetooth Low Energy Date: May 2, 2024 Abstract: Bluetooth Low Energy (BLE) stands at the forefront of near-range wireless communication technology, integral to a myriad of Internet of Things devices (spanning health care, fitness, wearables, and smart home applications), primarily due to its significantly low energy consumption. However, the past few years have unveiled numerous security flaws, placing billions of Bluetooth devices at risk. While luckily these flaws have been discovered (some of which have been fixed), there is no reason to believe that current BLE protocols and implementations are free from other flaws. In this talk, Zhiqiang Lin will present a line of recent efforts aimed at enhancing BLE security and privacy. In particular, he will first present the protocol-level downgrade attack, an attack that can force the secure BLE channels into insecure ones to break the data integrity and confidentiality of BLE traffic. Then, he will introduce the Bluetooth Address Tracking (BAT) attack, a novel protocol-level attack, which can track randomized Bluetooth MAC addresses by using an innovative allowlist-based side channel. Next, he will talk about the lessons learned, root causes of the attacks, and their countermeasures. Finally, he will conclude his talk by discussing future directions in Bluetooth security and privacy. View the recording >> 2020-21 Gerald M. Masson Distinguished Lecture Series Nick McKeown Stanford University Title: The Network as a Programmable Platform Date: October 13, 2020 Abstract: In the past 10 years, large network owners and operators have taken control of the software that controls their networks. They are now starting to take control of how packets are processed too. Networks, for the first time, are on the cusp of being programmable end-to-end, specified top-to-bottom, and defined entirely by software. We will think of the network as a programmable platform, a distributed system, that we specify top-down using software, rather than protocols. This has big ramifications for networks in the future, creating some interesting new possibilities to verify that a network is “correct by construction”, to measure and validate its behavior in real-time against a network specification, and to correct bugs through closed-loop control. 2019-20 Gerald M. Masson Distinguished Lecture Series Monica Lam Stanford Internet of Things Title: Building the Smartest and Open Virtual Assistant to Protect Privacy Date: October 8, 2019 Abstract: Virtual assistants, providing a voice interface to web services and IoTs, can potentially develop into monopolistic platforms that threaten consumer privacy and open competition. This talk presents Almond as an open-source alternative. Unlike existing commercial assistants, Almond can be programmed in natural language to perform new tasks. It lets users control who, what, when, where, and how their data are to be shared, all without disclosure to a third party. Almond has a Write-Once-Run-Anywhere (WORA) skill platform: skills need to be written only once and can run automatically on other assistants. This helps level the playing field for new assistants. Finally, Almond’s open-source technologies enable non-ML experts to develop natural language capabilities in their domains of interest. Through open-world collaboration, Almond can become the smartest virtual assistant. Lise Getoor UCSC ML + Privacy Title:The Unreasonable Effectiveness of Structure Date: October 10, 2019 Abstract: Our ability to collect, manipulate, analyze, and act on vast amounts of data is having a profound impact on all aspects of society. Much of this data is heterogeneous in nature and interlinked in a myriad of complex ways. From information integration to scientific discovery to computational social science, we need machine learning methods that are able to exploit both the inherent uncertainty and the innate structure in a domain. Statistical relational learning (SRL) is a subfield that builds on principles from probability theory and statistics to address uncertainty while incorporating tools from knowledge representation and logic to represent structure. In this talk, I will give a brief introduction to SRL, present templates for common structured prediction problems, and describe modeling approaches that mix logic, probabilistic inference and latent variables. I’ll overview our recent work on probabilistic soft logic (PSL), a SRL framework for large-scale collective, probabilistic reasoning in relational domains. I’ll close by highlighting emerging opportunities (and challenges!!) in realizing the effectiveness of data and structure for knowledge discovery. Jodi Forlizzi CMU Human Computer Interactions Talk Title:Designing Today’s "
