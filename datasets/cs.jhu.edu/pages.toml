title = "Computational Biology & Medicine - Department of Computer Science"
description = "Our faculty are engaged in a wide range of computational health and biology projects, from using data-driven tools to detect early signs of sepsis to DNA sequencing technology and evolutionary genomics."
full_description = 'Computational biology involves applying computational methods to address biological questions and challenges. Our faculty are pioneering new directions in the field of computational biology and medicine, in close collaboration with world-renowned Johns Hopkins Medicine researchers. Johns Hopkins University is home to a strong network of scientists working in computational genomics with diverse interests in many kinds of computational and statistical analyses of genomes. Research Centers and Labs Center for Computational Biology The CCB is a multidisciplinary center dedicated to research on genomics, genetics, and DNA sequencing technology. Center for Computational Biology Center for Computational Genomics The CCG is a multidisciplinary initiative to support research and education in the field of computational genomics. Center for Computational Genomics Center for Imaging Science The CIS sits at the intersection of mathematics, computer science, biomedical engineering, and electrical engineering; using mathematical and computational approaches, CIS researchers are pioneering new discoveries in four major areas: medical image analysis, computer vision, computational biology, and statistical learning. Center for Imaging Science Institute for Computational Medicine The ICM develops quantitative approaches for understanding the mechanisms, diagnosis, and treatment of human disease through the application of mathematics, engineering, and computer science. Institute for Computational Medicine People Vladimir Braverman Associate Head of Faculty and Professor Department of Computer Science﻿ Department of Applied Mathematics and Statistics﻿ Email: vbraver1@jhu.edu Phone: 410-516-4975 Mark Dredze Interim Deputy Director of the Data Science and AI Institute, Associate Head of Research and Strategic Initiatives, and John C. Malone Professor Department of Computer Science﻿ Email: mdredze@cs.jhu.edu Craig Jones Assistant Research Professor Department of Computer Science﻿ Email: craigj@jhu.edu Ben Langmead Associate Professor Department of Computer Science﻿ Email: blangme2@jhu.edu Phone: 410-516-2033 Steven Salzberg Bloomberg Distinguished Professor Department of Computer Science﻿ Department of Biomedical Engineering﻿ Email: salzberg@jhu.edu Phone: 410-516-8246 Suchi Saria John C. Malone Associate Professor Department of Computer Science﻿ Email: ssaria1@jhu.edu Phone: 410-516-4126 Michael Schatz Bloomberg Distinguished Professor Department of Computer Science﻿ Email: mschatz@jhu.edu Phone: 703-966-1987 Mathias Unberath John C. Malone Associate Professor Department of Computer Science﻿ Email: mathias@jhu.edu Phone: 410-516-4253 <img class="visual_image" src="https://www.cs.jhu.edu/wp-content/uploads/2023/08/DNA-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2023/08/DNA-980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2023/08/DNA-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2023/08/DNA-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2023/08/DNA-300x200.jpg 300w" sizes="100vw" alt="A DNA sequence shown in parallel vertical rows of blues, reds, and pinks." itemprop="image"> Male sex chromosome, missing piece in human genome, finally decoded The achievement could provide a clearer picture of the role the chromosome plays in male-specific development, fertility, and genetically triggered diseases like cancer. Read More'
