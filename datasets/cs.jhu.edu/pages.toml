description = "Bridging disciplines and accelerating discoveries in computer science."
full_description = 'Computer science research at the Johns Hopkins University is advancing computing technology, enabling new modes of thought, and transforming society. Our faculty conduct innovative, collaborative research aimed at solving large and complex interdisciplinary problems, drawing upon the university’s renowned strengths in areas including artificial intelligence, robotics, speech and language processing, medicine, and public health. The department is rapidly growing, with current core research areas of theory and programming languages; systems and networking; computational biology and medicine; information security; natural language processing; machine learning, artificial intelligence, and data science; robotics, computer vision, and graphics; human-computer interaction; and computer-assisted medicine. Researchers partners with colleagues in other engineering disciplines, as well as with investigators from the Johns Hopkins Krieger School of Arts and Sciences, the School of Medicine, and the Applied Physics Laboratory. Cross-Departmental Centers and Institutes Center for Language and Speech Processing Laboratory for Computational Sensing and Robotics Johns Hopkins Information Security Institute Institute for Data Intensive Engineering and Science Malone Center for Engineering in Healthcare Human Language Technology Center of Excellence Center for Computational Biology Mathematical Institute for Data Science Institute for Assured Autonomy Johns Hopkins Data Science and AI Institute Research Areas Theory & Programming Languages Focusing on the design, implementation, and use of computer programming languages. Learn More Systems & Networking Our faculty are undertaking research into all aspects of computer systems and networks. Learn More Computational Biology & Medicine Faculty are engaged in a wide range of computational health and biology projects, from using data-driven tools to detect early signs of sepsis to DNA sequencing technology and evolutionary genomics. Learn More Information Security Hopkins researchers are working to safeguard our digital world. Learn More Natural Language Processing Creating innovative new technologies that will enable more natural interaction between human and computers. Learn More Machine Learning, AI, & Data Science Applying cutting-edge machine learning techniques to new datasets and domains. Learn More Robotics, Vision, & Graphics Research spans the areas of computer vision, computer graphics, and augmented and virtual reality. Learn More Human-Computer Interaction Placing people at the center of technological innovation. Learn more Computer-Assisted Medicine Our faculty are shaping the digital future across all aspects of health care. Learn more <img class="visual_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-300x200.jpg 300w" sizes="100vw" alt="A close-up shot of servers in a server rack with lighted LEDs." itemprop="image"> The Johns Hopkins Data Science and AI Institute Johns Hopkins has made a transformational investment in the power and promise of data science and artificial intelligence and is building the nation’s foremost destination for emerging applications, opportunities and challenges presented by data science, machine learning, and AI. Learn more'
