description = "Johns Hopkins computer scientist Mathias Unberath, a leading expert in AI-assisted medicine, says cuts to research funding imperil the nation’s ability to attract the world’s best and brightest scientists."
full_description = '<img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2025/03/unberath_lab-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2025/03/unberath_lab-980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2025/03/unberath_lab-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2025/03/unberath_lab-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2025/03/unberath_lab-300x200.jpg 300w" sizes="100vw" alt="A group of 7 ARCADE Lab members and Mathias Unberath pose in the Mock OR."> America’s global scientific edge relies on its investment in research Categories Department News Johns Hopkins computer scientist Mathias Unberath, a leading expert in AI-assisted medicine, says cuts to research funding imperil the nation’s ability to attract the world’s best and brightest scientists. Recent News Categories All Categories Alumni Spotlight Awards and Honors Department News Graduate Stories Research Student Experience Undergraduate Stories Apply Filters <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2025/03/unberath_lab-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2025/03/unberath_lab-980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2025/03/unberath_lab-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2025/03/unberath_lab-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2025/03/unberath_lab-300x200.jpg 300w" sizes="100vw" alt="A group of 7 ARCADE Lab members and Mathias Unberath pose in the Mock OR."> America’s global scientific edge relies on its investment in research Categories Department News Johns Hopkins computer scientist Mathias Unberath, a leading expert in AI-assisted medicine, says cuts to research funding imperil the nation’s ability to attract the world’s best and brightest scientists. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/12/DaVinci-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/12/DaVinci-980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/12/DaVinci-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/12/DaVinci-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/12/DaVinci-300x200.jpg 300w" sizes="100vw" alt="The da Vinci robotic surgical system."> AI’s stitch in time Categories Research Johns Hopkins researchers successfully taught an AI simulation to close incisions by breaking the complicated suturing process down into simpler subtasks. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-2-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-2.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-2-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-2-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-2-300x200.jpg 300w" sizes="100vw" alt="Computer rendering of human torso, half of it in a semi-transparent, graphical surface style. Blue binary code and neural pathways are in the background."> A touchstone of medical artificial intelligence Categories Research Johns Hopkins researchers release a new standard for evaluating medical AI models to promote fairness and reduce bias. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2025/02/980x654-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2025/02/980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2025/02/980x654-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2025/02/980x654-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2025/02/980x654-300x200.jpg 300w" sizes="100vw" alt="Illustration of scales, with an X on one side and a checkmark on the other."> Hopkins team researches design of ethical intervention policies for artificial agents Categories Research Supported by a Challenge Grant from the Johns Hopkins Institute for Assured Autonomy, a team led by Chien-Ming Huang is investigating the conceptual and technological advances required to enable artificial agents to act with prosocial intent. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4-300x200.jpg 300w" sizes="100vw" alt="Portrait of Paul Stanton."> CS alum appointed director of Defense Information Systems Agency Categories Alumni Spotlight Army Lieutenant General Paul T. Stanton, Engr ’11 (PhD) recently assumed the roles of director of DISA and commander of the Joint Force Headquarters-Department of Defense Information Network. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2025/02/980x654-1-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2025/02/980x654-1.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2025/02/980x654-1-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2025/02/980x654-1-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2025/02/980x654-1-300x200.jpg 300w" sizes="100vw" alt="A colorful illustration of a human abdominal cavity showing internal organs in the style of a road map."> AI-powered map of the abdomen could help find cancer early on Categories Research Department News Johns Hopkins researchers used artificial intelligence to create the largest, most comprehensive dataset of abdominal organs to date to help radiologists quickly and accurately identify tumors and other diseases. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2025/01/swisher_panel-scaled-1-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2025/01/swisher_panel-scaled-1-980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/swisher_panel-scaled-1-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/swisher_panel-scaled-1-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/swisher_panel-scaled-1-300x200.jpg 300w" sizes="100vw" alt="Gillian Hadfield, Mark Dredze, Kara Swisher, and Rumman Chowdhury converse while sitting on a stage."> Four expert takes on artificial intelligence Categories Department News Johns Hopkins faculty members Gillian Hadfield and Mark Dredze joined veteran tech journalist Kara Swisher and Humane Intelligence founder and CEO Rumman Chowdhury for a wide-ranging discussion. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-1-1-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-1-1.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-1-1-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-1-1-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-1-1-300x200.jpg 300w" sizes="100vw" alt="Headshot of Jessica Sorrell."> New faculty Q&A: Jessica Sorrell Categories Department News Get to know Jessica Sorrell, who joins Johns Hopkins as an assistant professor of computer science. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-3-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-3.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-3-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-3-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-3-300x200.jpg 300w" sizes="100vw" alt="A person sitting at a desk uses a smart speaker."> Alexa, should voice assistants have a gender? Categories Research Department News Johns Hopkins computer scientists explore how gendered voice assistants influence user behavior. <img class="news_item_image" 