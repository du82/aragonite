["https://www.cs.jhu.edu/alumni-and-giving"]
title = "Alumni & Giving - Department of Computer Science"
description = "At the Johns Hopkins Department of Computer Science, we take pride in maintaining strong connections with our alumni, who are doing great things both personally and professionally. It is through…"
full_description = 'At the Johns Hopkins Department of Computer Science, we take pride in maintaining strong connections with our alumni, who are doing great things both personally and professionally. It is through the support of alumni and friends that the department has been able to maintain our role as a world leader in computer science research and education. We encourage all alumni to stay connected and get involved. Get Involved <img class="topic_image" src="https://www.cs.jhu.edu/wp-content/uploads/2018/06/2018-cs-commencement-picture-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2018/06/2018-cs-commencement-picture-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2018/06/2018-cs-commencement-picture-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2018/06/2018-cs-commencement-picture-300x200.jpg 300w" sizes="100vw" alt="2018 master&#039;s graduates gather outside of a stadium, clutching their diplomas and wearing caps." itemprop="image"> Build Your Network Connect with Hopkins Engineering alumni and broaden your professional and personal networks. WSE Alumni Resources Join the CS LinkedIn Group OneHop (JHU Alumni Network) <img class="topic_image" src="https://www.cs.jhu.edu/wp-content/uploads/2021/10/deep-learning-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2021/10/deep-learning-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/deep-learning-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/deep-learning-300x200.jpg 300w" sizes="100vw" alt="A student points to a poster entitled &quot;Occlusion R-CNN for Human Detection.&quot; Other posters are visible behind the student." itemprop="image"> Stay Connected Connect with us on social media to hear about alumni events and news, and share the amazing things you’re doing and update your contact information today. Twitter Facebook Update Your Information <img class="topic_image" src="https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU0613-300x200.jpeg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU0613-740x494.jpeg 740w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU0613-500x334.jpeg 500w, https://www.cs.jhu.edu/wp-content/uploads/2021/10/JHU0613-300x200.jpeg 300w" sizes="100vw" alt="Students cross Keyser Quad in the fall." itemprop="image"> Give Back Lend your time and talents to contribute to the future success of our students and programs. Volunteer with the Whiting School <img class="visual_image" src="https://www.cs.jhu.edu/wp-content/uploads/2019/08/Anand-Photo-Revised-e1730401538450-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2019/08/Anand-Photo-Revised-e1730401538450-980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2019/08/Anand-Photo-Revised-e1730401538450-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2019/08/Anand-Photo-Revised-e1730401538450-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2019/08/Anand-Photo-Revised-e1730401538450-300x200.jpg 300w" sizes="100vw" alt="Anand Malpani poses with students in a Gilman Hall classroom." itemprop="image"> Support Our Mission As alumni, you know better than anyone that the Whiting School of Engineering sets the standard for excellence in engineering education and research nationwide—and we can’t do it without your support. Give Today Alumni Stories View All News <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4-300x200.jpg 300w" sizes="100vw" alt="Portrait of Paul Stanton."> CS alum appointed director of Defense Information Systems Agency Categories Alumni Spotlight Army Lieutenant General Paul T. Stanton, Engr ’11 (PhD) recently assumed the roles of director of DISA and commander of the Joint Force Headquarters-Department of Defense Information Network. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/07/Untitled-design-1-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/07/Untitled-design-1.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/07/Untitled-design-1-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/07/Untitled-design-1-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/07/Untitled-design-1-300x200.jpg 300w" sizes="100vw" alt="Headshot of Yixuan Wu in formal dress."> CS alum earns DoD Early Investigator Research Award Categories Alumni Spotlight The award from the Department of Defense’s Prostate Cancer Research Program will support Yixuan Wu in developing an economical imaging approach to enable the early detection of aggressive prostate cancer. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2023/11/Kim-Biden-980x654-1-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2023/11/Kim-Biden-980x654-1.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2023/11/Kim-Biden-980x654-1-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2023/11/Kim-Biden-980x654-1-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2023/11/Kim-Biden-980x654-1-300x200.jpg 300w" sizes="100vw" alt="Wearing a medal, Jeong Kim poses with President Biden."> Kim honored with National Medal of Technology Categories Alumni Spotlight Jeong Kim, Engr ’82, ’89 (MS) received the National Medal of Technology and Innovation, the country’s highest award for technological achievement.'
