["https://www.cs.jhu.edu/about/diversity-and-inclusion"]
title = "Diversity and Inclusion - Department of Computer Science"
description = """
The Vivien Thomas Scholars Initiative is dedicated to nurturing, mentoring, and connecting the exceptional diverse talent that exists at historically black colleges and universities and other minority serving institutions to STEM graduate education and future leadership in STEM careers.

Interested students must apply directly to their desired PhD program and submit a supplemental application for the scholarship. Please note the December 1 deadline for scholarship applications."""
full_description = 'We believe that a diverse and inclusive community is critical to the success of our educational and research missions. A diverse department is necessary for making our educational programs accessible to a wide range of students, bringing multiple perspectives to our research program, and creating a supportive and welcoming culture that is critical to student success. Awareness of the need for diversity and inclusion is especially critical in computer science, a discipline with a long track record of underrepresenting women and minorities. Diversity initiatives at Johns Hopkins University and the Whiting School of Engineering: Diversity at JHU Johns Hopkins University’s Roadmap on Diversity and Inclusion Diversity and Inclusion at the Whiting School of Engineering Homewood Council on Inclusive Excellence Faculty Diversity Initiatives Funding Opportunity: Vivien Thomas PhD Scholars The Vivien Thomas Scholars Initiative is dedicated to nurturing, mentoring, and connecting the exceptional diverse talent that exists at historically black colleges and universities and other minority serving institutions to STEM graduate education and future leadership in STEM careers. Interested students must apply directly to their desired PhD program and submit a supplemental application for the scholarship. Please note the December 1 deadline for scholarship applications. Learn more about the Vivien Thomas Scholars Initiative Diversity- and inclusion-related organizations The Department of Computer Science and the Whiting School of Engineering have a variety of organizations related to diversity and supporting the success of women and underrepresented minorities. Graduate Association of Women in Computer Science and Engineering Graduate Queer/Straight Alliance National Society of Black Engineers, JHU chapter Society of Hispanic Professional Engineers, JHU chapter Women Faculty Forum at Homewood Women in Computer Science (undergraduate students) Women of Whiting (grad students and postdocs) Funding Opportunity: Google’s Award for Inclusion Research Program Google’s Award for Inclusion Research Program is an ongoing effort to support innovative research and professors working to create positive societal impact in the areas of accessibility, algorithmic fairness, higher education and collaboration, and participatory ML. Learn more about the Award for Inclusion Research Program Engineering Outreach Programs WSE’s Center for Educational Outreach provides: STEM curricular support to Baltimore City schools, including a partnership with Barclay Elementary/Middle School, Engineering Innovation Pre-College Programs, and college-level STEM educational programs for students from across the country aimed at increasing representation of women and minorities in STEM education and careers. The Whiting Internships in Science & Engineering (WISE) Program, which provides hands-on research opportunities in WSE faculty labs and mentorship for students in Baltimore City schools. Department of Computer Science Outreach The department participates in North American Computational Linguistics Olympiad (NACLO), a competition for students in grades 6–12 that introduces them to challenges in the field of computational linguistics. Students and faculty attend diversity-focused computing conferences, including the Grace Hopper Celebration of Women in Computing and the CMD-IT/ACM Richard Tapia Celebration of Diversity in Computing. Graduate Admissions Diversity Initiatives We are committed to creating greater diversity in our doctoral programs and have adopted an admissions process that seeks the most talented students with the highest potential for research success and that emphasizes achievement relative to available opportunity. We waive GRE requirements for students who are unable to take the GRE and have low application fees, which can also be waived for first-generation college students or participants in programs such as NNE or SACNAS. We offer EHOP (Explore Hopkins Program) each fall, a program that brings prospective doctoral students from underrepresented backgrounds to campus for an intimate opportunity to learn more about our programs. Diversity Committee In fall 2020, the Department of Computer Science launched its first Diversity and Inclusion Committee. The committee embodies two principles: it is representative—members are drawn from all constituencies, including undergraduate students, graduate students, staff, and faculty—and it has independent authority to execute its policy and oversight mission. The mission of the Diversity and Inclusion Committee is to guide the Department to develop and implement research-grounded initiatives that will ensure a safe space for all in our community, to foster inclusivity, and to ensure that we succeed as individuals and together. The committee will review the implementation of diversity and inclusion in all department functions and report to the faculty on the successes and shortcomings of the implementation in an action plan. To contact the committee, email diversityandinclusion@cs.jhu.edu. To submit anonymous feedback on your experience in the department, use this form. <img class="gallery_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/10/Front-page-thumbnail-300x169.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/10/Front-page-thumbnail.jpg 1220w, https://www.cs.jhu.edu/wp-content/uploads/2024/10/Front-page-thumbnail-980x552.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/10/Front-page-thumbnail-740x416.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/10/Front-page-thumbnail-500x282.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/10/Front-page-thumbnail-300x169.jpg 300w" sizes="100vw" alt="The Johns Hopkins seal on the floor of Gilman Hall." itemprop="image"> University recognized for fostering diverse and inclusive environments - Insight into Diversity honored JHU for the fourth consecutive year with its annual Higher Education Excellence in Diversity Award. <img class="gallery_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/09/Front-page-thumbnail-300x169.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/09/Front-page-thumbnail.jpg 1220w, https://www.cs.jhu.edu/wp-content/uploads/2024/09/Front-page-thumbnail-980x552.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/09/Front-page-thumbnail-740x416.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/09/Front-page-thumbnail-500x282.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/09/Front-page-thumbnail-300x169.jpg 300w" sizes="100vw" alt="The 19 scholars who make of the third cohort of Vivien Thomas Scholars at Johns Hopkins University." itemprop="image"> Johns Hopkins welcomes third cohort of Vivien Thomas Scholars - 19 scholars recently joined JHU to begin pursuing PhDs as a part of a $150 million initiative designed to advance pathways for students from historically Black colleges and universities and minority-serving institutions in STEM fields. <img class="gallery_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/09/Front-page-thumbnail-1-300x169.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/09/Front-page-thumbnail-1.jpg 1220w, https://www.cs.jhu.edu/wp-content/uploads/2024/09/Front-page-thumbnail-1-980x552.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/09/Front-page-thumbnail-1-740x416.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/09/Front-page-thumbnail-1-500x282.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/09/Front-page-thumbnail-1-300x169.jpg 300w" sizes="100vw" alt="Reflection of the Gilman tower in MSE Library Q-Level door." itemprop="image"> Growing diversity among Johns Hopkins student, faculty, and staff communities - The most recent editions of Johns Hopkins University’s reports on the composition of its student, faculty, and staff populations show steady, sustained progress in the university’s ongoing efforts to increase the number of affiliates from groups that are underrepresented in higher education. <img class="gallery_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/09/Front-page-thumbnail-2-300x169.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/09/Front-page-thumbnail-2.jpg 1220w, https://www.cs.jhu.edu/wp-content/uploads/2024/09/Front-page-thumbnail-2-980x552.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/09/Front-page-thumbnail-2-740x416.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/09/Front-page-thumbnail-2-500x282.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/09/Front-page-thumbnail-2-300x169.jpg 300w" sizes="100vw" alt="Headshot of Muyinatu Bell." itemprop="image"> Muyinatu Bell honored for promoting diversity and inclusion in imaging technologies - Bell, who has a secondary appointment in the Department of Computer Science, was recently named to the inaugural cohort of the Chan Zuckerberg Initiative’s Science Diversity Leadership Awards for her groundbreaking research in imaging technologies to improve breast cancer detection.'
