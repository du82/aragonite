title = "Machine Learning, AI, & Data Science - Department of Computer Science"
description = "Our faculty are applying cutting-edge machine learning and artificial intelligence techniques to new datasets and domains."
full_description = 'Computers are now predicting stock market changes, detecting cancer, and translating documents—all thanks to the power of machine learning and artificial intelligence. At the forefront of this field are Hopkins engineers and computer scientists, building better algorithms to tackle problems once thought to be too complex for computers to solve. One of the department’s greatest strengths is applying data science and analytics to health care applications. Projects include using wearables data to monitor and prevent health problems, improving diagnostics, and turning patient care into precision medicine. Notably, our researchers quickly shifted focus to contribute to the fight against COVID-19 by developing prediction models to track the pandemic and analyzing data to understand health disparities, among other projects. Research Centers and Labs Data Science and AI Institute The Johns Hopkins Data Science and AI Institute focuses on research and education in data science, machine learning, and artificial intelligence across diverse fields, including neuroscience, precision medicine, climate resilience, sustainability, public-sector innovation, and social sciences. Data Science and AI Institute Institute for Data Intensive Engineering and Science The IDIES mission is to coalesce data-intensive science efforts at Johns Hopkins into a well-focused center of activity and to propel various fields towards new discoveries and breakthroughs. Institute for Data Intensive Engineering and Science JHU Machine Learning Group Our machine learning community seeks to push forward the state of the art in terms of theory, algorithms, models, and applications with an eye toward solving the most important challenges of our day. JHU Machine Learning Group Malone Center for Engineering in Healthcare The Malone Center for Engineering in Healthcare brings together engineers, clinicians, and care providers who are leveraging data analytics in novel ways, pioneering new technologies, and applying systems engineering principles to speed the deployment of research-based innovations that will enhance the efficiency, effectiveness, and consistency of health care. Malone Center for Engineering in Healthcare Mathematical Institute for Data Science The Mathematical Institute for Data Science (MINDS) at Johns Hopkins University brings together a multidisciplinary team of mathematicians, statisticians, computer scientists, and engineers to develop the fundamental mathematical, statistical, and computational principles for the analysis and interpretation of massive amounts of complex, high-dimensional data. Mathematical Institute for Data Science People Raman Arora Associate Professor Department of Computer Science﻿ Email: rarora8@jhu.edu Phone: 410-516-1327 Vladimir Braverman Associate Head of Faculty and Professor Department of Computer Science﻿ Department of Applied Mathematics and Statistics﻿ Email: vbraver1@jhu.edu Phone: 410-516-4975 Randal Burns Bill and Lisa Stromberg Department Head and Professor Department of Computer Science﻿ Email: randal@cs.jhu.edu Phone: 410-516-8775 Anton Dahbura Executive Director of the Johns Hopkins University Information Security Institute and Co-Director of the Johns Hopkins Institute for Assured Autonomy Department of Computer Science﻿ Email: AntonDahbura@jhu.edu Phone: 410-516-0211 Mark Dredze Interim Deputy Director of the Data Science and AI Institute, Associate Head of Research and Strategic Initiatives, and John C. Malone Professor Department of Computer Science﻿ Email: mdredze@cs.jhu.edu Kevin Duh Assistant Research Professor Department of Computer Science﻿ Email: kevinduh@cs.jhu.edu Jason Eisner Professor Department of Computer Science﻿ Email: eisner@jhu.edu Phone: 410-516-8438 Anjalie Field Assistant Professor Department of Computer Science﻿ Email: afield6@jhu.edu Gillian Hadfield Research Professor Department of Computer Science﻿ Email: ghadfield@jhu.edu Craig Jones Assistant Research Professor Depa