["https://www.cs.jhu.edu/academic-programs/graduate-studies/mse-programs"]
title = "Master of Science in Engineering in Computer Science (MSE) - Department of Computer Science"
description = "The Computer Science Department in the Whiting School of Engineering (WSE) of Johns Hopkins University offers full-time programs at the Homewood campus in Baltimore."
full_description = 'The Computer Science Department in the Whiting School of Engineering (WSE) of Johns Hopkins University offers full-time programs at the Homewood campus in Baltimore. The MSE in Computer Science offers an official concentration in Human Language Technology, its only concentration jointly administered with the Center for Language and Speech Processing. (We also offer a Master of Science in Security Informatics.) Entering students are expected to have completed a program of study equivalent to that required by the BS in computer science. Applicants from other disciplines are expected to have coursework (or equivalent experience) in intermediate programming (C++ and Java), data structures, computer system fundamentals, and mathematical foundations for computer science. As part of the Home to Hopkins program, full-time students are eligible to take up to two online courses through the Whiting School’s Engineering for Professionals program the summer before they start their full-time, residential master’s program. These courses apply to their master’s degree if satisfactorily completed. You can view the list of approved courses here. Email admissions@cs.jhu.edu to request more information. The application process is handled through WSE’s Graduate Admissions Office online graduate student application. You will find instructions for applying to graduate degree programs for both international and domestic students here. Additionally, please review the MSE Admissions FAQ page for answers to commonly asked questions. The Department of Computer Science reviews applications on a holistic basis; GRE scores are not reviewed by the admissions committee and thus are not a factor in final decisions. If you have further questions, feel free to email admissions@cs.jhu.edu. All required application materials are due at 11:59 PM EST by the deadlines for consideration: MSE Degree Applicants Fall admission – February 15 Spring admission – October 1 (Applications will be accepted until November 15th for the Spring 2025 term only. Applications received after the October 1 deadline will receive a decision in mid-December.) BS/MSE Degree Applicants Fall admission – February 15 Spring admission – November 15 The MSE CS application requires: Application Statement of purpose Resume/CV TOEFL/IELTS (international applicants only) Two letters of recommendation Unofficial transcripts — If admitted, we will additionally require official versions. Apply free! No application fee required. The Department of Computer Science reviews applications on a holistic basis and does NOT require a GRE score. Learn about the admissions process and apply today Office of Graduate Admissions <img class="visual_image" src="https://www.cs.jhu.edu/wp-content/uploads/2020/01/Deep-learning-19-class-pic-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2020/01/Deep-learning-19-class-pic-980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2020/01/Deep-learning-19-class-pic-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2020/01/Deep-learning-19-class-pic-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2020/01/Deep-learning-19-class-pic-300x200.jpg 300w" sizes="100vw" alt="Students present final projects for Machine Learning: Deep Learning in Hackerman Hall." itemprop="image"> For Current Students Policies, resources, forms, course information, and services for graduate students. RESOURCES FOR CURRENT STUDENTS'
