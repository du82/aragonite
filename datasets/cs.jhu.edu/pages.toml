description = "Mathias Unberath is the John C. Malone Associate Professor in the Department of Computer Science with secondary appointments in the Departments of Ophthalmology and Otolaryngology—Head and Neck Surgery at the…"
full_description = '{ "@context": "http://schema.org", "@type": "Person", "email": "mailto:mathias@jhu.edu", "image": "", "jobTitle": "John C. Malone Associate Professor", "name": "Mathias Unberath", "telephone": "410-516-4253", "url": "https://www.cs.jhu.edu/faculty/mathias-unberath/", "address": "327 Malone Hall" } Contact 410-516-4253 mathias@jhu.edu Location 327 Malone Hall Research Areas Computer-assisted medicine Computer vision Artificial intelligence and machine learning Mixed reality Medical robotics Connect Google Scholar Lab Website Twitter Website Mathias Unberath is the John C. Malone Associate Professor in the Department of Computer Science with secondary appointments in the Departments of Ophthalmology and Otolaryngology—Head and Neck Surgery at the School of Medicine. He is also a core faculty member of the Laboratory for Computational Sensing and Robotics (LCSR) and the Malone Center for Engineering in Healthcare and an affiliate faculty member in the Institute for Assured Autonomy. Mathias is a member of the Data Science and Artificial Intelligence Institute. With his group, the Advanced Robotics and Computationally AugmenteD Environments (ARCADE) Lab, Unberath builds the future of computer-assisted medicine. Through synergistic research on imaging, computer vision, machine learning, and interaction design, he invents human-centered solutions that are embodied in emerging technologies such as mixed reality and robotics. He has published more than 150 journal and conference articles and has received numerous awards, grants, and fellowships, including the National Institute of Biomedical Imaging and Bioengineering Trailblazer R21 Award, an NSF CAREER Award, a Google Research Scholar Award, a Johns Hopkins Career Impact Award, and an inaugural Johns Hopkins Data Science and AI Institute Junior Faculty Award. While completing a bachelor’s in physics and master’s in optical technologies at the Friedrich-Alexander University of Erlangen-Nürnberg (FAU), Unberath also studied at the University of Eastern Finland as an Erasmus Mundus scholar in 2011 and joined Stanford University as a DLR-DAAD fellow in 2014. He received his PhD in computer science from FAU and graduated summa cum laude in 2017. Prior to joining as faculty, Unberath was an assistant research professor in the department and a postdoctoral fellow at LCSR. Related News View All News <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2025/03/unberath_lab-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2025/03/unberath_lab-980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2025/03/unberath_lab-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2025/03/unberath_lab-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2025/03/unberath_lab-300x200.jpg 300w" sizes="100vw" alt="A group of 7 ARCADE Lab members and Mathias Unberath pose in the Mock OR."> America’s global scientific edge relies on its investment in research Categories Department News Johns Hopkins computer scientist Mathias Unberath, a leading expert in AI-assisted medicine, says cuts to research funding imperil the nation’s ability to attract the world’s best and brightest scientists. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2023/06/Mathias-Unberath-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2023/06/Mathias-Unberath.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2023/06/Mathias-Unberath-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2023/06/Mathias-Unberath-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2023/06/Mathias-Unberath-300x200.jpg 300w" sizes="100vw" alt="Headshot of Mathias Unberath."> Mathias Unberath named Provost’s Fellow for Public Engagement Categories Awards and Honors Fellows will take part in a yearlong program to increase the reach and impact of their research while building skills for engaging the public across a range of platforms. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/11/3-people-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/11/3-people.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/11/3-people-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/11/3-people-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/11/3-people-300x200.jpg 300w" sizes="100vw" alt="Headshots of Drew Prinster, Yiqing Shen, and Yunjuan Wang."> Three graduate students named 2024–2025 AI2AI Fellows Categories Graduate Stories Awards and Honors Drew Prinster, Yiqing Shen, and Yunjuan Wang were selected based on their outstanding publication records, research proposals, and mentor support.'
