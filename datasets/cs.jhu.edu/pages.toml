["https://www.cs.jhu.edu/faculty/randal-burns"]
title = "Randal Burns - Department of Computer Science"
description = "Randal Burns is the Bill and Lisa Stromberg Head of the Department of Computer Science in the Whiting School of Engineering at the Johns Hopkins University. He is also a…"
full_description = '{ "@context": "http://schema.org", "@type": "Person", "email": "mailto:randal@cs.jhu.edu", "image": "", "jobTitle": "Bill and Lisa Stromberg Department Head and Professor", "name": "Randal Burns", "telephone": "410-516-8775", "url": "https://www.cs.jhu.edu/faculty/randal-burns/", "address": "163 Malone Hall" } Contact 410-516-8775 randal@cs.jhu.edu Location 163 Malone Hall Research Areas Large data sets for scientific applications Query processing for data-intensive science applications Redundancy coding and auditing of outsourced storage services Adaptive performance management for network data protocols Scalable systems that support neuroscience imaging analysis and annotation Connect Google Scholar Website Randal Burns is the Bill and Lisa Stromberg Head of the Department of Computer Science in the Whiting School of Engineering at the Johns Hopkins University. He is also a member of the Data Science and Artificial Intelligence Institute. His research has pushed the scalability limits of data science based on emergent storage technologies; this has ranged from engineering file systems for storage area networks in the 1990s, building scientific web services on scale-out cloud storage in the 2000s, and developing graph and sparse-matrix engines for machine learning in the 2010s and ’20s. His work has been inspired by high-throughput science, including numerical simulations for turbulence and neuroscience microscopy. Burns is a recipient of an NSF CAREER Award and was a U.S. Department of Energy Early Career Principal Investigator. A fellow of the Kavli Neuroscience Discovery Institute, he was also a member of Defense Science Study Group’s 2012–2013 class and served as a member of DARPA’s Information Science and Technology Study Group from 2020 to 2024. He currently serves on Computing Research Association’s Computing Community Consortium Council. Burns earned a BS in geophysics at Stanford University in 1993 and a PhD in computer science from the University of California, Santa Cruz in 2000. Prior to joining Johns Hopkins, he was a research staff member at IBM’s Almaden Research Center, where he won an Outstanding Innovation Award. Related News View All News <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4-300x200.jpg 300w" sizes="100vw" alt="Portrait of Paul Stanton."> CS alum appointed director of Defense Information Systems Agency Categories Alumni Spotlight Army Lieutenant General Paul T. Stanton, Engr ’11 (PhD) recently assumed the roles of director of DISA and commander of the Joint Force Headquarters-Department of Defense Information Network. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/04/JHU9432-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/04/JHU9432-980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/04/JHU9432-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/04/JHU9432-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/04/JHU9432-300x200.jpg 300w" sizes="100vw" alt="A brick breezeway on the Homewood campus."> Celebrating the 2024 department and school awardees Categories Awards and Honors Department News Student Experience Outstanding students and faculty were honored at the annual Computer Science Department Awards Ceremony. Randal Burns named the Bill and Lisa Stromberg Head of Computer Science Categories Awards and Honors Department News The endowed headship was established in 2019 through the generosity of William (Bill) and Lisa Stromberg.'
