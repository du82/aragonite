title = "Theory & Programming Languages - Department of Computer Science"
description = "Our Theory & Programming Languages group focuses on the design, implementation, and use of computer programming languages."
full_description = 'Our programming languages research spans many areas and includes type systems, language design, type inference, efficient implementation of higher-order typed languages, side effects, concurrency, security, and metaprogramming. Our researchers also investigate a broad variety of theoretical problems with the goal of gaining insights into some of the most important issues in computer science today. Active research areas include streaming algorithms, pseudorandomness, approximation algorithms, theoretical networking, hardness of approximation, and cryptography. Research Groups and Labs Algorithms and Complexity Studying a broad variety of theoretical problems to gain insight into some of the most fundamental problems of computer science. Algorithms and Complexity Programming Languages Laboratory Focusing on fundamental problems in programming languages. Programming Languages Laboratory People Vladimir Braverman Associate Head of Faculty and Professor Department of Computer Science﻿ Department of Applied Mathematics and Statistics﻿ Email: vbraver1@jhu.edu Phone: 410-516-4975 Michael Dinitz Associate Professor Department of Computer Science﻿ Department of Applied Mathematics and Statistics﻿ Email: mdinitz1@jhu.edu Phone: 410-516-6251 Susan Hohenberger-Waters Research Professor Department of Computer Science﻿ Email: susan@cs.jhu.edu Abhishek Jain Associate Professor Department of Computer Science﻿ Email: abhishekjain@jhu.edu Phone: 410-516-4276 S. Rao Kosaraju Edward J. Schaefer Professor Emeritus Department of Computer Science﻿ Email: skosara1@jhu.edu Phone: 410-516-8134 Xin Li Associate Professor Department of Computer Science﻿ Email: xli113@jhu.edu Phone: 410-516-5847 Scott Smith Director of Graduate Studies and Professor Department of Computer Science﻿ Email: scott@cs.jhu.edu Phone: 410-516-5299 <img class="visual_image" src="https://www.cs.jhu.edu/wp-content/uploads/2023/12/cartoon-ski-choice-980x654-1-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2023/12/cartoon-ski-choice-980x654-1.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2023/12/cartoon-ski-choice-980x654-1-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2023/12/cartoon-ski-choice-980x654-1-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2023/12/cartoon-ski-choice-980x654-1-300x200.jpg 300w" sizes="100vw" alt="A cartoon of a man at a ski resort, standing outside the ski shop looking at skis." itemprop="image"> Computer scientists take fresh run at classic ski rental problem Researchers seek optimal choices at the ski lodge and inside the operating system. Read More'
