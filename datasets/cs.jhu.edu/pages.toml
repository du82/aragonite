title = "Department of Computer Science - Department of Computer Science"
description = "The Johns Hopkins Department of Computer Science offers BA, BS, MS, and PhD programs in computer science, and an MS program in security informatics. Areas of focus include core computer science topics and cross-disciplinary application areas including: computational biology and medicine, machine learning, and speech and language processing."
full_description = 'Program Highlights Undergraduate Programs By offering both BS and BA degree programs, students can pursue a degree with a highly technical focus or one that is better suited to be combined with a non-engineering major. Undergraduate Programs Master’s in Engineering Computer Science Pursue an MS degree in computer science to have a competitive advantage in some of today’s most in-demand career fields. MSE Program Master of Science in Security Informatics The full-time MSSI program is an immersive, three-semester program providing educational, research, and professional opportunities that are simply unparalleled in this rapidly expanding field. MSSI Program PhD Program As a doctoral student in computer science, you will be mentored by world-renowned faculty members, collaborate across university divisions, and contribute to the creation of knowledge. PhD Program <img class="visual_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/04/Pava-Center1-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/04/Pava-Center1-980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/04/Pava-Center1-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/04/Pava-Center1-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/04/Pava-Center1-300x200.jpg 300w" sizes="100vw" alt="The exterior of the Pava Maria LaPere Center for Entrepreneurship" itemprop="image"> Singhal Family Entrepreneurship Award The Department of Computer Science, in collaboration with the Pava Maria LaPere Center for Entrepreneurship, is pleased to announce new awards that will help launch student-run software ventures at Johns Hopkins University. Learn More The power and promise of data science and AI Learn about our investment in new faculty as part of the university’s historic commitment to building the nation’s foremost destination for emerging applications, opportunities, and challenges presented by data science, machine learning, and AI. Learn more Get to know Johns Hopkins Computer Science Discover Computer Science at Johns Hopkins - Learn about our community, our educational and research activities, our student groups, and more—directly from our students and faculty. <img class="gallery_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-2-300x169.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-2.jpg 1220w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-2-980x552.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-2-740x416.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-2-500x282.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-2-300x169.jpg 300w" sizes="100vw" alt="A figure holds their hand near their ear and listens carefully as alphabet letters fly in." itemprop="image"> Chatbots tell us what we want to hear - A Johns Hopkins-led team found that chatbots reinforce our biases, providing insight into how AI could widen the public divide on controversial issues. <img class="gallery_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-1-300x169.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-1.jpg 1220w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-1-980x552.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-1-740x416.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-1-500x282.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-1-300x169.jpg 300w" sizes="100vw" alt="Students code on their laptops at a table overflowing with snacks." itemprop="image"> Crunch time for coders - HopHacks brings college students to Johns Hopkins University every year to ‘hack’ together solutions to real-world problems in just 36 hours. <img class="gallery_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-300x169.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail.jpg 1220w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-980x552.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-740x416.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-500x282.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2024/08/Front-page-thumbnail-300x169.jpg 300w" sizes="100vw" alt="A close-up shot of servers in a server rack with lighted LEDs." itemprop="image"> Johns Hopkins makes major investment in data science and artificial intelligence - A new data science and translation institute will bring together experts from a wide range of disciplines to capitalize on the rapidly emerging potential of data to fuel discovery across the university. <img class="gallery_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2022/09/Screen-Shot-2022-09-21-at-10.37.01-AM-300x169.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2022/09/Screen-Shot-2022-09-21-at-10.37.01-AM-1220x686.jpg 1220w, https://www.cs.jhu.edu/wp-content/uploads/2022/09/Screen-Shot-2022-09-21-at-10.37.01-AM-980x552.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2022/09/Screen-Shot-2022-09-21-at-10.37.01-AM-740x416.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2022/09/Screen-Shot-2022-09-21-at-10.37.01-AM-500x282.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2022/09/Screen-Shot-2022-09-21-at-10.37.01-AM-300x169.jpg 300w" sizes="100vw" alt="A student looking at a computer screen, viewed through glass with equations marked on it in marker." itemprop="image"> Learn more about the department - Check out a snapshot of the Department of Computer Science here. Latest News View All News <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2025/02/980x654-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2025/02/980x654.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2025/02/980x654-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2025/02/980x654-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2025/02/980x654-300x200.jpg 300w" sizes="100vw" alt="Illustration of scales, with an X on one side and a checkmark on the other."> Hopkins team researches design of ethical intervention policies for artificial agents Categories Research Supported by a Challenge Grant from the Johns Hopkins Institute for Assured Autonomy, a team led by Chien-Ming Huang is investigating the conceptual and technological advances required to enable artificial agents to act with prosocial intent. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2025/01/980x654-4-300x200.jpg 300w" sizes="100vw" alt="Portrait of Paul Stanton."> CS alum appointed director of Defense Information Systems Agency Categories Alumni Spotlight Army Lieutenant General Paul T. Stanton, Engr ’11 (PhD) recently assumed the roles of director of DISA and commander of the Joint Force Headquarters-Department of Defense Information Network. <img class="news_item_image" src="https://www.cs.jhu.edu/wp-content/uploads/2025/02/980x654-1-300x200.jpg" srcset="https://www.cs.jhu.edu/wp-content/uploads/2025/02/980x654-1.jpg 980w, https://www.cs.jhu.edu/wp-content/uploads/2025/02/980x654-1-740x494.jpg 740w, https://www.cs.jhu.edu/wp-content/uploads/2025/02/980x654-1-500x334.jpg 500w, https://www.cs.jhu.edu/wp-content/uploads/2025/02/980x654-1-300x200.jpg 300w" sizes="100vw" alt="A colorful illustration of a human abdominal cavity showing internal organs in the style of a road map."> AI-powered map of the abdomen could help find cancer early on Categories Research Department News Johns Hopkins researchers used artificial intelligence to create the largest, most comprehensive dataset of abdominal organs to date to help radiologists quickly and accurately identify tumors and other diseases.'
