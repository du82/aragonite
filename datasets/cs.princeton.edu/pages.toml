["https://cs.princeton.edu/courses/archive/spring25/cos240"]
title = "COS 240, Spring 2025: General Information"
full_description = "An introduction to mathematical topics relevant to computer science. Combinatorics, probability and graph theory will be covered in the context of computer science applications. The course will present a computer science approach to thinking and modeling. Students will be introduced to fundamental concepts in theoretical computer science, such as NP-completeness and cryptography that arise from the world view of efficient computation. We will cover basic topics in math that are important in computer science as well as basic topics in theoretical computer science. The following is a rough estimation of the number of lectures spent on each topic: Mathematical Proofs (1.5 lectures); Combinatorics (2 lectures); Probability Theory (6 lectures); Midterm Exam (replacing 1 lecture); Graph Theory (4 lectures); Game Theory (1.5 lectures); Countable vs Uncountable Sets (1 lecture); Theoretical Computer Science (Computability, Complexity, Cryptography) (7 lectures). Please direct questions concerning your precept assignment to Colleen Kenny-McGinley, the CS Department's Undergraduate Program Manager. Colleen's contact information is provided later on this page. The course's professor, lead preceptors, and graduate student preceptors do not manage precept assignments. COS 126 and 226 (or sufficient mathematical background), and MAT 175 or MAT 202 or MAT 204. COS 226 can be taken along with COS 240 in the same term."
