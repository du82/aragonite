title = "Outreach initiatives | CS"
full_description = "Princeton AI4ALLThe Princeton Computer Science Department, the Princeton Center for Information Technology Policy, and the AI4ALL Foundation run an annual summer camp to teach high school students from underrepresented groups about artificial intelligence. The Princeton AI4ALL was featured on the Today Show in 2023:Princeton Science Outreach PartnershipSTEM Academy High School of Edison, NJ visits Princeton for a half day interactive session. Students visited the robotics lab and the micro/nano fabrication center. They also met with current undergraduates, graduates, and faculty. STEM Academy students visiting Princeton Past InitiativesPrinceton CS in Puerto Rico - The Princeton CS in Puerto Rico summer program combined computer science education and community service projects in Puerto Rico. Princeton undergraduates served as teaching assistants for an introductory computer science course at the University of Puerto Rico Mayagüez. In addition, the student team participated in various community service projects to aid in hurricane recovery and rebuilding efforts.Prison Teaching Initiative - The Prison Teaching Initiative sought to bridge Princeton University’s academic and service-driven missions by providing the highest quality post-secondary education to incarcerated students in New Jersey. The initiative offered Princeton University graduate students, postdocs, faculty, and staff innovative, evidence-based pedagogy training and the chance to diversify their teaching portfolios through intensive classroom experience. The program also fostered a robust campus dialogue on mass incarceration and its relationship to systemic inequalities in access to education."
