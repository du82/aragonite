 He will attend a one-year, fully funded master’s degree program in global affairs at Tsinghua University in Beijing. December 18, 2024 ‘AI Snake Oil’: A conversation with Princeton AI experts Arvind Narayanan and Sayash Kapoor The acclaimed new book “AI Snake Oil” by Princeton AI scholars Arvind Narayanan and Sayash Kapoor offers readers surprising insights on what should excite people most, and what should alarm us, about AI."
