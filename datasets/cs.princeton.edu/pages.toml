["https://cs.princeton.edu/news/adji-bousso-dieng-honored-materials-research-society"]
title = "Adji Bousso Dieng honored by the Materials Research Society | CS"
full_description = "February 4, 2025 News Body The Materials Research Society has named Adji Bousso Dieng an Early Career Distinguished Presenter at its 2025 Spring Meeting. Dieng, an assistant professor of computer science, has been selected to present her work at the symposium on harnessing datacentric strategies for materials science. She is one of two early career researchers to receive this honor. Image Adji Bousso Dieng. Photo by Sameer Khan/Fotobuddy Early Career Distinguished Presenters are chosen to highlight exciting new directions in materials research. Dieng has been cited for her contributions to computational materials discovery. She will present her work on Vendi Scoring, a new line of research led by her lab, Vertaix. Dieng’s work will also be featured in the MRS Communications journal and considered for the 2026 MRS Communications Lecture, which honors outstanding research in materials science.Dieng joined the Princeton faculty in September 2021. Her lab works at the intersection of artificial intelligence and the natural sciences. She is also a research scientist at Google AI. Dieng's work has been recognized by the 2022 Schmidt Sciences AI2050 Early Career Fellowship and the 2022 Annie T. Randall Innovator Award from the American Statistical Association. In 2023, Columbia’s Graduate School of Arts and Sciences named her an Outstanding Recent Alumni. Dieng’s doctoral thesis won the Savage Award from the International Society for Bayesian Analysis, and she received a Google Ph.D. Fellowship.At Princeton, she is affiliated with the Department of Chemical and Biological Engineering, the Princeton Materials Institute, the Princeton Quantum Initiative, the Andlinger Center for Energy and the Environment, and the High Meadows Environmental Institute.Dieng is also the founder of The Africa I Know, a nonprofit organization dedicated to changing narratives about African history, knowledge, and innovation to inspire and empower young Africans to pursue careers in science and technology."
