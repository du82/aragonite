title = "Princeton Research Experience for Undergrads on AI and Machine Learning | CS"
full_description = "Image Student presenting as part of a Research Experience for Undergraduates at Princeton The computer science department at Princeton University invites students to apply to participate in a research experience for undergraduates (REU) focused on AI and artificial intelligence. This program aims to change the perceptions of who can become an AI scientist or engineer. We're working to create a more inclusive AI future. We seek students interested in research and welcome applicants from all majors, with a preference for those who have some demonstrated interest in AI/ML. Research experience is not required.Students chosen for the program will spend the summer at Princeton University conducting research on related to AI and machine learning under the guidance and mentorship of a Princeton faculty member. Women and other historically underrepresented groups in STEM disciplines are encouraged to apply. The 2025 program will run from June 1 to August 3. How to applyThe application is closed. Decisions will be released March 15.Important DatesApplication opens October 1, 2024Virtual information session with faculty mentors, December 17, 2024Application deadline February 1, 2025Notifications sent on March 15, 2025Residential program dates June 1, 2025-August 3, 2025 Eligibility and stipendParticipants must be U.S. Citizens or U.S. Permanent Residents; 18 years of age or olderCannot graduate before the end of REU in AugustMust be attending a two-year or four-year accredited state or community college/university in New JerseyCompleted at least 60 college credits and at least one AI/ML course or equivalentParticipants will receive a $700 weekly stipend; a housing and meal plan are includedQuestions? Email eysenbach@princeton.edu.element { width: 23%; margin-bottom: 10px; text-align: -webkit-center; } .elements { display: flex; flex-wrap: wrap; justify-content: space-around; } .element img{ border-radius:5px; }Faculty mentors Image Ben Eysenbach Image Jia Deng Image Vikram Ramaswamy Image Olga Russakovsky"
