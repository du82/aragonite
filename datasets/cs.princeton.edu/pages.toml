title = "Diversity & Outreach | CS"
full_description = 'Image Computer science students at the 2024 Richard Tapia Celebration of Diversity in Computing Conference The Department of Computer Science at Princeton University is committed to creating an inclusive and welcoming environment for all. We value collaboration, critical thinking and mechanisms to become more self-aware and accountable. We are aware of the persistent and often unique challenges that historically underrepresented students encounter in computing. Addressing these challenges in the classroom and beyond is a key focus in the department. We strive to ensure that all students, faculty and staff feel a sense of belonging. In 2023, the department hired an Assistant Director of Diversity, Equity and Inclusion to serve in an inaugural role dedicated to supporting these values. Image Students presenting research on human-computer interaction “Always, and especially now, this campus must stand firmly for equality, inclusion, and respect," said Princeton President Christopher Eisgruber. "Our community must be a place where students, faculty, and staff of all identities feel fully welcome, free to express themselves, and able to participate fully in the transformational educational experiences that Princeton offers."'
