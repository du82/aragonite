full_description = "Image Faculty Supporting Inclusive ExcellenceVolunteer for one or more of these opportunities below by reaching out to any member of the Climate & Inclusion Committee:Co-host a student mixer! Mingle with undergraduate students outside of the classroom. Some mixers are themed while others are open to any topic of discussion.Volunteer to assist with the Pre-Application Mentoring Program for prospective graduate students.Partner with the Princeton Graduate School on the Princeton Prospective Ph.D. Preview (P3). Support first-generation and low-income students by serving as a faculty/staff fellow with the Scholars Institute Fellows Program.If you want to get involved but aren’t sure how, reach out to any member of the Climate & Inclusion committee and we’ll figure it out!University ResourcesEmployee Resource Groups Princeton Human Resources Events Many Voices, One Future Bias, Discrimination and/or Harassment – Princeton University is committed to creating a safe environment for all members to thrive. Resources on how to report bias, your options and expectations can be found on the Many Voices, One Future website. Other Public ResourcesProgram in Algorithmic and Combinatorial Thinking (PACT)- This is a program with a focus on the theoretical foundations of computer science. Participants are mostly high school students. PACT consists of a 5-week summer program followed by a year-round program.LEAP Alliance - The LEAP Alliance is an NSF-funded Broadening Participation in Computing Alliance focused on diversifying future leadership in the computing professoriate at research universities as a way to increase diversity across the field of computing.Alliance for Identity Inclusive Computing Education - AiiCE’s collective impact approach to broadening participation convenes national leaders in K-16 computer science (CS) education to transform high-school and post-secondary CS education using identity-inclusive strategies that target people, policies, and practices."
