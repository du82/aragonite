ty faculty, staff and students.This talk will be open to the public, at this link, via Zoom. It will be recorded and posted here, on the CITP YouTube channel, and on the Princeton University Media Central channel.If you need an accommodation for a disability please contact Jean Butcher at butcher@princeton.edu at least one week before the event.Contributions to and/or sponsorship of any event does not constitute departmental or institutional endorsement of the specific program, speakers or views presented. Date and Time Tuesday February 18, 2025 12:30pm - 1:30pm Location Sherrerd Hall 306 Event Type Center for Information Technology Policy Speaker Lydia Liu, from Princeton University Host Center for Information Technology Policy (CITP) Website https://citp.princeton.edu/event/citp-seminar-liu/"
