title = "COS 217, Spring 2025 - Course Info"
full_description = "Discussion forum. The best way to ask a short question about the course materials is via Ed Discussion, an online discussion forum where you can ask (and answer) questions. Lab TAs. Undergraduate lab TAs are available to answer general computing questions in Lewis Library. They can assist you in debugging, provided you have first made a reasonable effort to identify the bug and isolate the problem. For non-debugging questions, use Ed Discussion or office hours. Canvas. You can find links for Zoom office hours, electronic reserves of course materials, and recorded versions of precepts in Canvas. Precept Assignment. The best way to get a spot in the precept of your choice is to regularly check the registrar's Course Offerings page and/or the listings on TigerHub. In our experience, more than a quarter of the total class enrollment changes precepts during shopping period. The course's teaching staff cannot manage precept assignments. Dramatic unresolved scheduling concerns can be addressed to the department's Undergraduate Program Manager: Colleen Kenny (ckenny@princeton.edu). C = Corwin Hall, CS = Computer Science Building, F = Friend Center, M = McCosh Hall, N = 221 Nassau Street, L = Lewis Library, T = Thomas Lab The staff is complemented by a team of undergraduate course assistants: Youssef Ali Abdelkader '27, Ahmad Ateyeh '25, Mila Bileska '25, Nick Feng '28, Nora Graves '26, Gabriel Haskell '28, Quinn Haverstick '25, Michael Igbinoba '27, Jalen Johnson '26, Nathan Kang '28, Armita Kazemi '28, Han Lee '26, Annie Lin '25, Isabel Liu '26, Pratham Longia '27, Christina Nikolova '26, Denish Patel '26, Albert Shi '26, Timothy Sim '26, Kareish Thony '27, Eren Umay '27, and Jerry Zhu '27. Description. Developing skills for composing large programs, including modularity, abstraction, programming style, and best practices for code development, testing, debugging, and performance tuning. Additionally, an overview of computing environments and architectures, through the C programming language, assembly language, and machine language."
