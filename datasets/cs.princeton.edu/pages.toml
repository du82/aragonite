title = "News | CS"
full_description = 'News Search February 4, 2025 Adji Bousso Dieng honored by the Materials Research Society The Materials Research Society has named Adji Bousso Dieng an Early Career Distinguished Presenter. January 28, 2025 Pravesh Kothari has joined the faculty, bringing expertise in theoretical computer science Pravesh Kothari has joined the Princeton faculty, bringing experience in theoretical computer science and algorithm design. January 22, 2025 Adji Bousso Dieng recognized by The Africa Report Adji Bousso Dieng, expert in artificial intelligence, has been recognized by The Africa Report magazine as one of 10 African Scholars to Watch in 2025. January 17, 2025 Korolova and Russakovsky receive Presidential Early Career Award for Scientists and Engineers Two computer science faculty members, Aleksandra Korolova and Olga Russakovsky, have been awarded the Presidential Early Career Award for Scientists and Engineers. January 16, 2025 James Zhang named Schwarzman Scholar Computer science student James Zhang, Class of 2025, has been named a Schwarzman Scholar. He will attend a one-year, fully funded master’s degree program in global affairs at Tsinghua University in Beijing. December 18, 2024 ‘AI Snake Oil’: A conversation with Princeton AI experts Arvind Narayanan and Sayash Kapoor The acclaimed new book “AI Snake Oil” by Princeton AI scholars Arvind Narayanan and Sayash Kapoor offers readers surprising insights on what should excite people most, and what should alarm us, about AI. December 2, 2024 More checks make AI fairer Currently, AI engineers evaluate fairness with a single leaderboard number, but research from Princeton Engineering shows that reducing fairness to a single metric could lead to societal harm. November 14, 2024 Tech policy conference highlighted the need for skilled talent across disciplines "Tech Policy: The Next Ten Years” brought together significant figures in academia, government and the private sector to explore the agenda for tech policy and the role the United States will play in the global arena. October 31, 2024 Tracking cell mutations, a new tool reveals how tumors evolve Researchers at Princeton have created a new tool to track the progression of mutations in cancer cells, showing how tumors evolve over time and in space. October 29, 2024 Mae Milano, expert in programming languages, joins the faculty Mae Milano, an expert in programming languages, joined the computer science faculty as an assistant professor in January 2024. October 15, 2024 Internet researchers reach beyond academia to close major security loophole For years a potential disaster lurked in the internet’s encryption system, threatening the security of organizations and individuals worldwide. Princeton engineers have now squelched that threat. October 15, 2024 For AI, secrecy often doesn’t improve security Researchers at a group of leading universities including Princeton caution that regulating limit access to AI models’ inner workings is likely to do more harm than good. Current page1 Page2 Page3 Page4 Page5 ... Next page ›› Last page Last »'
