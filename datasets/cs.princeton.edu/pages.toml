title = "Climate and Inclusion Committee | CS"
full_description = "The Climate and Inclusion Committee meets twice a month to develop and advance initiatives aimed at fostering an inclusive atmosphere. This committee is tasked with maintaining a comprehensive understanding and active engagement in all diversity, inclusion initiatives, and broadening participation efforts within the department.Faculty Members Image Matt Weinberg Image Amit Levy Image Pedro Paredes Staff Members Image Corina Hernandez Image Mikki HornsteinStudents Image Ivan Amado Krsul Portugal '26Shai Caspin G4The committee will undertake several special projects impacting the entire department, including the development of a Broadening Participation in Computing Plan, enhancing the climate for graduate students, reviewing and analyzing relevant data, fostering inter-population relationships (such as through COS mixers), and driving systemic change. Additionally, the committee will support and co-sponsor initiatives that align with the mission of creating welcoming and inclusive environments throughout the department.The committee also acts as a point of contact for the NSF-funded LEAP Alliance, AccessComputing, and the Princeton Diversity Practitioners Network. The department also sponsors travel to the Grace Hopper Celebration, the National Society of Black Engineers conference, and the Tapia Conference.If you would like to get involved with the committee or learn more, please email Corina Hernandez, Assistant Director of Diversity, Equity, and Inclusion, at ch4867@princeton.edu."
