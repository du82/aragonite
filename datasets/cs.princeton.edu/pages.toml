mber of the Community Data Science Collective and supported by the National Science Foundation Graduate Research Fellowship Program. She received a B.A. from Cornell University double majoring in government and information science, focusing on revolutions and ideology in the former and data science/ethics in the latter.In-person attendance is open to Princeton University faculty, staff and students. This talk will be open to the public via Zoom, at this link. It will be recorded and posted here, on the CITP YouTube channel, and on the Princeton University Media Central channel.If you need an accommodation for a disability please contact Jean Butcher at butcher@princeton.edu at least one week before the event.Sponsorship of an event does not constitute institutional endorsement of external speakers or views presented. Date and Time Tuesday March 4, 2025 12:30pm - 1:30pm Location Sherrerd Hall 306 Event Type Center for Information Technology Policy Speaker Sohyeon Hwang, from Princeton University Host Center for Information Technolofy Policy Website https://citp.princeton.edu/event/citp-seminar-hwang/"
