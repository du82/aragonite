full_description = "Image Students at the Grace Hopper Conference in 2023 Undergraduate Student ResourcesThere are numerous student organizations dedicated to serving Princeton students. Princeton Women in Computer Science (PWICS) plans regular events, partners with outside companies for information sessions, workshops and talks, and plays an active role in community outreach. Princeton Women in Computer Science is open to all students. More information can be found here. Engineering Organizations - Princeton Engineering students can choose from a wide range of student organizations that focus on professional development and outreach in science and engineering.Grace Hopper - To honor Grace Hopper’s legacy and inspire future generations of women in tech, Dr. Anita Borg and Dr. Telle Whitney founded Grace Hopper Celebration (GHC) in 1994. The AnitaB.org flagship event brings the research and career interests of women in computing to the forefront and highlights the contributions of women to the tech world. In the spring, students are welcome to apply to attend the fall conference. Pathways to Graduate School - The School of Engineering and Applied Science offers high-achieving, rising college seniors majoring in STEM disciplines the opportunity to prepare for graduate school at a one-day virtual event. This event provides a better understanding of graduate education through exposure to current graduate students and faculty representing the six engineering graduate programs and familiarity with the graduate school application process.Cultural and Affinity Groups at Princeton - Engage with people of similar backgrounds or connect with new identities right here at Princeton. Religious Life at Princeton Office of Disability Services Graduate Student ResourcesEngineering Organizations - Princeton Engineering students can choose from a wide range of student organizations that focus on professional development and outreach in science and engineering.Princeton Pathways into the Academy Program (PPIA)- This year-long career development program prepares early-stage researchers for faculty careers in engineering and computer science. The program offers structured support that supplements the guidance graduate students and postdoctoral researchers already receive from their advisors. It combines on-campus workshops along with virtual training and check-ins and other opportunities for ongoing mentorship and guidance."
