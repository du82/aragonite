["https://cs.rochester.edu/about/50th-anniversary.html"]
title = "50th Anniversary : About : Department of Computer Science : University of Rochester"
description = "On Friday Sept 27, 2024 the Department of Computer Science celebrated its 50th Anniversary."
full_description = "50th AnniversaryOn Friday Sept 27, 2024 the Department of Computer Science celebrated its 50th Anniversary. The celebration of the department's illustrious history—a fantastic gathering of students, alums, friends, family, and colleagues—was held at Wegmans Hall.Talks were given by Daniel Sabbah, Michael L. Scott, Amanda Stent and Christopher Stewart (available here). The day was capped off by a lively reception in Rush Rhees Library. Check out photos from the event at https://csrochester.kudoboard.com/boards/n2AkaTe4.We are incredibly grateful to everyone who joined us and contributed to making this event a success. Your support makes all the difference—please consider donating to create a lasting impact for the next generation of computer scientists. Here’s to many more years of Meliora!"
