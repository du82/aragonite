title = "Distinguished Gifts : News and Events : Department of Computer Science : University of Rochester"
description = "Danny Sabbah - 6/4/2024"
full_description = "Distinguished Gifts50th Anniversary Distinguished ProfessorshipDanny Sabbah - 6/4/2024An exciting endowed gift will help the department attract, and advance faculty excellence in teaching and research. Danny Sabbah ’74, ’78 (MS), ’82 (PhD) has committed $2 million to establish the 50th Anniversary Distinguished Professorship in Computer Science. Danny is a former chief technology officer and general manager of IBM Cloud and Next Gen Computing. He also serves on the Dean’s Advisory Committee for the Hajim School.We are incredibly grateful to Danny for his vision, partnership, and history of generosity. This gift honors the computer science department’s 50 year legacy of excellence, creates a vital pathway to support our faculty, and aligns with the University’s Boundless Possibility 2030 Strategic Plan. Its impact will certainly be felt for generations, building on the department’s strengths in artificial intelligence, systems, theory, and human-computer interaction.Learn more about Danny and his transformative gift at the UR Advancement website.Note that Danny will be a featured speaker at the department’s 50th anniversary celebration on September 27th.Considering a gift of your own? See our giving page to learn how you can support URCS."
