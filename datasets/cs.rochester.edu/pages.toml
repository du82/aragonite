description = "Theoretical computer science research at URCS focuses on algorithms, computational complexity, and randomness/pseudorandomness, and on their connections to and"
full_description = 'Theory ResearchTheoretical computer science research at URCS focuses on algorithms, computational complexity, and randomness/pseudorandomness, and on their connections to and applications in a wide range of fields: combinatorics, computational social choice theory, cryptography, economics, Markov chains/counting, security, and much more. Hemaspaandra, Lane A.Professor of Computer ScienceOffice Location2317 Wegmans HallEmaillane "at" cs.rochester.eduWeb AddressWebsiteInterests: Computational social choice (elections, preference aggregation, power indices, etc.); Computational complexity theory (counting-based computation, probabilistic computation, unambiguous computation, the importance of query order when accessing databases, the study of efficient algorithms for complex sets, complexity-theoretic aspects of security, fault-tolerance, and data compression, etc.) Hosseini, KaaveAssistant Professor of Computer ScienceOffice Location2507 Wegmans HallEmailshossei2@ur.rochester.eduWeb AddressWebsiteInterests: Theoretical computer science; Additive combinatorics; Pseudorandomness; Discrete Fourier analysis Kahng, AnsonAssistant Professor of Computer Science and Data ScienceOffice Location2401 Wegmans HallEmailakahng2@cs.rochester.eduWeb AddressWebsiteInterests: Computational social choice; Democracy and computer science; Economics and computation; Artificial intelligence; Theoretical computer science; Algorithmic game theory Liang, JiamingAssistant Professor of Computer Science and Data ScienceOffice Location2403 Wegmans HallEmailjliang31@cs.rochester.eduWeb AddressWebsiteInterests: Mathematical and numerical optimization; Sampling algorithms; Stochastic programming; Algorithmic game theory Polak, MonikaAssistant Professor of Computer Science (Instruction)Office Location2201 Wegmans HallEmailmpolak@cs.rochester.eduWeb AddressWebsiteInterests: Cryptography; Quantum-Resistant Cryptography; Algebraic Graph Theory; Extremal Graph Theory; Pseudorandomness; Coding Theory Read-McFarland, AndrewAssistant Professor of Computer Science (Instruction)Office Location2105 Wegmans HallEmailareadmcf@cs.rochester.eduWeb AddressWebsite'
