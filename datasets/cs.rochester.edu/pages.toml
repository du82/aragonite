description = "Zeyu Nie ’24 (computer science and applied math), computer science master’s student Xiaoou Zhao, and Yan Zou ’27 (computer"
full_description = "Students Travel Abroad for International Collegiate Programming ContestThree computer science students compete in a very different type of competition halfway across the world.PublishedOctober 7, 2024Bob Smith / ICPCZeyu Nie ’24 (computer science and applied math), computer science master’s student Xiaoou Zhao, and Yan Zou ’27 (computer science) flew to Astana, Kazakhstan to compete in the International Collegiate Programming Contest.The students earned a spot in the World Finals after finishing 17th in the North American Championship held at the University of Central Florida back in May. It sounds like an incredible global experiential learning opportunity and we’re proud to have these students represent us on a global stage. Special thanks to their coaches, Associate Professor Adam Purtee and Professor Daniel Stefankovic."
