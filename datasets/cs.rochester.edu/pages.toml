["https://cs.rochester.edu/undergraduate/ta.html"]
title = "Teaching Assistantships : Undergraduate Program : Department of Computer Science : University of Rochester"
description = "The Department of Computer Science recruits undergraduate teaching assistants (TAs) to lead workshops, recitations, laboratory sections and/or office hours each"
full_description = "Teaching AssistantshipsThe Department of Computer Science recruits undergraduate teaching assistants (TAs) to lead workshops, recitations, laboratory sections and/or office hours each semester.OverviewPositionsApplication ProcessFormsApply NowOverviewWe encourage all interested students to apply. Any student who has taken the course or equivalent version is eligible to be a TA. Most students who TA consider it a valuable part of their undergraduate experience. Benefits include strengthening your knowledge of the subject, communication skills, time management skills, and empathy. It is also an opportunity to build a stronger relationship with a specific instructor, who may be able to provide a letter of recommendation in the future.Although you do not need to have prior TA experience, it is helpful if you have some prior experience helping others in a formal or informal educational setting (e.g., high school or undergraduate tutoring or working in study groups with fellow students). Also consider specific characteristics or other skills (e.g., public speaking experience, organization skills) you bring to this position that can be relevant. A clear rationale for wanting to be a TA may also help make your application successful. When writing your rationale, think about the course in terms of what you thought was successful and what might be done more effectively.Students are allowed to TA for multiple sections of the same CSC course each semester. These positions offer opportunities to apply your knowledge to help others learn, develop new communication and leadership skills, test out your interest in teaching and earn some extra money. You will also be able to develop new relationships with faculty, the department, and the College.StipendStipends are based on an hourly rate ($16 per hour as of 1/1/2025) over a 15-week semester. Your stipend amount can be impacted based on your completion of paperwork and training requirements prior to the first day of class.Positions and ResponsibilitiesBelow are some of the responsibilities for each of the available paid positions.Workshop Leader (WSL) 2 hours/weekPositions for CSC 161, CSC 171, CSC 172Lead weekly workshop section of 12-14 studentsTake a two-credit course on pedagogy, leadership and group dynamics taught through the Learning CenterLab Teaching Assistantships (Lab TAs) 6 hours/weekPositions for CSC 161, CSC 170, CSC 171, CSC 172Supervise weekly lab sessions (twice per week)Assist professor with course grading, review sessions, etc.Teaching Assistantships (TAs) 4 hours/weekPositions for CSC courses not mentioned aboveAssist professor with course grading, review session, office hours, answering student questions, etc.Responsible for leading recitations (CSC 254, CSC 280, CSC 282)Available PositionsEach semester a varying number of positions are available to undergraduate students. Graduate students are required to teach as part of their program, so availability will vary each semester based on the number of grad students who will hold TA positions in a course. ApplicationApplications for TA jobs can be submitted the semester before the course you want to TA is scheduled. Applications for Fall TA positions will close at the end of March, applications for Spring TA positions will close at the end of November and applications for Summer TA positions will close at the end of February. No prior experience is necessary to apply, and students may choose to apply for more than one position. Fill out and submit the online application linked above. All candidates will be contacted via email throughout the selection process.Notification of AcceptanceNotification of acceptance will be communicated via email in April for Fall semesters, December for Spring semesters and March for Summer sessions. Please make sure you check your email. If we do not hear back from you within one week, it will be assumed that you are no longer interested in the position.Student Employment FormsInstructions for I9 CompletionVerification of F-1 Student Employment"
