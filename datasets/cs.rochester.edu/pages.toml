["https://www.cs.rochester.edu/commencement/2024/undergraduate.html"]
title = "University of Rochester Computer Science Class of 2024"
full_description = "B.S. Computer Science Cum Laude High Distinction I will be working at Microsoft as a Software Engineer in the Cloud and Artificial Intelligence division. B.A. Computer Science I started my time at the University of Rochester as an electrical computer engineer major but soon lost interest in the physical sciences aspect while being drawn to the pure logic and computing parts of my class. It wasn’t long before I decided to follow that drive and move to computer science. Concurrently, my passion for creating video games flourished and I found enjoyment in taking knowledge attained in the classroom and implementing it into my games. Junior year I became president of video game development club, where I got to foster a community of like minded, passionate game developers. Graduating, I plan to be a software developer. While I’m unsure if my career will center on game development, I’m sure that passion will stay with me. Additionally, I found my minor in psychology enriches skills as both a computer scientist and game developer. B.S. Computer Science Cum Laude High Distinction CRA Honorable Mention In addition to my computer science major, I completed a minor in brain and cognitive science as well as a Take 5 in American Sign Language and Disability Studies. I am going into the assistive technology industry where I plan to develop technologies that enable people with disabilities to live with increased levels of independence and an improved quality of life. I will be working as a frontend software developer for GoodMaps, a startup dedicated to accessible indoor navigation, based in Louisville, KY. GoodMaps started by providing indoor navigation assistance to blind people and people with low vision and is now expanding to provide all types of users with indoor navigation guidance while keeping accessibility at the forefront. B.A. Computer Science I'm taking a brief gap year between graduating undergrad and applying to CS PhD programs. B.A. Computer Science I’ll be starting my full time position as a Software Engineer for Lockheed Martin in Orlando Florida this June!"
