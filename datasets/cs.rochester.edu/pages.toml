title = "Graduate Programs : Department of Computer Science : University of Rochester"
description = "Our graduate program was established in 1974 and has a history of 50 years of world-class research, especially in artificial intelligence/human-computer interac"
full_description = "Graduate ProgramsSection NavigationOverviewMaster's ProgramPhD ProgramRequirementsThesis ProposalCoursesApplyingHomeGraduate Programs OverviewOur graduate program was established in 1974 and has a history of 50 years of world-class research, especially in artificial intelligence/human-computer interaction, software systems, and the theory of computation. We provide a collegial, interactive environment in which faculty directly mentor students. All faculty and PhD students, regardless of their area, are familiar with each other’s work. This is possible only in a relatively small, close-knit department.Our philosophy is that computer science research is a community endeavor, crucially dependent on the vitality of the local community in which it takes place. We believe that graduate students are the heart of our research productivity, and we make them first-class department citizens. Graduate students serve on all department committees and, in particular, are crucial members of faculty and graduate student recruitment efforts.Report a Digital Accessibility Barrier"
