["https://cs.rochester.edu/graduate/phd-program.html"]
title = "PhD Program in Computer Science : Graduate Programs : Department of Computer Science : University of Rochester"
description = "Click here for application details. There is no application fee."
full_description = "PhD Program in Computer ScienceClick here for application details. There is no application fee.Our PhD program offers 4 areas of focus:Artificial intelligenceHuman-Computer Interaction (HCI)SystemsTheoryMany of our alumni have become faculty at world class institutions or are leaders at major companies such as Google, Microsoft, and IBM. View our full list of graduates and their postdoctoral employers on our conferral page.PhD students in good academic standing pay zero tuition, receive one of the highest stipends in computer science as ranked by CSStipendRankings, and are provided health insurance by the university. Students receive an MS degree in their second year. Most students complete their PhD in 4 to 6 years.Applicants must have an undergraduate degree. The GRE is not required.Our PhD program aims to cultivate the next generation of world-class computer science researchers. Our mission is to enable you to achieve your career dreams.Financial FeaturesUR CSApplication fee$0Living stipendsHighCost of livingLowFees taken out of stipends~ZeroTuition for PhD studentsZeroHealth insurance100% covered Life in Rochester Anchoring the Finger Lakes region of western New York State, the greater Rochester area is home to over a million people, and offers unsurpassed quality of life, with a thriving arts scene, outstanding public schools, affordable housing and a huge range of cultural and recreational opportunities. Situated on Lake Ontario, Rochester is a one hour drive from Buffalo, three hours from Toronto, and an hour flight to NYC. Photos by Debi Bower. Check out more of her suggested places and activities around Rochester at https://daytrippingroc.com/."
