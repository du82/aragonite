["https://www.cs.rochester.edu/commencement/2024/masters.html"]
title = "University of Rochester Computer Science Class of 2024"
full_description = "M.S. My academic journey has equipped me with a solid foundation in programming languages such as Python, C++, JavaScript as well as a deep understanding of algorithms, data structures, and machine learning. I plan to secure a position where I can apply and expand my coding skills, engage in collaborative team projects, and contribute to meaningful software development. M.S. I feel happy for my time at the University of Rochester. I've learned so much from my courses and am excited to start my career in Toronto. M.S. I completed my MS in CS from UoR in December 2023. During my time there, I engaged in research activities that broadened my understanding of various aspects of computer science. Currently, I am leveraging my expertise as an NLP engineer at the World Bank, where I am dedicated to applying advanced natural language processing techniques to address global challenges. Looking ahead, I aspire to continue making meaningful contributions to the field of technology and to pursue opportunities that enable me to collaborate with diverse teams on impactful projects. My time at UoR has equipped me with the skills and knowledge necessary to thrive in my professional journey, and I am excited to see where it takes me next. M.S. During my time at University of Rochester, I've worked with Professor Prager, Shaposhnik as a TA for Data Analytics and Predictive analytics courses respectively. I've enhanced my skillset a lot while explaining the concepts to others. In my second and third semester, Worked with Dr.Conrad Gleber as a research assistant working on transcription with LLMs. After my graduation, I've been working as a Software Developer 2 at Credit Acceptance. I'm one of the developers working on their mobile application and responsible for developing new features in the app. I love hanging around the campus and have countless memories in Masters Lab. I've moved to Florida after my graduation and I can say I don't miss rochester weather xD. But I'm scared of summers there."
