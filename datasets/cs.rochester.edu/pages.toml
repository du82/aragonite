["http://www.cs.rochester.edu/u/sandhya"]
title = "Sandhya Dwarkadas's URCS Home Page"
full_description = "Sandhya Dwarkadas is currently the Walter N. Munster Professor and Chair of Computer Science at the University of Virginia. Until 2022, she was the Albert Arendt Hopeman Professor of Engineering and Professor of Computer Science with a secondary appointment in Electrical and Computer Engineering, at University of Rochester. She has been on the faculty since 1996 and was chair of the computer science department from 2014---2020. She was also interim associate vice president for research from 2021---2022. She received the B.Tech. degree from the Indian Institute of Technology, Madras, India, in 1986, and the M.S. and Ph.D. degrees from Rice University in 1989 and 1993, respectively. She is a fellow of the ACM and IEEE. Her areas of research interest include parallel and distributed computing, computer architecture, and the interaction and interface between the compiler, runtime/operating system, and underlying architecture. Her research lies at the intersection of computer hardware and software with a particular focus on support for parallelism. She has made fundamental contributions to the design and implementation of shared memory both in hardware and software, and to hardware and software energy- and resource-aware configurability."
