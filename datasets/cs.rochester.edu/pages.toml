["https://cs.rochester.edu/people/faculty/bai-zhen/index.html"]
title = "Zhen Bai : Faculty : Department of Computer Science : University of Rochester"
description = "Zhen Bai is an Assistant Professor in the ROCHCI group in the Department of Computer Science, University of Rochester."
full_description = "Research OverviewZhen Bai is an Assistant Professor in the Department of Computer Science at the University of Rochester. Her research focuses on creating embodied and intelligent interfaces that transcend learning, communication, and wellbeing for people with diverse abilities and backgrounds. Her main research fields include human-computer interaction, augmented reality, tangible user interface, embodied conversational agent, technology-enhanced collaborative learning, and assistive technology. Her work is published in premier human-computer interaction and learning science conferences such as CHI, ISMAR, IDC, IVA, and AIED.Zhen received her Ph.D. degree from the Graphics & Interaction Group at Computer Laboratory, University of Cambridge in 2015 and was a postdoctoral fellow of the Human-Computer Interaction Institute and Language Technology Institute at Carnegie Mellon University before joining the University of Rochester.Research InterestsHuman-Computer InteractionAugmented RealityTangible User InterfacesEmbodied Conversational AgentTechnology-Enhanced LearningComputer-Supported Collaborative WorkAssistive TechnologyMachine Learning for HCI"
