["https://cs.rochester.edu/graduate/spring.php"]
title = "Spring Term Schedule : Graduate Programs : Department of Computer Science : University of Rochester"
description = """
The science of networks is an emerging discipline of great importance that combines graph theory, probability and statistics, and facets of engineering and the social sciences. This course will provide students with the mathematical tools and computational training to understand large-scale networks in the current era of Big Data. It will introduce basic network models and structural descriptors, network dynamics and prediction of processes evolving on graphs, modern algorithms for topology inference, community and anomaly detection, as well as fundamentals of social network analysis. All concepts and theories will be illustrated with numerous applications and case studies from technological, social, biological, and information networks. Prerequisites: Some mathematical maturity, comfortable with linear algebra, probability, and analysis (e.g., MTH164-165). Exposure to programming and Matlab useful, but not required.For more information, please visit the class website: https://www.hajim.rochester.edu/ece/sites/gmateos/ECE442.html
LocationComputer Studies Room 601"""
full_description = '''Graduate ProgramsSection NavigationOverviewMaster's ProgramPhD ProgramRequirementsThesis ProposalCoursesApplyingHomeGraduate ProgramsSpring Term ScheduleSpring Term Schedule Sortable | Group by Weekday Spring 2025 NumberTitleInstructorTime CSC 402-1 Network Science Analysis Gonzalo Mateos Buckstein MW 3:25PM - 4:40PM The science of networks is an emerging discipline of great importance that combines graph theory, probability and statistics, and facets of engineering and the social sciences. This course will provide students with the mathematical tools and computational training to understand large-scale networks in the current era of Big Data. It will introduce basic network models and structural descriptors, network dynamics and prediction of processes evolving on graphs, modern algorithms for topology inference, community and anomaly detection, as well as fundamentals of social network analysis. All concepts and theories will be illustrated with numerous applications and case studies from technological, social, biological, and information networks. Prerequisites: Some mathematical maturity, comfortable with linear algebra, probability, and analysis (e.g., MTH164-165). Exposure to programming and Matlab useful, but not required.For more information, please visit the class website: https://www.hajim.rochester.edu/ece/sites/gmateos/ECE442.html LocationComputer Studies Room 601 CSC 409-01 Seminar on Artificial General Intelligence Christopher Kanan M 2:00PM - 3:15PM Many companies are working towards creating artificial general intelligence (AGI), i.e., systems capable of accomplishing any human intellectual task, and multiple companies aspire to create such systems within the next decade. WHile large language models (LLMs) do not yet have these capabilities, they exhibit "sparks" of AGI. In this course we review the concept of AGI and how we might assess a system to understand if it is an AGI. We will study the gaps in state-of-the-art systems and what would be needed for a system to be considered an AGI. We will also study AI ethics and safety, the socioeconomic implications of AGI, the likelihood of an intelligence explosion (i.e., the singularity), and existential risk due to AGI. Coursework includes readings, student presentations, and a project.Prerequisites: At least one course that covers neural networks, e.g., CSC 242, CSC 298/578, CSC 266/466, CSC 249/449, CSC 277/3477, or instructor permision. Students are expected to be familiar with Python, one or more deep learning toolboxes, deep learning, and machine learning more broadly. Students should have a solid understanding of large language models, e.g., GPT-based causal transformers and similar approaches, backpropagation, multi-layer perceptrons, transformers, convolutional neural networks, and neural network fine-tuning. LocationHylan Building Room 203 CSC 410-01 Optimization Seminar Daniel Gildea TR 9:40AM - 10:55AM This course gives an overview of numerical optimization, beginning with the theory of recognizing and manipulating convex optimization problems. We then examine widely used algorithms for both convex and non-convex problems and focus in the last third of the semester on applications of optimization in machine learning. LocationHylan Building Room 203 CSC 414-1 Selected Topics in Augmented and Virtual Reality Mujdat Cetin; Yukang Yan TR 2:00PM - 3:15PM This is the second course offered as part of the PhD training program on augmented and virtual reality. It builds on the first course, Introduction to Augmented and Virtual Reality (AR/VR). The goal of the course is to provide exposure to problems in the AR/VR domain addressed by various disciplines. The course consists of three one-month long modules in a semester. Modules engage students in particular aspects of AR/VR or hands-on experience on AR/VR. Modules to be offered in various years include: fundamentals of optics for AR/VR; AR/VR in the silicon; foundations of visual perception in the context of AR/VR; computer audition and acoustic rendering; measuring the human brain; deep learning and visual recognition for AR/VR; brain-computer interfacing in a virtual environment; interaction techniques for AR/VR systems; 3D interfaces and interaction; AR/VR for collaborative education & professional training. In Spring 2025, the following three modules will be offered:1) Fundamentals of optics for AR/VR (Daniel Nikolov and Jannick Rolland). Optics is central to near-eye displays and sensing. In this module, students will learn basic concepts and terminology of optics for AR/VR, as well as key visual requirements. Students will then learn about different optical architectures based on free-space or waveguide optics. Emerging technologies enabling compact architectures such as freeform optics and meta optics will be discussed. Students will be exposed to demonstrations of hands-on design in optical design software.2) Interaction techniques for AR/VR systems (Yukang Yan). This module introduces the design and implementation of interaction techniques that can be applied in AR/VR systems, focusing on fundamental tasks such as target selection, navigation, object manipulation, and sensory input. Through the introduction of conceptual insights andhands-on practice, we aim to teach students how to create intuitive, effective interaction methods across different tasks and scenarios. Projects will encourage students to design and build their own interaction techniques, leading to a deeper understanding of user-centered design principles and the technical skills necessary to bring interactive concepts to life.3) Professional encounters with leading AR/VR researchers. This module involves a series of seminars (titled Voices of XR) and discussion sessions with leading AR/VR researchers from academia and industry. This component of the course is offered in partnership with Studio X.Prerequisites: ECE 410 or OPT 410 or BME 410 or NSCI 415 or CSC 413 or CVSC 534 or equivalent experience. INSTRUCTORS: Mujdat Cetin; Daniel Nikolov; Jannick Rolland; Yukang Yan LocationComputer Studies Room 418 CSC 440-1 Data Mining Ted Pawlicki TR 4:50PM - 6:05PM Fundamental concepts and techniques of data mining, including data attributes, data visualization, data pre-processing, mining frequent patterns, association and correlation, classification methods, and cluster analysis. Advanced topics include outlier detection, stream mining, and social media data mining. CSC 440, a graduate-level course, requires additional readings and a course project. LocationDewey Room 1101 CSC 443-01 Advanced Computational Neuroscience Ralf Haefner TR 9:40AM - 10:55AM This is a seminar-style course for advanced undergraduate and graduate students covering multiple areas of computational neuroscience by weekly readings and student presentations. Many of the topics are deeper explorations of topics covered in BCSC 247 Introduction to Computational Neuroscience, focusing on the sensory system, decision-making, action selection and active inference, especially from a probabilistic and normative perspective. The reading list is somewhat flexible and adaptable to student interest. There is an opportunity for a final project but this is not required.Prerequisite: Intro to Computational Neuroscience (BCSC 247) or permission of instructor LocationHylan Building Room 306 CSC 446-1 Machine Learning Daniel Gildea TR 11:05AM - 12:20PM Mathematical foundations of classification, regression, and decision making. Supervised algorithms covered include perceptrons, logistic regression, support vector machines, and neural networks. Directed and undirected graphical models. Numerical parameter optimization, including gradient descent, expectation maximization, and other methods. Introduction to reinforcement learning. Proofs covered as appropriate. Significant programming projects will be assigned. This course involves a lot of math and algorithms. You should know multivariable calculus, linear algebra, and some algorithms. No formal prerequisites but MATH 165, MATH 164, and CSC 242 strongly recommended. Location CSC 447-01 Natural Language Processing Hangfeng He MW 10:25AM - 11:40AM This introductory course in Natural Language Processing (NLP) explores the AI techniques enabling computers to understand and communicate with humans. Divided into four main sections—Statistical NLP, Neural NLP, Foundation Models, and Advanced Topics—the curriculum covers essential language tasks, from syntax and semantics to complex applications like question answering. We'll also touch on current trends in Large Language Models, such as emergent abilities and human-alignment techniques. Ideal for those interested in the intersection of AI and language, the course tackles challenges at the word, sentence, and document levels. Prereqs: CSC 172 & CSC 242 LocationGavett Hall Room 312 CSC 449-1 Machine Vision Chenliang Xu TR 9:40AM - 10:55AM Introduction to computer vision, including camera models, basic image processing, pattern and object recognition, and elements of human vision. Specific topics include geometric issues, statistical models, Hough transforms, color theory, texture, and optic flow. CSC 449, a graduate-level course, requires additional readings and assignments.Prerequisites: MATH 161 and CSC 242; MATH 165 strongly recommended LocationGavett Hall Room 202 CSC 451-1 Advncd Computer Architecture Michael Huang TR 12:30PM - 1:45PM This course is cross-listed with ECE201. Please refer to that course description. LocationComputer Studies Room 601 CSC 452-1 Computer Organization Yuhao Zhu WF 3:25PM - 4:40PM Introduction to computer architecture and the layering of hardware/software systems. Topics include instruction set design; logical building blocks; computer arithmetic; processor organization; the memory hierarchy (registers, caches, main memory, and secondary storage); I/Obuses, devices, and interrupts; microcode and assembly language; virtual machines; the roles of the assembler, linker, compiler, and operating system; technological trends and the future of computing hardware. Several programming assignments required. LocationLattimore Room 201 CSC 454-1 Programming Language Design & Implementation Michael Scott TR 3:25PM - 4:40PM Design and implementation of programming languages, with an emphasis on imperative languages and on implementation tradeoffs. In-depth examination of 'how programming languages work.' Topics include fundamental language concepts (names, values, types, abstraction, control flow); compilation and interpretation (syntactic and semantic analysis, code generation and optimization); major language paradigms (imperative, object-oriented, functional, logic-based, concurrent). Course projects include assignments in several different languages, with an emphasis on compilation issues. LocationMeliora Room 221 CSC 455-1 Software Analysis & Improv Sreepathi Pai MW 10:25AM - 11:40AM Programming is the automation of information processing. Program analysis and transformation is the automation of programming itself---how much a program can understand and improve other programs. Because of the diversity and complexity of computer hardware, programmers increasingly depend on automation in compilers and other tools to deliver efficient and reliable software. This course combines fundamental principles and (hands-on) practical applications. Specific topics include data flow and dependence theories; static and dynamic program transformation including parallelization; memory and cache management; type checking and program verification; and performance analysis and modeling. The knowledge and practice will help students to become experts in software performance and correctness. Students taking the graduate level will have additional course requirements and a more difficult project. LocationMeliora Room 224 CSC 458-1 Parallel & Distributed Systems Andrew Read-McFarland MW 3:25PM - 4:40PM Principles of parallel and distributed systems, and the associated implementation and performance issues. Topics covered will include programming interfaces to parallel and distributed computing, interprocess communication, synchronization, and consistency models, fault tolerance and reliability, distributed process management, distributed file systems, multiprocessor architectures, parallel program optimization, and parallelizing compilers. Students taking this course at the 400 level will be required to complete additional readings and/or assignments. LocationDewey Room 2110E CSC 461-1 Database Systems Eustrat Zhupa MW 10:25AM - 11:40AM This course presents the fundamental concepts of database design and use. It provides a study of data models, data description languages, and query facilities including relational algebra and SQL, data normalization, transactions and their properties, physical data organization and indexing, security issues and object databases. It also looks at the new trends in databases. The knowledge of the above topics will be applied in the design and implementation of a database application using a target database management system as part of a semester-long group project.Note: Open to CSC and DSCC students only during registration week. Restriction will be lifted Monday, November 18. LocationDewey Room 2162 CSC 463-1 Data Management Systems Fatemeh Nargesian MW 9:00AM - 10:15AM This course explores the internals of data engines. Topics covered will include the relational model; relational database design principles based on dependencies and normal forms; query execution; transactions; recovery; query optimization; parallel query processing; NoSQL. LocationGavett Hall Room 312 CSC 478-1 Computer Security Foundations John Criswell MW 6:15PM - 7:30PM This course will teach students the foundations of computer security. Students will learn what security is, the design principles of secure systems, how security is enforced, and how security is compromised. Topics include access controls, information flow, basic applications of cryptography, buffer overflow attacks, and malware. Prerequisites: CSC 252 or CSC 452 or ECE 200. LocationHylan Building Room 101 CSC 480-1 Computer Models & Limitations Monika Polak MW 2:00PM - 3:15PM This course studies fundamental computer models and their computational limitations. Finite-state machines and pumping lemmas, the context-free languages, Turing machines, decidable and Turing-recognizable languages, undecidability, NP-completeness. Prerequisites: CSC 173 and MTH 150. YOU MUST REGISTER FOR A RECITATION WHEN REGISTERING FOR THE MAIN COURSE LocationBausch & Lomb Room 106 CSC 480-2 Computer Models & Limitations - REC Monika Polak W 4:50PM - 6:05PM This course studies fundamental computer models and their computational limitations. Finite-state machines and pumping lemmas, the context-free languages, Turing machines, decidable and Turing-recognizable languages, undecidability, NP-completeness. LocationLattimore Room 210 CSC 480-3 Comp'''
