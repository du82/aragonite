["https://cs.rochester.edu/undergraduate/declaring_major.html"]
title = "Declaring a Major : Undergraduate Program : Department of Computer Science : University of Rochester"
description = "Students may schedule an appointment with a program coordinator to discuss their plan but not required. When completing your plan, consider the following:"
full_description = "Declaring a Major*Please review our Degree Requirements web page in full detail prior to preparing your major declaration materials.*Students must fill out either a BA or a BS planning sheet.Email the completed plan to an undergraduate program coordinator for review. Jana Head - class of 2027Sarah Mills - class of 2026, 2025Students may schedule an appointment with a program coordinator to discuss their plan but not required. When completing your plan, consider the following:What advanced courses do you want to take to complete your degree?Have you completed your primary writing class? Students in the Hajim School must have completed this prior to declaring, with a grade of C or better.How will you complete your two upper level writing courses?What clusters will you complete?Declaring a BA in Computer ScienceStudents wishing to declare a BA in computer science should have completed the following courses with a GPA no lower than a 2.0:CSC 171: Introduction to Computer ScienceCSC 172: Data Structures and AlgorithmsMATH 150: Discrete MathematicsStudents will then need to fill out a BA Planning Sheet and email the completed form to their CS program coordinator. Declaring a BS in Computer ScienceStudents wishing to declare a BS in computer science should have completed the following courses with a GPA no lower than a 2.0:CSC 171: Introduction to Computer ScienceCSC 172: Data Structures and AlgorithmsMATH 150: Discrete MathematicsMATH 161-162 or MATH 141-143 or MATH 171-172Students will then need to fill out a BS Planning Sheet and email the completed form to their CS program coordinator to officially declare the major. 2025 January 16"
