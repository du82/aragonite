["https://cs.rochester.edu/about/what-is-cs.html"]
title = "What is Computer Science? : About Us : Department of Computer Science : University of Rochester"
description = "Computer science is the science of computing."
full_description = "What is Computer Science?Wegmans Hall - Home of URCS Computer science is the science of computing. Computing is the process of transforming information. It is what computers do. Computer science is the discovery and study of the principles of computing and their application to the development of computing systems.Computer science plays a pervasive and pivotal role in our lives today. Research by the URCS faculty has impact on both the infrastructure and the applications of computing, ranging across system efficiency and security, computational social choice and algorithmic game theory, mining and predicting social and health outcomes, and natural language and video understanding. The research is often interdisciplinary, leading to collaborations across several departments and centers within the university.To learn more about the research being done by the Department of Computer Science visit our research page.Watch the Full Spectrum Series to hear Dr. Michael L. Scott talk about what computer science is and how to forge a path as an undergraduate in this field."
