["https://cs.rochester.edu/courses/summer.php"]
title = "Summer Term Schedule : Undergraduate Program : Department of Computer Science : University of Rochester"
description = """
Hands-on introduction to programming using the Python programming language. Covers basic programming constructs including statements, expressions, variables, conditionals, iteration, and functions, as well as object-oriented programming and graphics. This course is for non-majors, and/or students with less math and science background. Lab and Workshop component included in course section.Course meets synchronously online.
Location"""
full_description = "Undergraduate ProgramSection NavigationOverviewAdvisingDegree RequirementsMajor DeclarationResourcesCoursesCS Lab InformationResearch OpportunitiesURCS Student GroupsTeaching AssistantshipsApplyingHomeCoursesSummer Term ScheduleSummer Term Schedule Sortable | Group by Weekday Summer 2024 NumberTitleInstructorTime CSC 161S-1 Introduction to Programming Arthur Roolfs TWRF 5:00PM - 6:35PM Hands-on introduction to programming using the Python programming language. Covers basic programming constructs including statements, expressions, variables, conditionals, iteration, and functions, as well as object-oriented programming and graphics. This course is for non-majors, and/or students with less math and science background. Lab and Workshop component included in course section.Course meets synchronously online. Location CSC 162-1 Data Structures & Algorithms in Python Andrea Cogliati MWF 9:00AM - 11:50AM Computers are universal tools to store and process information. The storage part is organized as data structures; the processing part is captured as algorithms. Together, these form the heart of every computer application (in science, government, business, and the arts), on every kind of information (pictures, numbers, sound, and text). We will study the most fundamental data structures and algorithms as a means of using computers more effectively, and as preparation for more advanced study in CS and related fields. Prerequisites: CSC 161 & MATH 150 (or equivalent.)COURSE WILL BE OFFERED ONLINE ONLY. Location CSC 170-2 Introduction to Web Development Eustrat Zhupa R 10:00AM - 11:45AM An introduction to the World Wide Web and related technologies. Topics include HTML5 and CSS3, Progressive Enhancement, and Web page design. Emphasis is placed on fundamentals, industry standards and best practices. Additional topics include: web site construction techniques, mobile design issues, and Search Engine Optimization (SEO). Programming with JavaScript will be introduced.Course is offered synchronous online. LocationOnline Room 3 (ASE) CSC 171-1 Introduction to Computer Science Ted Pawlicki – Hands-on introduction to programming using the Java programming language. Teaches fundamentals of programming and more advanced topics. Emphasizes algorithmic thinking and computational problem solving and provides an introduction to the concepts and methods used in Computer Science. Required for all CSC majors.NOTE: Students must register for the lecture, lab, and workshop sections. This course is oﬀered as a fully online, asynchronous course. LocationAsynchronous Online (ASE) CSC 171-2 Introduction to Computer Science - Lab Ted Pawlicki – Hands-on introduction to programming using the Java programming language. Teaches fundamentals of programming and more advanced topics. Emphasizes algorithmic thinking and computational problem solving and provides an introduction to the concepts and methods used in Computer Science. Required for all CSC majors.NOTE: Students must register for the lecture, lab, and workshop sections. This course is oﬀered as a fully online, asynchronous course. LocationAsynchronous Online (ASE) CSC 171-3 Introduction to Computer Science - WKSHP Ted Pawlicki – Hands-on introduction to programming using the Java programming language. Teaches fundamentals of programming and more advanced topics. Emphasizes algorithmic thinking and computational problem solving and provides an introduction to the concepts and methods used in Computer Science. Required for all CSC majors.NOTE: Students must register for the lecture, lab, and workshop sections. This course is oﬀered as a fully online, asynchronous course. LocationAsynchronous Online (ASE) CSC 172-1 Data Structures & Algorithms Ted Pawlicki – This course is oﬀered as a fully online, asynchronous course. Abstract data types (e.g., sets, mappings, and graphs) and their implementation as concrete data structures in Java. Analysis of the running times of programs operating on such data structures, and basic techniques for program design, analysis, and proof of correctness (e.g., induction and recursion).PREREQUISITES: CSC 171 (Or, any introductory programming course) and MATH 150 (any introductory Discrete Mathematics course)NOTE: Students must register for the lecture, lab, and workshop sections. LocationAsynchronous Online (ASE) CSC 172-2 Data Structures & Algorithms - Lab Ted Pawlicki – This course is oﬀered as a fully online, asynchronous course. Abstract data types (e.g., sets, mappings, and graphs) and their implementation as concrete data structures in Java. Analysis of the running times of programs operating on such data structures, and basic techniques for program design, analysis, and proof of correctness (e.g., induction and recursion).PREREQUISITES: CSC 171 (Or, any introductory programming course) and MTH 150 (any introductory Discrete Mathematics course)NOTE: Students must register for the lecture, lab, and workshop sections. LocationAsynchronous Online (ASE) CSC 172-3 Data Structures & Algorithms - WKSHP Ted Pawlicki – This course is oﬀered as a fully online, asynchronous course. Abstract data types (e.g., sets, mappings, and graphs) and their implementation as concrete data structures in Java. Analysis of the running times of programs operating on such data structures, and basic techniques for program design, analysis, and proof of correctness (e.g., induction and recursion).PREREQUISITES: CSC 171 (Or, any introductory programming course) and MTH 150 (any introductory Discrete Mathematics course)NOTE: Students must register for the lecture, lab, and workshop sections. LocationAsynchronous Online (ASE) CSC 214-1 Mobile App Development Arthur Roolfs TWRF 5:00PM - 6:35PM Coursework covers user application and interface design with SwiftUI and the Swift computer language, functional algorithms for mobile devices (iOS), object-oriented design, MVVM, data persistence and concurrency. Other topics include: object-oriented database API, animation, webservices and performance considerationsPREREQUISITES: CSC 172, Competent object-oriented programming skillsCourse meets synchronously online. Location CSC 261-2 Database Systems Eustrat Zhupa – This course presents the fundamental concepts of database design and use. It provides a study of data models, data description languages, and query facilities including relational algebra and SQL, data normalization, transactions and their properties, physical data organization and indexing, security issues and object databases. It also looks at the new trends in databases. The knowledge of the above topics will be applied in the design and implementation of a database application using a target database management system as part of a semester-long group project.PREREQUISITES: CSC 172 required, CSC 173 and CSC 252 recommended. Students must have knowledge of at least one programming language. Familiarity with definition and implementation of data structures, main sorting algorithms, complexity of programs is also required.Asynchronous online course LocationAsynchronous Online (ASE) CSC 262-1 Computational Intro to Statistics Joseph Ciminelli MWF 9:00AM - 11:50AM This course will cover foundational concepts in descriptive analyses, probability, and statistical inference. Topics to be covered include data exploration through descriptive statistics (with a heavy emphasis on using R for such analyses), elementary probability, diagnostic testing, combinatorics, random variables, elementary distribution theory, statistical inference, and statistical modeling. The inference portion of the course will focus on building and applying hypothesis tests and confidence intervals for population means, proportions, variances, and correlations. Non-parametric alternatives will also be introduced. The modeling portion of the course will include ANOVA, and simple and multiple regression and their respective computational methods. Students will be introduced to the R statistical computing environment.This course is FULLY ONLINE and ASYNCHRONOUS.PREREQUISITES: MATH 150 or MATH 150A; and MATH 142 or MATH 161 or MATH 171 LocationAsynchronous Online (ASE) CSC 273W-2 Writing for Computer Science Joseph Loporcaro – This course is oﬀered as a fully online, asynchronous course. In this course, students prepare, critique, and discuss written materials relevant to Computer Science. Will count as one of the two upper level writing requirements for Computer Science majors. If the course is closed, DO NOT email the professor. LocationAsynchronous Online (ASE) CSC 299W-1 Social Implications of Comp Joseph Loporcaro – Computers and the Internet, perhaps more than any other technology, have transformed society over the past 50 years. In developed nations, at least, they have enabled dramatic increases in human productivity; an explosion of options for news, entertainment, and communication; and fundamental breakthroughs in almost every branch of science and engineering. At the same time, they have contributed to unprecedented threats to privacy; whole new categories of crime and anti-social behavior; major disruptions in the job market; and the large-scale concentration of risk into systems capable of catastrophic failure. In this discussion- and writing-oriented class, we will consider all of this and more, with the goal of better understanding how to shape technological change in ways that maximize the benefits and minimize the costs.This course is oﬀered as a fully online, asynchronous course. LocationAsynchronous Online (ASE) CSC 391-2 Independent Study Zhiyao Duan – Blank Description Location Summer 2024 NumberTitleInstructorTime Monday, Wednesday, and Friday CSC 162-1 Data Structures & Algorithms in Python Andrea Cogliati MWF 9:00AM - 11:50AM Computers are universal tools to store and process information. The storage part is organized as data structures; the processing part is captured as algorithms. Together, these form the heart of every computer application (in science, government, business, and the arts), on every kind of information (pictures, numbers, sound, and text). We will study the most fundamental data structures and algorithms as a means of using computers more effectively, and as preparation for more advanced study in CS and related fields. Prerequisites: CSC 161 & MATH 150 (or equivalent.)COURSE WILL BE OFFERED ONLINE ONLY. Location CSC 262-1 Computational Intro to Statistics Joseph Ciminelli MWF 9:00AM - 11:50AM This course will cover foundational concepts in descriptive analyses, probability, and statistical inference. Topics to be covered include data exploration through descriptive statistics (with a heavy emphasis on using R for such analyses), elementary probability, diagnostic testing, combinatorics, random variables, elementary distribution theory, statistical inference, and statistical modeling. The inference portion of the course will focus on building and applying hypothesis tests and confidence intervals for population means, proportions, variances, and correlations. Non-parametric alternatives will also be introduced. The modeling portion of the course will include ANOVA, and simple and multiple regression and their respective computational methods. Students will be introduced to the R statistical computing environment.This course is FULLY ONLINE and ASYNCHRONOUS.PREREQUISITES: MATH 150 or MATH 150A; and MATH 142 or MATH 161 or MATH 171 Location Tuesday, Wednesday, Thursday, and Friday CSC 161S-1 Introduction to Programming Arthur Roolfs TWRF 5:00PM - 6:35PM Hands-on introduction to programming using the Python programming language. Covers basic programming constructs including statements, expressions, variables, conditionals, iteration, and functions, as well as object-oriented programming and graphics. This course is for non-majors, and/or students with less math and science background. Lab and Workshop component included in course section.Course meets synchronously online. Location CSC 214-1 Mobile App Development Arthur Roolfs TWRF 5:00PM - 6:35PM Coursework covers user application and interface design with SwiftUI and the Swift computer language, functional algorithms for mobile devices (iOS), object-oriented design, MVVM, data persistence and concurrency. Other topics include: object-oriented database API, animation, webservices and performance considerationsPREREQUISITES: CSC 172, Competent object-oriented programming skillsCourse meets synchronously online. Location Thursday CSC 170-2 Introduction to Web Development Eustrat Zhupa R 10:00AM - 11:45AM An introduction to the World Wide Web and related technologies. Topics include HTML5 and CSS3, Progressive Enhancement, and Web page design. Emphasis is placed on fundamentals, industry standards and best practices. Additional topics include: web site construction techniques, mobile design issues, and Search Engine Optimization (SEO). Programming with JavaScript will be introduced.Course is offered synchronous online. Location Report a Digital Accessibility Barrier"
