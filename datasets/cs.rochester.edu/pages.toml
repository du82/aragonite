["https://cs.rochester.edu/assets/pdf/newsletter-pdfs/newsletter-2023.html"]
title = "Multicast - The Department of Computer Science at the University of Rochester"
full_description = "As I write this in mid October, I am a quarter of the way through the fourth and final year of my term as department chair. I am delighted to share that Dean Heinzelman has selected Chen Ding to succeed me next July. In the intervening months he is serving as Associate Chair. As the world continues to heal from the COVID-19 pandemic, life in the department this year has felt quite a bit more “normal.” The building is buzzing with people, classes and seminars are well attended, and our staff, after some major reshuffling last year, is settling well into what we hope will be another long stretch of stability. Commencement last May saw us award 125 BA and BS degrees, 28 MS degrees, and 20 PhDs. Among the undergraduates, almost a third were double majors; four were triple majors, and over 40% completed a minor in another field. Twenty studied abroad. Five completed senior honors theses, and dozens of others were actively engaged in research. Ten were inducted into Phi Beta Kappa. At the other end of the pipeline, 27 new MS students and 22 new PhD students entered the department this fall. The PhD cohort is the largest in department history. Perhaps the most exciting news this year has been the hiring of four new faculty members—the most we’ve ever brought on at one time. Jian Kang strengthens our core expertise in machine learning, with a particular emphasis on fairness. Jiaming Liang, who has a joint appointment with Data Science, brings new expertise in optimization. Yukang Yan, who will be joining us in January, augments our HCI group, with a particular emphasis on mixed-reality systems. And Monika Polak, who joins our instructional faculty, is an active researcher in post-quantum cryptography. Bios of these wonderful new colleagues can be found elsewhere in this issue. (And we hope to hire two more this year!) Among existing faculty, Jiebo Luo was elected a Fellow of the US National Academy of Inventors (NAI). Zhen Bai received an NSF CAREER Award. Work by Kaave Hosseini and others received the Best Paper Award at the International Colloquium on Automata, Languages and Programming (ICALP). Within the University, George Ferguson received the Edward Peck Curtis Award for Excellence in Undergraduate Teaching. Undergraduate Coordinator Sara Klinkbeil received the Edmund A. Hajim Outstanding Staff Award and PhD Coordinator Robin Clark received an ACE Staff Recognition Award."
year_published = 2025
