["http://www.cs.rochester.edu/u/schubert"]
title = "Lenhart K. Schubert's Home Page"
full_description = "Ph.D. (1970) University of Toronto. Assistant Professor ('73-'77), Associate Professor ('77-'84), Professor ('84-'88); University of Alberta. Professor ('88-'24) and Professor Emeritus ('24-present), University of Rochester. I am also a member of the Center for Language Sciences (CLS). My research interests center around language, dialogue agents, knowledge representation, and reasoning. These interests are tied together by the general goal of developing AGI agents -- ones with not only conversational fluency, but with common sense and human-level logistical and planning abilities, self-awareness, self-motivation, and the ability acquire knowledge through language and observation. Some specific topics my collaborators and I have worked on include CSC 191/291 (Topics in Computer Science): Machines and Consciousness DSC 530 (module on NLP) CSC 244/444: Machine Reasoning CSC 247/447: Natural Language Processing CSC 280: Computer Models and Limitations CSC 242: Artificial Intelligence Benjamin Van Durme (Ph.D. 2010, U of R), now at Johns Hopkins U: Extracting implicit knowledge from text Fabrizio Morbini (Ph.D. 2009, U of R), now at Tact.ai: Computational infrastructure for a self-aware agent Shuwen Zhang: Sentiment analysis in dialogue, turn-taking corpus annotation Zining Wen: Sentiment analysis system using word occurrence patterns Burkay Donderici: Logical form annotation for semantic parsing, spatial relation judging Akihiro Minami (U of R undergrad): Logical form annotation for semantic parsing corpus; spatial relation judging Tianyi Ma (U of R MS student): Dialogue turn-taking annotation; logical form annotation for semantic parsing Daniel Scarafoni (U of R undergrad), now MS grad at U of R: Imagistic modeling for story understanding David Sekora (U of R undergrad), now Ph.D. candidate, UMD: Verb argument structure compilation, schema building Adina Rubinoff (U of R undergrad), now at Factset, Norwalk, CT: Acquiring lexical meaning postulates via VerbNet Ting Qian (U of R undergrad, then Ph.D.), now data scientist at The Children's Hospital of Philadelphia: Class attribute extraction, lexical semantics"
