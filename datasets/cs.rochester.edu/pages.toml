title = "Department of Computer Science : University of Rochester"
full_description = "HomepageJoin Our FacultyView Tenure Track OpeningsConduct cutting-edge researchLearn about our researchLearn from world-class facultyView FacultyApply your knowledge to a range of fieldsLearn about CSFeatured NewsCan we teach AI to learn like humans?February 24, 2025Professor Kanan joins the Academic Minute to speak on building AI that can continually learn new knowledge without suffering from catastrophic forgetfulness.Learn MoreAlumnus Makes Forbes ListFebruary 10, 2025The Middle East edition of Forbes named Anis Kallel ’17 to its “30 Under 30: Commerce and Finance” list. Kallel, who majored in computer science and business, cofounded Flouci in 2020. According to the magazine, the financial services app “had around 60,000 active users, opened 57,902 bank accounts, and issued 11,000 cards” as of October 2024. Flouci operates in Tunisia and is expected to go live in Algeria and Morocco in 2025.Learn MoreProfessor Zhen Bai discusses using AI to minimize language deprivation on WXXIJanuary 24, 2025Learn MoreAmanda Stent ’01: Guiding the future of AI in industry and academiaJanuary 21, 2025Learn MoreHappy New Year! January 13, 2025Read the latest department news.Learn MoreProfessor Xu speaks on deepfakesOctober 25, 2024It appears generative artificial intelligence is an increasingly prominent tool in the misinformation toolbox. Should voters be concerned about being bombarded with phony videos of politicians created with generative AI? Professor Xu weighs in.Learn MoreGrace Hopper 2024October 17, 2024This past week the department funded students to attend the Grace Hopper Conference, the world’s largest gathering of women in computing.Learn MoreUpcoming EventsStudent FeaturesUndergraduate Sarah Mammen wins 2024 Wells PrizeSarah has excelled in pursuing her interests at the intersection of privacy law, technology, and machine learning.Learn MoreHanjia Lyu Wins Google PhD FellowshipPhD student Hanjia Lyu was awarded a 2024 Google PhD fellowship. Hanjia, who studies under professor Jiebo Luo, is interested in computational behavioral science.Masum Hasan discusses HCI Research on WXXIPhD student Masum Hasan recently spoke at the Flower City AI conference about his work developing the SAPIEN Coach.Learn MoreBenjamin Valpey Places at ACM Research ContestPhD student Benjamin Valpey won the 3rd place in the ACM Student Research Competition held at Supercomputing '23 in the graduate student category.Learn MoreLeveraging Computing and Cognition to Tackle Climate ChangePhD student Adiba Proma seeks to help people reduce their carbon footprint with computer design principles.Read about Adiba's research Report a Digital Accessibility Barrier"
