["https://cs.rochester.edu/about/diversity.html"]
title = "Diversity : About Us : Department of Computer Science : University of Rochester"
description = "For many decades, diversity in computer science nationally has been disproportionately lower than in other science disciplines."
full_description = "DiversityFor many decades, diversity in computer science nationally has been disproportionately lower than in other science disciplines. In an effort to increase diversity in computer science at Rochester we were an early member of the BRAID initiative (Building, Recruiting, And Inclusion for Diversity). Department sponsored trips for students to attend diversity conferences such as the Grace Hopper Conference for Women in Technology, are a regular and encouraged occurrence.Our past two graduating classes have been ~34% female, nearly double the national average, and we will continue to build a community that encourages women and underrepresented minorities to pursue studies in computer science.Additional resources for diversity information at Rochester:Society of Hispanic Professional Engineers (SHPE)National Society of Black Engineers (NSBE)UR Women and Minorities in Computing (WiC-MiC)"
