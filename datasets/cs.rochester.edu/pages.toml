["https://cs.rochester.edu/graduate/phd-requirements.html"]
title = "PhD Program Requirements : Graduate Programs : Department of Computer Science : University of Rochester"
full_description = '''PhD Program RequirementsFor detailed information about program requirements, please see the PhD Student HandbookPhD students are required to complete:Six breadth coursesCSC 400: Problem SeminarAll of the Area Requirements for one of the following areas: Artificial IntelligenceHuman-Computer InteractionSystemsTheoryPhD thesis proposal and proposal defensePhD dissertation and defenseBreadth RequirementsBreadth courses are divided into three groups as follows:AI and HCICSC 412: Human-Computer InteractionCSC 435: Optimization for Machine LearningCSC 440: Data MiningCSC 442: Artificial Intelligence (*)CSC 444: Logical Foundations of Artificial IntelligenceCSC 445: Deep LearningCSC 446: Machine LearningCSC 447: Natural Language ProcessingCSC 448: Statistical Speech and Language ProcessingCSC 449: Machine VisionCSC 466: Frontiers in Deep LearningCSC 477: End-to-End Deep LearningSystemsCSC 404 (ECE 404): Multiprocessor ArchitectureCSC 478: Computer Security FoundationsCSC 451: Advanced Computer ArchitectureCSC 452: Computer Organization (*)CSC 453: Collaborative Programming and Software DesignCSC 454: Programming Language Design and ImplementationCSC 455: Software Analysis and ImprovementCSC 456: Operating SystemsCSC 457: Computer NetworksCSC 458: Parallel and Distributed SystemsCSC 463: Data Management SystemsCSC 572: Mobile Vision ComputingCSC 576: Adv Topics in Data ManagementTheoryCSC 480: Computer Models and Limitations (*)CSC 481: Introduction to Cryptography (*)CSC 482: Design and Analysis of Efficient Algorithms (*)CSC 483: Topics in CryptographyCSC 484: Advanced AlgorithmsCSC 485: Algorithms and ElectionsCSC 486: Computational ComplexityCSC 487: Sampling AlgorithmsCSC 488: Analytic Methods in Computer ScienceCSC 489: Algorithmic Game TheoryStudents must complete two courses from each group. These breadth courses must be taken in the first or second year of graduate study. At least one course in each group must be taken in the first year. At most one starred (*) course per area can be used toward the breadth requirement, and at most two starred (*) courses, total, can be used toward the breadth requirement. Students have the flexibility to complete all of the breadth requirements during their first year, or to complete as few as one course per group in that year in order to allow more time for research.PhD students are expected to earn a B or better in all breadth courses.Area RequirementsIn addition to the breadth requirements, PhD students must complete an area's Area Requirements. All research areas require writing an area paper and passing an oral area exam during the second year of graduate study. Each area also requires additional coursework, beyond the breadth requirement, that must be completed with a grade of B or better.A Master’s degree is offered to those PhD-program students passing the area paper with an appropriate level of performance or, in special cases, passing an alternative comprehensive examination given by two or more faculty members appointed by the Chair.Area specific requirements are as follows:Artificial Intelligence (AI) Area RequirementsAI Area Process—The student should form a committee of three or more AI faculty members before the area paper is due, and schedule a time and date for the exam so that all committee members can attend.The paper should include a survey of a research topic and initial original research.The defense begins with the student providing a 20-minute overview of the area paper, followed by an hour of intensive questioning by faculty members.Questions from faculty members will include:General questions about AIQuestions covering content learned in AI breadth courses taken by the studentQuestions about the area paperStudents are responsible for preparing themselves for these questions.AI Course Requirements—By the end of the fourth year, the student must complete at least two additional graduate-level AI/HCI courses with grades of B or better. These may include the non-starred entries of the AI/HCI breadth list, BCS 505 (Perception and Motor Systems), or other advanced courses with permission of the AI faculty.Human-Computer Interaction (HCI) Area RequirementsHCI Area Process— The student should form a committee of three or more faculty members (at least two faculty from the CS department) before the area paper is due, and schedule a time and date for the exam so that all committee members can attend.The area paper may be a survey of a research topic, original research, or a combination of both.Following a public presentation of the paper, the student will answer questions from the committee about the paper and about any topic in HCI that is broadly relevant to the research topic.HCI Course Requirements—By the end of the fourth year, the student must complete three additional courses with grades of B or better, with one class drawn from each of the following three clusters. i. Core AI ClusterCSC445 - Deep LearningCSC447 - Natural Language ProcessingCSC576 - Advanced Machine Learning and OptimizationCSC444 - Logical Foundations of Artificial IntelligenceCSC440 - Data Mining CSC449 - Machine Visionii. Statistics Cluster: 1. CSC462 - Computational Introduction to Statistics 2. CSC465 - Intermediate Statistical Methodsiii. Special Topics Cluster: 1. Network Sciences A. PHY525 - Data Science II: Complexity and Network Theory (offered by Gourab Ghosal) B. ECE442 - Network Science Analytics C. ECE440 - Introduction to Random Processes 2. Theory of Emotion A. CSP550 - Social Psychology of Emotion B. CSP557 - Affectation Bases of Behavior 3. Health and Well-being A. BST465 - Design of Clinical Trials B. ECE452 - Medical Imaging-Theory & Implementation C. CSC575 - Intervention Strategies for Health Applications 4. Multimodal Interaction A. CSC416 - AR/VR Interaction DesignSystems Area RequirementsSystems Area Process— The committee will include most (if not all) of the systems faculty. For scheduling purposes, the systems faculty will provide the relevant student(s) with a few time slots (various days and times) in which they may schedule their exam(s). The area paper should be original MS-level research and a survey of related research topics. It is due two weeks before the area exam. At that same time, the systems faculty will provide the student with a small set of "take home" papers to be studied for the exam. At the area exam, following a presentation of the area paper, the student will answer questions from the faculty about the area paper, the take-home papers, and background knowledge from systems courses. Systems Course Requirements—By the end of the fourth year, the student must complete at least two additional graduate-level systems courses with grades of B or better. These may include the non-starred entries of the systems breadth list or other advanced courses with permission of the systems faculty.Theory Area RequirementsTheory Area Process — The committee will include all of the theory faculty and the student will need to schedule a time and date for the exam so that all committee members can attend.The area process including the area defense is organized as follows:The student submits an area paper reflecting research ability. The area paper is due eight calendar days before the last day of classes of the spring term or one week before the oral exam, whichever comes first. Approximately two weeks before the oral exam, the student is given a set of “take home” papers.Approximately three hours before the oral exam, the student is given a written set of “morning questions.”The area defense consists of an oral exam covering the area paper, the take home papers, the morning questions, and other area-related questions. The length of the exam is typically between 2 and 3 hours.Theory Course Requirements—By the end of the fourth year, the student must complete, each with a grade of B or better, CSC 484, CSC 486, and one additional non-starred course from the theory breadth list.A more detailed written description of the logistics of this process is available from the PhD program coordinator or any theory faculty member.PhD Thesis Proposal and Proposal DefenseSee PhD Thesis Proposal.PhD Dissertation and DefenseAs in programs everywhere, the culmination of the PhD program is a body of research that significantly advances the frontiers of human knowledge, the presentation of that research in a dissertation meeting the highest standards of academic scholarship, and an oral exam that successfully defends the dissertation before a committee of established scholars in the field. For further information, consultyour thesis advisorthe University's Graduate Studies BulletinRegulations and University Policies Concerning Graduate StudiesThe University's Guide to the Final Defense<!-- p.p1 {margin: 0.0px 0.0px 0.0px 48.0px; text-indent: -48.0px; font: 11.0px Helvetica} p.p2 {margin: 0.0px 0.0px 0.0px 48.0px; text-indent: 48.0px; font: 11.0px Helvetica} p.p3 {margin: 0.0px 0.0px 0.0px 0.0px; font: 11.0px Helvetica} p.p4 {margin: 0.0px 0.0px 0.0px 96.0px; text-indent: 48.0px; font: 11.0px Helvetica} span.s1 {font-kerning: none} span.s2 {font: 8.0px Helvetica; font-kerning: none} span.s3 {font: 4.0px Helvetica; font-kerning: none} -->'''
