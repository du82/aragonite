["https://cs.rochester.edu/about/index.html"]
title = "About Us : Department of Computer Science : University of Rochester"
description = "The University of Rochester's Computer Science Department is a prestigious institution known for its academic excellence, cutting-edge research, and commitment"
full_description = "OverviewThe University of Rochester's Computer Science Department is a prestigious institution known for its academic excellence, cutting-edge research, and commitment to preparing students for successful careers in computer science. It fosters innovation, interdisciplinary collaboration, and industry connections, making it a top choice for those pursuing studies in this dynamic field.The department offers both a BA and a BS in computer science through their elite undergraduate program. They also grant an MS and PhD in computer science through their intensive graduate program.Research by the URCS faculty has impact on both the infrastructure and the applications of computing, ranging across system efficiency and security, computational social choice and algorithmic game theory, mining and predicting social and health outcomes, and natural language and video understanding. The research is often interdisciplinary, leading to collaborations across several departments and centers within the university, including but not limited to:Department of Brain and Cognitive SciencesDepartment of Electrical and Computer EngineeringDepartment of LinguisticsCenter for Language SciencesCenter for Visual ScienceGoergen Institute for Data Science and Artificial IntelligenceTo learn more about the research being done by the Department of Computer Science visit our research page."
