["http://www.cs.rochester.edu/u/james"]
title = "James F. Allen's Home Page"
full_description = "b. 1950. Ph.D. (1979) University of Toronto. Assistant Professor (79-84), Associate Professor (84-87), Department Chair (87-90), Professor (87-present), John H. Dessauer Professor of Computer Science (92-present), University of Rochester; Senior Research Scientist (02-present), Associate Director (06-present), Florida Institute for Human and Machine Cognition; Editor-in-Chief, Computational Linguistics (83-93; Presidential Young Investigator (84-89); author of Natural Language Understanding, Benjamin Cummings (87), 2nd edition (1995); Reasoning About Plans, Morgan Kaufmann (91); co-editor of Readings in Planning, Morgan Kaufmann (90); Founding Fellow of the AAAI. My research interests span a range of issues covering natural language understanding, discourse, knowledge representation, common-sense reasoning and planning. I am particularly interested in the overlap between natural language understanding and reasoning. While most of the NLP field has moved to statistical learning methods as the paradigm for language processing, I believe that deep language understanding can only currently be achieved by significant hand-engineering of semantically-rich formalisms coupled with statistical preferences. For further discussion of this viewpoint, see the state of NLP . For a more general discussion of AI, see my keynote address from the 1998 AAAI National conference here . The TRIPS project is a long-term effort to build generic technology for dialogue systems (both spoken and 'chat' systems), which we have now pursued for over a decade. This includes broad-coverage domain-general natural language processing, dialogue agents built using models of collaborative problem solving, dynamic context-sensitive language modeling, and a rich engineering framework for building dialogue systems in new domains in short times. We can build robust spoken dialogue systems in significantly less time than it would take to collect and annotate a small starter corpora that would be needed for machine-learning driven approaches."
