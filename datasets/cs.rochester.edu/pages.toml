["http://www.cs.rochester.edu/u/cding"]
title = "Chen Ding's Home"
full_description = "Chen Ding Professor and Chair Computer Science Department (why UR) University of Rochester Rochester, New York (wonder about weather?) Ph.D. Rice 2000, M.S. MTU 1996, B.S. Beijing U. 1994 Chen Ding's research seeks to understand the composite and emergent behavior in computer systems especially its dynamic parallelism and data usage and develop software and hardware techniques to reduce the data movement in high-performance computing systems. His work received young investigator awards from NSF and DOE. He co-founded the ACM SIGPLAN Workshop on Memory System Performance and Correctness (MSPC) and was a visiting researcher at Microsoft Research and a visiting professor at MIT. He teaches compilers, programming languages, and collaborative software design. Relational theory of locality (RTL), aka, a higher order theory of locality (HOTL) [ISMM'21, MEMSYS'21, CPM'21, TACO'19, MEMSYS'16 (Chen et al.), USENIX'16, JCST'14, tool download, ASPLOS'13 (slides), MSPC'12] and its applications [MEMSYS'16 (Brock et al.), INFLOW'16, USENIX'15, ICPP'15, IJPP'15] Whole-program locality (and reuse-distance measurements) [POPL'07, TOC'07, PLDI'03, PACT'03, LACSI'03, TR 875] Compiler optimization: global cache reuse [ICS'05, JPDC'04, IPDPS'01, IPDPS'00, LCPC'99], dynamic cache reuse [MSP'02, PLDI'99] Reuse distance based SLO (suggestions of locality optimizations) tool by Kristof Beyls and Eric D'Hollander. See roclocality.org (posts tagged teaching and course number) for course web pages with basic information and learn.rochester.edu for course content including announcements, handouts, and assignments. ICS'19 (pc co-chair), SC'19, CGO'19, PLDI'19 (ERC), PMAM'19, ICS'18, LCPC'18, ASPLOS'18, HPCA'18 (ERC), LCPC'17, ICS'17, ISMM'17, ASPLOS'17, LCPC'16 (co-chair, photos), PACT'16, ASPLOS'16, SC'15, ICPP'15, ACM TACO 2.0 (2014-16), CDP’14 (chair), PPOPP’15 (ERC), PLDI’15 (ERC), ASPLOS’15 (ERC), CCGrid’15, PMAM’14, PACT’14, PPOPP’14, IPDPS’14, ASPLOS’14 (ERC), IPDPS’13,