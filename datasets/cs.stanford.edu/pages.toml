["https://cs.stanford.edu/academics-curricular-practical-training"]
title = "Curricular Practical Training | Computer Science"
full_description = '''Curricular Practical Training Main navigation Skip Secondary Navigation Secondary Navigation Courses Bachelor's Master's PhD Curricular Practical Training Joint Programs Student Events Student Services Staff Computer Forum | Career Readiness Main content start OverviewCurricular practical training (CPT) is an authorized period of employment that is an integral or important part of a student’s curriculum. This information is designed for students in F-1 status. At Stanford, there are two scenarios which qualify students for CPT:The employment must be a requirement of the degree program. In this case, you may or may not receive academic credit. The CPT endorsement must be issued by Bechtel International Center during the same quarter as the internship period.In cases where the practical internship is not a requirement, the department must offer a CPT course for which the student receives academic credit. The CPT course must be offered during the same quarter as the internship period. Failure to enroll in and complete the class will result in violation of your legal status.CPT Enrollment for BS and MS studentsCPT is authorized by the I-Center. You can submit your application as soon as you have a job offer and have enrolled in the CPT course, but no later than 10 working days prior to the start date of employment. Before you enroll in the CPT Course, you will need to obtain approval from your advisor. CS390A, CS390B, and CS390C are the CPT courses. Students have a maximum of three quarters available to them. In your first quarter of CPT, enroll in your advisor's section of CS390A. In your second quarter, enroll in your advisor's section of CS390B. And in your third quarter, enroll in your advisor's section of CS390C. If your advisor's section isn't available, connect with Vanessa Zamora (vanessa.zamora@stanford.edu) to get a section created. Do not enroll in a section that has "Staff" listed as the instructor.Note: For BS and MS students, we do not distinguish between full-time and part-time employment; both require enrollment in CS390A/B/C. Once you have taken CS390C, you have exhausted the amount of CPT that is available to you. Coterm students do not get additional quarters of CPT. Visit the Bechtel International Center Student Affairs website for CPT eligibility.CPT Enrollment for PhD studentsCheck CPT eligibility with Bechtel International Center. CPT is authorized by the I-Center. You can submit your application as soon as you have a job offer and have ENROLLED in the CPT course (step 4), but no later than 10 working days prior to the start date of employment.Employer offer letter. Students are advised to request an offer letter from the employer before employment begins. The offer letter should state the terms of employment: job description/summary of duties, dates of employment*, full-time or part-time classification (hours per week you will be working). Full-time CPT is only allowed during summer quarters and only a maximum of 3 full-time CPTs are allowed.Notify advisor. You must notify your advisor about your employment and that you will be enrolling under their section number within 10 working days prior to the start date of employment. Do not expect your advisor to be able to approve your CPT application if you give them less than the above length of time.Enroll in the appropriate CS CPT courses (CS 390 A, B, C) for full-time CPT. The Computer Science Department allows only up to a maximum of 3 units (1 unit each summer) of Curriculum Practical Training (CPT) in the entire academic career. CS 390A, B and C may each be taken once (full-time). Full time internships are allowed only during summer quarter. For more details contact phdstudentservices@cs.stanford.edu.Choose the schedule for the quarter you will be participating in CPT (Filter > term offered)Click Schedule for CS 390 (A,B, C) to expand the list of faculty for the corresponding quarter (your advisor's section# may not be the same each quarter).Find the name of your advisor or faculty member you have been advised by and enroll in that section number/class # in Axess.Note: Students who have obtained TGR status are not eligible for CPT in any quarter including Summer.Apply for CPT. CPT application is available via Bechtel connect (Students > Employment > Curricular Practical Training). Refer to the CPT webpage for guidelines and the application process steps.CPT during regular academic year (Autumn, Winter and Spring quarters). For CPT during the regular academic year, when students are required to be enrolled full-time (University policy: graduate students must be at-status), you may only work part-time under CPT, and the proposed start and end dates of CPT must closely follow the academic calendar. Part-time CPT eligibility requires completing your rotations and aligning with a faculty. No exceptions can be made.The allowable CPT employment dates for the academic year can be found on Bechtel's website. Contact phdstudentservices@cs.stanford.edu ahead of time, at least a quarter before, if you are planning to do part-time CPT during academic quarters. They can assist in enrollment details and answer inquiries regarding the impact to funding. For part-time CPT students, the PhD student services team will create a part-time CPT CS 390D series with a permission number to enroll in.Social security number eligibility. Visit the Bechtel International Center Student Affairs website for eligibility.Submit employment summary. At the end of the quarter, every student is required to submit an employment summary to their advisor. We don't request information that is proprietary to the company you worked for, instead, describe your use of statistical tools/methods applied to broader questions.In order to receive credit for this, you must submit a one page write-up about your employment experience and the outcome of your work to your advisor. Back to Top'''
