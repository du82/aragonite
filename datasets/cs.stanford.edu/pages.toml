["https://cs.stanford.edu/about/gates-computer-science-building"]
title = "Gates Computer Science Building | Computer Science"
full_description = "Gates Computer Science Building Main navigation Skip Secondary Navigation Secondary Navigation Gates Building Work Here Main content start Designed to Foster InteractionThe Gates Building is named for Bill Gates, co-founder and CEO of Microsoft Corp., who gave a $6 million gift to the project. It was completed in January 1996 and is the home of the Computer Science Department. The 150,000-square-foot building houses 550 faculty, staff, and students and cost $38M to build and furnish. Robert A. M. Stern Associates of New York and Fong and Chan of San Francisco were the architects, selected following an invited national competition. Rudolph & Sletten of Foster City was the general contractor. There were 47 subcontractors working over a 16-month period. January 30, 1996 Bill Gates and James Gibbons at the dedication of Gates Computer Science Building. The Gates Building was designed to promote interaction. The Gates Building offers two new state-of-the-art classrooms which are equipped with computer presentation tools and equipment, large screen projectors, and accommodation for multiple computer platforms. A coalition of Stanford computer scientists and the Computer History Museum has installed exhibits within the Gates Computer Science building containing historical equipment and documents focusing on Stanford's role in the history of computing. The exhibits are being changed and updated as time permits. The first exhibit, installed November 1997, focuses on the early history of the Stanford Computer Science Department and its founder, George Forsythe. Stanford University's William Gates Computer Science Building has been made possible by the generous donations of Mr. William H. Gates and the following corporations and individuals: Allied SignalFujitsu LimitedLockheed Martin CorporationMichael and Lenore RobertsToshiba CorporationA T & T FoundationWilliam R. HewlettMitsubishi Electric CorporationRockwellTRW FoundationDigital Equipment CorporationHewlett-Packard CompanyNEC CorporationSouthern California Edison Company Engineering Venture FundJ. Erik JonssonPacific Gas and Electric Company3M Company We would also like to recognize the generosity of the School of Engineering Venture Fund investment volunteers:William K. Bowes, Jr.William C. EdwardsGlenn M. MuellerBrook H. ByersThomas W. FordDenise M. O'LearyReid W. DennisFranklin P. Johnson, Jr.Donald T. Valentine Back to Top"
