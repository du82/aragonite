["https://cs.stanford.edu/bs-requirements-petitions-deviations-and-transfer-credits"]
title = "BS | Petitions, Deviations, & Transfer Credits | Computer Science"
full_description = "BS | Petitions, Deviations, & Transfer Credits Main navigation Skip Secondary Navigation Secondary Navigation Courses Bachelor's BS Tracks BS Requirements Math Requirements Science Requirements Engineering Fundamentals Technology in Society Core Requirements Depth Requirements Eligible Humanities Electives Senior Project Writing in the Major Requirement Petitions, Deviations, & Transfer Credits Honors Program How to Declare CS Minor Research Opportunities Frequently Asked Questions Master's PhD Curricular Practical Training Joint Programs Student Events Student Services Staff Computer Forum | Career Readiness Main content start OverviewIn general, students must follow the program sheets in order to graduate. Students who wish to deviate from the program sheet can petition to ask for exceptions or deviations to the CS requirements.Petitioning CoursesIf you would like to petition any courses that are located on the first page of your program sheet, you will need to fill out the School of Engineering Deviation Petition Form (SoE undergraduate website and handbook). Students will need to get their major advisor & the CS Department to sign their petition.If you would like to petition any courses that are located on the second page of your program sheet, you will need to submit your request through our SmartSheet form for consideration. The committee meets two times in the quarter (excluding Summer quarters) and will email (petitions@cs.stanford.edu) you directly after your petition has been reviewed. The CS Petitions Committee SmartSheet form will be CLOSED every Wednesday (12pm PST) of Week 2 and Week 7 each quarter (excluding Summer quarters) and wont reopen until Week 3 and Week 8 pass. Important Note: Submitting this form does NOT guarantee that the CS Petitions Committee will approve your request. Take into consideration that petitions should be submitted at least one quarter before you plan on applying to graduate in Axess to ensure that you are well-equipped with a back-up plan. How to submit a successful petition: Provide clear arguments why the course you're petitioning is an appropriate alternative to a course you'd otherwise be required to take.If possible, ask the professor teaching the class you're petitioning to email you their support, and include and/or forward that email as part of your petition.AP/IB CreditsYou can review the Stanford External Test Credit Chart for more information on applicable Math/Science units.To confirm that your AP/IB units were successfully transferred to your program, please check your MAPs audit.You would scroll down to the Bachelor of Science banner and, within that requirement set, to the Mathematics and/or Science sections. Here you will see your AP units recorded as fulfilling a requirement, if applicable.Not able to see your AP/IB credits applied in MAPs? Please consider the following steps:If you have those AP/IB credits on your SU transcript, submit a MAPs Help Ticket for support.If the AP/IB credits are not shown on your SU transcript, submit a Student Services Help Ticket for support.Transferring CreditsStudents seeking transfer credit for any requirements on the front of the program sheet must connect with the School of Engineering.Students seeking transfer credit for any requirements on the second page of the program sheet require approval from the CS Department. To request approval, share it with Jerry Cain (jerry@cs.stanford.edu) via email and cc Danielle Gaspar (djgaspar@stanford.edu). Please include the Stanford class for which you are requesting credit, where and when you took the course, the name and number, for how many units you took the course, a syllabus, and a textbook list.For assistance with academic and administrative matters beyond the scope of the CS Department, such as enrollment status or transfer credit not showing up on your transcript, file a ticket or stop by the student services center.Student Services Center Back to Top"
year_published = 2025
