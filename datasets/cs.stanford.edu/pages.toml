ee to send an email to your student buddy.Your student advisor is your student buddy, as mentioned in your admit letter. This student advisor is in addition to your faculty advisor and will provide you with less formal and more broad-ranging help. We encourage you to get to know your student advisor, as they can assist with various issues: academic, social, and more. They can connect you with other students and faculty members and inform you of departmental news.Email phdstudentservices@cs.stanford.edu if you need clarification on your specific PhD Student Buddy.Contact Jayanthi Subramanian (jayanthi@stanford.edu) for inquiries regarding the PhD program. Back to Top"
