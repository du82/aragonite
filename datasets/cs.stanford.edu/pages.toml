title = "BS | Available Program Sheets | Computer Science"
full_description = "Department of Computer Science Archived Program Sheets Students can view old Computer Science program sheets and the deprecated major, Computer Science Engineering's program sheets. Learn More Department of Computer Science Info Session Archive Reference all the recorded sessions and presentation slides from past information sessions that the CS department has hosted. Access Here BS | Available Program Sheets Main navigation Skip Secondary Navigation Secondary Navigation Courses Bachelor's BS Tracks Program Sheets BS Requirements Honors Program How to Declare CS Minor Research Opportunities Frequently Asked Questions Master's PhD Curricular Practical Training Joint Programs Student Events Student Services Staff Computer Forum | Career Readiness Main content start OverviewStudents can use any program sheet starting the year they matriculated into Stanford. We encourage scholars to complete a program sheet early, when you have an idea of the classes you will take to graduate. You do not need to have grades listed on your program sheet to submit, as long as you have indicated the courses you will take to fulfill the requirements and the units you will take for them. Students are not allowed to mix requirements between program sheets.Important NoteAll courses listed on your program sheet must be taken for a letter grade except courses taken Spring 2019-20, and Autumn 2020-21 through Summer 2020-21. All courses listed on your program sheet can be included under only one category; there is no double-counting.To review your program sheet, we require at least the courses (completed, in progress, and planned) name/number (i.e. CSXXX) to be listed with the appropriate units.As soon as you have an idea of the courses you plan to take to satisfy your BSCS program, you should submit the CS Major Program Sheet Form. If you are planning to apply to graduate, this should be submitted at least one quarter prior, to ensure you receive feedback and approval.Take into consideration that only approved program sheets will be submitted to the School of Engineering for graduation review. You can change your CSBS track at any time before applying to graduate in Axess. If you decide to declare or change a specific track during your CSBS journey, please email Jessica Valdez (valdezjr@stanford.edu) or Danielle Gaspar (djgaspar@stanford.edu) your numeric SUID (i.e. 0123456) to approve the request in Axess. Please note that Axess does not automatically notify our team of new or updated track requests.To submit your CS undergraduate program sheet, you can complete the form below or at the bottom of this webpage.CS Major Program Sheet Submission FormStudents that wish to deviate from the program sheet can petition for exceptions or deviations to their CS requirements.Learn More Artificial Intelligence (AI)2024-2025: AI xlsx2023-2024: AI pdf2022-2023: AI pdf2021-2022: AI pdfComputer Engineering2024-2025: Comp Eng xlsx2023-2024: Comp Eng pdf 2022-2023: Comp Eng pdf2021-2022: Comp Eng pdfInformation2024-2025: Info xlsx2023-2024: Info pdf 2022-2023: Info pdf2021-2022: Info pdfTheory2024-2025: Theory xlsx2023-2024: Theory pdf 2022-2023: Theory pdf2021-2022: Theory pdfVisual Computing (Graphics)2024-2025: Vis Comp xlsx2023-2024: Vis Comp pdf 2022-2023: Vis Comp pdf2021-2022: Vis Comp pdf Computational Bio (Biocomp)2024-2025: Comp Bio xlsx2023-2024: Comp Bio pdf 2022-2023: Comp Bio xlsx2021-2022: Comp Bio pdfHuman-Computer Interaction2024-2025: HCI xlsx2023-2024: HCI pdf 2022-2023: HCI pdf2021-2022: HCI pdfSystems2024-2025: Systems xlsx2023-2024: Systems pdf 2022-2023: Systems pdf2021-2022: Systems pdfUnspecialized2024-2025: Unspec xlsx2023-2024: Unspec pdf 2022-2023: Unspec pdf2021-2022: Unspec pdfIndividually Designed2024-2025: Indiv Des xlsx2023-2024: Indiv Des pdf 2022-2023: Indiv Des pdf2021-2022: Indiv Des pdf Department of Computer Science Archived Program Sheets Students can view old Computer Science program sheets and the deprecated major, Computer Science Engineering's program sheets. Learn More Department of Computer Science Info Session Archive Reference all the recorded sessions and presentation slides from past information sessions that the CS department has hosted. Access Here CS Major Program Sheet Form Back to Top"
