["http://admissions@cs.stanford.edu/academics-joint-programs-ms/mba"]
title = "Joint Programs | MS/MBA | Computer Science"
full_description = '''Joint Programs | MS/MBA Main navigation Skip Secondary Navigation Secondary Navigation Courses Bachelor's Master's PhD Curricular Practical Training Joint Programs MS/MBA MS/Law PhD/Law Student Events Student Services Staff Computer Forum | Career Readiness Main content start OverviewThe joint MS in Computer Science/MBA degree program (CS/MBA) enables students to pursue simultaneously a Master of Business Administration at the Graduate School of Business (GSB) and a Master of Science in Computer Science at the Stanford School of Engineering. Joint MS/MBA degree students will have interests in technology and leadership with a desire to become managers or entrepreneurs in technologically-inclined businesses. Program OverviewThe joint MS/MBA program requires a combined total of 129 units, enabling completion of the joint degree in nine quarters. Students must successfully complete 84 units of instruction, 80 of which must be at the GSB, which includes successful completion of the Core and Distribution area requirements. Additionally, at least 70 GSB units for the MBA must be completed for a letter grade (not on a pass/fail basis). Rules concerning independent study, grade point average, the Global Experience requirement, and so forth will match those set for students in the regular MBA program, as specified annually on the MBA policies and Standard's tab on the MyGSB website.Students must successfully complete at least 45 unduplicated units of instruction approved by CS. Some of these courses (not to exceed 12 units) may be applied from approved GSB coursework. CS Foundations may be waived if equivalent coursework has been completed at another institution.CS Foundations Areas (10 units towards the 45 may apply)Logic, Automata, and Complexity (CS 103, 3-5 units)Probability (CS 109, Stat 116, EE 178, CME 106 or MS&E 220, 3-5 units)Algorithmic Analysis (CS 161, 3-5 units)Computer Organization and Systems (CS 107 or 107E, 3-5 units)Principles of Computer Systems (CS 111, 3-5 units)Significant Implementation Requirement CS 140: Operating Systems and Systems ProgrammingCS 140E: Operating Systems Design and ImplementationCS 143: CompilersCS 144: Introduction to Computer NetworkingCS 145: Introduction to DatabasesCS 148: Introduction to Computer Graphics and ImagingCS 151: Logic ProgrammingCS 190: Software Design StudioCS 210B: Software Project Experience with Corporate PartnersCS 212: Operating Systems and Systems ProgrammingCS 224R: Deep Reinforcement LearningCS 227B: General Game PlayingCS 231N: Convolutional Neural Networks for Visual RecognitionCS 239: Advanced Topics in Sequential Decision MakingCS 243: Program Analysis and OptimizationsCS 248A: Computer Graphics: Rendering, Geometry, and Image ManipulationCS 248B: Fundamentals of Computer Graphics: Animation and SimulationCS 330: Deep Multi-task and Meta LearningCS 341: Project in Mining Massive Data SetsDepth RequirementImportant Note: Completion of at least 21 units within a single specialization: Artificial Intelligence, Biocomputation, Computer and Network Security, Human-Computer Interaction, Information Management and Analytics, Mobile and Internet Computing, Software Theory, Systems, Theoretical Computer Science, Visual Computing.Note: All coursework must be taken for a letter grade and no more than 9 units of independent study may be included. Remaining units may be applied from the student’s specialization, from another specialization, or from approved GSB coursework (up to 12 units). At most 3 units of Computer Science/Electrical Engineering/Engineering seminars may be counted. CS courses numbered 112 and above, excluding CS 161A, CS 196 or CS 198 may be counted as electives. Other electives must be technical and numbered above 100, related to the degree program, and approved by an advisor and the MS Program Administrator. Maintaining a minimum grade point average of 3.0 on a 4.0 scale across all courses counting toward the MS is required.All coursework must be taken for a letter grade and no more than 9 units of independent study may be included. Remaining units may be applied from the student’s specialization, from another specialization, or from approved GSB coursework (up to 12 units). At most 3 units of Computer Science/Electrical Engineering/Engineering seminars may be counted. Students are expected to complete the joint MS/MBA Program in nine quarters.Approved Graduate School of Business (GSB) CoursesFINANCE 341 - Modeling for Investment Management (3 units)FINANCE 350 - Corporate Financial Modeling (4 units)OIT 356 - Electronic Business (2 units)STRAMGT 330 - Entrepreneurship and Venture Capital: Partnership for Growth (3 units)STRAMGT 353 - Entrepreneurship: Formation of New Ventures (4 units)STRAMGT 354 - Entrepreneurship and Venture Capital (4 units)STRAMGT 356 - The Startup Garage: Design (4 units)STRAMGT 366 - The Startup Garage: Testing & Launch (4 units)STRAMGT 572 - Strategic Management of Technology and Innovation (2 units)FINANCE 620 - Financial Markets I (3 units)FINANCE 622 - Dynamic Asset Pricing Theory (4 units) (not offered 2022-23)FINANCE 624 - Corporate Finance Theory (4 units)FINANCE 625 - Empirical Asset Pricing (3 units)GSBGEN 641 - Advanced Empirical Methods (3 units)MGTECON 600 - Microeconomic Analysis I (4 units)MGTECON 601 - Microeconomic Analysis II (4 units)MGTECON 602 - Auctions, Bargaining, and Pricing (4 units)MGTECON 604 - Econometric Methods II (3 units)MGTECON 608 - Multiperson Decision Theory (3 units)MGTECON 610 - Macroeconomics (4 units)Planning PoliciesFor students starting at the GSB, joint MS/MBA students spend most of their first year fulfilling requirements of the MBA curriculum. Students may begin taking CS courses once they begin taking electives, typically during Spring quarter of their first year. During their second and third year, students have the opportunity to take a variety of electives at the GSB and the CS Department.For students starting at CS, joint MS/MBA students spend most of their second year fulfilling requirements of the MBA curriculum. During their third year, students have the opportunity to take a variety of electives at the GSB and the CS Department.Visit the Computer Science specializations page for options. For assistance with program and course planning, please contact the Course Advisor (advisor@cs.stanford.edu).Course RegistrationStudents will have two open programs (known as "careers" in Axess) under which they may register for courses: the GSB career and the graduate (CS) career.Students must pay close attention to the career in which they register for a course. All GSB courses (whether applied to the MBA or the MS) should be enrolled under the GSB career. Getting StartedFor more information, please contact the CS Department or the Associate Director for joint & dual degree programs at the Graduate School of Business. GSB Application Back to Top'''
