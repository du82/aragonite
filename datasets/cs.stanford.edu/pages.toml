title = "BS | CS Minor | Computer Science"
full_description = "Department of Computer Science Info Session Archive Reference a summarized version of the CS Major & CS Minor declaration process with recorded sessions and presentation slides. Access Here BS | CS Minor Main navigation Skip Secondary Navigation Secondary Navigation Courses Bachelor's BS Tracks BS Requirements Honors Program How to Declare CS Minor Research Opportunities Frequently Asked Questions Master's PhD Curricular Practical Training Joint Programs Student Events Student Services Staff Computer Forum | Career Readiness Main content start OverviewAll courses for the CS minor must be taken for a letter grade with at least a 2.0 cumulative GPA average. To declare a CS Minor, all you have to do is declare in Axess. For questions about waiving and petitioning requirements, contact Jessica Valdez (valdezjr@stanford.edu). Submit your CS minor program sheet through the link below or the embedded SmartSheet form at the end of this page.Submit CS Minor Program SheetRequirementsNote: For students with no programming background, the minor consists of seven or eight courses.Required PrerequisitesMATH51 - Linear Algebra and Differential Calculus of Several Variables or CME100 - Vector Calculus for EngineersIntroduction to ProgrammingCS106B or CS106X - Programming AbstractionsNote: AP credit may be used to fulfill this requirementCore RequirementsCS103 - Mathematical Foundations of ComputingCS107 - Computer Organization and SystemsCS109 - Introduction to Probability for Computer ScientistsElectives (Choose two electives from different areas)Artificial Intelligence CS124 - From Languages to Information CS131 - Computer Vision: Foundations and ApplicationsCS221 - AI: Principles and Techniques CS228 - Probabilistic Graphical Models: Principles and TechniquesCS229 - Machine LearningHuman-Computer InteractionCS147 - Introduction to Human-Computer Interaction DesignCS177 - Human-Centered Product ManagementSystemsCS111 - Operating Systems PrinciplesCS112 - Operating Systems Kernel Implementation ProjectCS140E - Operating Systems Design and ImplementationCS143 - Compilers CS144 - Networking CS145 - Databases CS155 - Computer and Network SecurityVisual Computing CS148 - GraphicsTheoryCS154 - Automata and Complexity TheoryCS157 - Logic and Automated ReasoningCS161 - Design and Analysis of AlgorithmComputational BiologyCS173A - Foundations of Computational Human GenomicsCS Minor Submission Form Department of Computer Science Info Session Archive Reference a summarized version of the CS Major & CS Minor declaration process with recorded sessions and presentation slides. Access Here Back to Top"
