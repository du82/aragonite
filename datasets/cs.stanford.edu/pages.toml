title = "Computer Science"
full_description = '''Passion + Inspiration Our Research & Impact The CS Department is a center for research and education, discovering new frontiers in AI, robotics, scientific computing and more.More About CS Research Scientific Discovery Our Faculty Stanford CS faculty members strive to solve the world's most pressing problems, working in conjunction with other leaders across multiple fields. Explore Faculty by Their Areas of Research We're in the News Diyi Yang on language, computers, and societal impact Yang works on natural language processing, which combines math and theory to enable computers to communicate, through speech and text, in a human-like way. Specifically, she’s focused on making the technologies that power human-computer (and some human-human) communication more socially responsible.Read Assistant Professor Diyi Yang’s full interview More Stanford CS in the News We're in the News The future of AI coaching A computer scientist bringing AI to the classroom and the gym looks ahead to a world where AI coaches help make us smarter … and healthier. Join host Russ Altman on this episode of The Future of Everything Podcast and hear Professor James Landay share his thoughts on how AI is not just good at creating text and answering our questions, it can motivate us as a coach, and it can teach us as a tutor. It's the future of AI coaching. More Stanford CS in the News We're in the News Tour the state-of-the-art Stanford Robotics Center After many years of planning, fundraising, and development, the all-new Stanford Robotics Center officially opened its doors! “I came to Stanford in 1981 and this idea – this dream – was always there, even then,” says Oussama Khatib, director of the new Stanford Robotics Center and mastermind of the design and transformation of the space.See the video and take a tour of the new facility, a bright, open, and vibrant space . More Stanford CS in the News Stories & Voices Matthew Ayoob, Computer Science MS Candidate and Music Double Major "The communication skills that vocal performance has cultivated in me, understanding how to communicate an idea to another person and have a meaningful conversation that is really grounded in impact, has been life changing." See Matthew Ayoob's video'''
