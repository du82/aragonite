title = "BS | Eligible Humanities Electives | Computer Science"
full_description = "BS | Eligible Humanities Electives Main navigation Skip Secondary Navigation Secondary Navigation Courses Bachelor's BS Tracks BS Requirements Math Requirements Science Requirements Engineering Fundamentals Technology in Society Core Requirements Depth Requirements Eligible Humanities Electives Senior Project Writing in the Major Requirement Petitions, Deviations, & Transfer Credits Honors Program How to Declare CS Minor Research Opportunities Frequently Asked Questions Master's PhD Curricular Practical Training Joint Programs Student Events Student Services Staff Computer Forum | Career Readiness Main content start OverviewThe Computer Science Department encourages our undergraduate majors to enroll into humanities and social science courses outside the department to complement the mathematically and computationally oriented classes we've always required. Important Note: Courses that are cross-listed with the eligible Humanities elective courses are acceptable to utilize towards your program sheet.The classes contributing to this option are presented below:Art and Art StudioARTSINST 142: Drawing with CodeARTSTUDI 130: Interactive Art: Making it with ArduinoARTSTUDI 160: Intro to Digital / Physical DesignARTSTUDI 168: Data as MaterialARTSTUDI 179: Digital Art IEnglishENGLISH 106: A.I.: Artificial Intelligence in FictionENGLISH 106A: A.I.-Activism-ArtENGLISH 115: Virtual Italy: Methods for Historical Data Science (former name: Mapping the Grand Tour: Digital Methods for Historical Data)ENGLISH 122: Medieval Manuscripts, Digital MethodologiesENGLISH 184C: Data and Knowledge in the HumanitiesENGLISH 184D: Race, Gender, and Literary Digital HumanitiesENGLISH 184E: Literary Text MiningPhilosophyPHIL 60: Introduction to Philosophy of SciencePHIL 72: Contemporary Moral ProblemsPHIL 99: Minds and MachinesPHIL 170: Ethical TheoryPHIL 171: JusticePHIL 174B: Universal Basic Income: The Philosophy Behind the ProposalHistoryHISTORY 44: Women and Gender in Sci