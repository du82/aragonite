full_description = "Department of Computer Science New Student Orientation An important orientation event thats tailored and hosted for all new CS graduate students -- a great introduction to our department. Read More Department of Computer Science Events Calendar Stay updated with us and view our go-to resource for all the happenings occurring in the Computer Science department. Access Here Academics | Student Events Main navigation Skip Secondary Navigation Secondary Navigation Courses Bachelor's Master's PhD Curricular Practical Training Joint Programs Student Events New Student Orientation Student Services Staff Computer Forum | Career Readiness Main content start OverviewWe are thrilled to have you here, where our vibrant community of students, faculty, and industry professionals come together to create a dynamic and enriching environment. Our mission is to provide you with a plethora of opportunities to engage, learn, and connect, fostering both personal and professional growth. Our events hub is designed to be your go-to resource for all things related to student events within the Computer Science department.We encourage you to make the most of these opportunities by staying informed and actively participating in the events that interest you. Our events calendar is regularly updated with the latest happenings, ensuring you never miss out on an opportunity to learn, grow, and connect. Stay tuned for upcoming events, mark your calendars, and get ready to embark on an exciting journey of discovery and development. We look forward to seeing you at our events and being a part of your success story! Department of Computer Science New Student Orientation An important orientation event thats tailored and hosted for all new CS graduate students -- a great introduction to our department. Read More Department of Computer Science Events Calendar Stay updated with us and view our go-to resource for all the happenings occurring in the Computer Science department. Access Here Back to Top"
