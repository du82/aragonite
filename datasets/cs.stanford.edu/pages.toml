full_description = "Admissions Main navigation Skip Secondary Navigation Secondary Navigation PhD Admissions Master's Admissions Coterminal Admissions Joint Degree Admissions Graduate Application Checklists Graduate Application Deadlines Current Stanford Students Non-Degree Option Student Resources Contact Us Main content start Student ResourcesThe Department of Computer Science wants to ensure that students have the necessary resources to be successful in their undergraduate and/or graduate journey. Fee WaiverThe Computer Science Department offers application fee waivers to qualified candidates. We especially encourage applications from first-generation, low-income students who are U.S. citizens or permanent residents and those whose backgrounds and life experiences would bring additional dimensions to the Computer Science Department. The Computer Science Department is unable to offer a traditional fee waiver, however, the School of Engineering offers fee waivers.Student-Applicant Support ProgramThe Student-Applicant Support Program (SASP) is an optional, student run program intended to give application feedback to students in advance of the department deadline as they apply to Stanford’s CS PhD program. Applicants may receive one round of meaningful feedback on their resume and statement of purpose from a current PhD student (capacity limited). Participation in the Student-Applicant Support Program is separate from the admissions process and does not guarantee admission.No Longer Accepting ApplicationsSOP Guidance The Knight-Hennessy ScholarsThe Knight-Hennessy Scholars (KHS) is an optional scholarship program. Designed to build a multidisciplinary community of Stanford graduate students dedicated to finding creative solutions to the world's greatest challenges. The program awards up to 100 high-achieving students every year with full funding to pursue a graduate education at Stanford, including the MS and PhD in Computer Science. Back to Top"
