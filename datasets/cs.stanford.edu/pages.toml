full_description = "Joint Degree Admissions Main navigation Skip Secondary Navigation Secondary Navigation PhD Admissions Master's Admissions Coterminal Admissions Joint Degree Admissions Joint CS MS/MBA Degree Joint CS MS/Law Degree Joint CS PhD/Law Degree Graduate Application Checklists Graduate Application Deadlines Current Stanford Students Non-Degree Option Student Resources Contact Us Main content start Joint CS MS/Law DegreeLaw students interested in pursuing an MS in Computer Science must apply for admission to the Computer Science Department eitherconcurrently with applying to the Law School;or after being admitted to the Law School, but no later than the earlier of:the end of the second year of law school;or the Computer Science Department’s admission deadline for the year following that second year of Law School.In addition to being admitted separately to the Law School and the Computer Science Department, students must secure permission from both academic units to pursue degrees in those units as part of a joint degree program. JD/MS students may elect to begin their course of study in either the Law School or the Computer Science Department. Faculty advisors from each academic unit will participate in the planning and supervising of the student’s joint program. Students must be enrolled full time in the Law School for the first year of Law School. Otherwise, enrollment may be in the graduate school or the Law School and students may choose courses from either program regardless of where enrolled. Students must satisfy the requirements for both the JD and the MS degrees as specified in the Stanford Bulletin or elsewhere.The Law School shall approve courses from the Computer Science Department that may count toward the JD degree and the CS Department shall approve courses from the Law School that may count toward the CS MS degree. In either case, approval may consist of a list applicable to all joint degree students or may be tailored to each individual student’s program.Law School Application Website Back to Top"
