["https://cs.stanford.edu/admissions/graduate-application-checklists"]
title = "Graduate Application Checklists | Computer Science"
full_description = "Graduate Application Checklists Main navigation Skip Secondary Navigation Secondary Navigation PhD Admissions Master's Admissions Coterminal Admissions Joint Degree Admissions Graduate Application Checklists Graduate Application Deadlines Current Stanford Students Non-Degree Option Student Resources Contact Us Main content start OverviewCompleted online applications must be submitted by the CS application deadlines. The online application can be found here.PhD and MS Application ChecklistApplication fee. The application fee of $125 is to be paid in the online application with a credit card.Statement of purpose. Your statement of purpose should be concise, focused, and well written. It should describe succinctly your reasons for applying to the proposed program at Stanford, your preparation for this field of study, research interests, future career plans, and other aspects of your background and interests which may aid the admissions committee in evaluating your aptitude and motivation for graduate study. The statement of purpose must be no more than two pages in length, single-spaced. It will be submitted as part of the online application.3 recommendation letters. In the online application, you will be asked to identify your recommenders and their email addresses. Please notify your recommenders that they will receive an email prompt to submit their recommendation online. CS only accepts online recommendations through the application system. CS cannot accept mailed, emailed, or faxed recommendations.You must submit a minimum/maximum of three recommendation letters and they must be submitted through the online application system. We recommend that at least two of these letters be from academic sources. Please have your recommender write candidly about your qualifications, potential to carry on advanced study in the field specified, intellectual independence, capacity for analytical thinking, ability to organize and express ideas clearly, and potential for teaching. In describing such attributes as motivation, intellect, and maturity, specific examples are more useful than generalizations. We do not consider letters of recommendations submitted via Interfolio.For more information on submitting letters of recommendation visit here.Resume. Submit your resume in the online application and include any publications.Supplemental form. This form is part of the online application. List any publications and your website on this form and on your resume (CV). Upload your resume (CV) on the document uploads, confirmation and submission section (page 15). Additionally, attach a copy of your NDO transcript on the additional information's section of the online application.Transcripts. You are required to upload unofficial copies of your transcripts or e-transcripts onto the online application for all institutions you have attended for at least a year as a full time student. Transcripts from Stanford's Non-Degree Option (NDO) program should also be uploaded. Do not mail your official transcripts unless we contact you to do so. For more information on the minimum level of study required of applicants who wish to apply for graduate study at Stanford, please visit here.GRE. These are not required for PhD or MS applicants. TOEFL. We do not accept IELTS scores.Stanford University requires the Test of English as a Foreign Language (TOEFL) from all applicants whose native language is not English. The Test of Written English (TWE) portion of the TOEFL is not required. Applicants who have completed a four-year Bachelor's degree or a two-year Master's program (or its equivalent) in the U.S. or at an institution where English is the main language of instruction are not required to take the TOEFL. For more information on TOEFL requirements, please see here. The TOEFL test may be taken no earlier than 24 months (two years) prior to the application deadline. Be sure to take the test in time for your scores to be received at Stanford by the application deadline. Stanford Institution code: 4704 (no department code is required).IMPORTANT NOTE: Do not mail any other paper documents to the admissions office such as publications, or financial statements/documents, as they will not be reviewed by the admissions committee. The committee reviews all graduate applications online and will have no access to copies of any documents sent via post. We will not upload documents to your applicant file if they are emailed to us.Coterm Application ChecklistCS Coterm application form. Needs to be completed and submitted online.Statement of Purpose. This is submitted as part of the online application.Instead of turning in a preliminary program proposal, the Department requests that you write about general coursework that you are planning on taking as part of your Coterm program within the body of your statement of purpose. Your statement of purpose should be concise, focused, and well written. It should describe succinctly your reasons for applying to the proposed program at Stanford.Three letters of recommendation. In the online application, you will be asked to identify your recommenders and their email addresses. Notify your recommenders that they will receive an email prompt to submit their recommendations online.You must submit a minimum/maximum of three recommendation letters and they must be submitted through the online application system. At least two of these letters should be from academic sources. Have your recommender write candidly about your qualifications, potential to carry on advanced study in the field specified, intellectual independence, capacity for analytical thinking, ability to organize and express ideas clearly, and potential for teaching. In describing such attributes as motivation, intellect, and maturity, specific examples are more useful than generalizations.Transcripts. You are required to upload copies of your unofficial transcripts into the online application. GPA calculation. Most students have a maximum 4.3 GPA at Stanford. Use the GPA that is reflected in Axess for application.GREs. These are not required for Coterm applicants.It will not be possible to answer inquiries regarding the status of any application. We will contact you if any component of your application is missing. If you have questions or concerns, email admissions@cs.stanford.edu. Back to Top"
