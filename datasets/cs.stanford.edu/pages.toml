full_description = "CS Graduate Application Applicants to graduate studies in Computer Science must apply either to MS (including HCP) or PhD, not to both. Apply Now CS Coterm Application Applicants to the CS Coterm program must be a current Stanford undergraduate. Students on leave of absence are not eligible to apply. Apply Now Graduate Application Deadlines Main navigation Skip Secondary Navigation Secondary Navigation PhD Admissions Master's Admissions Coterminal Admissions Joint Degree Admissions Graduate Application Checklists Graduate Application Deadlines Current Stanford Students Non-Degree Option Student Resources Contact Us Main content start OverviewAll application deadlines are final. Applications will not be accepted after the deadline. We have only one admissions cycle for starting in the Autumn quarter the PhD, MS (including HCP) program.Important Note: For the joint degree programs, the application dates are only for the CS affiliated application. For the Graduate School of Business and School of Law application deadlines, please refer to the respective websites for additional information. For the CS Coterminal program, you are only allowed to apply for a maximum of 3 attempts. Entry quarterApplication opensApplication deadlineDecision datePhD ApplicationAutumnLate SeptemberDecember 3, 2024February 2025Master's ApplicationAutumnLate SeptemberDecember 3, 2024March 2025Coterm Application (Stanford undergraduates only)Winter 2024-2025September 24, 2024October 8, 2024November 1, 2024 Spring 2024-2025December 17, 2024January 10, 2025February 3, 2025 Autumn 2025-2026April 11, 2025May 2, 2025May 30, 2025CS MS/MBA Application (CS MS deadline only)AutumnLate SeptemberDecember 3, 2024March 2025CS MS/Law Application (CS MS deadline only)AutumnLate SeptemberDecember 3, 2024March 2025CS PhD/Law Application (CS PhD deadline only)AutumnLate SeptemberDecember 3, 2024February 2025KHS DeadlineThe Knight-Hennessy Scholars (KHS) is a prestigious scholarship program. It is designed to build a multidisciplinary community of Stanford graduate students dedicated to finding creative solutions to the world's greatest challenges. KHS admits up to 100 high-achieving students every year from across Stanford's seven (7) graduate schools. Scholars receive up to three (3) years of full funding for graduate studies at Stanford. Candidates of any country may apply. KHS applicants must have earned their first undergraduate degree within the last seven years, and must apply to both a Stanford graduate program (MS or PhD) and to KHS. Learn More.The application is now closed.TOEFL DeadlineOctober 26, 2024 (at least six weeks before the application deadline) is the suggested deadline to ensure scores are received in time for review. CS Graduate Application Applicants to graduate studies in Computer Science must apply either to MS (including HCP) or PhD, not to both. Apply Now CS Coterm Application Applicants to the CS Coterm program must be a current Stanford undergraduate. Students on leave of absence are not eligible to apply. Apply Now Back to Top"
