title = "Joint Degree Admissions | Computer Science"
full_description = "Joint Degree Admissions Main navigation Skip Secondary Navigation Secondary Navigation PhD Admissions Master's Admissions Coterminal Admissions Joint Degree Admissions Joint CS MS/MBA Degree Joint CS MS/Law Degree Joint CS PhD/Law Degree Graduate Application Checklists Graduate Application Deadlines Current Stanford Students Non-Degree Option Student Resources Contact Us Main content start Joint CS PhD/Law DegreeGraduate students interested in pursuing a joint graduate program in Computer Science and Law can apply to a joint degree program between the two academic units. The program is designed for students interested in obtaining both a JD and a PhD. In addition to being admitted to both programs, students must apply to the joint program by contacting the supervising faculty in each department.Students interested in the joint degree program must apply and gain entrance separately to the School of Law and to the PhD program in Computer Science and as an additional step, must secure permission from both academic units to pursue degrees in those units as part of the joint degree program. Interest in either joint degree program should be noted on the student’s admissions applications and may be considered by the admissions committee of each program. Alternatively, an enrolled student in either program may apply for admission to the other program and for joint degree status in both academic units after commencing study in either program.Law School Application Website Back to Top"
