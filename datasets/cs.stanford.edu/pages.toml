title = "BS | Writing in the Major Requirement | Computer Science"
full_description = "BS | Writing in the Major Requirement Main navigation Skip Secondary Navigation Secondary Navigation Courses Bachelor's BS Tracks BS Requirements Math Requirements Science Requirements Engineering Fundamentals Technology in Society Core Requirements Depth Requirements Eligible Humanities Electives Senior Project Writing in the Major Requirement Petitions, Deviations, & Transfer Credits Honors Program How to Declare CS Minor Research Opportunities Frequently Asked Questions Master's PhD Curricular Practical Training Joint Programs Student Events Student Services Staff Computer Forum | Career Readiness Main content start OverviewWriting in the Major (WiM) courses provide students with opportunities to develop writing skills in the context of their major fields. It begins the process of learning to write effectively in discipline-specific formats and styles. CS181W, CS182W, CS191W, CS194W, CS210B and CS294W are the only WiM eligible courses within the CS Department.Writing in the Major courses have the following qualities:carry at least three units of creditmust be taken for a letter gradeare taught by faculty, senior lecturers or lecturersrequire a substantial amount of writing (the exact amount number and types of assignments vary according to what is appropriate for the discipline)schedule writing at regular intervals throughout the quarter via multiple short papers and / or assigning a larger project in stagesemphasize the process of rewriting with individualized feedback and coaching from the instructor or TA (require at least one substantial revision)devote attention to standards of writing in the disciplineintegrate writing concerns into classroom activities (e.g., lecture, discussion, student presentations)are situated in the overall curriculum of the major to contribute most effectively to students’ training in the disciplineTake into consideration that CS181W and CS182W are eligible to satisfy both WiM and Technology in Society requirements, whereas CS191W, CS194W, CS210B, and CS294W are eligible to satisfy both WiM and Senior Project requirements.Learn More Back to Top"
