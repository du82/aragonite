full_description = "Non-Degree Option Main navigation Skip Secondary Navigation Secondary Navigation PhD Admissions Master's Admissions Coterminal Admissions Joint Degree Admissions Graduate Application Checklists Graduate Application Deadlines Current Stanford Students Non-Degree Option Student Resources Contact Us Main content start OverviewNDO is the Non-Degree Option program available to non-Stanford students through the Stanford Engineering Center for Global & Online Learning (CGOE). Courses are taken remotely. Apply Here: Stanford OnlineNon-Degree Option | Frequently Asked QuestionsWhat is NDO? NDO is the Non-Degree Option program available to non-Stanford students through the Stanford Engineering Center for Global & Online (CGOE). Courses are taken remotely. No degree is obtained.How do I apply to the NDO program? See here.What classes are offered remotely? Please refer to the course offerings section of Stanford Online. Note that classes vary from quarter to quarter.If I apply to the NDO program, will my previous transcripts be available to my employer? If you submit your transcript directly to Stanford University, your employer will NOT have access to your previous transcripts.Can I sit in on the classes as an NDO student? No. NDO students are not allowed to come to campus for classes with the exception of midterm and final exams.How many units from my NDO courses can I transfer to the HCP program if I apply and am accepted? A maximum of 18 units may be transferred.Will taking courses through the NDO program help me in my application to the HCP program? Taking classes through the NDO program might help you if you receive good grades. However, receiving good grades as an NDO student will not guarantee acceptance into the HCP program as many items factor into that decision (grades from previous degree(s), GRE(s), reference letters, etc.). Back to Top"
