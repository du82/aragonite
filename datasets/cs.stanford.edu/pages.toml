["https://cs.stanford.edu/bs-requirements-science"]
title = "BS | Science Requirements | Computer Science"
full_description = "BS | Science Requirements Main navigation Skip Secondary Navigation Secondary Navigation Courses Bachelor's BS Tracks BS Requirements Math Requirements Science Requirements Engineering Fundamentals Technology in Society Core Requirements Depth Requirements Eligible Humanities Electives Senior Project Writing in the Major Requirement Petitions, Deviations, & Transfer Credits Honors Program How to Declare CS Minor Research Opportunities Frequently Asked Questions Master's PhD Curricular Practical Training Joint Programs Student Events Student Services Staff Computer Forum | Career Readiness Main content start OverviewTransfer credits and AP credits in Science must be approved by the School of Engineering (SoE) Dean's Office. Any course of 3 or more units from the SoE science list, PSYCH 30, or AP Chemistry may be used. All AP credit must be approved by the School of Engineering.PhysicsCS majors must take both a Mechanics class (PHYSICS21, PHYSICS41, PHYSICS61) and an Electricity and Magnetism class (PHYSICS23, PHYSICS43, PHYSICS63). Mixing classes from different series is acceptable. Physics labs are not required for the CS major. In general, almost any college level, first year physics class that covers mechanics and E&M will be awarded transfer credit and count towards the physics requirement.Taking physics at Foothill College, the local community college, or at home over the summer is typically acceptable. Since the School of Engineering approves this requirement, check with them prior. AP credit will also satisfy the physics requirement. For more information, refer to the Physics sections of the Stanford AP Credit Chart.Science ElectiveThe list of approved electives includes the School of Engineering science electives list and PSYCH30 (Perception). A 5 on the AP Chemistry exam will count as 4 units of science elective credit. The Undergraduate engineering handbook will have an current list of classes that can be counted towards the science elective.Approved Science Elective Courses Back to Top"
