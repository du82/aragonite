title = "BS | Degree Requirements | Computer Science"
full_description = "BS | Degree Requirements Main navigation Skip Secondary Navigation Secondary Navigation Courses Bachelor's BS Tracks BS Requirements Math Requirements Science Requirements Engineering Fundamentals Technology in Society Core Requirements Depth Requirements Eligible Humanities Electives Senior Project Writing in the Major Requirement Petitions, Deviations, & Transfer Credits Honors Program How to Declare CS Minor Research Opportunities Frequently Asked Questions Master's PhD Curricular Practical Training Joint Programs Student Events Student Services Staff Computer Forum | Career Readiness Main content start OverviewAll courses on your CS major program sheet must be taken for a letter grade, and you should have at least a 2.0 GPA towards your degree. To have your program sheet reviewed and approved, please submit a CS major program sheet form. If you are awaiting a grade, and/or planning to take a course, we require your program sheet to have at least the units and the course number listed.All undergraduate students who are pursuing a Bachelor's degree must also complete their general undergraduate requirements. To learn more about your undergraduate degree requirements, you can go to the Stanford Student Services website.School of Engineering RequirementsThese requirements are set and approved by the School of Engineering. Changes to these requirements must be approved by the School of Engineering Office of Student Affairs (Huang 135) one quarter prior to a student's last quarter. For most students, this is winter quarter of senior year. More instructions and forms are available at the UGHB website.Using AP Credit to satisfy math and science requirements must also be approved by the Office of Student Affairs. To receive this approval, take a program sheet and unofficial transcript to Huang 135. The math, science, and engineering fundamentals requirements for the Biocomputation and Computer Engineering tracks differ from those listed here. Please see the program sheets for specifics.Important Note: All courses listed on your program sheet must be taken for a letter grade except courses taken Spring 2019-20, and Autumn 2020-21 through Summer 2020-21. All courses listed on your program sheet can be included under only one category; there is no double-counting.Math RequirementsScience RequirementsEngineering FundamentalsTechnology in SocietyComputer Science Department RequirementsThe minimum major in computer science consists of 96 units, including 26 units of math, 11 units of science, 10 units of engineering fundamentals, one course in TIS (Technology in Society), and 43 units of core depth. After learning essential programming techniques in CS106 (via the CS106A/B courses) and the mathematical foundations of Computer Science in CS103, the CS major offers coursework in areas such as Artificial Intelligence, Computational Biology, Computer Engineering, Human-Computer Interaction, Information, Systems, Theory, and Visual Computing.Important Note: All courses listed on your program sheet must be taken for a letter grade except courses taken Spring 2019-20, and Autumn 2020-21 through Summer 2020-21. All courses listed on your program sheet can be included under only one category; there is no double-counting.Core RequirementsDepth RequirementsSenior Project Requirement Back to Top"
