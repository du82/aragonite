title = "Sloan, Robert  | Computer Science | University of Illinois Chicago"
full_description = '''Robert Sloan Professor Department Head Department of Computer Science Pronouns: He/Him/His Contact Building & Room: 1112 SEO Address: 851 S. Morgan St, MC 152, Chicago, IL, 60607 Office Phone: 312.996.2369 Email: sloan@uic.edu CV Link: Robert Sloan Related Sites: View full profile About I am very proud to be the Academic Lead and PI for Break Through Tech Chicago. I am also a proud BRAID Department Head. You should study Computer Science, and I wrote about it before it was trendy. Download and read Robert H. Sloan, "Why Computer Science?" (in a collection, written just before enrollments went from high to extraordinarily high). I'm excited about Richard Warner's and my last two books: our 2021 book on privacy, and our 2019 book on data breaches (recently released in paperback!). First publication and third below. Research Interests: Computer security, especially privacy, legal, and policy issues. Computer Science Education. Application of computer science theory and algorithms to problems from artificial intelligence. Proud member of the UIC theory group. Selected Publications Robert H. Sloan and Richard Warner. The Privacy Fix: How to Preserve Privacy in the Onslaught of Surveillance. Cambridge University Press, Oct. 2021. Robert H. Sloan and Richard Warner. “Beyond Bias: Artificial Intelligence and Social Justice”. Virginia Journal of Law and Technology 24.1 (2020), pp. 1–32. Available at: https://www.vjolt.org/ s/v24i1SloanWarner.pdf. Robert H. Sloan and Richard Warner. Why Don’t We Defend Better? Data Breaches, Risk Management, and Public Policy. CRC Press, 2019. R. H. Sloan and R. Warner. “When Is an Algorithm Transparent?: Predictive Analytics, Privacy, and Public Policy”. IEEE Security & Privacy 16.3 (2018), pp. 18–25. S. Ohlsson, R. H. Sloan, G. Turán, and A. Urasky. “Measuring an artificial intelligence system’s performance on a Verbal IQ test for young children”. Journal of Experimental & Theoretical Artificial Intelligence 29.4 (2017), pp. 679–693. Robert H. Sloan and Richard Warner. “Beyond notice and choice: Privacy, norms, and consent”. Suffolk University Journal of High Technology, 14(2):370–412, 2014. Robert H. Sloan and Richard Warner. Unauthorized Access: The Crisis in Online Privacy and Security. CRC Press, 2013. Richard Warner and Robert H Sloan. “Behavioral advertising: From one-sided chicken to informational norms”. Vanderbilt Journal of Entertainment & Technology Law, 15, 2012. Jon A. Solworth and Robert H. Sloan, Layered Design of Discretionary Access Controls with Decidable Safety Properties”. Proc. 2004 IEEE Symposium on Security and Privacy, pages 5–67, May 2004. Thomas S. Messerges, Ezzy A. Dabbish and Robert H. Sloan, “Examining Smart-Card Security under the Threat of Power Analysis Attacks”. IEEE Transactions on Computers, 51:541–552, May 2002. Education Ph.D. 1989, S.M. 1986 Computer Science, Massachusetts Institute of Technology. B.S. Mathematics, Yale University, 1983.'''
