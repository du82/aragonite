full_description = "MastersInAI.org Ranks Online Master of Engineering ML program in top 10 Andrea Poet | Posted on February 25, 2025 MastersInAI.org Ranks Online Master of Engineering ML program in top 10 Heading link Copy link Jim Young UIC’s Online Master of Engineering – AI and Machine Learning program was included in a list of best programs by MastersInAI.org. The program was ranked #9 for 2025 and was lauded for its affordability and engineering management component. The Online Master of Engineering (MEng) degree is a professional, non-thesis degree geared toward professionals looking to advance their technical skills in AI and Machine Learning and gain management and leadership skills pertinent to careers centered on AI innovation. MastersInAI.org’s ranking cited UIC’s strong reputation in its assessment, noting that the school is a Carnegie RI institution conducting academic research at the highest levels. The review highlighted the Natural Language Processing and Machine Learning laboratories in the computer science department and work by faculty in AI, signal processing, data science, and machine learning taking place in the electrical and computer engineering department. Students in the program complete nine courses, or 36 credit hours, with four courses devoted to AI and Machine Learning, and leadership-focused credits in engineering law and engineering management. Students typically complete the self-paced program in under two years. UIC’s Meng’s curriculum was designed and is taught by our UIC faculty, including some of the top researchers in AI and ML. Students gain expertise in neural networks, natural language processing, and deep neural networks for a broad range of applications. This high-quality Master’s degree program costs under $32,000, less than half of what other similar degrees cost. In 2023, Forbes included UIC in its roundup of best online master’s in engineering programs."
