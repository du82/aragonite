full_description = "CME Group Foundation to award scholarships to underserved students majoring in CS Andrea Poet | Posted on March 07, 2024 CME Group Foundation to award scholarships to underserved students majoring in CS Heading link Copy link Jim Young The CME Group Foundation is offering up to $20,000 renewable scholarships – up to $60,000 total ­– to Chicago-area students from low-income and historically underserved communities majoring in computer science or data science. Black and Latinx students are encouraged to apply. The foundation “strives to empower future generations through education, equipping today’s students to meet tomorrow’s challenges.” UIC is one of 11 eligible schools, and computer science and data science are the only majors in UIC’s College of Engineering to qualify, as the focus of the scholarship is technology, finance, or applied mathematics. Students must be rising undergraduate sophomore, junior, or senior students, and plan to enroll full time for the upcoming academic year. Applicants must also have a minimum GPA of 2.5/4.0 or equivalent, demonstrate financial need, and agree to attend a one-day market education program at CME Group in Chicago during August. The application deadline is April 4."
