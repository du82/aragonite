full_description = "Research Experiences for Undergraduates REUs Heading link Copy link Research experiences for undergraduates—called REUs for short—offer undergraduate students the opportunity to complete career-building research projects over the summer. REUs are competitive (with students chosen for the research positions by application) and often are held at universities other than your home institution. They are sponsored with funding from the National Science Foundation and typically come with a stipend that you can use to cover living expenses and other costs. REUs make excellent résumé entries and offer valuable hands-on experience that you can talk about in job interviews. If you have your eye on a master’s degree or PhD after graduation, REUs provide a head start on building your research experience and could give you insight on what you might like to pursue in graduate school. Think of REUs as a great way to get research experience while trying out living in a different place. Search the NSF site for current REUs"
