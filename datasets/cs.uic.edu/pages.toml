["https://cs.uic.edu/cs-events/student-opportunities"]
title = "Student Opportunities | Computer Science | University of Illinois Chicago"
description = """
Internships and other opportunities      Heading link
                      Copy link"""
full_description = "Student Opportunities Internships and other opportunities Heading link Copy link Argonne National Laboratory internships: Visit the lab’s Graduate Programs or Undergraduate Programs pages for further information. There are multiple internship programs in different fields, and application requirements and dates may vary for each. Scholarships Heading link Copy link Chris Jackson Computer Science Education Scholarship: This $5,000 scholarship is awarded to a new recipient every six months. Applicants will be required to discuss their interest in pursuing a computer science degree, their career aspirations, and why they think they should receive the award. Learn more, find out the next available application deadline, and submit your application here. Illinois Student Assistance Commission: The iGROW Tech Scholarship program will be available starting the 2024-2025 academic year. It was developed to help recruit and train individuals to work in high-demand technology jobs. The iGROW Tech Scholarship is currently in the program development stage, so you can learn more and sign up to receive updates as they become available on the application process. Why do hackathons? Heading link Copy link We strongly encourage UIC CS students to sign up for hackathon competitions. Here are some reasons why: Meeting new people. Not just potential employers—who might watch a hackathon for potential new hires—but also fellow students. Developing your résumé. Hackathons let you showcase the skills you’ve developed in class and build some new ones. Enhancing your job interviews. Hackathons make you a more interesting interviewee. You can talk about how you approached a problem, the solutions you considered, and which skills you brought to the table. Winning! (Of course.) More on hackathons Heading link Copy link Upcoming opportunities upcoming hackathons The Department of Energy’s Conquer the Hill Command competition will be held February 22, 2025. Command put’s competitor’s technical skills to the test in a task-based challenge that provides experience performing real-world tasks in IT administration and security. Learn more and register now. Hackathon honor roll info here UIC students have placed highly in these hackathon events: BuiltWorlds Hackathon 2019: Riccardo Pressiani, Matteo Foglio, Guido Muscioni, Francesco Sgherzi, Chiara Gambacorta, and Giulia Soresini, Grand Prize Google Tech Challenge 2019: 3rd place, 5th place MIT Energy Hack 2018: Chirag Soni, MS ’19 BuiltWorlds Hackathon 2018: Giovanni Agugini Bassi, Iacopo Olivo, and Francesco Pinci, all MS ’19 Mobility Hackathon Chicago: The Roiti (team of five MS ’19 students) Research Experiences for Undergraduates Heading link Copy link Research experiences for undergraduates—called REUs for short—offer undergraduate students the opportunity to complete career-building research projects over the summer. REUs are competitive (with students chosen for the research positions by application) and often are held at universities other than your home institution. Most REUs are sponsored with funding from the National Science Foundation and typically come with a stipend that you can use to cover living expenses and other costs. Other REUs are offered by various government agencies and non-profits. REUs make excellent résumé entries and offer valuable hands-on experience that you can talk about in job interviews. If you have your eye on a master’s degree or PhD after graduation, REUs provide a head start on building your research experience and could give you insight on what you might like to pursue in graduate school. Think of REUs as a great way to get research experience while trying out living in a different place. Rosetta Commons REU begins with one week of Rosetta Code School, 8 weeks of hands-on research in a molecular modeling and design laboratory, and ends with a trip to the Rosetta Conference. The program is held at multiple locations across the country. Program includes a stipend, housing, travel, and a meal allowance. Application deadline is February 3, 2025. ASSET REU (Advanced Secured Sensor Enabling Tech) is a program centered on security and privacy, machine learning, mobile and wireless networks, and secure sensor enabling technologies. This ten-week program will be held at Florida International University. A stipend is included. Rolling application deadline is May 17, 2025, and the early admission deadline is February 27, 2025. Rosetta Commons Postbac Program is a one-year fellowship for students from groups underrepresented in STEM, first generation college students, and students at under-resourced institutions to gain resaerch experience to succeed in PhD programs. The program includes a salary, health benefits, and funding for conference travel. Program runs August 16, 2025 to August 17, 2026. Application deadline is March 1, 2025. NSF Distributed Research Experiences for Undergraduates (DREU) program offers an opportunity to immerse yourself in a research environment, guided by experienced faculty mentors. Whether you’re considering graduate school or just want to explore your research interests, NSF DREU provides a unique, hands-on learning experience designed to support students at every stage of their academic journey. Program includes a stipend, relocation expenses, and conference travel. Application deadline is February 25, 2025. Computing for Heath and Well-being, University of Iowa. NSF funded program to solve short- and long-term challenges to the health care system. Along with mentored research, a bootcamp, and career development workshops, participants will receive a stipend, housing, and food. Program runs May 26-August 2, 2025. Applications should be submitted by March 15 for full consideration. Search REUs on the NSF site"
