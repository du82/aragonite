full_description = "faculty Heading link Copy link UIC computer science has experienced prodigious growth in the last 10 years thanks to steadily rising enrollment, and it has kept pace by building a fast-growing faculty that demonstrates excellence in research, teaching, and service. This fall, the computer science department welcomed 13 new faculty members, representing the College of Engineering’s commitment to matching an ever-expanding student population with a team of talented professors. The department now has 73 full-time faculty. In addition, 32 staff members make it possible for the department to achieve its goals, providing a range of expertise that encompasses laboratory research, computing support, student advising, and finance and administration. In addition to performing research housed within the computer science department, our faculty members work across disciplinary lines with College of Engineering colleagues on broad-scope projects such as the Autonomous Vehicles Working Group."
