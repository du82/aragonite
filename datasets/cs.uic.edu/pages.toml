title = "Graduate Admissions | Computer Science | University of Illinois Chicago"
full_description = "Graduate Admissions Available degrees Ph.D. in Computer Science: This is a research degree that culminates in a unique dissertation that demonstrates original and creative research. Hear from our alumni! Students in the News Application instructions can be found here. M.S. in Computer Science: The department offers three types of M.S. degrees: (i) Plan A with a research thesis, (ii) Plan B with an independent project, and (iii) Plan C that only requires coursework-based projects. Hear from our alumni! Application instructions can be found here. Non-degree study in Computer Science: The department offers this option for US citizens and residents who lack a background in Computer Science. Application instructions can be found here. We guarantee funding to all of our Computer Science Ph.D. students from day one. Students will continue to have funding throughout their doctoral experience, as long as they remain in good academic standing and successfully perform the duties of their assistantships. Students with funding typically have their tuition and almost all of their health insurance costs covered. They also receive a stipend paid to them to help cover their living expenses. Students are also eligible for summer support. Most CS graduate students, including masters, are eligible for financial support, including teaching assistantships (TA), research assistantships (RA), and graduate fellowships. Apply now"
