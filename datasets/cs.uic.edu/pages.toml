["https://www.cs.uic.edu/~ifc/advis.html"]
title = "Isabel F. Cruz - ADVIS Research Group"
full_description = "The Advances in Data, Visual, and Information Science Research Laboratory (ADVIS) is part of the Department of Computer Science, College of Engineering at the University of Illinois at Chicago. ADVIS hosts students doing research in computer information management systems with particular emphasis on database and information systems and related issues such as: semantic web (and in particular semantic data integration and semantic desktop), geospatial information systems, context-aware systems, information visualization (including graph drawing), retrieval and presentation of multimedia information, and information retrieval and classification. This research lab has existed since 1994 (first with the name DBVIS, for Database Visualization) and after 1997 with the current name, reflecting the fact that we focus on all types of information and not only on information that can be stored in and retrieved from traditional database systems. The group has comprised several PhD, MS, and BS students collaborating in research and publishing papers in competitive international conferences and in journals. Over the years, the group has regularly sponsored the visit of several leading US and European researchers and of postdocs. Group Activities Send email to advis@cs.uic.edu, if you would like to receive email notices concerning group meetings and other ADVIS-related news. The group is led by Professor Isabel Cruz. There are several students, postdocs, and visitors involved in research. See available positions, if you would like to join the lab. Check the page on graduation rules for writing suggestions and deadlines. The group has been funded by the National Science Foundation, the Department of Defense, NATO, CRA, and corporate gifts. This system tightly integrates a visual query language for distributed queries with the layout specification that can emphasize the information semantics. We are continuing this work in several directions, including the use of ontologies to aid in query refinement, the integration of security concerns, and the creation of metadata for the synchronized retrieval and presentation of the information."
