full_description = "Undergraduate Student Resources links Heading link Copy link Forms CS forms CS Undergrad Petition COE general student petition Proposal for undergraduate research CS undergraduate TA application COE forms See the COE undergraduate resources page CS info CS info All CS course-related info CS student affairs calendar Academic calendar Advising page Code of conduct for the CS department Joint BS/MS in computer science Undergrad employee timesheet info Helpful links Helpful links Disability Resource Center Engineering Career Center REUs (Research Experiences for Undergraduates) UIC Counseling Center UIC Wellness Center resources Heading link Copy link ­ Academic advising CPT Students with disabilities Academic advising For advising information, visit the CS advising page. All UIC College of Engineering undergraduates are required to meet with an academic advisor before they are able to register for classes each semester. An “advising hold” will be placed on your account, which will not be removed until you have completed an advising meeting. In fall and spring, you will receive an email about signing up for an appointment. You should complete your appointment before registration becomes available in the 11th week of the semester. CPT Curricular Practical Training (CPT) is a work authorization that allows F-1 students to participate in academically required off-campus training, paid or unpaid, that is directly related to their major of study. International students should review the information on https://ois.uic.edu/immigration/f-1-student/f-1-curricular-practical-training/ for an overview on the process and OIS-requirements. Students wishing to pursue CPT are required to register and complete CS 391: Computer Science Practicum. To register, submit the following form (https://go.uic.edu/391-591-app). You must upload a copy of your offer letter, which should include the internship dates, pay, and description of your responsibilities. CPT must fall within the start and end dates of each semester (Summer 1 & 2 for Summer CPT). Upon completion, employers would be required to submit verification of completion. Students with disabilities UIC is committed to full inclusion and participation of people with disabilities in all aspects of university life. Students who face or anticipate disability-related barriers while at UIC should connect with the Disability Resource Center (DRC) on the web at drc.uic.edu, by email at drc@uic.edu, or by phone at (312) 413-2183 to create a plan for reasonable accommodations. In order to receive accommodations, students must disclose disability to the DRC, complete an interactive registration process with the DRC, and provide their course instructor with a Letter of Accommodation. Course instructors in receipt of a Letter of Accommodation will work with the student and the DRC to implement approved accommodations. Contact us Heading link Copy link By email Email us at cs-ugrad@uic.edu. In person Come see us in SEO 905. Arshad Narmawala Heading link Copy link “I knew I liked building things and solving problems, so engineering seemed like a good fit for me. On campus, I spend a lot of time in the CS Lounge. There are so many like-minded people in the same space helping one another out. It’s inspiring and motivating. Off campus, my favorite place in Chicago is Indian Boundary Park Pond. It’s a medium-sized pond that has turtles in it, and it’s a great spot to relax and forget about all your worries.” Arshad Narmawala | BS in Computer Science"
