full_description = "Open Positions tenure-track faculty Heading link Copy link Tenure-track faculty job information Tenure Track Faculty–Computer Science Requisition ID: 1028787 Posting Close Date: 03/06/2025 Position Summary: Located in the heart of Chicago, the UIC CS department anticipates hiring multiple tenure track faculty at all ranks starting from Fall 2025 (with preference to candidates at the Assistant and Associate Professor ranks). Candidates working in robotics and related areas are especially encouraged to apply. Exceptional candidates from all other areas of computer science who could complement and enhance current departmental strengths are also invited to apply. Outstanding candidates in all areas who could complement and enhance current department strengths will be considered. Candidates should have a PhD in computer science, computer engineering, or closely related fields, and the potential for excellence in teaching and research. Applications must be submitted online, and must include a one-page cover letter, curriculum vitae, teaching, research and diversity statements, and names and addresses of at least three references. Links to professional websites such as Google Scholar or Research Gate are recommended. Applicants may contact the faculty search committee for more information. For fullest consideration, applications must be submitted by January 20, 2025. Applications will be accepted until the positions are filled. The Department of Computer Science at UIC, which is expected to hire between 15 and 25 new faculty in the next five years, has 42 tenure-system faculty, five research faculty with strong and broad research agendas, and 17 clinical/teaching faculty. The department is committed to building a diverse faculty preeminent in its missions of research, teaching, and service to the community. Candidates who have experience engaging with a diverse range of faculty, staff, and students, and contributing to a climate of inclusivity are encouraged to discuss their perspectives on these subjects in their application materials. Construction of a new building housing the UIC Computer Science department is underway; the building is expected to open in calendar 2025. The building will include 80 faculty offices, 16,000 square feet of classroom space, 23 shared student offices, many collaborative learning and teaching spaces, and a geothermal farm to assist with sustainable heating and cooling. Duties & Responsibilities Teach Conduct Research Mentor Students Perform other related duties and participate in special projects as assigned. Qualifications Minimum Qualifications PhD in computer science, computer engineering, or a closely related field, and the potential for excellence in teaching and research. About the University of Illinois Chicago UIC is among the nation’s preeminent urban public research universities, a Carnegie RU/VH research institution, and the largest university in Chicago. UIC serves over 34,000 students, comprising one of the most diverse student bodies in the nation and is designated as a Minority Serving Institution (MSI), an Asian American and Native American Pacific Islander Serving Institution (AANAPSI) and a Hispanic Serving Institution (HSI). Through its 16 colleges, UIC produces nationally and internationally recognized multidisciplinary academic programs in concert with civic, corporate and community partners worldwide, including a full complement of health sciences colleges. By emphasizing cutting-edge and transformational research along with a commitment to the success of all students, UIC embodies the dynamic, vibrant and engaged urban university. Recent “Best Colleges” rankings published by U.S. News & World Report, found UIC climbed up in its rankings among top public schools in the nation and among all national universities. UIC has over 300,000 alumni, and is one of the largest employers in the city of Chicago. The University of Illinois Chicago offers a very competitive benefits portfolio. Click for a complete list of Employee Benefits. Salary Range The previously determined salary range for this position was $115,000 – $285,000. The pay offered to the selected candidate will be determined based on factors including (but not limited to) the experience and qualifications of the selected candidate including equivalent years in rank, training, and field or discipline; internal equity; and external market pay for comparable jobs. The University of Illinois System is an equal opportunity employer, including but not limited to disability and/or veteran status, and complies with all applicable state and federal employment mandates. Please visit Required Employment Notices and Posters to view our non-discrimination statement and find additional information about required background checks, sexual harassment/misconduct disclosures, and employment eligibility review through E-Verify. The university provides accommodations to applicants and employees. Request an Accommodation. Teaching-track faculty job information Teaching Track Faculty – Computer Science Position Summary Teaching faculty have a standard teaching load is three course sections per semester. Additionally, teaching faculty participate and often lead efforts in shared governance and committees, curriculum decisions and development, and computer science education at a local and national level. Duties & Responsibilities Teaching Perform other related duties and participate in special projects as assigned. Qualifications: Minimum Qualifications The Clinical Professor track is a long-term career track that starts with Clinical Assistant Professor and offers advancement to Clinical Associate and Clinical Full Professor. Minimum qualifications include a PhD in computer science or a closely related field. Teaching is the primary focus for clinical faculty, but there are also opportunities for research. The Lecturer track is a long-term career track that starts with Lecturer and offers opportunities for advancement to Senior Lecturer. Minimum qualifications include an MS in Computer Science and significant teaching experience. The department seeks candidates interested in all areas of computer science, but in particular systems and software engineering. Submit applications online. Include: – A curriculum vitae, – Contact information for at least three references, – Teaching evaluations for any courses taught, – One-page statement on your teaching philosophy and how it is inclusive to a diverse student population. For more information, send an email to mtheys@uic.edu. For fullest consideration please apply by December 1, 2024, however applications will continue to be reviewed through February 6, 2025. Applications will be accepted and reviewed until the positions are filled. The previously determined range for this position was $70,000 – $180,000. The pay offered to the selected candidate will be determined based on factors including (but not limited to) the experience and qualifications of the selected candidate including equivalent years in rank, training, and field or discipline; internal equity; and external market pay for comparable jobs. Requisition ID: 1028378 Posting Close Date: 02/06/2025 About the University of Illinois Chicago UIC is among the nation’s preeminent urban public research universities, a Carnegie RU/VH research institution, and the largest university in Chicago. UIC serves over 34,000 students, comprising one of the most diverse student bodies in the nation and is designated as a Minority Serving Institution (MSI), an Asian American and Native American Pacific Islander Serving Institution (AANAPSI) and a Hispanic Serving Institution (HSI). Through its 16 colleges, UIC produces nationally and internationally recognized multidisciplinary academic programs in concert with civic, corporate and community partners worldwide, including a full complement of health sciences colleges. By emphasizing cutting-edge and transformational research along with a commitment to the success of all students, UIC embodies the dynamic, vibrant and engaged urban university. Recent “Best Colleges” rankings published by U.S. News & World Report, found UIC climbed up in its rankings among top public schools in the nation and among all national universities. UIC has over 300,000 alumni, and is one of the largest employers in the city of Chicago. The University of Illinois System is an equal opportunity employer, including but not limited to disability and/or veteran status, and complies with all applicable state and federal employment mandates. Please visit Required Employment Notices and Posters to view our non-discrimination statement and find additional information about required background checks, sexual harassment/misconduct disclosures, and employment eligibility review through E-Verify. The university provides accommodations to applicants and employees. Request an Accommodation Academic professionals job information There are no open positions available at this time. Working in Chicago and at UIC Computer Science Heading link Copy link The Department of Computer Science at UIC has been on a trajectory of rapid expansion for almost a decade, and its faculty now number more than 80. The department is committed to building a diverse faculty preeminent in its missions of research, teaching, and service to the community. Candidates who have experience engaging with a diverse range of faculty, staff, and students, and contributing to a climate of inclusivity are encouraged to discuss their perspectives on these subjects in their application materials. UIC is a major public research university (Carnegie R1) with about 3,000 faculty and more than 34,000 students. It is ranked in the national top 20 by U.S. News & World Report for diversity, and it ranks No. 8 in the Wall Street Journal/Times Higher Education list of best value institutions. This is a recognition given to universities that provide an excellent education compared with net cost. UIC also is a Hispanic-Serving Institution. Chicago epitomizes the modern, livable, vibrant, and diverse city. World-class amenities such as the lakefront, arts and culture venues, festivals, and two international airports make Chicago a singularly enjoyable place to live with an affordable cost of living, whether in an 88th-floor condominium downtown or on a tree-lined street in one of the nation’s finest school districts. The birthplace of the modern skyscraper, Chicago boasts one of the world’s tallest and most iconic skylines, an 8,100-acre park system, and extensive public transit and biking networks. UIC is committed to increasing access to education, employment, programs and services for all. The University of Illinois is an Equal Opportunity, Affirmative Action employer. Minorities, women, veterans, and individuals with disabilities are encouraged to apply. UIC is committed to supporting the success of dual-career couples. The University of Illinois conducts background checks on all job candidates upon acceptance of contingent offer of employment. Background checks will be performed in compliance with the Fair Credit Reporting Act."
