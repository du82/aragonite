full_description = "Lectures and Seminars Upcoming Events Heading link Copy link Distinguished Lecture Series Heading link Copy link The Department of Computer Science holds an annual series of talks featuring distinguished scientists from across the country. Renowned experts in their fields, these speakers provide an opportunity for faculty and students to keep abreast of some of the latest developments in the ever-evolving landscape that defines the discipline. These lectures are mostly concentrated in the fall semester to allow adequate time for other faculty activities in the spring term. 2024-2025 2024-2025 Ellen Zegura Georgia Tech University Responsible Computing Lorrie Faith Cranor Carnegie Mellon University Designing Usable and Useful Privacy Interfaces Dan Suciu University of Washington Cardinality Estimation: Achilles’ Heel of Query Optimizers 2022-2023 2022-2023 Avrim Blum Toyota Technological Institute at Chicago On learning in the presence of biased data and strategic behavior Kristina Lerman University of Southern California Bias and Emergent Instabilities in Socially-embedded Algorithms Pankaj Agarwal Duke University Learnability of Selectivity Functions Jack Dongarra University of Tennessee An Overview of High Performance Computing and Future Requirements Arun Venkataramani University of Massachusetts at Amherst On the Importance of Logical Centralization in Network Architecture Rakesh Vohra University of Pennsylvania Will AI and ML make Economics Obsolete? 2020-2021 2020-2021 Andreas Podelski University of Freiburg Software Model Checking 2019-2020 1 Rada Mihalcea University of Michigan When the Computers Spot the Lie (and People Don’t) Anna Karlin University of Washington Towards an improved approximation algorithm for the Traveling Salesperson Problem Anders Ynnerman Linkopping University, Sweden Visual Science Communication: From the Inside of Mummies to Planets, Stars, and Galaxies Shriram Krishmanurthi Brown University The Role of Computer Sci