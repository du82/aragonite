["https://cs.uic.edu/profiles/chris-kanich"]
title = "Kanich, Chris  | Computer Science | University of Illinois Chicago"
full_description = "Chris Kanich Associate Professor Director of Undergraduate Studies Department of Computer Science Contact Building & Room: 908 SEO Address: 851 S. Morgan St, MC 152, Chicago, IL, 60607 Office Phone: 312.355.0950 Email: ckanich@uic.edu Related Sites: Main site Google Scholar Twitter TikTok YouTube About Chris Kanich joined the Computer Science department as faculty in 2012, and is currently an Associate Professor and Director of Undergraduate Studies. His research focuses on sociotechnical cybersecurity as well as algorithmic fairness, and has received over $5.5 million of government and private support. He is a recipient of the NSF CAREER award along with several research, teaching, and advising awards here at UIC. He has also served as a commissioner for the Chicago Advisory Redistricting Commission, on the board of the educational nonprofit Project:VISION, and is an active science communicator on YouTube and TikTok. Education Ph.D., University of California, San Diego, 2012 Professional Memberships Program Committee, IEEE Symposium on Security and Privacy: 2015, 2016, 2019 Program Committee, eCrime Symposium: 2016, 2017, 2018 Program Committee, ConPro: 2018 Program Committee, NDSS: 2014, 2018 Program Committee, ACSAC: 2013, 2017 Program Committee, USENIX Security: 2014, 2017 Program Committee, WEIS: 2017 Program Committee, LASER Workshop: 2016 Program Committee, WWW Conference: 2016 Program Committee, ACM CCS: 2015, 2016 Area Editor, ACM SIGCAS Computers and Society newsletter: 2015-present Program Committee, RAID Symposium: 2015 Program Co-Chair, CSET: 2013, 2014 Program Committee, DIMVA Conference: 2014 Publicity Chair, IEEE Security & Privacy Workshops: 2014 Program Committee, HotCloud: 2013 Program Committee, CSET: 2012 Research Currently in Progress Cloudsweeper allows users to audit, encrypt, and redact sensitive information within cloud storage accounts. This project helps us better understand the role of cleartext password emailing, the underground value of stolen accounts, and new ways to improve the security of sensitive, globally accessible information. The CRISP project is building a new web front end language and paradigm to enable rich document publishing while providing greatly increased privacy and security over traditional HTML/JS/CSS based sites. Our Harm Measurement research effort aims to characterize and quantify the damage experienced by victims of cybercrime."
