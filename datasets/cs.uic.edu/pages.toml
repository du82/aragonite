full_description = "Computer Design Research and Learning Center introduction Heading link Copy link Jim Young The CDLRC building under construction (September 2023) Starting in 2025, UIC students will learn computer science, data science, and engineering in a brand-new facility called the Computer, Design, Research, and Learning Center (CDRLC). UIC’s computer science department now enrolls about 2,100 undergraduates. The department’s faculty, staff, and classes are presently spread across four buildings on the east campus. The new 135,000-square-foot, LEED Gold-certified building will double the department’s capacity. It will include: 16,000 square feet of classroom space Undergraduate learning and community center Dry lab Robotics lab Flexible events space 21 faculty research labs Collaborative learning and teaching spaces A geothermal farm to assist with sustainable heating and cooling The new computer science building is part of UIC’s campus master plan and supported by the Rebuild Illinois capital plan, including a $117.8 million allocation from the University of Illinois Board of Trustees. It will be located at 850 W. Taylor Street, adjacent to the Memorial Grove. A ceremonial groundbreaking was held on July 15, 2021, and the building will open in 2024. Overhead view Heading link Copy link How's construction coming along? Heading link Copy link Take a look at the construction site’s webcam to find out. Open the webcam page Additional renderings Heading link Copy link Go to slide 1 Go to slide 2 Go to slide 3 Go to slide 4 Go to slide 5 Go to slide 6 Go to the next slide Go to the previous slide All renderings in this slide show courtesy of Booth Hansen Go to the next slide Go to the previous slide Go to the next slide Go to the previous slide Go to the next slide Go to the previous slide Go to the next slide Go to the previous slide Go to the next slide Go to the previous slide Go to slide 1 Go to slide 2 Go to slide 3 Go to slide 4 Go to slide 5 Go to slide 6