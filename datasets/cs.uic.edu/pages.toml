full_description = "Cryptographic tools researcher joins CS department faculty Andrea Poet | Posted on September 13, 2023 Cryptographic tools researcher joins CS department faculty Heading link Copy link Anrin Chakraborti joined the computer science department this fall as an assistant professor. He is a security researcher, building systems that use cryptographic tools to solve real-world problems such as protecting data from theft or alteration, and detecting third party intrusions Chakraborti earned his doctoral degree in computer science from Stony Brook University, and his undergraduate degree from Jadavpur University in Kolkata, India, also in computer science. Most recently, he was a postdoctoral researcher at Duke University. Chakraborti said he is excited about his fellow faculty members at UIC. “Computer science is such a collaborative research field,” Chakraborti said. “It’s good to be in a department where there are a lot of active researchers and collaborations are possible.” Chakraborti’s research lies at the intersection of cryptography, systems, and theory. He is focused on scaling cryptographic tools to handle new data types and computations in cloud computing and big data; optimizing cryptographic protocols to enable reliable and private communications between cyber-physical systems; and making private end-to-end communication and storage truly private: considering privacy laws, censorship, coercion, and backdoors. This fall, Charkraborti is teaching CS 488, Introduction to Cryptography. “I’m very excited to help students in their academic careers,” Chakrborti said."
