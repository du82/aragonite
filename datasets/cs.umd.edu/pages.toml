["https://cs.umd.edu/job/2024/1p0000-lecturer-immersive-media-design-program"]
title = "Lecturer - Immersive Media Design Program | UMD Department of Computer Science"
description = "The Computer Science Department and Immersive Media Design Program are seeking to fill a full-time Professional Track Faculty (PTK) position to teach undergraduate Immersive Media Design (IMDM) and Computer Science (CMSC) courses for the newly established Immersive Media Design Major. A successful candidate for this position should have an established record of excellent teaching in areas of creative digital media content creation as well as technical computer science."
full_description = "View details and apply on UMD's eJobs websitePosition Number: 1P0000The Computer Science Department and Immersive Media Design Program are seeking to fill a full-time Professional Track Faculty (PTK) position to teach undergraduate Immersive Media Design (IMDM) and Computer Science (CMSC) courses for the newly established Immersive Media Design Major. A successful candidate for this position should have an established record of excellent teaching in areas of creative digital media content creation as well as technical computer science. The educational objective of the program is to provide students with a solid foundation in emerging technologies in interactive, immersive digital media such as virtual reality, augmented reality, mixed reality, large scale projection, and installations. Successful applicants are expected to teach and mentor undergraduate students, as well as provide leadership and service to support the IMD major. Other expectations for the position will be to conduct professional activities to maintain currency in immersive media, including personal design work or research, and conducting research involving undergraduate students. The home department for this position will be the highly ranked University of Maryland Department of Computer Science, with assignment to the Immersive Media program for teaching and service. Faculty in the Immersive Media Design program have access to advanced labs for immersive media content production and support to pursue their own scholarship. The Immersive Media Design program (https://imd.umd.edu) is a nationally unique collaboration between the Department of Computer Science, and the Department of Art, to graduate students who can master and blend the artistic and technical. Candidates should upload a CV, a statement of teaching philosophy, a list of references, a listing of recently taught courses and evidence of teaching effectiveness (e.g., teaching evaluations, teaching awards) uploaded as supplemental document 1, and a cover letter highlighting the specific strengths of the candidate with respect to this position. For best consideration, applicants are encouraged to apply by November 14, 2024. However, the position will remain open until filled. Anticipated start date may be January 2025 or August 2025. For any information or questions, please email imd-instructor-search [-at-] cs [dot] umd [dot] edu. Responsibilities During each fall and spring semester, we anticipate that the lecturer will teach at most three sections in computer science or immersive media. The lecturer may also decide to participate in lower level course curriculum development or become involved in the department’s vibrant research community via research grants and advising. Opportunities for summer and winter teaching for additional pay will also be available. Education MS, PhD or terminal degree in Computer Science or related discipline required. Experience Experience in immersive media design and teaching. Preferences Ph.D. in Computer Science or related STEM field, and/or a terminal degree or M.F.A. in an artistic discipline. Experience and interest in teaching a senior capstone course, which will involve working with computer science faculty to place students in research activities. Applicants with additional demonstrable expertise and scholarship in areas of immersive media including as listed previously receive special consideration."
