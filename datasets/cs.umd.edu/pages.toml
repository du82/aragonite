description = "Search by name"
full_description = 'Dr. Cunxi Yu is an Assistant Professor in the ECE Department at the University of Maryland, College Park. His research interests focus on novel algorithms, systems, and hardware designs for computing and security. Before joining University of Maryland, Cunxi was Assistant Professor at University of Utah, and held PostDoc positions at Cornell University and EPFL. He received Ph.D. degree from UMass Amherst in 2017. His work received the Best Paper Award at DAC (2023), best paper nominations at ASP-DAC (2017), TCAD (2018), and 1st place at DAC HackDAC (2017), NSF CAREER Award (2021), and American Physical Society DLS poster award (2022). He served as Organizing Committee in IWLS, ICCD, VLSI-SoC, ASAP, as a TPC member in ICCAD, DATE, ASP-DAC, DAC, and panelist/reviewer for several funding agencies. Department of Computer ScienceBrendan Iribe Center for Computer Science and EngineeringUniversity of Maryland8125 Paint Branch Drive College Park, MD 20742main phone: (301) 405-2662 <br /> <div class="um-brand"> <div id="logo"><a href="http://www.umd.edu" target="_blank">University of Maryland</a></div> </div> <p></p>'
