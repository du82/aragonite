title = "Industry Partners | UMD Department of Computer Science"
full_description = "At the heart of any thriving academic institution is partnerships. These vital collaborations spark innovation, advance education, and strengthen both regional and national workforce capabilities. At the University of Maryland, we continue to grow our industry partners as they relate to computing. We rely heavily on the experience, internship opportunities and other resources that our partners can provide as we fulfill our mission of educating the next generation of computing specialists and making new scientific discoveries that have an impact on our lives. We’d like to thank all of our industry partners for the support they provide. If you’re in industry and want to know how you can get involved, including participating in our Career Fairs, please contact us: Maria D. JohnsonDirector of Corporate Partnership DevelopmentDepartment of Computer Science and University of Maryland Institute for Advanced Computer Studies (UMIACS)2128 Brendan Iribe Center for Computer Science and EngineeringUniversity of Maryland8125 Paint Branch Dr.College Park, MD 20742301-405-7990mjohns40 [-at-] umd [dot] edu The Corporate Partners in Computing Program (CPIC) fosters close working relationships between the Department of Computer Science and industry leaders. CPIC offers exclusive opportunities for collaboration in research, education, and undergraduate and graduate student development. Partners benefit with invitations to special events, research previews, student recruitment opportunities, and corporate recognition. We are grateful for industry financial support for research with our faculty and postdoctoral scholars, gifts-in-kind of hardware or software, visits, and talks on campus by industry leaders, and more. Research supporters gain access to fearless ideas in education, innovation, and entrepreneurship by interacting with our faculty and students. Department of Computer ScienceBrendan Iribe Center for Computer Science and EngineeringUniversity of Maryland8125 Paint Branch Drive College Park, MD 20742main phone: (301) 405-2662"
