["https://cs.umd.edu/community/cspathways"]
title = "CS Pathways: Preparing students for Computer Science @ UMD | UMD Department of Computer Science"
full_description = "The University of Maryland and its Department of Computer Science are enriched by the skills and knowledge that transfer students bring with them to their education here. That also holds true for high school students coming with advanced credit. To facilitate the transfer of credit to UMD, the Department works with community college and high school instructors, advisors and administrators on the best processes to assist students. We have collected here information on how students may be best prepared for the transition from their institutions to the Computer Science major at College Park, and we welcome contacts and questions. Please direct those to Monica Hilliard (monicah [-at-] umd [dot] edu). Transfer Credit Services Transfer Credit Services is a unit within the Office of the Registrar at UMD. This unit provides information about general campus policies and procedures for transferring credit to UMD, either from another accredited institute of higher education or from prior learning credits from high school advanced placement or other mechanism. https://transfercredit.umd.edu/index.html Transfer Applicant Requirements More information on Transfer Applicant Requirements is listed by Admissions at the following link. Note that under the Maryland Transfer Advantage Program for community college students taking UMD courses, a new policy requires them to take these courses in Summer/Winter, rather than Fall/Spring, starting in AY2019-2020. https://admissions.umd.edu/apply/admission-requirements/transfer-applicant-requirements Transfer and Prior Learning Credits More specific information about transfer and prior learning credits for computer science is listed on the general computer science web page for prospective students. https://undergrad.cs.umd.edu/future https://undergrad.cs.umd.edu/transfer-students Limited Enrollment Program Starting Fall 2019 Computer Science will become a limited enrollment program (LEP), and the following page has an FAQ on the LEP: https://undergrad.cs.umd.edu/degree-requirements-cs-major#lep-benchmarks Additional information can be found at: https://lep.umd.edu/."
