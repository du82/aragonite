["https://cs.umd.edu/community/partner/sandia-national-laboratories"]
title = "Careers – Find your next job"
description = "How will you impact the world around you? Start your career Join Our Talent Community Access Existing Account/Create New Account in PeopleSoft Why Sandia? Your work can contribute to the security, peace and freedom of our nation and the world! Sandia provides systems, science, and technology to m..."
full_description = "How will you impact the world around you? Start your career Join Our Talent Community Students & Postdocs (Link opens in a new tab)Explore Opportunities Veterans (Link opens in a new tab)Explore Opportunities Career Areas View All Jobs Aerospace Engineering Bioscience Business Support & Operations Chemistry & Chemical Engineering Computer Science Cybersecurity Electrical Engineering Geoscience Materials Science Mechanical Engineering Nuclear Engineering Physics Skilled Trades Systems Engineering Sandia's Career Portal (Link opens in a new tab)View all Sandia Openings Access Existing Account/Create New Account in PeopleSoft Why Sandia? Your work can contribute to the security, peace and freedom of our nation and the world! Sandia provides systems, science, and technology to meet national security objectives in such areas as cybersecurity, science and technology products, and integrated military systems. In keeping with our vision to be the nation’s premier science and engineering laboratory for national security and technology innovation, we recruit the best and the brightest, equip them with world-class research tools and facilities, and provide opportunities to collaborate with technical experts from many different scientific disciplines. The work you do will be challenging, and amazing with real-world impact Sandia nuclear engineer Sal Rodriguez has been working for years to prove that adding dimples to things like rockets, wind turbines, cars, even heaters, makes them more efficient. Together with the University of New Mexico and graduate student Graham Monroe, Sal’s research is propelling the future of aerospace by infusing rocket science with a touch of golf ball magic, uncovering a groundbreaking aerodynamic revelation with the potential to accelerate space exploration. Check out the many ways Sandia has changed the Nation Work with extraordinary people – the top minds in their field! Learn from top scientists, engineers and business professionals here at Sandia. In fact, did you know cleanroom inventor, Willis Whitfield, worked at Sandia? Many of the innovations that are used globally derived from stellar Sandians. Perhaps you could be next. Meet some of our people A playground of state-of-the-art tools & facilities You will have access to some of the best tools, equipment, and research facilities in the world. Many of Sandia’s unique research centers attract experts from industry and academia, who apply Sandia’s resources to further their investigations Take a tour of our facilities Work-life balance does exist You will experience a balance between your work life and personal life through flexible work arrangements, convenient on-site amenities, family services and activities, and array of health and wellness programs. Want to do a group exercise for lunch? Want to have every other Friday off? Check out Sandia’s perks Pursue something new with career mobility You can have a full-life career at Sandia by working across multiple projects and areas of your interest. Because Sandia is a multi-faceted laboratory, many employees create rich career paths that span multiple areas. Put simply, employees enjoy career mobility without leaving the company. We succeed when you succeed Dr. Sal Rodriguez Hispanic Engineer National Achievement Awards Conference – 2023 Scientist of the Year Great Minds in STEM, which recognizes America’s top engineers and scientists from the Hispanic community, honored Dr. Sal Rodriguez as Scientist of the Year at its annual Hispanic Engineer National Achievement Awards Conference. It’s a first for a Sandia employee. Scientist of the Year and Engineer of the Year are the highest of the conference’s honors, reserved for individuals who model excellence and leadership, making profound contributions to industries, STEM fields, communities and the nation. Read more 2024 Black Engineer of the Year Awards (BEYA) Five Sandia National Laboratories engineers recently were awarded with Black Engineer of the Year Awards. The awards, recognizing outstanding achievements in engineering, science and technology, include Science Spectrum Trailblazer, Modern Day Technology Leader, Most Promising Engineer in Industry and the Senior Investigator Award. Each Sandia award winner has made significant contributions in creative, innovative and science-based systems engineering solutions to help solve our nation’s most challenging national security problems. Read more Ali Pinar 2023 Fellow of the Society of Industrial and Applied Mathematics (SIAM) Ali Pinar was selected by the Society of Industrial and Applied Mathematics as a 2023 Fellow in recognition of his passion for and leadership in the area of computing network research. The organization named him a Fellow “for theoretical, algorithmic, and application impacts, and community leadership in combinatorial scientific computing and network science.” Read more Stan Atcitty 2023 Fellow of the Institute of Electrical and Electronics Engineer Sandia Senior Scientist Stan Atcitty has been named a Fellow of the Institute of Electrical and Electronics Engineers (IEEE), one of the world’s largest technical professional organizations. Atcitty’s research focuses on power electronics needed to integrate energy storage and distributed generation with the electric utility grid. Six of his projects have won R&D 100 awards and one Gold Green Energy award from Research & Development magazine. Read more Hongyou Fan 2023 Fellow of the American Chemical Society Researcher and manager Hongyou Fan has been named a fellow of the American Chemical Society. The society recognized Fan “for outstanding contributions to the novel design, synthesis, functionalization and integration of nanomaterials leading to innovative applications in nanoelectronics, clean energy, sensor development and photocatalysis.” It also recognized him “for impactful service in organizing ACS symposia, promoting the Division of Colloid and Surface Chemistry, STEM outreach events, ACS journal publications and the ACS Petroleum Research Fund program.”Read more Society of Women Engineers (SWE) Awards three Sandians The Society of Women Engineers has bestowed awards on three Sandia employees. Senior scientist Tina Nenoff received the society’s highest honor, the Achievement Award, chemical engineer Yuliya Preger received a Rising Technical Contributor Award and Nedra Bonal received a Patent Recognition Award. Read more about their achievements Two Sandians honored with 2024 Women in Tech Award Mary Monson, senior manager ofTechnology Partnerships and Business Development, and Mara Schindelholz, principal research and development staff member at Sandia National Laboratories have been honored with the 2024 New Mexico Women in Tech Award from the New Mexico Technology Council. The award recognizes remarkable women who drive innovation and excellence in their tech field and inspire and empower others to pursue careers in the tech industry.. Read more Tina Nenoff and Babu Chalamala Two Sandia National Laboratories researchers, Tina Nenoff and Babu Chalamala, have been elected as members of the prestigious National Academy of Engineering. They are among the 114 new members and 21 international members to be inducted as the class of 2024. Their election to the NAE, one of the highest honors in the engineering community, recognizes their significant contributions to engineering theory and practice, as well as their pioneering work in advancing technology. Read more about their achievements Society of Asian Scientists and Engineers recognizes top talent Sandia National Laboratories scientists Patrick Feng and Thushara Gunda recently were honored with national achievement awards by the Society of Asian Scientists and Engineers. The awards recognize recipients’ leadership and accomplishments in science, technology, engineering and mathematics. Read more Society of Hispanic Professional Engineers spotlights Anthony Louis Garcia Sandia National Laboratories Engineer, Tony Garcia, received the prestigious 2023 Society of Hispanic Professional Engineers STAR of Today award for his technical achievement. The STAR awards recognize individuals in STEM who are not only excelling in their fields but also making a significant impact through their work, research and community outreach. Read more Heather Spalding Careers and the disABLED – 2022 Employee of the Year Heather Spalding, a Labs business lead, was named Employee of the Year by CAREERS & the disABLED magazine, recognized for her advocacy efforts, professional accomplishments and community outreach. Heather is a mentor for Big Brothers Big Sisters of Central New Mexico and works with Albuquerque’s homeless population. Read more Locations New Mexico & California Sandia’s primary sites are located in Albuquerque, New Mexico and Livermore, California. The majority of our employees work at these two sites, but Sandia has various other sites in the United States. Our two primary facilities offer exceptional places to live and work. In Albuquerque you can enjoy low cost of living, stunning landscapes, outdoor activities, and excellent weather. Livermore Valley is nestled in a rich wine-growing region with proximity to the San Francisco Bay Area. It has a relaxed lifestyle where sports fans, wine connoisseurs, outdoor enthusiasts, and art lovers will all find more than enough to see and do. View Locations Check out where we’ll be next! Recruiting We recruit at some of the best colleges, universities, and conferences, looking for talented individuals to join our workforce. See where we’ll be next! View Events Calendar Social Media Sandia operates official accounts on several social media networks as a means to engage in conversations about our work, update followers about the latest Labs news, and share employment opportunities. Recent Awards All qualified applicants will receive consideration for employment without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, age, disability, or veteran status and any other protected class under state or federal law. Sandia invites you to review the Equal Employment Opportunity posters which include EEO is the Law, EEO is the Law Poster Supplement, and Pay Transparency Nondiscrimination Provision. Sandia is a drug-free workplace. As a national laboratory funded by a U.S. government agency, we are subject to federal laws regarding illegal drug use. Illegal use of a controlled substance, including marijuana even in places where it does not violate state law, may impact your ability to obtain and/or maintain a Department of Energy security clearance, and may result in the withdrawal of an employment offer or termination of employment. Sandia is committed to Equal Employment Opportunity and providing reasonable accommodation in its application process for qualified individuals with disabilities. If you have difficulty using our online system due to a disability and need special assistance or accommodation, please send an email with your request to the Job Accommodation Specialist: trsanch@sandia.gov. Determinations on requests for reasonable accommodation are made on a case-by-case basis. var sidemenuInit = (function() { document.addEventListener('DOMContentLoaded', function() { var sidemenuEl = document.querySelector('etui-tpl-default'); var menuLinks = []; if( sidemenuEl ){ if( menuLinks && menuLinks.length ){ sidemenuEl.sideNavLinks = menuLinks; } else { sidemenuEl.sideNavLinks = false; } } }); }());"
