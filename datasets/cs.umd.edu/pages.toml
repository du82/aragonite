["https://cs.umd.edu/job/2024/1p0000-lecturersenior-lecturerprincipal-lecturer-0"]
title = "Lecturer/Senior Lecturer/Principal Lecturer | UMD Department of Computer Science"
description = "The Department of Computer Science is looking to hire multiple instructional faculty members, at the rank of Lecturers, Senior Lecturers, or Principal Lecturers, who will work with our bright and amazing students and play a key role in teaching our core Computer Science curriculum."
full_description = "View details and apply on UMD's eJobs websitePosition Number: 1P0000The Department of Computer Science is looking to hire multiple instructional faculty members, at the rank of Lecturers, Senior Lecturers, or Principal Lecturers, who will work with our bright and amazing students and play a key role in teaching our core Computer Science curriculum. We seek candidates at all experience levels to join our vibrant department. The Department of Computer Science is committed to building a diverse faculty pre-eminent in its mission of research, teaching, and service to the community, and it especially encourages applications from women and other underrepresented groups in computing. In addition, candidates who have experience engaging with a diverse range of faculty, staff, and students and contributing to a climate of inclusivity are encouraged to discuss their perspectives on these subjects in their application materials. The Department of Computer Science is top-ranked for research and teaching, with its undergraduate computer science program ranked 9th among public universities by U.S. News & World Report. The undergraduate program currently educates over 3,700 diverse students from around the world. The graduate program ranks 17th in the nation, with over 400 graduate students enrolled. The Department has more than 60 tenure-track faculty and 20 instructional faculty members, many of whom have been recognized with memberships in the National Academy of Engineering, fellowships in professional scientific organizations including ACM and IEEE, NSF Faculty Early Career Development awards and Sloan Fellowships. It is home to the Iribe Initiative for Inclusion and Diversity in Computing (https://inclusion.cs.umd.edu/), whose programs have been funded by more than $4 million in grants and gifts, and it is located in the state-of-the-art Brendan Iribe Center for Computer Science and Engineering (https://iribe.umd.edu/). Additional information about the Department is available at https://www.cs.umd.edu. UMD is committed to fostering a diverse, inclusive, and family-friendly community through programs such as TerrapinSTRONG (https://terrapinstrong.umd.edu/) focusing on building an inclusive community. Interested candidates should apply on-line at https://ejobs.umd.edu in order to receive consideration. Applicants are strongly encouraged to have complete versions of their materials – including a CV, a statement of teaching philosophy, a list of references, a listing of recently taught courses and evidence of teaching effectiveness (e.g., teaching evaluations, teaching awards) uploaded as Supplemental Document 1, and a cover letter highlighting the specific strengths of the candidate with respect to this position – uploaded by December 20, 2024. For any information or questions please email instructor-search [-at-] cs [dot] umd [dot] edu. Responsibilities During each fall and spring semester, the Lecturer will teach at most three sections in our core Computer Science curriculum, including introductory and advanced programming, computer systems, computer algorithms, and other topics. The Lecturer will also participate in non-teaching activities, such as the development/enhancement of curriculum, research, advising, and mentoring. Opportunities for summer and winter teaching for additional pay will also be available. Education An M.S. degree is required, and either the B.S. or M.S. degree must be in Computer Science or a related field such as Information Science or Data Science. Knowledge, Skills, and Abilities In-depth knowledge of and proficiency teaching Python, Java, and Linux/Unix is a must. Preferences Knowledge of additional languages such as Ruby, functional languages such as Haskell or OCaml, and Web programming languages such as Javascript. A solid basis in theoretical computer science as well as probability and statistics. Candidates with a PhD and a willingness to teach advanced upper-level courses in the candidate’s area of specialization."
