full_description = "The Department of Computer Science at the University of Maryland has, over its storied history, evolved into a beacon of innovation, research and excellence. This journey, while shaped by breakthroughs, curriculum developments and global impacts, has been fundamentally anchored by the unwavering commitment and contributions of certain individuals. These visionaries, through their dedication, leadership and relentless pursuit of knowledge, have not only elevated the stature of our department but have also left a permanent mark on the world of computer science. We take immense pride in introducing the 'Pillars of Computer Science'—a recognition reserved for those whose influence and endeavors have been instrumental in molding the legacy of the department. These individuals, with their profound contributions, have not only fortified the foundations of our academic institution but have also paved the path for the leaders of tomorrow. Inductees Victor BasiliProfesor EmeritusFormer Department Chair, 1982-1988 Larry DavisProfesor Emeritus, College Park ProfessorFormer Department Chair, 1999-2012 Samir KhullerProfessor Emeritus, Distinguished Scholar TeacherFormer Department Chair, 2012-2017 Jack Minker (1927-2021)Professor EmeritusFounding Department Chair, 1974-1979 Satish TripathiPresident, University at BuffaloFormer Department Chair, 1988-1995"
