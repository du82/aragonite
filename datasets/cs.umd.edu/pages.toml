["https://cs.umd.edu/article/2025/02/cs-phd-student-jiasheng-li-receives-2024-hcil-maryland-way-award-research-excellence"]
title = "CS Ph.D. Student Jiasheng Li Receives 2024 HCIL Maryland Way Award for Research Excellence | UMD Department of Computer Science"
description = "Jiasheng Li, a Ph.D. student in the University of Maryland’s Department of Computer Science, has been awarded the 2024 HCIL Maryland Way Award for Research Excellence. Li received the award for his contributions to accessible user interface design and his research on multimodal interaction techniques. The award, presented annually by the Human-Computer Interaction Lab (HCIL), is the highest honor the lab gives and includes a cash prize.The Maryland Way Award for Research Excellence is given annually to a researcher whose work significantly contributes to Human-Computer Interaction (HCI)."
full_description = 'Jiasheng Li, a Ph.D. student in the University of Maryland’s Department of Computer Science, has been awarded the 2024 HCIL Maryland Way Award for Research Excellence. Li received the award for his contributions to accessible user interface design and his research on multimodal interaction techniques. The award, presented annually by the Human-Computer Interaction Lab (HCIL), is the highest honor the lab gives and includes a cash prize. The Maryland Way Award for Research Excellence is given annually to a researcher whose work significantly contributes to Human-Computer Interaction (HCI). The award recognizes contributions that advance knowledge in the field, improve accessibility or introduce new methodologies for user interface design and evaluation. “This award is an acknowledgment of my research and the importance of accessibility in design,” Li said. “I appreciate the support from my advisor, peers and collaborators who have contributed to this work.” Advised by Assistant Professor of Computer Science Huaishu Peng, Li’s research focuses on accessibility, interactive user interface design and embodied artificial intelligence. His work aims to create more inclusive environments by designing accessible interfaces and developing systems that use multimodal interaction techniques and artificial intelligence. "Jiasheng is an excellent Ph.D. student who selects significant, high-impact research problems, works diligently with clear short- and long-term goals, and actively seeks to make his research accessible to a broader audience," Peng said. "His dedication to accessibility and user-centered design reflects the core values of the HCI community." Li has worked on multiple projects that address accessibility challenges for blind individuals, particularly in navigating touchscreen devices in public spaces. His project, Toucha11y, is a personal robot designed to enable blind users to operate touchscreen devices without built-in accessibility features. The system provides greater independence and access to essential digital services by eliminating technical barriers.'
