["https://cs.umd.edu/article/2025/02/umd-organizes-35th-annual-high-school-programming-contest"]
title = "UMD Organizes 35th Annual High School Programming Contest | UMD Department of Computer Science"
description = "The University of Maryland’s Department of Computer Science welcomed high school students across the Washington, D.C., area on Saturday, February 8, 2025, for the 35th Annual High School Programming Contest (HSPC) at the Brendan Iribe Center for Computer Science and Engineering.120 students from 28 high schools participated in the three-hour programming competition. Each school was permitted to send one team of four students, who worked together to solve algorithmic and programming challenges under a time constraint."
full_description = "The first-place team from Thomas Jefferson High School in Alexandria, Va., poses for a photo at the Brendan Iribe Center in College Park, Md., on Feb. 8, 2025. The University of Maryland’s Department of Computer Science welcomed high school students across the Washington, D.C., area on Saturday, February 8, 2025, for the 35th Annual High School Programming Contest (HSPC) at the Brendan Iribe Center for Computer Science and Engineering. 120 students from 28 high schools participated in the three-hour programming competition. Each school was permitted to send one team of four students, who worked together to solve algorithmic and programming challenges under a time constraint. Teams were evaluated based on the correctness of their solutions, with submission speed serving as a tiebreaker. This year’s challenges were coordinated by the Department of Computer Science IT unit and designed and judged by a team led by Computer Science Assistant Professor Laxman Dhulipala, the contest’s director. HSPC organizers worked behind the scenes to ensure a smooth and engaging competition. They created a set of challenges designed to test problem-solving skills at various levels. Dhulipala highlighted the collaborative effort behind the event and its significance for participants. “I hope students at all stages of development in their computer science careers enjoyed the problems we set for them,” Dhulipala said. “The problems were assembled by a diverse group, including faculty members and undergraduates at UMD, as well as one student who previously participated in the contest and has now returned to help run it.” The event kicked off with a morning practice session, giving teams the opportunity to familiarize themselves with the competition format. This was followed by a three-hour contest that challenged participants to apply algorithmic thinking and debugging skills, mirroring real-world problem-solving scenarios in computer science. Stephen Zhang, a Montgomery Blair High School senior, emphasized the importance of teamwork in programming competitions."
year_published = 2025
year_updated = 2025
