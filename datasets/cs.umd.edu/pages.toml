["https://cs.umd.edu/article/2025/02/umd-students-pitch-startup-ideas-pitch-perfect-event%C2%A0%C2%A0"]
title = "UMD Students Pitch Startup Ideas at Pitch Perfect Event   | UMD Department of Computer Science"
description = "Pitching startup ideas to a panel of experienced entrepreneurs has become a familiar format popularized by television shows like Shark Tank. At the University of Maryland’s Capital One Tech Incubator, six student entrepreneurs took part in a similar high-stakes experience during the Pitch Perfect event, where they presented their business concepts to a panel of seasoned mentors."
full_description = 'Yonatan Tussa, a junior computer science major, pitches his startup, SONE, at the Capital One Tech Incubator in College Park, Maryland, on Friday, Feb. 7, 2025. Pitching startup ideas to a panel of experienced entrepreneurs has become a familiar format popularized by television shows like Shark Tank. At the University of Maryland’s Capital One Tech Incubator, six student entrepreneurs took part in a similar high-stakes experience during the Pitch Perfect event, where they presented their business concepts to a panel of seasoned mentors. Organized by the Mokhtarzada Hatchery program and Startup Shell, the event allowed students to refine their business concepts, gain industry insights and connect with professionals and peers in the startup ecosystem. Participants pitched ideas spanning various sectors, including health, sustainable energy to real estate. Judges included Mokhtarzada Hatchery mentors Haroon Mokhtarzada (B.A. ’01, economics) and Zeki Mokhtarzada (B.S. ’01, computer science), as well as Arthur AI Founder and CEO Adam Wenchel (B.S. ’99, computer science). The panelists provided feedback and guidance, drawing on their experience leading multimillion-dollar ventures, including Rocket Money and Arthur AI. "The Pitch Perfect competition is an incredible opportunity for student entrepreneurs to showcase their creativity, innovation and business acumen in a real-world setting," Wenchel said. "The students who stand out are those who not only present a compelling vision but also demonstrate deep market understanding, adaptability and a passion for solving real problems. Their ability to think critically, take feedback and execute confidently sets them apart as future leaders in entrepreneurship." Among the participants of the event was Yonatan Tussa, a junior computer science major and recent transfer student, who pitched his startup, SONE. The idea aims to address patient falls in hospitals, a problem he identified through conversations with his father, a nurse at Johns Hopkins Hospital. Tussa explained that patients often fall while reaching for call lights, which have become inaccessible.'
year_published = 2025
