["https://cs.umd.edu/research-area/databases-and-big-data"]
title = "Databases and Big Data | UMD Department of Computer Science"
full_description = 'In recent years, we have seen a tremendous increase in the data available in the digital format, the World Wide Web being a prominent example, and this trend is expected to accelerate with the increasing proliferation of devices, ranging from genome sequencing machines to microscopic biomedical sensors, that are capable of capturing even the minutest details of our everyday world. The database group at the University of Maryland at College Park carries out a multi-faceted and diverse research agenda that focuses on exploring the data management challenges in a wide variety of environments. Some of the most important focus areas over the last few years include life sciences and biological databases, graph databases, sensor network data management, social network data management, mobile databases, P2P networks, and unstructured text databases. At the same time, the database group has continued innovating in the traditional data management topics such as managing and querying data warehouses, spatial databases, query processing and optimization, data streams, approximate query processing, and data mining. Department of Computer ScienceBrendan Iribe Center for Computer Science and EngineeringUniversity of Maryland8125 Paint Branch Drive College Park, MD 20742main phone: (301) 405-2662 <br /> <div class="um-brand"> <div id="logo"><a href="http://www.umd.edu" target="_blank">University of Maryland</a></div> </div> <p></p>'
