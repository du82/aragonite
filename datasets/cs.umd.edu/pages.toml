full_description = '''Founded in 1983, UMD’s Human-Computer Interaction lab is one of the world's oldest centers for the study of human centered computing. With a long history of creating innovative interaction designs and understanding human performance, we have contributed to the development of applications that serve the community. The HCIL is an interdisciplinary lab jointly operated by UMIACS and the College of Information Studies (iSchool), as well as comprised of faculty and students from Computer Science, Information Studies, Psychology, and other campus units. Our current work includes new approaches to information visualization, education, social computing, mobile devices, medical informatics and explores technology design methods with and for children. Department of Computer ScienceBrendan Iribe Center for Computer Science and EngineeringUniversity of Maryland8125 Paint Branch Drive College Park, MD 20742main phone: (301) 405-2662 <br /> <div class="um-brand"> <div id="logo"><a href="http://www.umd.edu" target="_blank">University of Maryland</a></div> </div> <p></p>'''
