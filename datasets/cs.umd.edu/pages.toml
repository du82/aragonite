["https://cs.umd.edu/job/2021/victor-basili-postdoctoral-fellowship"]
title = "Victor Basili Postdoctoral Fellowship | UMD Department of Computer Science"
description = "The University of Maryland (UMD) Computer Science Department is pleased to announce this year’s call for applications to the Victor Basili Postdoctoral Fellowship program. This fellowship program seeks talented, highly motivated, post-doctoral computer scientists to conduct research in Applied Software Engineering and Programming Languages. The program supports multiple two-year postdoctoral fellowships, that allow Fellows to work closely with a UMD faculty mentor, while also giving them considerable autonomy to the define their own research vision and career path."
full_description = "The University of Maryland (UMD) Computer Science Department is pleased to announce this year’s call for applications to the Victor Basili Postdoctoral Fellowship program. This fellowship program seeks talented, highly motivated, post-doctoral computer scientists to conduct research in Applied Software Engineering and Programming Languages. The program supports multiple two-year postdoctoral fellowships, that allow Fellows to work closely with a UMD faculty mentor, while also giving them considerable autonomy to the define their own research vision and career path. To this end, Fellows commit to work with a faculty sponsor at least 1/2 of their time but are free to develop their own independent areas of research in the time that remains. We believe this combination of mentored collaboration and freedom to pursue independent interests is a unique benefit of the program’s success. Current and former Fellows have worked on specific research topics related to software testing, formal methods, programming language design, static and dynamic program analysis, software security, cyber-physical systems, and empirical studies. They apply their work in diverse application domains such as automotive and medical systems, bioinformatics, smart agriculture, advanced manufacturing, and quantum computing, among many others. Specific areas of interest for this year’s call for applications include synthetic data generation to support test and evaluation of AI-intensive software systems, automated testing and/or type inference for dynamic programming languages, and software security and formal verification more generally. Past Fellows have gone on to start successful academic careers. Thomas Gilray (https://thomas.gilray.org) is now an Assistant Professor at UAB. Niki Vazou (https://nikivazou.github.io) is a Research Assistant Professor at the IMDEA Software Institute. Leonidas Lampropoulos (https://lemonidas.github.io/) is an Assistant Professor at UMD. Robert Rand (http://rand.cs.uchicago.edu/) is an Assistant Professor at the University of Chicago. Current Fellows Michael Coblenz (PhD, CMU) and Liyi Li (PhD, UIUC) are on the academic job market this year. All have spoken favorably about UMD academic environment, and the benefit of being able to lead their own projects and participate in projects within the larger group If you are interested in applying to the Victor Basili Postdoctoral Fellowship, you can learn more here: https://www.cs.umd.edu/basili-postdoc Review of applications will begin upon receipt and continue until positions are filled. If you have any questions, you are welcome to send an email to basilifellow [-at-] cs [dot] umd [dot] edu."
