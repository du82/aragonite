["https://cs.umd.edu/article/2025/02/umds-immersive-media-design-program-bridges-art-and-technology"]
title = "UMD's Immersive Media Design Program Bridges Art and Technology | UMD Department of Computer Science"
description = "The rapid integration of technology into everyday life has brought new possibilities for creative expression and innovation. One area seeing significant advancement is immersive media, which engages viewers with sight, sound and other sensory experiences, encouraging interaction with digital environments."
full_description = "The rapid integration of technology into everyday life has brought new possibilities for creative expression and innovation. One area seeing significant advancement is immersive media, which engages viewers with sight, sound and other sensory experiences, encouraging interaction with digital environments. The University of Maryland’s Department of Computer Science offers a program dedicated to this field: Immersive Media Design (IMD). Founded to meet the the growing demand for interdisciplinary expertise, the IMD program provides undergraduates with the tools to explore emerging technologies like virtual, augmented and extended reality. Students can pursue either a Bachelor of Arts in Emerging Creatives or a Bachelor of Science in Computing. Both tracks are designed to foster collaboration across disciplines and prepare students for careers at the intersection of art and technology. With more than 130 students, 20 staff and faculty and newly hired Assistant Director Georgia Creson, the program is ready to expand its significance. In a Q&A, Professor of Computer Science Roger Eastman, director of the IMD program, shares insights on its evolution, goals and impact. A: The Immersive Media Design program was initiated by a task force created by the Provost in 2016. The task force explored opportunities for new degrees centered around emerging technologies like virtual, augmented and extended reality. Their recommendation led to creating a program designed to blend technical and artistic disciplines into immersive media education. Q: How does the program combine the fields of computer science and the arts to offer a unique educational experience? A: The program leverages the strengths of the nationally ranked Department of Computer Science and the Department of Art. Students choose between the Bachelor of Arts, which emphasizes art courses, and the Bachelor of Science, which emphasizes computer science courses. Regardless of their choice, all students take core courses in immersive media. These courses teach them to program new media, integrate it into exhibitions, games, or installations, and creatively creatively apply emerging technologies."
