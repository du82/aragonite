["https://cs.umd.edu/job/2024/130042-open-rank-assistant-professor-associate-professor-professor"]
title = "Open Rank: Assistant Professor, Associate Professor, Professor | UMD Department of Computer Science"
description = "The Department of Computer Science at the University of Maryland, College Park, MD, USA is recruiting to fill multiple tenure-track faculty positions, with starting dates on or after July 1, 2025."
full_description = "View details and apply on UMD's eJobs websitePosition Number: 130042The Department of Computer Science at the University of Maryland, College Park, MD, USA is recruiting to fill multiple tenure-track faculty positions, with starting dates on or after July 1, 2025. The openings are not restricted to any rank and outstanding candidates at all levels are encouraged to apply. The Department seeks exceptional candidates in all areas of computer science, including but not limited to Artificial Intelligence, Computational Biology and Health, Computer Graphics and AR/VR, Computer Systems, Computer Vision, Cybersecurity, Data Sciences, Databases, Human-Computer Interaction, Programming Languages, Quantum Computing, Software Engineering, Theoretical Computer Science, etc. Applicants working at the boundary of computer science and related disciplines, including Computational Linguistics and Natural Language Processing, Reinforcement Learning, Robotics and Scientific Computing are also encouraged to apply, and may be considered for joint positions with other departments or institutes on campus. A candidate should indicate in their cover letter if they might be interested in such a joint appointment. The Department is committed to building a diverse faculty dedicated to its missions of research, teaching and service to the community, and it especially encourages applications from women and members of other underrepresented groups in computing. In addition, candidates who have experience engaging with a diverse range of faculty, staff and students, and contributing to a climate of inclusivity are encouraged to discuss their perspectives on these subjects in their application material. Interested candidates should apply on-line in order to receive consideration. Applicants are strongly encouraged to have complete versions of their materials – including a cover letter, a curriculum vitae, research and teaching statements, and recommendation letters from at least four references – uploaded by 12/15/24. Applications will continue to be accepted and reviewed until all positions are filled. Candidates will be prompted when submitting their application to include information for their references. Questions can be directed to faculty-search [-at-] cs [dot] umd [dot] edu. The Department of Computer Science is top-ranked for research and teaching, with its undergraduate computer science program ranked 9th among public universities by U.S. News & World Report. The undergraduate program currently educates over 3,700 diverse students from around the world. The graduate program is ranked 11th on CS Rankings and 17th in the nation by US News, with over 400 graduate students enrolled. The Department has 62 tenure-track faculty members, many of whom have been recognized with memberships in the National Academy of Engineering, fellowships in professional scientific organizations including ACM and IEEE, NSF Faculty Early Career Development awards and Sloan Fellowships. The Department receives over $30 million annually in external research funding. It is home to the Iribe Initiative for Inclusion and Diversity in Computing (https://inclusion.cs.umd.edu/), whose programs have been funded by more than $4 million in grants and gifts, and it is located in the state-of-the-art Brendan Iribe Center for Computer Science and Engineering (https://iribe.umd.edu/). Additional information about the Department is available at https://www.cs.umd.edu. UMD is committed to fostering a diverse, inclusive, and family-friendly community through programs such as TerrapinSTRONG (https://terrapinstrong.umd.edu/) focusing on building an inclusive community, or the FAMILE diversity initiative (https://faculty.umd.edu/famile-initiative). Minimum Qualifications Ph.D. in Computer Science, Electrical & Computer Engineering, or related discipline. Strong demonstrated interest in research, student mentoring, teaching and service to the broader scientific community."
