title = "Alumni | UMD Department of Computer Science"
full_description = "We are a department of excellence. The University of Maryland’s computer science faculty continually embarks on cutting edge research, produces award winning papers, and teaches students a foundation of skills to launch their own accomplishments. We graduate qualified students that earn competitive jobs. Many UMD alumni have become professors at high ranked universities, researchers at well-known industrial labs and software engineers at successful Internet start-ups. Some of our notable alumni include Sergey Brin, co-founder of Google; Gary Flake, a Microsoft Distinguished Engineer and founder of Yahoo! Research Labs; and Naresh Gupta, senior vice president of Adobe’s Print and Publishing Business Unit. In an effort to expand the online Alumni Hall of Fame, if you would like to nominate a UMD CS alumnus or alumna to be highlighted on these pages, please send an email to the chair's office (cschair@cs.umd.edu) and to Professor Ashok Agrawala (agrawala@cs.umd.edu). Our department wants to recognize the achievements of as many alumni as possible. Additionally, we would like to keep alumni up-to-date on CS events once a semester through a newsletter! If you have not been invited by email to the alumni mailing list (cs-alumni@cs.umd.edu), you can sign up here. For giving opportunities, please click here. Josh Kamdjou (B.S. ’14), CEO of Sublime Security Inc., secures new funding, bringing the company’s total outside funding to $93.8 million since its 2019 founding. Mohamed Abdel-Mottaleb (Ph.D. ’93) was named founding chair of computer science at IU Indianapolis. Andrew Sears (Ph.D. ’93) was named provost and senior vice president of Worcester Polytechnic Institute. Martín Farach-Colton (Ph.D. ’91) was inducted as a 2023 fellow of the American Association for the Advancement of Science (AAAS). Department of Computer ScienceBrendan Iribe Center for Computer Science and EngineeringUniversity of Maryland8125 Paint Branch Drive College Park, MD 20742main 