["http://www.cs.umd.edu/projects/reucaar"]
title = "Research Experience for Undergraduates (REU)  Combinatorics, Algorithms, and AI for Real Problems (CAAR)"
full_description = "Research Experience For Undergraduates (REU) in Combinatorics, Algorithms, and AI for Real Problems (CAAR) is a 10 week NSF funded research program designed to bridge the gap between the theory (algorithms, probability, combinatorics, Theoretical Machine Learning, others) and other disciplines within Computer Science (AI, Operations Reseach, practical machine learning, others.) Rather than wax philosophical about this just go Look at the Projects! 1) Look at the project and determine which ones you would be happy to work on. There should be at least 2. 3) emails and names of people to write letters for you (2 suffice, 3 is max). These should be people from STEM fields. We do not care about ballroom dancing! TELL THEM to email their letters to 3) Write a statement of purpose which tells us WHICH projects ou want to work on, and for each one WHY you are qualified and WHY your are intersted. You may also tell us anything else of interest. For example, anything else you've done that is not on the transcript that relates to the projects you are interested in. In addition, any awards you've won (e.g., Fields Medal or Turing Award). All undergrads who have a basic understanding of Algorithms, Discrete Mathematics, and Computer Programming are encouraged to apply. If you are in this category say so in your personal essay. If your school will pay for some of the cost then let us know. The DIMACS REU Program addresses similar topics as ours. If you are interested in CS theory, consider applying there as well! Go to the left!!! You will see a tab that says FAQ. Click on it! If your question is not answered there then email me: Bill Gasarch gasarch@umd.edu"
