["https://cs.umd.edu/research-area/high-performance-and-scientific-computing"]
title = "High Performance and Scientific Computing | UMD Department of Computer Science"
full_description = 'High Performance Computing involves using large computers to solve major scientific and engineering problems. HPC is used from weather prediction to designing consumer products. The members of the HPC group at Maryland investigate many aspects of High Performance Computing from innovations in core numerical algorithms, to system software and tools to enabling productive use of large-scale computation. Numerical analysis and scientific computing have a long history in our department, dating from the 1970s. Our research today includes work on numerical linear algebra, ill-posed problems, fast summation methods, and the use of such ideas in diverse applications such as imaging, fluid dynamics and acoustics. The group has always had close ties with numerical analysts in the Mathematics Department, and our students are drawn from the Department of Computer Science as well as the Applied Mathematics and Scientific Computing Program. Department of Computer ScienceBrendan Iribe Center for Computer Science and EngineeringUniversity of Maryland8125 Paint Branch Drive College Park, MD 20742main phone: (301) 405-2662 <br /> <div class="um-brand"> <div id="logo"><a href="http://www.umd.edu" target="_blank">University of Maryland</a></div> </div> <p></p>'
