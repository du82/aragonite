["https://cs.umd.edu/maryland-max-planck"]
title = "Maryland Max Planck: A unique Ph.D. program made for you! | UMD Department of Computer Science"
description = "The Maryland Max Planck Ph.D. Program in Computer Science offers students a unique opportunity to pursue a Ph.D. degree under the supervision of faculty from the University of Maryland, USA, and a Max Planck Institute in Germany."
full_description = "The Maryland Max Planck Ph.D. Program in Computer Science offers students a unique opportunity to pursue a Ph.D. degree under the supervision of faculty from the University of Maryland, USA, and a Max Planck Institute in Germany. Students are co-advised, perform collaborative research, take advantage of the expertise, resources, and culture at both institutions, and spend time in both countries. Strong academic record and demonstrated potential for independent research. Creativity, sharpness, and an aptitude for learning from and collaborating with a world-class global team. To work on some of the most compelling problems in computing, in a dynamic, multicultural, global team of world-renowned experts Students apply to the UMD graduate program with the option to be considered for the joint program. Admitted students receive full financial support throughout the program. They typically spend their first three semesters at UMD taking classes, while spending summers at an MPI in Germany. During this time, they choose a pair of advisers (one at UMD, one at an MPI) and define a collaborative research project. They spend at least 1/3 of their time with each of their advisers, scheduling their residency to suit their research needs. Upon completing the program, students receive a Ph.D. degree from the University of Maryland and a certificate of doctoral research from an MPI. In addition, please apply to the Maryland Max-Planck Joint program at https://apply.cis.mpg.de/register/mmp/. General information about UMD's Graduate programs is available at https://gradschool.umd.edu/admissions. Established in 1973, the Department of Computer Science at the University of Maryland educates over 2,000 undergraduates and 200 graduate students yearly. Its more than 50 faculty members have been recognized with membership in the National Academy of Engineering, fellowship in professional scientific organizations, National Science Foundation Faculty Early Career Development awards and Sloan Research Fellowships."
year_published = 2025
