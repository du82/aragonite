["https://cs.umd.edu/event/2025/02/machine-learning-spatial-and-network-biology"]
title = "Machine learning for spatial and network biology | UMD Department of Computer Science"
description = "Biological systems are organized across a hierarchy of scales, from the spatial organization of cells in tissues to networks of interactions between genes and proteins. However, the systematic study of spatial and network processes is challenged by high levels of heterogeneity, sparsity, and other forms of noise in modern sequencing data. In this talk, I present new statistical and machine learning (ML) methodologies for spatial and network biology."
full_description = 'Biological systems are organized across a hierarchy of scales, from the spatial organization of cells in tissues to networks of interactions between genes and proteins. However, the systematic study of spatial and network processes is challenged by high levels of heterogeneity, sparsity, and other forms of noise in modern sequencing data. In this talk, I present new statistical and machine learning (ML) methodologies for spatial and network biology. First, I introduce “gene expression topography”, a fundamentally new paradigm for modeling spatial gradients and tissue geometry from sparse spatial data. I derive algorithms for learning “topographic maps” of 2-D tissue slices using tools from complex analysis and interpretable deep learning. These maps reveal the spatial and molecular organization of tissues from the brain, skin, and tumor microenvironment. Second, I introduce a statistical framework for anomaly detection in biological interaction networks, or the problem of identifying anomalous subnetworks of interacting disease genes/proteins. I prove that many widely-used algorithms are statistically biased — resolving a 20-year-old open question on why these methods identify large and unrealistic subnetworks — and I derive asymptotically unbiased and efficient algorithms for network anomaly detection. Taken together, my research underscores the need for specialized, principled, and interpretable ML approaches for advancing biomedical discovery. Department of Computer ScienceBrendan Iribe Center for Computer Science and EngineeringUniversity of Maryland8125 Paint Branch Drive College Park, MD 20742main phone: (301) 405-2662 <br /> <div class="um-brand"> <div id="logo"><a href="http://www.umd.edu" target="_blank">University of Maryland</a></div> </div> <p></p>'
year_published = 2025
