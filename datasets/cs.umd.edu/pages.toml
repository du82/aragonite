["https://cs.umd.edu/research-area/computer-vision-and-machine-perception"]
title = "Computer Vision and Machine Perception | UMD Department of Computer Science"
full_description = 'The University of Maryland has one of the oldest and largest research groups in computer vision in the US. The Center for Automation Research (CFAR) was founded in 1964 by computer vision pioneer Azriel Rosenfeld, and CFAR still houses a large and thriving computer vision community, consisting of almost a dozen faculty and roughly fifty graduate students. Research at UMD addresses every aspect of computer vision, featuring work in areas such as Face Recognition, Vision for Robotics, 3D Reconstruction, Image Segmentation, and Visual Classification. Much of this work explores the use of Big Data and Deep Learning in Computer Vision. The work at UMD is quite interdisciplinary, drawing students and faculty from CS, ECE and Applied Math, and forming close collaborations with other areas of computer science such as Human-Computer Interaction, Machine Learning, Computer Graphics, Augmented and Virtual Reality, Robotics, and Optimization. Department of Computer ScienceBrendan Iribe Center for Computer Science and EngineeringUniversity of Maryland8125 Paint Branch Drive College Park, MD 20742main phone: (301) 405-2662 <br /> <div class="um-brand"> <div id="logo"><a href="http://www.umd.edu" target="_blank">University of Maryland</a></div> </div> <p></p>'
