["https://cs.umd.edu/research"]
title = "Research Overview | UMD Department of Computer Science"
full_description = 'Artificial Intelligence (AI) has a long history in our department, and currently supports a very dynamic program of research and education. Our educational curriculum provides a broad range of courses including introductory AI, automated planning, cognitive modeling, commonsense reasoning, evolutionary computation, game theory, machine learning, multi-agent systems, natural language processing, and neural computation. The AI group has consistently ranked high in external national assessments: for example, in the US News ranking of best graduate schools, our AI program is ranked 9th among all universities and 6th among public universities. Many of our former students have gone on to very high levels of achievement. Examples include Vipin Kumar (PhD 1982), Fellow of the AAAS, ACM, and IEEE; Qiang Yang (PhD 1989), Fellow of the IEEE; Naresh Gupta (PhD 1993), Senior Vice President at Adobe; Lee Spector (PhD 1992), Fellow of the ISGEC; Gary Flake (PhD 1993), Microsoft Distinguished Engineer and well known author of The Computational Beauty of Nature; Narendra Ahuja (PhD 1979), Fellow of the IEEE, AAAI , SPIE, and ACM; and Granger Sutton (PhD 1992), whose software was used in the first-ever assembly of the complete whole genome of a free-living organism, the Haemophilus influenzae genome. Theoretical Computer Science (TCS) is concerned with understanding the very nature of computation: What problems can be solved by computers and how efficiently can such problems be solved? Can "hard" problems be used to our advantage in any way? TCS encompasses research in such diverse areas as complexity theory, algorithms, cryptography and coding theory, distributed and parallel computing, social networks, machine learning, game theory, and more. The common thread is a focus on precise models and rigorous mathematical analysis of particular problems within those models. Computational Biology and Bioinformatics is a multidisciplinary area dedicated to answering questions arising from the genome revolution. It spans multiple areas in computer science, including algorithms for combinatorial optimization, machine learning, data management, and scientific computing. It brings together scientists and engineers from many fields, including computer science, molecular biology, genomics, genetics, mathematics, statistics, and physics. The Center for Bioinformatics and Computational Biology is organized as a center within the University of Maryland Institute for Advanced Computer Studies (UMIACS), an interdisciplinary research institute supporting high-performance computing research across the College Park campus.'
