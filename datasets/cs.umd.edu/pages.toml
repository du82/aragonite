title = "Outreach Programs | UMD Department of Computer Science"
description = "The Department of Computer Science at the University of Maryland invests in fostering awareness and passion for computer science. The department aims to promote and support a community of learning and engagement in computer science amongst students of varying ages. Many outreach efforts are housed in the Iribe Initiative for Inclusion and Diversity in Computing and the Maryland Center for Women in Computing."
full_description = "The Department of Computer Science at the University of Maryland invests in fostering awareness and passion for computer science. The department aims to promote and support a community of learning and engagement in computer science amongst students of varying ages. Many outreach efforts are housed in the Iribe Initiative for Inclusion and Diversity in Computing and the Maryland Center for Women in Computing. Key outreach programs within I4C and MCWIC include: Summer Academy: CompSciConnect, CyberDefense Training, and AI4ALL Rise Up 4 CS: High School AP Computer Science A Tutoring K-12 Outreach: Creative Computing, Girl Scouts, Girls Who Code and more Tech + Research: weekend research project track within Technica The Department offers summer Research Experience for Undergraduates Programs including CAAR and CBCB. Additionally, CS Pathways is a program to facilitate and support the transfer student process. Our Department hosts the annual High School Programming Competition that tests the skills of dozens of computer science teams from local high schools. Additionally, several of our esteemed faculty mentor high school students. Prospective undergraduate students interested in computer science should check out the prospective student page."
