["https://cs.umd.edu/people/dvanhorn"]
title = "David Van Horn | UMD Department of Computer Science"
description = "Search by name"
full_description = '''David Van Horn is an Associate Professor in the Department of Computer Science and the Institute for Advanced Computer Studies (UMIACS) at the University of Maryland, College Park. His research interests are in programming languages and formal methods, where he works toward making the construction of reusable, trusted software components possible and effective. He publishes regularly in the flagship SIGPLAN conferences, POPL, PLDI, OOPSLA, and ICFP, and his work has been recognized with a NSF CAREER Award, a CRA Computing Innovation Fellowship, a Communications of the ACM Research Highlight, an OOPSLA Distinguished Paper Award, and an ICFP Most Influential Paper Award. He is the co-author of “Realm of Racket,” an illustrated book on programming video games, written and illustrated with eight undergraduate students. He is committed to broadening participation in computer science and is currently serving on the Steering Committee of the ACM SIGPLAN Programming Languages Mentoring Workshop and the faculty mentor for Technica, the world's largest all-women and non-binary hackathon. Department of Computer ScienceBrendan Iribe Center for Computer Science and EngineeringUniversity of Maryland8125 Paint Branch Drive College Park, MD 20742main phone: (301) 405-2662 <br /> <div class="um-brand"> <div id="logo"><a href="http://www.umd.edu" target="_blank">University of Maryland</a></div> </div> <p></p>'''
