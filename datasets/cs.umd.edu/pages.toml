["https://cs.umd.edu/classconcern"]
title = "Incident Reporting in Computer Science | UMD Department of Computer Science"
description = "Report An Incident Or Concern HereSTOP! To report sexual misconduct, discrimination, student conduct, or hate bias issues contact the offices below using their specific forms. CS Class Concern is a form to report issues and concerns about your experiences in the UMD Computer Science classrooms. It is not used to report any sexual harrasement,student conduct, or hate bias issues."
full_description = "Report An Incident Or Concern Here STOP! To report sexual misconduct, discrimination, student conduct, or hate bias issues contact the offices below using their specific forms. CS Class Concern is a form to report issues and concerns about your experiences in the UMD Computer Science classrooms. It is not used to report any sexual harrasement,student conduct, or hate bias issues. Please follow instuctions below to report these concerns. CS Class Concern Structure: If you have an issue that arises with a student or TA during your time in any UMD computer science course, please contact your course instructor first. If you are uncomfortable contacting your instructor or if issues are not addressed to your satisfaction, please complete the CS Class Concern Form. This form is received by the Incident Reporting subcommittee of the Diversity & Inclusion Committee: Associate Chair, Undergraduate Education (Alan Sussman) Associate Chair, Graduate Education (Amol Deshpande) Assistant Director, Undergraduate Studies (Natalie Lightfoot-Solomon) Assistant Director, Undergraduate Academic Affairs (Monica Hilliard) Assistant Director, Graduate Education (Tom Hurst) Assistant Director, Iribe Initiative for Inclusion and Diversity in Computing (Kate Atchison) If deemed appropriate, this report may be escalated to the Chair of the Department or Dean of the College of Computer, Mathematical, and Natural Sciences. Issues to be reported through the CS Class Concern Form: Trouble accessing resources to participate in a lab or discussion Trouble getting information or in touch with your instructor Concerns about favoritism by TAs or instructors Unprofessional conduct by any department employee Trouble accessing resources to lead a lab or discussion (TAs) Trouble receiving accommodations from instructors or TAs If you have a concern about the structure or management of a course, please share your concerns directly to Associate Chair of Undergraduate Education (Dave Mount, mount [-at-] umd [dot] edu) How CS Class Concerns Are Addressed: We will acknowledge the report within 2 business days during the normal academic year, and 5 business days during breaks or summer If we need more information from you, we will request it in that timeframe Depending on the nature of the report, we will inform and consult with relevant campus administrators regarding potential actions We will aim to resolve reports within 30 days and will inform you when completed; however, depending on the nature of the report, we may not be able to provide additional details on the specifics of the outcome In all cases, we will endeavor to protect your identity as best as we can How Data and Emails are Stored: The only people who will have access to the form are members of the incident reporting committee at the time of report Historical statistics will be kept, but only in a completely anonymized form Retaliation: If you feel like you were retaliated against for reporting information, please email mount [-at-] umd [dot] edu and cschair [-at-] cs [dot] umd [dot] edu. You can also reach out to the campus undergraduate or graduate ombudsperson at: https://www.ugst.umd.edu/ombuds/index.html or https://gradschool.umd.edu/about-us/ombuds-office. A Note about Mandatory Reporting: If the report involves sexual misconduct,we are required to file a report with the Office of Civil Rights & Sexual Misconduct (https://www.ocrsm.umd.edu/) and the Title IX coordinator. You can learn more about mandatory reporting below. Faculty/TA/Ac. AdvisorsSupervisory Staff Current Places to Report Sexual Harassment, Student Conduct, or Hate Bias Issues: Office of Diversity and Inclusion: BISS Response Team The University of Maryland values diversity and is committed to creating an inclusive and respectful campus for students, faculty and staff. Acts of bias and intimidation go against our university’s core values. If you have been impacted by and/or have witnessed a hate-bias incident, you can file a report by completing the online form. Phone: 301-405-0980Email: biassupport [-at-] umd [dot] eduSite: https://diversity.umd.edu/bias Report Bias Incidents Online UMD Office of Civil Rights and Sexual Misconduct (OCRSM) The University of Maryland is committed to maintaining a working and learning environment free from sexual harassment and sexual misconduct, including sexual assault, dating and domestic violence/abuse, sexual exploitation, and sexual intimidation (collectively known as “Prohibited Conduct”). The complete policies and procedures can be found in Section VI of the Policies section on the president's site. The University of Maryland is committed to creating and maintaining an education, working and living enviroment that is free from discrimination and harassment. Phone: 301-405-1142Email: titleixcoordinator [-at-] umd [dot] eduSite: https://www.ocrsm.umd.edu/ https://ocrsm.umd.edu/sexual-misconduct https://ocrsm.umd.edu/discrimination Prompt reporting is encouraged. Persons may report allegations of sexual misconduct or discrimination at any time, and are encouraged to report promptly in order to maximize the University’s ability to obtain evidence, identify potential witnesses and conduct a thorough, prompt, and impartial investigation. Report Sexual Misconduct Online Report Discrimination Online UMD Office of Student Conduct The Office of Student Conduct receives and investigates referrals for Academic Integrity and Student Misconduct. Phone: 301-314-8204Site: https://studentconduct.umd.edu Refer a case: https://studentconduct.umd.edu/refer Report An Incident Or Concern Here"
