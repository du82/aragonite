description = "Search by name"
full_description = 'Dr. Li joined the University of Maryland, College Park as a tenure-track Assistant Professor in Aug. 2023. During the deferral time before joining, he was a research associate at Qualcomm AI Research. Dr. Li received his Ph.D. in 2022 from the Department of Electrical and Computer Engineering (ECE) at Duke University. Li has also earned a Ph.D. in Computer Science from the University of Arkansas. He has an MS in Management of Innovation and Venture Capital from Peking University, and a BS in Computer Science from Henan University in China. His research interests lie in the intersection of machine learning and edge computing, with a focus on building large-scale networked and trustworthy intelligent systems to solve practical problems in a collaborative, scalable, secure, and ubiquitous manner. Dr. Li has been recognized with a variety of awards, including the IEEE TCCPS Outstanding Ph.D. Dissertation Award, ACM KDD Best Student Paper Award in 2020, and the 2022-2023 Duke ECE Department Outstanding Dissertation Award. Department of Computer ScienceBrendan Iribe Center for Computer Science and EngineeringUniversity of Maryland8125 Paint Branch Drive College Park, MD 20742main phone: (301) 405-2662 <br /> <div class="um-brand"> <div id="logo"><a href="http://www.umd.edu" target="_blank">University of Maryland</a></div> </div> <p></p>'
