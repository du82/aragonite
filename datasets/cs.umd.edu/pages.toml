["https://cs.umd.edu/article/2025/02/new-reality-physician-assistant-students"]
title = "A New Reality For Physician Assistant Students | UMD Department of Computer Science"
description = "“Today is gonna be a really, really fun day for you,” Assistant Dean for Physician Assistant Education and Associate Professor Cheri Hendrix, DHEd, MSBME, PA-C, DFAAPA, told her class of 58 physician assistant (PA) students. In truth, it would be hard to say just who would have the most fun, the students who sat in anticipation of an exciting new high-tech learning experience, or Hendrix, who waited a very long time for this day to arrive.“I think this is really going to enrich what you know about neurologic disease,” she continued, understating her expectations a bit."
full_description = "“Today is gonna be a really, really fun day for you,” Assistant Dean for Physician Assistant Education and Associate Professor Cheri Hendrix, DHEd, MSBME, PA-C, DFAAPA, told her class of 58 physician assistant (PA) students. In truth, it would be hard to say just who would have the most fun, the students who sat in anticipation of an exciting new high-tech learning experience, or Hendrix, who waited a very long time for this day to arrive. “I think this is really going to enrich what you know about neurologic disease,” she continued, understating her expectations a bit. For the first time, this learning module made use of virtual reality (VR) technology, offering her entire didactic year cohort an immersive experience. With the use of VR headsets, the students would be virtually in the room with Hendrix as she examined a standardized patient – a professional actor posing as a patient who was presenting with signs of distress. The plan was to give the students a brief knowledge test before their VR experience, and then another test afterward to see how much this experience improved their understanding. “I feel like I'm actually there, even though I can't see my hands or anything. But it's like, I feel like I'm very immersed in the experience,” she said with her headset still on. Not only could Makarehchi see the exam, but she could also move around the room and observe provider and patient from every angle. Additionally, as the patient described her experiences for Hendrix – all classic symptoms of a stroke – an animated graphical overlay allowed Makarehchi and the other students to see what was going on inside the patient’s body, including the nervous and cardiovascular systems. “I can see that the clot started in her atrium, went up to the left side of her brain, and now you can see the impulses are being limited on the right side of her body, which is causing the motor and sensory limitations that we can see on the exam,” explained student Meg Rice. After her five-minute virtual experience, Rice seemed impressed."
