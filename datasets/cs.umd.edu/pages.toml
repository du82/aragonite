["https://cs.umd.edu/diversity/about"]
title = "Inclusion and Diversity | UMD Department of Computer Science"
full_description = "Mission The mission of the Diversity and Inclusion Committee is to foster a climate of inclusion in our department and to develop and implement data-driven and scientifically proven strategies for increasing and maintaining diversity across all constituencies, as defined by the vision set out in Section V of the department’s Strategic Plan. The committee also serves as a liaison between our department and other diversity and inclusion-related activities/organizations across the campus, including, but not limited to the Iribe Initiative for Inclusion and Diversity in Computing and the Office of Diversity and Inclusion. Elias GonzalezCommittee Chair egonzal5 [-at-] umd [dot] edu Kate Atchison katea [-at-] umd [dot] edu Abhinav Bhatele bhatele [-at-] cs [dot] umd [dot] edu Hal Daume III hal [-at-] umiacs [dot] umd [dot] edu Tom Hurst thurst [-at-] umd [dot] edu Maria Johnson mjohn [-at-] cs [dot] umd [dot] edu Alan Sussman als [-at-] cs [dot] umd [dot] edu Dianne O'Leary oleary [-at-] cs [dot] umd [dot] edu Mihai Pop mpop [-at-] umiacs [dot] umd [dot] edu Veronica Sanchez vsanche [-at-] umd [dot] edu Faculty and staff please use this form to share your diversity, equity, and inclusion information with us. These efforts are tracked as part of the NSF Broadening Participation in Computing efforts. You can view the Fall 2020 approved UMD BPC Department Plan here. Graduate and undergraduate students as well as student organizations, you may also share diversity, equity, and inclusion efforts using this form. Follow the link below to report your diversity activity: Report Your Diversity Activity Membership The committee comprises at least six members with at least one member from each of the following constituencies, assuming eligible individuals are available to serve: Recommended Permanent Members Asst. Director of Undergraduate Studies (permanent) Asst. Director for Graduate Education (permanent) Asst. Director and/or Director for the Iribe Initiative (permanent) Other Eligible Members Teaching track faculty Assistant professors Associate professors Full professors Staff Members will serve for a renewable term of 3 years. To ensure continuity, at most half of non-permanent members may change in any given year. It is assumed that the committee will involve students when appropriate. Committee members are appointed by the department chair. Charter The Diversity and Inclusion Committee will develop, implement, review concrete plans of action related to diversity and inclusion, including, but not limited to, the strategies outlined in the Department's Strategic Plan. The committee will report on its activities on a regular basis to the Chair, the department and the advisory board while regularly consulting with other permanent committees of the department. The responsibilities of the Diversity and Inclusion Committee include: Collect, analyze, and report data related to diversity and departmental climate Provide guidance to department staff, faculty, and other stakeholders on how to improve the department climate with respect to diversity & inclusion, including supporting student success Promote awareness of the potential impact on diversity & inclusion of departmental initiatives and policies, including curriculum and instruction Assist departmental stakeholders and partners to ensure communication and outreach utilizes best practices for diversity & inclusion To enable these activities, the Department chairperson support the Committee by: Ensuring the Committee is provided with or have access to relevant data and/or otherwise provided tools to collect said data Providing an opportunity to comment on how proposed changes in department policies and curriculum may impact issues around diversity and inclusion Ensuring that the processes for review and slate of candidates/applicants selected by the hiring and admissions committees and are regularly reviewed and approved by the Diversity and Inclusion Committee. Assisting the Committee in gaining cooperation from others to aid its initiatives"
