["https://cs.umd.edu/research/projects"]
title = "Featured Research Projects | UMD Department of Computer Science"
full_description = 'Through employing metareasoning, Active Logic is a flexible alternative to more traditional Artificial Intelligence systems. Because Active Logic is an application that tracks its reasoning, it is able to reason about its own inferences, and thereby recognize and recover from errors. Baxters are low cost humanoid robots meant for adaptable manufacturing purposes by using long nimble arms and a suite of visual and tactile sen- sors. At the University of Maryland, re- searchers are exploring computer vision, machine learning, and artificial intelligence by training the Baxters to pour water into a moving jar, learn to cook by watching YouTube, and work with other robots. Dynamic Software Updating (DSU) acknowledges that software systems are imperfect and works to correct this inconvenience by permitting programs to be updated while they run. Requiring no redundant hardware, this software has been tested through theoretical programming language development and practical implementation. Mobile social applications provide new information sharing and networking opportunities based on a userâ€™s location, activity, and set of nearby users. The underlying communication protocols for these applications must be carefully designed to not leak sensitive information â€”identity, movement patterns, etc.â€” to strangers without prior consent. EbN is a communication system which meets the needs of a wide range of mobile social apps while providing strong security guarantees. The Gas Station Project is an approximation algorithm that can assess routing problems and generalize the shortest distances to reach a destination. Along with "The Traveling Salesman Problem", this research is based off of a new cost model dependent on gas prices rather than distance traveled. Moderate to severe diarrhea continues to be a deadly disease, especially for children in low-income countries. Meanwhile, the pathogens causing the condition are still not entirely known. Teams of researchers are using new biological and analytical techniques to look for previously unknown sources of the illness.'
