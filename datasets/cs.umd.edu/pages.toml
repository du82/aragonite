["https://www.cs.umd.edu/people/mpop"]
title = "Mihai Pop | UMD Department of Computer Science"
description = "Search by name"
full_description = 'Dr. Pop received his Ph.D. in Computer Science at Johns Hopkins University where he focused on algorithms for computer graphics and Geographic Information Systems (GIS) applications. He then joined The Institute for Genomic Research (TIGR) as a Bioinformatics Scientist, where he was responsible for the development of genome assembly algorithms. During this time, Dr. Pop participated in a number of bacterial and eukaryotic genome projects including important human pathogens such as Bacillus anthracis and Entamoeba hystolitica. Since joining the University of Maryland, Dr. Pop has continued to develop novel approaches for genome assembly and analysis, and has developed extensive expertise in the analysis of metagenomic data. His lab developped a number of widely-used computational tools for the analysis of genomic and metagenomic data. Furthermore, Dr. Pop is active in efforts to diversify the computer science and computational biology communities, both at UMD and more broadly. Department of Computer ScienceBrendan Iribe Center for Computer Science and EngineeringUniversity of Maryland8125 Paint Branch Drive College Park, MD 20742main phone: (301) 405-2662 <br /> <div class="um-brand"> <div id="logo"><a href="http://www.umd.edu" target="_blank">University of Maryland</a></div> </div> <p></p>'
