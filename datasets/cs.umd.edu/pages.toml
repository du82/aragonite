["https://www.cs.umd.edu/people/adeshpan"]
title = "Amol Deshpande | UMD Department of Computer Science"
description = "Search by name"
full_description = 'Prof. Deshpande is a Professor in the Department of Computer Science at the University of Maryland at College Park, with a joint appointment in the University of Maryland Institute for Advanced Computer Studies (UMIACS). He received my MS and PhD Degrees in Computer Science from the University of California at Berkeley in 2001 and 2004 respectively, and his B.Tech., Degree from the Indian Institute of Technology, Bombay in 1998. His research has spanned a spectrum of data management topics including query optimization, adaptive query processing, sensor network data management, scalable statistical modeling of data, uncertain data management, and graph databases. He has written more than 80 research publications, and has received best paper awards at the VLDB 2004, EWSN 2008, and VLDB 2009 conferences. He received a National Science Foundation (NSF) CAREER award in 2006, which is given to outstanding junior faculty who exemplify the role of teacher-scholars so they can further their research in their areas of expertise. He has served as a program committee member for many conferences in databases, systems, and sensor networks, and he is on the editorial boards for the Journal of Distributed and Parallel Databases, ACM TODS Journal, IEEE Transactions on Cloud Computing, and VLDB Journal. He has also served as a program committee Co-Chair for ACM SIGMOD 2019, and a program committee vice-chair for the IEEE International Conference on Data Mining (ICDM) in 2008, IEEE International Conference on Data Engineering (ICDE) in 2011 and 2013, ACM SIGMOD Conference 2016, and PVLDB 2017, 2019, 2023, and 2024. Department of Computer ScienceBrendan Iribe Center for Computer Science and EngineeringUniversity of Maryland8125 Paint Branch Drive College Park, MD 20742main phone: (301) 405-2662 <br /> <div class="um-brand"> <div id="logo"><a href="http://www.umd.edu" target="_blank">University of Maryland</a></div> </div> <p></p>'
