full_description = "Play × Company Our Company Leidos is an innovation company rapidly addressing the world's most vexing challenges in national security and health. Our 48,000 employees collaborate to create smarter technology solutions for customers in these critical markets. Learn more about Who We ARE Our Business Our business sectors provide unmatched expertise in core capabilities designed to address our customer's most critical missions. Health & Civil National Security Commercial & International Digital Modernization Defense Systems Health & Civil The Health & Civil Sector delivers unique capabilities in the areas of public health, care coordination, life and environmental sciences, and transportation. National Security The National Security Sector combines technology-enabled services and mission software capabilities for defense and intel customers in the areas of cyber, logistics, security operations, and decision analytics. Commercial & International The Commercial & International Sector combines our Security Enterprise Solutions (SES), energy solutions, Australia, and UK businesses. Digital Modernization The Digital Modernization Sector brings together our digital transformation and IT programs, allowing us to better serve our customers through scale and repeatability. Defense Systems The Defense Systems Sector develops and produces advanced space, aerial, surface, and sub-surface manned and un-manned defense systems. Responsibility & Sustainability We value our inspired, passionate and united employees. Not only do they further the Leidos mission to provide innovative solutions, they are equally active in their communities, are ethically-minded, and make a positive difference in the world. Our philosophy on sustainability Ethics & Business Integrity We are known throughout industry for maintaining the highest standards of integrity and ethical behavior. The combination of robust policies, procedures, training and communications creates a comprehensive program, touching every aspect of employee conduct. Learn more about our standards Partners Leidos suppliers are critical to the company and customer's success. Our Leidos Alliance members share our customer-focused commitments and encapsulate our mission to make the world safer, healthier, and more efficient through technology, engineering, and science. Learn more about our partners Global With more than 400 locations in 30 countries, we continue to expand our presence and strengthen our international relationships. See our global presence Contract Vehicles Leidos holds a number of government-wide acquisition, indefinite delivery and quantity, blanket purchase agreement, and customer-specific task order contract vehicles in support of civilian and defense agency missions. View Contract Vehicles Government (MACS) & IDIQs GSA Schedules International Agency Specific IDIQS Our founder Dr. Robert Beyster A history of innovative problem-solving and customer service In 1969, with a few dollars and a good idea, visionary scientist J. Robert Beyster, Ph.D. founded SAIC, the company that evolved into Leidos. More about our history Capabilities Our technical core capabilities underpin the work we do for our customers every day. They define the areas in which technical excellence is critical, not only for our business, but in the work we do daily to help customers achieve their important missions. VIEW OUR CAPABILITIES Markets We partner with some of the greatest minds to develop important work on the front lines of the world's most challenging markets. VIEW OUR MARKETS"
