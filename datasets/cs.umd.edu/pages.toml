c0/trap.png" srcSet="/static/1d538a6aabbfce85b9c2952296334a25/9814b/trap.png 750w,/static/1d538a6aabbfce85b9c2952296334a25/94363/trap.png 1080w,/static/1d538a6aabbfce85b9c2952296334a25/2a7f7/trap.png 1366w,/static/1d538a6aabbfce85b9c2952296334a25/d17c0/trap.png 1920w" alt="image of ion trap, gold plated, with a glowing object at center"/></picture>const t="undefined"!=typeof HTMLImageElement&&"loading"in HTMLImageElement.prototype;if(t){const t=document.querySelectorAll("img[data-main-image]");for(let e of t){e.dataset.src&&(e.setAttribute("src",e.dataset.src),e.removeAttribute("data-src")),e.dataset.srcset&&(e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset"));const t=e.parentNode.querySelectorAll("source[data-srcset]");for(let e of t)e.setAttribute("srcset",e.dataset.srcset),e.removeAttribute("data-srcset");e.complete&&(e.style.opacity=1,e.parentNode.parentNode.querySelector("[data-placeholder-image]").style.opacity=0)}}On the cloudA quantum cloud made for developersForget translating your work into yet another quantum SDK. IonQ works with all of the most popular cloud providers, libraries and tools. Just sign in and get to work.Learn more about The IonQ Quantum CloudPartner CloudsWhether you’re on , or , hardware access is just a few clicks away. Direct AccessIonQ partners enjoy direct access to our latest quantum hardware.Become a partner#importsfrom braket.circuits import Circuitfrom braket.aws import AwsDevice#hello many worldscirc = Circuit()circ.h(1)circ.cnot(control=1, target=0)#run on IonQ hardwareionq = AwsDevice("arn:aws:braket:::device/qpu/ionq/ionQdevice")job = ionq.run(circ, ("my_s3_bucket","my_s3_folder"), shots=100)print(job.result().measurement_counts)$ python3 braket_example.pyCounter( {'00': 49, '11': 51} ) .module.-company:before, .module.-company:after { content: ''; display: block; position: absolute; width: 100%; height: 100%; top: 0; left: 0; transition: opacity 0.5s ease 250ms; background-repeat: no-repeat; } .module.