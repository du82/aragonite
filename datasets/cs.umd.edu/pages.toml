["https://cs.umd.edu/location"]
title = "Location | UMD Department of Computer Science"
description = "Driving DirectionsFrom MetroFrom Local AirportsThe Department of Computer Science is headquartered in the Brendan Iribe Center for Computer Science and Engineering.The Computer Science Instructional Center (CSIC) is located adjacent to the Iribe Center.Driving DirectionsFrom Baltimore:Take I-95 South to the Capital Beltway (I-495) and follow signs to College Park, US Route 1 South. Proceed approximately two miles south on US Route 1 to the University's Campus Drive entrance. Turn right onto Campus Drive and immediately make another right turn onto Paint Branch Drive."
full_description = "Driving Directions From Metro From Local Airports The Department of Computer Science is headquartered in the Brendan Iribe Center for Computer Science and Engineering. The Computer Science Instructional Center (CSIC) is located adjacent to the Iribe Center. Driving Directions From Baltimore: Take I-95 South to the Capital Beltway (I-495) and follow signs to College Park, US Route 1 South. Proceed approximately two miles south on US Route 1 to the University's Campus Drive entrance. Turn right onto Campus Drive and immediately make another right turn onto Paint Branch Drive. The Xfinity Center Visitor Lot is located a short drive north on the lest. After exiting your vehicle, the Iribe Center is located a short walk south on Paint Branch Drive at the corner of Paint Branch Drive and Campus Drive. Additional parking is located at the Regents Drive Garage, a short walk west down Stadium Drive. From Annapolis and points east: Take US Route 50 to the Capital Beltway (I-95/495) and go north on I-95/495 to College Park, US Route 1 South (exit 25). Proceed approximately two miles south on US Route 1 to the University's Campus Drive entrance. Turn right onto Campus Drive and immediately make another right turn onto Paint Branch Drive. The Xfinity Center Visitor Lot is located a short drive north on the left. After exiting your vehicle, the Iribe Center is located a short walk south on Paint Branch Drive at the corner of Paint Branch Drive and Campus Drive. Additional parking is located at the Regents Drive Garage, a short walk west down Stadium Drive. From within the city of Washington, D.C.: Go northeast on Rhode Island Avenue (US Route 1). After entering the state of Maryland, continue on US Route 1 for approximately five miles to College Park. Turn left at the light onto Campus Drive and immediately make another right turn onto Paint Branch Drive. The Xfinity Center Visitor Lot is located a short drive north on the left. After exiting your vehicle, the Iribe Center is located a short walk south on Paint Branch Drive at the corner of Paint Branch Drive and Campus Drive. Additional parking is located at the Regents Drive Garage, a short walk west down Stadium Drive. From points south and west of Washington, D.C., and Montgomery County, MD: Take the Capital Beltway (I-495) and head north and east. Just after I-495 joins I-95 in Maryland above Washington, D.C., get off at exit 25B toward College Park on US Route 1 South. Proceed approximately two miles south on US Route 1 to the University's Campus Drive entrance. Turn right onto Campus Drive and immediately make another right turn onto Paint Branch Drive. The Xfinity Center Visitor Lot is located a short drive north on the left. After exiting your vehicle, the Iribe Center is located a short walk south on Paint Branch Drive at the corner of Paint Branch Drive and Campus Drive. Additional parking is located at the Regents Drive Garage, a short walk west down Stadium Drive. Via Metro WMATA Web Site and Map From Washington, D.C.: Take the Green Line train toward Greenbelt and get off at the College Park/U of MD station. Get on the UM Shuttle bus for the ride to the campus. Get off at the first campus stop, which will be directly in front of the Glenn L. Martin Institute of Technology. Walk back toward the entrance to campus. The Iribe Center is located at the corner of Paint Branch Drive and Campus Drive. From the Ronald Reagan National Airport: Take the Yellow Line train (toward Mt. Vernon Square/UDC) and get off at the Gallery Place/Chinatown station. Then transfer to the Red Line train (toward Wheaton) and get off at the Fort Totten station. Then transfer to the Green Line train (toward Greenbelt) and get off at the College Park/U of MD station. Get on the UM shuttle bus for the free ride to the campus. Get off at the first campus stop, in front of the Glenn L. Martin Institute of Technology. Get off at the first campus stop, which will be directly in front of the Glenn L. Martin Institute of Technology. Walk back toward the entrance to campus. The Iribe Center is located at the corner of Paint Branch Drive and Campus Drive. From the D.C. Bus Station (serving Greyhound and Trailways): From the Washington, D.C. bus station (at 1005 First Street N.E.), take Metro Bus 96 to Union Station and get onto the Red Line train (toward Wheaton). Get off at the Fort Totten station. Then transfer to the Green Line train (toward Greenbelt) and get off at the College Park/U of MD station. Get on the UM Shuttle bus for the ride to the campus. Get off at the first campus stop, which will be in front of the Glenn L. Martin Institute of Technology. Get off at the first campus stop, which will be directly in front of the Glenn L. Martin Institute of Technology. Walk back toward the entrance to campus. The Iribe Center is located at the corner of Paint Branch Drive and Campus Drive. From Local Airports From the Baltimore-Washington International (BWI) Airport: Upon exiting the airport, follow the signs and get onto I-195 West. Follow I-195 West for about 3.5 miles and get onto I-95 South. Follow I-95 South for about 19 miles and follow the signs to Exit 25. Get off at Exit 25B. Go south on U.S. Route 1 for two miles to the University's Campus Drive entrance on your right. Turn right onto Campus Drive and immediately make another right turn onto Paint Branch Drive. The Xfinity Center Visitor Lot is located a short drive north on the left. After exiting your vehicle, the Iribe Center is located a short walk south on Paint Branch Drive at the corner of Paint Branch Drive and Campus Drive. Additional parking is located at the Regents Drive Garage, a short walk west down Stadium Drive. From the Washington Dulles International (IAD) Airport: Upon exiting the airport, follow the Dulles Airport Access Road East for about 13 miles and exit it onto I-495 North. Follow I-495 North for about 18 miles and get off at Exit 25B. Go south on U.S. Route. 1 for two miles to the University's Campus Drive entrance on your right. Turn right onto Campus Drive and immediately make another right turn onto Paint Branch Drive. The Xfinity Center Visitor Lot is located a short drive north on the left. After exiting your vehicle, the Iribe Center is located a short walk south on Paint Branch Drive at the corner of Paint Branch Drive and Campus Drive. Additional parking is located at the Regents Drive Garage, a short walk west down Stadium Drive. From Ronald Reagan National (DCA) Airport: Upon exiting the airport to the north (toward Washington, D.C.), get onto the George Washington Memorial Parkway. Within a mile, turn right onto U.S. Route 1/I-395 North (to Washington). Stay in your left lane while crossing the bridge over the Potomac River. (You will follow U.S. Route. 1 through Washington to College Park). After crossing the Potomac and passing the Washington Monument on your left, turn right (east) onto Constitution Avenue. Go eight blocks and turn left (north) onto 6th Street N.W. Go about 1.5 miles and bear right onto Rhode Island Avenue. Then go 7.5 miles to College Park and turn left at the University's Campus Drive entrance. After turning left onto Campus Drive, make an immediate right-hand turn onto Paint Branch Drive. The Xfinity Center Visitor Lot is located a short drive north on the left. After exiting your vehicle, the Iribe Center is located a short walk south on Paint Branch Drive at the corner of Paint Branch Drive and Campus Drive. Additional parking is located at the Regents Drive Garage, a short walk west down Stadium Drive. View Larger Map"
