["https://cs.umd.edu/education/scholarships"]
title = "Scholarships | UMD Department of Computer Science"
full_description = "Andrew Reisse, class of 2001, was a brilliant computer graphics engineer, an avid photographer and hiker who loved nature, and a loyal friend. He was unique in so many interesting ways. He embodied a kind and utterly selfless disposition. He mentored and inspired everyone around him. While at the University of Maryland, Andrew was a College Park Scholar. He focused on computer science and met two friends, Michael Antonov '03 and Brendan Iribe. Together, they started a company known as Scaleform, which provides interface software for video games. Andrew was just 19 years old. In 2012, Andrew became co-founder and lead engineer for Oculus VR, Inc. helping to finally bring virtual reality into existence in an affordable and immersive way. Andrew loved games, but even more, he loved the technology behind them. His contributions span far and wide in the video game industry. Thousands of games played by millions of people around the world include software Andrew wrote. Despite all his work, he never bragged or boasted. When he wasn’t programming at the office, he was learning, enjoying nature, mountain climbing, and taking pictures often engaging in multi-day journeys with just his camera as a companion. His work can be enjoyed at www.reisse.net. This scholarship has been created in memory of Andrew by Oculus VR, Inc. and his parents, Dr. Robert '70, '76 and Mrs. Dana Reisse '73, who met at Maryland while pursuing their graduate studies. Contributions will establish an endowed scholarship to ensure that future Terps are given the same opportunity to change the world as Andrew did. Brendan Iribe, co-founder of Oculus VR, Inc. , has generously endowed a scholarship fund for computer science undergraduates. One scholarship will go to help a student from an under-represented population in the computer science field to bring a greater diversity to the forefront of the field. The other will go to a student who has a great financial need who is a stellar scholar. The purpose of this fund shall be to provide an annual scholarship to an outstanding computer science major at the University who displays a passion for computer science and another academic discipline or extracurricular activity, in addition to an interest in an emerging software engineering discipline."
