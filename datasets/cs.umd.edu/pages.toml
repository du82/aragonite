full_description = '''Generous donations have supported the construction of a new CS building. Learn more about The Iribe Center and how you can help. When you give to University of Maryland's Department of Computer Science, you are contributing to educating new generations of leaders. UMD would not remain among the top-ranked programs it is today without a strong foundation of alumni support. Your involvement is absolutely vital to our program so that CS students may learn, research and participate in the myriad of academic and professional opportunities made available to them. Once these students graduate from UMD with a degree in Computer Science, they will be ready to be creative and innovative members of the technical community and beyond. In the past, donor funds have contributed to attracting enterprising faculty, facilitating emerging opportunities of breakthrough research and continuing a tradition of undergraduate and graduate student excellence. Every gift matters! Your generous, tax-deductible donations can accomplish the following priorities: Department of Computer ScienceBrendan Iribe Center for Computer Science and EngineeringUniversity of Maryland8125 Paint Branch Drive College Park, MD 20742main phone: (301) 405-2662 <br /> <div class="um-brand"> <div id="logo"><a href="http://www.umd.edu" target="_blank">University of Maryland</a></div> </div> <p></p>'''
