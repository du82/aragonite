["https://cs.unc.edu/research/areas"]
title = "Research Areas - Computer Science"
description = "This page includes a list of research areas covered by faculty members in the Department of Computer Science. Because the department is constantly adding new faculty members and projects, this list may not be exhaustive at any given time. Click … Read more"
full_description = "Research Areas This page includes a list of research areas covered by faculty members in the Department of Computer Science. Because the department is constantly adding new faculty members and projects, this list may not be exhaustive at any given time. Click the toggle buttons to display a description of the research area. For more information on the individual projects in a research area, visit the associated faculty members’ webpages, which are linked from their names. A list of research groups and labs can be found on this page. Autonomous and Cyber-Physical Systems Subareas: Real-time and Embedded Systems, Sensor Systems, Mobile Computing, Control Theory and Systems, Formal Methods, Automated Verification and Certification Faculty: Alterovitz, Anderson, Chakraborty, Duggirala, Nirjon More on Autonomous and Cyber-Physical Systems Systems that benefit from a tight coupling of the modeling and analysis of physical plants and the hardware/software systems that control such plants are referred to as Cyber Physical Systems (CPS). The goal is to better integrate principles of control theory with real-time and embedded systems design, rather than designing the control strategies and their implementation platforms independently, which has traditionally been the case. Such a holistic design reduces the need for testing, and ad hoc implementations of controllers on distributed embedded platforms, and instead, supports automated synthesis, verification and certification. As we are rapidly moving towards the design of autonomous systems, such a disciplined approach towards the design and implementation of control algorithms, as promoted by CPS, is increasingly becoming important. The presence of complex sensors, like cameras, radars, and lidars – that are today common in autonomous cars, drones, or robots – introduce large processing delays, and offer different tradeoffs between accuracy, delay and resource requirements. These tradeoffs need to be explicitly accounted for when designing control algorithms that use such sensors. The distributed and multicore processing platforms on which control algorithms are implemented today also defy the traditional view of a centralized controller that has a synchronized access to all sensors, can compute all control inputs instantaneously, and can provide all actuations synchronously. Instead new controller design and implementation strategies that marry control theory with formal methods, and other branches of Computer Science like program analysis and compilers is becoming important. Bioinformatics and Computational Biology Subareas: Computational Genetics, Computational Immunology, Proteomics, Statistical Genetics, Single-Cell Bioinformatics Faculty: Ahalt, Krishnamurthy, Marron, McMillan, Snoeyink, Stanley More on Bioinformatics and Computational Biology Computational Genetics: Advances have been made over the last decade in our understanding of how genes influence phenotypes and contribute to disease susceptibility. It has become increasingly clear that the underlying mechanisms have a complex basis in which observed clinical outcomes result from a diverse range of causes interconnected through networks of genetic, biological and environmental interactions. The advances in high-throughput genotyping and sequencing have generated massive amounts of data that allow genome-wide analysis to be performed at much finer resolution than before, but at the same time posed great computational challenges. We have investigated a wide range of problems including haplotype inference, imputation, genome-wide association study, alternative splicing analysis, copy number variation detection, methylation, genome annotation and visualization. Immunology. Relevant People: Leonard McMillan; Collaborating Departments: Department of Biostatistics, Department of Genetics Computational Immunology: Advancements in high-throughput flow and mass cytometry technologies have enabled the ability to study the immune system at an unparalleled depth. Understanding immunological adaptations to particular diseases and in aging and development offers unique opportunities to develop novel diagnostic tests or to propose specialized treatments or lifestyle interventions to optimize human health. Using single-cell flow and mass cytometry data collected across multiple individuals, our goal is to develop new computational techniques to identify and link heterogeneity in the cellular landscape to external variables of interest, such as, a clinical phenotype or diagnosis. Recent advances in imaging cytometry also enable taking images of tissues and studying the spatial organization of immune cells. Application areas of interest include pregnancy, HIV, neuroimmunology, and T-cell biology. Relevant People Natalie Stanley; Collaborating Departments: Microbiology and Immunology, Computational Medicine Program, Department of Anesthesia Development and Differentiation, and Metagenomics: We use novel measurement techniques as well as machine learning methods in understanding the interplay between these areas, with the aim of discovering the forces that shape the immune system throughout life. The overarching goal is to apply the insights from such analyses to propose new treatments for cancers. Single-Cell Bioinformatics: Cellular heterogeneity, or the synergy of diverse and specialized cell-types drive a range of biological phenomena. Several technologies exist for measuring various properties (e.g. gene expression, protein expression) in individual cells, which allows for their comprehensive characterization and analysis in clinical or biological applications. Single-cell measurements can be studied in vitro to understand the etiology of disease. For example, in hypoxia of heart muscle cells, the cells become scar tissue and lose their muscle function. This process can be studied by looking at single cell transcriptomes to determine the order of events. Further, it can be possible to “reprogram” this sequence of events to avoid the adverse outcome. See some of our recent work in reprogramming scar tissue cells to recover some heat muscle cell functionality. Technologies and Data Science Problems: Single-cell datasets produced with technologies, such as single-cell RNA sequencing (scRNA-seq) or flow and mass cytometry reveal a unique data structure where there are several high-dimensional single-cell measurements per profiled sample, which need to be efficiently integrated. Flow and Mass Cytometry: Flow and mass cytometry are high-throughput single-cell proteomics technologies for systematic analysis of the immune system. Often applied for the analysis of human blood and tissue samples, the produced datasets can collectively contain millions of cells. We focus on developing new computational techniques for representing, dissecting, and mining this large volume of cells to identify immunological adaptations in disease and development. Relevant People: Leonard McMillan, Natalie Stanley Molecular Structure Modeling and Analysis: Diverse biological function is encoded in the atomic structure of macro-molecules such as Proteins and RNA. Understanding the sequence to structure to function relationships allows biochemists to predict the activity of genes and rationally design genes with novel biological function. Our interests include computational geometry models for molecular structure, high performance computing for dynamic simulation, mining structure motifs for protein functional prediction, remote homology detection, protein-protein interaction, and protein-ligand interaction. Relevant People: Jack Snoeyink[/expand] Computer Architecture Subareas: Accelerators, Clockless Logic, Energy-efficient Computing, Security Faculty: Porter, Singh, Sturton More on Computer Architecture Our department is engaged in research in several exciting new areas within computer architecture. Energy-Efficient Systems: With the explosive growth in mobile devices, there has been a push towards increasing energy efficiency of computation for longer battery life. Reducing power consumption is also important for desktop computing to alleviate challenges of heat removal and power delivery. A special focus in our department has been on the development of energy-efficient graphics hardware. Another area of future interest is energy-harvesting systems, which are ultra-low-power systems that operate on energy scavenged from the environment. Asynchronous or Clockless Computing: Asynchronous VLSI design is poised to play a key role in the design of the next generation of microelectronic chips. By dispensing with global clocks and instead using flexible handshaking between components, asynchronous design offers the benefits of lower power consumption, greater ease of integration of multiple cores, and greater robustness to manufacturing and runtime variation. Our researchers work on all aspects of asynchronous design, including circuits, architectures, and CAD tools. A key area of interest is application to network-on-a-chip for integration of multiple heterogeneous cores. Hardware-Enhanced Security: CPU vendors are increasingly deploying hardware to support security, such as Intel’s Software Guard Extensions. We are studying hardware/software co-design to support secure execution environments that are efficient and easy to program. Computer Graphics Subareas: Animation & Simulation, Graphics Hardware, Modeling, Rendering, Tracking, Virtual Environments, Visualization Faculty: Alterovitz, Chakravarthula, Fuchs, Marks, Sengupta, Singh, Snoeyink, Daniel Szafir, Danielle Szafir More on Computer Graphics Computer graphics research at UNC investigates the representation, creation, and manipulation of image data that serve as the visual interface between people and computers. One of our primary research focuses is interactive graphics where the main challenges are the rapid generation of photorealistic images and high-quality simulation in response to user inputs, as well as the development of both software and hardware mechanisms for human interaction with graphical systems. We provide users with convincing, interactive, often immersive experiences in a computer generated synthetic environment. Some of the recent research topics include image-generation algorithms, geometric and physics-based modeling, computer animation, multi-modal interaction techniques (including haptics, audio, and project-based rendering), model and motion acquisition, large-scale data management, analysis, and visualization, graphics hardware, display devices, and their applications. Computer Vision Subareas: Geometric Vision, Language & Vision, Recognition Faculty: Ahalt, Bansal, Bertasius, Ding, Marks, Sengupta More on Computer Vision The goal of computer vision is to extract information from visual data and help computers understand the visual world. Vision algorithms increasingly impact our everyday lives. They help to keep cars safely on the road, enable remote robotics operations in hazardous environments, reconstruct 3D models of cities, and organize photo collections, both personal and across the web. The research in computer vision at UNC spans the breadth of the field, and is a fertile ground for collaborations bringing together geometry and recognition, computer vision and natural language, sensing and display devices, theory, and system architectures for vision processing. The goal of the Language and Vision group is to develop a better understanding of the relationship between people, their visual data, and the language they use to describe that data. In particular, this includes developing methods to: describe images or video using natural language, predict how a person will refer to specific objects in complex real-world scenes, and answer natural language questions about images. The group also works on problems related to understanding what our pictures reveal about ourselves. Tasks include clothing and style recognition and are applied to clothing recognition and other e-commerce-related problems. Human-Computer Interaction Subareas: Assistive Technology, Haptics, Human Factors Analysis, Sound & Audio Display, User-Interface Toolkits, Virtual Environments Faculty: Dewan, Marks, Nirjon, Porter, Pozefsky, Srivastava, Stotts, Daniel Szafir, Danielle Szafir More on Human-Computer Interaction Within the area of Human-Computer Interaction, UNC’s main focus is on developing immersive 3D interaction systems. This includes head-mounted displays that lets our collaborators walk around inside their molecular data, ship designs, and architecture. It also includes force-feedback systems that let our collaborators touch molecules, feel the brush interacting with the canvas for virtual painting, and feel the 3D models they are sculpting. It also includes the real-time generation of physically-based surround sound to enable designers to hear how a space will sound and to improve the realism and engagement of game play. Our focus on making complete tools for our collaborators continues to push us to develop both software, hardware (graphics engines, trackers, hand-held interaction devices), and new interaction techniques to meet their needs. Wearable devices, such as smart watches and smart glasses, and other common sensors are increasingly facilitating new modes of interaction with modern computers—making the goal of ubiquitous computing realizable. A major research direction in HCI at UNC is exploring design techniques and system support to more easily extend desktop and phone applications onto devices with widely varying form factors and interaction modes. Another significant research direction at UNC is exploring assistive technologies for users with impairments, such as learning disabilities, blindness, and low vision. These populations face significant barriers to education and employment that we aim to reduce, as well as study different modes of interaction with computers. UNC also undertakes projects in computer-supported collaborative work, challenging the traditional paradigm of one user on one computer and enabling distributed users to simultaneously communicate with a program to collaborate with each other. Machine Learning and Data Science Subareas: Data Integration, Internet of Things, Knowledge Discovery, Machine Learning, Scientific Data Management, Visual Analytics Faculty: Ahalt, Bansal, Bertasius, Chaturvedi, Deng, Ding, Krishnamurthy, Marks, McMillan, Nirjon, Oliva, Sengupta, Srivastava, Danielle Szafir, Yao More on Machine Learning and Data Science Data Mining: Our group has a long history of developing data mining methods and has successfully applied them to solve problems in many other disciplines. Our interests include clustering and subspace clustering in high dimensional data, matrix factorization, graph mining and classification, efficient methods for large scale statistical tests. Machine Learning: The problems we study combine vast amounts and disparate types of "
