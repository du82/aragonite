full_description = "Master of Science in Computer Science Last edited: August 2024 This document lists the combined requirements of the Graduate School and of the Department of Computer Science (COMP) and supersedes all previous issues. Reference is occasionally made for further details to the Graduate School Handbook (GSH). Apparent errors in the present document should be called to the attention of the Director of Graduate Studies. Please note: Computer Science Graduate students cannot apply for both MS and PhD in the same semester; to determine which program to apply for, please see here. For MS students or ‘PhD students pursuing an MS degree along the way,’ COMP 992 must be taken in the same graduating semester. Students admitted as MS students that need to switch to a PhD program at end of year 2, can do so by either applying for the MS degree or foregoing the MS degree. The MS program has a 5-year clock. Please also refer to the Graduate Program Policies document for explanation of several issues not discussed in detail in this document. Table of Contents Advising Administration Courses Program Product Requirement Technical Writing Requirement Comprehensive Examination Other Requirements Milestones (By Semester) And Required Forms Supplemental Information (separate page) Satisfying the Technical Writing Requirement: Thesis Option Master’s Oral Comprehensive Exam Advising Advisers provide advice, of course, but they are also contact points for advising bulletins and alerting the student to academic progress milestones. During the faculty’s review of student progress, the adviser is called upon to describe the student’s progress and discuss any problems or delays in that progress. When a student enrolls in the department, a faculty member is appointed to serve as the student’s initial program adviser. While the department administration tries to match student and adviser interests in the assignment of initial program advisers, these assignments are based on incomplete information and are not binding. Students should change the faculty adviser as appropriate as the student’s plans and interests change. To request a change of adviser, the student should send the request by e-mail to the Student Services Manager with copies to the Director of Graduate Studies and the involved faculty (old and new advisers). Such requests are usually approved without comment, but factors such as faculty load sometimes intervene. Consultation with the Director of Graduate Studies is recommended in advance of a change of adviser for any reason other than designation of the research director as the program adviser. (Changes of adviser for that reason are completely normal and almost automatically approved.) If a student elects to write a thesis for the M.S. degree, the thesis adviser should be designated the official program adviser and chair of the student’s guidance committee. The Director of Graduate Studies serves as the backup adviser for routine signatures in case the program adviser is not available. Additional details can be found in the Graduate Program Policies document. Administration The Graduate Studies Committee (a standing committee of the department faculty, chaired by the Director of Graduate Studies) interprets degree requirements, approves plans of study, and acts on petitions from students to the department and to the Graduate School. A full-time Graduate Student Services Manager maintains student records, answers student queries, and directs student requests to the Graduate Studies Committee and to the Graduate School. All student requests should be made through the Student Services Manager, usually on CS forms or Graduate School forms. The Student Services Manager (kenney@cs.unc.edu) office is in Room 142 of the Fred Brooks Building. The Manager will handle the forms or forward them to the appropriate office. Courses Thirty (30) semester hours of courses numbered 400 or higher must be taken (excluding COMP 495, 496, 691H, 692H). Of these 30 hours, at least 18 hours must be in Computer Science (designated COMP in the catalog) numbered 400-890. The remaining 12 hours must include COMP 993: Master’s Thesis Research or COMP 992: MS Non-Thesis Option. Note: At least 3 hours of COMP 992 or 993 is required by The Graduate School. Also, no more than 6 credits of COMP 991 and no more than 6 credits of COMP 992/993 can be used towards the MS credit hour requirement. The remaining 9 hours, if outside COMP, should support MS graduate work (e.g., STAT courses for students focused on AI) and must be approved by the academic advisor in advance. The choice of courses is subject to approval by the Graduate Studies Committee in the mandatory review of the M.S. Program of Study (Form CS-3). Registrations for COMP 990 for research team meetings (denoted by section numbers > 100) do not count toward the credit hour requirement; other COMP 99x registrations do count as outside courses. The 30 credit hours should be related to the general goal of getting an MS in Computer Science. However, students are encouraged to take courses taught by a department other than COMP, as long as the course topic supports their general area of study in Computer Science. The Graduate Studies Committee can help clarify if a course would be eligible. Breadth requirement. Each student must take one course in each of the following categories to fulfill a breadth requirement. Theory & Formal Thinking Systems & Hardware Applications The set of breadth courses must meet the following criteria. At most one course in the set can be at the 500 level or COMP 455. The other courses must be at the 600 level or above. Waivers: Courses taken at UNC that satisfy the guidelines for the set of breadth courses will be accepted automatically and do not require a wavier. Students may submit a waiver request form to the student services manager, with any of the following justifications: (1) they have taken equivalent courses at another graduate program, and/or (2) they have equivalent professional experience, and/or (3) they have taken equivalent graduate courses taken during undergraduate study. Waivers are evaluated by the Graduate Studies Committee upon receipt of a course waiver form, on a case by case basis. The student’s mastery of content will be determined by the course grade in the set of three courses: a P- or better must be obtained in each course, and a Calingaert score of -3 or higher must be obtained on the three courses combined. The Calingaert Score is a weighted average of course grades, where the weights are chosen so that a score of 0 reflects an average letter grade between a P+ and an H-. The weights for the letter grades are as follows: Grade H+ H H- P+ P P- L+ L L- Weight +5 +3 +1 -1 -3 – 5 -7 -9 -11 For example, the Calingaert Score for three courses with letter grades P+, H-, and H would be (-1 + 1 + 3)/3 = +1.0 (assuming the three courses carry the same number of credit hours). The name recognizes Dr. Peter Calingaert, professor emeritus, who devised the measure when he was Director of Graduate Studies. Background Preparation. In addition, each student must demonstrate mastery of the subjects considered to be essential or required preparation for our graduate program. The following UNC courses define the required preparation for our program (for a more detailed description of course contents, consult the UNC course catalog). Effective Fall 2024, the faculty approved the following background requirements: Computer Science COMP 210 Data Structures COMP 311 Computer Organization COMP 455 Models of Languages and Computation COMP 550 Algorithms and Analysis Any two of the following: COMP 421 Files and Databases COMP 431 Internet Services and Networking COMP 433 Mobile Computing Systems COMP 520 Compilers COMP 524 Programming Language Concepts COMP 530 Operating Systems COMP 533 Distributed Systems COMP 541 Digital Logic and Computer Design COMP 590 Undergraduate Computer Architecture Mathematics and Statistics MATH 233 Calculus of Functions of Several Variables COMP 283 Discrete Structures or MATH 381 Discrete Mathematics MATH 347 Linear Algebra for Applications STOR 435 Introduction to Probability Typically most of this material will have been part of the student’s undergraduate education, but it is entirely normal to include one or more courses in the M.S. Program of Study to satisfy this requirement. Each student must detail their Background Preparation (Form CS-01) showing when and where the material above was mastered. In case of uncertainty about the material required in a particular course, consult an instructor of the course or the instructor(s) of courses that include the material as a prerequisite. The program advisor and the Graduate Studies Committee review background preparation. However, the advisor takes the primary responsibility for signing off on CS-01. For each required background, advisor will do one of the following: – If student has taken a corresponding course, advisor will verify via student transcript. – If student has taken a more advanced course (for which the background course is a must-have prerequisite), advisor will verify via student transcript and syllabus for the advanced course. The advisor will take care of not stretching this policy too far. For example, graduate-level Algorithms (such as COMP 750) can be used to vouch for the background requirement for undergraduate Algorithms (COMP 550). However, a seminar course in Parallel Computing (that has COMP 411, COMP 550, and COMP 530 as required prerequisites) can not be used to fulfill these three background requirements. Such a course only relies on some parts of these backgrounds, and can not train in all of the material covered in these courses. – If student has self-studied, advisor can request/collaborate with the corresponding instructor for the course to evaluate student. – If student has done research, which was needed to first learn the corresponding background, advisor can again evaluate student on the contents. Old background requirements. Students enrolled in the M.S. program during or before the 2024-25 academic year may use either the requirements above or the older background requirements below. Students who enroll in the M.S. program in Fall 2025 or later should use the background requirements above. Computer Science COMP 311 Computer Organization (offered as COMP 411 prior to Fall 2020) COMP 210 Data Structures (offered as COMP 410 prior to Fall 2020) COMP 550 Algorithms and Analysis Any two of the following COMP 421 Files and Databases COMP 520 Compilers COMP 530 Operating Systems COMP 524 Programming Language Concepts COMP 541 Digital Logic and Computer Design COMP 455 Models of Languages and Computation Mathematics, Statistics, and Physics MATH 233 Calculus of Functions of Several Variables COMP 283 Discrete Structures or MATH 381 Discrete Mathematics MATH 347 Linear Algebra for Applications MATH 661 Scientific Computing I (Introduction to Numerical Analsis) STOR 435 Introduction to Probability Transfer of MS Credits. Up to six semester hours of graduate credit may be transferred from another accredited institution, from courses taken at UNC-CH before admission to the Graduate School, or from courses taken in a different graduate program at UNC-CH, in partial fulfillment of the 30-hour total credits requirement (GSH: Course Credit). However, these credits must not have been used to satisfy the requirements for any previous degree (these were extra unused credits). Course transfers should be indicated on the Program of Study form and must be approved by the Graduate Studies Committee and by the Graduate School. The Graduate School may require the student to pass an examination on the course content before approving the transfer. Courses taken at Duke University, N.C. Central University, N.C. State University, UNC-Charlotte, and UNC-Greensboro count as home courses requiring no formal transfer if registered through inter-institutional registration (GSH: Registration). For early feedback on proposed courses, the student may submit to the Graduate Studies Committee their background preparation (on Form CS-01, approved by the program adviser), and a proposed plan of study (on Form CS-03) chosen after consultation with the program adviser. The student may submit a plan early to find out what will be acceptable, and may specify choices such as “Course x or Course y”, retaining the right to make the choice later if it is approved. COMP 910: Module Courses. COMP 910 is a device called a “module course” that permit a student to take part of a course for part of the credit. More details are available under Graduate Program Policies. Minor in Other Fields. The election of a minor field is optional and infrequent. Interested students can find more details under Graduate Program Policies. Courses Taught by Graduate Students. In the event that one COMP graduate student takes a course taught by another COMP graduate student, the Director of Graduate Studies should be consulted to determine whether credit can be granted. In general, it is encouraged that graduate students wait till the course is taught again by a faculty member. Program Product Requirement Each student is required to have programmed and documented a product-quality program product. A program product is a piece of software that is developed for the use of people other than the developer and for which there is evidence that it can be maintained by other developers after the initial developer is no longer working on it. This means that the student must demonstrate experience in the design, development, and documentation of a software product of significant size and complexity, preferably as part of a team. This requirement can be satisfied in one of the following ways. An undergraduate software engineering course, such as COMP 523, graduate course programming assignments or projects at UNC, RA programming assignments at UNC, or industrial experience (e.g. co-op or summer internship). The industrial experience must satisfy all of the following: the organization that you worked for has a software development process (this precludes, for example, a single person who asked you to build something) the requirements were given to you the software will be used by other people the code will be maintained by someone else after you completed it The project options must be approved by two faculty members. The student must file CS-13 to document completion of the requirement. Technical Writing Requirement Each student must demonstrate the ability to write a professional-quality technical document. There are three options available for satisfying this requirement, as follows: Comprehensive Paper Option The paper should be either a project report that includes a comprehensive survey of the literature, or a survey and synthesis of a substantial body of work. The document satisfying the technical writing requirement should be a product of"
