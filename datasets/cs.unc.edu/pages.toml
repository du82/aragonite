["https://cs.unc.edu/experience/study-abroad"]
title = "Study Abroad Program - Computer Science"
description = "The following are study abroad opportunities specific to computer science majors. While there are many opportunities to study abroad and they are all worthwhile experiences, there are several specific programs that we have pre-approved for computer science courses that we will … Read more"
full_description = "Study Abroad Program The following are study abroad opportunities specific to computer science majors. While there are many opportunities to study abroad and they are all worthwhile experiences, there are several specific programs that we have pre-approved for computer science courses that we will accept for the major (BA or BS) as satisfying the upper division COMP elective requirement. The pre-approved study abroad programs include: National University of Singapore University of New South Wales University of Lancaster University College Dublin Trinity College, Dublin Seoul National University Credit Transfer We limit the number of courses that may be transferred in for major credit to 2 courses. The reason for this limitation is to encourage the student to explore other areas while they are abroad and to assure that you get a breadth of computer science from our department. We want more than half of your elective courses to be taken from our department. We also will no longer give transfer credit for COMP 283, 210, 211, 301, or 311 from this or any other study abroad programs. This is not because the courses at other universities are inadequate, but because we want students to focus on courses that are not offered here, and taking the basic courses here assures that you have the specific topics that we assume in later courses. To facilitate the study abroad process, the department has decided to provide general computer science transfer credit that will count toward the major requirements without mapping courses taken abroad to specific UNC courses. It is still the responsibility of the student to confirm that the specific courses they are planning to take will be accepted by the department. Please contact Professor David Stotts to confirm transfer of credit."
