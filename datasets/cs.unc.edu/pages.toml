title = 'Azubeze "Beze" Uzoma - Computer Science'
full_description = 'Azubeze “Beze” Uzoma (function($) { $("body, html").addClass("heels_full_width_overflow"); })(jQuery); Azubeze “Beze” Uzoma Student Experience Manager (function($) { $("body, html").addClass("heels_full_width_overflow"); })(jQuery); Contact 131 Sitterson Hall auzoma@cs.unc.edu Biography Azubeze Uzoma is the Student Experience Manager for the Department of Computer Science, bringing extensive experience in student affairs and a passion for inclusive practices. He holds both a master’s degree and an undergraduate degree in communication studies from the University of North Carolina at Charlotte. Azubeze is dedicated to enhancing the academic and personal journey of each student, ensuring they thrive both academically and professionally. His approach centers on creating and implementing initiatives that promote student success, engagement, and well-being. He collaborates closely with faculty, staff, and students to ensure all voices are heard and valued. Leveraging his background in communication, Azubeze effectively connects with and supports the computer science student community, fostering a supportive and inclusive learning environment.'
