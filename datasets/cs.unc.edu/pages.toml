["https://cs.unc.edu/graduate/phd"]
title = "Doctor of Philosophy in Computer Science - Computer Science"
description = "last edited: September 2024 This document lists the combined requirements of the Graduate School and of the Department of Computer Science (COMP) and supersedes all previous issues. Reference is occasionally made for further details to the Graduate School Handbook (GSH). Apparent … Read more"
full_description = "Doctor of Philosophy in Computer Science last edited: September 2024 This document lists the combined requirements of the Graduate School and of the Department of Computer Science (COMP) and supersedes all previous issues. Reference is occasionally made for further details to the Graduate School Handbook (GSH). Apparent errors in the present document should be called to the attention of the Director of Graduate Studies. Please note: Computer Science Graduate students cannot apply for both MS and PhD degrees in the same semester. An MS student (or a PhD student ‘pursuing MS degree along the way’) must take COMP 992 in the same semester as applying for the MS degree. Students admitted as an MS student that need to switch to PhD at the end of year 2, can do so by either applying for the MS degree or foregoing the MS degree. The MS program has a 5-year clock. Please also refer to the Graduate Program Policies document for explanation of several issues not discussed in detail in this document. Table Of Contents Admission to Doctoral Program Advising Administration Course Requirements Program Product Requirements Doctoral Examinations Doctoral Written Examination Research Plan Discussion Doctoral Oral Examination Dissertation Final Oral Examination Residency & Time Limit Other Requirements Milestones (By Semester) And Required Forms Supplemental Information (separate page) Teaching as a Doctoral Student & COMP 915 Final Oral Examination (Doctoral Dissertation) Composition of Dissertation Committee Admission To Doctoral Program Admission to the doctoral program is by a vote of the Department faculty and is determined by performance on the Preliminary Research Presentation and Exam (PRP), course grades (we expect a positive Calingaert score computed over all courses taken as a graduate student at UNC), admissions information, accomplishment on assistantships, and other testimony from the faculty. Admission is normally considered following the PRP. Students who have been major contributors to a paper submitted to a well-known, refereed conference or journal may apply for a waiver of the PRP exam. Financial support from the department will normally not be provided beyond the fourth semester for students who have not been admitted to the doctoral program. Advising When a student enrolls, a faculty member is appointed to serve as the student’s academic adviser. As the student’s research interests become defined, the student should change to a research adviser as appropriate. Changes in adviser should be reported to the Student Services Manager. Additional details can be found in the Graduate Program Policies document. Administration The Graduate Studies Committee (a standing committee of the Department faculty, chaired by the Director of Graduate Studies) interprets degree requirements, approves plans of study, and acts on petitions from students to the Department and to the Graduate School. A full-time Graduate Student Services Manager maintains student records, answers student queries, and directs student requests to the Graduate Studies Committee and to the Graduate School. All student requests should be made through the Student Services Manager, usually on CS forms or Graduate School forms. The Student Services Manager (kenney@cs.unc.edu) office is in Room 142 of the Fred Brooks Building. The Manager will handle the forms or forward them to the appropriate office. Course Requirements The following are minimum requirements. The student’s committee may impose further requirements as it judges appropriate. Unless otherwise specified, “course” means a 3-hour graduate-level course. Two 1.5-hour courses may be accepted as equivalent to one 3-hour course. Taken “as a graduate student” does not necessarily mean at UNC-CH, and it permits the course to have been taken as a UNC-CH post-baccalaureate Continuing Education student. COMP 915: Each student must pass COMP 915. For students interested in teaching a course in the department, they must have completed this course before they can be assigned for teaching. Primary concentration. Three or four courses of which at least two support in depth the specific dissertation topic and at least one supports more generally the area of computer science in which the dissertation topic falls. The courses do not need to be related to each other, except in that they support the dissertation. These courses may have been taken as an undergraduate and may have been counted towards an undergraduate degree. Breadth requirement. Each student must take an additional 6 courses to fulfill a breadth requirement. Courses are classified into the following 4 categories. Theory & Formal Thinking Systems & Hardware Applications Outside of CS The set of six breadth courses must meet the following criteria. At least one course in each of the 3 CS categories, and at the 600 level or above. Normally no more than 2 courses in any category but students may petition to apply 3 in a category outside of their thesis research area(s). Waivers: Courses taken at UNC that satisfy the guidelines for the set of breadth courses will be accepted automatically and do not require a wavier. Students may submit a waiver request form to the student services manager, with any of the following justifications: (1) they have taken equivalent courses at another graduate program, and/or (2) they have equivalent professional experience, and/or (3) they have taken equivalent graduate courses taken during undergraduate study. Waivers are evaluated by the Graduate Studies Committee upon receipt of a course waiver form, on a case by case basis. PhD Computer Science graduate students that have a non-CS background can petition GSC (with justification) in order to consider exceptions for the breadth requirement. At most 1 CS course in the set of 6 courses can be at the 500 level or COMP 455. (We may consider 2, by petition to the Grad Studies Committee, for students with non-CS backgrounds doing interdisciplinary research.) COMP 550 is not allowed to be in the set. The non-CS courses must support either the dissertation research or the field of computer science, and be at the 400 level or above. If the course is not on the standard list, it must be approved by the Graduate Studies Committee. The student’s mastery of content will be determined by the course grade in the six courses satisfying the breadth requirement: a P- or better must be obtained in each course, and a Calingaert score of 0 or higher must be obtained on the six courses combined. The Calingaert Score is a weighted average of course grades, where the weights are chosen so that a score of 0 reflects an average letter grade between a P+ and an H-. The weights for the letter grades are as follows: Grade H+ H H- P+ P P- L+ L L- Weight +5 +3 +1 -1 -3 – 5 -7 -9 -11 For example, the Calingaert Score for three courses with letter grades P+, H-, and H would be (-1 + 1 + 3)/3 = +1.0 (assuming the three courses carry the same number of credit hours). The name recognizes Dr. Peter Calingaert, professor emeritus, who devised the measure when he was Director of Graduate Studies. Background Preparation. In addition, each student must demonstrate mastery of the subjects considered to be essential or required preparation for our graduate program. The following UNC courses define the required preparation for our program (for a more detailed description of course contents, consult the UNC course catalog). Effective Fall 2024, the faculty approved the following background requirements: Computer Science COMP 210 Data Structures COMP 311 Computer Organization COMP 455 Models of Languages and Computation COMP 550 Algorithms and Analysis Any two of the following: COMP 421 Files and Databases COMP 431 Internet Services and Networking COMP 433 Mobile Computing Systems COMP 520 Compilers COMP 524 Programming Language Concepts COMP 530 Operating Systems COMP 533 Distributed Systems COMP 541 Digital Logic and Computer Design COMP 590 Undergraduate Computer Architecture Mathematics and Statistics MATH 233 Calculus of Functions of Several Variables COMP 283 Discrete Structures or MATH 381 Discrete Mathematics MATH 347 Linear Algebra for Applications STOR 435 Introduction to Probability Typically most of this material will have been part of the student’s undergraduate education, but it is entirely normal to include one or more courses in the M.S. Program of Study to satisfy this requirement. Each student must detail their Background Preparation (Form CS-01) showing when and where the material above was mastered. In case of uncertainty about the material required in a particular course, consult an instructor of the course or the instructor(s) of courses that include the material as a prerequisite. The program advisor and the Graduate Studies Committee review background preparation. However, the advisor takes the primary responsibility for signing off on CS-01. For each required background, advisor will do one of the following: – If student has taken a corresponding course, advisor will verify via student transcript. – If student has taken a more advanced course (for which the background course is a must-have prerequisite), advisor will verify via student transcript and syllabus for the advanced course. The advisor will take care of not stretching this policy too far. For example, graduate-level Algorithms (such as COMP 750) can be used to vouch for the background requirement for undergraduate Algorithms (COMP 550). However, a seminar course in Parallel Computing (that has COMP 311, COMP 550, and COMP 530 as required prerequisites) can not be used to fulfill these three background requirements. Such a course only relies on some parts of these backgrounds, and can not train in all of the material covered in these courses. – If student has self-studied, advisor can request/collaborate with the corresponding instructor for the course to evaluate student. – If student has done research, which was needed to first learn the corresponding background, advisor can again evaluate student on the contents. Old background requirements: Students enrolled during or before the 2024-25 academic year may use either the requirements above or the older background requirements below. Students who enroll in the Ph.D. program in Fall 2025 or later should use the background requirements above. Computer Science COMP 311 Computer Organization (offered as COMP 411 prior to Fall 2020) COMP 210 Data Structures (offered as COMP 410 prior to Fall 2020) COMP 550 Algorithms and Analysis Any two of the following COMP 421 Files and Databases COMP 520 Compilers COMP 530 Operating Systems COMP 524 Programming Language Concepts COMP 541 Digital Logic and Computer Design COMP 455 Models of Languages and Computation Mathematics, Statistics, and Physics MATH 233 Calculus of Functions of Several Variables COMP 283 Discrete Structures or MATH 381 Discrete Mathematics MATH 347 Linear Algebra for Applications MATH 661 Scientific Computing I (Introduction to Numerical Analysis) STOR 435 Introduction to Probability Minor in Other Fields. The election of a minor field is optional and infrequent. Interested students can find more details under Graduate Program Policies. Program Product Requirement Each student is required to have programmed and documented a product-quality program product. A program product is a piece of software that is developed for the use of people other than the developer and for which there is evidence that it can be maintained by other developers after the initial developer is no longer working on it. This means that the student must demonstrate experience in the design, development, and documentation of a software product of significant size and complexity, preferably as part of a team. This requirement can be satisfied in one of the following ways. An undergraduate software engineering course, such as COMP 523 , Graduate course programming assignments or projects at UNC, RA programming assignments at UNC, or Industrial experience (e.g. co-op or summer internship). For industrial experience to qualify, it needs to satisfy all of the following: the organization that you worked for has a software development process (this precludes, for example, a single person who asked you to build something) the requirements were given to you the software will be used by other people the code will be maintained by someone else after you completed it The project options must be approved by two faculty members. The student must file Form CS-13 to document completion of the requirement. Doctoral Examinations A doctoral written examination, a doctoral oral examination, and a final oral examination covering the dissertation and other topics as required by the examining committee must be passed. Students must be registered the semester(s) in which exams are taken. Preliminary Research Presentation And Exam Doctoral Written Examination In the Department of Computer Science, the Comprehensive Paper Option of the Writing Requirement serves as the Doctoral Written Examination. It is identical to the written form of the M.S. Comprehensive Examination. If failed, the examination may be retaken, once only (except by petition). Research Plan Discussion The Department of Computer Science requires each PhD student to discuss their planned dissertation research with at least 3 potential members of their dissertation committee. This discussion is meant to precede the proposal-formulating phase and can be used to get preliminary feedback from the committee members on the planned research (as well as get the faculty member’s consent to serve on the dissertation committee). After consulting with their advisors, students could choose to set up either individual meetings with the prospective committee members, or could schedule a group meeting with their advisors and committee members. In these meetings, students may want to briefly summarize their research to date and provide a brief overview of the planned future directions. Slides may be used to guide the discussion but are not required. This discussion is not expected to go into as much detail as a proposal meeting would. The CS-12 form is submitted after the discussion. Doctoral Oral Examination The Doctoral Oral examination may be taken by any student who has been admitted to PhD candidacy. The examination, normally one and a half to three hours in length, will be administered by the student’s doctoral committee. The oral exam may be conducted with a majority (at least 3 members) of the committee; the full committee need not be formed to do an oral exam. The scope and format of the examination will be selected by the committee, which will inform the student in writing of its selection well in advance. As per the UNC graduate school handbook, the exam should be structured in such a way as to: 1) assess the extent and currency of the candidate’s knowledge in a manner that is as comprehensive and searching as the best p"
