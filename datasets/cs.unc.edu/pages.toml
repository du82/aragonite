 a team of Carolina researchers including Computer Science’s Shashank Srivastava, ShesPrEPared uses artificial intelligence to help women find their best option for HIV prevention. UNC CS has 11 computer vision and machine learning publications accepted by ECCV 2024 September 30, 2024 UNC CS researchers had 11 publications accepted by the 2024 European Conference on Computer Vision, a biennial conference covering computer vision and machine learning. The papers came from the research groups of seven d … Read more Planning for Student Success September 24, 2024 Director of Career Services Stephanie Johnson and Student Experience Manager Azubeze Uzoma are two staff members at the heart of the department’s initiatives to make sure its grads are not only technically skilled, but a … Read more UNC Computer Science introduces UNC CS Career Network via Heels Engage September 16, 2024 UNC Computer Science Department invites all alumni, current UNC students, faculty and staff to connect with each other through the new virtual networking community, UNC CS Career Network via Heels Engage. UNC real-time systems researchers receive multiple awards at ECRTS August 23, 2024 Members of the UNC Real-Time Systems Group were awarded two Outstanding Paper awards and a Best Presentation award at the 36th Euromicro Conference on Real-Time Systems (ECRTS) in Lille, France. 2024 UNC-Intel REU celebrates a summer of research and personal development August 15, 2024 The 2024 UNC-Intel Research Experience for Undergraduate Students brought 10 rising juniors to Chapel Hill to explore research projects in fields related to computer security. Students were guided by mentors from both UN … Read more UNC CS announces new chair, 7 new faculty additions for 60th year August 7, 2024 UNC Computer Science is excited to announce a new department chair and several additions to the faculty ahead of its 60th academic year. Szafir’s AI research tested at Mars Desert Research Station July 31, 2024 Artificial