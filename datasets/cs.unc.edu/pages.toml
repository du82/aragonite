["https://cs.unc.edu/research/entrepreneurship"]
title = "Entrepreneurship - Computer Science"
description = "Entrepreneurs’ Lounge The Timothy L. Quigg Entrepreneurs’ Lounge is a quiet place where budding Computer Science entrepreneurs can meet with colleagues from other disciplines, where organizations such as the Computer Science Entrepreneurs Club can hold events, where technology transfer staff … Read more"
full_description = "Entrepreneurship Entrepreneurs’ Lounge The Timothy L. Quigg Entrepreneurs’ Lounge is a quiet place where budding Computer Science entrepreneurs can meet with colleagues from other disciplines, where organizations such as the Computer Science Entrepreneurs Club can hold events, where technology transfer staff can meet with potential licensees for Computer Science patents and copyrights, where Computer Science start-up companies can meet to plan and organize, and where Computer Science faculty, graduate and undergraduate students, and staff can go to read, think and create! Timothy L. Quigg served as the Associate Chair for Administration, Finance and Entrepreneurship in the department for 18 years until his retirement in May 2013. In recognition of his dedication to entrepreneurship and commitment to excellence in research and education, the department rededicated the Entrepreneurs’ lounge upon his retirement, re-naming it the Timothy L. Quigg Entrepreneurs Lounge. Entrepreneurs’ Lounge Library The Entrepreneur’s Lounge Library operates on the Honor System. All are asked to practice good stewardship as items are borrowed and returned. All books in the library are available on a first come, first served basis and are subject to availability. Books are available on the open shelves for self-retrieval; you are responsible for returning borrowed items on time. The library is available for all departmental faculty, staff, and students. Please adhere to the following: Please borrow no more than one (1) item at once Recommended borrowing period: two (2) weeks Treat these books with regard for future readers Please do not write or highlight in any books that you borrow Books can be signed in/out in the white notebook located on coffee table. Office of Technology Commercialization The Office of Technology Commercialization (OTC), part of the Vice Chancellor’s Office for Innovation, Entrepreneurship, and Economic Development, is responsible for managing all aspects of UNC-Chapel Hill intellectual property. Additionally, as part of Innovate Carolina, OTC helps faculty, staff, and students effectively manage inventions and technologies that may have impact with or without commercialization. OTC provides funding and support and works closely with other University and external funders and resource providers to further develop and translate discoveries and technologies. OTC forges relationships with external partners in industry and business to help structure partnerships that bring UNC-Chapel Hill research to market. Furthermore, OTC provides services, training, and mentorship to promote entrepreneurship and startup company formation and assists startups with securing space, finding resources and funding, and assembling a proper leadership team. For more on resources for student entrepreneurs, contact Michael J. Fern (fern at cs.unc.edu) or Peter Liao (liaopb at cs.unc.edu)."
year_published = 2025
year_updated = 2021
