["https://cs.unc.edu/news-article/empowering-and-inspiring-the-next-generation-gwc"]
title = "Empowering and inspiring the next generation: Girls Who Code at UNC - Computer Science"
description = "At UNC CS, a powerful transformation is taking place. Each week, dozens of middle school and high school students gather in Sitterson, where student volunteers are helping to spark an interest in computer science. This is Girls Who Code (GWC) at UNC, where 75 UNC student volunteers are demonstrating that the next generation of tech creators and leaders could look very different from the last."
full_description = "Empowering and inspiring the next generation: Girls Who Code at UNC December 16, 2024 Here at UNC Computer Science, a powerful transformation is taking place. Each week, dozens of middle school and high school students gather in Sitterson, where student volunteers are helping to spark an interest in computer science. This is Girls Who Code (GWC) at UNC, where 75 UNC student volunteers are demonstrating that the next generation of tech creators and leaders could look very different from the last. Since its founding in 2016, GWC at UNC has become one of the department’s most dynamic student organizations. As part of the national Girls Who Code movement, the program offers free programming courses offered at two levels — beginner and advanced (the latter designed for returning students) — created specifically for students in grades 6-12 from Chapel Hill and surrounding communities. Growing nearly 300 percent in the last 2 years, the GWC program thrives through the dedication of a team of UNC student volunteers. These volunteers, who commit 3-4 hours each week, serve multiple roles: curriculum developers, classroom facilitators, marketing leads, and program managers. Their collective efforts transform abstract concepts into hands-on learning experiences, helping students navigate programming languages, logic, and problem-solving with increasing ease. UNC student volunteers facilitate an assignment during a Girls Who Code class “We’ve seen an incredible surge of interest,” said Sarah Zhang, co-lead for Girls Who Code at UNC. “Every year, more students join our classes, and our mission is to continue evolving our courses, partnerships, and resources to reach anyone who wants to learn. We’re committed to fostering an environment where every girl feels empowered to explore coding, no matter their background or experience.” Students who participate in the program receive eight weeks of classroom learning that culminates in a final project. Students present their projects to their peers, and family members in attendance at an end-of-semester celebration. Student participants produce exceptional work during this short time. In Spring 2024, GWC at UNC participant Madelyn Huang won the National GWC 2024 Coding Challenge with her project, Finance Finder. The feedback from parents and guardians reflects the commitment of the student volunteers with GWC at UNC. “It’s a great opportunity to introduce kids to coding at an early age and learning tends to be more fun from instructors who are seemingly closer in age to my student”, said one parent participant. Girls Who Code students get to know each other during a class in Sitterson Hall Over nine academic years, GWC at UNC has provided opportunities for early engagement in computer science education for approximately 600 students in the local community. And while the national Girls Who Code organization provides foundational support, partnerships fuel the program’s growth. Local tech company Bandwidth, who has sponsored GWC at UNC since 2023, offers financial support and mentorship to enhance the experience for both the student participants and UNC student volunteers. “Having served as a student volunteer for 3 years, I have gained so much from this experience,” said Pallavi Sastry, co-lead for GWC at UNC. “From leadership skills, to networking opportunities that will help achieve my personal career goals, the experiences and people I have met have provided me with opportunities that will extend beyond UNC.” As the field of computer science continues to evolve, GWC at UNC adapts its curriculum to reflect emerging trends. This spring, the organization plans to introduce a new track that delves deeper into application of python in the field of data science, ensuring participants gain the skills they need to succeed in the ever-changing tech field. With expansion comes new challenges, and chief among them is access to technology. Many local students need reliable laptops for weekly classes. To address this gap, the GWC at UNC chapter will collaborate with CS Experience Labs to establish a lending library of hardware resources, ensuring that every interested student, regardless of financial means, can fully participate. “We want this lending library to give our Girls Who Code participants and UNC CS students the tools they need to bring their ideas to life,” said Kris Jordan, Professor of the Practice and founder of the Computer Science Experience Labs. “No one should be held back by a lack of equipment.” If you’re interested in helping students gain access to essential technology, consider donating to the Lending Library through CS Experience Labs. Your contribution ensures the next generation of coders can fully explore their abilities. To learn more about GWC at UNC and other CS-sponsored student organizations, visit our student organizations webpage."
year_published = 2025
year_updated = 2024
