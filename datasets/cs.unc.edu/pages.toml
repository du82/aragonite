title = "Student Life - Computer Science"
description = "Code your CS journey. Here at UNC Computer Science, we work to help you thrive — inside and outside the classroom. Our goal is to build community, create hands-on learning experiences, and provide you resources to not only excel while … Read more"
full_description = "Student Life Code your CS journey. Here at UNC Computer Science, we work to help you thrive — inside and outside the classroom. Our goal is to build community, create hands-on learning experiences, and provide you resources to not only excel while you are here at Carolina but also as you pursue your future goals. Career Services Our Career Services team helps students transform coursework and technical skills into your desired internship and post-graduate job. From personalized career coaching and mock interviews to industry networking events and corporate partner workshops, we connect you with people and opportunities. Learn More CS Experience Labs (XL) Computer Science Experience Labs (CSXL), located in Sitterson Hall, serve as a collaborative co-working and computing hub, driving hands-on learning opportunities for CS majors. Programming is designed to accelerate your growth based on your interests, including software engineering, user experience design, production engineering, and product management. Learn More Student Experience Our Student Experience team focuses on broadening participation in computing (BPC) and fostering a sense of community and belonging. From student organizations to community events, we create spaces where every student can explore their interests, develop leadership skills, and engage more deeply with the department, ensuring that all students have the support, resources, and connections they need to thrive. Learn More Study Abroad Looking to take your CS education beyond Chapel Hill? We’ve curated a list of international classes and programs specifically suited to computer science students—each one offering courses that complement the major and broaden your global perspective. You can also find detailed credit transfer information, ensuring that the classes you take abroad fit seamlessly into your degree plan. Learn More"
