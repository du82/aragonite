["https://cs.unc.edu/student-life/cs-clubs"]
title = "UNC CS Clubs - Computer Science"
description = "There is a vibrant and active undergraduate and graduate community of computer science students at UNC. Involvement within UNC student organizations allow for students with shared interests to form smaller communities within the larger CS population. Connections to student organizations … Read more"
full_description = "UNC CS Clubs There is a vibrant and active undergraduate and graduate community of computer science students at UNC. Involvement within UNC student organizations allow for students with shared interests to form smaller communities within the larger CS population. Connections to student organizations also provide opportunities to build upon classroom learning through real-world application of skills. Organizations also expand upon learning in the classroom by offering educational programming, such as workshops and guest lectures from experts in their respective fields. The Department of Computer Science is committed to supporting students with shared interests in order to foster community among computer science students at UNC. This list may not be inclusive of all registered UNC student organizations with tech interests, the organizations below are those many CS students participate in, however being listed below does not necessarily indicate department affiliation. Looking for a full list of student organizations at UNC? Check here – UNC Heel Life website. Undergraduate Student Organizations Artificial Intelligence Club @ UNC (AI@UNC) Heel Life AI@UNC aims to break the barriers that limit student engagement with AI at UNC. Recognizing that AI isn’t exclusive to graduate students and upperclassmen, we believe that understanding AI is within reach of all students. We use a quality over quantity approach to deliver concentrated value for non-technical members seeking to understand the practical and ethical implications of AI and technical members seeking to build impactful tools guided by professors and more experienced technical chairs. Alpha Omega Epsilon Heel Life Alpha Omega Epsilon is a professional sorority for women with an interest (no major required) in engineering and technical sciences founded in 1983 that promotes friendship, leadership, and professionalism to all members of the organization, the community, and our professions. AOE aims to encourage our sisters to develop lifelong friendship bonds with each other and others in the community while striving for high scholarship and academic achievement. App Team Carolina Heel Life App Team Carolina provides a collaborative environment for UNC students to design, build, and release apps for Apple platforms and apply their skills to client projects where they get practical industry experience. Black in Technology (BiT) Heel Life Black in Technology is a student and technology-based organization, that dedicates itself to developing intensive programs for increasing Black and other ethnic participation in technology and Computer Science. BiT aims to improve the representation of Black students pursuing degrees in technology at the University of North Carolina at Chapel Hill. Carolina Analytics & Data Science (CADS) Heel Life Carolina Analytics & Data Science (CADS) is the largest data science student organization at UNC-Chapel Hill! CADS provides UNC students the opportunity to learn more about Data Science, connect with data science resources and opportunities, and meet fellow students, as well as potential mentors, interested in data science. Carolina AR/VR (CARVR) Heel Life Carolina AR/VR (aka CARVR) is UNC-Chapel Hill’s extended reality student organization, promoting student exploration and development of XR technologies. We host events and provide opportunities for our members to explore, learn, and develop within the XR space. We welcome undergraduate and graduate students across all fields of study. Additionally, we collaborate with faculty, industry professionals, and various organizations. Competitive Programming Club at UNC-CH Heel Life The Competitive Programming Club, serves to guide prospective programmers into the preparation for the ICPC (International Collegiate Programming Contest), and for coding assessments seen in technical interviews. Students of all programming levels are welcome! CS+Social Good at UNC Chapel Hill (CS+SG) Heel Life CS+Social Good is a student-led organization that works with local nonprofits to give them technology to empower their goals of social good. We choose partners each semester and create personalized technology for their needs, creating unique solutions without compromising industry standards. Development Society at Carolina Heel Life The purpose of our organization is to provide a space for students to learn, design and develop web applications using web technologies to build and improve their technical and problem solving skills. Edge Carolina Heel Life At Edge Carolina, we are more than just a club; we are a vibrant community of innovative thinkers and creative problem-solvers. As a student-led organization at the University of North Carolina at Chapel Hill, our mission is to empower individuals with a passion for product development and design, fostering an environment where creativity meets technology. UNC-Chapel Hill Esports Heel Life We are a video gaming community at UNC Chapel Hill that welcomes video game players from all walks of life. Whether you are a hardcore competitive gamer or you are more into casual games, there is a place for you with us. Our mission is to provide a fun, social space for the many video game players of all skill levels and interests at UNC through organized events; we want to promote the growth of the esports community and camaraderie between all gamers. UNC-CH Game Development Club Heel Life The mission of UNC-CH Game Development Club is to provide a space for anyone interested in learning how to develop video games, whether they have no experience in it whatsoever or are already seasoned game developers. The club is open to anyone that can contribute in the video game development process whether they are interested in programming, 3D modeling, character design, storyboarding, music, creative writing, or any other related creative processes. CS and non-CS backgrounds welcome. Girls Who Code (GWC) Heel Life Girls Who Code is a non-profit organization which aims to support and increase the number of women in computer science. The UNC Girls Who Code club aims to get middle- and high-school girls involved in and excited about technology. Any middle- or high-school girl can participate. UNC Computer Science undergraduate and graduate students can apply to become volunteers. HackNC Heel Life The HackNC Association organizes UNC’s annual co-ed hackathon! The goal is to create an inclusive, beginner-friendly space for people to innovate and collaborate on projects (hacks) over the course of a weekend. Kappa Theta Pi at UNC-CH Heel Life Kappa Theta Pi is UNC’s first professional technology-focused co-ed fraternity. The purpose of this organization is to provide a close-knit community for STEM students to develop socially, professionally, and academically through various events. We will host events including socials, hackathons, alumni networking events, professional development workshops, and tech-based community service. Our members will learn a plethora of skills needed to stay knowledgeable about the tech industry, form a valuable network of brothers, give back to the community via philanthropy, and develop a strong sense of professional development for future job positions. Latinos in Tech Heel Life Latinos in Tech is a student-led organization at UNC-Chapel Hill that intends to serve as a support system for Hispanic/Latino students interested in technology-related fields including computer science, data science, and information science. Pearl Hacks Heel Life Pearl Hacks is a weekend-long, beginner-friendly hackathon targeting women and gender non-conforming students, where people from all over come to learn and innovate using their coding skills. Teams of up to four participants will have 24 hours to complete a tech project of their choice, with the help of excellent sponsors, mentors, and workshops. Along the way, they’ll get to meet some fantastic people, enjoy fun games, collect swag, and eat free food. The hackathon is especially catered toward first-time hackers who are looking for an inclusive and supportive environment to explore the world of technology. Product Management Club at UNC (PM Club) Heel Life Undergraduate club for students interested in Product & Creative Problem Solving Quantum Computing Club at UNC Heel Life Quantum Computing Club at UNC-CH is Carolina’s first-ever quantum computing organization! We aim to teach our members about quantum computing and its many applications in cybersecurity, bioinformatics, chemical simulation, optimization, financial modeling, and AI/ML. Our events will include workshops, hackathons, guest speakers, presentations, and social events, giving you the chance to network and learn from experts in the field. Professional development and outreach education opportunities are available for those deeply invested in this technology. We cater to everyone from beginners to experts. queer_hack Heel Life Vision: We envision a future with a tech culture that is inclusive and accessible for LGBTQ+ people. Mission: We aim to empower LGBTQ+ students in tech by fostering peer connections and curating opportunities to grow as a programmer. Our event programming includes skill-building workshops, weekly study groups, social events, career networking opportunities, and an annual hackathon. Whether you’re already a Computer Science major or just interested in exploring coding, we’d love for you to join the community. Rams Hack Heel Life Rams Hack provides a learning environment for those interested in computer security and hacking culture. We participate in local and online “hacking” competitions. We can connect students with professional members of the community and sometimes host speakers from outside the university. TechX Heel Life A society developing Computer Science students academically, professionally, and socially. Upsilon Pi Epsilon Heel Life Upsilon Pi Epsilon is a honors society for computer and information science, aimed towards both undergraduate and graduate students. UPE can offer high-achieving students numerous opportunities for networking, engagement, scholarships, and more. Women in Computer Science (WiCS) Heel Life The Women in Computer Science club at UNC Chapel Hill (WiCS) is a social, professional, and academic organization to empower and enable women in computer science. We host a variety of events throughout the year aimed at bringing together the women in tech here on campus and supporting them through mentorship, informative talks, and networking events. Graduate Student Organizations Computer Science Student Organization (CSSA) CSSA represents all graduate students in the Department of Computer Science at UNC. It is not a club you have to join — if you are a graduate student in the department, you are a member. The CSSA offers several important services to students: Representing the students at faculty meetings Planning CSSA events Giving teaching awards to two professors each year Maintaining web pages Planning Candidates’ Weekend for admitted graduate students Graduate Women in Computer Science (GWiCS) GWiCS is a community of female graduate students to connect with each other and others in the Computer Science department, to foster an environment of collaborative research and to be a support system for each other. Some of the events and initiatives GWiCS leads throughout the semester include: Monthly social tea times Weekend social events Career and speaker series Mentorship program GQuiCS GQuiCS, pronounced as “g-quicks,” is all about creating a welcoming space for LGBTQIA+ graduate students, professionals, transfer students, or staff and faculty at the CS Department. This is a new initiative, if you are interested in connecti What does it mean to be a UNC Computer Science Student Organization? UNC Computer Science works with over 20 student organizations dedicated to the computer science student experience. These organizations range from academic-area focused, to competition teams, project-based & skill-building groups, professional fraternities and sororities, honor societies, and more. Additionally, UNC is home to thousands of student and community-based organizations across the campus. If a UNC registered student organization has an interest in collaborating with UNC Computer Science, please reach out er@cs.unc.edu. Criteria for collaboration with department: Each year the UNC CS Student Organization Support staff connects with organizations interested in collaborating with the department. These collaborative relationships are evaluated on a yearly basis, and require the following: Must be an UNC Registered Student Organization for the current academic year, meeting all requirements from the Office of Student Life and Leadership. Demonstrate a clear connection and benefit to UNC CS student community and/or the field of computing. Not replicate the purpose of an existing student organization that collaborates with the UNC CS department. Majority of organization members should be pre-CS or CS majors; as well as representation on leadership/executive groups from students within the department, UNC CS faculty/staff member advisor is also recommended. Responsibilities: In order to remain active within the department and eligible for department resources and support, the organization must do the following each academic year: Follow regulations and rules for student organizations established by UNC Office of Student Life and Leadership as well as University Code of Conduct. Maintain active registered student organization status on Heel Life. Attend events for student organization leadership, hosted by CS Student Organization Support Staff. Submit an annual report (via Google Form) in the Spring semester; form will be sent via email by the CS Student Organization Support staff. Coordinate, co-sponsor, or participate in at least one department-hosted event or program during the academic year. Examples include: “Hello CS” Fall Open House, MS/HS Department Open House, UNC Science Expo, broadening participation in computer science programs, etc. Adhere to specified bylaws and constitution for one’s organization. CS Student Organization Support staff will communicate important details related to student organization administration, events, and other pertinent information on a regular basis. Student organization leadership is expected to communicate any concerns in a timely manner. Organizations are expected to meet all deadlines set for them in these communications. If opportunities arise to partner with members of UNC CS Corporate Partners Program (CPP), organization leadership is expected to communicate with industry partners in a timely manner and inform CS Student Organization Support staff should any concerns arise when planning agreed upon events/programs. Benefits: The benefits of collaborating with the department, include: Opportunity to apply for additional funding from UNC CS Student Organization Support & Studen"
