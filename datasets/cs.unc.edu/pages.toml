["https://cs.unc.edu/person/benjamin-berg"]
title = "Benjamin Berg - Computer Science"
full_description = 'Benjamin Berg (function($) { $("body, html").addClass("heels_full_width_overflow"); })(jQuery); Benjamin Berg Assistant Professor (178) Ph.D. 2022, Carnegie Mellon. Performance modeling, scheduling, resource allocation, caching. (function($) { $("body, html").addClass("heels_full_width_overflow"); })(jQuery); Contact 336 Brooks Building 919-590-6012 Phone 919-590-6105 Fax ben@cs.unc.edu https://bsb20.github.io/ Biography Ben Berg is an assistant professor in the Department of Computer Science at UNC-Chapel Hill. Prior to this, he was a Ph.D. student in the Computer Science Department at Carnegie Mellon University, where he was advised by Mor Harchol-Balter. Ben works in the area of performance modeling, using stochastic models to optimize real-world computer systems. He has applied this approach to a variety of resource allocation problems including the scheduling of parallelizable jobs, and caching for large-scale web services. Ben was the recipient of a Facebook Graduate Fellowship in 2019 and an SOSP Best Paper Award in 2021.'
