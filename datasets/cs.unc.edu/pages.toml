["https://cs.unc.edu/commencement"]
title = "Computer Science Commencement 2025 - Computer Science"
description = "On This Page: Commencement Weekend Kick-Off Reception – Friday, May 9 Computer Science Doctoral Hooding Ceremony – Saturday, May 10 University Commencement – Saturday May 10 Computer Science Commencement – Sunday, May 11 Parking Information Photography Event Programs Commencement Weekend … Read more"
full_description = 'Computer Science Commencement 2025 (function($) { $("body, html").addClass("heels_full_width_overflow"); })(jQuery); On This Page: Commencement Weekend Kick-Off Reception – Friday, May 9 Computer Science Doctoral Hooding Ceremony – Saturday, May 10 University Commencement – Saturday May 10 Computer Science Commencement – Sunday, May 11 Parking Information Photography Event Programs Commencement Weekend Kick-Off Reception Drop by Sitterson Hall & Brooks Building for an informal celebration of graduates. Kick off the weekend reminiscing with family, friends, faculty, and staff, and grab some UNC CS swag to represent the department wherever you go. Drop in anytime between 4 p.m. and 6 p.m. on Friday, May 9. Light refreshments will be provided. Event Details Kick-Off Reception Friday, May 9, 2025 Sitterson Hall and Brooks Building 4:00 p.m. ET Venue Information Sitterson Hall & Brooks Building 201 S. Columbia St. Chapel Hill, NC 27599 Computer Science Doctoral Hooding Ceremony The Department of Computer Science will host a celebratory hooding ceremony and lunch reception on Saturday, May 10 in Sitterson Hall and Brooks Building to honor all doctoral graduates from the past year. The department’s lunch reception and hooding ceremony will conveniently follow the university hooding ceremony, which will be held at 9 a.m. on Saturday, May 10, in the Dean E. Smith Center. Doctoral graduates are encouraged to attend the university ceremony, then come to Brooks Building for lunch at 11:45 a.m. Doctoral graduates will be invited via email. Please let us know if you plan to attend, so that we can make appropriate accommodations. Event Details Lunch Reception for Doctoral Graduates and Guests Saturday, May 10, 2025 Brooks Building 11:45 a.m. ET Doctoral Hooding Ceremony Saturday, May 10, 2025 Sitterson Hall 1:00 p.m. ET Venue Information Sitterson Hall & Brooks Building 201 S. Columbia St. Chapel Hill, NC 27599 University Commencement Ceremony University-wide ceremonies are held in December and May to honor graduates. The university also holds a doctoral hooding ceremony in May. Details on University Commencement ceremonies can be found at commencement.unc.edu. The university’s spring commencement ceremony for all students will be held on Saturday, May 10 at 7 p.m. in Kenan Stadium. This year’s address will be delivered by world-renowned soccer player and 1994 graduate Mia Hamm. Computer Science Commencement Ceremony The Department of Computer Science holds a commencement ceremony each May in honor of December, May, and August graduates from the current academic year. These graduates, along with their guests, are invited to attend the ceremony in May. Graduates will be contacted via email and invited to participate in the event. Registration not required. Please check your email for full details on what to expect for the event. Please note that graduates do not receive their diploma during Commencement. Diplomas are mailed upon completion of degree requirements at a later date. No tickets are required for this event. Graduates should feel free to invite as many guests as they would like. Event Details Computer Science Commencement Ceremony Sunday, May 11, 2025 Dean E. Smith Center 11:00 a.m. ET Venue Information Dean E. Smith Center 300 Skipper Bowles Dr. Chapel Hill, NC 27514 Graduates: All graduates should arrive at 10:15 p.m. to the Smith Center. Please enter through the Entrance B doors. Students and faculty will line up based on their degree program on the Concourse between Entrances B & D. In order to participate in the ceremony, graduates must arrive by 10:45 p.m. Guests: All guests should enter through the Entrance A doors. Department representatives will be there to assist guests in finding the guest seating. There are a limited number of wheelchairs available for use during the ceremony. Please see a department representative at Entrance A for details. As indicated by the UNC Event Office, the clear bag policy will be in effect for all school, departmental, and small group ceremonies. Guests are encouraged to leave all bags at home or in their cars, but the following items will be permitted into the Smith Center: Any clear plastic or vinyl bag no larger than 12″ x 6″ x 12″, including gallon freezer bags Small clutch purses no larger than 4.5″ x 6.5″ Necessary medical items, following inspection at entry gates Up to two unopened 20-ounce or smaller bottles of water per person and empty drink containers that can be filled up at drinking fountains More Information can be found on the Kenan Stadium Policy page, and this policy will apply at all commencement ceremony venues Parking Information Please be aware that parking is extremely limited during the weekend of Commencement and even on the preceding weekdays. Expect road closures on campus, particularly on South Road between Country Club Road and Columbia Street and on Raleigh Street. Parking will hopefully be more readily available on Sunday for the department ceremony at the Smith Center, but this may not be the case if the university ceremony on Saturday night is postponed to Sunday due to weather. For the department ceremony at the Smith Center, university officials recommend parking in the following lots: Manning, Craige, and Bowles. Please see the official university commencement parking map here. For quick reference, the Dean E. Smith Center is located roughly between the South Campus and NC Botanical Garden labels on the map. Accessibility Commencement event officials do not supply disability parking permits. For those with disability plates or hang cards, you may find parking in the university-designated accessible lot, S11 Williamson (across the street from the Smith Center, serving the volleyball and tennis courts). University Transportation and Parking will provide a golf cart shuttle from the lot to Entry A of the Dean E. Smith Center. Photography Photo Specialties will document graduates in the Computer Science Department Ceremony on Sunday, May 12, 2024. Graduate information will be collected at the event in order to issue photo proofs, and we will also share a form here prior to the event. Event Programs Digital versions of our event programs can be read and downloaded here once they are available.'
