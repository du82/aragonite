title = "Speeding Up Scientific Progress Using Robots and AI in Laboratories - Computer Science"
description = "Researchers from UNC, including Distinguished Professor Ron Alterovitz and doctoral student Angelos Angelopoulos, describe how to transform science labs into automated factories of discovery by integrating robotic automation and AI."
full_description = "Speeding Up Scientific Progress Using Robots and AI in Laboratories October 23, 2024 Researchers from UNC-Chapel Hill describe how to transform science labs into automated factories of discovery by integrating robotic automation and AI. In the image above, (left to right) Professor Jim Cahoon, chair of the Department of Chemistry; Professor Ron Alterovitz, the Lawrence Grossberg Distinguished Professor in the Department of Computer Science; and Angelos Angelopoulos, a fourth-year graduate student in Alterovitz’s lab, pose with their AI-driven mobile robot for automating chemistry lab tasks. (Johnny Andrews/UNC-Chapel Hill) Robotic automation and artificial intelligence are on the brink of revolutionizing science laboratories and enabling more scientific breakthroughs in less time, according to UNC-Chapel Hill researchers in the paper, “Transforming Science Labs into Automated Factories of Discovery,” published in Science Robotics, the most prestigious journal covering robotics research. “Today, the development of new molecules, materials and chemical systems requires intensive human effort,” said Dr. Ron Alterovitz, senior author of the paper and Lawrence Grossberg Distinguished Professor in the Department of Computer Science. “Scientists must design experiments, synthesize materials, analyze results and repeat the process until desired properties are achieved.” Mobile robots operating alongside humans in chemistry labs, like this robot at the University of North Carolina at Chapel Hill, have the potential to automate experiments and accelerate scientific progress. (Angelos Angelopoulos, James F. Cahoon, and Ron Alterovitz) This trial-and-error approach is time-consuming and labor-intensive, slowing the pace of discovery. Automation offers a solution. Robotic systems can perform experiments continuously without human fatigue, significantly speeding up research. Robots not only execute precise experimental steps with greater consistency than humans, they also reduce safety risks by handling hazardous substances. By automating routine tasks, scientists can focus on higher-level research questions, paving the way for faster breakthroughs in medicine, energy and sustainability. “Robotics has the potential to turn our everyday science labs into automated “factories” that accelerate discovery, but to do this, we need creative solutions to allow researchers and robots to collaborate in the same lab environment” said Dr. James Cahoon, a co-author of the paper and chair of the Department of Chemistry. “With continued development, we expect robotics and automation will improve the speed, precision and reproducibility of experiments across diverse instruments and disciplines, generating the data that artificial intelligence systems can analyze to guide further experimentation.” Researchers from UNC-Chapel Hill describe how to transform science labs into automated factories of discovery by integrating robotic automation and AI. The researchers analyzed the challenges of automating science laboratories as their ability to conduct experiments across scientific domains increases. (Angelos Angelopoulos, James F. Cahoon, and Ron Alterovitz, with drawings by Jade Kandel) The researchers defined five levels of laboratory automation to illustrate how automation can evolve in science labs: Assistive Automation (A1): At this level, individual tasks, such as liquid handling, are automated while humans handle the majority of the work. Partial Automation (A2): Robots perform multiple sequential steps, with humans responsible for setup and supervision. Conditional Automation (A3): Robots manage entire experimental processes, though human intervention is required when unexpected events arise. High Automation (A4): Robots execute experiments independently, setting up equipment and reacting to unusual conditions autonomously. Full Automation (A5): At this final stage, robots and AI systems operate with complete autonomy, including self-maintenance and safety management. The newly defined levels of automation can be used to assess progress in the field, help in establishing appropriate safety protocols and set goals for future research in both science domains and robotics. Although lower levels of automation are common today, achieving high and full automation is a research challenge that will require robots capable of operating across different lab environments, handling complex tasks and interacting with humans and other robotic systems seamlessly. Artificial intelligence plays a key role in advancing automation beyond physical tasks. AI can analyze vast datasets generated by experiments, identify patterns and suggest new compounds or research directions. Integrating AI into the laboratory workflow will allow labs to automate the entire research cycle—from designing experiments to synthesizing materials and analyzing results. In AI-driven labs, the traditional Design-Make-Test-Analyze (DMTA) loop can become fully autonomous. AI could determine which experiments to conduct, make real-time adjustments, and continuously improve the research process. While AI systems have shown early success in tasks like predicting chemical reactions and optimizing synthesis routes, the researchers caution that AI must be carefully monitored to avoid risks, such as the accidental creation of hazardous materials. Transitioning to automated labs presents significant technical and logistical challenges. Laboratories differ widely in their setups, ranging from single-process labs to large, multiroom facilities. Developing flexible automation systems that work across diverse environments will require mobile robots capable of transporting items and performing tasks across multiple stations. Training scientists to work with advanced automation systems is equally important. Researchers will need to develop expertise not only in their scientific fields but also awareness of the capabilities of robots, data science and AI to accelerate their research. Educating the next generation of scientists to collaborate with engineers and computer scientists will be essential for realizing the full potential of automated laboratories. “The integration of robotics and AI is poised to revolutionize science labs,” said Angelos Angelopoulos, a co-author of the paper and research assistant in Dr. Alterovitz’s Computational Robotics Group. “By automating routine tasks and accelerating experimentation, there is great potential for creating an environment where breakthroughs occur faster, safer and more reliably than ever before.” The research paper is available online in the journal Science Robotics. Written by David DeFusco"
year_published = 2025
year_updated = 2024
