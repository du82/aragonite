description = "The Department of Computer Science received the following national and international rankings: Ranked #27 among U.S. computer science graduate schools (tied), U.S. News & World Report, 2024 Rankings of computer science doctoral programs were based on results of surveys sent to … Read more"
full_description = "Rankings The Department of Computer Science received the following national and international rankings: Ranked #27 among U.S. computer science graduate schools (tied), U.S. News & World Report, 2024 Rankings of computer science doctoral programs were based on results of surveys sent to department heads and directors of graduate studies at each program in the discipline. Ranked #20 in the world and #10 among U.S. computer science and engineering programs in the Global Ranking of Academic Subjects for Computer Science & Engineering, ShanghaiRanking Consultancy, 2021 All universities with at least 150 computer science and engineering research publications between 2014 and 2018 were eligible, and the top 500 were ranked. Ranked between #6 and #36 among doctoral programs in computer sciences, National Research Council report, 2010 Ranking (provided in ranges on a 90% confidence interval) based on criteria that are valued highly by scholars (S-rank) resulted in a range between #6 and #36. Ranking based on programs’ similarity to other highly rated programs (R-rank) resulted in a range between #5 and #14. The University of North Carolina at Chapel Hill received the following national and international rankings: Ranked #5 best public university, U.S. News & World Report, 2025 UNC-Chapel Hill has spent two decades with a top-5 ranking. Ranked #27 among national universities, U.S. News and World Report, 2025 U.S. News evaluated nearly 1,500 U.S. four-year bachelor’s degree-granting institutions on as many as 19 measures reflecting academic quality and graduate outcomes. Ranked #4 best value public college, The Princeton Review, 2024 Best Value Colleges for 2024 were chosen based on data collected from fall 2023 through spring 2024 via our institutional and student surveys and alumni career and salary statistics. The ranking weighed more than 40 data points covering academics, costs, financial aid, debt, grad rates, and career/salary data. Ranked #29 among worldwide universities and #20 in the U.S., ShanghaiRanking Consultancy, 2021 Ranked #1 among U.S. public colleges and universities offering high-quality academics at an affordable price, Kiplinger’s Personal Finance magazine, 2019 For the 18th consecutive time, UNC-Chapel Hill ranked 1st on campuses that provide the best value to in-state students. Kiplinger’s changed its methodology in 2012 to more strongly emphasize value because of the economic challenges facing higher education. The formula considered the percentage of students returning as sophomores and four-year graduation rate. It also favored campuses with low sticker prices and abundant financial aid, with bonus points for schools that keep student borrowing low. Ranked #1 among all U.S. public research universities for producing the most Rhodes Scholars in the past 5, 10, and 25 years, The Rhodes Trust, 2014 Since the U.S. Rhodes Scholar program began, 48 students have been selected from UNC-Chapel Hill. Ranked #12 undergraduate program and #11 graduate program for entrepreneurs in 2015, Entrepreneur magazine and the Princeton Review, 2014 Top schools were recognized for teaching business fundamentals, staffing with successful entrepreneurs, and providing experiential or entrepreneurial opportunities outside the classroom. Ranked #9 in federal funding devoted to research and development among leading private and public research universities, National Science Foundation, 2012 During fiscal year 2010, UNC-Chapel Hill received $545.99 million in federal funding for research and development, and the school has climbed 10 spots since 2008. Ranked #8 among American public research universities, The Center for Measuring University Performance at Arizona State University, 2010 Top research universities with at least $40 million in annual federal research funding were evaluated using quantitative measures such as endowment assets, private giving, faculty awards, doctorates granted, postdoctoral appointees and SAT/ACT range."
