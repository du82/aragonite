title = "Recent News - Computer Science"
full_description = 'Recent News (function($) { $("body, html").addClass("heels_full_width_overflow"); })(jQuery); Bansal elected AAAI Fellow January 31, 2025 Distinguished Professor Mohit Bansal was elected a Fellow of the Association for the Advancement of Artificial Intelligence. The distinction is reserved for “individuals who have made significant, sustained contributions — usually over at least a ten-year period — to the field of artificial intelligence.” View Story Featured Stories UNC real-time systems researchers receive multiple awards at ECRTS August 23, 2024 Members of the UNC Real-Time Systems Group were awarded two Outstanding Paper awards and a Best Presentation award at the 36th Euromicro Conference on Real-Time Systems (ECRTS) in Lille, France. 2024 UNC-Intel REU celebrates a summer of research and personal development August 15, 2024 The 2024 UNC-Intel Research Experience for Undergraduate Students brought 10 rising juniors to Chapel Hill to explore research projects in fields related to computer security. Students were guided by mentors from both UNC Computer Science and Intel. Szafir’s AI research tested at Mars Desert Research Station July 31, 2024 Artificial intelligence research supervised by Associate Professor Daniel Szafir was evaluated at the Mars Desert Research Station in Utah. The study involved an autonomous robot navigating the Mars-like terrain to assess its own abilities and communicating results to a human user assigning its tasks. Cho earns Bloomberg Data Science Ph.D. Fellowship June 25, 2024 Doctoral student Jaemin Cho received a prestigious Bloomberg Data Science Ph.D. Fellowship. Cho was one of only nine selected for the 2023-2024 cohort. Recent Headlines Bansal elected AAAI Fellow January 31, 2025 Bansal recognized with Presidential Early Career Award for Scientists and Engineers January 15, 2025 UNC computer science, data science researchers present work at NeurIPS 2024 January 10, 2025 Empowering and inspiring the next generation: Girls Who Code at UNC December 16, 2024 View All News'
