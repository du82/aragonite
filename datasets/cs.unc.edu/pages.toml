["https://cs.unc.edu/about/faculty-hiring"]
title = "Faculty Hiring - Computer Science"
description = "Department and University Rankings About the Department About the University About the Chapel Hill Area The University of North Carolina at Chapel Hill is an equal opportunity and affirmative action employer. All qualified applicants will receive consideration for employment without … Read more"
full_description = "Faculty Hiring Department and University Rankings About the Department About the University About the Chapel Hill Area The University of North Carolina at Chapel Hill is an equal opportunity and affirmative action employer. All qualified applicants will receive consideration for employment without regard to age, color, disability, gender, gender expression, gender identity, genetic information, national origin, race, religion, sex, sexual orientation, or status as a protected veteran. Tenure-Track Faculty Positions If you have questions about our tenure track positions that are not addressed by the linked postings or have issues submitting applications, please email Shahriar Nirjon (nirjon@cs.unc.edu). Assistant Professor The Computer Science Department at UNC Chapel Hill invites applications for multiple tenure-track Assistant Professor positions, with appointments beginning on or after July 1, 2025. The department has a strong presence in key areas such as machine learning, natural language processing, computer vision, graphics, augmented and virtual reality, medical imaging, robotics, visualization, real-time systems, embedded and cyber-physical systems, formal verification, mobile computing, security, computer systems, and bioinformatics. We plan to continue expanding in these and related domains and welcome applications from individuals working in these or closely aligned fields. Areas of Focus We are seeking candidates who specialize in artificial intelligence (AI), machine learning, or computer systems, as well as those whose work intersects with areas like cybersecurity, AI ethics, responsible AI, and other interdisciplinary domains. We welcome individuals working on emerging technologies like large language models, AR/VR, and computer vision, as well as foundational fields such as programming languages, operating systems, computer architecture, and computational theory. Our department values interdisciplinary collaboration, particularly in addressing societal challenges related to security, AI, and ethics, and seeks candidates who can bridge diverse areas within computer science. One of the positions is part of a cluster hire at the University of North Carolina at Chapel Hill, which also includes additional positions in the Department of Statistics and Operations Research and the Department of Philosophy. While this position is fully housed in the Department of Computer Science, the ideal candidate will have research and/or teaching interests that make substantive connections with related fields and will be enthusiastic about engaging in cross-disciplinary conversations and collaborations. Qualifications and Submission Details Candidates must hold a Ph.D. (or foreign equivalent) in computer science, electrical engineering, computer engineering, or a closely related field. Successful applicants should demonstrate a strong track record in externally funded research, teaching, mentoring, and a commitment to diversity and collaboration. Applications will continue to be accepted and given full consideration until the position is filled.* To apply, please submit a (1) cover letter, (2) curriculum vitae, and (3) the names and contact details of four references through our online job posting portal. For more information and to apply, go to unc.peopleadmin.com/postings/288520. *Please disregard verbiage on the application website, UNC People Admin, regarding the November 1st deadline. Applications will continue to be accepted until positions are filled. Teaching Faculty Positions If you have questions about our teaching faculty positions that are not addressed by the linked postings or have issues submitting applications, please email Kris Jordan (kris@cs.unc.edu). Teaching Assistant Professor The Department of Computer Science invites applications for the position of Teaching Assistant Professor. We seek applications from individuals with exceptional promise for, or a proven record of, teaching computer science topics in a diverse undergraduate university environment using evidence-based pedagogical practices. This position is responsible for teaching foundational courses aligned with the instructor’s expertise and passion with possibilities including introduction to programming (CS1), data structures, object-oriented programming with design patterns, systems programming fundamentals, computer architecture, discrete mathematics, theory of computation, and analysis of algorithms. The position also has opportunities to teach upper-division major courses, such as compilers, first-year seminars, Honors Carolina courses, and lead summer study abroad programs. The position will include training, supervising, and evaluating graduate teaching assistants and undergraduate learning assistants. The position is a state-appropriated, permanent faculty line with an initial term of three years, to be renewed for up to five year intervals, and has a promotion path to Teaching Associate Professor and Teaching Professor. Candidates must have at least a Master’s degree in Computer Science or a closely related field and prior experience teaching technical concepts informally in either an industrial or academic context. Experience teaching large courses, utilizing evidence-based pedagogical practices such as active learning, and employing instructional technologies to manage scale is desired. For more information and to apply, go to unc.peopleadmin.com/postings/287873."
