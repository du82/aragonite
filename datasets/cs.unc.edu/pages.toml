["https://cs.unc.edu/person/anselmo-lastra"]
title = "Anselmo Lastra - Computer Science"
full_description = 'Anselmo Lastra (function($) { $("body, html").addClass("heels_full_width_overflow"); })(jQuery); Anselmo Lastra Professor Emeritus (52) Ph.D. 1988, Duke. Interactive 3D computer graphics; hardware architectures for computer graphics. (function($) { $("body, html").addClass("heels_full_width_overflow"); })(jQuery); Contact lastra@cs.unc.edu Biography Anselmo Lastra is a former professor and chair of the Department of Computer Science at the University of North Carolina at Chapel Hill. Dr. Lastra received a BS in Electrical Engineering from the Georgia Institute of Technology, and MS and PhD degrees in Computer Science from Duke University. His research interests are in the areas of image-based modeling and rendering, and graphics hardware architectures. He worked on the Pixel-Planes and PixelFlow series of highly parallel graphics accelerators, which were the fastest graphics engines of their time. A significant milestone achieved on PixelFlow was the first use of a high-level language for programmable shading on graphics hardware, demonstrated in 1998. Dr. Lastra has served as associate editor of IEEE Computer Graphics and Applications and as an associate editor for IEEE Transactions for Visualization and Computer Graphics from 2003 to 2007. He was co-chair of the Symposium on Interactive 3D Graphics in 2005, co-chair of Graphics Hardware in 2002 and 2004, program chair in 2001 and papers chair in 2000. In addition, he served as courses chair for SIGGRAPH 2000 and outreach chair for SIGGRAPH 2003 through 2005.'
