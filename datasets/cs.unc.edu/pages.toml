title = "Undergraduate Courses for Non-CS Majors - Computer Science"
description = "Think that simply being able to use a computer is enough? Think again! A thorough understanding of information technology will be necessary for success in all fields in the future. The most important changes in the twenty-first century will be in … Read more"
full_description = "Undergraduate Courses for Non-CS Majors Think that simply being able to use a computer is enough? Think again! A thorough understanding of information technology will be necessary for success in all fields in the future. The most important changes in the twenty-first century will be in the redefinition of all fields to take advantage of the technological enhancements that are available to them. Leadership in all disciplines will require fluency in information technology and it is critical for a diverse population to be driving these changes. What courses are available at UNC for learning more about computers? The Computer Science Department offers a number of introductory courses, for both majors and non-majors. COMP 101: Fluency in Information Technology is our primary course for non-majors interested in a better understanding of computers. In addition, we offer: First Year Seminars: We offer a broad range of first year seminars, from building robots to producing graphics movies. Computers Make it Possible (COMP 050): Explores how computers can make a difference in the world. The class covers broad topics such as how computers work and their influence on society as well as more detailed subjects such as the fundamentals of how to build a web page. Robotics with LEGO® (COMP 060): Explores process of design, and nature of computers, by designing, building and programming LEGO robots. Previous programming experience is not required. Random Thoughts (COMP 066): Explores the notions of “randomness” and its antithesis, “structure.” What does “random” mean? How do computers generate “random” numbers and just how random are they? Is the addition of random noise to a signal always bad? (The answer is no!) Introductory programming courses (COMP 110, 116) have different sections that focus on general computing, scientific computing or web applications. The major objective of all these courses is to teach the student how to solve problems using algorithmic thinking. Introduction to Programming (COMP 110): Fundamental programming skills are taught using object-oriented programming and Java. This fall, we are introducing a section that teaches you to program through web applications. Introduction to Scientific Programming (COMP 116): An introduction to programming for computationally oriented scientists. Fundamental programming skills are taught using MATLAB. Computers and Society (COMP 380) is a discussion-based course that identifies cultural and economic effects of information technology and explores ethics relating to its use and implementation. Who teaches computer science courses? Most of our classes, including first year seminars, are taught by faculty members. In introductory programming courses where we need small class sizes, we have advanced Ph.D. students teaching some sections. Are there student clubs associated with computer science? Please visit our Clubs page to see a list of current clubs and find out how to get involved."
