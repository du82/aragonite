description = "Connecting industry to future tech leaders With a unique combination of CS curriculum and a liberal arts foundation, UNC Computer Science students are prepared to lead and innovate. UNC CS Corporate Partners have exclusive opportunities to engage with some of … Read more"
full_description = "Corporate Partners Program Connecting industry to future tech leaders With a unique combination of CS curriculum and a liberal arts foundation, UNC Computer Science students are prepared to lead and innovate. UNC CS Corporate Partners have exclusive opportunities to engage with some of the most talented, diverse, and well-rounded computer science students. From exclusive recruiting opportunities to Partner-only events to support of largescale student hackathons, Partner-level sponsorship provides impactful access to students that goes beyond the traditional career fairs, information sessions, and job postings by creating a targeted program with your specific recruiting goals in mind. Access Competition for UNC CS graduates is fierce. Graduates have their pick of employers nationwide. Corporate Partners have first access to these students to create a pipeline of tech talent to achieve your recruiting goals. Visibility UNC CS Corporate Partners are supported by an expansive mix of engagement and communication initiatives that allow for maximum visibility to students regarding opportunities and specific company information. Strategy & Support The UNC CS Corporate Partners team will develop custom engagement strategies aligning with your company’s specific recruiting goals and will act as an extension of your corporate recruiting team. Together, we aim to create a full year of offerings that will benefit both employers and students. We will offer opportunities to engage in virtual and in-person environments, depending on the needs of your organization."
