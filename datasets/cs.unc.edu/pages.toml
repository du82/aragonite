full_description = 'Danielle Szafir (function($) { $("body, html").addClass("heels_full_width_overflow"); })(jQuery); Danielle Szafir Associate Professor (173) Ph.D. 2015, Wisconsin. Visualization, data analytics, computer graphics, virtual and augmented reality. (function($) { $("body, html").addClass("heels_full_width_overflow"); })(jQuery); Contact 246 Brooks Building 919-590-6074 Phone 919-590-6105 Fax danielle.szafir@cs.unc.edu https://danielleszafir.com/ Biography Danielle Albers Szafir is an Assistant Professor of Computer Science at the University of North Carolina-Chapel Hill. Prior to joining the department, she was an Assistant Professor of Computer Science, an Affiliate Professor of Information Science and Aerospace Engineering, and a Fellow in the ATLAS Institute and Institute of Cognitive Science at the University of Colorado Boulder. Her research, which sits at the intersection of information visualization, data science, and cognitive science, has been integrated into leading tools such as D3 and Tableau and received best paper awards at IEEE VIS, IEEE VR, ACM CHI, and IS&T CIC. She was named to the Forbes 30 Under 30: Science list in 2018 and received the NSF CAREER Award in 2021. Her work is funded by the NSF, US Air Force, J.P. Morgan Chase, U.S. Space Force, and DHHS. She received a bachelor’s degree in computer science at the University of Washington as a NASA Space Grant Scholar and a doctorate in computer sciences at the University of Wisconsin-Madison.'
