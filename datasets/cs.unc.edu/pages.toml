description = "The Computer Science Experience Labs (CSXL) are a technical experience accelerator, community hub, and co-working space for undergraduate students at UNC-Chapel Hill. CSXL offers an inclusive community passionate about personal growth, professional development, and practical experience with tech. The lab’s … Read more"
full_description = "Computer Science Experience Labs (CSXL) The Computer Science Experience Labs (CSXL) are a technical experience accelerator, community hub, and co-working space for undergraduate students at UNC-Chapel Hill. CSXL offers an inclusive community passionate about personal growth, professional development, and practical experience with tech. The lab’s goal is to kick-start successful careers in software engineering, user experience design, production engineering, and product management, and it hosts collaborative workshops for students who want to learn by making. The Co-working Space is found in 156 Sitterson Hall and is available for students to collaborate on side projects and course work when space is not otherwise reserved for workshops. What’s next for CSXL? Keep an eye out for increased opportunities to build community within UNC CS and for new workshops to be added all the time."
