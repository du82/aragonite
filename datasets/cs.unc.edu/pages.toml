full_description = '''Alumni (function($) { $("body, html").addClass("heels_full_width_overflow"); })(jQuery); (function($) { $("body, html").addClass("heels_full_width_overflow"); })(jQuery); Join Heels Engage Update Your Info Share An Update Post an Alumni Job Join CS Career Connections on Heels Engage UNC Computer Science Department invites all alumni, current UNC students, faculty and staff to connect with each other through the new virtual networking community, CS Career Connections on Heels Engage. Department of Computer Science Career Connections is the perfect place to connect our outstanding alumni with current UNC Computer Science students. Members can share job opportunities, seek career support, mentor others, or seek mentorship, as well as share stories, accomplishments, and current professional endeavors. Now more than ever, alumni expertise and insight are needed, and students are eager to learn how to pave the path toward a successful career in tech. Join Heels Engage Update Your Info Stay connected by providing an updated email address, career information, volunteer interests, and ways you want to engage with the Department. Update My Information Make a Gift Visit our giving page to learn more about the ways you can impact the future of computer science at Carolina. Support UNC Computer Science (function($) { $("body, html").addClass("heels_full_width_overflow"); })(jQuery); UNC Computer Science introduces UNC CS Career Network via Heels Engage September 16, 2024 UNC Computer Science Department invites all alumni, current UNC students, faculty and staff to connect with each other through the new virtual networking community, UNC CS Career Network via Heels Engage. View Story Mendoza receives NSF Graduate Research Fellowship April 25, 2024 CS major Christine Mendoza received an NSF Graduate Research Fellowship, which provides three years of financial support, including a $37,000 annual stipend and $16,000 cost-of-education allowance. Mendoza was one 