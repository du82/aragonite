["https://cs.unc.edu/student-life/student-experience"]
title = "Student Experience - Computer Science"
description = "UNC Computer Science is creating an inclusive, engaging, and supportive community where every CS student can thrive. Student Experience Team Azubeze Uzoma Student Experience Manager 131 Sitterson Hall (SN131) auzoma@cs.unc.edu Armani Anderson Graduate Assistant for Student Experience 127 Sitterson Hall (SN127) … Read more"
full_description = "Student Experience UNC Computer Science is creating an inclusive, engaging, and supportive community where every CS student can thrive. Student Experience Team Azubeze Uzoma Student Experience Manager 131 Sitterson Hall (SN131) auzoma@cs.unc.edu Armani Anderson Graduate Assistant for Student Experience 127 Sitterson Hall (SN127) armani@cs.unc.edu Conference Sponsorships Attend identity and community-based conferences with full support Program Summary The Student Experience team works to broaden participation in computing by providing opportunities for students to attend identity and community-based conferences, such as the Grace Hopper Celebration, SHPE, Lesbians Who Tech, and NSBE. These conferences enable students to connect with others who share similar identities, gain insights from professionals in their fields, and access networking, mentorship, and career development opportunities that align with their personal and professional journeys. Sponsorship Application To support this initiative, the Student Experience team manages an annual application process for conference sponsorships. Every spring, eligible students receive an invitation to apply for conference sponsorship opportunities. Selected applicants receive comprehensive support, including coverage of registration, travel, and accommodation costs. This program provides students with an enriching experience that supports their academic and career goals while advancing the department’s commitment to fostering an inclusive and supportive community. Student Experience Ambassadors Lead initiatives to enhance student experiences and build community Student Experience Ambassadors serve as key contributors to creating a welcoming and inclusive environment within the department. Their responsibilities include working on departmental events, participating in outreach initiatives, and offering peer support to fellow students. Through specialized training and regular bi-weekly collaboration, ambassadors develop valuable leadership and interpersonal skills. Their work not only strengthens the sense of community within UNC Computer Science but also ensures a positive and supportive experience for all students, leaving a lasting impact on the department. Meet the 2024/25 Student Experience Ambassadors Student Organizations Connect with peers through our various computing clubs and groups There is a vibrant and active undergraduate and graduate community of computer science students at UNC. Student organizations create smaller, focused communities within our department where you can connect with peers who share your interests and goals. Explore Student Clubs Student Experience Committee Shape the future of CS student life through collaborative leadership Student Experience Committee The Student Experience Committee is a collaborative group of undergraduate students, graduate students, staff, and faculty members working together to enhance the CS student experience. Committee members focus on creating a more inclusive, fair, and welcoming environment for all members of our community. Get Involved Students with suggestions or concerns for the committee can email auzoma@cs.unc.edu. All feedback is reviewed and discussed during committee meetings. An online feedback form is currently in development to provide an additional channel for student input. Broadening Participation in Computing Create pathways for all in computing What is the NSF BPC Plan? The National Science Foundation Broadening Participation in Computing Plan (BPC) plan is a strategic framework supported by the National Science Foundation aimed at expanding representation and participation in computing fields. Our department has developed a comprehensive BPC plan that outlines clear actions to make computer science more accessible and engaging for students, faculty, and staff from a wide range of backgrounds. This plan includes focused outreach efforts, improved mentorship, and initiatives that build a welcoming and supportive community within the department. Through our BPC plan, we’re dedicated to fostering an environment where everyone has the opportunity to thrive and contribute, ultimately enriching the field with a variety of perspectives and experiences. Read the UNC Computer Science BPC plan here. UNC CS BPC Initiatives Research Experience for Undergraduates (REU) Student Ambassador Programs Learning and Teaching Assistant Programs K-12 Outreach Activities Renovation of Classrooms Shape Your CS Experience Have ideas for improving student life? Join the Student Experience Committee or connect with our team to make an impact. Contact the Student Experience Team"
