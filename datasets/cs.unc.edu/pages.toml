full_description = '''Faculty Hiring Course Schedules Career Services Upcoming Events Featured News Bansal elected AAAI Fellow Bansal recognized with Presidential Early Career Award for Scientists and Engineers Alterovitz named IEEE Fellow Human-Focused NLP: How Chaturvedi is Improving AI’s Understanding of Human Language Speeding Up Scientific Progress Using Robots and AI in Laboratories UNC CS announces new chair, 7 new faculty additions for 60th year (function($) { $("body, html").addClass("heels_full_width_overflow"); })(jQuery); CS at Carolina UNC Computer Science faculty and students describe the department in their own words. (function($) { $("body, html").addClass("heels_full_width_overflow"); })(jQuery); Career Services Our Career Services team helps students transform coursework and technical skills into your desired internship and post-graduate job. From personalized career coaching and mock interviews to industry networking events and corporate partner workshops, we connect you with people and opportunities. Learn More CS Experience Labs (CSXL) Computer Science Experience Labs (CSXL) serve as a collaborative co-working and computing hub, driving hands-on learning opportunities for CS majors designed to accelerate your growth based on your interests, including software engineering, user experience design, production engineering, and product management. Learn More Recent News Bansal elected AAAI FellowJanuary 31, 2025 Distinguished Professor Mohit Bansal was elected a Fellow of the Association for the Advancement of Artificial Intelligence. The distinction is reserved for “individuals who have made significant, sustained contributions — usually over at least a ten-year period — to the field of artificial intelligence.” Bansal recognized with Presidential Early Career Award for Scientists and EngineersJanuary 15, 2025 Distinguished Professor Mohit Bansal was awarded the PECASE, which is the highest honor bestowed by the United States Government to outstanding scientists and engineers who are in the early stages of their independent research careers and who show exceptional promise for leadership in science and technology. UNC computer science, data science researchers present work at NeurIPS 2024January 10, 2025 Researchers from the Department of Computer Science and School of Data Science and Society had a total of 16 papers accepted by the Conference on Neural Information Processing Systems, one of which was selected for spotlight. Empowering and inspiring the next generation: Girls Who Code at UNCDecember 16, 2024 At UNC CS, a powerful transformation is taking place. Each week, dozens of middle school and high school students gather in Sitterson, where student volunteers are helping to spark an interest in computer science. This is Girls Who Code (GWC) at UNC, where 75 UNC student volunteers are demonstrating that the next generation of tech creators and leaders could look very different from the last. View All NewsShare News (function($) { $("body, html").addClass("heels_full_width_overflow"); })(jQuery); Career Services Study Abroad Student Services Corporate Partners Events {"slug":"widget-events-list","prev_url":"","next_url":"https:\/\/cs.unc.edu\/?post_type=tribe_events&eventDisplay=widget-events-list&paged=2","view_class":"Tribe\\Events\\Views\\V2\\Views\\Widgets\\Widget_List_View","view_slug":"widget-events-list","view_label":"View","view":null,"should_manage_url":true,"id":null,"alias-slugs":null,"title":"Department of Computer Science - Computer Science","limit":"3","no_upcoming_events":false,"featured_events_only":null,"jsonld_enable":false,"tribe_is_list_widget":true,"admin_fields":{"title":{"label":"Title:","type":"text","classes":"","dependency":"","id":"widget-tribe-widget-events-list--1-title","name":"widget-tribe-widget-events-list[-1][title]","options":[],"placeholder":"","value":null},"limit":{"label":"Show:","type":"number","default":5,"min":1,"max":10,"step":1,"classes":"","dependency":"","id":