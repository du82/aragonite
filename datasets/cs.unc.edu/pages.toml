["https://cs.unc.edu/about/visiting"]
title = "Visiting UNC CS - Computer Science"
description = "On This Page Location Our Address Getting to the Area Visitor Parking Chapel Hill Transportation Contacts for Prospective Students Tours of the UNC-Chapel Hill Campus Outreach and Research Demonstrations Location Our department is located in J. Carlyle Sitterson Hall and the Frederick P. Brooks Jr. … Read more"
full_description = "Visiting UNC CS On This Page Location Our Address Getting to the Area Visitor Parking Chapel Hill Transportation Contacts for Prospective Students Tours of the UNC-Chapel Hill Campus Outreach and Research Demonstrations Location Our department is located in J. Carlyle Sitterson Hall and the Frederick P. Brooks Jr. Computer Science Building on the campus of the University of North Carolina at Chapel Hill. The town of Chapel Hill is located in the Research Triangle area of North Carolina, which is situated approximately in the center of the state. The Research Triangle is formed by Chapel Hill and the cities of Raleigh and Durham, with the Research Triangle Park at their center. Our Address Mailing Address: Department of Computer Science CB# 3175, Brooks Computer Science Building UNC-Chapel Hill Chapel Hill, NC 27599-3175 USA Shipping Address: Department of Computer Science 201 South Columbia Street, Sitterson Hall UNC-Chapel Hill Chapel Hill, NC 27599-3175 Phone: (919) 590-6000 Fax: 919-590-6105 Email: info@cs.unc.edu Getting To The Area By Air: The Triangle area is served by Raleigh-Durham International Airport (RDU). Airlines Serving Raleigh-Durham International Airport Getting from the airport to Chapel Hill: GoTriangle Ground Transportation from RDU Rental Cars By Rail: For train travelers, there are Amtrak stations in Raleigh and Durham. By Car: Drivers may reach the Research Triangle area on interstates 40 or 85. We suggest using Google Maps to map directions from your starting location to 201 South Columbia Street (Sitterson Hall and Brooks Building). Visitor Parking Visitor parking is available at several university parking lots. The closest public lot to Sitterson Hall and Brooks Building is the Morehead Planetarium parking lot, which is just a short walk from our building. For more information, see the UNC Department of Public Safety’s page on Visitor Parking. The parking lot attendants have campus maps and can direct you to Sitterson Hall and Brooks Building. If the Morehead Planetarium lot is full, ask the parking lot attendant to direct you to the nearest parking lot with available space. There are also several municipal pay parking lots a few blocks away from Sitterson Hall and Brooks Building on Rosemary Street in downtown Chapel Hill. See the move.unc.edu website for more parking information. Chapel Hill Transportation Bus Services The town of Chapel Hill has a number of bus routes that serve the town and campus, including transportation to “Park and Ride” lots. All buses within Chapel Hill are free of charge. The Chapel Hill Transit web site has more information about bus service in Chapel Hill. Contacts for Prospective Students Prospective graduate students with questions may contact the department’s student services manager at 919-590-6200 or via email at admit (at) cs.unc.edu. Prospective undergraduates may contact the director of undergraduate studies at 919-590-6238 or via email at csugrad (at) cs.unc.edu. Tours Of The UNC-Chapel Hill Campus UNC-Chapel Hill’s Office of Undergraduate Admissions offers campus tours for prospective undergraduate students in a variety of formats, including guided, self-guided, and virtual online. The UNC Visitors’ Center also offers a 90-minute Sense of Place walking tour, as well as a 75-minute tour aimed at prospective graduate students. You can tour several campus landmarks in virtual reality with this virtual interactive campus tour. Outreach & Research Demonstrations The department typically participates in the UNC Science Expo and tries to hold one open house per year that is open to the public. To inquire about our department’s upcoming open house events and research demonstrations, please contact the External Relations team at er (at) cs.unc.edu."
