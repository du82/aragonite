title = "Awards & Honors | Department of Computer Science"
full_description = "Brent Waters Elected IEEE Fellow 02/05/2025 - Brent Waters, a cryptography professor in the Department of Computer Science at UT Austin, was recently named one of IEEE’s newest fellows. Record Number of Computer Science Undergraduates Earn Research Recognition 01/02/2025 - Four undergraduate computer science researchers were recognized by the Computer Research Association in the 2025 CRA Outstanding Undergraduate Researcher Award — the largest recognition of the department’s undergraduate research yet. Computing Named Among Best in Global Ranking of Academic Subjects 12/06/2024 - UT Austin ranked eighth in computer science and engineering globally in new report by ShanghaiRanking. UT Programming Team Takes 1st Place in Regional ICPC Competition 12/05/2024 - All four teams from the UT Programming Team finished top six, including taking first place, in the South Central USA Regional Competition of the International Collegiate Programming contest last month. Risto Miikkulainen’s Leadership in AI Research and Industry Recognized Globally 12/04/2024 - 2024 marks a pivotal year for&nbsp;Risto Miikkulainen, Professor of Computer Science at UT Austin, with several major achievements showcasing his leadership in artificial intelligence (AI) and neural networks.&nbsp; Computer Science Doctoral Student Earns Google Fellowship 11/19/2024 - Mina Huh, a computer science Ph.D. student at UT Austin, has been awarded a Google Ph.D. Fellowship, the company announced on November 14. Etienne Vouga Earns Regents’ Recognition for Outstanding Teaching 11/11/2024 - UT Computer Science Associate Professor Etienne Vouga has earned a 2024 Regents’ Outstanding Teaching Award for demonstrating extraordinary classroom performance and innovative teaching. Vouga is one of 12 recipients this year from across the University of Texas System. UT Programming Team Competes in 48th ICPC World Finals, Places 15th in North America 09/30/2024 - On Thu, Sep 19, 2024, the UT Programming Team competed at the International Collegiate Programming Contest (ICPC) 2023-24 48th World Finals hosted by the Kazakhstan Competitive Programming Federation in Astana, Kazakhstan."
