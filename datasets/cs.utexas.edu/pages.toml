r of the CS Accounting department. She oversees all department accounts, approves department documents such as purchase orders, HR assignments, reimbursement and payment vouchers. Lydia GalavisAdministrative ManagerBusiness Office(512) 471-9519accounting@cs.utexas.eduGDC 2.320 Patrick sits in a dark office installing linux boxes and ensuring they stay up and running. Patrick also installs user requested software and supports raspberry pi. AFOL. Patrick GoetzSenior Systems AdministratorTechnology Serviceshelp@cs.utexas.eduGDC 1.412 Allison plans and executes the Computer Science Summer Academies, which introduce high school students to the exciting world of programming, robotics, machine learning, and more. Allison GrindleOutreach Program ManagerUndergraduate Officeagrindle@cs.utexas.eduGDC 2.804 Tiffany is a grant administrator supporting artificial intelligence faculty and students. Tiffany GuridyGrants and Contracts SpecialistBusiness Office(512) 471-9777tiffanyg@cs.utexas.eduGDC 2.322 Jory works in the Computer Science Department as an administrative associate performing accounting duties. Jory HendersenSenior Administrative AssociateBusiness Officejory@cs.utexas.eduGDC 2.316 Trevor is the undergraduate academic advisor for the statistics and data science program and also advises computer science students. As an academic advisor, supports the personal, professional and academic growth of students and helps students plan their academics. Trevor KammerzellSenior Academic AdvisorUndergraduate Office(512) 471-9509trevkamm@cs.utexas.eduGDC 2.710 Madeleine works with online graduate students in the CDSO program. She provides individualized guidance and administrative support. Madeleine LangeGraduate Coordinator for Online ProgramsGraduate Officemadeleine.lange@austin.utexas.eduGDC 5.420 Kylie works with alumni and friends of UT Computer Science to build engagement and support for annual giving initiatives. Additionally, she creates development collateral to share with 