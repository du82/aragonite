full_description = "Duncan Hudson As Chief Platform Officer for National Instruments, Duncan G. Hudson III is responsible for guiding the evolution of NI’s product platform and leading the R&D fellows. Previously, as an NI Business and Technology Fellow, Mr. Hudson served as an internal consultant and led architecture and technology decision processes for product initiatives on a global scale while developing and mentoring R&D talent. Mr. Hudson cofounded the annual NI technology conference, NITech, and created the NI Vision to Architecture group, which aims to solve the company’s toughest technology and architecture problems. His current areas of interest span the NI LabVIEW portfolio of products for test and measurement, embedded system design, and science and engineering education. Mr. Hudson received the 2011 Edith and Peter O’Donnell Award in Technology Innovation from The Academy of Medicine, Engineering and Science of Texas (TAMEST). Mr. Hudson holds a master's and bachelor's degree in computer science from The University of Texas at Austin. His research at UT focused on graphical programming and parallel numeric computation, applications, and compilation."
