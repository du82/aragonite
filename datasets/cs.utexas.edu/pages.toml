title = "PhD Program | Department of Computer Science"
description = "The PhD is a research degree. Our PhD students also take courses, which give them the foundation on which to build their research programs. However, the overriding goal of the PhD program is to show students how to conduct outstanding research. We expect all our PhD students to become involved in research within their first semester (see Research Immersion below) and continue their involvement throughout their time at UT. To understand how our PhD students are involved in our research activities, browse our research web pages."
full_description = "PhD Program The PhD is a research degree. Our PhD students also take courses, which give them the foundation on which to build their research programs. However, the overriding goal of the PhD program is to show students how to conduct outstanding research. We expect all our PhD students to become involved in research within their first semester (see Research Immersion below) and continue their involvement throughout their time at UT. To understand how our PhD students are involved in our research activities, browse our research web pages. As a consequence of early immersion in research, our PhD students are often already recognized in the wider research community well before they graduate. They regularly travel to conferences, present papers, and often receive best paper awards. Interested in applying? Visit our Prospective Students page for information about applying to our program. Most PhD students receive financial support from the department. Please see the financial information page for more information about this. Graduate Graduate Prospective Students Master's Program Ph.D. Program Ph.D. Steps to Degree Degree Requirements Proposing & Advancing to Candidacy Final Defense Ph.D. Commencement Courses Financial Information Incoming Students Current Students Portfolio Program in Robotics Curricular Practical Training Forms Graduate Student Talks"
