["https://cs.utexas.edu/engage/alumni"]
title = "Alumni | Department of Computer Science"
full_description = '''Alumni Be a part of one of the largest alumni networks in the world. Connect Attend Events Get Involved Give Contact Us STAY IN TOUCH Stay in touch and network with your fellow alumni by joining the UT Computer Science Alumni group on the HookedIn platform. GET SOCIAL Find more UT Computer Science alumni and join the LinkedIn and Facebook Group! UTCS does not necessarily review nor endorse the content featured on these pages. UPDATE YOUR INFO Make sure your information is up to date through UTCS or Texas Exes. Alumni Events Each Year UTCS plans and sponsors events to explore computer science research and reconnect alumni throughout the year. We look forward to seeing you at one of our events in the near future! Please check back soon for upcoming alumni events. Get Involved Summer Academies UTCS offers a variety of summer academies for high school students. Participate in panel discussions, host a workshop, or become a sponsor. Mentorship Opportunities Student-alumni mentorships are rewarding for both mentee and mentor. Create connections with the future of computer science by mentoring student organization members and leave a lasting impact on a young computer scientist. Hire UTCS Students & Alumni Is your company seeking computer science-focused interns and full-time hires? Friends of Computer Science (FoCS) partnerships go beyond the traditional career fair and job board to build brand awareness and deep, long-term relationships with the Department of Computer Science! Class Ambassadors Would you like to help host alumni events in your region, to keep your class connected & share our news/events with your fellow alumni? Contact us to find out how to be a Class Ambassador. Priority Initiatives Computer Science Excellence Fund You can support the best and the highest needs of UT Computer Science by making a gift to the Computer Science Excellence Fund. Give Now! Honor a Professor Honor a faculty member and their legacy at UT Computer Science by supporting an endowment in their name. CHOOSE AN ENDOWMENT COMPLETE LIST OF DEPARTMENTAL GIVING OPTIONS What Starts Here, Starts With You There are a range of options available to those motivated to leave a legacy at the Forty Acres and help maximize our impact in research and supporting the growth of tomorrow's leaders. Our philanthropic advisor, Anthony Amettis, can help you navigate departmental priority initiatives and ways to give that allow you to see the full impact of your philanthropy and any tax considerations you may have. TELL ME MORE Alumni News explore more » How a UT Computer Science Alum's Summer Project Transformed Class Registration for Thousands Exploring Annotator Rationales for Active Learning with Transformers AI Bests Expert Human Players at Video Game Share Your Story Our motto at The University of Texas at Austin is "What starts here changes the world." What are you doing to help shape the future of our world? Share Your Story We would love to hear from you! We want our alumni to know that even though you have graduated, your alma mater is still here for you. Do you have questions about making a charitable gift, alumni events, or alumni news? We're here to help. Contact Us'''
