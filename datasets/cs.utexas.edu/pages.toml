["https://cs.utexas.edu/faculty/recruiting"]
title = "Faculty Recruiting | Department of Computer Science"
full_description = "Faculty Recruiting We are now accepting applications for the 2024-2025 recruiting season. To apply, please submit materials here: Assistant, Associate, Full Professor (Tenured/Tenure-Track) Assistant, Associate, Full Professor of Instruction/Lecturer (Non-Tenure Track Instructional) Assistant, Associate, Full Professor in Foundational AI/ML (Tenured/Tenure-Track Cluster Hire) Robotics Candidates: If your research area is robotics, please also send your cover letter and CV to faculty_jobs_robotics@utlists.utexas.edu along with an indication that you have applied to the computer science department. This will ensure that your application is connected to the university-wide robotics search. UT Computer Science strongly encourages potential applicants to apply as soon as they are able to do so. We interview candidates at all times of year and early applicants will be interviewed in the fall. The University of Texas at Austin is committed to significant and sustained faculty growth in the Department of Computer Science. All candidates with a commitment to research and teaching and the ambition to change the world are encouraged to apply. UT Computer Science boasts a top-ten ranking for its graduate program with corresponding top-ten rankings in the major subfields of artificial intelligence, systems, theory, and programming languages. The department is home to 72 faculty housed in the Bill & Melinda Gates Computer Science Complex—a state-of-the-art facility that provides collaborative workspace for faculty and students and ample capacity to support significant departmental growth. The University of Texas at Austin ranks among the nation’s top ten public research universities with annual research funding of more than $650 million. It is recognized by the US Department of Education as a Hispanic-Serving Institution and is deeply committed to attracting highly qualified students, faculty and staff with a wide range of backgrounds, ideas and viewpoints. Read More About the Department of Computer Science Read More About UT & Austin Austin is a major hub of hi-tech industry and entrepreneurial activity, providing many opportunities for collaboration. Major companies in Austin, with a focus on hardware or software development, include Dell, Apple, Google, IBM, National Instruments and Oracle. Our ecosystem is rich with mid-sized companies with a hi-tech focus, including Indeed, VMWare, HomeAway, Tesla, Zynga, Evernote, to name just a few. Austin is a thriving city with a booming economy and a high quality of life that consistently place it at the top of lists for “Best Places to Live in the US.” Cosmopolitan, yet laid back, it is the live music capital of the world, and the home of SxSW and Austin City Limits. Austin has a subtropical climate with lush vegetation and rolling hills along with the Colorado River and the Highland Lakes. See today's weather. If you have questions about faculty employment opportunities, please write to faculty-search@cs.utexas.edu."
