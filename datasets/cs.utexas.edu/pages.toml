title = "Ashish Gupta | Department of Computer Science"
description = "Ashish Gupta is an Engineering Fellow, and Vice President of Engineering at Google. Since Feb 2019, Ashish leads Engineering for the YouTube Ads platform, responsible for advertiser-facing video-ads products, ad-serving and quality."
full_description = "Ashish Gupta Ashish Gupta is an Engineering Fellow, and Vice President of Engineering at Google. Since Feb 2019, Ashish leads Engineering for the YouTube Ads platform, responsible for advertiser-facing video-ads products, ad-serving and quality. Before that, Ashish was the Vice President of Engineering for the Data Infrastructure and Analysis group at Google, building end-to-end integrated stack of highly extensible products for data ingestion, processing, storage, and analysis, helping power many critical Google products, and serving their data management and analysis needs (including AdWords, AdSense, Payments, Shopping, etc). Ashish holds a Masters in Computer Science from The University of Texas at Austin and did his Bachelors in Computer Science from IIT Delhi."
