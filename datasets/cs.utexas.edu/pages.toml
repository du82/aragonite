["https://cs.utexas.edu/engage/industry"]
title = "Industry | Department of Computer Science"
full_description = "Industry Recruit world-class talent. Partner on cutting-edge research. Recruit Our Students Collaborate With Researchers Meet Our Team Undergraduate Recruiting Network and RecruitFriends of Computer Science is our premiere networking platform for building a robust relationship with prospective CS student hires.Explore FoCS Meet Student Organizations Partnering with student organizations is a great way to connect with student organized interest groups and communities. Explore Student Orgs College of Natural Sciences Employer Career Services Career Fairs The CNS Technology & Science Career Fair is attended by 200 Natural Sciences employers and 12,000 Natural Sciences students. Job Boards Post paid full-time, internship, or part-time positions for current Natural Sciences current students and recent grads. Graduate Recruiting Become a Friend of Computer Science Friends of Computer Science allows our industry partners to recruit in-demand graduate students through enhanced engagement. FoCS works with our corporate partners throughout the recruiting process to make it efficient and targeted. Explore Grad Recruiting with FoCS Recruit by Research Area The Machine Learning Lab, Robotics, and Systems are three of UTCS’ research collaborations dealing with cutting-edge research with real-world industry environments. Our graduate students are heavily involved within these programs and actively work on innovative and groundbreaking technology during their time in the department. Explore Your Options Research Partnership Programs Our industry academic programs allow partner companies to engage broadly with UT research within a specific field while also delivering recruiting and engagement opportunities, particularly among graduate students from affiliated laboratories. Machine Learning The Machine Learning Lab advances ground breaking research discovery in machine learning and artificial intelligence. Learn More Robotics Texas Robotics unites robotics efforts across UT and pursues innovative research emphasizing long-term autonomy and human-robot interaction. Learn More Sponsored Research & Embedded Collaborations UTCS will work with industry partners to explore the possibility of sponsored research that advances the state of the art in topics of interest to the company. Start the Conversation Industry Partnership Highlights explore more » Amazon Teams Up With UT To Establish New Science Hub Yaskawa Partnership Accelerates Robotics Research at The University of Texas at Austin Bridging the Gap Between Industry and Academia Friends of Computer Science Partnership Brandi Westgate Program Manager, Corporate Relations (512) 471-9797 brandiw@cs.utexas.edu Want to discuss how UTCS can help you achieve your research or recruitment goals? Let's Work Together"
