["https://cs.utexas.edu/graduate-program/incoming-students"]
title = "Incoming Students Graduate Program | Department of Computer Science"
description = "Information for New Graduate Students Fall 2024Welcome to the Department of Computer Science at The University of Texas at Austin! You were admitted to our program because we believe you will be a future star in the field of computer science, and we are very honored to have you join our department!"
full_description = "Incoming Students Information for New Graduate Students Fall 2024Welcome to the Department of Computer Science at The University of Texas at Austin! You were admitted to our program because we believe you will be a future star in the field of computer science, and we are very honored to have you join our department!Below are very important dates and useful information. Links are embedded in the checklists you can download at the bottom of this page to provide you with additional information and answer your questions. We encourage you to use these links. If you do not find the information you need, please contact the CS Graduate Office.Important Dates: Summer 2024May 24Create a CS AccountIncoming students may request an account beginning May 24.Please note it can take up to 24 hours for the account to be created.Once you have your CS account, return to UTCS DirectUnder ‘Graduate Students’ you can access the TA Application.May 24 - June 5Clear Advising BarsPhD students must complete both the intake survey and the coursework approval survey.PhD students' bars will be cleared after Dr. Plaxton approves your proposal survey.Bars will be cleared for MS students after the intake survey is completed.June 7Deadline for TA ApplicationAll incoming graduate students (MS and PhD) must submit by June 7.If you received an offer of TA funding in your admission letter, you must still fill out the application so that we can match you with a course.June 5 - July 19Registration Period I for incoming CS studentsSee your Registration Information Sheet (RIS) for bars & registration times.Please see this page with helpful information about resolving holds.July 30Fee bills electronically distributed for students who have registered by July 19. Students notified by email.August 1Advising DeadlineIncoming PhD students must complete the coursework approval survey for their Fall course schedule for approval by the Graduate Adviser. Students' bars will be cleared after Dr. Plaxton approves your proposal survey.All PhD students must register for CS 398T in their first fall semester.August 16International Student WelcomeJoin ISSS staff and fellow international students for a formal welcome to UT Austin. Learn about campus resources and information every Longhorn needs to know!August 21 - 22Registration Period II for all students who have not yet registered.See your Registration Information Sheet (RIS) for bars & registration times.Please see this page with helpful information about resolving holds.Add/drop for students who have registered and paid. Add bills due on Aug. 29 by 5 p.m.August 22UTCS OrientationGDC 2.216 (Auditorium): 10 AM - 4:00 PMFull schedule TBDAugust 23Graduate School OrientationThis year's university-wide New Graduate Student Orientation will be held in-person on Friday, August 23, 2024 in the Texas Union. Check-in and breakfast began at 8 a.m. and the first session at 9 a.m. This event is in addition to your department orientation.August 23 - 25Registration Period III for all students who have not yet registered.Beginning Aug. 23, $25 late fee in effect for all students not registered.Payment due 5 p.m., Aug. 29Add/drop for students who have registered and paid. Add bills due on Aug. 29 by 5 p.m.August 26First class day.August 26 - 29Late registration for all students. $25 late fee in effect.Note: Late fee increases to $50 on Aug. 30 and $200 on Sept. 12Add/drops for registered and paid students. Add bills due on Sept. 11 by 5 p.m.August 29 is the 4th class day. After this date, you cannot make your own changes to your registration.August 26 - Sept. 11 First 12 class days. Delete drop period.Classes added, dropped and grade status changed online from Aug. 26 - Aug. 29Classes added, dropped and grade status changed by contacting the UTCS grad office or the dept. offering the course from Aug. 30 - Sept. 11.During this period, a student may drop a course and receive a full refund. Courses dropped do not appear on the student’s transcript.August 29Tuition and fee payment due by 5 p.m.Students with zero bills must confirm their registration via the Web to prevent cancelation.Sept. 11The Twelfth Class Day.Last day to add/drop a course with a refund.Payment for added classes due by 5 p.m.International StudentsAs an international student at The University of Texas at Austin, there are additional steps you will need to follow prior to your enrollment at the university. To complete these steps you will need to log into myIO.After arriving in the U.S. International Students can complete the New Student Check-In process.International Student Orientation. Event details and new student information are posted here.AdvisingCNS has prepared five brief orientation videos to help students prepare for graduate school. The videos provide helpful information about everything from professional development to student support, and can be viewed at your own pace here.Incoming PhD students must complete the coursework approval survey for their Fall course schedule by August 1 for approval by the Graduate Adviser. Students' bars will be cleared after Dr. Plaxton approves your proposal survey. All PhD students must register for CS 398T in their first fall semester.Master's: There is no formal advising required for master's students. The advising bar will be cleared after the UTCS intake survey is completed. Please direct any questions to the CS Graduate Office.COVID-19 Vaccination InformationWant to receive the COVID-19 vaccine from UT Austin? The COVID-19 Vaccine Form is open to current students, faculty and staff who want to receive the vaccine from the university. Learn more and find the form at protect.utexas.edu/vaccine.For the latest campus news and resources, visit coronavirus.utexas.edu/.Checklists and Forms:Computer Science On-Campus Programs Student HandbookNew Student Checklist2024 Background Coursework Form Graduate Graduate Prospective Students Master's Program Ph.D. Program Courses Financial Information Incoming Students Current Students Portfolio Program in Robotics Curricular Practical Training Forms Graduate Student Talks"
