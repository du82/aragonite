["https://cs.utexas.edu/people/staff"]
title = "Staff | Department of Computer Science"
description = "The staff at UT Computer Science contribute significantly to our department's culture of excellence by providing high-quality, essential support to students, faculty, and administration. Our talented staff are passionate about our vision for higher education and public service."
full_description = "Staff People Directory Faculty & Researchers Staff Offices The staff at UT Computer Science contribute significantly to our department's culture of excellence by providing high-quality, essential support to students, faculty, and administration. Our talented staff are passionate about our vision for higher education and public service. Brian designs and develops database-driven web applications to be used by faculty, staff, and students in the department. He maintains and supports department and affiliate websites, content management systems, and other software solutions. Brian BarryWebmasterTechnology Services(512) 471-9593bbarry@cs.utexas.eduGDC 5.314 Alejandra oversees outreach, scholarships, and recruiting and admissions for the department's honors programs. Alejandra BernalDirector for Academic AffairsUndergraduate Office(512) 471-9563bernal@cs.utexas.eduGDC 2.720 Megan Bernella works as Salesforce Developer for the UT Computer Science online master's program. Furthermore, Megan supports the department with software integrations and various business applications development. Megan BernellaSoftware DeveloperTechnology Services(585) 444-8817megan93@cs.utexas.eduGDC 5.318 Megan is a Senior Administrative support for Programs group; HR Partner and voucher processing for the Artificial Intelligence Lab. Megan BoothGrants and Contracts Specialist - Team LeadBusiness Office(512) 471-9504meganb@cs.utexas.eduGDC 2.314 Gabrielle facilitates operations within the graduate department assisting with the development and implementation of processes ranging from admissions to registration, degree checks, and graduation. Gabrielle BouzigardGraduate Program AdministratorGraduate Officegradoffice@cs.utexas.eduGDC 2.732 Daniel serves as an Associate Academic Advisor in the Department of Computer Science and Data Science at the University of Texas, where he provides academic guidance and support to undergraduate students. He also oversees the office student workers and manages their payroll. Daniel BurtonAssociate Academic AdvisorUndergraduate Office, Graduate Office(512) 471-9509dburton@austin.utexas.eduGDC 2.706 Eric leads the Department of Computer Science online program office. He is responsible for ensuring high quality and successful student outcomes for the Department's online master’s suite, including degree programs in Computer Science, Data Science and other programs to be developed in the future. Eric BuschDirector for Online ProgramsGraduate Office(512) 471-9523buschet@cs.utexas.eduGDC 2.722 Amy helps maintain the departmental linux machines and servers, as well as the admin and lab Macs. She is the primary administrator of the UTCS HTC cluster, and helps maintain and update the user database. She likes dogs a lot. Amy BushSenior System AdministratorTechnology Services(512) 232-7470help@cs.utexas.eduGDC 1.416 Josh provides audio/video support and recordings in classrooms and conference rooms. In addition, he delivers technical support and troubleshooting for the department. Joshua ByrnesBuilding ManagerFacilities Management(512) 471-9506help@cs.utexas.eduGDC 1.402 April organizes events on behalf of Texas Robotics, focusing on growing the program, showcasing accomplishments, and connecting with the community. April CafaroSenior Events Coordinator, Texas Robotics External Relationsrobotics@utexas.edu Ellen oversees fundraising and engagement efforts on behalf of UT Computer Science, working with alumni and friends of the department to secure philanthropic support for students, faculty, and departmental priority initiatives. Ellen CantorDirector of DevelopmentExternal Relations(512) 232-7476ecantor@cs.utexas.eduGDC 2.824 Michaela is responsible for the planning and management of student-focused initiatives including the Accelerated Transfer Program, X+CS program, and the on-campus summer academies. Michaela CiceroAssistant Director for Outreach and RecruitmentUndergraduate Office(512) 471-9517mcicero@cs.utexas.ed