["https://cs.utexas.edu/faq/undergraduate"]
title = "Undergraduate FAQ | Department of Computer Science"
full_description = "Home › Undergraduate › Academics Undergraduate FAQ Academic Advising Where is the CS Advising Center located? We are located in the new Gates Dell Complex building next to POB, GDC 2.702. [Permalink] When / Why should I see an advisor? Advising for the next semester begins after the 12th class day, and is available on an ongoing basis, not just during registration. Only entry-level students and students who are on scholastic probation receive advising bars, and must meet with an advisor in person before they can register for classes. CS majors who have been promoted from entry-level and who are in good academic standing do not receive advising bars and are not required to see an advisor before registration. Advisors are available all year to assist with degree planning and course selection, help students who are struggling academically, provide information about UT's numerous resources, and help students facing non-academic problems. [Permalink] How do I make an appointment with an advisor? Appointments can be made by coming by the office or calling the front desk at 512-471-9509. We do not schedule appointments by email. You must include your EID in all communication, by phone, voicemail, or email, for our office to assist you. [Permalink] What can the CS advisors help me with? The CS advisors offer advising in the following areas: Advising bar removal, Degree plans, Initiation of degree audit, Registration advising, and Registration for departmental courses. The advisors provide approval for the following online applications: Appeals and Petitions for Degree Modification, Course Substitutions, and Repetition of a Course. [Permalink] What can faculty advise me on? Faculty members are a valuable resource for students. Most faculty are willing to meet with students throughout the academic year to discuss any of these areas: Career Opportunities, Course Selection, Graduate School, Professional Development Opportunities, Research Opportunities, and Specific Areas of Interest. If you are interested in speaking with a faculty member, you may try to reach them during their office hours or by email. Please visit the faculty homepages for contact information. [Permalink] Add/Drop/Withdrawal/Pass-Fail/Grades Can I take a course pass/fail? You should not take a course pass/fail if you need that class to fulfill a degree requirement. Courses taken pass/fail count towards your total number of residence hours and elective hours, but nothing else. They do not count towards your GPA (unless an F is earned) and do not fulfill prerequisite requirements. This means you should NOT take any CS courses as pass/fail unless you are using them for only elective requirements. Only electives should be taken pass/fail, unless you plan on repeating the course later for a letter grade. College of Natural Sciences students may only count 16 pass/fail hours toward their degree (All BA Degree and B S/BSA degrees prior to 14 -16 catalog) , and may only take two courses pass/fail per semester. You may not take a class pass/fail unless you have 30 hours completed. You may select this option when you register for the course, or you may go by the CS Advising Center in GDC 2.702 or the CNS Dean's Office in WCH 1.106 by the Q-drop deadline to change your grading to pass/fail. For the 2014-16 catalog, College of Natural Sciences BA students may only count 16 pass/fail hours toward their degree, and may only take two courses pass/fail per semester. BSA and BS students may only count 6 pass/fail hours toward their degree, and may only take two courses pass/fail per semester. If you earn a 60 or better in a pass/fail class, you will receive a CR on your transcript. This will not factor into your GPA. If you earn less than a 60, you will receive an F on your transcript and this will count as a 0.0 factored into your GPA. [Permalink] Can I drop a class after the drop deadline? Yes, you can use a One-Time-Exception Q-drop once in your undergraduate career. This drop counts as one of your 6 allotted Q-drops. You can find more information about the OTE drop on the CNS website. You can pick up the form in the Dean’s office in WCH 1.106 or in the CS Advising Center. The form is due by the last class day of the semester. If you are dropping a class because of non-academic reasons, you should make an appointment to visit the CNS non-academic counselors by visiting WCH 1.106 or calling 471-4536. Non-academic Q-drops that are approved by non-academic counselors do not count against your Q-drop limit (6 total). [Permalink] When can I add / drop / withdraw from my class(es)? The College of Natural Sciences uses the UT calendar for purposes of registration, adding and dropping courses, and withdrawing from the university. The general schedule for each semester is as follows: * Class days 1 – 4, add via the online Registration system * Class days 5 – 12, advisors may add students within the departmental classes (at their discretion) * Class days 1 – 12, drop via the online Registration system * Class day 13 on, adds or drops can be initiated in the CNS Dean's office (WCH 1.106); classes dropped after the 12th class day show up on your record as a Q-drop (a drop without refund or penalty). You are allotted 6 Q-drops in your entire undergraduate career. If you drop a class up to the 12th class day, you will receive a tuition refund, if necessary, and classes do not appear on the permanent record. Not attending does not automatically drop you from classes or withdraw you from UT; you need to do that yourself. Always double-check your final schedule before the 12th class day. Important dates for Fall 2014:August 25: Add-drops for students who have registered and paid their tuition August 27: Classes begin September 2: last day to add-drop classes on your own through the registration system online September 12: Last date to drop a class for a possible refund and without a QNovember 4: Q-drop deadline - last day for students to drop a class with a Q on their record, last day to apply to graduate or walk in May ceremonyOct 27 - Nov 7: Registration for Spring 2015 semester You can find more important Spring 2015 dates on the UT calendar [Permalink] What is a withdrawal and how can I do this? Withdrawal from The University is done after a student has completed registration for a semester or summer session, and then decides not to attend any classes that semester or session. The registration system will not permit you to withdraw by yourself. You must do this in the CNS Dean’s Office. If it is not possible to come to the office, please call (512) 471-4536. During the first four weeks of class there is a pro-rated refund for withdrawing from school. A full refund, less $15.00, is ONLY given if a student withdraws prior to the first day of class. Failure to properly withdraw results in failing grades in all semester coursework. Leaving UT without a formal withdrawal is the same as failing all classes and has the same consequences. After the final deadline, students may not drop or withdraw unless there are serious non-academic circumstances, which occurred after the Q deadline date. Appeals will only be considered for documented, non-academic reasons. Contact the CNS Dean’s Office, WCH 1.106, (512) 471-4536 for non-academic issues. You must include your EID in all communication, by phone, voicemail, or email, for our office to assist you. [Permalink] What grade do I need in my class to fulfill my degree requirement? This is dependent on what class you are taking. For all CS, math or science courses required by your degree, you must make a C- or better. This means that if you make below a C- on any of these classes, they will only count as electives and will have to be retaken for a grade of C- or better to count for your degree. If you are taking a core-curriculum course, foreign language course, or elective (i.e. UGS, GOV, HIS, Social Science, RHE, etc.), you must make a D- or better to fulfill that degree requirement. If you make less than a D- on a core-curriculum course or elective, it will not count and you will need to retake the course or choose another option (if you area allowed a choice, such as Social Science or elective courses). [Permalink] I'm not doing well in my courses this semester, what should I do? You should seek out help by reaching out to your professor, TA's, and other tutoring resources such as the Sanger Learning Center. If you feel that you cannot make the grade necessary for your degree, you should schedule an appointment with your academic advisor by calling 471-4509 to get the necessary forms for a Q-drop in the course. The Q-drop deadline is 2/3rds of the way through the semester so you should check the Registrar's calendar to be aware of this deadline and give yourself adequate time to get the signatures necessary on your form before that date. If you are experiencing difficulty due to non-academic reasons, you should make an appointment to visit the CNS non-academic counselors by visiting WCH 1.106 or calling 471-4536. Non-academic Q-drops that are approved by non-academic counselors do not count against your Q-drop limit. [Permalink] How do I drop a class? If it is before the 12th class day, you can drop courses on your own in the Registration system. You will receive a tuition refund, if necessary, and classes do not appear on the permanent record. Not attending does not automatically drop you from classes or withdraw you from UT; you need to do that yourself. If it is after the 12th class day, but before the Q-drop deadline (which you can find on the Registrar's calendar), in order to drop a course for academic reasons, you will need to pick up a Q-drop form from either the CS Advising Center (GDC 2.702) or the CNS Dean's Office (WCH 1.106). You will need to (1) sign the form, (2) get an advisor's signature, and finally, (3) turn it into the CNS Dean's Office (WCH 1.106) before 5:00pm on the Q-drop deadline. Each undergraduate is allowed 6 academic Q-drops in their undergraduate career. This will show up on your record as a Q, rather than a grade and you will not receive credit for this class. If you are dropping a class because of non-academic reasons, you should make an appointment to visit the CNS non-academic counselors by visiting WCH 1.106 or calling 471-4536. Non-academic Q-drops that are approved by non-academic counselors do not count against your Q-drop limit. Be sure to check with financial aid and scholarships to ensure that you will not have an issue if your drop puts you below full-time hours for the semester. [Permalink] Admission/Readmission I want to apply for readmission to UT. You can apply for readmission through the UT Admissions web site. You will need to submit as a part of your application transcripts of any course work (both online and in class) that you might have completed since your time at UT, and you will need to have maintained at least a 2.5 GPA in that transfer work. [Permalink] How can I be admitted into the Computer Science department at UT? You will need to consult the Admission’s website to find out more information about the requirements for admission to The University of Texas at Austin and the Computer Science department. They will evaluate any transcripts from other institutions and decide how they transfer into UT. Information about Computer Science's degree programs, course offerings, faculty, and research areas can be found on our department's web site. If you are admitted, you will be advised during your orientation session. [Permalink] I want to transfer to UT from another university, how long will it take me to graduate at UT? Generally speaking, students should plan on a minimum of 2 & 1/2 to 3 years to complete the undergraduate C S degree program. However, depending on how any existing university credits would apply to our degree program, a student might be able to complete their course work in a shorter time frame. Regardless, all UT degrees require a minimum of 60 in-residence (taken in a UT classroom) hours. [Permalink] Course Repetition Can I repeat a course? University policy states that you may NOT for any reason retake a course if you have made a C- or better. Even if a student makes below a C- in a course and must retake it, no student may enroll in the same Natural Sciences course more than twice without permission from their advisor. Therefore, students taking a Natural Sciences course for a second time need to be aware it may be their last chance to pass that course. You may only repeat a CS Entry-Level course (CS 312, CS 311, CS 314) one time, no exceptions. Students may fill out a third time repeat appeal to take a CNS class for a third time that will have to be approved by an advisor. These appeals will not be approved for Entry-Level CS courses unless there is documented non-academic drop for one of the attempts for a given course. [Permalink] If I repeat a course, will the old grade go away? No. Both grades will remain on your transcript and both will be averaged into your GPA. Students in the College of Natural Sciences are not permitted to repeat a course for which they have already earned a C- or better. In addition, no student may enroll in the same Natural Sciences course more than twice without permission from their advisor, therefore students taking a Natural Sciences course for a second time need to be aware it may be their last chance to pass that course. [Permalink] Credit By Exam How do I claim credit earned by an exam? (i.e. AP, IB, CLEP) In order for credit by exam or AP credits to count toward a degree or as a course prerequisite, students must first claim the credit on the Testing Services website. Do not claim any credit before speaking with your academic advisor. Your academic advisor can help you determine which credits you should claim for progress in your degree. Steps to Claim Credit 1. Start on the Student Testing Services page. 2. Read the Placement Versus Credit information. 3. Click on View Scores and Claim Credit, and log in. 4. Claim your credit. Important There is a fee of $10 per credit hour for claiming credit. For example, three credit hours would cost $30. Payment options are available. Claimed credit-by-exam will not affect your GPA. If you take a course in residence for which you have already earned credit-by-exam, whether you have petitioned or not, you will NOT be able to claim the credit. [Permalink] What classes can I test out of? View a full list of classes, see the testing schedule, and register for these tests on the Student Testing Services website. Be aware, that if you are planning to test out of a course that is a prerequisite for a course you are planning to take next semester, your scores will need to be in by the time you register for the course. Do not claim credit until you have been at UT for at least one semester and/or have talked with an academic advisor. A student can claim credit for an exam at any time prior to his/her seni"
