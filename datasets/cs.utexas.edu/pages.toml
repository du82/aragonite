title = "Summer Academies | Department of Computer Science"
description = "UT Computer Science offers residential and virtual summer academies for high school students that are designed to intrigue students with the potential of computing and the excitement of problem-solving. Join our academies to explore the world of computer science, learn to code, and get a taste of collegiate life."
full_description = "MENU UT Computer Science Summer Academies About Academy for Game Development Academy for iOS App Development Academy for Machine Learning Academy for Robotics Academy for All Academy for Women UT Computer Science Summer Academies Explore Academies Discover Scholars Academies ONE-WEEK RESIDENTIAL SUMMER ACADEMIES FOR HIGH SCHOOL STUDENTS HANDS-ON EXPERIENCE Secure your spot today! Enroll in our specialized summer academies and immerse yourself in a world of knowledge and skill development. Limited seats are available, so act fast to guarantee your place! ENROLL NOW! Discover a unique summer learning experience at our academies on the UT campus. Tailored for high school students entering grades 10–12, each program is taught by UT faculty and focuses on a specialized area of computer science, offering hands-on experiences and expert mentorship in a dynamic setting. Registration opens this Spring. Academy for Game Development Image Explore the game development process, including programming, art and game design to bring your game to life.Learn More Academy for iOS App Development Image Code projects and create simple apps for iPhone and iPad and install them on your own device.Learn More Academy for Machine Learning Image Immerse yourself in Python programming, understand the fundamentals of machine learning, and explore its societal impacts.Learn More Academy for Robotics Image Carry out projects in simulation, experiment hands-on with wheeled robots, and utilize tools deployed in robotics research.Learn More Applications for the Summer 2025 Scholars Academies are now closed. Our team is currently reviewing applications. Admissions decisions will be released via email no later than mid-February. We appreciate your patience! Scholars Academies Immerse yourself in the world of coding and problem-solving by applying for the Scholars Academies, where the spirit of inquiry and a passion for computer science converge. Dedicated to making computer science education accessible to a broad and varied audience, these free residential academies for high school students offer a taste of collegiate life. Join us to learn the ropes of programming or enhance your existing skills right here on UT campus. Academy for AllLearn More Academy for WomenLearn More Get the inside track!Join our email list now to be the first to know when enrollment or applications open for our academies. Don't miss out—participation is a limited opportunity, and our academies fill up fast!Count me in!"
