full_description = "Kay Stepper Dr. Kay Stepper is senior vice president of ADAS and Automated Driving - Bosch in North America. Since joining Bosch in 1996, Dr. Stepper has held a series of business leadership and management positions in engineering, research, product development and marketing in both the U.S. and in Germany. He is frequently turned to as an expert by leading media outlets and industry associations on topics such as automated driving, advanced driver assistance systems, crash avoidance systems and consumer education on vehicle safety. He has also provided expert testimony to government entities including the U.S. Congress. Dr. Stepper received both his master’s degree and his doctorate in electrical engineering from the Technical University of Berlin, Germany."
