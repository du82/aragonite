["https://cs.utexas.edu/graduate-program"]
title = "Graduate Programs | Department of Computer Science"
full_description = "Graduate Programs UT Computer Science has been a driving force from the beginning of the digital revolution. Our graduate program began in 1966, the same year DARPA started working on the project that became the Internet and more than a decade before Apple or Microsoft was founded. Today our program ranks consistently among the top 10 graduate programs in the country. Research The foundation of the department's graduate program is its research. Particular areas of strength include Systems (hardware, software, and the interface between them), Artificial Intelligence and Robotics, Networks, Security, Data Mining and Visualization, Bioinformatics, Theory, and Formal Methods and Verification. EXPLORE RESEARCH Faculty Our graduate faculty is a group of over 40 award-winning leaders in the CS research community. They hold Turing Awards, they are members of the National Academies, and they serve as Presidential advisors. And they run research groups through which our graduate students participate in world changing research efforts. MEET OUR FACULTY Graduate Programs On-Campus Graduate Programs On-Campus Master's Program Our master's program is intended as a terminal degree. It is designed for students who have a bachelor's degree in CS or a related field and want to broaden and deepen their knowledge of computer science, typically to enhance their careers in industry. The department offers two on-campus Master's degree options: the MSCS with thesis and the MSCS no thesis/no report. EXPLORE ON-CAMPUS MASTER'S Ph.D. Program Our Ph.D. program is designed for students who wish to pursue research careers, either in academia or in industry. We encourage outstanding students to apply, including those in allied fields (such as mathematics or electrical engineering) who have a strong aptitude in computer science. Students who know that they want to pursue a Ph.D. are encouraged to apply directly to the Ph.D. program, even if they have not already earned a Master degree. Explore Ph.D. Program Online Professional Degree Programs Online Computer Science Master's Program The Master of Science in Computer Science Online program provides a flexible learning environment while fostering personal engagement between professors and students. Taught by UT faculty, many of whom are award-winning leaders in the CS research community, the program supplies rigorous training to expand your expertise in areas such as advanced systems design, machine learning and artificial intelligence. By the end of the program, students will have gained the skills needed to accelerate their careers. Explore Online CS Master's Online Artificial Intelligence Master's Program The Master of Science in Artificial Intelligence (MSAI) students will receive advanced training in natural language processing, reinforcement learning, computer vision, deep learning and related topics. The degree will provide a critical framework for understanding the ethical implications of AI technologies and equip students for an array of potential career opportunities – from engineering to research and development, and product management to consulting. Explore Online Artificial Intelligence Master's Online Data Science Master's Program The Master of Science in Computer Science Online program provides a flexible learning environment while fostering personal engagement between professors and students. Taught by UT faculty, many of whom are award-winning leaders in the CS research community, the program supplies rigorous training to expand your expertise in areas such as advanced systems design, machine learning and artificial intelligence. By the end of the program, students will have gained the skills needed to accelerate their careers. Explore Online Data Science Master's"
