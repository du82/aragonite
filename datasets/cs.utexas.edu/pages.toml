full_description = "Nawaf Bitar Nawaf Bitar is a Senior Advisor for Citadel Securities, where he is responsible for helping drive the firm’s efforts to continue attracting exceptional technology talent, managing external relationships and other initiatives. Nawaf joined Citadel Securities in 2017 as Chief Information Officer, where he led all technology-related intiatives for the firm. Prior to joining Citadel Securities, he was Senior Vice President and General Manager of the Cloud Platform Business Unit at VMware. Before that, he served as Senior Vice President and General Manager of the Security Business Unit at Juniper Networks. He has held senior technology roles at Cisco Systems, IronPort Systems and Network Appliance, and has also held roles at Silicon Graphics and Apollo Computer. Nawaf is a member of the Board of Directors of Plum, Inc. He holds a bachelor’s degree from The University of Texas at Austin."
