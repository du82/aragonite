full_description = "Outreach Creating opportunities for the next generation of computer scientists. Summer Academies K-12 Outreach Computer Science Summer Academies Application-Based Our application-based academies, dedicated to making computer science education accessible to a broad and varied audience, are an immersive experience in the world of coding and problem-solving. Learn the ropes of programming or enhance your existing skills and get a taste of collegiate life in these free residential academies. Tuition-Based Each of our tuition-based summer academies, tailored for high school students in grades 9-12, hones in on a specific area of computer science, offering you hands-on experiences and expert mentorship. EXPLORE ACADEMIES K-12 Outreach Coding in the Classroom Coding in the Classroom is an outreach initiative that sends members of the UTCS community to local schools to teach coding and introduce computer science to a broad group of students in a team environment. Explore Coding in the Classroom! Roadshow The CS Roadshow is a team of UT Computer Science students who visit local K-12 classrooms giving presentations on what computer science is, why computer science is important, and how they can prepare for a career within this field. Explore Roadshow Want to learn more about our outreach initiatives? Want to get involved? Get Started"
