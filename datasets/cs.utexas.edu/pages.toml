["https://cs.utexas.edu/advisory-council/robert-hormuth"]
title = "Robert Hormuth | Department of Computer Science"
description = "Robert Hormuth is the Corporate Vice President, Architecture and Strategy of the Data Center and Embedded Solutions (Server, Data Center GPUs, and Embedded product lines) at AMD. Robert has 33+ years in the computer industry."
full_description = "Robert Hormuth Robert Hormuth is the Corporate Vice President, Architecture and Strategy of the Data Center and Embedded Solutions (Server, Data Center GPUs, and Embedded product lines) at AMD. Robert has 33+ years in the computer industry, joining AMD in 2020 after 13 years with Dell, 8 years with Intel, and 11 years at National Instruments. At AMD Robert is charged with creating a long-term system level vision for DESG and identify the technical requirements/implications to the DESG portfolio. Focusing on emerging technologies and workloads to identify future system and SOC implications by working closely with customers, end-users, ecosystem partners along with internal product management and SOC engineering teams. At Dell EMC Robert held roles from VP/CTO of the Server BU to VP/Technology Fellow in the Dell EMC Infrastructure Solutions Group. As CTO Robert and his team focused on server strategy, future architecture, and driving future technology intercepts onto the server portfolio. Robert’s past design/architecture activities include IO peripheral designs, x86 system design, BIOS, firmware, application software, and FPGA/ASIC design. Robert has participated in the creation of multiple industry standards - VME, VXI, PCI, PXI, PCIe, NVMe, RedFish, GenZ, CxL...etc. Robert has a B.S. in Electrical and Computer Engineering from The University of Texas at Austin and currently holds 24 patents with 20+ pending. Robert is an active member on The University of Texas at Austin Computer Science Advisory Board. BLOGSs: http://hormuth.net/misc/work_blogs.htm LinkedIn: https://www.linkedin.com/in/roberthormuth/"
year_published = 2025
