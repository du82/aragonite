gies that position key initiatives and foster meaningful connections with diverse audiences. Staci NormanMarketing ManagerMarketing & Communications(512) 471-9753srn@cs.utexas.eduGDC 5.310 Katie coordinates academic operations, manages faculty partnerships, and drives improvements in Online Programs. She leads initiatives to enhance course quality and program delivery. Katie OlsonLearning Manager, Online ProgramsGraduate Officekolson@cs.utexas.eduGDC 5.318 Jayvin oversees the department's student organizations, assists with departmental course scheduling and room reservation system, serves as the undergraduate travel coordinator and provides logistical oversight of undergraduate scholarships and departmental awards such as endowed presidential scholarships Jayvin PatelSenior Student Program CoordinatorUndergraduate Office(512) 471-9509jpatel@cs.utexas.eduGDC 2.724 Sri serves as Texas Robotics’ lead staff member, overseeing all consortium operations in support of the faculty director. She works to build strategic partnerships with industry and campus partners, oversees educational initiatives, events, and increase visibility of Texas Robotics. Sridevi RaoManaging Director, Texas Robotics External Relationsrobotics@utexas.edu Dezmon provides audio/video support and recordings in classrooms and conference rooms. In addition, he delivers technical support and troubleshooting for the department. Dezmon ReidHelp Desk SpecialistTechnology Serviceshelp@cs.utexas.eduGDC 1.404 Rebekah organizes events on behalf of the Machine Learning Laboratory (MLL) and the associated Institute for Foundations of Machine Learning (IFML). Additionally, she provides administrative support to the Laboratory Director. Rebekah Rice Senior Events & Administrative AssociateMachine Learning Lab rrice@utexas.edu GDC Doug is responsible for developing and managing UT Computer Science's academic programs and initiatives. He oversees the department's teaching plan, TA and undergraduate TA assignments, 