full_description = "Greg Lavender Greg Lavender is senior vice president, chief technology officer (CTO) and general manager of the Software and Advanced Technology Group (SATG) at Intel Corporation. As CTO, he is responsible for driving Intel’s future technical innovation and research programs. He is also responsible for defining a singular artificial intelligence software stack to support Intel’s range of business and hardware offerings. Lavender joined Intel in June 2021 from VMware, where he served as senior vice president and CTO. He has more than 35 years of experience in software and hardware product engineering and advanced research and development. Lavender holds a Bachelor of Science in computer science from the University of Georgia, and a Master of Science and Ph.D. in computer science from Virginia Tech."
