["https://cs.utexas.edu/advisory-council/dewayne-quinn"]
title = "DeWayne Quinn | Department of Computer Science"
description = "DeWayne, a veteran of Apple's Information Systems & Technology for the Americas, shaped its tech landscape with expertise in enterprise solutions and M&A integration. Active in philanthropy and education, he advises UC Davis Foundation and COSMOS, reflecting his commitment to advancing STEM. With a B.A. in Political Science from UC Davis, he pursued executive management studies at Stanford and UC Berkeley."
full_description = "DeWayne Quinn DeWayne retired from Apple in 2023 after 24 years of service with the company. He led Information Systems & Technology (IS&T) for the Americas region during his entire tenure in IS&T (1999 - 2021). From 2008 until 2018 DeWayne held responsibility for a broad portfolio of enterprise class solutions in support of a diverse set of Apple business functions, including: Apple Music, Beats Electronics, Apple TV, Apple Legal & Global Security and Apple Corporate Real Estate & Development. Additionally, DeWayne led the IS&T integration team during global M&A activity by the company from 2014 to 2018. During the 2 years prior to DeWayne’s retirement (2021 - 2023) he led External Partnerships and Corporate Enablement — as part of Apple’s HR Team and in support of the companies Inclusion and Diversity (I&D) efforts. Before joining Apple, DeWayne held senior IT and operations management positions at The Money Store. DeWayne is passionate about philanthropy and is actively involved with a growing number of notable organizations including: Trustee, UC Davis Foundation Board; Chair, California statewide advisory board for COSMOS, an intensive four-week summer residential program for high school students who have demonstrated high aptitude for academic and professional careers in STEM subjects; Advisor, University of Texas at Austin Computer Science Advisory Board. DeWayne has previously served on advisory boards for the UC Davis Cal Aggie Alumni Association and the Cosumnes River College Foundation.DeWayne earned a B.A. in Political Science from the University of California, Davis and has completed executive management studies at Stanford and UC Berkeley."
year_published = 2025
