description = "Gregg Zeitlin co-founded Reservoir Capital Group in 1998 and serves as a Senior Managing Director and a member of the firm’s Investment Committees. He currently serves on the boards of many of Reservoir’s portfolio companies, including ContourGlobal, Voyager Aviation, and ClearCaptions."
full_description = "Gregg Zeitlin Gregg Zeitlin co-founded Reservoir Capital Group in 1998 and serves as a Senior Managing Director and a member of the firm’s Investment Committees. He currently serves on the boards of many of Reservoir’s portfolio companies, including ContourGlobal, Voyager Aviation, and ClearCaptions. Additionally, Zeitlin has been instrumental in the formation and development of several investment firms seeded by Reservoir. Prior to founding Reservoir, Mr. Zeitlin was a Partner at Ziff Brothers Investments. Before joining Ziff Brothers Investments, Mr. Zeitlin was Vice President, Financial Strategy for Ziff Communications Company, where he focused on strategic partnerships and acquisitions, and ultimately, the sale of the Ziff family’s operating businesses. Previously, Mr. Zeitlin worked at Sunrise Capital Partners and Wasserstein Perella & Co. Mr. Zeitlin graduated with Highest Honors from The University of Texas at Austin with a B.B.A in Finance. Mr. Zeitlin also serves on the Advisory Board of Caltech’s Robotic Assisted Mobility Initiative (RoAM)."
