full_description = "Tara Estlin Tara Estlin is Deputy Chief Technologist for Mission Systems and Operations at the NASA Jet Propulsion Laboratory in Pasadena, California. She is also the Supervisor of the JPL Machine Learning and Instrument Autonomy group. Estlin leads the AEGIS Project, which is providing onboard image analysis and intelligent targeting technology for multiple Mars rover missions, including the Mars Exploration Rover Mission and Mars Science Laboratory Rover Mission. AEGIS was awarded the 2011 NASA Software of the Year award for its use on the Mars Opportunity Rover. She holds M.S. and Ph.D. degrees in computer science from the University of Texas."
