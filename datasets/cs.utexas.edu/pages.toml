full_description = "Raghu Ramakrishnan Raghu Ramakrishnan is CTO for Data and a Technical Fellow in the Cloud and Enterprise (C&E) division at Microsoft. His work in database systems has influenced query optimization in commercial database systems and the design of window functions in SQL:1999. He has written the widely used text “Database Management Systems”, and received the ACM SIGKDD Innovations Award, the ACM SIGMOD Contributions Award and the 10-Year Test-of-Time Award, a Distinguished Alumnus Award from IIT Madras, and a Packard Foundation Fellowship."
