["https://cs.utexas.edu/advisory-council/forest-baskett"]
title = "Forest Baskett | Department of Computer Science"
description = "Forest Baskett, PhD, joined New Enterprise Associates in 1999 and has been a General Partner since 2004. Baskett focuses on information technology investments and serves on the board of directors for several private and public companies."
full_description = "Forest Baskett Dr. Forest Baskett, PhD, joined New Enterprise Associates in 1999 and has been a General Partner since 2004. Baskett focuses on information technology investments and serves on the Board of Directors for several private and public companies. He served as the Chief Technology Officer and Senior Vice President at Graphics Properties Holdings, Inc. Prior to NEA, he served as a Senior Vice President of Research and Development and Chief Technology Officer at Silicon Graphics Inc. He served as an Advisor at ReShape, Inc. He founded and directed the Western Research Laboratory of Digital Equipment Corporation from 1982 to 1986. He was a Professor of Computer Science and Electrical Engineering at Stanford University from 1971 to 1982. He also served for two years at Los Alamos National Laboratory building an operating system for the original Cray-1 computer and a year and a half at Xerox Palo Alto Research Center as a Principal Scientist doing VLSI research. Dr. Baskett received a BA in Mathematics from Rice University, a Ph.D. in Computer Science from the University of Texas at Austin and is a member of the National Academy of Engineering."
