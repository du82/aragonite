title = "Department of Computer Science"
description = "Consistently ranked one of the nation's top computer science programs, UT Computer Science supplies the people and ideas shaping the digital frontier."
full_description = "Robots, Research, and the Road to Texas: Q&A with Dr. Volkan Isler Get to know Volkan Isler David Wu Named Sloan Research Fellow Hook 'em! Brent Waters Elected IEEE Fellow Read more Previous Next Faculty Recruiting We are recruiting in all areas. We especially invite groups of faculty that would like to continue a collaboration, or to establish one. But, all candidates with a passion for research and teaching and the ambition to change the world are encouraged to apply. Learn More Schedule a visit The Computer Science Ambassadors are current CS majors who meet with prospective students who are interested in pursuing a degree in computer science at the University of Texas at Austin. Learn More Texas Robotics Researchers from across multiple top-ten departments at UT Austin work to advance the capability of robotics in numerous application areas, including: social, surgical, rehabilitation, vehicles, drilling, manufacturing, space, nuclear, and defense. Learn More Machine Learning Laboratory Machine Learning Laboratory at UT Austin is the focal point of machine learning research on campus, featuring a community of over 100 researchers across various disciplines, including: computer scientists, engineers, linguists, ethicists, and mathematicians. Learn More Latest News February 26, 2025Robots, Research, and the Road to Texas: Q&A with Dr. Volkan Isler February 19, 2025Celebrating a Century of Quantum Science and Technology February 18, 2025David Wu Among Six University of Texas at Austin Faculty Named Sloan Research Fellows February 12, 2025How Undergraduates Can Get Research Experience with Peter Stone February 6, 2025AI Brain Decoder Moves Closer to Real-World Use for People With Aphasia More news AI Brain Decoder Moves Closer to Real-World Use for People With Aphasia UT Austin researchers have improved their AI-powered brain decoder, allowing it to translate thoughts into continuous text with just one hour of training—far less than the original 16-hour process. This advancement makes the technology more accessible, particularly for individuals with aphasia, by enabling communication without requiring spoken language comprehension. Learn More How a UT Computer Science Alum's Summer Project Transformed Class Registration for Thousands When Sriram Hariharan didn’t land an internship during his freshman summer at UT Austin, he took the road less traveled—creating a tool that revolutionized class registration for thousands of students. Follow Sriram's Path to Success Talks & Events Mar 05 FoCS Internship Roundtable 5:00 pm Mar 05 SWE Skills DiRP + LDOS Meeting 5:00 pm Mar 06 Faculty Candidate Talk – Tianyu Gao/Princeton University, Enabling Language Models to Process Information at Scale 11:00 am More Talks & Events"
