["https://cs.utexas.edu/advisory-council/sean-scott"]
title = "Sean Scott | Department of Computer Science"
description = "As the first Chief Product Officer at PagerDuty, Sean Scott is responsible for PagerDuty’s multi-product digital operations management platform, leading product management, product marketing, design, user experience and pricing teams."
full_description = "Sean Scott Sean Scott is the Chief Product Officer at PagerDuty. As PagerDuty’s first Chief Product Officer Scott is responsible for PagerDuty’s multi-product digital operations management platform, leading PagerDuty’s product management, product marketing, design, user experience and pricing teams to drive growth and innovation through seamless, fast time to value, user-focused solutions. Scott brings more than 20 years of experience in the technology industry, the majority of which has been spent at Amazon. His tenure at Amazon began as a technical product manager and he rose through the ranks to become Vice President of Shopping Experience Technology, where he was responsible for Amazon’s home page, product pages, cart, checkout experiences. Most recently Sean was Vice President of Autonomous Delivery, where he started and led the team of robotics, hardware and software experts responsible for developing and operating the e-commerce giant’s first fully-electric delivery system, designed to safely get packages to customers using autonomous delivery devices. Prior to joining Amazon, Scott worked in enterprise software. He began his career at the Department of Defense. Scott holds a bachelor’s degrees in computer science and a MBA from The University of Texas at Austin. He was named to The Adweek 50 in 2020 as one of the top execs in marketing, media and tech, and is a member of the Advisory Council of the University of Texas at Austin and holds 36 patents."
year_published = 2025
