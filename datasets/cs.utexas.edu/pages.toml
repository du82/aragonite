["https://cs.utexas.edu/advisory-council/justin-taylor"]
title = "Justin Taylor | Department of Computer Science"
description = "Justin Taylor is Vice President of Artificial Intelligence for Lockheed Martin within Corporate Engineering. He is responsible for leading the corporation’s development and implementation of an artificial intelligence / machine learning technology strategy, as well as leading the Lockheed Martin AI Center (LAIC)."
full_description = "Justin Taylor Justin Taylor is Vice President of Artificial Intelligence for Lockheed Martin within Corporate Engineering. In this capacity, he is responsible for leading the Corporation’s development and implementation of an Artificial Intelligence (AI) / Machine Learning (ML) technology strategy, as well as leading the LM AI Center (LAIC). Throughout his career, beginning as a Software Engineer at Lockheed Martin Aeronautics in May 2000, Justin has led advancements in innovative technology progressing from virtual simulation experimentation, to flight experimentation, to driving the future of mission systems open architectures. His previous leadership experience includes internal R&D to design and mature airborne open architectures as well as serving in a capture manager and program manager role on multiple DARPA R&D programs. Justin holds a Bachelor of Science Degree in Computer Science from the University of Texas and is a graduate of LM’s Advanced Technology Leadership Program (ATLP) and Program Management Development Program (PMDP)."
