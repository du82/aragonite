["https://cs.utexas.edu/about"]
title = "About Us | Department of Computer Science"
description = "Image Download brochure The University of Texas at Au"
full_description = "About Us Image Download brochure The University of Texas at Austin Department of Computer Science (UTCS) is ranked as a top-ten computer science department nationally and is the only top-ten computer science department within 1,000 miles of Austin, TX.Department ChairProfessor Don Fussell2317 Speedway, 2.308Austin, Texas 78712Phone: (512) 471-9590chair@cs.utexas.edu RankingsU.S. News and World Report ranks UTCS nationally:#7 in U.S. computer science graduate programs (2024)#7 in Programming language#8 in Theory#9 in Artificial intelligence#10 in Systems#10 in U.S. computer science undergraduate programs (2025)#7 in Software Engineering#8 in Cybersecurity#10 in Computer Systems#12 in Artificial Intelligence#12 in Programming Languages#14 in TheoryBy the Numbers2006 undergraduate and graduate students87% of graduates go on to immediate employment or graduate school.UTCS has over 20,000 alumni and growing.210+ companies actively engaged in on-campus recruiting of CS studentsThe U.S. Bureau of Labor Statistics has projected an 17% increase in need for CS degreed people from 2014 to 2024.11 percent Hispanic undergraduate enrollment25 percent female undergraduate enrollmentStudents from 25 states and 14 countries StudentsAt UT Computer Science, undergraduate students receive a rigorous educational experience, with options to pursue more than 50 courses that span the full spectrum of topics in modern computer science. All undergraduate students will develop a strong background in hardware architecture and mathematics as a foundation on which to build their computing education.Consistently ranked as one of the nation’s top ten graduate programs in computer science, UT Computer Science is proud to be able to say that the education our students receive is second to none. During your time at UT Computer Science, you can expect to learn from both world-class faculty and from your peers, who are carefully selected because they possess the potential to shape the future of the field.FacultyUTCS supports about 52 faculty.Faculty Awards and HonorsOver 150 national & international awards, including 2 Turing Awards51 university teaching awards15 university service awardsResearch AreasArtificial IntelligenceBioinformatics and Computational BiologyComputer ArchitectureData Mining, Machine Learning, and Natural ComputationFormal MethodsGraphics and VisualizationModel Driven EngineeringOperating systems, Distributed systems, and NetworkingProgramming Languages and ImplementationScientific ComputingSecurityTheoretical Computer ScienceSpecial ProgramsCertificate programs: INFOSEC, Technical Concentrations, and Social Impact StampsIndustry relations: Friends of Computer Science (FoCS) and research partnership programs5 Year Masters' Degree programsTuring Scholars Honors ProgramElements of ComputingFreshman Research Initiative (FRI)Longhorn StartupStudy AbroadUTeachThe Home of UTCSName: The Bill & Melinda Gates Computer Science Complex and Dell Computer Science HallDonors: The Bill & Melinda Gates Foundation, the Michael & Susan Dell Foundation, UT Board of Regents, and UT SystemLocation: Central campus, facing Speedway, adjacent to POB and on the footprint of Taylor HallSquare Feet: 140,000 net assignable square feetCapacity: The complex will accommodate a 40% increase in faculty and a 50% increase in computer science students, meeting a pressing demand for computing innovation and talent. It will house faculty, visitors and technical staff, spaces for visiting scholars and postdoctorates, graduate student spaces, almost 17,500 assignable square feet of flexible and highly programmable research laboratory space, a 200-seat lecture hall, seven classrooms, ten electronic seminar rooms and instructional laboratories, two dedicated study areas for undergraduates and graduate students, over 24 discussion areas, eight conference rooms, student organization offices, and other types of space to encourage interaction and collaboration.Current FacilitiesTo provide the most advanced resources for teaching and research, the Department of Computer Science manages its own network and systems, which number over 1600 hosts. UTCS operates a general-purpose High Throughput Computing (HTC) cluster, Mastodon, which is managed using the HTCondor job scheduling software.Other Research labs utilizing state of the art computing resources:Lab for Advanced Systems ResearchGraphics LabReal-Time System LabACL2 LabArtificial Intelligence LaboratoriesNetworking Research LaboratoryComputer Architecture and Technology LaboratoryComputational Biology LaboratoryVisualization LaboratoryWireless Networking Research LaboratoryBatory LabVirtual Reality Laboratory"
