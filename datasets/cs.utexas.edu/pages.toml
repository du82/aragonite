full_description = "Adriane McFetridge Adriane McFetridge joined Netflix as the Director of Engineering in May 2017 and leads the Subscription Platform engineering team. Prior to joining Netflix, Adriane served as the VP of Payment Software Services for Verifone. Adriane focuses on global technology and has an extensive background in eCommerce, payments and enterprise applications. She has built and operated high caliber global engineering organizations. Her previous leadership experience includes Director of Product Management at StubHub, Director of Global Cross Border Trade at eBay, Chief of Staff to the CEO at eBay, Director of Quality Operations at PayPal, and CTO of Tradera. Adriane holds an MBA from Alliance Manchester Business School and a BS in Computer Science from The University of Texas at Austin."
