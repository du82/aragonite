["https://cs.utexas.edu/advisory-council/arjun-chopra"]
title = "Arjun Chopra | Department of Computer Science"
description = "Arjun Chopra is a Partner at Floodgate. He leads the firm’s investments in opportunities that transform the “IT stack” in ways that help companies change the way they do business and compete."
full_description = "Arjun Chopra Arjun Chopra is a Partner at Floodgate. He leads the firm’s investments in opportunities that transform the “IT stack” in ways that help companies change the way they do business and compete. Before Floodgate, Arjun was the CTO at Cambridge Technology Enterprises (CTE), a publicly traded cloud services company, where he launched and led their cloud business. He was a member of the board and executive team that raised multiple rounds of financing and spun out smartShift Inc. He led 350+ people, managed 200M hours of uptime in the public cloud and was recognized as one of Amazon Web Service’s top 22 partners world-wide. Arjun joined CTE when they acquired his Open Source startup, Vox Holdings. Arjun holds multiple technology patents that have been cited as prior art by firms like Apple, AT&T and iRobot. He has also held several technology development and management positions in consumer and enterprise software companies, including Microsoft, Motive and IBCC."
