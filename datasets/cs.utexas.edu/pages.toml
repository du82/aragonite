["https://cs.utexas.edu/advisory-council/jennifer-gill-roberts"]
title = "Jennifer Gill Roberts | Department of Computer Science"
description = "Jennifer Gill Roberts is a Bay Area native, technologist, repeat entrepreneur and seasoned venture capitalist. She co-founded her current venture fund, Grit Ventures to focus on early stage investments in AI, Robotics and Advanced Energy."
full_description = "Jennifer Gill Roberts Jennifer Gill Roberts is a Bay Area native, technologist, repeat entrepreneur and seasoned venture capitalist. She co-founded her current venture fund, Grit Ventures to focus on early stage investments in AI, Robotics and Advanced Energy. Grit Labs is an Affiliate Sponsor of Texas Robotics. Prior to Grit, Jennifer co-founded RallyOn, a wellness gaming startup, and served as Chair and Chief Marketing Officer. She was a founder and Managing Partner at top tier venture capital firm, Sevin Rosen Funds, where she helped grow the Palo Alto office from 2 Managing Partners to over 8 investment professionals in a decade, leading investments in seed-stage market leading companies in optical and wireless equipment. Prior to her career in venture, Jennifer led product and technical efforts at Apple Computer, Hewlett-Packard Company, and Sun Microsystems. As an early champion of women entrepreneurs, Jennifer co-founded Watermark, the premier organization for women entrepreneurs and executives. She has a BS in Electrical Engineering and an MBA from Stanford and an MS in Electrical Engineering from the University of Texas at Austin."
