["https://cs.utexas.edu/graduate-program/courses"]
title = "Graduate Courses | Department of Computer Science"
description = "Graduate courses are divided into two groups:"
full_description = "Courses Graduate courses are divided into two groups: Diversity courses can be used to satisfy the diversity requirements of either the Ph.D. or the Masters degree. They may also be used as part of a student's depth or elective program. Non-diversity CS courses can be used to fulfill depth or elective requirements. A full listing of all of the department's graduate classes can be found in the CS section of the University's Graduate Catalogue. One course deserves special mention here: CS 395T is a topics course. Each semester, the faculty offer CS 395T sections on a variety of topics that span their research interests. For examples of recent topics, look at the 395T section of the listing of class home pages. Note that CS 395T is different from CS 395 (Conference Course). ** Registration For Graduate Computer Science Courses for Non-C S Graduate Students ** Non-C S Graduate Students: May register for C S graduate course on the first class day of a given semester (Fall/Spring/Summer). We remove the restriction on our courses on this day each semester. We will not remove the restriction before this date. Undergraduate C S Students: Please talk with your assigned C S academic advisor regarding the process to register for a graduate course. We allow C S undergraduates with proper approval to register for C S graduate courses the day before classes begin. Undergraduate non-C S Students: Please talk with your assigned academic advisor regarding the process to register for a graduate course. We allow non-C S undergraduates with proper approvals to register for C S graduate courses beginning the first day of class. Graduate Graduate Prospective Students Master's Program Ph.D. Program Courses Course Schedules Diversity Courses Teaching Plans Class Homepages Financial Information Incoming Students Current Students Portfolio Program in Robotics Curricular Practical Training Forms Graduate Student Talks"
