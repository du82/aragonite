full_description = "News How Undergraduates Can Get Research Experience with Peter Stone 02/12/2025 - In a recent interview with TechGuide.org, UT Austin Computer Science Professor Peter Stone shares insights on how undergraduates can secure research opportunities in AI. As the founder of the Learning Agents Research Group and Director of Texas Robotics, he emphasizes the value of interdisciplinary skills, hands-on research, and continuous learning. Listen to the full conversation to explore AI career paths, research strategies, and actionable steps for breaking into the field. Read Article AI Brain Decoder Moves Closer to Real-World Use for People With Aphasia 02/06/2025 - UT Austin researchers have improved their AI-powered brain decoder, allowing it to translate thoughts into continuous text with just one hour of training—far less than the original 16-hour process. This advancement makes the technology more accessible, particularly for individuals with aphasia, by enabling communication without requiring spoken language comprehension. The team is now collaborating with experts in aphasia research to explore its potential for real-world applications. Read Article Brent Waters Elected IEEE Fellow 02/06/2025 - Brent Waters, a cryptography professor in the Department of Computer Science at UT Austin, was recently named one of IEEE’s newest fellows. Read More The Future of AI Research: UT's Adam Klivans on KXAN 01/30/2025 - Dr. Adam Klivans, UT Computer Science professor and director of the Institute for Foundations of Machine Learning, joined KXAN Austin to discuss the impact of DeepSeek’s latest AI model. He explained how the Chinese company’s breakthrough in training efficiency—achieving high-performance results with significantly less computational power—has surprised the AI industry and affected major tech stocks. Klivans also highlighted ongoing questions about DeepSeek’s methods and the broader implications for AI development. Read Article How a UT Computer Science Alum's Summer Project Transformed Class Registration for Thousands 01/29/2025 - If asked during his freshman year, Sriram Hariharan never would have guessed he would create his first million-dollar acquisition before graduation.Beginning his freshman year summer, Hariharan didn’t hear back from any internships while his friends got their offers. Instead of becoming unmotivated, he took matters into his own hands. Read More Researchers Reduce Human Effort in Robot Training 01/07/2025 - The Robot Perception and Learning Lab launched DexMimicGen, a new data generation system to improve training for humanoid robots. It builds on the lab’s earlier system, MimicGen, to predict humanoid autonomous robot movements from a small set of human demonstrations. Read More Record Number of Computer Science Undergraduates Earn Research Recognition 01/02/2025 - Four undergraduate computer science researchers were recognized by the Computer Research Association in the 2025 CRA Outstanding Undergraduate Researcher Award — the largest recognition of the department’s undergraduate research yet. Read More Computing Named Among Best in Global Ranking of Academic Subjects 12/06/2024 - UT Austin ranked eighth in computer science and engineering globally in new report by ShanghaiRanking. Read Article UT Programming Team Takes 1st Place in Regional ICPC Competition 12/05/2024 - All four teams from the UT Programming Team finished top six, including taking first place, in the South Central USA Regional Competition of the International Collegiate Programming contest last month. Read More Risto Miikkulainen’s Leadership in AI Research and Industry Recognized Globally 12/04/2024 - 2024 marks a pivotal year for Risto Miikkulainen, Professor of Computer Science at UT Austin, with several major achievements showcasing his leadership in artificial intelligence (AI) and neural networks. Read More Pagination 1 2 3 4 5 6 7 … › Next page » Last page News Categories Alumni Awards & Honors Events Faculty Graduate Program Graduate Students Industry Relations Outreach Press Release Research Undergraduate Program Undergraduate Students"
