["https://cs.utexas.edu/advisory-council"]
title = "Advisory Council | Department of Computer Science"
full_description = "Advisory Council The UT Computer Science Advisory Council is an external community of alumni and friends who support, advise, and assist the chair in accomplishing the department's academic and societal missions. Forest Baskett Forest Baskett, PhD, joined New Enterprise Associates in 1999 and has been a General Partner since 2004. Baskett focuses on information technology investments and serves on the board of directors for several private and public companies. read more Nawaf Bitar Nawaf Bitar is a Senior Advisor for Citadel Securities, where he is responsible for helping drive the firm’s efforts to continue attracting exceptional technology talent, managing external relationships and other initiatives. read more Ross Buhrdorf Ross A. Buhrdorf joined ZenBusiness in 2016 and serves as the CEO. In his more than 30 years as a technology leader, entrepreneur and corporate executive, Ross helps transform the way consumers interact with technology. read more Arjun Chopra Arjun Chopra is a Partner at Floodgate. He leads the firm’s investments in opportunities that transform the “IT stack” in ways that help companies change the way they do business and compete. read more Tara Estlin Tara Estlin is Deputy Chief Technologist for Mission Systems and Operations at the NASA Jet Propulsion Laboratory in Pasadena, California. She is also the Supervisor of the JPL Machine Learning and Instrument Autonomy group. read more Ashish Gupta Ashish Gupta is an Engineering Fellow, and Vice President of Engineering at Google. Since Feb 2019, Ashish leads Engineering for the YouTube Ads platform, responsible for advertiser-facing video-ads products, ad-serving and quality. read more Deepak Hathiramani Deepak Hathiramani is Non-Executive Chairman of the Vistronix Board of Directors. The founder and former CEO of Vistronix, he has more than 25 years of management and technical experience with privately-funded and venture-funded high-tech start-ups. read more Robert Hormuth Robert Hormuth is the Corporate Vice President, Architecture and Strategy of the Data Center and Embedded Solutions (Server, Data Center GPUs, and Embedded product lines) at AMD. Robert has 33+ years in the computer industry. read more Duncan Hudson As Chief Platform Officer for National Instruments, Duncan G. Hudson III is responsible for guiding the evolution of NI’s product platform and leading the R&D fellows. read more Amir Husain Amir Husain is a serial entrepreneur and inventor based in Austin, Texas. He is the Founder & CEO of SparkCognition, Inc. an award-winning Machine Learning/AI driven Cognitive Analytics Company, and serves on the Board of Advisors for IBM Watson. read more Irfan Hussain Irfan Hussain is the Chief Information Officer at the London Stock Exchange Group (LSEG), bringing extensive experience from his previous roles at Goldman Sachs, where he began as an analyst and eventually became Partner, overseeing various global operations, and he holds a BS in Computer Science from The University of Texas at Austin. read more Nagraj Kashyap Nagraj Kashyap joined SoftBank Investment Advisors in early 2021 as a Managing Partner. Prior to SBIA, he founded M12, Microsoft’s venture fund, in 2016 to invest in early stage enterprise software startups. read more Greg Lavender Greg Lavender is senior vice president, chief technology officer (CTO) and general manager of the Software and Advanced Technology Group (SATG) at Intel Corporation. As CTO, he is responsible for driving Intel’s future technical innovation and research programs. read more Pierre Malko Pierre Malko founded Dante in 1998 and serves as Dante's CEO and President. He is responsibe for overall strategy of the firm, the architecture direction of the Allegory Platform, and the day-to-day operations of Dante. read more Adriane McFetridge Adriane McFetridge joined Netflix as the Director of Engineering in May 2017 and leads the Subscription Platform engineering team. Prior to joining Netflix, Adriane served as the VP of Payment Software Services for Verifone. read more Tarun Nimmagadda Tarun Nimmagadda is a co-founder of Mutual Mobile, the product development and innovation agency he co-founded at the age of 22. A tinkerer and creative thinker, Tarun was an early believer in the promise of connected devices. read more Dheeraj Pandey Dheeraj is the Founder, CEO & Chairman of Nutanix. He brings a wealth of experience of working at high growth enterprise software companies. read more DeWayne Quinn DeWayne, a veteran of Apple's Information Systems & Technology for the Americas, shaped its tech landscape with expertise in enterprise solutions and M&A integration. Active in philanthropy and education, he advises UC Davis Foundation and COSMOS, reflecting his commitment to advancing STEM. With a B.A. in Political Science from UC Davis, he pursued executive management studies at Stanford and UC Berkeley. read more Raghu Ramakrishnan Raghu Ramakrishnan is CTO for Data and a Technical Fellow in the Cloud and Enterprise (C&E) division at Microsoft. read more Jennifer Gill Roberts Jennifer Gill Roberts is a Bay Area native, technologist, repeat entrepreneur and seasoned venture capitalist. She co-founded her current venture fund, Grit Ventures to focus on early stage investments in AI, Robotics and Advanced Energy. read more Sean Scott As the first Chief Product Officer at PagerDuty, Sean Scott is responsible for PagerDuty’s multi-product digital operations management platform, leading product management, product marketing, design, user experience and pricing teams. read more Rajat Shroff Rajat Shroff is the Vice President and Head of Product Management and Design at DoorDash, where he oversees the product design, product management and product operations teams. read more Brian Skiba Brian Skiba is part of the Babylon Health team in the US focused on Products, Engineering & Solutions for the Americas market. read more Kay Stepper Dr. Kay Stepper is senior vice president of ADAS and Automated Driving - Bosch in North America. Since joining Bosch in 1996, Dr. Stepper has held a series of business leadership and management positions in engineering, research, product development and marketing in both the U.S. and in Germany. read more Justin Taylor Justin Taylor is Vice President of Artificial Intelligence for Lockheed Martin within Corporate Engineering. He is responsible for leading the corporation’s development and implementation of an artificial intelligence / machine learning technology strategy, as well as leading the Lockheed Martin AI Center (LAIC). read more Gregg Zeitlin Gregg Zeitlin co-founded Reservoir Capital Group in 1998 and serves as a Senior Managing Director and a member of the firm’s Investment Committees. He currently serves on the boards of many of Reservoir’s portfolio companies, including ContourGlobal, Voyager Aviation, and ClearCaptions. read more"
