full_description = "Ross Buhrdorf Ross A. Buhrdorf joined ZenBusiness in 2016 and serves as the CEO. Prior to joining ZenBusiness, Mr. Buhrdorf served as the Chief Technology Officer of HomeAway. In his more than 30 years as a technology leader, entrepreneur and corporate executive, Ross helps transform the way consumers interact with technology. He is passionate about the consumer Internet, security, mobile technology and how to apply innovation to build better products and a better world. Mr. Buhrdorf is a member of the Board of Directors for American National Bank (where he is helping them through a digital transformation and security upgrade) and the Santa Fe Institute - a pioneering research institute that studies complex adaptive systems in an effort to answer some of humanity’s biggest questions. Buhrdorf also serves on the board of KLRU, the non-profit PBS affiliate in Austin. An active mentor and angel investor in the technology community, Ross is a Partner at Capital Factory, a globally recognized accelerator program and investment fund. Since 1993, Mr. Buhrdorf also has owned and consulted with a variety of software companies. Mr. Buhrdorf holds a B.S. in Computer Science from the University of Texas at Austin."
