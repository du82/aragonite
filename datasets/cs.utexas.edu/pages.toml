["https://cs.utexas.edu/graduate-program/masters-program/coursework-option"]
title = "Coursework Option | Department of Computer Science"
description = "Coursework Option (also called No Thesis/No Report)The list of courses required to obtain a degree is called the program of work. A total of 30 hours of coursework within 3 areas is needed to complete the program of work for the Master’s coursework option. The Graduate Advisor approves the program of work prior to graduation. This checklist is available for planning and evaluating your program of work."
full_description = "Coursework Option Coursework Option (also called No Thesis/No Report)The list of courses required to obtain a degree is called the program of work. A total of 30 hours of coursework within 3 areas is needed to complete the program of work for the Master’s coursework option. The Graduate Advisor approves the program of work prior to graduation. This checklist is available for planning and evaluating your program of work. Please see Course Information for current and future semester CS teaching plans.The information below is organized into five sections. Section 1 discusses background requirements. Section 2 discusses major coursework requirements. Section 3 discusses minor coursework requirements. Section 4 discusses additional requirements. Section 5 discusses transfer work.1 - BACKGROUND REQUIREMENT(not a prerequisite, can be met after admission)We acknowledge that other departments/universities divide up their curricula in different ways. The important thing is that approximately the same material has been covered. The decision about which courses you submit for review meet the background requirements is made by the faculty. The form is submitted to the grad office.The following UTCS undergraduate courses, or equivalent, are required as background*:Discrete Math for Computer Science (CS 311)Introduction to Programming (CS 312)Data Structures (CS 314)Algorithms and Complexity (CS 331)Computer Organization and Architecture (CS 429)Principles of Computer Systems (CS 439)RulesAny background requirements not met at the time of admission must be satisfied while enrolled in the Masters program.A common question is whether an undergraduate background requirement can be satisfied by taking the corresponding graduate course. Generally speaking, the corresponding graduate course assumes the undergraduate material as background, and so this approach is not permitted. That said, exceptions to this general rule are sometimes granted. A student seeking an exception should consult with the faculty member teaching the corresponding graduate course.One upper-division background course taken at UTCS as a graduate student may count towards your CS Major coursework.How to Complete Background RequirementsComplete an undergraduate degree with a major in Computer Science prior to joining our graduate program; ORCoursework that covers the background topics through any combination of:Courses taken prior to admission.Background courses named above may be taken at UTCS as a graduate student. An overall GPA of 3.50 on courses taken at UTCS is required unless only 1 course is taken, in which case the requirement is for a 3.0 in that single class.Student receives a B or better on Final exam(s) of UTCS undergraduate background courses.*Students who first enrolled prior to Fall 2016 may choose to graduate under the new rules above or fulfill the previous background requirements. Please see the pre-2016 background coursework form and checklist for a list of previous background coursework.2 - MAJOR COURSEWORK REQUIREMENT (CS COURSES)24 hours of major coursework – Please pay attention to the Credit/No Credit (CR/NC) rules written in #2 below. 9 hrs. of diversity courses, 15 hrs. of CS Graduate coursesRules for Coursework Option9 hours of diversity courses - 1 course from each of the 3 areas - applications, systems, and theory. Passed with a grade of B- or better.15 hours of any 5 CS graduate courses passed with a grade of C or better.One undergraduate upper division course may be substituted for 1 graduate course; however, no 'elements' courses may be used as a substitute.The undergraduate course may be taken either for a grade or CR/NC. Please remember background courses have a grade requirement so are not usually taken CR/NC. At most 3 hours of undergraduate coursework can count towards your program of work.It is possible to receive credit towards the MS degree for taking a CS 395 conference course (i.e., supervised research). However, students wishing to explore this possibility should bear in mind the following considerations.First, CS 395 is graded on a CR/NC basis, and at most one CR/NC course can be used towards the MS degree. (Exception: The MS thesis sequence CS 698A/B is graded on a CR/NC basis, and does not count against the one CR/NC course limit.)Second, a grade of CR is necessary but not sufficient to receive credit towards the MS degree. After assigning a grade of CR in the course, if the supervising professor feels that the student's work is strong enough to merit MS degree credit, they should send a statement to this effect to gradoffice@cs.utexas.edu. The statement should include a brief summary of the student's accomplishments in the CS 395.How To Select Courses and RegisterThe CS graduate department does not advise each semester, although you can visit the graduate office at any time with questions. You can seek information on classes from your peers, looking at course evaluation information and by going to course information. You can also attend the first day of classes and speak with the instructor.Personal registration dates and times can be accessed by going to your Registration Information Sheet (RIS).3 - MINOR COURSEWORK REQUIREMENTS6 hours (2 courses) in a minor: a supporting subject or subjects outside of computer science.RulesOne minor course may be an undergraduate upper division. (At most 3 hours of undergraduate coursework can count towards your program of work.)One minor course may be taken on a CR/NC basis. (At most 3 hours of CR/NC coursework can count towards your program of work.)Graduate Adviser approval required. This must be obtained no later then the first 12 class days in Spring or Fall sessions and the 4th class day in Summer session.How To Obtain Approval and RegisterEmail the graduate advisor directly explaining the importance of the course with a cc: to gradoffice@cs.utexas.edu for minor course approval. Minor courses only count on your program of work with approval from the graduate adviser.Personal registration dates and times can be accessed by going to your Registration Information Sheet (RIS).4 - ADDITIONAL REQUIREMENTSIn addition to the requirements mentioned above, there are rules imposed by both the CS department and the Graduate School. These rules cover grades, courses taken in residence, transfer credit, time limits etc. Every student should read these rules soon after being admitted to the Masters program and make sure to satisfy them.The Graduate School specifies degree requirements in the Graduate Catalog that apply to courses counted toward a graduate degree. Read that information and make sure that you satisfy each item. We summarize below the graduate school and department requirements that most often affect CS students.A maximum of 3 hours of undergraduate classes may be counted for a 30 hr. masters degree.A minimum grade point average of 3.0 overall is required.All degree requirements must be completed within a 6 year period.Diversity requirement: 9 hours of diversity courses, one from each diversity area.Major requirement: additional CS courses as required for each degree.No more than 3 hours of courses may be taken on a CR/NC.To receive a Masters degree, a student must have been in residence at UT-Austin for two full semesters or equivalent. (see transfer work below)Courses in which a student earned a C- and lower or NC may not be counted on the program of work.5 - TRANSFER WORKRulesThe following rules apply to courses transferred from another institution:Only courses taken at major institutions within the United States may be transferred. CS Graduate Adviser and the Graduate school must approve the institution and course(s).Only graduate courses may be transferred. Courses designed for both graduates and undergraduates are generally not eligible for transfer credit.Only courses in which a grade of A or B was earned may be transferred.A maximum of two courses (6 hours) may be transferred.No course that counted toward a previous degree may be transferred.No transferred course may be used to satisfy a diversity requirement.To apply for transfer credit, a student must submit:A petition to the Graduate Advisor. The petition will also have to be signed by the Dean of the Graduate School.An official transcript that shows the course that is to be transferred.An official explanation of the course numbering system that is used at the institution at which the course was taken.A copy of the course description taken from the institution's catalogue or web site. Graduate Graduate Prospective Students Master's Program Coursework Option Thesis Option Online Programs & Degrees Ph.D. Program Courses Financial Information Incoming Students Current Students Portfolio Program in Robotics Curricular Practical Training Forms Graduate Student Talks"
