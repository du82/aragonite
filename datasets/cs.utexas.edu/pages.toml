["https://cs.utexas.edu/engage/industry/focs"]
title = "Friends of Computer Science | Department of Computer Science"
description = "Friends of Computer Science (FoCS) is our primary platform to help companies network with students, build relationships with students, and improve recruiting outcomes."
full_description = "Friends of Computer Science Build better student relationships. See the Benefits Program Levels How It Works Meet Our Partners Get Started Friends of Computer Science (FoCS) is our primary platform to help companies network with students, build relationships with students, and improve recruiting outcomes. Key Benefits Networking & Recruiting Events Companies who want to build on career fairs and job boards can attend our computer science-specific fall and spring networking events. The FoCS Fall Career Brunch and Spring Reconnect Night give companies access to hundreds of internship and career-ready computer science students. Tech Talks & Info Sessions Build your brand and expand your appeal by hosting talks and info sessions to educate students on priority technologies and how they can build a career with your company. Relationship Building Activities Build meaningful relationships with students by interacting with them through social events, student organizations, and other activities that comprise daily life in UT Computer Science. Custom Events Have your own recruiting strategies that work for you? We can support that. Our FoCS relationship managers can help you understand how to deploy your preferred recruiting methods while FoCS drives marketing and attendance. FoCS+ Corporate Partners$35,000 Corporate Partners$20,000 Government & Startups$10,000 FoCS+ partners receive ALL standard FoCS benefits, plus access to up to three UTCS student organizations of the partners’ choosing.Contact us to learn more about which option works best for you. How It Works Strategy We collaborate with you through customized engagement strategies and offer feedback on how you can effectively engage with UTCS students. Visibility We ensure that UTCS students are fully informed about FoCS sponsored events, engagement, and outreach through email, social media, and digital marketing. Support We help our partners navigate the daunting task of university outreach by providing logistical support. Image Through attending FoCS recruiting events, I quickly became comfortable with the recruiting process and started forming valuable connections. Now, I find myself able to converse openly and honestly with the many recruiters I have built relationships with. Mikayla Moore, UT Computer Science 2021 Meet Our Partners ×Apple revolutionized personal technology with the introduction of the Macintosh in 1984. Today, Apple leads the world in innovation with iPhone, iPad, Mac, Apple Watch and Apple TV. Apple’s four software platforms — iOS, macOS, watchOS and tvOS — provide seamless experiences across all Apple devices and empower people with breakthrough services including the App Store, Apple Music, Apple Pay and iCloud. Apple’s more than 100,000 employees are dedicated to making the best products on earth, and to leaving the world better than we found it. View company profileVisit company website ×Bloomberg is building the world's most trusted information network for financial professionals. Our core product, the Bloomberg Terminal, is an independent and unbiased source of information for our clients – everyone from C-Suite executives, traders, analysts, government o cials, business heavyweights and news professionals around the globe. View company profileVisit company website ×BlueChew is an online portal that connects potential patients with licensed medical providers for the treatment of the symptoms of erectile dysfunction. BlueChew exclusively serves men who are unable to tolerate commercially available pills, do not want an in-person doctor's visit, and want to have an increased chance of stronger and longer-lasting erections. Quality patient care and prescription treatments do not have to be inconvenient or expensive. BlueChew is a service that makes getting the treatment you need possible from the comfort of your home, at affordable prices. No in-person doctor visit. No waiting for appointments. No more awkwardness. Visit company website ×The Boeing Company is the world's largest aerospace company and leading manufacturer of commercial jetliners, defense, space and security systems, and service provider of aftermarket support. As America’s biggest manufacturing exporter, the company supports airlines and U.S. and allied government customers in more than 150 countries. Boeing products and tailored services include commercial and military aircraft, satellites, weapons, electronic and defense systems, launch systems, advanced information and communication systems, and performance-based logistics and training. Boeing has a long tradition of aerospace leadership and innovation. The company continues to expand its product line and services to meet emerging customer needs. Its broad range of capabilities includes creating new, more efficient members of its commercial airplane family; designing, building and integrating military platforms and defense systems; creating advanced technology solutions; and arranging innovative financing and service options for customers. View company profileVisit company website ×At Capital One, we dare to dream, disrupt and deliver a better way. Still founder-led by Chairman and Chief Executive Ocer Richard Fairbank, Capital One is on a mission to help our customers succeed by bringing ingenuity, simplicity, and humanity to banking. Guided by our shared values, we thrive in an environment where collaboration and openness are valued. We believe that innovation is powered by perspective and that teamwork and respect for each other lead to superior results. We elevate each other and obsess about doing the right thing. Our associates serve with humility and a deep respect for their responsibility in helping our customers achieve their goals and realize their dreams. We bring together smart, curious people who thrive on collaboration to become powerful teams. View company profileVisit company website ×Chevron is one of the world's leading integrated energy companies and conducts business worldwide. Our success is driven by our people and their commitment to get results the right way—by operating responsibly, executing with excellence, applying innovative technologies and capturing new opportunities for profitable growth. We are involved in virtually every facet of the energy industry. We explore for, produce and transport crude oil and natural gas; refine, market and distribute transportation fuels and lubricants; manufacture and sell petrochemical products; generate power and produce geothermal energy; provide energy efficiency solutions; and develop the energy resources of the future, including research for advanced biofuels. Come visit us to find out more about career opportunities at Chevron. View company profileVisit company website ×Citadel is a leading investor in the world’s financial markets. For over a quarter of a century, we have sought to deliver industry-leading investment returns to clients including corporate pensions, endowments, foundations, public institutions, and sovereign wealth funds. Our global team works to help our clients’ capital fulfill its greatest potential across a diverse range of markets and investment strategies, including fixed income & macro, equities, quantitative, commodities and credit. | Citadel Securities is a leading global market maker that helps meet the liquidity needs of asset managers, banks, broker- dealers, hedge funds, government agencies, and public pension programs. We o er a broad array of fixed income and equity products, utilizing a unique set of capabilities and tools designed to drive down the cost of transactions. We strive to provide the most e cient execution and highest caliber of client services, making markets more fair and accessible for all. View company profileVisit company website ×Google's innovative search technologies connect millions of people around the world with information every day. Founded in 1998 by Stanford Ph.D. students Larry Page and Sergey Brin, Google today is a top web property in all major global markets. Google's targeted advertising program, which is the largest and fastest growing in the industry, provides businesses of all sizes with measurable results, while enhancing the overall web experience for users. Google is headquartered in Silicon Valley with offices throughout North America, Europe and Asia. View company profileVisit company website ×This is an exciting time to join the Digital Team at H-E-B! As our Customer and Partner experiences continue to grow in popularity and adoption in areas like Curbside and Delivery, you will have the opportunity to dene the digital experience for millions of Customers and hundreds of thousands of Partners. Our Partners are utilizing the best technologies available to deliver modern and engaging experiences with the reliability, performance, and scale to service that only the best technical products can support. “When you design digital products at H-E-B, you are designing for your family and your community. Designing how a customer selects their food and how they bring it into their home is one of the hardest and most rewarding challenges.” -Mike, Chief Product Officer View company profileVisit company website ×Intuit is the global financial technology platform that powers prosperity for the people and communities we serve. With approximately 100 million customers worldwide using products such as TurboTax, Credit Karma, QuickBooks, and Mailchimp, we believe that everyone should have the opportunity to prosper. Visit company website ×Jane Street is a quantitative trading firm that uses innovative technology, a scientific approach, and a deep understanding of markets to guide our business. We are a global liquidity provider and market maker, operating around the clock and around the globe, out of offices in New York, London and Hong Kong. The markets change rapidly, and we need to change faster still. Every day, we come to work with new problems to solve, new systems to build and new theories to test. We’re always looking for people to join us and help come up with that next great idea. The environment is intellectual and collaborative, relaxed and playful, with a strong focus on education. You’ll learn about trading and our technology stack through in-house classes, guest lectures, and on-the-job experiences. You’ll have the freedom to get involved in many different areas of the business and we’re small enough that you can quickly and clearly see the impact of your work. At Jane Street, we consider trading and programming to be two ends of a continuum. As both a trading firm and a tech firm, we have room for people who love to trade, people who love to program, and people everywhere in between. Nearly all of our traders write code, and many of our developers trade. The role you carve out for yourself will be largely dependent on your strengths and the types of problems you enjoy thinking about. View company profileVisit company website ×Lockheed Martin is a premier systems integration company of 132,500 employees of whom 55,000 are scientists and engineers. Of those, 30,000 are software and systems engineers. Sales are $31.8 Billion and the company has a backlog of $76.9 Billion. Lockheed Martin business areas range from aeronautics to space as well as information and technical services and electronic systems. View company profileVisit company website ×Quantiq Partners specializes in high frequency derivatives trading in the largest markets worldwide. Our approach is rigorous and pragmatic, driven by technological expertise and analytics informed by real-world experience. We value employees who love to learn and have the tenacity, curiosity and willpower to contribute to our continuing success. We are a small but passionate team, dedicated to enhancing and refining our tried and true methods as we commit to our ongoing growth and performance. View company profileVisit company website ×We're building the new operating system for global supply chain andmanufacturing.Supply chain today runs on email and spreadsheets. Legacy enterprise resource planning systems (ERPs) make it impossible to drive best practices. Working across the value stream with multiple other organizations further complicates communication.Regrello's AI-powered workflow engine solves all this and more. It empowers experts to standardize processes and run them on autopilot, with humans in the loop. We want to become the new ERP, helping customers manage every aspect of the processes that power the most critical industries in the world. Visit company website ×Sandia National Laboratories is a national security laboratory involved in a variety of research, development and engineering programs to help secure a peaceful and free world through technology. We develop and deliver science-based solutions to prevent the spread of weapons of mass destruction, defend against terrorism, protect our national infrastructures, ensure stable energy and water supplies, provide new capabilities to our armed forces, and sustain, modernize, and protect our nuclear weapon stockpile. View company profileVisit company website ×SentiLink provides innovative identity and risk solutions, empowering institutions and individuals to transact confidently with one another.By building the future of identity verification in the United States and reinventing the currently clunky, ineffective, and expensive process, we believe strongly that the future will be 10x better. Visit company website ×SparkCognition is an award-winning developer of enterprise scale AI solutions that allow organizations across industries to predict future outcomes, automate processes, and prevent cyber-attacks. We do this for some of the biggest brands in the business by allowing them to analyze, optimize, and learn from data, augmenting human intelligence and delivering a better, safer, and more sustainable bottom-line result. The company is venture backed, with a marquis client list, world class board of directors, and globally recognized advisors, and has experienced exceptional growth (CAGR 100%+) since its inception in 2013. View company profileVisit company website ×To most, we are a Payments company, but we are so much more than that. Our mission is to increase the GDP of the internet and to do that, we are building economic infrastructure so that businesses of every size - from new startups to public companies - can use our software to accept payments and manage their businesses online. Visit company website ×As the world’s leader in digital payments technology, Visa’s mission is to connect the world through the most creative, reliable and secure payment network - enabling individuals, businesses, and economies to thrive. Our advanced global processing network, VisaNet, provides secure and reliable payments around the world, and is capable of handling more than 65,000 transaction messages a second. The company’s dedication to innovation drives the rapid growth of connected commerce"
