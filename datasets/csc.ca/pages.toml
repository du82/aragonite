["https://csc.ca/the-csc-welcomes-new-full-member-simon-pierre-gingras-csc"]
title = "The CSC Welcomes New Full Member, Simon-Pierre Gingras CSC - Canadian Society of Cinematographers"
description = "Congratulations to the newly accredited CSC member."
full_description = "Congratulations to the following newly accredited CSC member: Simon-Pierre Gingras CSC Photo credit: SPG Simon-Pierre Gingras is a cinematographer with over 15 years of experience in film andcommercial production. With a background in fashion and portrait photography, hebrings a keen visual sensibility and a strong narrative instinct to his work. His eye forbeauty, light, composition, and emotion allows him to craft striking, resonant imagerythat elevates storytelling. Deeply influenced by fashion, art, and visual culture, Gingras finds inspiration incinema—both classic and contemporary—as well as music, literature, painting,photography, poetry, architecture, and the transient beauty of light and shadow. Hisapproach is always story-driven, ensuring that every frame serves the script withprecision and purpose. His cinematographic style is marked by a sensitivity that shines through in projectssuch as La Faille 3 (2021) and L’Homme qui aimait trop (2021). His feature film workincludes Game of Death (2017), Une Manière de Vivre (2019), and Cœur de Slush (2023).Guided by Salvador Dalí’s belief—”Pas de chef-d’œuvre dans la paresse”— Simon-PierreGingras approaches each project with discipline, creativity, and an ever-evolving artisticvision, ensuring that his work remains both visually compelling and emotionallyprofound."
author = "lucy.kayumov@gmail.com"
