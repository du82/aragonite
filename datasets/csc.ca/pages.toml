full_description = "Filter by type CSC Audio Files Podcasts Photo Video CSC Presents CSC Insight Series CSC Walkthrough Series CSC Fundamental Series $ = jQuery.noConflict(); $(function(){ // bind change event to select $('#media_type').on('change', function () { var url = 'https://csc.ca/media-type/' + $(this).val(); // get selected value if (url) { // require a URL window.location = url; // redirect } return false; }); }); Video Round Table Talk View Video This round table from August 2017 features four innovative and respected members of the Canadian Society of Cinematographers: Maya Bankovic, Catherine Lutes csc, Scott McClellan, and Bobby Shore csc. The discussion is moderated by Dale Sood, and the video’s Director of Photography is Martin Wojtunik, associate CSC member. CSC Audio Files Podcasts Adam Marsden csc This podcast features cinematographer Adam Marsden csc, interviewed by Jeremy Benning csc and Martin Wojtunik (Associate member), discussing Adam’s work on the internet-crushing music video “Hotline Bling” for Drake. Adam talks about how he got his start and the craft of music videos in general. The video presented Adam with challenges related to shooting high frame rates with RGB LED light fixtures and lighting integration with set design. Guest hosted on the CSC instagram 1-29 Feb 2016. Podcast produced by Treehaus. Read More CSC Audio Files Podcasts Brett VanDyke csc This podcast features Director of Photography Brett Van Dyke csc in conversation with Carolyn Wong CSC Board member, about his industry beginnings, the TV series “Backstage” airing on Family Channel in March 2016, praise of documentary cinematographers, the art of 2nd unit shooting and tips for starting out. Guest hosted on the CSC instagram 16-30 Jan 2018. Thank you Grayson Matthews for the use of their studio space to record the podcast and Red Square Motion for post production services. Read More CSC Audio Files Podcasts Gerald Packer csc This podcast features Director of Photography Gerald Packer csc in conversation with Carolyn Wong, CSC Board member, about how much he enjoys working with the “funny bunch of people” on the award winning CBC hit comedy series “Schitt’s Creek”, hitting the lighting sweet spot between sitcom/drama and wanderings that lead him to where he is now. Thank you to Red Square Motion for post-production services and recording space. Read More CSC Audio Files Podcasts Daniel Grant csc This podcast features Director of Photography Daniel Grant csc in conversation with Carolyn Wong, CSC Board member. Daniel discusses his work on “The Messenger”, the award-winning Canada/France co-production feature documentary directed by Su Rynard. Also about precise timing, the hardest shot he’s ever done and easy crossover from non-fiction to fiction. Guest hosted on the CSC instagram 1-15 Nov 2017. Thank you to Red Square Motion for recording space, and to Michael Jari Davidson (Associate member) and Devin O’Haire for-post production services. Images courtesy of SongbirdSOS Productions Inc. Read More CSC Audio Files Podcasts Jeremy Benning csc This podcast features Director of Photography Jeremy Benning csc in conversation with Fanen Chiahemen and Carolyn Wong, discussing Jeremy’s work on season 1 of a big-budget sci-fi TV series “The Expanse” based on the series of novels by the same name. This series presented challenges with an extraordinarily large physical scale, number of futuristic sets and camera movements best described as “floating”. Guest hosted on the CSC instagram 1-31 Dec 2015 and 16-30 Aug 2018. Podcast production services were provided courtesy of Michael Jari Davidson (Associate member) and Devin O’Haire Read More CSC Audio Files Podcasts Dylan Macleod csc Part 2 This podcast features Director of Photography Dylan Macleod csc in conversation with Carolyn Wong, discussing Dylan’s work on a film “He Hated Pigeons” by director Ingrid Veninger. This feature presented challenges with a limited budget and very small crew, with principal photography Feb 2015 in Chile. Part 1 covers pre-production considerations and planning. Part 2 covers a “post” review of the production afterwards. Guest hosted on the CSC instagram Nov 2016. Podcast production services were provided courtesy of Michael Jari Davidson (Associate member) and Devin O’Haire Read More CSC Audio Files Podcasts Dylan Macleod csc Part 1 This podcast features Director of Photography Dylan Macleod csc in conversation with Carolyn Wong, discussing Dylan’s work on a film “He Hated Pigeons” by director Ingrid Veninger. This feature presented challenges with a limited budget and very small crew, with principal photography Feb 2015 in Chile. Part 1 covers pre-production considerations and planning. Part 2 covers a “post” review of the production afterwards. Guest hosted on the CSC instagram Nov 2016. Podcast production services were provided courtesy of Michael Jari Davidson (Associate member) and Devin O’Haire Read More CSC Audio Files Podcasts D. Gregor Hagey csc This podcast features Director of Photography D.Gregor Hagey csc in conversation with Carolyn Wong, discussing Gregor’s work on Season 1 of the TV series Beauty and the Beast, that aired on the CW network. Principal photography ran from 27 Jul 2012 to 13 Apr 2013. Guest hosted on the CSC instagram 1-15 Mar 2017. Podcast production services were provided courtesy of Michael Jari Davidson (Associate member) and Devin O’Haire Read More Page 11 of 11FirstPrevious…7891011"
