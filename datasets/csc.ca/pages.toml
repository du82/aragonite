y Manny Danelon and Jim TeevanThanks to Sim Post for editing the video. Read More April 4, 2019 CSC Gala 2019 Gala Tickets now available Details about 2019 Awards via included link Read More March 16, 2019 IMAGO International Awards CSC President George A. Willis csc attended the Annual IMAGO Conference and Awards Gala in Belgrade, Serbia. Read More Clavius Lens Testing Demo with Dylan Macleod, csc This event was sponsored by the CSC and hosted by Whites Camera at their facility in Toronto. Photos by Justin Lovell, Associate Member See more here at the Richard Gale Optics website: http://www.richardgaleoptics.uk/clavius-lenses Back in 2013 I saw some posts about some interesting looking vintage glass that was being rehoused to work with PL mount […] Read More January 19, 2019 CSC Screening | “The Abyss” in 70mm Q+A with Mikael Salomon ASC https://vimeo.com/320851891/92a15416fc On January 19, 2019, a special screening for CSC members only of Jame’s Cameron’s “The Abyss” at the TIFF Bell Lightbox theatre in Toronto. This screening was made possible by the support of our sponsors, and was a free event for CSC members. Despite the fact that it was a major snowstorm that evening, […] Read More Page 13 of 13FirstPrevious…910111213'
