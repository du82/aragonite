title = "Canadian Society of Cinematographers - Canadian Society of Cinematographers"
description = "Founded in 1957, the CSC has grown with the country’s film and television industry, and continues to uphold the objectives for which the not-for-profit organization was founded."
full_description = "toggle navigation Members Member Directory Member Benefits Become a Member About Overview History Leadership News Calendar Partners Sponsorship The Future is Calling Channel CSC Insight Series CSC Presents CSC Audio Files Podcasts CSC Walkthrough Series CSC Fundamental Series Education Workshops Internship Initiative Mentorship Awards 2025 Awards 2024 Sponsorship Past Awards Photo Gallery Publications Magazine In the News Retailers Submissions Store Search Fostering Cinematography in Canada Since 1957 The CSC has grown with the country’s film and television industry, and continues to uphold the objectives for which the not-for-profit organization was founded. Calendar of Events 2025 Awards Subscribe to our Newsletter Latest News & Events Insight: RT Thorne Canadian director RT Thorne has worked on several high-profile television series, including Utopia Falls, which he co-created and directed, The Porter, Blindspot, The Nine Lives of Chloe King, Degrassi: The Next Generation, and Murdoch Mysteries. Find Out More February 16, 2025 The CSC Welcomes New Full Member, Bradley Stuckel CSC Congratulations to the newly accredited CSC member. Find Out More February 7, 2025 The CSC Welcomes New Full Member, Simon-Pierre Gingras CSC Congratulations to the newly accredited CSC member. Find Out More More CSC News Scheduled Workshops The CSC is committed to improving access to opportunity in the film and television industry as well as professional development in the form of workshops, our internship program and the Field of View Mentorship program. Learn More Latest Posts Follow us on Instagram #GabiKislat, #AssociateMemberCSC @gabi_kislat_dopFor me, this short film was mostly about working within time constraints.Directed by @kevinlandry, we shot Braqué in just 10 hours at a bar in Montreal. As usual, we had an ambitious shot list and ultimately had to combine or cut some shots.Being able to tell the story effectively with fewer shots than planned is an essential skill for any filmmaker. While I prefer to get all the planned shots in the can, over the years, I’ve learned to enjoy the challenge of finding solutions on the spot. This process brings me in the moment and forces me to find a way where time and shots can find their middle ground.It creates a sense of flexibility that can sometimes lead me to creative discoveries I hadn’t considered before. The priority is always telling the story, and it demands adaptation to whatever circumstances arise. I’ve found that the best directors I’ve worked with have a strong sense of this - knowing how to adapt and remain flexible.My crew on this one was outstanding. We shot on the Sony F5 and a set of Canon Cine primes: 35mm, 50mm, 85mm. 1st AC Grég Nicod made sure everything went smoothly on the camera side, while my lighting gang consisted of two fantastic, very fast and efficient women: Amélie Douville and Félicia Storme.They were supported by the always helpful Colin Noël as key grip. The lighting package consisted mostly of HMI`s and some smaller tungsten units, as usual and to my liking, surrounded by a forest of flags, nets and bounces.Cast:Éve DuranceauGabriel MailléProducer Sophie Ricard-HarveySet photographer Véronique BoncompagniColorist Vince Amari#cinematography #CSC #filmmaking #directorofphotography 59 0 Open #GabiKislat, #AssociateMemberCSC @gabi_kislat_dopI really enjoy working with directors and their vision.One of the most creative and, therefore, satisfying experiences was on Darwin’s Fox, a short film that played at numerous festivals worldwide and won several awards, including Best Film and Best Cinematography. The film is a drama about a father and son who go camping in search of a rare fox. Things get out of hand, and the boy vanishes—introducing a touch of mystery.For me, the film’s success already started in prep: Director Ben Scharf @dr.sharpwrite (based in Berlin) and I (in Canada) had regular Zoom meetings for months before shooting began. We picked apart the script, analyzed the characters and their development, and explored the overall story. We dove deep, brainstorming and philosophizing. I believe we created a shared language for the film that brought us very close—despite being physically so far apart.Ben is a very intuitive director, always open to ideas and never one to shut you down. We shot for seven days in the forested mountains of eastern Germany, near the Czech Republic border.We used an Alexa Mini and opted for a set of three Cooke Panchro Classic lenses: 25mm, 32mm, and 40mm, along with a 100mm Tokina macro lens. We chose the wider range to always show the environment. Our close-up lens was the 32mm so that we could capture more of the surroundings while staying close to the actors and catching their expressions in a more nuanced way. The camera movement (beautifully executed by @jfecke) transitioned from steady and calm to handheld and slightly destabilized after the boy vanished.One of the biggest challenges was shooting in a remote location and transporting equipment up into the mountains daily. The crew worked incredibly hard, hauling gear and other necessities—they were real troopers. Shaping lighting was mostly done by bouncing and flagging, but my gaffer @cineari and grip @janboroewitsch had fun lighting and blocking light in the cave of the final scene. Color correction was done by @david.holfelder and I love what he brought to the table. #darwinsfoxmovie #cinematography #directorofphotography 166 4 Open #GabiKislat, #AssociateMemberCSC @gabi_kislat_dopInspiration. Again. I get caught up here in the details of how I became a DP. It’s a rather long story but it is the fuel of my career, very close to my heart. I wasn’t born into the film world nor given a leg up from home. I found my own way only because there were outstanding people who showed me there is another path. They taught me to work hard, keep on going and never give up. That mindset became a big part of my identity.Back to Berlin, 2000: I learned lighting on narrative sets and became one of the few female lighting techs at that time. As I started getting paid gigs, I met my next big inspiration: The Flying Lights, an incredible lighting team who set the bar high. The main gaffer, Christoph Nickel @nickelnickel2023, is a master. If you shoot in Germany, check them out—their work on Babylon Berlin and Homeland is outstanding.The Flying Lights took me on as a lighting trainee, and I still picture Christoph walking into a location, no light meter, just pointing—this light here, these gels, that intensity—effortless. I still think of him when I draw up lighting plans How would Nickel do it?Of course there are many more people who helped me move forward, creating opportunities for me. I can’t name them all here but I trust that you know who you are and I thank you.I don’t have any set photos from my time in Germany. I cut together some shots of two projects that I really enjoyed working on when I was in film school (2004-2007). The projects are:Armagenesis (30 sec.) A film by the very talented DP (and back then also a director) @vanroyko (CSC). We shot with the Sony F900, it was his master thesis. For the water effect on the table we actually had a big plastic tray filled with water rigged over the table that I shot a light through. Quite fun and easy on the budget. Lucky 7 (25 sec.) Low-budget indie feature by Stephen Hayes, actor Phillipe Buckland. Here we pushed the old Panasonic HVX200 + adapter to the max in terms of contrast. This is almost 20 years ago and these projects are still some of my favourites. Hope you enjoy.#lighting #cinematography #inspiration #theflyinglights 109 2 Open #GabiKislat, #AssociateMemberCSC @gabi_kislat_dopWriting this, I feel reminded of how I felt when I was asked last summer if I would like to teach cinematography at Concordia University: excited, grateful and nervous! A great combo to get me started. Cheers to the CSC for the work they do and connecting us on their platform to exchange, learn, and (hopefully) laugh. I’m very happy to be here with y’all for the next 2 weeks.I knew camera was for me when I dove behind it, looked up 5 minutes later, and realized six hours had passed. Speak of being in the flow! It seemed effortless (a paradox -knowing that filmmaking is the exact opposite ), exciting yet peaceful, and deeply satisfying.Inspiration—that’s where it started. I grew up in a small German town near Hannover. Patriarchy pushed me into an office job, ever watching the clock not moving forward is how I remember my late-teenage to young-adulthood years. I hated it and set out to find my own path as soon as I could.I already knew I had a fling with photography and in 2000 I moved to Berlin because it was the place to be. I applied to the Berlin Film and TV Academy (dffb) cinematography program, where I was chosen for the week of testing, but my lack of set experience put a hold on that dream. Good news: I convinced jury-member and head of the camera department, Sophie Maintigneux, a French cinematographer, to take me under her wing. She assigned me into the lighting department as a helper to the students and other projects. It’s still my favourite thing about cinematography, and Sophie is the person that inspired (and still inspires) me the most in my life. Why? She was unlike any woman I’d met - hands-on, confident, no BS. A hard worker, disciplined and sometimes rough, yet endlessly generous with her knowledge and energy to her students. I was instantly hooked on her vibe and passion. The film students noticed my enthusiasm and speed as a lighting tech, my phone number spread through the school, and soon I was working as gaffer (even DP) on several projects. I learned so much.And, I met my husband @emorymurchison on one of those studentDouble-win.It gets better—more in the next post! 162 8 Open The CSC welcomes new full member, Bradley Stuckel CSC. Photo credit: Tom Acton 309 64 Open #ZoeDavidson #AssociateMemberCSC @zdavidsonAnd that’s a wrap! A huge shoutout to Carolyn Wong for the honor of hosting—thank you for this incredible opportunity!This journey has been a dream come true, and I’m beyond grateful that I get to pursue my passion as a career.Of course, it’s not always smooth sailing. There are long days, late nights, and moments of uncertainty. But when you love what you do and have a clear goal, there’s no such thing as “too much effort.” You go all in.For those just starting out or interested in becoming a Director of Photography, here are some tips:1. Gear doesn’t define you: I’ve seen stunning films shot on a 5D IV and disappointing ones filmed on equipment that cost ten times more. At the end of the day, every DP’s goal is the same: tell the story.2. People are kind: I was so nervous meeting experienced DPs at first. But they’re just people—rockstars, yes, but also kind people who are genuinely interested in seeing others succeed. If you’re starting out, reach out! You’d be surprised how willing many established DPs are to offer advice or mentorship. Just ask.3. Just get started: The hardest part of any new journey is taking that first step. It’s easy to doubt yourself, but trust me: action is the best way to improve. Put in the work, and you’ll grow into the DP you’re meant to be. Time and effort will get you there.Thanks for following along! Until next time, and Happy Black History Month!Zoë Davidson 333 3 Open #ZoeDavidson #AssociateMemberCSC @zdavidsonI’m in the final stages of making a film that dives deep into Jamaica’s turbulent 1970s—a time marked by political unrest and fear. This story is told through the voices of Jamaicans who, for the safety of their families and hopes of a better future for their children, chose to leave their homeland.As they built new lives in Canada—starting businesses, raising children, and creating generations who now call Canada home—their journey bridges two worlds.While this is a story rooted in Jamaica, it’s also a powerful testament to the strength and resilience that defines the Canadian experience.Jamaica’s motto, “Out of Many, One People,” speaks not only to Jamaica’s rich diversity but also to Canada’s. It’s about unity in the face of adversity.Here’s a glimpse of the film. 91 0 Open #ZoeDavidson #AssociateMemberCSC @zdavidsonOne of the most pivotal moments of my filmmaking journey was shooting and directing my @howard1867 MFA thesis film, Canada’s Unchecked Racism.The short documentary explores the experiences of two young Black Canadians and the challenges they’ve faced growing up in Canada.It was a personal project, and creatively, it pushed me further than any other film I had worked on up to that point. I constantly asked myself: How do I best tell this story? What message do I want to share? The goal was never to simply revisit the painful moments of the past but to inspire change—challenging Canadians to do better and be better as we move forward.Canada’s Unchecked Racism went on to screen at over a dozen festivals worldwide and won several awards—an achievement I was incredibly proud of. At the time, it felt like my biggest success.But, as Nelson Mandela wisely said, “Do not judge me by my successes, judge me by how many times I fell down and got back up again.”Success isn’t just about the big wins—it’s about the countless times we fall, get back up, and keep going. This wasn’t my first film; it was the culmination of years of late nights, failures, and perseverance.Success isn’t instantaneous. It’s built on a foundation of setbacks, resilience, and the willingness to rise after every fall. It may take weeks, months, or years, but success is only achievable if you don’t give up. 99 0 Open Load More Follow on Instagram #sb_instagram #sbi_load .sbi_load_btn:hover{ outline: none; box-shadow: inset 0 0 20px 20px #111111; } #sb_instagram .sbi_follow_btn a:hover, #sb_instagram .sbi_follow_btn a:focus{ outline: none; box-shadow: inset 0 0 10px 20px #005B8C; }"
