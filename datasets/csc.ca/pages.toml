title = "Channel - Canadian Society of Cinematographers"
full_description = '''Filter by type CSC Audio Files Podcasts Photo Video CSC Presents CSC Insight Series CSC Walkthrough Series CSC Fundamental Series $ = jQuery.noConflict(); $(function(){ // bind change event to select $('#media_type').on('change', function () { var url = 'https://csc.ca/media-type/' + $(this).val(); // get selected value if (url) { // require a URL window.location = url; // redirect } return false; }); }); CSC Insight Series CSC Insight: Guy Godfree csc Guy Godfree csc talks about the true success behind every job and recognizing everyone else’s collective effort in creating the picture. (SPONSORED BY CINELEASE LRX) Read More CSC Insight Series CSC Insight: Claudine Sauvé csc Claudine Sauvé csc talks about her experience in the film industry. Read More CSC Insight Series CSC Insight: Jeremy Benning csc Jeremy Benning talks about his career path and tells the story of coming out in the industry and the importance of being a role model to others in the LGBTQ community. Sometimes, making a spec reel and passion project is the key to taking your work to the next level. Embrace the uncertainty of the film business and know that the next opportunity is always around the corner, even when dealt with disappointments. Don’t be afraid to ask for suggestions from your team and be comfortable with knowing when to let go of the small stuff. Read More CSC Insight Series CSC Insight: Alan Poon csc Alan Poon dives deep into the topics of imposter syndrome, diversity within the film industry, role models and the importance of mentorship. Read More CSC Insight Series CSC Insight: Bobby Shore csc Bobby Shore talks about the realities of breaking into the industry, the importance of seeing the crew as humans first and the forks in the road ahead and how to prepare for them. Read More Photo 2022 Awards Gala George Willis, President, csc SASC Penny Watier, Central VP, CSC Patty Guyader, Executive Assistant, CSC Sydney Kondruss, Awards Production Manager, CSC Jeremy Benning csc Francis Luta, Online Content Producer, CSC Lalita Krishna, Awards Presenter, Co-Chair, Hot Docs Boris Mojsovski csc ASC Board Member Zoe Dirse csc, & Awards Chair, Arthur Cooper csc Arthur Cooper csc Claudine Sauvé csc Sara Mishara THEATRICAL FEATURE CINEMATOGRAPHY Drunken Birds (Les oiseaux ivres) Adam Madrzyk NON-THEATRICAL FEATURE CINEMATOGRAPHY The Family Mark Zibert & Eric Kaskens FRITZ SPIESS AWARD FOR COMMERCIAL CINEMATOGRAPHY SickKids Foundation – “Be A Light” Keenan Lynch MUSIC VIDEO CINEMATOGRAPHY Clean Up – performed by “Joël” Mitchell Baxter DRAMATIC SHORT CINEMATOGRAPHY Wildflower Joseph Micomonaco THE CAMERA ASSISTANT AWARD OF MERIT “For excellence and outstanding professionalism in the per- formance of the AC duties and responsibilities” Gurmeet Singh STUDENT CINEMATOGRAPHY Flowers Wilting, George Brown College Guy Godfree csc Matt Irwin ROBERT BROOKS AWARD FOR DOCUMENTARY LONG FORMAT CINEMATOGRAPHY Chasing Whiskey Carolyn Wong The President’s Award “For outstanding service to the Canadian Society of Cinematographers.” Walter Klassen The Bill Hilson Award “For outstanding service contributing to the development of the motion picture industry in Canada.” Jean-Claude Labrecque csc, (posthumously) THE MASTERS AWARD “For outstanding contribution to the art of cinematography.” Ilya Sarossy accepting the award for Paul Sarossy csc ASC BSC HALF HOUR SCRIPTED SERIES GUILTY PARTY “Crazy Bitches Who Kill” Brendan Steacy csc DRAMATIC SERIES CINEMATOGRAPHY – COMMERCIAL Clarice “Silence Is Purgatory” Rob Sim & Team CSC Insight Series CSC Insight: Zoe Dirse csc Zoe Dirse csc recalls the lack of women in the industry when she started her career and takes a deeper look into the female gaze. Listen to some of her great advice on imposter syndrome and how to create your own opportunities towards becoming a cinematographer! Read More CSC Insight Series CSC Insight: Jordan Oram Associate Member Jordan Oram, Associate Member discusses his career path, lessons learned along the way and the creation of Higher Hire, whose goal is to create direct pathways and opportunities for underrepresented talent to develop the tools, knowledge and networks necessary to build a successful career in production. Read More Photo On Set Photos Matt Irwin (Assoc. Member) 2nd from left Jeff Wheaton (Associate Member)L-R: gaffer Keith Mitchell, director Heather Young and cinematographer Jeff Wheaton (Associate Member) on the set of Murmur. Chris Ball csc works on his roof during the pandemic. Brad Rushing csc shooting a commercial in Los Angeles with collaborator Christian Epps, Matt Barkley Associate Member Associate Member Anthony SarraccoAssociate Member Anthony Sarracco on the set of ESPN Boxing Stories (working title). Associate member Philip L. Harrison DP John Ker (Associate Member)Director Olivia D’Oliveira and DP John Ker (Associate Member) shooting music video “Waist Down” by Adeline, produced by OPC. Ousama Rawi csc, bsc Angel Navarro III Associate Member w/ Huwag Mataranta Cinematographer and A camera operator David Bercovici- Artieda on the set of The College Admissions Scandal.Cinematographer and A camera operator David Bercovici- Artieda on the set of The College Admissions Scandal. Director Greg Oliver (left) and DP Matt Irwin (Assoc Member)Credit: Parker Tolifson Maya Bankovic csc Associate Member Justin Black shooting a condo commercial produced by PUREBLINK.Associate Member Justin Black shooting a condo commercial produced by PUREBLINK. David Bercovici-Artieda Associate Member Liam Higgins Associate Member Andres P. Galicia Affiliate Member with Michael Jari Davidson Associate Member Cinematographer Adam Madrzyk (Associate Member)Cinematographer Adam Madrzyk (Associate Member) on the set of the short film Guion. Serge Desrosiers csc, centre (the clown) Serge Desrosiers csc with lions in Senegal for Big Five. Associate Member Dennis Grishnin on the set of a Top Shop spot. Douglas Koch csc" THE GRAND SEDUCTION " MAX FILMS Photo: Philippe Bossé / Max Films Robert Mclachlan csc asc on set of LovecraftRobert McLachlan csc, asc on set of Lovecraft Country for HBO. Bryce Zimmerman Associate Member Pieter Stathis csc Paul Sarossy cscPaul Sarossy csc, asc, bsc with Dylan Evans, Dahlia Aljanabi, Owen Cant, Sara Doughty, James Johnson, Simon Hallows, Sam Smithard, David Morgan and Aaron Monkman on the set of Tin Star in Liverpool. Thom Best csc John Banovich Venice & 600mm Morgana McKenzie (Associate Member)(L to R) Sound Recordist Alisa Erlikh, DP Morgana McKenzie (Associate Member) and Director/Producer Idalina Leandro on set in Canmore, Alberta, during production of the feature documentary An Open Conversation. Michael Jari Davidson (Assoc. Member)Credit: Miz Monday Associate member John Ker on set shooting a promo for cannabis company “dirt.” Dana Barnaby (Associate Member)Cinematographer Dana Barnaby, (Associate Member) high in the hills in the Wicklow Mountains, Ireland, shooting Forever in My Heart for Hallmark Studios. Irish crew members from left to right are Connor Lynch, Danny Kelly, Ciaran Tanham, Sonya Deegan, Eamon McGillicuddy, James Culloty, Dana Barnaby (cinematographer), Connor Hammond, Mick O’Rourke, Zia Pfeiffer, Sinead Lillis and James Mooney. Issah Shah Associate Member shooting in Turkey Van Royko csc Amy Belling csc DP Christopher Ball csc on the set of Still the Water in PEI, filming lobster “setting day” at 5 a.m.DP Christopher Ball csc on the set of Still the Water in PEI, filming lobster “setting day” at 5 a.m. Daniel Villeneuve csc François Dagenais csc D. Gregor Hagey csc Associate member Justin Black with director Jessamine Fok Michael Jari Davidson (associate member) caught between takes on the punk rock musical feature Stupid for You. Associate member Adam Madrzyk and 1st AC Eric Schweiger Christina Ienna Associate Member Pieter Stathis csc Kyle Chappell Associate Member Karim Hussain csc Brad Rushing csc on A California Christmas Eric Oh csc mysc DP/operator Doug Koch cscDP/operator Doug Koch csc with dolly grip Chelsea Barrie on the set of Deepa Mehta’s new film Funny Boy shooting in Sri Lanka. Cinematographer Christian Bielz (Associate Member) on the set of Love at Look Lodge.Cinematographer Christian Bielz (Associate Member) on the set of Love at Look Lodge. B camera team on location with Netflix’s Jupiter’s Legacy. Left to rightCamera/Steadicam operator Richard WilmotB camera team on location with Netflix’s Jupiter’s Legacy. Left to right: dolly grip Stewart Grayburn, camera/Steadicam operator Richard Wilmot, 2nd AC Stephan Maia, 1st AC David McKane. Associate member Raymond Tuquero (left) with director Aharon Jinjihashvili, audio tech/boom op Mike Barber, gaff Kaleb Laidman, actor Victoria Kucher and actor Eileen Li Maksym Putintsev (Associate Member)Maksym Putintsev (Associate Member)discussing a shot with the director Joffre Silva on a dramatic short film titled Being Brave. David Bercovici Artieda Associate Member DP Dana Barnaby, associate memberCinematographer Dana Barnaby (Associate Member) on the set of Hearts of Winter (aka A Tidy Romance). DP Sean Guezen, (Student Member)DP Quan Luong (Student Member), Steadicam operator Pedro Simone, 1st AC Ryan Offenloch (Student Member) and 2nd AC Alex DC on the set of the short film In Love We Survive (dir. Omar Benson). Sarah Thomas Moffat (Associate Member)Going for a real flight in a vintage North American Harvard plane using an ARRI ALEXA Mini, Sarah Thomas Moffat (Associate Member) DP'd and operated the narrative film Boundless. David Makin csc Kevin Rasmussen (Associate Member) shooting a M.A.D.D. PSAKevin Rasmussen (Associate Member) shooting a M.A.D.D. PSA Chris Oben (Associate Member)Director of Photography (Associate Member) Chris M. Oben (far right) shares a laugh with the cast and crew on the green screen set of Cassie and Friends. Clockwise from left: Scott Aiken (Sound) Kirsten Niedtner (Puppeteer), Cam Hayduk (Director), Kim Morales (Production Coordinator), Liz Kirkland (Puppeteer), Rob Piercy (1st AC), Randi Edmunson (Puppeteer). Liam Higgins (Assoc. Member)Credit: Jasmina Alzaiat Philippe Lavalette csc (left) with Director Helen DoyleDP Philippe Lavalette csc (left) with Director Helen Doyle shooting the feature-length documentary Au lendemain de l'Odyssée in Sicily, Italy. Cinematographer Jude Abadi (affiliate member) Neil Cervin csc and Van Helsin crew Liam Higgins Christopher Ball csc Todd M. Duym csc Associate member Ian Macmillan and camera assistant Godfred Adjei Brad Rushing csc On Set of Man With A Van Alan Poon csc Director Tony Kaplan and DP Christina Ienna (associate member) frame up Pixar animator Steven Hunter with a Sony VENICE rigged above on a documentaryDirector Tony Kaplan and DP Christina Ienna (Associate Member) frame up Pixar animator Steven Hunter with a Sony VENICE rigged above on the set of the documentary series Inside Pixar: Steven Hunter. L to R: B operator/2nd unit DP Matt Irwin (associate member), B 1st assistant Ryan Prouse, B 2nd assistant Matt Muszalski and dolly grip Axel Green on the set of Resident Evil in Hamilton. Drew Hyttenrauch Associate Member Vic Sarin csc Quan Luong (Student Cinematographer)Credit: Connor Vu DP Kristin Fieldhouse (associate member) on the set of CBC/ NSBU show Lady Dicks. Stirling Bancroft csc Gregory Bennett (Associate Member) on Nightalk(L to R) Director Don Shebib, Gaffer Nikita Brusnitsyn and DP/operator Gregory Bennett (Associate Member) on the set of Nightalk. DP Dennis Grishnin (Associate Member)Associate Member Dennis Grishnin on the set of a music video for “I Drive Me Mad” by Ren. André Pienaar csc, sasc Vincent De Paula csc Associate member and B Camera Operator Kelly Mason L-R: Craig Stewart (Key Grip), Christopher Ball csc (A Operator), Dean Skerrett (Dolly Grip) and Preston Hudson (3rd AD) on the set of The Lighthouse.L-R: Craig Stewart (Key Grip), Christopher Ball csc (A Operator), Dean Skerrett (Dolly Grip) and Preston Hudson (3rd AD) on the set of The Lighthouse. Director Patrick White, first AC Ian Carleton, Cinematographer Scott McIntyre (Associate Member) and Sound Recordist Julie Zhu on the set of feature film Queen of Spades.Director Patrick White, first AC Ian Carleton, cinematographer Scott McIntyre (Associate Member) and sound recordist Julie Zhu on the set of feature film Queen of Spades. Arthur Cooper csc Claudine Sauve cscMarie-Julie Besse (1st AC), Jocelyn Spronken-Forget (Best Boy Grip), Claudine Sauvé csc (DP), Nicolas Mignot (Key Grip) and Lina Roessler (Director) on the set of Best Sellers (a feature film starring Michael Caine and Aubrey Plaza). Ahmad Al Morsey csc Ray Dumas cscSesqui 2016 CSC Workshops: Colour Science for Cinema Cameras | LED Lighting Theory for Cinematography Webinar held on May 30, 2021. Kino Flo Founder Frieder Hoccheim gives an extensive presentation on LED colour science, and how different digital camera sensors read the same light sources differently and how to plan for this and understand how to manage these factors. Points of interest along the way included a discussion about the […] Read More Page 5 of 11FirstPrevious…34567…10…NextLast'''
