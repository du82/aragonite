["https://csc.ca/the-csc-welcomes-new-full-member-jarrett-craig-csc"]
title = "The CSC Welcomes New Full Member, Jarrett Craig CSC - Canadian Society of Cinematographers"
description = "Congratulations to the newly accredited CSC member."
full_description = "Congratulations to the following newly accredited CSC member: Jarrett Craig CSC Photo credit: Dave Gordon Jarrett Craig is a Canadian cinematographer based in Calgary, Alberta. He has built a diverse portfolio demonstrating skill across various genres including documentary and narrative drama. Starting out Jarrett was able to contribute as cinematographer on numerous art and dance films for Bravofact! projects, then moving towards 2nd units and main unit photography. Notably, he served as the director of photography for over 60 episodes of the beloved TV series Heartland from 2016 to 2020, as well as season one and two of the Paramount Plus production of Joe Pickett. In addition to narrative work Jarrett also served as the cinematographer of the award-winning documentary feature Legend of a Warrior (2012) an official selection at Hot Docs (2012). Most recently he has wrapped production on an episode of the Netflix original series The Abandons and also contributed to additional photography throughout the first season. Jarrett’s strong technical skills and an eye for detail have helped him play a vital role in crafting creative visuals on every production large or small."
author = "lucy.kayumov@gmail.com"
