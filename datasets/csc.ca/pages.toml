orking, and overcoming imposter syndrome, Rob Scarborough CSC dives deep into the essentials of filmmaking. Read More August 12, 2024 CFC & CSC Introduce Groundbreaking Cinematography Intensive for Female-Identifying Artisans With support by the Paul Bronfman Family Foundation, five cinematographers will participate in intensive training this August. Read More August 09, 2024 The CSC Welcomes New Full Member, Justin Black CSC Congratulations to the newly accredited CSC member. Read More July 12, 2024 The CSC Welcomes New Full Member, AA Scott McClellan CSC Congratulations to the newly accredited CSC member. Read More Page 2 of 13Previous12345…10…NextLast'
