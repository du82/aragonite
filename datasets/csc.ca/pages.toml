["https://csc.ca/the-future-is-calling"]
title = "The Future is Calling - Canadian Society of Cinematographers"
description = "The film and television industry is growing, yet diversity behind the camera continues to be a problem. Employment opportunities exist to train people for high level artistic and technical jobs including cinematographers and camera assistants. Barriers also exist for marginalized communities to have access to training opportunities. CSC is conducting an unprecedented initiative to remove […]"
full_description = "The film and television industry is growing, yet diversity behind the camera continues to be a problem. Employment opportunities exist to train people for high level artistic and technical jobs including cinematographers and camera assistants. Barriers also exist for marginalized communities to have access to training opportunities. CSC is conducting an unprecedented initiative to remove barriers to employment in the film and television industry. The bridge will be created by: Establishing relationships with community partners on the ground and working with underrepresented communities. Reaching out to those community partners in a respectful way with practical opportunities to access film and television Offer robust online content so people can supplement their learning in whatever part of the country they live Building ongoing relationships with community partners, industry stakeholders and government to make our programs sustainable The CSC is on target to raising $3.75 million pledged over the next 3 years by the end of 2022. On November 7, Paul Bronfman, chair of that campaign announced at the official launch of the campaign that we’ve raised 1.97 million dollars, over half of our 3.75-million-dollar campaign goal. Francis Luta and Lester Millado take stock in preparation of shooting the 64th Annual CSC Awards Virtual Gala. Toronto-based director and cinematographer Christina Ienna, Associate Member, calling the shots. The Future is Calling Campaign Supporters $450,000 + CSC MembersWilliam F. White International $225,000 – $450,000 ARRISimThe Paul Bronfman Family Foundation/Comweb $150,000 – $225,000 Government of Ontario $75,000 – $150,000 Picture ShopSony $50,000 – $75,000 Aputure $25,000 – $50,000 RoscoCanon $10,000 – $25,000 Black Magic Design $450,000 – $750,000 The process of putting together the 64th Annual CSC Awards Gala as a virtual production was an exciting experience for us alland included a brilliant crew The 64th Annual CSC Awards Virtual Gala would not have been possible without the warm-hearted and expert support of 2DHouse who gave us use of their fabulous facility Our four areas of investment include: Outreach, Internship, Mentorship Education: In-person and online Advancing technology: Virtual production Creating spaces: Western and central, plus 4 additional satellite offices For more information about The Future is Calling Campaign, please contact: Gail Picco, Campaign Director, gailpicco@me.com 416-799-1993Susan Saranchuk, Executive Officer, susans@csc.ca 416-266-0591"
year_published = 2025
year_updated = 2023
clearnet = "https://csc.ca/the-future-is-calling"
