title = "Canon R5C: A Sound Decision  - Canadian Society of Cinematographers"
description = "By Tony Wannamaker csc I received a call from an old friend to shoot a heartwarming documentary about a one-of-a-kind grandmother who hosted the endearing TV series The Bubbie Break. The show ran for five seasons, from 1991 to 1996, and dealt with topics about equality, inclusion and practical grandparenting. I said yes immediately to work […]"
