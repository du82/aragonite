full_description = "Filter by type CSC Audio Files Podcasts Photo Video CSC Presents CSC Insight Series CSC Walkthrough Series CSC Fundamental Series $ = jQuery.noConflict(); $(function(){ // bind change event to select $('#media_type').on('change', function () { var url = 'https://csc.ca/media-type/' + $(this).val(); // get selected value if (url) { // require a URL window.location = url; // redirect } return false; }); }); CSC Insight Series CSC Insight: Miles Dale, Executive Producer Oscar winning producer Miles Dale tells us everything we need to know about the qualities of a good producer, the makings of an effective cinematographer and what to look for in your next gig. The CSC Insight Series is brought to you by: View the full playlist on the CSC YouTube Channel and Subscribe! Read More CSC Presents CSC Presents: The Outside A look inside the wild card ASC nominated episode of ‘Cabinet of Curiosities: THE OUTSIDE’. Director of photography Jeremy Benning csc, Senior colourist Mark Kueper Directed by Ana Lily Amirpour. This episode is brought to you by: Read More CSC Presents CSC Presents: Colour Demo with Marc Bachli An exclusive sit-down session with Colourist Marc Bachli as he discusses numerous key functions of Colour Correction. This episode is brought to you by: Read More CSC Presents CSC Presents: Cabinet of Curiosities Production Design Join Oscar-nominated Production Designer Tamara Deverell and Cinematographers Colin Hoult csc and Jeremy Benning csc, as the power trio discuss and reflect on their epic anthology series ‘Guillermo del Toro’s Cabinet of Curiosities’. This episode is brought to you by: Read More CSC Vancouver Opening Champagne Reception Read More CSC Presents CSC Presents: Cabinet of Curiosities COLOUR part 1 Delve deep into the episodes shot by Cinematographer Colin Hoult csc and Senior Colourist Mark Kueper, as the two review the colour and feel for each of Colin’s stand alone episodes in ‘Guillermo del Toro’s Cabinet of Curiosities.’ This episode is brought to you by: Read More CSC Presents CSC Presents: Mark Irwin csc asc The legendary Cinematographer Mark Irwin talks about his career and what’s next. Hosted by Mark’s mentee Daniel Everitt-Lock. This episode is brought to you by: Read More CSC Presents CSC Presents: Billy the Kid Meet the filmmakers behind Epix original series BILLY THE KID with cinematographer Paul Sarossy, Director Otto Bathurst and Colourist Mark Kueper. This episode is brought to you by: Read More CSC Presents CSC Presents: Station Eleven Cinematographer Daniel Grant csc, Director Jeremy Podeswa and Colourist Cody Baker discuss their career and their work on HBO max hit new show Station Eleven. Read More CSC Presents CSC Presents: The Future is Calling Canadian Society of Cinematographer CEO Susan Saranchuk, Campaign Director Gail Picco, Director CSC board Rion Gonzales and Chair Board of Directors Guy Godfree introduce CSC’s The Future is Calling campaign. This episode is Moderated by Fanen Chiahemen. Read More Page 4 of 11FirstPrevious…23456…10…NextLast"
