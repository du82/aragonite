["https://csc.ca/inthenews/j-stevens-wins-tfca-jay-scott-prize"]
title = "J Stevens Wins TFCA Jay Scott Prize - Canadian Society of Cinematographers"
description = "Associate member J Stevenswas recently named the winner of the 2024 Jay Scott Prize for an emerging artist by the Toronto Film Critics Association (TFCA). Stevens directed, produced, shot, and co-wrote the feature film Really Happy Someday, which premiered at the 2024 Toronto International Film Festival. The film follows the journey of a stage musical performer regaining his voice […]"
