["https://csc.ca/in-support-of-bscs-open-letter-to-camerimage"]
title = "In Support of BSC’s Open Letter to Camerimage - Canadian Society of Cinematographers"
description = "The Canadian Society of Cinematographers believes that diversity is essential for the growth of artistic expression and cultural understanding."
full_description = "The Canadian Society of Cinematographers (CSC) believes that diversity is essential for the growth of artistic expression and cultural understanding. Recent comments by Marek Żydowicz and Camerimage underscore the ongoing and urgent need for progress in this area. Gender inequity in cinematography remains a significant issue, and we, as a society, must address it actively. The CSC is committed to championing diversity and proudly supports the exceptional work of women cinematographers, aiming to amplify their voices and contributions in the industry. -Zoe Dirse csc, President BSC letter follows below."
author = "lucy.kayumov@gmail.com"
