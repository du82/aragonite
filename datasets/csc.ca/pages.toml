full_description = "In this episode, we take a closer look at the lighting design of “Accused” Season 1, Episode 2: “Robyn’s Story.” Join us as DP Jeremy Benning CSC ASC explains the process behind the lighting of various sets and locations, along with insights from director Billy Porter on their creative collaboration. Head Lighting Tech Steve Morrison goes deeper into fixtures and approach used in the court room set while Production Designer Elisa Sauvé shares her vision for the courtroom’s design. Additionally, Lighting Console Programmers Slobodan Marin & Bryan Valderrama discuss their process."
