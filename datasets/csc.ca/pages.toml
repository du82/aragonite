["https://csc.ca/media-type/csc-insight-series"]
title = "CSC Insight Series Archives - Canadian Society of Cinematographers"
description = "The Insight Series is loaded with content that is original, inspirational, and cinematography-related built. With an eye to helping emerging camera artists build their careers, it’s informative for anyone interested in the inside story of making film and television – from feature films to commercials. Brought to you by Aputure with assistance from The Foundation of Cinematography."
full_description = "Filter by type CSC Audio Files Podcasts Photo Video CSC Presents CSC Insight Series CSC Walkthrough Series CSC Fundamental Series $ = jQuery.noConflict(); $(function(){ // bind change event to select $('#media_type').on('change', function () { var url = 'https://csc.ca/media-type/' + $(this).val(); // get selected value if (url) { // require a URL window.location = url; // redirect } return false; }); }); CSC Insight Series Insight: RT Thorne Canadian director RT Thorne has worked on several high-profile television series, including Utopia Falls, which he co-created and directed, The Porter, Blindspot, The Nine Lives of Chloe King, Degrassi: The Next Generation, and Murdoch Mysteries. His first feature film Forty Acres premiered at TIFF in 2024. He is recognized for championing representation in media, bringing underrepresented voices to the forefront. Join the conversation with RT. Read More CSC Insight Series Insight: Luc Montpellier CSC ASC Cinematographer Luc Montpellier csc asc covers mentorship, the long game in the industry, agencies for DPs, learning from mistakes, and understanding that success takes time. Read More CSC Insight Series Insight: Rob Scarborough CSC From the value of spec work to the power of networking, and overcoming imposter syndrome, Rob Scarborough CSC dives deep into the essentials of filmmaking. Plus, tips on working with actors, lighting, and choosing the right DP agency. Read More CSC Insight Series Insight: Boris Mojsovski CSC ASC ASBH Boris Mojsovski CSC ASC ASBH reflects on his journey as a newcomer to Canada, finding a sense of community in the film industry, and emphasizes the significance of persistence and mentorship. Read More CSC Insight Series Insight: Elisa Sauvé Production Designer Elisa Sauvé discusses the production design process, the importance of pre-viz & the working relationship between production designers and cinematographers. Read More CSC Insight Series CSC Insight: Keenan Lynch Keenan Lynch, Associate Member, shares his experiences in a compelling and personal way about what it’s like to be one of North American’s few Black cinematographers. Read More CSC Insight Series CSC Insight: Jason Vieira Steadicam operator, Jason Vieira talks about the qualities of a great operator & DP, building trust on set and always looking for mentors. Read More CSC Insight Series CSC Insight: Harald Ortenburger csc Legendary camera operator Harald Ortenburger csc shares advice from his 30+ year career. Read More CSC Insight Series Insight: Catherine Lutes csc Award-winning cinematographer Catherine Lutes talks about how to empower yourself with imperfections, the come-up from struggles and how to network without even knowing it. Join us for another insightful conversation with Canada’s best filmmakers. The CSC Insight Series is brought to you by APUTURE. Read More CSC Insight Series CSC Insight: Miles Dale, Executive Producer Oscar winning producer Miles Dale tells us everything we need to know about the qualities of a good producer, the makings of an effective cinematographer and what to look for in your next gig. The CSC Insight Series is brought to you by: View the full playlist on the CSC YouTube Channel and Subscribe! Read More Page 1 of 3123Next"
