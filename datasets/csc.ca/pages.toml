title = "Iris Ng Featured in CFC Alumni Spotlight - Canadian Society of Cinematographers"
description = "The Canadian Film Centre recently highlighted associate member Iris Ng in their Alumni Spotlight. Known for her creative versatility and technical mastery, Iris has worked with celebrated directors on award-winning documentaries, scripted series, and artist-driven projects, including Stories We Tell (2012, dir. Sarah Polley) and, more recently, Sue Kim’s The Last of the Sea Women. […]"
