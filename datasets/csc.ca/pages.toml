["https://csc.ca/the-csc-welcomes-new-full-member-matt-irwin-csc"]
title = "The CSC Welcomes New Full Member, Matt Irwin CSC - Canadian Society of Cinematographers"
description = "Congratulations to the newly accredited CSC member."
full_description = "Congratulations to the following newly accredited CSC member: Matt Irwin CSC Photo credit: Fawzia Mirza Matt Irwin csc is a Californian-Canadian cinematographer based in Toronto. With a life behind the camera starting very young, he has nearly 30 years in the film industry with an eclectic spread of experience that includes studio and indie features, numerous short films, music videos, and documentaries abroad. His work on Chasing Whiskey earned the Robert Brooks Award for Documentary Cinematography from the CSC. Other notable work includes episodic TV for Comedy Central, independent feature films shot in Louisiana and California, as well as the 2nd season of CBC’s Sort Of. His most recent feature- The Queen of My Dreams– is a queer Muslim love letter to Bollywood shot both in Halifax and Pakistan, and was named one of TIFF Canada’s Top Ten Features. Matt enjoys telling stories lesser known or with a different point of view, and those with connection that make the world a little bit smaller. With a focus that divides an equal love of both narrative filmmaking along with documentaries, his latest work includes short films with directors Set Shuter and Emily O’Quinn Code, a documentary in production with director Greg Olliver, as well as 2nd unit work on the upcoming Amazon series Motorheads and the final season of The Handmaids Tale."
author = "lucy.kayumov@gmail.com"
