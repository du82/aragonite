["https://csc.ca/media-type/csc-presents"]
title = "CSC Presents Archives - Canadian Society of Cinematographers"
description = "If it’s happening now, it’s of interest to CSC Presents. Interviews with the people who are making the film and television on screens now, with the occasional retrospective episode talking to the industry’s best, CSC Presents informs the viewer."
full_description = "Filter by type CSC Audio Files Podcasts Photo Video CSC Presents CSC Insight Series CSC Walkthrough Series CSC Fundamental Series $ = jQuery.noConflict(); $(function(){ // bind change event to select $('#media_type').on('change', function () { var url = 'https://csc.ca/media-type/' + $(this).val(); // get selected value if (url) { // require a URL window.location = url; // redirect } return false; }); }); CSC Presents CSC Presents: The Outside A look inside the wild card ASC nominated episode of ‘Cabinet of Curiosities: THE OUTSIDE’. Director of photography Jeremy Benning csc, Senior colourist Mark Kueper Directed by Ana Lily Amirpour. This episode is brought to you by: Read More CSC Presents CSC Presents: Colour Demo with Marc Bachli An exclusive sit-down session with Colourist Marc Bachli as he discusses numerous key functions of Colour Correction. This episode is brought to you by: Read More CSC Presents CSC Presents: Cabinet of Curiosities Production Design Join Oscar-nominated Production Designer Tamara Deverell and Cinematographers Colin Hoult csc and Jeremy Benning csc, as the power trio discuss and reflect on their epic anthology series ‘Guillermo del Toro’s Cabinet of Curiosities’. This episode is brought to you by: Read More CSC Presents CSC Presents: Cabinet of Curiosities COLOUR part 1 Delve deep into the episodes shot by Cinematographer Colin Hoult csc and Senior Colourist Mark Kueper, as the two review the colour and feel for each of Colin’s stand alone episodes in ‘Guillermo del Toro’s Cabinet of Curiosities.’ This episode is brought to you by: Read More CSC Presents CSC Presents: Mark Irwin csc asc The legendary Cinematographer Mark Irwin talks about his career and what’s next. Hosted by Mark’s mentee Daniel Everitt-Lock. This episode is brought to you by: Read More CSC Presents CSC Presents: Billy the Kid Meet the filmmakers behind Epix original series BILLY THE KID with cinematographer Paul Sarossy, Director Otto Bathurst and Colourist Mark Kueper. This episode is brought to you by: Read More CSC Presents CSC Presents: Station Eleven Cinematographer Daniel Grant csc, Director Jeremy Podeswa and Colourist Cody Baker discuss their career and their work on HBO max hit new show Station Eleven. Read More CSC Presents CSC Presents: The Future is Calling Canadian Society of Cinematographer CEO Susan Saranchuk, Campaign Director Gail Picco, Director CSC board Rion Gonzales and Chair Board of Directors Guy Godfree introduce CSC’s The Future is Calling campaign. This episode is Moderated by Fanen Chiahemen. Read More CSC Presents CSC Live: Short vs Long Production Directors of Photography Anthony Metchie csc, Rion Gonzales Associate Member, Keenan Lynch Associate Member and Lighting Technician Rohan Lawrence discuss their careers and the differences between short and long format productions. Read More CSC Presents CSC Live: Bolero – Advanced Crew Communications Join us for our first CSC Live session since August! During this interactive session, we will be taking a close look at the Bolero intercom system, made by Riedel Communications Inc. Jeremy Benning csc will discuss his introduction to this system on a recent Disney project with Jason Ross from Riedel and Peter Slisarenko from Matrix Video Communications. Questions from viewers will be part of the session. Used by organizations such as Formula 1, Cirque du Soleil, Olympics, NFL etc, this extremely versatile and robust crew intercom system proves its value amidst the challenges of on set communication during pandemic filmmaking; but also as a new standard for film crews going forward. Special guests Jason Vieira (A-Cam Op), Jasper Vrakking (DIT) and Malcolm Nefsky (Key Grip) will take part of the conversation as well to discuss their experience with using crew intercoms in general and how the Bolero system fit into their on set workflows. Read More Page 1 of 212Next"
