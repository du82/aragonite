["https://csc.ca/inthenews/addressing-inequity-in-cinematography-zoe-dirse-csc-on-the-camerimage-controversy"]
title = "Addressing Inequity in Cinematography: Zoe Dirse csc on the Camerimage Controversy - Canadian Society of Cinematographers"
description = "In light of the controversy surrounding Camerimage Director Marek Żydowicz’s recent op-ed in Cinematography World, CSC President Zoe Dirse shares her perspective on the backlash, systemic industry biases, and the CSC’s ongoing initiatives to support gender equity in cinematography. Q: How did you first react when you read Marek Żydowicz’s op-ed in Cinematography World?Zoe Dirse: […]"
