title = "Insight: RT Thorne - Canadian Society of Cinematographers"
description = "Canadian director RT Thorne has worked on several high-profile television series, including Utopia Falls, which he co-created and directed, The Porter, Blindspot, The Nine Lives of Chloe King, Degrassi: The Next Generation, and Murdoch Mysteries. His first feature film Forty Acres premiered at TIFF in 2024. He is recognized for championing representation in media, bringing underrepresented voices to the forefront. Join the conversation with RT."
full_description = "Canadian director RT Thorne has worked on several high-profile television series, including Utopia Falls, which he co-created and directed, The Porter, Blindspot, The Nine Lives of Chloe King, Degrassi: The Next Generation, and Murdoch Mysteries. His first feature film Forty Acres premiered at TIFF in 2024. He is recognized for championing representation in media, bringing underrepresented voices to the forefront. Join the conversation with RT. The CSC Insight Series is brought to you by: toggle navigation Members Member Directory Member Benefits Become a Member About Overview History Leadership News Calendar Partners Sponsorship The Future is Calling Channel CSC Insight Series CSC Presents CSC Audio Files Podcasts CSC Walkthrough Series CSC Fundamental Series Education Workshops Internship Initiative Mentorship Awards 2025 Awards 2024 Sponsorship Past Awards Photo Gallery Publications Magazine In the News Retailers Submissions Store Search ©2023 All rights reserved. About Members News & Events Channel Education Awards Magazine Contact Contact Us Resources Policies Connect"
