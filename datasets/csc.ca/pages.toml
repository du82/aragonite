title = "Workshops - Canadian Society of Cinematographers"
description = "The CSC is committed to providing professional development in the form of workshops for its members, organizing learning opportunities at various levels from novice to masters. Workshops are open to members only, unless otherwise posted. In addition to partnering with CSC sponsor companies to present discussion events regarding current technology and applications, the CSC has […]"
full_description = "The CSC is committed to providing professional development in the form of workshops for its members, organizing learning opportunities at various levels from novice to masters. Workshops are open to members only, unless otherwise posted. In addition to partnering with CSC sponsor companies to present discussion events regarding current technology and applications, the CSC has developed its own highly regarded series of specialist training, including: Technology and process modules related to cameras, lenses, lightning Core fundamental workshops for entry level cinematographers Extensive high-level modules for Camera Assistants Imaging and lighting workshops for various people of various skill levels in film/tv production, commercials and documentaries Advanced workshops led by full member cinematographers for skill progression Introductory workshops for actors and others for understanding on-set interplay with a camera team PAST WORKSHOP PHOTO GALLERY Recent & Upcoming Workshops To apply for all workshops and seminars, please visit our calendar page. Feb 8 2025 – Virtual Production for Documentary Workshop (Edmonton) Taught by Wes Doyle CSC and Chase Gardiner, Associate Member, this one day in-person workshop explores the intersection of cinematic lighting for documentaries and virtual production techniques. Participants will gain a comprehensive understanding of essential terminology, VP technology, and best practices for shooting cinematic documentaries in both virtual and real-world environments. March 1 & 2 2025 – Night Lighting Workshop (Vancouver) Led by Philip Lanyon csc and Nick Thomas csc, this two-day workshop will offer participants the opportunity to expand their creative and technical boundaries, and gain the tools necessary to capture captivating visuals in low-light conditions. March 1 – On Set to Finishing Colour Workshop (Toronto) This workshop explores the collaboration between the Cinematographer, the Digital Imaging Technician and the Finishing Colourist. The objective is to achieve a desired look in real-time while maintaining consistency from set to delivery. Andrew Richardson will discuss on-set colour workflow, livegrade fundamentals, LUTs and real-time colour grading. Picture Shop Senior Colourist, Brett Trider, will discuss the importance of colour finishing and the additional tool sets that are available to the cinematographer in post. Cinematographer Justin Black CSC will be on hand to answer any DP-related questions. APPLICATIONS & REGISTRATION"
year_published = 2025
year_updated = 2025
