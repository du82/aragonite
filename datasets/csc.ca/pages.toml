title = "CSC Audio Files Podcasts Archives - Page 2 of 4 - Canadian Society of Cinematographers"
description = "Audio Files go beyond cinematography. Designed to go deeper than a technical discussion it’s meant to be honest, personal. At the forefront of trends, topics will range from politics and equity to diversity, to virtual production, to mental health and the impact of shooting schedules on relationships. Brought to you by Rosco with assistance from The Foundation of Cinematography."
full_description = "Filter by type CSC Audio Files Podcasts Photo Video CSC Presents CSC Insight Series CSC Walkthrough Series CSC Fundamental Series $ = jQuery.noConflict(); $(function(){ // bind change event to select $('#media_type').on('change', function () { var url = 'https://csc.ca/media-type/' + $(this).val(); // get selected value if (url) { // require a URL window.location = url; // redirect } return false; }); }); CSC Audio Files Podcasts Audio Files: Angel Navarro III, Associate Member Hailing from the Philippines, Angel Navarro III, Associate Member, goes against academic expectations and pursues art and film while learning how to deal with burnout. CSC Audio Files is brought to you by Rosco. Read More CSC Audio Files Podcasts Audio Files: Belen Garcia, Associate Member Emerging cinematographer Belen Garcia talks about creating your own possibilities, the challenges of relocating to Canada from Mexico, and how an emerging filmmaker can immerse themselves professionally and socially. CSC Audio Files is brought to you by Rosco. Read More CSC Audio Files Podcasts Audio Files: Jack Yan Chen, Associate Member Cinematographer Jack Yan Chen talks about the moment he left the office desk to pursue filmmaking, how you learn through observation and what his Asian parents think about him as a filmmaker. CSC Audio Files is brought to you by Rosco. Read More CSC Audio Files Podcasts Audio Files: Darrell Wonge, Associate Member Former pro-basketball player turned up-and-coming cinematographer, Darrell Wonge sits down with host Andres Galicia to discuss how to start a career from scratch, the importance of a growth mindset and the joy of the journey. CSC Audio Files is brought to you by Rosco. www.rosco.com/dmg Read More CSC Audio Files Podcasts Audio Files: Keenan Lynch, Associate Member Keenan Lynch is one of Canada’s most sought-after cinematographers. Today, he chats with podcast host Andrés P. Galicia about mental health, mentoring and the money side of things. CSC Audio Files is brought to you by Rosco www.rosco.com/dmg Read More CSC Audio Files Podcasts Audio Files: Kristin Fieldhouse CSC There are many paths to becoming a Director of Photography. Kristin Fieldhouse csc talks with host Carolyn Wong about her past humanitarian aid career, building industry relationships while finding her life balance. Recent credits include Orphan Black: Echoes (AMC), Pretty Hard Cases (Netflix), Run (HBO) and “Sugar Daddy,” the feature with director Wendy Morgan. CSC Audio Files is brought to you by Rosco www.rosco.com/dmg Read More CSC Audio Files Podcasts Doug Koch csc This podcast features Director of Photography Doug Koch csc in conversation with Carolyn Wong of the CSC. Doug chats about his latest feature, Funny Boy, directed by Deepa Mehta. Hear in detail his sneaky lighting trickery, dealing with really-really dark situations, aperture pulling, power outages, 100% handheld and feeling liberated by a ‘real jazz’ style shooting approach for this film. Needless to say, Doug is admittedly pleased with what he was able to accomplish on this 31 day, very low-budget film shot under extreme (heat) weather conditions in Sri Lanka. Podcast post production services were provided courtesy of ZERO11ZERO Read More CSC Audio Files Podcasts Elie Smolkin csc This podcast features Director of Photography Elie Smolkin csc in conversation with Carolyn Wong of the CSC. Elie’s formative years in sports came to the fore when an elective gym course in high school was full and anded into a TV Production course where his love for cinematography was born. This led to meeting Kamal Derkaoui csc who generously mentored him. Elie loves the balance of technical, creative – the personality of lenses and customizing them for projects. Words of wisdom: Have your basics, try things, take risks when confident and don’t get complacent or let yourself get bored. Guest hosted on the CSC instagram March 16-30, 2019 Podcast production services were provided courtesy of ZERO11ZERO Release date: 18 August 2020 Read More CSC Audio Files Podcasts Brendan Uegama csc This podcast features Director of Photography Brendan Uegama csc, in conversation with Carolyn Wong of the CSC. Brendan reveals how Stars Wars trickery shaped his desire to get into movies. And discusses the lighting behind some of his recent colourful projects (Katy Keene, Chilling Adventures of Sabrina), how he is always looking for ways to keep growing, learning and progressing as a DP. His philosophy – drive to create something better all the time – don’t settle on ‘just getting it done’ and keep the positivity flowing. Guest hosted on the CSC instagram April 16-30, 2020 Podcast production services were provided courtesy of ZERO11ZERO. Release date: 16 July 2020 Read More CSC Audio Files Podcasts Eric Oh CSC MYSC This podcast features Director of Photography Eric Oh CSC MYSC, in conversation with Carolyn Wong of the CSC. Barcelona based, Eric discusses his early days as an AC, steadicam operator, the CSC members that influenced his career and the importance of keeping calm. He reveals his insight gained from 8 years working in Asia and learning when to go a little out of your comfort zone to progress as a DP. Eric believes in giving back to cinematography societies he’s part of, notably with CSC socials and as a founding member of the Malaysian Society of Cinematographers. Guest hosted on the CSC Instagram Feb. 15-28, 2019. Podcast production services were provided courtesy of ZERO11ZERO. Read More Page 2 of 4Previous1234Next"
