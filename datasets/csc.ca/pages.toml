title = "Past Boards of Directors - Canadian Society of Cinematographers"
description = "Effective 2017, the CSC Board of Directors was reconstructed as the elected representatives of eligible members to govern the CSC, without being assigned to a specific position. This Board selects and appoints the CSC President and its Executive Officer. These two individuals then select and appoint additional individuals to Executive and Committee roles, as they […]"
full_description = "Effective 2017, the CSC Board of Directors was reconstructed as the elected representatives of eligible members to govern the CSC, without being assigned to a specific position. This Board selects and appoints the CSC President and its Executive Officer. These two individuals then select and appoint additional individuals to Executive and Committee roles, as they determine suitable to the effective and efficient management of CSC Operations.The following outlines the individuals who held such positions under this structure: 2021 Directors (alphabetic) Jeremy Benning CSC ASC Zoe Dirse cscGuy Godfree csc (Chair)Rion Gonzales, Associate MemberChristina Ienna, Associate Member Alex Sandahl CPA Claudine Sauvé cscGeorge Willis CSC SASC Martin Wojtunik, Associate Member President George Willis CSC SASC Executive Officer Susan Saranchuk Vice Presidents Western Canada, Philip Lanyon cscEastern Canada, Bruno Philip cscCentral Canada, Penny Watier 2020 Directors (alphabetic) Jeremy Benning CSC ASCZoe Dirse cscKristin Fieldhouse cscGuy Godfree csc (Chair)Rion Gonzales, Associate MemberJoan Hutton cscClaudine Sauvé cscGeorge Willis csc, sasc President George Willis csc, sasc Executive Officer Susan Saranchuk Vice Presidents Western Canada, Philip Lanyon cscEastern Canada, Bruno Philip cscCentral Canada, Penny Watier 2019 Directors (alphabetic) Serge Desrosiers cscZoe Dirse cscPhil Earnshaw cscCarlos Esteves cscJoan Hutton cscBruno Phillip cscJoseph Sunday phd (Chair)George Willis csc, sasc President George Willis csc, sasc Executive Officer Susan Saranchuk Vice Presidents Carlos Esteves csc (Toronto)Bruno Phillip csc (Montréal) Membership Chairs Arthur Cooper cscZoe Dirse csc Education Chairs Carlos Esteves cscGeorge Willis csc, sasc Awards Chair Arthur Cooper csc Treasurer Joseph Sunday Editor-in-Chief (Print) Joan Hutton csc Digital Portals Carolyn Wong (Content Manager) Relationships Gaston Bernier Events Penny Watier 2018 Directors (alphabetic) Phil Earnshaw cscCarlos Esteves cscJoan Hutton cscAntonin Lhotsky cscBruno Phillip cscJoseph Sunday phd (Chair)George Willis csc, sasc President George Willis csc, sasc Executive Officer Susan Saranchuk Vice Presidents Carlos Esteves csc (Toronto)Bruno Phillip csc (Montréal) Membership Chairs Arthur Cooper cscZoe Dirse csc Education Chairs Carlos Esteves cscGeorge Willis csc, sasc Awards Chairs André Pienaar csc (co-Chair)Samy Inayeh csc (co-Chair) Treasurer Joseph Sunday Editor-in-Chief (Print) Joan Hutton csc Digital Portals Carolyn Wong (Content Manager) Relationships Gaston Bernier 2017 Directors (alphabetic) Carlos Esteves cscJoan Hutton cscAlwyn Kumst cscAntonin Lhotsky cscBruno Phillip cscJoseph Sunday phd (Chair)George Willis csc, sasc President George Willis csc, sasc Executive Officer Susan Saranchuk Vice Presidents Carlos Esteves csc (Toronto)Bruno Phillip csc (Montréal)Alwyn Kumst csc (Vancouver) Membership Chair Philip Earnshaw cscArthur Cooper csc Education Chairs Carlos Esteves cscGeorge Willis csc, sasc Awards Chair Alwyn Kumst csc Treasurer Joseph Sunday Editor-in-Chief (Print) Joan Hutton csc Public Relations Chair Bruce Marshall Prior to 2017, each of the CSC Directors and Committee Executives were elected, usually at the Annual General Meeting (AGM). The following outlines the dedicated individuals who held certain positions at various times through the years. 2016 President George Willis csc sasc Vice Presidents Ron Stannett cscCarlos Esteves csc Secretary Antonin Lhotsky csc Treasurer Joseph Sunday phd Membership Chairs Philip Earnshaw cscArthur Cooper csc Education Chairs Luc Montpellier cscAlwyn Kumst csc Public Relations Chair Bruce Marshall 2015 President George Willis csc sasc Vice Presidents Ron Stannett cscCarlos Esteves csc Secretary Antonin Lhotsky csc Treasurer Joseph Sunday phd Membership Chair Philip Earnshaw csc Education Chairs D. Gregor Hagey cscDylan Macleod csc Public Relations Chair Bruce Marshall 2014-2015 President George Willis csc s