["https://csc.ca/channel/page/10"]
title = "Channel - Canadian Society of Cinematographers"
full_description = "Filter by type CSC Audio Files Podcasts Photo Video CSC Presents CSC Insight Series CSC Walkthrough Series CSC Fundamental Series $ = jQuery.noConflict(); $(function(){ // bind change event to select $('#media_type').on('change', function () { var url = 'https://csc.ca/media-type/' + $(this).val(); // get selected value if (url) { // require a URL window.location = url; // redirect } return false; }); }); Video Lighting With Colour: Evans Brown & Jeremy Benning csc View Video Video “Jurassic Park” Screening Q+A with DOP Dean Cundey, csc asc View Video This is the entire Q&A following the 35-mm print screening of Steven Spielberg’s “Jurassic Park” on 13 Apr 2019 at TIFF Bell Lightbox in Toronto . Its cinematographer Dean Cundey asc csc flew in from LA to be our special guest. It was moderated by Arthur Cooper csc. Also thanks to Marcus Valentin and Alex D’Avolio at Sim Post for assembling this edit, and Andrew M. Richardson for coordinating the video capture of the event. Video “The Abyss” Screening Q+A with DOP Mikael Salomon, asc View Video This is the entire Q&A following the 70-mm print screening of James Cameron’s “The Abyss” on 19 Jan 2019 at TIFF Bell Lightbox in Toronto . Its cinematographer Mikael Salomon asc flew in from LA to be our special guest. It was moderated by Arthur Cooper csc. Thanks to Manny Danelon, Michelle Taddei and Susan Saranchuk for coordinating the event. Also thanks to Marcus Valentin and Alex D’Avolio at Sim Post for assembling this edit, and Andrew M. Richardson for coordinating the video capture of the event. CSC Audio Files Podcasts Todd M. Duym csc This podcast features Director of Photography Todd M. Duym csc in conversation with Carolyn Wong of the CSC. Todd talks about his “no film school” background and the REM video – his breakout job – shot while living the dual life in his early days as an AC by day, rock ‘n roll stills photographer/DP on music videos by night. How he always creatively pushes his boundaries on each job and how his vast stills experience/experimentation informs his motion picture work. Hear about his “case of solutions” he doesn’t go to set without and his advice to young DP’s. Guest hosted on the CSC instagram 1-15 March 2019. Podcast post production services were provided courtesy of Michael Jari Davidson (Associate member) and Devin O’Haire. Read More CSC Audio Files Podcasts Norm Li csc This podcast features Director of Photography, Norm Li csc in conversation with Carolyn Wong of the CSC. Norm talks about what it was like shooting the last Fuji stock ever on his break out film, Beyond the Black Rainbow. Hear of his ‘T’ bounce technique on Never Steady, Never Still (secrets revealed!). Since he gives his `all’ to the projects he works on, it is important that they resonate with him on a personal level and be emotionally satisfying and that the evolution of who he is, can be reflected in the projects he chooses. Hear the value of what he never, never, never goes to set without, and the need for everyone to practice equal opportunity in the industry. His recent project, The Body Remembers When The World Broke Open, shot in 16mm and ‘real time’, has its North American Premiere at TIFF 2019. Guest hosted on the CSC instagram July 2016. Podcast post production services were provided courtesy of Michael Jari Davidson (Associate member) and Devin O’Haire. Read More CSC Audio Files Podcasts Kim Derko csc This podcast features Director of Photography Kim Derko csc in conversation with Carolyn Wong of the CSC. Kim reveals her formal and formative background in film school and the arts and how it informs her work. She elaborates on embracing naturalistic, saturated colour play on the ‘female gaze’ remake of the Cronenberg horror classic ‘Rabid’ with Directors Jen and Sylvia Soska aka Soska Sisters – the dream job. And talks about the DP’s challenge of shooting night exteriors in this age of mixed street lighting and how she is now loving car interiors. And finally, it’s never time to toss the light meter. Guest hosted on our Instagram Sep 2016 and 1-15 Oct 2019. Podcast post production services were provided courtesy of Michael Jari Davidson (Associate member) and Devin O’Haire. Read More Video The Expanse – Practical LED Lighting with Jeremy Benning csc View Video Director of Photography Jeremy Benning csc walks viewers through the set of The Expanse with explanations of many of the cinematographic approaches used for this series. CSC Audio Files Podcasts Craig Wrobleski csc This podcast features Director of Photography Craig Wrobleski csc in conversation with Carolyn Wong of the CSC. Craig reveals his early days, what he doesn’t go to set without, how large format blew his mind and thread of connectivity. And Tips for DITs. Recent projects include Umbrella Academy and In The Tall Grass. At the time of the podcast, he was prepping to head off to shoot the reboot of The Twilight Zone. Guest hosted on the CSC instagram 1-15 Jan 2018. Podcast production services were provided courtesy of Michael Jari Davidson (Associate member) and Devin O’Haire. Read More CSC Audio Files Podcasts Karim Hussain csc This podcast features Director of Photography Karim Hussain csc in conversation with Carolyn Wong of the CSC. Karim discusses how his formative years in the suburbs of Ottawa shaped him, how it influenced his life long obsession with art house horror films and how this genre’s subversive nature is a reflection of society. Some insightful anecdotes on the films that put him on the map and recent projects ‘Random Acts of Violence’ and what’s cooking up this spring with Brandon Cronenberg’s ‘Possessor’. Karim was our first ever guest host on the CSC instagram, October 2015, with a redux July 16-30, 2018 Podcast production services were provided courtesy of Michael Jari Davidson (Associate member) and Devin O’Haire. Read More Photo 3D Workshop Page 10 of 11FirstPrevious…7891011Next"
