title = "CSC Audio Files Podcasts Archives - Page 3 of 4 - Canadian Society of Cinematographers"
description = "Audio Files go beyond cinematography. Designed to go deeper than a technical discussion it’s meant to be honest, personal. At the forefront of trends, topics will range from politics and equity to diversity, to virtual production, to mental health and the impact of shooting schedules on relationships. Brought to you by Rosco with assistance from The Foundation of Cinematography."
full_description = "Filter by type CSC Audio Files Podcasts Photo Video CSC Presents CSC Insight Series CSC Walkthrough Series CSC Fundamental Series $ = jQuery.noConflict(); $(function(){ // bind change event to select $('#media_type').on('change', function () { var url = 'https://csc.ca/media-type/' + $(this).val(); // get selected value if (url) { // require a URL window.location = url; // redirect } return false; }); }); CSC Audio Files Podcasts Boris Mojsovski csc This podcast features Director of Photography Boris Mojsovski csc in conversation with Jeremy Benning csc. Boris discusses his work on the DC Comics series Titans, as well as 12 Monkeys, the concept of working with a co-DP on an episodic TV series and his general approach to prep and on-set lighting. Guest hosted on our Instagram 16-30 Oct 2017. Podcast production services were provided courtesy of Treehaus Sound. Read More CSC Audio Files Podcasts Ron Stannett csc This podcast features Director of Photography Ron Stannett csc in conversation with Carolyn Wong of the CSC. Ron reminiscences about his journey from in front of the camera, to behind it downunder in his native Australia, to his long and outstanding career in Canada. His adventures with intense documentary shooting, giving ‘good negative’, how digital is fun and wanting getting ‘edgy’ with his lighting at the age of 74. Thank you Finalé Post-Production and Andrew Jha in Vancouver for the recording space. Podcast post production services were provided courtesy of Michael Jari Davidson (Associate member) and Devin O’Haire. Read More CSC Audio Files Podcasts Todd M. Duym csc This podcast features Director of Photography Todd M. Duym csc in conversation with Carolyn Wong of the CSC. Todd talks about his “no film school” background and the REM video – his breakout job – shot while living the dual life in his early days as an AC by day, rock ‘n roll stills photographer/DP on music videos by night. How he always creatively pushes his boundaries on each job and how his vast stills experience/experimentation informs his motion picture work. Hear about his “case of solutions” he doesn’t go to set without and his advice to young DP’s. Guest hosted on the CSC instagram 1-15 March 2019. Podcast post production services were provided courtesy of Michael Jari Davidson (Associate member) and Devin O’Haire. Read More CSC Audio Files Podcasts Norm Li csc This podcast features Director of Photography, Norm Li csc in conversation with Carolyn Wong of the CSC. Norm talks about what it was like shooting the last Fuji stock ever on his break out film, Beyond the Black Rainbow. Hear of his ‘T’ bounce technique on Never Steady, Never Still (secrets revealed!). Since he gives his `all’ to the projects he works on, it is important that they resonate with him on a personal level and be emotionally satisfying and that the evolution of who he is, can be reflected in the projects he chooses. Hear the value of what he never, never, never goes to set without, and the need for everyone to practice equal opportunity in the industry. His recent project, The Body Remembers When The World Broke Open, shot in 16mm and ‘real time’, has its North American Premiere at TIFF 2019. Guest hosted on the CSC instagram July 2016. Podcast post production services were provided courtesy of Michael Jari Davidson (Associate member) and Devin O’Haire. Read More CSC Audio Files Podcasts Kim Derko csc This podcast features Director of Photography Kim Derko csc in conversation with Carolyn Wong of the CSC. Kim reveals her formal and formative background in film school and the arts and how it informs her work. She elaborates on embracing naturalistic, saturated colour play on the ‘female gaze’ remake of the Cronenberg horror classic ‘Rabid’ with Directors Jen and Sylvia Soska aka Soska Sisters – the dream job. And talks about the DP’s challenge of shooting night exteriors in this age of mixed street lighting and how she is now loving car interiors. And finally, it’s never time to toss the light meter. Guest hosted on our Instagram Sep 2016 and 1-15 Oct 2019. Podcast post production services were provided courtesy of Michael Jari Davidson (Associate member) and Devin O’Haire. Read More CSC Audio Files Podcasts Craig Wrobleski csc This podcast features Director of Photography Craig Wrobleski csc in conversation with Carolyn Wong of the CSC. Craig reveals his early days, what he doesn’t go to set without, how large format blew his mind and thread of connectivity. And Tips for DITs. Recent projects include Umbrella Academy and In The Tall Grass. At the time of the podcast, he was prepping to head off to shoot the reboot of The Twilight Zone. Guest hosted on the CSC instagram 1-15 Jan 2018. Podcast production services were provided courtesy of Michael Jari Davidson (Associate member) and Devin O’Haire. Read More CSC Audio Files Podcasts Karim Hussain csc This podcast features Director of Photography Karim Hussain csc in conversation with Carolyn Wong of the CSC. Karim discusses how his formative years in the suburbs of Ottawa shaped him, how it influenced his life long obsession with art house horror films and how this genre’s subversive nature is a reflection of society. Some insightful anecdotes on the films that put him on the map and recent projects ‘Random Acts of Violence’ and what’s cooking up this spring with Brandon Cronenberg’s ‘Possessor’. Karim was our first ever guest host on the CSC instagram, October 2015, with a redux July 16-30, 2018 Podcast production services were provided courtesy of Michael Jari Davidson (Associate member) and Devin O’Haire. Read More CSC Audio Files Podcasts Adam Marsden csc This podcast features cinematographer Adam Marsden csc, interviewed by Jeremy Benning csc and Martin Wojtunik (Associate member), discussing Adam’s work on the internet-crushing music video “Hotline Bling” for Drake. Adam talks about how he got his start and the craft of music videos in general. The video presented Adam with challenges related to shooting high frame rates with RGB LED light fixtures and lighting integration with set design. Guest hosted on the CSC instagram 1-29 Feb 2016. Podcast produced by Treehaus. Read More CSC Audio Files Podcasts Brett VanDyke csc This podcast features Director of Photography Brett Van Dyke csc in conversation with Carolyn Wong CSC Board member, about his industry beginnings, the TV series “Backstage” airing on Family Channel in March 2016, praise of documentary cinematographers, the art of 2nd unit shooting and tips for starting out. Guest hosted on the CSC instagram 16-30 Jan 2018. Thank you Grayson Matthews for the use of their studio space to record the podcast and Red Square Motion for post production services. Read More CSC Audio Files Podcasts Gerald Packer csc This podcast features Director of Photography Gerald Packer csc in conversation with Carolyn Wong, CSC Board member, about how much he enjoys working with the “funny bunch of people” on the award winning CBC hit comedy series “Schitt’s Creek”, hitting the lighting sweet spot between sitcom/drama and wanderings that lead him to where he is now. Thank you to Red Square Motion for post-production services and recording space. Read More Page 3 of 4Previous1234Next"
