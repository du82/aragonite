title = "Channel - Canadian Society of Cinematographers"
full_description = "Filter by type CSC Audio Files Podcasts Photo Video CSC Presents CSC Insight Series CSC Walkthrough Series CSC Fundamental Series $ = jQuery.noConflict(); $(function(){ // bind change event to select $('#media_type').on('change', function () { var url = 'https://csc.ca/media-type/' + $(this).val(); // get selected value if (url) { // require a URL window.location = url; // redirect } return false; }); }); CSC Insight Series Insight: RT Thorne Canadian director RT Thorne has worked on several high-profile television series, including Utopia Falls, which he co-created and directed, The Porter, Blindspot, The Nine Lives of Chloe King, Degrassi: The Next Generation, and Murdoch Mysteries. His first feature film Forty Acres premiered at TIFF in 2024. He is recognized for championing representation in media, bringing underrepresented voices to the forefront. Join the conversation with RT. Read More CSC Insight Series Insight: Luc Montpellier CSC ASC Cinematographer Luc Montpellier csc asc covers mentorship, the long game in the industry, agencies for DPs, learning from mistakes, and understanding that success takes time. Read More CSC Walkthrough Series CSC Walkthrough: Accused In this episode, we take a closer look at the lighting design of “Accused” Season 1, Episode 2: “Robyn’s Story.” Read More CSC Insight Series Insight: Rob Scarborough CSC From the value of spec work to the power of networking, and overcoming imposter syndrome, Rob Scarborough CSC dives deep into the essentials of filmmaking. Plus, tips on working with actors, lighting, and choosing the right DP agency. Read More CSC Insight Series Insight: Boris Mojsovski CSC ASC ASBH Boris Mojsovski CSC ASC ASBH reflects on his journey as a newcomer to Canada, finding a sense of community in the film industry, and emphasizes the significance of persistence and mentorship. Read More CSC Insight Series Insight: Elisa Sauvé Production Designer Elisa Sauvé discusses the production design process, the importance of pre-viz & the working relationship between production designers and cinematographers. Read More CSC Audio Files Podcasts Audio Files: Hoyte Van Hoytema ASC Hoyte Van Hoytema asc discusses his career journey, his collaborations with Christopher Nolan, and offers advice for those interested in exploring filming in an IMAX format. This episode is hosted by Daniel Green, Associate Member. CSC Audio Files is brought to you by Rosco. Read More CSC Insight Series CSC Insight: Keenan Lynch Keenan Lynch, Associate Member, shares his experiences in a compelling and personal way about what it’s like to be one of North American’s few Black cinematographers. Read More CSC Audio Files Podcasts Audio Files: Sean Stiller Hailing from Vancouver, Sean Stiller uses his graphic design background, travel experience and the love for cinema to aide his hunger for experimental storytelling. This episode is hosted by Kaayla Whachell. CSC Audio Files is brought to you by Rosco. Read More CSC Fundamental Series Fundamentals: Choosing Your Lights with Sue Johnson Read More Page 1 of 1112345…10…NextLast"
