full_description = "Filter by type CSC Audio Files Podcasts Photo Video CSC Presents CSC Insight Series CSC Walkthrough Series CSC Fundamental Series $ = jQuery.noConflict(); $(function(){ // bind change event to select $('#media_type').on('change', function () { var url = 'https://csc.ca/media-type/' + $(this).val(); // get selected value if (url) { // require a URL window.location = url; // redirect } return false; }); }); CSC Audio Files Podcasts Audio Files: Diana Parry, Associate Member Diana discusses the path that led her to become comfortable with cameras while facing labels placed upon diverse individuals within the film industry. CSC Audio Files is brought to you by Rosco. Read More CSC Audio Files Podcasts Audio Files: Jesse Wicklund The inherent love for film as a ten year old was encouraged by Jesse’s grandfather. Watching VHS tapes and DVD’s Jesse was enamoured by moving pictures and began his journey as a filmmaker. CSC Audio Files is brought to you by Rosco. Read More CSC Audio Files Podcasts Audio Files: Andres Galicia, Associate Member Hailing from Mexico, Andres opens up about staying resilient in an industry that can appear more intimidating than it actually is. Staying open and humble leaves doors open, if you are open to it. CSC Audio Files is brought to you by Rosco. Read More CSC Audio Files Podcasts Audio Files: Jon Elliott, Associate Member The love for filmmaking starts in childhood. Jon brings us back to the early memory of watching Jurassic Park for the first time with his grandmother. From there, he began making homemade movies with his brothers. The rest is history and a bright future ahead of many more stories to tell. CSC Audio Files is brought to you by Rosco. Read More CSC Insight Series CSC Insight: Jason Vieira Steadicam operator, Jason Vieira talks about the qualities of a great operator & DP, building trust on set and always looking for mentors. Read More CSC Audio Files Podcasts Audio Files: Marc Laliberté csc This episode features Marc LaLiberté csc. On the discussion menu: shooting large scale series, on set structure, complacency and reaching beyond your comfort zone. CSC Audio Files is brought to you by Rosco. www.rosco.com/dmg Read More CSC Audio Files Podcasts Audio Files: Stirling Bancroft CSC This episode features Stirling Bancroft csc in Vancouver. He shares wisdom, enthusiastic love of cinematography, first impressions, camera operating and the importance of a good coffee. CSC Audio Files is brought to you by Rosco. www.rosco.com/dmg Read More CSC Audio Files Podcasts Audio Files: Peter Simonite, CSC ASC Austin Texas-based Peter Simonite shares with host Carolyn Wong his reflections on career and life journey so far, working with DPs he admires, the importance of 2nd unit dogmas and figuring out parenthood while on the road. CSC Audio Files is brought to you by Rosco. www.rosco.com/dmg Read More CSC Audio Files Podcasts Audio Files: Iris Ng, Associate Member This episode features respected documentary cinematographer, Iris Ng in conversation with host Carolyn Wong. Iris talks about how the genre chose her, learning to question a thesis and that representation matters in the industry. CSC Audio Files is brought to you by Rosco. Read More CSC Audio Files Podcasts Audio Files: Angel Navarro III, Associate Member Hailing from the Philippines, Angel Navarro III, Associate Member, goes against academic expectations and pursues art and film while learning how to deal with burnout. CSC Audio Files is brought to you by Rosco. Read More Page 2 of 11Previous12345…10…NextLast"
