["https://csc.ca/become-a-member"]
title = "Become a Member - Canadian Society of Cinematographers"
description = "CSC MEMBERS Membership Information This section provides information about each category and the corresponding application materials. It is important to remember that after becoming a member, you can upgrade your category as your occupation or position within the industry changes. Please contact the CSC administrative staff with any questions about membership via phone or email."
full_description = "CSC MEMBERS Membership Information This section provides information about each category and the corresponding application materials. It is important to remember that after becoming a member, you can upgrade your category as your occupation or position within the industry changes. Please contact the CSC administrative staff with any questions about membership via phone or email. toggle navigation Members Member Directory Member Benefits Become a Member About Overview History Leadership News Calendar Partners Sponsorship The Future is Calling Channel CSC Insight Series CSC Presents CSC Audio Files Podcasts CSC Walkthrough Series CSC Fundamental Series Education Workshops Internship Initiative Mentorship Awards 2025 Awards 2024 Sponsorship Past Awards Photo Gallery Publications Magazine In the News Retailers Submissions Store Search Members Become a Member There are five categories of membership for which you may apply. We invite you to apply for the type of membership which is appropriate for your particular occupation and experience. Membership Categories Full Membership Full Membership is by invitation only. For more information contact: admin@csc.ca. Associate Membership The applicant must be recognized as a working cinematographer, as defined in the terminology section of the CSC bylaws, for a period acceptable to the membership committee. Please visit our store for application forms to apply for membership. CSC Store Affiliate Membership The applicant must provide evidence that they have been employed as a camera Operator, camera Assistant, or Digital Imaging Technician with the on-set camera crew, for recognized cinematographers over a period acceptable to the membership committee. Less experienced motion picture camerapersons may also be accepted as an Affiliate member until they meet the guideline established by the membership committee for Associates. The applicant may also qualify for Affiliate membership by successfully completing professional training as one of these three camera team roles via post-secondary educational programs acceptable to the membership committee. This is outlined in the Affiliate membership section of the CSC bylaws. Please visit our store for application forms to apply for membership. CSC Store Student Membership The applicant must be enrolled in a program related to cinematography (as defined in the terminology section of the CSC bylaws) at a post-secondary educational institution in Canada. The Membership committee will determine whether the applicant’s program qualifies for acceptance under this class. Please visit our store for application forms to apply for membership. CSC Store Companion Membership The applicant must be professionally and actively employed in a position intrinsically related to cinematography as defined in the terminology section of the CSC bylaws, for a period acceptable to the membership committee. The Membership committee will be the sole arbiter for which applicants may be accepted under this class. Please visit our store for application forms to apply for membership. CSC Store"
year_published = 2025
year_updated = 2025
