["https://csc.ca/media-type/csc-insight-series/page/2"]
title = "CSC Insight Series Archives - Page 2 of 3 - Canadian Society of Cinematographers"
description = "The Insight Series is loaded with content that is original, inspirational, and cinematography-related built. With an eye to helping emerging camera artists build their careers, it’s informative for anyone interested in the inside story of making film and television – from feature films to commercials. Brought to you by Aputure with assistance from The Foundation of Cinematography."
full_description = "Filter by type CSC Audio Files Podcasts Photo Video CSC Presents CSC Insight Series CSC Walkthrough Series CSC Fundamental Series $ = jQuery.noConflict(); $(function(){ // bind change event to select $('#media_type').on('change', function () { var url = 'https://csc.ca/media-type/' + $(this).val(); // get selected value if (url) { // require a URL window.location = url; // redirect } return false; }); }); CSC Insight Series CSC Insight: Guy Godfree csc Guy Godfree csc talks about the true success behind every job and recognizing everyone else’s collective effort in creating the picture. (SPONSORED BY CINELEASE LRX) Read More CSC Insight Series CSC Insight: Claudine Sauvé csc Claudine Sauvé csc talks about her experience in the film industry. Read More CSC Insight Series CSC Insight: Jeremy Benning csc Jeremy Benning talks about his career path and tells the story of coming out in the industry and the importance of being a role model to others in the LGBTQ community. Sometimes, making a spec reel and passion project is the key to taking your work to the next level. Embrace the uncertainty of the film business and know that the next opportunity is always around the corner, even when dealt with disappointments. Don’t be afraid to ask for suggestions from your team and be comfortable with knowing when to let go of the small stuff. Read More CSC Insight Series CSC Insight: Alan Poon csc Alan Poon dives deep into the topics of imposter syndrome, diversity within the film industry, role models and the importance of mentorship. Read More CSC Insight Series CSC Insight: Bobby Shore csc Bobby Shore talks about the realities of breaking into the industry, the importance of seeing the crew as humans first and the forks in the road ahead and how to prepare for them. Read More CSC Insight Series CSC Insight: Zoe Dirse csc Zoe Dirse csc recalls the lack of women in the industry when she started her career and takes a deeper look into the female gaze. Listen to some of her great advice on imposter syndrome and how to create your own opportunities towards becoming a cinematographer! Read More CSC Insight Series CSC Insight: Jordan Oram Associate Member Jordan Oram, Associate Member discusses his career path, lessons learned along the way and the creation of Higher Hire, whose goal is to create direct pathways and opportunities for underrepresented talent to develop the tools, knowledge and networks necessary to build a successful career in production. Read More CSC Insight Series CSC Insight: Tom Comet Associate Member Drone pilot and Associate Member Tom Comet discusses his perspective on drone work for commercials and episodic television. Tom’s team is based in the Toronto area. Since early on, Tom has always had a keen interest in aviation, innovation and robotics, so the drone/UAV world was a perfect fit. He has been piloting drones since […] Read More CSC Insight Series CSC Insight: Maya Bankovic csc Cinematographer Maya Bankovic csc shares the story of how her path from making films with her sister as a kid lead to seeking out film festival audiences, shooting documentaries and then levelling up into the world of commercials, music videos and union work in long format filmmaking. Contact her on Instagram: https://www.instagram.com/mayabankovic/ Read More CSC Insight Series CSC Insight: James Klopko csc Cinematographer James Klopko csc discusses his career path and how to stay inspired. Contact him on Instagram: https://www.instagram.com/jamesklopko View the full playlist on the CSC YouTube Channel and Subscribe! Read More Page 2 of 3Previous123Next"
year_published = 2025
clearnet = "https://csc.ca/media-type/csc-insight-series/page/2"
