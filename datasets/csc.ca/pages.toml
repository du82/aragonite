title = "Zsigmond Vilmos Festival Announces Call for Submissions - Canadian Society of Cinematographers"
description = "The 9th Zsigmond Vilmos International Film Festival is open for submissions until January 15, 2025. The festival primarily seeks to draw attention to the work of cinematographers, as well as provide opportunities to young artists to showcase their work. Students of cinematography/film directing and young cinematographers/directors can also submit their new feature films, short films […]"
