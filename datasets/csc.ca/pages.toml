full_description = "Canadian director RT Thorne has worked on several high-profile television series, including Utopia Falls, which he co-created and directed, The Porter, Blindspot, The Nine Lives of Chloe King, Degrassi: The Next Generation, and Murdoch Mysteries. His first feature film Forty Acres premiered at TIFF in 2024. He is recognized for championing representation in media, bringing underrepresented voices to the forefront. Join the conversation with RT. Join us for another insightful conversation brought to you by Aputure Lighting. Don’t forget to subscribe to the CSC Youtube Channel for more CSC content"
