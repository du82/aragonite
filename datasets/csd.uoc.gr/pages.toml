title = "Σαράντα έτη λειτουργίας του Τμήματος | Τμήμα Επιστήμης Υπολογιστών - Πανεπιστήμιο Κρήτης"
full_description = 'Αρχική Σελίδα 40 Χρόνια CSD! Σαράντα έτη λειτουργίας του Τμήματος A+ A- Το Τμήμα Επιστήμης Υπολογιστών του Πανεπιστημίου Κρήτης κλείνει 40 χρόνια λειτουργίας το 2024. Κατά τη διάρκεια της ακαδημαϊκής χρονιάς 2024-25 θα πραγματοποιηθούν, με αυτή την ευκαιρία, διάφορες δράσεις που σκοπό θα έχουν να αναδείξουν την ιστορία και την πλούσια προσφορά του Τμήματος μέχρι στιγμής, στην επιστήμη και στην κοινωνία, αλλά και να δείξουν το δρόμο για το μέλλον. Η σελίδα αυτή θα είναι κεντρική σελίδα αναφοράς για τις δράσεις αυτές και θα ενημερώνεται τακτικά. Παρασκευή 27 Σεπ. 2024: Συνάντηση αποφοίτων με έμφαση στα έτη εισαγωγής 1984, 1993, 1994. Οι συνεδρίες/συζητήσεις θα γίνουν στο αμφιθέατρο "Στέλιος Ορφανουδάκης" του Τμήματος, στο διάστημα 10:00-16:00. Πρόγραμμα Εκδήλωσης Δελτίο Τύπου Παρασκευή 23 Μαΐου 2025: Προγραμματίζεται επίσημη εκδήλωση: "40 Χρόνια CSD, 40 χρόνια Πληροφορική στην Ελλάδα", για τον εορτασμό των 40 χρόνων λειτουργίας του, την Παρασκευή 23 Μαΐου 2025 στο Αμφιθέατρο «Νίκος Πετρίδης» του Πανεπιστημίου Κρήτης στην Πανεπιστημιούπολη Βουτών, Ηράκλειο Κρήτης. Προσκαλούμε όλους τους απόφοιτους, φοιτητές, προσωπικό, συνεργάτες, και φίλους του Τμήματος στην εκδήλωση αυτή η οποία έχει στόχο να αναδείξει την ιστορία και την πλούσια προσφορά του Τμήματος στην επιστήμη και την κοινωνία, και να δείξει το δρόμο για το μέλλον. Περισσότερες πληροφορίες και το πρόγραμμα της εκδήλωσης θα ανακοινωθούν σε αυτή τη σελίδα στο προσεχές διάστημα.'
author = "Designed and developed as a bachelor thesis from Siopis Ilias ( ilsio9@gmail.com )"
year_published = 2025
