title = "Τμήμα Επιστήμης Υπολογιστών - Πανεπιστήμιο Κρήτης"
full_description = '''#breadcrumbsContainer{height: 0px;overflow: hidden;padding: 0;} function wait(ms){ var start = new Date().getTime(); var end = start; while(end < start + ms) { end = new Date().getTime(); } } Το Τμήμα Γνωρίστε τις νέες εγκαταστάσεις στις οποίες λειτουργεί πλέον το τμήμα, καθώς και δείτε πως θα φτάσετε εκεί. 40 Χρόνια CSD Σαράντα έτη λειτουργίας του τμήματος Προπτυχιακό πρόγραμμα Μάθετε περισσότερα για το ύφος και τις προοπτικές που προσφέρει το πρόγραμμα βασικών σπουδών. Προπτυχιακό πρόγραμμα Μάθετε περισσότερα για το ύφος και τις προοπτικές που προσφέρει το πρόγραμμα βασικών σπουδών. Προπτυχιακό πρόγραμμα Μάθετε περισσότερα για το ύφος και τις προοπτικές που προσφέρει το πρόγραμμα βασικών σπουδών. Προπτυχιακό πρόγραμμα Μάθετε περισσότερα για το ύφος και τις προοπτικές που προσφέρει το πρόγραμμα βασικών σπουδών. Μεταπτυχιακό πρόγραμμα Θεματικές περιοχές με τις οποίες ασχολείται το μεταπτυχιακό πρόγραμμα του τμήματος και τρόποι δήλωσης ενδιαφέροντος. Μεταπτυχιακό πρόγραμμα Θεματικές περιοχές με τις οποίες ασχολείται το μεταπτυχιακό πρόγραμμα του τμήματος και τρόποι δήλωσης ενδιαφέροντος. Καλώς ήλθατε στο Τμήμα Επιστήμης Υπολογιστών Το Τμήμα Επιστήμης Υπολογιστών του Πανεπιστημίου Κρήτης προσφέρει ένα προπτυχιακό και μεταπτυχιακό πρόγραμμα υψηλής ποιότητας και διεξάγει έρευνα με απτά και σημαντικά αποτελέσματα σε περιοχές σημασίας για την βιομηχανία και την κοινωνία. Οι διδακτικές και ερευνητικές δραστηριότητες του Τμήματος καλύπτουν ένα ευρύ φάσμα βασικών και εφαρμοσμένων περιοχών στην Επιστήμη Υπολογιστών. Οι σπουδές στο Τμήμα Επιστήμης Υπολογιστών του Πανεπιστημίου Κρήτης προσφέρουν ένα πλήθος δυνατοτήτων, ευκαιριών και πλεονεκτημάτων. Το προπτυχιακό πρόγραμμα του Τμήματος στοχεύει στο να παρέχει βαθιά κατανόηση των θεμελιωδών στοιχείων της Επιστήμης Υπολογιστών και σημαντικών περιοχών εφαρμογών. Iσορροπεί σε βάθος και εύρος τόσο στις βασικές αρχές όσο και στις περιοχές εφαρμογών, προσδίδει μεγάλη σημασία σε εργαστηριακή και πειραματική εκπαίδευση και εμπειρία, και προωθεί την καλλιέργεια προσωπικών δεξιοτήτων. Το προπτυχιακό πρόγραμμα του Τμήματος συμβαδίζει με διεθνή πρότυπα, λαμβάνει υπ’ όψη του σύγχρονες απόψεις και τάσεις σχετικά με την εκπαίδευση και την έρευνα. Πιστεύουμε οτι προσφέρει την υψηλή ποιότητα που είναι απαραίτητη για την προετοιμασία των μελλοντικών επιστημόνων και σχεδιαστών. Δείτε το Τρίπτυχο του Τμήματος $mainCategory = $('.mainCategory'); $mainCategory.height($mainCategory.width()*0.8 < 240 ? 240 : $mainCategory.width()*0.8); $(window).resize(function(){ $mainCategory.height($mainCategory.width()*0.8 < 240 ? 240 : $mainCategory.width()*0.8); }); var elements = []; $mainCategory.each(function(){ elements.push($(this)); }); function showThem(){ var $elem=elements.shift(); $elem.css({ visibility:'visible', opacity:1 }); if(elements.length){ setTimeout(function(){showThem();},300); } } $mainCategoryBigText = $("div.mainCategoryBigText"); $mainCategorySmallText = $("div.mainCategorySmallText"); var maxBigHeight = Math.max.apply(null, $mainCategoryBigText.map(function () { return $(this).height(); }).get()); $mainCategoryBigText.height(maxBigHeight); var maxSmallHeight = Math.max.apply(null, $mainCategorySmallText.map(function () { return $(this).height(); }).get()); $mainCategorySmallText.height(maxSmallHeight); $mainCategoryTexts = $("div.mainCategoryTexts"); var maxTextsHeight = Math.max.apply(null, $mainCategoryTexts.map(function () { return $(this).outerHeight(); }).get()); $('.mainCategory').hover(function(){ $(this).find('.mainCategoryTexts').stop().animate({height: maxBigHeight+20}); },function(){ $(this).find('.mainCategoryTexts').stop().animate({height: maxTextsHeight}); }); $(document).ready(function(){ showThem(); }); $(window).resize(function(){ $mainCategoryBigText.height('auto'); $mainCategorySmallText.height('auto'); $mainCategoryTexts.height('auto'); maxBigHeight = Math.max.apply(null, $mainCategoryBigText.map(function () { return $(this).height(); }).get()); $mainCategoryBigText.height(maxBigHeight); maxSmallHeight = Math.max.apply(null, $mainCategorySmallText.map(function () { return $(this).height(); }).get()); $mainCategorySmallText.height(maxSmallHeight); maxTextsHeight = Math.max.apply(null, $mainCategoryTexts.map(function () { return $(this).outerHeight(); }).get()); }); var glob_interval = 15000; //<!-- gallery 1 --> $(document).ready(function(){ var total=$('#gallery1 .gallery_item').length; var current=0; var prev=0; var width=$('#gallery1').width(); var $elements=new Array(); var interval=glob_interval; $('#gallery1 .gallery_item').each(function(){ $elements[current++]=$(this); }); current=1; function hideIt($elem){ $elem.fadeOut(1500); } function showIt($elem){ $elem.fadeIn(1500); } function slideshow(){ if(total==1) return; hideIt($elements[prev]); showIt($elements[current]); current++; prev=current-1; if(current>=total){ current=0; prev=total-1; } setTimeout(function(){slideshow();},interval); } setTimeout(function(){slideshow();},interval); $([ 'uploaded_files/frontpage/upper_left/ranking_banner-01-01.jpg' ]).preload(); }); <!-- gallery 2 --> $(document).ready(function(){ var total=$('#gallery2 .gallery_item').length; var current=0; var prev=0; var width=$('#gallery2').width(); var $elements=new Array(); var interval=glob_interval; $('#gallery2 .gallery_item').each(function(){ $elements[current++]=$(this); }); current=1; function hideIt($elem){ $elem.fadeOut(1500); } function showIt($elem){ $elem.fadeIn(1500); } function slideshow2(){ if(total==1) return; hideIt($elements[prev]); showIt($elements[current]); current++; prev=current-1; if(current>=total){ current=0; prev=total-1; } setTimeout(function(){slideshow2();},interval); } wait(500); setTimeout(function() { slideshow2(); },interval); $([ 'uploaded_files/frontpage/upper_right/40yearsV3.png' ]).preload(); }); <!-- gallery 3 --> $(document).ready(function(){ var total=$('#gallery3 .gallery_item').length; var current=0; var prev=0; var width=$('#gallery3').width();