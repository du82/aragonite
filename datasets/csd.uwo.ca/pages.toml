["https://csd.uwo.ca/news/2024/London-Job-Portal.html"]
title = "AI Transforms Job Portal - AI Transforms Job Portal - Western University"
description = "By leveraging generative AI technologies, Dr Anwar Haque and his team at Bamboo Innovations, helped the London Economic Development Corporation (LEDC) transform their job portal."
full_description = "When computer science professor Anwar Haque first connected with the London Economic Development Corporation (LEDC), the organization and its member companies were manually populating its job board with postings. It meant staff spent time copying and pasting employment opportunities and formatting them to fit with the style of LEDC’s central job board. As London saw rapid population growth, job postings were exploding. “It was a very laborous job. Imagine all these companies are posting jobs on a daily basis, and each has a different format. You only have a couple of people to convene all of them, digest them and post them on the LEDC website in a unified style; it’s impossible to do that in real time,” Haque said. So, Haque, along with his PhD student Muhammad Zakar, built the answer using artificial intelligence (AI). Department of Computer ScienceRoom 355, Middlesex College, Western University, London, Ontario, Canada, N6A 5B7Tel: 519-661-3566cs-dept@uwo.caPrivacy | Web Standards | Terms of Use | Accessibility"
year_published = 2025
clearnet = "https://csd.uwo.ca/news/2024/London-Job-Portal.html"
tags = ["portal", "topics:", "transforms"]
