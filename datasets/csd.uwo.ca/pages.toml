["https://csd.uwo.ca/outreach/camp/index.html"]
title = "Bit By Bit Summer Camp - Computer Science - Western University"
description = "Western University, in vibrant London, Ontario, delivers an academic and student experience second to none."
full_description = "Our curriculum makes use of experiential learning principles and is designed for campers ages 9-13, regardless of experience or skill level. Campers with beginning or advanced computer experience alike will find a stimulating, engaging curriculum. Computers are everywhere. Employers today seek candidates with strong technical skills, even for jobs not traditionally associated with computers. Learning these skills at a young age will give your child a head start that will be useful in many areas of life, and applicable in just about any field your child might one day choose. While Bit By Bit aims to provide a solid grounding in technical skills, your child won't be stuck indoors, sitting in front of a computer all day. With robotics competitions, daily outdoor games, swimming, and other group activities, your child will enjoy plenty of time for exercise and socialization with peers. Department of Computer ScienceRoom 355, Middlesex College, Western University, London, Ontario, Canada, N6A 5B7Tel: 519-661-3566cs-dept@uwo.caPrivacy | Web Standards | Terms of Use | Accessibility"
