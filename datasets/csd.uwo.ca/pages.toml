["https://csd.uwo.ca/undergraduate/current/advising.html"]
title = "Academic Advising - Computer Science - Western University"
description = "Western University, in vibrant London, Ontario, delivers an academic and student experience second to none."
full_description = "Before reaching out to Academic Advising, please be sure to familiarize yourself with the Academic Calendar and the Science Academic Advising website. Many of your questions may already be addressed on one or both of those online resources. For having the Computer Science courses you want to take at another university evaluated prior to taking the course. Please pick up a form from your Dean's Office prior to seeing a Department Advisor. Office of the Registrar - Letter of Permission Information can be found here Note: You will still require final approval from your Faculty Academic Advisor for the LOP Evaluations of Computer Science courses completed in a prior degree. You must provide a copy (does not have to be an original copy ) of your transcript for evaluation. Course outlines for may also be required. For Computer Science courses taken at another university or college. You must provide a copy (does not have to be an original copy ) of your transcript for evaluation. Course outline for may also be required. Office of the Registrar - Letter of Permission Information can be found here Permissions other than those pertaining to Computer Science course or program requirements- ex. Course overload, to waive normal degree requirements, etc. Due to illness, bereavement, or other circumstances beyond your control that affect your academic performance A waiver used when required to withdraw from the University for insufficient grade points in first or second year or for too many failures on your record you may request a grade-point waiver of the Dean of your Faculty of Registration General questions relating to progression requirements, university regulations, appeal procedures, etc. To obtain academic advising from the Computer Science Department, please log in with your Western username and password below and open a support ticket. Our typical response time is 2-5 business days. To help us get to your ticket as soon as we can, please do not open more than one ticket at a time, and only reply back to an unanswered ticket with updates."
