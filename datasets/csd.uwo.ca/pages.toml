["https://csd.uwo.ca/news/2025/salomaa-tribute.html"]
title = "Arto Salomaa Tribute - Name - Western University"
description = "Mathematician and theoretical computer scientist Arto Salomaa passed away on January 26, 2025.   Arto served three years at Western in the late 1960s during which his first book, Theory of Automata, was published, and  was  made Doctor Honoris Causa of The University of Western Ontario  in 2013."
full_description = "Mathematician and theoretical computer scientist Arto Salomaa passed away on January 26, 2025. He played a key role in the establishment and early development of the European Association for Theoretical Computer Science (EATCS), and served as its President from 1979 to 1985. The following is an excerpt from the preface to a Special Issue of Theoretical Computer Science (track C) published in Arto Salomaa’s honor. Arto Salomaa was a world-class Finnish mathematician and theoretical computer scientist, renowned for his foundational contributions to automata theory, formal languages, and numerous other areas within theoretical computer science. His work profoundly shaped the mathematical foundations of the field and inspired generations of researchers. His scientific career was truly international. As a graduate student, he received a scholarship to Berkeley, where he attended J. Myhill’s automata theory seminar, which deeply influenced him. Upon returning to his home institution, the University of Turku, he established a research group in automata theory that became internationally renowned and continues to be active today, more than half a century later. In the late 1960s, Arto spent three years at what became his second academic home, the University of Western Ontario in Canada. During this time, his first book, Theory of Automata, was published, marking the beginning of his extraordinary career as an author of scientific books. Shortly thereafter, he published his iconic monograph Formal Languages, a highly influential work that cemented his status as a pioneering figure in the field. Over the years, Arto authored more than ten highly influential scientific monographs. Some were masterful explorations of their respective topics, while others introduced or promoted novel areas of study, including formal power series, L-systems, public-key cryptography, and DNA computing. In collaboration with Grzegorz Rozenberg, Arto co-authored a comprehensive treatment of formal languages. This monumental work, the Handbook of Formal Languages, spans three volumes and over 2,000 pages, serving as a definitive reference in the field."
year_published = 2025
clearnet = "https://csd.uwo.ca/news/2025/salomaa-tribute.html"
