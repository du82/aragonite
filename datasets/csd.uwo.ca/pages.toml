title = "CSD Future Students - Western University"
description = "Western University, in vibrant London, Ontario, delivers an academic and student experience second to none."
full_description = '''"The Department of Computer Science has been nothing but amazing. They seem to always be looking out for you when you need assistance whether it be academically or in personal matters." – Ross "I'm super grateful for all the opportunities that have come my way both inside and outside of the classroom." – Shatha "I also completed a 12-month internship as part of my degree, which gave me an opportunity to apply the skills I've learned in the program." – Ryan "Western’s game courses are fantastic. ... Some of my courses were even taught by local industry professionals who brought great first-hand knowledge of what it is like to work in the games industry. " – Karsten "Between inspiring professors, stimulating courses, and a comprehensive internship program, I was able to discover what I’m passionate about and where I would like to go from here." – Justine Western Computer Science offers you the opportunity to tailor your degree to your interests and to work with faculty who are involved in exciting research, all while attending one of the most beautiful campuses in Canada and enjoying Canada's best student experience. To help you with your decision, please check out the highlights below and the resources linked at left, such as the FAQ. Along with the typical Honors Specialization, Majors, and Minors in Computer Science, we also offer several concurrent degree programs that can be completed in 1 year less than taking each degree separately. Currently, the concurrent degrees we offer are: Another of our very popular programs is Computer Science Honours Specialization with a Minor in Game Design. Or you might consider our new Honors Specialization in Data Sciences combining Computer Science, Data Sciences and Statistical Science. You could also combine two of your interests by pursuing a Major in Computer Science with a Minor in Psychology or Business. Or, of course, you can just get a pure degree in Computer Science. Click here for more information on our programs. The choice is yours!'''
