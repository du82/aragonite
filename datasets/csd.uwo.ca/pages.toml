["https://csd.uwo.ca/help/printing.html"]
title = "Printing - Computer Science - Western University"
description = "Western University, in vibrant London, Ontario, delivers an academic and student experience second to none."
full_description = "Several printers are located throughout the Department for use by Computer Science faculty, staff, and students. Please see the Science Technology Services wiki for information on the available printers, along with setup guides for each printer. Printing is not free. We make use of the campus PaperCut system for print accounting. Users must have a positive PaperCut account balance to print in the Department of Computer Science. You can check your PaperCut account balance by logging in to https://papercut.uwo.ca with your Western credentials. Undergraduate students requiring print credit can add funds to their PaperCut account online via credit card, or by purchasing a pre-paid PaperCut card through Western Libraries. Please see the Western Libraries PaperCut documentation for more details. Any credit in your PaperCut account can be used to print to printers in the Department of Computer Science, Western Libraries, and all other printers on campus connected to the PaperCut system. The CS lab computers should already have the department printers configured, as should most department PCs. (ie: grad student offices) Department of Computer ScienceRoom 355, Middlesex College, Western University, London, Ontario, Canada, N6A 5B7Tel: 519-661-3566cs-dept@uwo.caPrivacy | Web Standards | Terms of Use | Accessibility"
