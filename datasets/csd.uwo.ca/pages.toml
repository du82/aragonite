full_description = "The most recent News and Announcements are listed below. For a listing of ALL previous announcements, please refer to the individual year archive pages. 02/28/2025 - Mathematician and theoretical computer scientist Arto Salomaa passed away on January 26, 2025. Arto served three years at Western in the late 1960s during which his first book, Theory of Automata, was published, and was made Doctor Honoris Causa of The University of Western Ontario in 2013. ... «Read More » 11/21/2024 - We are delighted to announce that Dr. Anwar Haque has been awarded this year’s Faculty of Science Award for Excellence in Graduate Student Mentoring. ... «Read More » 06/25/2024 - By leveraging generative AI technologies, Dr Anwar Haque and his team at Bamboo Innovations, helped the London Economic Development Corporation (LEDC) transform their job portal. ... «Read More » 05/03/2024 - We would like to congratulate Dr. Anwar Haque on being the recipient of this year’s Faculty of Science Distinguished Research Professor Award. ... «Read More » 03/14/2024 - We want to congratulate Dr. Angela Roberts on the finalization of her Canada Research Chair appointment. She is now a CRC in Data Analytics and Digital Health in Cognitive Aging and Dementia. ... «Read More » 11/08/2023 - The Departments of Philosophy and Computer Science at Western University invite applicatons for the Duncanson Chair in Ethics and Technology. ... «Read More » 10/05/2023 - Computer Science Faculty and Undergrad Student Meet and Greet, October 4, 2023. See the album! ... «Read More » 07/12/2023 - New faculty positions are now available in the department of Computer Science for 2023-24 ... «Read More » 03/24/2023 - We are excited to announce a brand new annual award this year to recognize teaching in Computer Science courses at Western. Submissions are due by April 11, 2023. ... «Read More » 11/10/2022 - New Tenure Track faculty positions are now available in the department of Computer Science for 2023 ... «Read More »"
