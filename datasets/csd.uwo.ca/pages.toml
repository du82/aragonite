title = "Faculty of Science Award for Excellence in Graduate Student Mentoring - Faculty of Science Award for Excellence in Graduate Student Mentoring - Western University"
description = "We are delighted to announce that Dr. Anwar Haque has been awarded this year’s Faculty of Science Award for Excellence in Graduate Student Mentoring."
full_description = "We are delighted to announce that Dr. Anwar Haque has been awarded this year’s Faculty of Science Award for Excellence in Graduate Student Mentoring. This distinguished honor recognizes individuals who demonstrate exemplary and sustained achievements in graduate student supervision and mentoring. Dr. Haque’s outstanding record in these areas has set a remarkable standard. As a role model and mentor, Dr. Haque has made significant contributions to the training and preparation of his graduate students, supporting their success in graduate studies at Western and their subsequent careers in academia and industry. Please join us in celebrating this well-deserved recognition of Dr. Haque’s exceptional contributions in graduate student supervision and mentoring. Congratulations, Dr. Haque, and best wishes for your continued success! Department of Computer ScienceRoom 355, Middlesex College, Western University, London, Ontario, Canada, N6A 5B7Tel: 519-661-3566cs-dept@uwo.caPrivacy | Web Standards | Terms of Use | Accessibility"
