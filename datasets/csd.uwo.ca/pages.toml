["http://www.csd.uwo.ca/people/memoriam"]
title = "In Memoriam - Computer Science - Western University"
full_description = '''Jim Kevin Mullin February 9. 1940 -July 21, 2024 Jim graduated from Carnegie Mellon University in 1963 with a PhD in Electrical Engineering. His distinguished career included employment with Bell Lab in New Jersey, World Health Organization in Geneva, and as a professor in the Computer Science Department of the University of Western Ontario until his retirement in 1998. Dynamic hashing and Bloom filters (memory storage and retrieval) were his main areas of research, and his writing, published in such journals as The Computer Journal, Information Systems, and IEEE Transactions on Software Engineering, is still widely cited today. Jim was known among his friends as an outdoorsman, hiker, world traveler, garage sale aficionado, appreciator of red wine, hike leader, bridge player, and wildflower photographer. He will be mourned by many. It is a very sad month for the Computer Science Department as we have lost another of our Professor Emeriti, Dr. Charles Dunham. Dr. Dunham was a member of the department since at least 1975. Even after he retired, he would still come to the department at least once a week to work on his research. He was a brilliant researcher. One of his primary fields of study was "Best Approximations". He also had a gentle, kind soul. Rest in peace Professor Dunham. We regret to announce the passing of Professor Emeritus Dr. Alexander Keewatin (Kee) Dewdney on March 09, 2024. It is with great sadness that we announce the passing of Dr. Alexander Keewatin (Kee) Dewdney. Professor Dewdney dedicated over a quarter of a century to serving Western's Computer Science Department. He joined Western just 5 years after the Computer Science Department was established, thus he was a key player in the direction of the department’s early curriculum and research focus. Not only was he a computer scientist but he was also a mathematician, an artist and a writer (he wrote two science fiction novels and more than 10 books on puzzles and possibilities, and he had a monthly article in Scientific American magazine in the late eighties). Upon retirement, he became a mathematical biologist with an interest in conservation. Dr. Dewdney was a member of the Computer Science Department from 1968 to 1996 and he was a professor emeritus from 1996 onward.'''
year_published = 2025
clearnet = "http://www.csd.uwo.ca/people/memoriam"
tags = ["kevin", "memoriam", "mullin"]
language = "en"
