["https://csd.uwo.ca/about/index.html"]
title = "About - Computer Science - Western University"
description = "Western University, in vibrant London, Ontario, delivers an academic and student experience second to none."
full_description = "Established in 1964, the Department of Computer Science at Western has developed strong academic and research programs to become one of the leading establishments in its field. Our faculty are the recipients of many teaching and research awards. Undergraduates can specialize in computer science and pick up a minor in gaming, software engineering, theoretical computer science and applications in computer science. Undergraduates in other disciplines can major or minor in computer science. There are many industrial and research opportunities for our undergraduate students. Our department is active in both the traditional research areas of computer science and emerging areas. The quality and diversity of the Department's research activities is internationally recognized. The Department is supported with research grants from a number of sources including the Natural Sciences and Engineering Council (NSERC), Canada Foundation for Innovation (CFI), Ontario Research Fund (ORF) and MITACS. Our researchers are involved in several collaborative initiatives both within the university and with external university and industrial partners. The Department has strong international and industrial links, with connections to other universities and companies in London, across North America and Europe. This provides opportunities for students to involve themselves in exchange programs, or engage in work with researchers in other countries. Department of Computer ScienceRoom 355, Middlesex College, Western University, London, Ontario, Canada, N6A 5B7Tel: 519-661-3566cs-dept@uwo.caPrivacy | Web Standards | Terms of Use | Accessibility"
year_published = 2025
clearnet = "https://csd.uwo.ca/about/index.html"
