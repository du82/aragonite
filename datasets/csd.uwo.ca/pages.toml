title = "Employment - Computer Science - Western University"
description = "Western University, in vibrant London, Ontario, delivers an academic and student experience second to none."
full_description = "The Department of Computer Science at Western University invites applications for a Teaching Scholar Position. Salary will be commensurate with qualifications and experience. The anticipated start date of the appointment is July 1, 2025, or as negotiated. This probationary appointment will be made at the rank of Assistant Professor with a workload of 60% teaching, 20% scholarship and 20% service. The teaching duties will include up to six one-semester courses per year. Consideration of applications will commence October 31, 2024 and will continue until the position is filled. The full posting is available here: https://www.uwo.ca/facultyrelations/careers/pdf/Advertisement---Teaching-Scholar-in-Computer-Science-_Computer-Science_FINAL.pdf The Department of Computer Science at Western University invites applications for two faculty positions in Computer Science. Salary and rank are commensurate with qualifications and experience. The anticipated start date of the appointment is July 1, 2025, or as negotiated Successful applicants will be appointed at the rank of Assistant Professor (Probationary Tenuretrack), Associate Professor (Probationary Tenure-track or Tenured), or Full Professor with Tenure depending on qualifications and experience. The Department is considering applicants from any research area in Computer Science, with a particular interest in the areas of Data Science; AI and its applications in areas such as Healthcare, Neuroscience, Natural Language Processing, Security; Gaming and Graphics and HumanComputer Interaction. Consideration of applications will commence October 31, 2024 and will continue until the position is filled. The full posting is available here: https://www.uwo.ca/facultyrelations/careers/pdf/Advertisment---OPEN-Rank-x-2-_Computer-Science_-FINAL.pdf Department of Computer ScienceRoom 355, Middlesex College, Western University, London, Ontario, Canada, N6A 5B7Tel: 519-661-3566cs-dept@uwo.caPrivacy | Web Standards | Terms of Use | Accessibility"
