full_description = "博士班甄試入學規定 2022-12-08 蘇誼嫻 １１４學年度博士班甄試入學規定 (本資料僅供參考，正式招生辦法以本校招生簡章內容刊載為準。) 身分別 一般生 在職生 招生名額 ８ ２ 報考資格附加規定 報名應繳交之資料 一、學位證書或在學證明 二、大學及碩士班歷年成績單 三、碩士論文 四、著作或其他有助於審查之資料 五、研究計畫 六、個人資料表 (請見其他規定第二點) 個人資料表系統連結： https://admission.csie.ntu.edu.tw/ 七、推薦函至少2封 (請見其他規定第三點) 【所有資料必須在報名時上傳繳交齊全，上傳截止日後不受理資料補件，應繳交資料不全者，將嚴重影響審查成績之評定。】 一、學位證書或在學證明 二、服務年資證明及在職證明 三、大學及碩士班歷年成績單 四、碩士論文 五、著作或其他有助於審查之資料 六、研究計畫 七、個人資料表 (請見其他規定第二點) 個人資料表系統連結： https://admission.csie.ntu.edu.tw/ 八、推薦函至少2封 (請見其他規定第三點) 【所有資料必須在報名時上傳繳交齊全，上傳截止日後不受理資料補件，應繳交資料不全者，將嚴重影響審查成績之評定。】 考試項目 審查 審查方式 就所繳資料加以審查 就所繳資料加以審查 占總成績比例 60% 60% 口試 參加資格 審查成績達80分者 審查成績達80分者 口試日期地點 符合口試名單於11月5 日(星期二)下午2時公布於本系網站，考生請自行查詢，不另通知。 口試時間：11月7日(星期四)、11月８日(星期五)。 地點：資訊系館 符合口試名單於11月5 日(星期二)下午2時公布於本系網站，考生請自行查詢，不另通知。 口試時間：11月7日(星期四)、11月８日(星期五)。 地點：資訊系館 占總成績比例 40% 40% 其他規定 一、 應屆畢業生可上傳碩士論文初稿。 二、報名時請至本系網站填寫「個人資料表」，填妥後須下載檔案並上傳至學校報名系統，為審查之重要參考。本系網站填寫之「個人資料表」，僅為本系審查用，報名請至研教組網頁。 三、 推薦函格式不限，但僅限推薦老師上傳。 四、全系招生名額內含逕修博士名額。 一、 應屆畢業生可上傳碩士論文初稿。 二、報名時請至本系網站填寫「個人資料表」，填妥後須下載檔案並上傳至學校報名系統，為審查之重要參考。本系網站填寫之「個人資料表」，僅為本系審查用，報名請至研教組網頁。 三、 推薦函格式不限，但僅限推薦老師上傳。 四、全系招生名額內含逕修博士名額。 放榜梯次 第2梯次放榜 第2梯次放榜 聯絡電話 (02)3366-4888轉253 (02)3366-4888轉253 考試日程： 113/9/13 教務處公告招生簡章 113/10/3-10/10 上學校招生網站登錄報名資料 113/10/3-10/10 繳交報名費 113/10/3-10/11 至本系個人資料表系統登錄 113/10/3-10/11 下午5:00前 將備審資料上傳完畢 113/11/5 於本系網站公布口試名單 113/11/7-11/8 口試 113/11/20 放榜 113/11/26-11/28 正、備取生網路報到"
