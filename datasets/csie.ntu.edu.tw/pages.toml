title = "◎資訊工程學系人工智慧碩士班 師資 修業規定等資訊 自110學年度起 | 國立臺灣大學資訊工程學系"
full_description = "◎資訊工程學系人工智慧碩士班 師資、修業規定等資訊(自110學年度起) 2018-10-02 蘇誼嫻 目前師資： 陳信希、傅立成、林智仁、林軒田、林守德、陳炳宇、郭大維、 逄愛君、施吉昇、陳縕儂、莊永裕、楊佳玲、洪士灝、吳家麟、歐陽彥正、 傅揪善、劉邦鋒、張瑞峰、林 風、李允中、張智星、周承復、曾宇鳳、 廖世偉、徐宏民、薛智文、鄭卜壬、李明穗、陳彥仰、林忠緯、李彥寰、 陳尚澤、陳祝嵩、鄭文皇、巫芳璟、李濬屹、柯宗瑋 教授 ※教授詳細研究領域請先參見：教師研究簡介(新生參考使用) 修業規定：(請依新生入學時公告之最新版本為準) 國立臺灣大學資訊工程學系人工智慧碩士班修業規定 一、指導教授規定： (一) 指導教授須為人工智慧碩士班師資。 (二) 在學第二學期結束前選定指導教授。 (三) 選定指導教授後，在學期間每學期繳交「指導教授同意書」。 (四) 變更指導教授需依照學校及本系相關規定辦理。 二、課程規定： (一) 必修科目： 1. 「碩士論文」，最後一學期必修。 2. 「專題研究」，畢業時至少通過二學期。 3. 「專題討論」，畢業時至少通過二學期。 4. 「人工智慧」與「機器學習」。 (二) 需修畢24學分(不包括碩士論文、專題研究及專題討論)，其中須選修三門人工智慧領域課程，另外三門課程以資訊學群課程為原則，若非資訊學群課程須經審核，以方便學生為研究需要進行跨領域學習。 (三) 入學前已修過得抵免之課程，依照學校相關規定及程序申請抵免。 (四) 需補修學科於入學時由系方審定。若為大學部課程則不計入畢業學分。 (五) 必修科目之「專題研究」，除符合下列之一者外，在學期間每學期均應修習。 1.在學第一學期得免修。 2.如有特殊情形，經系主任核可者得免修。 三、學位考試依照學校相關規定辦理，惟須以人工智慧為主題撰寫碩士論文並經審核通過。 四、本規定如有未盡事宜，悉依教育部及學校相關規定辦理。 五、本規定經系務會議通過後施行。 人工智慧領域課程20250206_R13_.pdf 國立臺灣大學資訊工程學系人工智慧碩士班修業規定_110學年度起入學生適用_.pdf"
