title = "大學部 113學年度新生及轉學生學分抵免申請作業 8 5 8 13中午 | 國立臺灣大學資訊工程學系"
full_description = "【大學部】113學年度新生及轉學生學分抵免申請作業(8/5~8/13中午) 2024-07-17 周承滿 學生事務 113學年度新生及轉學生學分抵免申請作業 一、申請期限： 第一梯次:2024/8/5上午09:00至2024/8/13中午12:00止。 第二梯次(僅限分科測驗學生申請):2024/8/19上午09:00至2024/8/22 中午 12:00止。 請於申請期限內上校方系統登錄申請資料，同時需於申請期限前將相關資料送至系辦審核。(時間及相關規定以學校網頁公告為準) 二、 申請方式： 1. 申請者請上網到校方教務系統登錄申請資料。 網址：http://curri.aca.ntu.edu.tw/aca_doc/waive.asp 2. 申請通識、國文、英(外)文、體育、服務學習等課程之抵免者，請依抵免申請系統之說明，將課程大綱及成績單，以PDF掃描後上傳至系統，並於8月13日前將成績單正本送達系辦公室。 3. 若申請科目中有資工系課程者，申請同學必須於8月13日前將下述文件以掛號郵寄或逕送至臺灣大學資工系205系辦公室 周承滿小姐收（請於信封袋上註明113學年度大學部新生及轉學生學分抵免申請 ）。 (1)「申請抵免審核用之成績單正本」(所有申請者皆需要繳交)。 (2)「資工系新生及轉學生抵免課程申請書」(有申請系必修或系選修者)。 (3)「申請抵免課程之課程大綱」(有申請系必修或系選修者)。 三、 期限內未到校方教務系統登錄資料、資料與申請書不合、相關資料不全及超過申請期限者，均視同審核未通過。 如尚有疑問，請洽cmchou@csie.ntu.edu.tw，或來電(02)33664888#250 周承滿小姐。 資工系新生及轉學生抵免課程申請書"
