title = "獎項申請 113學年度學生利他獎暨學生社會奉獻特別獎 團體獎項 申請開始 4 25前 | 國立臺灣大學資訊工程學系"
full_description = "【獎項申請】113學年度學生利他獎暨學生社會奉獻特別獎(團體獎項)申請開始(4/25前) 2025-02-25 周承滿 113學年度學生利他獎暨學生社會奉獻特別獎(團體獎項) (一)國立臺灣大學電資學院113學年度學生利他獎申請： 凡本院具正式學籍之在學學生，具有下列各項具體事蹟之一者，得經本院專任教師、系所主管、社團或學生自治團體推薦，或學生自行向本院提出申請，經本院評審委員會評議為本獎項之受獎人: 一、熱心公益活動，關懷社會、協助推動社會革新，表現優異。 二、發揮互助精神、友愛照護同學。 三、帶動良好風氣，足為青年典範。 四、其他優秀利他事蹟，足為同學楷模者。 (二)學生社會奉獻特別獎(團體獎)同步申請開始。 於4/25(五)前備妥相關資料之紙本及電子檔(須為可編輯之檔案或圖檔)送至系辦公室周承滿小姐處。 詳細規定及申請表可逕至電資學院網頁「學生資訊」項下參閱下載。 https://eecs.ntu.edu.tw/zh_tw/Studentinformation/stu3 學生社會奉獻獎(團體)推薦表、附表1及附表2，請至生活輔導組網頁「學生楷模」項下「下載專區」參閱下載。 https://advisory.ntu.edu.tw/CMS/DownloadCategory?guid=7510434f-5e0d-4346-9c23-603bd3bb7748&pageId=223"
