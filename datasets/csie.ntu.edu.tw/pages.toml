title = "獎學金 113年度國立臺灣大學電機資訊學院紀念鄧立登先生及鄧劉治妹女士清寒獎助學金 10 30前 | 國立臺灣大學資訊工程學系"
description = "113年度國立臺灣大學電機資訊學院紀念鄧立登先生及鄧劉治妹女士清寒獎助學金申請開始"
full_description = "【獎學金】113年度國立臺灣大學電機資訊學院紀念鄧立登先生及鄧劉治妹女士清寒獎助學金(10/30前) 2024-10-14 周承滿 113年度國立臺灣大學電機資訊學院紀念鄧立登先生及鄧劉治妹女士清寒獎助學金申請開始 一、宗旨：鄧立登先生及鄧劉治妹女士之家屬為回饋社會並鼓勵國立臺灣大學 學生努力向學 ，將來服務社會人群，特設置本獎學金。 二、申請日期：113年10月30日(三)止。 三、申請資格： （一）本院在學之學生。 （二）家境清寒或家中突遭重大變故者。 （三）前一學年學業等第積分（學業GPA）2.93（或百分制75分）以上，操行成績A以上者。 （四）受領本獎助學金者，得兼領其他獎學金。 四、申請文件：申請本獎助學金時，申請人需檢附下列文件各一份： （一）本獎學金專用申請書。 （二）全戶戶籍謄本。 （三）112年度全戶(包含父、母、本人及兄弟姊妹)之國稅局綜合所得稅各類所得資料清單或免繳稅證明。 (四) 鄉鎮區公所清寒證明或中低收入戶證明，或家中突遭重大變故之相關證明文件或說明。 （四）112學年本校成績單正本及操行成績證明書。 （五）500字以內之中文自傳。 (六) 導師或教師推薦函一封。 五、名額與金額：本獎助學金名額每學年十名，每名新台幣肆萬元整。 詳細申請辦法及申請表請見附件，並於截止日前送至系辦周承滿小姐處。 紀念鄧立登先生及鄧劉治妹女士獎助學金設置要點 紀念鄧立登先生及鄧劉治妹女士獎助學金申請書"
