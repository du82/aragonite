full_description = "【2025-02-21】 許炳堅講座教授 / 長庚大學 / 跨時代的工程與智慧 2025-02-14 黃雅群(職務代理) Date: 2025/02/21 2:20pm-3:30pm Location: 德田館 R103 Speaker: 許炳堅教授, 長庚大學講座教授 Hosted by: 陳祝嵩主任 Abstract: 三部曲 第一部曲：(本演講) 處理未知解、不知解 離心力(向AI沿曲線、螺旋線靠攏)，Entropy (熵) à 最大亂度，Value Up 借力使力、舉一反三， 年輕人競爭力：直線、曲線、螺旋線 第二部曲：務實，處理已知解 向心力與萬有引力(向AI沿直線靠攏)，最低能量，Cost Down 第三部曲：需要重新審視「人文、社會科學」的新時代內涵 Biography: 許炳堅講座教授 & IEEE Fellow 台大電機系學士、美國加州柏克萊大學電機資訊博士 IEEE 期刊總編輯、斐陶斐榮譽學會「傑出成就獎」"
