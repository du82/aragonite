title = "研究所 113學年度第1學期 學碩士班學生逕行修讀博士學位申請 公告 10 3 10 11 | 國立臺灣大學資訊工程學系"
full_description = "【研究所】113學年度第1學期 學碩士班學生逕行修讀博士學位申請 公告(10/3-10/11) 2024-09-30 蘇誼嫻 ※申請資格： 依本校學生逕行修讀博士學位辦法第三條規定辦理。 (一)修業期間學業成績總平均排名在該系、所、學位學程全班（組）人數前三分之一以內。各學系、所、學位學程得以必修科目學業成績總平均作為排名之依據，亦得為更嚴格之規定。 (二)因其他特殊情形，經擬逕修之學系、所、學位學程評定為成績優異者。 ※申請時間：10月3日至10月11日止 ※申請辦法：備妥規定資料至R205系辦公室蘇小姐處提交申請 ※報名審查資料： 逕行修讀博士學位申請書一份 在學證明 大學及碩士班歷年成績單(含名次證明) 研究計畫 著作或其他有助於審查之資料 助理教授以上二人推薦函 ※符合資格者應配合本系安排口試。符合口試名單於11月5日(星期二) 下午2時公布於本系網站，考生請自行查詢，不另通知。口試時間：11月7日(星期四)、11月8日(星期五)。 ※相關獎助金： 114學年度國家科學及技術委員會(國科會)設有博士生研究獎學金，「國科會甄選」全國名額計400名，將於113年10月在國科會網站受理申請，請務必留意相關獎學金訊息。 國立臺灣大學學生逕行修讀博士學位辦法.pdf 113-2國立臺灣大學系統學生逕行修讀博士學位申請書.docx"
