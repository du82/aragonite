電子講座」教授。 2015年3月 吳家麟教授榮獲科技部103年度「傑出特約研究員獎」。 郭大維教授榮獲科技部103年度「傑出研究獎」。 郭大維教授榮膺 ACM Transactions on Cyber-Physical Systems 創刊主編。 2015年4月 曾宇鳳教授榮獲 2015 IBM Faculty Award。 2015年6月 郭大維教授榮膺 Vice Chair of ACM SIGAPP。 傅立成教授榮獲 ACA Wook Hyun Kwon Education Prize。 2015年8月 教師Tony Tan到任。 2015年9月 郭大維教授榮獲東元科技文教基金會第22屆東元獎。 林智仁教授榮獲東元科技文教基金會第22屆東元獎。 李琳山教授榮獲2015年第七屆總統科學獎。 傅立成教授榮獲第59屆教育部學術獎。 2015年10月 林守德教授榮獲國科會104年度吳大猷先生紀念獎。 曾宇鳳教授榮獲財團法人安成醫藥基金會「舊藥新用創新獎」。 2015年11月 本院推薦之校友王文漢副總裁（工商類），獲選為本校2015年傑出校友。 逄愛君教授榮獲中國電機工程學會104年「傑出電機工程教授獎」。 2015年12月 郭大維教授榮膺2015 ACM Fellow。 林智仁教授榮膺2015 ACM Fellow。 2016年1月 張瑞峰教授研究團隊與台大醫院、國儀中心合作的研發成果「靛青綠手術區域即時目視導引系統」榮獲「第十二屆國家新創獎」。 2016年3月 蔡欣穆副教授榮獲2015中華民國資訊學會「李國鼎青年研究獎」。 林風教授榮獲科技部104年度「傑出研究獎」。 2016年4月 林智仁教授榮膺「和碩講座教授」。 2016年5月 林智仁教授榮獲2016潘文淵基金會「研究傑出獎」。 吳家麟教授榮膺徐有庠先生紀念基金會 第十四屆「有庠科技講座」。 傅楸善教授、鄭卜壬副教授指導學生黃凱祺、王瀚中、江誠敏同學榮獲 2016 ACM ICPC World Finals 決賽第14名。 林軒田副教授榮獲 105年電機資訊學院「學術貢獻獎」。 2016年7月 李琳山教授榮膺「中央研究院第31屆院士」。 傅立成教授榮膺「IFAC Fellow」 & Vice President, IEEE Control Systems Society (CSS)。 2016年8月 郭大維教授榮任本校「學術副校長」。 教師陳縕儂到"
