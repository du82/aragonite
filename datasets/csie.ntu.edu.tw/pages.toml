full_description = "[活動] 2025 NSF HDR 黑客松競賽說明會 2024-12-10 宋欣薏 NSF HDR 黑客松台灣說明會 歡迎參與國際級AI挑戰賽，總獎金高達新台幣20萬元！ ## 活動概要 **NSF HDR 黑客松（NSF HDR ML Challenge）邀請參賽者挑戰創新AI方法，專注於以下主題： **活動主題：ML 機器學習及異常檢測 (Anomaly Detection)** 參賽者將運用機器學習技術，設計新穎的異常檢測方法，以偵測公開科學數據中的異常事件。 ## 豐厚獎勵 - 現金獎金：新台幣10萬元 - 亞馬遜AWS Cloud Credit for Research雲端計算抵用金：價值新台幣10萬元 - AMD贊助GPU特別獎 - 評審團優勝獎：AAAI-25 workshop旅費贊助 ## 說明會資訊 - 日期：2024年12月23日 - 時間：11:00 - 14:00 - 形式：遠端及實體同步 - 實體地點：台灣大學、清華大學、陽明交通大學、中央大學 - 台灣活動網站及線上報名：https://indico.cern.ch/event/twhdr/ - 海報：https://indico.cern.ch/event/1485146/attachments/2982413/5252454/HDR%20ML%20chalenge%20Poster%20TW.pdf ## 參賽資格 歡迎教授及學生踴躍組隊參加。參賽隊伍可跨系、跨校組成，為您的團隊帶來多元視角與專業知識。 ## 更多資訊 欲了解更多關於NSF HDR黑客松挑戰的詳情，請訪問全球官方網站：www.nsfhdr.org/mlchallenge 立即報名參加說明會，把握這個參與國際AI挑戰的絕佳機會！組建您的夢幻團隊，展現創新實力，一同探索科學數據中的未知領域！"
