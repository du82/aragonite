["https://csie.ntu.edu.tw/zh_tw/Announcements/Announcement10/-%E5%BE%B5%E6%89%8D-Explore-Career-Opportunities-with-WorldQuant-Taiwan-%0D%0A-3-8-NTU-Job-Fair-Booth-304-305-20519136"]
title = """
徵才 Explore Career Opportunities with WorldQuant Taiwan 
 3 8 NTU Job Fair Booth 304 305 | 國立臺灣大學資訊工程學系"""
full_description = "【徵才】Explore Career Opportunities with WorldQuant Taiwan! (3/8 NTU Job Fair -Booth #304.305) 2025-02-24 宋欣薏 你是否熱衷於解決複雜問題並喜歡與頂尖專家共事？ 我們正在尋找來自電機、資工、物理、數學或財務工程相關領域的人才! 誠摯邀請您參加VISION 2025臺大校園徵才活動(攤位編號: 304.305)，您將有機會與我們資深研究員進行交流，完成指定任務即可獲得禮物。期待與您見面分享更多關於公司的機會和職缺資訊。 #特別活動 我們將在3/10(一) 19:10~20:10舉辦【VISION 2025 臺大校園徵才】公司說明會（前往報名），成功報名且出席者，活動結束後可領取一份Le Ruban點心盒！參與現場Q&A將有機會獲得精美好禮。 工作機會 1. 計量金融研究員Quantitative Researcher 2. 資料科學家Data Scientist 3. 計量金融研究實習生 Quantitative Research Intern 實習機會開放給2025至2026年畢業的學生或已畢業生。 實習期間： • 學期實習：2025年3月至6月 • 暑期實習：2025年6月至7月 或 2025年7月至8月 資格符合且有意願申請者，請前往Jobs at WorldQuant投遞申請 申請者之金融市場相關經驗非必要條件，但須對學習全球金融市場有強烈的興趣。 關於我們 WorldQuant是家全球量化資產管理公司，成立於2007年，目前擁有超過1000名員工，分布在27個辦公室。我們遵循著有無限洞見可以發掘的原則，試圖更快速地走向未來。WorldQuant 針對國際市場上不同的資產類別建制及應用系統性的金融策略。 加入美商世坤，您將有機會與行業內極為優秀的專家和研究人員合作，不斷提升自己的專業知識和技能。我們重視員工的貢獻和價值，提供具有競爭力的報酬制度。如果您展現出優秀的表現和潛力，將會有晉升為副總裁的機會。我們期待您的加入，一同追求成長和實現目標！ WorldQuant Taiwan Team"
