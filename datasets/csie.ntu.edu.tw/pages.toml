full_description = "【徵才】ASUS 2025校園徵才說明會 & 博覽會 2025-02-24 白師瑜 【ASUS 2025校園徵才】說明會 & 博覽會 #2025華碩校園徵才 #火熱開跑 AI x 永續，打造創新未來 科技未來，正靠 AI 改寫 華碩秉持「Ubiquitous AI. Incredible Possibilities」發展願景 推出一系列尖端AI技術產品，邁向全方位AI企業 同時也持續提升能源效率，促進永續發展 而「你」將成為這段旅程中的關鍵篇章 邀請各位立即行動，一同加入華碩吧 招募資訊： ▸ 徵才對象：2025年應屆畢業學/碩/博士生，畢業兩年內新鮮人 ▸ 徵才期間：即日起～2025/06 活動介紹： ▮#線上 ▸職涯角色測驗：解鎖職場定位，找到專屬於你的華碩機會 職缺 & 測驗傳送門：https://ehr.asus.com/campus_recruit/ ▮#實體 ▸校園博覽會：臺大／陽明交大／成大／清大／政大／臺科大 ▸校園說明會：陽明交大／臺大／北科大／政大 ▮#GTP_國際人才計畫 ▸集體面談：開放「臺大」與「政大」專場，國際舞台等你挑戰 #加入華碩_共創AI新未來 #Incredible_future"
