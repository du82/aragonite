title = "訓練班 | 國立臺灣大學資訊工程學系"
description = """
【本班簡介】
依據﹕大學推廣教育實施辦法及大學辦理推廣教育計畫審查要點。
目的﹕為響應政府發展資訊工業政策，培養資訊科學所需之專門人才。

本系依據國立臺灣大學推廣教育實施辦法，於1983年開辦資訊系統訓練班，提供高質量的資訊科技教育(非學分班)與學習環境，讓校內外同學與社會大眾學習必要的技能和知識，幫助建立獨立思考和解決問題的能力，至今已培育出數萬名資訊人才！
我們的課程包括了多個主"""
full_description = "瀏覽人次: 15259 h3.page-module-title br { display: none; } 訓練班 【本班簡介】 依據﹕大學推廣教育實施辦法及大學辦理推廣教育計畫審查要點。 目的﹕為響應政府發展資訊工業政策，培養資訊科學所需之專門人才。 本系依據國立臺灣大學推廣教育實施辦法，於1983年開辦資訊系統訓練班，提供高質量的資訊科技教育(非學分班)與學習環境，讓校內外同學與社會大眾學習必要的技能和知識，幫助建立獨立思考和解決問題的能力，至今已培育出數萬名資訊人才！ 我們的課程包括了多個主題，如程式設計、網頁設計、資料庫管理、作業系統、跨學科與應用課程等，學員可以根據自己的興趣和需求進行選擇。 【招生對象】 全國對學習電腦資訊課程有興趣之社會大眾，不限年紀、學歷、性別，只要會基本電腦操作者。 【資訊系統訓練班教學特色】 1. 師資堅強：教師擁有數千小時教學經驗和專業知識，提供最好的教學服務。 2. 實體課程：在本校校總區資訊工程學系教室上課，並搭配智慧錄播系統。 3. 線上課程：使用本校專屬NTU COOL課程平台註冊，進行非同步遠距教學；齊頭式開課日促進學習效果；由教師本人批改作業及回覆問題。 4. 結業證書：根據學員上課表現與作業予以驗收學習成果，合格者授予本校非學分推廣教育證書。 （請點選更多的課程詳細介紹與報名方式：資訊系統訓練班）"
