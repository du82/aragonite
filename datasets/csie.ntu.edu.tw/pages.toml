title = "Hsu-Chun Hsiao | NTU"
full_description = "About I'm an Associate Professor in the Department of Computer Science and Information Engineering and Graduate Institute of Networking and Multimedia at National Taiwan University. I hold a joint appointment in the Center for Information Technology Innovation at Academia Sinica. Since September 2018, I also serve as a Section Chief in the Information Technology Office, National Taiwan University Hospital. I completed my Ph.D. (2014) in Electrical and Computer Engineering at Carnegie Mellon University. I received my M.S. (2008) and B.S. (2006) degrees in Electrical Engineering at National Taiwan University. Letters of Recommendation Policy: Please read this before requesting for letters of recommendation. NSLab Interested in joining Network Security Lab (NSLab)? We are interested in the field of computer and network security, with focuses on DDoS defense, automated vulnerability discovery, and IoT security lately. Some of our members are also affiliated with the Balsn CTF team. We are actively recruiting highly motivated students and researchers! Email me or drop by R307 to chat with awesome nslab members. Selected Honors Mr. Lu Feng-Zhang Memorial Award 管理科學學會呂鳳章先生紀念獎章 (2023) ACNS Best Student Paper Award (2023) Privacy Enhancing Technologies Symposium (PETS) Best Artifact Award (2022) IEEE Symposium on Security and Privacy (S&P) Test-of-Time Award (2022) Ta-You Wu Memorial Award 國科會吳大猷先生紀念獎 (2021) Delta Research Excellence Award 台達傑出研究獎 (2020) Ren Min Outstanding Young Chair Professorship 仁民傑出青年學者講座 (2020) CyberW Early Career Award Honorable Mention by ACM Workshop for Women in Cybersecurity Research (2020) K. T. Li Young Researcher Award by IICM and ACM Taipei/Taiwan Chapter 資訊學會李國鼎青年研究獎 (2018) Young Scholar Fellowship by the Ministry of Science and Technology of Taiwan (2018-2023) Research Abroad Grant by Taiwan Information Security Center (2018) NTU Outstanding Teaching Award 教學優良獎 (2017, 2018, 2019, 2020, 2022, 2023) CCISA Master Thesis Supervision Award (2017, 2018, 2020)"
