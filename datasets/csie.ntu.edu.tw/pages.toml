full_description = "【活動】2/24 Jane Street@德田館R101 2025-02-17 白師瑜 Puzzle Corner Monday, 24 February// Department of Mathematics More info on attachment or refer to our facebook post. Interested in learning more about Jane Street? You are encouraged to stop by, chat with Streeters, and solve some puzzles! 活動將提供免費午餐以及精美禮物。 Sign-up here if you plan to stop by. Estimathon® Monday, 24 February// Department of Computer Science and Information Engineering More info on attachment or refer to our facebook post. 報名參加我們的Esitmathon。活動將提供免費晚餐以及精美禮物。估算馬拉松獲勝隊伍將獲得神秘獎品一份！ Sign-up here by Friday, 21 February. ---------------------------------------------------------------------------------------------------------------- Jane Street is a quantitative trading firm with offices worldwide. We hire smart, humble people who love solving problems, building systems, and testing theories. You’ll learn something new every day in our office—whether it’s connecting with a colleague to share perspectives, or participating in a talk, class, or game night. Our people drive our success and we never stop improving. Want to learn more? Check out the latest happenings at Jane Street or our Get to Know Us video series. Our 2025 Summer Internship is currently open and accepting applications! Take a look at our open internship opportunities. Our application process is very quick and simple - it just requires a CV/resume upload and a few personal details. Jane_Street_Puzzle_Corner_at_NTU.pdf Estimathon_at_National_Taiwan_University.pdf"
