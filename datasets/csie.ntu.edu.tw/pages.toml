title = "重要紀事 | 國立臺灣大學資訊工程學系"
description = """
1977年

資訊工程學系成立，英文系名為Department of Information Engineering，招收40位新生。

李學養教授擔任第一任系主任。

借用工學院208室作為系辦公室。

共有教師三人，包括李學養教授為創系系主任，吳建平教授、許清琦教授。

教授們仍在原電機系研究室上班。



1978年

添購第一部設備－MCZ-20"""
full_description = "瀏覽人次: 14362 h3.page-module-title br { display: none; } 重要紀事 /* style for brief_honor series */ .historylist { border:1px solid #999;margin-bottom:14px;padding-left:5px;padding-bottom:10px; } .historylist .hlist_year { border:1px solid #543;background:#ffd;display:block;position:relative; width:100px;text-align:center;margin-left:10px;top:-10px; } .historylist div { margin-left:50px;display:list-item; } 1977年 資訊工程學系成立，英文系名為Department of Information Engineering，招收40位新生。 李學養教授擔任第一任系主任。 借用工學院208室作為系辦公室。 共有教師三人，包括李學養教授為創系系主任，吳建平教授、許清琦教授。 教授們仍在原電機系研究室上班。 1978年 添購第一部設備－MCZ-20 8位元 Z80微算機。 設立電子電路實驗室。 江德耀教授、劉睦雄副教授到任。 1979年 設立邏輯實驗室。 與計算機中心共同籌設資訊館。 教師劉乃誠、劉寶鈞、許渝生到任。 向慶齡中心借得空間作為教師研究室。 繼續添購Z-80微算機。 1980年 李學養教授出國講學，于惠中教授代理系主任一年。 教師鄭國揚、林一鵬、洪永常、湯耀中到任。 開始推動未來教學研究主機設備之添購計畫，並決定添購 Prime 750 為未來之主機。 1981年 第一屆大學部學生畢業，共47位。 資訊工程學研究所成立，招收碩士班研究生10位。 教師林逢慶、陳秋發、謝鎮源、顏文明到任。 Prime 750 運到，暫借志鴻館裝機運轉，另添購Zilog-8000系統及PDP11/34 小型電腦。 研究室、實驗室、系辦公室等散處於工學院各館舍中。 1982年 李琳山教授代理系主任一年。 許舜欽講師到任 資訊館落成，設邏輯電路實驗室、微算機實驗室、系統實驗室、軟體實驗室、小型計算機實驗室。 1983年 李琳山教授擔任第二任系主任。 教師李秀惠、陳信希到任。 第一屆碩士班研究生畢業，共4位。 碩士班重新規畫，分甲、乙、丙三組招生。 開設資訊系統設計與應用訓練班。 博士班籌設案校務會議通過報部。 大學部必修課程內容初步調整。 添購 VAX 11/750 小型電腦為研究用主機及PDP11/44 小型電腦。 開始接受教育部委託辦理「重點科技暑期研究班」，邀請海外學人回國講師。第一年主題為「資料庫及電腦網路」。 1984年 李琳山教授榮獲十大傑出青年。 教師蕭家全到任。 博士班成立，招收博士班研究生6位。 許清琦副教授前往史丹福大學研究進修一年。 英文系名改：Department of Computer Science and Information Engineering。 開始作大學部必修課程之全面整體長期規畫。 受教育部委託辦理「重點科技暑期研究班」，主題為超大型積體電路。 1985年 教師龐台銘、陳俊良、傅立明、蘇元良、李肇林到任。 李琳山教授榮獲行政院國家科學委員會七十四年度傑出研究獎。 成立「人工智慧實驗室」，擬定「人工智慧群體研究五年計畫」。 大量引進個人電腦，添購 Micro VAX 11。 許舜欽講師率領學生參加國際電腦圍棋大學囊括冠亞軍，轟動國內資訊界。 受教育部委託辦理「重點科技暑期研究班」，主題為「人工智慧」。 系學會辦理資訊週展覽，盛況空前。 1986年 執行國科會「適合中文環境的人工智慧及其應用之整合式發展」十項群體研究計畫，全面推動人工智慧領域之研究。 各型設備全面翻新，添購 VAX 8530 為新的主機以及 Symbolic、Sun 等工作站，並大量添購PC/AT等個人電腦。 惠普科技公司捐贈人工智慧工作站三套，捐贈儀式招開記者會，同時舉辦人工智慧研究特展。 系學會榮獲台大傅鐘獎「最佳系學會─特優獎及最佳學術性活動獎」。 受教育部委託辦理「重點科技暑期研究班」，主題為「多重處理機」。 1987年 林逢慶教授擔任第三任系主任。 教師陳健輝、吳家麟、傅立成、賴飛羆、陳文進、游張松到任。 李琳山教授榮獲行政院國家科學委員會七十六年度傑出研究獎。 鎮系之寶 Prime 750 引退。 大學部必修課程全面修定完成，自本學年度起實施。 擬定「平行計算群體研究三年計畫」，全面推動高速計算之研究。 設立「專題研究實驗室」。 許舜欽副教授率領學生再度囊括19路國際電腦圍棋賽冠亞軍。 受教育部委託辦理「重點科技暑期研究辦」，主題為「高等計算專題」。 熱烈慶祝創系十週年，出版系刊特刊，系學會主辦「資訊週」活動；舉行系友聯誼回顧茶會。 主辦全國計算機會議及十週年特展。 1988年4月 李登輝總統到本系視察。 1988年5月 林一鵬教授及許清琦教授入選教學特優教師。 1988年6月 成立系務規畫委員會。 李琳山教授獲工學院教學獎。 1988年7月 第一屆博士班學生沈肇基畢業。 1988年8月 教師劉長遠、黃肇雄到任。 與中研院合辦電腦圖學演算法及有關組合數學之學術會議。 1988年11月 系務會議通過暫緩大學部增班申請。 1989年3月 吳家麟教授榮獲「青年獎章」，並獲總統召見並代表致詞。 1989年4月 許舜欽副教授東京工業大學研究進修一年。 1989年5月 通過本系新系主任推薦辦法。 吳家麟教授、許舜欽副教授及陳文進教授入選教學特優教師。 陳文進教授或工學院教學獎。 1989年8月 歐陽彥正客座副教授到任。 林逢慶教授赴美考察，訪問六所大學，考察其平行計算方面之教學研究狀況。 買進NCUBE 置於終端機室。 1989年10月 新系館新建工程經費，經立法院通過為五仟六佰萬元，可蓋1600坪左右。 1989年11月 李琳山教授榮獲行政院國家科學委員會七十八年度傑出研究獎。 通過課程委員會辦法，由理論、硬體、軟體、應用四個領域，各選出兩個代表，連同系主任共九人組成。 1990年3月 許清琦教授榮獲中華民國電腦學會優良論文獎。 中正紀念堂前學生靜坐活動，本系有部分同學參與，也有幾位老師及系主任前往關心。 1990年4月 許清琦教授及林逢慶教授入選教學套優教師。 1990年8月 林一鵬教授擔任第四任系主任。 教師高成炎到任。 1990年11月 林逢慶教授榮獲行政院國家科學委員會七十九年度傑出研究獎。 通過本系大學部學生甄試直升研究所碩士班辦法。 1991年2月 教師莊志洋到任。 1991年3月 設立多媒體實驗室。 1991年4月 規劃本系四個研究方向：高性能計算機系統、電腦通訊及多媒體系統、人工智慧與中文資訊系統、平行程式語言與軟體發展環境。 通過本系教師升等辦法及聘任辦法。 修正本系大學部課程，大一取消工程圖學，增加計算機程式設計上下各兩學分。 1991年5月 黃肇雄教授及許舜欽副教授入選教學特優教師。 1991年8月 李琳山教授榮獲中國電機工程師學會八十年度電機工程獎章。 教師歐陽明、許永真到任。 設置系統實驗室。 1991年11月 李琳山教授榮獲行政院國家科學委員會八十年度傑出研究獎。 提出計算機系統與應用研究中心，並由林一鵬主任及許欽琦、陳文進、賴飛羆、許永真教授組成委員會負責。 1992年5月 通過大學部成績優異學生甄試直升本系研究所碩士班辦法。 黃肇雄教授及許舜欽副教授入選教學特優教師。 許舜欽副教授獲頒工學院教學獎。 1992年12月 李琳山教授榮獲 1993 國際電機電子工程師學會會士。 修訂本所博士班選課、考試及畢業有關規定。 通過本系教師聘任評審委員會設置辦法。 主辦平行及分散式統國際會議。 1993年2月 教師傅楸善到任。 1993年3月 修訂本系大學部學生必修科目與學分。 參與83學年度推薦甄試入學名額五名。 1993年4月 通過系館空間規劃調配辦法。 1993年5月 陳文進教授及傅立成教授入選教學特優教師。 1993年6月 修訂新系主任推薦辦法。 1993年8月 搬遷到新系館。 教師項潔到任。 1993年10月 陳俊良副教授前往美國IBM Waston實驗室研究進修9個月。 1993年11月 吳家麟教授獲頒經濟部「傑出資訊人才獎」。 李琳山教授榮獲行政院國家科學委員會八十二年度傑出研究獎。 陳健輝教授榮獲行政院國家科學委員會八十二年度傑出研究獎。 1994年2月 林逢慶教授借調台北市政府擔任建設局局長。 1994年4月 陳健輝教授、傅立成教授榮獲國科會傑出研究獎。 1994年5月 通過本系各委員會組織通則、系務規劃、課程空間規劃、教師聘任評審等委員會設置辦法、及新系主任推薦辦法。 陳文進教授及黃肇雄教授入選教學特優教師。 1994年8月 成立國科會電腦系統研究發展重點中心，由林一鵬教授出任中心主任。 1994年10月 多媒體與通訊實驗室獲頒龍騰特別獎。 1994年11月 傅立成教授榮獲行政院國家科學委員會八十三年度傑出研究獎。 1995年2月 劉乃誠教授退休。 教師呂育道到任。 1995年8月 機器人實驗室從工綜館遷回新館地下室。 設置金融計算實驗室於工綜館。 1995年11月 李琳山教授榮獲行政院國家科學委員會八十四年度傑出研究獎。 陳健輝教授榮獲行政院國家科學委員會八十四年度傑出研究獎。 通過資訊學院簡要計劃書。 本系六名同學組隊參加遠東區程式設計比賽獲第一、二名。 主辦電腦圖學研討會。 1996年1月 許舜欽教授赴美國北卡大學研究進修半年。 1996年8月 許清琦教授擔任第五任系主任。 林一鵬教授兼任本校電子計算機中心主任。 吳家麟教授借調國立暨南大學擔任資訊工程學系系主任。 陳文進教授借調國立暨南大學擔任資訊管理學研究所所長。 項潔教授接任國科會電腦系統研究發展重點中心主任。 工學院成立計算機系統研究中心，項潔教授出任中心主任。 高成炎教授赴美國哈佛大學研究進修半年。 與清大、交大聯合舉辦太平洋區電腦圖學國際會議。 1996年10月 陳健輝教授榮獲國科會傑出研究獎。 1996年12月 項潔教授榮獲教育部大專教師與產學合作研發績效卓著獎。 吳家麟教授當選首屆「龍騰十傑」。 1997年2月 陳信希教授赴美國CMU大學進修三個月。 傅立成教授代理慶齡工業中心主任。 1997年3月 榮獲世界 ACM 程式設計比賽第四名。 1997年9月 設立本系安全衛生委員會。 1997年11月 李琳山教授榮獲行政院國家科學委員會八十六年度傑出研究獎。 陳健輝教授榮獲行政院國家科學委員會八十六年度傑出研究獎。 傅立成教授榮獲行政院國家科學委員會八十六年度傑出研究獎。 項潔教授榮獲行政院國家科學委員會八十六年度傑出研究獎。 1997年12月 設置本系教師評審委員會，並修訂教師聘任委員會設置辦法。 吳家麟教授榮獲教育部大專教師與產學合作研發績效卓著獎。 1998年5月 通過大學部必修課程變更案。 1998年6月 決議加入規劃中之電機資訊學院。 1998年8月 項潔教授借調國立暨南大學擔任科技學院院長。 教師林智仁到任。 開設服務課程。 1998年10月 通過電機資訊學院規劃案。 規劃系館二期工程。 1998年11月 吳家麟教授榮獲行政院國家科學委員會八十七年度傑出研究獎。 1999年1月 通過與師大資訊教育系合作選課協議。 1999年4月 榮獲世界ACM程式設計比賽第10名。 1999年5月 5月26 日完成系評鑑。 成立 Intel 實驗室。 1999年6月 取消空間規劃委員會，併入系務規劃委員會。 1999年9月 碩士在職進修專班開班招收第一屆學生。 提出大學部增班申請書。 1999年10月 傅立成教授榮獲十大傑出青年。 暨南大學資訊相關單位及系所，借用本系部分空間，並租借電腦教室。 教育部通過本系大學部增班案。 1999年11月 陳健輝教授榮獲行政院國家科學委員會八十八年度傑出研究獎。 傅立成教授榮獲行政院國家科學委員會八十八年度傑出研究獎。 項潔教授榮獲行政院國家科學委員會八十八年度傑出研究獎。 2000年3月 吳家麟教授、陳文進教授、黃肇雄教授、歐陽明教授參與教育部第一期卓越計畫─子計晝二「建構於IP之無線多媒體技術及應用」(2000.4~2004.3為期四年)。 2000年5月 修訂本系大學部必修課程。 2000年6月 資訊系劉秉周、楊卓翰、馬萬鈞、趙仁孝、林明俊及顏先駿等六名同學，榮獲第一屆IEEE電腦學會國際電腦程式設計競賽(IEEE CSIDC)全球第二名。 2000年7月 李琳山教授榮獲行政院國家科學委員會八十九年度特約研究員。 2000年8月 校務會議通過88學年度起本系加入電機資訊學院。 歐陽明教授擔任第六任系主任。 陳信希教授擔任第一任副系主任。 陳健輝教授借調國立暨南大學擔任資訊工程學系教授兼系主任。 教育部通過本系自88學年度起大學部增收一班40人。 本系自88學年度起招收「碩士學位在職進修專班」。 2000年10月 開始提供洗手間衛生紙。 2000年11月 吳家麟教授榮獲行政院國家科學委員會八十九年度傑出研究獎。 修訂本系相關委員會設置辦法及作業要點，並增訂資訊學群設置辦法，及升學推薦作業細則。 2001年4月 郭大維教授榮獲中研院年輕學者研究著作獎。 2001年5月 2000 Turing Award 得主姚期智院士5月11日 蒞臨演講。 2001年6月 資訊系同學參加第二屆IEEE電腦學會國際電腦程式設計競賽(IEEE CSIDC)榮獲第五名。 傅立成教授榮獲行政院國家科學委員會九十年度特約研究員。 陳健輝教授榮獲行政院國家科學委員會九十年度特約研究員。 2001年9月 林逢慶教授、吳家麟教授與陳健輝教授獲台灣經典引文獎。 許舜欽教授獲2001李國鼎穿石獎。 本系黃肇雄教授依「國立台灣大學專任教師任職或兼職營利事業機構或團體收取回饋金及分配辦法」，捐贈台大訊連公司等值股票約現值捌佰萬元之回饋金。 2001年12月 呂育道教授所著英文專業教科書 Financial Engineering & Computation 獲英國劍橋大學出版。 2002年2月 許清琦教授91.2退休，改聘為本系兼任教授。 2002年3月