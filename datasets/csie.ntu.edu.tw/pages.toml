full_description = "【研究所】113學年度第1學期 資訊工程研究所轉所申請收件 – 12/16~12/20 2024-12-05 蘇誼嫻 n 申請資格：研究生修業一學年以上，經原系所主任(所長)同意得申請。 n 申請規定： 一、申請時間：每學期期末考週收件，收件截止日起二週內公告結果。 二、應繳資料： （一）本校轉所申請書：送件時應具原系所主任(所長)同意簽章。 （二）大學歷年成績單及名次證明書。 （三）研究所歷年成績單。 （四）就學計畫。 （五）其他有利審查之資料。(如推薦函) （六）學生報告書。(原系所指導教授同意簽名) 意者請於12/16~12/20下午5:00前送件。請將應繳資料轉為電子檔案，以電子郵件寄送至 yihsien@csie.ntu.edu.tw。來信主旨：(學號)(姓名)轉所申請。"
