full_description = "【獎學金】 富邦慈善基金會-2024潛力之星獎學金計畫 已開放申請至9/30(一)截止 2024-09-23 宋欣薏 富邦慈善基金會｢2024潛力之星獎學金｣計畫已開放申請至9/30(一)截止，歡迎同學們踴躍申請! 一、申請條件： (一)必要項 具中華民國國籍。 為國內教育部立案之大學及研究所在校生(包含一般大學、技職校院、專科院校及空中大學等)，不包含在職專班或學分班。 112學年度上下學期，大學或研究所學業成績總平均八十分以上且無重大違規紀錄。 (二)加分項 (提出相關證明者，優先核給) 縣市政府列冊之低收入戶、中低收入戶、領有政府核發之身心障礙證明、特殊境遇家庭子女、清寒及優秀之原住民或新住民子女 (父母一方為外籍，且在臺合法居留、定居或設有戶籍者)、其他經濟困難家庭，提出相關證明者，優先核給。 (三)補充說明 113學年入學新生若無大專院校或研究所112學年上下學期成績，則不符申請資格。 若學校成績非百分制，請提供分數轉換表佐證。 二、獎勵說明： 1.獎學金：經內部審查後，預計選出60名獲獎者，每名補助新台幣5萬元整。 2.職場實習機會：此非強制性，獲獎者如有意願應徵富邦金控暨轄下子公司實習生職務，經自行提出申請後，可獲得優先參與甄選之機會(非保證錄取)。 三、申請方式及檢附資料 請上富邦慈善基金會｢2024潛力之星獎學金｣活動公告連結：2024富邦潛力之星獎學金 | 富邦慈善基金會 (fuboncharity.org.tw) 四、專案聯繫窗口 若有疑問請先參閱下列FAQ說明或郵件通知，如尚有其他疑問，請一律利用下列信箱聯繫： 富邦金控永續發展部信箱：csr.fhc@fubon.com 富邦慈善基金會信箱：charity@fubon.com"
