title = "2025 02 21 Prof  Khai Truong The University of Toronto  Enhancing access from assistive technology development to designing for user acceptance | 國立臺灣大學資訊工程學系"
description = """
Title：Enhancing access: from assistive technology development to designing for user acceptance
Date：2025/02/21 15:40-17:00
Location: R103, CSIE"""
full_description = "【2025-02-21】Prof. Khai Truong / The University of Toronto / Enhancing access: from assistive technology development to designing for user acceptance 2025-02-14 黃雅群(職務代理) Title：Enhancing access: from assistive technology development to designing for user acceptance Date：2025/02/21 15:40-17:00 Location: R103, CSIE Speakers: Prof. Khai Truong , The University of Toronto Host: Prof. Mike Chen Abstract: While assistive technologies have the potential to transform lives, many are abandoned after initial adoption. Why does this happen? In this talk, I will explore the gap between technological innovation and real-world user acceptance, focusing on the challenges designers and researchers face in creating solutions that are not only functional but also embraced by their users. I will present case studies that highlight the need to understand how psychosocial factors—such as stigma, identity, and social dynamics—shape users’ perceptions of assistive technology. Finally, I will discuss strategies for addressing these often-overlooked factors to enhance the value and acceptance of these technologies for the individuals they are meant to empower. Bio: Khai Truong is a Professor in the Department of Computer Science at the University of Toronto. Khai received a Ph.D. degree in Computer Science and a Bachelor degree in Computer Engineering with highest honors from the Georgia Institute of Technology. He has been an active ubicomp researcher for over 20 years. His research interest lies at the intersection of human-computer interaction (HCI) and ubiquitous computing, and investigate tools and methods to support the development of novel ubiquitous computing systems and techniques and models to facilitate user interactions with off-the-desktop computing devices and services. His current work also includes the design and evaluation of assistive technologies and context sensing applications. https://www.cs.toronto.edu/~khai/"
