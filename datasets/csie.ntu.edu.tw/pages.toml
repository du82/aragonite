title = "研究所 重要公告 學位論文繳交前須進行論文相似度比對 含Turnitin 平臺說明及聲明書  Academic Originality Comparison | 國立臺灣大學資訊工程學系"
description = "學位論文繳交前須進行論文相似度比對；"
full_description = "【研究所-重要公告】學位論文繳交前須進行論文相似度比對(含Turnitin 平臺說明及聲明書) Academic Originality Comparison 2022-07-08 蘇誼嫻 學位論文繳交前須進行論文相似度比對；myNTU離校手續審核系統含此項目。 請同學上傳學位論文予圖書館和本系系統前依校方指引使用Turnitin進行相似度比對。完成後提供相似度報告(論文比對相似度指標Similarity Index)或及相關說明予指導教授檢核，再簽署「資訊學群研究所學位論文學術倫理暨相似度比對聲明書」(附件)交予系辦備查。 系所協助研究生於 Turnitin 平臺開設學位論文相似度檢查管道。( https://www.turnitin.com/login_page.asp?lang=zh_tw ) 原教師於NTU COOL開設論文比對功能保留；如學生自行檢查後對結果有疑慮，由指導教授與學生討論論文相似度比對事宜，並可再使用NTU COOL查核。 敬請同學留意： 依「國立臺灣大學資訊工程學系學位論文品質與管考準則」(附件)，排除引言、參考文獻、目錄及附件，其比對相似度單篇應低於百分之十。如未符合所訂標準，須敘明具體理由並經指導教授確認，始得辦理離校手續。 學生提交論文模式預設為「無儲存庫」，即文稿不會被存入Turnitin比對資料庫。學生可於取得指導教授同意後改選上傳論文至「標準文稿儲存模式」資料夾(須為論文完稿/僅能上傳一次)，即文稿會被存入Turnitin比對資料庫。 Turnitin (Feedback Studio) 常見問題：https://www.igroup.com.tw/turnitin-feedback-studio/faq/ 。 Turnitin (Feedback Studio) 學生使用手冊：https://www.igroup.com.tw/turnitin-feedback-studio/user-guide-student/ 。(Chinese / English) 資訊學群研究所學位論文學術倫理暨相似度比對聲明書.docx 國立臺灣大學資訊工程學系學位論文品質與管考準則-發布版.pdf"
