["https://csie.ntu.edu.tw/zh_tw/Research/lab1"]
title = "研究概況與成果 | 國立臺灣大學資訊工程學系"
description = """
一﹑前言
進入二十一世紀，資訊化革命將會為人類社會帶來全面性的改變，國立台灣大學資訊工程學系為國內最受學子肯定的資訊工程科系，學生素質高，資訊工程學系與資訊網路與多媒體研究所（以下簡稱本系所）師資為一時之選，教學研究無不兢兢業業、盡心盡力，研究績效更是倍受肯定，無論是國科會的獎助、國內學術聲望、或國際的學術表現皆有傲人的成績，研究表現實已臻亞洲一流水準。
 
本系所研究方面具體表現包括大量"""
full_description = "瀏覽人次: 50667 h3.page-module-title br { display: none; } 研究概況與成果 一﹑前言 進入二十一世紀，資訊化革命將會為人類社會帶來全面性的改變，國立台灣大學資訊工程學系為國內最受學子肯定的資訊工程科系，學生素質高，資訊工程學系與資訊網路與多媒體研究所（以下簡稱本系所）師資為一時之選，教學研究無不兢兢業業、盡心盡力，研究績效更是倍受肯定，無論是國科會的獎助、國內學術聲望、或國際的學術表現皆有傲人的成績，研究表現實已臻亞洲一流水準。 本系所研究方面具體表現包括大量論文發表於最頂尖的期刊或會議上，教授活躍於國際學術舞台，主辦重要國際 會議或為其議程委員，獲國科會表揚為研發成果技術移轉產業界績優單位，擔任國科會資訊學門召集人，積極與許多研發單位如資策會等產學合作，及成為國內資訊 相關學術團體的理監事等。本系所畢業生已多人擔任各大學院長或系所主任、創立公司、或成為著名公司之最頂級主管。學術之外，本系所在產學合作與技術移轉上 的績效有目共睹，如多媒體技術研發方面帶動了影音消費市場的成長，亦成功協助多家知名台灣跨國科技公司如趨勢、蕃薯藤、與訊連等提昇技術之研發，並得到宏 碁公司龍騰特別獎。本系所並於最近獲得華宇企業李森田董事長捐贈二期館德田樓1,650坪，加上廣達電腦林百里董事長捐贈電資學院之博理館，皆於2003 年動工。華宇與廣達亦將於校內成立研發單位，將來與產業界的互動必然更為頻繁緊密，尤其在無線多媒體影音與整合系統晶片 (SOC) 開發設計之關鍵前瞻技術上，不論是研究或產學合作都提供進一步的助力。 在如此穩固的基礎上，本系所除支持個別前瞻及卓越之研究外，重點發展『嵌入式自動化系統』、『高效能計 算』、『生物資訊』、與『多媒體與數位內容』四大研究群，其中『嵌入式自動化系統』研究群結合本院卓越之SOC硬體研發基礎，研發以SOC為訴求之可調變 嵌入式自動化系統平台設計技術與工具，『高效能計算』研究群結合電機系計算機理論的成員並整合其專長領域，集中研究方向與力量從事計算方法的改良與分析， 『生物資訊』研究群結合本校卓越之醫學研究基礎，針對生物資訊大量計算與資料問題，設計高效率的演算法以及軟體工具，以分析基因所註記之蛋白質表現，『多媒體與數位內容』為橫跨科技與人文之整合團隊，研究方向為數位內容與媒體工程。 二﹑優越之基礎 為能具體推動與落實資訊化革命跨領域整合成效，並建立國際級研究團隊，近年來，本系所已產生四大研究群。於國家『一所大學』方案之『資訊電子科技整合研究 中心』（以下簡稱資電中心）、『基因體國家型計畫』、及『生技製藥國家 型計畫』之下，本系所已與校內外專家學者形成『嵌入式自動化系統』、『高效能計 算』、『生物資訊』、與『多媒體與數位內容』四大研究群。此四大研究群符合我國之產業發展與特色，特別需要指出的是，我國在九十年元月所舉辦的第六次全國 科技會議中，已將系統晶片 (SOC) 列為重要項目，最近國內各界所矚目的『矽導』專案，亦將系統晶片及相關基礎建設，做為台灣第二波產業躍進的重點訴求。政府挑戰2008 國家發展六年計劃之重點產業目標（2003–2008）為兩兆雙星，其中『雙星』所指即為『數位內容』與『生物科技』。以下謹就本系所四大研究群之特色與 優勢做一說明。 四大研究群團隊成員於國際學術領域相當活躍與得到肯定，經常擔任頂尖國際學術會議之議程委員或主持議程委 員會，如Annual International Conference on Research in Computational Molecular Biology (ACM RECOMB)、IEEE International Conference on Robotics and Automation (ICRA)、IEEE Conference on Control Applications (CCA)、IEEE Conference on Decision and Control、American Control Conference、IEEE Real-Time Systems Symposium (RTSS)、IEEE Real-Time Technology and Embedded Applications Symposium (RTAS)、International Conference on Parallel Processing (ICPP)、International Symposium on Fault-Tolerant Computing (FTCS)、及IEEE International Conference on Computer-Aided Design (ICCAD)、IEEE International Conference on Multimedia and Explore等。 『嵌入式自動化系統』研究群整合本系所之智慧型機器人實驗室、即時暨嵌入式系統實驗室、電腦結構實驗室與網路實驗室等師生的長期研發能量 [1]，以資電中心提供基礎研發建設，延續卓越計畫之經驗與系統研發成果，結合台大電機資訊學院電子所之硬體智財權元件 (IP) 設計能力，建立堅強之研發團隊，必能創造優異之研發成果。本系所團隊成員已獲得許多榮譽，包括一位IEEE Fellow，一位國科會特約研究員，一位國科會傑出研究獎，一位中研院年輕學者研究著作獎，與國際比賽首獎 (如IEEE CSIDC 2003等)。數位團隊成員亦具有多年控制與SOC系統平台設計業界經驗，包括Broadcom, Intel, DoCoMo USA Labs等，並擁有多項專利。團隊成員與產業界有多年建教合作的關係，五年內於台灣已執行台幣數千萬之合作計畫。團隊成員於相關國際學術領域亦相當活躍與 得到肯定，經常擔任頂尖國際學術會議之議程委員或主持議程委員會。 『高效能計算』研究群結合電機系計算機理論的成員並整合其專長領域[2]，集中研究方向與力量從事演算法設計與分析研究。高效能計算研究群 的研究主軸包括演算法設計與分析，平行與分散式計算，有效處理大量計算之算法，科學計算，特定領域之有效算法最佳化。具體應用領域包括了無線通訊，金融計 算，計算物理，大量資料探勘。高效能計算研究群的重點特色在於成員的演算法設計與分析能力堅強，能在特定領域運用算法的最佳化得到良好的解答。目前已在前 述之領域得到良好結果，未來會再加強跨領域的合作，在各個應用面發揮高效能計算的能力。研究群成員包括一位國科會特約研究員，並有多位成員在理論頂級期刊 (如SIAM J Journal on Computing) 及會議 (如Annual ACM Symposium on Theory of Computing (STOC)) 發表論文，理論研究的實力堅強。 『生物資訊』研究群結合本系所、醫學院、醫院、及生命科學院專家學者之實力堅強的研發團隊[3]，台灣大學校內『生物資訊學程』推動亦已有 相當成效。本系所不僅擁有超過四名以上之教授長期且全職投入生物資訊領域研究，參與開發在序列分析上頗具影響力的FASTA軟體，著作也被SCI這些年最 被引用的BLAST軟體論文所引用，是長序列分析上的開路先鋒。在資料分類方法上，本系所教師在SVM (support vector machine) 及RBF (radial basis function) 分類方法設計及軟體開發上，於世界研究群中處於領先地位，發展出的軟體包括 LIBSVM及BSVM，有數千位使用者遍佈世界各地。『生物資訊』研究群目前參與多項生物資訊大型計畫，如基因體國家型計畫以及生技製藥國家型計畫。本 系所團隊成員已獲得許多榮譽，包括一位中研院年輕學者研究著作獎與數個國際比賽首獎 (如WCCI 2002 Competition, EUNITE World Wide Competition 2001, IJCNN 2001 Challenge)。本校在基礎生物及醫學方面，已有非常堅強的研究陣容，本系所團隊於醫學院林榮耀院士等學者指導下，早已積極地和醫學院及生命科學院 進行生物資訊相關題材的合作，在未來幾年裡，一定能開發出對生物醫學專家有很大助益的軟體。特別須要指出的是，本系所賴飛羆教授為臺大醫院第一位非醫師出 身的副院長，顯示生醫與資訊之結合為不可抗拒之趨勢。 『多媒體與數位內容』研究群為一個橫跨科技與人文為特色之團隊[4]，主題目標為內容科學與媒體工程，以本系所為核心，結合中研院資訊所、 電機系資訊組、圖資系、語言所、新聞所及戲劇所的工作團隊，於資電中心多媒體實驗室架構下已進行超過一年以上之密切合作。圖資系、語言所、新聞所及戲劇所 工作團隊於創作、編製、與研究數位媒體內容，包括語料庫和評估測試庫，已有深厚經驗與素養。本系所『多媒體與數位內容』研究群成員中之『通訊與多媒體實驗 室』，亦為國內最早從事多媒體研究之實驗室，成立14年來持續接受國科會及相關業界的委託與資助，已執行超過台幣一億元之產學合作計畫，除掌握了必要的關 鍵技術外，並累積了豐富的系統實作經驗。本研究群已進行技術移轉並商品化的成果有尉台公司之多媒體電子郵件系統與共用白板系統，訊連科技之由連續視訊產生 之全景影像虛擬實境、低資料量的影音郵件軟體、互動式多媒體簡報展示軟體、與Talking Show，及太極影音科技之MPEG-4場景編輯器。 本系所之研究群成員曾獲得許多榮譽，包括四位IEEE Fellow、八位國科會傑出研究獎、與三位中研院年輕學者研究著作獎等[5]。 三﹑近、中、長程發展之具體目標 國立台灣大學資訊工程學系『嵌入式自動化系統』、『高效能計算』、『生物資訊』、與『多媒體與數位內容』四大研究群與其他已有相當傑出表現之教授之研究主軸與具體目標如下。 『嵌入式自動化系統』研究群之主軸為『可調變之嵌入式自動化系統』(configurable embedded systems for automation and control)，具體目標為研發以系統晶片(SOC) 為訴求之可調變自動化系統設計的核心技術與工具。長程願景為發展適當之硬軟體系統合成技術與工具於自動化系統設計，並兼具重複使用之智財權元件設計與管 理，希望據以提升自動化系統硬軟體整合設計能力，縮短產品從系統設計至上市之時間。合成技術與工具之發展宜具有產生可客製化之ASIC設計及硬體映射能 力，在此大方向下，研究群之近程目標為研發與確認適當智財權元件，研發自動化系統關鍵技術，建造模組化設計環境，與提升系統設計品質能力之技術，希望一方 面發展具有提升系統設計品質能力之技術，另一方面磨合團隊之整體戰力，並試作可調變之FPGA (field programmable gate array) 模組化硬軟體系統環境，參考自動化產業需求，移植即時作業系統於數個選定之微處理機元件，並試作省電設計，結合台大電機資訊學院電子所之硬體智財權元件設 計能力。近程目標之具體細節如下： 確認、建立或掌握適當重要智財權元件如網路系統元件等。 研發自動化系統關鍵技術如即時作業系統與控制方法。 建立可鑲入式之模組化硬體設計環境(plug-and-play modular hardware platform)為主軸。 整合性推動電腦結構與兼具網路功能之即時作業系統的省電設計。 中程目標為智財權元件設計與管理，建立分散式自動化系統軟硬體整合設計、分割、及驗證平台，並集合數十位師生五至10年之研發努力，期待發展出 適當之自動化系統硬軟體系統合成技術與工具。必須強調的是，完整硬軟體系統合成技術與工具牽連廣大，本團隊之目標宜確認自動化系統需求、建立或掌握適當技 術，不需擁有所有技術。善用開放軟體與產業資源，發展適宜且關鍵的技術，其與整合系統能力之發展是本研發團隊之目標及願景。中程目標之具體細節如下： 研發分散式自動化技術。 發展自動化硬軟體分割技術(automatic software/hardware partitioning) 技術。 建立可重複使用之智財權元件設計與管理。 建立軟硬體整合設計及驗證平台。大方向為支援可調變之嵌入式自動化系統平台設計。 『高效能計算』之主軸為『具應用面之大量計算的高效能演算法』。高效能計算研究群的短期目標是拓展成員的研究領域。研究主題將由純學術拓展 至較具應用面的主題。成員的研究領域必須考量應用面作為發展重點。短期的重點是加強與國內外計算機應用與理論研究團隊的合作關係。藉由資訊的互通有無而朝 向應用面較強的領域來拓展。具體目標為確認重要應用領域，並積極與相關團隊達成合作關係。高效能計算研究群的中期目標是建立跨領域研究並建立初步計算平 台。隨著科學新知的日新月異，不同計算領域對計算能力的要求將持續上升。如何藉由演算法的設計與分析達到充分有效的應用計算能力將成為極重要的問題。高效 能計算研究群將結合本身對演算法的掌握能力，與不同計算領域的專業知識 (domain knowledge) 相結合。例如財務計算是財務與高效能計算結合的好例子，呂育道教授在此研究領域為國內翹楚，亦受國際及國內學界業界之肯定。 高效能計算研究群的長程目標是建立實作示範點。在前一階段完成之跨領域研究及計算平台必須經過實作驗證，而成立實作示範點正是驗證的具體途徑。計算平台或 系統的成功必須包含下列要素。正確的重要應用領域確認，正確的演算法設計與分析，正確的系統平台選擇與設計，以及正確的專案管理與時程掌控。高效能計算研 究群不但尋求於其他計算領域的合作，更積極尋求與資訊產業界的整合研究。而建立實作示範點將是與資訊產業界合作的重要指標。 『生物資訊』研究群之主軸為針對生物資訊研究上所遭遇的大量計算與資料問題，設計有效的演算法以及實用的 軟體工具，在各種生物體的基因組逐步解碼後，下一階段很快的就要進入基因所註記蛋白質表現的綜合分析，這將牽涉到許多交互關係的運算，在長程願景上，我們 希望在蛋白體學(proteomics)相關的研究與軟體開發上，取得領先地位，特別是蛋白質結構分析(protein structural analysis)、生化反應路徑資訊(pathway informatics)、以及蛋白質嵌合(protein docking)。 研究群之近程目標為建構蛋白體分析的基本平台，包括建立蛋白質結構歸類、生化反應路徑及蛋白質嵌合的基本解析軟體，具體細節如下： 建構有關蛋白質結構歸類的分析軟體。 在生化反應路徑資訊上，有效搜尋相關的生化反應路徑訊息，及有效展示生化反應路徑訊息。 在蛋白質嵌合上，建立一個更完整包含生物和醫學相關資訊的資料庫，建構出與製藥更貼近的最佳組合方法。 中程目標為建立一個可協助藥物開發的整合性蛋白質分析軟體工具，希望建立生物資訊跨領域開發中心，將生化反應路徑的相關理論釐清，並建立合適可行的模式，以便能在後蛋白體時代中，取得優勢，具體細節如下： 整合蛋白質結構歸類、生化反應路徑與蛋白質嵌合軟體，以便建構輔助高效能藥物開發的平台。 建立蛋白體學分析相關的圖論基礎。 建構蛋白體學分析相關的視覺化工具。 『多媒體與數位內容』研究群為一個橫跨科技與人文色之團隊，具體目標為內容科學與媒體工程，研究群將由數位內容組織、數位內容理解、及數位 內容傳輸等兼具研究價值與人文及科技觀點的議題著手，以發揮優勢與累積成果。長程願景為了解使用者的目的，運用先進的資訊技術，深入了解內容的實質本體， 從而建構出語意，粹取其相關資訊，並結構出知識。 研究群之近程目標為數位內容之語意及知識結構，多媒體資訊檢索、摘要、及呈現技術，具體細節如下： 探索在數位內容之知識結構中，人類使用自然語言所呈現出來的內容語意及知識結構，研發數位影音與視訊資料之metadata產生技術。 內容為主之多媒體資訊檢索與摘要技術。 視覺及聽覺上的互動性結合、處理、及呈現技術。 中程目標為多模式(multimodal)、多文化數位內容與使用者中心之核心技術，具體細節如下： 處理不同媒體上的多語言、多文化數位內容。 多語言資訊檢索。 納入內容使用者之行為模式考量，探索任何可能以使用者為核心之互動媒體。 發展以使用者為核心之互動式媒體核心技術，並於多模式內容之組織中，考慮到觀賞者的關注性及喜好模式等條件下, 進行關於內容組織化的研究。 四大研究群之中，本系所有數個領域具有國際競爭力。例如陳健輝教授在平行電腦連結網路上的研究十分傑出， 其發現之平行結構與演算法，可大大縮短在國防、氣象、科學研究、等需要大量計算之計算時間，得到四次國科會傑出研究獎與難得的Institute for Scientific Information (ISI) 經典引文獎。傅立成教授 (IEEE Fellow)在機器人與自動化方面的研究得到國內及國際之肯定，如三次國科會傑出研究獎與Distinguished Lecturer of IEEE Robotics and Automation Society，其研究在機器人視覺與半導體廠排程有重大貢獻，多次為國際最權威會議之會議主席與議程委員。財務計算是少數不存在業界與學界鴻溝的領域， 呂育道教授在此研究領域為國內翹楚，亦受國際及國內學界業界之肯定，有助臺灣金融市場之進步，在臺灣完成之金融計算專書為英國劍橋大學出版 (2002)，建立了世界知名度。 [1] 本系所成員包括：傅立成、賴飛羆、郭大維、陳俊良、林風、朱浩華、楊佳玲、逄愛君、顧孟愷、施吉昇。 [2] 本系所成員包括：李德財、陳健輝、呂育道、劉邦鋒。 [3] 本系所成員包括：高成炎、歐陽彥正、趙坤茂、林智仁。 [4] 本系所成員包括：李琳山、陳信希、項潔、吳家麟、陳文進、歐陽明、陳銘憲、傅楸善、洪一平、許永真、周承復。 [5] 本系所之IEEE Fellow為：李德財、李琳山、傅立成、陳銘憲等、國科會傑出研究獎為李琳山、林逢慶 (現為兼任教授)、吳家麟、項潔、陳健輝、傅立成、陳銘憲、郭大維等，國科會特約研究員為傅立成、陳健輝等，與三位中研院年輕學者研究著作獎為洪一平、郭 大維、林智仁等。電機系資訊組的國科會傑出研究獎得主尚包括顏嗣鈞、陳良基 (亦為IEEE Fellow)、與郭斯彥 (亦為IEEE Fellow)。以上成員絕大多數皆在本系所提的後卓越計畫內，本系所提的後卓越計畫尚包括國科會傑出研究獎教育部學術獎得主貝蘇章院長、李琳山主任委 員。後卓越計畫業已通過。"
