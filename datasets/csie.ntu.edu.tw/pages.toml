title = "研究所 碩 博士班學生經系 所 學位學程確認修習通過或核准免修六小時學術倫理課程者 始得申請學位考試 | 國立臺灣大學資訊工程學系"
full_description = "【研究所】碩、博士班學生經系、所、學位學程確認修習通過或核准免修六小時學術倫理課程者，始得申請學位考試。 2017-11-06 蘇誼嫻 學生事務 依本校「國立臺灣大學學術倫理課程修課實施要點」，碩、博士班學生經系、所、學位學程確認修習通過或核准免修六小時學術倫理課程者，始得申請學位考試。以入學第一學年結束前修習完成為原則。 學生可於臺灣學術倫理教育資源中心(http://ethics.nctu.edu.tw/)修習「學術倫理」課程。 登入時身分請選「必修學生」，帳號為學號，密碼預設學號末5碼。 登入後至［課程專區→我的課表］將課程俢畢並進行總測驗， 每日限5次未通過機會，若通過測驗則於隔日中午至［學習歷程］下載修課證明。 系統操作手冊和「國立臺灣大學學術倫理課程修課實施要點」如超連結。"
