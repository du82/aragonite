full_description = "【徵才】2025年DNA Internship實習積因計畫 邀請您投遞履歷！ 2025-02-26 宋欣薏 Develop: 參與軟、硬實力的培養課程，全面提升專業技能 Navigate: 與世界一流專家一起執行專案，探索先進技術！ Advance Offer: 表現優異者將有機會獲得”預先聘書”(含研發替代役) 計畫對象： l 大三(含)以上且具備全職學生身份者(2026年畢業的碩、博士生優先) l 主修電機/電子/光電/物理/材料/化學/化工/機械/資工/資管/工工/環工等理工、商管科系 (歡迎各領域同學加入) 履歷傳送門：(投履歷點我) 投遞期間：即日起至 2025/05/05 徵選期間：即日起至 2025/06/20 實習期間：2025/07/07~2025/08/31 (8/29最後上班日) 實習說明會報名資訊： 中文場次(報名點我)► 2025/03/14(五) 12:15-13:15 英文場次(報名點我)► 2025/03/28(五) 12:15-13:15 2024 DNA Internship精彩回顧影片: (看影片點我)"
