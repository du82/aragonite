title = "[活動]第四屆 保誠創新智造所 黑客松創新競賽在 2025 1 13 開始徵件 | 國立臺灣大學資訊工程學系"
description = "為激發學生對科技創新的發想以及興趣，以培育未來世代人才、發掘社會創新解方，本公司第四次與保誠人壽合作舉辦「保誠創新智造所」黑客松創新競賽，提供參賽團隊獎助金、AI 工作坊與產官學跨領域評審建議等豐富資源。學生組與青年組各取前三名優勝團隊，提供豐沛獎金，鼓勵參賽者在創新的道路上持續努力。此黑客松創新競賽適合"
full_description = "[活動]第四屆「保誠創新智造所」黑客松創新競賽在 2025/1/13 開始徵件 2025-01-14 白師瑜 為激發學生對科技創新的發想以及興趣，以培育未來世代人才、發掘社會創新解方，本公司第四次與保誠人壽合作舉辦「保誠創新智造所」黑客松創新競賽，提供參賽團隊獎助金、AI 工作坊與產官學跨領域評審建議等豐富資源。學生組與青年組各取前三名優勝團隊，提供豐沛獎金，鼓勵參賽者在創新的道路上持續努力。此黑客松創新競賽適合想透過比賽累積經驗、有志於學習創新思考與增強自我實力的同學與青年。 徵件主題：AI 賦能－打造保險大未來 徵件時間：即日起至 2025 年 3 月 17 日 中午 12 點止 參賽資格： 學生組：所有成員限定為全台大專院校在學學生（不含在職專班），鼓勵跨領域、跨學院和跨校組隊。 青年組：所有成員皆為 18－35 歲（1989 年 3 月 17 日至 2007 年 3 月 17 日出生）青年族群，含在職專班生。 報名方式：以「團隊」為單位報名，每隊 3－6 位成員，並於徵件期間填寫 SurveyCake 線上報名表。 詳情請參閱活動網站：https://pcalifeinnovation.com.tw/"
