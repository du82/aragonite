title = "常見問題答詢 | 國立臺灣大學資訊工程學系"
description = """
常見問題集
 
Q: 如果我對電腦沒有基礎，適不適合讀資工系呢？
系上剛進來的新生其實大多數學生都沒有電腦基礎，進來系上後也都適應的很好。我們除了會從基礎開始教導程式撰寫之外，也很重視數學、邏輯、英文等等其他方面的能力(教科書內容及撰寫程式皆為英文)。原則上只要對電腦有興趣，不需要任何基礎，只要肯學習，台大資工"""
full_description = "常見問題答詢 2023-03-23 周承滿 常見問題集 Q: 如果我對電腦沒有基礎，適不適合讀資工系呢？ 系上剛進來的新生其實大多數學生都沒有電腦基礎，進來系上後也都適應的很好。我們除了會從基礎開始教導程式撰寫之外，也很重視數學、邏輯、英文等等其他方面的能力(教科書內容及撰寫程式皆為英文)。原則上只要對電腦有興趣，不需要任何基礎，只要肯學習，台大資工系的訓練與教育將讓您成為一流的資訊人才。 Q: 資訊工程系與資訊管理系有何差異？ 就學院上的差異，資訊工程系屬電機資訊學院，資訊管理系屬管理學院。就課程上的差異，資訊管理系的課程一半與管理相關，重視在資料庫中上層的運用，將這些資料庫系統運用到企業管理中；資訊工程系的課程非與管理有關，而是在學一些核心的技術，例如程式語言、作業系統、網路多媒體等；目的在於開發設計新的軟體（如Windows）、系統（如自動導航系統）、服務（如搜尋引擎），讓企業界或一般民眾來使用。就學生出路的差異，資訊管理系的學生多在各個企業界的資管部門，較少直接參與產品的開發研究。資訊工程系的學生多在Google、Yahoo!、廣達、聯發科等高科技公司從事研發工作。 Q: 為什麼要選擇台大資工？ 1. 全國最好的學生素質 系上大學部的同學都是全國頂尖的學生。在過去幾年大學聯考的志願排名中，台大資工系一直都在所有資訊領域當中排名第一，歷來程式競賽得獎的高材生幾乎都選擇本系就讀，在大學時代進一步增強自己的實力，同時台大電機資訊學院也是全國二類組考生心目中的首選。 2. 完整均衡的通識教育 我們認為大學部同學不應將自己的學習領域侷限在只跟本科系課程有所相關的部份，而應該積極地吸收不同領域的知識。資工系鼓勵跨領域的學習，系上教授的研究非常多元化，資工系也開設很多跨領域課程，包括財經演算法，歷史資料分析、語言處理、生物資訊、社會網路等等。讓學生可以有跨領域的選擇。此外，台大在各個學科都有最好的師資，而身為台大的一份子，台大資工系的同學可以從這13個學院，共54個在各領域執牛耳的科系開授的課程中，獲得各種學科的相關知識及資源。除了資工系的電腦相關課程外，同學們更可以在經濟、醫學、心理、文學、戲劇等領域中發展自己的其他興趣，成為一個全方面的人才。 3. 和世界接軌的橋樑 台大資工系定期邀請世界各國知名學者來參訪演講，和同學面對面交流，不僅可以了解國外的最新科技及技術，更可以學得做學問的態度和方法，對出國申請學校也有所助益。而台大資工系的同學對於畢業後出國深造一向非常積極，且出國學生佔畢業生比率相較其他學校都是最高的。我們的學生在世界各知名大學的入學委員會間一向享有良好的名聲。因此，同學們畢業後有相當大的機會可以申請上像是MIT、Stanford、UC-Berkeley等國際名校。 4. 具世界一流師資 台大資訊工程學系的師資陣容齊全，其研究領域涵蓋「嵌入式系統與高效能計算」、「理論與演算法」、「生物資訊」、「人工智慧」、「多媒體與數位內容」與「雲端計算」等重要資訊研究領域。本系現有專任教授40名，兼任教授13名，及3名客座教授，並邀請華裔唯一Turing Award(有資訊領域諾貝爾獎之稱)得主－姚期智院士擔任特聘研究講座，本系還有另外三位傑出人士擔任特聘研究講座，分別是李文雄院士、李德財院士和陳世卿博士。本系所之研究群成員在學術方面獲得許多榮譽與肯定，包括2位發展中世界科學院院士、2位IEEE Fellow、7位國科會傑出研究獎、2位東元獎、4位十大傑出青年、1位德國宏博研究獎；對台灣產業界的發展亦有重要的影響與貢獻。 5. 以培育世界一流學生為目標 台大資工系課程設計兼顧理論與實作，以培育不論是在國內外的業界及學界，都具有遠見及領導能力的一流學生為目標。本系學生也積極參與各項國際競賽，皆有傲人的成績。 如2010年方獲得ICPC程式競賽全球第三名。 6. 資訊電機密切結合 進入台大資訊系，能感受自由的學習風氣。本系不僅有資訊學門之專門學科，同時也開授許多與電機相關的基礎課程。資訊工程系與電機系的各項研究亦有密切的互動。進入台大電資學院的資訊工程系，同學們將接受的是資訊電機領域整合的全方面訓練。利用在軟體上的專長與對電機領域的知識，台大資訊系學生在未來帶領台灣進入知識經濟時代的IC設計產業中，亦將扮演舉足輕重的角色。 7. 具先進以及完備的實驗設備 本系目前共有數位邏輯實驗室、工作站實驗室、雲端計算趨勢學程實驗室與資訊系統訓練班四間公共實驗室(包括PC級以及工作站級電腦)，數量達兩百多台。由於本系與Intel以及Microsoft等知名廠商均有良好的研究計畫關係，這些設備均會隨時地作最新版本的更新，同學們將可獲得功能最新的個人研究設備。電腦教室採用中央空調設備，環境舒適。大學部同學更有專屬的生活及研究活動空間，方便同學討論與交換學習心得。大部分需要電腦軟硬體支援的作業均可在學校完成，許多同學甚至於以系為家。簡言之，教學上所需之軟硬體設備並不一定需要自己購買。除了這些屬於個人的研究設備，本系更全面布建有線以及無線網路，系館內「隨時隨地使用網路資源」不再是夢想，在這裡均可實現。除此之外，本系更擁有大型且功能特殊之專門研究設備，這些設備均是全國唯一或是少有的研究設備，例如：行動醫院應用伺服器、向量信號產生器及類比信號產生器、亂數圖形調變測試器、光阻塗佈機及加熱器、高頻探針系統、網路應用程式效能測試暨模擬器、光譜分析儀以及高速量測系統、網路協定分析儀及其先進交換測試功能模組、微波信號量測系統、毫米波向量信號以及混波器介面電路、電感耦合式電漿蝕刻、向量網路分析儀等。綜言之，加入台大資訊，你將可接觸並且使用最新的科技。 8. 擁有良好的人脈關係 台大的學生一向被認為是將來各領域的領導者，像是前任及現任總統都是由台大畢業，還有眾多在國內外各行各業的佼佼者，例如廣達電腦公司董事長林百里及中研院院長李遠哲都是台大的校友。在國外學界或業界發展的華人中，更有許多人都是台大的畢業校友。台大校友遍布全世界，能夠提供給台大的畢業同學無數個就業及學習機會。 9. 充實的校園生活及多采多姿的都市體驗 台北市一向被認為是台灣的社會、文化、商業中心，而正由於台大位於台北市，台大的同學除了充實學習的校園生活，更可以體驗新奇有趣的都市生活。如此在學得專門知識外，更能拓展自己的視野、累積人生經驗，不啻是另一種珍貴的收穫。 Q: 是否有至國外進修之機會？ 台大提供同學多元化之學習管道，並與國外知名大學簽約締結姊妹校。全球共有51個國家與本校簽約締結姊妹校、327所知名大學簽署合作計畫，其中包含許多交換學生計畫、雙學位計畫、訪問學生計畫、暑期短期課程交流計畫等；此外，許多姐妹校皆有提供獎學金。而依日前台大教務會議通過的「跨國雙聯學位辦法」，台大大學部學生念滿兩年，即有機會申請到與台大簽訂雙聯學制約定的國外大學就讀，雙方課程學分將可以互抵，並可取得雙方畢業證書。除校方提供之國際交流機會外，台大資工系學生也能透過本系與國外各大研究單位的合作計畫，獲得出國進修學習的寶貴經驗。近年來，每年都有數位優秀的大學部同學去美國的名校（如UIUC）從事交換學生的學習。 Q: 台大資訊工程系的學生畢業後的出路如何？ 系上的學生畢業後幾乎全數繼續唸研究所，台大電資學院內就有四個研究所可供同學依據個人性向選擇，包括資工所，電機所，網路多媒體研究所，與生醫資訊研究所。有部分畢業生會赴國外知名學府例如Stanford、MIT、UC-Berkeley等校進修，另外也有些公司會提供學生國防役。廣達、威盛、華碩、訊連、聯發科、趨勢，宏達電、台積電、IBM、Microsoft、Google等大規模的公司皆有資工系的學生；另外也有畢業生會成立工作室或合開公司。事實上，工作在追著這些畢業學生，本系畢業生通常手上都會有多份聘書可供選擇。目前在國內各研究型大學資訊工程學系及主要資訊工程研究機構中，本系系友已扮演中堅份子，非常出色。 Q: 我的分數可上台大電機系或台大資訊工程系或是其他科系，要如何來選擇科系？ 重要的是要瞭解自己的性向。基本上，電機系與資訊工程系的學生之間有密切的互動。譬如說，電機系的學生會來資訊工程系讀研究所或任教；而資訊工程系的學生會到電機系讀研究所或任教。某些課程如CAD(Computer Aided Design)可能在資訊工程系或在電機系的計算機組都有開課。多試著瞭解自己的性向，如果你對數理工程等方面有興趣，資訊工程系會是極佳的選擇。 Q: 貴系是否會常舉辦一些活動？ 由於獨立的系館與充足的學生活動空間，資訊系的同學間互動頻繁，不會有像其他規模龐大系所那種人情的疏離感，學生活動也因此更加多采多姿。資訊系系學會每年會舉辦像是迎新宿營，資訊之夜還有夜烤等等戶外或室內的學生活動，另外，還有各種體育類活動的系隊如桌球、羽球、網球、足球、籃球、棒壘球、排球等，都在各項體育活動方面有著良好的表現，系上博奕類活動如象棋、圍棋、橋牌等，也相當發達，也有著良好的成績與傳統，在充滿了各種活動的資訊系，一定能夠快樂學習，滿載而歸。 Q: 讀台大資訊工程系是否要花很多錢在電腦軟硬體購置上？ 資訊工程系有幾間公用的電腦教室，如數位邏輯實驗室、工作站實驗室、雲端計算趨勢學程實驗室，總共有兩百多台設備相當完善的個人電腦。而電腦教室有中央空調設備，環境很舒適，且系上都有提供所有教學上所需之軟硬體設備；所以許多學生幾乎以系為家，大部份的作業皆在學校完成。系上並提供所有教學上所需之軟硬體設備，並不一定要自己購買。 Q: 資訊工程系的空間夠不夠學生使用？ 軟硬體設備的提供是沒有問題的，且全系館任何角落均可使用無線網路；資訊工程系提供數位邏輯實驗室、工作站實驗室及個人電腦教學實驗室，總共有兩百多台設備相當完善的個人電腦。而在空間方面，在華宇企業李森田董事長夫婦個人捐贈之德田館竣工後，學生已有更好的上課空間及更大的實驗室來作研究。 Q: 讀資訊系將來的出路如何? 資訊科系的研究在研究些什麼? 徐讚昇教授： 出路？就是出路很好！ 大概就是兩個方向，一個是做研究，一個是就業或創業。不過你也可以兩個都做！當然不是說兩個平行在做，那會很辛苦，是例如在業界也可以進行有關的研發工作，或者是工作一段時間存了一點錢之後，再回去念書或研究。先工作再回去唸書是ok的，只要不要太老，我覺得只要小於40歲其實都不算太晚。在業界工作常常要加班到深夜，這是滿普遍的現象，辛苦是辛苦，不過做自己喜歡而且覺得值得的工作，還是可以樂在其中的。至於研究方面，就是要看出某項技術或理論不足的地方，然後再想辦法補救看怎樣才能更好，例如程式語言從以前到現在歷經了許多代，許多種截然不同的語言被發展出來，不停的在翻陳出新，而我也不認為它會很快的趨向穩定，這中間還有很多路要走。資訊科學就是一直有新的東西在出現，一切都是很難在預先想像的，像以前web很慢，很難用，誰都沒想到現在的世界會變成這樣，那現在無線網路的技術又慢慢風行了起來，之後還會有很多可以發展的空間。這些不停出現的新的東西都是研究的好題材，是很寬廣而無限的。 劉邦鋒教授： 念資訊系出來之後通常有兩條路可以走，一種是走入業界，另一種是投入學術研究的工作，不過這兩者在大學四年其實還沒什麼差異，主要的分歧是在研究所以後才決定的。如果要進入產業界，通常是在念研究所的時候才會決定要研究的技術走向，建立好準備踏入業界的基礎；這時候要加強的是設計軟體的實務經驗、做大型 project 的能力還有要有與公司接觸的經驗，了解公司內部開發軟體的運作方式。如果是要從事學術研究，通常會念完博士學位，而也是在攻讀碩士學位的時候確立鑽研的學術方向，並且在這段時間與指導教授學習該領域的課題。在這六年的大學生涯中(現在大部份的學生都會繼續讀研究所，所以這裡指的六年包括研究所兩年)，不管是要走業界還是走學術，都要把基礎科目給學好，例如程式設計、演算法、計算機結構、系統程式等方面的基礎科目都要好好學，而不是只會使用別人寫好的 app 就好了。而在大學部裡，一些比較重要的基礎課程如離散數學、演算法等都要學得非常好，另外關於系統的部分如作業系統、系統程式、編譯器、計算機結構和組合語言等也都是很重要的基礎入門學科，要學得很強。不管以後走什麼方向，這些東西都是很重要的。現在的學生常常有一個現象，就是學生都只會玩app，卻沒有辦法自己寫出一個程式做到一樣的事，例如我問一個學生怎樣把wav.檔轉成mpeg格式，他可以告訴我用某某軟體怎樣使用可以做到，但是問他要怎麼寫程式來做到這一件事，他卻答不上來；或者很多學生知道用什麼軟體去show圖，但是要他寫一個卻沒辦法。但是我們資訊系出來的學生不能只是這樣，應該要對整個computer system 的原理、構造都要有足夠的認識，這是資訊系的學生在大學中所要努力的方向。 林守德教授： 資訊相關的產業從二十年前的純粹軟體業，到今天已經變成結合軟體、硬體，以及服務導向的多元化產業。軟體公司如作業系統（微軟），多媒體（訊聯），防毒軟體（趨勢）等公司在未來仍是佔有一席之地；而軟硬體結合的產業如手機（宏達電），筆電（華碩），自動導航（Garmin），遊樂器（任天堂）裡面更是需要許多資訊人才；最後近年來崛起的網路公司以及服務導向的公司，如搜尋引擎（Google），網路購物（亞瑪遜），社群網站（facebook），遊戲（智冠），通訊（Skype）等等。讓學生畢業後在資訊相關的行業有非常多的選擇。這些高科技公司都有一個共同點：願意用最高的待遇來雇用最有能力的人才。在台大資工系，我們希望除了教導軟體、硬體、數學等等基本能力之外，也希望能夠訓練學生的創意以及解決問題的能力，創造出台大資工學生的利基與獨特性，將來在職場上才能更具競爭優勢。 此外，因為電腦以及網路多媒體在21世紀已經成為生活中不可或缺的一環，資訊人才的出路就更不只有侷限在資訊相關產業中。銀行，政府機關，超商，國中小學等原來看似與資訊不甚相關的行業，其實對於電腦、資料庫、軟體等資訊產品以及服務都有殷切以及長期的需求。 對於從事研究工作有興趣的同學，除了資訊領域的研究之外，在跨領域研究也有各式各樣不同的選擇。在台大資工系跟資訊相關的研究包含理論與演算法、軟體、硬體系統、網路、多媒體、人工智慧等等；而本系所進行的跨領域研究也涵蓋生物、醫學、歷史、財金、語言、藝術等領域，同學如果希望研究如何將資訊科學的方法用來解決其他領域的問題，台大資工系會是極佳的選擇。"
