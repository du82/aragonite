full_description = "【徵才】3/8華碩機器人與人工智慧中心 徵才說明會 2025-02-24 白師瑜 你嚮往加入國際級的菁英研發團隊嗎? 想和最頂尖的人才切磋技術嗎？華碩機器人與人工智慧中心 (ASUS Robotics and AI Center)是專研AI的前瞻軟體研發中心，匯集了來自全球各地最頂尖的工程 師和科學家，目標是開發真正能夠改變人類工作與生活的AI技術。 我們正在尋找志同道合的夥伴！歡迎全世界的AI技術狂熱者，加入我們的行列，讓我們一同釋放AI 的力量！ 我們將於2025年3月8日下午2時於台大普通教學館205舉辦徵才說明會，歡迎對AI產業有興趣的求職 者報名參加。3月5日前完成報名並完整參與徵才說明會者，將可獲得精美小禮物一份！ 職缺查詢: https://www.araic.asus.com/job-openings 活動報名: https://forms.gle/EV67pM78AACkFj9KA"
