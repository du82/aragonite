title = "113學年度第2學期 [專題討論] 課程公告（Seminar Info） | 國立臺灣大學資訊工程學系"
description = """
這學期以「心得」作為評分標準，請於當週課後提交到 NTU Cool 的作業區，於第一週2/21開始實施。評分結果結果將於期中、期末公布。如果有任何問題，歡迎踴躍詢問。

 

請注意

* 心得請至ntu cool作業區繳交，截止時間為演講當日的下午11:59，逾期不接受補交

* 心得200字以上，不限格式，中"""
full_description = "113學年度第2學期 [專題討論] 課程公告（Seminar Info） 2025-02-21 黃雅群(職務代理) 這學期以「心得」作為評分標準，請於當週課後提交到 NTU Cool 的作業區，於第一週2/21開始實施。評分結果結果將於期中、期末公布。如果有任何問題，歡迎踴躍詢問。 請注意 * 心得請至ntu cool作業區繳交，截止時間為演講當日的下午11:59，逾期不接受補交 * 心得200字以上，不限格式，中英文皆可。 * 心得作業抄襲他人或網路內容者，經課程公告或系辦通知後自行辦理停修；未辦理停修者則至期末以不及格論處。 * 心得作業字數不足、內容與該場次演講無關、語意不通和使用文章產生器者，經課程公告或系辦通知當次作業不予採計，二犯則須自行辦理停修；未辦理停修者則至期末以不及格論處Q 演講心得加分結果將統一於期中週及期末週公布 演講簽到規則： * 座位簽到表將於演講開始前20分鐘開放權限，請同學於入座後利用自己的NTU帳號登入填寫學號簽到 * 請同學確實於入座後才填寫表單簽到，注意本表單不具備保留座位之用途 * 座位簽到表將於演講開始後30分鐘關閉權限，不接受同學以個人失誤等等之理由補簽到 * 請同學填寫座位表單時，注意填表座位和入座座位是否一致，助教將於演講現場拍照紀錄出席，若未到場填表經他人檢舉，將視為未到並視情況懲處。每位同學須在101、102或103教室中登記一個座位。因安全考量，坐在樓梯或地板一率視為缺席(若人數過多，請選擇其他場次再參與)。 * 注意切勿任意竄改其他同學已簽到之學號 這學期專題討論將只施行實體參與，演講資訊將公告於ntu cool公告區 以及 系所網頁->系所公告->專題討論演講公告。 因安排演講需確認時間與地點，會盡早公布。 原則上當周會在ntu cool公告區提醒該周的演講資訊與簽到表連結。系所網頁會張貼已經排成好的。 演講時間基本上為禮拜五14:20-15:30。詳細以該次公告為主。 （心得相關規定會於第二週再行說明）以下是為本學期專題討論評分方式： 心得非強制繳交，但助教可將心得作為積極與不積極參與記錄。請注意，心得會有扣分! 心得若有抄襲之行為，將有嚴重之扣分 心得截止時間為演講當日的下午11:59 A+ 參與七場以上(含)，由主持人推薦，或由助教提出具體積極參與記錄 A 參與七場以上(含) A- 參與七場以上(含)，有遲到或早退記錄，或由助教提出不積極參與記錄 B+ 參與超過四場(含) B 參與四場(含) B- 參與四場(含)，有遲到或早退記錄，或由助教提出不積極參與記錄 TA 聯絡資訊 請先在NTU COOL討論區說明你的問題。你的問題可能也是大家的問題。 若有私人問題，麻煩統一寄信給TA 陳柏諭 R13944036@ntu.edu.tw 和范輝煌 R12922210@ntu.edu.tw 。 加簽事情 若有同學或朋友詢問，煩請轉達加選方式為1類加選，不限人數，請記得在時間內上網加 參與會議場次統計與心得加扣分只會在期中期末各公告一次。其他時間無法公布或私訊詢問。 鼓勵同學以「Reflection」而非「Summary」書寫，可以嘗試延伸今天的講題，加入自己的主觀意見，甚至和自己研究的連結。 心得作業抄襲他人或網路內容者，經課程公告或系辦通知後自行辦理停修；未辦理停修者則至期末以不及格論處。 心得作業字數不足、內容與該場次演講無關、語意不通和使用文章產生器者，經課程公告或系辦通知當次作業不予採計或是扣分，二犯則須自行辦理停修；未辦理停修者則至期末以不及格論處。 如有使用ChatGPT或其他工具輔助請加以註明。"
