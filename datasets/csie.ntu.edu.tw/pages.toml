title = "國立臺灣大學資訊工程學系誠徵行政組員1名 | 國立臺灣大學資訊工程學系"
description = "應徵條件："
full_description = "國立臺灣大學資訊工程學系誠徵行政組員1名 2024-01-30 楊昀芷 應徵條件： (1)具大學學士學歷 (2)工作經歷一年以上 (3)有社群經營經驗者尤佳 (4)擅長辦公室應用軟體如：PPT、Excel、Word、Google系統等 (5)細心負責、具溝通協調能力、團隊合作配合度高者 工作內容： (1)數位教學平台排程設定與管理 (2)教師與學生使用現場錄播系統之諮詢服務與問題排除 (3)課程影片查閱檢視 (4)經營維護臉書社群與官方網站 (5)宣傳活動與推廣 (6)其他臨時交辦事項 薪資待遇：依本校校聘人員薪級表規定https://www.personnel.ntu.edu.tw/table4/labor9.pdf 工作地點：臺北市羅斯福路四段一號資訊工程系館 檢具文件： (1)校聘人員履歷表：含自傳與照片。 (2)最高學歷證書影本、含畢業總成績之歷年成績單影本。 (3)現職或經歷證明。 (4)相關證照影本，其他有利文件。 資料寄送方式：應徵資料請於113年2月2日前將電子檔以e-mail繳件，包含各式文件、證件之掃描檔；主旨請註明【應徵行政組員+姓名】。 甄試方式：經資格審查擇優通知面試；獲約面談時請先繳驗應徵資料之正本；未通知者恕不退件或另行通知。 校聘人員履歷表.docx"
