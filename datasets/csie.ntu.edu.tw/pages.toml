full_description = "全系所公告 張貼日期 標題 類別 瀏覽人次 2025-02-19 【國立臺灣大學】 公告 主旨：公告本校113學年度暑期課程行事曆、選課及收費標準等事宜。 全系所公告 57 2025-02-11 【國立臺灣大學】 函 主旨：貴學系(所、學位學程)辦理本(113)學年度第2學期研究所博、碩士學位考試所需各種相關表單及注意事項，請查照並轉知所屬師生。 全系所公告 75 2025-02-11 【國立臺灣大學】 函 主旨：為防範停、復電衝擊造成各館舍使用單位貴重儀器等設備損害，請考量加裝防護設備(如UPS、突波吸收器⋯等)及評估購買產險，請查照。 全系所公告 60 2025-01-17 【國立臺灣大學】 書函 主旨：本校114年度編制內公務人員、技工友及本校校聘人員管理要點所稱之校聘人員寒休2日排定於114年1月24日(星期五)及同年2月3日(星期一)，請查照並轉知所屬。 全系所公告 110 2025-01-14 【有限責任國立臺灣大學員生消費合作社】 函 主旨：惠請各單位教職員生社員推薦本社理監事候選人，俾供社員代表大會選舉本社第19屆理監事，敬請公告週知。 全系所公告 97 2025-01-13 【徵才】 NVIDIA 台灣校園招募最新職缺資訊分享 全系所公告 639 2025-01-02 【國立臺灣大學】 書函 主旨：有關本校雙語教育中心英語編修軟體Grammarly.com帳號使用權限，自114年1月6日起受理「編制專任教師」、「專案教師」、「職員(院系所或學校行政單位之職員)」、「博士生(不含外籍選讀生、交換生)」及「碩士生」申請，收件至114年5月31日止，請查照。 全系所公告 177 2024-12-31 【國立臺灣大學】 函 主旨：113學年度第1學期第2次教務會議紀錄及相關附件已置入教務處之網頁(https://www.aca.ntu.edu.tw/w/aca/SecretariatNews_24121219252700315)，請逕行下載參考，並就案內與貴單位有關事項，按照本次會議之決議辦理，請查照。 全系所公告 130 2024-12-25 【有限責任國立臺灣大學員生消費合作社】 函 主旨：本社第十九屆社員代表選舉將於2024年12月23日(一)開放登記，惠請各單位教職員生社員踴躍登記參選，敬請公告週知。 全系所公告 154 2024-12-25 【國立臺灣大學】 函 主旨：檢送本校新修正之「勞保、健保及勞退金每月個人與單位負擔費用對照表」1份，並自114年1月1日起適用，請查照並轉知所屬配合辦理。 全系所公告 207 1 2 3 4 5 下一頁 最後 $('.i-annc__table').each(function(){ if($(this).find('thead').length!=0 && $(this).find('td').length!=0 && !$(this).hasClass('dataTable')){ $(this).DataTable({ searching: false, paging: false, ordering: false, info: false, autoWidth: false }); } });;"
