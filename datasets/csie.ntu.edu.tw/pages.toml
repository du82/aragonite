title = "獎學金 113學年度傅鐘獎學金申請開始 至8 26止 | 國立臺灣大學資訊工程學系"
full_description = "【獎學金】113學年度傅鐘獎學金申請開始(至8/26止) 2024-08-19 周承滿 113學年度傅鐘獎學金申請開始(至8/26止) 詳細申請資格及相關辦法請參考附件。 一、獎勵對象 本國境內、海外臺灣學校及大陸地區臺商學校高中應屆畢業學生 經本校學士班錄取且符合下列資格之一者，得申請本獎學金: (一) 入學成績優異。 (二) 曾獲國際重要競賽獎項。 (三) 有其他優秀表現。 二、申請方式 1. 欲申請同學請於8月26日(一)前，將電子檔Email至cmchou@csie.ntu.edu.tw 周承滿小姐收。 2.所有申請表件請整合為一個PDF檔，勿分成數個檔案，檔案名稱請註明申請資工系傅鐘獎學金-000(姓名)。 3.申請表件寄出前，請檢查資料是否完整，逾期不受理任何補件。 如尚有疑問，請洽cmchou@csie.ntu.edu.tw，或來電(02)33664888#250 周承滿小姐。 國立臺灣大學傅鐘獎學金設置要點 113學年傅鐘獎學金申請書"
