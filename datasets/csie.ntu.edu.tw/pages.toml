full_description = "【活動】2025 聯發科技 | Girls Tech! 聯發程式女孩_3/8 台大首場 2025-02-24 白師瑜 2025 聯發科技 | Girls Tech! 聯發程式女孩 好好分享會—學姊的職場實戰經歷 親愛的學妹們，妳是否對未來的職涯充滿疑惑？是否渴望了解科技業的真實面貌？現在，機會來了！ 特邀嘉賓：聯發科技優秀學姐將親臨現場，分享她的職涯規劃與成長故事，帶妳深入了解科技業的職場生態，並為妳解答所有疑惑！ 快把握 2025 聯發暑期實習機會，提早獲得加入聯發科技的入場票!!! 活動對象 邀請對半導體產業有興趣、大學或研究所就讀電機、電子、資工、電腦科學等科系之女性 報名辦法 掃描eDM報名QR Code或點選報名連結，填寫完畢即完成報名 因現場活動名額有限，主辦單位將保留報名之審核權利，恕不開放現場報名 活動前一週將透過報名信箱通知審核結果，有收到審核結果才視為有效報名 活動內容"
