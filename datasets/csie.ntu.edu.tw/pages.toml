title = "獎學金 113學年度蕭捷明先生紀念永續清寒獎助學金申請開始 3 21止 | 國立臺灣大學資訊工程學系"
description = "113學年度蕭捷明先生紀念永續清寒獎助學金"
full_description = "【獎學金】113學年度蕭捷明先生紀念永續清寒獎助學金申請開始(3/21止) 2025-02-27 周承滿 113學年度蕭捷明先生紀念永續清寒獎助學金 一、設置宗旨：蕭捷明與蕭鄭蘩生夫婦於上世紀初遷居香港落地生根，胼手胝足，歷經風霜先後離世。設獎人蕭先生未能全意報答親恩，又遙想當年憑一己節儉勤奮之志遂完成大學學業；為感念雙親劬勞之恩，如今尚有餘力,欲想扶助本校理、工、電資學院清寒學子發揮所長，立足社群、造福社會，故特設置本清寒獎助學金。 二、獎助對象：本校理、工、電資學院大學部2年級以上在學學生(不含延畢、休學、轉學生與研究所)且家境清寒未享公費待遇，學業成績GPA3.38以上、無懲處記錄者。 三、名額與獎助金額：理、工、電資學院每學院各5名、每名新臺幣2萬1千元。 四、繳交文件： （一）校內用申請書1 份。 （二）本校前一學年成績單正本、獎懲紀錄證明 （三）學生證影本加蓋當學期註冊圓戳章。 （四）全家人3 個月內戶籍謄本正本。 （五）政府低收或中低收清寒證明正本(如無者則一律檢附全家人前一年國稅局或稅捐處所得資料清單正本或有國稅局浮水印之影本）。 有興趣申請同學請於3月21日(星期五)前送系辦周小姐處。 蕭捷明先生紀念永續清寒獎助學金辦法 一般用獎學金申請書"
