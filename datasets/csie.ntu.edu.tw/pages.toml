title = "國立臺灣大學電機資訊學院資訊學群徵聘教師公告 2025 | 國立臺灣大學資訊工程學系"
full_description = "國立臺灣大學電機資訊學院資訊學群徵聘教師公告(2025) 2024-07-08 陳雅琳 【國立臺灣大學電機資訊學院資訊學群 徵聘教師】 徵聘單位： 電機資訊學院 資訊學群 (含資訊工程學系、資訊網路與多媒體研究所及生醫電子與資訊學研究所生醫資訊組) 職稱及名額：專任助理教授、副教授、教授若干位 申請期限：即日起。(預定114年2月或8月起聘) 徵聘名額與資格: 具資訊工程或相關領域博士或同等學位，並對教學、研究與服務有高度熱忱之學者。本學群歡迎從事各種資訊相關領域與申請各種職級（助理教授、副教授、教授）的申請者。 各種資訊科技相關領域 名額：若干名 檢具文件： 必要文件 求職信(Cover letter) 個人履歷表(Curriculum Vitae) 研究計畫(Research statement) 教學計畫(Teaching statement) 著作目錄(Publication list) 推薦函(Reference letters)三份以上(由推薦人直接上傳至系統) 其它文件(選擇性提供) 代表著作(Representative papers)至多三篇 其他有利審查資料(Any other PDF-formatted supporting materials) 申請方式： 請將上述申請資料上傳系統。(網址：https://academicjobsonline.org/ajo/jobs/27828) 聯絡人：鄭文皇教授 Email：faculty_search@csie.ntu.edu.tw 遴選過程說明： 由系所組成遴聘小組進行資料初核，專長符合者通知面試、著作送審、視情況試教等，提三級教評會審議，通過後致聘。 隨到隨審，鼓勵儘早申請，將採分批作業方式處理。 申請人繳交之徵聘資料，僅供本系執行聘任等相關作業使用，聘任案結束後，所有人事資料將定期銷毀。應徵資料恕不退還，如需返還請註明。 備註： 資訊學群系所簡介及相關研究領域，請參閱 資訊工程學系 https://www.csie.ntu.edu.tw/ 資訊網路與多媒體研究所 http://www.inm.ntu.edu.tw 生醫電子與資訊學研究所 http://www.bebi.ntu.edu.tw 各職級教師薪資除教育部每月本薪及學術研究費之外，資格符合者另可申請教育部玉山(青年)學者計畫、科技部年輕學者專案計畫，及本校獎勵新聘特殊優秀人才、教研人員彈性加給、教研人員教學研究額外加給等補助，相關資訊請參考台大教師手冊 (http://event.ntu.edu.tw/facultyhandbook/)。 各項補助方案參考資訊 教育部玉山計畫 詳見https://yushan.moe.gov.tw/TopTalent/Home/Intro 臺大新聘教師薪資（含彈性薪資）說明 http://bit.ly/ntusalary 電機資訊學院另額外設置有新進教師學術勵進獎勵要點，依規定支領每月獎勵，至多三年，延攬優秀人才。"
