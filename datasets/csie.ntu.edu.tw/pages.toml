["http://www.csie.ntu.edu.tw/~ming"]
title = "Ming Ouhyoung"
full_description = "ADDR: Dept. of CSIE, NTU , 1 Roosevelt Rd. Sec. 4, Taipei, 106 Taiwan Fax: +886-2-2362-8167 my email http://www.csie.ntu.edu.tw/~ming Ming Ouhyoung received BS and MS degree in electrical engineering from National Taiwan University, Taipei, in 1981 and 1985, respectively. He received Ph.D degree in computer science from the university of North Carolina at Chapel Hill in Jan. 1990. He was a member of the technical staff at AT&T Bell Laboratories, Middle-town, during 1990 and 1991. Since August 1991, he has been an associate professor in the department of Computer Science and Information Engineering, National Taiwan University. Then since August 1995, he became a professor, and retired on 8/2020. Now, he is an adjunct professor. He was the Director of the Center of Excellence for Research in Computer Systems, College of Engineering, from August 1998 to July 2000, and was the Chairman of the Dept. of CSIE from August 2000 to July 2002. He was the associate dean of College of EECS (2012-2015). He has published over 100 technical papers on computer graphics, virtual reality, and multimedia systems. He is a senior member of ACM and member of IEEE. PhD(1/1986-1/1990), CS, University of North Carolina at Chapel Hill, (Dissertation title: Force Display in Molecular Docking) Professor, Department of Computer Science and Information Engineering (8/1995~7/2020)� retired since 8/2020 Associate Dean, College of Electrical Engineering and Computer Science (8/2012~2015/7;� 8/2005~7/2007)"
