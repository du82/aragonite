title = "獎學金 113學年度王榮騰與張華茹夫婦紀念何宜慈博士獎學金申請開始 9 20止 | 國立臺灣大學資訊工程學系"
full_description = "【獎學金】113學年度王榮騰與張華茹夫婦紀念何宜慈博士獎學金申請開始(9/20止) 2024-09-04 周承滿 113學年度王榮騰與張華茹夫婦紀念何宜慈博士獎學金申請開始(9/20止) 一、名額與金額: (一)「何宜慈博士紀念獎學金」:電資學院在學之大學部三、四年級生，名額4名，每名全年獎學金三萬元整。 (二)「王榮騰與張華茹夫婦紀念何宜慈博士獎學金」: 電資學院在學之大學部三、四年級生，名額2名，每名獎學金三萬元整。 二、申請資格: 電資學院在學之大學部三、四年級生(以9月開學後年級為準) 歷年學業等第績分GPA 3.38(或百分制80分)以上 有意願出國攻讀學位者優先。 三、申請文件: (請檢附下列文件各一份) (一) 申請書(如附件) (二) 歷年學業成績單正本 (三) 教授推薦函 (四) 學術(專題)研究成果或其他榮譽事項等之相關文件。 其他相關事宜請參見附檔，有興趣申請的同學，請於9/20(五)前 送至資訊系辦周小姐處。 國立臺灣大學電機資訊學院王榮騰與張華茹夫婦紀念何宜慈博士獎學金永續基金設置辦法 國立臺灣大學電機資訊學院何宜慈博士紀念獎學金設置辦法 何宜慈博士紀念獎學金申請書"
