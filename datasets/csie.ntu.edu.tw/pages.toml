title = "Professor Yi-Ping Hung"
full_description = "Professor Graduate Institute of Networking and Multimedia Department of Computer Science and Information Engineering National Taiwan University CSIE Building Room# 433 Yi-Ping Hung received his B.Sc. in Electrical Engineering from the National Taiwan University in 1982. He received an M.Sc. from the Division of Engineering, an M.Sc. from the Division of Applied Mathematics, and a Ph.D. from the Division of Engineering, all at Brown University, in 1987, 1988 and 1990, respectively. He is currently a professor in the Department of Computer Science and Information Engineering at the National Taiwan University. From 1990 to 2002, he was with the Institute of Information Science, Academia Sinica, Taiwan, where he became a tenured research fellow in 1997. He served as a deputy director of the Institute of Information Science from 1996 to 1997, and received the Young Researcher Publication Award from Academia Sinica in 1997. His current research interests include computer vision, pattern recognition, image processing, virtual reality, multimedia and human-computer interface."
