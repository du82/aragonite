description = "國立臺灣大學資訊工程學系接受外系學生修讀雙主修辦法"
full_description = "國立臺灣大學資訊工程學系接受外系學生修讀雙主修辦法 2023-03-23 周承滿 學生事務 國立臺灣大學資訊工程學系接受外系學生修讀雙主修辦法 八十四年十一月二十四日系務會議通過 九十一年六月十四日系所務會議通過 100年9月22日臨時系務會議通過 第一條 國立台灣大學電機資訊學院資訊工程學系（以下簡稱本系）為確立外系學生加修本系為雙主修之審查標準，特訂定本辦法。 第二條 外系學生加修本系為雙主修之審查，由本系招生委員會處理之。 第三條 凡本校大學部學生，其前一學年成績平均達八十分或等第績分平均GPA達3.38以上，或成績名次在該班學生人數前百分之十以內，得自二年級起至最高修業年級第一學期止（不包括延長修業年限），申請加修本系為雙主修。 第四條 外系學生加修本系為雙主修之申請，需於本系規定之期限內辦理，逾期不予受理。 第五條 外系學生加修本系為雙主修，錄取名額與轉系生及輔系生合計，總人數以不超過本系原核定新生名額百分之二十為原則。審查方式及錄取名額由本系招生委員會決定並公佈之。 第六條 修讀雙主修學生應滿足本系大學部學生全部專業科目之規定(含必修專業科目、選修專業科目最低學分)。專業科目規定異動時，以雙修生申請年度入學之大一新生規定為準。 第七條 本辦法未規定事項，依「國立臺灣大學學士班學生修讀雙主修辦法」處理之。 第八條 本辦法經本系系務會議通過，報經校方核備通過後實施，修正時亦同。 國立臺灣大學轉系、輔系及雙主修相關規定查詢網頁"
