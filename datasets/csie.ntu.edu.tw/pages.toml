full_description = "【研究所】 113學年度第2學期 資訊工程研究所博士班 資格考核 相關日程(研究能力考核報名：2/17~2/21) 2025-01-23 蘇誼嫻 g 資格考核 ─ 基本課程考核 一、相關規定：完成基本課程考核者(即通過四科者)，請填妥附加檔案之「基本課程考核抵免申請書」，並檢附歷年成績單正本，送交系辦公室查核。 ------------------------------------------------------------------------------------------------------- g 資格考核 ─ 研究能力考核 一、報名日期：114年2月17日(一) ~ 2月21日(五)止 二、考試時間：114年3月14日(五) 三、報名方式：請填妥附加檔案之「研究能力考核申請書」，經指導教授簽核後，送交R205系辦公室。 四、相關規定： 1. 考生應於審查會兩週前提交以英文撰寫之研究報告；報告格式不拘，可參照 如journal paper或conference paper。 2. 考生應於114年3月3日(一)中午12:00前將英文研究報告、CV、歷年成績單、簡報等電子檔email至 yihsien@csie.ntu.edu.tw。 ※重要提醒： 一. 逾期不受理。 二. 學生提交研究能力考核申請後，若未於公告期限內繳交研究報告者，視為資格考研究能力考核未通過一次。 ※學生應於入學三學年(含休學期間)內完成基本課程考核及通過研究能力考核，未於期限內通過者， 予以退學。相關注意事項請參照：https://www.csie.ntu.edu.tw/Education/Announcement2/-85779176 。 基本課程考核抵免申請書.docx 研究能力考核申請書.docx"
