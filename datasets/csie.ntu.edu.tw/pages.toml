title = "競賽資訊 人人都可參加的黑客松 Hack to the Top AI x 金融創新黑客松 | 國立臺灣大學資訊工程學系"
full_description = "【競賽資訊】人人都可參加的黑客松：Hack to the Top AI x 金融創新黑客松 2025-02-08 白師瑜 我們即將舉辦第一屆結合 AI 與金融的創新黑客松！ 這是一個可以讓學生發揮創意、展現實力，並與業界頂尖專家交流學習的機會。 相較於過去的黑客松競賽，本次競賽因應 AI 技術快速進步。 所以競賽也鼓勵學生使用 AI 輔助開發，組合不同的數位工具， 即使不會寫程式，也有機會參賽獲得獎項！ 本次競賽還有邀請產學界的重量級專家擔任評審， 包括台大教授柯冠州、TNL Mediagene 技術長李致緯等 學生們將有機會與這些頂尖人物近距離交流，拓展視野！ 為了鼓勵更多創新解決方案，比賽總獎金高達 23 萬元，第一名更能獲得 10 萬元的高額獎金！ 我們相信，這將是學生們展現才華、累積經驗的絕佳機會。 活動詳情與報名連結：https://haoqi.one/C8LdE --"
