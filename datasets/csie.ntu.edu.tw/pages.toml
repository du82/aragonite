title = "國立臺灣大學資訊工程學系臺大校長獎施行細則 | 國立臺灣大學資訊工程學系"
description = "本系臺大校長獎施行細則，已於112.12.25 112學年度第1學期系務會議修訂通過，自發布日公告施行。"
full_description = "國立臺灣大學資訊工程學系臺大校長獎施行細則 2023-03-23 周承滿 學生事務 國立臺灣大學資訊工程學系臺大校長獎施行細則 111.07.15本系110學年度第2學期第1次系務推動委員會通過 111.08.30本系111學年度第1學期第1次臨時系務會議通過 112.11.24本系112學年度第1學期第1次系務推動委員會通過 112.12.25本系112學年度第1學期系務會議修訂通過 第一條 國立臺灣大學資訊工程學系(下稱本系)，為提升學生學習風氣，鼓勵學業或資訊專業優良表現，依據臺大校長獎設置辦法第五條，訂定本施行細則。 第二條 申請資格為本系學士班學生，且具有下列條件之一: (一) 前一學年排名在前20%以內。 (二) 參與國內外重要競賽表現優異榮獲獎項，經本系教師推薦者。 (三) 於國內外資訊相關研討 會期刊等發表傑出學術成果，經本系教師推薦者。 第三條 獎勵名額由本校教務處依臺大校長獎設置辦法核定之。 第四條 申請人應於規定期限內，檢具下列文件提出申請: (一) 申請表。 (二) 歷年中文成績單正本。 (三) 歷年各學期名次證明書。 (四) 獎懲證明。 (五) 其他優良表現證明。 (六) 以第二條第二項或第三項資格申請者，需檢附本系教師推薦信至少一封。 第五條 由本系副主任及大學部教務老師組成審查小組，綜合考量決定獲獎者， 原則上以高年級為優先。 第六條 各年級獲獎人數依申請情況由審查小組統籌分配之，但總獲獎人數不得超過第三條之獎勵名額。 第七條 本細則如有未盡事宜，悉依本校相關規定辦理。 第八條 本細則經本系系務推動委員會及系務會議通過後，自發布日施行。 國立臺灣大學資訊工程學系臺大校長獎施行細則1121225"
