title = "國立臺灣大學資訊工程學系學生成績優良獎勵同分參酌順序要點 | 國立臺灣大學資訊工程學系"
full_description = "國立臺灣大學資訊工程學系學生成績優良獎勵同分參酌順序要點 2023-03-23 周承滿 學生事務 國立臺灣大學資訊工程學系學生成績優良獎勵同分參酌順序要點 100.03.01課程委員會會議通過 107.06.12 課程委員會修訂通過 107.06.28 系務會議修訂通過 110.04.14 課程委員會修訂通過 110.07.02 系務會議修訂通過 112.05.18 課程委員會修訂通過 112.06.02系務會議修訂通過 113.12.12 課程委員會修訂通過 114.01.07系務會議修訂通過 一、本要點依據「國立臺灣大學學士班學生成績優良獎勵要點」訂定。 二、同年級受獎名額最後一名有二人（含）以上等第績分平均（或百分制學業平均）相同之情況時，參酌順序如下： (一)當學期所修習本系開授系訂必修科目成績平均較高者。(大三、大四不適用) (二)當學期所修習本系開授選修科目成績平均較高者。(大三、大四不適用) (三)當學期所修習本系開授之課程總學分較多者。 (四)當學期所修習總學分較多者。 (五)已修畢歷年之本系開授課程總學分數較多者。(抵免學分不計入) (六)已修畢歷年之總學分數較多者。(抵免學分不計入) 三、若上述結果仍相同時，則簽請校方增額獎勵。 四、本辦法未盡事宜悉依本校「國立臺灣大學學士班學生成績優良獎勵要點」規定辦理。 五、本要點經系務會議通過後，自發布日施行。 國立臺灣大學資訊工程學系學生成績優良獎勵同分參酌順序要點1140107"
