description = """
【 2025 Epoch School 人才培育計畫 】
.
想參與 MIT、UC Berkeley、Stanford 的交流嗎？
想跟新創有最近距離的接觸嗎？
想來一場痛快的創業經歷嗎？
.
第一次實習鍛練、第一次創業實戰，
眼界大開、改變人生的海外參訪等著你！
學長姊遍"""
full_description = "【活動】 2025 Epoch School 人才培育計畫 2024-11-21 宋欣薏 【 2025 Epoch School 人才培育計畫 】 . 想參與 MIT、UC Berkeley、Stanford 的交流嗎？ 想跟新創有最近距離的接觸嗎？ 想來一場痛快的創業經歷嗎？ . 第一次實習鍛練、第一次創業實戰， 眼界大開、改變人生的海外參訪等著你！ 學長姊遍及全球，國際級資源助你探索未來； 不限科系經驗，歡迎大二以上、19-24 歲的你，來一場有人挺你的冒險！ 加入 Epoch School： 【 未來國際經理人實習 】 確實掌握產業經濟脈動、世界級實驗室最新研究，也接觸各國新創、社群經營，還有經驗豐富的業師提供職涯諮詢。 【 未來創業人 】 實戰模擬新創初期的產品開發、商業模式、市場分析及驗證、財務預估，在業師及輔導長支持下，持續迭代創業計畫。 參與校園小聚： 政大場｜11/25（一）19:00-21:30 政治大學 大勇樓 210201 淡江場｜11/27（三）19:00-21:00 地點待定 立即報名：https://twepoch.org/sheet （其他場：清大、陽交大） 重要連結： 申請截止｜12/2 中午 12:00 申請官網｜https://twepoch.org/uGW7B LINE 小窩｜https://twepoch.org/Line_Community 學長姊諮詢｜https://twepoch.org/1_on_1_meeting 粉絲專頁｜https://twepoch.org/hw513"
