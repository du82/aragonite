title = "行政公告(教職員工) | 國立臺灣大學資訊工程學系"
full_description = "行政公告(教職員工) 張貼日期 標題 瀏覽人次 2025-02-27 【國立臺灣大學】 書函 主旨：為促進全校教職員工職場健康管理，環安衛中心設有每個月免費職場健康諮詢門診，提供健康檢查說明及職場健康相關議題諮詢，請查照。 5 2025-02-27 【國立臺灣大學】 函 主旨：自即日起至114年12月31日止，本校計資中心將針對本校一二級行政主管、編制內人員及校聘人員進行電子郵件警覺性演練，請轉知所屬人員，請查照。 5 2025-02-27 【國立臺灣大學】 書函 主旨：國家科學及技術委員會(下稱國科會)114年度「智慧醫療產學聯盟計畫」自即日起受理申請，其校內截止期限及申請方式請依說明二辦理，逾期不予受理，請查照轉知。 7 2025-02-27 【國立臺灣大學】 書函 主旨：函轉國科會114年第1期「補助國內舉辦國際學術研討會」申請資訊如附件，請查照轉知。 6 2025-02-27 【國立臺灣大學】 書函 主旨：為辦理114學年度本校「Garmin講座暨Garmin學者」遴聘事宜，請貴單位遴選合適人選，經院級會議審議通過後，填具本校「Garmin講座」推薦表或「Garmin學者」推薦表，於114年4月30日(星期三)下午5時前逕送秘書室，俾利彙整後提送本校「Garmin講座暨Garmin學者」審議委員會審議，請查照。 6 2025-02-24 【國立臺灣大學】 函 主旨：為辦理114年3月多房間職務宿舍分配作業，請查照並轉知所屬同仁。 13 2025-02-24 【國立臺灣大學】 書函 主旨：國家科學及技術委員會(下稱國科會)與越南科技部(MOST)共同徵求「2026年雙邊協議國際合作研究計畫(3年期)」，校內作業時程如說明二，逾期恕不受理，請查照轉知。 13 2025-02-19 【國立臺灣大學】 函 主旨：113學年度第2學期子女教育補助費自114年2月17日起至同年4月2日止受理申請，請轉知所屬編制內專任之教職員工，請查照。 23 2025-02-19 【國立臺灣大學】 書函 主旨：轉知國家科學及技術委員會公開徵求「114年行政院傑出科技貢獻獎選拔案」，申請方式及校內截止期限詳如說明，請查照。 28 2025-02-19 【國立臺灣大學】 函 主旨：配合教育部114年電子郵件社交工程演練之要求，敬請各單位轉知所屬主管、編制內人員及校聘人員於114年3月5日中午以前上網報名教育訓練課程，請查照。 24 1 2 3 4 5 下一頁 最後 $('.i-annc__table').each(function(){ if($(this).find('thead').length!=0 && $(this).find('td').length!=0 && !$(this).hasClass('dataTable')){ $(this).DataTable({ searching: false, paging: false, ordering: false, info: false, autoWidth: false }); } });;"
