full_description = "【大學部】112學年度臺灣大學學士班學生論文獎申請(4/1~4/30止) 2024-03-01 周承滿 學生事務 112學年度臺灣大學學士班學生論文獎 (1) 申請時間: 113/04/01~113/04/30 ​(2) 申請辦法及程序請參考​​教務處「學士論文獎專區」 https://www.aca.ntu.edu.tw/w/aca/UAADService_21070518511474325 (3) 口試注意事項: 有意申請之同學，請最晚於4/15(一)前，填寫附件的「資工系學士論文口試申請書」，經指導教授簽名後，向系辦周承滿小姐提出口試申請​，會由系辦製作口試所需的相關表單，並安排口試場地借用。​ (4) 完成口試後於113/4/30(日)截止前於線上系統送出申請，並將論文紙本等資料於5/2(四)前送達系辦公室周承滿小姐處。 112學年資工系學士論文口試申請書"
