full_description = "From: 清大彭明輝教授部落格牛津大學東方研究所也曾有一位韓國藉博士生在口試結果發表後自殺。事實上口試委員並沒有裁定他「不及格」，而是要他修改論文。在英國的學術傳統裡，口試委員一定會要求研究生修改論文。如果讓學生一字不改地畢業，通常被看成是兩種可能之一：學生的程度高到無法令人置信（絕不犯任何錯），或者口試委員混到連一個錯都找不到。但是愛面子的東方學生卻不一定能理解這種文化。"
