full_description = "【研究所】重複修習名稱相同之科目依學則不計入畢業學分 2022-08-16 依「國立臺灣大學學則」： 第十六條重複修習已修讀及格或已核准抵免名稱相同之科目，重複修習之學分不計入應修最低畢業學分數內。但各學系另有規定者，不在此限。 故提醒同學： ▪ 如電機系「機器學習」和本系「機器學習」因課名完全相同而無法同時計入本系最低畢業學分24學分。 ▪ 本系人工智慧碩士班必修課程和博士班資格考課程必須修習本系開設課程。"
