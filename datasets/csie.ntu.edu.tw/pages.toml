title = "逕行修讀博士學位 | 國立臺灣大學資訊工程學系"
full_description = "逕行修讀博士學位 2022-12-08 蘇誼嫻 n 申請資格： 學生逕行修讀博士學位辦法 第三條 國立臺灣大學系統應屆畢業學士班在學生及修業一學期以上碩士班在學研究生，經肄業(或相關)學系、所、學位學程助理教授以上二人推薦為具有研究潛力，並同時具備下列條件之一者，得申請逕行修讀博士學位。 （一）修業期間學業成績總平均排名在該系、所、學位學程全班(組)人數前三分之一以內。各學系、所、學位學程得以必修科目學業成績總平均作為排名之依據，亦得為更嚴格之規定。 （二）因其他特殊情形，經擬逕修之學系、所、學位學程評定為成績優異者。 n 申請時間：同博士班甄試及入學考報名時間。(請詳見當學期公告) n 申請辦法：備妥規定資料至R205系辦公室蘇小姐處提交申請 n 報名審查資料： 逕行修讀博士學位申請書一份 在學證明 大學及碩士班歷年成績單(含名次證明) 研究計畫 著作或其他有助於審查之資料 助理教授以上二人推薦函 n 口試：符合資格者應配合本系安排口試。(請詳見當學期公告) ※相關獎助金：國科會博士生研究獎學金、教育部博士生獎學金 國立臺灣大學學生逕行修讀博士學位辦法.pdf"
