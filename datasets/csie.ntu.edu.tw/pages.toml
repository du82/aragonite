title = "系史 | 國立臺灣大學資訊工程學系"
description = """
草創時期



　資訊工程學系成立於1977年，首先招收大學部學生，1981年成立研究所，招收碩士班學生，博士班則成立於1984年，從而建立起完整的高級資訊工程教育研究體系。

　1977年，台大正式成立「資訊工程學系」，招收第一批40名的優秀學生，這個呵護與創作國內外電腦資 訊業尖兵的搖籃就正式誕生，展開她生生不息，「十年樹木，百年樹人」的教育工作。
 

　成立之初，系主任是李"""
full_description = "瀏覽人次: 25155 h3.page-module-title br { display: none; } 系史 草創時期 資訊工程學系成立於1977年，首先招收大學部學生，1981年成立研究所，招收碩士班學生，博士班則成立於1984年，從而建立起完整的高級資訊工程教育研究體系。 1977年，台大正式成立「資訊工程學系」，招收第一批40名的優秀學生，這個呵護與創作國內外電腦資 訊業尖兵的搖籃就正式誕生，展開她生生不息，「十年樹木，百年樹人」的教育工作。 成立之初，系主任是李學養教授。在他及其他幾位教授的熱心鼓吹之下，本系方得以在台大成立。其中 貢獻最大的，應是李學養教授及吳建平教授，當時兩位都是電機系的教授，吳教授同時擔任台大計算機 中心的主任。他們於校務會議上提出設立「計算機工程學系」的構想，希望在那時僅有的電機系計算機 組之外，另闢一個專屬計算機的研究園地，以面對國內已到來的資訊時代。終於以「資訊工程學系」之 名通過，並在1977年奉准正式招生。 成立初，本系沒有自己的教室、設備，只有系主任，40名學生，一位助教及一位專任老師(這位老師就是 現在的許清琦教授，當時許老師仍在電機系博士班，由電機系轉至資訊系任講師) 。系主任向電機系「借」了一間座落於工學院大樓二樓的實驗室，作為系辦公室。就這樣，助教和另一 位聘請來的職員，面對面坐在辦公室;隔一道屏風，系主任坐鎮於屏風後，沒有任何電腦設備、電子研究 器材、40名學生、系主任、許老師開始了這清苦的創系第一年。由李主任教「計算機概論」，許老師則 帶「程式語言設計」(主要是教福傳)。當時計算機中心換下舊有的CDC-3150電腦(是用批次處理的機器) ，改上UNIVAC 1100新型機器。同學們的程式作業，需在舊的工學院二樓打卡室排隊打好，拿到舊的電機系系館讀卡， 待機器將資料及程式讀入後，再到4樓領取報表。卡片如有任何些微錯誤，都會被剔除，整個程序重新來 過。一個作業順利的話，需要一個星期的時間才能完成。在中心主任吳建平教授的鼎力相助之下，第一 屆的學長雖然沒有自己的設備，尚勉強能用得到電腦上機。 1978年5、6月，系上才好不容易有了第一部屬於自己的機器，共斥資30餘萬元，向當時也是初成立的宏 碁公司購買了一部八位元的微電腦，CPU是Z-80，屬小型單機單使用者的電腦，有一台印表機，一台終端 機，比起現在最普遍的PC效率還差。放在系辦公室的暗房內，由助教負責排上機次序，40多人，合用這 部微電腦，同時還用它來做研究計畫，情形可想而知。然而對於資訊系師生而言，畢竟是屬於自己的第 一套設備，意義十分重大。 第二年仍然招40名學生，由於第一屆已是二年級，各重要必修科都需要專任老師，劉睦雄教授由數學系 過來，而劉寶鈞教授，于惠中教授、吳建平教授、劉乃誠教授都在那時，以與電機系合聘的方式，開始 在本系任教。 由於教授開始多了，部分教授由於不是與電機系合聘，而沒有自己的研究室，系主任在1979年，向慶齡 工業中心借了二個房間，作為老師的研究室。系上的許清琦、劉睦雄、湯耀中、林逢慶老師都曾在那邊 待過一段時日。另外，當時的電子實驗，也都是在工業中心借來的房間做的。今天大家在邏輯實驗室所 見的部分較舊的電子設備，就是當時在那邊添購的，微電腦陸續又買進幾部。 1981年，第一屆學生畢業，資訊工程研究所也同時成立，大致到這時侯，辛苦創立的資訊系方才有了一 個規模，雖然一切都很簡陋，但至少努力是沒有白費，同時也為未來的飛快進步奠下了基礎。 終於在1982年8月，系館建成遷入，資訊系進入另一個階段。事實上，早在1982年3月，本系第一臺較大 的電腦prime-750就購入了，但是由於沒有地方放置及管理，當時暫借機械系志鴻館，直到9月份系館完 工，才遷入現在系館四樓的位置。 這段遷入系館，規劃使用的日子，多虧一群年輕的助教，才得以順利完成。現在大家所使用的終端機室 ，每一個座位都有隔間，空間寬敞，就是當初老師們希望提供給同學一個優良的上機環境而用心規劃出 來的。剛來的時候，各個機器的連接線雖然都是事先設計好的，但真正把每一條線拉到實驗室、機房的 辛苦工作，全是那時侯助教親手完成的。每間實驗室電氣設備必須有接地線，整棟系館的接地線用一塊 大銅板連接，埋在系館前，石子路的地下，這大的銅板，也是助教們自力完成的產品。 事實上，由於創立之初裝備器材、空間均不充裕，助教在系上一段比較清苦的日子裏的貢獻是功不可沒 的。系辦公室在工學院大樓時，只有一位助教，一位職員及系主任，主任每天要上課、開會，大多數的 時間，可以說都是助教坐鎮，同學選課、上機排班、改作業、成績，大大小小的事，多由助教一手包辦 ，甚至第一屆同學入學的迎新也是助教所策劃的。遷入系館時，在工業中心的設備，助教們雇卡車，一 車車地搬來系館。 可以說，在同學與老師之間，這群認真優秀的年輕助教，使資訊系能夠上下配合，在短短十年內呈幾何 級數的成長。居功厥偉，應該是恰當的讚美吧！這群助教畢業後，成就亦都可觀。 成長時期 一九八三年，李琳山教授接任資訊系第二任系主任。隨即進行籌設博士班，案經學校通過後報部同意， 並於次年開始招收博士新生。同時成立「人工智慧實驗室」，全面推動人工智慧領域之研究，擬定「人 工智慧群體研究五年計劃」，為全國第一件人工智慧群體研究計劃，引進足夠研究經費，對資訊系的研 究發展有著深遠的影響。 一九八五年，許舜欽教授率領學生參加國際電腦圍棋大賽囊括冠亞軍，轟動國內資訊界。當時李教授鑑 於本系專任教師的不足，極力爭取本系師資，於一九八七年間，先後增聘了劉長遠、吳家麟、傅立成、 陳文進、陳健輝、游張松、賴飛羆等七位專任教師。一九八八年，游張松教授轉任本校資管系並兼任第 一屆系主任，而開國內電腦網路研究之先河的黃肇雄教授，則亦於同年加入本系，強化了資訊工程學系 的師資陣容。李教授於一九九一年至一九九七年間，借調中央研究院資訊所擔任所長一職，增加本系與 中研院資訊所間的互動關係。 一九八七年，林逢慶教授接任第三任系主任，除了爭取「平行計算群體研究計畫」，為本系第二個大型 研究計畫，全面推動高速計算之研究，一九八八年五月，李登輝總統到本系視察，對本系研究成果至表 滿意。因系所的規模日漸擴大，空間已不敷所需，開始規劃與籌建資訊新館，於一九八九年十月立法院 通過工程經費預算，總面積約1,600坪。林教授於一九九四年至一九九八間借調台北市政府擔任建設局長 一職。目前林教授擔任財團法人資訊工業策進會執行長一職，將本系之影響力帶至全國。 一九九Ｏ年，林一鵬教授接任第四任系主任並兼任國科會資訊學門召集人一職，擴大本系與資訊學界影 響力。除了推動群體研究計劃與產學案之外，林教授並籌劃本系四個基本研究方向，即「高性能計算機 系統」、「電腦通訊及多媒體系統」、「人工智慧與中文資訊系統」與「平行程式語言與軟體發展環境 」四個研究方向，相關實驗室也陸續設立，開國內資訊領域群體研究之先河。 一九九二年本系主辦平行及分散式系統國際會議。隔年，即一九九三年，搬遷新系館。一九九四年八月 ，國科會在本系成立電腦系統研究發展重點中心，分別由林一鵬教授、項潔教授任第一、二任中心主任 。而後林教授又籌設工學院「計算機系統研究中心」，以整合本校計算機相關之研究與發展，並於一九 九六年立，由項潔教授任第一、二年主任，二年後項教授借調暨南大學科技學院院長，由歐陽明教授接 任中心主任。 一九九六年，許清琦教教授接任第五任系主任。同年，吳家麟教授借調暨南大學資訊系系主任、陳文進 教授借調暨南大學資管所所長職務，奠立了暨南大學與本系所的互動。一九九七年三月，本系學生六人 參加全世界ACM程式設計比賽榮獲全球第四名，此役擊敗史丹福、哈佛、MIT等世界一流大學，也是最早 解出六題的隊伍。同年年底本系舉辦ISPAN'97(國際平行架構演算法暨網路研討會)及PRFTS'97(太平洋地 區容錯計算機系統研討會)。 一九九九年一月，項潔教授接任國科會資訊學門召集人一職 (任職至二ＯＯ一年十二月)。一九九九年四月，Intel公司捐增儀器設備一批，本系成立「INTEL實驗室 」。當年五月，完成資訊系第一次教學評鑑，成效良好。同時開始規劃與設立碩士在職進修專班，並於 一九九九年招收第一屆學生。 一九九九年十月，教育部通過本系大學部增班案。緊接其後，本系又於二ＯＯＯ年八月，加入電機資訊 學院，與電機系並肩作戰，為全國電機資訊研究重鎮。在此期間，許主任更是大力協助爭取系館二期工 程預算案，並在任內完成初步規劃。 二ＯＯＯ年，歐陽明教授接任第六任系主任，陳信希教授擔任第一任副系主任。同年八月，電機資訊學院成立。由於資訊社會新世紀的演 變與需求，籌設二個新的研究所「資訊網路與多媒體研究所」、「生物資訊學研究所」。由於大學部於 二ＯＯＯ年八月，擴增為二班，以及研究設備的擴充，資訊館的空間已不敷所需，資訊館二期工程民間 捐款籌建規劃的工作已積極進行中。 二ＯＯＯ年至二ＯＯ一年，是個豐收的一年，在產學合作方面，本系黃肇雄教授依「國立台灣大學專任 教師任職或兼職營利事業機構或團體收取回饋金及分配辦法」，回饋台灣大學新台幣五百萬元，應聘至 訊連科技份有限公司兼任董事長職務，開風氣之先；在全世界學術競爭中，亦屢創佳績，如國際電子電 機工程師學會（IEEE Computer Society）舉辦的第一屆國際電腦設計競賽（CSIDC），本系六位同學參賽，榮獲全球第二名，並獲陳水 扁總統召見；二ＯＯＯ年九月，榮獲ＨＰ全球資訊應用家電設計大賽第二名；以及二ＯＯＯ年八月 主辦 13th Research on Computational Linguistics Conference (ROC LING 2000)與十月主辦The Tenth International Conference on Artificial Reality and Tele-existence (ICAT 2000); 二ＯＯ一年六月，IEEE舉辦第二屆國際電腦設計競賽（CSIDC），本系三位同學與電機系二位同學參賽， 榮獲全球第五名。上述均顯現了歐陽明主任極力推展資訊無國界之企圖心。 2002年8月陳信希教授擔任本系第七任系主任，郭大維教授擔任第二任副系主任， 積極推動各項系務。 由於資訊系大學部增班、資訊所碩士班錄取率每年均在10%以下、以及國家矽導計劃暨專案擴增增加師資員額(2002年、2003年、2004年、2005 年各獲核撥三名、二名、二名、和三名教師員額)等多重因素，學生人數近幾年快速增加。除了大學部在2004年四個年級都已經是雙班外，研究所招生人數，也 由2002年招收106位一般碩士生 、7位碩士專班生、25位博士生，增加到2005年159位一般碩士生、10位碩士專班生、36位博士生。招收研究生人數，三年內成長1.49倍。大學部 和研究生人數比率將近1:1，以93學年度(2004年)第一學期為例，研究生總人數已達421位，與大學部學生人數478位，相去不遠。 2003年6月本系系務會議通過，以校內組織調整方式成立「資訊網路與多媒體研究所」，網媒所並於 2004年8月開始招收博碩士班研究生，此時建立電資學院資訊學群完整一系多所的架構，資訊學群相關辦法也於2005年7月修定完成。2004年12月配 合教育部執行「擴大碩士級產業研發人力供給方案」，由資訊系和網媒所共同成立的「資訊產業研發碩士專班」春季班首度招生。 本系近年來增聘多位優秀師資，2002年8月洪一平教授、趙坤茂教授、周承復助理教授、逢愛君助理教授到 任；2003年2月顧孟愷助理教授到任；2003年8月朱浩華助理教授到任；2004年2月施吉昇助理教授到任；2004年8月莊永裕助理教授到 任；2005年2月呂學一副教授、洪士灝助理教授、吳樂群助理教授到任。同時，2002年8月林智仁助理教授升等為副教授；2003年8月劉邦鋒副教授升 等為教授；2004年8月林風助理教授、朱浩華助理教授、楊佳玲助理教授升等為副教授；2005年6月逢愛君助理教授、周承復助理教授獲院教評會通過升等 為副教授，向校教評會推薦。本系也在台大特聘研究講座辦法公佈之後，在2003年3月率先禮聘姚期智院士為首位特聘研究講座，隨後在2005年5月增聘李 文雄院士為第二位特聘研究講座，並在2008年12月增聘李德財院士為第三位特聘研究講座。 在研究整合上，除了鼓勵系內教師組成研究群，如網路與多媒體、智慧型空間、嵌入式系統暨無線網路等研究群外，並進行校內和校際研究整合。在2002年10 月開始執行教育部「推動研究型大學整合三年計畫」，本系規劃「資訊電子科技整合研究中心」第二分項計畫─多媒體整合實驗室，整合包括電資學院(資訊系、電 信所)、文學院(戲劇系、圖資系、語言所)、社會科學院(新聞所)、管理學院(資管系)等四個學院七個系所，從事媒體內容工程和媒體內容製作的研究。93 年度「大學學術追求卓越發展延續計畫」，本系所提「多媒體生活環境的數位內容科學」計畫，整合電資學院電信所、電子所、和中研院資訊所同仁，2004年3 月獲國科會審查通過，核定經費共166,000,000元，執行期為93年4月1日至97年3月31日。各教師也依各自的研究領域，從事國際合作，例如與 日本、韓國相關學者合作完成中、日、韓、英多國語言資訊檢索測試集，舉辦跨國資訊檢索評比(NTCIR)，並支援歐洲多語言資訊檢索論壇(CLEF)等。 在這些基礎下，本系也擬與日本國立情報學研究所(National Institute of Informatics)簽訂系級合約，建立長期研究合作。 本系非常重視產學合作，多媒體方面的產學規劃，為國內資訊業最早、持續最久的產學合作案，目前仍進行中。 2002年8月本系獲國科會表揚，為九十一度「研發成果技術移轉產業界績優單位」。其他產學合作事例，包括2002年12月Intel、正文科技分別捐贈 本系電腦、無線網路設備，協助更新「INTEL實驗室」設備、以及改善資訊館無線網路基礎建設。2003年1月10日，本系與微軟亞洲研究院簽約成立「台 大－微軟‧NET研究中心」等。2003年第二學期與趨勢科技合作開授「軟體研發實務」課程，引進大型軟體開發經驗。 除了校方的優良教師遴選外，本系也通過優良助教遴選辦法，鼓勵表現優秀的專兼任助教，並於93學年度 (2005年)第二學期完成首次的選拔。此外，為了鼓勵同學參與國際競賽，本系2003年4月設置資訊系榮譽榜，由陳維昭校長、姚期智特聘研究講座、許博 文院長、陳信希主任共同揭幕。國際競賽履創佳績，2003年7月賴飛羆教授、黃翊倫助教率領本系學生郭美辰、鄭先廷、黃寶萱、林柏均，榮獲第四屆IEEE 電腦學會國際電腦程式設計競賽(IEEE CSIDC)世界冠軍。2004年3月劉邦鋒教授指導帶領吳光哲、王尹、高奕豪(電機系)同學，榮獲2004 ACM全球校際程式設計競賽全球第六名、亞洲第一名。此項比賽有來自全球75個國家，總計1411所大學所推出的3150個團隊報名參加。 本系教師表現傑出， 2002年10月李琳山教授獲頒傑出人才發展基金會「傑出人才獎」；2003年11月傅立成教授榮獲 2004國際電機電子工程師學會會士(Fellow)；2003年11月郭大維教授榮獲行政院國家科學委員會九十二年度傑出研究獎；2004年7月李德財 教授榮膺第二十五屆中央研究院院士；2004年10月郭大維教授榮獲十大傑出青年；2004年11月李琳山教授榮獲教育部國家講座；2004年11月吳家 麟教授榮獲行政院國家科學委員會九十三年度傑出研究獎；2004年11月傅立成教授榮獲教育部「九十二年度大專校院教師產學合作獎」。本系研究表現，尚包 括大量論文發表於最頂尖的期刊或會議，教授活躍於國際學術舞台，主辦重要國際會議或為其議程委員，傅立成教授2003年所舉辦的IEEE International Conference on Robotics and Automation，有近千名研究人員與會 。由於本系教師的研究成果豐碩，校方之重要外國訪客，也都安排至本系參觀。 由於教師和學生人數的快速增加，系館空間已不敷使用，在經過十年之規劃、及電資學院許博文院長的協助，華宇李森田董事長暨夫人之個人捐贈， 資訊館二期工程(德田館)已於2004年9月29日落成啟用，完整系館終告完成。 資訊館一期部份在使用10年後，也進行多項維修工程，103多媒体階梯教室於2003年6月23日全面改裝。除了提供教學、演講外，也開放供師生同樂，2003年11月15日師生齊聚一堂，觀賞亞洲盃棒球賽中華─南韓之戰。 本系學生社團非常活躍，2003年3月獲得杜鵑花節學系博覽會院長獎第一名。同時(2003年3月)率先 禮聘姚期智院士為首位特聘研究講座。台大資訊系學會並於2003年12月6日、12月7日主辦第八屆北部大專院校資訊相關科系盃體育競賽(見下圖)，共有 男籃56隊、女籃22隊、壘球34隊、羽球32隊、桌球32隊、足球11隊、男排36隊、女排29隊，總計252隊參賽，選手超過3500位。 2003年6月在系辦同仁和系學會的共同策劃下，本系舉辦第一次畢業撥穗典禮，師生、家長群聚一堂，度過溫馨、有別傳統的畢業典禮，也建立本系每年舉行撥 穗典禮的慣例。 本系於2004年3月獲教育部核准設立「資訊網路與多媒體研究所碩士班」，第一屆碩士班與資訊所碩士班合 併招生，同月，劉邦鋒教授指導帶領吳光哲、王尹、高奕豪(電機系)同學榮獲2004 ACM全球校際程式設計競賽全球第六名、亞洲第一名。本系於2004年4月12日進行五年一度的教學評鑑，在全體教職員生的共同努力之下，教學、研究、和 服務的優異表現，獲審查委員極高的評價。未來三年在「五年五百億計畫」之挹注下，是本系發展關鍵時刻，有賴全系同仁同心協力，本著教學卓越、研究卓越、關 懷社會，邁向世界一流。 2005年8月郭大維教授擔任本系第八任系主任，劉邦鋒教授擔任第三任副系主任，以資訊學群整體發展為著眼，推動系務與學群事務。同年9月教育部來函，核准自95學年度設立「生醫電子與資訊學研究所博士班」，經資訊系系務會議通過，以校內組織調整方式與電機系共同於2006年8月成立「生醫電子與資訊學研究所」，本系教師賴飛羆、歐陽彥正、趙坤茂、曾宇鳳等四教師移撥至「生醫電子與資訊學研究所」，並與本系合聘，資訊學群於2006年8月正式邁入一系二所與一組的學群架構。 資訊學群人才濟濟，傅立成教授於2005年8月出任本校主任秘書，於此同時，歐陽明教授出任本院副院長，王傑智助理教授到任，逄愛君助理教授與周承復助理教授升等為副教授。薛智文助理教授於2006年3月到任 (網媒所主聘)，陳信希教授於2006年8月出任本校計算機及資訊網路中心主任，歐陽彥正教授於此同時出任本校系統生物與生物資訊學研究中心主任。本系於2006年8月因應「生醫電子與資訊學研究所」成立，進一步增聘生醫專長教授群，張瑞峰教授與曾宇鳳助理教授到任，在此同時鄭卜壬助理教授加入本系資料檢索團隊、林智仁教授並升等為教授。於2007年2月廖世偉副教授到任，系統團隊之研究專長更加完整。2007年8月呂學一副教授與許永真副教授升等為正教授，林守德助理教授、徐宏民助理教授、李明穗助理教授到任 (網媒所主聘)，本系與資訊學群教授人數已突破40人，本系學生也突破1000人。為了系務發展需要，本系於2008年2月增設副系主任一位，並邀請呂育道教授擔任之。 本系教授學術研究成果卓越，傅立成教授2005年9月榮獲第十二屆東元獎，吳家麟教授於2007年11月榮膺2008年IEEE Fellow，為本系任教時榮獲此榮銜的第三位IEEE Fellow，多位教授亦陸續榮獲國科會研究獎項（林風副教授 - 94年度吳大猷先生紀念獎; 林智仁教授 - 95年度吳大猷先生紀念獎; 逄愛君教授 - 95年度吳大猷先生紀念獎），林風副教授並於2007年榮獲 「The Best Young Researcher - the 3rd IEEE ComSoc Asia-Pacific Young Researcher Award」，賴飛羆教授榮獲中華民國資訊學 2007年「李國鼎穿石獎」。本系為推動學術卓越，除重視頂尖學術期刊論文發表外，並積極鼓勵頂尖國際學術會議論文發表與積極參與國際學術活動，在2008年一年就發表頂尖國際會議論文 ACM Multimedia(4篇)、ACM SIGIR (1篇)、IEEE RTSS/RTAS (2篇)、ACM SIGGRAPH/SIGGRAPH Asia (3篇) 與 ACM SIGCHI (1篇)，本系郭大維教授更於2007年在美國Tucson 擔任頂尖國際學術會議IEEE Real-Time Systems Symposium(RTSS) 的議程委員會主席。 本系於2007年6月舉辦資訊系三十週年系慶，歷任系主任與畢業系友群聚一堂，慶祝資訊系三十而立。三十年來本系師生在研究、產業發展與社會服務上皆獲得極高評價。 2008年8月1日，呂育道教授擔任本系第九任系主任，許永真教授、陳俊良副教授擔任本系第四任副系主任，2010年8月1日，林風教授接替陳俊良副教授擔任副主任。 教授 從2008年8月到2011年7月三年期間，資訊系的教師群有很大的變化及很多的成就。 資訊系多位教授擔任校內重要主管，例如2009年8月1日，李琳山教授擔任電機資訊學院第三任院長，項潔教授出任本校出版中心主任，賴飛羆教授擔任生醫電子與資訊學研究所第二任所長。2010年9月，電機資訊學院成立功能性「雲端運算研究中心」，中心主任由吳家麟教授兼任。 資訊系多位教授獲得校內外重要獎項，例如2009年6月，項潔教授、賴飛羆教授榮獲臺大98年度「校內服務傑出獎」，2011年6月，陳信希教授榮獲臺大100年度「校內服務傑出獎」。2009年11月，林風教授榮獲「中華民國第47屆十大傑出青年」(科技類)。2010年11月23日，郭大維教授與林智仁教授獲選為IEEE Fellows，使本系IEEE Fellow人數達6人，計有李德財教授(1992年)、李琳山教授(1993年)、傅立成教授(2004年)、吳家麟教授(2007年)、郭大維教授(2011年)、及林智仁教授(2011年)。 教授陣容在這段時間也略有調整。2009年8月1日，李肇林教授、李秀惠教授退休。新聘教授有林軒田(2008)、陳彥仰、蘇雅韻及蔡欣穆 (2010年)。2010年1月，陳世卿博士成為本系特聘研究講座。 在2008年8月到2011年7月三年內，我們痛失了兩位教授：許清琦教授(1949–2010)與李肇林教授(1954–2011)。許清琦教授對資訊系的貢獻從資訊系創立起便不曾間斷，以下紀錄許教授與資訊系共有的歷史。 1977年：到任。 1982年：博士學位(指導教授為臺大電機系于惠中教授)。 1996年8月~2000年7月：擔任資訊系第五任系主任。 1998年6月：決議加入規劃中之電機資訊學院(系史最重大決策之一)。 1998年10月：規劃系館二期工程，促成德田館於2003年6月16日動土(系史最重大決策之一)。 1999年10月：教育部通過本系大學部增班案(系史最重大決策之一)。 2000年8月：校務會議通過88學年度起本系加入電機資訊學院。 2002年2月：退休。 2009年3月30日：系評鑑委員。 2010年3月29日：工程認證資詢委員。 2010年6月6日：過世。 李肇林教授亦為資訊系資深教授，他是臺大數學系學士(1976)，臺大數學系碩士(1978)，卡內基美倫大學碩士(1981)，卡內基美倫大學博士(1985)。李肇林教授從1985年8月1日到任起，在系上任教24年，於2009年8月1日退休，他對軟體系統及各式硬體系統的演變有著如百科全書般的知識，並且長期支援臺大的教育學位學程。李教授不幸於2011年2月27日過世。 李學養創系系主任雖然已於2001年8月退休，他依舊常到系上。 學生、招生、活動 資訊系學生人數已趨穩定，以2021學年招生人數為例，共收134名大學生，172名碩士生及27名博士生。在2021年，台大資訊學群(資訊所、網媒所、及生醫所資訊組)之研究生和大學部人數比約1:2，學生合計約1,290 人，大學部男生人數為495人，女生人數為78人，資訊所男生人數為437人，女生人數為78人。 2008年10月16日，班代、系學會會長「與主任有約」的活動常態化，以增加系與學生溝通的管道，並於2009年5月18日辦第一次常態性的全系導生會。 2010年4月23日，資訊系seminar非正式投票決定是否要有資訊所學生代表，結果33票贊成，0票反對。經過一週的網路票選後，陳縕儂同學於2010年10月19日當選，成為資訊工程學系第一屆研究生代表。 資訊系感謝系學會、各班班代的協助，使系更好，這三年之中，我們尤其感謝屠愚、胡碧丹、許景雯三位會長、資訊系研究生代表陳縕儂、以及系辦公室馬先慧、張蕙怡、及陳玲娜小姐。 2010年3月11~19日 電資學院辦杜鵑花節「網路、手機、與我」特展，對象主要是高中生，以網路手機之普遍性，吸引優秀學生入學，十分成功。中央社記者2010年3月13日報導：「例如將手機對準天空，利用GPS設定，可於手機螢幕顯現星座圖及名稱，這項功能讓台大校長李嗣涔也嘖嘖稱奇。」2011年3月3~11日，電資學院辦杜鵑花節「新科學創造新文明」特展在台大校史館舉行，陳彥仰教授與洪一平教授的成果被多家媒體報導。 2003年6月6日臺大因為SARS取消畢業典禮，促成資訊系首次舉辦畢業典禮，資訊系延續此傳統，2009年6月6日畢業典禮邀請劉炯朗校長以及林逢慶教授致詞，2010年6月4日畢業典禮邀請孔祥重院士以及劉炯朗校長致詞，2011年6月3日畢業典禮邀請創系系主任李學養教授致詞。 從2009年3月起，資訊學群外籍生(大學生)輔導計畫由林守德及李明穗兩位教授負責，國際研究生部分則由副主任負責。我們也感謝陳沛君小姐、林珈禾小姐、及陳芝亦同學的協助。 競賽 在國際級的活動中得獎是很多資訊系學生的夢想。 本系薛智文教授與徐讚昇教授共同指導的碩士生沈秉杰同學，參加2009年第14屆國際電腦對局奧林匹克競賽電腦象棋組競賽，棋力超過七段，榮獲世界冠軍。本系許舜欽教授的評論如下(2009年6月22日)：「今年參加比賽的象棋程式棋力都在七段之上，天馬行空的棋力遙遙領先其它四個程式。估計今年不克參賽的程式，只有兩三個能與它抗衡。今年參加比賽的西洋棋程式也只有十隊，棋力大多與Deep Blue相當，前幾名甚至比當年的Deep Blue有過之而無不及。[…]天馬行空設計迄今也有五年左右，目前已有勝過七段棋士的記錄，連八段的台灣棋王吳貴臨也不敢保證可以贏它。」 計算機學會ACM (Association of Computing Machinery) 所主辦的國際程式競賽(International Collegiate Programming Contest，簡稱ACM ICPC)是以全世界每一所大專院校為單位的國際程式解題競賽，每個參賽隊伍由三人組成，需在五個小時內，共用一台電腦合力解決複雜而困難的問題，除了解題數目外，參賽隊伍還要較量解題速度與正確性。由於ACM國際程式競賽為資訊科學領域中最具代表性的國際程式競賽，每年都吸引了世界各地頂尖的學校派出隊伍來較勁。 為了2009年4月26日的決賽，來自全世界共7,109組隊伍角逐決賽參賽權。在台大資工系鄭卜壬與林軒田兩位指導教授帶領下，台大獲得了2009年ACM 國際程式競賽世界決賽權，其組成隊員有台大資工所的沈定與陳學毅，以及台大電機系的陳柏龍。總決賽在瑞典首都斯德哥爾摩舉辦，只有預賽排名前100名的大學才能夠出席。最後競賽的結果，台大代表隊獲得第14名的佳績。 為了角逐2010年2月1~6日在中國哈爾濱舉行的決賽，來自全世界82個國家的1,931所大學參加了ACM國際程式競賽，參賽隊伍達7,319隊。臺大有三支隊伍在亞洲區域賽中勝出，並選出一隊代表臺大參加總決賽，組成隊員有馮俊菘、陳柏龍和黃上恩。只有預賽隊中排名前103名的大學才能夠出席這場盛會。在臺大資工系傅楸善與鄭卜壬兩位指導教授帶領下，臺大代表隊在總決賽中解出了6題，獲得第3名(金牌獎)，擊敗許多國際著名的大學，為台灣有史以來最佳的成績。 為了角逐2011年ACM國際程式競賽的總決賽參賽權，參賽隊伍達8,305隊，只有預賽隊中排名前105名的大學才能夠出席總決賽。在臺大資工系鄭卜壬指導教授等的帶領下，臺大代表隊在總決賽中解出了6題，獲得第14名，成績斐然。 ACM SIGKDD由1997年開始舉辦一年一度知識發現與資料探勘盃，利用真實世界的資料設計挑戰，開放給全球研究團隊參加，為資料探勘領域中最重要且吸引最多人參加的比賽。林守德教授指導學生團隊榮獲2008年ACM SIGKDD知識發現與資料探勘大賽(Knowledge Discovery and Datamining CUP，簡稱 KDDCUP)第一名，林智仁、林守德、及林軒田教授共同指導學生團隊榮獲 2009 年ACM KDDCUP 第三名，林智仁、林守德、及林軒田教授共同指導學生團隊榮獲2010年ACM KDDCUP第一名，林智仁教授指導學生余相甫、謝卓睿、張凱崴榮獲2010年ACM SIGKDD會議最佳論文獎，而2011年ACM KDDCUP也由本系得到第一名。台大團隊近年來在KDDCUP優異的表現，連續四年獲邀在全球資料探勘研究學者齊聚一堂的會議的宴會中上台領獎，不僅僅提升本校及本院在國際的能見度，也奠定台大在相關研究上居於全球領先的地位。 王傑智教授與網媒所及資工系學生組成的 Team NTU Robot PAL，於2011年7月在土耳其得到機器人世界盃足球賽(RoboCup 2011)標準平台聯盟(Standard Platform League, SPL)第三名。 朱浩華教授指導學生賴宗德同學榮獲 2010 Microsoft Research Asia Fellowship，林守德教授指導學生李政德同學榮獲 2010 Microsoft Research Asia Fellowship，微軟說同一系所有兩名學生得獎非常少見。 頂級國際會議內部研討會，為投稿頂級國際會議論文，許多國際級頂尖研究團隊均會辦理內部研討會，以結合該系所乃至於該校及鄰近學校相關領域之研究人員的力量，來為這些即將投稿的學術論文加以事前審核並提供寶貴的修改意見。2009年6月26日系務會議通過 「國立台灣大學資訊學群推動頂級國際會議之內部研討會計畫」，以提高即將投稿頂級國際會議之論文品質。2010年舉辦國際級研究競賽之賽前賽與集中訓練課程。 認證、評鑑、排名 這三年當中，每年完成一個評鑑。 2008年10月6~7日，完成工程及科技教育認證，之後立即啟動改進計劃，採取「成果導向」之認證標準，將學生表現作為教學成果的評量依據，並以促進系所持續改進作為認證的最終目標。例如有鑒於校方與工程認證都非常重視期中預警機制，且過去的經驗顯示，若等到期末成績出來後再想去協助有問題的學生，通常為時已晚。為了能更有效地建立期中預警機制，2008年11月起請教授提供課業危險之學生名單。期中審查實地訪評在2010年12月6日舉行，2011年3月19日中華工程教育學會通知本系通過四年，代表兩年半來的努力得到了肯定。工程及科技教育認證很辛苦但也促成我們做了很多改革，為此我們感謝全體師生員工的貢獻，尤其是陳俊良教授、何慧君小姐與張蕙怡小姐。(臺大教務會議也於2011年6月10日通過了「學士班學生學業成績預警作業要點」。) 2009年3月30~31日舉行系評鑑，評鑑委員認為本系「堪與世界一流之資訊工程學系並駕齊驅，在台灣資訊工程 教育中居傲人之領導地位。整體而言，與五年以前比較，資訊工程學系之進步明顯可見，可喜可賀。此次評鑑結果堪稱傑出。」資訊系得到評鑑委員的肯定。 根據2010年世界大學排行ARWU(Academic Ranking of World Universities)，資訊系為全球第28名的電腦科系，超過劍橋大學及耶魯大學。我們2009年的排名則是介於52與75名。 2010年8月6日，資訊系大學指考志願由第五升為第四，超越交大電資學士班。 課程改進與規劃 資訊系大約每十年進行一次大型課程改進，上一次於2000年5月修訂本系大學部必修課程，更之前有1987年的大學部必修課程修訂。 在2008年8月之後有很多原因促成課程改進案的啟動，例如 2008年10月6~7日工程認證委員意見、全系導生會及2009年6月25日謝師宴學生的諸多反應。 經過課程委員會、各領域小組會議、學群規劃委員會及系務會議一年多的努力，系務會議於2010年5月14 日通過重大課程改革案，並於2010年6月11日教務會議通過，2010學年開始實施。主要改變如下： 1. 畢業學分由136學分降為大學法規定的最低128學分。 2. 資訊專業必修課 (不算實驗與專題研究) 由57學分降為36學分。 3. 資訊專業選修由18學分增加到27學分。 4. 由本來的必修普通物理6學分，改為普通物理、普通化學、普通生物至少6學分。 雖然2002年3月11日的系務規劃委員會曾委請呂育道教授研擬「本系學士班肄業學生逕行修讀碩士學位辦法」，分析各方案之優缺點，但直到2011年1月7日資訊系系務會議修改通過資工系抵免原則後，再加上課程新制，終於令更多學生得以於五年完成學士及碩士學位。此課程改革案係全系教授一年的努力結果，但我們要特別感謝陳俊良教授與陳文進教授的全心投入，何慧君小姐的行政支援亦功不可沒。 課程之修訂無時無刻不在進行，以下為其中影響較大者。2009年1月9日系務會議修訂「國立台灣大學資訊工程學系碩士班選課、考試及畢業論文有關規定」。重大決議如下。 1. 碩士論文改為最後一學期必修。 2. 專題研究改為畢業時至少通過2學期。 3. 專題討論改為畢業時至少通過2學期。 同時修訂「國立台灣大學資訊工程學系博士班選課、考試及畢業論文有關規定」，專題討論改為「畢業時至少通過4學期」，「國立台灣大學資訊工程學系碩士在職進修專班選課、考試及畢業論文有關規定」亦做了類似修訂。2009年6月26日系務會議通過「服務學習一、三限修本系課程，服務學習二限修本系或由課外活動組開設之課程(課號005 開頭)。」讓服務課的選擇更多樣化。 雲端計算趨勢學程 近年來雲端計算已成為資訊產業最重要的課題之一，藉由此項的技術，企業能以合理的價格，藉由網路獲取計算資源，資料服務，以及軟體服務。軟體業者也可藉由雲端計算技術，集中資源發展軟體系統，而不需考慮後端平台的整合與維護。此外，節能減碳也是雲端計算的優點之一。在這樣的政經發展模式及商業策略影響之下，雲端計算成為重要科技，而優秀的雲端技術人才更是不可或缺。 趨勢科技做為全球性的軟體科技公司，很早就注意到雲端計算的重要性，例如張明正董事長與陳怡樺執行長就曾於2008年7月10日拜訪過臺大資訊工程學系，就雲端計算的願景及合作方向交換意見。為達成此願景，趨勢科技從2009年9月17日起開始與臺大接觸，終於在趨勢科技、李嗣涔校長、湯明哲副校長、李琳山院長、資訊學群教授與系辦同仁的努力之下，「雲端計算趨勢學分學程」於2010年1月12日通過行政會議，捐贈儀式則於2010年2月4日上午舉行。 張明正董事長、陳怡芬執行長、陳怡蓁文化長、趨勢科技公司捐贈的「雲端計算趨勢學分學程」，由資訊工程系、網媒所、電機系執行。此捐贈案不但是臺大金額最高的類似捐款（超過2,100萬），也是臺灣第一個類似學程，代表臺大引領資訊科技發展及應用的決心。 學程每年招收50位臺大學生，但電資學院學生以低於一半為原則。為使招生順利，從2010年3月5日到2010年4月26日止，共舉辦了四場招生說明會，報名人次超過370名，最後共有123學生申請進入學程，其中50名為電資學院學生，73名為非電資學院學生，教授們一致對申請學生的優異留下深刻印象。2010年6月4日學程正取生報到結束，電資學院共50人申請，正取25名，全數報到完畢，備取0人。非電資學院共73人申請，正取25名全數報到完畢，備取0人。換句話說，正取生報到率百分之百（哈佛大學2008年的報到率也只有8"
