full_description = "【獎學金】113學年度台達電子工業獎學金申請開始(10/21止) 2024-09-05 周承滿 【113學年度台達電子工業獎學金申請開始】 一、宗旨：台達電子工業股份有限公司為鼓勵國內在學優秀青年修習電機、機械有關工程學術，設置本獎學金。 二、對象及名額：資訊系二年級以上學生二名。（大學部） 三、獎學金：每名新台幣13500元整。 四、申請資格：資訊系二年級以上學生，學業操行成績優良，家境清寒者均可申請。 五、申請資料: 1.一般用獎學金申請書。 2.本校歷年成績單正本。 3.政府清寒證明:低收入或中低收入證明。未持有者，請檢附112年度之全戶(包含父、母、本人及兄弟姊妹，無收入者亦須檢附)國稅局所得清單。 請備妥文件於10月21日(一)前提出申請，繳交至資訊系R205系辦周小姐處。 台達電子工業獎學金辦法 一般用獎學金申請書"
