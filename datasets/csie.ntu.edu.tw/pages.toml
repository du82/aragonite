full_description = "113學年度第2學期「課程/行政助教申請作業」開放申請中(2/14~2/19) 2025-02-14 蔡盈真 為配合電資學院及教發中心推動助教研習認證制度，藉以提升課程助教之專業知識與技能。自108學年度起，欲擔任本系所之課程/行政助教者，皆須全程參加教發中心或電資學院主(協)辦之教學助理認證研習會(簡稱TA研習)，並取得教學助理基本資格認證，始得聘用擔任課程/行政助教。 一、 113年度第2學期電資學院教學助理認證研習 報名日期：即日起~3/13(四)12:00 研習日期：01/13(一) 09:00 - 03/14(五) 17:00 研習方式：線上課程，報名後將由NTU COOL發送線上課程連結 教發中心報名連結：https://www.dlc.ntu.edu.tw/taorientation/ 請注意！確認擔任課程助教者，請務必全程參加線上課程並取得認證資格後始得辦理聘僱。 二、勞僱型兼任助理(課程助教/行政助理) 申請資格： 1.除在職生、陸生外皆可申請。 2.研究生對課程協助有興趣並取得助教認證資格者，符合授課教師需求皆可申請，惟錄用與否由授課教師決定。 3.研究生在學期間，如違反校規受記小過以上處分（處分確定之次月起未滿一年）者，不得申請及受領本獎勵金。 4.僑生、外籍生須具備工作證且有效期間須包含聘僱期間，有擔任助教意願者敬請提早申請工作證。有關申請資訊，僑生可查詢學務處僑陸組網頁；外籍生可查詢國際處網頁。 核發金額：每月$7,200元，本學期共支領四個月薪資$28,800元。 核發期間：114年03月至 114年06月。 申請方法：即日起至2/19(三)中午12:00前，至系網頁之研究生獎勵金與服務學習(助教)申請系統登記課程助教擔任意願：https://ta.csie.ntu.edu.tw/ta/admin_main.php 登入後點選課程助教申請書，並填寫個人資料，勾選是否具有認證資格，並於申請書下方選填欲擔任課程助教之志願順序後，於系統上送出申請即可(申請課程助教者無須列印申請書)。 重要提醒：擔任助教者每月應按時繳交助教出勤紀錄表，未依公告期限繳交相關文件，衍生問題或損失由當事人自行負責。助教人數依照本系助教分配原則並以網路加退選後之修課人數為計算標準，助教人選由授課教師決定。 請使用系上工作站帳號(CSIE e-mail帳號)登入，工作站帳號若無法登入請洽R217助教(217ta@csie.ntu.edu.tw)。 相關法規： 1. 國立臺灣大學研究生獎勵金實施辦法 2. 國立臺灣大學學生兼任助理學習與勞動權益保障處理要點 3. 國立臺灣大學電機資訊學院資訊學群研究生獎勵金施行細則 ★★★目前僅開放助教申請，研究生獎勵金尚未開放將於三月下旬另行公告於系網頁並發信通知，敬請留意系網頁公告及系上CSIE個人信箱★★★ 如有相關疑問，請洽系辦承辦人蔡盈真小姐 分機261 yingchentsai@csie.ntu.edu.tw 國立臺灣大學研究生獎勵金實施辦法.pdf 國立臺灣大學勞僱型學生兼任助理勞動權益保障處理要點.pdf 國立臺灣大學電機資訊學院資訊學群研究生獎勵金施行細則.pdf"
