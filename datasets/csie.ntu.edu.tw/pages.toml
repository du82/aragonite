title = "徵才 2025年 台積電校園徵才  開跑啦  歡迎2025應屆畢業生一起登 積 | 國立臺灣大學資訊工程學系"
full_description = "【徵才】2025年 台積電校園徵才 開跑啦! 歡迎2025應屆畢業生一起登「積」 2025-02-24 宋欣薏 【2025年 台積電校園徵才】開跑啦! 歡迎2025應屆畢業生一起登「積」 歡迎「志同道合」的你，一起加入台積! 符合資格者，可享優先面試的機會、優於同業的整體薪酬，以及發掘台積生活的多元與樂趣，追求工作及生活和諧。 ▼▼▼ 2025 TSMC校園徵才計畫 ▼▼▼ 實體|就業博覽會► 2025/03/08(六) 與台積學長姐&HR面對面聊聊，了解不同科系對應到的台積職務、工作型態、學習應用、職涯發展。 親臨現場參與活動，完成履歷投遞即可獲「好禮雙重送」!!! 好禮一｜台積電 限量磁吸充電線(數量有限，贈完為止) 好禮二｜當日下午抽出 蘋果iPad平板電腦(款式隨機) 線上|徵才說明會► 2025/03/18(二)中文, 03/25(二)日文, 03/27(四)中文, 03/28(五)英文 掌握台積趨勢、職缺資訊及投遞履歷Tips！(線上說明會活動，採事先報名) 活動辦理於中午時段 12 : 15－13 : 15，報名後系統將於活動前１日系統自動寄發活動Teams會議連結。 線上徵才活動總覽：報名請點我 2025校園徵才 徵才對象：2025年應屆畢業之學、碩、博士生 或 可於2025年底前到職者 招募系所：電機(子)、電信、光電、物理、材料、化學(工)、機械、資工(管)、工工(管)、環工 商管、企管、財金、經濟、會計、數學、統計、人資、心理、教育、勞工、法律等理工和商管科系(也歡迎各領域同學加入) 徵才時程 • 申請日期：即日起 – 2025/04/30 • 面談日期：即日起 – 2025/06/30 投遞履歷：投遞請點我"
