["http://www.csie.ntu.edu.tw/~wenhuang"]
title = "Wen-Huang Cheng"
full_description = "Wen-Huang Cheng received the B.S. and M.S. degrees in computer science and information engineering from National Taiwan University, Taipei, Taiwan (R.O.C.), in 2002 and 2004, respectively, where he received the Ph.D. degree from the Graduate Institute of Networking and Multimedia in 2008. He is a Professor with the Department of Computer Science and Information Engineering, Graduate Institute of Netwo and Multimedia, National Taiwan University (NTU), Taipei, Taiwan, where he is the Founding Director with the Artificial Intelligence and Multimedia (AIMM) Research Group. Before joining NTU, he was a Distinguished Professor with the Institute of Electronics, National Yang Ming Chiao Tung University (NYCU), Hsinchu, Taiwan, from 2018 to 2023 and led the Multimedia Computing Research Group at the Research Center for Information Technology Innovation (CITI), Academia Sinica, Taipei, Taiwan, from 2010 to 2018. His research interest includes artificial intelligence, multimedia, computer vision, machine learning, digital transformation, and financial technology. Job Description: The Artificial Intelligence and Multimedia (AIMM) Research Group at National Taiwan University, is currently seeking candidates able to make research advances in the various areas of muiltimedia technologies. How to Apply: Please email me your resume, bio, transcripts, and other supporting materials for further scheduling interviews. Note that only qualified applicants will be notified. Job Description: The The Artificial Intelligence and Multimedia (AIMM) Research Group at National Taiwan University, is currently seeking candidates to participate in our on-going research in the various areas of muiltimedia technologies. How to Apply: Please email me your resume, bio, transcripts, and other supporting materials for further scheduling interviews. Note that only qualified applicants will be notified."
