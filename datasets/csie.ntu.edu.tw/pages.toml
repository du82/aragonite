title = "113年上半年 NTU AR 校友返校學習專案 活動 | 國立臺灣大學資訊工程學系"
description = """
親愛的校友 您好：

本校113年上半年「NTU AR 校友返校學習專案」活動正式推出，歡迎校友踴躍完成身分驗證，
