["https://csie.ntu.edu.tw/zh_tw/Announcements/Announcement9/-%E6%B4%BB%E5%8B%95-NCTS-Interdisciplinary-Distinguished-Lectures-on-Medical-Innovations-and-AI-93631521"]
title = "活動 NCTS Interdisciplinary Distinguished Lectures on Medical Innovations and AI | 國立臺灣大學資訊工程學系"
full_description = "【活動】NCTS Interdisciplinary Distinguished Lectures on Medical Innovations and AI 2024-12-12 宋欣薏 NCTS Interdisciplinary Distinguished Lectures on Medical Innovations and AI 【Event Link】 December 27, 2024 Room 505 Multifunction classroom, Cosmology Building, NTU Invited Speakers: Weichung Wang (National Taiwan University) Organizers: Yng-Ing Lee (National Taiwan University & NCTS) Tai-Chia Lin (National Taiwan University) Aim & Scope The NCTS Interdisciplinary Distinguished Lecture series aims to introduce important research directions in sciences to the Taiwan mathematical community. And at the same time create a platform that people with different backgrounds can meet, discuss, and develop interdisciplinary collaborations. Each Interdisciplinary Distinguished Lecture is designed to be a half day activity with lectures, discussions and a closeup. The exact format will take some time to fix, or can vary according to the needs. We are very happy to have Professor Weichung Wang to give the NCTS Interdisciplinary Distinguished Lecture on Medical Innovations and AI. He will introduce the latest developments in mathematical theories and methods in deep learning for artificial intelligence, and the applications in the biomedical field. Title Advancing Medicine with AI from Interdisciplinary Research to Real-World Impact Abstract Medical technologies such as computed tomography and digital pathology generate vast amounts of data, allowing us to visualize and explore intricate internal structures of the human body in rich digital formats. These datasets offer an unprecedented opportunity to enhance healthcare and improve patient outcomes. However, transforming these high-dimensional, noisy, and heterogeneous datasets into actionable insights remains a significant challenge. This presentation will showcase how artificial intelligence (AI), combined with interdisciplinary expertise across natural sciences (medicine, mathematics, statistics, computation) and social sciences (business, management, regulatory and legal affairs), is transforming healthcare through more intelligent and more precise solutions. We will share our journey in developing PANCREASaver—the world's first AI system for early pancreatic cancer detection—tracing its evolution from fundamental research to a groundbreaking real-world application. This talk will highlight key insights, challenges overcome, potential research directions, and the transformative role of AI in addressing critical medical needs, providing theoretical predictions, practical solutions, and actionable guidance. Agenda 09:30-09:50 Registration 09:50-10:50 Lecture (1hr) 10:50-11:20 Q&A/ Informal Discussion 11:20-11:50 Tea Break 11:50-12:10 Conclusion Registration 【LINK】 Please do the registration by the deadline Dec. 22."
