title = "國立臺灣大學資訊工程學系招收轉系生辦法 | 國立臺灣大學資訊工程學系"
full_description = "國立臺灣大學資訊工程學系招收轉系生辦法 2023-08-28 周承滿 學生事務 國立臺灣大學資訊工程學系招收轉系生辦法 112.04.06 111學年度第2學期第1次系務推動委員會討論通過 112.06.02 系務會議通過 第一條 申請轉入資訊工程學系(下稱本系)學生應符合下列情形： 1. 符合本校學生轉系辦法第三條規定。 2. 前一學年每學期等第績分平均(GPA)均達3.38(含)以上。 3. 曾修習並通過與本系必修等同之微積分1、2、3、4(含數學系微積分一、二)。 4. 以本系為轉系第一志願。 第二條 申請學生在學期間，曾獲成績優良獎(書卷獎)，或每學期(不含申請當學期)平均成績排名 均在該系前15%者，或特殊案例經系主任同意者，並於入學本校該年成績(含入學方式) 符合下列情形之一，得逕以書面方式申請轉入本系: 1.大學申請入學獲本系正取者 。 2.符合「參加國際數理學科奧林匹亞競賽及國際科學展覽成績優良學生升學優待辦法」 保送本系資格者。 3.大學分發入學分科測驗成績達本系錄取標準者(以本系考科計算)。 4.數理或電資領域傑出表現者 。 符合上述情形之一者，得檢具成績單、名次證明、申請表等相關資料，在本校轉系申請 截止 日期前送交本系，於轉系考試前，經本系當年度轉系審查小組審查。如經審查通過者 逕予錄取， 若未錄取者得參與本系舉辦之轉系考試。 第三條 除符合第二條申請錄取者外，申請轉系者一律參加當年本系舉辦之轉系考試。 第四條 轉系申請須經本系當年度轉系審查小組決議錄取名單，得不足額錄取。 除第二條錄取者之學生外，轉系考試成績評定方式如下： 1.計算機程式設計考試成績佔50％。 2.書面審查佔50%。 第五條 本辦法經本系系務會議通過並報教務處備查後，自發布日施行。 國立臺灣大學轉系、輔系及雙主修相關規定查詢網頁"
