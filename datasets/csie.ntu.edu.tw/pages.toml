title = "資訊工程學系碩士班與人工智慧碩士班 一般生 考試入學規定 [聯合招生] | 國立臺灣大學資訊工程學系"
full_description = "資訊工程學系碩士班與人工智慧碩士班(一般生)考試入學規定 [聯合招生] 2022-12-08 蘇誼嫻 114學年度碩士班入學考 【本資料僅供參考，正式招生辦法以本校招生簡章內容刊載為準。】 報考資格：凡於國內經教育部立案之大學校院或於符合教育部採認規定之國外大學畢業取得學士學位者，或合於「報考大學同等學力認定標準」有關碩士班報考規定者。 招生名額： 正取58名，備取75名 考試項目 ─ 筆試；科目名稱： 英文(A) 數學(A)(含線性代數、離散數學) 計算機結構與作業系統 資料結構與演算法 分數規定： ※英文(A)以100分命題，惟成績以10%計算。 ※同分參酌比序依序為：1.數學(A)(含線性代數、離散數學)2.計算機結構與作業系統3.資料結構與演算法 其他規定： 課程和畢業規定請參見本系網站公告。 資訊工程學系碩士班與人工智慧碩士班辦理聯合招生，分兩個志願：資訊工程學系碩士班 (志願代碼 905A)：一般生 52 名，備取 60 名；人工智慧碩士班 (志願代碼 905B)：一般生 6 名，備取 15 名。 請在鍵入報名資料時留意志願所別，至多選擇兩個志願，報名後不得要求更改。錄取考生依考試總分高低及志願順序分所錄取。 兩所如遇正取生報到後有缺額可遞補，備取生係以有選填該所為第一志願且符合最低錄取成績之規定者，依考試總分高低排序遞補之。已獲正取者將不再具有備取資格。 考試日程： • 113/11/11(一)起 簡章公告於研教組網頁 • 113/11/28(四)至12/05(四) 上網登錄報名資料及繳費 • 114/02/08(六)、02/09(日) 筆試 • 114/03/05(三) 放榜 • 114/03/25(二)至03/27(四) 正、備取生網路報到"
