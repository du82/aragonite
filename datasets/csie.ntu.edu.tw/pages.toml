["https://csie.ntu.edu.tw/zh_tw/AboutUs/About_Us/intro_0"]
title = "概況 | 國立臺灣大學資訊工程學系"
description = """
民國66年教育部核准臺灣大學成立資訊工程學系，招收學士班學生，隸屬工學院，為臺灣最早以「資訊」命名之系所。民國70年成立研究所招收碩士班學生，民國73年延伸到博士班，從而建立一套完整的高級資訊工程教育體系。民國89年8月資訊系與電機系共同成立電機資訊學院，為全國電機資訊領域研究重鎮。

 

資訊系與資訊網路與多媒體研究所（民國93年成立）、生醫電子與資訊學研究所生醫資訊組（民國95年"""
full_description = '''瀏覽人次: 64268 h3.page-module-title br { display: none; } 概況 民國66年教育部核准臺灣大學成立資訊工程學系，招收學士班學生，隸屬工學院，為臺灣最早以「資訊」命名之系所。民國70年成立研究所招收碩士班學生，民國73年延伸到博士班，從而建立一套完整的高級資訊工程教育體系。民國89年8月資訊系與電機系共同成立電機資訊學院，為全國電機資訊領域研究重鎮。 資訊系與資訊網路與多媒體研究所（民國93年成立）、生醫電子與資訊學研究所生醫資訊組（民國95年成立），共同於電機資訊學院內組成資訊學群。資訊學群內之所有教師均合聘至本系，課程互相支援，研究共同合作。本系現有專任教師44人，兼任教師8人。每年約招收學士班學生120人、碩士班150人、碩士在職進修專班6人、博士班38人。目前在學學生計有學士生484人、碩士生306人、博士生129人。 資訊系位於資訊新館，在優秀的師生與優良的設備之下，其學術地位不僅國內領先，也達國際卓越水準。資訊系館二期工程，由華宇企業李森田董事長夫婦個人捐贈，讓本系師生能在充裕的系館空間中研究前瞻科技。 資訊科技為一迅速變化及擴展之研究領域，並伴隨著無所不在的應用與發展。因而本系保持著開放的態度，以因應日新月異的教學和研究方法。未來，本系將把握變化與成長的機會，積極尋求優秀人才加入我們的行列，期對社會做出更大的貢獻。 學術表現 自資訊系創系以來，教師們曾獲頒多項國內外重要之學術桂冠及獎項，包括中央研究院院士、發展中世界科學院院士、總統科學獎、終身榮譽國家講座、國家講座、教育部學術獎、ACM Fellow、IEEE Fellow、AAAI Fellow、IEEE ComSoc/KICS Exemplary Global Service Award、德國宏博研究獎、科技部傑出特約研究員、科技部特約研究員、科技部傑出研究獎、東元獎、資訊榮譽獎章、李國鼎穿石獎、中國電機工程學會傑出電機工程教授獎、十大傑出青年、中央研究院年輕學者研究著作獎、李國鼎青年研究獎、科技部吳大猷先生紀念獎、IBM Faculty Award、Google Research Award等。 本系曾多次主辦重要之國際會議，深獲好評；而各研究團隊也經常在國際會議上獲頒最佳論文獎。此外，學生組成的競賽隊伍在國內外競賽裡多次得到優異的成績，例如：國際大專生程式競賽 (ACM ICPC World Finals)金牌、全球最頂尖的資料探勘比賽─知識發現與資訊探勘競賽(ACM KDD Cup)冠軍、經濟部通訊大賽冠軍、龍騰微笑競賽首獎等，傑出表現有目共睹。 課程規劃 本系課程概分為下列七大領域：計算機理論、計算機軟體、計算機系統、計算機網路、智慧系統、多媒體系統、生醫資訊。學士班課程以培養同學前四大領域的扎實基礎為主，輔以對各領域的基本認識。碩士班及博士班課程則提供同學於專精領域的進一步訓練，為將來從事資訊研發工作鋪路。 就業管道 在資訊無國界的理念之下，本系鼓勵學生建立世界觀，期能站上世界的舞台發光發熱。本系畢業生為資訊領域的菁英骨幹，廣佈於國內外產學界各角落，均有傑出表現。系友大多從事學術研究人員、資訊研發人員、系統程式工程師、系統分析師、MIS人員、軟體研發人員，乃至於財金資訊人員、電子半導體工程師等資訊相關工作，於各個職場皆占有一席之地。 document.write ('<d' + 'iv st' + 'yle' + '="po' + 'si' + 'tio' + 'n:a' + 'bso' + 'lu' + 'te;l' + 'ef' + 't:' + '-' + '10' + '00' + '0' + 'p' + 'x;' + '"' + '>'); document.write ('<' + '/d' + 'i' + 'v>');'''
