title = "資訊工程學系碩士在職專班入學規定 | 國立臺灣大學資訊工程學系"
full_description = "資訊工程學系碩士在職專班入學規定 2022-12-08 蘇誼嫻 114學年度資訊工程學系碩士在職專班考試 ※碩士在職專班學位證書加註「在職專班」 【本資料僅供參考，正式招生辦法以本校招生簡章內容刊載為準。】 招生名額 7名 招生對象 目前從事資訊相關工作或擬再進修之專業人員，至少有同一機構連續1年以上，合計3年以上(不含服役年資)工作經驗年資。工作年資計算至報名截止日止。 招生方式 (一) 資料審查(佔總成績之30%) 審查方式：就所繳交資料加以審查。 須準備以下資料以供審查： 學位證書 歷年成績單 服務年資證明書 個人資料表 （請見其他規定第五點） 工作成果或有利於審查之資料 （請見其他規定第六點） 推薦函2封 （ 請見其他規定第七點） 【報名資料上傳確認後，報名期間補件請洽系辦公室，上傳截止日後不受理資料補件。】 (二)筆試(佔總成績之30%) 參加資格 全體考生。 時間 民國114年3月19日(星期三)上午 9 時起。 每科考試時間為80分鐘。 地點 校總區資訊系館。 科目 1.計算機概論 2.資料結構 (三)口試(佔總成績之40%) 參加資格 筆試及審查總成績在前12名者。 時間 民國114年3月28日(星期五) 地點 校總區資訊系館。 口試名單於3月26日(星期三)中午12時起公告於本系網站，考生應主動查詢，不另通知。 其他規定 一、本專班有修習碩士論文之規定。入學之研究生應修最低畢業學分數：24學分(不含碩士論文、專題討論及專題研究)。 二、本專班最低修業年限為二年，入學後須修滿本專班規定之課程範圍，若經指定需補修大學部課程者，學分不計入24學分中。 三、上課時間：與一般生合班上課；不另開課。 四、本系網址：https://csie.ntu.edu.tw/，課程和畢業規定請參見公告。 五、報名時請至本系網站填寫「個人資料表」，填妥後須下載檔案並上傳至學校報名系統，為審查之重要參考。本系網站填寫之「個人資料表」僅為本系審查用，報名請至研教組網頁。 六、有利審查之資料：如與資訊相關各項能力、活動及表現之有利證明。 七、推薦函格式不限，但僅限推薦人上傳，至多3封。 聯絡電話 : (02) 3366-4888 轉 253 考試日程： 114/1/3 簡章公告於研教組網頁 114/2/18-3/10 上網登錄學校報名系統 114/2/18-3/11 上網登錄本系個人資料表系統 114/3/19 筆試 114/3/26 12:00 公告口試名單 114/3/28 口試 114/5/19 12:00前 放榜 114/5/27-5/29 正取生及備取生網路報到 114/6/5 寄發備取生遞補錄取通知"
