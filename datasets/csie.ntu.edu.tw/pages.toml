title = "Prof. Shih-Hao Hung's Home Page"
full_description = "洪士灝 教授 台灣大學資訊工程學系暨網路與多媒體研究所 台北市羅斯福路四段一號 資訊工程系館 320室 Shih-Hao Hung, Ph.D., Professor Dept of Computer Science and Information Engineering, Graduate Institute of Networking and Multimedia, National Taiwan University #1 Roosevelt Rd. Sec. 4, Taipei, Taiwan 106, ROC Before joining NTU in Feb. 2005, I worked for Sun Microsystems in the San Francisco Bay Area for 5 years. During 1992-2000, I earned my Ph.D. and M.S. degrees in Computer Science and Engineering and completed a post-Doctorial study training Prof. Edward S. Davidson at the Advanced Computer Architectural Lab in The University of Michigan. I received my B.S. degree in Electrical Engineering at the NTU in 1989. When I arrived at NTU, I established the Performance, Applications, and Security Lab (PAS Lab) in the Department of Computer Science and Information Engineering and the Graduate Institute of Networking and Multimedia in 2005. I have served as the Section Director in the Computer and Information Network Center of NTU from 2012 to 2016. I have studied computers since 1982 since my highschool days. My current research interests are in the following areas: We have been working with industry-leading partners, including IBM, Intel, AMD, NVIDIA, ARM, MediaTek (聯發科技), QNAP (威廉通), ADLINK (凌華), Foxconn (鴻海), Quanta (廣達) in researching advanced computing technologies and accelerating important applications. The collaboration constantly innovates technologies and contributes to the academia. 以GPGPU加速系統資料去重複運算 - Wei-Cheng Lin, Chia-Heng Tu, Chih Wei Yeh, Shih-Hao Hung:GPU acceleration for Kernel Samepage Merging. RTCSA 2017: 1-6 以GPGPU與RDMA加速Spark叢集的效能 - Yi-Wei Chen, Shih-Hao Hung, Chia-Heng Tu, Chih Wei Yeh:Virtual Hadoop: MapReduce over Docker Containers with an Auto-Scaling Mechanism for Heterogeneous Environments. RACS 2016: 201-206 以異質計算（GPGPU/FPGA）加速醫學應用 - Shih-Hao Hung, Min-Yu Tsai, Bo-Yi Huang, Chia-Heng Tu:A Platform-Oblivious Approach for Heterogeneous Computing: A Case Study with Monte 