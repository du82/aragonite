title = "Research Projects"
full_description = '��A Low-Cost Portable Polycamera for Stereoscopic 360�X Imaging��, IEEE Trans. on Circuit and Systems for Video Technology (IEEE TCSVT), Volume: 29 , Issue: 4 , pp. 915 �V 929, April 2019. ��Personalized Photograph Ranking and Selection System Considering Positive and Negative User Feedback��, Domain Connected Graph: The Essential Skeleton of a 3D shape (2006) A new representation for the skeleton of an arbitrary shape is proposed. A Tool for Alignment of Molecules A novel tool is proposed to align two molecules (not just proteins) based on 3D Protein Model Retrieval 2004 A 3D Protein Model Retrieval System based on Multi-View LightField method. Realistic 3D facial animation parameters Accurate 3D facial motion trajectories are reconstructed from mirror-reflected multiview videos, and the estimated data are also applied to synthetic face for realistic facial animation. MPEG4 Synthetic/Natural Hybrid Coding Our focus is on head/face motion tracking using three feature points, as well as efficient 3D modeling of individuallized face with textures. Currently we are working on "Virtual Talk" An authoring system is proposed to construct panoramic images of real-world scenes from video clips automatically. Instead of using special hardware VR Talk Web-enabled speech driven facial animation. In this project, a speech-driven talking head is developed as a plug-in for web browsers (plug-in for Navigator; ActiveX for IE). Since it is a Image Talk synthetic faces can be used in virtual communication such as virtual meeting, virtual video e-mail etc.; the technique can also be a new friendly user interface in various applications The SpaceWalker building walkthrough system As part of our graphics research into virtual worlds, and also stimulated by the construction of a new building for the Department of Computer Science and Information Engineering at National Taiwan University, our goal is to construct a walkthrough system, the SpaceWalker, that enables a user to explore the computer model of the department building. --Dr. Yuong-Wei Lei'
