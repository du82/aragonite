title = "徵才 趨勢科技2025年度校園徵才與暑期實習計畫熱烈起跑 | 國立臺灣大學資訊工程學系"
full_description = "【徵才】趨勢科技2025年度校園徵才與暑期實習計畫熱烈起跑！ 2025-02-24 白師瑜 【趨勢科技2025校園徵才】加入趨勢科技‧守護世界安全 趨勢科技2025年 「校園徵才與暑期實習計畫」熱烈展開中！ 想加入亞洲及臺灣最大的純軟公司嗎 ? 想研發出每間企業、每位使用者必備的資安產品嗎 ? 快來就業博覽會 / 企業說明會 / 趨勢體驗日瞭解趨勢科技！ 2025新鮮人職缺說明 企業網路資安防護、個人家庭資安防護、核心技術開發的六大職缺與相關技術 (1) 雲端軟體開發：參與核心技術研發，從網路、端點到雲端，打造專屬解決方案。運用 AWS 和 Azure，成為全球領先的 Cloud Developer！ C, C++, Python, Java, Golang, Linux (2) 網路軟體開發：探索網路隱藏威脅，深入研究核心引擎，解析 HTTP/3 等協定，運用 VPN 和 SSL bumping 技術解決網路難題。 C++, C#, SQL query, Python, PowerShell, Kernel driver (3) 軟體測試：全程參與產品開發，設計自動化測試，確保高流量世界級產品的穩定性。成為軟體品質的守護者！ C, C++, Python, Selenium, Robot Framework, Protractor (4) AI/機器學習：運用生成式 AI 與現有業務系統整合，優化互動體驗、提升業務流程效率並推動企業成長！ Python, PHP, Javascript, Azure, Elastic, Solr, Chroma, Docker (5) 介面設計及前端開發： 使用者經驗設計團隊：與使用者零距離交流，透過訪談與創意，優化體驗，設計吸引人的介面！Adobe Suite, Axure, Visio 前端工程師：運用 Angular、React 和 Vue 打造流暢的跨平台介面！Angular, React, Vue (6) 資安威脅研究：成為正義的白帽駭客，透過滲透測試與逆向工程保護網路安全，揭開隱藏威脅！ Python, Penetration Testing, Reverse Engineering 暑期實習計畫說明 實習期間：2025 年 7 月 1 日至 2025 年 8 月 29 日 (全日實習) 招募對象： 國內、外大專院校升大三(含) ~ 碩士在校生 資訊相關科系，或傳播、英文、新聞相關科系(for UX Writer) 招募職缺：軟體開發及測試、AI/機器學習、使用者經驗類 招募期間：即日起至 2025 年 5 月 31 日止 (履歷先到先審，額滿為止) 計畫特色： ·精心為實習生安排的訓練、專案計畫以及精彩活動 專屬 Mentor 陪伴你面對職場各式挑戰 與世界級精英團隊合作，親身參與世界級軟體開發流程 完成實習發給實習證書及趨勢人專屬紀念品 實習期間表現優異者有機會獲得預聘 系列活動介紹 就業博覽會：現場與 RD 及 HR 對談，聊聊趨勢的工作機會。現場投遞 104 履歷、報名趨勢體驗日或分享FB/IG活動，即可領取多項好禮。 企業說明會：研發主管分享在趨勢的工作與生活，任何問題都可以得到即時解惑。參加活動前 50 位報到者可獲得3C收納包或不鏽鋼冰塊組。 趨勢體驗日：2025年5月10日親自到趨勢科技台北辦公室深入瞭解 Trend's Style。 【點擊連結瞭解徵才資訊和投遞履歷】https://recruittaiwan.trendmicro.com/"
