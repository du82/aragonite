title = "活動 威旭資訊 2025 企業說明會及校園博覽會 | 國立臺灣大學資訊工程學系"
full_description = "【活動】威旭資訊 2025 企業說明會及校園博覽會 2025-01-21 白師瑜 【威旭資訊 VICI Holdings 2025 校園徵才巡迴】 引領量化交易技術，探索未來新高度 威旭資訊，匯聚金融與科技領域的頂尖人才，專注於高頻交易、造市及套利交易，以創新技術和卓越策略為全球市場注入新動能！ 理工高手的下一站——高頻交易！ 你知道理工背景的人才，不只在科技領域發光，還能在金融高頻交易中成為改變市場規則的關鍵人物嗎？ 高頻交易並非遙不可及！如果你對算法策略、軟硬體應用充滿好奇，卻不知從何了解，威旭資訊即將為你全面揭密！ 我們的校園說明會將提供給你： Where We Began - 紮根台灣，以創新技術推動品牌，定義高頻新未來 What We Achieve - 從硬體到軟體，打造無人能敵的專業技術 Why They Chose - 學長姐現身說法！ 親授在學期間必備的成功秘技！ 參加說明會好禮歡樂送！ 好禮一：於報名期限內完成報名且出席活動 星巴克飲料券乙張 好禮二：參加活動且完成滿意度調查問券 Mister Donut甜甜圈 2入兌換券 報名期限：2025/1/10-2025/2/28 報名連結：https://reurl.cc/L5Z7ZK 企業說明會_活動資訊 03/10 (一)14:30 pm~15:20 pm 清華大學 - 名人堂 03/19 (三)14:30 pm -15:30 pm 台灣大學 - 鄭江樓慶琅廳 03/24 (一)12:10 pm -13:00 pm 政治大學 - 商學院 - 玉山國際會議廳 參加博覽會大獎等你抽！ 好禮一：官方社群按讚or追蹤 帶來整年好運祈福餅乾 好禮二：官方社群按讚or追蹤+填簡易履歷 好運祈福餅乾+千元豪禮抽獎機會 企業博覽會_活動資訊 03/08(六)09:30-16:30 台灣大學 攤位編號：待確認 03/22(六)10:00-16:00 清華大學 攤位編號：E79、E80"
