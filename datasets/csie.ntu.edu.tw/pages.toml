title = "人工智慧碩士班 一般生 甄試入學規定 | 國立臺灣大學資訊工程學系"
full_description = "人工智慧碩士班(一般生)甄試入學規定 2022-12-08 蘇誼嫻 114學年度人工智慧碩士班甄試 (本資料僅供參考，正式招生辦法以本校招生簡章內容所刊載為準。) 招生名額：9名 報考資格：無學業成績及名次規定 報名審查資料： 一. 學位證書或在學證明 二. 歷年成績單 三. 大學總成績名次證明書 四. 個人基本資料表 (請見其他規定第二點) 報名時請至本系網站填寫：個人資料表系統 五. 就學計畫 六. 各種有利審查之資料 (請見其他規定第三點) 七. 推薦函 (非必繳，請見其他規定第四點) 【所有資料必須在報名時上傳繳交齊全，上傳截止日後不受理資料補件，應繳交資料不全者，將嚴重影響審查成績之評定。】 甄試項目：資料審查 審查方式：就所繳資料加以審查；佔總成績比例100%。 其他規定： 一. 課程和畢業規定請參見本系網站公告。 二. 報名時請至本系網站填寫「個人資料表」，填妥後須下載檔案並上傳至 學校報名系統，為審查之重要參考。本系網站填寫之「個人資料表」僅 為本系審查用，報名請至研教組網頁。 三. 各種有利審查之資料：如國際資訊相關比賽(如ICPC)名次、研究報告、著作及得獎紀錄等。 四. 推薦函格式不限，但僅限推薦老師上傳，至多3封。 考試日程： 113.09.13 簡章公告於研教組網頁 113.10.03-10.10 上網登錄學校報名系統 113.10.03-113.10.10 繳交審查報名費 113.10.03-10.11 上網登錄本系個人資料表系統 113.10.11 下午5:00前 報名資料上傳截止時間 113.11.20 第二梯次放榜 113.11.26-11.28 正備取生網路報到 連絡電話：(02)3366-4888 ext.253 ※本系個人資料表系統網址：https://admission.csie.ntu.edu.tw/。 ※推薦函格式不拘。本系備有參考格式供考生下載使用。 推薦信(參考格式)-AI"
