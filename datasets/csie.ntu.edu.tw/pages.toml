full_description = "學士班課程資訊 2025-01-22 周承滿 課程資訊 由於資訊科技日新月異，許多技術創新來自於學理上的突破，因此我們希望學生具備扎實的數理邏輯能力，深入系統底層，建立起雄厚的資訊工程基礎，而非只是淺嘗即止，或是學一些外系同學短期就能學會的東西。 本系之必修課程可分為5大方向，一、二年級以基本學科之訓練為主，三、四年級則著重各種專業知識之傳授，學生可依興趣選擇適當之領域，建立自己的研究方向。此外，本系亦提供豐富的選修課程，供同學進一步選修研習。以下是6大課程分類： 數理基礎課程 微積分1,2,3,4 (一上，一下) 普通物理學或普通化學或普通生物學 (一上，一下) 線性代數 (二上) 機率 (二下) 自動機與形式語言 (三上) 資訊工程基礎課程 計算機程式設計 (一上) 資料結構與演算法 (一下) 演算法設計與分析 (二上) 軟體系統課程 系統程式設計 (二上) 作業系統 (二下) 硬體結構課程 計算機結構 (三上) 電腦網路課程 計算機網路 (三上) 人工智慧課程 人工智慧導論(三下) 畢業應修最低學分數（128學分）＝共同必修及通識學分（24學分）＋系訂必修學分(51學分)＋專業選修學分(30學分)+外系選修學分(23學分)。"
