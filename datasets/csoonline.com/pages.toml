description = """
Susan Bradley has been patching since before the Code Red/Nimda days and remembers exactly where she was when SQL slammer hit (trying to buy something on eBay and wondering why the Internet was so slow). She writes the Patch Watch column for Askwoody.com,  is a moderator on the PatchManagement.org listserve, and writes a column of Windows security tips for CSOonline.com.

In real life, she’s the IT wrangler at her firm, Tamiyasu, Smith, Horn and Braun, where she manages a fleet of Windows servers,  Microsoft 365 deployments, Azure instances, desktops, a few Macs, several iPads, a few Surface devices, several iPhones and tries to keep patches up to  date on all of them. In addition, she provides forensic computer investigations for the litigation consulting arm of the firm.
 
She  blogs at https://www.askwoody.com/tag/patch-lady-posts/ and is on twitter at @sbsdiva. She lurks on Twitter and Facebook, so if you are on Facebook with her, she really did read what you posted. She has a SANS/GSEC certification in security and  prefers Heavy Duty Reynolds wrap for her tinfoil hat."""
full_description = "When it comes to implementing Open Authorization (OAuth) technology, constant monitoring and review is the key to maintaining a properly secure organization. Credit: Treecha/Shutterstock Cloud authentication provides so many advantages in business. It can allow your users to seamlessly authenticate between applications, it’s cost-efficient, and it’s scalable, and it offers great security options. But as with anything that is good in this line of work, it has the potential to be abused. One example of this is Open Authorization (OAuth) technology, an open-standard protocol designed to allow third-party applications to access user information without sharing the user’s credentials, such as passwords. It enables users to grant limited access to resources from one site to another without exposing login information. When used for good, it allows users to make persistent connections. When used for evil, it can allow malicious actors to gain a foothold on a network, even an on-premises location. Microsoft 365 Defender can be used to alert users to potential business email compromises and phishing attacks that can lead to OAuth-related attacks. When a user in your organization gets an email and clicks on a malicious link created through an adversary-in-the-middle (AiTM) phishing kit, the account gets compromised as the user’s session cookie or session token is stolen. The attacker then uses this stolen cookie to sign in from another location. Managing OAuth connections As Microsoft indicates, you want to review who and what (non-human identities included) have OAuth connections in your organization and keep an eye out for any new or malicious connections. As noted in its document, use Microsoft Defender to perform the following query: Set the filter to permission level “high severity” and community use to “not common”. Using this filter, you can focus on apps that are potentially very risky, where users may have underestimated the risk. Under Permissions select all the options that are particularly risky in a specific context. For example, you can select all the filters that provide permission to email access, such as Full access to all mailboxes and then review the list of apps to make sure that they all really need mail-related access. This can help you investigate within a specific context, and find apps that seem legitimate but contain unnecessary permissions. These apps are more likely to be risky. Select the saved query Apps authorized by external users. Using this filter, you can find apps that might not be aligned with your company’s security standards. Filter on “last authorized” to review when an application has recently entered into your network. Then filter on the number of users and ensure that you review those OAuth applications that have few of users. Ensure you perform this review on a semi-regular basis. Susan Bradley Next, review the permission level for all OAuth applications, ensuring that you know and have authorized any OAuth application that has a high-permission level in your environment. Decide whether these applications still should be allowed the highest permissions in your organization. Review any app’s reputation in the industry and ensure that it’s widely installed. If not, review the type of application it is — it could be a backup app or such that may not have many users. Determine its purpose and review that the application only has permissions related to that intent. How to set up OAuth approval Organizations should review if they can turn on administrative OAuth approval for apps that ask for Microsoft 365 information and access. As noted by Microsoft, you will need to log into EntraID in order to set this approval setting. Sign in to the Microsoft Entra admin center as a Privileged Role Administrator. Browse to Identity > Applications > Enterprise applications > Consent and permissions > User consent settings. Under User consent for applications, select which consent setting you want to configure for all users. Select Save to save your settings. Depending on your business needs and risk analysis, you may want to opt to be more proactively secure and require administrative approval for all applications added to your network. Alternatively, you can adjust the permissions to allow users to automatically get authorization for applications considered “low impact”. These applications are from verified publishers or apps registered in this organization. I strongly recommend you do not choose to allow users consent for apps which allows all users to consent for any app to access the organization’s data. Susan Bradley Requiring administrative approval can add a layer of overhead that may be hard for an organization to administer. But this overhead may be the difference between a secure organization and one that gets hit with business email compromise. Especially in this era of high cloud usage, identity is the edge of your organization. Review logs of the OAuth integration and ensure the access is appropriate on a regular basis. Once an identity has been compromised with the reuse of an OAuth token you’ll need to reset passwords, reauthorize two-factor authentication and possibly consider isolating that user account and setting up a brand-new identity. On-premises Active Directory is also vulnerable Lest you think that compromises of on-premises Active Directory are any easier to root out, guess again. A recent Microsoft blog post showcased how attackers are just as eager to go after Active Directory identities and attack those as well. Microsoft recommends tools included in 365 Defender to help identify your weak spots. Start by reviewing your Defender for Identity section of the Secure score and review the recommendations that appear there. Next, consider what lateral movements attackers can possibly make in your organization’s network. I reiterate again how important the use and deployment of the Local Administrative Password Solution (LAPS) is in helping to prevent ingress in the first place. This automatically manages the password for the built-in administrator account on Windows devices. The initial setup of a workstation is typically accomplished with an image and a common password. If the attacker is able to obtain the value of this shared password, they are then able to perform lateral movement throughout the network. Even with the use of LAPS, you could have other tools that have a similar shared password. Backup software often introduces the risk of a shared account across many assets that may introduce the risk of lateral movement. Take the time to review your cloud authentication as well as your active directory identity and the protections you have put in place. Then go back and start over and review them again. Constant monitoring and review are key to a properly secure organization. Related content News whoAMI name confusion attacks can expose AWS accounts to malicious code execution By Shweta Sharma 14 Feb 2025 3 mins Cloud Security Cyberattacks Security How-to What security teams need to know about the coming demise of old Microsoft servers By Susan Bradley 13 Feb 2025 6 mins Cloud Security Data and Information Security Windows Security News Don’t use public ASP.NET keys (duh), Microsoft warns By Paul Krill 12 Feb 2025 1 min Cyberattacks Windows Security Other Sections PODCASTS VIDEOS RESOURCES EVENTS SPOTLIGHT: PRIORITIZING YOUR AI INVESTMENTS SUBSCRIBE TO OUR NEWSLETTER From our editors straight to your inbox Get started by entering your email address below. Please enter a valid email address Subscribe"
