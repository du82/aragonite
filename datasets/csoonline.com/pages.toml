title = "DeepSeek leaks one million sensitive records in a major data breach | CSO Online"
description = "Chinese AI startup DeepSeek left critical user data and internal secrets unprotected, raising alarms over security risks in the AI industry."
full_description = "Chinese AI startup DeepSeek left critical user data and internal secrets unprotected, raising alarms over security risks in the AI industry. Credit: Shutterstock/SObeR 9426 A New York-based cybersecurity firm, Wiz, has uncovered a critical security lapse at DeepSeek, a rising Chinese AI startup, revealing a cache of sensitive data openly accessible on the internet. According to a report published by Wiz, the exposed data included over a million lines of log entries, digital software keys, backend details, and user chat history from DeepSeek’s AI assistant. The firm’s researchers found that DeepSeek had inadvertently left an unsecured ClickHouse database accessible online, raising significant security concerns for enterprises and governments globally. [ Related: More DeepSeek news and analysis ] Wiz Chief Technology Officer Ami Luttwak confirmed in a blog post that DeepSeek swiftly acted to secure the database after being alerted. “They took it down in less than an hour,” Luttwak stated in the blog post. “But this was so simple to find, we believe we’re not the only ones who found it.” The security breach comes at a time when DeepSeek has been making headlines for its AI advancements, particularly with its DeepSeek-R1 reasoning model, which has been hailed as a cost-effective alternative to leading US-based AI solutions. However, this incident underscores a major concern for enterprises adopting AI—data security and the risks associated with rapid AI deployment. Earlier this week, the Chinese AI startup claimed to have been hit by a cyberattack prompting it to restrict user registration. What was exposed? The security lapse at DeepSeek involved a publicly accessible ClickHouse database that contained over a million log entries. The exposed data included chat histories, backend details, API secrets, and sensitive operational information, the report added. According to Wiz Research, the database was entirely unprotected, allowing unrestricted access to internal logs and potentially compromising user interactions. The unprotected database also granted full administrative control over its contents. Attackers with access could have retrieved proprietary data, extracted plaintext passwords, and even accessed local files stored on DeepSeek’s servers. Wiz researchers noted that there were no authentication mechanisms in place, making the breach particularly alarming. While DeepSeek acted swiftly to secure the exposed database after Wiz’s disclosure, the incident highlights the growing security risks within AI-driven platforms. As AI models become more advanced, the infrastructure supporting them must also evolve to prevent such critical vulnerabilities. The breach posed a severe risk, not only to DeepSeek but also to its users, as attackers could potentially exploit the exposed credentials to gain deeper access into the company’s systems. Regulatory and global scrutiny intensifies The DeepSeek data leak comes amid increasing global scrutiny of Chinese AI firms. On Tuesday, White House Press Secretary Karoline Leavitt said the US National Security Council (NSC) is reviewing DeepSeek’s implications on the country’s national security. Similarly, Italy’s data protection authority, Garante, announced that it is seeking answers from DeepSeek on its handling of personal data. The Italian watchdog is demanding clarity on what data DeepSeek collects, its sources, purposes, legal basis, and whether the information is stored in China. Ireland has also launched an investigation, with the country’s privacy watchdog, the Data Protection Commission (DPC), reportedly questioning the Chinese firm about how it processes its citizens’ data. This regulatory action reflects broader concerns about China’s AI ecosystem, which has rapidly gained traction and, in some cases, threatened the dominance of US AI companies. DeepSeek’s success in overtaking OpenAI’s ChatGPT on Apple’s App Store in the US earlier this week has further fueled anxieties about the company’s influence. Security lapses could dampen AI adoption Cybersecurity experts warn that AI startups, in their rush to scale, often overlook basic security hygiene. “The immediate security risks for AI applications stem from the infrastructure and tools supporting them,” the blog stated highlighting the broader risks posed by AI infrastructure vulnerabilities. “While much attention around AI security is focused on futuristic threats, the real dangers often come from basic misconfigurations.” The DeepSeek incident serves as a stark reminder of the cybersecurity risks enterprises face when integrating third-party AI models. As companies increasingly rely on AI solutions for automation and decision-making, security teams must work closely with AI engineers to ensure that fundamental security measures — such as data encryption, authentication controls, and regular security audits — are in place. What’s next for AI security? With AI adoption accelerating across industries, security lapses like this highlight the urgent need for stringent cybersecurity frameworks. Regulatory bodies worldwide are expected to ramp up their oversight of AI firms, particularly those handling vast amounts of user data. As the AI arms race continues, businesses investing in AI technologies must remain vigilant about their cybersecurity postures. The DeepSeek breach serves as a cautionary tale for enterprises evaluating AI providers: security cannot be an afterthought. DeepSeek’s rapid rise in the AI landscape has positioned it as a formidable player, but its recent security mishap raises critical questions about AI governance and risk management. For enterprises considering AI adoption, due diligence on security practices is more crucial than ever. As global regulators tighten scrutiny, the incident may set a precedent for how AI firms handle security and compliance. While DeepSeek may have acted swiftly to remediate the issue, the long-term impact of this exposure remains to be seen. Related content News Hacker allegedly puts massive OmniGPT breach data for sale on the dark web By Shweta Sharma 12 Feb 2025 3 mins Data Breach Generative AI News Analysis UK monitoring group to classify cyber incidents on earthquake-like scale By John Leyden 12 Feb 2025 5 mins Data Breach IT Governance Frameworks Incident Response News Analysis Nearly 10% of employee gen AI prompts include sensitive data By Evan Schuman 10 Feb 2025 6 mins Data and Information Security Generative AI News Hackers impersonate DeepSeek to distribute malware By Shweta Sharma 04 Feb 2025 3 mins Generative AI Malware Security Other Sections PODCASTS VIDEOS RESOURCES EVENTS SPOTLIGHT: PRIORITIZING YOUR AI INVESTMENTS SUBSCRIBE TO OUR NEWSLETTER From our editors straight to your inbox Get started by entering your email address below. Please enter a valid email address Subscribe"
