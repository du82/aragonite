title = "Why cyber hygiene remains critical in the era of AI-driven threats | CSO Online"
description = "AI is changing the security landscape today. However, IT leaders must not get hyper-fixated on these new challenges at the expense of getting the basics right. By practicing good cyber hygiene, they will be better placed to handle the challenges of today, and the AI-powered threats of the future."
full_description = "How IT leaders can build the foundations of a robust security strategy today. Credit: Adobe Stock Cyber-attacks are an assumed inevitable for businesses today. As companies increasingly handle large amounts of valuable data, safeguarding operations has never been more important. Now, half (50%) of IT decision-makers report information security as their most time-consuming task[1]. While AI offers a promising solution, security leaders must get the basics right first. Only by practicing good cyber hygiene can businesses counteract threats today. 1: Establishing a cyber foundation The rise of hybrid work has led to a significant increase in the number of devices and locations accessing company information. This distributed workforce reduces network visibility, leaving businesses with limited understanding of their overall internet exposure. Enforcing fundamental security measures, such as multi-factor authentication (MFA) and regular software updates and patching, should be non-negotiable components of any robust security strategy. Employees also must be educated around cybersecurity principles so they’re vigilant to potential threats. It may seem simple, but numerous attacks have happened, not because of sophisticated AI-powered methods but rather by malicious actors exploiting minor vulnerabilities. 2: Measuring potential risk Knowing where, what, and how much data a business is storing is crucial to identifying potential vulnerabilities and restoring operations during an incident. Without this basic knowledge, businesses cannot effectively respond and safeguard valuable data and systems. A robust access management strategy is paramount, as human error often serves as the entry point for breaches. Maintaining up-to-date records of who can access documents is essential. Introducing MFA, working to zero-trust principles, and establishing centralised logins access can be cross-referenced and integrated with physical security measures. 3: Assessing emerging technology risks Many criminals are yet to take advantage of AI as traditional techniques continue to be effective. While the technology enhances the sophistication of cyberattacks, from generating convincing emails and even realistic voiceovers for calls, the underlying vulnerabilities remain the same. As such, maintaining strong cybersecurity hygiene is a fundamental defence, even with the threat of AI. Ongoing reliance on digital communication channels enhances the potential threat of AI-powered phishing attacks, particularly in the context of hybrid working which can create security neglect due to distance from the office. Educating staff around such threats can enhance vigilance to attacks and act as a first step to protecting business infrastructure. 4: Creating an open culture Security breaches can often cause shame amongst employees, while businesses fear reputational damage amongst partners and customers. This can lead to a culture of secrecy, where successful attacks are dealt with in the dark. But silence only benefits the attackers themselves. A zero-blame culture where employees are encouraged to report issues without fear of reprisal enables business to quickly respond to attacks. Likewise, when an organisation suffers an attack, a culture of openness should allow them to share their experience and learn from them. Cyber hygiene to cyber resilience In today’s risk landscape, organisations must assume they will face an attack eventually. Building cyber resilience begins with mastering the basics, from educating staff to ensuring an up-to-date access management strategy. While AI poses a new threat, these foundational principles remain a business’ most effective defence against the majority of attacks today. Find out more about Canon’s Information Security Solutions. [1] Information Management research report – Canon Related content Other Sections PODCASTS VIDEOS RESOURCES EVENTS SPOTLIGHT: PRIORITIZING YOUR AI INVESTMENTS SUBSCRIBE TO OUR NEWSLETTER From our editors straight to your inbox Get started by entering your email address below. Please enter a valid email address Subscribe"
