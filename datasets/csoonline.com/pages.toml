["https://www.csoonline.com/article/3812874/how-law-enforcement-agents-gain-access-to-encrypted-devices.html"]
title = "How law enforcement agents gain access to encrypted devices | CSO Online"
description = "John Leyden is a senior writer for CSO Online. He has written about computer networking and cyber-security for more than 20 years. Prior to the advent of the web, he worked as a crime reporter at a local newspaper in Manchester, UK. John holds an honors degree in electronic engineering from City, University of London."
full_description = "From traditional investigative methods to zero-day exploits, authorities have a range of techniques at their disposal, including digital searches at borders, which could present concerns for CISOs. Credit: Gorodenkoff / Shutterstock Accessing data on encrypted devices might seem like something out of a hacker or spy movie, but for law enforcement, it’s a very real challenge. The issue is of relevance to CISOs and other security professionals because workers on sales trips or attending conferences overseas might face demands to decrypt devices and present their contents at border crossings. Chinese border agents, for example, may use specialized equipment to extract data from devices, even if locked or encrypted. Contrary to films, brute forcing an AES encryption key or similar encryption technologies is impractical — at least pending the advent of powerful enough quantum computers. Modern encryption is pretty solid, but luckily for law enforcement and spy agencies the software and people using it are pretty fallible. Access requests Gaining access to a suspect’s mobile phone or computer is a high priority for law enforcement. When a mobile device is seized, law enforcement can request the PIN, password, or biometric data from the suspect to access the phone if they believe it contains evidence relevant to an investigation. In England and Wales, if the suspect refuses, the police can give a notice for compliance, and a further refusal is in itself a criminal offence under the Regulation of Investigatory Powers Act (RIPA). “If access is not gained, law enforcement use forensic tools and software to unlock, decrypt, and extract critical digital evidence from a mobile phone or computer,” says James Farrell, an associate at cyber security consultancy CyXcel. “However, there are challenges on newer devices and success can depend on the version of operating system being used.” In general, law enforcement agencies gain access to encrypted devices (both PCs and mobile devices) using one of several general approaches: Traditional investigative techniques Exploiting vulnerabilities and zero days Backdoors Manufacturer cooperation Remote hacking Supply chain attacks Traditional investigative techniques The most straightforward approach is for law enforcement agencies to seize devices while in an “unlocked” state. Search and seizure of physical locations to find written passwords or unencrypted copies of data might also be possible. Surveillance to capture passwords or encryption keys as they are entered offers another conventional approach to access data on encrypted devices. Simply guessing the device password may or may not be viable depending on the retry lockouts, and the kind of password/locking mechanism chosen, but it’s a possibility. “This could involve brute force, dictionary attacks (testing likely passwords from past breaches using many combinations), or social engineering, such as stealing the password or shoulder surfing,” Jeff Watkins, CTO at digital consultancy CreateFuture, tells CSO. “Another option is to attack or obtain a warrant to access cloud backups, which may be the easiest route to the required data, depending on their security.” Vulnerability exploits Similar to penetration testers, law enforcement or vendors, such as Cellebrite, leverage vulnerabilities to bypass encryption. Often referred to as zero days, these may be unknown to the general public or even the device manufacturer at the time. In some cases, older — but only partially resolved — vulnerabilities might still be open to exploitation. For example, a talk at the recent Chaos Computer Club conference showed how bypassing BitLocker encryption on a fully up-to-date Windows 11 system using Secure Boot might be possible. The hack exploited a Windows vulnerability, bitpixie (CVE-2023-21563), combined with a downgrade attack. Exploiting the bitpixie vulnerability against Windows BitLocker involves forcing the machine to boot in recovery mode over a network connection, loading the volume mount key into memory. Another machine can then create a memory dump over the local area network, which contains the key, effectively bypassing BitLocker. The exploit opens the door to a full-scale compromise of a Windows system protected by BitLocker encryption, utilizing Secure Boot and TPM (Trusted Platform Module). Neither the researcher — Thomas Lambertz of Neodyme — nor Microsoft returned requests for comment from CSO; however, independent security experts told CSO that the attack vector was unlikely to be closed anytime soon. “This isn’t a new vulnerability, but its scope is limited to UEFI systems, meaning it leans in the favour of newer devices,” says Conor Agnew, head of compliance operations at penetration testing firm Closed Door Security. Agnew continued: “It was publicly announced in 2023 and supposedly patched. What’s most concerning is how there’s not the usual requirement of having possession of a device, stripping it to pieces, and brute forcing encryption keys.” “It’s a very quick attack — in relative terms of decryption attacks — and is likely not going to be resolved until 2026 when Microsoft rolls out the Secure Boot certificate updates,” Agnew says. Being able to entirely negate the on-disk encryption obviously poses a huge concern for anyone carrying data around on portable devices. “Getting a hold of something running BitLocker as the only form of encryption essentially becomes an open book,” Agnew says. “We don’t have to look too far back to see MOD [UK Ministry of Defence] devices left at bus stops.” Backdoors Vendors such as Apple publicly state they do not create backdoors for law enforcement, but there’s a lot of speculation around this and many vendors have been caught with backdoors or security weaknesses in their systems. Law enforcement agencies have pressured companies to create “lawful access” solutions, particularly on smartphones, to take Apple as an example. “You also have the co-operation of cloud companies, which if backups are held can sidestep the need to break the encryption of a device all together,” Closed Door Security’s Agnew explains. The security community has long argued against law enforcement backdoors, not least because they create security weaknesses that criminal hackers might exploit. “Despite protests from law enforcement and national security organizations, creating a skeleton key to access encrypted data is never a sensible solution,” CreateFuture’s Watkins argues. “What good actors can access, bad actors eventually will, too. The same applies to hardware-level backdoors in devices like phones and laptops — often requested by law enforcement but a terrible idea for genuine security,” Watkins adds. Remote hacking Remote access to phones and computers can be achieved through remote hacking with the relevant sanctioned authorities. “This includes accessing data and listening to communications,” says CyXcel’s Farrell. “Alternatively, software or hardware can be introduced covertly to the physical devices and then monitored remotely.” Law enforcement agencies do need to identify the suspect’s number before gaining access remotely. This can be achieved by deploying equipment that replicates a cell site base station. “Deploying the equipment convinces the phones that it is the best connection and once connected, the IMSI (International Mobile Subscriber Identity) is then recorded,” Farrell explains. “Tactical use with the suspect under surveillance will identify the suspects phone number. This equipment is used globally by law enforcement.” Depending on the user’s location, an evil twin Wi-Fi network in a public place could allow for decrypted access to network traffic without physically accessing the machine. Malware is likely the easiest way to achieve machine access, probably through a targeted attack, such as tricking a suspect into downloading malware or a USB key left on a desk with “free bitcoin” printed on it (or a similar enticing promise). “A similar alternative, which sounds like a ‘Mission Impossible’ plot but is in use today, is to exploit side channels, such as EM [electro-magnetic] interference or acoustic attacks, to retrieve a machine’s password,” CreateFuture’s Watkins says. “Wireless keyboards and other devices are often vulnerable and can be exploited without the user’s knowledge,” Watkins adds. Supply chain attacks Another possibility to expose a target’s encryption key or password relies on malware or hardware interference using something installed in the supply chain. EncroChat was a Europe-based encrypted communications network and service provider. It offered modified Android smartphones with enhanced security features, including encrypted communications and remote wiping. The service gained popularity among criminals following the closure of similar services, helping to boost its membership to around 60,000 subscribers by mid-2020. European law enforcement agencies successfully infiltrated the EncroChat network, deploying malware on a French server allowing them to access messages and disable the panic wipe feature. The police operation led to thousands of arrests. Jessica Sobey, barrister at Stokoe Partnership Solicitors, an experienced criminal defense lawyer, said the admissibility of evidence obtained through the Encrochat hack was fiercely contested in court. “The IPT [Investigatory Powers Tribunal] rejected the defense argument that the NCA withheld critical information when it applied for a warrant to obtain messages from the EncroChat network,” Sobey tells CSO. “It ruled that the use of a TEI warrant was justified, and that the investigation could be classified as a single investigation into the criminal use of EncroChat.” Sobey adds: “Defense lawyers, however, continue to argue that the IPT has blurred the distinction between bulk warrants and thematic warrants and this could still prove to be fertile ground for legal challenges. concerning the gathering of digital evidence from encrypted devices.” Related content News Microsoft files lawsuit against LLMjacking gang that bypassed AI safeguards By Lucian Constantin 28 Feb 2025 4 mins Cybercrime Generative AI Threat and Vulnerability Management Brandpost Sponsored by Tanium Is your enterprise ‘cyber resilient’? Probably not. Here’s how other boards fixed that By Tony Bradley 28 Feb 2025 8 mins Security Feature What is zero trust? The security model for a distributed and risky era By Josh Fruhlinger 28 Feb 2025 10 mins Access Control Identity and Access Management Zero Trust Feature The CSO guide to top security conferences By CSO Staff 28 Feb 2025 10 mins Application Security Events Technology Industry Other Sections PODCASTS VIDEOS RESOURCES EVENTS SPOTLIGHT: PRIORITIZING YOUR AI INVESTMENTS SUBSCRIBE TO OUR NEWSLETTER From our editors straight to your inbox Get started by entering your email address below. Please enter a valid email address Subscribe"
