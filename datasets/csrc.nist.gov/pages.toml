["https://csrc.nist.gov/nist-cyber-history"]
title = "NIST Cybersecurity Program History and Timeline | CSRC"
full_description = "Official websites use .govA .gov website belongs to an official government organization in the United States. Secure .gov websites use HTTPSA lock ( Lock Locked padlock icon ) or https:// means you’ve safely connected to the .gov website. Share sensitive information only on official, secure websites. For more than 50 years, NIST—formerly the National Bureau of Standards (NBS), until 1988—has conducted cybersecurity research and developed cybersecurity guidance for industry, government, and academia. Since 1972, NIST has made extraordinary advancements in cybersecurity, leading the effort to the current state of technology that exists today. To highlight many of these accomplishments and honor the hard work and dedication by NIST's cybersecurity staff, NIST has developed the NIST Cybersecurity Program History and Timeline. The timeline provides an overview of the major research projects, programs, and ultimately, NIST's cybersecurity history. This history has been compiled by bringing together several sources of information, including written contributions from and interviews with current and former NIST employees, the Annual Reports on cybersecurity produced by NIST starting in 2003, and current and past NIST webpages and publications. NIST would like to thank the following individuals who contributed to the development of this site, in addition to the many other NIST colleagues who used their subject matter expertise to review the site (included are the affiliations of individuals at the time of their contributions) :"
