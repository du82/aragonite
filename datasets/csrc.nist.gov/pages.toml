title = "NIST Workshop on Guidance for KEMs | CSRC"
description = "Read the Code of Conduct for NIST Meetings  Call for Submissions (submission deadline January 28, 2025)  The initial public draft of NIST Special Publication (SP) 800-227, Recommendations for Key-Encapsulation Mechanisms, is now available for public..."
full_description = "Official websites use .govA .gov website belongs to an official government organization in the United States. Secure .gov websites use HTTPSA lock ( Lock Locked padlock icon ) or https:// means you’ve safely connected to the .gov website. Share sensitive information only on official, secure websites. The initial public draft of NIST Special Publication (SP) 800-227, Recommendations for Key-Encapsulation Mechanisms, is now available for public comment. NIST recently published FIPS 203, Module-Lattice-Based Key-Encapsulation Mechanism Standard, to update its cryptographic standards with an algorithm designed to provide protection from quantum attacks. In addition, NIST will select one or two additional quantum-resistant key-encapsulation mechanisms (KEMs) for standardization. To provide guidance on using KEMs, NIST is introducing SP 800-227, Recommendations for Key Encapsulation Mechanisms. This draft document describes the basic definitions, properties, and applications of KEMs. It also provides recommendations for implementing and using KEMs in a secure manner. The public comment period is open through March 7, 2025. See the publication details for a copy of the draft and instructions for submitting comments. ML-KEM is Great! What’s Missing? John Preuß Mattsson, Erik Thormarker, Göran Selander, Santeri Paavolainen, Sini Ruohomaa, Juha Sääskilahti, Taylor Hartley, Helena Vahidi Mazinani, Mohsin Kahn (Ericsson) Building Post-Quantum Cloud Services: Deploying FIPS 203:ML-KEM at AWS Dr. Jake Massimo, Dr. Matthew Campagna, Panos Kampanakis, Dr. Dusan Kostic, Dr. Mila Anastasova (Amazon Web Services) Updates to ETSI's Quantum-Safe Hybrid Key Establishment Standards and New European Standardization Initiative Matthew Campagna (Amazon Web Services) Advanced FO Concepts: Verifiable Decapsulation, Multi-user Security, and Rejection Modes Lewis Glabush (EPFL), Felix Günther (IBM Research Europe – Zurich), Kathrin Hövelmanns (Eindhoven University of Technology), Mikhail Kudinov (Eindhoven University of Technology), and Douglas Stebila (University of Waterloo)"
