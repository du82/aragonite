title = "Measurements for Information Security | CSRC"
description = "The Measurements for Information Security Program aims to better equip organizations to purposefully and effectively manage their information security risk through the development of flexible approaches to the selection, assessment, and management of..."
full_description = "Official websites use .govA .gov website belongs to an official government organization in the United States. Secure .gov websites use HTTPSA lock ( Lock Locked padlock icon ) or https:// means you’ve safely connected to the .gov website. Share sensitive information only on official, secure websites. The Measurements for Information Security Program aims to better equip organizations to purposefully and effectively manage their information security risk through the development of flexible approaches to the selection, assessment, and management of measures and metrics. SP 800-55v1 Measurement Guide for Information Security – Volume 1, Identifying and Selecting Measures, provides a flexible approach to the development, selection, and prioritization of information security measures. SP 800-55v2 Measurement Guide for Information Security – Volume 2, Developing an Information Security Measurement Program, provides a flexible methodology and workflow for developing and implementing an information security measurement program. In 2025 NIST Cybersecurity Risk Analytics and Measurement Team will be hosting a virtual round table to introduce the NIST’s Cybersecurity Metrics and Measures Community of Interest. The round table will feature a panel of experts to discuss the current state of information security performance metrics and measures. For more information contact cyber-measures@list.nist.gov. Reach the Cyber-measure team at: Cyber-measures@list.nist.gov Hung Trinh hung.trinh@nist.gov Katherine Schroeder Katherine.Schroeder@nist.gov Cyber Risk Analytics Cybersecurity Framework Cybersecurity Supply Chain Risk Management National Vulnerability Database Program Review for Information Security Assistance"
