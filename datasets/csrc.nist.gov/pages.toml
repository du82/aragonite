["https://csrc.nist.gov/Events/2025/trusted-semiconductor-supply-chain-workshop"]
title = "Trust and Provenance in the Semiconductor Supply Chain Workshop | CSRC"
description = "The NIST Trust and Provenance in the Semiconductor Supply Chain Workshop will be held as an in-person on Tuesday, April 15, 2025 at the NIST National Cybersecurity Center of Excellence (NCCoE) conference facility, in Rockville, MD. This one-day event aims..."
full_description = "Official websites use .govA .gov website belongs to an official government organization in the United States. Secure .gov websites use HTTPSA lock ( Lock Locked padlock icon ) or https:// means you’ve safely connected to the .gov website. Share sensitive information only on official, secure websites. The NIST Trust and Provenance in the Semiconductor Supply Chain Workshop will be held as an in-person on Tuesday, April 15, 2025 at the NIST National Cybersecurity Center of Excellence (NCCoE) conference facility, in Rockville, MD. This one-day event aims to bring together technical experts from industry, academia, and the government to discuss drivers, need, methods and process to establish trust and provenance across the semiconductor supply chain. The workshop will solicit and obtain valuable feedback from the community to prioritize opportunities to enhance the security and provenance of the microelectronics components and products across the supply chain till end of life. The one-day event will feature plenary, panel, and interactive breakout sessions. Participants are expected to collaborate and discuss key questions and topics that will identify short-term (less than 1 year) and longer-term activities related to the supply chain trust and provenance. The questions that will be considered include, but are not limited to:"
