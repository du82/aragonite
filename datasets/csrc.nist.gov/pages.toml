title = "About NIST's Security Components and Mechanisms Group | CSRC"
full_description = "Official websites use .govA .gov website belongs to an official government organization in the United States. Secure .gov websites use HTTPSA lock ( Lock Locked padlock icon ) or https:// means you’ve safely connected to the .gov website. Share sensitive information only on official, secure websites. The Security Components and Mechanisms (SCM) Group’s security research focuses on the development and management of foundational building-block security mechanisms and techniques that can be integrated into a wide variety of mission-critical U.S. information systems. The group’s work spans a spectrum from near-term hardening and improvement to the design and analysis of next-generation, leapahead security capabilities. Computer security depends fundamentally on the level of trust that can be established for computer software and systems. This work, therefore, focuses strongly on assurance building activities ranging from the analysis of software configuration settings to advanced trust architectures to testing tools that surface flaws in software modules. Staff Listing and Profiles Biometric Conformance Test Software Combinatorial Methods for Trust and Assurance Combinatorial Testing for AI-Enabled Systems Cyber Threat Information Sharing High-Performance Computing Security Working Group Incident Response macOS Security REDLedger - REdactable Distributed Ledger Resource Oriented Lightweight Information Exchange Roots of Trust Software Identification Tagging Vulnerability Disclosure Guidance"
