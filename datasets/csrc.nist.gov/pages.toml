title = "NIST Workshop on Privacy-Enhancing Cryptography 2024 | CSRC"
description = "WPEC 2024 (September 24th–26th) is a virtual workshop, free to attend, and with a call for talk proposals.  Featured topics: Private-Set Intersection (PSI); Fully-Homomorphic Encryption (FHE); Secure Multi-Party Computation (MPC); Zero-Knowledge Proofs..."
full_description = "Official websites use .govA .gov website belongs to an official government organization in the United States. Secure .gov websites use HTTPSA lock ( Lock Locked padlock icon ) or https:// means you’ve safely connected to the .gov website. Share sensitive information only on official, secure websites. WPEC 2024 (September 24th–26th) is a virtual workshop, free to attend, and with a call for talk proposals. Featured topics: Private-Set Intersection (PSI); Fully-Homomorphic Encryption (FHE); Secure Multi-Party Computation (MPC); Zero-Knowledge Proofs (ZKP). WPEC 2024 fosters Privacy-Enhancing Cryptography (PEC), hosting The First PSI Day, and various talks on FHE, MPC and ZKP. The workshop slides and videos are available (check the schedule of each day, or the list of abstracts below) WPEC 2024, the NIST Workshop on Privacy-Enhancing Cryptography 2024, will bring together multiple perspectives of Privacy-Enhancing Cryptography (PEC) from diverse stakeholders. The 3-day virtual workshop is organized for sharing insights about PEC capabilities, use-cases, real-world deployment, initiatives, challenges and opportunities, and the related context of privacy & auditability. The workshop delves into: WPEC 2024 is organized within the scope of the NIST Privacy-Enhancing Cryptography (PEC) project. Various topics are also of direct interest to the NIST Multi-Party Threshold Cryptography (MPTC) project. The workshop will host technical and positioning talks, and panel discussions, in a learning and collaborative environment. The presentations will be recorded and made available online. The gathering of reference material is intended as informative for future characterization of PEC techniques, listing of potential use-cases, and the matching between PEC capabilities and real-world privacy & auditability challenges. The workshop spans three (3) days, organized into two (2) sessions per day, with six (6) slots per session. Overall, the schedule has 36 slots, including 20 accepted talk proposals, 9 invited talks, and other slots for introductions or open-comments. The list of talks is detailed in the schedule of each day, below, inside each corresponding collapsible container."
