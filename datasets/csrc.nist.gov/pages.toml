["https://csrc.nist.gov/Events/2024/enhancing-security-of-devices-and-components"]
title = "Enhancing Security of Devices and Components Across the Supply Chain | CSRC"
description = "Agenda    \t \t\t \t\t\tIntroduction and Overview \t\t \t\t \t\t\t9:00 – 9:25 ET \t\t\tSanjay Rekhi - NIST \t\t\tKevin Stine - NIST \t\t \t\t \t\t\tHardware Development Lifecycle \t\t \t\t \t\t\t9:30 – 10:30 ET \t\t\t \t\t\tJonathan Ring – Office of the National Cyber Director  \t\t\tAdam Golodner..."
full_description = "Official websites use .govA .gov website belongs to an official government organization in the United States. Secure .gov websites use HTTPSA lock ( Lock Locked padlock icon ) or https:// means you’ve safely connected to the .gov website. Share sensitive information only on official, secure websites. NIST is hosting an in-person all-day workshop on February 27, 2024 to bring together industry, academia, and government to discuss the existing and emerging cybersecurity threats and mitigation techniques for semiconductors throughout their lifecycle spanning the development and manufacturing environments. The purpose of this workshop is to solicit and obtain valuable feedback from the community for informing NIST plan and prioritization on the development of cybersecurity and supply chain standards, guidance, and recommended practices. The topics revolve around cybersecurity measurements and metrics in the form of reference data sets to support the testing, attestation, certification, and verification of the semiconductor and its components and the use of automated cybersecurity tools and techniques throughout the development lifecycle of the semiconductor and components and maintaining the security of the development and manufacturing environments. All in-person attendees must be pre-registered to gain entry to the NIST/NCCoE campus. Photo identification must be presented at the guard to be admitted to the workshop. International attendees are required to present a passport. Please see Security Instructions below for more details. Attendees must wear their conference badge at all times while on the campus. There is no on-site registration for meetings held at NIST/NCCoE."
