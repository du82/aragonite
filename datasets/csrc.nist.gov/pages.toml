full_description = 'Official websites use .govA .gov website belongs to an official government organization in the United States. Secure .gov websites use HTTPSA lock ( Lock Locked padlock icon ) or https:// means you’ve safely connected to the .gov website. Share sensitive information only on official, secure websites. NIST will host the Third NIST Workshop on Block Cipher Modes of Operation on October 3-4, 2023, at the National Cybersecurity Center of Excellence in Rockville, Maryland. NIST hosted the two previous modes workshops in conjunction with the development of the Advanced Encryption Standard (AES) in the early 2000s. This workshop will discuss how NIST can best address the limitations of the block cipher modes of operation ("modes", for short) that are approved in the NIST Special Publication 800-38 series, which will be documented in an initial public draft of NIST Internal Report (NIST IR) 8459, Report on the Block Cipher Modes of Operation in the NIST SP 800-38 Series. NIST is particularly interested in discussing the possibility of standardizing a tweakable wide block encryption technique that could support a large range of input lengths. NIST is also soliciting research and discussion papers, surveys, presentations, case studies, panel proposals, and participation from all interested parties. Submissions must be provided electronically in PDF format and sent to ciphermodes@nist.gov. NIST will post the accepted papers and presentations on the workshop website, though no formal proceedings will be published. Key Committing Security of AEZ Yu Long Chen, Antonio Flórez-Gutiérrez, Akiko Inoue, Ryoma Ito, Tetsu Iwata, Kazuhiko Minematsu, Nicky Mouha, Yusuke Naito, Ferdinand Sibleyras, Yosuke Todo Overloading the Nonce: Rugged PRPs, Nonce-Set AEAD, and Order-Resilient Channels Jean Paul Degabriele and Vukašin Karadžic Practical Challenges with AES-GCM and the Need for a New Cipher Panos Kampanakis, Matt Campagna, Eric Crocket, Adam Petcher, Shay Gueron KIVR: Context-Committing Authenticated Encryption Using Plaintext Redundancy and Application to GCM and Variants Yusuke Naito, Yu Sasaki, Takeshi Sugawara'
