full_description = "Official websites use .govA .gov website belongs to an official government organization in the United States. Secure .gov websites use HTTPSA lock ( Lock Locked padlock icon ) or https:// means you’ve safely connected to the .gov website. Share sensitive information only on official, secure websites. NIST held the 5th NIST PQC Standardization Conference from April 10-12, 2024, in Rockville, Maryland. The purpose of the conference was to discuss various aspects of the algorithms (both those selected and those being evaluated) and to obtain valuable feedback for informing decisions on standardization. NIST invited the submission teams for BIKE, Classic McEliece, Falcon, and HQC to give an update on their algorithms. Practical and Theoretical Cryptanalysis of VOX Hao Guo, Yi Jin, Yuansheng Pan, Xiaoou He, Boru Gong, Jintai Ding Nibbling MAYO: Optimized Implementations for AVX2 and Cortex-M4 Ward Beullens, Fabio Campos, Sofia Celi, Basil Hess, Matthias Kannwischer The impact of data-heavy, post-quantum TLS 1.3 on the Time-To-Last-Byte of real-world connections Panos Kampanakis, Will Childs pqm4: Benchmarking NIST Additional Post-Quantum Signature Schemes on Microcontrollers Matthias Kannwischer, Markus Krausz, Richard Petri, Shang-Yi Yang Novel Schoolbook-Originated Polynomial Multiplication Accelerators for NTRU-based PQC Yazheng Tu, Shi Bai, Jinjun Xiong, Jiafeng Xie Efficacy and Mitigation of the Cryptanalysis on AIM Seongkwang Kim, Jincheol Ha, Mincheol Son, Byeonghak Lee Migrating Some Legacy e-Governance Applications to Post-Quantum Cryptography Petr Muzikant, Jan Willemson, Peeter Laud Single trace HQC shared key recovery with SASCA Guillaume Goy, Julien Maillard, Philippe Gaborit, Antoine Loiseau Finding isomorphisms between trilinear forms, slightly faster Anand Narayanan, Youming Qiao, Gang Tang PQC Standardization A Vendor’s Perspective (This was submitted as a PPTX) Lauren De Meyer, Mike Hamburg, Simon Hoerder, Qinglai Xiao, Victor Arriba