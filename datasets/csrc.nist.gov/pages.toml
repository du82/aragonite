description = "Featured topics: Timelock Encryption, Witness Encryption, Deniable Encryption.  Structure: Welcome/introduction; two invited talks; break; one invited talk and a panel conversation.  Date and time: January 16th, 2025, 12:00–16:00 EST (UTC -5). (Subject to..."
full_description = 'Official websites use .govA .gov website belongs to an official government organization in the United States. Secure .gov websites use HTTPSA lock ( Lock Locked padlock icon ) or https:// means you’ve safely connected to the .gov website. Share sensitive information only on official, secure websites. Structure: Welcome/introduction; two invited talks; break; one invited talk and a panel conversation. Format: Webinar (presenters can share video and audio; attendees can use text for questions and comments). (Based on text provided by the speakers/panelists, with possible adaptations/abbreviations for conciseness and consistency; see possible links for extended bios) Organization: The STPPA series is hosted by the NIST Privacy-Enhancing Cryptography (PEC) project. The PEC team (Luís Brandão, Angela Robinson, René Peralta) and all speakers (mentioned above) participated in the panel conversation. Angela Robinson introduced two talks/speakers. The STPPA7 event was organized by Luís Brandão, who also opened the event and introduced one talk/speaker. The virtual event (webinar) received around 215 registrations, of which around 115 attended at least 30 minutes, and around 90 attended more than 90 minutes. About STPPA: In the "Special Topics on Privacy and Public Auditability" series, the NIST privacy-enhancing cryptography (PEC) project hosts talks on various interconnected topics related to privacy and public auditability. A main goal of the STPPA series is to gather reference material about "PEC tools", which may facilitate future reflections on aspects of standardization and of development of recommendations/guidelines about advanced cryptography, namely for uses related to privacy and public auditability. Each event intends to convey basic technical background, incite curiosity, suggest research questions and discuss applications, with an emphasis on the role of cryptographic tools. Code of conduct: Attending an STPPA event requires abiding to the Code of Conduct for NIST Conferences.'
