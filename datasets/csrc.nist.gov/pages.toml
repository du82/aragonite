title = "The NIST CSF 2.0 is Here! | CSRC"
description = "The NIST Cybersecurity Framework (CSF) 2.0 is now available, along with many supplementary resources."
full_description = "Official websites use .govA .gov website belongs to an official government organization in the United States. Secure .gov websites use HTTPSA lock ( Lock Locked padlock icon ) or https:// means you’ve safely connected to the .gov website. Share sensitive information only on official, secure websites. The NIST Cybersecurity Framework (CSF) 2.0, along with its supplementary resources, can be used by organizations to understand, assess, prioritize, and communicate cybersecurity risks. It is particularly useful for fostering internal and external communication at all levels (including across internal teams, from the C-Suite through middle management—and to those carrying out daily cybersecurity responsibilities). The CSF also seeks to improve communication with suppliers and partners and is intended to help organizations integrate cybersecurity-related issues with broader enterprise risk management strategies. Questions or comments about the CSF 2.0? Send them to cyberframework@nist.gov. You can also follow us on X via @NISTcyber to stay updated."
