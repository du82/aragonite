full_description = "bookmarks css web sustainability AI February 2024 Bookmarks Tue Feb 27 2024 I was just collating all the articles I’ve read over the past month in order to post them here when, coincidentally, Matthias Ott’s latest Own Your Web newsletter lands in my inbox! This month it’s all about bookmarks: how you collate them, where you keep them, and how you share them. I definitely need a better way to organise mine, which is why I’m sharing them here. Here’s a bunch of stuff I’ve found interesting this month: Web and CSS What is Utility-First CSS? by Heydon Pickering Okay, Color Spaces by Eric Portis A manifesto for small, static, web apps by Ross Wintle Reality Check #3: Building out a layered hero grid layout from Dribbble by Andy Bell Why my code isn't in TypeScript by Remy Sharp It's OK to abandon your side-project by Robb Owen Own Your Web – Issue 10: Links Worth Sharing by Matthias Ott Home Screen Advantage: Decoding Apple's Ploy To Scuttle Progressive Web Apps by Alex Russell CSS :has() Interactive Guide Sustainability Carbon Aware Computing: Next Green Breakthrough or New Greenwashing? by Ismael Velasco Power grab: the hidden costs of Ireland’s datacentre boom by Jessica Traynor How ad platforms like Facebook, Google, and others drive climate change by Abdul Semakula Plastic experts say recycling is a scam. Should we even do it anymore? by Matthew Rozsa AI and tech criticism Losing the imitation game by Jennifer Moore How artists are fighting generative AI by Paris Marx A dozen thoughts about AI by Dave Rupert How Allowing Copyright On AI-Generated Works Could Destroy Creative Industries by Glyn Moody On The Enshittification of Everything! by Omayma Said On NYT Magazine on AI: Resist the Urge to be Impressed by Emily M Bender The Great Fiction of AI by Josh Dzieza Review: Chris Dixon's Read Write Own by Molly White Demos Alvaro Montoro’s collection of CSS toggles Temani Afif’s animated flower shapes — one example Webmentions for this page About webmentions Likes: 10 Reposts: 3 Mentions: 2 @michelle @matthiasott It's a great list. Thank you, Michelle! - Christian Niklas ← Previous: Design Patterns that Encourage Junk Data Next: → Creating Color Palettes with the CSS color-mix() Function"
