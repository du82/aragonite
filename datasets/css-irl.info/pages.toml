full_description = "Demo National Blog Posting Month css A Fun CSS Text Effect Sun Nov 19 2023 Day 19 of National Blog Posting Month #NaBloPoMo Today’s post is a quick one, but (hopefully!) a fun one! It’s a demo featuring a fun text effect, using background-clip: text and text-stroke. It’s not a new technique, but worth remembering. It looks like the text has been clipped out of the black translucent background, but in fact the <h1> just has the same background as the body. I’m making sure they line up with each other by setting the background-position to center. See the Pen Background text fill by Michelle Barker (@michellebarker) on CodePen. It’s interesting to see how browsers handle the different properties. -webkit-text-stroke (it has to be prefixed to work cross-browser) seems to render unevenly in Firefox with this particular font. I also think it looks pretty cool without the text stroke. The other trick here is using the filter property to create the shadow. The text colour has to be set to transparent in order to see the background “through” the text, so text-shadow doesn’t work as it hides the text. I’m also using some of these techniques for the hero text effect on my personal site. Webmentions for this page About webmentions Likes: 0 Reposts: 0 Mentions: 2 ← Previous: Drawing Raindrops with CSS Gradients and Masks Next: → Reality Check: A Series for Building Real Layouts"
