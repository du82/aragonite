full_description = "Quick tip css custom properties javascript Quick Tip: Style Pseudo-elements with Javascript Using Custom Properties Sun Mar 28 2021 In Javascript we have a few ways of selecting elements, but we can’t directly target pseudo-elements. Something like this, for instance, won’t work, and will return null: document.querySelector('.my-element::after') That can make it tricky to apply styles to pseudo-elements with JS. If we want to dynamically calculate the height of an element and apply it with JS, we can do it like so: const element = document.querySelector('.my-element') element.style.height = someFunctionToCalculateHeight() But how do we do this with a pseudo-element? Luckily, CSS custom properties can help. We can instead assign a custom property for the height in our CSS: .my-element::after { height: var(--height, 0); } Here I’m providing a default (or fallback) value of 0 for the custom property. It’s a good idea to provide a default if we’re relying on the custom property being defined in JS (if we want it to be anything other than the property’s default value). Then we can set the value in JS: const element = document.querySelector('.my-element') element.style.setProperty('--height', someFunctionToCalculateHeight()) Here’s a simple demo (and yes, I know the JS in this example is unecessary as it could easily be achieved with CSS alone — it’s merely to illustrate the concept!): See the Pen Style pseudo-element with custom property by Michelle Barker (@michellebarker) on CodePen. Webmentions for this page About webmentions Likes: 0 Reposts: 0 Mentions: 1 ← Previous: Animating Underlines Next: → Paper Snowflakes: Combining Clipping and Masking in CSS"
