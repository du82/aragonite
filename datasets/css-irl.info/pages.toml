title = "CSS { In Real Life } | Different Approaches to Responsive CSS Motion Path"
description = "← Previous:"
full_description = "motion path animation css Different Approaches to Responsive CSS Motion Path Sat Apr 18 2020 When it comes to using CSS Motion Path, it always bugs me that the path itself is doesn’t scale. The path size, as created, is essentially a fixed size, in pixels. It means that responsive design with Motion Path is a little tricky, and requires some workarounds. Scaling the path Happily, fellow CodePen enthusiast (and awesome animator) Jhey Tompkins has figured out a way to scale a path value, with some imaginative thinking, and charting library D3 - and has written about it on CSS Tricks. This is a clever way to scale the path if you don’t want the elements on the path to scale themselves. It even allows for scaling the path on either axis, if we don’t want to preserve the aspect ratio. Jhey even put together a demo testing it on one of my own CodePen experiments: See the Pen <a href='https://codepen.io/jh3y/pen/XWbLdVd'>Typo-coaster w/ Meanderer</a> by Jhey (<a href='https://codepen.io/jh3y'>@jh3y</a>) on <a href='https://codepen.io'>CodePen</a>. A transform approach As Jhey’s demo shows, we’d also need to do some work to scale the text to get a result that’s useful for us. Sometimes it might make more sense to scale not only the path, but the elements animating on it, when the viewport is resized. I tested a different approach: using Resize Observer to calculate the transform scale value from a parent container. This outputs a custom property value, which is then used in a CSS transform: See the Pen <a href='https://codepen.io/michellebarker/pen/zYvOVjo'>Motion path scaling</a> by Michelle Barker (<a href='https://codepen.io/michellebarker'>@michellebarker</a>) on <a href='https://codepen.io'>CodePen</a>. This also with other content in the document flow, which I wasn’t sure it would. See the Pen <a href='https://codepen.io/michellebarker/pen/KKdMMKd'>Motion path scaling</a> by Michelle Barker (<a href='https://codepen.io/michellebarker'>@michellebarker</a>) on <a href='https://codepen.io'>CodePen</a>. Both of these approaches would benefit from more experimentation, and could be useful in different cases. I’m looking forward to working with them a bit more, as being able to scale paths would be a big incentive to using Motion Path in production. Webmentions for this page About webmentions Likes: 0 Reposts: 0 Mentions: 1 ← Previous: Building an Interactive Timetable Next: → Tips for Writing for the Web"
