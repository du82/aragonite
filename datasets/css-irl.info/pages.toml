title = "CSS { In Real Life } | To Grid or to Flex?"
description = "← Previous:"
full_description = "css grid flexbox layout To Grid or to Flex? Sun Feb 10 2019 A recent Twitter thread started by Chris Coyier got me thinking about how people in general interpret the use cases for CSS Grid Layout versus flexbox: For y'all that have an understand of both CSS grid and flexbox, what's your favorite way of explaining the difference?— Chris Coyier (@chriscoyier) January 25, 2019 Naturally some of the most insightful replies came from Rachel Andrew and Jen Simmons: Flexbox is for one dimensional layout. A row OR a column. Grid is for two dimensional layout. Rows AND columns.— Rachel Andrew (@rachelandrew) January 25, 2019 Grid makes actual columns and rows. Content will line up from one to the other, as you ask it to. Flexbox doesn’t. Not only in the second dimension (which is easiest to talk about), but also in the first dimension. Flexbox isn’t for most of the things we’ve been using it for.— Jen Simmons (@jensimmons) January 26, 2019 However, reading tweets individually doesn’t tell the whole story. In this article I want to unpack when and where you might want to use Grid or flexbox, and some reasons for choosing one or the other. What surprised me about reading the responses in the thread was the number of people stating that they would only use Grid for page-level layout, and flexbox for everything else. If you take this as a rule, then you’re severely limiting yourself when it comes to Grid’s power. The main piece of advice I would give is to take every design individually, analyse the options available and don’t make assumptions about which technology you need. Here are some of the questions you could ask yourself when it comes to choosing a layout method. How much maths do you have to do? My own contribution to the thread was this: If it looks like I’d need to reach for calc() a lot for layout then that’s usually a good sign of when I need Grid over flexbox— Michelle Barker (@mbarker_84) January 26, 2019 Often, if you’re having to use calc() a lot to get precise track sizes (factoring in gutters, for example) then it’s worth considering using Grid, as the fr unit will do the heavy lifting for you and save you any number of headaches. While that’s fine as a general principle, it’s not the whole picture. There are cases when you might need Grid, even though your layout doesn’t require calc(). One example might be a fixed-width, two-dimensional layout, where each track is 200px wide - you don’t need calc() to tell you how wide those tracks should be, but you might still want the behaviour of Grid. Likewise, there are cases for using flexbox where you do need calc(), so this can only be interpreted as a guideline. One dimension or two? A big difference between Grid and flexbox is that Grid allows us to control the placement of items in two dimensions (rows and columns), where flexbox does not. Again, that doesn’t mean you should never use grid for one-dimensional layouts. I’ve often opted to use Grid when I need to prescisely control the size and placement for items in one dimension like in this demo and accompanying article: See the Pen <a href='https://codepen.io/michellebarker/pen/XBPMZZ/'>CSS Grid components with variables and media queries</a> by Michelle Barker (<a href='https://codepen.io/michellebarker'>@michellebarker</a>) on <a href='https://codepen.io'>CodePen</a>. How do you want elements to behave? Grid is often the right choice when you need to control the layout in two dimensions. That doesn’t make Grid a better choice for everything though. With Grid you have tracks (rows and columns), cells, and grid areas (a group of more than one cell) and items must be placed in these cells or Grid areas. Let’s say we have a layout like this: We have a grid of nine items of equal width placed from left to right in rows of three, and a 20px gap between each item. We could build this with either Grid or flexbox. The Grid code is much simpler and cleaner: .grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 200px; /* Assuming we want our rows to be a fixed height – could be left as the default `auto` if we want the height to respond to the content */ gap: 20px; } Items are then auto-placed without us having to do anything further. If we want to be really smart about it, we could use Grid’s auto-fit() and minmax() functions to give us a fully responsive layout without the need for media queries – try resizing this example and see what happens. See the Pen <a href='https://codepen.io/michellebarker/pen/bzvGaE/'>Grid auto-fit example</a> by Michelle Barker (<a href='https://codepen.io/michellebarker'>@michellebarker</a>) on <a href='https://codepen.io'>CodePen</a>. I recommend watching Heydon Pickering’s video Algorithmic Layouts for an overview of this technique and more. By contrast, if we were to create this layout with flexbox, we would need to style the actual items as well as the grid container: .grid { display: flex; flex-wrap: wrap; margin: -10px; width: calc(100% + 20px); } .item { width: calc((100% / 3) - 20px); flex: 0 0 auto; margin: 0 10px 20px 10px; } We need negative margins on the grid container to counteract the fact that the total width of the items would be larger than the container itself, and therefore wrap onto the next line. We also don’t get the same responsive behaviour out of the box and would likely need to use media queries. See the Pen <a href='https://codepen.io/michellebarker/pen/VgXwRJ/'>Flexbox layout examples</a> by Michelle Barker (<a href='https://codepen.io/michellebarker'>@michellebarker</a>) on <a href='https://codepen.io'>CodePen</a>. There are a few different ways to achieve this same layout with flexbox, but they all feel a bit hacky – and that’s because they are. We’re using flexbox for something it wasn’t really designed for – but that doesn’t mean it’s always the wrong choice. Many modern CSS frameworks use some variation on this method for layouts. As a side note, if you do need to go down this route, I’m a big fan of Susy, which handles the maths for you. So, which is the better choice here – Grid or flexbox? It would seem that Grid has some clear advantages here, but in order to answer this question we need to think about what should happen when we have more than nine items but fewer than 12 (the next multiple which would allow them to fill a row). Do we want the new items to simply sit at the start of the next row like the examples we’ve already seen? Or do we want them to behave differently? Perhaps if there is only one item on the next row we want it to take up all the available space in the row, like example A below. Or perhaps if there are two items then we want them to be centred, like the example B. Using Grid Layout and auto-placement, we only have the option of the last item being placed in the cell on the left as in the earlier examples – assuming the value of the direction property is not set to rtl (in which case the placement of item will flow right-to-left, and last item will be placed in the cell on the right). The following items will be placed in the next available grid cells. Flexbox allows items to, well, flex. That means we can control the behaviour of those items using a combination of flex and alignment properties. See the Pen <a href='https://codepen.io/michellebarker/pen/MLVYOq/'>Flexbox layout examples</a> by Michelle Barker (<a href='https://codepen.io/michellebarker'>@michellebarker</a>) on <a href='https://codepen.io'>CodePen</a>. So whether you choose Grid or flexbox for the layout above really comes down to how you want your grid items to behave – and there may be different answers for different situations. Are you trying to replace flexbox with Grid? When I give talks I often get asked when I would use flexbox instead of Grid, and whether we even need flexbox anymore. As we’ve seen in the example above, Grid is not a replacement for flexbox. Both of them co-exist quite happily, and knowing when to use each of them gives even more power to your layouts! In the component above, I needed to control the placement of the text, image and heading on the column and row axis, and control how they would interact with each other to an extent. The only way to do this satisfactorily would be to use Grid. But I absolutely would use flexbox to build a desktop navigation menu: See the Pen <a href='https://codepen.io/michellebarker/pen/bzvNmL/'>Flexbox navigation</a> by Michelle Barker (<a href='https://codepen.io/michellebarker'>@michellebarker</a>) on <a href='https://codepen.io'>CodePen</a>. Here I want to control the flow in a single dimension, and I want the items to be flexible – which flexbox does really well. With flexbox we could opt to have those items wrap or not, and allow them to wrap gracefully if the space doesn’t allow for all items to be displayed on one line. How should the layout look in browsers that don’t support Grid? If we’re using Grid, the other issue we need to take into account is browser support, and what we want to happen to our layout in browsers that do not support Grid (IE11 and below). My approach to is to use feature queries to cater for these cases. Often (but not always) I opt for a flexbox-based layout as a fallback for older browsers: .grid { display: flex; flex-wrap: wrap; /* Rest of the fallback layout code */ } @supports (display: grid) { .grid { display: grid; /* Rest of the Grid code */ } } However, if you find yourself spending hours trying to replicate the exact same layout for browsers that don’t support Grid, then there’s probably not a lot of reason to use Grid in the first place. The great thing about Grid is it can do things that flexbox alone can’t do. We’ve discussed some very simple, common layout examples here and how to implement them with Grid or flexbox. To see some more complex layout examples, have a look at the other articles on this blog, or stay tuned for more posts in the future. Webmentions for this page About webmentions Likes: 0 Reposts: 0 Mentions: 8 ← Previous: My CSS Grid Wishlist Next: → Becoming a Tech Speaker"
