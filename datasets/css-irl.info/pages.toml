title = "CSS { In Real Life } | Drawing Raindrops with CSS Gradients and Masks"
description = "← Previous:"
full_description = "Demo National Blog Posting Month css Drawing Raindrops with CSS Gradients and Masks Sat Nov 18 2023 Day 18 of National Blog Posting Month #NaBloPoMo If you live in the UK like I do, you can’t escape the fact that it’s been a wet few months. Since today had been yet another rainy day, I was inspired to see if I could create a rainy background with CSS. After I created this demo, I belatedly discovered that it didn’t work as expected in Chrome. It turns out mask-size and mask-repeat (which the demo relies on) aren’t supported right now. I’ve updated the demos in this article to use the prefixed properties (-webkit-mask-repeat and -webkit-mask-size). Thanks to Temani Afif for pointing out the need for the prefix! I started of thinking I could get away with just using background properties. That enabled me to create the raindrop shape, but creating the highlights (which attempt to allude to reflections and refractions present in water droplets) was trickier. I decided to apply the raindrop shape as a mask, with the mask-image property. That mean the highlight (that I drew with radial-gradient) could bleed off the shape and wouldn’t be present in the background. Using a mask meant I had to use a pseudo-element, as a mask on the <body> element won’t do anything. I’m using viewport units so that the raindrops will scale. See the Pen Rainy day gradient pattern (with viewport units) by Michelle Barker (@michellebarker) on CodePen. I made a few more tweaks, cleaned up the code a little (with custom properties) and added a second pseudo-element, so the raindrops are staggered, which I think looks a lot better. Here’s the result! See the Pen Staggered rainy day gradient pattern by Michelle Barker (@michellebarker) on CodePen. Webmentions for this page About webmentions Likes: 13 Reposts: 2 Mentions: 2 @michelle you can use the -webkit- version for better browser support: https://codepen.io/t_afif/pen/dyadGKVEven Firefox recognize the -webkit- version so you don't have to include the other one (only mask-composite requires both versions) dyadGKV - CSS by T. Afif :verified: ← Previous: Thoughts on UX Engineering Next: → A Fun CSS Text Effect"
