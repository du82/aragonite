full_description = "Quick note css Interop 2023 Thu Feb 02 2023 Last year, Interop 2022, a collaborative cross-browser initiative, was hugely successful in getting 15 key features implemented interoperably. As developers, we can enjoy the fruits of this collaboration, with features like container queries, cascade layers and dynamic viewport units going from little or no browser support to almost full support in the space of a year. Interop 2023 has just been announced, expanding to 26 focus areas. Some exciting CSS features include the :has() pseudo-class, which is already supported in some browsers, as well as Level 4 media queries, math functions, and font palette features, which enable custom coloured fonts. Read the Interop teams’ write-ups here: WebKit Google Igalia Microsoft Mozilla Bocoup Webmentions for this page About webmentions Likes: 0 Reposts: 0 Mentions: 1 ← Previous: Scheduling Netlify Deployments with Github Actions Next: → Testing Colour Accessibility with Dev Tools"
