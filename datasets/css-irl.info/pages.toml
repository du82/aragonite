["https://css-irl.info/choosing-a-green-web-host"]
title = "CSS { In Real Life } | Choosing a Green Web Host"
description = "← Previous:"
full_description = "National Blog Posting Month web sustainability Choosing a Green Web Host Wed Nov 22 2023 Day 22 of National Blog Posting Month #NaBloPoMo Earlier this month, Jeremy Keith posed the question: “How green is my server?”. As Jeremy notes, it’s surprisingly hard to get that information! So how do you ensure that you’re hosting your website on a green server? What do we mean by “green”? When we think of green web hosting, most of us might reasonably assume that a hosting company that claims to be green would source a high proportion of their electricity from renewable sources. But is that necessarily the case? Green energy Unless the data centre is directly hooked up to a solar farm or wind turbine (unlikely), then then probably don’t get all of their electricity from renewables. Most large web hosts have data centres all over the world, and these are usually connected to the country’s national power grid. The proportion of electricity generation can vary country to country, and fluctuate depending on the weather and the time of day. Therefore, one of the things to look for is whether the company in question has a contract with a green electricity supplier, as Amazon claims to: We contract for renewable power from utility scale wind and solar projects that add clean energy to the grid. Hosting companies generally don’t publish their electricity suppliers’ details on their websites, however, so investigating their claims is far from straightforward. We should also be aware that some companies claiming to be entirely green or “100% renewable” might only be buying carbon credits or offsets rather than sourcing clean energy. These are likely to be far less effective, and in some cases could be actively harmful. When choosing a green web host it’s important to check whether they actually invest in renewable energy. Beyond renewable energy Beyond green energy alone, data centres consume vast quantities of water in order to keep them cool. As noted in the Washington Post: Data centers rank among the top 10 water-consuming commercial industries in the United States. This is a big concern, particularly in areas of drought. There is also the embodied carbon (CO2 emitted in producing materials) to consider when it comes to data centres and other web hosting infrastructure. I’m not aware of many hosting companies that publish detailed sustainability information on anything beyond electricity use (if they even publish that). Renewable energy vs. energy efficiency There’s much more we could examine when it comes to the energy efficiency of our site’s infrastructure. Using a CDN (Content Delivery Network) could be a greener choice, as web pages can be served close to the the user, reducing data transfer. But with a more distributed network there could be a trade-off, as there may be less control over the carbon-intensity of the electricity. Digital agency UsTwo published an interesting case study on how they reduced their website’s carbon footprint by effectively building their own distributed hosting network — but of course, that’s beyond the means of many people! Utilising serverless architecture could be a positive step too, but it as with so much else on the web, it depends. How green is my website? Running CSS { In Real Life } through Website Carbon tells me that this website runs on clean energy. How can we be sure of that? Website Carbon has a section that explains how the energy source is determined, but notes that the data source does not distinguish between data centres that purchase green electricity and those that buy standard electricity but offset their emissions. My website is hosted with Netlify, which I can learn from their sustainability page uses AWS infrastructure. Amazon helpfully provides a webpage detailing their sustainability initiatives. But we should remember that this is self-reported, and companies are inclined to put a positive spin on their environmental efforts for marketing purposes. Although the energy infrastructure that powers my website appears to be relatively green, Amazon is hardly what I would consider a “green” company, with a business that relies on unsustainable consumption, as well as ever-increasing demand for computing power and data infrastructure. Even with reliable data, calculating carbon emissions from infrastructure is tricky, and it’s impossible to account for all variables. The creators behind Website Carbon have a page explaining how digital emissions are calculated for their estimates, but it can only ever be a rough estimate. Finding a green web Host If you’re shopping for a green (or at least greener) web host, a good first port of call is the Green Web Foundation’s Green Hosting Directory. Although there’s not a huge amount of information on each company (and individual companies’ websites can be frustratingly opaque), in order to be published in the directory companies need to provide proof of their green claims, so it’s a good baseline. The team are currently working on a new and improved version of the directly that includes supporting evidence for providers. Learn more about greening the web On Thursday 7th December I’ll be speaking alongside Gerry McGovern at Smashing Meets Goes Green — a special, sustainability focused edition of the meetup! Join us online Webmentions for this page About webmentions Likes: 11 Reposts: 12 Mentions: 1 @michelle thanks for writing this. Very informative - Andy Millington @michelle my thought is that unless a data centre directly builds or commissions green energy then you should just assume grid average, since buying green energy just displaces some other user since green energy supply , in the short term, is limited so that other user will have to use the marginal energy source.In practice data centre are even able to negotiate below average prices from the generators and push up the price fir the rest of us. - MarjorieR ← Previous: Scroll Timeline Parallax Effect Next: → What to Blog About When You Don’t Know What to Blog About"
