title = "CSS { In Real Life } | Logical Properties in Size Queries"
description = "← Previous:"
full_description = "css layout Logical Properties in Size Queries Wed Sep 11 2024 I came across a post from Elad Shechter lamenting not being able to use logical properties in media queries. As he correctly notes, the following won’t work: @media (max-inline-size: 1000px) { .main-content { max-inline-size: 800px; margin: 0 auto; } } Media queries now support a new range syntax. Instead of writing min-width or max-width, we can use the “greater than” or “less than” operators (> and <), or “greater than or equal to”/“less than or equal to” (>= and <=). So we could write the above example a different way: /* Styles are applied when the inline-size is less than or equal to 1000px */ @media (width <= 1000px) { .main-content { max-inline-size: 800px; margin: 0 auto; } } This feels more consistent with other programming languages, and lends itself well to more concise code when dealing with multiple size conditions: @media (min-width: 500px) and (max-width: 1000px) {...} /* becomes: */ @media (500px <= width <= 1000px) {...} It gives us a choice in terms of how to write it too. These two media conditions both mean that the styles should be applied when the width is greater than 500px. We can write it either way: @media (500px < width) {...} @media (width > 500px) {...} To me, this syntax feels better suited to logical properties, and you can use logical properties in container queries. These both work: @container (min-inline-size: 500px) {...} /* becomes: */ @container (inline-size >= 500px) {...} So why not in media queries? It seems like an oversight, but I’m also inclined to think that in the not too distant future we might not need media queries for querying size. We could just make the :root a container and query that instead: :root { container-type: inline-size; } @container (500px < inline-size < 1000px) { body { background: blue; } } Except... We can’t query the block-size (equivalent to the height in horizontal writing modes) with container queries. The following won’t work: :root { container-type: block-size; } @container (block-size > 500px) { body { background: blue; } } Speaking personally, it’s very rare that I need to query the viewport height. CSS has viewport units of course, which are great for sizing things relative to, well, the viewport. But it’s not totally unheard of. So we may need size-based media queries for some time yet, and being able to use logical properties with them would certainly be useful! Webmentions for this page About webmentions Likes: 0 Reposts: 0 Mentions: 1 More like this Logical Border Radius Logical Properties for Useful Shorthands ← Previous: The Problem With Surveys (and Why You Should Take This One) Next: → Limitation Breeds Creativity: A Study in Composition with Custom Properties"
