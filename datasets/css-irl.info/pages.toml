title = "CSS { In Real Life } | Scroll Timeline Parallax Effect"
description = "← Previous:"
full_description = "Demo National Blog Posting Month css animation Scroll Timeline Parallax Effect Tue Nov 21 2023 Day 21 of National Blog Posting Month #NaBloPoMo I’ve been playing around with scroll-driven animations a bit lately. Scroll timelines allow us to link the progress of element’s animation to the progress of a scroll container, as I wrote about not long ago for MDN. It’s remarkably easy to link an animation to the root scroller (which in most cases, is probably where it’s going to be most useful). This demo uses the animation-timeline property to create a parallax effect. We’re creating an anonymous scroll timeline linked to a keyframe animation. The animation translates an element on the y axis, using a custom property value. We’re using three elements positioned on top of each other as the background, foreground and middle ground layers. For each one all we have to do is adjust the custom property to change the amount that each layer moves, thereby changing whether they appear nearer or further away relative to the user. Pretty cool! This demo will only work in Chromium for the moment. See the Pen Multi-layer parallax effect scroll timeline by Michelle Barker (@michellebarker) on CodePen. Webmentions for this page About webmentions Likes: 0 Reposts: 0 Mentions: 2 ← Previous: Reality Check: A Series for Building Real Layouts Next: → Choosing a Green Web Host"
