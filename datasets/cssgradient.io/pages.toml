title = "Get Unique Design Inspiration — CSS Gradient"
description = "Inpsiration, tips, and tutorials for working with css gradients in your design projects."
full_description = "Before we get started, we’re not calling for you to stop browsing your Instagram feed. We use it daily. Pinterest certainly has its place. Dribbble and Behance offer genuinely inspiring designs from every corner of the globe. In fact, curated feeds are so clever that they’re already presenting a lot of designs you know you’ll like.That said, exploring new resources will always offer fresh perspectives on design. And who knows… they might just be the catalyst you need to kickstart your next creative project. Here’s some of the resources we visit when we want to escape the feed.‍Our Favourite Four‍1.IDN Worldhttps://www.idnworld.comIDN World is a famous magazine, established 30 years ago in Hong Kong. Back then, finding an IDN on a desk was a real treat. Every volume of IDN is packed full of design inspiration from Asia, with unknown and emerging artists. Even now, there’s still nothing quite like finding inspiration within the pages of a print publication. But if you can’t get hold of a printed copy quickly enough, you can always head online.‍2. Psyophttps://www.psyop.comPsyop is a fantastic motion design studio in NYC. Their mission is simple but inspirational in itself, which is “to capture hearts and minds through iconic visual storytelling and design.”Psyop’s portfolio is filled with incredible illustrations and motion designs, with work spanning multiple styles. Having produced work for the likes of Nike, Instagram, Marvel and much more, they’re at the forefront of design. It’s is a real go-to when you need that creative spark.‍3. Ben Biondohttp://www.benbiondo.comBen's website is a great source of vintage modern design. A short dive into his work immerses you in a vibe that will stick with you for days. Ben’s a multi-disciplinary artist, meaning you'll see his work across a whole range of visual mediums. You will probably end up booking a ticket to LA as well, but that’s a whole new story.‍4. Print pmhttps://print.pm/If you want to get deep into fresh print designs, then this one’s your gig. Print pm has a neat, simple scroll experience that fills you up, with interesting grids and vintage photo art direction with a twist. It's a great way to spend a bus ride. Just don’t miss your stop due to endless scrolling.‍Keeping it LocalThe next two up on our list are artists from Montreal. It’s where designstripe was founded, and the city is very much a part of our DNA. So it’s only right that we champion some of the talented emerging artists right out of our backyard.‍5. Cecile Gariepyhttps://www.cecile-gariepy.com/Cecile is a renowned artist who can name The New York Times as one of her clients. She’s one of the few artists that has successfully made the Corporate Memphis style popular again. She’s also know to paint majestic murals, too. If you ever come to Montreal, be sure to stay on the lookout for her work!‍6. Olivier Rielland Nadeau | Crispy Kerninghttps://www.instagram.com/crispy_kerning/Crispy Kerning uses caligraphy/hand lettering to create amazing pieces influenced by street art. Part of an art collective called Garbage Beauty, Olivier was featured in Kinkfolk magazine. His art is also another one to keep an eye on whilst you’re in Montreal. You can find his work etched into the snow, on an old couch, or even sitting pretty on a heap of trash.‍But Wait… There’s More‍7. 36 Days of Typehttps://www.36daysoftype.comThe title does the heavy lifting here. See 36 days of pure, user-generated inspiration with a simple subject: the alphabet. The designs are wide-ranging, thanks to everything being created by people across the world. Plus, there’s animated typography for the motion fans among you. You can even get involved and submit your own work. It’s a surefire way to kickstart your creative flow.‍8. Geoff McFetridge | Champion Don’t Stophttps://championdontstop.comThis is a personal favorite of ours. Geoff McFetridge is a true master of the simple-but-smart illustration style. He’s made some serious waves with his art, working with the likes of Oreo, Nike, MTV and Pepsi. Sometimes, we all need to be reminded that creativity is your brain when it’s having fun. When you need that visual pep-talk, Geoff is your guy.‍9. Design Made in Germanyhttps://www.designmadeingermany.de‍The Germans are serious about art, meaning that you’ll find plenty of German firms in the creative industries. This blog has lots of project photography works that serve as great visual inspirations. You don’t need to speak Deutsch to catch the vibe. One look at the captivating photos and you’ll understand why you’ve been looking for inspiration over there in the first place.‍10. Consumer Packaged Goods Directoryhttps://www.cpgd.xyz/You don’t need to be creating packaging to get value here. CPGD gives you a peek at the fastest-growing consumer brands, and it’s a treat for the eyes. It features five new brands every week, giving you plenty of great ideas that are on-trend. We apologise in advance if some of the food brands get your appetite going.‍11. Mindsparklehttps://mindsparklemag.com‍A successful designer always has a few go-to resources to keep up with the ever-changing trends in the design industry. Mindsparkle can be that ace up any designer’s sleeve.It highlights current web design trends, but also extends to art, architecture, video, and photography. With a stunning design of its own, browsing for inspiration is all part of the experience.‍12. LandingfolioLandingfolio.comWhen users hit your website for the first time, what they see is often the difference between them sticking around, coming back later, or never returning. Along with great copy, design’s a big part of getting people to dive a bit deeper. Landingfolio curates some seriously impressive landing pages from all types of industry, and their list keeps growing.‍13. Creative Boomhttps://www.creativeboom.com‍Creative Boom showcases the work of leading designers from all over the globe. But that’s only part of it. Community runs through Creative Boom’s DNA, and they support creatives in all aspects of their work, from tips through to employment and freelancing.The cherry on the cake? It also has a podcast channel and an online shop, where you can purchase bespoke prints direct from the artists.‍14. Abduzeedo (ABDZ)https://abduzeedo.com‍Many artists collaborate with their fellow contemporaries in creative spaces that are intended to inspire others. Abduzeedo has been doing just that, since 2006.It’s been quite the journey. It started as a personal blog and became a home for global contributors to inspire the creative community. ABDZ has a ton of articles that are related to the photography, UX, and design industries, with a special focus on 3D design.‍15. Incredible Typeshttp://incredibletypes.com‍OK, so there’s millions of resources you can use to find your next font. Why is Incredible Types any different? It makes the job of finding the best fonts for your next design easier. It showcases an outstanding collection of typography and design from 432 creatives across 51 countries.‍Which of these resources work for you?We’ve only really scratched the surface. The internet is a real treasure of curated design goodness, and these are just some of those you might not have digged into before.We’re always on the lookout for further design inspiration ourselves, and we never want to stay still. So we want to hear from you - which other resources have become a go-to for you? Let us know!‍‍‍"
