["http://csstidy.sourceforge.net/templates.php"]
title = "CSSTidy"
full_description = 'Templates A template is a file that consists of multiple single strings, which are seperated by the character "|" without quotes. They may contain any other characters like newlines, tabs and html-tags for the visual formatting (only <span> is allowed). Currently 14 strings are needed. The best way to understand where the strings are used, is to have a look either at the predefined templates or at the source-code which generates the HTML output. You can also have a look at the example below the description. The following is a short description of all 14 strings: string before @rule string+bracket after @-rule string before selector string+bracket after selector string before property string after property+before value string after value closing bracket - selector space between blocks {...} closing bracket @-rule indentation in @-rules before comments after comments after last one-line @-rule Position of templates ([1] = first string, [2] = second string,...): [1]@charset [6]"utf-8"[7]; [1]@import [6]"my.css"[7]; [14] [1]@media screen[2] { [11][3]b[4] { [11][5]color:[6]blue[7]; [11][8]}[9] [11] [11][3]a[4] { [11][5]color:[6]red[7]; [11][8]}[10] } [3]a[4] { [5]color:[6]red[7]; [8]}[9] [3]b[4] { [5]color:[6]blue[7]; [8]}[9] Predefined templates Highest compression High compression Default layout No compression, higher readability'
