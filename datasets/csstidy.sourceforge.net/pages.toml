["http://csstidy.sourceforge.net/////csstidy/csstidy.html"]
title = "Docs For Class csstidy"
description = "CSS Parser class"
full_description = 'This class represents a CSS parser which reads CSS code and saves it in an array. In opposite to most other CSS parsers, it does not use regular expressions and thus has full CSS2 support and a higher reliability. Additional to that it applies some optimisations and fixes to the CSS code. An online version should be available here: http://cdburnerxp.se/cssparse/css_optimiser.php Example for a subvalue: background:url(foo.png) red no-repeat; "url(foo.png)", "red", and "no-repeat" are subvalues, seperated by whitespace'
year_published = 2025
clearnet = "http://csstidy.sourceforge.net/////csstidy/csstidy.html"
tags = ["$array", "$content", "$css", "$istring", "$line", "$loc", "$media", "$message", "$plain", "$pos"]
