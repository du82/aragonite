full_description = 'Hacks that work The following is a list of all CSS hacks that will not be modified by default by CSSTidy. If you enable "preserve CSS", more hacks will be saved. In general you should do without CSS hacks anyway, but if you need them and want to use CSSTidy you should use one of the following hacks: p\roperty:value; (only if you disable the removal of unnecessary backslashes) div#test head:first-child+body div body>div html[xmlns] div @import "null?\"\{"; @import "styles.css"; (and all other @import rules) @media all{/* rules */} * html div i{content:"\"/*"} div{property:value} html*#test _property:value'
