["https://csswizardry.com/2020/05/the-fastest-google-fonts"]
title = "Speed Up Google Fonts – Web Performance and Site Speed Consultant"
description = "Google Fonts is fast. Now it’s faster. Much faster."
full_description = "Get in touch Need Some Help? I help companies find and fix site-speed issues. Performance audits, training, consultancy, and more. By Harry Roberts Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. Ten-Second Version: If you really can’t be bothered going to all of the effort outlined in this post, there is a super rough-and-ready, ten-second, alternative approach—place your Google Fonts stylesheet at the closing </body> tag. This means we don’t block rendering of the entire page just for the sake of web fonts. Instead, we apply them after we’ve styled everything else. For the most part, web fonts nowadays are faster than ever. With more standardised FOUT/FOIT behaviour from browser vendors, to the newer font-display specification, performance—and therefore the user—seems to have been finally been put front-and-centre. It’s widely accepted that self-hosted fonts are the fastest option: same origin means reduced network negotiation, predictable URLs mean we can preload, self-hosted means we can set our own cache-control directives, and full ownership mitigates the risks that come with leaving static assets on third-party origins. That said, the convenience of a service like Google Fonts cannot be overstated. Their ability to serve the tiniest possible font files tailored to specific user agents and platforms is amazing, and with such a huge, freely-available library served from Google-grade CDNs… I definitely see why people continue to turn to it. On this site, in which performance is the only name of the game, I forgo web fonts entirely, opting instead to make use of the visitor’s system font. This is fast, incredibly well suited to the device in question, and has almost zero engineering overhead. But, on harry.is, I really wanted to throw caution to the wind. To hell with it! Let’s have a web font! While prototyping, I turned to Google Fonts, and with their recent ability to support font-display via a URL parameter (&display=swap), I knew that things would stay pretty speedy. Then I had an idea."
