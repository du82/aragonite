["https://csswizardry.com/2010/12/the-implementation-appreciation-rule"]
title = "The implementation ∝ appreciation rule – Web Performance and Site Speed Consultant"
full_description = "By Harry Roberts Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. I’ve mentioned this idea to a few designers and developers of late who all seem to agree that it has a point and makes sense, so I thought I’d write up my thoughts on what I call the implementation ∝ appreciation rule. That is to say, anything you spend time building (on top of, as well as and beyond the scope of the base build) should reap an amount of appreciation from the users that is proportional to the time it took to implement. I have a very aggressive and die-hard approach to progressive enhancement which I guess is to thank, in part, for the rule itself. Let’s start with a very basic and tongue-in-cheek example. Let’s imagine your client comes to you and says ‘Hi, yeah, I love the site but can we make all the links, headings and image borders the same colour as my chihuahua’s eyes?’ … ‘Well sure, you can, but it’ll take an hour at £xxx and I don’t think that it’s going to bring enough user attention, or even be noticed enough–if at all–to warrant the time it’ll take me to do and the money it’ll cost you to have it done.’ In other words, the implementation is not proportional to the appreciation. Now this is a very stereotypical and clichéd client-from-hell example, but it does paint a picture of how the rule works; will the time it takes you to change something, or add a feature, reap enough benefits to make it worthwhile? You can’t really feed this equation any numbers, of course, but that’s where it’s up to you to decide what is the cut off point. If you think that the amount of time it will take you to add a feature is worthwhile and will have a proportional appreciation then that’s your choice, and whilst it may not be the same outcome as the agency down the road, it’s you who is building that website. A more realistic example was during a build I was on with at work. I saw something in a PSD that I thought was missable enough not to fulfil the implementation ∝ appreciation rule; the time it would have taken me to code a robust, <IE7 solution would have been far greater than the amount of time any user would have spent thinking ‘Wow, I’m glad he did that!’"
