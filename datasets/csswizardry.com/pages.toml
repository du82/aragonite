["https://csswizardry.com/2010/10/unsung-heroes"]
title = "Unsung heroes – Web Performance and Site Speed Consultant"
full_description = "By Harry Roberts Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. The internet is awash with web-celebrities; designers and developers (‘rockstars?’) who have, for whatever reason, amassed countless followers and people hanging on their every word. This is great, and can get the message from some of the industry’s best to the masses via one blog post and a few tweets. Or is it? Just because someone has over ten thousand followers does not necessarily mean that they know the best techniques, or what the most efficient, accessible and trustworthy solution is. I don’t follow many web-celebrities, I don’t find that they’re always the best source of quality content, nor are they necessarily the first to invent or do something–people just get the impression they were because no one else saw the humble guy who lives down the road tweeting about it two months ago. So I’ve decided to do an unsung heroes post. Leave one comment with one designer/developer who you feel is underrated, at the top of their game, an inspiration, and someone who deserves more recognition than they get. I’ll kick things off with my suggestion: Jens Meiert. Now he’s not a total unknown, but certainly deserving of a far wider audience. So there we have it, my ‘unsung hero’. Who’s yours? Copy/paste the following template to add your unsung hero to the discussion. Who has been an inspiration to you? Who do you wish more people listened to? Let’s get the discussion under way and see who really keeps this industry on the up. Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. Hi there, I’m Harry Roberts. I am an award-winning Consultant Web Performance Engineer, designer, developer, writer, and speaker from the UK. I write, Tweet, speak, and share code about measuring and improving site-speed. You should hire me."
