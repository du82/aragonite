["https://csswizardry.com/2016/06/speakers-checklist-before-and-after-your-talk"]
title = "Speaker’s Checklist: Before and After Your Talk – Web Performance and Site Speed Consultant"
description = "Giving talks is stressful. Follow these tips to make the logistics of it a little simpler."
full_description = "By Harry Roberts Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. I’ve been speaking at conferences for just over four years now, and have spoken at 14 in the past five months alone. It helps me (and indeed anyone) to have a pretty regimented checklist of things to do before and after your talk in order to help things run as smoothly as possible. This post isn’t intended to help you research, write, prepare, or deliver a talk well—that’s an entire series of blog posts in itself—but it should help you to run things a little more consistently and predictably. There’s nothing worse than being stressed out before a talk. These lists are by no means exhaustive, but they’re a pretty easy-to-follow set of tasks that you should try to follow any time you give a talk. It’ll make your life easier. Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. Hi there, I’m Harry Roberts. I am an award-winning Consultant Web Performance Engineer, designer, developer, writer, and speaker from the UK. I write, Tweet, speak, and share code about measuring and improving site-speed. You should hire me. I help teams achieve class-leading web performance, providing consultancy, guidance, and hands-on expertise. I specialise in tackling complex, large-scale projects where speed, scalability, and reliability are critical to success. CSS Wizardry Ltd is a company registered in England and Wales. Company No. 08698093, VAT No. 170659396. License Information."
