["https://csswizardry.com/2023/06/site-speed-topography-remapped"]
title = "Site-Speed Topography Remapped – Web Performance and Site Speed Consultant"
description = "Revisiting and remapping my Site-Speed Topography technique for assessing web performance at large"
full_description = "By Harry Roberts Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. N.B. This is an update to my 2020 article Site-Speed Topography. You will need to catch up with that piece before this one makes sense. Around two and a half years ago, I debuted my Site-Speed Topography technique for getting broad view of an entire site’s performance from just a handful of key URLs and some readily available metrics. In that time, I have continued to make extensive use of the methodology (alongside additional processes and workflows), and even other performance monitoring tools have incorporated it into their own products. Also in that time, I have adapted and updated the tools and technique itself… The idea is that by taking a handful of representative page- or template-types from an entire website, we can quickly build the overall landscape—or topography—of the site by comparing and contrasting numerical and milestone timings. Realistically, you need to read the original post before this article will make sense, but the basic premise is that by taking key metrics from multiple different page types, and analysing the similarities, differences, or variations among them, you can also very quickly realise some very valuable insights about other metrics and optimisations you haven’t even captured. Similar TTFB across pages suggests that no pages have much more expensive database calls than others; large deltas between TTFB and First Contentful Paint highlight a high proportion of render-blocking resources; gaps between Largest Contentful Paint and SpeedIndex suggest late-loaded content. These insights gained across several representative page types allow us to build a picture of how the entire site might be built, but from observing only a small slice of it. The backbone of the methodology is—or at least was—viewing the data graphically and spotting patterns in the bar chart: Above, we can see that the Product Listing Page (PLP) is by far the worst performing of the sample, and would need particular attention. We can also see that First Paint and First Contentful Paint are near identical on all pages except the PLP—is this a webfont issue? In fact, we can see a lot of issues if we look hard enough. But… who wants to look hard? Shouldn’t these things be easier to spot?"
author = "Harry Roberts"
year_published = 2023
year_updated = 2023
