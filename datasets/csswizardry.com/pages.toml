full_description = "I work together with organisations of all sizes to analyse, find, and fix site-speed issues. How much does a one-second slowdown affect conversion rates? Are third party scripts impacting engagement? How does site-speed influence revenues? Consultancy engagements are tailored to each client and project, but they all combine some or all of the following: I pride myself on my ability to work with organisations and not merely for them. So much so that I wrote a book about it. For lighter-touch guidance and advice, we can schedule 90-minute consultations to answer your most pressing questions: want to work out what a slow website is costing your business? Need to know where you should focus your efforts first? Looking for help troubleshooting specific performance issues? Let’s get your answers. If we go on to work together more fully after our initial consultation, it gets discounted from your first consultancy invoice. Win-win, no risk! A consultation is not just a call—when you schedule a consultation, I’ll ask you to provide me with any relevant research, homework, and tasks so that I can fully prepare for our meeting. Want me to look over some waterfall charts? You got it! Need me to debug some stuff? Send me a URL. Need a second opinion on your Vitals? I’m on it! You’d be surprised. From $1,000 to $100,000, there’s always something we’ll be able to do to help solve your problem. My approach is to design the engagement around you, so your best option is to get in touch and let me work something out. Absolutely! While my client list tends to highlight more familiar household names, I love partnering with anyone who’s keen to do good work. In fact, some of my most fond memories are joining smaller teams and working closely together to solve problems. Whether it’s consultancy, audits, or training, the size of your company does not matter. There’s something for everyone. Probably not as long as you think! Over the past six years, I have managed to optimise my workflow to such an extent that we can move incredibly quickly. Vitamix had this to say about it:"
