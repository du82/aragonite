["https://csswizardry.com/2010/12/css-camel-case-seriously-sucks"]
title = "CSS: CamelCase Seriously Sucks! – Web Performance and Site Speed Consultant"
full_description = "By Harry Roberts Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. Now, I know this is going to instantly ruffle some feathers, but I’m not normally one to tell you how to write your code. Sure, I dislike single-line CSS, but as long as your code is clean, sensible, understandable and consistent then there’s not too much to complain about. The most important of these–in my eyes–is consistency. There is however one method that, straight off the bat, is instantly and inherently inconsistent… camel case. CSS is a hyphen-delimited syntax. By this I mean we write things like font-size, line-height, border-bottom etc. So why then would you introduce another format? Furthermore is the inconsistency of placing a mix of upper- and lower-case classes/IDs in a lower-case syntax. Example: Camel case also adds the scope for inconsistency within your own defined rules. This might be very anal, but take the following: There we have two elements used as generic content containers, but one is referred to as content, and the other as Content. Huh?! Camel case is harder to read. Whitespace between words makes them far more legible. We can’t have spaces in CSS, so we use hyphens instead. Compare the following: Also there’s the issue of scannability, an important factor when writing code. Let’s look at the following code: I personally find the second far easier to scan if I’m looking for a particular nav- prefixed class. This is an odd one, but one that definitely, definitely irks me. I can’t Ctrl+Shift+[Arrow key] single words in a camel case string. Take the following screenshot: Here I use the Ctrl+Shift+Left arrow keys to select chunks of text–rather than one character–at at time. The problem here is that the camel case string is treated as one word. What if I just wanted to select tweet and change it to facebook? I can’t do that with Ctrl+Shift+[Arrow key] This is far nicer as we can select individual parts of a string with ease. Changing tweet to facebook here could not be simpler."
