["https://csswizardry.com/2011/01/html-elements-tags-and-attributes"]
title = "HTML elements, tags and attributes – Web Performance and Site Speed Consultant"
full_description = "By Harry Roberts Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. This article is only a small one, and to the vast majority it won’t be of much use, but I’m still astounded that today, in 2011, professional web designers and developers are still making this fundamental mistake. The difference between HTML elements, tags and attributes. Tags are the bits that make up elements. <div> is a tag. An opening and closing tag makes an element: When people say ‘mark important text up in a strong tag’ they mean mark important text up in a strong element (made up of two strong tags). This is probably really very basic for the majority of you, so apologies, but it really winds me up when I see developers making this mistake. Still. Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. Hi there, I’m Harry Roberts. I am an award-winning Consultant Web Performance Engineer, designer, developer, writer, and speaker from the UK. I write, Tweet, speak, and share code about measuring and improving site-speed. You should hire me. I help teams achieve class-leading web performance, providing consultancy, guidance, and hands-on expertise. I specialise in tackling complex, large-scale projects where speed, scalability, and reliability are critical to success. CSS Wizardry Ltd is a company registered in England and Wales. Company No. 08698093, VAT No. 170659396. License Information."
