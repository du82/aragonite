["https://csswizardry.com/2024/08/blocking-render-why-whould-you-do-that"]
title = "blocking=render: Why would you do that?! – Web Performance and Site Speed Consultant"
description = "Why on earth would you make something render-blocking?!"
full_description = "By Harry Roberts Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. WebKit have recently announced their intent to implement the blocking=render attribute for <script> and <style> elements, bringing them in line with support already available in Blink and generally positive sentiment in Firefox. The blocking=render attribute allows developers to explicitly mark a resource as render blocking, but… why on earth would you want to do that?! The short answer is: generally, you wouldn’t. Unless you know you need this behaviour, you don’t need it. A blocking attribute explicitly indicates that certain operations should be blocked on the fetching of an external resource. The operations that can be blocked are represented by possible blocking tokens, which are strings listed by the following table […] — 2.5.8 Blocking attributes Currently, there is only one token specified: render. The spec is extensible so that other values could be added as the need arises—potential scenarios that have been discussed include parse, load, and even a negation to encourage the opposite, such as blocking=!render. The two main file types that impact the blocked status of a web page are stylesheets and scripts. In their default states: The pedant in me wants to point out that even inline <script> and <style> are still technically parser blocking. Colloquially, we refer to them as non-blocking, but even for the handful of milliseconds that the browser is parsing either the JS or CSS contained in them, it’s blocked from doing anything else. Without going into too much detail, the presence of any of these attributes on a <script> will cause it to fall into the first camp: non-blocking. Therefore, <script>s can occupy either extreme: non-blocking, the fastest option; or parser blocking, the slowest option. The primary use-case for blocking=render is to grant <script>s access to the middle option: render- but not parser-blocking."
author = "Harry Roberts"
year_published = 2024
year_updated = 2024
