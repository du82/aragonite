["https://csswizardry.com/masterclasses"]
title = "Masterclasses: Empower Your Talent – Web Performance and Site Speed Consultant"
description = "Short, targeted masterclasses covering a range of performance topics"
full_description = "Dive into highly focused, highly specialised, highly advanced web performance tutorials, on demand. Bite-sized, live, remote workshops to take your team from zero to expert on the topic of your choice. Thank you so much for the excellent session, Harry—it was a lot of fun. The team was jazzed by what they learned and were amazed by how prepared you came and all of the ideas you helped spark for ways forward. We appreciated your thoroughness, insights, expertise, and the thoughtfulness you brought towards your prepared materials. Your team is great, and they know most of it all already. They don’t need a week-long bootcamp—they need to fill a few empty gaps. They need a Masterclass. Pick a topic that you want to level up on, and get it done. Struggling with performance budgets? Not anymore. DevTools confusing you? You’re not alone. Need to streamline your workflows? We’ll be there in no time. Getting started with WebPageTest can be pretty daunting, but this Masterclass will get you comfortable and confident with the basics: WebPageTest is pretty powerful as-it-is and out-of-the-box, but it can do so much more! Let’s learn: DevTools are amazing! But that can make them intimidating. Let’s get you all set up with the most finely-tuned Chrome DevTools possible. Performance testing becomes a lot more reliable if you have a forensic environment. It gets a lot more replicable if your entire team shares the same setup. This Masterclass will show you the ultimate configuration to make your DevTools as accurate and trustable as possible, as well as the secret tips, tricks, and workflows needed to take performance testing to the next level. With an overwhelming focus on Core Web Vitals (which are Chrome-only, for now), it’s all too easy to overlook our iOS users! Let’s fix that. As WebKit is a fundamentally different rendering engine, it requires a whole different approach when it comes to auditing web performance on iOS. Let’s look at the tools and workflows needed to keep your iPhone users smiling."
