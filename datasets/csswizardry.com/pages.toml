["https://csswizardry.com/case-studies/nhs-nhsx-elearning-platform"]
title = "NHS: NHSx eLearning Platform – Web Performance and Site Speed Consultant"
description = "Working in intense sprints to help build an eLearning platform for the NHS"
full_description = "Get in touch Need Some Help? I help companies find and fix site-speed issues. Performance audits, training, consultancy, and more. Next: An intense week of workshop and hack days in Copenahgen. Read next case study View all case studies… I must admit, when I saw an email from the NHS asking me if I’d like to help them on a project, my first thought was one of much uncertainty. Usually, in British media, most reports about IT in the public sector are horror stories, with multi-million pound contracts awarded to huge ‘Enterprise’ contractors who do a terrible job, take their cheque, and leave somebody else to clean up the mess. Another one of my reservations was about technology and approach. The NHS, being public sector, has to serve a lot of people, which means a lot of older browsers, etc. I was worried we’d have to support IE6, and not get to use any new or emerging tech; I imagined that responsive wouldn’t be a requirement, and that the site would have to look exactly the same in every browser. This project couldn’t have been more different: responsive, mobile first, built on Rails, HTML5, and Sass, and all run very agile (using GitHub and Trello) by a lean team of just four people. I got an email from Jason, the NHS Leadership Academy’s Programme Lead, asking if I’d be interested in working my design rationalisation magic on an ambitious new project of theirs, as well as joining to build the front-end of the entire product: an eLearning platform which aimed to bring all the NHS’ many fragmented learning resources under one roof, accessible to all members of NHS staff. I help companies find and fix site-speed issues. Performance audits, training, consultancy, and more. It was clear from Jason’s opening email that this project was not going to be fraught with the same kind of problems you read about in the press. Jason was clued up and open to healthy dialogue: rereading our initial emails reminds me how, right from the beginning, we were clearly walking a two-way street here—Jason had clear vision for the product, but wasn’t afraid to hand a lot of responsibility over to others."
