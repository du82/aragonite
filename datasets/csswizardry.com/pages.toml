["https://csswizardry.com/2011/01/forget-responsive-web-design"]
title = "Forget responsive web design… – Web Performance and Site Speed Consultant"
full_description = "By Harry Roberts Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. I now completely disagree with nigh-on all of the below. I’ve decided to leave this post for posterity, but I no longer stand by it. The web has been abuzz recently over the advent of responsive web design. Pioneered mostly by Ethan Marcotte, the concept is fantastic. It truly is great and has changed how a lot of projects and builds take shape. Things don’t get much more efficient than a write-once view-many approach, and with the sharp rise in mobile and tablet devices it is proving very popular. It is however, like most things, not without its downsides. This article by Jason Grigsby outlines some pretty valid points and this one by Kevin Suttle offers a very interesting insight into some problems with the build-once mentality. My problem lies a little more closely to home, though. The theory and concept of responsive web design is great but I think there are two problems with its fundamentals: I much prefer the name adaptive web design. A website should not respond to changing surroundings, it should adapt to them once they’ve changed. This difference is pretty subtle but very important. Responsive web design changes as the viewport does, adaptive changes once the viewport has. The problem with calling it responsive web design is that by its very nature it implies that it offers feedback (or a response) to a user’s actions. Responsive web design tends to use fluid layouts to cater for any possible resolution. Adaptive caters for a predefined but sensible array. If we consider possible resolutions we could come up with: The benefit of knowing these presets (and any more that you might choose) is that you don’t need to rely on fluidity (which is generally harder to build); you can also make better use of grids like the 960GS (which offers 700px that will cater for both iPad and 800x600); you don’t need to worry about unsightly, overly-long measures (line-length) on larger resolutions in fluid designs; and finally, you generally just have better control over what you’re displaying when you have metered constraints."
