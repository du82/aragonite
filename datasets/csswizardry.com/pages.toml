["https://csswizardry.com/2019/04/tips-for-technical-interviews"]
title = "Tips for Technical Interviews – Web Performance and Site Speed Consultant"
description = "How can you prepare for and survive a technical interview?"
full_description = "By Harry Roberts Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. Yesterday, I spoke at ITKonket in Kragujevac, Serbia. During the Q&A after my talk, one great and non-technical question I got was for general advice on interviewing at tech companies. I decided to write down (and expand on) my answer in the hope that it might help someone else, too. I’d say that solid preparation can carry you through the majority of an interview. It helps to quell the nerves, shows that you’re proactive, and gives you a head start. Dedicate a lot of time to preparing for interviews. Most prep work will come in the form of asking questions: here are some of the most effective ones I’ve used. This is key, and can really, really help you out. If emails are between you and a recruiter, there’s a strong chance that you will not be getting interviewed by them. This means that you’ll be going into the interview cold, and your first encounter with the interviewer will be live on the night. If this is the case, ask the recruiter who will be interviewing you (you need a name and their title). Depending on their answer, there are a few approaches to take. Let’s have some example scenarios and how I would handle it. Next, ask if it’s possible to get an email intro to the relevant people ahead of time as you have some questions for them. Conversely, if you are already emailing with the person who will ultimately interview you, you’re pretty well set up—you won’t be going in cold. Use your emails to get a sense of the person: are they formal or informal? Do they seem hurried? Did they mention an aspect of their personal life (Apologies for the delayed reply—I’ve been on holiday over the long weekend.)? You can use these hints to make conversation in the interview, and use them as anchors to link back to when making smalltalk (How was your holiday? The weather was perfect for it!). Be as personable as possible so that you’re already beginning to form a not-purely professional relationship with them. But go easy on it. Don’t go Instagram-stalking them or sending them friend requests."
