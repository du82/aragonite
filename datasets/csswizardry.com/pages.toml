["https://csswizardry.com/2011/01/create-a-centred-horizontal-navigation"]
title = "Create a centred horizontal navigation – Web Performance and Site Speed Consultant"
full_description = "Get in touch Need Some Help? I help companies find and fix site-speed issues. Performance audits, training, consultancy, and more. By Harry Roberts Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. N.B. This article is kind of old now. While the technique definitely still works, I’d recommend looking into Flexbox for this nowadays. Happy coding! I help companies find and fix site-speed issues. Performance audits, training, consultancy, and more. Centring block level elements is easy, just define a width and set margin: 0 auto;, but what if you don’t know that fixed width? You could use text-align: center; but that won’t work on 100%-width block-level elements either… that’ll only work on text-level elements. Defining explicit widths and heights should always be avoided wherever possible, as doing so will make the document a lot less future-proof, flexible and extensible… Suppose you have four items in your navigation menu–you can work out the width of these and use margin: 0 auto; to centre them. Adding a fifth will increase the width, meaning you’d need to alter the CSS, too. This is far from ideal, and more so with a CMS to power the site (a client can add pages, but perhaps can’t edit CSS). However, there is a way to have a centred horizontal navigation without knowing an explicit width, and without adding CSS. It’s also remarkably easy. Pretty standard, an unordered list of menu items. The CSS is where it’s at. I have highlighted the bits that do the majority of the work: What I’ve done here is simply create a navigation list and given it a border top and bottom (purely to highlight its centred text). Instead of floating the block-level <li>s left I’ve given them display: inline;, that is to say they no longer occupy 100% the available width and they now stack up nicely against each other. Next we use (the much underused) display: inline-block; to make sure the links themselves don’t break onto new lines but still obey any padding values accordingly. Here I have given them a larger hit area by adding padding: 10px;"
