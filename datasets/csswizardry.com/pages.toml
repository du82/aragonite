["https://csswizardry.com/2010/11/design-and-education"]
title = "Design and education – Web Performance and Site Speed Consultant"
full_description = "By Harry Roberts Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. Last week Pascal Raabe got in touch with me asking me to answer a few questions on the relevance and importance of formal education (i.e. a university degree) in the design world. My answer leaned more toward the web design/development side of things, but it’s all much the same. He was happy with the feedback to his questions and also allowed me to post the Q&A here because I thought it was quite interesting: I’m currently writing my dissertation in which I explore the relevance of design education in the knowledge economy and an increasingly digital future. P.R. I remember when I first came across CSS Wizardry, I was very impressed. I assume you opted not to go to uni and devised your professional career yourself and as far as I can see, very successfully so. Thanks for the kind words. And yeah, I did opt to skip university and go straight into the industry as soon as I could. P.R. I would be interested to hear your opinion about design education. Do you think formal design education is still relevant? Why did you choose not to go to university? Do you feel that you somehow missed out on aspects of formal education that go beyond teaching (such as social life, time to experiment, etc.)? I personally would (and actively do) suggest to people that, before considering enrolling in formal education in a web design/development field, they consider the benefits they would reap from the money it would cost. The reasons for this are generally that a) university is very expensive b) something such as web development is so accessible and learnable without a formal course that you can very easily learn the course content yourself for a fraction of the price (the cost of a few good books) or c) learn better, more current topics. Universities, where web development is concerned, are notoriously behind-the-times. I’ve heard countless horror stories, including the most recent from someone whose lecturer is teaching table based build!"
