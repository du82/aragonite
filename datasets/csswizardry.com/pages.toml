["https://csswizardry.com/2019/08/making-cloud-typography-faster"]
title = "Making Cloud.typography Fast(er) – Web Performance and Site Speed Consultant"
description = "What issues does Hoefler&Co’s Cloud.typography introduce, and how can we mitigate them?"
full_description = 'Get in touch Need Some Help? I help companies find and fix site-speed issues. Performance audits, training, consultancy, and more. By Harry Roberts Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. I was doing some cursory research and running a few tests against a potential client’s site so as to get a good understanding of the shape of things before we were to work together. Even in just the first 10 entries in the waterfall chart above, there were so many fascinating clues and tells that were made immediately apparent. I was struck by some interesting behaviour happening in the very early stages of the page-load lifecycle. Let’s pick it apart… First up, even though the request to cloud.typography.com returns a 302 response with a text/html MIME type, its outgoing request is for CSS. This makes complete sense as the request is invoked by a <link rel="stylesheet" />. We can further verify this by noting the presence of an Accept: text/css,*/*;q=0.1 request header. Put simply, despite not ‘being’ CSS, this request sits on our Critical Path and therefore blocks rendering. To further exacerbate the problem, the 302 response has a Cache-Control: must-revalidate, private header, meaning that we will always make an outgoing request for this resource regardless of whether or not we’re hitting the site from a cold or a warm cache. Although this response has a 0B filesize, we will always take the latency hit on every single page view (and this response is basically 100% latency). On mobile connections, this can amount to whole seconds of delays, all sat on the Critical Path. Next up, we get sent to fonts.[client].com, which introduces yet more latency for the connection setup. (Please note that this phenomenon is specific to the way this company has implemented their own assets and has nothing at all to do with Cloud.typography.) Because this response is CSS, our critical request chain remains unbroken—this is all work taking place on the Critical Path.'
