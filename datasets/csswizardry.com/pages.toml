["https://csswizardry.com/2010/10/your-logo-is-an-image-not-a-h1"]
title = "Your logo is an image, not an <h1> – Web Performance and Site Speed Consultant"
full_description = 'By Harry Roberts Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. Should you mark your logo up as an image or an <h1>? There has been much debate for a long time now as to how to mark up logos. Should your logo be an inline image (<img />) or an <h1> with a background style–using one of many means of image replacement–to apply the logo to that? This debate has been raging for goodness knows how long, but I’m going to try and explain in this article why you should mark up logos as inline images, and why that’s the most sensible option. Your logo is content, not style. Style vs. content, in the web standards sense of the term, pertains to information and content that is required to be present/accessible irrespective of the presence of styles (in other words, CSS). A logo is content. Let’s use Nike as an example throughout. Regardless of whether Nike’s site is blue, red or green, their logo will always be ‘that’ swoosh. The logo is totally independent of the site’s surrounding styles as the logo is content. Imagine you were to visit Nike’s site in a browser that doesn’t support styles. It only makes sense that that logo is still there. It’s Nike’s brand, and it’ll be their brand whether their site is styled or not. So your logo is content; it’s a visual representation of a brand that is defined long before that company’s site can be brought into consideration. Nike is admittedly a very big brand, but a brand nonetheless. Transport that way of thinking to any build and it’s becomes pretty obvious that a logo is indeed content. So if a logo is content, a logo is markup, right? Right. You’d probably want to mark up your logo as follows: As simple as that. Regardless of styles your content–and therefore logo–persist. Use the id="logo" to style anything such as positioning, and that’s it. So we’ve proved that a logo is content, but let’s now prove that it isn’t an <h1>, a commonly held practice for marking up logos.'
author = "Harry Roberts"
