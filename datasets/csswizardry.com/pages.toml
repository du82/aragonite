["https://csswizardry.com/2025/01/build-for-the-web-build-on-the-web-build-with-the-web"]
title = "Build for the Web, Build on the Web, Build with the Web – Web Performance and Site Speed Consultant"
description = "What is the real, long-term cost of adopting a JavaScript framework?"
full_description = "By Harry Roberts Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. This article started life as a post on LinkedIn, but after some gentle nudging from friend, web custodian, and unwitting mentor Jeremy Keith, I’ve decided to publish and expand upon it here. If I was only able to give one bit of advice to any company: iterate quickly on a slow-moving platform. In the last year alone, I have seen two completely different clients in two completely different industries sink months and months into framework upgrades. Collectively, they’ve spent tens, if not hundreds, of thousands of dollars rewriting entire projects just to maintain feature parity with the previous iteration. This is not meaningful or productive work—it is time sunk into merely keeping themselves at square one. It’s a form of open-source vendor lock-in, and adding even the most trivial of performance improvements becomes impossible as frameworks obscure or sometimes remove the ability to fiddle with the nuts and bolts. The worst thing? You get to do it all again in 18 months! The stack owns you, and you have an entire development team who might be paid one or two quarters every two or three years just to tread water. The saddest part of it all is that these were ex-clients who had to re-hire me because with the ‘upgrades’ came severe site-speed regressions. As good as it may be for business, I hate going through the same work with the same client more than once. After all, you should never need to call pest control twice. The web as a platform is a safe bet. It’s un-versioned by design. That’s the commitment the web makes to you—take advantage of it. All of this seems painfully reminiscent. As far back as 2007, Dan Cederholm gave us do­websites­need­to­look­exactly­the­same­in­every­browser.com (the answer is no; I saved you a click). Almost 20 years ago, the discussion was around much more trivial, visual flourishes like rounded corners and drop shadows, but the sentiment still rings true today: shipping hundreds of kilobytes of JavaScript so you can give an otherwise static site smooth, soft navigations is entirely nonsensical. Nowadays, you can implement that with one line of CSS1 and the worst case scenario is that browsers that don’t support it simply traverse your site just like they were always designed to do. Your escalator became stairs."
