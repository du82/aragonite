["https://csswizardry.com/2010/10/i-hate-that-i-love-writer"]
title = "I hate that I love Writer – Web Performance and Site Speed Consultant"
full_description = "By Harry Roberts Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. I absolutely hate that I love Information Architects’ Writer. Every time I use it I get a little angry inside because I just love it! Weird, I know, but true nonetheless. It’s just so plain but so great that I get all these funny feelings about it, which always resolves to an envious kind of adoration. I have followed iA fervently for as long as I’ve known about them. They are, to me, a beacon of what is good about this industry; they’re an inspirational agency and one that I love. So, when I heard that they were working on an iPad app I was immediately interested. They’d set the bar pretty high with their other work, but I had equally high hopes and expectations. Anyway, the day the app went on sale I bought it. At £2.99 it’s relatively pricey in app terms, but (as I tend to do more often than not) I reasoned that £3 is less than one pint, so actually pretty reasonable. I fired it up and saw pretty much nothing, which I guess is the point, but I did feel a little ‘Oh, anti-climax…’ I tinkered with it for a few minutes, idly typing nothings, deleting them, then typing some more. It was pretty mediocre. Or so I thought… As I’d only been typing dummy text I’d not really used it properly, or to its full potential. I didn’t see the point, nor did I reap the benefits. That evening, lying in bed, I reached for my iPad and started drafting an article. That’s when it hit me. Writer is awesome! When you start using it properly you realise that its stark UI and outward lack of features is a wealth of features in itself. Writer makes writing so easy, and it honestly seems to come more naturally. It’s a genuine breath of fresh air for anyone who is used to writing on a computer. I hate word processors with a passion. They’re horrible, horrible things. On this basis I tend(ed) to draft any articles in my text-editor, Notepad++. It strips out all the stuff I don’t need and leaves just me, the canvas and the letters. Oh and all those icons in the UI. And the nastily long line-length. And the awkward look of code-sized type as prose…"
