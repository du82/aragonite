full_description = "It can be daunting sending an email off into the blue, so hopefully I can answer some of your questions up-front. If not, please do not hesitate to contact me with anything at all that you might need to know. I guarantee you’ll be pleasantly surprised. You’d be surprised. From $1,000 to $100,000, there’s always something we’ll be able to do to help solve your problem. My approach is to design the engagement around you, so your best option is to get in touch and let me work something out. Absolutely! While my client list tends to highlight more familiar household names, I love partnering with anyone who’s keen to do good work. In fact, some of my most fond memories are joining smaller teams and working closely together to solve problems. Whether it’s consultancy, audits, or training, the size of your company does not matter. There’s something for everyone. Probably not as long as you think! Over the past six years, I have managed to optimise my workflow to such an extent that we can move incredibly quickly. Vitamix had this to say about it: Harry’s technique for getting to the root of our needs was phenomenal—he proposed a tailor made plan of action, and it was spot on. We were able to implement it immediately and it didn’t take weeks or months of ramp-up time. It was as if Harry had been in the trenches with us all along! Yes! Owing to 2020’s Coronavirus pandemic, I designed a workshop curriculum and format specifically optimised for remote delivery. Learn more… The good news is that I don’t base workshop pricing on the number of attendees. Making it harder for people to attend will minimise my impact, which defeats the whole purpose of training your team—send as many people as you want! That said, I would recommend trying to keep numbers under 30. Beyond that amount, sessions tend to turn into more monologue, lecture-style sessions that hinder both interactivity and productivity. At least one day—a half-day isn’t long enough to cover anything of