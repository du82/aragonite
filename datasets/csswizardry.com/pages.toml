["https://csswizardry.com/2009/12/typographic-work-planner"]
title = "Typographic work planner – Web Performance and Site Speed Consultant"
full_description = 'By Harry Roberts Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. No one likes being told what to do, especially if it’s work related, but nevertheless jobs need done. Why present boring stuff in a boring way? If you’re going to be told what to do, at least soften the blow by being told nicely. Enter this, a little HTML/CSS typographic work planner. By using some super-semantic HTML and a dash of CSS you can craft a beautiful looking yet incredibly simple work planner for you and your staff. The rich, semantic markup is as follows. Notice the use of the more semantic elements and attributes such as summary="", colgroup, scope="", caption and more… The CSS used to create the work planner is pretty basic, with a dash or progressive enhancement added via some CSS3. View the full CSS file with reset etc. Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. Hi there, I’m Harry Roberts. I am an award-winning Consultant Web Performance Engineer, designer, developer, writer, and speaker from the UK. I write, Tweet, speak, and share code about measuring and improving site-speed. You should hire me. I help teams achieve class-leading web performance, providing consultancy, guidance, and hands-on expertise. I specialise in tackling complex, large-scale projects where speed, scalability, and reliability are critical to success. CSS Wizardry Ltd is a company registered in England and Wales. Company No. 08698093, VAT No. 170659396. License Information.'
