["https://csswizardry.com/sentinel"]
title = "Sentinel: Your Web-Performance Watchman – Web Performance and Site Speed Consultant"
description = "I keep an eye on site-speed so you don’t have to"
full_description = "Keep getting hit with performance regressions? Site-speed unstable and inconsistent? No time to triage performance issues? No one taking ownership of site-speed? Sound familiar? Most companies simply don’t have dedicated performance teams (or even individuals) to keep a constant eye on site-speed. Engineers have product and feature work to do, and even with the best will in the world, performance ends up falling off the radar. Regressions sneak in, go unnoticed, and never get fixed. Service undersells what Harry is providing here. It looks like a comprehensive monitor/triage/root-cause/impact high-touch service from one of the best. Sentinel is a service I offer to a small number of trusted clients: I become your eyes and ears so you can get on with what you do best. Using my own monitoring, I’ll work with you to define performance budgets and set up relevant dashboards and alerts to make sure you stay fast. The moment a regression is detected, I receive the alert and get to work. Your developers don’t get interrupted by emails from monitoring software, and they don’t need to wade though meaningless data to uncover meaningful insights. In fact, they don’t need to do anything at all—that’s my job. I’ll jump in, honing right in on the issue using bespoke dashboards and performance budgets designed specifically for you. I’ll identify the problem and hand over a report containing the timing of the regression, its cause, its severity, its impact, and its fix. Firstly, I’ll conduct an initial audit of your site to identify and address any current slowdowns—there’s no point monitoring a slow website! Then, we work together to outline the key metrics we’d like to track. Want to monitor Largest Contentful Paint? Sure! TTFB? You got it! Total Blocking Time? Done! Once we have a handful of metrics we’d like to keep an eye on, we gather key pages to monitor—we could monitor all metrics on all pages, or any permutation of the above. It’s entirely up to you."
