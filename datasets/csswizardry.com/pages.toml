["https://csswizardry.com/2023/01/why-not-document-write"]
title = "Why Not document.write()? – Web Performance and Site Speed Consultant"
description = "We’re often told not to use document.write(), but… why?!"
full_description = "By Harry Roberts Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. If you’ve ever run a Lighthouse test before, there’s a high chance you’ve seen the audit Avoid document.write(): You may have also seen that there’s very little explanation as to why document.write() is so harmful. Well, the short answer is: From a purely performance-facing point of view, document.write() itself isn’t that special or unique. In fact, all it does is surfaces potential behaviours already present in any synchronous script—the only main difference is that document.write() guarantees that these negative behaviours will manifest themselves, whereas other synchronous scripts can make use of alternate optimisations to sidestep them. N.B. This audit and, accordingly, this article, only deals with script injection using document.write()—not its usage in general. The MDN entry for document.write() does a good job of discouraging its use. The worst case scenario is a script that falls into both (1) and (2), which is more likely to affect scripts defined earlier in your HTML. document.write(), however, forces scripts into both (1) and (2) regardless of when they’re defined. The reason scripts never block subsequent downloads is because of something called the Preload Scanner. The Preload Scanner is a secondary, inert, download-only parser that’s responsible for running down the HTML and asynchronously requesting any available subresources it might find, chiefly anything contained in src or href attributes, including images, scripts, stylesheets, etc. As a result, files fetched via the Preload Scanner are parallelised, and can be downloaded asynchronously alongside other (potentially synchronous) resources. The Preload Scanner is decoupled from the primary parser, which is responsible for constructing the DOM, the CSSOM, running scripts, etc. This means that a large majority of files we fetch are done so asynchronously and in a non-blocking manner, including some synchronous scripts. This is why not all blocking scripts block during their download phase—they may have been fetched by the Preload Scanner before they were actually needed, thus in a non-blocking manner."
author = "Harry Roberts"
year_published = 2023
year_updated = 2023
