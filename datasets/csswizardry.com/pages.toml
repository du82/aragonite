["https://csswizardry.com/2019/03/cache-control-for-civilians"]
title = "Cache-Control for Civilians – Web Performance and Site Speed Consultant"
description = "What does Cache-Control really do? In basic terms? Let’s find out!"
full_description = "Get in touch Need Some Help? I help companies find and fix site-speed issues. Performance audits, training, consultancy, and more. By Harry Roberts Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. The best request is the one that never happens: in the fight for fast websites, avoiding the network is far better than hitting the network at all. To this end, having a solid caching strategy can make all the difference for your visitors. That being said, more and more often in my work I see lots of opportunities being left on the table through unconsidered or even completely overlooked caching practices. Perhaps it’s down to the heavy focus on first-time visits, or perhaps it’s a simple lack of awareness and knowledge? Whatever it is, let’s have a bit of a refresher. Let’s look at Cache-Control in simple terms, and how we can we can best utilise it. Let’s look at Cache-Control for civilians. One of the most common and effective ways to manage the caching of your assets is via the Cache-Control HTTP header. This header applies to individual assets, meaning everything on our pages can have a very bespoke and granular cache policy. The amount of control we’re granted makes for very intricate and powerful caching strategies. Cache-Control is the header, and each of public and max-age=31536000 are directives. The Cache-Control header can accept one or more directives, and it is these directives, what they really mean, and their optimum use-cases that I want to cover in this post. public means that any caches may store a copy of the response. This includes CDNs, proxy servers, and the like. The public directive is often redundant, as the presence of other directives (such as max-age) are implicit instructions that caches may store a copy. Further, the presence of public on requests with an Authorization header will cause the response to be stored in public caches which you really, really do not want:"
