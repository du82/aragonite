["https://csswizardry.com/2010/12/tweet-this"]
title = "Tweet this! – Web Performance and Site Speed Consultant"
full_description = "By Harry Roberts Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. This is just a very quick article of no real substance, but that I thought I’d share for all you Twittering bloggers out there. You may have noticed a few weeks ago I added a simple link at the end of every article in order for readers to quickly Tweet the current post with a link and my Twitter username. A very small and trivial addition, which seems to have had massive benefits! There we have it, just a simple textual link with a personal-sounding message. This is so trivial that I didn’t actually bother putting any metrics into place to track its effectiveness. However, one thing I have noticed is that that subtle, textual link with a polite message (I didn’t want a garish ‘Tweet me now!’ kind of button as that wouldn’t have sat properly with the way I’ve done the rest of CSS Wizardry) has had quite a noticeable impact on articles’ tweet rates. It seems to be very very effective! So yeah, basically if you’re wondering how effective something such as that might be, I’d say very–although I don’t have numbers to prove it…. Harry Roberts is an independent consultant web performance engineer. He helps companies of all shapes and sizes find and fix site speed issues. Hi there, I’m Harry Roberts. I am an award-winning Consultant Web Performance Engineer, designer, developer, writer, and speaker from the UK. I write, Tweet, speak, and share code about measuring and improving site-speed. You should hire me. I help teams achieve class-leading web performance, providing consultancy, guidance, and hands-on expertise. I specialise in tackling complex, large-scale projects where speed, scalability, and reliability are critical to success. CSS Wizardry Ltd is a company registered in England and Wales. Company No. 08698093, VAT No. 170659396. License Information."
