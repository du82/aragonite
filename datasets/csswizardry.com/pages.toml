full_description = "I’ve spoken at a lot of conferences. Over one-hundred of them. Sharing knowledge is one of my key motivations, and is a large part of why I chose to become a consultant in the first place—I love to help. From local meetups to international events, I am an enthusiastic, engaging, and professional speaker. My focus is on web performance and site-speed optimisation, from both a technical- and business-perspective. Want to see where I’m speaking next? I have a fairly full international schedule, so hopefully I’ll be in a city near you very soon. Want me to speak at your event? I’ll probably say yes. I usually say yes. Take a look at my preliminary questions and then drop me a line. Am I any good? Check this keynote from 2019’s performance.now() conference. It’s a good representation of me and my style. As well as public speaking engagements, I am available to deliver talks in-house, directly to you and your colleagues. This means we can tailor the content to provide the most focused and valuable talk possible. Contact me to talk about possibilities. I would absolutely love to speak at your conference! However, I do just have a few questions to make the whole process a lot simpler and upfront for everyone involved. If you could fire me an email answering as many of the below as possible, I’d be really grateful. If you don’t have answers to everything just yet, please don’t worry—this is just a rough starting point, not a test. Please also remember that there is no right or wrong answer to any of these questions. I will help to promote and publicise your event. I will endeavour to make myself available to attendees for the entire duration of the event. I will attend all social activities surrounding the event. I will deliver a quality talk of practical relevance. I will gladly allow you to record and distribute my talk. I hold myself to a high standard. Hi there, I’m Harry Roberts. I am an award-winning Consultant Web Performance Engineer, designer, developer, writer, and speaker from the UK. I write, Tweet, speak, and share code about measuring and improving site-speed. You should hire me."
