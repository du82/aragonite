["https://ctf101.org/cryptography/overview"]
title = "Overview - CTF Handbook"
description = "Capture the Flag Competition Wiki"
full_description = '''Cryptography Cryptography is the reason we can use banking apps, transmit sensitive information over the web, and in general protect our privacy. However, a large part of CTFs is breaking widely used encryption schemes which are improperly implemented. The math may seem daunting, but more often than not, a simple understanding of the underlying principles will allow you to find flaws and crack the code. The word “cryptography” technically means the art of writing codes. When it comes to digital forensics, it’s a method you can use to understand how data is constructed for your analysis. Math in Cryptography Most modern cryptography systems rely on one way mathematical algorithms derived from modular arithmetic. It's an ongoing arms race to create and implement better hardware and algorithms. For example, the implementation of the first RSA algorithm is completely reliant on the "difficulty of factoring large numbers". It's a great example of security by design, and modern application developers still use similar derivatives. In August 2024, NIST released the first standards for post-quantum encryption to remediate the quantum-computing threat against legacy systems. For more information, check out this blog post! What is cryptography used for? Uses in every day software Securing web traffic (passwords, communication, etc.) Securing copyrighted software code Key exchange algorithms Malicious uses Hiding malicious communication Hiding malicious code Additional Links October 15, 2024 January 26, 2024'''
