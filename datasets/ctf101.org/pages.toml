["https://ctf101.org/faq/i-need-a-server"]
title = "I need a server - CTF Handbook"
description = "Capture the Flag Competition Wiki"
full_description = "I need a server Occasionally, certain kinds of exploits will require a server to connect back to. Some examples are connect back shellcode, cross site request forgery (CSRF), or blind cross site scripting (XSS). I just a web server If you just need a web server to host simple static websites or check access logs, we recommend using PythonAnywhere to host a simple web application. You can program a simple web application in popular Python web frameworks (e.g. Flask) and host it there for free. I need a real server If you need a real server (perhaps to run complex calculations or for shellcode to connect back to), we recommend DigitalOcean. DigitalOcean has a cheap $4-6/month plan for a small server that can be freely configured to do whatever you need. February 20, 2024 February 20, 2024"
