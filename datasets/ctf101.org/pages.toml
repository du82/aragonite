["https://ctf101.org/intro/how-to-run-a-ctf"]
title = "How do I host a CTF - CTF Handbook"
description = "Capture the Flag Competition Wiki"
full_description = '''How do I run a CTF? "Is it really a CTF if you don't solve the infrastructure problem in the 24 hours before the competition?" Before you start Consider a few of the following before starting a CTF. How many people will play in my CTF? What type of challenges do I want to write? How do you want to host your challenges? What is my budget? Challenge Writing Infrastructure Depending on the size of your competition, you're going to need different types of deployments. Generally, you'll need a load balancer to work concurrently with your web application. Info When we ran CSAW'23, there were over 2500 teams of ~4 people. You can try to gauge how many users your competition might have before writing a deployment. Open Source Frameworks CTFd CTFd makes it easy to spin up an instance able to support a CTF at any time. Starting a local server is as easy as: docker run -p 8000:8000 -it ctfd/ctfd # (1) For more information on Docker, read the docs! kCTF kCTF is a framework written by Google built on Kubernetes. It has built in load balancing at the platform level. rCTF Written by the redPWN CTF team, rCTF has a separate CI/CD module for supporting challenge deployment as well. curl https://get.rctf.redpwn.net | sh Paid CTF Hosting CTFd Enterprise Three-tiered pricing service with hosting services and on-call support. Supports professional workshops generally reserved for industry security teams exercises. Hack the Box CTF October 30, 2024 May 31, 2024'''
