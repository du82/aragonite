["https://ctf101.org/binary-exploitation/relocation-read-only"]
title = "Relocation Read-Only (RELRO) - CTF Handbook"
description = "Capture the Flag Competition Wiki"
full_description = 'Relocation Read-Only (RELRO) Relocation Read-Only (or RELRO) is a security measure which makes some binary sections read-only. There are two RELRO "modes": partial and full. Partial RELRO Partial RELRO is the default setting in GCC, and nearly all binaries you will see have at least partial RELRO. From an attackers point-of-view, partial RELRO makes almost no difference, other than it forces the GOT to come before the BSS in memory, eliminating the risk of a buffer overflows on a global variable overwriting GOT entries. Full RELRO Full RELRO makes the entire GOT read-only which removes the ability to perform a "GOT overwrite" attack, where the GOT address of a function is overwritten with the location of another function or a ROP gadget an attacker wants to run. Full RELRO is not a default compiler setting as it can greatly increase program startup time since all symbols must be resolved before the program is started. In large programs with thousands of symbols that need to be linked, this could cause a noticable delay in startup time. September 4, 2024 January 26, 2024'
author = "OSIRIS Lab & CTFd LLC"
year_published = 2024
