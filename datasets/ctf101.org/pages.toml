["https://ctf101.org/binary-exploitation/no-execute"]
title = "No eXecute (NX) - CTF Handbook"
description = "Capture the Flag Competition Wiki"
full_description = '''No eXecute (NX Bit) The No eXecute or the NX bit (also known as Data Execution Prevention or DEP) marks certain areas of the program as not executable, meaning that stored input or data cannot be executed as code. This is significant because it prevents attackers from being able to jump to custom shellcode that they've stored on the stack or in a global variable. January 26, 2024 January 26, 2024 CTF Handbook osiris/ctf101 Home Introduction Introduction What is a CTF Getting Started with CTFs How do I host a CTF Forensics Forensics Overview File Formats Metadata Stegonagraphy Disk Imaging Memory Forensics Hex Editors Network Analysis Network Analysis Wireshark Packet Capture Cryptography Cryptography Overview XOR Hashing Functions Ciphers Ciphers Substitution Cipher Caesar Cipher/ROT 13 Vigenere Cipher Modes of Operation Modes of Operation Block Ciphers Stream Ciphers Asymmetric Encryption Asymmetric Encryption RSA Web Exploitation Web Exploitation Overview SQL Injection Command Injection Directory Traversal Cross Site Request Forgery Cross Site Scripting (XSS) Server Side Request Forgery PHP Reverse Engineering Reverse Engineering Overview Assembly/Machine Code The C Programming Language Disassemblers Debuggers Decompilers Binary Exploitation Binary Exploitation Overview Registers The Stack Calling Conventions Global Offset Table (GOT) Format String Vulnerability Return Oriented Programming (ROP) Buffers Buffers What are Buffers Buffer Overflow Binary Security Binary Security What is Binary Security No eXecute (NX) Address Space Layout Randomization (ASLR) Stack Canaries Relocation Read-Only (RELRO) The Heap The Heap What is the Heap Heap Exploitation FAQ FAQ How to connect to services I need a server Recommended Software No eXecute (NX Bit) The No eXecute or the NX bit (also known as Data Execution Prevention or DEP) marks certain areas of the program as not executable, meaning that stored input or data cannot be executed as code. This is significant because it prevents attackers from being able to jump to custom shellcode that they've stored on the stack or in a global variable. January 26, 2024 January 26, 2024 var target=document.getElementById(location.hash.slice(1));target&&target.name&&(target.checked=target.name.startsWith("__tabbed_")) Back to top'''
