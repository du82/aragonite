full_description = '''**LA CTF 2025 is a DiceCTF Finals pre-qualifier! The top scoring team will automatically be offered a spot in DiceCTF's in-person Finals, previously held in NYC!** LA CTF is an annual Capture the Flag (CTF) cybersecurity competition hosted by ACM Cyber at UCLA & Psi Beta Rho. LA CTF is open to all skill levels of cybersecurity! Whether you are tackling your first exploit or have professional experience, there will be challenges just right for you! There will be a variety of events ranging from the competition containing jeopardy-style cybersecurity challenges to talks from UCLA professors to fun events such as meme competitions! If you are interested in attending, join the Discord to stay up to date with the latest information about LA CTF! LA CTF will have prizes for both the UCLA and open sections! While there will be two sections for prizes, all of the challenges will be the same for both sections. Prizes will be given in the form of US Amazon gift cards. UCLA Section: The UCLA Section will be composed of teams that must consist of a maximum of four current UCLA undergraduate students. Open Section: The Open Section will be composed of teams with no size limit. Note that prizes can only be given as US gift cards. All skill levels and experiences are welcomed! Follow @CTFtime !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src="//platform.twitter.com/widgets.js";fjs.parentNode.insertBefore(js,fjs);}}(document,"script","twitter-wjs"); All tasks and writeups are copyrighted by their respective authors. Privacy Policy. Hosting provided by Transdata.'''
