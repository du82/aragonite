ith Ctheory and our products. If you send us a request (for example via email or via one of our feedback mechanisms), we reserve the right to publish it in order to help us clarify or respond to your request or to help us support other users. Ctheory takes all measures reasonably necessary to protect against the unauthorized access, use, alteration or destruction of potentially personally-identifying and personally-identifying information. Cookies A cookie is a string of information that a website stores on a visitor's computer, and that the visitor's browser provides to the website each time the visitor returns. Ctheory uses cookies to help Ctheory identify and track visitors, their usage of Ctheory website, and their website access preferences. Ctheory visitors who do not wish to have cookies placed on their computers should set their browsers to refuse cookies before using Ctheory's websites, with the drawback that certain features of Ctheory's websites may not function properly without the aid of cookies. Business Transfers If Ctheory, or substantially all of its assets, were acquired, or in the unlikely event that Ctheory goes out of business or enters bankruptcy, user information would be one of the assets that is transferred or acquired by a third party. You acknowledge that such transfers may occur, and that any acquirer of Ctheory may continue to use your personal information as set forth in this policy. Ads Ads appearing on any of our websites may be delivered to users by advertising partners, who may set cookies. These cookies allow the ad server to recognize your computer each time they send you an online advertisement to compile information about you or others who use your computer. This information allows ad networks to, among other things, deliver targeted advertisements that they believe will be of most interest to you. This Privacy Policy covers the use of cookies by Ctheory and does not cover the use of cookies by any advertisers. Privacy Policy Changes Although most changes are likely to be minor, Ctheory may change its Privacy Policy from time to time, and in Ctheory's sole discretion. Ctheory encourages visitors to frequently check this page for any changes to its Privacy Policy. If you have a Ctheory.com account, you might also receive an alert informing you of these changes. Your continued use of this site after any change in this Privacy Policy will constitute your acceptance of such change.'''
