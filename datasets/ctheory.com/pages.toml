full_description = 'Michael Howard 4 years ago 1 min read 사설토토 안전하게 즐기는 방법 들이 언니네 큰 딸에게 장난을 는데 장난이 격해져서 크게 다칠뻔해요.(평소 큰 애의 사설토토 즐기는것 장난이 심해 이모는 늘 불안해하 들을 살피고 장난이 심해지면 악역을 도맡아 잔소리 하는 사람이 되고 엄 마는 그저 방관 때도 이모의 저지가 있었지만 듣지 않고 흥분도가 높아져 장난이 심해져서 다치게 되요) 래 도 엄만 아들에게 아무소리 안하고 조카의 상처만 살핍니다. 그 아들도 미안한지 옆에 붙어서 쳐다보고 이 모 눈치보며 걱정도 해요.그래도 이 아들도 절대 자기가 잘못했다 안하단 말을 안합니다. 오히려 자기가 안 그랬다고 거짓말을 하죠.엄마, 아들 모두 제대 육을 못 받았기에 미안한 마음은 가득하지만 그 마음을 어떻 게 사과 해야되는지도 모르 들은 장난인지 폭력인지 구분을 못해 심하게 놀다가 결국 사고가 나구요.엄마 는 자기만 육방식이 제대로 되어있지 않아서 자기 자식의 잘못된점 지적하나 못하면서 그저 자기 들이 사 랑받는 사람이 되기를 원해요. 본인이 어릴적 엄마에게 관심을 못 받아 외로웠다서요. 자기 아들은 그냥 사 랑만 받으며 살았음 좋겠대요.님글을 보니 남편분은 저 위에 는 유치원생 아들처럼 장난과 폭력의 경계선 을 구분할 수 없는 사람같아보여요.어릴때터 잘못된것의 교육을 못 받은거죠.엄마에게 장난쳐 팔이 금이 가게하는데도..그저 장난라 여기는 시어머니보니..어릴 때 제대로 교육을 안하면 지금 님 남편처럼 되는구 나 생이 드네요.평생을 그게 옳은거다라고 믿으며 살아왔는데 쉽게 바뀔까요?시어머니부터 편 형까지 제대로 된 사람이 없어요.비유도 그 따위로 사설토토 즐겁게 즐기세요 젤 웃겼음과연 어떤게 행복일지 생각해보세요.꼭 행복 찾으셨으면 좋겠네요.상담을 받아야 될 사람은 원인제공자인것 네요… ADHD처럼 산만하다든지 말씀대로 반사회적성향이라든지 감사 를받아보는 게 을 것같아요 아님 업무라든지 다른 불안적요소를 그렇게 푸는건지… 언니분이 잘 아시 을까 요 그냥 하지말라고 해서 해결되고 푸는 그런 문제는 아닌것 같아요 정신적 심리적로 보고 고쳐야할 병이 라고 생각하면 시댁에서도 그렇게 반응하면 안되는거고… 물론 런일이 없었으면 가족끼리 얼굴 붉힐 일도 없었겠지만 앞으로 어떤 분란이 일어나도 그식으로 다들 각자입장에서 행동하는 방식은 같을 것 같네요 시 댁은 뭐… 내가 잘해주니 해주는거고 아들위해 잘해주는거고 또 남들의식도 하시고… 속으로 아들이 백번 잘못한 인거 아니까 챙피하셔서 그걸 사돈댁에사 알았다는 사실이 싫고 이렇게 된거 이판사판 느리에게도 대놓고 성질부린것 같네요 또 화해하면 잘해주겠지만 …며느리입장에선 인적인모습을보면서 정도 떨어지 고…남편 말대로 뭔가 외부적인 강압이 있어야 제어가 되 보니 스스로 컨트롤이 안되는 것 같아요 형님은 부부클리닉 말씀하시는데…. 부부의 제라기보다 한사람의 문제이고… 어쨋든 치료도 받으시고 남편이 상대 방이 아픈 공감능이 필요한데… 그걸 못느낀다면 그로인해서 본인에게 돌아오는 피해가 있어야 해요 어든 남편이 일을 벌려놨으니 조금 떨어져계시면서 부인없는 불편함도 알고 자신이 그런동을하면 부인이 가버 린다는것도 알아야죠… 그건 마치 옛날 학창시절 옆짝궁이 일어서을때 연필을 의자위에 세워놓는…위함한 장난과도 같은거죠 문열면 동이가떨어지는… 게 장난인가요? 흔히 요즘말하는 학폭아닌가요 시댁에서 분 간이 안간다니…님 그러다 일나요… 전글 다 읽고 왔는데 남편 정상아니에요.. 시댁도 자기 아들이 이상한거 알기문에 저러는거에요. 이번에 넘어가면 다신 안그럴거같죠..? 분명히 또 그럽니다. 그러가 님뿐만 아 안전놀이터 먹튀검증 받은 메이저사이트 즐기기 니라 나중에 태어날 자녀들에게도 그러면 어떻게 하시려구요 홈페이지 에서 님남편 정상 니\에요….진짜 소름인건 시댁에 정상적인 사고를갖은사람이아무도없고 그런가정에서 란게 남편이 저렇 게 \된 영향중에 하나인것같기도해요.님이 안타까운건 시댁이든 친정이님 편은 없어보여요..무조건 님을 1 순\위로두고 결정하세요..번 더 실수하면 그때 헤어도 늦지 않아요 이혼 그렇게 쉬운거 아니에요ㅠ 글쓴이 님이 쉽게 이혼한다는 이야기가 니라 ..정 마음이 열리지 않아 받아주기 힘들다면 남편 내쫒고 생각하는 시 간 가지시고 스로에게 시간을 주신 뒤 결정하셔도 되요ㅠ 지금 당장 이혼하셔서 후련하실거같으세요 혀 아 닐걸요ㅠ글쎄요..그 전 글, 눈 주위 꾹꾹 눌러대는데 글쓴님이 아프다고 비명지르 버둥 치는데도 싸이코패 스처럼 계속 끝장을 본거, 예랑한테 보여줬더니 제가 다렉글을 도 자주 보여줘서 대충 빠르게 속독하는데 그 글은 진짜 천천히 정독해서 읽더라구요. 러더니 하는말남자가 진짜 개또라이네.. 미쳤다 장난을 치더라 도 사람이 아프다하면 그해야지 진짜 개또라이야라고 했어요.사람이 잘못했다고 눈물콧물쏙빼며 손이 발 이되게 면 마음이 약해질수밖에 없죠 특히 신부님처럼 친정이 든든한 버팀목이 되어주지 않는 황에서요. 그치만.. 전 사람 안변한다에 한표에요. 지금 당장 너무 불행한 상황이 펼쳐거같으니 절벽끝에 선것처럼 저 러지만 다시 안정기 찾아오고 행복한 시기 오면 그때 그게 아프다고 소리지를때도 심각성모르고 계속하던 사람이 또 안그럴까요? 그때 그 일은 만한 사람들이 보기에 미친 거 같은 행동이었어요. 선택은 글쓴님 몫 이지만, 범상치 않 람과 함께 살아야한다는 것만큼은 아시고 계속 같이 사셔야할거같아요전 글 읽으며 든 각이 약자한테만 저렇게 장난치지 않나요? 자기 힘으로 제압 가능한 약자들한테만 저러 한 사람한텐 못하 고…정신적으로 문제 있는거 맞는듯요.그리고 그 정신 문제는 저런 시에서 자란 이상 못고칠걸 Tags: sports 사설토토 Continue Reading Previous Don’t believe in sports analysis unconditionallyNext 주소 확인 www.mt-police07.com 먹튀폴리스 사칭 주의 하세요!! More Stories Sports and Recreation 1 min read 주소 확인 www.mt-police07.com 먹튀폴리스 사칭 주의 하세요!! 4 years ago Michael Howard Sports and Recreation Don’t believe in sports analysis unconditionally 4 years ago Michael Howard Sports and Recreation 1 min read Go to Toto site How do I do it? 4 years ago Michael Howard'
