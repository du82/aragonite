title = "Building A Texture Library — Ctrl+Paint - Digital Painting Simplified"
full_description = "Building A Texture Library Many Ctrl+Paint videos encourage using photo-texture overlays... but what photos are best to use? Utilizing textural overlays is much easier if you're working from high quality images. I like to use 'base texture photos' created by texture artists. These videogame artists use photos which seem very boring by photography standards: uniformly lit and without engaging camera angles. Though they won't win any photography contests, they serve as great raw materials for textural overlays. Google image search often doesn't return useful images for this process, so knowing where to find them is essential. In this video I talk about cgTextures.com, as well as the characteristics to look for in a good photo-overlay. Newer:Selective Blending for OverlaysOlder:Reintroducing the Still Life PostedJanuary 2, 2013 AuthorMatt Kohr CategoriesStrictly Digital Tagstexture"
