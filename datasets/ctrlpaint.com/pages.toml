title = "Drawing Shape: Negative Space — Ctrl+Paint - Digital Painting Simplified"
full_description = '''Drawing Shape: Negative Space Ctrl+Paint Store: http://ctrlpaint.myshopify.com/ Full Free Video Library: http://www.ctrlpaint.com/library/ note: This video was originally created for Ctrl... Sometimes the best way to see an object is by looking at the space surrounding it. No, this is not abstract zen wisdom - it is called "negative space". Learning to see negative space is just as important as the subject itself (the positive space). Eventually, when you're designing characters and environments, you'll be using the negative space intentionally - so get used to looking for it in your still life drawings! Newer:Drawing Shape - Simple Still LifeOlder:Drawing Shape: Linear Block-in PostedNovember 15, 2011 AuthorMatt Kohr CategoriesDrawing TagsCtrl-Paint Unplugged'''
