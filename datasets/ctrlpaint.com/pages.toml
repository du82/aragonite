["http://www.ctrlpaint.com/videos"]
title = "Videos — Ctrl+Paint - Digital Painting Simplified"
description = "Digital painting simplified."
full_description = "Playbook 16 - Machine Design Enjoy the videos and music you love, upload original content, and share it all with friends, family, and the world on YouTube. One of my go-to design principles is ‘similarity’. Today we’ll design an interactive machine, which will give us a great opportunity to use this principle to our benefit! Download the homework PostedSeptember 17, 2020 AuthorMatt Kohr 14 CommentsPost a comment Playbook 15 - HUD design Enjoy the videos and music you love, upload original content, and share it all with friends, family, and the world on YouTube. One key aspect of being a concept artist is flexibility, so today we’re trying out some ‘interface design’. So whether you’ve never designed an HP bar in your life, or if you’re a typeface connoisseur, let’s see what UI Ryan needs us to tackle! Download the homework PostedSeptember 10, 2020 AuthorMatt Kohr 2 CommentsPost a comment Playbook 14 - City Layout Enjoy the videos and music you love, upload original content, and share it all with friends, family, and the world on YouTube. Today we’re zooming way out, and designing an entire encampment. And though that might seem like a departure from the previous challenges, it goes to show how versatile design principles can be. To help sculpt these floor-plans, I’ll demonstrate the gestalt principle of ‘enclosure’. Using enclosure, you’ll help players quickly make sense of their surroundings. Additionally, this challenge encourages the idea of ‘experiential design’. Unlike a real city which might sprawl and meander, your city is purpose-built for an audience of 1: the player. And though it might give the impression of a city, it’ll function more like an attraction at Disney World; funneling the player down a carefully considered path. Download the homework PostedSeptember 1, 2020 AuthorMatt Kohr 2 CommentsPost a comment Playbook 13 - Barrier Design Enjoy the videos and music you love, upload original content, and share it all with friends, family, and the world on YouTube. Do Not CrossToday’s challenge is all about barriers. To keep players inside the level boundaries, concept artists have to come up with clever designs. It might be a prop, a visual effect, or some combination of the two. But to create a successful barrier you need to understand figure-ground relationships. Just like the last challenge, Ryan has challenged you to create a new design. This time you’re working with a summer adventure scenario, and my demonstration features a stealth ship on a desert planet. This video’s new principle is ‘figure ground relationships’, but I still expect you to break down Ryan’s brief like in challenges #02 and #03. No matter what the challenge is, it’s crucial to begin with words, brainstorming, and synthesis before you start sketching. Download the homework PostedAugust 25, 2020 AuthorMatt Kohr CommentPost a comment"
