full_description = "Focus Your Time We'd all like more of it, but how should we spend our free time? It's a deceptively simple question, but I find myself asking it nearly every day. Should I s... We'd all like more of it, but how should we spend our free time? It's a deceptively simple question, but I find myself asking it nearly every day. Should I spend an hour doing X or would it be better to do Y instead? What if all I want to do is Z? Though this video doesn't offer concrete answers, it will get you thinking about the bigger picture and how to stay vigilant about your goals. Blogs like www.lifehacker.com often talk about planning the hours of your workday, but I rarely see anyone discussing a longer (1,2,5 year) plans. These sort of 'big questions' are not easy to think about, but ignoring them completely can be a dangerous strategy. What is your strategy? Since I clearly don't offer a perfect solution, we'll all benefit from the discussion. Newer:Opacity Vs. FlowOlder:Selective Blending for Overlays PostedJanuary 10, 2013 AuthorMatt Kohr CategoriesPainting, Drawing, Design Tagsgoals, inspiration, Staying Organized"
