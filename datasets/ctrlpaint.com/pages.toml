full_description = '''Let's Paint A Spatula Today I'll paint a spatula. Exciting, right? It is because of the free series that it kicks off: the "let's paint" demonstrations. Each of these demonstrat... Today I'll paint a spatula. Exciting, right? It is because of the free series that it kicks off: the "let's paint" demonstrations. Each of these demonstrations shows me painting a single object from start to finish. As I work, I'll be mentioning the specific techniques I'm using - and each of these techniques is explained in videos linked at the bottom of the post. Why is this exciting?Because there are hundreds of free videos in the Ctrl+Paint library at this point, and it can seem overwhelming deciding which to watch next. It's not always obvious which techniques fit together and in what ways. The 'Let's Paint' videos give me an opportunity to show the techniques working together, and creating images start to finish. So in a sense, these videos work like a table of contents -- but visual. To see more, visit the Let's Paint page here. RELATED TECHNIQUES SHOWN IN THIS VIDEO Making 'temp layers' - VideoUsing the pen tool - blog postLock Transparent Pixels / Clipping Masks - VideoAdd 2D graphics in perspective using the warp tool - VideoClone your detail elements - Video Newer:Lets Paint a Tire Pt.1Older:How to improve your digital sketches pt 3 PostedJanuary 22, 2015 AuthorMatt Kohr'''
