["http://www.ctrlpaint.com/videos/getting-organized-templates"]
title = "Getting Organized: Templates — Ctrl+Paint - Digital Painting Simplified"
description = "We all want to paint faster. &nbsp;In my experience, speed comes from an elimination of busy work - not flailing your stylus like a crazy person. &nbsp;Speed is spending time on creativity, and being efficient about the boring parts. &nbsp;Over the years I've designed systems to help sav"
