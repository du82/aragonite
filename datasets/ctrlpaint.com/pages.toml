["http://www.ctrlpaint.com/videos/08-prop-essence"]
title = "Playbook 08 - Prop Essence — Ctrl+Paint - Digital Painting Simplified"
description = "What can concept artists learn by simplifying an idea to its core?"
full_description = "Playbook 08 - Prop Essence Enjoy the videos and music you love, upload original content, and share it all with friends, family, and the world on YouTube. Art schools sometimes feature a department called ‘communication arts’. As a student, I found that descriptor a bit vague. What are they communicating? Why is that art? To my mind, the ‘real’ art disciplines were visual words like animation, sculpture, and painting. But in the years since graduation, I’ve gained an entirely new appreciation for art that communicates clearly. Concept art is, first and foremost, communication. While the game is in production, concept artists form a link between departments: converting the designers’ words into drawings & blueprints for the art team. After the game is complete, your designs communicate directly to the player. A red light might indicate ‘alert’, and a rickety rope bridge might signal danger. In many ways, learning to design means learning to communicate. For today’s homework you’re challenged to be concise. To craft a single phrase. Easy, right? In the video I’ll argue that a single, elegant, sentence requires much more work than a few meandering paragraphs. But I believe in you. Good luck! Download the homework Newer:Playbook 09 - Prop OptionsOlder:Playbook 07 - Prop Context PostedAugust 6, 2020 AuthorMatt Kohr"
