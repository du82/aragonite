title = "Why Practice in Grayscale? — Ctrl+Paint - Digital Painting Simplified"
description = "Learning art can seem like a bottomless pit of information.  To keep things simple, it's important to start your drawing and painting education in grayscale - and reserve color for later. Though it's tempting to move straight into color, this video provides an argument for working slowly and methodi"
full_description = "Why Practice in Grayscale? Many of my tutorials focus on painting without color. This is no accident. If you're just starting to digital paint, color makes matters more difficult. This... Learning art can seem like a bottomless pit of information. To keep things simple, it's important to start your drawing and painting education in grayscale - and reserve color for later. Though it's tempting to move straight into color, this video provides an argument for working slowly and methodically. After all, it's how they do it in art school.If this is a topic that you really believe in, and want to know more, make sure to check out the Basic Photoshop Rendering series in the store! When I created this series, it was my intent to capture my experience in Drawing 1 and apply it to digital painting. Newer:The Eyedropper Tool: In DepthOlder:Simplifying Form PostedJuly 14, 2011 AuthorMatt Kohr CategoriesDrawing Tagshomework, theory, Learning to Learn"
