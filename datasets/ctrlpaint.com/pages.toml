description = "Follow your gut.   Welcome to the Concept Art Playbook!  Today you’ll be designing an enemy, but the brief is intentionally vague.  With only a few bullet points to guide your design, Ryan’s left many details up to your imagination.  Does this amount of freedom excite you? Or do you prefer to work w"
full_description = "Playbook 01: Enemy Design download the homework here: https://www.ctrlpaint.com/s/playbook-01-homework.pdf Welcome to the Concept Art Playbook! This is a concept art tutorial series w... Follow your gut.Welcome to the Concept Art Playbook! Today you’ll be designing an enemy, but the brief is intentionally vague. With only a few bullet points to guide your design, Ryan’s left many details up to your imagination. Does this amount of freedom excite you? Or do you prefer to work within tighter restrictions? In the following lessons you’ll have much more specific instructions to tackle. Video games are made by teams, and collaboration poses unique challenges. These lessons place you in an ‘imaginary game studio’ where you’ll be given specific assignments, limitations, and functional requirements. You’re also practicing flexibility, reading comprehension, and working outside your comfort zone. If you’re self-taught, these skills might be new and intimidating. But that’s why you’re practicing them now, and not during your first week on the job. If you take these 30 assignments seriously, you’ll leave with an entirely new approach for making stuff look cool. And I think you’ll have a lot of fun, too. Download the homework Newer:Playbook 02: Enemy Design- revised briefOlder:Inside out Design PostedJuly 11, 2020 AuthorMatt Kohr"
