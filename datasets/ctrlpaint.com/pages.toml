title = "Playbook 02: Enemy Design- revised brief — Ctrl+Paint - Digital Painting Simplified"
description = "Time for a second draft   How did your first homework assignment go?&nbsp; Hopefully you’ve had a chance to complete it - because this lesson picks up where the last homework assignment left off.&nbsp; As a huge Netflix watcher, I’m no stranger to binging video content - but the ‘playbook’ i"
full_description = "Playbook 02: Enemy Design- revised brief Homework PDF: https://www.ctrlpaint.com/s/playbook-02-homework.pdf How did your first homework assignment go? Hopefully you've had a chance to complete it -... Time for a second draftHow did your first homework assignment go? Hopefully you’ve had a chance to complete it - because this lesson picks up where the last homework assignment left off. As a huge Netflix watcher, I’m no stranger to binging video content - but the ‘playbook’ is specially crafted to be interactive. You’ll get much more out of the experience by working through each assignment in order. After graduating art school, I was in the ‘linear’ head-space. Get homework, complete the homework, and review the homework on the critique wall. Then get a new piece of homework, and start all over. But in the working world, tasks don’t have such clean cycles. Sometimes it’s a personal revision: the art director asks for you to tweak something. But other times you’ll be faced with an unexpected change that’s out of your control.Today Ryan and I simulate the ‘updated brief’ experience. Since game studios are a collaborative environment, you’re constantly working on half-finished assets. In this case, Ryan’s added more details to the brief from last homework. As a concept artist working on a team, this is just part of the job. So let’s give it a try! Download the homework Newer:Playbook 03: Enemy Design- SynthesisOlder:Playbook 01: Enemy Design PostedJuly 16, 2020 AuthorMatt Kohr"
