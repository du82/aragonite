["http://www.ctrlpaint.com/videos/rotational-symmetry"]
title = "Rotational Symmetry — Ctrl+Paint - Digital Painting Simplified"
description = "Do you know how to paint a rotationally symmetrical design like the one pictured to the right? &nbsp;Perhaps. &nbsp;With pencil and tracing paper it's possible, but time consuming. &nbsp;In Photoshop, it's time consuming as well. &nbsp;Is there a better way?&nbsp;To give you a pe"
full_description = "Rotational Symmetry Do you know how to paint a rotationally symmetrical design like the one pictured to the right? Perhaps. With pencil and tracing paper it's possible, but time consuming. In Photoshop, it's time consuming as well. Is there a better way? To give you a peek into my concept art process, this three part mini-series shows an effective way to design rotationally symmetrical objects.It starts in sumopaint.com, which is a free website. This rare departure from Photoshop is all about design flow: SumoPaint automates the symmetry. Though the results are fluid, they're not pretty -- so we'll return to Photoshop for refinement in the next video. Newer:Rotational Symmetry Pt.2Older:Browse Multiple Sub-folders Simultaneously PostedJanuary 7, 2016 AuthorMatt Kohr"
