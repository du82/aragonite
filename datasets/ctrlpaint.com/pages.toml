full_description = '''Digital Realism Starter Kit Enjoy the videos and music you love, upload original content, and share it all with friends, family, and the world on YouTube. Practical steps for adding polish and detail to your paintings.Once you have a clear grasp of basic painting techniques, it can be tricky knowing how to proceed. How are those other artists making such realistic paintings? In many cases, you're seeing digital paintings subtly layered with photographic elements. The methods of adding detail might not feel much like traditional painting, but they offer huge potential. This collection helps you get started. The 6 included series have a total runtime of 367 minutes. Note: This is an intermediate level course, and is designed as a followup to the Digital Painting and Color starter kits. available now Video Previews Enjoy the videos and music you love, upload original content, and share it all with friends, family, and the world on YouTube. Enjoy the videos and music you love, upload original content, and share it all with friends, family, and the world on YouTube. Enjoy the videos and music you love, upload original content, and share it all with friends, family, and the world on YouTube. Enjoy the videos and music you love, upload original content, and share it all with friends, family, and the world on YouTube. Enjoy the videos and music you love, upload original content, and share it all with friends, family, and the world on YouTube. Enjoy the videos and music you love, upload original content, and share it all with friends, family, and the world on YouTube. Newer:Balancing Control and FluidityOlder:The "Beginner Study" PostedApril 26, 2017 AuthorMatt Kohr'''
