["https://www.ctrlpaint.com/about-contact"]
title = "About / Contact — Ctrl+Paint - Digital Painting Simplified"
full_description = '''Why Did I Create Ctrl+Paint?In short, because beginners need a good resource for digital painting. Strangely, the internet doesn't didn't have one to offer... so I made my own instread.I never planned on becoming a digital painting instructor. As a professional concept artist I’ve had the opportunity to learn a lot through ‘on the job experience’, and wanted to share it with beginners. Specifically, I think that beginners deserve higher quality video instruction than Youtube’s average: speed painting videos set to techno. With this in mind, Ctrl+Paint is my opportunity to provide art-school-style education to digital painters. About The AuthorI’m Matt Kohr, and drawing is my passion. It’s also my job. For art school I attended the Savannah College of Art and Design, and majored in Comic Books. Though I never intended to create comic books professionally, it was a great opportunity to practice drawing imaginary things. After working as a full-time concept artist on handful of console titles, I made the switch to freelancing. I’m also an avid gamer, and find great joy grinding in Japanese RPGs.Visit my Portfolio >>Free. No Ads.I set out to create a website that isn’t frustrating. Plain and simple. When I visit a site that’s supported by irrelevant advertising, it’s frustrating. Ctrl+Paint is created with the belief that people will pay for what they value – so if you've learned from the free content, help support the site by checking out the store.Have more questions? Visit the FAQ page >> Want to help?Since I don't pay for any advertising, I rely 100% on word of mouth. If you know someone that would enjoy the videos, please help spread the word:Tell your teachers.Tell your friends.Tweet about the site."Like" the site. ContactStill have a question or comment? Drop me a line at CtrlPaint (at) gmail (dot) com. I answer these emails personally, so make sure to check the FAQ first, and keep your email concise if possible.'''
