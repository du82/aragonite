title = "Anatomy: 3 Major Masses — Ctrl+Paint - Digital Painting Simplified"
full_description = 'Anatomy: 3 Major Masses Ctrl+Paint Store: http://ctrlpaint.myshopify.com/Full Free Video Library: http://www.ctrlpaint.com/library/note: This video was originally created for CtrlPa... In a previous video we talked about the simple stick figure for gesture drawing. If you want to capture a little more information about the pose, my next step is usually to include a simplified head, torso, and pelvis. When abstracting the body into simple shapes, there are many methods. This one stands out, to me, because it emphasizes the twisting motion that captures heart of every pose. In the past I said that the "S-curve" of the spine is essential, and the 3 major masses are simply an extension of that idea. Newer:Color PickersOlder:Perspective Grid Utility PostedNovember 20, 2012 AuthorMatt Kohr CategoriesDrawing Tagsanatomy, gesture'
