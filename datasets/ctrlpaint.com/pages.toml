description = '''Visit any large book store and the 'art technique' shelf will be filled with titles like "How to Draw ___ (dragons, zombies, vampires, cars, etc.)" -- this is deception. Instead of useful instruction, this is merely a scheme to sell books. Want to learn the real secret of how to draw anyth'''
full_description = '''How to Draw (Anything) in 3 Steps Enjoy the videos and music you love, upload original content, and share it all with friends, family, and the world on YouTube. Visit any large book store and the 'art technique' shelf will be filled with titles like "How to Draw ___ (dragons, zombies, vampires, cars, etc.)" -- this is deception. Instead of useful instruction, this is merely a scheme to sell books. Want to learn the real secret of how to draw anything? Observe, and practice. This video shows a versatile approach to learning any kind of new subject-matter. As you progress in your art career you'll find that drawing isn't a set of individual recipes, it's a single way of working. When I set out to draw a dragon I use the same techniques that I would use to draw a fire hydrant. Hopefully this video will empower you to tackle the subject matter your're having trouble with - and to ignore the "1,2,dragon" shelf at the book store. Newer:Studying GlossinessOlder:Ergonomics and Hardware PostedMay 23, 2011 AuthorMatt Kohr CategoriesDrawing Tagsinspiration, Creative Thinking, mindset, Learning to Learn, reference'''
