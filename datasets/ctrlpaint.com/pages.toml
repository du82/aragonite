full_description = '''Costume Reference I always use reference for my paintings. It's simply a matter of detail: there's too much stuff in this world to know about in detail, so I have to do a little visual research before I draw. Before the internet existed illustrators often kept "Morgue Files" or "Clipping Files" full of magazine photos. When an assignment came their way, they would go to their Morgue file and pull the appropriate images. Google image search and flickr have made the searching quite a bit easier, but the need is still exactly the same. In this video I'll explain how to create and manage a digital reference board - relying heavily on keyboard shortcuts. And if you like this video, please remember to click the "Like" button at the bottom of the post! The only advertising for Ctrl+Paint is word of mouth, so I'm counting on you guys to spread the word. Thanks! Assignment: Create career-specific reference boards (Scuba diver, fire-fighter, etc.)Things to consider: Well-lit photos, specific details Newer:Designing with ReferenceOlder:Straight Lines PostedJuly 30, 2012 AuthorMatt Kohr CategoriesDesign TagsUsing Reference, costume, character design, reference'''
