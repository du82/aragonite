description = "Today we'll finish painting the marble, moving from a graphic block-in to a rendered form. &nbsp;It's worth noting that this polishing process can takes hours or days, so don't be mislead by the brevity of this short video. &nbsp;Rendering takes time, don't rush.  The true takeaway from this"
full_description = "Let's Paint a Marble Pt.2 Enjoy the videos and music you love, upload original content, and share it all with friends, family, and the world on YouTube. Today we'll finish painting the marble, moving from a graphic block-in to a rendered form. It's worth noting that this polishing process can takes hours or days, so don't be mislead by the brevity of this short video. Rendering takes time, don't rush.The true takeaway from this video isn't Photoshop technique - it's visual simplification. The trick is to allow yourself to look past the details until you've successfully blocked in your image, and only then are you able to dig into the texture. If you're unfamiliar with any of the Photoshop tools or techniques used in the demonstration, make sure to follow the links to the right to learn more! Watch part 1 RELATED TECHNIQUES SHOWN IN THIS VIDEOObserving relative color Color observation game (an example exercise)Locked transparent pixelsCustom Brush DesignBlending method 1: the brush toolBlending method 2: the smudge tool Newer:Let's Paint a Rock Pt.1Older:Let's Paint a Marble Pt.1 PostedApril 9, 2015 AuthorMatt Kohr"
