["http://www.ctrlpaint.com/blog/the-importance-of-email"]
title = "The Importance of Email — Ctrl+Paint - Digital Painting Simplified"
description = "Writing is a topic I've never covered on Ctrl+Paint, but it's time to broach the subject. &nbsp;I hope you won't be mad when I tell you that your writing could be... better. &nbsp;Based on the thousands of emails I've&nbsp;received&nbsp;from Ctrl+Paint readers it's safe to generalize"
full_description = "The Importance of Email Enjoy the videos and music you love, upload original content, and share it all with friends, family, and the world on YouTube. Writing is a topic I've never covered on Ctrl+Paint, but it's time to broach the subject. I hope you won't be mad when I tell you that your writing could be... better. Based on the thousands of emails I've received from Ctrl+Paint readers it's safe to generalize: you guys aren't prioritizing writing. I'm not telling you this as an insult, but because you probably won't hear it from employers. Since we are all competing for attention, your skill with words is nearly as important as your skill with a paintbrush. This video explores the art of writing email. The importance of structure, editing, and most importantly brevity are often overlooked by 'visual communicators', but it's worth your while to practice these skills. When in doubt, say less.​​ Back to top | RSS | Blog Home Newer:Start AnywhereOlder:Where to Find Reference PostedApril 11, 2013 AuthorMatt Kohr"
