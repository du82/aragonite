full_description = '''Let's Paint a Tea Kettle Pt.3 Starting with our clean linework from the previous video, today we'll begin to add color to our tea kettle. This demonstration takes a different approach tha... Starting with our clean linework from the previous video, today we'll begin to add color to our tea kettle. This demonstration takes a different approach than we saw in the spatula example - the color begins with vector shapes instead of painted brush strokes. Even if you don't prefer working with vector shapes, the point of this video is that "Digital Painting" takes many forms. Especially if you come from a traditional art background, I strongly encourage you to approach Photoshop with an open mind. Vector shapes might not feel like 'painting' to you, but give them a chance. You might be surprised! Watch part 1 Watch Part 2 RELATED TECHNIQUES SHOWN IN THIS VIDEOAlternate technique - paint a spatulaPen tool basicsUsing the pen tool to define the silhouette shapeCreating a masked layer group to paint inside the linesAdding color with vector shapes - car tire example"Lock transparent pixels" before painting details Newer:Let's Paint a Marble Pt.1Older:Let's Paint a Tea Kettle Pt.2 PostedMarch 26, 2015 AuthorMatt Kohr'''
