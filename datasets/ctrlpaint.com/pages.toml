description = "NEXT STEPS  Congratulations on completing Digital Painting 101! &nbsp;Since I don’t know you, or your history with art, I’ve laid out two recommendations for your next step. &nbsp;If you already have experience drawing or painting, and you just want to learn digital painting, I’ll direct you"
full_description = "Moving Forward Now that you've taken your first steps in digital painting, what should you learn next? This gives an overview of my other free videos, and what you might ta... NEXT STEPSCongratulations on completing Digital Painting 101! Since I don’t know you, or your history with art, I’ve laid out two recommendations for your next step. If you already have experience drawing or painting, and you just want to learn digital painting, I’ll direct you to the “Let’s Paint” videos (process demonstrations). These give a high level overview of the painting process, including many different approaches. If you don’t have any experience drawing or painting, I recommend starting in section 2 of the free library: Traditional Drawing. These videos are a nice primer on the concepts of pencil drawing from observation. I can’t overstate how important these skills are - and how much easier they make digital painting. In truth, Ctrl+Paint only offers a primer on basic drawing - I encourage you to go to the local library, or sites like Proko.com to learn this skill in-depth. Two Recommendations:1) If you're comfortable with traditional media, I recommend the digital Process Demonstrations.2) If you're just starting out with art, I always encourage the Traditional Drawing section of my free library first. previous Newer:Blending PaintOlder:What is Digital Painting? PostedJuly 7, 2016 AuthorMatt Kohr"
