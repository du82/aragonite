full_description = '''Designing with Reference Have you gathered some reference materials? This video demonstrates how you might use it in your illustration. Ctrl+Paint Store: http://ctrlpaint.myshopify.c... In the last assignment you gathered costume reference for real-world professions. Now it's time to have some fun with that visual research! I've provided you some mannequin drawings to use as the foundation for character designs. Your goal is to make a few designs that would actually fit into a modern context. I don't want to see any space marines -- just real world professions. Think it's easy to draw a police officer? How about a fire fighter? Now is your chance to find out. As an illustrator or concept artist you'll need to draw things like this surprisingly often. Additionally, they help build your visual library for costuming and will improve your ability to generate sci-fi and fantasy characters. Good luck! And if you like this video, please remember to click the “Like” button at the bottom of the post! The only advertising for Ctrl+Paint is word of mouth, so I’m counting on you guys to spread the word. Thanks!Assignment: Create realistic character designs (from reference)Things to consider: Use specific details, "dress your model"Recommended videos:Costume Reference, Costume SketchingWorksheet Downloads:Basic Male Figures Newer:Perspective SketchingOlder:Costume Reference PostedAugust 2, 2012 AuthorMatt Kohr CategoriesDesign Tagscostume, character design'''
