["http://www.ctrlpaint.com/videos/applying-decals-using-the-warp-tool"]
title = "Applying Decals Using the Warp Tool — Ctrl+Paint - Digital Painting Simplified"
full_description = "Applying Decals Using the Warp Tool Adding details like text and graphics on curved surfaces might seem like a challenge - but the warp tool makes it extremely easy. This digital painting tutor... Painting is often best done from simple to complex. This methodology certainly applies to situations where you are painting surfaces with 2D decals like an emblem on armor. A traditional painter might first paint the base surface, and then once the paint dries would be able to paint the 2D decal over top. In this video I'll explore a digital approach to this task. Unlike the traditional process, Photoshop allows us to prepare the 2D image as a flat decal and then distort it into place to match the illustration. You can use this same technique to apply existing images such as logos, or 2D images of your own. Newer:Painting Details Using Two WindowsOlder:Creating a Reminder Layer Action PostedMarch 22, 2011 AuthorMatt Kohr CategoriesStrictly Digital, Painting Tagssurface, texture, layer, warp tool, efficiency"
