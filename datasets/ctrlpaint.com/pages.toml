full_description = "Photoshop's Modular UI Now that you've seen some useful Photoshop panels, it's time to see how they snap together. Over the years Adobe has done a great job allowing the user to ta... Now that you’ve seen some useful Photoshop panels, it’s time to see how they snap together. Over the years Adobe has done a great job allowing the user to tailor their workspace, and one of my favorite aspects is the modular snapping system. Whether you want to use tabbed panels, full-height columns, split vertical layouts… it’s all simple and clean. In this video I’ll show how to use the tools, and you’ll be up and running in no time! Afterwards, I encourage you to pick an aspect of your workflow that could benefit from unique tools - and design your very own workspace. I’ll be doing the exact same thing between now and next video, so stay tuned to see how mine turned out! Newer:My Color Grading WorkspaceOlder:Plugins and Extensions PostedMarch 3, 2016 AuthorMatt Kohr"
