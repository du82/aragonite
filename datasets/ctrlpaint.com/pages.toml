["https://ctrlpaint.com/videos/07-prop-context"]
title = "Playbook 07 - Prop Context — Ctrl+Paint - Digital Painting Simplified"
description = """
To improve our designs, what can a concept artist learn from an object's 
surroundings?"""
full_description = "Playbook 07 - Prop Context Enjoy the videos and music you love, upload original content, and share it all with friends, family, and the world on YouTube. Context is a powerful word. There’s no perfect car for everyone: your region’s weather & geography has a huge impact on which considerations you make at the dealership. To understand a political or cultural issue, we need to know the related facts. In short: nothing exists in a vacuum.A common misconception about concept art is that brilliant artists begin with a blank canvas, and fill the page through some sort of magical creative energy. In my experience, concept art is much more reactionary. A prop or vehicle design is the product of its surroundings. A snowy level would merit a chunky 4x4, but a highway chase would work better with a low slung sports car. The context matters. Today’s challenge has you examining a game object through the lens of ‘context’. By learning to see an object relative to its surroundings, you’re beginning to think like a designer. Download the homework Newer:Playbook 08 - Prop Essence Older:Playbook 06 - Iconic Design PostedAugust 4, 2020 AuthorMatt Kohr"
