["http://ctrlpaint.com/blog"]
title = "Blog — Ctrl+Paint - Digital Painting Simplified"
full_description = '''June Update Hey guys! This week I want to update you on my upcoming plans for the site. As of this month I've decided to leave my job as a full-time concept artist, and to focus much more of my energy on creating content for Ctrl+Paint. I'm very excited about the changes, and am happy to finally share them with you. Here's what's in store: New Free VideosEach Thursday, in place of the written blog posts, I'll be releasing new free videos. They'll be very visible on the front page of the site, but will also be added into the recommended viewing order of the library. I've learned a lot since completing the library, so it's time to flesh out some of the sections.Critique Mini-SeriesAs a longer-term plan, I'm creating a mini-series about critique. At art school, we spent a lot of time at the critique wall. As in... a real lot. It's certainly a subject worth adding to the Ctrl+Paint library. To do this, I'll need art submissions from you guys. If you'd like to get feedback about your work and help me out with this important mini-series, get the details here.Community FeedbackI'd love to hear from you! To offer your opinions, there are a number of short surveys available - allowing you to help direct future site content. Is there a question you've been looking to ask? Let's hear it! Here are the currently available surveys: - Mac or PC? A few questions about hardware and software- Video Topic SuggestionsNew Premium Videos Coming to the StoreWhile working in the game studio, I've been slowly adding 'cool video ideas' to a list. Now that I've got the time to dedicate to it, I think you'll be happy about the upcoming releases for the store. Back to top | RSS | Blog Home PostedJune 26, 2014 AuthorMatt Kohr 56 CommentsPost a comment Beyond the Comfort Zone If you have access to Netflix or Netflix streaming, this week's homework is simple: watch the documentary "Tiny". Though the movie focuses on a man building his own 200 sq. ft. house from scratch, it's his approach that really had an effect on me. If you're feeling overwhelmed by learning to paint, or it seems the odds are stacked against you , "Tiny" is the perfect remedy.The SetupChristopher wanted to build his own house. He made this decision based on passion and determination, but very little else. Setting aside a single summer for his project, he aimed to create a ~200 sq. ft. 'tiny house' with no savings or construction experience. My initial reaction to his plan was "this guy's an idiot". Regardless of my apprehension, Christopher buys a stack of lumber and a trailer - and the project begins.The Learning Process Without any teachers or guides, Christopher needed to teach himself all of the necessary skills to tackle his challenge. The initial plan was cobbled together from information found on blogs, and everything else was a matter of 'learning on the job'. Electrical work? No problem, there's a YouTube video for that. It's impossible not to smile while christopher follows youtube instructions on his phone- snipping wires and plumbing his tiny house in the Colorado countryside. Christopher's true skill wasn't excellent carpentry, but a willingness to learn. Each roadblock required him to slow down, learn a new skill, or invent his own solution.Then Things Go WrongWhen it's clear that three months isn't going to be enough time, the project takes on a very different tone. The weather gets bad, his money runs out, and everything stops being fun. But he doesn't give up. Through a combination of determination and creativity, Christopher manages to finish the house. It took a year to do it, but it worked. What's Your "Tiny House"?If you're learning to digital paint, it's a long and hard road. You probably won't have a teacher, and won't have the ideal tools. When roadblocks happen, you probably won't have a mentor to guide or comfort you. It's unlikely that you'll be ready to submit your portfolio professionally as soon as you'd like. You'll have hundreds of 'bad drawing days' along the way. The big question, though, is "will you give up?" Like building a house with your bare hands, art isn't easy - but it's absolutely worth the hard work. What are you waiting for? Back to top | RSS | Blog Home PostedJune 19, 2014 AuthorMatt Kohr 19 CommentsPost a comment'''
