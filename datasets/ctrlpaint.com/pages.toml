full_description = "Color Enjoy the videos and music you love, upload original content, and share it all with friends, family, and the world on YouTube. COLOR Another essential part of the brush tool is the active color. In digital painting you generally don’t have to worry about mixing colors on a palette, reloading paint, or cleaning your brush. In Photoshop you just need to learn a few helpful keyboard shortcuts, and then you’re on your way! One bit of advice: make a custom keyboard shortcut for “foreground color picker”. You’ll use it constantly, so pick some key that’s nearby your left finger tips. Tools in this videoMatching / Sampling Colors: Alt with Brush tool active (option on mac)Color Picker Window: No default, make your own! (it’s called the ‘foreground color picker)Toggle Foreground and Background color: X next previous Newer:Brush+EraserOlder:Blending Paint PostedJuly 10, 2016 AuthorMatt Kohr"
