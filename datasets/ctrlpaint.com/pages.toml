["http://ctrlpaint.com/blog/when-feet-are-greater-than-hands"]
title = "When Feet are Greater Than Hands — Ctrl+Paint - Digital Painting Simplified"
description = "This week’s blog post is a field trip. &nbsp;Yours will be different than mine, but they’ll have one thing in common: we’ll walk for 8 minutes. &nbsp;Before we start, though, let’s explore the important power you’re about to unleash."
full_description = "When Feet are Greater Than Hands This week’s blog post is a field trip. Yours will be different than mine, but they’ll have one thing in common: we’ll walk for 8 minutes. Before we start, though, let’s explore the important power you’re about to unleash. Creative JuicesYou’ve undoubtedly heard stories of writers, musicians, and philosophers taking long strolls through the countryside. Recently scientists have begun exploring this anecdotal link between creative thinking and walking. According to a recent Stanford study, researchers proved that 8 minutes of walking is enough to jumpstart creative thinking. Even on a treadmill in an intentionally boring room, walking 8 minutes yields a significant improvement in our ability to think creatively. I’m sure you’ve experienced this yourself - we’ve all had big ideas while strolling in the park, or walking to the bus. Ctrl+Paint has offered a variety of creative exercises over the years such as “draw 100”, but today’s is much easier: just walk. Go, NowI said today’s post is a field trip, and I meant it. Instead of spending the next few minutes reading a glowing screen, I’m assigning a walking homework assignment. Get up out of your chair, walk out the door, and spend at least 8 minutes walking about. Seriously. I don’t care if you’re walking laps around the office hallways or strolling through a public park. According to the study, it doesn’t really matter. Regardless of your current situation, I know you’ve got 8 minutes to spare - so go for a walk! Back to top | RSS | Blog Home Newer:The Beauty of TemplatesOlder:Unexpected Breakthroughs PostedApril 30, 2014 AuthorMatt Kohr"
