["http://www.ctrlpaint.com/videos/05-household-object"]
title = "Playbook 05: Household Object — Ctrl+Paint - Digital Painting Simplified"
description = "What can concept artists learn by studying everyday objects?"
full_description = "Playbook 05: Household Object Enjoy the videos and music you love, upload original content, and share it all with friends, family, and the world on YouTube. Today we’re exploring an essential aspect of design: cause & effect relationships. Design is a balancing act. By making something taller, you might run into issues with low-hanging branches. Shrink that object to avoid the branches, and it might be hard to see at a distance. As you improve your design skills, you’ll find yourself constantly asking the question ‘what would happen if…?’ To simplify the homework assignment, we’ll be studying a household object. Even though it’s not as exciting as a bazooka from a video game, you are way more familiar with your toaster, lamp, or kettle. Today we’ll use that familiarity to help hone your ‘cause and effect’ investigating techniques. Over time, this process will be constantly active while you’re designing. Truly, ‘questioning’ is the default state for concept artists and designers. But this doesn’t come natural to everyone, so today’s homework eases you into the mindset. Download the homework Newer:Playbook 06 - Iconic DesignOlder:Playbook 04: Enemy Design- Curve Ball! PostedJuly 28, 2020 AuthorMatt Kohr"
