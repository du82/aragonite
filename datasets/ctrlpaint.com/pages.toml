full_description = "My Color Grading Workspace As I showed in the previous videos, we have a lot of options when it comes to customizing Photoshop workspaces. Once you understand the rules, the question b... As I showed in the previous videos, we have a lot of options when it comes to customizing Photoshop workspaces. Once you understand the rules, the question becomes ‘what tools do I need for my process?’. There is no one-size-fits-all solution, so I can’t prescribe a perfect layout. In this video my challenge was to dissect one aspect of my process, and to give it a tailored workspace. I chose ‘color grading’, which is a short but crucial phase in my painting process. As you’ll see, color grading requires many more panels than I generally have on-screen - which is a bit overwhelming at first. But it’s a great example of conditional tools: they’re only on-screen when I need them, and hidden the rest of the time. But this is just my example, what workspace will you design? Newer:Gesture Drawing with SketchfabOlder:Photoshop's Modular UI PostedMarch 10, 2016 AuthorMatt Kohr"
