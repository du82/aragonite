title = "Playbook 06 - Iconic Design — Ctrl+Paint - Digital Painting Simplified"
description = "What can concept artists learn from classic game objects?"
full_description = "Playbook 06 - Iconic Design Enjoy the videos and music you love, upload original content, and share it all with friends, family, and the world on YouTube. Study the greatsIn this challenge you’ll repeat the previous assignment, but with an object from a video game. The goal here is to start thinking of game objects holistically, not just as a 3d shape, symbol, or graphic. These objects are fundamentally interactive, which makes them more like objects we live with than art we look at. By examining a simple object in a favorite game, you’re switching from game ‘player’ to game ‘investigator’. An ammo crate you’ve seen 100 times might reveal something totally new. That’s the great thing about design: it’s often meant to fade into the background. If the object didn’t distract your attention, it was all the more successful! Download the homework Newer:Playbook 07 - Prop ContextOlder:Playbook 05: Household Object PostedJuly 30, 2020 AuthorMatt Kohr"
