["http://www.ctrlpaint.com/videos/form-not-shape"]
title = "Form, Not Shape — Ctrl+Paint - Digital Painting Simplified"
full_description = '''Form, Not Shape It's really hard to break the habit of focusing on an object's outline. We've learned to imagine shapes from the time we were small children. But one of th... We're trained as children to think in terms of 'shape'. This is one of the things you have to overcome when learning to be an artist. Seeing shape is fine for some things, but observed drawing is best done in terms of form instead of shape. Shape is a 2D abstraction, form is seeing in 3d - with depth and volume. To finish out perspective week this video provides an exercise to help you envision form. All you need to do is go find some cool pictures of bugs! And if you like this video, please remember to click the "Like" button at the bottom of the post! The only advertising for Ctrl+Paint is word of mouth, so I'm counting on you guys to spread the word. Thanks! Assignment: Overlay form lines onto photos of interesting bugs.Things to consider: Draw through the object, envision the structure. Newer:Avoiding Visual TangentsOlder:Horizon Line and Viewpoint PostedAugust 8, 2012 AuthorMatt Kohr CategoriesDrawing Tagscharacter design, constructive form'''
