title = "Creating a Reminder Layer Action — Ctrl+Paint - Digital Painting Simplified"
description = "Have you ever gotten lost in a tall stack of unnamed Photoshop layers? Naming your layers may be the  proper  way to stay organized, but it is extremely time consuming. This video offers a time-saving compromise. Even though I don't name my layers, there are certain ones that I don't want to lose tr"
full_description = "Creating a Reminder Layer Action For additional free videos, custom brushes, worksheets and more more check out www.ctrlpaint.com Have you ever gotten lost in a tall stack of unnamed Photoshop layers? Naming your layers may be the proper way to stay organized, but it is extremely time consuming. This video offers a time-saving compromise. Even though I don't name my layers, there are certain ones that I don't want to lose track of - and a bit of color-coding does the trick. There are multiple ways to change the color coding of a layer in the stack, but this video shows how to use a Photoshop Action to accomplish it. I especially like Photoshop actions because they allow me to keep my stylus in the center of my painting, and to trigger commands with my left hand. Newer:Applying Decals Using the Warp ToolOlder:Making selections with the Pen tool (Part 2) PostedMarch 17, 2011 AuthorMatt Kohr CategoriesStrictly Digital Tagskeyboard shortcut, layer, efficiency, Photoshop Efficiency, photoshop, photoshop action"
