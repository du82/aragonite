["http://www.ctrlpaint.com/videos/reintroducing-the-still-life"]
title = "Reintroducing the Still Life — Ctrl+Paint - Digital Painting Simplified"
full_description = "Reintroducing the Still Life You might think of still life drawing as old fashioned and boring. But I see it differently. Used as a practice technique, still life drawing can be the lase... What's your relationship with still life drawing? Love it? Cherish it? Most likely, you avoid it. In this video I provide my reasons for practicing still life painting, including how it makes me a better artist overall. Many artists, especially beginners, avoid them because of their association with homework. When I was in Drawing 1 class in art school I daydreamed of painting dragons and space marines. Now that I'm out of college, I often look back with regret: those still life drawings were forming a foundation and all I wanted to do was skip past them. As you teach yourself to paint, it's easy to skip past assignments that seem boring but I encourage you to give still life drawing a chance. Newer:Building A Texture LibraryOlder:Visual Measuring: Proportion PostedJanuary 1, 2013 AuthorMatt Kohr CategoriesDrawing"
