["http://www.ctrlpaint.com/digital-painting-101/quick-demo"]
title = "Quick Demo — Ctrl+Paint - Digital Painting Simplified"
description = "Demo  Before you open up any software, or get out a sketch book, I want to do a quick demonstration. &nbsp;As I paint the spaceship, I want you to notice where Photoshop painting is similar to traditional art, and where it’s uniquely digital. &nbsp;Many artists approach digital painting with"
full_description = "Quick Demo This short video summarizes the digital painting process. Want to dive deeper? Stick around for more videos! Ctrl+Paint Store: http://ctrlpaint.myshopify.com... DemoBefore you open up any software, or get out a sketch book, I want to do a quick demonstration. As I paint the spaceship, I want you to notice where Photoshop painting is similar to traditional art, and where it’s uniquely digital. Many artists approach digital painting with the same techniques they would use on a canvas, but here rules are are totally different. “Digital Painting” is equal parts drawing, collage, painting, photo-editing, and re-mixing. If you approach your learning process with an open mind, you’ll be able to take full advantage of this unusual set of tools. So sit back, don’t worry about taking notes, and I’ll show you what’s possible in digital painting. Digital Painting 101 Previous Newer:What is Digital Painting? PostedJuly 5, 2016 AuthorMatt Kohr"
