["https://ctrlpaint.com/blog/info-about-logging-in"]
title = "Info about Logging In — Ctrl+Paint - Digital Painting Simplified"
description = "New hosting, new log-in system   With this new re-design, all of the old login usernames / passwords have been removed. &nbsp;If you've ever been able to log-in to Ctrl+Paint for commenting (or for the old Forum), that &nbsp;user name will no longer work. &nbsp;I'm sorry this happened wi"
full_description = "Info about Logging In New hosting, new log-in system With this new re-design, all of the old login usernames / passwords have been removed. If you've ever been able to log-in to Ctrl+Paint for commenting (or for the old Forum), that user name will no longer work. I'm sorry this happened without warning, but for technical reasons I wasn't able to transfer these credentials. Most of the comments were migrated from the previous site, though, so that's good news! What does the new log-in allow me to do? It's just for commenting. When you post a comment on one of the videos or blog posts, you'll see a picture like the one to the right. If you don't want to log in, you're more than welcome to post as a guest. If you do log in, you'll need to choose one of the portals; they're pretty self explanatory, but I'll clarify a few things:Squarespace: If you happen to have a squarespace website, you can log-in with this information. If you don't, you're not missing out on anything. Twitter / Facebook / Google: These log in profiles do not automatically tweet / update facebook / or comment in Google+. All they do is use your name and avatar from the service. (You don't need to worry about spamming your followers) What happens when I see the big black screen with a 6 on it?It means you hit 'esc' on your keyboard. The screen is only for my personal log-in, and has no use to general readers. Why don't I just get rid of it? Because I can't. It's extremely frustrating that my host won't allow me to remove this functionality... but, that's how it goes. So if you see the big black six, just hit 'esc' a second time and you'll go back to the page you were on. Sorry for the hassle! Back to top | RSS | Blog Home Newer:Welcome to Ctrl+Paint 3 PostedFebruary 11, 2013 AuthorMatt Kohr"
