full_description = '''let's Paint Missiles Pt.1 In this process demonstration I'll show you an approach to painting industrial subject-matter. This missile platform poses a particular challenge: there are ... In this process demonstration I'll show you an approach to painting industrial subject-matter. This missile platform poses a particular challenge: there are a lot of missiles. Though you might be tempted to paint one complete missile and then make copies, I demonstrate a better alternative. Like all of the "Let's Paint" videos, I don't go into much depth on the individual techniques shown in this video. Instead, I've linked other videos which elaborate on these unfamiliar concepts. Have fun!Note: I'm not advocating war with this demonstration. Missiles are a sad reality of modern life, but more importantly -- are prominently featured in contemporary video games. Watch part 2 RELATED TECHNIQUES SHOWN IN THIS VIDEOPreparing Your Scanned Line DrawingCreate a Selection With the Pen ToolMasking a Layer GroupPainting With 'Temp Layers'The Rotate Canvas ToolThe Digital Painting Starter Kit Newer:Let's Paint Missiles Pt.2Older:Let's Paint a Tire Pt.2 PostedFebruary 12, 2015 AuthorMatt Kohr'''
