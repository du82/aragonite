full_description = "2018 Update Sometimes you just need to recharge your creative batteries. I’ve spent the last year working on an unannounced game, challenging myself to expand my tools and techniques, and discovering fun new resources. With renewed excitement, I’ve got a long list of topics to share with you - and tons of new free videos on the way! The “Designed To Work” series of free videos will explore the act of design: Where ideas come, how to create with intention, and how to beat ‘creative block’. Additionally, it’s my first opportunity to offer a peek into the life of a video game concept artist - creating artwork for a fake video game to demonstrate these techniques.Lastly, I want to thank the longtime community. You’ve been a huge motivator for me to leap back into video-making. Thanks for your patience and support! Let’s have fun painting. After some creative recharging, I’m so happy to be back. Newer:Aesthetic ConsiderationsOlder:Black & White Photo Studies PostedNovember 8, 2018 AuthorMatt Kohr"
