full_description = "The Gnomon Workshop I was first introduced to the Gnomon Workshopback in college with a Feng Zhu video and I've been hooked ever since. One of my primary goals with Ctrl+Paint is to create a good entry point to learn digital painting. Eventually, though, you'll want to branch out into specific subjects that I can't hope to instruct. Whether it's sculpting, story-boarding, 3D modeling, or industrial design, the Gnomon Workshop has a DVD about it. If you've never seen the site before, it's worth a look. If you want more recommendations for books and websites, make sure to check out the Ctrl+Paint Resources page! Newer:Skin Tone Gradient Pt.1Older:Color Contrast PostedOctober 24, 2012 AuthorMatt Kohr CategoriesDesign"
