title = "Playbook 04: Enemy Design- Curve Ball! — Ctrl+Paint - Digital Painting Simplified"
description = "What happens to your design when there's a surprise change of plans?  This episode of the Concept Art Playbook is all about flexibility."
full_description = "Playbook 04: Enemy Design- Curve Ball! homework: https://www.ctrlpaint.com/s/playbook-04-homework.pdf No one likes inconvenient surprises. We had a plan: read the brief, make a design, call it 'co... “We just heard back from the designers. There’s been some updates.”-Your bossNo one likes inconvenient surprises. We had a plan: read the brief, make a design, call it ‘complete’. But design is inherently collaborative work, which means plans are always subject to change. Today’s challenge introduces a new variable to the enemy design you’ve been working on. Sometimes an update is minor, while other curve-balls might require you to re-start a project from the beginning. This is ok. It’s not the end of the world. Drawing & painting are important skills for concept artists, but so is flexibility. Emotional resilience, or ‘thick skin’, makes collaborative teamwork much easier. Though today’s video can’t replace an in-person experience, my hope is to simulate this inescapable element of game studio life. When faced with some new updates from your teammates, the correct answer is: “Sounds good, I’ll get to work on my revision!” Download the homework Newer:Playbook 05: Household ObjectOlder:Playbook 03: Enemy Design- Synthesis PostedJuly 23, 2020 AuthorMatt Kohr"
