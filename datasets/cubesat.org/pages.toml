full_description = "Resources CubeSat Information Collaborate Suppliers Supplier Descriptions Mailing List Contact Us WorkshopsWorkshops allow CubeSat developers to come together to share ideas and their own personal experiences in developing picosatellites. Other topics that are covered relate to the status and availability of launch vehicles, new technology, increasing community communication, etc... The workshops are provide valuable insight to new and old participants of the CubeSat Community.If you would like to receive information regarding upcoming CubeSat Workshops please sign up for the mailing list located here. The workshop archive contains presentation PDF's and some video where available for Cal Poly-run workshops including the CubeSat Developers Workshop and the SmallSat Summer CubeSat Workshop. Videos of the previous CubeSat Developers Workshop can be found on CPCL’s CubeSat YouTube channel.Visit cubesatdw.org for more information on the CubeSat Developers Workshop. Workshop Archive YouTube Channel Search the workshop archive: (function() { var cx = '014703270602700955650:tp5u4iqbk8o'; var gcse = document.createElement('script'); gcse.type = 'text/javascript'; gcse.async = true; gcse.src = (document.location.protocol == 'https:' ? 'https:' : 'http:') + '//cse.google.com/cse.js?cx=' + cx; var s = document.getElementsByTagName('script')[0]; s.parentNode.insertBefore(gcse, s); })();"
