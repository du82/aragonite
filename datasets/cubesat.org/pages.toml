full_description = "Cal Poly CubeSat December 8, 2010 Falcon 9 Dragon Launch 2010 Cal Poly CubeSat December 8, 2010 Launch Vehicle:Falcon 9 Launch Site:Cape Canaveral Air Force Station, FL Launch Time:December 8, 2010 - 15:43 UTCSpaceX made history on December 8, 2010 as the first commercial company to re-enter a spacecraft from orbiting the Earth. It was also a big day for the CubeSat community - the Falcon 9's second stage carried up six P-PODs along with the Dragon spacecraft (three of which can be seen in the images below). Later view of Dragon separation from second stage Dragon capsule is now fully separated from the second stage Dragon capsule moves further away (visible P-PODs are boxed in red)"
