full_description = 'Cal Poly CubeSat November 5, 2015 ELaNA-7 Super Strypi Launch 2015 Cal Poly CubeSat November 5, 2015 View fullsize LAUNCH VEHICLE:Super Strypi LAUNCH SITE:US Navy Pacific Missile Range, Barking Sands, HI LAUNCH TIME:November 5th, 2015 - 03:45 UTC PRIMARY PAYLOAD:HiakaSat NUMBER OF CUBESATS:12 .tg {border-collapse:collapse;border-spacing:0;} .tg td{font-family:Helvetica, sans-serif;font-size:14px;padding:10px 10px;border-style:solid;border-width:1px;overflow:hidden;word-break:normal;} .tg th{font-family:Helvetica, sans-serif;font-size:14px;font-weight:normal;padding:10px 5px;border-style:solid;border-width:1px;overflow:hidden;word-break:normal;} .tg .tg-2e9h{font-weight:bold;text-decoration:underline} .tg .tg-e3zv{font-weight:bold} Slot Satellite Name Organization Size Beacon Details More Info 1a EDSN 1 NASA Ames 1.5U x 8 EDSN (Edison Demonstration for SmallSat Networks 437.05 - 437.15 MHz, 1200 bps AFSK AX.25, 1W, Call sign KE6QLL, all spacecraft have identical radios 60 seconds/8 spacecraft= 7.5 second spacing between spacecraft Each spacecraft will have a custom offset so that all 8 spacecraft transmissions are evenly spaced 60 seconds between packets during all activities after first science measurement, 120 seconds between packets during detumble / first magnetic alignment (first 31 hours of mission) All spacecraft will have a common period between beacon packet transmissions Crosslinks activities last up to 45 minute, four times a day, beaconing restarts after crosslink is complete, beacons turn off during crosslinks Each of the eight EDSN spacecraft will transmit beacon packets during all phases of the mission More Info 1B EDSN 2 More Info 2A EDSN 5 More Info 2B EDSN 6 More Info 3A EDSN 7 More Info 3B EDSN 8 More Info 4A EDSN 3 More Info 4B EDSN 4 More Info 5A SLU-02 Argus Saint Louis University and Vanderbilt University 2U 437.290 MHz, AX.25 UNPROTO packets, Callsign ARGUS1. Beacon will go every 10 seconds, nominally. More Info 5B PrintSat