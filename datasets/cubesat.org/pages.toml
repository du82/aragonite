["https://cubesat.org/past-launches/2015/6/22/minotaur-i-launch-2007"]
title = "Minotaur I TacSat-2 Launch 2006 — CubeSat"
description = "NASA's GeneSat-1 is a 3-U CubeSat designed and built by a NASA Ames team. The satellite is the first CubeSat to carry a biological payload into space. Utilizing a special fluidics card and a 2.4 Ghz communications system, GeneSat-1 is pushing the limits in the miniturization of satellite technology."
full_description = "Cal Poly CubeSat December 16, 2006 Minotaur I TacSat-2 Launch 2006 Cal Poly CubeSat December 16, 2006 NASA's GeneSat-1 is a 3-U CubeSat designed and built by a NASA Ames team. The satellite is the first CubeSat to carry a biological payload into space. Utilizing a special fluidics card and a 2.4 Ghz communications system, GeneSat-1 is pushing the limits in the miniturization of satellite technology. GeneSat-1 is being delivered into a LEO orbit with TacSat-2 an AFRL project. For University involvement, Santa Clara University will be providing the on-orbit controls for the satellite and GeneSat is utilizing a California Polytechnic P-POD for their orbital delivery system. The launch was an overwhelming success, meeting all mission success requirements. LAUNCH DATE:December 16th, 2006 - 12:00 UTC ORBIT PARAMETERS:LEO OrbitAltitude: 440 kmOrigination: Wallops Launch Facility, VA Click here for more information about the GeneSat Project"
