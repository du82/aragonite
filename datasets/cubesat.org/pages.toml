full_description = '''Cal Poly CubeSat December 6, 2013 Atlas V GEMSat Launch 2013 Cal Poly CubeSat December 6, 2013 <img src="https://images.squarespace-cdn.com/content/v1/5418c831e4b0fa4ecac1bacd/1435007572592-6NXG8G5Z517ZUCNRA1KM/nrol39.jpg" alt="nrol39.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5418c831e4b0fa4ecac1bacd/1435007570777-LE83SQWELT9CVLZC4A0F/alice.jpg" alt="alice.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5418c831e4b0fa4ecac1bacd/1435007570873-UODRA53UD6R1BKB6RMEF/cunysat.jpg" alt="cunysat.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5418c831e4b0fa4ecac1bacd/1435007571029-MYH3NPRG2FLVEFKV2JB9/firebird.jpg" alt="firebird.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5418c831e4b0fa4ecac1bacd/1435007572145-1O4LLWFA2Z0RUL3ZSUXL/gemsat_group_photo.jpg" alt="gemsat_group_photo.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5418c831e4b0fa4ecac1bacd/1435007571370-3ZUSTO4FVN6ET92X6154/ipex.jpg" alt="ipex.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5418c831e4b0fa4ecac1bacd/1435007571717-ROS4PQZ1U3Q3RNOVPF45/mcubed-2+%281%29.jpg" alt="mcubed-2 (1).jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5418c831e4b0fa4ecac1bacd/1435007572257-KZ6EABEIXIAXE7Y5GNOF/mcubed-2.jpg" alt="mcubed-2.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5418c831e4b0fa4ecac1bacd/1435007572529-6NYAC5PRVGM3B6A7NZMC/smdc+%281%29.jpg" alt="smdc (1).jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5418c831e4b0fa4ecac1bacd/1435007572733-M0G9QJ3KI3G6QMZFG3SI/smdc.jpg" alt="smdc.jpg" /> <img src="https://images.squarespace-cdn.com/content/v1/5418c831e4b0fa4ecac1bacd/1435007572802-GE8GDMBDG4ZXATT3W2VD/snap.jpg" alt="snap.jpg" /> LAUNCH VEHICLE:Atlas V LAUNCH SITE:Vandenberg Air Force Base LAUNCH TIME:December 6, 2013 - 07:14:30 UTC NUMBER OF CUBESATS:12 PRIMARY PAYLOAD:NROL-39 .tg {border-collapse:collapse;border-spacing:0;} .tg td{font-family:Arial, sans-serif;font-size:14px;padding:10px 5px;border-style:solid;border-width:1px;overflow:hidden;word-break:normal;} .tg th{font-family:Arial, sans-serif;font-size:14px;font-weight:normal;padding:10px 5px;border-style:solid;border-width:1px;overflow:hidden;word-break:normal;} .tg .tg-2e9h{font-weight:bold;text-decoration:underline} .tg .tg-e3zv{font-weight:bold} P-Pod Satellite Name Organization Size Beacon Details More Info 1 FIREBIRD Montana State University, University of New Hampshire, Los Alamos National Laboratory, Aerospace Corp. 1.5U (x2) Flight Unit 1: 437.405 MHzFlight Unit 2: 437.230 MHzGMSK AX.25 9600bps, 1W, 60 sec period More Info 2 AeroCube5 Aerospace Corp. 1.5U (x2) 3 ALICE Air Force Institute of Technology (AFIT) 3U 460 MHz, GFSK, 12.5% duty cycle (5 seconds of 3 bursts per second then 40 seconds of RX)Beacon is based on when ALICE is 2 minutes away from AOS contact with our ground station. This information is uploaded from ephemeris data from our ground station. Will beacon until comms are established. More Info 4 SNaP U.S. Army Space and Missile Defense Command 3U 5 MCubed-2 Michigan eXploration Laboratory 1U 437.485 MHz, 9600 baud, 10 sec period More Info 5 CUNYSAT-1 Medgar Evers College, The City University of New York 1U 437.505 MHz, 9600 bps GMSK, CW More Info 5 IPEX Cal Poly, SLO - PolySat 1U 437.270MHz: Morse Code of "IPEX" every 45s at 15wpm, 9600 baud AX.25 FSK Beacon every 127s and 20s. More Info 6 SMDC-ONE (David) U.S. Army Space and Missile Defense Command 3U More Info 7 TacSat-6 U.S. Army Space and Missile Defense Command 3U 8 SMDC-ONE (Charlie) U.S. Army Space and Missile Defense Command 3U More Info The CubeSats are integrated into 8 P-POD deployers which are contained in the NPSCuL built by the Naval Postgraduate School (NPS). The NPSCuL together with the 8 P-PODs and 12 CubeSats is referred to as the Government Experimental Multi-Satellite (GEMSat), and is attached to the Centaur upper stage's Aft Bulkhead Carrier (ABC). The assembled GEMSat is shown in the photo below ready for mate to the launch vehicle along with members of the GEMSat team consisting of NPS, Office of Space Launch (OSL), United Launch Alliance (ULA) and Cal Poly, SLO.For those of you supporting us on launch day, don't forget to join the IRC channel. Information about the channel can be found at http://www.cubesat.org/index.php/collaborate/ground-operators.'''
