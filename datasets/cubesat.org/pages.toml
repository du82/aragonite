full_description = "Cal Poly CubeSat October 27, 2005 Kosmos 3M SSETI Express Launch 2005 Cal Poly CubeSat October 27, 2005 Students from many different European countries participate in SSETI. They are building the first pan-European student satellites together. They are all united by their desire to 'launch the dream' and ESA's Education Office gives them full support. The European Student Earth Orbiter (ESEO) is the first SSETI satellite and will circle the earth, take pictures, perform a radiation experiment and test out a new propulsion system.SSETI Express itself measures approximately 60x60x70cm and contains 3 CubeSats. SSETI Express will be launched from Plesetsk Cosmodrome, Russia on the on the Kosmos-3M launch vehicle. All satellites are flight ready!Click here for the SSETI Express Website LAUNCH DATE:October 27, 2005 - 06:52 UTC ORBIT PARAMETERS:Altitude: 686 kmEccentricity: 0Inclination: 98 degreesLTAN: 10:30 PARTICIPATING CUBESATS:CubeSat XI-VNCUBE-2UWE-1"
