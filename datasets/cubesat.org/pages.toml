o 5B PrintSat Colorado Satellite Services, LLC, Montana State University 1U 437.325 9600bps GMSK Beacon rate initially: 1 minute Reception reports are appreciated. Email them to jim@coloradosatellite.com More Info 6 STACEM 3U 7 SUPERNOVA 6U View fullsize The CubeSats are integrated into 8 P-POD deployers which are contained in the NPSCuL built by the Naval Postgraduate School (NPS). The NPSCuL together with the 8 P-PODs and 11 CubeSats is referred to as the Operationally Unique Technology Satellite (OUTSat), and is attached to the Centaur upper stage's Aft Bulkhead Carrier (ABC). The assembled OUTSat is shown in the photo below ready for mate to the launch vehicle along with members of the OUTSat team consisting of NPS, Office of Space Launch (OSL), United Launch Alliance (ULA) and Cal Poly, SLO."
