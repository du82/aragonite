title = "CubeSat"
full_description = '''2025 CUBESAT DEVELOPERS WORKSHOP The CubeSat Developers Workshop is an annual conference hosted by the Cal Poly CubeSat Laboratory at Cal Poly, San Luis Obispo. We plan to hold the 2025 conference in-person at the Cal Poly Performing Arts Center, as we have in years past. The conference draws more than 500 industry professionals, small satellite developers and students who will take part in three days of live presentations, Q&A panels, exhibit booths, and more! This conference is particularly useful to new members of the CubeSat community with invaluable opportunities to meet and talk to industry veterans. If you are interested in hearing more about this year’s conference, click the link below! Workshop 2025 Information The New CDS Revision is here! CDS Rev14 New from NASA CubeSat Launch Initiative:CubeSat 101: Basic Concepts and Processes for the First-time CubeSat Developers Click for more info Featured Spanish Small Satellite International Forum 2022 UN Access to Space for All Initiative IAF-CSA Space Universities CubeSat Challenge Tweets by @CalPolyCubeSat !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0],p=/^http:/.test(d.location)?'http':'https';if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src=p+"://platform.twitter.com/widgets.js";fjs.parentNode.insertBefore(js,fjs);}}(document,"script","twitter-wjs");'''
