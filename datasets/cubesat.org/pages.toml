["https://cubesat.org/news-feed/2016/3/3/congressional-legislation-to-remove-satellites-from-itar"]
title = "Congressional Legislation to Remove Satellites from ITAR  — CubeSat"
description = 'The House of Representatives in the U.S. Senate recently passed a bill, H.R. 3288, with a clause to remove ITAR restrictions on commercial satellites. The specific wording for the purpose of the bill:  "To authorize the President to remove commercial satellites and related components from the U'
full_description = 'Cal Poly CubeSat December 23, 2011 Congressional Legislation to Remove Satellites from ITAR Cal Poly CubeSat December 23, 2011 The House of Representatives in the U.S. Senate recently passed a bill, H.R. 3288, with a clause to remove ITAR restrictions on commercial satellites. The specific wording for the purpose of the bill:"To authorize the President to remove commercial satellites and related components from the United States Munitions List subject to certain restrictions, and for other purposes."Full test of the Bill can be found in PDF here:http://www.gpo.gov/fdsys/pkg/BILLS-112hr3288ih/pdf/BILLS-112hr3288ih.pdfStatus of the Bill:http://www.govtrack.us/congress/bill.xpd?bill=h112-3288This bill only pertains to commercial satellites, and does not include scientific or educational in its current form. Make your voices heard and please write to your Representatives for the inclusion of these terms. Removing educational, scientific, and commercial satellites from ITAR control will help foster the international small satellite community. Representatives Howard Berman, Don Manzullo, Adam Smith, Mike Coffman, Dutch Ruppersberger, Rob Bishop, Gerry Connolly, Jason Chaffetz, and Martin Heinrich introduced the bill, and are the best people to contact regarding updates and changes.'
