["https://cubesat.org/news-feed"]
title = "News Feed — CubeSat"
full_description = "Cal Poly CubeSat October 15, 2021 Spanish Small Satellite International Forum 2022 Cal Poly CubeSat October 15, 2021 Please visit https://sssif.com for more information on SSIF 2022#SSIF2022 1 Comment Cal Poly CubeSat March 8, 2021 UN Access to Space for All Initiative Cal Poly CubeSat March 8, 2021 United Nations Access to Space for All InitiativeWhen: Wednesday, March 10, 2021Time: 12:00 - 12:45 CETRegistration: Click here to registerVenue: VirtualOn 16 November 2018, during the United Nations/Germany High Level Forum: “The way forward after UNISPACE+50 and on Space2030” the Director of the United Nations Office for Outer Space Affairs, Ms. Simonetta Di Pippo, announced the Access to Space for All Initiative to provide research and orbital opportunities for UN Member States to access space and to ensure that the benefits of space, in particular for sustainable development, are truly accessible to all. Since then, the Access to Space for All Initiative has grown thanks to the support of governmental, intergovernmental and commercial partners, who are providing access to state-of-the-art facilities and infrastructure to support the development of technical and scientific skills.Access to Space for All has been developed to accelerate and modernize capacity-building efforts and provides tracks that offer gradual learning steps helping participants develop capabilities in a sustainable and responsible manner. Currently there are four opportunities open:Microgravity Experiments: The Opportunity with ZARM and DLR Space Administration on DropTES is open until 30 June 2021 at 23:59 CETTelescope Provision: The Opportunity with KIAM on ISONscope is open until 1 May 2021 at 23:59 CETCubeSat Deployment: The Opportunity with JAXA on KiboCUBE is open until 31 May 2021 at 23:59 CETCubeSat Deployment: The Opportunity with Avio on Vega-C is open until 4 April 2021 at 23:59 CETIt is now time to do an stocktaking exercise and look forward. We would like to present and discuss with you what is available and also what are the expected activities within Access to Space during 2021. We are looking forward to see you on Wednesday, March 10, 2021, from 12:00 - 12:45 CET. Please Click here to register. The meeting will be hosted using MS Teams. Comment"
