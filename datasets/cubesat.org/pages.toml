["https://cubesat.org/descriptions"]
title = "Supplier Descriptions — CubeSat"
full_description = '''Resources CubeSat Information Collaborate Suppliers Supplier Descriptions ComponentsPumpkin Inc.Pumpkin, Inc. manufactures the CubeSat KitTM, an off-the-shelf combination of hardware and software for picosatellites that conform to the CubeSat specification.AAC Clyde Space We provide marketleading space solutions and services for government, commercial and educational organisations. AAC Clyde Space operate internationally within the Small Satellite market segments and specialise in the provision of advanced spacecraft, tested, reliable robust subsystems and mission services. We offer specialist expertise and experience in delivering a wide range of commercially focused satellite solutions; complete end-to-end nanosatellite missions, with the capability to provide customers everything from constellation design to satellite operations. Our solutions are designed for manufacture and have an impressive mission heritage. We are the market leading provider of New Space technologies that push the boundaries of small satellite capabilities.Customers include; the European Space Agency (ESA), NASA, the US Air Force Research Laboratories (AFRL), JAXA, the Swedish National Space Board (SNSB), and Swedish Defence Materiel Administration (FMV), Kepler Communications, Airbus, DLR, LuxSpace as well as leading industrial groups now using our aerospace compliant devices in innovative products and applications such as York Space and OHB.CubSatShop.ComCubeSatShop.Com was launched in 2009 by ISIS – Innovative Solutions In Space in order to provide transparency in pricing and availability for standardized CubeSat products. With more than 7 years of experience in online retailing, today CubeSatShop is the world’s most popular webshop for CubeSats and NanoSats. The webshop provides a comprehensive overview of readily available components and subsystems, including more than 70 different product specifications available from over 15 different vendors. All of the products listed on CubeSatShop are standardized and available as off-the-shelf items and the portal is open to any CubeSat product that is ready to be sold to developers.GOMSpaceGomSpace is a globally leading designer, integrator and manufacturer of high-end nanosatellites for customers in the academic, government and commercial markets. Our positions of strength include systems integration, nanosatellite subsystems and advanced miniaturized radio technology.Our international team is devoted to understanding our customer's requirements and deliver flawlessly.We are listed in Stockholm (GOMX), headquartered in Denmark and we service our customers in more than 50 countries. Stras SpaceStras Space is a full-service nano-satellite engineering company located in Toronto, Canada. With experience ranging from the very small (1-U CubeSats) to the very large (1.5 ton space station prototype), we offer products and services for attitude determination and control, power electronics, command and data handling, software, and systems engineering. We understand the "small space" way, and can help make your next mission a success.IntelliTech Microsystems, Inc. IMI specializes in spacecraft attitude determination and control systems. We manufacture the MI-100 which is the first 3 axis momentum wheel and electromagnet attitude control system intended specifically for Cubesats and other micro and nanosatellites. Please visit our website to see our complete line of ADACS sensors and actuators. We are always happy to discuss your mission and lend our expertise.Princeton Satellite Systems, Inc.Princeton Satellite Systems, Inc. is a small company specializing in aerospace control and simulation technology. We sell commercial software including control toolboxes for MATLAB™, stand-alone simulations, and C++ libraries for real-time software. We have developed a toolbox specifically for CubeSats. The CubeSat Toolbox, for use with MATLAB®, provides you with the tools needed to design CubeSats - all within the MATLAB environment. The toolbox consists of the CubeSat module from the Spacecraft Control Toolbox with a subset of functions from the core toolbox; the Spacecraft Control Toolbox is not required.Space MicroSpace Micro is an ISO-9000 supplier of high reliability, rad hard/tolerant electronics cards for space avionics and communications used in Cubesats, nanosats, and small sats. These cards include high performance space processor, memory, GPS, Analog I/O, digital I/O, power management, battery monitoring, radiation dosimeter, and GPS cards. Our space radios include S-band, X-band, and K-band. In addition, we are developing a novel conformal, low drag UHF antenna for Cubesats, and seeking a University class initial flight.Blue Canyon TechnologiesBlue Canyon Technologies staff have developed, tested and flown components and systems on more than 27 diverse space missions. We offer a range of high performance, low recurring cost, and rapid response CubeSat spacecraft systems and components. We specialize in precision pointing platforms based upon our high performance Attitude Determination and Control components, integrated systems, and our XACT CubeSat bus.AerojetAerojet is a provider of standardized modular propulsion systems for CubeSats as well as development and production services for customized solutions. Aerojet performs architecture and mission studies to assist customers with finding the right solution for their mission application. For customers requiring post-delivery support, Aerojet also provides propulsion system integration and fuelling support services. Aerojet’s expertise stems from over 70 years of development and production of cold gas, solid motors, monopropellant, bipropellant, and electric propulsion systems for defense, civil, commercial, and research applications.Berlin Space TechnologiesBerlin Space Technologies (BST) is a German specialist for small satellite systems and technology. Our expertise is based on the famous TUBSAT satellites and covers satellites systems of 1 to 100kg. In the field of Cubesats and Nanosatellites we focus on the attitude control system. Our products range from individual components such as star trackers and reaction wheels to fully integrated ADCS solutions. Moreover our company offers hardware in the loop ADCS test benches based on air bearings and Helmholtzcoils.Tethers Unlimited, Inc.TUI develops advanced propulsion, power, communications, and robotics technologies to provide revolutionary capability enhancements and dramatic cost savings for applications in space, sea, and air. TUI’s suite of products for CubeSats and NanoSats include de-orbiting devices, software defined radios, deployable solar arrays, water electrolysis thruster, light-weight release mechanism, relative navigation system, 3 DOF gimbal, and compact 7 DOF robotic arm. TUI also provides design and engineering services for unique customer needs.Astronautical Development LLCAstronautical Development LLC specializes in CubeSat subsystems which are modularized to fit the size, mass, and power constraints of CubeSat missions.SSBV Aerospace & Technology GroupSSBV Aerospace & Technology Group is a Dutch-headed, technology driven organization, active in the domains of (aero)Space, Remote Sensing & Monitoring, Defense & Security and the development of High-Tech Systems. Among other things, SSBV designs and manufactures sensors and sub-systems for high reliability small satellite and cubesat applications, develops next generation nanosat solutions and building blocks, as well as a new generation on-board computer and on-board payload data processor for the commercial smallsat market. SSBV is also leading the development of a capable, yet affordable, FMCW X-Band SAR radar for small satellites.Solar MEMS Technologies S.L.Solar MEMS Technologies S.L. is a company specialized in the Micro Electro Mechanical System technology (MEMS) and its application to high accurate sun sensors for Space, UAV and Renewable Energy industries. Solar MEMS know-how includes development and optimization of ADCS technologies, space projects management, custom electronic designs, integration solutions and interfaces adaptation in Nano/Pico satellite platforms. Solar MEMS is also participating in project CEPHEUS, which purpose is the design, implementation and integration of the first Andalusian testing low-cost satellite.CU AerospaceCU Aerospace offers both standardized and custom propulsion systems for CubeSats and other small-satellites. Propulsion services include requirements definition, production, testing, integration, and post-delivery support. CU Aerospace also has the capability to plan and analyze space missions.Astro- und Feinwerktechnik Adlershof GmbHAstro- und Feinwerktechnik Adlershof GmbH is a mid-sized business for space applications with more than 20 years experience situated in Berlin, Germany. We offer flight proven reaction wheels for CubeSats, picosatellite launchers for single, double and triple U’s, as well as custom designed ACDS solutions. Besides the CubeSats components, our company offers a flight proven satellite bus for satellites up to 120 kg (265 lbs) as well as corresponding components and an ACS test bench. To complete our product spectrum, we also provide ESA certified test services like thermal-vacuum cycling, vibration and pyroshock tests.SkyFox Labs s.r.o.SkyFox Labs s.r.o. is a manufacturer of the World's First Space-Friendly™ components for CubeSats and Small Satellites you cannot find anywhere else. Products are completely designed, manufactured and tested in Czech Republic, a country with space heritage since 1978.Busek Co. Inc.Busek Co. Inc. is an industry leader in the development and manufacture of high performance space propulsion systems. The firm’s spacecraft products span solar electric propulsion technologies such as Hall Effect, electrospray, radio frequency ion, and pulsed plasma thrusters, in addition to green monopropellant thrusters. These technologies are available in packages designed and optimized for spacecraft ranging in mass from 3kg to over 1,000kg. The firm’s expertise across multiple propulsion technologies enables it to provide clear, unbiased solutions to best fit customers’ needs.NanoAvionics, JSCNanoAvionics is a nanosatellite mission integrator focused on delivering new generation satellite buses and propulsion systems for the satellite applications market. With facilities in North America and Europe, NanoAvionics’ team has over forty successful satellite missions and projects under their belt, and keep counting.VACCO IndustriesVACCO Industries provides a variety of high-performance cold gas, warm gas and green monopropellant systems for Cubesat platforms. To date, fourteen flight MiPS have been produced to support AFRL, NRO, NASA and commercial flight applications, including support for the JPL MarCo Cubesat program. VACCO utilizes its proprietary Chemically Etched Micro Systems (ChEMS™) technology to produce these smart, highly integrated Micro Propulsion Systems (MiPS) specifically designed for Cubesats. In addition to complete systems VACCO also provides Xenon and Iodine micro feed systems & valves. Since 1962, VACCO fluid controls have supported many leading satellite, launch vehicles and interplanetary spacecraft.IQ wireless GmbH Our product portfolio comprises high performance radio communication solutions in order to provide flexible, highly efficient broadband data communication between satellites and ground stations as well as between various satellites. The radio devices operate on S band (frequencies of 2.0-2.3 GHz) and allow payload data rates of up to 20 Mbps depending on the configuration in the downlink. This means that an outstanding and flexible platform for scientific research, such as within the context of commercial applications and university projects, has been made available, which can be adapted to suit a wide range of customer-specific applications.Helical Communication Technologies IncHelical Communication Technologies Inc was formed to serve the increasing need for specialized antennas for use with ground based and space based communication with satellites placed in low earth orbit and deep space. HCT is driven to provide small dimension, high performance antennas at reasonable cost, currently offering deployable space based and ground station antenna products for Small Satellites and AmSat ground stations. The company also builds terrestrial based receiving stations that incorporate other applications for lightning detection, improvements in RFID, and WiFi applications.Kubos designs and produces a space graded flight software solution for nanosatellite systems. We bring modern software engineering practices and disciplines to bear on the challenges of your missions. The KubOS platform combines existing operating systems (FreeRTOS & Linux), a nanosatellite hardware compatibility layer and custom middleware built with satellites in mind. With integration into existing COTS hardware, KubOS solves the common nanosatellite software problem of what a satellite needs to do, so that you can focus on your mission and payload. N.P.C. New Production Concept S.r.l.N.P.C. New Production Concept S.r.l is a dynamic Italian company operating in the field of nanosatellites through its business unit Spacemind. The main currently available subsystem is ARTICA (aerodynamic reentry technology in CubeSat application) a compact deorbiting system compatible with the CubeSat class of spacecrafts. ARTICA consists in an autonomous device that can be easily integrated on one end of the satellite: upon the completion of a pre-established count the system automatically deploys a deorbiting sail (>2 m2 area) that dramatically decreases time spent in orbit at EOL. There are two ongoing CubeSat missions involving the use of ARTICA. NPC is currently developing new subsystems to expand its range of products. Furthermore it can offer a whole range of engineering services and technical support during all phases of a nanosatellite mission. Ecuadorian Space AgencyEXA is an aerospace research and development institution that designs and builds extreme hardware for cubesats, with more than 3 years of record-setting flight heritage in extreme conditions; products include 1U to 3U deployable solar arrays, powerful slim batteries, titanium structures and mechanical components on demand, magnetorquers, deployable antennas, active artificial muscles and their unique NEMEA MLI anti-radiation, thermal control shields.EXA’s technology is singular, original, simple, solid and dependable and allows cubesat developers to use COTS components in order to break the limitations of budget and power typical of the 1U form factor, their deployable hardware is based over EXA’s unique Active Artificial Muscle technology for a dependable, proven and anti whiplash deploy of challenging mechanical elements. Flight heritage from NEE-01 PEGASUS and NEE-02 KRYSAOR backs their technology'''
