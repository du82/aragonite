title = "Tour Designer Jake Szymanski’s Hudson Valley Log Cabin"
description = "Furniture designer Jake Szymanski grew up in a Colorado log house. He thought he’d never want to live in one until he found one in Stone Ridge that had been sitting on the market."
full_description = '''.layout > .ad-splash, .one-column-layout > .ad-splash { display: none; } great rooms Feb. 25, 2025 The Log Cabin No One Wanted Jake Szymanski grew up in a Colorado log house. He thought he’d never want to live in one again. By Wendy Goodman, Curbed and New York Magazine’s design editor who covers the city’s most spectacular interiors. Great Rooms A visual diary by Design Editor Wendy Goodman. The Winter Living Room: So called because the woodstove heats the entire home. The blue sofa is an auction find, and the silk-damask mushroom pouf is from Maison Gerard. The iron fungi chandelier is from Jake Szymanski’s Flora collection. Photo: Matt Dutile Great Rooms A visual diary by Design Editor Wendy Goodman. The Winter Living Room: So called because the woodstove heats the entire home. The blue sofa is an auction find, and the silk-damask mushroom pouf is from Maison Gerard. The iron fungi chandelier is from Jake Szymanski’s Flora collection. Photo: Matt Dutile When furniture designer Jake Szymanski started scouring the Hudson Valley for a house, his mission was to find “something that no one had touched.” But for nearly two years, he says, most everything he looked at had been “whitewashed or had weird extensions.” Finally, his broker took him to a 1952 log cabin in Stone Ridge that had been languishing on the market. “She tells me there is this gorgeous pond in front,” he says. “And I go, ‘Pam, this is kind of a swamp, let’s be honest.’ ” That didn’t deter him, nor did the ancient wall-to-wall carpets: “You couldn’t tell the original color. It was gross, gross, gross.” Still, Szymanski could see that “this house was loved, and good things have happened in this home. I felt I could bring that out,” he says. He began by pulling up the carpeting to reveal the pine floors throughout the three-bedroom cabin. The stone fireplace was brought to life by removing decades of dirt and ash. The kitchen was the only place needing a gut renovation, and Szymanski added modern appliances and a worktable hung with fabric to hide the pots and pans stored below. In fact, fabric panels and curtain treatments became central to his design to break up the monotony of the cabin’s walls. “The logs have a very sort of orange hue to them,” he says. “So the fabric was my solution to giving me something to look at that’s not just logs.” Six months into the project, a downpour washed away a beaver dam that had created the swampy pond. Now, there’s a stream on the property. And after about two years of restoring the cabin, Szymanski and his husband, Josh Powers, got married there under a willow tree. He never expected to be in a log cabin again: His parents had fixed up one in a former Colorado gold-mining town, where the family lived until he was 5. Later on, when his mother brought up that first home, “I had this reaction like, Ugh, I would never live in a log cabin,” he says. “What’s funny to me is just, as you get older, those things sort of work themselves back into your life.” { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Matt Dutile", "caption": "The Dining Room: The home is populated with prototypes from Szymanski’s design studio in the Bronx, many of which were inspired by the cabin. “This is a place to play with a more fun, romantic side,” he says. The hanging lights are from the Flora collection; the dining chairs are also by Szymanski.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/b34/684/bef5af2f50e8cc256aa92151e2f64d12a1-dining-table.2x.w710.jpg", "width": "1420", "height": "" } } The Dining Room: The home is populated with prototypes from Szymanski’s design studio in the Bronx, many of which were inspired by the cabin. “This is a place to play with a more fun, romantic side,” he says. The hanging lights are from the Flora collection; the dining chairs are also by Szymanski. Photo: Matt Dutile { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Matt Dutile", "caption": "The Kitchen: The window-and-island fabric is a hand-blocked print from Zak+Fox. The handmade backsplash tiles are from Clay Squared, and the cabinets are from Reform.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/fa0/feb/988ddbe6ac1667016043093ea2c4f23bd6-kitchen.2x.w710.jpg", "width": "1420", "height": "" } } The Kitchen: The window-and-island fabric is a hand-blocked print from Zak+Fox. The handmade backsplash tiles are from Clay Squared, and the cabinets are from Reform. Photo: Matt Dutile { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Matt Dutile", "caption": "The Winter Living Room: Szymanski designed the table. The base of it — and the squirrel motif running throughout the house — is a tribute to the couple’s standard poodle, Ella.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/2ce/d70/f53d7df7b19d3d905da49f5aada57e1f54-dog-on-couch.2x.w710.jpg", "width": "1420", "height": "" } } The Winter Living Room: Szymanski designed the table. The base of it — and the squirrel motif running throughout the house — is a tribute to the couple’s standard poodle, Ella. Photo: Matt Dutile { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Matt Dutile", "caption": "From J.M. Szymanski’s Flora collection.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/164/86a/0621ff286878c4179f185b8c2c3fa85ac4-light-fixture-detail.2x.w710.jpg", "width": "1420", "height": "" } } From J.M. Szymanski’s Flora collection. Photo: Matt Dutile { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Matt Dutile", "caption": "The Summer Living Room: The stone fireplace is original to the cabin, and the white coffee table is from the Zak+Fox showroom. Szymanski designed the red mohair sofa with horsehair fringe and iron buttons.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/e54/6d1/779cf04a395e7d2e47338e9869e75aff28-stone-fireplace.2x.w710.jpg", "width": "1420", "height": "" } } The Summer Living Room: The stone fireplace is original to the cabin, and the white coffee table is from the Zak+Fox showroom. Szymanski designed the red mohair sofa with horsehair fringe and iron buttons. Photo: Matt Dutile { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Matt Dutile", "caption": "The iron and shearling chair is a J.M. Szymanski design. The table is by Carlo Bugatti. “This is my interpretation of a more maximalist look,” Szymanski says.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/bbd/375/7ecd27a925d3877c52ffbb02e3cf9b94e9-living-room-alternate-view.2x.w710.jpg", "width": "1420", "height": "" } } The iron and shearling chair is a J.M. Szymanski design. The table is by Carlo Bugatti. “This is my interpretation of a more maximalist look,” Szymanski says. Photo: Matt Dutile { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Matt Dutile", "caption": "The Stairwell: The stairs separate the winter and summer living rooms. Szymanski designed the bench with the fringe and found the sheet-metal console table at an auction.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/ae0/25b/4aa173b4b71e800c0e2f8b4dbb3ccd095e-table-by-staircase.2x.w710.jpg", "width": "1420", "height": "" } } The Stairwell: The stairs separate the winter and summer living rooms. Szymanski designed the bench with the fringe and found the sheet-metal console table at an auction. Photo: Matt Dutile { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Matt Dutile", "caption": "Szymanski collects hats on his travels. The woven banana one on the tabletop is from Costa Rica. The wood table was left by the previous owner.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/e1b/690/81e2226820b897bcc351b7b3669728a599-hat-rack.2x.w710.jpg", "width": "1420", "height": "" } } Szymanski collects hats on his travels. The woven banana one on the tabletop is from Costa Rica. The wood table was left by the previous owner. Photo: Matt Dutile { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Matt Dutile", "caption": "The Bedroom: “The cabin had plaster on the walls, but it had become very dingy. So I gave the walls a new coat,” Szymanski says.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/5b7/103/3776be22c6ad5be19a466d2a757cf9e5d0-bedroom.2x.w710.jpg", "width": "1420", "height": "" } } The Bedroom: “The cabin had plaster on the walls, but it had become very dingy. So I gave the walls a new coat,” Szymanski says. Photo: Matt Dutile { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Matt Dutile", "caption": "The Porch: The front porch overlooks a stream and wooded valley. The Adirondack-style table is from a local antique store.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/54b/935/3f5d975a36b87615f62b807d2d74d90e6f-outdoor-porch.2x.w710.jpg", "width": "1420", "height": "" } } The Porch: The front porch overlooks a stream and wooded valley. The Adirondack-style table is from a local antique store. Photo: Matt Dutile { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Matt Dutile", "contentUrl": "https://pyxis.nymag.com/v1/imgs/c57/08b/e3254c965eeeb367298136275bf7c5bf26-outdoor-window.2x.w710.jpg", "width": "1420", "height": "" } } Photo: Matt Dutile { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Matt Dutile", "caption": "Szymanski (right) and his husband, Josh Powers.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/c6a/8ba/239abd1767e4786c7e0e7fcea514bb2dc2-portrait.2x.w710.jpg", "width": "1420", "height": "" } } Szymanski (right) and his husband, Josh Powers. Photo: Matt Dutile Thank you for subscribing and supporting our journalism. If you prefer to read in print, you can also find this article in the February 24, 2025, issue of New York Magazine. Want more stories like this one? Subscribe now to support our journalism and get unlimited access to our coverage. If you prefer to read in print, you can also find this article in the February 24, 2025, issue of New York Magazine. Sign Up for the Design Hunting Newsletter Design editor Wendy Goodman takes you inside the city’s most exciting homes and design studios. Email This site is protected by reCAPTCHA and the Google Privacy Policy and Terms of Service apply. Vox Media, LLC Terms and Privacy Notice By submitting your email, you agree to our Terms and Privacy Notice and to receive email correspondence from us. More Great Rooms A Wood-Paneled Renovation Turns Two Units Into One Brushing Up Scott Csoke’s East Williamsburg Railroad A Cabin in the Middle of St. Marks Place See All Tags: great rooms design hunting new york magazine jake szymanski hudson valley stone ridge log cabin wendy goodman upstate More Show Leave a Comment The Hudson Valley Log Cabin No One Wanted const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'curbed'; const keywords = ["great rooms","design hunting","new york magazine","jake szymanski","hudson valley","stone ridge","log cabin","wendy goodman","upstate"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exc