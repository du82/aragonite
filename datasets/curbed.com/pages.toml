title = "A Modernist Amagansett House by Julian and Barbara Neski"
description = "A modern home that seems to float through the woods of Amagansett was designed by Julian and Barbara Neski, who had a reputation for playful vacation homes."
full_description = 'buy it for the architecture Feb. 26, 2025 A Floating Modernist House in the Amagansett Woods By Adriane Quinlan, an Emmy Award–winning Curbed writer who has reported on New York City for four years A 1982 house designed by the modernist duo Julian and Barbara Neski found new owners in 1994 who refurbished the rooms and brought in a collection of mid-century furniture. Photo: Tony Lattari In the 1950s, Barbara and Julian Neski worked for the architect Marcel Breuer, carrying out his program of austere lines and heavy forms. But when Barbara showed up pregnant with their first son, she was fired. The couple broke out on their own, and earned a reputation in the 1960s for lighter, giddier modern homes — eventually building 25 weekend retreats across the Hamptons. A 1972 house for two performers centered on a spiral staircase they could float down, like the risers of a stage set. In East Hampton, a 1964 house with a pair of steeply angled roofs displayed a severe flair that must have flustered the neighbors in nearby cottages. View this post on Instagram A post shared by @___reference In Amagansett, the birch trees around a hilly lot were the inspiration for a 1982 house built for a headhunter and his family. Rather than flatten the site, the Neskis raised the home over slender support columns the width of nearby trees. The cantilevered, L-shaped house seems to glide into the woods, like a yacht. A wide deck that wraps around the back is around 900 square feet, enough room for each of three bedrooms to have its own private balcony (the primary, on a corner, has two) and for an outdoor dining area off the kitchen, shaded by an extension of the roof. { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Tony Lattari", "caption": "“It really does feel like you’re within the trees,” said Myles Reilly, the broker who found the house for Kathy Formby 30 years ago and is selling it now. The house is held up by columns, allowing a car to drive underneath.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/de6/32d/0222755d760b805d507af8738ffcffa419-43-Timber-Trail-AMA-003.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } “It really does feel like you’re within the trees,” said Myles Reilly, the broker who found the house for Kathy Formby 30 years ago and is selling it now. The house is held up by columns, allowing a car to drive underneath. Photo: Tony Lattari { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Tony Lattari", "caption": "Just off the kitchen is a shaded spot for eating or lounging outdoors.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/03f/61e/b0f90a599c428325fce0daf29c1fbc5aa2-43-Timber-Trail-AMA-023.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Just off the kitchen is a shaded spot for eating or lounging outdoors. Photo: Tony Lattari The home itself is simple, like many of the Neskis’ most well-known designs, and just 2,200 square feet. Inside, it centers on an open living area capped with a sunroof that runs from a wood-burning fireplace to a pass-through into the kitchen. But, for the most part, the design saves all of the attention for the views through the floor-to-ceiling windows, and invites visitors to enjoy their freedom with a ramp to the entrance that seems to encourage bounding up and down it. “It’s signaling to you to let your hair down,” said David Sokol, the author of Hamptons Modern. “It’s acknowledging that the weekend started, and it’s time to reconnect with a bit more of the inner child.” There’s a dash of Breuer and his cantilevers, but the home doesn’t feel “stuck in amber,” Sokol said. “In the Neskis’ work, and in this house in particular, you can see the influence of the 1920s and yet it’s something else.” When Kathy Formby first saw the house in the 1990s, she had built a fashion career designing accessories that wouldn’t feel instantly dated. “Trendless — that was always my goal,” she said. A painter by training, she created the Ricky bag for Ralph Lauren before helping lead Chanel’s successful reinvention of an 1856 luggage line. But it might have been the minimalism of an old boss, Calvin Klein, that attuned her to the Neskis’ style. “There’s something he said that I always used in every sort of aesthetic decision,” she said. “Think about the design, strip it down to its core, then only put in what’s necessary.” { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Tony Lattari", "caption": "The decks that wrap the house add around 900 square feet of outdoor space.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/577/21a/ff7ef7cf9f5f8cb7dbe79db28f1eca8b4c-43-Timber-Trail-AMA-022.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } The decks that wrap the house add around 900 square feet of outdoor space. Photo: Tony Lattari Kathy and her ex-husband, the J.Crew executive Scott Formby, stripped out the brown upholstery, bad blinds, and brass sconces left by the last owners, which didn’t seem to match the home’s gray cedar exterior or simple lines. They bathed the exterior in a lighter shade of gray, doused the inside in white paint, and brought warmth to the bedrooms and bathrooms by using natural materials only: river-stone flooring, seagrass wall coverings. The furniture came from their collection of playful mid-century classics: swinging black leather Knoll sofas over a thick shag rug; metal basket chairs by Bertoia under pine-cone-shaped pendant lamps by Poul Henningsen. News of the stylish house reached the fashion world and, through it, the husband of a Calvin Klein designer — architecture critic Alastair Gordon, who knew the Neskis well, and wrote of them in his 2001 book, Weekend Utopia. “They weren’t ego driven, money driven. They really loved design,” he said. Which is how he felt about the Formbys. Gordon arranged a meeting between the couple and the Neskis, which he wrote about in 2000 for the New York Times. The Neskis were thrilled with what the couple had done with the place, and felt connected to its new owners — leading to invites for the Formbys to join them on trips foraging for Indian Pipe flowers and to visit their own home in Water Mill. They chatted about plans to expand with a swimming pool and an art studio (Kathy is a painter), but the Formbys couldn’t bear to go through with it. “We really didn’t want to chop down any trees,” she said. Thirty years later, even as Kathy Formby finds herself admiring the home’s smart design — a hidden outlet, the flow between the rooms — the trees are still the centerpiece, wallpapering the house with green in summer, red in the fall, and, a few weeks ago, standing like painted lines against the winter landscape. “We had that big snowfall and everything was covered in white,” she said. “It’s hard to explain, but the house changes. It’s changing all the time.” Details: Price: $3.295 million Specs: 3 bedrooms, 2 bathrooms Extras: 900-square-foot deck, wood-burning fireplace, 1.95 acre lot 5-minute driving radius: Fresh Pond Park, Albert’s Landing Public Beach, Amagansett Golf Club Listed by: Myles Reilly, Saunders & Associates { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Tony Lattari", "caption": "Visitors enter via ramp, into a foyer that divides the house between a guest suite, through this door, and access to the main, open living area.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/aa5/b49/da01b72a7cec6d9b61620f02a24c0177fe-43-Timber-Trail-AMA-005.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Visitors enter via ramp, into a foyer that divides the house between a guest suite, through this door, and access to the main, open living area. Photo: Tony Lattari { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Tony Lattari", "caption": "The entry foyer, with a painting by Matthew Satz, who uses smoke to color his canvases. Kathy Formby is friends with Satz, and initially studied painting before work in illustration pulled her into a career in fashion. The door leads to an open living and dining area.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/4e5/d09/649528121ad7d849483b59fe7b81837e11-43-Timber-Trail-AMA-004.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } The entry foyer, with a painting by Matthew Satz, who uses smoke to color his canvases. Kathy Formby is friends with Satz, and initially studied painting before work in illustration pulled her into a career in fashion. The door leads to an open living and dining area. Photo: Tony Lattari { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Tony Lattari", "caption": "The living area at the center of the house is lit by a wall of glass and a series of skylights. The Formbys decorated with an eclectic mix of mid-century design, and Kathy later filled the space with plants she puts out on the deck in summer.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/c37/4bf/5ba6c7a1e2775709e934b6c660558a0ce9-43-Timber-Trail-AMA-011.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } The living area at the center of the house is lit by a wall of glass and a series of skylights. The Formbys decorated with an eclectic mix of mid-century design, and Kathy later filled the space with plants she puts out on the deck in summer. Photo: Tony Lattari { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Tony Lattari", "caption": "Behind the wood burning fireplace, a passage leads to the primary suite.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/98b/6df/449ebe9984ccdc98f94c48c2dfc258f3ae-43-Timber-Trail-AMA-007.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Behind the wood burning fireplace, a passage leads to the primary suite. Photo: Tony Lattari { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Tony Lattari", "caption": "The driftwood chair is from California, the shag rug is from France, and the painting of palms is by a friend.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/ff0/72b/837f0fa2e5e6324b1bee8bdccb32398c3d-43-Timber-Trail-AMA-012.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } The driftwood chair is from California, the shag rug is from France, and the painting of palms is by a friend. Photo: Tony Lattari { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Tony Lattari", "caption": "Bertoia chairs surround a Jens Risom table. The Formbys collected mid-century furniture that they stuffed inside a Greenwich Village apartment before they bought the weekend retreat.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/436/639/659584cff07d2754a4b5bcf048e9e981b1-43-Timber-Trail-AMA-010.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Bertoia chairs surround a Jens Risom table. The Formbys collected mid-century furniture that they stuffed inside a Greenwich Village apartment before they bought the weekend retreat. Photo: Tony Lattari { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Tony Lattari", "caption": "A lounge chair by Bruno Mathsson faces the fireplace. The hall behind it shows the home’s L-shape and leads to the guest bedrooms.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/a3c/3cb/27363894c1c8541f71f3880334bae559d1-43-Timber-Trail-AMA-009.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } A lounge chair by Bruno Mathsson faces the fireplace. The hall behind it shows the home’s L-shape and leads to the guest bedrooms. Photo: Tony Lattari { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Tony Lattari", "caption": "Behind the dining table is a pass-through sized for a wine bottle that connects the kitchen, without giving a glimpse of its clutter.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/ab9/887/7f7b15fe15df4fa97df83236e5d04724f7-43-Timber-Trail-AMA-006.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Behind the dining table is a pass-through sized for a wine bottle that connects the kitchen, without giving a glimpse of its clutter. Photo: Tony Lattari { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Tony Lattari", "caption": "Kathy Formby was careful in a recent renovation to replace oak cabinets with an exact match. The countertops are the original Corian. “We never went for crazy, fabulous marble backsplashes — the trend of the time. I hope this house is kind of trendless.”", "contentUrl": "https://pyxis.nymag.com/v1/imgs/a56/2d5/b69c6f7e88f363693f6ce58a6081b9fa64-43-Timber-Trail-AMA-019.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Kathy Formby was careful in a recent renovation to replace oak cabinets with an exact match. The countertops are the original Corian. “We never went for crazy, fabulous marble backsplashes — the trend of the time. I hope this house is kind of trendless.” Photo: Tony Lattari { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Tony Lattari", "caption": "Cabinetry designed by the Neskis hides a paper-towel holder, and adds warmth to the room.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/ded/fc7/6f5953fb59786ba445ab5eb34bebf7d6cb-43-Timber-Trail-AMA-020.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Cabinetry designed by the Neskis hides a paper-towel holder, and adds warmth to the room. Photo: Tony Lattari { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Tony Lattari", "caption": "Back behind the living-room fireplace, in a corner of the home that looks into uninterrupted views, the primary bedroom has two separate decks — both cut off from the decks of the rest of the house.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/e57/997/8b5ebff5b3ad23506c58442c86c9832e26-43-Timber-Trail-AMA-015.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Back behind the living-room fireplace, in a corner of the home that looks into uninterrupted views, the primary bedroom has two separate decks — both cut off from the decks of the rest of the house. Photo: Tony Lattari { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Tony Lattari", "caption": "The primary bathroom, where the Formbys discovered outlets at the back of drawers — ideal for hiding blow-driers and electric toothbrushes. The Formbys added the stone flooring.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/a8f/382/f26609c47'
