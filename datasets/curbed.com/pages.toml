description = "Curbed is a New York Magazine site that obsessively covers cities, city life, architecture, urbanism, real estate, and design."
full_description = "About Us Curbed relaunched as part of New York Magazine in 2020 with a mandate to cover cities and city life with the verve, wit, and obsessiveness of the original city magazine. Before joining New York, Curbed began in 2004 as a voicey site for urban obsessives that chronicled everything from real-estate news to lower Manhattan’s last remaining gas station. Its distinguished reportage and keen sense of city life quickly made it the premier destination for anything related to architecture, design, and urbanism in New York City and other cities across the country. It joined the Vox Media family in 2013, laying the groundwork for its eventual union with New York. The site features four main sections: Cityscape, publishing provocative and conversation-setting coverage of the people, ideas, news, and issues shaping our built environment and city life as well as market analysis and regular columns about architecture and urbanism; Design Hunting, the home for New York’s best-in-class interiors coverage and in-depth reporting on the design world; The Real Estate, issuing authoritative regular roundups of New York City’s best listings; and Best of New York, the magazine’s long-running franchise culling excellent tips for the most useful services and products in New York City. New York Magazine won a National Magazine Award for Leisure Interests in 2021 for the Curbed series “Biography of a Building,” by Matthew Sedacca. New York, including Curbed, was a finalist for the National Magazine Award for General Excellence (News, Sports, and Entertainment) in 2022. “Revolt of the Delivery Workers,” a collaboration between New York/Curbed and The Verge, won the Gerald Loeb Award for Feature Writing in 2022; it was also a finalist for the James Beard Foundation Journalism Award for Investigative Reporting. Since 2019, New York has been a part of Vox Media, the leading modern media company, whose portfolio features nearly 20 popular and influential editorial properties, including (in addition to the New York brands) Vox, Eater, NowThis, SB Nation, The Dodo, and The Verge. The Vox Media Podcast Network is one of the largest collections of popular podcasts, spanning technology, news, pop culture, emerging trends, and more. Vox Media Studios is the award-winning nonfiction production and distribution studio for multiple TV and streaming partners. Subscribe to New York here. Sign up for our newsletters and follow Curbed on Instagram, Twitter, Facebook, and LinkedIn. Editors Editor Name Sukjong Hong Twitter Senior Editor Name Katie McDonough Twitter Features editor Name Katy Schneider Instagram City Editor Name Christopher Bonanos Twitter Instagram Design Editor Name Wendy Goodman Twitter Instagram Staff Writers Writer Name Clio Chang Twitter Architecture Critic Name Justin Davidson Twitter Features writer Name Bridget Read Twitter Instagram Real-Estate Reporter Name Kim Velsey Twitter"
