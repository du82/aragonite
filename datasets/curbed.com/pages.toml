title = "Joey Ramone’s East Village Apartment Is for Sale"
description = "The studio apartment at 115 East 9th Street in the East Village where punk musician Joey Ramone lived for years is on the market, asking $575,000. The seller found memorabilia during a gut renovation that will trade with the apartment."
full_description = '''celebrity real estate Feb. 28, 2025 Joey Ramone’s East Village Apartment Is for Sale By Kim Velsey, Curbed’s real-estate reporter Joey Ramone in the East Village studio in 1992. Photo: Bruce Gilbert/Newsday/Getty Images The intersection of East 2nd Street and Bowery is known as Joey Ramone Place — it was where Joey and Dee Dee Ramone lived during the band’s early years, at creative director Arturo Vega’s loft at 6 East 2nd. But after a few years there, the punk front man moved about a ten-minute walk away into a studio apartment at 115 East 9th Street, a 20-story postwar high-rise. While other band members left the neighborhood over the years, Joey remained in the East Village and the studio until his death in 2001. { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Yoreevo", "caption": "The studio has been gut renovated by the seller, who purchased it from Joey Ramone’s brother in 2018.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/21f/d01/fff9f991a34b81cdc109311cd9f830cc37-Living-area.2x.rhorizontal.w700.png", "width": "1400", "height": "934" } } The studio has been gut renovated by the seller, who purchased it from Joey Ramone’s brother in 2018. Photo: Yoreevo { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Douglas Elliman", "caption": "A photo of the apartment, as seen in 2018 listing photos, before the renovation. The space still looks similar to when Joey lived there.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/fc9/0c0/46eec8129a8c58ee17bffec26d826b1936-living-room.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } A photo of the apartment, as seen in 2018 listing photos, before the renovation. The space still looks similar to when Joey lived there. Photo: Douglas Elliman The studio, which his brother inherited from his estate in 2014, is now on the market, asking $575,000 — studios in the building generally sell in the half-million range. It’s unclear when Joey, born Jeffrey Hyman in Forest Hills, Queens, bought the apartment. But he was living there in 1987, and a few years later, in 1992, when he was photographed on the sectional couch in the living room/main room, decorated with framed band posters and a golden record, with a row of south-facing windows along one wall. Other photos of Joey in the apartment show his towering frame almost reaching the ceiling of the main room and crouched in the kitchen. It’s possible that he may have been renting when the building was converted into co-ops in the early 1980s. View this post on Instagram A post shared by Poison Heart (@poisonheartbar) When his brother sold the apartment to the current owner in 2018, it appears to have been empty for some time. James McGrath, a broker at Yoreevo who has the new listing, says the owner discovered a cache of Joey’s papers wedged behind the kitchen cabinets when he renovated the apartment. Among them were fan mail, scribbled lyrics, copies of reviews, and a long letter from a student at Boston University upset about the school’s cancellation of a 1987 Ramones concert. The student, who was the chairman of the programming council concert committee, detailed the reasons the administration had given for canceling the concert, “to highlight for you what kind of idiots make the decisions around here.” (In short, the administration thought that the punk band was, well, too punk.) Apparently, the letter resonated, and Joey and Marky Ramone attended a student rally in Boston. “We’re here to uphold the honor of the students,” Joey said at the time. “I mean, you guys pay to go to school here, so to me this is just total absurdity.” { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Yoreevo", "caption": "Some handwritten lyrics, discovered behind the kitchen cabinets.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/52d/909/b8e70d0ade172d34867ceccd130d9ea272-IMG-7779.2x.rvertical.w570.jpg", "width": "1140", "height": "1426" } } Some handwritten lyrics, discovered behind the kitchen cabinets. Photo: Yoreevo McGrath says that the seller will pass along the memorabilia with the now fully renovated apartment — in addition to the kitchen and the bathroom, pretty much everything else has been overhauled. While it’s been redone with sleeker finishes and new wood floors, the apartment still looks fairly similar to when Joey lived there. The full-service building, near the border of Greenwich Village and the East Village, also has a full-time doorman, storage, and a laundry room. Location-wise, it’s less than a block from Wegmans and the Astor Place subway station. It’s pet-friendly and allows sublets, but not pieds-à-terre. Whomever buys Joey Ramone’s old place will, at least, be a full-time New Yorker. { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Yoreevo", "caption": "A letter to Joey Ramone from a Boston University student, upset about the school’s cancellation of a Ramones concert.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/ed0/39d/086d664fce02904bd654c116920b9e5d9a-IMG-7777.2x.rvertical.w570.jpg", "width": "1140", "height": "1426" } } A letter to Joey Ramone from a Boston University student, upset about the school’s cancellation of a Ramones concert. Photo: Yoreevo { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Yoreevo", "caption": "The seller also found clips of reviews and stories.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/e15/fa6/aac93ea3196af4f19656183f19005ccab3-IMG-7778.2x.rvertical.w570.jpg", "width": "1140", "height": "1426" } } The seller also found clips of reviews and stories. Photo: Yoreevo Related One Brief, Scuzzy Moment Rachel Kushner Lived With Freezing Pipes, Toxic Waste, and Sketchy Landlords Tags: celebrity real estate punk music joey ramone the ramones east village new york 1970s new york 1980s new york 1990s on the market the real estate who's selling More Show Leave a Comment Joey Ramone’s East Village Apartment Is for Sale const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'curbed'; const keywords = ["celebrity real estate","punk music","joey ramone","the ramones","east village","new york 1970s","new york 1980s","new york 1990s","on the market","the real estate","who's selling"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript = document.createElement('script'); ldJsonScript.type = "application/ld+json"; ldJsonScript.innerHTML = JSON.stringify(structuredData); document.head.appendChild(ldJsonScript);'''
