["https://www.curbed.com/article/under-a-million-astoria-lenox-hill-upper-west-side-park-slope.html"]
title = "NYC Apartments Under a Million: Astoria, UWS and Park Slope"
description = "Here are some great apartments to buy in New York City for under a million dollars, including one-bedrooms in Astoria, Lenox Hill, Upper West Side, and Park Slope."
full_description = '''under a million Feb. 18, 2025 A Loftlike One-Bedroom in a Former Steinway Piano Factory Building for $519K By Kim Velsey, Curbed’s real-estate reporter A one-bedroom at 45-02 Ditmars Boulevard in Astoria, the former Steinway Piano factory. Photo-Illustration: Curbed; Photo: Modern Spaces For under a million dollars, one can find all sorts of housing configurations: park- and subway-adjacent studios, one-bedrooms hidden in carriage houses or former shoe factories, and even the occasional true two-bedroom. We’re combing the market for particularly spacious, nicely renovated, or otherwise worth-a-look apartments at various six-digit price points. This week, actually spacious one-bedrooms in full-service buildings in Astoria and Park Slope, plus a lofty spot on the Upper West Side. An Astoria one-bedroom for $519,000 45-02 Ditmars Blvd., Apt. 539 { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Modern Spaces", "contentUrl": "https://pyxis.nymag.com/v1/imgs/bf7/2a1/c78fd17851d9b693b7fa2088e2ff32d688-45-02-Ditmars-Boulevard-secondary.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: Modern Spaces { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Modern Spaces", "contentUrl": "https://pyxis.nymag.com/v1/imgs/d89/46d/73f3c2abf74c238a42147aa159466501b3-45-02-Ditmars-Boulevard-bedroom.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: Modern Spaces Located in a 1907 building that was once part of the Steinway Piano Factory, this one-bedroom condo is an unusually grand space for Astoria. Loftlike, with 12-foot ceilings and a row of southwest-facing windows with views of the Manhattan skyline, the apartment is bright, with wood floors and huge white walls. The kitchen, tucked off the living room, has stainless-steel appliances, and there’s a nice-size bedroom with lots of closet space. Also, each room has its own HVAC unit — an unusual perk. In the Ditmars section of the neighborhood, known for being quieter and closer to the park, the building has a 24-hour doorman, a laundry room on every floor, and a huge fitness center. But there’s currently a tenant in place, so buyers will have to wait before they can move in. A One-Bedroom in Lenox Hill for $995,000 221 E. 78th Street, Apt. 2F { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "SERHANT", "contentUrl": "https://pyxis.nymag.com/v1/imgs/cb2/2b4/3094eeb3ab09ebe2c829973e5b6397b23a-221-East-78th-Street--2F.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: SERHANT This Lenox Hill apartment has three things that can be hard to find at this price point, especially in Manhattan: a lot of space, a second bathroom, and a pleasant view. The long living room overlooks a tree-lined street of brownstones, as does one of the bedrooms. There’s a dining-room area and a big kitchen with nice finishes, an Italian gas stove, and a Sub-Zero under-counter refrigerator and freezer. What’s more, it’s in a great area — only four blocks from Central Park. What’s the catch? Well, the listing bills itself as having two bedrooms, but one of them is interior, so it doesn’t have windows (meaning it’s also not a legal bedroom, although it’s been nicely done). The current owner, however, has done a lot to maximize light: a lot of mirrored walls, glossy white surfaces, and built-in light fixtures. There’s also the maintenance, which, at $3,925 a month, is pretty high, especially considering the doorman is only part-time. The amenities seem nice — a tranquil courtyard with a waterfall and seasonal plantings, a bicycle room, storage — but are hardly lavish. An Upper West Side one-bedroom for $499,000 167 West 73rd Street, Apt. 4 { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Corcoran", "contentUrl": "https://pyxis.nymag.com/v1/imgs/a70/753/80202e445477bb5faad7052bf31a8927b8-167-West-73rd-Street--4.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: Corcoran This apartment, on the first floor of a brownstone, is surprisingly lofty and modern, with 12-foot ceilings and an open floor plan. The living room is a 15-by-15-foot space, with a kitchen at one end — nicely appointed, although the finishes are a little out of date — and a bedroom off the other. The bedroom is small, but the high ceilings help it feel airy. The apartment also opens directly onto a brick-paved, 50-foot-wide communal garden, and the building is located a block and a half from the 72nd Street 2/3 trains, equidistant from Central and Riverside Park. The maintenance, at just over $2,000 a month, is a little steep, but it does include internet and basic cable. Pieds-à-terre and subletting (after a year) are also permitted. A one-bedroom in Park Slope for $795,000 235 Lincoln Place, Apt. 5B { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Brown Harris Stevens", "contentUrl": "https://pyxis.nymag.com/v1/imgs/19b/0aa/7bb7bce3b50bae5b71c3994e53d6312a07-235-Lincoln-Place--5B.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: Brown Harris Stevens Here’s a gracious one-bedroom in North Park Slope, close to the Park and Grand Army Plaza, with an elegant layout: a big foyer, with a large living room on one side, the bedroom on the other, and a kitchen in the middle. The living room is spacious enough for a dining area, and the bedroom is also wide enough for a king and a lot of other furniture besides. There are ample closets, windows in every room, hardwood floors, and a bathroom with a beautiful old bathtub, black-and-white tile, and a pedestal sink. The building is pet-friendly, with a full-time doorman, a pretty lobby, bike storage, and storage spaces that trade with the apartment. Related Why These $20 Million Uptown Co-ops Aren’t Selling Battery Park City’s Early-Aughts Rentals Go Luxe The Bohemians of Sutton Place Tags: under a million the real estate on the market astoria park slope lenox hill More Show Leave a Comment A One-Bedroom in a Former Steinway Piano Factory for $519K const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'curbed'; const keywords = ["under a million","the real estate","on the market","astoria","park slope","lenox hill"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript = document.createElement('script'); ldJsonScript.type = "application/ld+json"; ldJsonScript.innerHTML = JSON.stringify(structuredData); document.head.appendChild(ldJsonScript);'''
