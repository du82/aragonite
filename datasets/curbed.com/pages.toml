["https://www.curbed.com/article/brownstone-renovation-big-window-trend.html"]
title = "Why Does Every Renovated Brownstone Have a Glass Back Wall?"
description = "Installing a Big Window in the back of a historic brownstone has become a ubiquitous trend. How did we get here?"
full_description = '''real estate trends Feb. 28, 2025 Do You Have a Big Window? By Clio Chang, a Curbed writer who covers everything New York City Photo-Illustration: Curbed; Photo: Richard Powers Like many big things, the Big Window is instantly recognizable. If you’re doing some fantasy browsing of Brooklyn brownstones during the workday, you’ve surely clicked through a slideshow of tastefully staged rooms and come across a giant glass window overlooking a backyard — like this enormous two-story glass wall opening into the garden of an $8.4 million Carroll Gardens townhouse or the wall-to-wall sliding glass doors on this $13 million brownstone in Cobble Hill. It can be jarring to see what looks like a slab of Chelsea warehouse transferred to the back of an otherwise staid rowhouse, but Big Window is a point of pride and sometimes even the hero image of the listing. What if you could be the owner of a Big Window too? Of course, the Big Window is not new per se — creative homeowners have been putting glass walls in the back of their townhouses for decades. But now it seems almost standard for a townhouse renovation. Brick Underground even published a “how to” guide for homeowners. “The idea is to have a historical brownstone in front and a modern building in the back, so it’s a trend that allows people to get both the things they want,” said Alex Maroni, the Douglas Elliman broker representing the Carroll Gardens listing. Converting the back brick wall into a glass one is, in fact, often the first thing architects recommend during a townhouse renovation. “I’m trying to think of a project that we’re not doing it on,” said Brendan Coburn, principal at Brooklyn Studio, an architecture and interior-design firm that specializes in historic rowhouses. After a pause: “I can’t think of one.” How did we get here? { "@context": "http://schema.org", "@type": "ImageObject", "author": "Douglas Elliman", "contentUrl": "https://pyxis.nymag.com/v1/imgs/dfc/508/442379e8143910d2d74216457bdc4fa98d-405-Sackett-Street-exterior.2x.rvertical.w570.jpg" } { "@context": "http://schema.org", "@type": "ImageObject", "author": "Douglas Elliman", "contentUrl": "https://pyxis.nymag.com/v1/imgs/6b7/281/257fff24fcf2a0d4158a9a78a84c33285e-405-Sackett-Street-big-window.2x.rvertical.w570.jpg" } The front and back of this $8.5 million Carroll Gardens townhouse with a Big Window as its hero image in the listing. Douglas Elliman. The front and back of this $8.5 million Carroll Gardens townhouse with a Big Window as its hero image in the listing. Douglas Elliman. Some of this trend is undeniably due to the influence of architect Elizabeth Roberts, who developed a cult following for this signature move. “You can’t Google or Pinterest ‘Brooklyn townhouse’ without an image of an Elizabeth Roberts project coming up,” a colleague told the New York Times in 2019. There were also a few converging factors that set the stage for Big Window to go into overdrive: When brownstones were built in the 1800s, the garden floor was historically used as servants’ quarters and the garden itself for utilitarian tasks like drying the laundry; in more recent decades, as brownstones became more valuable and stuffing live-in servants into your basement more gauche, they turned into rich people’s single-family homes, and the garden and garden-level interiors became parts of the main unit. Unifying all these spaces both visually and literally with big glass openings just makes sense in this new reality. “Before, the backyard and that ground floor were really just in service of the house, not a part of the house,” Coburn said. “The trend comes as an extension of gentrification turning these houses into whole family houses.” { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Nick Glimenakis", "caption": "The Big Window in the back of a Bushwick townhouse renovated in partnership with the Brownstone Boys.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/e41/11a/27652f22c4ef2fc1f3ecb73952046e2892-BBxCynthia-kitchen.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } The Big Window in the back of a Bushwick townhouse renovated in partnership with the Brownstone Boys. Photo: Nick Glimenakis Plus, a common issue rowhouses have is a lack of light, which a huge window helps fix. “Nine out of ten clients we work with have a photo of a large glass opening in their Pinterest board, a lot of which is shot outside New York,” said Jordan Slocum, an interior designer who makes up one half of the Brownstone Boys. Buyers pine over the Roberts-esque big windows in Brooklyn townhouses but also the ones they see in modern houses upstate. And while there are stringent limits to what someone can do to the front of a landmarked townhouse, the back usually has much more flexibility, especially if it’s hidden from the street. Modifications still have to go through the Landmarks Preservation Commission, which Coburn says is typically interested in preserving a certain proportion of masonry to glass and prefers that owners install glass openings on the garden and parlor floors while keeping the top two floors intact. (Even the commission’s guidebook showcases a Big Window in its mock drawing of a rear addition.) { "@context": "http://schema.org", "@type": "ImageObject", "author": "Brown Harris Stevens", "contentUrl": "https://pyxis.nymag.com/v1/imgs/902/643/4443813e115f6884f1cec4629be3d18818-360-West-123rd-Street-front.2x.rvertical.w570.jpg" } { "@context": "http://schema.org", "@type": "ImageObject", "author": "Brown Harris Stevens", "contentUrl": "https://pyxis.nymag.com/v1/imgs/fa8/2e3/85c184ed244e144aca0292332659c9c0ba-360-West-123rd-Street.2x.rvertical.w570.jpg" } The listing photos for the front and back of a townhouse in Harlem showcasing a classic Big Window. Brown Harris Stevens. The listing photos for the front and back of a townhouse in Harlem showcasing a classic Big Window. Brown Harris Stevens. And then there are the finances of doing it. As the value of brownstones went up and buyers became wealthier, the buildings themselves were getting older. Coburn estimates that around the 1990s, these factors converged so that the brownstones were more likely to need gut renovation and the people who bought them were more likely able to afford them. Townhouses that had south- or west-facing back walls were especially degraded since roofs usually drain to the back of the house and the water would soak the brick and loosen the mortar as it expanded and contracted with the sun and the freezing temperatures. If you’ll already have to replace the wall, why not put in a gigantic window while you’re at it? It can cost anywhere from $100,000 to $150,000 to demolish and renovate a back wall, plus $50,000 to $200,000 more to put in the glass wall, depending on what kind of system you’re looking for. The Big Window does have some drawbacks, however. Barry Bordelon, a Compass agent and the other half of the Brownstone Boys, points out that if you’re trying to maintain the historic integrity of the house, you won’t want to convert the back into glass. And New York City backyards are infamously full of mosquitoes. “The weather is rarely good enough that you really want to open an entire wall of your house to the outside,” Bordelon said. “It’s usually too cold or too hot, and the bugs are a real problem.” Aside from the extra installation costs, there are also the increased heating and cooling expenses from having a less insulated back wall. For clients for whom a Big Window is not exactly right, they have another suggestion: What about a Big Door instead? Related A Globe-Trotting Writer’s West Village Townhouse Is Anyone Using Their Tiny Balconies? Tags: the real estate brownstones big window windows architecture real estate trends brownstone boys More Show Leave a Comment Do You Have a Big Window? const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'curbed'; const keywords = ["the real estate","brownstones","big window","windows","architecture","real estate trends","brownstone boys"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript = document.createElement('script'); ldJsonScript.type = "application/ld+json"; ldJsonScript.innerHTML = JSON.stringify(structuredData); document.head.appendChild(ldJsonScript);'''
