title = "The Best Hair Braiding Shops in NYC 2024"
description = "Our carefully vetted list of the best hair-braiding shops in NYC includes salons where you can get intricate cornrows, long-lasting boho braids, and book a braider who is especially patient with kids and tender-headed adults."
full_description = '''best of new york Updated Mar. 15, 2024 The Best Hair Braiders in New York By Tembe Denton-Hurst, a writer at the Strategist covering beauty and books. She joined the site in 2020. Previously, she wrote about beauty and culture for Nylon and Elle. Best of New York New York Magazine’s own Yellow pages, containing exclusively excellent places. Best of New York New York Magazine’s own Yellow pages, containing exclusively excellent places. Photo-Illustration: Curbed; Photo Getty Images To find the braiders on this list, we polled dozens of New Yorkers with braids, including writers, models, and makeup artists. They told us about the stylists they trust to perfect a braided bob, create knotless box braids, create intricate cornrows, and style Bantu knots, all with great care and attention to detail. Some of these salons even take walk-ins or make house calls across the five boroughs. For Any Kind of Cornrow Brittney J Hair, 607A Vanderbilt Ave., Prospect Heights; 240-659-8723 Tucked between a honky-tonk bar and an Italian café is Nicko’s Unisex Salon, a barbershop–slash–hair salon that offers crisp lineups, well-blended fades, and exceptionally neat braids. The braider on staff is cosmetologist Brittney JoLette, who can do any kind of cornrow — straight back, swirly parts, and stitch braids (from $50). Cornrows are among the most basic braiding styles but aren’t the easiest to pull off. Clean parts and neatness are key, which wardrobe stylist Alexander-Julian Gibbson says JoLette has mastered. He visits her every three to four weeks and switches between cornrows, plaits, and twists. “She takes care of everything,” he says, including “washing and blow-drying without charging extra.” The full-service aspect is why model Enga Domingue is also a fan, saying she received a complimentary trim when her ends were “so fried” after Fashion Week. “She always goes above and beyond for her services and is communicative and punctual, which can be really hard to find in a braider, respectfully,” Domingue says. “She has worked with me many times and even for super-short-notice calls.” For Walk-ins Aminata African Hair Braiding, 289 St. Nicholas Ave., second floor; 212-932-0433 These days, many braiders (especially the ones you’ll find on Instagram) are available by appointment only, but there are still plenty of traditional African braiding shops, which you can walk right into, doing solid, neat work. Located above a Checkers just off 125 Street in Harlem, Aminata African Hair Braiding has been a reliable spot for over 30 years, offering fair pricing (mid-back knotless braids from $160) and quick styling. “It’s an institution in Harlem,” says Shaquela Myrick, a marketing strategist who visited annually for cornrows when she lived in the neighborhood. Also on offer are Beyoncé-inspired Lemonade braids, feed-in ponytails, and braided bobs, and an empty chair is typically ready and waiting. “I was always able to walk in, sit down, and be worked on right away,” says Myrick. The stylists are also quick. Hairstyles that might take upwards of four hours take less time here, where there may be two braiders or more working on a client at a time. The salon also provides the hair for most styles at no additional charge. For Boho Braids TropixBraids, Contact for location; 347-866-0063; tropixbraids.as.me The latest evolution of box braids are boho braids, which feature curly tendrils sprouting from the plait to give the wearer an ethereal, not-quite-a-sew-in-but-still-wet-and-wavy look. They aren’t easy to get right, but Shanna St. Cyr of TropixBraids has made them her signature (from $400). Braider to a cadre of beauty editors and writers — EveryStylishGirl founder Nana Agyemang is a client along with Vogue editor Naomi Elizée, who heard about her from Essence senior fashion editor Devine Blacksher — she’s beloved for her neat braids and ability to take an inspiration photo and make it her own. “She adds a little fun and variation to match your personality,” says Elizée. Blacksher, who has been going to St. Cyr for six years, agrees. When St. Cyr first did her hair back in 2017, she hadn’t gotten braids since high school, and didn’t know exactly what to get. St. Cyr helped her figure out the right hair, style, and size to accommodate her one request: “Everything has to fit under this bucket hat.” She started with box braids, but in the years since, Blacksher has had everything from cornrows to feed-ins to Bantu knots and eventually those boho braids. “I got them for my birthday trip to Brazil last year and was diving in the ocean with them and they still looked good after,” she says — unusual for a style that can shed and get messy after a week or two of wear. She kept hers in for a month. . Ask a Braider Shanna St. Cyr, owner of Tropixbraids { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Pete Gamlen", "contentUrl": "https://pyxis.nymag.com/v1/imgs/cb2/073/7c4ef1275b1aeb3fdce6c24f2119d58352-0624STR-BoNY-shanna-final-cmyk.2x.rsquare.w570.jpg", "width": "1140", "height": "1140" } } Illustration: Pete Gamlen You ask clients to bring a specific brand of hair called Ruwa. Why?I look for a lot of things when it comes to braiding hair. Is it light? Will it frizz after dipping it in hot water? Ruwa is my go-to. It’s lightweight, it stays smooth after being dipped, and it just looks good. It’s also anti-itch, which is important for my clients with allergies. Is there a brand that’s completely allergen free?For clients who have really bad allergies, I recommend cleansing the hair before putting it in — dip the hair in warm water with a little apple-cider vinegar and let it dry. That way, you break down some of the chemicals that are on the hair. Do you only work with synthetic hair?No. For clients who prefer human hair, I use it. It blends in well with your natural hair, you won’t have a problem with itching, you can wash and reuse it, and it gives a more natural look. But I do think using synthetic hair makes sense: It’s less expensive, and you get longer strands than with human hair. You ask that clients come alone. Why is that?I love a one-on-one session. As women, when we’re able to get a service done, we want to be able to relax, just sit in that moment. And for me, braiding is not just a service. I get to talk to women, mentor women, and it becomes an experience. There’s no distraction. I have moms that are sometimes like, “Hey, is it possible to bring my child? I don’t have someone to babysit.” I make exceptions for that. Any advice for someone coming in for the first time?Know what you want. That’s most important. — Katie Arnold-Ratliff For Kids (and Tender-Headed Adults) HairMuse, Contact for location; 929-340-6167 Braiding can be a long and sometimes uncomfortable process, which is why many stylists won’t service young, squirming, impatient kids. But Terrye Morgan, known to her clients as Hairmuse, has a special touch. She’s “very patient,” says Nico DaCosta-Finocchio, a permanent-makeup artist who has been taking her daughters to see Morgan for the past three years. She was looking for someone who would be sweet and kind to her twins, Parker and Paiden, then 5, and saw Real Housewives of New York City star Sai De Silva posting about her and her daughter going to Morgan and she was sold. DaCosta-Finocchio was impressed with her bedside manner (offering snacks and suggesting an iPad placement that wouldn’t strain her kids’ necks) and her emphasis on hair health. “She is gentle on my twins’ edges and their hair in general,” she says. Her soft touch means she’s loved by tender-headed adults as well. Recently, writer Hunter Harris went to her for knotless braids (starting at $150) and said it was the most lightweight install she’s ever had. “By hour five or six, I honestly thought we weren’t even halfway because I couldn’t feel any braids,” she says. “Then she told me I was done.” Clients can do their own braid prep or have Morgan shampoo and blow-dry their hair. For Off-Menu Styles Slayed in Braids, 380 Mother Gaston Blvd., Brownsville; 347-557-2803; slayedinbraids.as.me Helena Koudou can braid swirls, stars, S-curls, and dollar signs into scalps, transforming straight backs into an art piece. She specializes in editorial hairstyles, and her work regularly pops up in fashion magazines and art exhibitions — Koudou did the hair for Josef Adamu’s photo series “The Hair Appointment.” Her service list includes intricate freestyle braids (from $200), beaded cornrows (from $190), and every style box braid you can think of (from $80) — but she can also do just about anything her clients come up with. “She loves to collaborate,” says author and model Kendra Austin. “And she can also do simple styles meticulously.” Delisa Shannon, a supervising producer at Rolling Stone, brought Koudou pictures of the Mary Jane Girls and Da Brat — shoulder length, heavily beaded — and from there, they came up with hime-style braids that frame Shannon’s face. Koudou works out of a family-owned shop in Brooklyn, a low-key spot in Brownsville, but she also does house calls, convenient for those who WFH. Another benefit: She has a light hand, ideal for anyone who is tender-headed or has struggled with too-tight braids. Austin says, “You almost wouldn’t believe the braids would be tight enough to last, but they always do.” Thank you for subscribing and supporting our journalism. If you prefer to read in print, you can also find this article in the March 11, 2024, issue of New York Magazine. Want more stories like this one? Subscribe now to support our journalism and get unlimited access to our coverage. If you prefer to read in print, you can also find this article in the March 11, 2024, issue of New York Magazine. More From Best of New York The Best Window Shades in New York The Best Fish Markets in New York The Best Wine & Spirits Shops in New York See All Tags: remove interruptions best of new york new york magazine Show Leave a Comment The Best Hair Braiders in New York const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'curbed'; const keywords = ["best of new york","new york magazine","remove interruptions"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript = document.createElement('script'); ldJsonScript.type = "application/ld+json"; ldJsonScript.innerHTML = JSON.stringify(structuredData); document.head.appendChild(ldJsonScript);'''
