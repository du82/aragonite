["https://www.curbed.com/article/empire-state-building-dynamic-pricing-observation-deck-tickets.html"]
title = "The Empire State Building Adopts ‘Dynamic Pricing’"
description = "The Empire State Building will charge more for access to its famous observatory deck at times of high demand, according to a recent earnings call."
full_description = '''tourism Feb. 21, 2025 Surge Pricing Comes to the Empire State Building By Zach Schiffman, a senior social media editor across New York Magazine Photo: Roy Rochlin/Getty Images The Empire State Building, which has inexplicably become a necessary celebrity-press-junket stop, is planning to enact “dynamic pricing” for access to its famous observation deck. Tony Malkin, CEO of Empire State Realty Trust, revealed the plan in the company’s fourth-quarter earnings call on Thursday. Ticket prices already vary depending on time of day (up to $90 for a sunset viewing) or levels of fame ($0 if you are willing to debase yourself in one of its TikToks), but the new policy would algorithmically “monetize high-demand times through the day,” according to Malkin. The observatory is on an apparent upswing in popularity: According to Crain’s New York Business, its net operating income was $28.5 million for the fourth quarter of 2024, up 6 percent year over year. “We expect continued growth in 2025,” Malkin said Thursday. As congestion pricing hangs in the balance (maybe?), a version of it will live on at the most attention-hungry building in New York City. Beautiful! Related My Morning on the Beam I Rode the Skylift (Twice) Tags: tourist attractions observation decks cityscape surge pricing midtown congestion pricing tourism empire state building More Show Leave a Comment Surge Pricing Comes to the Empire State Building const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'curbed'; const keywords = ["tourist attractions","observation decks","cityscape","surge pricing","midtown","congestion pricing","tourism","empire state building"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript = document.createElement('script'); ldJsonScript.type = "application/ld+json"; ldJsonScript.innerHTML = JSON.stringify(structuredData); document.head.appendChild(ldJsonScript);'''
