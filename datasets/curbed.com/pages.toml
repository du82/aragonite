title = "NYC Apartments Under a Million: East Village, Sutton Place"
description = "Here are some apartments to buy in New York City for under a million dollars, including one-bedrooms in the East Village, Sutton Place, and Jackson Heights and a studio in the West Village."
full_description = '''under a million Feb. 11, 2025 A Spacious East Village One-Bed With Heated Bathroom Floors for $900,000 By Kim Velsey, Curbed’s real-estate reporter This East Village one-bedroom, as shown in listing photos, has a sprawling living and dining room with a row of windows — one of several features that give the apartment an open, airy feel. Photo-Illustration: Curbed; Photo: Nest Seekers International For under a million dollars, one can find all sorts of housing configurations: park- and subway-adjacent studios, one-bedrooms hidden in carriage houses or former shoe factories, and even the occasional true two-bedroom. We’re combing the market for particularly spacious, nicely renovated, or otherwise worth-a-look apartments at various six-digit price points. This week, a made-for-TV West Village studio and a Neo-Georgian one-bedroom in Jackson Heights with spectacular doorways. A one-bedroom in the East Village for $899,999 224 East 7th Street, Apt. 6 { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Nest Seekers International", "caption": "The one-bedroom, as shown in listing photos, has a circular floor plan with sliding doors to the bedroom from the living room, a pass-through kitchen, and an office nook off the foyer.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/ee6/3eb/740616f19bea9ff80f10e25ae6254df09b-224-East-7th-Street--6-secondary.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } The one-bedroom, as shown in listing photos, has a circular floor plan with sliding doors to the bedroom from the living room, a pass-through kitchen, and an office nook off the foyer. Photo: Nest Seekers International This one-bedroom in the East Village is nothing like the chopped-up apartments so endemic to the neighborhood, but it does have a somewhat unusual circular layout with a renovated, pass-through kitchen off the living room. There’s a big central living/dining room with a wall of high arched windows overlooking a quiet leafy street and built-in bookshelves, plus exposed brick in two rooms. It’s all very open and airy with plenty of comforts as well: an office nook off the foyer, a subway-tiled bathroom with heated floors, an in-unit washer and dryer, and rentable storage units downstairs. Located on the second floor of a building between Avenues B and C, about a block from Tompkins Square Park — not the most convenient location for catching the subway, but it’s a quick walk to Veselka and Superiority Burger. A Sutton Place one-bedroom for $725,000 333 East 53rd Street, Apt. 11A { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Corcoran", "caption": "This Sutton Place prewar, as shown in listing photos, has undergone a sophisticated renovation and now has wide-plank white oak floors in the living room and a kitchen with freezer and fridge drawers.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/9b5/fd6/74c3d10f733a8dffbac2995ef4c66f4600-333-East-53rd-Street--11A.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } This Sutton Place prewar, as shown in listing photos, has undergone a sophisticated renovation and now has wide-plank white oak floors in the living room and a kitchen with freezer and fridge drawers. Photo: Corcoran Sutton Place has a reputation for being a little stodgy, but this one-bedroom is pretty sophisticated. The listing refers to the 13.5-by-26.5 living and dining room as “the salon,” which would come off as pretentious in most apartments but actually feels appropriate here. It has white coffered ceilings, wide-plank white-oak floors, and pale blue-gray walls, along with its own wraparound terrace paved in terracotta tiles. The elegant furnishings (not included) help, of course, but the apartment really has been stylishly overhauled with a custom closet in the bedroom and a galley kitchen with bespoke cabinetry, an integrated dishwasher, and fridge and freezer drawers. As this is in a prewar co-op, there are also windows in every room, high ceilings, and plenty of closets. The maintenance, at just over $2,000 a month, is kind of a lot for a one-bedroom, but the building is full-service with a full-time doorman, a live-in property manager, individual storage bins, a landscaped roof deck, and a gym. Like many old-fashioned white-glove co-ops in the neighborhood, however, subletting and pieds-à-terre are not allowed. But you are a short walk from Trader Joe’s, Bloomingdale’s, and the East River, so it’s a very convenient place to live full time. A West Village studio for $699,000 350 West 12th Street, Apt. 1B { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Brown Harris Stevens", "caption": "High ceilings, a huge antique mirror, and storybook windows overlooking a private garden make this studio, as shown in listing photos, feel airy.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/490/1ec/af3b44784b7c06bc3ece155b09a19a01ac-350-West-12th-Street--1B.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } High ceilings, a huge antique mirror, and storybook windows overlooking a private garden make this studio, as shown in listing photos, feel airy. Photo: Brown Harris Stevens Located on a dreamy cobblestone block in one of the city’s dreamiest neighborhoods, this apartment studio looks like something out of a Darren Star show. It has 11-foot ceilings and big six-over-six south-facing windows that overlook the Beaux Arts building’s private garden. The decorative marble mantlepiece and huge antique floor-to-ceiling mirror make the studio feel much more expansive than it is. The kitchen is teensy but cute — it has marble countertops and a two-seater breakfast bar. The heating and air conditioning is a split system, controlled individually but included in the monthly maintenance of just over $1,000 a month. It’s a sweet full-time place or a glamorous spot to stay while in the city — pieds-á-terre are also allowed. A one-bedroom in Jackson Heights for $460,000 35-26 79th Street, Apt. 43 { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Compass", "caption": "This Jackson Heights one-bedroom, as shown in listing photos, has dramatic keyhole and pointed-arch doorways in addition to warm wood details.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/48b/0bc/655bc4f528b4c9b8aa9fb078842c03b5b0-35-26-79th-Street--43.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } This Jackson Heights one-bedroom, as shown in listing photos, has dramatic keyhole and pointed-arch doorways in addition to warm wood details. Photo: Compass Most of New York’s prewar co-ops hew to a similar Art Deco aesthetic, but this elegant Jackson Heights one-bedroom in the Hampton Court apartments, built in 1919, is full of warm wood details and Neo-Georgian pointed archways. Thanks to the layout of the building, both the living room and bedroom have corner exposures. It’s also really gracefully proportioned with a full living room and a dining room open to the kitchen (a lovely layout that’s rarely used). There’s a foyer with a coat closet and a keyhole doorway into the apartment, wood-framed windows that have open sky views, and a classic white-tiled bathroom with a big tub. The kitchen, with white, wood-trimmed cabinets and terracotta floors and backsplash, looks a little retro, but in a good way. The apartment is located in an 11-building complex, built around a block-long central garden, with storage, a bike room, and a very reasonable $620 monthly maintenance. It is, however, about an eight-minute walk to both the R and 7 trains. Related A Cabin in the Middle of St. Marks Place Greenwood Heights Is Park Slope II Tags: under a million nyc real estate listings on the market unaffordable housing affordable housing jackson heights west village east village sutton place the housing market nyc real estate More Show Leave a Comment A East Village One-Bed With Heated Bathroom Floors for $900K const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'curbed'; const keywords = ["under a million","nyc real estate listings","on the market","unaffordable housing","affordable housing","jackson heights","west village","east village","sutton place","the housing market","nyc real estate"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript = document.createElement('script'); ldJsonScript.type = "application/ld+json"; ldJsonScript.innerHTML = JSON.stringify(structuredData); document.head.appendChild(ldJsonScript);'''
