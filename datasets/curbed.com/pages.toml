["https://www.curbed.com/article/best-cake-shops-nyc.html"]
title = "The Best Cake Shops in NYC 2024"
description = "Our carefully vetted list of bakeries where you can get the best cakes in New York City includes the perfect place for a last-minute birthday cake in chocolate or vanilla, a classic strawberry shortcake, or decorative cakes with fresh flowers."
full_description = '''best of new york Updated Mar. 13, 2024 The Best Cake Shops in New York By Emma Wartzman, a kitchen and dining writer at the Strategist. Previously, she was an editor at Bon Appétit and has worked in food media for nine years. Best of New York New York Magazine’s own Yellow pages, containing exclusively excellent places. Best of New York New York Magazine’s own Yellow pages, containing exclusively excellent places. Photo-Illustration: Curbed; Photos: Getty To find the best cake shops in New York, we polled dozens of food writers, bakers, and store owners on where they find the best cakes. We found shops where you can get a custom cake piped and frosted for a party less than two days away and a place in Queens where you can get Chinese and Taiwanese desserts like egg tarts and red-bean buns every morning. Plus we found the best old-fashioned strawberry shortcake in the city. For Classic Strawberry Shortcake Veniero’s, 342 E. 11th St.; venieros.com Everything about this 129-year-old East Village bakery is old-school and distinctly Italian — from the mirrored walls to the intricately tiled floors and the grand swaths of stained glass on the tin ceiling. Cannoli, rainbow cookies, and biscotti line the pastry cases, but one of its most popular desserts is strawberry shortcake. Event planner Pejy Kash has been eating it for the past 20 years. “I’ve had strawberry shortcake everywhere,” he says, but nothing compares to Veniero’s “really airy” version. Coming Soon owners Fabiana Faria and Helena Barquet love it too. Faria first ordered it for Barquet’s birthday in 2021. “It’s old-fashioned, but that’s what I like,” Barquet says of the “spongy yellow cake” and “super-fresh strawberries in every layer of whipped cream.” It’s served by the slice ($7.50) in the café, and whole cakes are available for purchase. For Kids’ Birthdays Red Gate Bakery, 68 E. 1st St.; redgatebakery.com Over the past eight years, Greg Rales went from starting a bakery in his apartment to being the head baker at Flour Shop to opening his own place. Here, the case is filled with layer cakes that draw on “familiar, old-fashioned, and nostalgic” flavor combinations, says writer Charlotte Druckman. The Chocolate Peanut-Butter Pretzel Cake (from $60 for a six-inch), for instance, is reminiscent of a Reese’s cup with salty, crunchy pretzel-caramel crumble and peanut-butter buttercream that’s “so freaking smooth and almost whipped,” Druckman says. She commissioned a cake inspired by a mocha-almond-fudge ice cream she grew up eating that Rales “distilled into cake form perfectly,” she says. Actual kids’ cakes make up about 20 percent of the orders in more basic flavors, like a yellow birthday cake with chocolate-sour-cream frosting (from $50 for a six-inch), based on one Rales’s grandmother used to make. Cookbook author Ali Rosen has ordered several versions of a strawberry cake for her kids here. “They love it,” she says. Plus it “tastes like real strawberries” without any “cloying” fake flavoring, which means grown-ups enjoy it too. For Chinese and Taiwanese Desserts Yeh’s Bakery, 5725 Main St., Flushing; yehs-bakery.com Nestled between a Chase bank and a T-Mobile store, Yeh’s Bakery is easy to miss, but this Queens shop has been operating for over 30 years. The inside is bare bones, just a couple of refrigerated cases for the main attractions: egg tarts, red-bean buns, and traditional Chinese and Taiwanese layer cakes decorated with kiwi slices. The “super-aerated, superlight sponge cake” with whipped cream in the middle has turned dessert-maker Mina Park into a regular. Yeh’s sells “huge, lumpy, and kind of amorphous-looking” whole rounds of its Boston cream pie ($19), Park says, and a Black Forest cake ($12 for a seven-inch) that has “a light Wendy’s Frosty level of chocolate flavor.” But her favorite is a plain piece: “The sweetness is mellow, and the texture is perfect. There’s no resistance when you put your fork through. It’s one fluffy bite.” For Fresh Flowers From Lucie, 263 E. 10th St.; fromlucie.com At the pandemic’s start, Lucie Franc de Ferriere began baking cookies and banana bread for Sunday to Sunday, her fiancé’s new coffee shop. She then decided to sell her cakes, open-sided and adorned with loads of fresh flowers — stems, leaves, and all — through Instagram and at pop-ups. Franc de Ferriere’s fast following came thanks to her aesthetic, “the antithesis of the perfectly smooth, symmetrical bakery layer cake,” says Cherry Bombe founder Kerry Diamond. “They’re the Shabby Chic of cakes.” Franc de Ferriere now sells at her storefront, which opened in January 2023. Creative director Anna Polonsky ordered a strawberry-yogurt cake with basil for a birthday (from $120 for an eight-inch double-layer) and came by in March for a “very carroty” carrot-cake slice with fromage-frais buttercream (“Somewhere between yogurt and sour cream,” says Polonsky). Her favorite is a simple flourless chocolate cake topped with a messy dollop of whipped cream and a sprig of chamomile ($10). Biting into the flower “is actually quite fun,” Polonsky says. “It brings a little sweetness and a little spice.” For Southeast Asian Ingredients Lady Wong, 332 E. 9th St.; 135 W. 50th St.; ladywong.com Ten kinds of traditional kuih, or bite-size snacks, are available at Lady Wong — like seri muka pandan, a steamed custard cake atop glutinous rice that reminds writer and editor Tatiana Bautista of the Philippines, where “the air smells like pandan.” Owners Seleste Tan and Mogan Anthony like to mix traditional flavors with French and American techniques. Take their peanut-butter cake ($60 for an eight-inch), a favorite of baker Zoë Kanan, which features two layers of “super-moist, rich” devil’s-food cake, chocolate ganache, peanut-butter buttercream, a crunchy peanut-butter feuilletine, and a creamy peanut-butter gula melaka, or “bitter, caramelized” unrefined coconut-palm sugar that “underscores the cacao,” Kanan says. “Having something crispy to bite down on in the midst of all those velvety layers helps unlock and exaggerate flavors.” For Last-Minute Orders Ladybird Bakery, 1112 Eighth Ave., Park Slope; ladybirdbakery.com Customized cakes from this 32-year-old Brooklyn bakery can be ready in as little as 48 hours, and Ladybird’s are as classic as it gets — smoothly frosted, expertly piped roses adorn the perimeter, a loop of cursive messaging on top. But even with the quick turnaround, customers aren’t limited to basic flavors. Baker Tanya Bush submitted a last-minute order for the lemon cake with a “supple crumb” and “light and airy” strawberry mousse. For the past 20 years, Collyer’s Mansion owner Mauri Weakley has been ordering the “super-moist” Brooklyn Blackout Cake (from $43 for a six-inch), which is so chocolaty, she says, “two bites and you’re to the moon.” And with very little lead time for her sister’s birthday this year, writer and producer Emily Sundberg ordered a fluffy chocolate cake with chocolate mousse flecked with “bits of hard chocolate that melt in your mouth” and topped by a Real Housewives of New York quote. If you have even less time, Sundberg says, you can pick up ready-made cakes the same day — as she did for a yellowcake with raspberry jam and vanilla buttercream. “You can actually taste the tang of the butter,” she says. . Ask a Baker Evelyn Luciano, owner of Ladybird Bakery in Park Slope { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Pete Gamlen", "contentUrl": "https://pyxis.nymag.com/v1/imgs/ae0/efa/bfdeda6093c2aa3dece43f8a4d3e3e776d-0624STR-BoNY-evelyn-final-cmyk.2x.rsquare.w570.jpg", "width": "1140", "height": "1140" } } Illustration: Pete Gamlen What’s the shop’s most beloved cake?We’re known for our blackout cake: a dark-chocolate cake with chocolate pudding in the middle and fudge frosting on top. People looking for something simpler often go for our dark-chocolate or yellow cake with buttercream frosting. We sell vanilla frosting the most. What flavor combo are most people missing out on?Oh, almond cake with raspberry jam and chocolate frosting, by far. Wow, you absolutely did not hesitate.It’s my go-to. You get the richness from the almond and the tart from the jam. It’s one of the best combinations. What’s your best advice on storing leftover cake?You can freeze most cakes and they’ll be fine. But in general, you can go a couple of weeks with our cakes in the fridge, wrapped in plastic wrap. I know this because we closed in March 2020 for three months. We were not planning on reopening because of everything going on, so my husband and I were like, “Well, what else are we going to do with all these cakes?” We ate them. And even after a few weeks, those cakes were moist and delicious. Are there any flavors of cake you don’t like?I think lemon cake with chocolate frosting is a bizarre combination, but people love it. They get it all the time — they’ll do a lemon cake with lemon curd and chocolate buttercream, and I just don’t get it. I always ask, “Have you had this before?” and they’re always like, “Yeah, I love it!” — Katie Arnold-Ratliff Thank you for subscribing and supporting our journalism. If you prefer to read in print, you can also find this article in the March 11, 2024, issue of New York Magazine. Want more stories like this one? Subscribe now to support our journalism and get unlimited access to our coverage. If you prefer to read in print, you can also find this article in the March 11, 2024, issue of New York Magazine. More From Best of New York The Best Window Shades in New York The Best Fish Markets in New York The Best Wine & Spirits Shops in New York See All Tags: remove interruptions best of new york new york magazine Show Leave a Comment The Best Cake Shops in New York const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'curbed'; const keywords = ["best of new york","new york magazine","remove interruptions"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript = document.createElement('script'); ldJsonScript.type = "application/ld+json"; ldJsonScript.innerHTML = JSON.stringify(structuredData); document.head.appendChild(ldJsonScript);'''
