title = "The Case Against the Alexander Brothers: Everything We Know"
description = "The latest updates on the downfall of the former powerhouse agents Oren and Tal Alexander, along with their brother, Alon Alexander, who are accused of sex trafficking and rape and are currently in prison awaiting trial on federal charges."
full_description = '''operators Updated Feb. 28, 2025 Everything We Know About the Case Against the Alexander Brothers By Bridget Read, features writer at Curbed who reports on housing in New York City. She has been at New York Magazine since 2019. Photo: Matias J. Ocner/Pool/Getty Images Oren, Alon, and Tal Alexander were powerful, successful brothers who seemed to be on top of the world before June 2024. Oren and Tal were two of the country’s top luxury real-estate brokers. Their brother Alon was an executive at their family’s security firm. All three were handsome fixtures on the party scenes in Manhattan and Miami. Then the news broke that they had been accused by two women of rape and sexual assault. Another lawsuit followed. And the floodgates opened. Now they are all sitting in jail in Brooklyn awaiting trial, having been indicted by the federal government and arrested on charges of running a sex-trafficking scheme for more than a decade. The brothers are alleged to have formed a pattern of seducing women, drugging them, and assaulting them, according to prosecutors who claim to have spoken to at least 60 women who say they are victims of one or more of the brothers. At least 17 women have now filed lawsuits alleging the same pattern of behavior. A trial has been set for January, but in the meantime, authorities have continued to release new information — and the brothers continue to defend themselves. Here’s everything we know about the case against the Alexanders. Who are the Alexander brothers? Oren, Tal, and Alon Alexander were born and raised in the exclusive enclave of Bal Harbour, Florida, north of Miami Beach. Tal, the older brother, was born in 1986; Oren and Alon, the twins, were born less than a year later. Their parents, Orly and Shlomy, are Israeli immigrants who built a successful home-security company. Shlomy eventually became a luxury real-estate developer. After college, around 2008, the brothers settled in New York City, where Oren and Tal became real-estate agents and Alon set up a branch of the family’s security company. Oren and Tal began their careers at Douglas Elliman, where CEO Howard Lorber reportedly took them under his wing. Over the next decade, the brothers landed bigger and bigger luxury deals, courting celebrities and high-powered clientele. They were eventually among Elliman’s top agents across the country. Along with Alon, they became social-media influencer-types and nightlife fixtures, boasting in the press about how they found new business in clubs and on vacation, and throwing frequent lavish parties. In 2019, Oren and Tal claimed to help sell a record-breaking $240 million condo in 220 Central Park South to hedge-funder Ken Griffin. In 2022, they left Elliman and started their own brokerage called Official. { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Darian DiCianno/BFA/Shutterstock", "caption": "Tal Alexander, left, and Oren.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/2ef/dd2/7738c71d4c2e8b5291c417a73df5e7e806-tal-alexander.2x.rvertical.w570.jpg", "width": "1140", "height": "1426" } } Tal Alexander, left, and Oren. Photo: Darian DiCianno/BFA/Shutterstock What have they been accused of? Over the course of the last year, the Alexanders have been accused by dozens of women of sexual assault and rape. The first allegations were made in March 2024 by two women, Kate Whiteman and Rebecca Mandel, who accused Oren and Alon of rape in lawsuits filed in New York, in incidents that allegedly happened in 2012 and 2010, respectively. In June, after The Real Deal reported publicly on those lawsuits, a woman named Angelica Parker filed another lawsuit accusing all three brothers of raping her in 2015. A flood of dozens of allegations of sexual assault and rape followed in several investigations and subsequent lawsuits, creating a timeline of alleged assaults that spanned the brothers’ high-school days through their careers. The Wall Street Journal reported that in 2003, Alon and Oren were interviewed by police after a 14-year-old freshman at their high school was allegedly gang-raped by a group of boys, though no charges were filed then. One alleged victim accused Oren of raping her when they were college students in Colorado. Another alleged victim says she was assaulted by Tal Alexander as recently as 2022. As of February 18, 2024, the brothers had been sued by a total of at least 17 women in Miami, New York, and Moscow, according to the New York Times. Tal denied the allegations, as did Oren and Alon, through their attorneys. By February 28, four more women filed civil suits in New York against Oren, Tal, and Alon, bringing the total to 21. According to the Miami Herald, two were unnamed Jane Does, one of whom said she was assaulted by all three brothers in 2016 when she was 20 years old. Another woman, Ti Goodwin, claimed to have been raped by Oren after he gave her a drink at a party in 2011. A fourth, Laura Buck, said she was assaulted by Tal and Oren in 2010, after which she reached out to friends, family, and acquaintances of the brothers to tell them what they had allegedly done, including their mother. Eventually, she wrote that they were rapists in lipstick on the walls of their apartment hallway. Tal Alexander allegedly filed a police report for harassment in response. In a statement to the Herald, a lawyer for Oren and Alon said, “We haven’t been able to read the newest lawsuits, but no need, we’re assuming they claim they had non concensual [sic] sex a decade or two ago with the Brothers and decided to report it to a PI lawyer to sue before the new Statute of limitations expires.” Deanna Paul, Tal’s lawyer, didn’t give a statement but maintained her client’s innocence. What have they been charged with? On December 11, 2024, federal prosecutors in New York charged the brothers with sex trafficking in an unsealed federal indictment, which contained multiple counts. All three brothers were charged with one count of the sex trafficking of one woman, identified as Victim-2, by force, fraud, or coercion. Tal was also charged with the sex trafficking of a second victim, Victim-1. The most significant charge was one count of conspiracy to commit sex trafficking, which alleged that all three brothers perpetrated a long-running scheme over at least 14 years. Tal, Oren, and Alon, the unsealed federal indictment claimed, “worked together and with others known and unknown to repeatedly and violently drug, sexually assault, and rape dozens of victims.” The indictment continues that the brothers used “the promise of luxury experiences, travel, and accommodations to lure and entice women to locations where they were then forcibly raped or sexually assaulted.” The charges carry a minimum sentence of 15 years to life. The three brothers were arrested in Miami on the same morning the indictment was unsealed. In a video obtained by The Real Deal, federal agents can be heard ordering Oren to come out of his luxury home with his hands up. In addition to the federal charges, Tal and Oren are facing state felony charges of sexual battery connected to three separate alleged incidents in Florida. Miami-Dade County prosecutors also issued a warrant for Ohad Fisherman, a friend of the brothers and a real-estate agent who worked with Oren and Tal at Official, whom they named as an accomplice in one of the assaults. Fisherman, who was on his honeymoon in Japan when the warrant was issued, surrendered himself on December 18 and was booked on a charge of sexual battery by multiple perpetrators. He was later released on a $25,000 bond. What is the evidence? An FBI agent testified that the agency had spoken to 42 women who claimed to be assaulted by one or more of the brothers. Later they said the number had risen to 60, and they plan to add more charges. Prosecutors released videos of a few of those women emotionally recounting their experiences. In the indictment, they submitted evidence that included text messages and electronic communications that appeared to be between the brothers and other associates, which they claimed showed them arranging travel for trafficking victims. In one exchange, women were referred to as “imports.” Prosecutors have said they are continuing to examine evidence from Facebook, Instagram, and other digital accounts of the brothers. In January, prosecutors said they also found multiple hard drives in Tal’s apartment, which they alleged contained “a large quantity of sexually explicit videos and photos” showing the brothers with “drunk, naked women who were unaware they were being recorded,” according to ABC News. How did the brothers respond? Oren and Alon pleaded not guilty to the state charges against them in December. On February 7, all three brothers pleaded not guilty to the federal charges against them. On February 15, lawyers for Oren, Alon, and Ohad Fisherman submitted a filing claiming that a large personal-injury law firm, Morgan & Morgan, pressured prosecutors in Florida to file the charges against them. One of the alleged incidents in the state’s case included a victim who filed a civil suit represented by Morgan & Morgan the same day. “By the time the [alleged rape victim] finally sat down with police, her allegations had already been shaped by the attorneys whose financial interests depended on framing the [criminal] case to support a multimillion-dollar lawsuit,” the motion said, according to the Miami Herald. What about Douglas Elliman? Former colleagues of Tal and Oren Alexander told the press, including Curbed, that allegations about the brothers’ behavior were known to higher-ups at Douglas Elliman. At least two of the women who publicly accused the brothers were high-profile Elliman agents, Jessica Cohen and Million Dollar Listing star Tracy Tutor. A spokesperson for Douglas Elliman told Curbed that the company never received any complaints of sexual assault or harassment concerning the Alexanders. The fallout from the Alexanders has not spared Elliman, however. The stock price of shares in the company, which is publicly traded, had plummeted in recent months, and in July, a month after the allegations against the brothers were made public, a shareholder called for Lorber’s pay to be cut: “Stockholders deserve to know how the assault and harassment claims were handled by management,” he had said. By October, Lorber had suddenly stepped down as CEO. Where are the Alexander brothers now? Tal was immediately taken into federal custody in Miami after being arrested, while Oren and Alon first made appearances in state court, where they requested bail release. Oren told a judge that he needed to be with his pregnant wife. “Her family’s in Brazil. She’s counting on me to be with her during labor,” Oren said, according to a video of the exchange. A state judge eventually granted both twins pretrial release, during which they would be placed on house arrest and would be under GPS monitoring — but they ended up remaining in custody because of the federal charges against them. A federal judge eventually denied similar requests for all three brothers and ruled they would be extradited to New York. They are now awaiting trial in the Manhattan Detention Center (MDC) where Sean Combs and Luigi Mangione are also being held. What about their families? The brothers’ parents, Orly and Shlomy, have appeared with them in court hearings and have shown support for their sons. During one hearing, Orly appeared to tell Oren to smile. Kamila Hansen, Oren’s wife who recently gave birth, supported him in court in New York when he pleaded not guilty. The Real Deal recently reported that Shlomy is quietly trying to sell three of the family’s properties including Oren’s Sunset Islands mansion for $50 million and Tal’s home on Flamingo Drive. Tal Alexander’s wife, Arielle Alexander, however, whom he married in 2023 and with whom he has a child, announced in January that she had filed for divorce. “I will continue to provide my young baby with love and support as I leave my husband,” Kogut said in a statement. “This commitment to my child’s best interests and well-being will remain my highest priority.” Alon’s wife, Shani Alexander, has not been seen publicly or spoken to the press. When is the trial? The federal trial has been set for January 2026. The state trial in Florida against Alon, Oren, and Ohad Fisherman has been set for May 12, 2025, but it’s unclear whether Miami prosecutors will be able bring the Alexanders down from New York City, where they are being held in federal prison. Related The Alexander Brothers Have Been Arrested and Charged With Sex Trafficking Everyone Knew About the A-Team Tags: alexander brothers oren alexander operators tal alexander crime douglas elliman the real estate More Show Leave a Comment The Case Against the Alexander Brothers: Everything We Know const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'curbed'; const keywords = ["alexander brothers","oren alexander","operators","tal alexander","crime","douglas elliman","the real estate"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript = document.createElement('script'); ldJsonScript.type = "application/ld+json"; ldJsonScript.innerHTML = JSON.stringify(structuredData); document.head.appendChild(ldJsonScript);'''
