title = "Best Metro N.Y. Listings: Newburgh, Ellenville, Woodbourne"
description = "This month’s Metro New York region real-estate listings include the restored Philip Johnson Wolfhouse and a geothermal all-electric smart home in Pine Bush."
full_description = '''get out of town Feb. 20, 2025 A Surprise Philip Johnson in Newburgh By Clio Chang, a Curbed writer who covers everything New York City The interiors of this Philip Johnson home have been meticulously restored, as shown in this listing photo. Photo-Illustration: Curbed; Photo: Compass Greater NY Part of living in New York City is thinking about moving out of New York City. Each month, we’ll round up the best listings within commuting-ish distance, places where entire houses go for the cost of a “junior one-bedroom” (or less), but you’ll have to fix your own toilet. This month we have a restored Philip Johnson and an eco-ish home in Pine Bush fit for a Bond villain. Philip Johnson’s Wolfhouse in Newburgh, N.Y. $2,900,000: 3-bedroom, 2-bath { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Compass Greater NY", "caption": "The house is essentially one rectangle, as shown in this listing photo, that overlooks the Hudson River.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/f69/933/a59cdd8f8cc9fa23f91eccb5884f388560-624-River-Road--Newburgh--NY-12550-exter.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } The house is essentially one rectangle, as shown in this listing photo, that overlooks the Hudson River. Photo: Compass Greater NY { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Compass Greater NY", "caption": "The owners took liberties with the kitchen, which is a collaboration with Swiss furniture company USM Modular, as shown in this listing photo.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/6cc/f43/28f809126793fd0aa51f12935f35186346-624-River-Road--Newburgh--NY-12550-kitch.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } The owners took liberties with the kitchen, which is a collaboration with Swiss furniture company USM Modular, as shown in this listing photo. Photo: Compass Greater NY A chance to own a piece of architectural history. A pair of preservationists discovered this Philip Johnson home in disrepair five years ago and bought it for a mere $650,000. Dubbed the Wolfhouse, this striking rectangle of a home was built by Johnson in the 1940s for the Wolf family, who were business owners (and, interestingly, Jewish — their son said they didn’t know about his Nazi sympathies). The 4,000-square-foot house has an open-floor plan and views of the Hudson River. The meticulous renovation took four years and cost $1 million, bringing the home back to its more striking origins with an eye toward historical accuracy. The façade was replaced with cypress-wood siding, the roof got an upgrade, and some thoughtful liberties were taken with the USM cabinets in the kitchen. Once restored, it became an Airbnb and a cultural center, which was used in part as a space for LGBTQ+ artists and artists of color — an effort to contend with Johnson’s past. Now it’s back on the market. How do I get back to the city? It’s an hour-and-a-half drive. So what do I do if I live there? Marvel at the restoration, marvel at the fact that you had $2.9 million to spend. Keep hosting cultural events. A Renovated Farmhouse in Woodbourne, N.Y. $630,000: 4-bedroom, 2-bath { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Compass", "caption": "One of the best touches on this renovated farmhouse is the covered wraparound porch, as featured in this listing photo.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/88b/a0e/0fafae368521f534d7f32ff98698f7a817-51-Clark-A-Road-exterior.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } One of the best touches on this renovated farmhouse is the covered wraparound porch, as featured in this listing photo. Photo: Compass { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Compass", "caption": "The interiors of this house have been renovated, and the living room has extra-tall ceilings, as shown in this listing photo.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/39b/210/1abdb8d80804741ef7193fd21af5d6fe86-51-Clark-A-Road-interior.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } The interiors of this house have been renovated, and the living room has extra-tall ceilings, as shown in this listing photo. Photo: Compass Classic farmhouse vibes without the leaky sink and creaky floors (or the burdens of being a farmer at a moment of food-system collapse and ecological peril, haha). The kitchen has been renovated to include a double farmhouse sink and there’s a soaking tub in the primary bathroom. It’s a lofted space making it more open and airy and the whole thing sits on 17 acres, which include your own creek. You can sip your coffee and observe it all on the covered wraparound deck. It skews a little high for the area but just got a $35,000 price cut, so it could be a moment to try and take advantage. How do I get back to the city? It’s just over a two-hour drive. So what do I do if I live there? Go to the Hurleyville Performing Arts Centre. Make friends by saying “I have my own creek.” A Shoji-Screen-Filled House in Ellenville, N.Y. $799,000: 3-bedroom, 2-bath { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Coldwell Banker Village Green", "caption": "The upper-level deck featured in this listing photo is right along the tree line, integrating it into the natural space.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/ff3/391/bb74e27665726fdf7e1713b58e7df9b08a-337-Tempaloni-Road-exterior.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } The upper-level deck featured in this listing photo is right along the tree line, integrating it into the natural space. Photo: Coldwell Banker Village Green { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Coldwell Banker Village Green", "caption": "The house is decorated with shoji screens and big glass sliding doors, as shown in this listing photo.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/021/17f/9902b1c63b1d3064f105e83b07b0ceac3f-337-Tempaloni-Road-interior.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } The house is decorated with shoji screens and big glass sliding doors, as shown in this listing photo. Photo: Coldwell Banker Village Green Is this house, with its bamboo paintings and koi pond and “Asian-inspired” listing description, owned by an Asian person? A mystery. Either way, the glass sliding doors, shoji screens, and cathedral wood ceilings all give the split-level home an open, serene feel. The bathroom and kitchen need some updating, but the house is nicely integrated with its surroundings, including the wraparound porch nestled among the tree line. Similarly priced homes in the area are beige and cookie-cutter, so this one feels a little special. How do I get back to the city? It’s around a two-hour drive. So what do I do if I live there? Go rock climbing at the Gunks and hiking at Minnewaska State Park. An All-Electric House in Pine Bush, N.Y. $2,500,000: 4-bedroom, 5-bath { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Columbia County &amp; Northern Dutchess MLS", "caption": "This house sits on eight acres that are “boulder-strewn,” as shown in this listing photo.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/6a3/d61/60e07d63182a7e7cec21d72df161206cc7-121-Sheldon-Rd-exterior.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } This house sits on eight acres that are “boulder-strewn,” as shown in this listing photo. Photo: Columbia County & Northern Dutchess MLS { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Columbia County &amp; Northern Dutchess MLS", "caption": "The living room has a bachelor-pad-style fireplace and opens up into the backyard, as shown in this listing photo.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/803/bb7/e516488b61b09cc11be4689370676d414a-121-Sheldon-Rd-interior.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } The living room has a bachelor-pad-style fireplace and opens up into the backyard, as shown in this listing photo. Photo: Columbia County & Northern Dutchess MLS The perfect house for a villain looking for a new lair and is both concerned enough about the environment to want to go electric but not concerned enough to scale down. Built in 2012, the house has a copper-colored steel wall blocking the house off from the road (very nefarious). The all-electric house is LEED Silver certified and comes with all the modern tech finishes you could think of — solar panels on the roof, geothermal heating, Nest security cameras, and heated floors. There’s a sauna and a bachelor-pad-style fireplace. We’re not sure if it’s a plus, but your backyard is “boulder-strewn.” It’s pricey for the area, but you’ll save on energy costs. How do I get back to the city? It’s about a two-hour drive. So what do I do if I live there? Go hiking in the Awosting Reserve. Plan the next bad thing you’ll do. Related A Loftlike One-Bedroom in a Former Steinway Piano Factory for $519K Want a Clandestine Frankenmansion on Perry Street? Tags: get out of town listings the real estate newburgh philip johnson architecture woodbourne pine bush ellenville wolfhouse More Show Leave a Comment A Surprise Philip Johnson in Newburgh const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'curbed'; const keywords = ["get out of town","listings","the real estate","newburgh","philip johnson","architecture","woodbourne","pine bush","ellenville","wolfhouse"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript = document.createElement('script'); ldJsonScript.type = "application/ld+json"; ldJsonScript.innerHTML = JSON.stringify(structuredData); document.head.appendChild(ldJsonScript);'''
