["https://www.curbed.com/article/julian-schnabel-palazzo-chupi-events-space-west-village.html"]
title = "Julian Schnabel’s Palazzo Chupi Has an Events Space Now"
description = "Palazzo Chupi, the controversial West Village condo developed by Julian Schnabel in the aughts, now has an events space, including the artist’s old studio."
full_description = '''celebrity real estate Feb. 25, 2025 Julian Schnabel’s Palazzo Chupi Now Has an Events Space By Kim Velsey, Curbed’s real-estate reporter Photo: Jason Kempin/Getty Images Things have been quiet over at Palazzo Chupi, Julian Schnabel’s pink West Village castle that was once the talk of the neighborhood — preservationist Andrew Berman called it “an exploded Malibu Barbie house,” and neighbors, vexed by the Palazzo’s height and (not very West Village) neo-Mediterranean style, protested its construction, marching with signs that read, “No More Monuments to Greed.” But after two decades of Frankenmansions and billionaire bunkers like Steve Cohen’s 30,000-square-foot municipal-style megamansion, the pink boutique condo, which the artist designed with beadboard walls, green tile floors, and Stonehenge-inspired fireplaces, has aged into acceptance, affection even. The last we heard, the building’s five spacious, terrace-bedecked apartments were being quietly enjoyed by Schnabel, his art-dealer son Vito, a Credit Suisse banker, and a few other rich guys. The last sale at the Palazzo was 15 years ago. { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Courtesy of Hush Events", "caption": "One of the very not-generic spaces for the rent: Note the taxidermy bear and double pianos.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/81c/798/c224cf952a99a3f002c4e2c86b838902cd-PALAZZO-CHUPI-9.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } One of the very not-generic spaces for the rent: Note the taxidermy bear and double pianos. Photo: Courtesy of Hush Events Now a tipster has alerted us to the fact that three floors are being rented out as an events space by Hush — “a dynamic creative concept that bridges the gap between luxury real estate and opportunities for bespoke events + activations,” according to its website. “We’re thrilled to welcome a truly one-of-a-kind New York space opening its doors to events for the first time ever,” the email advertising Palazzo Chupo’s new incarnation reads. You can, Hush says, rent out all three floors together or individually, for “select private events, subject to approval.” { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Courtesy of Hush Events/Scout’s Honor Locations in c/o James Ives", "caption": "A library room with what appears to be Schnabel’s Picasso knockoff.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/9a1/fff/c880e4cc7d997419d5d4f55bdc896fe23f-PALAZZO-CHUPI-1--1-.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } A library room with what appears to be Schnabel’s Picasso knockoff. Photo: Courtesy of Hush Events/Scout’s Honor Locations in c/o James Ives Based on the paintings on the walls, the paint cans on the floors, the lavish and eccentric décor (chandeliers, huge sculptures, what appears to be a taxidermied bear), and the view of neighboring townhouses from the windows, we guessed the for-rent space belongs to the Schnabels. Hush confirmed that it was Julian’s studio space in the original part of the building — he and Vito also have private residences there. (As of 2016, Vito was occupying a duplex at Chupi.) The vast rooms on offer have a lot more personality than most event spaces, with brick walls, harlequin-tile floors, a library full of art books, and what appears to be Schnabel’s Picasso knockoff, which he told the New York Times he painted one day “just to see if I could.” { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Courtesy of Hush Events/Scout’s Honor Locations in c/o James Ives", "caption": "Great for a wedding or luxury-brand launch.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/a25/24e/02868a25dbe5b43a4961dc5927d0b31d2c-PALAZZO-CHUPI-17.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Great for a wedding or luxury-brand launch. Photo: Courtesy of Hush Events/Scout’s Honor Locations in c/o James Ives Really, it’s not so surprising that the Schnabel compound would be offered up as a venue. The artist has always been up-front about his desire to monetize his real-estate holdings, much like fellow West Village artist/real-estate investor Annie Leibovitz. The painter made the move to build atop the brick horse stable where he kept his studio shortly before the neighborhood’s zoning changed in 2005, limiting the height of new construction to 75 feet. (Chupi, at 170 feet, is more than twice that.) “I built it because I wanted more space, and because I thought I could sell two or three apartments to pay for that space, and I built it because I could,” Schnabel told the Times in 2008. But despite a breezy start — Schnabel said he sketched out the design in 15 minutes — the project ended up costing more and selling for less than Schnabel had hoped. Construction costs were, Schnabel said at the time, “a lot” — he had to auction off a (real) Picasso painting to pay for them — and the timing of its debut, in the midst of the financial crisis, wasn’t great. Prices were slashed, units were listed for rent, Richard Gere bought but never moved in. But it all worked out in the end, as condo developments in highly sought-after neighborhoods often do. And now those who can afford it (it’s unclear how much the space will rent for, but it’s safe to assume it’s a lot) — and pass approval — can brag about having their wedding at Palazzo Chupi. { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Courtesy of Hush Events/Scout’s Honor Locations in c/o James Ives", "caption": "Beadboard and exposed beams are featured in many rooms.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/9ed/53a/218f7d3b0a7705150c8ee7fbeb887f3f5f-PALAZZO-CHUPI-29.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Beadboard and exposed beams are featured in many rooms. Photo: Courtesy of Hush Events/Scout’s Honor Locations in c/o James Ives Related Tour Vito Schnabel’s Art-Packed Palazzo Chupi Apartment Steve Cohen’s Mega-Mega-Mansion Is Now Visible Tags: julian schnabel schnabel palazzo chupi west village events spaces celebrity real estate openings the real estate hush More Show Leave a Comment Julian Schnabel’s Palazzo Chupi Now Has an Events Space const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'curbed'; const keywords = ["julian schnabel","schnabel","palazzo chupi","west village","events spaces","celebrity real estate","openings","the real estate","hush"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript = document.createElement('script'); ldJsonScript.type = "application/ld+json"; ldJsonScript.innerHTML = JSON.stringify(structuredData); document.head.appendChild(ldJsonScript);'''
