title = "Meet Top-Ranked Squash Players at the J.P. Morgan Tournament"
description = "Top-ranked squash players from around the world warmed up for their matches in the J.P. Morgan Tournament of Champions at Grand Central."
full_description = '''.layout > .ad-splash, .one-column-layout > .ad-splash { display: none; } look book Feb. 13, 2025 The Look Book Goes to a Squash Competition Top-ranked players warmed up for their matches in the J.P. Morgan Tournament of Champions at Grand Central. By Emily Leibert, a staff writer for the Cut. She specializes in coverage at the intersection of gender and sports, the arts, and our relationship to our bodies. Photo: Frankie Alduino Photo: Frankie Alduino Auguste Dussourd (pictured above)Squash player, Aix-en-Provence, France Do you have a favorite pre-match hype song?The song depends on the moment and on my mood. Most of the time, it’s some French rap. One French rapper I like is called Booba, and another is Gazo. But sometimes I’m in the mood for Latin music so I’ll listen to Bad Bunny. My girlfriend travels quite often with me, and she gets so pissed off because I’ll play the same song 20 times in a row. How did you two meet?We met in the U.S. Junior Open. She was a big fan. She asked me to sign her T-shirt. Nah, I’m kidding. She used to be a squash player, and we were playing the same event and we started to talk. She is from Mexico, and I didn’t speak English or Spanish at the time, so it was quite tough to communicate. I was just saying “yes” to everything she was saying. Tarek MomenSquash player, Cairo, Egypt Satomi WatanabeSquash player, London, England Olivia WeaverSquash player, Philadelphia, PennsylvaniaHow did you get into squash?My parents were looking to keep me busy, and they signed me up for a squash clinic when I was 5 years old. I pretty much instantly loved it. It probably didn’t hurt that the more targets you hit in the clinic, the more candy you got at the end. Nicolas MüllerSquash player, Hirzel, SwitzerlandAre you missing Switzerland right now?You know, nothing beats your own bed. And I do like my country’s tap water. And, obviously, having nice bread. The bread isn’t the same anywhere else. Grégoire MarcheSquash player, Aix-en-Provence, France Dimitri SteinmannSquash player and lance corporal, Zurich, Switzerland Sarah-Jane PerrySquash player, Kenilworth, England Mike RileyReferee, Bristol, Rhode Island Victor CrouinSquash player, Toulon, FranceDo you have a pre-match ritual?When it gets really close to game time, I remove my AirPods so I can get into the mood and the sound of the court. Grand Central is quite loud, and it’s important to adapt to the atmosphere instead of just being in your zone. Sivasangari SubramaniamSquash player, Kuala Lumpur, Malaysia Baptiste MasottiSquash player, Aix-en-Provence, France Leonel Cárdenas MoraSquash player, Mexico City, MexicoWhat’s next for you after the tournament?Well, I’m getting a new dog — it’s called a calupoh, and it’s a mix between a dog and a wolf. The puppies were just born, and I’m getting one within the next month. I think I’m going to give it an old Mexican name — like from the Nahuatl language. I’m going to call it a word that means “shadow,” because these dogs are full, full black. Amanda SobhySquash player, Boca Raton, FloridaDo you have an ultimate squash dream?I’m coming back from my second Achilles rupture. When it happened, I was like, Why me? But then I flipped the script and decided my goal is to compete in the 2028 Olympics. I don’t know of an athlete who has done that after two Achilles ruptures, so it would be a really awesome comeback story. That has motivated me. Christopher GordonSquashTV commentator, Jackson Heights Sana Mahmoud IbrahimSquash player and college student, Cairo, Egypt Mohamed Zakaria, Squash player and 12th-grader, Alexandria, Egypt Ali FaragSquash player, Cairo, EgyptYou’re the world’s No. 1 player. Do you get recognized?I’ve been stopped by people within the squash world. But the sport’s profile is not that big. I always tell my wife, who is the former world No. 3, that we are in the sweet spot — we are appreciated by many, which gives you self-esteem, but we can also live our lives. I wouldn’t have it any other way. Lisa AitkenSquash player, Edinburgh, Scotland Photographs by Frankie Alduino Tarek MomenSquash player, Cairo, Egypt Satomi WatanabeSquash player, London, England Olivia WeaverSquash player, Philadelphia, PennsylvaniaHow did you get into squash?My parents were looking to keep me busy, and they signed me up for a squash clinic when I was 5 years old. I pretty much instantly loved it. It probably didn’t hurt that the more targets you hit in the clinic, the more candy you got at the end. Nicolas MüllerSquash player, Hirzel, SwitzerlandAre you missing Switzerland right now?You know, nothing beats your own bed. And I do like my country’s tap water. And, obviously, having nice bread. The bread isn’t the same anywhere else. Grégoire MarcheSquash player, Aix-en-Provence, France Dimitri SteinmannSquash player and lance corporal, Zurich, Switzerland Sarah-Jane PerrySquash player, Kenilworth, England Mike RileyReferee, Bristol, Rhode Island Victor CrouinSquash player, Toulon, FranceDo you have a pre-match ritual?When it gets really close to game time, I remove my AirPods so I can get into the mood and the sound of the court. Grand Central is quite loud, and it’s important to adapt to the atmosphere instead of just being in your zone. Sivasangari SubramaniamSquash player, Kuala Lumpur, Malaysia Baptiste MasottiSquash player, Aix-en-Provence, France Leonel Cárdenas MoraSquash player, Mexico City, MexicoWhat’s next for you after the tournament?Well, I’m getting a new dog — it’s called a calupoh, and it’s a mix between a dog and a wolf. The puppies were just born, and I’m getting one within the next month. I think I’m going to give it an old Mexican name — like from the Nahuatl language. I’m going to call it a word that means “shadow,” because these dogs are full, full black. Amanda SobhySquash player, Boca Raton, FloridaDo you have an ultimate squash dream?I’m coming back from my second Achilles rupture. When it happened, I was like, Why me? But then I flipped the script and decided my goal is to compete in the 2028 Olympics. I don’t know of an athlete who has done that after two Achilles ruptures, so it would be a really awesome comeback story. That has motivated me. Christopher GordonSquashTV commentator, Jackson Heights Sana Mahmoud IbrahimSquash player and college student, Cairo, Egypt Mohamed Zakaria, Squash player and 12th-grader, Alexandria, Egypt Ali FaragSquash player, Cairo, EgyptYou’re the world’s No. 1 player. Do you get recognized?I’ve been stopped by people within the squash world. But the sport’s profile is not that big. I always tell my wife, who is the former world No. 3, that we are in the sweet spot — we are appreciated by many, which gives you self-esteem, but we can also live our lives. I wouldn’t have it any other way. Lisa AitkenSquash player, Edinburgh, Scotland Photographs by Frankie Alduino Thank you for subscribing and supporting our journalism. If you prefer to read in print, you can also find this article in the February 10, 2025, issue of New York Magazine. Want more stories like this one? Subscribe now to support our journalism and get unlimited access to our coverage. If you prefer to read in print, you can also find this article in the February 10, 2025, issue of New York Magazine. More From This Series The Look Book Goes to the Zoe Gustavia Anna Whalen Show The Look Book Goes to a Piercing Studio The Look Book Goes to an All-Nighter at The Clock See All Tags: look book cityscape new york city gallery new york magazine sports More Show Leave a Comment The Look Book Goes to a Squash Competition const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'curbed'; const keywords = ["look book","cityscape","new york city","gallery","new york magazine","sports"]; //