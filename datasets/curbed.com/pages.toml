["https://www.curbed.com/article/middle-east-living-rooms-interiors-photo-essay.html"]
title = "A Maximalist Celebration of Middle East Living Rooms"
description = "‘Living Rooms,’ a new photo book published by Middle East Archive, presents the living room as a  space of cultural expression and memory, highlighting an ornate aesthetic that some would dismiss as ‘kitsch.’"
full_description = '''.layout > .ad-splash, .one-column-layout > .ad-splash { display: none; } chapters Feb. 21, 2025 Where Gold Paint, Fringe, and Crystal Chandeliers Meet A glimpse into the living rooms of the Middle East, from Istanbul to the border of Iran. By Sukjong Hong During her travels in Iran, the photographer Miriam Stanke met the Iranian poet, Heydar Abbasi, also known by his pen name Barişmaz. Here he is in his house near Tabriz. Photo: Miriam Stanke During her travels in Iran, the photographer Miriam Stanke met the Iranian poet, Heydar Abbasi, also known by his pen name Barişmaz. Here he is in his house near Tabriz. Photo: Miriam Stanke During her travels in Iran, the photographer Miriam Stanke met the Iranian poet, Heydar Abbasi, also known by his pen name Barişmaz. Here he is in his house near Tabriz. Photo: Miriam Stanke The rooms are not exactly lavish, but they have in common a few details that make them look inviting and a little bit theatrical: layered rugs, yards of jewel-toned drapery, fringed lampshades, gilded picture frames tilting off the walls. It’s a domestic design language that the curator Romaisa Baddar grew up with, even as her Moroccan mother and Egyptian father raised her in Amsterdam, and it’s one she notices in homes all over the Middle East. But the aesthetic is “often dismissed as ‘kitsch,’” she says, and it’s also increasingly threatened by contemporary ideas of luxury and (monochromatic, pale, minimalist) good taste. This slide toward cultural homogenization is partly what motivated her to produce Living Rooms, a new book of photography published by Middle East Archive, the platform she founded in 2020. Through the work of 41 photographers and a mix of archival and contemporary imagery, the book documents the living room in all its variations across the region, from Istanbul to Iran and even as far as Berlin, where a Turkish diasporic community maintains its heritage and traditions. Most of the photos present quiet scenes of daily life, like a man in Aleppo, Syria, bending down to pray or a mother braiding her son’s hair, a moment captured by photographer Ali Al Shehabi in Bahrain. Others reveal glimpses of living rooms in their more public function, as spaces of hospitality and celebration, with guests dancing in the middle of a crowd or clustered around a spread of flatbread and greens. Some of the most striking images bridge the living room’s public and private functions via still lifes of mementos carefully arranged for display and appliances wrapped in floral plastic slipcovers. As Sara Bokr, a Palestinian architect, and editor Dalia Al-Dujaili write in an essay in the book, “Our plastic-covered sofas are evidence of our culture of preservation, our knack for making something to last but also our determination to impress our guests.” But, for the most part, the book doesn’t provide much in the way of textual explanation, and instead forces a close read of the images themselves. What’s less evident in the book, and intentionally so, are the signs of conflict that tend to dominate visual representations of the region. Challenging that expectation led Baddar to establish Middle East Archive in the first place; as she researched contemporary photographers working there, she found vast amounts of imagery that went beyond the visual tropes of ruin. It’s not that Living Rooms ignores this reality completely, but that it chooses instead to highlight the limbo of waiting out a curfew or the private release of laughing among friends. { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Ali Al Shehabi", "caption": "From As I Lay Between Two Seas. Bahrain, 2021.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/bcd/d37/926e57009d2183a8267c2f1ea7db69f988-Bahrain-2021-Photographer-Ali-Al-Shehabi.2x.rvertical.w570.jpg", "width": "1140", "height": "1426" } } From As I Lay Between Two Seas. Bahrain, 2021. Photo: Ali Al Shehabi { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Mariam El Gendy", "contentUrl": "https://pyxis.nymag.com/v1/imgs/09f/d3f/a54d7cbc6b8044327b36e2de91dd2db5d0-Cairo-Egypt-2021-Photographer-Mariam-El-.2x.rvertical.w570.jpg", "width": "1140", "height": "1426" } } Photo: Mariam El Gendy { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Miriam Stanke", "caption": "While following a nomadic tribe in the Zagros mountains in Iran, photographer Miriam Stanke took this photo of a living room wall carefully decorated with family portraits in the home of a semi-nomadic family.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/bde/d3d/868b704696ea008eda3e99dcf685dad47b-Zagros-Mountains-Iran-2012-Photographer-.2x.rhorizontal.w900.jpg", "width": "1800", "height": "1200" } } While following a nomadic tribe in the Zagros mountains in Iran, photographer Miriam Stanke took this photo of a living room wall carefully decorated with family portraits in the home of a semi-nomadic family. Photo: Miriam Stanke { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Miriam Stanke", "caption": "During several curfews imposed on many cities in eastern Turkey, Stanke caught some scenes within family homes behind the barricades. A man is sitting in his living room during a harsh winter month in Yüksekova.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/d1f/51b/55784b34f4d29ccdb85aaddf8706ba98bf-Yu-ksekova-Kurdistan-2015-Photographer-M.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } During several curfews imposed on many cities in eastern Turkey, Stanke caught some scenes within family homes behind the barricades. A man is sitting in his living room during a harsh winter month in Yüksekova. Photo: Miriam Stanke { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Sakir Khader", "caption": "Jenin Silat al-Harithiya, Palestine, 2024.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/d8e/34a/4a4fefc91527b59083f41ab6a39b0d9897-Palestine-Jenin-Silat-al-Harithiya-2024-.2x.rhorizontal.w900.jpg", "width": "1800", "height": "1200" } } Jenin Silat al-Harithiya, Palestine, 2024. Photo: Sakir Khader { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Rena Effendi", "contentUrl": "https://pyxis.nymag.com/v1/imgs/3d6/8b6/44c66055ebc32218d774b4b9621c9b9838-Kurdish-Family-in-Istanbul-Turkey-2011-P.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: Rena Effendi { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Ségolène Ragu", "contentUrl": "https://pyxis.nymag.com/v1/imgs/46e/193/9fd8c84d4fc9702a5c624112880bb5c9b4-Beirut--Lebanon-2023-Photographer-Se-gol.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } Photo: Ségolène Ragu { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Olgaç Bozalp", "caption": "Photographer Olgaç Bozalp set out to photograph the Turkish community in Germany, which has been settled there since the 1960s and now numbers over 3.5 million. In many Turkish families, the TV remote symbolizes power — something his father always held and kept in pristine condition. Seeing this remote in a Turkish home in Berlin instantly reminded him of his own childhood (2016).", "contentUrl": "https://pyxis.nymag.com/v1/imgs/83a/56f/f4b7c7ecc4cd03eb6728c375b41394e234-Berlin--Germany-2016-Photographer-Olgac-.2x.rvertical.w570.jpg", "width": "1140", "height": "1426" } } Photographer Olgaç Bozalp set out to photograph the Turkish community in Germany, which has been settled there since the 1960s and now numbers over 3.5 million. In many Turkish families, the TV remote symbolizes power — something his father always held and kept in pristine condition. Seeing this remote in a Turkish home in Berlin instantly reminded him of his own childhood (2016). Photo: Olgaç Bozalp { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Shayan Sajadian", "contentUrl": "https://pyxis.nymag.com/v1/imgs/779/fba/d738ffb4138544578669292c17519ef1d9-Fars-Province-Iran-2024-Photographer-Sha.2x.rvertical.w570.jpg", "width": "1140", "height": "1426" } } Photo: Shayan Sajadian { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Miriam Stanke", "caption": "In eastern Turkey, a mother and son relax in the living room of their house in Yüksekova during an evening curfew.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/75a/d30/3600c1f558041abee6235ff71ae4a2740b-Yu-ksekova-Kurdistan-2015-Photographer-M.2x.rhorizontal.w900.jpg", "width": "1800", "height": "1200" } } In eastern Turkey, a mother and son relax in the living room of their house in Yüksekova during an evening curfew. Photo: Miriam Stanke { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Rita Kabalan", "caption": "A used living room set for sale at Arcenciel in Damour, Lebanon. The photo was taken a year after the October 2019 wildfire had burned much of the building. The staff continued to use the space, and people shopped for furniture despite the damage.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/cde/c45/356b3051556a9f009fd0958528b5e36a3c-Damour-Lebanon-2020-Photographer-Rita-Ka.2x.rhorizontal.w900.jpg", "width": "1800", "height": "1200" } } A used living room set for sale at Arcenciel in Damour, Lebanon. The photo was taken a year after the October 2019 wildfire had burned much of the building. The staff continued to use the space, and people shopped for furniture despite the damage. Photo: Rita Kabalan { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Rena Effendi", "contentUrl": "https://pyxis.nymag.com/v1/imgs/7a6/821/7fcc63d6bc097bebc6a4b8f021164b5003-Mardin-Turkey-2021-Photographer-Rena-Eff.2x.rvertical.w570.jpg", "width": "1140", "height": "1426" } } Photo: Rena Effendi { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Sabiha Çimen", "contentUrl": "https://pyxis.nymag.com/v1/imgs/ed8/046/22d048cc286ab70741d5aac75c2c5b6687-Istanbul-Turkey-2022-Photographer-Sabiha.2x.rsquare.w570.jpg", "width": "1140", "height": "1140" } } Photo: Sabiha Çimen { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Shayan Sajadian", "contentUrl": "https://pyxis.nymag.com/v1/imgs/bc9/d38/8f5d22dd07eabcd8953c871e728649b639-Fars-Province-Iran-2024-Photographer-Sha.2x.rvertical.w570.jpg", "width": "1140", "height": "1426" } } Photo: Shayan Sajadian { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Sabiha Çimen", "contentUrl": "https://pyxis.nymag.com/v1/imgs/e0e/2ce/232be2187f5d26e5d203e7101ef65da214-Istanbul-Turkey-2021-Photographer-Sabiha.2x.rsquare.w570.jpg", "width": "1140", "height": "1140" } } Photo: Sabiha Çimen Related Jamel Shabazz Will Always Ask Before Taking Your Picture Taking Stock of an Unrecognizable Gaza When New York Started to Wake Up Tags: chapters middle east living rooms interiors design hunting textiles slipcovers More Show Leave a Comment Where Gold Paint, Fringe, and Crystal Chandeliers Meet const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'curbed'; const keywords = ["chapters","middle east","living rooms","interiors","design hunting","textiles","slipcovers"]; // This is set b