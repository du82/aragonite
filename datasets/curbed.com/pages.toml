["https://www.curbed.com/article/best-hair-removal-waxing-laser-nyc.html"]
title = "Best Places for Waxing and Laser Hair Removal in NYC 2024"
description = "The best hair-removal salons in NYC for expert laser hair removal, facial and body waxing (including Brazilian wax), sugaring, and tweezer-only eyebrow shaping for men and women."
full_description = '''best of new york Updated Mar. 14, 2024 The Best Hair Removal Services in New York By Mackenzie Wagoner Best of New York New York Magazine’s own Yellow pages, containing exclusively excellent places. Best of New York New York Magazine’s own Yellow pages, containing exclusively excellent places. Photo-Illustration: Curbed; Photos: Getty To find the hair-removal specialists on this list, we polled dozens of in-the-know New Yorkers, including a brow artist, a writer-director, and a stylist. They recommended the best laser-treatment spots, told us where they go for their Brazilian (and BoyZillian) waxes, and shared whom they trust to shape up their eyebrows. Some of our picks have locations across the city, and many have same-day appointments available. For a Same-Day Appointment Uni K Wax, multiple locations; unikwax.com There are plenty of fancy places to get a bikini wax in the city — like Haven in Soho, where treatment rooms are decorated with roses floating in bowls of water, or Maris Dusan, which is situated on the ground floor of a Park Avenue townhouse. But none, according to Lili Chemla, founder of clothing company Leset, beat Uni K. No matter which location she visits (the chain has 14 across the city, from Bay Ridge to Lenox Hill to Long Island City), the technicians expertly (and quickly) use hard wax and are “diligent about making sure you’re smooth as a seal,” she says, “not letting a single hair pass their notice.” The no-frills studios are always clean, but the real appeal is the company’s online booking portal and easy-to-parse menu of services listing several variations on bikini waxes, ranging from “top only” ($13), for just the horizontal strip of hair above the pubic area, to a “Boy Short” ($87), which includes hips and inner thighs. Nora DeLigter, writer-director who has been going to Uni K for bikini waxes for eight years, says over all that time, she has “never not gotten a same-day appointment.” For a BoyZillian MPM, 239 W. 26th St.; mpm.studio When it comes to cleaning up his nether regions, “most woman waxers act kind of afraid of me,” says one avid male client who’d prefer to remain anonymous. “They generally aren’t willing or able to get me into the right positions to really get it done.” Not so at MPM, an exclusively for-men spot in Chelsea that sugars (a hair-removal process that uses a lemon-water-and-paste mixture instead of wax) away hair in the perineum, on the balls, around the shaft, and basically anywhere else the customer pleases (prices start at $30 for “the crack only”). Oskar, the owner and one of the technicians, is particularly good at “contorting my body into whatever shape it takes to really get into the crevices of my butt. He’s not shy around or afraid of the male body.” The “BoyZillian” ($60) removes hair from the full pubic area in 30 minutes or less, and while it’s admittedly “extremely painful,” Oskar is “gentle and makes it more tolerable than it should be.” For Taraji P. Henson’s Go-to Tenoverten, 121 Fulton St., second fl.; tenoverten.com In her over ten years at Tenoverten, Miranda Boci has gained a high-profile following for her surprisingly painless waxing services. Her client list includes Demi Moore, Taraji P. Henson, Maggie Gyllenhaal, and Naomi Watts as well as Jimena Garcia, Chanel’s in-house brow artist, who has been seeing Boci for bikini waxes (from $35) for 15 years, since before Boci moved to Tenoverten. Boci uses nontoxic products (Satiness beeswax, natural resin-based wax, azulene oil), but Garcia says Boci’s finesse comes down to experience: “She knows how to adjust the temperature, the pace, the way she holds her hands specifically. You can learn technique in school, but you have to actually do it over and over to be able to really see hair-growth patterns and hair types the way she does.” For a ’90s-esque Arch Zubi’s Threading Corner, 157 Allen St.; zubis-threading-corner.business.site “Zubi always has a point of view about eyebrow shape and the relationship between how your hair grows and the shape of your face,” says stylist Mellany Sanchez of Zubi Kothiya, owner of Zubi’s Threading Corner. (She got Kothiya’s name in the first place from her friend Seymore Fleck, a beauty specialist who has been seeing Kothiya since 2008.) Take, for instance, the time Sanchez showed Kothiya her saved photos of ’90s supermodels and Puerto Rican women with their ultra-arched, razor-thin brows. (“I live for it,” she says.) Kothiya steered her away, suggesting instead that a better arch would be achieved by growing her brows in and shaping them so they gently taper past the outer corners of her eyes. Now Sanchez has a feathery, ’90s-esque arch with none of the no-going-back overplucking. (From $10 to $200 for a wide range of services.) For Ancestral Brows Azi Sacks, the Brow Studio, 205 W. 20th St.; azibrow.com As a child, Zara Rahim’s unibrow was openly praised at home by her Bangladeshi family but mocked by her classmates at her Florida school. “I threaded my eyebrows mercilessly as soon as I was allowed to,” says the communications strategist, and from the age of 17 up until the pandemic, she kept her brows in distinct, separate arches. But post-lockdown, with her childhood brow fully rewilded after having no access to a salon, she decided to leave “colonial standards of beauty” behind. On a recommendation from hairstylist Dhiran Mistry, she went to see Azi Sacks, whose “eyes lit up in a way I hadn’t seen before,” Rahim says. “Her concern was, ‘How do we keep these as full and ancestral as possible?’ ” For Rahim, Sacks carefully tweezes to preserve her brows’ natural shape ($260 for shaping) — somehow taming the cowlick that stumped previous eyebrow artists — and adds a tint ($40) for further definition. For Beauty-Editor-Trusted Laser Romeo & Juliette Laser Hair Removal, 5 E. 57th St., sixth fl.; romeojuliettelaserhairremoval.com In 2016, contributing editor at Vogue Jenna Rennert went to Romeo & Juliette Laser Hair Removal on the recommendation of a friend and has been a regular ever since, dipping in frequently ahead of events. She has referred industry friends, like Instagram’s head of beauty programs, Kristie Dash, who has since become a regular. Romeo & Juliette has 12 available lasers, including Nd:YAG lasers, which yield the best results on darker skin tones and are not available at many med spas. Rennert’s bikini-line treatments (from $235) are generally done with the Synchro REPLA:Y, which has nuanced settings to allow for more targeted treatments based on hair type and thickness and skin tone and sensitivity. Dash remembers being pleasantly surprised at her first appointment when multiple settings were used on a single body part. “It’s such a thorough process,” she says. “Other salons pop you into a room and just start zapping.” Blake Newby, an editor at Essence, has been getting her Brazilian area done at Romeo & Juliette for four years. “The area has stayed hairless as long as I’ve been diligent with touch-ups,” she says. “And I’ve never experienced so much as an ounce of discoloration. I’ve referred friends with deeper skin tones than me to R&J, and they said the same.” . Ask a Laser Specialist Christian Karavolas, founder of Romeo & Juliette Laser Hair Removal in Midtown East { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Pete Gamlen", "contentUrl": "https://pyxis.nymag.com/v1/imgs/c54/e36/72812b48549dfb349457ca1d566a6bfa32-0624STR-BoNY-christian-final-cmyk.2x.rsquare.w570.jpg", "width": "1140", "height": "1140" } } Illustration: Pete Gamlen What makes a laser technician great rather than merely good?A great technician listens to the client, asks questions: What have they done in the last two weeks? Are they on medication, antibiotics? Have they been in the sun? Do they use self-tanners? This assessment will tell you the proper settings to use or tell you when to postpone treatment altogether. If someone’s on medication that creates photosensitivity, they may get pigmentation that can take months to resolve. Are there different lasers for different parts of the body?Yes and for different kinds of hair and skin. Most places use one laser on everybody. We have 12 different ones. If somebody has red or blonde hair, we use a laser that targets their roots differently than lasers for dark hair. Describe what the laser feels like for someone who’s never done it.It just feels like somebody snapping you with a rubber band. We also have cooling methods that blow cold air on the skin to make the treatment tolerable. However, us men, we’re pain intolerant. We offer numbing cream, and about 20 percent of our male clientele uses it. For women, it’s closer to 5 percent. You only do laser hair removal — why is that?There’s a dermatologist downtown who sends us clients, and he says that while most places do laser, Romeo & Juliette perfects the art of laser hair removal. I’ll put it like this: You could take ten cooks and give them the same tomatoes, water, sugar, and after an hour or two, you get ten different tomato sauces. We feel we make the best tomato sauce. — Katie Arnold-Ratliff Thank you for subscribing and supporting our journalism. If you prefer to read in print, you can also find this article in the March 11, 2024, issue of New York Magazine. Want more stories like this one? Subscribe now to support our journalism and get unlimited access to our coverage. If you prefer to read in print, you can also find this article in the March 11, 2024, issue of New York Magazine. More From best of new york The Best Window Shades in New York The Best Fish Markets in New York The Best Wine & Spirits Shops in New York See All Tags: remove interruptions best of new york new york magazine Show Leave a Comment The Best Hair Removal Services in New York const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'curbed'; const keywords = ["best of new york","new york magazine","remove interruptions"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript = document.createElement('script'); ldJsonScript.type = "application/ld+json"; ldJsonScript.innerHTML = JSON.stringify(structuredData); document.head.appendChild(ldJsonScript);'''
