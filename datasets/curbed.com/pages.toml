title = "A Wood-Paneled Renovation Turns Two Units Into One"
description = "Darcy Gerstein merged her Lower East Side apartment with her neighbor’s and enlisted Danielle Fennoy to design a cohesive space."
full_description = '''.layout > .ad-splash, .one-column-layout > .ad-splash { display: none; } great rooms Feb. 19, 2025 A Wood-Paneled Renovation Turns Two Units Into One Danielle Fennoy used curved walls and concrete floors to fuse two adjacent apartments. By Wendy Goodman, Curbed and New York Magazine’s design editor who covers the city’s most spectacular interiors. Photograph By Tori Sikkema Great Rooms A visual diary by Design Editor Wendy Goodman. Designer Danielle Fennoy in Darcy Gerstein’s Lower East Side apartment. Photo: Tori Sikkema Great Rooms A visual diary by Design Editor Wendy Goodman. Designer Danielle Fennoy in Darcy Gerstein’s Lower East Side apartment. Photo: Tori Sikkema Darcey Gerstein and her late husband bought their neighbor’s apartment on the Lower East Side and combined it with their own back in 2011, but it would take another 12 years before the two spaces fully became one. “I’m a single mom and a widow,” Gerstein says, “and the girls and I just realized we needed a clean slate.” She enlisted Danielle Fennoy, founder of Revamp Interior Design, to do the gut renovation in 2023. Gerstein interviewed a few designers who specialize in design-build projects, but they were all “either more design or more build and not the total package.” Fennoy was different. “She can negotiate and navigate between the pure aesthetics and then the nitty-gritty,” Gerstein says. “Very few people have that ability to do them both in a great way.” Aside from having the two units feel like one, Gerstein wanted an overhaul on the décor, seeking something “well designed but not stuffy,” she says. “And my kids are somewhat young, so it needed durability.” Part of that involved making bold color choices, such as the bright-salmon velvet couch in the media room, which doubles as a guest room. “I’ve always been afraid to commit to a color,” says Gerstein. “Our previous space had a lot of neutrals.” “We made massive updates in both functionality and aesthetics,” Fennoy says. She overlaid the apartment’s original parquet floors with sleek concrete microtopping. They also went full “wood-clad core,” she adds, installing rift-cut white-oak walls throughout the dining room, kitchen, and living room. “It gave a cohesive warmth to the entire space,” she adds. Gerstein’s two teenage daughters made their own design contributions: Teecia, 12, chose her room’s wallpaper and color scheme, eventually settling for a more practical loft bed over her initial vision of a hanging bed. Meanwhile, Cela, 15, “wanted everything in soft pink,” Fennoy says. Since the renovation, “all their friends hang out here,” says Gerstein. “We’ve become the party house.” { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Tori Sikkema", "caption": "Entry foyer. Curved wood walls open a more spacious entry foyer and lead to a combined guest-and-media room. The artwork above the custom floating Revamp console is Letter to the Unknown #15, by Erin Zhao. The rug is Mixing Pixels of Wasp, by Ruben de Haas and Emma Larsson Ruben for Moooi. The Birdie’s Nest LED fixture is by Ingo Maurer.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/0b2/a48/649920561527d14368a0aa5c433295bbaa-ToriSikkemPhotography-RevampInteriorDesi.2x.rvertical.w570.jpg", "width": "1140", "height": "1426" } } Entry foyer. Curved wood walls open a more spacious entry foyer and lead to a combined guest-and-media room. The artwork above the custom floating Revamp console is Letter to the Unknown #15, by Erin Zhao. The rug is Mixing Pixels of Wasp, by Ruben de Haas and Emma Larsson Ruben for Moooi. The Birdie’s Nest LED fixture is by Ingo Maurer. Photo: Tori Sikkema { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Tori Sikkema", "caption": "The kitchen. The Heracleam III Endless fixture in nickel is by Bertjan Pot for Moooi. The backsplash tiles are by Patricia Urquiola at Stone Source. The chairs are Chubby Counter Stools in Brick, by Dirk van der Kooij.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/248/7f8/0d9f143294382f2f4159cce898609b5fa0-ToriSikkemPhotography-RevampInteriorDesi.2x.rhorizontal.w700.jpg", "width": "1400", "height": "934" } } The kitchen. The Heracleam III Endless fixture in nickel is by Bertjan Pot for Moooi. The backsplash tiles are by Patricia Urquiola at Stone Source. The chairs are Chubby Counter Stools in Brick, by Dirk van der Kooij. Photo: Tori Sikkema { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Tori Sikkema", "caption": "Guest room and media room. The wood paneling is custom by Revamp. The Akira carpet is by Kit Miles for Moooi. The pink sleeper sofa is by American Leather. The Olo Wu LED wall sconce is from Lumens. The cushion fabrics are Bark Cloth Noir, by Donghia, and Wild Rose at Dusk, by Iona Crawford. The shelving is by Rakks, and both the small and large Laccio tables are Marcel Breuer for Knoll from Design Within Reach.", "contentUrl": "https://pyxis.nymag.com/v1/imgs/6e4/c75/f05b8c6f0533d31ba3b13e03818dd13b16-ToriSikkemPhotography-RevampInteriorDesi.2x.rvertical.w570.jpg", "width": "1140", "height": "1426" } } Guest room and media room. The wood paneling is custom by Revamp. The Akira carpet is by Kit Miles for Moooi. The pink sleeper sofa is by American Leather. The Olo Wu LED wall sconce is from Lumens. The cushion fabrics are Bark Cloth Noir, by Donghia, and Wild Rose at Dusk, by Iona Crawford. The shelving is by Rakks, and both the small and large Laccio tables are Marcel Breuer for Knoll from Design Within Reach. Photo: Tori Sikkema { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Tori Sikkema", "caption": "The primary bedroom. Gerstein’s bedroom is swathed in a soothing neutral palette. The chaise is by Cristina Celestino for Moooi, and the headboard is custom-designed by Revamp. T