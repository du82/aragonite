["https://www.curbed.com/article/best-butcher-shops-nyc.html"]
title = "The Best Butcher Shops in NYC 2024"
description = "Our carefully vetted list of the best butchers in NYC, including shops for steaks, poultry, pork, and lamb; a shop that caters to large parties; and the best spot to get imported Japanese Wagyu."
full_description = '''best of new york Updated Mar. 15, 2024 The Best Butcher Shops in New York By Joshua David Stein, a cookbook author, critic, and journalist. Despite what his kids say, he's not a boomer. Best of New York New York Magazine’s own Yellow pages, containing exclusively excellent places. Best of New York New York Magazine’s own Yellow pages, containing exclusively excellent places. Photo-Illustration: Curbed; Photos: Getty To find the butcher shops on this list, we polled dozens of savvy New Yorkers — chefs, restaurateurs, and prolific hosts among them — to find out where they go for hard-to-find Japanese Wagyu or to special-order veal brains. We heard about Pino’s, which supplies Carbone and Song’E Napule; Staubitz Market, which has been open since 1917; and End’s Meat, an ecoconscious butcher. Not only is the meat top tier at these places, but the staff at these shops are extremely helpful, we hear, and will teach you how to cook a Denver Steak and tell you what to get for a party of 20. For Sausage Parties and Backyard Barbecues The Meat Hook, 397 Graham Ave., Williamsburg; 718-609-9300; themeathook.com When the meat hook opened in 2009, it joined a just-starting-to-open bunch of “New Williamsburg” specialty shops that would lure in people from other neighborhoods (Marlow & Sons was five years old; Saltie was brand new). The once-small counter space is now a 900-square-foot emporium with a classroom for instruction on how to cook offal or butcher a pig. Chef and author Natasha Pickowicz shops there for backyard gatherings. “Their large-format things are great for that,” she says, citing the in-house brined and smoked ham, which feeds 8 to 20. Other meant-for-a-crowd dishes include an entire rib roast and a pork loin with belly attached. For Ted Allen, host of Chopped, “what really sealed the deal for us was the incredible job they did catering a birthday party. Not just top-notch steak, ribs, and chicken but really creative sides and super-nice, friendly service.” The staff also welcomes collaboration, which drew in author Carla Lalli Music. “I can roll in with a rough idea of what I’m in the mood for or how many people I’m cooking for, and whoever is behind the counter will game it out with me,” she says. “We talk methods and prep, they show me some cool cuts that I’ve never heard of, then I get to watch them fabricate my order right in front of me.” For Special Orders and Serious Hand-Holding Foster Sundry, 215 Knickerbocker Ave., Bushwick; 718-569-8426; fostersundry.com Past the Taiwanese soy sauce, the dried fruit from Afghanistan, and jars of harissa is Aaron Foster’s whole-animal meat counter. Since 2015, Bushwick carnivores have been coming here for the shop’s grass-fed, grass-finished beef. Beef comes in on Tuesday, pig and lamb on Friday. Foster, the former Murray’s cheese buyer, is known to give out his number to those unfamiliar with some of the lesser-seen cuts, such as a whole Denver steak. “We email them all the time to ask for advice,” says Fernando Aciar, owner of nearby restaurant Ostudio at Night. The shop takes special orders, too; Aciar’s gotten veal brains for his grandmother’s croquetas and picanha for asados. “Everything from his cheeses to spices to pasta is the highest quality,” Aciar says. . Ask a Butcher Aaron Foster, owner of Foster Sundry in Bushwick { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Pete Gamlen", "contentUrl": "https://pyxis.nymag.com/v1/imgs/a96/917/1e60f8fff2b7b4d7c94fc4898f127f9fc3-0624STR-BoNY-aaron-final-cmyk.2x.rsquare.w570.jpg", "width": "1140", "height": "1140" } } Illustration: Pete Gamlen What meat should people eat more of?Americans eat remarkably little lamb. But cooked right, the flavor is delicious. I’d also love to see more people eat goat. It’s clean and a little more strongly flavored than lamb. And rabbit, too — I’ve lived in Italy, and people eat rabbit extensively there. It’s super-delicious. Can you suggest a cut of meat for a dinner party that won’t bankrupt the host?A classic roast beef is relatively inexpensive and surprisingly delicious done rare, hot from the oven, sliced thin with horseradish or mustard. You could do Yorkshire pudding if you’re feeling festive. These cuts are not in vogue, but they’re very good and inexpensive. What other cuts of meat are underrated?I grew up eating London broil, which is a top-round steak, and it sucked. It was cooked badly, just gross and tough. But the top-round steaks we get now are tasty and not as lean as you remember. Nowadays, everyone wants flank and hanger and skirt, but it’s worth taking a second look at something like a London broil. Trendy cuts do seem to go in cycles.For sure. Skirt steak used to be inexpensive and widely available. Now it’s one of our most popular cuts, and it’s not cheap. And hanger, I think, was popularized by cooking shows. These hosts would tell viewers to “ask your butcher for four hanger steaks.” But that’s four cows — the amount of hanger on an 800-pound steer is a pound or a pound and a half. We get one cow a week here. — Katie Arnold-Ratliff For Super-High-End Cuts of Japanese Beef Japan Premium Beef, 59 Great Jones St.; 212-260-2333; japanpremiumbeef.com Outside this boutique butcher in Noho that specializes in almost–impossible–to–find–in–New York Japanese beef, the walls are covered in graffiti and murals. (Next door is 57 Great Jones, Basquiat’s last studio.) Inside, everything is pristine. In the butcher case, neat tranches of meat are so marbled with fat they seem snow-covered. Opened in 2009, the store stocks imported Japanese A5 Miyazaki Wagyu and Washugyu, a crossbreed of Japanese Black Wagyu and American Angus sourced from Oregon. The meat is, predictably, pricey ($60 per pound for American tenderloin, $130 per pound for A5 striploin). Eunice Byun, the co-founder of Material and a frequent dinner-party host, says, “Time and time again, I find myself going to JPB when there’s something to celebrate because this place is just that special. Their meat is the definition of exquisite with our favorite being the dry-aged rib eye.” For Carbone’s Supplier Pino’s Prime Meat, 149 Sullivan St.; 212-475-8134; pinosprimemeat.com Leo Cinquemani, the current owner of 115-year-old Pino’s Prime Meat, mans the shop behind a case of chops, homemade sausages, and Murray’s chickens just as his father did (his dad traded his Cadillac for the store in the 1980s). Cinquemani works the counter with his brother, Sal, and his cousin, also Sal, and his friend Gustavo, whom he’s known since he was 5. The staff caters to locals and restaurants, providing lamb racks for Carbone, veal for Song’E Napule, and dry-aged steaks for Park Side Restaurant. Most everyone who walks in is greeted by name. “Pino’s is a family business, and everyone in there is family or becomes family,” says Miguel Trinidad, a chef who visits often for the ground-lamb burgers (“The gamy flavor and the spices are perfectly balanced,” he says) and a familiar feeling. “When I walk in, it feels like I’ve been transported back to my childhood on the Lower East Side,” he says. “The aroma of meat sparks that nostalgia of the New York I grew up in.” For an Old-School Shop Staubitz Market, 222 Court St., Cobble Hill; 718-624-0014; staubitz.com The squeak of the screen door of Staubitz Market has been heard on Court Street since 1917, when John Staubitz first opened the shop. Not much has changed — though John McFadden, who had been working the counter since 1967, died in 2022. Vintage light fixtures hang from the ceiling. Large photographs on the wall show butchers smiling from the 1920s to the 1990s. An old cashier’s booth still occupies the back corner. Today, McFadden’s son, John Jr., lobs friendly banter over the counter as he expertly carves a tenderloin or debones a shank. Customers come in for Staubitz’s rotisserie chickens and gluten-free chicken meatballs as well as the rosy cuts of meat, including Newport steaks for three. The staff also still picks up the landline. “I love that they answer the phone,” says Top Chef judge Gail Simmons, who buys everything from first-cut briskets to bags of chicken bones and schmaltz. “It makes me feel like I’m living in a tiny little village.” For the Ecoconscious Carnivore Ends Meat, 254 36th St., Unit 38, Sunset Park; 718-801-8895; endsmeatnyc.com To avoid industrial meat production — and the climate-wrecking that comes with it — Ends Meat buys from small farmers whose animals are well treated. “Ends Meat has some of the strongest sourcing ethics of pretty much any butcher in New York,” says food and agriculture writer Chloe Sorvino. Founder and head butcher John Ratliff uses every part of the Berkshire hogs, free-range chickens, and sides of beef delivered to Ends Meat’s two locations — one with a long lunch counter in Industry City, the other at the Market Line on the LES. One 350-pound hog becomes lonzas and lomos, coppas and culatellos, porchettas, pancetta, prosciutto, and pork chops. The heart becomes ’nduja and doggy treats; the skin, chicharrones. No part is left unexploited nor left to remain undelicious. But it’s not only Ratliff’s efficiency that attracts acolytes. K. C. Boyle, a political consultant who cooks for up to 20 people at least four times a month, says, “John’s dry-aged program is unmatched in the city. He has inventory from 80 to 140 days old. That’s incredibly rare, especially when the meat is grass fed and sourced from New York farmers.” Thank you for subscribing and supporting our journalism. If you prefer to read in print, you can also find this article in the March 11, 2024, issue of New York Magazine. Want more stories like this one? Subscribe now to support our journalism and get unlimited access to our coverage. If you prefer to read in print, you can also find this article in the March 11, 2024, issue of New York Magazine. More From Best of New York The Best Window Shades in New York The Best Fish Markets in New York The Best Wine & Spirits Shops in New York See All Tags: remove interruptions best of new york new york magazine Show Leave a Comment The Best Butcher Shops in New York const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'curbed'; const keywords = ["best of new york","new york magazine","remove interruptions"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript = document.createElement('script'); ldJsonScript.type = "application/ld+json"; ldJsonScript.innerHTML = JSON.stringify(structuredData); document.head.appendChild(ldJsonScript);'''
