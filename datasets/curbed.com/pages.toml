title = "Hannibal Buress Venue Opening in Old Knitting Factory Space"
description = "Hannibal Buress is opening a new performance venue, Isola Brooklyn, in the space formerly occupied by the Knitting Factory in Williamsburg."
full_description = '''openings Feb. 18, 2025 Hannibal Buress Is Opening a New Venue in Williamsburg By Clio Chang, a Curbed writer who covers everything New York City Photo: Johnny Nunez/WireImage/Getty Images Hannibal Buress is opening up a new venue called Isola Brooklyn in the former home of the Knitting Factory on Metropolitan Avenue in Williamsburg. The Knitting Factory, where Buress used to regularly perform, closed in 2022 after facing a 75 percent rent increase. “Good luck to whoever wants to take the space,” Morgan Margolis, the Knitting Factory’s CEO said at the time. (They relocated to Manhattan, occupying what was once the Pyramid Club on Avenue A in a collaboration with Baby’s All Right called Night Club 101.) Maybe Buress got a deal on the rent, or maybe he’s just that flush, but it’s nice that the old Knitting Factory will remain a performance space rather than becoming like a second Aesop or something. The opening is scheduled for March 9, with a performance from Buress (makes sense) and “surprise special guests.” Perhaps like Pete Davidson and Colin Jost before him, he thought opening a venue would be easier. “Getting this venue open took way longer than I thought and it was more expensive than I imagined,” Buress told Brooklyn Vegan. “I’m excited to move past the construction phase and get to putting on events.” (At least this one is on land.) View this post on Instagram A post shared by Hannibal Buress (@hannibalburess) What to expect from Isola? There’s not too much information out there yet but there will be weekly comedy nights. Buress teased Isola over the summer in an Instagram post where he scrolled through the website, making fun of his own copy. “Echoes of the past, sounds of the future — I think we got that from ChatGPT.” Related Pete Davidson and Colin Jost’s Ferry Is Very Much Happening Hannibal Buress Grows Up and Out Tags: hannibal buress the knitting factory isola brooklyn williamsburg metropolitan performance venue comedy baby's all right openings cityscape More Show Leave a Comment Hannibal Buress Is Opening a New Venue in Williamsburg const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'curbed'; const keywords = ["hannibal buress","the knitting factory","isola brooklyn","williamsburg","metropolitan","performance venue","comedy","baby's all right","openings","cityscape"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript = document.createElement('script'); ldJsonScript.type = "application/ld+json"; ldJsonScript.innerHTML = JSON.stringify(structuredData); document.head.appendChild(ldJsonScript);'''
