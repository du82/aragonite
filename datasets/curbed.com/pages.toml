["https://www.curbed.com/article/dasha-nekrasova-preservationist-turtle-bay-east-midtown-tower-beaux-arts-303-307-east-44th-street.html"]
title = "Red Scare’s Dasha Nekrasova goes NIMBY in Midtown"
description = "Drilling next door on East 44th Street pushed ‘Red Scare’ host Dasha Nekrasova into activism against a super-skinny high-rise tower."
full_description = '''street fights Feb. 24, 2025 Red Scare’s Dasha Nekrasova Goes Preservationist By Adriane Quinlan, an Emmy Award–winning Curbed writer who has reported on New York City for four years Photo: Leon Bennett/Getty Images Red Scare host Dasha Nekrasova has apparently left downtown and its conservative contrarians for stodgier Midtown East, where she has started showing up to community-board meetings. But rather than, say, advocate for a new tax cut for podcasters or the end of zoning or 24-hour bars, she seems to have adopted the position of any Upper East Side grandma. “I’m not a NIMBY,” she said. “But for the record, I don’t see why people don’t like NIMBYs.” At a meeting last week of Community Board 6, Nekrasova spoke in opposition to a 35-story skyscraper that has broken ground at 303 East 44th Street. In a Zoom recording of the meeting, she told the audience that she lives next door at the Beaux-Arts, a 1929 complex of mostly studio apartments, all rentals, that was landmarked in the 1980s. After she moved in a little over a year ago, she said the building next door was razed and contractors started drilling the foundation — making her unit unlivably loud during the day. (The podcast, recorded at night at Anna Khachiyan’s apartment, was unaffected). “It’s spoiled of me, sure,” she said. “But this is not about my personal inconvenience.” View this post on Instagram A post shared by ODA (@odanewyork) Instead, she told the board about her concern for the “imminent safety risk” at her building — a reasonable concern — given how another new tower cracked its neighbors on Fifth Avenue, while a project on Gay Street was so destructive it took down its neighbor. And Nekrasova’s building, the Beaux-Arts, is now in the middle of repairing its façade, work she worried would be undermined. Delivered in her trademark deadpan, it wasn’t immediately clear if she was a hostage reading a script written by her neighbors. Then she seemed to come alive when describing the new tower as a “cartoonishly skinny high-rise” that’s “not appropriate to the character of our neighborhood.” “I just think these super-skinny high-rises are extremely stupid and doomed, and I don’t think they belong in New York,” she said. “I don’t know who this even appeals to — it’s not Dubai. It’s not Tel Aviv.” She added, “One of the things I like about New York is the architecture. I guess it’s uncool.” Related Who’s Afraid of Podcast Provocateur Dasha Nekrasova? Midtown’s J.P. Morgan Sales Bump Tags: historic preservation midtown east dimes square dasha nekrasova street fights the real estate More Show Leave a Comment Red Scare’s Dasha Nekrasova Goes Preservationist const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'curbed'; const keywords = ["historic preservation","midtown east","dimes square","dasha nekrasova","street fights","the real estate"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript = document.createElement('script'); ldJsonScript.type = "application/ld+json"; ldJsonScript.innerHTML = JSON.stringify(structuredData); document.head.appendChild(ldJsonScript);'''
