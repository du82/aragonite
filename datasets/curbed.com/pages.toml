title = "The Best Psychics in NYC 2024"
description = "Our carefully vetted list of the best psychics in New York City in 2024 includes the best spot for a palm reading by a psychotherapist; a top psychic for chakra balancing; and psychics who practice acupuncture, tarot reading, and more."
full_description = '''best of new york Updated Mar. 14, 2024 The Best Psychics in New York By Kaitlin Menza, a writer who covers weddings and pop culture for the Cut. She's shared over 125 love stories to date for New York Magazine, largely as part of the "Wedding Files" series. Best of New York New York Magazine’s own Yellow pages, containing exclusively excellent places. Best of New York New York Magazine’s own Yellow pages, containing exclusively excellent places. Photo-Illustration: Curbed; Photos: Getty To find the best psychics in New York City, we polled savvy New Yorkers, including an entertainment attorney, an acupuncturist, and a podcaster. We heard about psychics with years of experience giving detailed readings, one who knows feng shui and can help you change the energy in your space, and one that will — in the nicest way — let you know when it’s time to break up with your boyfriend. For Years-Out Predictions Dante Sabatino, Tarot by Dante, 364 W. 18th St.; tarotbydante.com Over his 42 years as a psychic and tarot-card reader, Dante Sabatino has earned a reputation for his startling accuracy. “It’s truly shocking,” says one private wealth adviser. For Roxanne Ong, an executive at a beauty company, he has been able to predict events “as far as four years out.” Morgane Le Fay designer Liliana Casabal calls him “a true visionary.” And he is able to perform these detailed readings not only privately — in his Chelsea apartment or over Zoom (from $200 for 30 minutes) — but also at parties: Bulgari, Sephora, and Simon & Schuster have all hired him for private events. . Ask a Psychic Dante Sabatino, owner of Tarot by Dante in Chelsea { "@id": "#articleSchema", "image": { "@context": "http://schema.org", "@type": "ImageObject", "creditText": "Pete Gamlen", "contentUrl": "https://pyxis.nymag.com/v1/imgs/4a3/091/b61b931ac3e9b88f407f98f26e30f3568f-0624STR-BoNY-dante-final.2x.rsquare.w570.jpg", "width": "1140", "height": "1140" } } Illustration: Pete Gamlen How do your tarot readings unfold?I do a full session, which uses the whole deck and takes an hour. I set it up in this cross spread I created many years ago, and I read in piles. Each pile represents a different area of your psyche. As I work, I answer questions and discuss what I see and offer guidance. I get messages when the cards touch. I’ve been reading tarot for over 40 years and grew up with my mom reading cards. So I watched her technique, and my mentor’s, and I adapted their styles to create my own. Have your predictions ever come true?Recently, a woman I read for joined The Real Housewives of New York City — I predicted in her session a year and a half before she got cast that she would be on the show. I’m also good with pregnancies. I’ve predicted people will get jobs. I helped a client convince her father to seek medical treatment, and he was rushed into heart surgery. What do people ask about most?Their love life, their career. New Yorkers tend to ask about parenting and fertility because a lot of women here start trying to have a family later than women elsewhere. And, of course, health, security, future decisions. What do you say to skeptics?I love skeptics. Sometimes in my readings, I give specific details: “You’re going to buy a new piece of art that will match the color of your couch” or “Your grandmother’s watch broke, and you’re going to get it fixed.” And often it’s the clients who dismissed those predictions who come back to tell me they happened. — Katie Arnold-Ratliff For a No-Holds-Barred Tarot Reading Dainichi Lazuli, instagam.com/dainichi_lazuli Dainichi Lazuli reads tarot, heals with crystals, and advises on numerology and feng shui, operating (in normal times) out of the Chinatown Soup art gallery. (You can book him through his Instagram; $35 per 15 minutes.) A key to his popularity seems to be not only what he communicates but how. “He shares what he sees via the cards with such grace” says jewelry designer Anna Sheffield. Which doesn’t preclude him from giving direct advice. Danielle Prescod, writer and co-founder of the diversity consulting agency 2BG, says that “he’s told me to dump basically every guy since I started seeing him — and he was right about every single one of them.” For Chakra Balancing With Body Treatments Tracey Byer, 32 Union Sq. E., Ste. 415; traceybyer.com At the beginning of Tracey Byer’s sessions, “she’ll ask if she can see your tongue,” says client Yana Volfson, the beverage director at Cosme and Atla. (“The tongue is a canvas of what’s going on in your mind and body,” Volfson says.) Byer’s healing methods are less about making predictions than about balancing chakras, which she does not only by talking her clients through the issues on their mind but also by giving them body treatments, as she is a licensed acupuncturist, massage therapist, and aesthetician with an office in Gramercy. (You don’t have to go in to see her with a particular treatment in mind, says Volfson; the decision can be made based on how you’re feeling in your body at that moment.) “I don’t need to know my future. I’m not one of those people,” says Byer’s client Wendy Credle, an entertainment attorney and TV producer. Rather, Byer has helped her address what’s going on in the here and now: “She clued me in on where I was self-sabotaging and blocking,” Credle says. She can incorporate microneedling, aromatherapy, and cupping into her sessions, too (from $108 per hour). For a Palm Reading by a Psychotherapist Ellen Goldberg, 11 Cornelia St.; ellensschooloforacles.com A psychic who’s also a trained psychotherapist? It’s no wonder Ellen Goldberg is popular among powerful New Yorkers, like Paulette Cole, the CEO of ABC Carpet & Home. In each session, clothing historian Kate Sekules says, Goldberg “listens very closely, and reads everything — palms, cards, stars — for a true and deep view of you.” The Cornelia Street apartment where you can visit her again post-pandemic happens to be beautiful, in the back of a bright landmark building. (From $300.) For Intuitive Counseling and Spatial Cleansing Elana Kilkenny, address provided at booking; elanakilkenny.com Pre-pandemic, you could plop down on Elana Kilkenny’s couch in Morningside Heights, where she’d offer you a cup of tea and intuit obstacles and patterns holding you back. “She isn’t a prescriptive, ‘Do this, don’t do that’ psychic,” says Yuka Hagiwara, co-founder of Olo Acupuncture. “She can zone in on exactly what needs to be dealt with” — and from there, “with great sensitivity,” help you navigate it. “She sensed that I was emotionally and energetically exhausted and warned me against being ‘nice’ to everyone,” says Cass Alcide, co-host of the Scam City podcast. (intuitive counseling sessions start at $250.) Kilkenny also happens to be a “sacred space designer,” relying on years of training in interior design and feng shui to help clients transform the energy of their space. (This can entail anything from discussing memories different paint colors evoke to helping you figure out that it’s time to let go of inherited furniture you’re not actually fond of.) Thank you for subscribing and supporting our journalism. If you prefer to read in print, you can also find this article in the March 11, 2024, issue of New York Magazine. Want more stories like this one? Subscribe now to support our journalism and get unlimited access to our coverage. If you prefer to read in print, you can also find this article in the March 11, 2024, issue of New York Magazine. More From Best of New York The Best Window Shades in New York The Best Fish Markets in New York The Best Wine & Spirits Shops in New York See All Tags: remove interruptions best of new york new york magazine Show Leave a Comment The Best Psychics in New York const freeLayoutsInstances = [ 'ecom-article', 'ecom-products', 'non-monetizable' ]; const paywalledLayoutsInstances = ['paywalled-article']; const layoutInstance = document.querySelector('html').getAttribute('data-layout-uri').split('/instances/')[1].replace('@published', ''); const siteSlug = 'curbed'; const keywords = ["best of new york","new york magazine","remove interruptions"]; // This is set by handlebars in the server. const featureTypes = window._nymPermutive?.article?.featureTypes; const freeConditions = { isStrategist: !paywalledLayoutsInstances.includes(layoutInstance) && siteSlug === 'strategist', isFreeLayout: freeLayoutsInstances.includes(layoutInstance), hasExcludePaywallTags: /paywall exclude/i.test(keywords.join(',')), isEcomm: featureTypes && featureTypes.includes('ecomm') }; const structuredData = { '@context': 'http://schema.org', '@id': '#articleSchema', hasPart: { '@type': 'WebPageElement', cssSelector: '.article-content', isAccessibleForFree: false }, isAccessibleForFree: false }; for (const condition of Object.keys(freeConditions)) { if (!freeConditions[condition]) continue; structuredData.isAccessibleForFree = true; structuredData.hasPart.isAccessibleForFree = true break; } const ldJsonScript = document.createElement('script'); ldJsonScript.type = "application/ld+json"; ldJsonScript.innerHTML = JSON.stringify(structuredData); document.head.appendChild(ldJsonScript);'''
