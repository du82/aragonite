["https://curl.se/dev/testcurl.html"]
title = "curl - Automatic Test"
full_description = '''testcurl is the master script to use for automatic distributed testing of curl from git or daily snapshots. It is written for the purpose of being run from a crontab job or similar at a regular interval. The output is suitable to be mailed to curl-autocompile@haxx.se to be dealt with automatically (make sure the subject includes the word "autobuild" as the mail gets silently discarded otherwise). The most current build status (with a reasonable backlog) is published on the curl site, at https://curl.se/dev/builds.html dir is a curl source directory, possibly a daily snapshot one. Using this makes testcurl skip the autoreconf stage and thus it removes the dependency on automake, autoconf, libtool, GNU m4 and possibly a few other things. testcurl runs autoreconf (or similar), configure, builds curl and libcurl in a separate build directory and then runs make test to test the fresh build. Do not run autoreconf. Useful when many builds use the same source tree, as then only one need to do this. Also, if multiple processes run tests simultaneously on the same source tree (like several hosts on a NFS mounted directory), simultaneous autoreconf invokes may cause problems. (Added in 7.14.1) Do not update from git even though it is a git tree. Useful to still be able to test even though your network is down, or similar. filename to read setup from (deprecated). The old style of providing info. If info is missing when testcurl is started, it prompts you and then stores the info in a 'setup' file, which it looks for on each invoke. Use --name, --email, --configure and --desc instead. First, make a checkout from git (or you write a script that downloads daily snapshots automatically): With the curl sources checked out, or downloaded, you can start testing right away. If you want to use testcurl without command line arguments and to have it store and remember the config in its 'setup' file, then start it manually now and fill in the answers to the questions it prompts you for: Now you are ready to go. If you let the script run, it performs a full cycle and spit out lots of output. Mail us that output as described above.'''
