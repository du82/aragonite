["https://curl.se/docs/tutorial.html"]
title = "curl - Tutorial"
full_description = "Get a file from an SSH server using SCP using a private key (not password-protected) to authenticate: Get a webpage and store in a local file, make the local file get the name of the remote document (if no filename part is specified in the URL, this fails): It is just like for FTP, but you may also want to specify and use SSL-specific options for certificates etc. Note that using FTPS:// as prefix is the implicit way as described in the standards while the recommended explicit way is done by using FTP:// and the --ssl-reqd option. This is similar to FTP, but you can use the --key option to specify a private key to use instead of a password. Note that the private key may itself be protected by a password that is unrelated to the login password of the remote system; this password is specified using the --pass option. Typically, curl automatically extracts the public key from the private key file, but in cases where curl does not have the proper library support, a matching public key file must be specified using the --pubkey option. HTTP offers many different methods of authentication and curl supports several: Basic, Digest, NTLM and Negotiate (SPNEGO). Without telling which method to use, curl defaults to Basic. You can also ask curl to pick the most secure ones out of the ones that the server accepts for the given URL, by using --anyauth. Note! According to the URL specification, HTTP URLs can not contain a user and password, so that style does not work when using curl via a proxy, even though curl allows it at other times. When using a proxy, you must use the -u style for user and password. curl supports both HTTP and SOCKS proxy servers, with optional authentication. It does not have special support for FTP proxy servers since there are no standards for those, but it can still be made to work with many of them. You can also use both HTTP and SOCKS proxies to transfer files to and from FTP servers. If the proxy is specified with --proxy1.0 instead of --proxy or -x, then curl uses HTTP/1.0 instead of HTTP/1.1 for any CONNECT attempts."
year_published = 2025
clearnet = "https://curl.se/docs/tutorial.html"
tags = ["agent", "command", "conditions", "config", "connections", "curl", "curl-and-php", "curl-and-python", "curl-announce", "curl-library"]
