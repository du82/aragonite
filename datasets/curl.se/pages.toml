["https://curl.se/dev/runtests.html"]
title = "curl - Run curl tests"
full_description = '''runtests.pl runs one, several or all the existing test cases in curl's test suite. It is often called from the root Makefile of the curl package with 'make test'. If no test number or keyword is given, all existing tests that the script can find are considered for running. You can specify single test cases to run by specifying test numbers space-separated, like 1 3 5 7 11, and you can specify a range of tests like 45 to 67. Specify tests to not run with a leading exclamation point, like !66, which runs all available tests except number 66. It is also possible to specify tests based on a keyword describing the test(s) to run, like FTPS. The keywords are strings used in the individual tests. You can also specify keywords with a leading exclamation point and the keyword or phrase, like "!HTTP NTLM auth" to run all tests except those using this keyword. Remember that the exclamation marks and spaces need to be quoted somehow when entered at many command shells. When running without -s (short output), for instance when running runtests.pl directly rather than via make, each test emits a pair of lines like this: the first line contains the test number and a description. On the second line, the characters at the beginning are flags indicating which aspects of curl's behavior were checked by the test: The remainder of the second line contains the test result, current test sequence, total number of tests to be run and an estimated amount of time to complete the test run. Continue running the rest of the test cases even if one test fails. By default, the test script stops as soon as an error is detected. Run tests via bundled test binaries. Bundled test binaries contain all tests, and the test name passed as the first argument selects which test run. Provide a path to a custom curl binary to run the tests with. Default is the curl executable in the build tree. Enable protocol debug: have the servers display protocol output. If used in conjunction with parallel testing, it is difficult to associate the logs with the specific test being run.'''
