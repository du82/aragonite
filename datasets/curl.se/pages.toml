full_description = 'Daily updated graphs showing the state of the curl project in as much detail as possible. Columns: 1 · 2 · 3 · 5 | data view Each image below links to the corresponding CSV file with recently updated source data. The first and last lines of data is shown on the right. The number of calls is extracted by parsing the include/curl.h file in git at the time of past releases This data comes the counter in RELEASE-NOTES in git at the time of releases. The time from before we started doing that, the count has been manually counted. The data for this comes from the RELEASE-NOTES file in git at the time of releases. It can be noted that since this is per-release and some releases are done very quickly in time after a previous one, it is just natural that such releases have much fewer contributors. The data comes from the git repository. A "core team" member is everyone who did 10 or more commits to the main git repository within the same calendar year. The "CVE age" is the number of days the vulnerability had been present in source code when reported. Project age is how old the project was in number of days at the time that vulnerability was reported. The data counts lines added and removed to files in src, lib and include over time, in the git repository. The time is simply the number of days from the report to the curl project until the fix was released and annnounced publicly. This data is fetched from github daily using their API, then stored and massaged by scripts on our server. This data is fetched from github daily using their API, then stored and massaged by scripts on our server. This data is fetched from github daily using their API, then stored and massaged by scripts on our server. Lines of code means lines in the src, lib and include directories and is extracted from the git history of the repository. The number of options comes from parsing the include/curl.h header file from git as it changed over time. This data comes from parsing the two