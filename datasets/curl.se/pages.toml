["https://curl.se/docs/bugbounty.html"]
title = "curl - Bug Bounty"
full_description = 'The curl project runs a bug bounty program in association with HackerOne and the Internet Bug Bounty. After you have reported a security issue, it has been deemed credible, and a patch and advisory has been made public, you may be eligible for a bounty from this program. See the Security Process document for how we work with security issues. The curl project offers monetary compensation for reported and published security vulnerabilities. The amount of money that is rewarded depends on how serious the flaw is determined to be. Since 2021, the Bug Bounty is managed in association with the Internet Bug Bounty and they set the reward amounts. If it would turn out that they set amounts that are way lower than we can accept, the curl project intends to "top up" rewards. Everyone and anyone who reports a security problem in a released curl version that has not already been reported can ask for a bounty. Dedicated - paid for - security audits that are performed in collaboration with curl developers are not eligible for bounties. Vulnerabilities in features that are off by default and documented as experimental are not eligible for a reward. The vulnerability has to be fixed and publicly announced (by the curl project) before a bug bounty is considered. Once the vulnerability has been published by curl, the researcher can request their bounty from the Internet Bug Bounty. The curl security team reserves themselves the right to deny or allow bug bounty payouts on its own discretion. There is no appeals process. This bug bounty only concerns the curl and libcurl products and thus their respective source codes - when running on existing hardware. It does not include curl documentation, curl websites, or other curl related infrastructure. The curl bug bounty does not cover flaws in third party dependencies (libraries) used by curl or libcurl. If the bug triggers because of curl behaving wrongly or abusing a third party dependency, the problem is rather in curl and not in the dependency and then the bounty might cover the problem.'
year_published = 2025
