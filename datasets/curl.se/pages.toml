["https://curl.se/dev/vuln-disclosure.html"]
title = "curl - Vulnerability Disclosure Policy"
full_description = '''All known and public curl or libcurl related vulnerabilities are listed on the curl website security page. No information should be made public about a vulnerability until it is formally announced at the end of this process. That means, for example, that a bug tracker entry must NOT be created to track the issue since that makes the issue public and it should not be discussed on any of the project's public mailing lists. Messages associated with any commits should not make any reference to the security nature of the commit if done prior to the public announcement. The person discovering the issue, the reporter, reports the vulnerability on HackerOne. Issues filed there reach a handful of selected and trusted people. Messages that do not relate to the reporting or managing of an undisclosed security vulnerability in curl or libcurl are ignored and no further action is required. A person in the security team responds to the original report to acknowledge that a human has seen the report. The security team investigates the report and either rejects it or accepts it. See below for examples of problems that are not considered vulnerabilities. If the report is accepted, the team writes to the reporter to let them know it is accepted and that they are working on a fix. The security team discusses the problem, works out a fix, considers the impact of the problem and suggests a release schedule. This discussion should involve the reporter as much as possible. The release of the information should be "as soon as possible" and is most often synchronized with an upcoming release that contains the fix. If the reporter, or anyone else involved, thinks the next planned release is too far away, then a separate earlier release should be considered. Write a security advisory draft about the problem that explains what the problem is, its impact, which versions it affects, solutions or workarounds, when the release is out and make sure to credit all contributors properly. Figure out the CWE (Common Weakness Enumeration) number for the flaw. See SECURITY-ADVISORY for help on creating the advisory.'''
year_published = 2025
clearnet = "https://curl.se/dev/vuln-disclosure.html"
