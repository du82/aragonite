["https://curl.se/libcurl/c"]
title = "libcurl - API"
full_description = "Read the libcurl API overview and the libcurl tutorial to get a general idea of what libcurl programming is all about. Also, check out the examples. Dig into the Symbols In Versions document to learn in which libcurl releases symbols were added or removed. Every libcurl release is backwards compatible with the previous release. We do not break API nor ABI. Ever. The easy interface is a synchronous, efficient, quickly used and... yes, easy interface for Internet transfers. Numerous applications have been built using this. The multi interface is the asynchronous brother in the family and it also offers multiple transfers using a single thread and more. Get a grip of how to work with it in the multi interface overview. 1. init your easy-session and get a handle, which you use as input to the following interface functions you use. 2. Set all the options you want in the upcoming transfer, most important among them is the URL itself. You might want to set some callbacks as well that will be called from the library when data is available etc. 3. When all is setup, tell libcurl to perform the transfer. It will then do the entire operation and will not return until it is done or failed."
