["https://curl.se/dev/code-review.html"]
title = "How to code review in curl"
full_description = "Anyone and everyone is encouraged and welcome to review code submissions in curl. This is a guide on what to check for and how to perform a successful code review. All pull requests and patches submitted to the project should be reviewed by at least one experienced curl maintainer before that code is accepted and merged. On initial pull requests, let the tools and tests do their job first and then start out by helping the submitter understand the test failures and tool alerts. Be nice. Ask questions. Provide examples or suggestions of improvements. Assume the best intentions. Remember language barriers. If this is not a change that seems to be aligned with the project's path forward and as such cannot be accepted, inform the author about this sooner rather than later. Do it gently and explain why and possibly what could be done to make it more acceptable. Changing the API and the ABI may be fine in a change but it needs to be done deliberately and carefully. If not, a reviewer must help the author to realize the mistake. curl and libcurl are similarly strict on not modifying existing behavior. API and ABI stability is not enough, the behavior should also remain intact as far as possible. Most code style nits are detected by checksrc but not all. Only leave remarks on style deviation once checksrc does not find anymore. Minor nits from fresh submitters can also be handled by the maintainer when merging, in case it seems like the submitter is not clear on what to do. We want to make the process fun and exciting for new contributors. If a function or code rely on pointers being non-NULL, take an extra look if that seems to be a fair assessment. Conditions that should never be false can be verified with DEBUGASSERT() calls to get caught in tests and debugging easier, while not having an impact on final or release builds. Can the mallocs be avoided? Do not introduce mallocs in any hot paths. If there are (new) mallocs, can they be combined into fewer calls? We do not like static variables as they break thread-safety and prevent functions from being reentrant."
year_published = 2025
clearnet = "https://curl.se/dev/code-review.html"
