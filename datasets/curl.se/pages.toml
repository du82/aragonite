["https://curl.se/libcurl/features.html"]
title = "libcurl - What Makes It Special"
full_description = '''libcurl was released in its current "incarnation" in the year 2000 and it has been in constant use by a large number of applications and companies ever since. Sure there have been bugs and even a few security-related flaws, but it has remained a very solid and reliable library and lots of users are still using libcurl versions released many years ago as they stick with what works. libcurl is the most used C-based highly portable transfer library in the world. Some of the world's biggest companies use libcurl in high volume applications. Some of the open source applications using libcurl are very widely used. We estimate that every internet connected human on the globe uses (lib)curl, knowingly or not, every day. libcurl has been ported to numerous platforms and CPUs. libcurl offers the same API and feature set on all of them. Using libcurl assures you that you can write your application to work on very large amount of systems, including but not limited to Solaris, NetBSD, FreeBSD, OpenBSD, Darwin, HPUX, IRIX, AIX, Tru64, Linux, UnixWare, HURD, Windows, Amiga, OS/2, BeOs, macOS, Ultrix, QNX, OpenVMS, RISC OS, Novell NetWare, DOS and more... libcurl is thread safe but there are a few exceptions. Refer to libcurl-thread(3) for more information. There simply is no other HTTP and FTP library that can boast the same amount and set of features that libcurl does. Be it free or commercial. Also, libcurl's unique offer of both a pull and push interface allows applications to use it exactly the way they please. libcurl also offers an unmatched set of bindings, enabling you to access and use libcurl from basically whatever language you can think of. If compiled with IPv6 support enabled, All protocols work splendidly on IPv6 stacks. There are some minor quirks to keep in mind: kerberos4 does not work over IPv6 by design and the SOCKS4 support is not properly adapted for IPv6. There is nothing in particular needed to get IPv6 to be used, the library API remains exactly the same and adjusts to IPv4/IPv6 dynamically. You can use hostnames that only have AAAA DNS records, or you can use IPv6 IP-only style addresses like [::1].'''
year_published = 2025
clearnet = "https://curl.se/libcurl/features.html"
