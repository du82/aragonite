["https://curl.se/dev/tests-overview.html"]
title = "curl - Tests Overview"
full_description = '''"make test" builds the test suite support code and invokes the 'runtests.pl' perl script to run all the tests. The value of TFLAGS is passed directly to 'runtests.pl'. When you run tests via make, the flags -a and -s are passed, meaning to continue running tests even after one fails, and to emit short output. If you would like to not use those flags, you can run 'runtests.pl' directly. You must chdir into the tests directory, then you can run it like so: After a test fails, examine the tests/log directory for stdout, stderr, and output from the servers used in the test. Please install python-impacket in the correct Python environment. You can use pip or your OS' package manager to install 'impacket'. You may also need to manually install the Python package 'six' as that may be a missing requirement for impacket. If curl is built with Debug enabled (see below), then the runtests.pl script offers a -e option that makes it perform event-based. Such tests invokes the curl tool with --test-event, a debug-only option made for this purpose. Performing event-based means that the curl tool uses the curl_multi_socket_action() API call to drive the transfer(s), instead of the otherwise "normal" functions it would use. This allows us to test drive the socket_action API. Transfers done this way should work exactly the same as with the non-event based API. To be able to use --test-event together with --parallel, curl requires libuv to be present and enabled in the build: configure --enable-libuv All test servers run on "random" port numbers. All tests should be written to use suitable variables instead of fixed port numbers so that test cases continue to work independent on what port numbers the test servers actually use. The test suite runs stand-alone servers on random ports to which it makes requests. For SSL tests, it runs stunnel to handle encryption to the regular servers. For SSH, it runs a standard OpenSSH server. The listen port numbers for the test servers are picked randomly to allow users to run multiple test cases concurrently and to not collide with other existing services that might listen to ports on the machine.'''
year_published = 2025
clearnet = "https://curl.se/dev/tests-overview.html"
