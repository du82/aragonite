["https://curl.se/docs/help-us.html"]
title = "curl - Help us!"
full_description = '''We are always in need of more help. If you are new to the project and are looking for ways to contribute and help out, this document aims to give a few good starting points. You may subscribe to the curl-library mailing list to keep track of the current discussion topics; or if you are registered on GitHub, you can use the Discussions section on the main curl repository. One of the best ways is to start working on any problems or issues you have found yourself or perhaps got annoyed at in the past. It can be a spelling error in an error text or a weirdly phrased section in a man page. Hunt it down and report the bug. Or make your first pull request with a fix for that. Some projects mark small issues as "beginner friendly", "bite-sized" or similar. We do not do that in curl since such issues never linger around long enough. Simple issues get handled fast. If you are looking for a smaller or simpler task in the project to help out with as an entry-point into the project, perhaps because you are a newcomer or even maybe not a terribly experienced developer, here's our advice: In the issue tracker we occasionally mark bugs with help wanted, as a sign that the bug is acknowledged to exist and that there is nobody known to work on this issue for the moment. Those are bugs that are fine to "grab" and provide a pull request for. The complexity level of these of course varies, so pick one that piques your interest. Some bugs are known and have not yet received attention and work enough to get fixed. We collect such known existing flaws in the KNOWN_BUGS page. Many of them link to the original bug report with some additional details, but some may also have aged a bit and may require some verification that the bug still exists in the same way and that what was said about it in the past is still valid. On the autobuilds page we show a collection of test results from the automatic curl build and tests that are performed by volunteers. Fixing compiler warnings and errors shown there is something we value greatly. Also, if you own or run systems or architectures that are not already tested in the autobuilds, we also appreciate more volunteers running builds automatically to help us keep curl portable.'''
year_published = 2025
clearnet = "https://curl.se/docs/help-us.html"
