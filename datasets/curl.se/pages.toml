full_description = "The plumbing, related scripts and how to keep the curl RELEASE-NOTES file in sync during development so that it is in good shape at release time. by Daniel Stenberg at Twitch stream Shows the scripts, the procedures and the general process of making a curl release while releasing 8.12.0. by Daniel Stenberg at Twitch stream What the curl project does to minimize security risks: Security, Safety, Reproducibility, Vulnerability handling and the processes and tooling around it. by Daniel Stenberg at FOSDEM 2025 What exactly happens when you type a curl command into your shell and press enter? Daniel takes you through everything step-by-step from the shell to the network. by Daniel Stenberg at Twitch stream An introduction to doing internet transfers using libcurl's easy API. by Daniel Stenberg at wolfSSL webinar This talk goes through and focuses on some of the most powerful and interesting additions to curl done in recent years. by Daniel Stenberg at Twitch stream In this keynote speech, Daniel shares some of the highlights (and lowlights) of running a successful Open Source project. by Daniel Stenberg at PyCon Sweden 2024 This webinar is a must-watch for anyone eager to enhance their libcurl skills and explore its full potential. by Daniel Stenberg at wolfSSL webinar Christian talks about work he did for curl on Apple operating systems and related Apple specific details. by Christian Schmitz at curl-up 2024 Daniel talks about the new sibling in the curl project family. What it is and why it exists. by Daniel Stenberg at curl-up 2024 Dan talks about his test results analytics system and the combat and struggle against flaky tests and failing CI jobs. by Dan Fandrich at curl-up 2024 Daniel talks about using libraries and backends with curl that are written in rust. by Daniel Stenberg at curl-up 2024 Stefan talks about HTTP performance in curl over the last few years. by Stefan Eissing at curl-up 2024 James talks about and shows off his work on command line argument fuzzing. by James Fuller at curl-up 2024"
