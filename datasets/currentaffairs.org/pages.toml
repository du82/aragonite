full_description = '''Frequently Asked Questions Welcome to the luminous and cheery world of Current Affairs. FAQs Q: I subscribed to the print magazine. When will I receive it? At what point should I be concerned that it got lost, or wasn't sent, or some other tragedy befell it? A: This depends on when you subscribed. Our magazine is released six times a year, every other month. If you subscribed in September, for example, your first edition of the print magazine will be the September/October issue. This issue will be sent to the publishing house to be printed at the end of October and will begin shipping out the first couple of weeks in November. If you live in the United States, you should receive your copy early to mid November. International readers will most likely receive their copies a couple of weeks after that in late November. - If you subscribe between November 1 - December 31, you will receive your first issue (Issue 51) in January 2025 - If you subscribe between January 1 - February 28, you will receive your first issue (Issue 52) in March 2025 - If you subscribe between March 1 - April 30, you will receive your first issue (Issue 53) in May 2025 Q: When will I receive the digital version of the magazine? A: The magazine is released six times a year, every other month. For example, the digital version of the January/February issue is released at the end of February. It should be sent straight to your inbox. If you aren't receiving it, please check your email preferences (see Q&A below) to make sure you are subscribed to the "Magazine Subscription" option. Q: I want to unsubscribe to the marketing emails, but I'd still like to receive my News Briefings. How do I do this? A: At the bottom of every email we send, you will see an option to "update your preferences". Follow that link to access your email subscription options. Uncheck the boxes next to the emails you would NOT like to receive anymore (i.e. Marketing emails). Clicking "unsubscribe" instead of "update your preferences" will unsubscribe you from ALL emails including magazine release emails. This is NOT how you unsubscribe from the magazine or the News Briefings. You must login or email help@currentaffairs.org to cancel your subscriptions and stop the payments. Q: Is there a tracking number on the magazine? A: The USPS does not track magazines. If your magazine does not arrive, we can send you another if you email help@currentaffairs.org. Q: My magazine never showed up. How do I get a new one? A: Please email help@currentaffairs.org and we will have a new magazine sent to you. Q: How do I access the digital version of the magazine? A: You can visit our issues archive page here. Our most recent issues have not yet been made public, but you will receive an email when you subscribe that offers access to them. Q: How often does the magazine come out and how long is my subscription good for? A: The magazine is released digitally and in print six times a year. Monthly subscriptions are charged each month until you cancel. If you bought an annual subscription, your subscription will renew on your one-year anniversary. Q: How do I log in into my account? A: If you are already a subscriber, click “Sign in” at the top right on the Home page. After you enter your email address that is associated with your CA subscription, you should receive a secure link in your inbox. You will be redirected back to your account page where you can update or cancel your subscriptions, update your mailing/billing address, payment method and see other information like payment history. Q: How do I cancel my subscription? A: Once you sign in, you will see an option to cancel. Q: How do I upgrade my subscription from one tier (i.e. Just the News) to another (i.e. Print + Digital + News)? A: Once you sign in, you will see an option to update/change your subscription. Q: How do I update the email address associated with my account? A: Please email help@currentaffairs.org with the current email address associated with your account and the email address you would like to change it to. Someone on our customer service team will take care of this for you. Q: My subscription auto-renewed when I did not want it to. A: Subscriptions renew automatically on their anniversary date. If your subscription auto-renewed but you did not want to renew, please email help@currentaffairs.org and we will cancel your subscription and process a refund. Q: I used to be able to log in with a username and password. What has changed? A: We have upgraded the backend of our website, and sign-in is now via email. If you subscribed before June 1, 2024 when our website transitioned, would like to change or cancel your subscription, please email help@currentaffairs.org for assistance. Q: Is my information safe and the login process secure? A: Yes! The login link sent to your email will expire after 30 minutes. Q: I ordered a t-shirt and a mug from the CA shop. I have received my shirt but not my mug. Where is my mug!? A: Occasionally we ship things from Current Affairs headquarters (t-shirts, stickers, etc.) but other items are print-on-demand and will ship from the manufacturer (mugs, tote bags, hats, etc.). Books, magazines and posters ship from the publishing house. So your orders may arrive separately. Q: I was sent a gift subscription. How do I redeem it? A: First find your code by clicking "download now" on the email you were sent by the lovely person that gifted you a subscription. A PDF with your code will automatically download. Once you have the code, click "subscribe" under the subscription you would like to purchase on our website. This will bring you to the checkout screen where you can enter it in where it says "add promotion code". (If you choose a monthly subscription, the monthly amount will be subtracted from the total gift subscription amount until the balance reaches zero.) Q: I am currently in the U.S. but I am trying to purchase an international subscription but I am having trouble doing so on your website. What should I do? A: For security reasons, our checkout service does not allow this but please email help@currentaffairs.org and we will be happy to create you a subscription on our end! Q: I want to pitch an idea for an article or amusement, or be considered as a contributing artist / illustrator. How do I do this? A: If you are a writer, please use our pitch form. Our writers’ guide tells more about what we are looking for. Before submitting, we recommend looking through the Issue Archive and our website to get a sense of what Current Affairs tends to publish. If you are an artist, you can use the same form and include a link to your portfolio. If you have not heard from us within three weeks, we are unable to use your pitch. But please do not be discouraged, and consider pitching us again if you have other ideas! Please use the form rather than emailing us as it guarantees that your pitch will be reviewed by our editorial team. Q: How do I book Nathan J. Robinson to speak at my event, on my podcast, etc.? A: Please send an email with the details to editor@currentaffairs.org. Q: What happened to the RSS feed? A: Here is the RSS feed link: currentaffairs.org/news/rss.xml Q: How do I place an ad in current affairs? A: You can’t. Nor a “sponsored post.” Or a sponsored hyperlink. We do not place ads anywhere on our website, except for the spare humorous and visually pleasing ad extolling our own products. Don’t email us about ads or sponsorships. Please unsubscribe us from your lists. Current Affairs Inc. is registered with the Internal Revenue Services as a 501(c)(3) nonprofit organization with EIN 83-1675720. Gifts are tax deductible to the extent allowed by law. If you are interested in helping to fund our work, or know of individuals and organizations who would be, please email editor@currentaffairs.org. Q: I have a question that is not answered on this list. A: Please email help@currentaffairs.org Contact Us Email Need to contact us regarding anything else? Email us at: help@currentaffairs.org! Location Send us mail at: Current Affairs 300 Lafayette St. #210 New Orleans, LA 70130'''
