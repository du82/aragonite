title = "News Briefing"
full_description = '''THE NEWS BRIEFING SERVICE The news delivered to your inbox every Tuesday and Friday An entertaining and thorough digest of the week’s most important (and often neglected) news stories, from one of the country’s leading independent political magazines. Our aim is to create a rich, entertaining, and thought-provoking newsletter that won't end up in the "spam" folder. The Current Affairs Biweekly News Briefing is an entertaining and thorough digest of the week’s most important news stories. Filled with links to interesting reading material and high-quality analysis of critical events, the News Briefing helps readers figure out what matters and navigate informational chaos. If you want to find out what you ought to know about, and what you’re missing, and hate having to muddle your way through clogged social media feeds and paywalled, ad-riddled news sites, we’re here to help you! The briefing is a paid service, so that we can pay writers to produce a truly stellar digest for you. Current Affairs is not for profit and, like all the rest of our work, the news briefing carries NO outside advertising and is entirely reader-supported. We hope you enjoy it! SUBSCRIBE TO THE BRIEFING ARCHIVE OF PAST BRIEFINGS For free readers, these appear two weeks after their initial publication. February 18, 2025 ❧ Javier Milei’s crypto scandal, the Trump administration blackmails Eric Adams, and union-busting in Utah Plus: Atlanta protesters disrupt the Border Patrol, an environmental org supports polar bear hunting, RFK Jr.'s “wellness farms,” and a strong shrew spine Read more >>> February 14, 2025 ❧ Shell gets sued for causing oil spills, Pelosi has a left-wing opponent, and the so-called “Gulf of America” Plus: Two horrifying stories about homelessness, RFK Jr. is confirmed, social media surveillance, and a modern Jonah Read more >>> February 11, 2025 ❧ Eric Adams gets away with it, Trump’s Gitmo deportation camp, and a Palestine and Sudan protest at the Super Bowl Plus: A bad day for neo-Nazis, fossil fuels on trial, Israel raids bookstores, and Palmerston the cat becomes a colonial official Read more >>> February 7, 2025 ❧ The Super Bowl police state, Trump’s plans for Gaza, and Colombia’s president Plus: 10,000 grocery workers on strike, a blind man with a gun, and a really weird fact about platypuses Read more >>> February 4, 2025 ❧ Seattle's public housing referendum, Elon takes over the Treasury, Plus: El Salvador wants to imprison American citizens, an uninspiring new DNC chair, conservatives are obsessed with Djibouti, and penguins take 10,000 naps per day. and LA protests ICE Read more >>> January 31, 2025 ❧ A plane crash in D.C., the IMF extorts Zimbabwe, and Trump sending deportees to Guantanamo Plus: Whole Foods gets a union, hearings for Tulsi Gabbard and RFK Jr, a huge green energy project, and Serbian donkey cheese Read more >>> January 28, 2025 ❧ China’s AI breakthrough, Al Sharpton goes to Costco, and Trump’s latest horrible deeds Plus: Gustavo Petro puts Trump in his place, student journalists battle censorship, and a parrot makes death metal albums Read more >>> January 24, 2025 ❧ “Mass deportations” begin, More tax cuts for the rich, and Rubio pushes regime change in Venezuela Plus: Israel assaults the West Bank, Turkey negotiates with the Kurds, Corbyn questioned by police, and a cannon for salmon Read more >>> January 21, 2025 ❧ Displaced Gazans return home to rubble, Jeff Landry persecutes the homeless, and Trump is back Plus: Leonard Peltier comes home, Syrians resist HTS's economic plans, and a funky-looking weevil Read more >>> January 17, 2025 ❧ TikTok Ban, More UnitedHealth scandals, Journalist dragged from State Dept. briefing Plus: Faiz Shakir runs for DNC chair, Vivek runs for Ohio governor, soup-flavored cough drops, and a monkey with a mustache Read more >>> January 14, 2025 ❧ California’s incarcerated firefighters, a possible ceasefire in Gaza, and the effort to stop RFK’s confirmation Plus: The Supreme Court considers PrEP, hunt saboteurs save wolves, and rats drive tiny cars! Read more >>> January 10, 2025 ❧ Wildfires in L.A., genocide allegations in Sudan, and 6 years in prison for stealing bread Plus: A tenant union victory, Jimmy Carter’s funeral, Democrats fail to protect the NLRB, and a caterpillar with a bizarre hat Read more >>> January 7, 2025 ❧ Trudeau to step down, Tech elites suck up to Trump, and more stock trading in Congress Plus: Credit Suisse's Nazi ties, a ski resort strike, Andrew Tate's political party, and cuttlefish see in 3-D! Read more >>> January 3, 2025 ❧ A terror attack in New Orleans, Amazon linked to human trafficking, and an Indian labor leader on hunger strike Plus: Honduras defies Trump, Bernie’s new committee role, a shocking spike in homelessness, and elephant pranks! Read more >>> December 20, 2024 ❧ Elon Musk shuts down the government, Amazon workers strike, and Mr. Beast goes tomb-raiding Plus: Honduras defies Trump, Bernie’s new committee role, a shocking spike in homelessness, and elephant pranks! Read more >>> December 17, 2024 ❧ Privatizing the mail, a potential strike at Amazon, and RFK’s lawyer wants the polio vaccine gone Plus: More mysterious drones, Australia arrests climate protesters, Trump settles a lawsuit, and rats wearing tiny backpacks Read more >>> December 13, 2024 ❧ Biden’s pardons, insurance industry propaganda, and Tories vs. sandwiches Plus: A “free market” Syria, a SpaceX company town, stock buybacks, and innovations in whale fashion Read more >>> December 10, 2024 ❧ Luigi Mangione arrested, Assad falls in Syria, and the cops make crack Plus: Trump jokes (?) about annexing Canada, Jonestown is back, Daniel Penny gets away with it, and the Tasseled Wobbegong is a weird shark Read more >>> December 6, 2024 ❧ UnitedHealth’s CEO gets shot, the French government collapses, and RFK is at it again Plus: Bad news for Elon Musk, ending capital punishment in Indiana, a special poem, and smelly bearcats Read more >>> December 3, 2024 ❧ Joe pardons Hunter, martial law in South Korea, and prisoners burn themselves in protest Plus: Two big labor strikes, a socialist in Georgia, Trump threatens the BRICS, and cats on horseback! Read more >>> November 29, 2024 ❧ Ceasefire in Lebanon, Sheinbaum tangles with Trump, and a new Secretary of Labor Plus: Another ICC prosecution, Irish nationalist rappers, stats on the failed Harris campaign, and symbolic turkeys Read more >>> November 22, 2024 ❧ Land mines to Ukraine, Gaetz bows out as A.G., and a “potato cartel” Plus: Justice for Botham Jean, The ICC indicts Netanyahu, cats vs. geese in Hawaii, and the Darth Vader Beetle Read more >>> November 19, 2024 ❧ Trump appoints Dr. Oz to run Medicare, Ukraine strikes Russia with U.S. missiles, and huge NYPD salaries Plus: Texas censors abortion websites, Bernie agrees with Trump on something, “woke sandwiches,” and World Anteater Day Read more >>> November 15, 2024 ❧ Musk leads the DOGE, RFK “runs wild” on public health, and Israel ignores Biden’s aid deadline Plus: Amazon union updates, victory for Abu Ghraib detainees, a “Rent is Too Damn High” protest, and a flock of goats in a tree Read more >>> November 12, 2024 ❧ Little Marco Rubio, COP29 off to a bad start, and the Dems’ money woes Plus: Putin’s “ministry of sex,” more disasters in Cuba, Anthony Weiner returns, and dogs can drive! Read more >>> November 8, 2024 ❧ Trump’s first staff picks, Israel admits ethnic cleansing, and an app for boycotts Plus: Bernie blasts the Dems, Nigeria frees protesters, more ballot measures, and monkeys on the loose! Read more >>> November 6, 2024 ❧ Election results special! Trump has won, but all is not lost. Read more >>> November 1, 2024 ❧ The U.S. Archives censor history, the GOP wants to crush Palestine activism, and catastrophic floods in Spain Plus: A lawsuit over Abu Ghraib, Biden bites a child, Canadian postal workers prepare to strike, and a Hindu dog festival Read more >>> October 29, 2024 ❧ Marijuana workers fight for a union, Ritchie Torres has awful donors, and Evo Morales almost gets assassinated Plus: Trump’s racist rally, Bezos pulls strings at the Washington Post, and a frog with a strange weapon Read more >>> October 25, 2024 ❧ A worrying poll on immigration, the BRICS summit ends, and California votes on prison slavery Plus: Tucker Carlson says something creepy, the Boeing strike continues, and oarfish are basically sea serpents Read more >>> October 22, 2024 ❧ Trump’s bizarre housing plans, Cuba’s blackouts, and the scam of “clean carbon” Plus: Israeli killdozers, scurvy is back, Elon pays voters, the death of Gülen, and a “bootylicious” mouse Read more >>> October 18, 2024 ❧ Betsy DeVos donates millions, Texas prisons ban a book, and Israelis plan to settle Gaza Plus: The latest from the Pyongyang Times, India builds bullet trains, the death of Yahya Sinwar, and a very ambitious Egyptian dog Read more >>> October 15, 2024 ❧ Kamala’s pitch to Black men, Southeast Asian workers on meth, and Colin Allred gets transphobic Plus: New atrocities from Israel, Josh Hawley’s private jets, calling the cops on Burger King, and pikas puff up Read more >>> October 11, 2024 ❧ Walz wants to abolish the Electoral College, Saudi Arabia at the UN, and America’s deadly factories Plus: Netanyahu’s latest threat, the Chippendales unionize, trouble at the Internet Archive, and MANY RACCOONS. Read more >>> October 8, 2024 ❧ Gaza one year later, Oklahoma's “Trump Bible” scam, and the GOP sabotages hurricane recovery Plus: Hurricane Milton, MTG's weather conspiracy, Kamala embraces big business, Trump embraces eugenics, and some birds are poisonous. Read more >>> October 4, 2024 ❧ War brewing in the Middle East, Vance and Walz debate, and Minnesota’s medical debt reforms Plus: A tentative deal in the port strike, a “weird” typhoon hits Taiwan, and NYC rats are on birth control Read more >>> October 1, 2024 ❧ Harris “underwater” in Michigan?, Britain quits coal,