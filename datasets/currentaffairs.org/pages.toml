["https://currentaffairs.org/about-us"]
title = "About Us"
full_description = "About Us Welcome to the luminous and cheery world of Current Affairs. Our Story Current Affairs was launched by roommates Oren Nimni and Nathan J. Robinson via a Kickstarter campaign in 2015, which promised “a new print magazine of political analysis, satire, and entertainment” that would “bring wit, color, and verve back to print media!” With $16,607 of their $10,000 goal raised, the magazine Current Affairs was born! Since that successful Kickstarter campaign, Current Affairs has been entirely supported by subscriptions, purchases, and donations from readers. No large corporate donors, no opaque foundations, and no advertisements have contributed to Current Affairs. We have expanded to include a podcast, which is entirely funded by generous Patreon donors, a News Briefing, and videos. Current Affairs Inc is registered with the Internal Revenue Services as a 501(c)(3) nonprofit organization with EIN 83-1675720. Gifts are tax deductible to the extent allowed by law. If you are interested in helping to fund our work, or know of individuals and organizations who would be, please email editor@currentaffairs.org. FAQs Check out our Frequently Asked Questions page. Contact Us Submit a pitch If you are a writer, please use our pitch form. Our writers’ guide tells more about what we are looking for. Before submitting, we recommend looking through the Issue Archive and our website to get a sense of what Current Affairs tends to publish. If you are an artist, you can use the same form and include a link to your portfolio. If you have not heard from us within three weeks, we are unable to use your pitch. But please do not be discouraged, and consider pitching us again if you have other ideas! Please use the form rather than emailing us as it guarantees that your pitch will be reviewed by our editorial team. Manage your subscription If you are already a subscriber, click “Sign in” at the top right on the Home page. After you enter your email address that is associated with your Current Affairs subscription, you should receive a secure link in your inbox. You will be redirected back to your account page where you can update or cancel your subscriptions, update your mailing address and see other information like payment history. Place an ad in current affairs You can’t. Nor a “sponsored post.” Or a sponsored hyperlink. We do not place ads anywhere on our website, except for the spare humorous and visually pleasing ad extolling our own products. Don’t email us about ads or sponsorships. Please unsubscribe us from your lists. Email Need to contact us regarding anything else? Email us at: help@currentaffairs.org! Location Send us mail or visit us at: Current Affairs 300 Lafayette St. #210 New Orleans, LA 70130"
