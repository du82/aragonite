full_description = '''Why Joe Rogan Believes In Fake Archaeology February 28, 2025 The popular podcaster has repeatedly had on guests who think Atlantis was real. Today we talk to a genuine archaeologist, Flint Dibble, who tries to reason people out of delusions. by Current Affairs Why the Democrats Fear Populism February 19, 2025 Thomas Frank reviews the history of how the Democratic Party became the party of liberal elites, why right-wing populism is fake populism, and more insights from his decades-long writing career. by Current Affairs Krystal Ball on How To Fix American Politics and Media February 04, 2025 "Breaking Points" host Krystal Ball in a post-election discussion on where the Left needs to go from here and the perils of "independent" media. by Current Affairs Why Did We Stop Talking About Medicare For All? January 23, 2025 Medicare for All has seemingly dropped out of the political conversation. Dr. Adam Gaffney, a physician and Medicare for All expert, explains why we still need a single-payer healthcare system and addresses misleading talking points that are often made against it. by Current Affairs What Harms Will AI Cause, and What Can We Do About Them? January 22, 2025 Garrison Lovely on the risks posed by AI, why company self-regulation is not enough, and what we can do about it. by Current Affairs The Taking of Children December 13, 2024 Sociology and law professor Dorothy Roberts exposes how the child protective system systematically targets poor Black families and argues that abolition of the system is necessary to stop this injustice. by Current Affairs Trumpworld’s Favorite Writer Says The Right Must Emulate Dictators in Battling Leftist 'Unhumans' December 09, 2024 Joshua Lisec’s work is highly regarded by J.D. Vance, Donald Trump Jr., and Steve Bannon. He thinks democracy is overrated and that law should be used as a tool of political revenge. He spoke to Current Affairs to explain why his book praises McCarthyism and dictatorships. by Nathan J. Robinson Understanding the Roots of Far-Right Politics December 04, 2024 Richard Seymour, author of 'Disaster Nationalism,' argues that the roots of far-right politics lie not just in economics but in people's feelings about the world. by Current Affairs'''
