news spectacular! The latest from workers’ struggles in the US, UK, Namibia, Sri Lanka, China, Israel-Palestine, and Australia - plus songs, poems, and MUCH MORE! Read more >>> August 30, 2024 ❧ Kamala wants to build the wall, huge reforms in Mexico, and the ACLU sues over campus Palestine protests Plus: New data on police violence, RFK abducts a dead whale, and a “suspicious incident” Read more >>> August 27, 2024 ❧ Biden’s phony fossil-fuel numbers, Kentucky prisoners hack their tablets, and a “right to disconnect” Plus: Rent control in Mexico City, Israel destroys a historic mosque, and armadillos always have EXACTLY four babies Read more >>> August 23, 2024 ❧ The DNC snubs Palestinian speakers, Ron DeSantis loses big, and the Ukraine war spills into Africa Plus: RFK Jr. drops out, a landlord tries to extort a dead woman, and Swedish crows collect cigarette butts Read more >>> August 20, 2024 ❧ Labor & Palestine at the DNC, Missouri funds anti-abortion groups, and Mexico's “dirty war” Plus: Remembering Phil Donahue, Purdue Pharma, Perdue chicken, a parliament fight in Turkey, and a bird with a massive mouth Read more >>> August 16, 2024 ❧ Kamala's price gouging plan, middlemen killing Alabama pharmacies, and new elections in Venezuela? Plus: The wonders and horrors of “Grok,” Liz Truss gets ambushed with lettuce, and frogs and tarantulas are friends Read more >>> August 13, 2024 ❧ Extreme heat kills 47,000, “No Tax on Tips,” and Greg Abbott’s horrible new hospital policy Plus: Ukraine enters Russia, J.D. Vance does drag, and you can now buy "Seagull Insurance" Read more >>> August 9, 2024 ❧ Kamala scolds Gaza protesters, a national tenants' union, and trans rights in Nepal Plus: How to fight Wall Street with a cello, LA's homeless deaths, free diapers in Tennessee, AIPAC buys another primary, and a house fit for a mouse. Read more >>> August 6, 2024 ❧ Tim Walz gets the VP nod, racist riots in the UK, and climate denial in Congress Plus: A bear cub, a bear market,