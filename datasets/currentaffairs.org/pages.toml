full_description = "Why Joe Rogan Believes In Fake Archaeology February 28, 2025 The popular podcaster has repeatedly had on guests who think Atlantis was real. Today we talk to a genuine archaeologist, Flint Dibble, who tries to reason people out of delusions. by Current Affairs We Should Be Neither 'Anti-Natalist' Nor 'Pro-Natalist' February 27, 2025 People should have the number of children they want to have, and the state’s job is to assist them in achieving their aspirations. by Nathan J. Robinson We Must Fight Against Anti-Muslim Propaganda February 26, 2025 On Elon Musk’s “X,” people talk about Muslims like Hitler talked about Jews. The fight against Islamophobia is as crucial as the antifascist struggle of the 1930s. by Nathan J. Robinson The Left Needs to Move Beyond Bernie Sanders February 25, 2025 Sanders is one of the most popular politicians in the US, and his political analysis and messaging remain as relevant and compelling as ever. But while his Tour to Fight Oligarchy is inspiring and important, the broad left badly needs a political vision that goes beyond Sanders. by Lily Sánchez Skepticism Is Not Science February 24, 2025 People like Elon Musk and RFK Jr. think that “questioning the science” is the essence of science. They are wrong. by Nathan J. Robinson People Turn To 'Manifesting' Because the Economy Fails Them February 21, 2025 The idea that one might magically manifest wealth is an old one. In today's unequal society, 'manifesting' tells us to double down on ourselves instead of working to create a more egalitarian society. by Lauren Fadiman Why the Democrats Fear Populism February 19, 2025 Thomas Frank reviews the history of how the Democratic Party became the party of liberal elites, why right-wing populism is fake populism, and more insights from his decades-long writing career. by Current Affairs Guantánamo Is The Place Where Presidents Abuse Human Rights February 18, 2025 Guantánamo Bay has a sordid history of human rights abuses. There is no reason to keep people there except to evade oversight, which is why Trump has big plans for it. by Nathan J. Robinson"
