title = "Privacy Policy"
full_description = "Policies Privacy Policy Current Affairs, Inc. operates a website, found at www.currentaffairs.org; delivers a newsletter via email; creates a podcast; and makes similar content available to mobile users. Our Privacy Policy applies when you use any of these services. It describes the kinds of information we may gather when you use the services, how we use your information, when we might disclose your information, and how you can manage your information. Our policy does not apply to websites maintained by other companies or organizations to which we may link or who may link to us. We are not responsible for the actions and privacy policies of third party websites. By using our services, you are accepting the practices described in our Privacy Policy, including our use of cookies and similar online tools. If you do not agree to the terms of this Privacy Policy, please do not use our services. What information do we gather about you? The information we gather falls into two categories: 1. Personal information you voluntarily supply when you subscribe, order, complete a survey, or provide your email address and 2. Tracking information collected as you navigate through our site. Paid products and services While our website is free, we do sell products such as subscriptions and back issues. To enable the purchase of these and other products, we collect and store names and addresses of customers. We use the third-party service Stripe for payment processing. We will not store or collect your payment card details. That information is provided directly to our third-party payment processors whose use of your personal information is governed by their Privacy Policy. These payment processors adhere to the standards set by PCI-DSS as managed by the PCI Security Standards Council, which is a joint effort of brands like Visa, Mastercard, American Express and Discover. PCI-DSS requirements help ensure the secure handling of payment information. Stripe’s Privacy Policy can be viewed at https://stripe.com/us/privacy. Aggregate Information Collected Through Technology Cookies and Other Technologies As is standard practice on many websites, Current Affairs uses “cookies” and other technologies for legitimate interests to recognize you to help us understand which parts of our website are the most popular, where our visitors are going and how much time they spend there. We use Google Analytics to do this collection. You have the option to opt-out of Google Analytics cookies altogether here: https://tools.google.com/dlpage/gaoptout?hl=en. Our website also uses session cookies to recognize your user login and maintain items in your cart as you navigate the site and refresh pages. Current Affairs uses no cookies for the purposes of marketing or advertising. What do we do with the information we gather about you? statistical analysis Current Affairs may perform statistical, demographic and marketing analyses of subscribers, and their subscribing and purchasing patterns, for marketing and customer service purposes. email newsletters If you choose to receive them, Current Affairs will periodically send you email newsletters. Current Affairs complies fully with the federal CAN-SPAM Act of 2003. We will not share, sell, rent, swap or authorize any third party to use your email address. If you feel you have received an email from us in error, please contact newsletter [at] currentaffairs.org. email promotions If you provide your email address as a customer or newsletter subscriber, Current Affairs reserves the right to send you promotional emails about products, services, and events offered by Current Affairs. You may opt out of these emails at any time. account and service-related email Current Affairs reserves the right to send you email relating to your account status. This includes order confirmations, renewal/expiration notices, notices of account problems, other transactional emails and notifications about major changes to our website and/or to our Privacy Policy. If you would like to stop all communications from Current Affairs please email help [at] currentaffairs.org with your name and email address under which you subscribed. emails from you If you send us email, you should be aware that information disclosed in email may not be secure or encrypted and thus may be available to others. We suggest that you exercise caution when deciding to disclose any personal or confidential information via email. Please do not send credit card information via email. This is better conveyed via a secure form on our website or over the phone. We will use your email address to respond directly to your questions or comments. With whom do we share the information we gathered? Current Affairs will not sell, rent, swap or authorize any third party to use any personal information we gather. service providers We contract with other companies to provide services on our behalf, including credit-card and billing processing, shipping, and website analytics. We provide these companies only with the information they need to perform their services. These service providers are restricted from using this data in any way other than to provide services for Current Affairs, and they may not share or resell this data. How to opt out from receiving newsletters and promotional offers email newsletters Current Affairs offers several email newsletters. If you no longer wish to receive a newsletter, click the “unsubscribe” link located near the bottom of each newsletter. Clicking this link will instantly opt you out of Current Affairs newsletter emails, but you may remain in our subscriber database which we may send occasional promotions. email promotions If, at any time, you prefer not to receive marketing or fundraising emails from us, click the “unsubscribe” link located near the bottom of one of these emails. Clicking this link will instantly opt you out of all Current Affairs emails, save account and service-related emails. If you experience difficulty with the unsubscribe process, feel free to contact us at help [at] currentaffairs.org. Is your information protected? data security We use reasonable precautions to protect our users’ personal information and to store it securely. Sensitive information that is transmitted to us online (such as a credit card number) is 256-bit encrypted and is transmitted to our payment processors securely. If you are not comfortable sending your credit card information over the Internet, please call the Current Affairs office (+1 504-233-4211), or print the page and mail it to us. (300 Lafayette Street, #210, New Orleans, LA 70130) Although we take appropriate measures to safeguard your information, we cannot guarantee its absolute security. To further protect your data, we recommend that you use complex passwords for your account. Please do not use the same passwords you use for your account with us for other services or share your password with unauthorized people. If you have reason to believe that your interaction with us is no longer secure, please immediately notify us in accordance with the “Contact Us” section below. Right to be forgotten In compliance with the General Data Protection Regulations (GDPR), users can ask Current Affairs at any time to scrub all personal information we or our partners have collected about you at any time. To do exercise your right to be forgotten, please fill out this form: Children Under 18 We do not intentionally collect any personally identifiable information from individuals under the age of 18. Conflict of Interest Policy You can review the Conflict of Interest Policy here. Editorial Independence Policy You can review the Editorial Independence Policy here. Gift Acceptance Policy You can review the Gift Acceptance Policy here. Contact Us Current Affairs300 Lafayette Street, #210New Orleans, LA 70130Email: help@currentaffairs.org"
