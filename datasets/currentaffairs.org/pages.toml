full_description = '''THE NEWS BRIEFING SERVICE The news delivered to your inbox every Tuesday and Friday An entertaining and thorough digest of the week’s most important (and often neglected) news stories, from one of the country’s leading independent political magazines. Our aim is to create a rich, entertaining, and thought-provoking newsletter that won't end up in the "spam" folder. The Current Affairs Biweekly News Briefing is an entertaining and thorough digest of the week’s most important news stories. Filled with links to interesting reading material and high-quality analysis of critical events, the News Briefing helps readers figure out what matters and navigate informational chaos. If you want to find out what you ought to know about, and what you’re missing, and hate having to muddle your way through clogged social media feeds and paywalled, ad-riddled news sites, we’re here to help you! The briefing is a paid service, so that we can pay writers to produce a truly stellar digest for you. Current Affairs is not for profit and, like all the rest of our work, the news briefing carries NO outside advertising and is entirely reader-supported. We hope you enjoy it! SUBSCRIBE TO THE BRIEFING ARCHIVE OF PAST BRIEFINGS For free readers, these appear two weeks after their initial publication. February 18, 2025 ❧ Javier Milei’s crypto scandal, the Trump administration blackmails Eric Adams, and union-busting in Utah Plus: Atlanta protesters disrupt the Border Patrol, an environmental org supports polar bear hunting, RFK Jr.'s “wellness farms,” and a strong shrew spine Read more >>> February 14, 2025 ❧ Shell gets sued for causing oil spills, Pelosi has a left-wing opponent, and the so-called “Gulf of America” Plus: Two horrifying stories about homelessness, RFK Jr. is confirmed, social media surveillance, and a modern Jonah Read more >>> February 11, 2025 ❧ Eric Adams gets away with it, Trump’s Gitmo deportation camp, and a Palestine and Sudan protest at the Super Bo