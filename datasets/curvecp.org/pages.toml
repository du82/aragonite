["https://curvecp.org/packets.html"]
title = "The CurveCP packet format"
full_description = '''If the client does not see a Cookie packet then it will send another Hello packet. The server sends a Cookie packet in response to each Hello packet, rather than limiting the client to one Hello packet. Similarly, the client can send several Initiate packets. The following diagram indicates how these packets are encrypted and summarizes the contents of the packets. Important notation: Box[X](C->S) is a cryptographic box, encrypting and authenticating X from the client's public key C to the server's public key S. The only people who can create or decipher Box[X](C->S) are the people who know the secret key corresponding to C and the people who know the secret key corresponding to S. (Note to readers familiar with BAN logic etc.: Box[X](C->S) should not be confused with the traditional concept {X}_K of something encrypted under secret key K without authentication.) Client to server Server to client Hello packet: (C',0,Box[0'](C'->S)) where C' is the client's short-term public key and S is the server's long-term public key and 0 is zero-padding and 0' is zero-padding Cookie packet: (Box[S',K](S->C')) where S' is the server's short-term public key and K is a cookie Initiate packet with Vouch subpacket: (C',K,Box[C,V,N,...](C'->S')) where C is the client's long-term public key and V=Box[C'](C->S) and N is the server's domain name and ... is a message Message packet: (Box[...](S'->C')) where ... is a message Message packet: (C',Box[...](C'->S')) where ... is a message Message packet: (Box[...](S'->C')) where ... is a message Message packet: (C',Box[...](C'->S')) where ... is a message The cookie K is Box[C',s'](t), where s' is the secret key corresponding to S', and t is a secret "minute key" maintained by the server. This is a cryptographic box that can be created and understood only by t. Each packet continues with a 16-byte receiver extension and a 16-byte sender extension. Gateways can process these extensions without parsing the rest of the packet. Each packet from the client continues with the client's short-term public key C'. The server reuses this key as an identifier to index active connections.'''
year_published = 2025
clearnet = "https://curvecp.org/packets.html"
tags = ["client", "connection", "curvecp", "curvecp:", "details", "details:", "features:", "format", "hello", "initiate"]
language = "en"
internal-references = ["none"]
external-references = ["cr.yp.to", "dnscurve.org", "mojzis.com", "nacl.cr.yp.to"]

["https://curvecp.org/nonces.html"]
title = "Nonces in CurveCP"
full_description = '''Attached to the box is a public 24-byte nonce chosen by the sender. Nonce means "number used once." After a particular nonce has been used to encrypt a packet, the same nonce must never be used to encrypt another packet from the sender's secret key to this receiver's public key, and the same nonce must never be used to encrypt another packet from the receiver's secret key to this sender's public key. This requirement is essential for cryptographic security. There are four different key pairs involved in a CurveCP connection, using four different types of nonces: Key pairNonce format The server's long-term secret key s and long-term public key S. The client knows S before making a CurveCP connection. The 8-byte ASCII string "CurveCPK" followed by a 16-byte compressed nonce. The client's long-term secret key c and long-term public key C. Some servers differentiate between clients on the basis of known values of C. The 8-byte ASCII string "CurveCPV" followed by a 16-byte compressed nonce. The server's short-term secret key s' and short-term public key S'. These are specific to this connection and help provide forward secrecy. The 16-byte ASCII string "CurveCP-server-M" followed by an 8-byte compressed nonce. The compressed nonce represents a 64-bit integer in little-endian form. These integers are generated in increasing order. The client's short-term secret key c' and short-term public key C'. These are also specific to this connection. A 16-byte ASCII string followed by an 8-byte compressed nonce. The string is "CurveCP-client-H" for a Hello packet, "CurveCP-client-I" for an Initiate packet, or "CurveCP-client-M" for a Message packet. The compressed nonce represents a 64-bit integer in little-endian form. These integers are generated in increasing order. The rest of this page describes in detail how the CurveCP nonces are chosen by these four secret keys s, c, s', c'. The client cannot send more than 2^64 packets in this connection; once its nonce reaches "CurveCP-client-M\377\377\377\377\377\377\377\377", it must immediately abort the connection. Same for the server. Note that sending 2^64 packets at a rate of 1 billion packets per second would take nearly 600 years.'''
year_published = 2025
clearnet = "https://curvecp.org/nonces.html"
