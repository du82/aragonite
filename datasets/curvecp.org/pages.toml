["https://curvecp.org/availability.html"]
title = "Availability"
full_description = '''Integrity ("the truth and nothing but the truth") means that all of the data that Bob thinks Alice sent was, in fact, sent to Bob by Alice, not by an attacker. Availability ("the truth, the whole truth, and nothing but the truth") means that the data that Bob thinks Alice sent is exactly the data that Alice actually sent to Bob: nothing more and nothing less. For example, an attacker can abort an SSH connection or an HTTPS connection by forging a single TCP Reset packet. The user sees an error message such as "Connection closed by remote host" or "Connection reset by peer." The user isn't receiving bad data from the attacker, but also isn't receiving good data from the legitimate server. This is not a violation of integrity but it is a violation of availability. As another example, PGP-encrypting and PGP-signing an email message protects confidentiality and integrity: an attacker who steals the email message won't understand it and can't replace it with a different message. But PGP does nothing to protect availability: the email has silently disappeared! Retroactively checking integrity can't restore availability. The same is not true for availability. For example, a large botnet sending a flood of packets will overwhelm the network between Alice and Bob, preventing communication between Alice and Bob; or a malicious ISP can simply refuse to deliver packets from Alice to Bob; or an attacker with physical access to the network can cut a cable. These attacks do not violate confidentiality or integrity, but they do violate availability. Internet designers can nevertheless strive to improve availability by increasing the cost of denying service and decreasing the amount of communication affected by denial of service. CurveCP takes several steps in this direction. Beware that there are also serious denial-of-service problems in many other layers of Internet communication, including the physical layer (especially 802.11) and the routing layer (BGP). CurveCP eliminates several denial-of-service problems in the transport layer (TCP), but much more work has to be done.'''
year_published = 2025
clearnet = "https://curvecp.org/availability.html"
