["https://curvecp.org/security.html"]
title = "Confidentiality and integrity"
full_description = "The client and server administrators don't meet secretly to share an encryption/authentication key. The server has a long-term public key S visible to everyone; the client uses this key S to encrypt data for the server and to verify data from the server. The client also has a long-term public key C visible to the server; the server uses that key C to encrypt data for the client and to verify data from the client. CurveCP also provides forward secrecy for the client's long-term public key. Two minutes after a connection is closed, the server is unable to extract the client's long-term public key from the network packets that were sent to that server, and is unable to verify the client's long-term public key from the network packets. Here's how the forward secrecy works. At the beginning of a connection, the CurveCP server generates a short-term public key S' and short-term secret key s', supplementing its long-term public key S and long-term secret key s. Similarly, the CurveCP client generates its own short-term public key C' and short-term secret key c', supplementing its long-term public key C and long-term secret key c. Almost all components of CurveCP packets are in cryptographic boxes that can be opened only by the short-term secret keys s' and c'. The only exceptions are as follows: Many protocols provide forward secrecy against attackers who passively eavesdrop upon the network during a connection and then, after the connection is over, obtain the current secret keys and try to retroactively decrypt the network packets. Furthermore, many of these protocols provide integrity against more powerful attackers who actively manipulate packets during the connection. However, many of these protocols lose forward secrecy against those attackers. These protocols provide passive forward secrecy but not active forward secrecy. CurveCP provides active forward secrecy. The lack of options in CurveCP simplifies the protocol and prevents a wide range of design and implementation mistakes. Compare the following quotes:"
