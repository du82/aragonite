["https://curvecp.org/index.html"]
title = "Introduction to CurveCP"
full_description = "The attacker doesn't have to be physically close to you. He could be halfway around the world. He simply has to have control over one computer on the same network as yours, or on the same network as the computer you're talking to, or on any network in between. Do you really think that these hundreds of computers are all trustworthy and secure and not spying on your communication? Furthermore, the attacker can forge packets of data that look like they come from you, or from whichever site you're talking to. With slightly more effort the attacker can spy on each packet as you're sending it, quickly substitute a modified version of the packet, and prevent the receiver from seeing the original packet. The first CurveCP implementation, incorporated into the Networking and Cryptography library (NaCl), entered public alpha testing on 21 February 2011. CurveCP software isn't ready for users yet but is ready for experimentation and development by interested programmers. Jan Mojžíš has written a curveprotect package using CurveCP to protect HTTP and Jabber."
