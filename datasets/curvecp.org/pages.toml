["https://curvecp.org/decongestion.html"]
title = "Decongestion"
full_description = '''This web page discusses the congestion-control and congestion-avoidance mechanisms in TCP and in CurveCP. These mechanisms are handled by packet schedulers that decide when to transmit packets and when to retransmit packets. There are actually several different TCP packet schedulers in common use, including CUBIC (Linux), NewReno (FreeBSD), and Compound (Microsoft). CurveCP uses a new scheduler called Chicago that decongests routers, including routers suffering from "bufferbloat"; Chicago efficiently uses the available bandwidth while minimizing packet loss and reducing latency for interactive applications. The primary problem is that each lost packet wastes time on the incoming link. A packet sent 10 times through this link, because it was lost the first 9 times, consumes 10 times as much space as it would otherwise have consumed, effectively reducing the bandwidth of the incoming link by a factor of 10—a huge efficiency problem. Sometimes this reduction means that the incoming link is overloaded, congesting the previous router and causing even more packets to be lost. A secondary problem is that increased queue lengths cause increased delays for packets in the queue. This is not a bandwidth problem but it is a latency problem. Users waiting for data (web pages, streaming video, etc.) frequently encounter long delays attributable directly to queue congestion, often several seconds or more. These two problems naturally classify schedulers into three categories: Primary evaluation (packet loss)Secondary evaluation (latency)ExamplesSummary Bad Bad TCP schedulers on the Internet until the late 1980s Senders send packets as quickly as they can. When senders notice packet loss, they retransmit packets at high speed, causing further congestion and further packet loss. Good Bad TCP schedulers on the Internet today: e.g., CUBIC (Linux), NewReno (FreeBSD), Compound (Microsoft) Senders increase packet-sending rates until they notice packet loss as a sign of congestion. Senders then reduce packet-sending rates to keep loss rates under control. To detect increases in available network capacity (e.g., someone else's download has finished), senders continue trying higher rates, keeping queues congested and periodically causing packet loss. Good Good TCP Vegas, LEDBAT (µTP in BitTorrent), Chicago (CurveCP) Senders increase packet-sending rates until they notice packet loss or increased delays as a sign of congestion. Senders then adapt packet-sending rates to keep loss and delays under control. Queue congestion is minimized.'''
year_published = 2025
clearnet = "https://curvecp.org/decongestion.html"
tags = ["advantage", "alarms", "algorithm", "backoffs", "congestion", "congestion-induced", "curvecp:", "cycle", "decongestion", "details:"]
