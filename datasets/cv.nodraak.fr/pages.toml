full_description = "Blog 2018-2023 Text Collection of articles on various topics. My interests currently cover software engineering (embedded software, improving quality of critical software, Rust), orbital mechanics and GNC, and other miscellaneous topics (training for a marathon). Moon Lander GNC Software 2021 Rust Aerospace / GNC (Moon) lander GNC software written in Rust. It reimplements the guidance algorithms used by Apollo missions. It comes with a physics simulator and KSP bindings for testing. Running Performance Analysis 2022-2023 Python Data Analysis Data and scripts used to keep track of my running activity. Includes (among others) training analysis and race results graphs. Gali Robot Software 2017-2018 C Embedded Systems Source code of the Gali robot. It was built as part of my studies with the robotic student association (Eceborg) for the French robotic cup (Eurobot)."
