your IPs. Create your own tech stacks to manage vulnerabilities affecting products you use. Analyze SBOM files and report vulnerabilities affecting dependencies in the SBOM file. CVEs and CPE information CVEdetails.com provides CPE information for most CVEs, even if they are not provided by NVD. Unfortunately NVD is no longer a reliable source of CVE information and CVEdetails.com compansates this issue by automated and manual analysis. Even if NVD was completely shutdown CVEdetails.com can continue providing CVE information with CPEs. CVEdetails.com analyzes CVEs even if CPE information is available from CISA Vulnrichment project. Unfortunately CPEs provided by CISA Vulnrichment are not always accurate so we do our own analysis without assuming CPE information provided by CISA Vulnrichment is correct. CVEdetails.com selectively analyzes CVEs and focuses on CVEs affecting enterprise software or widely used software. We do not do manual analysis for CVEs related to software from certain sources such as Sourc'''
