licly) Email alerts RSS feeds API access (up to 5 requests per minute) Subscription Plans Free $0 Free Sign up for free Vulnerabilities Embed widgets Favorites Anonymized threat summaries Notes and item labels Risk scores Pro $100 per user/month, billed annually Log in to buy now Everything included in Free Single user Vulnerability intelligence Custom RSS feeds Email alerts Threat overview Attack surface overview Business $1500 per month, billed annually Log in to buy now Everything included in Pro Up to 10 users included Collaboration options API access (Up to 20 requests per minute, no total request limit) Enterprise Contact us fully customizable Contact us Everything included in Business SBOM analysis Up to unlimited users Up to unlimited usage Customizable data sources and processing options Private instance or self hosted options Compare plans Free Pro Business Enterprise CVE data Add notes and custom labels to items Risk scores Customizable RSS feeds Extended vulnerability information - Advisories - Exploits - Vendor data - Open source repository monitoring - Feed aggregator - Emerging CVEs (CVEs not yet published) - Web page previews - Open source vulnerabilities Email alerts Tech stack (basic) Tech stack (advanced) SBOM analysis Anonymized global threats Own threats and attack surface API access Customize data sources Customize data processing rules Host and manage your own private instance Unlimited users and usage Integrate into your own services/products Extended threats and attack surface intelligence : Included in plan : Not included in plan : Available as an optional package for additional cost Anonymized global threats: High level threat summary including country level vulnerability counts, product statistics, number of discovered instances. Own threats and attack surface: Your organization's attack surface, vulnerabilities and threats overview as discovered by SecurityScorecard. Extended threats and attack surface: Access to third party attack surface, vulnerability and threat intelligence data. Tech stack: - Basic: A single tech stack - Advanced: Multiple custom tech stack definitions, with the ability to share with other users in the same organization Collaboration options: Users under the same organization will have access to shared labels, notes, tech stacks and more. Not available to Pro plan users even if multiple users from the same organization purchased Pro plan subscriptions separately."
