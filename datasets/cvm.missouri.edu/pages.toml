title = "Undergraduate Programs // College of Veterinary Medicine"
description = "Bachelor of Science in Veterinary Technology The online BSVT program prepares students for a broad scope of practice. Graduates will be ready for increased responsibility, career advancement, and a rewarding future in a fast-paced work environment. Bachelor of Science in Animal Sciences and Doctor of Veterinary Medicine Program Students who complete prescribed undergraduate courses in&hellip;"
full_description = "Bachelor of Science in Veterinary Technology The online BSVT program prepares students for a broad scope of practice. Graduates will be ready for increased responsibility, career advancement, and a rewarding future in a fast-paced work environment. Bachelor of Science in Animal Sciences and Doctor of Veterinary Medicine Program Students who complete prescribed undergraduate courses in the MU College of Agriculture, Food and Natural Resources, Division of Animal Sciences, and are then successful in being selected to a class in the MU College of Veterinary Medicine will receive elective credits concurrently for up to 32 hours of professional degree courses. Bachelor of Science in Microbiology and Doctor of Veterinary Medicine Program Students who complete prescribed undergraduate courses in the Undergraduate Microbiology Program of the MU Department of Veterinary Pathobiology and are then successfully admitted to the DVM program in the MU College of Veterinary Medicine will receive elective credits concurrently for up to 32 hours of professional degree courses. Undergraduate Microbiology Program We offer a Bachelor of Science (BS) in Microbiology degree program, for students interested in majoring in microbiology. The BS in Microbiology degree provides direct entry into a number of employment opportunities and also provides excellent preparation for professional schools (medical, dental, veterinary, physician assistant, etc.) and for admission to graduate degree (MS, PhD) programs in numerous areas of study. We also offer a Minor in Microbiology, which will be of interest to students majoring in fields such as biological sciences, biochemistry, public health, food science, animal science, etc. Students pursuing admittance to professional programs or graduate schools may also find this minor to be relevant. Online Undergraduate Courses in Biomedical Science The MU College of Veterinary Medicine offers 1- to 4-credit-hour undergraduate biomedical science courses online in fall semester, spring semester, and summer session. Courses are 100 percent online and do not require synchronous online attendance."
