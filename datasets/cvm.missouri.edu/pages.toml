["https://cvm.missouri.edu/cvm-marketing-and-communications"]
title = "CVM Marketing and Communications // College of Veterinary Medicine"
description = "About us The College of Veterinary Medicine’s (CVM) communications and marketing team amplifies the college’s impact and mission by sharing compelling stories about its groundbreaking research, expert faculty and exceptional student achievements. We craft strategies tailored to enhance the college’s reputation — from managing digital content and creative design to promoting events and fostering community&hellip;"
full_description = "About us The College of Veterinary Medicine’s (CVM) communications and marketing team amplifies the college’s impact and mission by sharing compelling stories about its groundbreaking research, expert faculty and exceptional student achievements. We craft strategies tailored to enhance the college’s reputation — from managing digital content and creative design to promoting events and fostering community engagement. Through coordinated efforts, we connect the college’s work with stakeholders locally and globally, emphasizing the CVM’s role as a leader in veterinary education and innovation. The CVM MarCom team reports through the dean’s office. Monthly newsletter All CVM faculty, staff and students are automatically subscribed to the college’s monthly newsletter. If you are part of this group but are not receiving the newsletter, please email CVMMarCom@missouri.edu. If you have an external contact who would like to sign up for our friends’ monthly newsletter, please send them this signup form. If you have some information you’d like us to consider for the next newsletter, email CVMMarCom@missouri.edu. The newsletter typically comes out the first Monday of the month. Request project support We’re here to help you with your communications and marketing needs. If you have a project you’d like us to consider, fill out the project request form. We will vet it to see how it aligns with our strategic priorities, then get back with you. Submit an accolade Have you or a peer earned an award, achieved a milestone or been recognized for outstanding work? We’d love to celebrate your success! Let us know about it via our accolade submission form. Submit a story idea Help us spotlight the incredible work happening at CVM. Whether it’s groundbreaking research, student success or heartwarming animal care stories, we want to hear from you. Submit your ideas to CVMMarCom@missouri.edu. Submit a web request Need an update to your website? Use our web submission form to get the process started. Mass communication Messages sent to the CVM Mail filter (cvmmailfilter@missouri.edu) are forwarded to CVM ALL, which includes the following: CVM students (MU CVM Students) CVM faculty (MU CVM Faculty) CVM staff (MU CVM Staff) Residents/Interns (MU CVM Residents and Interns) Requirements Mailings must be related to legitimate college or university functions. Communication from student organizations must be approved by the Office of Student and Academic Affairs. All messages are subject to review, approval and reformatting. You may include attachments, if necessary, which will be included in the mailing."
year_published = 2025
