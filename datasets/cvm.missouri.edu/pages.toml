title = "CVM Giving // College of Veterinary Medicine"
description = "Each year the Veterinary Health Center’s two specialized hospitals care for approximately 17,000 hospitalized animals and thousands more on farms. The Veterinary Medical Diagnostic Laboratory is a full-service laboratory for all animal species and is Missouri’s only veterinary laboratory accredited by the American Association of Veterinary Laboratory Diagnosticians. The MU College of Veterinary Medicine is&hellip;"
full_description = "Each year the Veterinary Health Center’s two specialized hospitals care for approximately 17,000 hospitalized animals and thousands more on farms. The Veterinary Medical Diagnostic Laboratory is a full-service laboratory for all animal species and is Missouri’s only veterinary laboratory accredited by the American Association of Veterinary Laboratory Diagnosticians. The MU College of Veterinary Medicine is Missouri’s only institution that confers the DVM. Approximately 40 percent of graduates stay in Missouri after graduation and serve the state’s animal-owning population. The DVM degree is achieved after a four-year course of study. At MU, students spend nearly two full years gaining hands-on experience, primarily in the Veterinary Health Center hospitals. This extensive length of time spent in clinical training allows our students graduate fully prepared to work in all fields of veterinary medicine."
