["https://cvm.missouri.edu/clint-greene-awarded-moderator-of-the-year-at-vmx-veterinary-conference"]
title = "Clint Greene awarded Moderator of the Year at VMX Veterinary Conference // College of Veterinary Medicine"
description = "Clint Greene, DVM, DABVP, was recently named the inaugural Moderator of the Year at the VMX Veterinary Meeting and Expo (VMX) in Orlando."
full_description = "Greene, who has helped facilitate the conference for two decades, is the first-ever Moderator of the Year recipient. North American Veterinary Conference CEO, Gene O’Neill (left), and Dr. Greene (right). Published 2/27/25Story contact: Deidra Ashley, CVMMarCom@missouri.edu Clint Greene, DVM, DABVP, was recently named the inaugural Moderator of the Year at the VMX Veterinary Meeting and Expo (VMX) in Orlando. As the world’s largest veterinary conference, VMX drew nearly 30,000 attendees this year, making this recognition even more significant. Greene, an adjunct assistant professor at the University of Missouri and a longtime participant and moderator at VMX, has been an integral part of the conference for two decades. He first attended the event as a veterinary student in 1989 and began serving as a moderator in 2005. Through the years, he has played a crucial role in ensuring seamless session operations, supporting expert speakers and enhancing the learning experience for attendees. “This award is incredibly special because it comes directly from the speakers themselves,” Greene said. “Having the opportunity to work alongside some of the smartest and most talented veterinarians in the world is a privilege. Being able to facilitate their sessions, ensure everything runs smoothly and contribute to the sharing of knowledge is deeply rewarding.” At VMX 2024, Greene moderated multiple sessions over two days, covering respiratory medicine, cardiopulmonary disease, and a clinical pathology cytology symposium."
year_published = 2025
