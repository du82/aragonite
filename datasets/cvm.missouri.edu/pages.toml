["https://cvm.missouri.edu/ryan-elected-to-avma-board-of-directors"]
title = "Ryan elected to AVMA board of directors // College of Veterinary Medicine"
description = "Carol Ryan, DVM, a mixed animal practitioner and 1992 graduate of the University of Missouri College of Veterinary Medicine was recently elected to the American Veterinary Medical Association Board of Directors."
full_description = "Published 2/13/2024Story contact: Nicholas Childress, CVMMarCom@missouri.edu Carol Ryan Carol Ryan, DVM, a mixed animal practitioner and 1992 graduate of the University of Missouri College of Veterinary Medicine was recently elected to the American Veterinary Medical Association Board of Directors. Ryan currently practices and is a partner owner of the Troy & Wentzville Veterinary Clinics, as well as an owner of Elsberry Animal Hospital in Elsberry, Missouri. Ryan has been involved with AVMA since her graduation in 1992 and has represented Missouri within the organization as its alternate delegate and delegate to the AVMA House of Delegates since 2014. She has also served the Missouri Veterinary Medical Association in roles that include vice president, president and executive board chair. Alongside those duties, Ryan has held leadership roles in the American Association of Veterinary State Boards Registry of Approved Continuing Education and the Missouri Veterinary Medical Board. Ryan will succeed Chuck Lemme, DVM, as District VII director, representing AVMA members in Iowa, Minnesota, Missouri, Nebraska, North Dakota and South Dakota. Her term will begin in June 2024 during the AVMA Convention in Austin, Texas, and will run until 2030."
year_published = 2025
