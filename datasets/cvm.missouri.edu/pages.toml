["https://cvm.missouri.edu/biomedical-sciences/research-areas"]
title = "Research Areas // College of Veterinary Medicine"
description = "The Department of Biomedical Sciences is an integrative physiology department that incorporates a multitude of techniques and collaborations. Below is an overview of some of the interests of our Faculty. As you will notice, our faculty have interests and expertise in numerous scientific fields. Please visit the webpages for the individual to learn more about&hellip;"
full_description = "The Department of Biomedical Sciences is an integrative physiology department that incorporates a multitude of techniques and collaborations. Below is an overview of some of the interests of our Faculty. As you will notice, our faculty have interests and expertise in numerous scientific fields. Please visit the webpages for the individual to learn more about their work. Anatomy – The Departmental veterinary anatomists are active in documenting both normal and abnormal anatomical structures. (I. Constantinescu; Frappier; Moore; Nash) Cancer – This research examines the mechanisms of tumor growth and its possible intervention. (Baines; Hyder; Rosenfeld; Welshons) Cardiovascular Science – This research area overlaps with exercise training in terms of cardiac and vascular function in addition to complementary topics including membrane transport, extracellular matrix, and muscle fiber proteins. (Baines, Booth; Bowles; Cummings; Hasser; Kline; Nichols; Tharp) Exercise Physiology – This area of research includes studies on how exercise alters cardiac and vascular function in both health and disease, including the myocardium and peripheral/coronary arteries. Much of this work is done with miniature swine which are treadmill trained, but rats and mice are also examined. (Baines, Booth; Bowles; Hasser) Functional Genomics – How gene expression is regulated and the outcome in terms of cell function is the central focus of these researchers. (Baines, Booth; Bowles; Kline) Membrane Transport – Researchers in this area take a biochemical and molecular approach to studying the structure, function and regulation of membrane transport proteins and channels. (Baines; Bowles; Clarke; Kline) Neurohumoral Control – How the neural system controls cell function is the center of this group’s activities from visceral reflexes to cardiorespiratory control in health and disease. (Cummings; Hasser; Kline; Nichols) Reproductive Biology – Hormonal control of reproduction and cell growth is the center of this groups activities. (Rosenfeld; Welshons) Toxicology – These researchers are interested in the effects on cell and tissue structure and function as related to environmental challenges. (Evans; Rosenfeld; Welshons)"
