ri College of Veterinary Medicine was recently elected to the American Veterinary Medical Association Board of Directors. Jan. 19, 2024 CVM Graduate Fellow Receives American Heart Association Fellowship Award The American Heart Association recently awarded Jessica Cayton, DVM, a Predoctoral Fellowship Award. Cayton is a graduate fellow in the University of Missouri Comparative Medicine Program and a PhD candidate in the MU College of Veterinary Medicine Department of Veterinary Pathobiology. Dec. 19, 2023 CVM’s Giuliano is First Veterinary Ophthalmologist to Speak at ASOPRS Symposium Published 12/19/2023Story contact: Nicholas Childress, CVMMarCom@missouri.edu Elizabeth Giuliano, DVM, MS, DACVO, professor of veterinary ophthalmology at the University of Missouri College of Veterinary Medicine, spoke as the first veterinary ophthalmologist at the American Society of Ophthalmic Plastic and Reconstructive Surgery Annual Fall Scientific Symposium. Hosted in San Francisco on Nov. 3-4, the symposium brought together… Nov. 3, 2023 Dodam and Merideth Named Faculty and Alumni Award Recipients John Dodam, DVM, PhD, and Reuben Merideth, DVM, have been named recipients of Faculty and Alumni Awards by the Mizzou Alumni Association. Prev 1 2 3 4 Next"
