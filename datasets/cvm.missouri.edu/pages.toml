["https://cvm.missouri.edu/doctor-of-veterinary-medicine-program"]
title = "Doctor of Veterinary Medicine Program // College of Veterinary Medicine"
description = "The DVM degree is achieved after a four-year course of study. At the University of Missouri, the first two years are largely spent in classrooms and laboratories with the second two years devoted primarily to clinical study in the MU Veterinary Health Center. The professional curriculum is integrated with college services including statewide animal disease&hellip;"
full_description = "The DVM degree is achieved after a four-year course of study. At the University of Missouri, the first two years are largely spent in classrooms and laboratories with the second two years devoted primarily to clinical study in the MU Veterinary Health Center. The professional curriculum is integrated with college services including statewide animal disease diagnostic services, extension and continuing education programs for animal owners and veterinarians, patient care referral and consultation services for all species of animals, research programs in animal and human diseases, and advanced specialized training in veterinary and comparative medicine. Our Mission VisionTo cultivate a student body that promotes a vibrant culture of academic excellence, inclusiveness, collegiality, and respect, and is committed to advancing an evolving and dynamic college and profession. MissionTo recruit and select motivated, curious and broadminded individuals with varied experiences and perspectives who will both contribute and succeed academically and professionally. ProcessThrough a fair and transparent process, we use qualitative and quantitative approaches to identify candidates who: 1) are confident, resilient, and academically strong; 2) welcome challenges; 3) are eager to grow personally and professionally; 4) value scholarship and discovery; and 5) foster a culture of integrity, diversity, inclusion and collaboration. We expect that these individuals will positively influence the College and the science of veterinary medicine, and embrace the varied and changing needs of the profession. Academic PreparationAdditional ResourcesPrerequisites for the DVM ProgramContact AdmissionsPreparation in High SchoolIn-State Residency RequirementsPreparation as an UndergraduateInternational StudentsEarly Acceptance ProgramsTransfer Request InformationBS in Animal Sciences and DVM DegreesProcedure for Evaluation of Applicants & Selection ProcessBS in Microbiology and DVM DegreesCharacteristics of the Average Student in the MU College of Veterinary MedicineStandardized Test Information"
