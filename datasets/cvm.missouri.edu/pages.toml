["https://cvm.missouri.edu/veterinary-research-scholars-program"]
title = "Veterinary Research Scholars Program // College of Veterinary Medicine"
description = "The objectives of the MU VRSP are to expose veterinary students to research career opportunities through a mentored research experience and develop a much-needed community of veterinary research scientists. For additional veterinary student research opportunities, see the Boehringer Ingelheim Veterinary Scholars and other funding opportunities. Application Deadline: February 7, 2025 (11:59pm) Eligibility: Students who have:&hellip;"
full_description = "The objectives of the MU VRSP are to expose veterinary students to research career opportunities through a mentored research experience and develop a much-needed community of veterinary research scientists. For additional veterinary student research opportunities, see the Boehringer Ingelheim Veterinary Scholars and other funding opportunities. Application Deadline: February 7, 2025 (11:59pm) Eligibility: Students who have: completed at least one year of Veterinary School or are in one of MU’s guaranteed admissions programs (Pre-Vet or Ag Scholar) within two years of entering veterinary school are interested in exploring research maintained a GPA of 2.5 or better (IP 1-3 for MU VM1 students) students currently enrolled in DVM/PhD or DVM/MS program should discuss options with Dr. Franklin students enrolled in or planning to enroll in the DVM/MPH program are eligible and the VRSP may apply to MPH internship requirements. Please discuss with Dr. Adkins (adkinsp@missouri.edu) international applicants should be enrolled in AVMA-recognized veterinary schools/colleges and upon graduation be eligible for the AVMA’s ECFVG program. Stipend:For MU student 8-week program – $4520For out of state or prevet/ag scholars 10-week program – $5650 Program duration, students from the University of Missouri CVM: Project development and implementation, mentor meetings and a weekly “Foundations in Veterinary Research and Discovery” course will begin in March of 2025. Full-time research activity will occur during the entire summer break from June-August. Program duration, students from other Veterinary Colleges or Pre-Vet/Ag Scholars: The program schedule is flexible with a 10-12-week requirement. Program description: The MUVRSP will include: an intensive research experience to include state-of-the-art experimental methodology. weekly topics course that gives a broad exposure to biomedical sciences. social events to foster interaction and sense of community. an opportunity to attend and present at the National Veterinary Scholars Symposium (NVSS) in Spokane, Washington from August 7-10, 2025. field trips to local and regional research institutions Mentor Selection (MU scholars): Participating mentors and their profile (description of research and mentoring style) are listed here and a schematic of mentor selection options is here. It is expected that prior to applying you familiarize yourself with the mentors and their projects for VRSP scholars. Until January 17, prospective scholars are encouraged to initiate discussions with mentors with whom you might like to work. It is recommended that you contact several mentors and go beyond your comfort zone with interests. If you and a mentor decide you wish to work together, on January 17, send an email to Craig Franklin (franklinc@missouri.edu) with your mentor copied. Dr. Franklin will then send you a confirmation email. After receiving this confirmation email, on the application you may select “Yes” for the question that asks, “Have you pre-matched with a mentor and informed Dr. Franklin of this mentor?”. Please note that pre-matching is intended to support participants finding a mentoring relationship that mutually fits their styles and goals but does not guarantee acceptance into VRSP. Also please note that student/mentor pre-matches may be established prior to January 17 provided that the mentor agrees that they will not pre-match with a second student UNLESS they can support a second student stipend and activity fees OR they are part of a faculty team that can support one student/faculty team member. If you do not establish a match prior to the application deadline, never fear, there is another option. On the application list, select four mentors with whom you would like to work. An advisory committee will then determine if selected mentors are available and work with you to secure a match. MU scholars will meet with mentors no less than weekly beginning in March. Scholars from other schools should contact mentors to begin project planning no later than one month prior to their start date. NOTE: if you would like to work with a mentor that is not on the VRSP list, contact Dr. Franklin to discuss. Mentor Selection (MU scholars from other schools): Review mentor list here and contact Dr. Franklin with a short list of mentors with whom you would like to work. Related Programs: ASLAP Summer Fellowship in Laboratory Animal Medicine and Comparative Medicine Research – click here for details Foundations in Veterinary Research and Discovery: This formal course will meet weekly from March through August and include discussions and interactive sessions on experimental design, data presentation and analysis, poster preparation, planning for a research career to include meetings with a panel of post-DVM graduate students and a CV workshop, responsible conduct of research, visit to an industry research farm, laboratory tours and social outings. Scholar Expectations: MU scholars are expected to commit FULL-TIME to the program, perform a hypothesis-or discovery-based research project, participate in the “Foundations in Veterinary Research and Discovery” course (scholars from other schools will begin participation upon arrival) and present results of experiments at a VRSP Data Blitz in October, 2025 and the CVM Research Day in May, 2026. Scholars will also have the opportunity to attend and present their project at the 2025 National Veterinary Scholars Symposium in Spokane, Washington from August 7-10. On completion of the program, scholars will have been exposed to careers in research and obtained the necessary information to pursue a science-related career. Opportunities to continue beyond the program are usually available through the mentor’s lab. Other Funding Opportunities: In addition to the VRSP, there are several other sources of possible funding that are great CV builders. Time Line: Feb 7Deadline for applications FebruaryScholar interviews, selection and orientation meeting March-AugustFoundations in Veterinary Research and Discovery course meets weekly for 1-2 hours Weekly mentor/scholar meetings to outline project/goals and begin research April/MayWelcome social gathering for scholars from other schools. May 2Participate in 2025 CVM Research Day May 25MU scholar research outlines due; outlines discussed in small group sessions as part of Foundations course Out of state scholar outlines due two weeks after their arrival June 27Full-time in laboratory work begins (MU scholars) Aug 7-10Participate in National NIH-Boehringer Ingelheim Symposium in Spokane, Washington AugustField trip to Boehringer Ingelheim Midwest Research Center – Fulton, MO Oct 24 (tentative)MU VRSP Research Data Blitz May 1, 2026 (tentative)2025 MU scholars presentations at 2026 CVM Research Day Application: (Application Deadline is February 7, 2025) See mentor selection process above. To apply, complete online form and have one letter of reference from a CVM faculty member or former employer/mentor who is familiar with your career aspirations. The online application will require you to provide several additional documents (e.g., letter of interest, resume, transcript), additional details on these can be found here. Selection criteria include demonstration of passion and commitment to exploring research, academic credentials, and your reference letter. Prior research experience is NOT required; all individuals are highly encouraged to apply and explore! THANK YOU! to all of our sponsors who provide critical funding for our scholars’ research experience: In the past these have included: Boehringer Ingelheim, IDEXX BioAnalytics, the USDA National Institute of Food and Agriculture, the Morris Animal Foundation, the Kent Tomazi Memorial Research Fund in Veterinary Medicine, a gift from Dr. Natlie Rabiner, and the MU College of Veterinary Medicine. Need more information? Please contact Dr. Craig Franklin at (573) 882-6623 or franklinc@missouri.edu"
year_published = 2025
