["https://cvm.missouri.edu/a-qa-with-brennan-fortel"]
title = "A Q&A with Brennan Fortel // College of Veterinary Medicine"
description = "As a first-year student at Mizzou’s College of Veterinary Medicine, Brennan Fortel is embracing hands-on learning, research and exploring his passion for animal care through extracurriculars."
full_description = "As a first-year student at Mizzou’s College of Veterinary Medicine, Brennan Fortel is embracing hands-on learning, research and exploring his passion for animal care through extracurriculars. Published 3/3/2025Story contact: Deidra Ashley, CVMMarCom@missouri.eduPhoto by Karen Clifford Brennan Fortel didn’t always plan to become a veterinarian. As an undergraduate on the pre-medicine track, the O’Fallon, Missouri native was set on a career in human health care — until a serendipitous shadowing experience introduced him to the world of veterinary medicine. Spending time with a local veterinarian, Fortel saw firsthand how vets not only care for animals but also support the people who love them. That realization sparked a new passion, leading him to shift his focus to veterinary school. Now a first-year student at the University of Missouri College of Veterinary Medicine, he’s embracing hands-on learning, research and building his confidence while exploring different specialties. Read on for a Q&A with Fortel about his Mizzou CVM experience. Why did you choose Mizzou? Mizzou was always on my radar. It’s close to home, affordable and has a strong two-and-two program that provides hands-on experience early on. Most of my mentors are Mizzou alumni, and so I knew a lot about the school through them. What has surprised you most about vet school? I was expecting constant information overload, overload, which there is some, but it is not nearly as bad thanks to the faculty here; they’re all very supportive and want to see us succeed. And the students in my class are one big friend group — if I don’t understand something or want someone to study with, there’s always someone there, even if I don’t know them that well. Don’t get me wrong, vet school is still challenging, but even when it’s tough, I’m having fun and learning so much. What has been your experience with Mizzou’s faculty so far? The faculty at Mizzou are very knowledgeable and help guide you through vet school. Dr. Baines, who started with me in the interview process, continues to be a great mentor. I’m also excited to get to work on a research project with Drs. Adkins and Gull. This is the first time I’ve been able to do research, and to be able to do it with people who are renowned for it is an incredible opportunity I never thought I’d have. How have you gotten involved at the CVM? In addition to my research, I’m part of the Raptor Rehabilitation Project and the American College of Veterinary Sports Medicine and Rehabilitation Club. I’m interested in a wide range of areas within veterinary medicine, and these extracurriculars are key to helping me discover what truly excites me. They’re also helping me build connections across the college. How have you grown since coming to Mizzou? The CVM has taught me so much about myself. It’s pushed me and helped me overcome some of my fears, and it’s also helped build my confidence. Vet school is challenging, but I’ve learned how to adjust and seek help when needed. I’ve discovered that I can push through tough moments and still enjoy the process because it’s all about balancing hard work and having fun along the way."
year_published = 2025
