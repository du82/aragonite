["https://cvm.missouri.edu/research/research-center-for-human-animal-interaction"]
title = "Research Center for Human-Animal Interaction // College of Veterinary Medicine"
description = "Welcome to ReCHAI People and animals have lived close to one another for centuries. The human animal bond is the strong connection that they feel toward one another. The MU College of Veterinary Medicine is proud of this exciting center based on the growing field of research showing how the human animal bond impacts health&hellip;"
full_description = "Welcome to ReCHAI People and animals have lived close to one another for centuries. The human animal bond is the strong connection that they feel toward one another. The MU College of Veterinary Medicine is proud of this exciting center based on the growing field of research showing how the human animal bond impacts health in people and animals. Who we are: The Research Center for Human-Animal Interaction (ReCHAI), founded in 2005, in College of Veterinary Medicine has a mission of education and conducting programs and studies about the benefits of human-animal interaction. ReCHAI is on the leading edge of programs and studies that explore how the human animal bond has an impact on the health of people and animals. ReCHAI is designed to: Develop a program for research and education to study the health benefits of human-animal interaction (HAI). Promote the science of HAI. Document evidence demonstrating Animal Assisted Interventions (AAI) as a beneficial form of complementary therapy. Foster educational and research opportunities for MU students, as well as students from around the country and globe. Collaborate with other centers nationally and internationally to promote HAI. Foster public understanding of benefits of HAI. Member of"
year_published = 2025
