full_description = "Submit Accolade Oct. 6, 2023 Kipperman Awarded 2023 Lifetime Shomer Award by SVME The Society for Veterinary Medical Ethics recently named Barry Kipperman, DVM, DACVIM, DACAW, as the 2023 Lifetime Shomer Award Winner. Oct. 6, 2023 Tripathi Awarded Travel Grant by ARVO Ratnakar Tripathi, PhD, an assistant research professor of veterinary medicine and surgery at the University of Missouri College of Veterinary Medicine, was recently named a recipient of an Association for Research in Vision and Ophthalmology Travel Grant. Oct. 6, 2023 Neurology and Neurosurgery Resident Awarded ACVIM Research Grant The American College of Veterinary Internal Medicine recently awarded Alexa Stephen, DVM, a veterinary neurology and neurosurgery resident at the MU College of Veterinary Medicine, the 2022 Holliday Neurology Resident Research Grant. Oct. 6, 2023 First-Year Ophthalmology Resident Awarded Grant by ACVO Brayden Routh, DVM, an ophthalmology resident and graduate student at the University of Missouri College of Veterinary Medicine, was recently awarded a $5,000 grant by the American College of Veterinary Ophthalmologists Vision for Animals Foundation Grant Committee. Oct. 6, 2023 Postdoctoral Fellow Named Recipient of ISER Travel Fellowship Nishant Sinha, PhD, a postdoctoral fellow in the Department of Veterinary Medicine and Surgery at the University of Missouri College of Veterinary Medicine, was recently announced as a recipient of the International Society for Eye Research travel award. Oct. 6, 2023 Adamovicz Named Recipient of 2022 Hashimoto Recognition Award by ABSA The American Biological Safety Association recently named Jeffrey Adamovicz, PhD, registered biosafety professional and associate professor of veterinary pathobiology at the University of Missouri College of Veterinary Medicine, the recipient of the 2022 Hashimoto Recognition Award. Oct. 6, 2023 CVM Oncology Resident Named Robert S. Brodey Memorial Award Recipient Caitlin Cowan, DVM, a medical oncology resident at the University of Missouri College of Veterinary Medicine was recently named the recipient of the Robert S. Brodey Memorial Award by the Veterinary Cancer Society. Oct. 6, 2023 CVM Graduate Fellow Awarded at BioNexus KC Science2Art Exhibition Jessica Cayton, DVM, graduate fellow in veterinary pathobiology at the University of Missouri College of Veterinary Medicine recently received an award at the June 2022 BioNexus KC Science2Art Exhibition. Prev 1 2 3 4"
