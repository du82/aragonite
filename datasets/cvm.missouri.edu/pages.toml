["https://cvm.missouri.edu/claires-comeback"]
title = "Claire’s comeback // College of Veterinary Medicine"
description = "A seamless collaboration between specialties at Mizzou’s Veterinary Health Center helped Claire, a 4-year-old Llewellin English Setter, heal from life-threatening injuries and return to her happy, playful self."
full_description = "A seamless collaboration between specialties at Mizzou’s Veterinary Health Center helped Claire, a 4-year-old Llewellin English Setter, heal from life-threatening injuries and return to her happy, playful self. Published 2/25/2025Story contact: Nicholas Childress, CVMMarCom@missouri.eduPhotos by Karen Clifford When Branson, Missouri, native Kayra Holloway and her husband arrived at the University of Missouri’s Veterinary Health Center (VHC) with their dog, Claire, the outlook was grim. The Llewellin English Setter had been attacked by another dog and was in septic shock. Claire’s survival seemed impossible — until a team of Mizzou’s veterinary heroes came together to turn a dire situation into an inspiring comeback. Claire’s injuries were extensive, with deep wounds that left large areas of skin and tissue damaged or missing. She was unable to stand — or even sit — on her own, and her blood pressure was dangerously low. To make matters worse, her breathing was compromised, and the team suspected blood clots were forming in her lungs. “When we first brought Claire in, her injuries were devastating,” Holloway said. “It was hard to believe she could survive something that severe.” The VHC’s emergency and critical care teams worked to stabilize Claire — administering medications, managing her pain and performing advanced technical procedures to obtain central venous access and direct blood pressure monitoring. “Despite our best efforts, Claire’s condition continued to decline,” said Mariangely Torres Rodriguez, BSVT, RVT, a small animal emergency and critical care (SAECC) technologist on Claire’s case. “We knew that working across disciplines was her best hope for survival.” Scanning and surgery: The next steps in Claire’s care The SAECC team called in their peers on the radiology and soft tissue surgery service lines to take x-rays and get a CT scan — hoping the detailed imaging would help them get a better understanding of what was going on internally. After the scans, Claire was taken to the operating room to address her wounds. “That surgery was just the beginning of Claire’s long road to recovery,” said small animal surgery resident Brooke Lee, DVM. “We knew Claire would need wound care under general anesthesia for several days to give us the best chance of getting her infection under control. She was in such critical condition and required around the clock one-on-one technical care for a large portion of her hospitalization.” The anesthesia team was also a cornerstone of Claire’s care, ensuring that she was stable throughout her initial imaging and treatments as well as the many days of follow-up care and wound management. During her two-plus weeks in the intensive care unit, dozens of staff members were called to contribute to Claire’s care. Through the collaborative, cross-disciplinary work of each of the teams, Claire started to show improvement … and she wasn’t shy in letting the team know that she was beginning to feel better. “First, she began to open her eyes, then she started to wag her tail when someone approached her kennel,” said Torres Rodriguez. “My favorite thing was when she gave us kisses after each treatment — we already knew she was a champion, and that made us believe she was going to make it.” Throughout Claire’s vigorous treatment, the Holloways’ nerves were quelled by consistent updates from the VHC team. “They would send us photos of Claire recovering, which meant so much to us,” Holloway said. “One of the sweetest moments was seeing someone sitting in her kennel during their rounds, doing paperwork while keeping her company. It was clear how much everyone cared about her.” After 16 days, Claire was finally well enough to go home. “When we got the call that Claire was strong enough to come home, it was overwhelming,” Holloway said. “After everything she had been through, knowing she was finally well enough to leave the hospital was such a relief.” A triumphant send-off The day Claire left the hospital wasn’t just a celebration for Claire and her owners — it was a triumph for every VHC team member who played a role in her life-saving care. “Watching a pet arrive in critical condition and then helping them return home is a powerful reminder of our success and the heart of our mission,” said Torres Rodriguez. “Each recovery is a victory we share as a team, and there’s nothing more rewarding than seeing a pet walk out of our doors and be reunited with their family.” Today, Claire is back to her playful self, living her best life — complete with her signature style. While at the VHC, Claire wore cozy doggy PJs to keep her wounds clean and protected. Despite not needing them anymore, Holloway said Claire has made it very clear that she’s not interested in taking them off anytime soon. Claire has also taken her fashion-forward ways to work. She now accompanies Holloway to the office, sporting a name tag that reads “customer therapy specialist.” Claire’s remarkable recovery isn’t just a feel-good story — it’s a testament to the advanced care and collaborative expertise at the VHC. Cases like hers remind us of the hospital’s mission to provide exceptional patient care, and her story serves as a powerful reminder of the life-changing impact their work has on animals and their families."
year_published = 2025
