description = "The MU College of Veterinary Medicine and the Mule Club thank Sydenstricker Nobbe Partners and MFA, Inc for their generous support of the Missouri Mule Team. Boone and George The MU College of Veterinary Medicine Mule Team appears at many events every year including parades, festivals, and socials. They are available on a first-come, first-served&hellip;"
full_description = "The MU College of Veterinary Medicine and the Mule Club thank Sydenstricker Nobbe Partners and MFA, Inc for their generous support of the Missouri Mule Team. Boone and George The MU College of Veterinary Medicine Mule Team appears at many events every year including parades, festivals, and socials. They are available on a first-come, first-served basis for calendar scheduling. We ask that you give us at least two weeks’ notice when scheduling events. Our calendar books up quickly, so please notify us as early as possible. Wagon rides are given for a maximum of two hours and will hold approximately 10 people at a time. Informative talks about mules and the MU CVM tradition of the mule mascots can also be given by the mule caretakers. Although there are no associated fees for an appearance of the Mule Team, private donations are essential to the continued existence and operation of the CVM Mule Team. To schedule an event contact: Susan Leutschaft(573) 884-6444leutschafts@missouri.edu or Lesley Linss(573) 882-1807lml22k@missouri.edu"
