full_description = "Submit Accolade Oct. 24, 2023 Franklin Honored with Charles River Prize at AALAS Meeting Craig Franklin, DVM, PhD, DACLAM, a professor of veterinary pathobiology at the University of Missouri College of Veterinary Medicine, was recently honored as the recipient of the Charles River Prize at the American Association for Laboratory Animal Science annual meeting. Oct. 12, 2023 Former Resident Credits Mentors for Success Gregory Vernon, DVM, ACVR-Radiology, who completed a radiation oncology residency at the University of Missouri College of Veterinary Medicine, successfully passed the American College of Veterinary Radiology radiation oncology board examination. Oct. 6, 2023 Former CVM Resident Earns Top Honors for Manuscript at ACVO Conference The American College of Veterinary Ophthalmologists named Kourtney Dowler, DVM, and her co-authors as recipients of the Best Clinical Science Manuscript Award. Oct. 6, 2023 CVM Faculty Members Honored with EJNMMI Physics Best Paper of 2023 Award Jeffrey Bryan, DVM, MS, PhD, and Charles Maitz, DVM, PhD, DACVR-Radiation Oncology, two oncology faculty members at the University of Missouri College of Veterinary Medicine, are members of a research team that the European Journal of Nuclear Medicine and Molecular Imaging Physics awarded the Best Paper of 2023. Oct. 6, 2023 Postdoctoral Fellow Named CounterACT Research Trainee Nishant Sinha, PhD, a postdoctoral fellow in the University of Missouri College of Veterinary Department of Veterinary Medicine and Surgery and researcher in the One Health One Medicine Vision Research Program, was selected to participate in the Countermeasures Against Chemical Threats program as a CounterACT research trainee. Oct. 6, 2023 AKC Canine Health Foundation Names Johnson 2023 Asa Mays Recipient The American Kennel Club Canine Health Foundation recently presented the 2023 Asa Mays, DVM Excellence in Canine Health Research Award to Gary Johnson, DVM, PhD. Oct. 6, 2023 Dvm360 Names CVM 