["https://cvm.missouri.edu/a-new-approach-to-treating-a-difficult-type-of-breast-cancer"]
title = "A new approach to treating a difficult type of breast cancer // College of Veterinary Medicine"
description = "Mizzou researcher Salman Hyder is the first to identify a drug that kills triple negative breast cancer cells and stops the formation of blood vessels that tumors need to grow."
full_description = "Mizzou researcher Salman Hyder is the first to identify a drug that kills triple negative breast cancer cells and stops the formation of blood vessels that tumors need to grow. Published 9/4/2024Contact: Brian Consiglio, consigliob@missouri.eduPhotos by Sam O’Keefe Triple-negative breast cancer (TNBC) makes up about 15% of all breast cancer cases worldwide. It’s particularly hard to treat because it lacks the three common receptors that most therapies target. As a result, most TNBC patients undergo high doses of non-targeted chemotherapy, which often leads to severe side effects such as hair loss, nausea and pain. The spread of TNBC cells to other organs, such as the brain or lungs, is the main cause of death in patients. A recent study from the University of Missouri offers a new approach to treating TNBC: targeting cholesterol synthesis. Salman Hyder, a professor in Mizzou’s College of Veterinary Medicine, led the study with Yayun Liang, an investigator in the College of Veterinary Medicine. Together, they found that a cholesterol biosynthesis inhibitor known as an RO compound can target a specific enzyme in those with TNBC. Not only does the RO compound kill tumor cells, but it also prevents the formation of blood vessels needed for cancer tumors to continue growing. Salman Hyder “Cancer cells can replicate very rapidly and become a tumor, but they need cholesterol,” Hyder said. “A lot of energy is required for this process, and mitochondria involved in energy production require cholesterol biosynthesis because both tumor cells and mitochondria need membranes to be reproduced over and over again.” Hyder’s lab is the first to show that the RO compound can be an effective cholesterol biosynthesis inhibitor for those with TNBC, potentially paving the way for human clinical trials to eventually offer an alternative to traditional chemotherapy and its painful side effects. “Our ultimate goal is to make life better for those who are suffering from this disease by offering a less toxic alternative to chemotherapy,” said Hyder, the Zalk Endowed Professor in Tumor Angiogenesis. “My entire career has been spent researching breast cancer. Since no drug had been found that specifically targets TNBC, I have been on a mission to find a solution, and this new finding is very promising.” “Cholesterol biosynthesis inhibitor Ro 48-8071 suppresses growth of triple-negative breast cancer cells by inducing apoptosis and suppressing angiogenesis” was presented recently at the annual Endocrine Society meeting in Boston and will be published in the Journal of Endocrine Society."
