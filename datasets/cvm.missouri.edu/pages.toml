["https://cvm.missouri.edu/research/feline-genetics-and-comparative-medicine-laboratory"]
title = "Feline Genetics & Comparative Medicine Lab // College of Veterinary Medicine"
description = "Research Laboratory of Dr. Leslie A. Lyons (The Lyons’ Den) To provide target funding support and donations for feline genetics, please contact Dr. Lyons, or donate online now.&nbsp; To participate in cat research, please see the list of active research projects or follow this “How to Participate”&nbsp;link. The Feline Genetics and Comparative Medicine Laboratory of&hellip;"
full_description = "Research Laboratory of Dr. Leslie A. Lyons (The Lyons’ Den) To provide target funding support and donations for feline genetics, please contact Dr. Lyons, or donate online now. To participate in cat research, please see the list of active research projects or follow this “How to Participate” link. The Feline Genetics and Comparative Medicine Laboratory of Professor Leslie Lyons is located in the University of Missouri College of Veterinary Medicine. Research focuses on the genetics of the domestic cat and the development of genetic tools and resources that assist gene mapping in the cat and other companion animals. Feline research is focused on the discovery of mutations that cause inherited diseases and phenotypic traits and in the population dynamics of breed development and domestic cat evolution. The laboratory actively seeks competitive and non-competitive funding from a variety of governmental and non-governmental agencies, foundations, groups and donors to support genetic studies in feline health and non-health related areas. The EveryCat Health Foundation and private donors have been strong and consistent supporters for various cat research projects. Royal Canin cat food proudly feeds our colony of cats with genetic traits. Dr. Lyons’ Gilbreath McLorn endowment in the College of Veterinary Medicine, Department of Veterinary Medicine and Surgery at the University of Missouri, provides internal competitive funding and matching funding for external awards. Dr. Lyons Laboratory has strong collaborations with the UC-Davis Veterinary Genetics Laboratory, Hill’s Pet Food, Inc., Langford Vets, in the United Kingdom, Orivet in Australia and many other groups that assist with research projects and funding that will lead to genetic tests as a commercial service for the cats of owners and breeders. Strong interactions with cat breeders and owners are highly desired and encouraged to help support studies by providing DNA samples from cats, pedigree information and background knowledge of interesting traits and health issues. Important relationships are fostered with all cat registries and associations, such as the Cat Fanciers’ Association (CFA), The International Cat Association (TICA), the Governing Council of the Cat Fancy (GCCF), the Federation Internationale Felines (FiFe), the World Cat Congress (WCC), the World Cat Federation (WCF) and other cat fancier organizations and registries worldwide."
year_published = 2025
