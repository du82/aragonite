title = "News, Page 2 // College of Veterinary Medicine"
full_description = "Jan. 27, 2025 New therapy for dogs with cancer shows promise When Mary Winter, BS ’81, JD ’90, of Jefferson City noticed that her rescue dog, Sadie, developed swollen lymph nodes last fall, Winter’s veterinarian confirmed what she already suspected: cancer. Jan. 23, 2025 Five ways to connect with Mizzou at the MVMA Convention The Missouri Veterinary Medical Association Convention is coming Jan. 30 through Feb. 2. At this year’s event, Mizzou’s College of Veterinary Medicine (CVM) has an extensive lineup of talks and opportunities designed to inspire, educate and connect veterinary professionals throughout the Midwest. Jan. 23, 2025 Inactive today, forgetful tomorrow: Mizzou researchers discover a link between lack of physical activity and a decline in brain health A new study shows specific changes in the brain after muscle disuse that are linked with cognitive decline. Jan. 3, 2025 Noncredit certificate in veterinary emergency and critical care now available The University of Missouri College of Veterinary Medicine has partnered with MU Extension’s Career Accelerator to offer a new noncredit certificate in veterinary emergency and critical care. Dec. 11, 2024 Mizzou researchers at the forefront of detecting deadly deer disease Chronic wasting disease (CWD) is a fatal, neurological disease that affects cervids, such as white-tailed deer. It is caused by an infectious, misfolded protein that spreads through the brain and leads to weight loss, abnormal behavior and ultimately death. Nov. 19, 2024 A canine comeback: How Mizzou veterinarians helped an agility dog compete again Rhoen, a border collie who competes in high-level agility events, recently traveled more than 1,700 miles to Mizzou to receive paw-fect care for a serious lung disease. Nov. 14, 2024 Protecting the health of wildlife ecosystems The plague is one of the deadliest bacterial infections in human history. An estimated 50 million Europeans died from it in the mid-1300s when it was known as the “Black Death.” Nov. 6, 2024 Mizzou researchers use novel method to uncover impact of maternal oxycodone on placental cells Cheryl Rosenfeld, DVM, PhD, professor at the University of Missouri College of Veterinary Medicine, recently published research titled “Effects of Oxycodone on Placental Lineages: Evidence from the Transcriptome Profile of Mouse Trophoblast Giants Cells” in the Proceedings of the National Academy of Sciences. Oct. 30, 2024 Improving deer health one test at a time A new study by Mizzou researchers shows that infections, such as pneumonia, are a major cause of death in Midwestern white-tailed deer. The discovery can help tailor efforts to improve deer health. Oct. 29, 2024 Feline fun facts: Four ways Mizzou research benefits cats In honor of National Cat Day, learn how Mizzou’s Leslie Lyons and Gretchen Carlisle help our feline friends. Prev 1 2 3 4 … 12 Next"
