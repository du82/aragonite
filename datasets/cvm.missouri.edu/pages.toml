["https://cvm.missouri.edu/microbiology-degree-program-receives-recommendation-for-approval"]
title = "Microbiology degree program receives Missouri Department of Higher Education recommendation for approval // College of Veterinary Medicine"
description = "The University of Missouri College of Veterinary Medicine’s (CVM) undergraduate microbiology program — the only standalone bachelor of science in microbiology degree in Missouri — was recently recommended for full approval by the Missouri Department of Higher Education."
full_description = "Published 2/5/2025Story contact: Nicholas Childress, CVMMarCom@missouri.edu The University of Missouri College of Veterinary Medicine’s (CVM) undergraduate microbiology program — the only standalone bachelor of science in microbiology degree in Missouri — was recently recommended for full approval by the Missouri Department of Higher Education. The program was launched in 2019 and is housed in the Department of Veterinary Pathobiology (VPB). Initially granted provisional approval in 2019, the program underwent periodic reviews by the MDHE to evaluate its success. These reviews assessed key factors such as enrollment growth, academic progress and program outcomes. Following a comprehensive evaluation, the microbiology program met all criteria for full approval, an achievement that underscores its strong performance and positive impact. “The program’s success is a culmination of the hard work of all the past and present VPB chairs, teaching faculty, research mentors and staff who have been pivotal to the program’s inception, execution and day-to-day operation,” said Ravi Barabote, PhD, microbiology program director and an associate teaching professor. “The program’s full approval is fantastic news, especially for students pursuing microbiology at Mizzou. It paves the way for further growth of the microbiology program and undergraduate education at the CVM.”"
