["https://cvm.missouri.edu/alumni-and-friends/raptor-rehabilitation-project/support-the-project"]
title = "Support the Project // College of Veterinary Medicine"
description = "An endowment has been established to ensure ongoing support for the Raptor Rehabilitation Project. Contributions are tax-deductible, as provided by federal law, and donors receive University of Missouri “gift credit” which applies toward membership in the&nbsp;College of Veterinary Medicine’s John W. Connaway Society. The link below takes you to the secure “For All We Call&hellip;"
