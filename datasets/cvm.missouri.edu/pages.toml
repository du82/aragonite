["https://cvm.missouri.edu/gabby-balaa-and-megan-rice-take-home-awards-at-the-aaep-convention"]
title = "Gabby Balaa and Megan Rice take home awards at the 2024 American Association of Equine Practitioners Convention // College of Veterinary Medicine"
description = "Two University of Missouri College of Veterinary Medicine students who attended the 70th American Association of Equine Practitioners (AAEP) Annual Convention recently returned to Columbia with awards in their pocket."
full_description = "Published 1/2/2025Story contact: Nicholas Childress, CVMMarCom@missouri.edu Two University of Missouri College of Veterinary Medicine students who attended the 70th American Association of Equine Practitioners (AAEP) Annual Convention recently returned to Columbia with awards in their pocket. Fourth-year student Gabby Balaa and third-year student Megan Rice each earned recognition. Balaa was named a winner of the AAEP Case Study Competition, and Rice was awarded the Anne and Richard Sterlin Scholarship by Foundation for the Horse. Gabby Balaa Balaa was named one of three winners of the 2024 AAEP Case Study Competition for her presentation, “A Curious Case of Corynebacterium Pseudotuberculosis.” Her case highlighted a unique infection caused by the bacteria, which usually forms large external abscesses on the chest. In Balaa’s patient, however, the infection led to a massive internal abscess, stretching from the kidney to the stomach and surrounding the spleen. This is the second time Balaa has received this honor. “The AAEP does a fantastic job of supporting future equine veterinarians, and one of the ways in which they do that is by highlighting the role we play in patient care with the Case Study Competition,” said Balaa. “Winning twice in my tenure as a veterinary student is a testament to the amazing mentorship I’ve received during my time at Mizzou CVM. As fewer and fewer young veterinarians are choosing to enter equine practice, I’m honored to have such strong support and represent my school.” Megan Rice Rice, president of Mizzou’s student chapter of the American Association of Equine Practitioners, earned the $10,000 Anne and Richard Sterlin Scholarship. During her time as president, Rice said she’s striven to be a leader who introduces people to different aspects of equine medicine and who helps support the career goals of those around her. “Receiving this scholarship means a lot to me in my journey to becoming an equine doctor,” she said. “This scholarship will help pay for my tuition, which frees me up to travel to larger equine hospitals across the country and learn from top doctors around the United States. I could not have done it without the support of my many mentors in veterinary medicine, as well as the support of my friends and family. I want to specifically thank Dr. LaCarrubba and Dr. Whittle for their letters of recommendation and support of my career.”"
year_published = 2025
