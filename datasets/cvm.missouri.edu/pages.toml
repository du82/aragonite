["https://cvm.missouri.edu/student-resources/visiting-scholars"]
title = "Visiting Scholars // College of Veterinary Medicine"
description = "Your predecessors have created an excellent reputation at MU we hope that you will continue. Student schedules are designed on an individual basis to balance student assignments and maximize the learning experience. Please contact Jennifer Hamilton if you have any other questions about your transition into your year at the MU College of Veterinary Medicine.&hellip;"
full_description = "Your predecessors have created an excellent reputation at MU we hope that you will continue. Student schedules are designed on an individual basis to balance student assignments and maximize the learning experience. Please contact Jennifer Hamilton if you have any other questions about your transition into your year at the MU College of Veterinary Medicine. Columbia and the University of Missouri Columbia, Missouri is an ideal location for a teaching hospital. The population of central Missouri and reasonable proximity to St. Louis and Kansas City provide for a robust small animal emergency and referral caseload. Moreover, Missouri is a strong agricultural state with large numbers of horses, cattle, hogs, and poultry. The University of Missouri campus is home to a life sciences center, medical school, nanotechnology center, and college of agriculture. These campus resources create a synergy that allows us to conduct high-quality research and practice cutting edge medicine. Columbia is also a great place to live, and the University of Missouri is an active, exciting campus. Resources University Concert Series: http://concertseries.org/ Mizzourec: http://www.mizzourec.com/You can purchase a membership to this state-of-the-art recreation and fitness center. Click on ‘Facilities’ for a virtual tour. Click on the ‘Membership’ for more information on joining. Division I athletics: http://mutigers.cstv.com/ City Resources: Columbia Convention and Visitors Bureau: http://www.visitcolumbiamo.com/ Columbia-Downtown Association: http://www.discoverthedistrict.com/ Outdoor Life: Katy Trail: http://www.bikekatytrail.com/columbia.asp Columbia Parks and Recreation:http://www.gocolumbiamo.com/ParksandRec/ Columbia Activity and Recreation Center:http://www.gocolumbiamo.com/ParksandRec/ARC/ There are 22 sites that the Missouri Department of Conservation owns, leases, or manages in or near Columbia: http://mdc.mo.gov/ GetAbout Columbia is a website that highlights walking and biking in Columbia: http://www.gocolumbiamo.com/publicworks/getaboutcolumbia Vaccinations Rabies and Tetanus Veterinary medical students are at higher risk for exposure to tetanus and rabies than the general population. Therefore, you will need to provide records of tetanus vaccination (Tdap* or Adult Td**) within the last 10 years and plan to keep vaccination current (i.e., within 10 years) through the end of your time in the clinical program. Additionally, you will need to supply proof of an initial series of rabies vaccinations within the last year, or alternatively, a protective rabies titer (as determined by MU Student Health Services) within the past two years. A booster vaccination will be required if MU Student Health Services determines there is not a protective titer. Vaccinations for tetanus and rabies, as well as serum rabies titers, can be performed at the MU Student Health Services and are the financial responsibility of the student. Similarly, costs for post-exposure rabies care will also be the responsibility of the student. *Tetanus, Diphtheria, Pertussis Vaccine (Tdap) **Tetanus and Diphtheria Vaccine (Td) Measles, Mumps, and Rubella The University of Missouri, in accordance with Centers for Disease Control (CDC) guidelines, requires that all newly enrolled or readmitted MU students born after December 31, 1956 must comply with the two-dose Measles Immunization Policy. If a second immunization is needed, it must be the combined MMR vaccine. Students who do not comply will not be allowed to register or pre-register for their second semester at MU. Requirements 2 doses of MMR vaccine. The first dose must have been given at age 12 months or later. The second dose must have been given at least one month after the first one.ORTiter (blood test) results proving immunity to measles, mumps and rubella. Documentation is required. *A waiver for medical, religious, or philosophical reasons may be granted if valid proof is provided. Download the MMR and TB screening form. This form must be competed prior to entering the clinical curriculum at MU. Health Insurance Veterinary medicine is a relatively dangerous profession. There is always risk of injury when working with animals. In addition, you may be exposed to zoonotic diseases during the course of routine preclinical or clinical training. Please note that students are responsible for the cost of their own medical care during their veterinary training. Thus, all students are required to have health insurance. Commonly Asked Questions What do I wear and what supplies do I need? This varies and depends on each rotation you are assigned to. Coveralls and clinic jackets are standards for clinical rotations and may be purchased from the Missouri Veterinary Education Service. This not for profit, student-owned bookstore also stocks books, stethoscopes, and other supplies that you will need on your clinical rotations. You can learn more about the bookstore. You may contact the bookstore at: MVES BookstorePO Box 7331Columbia, MO 65205(573) 882-0990MVES@missouri.edu What is my clinical rotation schedule going to be? Clinical service rotations are 2 to 8 weeks in length and the order varies among students. Ross University, St. George and St. Mathews students will take the following required clinical service rotations for a total of 32 weeks: 1. Small Animal Medicine (Referral Internal Medicine, Community Practice/Shelter medicine, Emergency and Critical Care)2. Small Animal Surgery (Soft Tissue Surgery, Orthopedic Surgery)3. Food Animal Medicine and Surgery (Hospital, Ambulatory and Production Medicine Rotations) OR Equine Medicine, Surgery and Ambulatory4. Medical Services (Anesthesiology and Radiology)5. Diagnostic Pathology (Clinical Pathology and Necropsy)6. Evaluated Preceptorships or Elective Rotations What do I do during my elective rotation? Ross University, St. George and St. Mathews students can elect to complete this rotation by taking elective courses at the University of Missouri. Two-week rotations may be taken at the Veterinary Health Center. Alternatively, students may choose to complete an evaluated preceptorship in a private practice. These off-site experiences require supervision and evaluation by a licensed veterinarian in good standing and the student should gain experience in diagnosis, treatment, surgery, and practice management. A total of 2 weeks and 60 hours is the minimum time required for an acceptable preceptorship and students are strongly encouraged to spend as much time as possible observing and assisting with case management. Other preceptorships may be chosen in the areas of public health, epidemiology, or research. Supervisors for those preceptorships can be either a DVM or PhD. Questions about the suitability and evaluation of a preceptorship experience should be directed to the Office of Student and Academic Affairs. The student must leave a forwarding address with the Office of Student and Academic Affairs prior to leaving for a preceptorship. On-site clinical electives can be found here. Island students may also choose to take the following core MU clinical rotations as electives: Theriogenology, Ophthalmology, Neurology/Neurosurgery, Oncology. If you choose to complete on-site electives, you should contact the Associate Dean for Student and Academic Affairs to check for availability and for advanced scheduling. Disability Accommodations If you have a documented physical or learning disability, please review the Schedule of Courses. If you anticipate the need to ask for accommodations, please contact Dr. Snider (573-882-1902) as soon as possible. You also need to discuss any possible accommodations that will be requested with affected course leaders at least 60 days before the course begins. You may contact Dr. Snider to assist you in arranging the necessary meetings."
year_published = 2025
