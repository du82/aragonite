["https://cvm.missouri.edu/davina-dangelo-receives-avmf-merck-student-innovation-award"]
title = "Davina D’Angelo receives AVMF Merck Student Innovation Award // College of Veterinary Medicine"
description = "Fourth-year student Davina D’Angelo won the award for developing a 3D-printed cystotomy spoon to improve urolith removal."
full_description = "Fourth-year student Davina D’Angelo won the award for developing a 3D-printed cystotomy spoon to improve urolith removal. Published 02/13/25Story contact: Nicholas Childress, CVMMarCom@missouri.edu Davina D’Angelo Davina D’Angelo, a VM4 at the University of Missouri College of Veterinary Medicine (CVM), was recently named the first-prize recipient of the Merck Animal Health Student Innovation Award by the American Veterinary Medical Foundation. The award, which includes a $10,000 scholarship, honors final-year students from AVMA-accredited veterinary schools for their academic excellence, creativity, and entrepreneurial efforts in developing meaningful projects or products. D’Angelo earned the award for innovation in cystotomy surgery. She designed, 3D-printed and patented a cystotomy spoon to improve urolith — or bladder stone — removal in veterinary patients. The project, originally developed during her undergraduate research at the University of Arkansas, evolved into a proof-of-concept study involving local veterinary clinics and was expanded upon through Mizzou’s Veterinary Research Scholars Program. D’Angelo has presented this research at multiple conferences, including the 2023 NIH-Boehringer Ingelheim Symposium in Puerto Rico. She is currently focused on transitioning the tool from a 3D-printed prototype to surgical-grade stainless steel, a crucial step in advancing the cystotomy procedure. “I am deeply honored and humbled to be selected as a recipient of this prestigious award,” she said. “This award holds immense significance for me. It represents far more than just financial support, but serves as reassurance, encouragement and recognition for my dedication to providing high-quality care to patients. It also reinforces my belief in the importance of innovation and empowers me to march forward with my cystotomy proof-of-concept study.”"
