["https://cvm.missouri.edu/about-the-college"]
title = "About the College // College of Veterinary Medicine"
description = "Mission Our mission is to inclusively educate and train outstanding clinicians and scientists from diverse backgrounds, generate new knowledge, engage stakeholders, and foster economic growth, all of which promote and protect the health and welfare of animals and people. Simply put, our mission is to Teach, Heal, Discover and Serve. Values Statement We value the&hellip;"
full_description = "Mission Our mission is to inclusively educate and train outstanding clinicians and scientists from diverse backgrounds, generate new knowledge, engage stakeholders, and foster economic growth, all of which promote and protect the health and welfare of animals and people. Simply put, our mission is to Teach, Heal, Discover and Serve. Values Statement We value the uniqueness of every individual and strive to ensure each person’s success. Contributions from individuals with diverse backgrounds, experiences and perspectives promote intellectual pluralism and enable us to achieve the excellence that we seek in learning, research and engagement. This commitment makes our university a better place to work, learn and innovate. About the College The Doctor of Veterinary Medicine professional program at the College of Veterinary Medicine boasts a unique curricular structure, which provides nearly two years of hands-on training in the college’s general and specialty clinics. Years one and two of the four-year program focus on instruction in high-tech, computer-based classrooms and labs. Years three and four provide clinical instruction in such areas as ophthalmology, cardiology, orthopedics, oncology, dentistry, community medicine food animal and equine medicine. The location between two metro areas – St. Louis and Kansas City – and adjacent rural areas offers a strong caseload in companion, equine and food animal species – and opportunities for collaborative research, instruction and pursuing preceptorships. Preceptorships during the third and fourth years are supported by a new database system and a preceptor coordinator who ensures that each student is guided toward the opportunities that best match their individual interests. Veterinarians throughout the Midwest refer animal clients to the Veterinary Health Center for specialized diagnoses and treatment in specialties, such as emergency medicine and critical care, soft tissue surgery, dentistry, ophthalmology, neurology, oncology, dermatology, cardiovascular medicine and surgery, and orthopedic surgery. Our community medicine practice also offers preventive medicine, dentistry and routine small animal outpatient services. The College’s Shelter Medicine Program increases opportunities for students to develop their hands-on clinical skills while helping area humane societies serve their communities. MU is a national leader in comparative medicine, in which researchers collaborate by sharing discoveries, innovations, and treatments for animals and humans. For more than four decades, the National Institutes of Health has continuously funded comparative medicine research at the University of Missouri. The College of Veterinary Medicine has been and continues to be an essential partner in this research. The Veterinary Medical Diagnostic Laboratory is the only nationally accredited diagnostic laboratory in Missouri and one of only five in the Midwest. It handles more than 51,000 diagnostic cases a year and serves all of Missouri’s 114 counties and surrounding states by performing approximately 167,000 diagnostic tests annually. The facility supports toxicology, histopathology, serology, bacteriology, molecular biology and virology diagnostic laboratories. It also provides the opportunity for veterinary medical students to receive instruction in diagnostic laboratory medicine. The Veterinary Health Center provides a wide range of clinical services on the MU campus, and the Veterinary Health Center at Wentzville provides diagnostic services, radiation therapy, clinical trials and dermatology services in the St. Louis area. Federal regulations require the College of Veterinary Medicine to disclose whether its degree programs meet U.S. states’ educational requirements for licensure [34 CFR 668.43 (a)(5)(v)].The University of Missouri Office of eLearning’s State Authorization office maintains information by jurisdiction for students and prospective students on the respective institutions’ state authorization web pages.The College of Veterinary Medicine is accredited by the American Veterinary Medical Association and our veterinary graduates are eligible to apply for licensure in any state provided they meet any additional requirements that state might have.Current and potential students are encouraged to determine the requirements for any jurisdiction in which they intend to seek admission by contacting the state licensing board."
