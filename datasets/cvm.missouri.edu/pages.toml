description = "The University of Missouri College of Veterinary Medicine is fully accredited by the American Veterinary Medical Association (AVMA) Council on Education (COE). Accreditation is renewed on a yearly basis with a full evaluation every 7 years. The most recent full review was conducted in 2020 and the next full review is scheduled for 2027. NAVLE&hellip;"
full_description = "The University of Missouri College of Veterinary Medicine is fully accredited by the American Veterinary Medical Association (AVMA) Council on Education (COE). Accreditation is renewed on a yearly basis with a full evaluation every 7 years. The most recent full review was conducted in 2020 and the next full review is scheduled for 2027. NAVLE Examination Pass Rates The licensing examination for veterinarians is the North American Veterinary Licensing Examination (NAVLE). The AVMA COE requires a minimum pass rate of 80% to maintain full accreditation. Performance of University of Missouri College of Veterinary Medicine graduates is shown in the following table. Data includes the ultimate pass rate of the graduating class for the combined December and April testing dates. YEARSTUDENTS TAKING EXAM(S)STUDENTS PASSING EXAM(S)PERCENT PASSINGNATIONAL PERCENT PASSING2015114114100%96%201610810597%95%201711211098%95%201811211199%95%201910910798%94%202011411197%95%202111511398%92%202211511197%90%202311711195%86%202412011193%88% In addition successfully completing a professional veterinary education, most states require state and national licensing examinations to meet requirements to practice. Please visit the International Council for Veterinary Assessment (ICVA) and the American Association of Veterinary State Boards (AAVSB; www.aavsb.org) websites for further information."
