["https://cvm.missouri.edu/bachelor-of-science-in-veterinary-technology/bsvt-articulation-agreements"]
title = "BSVT Articulation Agreements // College of Veterinary Medicine"
description = "Articulation agreements provide students who have earned an associate’s degree in veterinary technology the opportunity to complete a Bachelor of Science in Veterinary Technology at MU by facilitating transfer of associate-level credits. Under this agreement, transfer students will have access to financial aid and student services on the same basis as native MU students. Additionally,&hellip;"
