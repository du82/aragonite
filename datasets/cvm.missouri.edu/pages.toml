["https://cvm.missouri.edu/veterinary-online-programs"]
title = "Veterinary Online Programs // College of Veterinary Medicine"
description = "In addition to the four-year professional curriculum leading to the Doctor of Veterinary Medicine (DVM) degree, the MU College of Veterinary Medicine offers online undergraduate and graduate courses.&nbsp; Courses can be used to: Act as electives for pre-veterinary requirements and degree programs in the biomedical sciences, such as biology, biochemistry, and pharmacy. Earn a BS&hellip;"
full_description = "In addition to the four-year professional curriculum leading to the Doctor of Veterinary Medicine (DVM) degree, the MU College of Veterinary Medicine offers online undergraduate and graduate courses. Courses can be used to: Act as electives for pre-veterinary requirements and degree programs in the biomedical sciences, such as biology, biochemistry, and pharmacy. Earn a BS degree in veterinary technology Earn an undergraduate certificate in Veterinary Sciences or Biomedical Sciences Earn a Graduate Certificate in Veterinary Sciences Earn an MS degree in Biomedical Sciences, emphasis Veterinary Sciences All courses are asynchronous and delivered 100% online. Online course rigor is equivalent to that of traditional on-site classes. Students should plan to invest 1-3 clock hours/course credit hour/week of study time for undergraduate courses. Graduate courses will require 2-6 clock hours/credit hour/ week. Exams are proctored online. Courses either have passed, or are preparing for, the MU 5 Pillars Quality Course Review process. All Veterinary Online Programs instructors have passed the MU certification process for online teaching. Department permission is required to register for courses. To request a permission number: Permission Numbers for Online Courses For an overview of ALL Mizzou Online Veterinary Programs please visit this website: Mizzou Online Vet Med Programs"
year_published = 2025
