title = "Biomedical Sciences // College of Veterinary Medicine"
description = "The Department of Biomedical Sciences is dedicated to upholding the mission of the university through excellence in teaching, preeminence in scholarship and research, and effective leadership in professional service. The department enjoys a well-earned reputation for providing exceptional professional and graduate teaching. Our faculty is committed to developing competent, productive and respected DVM, MS and&hellip;"
full_description = "The Department of Biomedical Sciences is dedicated to upholding the mission of the university through excellence in teaching, preeminence in scholarship and research, and effective leadership in professional service. The department enjoys a well-earned reputation for providing exceptional professional and graduate teaching. Our faculty is committed to developing competent, productive and respected DVM, MS and PhD graduates. The department makes significant contributions to scientific knowledge through the faculty’s nationally recognized, extramurally funded research programs in comparative medicine. We are renowned for our groundbreaking work in cardiovascular sciences, exercise physiology, neurohumoral control of the cardiovascular and respiratory systems, functional genomics, muscle physiology and plasticity, reproductive endocrinology, membrane transport, and toxicology. The faculty also enjoy a superb reputation for active service and dynamic leadership in scientific and professional societies. We welcome interactions and collaborations with like-minded individuals, whether professional students, graduate trainees seeking dedicated mentoring, or researchers pursuing scientific discovery."
