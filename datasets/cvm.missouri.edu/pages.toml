["https://cvm.missouri.edu/inactive-today-forgetful-tomorrow-mizzou-researchers-discover-a-link-between-lack-of-physical-activity-and-a-decline-in-brain-health"]
title = "Inactive today, forgetful tomorrow: Mizzou researchers discover a link between lack of physical activity and a decline in brain health // College of Veterinary Medicine"
description = "A new study shows specific changes in the brain after muscle disuse that are linked with cognitive decline."
full_description = "A new study shows specific changes in the brain after muscle disuse that are linked with cognitive decline. Published 1/23/2025Contact: Brian Consiglio, consigliob@missouri.eduPhotos by Sophia Scheller and Ben StewartVideo by Mizzou Visual Productions Whenever 27-year-old Nathan Kerr stops by the office of his 81-year-old mentor Frank Booth, PhD, Kerr often finds Booth running on a treadmill. “You’re not going to find someone with more enthusiasm for what they do than Frank,” said Kerr, a postdoctoral fellow at the University of Missouri. “Frank is the definition of someone who practices what they preach — and he has been on a mission to encourage active lifestyles his whole career.” Nathan Kerr and Frank Booth. While many researchers study the benefits of exercise, Booth, who was born during World War II and has worked at Mizzou since 1999, does the opposite. He studies the consequences of physical inactivity at Mizzou’s College of Veterinary Medicine. While Booth jokes his career might be closer to its end than its beginning, he certainly hasn’t lost any pep in his step. He also has not lost any motivation to mentor the next generation of young scientists, such as Kerr. The link between muscle and brain health In a recent study, Booth and Kerr found — for the first time — that just 10 days of physical inactivity leads to both insulin resistance and an increase in reactive oxygen species production in the hippocampus, the region of the brain involved in memory and learning. They also found that just 10 days of muscle disuse elevated markers for specific proteins in the brain that are strongly associated with Alzheimer’s disease, an uncurable, irreversible, neurodegenerative disease that has become the fifth leading cause of death in older adults. The findings confirm what many have anecdotally speculated: staying physically active isn’t just good for your physical health, it also can preserve your brain health — potentially preventing or delaying the development of neurodegenerative diseases. “If you compare the 1940s to today, the average lifespan has risen from the mid 60s to the high 70s, but the rate of type 2 diabetes has skyrocketed,” Booth said. “While the average lifespan of Americans has improved, the average health span — the number of disease-free years lived — tends to decline after age 65. Physical inactivity has already been linked to insulin resistance in the body, and we are starting to learn more about the connection between muscle disuse and insulin resistance in the brain. We want to help people live more enjoyable lives in their later years.” And, luckily, it doesn’t take huge steps to make a difference. Booth said that decades of previous research have shown that people who show the greatest improvements in their health are those who switch from getting no exercise to getting periodic exercise — even more improvement than those who switch from periodic exercise to regular exercise — so the most important step is to simply start. “Research in Alzheimer’s development is starting to show that a lot of the neurological changes for Alzheimer’s disease are occurring when people are in their 40s and 50s, even if the official diagnosis of Alzheimer’s often comes at or after age 65,” Booth said. “So, if you can develop good habits in terms of exercise and lifestyle earlier in your life, your brain will thank you later on.” Passing the torch While Kerr now has his doctoral degree and works in the lab of W. David Arnold, executive director of the NextGen Precision Health initiative, Kerr said he will never forget the mentorship he received from Booth and the life lessons he learned along the way. Nathan Kerr. “Aside from his intellectual contribution to my doctoral degree, I have Frank to thank for fostering my passion for science,” Kerr said. “He taught me how to fight for the things you think are important, and I can’t think of a better role model for somebody teaching their students how to approach science in a motivated and passionate way.” During Booth’s 25-year career at Mizzou, he has earned nearly $8 million in grants and published more than 170 research studies in peer-reviewed journals. He is one reason why Mizzou — a leading research university and member of the prestigious Association of American Universities — has seen 10 consecutive years of increases in research expenditures. “Hindlimb immobilization induces insulin resistance and elevates mitochondrial ROS production in the hippocampus of female rats” was published in the Journal of Applied Physiology. Laurel Grisanti and Scott Rector collaborated on the study."
