["https://cvm.missouri.edu/veterinary-pathobiology"]
title = "Veterinary Pathobiology // College of Veterinary Medicine"
description = "The Department of Veterinary Pathobiology was created by the mergers of the Departments of Veterinary Pathology and Veterinary Microbiology. VPB is an integral component of the College of Veterinary Medicine that provides a unique and critical link between the basic and clinical sciences. Our mission is to acquire, advance and disseminate knowledge. We provide instruction&hellip;"
full_description = "The Department of Veterinary Pathobiology was created by the mergers of the Departments of Veterinary Pathology and Veterinary Microbiology. VPB is an integral component of the College of Veterinary Medicine that provides a unique and critical link between the basic and clinical sciences. Our mission is to acquire, advance and disseminate knowledge. We provide instruction in the veterinary student curriculum, in graduate education in many sub-disciplines, including pathology, immunology, parasitology, virology, genetics, and comparative medicine, and we offer a Bachelor of Science degree in microbiology. We strive to create an environment where students develop a love for lifetime learning and independent problem-solving skills. The department also offers residency programs that prepare graduate veterinarians for proficiency and eligibility for certification in the American College of Veterinary Pathology, the American College of Laboratory Animal Medicine, the American College of Veterinary Microbiology, and the American College of Toxicology. Department faculty have a long history of research excellence in microbial pathogenesis, immunology, animal models of disease, parasitology, pathology, toxicology, molecular genetics and genomics, and related disciplines. We integrate this knowledge into the teaching, research and service programs within the college and across our campus."
year_published = 2025
clearnet = "https://cvm.missouri.edu/veterinary-pathobiology"
