["https://cvm.missouri.edu/craig-franklin-honored-as-cvm-alumnus-of-the-year"]
title = "Craig Franklin honored as CVM alumnus of the year // College of Veterinary Medicine"
description = "University of Missouri College of Veterinary Medicine professor emeritus and co-director of the Comparative Medicine Program Craig Franklin, DVM, PhD, DACLAM, was announced as the college’s 2024 Alumnus of the Year."
full_description = "University of Missouri College of Veterinary Medicine professor emeritus and co-director of the Comparative Medicine Program Craig Franklin, DVM, PhD, DACLAM, was announced as the college’s 2024 Alumnus of the Year. Franklin was recognized during the college’s Alumni Reunion Weekend held September 13-14. CVM Dean Srinand Sreevatsan presented Craig Franklin with the Alumna of the Year Award. Published 9/17/2024Story contact: Nicholas Childress, CVMMarCom@missouri.eduPhotos by Karen Clifford Franklin holds four degrees from the University of Missouri ─ a Bachelor of Science degree in agriculture conferred in 1984, and a Doctor of Veterinary Medicine degree conferred in 1987, a Master of Science in Laboratory Animal Science degree conferred in 1990 and a PhD in pathology, studying the pathogenesis of Clostridium piliforme in 1992. Upon completion of his PhD, Franklin began teaching as an assistant professor in the MU Department of Veterinary Pathobiology. He became a full professor of pathobiology in 2011, and served in that role until 2024, when he became professor emeritus upon his retirement. Franklin has served as Director of the NIH-funded MU Mutant Mouse Resource and Research Center, the MU Comparative Medicine Program, the Veterinary Research Scholars Program and has received numerous awards for his research and teaching. With over 25 years of experience as a comparative immunologist and pathologist, he has expertise in animal models, metagenomics, mucosal immunology and microbiology. Franklin’s involvement extends far beyond Mizzou, as he has been involved in countless organizations, committees and honor societies. This involvement has rewarded him with many different awards throughout his career, some of which include the Nathan R. Brewer Scientific Achievement Award, the American College of Laboratory Animal Medicine Scientist Award, the Charles River Prize in Laboratory Animal Medicine and most recently the 2024 University of Missouri “Graddie” Award for extensive and long-standing service to the Graduate School. Franklin’s long-time colleague, Joan Coates, DVM, MS, DACVIM, wrote a nomination letter highlighting his contributions to the CVM, veterinary medicine and education as a whole. “Dr. Franklin is very giving of his time because he wants to make a difference to those around him,” wrote Coates. “He brings enthusiasm, passion and wisdom to committees and service entities. Dr. Franklin is thoughtful and his voice has impact. Basically, when Dr. Franklin speaks, people listen.” As a mentor, Franklin has been involved with over 100 PhD and master’s students, serving as research chair for 12 of those students. Additionally, Franklin has mentored 54 postdoctoral trainees. “He and colleagues conceptualized the Veterinary Research Scholars Program, which has given veterinary students a structured curriculum to gain exposure to research in veterinary medicine,” wrote Coates. “This program has been running since 2005 under the leadership of Dr. Franklin. For this program, he has procured funding from several sources including Merck, Merial, Pfizer, ASLAP, Glaxo-Smith Kline, the Kansas City Life Science Institute, Bayer and Boehringer Ingelheim. His enthusiasm for teaching and research has been pivotal to the success of the VRSP at MU. This program has benefited over 450 veterinary students at the MU CVM and beyond.” Franklin was unable to attend the award ceremony but provided a response in advance. In his written response he thanked those that worked with him throughout his 30-plus year career. “I was so honored to be nominated for the CVM’s Alumnus of the Year and shocked when interim Dean Cohn called to notify me that I had been selected,” Franklin wrote. “I have been so privileged to work with thousands of colleagues, staff, veterinary and graduate students and lab animal residents at my alma mater. I share this honor with all of those individuals, as I’ve been fortunate to be a part of so many tremendous teams.” During the tailgate brunch, volunteers and birds with the Raptor Rehabilitation Project visited with CVM alumni. Reunion weekend activities resumed the following morning. A tailgate brunch at the college preceded the Mizzou versus Boston College football game. Attendees were invited to tour the Veterinary Health Center. The Raptor Rehabilitation Project had some of its resident education birds present to meet alumni and their guests. Members of the CVM Class of 1974 held a 50-year reunion dinner and shared stories from their time at the CVM. A 50-year reunion dinner was held for the Class of 1974 on Sept. 14."
