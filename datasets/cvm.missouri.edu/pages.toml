 of Columbia, Missouri, died peacefully at her home May 4, 2024. She was a professor at the University of Missouri with joint appointments in the MU College of Veterinary Medicine and the Sinclair School of Nursing. May 8, 2024 Continuing a Family Legacy As a fourth-generation Tiger, Marshfield, Missouri, native Ben Greer saw firsthand the impact his dad made as a veterinarian. After graduating this spring, Greer plans to take what he learned at the University of Missouri and return to his roots in southwest Missouri to expand access to large animal veterinary care. April 25, 2024 Twelve MU Students and Alumni Honored by National Science Foundation The National Science Foundation (NSF) Graduate Research Fellowship Program recognizes and supports outstanding graduate students in NSF-supported STEM disciplines who are pursuing research-based master’s and doctoral degrees at accredited U.S. institutions. Prev 1 2 3 4 5 6 … 12 Next"
