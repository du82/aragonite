["https://cvm.missouri.edu/veterinary-health-center-introduces-state-of-the-art-mri-to-missouri"]
title = "Veterinary Health Center introduces state-of-the-art MRI to Missouri // College of Veterinary Medicine"
description = "Mizzou is transforming veterinary care with Missouri’s first and only three-tesla MRI for animals. This groundbreaking technology delivers sharper images, faster scans and more precise diagnoses — leading to quicker treatments and better outcomes for animals."
full_description = "Mizzou is transforming veterinary care with Missouri’s first and only three-tesla MRI for animals. This groundbreaking technology delivers sharper images, faster scans and more precise diagnoses — leading to quicker treatments and better outcomes for animals. The upgraded 3T MRI (right) offers sharper, more detailed images with less grain, significantly improving diagnostic accuracy compared to the older scan (left). Published 02/24/25Story contact: Nicholas Childress, CVMMarCom@missouri.eduPhotos by Karen Clifford The University of Missouri’s Veterinary Health Center (VHC) is raising the bar for animal care with the state’s first and only three-tesla MRI. While the VHC has offered MRI diagnostics since 2003, the latest scanning upgrade provides sharper images and reduces the time animals are under anesthesia. The completely digital MRI delivers high-resolution scans of soft tissues, enabling veterinarians to diagnose neurological, cardiovascular and oncologic conditions and musculoskeletal injuries with greater precision and efficiency. “The Veterinary Health Center is dedicated to providing quality care with compassion,” said Joan Coates, DVM, MS, DACVIM, a professor and section head of veterinary neurology and neurosurgery at the College of Veterinary Medicine. “We have a wealth of expertise in this building, and the newly upgraded scanner allows us to continue offering the best possible care and service to our patients and clients.” Beyond improving patient care, the new machine enhances training for veterinary students and house officers — giving them hands-on experience with the latest imaging technology and helping them diagnose complex conditions. “The upgrade attests to the commitment the CVM has to provide state-of-the-art technology,” Coates said. “By using cutting-edge MRI technology, we can provide the best possible diagnostic capabilities to the patients of the Veterinary Health Center and peace of mind for their owners.”"
