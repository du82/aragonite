["https://cvm.missouri.edu/mu-metagenomics-center-mumc"]
title = "MU Metagenomics Center (MUMC) // College of Veterinary Medicine"
description = "The MU Metagenomics Center provides a wide range of services associated with the characterization of complex microbial communities including DNA extraction and next-generation sequencing, as well as rederivation of genetically manipulated rodents to generate animals harboring a desired complex microbiota. MU Metagenomics Center (MUMC) The MU Metagenomics Center (MUMC) offers services to biomedical researchers and&hellip;"
full_description = "The MU Metagenomics Center provides a wide range of services associated with the characterization of complex microbial communities including DNA extraction and next-generation sequencing, as well as rederivation of genetically manipulated rodents to generate animals harboring a desired complex microbiota. MU Metagenomics Center (MUMC) The MU Metagenomics Center (MUMC) offers services to biomedical researchers and clinician/researcher veterinarians associated with characterization of the bacteria present in biological samples, most commonly fecal samples. Our Services Current services include DNA extraction, 16S rRNA amplicon sequencing, informatics analysis of sequence data, consultation on study design and data interpretation, and storage of sequence data and biological samples. Our Resources The MUMC is closely affiliated with the NIH-funded MU Mutant Mouse Resource and Research Center (MMRRC) and Rat Resource and Research Center (RRRC)."
year_published = 2025
