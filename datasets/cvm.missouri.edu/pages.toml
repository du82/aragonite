["https://cvm.missouri.edu/comparative-medicine-program"]
title = "Comparative Medicine Program // College of Veterinary Medicine"
description = "Academic Degree Trainees may pursue either an MS in Biomedical Sciences with Comparative Medicine emphasis or a PhD in a variety of departments/areas such as Area Pathobiology. Of note, these degree programs are intertwined with the Comparative Medicine residency program, thus no transitions between the two are required. Trainees already having relevant advanced graduate degrees&hellip;"
full_description = "Academic Degree Trainees may pursue either an MS in Biomedical Sciences with Comparative Medicine emphasis or a PhD in a variety of departments/areas such as Area Pathobiology. Of note, these degree programs are intertwined with the Comparative Medicine residency program, thus no transitions between the two are required. Trainees already having relevant advanced graduate degrees may pursue post-doctoral research coupled with laboratory animal medicine activities. Program Advantages The MU CMP couples a residency program with a research program that leads to either an MS or PhD degree. Training is designed to prepare individuals for a variety of careers including comparative medicine research, clinical and administrative laboratory animal medicine and comparative and diagnostic laboratory animal pathology. Research opportunities are available in several areas including infectious disease, pathology, molecular biology, mouse biology and cardiovascular physiology. Mizzou is home to many unique resources including the University of Missouri Office of Animal Resources (OAR), IDEXX BioAnalytics, as well as the Mutant Mouse, Rat and Swine Resource and Research Centers. Columbia, MO is a diverse and vibrant college towns that offers a variety of activities, affordable housing and is located between two large cities, Kansas City and St. Louis. Click here to learn more about CoMo! The first year of the program consists of laboratory animal medicine residency activities. In years two and three, the trainee is involved primarily in research activities (at least 40 hours/week) combined with 10-15 hours/week of laboratory animal medicine activities. The latter activities complement training gained in the first year and are part of an individual development plan generated in consultation with program faculty to facilitate pursuit of specific career goals. MS students complete their residency and degree program after three years, while PhD students complete their residency after three years and their degree program after approximately five years. CMP trainees may also elect to pursue a more clinically oriented program where, during the second and third years of their program, they split activities approximately 50:50 between a research project and additional trainee-driven laboratory animal medicine activities. Students pursuing this program generally pursue MS degrees but may switch to PhDs if interests and goals change. Students may pursue either a MS or PhD. Research opportunities are available in several areas including infectious disease, cancer, cardiovascular and exercise physiology, bioengineering and many more. Resources available include the University of Missouri Office of Animal Resources (OAR), IDEXX BioAnalytics, the Laboratory for Infectious Disease Research, one of 12 NIH-funded Regional Biocontainment Laboratories, and the Mutant Mouse, Rat and Swine Resource and Research Centers."
