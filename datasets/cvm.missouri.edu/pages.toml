full_description = "University of Missouri College of Veterinary Medicine TEACH | HEAL | DISCOVER | SERVE A Q&A with Brennan Fortel ​ Read more MIZZOU CVM NEWS Claire’s comeback A seamless collaboration between specialties at Mizzou’s Veterinary Health Center helped Claire, a 4-year-old Llewellin English Setter, heal from life-threatening injuries and return to her happy, playful self. Veterinary Health Center introduces state-of-the-art MRI to Missouri Mizzou is transforming veterinary care with Missouri’s first and only three-tesla MRI for animals. This groundbreaking technology delivers sharper images, faster scans and more precise diagnoses — leading to quicker treatments and better outcomes for animals. Horse trained for equine yoga receives world-class care at Mizzou Longtime Mizzou ophthalmologist Elizabeth Giuliano helps horse with vision-threatening eye infection. MORE NEWS HOW TO APPLY TO OUR DOCTOR OF VETERINARY MEDICINE PROGRAM CVM ADMISSIONS As Missouri’s only College of Veterinary Medicine, our mission is to educate and train outstanding clinicians and scientists, generate new knowledge, and foster economic growth to promote and protect the health and welfare of animals and people. LEARN MORE CHOOSE THE RIGHT PATH FOR YOU Undergraduate Programs – The College of Veterinary Medicine strives to ensure that all our students can pursue a path that appeals to their strengths and interests. Learn more about our undergraduate opportunities. Graduate Studies – Advanced studies are offered in biomedical sciences, pathobiology, public health and veterinary medicine and surgery under the mentorship of eminent scholars whose work advances scientific knowledge. Undergraduate Programs Graduate Studies CVM ONLINE PROGRAMS Whether you are considering a career change, caring for family members, or face other obstacles to an on-campus experience, our online programs offer the flexibility to advance your education and enhance career opportunities on your timetable. Veterinary Online Programs Bachelor of Science in Veterinary Technology (BSVT) Supporting the College of Veterinary Medicine Explore how you can partner with us to make a positive difference in the lives of animals and people. FIND OUT MORE"
