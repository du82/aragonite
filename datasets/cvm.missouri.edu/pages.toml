["https://cvm.missouri.edu/alumni-and-friends/alumni-weekend-faqs"]
title = "Alumni Weekend FAQs // College of Veterinary Medicine"
description = "Questions about Alumni Weekend? We have answers! When is Alumni Weekend 2025? Friday, September 12, and Saturday, September 13 What class years will be celebrated this year? 1955, 1960, 1965, 1970, 1975, 1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2020 It is not my class reunion year. May I still attend? Of course! While&hellip;"
full_description = "Questions about Alumni Weekend? We have answers! When is Alumni Weekend 2025? Friday, September 12, and Saturday, September 13 What class years will be celebrated this year? 1955, 1960, 1965, 1970, 1975, 1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2020 It is not my class reunion year. May I still attend? Of course! While we celebrate specific class milestones, everyone is invited back to campus for the event. I have special dietary requirements. Will food options be available at all the events? Absolutely, but we need your help. When you are registering for the reunion, you will have the chance to indicate your dietary details. Please indicate your needs (with details) on your registration form, and we will work with our catering department to ensure they are met. What should I wear to the reunion events? Although the dress code is casual for the weekend, you might find the below helpful. Reunion Dinner apparel – Business casual50th Reunion – Business casual Tailgate apparel – Your favorite black and gold outfit! Are spouses/partners/significant others/children invited? Absolutely! We encourage returning alumni to bring their entire families. Children 12 and younger are complimentary and do not require a registration fee. Will my football tickets be mailed to me? Tickets are now digital (e-ticket) that will be sent to your mobile device. To purchase tickets, a link will be emailed out this summer for our block of tickets. You will sign up via the link and a ticket code will be sent to you. For all football ticket-related questions please contact the Athletic ticket office at 1-800-CAT-PAWS Will there be transportation available? There are many options in Columbia for public transportation, unfortunately, at this time we can not offer a shuttle service or a ride, thank you for understanding. Hotel Information – New This Year! Once you register online, you will receive an email with hotel reservation details. Room Blocks are available exclusively for MU Vet Med Alumni. To ensure availability, each alum may reserve up to two rooms. If more than two rooms are booked, additional reservations will be canceled. I would like to make a gift in honor of my reunion, how can I do that? Great! You can make an online gift at giving.missouri.edu. Make sure to add your class year! How can I update my information? Please email your updated contact information to mucvmevents@missouri.edu Welcome back to Columbia! Please visit the below link for all your needs. https://www.visitcolumbiamo.com/section/visitor-information/ Registration Information – Coming Soon! Refund Policy: We do not offer refunds for registration. If you are unable to attend, your registration will support the College of Veterinary Medicine. Thank you for your understanding. Kim BussardAlumni and Donor Engagement CoordinatorCollege of Veterinary Medicine573-882-0548bussardk@missouri.edu"
