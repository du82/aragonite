title = "DIVERSITY, EQUITY, AND INCLUSION | CVPR 2021"
full_description = "The CVPR community is strongly committed to addressing issues related to diversity, equity, and inclusion (DEI) at our conference. Diversity has many dimensions, including gender, race, ethnicity, age, disabilities, religious belief, sexual orientation, socioeconomic status, and cultural background. There is no place for hatred and discrimination in the CVPR community or elsewhere. For CVPR 2021, the DEI Chairs are working with other members of the organizing committee to help foster a more inclusive, diverse and equitable conference. Specifically, we will encourage the following: - improve diversity and inclusion in workshop and tutorial organizers and invited speakers by including diversity, equity, and inclusivity as part of the evaluation criteria; - encourage the submission of workshop and tutorial proposals that examine problems in equity, diversity and inclusion from a technical perspective; - hold networking events and support affinity groups that are specifically aimed at building and nurturing networks to support communities that are currently not well represented at CVPR; - support for students to attend CVPR from communities that do not traditionally attend through travel grants and waived registration fees. If you have any questions, concerns, or feedback related to DEI efforts at the CVPR 2021, would like to get involved, please contact the DEI co-chairs (Tamara Berg and Richard Souvenir) by email at cvpr2021_dei@googlegroups.com."
