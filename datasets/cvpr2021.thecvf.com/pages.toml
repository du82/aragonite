["http://cvpr2021.thecvf.com/node/63"]
title = "Media Center | CVPR 2021"
full_description = "CVPR 2021 will be the foremost computer vision event of the year. With in-depth workshops, research presentations, demonstrations and exhibits on the most exciting advances in computer vision, pattern recognition, machine learning, robotics, and artificial intelligence, it is the field’s must-attend virtual event for researchers, academia, exhibitors and media alike to learn about and share the latest and most innovative developments within the computer vision community. Get Media Pass Find CVPR News and Resources Attend CVPR 2021 as an Official Member of the Media The IEEE Computer Society welcomes official members of the media at CVPR 2021. But due to high demand, complimentary media passes will be available on a limited basis, and only issued to working members of the press, analysts, and select representatives from known and established media organizations, who are on assignment. Applicants must complete and submit the application form, meet certain criteria, and provide required documentation to receive a media registration. Please see below for details. For Print, Trade and Newswire Reporters, please provide: A copy of the masthead from a current issue of the publication or a link to the publication’s website that shows the applicant’s name listed as part of the reporting team, or a copy of a business card with the applicant’s name, title and publication name. Examples of three articles on computer vision-related topics authored by the applicant and published within the last six months (articles must be original content). (Publishers and copy/content editors do not qualify for media passes nor do individuals in executive management, administration, and/or research.) For Broadcast TV/Radio Reporters, Producers and Camera/Sound Crews, please provide: A link to the station’s website that shows the applicant’s name listed as part of the reporting team or a copy of a business card with applicant’s name, title and station name. For Online Publications & Blogs, please provide: The name of the publication and link to the website to which they will publish during CVPR 2021 that shows the applicant’s name listed in an editorial capacity. Examples of three articles on computer vision-related topics authored by the applicant and published within the last six months (articles must be original content). Demonstration of online readership of more than 2,500 unique views per month. (Sponsored bloggers, bloggers for company pages, personal website writers, consultants who blog as a means to promote their business, designers, and public relations professionals do not qualify for media passes) For Freelance Reporters, please provide: A letter or email from the editor or senior member of the editorial team on company letterhead or from an official email address stating the applicant is covering CVPR 2021 on assignment for the specific publication. Examples of three articles on computer vision-related topics authored by the applicant and published within the last six months (articles must be original content). (Marketing, public relations, or other industry executives who contribute bylined articles to news outlets do not qualify for media passes.) For Industry Analysts, please provide: A link or copy of a bylined, published report related to the computer vision industry and published within the last six months. (Analysts and consultants who develop client-only or private-use reports for their own firm or another firm do not qualify for media passes.) Media passes will be processed on a first-come, first-served basis. Due to robust interest in CVPR and capacity restrictions, CVPR media registrations may be closed prior to the conference. IEEE Computer Society staff encourage interested members of the media to register as soon as possible to ensure admittance. Members of the IEEE Computer Society staff will review all submissions to ensure criteria is met and required documentation submitted. Status of your media pass request will be provided via email. Please note that acceptance to previous CVPR events does not necessarily guarantee acceptance to CVPR 2021. IEEE Computer Society staff reserves the right to refuse media passes without cause. Media Pass Application Form"
