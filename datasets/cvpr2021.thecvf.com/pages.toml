["https://cvpr2021.thecvf.com/node/33"]
title = "CMT submissions Website | CVPR 2021"
full_description = '''AUTHOR GUIDELINES CMT submissions Website https://cmt3.research.microsoft.com/CVPR2021 Call for Papers Papers in the main technical program must describe high-quality, original research. Topics of interest include all aspects of computer vision and pattern recognition including, but not limited to: 2D object recognition 3D computer vision 3D object recognition Action and behavior recognition Adversarial learning, adversarial attack and defense methods Biometrics, face, gesture, body pose Computational photography Datasets and evaluation Efficient training and inference methods for networks Explainable AI, fairness, accountability, privacy, transparency and ethics in vision Image and video retrieval Image and video synthesis Image classification Low-level and physics-based vision Machine learning architectures and formulations Medical, biological and cell microscopy Motion and tracking Optimization and learning methods Pose estimation Representation learning, deep learning Scene analysis and understanding Transfer, low-shot, semi- and un- supervised learning Video analysis and understanding Vision + language, vision + other modalities Vision applications and systems, vision for robotics and autonomous vehicles All submissions will be handled electronically. In addition to the main technical program, the conference will include Tutorials, Workshops, Demonstrations, and Exhibits. Submit proposals to the appropriate chair. Important dates: Paper registration deadline November 9, 2020 (11:59PM Pacific Time) Paper Submission Deadline November 16, 2020 (11:59PM Pacific Time) Supplementary Materials Deadline November 23, 2020 (11:59PM Pacific Time) Reviews Released to Authors January 18, 2021 (11:59PM Pacific Time) Rebuttal Due January 25, 2021 (11:59PM Pacific Time) Final Decisions to Authors February 28, 2021 Camera-Ready Deadline TBD Main Conference June 21 – 24, 2021 * Submission date is fixed, no extension will be given. Policies Important: Please note that the policies have been updated from the 2020 version, including guidelines related to arXiv prior work, code submission, and authors acting as reviewers. Review Process: By submitting a paper to CVPR, the authors agree to the review process and understand that papers are processed by the Toronto system to match each manuscript to the best possible area chairs and reviewers. Confidentiality: The review process of CVPR is confidential. Reviewers are volunteers not part of the CVPR organization and their efforts are greatly appreciated. The practice of keeping all information confidential during the review is part of the standard communication to all reviewers. Misuse of confidential information is a severe professional failure and appropriate measures will be taken when brought to the attention of CVPR organizers. It should be noted, however, that the organization of CVPR is not and cannot be held responsible for the consequences when reviewers break confidentiality. Conflict Responsibilities: It is the primary author's responsibility to ensure that all authors on their paper have registered their institutional conflicts into the submission system – CMT3 (see details under Domain Conflicts below). If a paper is found to have an undeclared or incorrect institutional conflict, the paper may be summarily rejected. To avoid undeclared conflicts, the author list is considered to be final after the submission deadline and no changes are allowed for accepted papers. Double blind review: CVPR reviewing is double blind, in that authors do not know the names of the area chair/reviewers of their papers, and the area chairs/reviewers cannot, beyond reasonable doubt, infer the names of the authors from the submission and the additional material. Avoid providing information that may identify the authors in the acknowledgments (e.g., co-workers and grant IDs) and in the supplemental material (e.g., titles in the movies, or attached papers). Avoid providing links to websites that identify the authors. Violation of any of these guidelines may lead to rejection without review. If you need to cite a different paper of yours that is being submitted concurrently to CVPR, the authors should (1) cite these papers; (2) argue in the body of your paper why your CVPR paper is non trivially different from these concurrent submissions; and (3) include anonymized versions of those papers in the supplemental material. Plagiarism: Plagiarism consists of appropriating the words or results of another, without credit. CVPR 2021's policy on plagiarism is to refer suspected cases to the IEEE Intellectual Property office, which has an established mechanism for dealing with plagiarism and wide powers of excluding offending authors from future conferences and from IEEE journals. You can find information on this office, their procedures, and their definitions of five levels of plagiarism at this webpage. We will be actively checking for plagiarism. Furthermore, the paper matching system is quite accurate. As a result, it regularly happens that a paper containing plagiarized material goes to a reviewer from whom material was plagiarized; experience shows that such reviewers pursue plagiarism cases enthusiastically. Dual/Double Submissions: The goals of CVPR are to publish exciting new work for the first time and to avoid duplicating the effort of reviewers. By submitting a manuscript to CVPR, authors acknowledge that it has not been previously published or accepted for publication in substantially similar form in any peer-reviewed venue including journal, conference or workshop, or archival forum. Furthermore, no publication substantially similar in content has been or will be submitted to this or another conference, workshop, or journal during the review period. Violation of any of these conditions will lead to rejection, and will be reported to the other venue to which the submission was sent. A publication, for the purposes of this policy, is defined to be a written work longer than four pages (excluding references) that was submitted for review by peers for either acceptance or rejection, and, after review, was accepted. In particular, this definition of publication does not depend upon whether such an accepted written work appears in a formal proceedings or whether the organizers declare that such work “counts as a publication”. The above definition does not consider an arXiv.org paper as a publication because it cannot be rejected. It also excludes university technical reports which are typically not peer reviewed. However, this definition of publication does include peer-reviewed workshop papers, even if they do not appear in a proceedings, if their length is more than four pages (excluding citations). Given this definition, any submission to CVPR should not have substantial overlap with prior publications or other concurrent submissions. A submission with substantial overlap is one that shares 20 percent or more material with previous or concurrently submitted publications. Authors are encouraged to contact the Program Chairs about clarifications on borderline cases. Note that a technical report (departmental, arXiv.org, etc.) version of the submission that is put up without any form of direct peer-review is NOT considered prior art and should NOT be cited in the submission. Attendance responsibilities: The authors agree that if the paper is accepted, at least one of the authors will register for the conference and present the paper there. Publication: All accepted papers will be made publicly available by the Computer Vision Foundation (CVF) two weeks before the conference. Authors wishing to submit a patent understand that the paper's official public disclosure is two weeks before the conference or whenever the authors make it publicly available, whichever is first. The conference considers papers confidential until published two weeks before the conference, but notes that multiple organizations will have access during the review and production processes, so those seeking patents should discuss filing dates with their IP council. The conference assumes no liability for early disclosures. More information about CVF is available at http://www.cv-foundation.org/. Publicity, social media: Papers submitted to CVPR must not be discussed with the press until they have been officially accepted for publication. Work explicitly identified as a CVPR submission also may not be advertised on social media. Please see the FAQ section for more details. Violations may result in the paper being rejected or removed from the conference and proceedings. Authors acting as reviewers: Given the growth of the number of paper submissions, we expect all authors to be willing to serve as reviewers as well. With a large enough pool of reviewers, we expect that reviewers will be sent of the order of five papers to review. Our timeline expects that papers will go to reviewers about Dec 7, 2020, and reviews should be returned on or before Jan 4, 2021. Submission Guidelines All submissions will be handled electronically via the conference's CMT Website. By submitting a paper, the authors agree to the policies stipulated in this website. The paper submission deadline is November 16, 2020. Note that each paper should already be registered one week earlier, by November 9, 2020. Supplementary material can be submitted until November 23, 2020. Papers are limited to eight pages, including figures and tables, in the CVPR style. Additional pages containing only cited references are allowed. Please refer to the following files for detailed formatting instructions: Example submission paper with detailed instructions LaTeX/Word Templates Zip file Papers that are not properly anonymized, or do not use the template, or have more than eight pages (excluding references) will be rejected without review. 1) Paper submission and review site: Submission Site (bookmark or save this URL!) Please make sure that your browser has cookies and Javascript enabled. Please add "email@msr-cmt.org" to your list of safe senders (whitelist) to prevent important email announcements from being blocked by spam filters. Log into CMT3 at https://cmt3.research.microsoft.com. If you do not see “2021 IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR)” in the conference list already, click on the “All Conferences” tab and find it there. 2) Author registration: When you log in for the first time, you will be asked to set up a user profile and fill out a questionnaire. You will not be able to submit any paper without entering this information. At any time, you can update this information by clicking on your name in the upper-right and selecting “User information” under CVPR2021. It is the primary author's responsibility to ensure that all authors on their paper have registered on CMT3 and filled out the questionnaire. User profile: Here you can update the basic information on your CMT profile. Questionnaire: To judge if you are qualified and have matching expertise to review a paper, we ask you for additional information. We expect all authors to be willing to serve as reviewer. If for some reason you are not, we’d like you to motive this. We also need emergency reviewers who are willing to help us out at the last moment for papers that do not have a sufficient number of reviews yet. Our intention is that emergency reviewers will get fewer papers in the first round. If you are willing to serve as emergency reviewer, please indicate so. We also ask for a list of subject areas. Note that, at this stage, you should select the subject areas in which you feel comfortable to act as reviewer (the subject areas for the papers you plan to submit will be asked at a later stage). Please select exactly one topic as primary subject area andup to 10 topics as secondary subject area. 3) Conflict information: Authors need to provide information on conflict domains. Each author should list domains of all institutions they have worked for, or have had very close collaboration with, within the last 3 years (example: mit.edu; ox.ac.uk; microsoft.com). DO NOT enter the domain of email providers such as gmail.com. This institutional conflict information will be used in conjunction with prior authorship conflict information to resolve assignments to both reviewers and area chairs. If a paper is found to have an undeclared or incorrect institutional conflict, the paper may be summarily rejected. 4) Creating a paper submission: This step must be completed by the paper registration deadline. After this deadline, you will not be able to register new papers, but you will be able to edit the information for existing papers. While it will be possible to make minor edits to the title and abstract until the full paper submission deadline, submissions with “placeholder” abstracts which are rewritten entirely for the full submission may be removed without consideration. Note: we are allowing changes to the author list until the full paper deadline. After that, no changes will be permitted for any reason, including for the camera-ready version. (a) Click the “+ Create new submission” button in the upper-left to create a new submission. There, you will be prompted to enter the title, abstract, authors, and subject areas. You are strongly encouraged to finalize the author list by the registration deadline. (b) Check with your co-authors to make sure that: (1) you add them with their correct CMT3 email; and (2) they have logged in to the submission website and filled out the user information questionnaire and conflict information on CMT3. If you add an author with an email that is not in CMT3 and the name and organization is not automatically filled, that means they are not yet in the system, and you should make sure to check that they do not already have an account under a different email before completing the requested information to add them. (c) Enter subject (topic) areas for your paper. You must include at least one primary area and up to 10 secondary areas. This information is used to help assign ACs and reviewers. 5) Paper Number Once you have registered your paper (i.e. title/authors), you will be assigned a paper number. Insert this into the latex or word template before generating the pdf of your paper for submission. Papers submitted without a number may not be reviewed. 6) Submission Requirements: The maximum size of the abstract is 4000 characters. The paper must be PDF only (maximum 50MB). Make sure your paper meets the formatting and anonymity requirements described above. The supplementary material can be either PDF or ZIP only (maximum 100MB). 7) Supplementary Material Submission: By the supplementary material deadline, the authors may optionally submit code and/or additional material that was ready at the time of paper submission but could not be included due to constraints of format or space. The authors should refer to the contents of the supplementary material approp'''
