["http://cvpr2021.thecvf.com/node/213"]
title = "Computer Vision Meets Security | CVPR 2021"
full_description = "Attend the IEEE Computer Society “Computer Vision Meets Security” Panel at CVPR 2021. Hear globally recognized industry leaders explore a range of computer vision and security foundations, and the related impacts on technology, market, and research. Virtual Panel - June 22, 1:00pm to 2:00pm, ET. Join key influencers as they explore how technologists, investors, and scientists work to develop solutions on a number of Computer Vision and Security Foundations challenges. Through the lens of their own experiences, they will review not only the technological expertise but the related financial, market, and organizational challenges. The IEEE CS Virtual Panel is bringing together key stakeholders to explore cutting-edge examples of technology development and collaboration in the intersection of computer vision technologies, markets, and research. Panel moderated by Dejan Milojicic, distinguished technologist and director at Hewlett Packard Labs, Palo Alto, CA. Panelists Diana Kelley, Co-Founder and CTO of Security Curve Fabio Massacci, Professor at University of Trento (IT) and Vrije Universiteit Amsterdam (NL) Dr. Ming Gu is Head of Machine Learning, Risk Management and Security BG at Ant Group Join C-level leaders, engineers, designers, developers, and entrepreneurs at all levels that are leading the way in computer vision and pattern recognition - this panel discussion is one you don’t want to miss! Attend the Computer Vision Meets Security panel to gain actionable insights to prepare yourself and your company for the future. Dejan Milojicic is a distinguished technologist and director at Hewlett Packard Labs, Palo Alto, CA [1998-present]. Previously, he worked in the OSF Research Institute, Cambridge, MA, and Institute “Mihajlo Pupin”, Belgrade, Serbia. He received his PhD from the University of Kaiserslautern, Germany; and his MSc/BSc from Belgrade University, Serbia. His research interests include systems software, distributed computing, systems management, and HPC. Miloijcic has written over 200 papers, 2 books and 64 allowed/granted patents. He is an IEEE Fellow, ACM Distinguished Engineer, and HKN and USENIX member. Milojicic was on 8 PhD thesis committees, taught a Cloud Management course in San Jose State University, and has mentored over 50 interns. He served as president of the IEEE Computer Society (2014), editor-in-chief of IEEE Computing Now (2008-2012), Distributed Systems Online (2008-2009), as well as on many editorial boards and TPCs. Diana Kelley’s security career spans over 30 years. She is Co-Founder and CTO of SecurityCurve and donates much of her time to volunteer work in the cybersecurity community, including serving on the ACM Ethics & Plagiarism Committee, as CTO and Board member at Sightline Security, Board member and Inclusion Working Group champion at WiCyS, Cybersecurity Committee Advisor at CompTIA, Advisory Council, Bartlett College of Science and Mathematics, Bridgewater State University, and RSAC US Program Committee. Diana produces the #MyCyberWhy series and is the host of BrightTALK’s The (Security) Balancing Act and co-host of the Your Everyday Cyber podcast. Diana is also a Principal Consulting Analyst at TechVision Research and a member of The Analyst Syndicate. She was the Cybersecurity Field CTO for Microsoft, Global Executive Security Advisor at IBM Security, GM at Symantec, VP at Burton Group (now Gartner), and a Manager at KPMG. She is a sought after keynote speaker, the co-author of the books Practical Cybersecurity Architecture and Cryptographic Libraries for Developers, has been a lecturer at Boston College's Masters program in cybersecurity, the EWF 2020 Executive of the Year, and one of Cybersecurity Ventures 100 Fascinating Females Fighting Cybercrime. Fabio Massacci, is a Professor at University of Trento (IT) and Vrije Universiteit Amsterdam (NL) Massacci has a Ph.D. in computing from the University of Rome “La Sapienza, and has been in Cambridge, Toulouse e Siena. In 2015 he received the IEEE Requirements Engineering Conference Ten Year Most Influential Paper Award for his work on security and trust in sociotechnical systems. He participated in the FIRST special interest group on the Common Vulnerability Scoring System (CVSS v3). He leads the education effort of the CyberSec4Europe pilot on the governance of cybersecurity in Europe and coordinates the EU AssureMOSS project on the security of open source software. He is a Member of IEEE, ACM, the American Economic Association, and the Society for Risk Analysis. Find more about him at https://fabiomassacci.github.io Dr. Ming Gu is Head of Machine Learning, Risk Management and Security BG at Ant Group. Previously he was Chief Risk Officer and Chief Data Officer at FinVolution (NYSE: FINV), a Fintech firm specialized in serving the unbanked population. Ming received his PhD in Computation and Neural Systems from California Institute of Technology, and his BA in Computer Science from Grinnell College. His research interests include machine learning, cognitive science, and computational neuroscience. He has more than 20 years of experience in analytics and engineering and has worked extensively in the areas of risk, fraud, and security."
