full_description = "Registration is live here. VIRTUAL REGISTRATION Early Ends May 22nd, 11:59 PM Eastern Time (ET) Standard May 23rd, Eastern Time (ET) IEEE or CVF member passport $130 $180 Non-member passport $150 $215 Student IEEE or CVF member passport $50 $125 Non-member Student passport $75 $140 Life/Retired members passport $50 $125 Refund policy All refund requests must be made via email to Nicole Finn. All cancellations will be subject to a $65 cancellation fee before May 26, 2021, 11:59pm EST. NO REFUNDS will be made after May 26, 2021. You are allowed to change the name on the registration without penalty. Updating a Registration You will need to use the SAME EMAIL ADDRESS for the virtual platform as you have registered with. You can update your registration or make a substitution - select already registered when following the registration link and log into your account. Online Event Policy You will be given log-on details for the virtual event. Please note that your log-on information is just like your badge at the conference. Anyone caught sharing the same registration will immediately be removed from the online event and could be excluded from future CVPR events. You will be held responsible for any code of conduct violations that occur under your registration as well. Questions Please direct any questions to Nicole Finn."
