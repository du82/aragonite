ommon example looks like &amp; for an ampersand & character. For a full list of entities see HTML's entities page. Some of the available characters include: Character Description You Type You Get Ampersand &amp; & Greater than &gt; > Less than &lt; < Quotation mark &quot; " Lines and paragraphs are automatically recognized. The <br /> line break, <p> paragraph and </p> close paragraph tags are inserted automatically. If paragraphs are not recognized simply add a couple of blank lines. Web page addresses and email addresses turn into links automatically. Plain text No HTML tags allowed. Lines and paragraphs are automatically recognized. The <br /> line break, <p> paragraph and </p> close paragraph tags are inserted automatically. If paragraphs are not recognized simply add a couple of blank lines. Web page addresses and email addresses turn into links automatically.'''
