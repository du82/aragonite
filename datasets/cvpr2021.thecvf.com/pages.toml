["https://cvpr2021.thecvf.com/node/37"]
title = "CVPR 2021 TUTORIALS CALL FOR PROPOSALS | CVPR 2021"
full_description = '''Tutorial Chairs: Tat-Jun Chin (tat-jun.chin@adelaide.edu.au) and Xiaodan Liang (xdliang328@gmail.com) Proposal Deadline: 11:59 pm (Pacific Standard Time) 30 November 2020. Notification by: 1 February 2021 Submission: Please send your proposal document to tutorials-cvpr-2021@googlegroups.com and prefix your email subject with [Tutorial proposal]. Overview We solicit proposals for tutorials to be held at the 2021 IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR 2021). Tutorials will take place in the two days before and the day after the main conference (June 19-20, and June 25, 2021). Please note, due to COVID-19, it is possible that the conference will be held virtually. Tutorial proposers should be prepared to present the tutorial remotely. A CVPR tutorial should aim to give a comprehensive review of a specific topic related to computer vision. A good tutorial should be educational rather than just a cursory survey of techniques. The topic should be of sufficient relevance and importance to attract significant interest from the CVPR community. Typical tutorial audiences consist of graduate students studying computer vision, but also include researchers and practitioners from both academia and industry. We invite proposals for both half-day and full-day tutorials, but anticipate that most tutorials will be allotted half a day, unless the topic is expected to attract widespread community attention or requires additional time. Submission information A tutorial proposal should be in a PDF document with no more than 4 pages. The document should include the following information: Tutorial title; Presenters' names, titles, affiliations, emails, and brief bio sketches; Preference for half- or full-day event (the latter requires a brief justification); Course description with list of topics to be covered, along with a brief outline/schedule and important details; How the proposed tutorial addresses the evaluation criteria (see below). Description of and/or links to any planned materials or resources to be distributed to attendees; Your willingness to conduct the tutorial virtually if the conference will not be held physically; Send your proposal document to tutorials-cvpr-2021@googlegroups.com and prefix your email subject with [Tutorial proposal]. Proposals should be submitted by 11:59 pm (Pacific Standard Time) Nov 30, 2020. Evaluation criteria Educational value, interest and relevance. We encourage topics and scope that have high educational value, of broad interest to the community and can inspire further research activities. A good tutorial should not simply be a survey of the presenters’ own works. The topics should not have been covered extensively in recent major computer vision conferences, unless there are strong reasons to continue educating the community on the topics (e.g., useful theory or method that is evolving/improving rapidly). For information on previous tutorial topics, consult CVPR tutorials from recent years: 2020: 2020: http://cvpr2020.thecvf.com/program/tutorials 2019: http://cvpr2019.thecvf.com/program/tutorials 2018: http://cvpr2018.thecvf.com/program/tutorials 2017: http://cvpr2017.thecvf.com/program/tutorials 2016: http://cvpr2016.thecvf.com/program/tutorials We would like to see tutorials on interesting and heterogeneous topics at CVPR, and thus may require high-quality proposals with overlapping topics to merge. Please state your willingness to explore combining your tutorial with other tutorials, if recommended by the Tutorial Chairs. Organizers from proposals who are asked to merge should work together to decide the final schedule. We welcome proposals on emerging technical areas, societal and ethical implications of computer vision, and also topics that may not be seen as "traditional" in the CVPR community. Track record and expertise of organisers/speakers.The presenters/speakers should have representative publications on the proposed topics, and experience in giving tutorials with high educational value. Diversity in the organizing team and speakers.We encourage diversity in the organizing teams and speakers in all aspects, including gender, race, affiliation, geography, seniority, and perspective (e.g., advocates vs critics, academia vs industry). The CVPR Diversity, Equity, and Inclusion (DEI) and Tutorial Chairs are available to help, if needed, on this evaluation criterion. Questions? Please contact the tutorial chairs via tutorials-cvpr-2021@googlegroups.com.'''
