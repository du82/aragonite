title = "DOCTORAL CONSORTIUM | CVPR 2021"
full_description = "Call for Participation: CVPR 2021 Doctoral Consortium Overview The Doctoral Consortium provides a unique opportunity for students, who are close to finishing (or recently finished) their doctorate degree, to interact with experienced researchers in computer vision. A senior member of the community will be assigned as a mentor for each student based on the student's preference or similarity of research interests. The Doctoral Consortium meeting, which will be held virtually this year, gives students an opportunity to present their research and discuss their ongoing research and career plans with their mentor. Eligibility Students must be conducting research in computer vision and be within 6 months (before or after) of graduating with their doctoral degree. Applicants must not have attended a doctoral consortium previously (at ICCV, ECCV or CVPR). Submission Guidelines Students that meet the eligibility requirements should submit an application containing the following: Applicant's up-to-date CV Two-page research statement summarizing the applicant's research and progress to date. The title and author list of the poster that will be presented at the consortium, which may or may not be presented at CVPR as well. The names, affiliations, and email addresses for 7 potential mentors, ranked from most to least preferred. Do not list your own advisor as a mentor. Identify researchers from industry or academia whose work is relevant to yours or whose feedback you think would be particularly useful to you. (CVPR Area Chairs could be a good source of potential mentors.) Submit applications here. Please ensure that all the requested information is provided; incomplete applications will be rejected. Review Process If all applications cannot be supported, selection will be based on the provided material, graduation date (i.e., opportunity to attend future doctoral consortiums), and supporting a diverse collection of students across research areas and institutions. Awards We encourage students of all nationalities and from all countries to apply to participate. Selected participants who are US citizens or permanent residents or currently attending an institution in the US will receive reimbursement for CVPR 2021 virtual registration. The awards will be in the form of a reimbursement check provided after the conference. Detailed instructions will be sent via email directly to participants. Poster Format Please refer to the general CVPR 2021 guidelines. The Doctoral Consortium will use the same format for virtual poster presentations. Important Dates Submission deadline: April 1st 2021 Notification of acceptance: May 15th 2020 Doctoral Consortium event: TBA Contact Tatiana Tommasi, Politecnico di Torino Jean-Francois Lalonde, Université Laval cvprdc2021@googlegroups.com"
