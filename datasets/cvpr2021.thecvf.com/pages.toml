title = "EXPO | CVPR 2021"
full_description = '''Expand Your Visibility at CVPR 2021 CVPR 2021 invites you to become a Sponsor on the CVPR 2021 Virtual Platform. CVPR 2021 brings together the international community focusing on computer vision. CVPR Virtual will provide the best way to engage with this unique community’s latest research and ideas. We expect more than 5,000 of the best and brightest to once again to engage at CVPR 2021. We encourage you to participate in this unique opportunity. LIVE Online Event June 19- 25, 2021 Expo: June 21-23, 2021 PLUS: On Demand Content Through August 25th, 2021 EDUCATE & ENGAGE Develop and deliver content to a vast audience with sessions and on-demand capabilities: ● Speaking opportunities ● Videos introducing featured products or services ● Informational resources ● Promotions and giveaways ● Post-event measurements and metrics CONNECT Develop community through vibrant connections that drive mutually beneficial outcomes: ● Live individual or group video chats ● Product search capabilities ● Off-hours live events ● Social media promotion ● FREE Giveaway promotion which allows you to collect leads while providing an opportunity to win prizes ● Job Post announcements on the CVPR website ● Receive a list of advance registrant opt-in email addresses ● Receive resumes and CVs MAXIMIZE YOUR BRAND Be recognized as a leader with the Computer Vision community: ● Social media promotion by CVPR 2021 ● Branding on the conference platform CVPR 2021 Key Details ● Conference Program June 19-25 ● Virtual Expo June 21-23 ● 100% Remote and Online ● Incentives Provided to Attendees for Visiting Sponsors ● Networking Opportunities The sponsors will be available to visit throughout the entire virtual event and after for attendees to review information and schedule a meeting with sponsor personnel. Conference attendees will have the opportunity to participate to review your presentations, review product and service information in your virtual space, and interact with sponsors. Reach Your Target Audience by Engaging the Following Assets CVPR 2021 Sponsor Packages Champion Sponsor $25,000 Spotlight Sponsor $15,000 Premium Sponsor $7,500 Sponsor $3,500 Priority Points 4 2 1 1 Registrations - Passport registrations for your key staff 4 2 1 1 Company Name Listed in Sponsor List x x x x Company Description - Promote your company with a description about your focus and how your company can benefit those that attend CVPR 2021. x x x x Like & Favorite Buttons - CVPR attendees can share their satisfaction and highlight favorite organizations x x x x Website Link x x x x Category Listing - Finding you will be easy as multiple product and category listings will be available for search x x x x Measurement and Metrics - Track how many people visited, favorited, who downloaded resources, and attended sponsor sessions. All the information will be available to sponsors by viewing their dashboard. Note: this data is only reported on attendees who have "opted in" to share their contact information. x x x x "Request Information” Button - Make it easy for the attendees to request more information. Just a click of this button on your page and you will be alerted to a request for more information. x x x x Giveaway Button - Everyone loves a giveaway! Offer giveaways, special promotions, have drawings or contests, etc. The “Giveaways” button on your listing will link to a webpage developed by your company. Get creative on giveaways and promotions to offer to CVPR 2021 attendees and get them to interact with your site. x x x x Resources - Share your company offerings! PDF Files and weblinks. Sponsors share your company offerings - upload up to 6 informative files or resources for attendees to review and add up to 6 weblinks to drive them to your most important sites. Showcase demos, case studies, webinars or any other creative videos of your choice to highlight your product or service offerings. x x x x Logo - Logo on the CVPR 2021 website under defined category level x x x x CVPR Scavenger Hunt - Attendees playing the scavenger hunt game will earn points by visiting an sponsor's and then answering a multiple choice question, supplied by the sponsor. They can win valuable prizes and will have a strong incentive to engage with the sponsor. Being part of the scavenger hunt is a great way to engage attendees and draw traffic. x x x x Text Chat - A shared discussion area where attendees and company representatives can have a group chat. Available to the 4 company representatives in the booth. x x x x Ability to Post Jobs on the CVPR Job Board x x x x Video File Upload (mp4 format, no larger than 200 mb) - Communicate a message with an introduction or welcome video. Limit 1 per company. Champion, Spotlight and Premium Sponsors. x x x Banner Graphic on Sponsors Listing - Logo included and design your own banner graphic on your sponsor listing to communicate your message. x x x Contact Information on Landing Page - Promote company representatives with up to 4 representatives from your organization. x x x Social Media Links - Sponsors may promote their major social media links on their page. x x x Post Announcements - Post announcements on the CVPR website and receive a list of advance registrants opt-in email addresses for one (1) use x x x Off Hours Events on the CVPR 2021 Virtual Platform - Do you have an awards program, talks with the creator of a product, social events or ideas you want to promote before or after the official hours of the conference. CVPR 2021 will help promote it for sponsors on the Virtual Conference site. x x x Video Chat - Use of the video function in real time. Engagement data reports will be available. Host private chats, join in on booth visitor chats, even chat with your fellow booth members. Video Chat function includes: Four representatives assigned for live video chat at one time, Screen sharing capability allows for presentations 1-1 or another set-up feature can be accommodated (up to 10 attendees) x x x One (1) - 30-minute Sponsor Session available on Virtual Platform - Pre-recorded and on-demand up to 30-minute session describing products and services. x x Opportunity to Purchase two (2) Additional 30-minute Sponsor Sessions for $5,000 for two sessions x x Special icon designating Sponsor level x x Post Announcements - Post announcements on the CVPR website and receive a list of advance registrants opt-in email addresses for up to three (3) uses x x Resumes and CV - Receive a list of advance registrant opt-in email addresses for up to three (3) uses that includes interest in jobs, resumes and CV. x Logo on CVPR 2021 Virtual Conference home page - Help drive attendees to your site by providing CVPR with your logo displayed in this highly visible location. x Website Home Page Right Side Tower Rotating Ad (320w X 1200h) - Ads (320w X 1200h) will rotate on the right side of the website home page. x Website Left Side Navigation Rotating Ad (280w x 280h) - Ads (280w x 280h) will rotate on the left side of the page. x See examples of the sample layout, reports, specifications of the platform review the CVPR 2021 Sponsor FAQ Submit Your Application for CVPR Sponsorship. Sponsorship sales close June 10! For sponsorship information opportunities contact: CVPR 2021 Exhibition Management Hall-Erickson, Inc. Phone: 630.929.7972 Email: CVPR@heiexpo.com'''
