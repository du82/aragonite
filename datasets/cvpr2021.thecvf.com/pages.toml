["https://cvpr2021.thecvf.com/node/27"]
title = "Code of Conduct | CVPR 2021"
full_description = "CODE OF CONDUCT CVPR 2021 is committed to providing an atmosphere that encourages the free expression and exchange of ideas. It is the policy of CVPR 2021 that all participants of conference activities (workshops, tutorials, exhibitions, poster sessions, etc ) will enjoy a welcoming environment free from unlawful discrimination, harassment, and retaliation. Harassment will not be tolerated in any form, including but not limited to harassment based on gender, gender identity and expression, sexual orientation, disability, physical appearance, race, age, religion or any other status protected by laws in which the conference or program is being held. Harassment includes the use of abusive, offensive or degrading language, intimidation, stalking, harassing photography or recording, inappropriate physical contact, sexual imagery and unwelcome sexual advances. Any report of harassment at one of our activities will be addressed immediately. Participants asked to stop any harassing behavior are expected to comply immediately. Exhibitors should not use sexualized images, activities, or other material in their booths and must refrain from the use of sexualized clothing/uniforms/costumes, or otherwise creating a sexualized environment. Speakers should not use sexual language or images without scientific purpose, or any language or images that would constitute harassment as defined above in their talks. Violations should be reported to the conference ombud (cvpr-ombud@googlegroups.com). All reports will be treated confidentially. The ombud will investigate and prepare a brief statement of facts, a conclusion (proven/not proven) using a preponderance of the evidence standard, and a recommended sanction if a violation is proven. The conference standards committee will vote to either adopt or not adopt this recommendation and may modify it. The decision of the committee is final. Sanctions may include, but are not limited to, exclusion from one or more conference events, exclusion from the entire conference, removal of material from the online record of the conference, referral to the violator’s university or employer, and referral to law enforcement. In no case will registration fees or expenses be refunded by the conference. All CVPR 2021 attendees and exhibitors are expected to comply with these standards of behavior. IEEE Computer Society Open Conference Statement Equity, Diversity, and Inclusion are central to the goals of the IEEE Computer Society and all of its conferences. Equity at its heart is about removing barriers, biases, and obstacles that impede equal access and opportunity to succeed. Diversity is fundamentally about valuing human differences and recognizing diverse talents. Inclusion is the active engagement of Diversity and Equity. A goal of the IEEE Computer Society is to foster an environment in which all individuals are entitled to participate in any IEEE Computer Society activity free of discrimination. For this reason, the IEEE Computer Society is firmly committed to team compositions in all sponsored activities, including but not limited to, technical committees, steering committees, conference organizations, standards committees, and ad hoc committees that display Equity, Diversity, and Inclusion. IEEE Computer Society meetings, conferences and workshops must provide a welcoming, open and safe environment, that embraces the value of every person, regardless of race, color, sex, sexual orientation, gender identity or expression, age, marital status, religion, national origin, ancestry, or disability. All individuals are entitled to participate in any IEEE Computer Society activity free of discrimination, including harassment based on any of the above factors. IEEE Event Conduct and Safety Statement IEEE believes that science, technology, and engineering are fundamental human activities, for which openness, international collaboration, and the free flow of talent and ideas are essential. Its meetings, conferences, and other events seek to enable engaging, thought provoking conversations that support IEEE’s core mission of advancing technology for humanity. Accordingly, IEEE is committed to providing a safe, productive, and welcoming environment to all participants, including staff and vendors, at IEEE-related events. IEEE has no tolerance for discrimination, harassment, or bullying in any form at IEEE-related events. All participants have the right to pursue shared interests without harassment or discrimination in an environment that supports diversity and inclusion. Participants are expected to adhere to these principles and respect the rights of others. IEEE seeks to provide a secure environment at its events. Participants should report any behavior inconsistent with the principles outlined here, to on site staff, security or venue personnel, or to eventconduct@ieee.org"
year_published = 2025
clearnet = "https://cvpr2021.thecvf.com/node/27"
