["https://cwiki.apache.org"]
title = "Dashboard - Apache Software Foundation"
full_description = "This Confluence site is maintained by the ASF community on behalf of the various Project PMCs. Each Confluence Space is managed by the respective Project community. Some Spaces may be open to contributions to all Confluence users. To register, follow the Log In link at the top right of any page. Confluence users can watch a Space to to receive notifications any changes, or receive a daily summary of all changes to the site. Please be aware that if mail to the e-mail address associated with a Confluence account starts bouncing, the Infrastructure team will delete the account if at all possible. If the account can't be deleted, it will be disabled. PRIVACY NOTICE: ASF Confluence is a publicly viewable wiki. Activity on most pages and spaces, will be publicly visible. Email addresses are not visible to other users unless you chose your email address as your username Powered by a free Atlassian Confluence Open Source Project License granted to Apache Software Foundation. Evaluate Confluence today."
