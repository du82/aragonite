["https://cyanide-studio.com/fr/le-studio"]
title = "Le studio | Cyanide Studio"
full_description = "Cyanide est un studio de développement de jeux vidéo basé à Nanterre, en France, nous développons des jeux pour les passionnés, par des passionnés. Créé en 2000 par 7 anciens employés d’Ubisoft, le studio s’est développé autour de licences fortes comme Pro Cycling Manager ou Blood Bowl. Fort de 20 ans d’expérience et plus de 50 titres à notre actif, notre équipe se compose à la fois de vétérans de l’industrie et de talents en devenir. Le jeu est au centre de leurs métiers, les Cyanidiens sont indubitablement des joueurs dans l’âme, et les jeux du Studio en sont le reflet fidèle. Cyanide s’est vu confier le développement du jeu Werewolf : the Apocalypse – Earthblood, une adaptation du jeu de rôle du même nom. Cyanide a développé Call of Cthulhu, inspiré par Howard Phillips Lovecraft. Le jeu est sorti juste avant Halloween en Octobre 2018. Cyanide sort Styx : Master of Shadows. Un an plus tard, une suite est annoncée : Styx : Shards of Darkness, sorti en 2017. Cyanide commence à auto-éditer ses propres jeux, comme Aarklash Legacy, à partir d’une IP acquise par le studio en 2010. Cyanide s’est vu confier le développement du jeu Werewolf : the Apocalypse – Earthblood, une adaptation du jeu de rôle du même nom. Cyanide a développé Call of Cthulhu, inspiré par Howard Phillips Lovecraft. Le jeu est sorti juste avant Halloween en Octobre 2018. Cyanide sort Styx : Master of Shadows. Un an plus tard, une suite est annoncée : Styx : Shards of Darkness, sorti en 2017. Cyanide commence à auto-éditer ses propres jeux, comme Aarklash Legacy, à partir d’une IP acquise par le studio en 2010. Inscrivez-vous à notre newsletter et soyez les premiers à être informés de toute notre actualité !"
