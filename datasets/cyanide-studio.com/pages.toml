["https://cyanide-studio.com/fr/jeux/index-egalite-femmes-hommes-chez-cyanide"]
title = "Index égalité femmes/hommes chez Cyanide | Cyanide Studio"
full_description = "La loi n° 2018-771 du 5 septembre 2018 et le décret n°2019-15 du 8 janvier 2019 mettent en place un dispositif de mesure des écarts de rémunérations et de d’évolution entre les femmes et les hommes dans les entreprises de plus de 50 salariés à travers une note sur 100. Les sociétés françaises doivent procéder au calcul et à la publication de leur Index de l’égalité femmes-hommes sur leur site internet, avant le 01 mars 2024*. CYANIDE obtient la note de 87/100, un score qui reflète l’engagement pris par CYANIDE pour promouvoir l’égalité femmes-hommes au sein du studio. CYANIDE veillera à toujours garantir l’égalité des droits et l’égalité des chances auprès de ses équipes. Chaque salarié, et candidat, recevra ainsi une égalité de traitement, sans discrimination de genre. La mixité professionnelle du studio est une force, tant sociale qu’économique et à ce titre elle fait partie intégrante de ses axes de développement et d’amélioration. *Retrouvez une notice explicative éditée par le ministère du Travail au sujet de l’Index d’égalité entre les femmes et les hommes en cliquant ici Inscrivez-vous à notre newsletter et soyez les premiers à être informés de toute notre actualité !"
