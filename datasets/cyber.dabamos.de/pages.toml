["https://cyber.dabamos.de/programming/fortran/oregon"]
title = "OREGON 77 – The Oregon Trail in FORTRAN 77"
description = "The Oregon Trail in FORTRAN 77"
full_description = "A source port of the 1978 version of The Oregon Trail to FORTRAN 77, originally created in HP time-shared BASIC by Don Rawitsch, Bill Heinemann, and Paul Dillenberger: This program simulates a trip over the Oregon trail from Independence, Missouri to Oregon City, Oregon in 1847. Your family of five will cover the 2040 mile Oregon trail in 5 to 6 months -- if you make it alive. The BASIC source code was first published in Creative Computing magazine in 1978. Ports of the game exist for various platforms. For instance, Westward Ho! is an adaption by David H. Ahl for his book BASIC Computer Adventures that was also released for MS-DOS. The remake in FORTRAN tries to stay close to the gameplay of the BASIC version but some changes to input handling and output formatting had to be made. The Oregon Trail as a QuickWin application on Microsoft Windows 2000 Professional (Compaq Visual Fortran 6.6c) Binaries of the game are provided for DOS and Win32. On all other platforms, please compile the program from source. The executables have been built with Open Watcom FORTRAN 77. Other compiles may produce smaller binaries (due to the run-time library). You can simply execute the included Makefile to compile the game, in case you have the FORTRAN-to-C transcompiler f2c installed: For a more “realistic” gaming experience, you can simulate a 300 baud terminal connection with a tool like trickle: Due to the limitations of the ANSI FORTRAN 77 language standard, no instrinsic timing function is available. Some FORTRAN compilers feature extensions to access CPU time or current system time. You may need to link a wrapper function TIME() that returns a UNIX timestamp or any other relative time value measured in seconds (tab. 1). Depending on the compiler, the file endings of the source files may have to be renamed from .f to .for manually. Absoft Pro Fortran | Compaq Visual Fortran 6.6 | Cray CF90 | Digital Visual Fortran 5.0 | F18/Flang | f2c | Flang | G95 | GNU Fortran | GNU g77 | IBM Professional FORTRAN | Intel Fortran Compiler | Intel oneAPI Fortran | Lahey Fortran 90 | Lahey F77L3-EM/32 | Lahey Personal FORTRAN 77 | Microsoft FORTRAN 4.1 | Microsoft FORTRAN 5.1 | Microsoft FORTRAN PowerStation 1.0 | Microsoft FORTRAN PowerStation 32 1.0 | Microsoft Fortran PowerStation 4.0 | Microway NDP FORTRAN-486 | Open Watcom FORTRAN 77 | Ryan-McFarland RM/FORTRAN 2.43 | Salford FTN77 | Silverfrost FTN95 | Watcom Fortran 11.0 | Watcom WATFOR-77"
