full_description = "Several first-person shooter games are available through the FreeBSD ports collection. One of them is Return to Castle Wolfenstein (RtCW), the successor of Wolfenstein 3D. The port is based on the Linux version and requires the Linux binary compatibility layer for FreeBSD to run. Instead of the Linux port, we can compile a native FreeBSD client for RtCW. The source code is hosted on Gitorious (mirror). Clone the repository with: The game binaries are written to the directory build/ afterwards. The RtCW game data has to be copied to the directory main/. Unfortunately, the game data can’t be taken from the CD directly. You either have to use Wine or VirtualBox to install RtCW and then copy the following files to main/: Like other games with id Tech engine, RtCW can be played in wide screen mode by altering the aspect ratio of the screen in the configuration file. To run the game in 1920×1200, change the following parameters in ~/.wolf/main/wolfconfig.cfg: The field of view variable cg_fov should be set to 106.27 for 16:9 and 100.39 for 16:10. If the game crashes at some scenes, for instance, at the ropeway sequence, the aspect ratio can be set to 4:3 temporary as a workaround."
