title = "FreeBSD on Lenovo ThinkPad X270 | The Cyber Vanguard"
description = "Running FreeBSD on Lenovo ThinkPad X270"
full_description = "Most features of the ThinkPad X270 laptop are supported by FreeBSD 12. You can find some hints regarding the system configuration here. For further information, see the FreeBSD wiki. You may want to disable the Touchpad in BIOS in order to use the TrackPoint of the X270. Install x11-servers/xorg-server with udev support and x11-drivers/xf86-input-libinput. For evdev support, add: For power management, you can either use powerd(8) or sysutils/powerdxx. To enable powerd, edit /etc/rc.conf and add: This should perform a suspend to RAM. Press the power button to resume. Install security/doas to suspend with non-root privileges. Edit /usr/local/etc/doas.conf and add: You can now suspend as a user by running zzz. Execute zzz from your Window Manager by calling tcsh -c zzz. Audio output is provided by the snd_hda(4) driver. Load the kernel module at boot time by editing /boot/loader.conf and adding: Raising and lowering the volume using the volume keys will work now in applications such as VLC. You have to configure your Window Manager to map keypress events. For FVWM, add to ~/.fvwm/config: You can connect an external screen through HDMI or USB-C (DisplayPort). Use x11/xrandr to change the video output and set display resolutions. The default output is eDP-1. List all outputs with: You can use the Fn keys to increase/decrease the screen brightness by loading acpi_ibm(4). Add to /boot/loader.conf: You should be connected now. For more information on Wi-Fi networks, see the FreeBSD online handbook. Install the (experimental) kernel module sysutils/rtsx-kmod that has been ported from OpenBSD, and supports the Realtek RTS522A:"
