description = "Programming in PHP"
full_description = "Even if nobody likes PHP1 (especially PHP 4), sometimes it may be a necessary evil imposed by the circumstances to do some scripting in this awful invention of the less noble parts of mankind. Having said that, the source code of a file-based “content management system” (ha ha) is listed below. A very simple Content Management System (CMS) written in PHP 4. Not very useful at a time when you can just use XMLHttpRequest on client-side. Anyways, you may want to save it as index.php along a directory content/ that stores the pages in HTML format and a directory template/ containing the template file: The template is parsed and the string [% content %] will be replaced with the contents of the accessed page. Open http://www.example.com/index.php?page=main to show page main.html."
