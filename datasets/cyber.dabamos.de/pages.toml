title = "Using USB Tethering on FreeBSD with Android | The Cyber Vanguard"
description = "Using USB Tethering on FreeBSD with Android"
full_description = "The Intel Centrino Advanced-N 6205 WiFi chipset can be found in the Lenovo X230 series and other laptops. The iwn(4) driver covers the chipset on FreeBSD. Connecting to a WiFi network should not be a problem but unfortunately, the performance, at least on older FreeBSD versions, is rather poor, especially when using the 5 GHz channels. The signal may be improved when IEEE 802.11n is disabled: Otherwise, an Android-based mobile phone can act as a gateway to a WiFi network, by using USB tethering. The urndis(4) driver has to be loaded for Android-based smartphones: Connect the phone to the Laptop using a (real) USB cable. Make sure that WiFi and USB tethering are enabled on the phone. A new network interface ue0 will be created once the device is connected:"
