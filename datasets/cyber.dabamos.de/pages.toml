title = "Snoopy Calendar | The Cyber Vanguard"
description = "Snoopy Calendar in Fortran"
full_description = "An updated version of the famous Snoopy Calendar from the 1960s, originally written in Fortran IV, can be build with modern compilers. You will need the source files snpcal.for and snppic.for as well as the data file SNPCAL.DAT. Build the application with Flang or any other Fortran compiler: Just execute snpcal, and the calendar of 1969 will then be written to SNPCAL.TXT. You can generate an up-to-date calendar by replacing the years 1969 and 1970 in SNPCAL.DAT."
