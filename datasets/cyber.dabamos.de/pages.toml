["https://cyber.dabamos.de/unix/x11"]
title = "Cool, but obscure X11 tools"
description = "Cool, but obscure X11 tools."
full_description = "A small collection of tools for the X Window System, some more and some less obscure. For cool terminal tools, see Kristof Kovacs’ Cool, but obscure Unix tools. All applications have been tested on FreeBSD but should run on other Unix-like operating systems as well. A roguelike game derived from Moria, based loosely on the books of J. R. R. Tolkien. The ultimate aim of the game is to advance in skill and strength, collecting better and more powerful magical items until you are ready to face the Master of the dungeon: Morgoth himself! Start the X11 mode with angband -mx11. Prints the resources seen by an application. It can be used to determine which resources a particular program will load. Battalion is a 3D game from 1994, originally written for the Silicon Graphics Indy UNIX workstation. The player controls a monster to blow up a city. The author has dedicated a website to the game. Depending on the perspective, the controls are a little awkward. You may want to change the camera with key 1, 2, 3, or 4. Use the mouse to rotate and to move forward/backward. The arrow keys only work if the mouse cursor is placed in the centre of the screen. Shoot with the left control key or the left mouse button, and tilt the head with A and Z to target helicopters and jets. The camera can be rotated with I, J, K, and L. Alter the rendering details with D. Press G to grab the mouse cursor and P to pause the game. I made a quick & dirty FreeBSD port based on the Linux version (no sound). Build and run Battalion with: A 3-D spatial user interface for Internet Gopher, first released in 1995. Explore the Gopher space in 3-D! Pass host and port via command-line arguments, like, gophervr <host> <port>. Available on GitHub. Improved version of the vi editor. The graphical front-end can be compiled either against X11, Motif, Xaw, or GTK+ 2/3. Emulator of the HP-15C programmable calculator, written in Tcl/Tk. The source-code is available on the official website. Motif-based front-end to the Unix diff command. The appearance of mgdiff is based upon a program called gdiff, which runs only on Silicon Graphics workstations and for which source code is not provided."
