full_description = "QuakeSpasm is an SDL port of the Quake I engine. Just download the souce code from SourceForge and unpack the archive file quakespasm-0.93.0.tgz. Inside the quakspasm-0.93.0/Quake/ directory, run: In order to play Quake, you'll need the game files from the CD-ROM. Copy the directory ID1 to quakspasm-0.93.0/Quake/ and rename it and its contents to lower case (for instance, ID1/PAK0.PAK to id1/pak0.pak). After a successful build you can delete all source files. Just execute ./quakespasm to start the game. For a better gaming experience, you may want to change some settings. Create an empty file in the id1 directory and name it autoexec.cfg. Add the following lines: QuakeSpasm supports music playback. Rip the music from the Quake CD-ROM as OGG or MP3, create a new directory music inside id1 and copy all music files into it. The files should be named after the CD tracks, for instance, track02.ogg, track03.ogg, and so on. Instead of ripping the music by yourself, you can use pre-ripped tracks of the original soundtrack. OGG rips can be found online, just use the search engine of your choice."
