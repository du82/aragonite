["https://cyberduck.io/openstack"]
title = "OpenStack Swift"
full_description = "All major authentication methods of OpenStack Identity Service with username, password, access keys and tenants are supported. Multiple Region support listing containers from all available regions. Large object uploads Resumable dynamic segmented part uploads for files larger than 5GB. Large uploads can be resumed when interrupted and make use of multiple concurrent connections for faster transfer rates. Temporary URLs A private object stored in OpenStack Swift can be made publicly available for a limited time using a signed URL. The signed URL can be used by anyone to download the object, yet it includes a date and time after which the URL will no longer work. Copy the signed URL from Edit → Copy URL→ Signed URL. CDN You can CDN enable the container using File → Info → Distribution (CDN) if supported by the provider. We do not endorse any particular provider. This list is in not exhaustive and in no particular order. Download and double click the connection profile file (.cyberduckprofile) to open and register the profile with Cyberduck and Mountain Duck or alternatively enable in Preferences → Profiles. Connection profiles are shared between Cyberduck, Cyberduck CLI and Mountain Duck. Manage your Rackspace Cloud Files storage including the configuration of Akamai content delivery network (CDN). ​Oracle Storage Cloud Service is a secure, scalable, reliable, and on-demand public cloud storage solution. Businesses can access additional storage capacity in minutes with zero hardware investment. The Oracle Storage Cloud Service can be accessed from anywhere, at anytime, and from any device connected to the Internet. Memset Memstore is an exciting new long term storage solution. Based on the OpenStack Object Storage platform, combined with our own impressive infrastructure, Memstore™ is flexible, scalable, easy to use and secure. We take care of the details from disk space to backups; you simply drag and drop your files and leave everything else to us. You only pay for what you use, whether that be 1GB or 1TB, and there are no license fees or hidden costs. Data replication means that your data is unaffected by hardware failures and you can sleep soundly knowing your data is safe with us."
