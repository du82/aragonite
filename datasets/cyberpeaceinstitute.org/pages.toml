["https://cyberpeaceinstitute.org/call-for-government"]
title = "Call to Governments | CyberPeace Institute"
description = "We call to governments to take immediate and decisive action to stop cyberattacks on hospitals, healthcare and medical research facilities"
full_description = "We call on the world’s governments to take immediate and decisive action to stop all cyberattacks on hospitals, healthcare and medical research facilities, as well as on medical personnel and international public health organizations. To this end, governments should work together, including at the United Nations, to reaffirm and recommit to international rules that prohibit such actions. Over the past weeks, we have witnessed attacks that have targeted medical facilities and organizations on the frontlines of the response to the COVID-19 pandemic. These actions have endangered human lives by impairing the ability of these critical institutions to function, slowing down the distribution of essential supplies and information, and disrupting the delivery of care to patients. With hundreds of thousands of people already perished and millions infected around the world, medical care is more important than ever. This will not be the last health crisis. For now and for the future, governments should assert in unequivocal terms: cyber operations against healthcare facilities are unlawful and unacceptable. We don’t tolerate attacks on health infrastructure in the physical world, and we must not tolerate such attacks in cyberspace – whether in times of peace or in times of conflict. We stand with the International Committee of the Red Cross in support of its call to protect medical services and medical facilities against cyberattacks of any kind. We call on governments to work together and to join forces with civil society and the private sector to ensure that medical facilities are respected and protected, and to hold perpetrators accountable. Above all, governments should take action and stop cyberattacks on hospitals and medical facilities. Mohamed ElBaradei, Former Director General of the International Atomic Energy Agency (Nobel Peace Prize Laureate) Beatrice Fihn, Executive Director of the International Campaign to Abolish Nuclear Weapons (Nobel Peace Prize Laureate)"
year_published = 2025
year_updated = 2023
