["https://cyberpeaceinstitute.org/cybersecure-the-hague"]
title = "CyberSecure The Hague: NGO Support Program | CyberPeace Institute"
description = "The CyberSecure The Hague: NGO Support Program has been referenced in national and international media, recognising the immediate need to protect vulnerable communities and the organisations that service them in the city of The Hague, from ever-growing cyberthreats."
full_description = "To protect the rich NGO ecosystem in the City of The Hague, we launched together with our partners “The Cyber Secure The Hague: NGO Support Program” at the ONE conference that took place in The Hague on 3 and 4 October 2023. This non-profit consortium consists of The Hague Humanity Hub (HHH), the Dutch Institute for Vulnerability Disclosure (DIVD) and CSIRT.global and the CyberPeace Institute. This project, offering free cybersecurity support to almost 200 humanitarian, development and peace NGOs in The Hague, is co-funded by the City of The Hague. The consortium aims to build​ up the​ cyber capacity of vulnerable communities by conducting ​cyber​security assessments​ and providing free resources, tools, support, automated vulnerability scan solutions, targeted training, digitalization and cyber hygiene best practices​ customised per each organisation’s needs​. Ultimately, the project will strengthen the NGO ecosystem in The Hague and allow NGOs to have sustainable international impact through increased cybersecurity. From now on, all humanitarian NGOs in The Hague can join this programme for free. The Hague Humanity Hub was founded in 2018 and is a not-for-profit foundation in The Hague that supports and strengthens the ecosystem for a more peaceful and just world. The Hague Humanity Hub facilitates connections and innovation by offering the necessary ingredients for chance encounters, new alliances, inspirational collaborations, and the exchange of knowledge Dutch Institute for Vulnerability Disclosure (DIVD) is a foundation based in The Hague that was established in 2019 with the aim of making the digital world safer by conducting research on vulnerabilities in information systems, reporting found vulnerabilities to stakeholders and offering assistance in resolving them. DIVD works with volunteers, who have committed to the DIVD code of conduct. CSIRT.global is a global, volunteer-led, not-for-profit organisation, aiming to make the world more secure by going after vulnerabilities no-one else cares for. CSIRT.global is a sister organisation to the DIVD. In 2022, international CSIRT activities of the DIVD were moved to CSIRT.global, as a first step to build an international network of like-minded people."
year_published = 2025
year_updated = 2024
