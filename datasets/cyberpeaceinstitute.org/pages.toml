["https://cyberpeaceinstitute.org/cyberpeace-academy"]
title = "CyberPeace Academy | CyberPeace Institute"
description = "This training track has the objective to provide pre and post incident awareness as well as to increase cyber resilience. Further, we will assess your cyber hygiene practices and increase general awareness for cybersecurity.   (1h30)"
full_description = "If you are complete beginners or already on your way of becoming an expert, we offer a variety of trainings from more general to specific trainings, provided by our experts at the CyberPeace Institute – you will find the perfect training for you and your organisation on this page. This training track has the objective to provide pre and post incident awareness as well as to increase cyber resilience. Further, we will assess your cyber hygiene practices and increase general awareness for cybersecurity. (1h30) This Board Training Session focuses on Strategic Cyber Risks Awareness and aims to improve the understanding of Cybersecurity and its strategic imperative, cybersecurity best practices for CSOs, unique position of the Board to fostering cybersecurity. (1h30) This training track has the objective to support understanding of current international treaties and norms related to the use of ICTs and responsible behaviour in cyberspace. The aim is to strengthen participation in international fora. (4h) This training track has the objective to increase cyber resilience for Senior Management and Boards. Further, we will assess the cyber hygiene practices in your organisations and increase your general awareness for cybersecurity. (1h) This training offers Senior Management and Boards a deep dive into the evolution of AI and its dual role as a cybersecurity threat and a disruptor bringing operational opportunities and risks. The training further equips the audience with the knowledge and tools to navigate the complexities of responsible use of AI strategy creation and implementation inside an organisation. (1h30) In our cybersecurity table-top exercises, participants have the opportunity to engage in simulated scenarios designed to test and enhance their organization's response capabilities to various cyber threats. Through interactive discussions and hypothetical scenarios, participants navigate potential cyber incidents, assess response strategies, and identify areas for improvement in their cybersecurity strategy. (4h)"
