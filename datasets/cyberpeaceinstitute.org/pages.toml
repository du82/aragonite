["https://cyberpeaceinstitute.org/ai-for-cyberpeace"]
title = "AI for Cyberpeace | CyberPeace Institute"
description = "AI AI as a tool for cyberpeace Addressing the Risk of Autonomous Cyberattacks Using Ai to Increase Digital Resilience Engaging the AI Community Addressing the Risk of Autonomous Cyberattacks We […]"
full_description = "We investigate how AI acts as a double-edged sword in cyberspace: it can be a tool for defenders or a weapon for threat actors. We document how AI disrupts the cyber threat landscape: on the one hand, augmenting criminal capability, on the other hand, creating the unacceptable risk of autonomous cyberattacks. AI must be an equitable opportunity for underserved organisations, globally. The CyberPeace Institute supports public interest organisations (e.g small critical infrastructure) to leverage AI for digital resilience. We engage actively with a community of like-minded organisations and individuals, dedicated to help investigate, tackle and prevent harm from the malicious use of AI. We are engaging with industry, civil society, and academics to ensure that AI solutions benefit human rights defenders and frontline workers in their efforts to protect the most vulnerable. The following list includes examples of noteworthy AI regulation and governance efforts we are monitoring. You can find more in-depth analyses of cyber-related policies in our CyberPeace Watch programme. The disruption of AI introduces new threats to organizations, both external and internal. As part of our mission to protect the most vulnerable in cyberspace, we offer comprehensive capacity building focused on the intersection of AI and cybersecurity for public interest organisations and foundation boards, management, and staff. This training empowers organisations with vital tools to enhance and safeguard their missions. What is AI? How does it work? How is it disrupting digital resilience and cybersecurity? How is it impacting the work of public interest organisations? What AI-powered tools are available? How can these be implemented most effectively into an organisation? What are the risks and challenges of AI? How can organisations implement AI responsibly? How to create a responsible AI strategy and operational guidelines? In 2024, around 80 countries will be holding political elections, with social media platforms being the main communication channel to target voters."
year_published = 2024
year_updated = 2024
