["https://cyberpeaceinstitute.org/cyberpeace-watch"]
title = "CyberPeace Watch | CyberPeace Institute"
description = "The malicious use of Information and Communication Technologies is escalating in sophistication, frequency and scale of attack, affecting people in countries throughout the world. Cyber tools are being used as weapons and methods of warfare; harmful content and disinformation campaigns are proliferating online, and essential critical infrastructure is being targeted on a regular basis. There is, however, hope that this could change as the global drive for peace and security in cyberspace progresses. But how to achieve cyber peace if we cannot measure the current situation of threats and harm, the effectiveness of our responses , and the next steps needed?"
full_description = "The malicious use of Information and Communication Technologies is escalating in sophistication, frequency and scale of attack, affecting people in countries throughout the world. Cyber tools are being used as weapons and methods of warfare; harmful content and disinformation campaigns are proliferating online, and essential critical infrastructure is being targeted on a regular basis. There is, however, hope that this could change as the global drive for peace and security in cyberspace progresses. But how to achieve cyber peace if we cannot measure the current situation of threats and harm, the effectiveness of our responses , and the next steps needed? Cyberpeace is possible when the world's digital ecosystems promote human security, dignity, and equity. Achieving peace in cyberspace is significantly hampered by the fact that to date there is no mechanism to track the status of cyber peace, which means that a baseline of understanding and shared knowledge is required to achieve this goal. With the CyberPeace Watch, an interactive online platform that provides a publicly accessible baseline of data to understand and share knowledge about cyberattacks, including threat analysis, societal harm, applicable laws and norms, and related paths for accountability, the CyberPeace Institute seeks to fill this gap. The platform's goal is to assess cyberpeace based on evidence of the societal harm caused by cyberattacks and the actions taken by states and other relevant actors to strengthen responsible behaviour in cyberspace. Documents cyberattacks and operations, providing information on the what, when, where, how, and who of incidents impacting society and vulnerable communities. Collates information related to various types of impact including physical, psychological, digital, informational enabling an assessment of the harm caused by disruptive and malicious cyber incidents. Tracks and analyzes conduct in cyberspace in order to provide information on measures for responsible behaviour and accountability, with a focus on state actors and companies."
