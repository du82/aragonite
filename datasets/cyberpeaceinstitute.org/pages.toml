["https://cyberpeaceinstitute.org/anticipation-and-foresight"]
title = "Anticipation And Foresight | CyberPeace Institute"
description = "We monitor the impact of emerging and disruptive technologies on cybersecurity and help NGOs navigate technological disruptions. Our anticipation and foresight efforts focus on researching and analysing the impact of emerging and disruptive technologies on the resilience of vulnerable communities in cyberspace. We monitor these disruptions by tracking technological advances, changes in digital behaviour, shifts in the information landscape, and the enactment of digital regulations in a volatile geopolitical context. We are leading by example in addressing the disruption caused by artificial intelligence starting with our own organization and by publicly sharing our journey toward responsible use of AI. We also support NGOs seeking to navigate the operational disruptions caused by AI and other emerging technologies inside their organizations."
full_description = "We monitor the impact of emerging and disruptive technologies on cybersecurity and help NGOs navigate technological disruptions. Our anticipation and foresight efforts focus on researching and analysing the impact of emerging and disruptive technologies on the resilience of vulnerable communities in cyberspace. We monitor these disruptions by tracking technological advances, changes in digital behaviour, shifts in the information landscape, and the enactment of digital regulations in a volatile geopolitical context. We are leading by example in addressing the disruption caused by artificial intelligence starting with our own organization and by publicly sharing our journey toward responsible use of AI. We also support NGOs seeking to navigate the operational disruptions caused by AI and other emerging technologies inside their organizations. Artificial intelligence (AI) has undoubtedly garnered the most worldwide attention in recent months. AI refers to computer systems capable of performing tasks typically requiring some form of intelligence. As these technologies are being increasingly adopted and employed by civil society organisations in their daily operations, we work to anticipate the effects of AI on cyberpeace. Sophisticated AI technology poses greater challenges to upholding a safe cyberspace, offering malicious actors greater capabilities for cyberattacks. However, just as AI can enhance the potential for cyberattacks, it can similarly provide new capabilities for defence. Quantum Computing (QC), both promises extraordinary opportunities to accelerate change and open new frontiers, whilst simultaneously posing significant threats to privacy and data protection through encryption. Quantum Computing makes use of the quantum states of subatomic particles to solve problems that are too complicated for traditional, binary, computers. One of the main threats to cybersecurity is the speed at which QC can decrypt codes and data. Civil society sectors collect, manage and process large volumes of data electronically, including highly sensitive and personal information, often related to vulnerable individuals. QC poses a danger to this encrypted, and sensitve data. Post-quantum or quantum resistant cryptography will therefore play a crucial role in solving data privacy and security problems by providing stronger encryption algorithms that are resistant to QC."
