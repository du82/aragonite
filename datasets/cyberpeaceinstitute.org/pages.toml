full_description = "Sonia KarkareHUMANITARIAN EXECUTIVE & ADJUNCT PROFESSOR AT KENT UNIVERSITY, AMBASSADOR CRAWFORD COLLEGE OF BUSINESS AND ENTREPRENEURSHIP The Advisory Board is selected and appointed by the Executive Board, based on the advice of the CEO. It has an international composition with a diversity of expertise and insights on cybersecurity, human rights, peace and security. The CyberPeace Institute’s staff and experts generate their own work and ideas consistent with the Institute’s mission. The Institute maintains strict intellectual independence for all its projects, events, and publications. The Institute maintains independent control of the content and conclusions of any products resulting from sponsored projects."
