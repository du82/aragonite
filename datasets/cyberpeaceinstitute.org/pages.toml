["https://cyberpeaceinstitute.org/cyber-transparency"]
title = "Cyber Transparency | CyberPeace Institute"
description = "Evidence-based understanding of the threat landscape is essential for the implementation of responsible State behavior in cyberspace. Gaps in understanding lead to uncertainties, general trust between actors, and undermine accountability. […]"
full_description = "Evidence-based understanding of the threat landscape is essential for the implementation of responsible State behavior in cyberspace. Gaps in understanding lead to uncertainties, general trust between actors, and undermine accountability. It is difficult to build confidence when actors cannot collectively recognize the same challenges in a selected domain. This is particularly relevant in the cyber domain, where the threats and their connected risks and impacts are more difficult to determine, study, and understand. Thus, measures supporting transparency are important. The CyberPeace Institute supports and enhances measures to increase transparency by publishing its independent data platforms and analyses of different aspects of the cyber threat landscape. The aim is to enable a broader understanding of threat actors, the impact and harms of cyber threats, and accountability efforts, including sanctioning of actors for breaches of laws and norms in cyberspace. Attacks on healthcare target highly sensitive health data, and hamper delivery and access to essential services for people with potentially devastating consequences. We document threats to the healthcare sector from disruptive cyberattacks. By doing so we are able to identify critical vulnerabilities at a technical, operational and policy level to better protect the sector and the people it serves from harm. Cyberattacks and operations during an armed conflict pose real threats to civilians, critical infrastructure and the functioning of society whilst disrupting the safe, secure and trusted use of technology. We track cyber incidents in the context of the conflict between Ukraine and the Russian Federation and provide insights on the latest threats and trends, and applicable international law and norms. ​​Non- governmental organizations (NGOs) provide vital support and services to people in all countries. NGOs leverage technologies to carry out their activities and are entrusted to hold sensitive data on vulnerable people. This has increased their digital risk. They are targeted by various threat actors seeking to disrupt their work, compromise data, and tarnish their reputation."
year_published = 2025
year_updated = 2024
