["https://cyberpeaceinstitute.org/advocating-for-cyberpeace"]
title = "INTERNATIONAL ENGAGEMENT and OUTREACH | CyberPeace Institute"
description = "We are advocating for cyberpeace based on evidence of the harm caused by cyberattacks, and for the respect of laws and norms."
full_description = "Based on our ambition for an open, free, peaceful and secure cyberspace, we actively engage with States, non-state actors, civil society, academia and other stakeholders to advocate for: We produce actionable insights and recommendations based on our independent data-driven analyses, research and investigations of the cyber threat landscape and harms to people and society, as well as our analysis of laws, rights and norms. Our legal and policy contributions are shared with States, United Nations fora, European Union and other International and regional organizations, as well as civil society actors to raise awareness of the harms of cyberattacks, the impact on vulnerable communities, and action that can be taken to strengthen respect for, application and development of law, rights and norms. Report of Expert Meeting on the development of a Harms Methodology, a standardized methodology to measure the harms and impacts of cyberattacks and incidents on people, society and the environment Achieving peace in cyberspace is significantly hampered by the lack of knowledge sharing on the analysis of threats, harms, laws and norms, and related paths to accountability. This Platform aims to bridge this gap and provide a mechanism to track the status of cyber peace. Report on Cyber Transparency Value Chain: From Awareness and Understanding to Attribution, Monitoring and Sanctioning, Open Source Monitors and Observatories, jointly produced by the Hague Centre for Strategic Studies and the CyberPeace Institute. Our legal and policy experts actively participate, as a civil society organisation, in Working Groups and Coalitions advocating for a human centric approach and human rights in digital and cyberspace. The laws and norms related to cyber, and the use of ICTs are continually being discussed and negotiated by States at UN fora. As a civil society organisation, we actively engage and submit position papers to ensure that negotiations recognise the impact of cyber-related issues on people’s lives, respect human rights and promote accountability."
year_published = 2025
year_updated = 2024
