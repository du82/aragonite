title = "CyberSecure Geneva: Nonprofits Support Program | CyberPeace Institute"
description = "The project offers a free cybersecurity NGO support program to almost 200 NGOs in The Hague, aiming to foster​ cyber capacities of vulnerable communities."
full_description = "In the heart of International Geneva, a diverse ecosystem thrives, housing 38 international organizations, 432 non-governmental organizations (NGOs), and several hundred associations active at an international level, all united by a shared mission: to make the world a place of peace and justice. The CyberPeace Institute safeguards these heroes in Geneva. Associations joining the project will have free access to a group of volunteer cybersecurity professionals from Geneva-based and international companies, who will carry out volunteering activities aimed at helping the associations improve their cybersecurity through the CyberPeace Builders programme. An initial priority will be given to associations working in the field of digital inclusion. Associations subsidized by the City of Geneva, including other services such as Agenda 21 (international solidarity), or other affiliated entities such as the Geneva Federation of Cooperation, may be associated with the initiative. With the leadership and support of the Republic and Canton of Geneva, our CyberPeace Analytical Report on the “Cyber Threats Affecting International Geneva” aims to provide actionable recommendations to build capacities and resilience to mitigate cyber risks. The CyberPeace Institute’s staff and experts generate their own work and ideas consistent with the Institute’s mission. The Institute maintains strict intellectual independence for all its projects, events, and publications. The Institute maintains independent control of the content and conclusions of any products resulting from sponsored projects."
