["https://cyberpeaceinstitute.org/cybersecurity-for-humanitarian-ngos"]
title = "Humanitarian Cybersecurity Center | CyberPeace Institute"
description = "The Humanitarian Cybersecurity Center (HCC) provides expert support and practical free cyber assistance to Non-governmental Organizations (NGOs), tailored to their needs and located anywhere in the world."
full_description = "The Humanitarian Cybersecurity Center (HCC) provides expert support and practical free cyber assistance to Non-governmental Organizations (NGOs), tailored to their needs and located anywhere in the world. We detect, investigate and analyze cyberattacks against NGOs. We share actionable threat intelligence with the community. Our CyberPeace Builders provide hands-on assistance to NGOs to build cyber preparedness and resilience through risk assessments, simulation exercises and training, globally. We provide hands-on technical and forensic investigative support and assist with incident and crisis management. We develop standards, foster multistakeholder collaboration, and advocate for the protection of the humanitarian sector. We conduct micro-level data analysis in which we detect and monitor threats to vulnerable communities. By aggregating data shared with us by our cybersecurity and technology partners and by mapping the digital assets of our beneficiaries we are in a better position to protect them. We detect these threats using technical data points such as indicators of compromise (IOCs) and telemetry data. Building detection rules and alerts we provide our beneficiaries with triaged information and practical recommendations to help them protect their data and systems. rose from 37% to 41% while development assistance for similar countries decreased from 50% to 48% between 2016 and 2021 * The CyberPeace Institute continues to carry out research and analysis of cyber threats to vulnerable populations. We are currently working on a unique data driven report regarding the cyber threat landscape of NGOs in the Geneva area, providing actionable recommendations. We engage with cybersecurity experts and NGOs through our volunteering platform and foster community engagement. The CyberPeace Institute’s staff and experts generate their own work and ideas consistent with the Institute’s mission. The Institute maintains strict intellectual independence for all its projects, events, and publications. The Institute maintains independent control of the content and conclusions of any products resulting from sponsored projects."
