full_description = "Power Times 26 CyberPower is excited to introduce our all-new PFC Sinewave Rackmount UPS series. These systems provide battery backup power with sine wave output for networking and storage devices, POS systems, security systems, and audio/visual equipment. Power Times 25 Summer storms cause millions of lightning strikes that can hit homes or businesses and cause electrical surges. These power surges can damage valuable electronics and IT equipment. But you can be prepared with surge protection. Power Times 24 For the second year in a row, CyberPower has won the Product of the Year. CRN®, a brand of The Channel Company, has recognized our new line of Smart App Sinewave UPS systems as the overall winner in the 2023 Products of the Year Awards in the power protection and management category. Power Times 23 If you are looking for more options to monitor and manage your power, CyberPower has multiple options to help you take control. Power Times 22 Many UPS systems offer energy-saving features that not only extend the life of a battery backup but also the equipment connected to it. It is important to understand the energy-saving features of CyberPower’s UPS systems and how to your customers can use them. Power Times 21 CyberPower was recognized in the power protection and management category for its CP1500PFCRM2U PFC Sinewave Short-Depth Rackmount UPS. Launched in May 2022, this UPS fits comfortably in short-depth rack installations where space is at a premium. Power Times 20 We are pleased to announce our new-and-improved versions of our best-selling Intelligent LCD UPS Systems. Building upon the quality and peace-of-mind you have come to trust, our new CP1350AVRLCD3 and CP1500AVRLCD3 feature a full-color lcd screen, USB-A and USB-C charge ports, and automatic voltage regulation. Power Times 19 Introducing the CyberPower CP1500PFCRM2U PFC Sinewave short-depth UPS system. This system provides battery backup power for security systems, audio/visual equipment, networking, and storage devices requiring an active PFC power source."
