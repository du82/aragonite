["https://www.cybertec-postgresql.com/en/join-pruning-cool-stuff-in-postgresql"]
title = "Join pruning - Cool stuff in PostgreSQL | CYBERTEC | PostgreSQL"
description = "UPDATED 2023: Find out how the PostgreSQL optimizer decides about “join pruning”. Improve performance, provide end users with simpler plans."
full_description = "UPDATED July 2023: The PostgreSQL optimizer is really a wonderful piece of software which is capable of doing great things. One of those great things is so-called “join pruning”. In case PostgreSQL detects a join which is actually not needed for execution, it will automatically remove it from the plan. Removing joins from the plan can result in significantly better performance and provide end users with much simpler plans. This is a left-join, which takes all values from the left and matches values on the right. Here's the plan: PostgreSQL will perform a hash join to produce the final result. In the SELECT-clause, a star will ensure that all columns are returned. Why is that possible? Well, first of all no information from “b” is needed to satisfy the SELECT-clause. However, this is not a sufficient condition to justify eliminating the table from the execution plan. Both sides must be unique. Remember, in a 1:n relationship the join could potentially return more data than a query without the join would. So, only if both sides are unique is it logically possible to just skip the second table. If you can prove that a simpler plan will produce the same result, you can use the simpler plan. There have been two patches since this blog post was originally written that use the table definition to improve row count estimates or take shortcuts: PostgreSQL 9.6 has added the following:Use foreign key relationships to infer selectivity for join predicates (Tomas Vondra, David Rowley)Here also is the improved version of this commit. In order to receive regular updates on important changes in PostgreSQL, subscribe to our newsletter, or follow us on Facebook or LinkedIn. You need to load content from reCAPTCHA to submit the form. Please note that doing so will share data with third-party providers. You are currently viewing a placeholder content from Facebook. To access the actual content, click the button below. Please note that doing so will share data with third-party providers."
