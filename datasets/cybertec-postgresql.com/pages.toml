title = "Kill long running queries in PostgreSQL | CYBERTEC PostgreSQL | Services & Support"
description = "How to detect and terminate long running queries in PostgreSQL using two different methods. Also: How to automatically kill slow queries."
full_description = '''<img alt='' src='https://secure.gravatar.com/avatar/915bbdc94d11a094ca51cc4966487dd6?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/915bbdc94d11a094ca51cc4966487dd6?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> John Smith says: October 17, 2023 at 3:38 pm I have a question regarding the "pg_terminate_backend" function. You mentioned that it terminates the entire database connection, including the query. Are there any situations where it's more advantageous to use this method over "pg_cancel_backend," which only terminates the query but keeps the connection alive? I'd appreciate some insights on when to choose one over the other. Reply <img alt='' src='https://secure.gravatar.com/avatar/6a3c20351787e72f72a698da1092aad8?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/6a3c20351787e72f72a698da1092aad8?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> laurenz says: October 18, 2023 at 6:39 am pg_cancel_backend() cancels the running query (makes it fail with an error), but the database session is preserved. It is less invasive than pg_terminate_backend(). On the other hand, pg_cancel_backend()is useless if there is no statement executing in the database session. These functions do different things, and you have to choose which is the appropriate one for your use case. Reply'''
