["https://cybertec-postgresql.com/products/pg_timetable"]
title = "pg_timetable - advanced job scheduling"
description = "pg_timetable: an advanced PostgreSQL job scheduler by CYBERTEC | cutting edge flexibility | execute complex workflows | protect concurrency"
full_description = "pg_timetable is a PostgreSQL job scheduler developed by CYBERTEC. It offers cutting-edge flexibility and a large variety of features. Job scheduling is one of the most important topics in modern database management. In the PostgreSQL ecosystem, pgAgent and pg_cron have become quite popular. However, both tools have a fair number of limitations. That’s why we decided to release our own solution: introducing pg_timetable, the next-generation PostgreSQL job scheduler. The software consists of a simple, easy to run executable which connects to PostgreSQL. It is not part of the server infrastructure itself. For this reason, it neither poses a security threat nor a stability concern to your server. It runs independently and is implemented in a simple, robust architecture. It is 100% database-driven and allows you to use PostgreSQL alone to control your workflows. It stores all logs in the database, so it is super easy to dissect logging information using plain SQL. You can also visualize data and execution logs quickly and easily, using the technology stack of your choice. Traditional job schedulers, such as cron or pg_cron, can either launch scripts or execute SQL. It can be very hard to combine those tasks, topping that off with problems of modularization. pg_timetable helps you to run those operations. “Base tasks” can be combined in a flexible way and entire “chains” can be executed on a regular basis which gives you a lot of flexibility. Additionally, pg_timetable offers built-in concurrency protection. This means that it prevents single jobs from continuously launching themselves, which would slowly kill your server. By using a simple flag, it allows you to synchronize complex workflows. Mostly, a job should run in a database transaction and should either fail or succeed entirely – nothing in between. pg_timetable is completely based on transactions. Therefore, it allows you to flexibly combine “base tasks” in single transactions, which adds reliability and integrity to your task chains."
year_published = 2025
year_updated = 2024
