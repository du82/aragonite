["https://www.cybertec-postgresql.com/en/how-the-postgresql-query-optimizer-works"]
title = "How the PostgreSQL optimizer works to speed up queries"
description = "You need to load content from reCAPTCHA to submit the form. Please note that doing so will share data with third-party providers."
full_description = '''<img alt='' src='https://secure.gravatar.com/avatar/1520cc0b87a13c5dcd8638b9b1a9202c?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/1520cc0b87a13c5dcd8638b9b1a9202c?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> Marc Rechté says: April 13, 2021 at 3:31 pm Many thanks. Just noticed an indentation problem on line 16, 3rd listing of "Optimizing join orders"§ Reply Just like any advanced relational database, PostgreSQL uses a cost-based query optimizer that tries to turn your SQL queries into something efficient that executes in as little time as possible. For many people, the workings of the optimizer itself remain a mystery, so we have decided to give users some insight into what is really going on behind the scenes. So let’s take a tour through the PostgreSQL optimizer and get an overview of some of the most important techniques the optimizer uses to speed up queries. Note that the techniques listed here are in no way complete. There is a lot more going on, but it makes sense to take a look at the most basic things in order to gain a good understanding of the process. Constant folding is one of the easier processes to understand. Nonetheless, it's extremely important. Here we add a filter to the query: x = 7 + 1. What the system does is to “fold” the constant and instead do “x = 8”. Why is that important? In case “x” is indexed (assuming it is a table), we can easily look up 8 in the index. PostgreSQL does not transform the expression to “x = 8” in this case. That’s why you should try to make sure that the filter is on the right side, and not on the column you might want to index. One more important technique is the idea of function inlining. The goal is to reduce function calls as much as possible and thus speed up the query. Look in the WHERE clause. The ld function has been replaced with the underlying log function. Note that this is only possible in the case of SQL functions. PL/pgSQL and other stored procedure languages are black boxes to the optimizer, so whether these things are possible or not depends on the type of language used.'''
author = "Hans-Jürgen Schönig"
