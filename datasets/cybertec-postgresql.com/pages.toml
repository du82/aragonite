["https://www.cybertec-postgresql.com/en/why-does-my-pg_wal-keep-growing"]
title = "Why does my pg_wal keep growing? | CYBERTEC PostgreSQL | Services & Support"
description = "You need to load content from reCAPTCHA to submit the form. Please note that doing so will share data with third-party providers."
full_description = '''"Why does my pg_wal keep growing?" That's a question I keep hearing again and again. It is an urgent question, since the PostgreSQL server will crash if pg_wal runs out of disk space. I decided to answer the question once and for all. The PostgreSQL database logs all modifications to the database in the transaction redo log. PostgreSQL calls the transaction redo log “write-ahead log” (WAL), because we must log all data modifications before applying them to the data. This serves three purposes: PostgreSQL writes WAL sequentially to WAL segment files in the pg_wal subdirectory of the data directory. These WAL segments are 16MB in size (but you can choose a different size during initdb). A WAL segment can be in one of three states: Clearly, it is the completed WAL segments that concern us here. PostgreSQL will delete them automatically as soon as it no longer needs them. We have to understand this process better, so that we can address our original problem. One important warning at this point: PostgreSQL needs these files to recover from a crash. If you are out of disk space, you'll have to increase the disk space. PostgreSQL deletes completed WAL segments that it does not need any more at the end of a checkpoint. There are three criteria that PostgreSQL checks before it can delete a WAL segment: This only applies if you have configured archive_mode to on. Then the archiver executes archive_command (or invokes the archive_library) to archive the WAL segment. If the archiver fails, it keeps retrying to archive the same WAL segment over and over, until it succeeds. This is necessary, because PostgreSQL cannot recover past a missing WAL segment. To see if the archiver is stuck, use the following query: If that query returns a result, look at the PostgreSQL log file, which will show all error messages from the archiver. Fix the problem, and PostgreSQL will start removing old WAL segments after the next checkpoint. Sometimes the problem is not that the archiver is stuck, but that it is too slow: it archives WAL segments slower than PostgreSQL generates them. One cause for that can be that your archive_command uses a slow compression method. In that case, you have to speed up archive_command to fix the problem.'''
