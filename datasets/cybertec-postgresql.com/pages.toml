["https://www.cybertec-postgresql.com/en/migrate-scheduled-jobs-to-pg_timetable-from-pgagent"]
title = "Migrate scheduled jobs to pg_timetable from pgAgent | CYBERTEC PostgreSQL | Services & Support"
description = "You need to load content from reCAPTCHA to submit the form. Please note that doing so will share data with third-party providers."
full_description = '''There are many reasons, actually, why people might want to export pgAgent jobs to pg_timetable. Most of them may be spotted by taking a look at the PostgreSQL schedulers comparison table I introduced in one of my previous posts and the supported platform table from the official readme. In my previous article I highlighted the reasons why and the ways how one might want to move scheduled jobs from pg_cron to pg_timetable. To export every piece of information available as precisely as possible, use this SQL snippet. I will explain it step by step. As I said earlier, we need to convert boolean arrays storing execution information for minutes, hours, days, and months to proper cron notation. The first thing to notice is that arrays are of different lengths, e.g., 60 for minutes, 12 for months, etc. Second, the cron clause starts from 0 for hours and minutes but with 1 for other units. The trick is simple: unnest the input array, join it with order numbers, throw out rows with false values, and combine numbers into a cron-acceptable comma-separated string. If all values in the array are false, then just use asterisk cron notation. pg_timetable is a cross-platform tool that may run on most of the known platforms. Because of this, we want to know exactly which shell will be used for batch pgAgent tasks. On Unix-like platforms the obvious choice would be sh -c "command". On Windows, it might be either pwsh -c "command" or cmd /C "command". Please note the naming convention I'm using here. If the CTE clause starts with 'cte', it somehow produces the final result. Meanwhile, CTE clauses named 'pga_*' prepare pgAgent-specific result sets for transformation. In this CTE clause, we want to return all active pgAgent schedules with cron notation. The schedule name will later be used in the chain name. This clause will return the result set for all pgAgent jobs scheduled. Because on the target database there might already be some chains, we cannot use jobid directly. Instead, we want to generate the next chain_id from the sequence to use later.'''
author = "Pavlo Golub"
