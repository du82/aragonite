["https://www.cybertec-postgresql.com/en/linux-cgroups-for-postgresql"]
title = "cgroups to limit PostgreSQL resource usage on Linux | CYBERTEC"
description = "How to use and configure Linux control groups (cgroups) to control PostgreSQL's resource usage? | Usefulness of constraining the various cgroup subsystems"
full_description = "In a recent wrestling match with the Linux “out-of-memory killer” for a CYBERTEC customer I got acquainted with Linux control groups (“cgroups”), and I want to give you a short introduction how they can be used with PostgreSQL and discuss their usefulness. Warning: This was done on my RedHat Fedora 27 system running Linux 4.16.5 with cgroups v1 managed by systemd version 234. Both cgroups and systemd's handling of them seem to be undergoing changes, so your mileage may vary considerably. Still, it should be a useful starting point if you want to explore cgroups. Control groups, usually referred to as cgroups, are a Linux kernel feature which allow processes to be organized into hierarchical groups whose usage of various types of resources can then be limited and monitored. cgroups are managed with special commands that start with “cg” but can also be managed through a special cgroups file system and systemd. There are several subsystems defined (also called “controllers” in cgroups terminology). Of these, the following are interesting for PostgreSQL: To start PostgreSQL in the cgroups we defined above, use the cgexec executable (you may have to install an operating system package called libcgroup or libcgroup-tools for that): To change a running process to a cgroup, you can use cgclassify (but then you have to change all running PostgreSQL processes). systemd provides a simpler interface to Linux cgroups, so you don't have to do any of the above. systemd can create cgroups “on the fly” for the services it starts. If your PostgreSQL service is called postgresql-10, simply create a file /etc/systemd/system/postgresql-10.service like this: As you see, not all cgroup settings are available with systemd. As a workaround, you can define cgroups in /etc/cgconfig.conf and use cgexec to start the service. At first glance, it sounds interesting to limit memory usage with cgroups. But there are several drawbacks: None of this is very appealing — there is no option to make malloc fail so that PostgreSQL can handle the problem."
