full_description = "<img alt='' src='https://secure.gravatar.com/avatar/ddcab6872a880ce87e458a342b603b3b?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/ddcab6872a880ce87e458a342b603b3b?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> Baron Schwartz says: October 6, 2017 at 7:13 pm I believe there are probably a lot more problems than people expect. This is based on my experience writing such software to verify replica integrity in other databases. My work for MySQL is more than a decade old and is open source. It found many, many bugs in MySQL, many of them in completely unexpected areas of the codebase. See https://www.percona.com/doc/percona-toolkit/LATEST/pt-table-checksum.html Reply"
