["https://cybertec-postgresql.com/cypex-tutorial-videos"]
title = "CYPEX - START WITH THE BASICS"
description = "Check out these CYPEX tutorial videos: CYPEX is a user-friendly, low-code tool developed by CYBERTEC to quickly build PostgreSQL apps."
full_description = "CYPEX is a user-friendly tool developed by CYBERTEC to quickly build PostgreSQL applications. Little coding is needed to achieve big results: CYPEX allows you to develop applications quickly, interactively and in real-time. Check out these tutorial videos to get started! The CYPEX Tutorial video demonstrates how to create a new element, in this case a Markdown element, and how to configure it. The Markdown element supports GFM (GitHub Flavored Markdown, https://github.github.com/gfm/), including Syntax Highlighting for the most common programming languages. With a simple-to-use editor, it can also be utilized by non-technical people. How do you configure an element in CYPEX? You will notice that most GUI elements behave in a similar way, but let us focus on pie charts here: An essential first step is selecting a data source for the pie chart. In this case, the “source view” will be “country statistics” which happens to be the object view that was already created. After that, labels and values can be selected. The desired pie chart will be displayed instantly while you are still in edit-mode. You can resize the element, or drag it around on your page. It’s easy to layout elements. You can move and resize them with ease, simply by dragging and dropping. Customize and theme the application to your liking. At the moment, you can customize the primary and secondary colors. Theming capabilities are continuously being worked on. Additionally, you can add your logo (not seen in the CYPEX Tutorial video). You can create a new page in under half a minute.​ Page parameters are useful for pages that depend on other pages.When linking to these pages, you’re asked for parameter values. You can also use expressions to make your link dynamic.After creating a page, you can start dragging elements into it. In this CYPEX Tutorial video, you can see how a markdown field can be used to create a page title. CYPEX can be used to quickly build dashboards. We have several kinds of charts to display your statistical data:"
