["https://www.cybertec-postgresql.com/en/postgresql-distributed-aggregates-aggregate-pushdown"]
title = "Distributed aggregates / aggregate pushdown"
description = "A feature from PostgreSQL 10 is related to Foreign Data Wrappers and is generally known as “aggregate pushdown”. Have a look!|"
full_description = "PostgreSQL 10 will provide end users with countless new features. One of those features is related to “Foreign Data Wrappers” and is generally known as “aggregate pushdown”. To be honest: This stuff is one of my favorite new features of PostgreSQL 10 and therefore it might be worth, sharing this piece information with a broader audience. So if you are interested in remote aggregation, distributed queries, distributed aggregates and aggregate pushdown in PostgreSQL, keep reading. For many years now, PostgreSQL has provided means to access remote data sources using “Foreign Data Wrappers” (FDWs) The script shown here loads the postgres_fdw extension, which allows us to connect to a remote PostgreSQL database. Then a virtual server pointing to db01 is created in db01. Finally, there are a user mapping and the foreign schema imported. All tables in the remote database, which can be found in the “public” schema, will be linked and visible in db01. Once the test data is in place, we can give PostgreSQL a try and see, how it behaves in case of aggregates. Here is an example: The most important observation here is that PostgreSQL is able to push over the complete aggregate. As you can see, the remote SQL is basically the same as the local query. The main advantage is that by pushing over the aggregates PostgreSQL can drastically reduce the load on your local machine and reduce the amount of data, which has to be sent over the network. However, at this point it is necessary to issue a word of caution: Yes, aggregates can be pushed down to a remote server. The thing is: Joins happen before the aggregate. In other words: PostgreSQL has to transfer all the data from the remote host in this case: For PostgreSQL 11.0 we are working on a patch, which will hopefully make it into core. It allows PostgreSQL to perform many aggregations before the join has to happen, which makes joining cheaper because less data ends up in the join. There are many more improvements possible. They may be added to the planner in the near future.However, as of PostgreSQL 10 a large step forward has been made already to allow PostgreSQL to dynamically distribute queries in a cluster."
author = "Hans-Jürgen Schönig"
year_published = 2017
year_updated = 2024
clearnet = "https://www.cybertec-postgresql.com/en/postgresql-distributed-aggregates-aggregate-pushdown"
