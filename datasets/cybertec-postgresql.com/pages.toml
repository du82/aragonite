["https://www.cybertec-postgresql.com/en/enabling-and-disabling-autovacuum-in-postgresql"]
title = "Enabling and disabling autovacuum in PostgreSQL | CYBERTEC"
description = "UPDATED Aug 2023: How to enable and disable autovacuum in PostgreSQL: How does autovacuum really work? Can you simply turn it on and off?"
full_description = "<img alt='' src='https://secure.gravatar.com/avatar/f2c63c4b9ee1a2aab5af0185593a0cb2?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/f2c63c4b9ee1a2aab5af0185593a0cb2?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> Fazal Majid says: June 2, 2021 at 8:53 am One issue is that autovacuum takes locks that can interfere with periodic maintenance tasks like adding/dropping weekly or monthly partitions to tables, or DML like ALTER TABLE. We used to run postgres in single-user mode to do these during a maintenance window, but those tables are created with pg_type.typarray=NULL, which causes pg_upgrade to fail. So now we are launching postgres in postmaster mode with TCP/IP disabled, a non-standard UNIX socket directory, autovacuum=off, autovacuum_nap_time=3600 and a separate thread that kills autovacuums as soon as they appear because even with autovacuum=off the XID rollover autovacuums still run. Very clunky. Reply <img alt='' src='https://secure.gravatar.com/avatar/69a53e6cae1a9ce57a262c7c8d009808?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/69a53e6cae1a9ce57a262c7c8d009808?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> Andreas Kretschmer says: October 12, 2023 at 8:54 am you forgot the visibility map ... Reply"
