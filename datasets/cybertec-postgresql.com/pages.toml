["https://www.cybertec-postgresql.com/en/find-and-fix-a-missing-postgresql-index"]
title = "Find and fix a missing PostgreSQL Index | CYBERTEC PostgreSQL | Services & Support"
description = "Explains how to find a missing Postgresql index, what you can do to fix missing indexes, and how to achieve good database performance."
full_description = "Missing indexes are a key ingredient if you are looking for a perfect recipe to ruin performance in the most efficient way possible. 🙂 However, if you want to ensure that your database performs well and if you are generally not in favor of user complaints – better watch out for missing indexes and make sure that all relevant tables are properly taken care of. One PostgreSQL index can make all the difference in performance. To help you understand, I have compiled this little guide about how to locate missing indexes, what you can do to fix them, and how to achieve good database performance. In order to demonstrate how to find missing indexes, I have to first create a test database. One way to do it is to use pgbench: What happens here is that pgbench just provided us with a little sample database which contains 4 tables. This database is perfectly indexed by default, so we have to drop some indexes in order to find something we can fix later: We have simply dropped the primary key: which is, internally, nothing other than a unique index which does not allow NULL entries. Before we start running our benchmark to see how bad performance really gets, you need to make sure that the most important tool to handle performance problems is installed and active: pg_stat_statements. Without pg_stat_statements, tracking down performance problems is unnecessarily hard. Despite opening 10 connections (-c 10) and proving pgbench with 10 threads (-j 10) we managed to run 4 - yes, 4 - transactions per second. One might argue that hardware is the problem, but it's definitely not: This is a modern, 8 core machine. Even if the clockspeed were 10 times as high, we would have topped out at 40 transactions per second. That's still way below what you would expect. The first clue that indexes might be missing can be found in pg_stat_user_tables. The following table contains the relevant columns: What we see here is the name of the table (relname) including the schemaname. Then we can see how often our table has been read sequentially (seq_scan) and how often an index has been used (idx_scan). Finally, there is the most relevant information: seq_tup_read. So what does that mean? It actually tells us how many rows the system had to process to satisfy all those sequential scans. This number is really really important and I cannot stress it enough: If “a lot” is read “really often” it will lead to an insane entry in the seq_tup_read column. That also means we have to process an enormous number of rows to read a table sequentially again and again."
author = "Hans-Jürgen Schönig"
year_published = 2022
year_updated = 2024
