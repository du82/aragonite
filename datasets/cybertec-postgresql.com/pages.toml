["https://cybertec-postgresql.com/products/cybertec-postgresql-enterprise-edition"]
title = "CYBERTEC PostgreSQL Enterprise Edition (PGEE)"
description = "CYBERTEC PostgreSQL Enterprise Edition (PGEE): a highly secure PostgreSQL database server - advanced enterprise features powered by CYBERTEC"
full_description = "Level up with CYBERTEC PostgreSQL Enterprise Edition (PGEE). PGEE is a highly secure database management system with advanced enterprise features, powered by CYBERTEC’s deep PostgreSQL expertise. PGEE is an enhanced PostgreSQL distribution optimized for large-scale enterprise-grade operations. Its core elements include superior security as well as high performance, user-friendly monitoring and 24/7 Enterprise Support. Security is more important now than ever before. Just think how often leaks destroy a company’s reputation in an instant. For that reason, we’ve fully equipped PGEE to take on security challenges. Because its advanced security features substantially exceed those of standard PostgreSQL, PGEE will keep your data and your reputation intact. All in all, PGEE’s security enhancements include: First and foremost, CYBERTEC PGEE is fully encrypted by default. That means we support complete storage encryption, which protects your data at a professional level. At the same time, PGEE maintains high performance and provides an excellent user experience. While standard PostgreSQL stores the code of a procedure in plain text, PL/pgSQL_sec makes sure that nobody unauthorized sees your code. Even more, it encrypts the code in your backups. However, you do not sacrifice flexibility, because your code still remains transparent to your developers. In order to support transparency, PGEE has advanced auditing support which allows you to track client activity in detail. It’s able to do this because it doesn’t store the audit trail under a PostgreSQL user. Instead, it sends the audit trail to a different UNIX user context. As a result, DBA’s can’t modify it. DBA’s do not usually have time to watch the database every minute. Often, no one immediately notices if someone drops tables at unusual times, or changes passwords without permission. Then it can be weeks or longer before anyone realizes there’s damage. However, PGEE provides a solution. Because PGEE makes use of Artificial Intelligence, PGEE immediately detects anomalies and informs you of potential threats."
