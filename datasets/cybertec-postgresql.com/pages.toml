title = "HOT updates in PostgreSQL for better performance | CYBERTEC PostgreSQL | Services & Support"
description = "HOT updates (Heap Only Tuple) boost PostgreSQL DML performance. This article explains the concept, shows examples and gives tuning advice."
full_description = '''<img alt='' src='https://secure.gravatar.com/avatar/da85065e3d48e9884a99666da7f0e0c2?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/da85065e3d48e9884a99666da7f0e0c2?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> Sang-gon Lee says: December 26, 2020 at 3:53 pm This was really interesting and helpful. Thank you! Reply <img alt='' src='https://secure.gravatar.com/avatar/2eede1d2e8c201ab5bfa3f8a274f4d71?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/2eede1d2e8c201ab5bfa3f8a274f4d71?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> Pedro Papel says: April 5, 2022 at 1:59 am Hello! I know this article is kind of old but I'm left wondering, what happens when the block eventually fills? As seen in the final experiment, the HOT update inserts the updated value at the latest available block space (0,159). Now, if I make a lot of updates, then the block will eventually fill, what happens then? Is the updated value inserted in the last available space on the next block? if that's so, what happens to the index? Thanks for making this really informative post!:) Reply <img alt='' src='https://secure.gravatar.com/avatar/6a3c20351787e72f72a698da1092aad8?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/6a3c20351787e72f72a698da1092aad8?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> laurenz says: April 5, 2022 at 2:10 am An INSERT will never fill the block if the fillfactor is less than 100. If there is not enough room in any of the existing pages, PostgreSQL will extend the table. HOT update only applies to updates. There is no guarantee that HOT update is used: if there is not enough room in the same page, PostgreSQL will perform a regular UPDATE and modify the index. Reply <img alt='' src='https://secure.gravatar.com/avatar/875287701d847d438186cf10ca0305c3?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/875287701d847d438186cf10ca0305c3?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> choose says: November 3, 2022 at 12:54 am Thanks for the good article. You said "Dead tuples can be removed without the need for VACUUM.", can a snapshot conflict arise if there is a query running on the slave when HOT Pruning is executed in msater? Reply'''
