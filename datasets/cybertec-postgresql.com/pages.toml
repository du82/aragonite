["https://www.cybertec-postgresql.com/en/composite-type-performance-issues-in-postgresql"]
title = "Composite data type performance issues in PostgreSQL"
description = "You need to load content from reCAPTCHA to submit the form. Please note that doing so will share data with third-party providers."
full_description = "This blog is about table functions and performance. PostgreSQL is a really powerful database and offers many features to make SQL even more powerful. One of these impressive things is the concept of a composite data type. In PostgreSQL a column can be a fairly complex thing. This is especially important if you want to work with server side stored procedures or functions. However, there are some details people are usually not aware of when making use of stored procedures and composite types. Before we dive into the main topic of this post, I want to give you a mini introduction to composite types in general: As you can see the column type is “person”.Armed with this kind of information we can focus our attention on performance. In PostgreSQL a composite type is often used in conjunction with stored procedures to abstract values passed to a function or to handle return values. pgstattuple is an extension which is especially useful if you want to detect bloat in a table. It makes use of a composite data type to return data. Installing the extension is easy: What we want to do next is to inspect the content of “x” and see the data (all fields). Here is what you can do: Wow, it took close to 2 seconds to generate the result. Why is that the case? Let us take a look at a second example: Ooops? What happened? If we put the query in the FROM-clause the database is significantly faster. The same is true if we use a subselect: The problem is that PostgreSQL expands the FROM-clause. It actually turns (pgstattuple('x')) into … As you can see, the function is called more often in this case which of course explains the runtime difference. Therefore it makes a lot of sense to understand what is going on under the hood here. The performance improvement can be quite dramatic. We have seen a couple of cases in PostgreSQL support recently which could be related to this kind of behavior. If you want to know more about performance consider checking out my blog post about CREATE INDEX and parallelism."
author = "Hans-Jürgen Schönig"
