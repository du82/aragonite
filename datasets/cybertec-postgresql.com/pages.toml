["https://www.cybertec-postgresql.com/en/the-four-quadrants-of-an-oracle-migration"]
title = "The four quadrants of an Oracle migration"
description = "This post aims to discuss the four quadrants from Oracle. Also we will show, how you can save time and money with a migration with CYPEX."
full_description = "When you think about migration from Oracle to Postgres, most people just say that it is easy. And if you consult the various sources of information, nothing tells you differently.And it might not even be untrue. Most databases we create, manage, and run are easy to migrate. If you look at the characteristics of these databases, the large bulk of these: For moving these databases from Oracle to PostgreSQL, you do not think about a larger-scale project or other big complexities.And that is good. These allow you to save a lot of budget where it does not make sense to spend serious money whatsoever, not even if it is from a standardization point of view, quite the contrary. It gets significantly more interesting with “the big fish”. Those database has an alternate signature to the ones mentioned above, or they might be the “devil in disguise”. They may just have a single or perhaps two of the characteristics. A super busy and tiny database might not be so easy to move from Oracle to Postgres!To get a firm grasp on this, we look at a database migration from the four quadrants that make up the complete setup. This post aims to discuss these four quadrants at a little more abstract level. There is much more to explore for each of the steps along the way. We will go through these four quadrants one by one and review their relevant attributes. For every migration these four quadrants contain elements that need to be addressed to complete a database migration successfully. The first big step in a database migration is ensuring we have an infrastructure available for our database, and the workload to land on. Especially as we start thinking about migrating some of “the bigger fish” out there, this can be a very interesting first part of our journey.In the source environment, we might be dealing with very specific hardware configurations. These might be Oracle Exadata machines with Infiniband connects and specific extreme internal configurations. Or we might come across Oracle RAC, with a multi-node cluster that has been tailor-made for this specific workload.More often than not; though, as a good friend of mine once said; “If it is not configured by one of the folks on my list, I do not fear it!” In other words, most Exadata machines, and most RAC implementations are quite poorly designed or executed implementations of very powerful, but also extremely specific hardware and software. You would not be the first person to encounter a RAC cluster that fails completely upon the crash of a single node."
author = "Jan Karremans"
year_published = 2024
year_updated = 2024
