["https://www.cybertec-postgresql.com/en/publishing-maps-with-geoserver-and-postgis"]
title = "Publishing maps with Geoserver and PostGIS | CYBERTEC"
description = "Analysing data within PostGIS is just one side of the coin. This blogpost is about publishing datasets as maps using Geoserver and PostGIS."
full_description = "Analysing data within PostGIS is just one side of the coin. What about publishing our datasets as maps that various clients can consume and profit from with Geoserver and PostGIS? Let’s have a look at how this can be accomplished with Geoserver. Geoserver acts in this regard as a full-fledged open source mapping server, supporting several OGC compliant services, such as OGC Web Mapping (WMS) or Web Feature Service (WFS).OGC is an abbreviation for Open GIS Consortium, which is a community working on improving access to spatial information by developing standards in this area. Let’s first start by setting up Geoserver as a single, non-clustered instance. For our demo, I recommend using one of the available Docker images to start up quickly. The steps listed below show how to pull our geoserver image (kartoza) first, and subsequently start the container with its default configuration within a tmux session, which allows us to easily monitor geoserver’s output. docker pull kartoza/geoserver:2.18.2tmuxdocker run -it --name geoserver -p 8080:8080 -p 8600:8080 kartoza/geoserver:2.18.2 In one of my last blog posts, I imported a csv containing locations of airports (https://ourairports.com/data/airports.csv). Let’s build on this and use these point geometries as the main vector layer for our visualization. By using kartoza’s image defaults, Apache Tomcat will listen on port 8080 serving Geoserver’s web-interface with http://10.0.0.216:8090/geoserver. So, let’s continue and login with geoserver/admin. Figure 1 represents Geoserver’s main web screen after logging in. To publish our airport dataset, we must register our PostGIS database as a store (data source). To do so, I would first like to introduce the concept of workspaces within Geoserver. Workspaces are containers which data stores, layers and services belong to. Workspaces can be configured in detail in terms of accessibility and functionality.Setting up at least one workspace is required. Check out Figure 2 and 3 to understand how this can easily be accomplished."
author = "Florian Nadler"
year_published = 2021
year_updated = 2024
