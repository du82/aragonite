full_description = '''<img alt='' src='https://secure.gravatar.com/avatar/85ed18067645272ac3b6c52eec80d500?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/85ed18067645272ac3b6c52eec80d500?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> Douglas J Hunley says: March 16, 2017 at 7:06 pm If you have archive_mode and archive_command configured, the replica can use recovery_command to get the missing WAL and then reconnect to the master and resume streaming. You can totally avoid rebuilding replicas by using the archived WAL. And you're probably already archiving WAL for PITR purposes as part of your backup, right? 🙂 Reply <img alt='' src='https://secure.gravatar.com/avatar/0990bbcc174c43ce2ce3cc73d818a7dd?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/0990bbcc174c43ce2ce3cc73d818a7dd?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> Kaarel says: March 17, 2017 at 1:07 pm Yes, a valid note. Described "basic" setup is of course not really recommended normally. But that doesn't mean you don't see such setups in the wild 🙂 Reply <img alt='' src='https://secure.gravatar.com/avatar/c351da59e8b53b9a59968d1e80dabd49?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/c351da59e8b53b9a59968d1e80dabd49?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> Colin 't Hart says: March 17, 2017 at 7:51 pm Why is this not recommended? This is what is described in the documentation and all of the howtos that I read. So this is what we implemented. It works well for us because we need to keep WAL around anyway for normal backup and recovery. Reply <img alt='' src='https://secure.gravatar.com/avatar/0990bbcc174c43ce2ce3cc73d818a7dd?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/0990bbcc174c43ce2ce3cc73d818a7dd?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 phot