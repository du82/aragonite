["https://www.cybertec-postgresql.com/en/idle_in_transaction_session_timeout-terminating-idle-transactions-in-postgresql"]
title = "idle_in_transaction_session_timeout in PostgreSQL - CYBERTEC PostgreSQL | Services & Support"
description = "Long PostgreSQL transactions can cause table bloat. idle_in_transaction_session_timeout limits the duration of a transaction to prevent bloat"
full_description = '''<img alt='' src='https://secure.gravatar.com/avatar/bfb8cee4e06dfa4c31d4ff2a3c46c4ad?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/bfb8cee4e06dfa4c31d4ff2a3c46c4ad?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> Pavel Luzanov says: April 9, 2018 at 1:15 pm I believe that example of a long transaction is true only for Repeatable Read (or Serializable) isolation level. But by default BEGIN used Read Commited. So, after SELECT in the first session finished, VACUUM will remove dead rows in a table after subsequent UPDATE, DELETE commands in the session 2. Reply <img alt='' src='https://secure.gravatar.com/avatar/09020f48840fc9eeda0761427489522a?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/09020f48840fc9eeda0761427489522a?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> Sourav Ghosh says: April 12, 2019 at 6:39 am Want to know what are the side effects of setting idle_in_transaction_session_timeout. Also Will CPU utilization come down after enabling it? Reply <img alt='' src='https://secure.gravatar.com/avatar/6a3c20351787e72f72a698da1092aad8?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/6a3c20351787e72f72a698da1092aad8?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> laurenz says: April 12, 2019 at 6:43 am This has nothing to do with CPU utilization ("idle" means idle). The side effect will be unexpected disconnections if transactions are idle for too long. Reply <img alt='' src='https://secure.gravatar.com/avatar/09020f48840fc9eeda0761427489522a?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/09020f48840fc9eeda0761427489522a?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> Sourav Ghosh says: April 12, 2019 at 6:59 am Thanks. Still wondering what will the advantages, if I enable it altering the system settings because I was thinking to do so, other than releasing idle connections to reuse the connection slots Reply'''
