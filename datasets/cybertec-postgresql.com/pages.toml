["https://www.cybertec-postgresql.com/en/killing-performance-with-postgresql-partitioning"]
title = "Killing performance with PostgreSQL partitioning | CYBERTEC PostgreSQL | Services & Support"
description = "Partitioning is not without risk. It might help to handle large quantities of data, but it can also have downsides - learn how to it."
full_description = "<img alt='' src='https://secure.gravatar.com/avatar/d927a9f747ab23ef6670cb1a8bd73ff5?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/d927a9f747ab23ef6670cb1a8bd73ff5?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> SUJEET says: July 29, 2023 at 2:39 am The choice of partitioning strategy depends on the use case. For example, if you have a table with 2 billion rows and you mostly query it using the user_id column, then you might want to use hash partitioning. This is because hash partitioning will allow the database to quickly scan the relevant partition when you pass the user_id as a WHERE clause value. In your query, you used SELECT * wihtout any where clause, which means that the database will have to scan all of the rows in all the table. This will make the query slow, regardless of the partitioning strategy. Reply <img alt='' src='https://secure.gravatar.com/avatar/6a3c20351787e72f72a698da1092aad8?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/6a3c20351787e72f72a698da1092aad8?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> laurenz says: July 31, 2023 at 6:24 am I guess you didn't read carefully enough - there is a WHERE condition. The query is not very slow, but quite a bit slower than on the unpartitioned table. That is normal. Reply <img alt='' src='https://secure.gravatar.com/avatar/4fa70ed52397bff39bc8502e7870ee11?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/4fa70ed52397bff39bc8502e7870ee11?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> reza sh says: July 29, 2023 at 6:45 pm Use range for partitioning! Reply <img alt='' src='https://secure.gravatar.com/avatar/6a3c20351787e72f72a698da1092aad8?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/6a3c20351787e72f72a698da1092aad8?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> laurenz says: July 31, 2023 at 6:25 am That wouldn't make a difference in this case. Reply"
