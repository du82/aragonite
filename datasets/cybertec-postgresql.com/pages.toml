["https://www.cybertec-postgresql.com/en/debugging-pl-pgsql-get-stacked-diagnostics"]
title = "Debugging PL/pgSQL: GET STACKED DIAGNOSTICS"
description = "GET STACKED DIAGNOSTICS makes debugging PL/pgSQL code a lot easier. This post will show what it does and how you can make use of it."
full_description = "PL/pgSQL is the preferred way to write stored procedures in PostgreSQL. Of course there are more languages to write code available but most people still use PL/pgSQL to get the job done. However, debugging PL/pgSQL code can be a bit tricky. Tools are around but it is still not a fun experience. One thing to make debugging easier is GET STACKED DIAGNOSTICS which is unfortunately not widely known. This post will show what it does and how you can make use of it. To show you how GET STACKED DIAGNOSTICS worked I have written some broken code which executes a division by zero which is forbidden in any sane database: The question now is: How can we get a backtrace and debug the code? One way is to wrap the code into one more function call and see where things fail: My function catches the error causes by simple_function() and calls GET STACKED DIAGNOSTICS to display all the information we can possibly extract from the system. The output looks as follows: As you can see the stack trace is displayed and we can easily figure out where the problem has happened. In this case “broken_function” line 3 is the root cause of all evil. If you want to learn more about PostgreSQL consider checking out one of my posts dealing with database performance. You need to load content from reCAPTCHA to submit the form. Please note that doing so will share data with third-party providers. You are currently viewing a placeholder content from Facebook. To access the actual content, click the button below. Please note that doing so will share data with third-party providers. You are currently viewing a placeholder content from X. To access the actual content, click the button below. Please note that doing so will share data with third-party providers."
