["https://cybertec-postgresql.com/data-protection-policy"]
title = "Data protection policy"
description = "Data protection is very important for us. Here you can find all the information concerning data protection."
full_description = "We are especially committed to the protection of your personal data. We process your data exclusively on the basis of the statutory regulations (GDPR, Austrian Telecommunications Act 2003). With this data protection information, we wish to inform you of the key aspects of data processing in the context of our website. If you contact us via the contact form on the website or via email, the data you have provided will be stored with us for the purpose of processing your inquiry and in case of follow-up questions. We will not disclose this data without your consent. If you enter into a contract with us, these data will be stored within the company for at least the term of the contract. The data provided by you are necessary for performance of the contract or the implementation of pre-contractual measures. We cannot enter into a contract with you without this data. The data will not be disclosed to third parties, with the exception of our tax advisor in the performance of our fiscal obligations. All data resulting from the contractual relationship will be stored for the term of the contract; at least, however, until expiry of the fiscal retention period. This data will be used to communicate with the key contact within the client company or interested company. The data shall be processed on the basis of the statutory provisions of Sect. 165 Para 3 of the Telecommunications Act and Article 6(1)a (consent) and/or b (necessary for performance of a contract) of the GDPR. Our website uses so-called cookies. These are small text files which are stored on your end device with the aid of the browser. They do not cause any damage. We use cookies to make our services more user-friendly. Some cookies remain stored on your end device until you delete them. They allow us to recognize your browser again on your next visit. You can prevent cookies from being stored by using the appropriate settings in your browser software. Deactivating cookies may limit the functionality of our website."
