["https://www.cybertec-postgresql.com/en/blob-cleanup-in-postgresql"]
title = "BLOB cleanup in PostgreSQL"
description = "PostgreSQL offers a nice BLOB interface which is widely used. Learn more about how PostgreSQL handles BLOBs - and especially BLOB cleanup."
full_description = "<img alt='' src='https://secure.gravatar.com/avatar/3896de21c3fa6c99864d24b1283ad11c?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/3896de21c3fa6c99864d24b1283ad11c?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> Marti R. says: December 4, 2020 at 4:34 pm The BLOB system of PostgreSQL is quite horrible and I think should not be used. As noted, there is no referential integrity for blob values -- you can accidentally delete blobs that are still referenced, and also forget to delete them, for which the vacuumlo command is a workaround. Especially, nobody should use the shown lo_import() function, which requires superuser permissions and reads files on the database server's file system, both bad practices. In most cases it's far better to create a table with a bytea field to store your binary data, and use foreign key constraints to ensure referential integrity. For files larger than 1 GB one should consider an external data store. Reply <img alt='' src='https://secure.gravatar.com/avatar/6a3c20351787e72f72a698da1092aad8?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/6a3c20351787e72f72a698da1092aad8?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> laurenz says: December 7, 2020 at 8:12 am I agree. The only use cases are - if you need to store data exceeding 1GB - if you need to stream writes Compare my blog on binary data performance in PostgreSQL. Reply <img alt='' src='https://secure.gravatar.com/avatar/b2cb28cdd9a7e2e65cc0b5d56ab2d9e2?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/b2cb28cdd9a7e2e65cc0b5d56ab2d9e2?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> Joe says: October 27, 2022 at 12:58 pm My table with bytea column is bloating. Every days my backup is bloating, as if deleted records were backed up. Is it possible that deleted records are being backed up by pg_dump ? Reply"
