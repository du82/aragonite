["https://cybertec-postgresql.com/products/pg-show-plans"]
title = "PG_SHOW_PLANS"
description = "pg_show_plans is a free PostgreSQL tool developed by CYBERTEC which allows you to monitor execution plans in real-time."
full_description = "pg_show_plans is a free PostgreSQL tool which allows you to monitor execution plans in real-time. In the past, it was not possible to monitor query plans while the SQL statement was still running. Our free software lifts these restrictions. You can now see exactly what is happening on your server – live and in real-time. You can download the software for free from our GitHub page. As always, we encourage you to contribute to our Open Source solution and to send patches. pg_show_plans is a free extension for PostgreSQL. Download it directly from our GitHub page. It uses PostgreSQL core functionality to provide you with all the insights you need. Data is exposed as a simple view and can be easily fetched. As a result, pg_show_plans can be attached to any monitoring system of your choice. We have already successfully implemented it within our extensive monitoring solution PGWatch. Internal executions are efficiently stored in shared memory. That makes it easy to retrieve information quickly, as well as to filter those plans. If you have any questions or want to discuss your company’s situation with us in person, feel free to contact us! We offer timely delivery, professional handling, and 20 years of PostgreSQL experience. You need to load content from reCAPTCHA to submit the form. Please note that doing so will share data with third-party providers. You are currently viewing a placeholder content from Facebook. To access the actual content, click the button below. Please note that doing so will share data with third-party providers. You are currently viewing a placeholder content from X. To access the actual content, click the button below. Please note that doing so will share data with third-party providers."
