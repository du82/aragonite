["https://cybertec-postgresql.com/our-products/cypex-online-academy"]
title = "CYPEX Online Academy"
description = "How do I quickly create internal apps for my business? Use CYPEX Online Academy to launch your PostgreSQL-based app with a low-code approach."
full_description = "Start with an overview of the dashboard. Once you understand the basics, graduate to the more nuanced aspects. For example, you’ll learn how to use location data, or how to insert JavaScript notation for the most flexible and beautiful charts. Not only will you come away with fresh knowledge of how to quickly build applications, you’ll see how easy it is to use CYPEX for truly astonishing results. It’s a low-code approach that you can instantly update. We provide you with a Git repository which allows you to download, install and configure it. All containers are provided for direct use. As CYPEX can be connected with existing databases, you’ll need to provide information to tell it where PostgreSQL can be found (such as: host, port, and database name). The admin panel is a core component of CYPEX – it allows you to gain an overview of which applications exist and to define new applications by adding workflows. The predicted application is then modified by the user to satisfy their needs. The application section within the admin panel helps users generate new apps. A user can select a handful of queries (or all of them) and provide some meta data. The CYPEX engine will use this information to make predictions. In this chapter, you’ll learn how to create your first CYPEX application in just over 10 minutes. You’ll start with a data model and end up with a full-fledged application. Once you’ve become familiar with the admin panel, move on to the CYPEX model builder . The CYPEX model builder allows you to inspect the current data model as it is in PostgreSQL and define basic CYPEX objects such as queries, workflows, etc.Furthermore, default queries are a core concept of the entire CYPEX system. Learn how to mark which tables you need with the help of a default query. The default query is assigned permissions. Depending on the extent of the user’s permissions, the query will be available as a data source in the GUI or will be unavailable to that user. Another tool we provide helps construct queries. Plain tables are often not a good data source. You’ll need joins, aggregations, windowing functions, etc. To make sure that such operations are permitted, make use of ourquery builder."
