["https://www.cybertec-postgresql.com/en/join-strategies-and-performance-in-postgresql"]
title = "Join strategies and performance in PostgreSQL | CYBERTEC PostgreSQL | Services & Support"
description = "UPDATED Feb 2023: Join strategies are crucial for understanding execution plans and tuning queries. Get tips for PostgreSQL query tuning."
full_description = "<img alt='' src='https://secure.gravatar.com/avatar/5e44226cb2bd7aa1d694acd32b4fc09c?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/5e44226cb2bd7aa1d694acd32b4fc09c?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> rbohush says: July 28, 2020 at 8:32 pm Perfect article. Thanks a lot! Reply <img alt='' src='https://secure.gravatar.com/avatar/22a54f3afc15ed6aa805b7d5b4293640?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/22a54f3afc15ed6aa805b7d5b4293640?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> Rama says: August 17, 2020 at 6:18 am Nice Article. Fan of Cybertec. Reply <img alt='' src='https://secure.gravatar.com/avatar/3a5fcecf6ecac297e92f61e2052cd2e3?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/3a5fcecf6ecac297e92f61e2052cd2e3?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> Guillermo E. Villanueva says: September 17, 2020 at 1:50 pm muy bueno! Reply <img alt='' src='https://secure.gravatar.com/avatar/3d9ca327ed8558854fffe1b0782819c6?s=32&#038;d=mm&#038;r=g' srcset='https://secure.gravatar.com/avatar/3d9ca327ed8558854fffe1b0782819c6?s=64&#038;d=mm&#038;r=g 2x' class='avatar avatar-32 photo' height='32' width='32' decoding='async'/> yhuelf says: February 23, 2023 at 3:36 pm Hi Laurenz, Are you sure that the outer relation is always scanned sequentially with nested loop join? Are you sure that both relations are always scanned sequentially with hash join? I think that an index can be used for both relations and both strategies. Here is an example : explain (costs off) select a,foo.b from foo join bar using(a) where foo.b = 'c81e728d9d4c2f636f067f89cc14862c'; QUERY PLAN -------------------------------------------------------------------------- Hash Join Hash Cond: (foo.a = bar.a) -> Bitmap Heap Scan on foo Recheck Cond: (b = 'c81e728d9d4c2f636f067f89cc14862c'::text) -> Bitmap Index Scan on foo_b_idx Index Cond: (b = 'c81e728d9d4c2f636f067f89cc14862c'::text) -> Hash -> Index Only Scan using bar_a_idx on bar But I might have misunderstood what you wrote. If not, I can paste the full test case somewhere. Best regards, Frédéric Reply"
