["https://cybertec-postgresql.com/cypex-rapid-prototyping"]
title = "CYPEX Rapid Prototyping"
description = "Rapid prototyping builds a user experience from customer feedback instead of trying to work from a spec. Save time and prevent stress."
full_description = "Get rid of that giant chain of command and catch failure early with a rapid feedback loop. Avoid customer dissatisfaction with results that don’t fit customer needs. Get out of the emergency meeting trap and improve efficiency. However, normally a prototype takes weeks or even months to develop from a specification. Why wait that long to find out you have a basic misunderstanding which creates a load of extra work to correct? With CYPEX Rapid Prototyping, you can quickly and easily create an application from your PostgreSQL database that you then discuss with your customer, correcting misunderstandings up front and ending with a far better result: happy customers and less stress for your team. 1. First, import your data. A basic prerequisite is the creation of tables and schemas in your database. (outside of CYPEX) 4. Create queries: Admin user defines how to access data in data model with the queries (How is data displayed to managers?) 6. Generate Application: more than one application can be generated from the same data, and depending on permissions. 8. Finalize Data Model: Admin edits data model, updates workflows, queries and permissions, and generates final application. 9. Make it beautiful: When the customer review of the data model is complete, applications can be enhanced with charts, graphs, maps, etc. By speaking directly to the customer and using the CYPEX rapid prototyping process to get early feedback, you catch misunderstandings early on and prevent lost hours of wasted work. With rapid prototyping you immediately notice when you have produced something the customer doesn’t really want. Eliminate the need for a specification. The resulting application is clickable, easy to understand and flexible. 1. Setting Default Lookups allows Admins to define exactly how a particular entity should be displayed, for example whether the name of a company or the company’s address should be displayed in the app. 2. Auditing prevents data loss and allows you to create a data trail; it keeps track of all data modifications."
