["https://www.cybertec-postgresql.com/en/catchment-areas-with-postgresql-and-postgis"]
title = '"Catchment areas" with PostgreSQL and PostGIS | CYBERTEC'
description = "This article explains how to partition an area of interest spatially: Approximation of customer potential using PostGIS. Catchment areas."
full_description = "Recently a colleague in our sales department asked me for a way to partition an area of interest spatially. He wanted to approximate customer potential and optimize our sales strategies respective trips.Furthermore he wanted the resulting regions to be created around international airports first, and then intersected by potential customer locations, in order to support a basic ranking. Well, I thought this would be a good opportunity to experiment with lesser-known PostGIS functions ????. In our case, customer locations could be proxied by major cities.It's also worth mentioning that I only used freely available datasets for this demo. Our sales team will kick off their trips from international airports in Germany, so we require locations and classifications of airports from Germany. Airports can be extracted from OpenStreetMap datasets filtering osm_points by Tag:aeroway=aerodrome. Alternatively, any other data source containing the most recent airport locations and classifications is welcome. For our demo, I decided to give a freely available csv from “OurAirports” a chance ????. In addition, I used OpenStreetMap datasets to gather both spatial and attributive data for cities located in Germany. To do so, I downloaded the most recent dataset covering Germany from Geofabrik and subsequently triggered the PostGIS import utilizing osm2pgsql. Please checkout my blogpost on this topic to get more details on how to accomplish this easily. At the end of this article, you will find data structures for airports, osm_points and osm_polygons (country border). These are the foundation for our analysis. Let’s start with cities and filter osm_points by place to retrieve only the major cities and towns. Since we are only interested in international airports within Germany, let’s get rid of those tiny airports and heliports which are not relevant for our simple analysis. So far, so good. It is time to start with our analysis by generating catchment areas around international airports first.Instead of creating Voronoi polygons (Voronoi-Diagrams) using our preferred GIS-client, let us instead investigate how we can accomplish this task using only PostGIS’ functions."
author = "Florian Nadler"
year_published = 2021
year_updated = 2024
