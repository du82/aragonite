["https://www.cybertec-postgresql.com/en/turning-xlog-into-json"]
title = "Turning xlog into JSON"
description = "You need to load content from reCAPTCHA to submit the form. Please note that doing so will share data with third-party providers."
full_description = "Nowadays JSON is used pretty much everywhere. It's not only web developers who like JSON. It is also used for configuration, data transfer, and a lot more. Luckily PostgreSQL is pretty good at JSON. Recently I have discovered a module called wal2json, which even allows the transformation of xlog to JSON. The module can be found here: https://github.com/eulerto/wal2json The module can be compiled just like any other contrib module. Once it has been installed, postgresql.conf can be adapted to allow replication slots: The real beauty here is that all PostgreSQL JSON functions can be used to process the JSON stream. It is pretty easy to do ex-post analysis on the changes fetched from the xlog. In order to receive regular updates on important changes in PostgreSQL, subscribe to our newsletter, or follow us on Facebook or LinkedIn. You need to load content from reCAPTCHA to submit the form. Please note that doing so will share data with third-party providers. You are currently viewing a placeholder content from Facebook. To access the actual content, click the button below. Please note that doing so will share data with third-party providers. You are currently viewing a placeholder content from X. To access the actual content, click the button below. Please note that doing so will share data with third-party providers."
