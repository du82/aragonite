["https://cybertec-postgresql.com/services/migrating-to-postgresql/migrating-from-mysql-mariadb-to-postgresql"]
title = "Migrating from MySQL / MariaDB to PostgreSQL"
description = "The key to migrating from MySQL or MariaDB is the fact that data has to be cleaned before imported into PostgreSQL, as both do not handle constraints well."
full_description = "MySQL and MariaDB are by far the most widespread Open Source database systems around. Still, many users out there are not satisfied with what MySQL and MariaDB have to offer. Migrating from MySQL or MariaDB to PostgreSQL is, therefore, a logical step and makes a lot of sense from a technical point of view. MySQL and MariaDB have a totally different historical background. Traditionally, MySQL has been used as a small web database and it still powers millions of websites. However, proper handling has often been sacrificed in favor of speed and ease of use. To use MySQL vs. PostgreSQL is not an ideological issue – it is a purely technical one. Check out the following selection as an example. If you agree that a database is allowed to silently change your data or make “wise decisions” for you, MySQL and MariaDB are just fine. If you get the feeling that this is a bad thing, save your data and move to PostgreSQL. Note that these are just a few examples. If you want to see a more extensive (yet far from complete) compilation of problems, consider watching the following video. If you want to move to PostgreSQL, we are more than willing to help. We use a modern toolchain including mysql_fdw, pg_chameleon as well as many custom made scripts, which make the migration process easy and smooth. The key to MySQL / MariaDB migration is the fact thatdata has to be cleaned before imported into PostgreSQL.MySQL / MariaDB does not handle constraints well” We provide professional services to customers around the world who want to get rid of MySQL and move to a more professional database engine such as PostgreSQL. Contact us today to receive your personal offer from CYBERTEC. We offer timely delivery, professional handling, and 20 years of PostgreSQL experience. You need to load content from reCAPTCHA to submit the form. Please note that doing so will share data with third-party providers. You are currently viewing a placeholder content from Facebook. To access the actual content, click the button below. Please note that doing so will share data with third-party providers."
