["https://cyberthon.hci.edu.sg/faq"]
title = "FAQ | Cyberthon"
full_description = "Frequently Asked QuestionsThe Answers You NeedQ1. Are there any prerequisites to participate in the competition?Participants are in (the equivalent of) Junior College/Millennia Institute Year 1 to Year 3. Participants should have basic knowledge in IT and an interest in IT security. Knowledge in scripting and programming will be advantageous.Q2. How many members can there be in a team?Each team comprises four students from the same school, all of whom are required to participate in a three-day training workshop organised by the Centre for Strategic Infocomm Technologies (CSIT).Q3. How can I register for Cyberthon?To participate in Cyberthon, form a team of 4 and approach your teacher-in-charge to indicate your interest and submit your team’s particulars. The teacher-in-charge of your school shall then collate and submit the list of all participating teams to the Cyberthon Organising Committee via the registration link which has been sent to them. Q4. Are the training workshops compulsory?Yes. The training workshops are compulsory and will be held online prior to the competition.Q5. What should I bring to the training and competition? All participants are required to use their own laptops for the Training Workshop and competition. Please note that M1/M2/M3 MacBooks are not supported. The minimum specifications required of participants’ laptops are as follows: Processor: Intel Core i5 Processor Memory: 8GB Ram Storage: Min 80GB HDD Connectivity: Wireless and Wired Internet Connection Operating Systems: Windows, Mac or Linux Note: VM image with recommended software will be provided for use.Q6. What is the format of the competition?The competition will be in a Jeopardy Style Capture-The-Flag Competition format. ​ Teams will attempt to earn the most points by solving various challenges. At the end of the competition, points scored by each team will be added. In the event of a tie, the time taken to solve the challenges will be the tiebreaker. ​Q7. Are the staff fun teams eligible for the prizes?The staff fun teams may attend the online trainings prior to the competition. They will attempt the same challenges as the student participants and be placed on the same scoreboard. ​​ The staff fun teams are not eligible for the prizes. However, a certificate of participation will be presented to all participants."
