title = "About the Logo | Cyberthon"
full_description = 'About the LogoDesigned by Chua Zhuo Rong Roger, 18S68, Hwa Chong InstitutionThe design takes the form of a shield, which represents the endeavour to groom youths in cybersecurity. The outline of the shield is transformed into the abbreviation CT, short for Cyberthon. Bold spaces left between the alphabets of "Cyberthon" provide a sleek, modern appearance to the logo. Red is infused into the motif as a representation of external threat; however, the dull red used here implies that dangers can be suppressed with our collective effort. The dark shade of blue employed in the logo embodies righteousness and responsibility - with the power of Internet comes our role to use it peacefully, to regulate vigilantly, and to protect the innocent and defenseless dutifully.'
