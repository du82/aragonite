title = "About CSIT | Cyberthon"
full_description = "About CSITCentre for Strategic Infocomm TechnologiesThe Centre for Strategic Infocomm Technologies is a technical agency in the Ministry of Defence that harnesses cutting-edge digital technologies to meet Singapore‘s security needs. CSIT develops capabilities to support missions such as cyber defence, counter-terrorism and counter hostile information operations. We analyse data to discover potential threats, conduct deep technical investigations, develop new capabilities and provide threat intelligence to support national level efforts in countering threats. Our technical focus areas include Cybersecurity, Data Analytics, Software Engineering, and Cloud Infrastructure and Services. CSIT is a member of the Defence Technology Community.Learn More"
