["https://cygwin.com/mirrors.html"]
title = "Cygwin Mirror Sites"
full_description = "The following sites have generously agreed to mirror our Cygwin package repository. To save on download time, please select a mirror near you when using setup to install or update Cygwin. Note: We automatically poll these mirrors periodically to ensure that they have the latest Cygwin packages available. The list of mirrors below reflects all of the mirrors who appear to have up-to-date copies of the Cygwin package repository. If you would like to be added to this list of available mirrors then send email to the cygwin mailing list. When you send your message, remember that this site does not accept html-formatted email. When asking to be added, please provide contact information, the URL of the mirror, and the location of the mirror (in a similar format to that used for existing mirrors in the mirror site list). Make sure that your mirror rsyncs directly from cygwin.com at least twice a day. Please do not send questions asking how to set up a mirror. We don't provide technical support for setting up mirrors. Sorry. The mirror list is automatically maintained so that only active mirrors are listed. A mirror is temporarily removed from the list if it remains out of date for more than 24 hours. If your mirror was dropped from the list, do not panic. It means that a program has determined that the content on your mirror is not up-to-date. Ensure that your mirror is up-to-date. It will be added again automatically once it has has up-to-date content. There is no need to contact anyone about this. Mirrors which remain out-of-date for more than 28 days are manually reviewed (sporadically), and disabled if the owner is unresponsive."
