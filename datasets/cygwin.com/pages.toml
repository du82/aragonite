["https://cygwin.com/contrib/dll.html"]
title = "Cygwin Contribution"
full_description = '''Note: The newlib library (used by Cygwin for some common "libc"-like functions) has different contribution rules. See their project page for more information. The code corresponding to cygwin1.dll is mostly in the winsup directory with additional code coming from newlib/libc and newlib/libm. Any changes you make should be to the current development sources. This makes it much easier to integrate your changes once they're completed and tested. Note that the current Git tree should compile, but it should always be assumed to be unstable since it contains potentially untested, experimental code. Once you've checked out the sources, you will be able to avail yourself of the "how*" files in the winsup/cygwin directory. These are developer-written files which summarize various techniques involved in cygwin design. You should familiarize yourself with their content before making changes to the subsystems that they describe. If your change is going to be a significant one in terms of the size of your code changes, be aware that for changes to all source files under the "winsup" directory you will have to license your code changes under the 2-clause BSD license before we can include your changes in the main source tree. (This is necessary for the next few years so that Red Hat can meet its continuing obligations to Cygwin buyout license customers while Cygwin transitions away from this licensing model.). To do this, just make a public statement that you provide your patches to the Cygwin sources under the 2-clause BSD license. You can do that with your first patch submission. After your first patch has been approved and applied, your name and email address will be added to the new winsup/CONTRIBUTORS file. For the wording of the 2-clause BSD license, see the winsup/CONTRIBUTORS file in the Cygwin git repository. If you already have a Cygwin Copyright Assignment signed and submitted, you can ignore this procedure. If you're not sure if you already signed the Copyright Assignment, see the list of signees in the winsup/CONTRIBUTORS file.'''
year_published = 2025
