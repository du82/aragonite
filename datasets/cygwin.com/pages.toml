["https://cygwin.com/git.html"]
title = "Cygwin in Git"
full_description = "The sources to the core Cygwin libraries and utilities (Cygwin and Newlib) are available via anonymous Git access. If you don't know what Git is, visit the Git home page. Coincidentally enough, Git comes with the Cygwin net release. Starting December 2022, regular, automated test releases are created whenever a significant patch is pushed to the Cygwin git repository. You can download the cygwin package test releases just like any other test release for any Cygwin package using the Cygwin Setup program. This allows following development even if you're not comfortable with Git. The cygwin.com website is under Git control, too. You can also view the website Git repo via a web interface. Note that this is only the framework. The User's Guide, API and FAQ are maintained as part of the aforementioned Cygwin source Git repository."
