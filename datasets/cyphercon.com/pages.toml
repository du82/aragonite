["https://cyphercon.com/portfolio/attention-takeover-leveraging-hacker-infamy-to-make-yourself-a-trusted-resource"]
title = "Attention Takeover: Leveraging Hacker Infamy to Make Yourself a Trusted Resource – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "Too often, a communication gulf between IT professionals and their colleagues is a contributing factor in cybersecurity incidents. At the same time, popular media is awash in tales of crime, deceit, and the transfers of seven figure fortunes. How is it that cyber defenders can have difficulty capturing attention while cybercrime has gained such notoriety? And how can IT professionals leverage this notoriety to improve their organizations’ cybersecurity awareness and posture? Brad Wagner, a cybersecurity professional and volunteer incident responder with the Wisconsin Cyber Response Team, will demonstrate. Foregrounding incidents that have impacted Wisconsin, Wisconsinites, and the presenter personally, Brad will talk through how these attacks were conducted as a prerequisite to understanding the actions that effectively defend against them. Combining a fast pace, a lighthearted feel, and candid assessment, the presentation will outfit attendees with ideas for cybersecurity watercooler chatter or formal training sessions. It will show that common hacker techniques can be understood by everyone. And its messaging may improve your organization’s cybersecurity communication enough to thwart a coming attack. Importance: It’s extremely common for smart people who are good at their jobs to despise their mandated security training. They may be leery of engaging their cybersecurity team with a potential issue for fear of a punitive response. They might be afraid of asking a silly question of a technology guru. All these scenarios make us and our organizations less secure. The attackers are gifting us tools to capture our colleagues’ attention and earn their trust. Let’s take advantage. Brad Wagner is the Director of IT at Christensen Associates, an applied microeconomic consulting firm in Madison, Wisconsin. His role includes protecting the digital identities of his colleagues as they analyze data provided by electric utilities, antitrust litigants, and the US Postal Service. Brad provides security training to middle schoolers and PhDs with surprisingly similar slide decks. Brad is a CISSP and a grateful, voracious consumer of the training and experience offered by the Wisconsin Cyber Response Team, where he volunteers as an incident responder."
year_published = 2025
