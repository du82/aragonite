["https://cyphercon.com/portfolio/creating-an-application-security-program"]
title = "Creating an Application Security Program – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "An effective application security program can result in fewer production issues, less rework and fewer security issues. Creating an application security program is a daunting task, not only do you have to get management on-board, but more importantly getting the development teams buy-in. In this talk we’ll discuss who, besides the development teams, that are needed to make the program successful and the types of testing and when it should be done during the development lifecycle. Importance: Security is not normally listed as a feature that the development teams need to implement. As the application security champion/manager you must remember that the development teams are evaluated on the number of features they complete, not the number of security features they implement. By not having rework of production issues, due to security problems, not only saves time but reduces overall development costs. Having a complete application security program, from requirements through post-production testing, not only improves code quality, reduces security risks and contributes to an organization’s overall software development maturity and cybersecurity program level. Ken Kazinski is the manager of Abbott Laboratories Application Security Management team and has over twenty years of experience in the field of cybersecurity. His current cybersecurity focus is in application security, which is enhanced with his substantial knowledge of system security in both government regulated and non-regulated industries. These environments have provided him with a deep contextual understanding on the impact of security in a variety of organizational environments. In his role at Abbott, Ken provides leadership, program vision, and integration guidance on attack surface areas, including Threat and Vulnerability Management, Application Security, Cloud Security, Mobility, and Brand Reputation. As an Air Force veteran with a Master of Science in Cybersecurity, Ken has used both his professional and educational experience to create critical application security programs at multiple Fortune 100 companies. Prior to joining Abbott, Ken managed application security for Johnson Controls, Power Solutions division. His professional and military experience has provided him with the opportunity to work and live in multiple countries around the world."
year_published = 2025
