["https://cyphercon.com/portfolio/how-do-you-eat-an-elephant-byte-by-byte"]
title = "How do you eat an Elephant? Byte by Byte! – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "Security has become the 500 ton elephant in the room. We all know it, we all get overwhelmed by it and we all have to deal with it. So how do we deal with it? As the old saying goes you eat an elephant byte by byte. Let us take a look at how we can potentially manage such a huge task and convey that to our management. Importance: With the amount of overcomplication leading to the lack of getting the simple portions done in security, we become overwhelmed and paralyzed by imposter syndrome. This talk will give basic blocks to attack it all while being effective. Michael “Shecky” Kavka has been in the professional world of IT for over 25 years and focused specifically on Information Security – Blue Team Disciplines for the past 9 and has earned the CISSP and GCIH certifications. He started programing computers as a child in the early 80’s and by 1986 found a love of cyber security which his High School Computer Administrator (of the PDP 11+ system they had) encouraged, having him and a friend do a 6-week teaching of security after finishing the AP Computer exam his senior year. Besides currently working as a Senior Security Engineer and SOC analyst for a privately owned trading company, Shecky has spoken at B-Sides Chicago, Cyphercon, CircleCityCon, and PancakesCon. He is a volunteer for Hak4Kidz, working with the next generation of cyber security practitioners and is an organizer of Chicago’s Burbsec and Chicago Loop Infosec meetups. Outside of the world if information security you will find him with his family and enjoying his hobbies of photography and model trains. You can find him on Twitter @SiliconShecky and his blog at www.siliconshecky.com"
year_published = 2025
