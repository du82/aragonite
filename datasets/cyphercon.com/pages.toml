["https://cyphercon.com/portfolio/esp32-gattacker-bluetooth-low-energy-mitm-for-the-masses"]
title = "ESP32-Gattacker: Bluetooth Low Energy MITM for the Masses – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "As the demand for lightweight, powerful, and IoT-compatible devices grows, so do the security risks they face. According to the Bluetooth SIG 2024 Market Update, by 2028, 7.5 billion Bluetooth devices are expected to be shipped annually. To safeguard this rapidly expanding infrastructure, there must be a diverse and cost-effective ecosystem of tools that enable security researchers to inspect Bluetooth Low Energy (BLE) devices for vulnerabilities. This talk will provide a brief overview of BLE, examine existing Machine-In-The-Middle (MITM) tools, and detail the process of implementing Gattacker, a BLE MITM attack tool, for the ESP32 SoC—a low-cost, low-power microcontroller widely used in IoT devices. We will discuss the motivations behind this project, the technical challenges faced, and the new opportunities it offers for researchers and red teamers, while providing insights valuable for blue teams. The session will include a demo and conclude with the release of the project as open-source. Importance: Current tools and education surrounding BLE are limited and disorganized. By introducing firmware that runs on a $5 ESP32 development board with an intuitive user interface, this project aims to democratize BLE research for a broader audience. Compared to other solutions, ESP32-Gattacker stands out as the most modern, cost-effective, and open-source BLE MITM solution available. Tyler Grant is a Senior Consultant at SysLogic Inc. with a software engineering background and a passion for security and building resilient applications. With over 11 years of experience in software development and cybersecurity, he has worked across academic, commercial, and start-up environments, focusing on innovative security solutions and application development. In his spare time, he enjoys researching various technologies and pushing the boundaries of 3D printing, focusing on projects that integrate electronics for unique creations."
