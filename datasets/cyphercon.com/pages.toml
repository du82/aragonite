description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "Your work speaks for itself, but is anyone listening? In a crowded tech landscape, your personal brand is the key to unlocking new opportunities. This session is designed for introverts and innovators alike who know they need to stand out but don’t want to waste hours figuring it out. Terra L. Fletcher, a 17-year marketing expert, will teach you how to share your expertise strategically, showcase your value, and attract the right attention—all in a way that fits seamlessly into your busy schedule. Walk away with a customized plan that will get you noticed, increase your influence, and fast-track your career in tech. Get noticed. Get ahead. No wasted time. Importance: Tech professionals are often brilliant but struggle to create a reputation that truly showcases their skills. This session helps them assess their digital presence, improve it, and grow their influence—without sacrificing time from their other pursuits. Terra L. Fletcher is the author and fractional CMO who talks about content strategy for organizations needing a rebrand and individuals looking to position themselves as thought leaders. Terra is the founder of Fletcher Consulting and the author of three books, including “Flex Your Communication: 47 Tips for Every Day Success at Work,” “Flex the Freelance: An Unconventional Guide to Quit Your Day Job,” and the soon-to-be-released “Flex Your Marketing.” As a business builder, Terra is strategic, efficient, and precise, ensuring her clients get measurable results."
