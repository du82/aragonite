["https://cyphercon.com/portfolio/a-little-help-from-my-friends"]
title = "A Little Help From My Friends – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "In this talk we will dive headfirst into the world of physical security assessments, going over an operation workflow from OSINT to External Reconnaissance to Physical Entry and various social engineering constructs. We will review tooling and tactics that we have used in the field in successful operations, issues that have arose last minute and waters we overcome as well as some interesting stories from the field. Importance: The importance of this talk is for awareness and to let people interested in this type of work to know they can do this with the right mindset. Michael Aguilar (v3ga) is an offensive security operator at Secureworks, specializing in adversary simulations, physical security tests, and network penetration testing. With a hacker’s mindset and a passion for uncovering vulnerabilities, v3ga thrives on the challenge of thinking like an attacker to keep organizations secure. When not breaking into networks or buildings (ethically, of course), they’re cranking loud, fast music that echoes their relentless energy. A runner and cyclist with a love for the open road, v3ga balances the precision of their work with the freedom of movement. Always forward-thinking, always in motion, they bring the same intensity to life as they do to the cybersecurity battlefield."
