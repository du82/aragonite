["https://cyphercon.com/participate"]
title = "Participate – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "Wanna get in on the action? Join us! See what you can do Sponsor usWe’ll just cut right to it; We want you to sponsor CypherCon. Join over 40 other organizations that support Wisconsin’s Largest Technology & Cybersecurity Community! We are just a mom & pop conference, we’ll listen! Tell us what your goals are. Looking to get your brand out there? Looking to showcase your services? Want to meet executives or red teamers? Want to hire amazing local talent? We offer high traffic sponsor tables in the hallways. We are seeking companies interested in sponsoring CypherCon to help create an amazing environment and help elevate and socialize the industry here in Milwaukee, Wisconsin. We customize! CypherCon loves sponsors willing to offer hands-on activities beyond just sales, as well as offering interesting and innovative solutions to our attendees.Get in on the action Become a speakerOur 2025 Call for Presentations current status is CLOSED. Meaning, We want you to consider next year, submit something by the end of 2025 for Spring 2026 to share with our community. Make sure you submit something by 12/31/2025! You get a free 2026 speaker badge! =) Plus other things, trust us, we take care of you! First time speaker? Awesome!!! Apply! Returning speaker? Awesome!! Apply! We close our call for speakers at the end of the year each year. Submit today!CypherCon 9.0 (2026) seeks proposals on interesting content to make this an exciting event for our attendees and beyond by sharing recordings for those that are unable to attend. CypherCon encourages submissions on all types of topics but selection emphasis will direct towards hacker topics, 2026’s theme is ‘TBA’, we are seeking topics of various types. As always, We change our theme each year, CypherCon 9.0 (2026) will have a new theme and will be noted at the 2025 closing ceremony.Join as a speaker Call For ArtistsThe CypherCon 8.0 (2025) Call for Artists is OPEN! Interested in creating unique and creative pieces? Physical or Digital Art? Make Music? Create Video? We offer free artist badges for 2025. Contact us on how to get involved.We are seeking all types of hacker related art. Grants available.Share your art with CypherCon Become a VolunteerHave you been to three or more CypherCon events and want to do more? Be forewarned, by volunteering, you WILL have to work long hours during the conference dates and miss out on lots of the fun. A ton of effort goes on behind the scenes to ensure everyone has a great time. That sounds rewarding, doesn’t it? Give back & Enrich the Wisconsin hacker community by helping run the show and meet some amazingly talented locals! We need talent of all types! Help us fill in this blank canvas! Know how to code? Are you a writer? Want to be part of a village? Have an idea or project that CypherCon should take on? We are community. Don’t just ask if you can volunteer, tell us how you want to get involved!If you have not been to a CypherCon. We recommend starting by getting involved in a specialty, perhaps with a village! Into lock-picking, AI, or bio-hacking? There is a place for you! Into hardware and firmware? Also a place for you! We are happy to give you an introduction.Contact Us Create a puzzle or cypherYou made it this far down the page. You must enjoy diving into details. Maybe you enjoy codes and puzzle creation? Interested in filling in part of our blank canvas by sharing a “hacker related” puzzle with the community? We’d love to see what you have in mind and help you publish your content. We include hundreds of puzzles during, before, or even after the event!Our most devoted attendees seek out a deeper layer of our annual hacker event. Right in the name of the conference is “Cypher” denoting “a secret or disguised way, of writing; encoding, of codes.” Since the birth of CypherCon there has been something deeper going on beyond the top layered glamour of our hacker culture full of art and music, the many social interactions and friendships, the presentations, the villages/security specializations, competitive and tricky contests. Found throughout the CypherCon events are various storylines of puzzles series revealing themselves in slightly disguised anomalies at every direction.Those devoted attendees beg you to help us display your ingenuity in puzzles. Join us =)Submit your puzzle"
