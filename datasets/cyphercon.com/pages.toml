["https://cyphercon.com/portfolio/filling-gaps-in-ai-governance-how-iso-iec-42001-shapes-the-future-of-ai-risk-and-compliance"]
title = "Filling Gaps in AI Governance: How ISO/IEC 42001 Shapes the Future of AI Risk and Compliance – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "In this presentation, we will explore the emerging gaps in AI governance and how the newly released ISO/IEC 42001 framework addresses these critical issues. As AI technologies evolve rapidly, organizations face increasing challenges in managing risks related to ethics, security, transparency, and accountability. This talk will provide an in-depth analysis of ISO/IEC 42001’s role in mitigating these gaps and aligning governance frameworks with the unique demands of AI systems. Attendees will gain actionable insights on how to integrate these principles into their risk and compliance strategies while ensuring ethical and secure AI practices. Whether you’re a technologist, hacker, or executive, this talk will provide a roadmap to navigate the complexities of AI governance effectively. Importance: This talk is important because it bridges a critical knowledge gap at the intersection of AI innovation and risk management. With AI increasingly being integrated into high-stakes applications, the lack of robust governance frameworks exposes organizations to ethical, legal, and security risks. ISO/IEC 42001 provides a much-needed structure to address these challenges, but its adoption is still in its infancy. By presenting this talk, I aim to: Raise awareness of the framework among practitioners. Highlight practical steps for implementation. Foster discussions about the future of AI governance in cybersecurity and technology fields. The content is timely and will resonate with CypherCon’s diverse audience, empowering attendees to better navigate the rapidly evolving AI landscape. Kartik Khurana is an accomplished cybersecurity professional currently pursuing a Master’s degree in Cybersecurity (Analytics and Operations) at Pennsylvania State University. Specializing in Governance, Risk, and Compliance (GRC), Kartik has developed a strong foundation through extensive academic studies and practical experience, including five internships in areas such as penetration testing, auditing, cloud security, and identity and access management."
year_published = 2025
