description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "Josh Knox will present on the topic of supply chain attacks targeting trusted software. The talk will cover recent incidents that have affected major organizations, examining the complex nature of software binaries that include proprietary, commercial, and open-source components. Knox will discuss why traditional security measures, including Software Bills of Materials (SBOMs), may not fully address current risks. He will outline a comprehensive approach to software security, including: Source code analysis Vulnerability detection Malware identification Tamper protection Behavioral analysis The presentation will include examples of attack scenarios, such as compromises of open-source packages, build processes, and package registries. Knox will use the recent xz utils backdoor incident as a case study. This presentation aims to provide factual information and insights relevant to cybersecurity professionals, software developers, and IT decision-makers. Importance: The presentation will include examples of attack scenarios, such as compromises of open-source packages, build processes, and package registries. Knox will use the recent xz utils backdoor incident as a case study. This presentation aims to provide factual information and insights relevant to cybersecurity professionals, software developers, and IT decision-makers. Joshua Knox is Cybersecurity Technologist and Evangelist specializing in Secure Software Supply Chain, CI/CD, Kubernetes and Kubernetes security. Prior to this role Knox was a Principal Engineer focusing on automation and application development. Before transitioning to the IT industry, Knox was a High School teacher. For many years he taught python and javascript to his students. Once switching his career he has quickly moved through many roles, gathering certifications for Cloud, Kubernetes, and Security along the way. When he is not working with his team, you can find him working on his home lab, building a new machine, studying for his next cert, or hacking CTF boxes."
