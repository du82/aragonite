["https://cyphercon.com/portfolio/become-a-quantum-computer-encryption-of-the-future-today"]
title = "Become a Quantum Computer – Encryption of the Future, Today – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "Don’t sit around and wait for quantum computers to change everything you know about encryption – gain quantum cryptographic skills right now by learning the mathematical algorithms used in today’s encryption, or more specifically, how to break them. In a way that’s not scary, Abby will begin with a brief review of the necessary math concepts and then dive into several examples of the math behind RSA and ECC encryption. From there you will learn what goes into breaking these encryptions and why quantum computers can do it so quickly. But why stop there? Go even further by traveling with Abby into the future to study post quantum cryptography, the main defense against the quantum machine. Abby Bick is a PKI Software QA Analyst at Keyfactor. She graduated from Eastern Michigan University with a degree in Mathematics and uses this background to study the exciting world of PKI, including PQC and other cryptographic algorithms. She also dances ballet and jazz in her free time and loves international travel – having been to over 7 countries."
