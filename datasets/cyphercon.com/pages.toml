["https://cyphercon.com/portfolio/crisis-management-101-how-to-manage-the-unexpected"]
title = "Crisis Management 101: How to Manage the Unexpected – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "Emergencies create impacts that we are not always able to anticipate, and they are rarely limited to a single person or department. There are ripples across the rest of your team and organization. Some of these are tangible or can be felt immediately, and some are more abstract. The most important part of Crisis Management is understanding how to manage the initial incident and its cascading effects and then learning how to manage the unexpected. In this session, we will explore how to identify and plan for potential impacts from different types of incidents. We will also discuss how to put frameworks in place for dealing with issues that seem to come out of nowhere. Attendees will walk out of this session with new information for how to identify upstream and downstream stakeholders, how to incorporate these stakeholders into their incident response and resilience planning, and how to create a response framework for managing all the unanticipated issues that will pop up. David Bernstein is a Principal Consultant with BSI. He has over 15 years of experience in emergency response, emergency management, and business continuity and resilience planning. He has supported clients in developing and overseeing enterprise resilience strategies with local and global footprints. In addition to strategic program development, David has also developed facility recovery plans and acted as a Subject Matter Expert (SME) to support COVID-19 safety and recovery efforts. Prior to being a consultant, he was an Emergency Manager in healthcare, leading initiatives spanning individual hospitals to multi-facility health networks. David has also acted as a strategic advisor on multi-agency initiatives at the local and regional level, including coalitions and consortiums ranging in size and scope. David holds internationally recognized credentials in Emergency Management and Business Continuity and brings significant experience in leading teams to develop corporate emergency response and business continuity programs, often from a ground zero start point."
year_published = 2025
