["https://cyphercon.com/portfolio/building-testing-dropboxes"]
title = "Building Testing Dropboxes – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "Sometimes, in pursuit of penetration testing goals, we need to put some hardware on the internal network. It sounds simple, a basic “dropbox” that provides testers a secure, stable, and stealthy(?) pivot into the network. However, putting together a usable testing dropbox that meets your project requirements and restrictions can quickly become a challenging task. In this session we discuss the decisions, options, and compromises we face in building out a dropbox. Understanding the choices to be made helps us build the reliable tools that support productive testing engagements. The testing goals we are looking to achieve help us define the dropbox we assemble. A covert Red Team challenging defender’s skills in detection, discovery, and attribution will require a very different build than a system supporting concurrent penetration testers and vulnerability scanning. We will cover the myriad of hardware, software, power, and communication decisions to work through and infrastructure needed to support those choices. Although specific hardware and software options will be mentioned, this presentation focuses on helping us make the best decisions from the available choices rather than providing detailed but instantly out-of-date build instructions. We will wrap things up by discussing some of the dropbox systems penetration testers and threat actors have been using in the field and cover a few legal considerations that will help keep you on the right side of the law. Importance: I’ve built this talk as a fun way to share my years of experience building dropboxes for penetration testing and red teaming. I’ve found there are a good number of guides, blog posts and even books about “how-to” but they are often quickly outdated and can result is a dropbox that might work great for the author but fails to meet the needs of the reader. Instead of repeating these efforts I wanted to provide the audience with an understanding of the choices that will make their builds work for them as well as provide some information on some of the more unique options that can be incorporated."
year_published = 2025
