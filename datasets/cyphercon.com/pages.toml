["https://cyphercon.com/portfolio/hardware-hacking-a-cheap-ip-camera-and-how-they-couldve-made-it-more-secure"]
title = "Hardware hacking a cheap IP camera (and how they could’ve made it more secure) – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "In this presentation, we’ll talk about various approaches to “hardware hacking” using a cheap IP camera as the target. Along the way, we’ll discuss various approaches and techniques to investigate, gain access to, extract firmware from the device. We’ll conclude with ways the vendor could’ve used to make the device more secure and the cost/benefit tradeoffs of those methods. Importance: I’m writing this talk because vendors and suppliers are making everything a “thing” in terms of IoT? Do we really need our toasters to be cloud connected? That’s a philosophical question I can’t answer, but I can talk about how thest “things” have poor or no security baked in, which puts everything they are attached to at risk. Hardware vendors can do a much better job, but they chose the path of cheapness and bottom line profit instead. Matt Brugman has variously been a controls, software, firmware, hardware, and security engineer. Most recently, he was employed at a major ICS vendor as part of their internal red team to perform software and hardware pentesting on critical infrastructure devices. He is now retired, which means he can work on whatever projects catch his attention. His certifications include TUV Rheinland CySec, OSCP, and 200 hour yoga teacher."
