["https://cyphercon.com/portfolio/how-a-broken-popsicle-stick-becomes-network-security-tales-from-the-cx-side-of-tech"]
title = "How a Broken Popsicle Stick Becomes Network Security: Tales from the CX side of Tech – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "In this presentation, I will address the security related horrors and laughs I’ve experienced working with End Users in the tech space, from my time at the Milwaukee School of Engineering’s IT Helpdesk, where a popsicle Stick became a network security tool, to the time a user attempted to get a account access restored at a health app, by claiming they were being hunted by the KGB. Along the way I’ll address the things I’ve learned, and the best lessons to take away. Importance: In Cybersecurity and technology, it’s easy to build good policy. But the best policy will be defeated by the worst end user faster than it can be written. Aaron Lee is a tech-native Professional with over a decade of experience working in diverse positions from End User support, to product management for AI, to Emergency Management. From writing children’s books, to contributing to Wikipedia, Aaron’s goal has always been to help people: with life, with health, with technology, or sometimes, just to get through the day."
