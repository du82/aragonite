["https://cyphercon.com/portfolio/decoding-deepfakes-ais-dual-role-in-digital-deception-and-detection"]
title = "Decoding Deepfakes AI’s Dual Role in Digital Deception and Detection – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "This session explores the intersection of AI, cybersecurity, and ethics in the creation and detection of deepfakes. We will have a look at tools like DeepFaceLab and DeepFaceLive to show how these deceptions are engineered and discuss cutting-edge detection methods. The presentation will also address the legal and ethical challenges posed by deepfakes, highlighting recent case studies and legislative developments. Attendees will leave with a deeper understanding of the technological, legal, and ethical dimensions essential for navigating and securing digital communications against AI-generated threats. Importance: This talk is important because it addresses the rapidly evolving world of deepfakes and AI’s dual role in both creating and detecting digital deceptions. As AI-generated content becomes more sophisticated, the risk of malicious use, such as fraud, misinformation, and identity theft, increases significantly. Understanding how AI techniques are leveraged to create deepfakes and, conversely, how AI can detect and counteract them, equips cybersecurity professionals with the tools to protect individuals, organizations, and society from these emerging threats. The talk highlights experimentation with tools like DeepFaceLab and audio deepfaking, providing real-world examples of how deepfakes work. It also fosters discussion about the ethical and security implications, offering strategies for mitigating these risks. This practical insight is critical for preparing organizations to defend against AI-driven deception and for fostering a proactive approach to evolving cyber threats. Kyle Hinterberg is a Senior Manager at LBMC and a recognized expert in PCI DSS compliance. As a systems administrator, he developed a strong IT foundation before joining the blue team. With over a decade of experience in cybersecurity, Kyle has had the opportunity to work in varied industries including healthcare, insurance, and retail, balancing the technical and political aspects of security & compliance. Dedicated to fostering innovation in cybersecurity, Kyle leads by example, engaging with the community through speaking engagements, podcasts, and mentoring. Outside of his professional realm, Kyle enjoys spending time with his family, his four dogs and his 3D printer."
year_published = 2025
