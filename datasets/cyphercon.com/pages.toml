["https://cyphercon.com/portfolio/controlling-developers-minds-through-first-principle-and-engineering-models"]
title = "Controlling Developers Minds Through First Principle and Engineering Models – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "Software Engineers don’t care about your security principles. Some just want to get paid, some are obsessed with the art and power in making. Here are some strategic models that snap into their existing principles to drive secure outcomes. This inception will infect every level of development, it is like hacking their mindset. I will explain why and how it works with some First Principle analysis. Importance: Generally infosec does not fix anything. They mostly whine around and break things. …and don’t point out they are mostly Assurance or they will have a parakeet. On the best days security fixes configuration and delivers patches. Software Engineers are the ones with all the power. They can make the configuration make sense. They can fill in security gaps and generally reduce the need for AppSec. But, Software Engineers seem to ghost the security team with a vengeance. Maybe because the security team tries to tell them what to do without any understanding? Maybe it is because development is tired of the Shovel Left approach security has taken by dumping useless information on developments doorstep in a paper bag that is on fire. It is not enough to ‘think harder’, or to ‘try to get along’. These platitudes have not been enough to make any lasting difference. The fundamentals are already in place in Software Engineering if we shine a light on them and make space for development to perform well. The SSEM is a model that aligns with existing software industry standards like a plate of cookies offered with a smile. Alton Crossley started writing code when he was 8yo, raised in the maker lifestyle but without the Internet. He started his technical career in front-line phone support in the 90s. After mastering support and before Broadcom ruined dial-up, he mastered Network Engineering and later Systems Administration. Software Engineering seemed to be the natural fit for the next 20 years until he could no longer avoid a Security title. For the last 5 years he has been happy to share insights into purposefully controlling the lifeblood of computing with an eye to security."
year_published = 2025
