title = "Intro to Badge Hacking: Essential Tools and Techniques for Embedded Device Testing – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "I have run hardware hacking villages at a number of hacker conferences, including CypherCon, and we regularly have people visit the village with questions and requests for tools which ends up being an impromptu crash course for beginners in hardware hacking. Getting started with device testing can feel like a daunting hurdle, but it doesn’t need to be. This talk provides guidance for assembling and using an inexpensive toolkit that can perform common testing and modification activities on hacker conference digital badges and other embedded systems. Importance: This talk is perfectly structured to raise interest in hardware hacking and help interested individuals move past the initial intimidating hurdles of knowing what tools and techniques to use, and of getting started without spending a lot of money. Kevin Bong is a Director at Ghostscale, responsible for overseeing penetration testing, risk assessments, compliance audits, incident response, and cybersecurity advisory services. Kevin has 20+ years working in a variety of cybersecurity leadership roles, including application development, network management, risk management, fraud monitoring, digital forensics, and assessment services. Kevin’s research interests include hardware and embedded systems, having initiated the MiniPwner penetration testing drop box project as well as designing and hosting a hardware hacking village project at security conferences across the Midwest, including CypherCon from the conference’s inception."
