["https://cyphercon.com/portfolio/critical-controls-unleashed-the-power-moves-for-proactive-cybersecurity"]
title = "Critical Controls Unleashed: The Power Moves for Proactive Cybersecurity – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "“Critical Controls Unleashed: The Power Moves for Proactive Cybersecurity” dives into the critical role of the CIS Controls in today’s cybersecurity landscape. This presentation will unpack how each control, from foundational asset management to advanced data protection, provides measurable and actionable ways to combat common cyber threats. Attendees will explore how these controls align with other standards like NIST and ISO, the maturity model to assess and grow their security posture, and real-world success stories showing the payoff of robust implementation. Importance: I believe that with cyber threats evolving rapidly, organizations can no longer rely on reactive defenses. The CIS Controls offer a much overlooked, yet prioritized, structured roadmap for developing a resilient, proactive cybersecurity approach, scalable across industries and organizational sizes. This session will be essential for anyone looking to strengthen their defenses, streamline compliance, and improve security ROI. ISACA Madison, CompTIA, SANS/GIAC, and as an active member (and board director) with the Wisconsin Cyber Threat Response Alliance (WICTRA) Aaron is an IT professional with over two decades of experience. Throughout his career, Aaron has heavily focused on the intricacies of IT security operations, with a particular focus on serving within the credit union movement. Currently serving as the Vice President of IT at Summit Credit Union, Aaron plays a pivotal role in shaping the technological landscape of his organization. With a passion for leveraging technology to enhance business outcomes and improve customer experiences, Aaron is dedicated to staying at the forefront of industry trends and advancements. His comprehensive knowledge of IT governance, risk management, and cybersecurity has earned him a reputation as a trusted advisor and thought leader within information security. In addition to his professional work, Aaron is committed to giving back to the industry through active involvement in professional organizations such as ISACA Madison, CompTIA, SANS/GIAC, and as an active member (and board director) with the Wisconsin Cyber Threat Response Alliance (WICTRA)."
