["https://cyphercon.com/portfolio/inside-social-engineering-with-eddie-miro"]
title = "Inside Social Engineering with Eddie Miro – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "Explore the intricate world of social engineering, physical security, and crime with Eddie Miro, a seasoned cybersecurity professional with firsthand experience from a unique background. In this interactive session, Eddie will address your questions and share insights into the techniques used in social engineering, current security challenges, and lessons learned from his transition from criminal activities to cybersecurity. This talk offers an opportunity to gain practical knowledge and understanding from someone who has navigated both sides of the security spectrum. Importance: “Inside Social Engineering with Eddie Miro” offers a conversational look at how social engineering exploits people. With Eddie’s unique background and hands-on experience, you’ll get practical tips and real-world insights to help you stay ahead of these tactics. Plus, the interactive Q&A lets you ask your burning questions and get straight answers. Eddie Miro is the Cybersecurity Analyst at Cyber Skyline and a community college cyber security instructor and freelance red team consultant with his company Miro Labs. Eddie has presented at DEF CON, HOPE, Wild West Hackin’ Fest, Antisyphon Training, SaintCon, B-Sides and many virtual conferences. He specializes in training, education, physical security, and social engineering. Eddie also organizes Octopus Game, an official DEF CON contest and wrote the book: Outlaw Summer, Cyber Dreams."
