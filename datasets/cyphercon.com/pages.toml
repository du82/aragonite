["https://cyphercon.com/portfolio/here-a-threat-there-a-threat-everywhere-a"]
title = "Here a Threat, There a Threat, Everywhere a… – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "Some threats, like APTs, often lurk in the shadows and strike with impeccable precision until they’re caught. Others are wild, sprawling creatures, and you wouldn’t believe where they go and how far they can get – they can slip right under your nose and right past your detection system. In this session, attendees with explore three of the most fascinating cyber threats that Sysdig’s Threat Research Team has uncovered in the wild – each with its own unique flavor of chaos. From LLMs and cloud environments to Git repositories and Docker Hub, I promise these aren’t your run-of-the-mill security headaches. What do they want? How do they work? And more importantly, how do you stop them? Join this session to learn more about a few of the attackers shaping the future of the cloud threat landscape and how to better defend your organization against them. Crystal is a cybersecurity strategist at Sysdig, a company founded by the creators of Wireshark, Stratoshark, and Falco. She is tasked with bridging the gap between business and security through cloud and container-focused webinars and papers for everyone from executives to technical practitioners. She was originally a threat research engineer on the Sysdig Threat Research Team, where Crystal spent her time discovering and analyzing cyber threat actors who took advantage of the cloud. Crystal started her career as a linguist and intelligence analyst in the United States Air Force. Prior to joining Sysdig, she spent four years as a contractor for Booz Allen Hamilton, researching and reporting on terrorism and cyber threats. Crystal was responsible for helping to develop and mature Booz Allen’s cyber threat intelligence community and threat hunting capabilities."
