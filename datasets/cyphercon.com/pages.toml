["https://cyphercon.com/portfolio/building-the-ultimate-budget-friendly-low-earth-orbit-satellite-ground-station"]
title = "Building the Ultimate Budget-Friendly Low Earth Orbit Satellite Ground Station – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "In this presentation, we explore the design, construction, and configuration of cost-effective Low Earth Orbit (LEO) satellite ground stations using open source tools. The aim is to demonstrate that high-quality ground stations can be developed on a limited budget without sacrificing performance. We will delve into the selection of hardware components, the integration process, and the software tools necessary for seamless operation. Additionally, real-world applications and case studies will be showcased to highlight the practical benefits and potential of these budget-friendly solutions. Attendees will leave with a comprehensive understanding of how to leverage open source resources to build and operate efficient ground stations, making advanced aerospace technology accessible to enthusiasts and professionals alike. Importance: This talk is important because it addresses a critical aspect of satellite communication by showcasing how Low Earth Orbit (LEO) satellite ground stations can be developed cost-effectively. Hello there! My name is Victor and I’m a Senior Red Team Analyst at United Airlines with 8 years of experience in offensive security. After immigrating to the United States in 2017 from Spain, I started my stateside career at Underwriter Laboratories doing penetration testing on medical device technologies, including software and hardware-embedded devices, wireless devices, and web and mobile applications. In my current position, I perform and manage Red Team Engagements, Attack Surface Reduction assessments, Physical Engagements, and handle United Airlines’ Vulnerability Disclosure Program to help enhance United’s cybersecurity posture. In my free time, I like to spend time with my wife and three children (hackers are great at hide-and-seek)."
