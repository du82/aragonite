["https://cyphercon.com/portfolio/deceiving-the-deceivers-offensive-security-strategies-for-adversarial-ai-attacks-in-real-world-environments"]
title = "Deceiving the Deceivers: Offensive Security Strategies for Adversarial AI Attacks in Real-World Environments – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "As AI-driven systems become deeply embedded in critical infrastructure, threat actors leverage adversarial techniques to manipulate these models, often leading to catastrophic results. This talk will dive into the offensive security side of adversarial AI: how attackers exploit vulnerabilities in AI models, particularly in GenAI and machine learning systems, to create undetectable malware, launch targeted misinformation campaigns, and manipulate high-stakes data. We’ll explore the fascinating interplay between attackers and defenders, where attackers seemingly control model outcomes. But is that control real, or are they bound by inherent system vulnerabilities? This presentation will cover a series of red-team strategies, new methods for generating stealthy adversarial perturbations, and the implementation of AI-driven defenses against them. Importance: Adversarial AI attacks are evolving rapidly, with serious implications for sectors ranging from financial services to national security. Understanding the offense—how these attacks are constructed, executed, and controlled—can empower defenders to design countermeasures that disrupt the attacker’s perception of control. This talk presents a dual narrative of control and unpredictability in the context of AI red teaming, offering valuable insights for both offensive and defensive teams. Aviral Srivastava is a cybersecurity researcher and emerging expert in adversarial AI, offensive security, and generative AI vulnerabilities. Currently a master’s student at Pennsylvania State University, Aviral has dedicated his academic journey to exploring the intersection of AI and cybersecurity. His expertise is recognized by top industry platforms, including multiple talks at BSides conferences, and he was recently invited to speak at the prestigious HOPE XV. In 2025 he will be presenting at RSA as Aviral is honored as an RSA Security Scholar, a distinction awarded to the most promising cybersecurity scholars from top universities worldwide, offering him a unique opportunity to represent Penn State on a global stage. He was awarded cybersecurity innovator of the year at Bsides bangalore conference in 2023. His papers on GenAI security and reinforcement learning has been accepted to the prestigious and top most venue of the world which is NeurIPS recently."
year_published = 2025
