["https://cyphercon.com/portfolio/how-to-hack-a-cloud-production-environment-with-external-terraform-manipulation"]
title = "How to hack a cloud production environment with external Terraform manipulation – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "Terraform by HashiCorp is a leading Infrastructure as Code (IaC) tool that enables DevOps to define and provision cloud infrastructure. At the heart of Terraform’s functionality are many external modules, services and third-party components that are used for planning and deployment. In this session, Uri will cover how widely-used Terraform providers and modules can be exploited to gain full control of a cloud production environment. We will examine two attack paths that have high probability as they leverage commonly-used external Terraform functionalities that are often not properly vetted or even visible. Uri will walk attendees through the complete attack flow, discuss the potential impact and provide best practices and Secure by Design concepts for mitigation and remediation. Moreover, Uri will share his experience with improving SDLC processes to detect these types of risks before they reach production. Importance: The power and convenience of Terraform providers and modules are undeniable, but so are the security risks they may pose if not properly managed. By understanding these risks and best practices for mitigation and remediation, we can significantly reduce potential threats to our cloud infrastructure. Ex Israeli intelligence with over a decade in cyber security specializing in both offensive and defensive practices and operations and cloud and product security for large organizations. Uri led the security architecture activities at Akamai where he oversaw global vulnerability management, product security and the company’s cloud security risk remediation strategy."
year_published = 2025
