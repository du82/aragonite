["https://cyphercon.com/portfolio/lasers-and-acid-and-chips-oh-my-decapping-integrated-circuits-at-home"]
title = "Lasers and Acid and Chips, oh my! (Decapping Integrated Circuits at Home) – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "As an IoT penetration tester, I occasionally get to play the role of a mad scientist. That was never more true than on a recent project which required me to set up a home lab for the decapsulation of integrated circuits (decapping ICs). In this presentation, I will explore this fascinating topic which is used to uncover hardware vulnerabilities buried on chips. I hope for this talk to serve as a primer on the art and science of decapping. Safety considerations will be a reoccurring theme throughout the talk, as I share essential protocols for handling the necessary chemicals and equipment for this kind of testing. I will also describe my methodology, detailing the selection of appropriate decapping techniques, the assembly of my lab environment, and the precision required to protect the integrity of the ICs. Finally, in addition to the results of my initial experiments, I will discuss potential improvements for would-be mad scientists to enhance the efficiency and accuracy of future testing. Join me as we unravel the secrets of ICs in our own backyards! Importance: My presentation would be an excellent fit for CypherCon. It will address a critical and often overlooked aspect of cybersecurity: hardware vulnerabilities. My talk on decapsulation will provide the general audience with insight into an area of research of which they may not be aware. The methodology, techniques, and lessons learned I will share are all direct reflections of my own experiences. I will include photos and anecdotes of the project on which the presentation is based. Attendees will gain actionable knowledge that they can apply in their own work. I hope to inspire curiosity in the hardware space and create sparks of continuous improvement within the offensive security community. Aaron Wasserman is an IoT penetration tester with a passion for uncovering hardware vulnerabilities. He is a Senior Security Engineer at Praetorian and a member of the IoT Penetration Testing team. Aaron is dedicated to advancing cybersecurity practices and sharing knowledge within the community. He holds a Master’s and Bachelor’s from Georgia Tech’s School of Electrical and Computer Engineering and several offensive security certifications, including the ACIP and OSCP."
