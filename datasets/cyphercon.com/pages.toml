full_description = "Sheldon is the CEO & Founder of Cream City Cyber, a national consulting firm enabling businesses to confidently manage cyber-risk through risk management, resiliency, and cybersecurity services. Sheldon is the former CIO of American Family (AmFam) Insurance, and former CISO of AmFam, Dell Technologies, and Northwestern Mutual. In 2023, Sheldon was recognized with the ORBIE CIO of the Year Leadership Award and was named a Top 100 CISO in 2021 and 2023 by industry peers. Sheldon serves as a board member of Greater Mt. Sinai Church, i.c.Stars Milwaukee, UW-Health, and the United Way of Greater Milwaukee & Waukesha County. Sheldon is a veteran of the Wisconsin Army National Guard, earned a BA in Management with honors from Concordia University Wisconsin, and MS in Organizational Leadership with honors from Quinnipiac University. Sheldon is a native of Milwaukee, WI, and a passionate supporter of STEM programs in Southeastern Wisconsin. In 2019, Sheldon and his wife Celeste created an endowment at Concordia University Wisconsin to support diverse students in STEM, nursing, and construction-related fields. In 2022, Sheldon developed a partnership with tech companies and state government to train under-employed talent to become cloud engineers. Outside of work, Sheldon enjoys the challenge of remodeling homes, serving in ministry, and exploring new destinations. Sheldon is married to Celeste Cuffie, CEO of Life Empowered Consulting Services and is the proud Dad of two adult children, Alyssa and Zach. As the next generation of #teamcuffie, they are following in their Dad’s footsteps as techies. Alyssa is a Business Architect at Cisco Systems and Zach recently graduated with his associate’s degree in Cloud Computing."
