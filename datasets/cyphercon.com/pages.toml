["https://cyphercon.com/portfolio/dissecting-the-evil-bit"]
title = "Dissecting the Evil Bit – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "Today’s threat landscapes are ever evolving, with new and emerging threats every day. There needs to be a solution to better manage these threats and take a more proactive approach. Whether it comes to business email compromise, or dropping a 0 day, RFC 3514 has come up with a solution that more people should be aware of. I will be going through what the RFC defines, and how we can implement this whether it be adding rules to the firewall or implementing it in your hacking toolset. I am a Junior at UW-Stout studying cybersecurity, as well as the president of the UW Stout Collegiate Cyber Defense Competition team where we defend unsecure networks against a professional red team while trying to beat out the other schools."
