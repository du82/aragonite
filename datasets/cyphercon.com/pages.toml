["https://cyphercon.com/about-us"]
title = "About Us – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = 'Technology’s Best… but in the Midwest.<img decoding="async" class="aligncenter wp-image-3796 size-large lazyload" src="https://cyphercon.com/wp-content/uploads/2023/03/CypherCon-1024x441.png" alt="" width="1024" height="441" srcset="https://cyphercon.com/wp-content/uploads/2023/03/CypherCon-1024x441.png 1024w, https://cyphercon.com/wp-content/uploads/2023/03/CypherCon-300x129.png 300w, https://cyphercon.com/wp-content/uploads/2023/03/CypherCon-768x331.png 768w, https://cyphercon.com/wp-content/uploads/2023/03/CypherCon.png 1182w" sizes="(max-width: 1024px) 100vw, 1024px" />Tell us something: When was the last time you were in a room full of Technology Hobbyists & Hackers? People who weren’t just Discord / Slack lurkers, but people who’ve made backdoor full-stack professions out of your weekend obsessions?If it’s been a while…[SAVE YOUR SEAT TODAY] CypherCon: Much more than a Technology Conference.Ever since our conception, CypherCon has aimed to bring the world’s most recognizable hackers and technology talent to Wisconsin.We’d love to tout our six years of exponential growth and the big-shots that make it all happen… but the reality of this conference is a lot simpler:CypherCon would be nothing without the humble yet inventive community of volunteers, artists, and hobbyists that come together to deliver a best-in-class HackerCon experience.And when we say best in class, we mean it. In Just 48 Hours of CypherCon, You’ll Get…Industry-leading keynotes covering 5 main tracks: Offensive Security, Defensive Security, Cybersecurity 101, Executive Application, and Hundreds of cryptography challenges & puzzlesDozens of hands-on hacking demonstrations in our VillagesDirect conversations with peers in your future careersInteractive, physical art displaysSafe simulated hacking experiencesEndless (anti-)social opportunitiesDo you honestly need any more reason to come?[IF SO, HERE’S THE FAQ] Close-knit Confidence to Statewide ConferenceImagine this: It’s 2015. Zoom and even Skype calls aren’t all that popular for personal friends… much less business.The only way to meet your industry peers? Big, corporate conferences, held in big, corporate conference centers. Where suits without blazers are considered “casual,” and where an email address is more valuable than a handshake.Michael Goetzman, an internet veteran, technology hobbyist, and cybersecurity healthcare professional at the time, watched as these conferences grew into sterile, stiff environments, and knew he had to do something. In recoil to the rise of boring business conferences, CypherCon was born!A nod to the pastCypherCon was originally hosted at the Safehouse Spy Bar and infamous Pfister Hotel, a recognition of Wisconsin’s history & cybersecurity’s roots as anti-spyware, espionage, and war tactic tools.An immediate hitCypherCon 1.0 4X’d the initial ticket numbers — literally outgrowing itself within its first year!A homegrown ideaWhile CypherCon was originally an idea by Michael Goetzman, it’s never been executed alone. Through the support of local friends, family, and volunteer love, CypherCon is able to thrive to this day. This year is CypherCon 8.0, and while we’re bigger than ever, we’ve fundamentally stayed the same:CypherCon is for and by the technology & security community.[LEARN MORE ABOUT THE CYPHERCOMMUNITY]CypherCon 8.0: Fate or No Fate – What can we truly control?Each year, CypherCon pushes the boundaries of conference tech.This year, our theme is “Fate or No Fate,” inspired by terminator and the growing fearmongering around general AI and the advancements in technology or even IT general controls…What that means for your experience?An Interactive ConferenceOur interactive badges are back!If you purchase The Digital/PCB ticket (or higher), you’ll get a physical circuit board badge created by the tymkrs to let you into every talk, village, and trade show floor![VIEW ALL TICKET TYPES]An Anti-Social-Friendly SpaceCypherCon’s subcommunities are called “villages.”Every village features hands-on demonstrations, community challenges, and social opportunities for socialites of all levels. (Which really means all “social” opportunities are anti-social-friendly.)We also support sub-community meetups! Marginalized communities like queerpunx & educational communities like Hak4Kidz will be at CypherCon 6.0.[VIEW ALL 21 VILLAGES HERE]A Team of Real HackersIn the spirit of the natural underground culture of the internet, many of CypherCon 8.0’s core team of organizers prefer to remain unnamed. Most prominently is our blind speaker selection committee.Goetzman proudly puts on the event alongside industry partners, but it cannot go without saying that CypherCon is and always will be a team effort.Want to be a part of that effort?[JOIN NEXT YEAR’S TEAM]An Artist AdditionThis year, interactive art displays are part of the conference experience.Independent artists are a huge part of this endeavor, as well as our many volunteers who excitedly make things happen.Our interactive badge by the tymkrs is enhanced beyond tech with their art to complement the conference experience every step of the way![ANY UNANSWERED QUESTIONS?]YOU’LL WISH YOU WENT SOONER!Join us at our Hacker Conference 2025 with an exemplary selection of presentations and villages from prominent tech experts. Get your tickets now![REGISTER FOR SPRING 2025]'
