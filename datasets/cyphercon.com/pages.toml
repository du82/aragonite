["https://cyphercon.com/portfolio/firewalls-and-fire-alarms-what-to-do-when-your-best-defenses-go-up-in-smoke"]
title = "Firewalls and Fire Alarms: What to Do When Your Best Defenses Go Up in Smoke – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "Imagine your shock in seeing your newly installed “fireproof” wall completely engulfed in flames. In both fire safety and information security, we often think that we design layers of controls to prevent disaster. In reality, these layers are actually meant to delay disaster. But what happens when those trusted defenses fail? This talk draws on real-world scenarios where controls everyone assumed were in place—from fire doors to firewalls—unexpectedly gave way, leading to chaos and damage. Using compelling examples from both fields, we’ll examine situations where preventative, detective, and containment controls fell short and explore the lessons they offer for information security. Attendees will learn how layered defenses, regular testing, and resilient response plans can make a difference when systems don’t perform as expected. By blending fire safety insights with actionable security strategies, this talk will prepare you to handle the flames when your own controls go up in smoke. Importance: Many topics remain unnecessarily inaccessible due to restrictive gatekeeping, making them harder to engage with and understand. This talk will introduce topics and analogies from the physical world that attendees from all backgrounds can appreciate, while inviting curiosity about fire safety at the same time. As a speaker who regularly works in male-dominated fields and, as a result, has often felt like an outsider, I recognize the importance of delivering talks that embrace and resonate with diverse audiences. While inclusivity is a big topic with many approaches, this talk will take one small step forward in improving the situation. Dr. Catherine J. Ullman is a security researcher, speaker, author, and Principal Technology Architect, Security, at the University at Buffalo with over 20 years of highly technical experience. In her current role, Cathy is a digital forensics and incident response (DFIR) specialist, performing incident management, intrusion detection, investigative services, and personnel case resolution in a dynamic academic environment. She additionally builds security awareness among faculty and staff which educates and informs users about how to prevent and detect social engineering threats, and how to compute and digitally communicate safely. Cathy has presented at numerous information security conferences including DEF CON and Blue Team Con. Cathy is a contributor to the O’Reilly title 97 Things Every Information Professional Should Know and the author of the Wiley title The Active Defender. In her (minimal) spare time, she enjoys visiting her adopted two-toed sloth Flash at the Buffalo Zoo, researching death and the dead, and learning more about hacking things to make the world a more secure place."
