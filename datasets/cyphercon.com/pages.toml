["https://cyphercon.com/portfolio/from-p0f-to-ja4-muonfp-network-fingerprinting-and-recon"]
title = "From p0f to JA4 & MuonFP: Network Fingerprinting and Recon – CypherCon"
description = "CypherCon’s Aerospace Hacking community consists of hackers, cybersecurity professionals, aviation engineers, and pilots coming from local public and private sectors. We believe in protecting human life by ensuring the skies are safe, reliable, and trustworthy which is dependent on secure aviation and space operations. Aerospace hackers & Cybersecurity researchers have been testing and securing the skies & space. At the CypherCon the Aerospace community speaks on what it takes to secure aviation, aerospace, defense, transportation and manufacturing industries. In addition, we have a close relationship with Oshkosh’s EAA, the experimental aircraft associates and annual air show and gathering of aviation enthusiasts held each summer at Wittman Regional Airport and adjacent Pioneer Airport in Oshkosh, Wisconsin, United States."
full_description = "Network reconnaissance is often overshadowed by threats like phishing, yet it remains a critical first step in the kill chain. Because edge infrastructure is exposed around the clock, adversaries can continually gather information that leads to initial exploitation. In this talk, we’ll explore the evolution of network fingerprinting, starting with older passive methods like p0f and moving on to newer techniques such as JA4, JA4+, and MuonFP. You’ll see how these methods can help identify everything from fast scanners hitting massive ranges of hosts to VPN- and jump server-based connections. We’ll discuss each fingerprinting generation’s strengths and limitations, giving you a realistic picture of what these tools can (and cannot) accomplish. You will leave with a hands-on understanding of modern network fingerprinting approaches and several practical examples they can apply in their daily work. Importance: Network reconnaissance is often overshadowed by other threats, like phishing, yet it remains a critical first step in the kill chain. Because edge infrastructure is typically exposed around the clock, adversaries have a 24/7 opportunity to gather information and use it for initial exploitation. Understanding modern network fingerprinting techniques, their strengths and weaknesses will help cybersecurity professionals not shoot themselves in the foot. Vlad Iliushin is the co-founder and cybersecurity expert at ELLIO and President of the Anti-Malware Testing Standards Organization (AMTSO). A true cybersecurity enthusiast, Vlad’s passionate about network security, IoT, and cyber deception. Before ELLIO, he founded and led the Avast IoT Lab (now Gen Digital), developing security features and researching IoT threats. He has spoken at many conferences, including Web Summit and South by Southwest (SXSW), where he demonstrated IoT vulnerabilities"
year_published = 2025
