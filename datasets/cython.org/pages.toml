title = "Cython: C-Extensions for Python"
full_description = "Cython is an optimising static compiler for both the Python programming language and the extended Cython programming language (based on Pyrex). It makes writing C extensions for Python as easy as Python itself. The Cython language is a superset of the Python language that additionally supports calling C functions and declaring C types on variables and class attributes. This allows the compiler to generate very efficient C code from Cython code. The C code is generated once and then compiles with all major C/C++ compilers in CPython 2.7 as well as 3.5 and all later versions. The upcoming Cython 3.1 requires Python 3.8 or later. We regularly run integration tests against all supported CPython versions and their latest in-development branches to make sure that the generated code stays widely compatible and well adapted to each version. PyPy support is mostly usable. The latest PyPy version is always recommended here. Support for the CPython Limited API and free-threading CPython is available in Cython 3.1 but considered experimental. All of this makes Cython the ideal language for wrapping external C libraries, embedding CPython into existing applications, and for fast C modules that speed up the execution of Python code. Making Cython a great programming language for you, and keeping it up to speed with the Python ecosystem and the changing requirements of its diverse user bases, takes a lot of time and dedication. To support the maintenance and future development of the Cython language and compiler, YOU can sponsor the work of Stefan Behnel via: Note that PayPal takes 5 - 15% fees for small non-EUR payments, which is money that you pay without helping us. Consider signing up for a GitHub Sponsors subscription instead. If you still have questions, feel free to send an email to the cython users mailing list. Aspects of the core development are discussed on the cython core developer mailing list. If you are unsure which list to use, the cython users list is probably the right one to use, which has the larger audience. There is also a #cython channel on the freenode IRC servers for Cython related chats."
