["https://www.d20srd.org/about.htm"]
title = "About This Site :: d20srd.org"
full_description = "The Hypertext d20 SRDTM is intended to be a useful supplement to published rulebooks. It is not intended to replace them. I see my gaming library as a valuable collection that I derive much pleasure from. There is no way that this site could duplicate the experience of reading a beautifully designed and illustrated book. But, there are some BIG advantages that this site has over printed materials: This site is a lightning-fast reference for the d20 system rules you use most. Speeding up mundane activities (such as looking up rules) has a major positive impact on the gaming experience. There are three ways this site is quicker to use than printed rulebooks: You can’t wear this site out. I dare you. Try it. The same can’t be said of your cherished rulebooks. Learning the d20 rule system can be a daunting task for beginners and even the most learned rules scholar needs a refresher now and again. There are hundreds of game terms that are unfamiliar to the uninitiated. Now the fledgling gamer can just click on the esoteric jargon instead of flailing and flipping pages. With surprising frequency people find themselves with access to the internet, but not to their rulebooks. I've received emails from soldiers stationed overseas to folks slacking off at work that are happy to have access to d20 rules. I know of no Braille editions of d20 rulebooks. This site has been built with accessibility in mind. If you’re using a screen reader, or even a palm pilot, this site is built for you. I know. It sounds pretty silly. Of course you know how to use a Web site, but read on… You never know what you may learn. I know this is a big leap for many of you, but Firefox offers several features that really enhance the usefulness and usability of this site. I'ts worth downloading Firefox even if you only use it for this site! This site also uses several W3C standards that are NOT supported by Internet Explorer. The Hypertext d20 SRD will look better using a compliant browser such as Firefox."
year_published = 2025
clearnet = "https://www.d20srd.org/about.htm"
tags = ["advantages", "better", "bookmarks", "contextual", "firefox", "home", "hyperlinked", "hyperlinks", "indexes", "mozilla"]
language = "en"
internal-references = ["none"]
external-references = ["5e.d20srd.org", "5thsrd.com", "belloflostsouls.net", "bolsinteractive.com", "dnd-wiki.org", "en.wikipedia.org", "enworld.org", "facebook.com", "lexicanum.com", "lounge.belloflostsouls.net", "mozilla.org", "paizo.com", "pathfinder.d20srd.org", "rpgwidget.com", "w3.org", "wizards.com"]

