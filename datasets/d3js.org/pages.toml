["https://d3js.org/d3-axis"]
title = "d3-axis | D3 by Observable"
description = "The JavaScript library for bespoke data visualization"
full_description = 'd3-axis ​The axis component renders human-readable reference marks for position scales. It works with most scale types, including linear, log, band, and time scales as shown above.Calling the axis component on a selection of SVG containers (usually a single G element) populates the axes. Axes are rendered at the origin. To change the position of the axis with respect to the chart, specify a transform attribute on the containing element.jsconst gx = svg.append("g") .attr("transform", `translate(0,${height - marginBottom})`) .call(d3.axisBottom(x));If the scale has changed, call the axis component a second time to update. For smooth animations, you can call it on a transition.jsgx.transition() .duration(750) .call(d3.axisBottom(x));The elements created by the axis are considered part of its public API. You can apply external stylesheets or modify the generated axis elements to customize the axis appearance. An axis consists of a path element of class “domain” representing the extent of the scale’s domain, followed by transformed g elements of class “tick” representing each of the scale’s ticks. Each tick has a line element to draw the tick line, and a text element for the tick label. For example, here is a typical bottom-oriented axis:html<g fill="none" font-size="10" font-family="sans-serif" text-anchor="middle"> <path class="domain" stroke="currentColor" d="M0.5,6V0.5H880.5V6"></path> <g class="tick" opacity="1" transform="translate(0.5,0)"> <line stroke="currentColor" y2="6"></line> <text fill="currentColor" y="9" dy="0.71em">0.0</text> </g> <g class="tick" opacity="1" transform="translate(176.5,0)"> <line stroke="currentColor" y2="6"></line> <text fill="currentColor" y="9" dy="0.71em">0.2</text> </g> <g class="tick" opacity="1" transform="translate(352.5,0)"> <line stroke="currentColor" y2="6"></line> <text fill="currentColor" y="9" dy="0.71em">0.4</text> </g> <g class="tick" opacity="1" transform="translate(528.5,0)"> <line stroke="currentColor" y2="6"></line> <text fill="currentColor" y="9" dy="0.71em">0.6</text> </g> <g class="tick" opacity="1" transform="translate(704.5,0)"> <line stroke="currentColor" y2="6"></line> <text fill="currentColor" y="9" dy="0.71em">0.8</text> </g> <g class="tick" opacity="1" transform="translate(880.5,0)"> <line stroke="currentColor" y2="6"></line> <text fill="currentColor" y="9" dy="0.71em">1.0</text> </g> </g>The orientation of an axis is fixed; to change the orientation, remove the old axis and create a new axis.axisTop(scale) ​Source · Constructs a new top-oriented axis generator for the given scale, with empty tick arguments, a tick size of 6 and padding of 3. In this orientation, ticks are drawn above the horizontal domain path.axisRight(scale) ​Source · Constructs a new right-oriented axis generator for the given scale, with empty tick arguments, a tick size of 6 and padding of 3. In this orientation, ticks are drawn to the right of the vertical domain path.axisBottom(scale) ​Source · Constructs a new bottom-oriented axis generator for the given scale, with empty tick arguments, a tick size of 6 and padding of 3. In this orientation, ticks are drawn below the horizontal domain path.axisLeft(scale) ​Source · Constructs a new left-oriented axis generator for the given scale, with empty tick arguments, a tick size of 6 and padding of 3. In this orientation, ticks are drawn to the left of the vertical domain path.axis(context) ​Source · Render the axis to the given context, which may be either a selection of SVG containers (either SVG or G elements) or a corresponding transition.jssvg.append("g") .attr("transform", `translate(0,${height - marginBottom})`) .call(d3.axisBottom(x));axis.scale(scale) ​Source · If scale is specified, sets the scale and returns the axis. If scale is not specified, returns the current scale.jsconst xAxis = d3.axisBottom().scale(x);axis.ticks(...arguments) ​Sets the arguments that will be passed to scale.ticks and scale.tickFormat when the axis is rendered, and returns the axis generator.The meaning of the arguments depends on the axis’ scale type: most commonly, the arguments are a suggested count for the number of ticks (or a time interval for time scales), and an optional format specifier to customize how the tick values are formatted. For example, to generate twenty ticks with SI-prefix formatting on a linear scale, say:jsaxis.ticks(20, "s");To generate ticks every fifteen minutes with a time scale, say:jsaxis.ticks(d3.timeMinute.every(15));This method is a convenience function for axis.tickArguments. For example, this:jsaxis.ticks(10);Is equivalent to:jsaxis.tickArguments([10]);This method has no effect if the scale does not implement scale.ticks, as with band and point scales. To set the tick values explicitly, use axis.tickValues. To set the tick format explicitly, use axis.tickFormat. To generate tick values directly, use scale.ticks.axis.tickArguments(arguments) ​Source · If arguments is specified, sets the arguments that will be passed to scale.ticks and scale.tickFormat when the axis is rendered, and returns the axis generator. See also axis.ticks, which is used more commonly.The meaning of the arguments depends on the axis’ scale type: most commonly, the arguments are a suggested count for the number of ticks (or a time interval for time scales), and an optional format specifier to customize how the tick values are formatted. For example, to generate twenty ticks with SI-prefix formatting on a linear scale, say:jsaxis.tickArguments([20, "s"]);To generate ticks every fifteen minutes with a time scale, say:jsaxis.tickArguments([d3.timeMinute.every(15)]);If arguments is not specified, returns the current tick arguments, which defaults to the empty array. If arguments is specified, this method has no effect if the scale does not implement scale.ticks, as with band and point scales. To set the tick values explicitly, use axis.tickValues. To set the tick format explicitly, use axis.tickFormat.axis.tickValues(values) ​Source · If a values iterable is specified, the specified values are used for ticks rather than the scale’s automatic tick generator. For example, to generate ticks at specific values:jsconst axis = d3.axisBottom(x).tickValues([1, 2, 3, 5, 8, 13, 21]);The explicit tick values take precedence over the tick arguments set by axis.tickArguments. However, any tick arguments will still be passed to the scale’s tickFormat function if a tick format is not also set.If values is null, clears any previously-set explicit tick values and reverts back to the scale’s tick generator. If values is not specified, returns the current tick values, which defaults to null.axis.tickFormat(format) ​Source · If format is specified, sets the tick format function and returns the axis. For example, to display integers with comma-grouping for thousands:jsaxis.tickFormat(d3.format(",.0f"));More commonly, a format specifier is passed to axis.ticks, which has the advantage of setting the format precision automatically based on the tick interval:jsaxis.ticks(10, ",f");See d3-format and d3-time-format for help creating formatters.If format is not specified, returns the current format function, which defaults to null. A null format indicates that the scale’s default formatter should be used, which is generated by calling scale.tickFormat. In this case, the arguments specified by axis.tickArguments are likewise passed to scale.tickFormat.axis.tickSize(size) ​Source · If size is specified, sets the inner and outer tick size to the specified value and returns the axis.jsconst axis = d3.axisBottom(x).tickSize(0);If size is not specified, returns the current inner tick size, which defaults to 6.jsaxis.tickSize() // 0, as specified aboveaxis.tickSizeInner(size) ​Source · If size is specified, sets the inner tick size to the specified value and returns the axis.jsconst axis = d3.axisBottom(x).tickSizeInner(0);If size is not specified, returns the current inner tick size, which defaults to 6.jsaxis.tickSizeInner() // 0, as specified aboveThe inner tick size controls the length of the tick lines, offset from the native position of the axis.axis.tickSizeOuter(size) ​Source · If size is specified, sets the outer tick size to the specified value and returns the axis.jsconst axis = d3.axisBottom(x).tickSizeOuter(0);If size is not specified, returns the current outer tick size, which defaults to 6.jsaxis.tickSizeOuter() // 0, as specified aboveThe outer tick size controls the length of the square ends of the domain path, offset from the native position of the axis. Thus, the “outer ticks” are not actually ticks but part of the domain path, and their position is determined by the associated scale’s domain extent. Thus, outer ticks may overlap with the first or last inner tick. An outer tick size of 0 suppresses the square ends of the domain path, instead producing a straight line.axis.tickPadding(padding) ​Source · If padding is specified, sets the padding to the specified value in pixels and returns the axis.jsconst axis = d3.axisBottom(x).tickPadding(0);If padding is not specified, returns the current padding which defaults to 3 pixels.jsaxis.tickPadding() // 0, as specified aboveaxis.offset(offset) ​Source · If offset is specified, sets the pixel offset to the specified value in pixels and returns the axis.jsconst axis = d3.axisBottom(x).offset(0);If offset is not specified, returns the current pixel offset.jsaxis.offset() // 0The pixel offset defaults to 0 on devices with a devicePixelRatio greater than 1, and 0.5 otherwise. This default pixel offset ensures crisp edges on low-resolution devices.'
