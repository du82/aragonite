full_description = "d3-force ​Fork ↗︎This module implements a velocity Verlet numerical integrator for simulating physical forces on particles. Force simulations can be used to visualize networks and hierarchies, and to resolve collisions as in bubble charts.To use this module, create a simulation for an array of nodes and apply the desired forces. Then listen for tick events to render the nodes as they update in your preferred graphics system, such as Canvas or SVG.See one of:Force simulationsCenter forceCollide forceLink forceMany-body forcePosition forces"
