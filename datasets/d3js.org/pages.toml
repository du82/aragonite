title = "API index | D3 by Observable"
description = "The JavaScript library for bespoke data visualization"
full_description = "API index ​D3 is a collection of modules that are designed to work together; you can use the modules independently, or you can use them together as part of the default build.d3-array ​Array manipulation, ordering, searching, summarizing, etc.Add ​Add floating point values with full precision.new Adder - create a full precision adder.adder.add - add a value to an adder.adder.valueOf - get the double-precision representation of an adder’s value.fcumsum - compute a full precision cumulative summation of numbers.fsum - compute a full precision summation of an iterable of numbers.Bin ​Bin discrete samples into continuous, non-overlapping intervals.bin - create a new bin generator.bin - bins a given array of samples.bin.value - specify a value accessor for each sample.bin.domain - specify the interval of observable values.bin.thresholds - specify how values are divided into bins.thresholdFreedmanDiaconis - the Freedman–Diaconis binning rule.thresholdScott - Scott’s normal reference binning rule.thresholdSturges - Sturges’ binning formula.Bisect ​Quickly find a value in a sorted array.bisector - bisect using an accessor or comparator.bisector.right - bisectRight, with the given comparator.bisector.left - bisectLeft, with the given comparator.bisector.center - binary search for a value in a sorted array.bisect - binary search for a value in a sorted array.bisectRight - binary search for a value in a sorted array.bisectLeft - binary search for a value in a sorted array.bisectCenter - binary search for a value in a sorted array.Blur ​Blur quantitative values in one or two dimensions.d3.blur - blur an array of numbers in place.d3.blur2 - blur a two-dimensional array of numbers in place.d3.blurImage - blur an RGBA ImageData in place.Group ​Group discrete values.d3.group - group an iterable into a nested Map.d3.groups - group an iterable into a nested array.d3.rollup - reduce an iterable into a nested Map.d3.rollups - reduce an iterable into a nested array.d3.index - index an iterable into a nested Map.d3.indexes - index an iterable into a nested array.d3.flatGroup - group an iterable into a flat array.d3.flatRollup - reduce an iterable into a flat array.d3.groupSort - sort keys according to grouped values.Intern ​Create maps and sets with non-primitive values such as dates.new InternMap - a key-interning Map.new InternSet - a value-interning Set.Sets ​Logical operations on sets.d3.difference - compute a set difference.d3.disjoint - test whether two sets are disjoint.d3.intersection - compute a set intersection.d3.superset - test whether a set is a superset of another.d3.subset - test whether a set is a subset of another.d3.union - compute a set union.Sort ​Sort and reorder arrays of values.d3.ascending - compute the natural order of two values.d3.descending - compute the natural order of two values.d3.permute - reorder an iterable of elements according to an iterable of indexes.d3.quickselect - reorder an array of numbers.d3.reverse - reverse the order of values.d3.shuffle - randomize the order of an iterable.d3.shuffler - randomize the order of an iterable.d3.sort - sort values.Summarize ​Compute summary statistics.d3.count - count valid number values in an iterable.d3.min - compute the minimum value in an iterable.d3.minIndex - compute the index of the minimum value in an iterable.d3.max - compute the maximum value in an iterable.d3.maxIndex - compute the index of the maximum value in an iterable.d3.least - returns the least element of an iterable.d3.leastIndex - returns the index of the least element of an iterable.d3.greatest - returns the greatest element of an iterable.d3.greatestIndex - returns the index of the greatest element of an iterable.d3.extent - compute the minimum and maximum value in an iterable.d3.mode - compute the mode (the most common value) of an iterable of numbers.d3.sum - compute the sum of an iterable of numbers.d3.mean - compute the arithmetic mean of an iterable of numbers.d3.median - compute the median of an iterable of numbers (the 0.5-quantile).d3.medianIndex - compute the median index of an iterable of numbers (the 0.5-quantile).d3.cumsum - compute the cumulative sum of an iterable.d3.quantile - compute a quantile for an iterable of numbers.d3.quantileIndex - compute a quantile index for an iterable of numbers.d3.quantileSorted - compute a quantile for a sorted array of numbers.d3.rank - compute the rank order of an iterable.d3.variance - compute the variance of an iterable of numbers.d3.deviation - compute the standard deviation of an iterable of numbers.d3.every - test if all values satisfy a condition.d3.some - test if any value satisfies a condition.Ticks ​Generate representative values from a continuous interval.d3.ticks - generate representative values from a numeric interval.d3.tickIncrement - generate representative values from a numeric interval.d3.tickStep - generate representative values from a numeric interval.d3.nice - extend an interval to align with ticks.d3.range - generate a range of numeric values.Transform ​Derive new arrays.d3.cross - compute the Cartesian product of two iterables.d3.merge - merge multiple iterables into one array.d3.pairs - create an array of adjacent pairs of elements.d3.transpose - transpose an array of arrays.d3.zip - transpose a variable number of arrays.d3.filter - filter values.d3.map - map values.d3.reduce - reduce values.d3-axis ​Human-readable reference marks for scales.d3.axisTop - create a new top-oriented axis generator.d3.axisRight - create a new right-oriented axis generator.d3.axisBottom - create a new bottom-oriented axis generator.d3.axisLeft - create a new left-oriented axis generator.axis - generate an axis for the given selection.axis.scale - set the scale.axis.ticks - customize how ticks are generated and formatted.axis.tickArguments - customize how ticks are generated and formatted.axis.tickValues - set the tick values explicitly.axis.tickFormat - set the tick format explicitly.axis.tickSize - set the size of the ticks.axis.tickSizeInner - set the size of inner ticks.axis.tickSizeOuter - set the size of outer (extent) ticks.axis.tickPadding - set the padding between ticks and labels.axis.offset - set the pixel offset for crisp edges.d3-brush ​Select a one- or two-dimensional region using the mouse or touch.d3.brush - create a new two-dimensional brush.d3.brushX - create a brush along the x-dimension.d3.brushY - create a brush along the y-dimension.brush - apply the brush to a selection.brush.move - move the brush selection.brush.clear - clear the brush selection.brush.extent - define the brushable region.brush.filter - control which input events initiate brushing.brush.touchable - set the touch support detector.brush.keyModifiers - enable or disable key interaction.brush.handleSize - set the size of the brush handles.brush.on - listen for brush events.d3.brushSelection - get the brush selection for a given node.d3-chord ​d3.chord - create a new chord layout.chord - compute the layout for the given matrix.chord.padAngle - set the padding between adjacent groups.chord.sortGroups - define the group order.chord.sortSubgroups - define the source and target order within groups.chord.sortChords - define the chord order across groups.d3.chordDirected - create a directed chord generator.d3.chordTranspose - create a transposed chord generator.d3.ribbon - create a ribbon shape generator.ribbon - generate a ribbon shape.ribbon.source - set the source accessor.ribbon.target - set the target accessor.ribbon.radius - set the ribbon source and target radius.ribbon.sourceRadius - set the ribbon source radius.ribbon.targetRadius - set the ribbon target radius.ribbon.startAngle - set the ribbon source or target start angle.ribbon.endAngle - set the ribbon source or target end angle.ribbon.padAngle - set the pad angle accessor.ribbon.context - set the render context.d3.ribbonArrow - create an arrow ribbon generator.ribbonArrow.headRadius - set the arrowhead radius accessor.d3-color ​Color manipulation and color space conversion.d3.color - parse the given CSS color specifier.color.opacity - the color’s opacity.color.rgb - compute the RGB equivalent of this color.color.copy - return a copy of this color.color.brighter - create a brighter copy of this color.color.darker - create a darker copy of this color.color.displayable - returns true if the color is displayable on standard hardware.color.formatHex - returns the hexadecimal RRGGBB string representation of this color.color.formatHex8 - returns the hexadecimal RRGGBBAA string representation of this color.color.formatHsl - returns the RGB string representation of this color.color.formatRgb - returns the HSL string representation of this color.color.toString - returns the RGB string representation of this color.d3.rgb - create a new RGB color.rgb.clamp - returns copy of this color clamped to the RGB color space.d3.hsl - create a new HSL color.hsl.clamp - returns copy of this color clamped to the HSL color space.d3.lab - create a new Lab color.d3.gray - create a new Lab gray.d3.hcl - create a new HCL color.d3.lch - create a new HCL color.d3.cubehelix - create a new Cubehelix color.d3-contour ​Compute contour polygons using marching squares.d3.contours - create a new contour generator.contours - compute the contours for a given grid of values.contours.contour - compute a contour for a given value.contours.size - set the size of a contour generator.contours.smooth - set whether or not the generated contours are smoothed.contours.thresholds - set the thresholds of a contour generator.d3.contourDensity - create a new density estimator.density - estimate the density of a given array of samples.density.x - set the x accessor of the density estimator.density.y - set the y accessor of the density estimator.density.weight - set the weight accessor of the density estimator.density.size - set the size of the density estimator.density.cellSize - set the cell size of the density estimator.density.thresholds - set the thresholds of the density estimator.density.bandwidth - set the bandwidth of the density estimator.density.contours - compute density contours.d3-delaunay ​Compute the Voronoi diagram of a set of two-dimensional points.new Delaunay - create a delaunay triangulation for an array of point coordinates.Delaunay.from - create a delaunay triangulation for an iterable of points.delaunay.points - the coordinates of the points.delaunay.halfedges - the delaunay halfedges.delaunay.hull - the convex hull as point indices.delaunay.triangles - the delaunay triangles.delaunay.inedges - the delaunay inedgesdelaunay.find - find the closest point in the delaunay triangulation.delaunay.neighbors - the neighbors of a point in the delaunay triangulation.delaunay.render - render the edges of the delaunay triangulation.delaunay.renderHull - render the convex hull.delaunay.renderTriangle - render a triangle.delaunay.renderPoints - render the points.delaunay.hullPolygon - the closed convex hull as point coordinates.delaunay.trianglePolygons - iterate over all the triangles as polygons.delaunay.trianglePolygon - return a triangle as a polygon.delaunay.update - update a delaunay triangulation in place.delaunay.voronoi - compute the voronoi diagram associated with a delaunay triangulation.voronoi.delaunay - the voronoi diagram’s source delaunay triangulation.voronoi.circumcenters - the triangles’ circumcenters.voronoi.vectors - directions for the outer (infinite) cells of the voronoi diagram.voronoi.xmin - set the xmin bound of the extent.voronoi.ymin - set the ymin bound of the extent.voronoi.xmax - set the xmax bound of the extent.voronoi.ymax - set the ymax bound of the extent.voronoi.contains - test whether a point is inside a voronoi cell.voronoi.neighbors - the neighbors of a point in the voronoi diagram.voronoi.render - render the mesh of voronoi cells.voronoi.renderBounds - render the extent.voronoi.renderCell - render a voronoi cell.voronoi.cellPolygons - iterate over all the cells as polygons.voronoi.cellPolygon - return a cell as a polygon.voronoi.update - update a voronoi diagram in place.d3-dispatch ​Separate concerns using named callbacks.d3.dispatch - create a custom event dispatcher.dispatch.on - register or unregister an event listener.dispatch.copy - create a copy of a dispatcher.dispatch.call - dispatch an event to registered listeners.dispatch.apply - dispatch an event to registered listeners.d3-drag ​Drag and drop SVG, HTML or Canvas using mouse or touch input.d3.drag - create a drag behavior.drag - apply the drag behavior to a selection.drag.container - set the coordinate system.drag.filter - ignore some initiating input events.drag.touchable - set the touch support detector.drag.subject - set the thing being dragged.drag.clickDistance - set the click distance threshold.drag.on - listen for drag events.d3.dragDisable - prevent native drag-and-drop and text selection.d3.dragEnable - enable native drag-and-drop and text selection.event.on - listen for drag events on the current gesture.d3-dsv ​Parse and format delimiter-separated values, most commonly CSV and TSV.d3.csvParse - parse the given CSV string, returning an array of objects.d3.csvParseRows - parse the given CSV string, returning an array of rows.d3.csvFormat - format the given array of objects as CSV.d3.csvFormatBody - format the given array of objects as CSV.d3.csvFormatRows - format the given array of rows as CSV.d3.csvFormatRow - format the given row as CSV.d3.csvFormatValue - format the given value as CSV.d3.tsvParse - parse the given TSV string, returning an array of objects.d3.tsvParseRows - parse the given TSV string, returning an array of rows.d3.tsvFormat - format the given array of objects as TSV.d3.tsvFormatBody - format the given array of objects as TSV.d3.tsvFormatRows - format the given array of rows as TSV.d3.tsvFormatRow - format the given row as TSV.d3.tsvFormatValue - format the given value as TSV.d3.dsvFormat - create a new parser and formatter for the given delimiter.dsv.parse - parse the given string, returning an array of objects.dsv.parseRows - parse the given string, returning an array of rows.dsv.format - format the given array of objects.dsv.formatBody - format the given array of objects.dsv.formatRows - format the given array of rows.dsv.formatRow - format the given row.dsv.formatValue - format the given value.d3.autoType - automatically infer value types for the given object.d3-ease ​Easing functions for smooth animation.ease - ease the given normalized time.d3.easeLinear - linear easing; the identity function.d3.easePolyIn - polynomial easing; raises time to the given power.d3.easePolyOut - reverse polynomial easing.d3.easePoly - an alias for easePolyInOut.d3.easePolyInOut - symmetric polynomial easing.poly.exponent - specify the polynomial exponent.d3.easeQuadIn - quadratic easing; squares time.d3.easeQuadOut - reverse quadratic easing.d3.easeQuad - an alias for easeQuadInOut.d3.easeQuadInOut - symmetric quadratic easing.d3"
