full_description = "d3-scale ​Scales map a dimension of abstract data to a visual representation. Although most often used for encoding data as position, say to map time and temperature to a horizontal and vertical position in a scatterplot, scales can represent virtually any visual encoding, such as color, stroke width, or symbol size. Scales can also be used with virtually any type of data, such as named categorical data or discrete data that requires sensible breaks.See one of:Linear scales - for quantitative dataTime scales - for time-series dataPow scales - for quantitative data (that has a wide range)Log scales - for quantitative data (that has a wide range)Symlog scales - for quantitative data (that has a wide range)Ordinal scales - for categorical or ordinal dataBand scales - for categorical or ordinal data as a position encodingPoint scales - for categorical or ordinal data as a position encodingSequential scales - for quantitative data as a sequential color encodingDiverging scales - for quantitative data as a diverging color encodingQuantile scales - for quantitative data as a discrete encodingQuantize scales - for quantitative data as a discrete encodingThreshold scales - for quantitative data as a discrete encodingFor visualizing the scale’s encoding, see d3-axis, as well as scale.ticks and scale.tickFormat. For color schemes, see d3-scale-chromatic."
