["https://d3js.org/d3-array/sets"]
title = "Set operations | D3 by Observable"
description = "The JavaScript library for bespoke data visualization"
full_description = "Set operations ​Logical set operations for any iterable.difference(iterable, ...others) ​Source · Returns a new InternSet containing every value in iterable that is not in any of the others iterables.jsd3.difference([0, 1, 2, 0], [1]) // Set {0, 2}union(...iterables) ​Source · Returns a new InternSet containing every (distinct) value that appears in any of the given iterables. The order of values in the returned set is based on their first occurrence in the given iterables.jsd3.union([0, 2, 1, 0], [1, 3]) // Set {0, 2, 1, 3}intersection(...iterables) ​Source · Returns a new InternSet containing every (distinct) value that appears in all of the given iterables. The order of values in the returned set is based on their first occurrence in the given iterables.jsd3.intersection([0, 2, 1, 0], [1, 3]) // Set {1}superset(a, b) ​Source · Returns true if a is a superset of b: if every value in the given iterable b is also in the given iterable a.jsd3.superset([0, 2, 1, 3, 0], [1, 3]) // truesubset(a, b) ​Source · Returns true if a is a subset of b: if every value in the given iterable a is also in the given iterable b.jsd3.subset([1, 3], [0, 2, 1, 3, 0]) // truedisjoint(a, b) ​Source · Returns true if a and b are disjoint: if a and b contain no shared value.jsd3.disjoint([1, 3], [2, 4]) // true"
