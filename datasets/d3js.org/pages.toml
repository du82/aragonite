title = "Chords | D3 by Observable"
description = "The JavaScript library for bespoke data visualization"
full_description = "Chords ​The chord layout computes angles to generate a chord diagram.chord() ​Source · Constructs a new chord layout with the default settings.jsconst chord = d3.chord();chord(matrix) ​Source · Computes the chord layout for the specified square matrix of size n×n, where the matrix represents the directed flow amongst a network (a complete digraph) of n nodes.The return value of chord(matrix) is an array of chords, where each chord represents the combined bidirectional flow between two nodes i and j (where i may be equal to j) and is an object with the following properties:source - the source subgrouptarget - the target subgroupEach source and target subgroup is also an object with the following properties:startAngle - the start angle in radiansendAngle - the end angle in radiansvalue - the flow value matrix[i][j]index - the node index iThe chords are typically passed to ribbon to display the network relationships.The returned array includes only chord objects for which the value matrix[i][j] or matrix[j][i] is non-zero. Furthermore, the returned array only contains unique chords: a given chord ij represents the bidirectional flow from i to j and from j to i, and does not contain a duplicate chord ji; i and j are chosen such that the chord’s source always represents the larger of matrix[i][j] and matrix[j][i].The chords array also defines a secondary array of length n, chords.groups, where each group represents the combined outflow for node i, corresponding to the elements matrix[i][0 … n - 1], and is an object with the following properties:startAngle - the start angle in radiansendAngle - the end angle in radiansvalue - the total outgoing flow value for node iindex - the node index iThe groups are typically passed to arc to produce a donut chart around the circumference of the chord layout.chord.padAngle(angle) ​Source · If angle is specified, sets the pad angle between adjacent groups to the specified number in radians and returns this chord layout. If angle is not specified, returns the current pad angle, which defaults to zero.chord.sortGroups(compare) ​Source · If compare is specified, sets the group comparator to the specified function or null and returns this chord layout. If compare is not specified, returns the current group comparator, which defaults to null. If the group comparator is non-null, it is used to sort the groups by their total outflow. See also ascending and descending.chord.sortSubgroups(compare) ​Source · If compare is specified, sets the subgroup comparator to the specified function or null and returns this chord layout. If compare is not specified, returns the current subgroup comparator, which defaults to null. If the subgroup comparator is non-null, it is used to sort the subgroups corresponding to matrix[i][0 … n - 1] for a given group i by their total outflow. See also ascending and descending.chord.sortChords(compare) ​Source · If compare is specified, sets the chord comparator to the specified function or null and returns this chord layout. If compare is not specified, returns the current chord comparator, which defaults to null. If the chord comparator is non-null, it is used to sort the chords by their combined flow; this only affects the z-order of the chords. See also ascending and descending.chordDirected() ​Examples · Source · A chord layout for unidirectional flows. The chord from i to j is generated from the value in matrix[i][j] only.chordTranspose() ​Source · A transposed chord layout. Useful to highlight outgoing (rather than incoming) flows."
