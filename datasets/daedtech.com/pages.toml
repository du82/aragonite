/><noscript><img alt='Javier Rivera' src='https://secure.gravatar.com/avatar/1f073cf0865a29afb130a4553707c5e3?s=64&#038;d=wavatar&#038;r=pg' srcset='https://secure.gravatar.com/avatar/1f073cf0865a29afb130a4553707c5e3?s=128&#038;d=wavatar&#038;r=pg 2x' class='avatar avatar-64 photo' height='64' width='64' decoding='async'/> Javier Rivera 11 years ago Reply to Rebecca Yeah, and for those females the same rule may apply with their husbands. So we’re back to square 1. :/ 15 <img alt='jon' src='https://secure.gravatar.com/avatar/b6c87d4f26d6c3acd91a402c3674c4bc?s=64&#038;d=wavatar&#038;r=pg' srcset='https://secure.gravatar.com/avatar/b6c87d4f26d6c3acd91a402c3674c4bc?s=128&#038;d=wavatar&#038;r=pg 2x' class='avatar avatar-64 photo' height='64' width='64' decoding='async'/> jon 11 years ago Reply to John Atten That’s why you have 2 girlfriends. Each thinks that you are with the other and you can go to the office and get some work done! 11 <img alt='Javier Rivera' data-srcset='https://secure.gravatar.com/avatar/1f073cf0865a29afb130a4553707c5e3?s=128&#038;d=wavatar&#038;r=pg 2x' height='64' width='64' decoding='async' data-src='https://secure.gravatar.com/avatar/1f073cf0865a29afb130a4553707c5e3?s=64&#038;d=wavatar&#038;r=pg' class='avatar avatar-64 photo lazyload' src='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==' /><noscript><img alt='Javier Rivera' src='https://secure.gravatar.com/avatar/1f073cf0865a29afb130a4553707c5e3?s=64&#038;d=wavatar&#038;r=pg' srcset='https://secure.gravatar.com/avatar/1f073cf0865a29afb130a4553707c5e3?s=128&#038;d=wavatar&#038;r=pg 2x' class='avatar avatar-64 photo' height='64' width='64' decoding='async'/> Javier Rivera 11 years ago Reply to jon This man is smart. He deserves the cookie. 0 <img alt='Marvin L Eason' src='https://secure.gravatar.com/avatar/466a221486119a4890eae9d6a741f073?s=64&#038;d=wavatar&#038;r=pg' srcset='https://secure.gravatar.com/avatar/466a221486119a4890eae9d6a741f073?s=128&#038;d=wavatar&#038;r