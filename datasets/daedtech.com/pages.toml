title = "5 Things I've Learned in 20 Years of Programming - DaedTech"
description = "This year, I’ve become increasingly acquainted with the DEV platform.  It’s a refreshingly positive oasis in the large sea of angry Reddit commenters and “well actually” connoisseurs that is the broader software world. One interesting facet of this community is that it seems pretty beginner-heavy.  I regularly see posts written by and for industry newbies.  […]"
full_description = 'Nov22 By Erik Dietrich 5 Things I’ve Learned in 20 Years of Programming Category: The Life of a Programmer This year, I’ve become increasingly acquainted with the DEV platform. It’s a refreshingly positive oasis in the large sea of angry Reddit commenters and “well actually” connoisseurs that is the broader software world. One interesting facet of this community is that it seems pretty beginner-heavy. I regularly see posts written by and for industry newbies. And by newbies, I mean folks that are aspiring programmers, in bootcamps, looking for entry level work or in roles with the unfortunate “junior” qualifier. I find this enjoyable. Relative newbies are generally enthusiastic and excited about the industry. And that excitement is infectious. But it also makes me feel my industry greybeard status. <img decoding="async" class="aligncenter size-full wp-image-2388" src="https://daedtech.com/wp-content/uploads/2013/01/Lifer.jpg" alt="" width="391" height="878" srcset="https://daedtech.com/wp-content/uploads/2013/01/Lifer.jpg 391w, https://daedtech.com/wp-content/uploads/2013/01/Lifer-133x300.jpg 133w" sizes="(max-width: 391px) 100vw, 391px" /> I think of what I remember Bob Martin saying on a podcast or in a talk or something. The demand for programmers has grown so dramatically over the last 4-5 decades that the number of programmers is always doubling every five years. As a result, a programmer with 5 years of experienced has more industry tenure than half of the entire industry. Old Man Status I’m now pushing 20 years in the industry. I spent about 10 of those in roles where my primary function was to write code. The other 10 have involved managing programmers, coaching them, consulting with organizations about how to manage them, running a codebase assessment practice and these days, well, actually content marketing. But in all of these roles I’ve written code to varying degrees. By my calculations of geometric programmer growth, this makes me more grizzled than 94% of the industry. So we have a bit of a juxtaposition. I’m a programming lifer hanging around with a bunch of programming newbies. This made me wonder to myself, “if I could summarize this experience into succinct bits of advice, and assuming that anyone actually cared, what would I tell these folks?” <img decoding="async" class="aligncenter size-full wp-image-2387" src="https://daedtech.com/wp-content/uploads/2013/01/Guru.jpg" alt="" width="606" height="622" srcset="https://daedtech.com/wp-content/uploads/2013/01/Guru.jpg 606w, https://daedtech.com/wp-content/uploads/2013/01/Guru-292x300.jpg 292w" sizes="(max-width: 606px) 100vw, 606px" /> And that’s the premise for this post. The following are the things I consider to be the most important lessons and takeaways from a 20 year programming career. 1. Duplication of Knowledge is the Worst “Avoid copy paste programming!” If someone hasn’t yet slapped your hand with a ruler for copying code in your application, pasting it, and adjusting the result (the “copy, paste, and adjust to taste” anti-pattern), consider it slapped now. Stop it. Immediately. This is terrible and sloppy practice. <img decoding="async" class="aligncenter wp-image-6926 size-full" src="https://daedtech.com/wp-content/uploads/2016/10/Spaghetti-e1574404164556.jpg" alt="" width="700" height="805" /> Imagine that you have a perfectly serviceable CalculateBill() method, but the product manager wanders over and says, “we’re onboarding new customers in Mexico, and you calculate bills a little differently there.” So you copy the current method, paste it, rename it CalculateBillMexico() and tweak it as needed. Here are the problems with this approach: If a future change requires adjustments to the core logic, you now have to do extra labor and modify 2 methods. You now have 2 chances to introduce bugs during such changes. You’ve now established a ‘design pattern’ and your code is now begging for a new, redundant method as your global expansion continues. Your labor is going to increase dramatically as you go. It’s only a matter of time before you introduce bugs by forgetting to change things everywhere you need to. Eventually, all of these methods will differ just enough that you can no longer reasonably merge them back together and fix the mess, but without differing so much that you can avoid making 20 changes each time someone updates a billing rule. It’s a mess. And this – copy-paste – is only the surface level problem. Copy-Pasta Is Only the Beginning The real problem is duplication of knowledge in your system. Duplication of knowledge in your system can occur in many ways, and ham-fisted copy-pasta is just the most obvious and obtuse. Consider other examples of duplicate knowledge: A for loop and a code comment right above it explaining the start, end, and increment. A global variable assigned a value inline and then (maybe) re-assigned a value from a configuration file. A database table with columns “PretaxTotal,” “Tax,” and “Total” A wide-ranging ERP system that stores customers in its CRM module and then again in its billing module. With all of this stuff, the best case scenario is that you have processes and systems in place to diligently track the duplication and ensure that you update it concurrently. In the case of a vacuous code comment, it might just be the team’s chief nagging officer browbeating you into always checking for comments when you update code. Or, in the case of the ERP system, it might be a sternly worded department memo telling sales and accounting that they both need to send an official email to ensure that customer information stays in sync. <img decoding="async" class="aligncenter size-full wp-image-4064" src="https://daedtech.com/wp-content/uploads/2014/06/Cartman.jpg" alt="" width="897" height="745" srcset="https://daedtech.com/wp-content/uploads/2014/06/Cartman.jpg 897w, https://daedtech.com/wp-content/uploads/2014/06/Cartman-300x249.jpg 300w" sizes="(max-width: 897px) 100vw, 897px" /> And, remember, those are best case scenarios. Worse scenarios occur when you start building complex logic (which you must then maintain – see the next section) to ensure synchronicity. Maybe you implement a database trigger whenever there’s a change to the “total” column to make sure that PretaxTotal + Tax still equals Total. Or perhaps you write some awkward state checking logic to log a warning when the default global variable value doesn’t match the assigned value in the config file. And, worst case of all is that this data just gets out of sync. Then you, as a programmer, probably don’t have to worry, since figuring out why you never invoiced a customer or how you’ve overcharged customers for years is probably above your paygrade. But you can avoid all of that by ruthlessly rooting out and actively resisting duplication of knowledge anywhere in your systems. 2. Code is a Liability As developers, we learn to love code. It feels good to write code, and it’s exciting to build a thing. Furthermore, we seek out new languages, paradigms, frameworks, stacks, tools, APIs, and libraries to learn. We immerse ourselves and celebrate flow – the state in which we gleefully generate code. <img decoding="async" class="aligncenter size-full wp-image-4429" src="https://daedtech.com/wp-content/uploads/2014/11/DeveloperBeatsTheClock.jpg" alt="" width="498" height="360" srcset="https://daedtech.com/wp-content/uploads/2014/11/DeveloperBeatsTheClock.jpg 498w, https://daedtech.com/wp-content/uploads/2014/11/DeveloperBeatsTheClock-300x216.jpg 300w" sizes="(max-width: 498px) 100vw, 498px" /> And we’re not alone in this celebration. Misguided pointy-haireds have even gone so far as to adopt lines of code generated per hour as a metric of productivity. But even if you don’t get all the way to that point of weapons-grade stupidity, it’s easy to think that more code is better. Code is the DNA of your killer application and business, and companies consider it valuable intellectual property. Forget all that. I can understand why we look at code as an asset. But the reality is that code is a complete liability. Less Is More You know what’s even better than doing in 10 lines of code what someone else did in 100? Doing it with 0 lines of code. Go ahead and write a line of code: printf(“Hello World!”); How many things do you think could go wrong? Will this code be run in an environment that allows console printing? Won’t that magic string be a problem later? Shouldn’t you be logging? It’s a best practice. Have you even thought about the security implications of this? Let’s just conservatively call it an even 10 things that can go wrong with this line of code. So now, let’s add line 2. Do you think that brings the total to 20 things that can go wrong? I’d argue that it probably brings it to more like 100. Call me a pessimist, but I think the relationship between potential problems and lines of code is closer to combinatoric than linear. <img decoding="async" class="aligncenter size-full wp-image-4326" src="https://daedtech.com/wp-content/uploads/2014/11/ScaryComputer-e1522738137994.jpg" alt="" width="700" height="649" /> I’ve actually spent a number of years as a management consultant with a very niche specialty. I do data-driven codebase assessments and help IT leadership make strategic decisions about codebases. So I see, analyze and gather statistics on lots and lots of codebases. If you include codebases that I’ve robo-analyzed on top of client codebases, I’ve gathered detailed statistical info on more than 1,000 of them. I’ve then taken that data and run regression analysis on it, looking for correlations. Do you know what correlates more than anything else with undesirable codebase properties? The size of the codebase. <img decoding="async" class="aligncenter size-full wp-image-4406" src="https://daedtech.com/wp-content/uploads/2014/11/ComplicatedManual.jpg" alt="" width="773" height="603" srcset="https://daedtech.com/wp-content/uploads/2014/11/ComplicatedManual.jpg 773w, https://daedtech.com/wp-content/uploads/2014/11/ComplicatedManual-300x234.jpg 300w" sizes="(max-width: 773px) 100vw, 773px" /> Almost everything bad about codebases has a significant relationship with the size of a codebase, measured in logical lines of code. I love code. I love writing it, studying it, analyzing it, and building things with it. But make no mistake – it’s a massive liability. Always strive to do everything using as little code as humanly possible. 3. Senior Developers: Trust but Verify In my first software engineering job, at age 23, I admired the senior developers there with an almost fervent reverence. Paul, Raymond, Chris, Ken – averaging around 20 years apiece of experience – I can picture all of them vividly, and I found their facility with multiple programming languages utterly amazing. I learned a ton from them. <img decoding="async" class="aligncenter size-full wp-image-7330" src="https://daedtech.com/wp-content/uploads/2017/01/Teacher-with-Classroom-of-Businessmen-e1533097850343.jpg" alt="" width="800" height="533" /> I bring that up because I want to appropriately temper what I’m going to say next. If you’re new to the industry, you will probably, like me, assume that every word from the senior developers in the group is a pearl of wisdom. And, many of them will be – if you’re lucky – especially at first. But not all senior developers are created (or promoted, as it were) equal. In retrospect, the folks that I listed above were actually good programmers and I actually learned good things from them. But I also learned, through my career, that I had lucked out with my initial influences. For every shop with awesome, helpful senior developers exists a shop populated by little people with a little power, whose primary qualification isn’t technical chops, but hanging around for a long time, managing not to get fired, and backing into promotions to titles like “senior” or “principal.” This phenomenon is so common that a term I made up whole cloth, years ago, to describe it, now earns hundreds of Google searches per month. When I coined the term expert beginner, it resonated so heavily with people that the original post has gone viral over and over again. <img decoding="async" aria-describedby="caption-attachment-3960" class="size-full wp-image-3960" src="https://daedtech.com/wp-content/uploads/2014/05/ExpertBeginner.jpg" alt="" width="661" height="673" srcset="https://daedtech.com/wp-content/uploads/2014/05/ExpertBeginner.jpg 661w, https://daedtech.com/wp-content/uploads/2014/05/ExpertBeginner-294x300.jpg 294w" sizes="(max-width: 661px) 100vw, 661px" />Dale will tell you what’s wrong with so-called professional ORMs. I’m not saying this to brag. I’m saying this to warn you about how many senior developers out there superficially seem legitimate, but actually aren’t. So when you’re new, give the seniors the benefit of the doubt and defer to them, but don’t just assume what they tell you is true or right. Verify it on your own (preferably not right in front of them). 4. TDD Is Legit, and It’s a Game-Changer When it comes to anything programming-, or even tech-related, we, as an industry, tend to go pretty nuts with choice-supportive bias. IDE vs lightweight editor discussion? Apple, Windows, or Linux? What do you think of PHP? Tabs or spaces? Bring any of these up and watch as terminally stupid yelling matches occur between those with strong opinions. So with all of that in mind, I recognize that I’m wading into similar territory here with “to TDD or not to TDD.” My intention here isn’t to preach, but rather to share my own experience. <img decoding="async" class="aligncenter size-full wp-image-9830" src="https://daedtech.com/wp-content/uploads/2017/10/Erik-in-the-Woods-e1509314883713.png" alt="" width="700" height="512" /> About 10 years ago, I was a TDD skeptic. I wasn’t a unit testing skeptic, mind you – I’d accepted that as a helpful practice pretty much from the get-go. But TDD? I wasn’t so sure. I decided I’d write a blog post about why TDD wasn’t all that great. But I didn’t want to just write a flimsy, dime-a-dozen opinion piece on the matter. So instead I decided to do a small client project (fixed price, BTW) rigidly following TDD so that I could write a post with the premise “I spent a couple of weeks doing pure TDD and it’s not great.” But fate had other plans. My Aha! Moment with TDD It was awkward and weird for a day. Actually, probably for multiple days. Everything took forever and everything I did felt cumbersome and unnatural. I was just adding note after note as evidence about why this was a terrible way to do things. But then a funny thing happened. I’d been so fixated on this awkward paradigm that I’d managed to spend 4-5 hours writing code one day without actually running the application to see if my changes were working. Usually I’d run the application every 10 minutes or so as a sanity check to see if my changes were truly working. Realizing '
