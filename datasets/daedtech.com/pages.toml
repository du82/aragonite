ecure.gravatar.com/avatar/88af6a0409709eb523d0508928ab5d65?s=128&#038;d=wavatar&#038;r=pg 2x' class='avatar avatar-64 photo' height='64' width='64' decoding='async'/> Dmitriy K 9 years ago Reply to Andy Bailey Part of the problem is that our school system is designed to be as difficult as you’d like it to be, and not difficult by default. For example, you can graduate high school in the United States, without having a single class in chemistry, physics, or higher level math. Unless you are one of the “smart” kids, you simply are never forced to expose your mind to the more difficult subjects. So, when we think of teaching everyone coding or the scientific method, I think the key takeaway is not the knowledge gained itself, but rather the brain exercise and… Read more » 1 <img alt='Erik Dietrich' data-srcset='https://secure.gravatar.com/avatar/8d2a69c7391254ec05da64052c94f3d9?s=128&#038;d=wavatar&#038;r=pg 2x' height='64' width='64' decoding='async' data-src='https://secure.gravatar.com/avatar/8d2a69c7391254'''
