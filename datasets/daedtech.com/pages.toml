full_description = 'Apr4 By Erik Dietrich Where Did My Traffic Go? Hint: It Wasn’t an Algorithm Update Category: Tech Content Marketing | (Editorial note: I originally published this on the Hit Subscribe blog.) If you were to take a stroll through Hit Subscribe’s offering page, you’d see that we now have a first-class “traffic recovery” offering. We added this because of the frequency with which we field the question, “Why is my [usually organic] traffic declining?!” In fact, we field that question so frequently that I’m writing this blog post to distribute to friends and prospects to help with self-diagnosis, potentially saving you some money on a possible engagement. So if that’s what brought you here, sorry about your traffic. But don’t worry. We’ll get it sorted. In this post, I’ll discuss the most common reasons we see for lost traffic, describe the decline pattern you would expect to see if these things were happening, and explain how to start remediating the issue. First Things First: Forget About “The Algorithm” One of my all-time favorite books is Joseph Heller’s Catch 22, wherein he amuses the reader with assorted, specific paradoxes. The military grounds “crazy” fighter pilots and allows sane ones to fly, and they evaluate craziness by whether or not the pilot wants to fly. Anyone who doesn’t want to risk their life flying is non-crazy, and therefore must fly. Of course, paradox exists beyond the novel. Probably preceding it and in a nod to the importance of status illegibility, Groucho Marx once quipped, “I refuse to join any club that would have me as a member.” I’ll offer one another paradox for your consideration: “The algorithm” only punishes those who go out of their way to avoid punishment. In less quippy terms, if you’ve been generating content in good faith without thinking about “the algorithm,” you’re safe. Hit Subscribe, for instance, has managed analytics for more companies than I can count at this point. And we have never seen an algorithm update have any impact on anyone. We honestly don’t even pay attention to them. Scumbag and Non-Scumbag SEO I personally divide the SEO world into two camps: scumbag SEO and non-scumbag SEO. Our non-scumbag SEO methodology consists primarily of two steps: Figure out what questions people are asking the search engine and answer those questions. Do it on a site that doesn’t suck to visit. Luckily, if you’ve been creating content in good faith and earning search traffic, you have, yourself, been executing this process. This is, almost without exception, the case for everyone that asks about traffic declines. Scumbag SEO, on the other hand, adds various additional steps to the process: Spam comment sections with nonsense that talks about your site. Stuff keywords into your prose until your reader thinks they’re having a stroke. Pay an “SEO firm” $5 per hour to do things you’d prefer not to know about. Hack into abandoned WordPress sites and add links to your domain. Conduct “SEO heists” using generative AI. Scumbag SEO is a constant game of taking cost shortcuts and avoiding punishment, always staying one jump ahead of the breadline. And scumbag SEOs are who Google punishes with its algorithm updates. If you’re doing scumbag SEO, trust me, you know it, and you know the risks. You don’t do that kind of thing by accident. (As an aside, a lot of SEO conusltants will likely take issue with what I’m saying here. But they do so from a position of extreme motivated reasoning. Their livelihood depends on you believing the only way to avoid Google’s wrath is to pay an SEO consultant to execute an endless punch list of billable minutiae.) So if it wasn’t the algorithm, where did your traffic go? Let’s take a look. <img decoding="async" class="aligncenter size-full wp-image-12746" src="https://daedtech.com/wp-content/uploads/2020/08/charlatan-e1598414002948.png" alt="" width="775" height="688" /> Read More Mar14 By Erik Dietrich Getting Above the Brief: How to Improve Your Developer Marketing Positioning Category: Tech Content Marketing | Recently, I wrote a post about changing Hit Subscribe’s positioning, which I intend to distribute to clients and prospects in appropriate situations. I shared it to DaedTech as well, assuming that an audience of (I think, still) largely engineers might find the positioning insight interesting. What I didn’t expect was the traction among developer marketing folks, including a bunch of people reaching out to me for direct discussion. But since that’s what happened, I reread that post through the eyes of a developer marketer. And doing that, I realized my explanation of why developer marketing made for terrible positioning was unsatisfyingly hand-wavy: It’s terrible positioning because it’s all about the labor and not at all about the client, what they’re looking for, and what kind of transformation they’re hoping to achieve. That’s true. But there’s not a lot of meat on the bone if you’re a developer-marketing freelancer or small shop. So, even though it has little relevance for either Hit Subscribe’s prospects or my historical engineer audience, I’m going to unpack this a little more. I’ve spent almost fifteen years blogging about whatever is on my mind, so why stop now? Let’s look at the positioning problem with “developer marketing” in detail. <img decoding="async" class="aligncenter size-full wp-image-11334" src="https://daedtech.com/wp-content/uploads/2018/10/Guy-forcing-twitter-on-someone-e1539665612237.jpg" alt="" width="850" height="544" /> Read More Feb19 By Erik Dietrich Gameplanning the SGE Apocalypse Category: Tech Content Marketing | Lately, I’ve found myself fielding client questions related to Google’s creatively named “Search Generative Experience (SGE)”. This is hardly surprising, given that it uses generative AI, and generative AI has forced Gartner to redraw its hype cycle curve with a peak of inflated expectations that now extends about 50 miles into space. (I cringe to think what the trough of disillusionment is going to look like.) In SEO circles, this has caused an absolute frenzy of panic and predictions, given that, like voice search, mobile, and other things before it, SGE poses a potentially existential threat to traditional SEO tactics. Outside of this tight band of technocratic minutiae, the technology probably just inspires some curiosity. If you’re not familiar, this is what we’re talking about: <img decoding="async" class="aligncenter size-full wp-image-13396" src="https://daedtech.com/wp-content/uploads/2024/02/GoogleSGE.png" alt="" width="850" height="664" srcset="https://daedtech.com/wp-content/uploads/2024/02/GoogleSGE.png 850w, https://daedtech.com/wp-content/uploads/2024/02/GoogleSGE-300x234.png 300w, https://daedtech.com/wp-content/uploads/2024/02/GoogleSGE-768x600.png 768w" sizes="(max-width: 850px) 100vw, 850px" /> When you execute a Google search, the SGE experience attempts to answer your question right in the browser rather than simply serving up other results. Anyone who googles something like “chuck norris age” knows that this concept has existed for a while. But SGE expands it and… say the line, Bart… uses generative AI! There are two questions that people are asking me: Do you think SGE is going to replace traditional search results? What should we do if it does? And here are my answers, respectively: I don’t know, and neither does anyone else. This is the question that actually matters, so I’m writing this post to answer it. Read More Jan15 By Erik Dietrich How to Identify Content Refresh Candidates, In Detail Category: Tech Content Marketing | For my first blog entry on 2024’s ledger (BTW, happy new year!) I’m going to do a little double-duty. As you can see from a little slice of my Asana task list, I owe our account managers an updated SOP for identifying client refresh candidates. <img decoding="async" class="size-full wp-image-95396 aligncenter" src="https://www.hitsubscribe.com/wp-content/uploads/2024/01/RefreshTodo.png" alt="" width="545" height="438" /> However, since it’s that time of year when everyone’s “best tools of 2023” listicles start to age like milk, I figure our account managers aren’t the only people that might have use for a primer on identifying content refreshes. So this is both an SOP for them and a blog post for everyone because, well, why not? A Brief Definition of Content Refreshes and Their Value Prop Before diving in, I’d be remiss not to provide a little context. First, when I talk about refreshing content, I mean quite simply modifying any previously published piece of content on a site. The nature of those edits will generally involve updating the article with additional, more current information (hence “refresh”). As a quick example, consider this post about content managers that I wrote back in 2020. In it, I talk about being a blogger for ten years, which is no longer true. So I could “refresh” it by going in and correcting that to thirteen years…and then applying for AARP. As for why you would do this, hobbyists might do it for a purist’s love of correctness. But in the business world, the main motivation is generally to preserve or increase traffic to the content, usually from search engines. Search Engines and Content “Freshness” At this point, I’m going to ask you to set aside your preconceived notion that “Google ‘likes’ fresh content,” if you have it. Anthropomorphizing the search engine isn’t helpful for our purposes here. There’s a less magical and more grounded explanation for executing refreshes. On a long enough timeline, nothing you publish is truly evergreen. If you publish some kind of viral hot take, you’ll get views for a week, then nothing, in what the SEO industry refers to as the “spike of hope and flatline of nope.” <img decoding="async" class="aligncenter wp-image-95398 size-full" src="https://www.hitsubscribe.com/wp-content/uploads/2024/01/SpikeFlatline.png" alt="Content marketing metrics often display varying patterns, including the exhilarating &quot;Spike of Hope&quot; and the discouraging &quot;Flatline of Nope.&quot; " width="720" height="402" /> But if you target keyword ranking and search engine traffic, you’ll typically have a lifecycle where traffic to your post gradually increases for maybe a year or two and then gradually decays over several years. I describe that in a lot more detail in this post about modeling organic traffic. The decay will come, and the best you can hope for is a gentle slope when it does. Enter the refresh. A content refresh aims to slow the decay or even temporarily restore traffic growth. By routinely modifying posts to maintain the latest information on their topic, you ensure that searchers continue to find the content valuable, prompting the search engine to continue to rank the article and bring traffic to it. I should note that, for the rest of this post, I’m going to assume that whoever is executing a refresh is doing so in an SEO-best-practice way, without going into detail about what that looks like. This post is already long enough without that digression. Factors So why not just routinely and obsessively refresh all of your content, as a sort of traffic decay prophylactic? Well, setting aside the obvious issue of cost/labor, especially for high-volume content sites, let’s now consider the variables involved in deciding when to execute a refresh. To do this, I’ll do what I specialize in: ruin the art of content with math. I’ll briefly identify the factors to consider when looking for refresh candidates. From there, each section below will get “mathier” as we go, allowing you to bail out when you’ve had enough. Here are the factors that impact the decision of whether or not to refresh a post: Content age Current content accuracy Content traffic potential Cost of refreshing Potential value of refreshing Traffic trend Risk tolerance vis a vis current traffic And generally speaking, we want a process that takes relevant factors into account and first compiles a list of candidates for refresh. There will then generally be a secondary process to evaluate the candidates, prioritizing and/or culling them. For our account managers, this is generally as simple as gathering refresh candidates and having the client approve. If you control all of the content, the prioritization process will generally account for cost and prioritize based on potential gains. I realize this is all abstract, but don’t worry. The 101 treatment of this will serve as a simple, concrete example. Refresh Identification and Curation 101: A Simple Process for Our Account Managers I’m going to start with the process, and then explain the rationale. Here’s a dead simple summary of the two things we need to do: Find any obviously outdated blog posts via a title search. Find any blog posts ranking between positions 4 and 15 for their “best” keyword. Identification Step-By-Step You’re going to make this list in two passes and later eliminate any duplicates you find. First, find the obviously outdated post. You do that with an advanced Google search: site:{targetsite} intitle:2023|2022|2021|2020|2019 Here’s what this would look like against the New York Times, for instance: <img decoding="async" class="aligncenter wp-image-95399 size-full" src="https://www.hitsubscribe.com/wp-content/uploads/2024/01/NewYorkTimes-e1704563094562.png" alt="" width="800" height="565" /> This will give you a list of any pieces of content on the site with a previous year in the title—a common occurrence with listicle-type articles that will need refreshing. You’ll want to add these URLs to a spreadsheet of candidates. Next up, let’s find articles ranking between 4 and 15. To do this, you’ll log into Ahrefs and use site explorer on the target site, navigating to “top pages.” Here’s what that looks like for our property, makemeaprogrammer.com. <img decoding="async" class="aligncenter wp-image-95400 size-full" src="https://www.hitsubscribe.com/wp-content/uploads/2024/01/makemeaprogrammer-e1704563369580.png" alt="" width="950" height="505" /> Now, you’re going to click on “+keyword filters” and filter by position, entering 4–15. <img decoding="async" class="size-full wp-image-95401 aligncenter" src="https://www.hitsubscribe.com/wp-content/uploads/2024/01/Position4to15.png" alt="" width="524" height="288" /> Apply the filter, and let ‘er rip. This will result in a list of URLs that occupy a position between 4 and 15 for what Ahrefs considers to be the URL’s “best” keyword. Click export, and this list of URLs is added to our candidates list. From here, paste the Ahrefs Excel export into a Google sheet and add any URLs from the outdated title search that aren’t already in there. This is our candidate list. If You Don’t Have Ahrefs Our account managers all have this, but if you don’t, you can still implement the spirit of the activity. The easiest thing to do would be to comb this list of SERP trackers for an inexpensive one or one with a free trial and use it to find rankings for '
