full_description = 'Jun11 By Erik Dietrich Offering Client Trials: Prototypes vs Auditions Category: Business of Freelancing, SEO for Non-Scumbags | (Editorial note: I originally published this one over on the Hit Subscribe blog.) Do you offer a trial? I’ve run Hit Subscribe’s sales for five of our seven years of existence. And this is by far the most common question I field at some point during discovery. The simple answer to the question is “sure, we can do that.” We don’t bother to set any minimums on the amount of content you can commission. We’re not selling automobiles; economies of scale on content are marginal. You can buy as little as a single blog post if that meets your needs. In fact, if you read our client bill of rights, you’ll see that we encourage you to de-risk. If you’re worried about doing something at scale, I view it as our obligation as a vendor to help you prototype success ahead of a large-scale commitment. Where things get nuanced, however, is around the question of which risk you’re minimizing for when you ask about a trial. And that’s at the core of what I want to document here reference for future prospects. We’re happy to start small, but there’s a good chance we don’t think of a trial the same way you do. Auditions vs Prototypes: What Risk Does Each Reduce? To get specific about this, we view small batches as prototypes, and, importantly, not auditions. Consider the difference. Auditions and Prototypes An audition is a subjective evaluation that de-risks against the judge having a large commitment to something they don’t care for. A prototype is an objective evaluation that de-risks against an engagement not achieving a goal or outcome. A simple, if mundane, example of an audition is a wine tasting. Before purchasing an expensive bottle of wine from a winery, it makes sense to run a trial (audition) of “do I, the judge of wine, like this wine?” In a professional context, auditions tend to, or at least should, move beyond simple aesthetics. The judge of a piece of content (ideally) isn’t evaluating whether they personally like it but rather acting as a proxy for others’ opinions or perhaps as some kind of designated expert in the medium. But the subjective, “do I approve of this” evaluation remains at the core. <img decoding="async" class="size-full wp-image-97948 aligncenter" src="https://www.hitsubscribe.com/wp-content/uploads/2024/06/prototype.jpg" alt="" width="700" height="911" />A prototype, on the other hand, involves a measurable big-picture goal and a smaller experiment designed to provide fast feedback on an initiative’s ability to achieve that goal. For instance, let’s go back to the winery. But this time, let’s say you have a goal to fill your small wine cellar with 200 bottles of wine, for less than $5,000, with wine that you feel good about serving to guests. Here your tasting becomes less important in favor of concerns like whether the bottles are in an acceptable price range, will fit in the cellar’s slots, and will appeal to unknown people. In this world, a prototype might involve buying five bottles of wine within your budget, then confirming they fit in the cellar and guests seem to like them. If the run of five goes well, you can scale up your buying from the winery. Read More Sep11 By Erik Dietrich Link Building for Non-Scumbags: Build Authority Without Being Awful Category: Business of Freelancing, SEO for Non-Scumbags | (Editorial note: I originally published this on Hit Subscribe, and am going to gradually 301 the rest of the SEO/digital marketing content over there, where it makes more editorial sense. But I’ll keep cross-posting it here, if it seems like might be relevant to this audience. I’ll also keep posting miscellaneous rants and thoughts for indies and techies here.) If the title here seems aggressive, my hope is that you’ll empathize with me by the time you’re done reading. Throughout this post, I’m going to post screenshots of link building outreach I’ve received over the years. They’re not going to be relevant to the flow of the post, per se. Instead, I’m going to invite you on a walk with me through a digital garden of spam while I explain how to earn yourself backlinks without being terrible or hiring someone else to be terrible on your behalf. You see, these screenshots represent how most link building outfits operate. And they’re just the tip of the iceberg of what I receive—just the ones funny enough to save. Link Building: What It Is, Briefly If you don’t know what I’m talking about when I say link building, let’s start simply. What is link building? Well, for SEO purposes, the more links you have from other sites to yours, the more search engines like your site, and they’ll rank your content accordingly. So link building is an activity wherein you specifically “encourage” the world to link to your site, through a variety of tactics. These tactics run the gamut from “create interesting content that people want to link” to “hack into some poor blogger’s WordPress instance and insert 40 million links before someone kicks you out and has you arrested.” The Link Building State of the Art Sadly, the state of the art in link building looks a lot more like the latter than the former. <img decoding="async" aria-describedby="caption-attachment-93100" class="size-full wp-image-93100" src="https://www.hitsubscribe.com/wp-content/uploads/2023/08/Links3.png" alt="" width="564" height="388" />Aw, you don’t have to visit if you don’t want to, Tony Montana, but if you do, please say hello to my little friend. If you go out and google link building, I’m sure you’ll hear from the world’s top SEO tool vendors. And I’m also sure that—caveated with appropriate cautions not to leverage underhanded, “black hat SEO” tactics and that the best approach is earning links via “good” content—they’ll encourage you to undertake an extremely outreach- (read: spam-) heavy approach, such as: Create a throwaway gmail address because boy are people going to report what you’re doing as spam. Create an email template wherein you beg for links or else mendaciously tell recipients that it’s in their best interest to link to you. Unleash that email template onto the blogosphere, like a firehose taking out a few butterflies on some flowers. If that doesn’t work, just try to bribe people. In parallel to all of that, offer filler content with links to your site as a guest post for other sites. If that doesn’t work, try to sneak content with links onto various sites. As a last resort, also bribe them to publish the filler content. As you might imagine, these tactics yield a low success rate. And that means the only way to make them succeed is to execute them at incredibly high volume and low cost. Read More Jun29 By Erik Dietrich Keyword Research Case Studies: Glossaries Category: Business of Freelancing, SEO for Non-Scumbags | My quest to document content campaigns and their keyword research tactics lurches on today. For this particular installment, I’m going to document one we (Hit Subscribe) have been doing a lot lately: the glossary. In case you haven’t been following my rather halting process, this is another addendum post to the SEO for Non-Scumbags series. Glossary Campaigns: A Quick Definition As with tool user campaigns, glossary campaigns lend themselves pretty well to an elevator pitch. Create a glossary of terms relevant to your brand and publish a “post” for each term. I put post in quotes because I tend to think of these as glossary entries, rather than blog posts, even if the mechanism through which you publish them is a blog CMS. It’s like you’re building a specific, niche wiki on your site. The glossary should, ideally, have a jump page with quick definitions and links, and then URLs for each individual entry, ideally with “glossary” baked into the URL. InfluxData does this perfectly, with a glossary jump page and then pages like this one, about columnar databases. Notice the URL scheme with “glossary” (influxdata.com/glossary/) for the main page and then satellite pages that extend that page (influxdata.com/glossary/columnardb). Glossary campaigns limit themselves to nouns (what is it searches) by their nature. As a result, segmentation is quite loose — it’s just anyone curious what the term means. <img decoding="async" class="aligncenter size-full wp-image-8645" src="https://daedtech.com/wp-content/uploads/2017/05/Bookstore-e1548221908294.jpg" alt="" width="800" height="692" /> Read More Feb27 By Erik Dietrich Keyword Research Case Studies: Tool-User Campaigns Category: Business of Freelancing, SEO for Non-Scumbags | Hola amigos. It’s been a long time since I last rapped at ya‘. (If you know what that’s from, we’re buddies for life) Today I’ve got another installment of the addendum to my “SEO for Non-Scumbags” series. In this series-within-a-series, I’m walking in detail through applied keyword research tactics. This may pickup steam, too, because we’re starting to teach clients to do this, instead of just our staff. At any rate, today I’m going to talk about tool-user campaigns. Like the last type of campaign, “ownership,” tool-user campaigns are pretty straightforward to execute. <img decoding="async" class="aligncenter wp-image-13270 size-full" src="https://daedtech.com/wp-content/uploads/2023/02/Jim-e1677534187179.png" alt="" width="750" height="779" srcset="https://daedtech.com/wp-content/uploads/2023/02/Jim-e1677534187179.png 750w, https://daedtech.com/wp-content/uploads/2023/02/Jim-e1677534187179-289x300.png 289w" sizes="(max-width: 750px) 100vw, 750px" /> Tool-User Campaigns: A Quick Definition In a sense, this content ideation tactic is as simple as “if it’s about {tool}, let’s create a post about it.” You’re essentially looking for winnable keywords with volume that contain a specific term, where that term is a tool. From a segmentation perspective, you’re reasoning that there’s a pretty good chance anyone googling that tool would make a good user or customer. Or, at the very least, someone you want to reach. For instance, Architect makes a continuous delivery platform, aimed to make life easier for developers doing devops-y things. So if they create a piece of content about using the Terraform K8s provider, they’re basically saying “we’re assuming that if someone is using and Googling Terraform (or K8s), it’s probably someone we want on our site.” A tool-user campaign is when a site works a steady diet of content like that (targeting users of a tool, generally with tutorials). Read More Dec16 By Erik Dietrich Keyword Research Case Studies: Ownership Campaigns Category: Business of Freelancing, SEO for Non-Scumbags | I’d wrapped the core part of the SEO for Non-Scumbags series by poisoning the idea of content-creation-as-art with art’s natural, mortal enemy: ROI. For this reason, I thought folks might not take me up on my tepid call to action of “I may do more stuff, if anyone wants.” Turns out, against all odds, some of you do want. So I’m going to make that happen, both to give the people what they want and also to opportunistically teach some of our staff to do keyword research. Toward that latter end, I’ll structure this as an appendix to the original content, with shorter vignettes corresponding to specific keyword research tactics. Today, I’ll do the most straightforward one: ownership campaigns. <img decoding="async" class="aligncenter size-full wp-image-10054" src="https://daedtech.com/wp-content/uploads/2017/11/Rosie-the-Riveter-e1511241459898.jpg" alt="" width="700" height="697" /> Read More « Older Posts'
