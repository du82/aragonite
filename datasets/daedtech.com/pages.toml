acebook.png" /><img decoding="async" alt="twitter" title="DaedTech on Twitter" class="synved-share-image synved-social-image synved-social-image-follow" width="32" height="32" style="display: inline;width:32px;height:32px;margin: 0;padding: 0;border: none;box-shadow: none" src="https://daedtech.com/wp-content/plugins/social-media-feather/synved-social/image/social/regular/64x64/twitter.png" /><img decoding="async" alt="linkedin" title="DaedTech on LinkedIn" class="synved-share-image synved-social-image synved-social-image-follow" width="32" height="32" style="display: inline;width:32px;height:32px;margin: 0;padding: 0;border: none;box-shadow: none" src="https://daedtech.com/wp-content/plugins/social-media-feather/synved-social/image/social/regular/64x64/linkedin.png" /><img decoding="async" alt="rss" title="Subscribe via RSS" class="synved-share-image synved-social-image synved-social-image-follow" width="32" height="32" style="display: inline;width:32px;height:32px;margin: 0;padding: 0;border: none;box-shadow: none" src="https://daedtech.com/wp-content/plugins/social-media-feather/synved-social/image/social/regular/64x64/rss.png" /><img decoding="async" alt="youtube" title="DaedTech on Youtube" class="synved-share-image synved-social-image synved-social-image-follow" width="32" height="32" style="display: inline;width:32px;height:32px;margin: 0;padding: 0;border: none;box-shadow: none" src="https://daedtech.com/wp-content/plugins/social-media-feather/synved-social/image/social/regular/64x64/youtube.png" /><img decoding="async" alt="mail" title="Send an email" class="synved-share-image synved-social-image synved-social-image-follow" width="32" height="32" style="display: inline;width:32px;height:32px;margin: 0;padding: 0;border: none;box-shadow: none" src="https://daedtech.com/wp-content/plugins/social-media-feather/synved-social/image/social/regular/64x64/mail.png" />'''
