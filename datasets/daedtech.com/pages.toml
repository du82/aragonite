title = "Technical Debt Archives - DaedTech"
full_description = 'Jun21 By Erik Dietrich Exploring the Tech Debt In Your Codebase Category: .NET Tags: C#, NDepend, Technical Debt | Editorial note: I originally wrote this for the NDepend blog. You can check out the original here, at their site. While you’re there, check out the tech debt features in the newest version of NDepend. Recently, I posted about how the new version of NDepend lets you compute tech debt. In that post, I learned that I had earned a “B” out of the box. With 40 minutes of time investment, I could make that an “A.” Not too shabby! In that same post, I also talked about the various settings in and around “debt settings.” With debt settings, you can change units of debt (time, money), thresholds, and assumptions of working capacity. For folks at the intersection of tech and business, this provides an invaluable way to communicate with the business. But I really just scratched the surface with that mention. You’re probably wondering what this looks like in more detail. How does this interact with the NDepend features you already know and love? Well, today, I’d like to take a look at just that. To start, let’s look at the queries and rules explorer in some detail. Introducing Quality Gates Take a look at this screenshot, and you’ll notice some renamed entries, some new entries, and some familiar ones. <img decoding="async" class="size-full wp-image-7687 alignnone" src="https://daedtech.com/wp-content/uploads/2017/02/NDependQueriesAndRulesExplorer.png" alt="" width="550" height="309" srcset="https://daedtech.com/wp-content/uploads/2017/02/NDependQueriesAndRulesExplorer.png 550w, https://daedtech.com/wp-content/uploads/2017/02/NDependQueriesAndRulesExplorer-300x169.png 300w" sizes="(max-width: 550px) 100vw, 550px" /> In the past, “Code Smells” and “Code Regressions” had the names “Code Quality” and “Code Quality Regression,” respectively. With that resolved, the true newcomers sit on top: Quality Gates and Hot Spots. Let’s talk about quality gates. Read More Jun14 By Erik Dietrich The One Thing Every Company Can Do to Reduce Technical Debt Category: Language Agnostic Tags: NDepend, Technical Debt | 7 Comments Editorial Note: I originally wrote this post for the NDepend blog. You can check out the original here, at their site. While you’re there, take a look at the technical debt functionality in the latest version of NDepend. The idea of technical debt has become ubiquitous in our industry. It started as a metaphor to help business stakeholders understand the compounding cost of shortcuts in the code. Then, from there, it grew to define perhaps the foundational of tradeoffs in the tech world. You’d find yourself hard pressed, these days, to find a software shop that has never heard of tech debt. It seems that just about everyone can talk in the abstract about dragons looming in their code, portending an eventual reckoning. “We need to do something about our tech debt,” has become the rallying cry for “we’re running before we walk.” <img decoding="async" class="alignnone size-full wp-image-4755" src="https://daedtech.com/wp-content/uploads/2015/04/Dragons.jpg" alt="" width="950" height="706" srcset="https://daedtech.com/wp-content/uploads/2015/04/Dragons.jpg 950w, https://daedtech.com/wp-content/uploads/2015/04/Dragons-300x223.jpg 300w" sizes="(max-width: 950px) 100vw, 950px" /> As with its fiscal counterpart, when all other factors equal, having less tech debt is better than having more. Technical debt creates drag on the pace of new feature deliver until someone ‘repays’ it. And so shops constantly grapple with the question, “how can we reduce our tech debt?” I could easily write a post where I listed the 3 or 5 or 13 or whatever ways to reduce tech debt. First, I’d tell you to reduce problematic coupling. Then, I’d tell you to stop it with the global variables. You get the idea. But today, I want to do something a bit different. I want to talk about the one thing that every company can do to reduce tech debt. I consider it to be sort of a step zero. Read More Jan12 By Erik Dietrich Using NDepend to Avoid Technical Debt Category: Language Agnostic Tags: NDepend, Software Management, Technical Debt | Editorial Note: I originally wrote this post for the NDepend blog. You can check out the original here, at their site. The term “technical debt” has become ubiquitous in the programming world. In the most general sense, it reflects the idea that you’re doing something easy in the moment, but that you’re going to pay for, with interest, in the long run. Conceived this way, to avoid technical debt would mean to avoid taking out these “time loans” in general. There’s a subtle bit of friction, however, when using the (admittedly very helpful) concept of technical debt to communicate with business stakeholders. For them, carrying debt is generally a standard operating procedure and often a tool, and it doesn’t have quite the same connotation. When developers talk about incurring technical debt, it’s overwhelmingly in the context of “we’re doing something ugly and dirty to get this thing shipped, and man are we going to pay for it later.” That’s a far cry from, “I’m going to finance a fleet of trucks so that we can expand our delivery operation regionally,” that an accountant or executive might understand. Taking on technical debt is colloquially more akin to borrowing money from a guy that breaks thumbs. <img decoding="async" class="aligncenter size-full wp-image-7250" src="https://daedtech.com/wp-content/uploads/2017/01/Shark-at-a-desk.jpg" alt="" width="1506" height="1379" /> The reason there’s this slight dissonance between the usages is that technical debt in codebases is a lot more likely to be incurred unwittingly (or improvidently). The reason, in turn, for this could make up the subject of an entire post, but suffice it to say that the developers are often shielded from business decisions and consequences. It is thus harder for them to be party to all factors of such a tradeoff — a role often played by people with titles like “business analyst” or “project manager.” In light of this, let’s talk about avoiding the “we break thumbs” variety of tech debt, and how NDepend can help. This sort of tech debt takes the form of “things you realize probably aren’t great, but you might not realize how long-term damaging they are.” Read More Jul31 By Erik Dietrich The Human Cost of Tech Debt Category: The Life of a Programmer Tags: Metaphors for Software, Technical Debt | 53 Comments Editorial Note: I originally wrote this post for the Infragistics blog. Head over to their site and check out the original. While you’re there, have a look at the other blog authors and their product offering. If you’re not already familiar with the concept of technical debt, it’s worth becoming familiar with it. I say this not only because it is a common industry term, but because it is an important concept. Coined by Ward Cunningham, the term introduces the idea that taking shortcuts in your software today not only means paying the price eventually — it means paying that price with interest. In other words, introducing that global variable today and saving half a day’s work ahead of shipping means that you’re going to pay for it with more than half a day’s labor down the line. <img decoding="async" class="aligncenter size-full wp-image-6708" src="https://daedtech.com/wp-content/uploads/2016/07/Man-holding-heavy-chest.png" alt="Man holding heavy chest" width="575" height="404" srcset="https://daedtech.com/wp-content/uploads/2016/07/Man-holding-heavy-chest.png 575w, https://daedtech.com/wp-content/uploads/2016/07/Man-holding-heavy-chest-300x211.png 300w" sizes="(max-width: 575px) 100vw, 575px" /> The Power of the Metaphor I’ve spent significant time doing IT management consulting in recent years, after spending years and years writing code. And I can tell you that this metaphor for shortcuts in the codebase is a powerful one when it comes to communication between the business and the software development group. When you explain software decisions to managers and MBAs using the language of economics, they get it. Because of the metaphor’s power and subsequent effectiveness for business concerns, it is often used to describe the health of projects, particularly vis a vis deadlines and milestones. The developers may communicate that an aggressive deadline will result in technical debt, making features in the future take longer to ship. Analysts and project managers might account for technical debt when discussing slipped deadlines. IT upper management might ask for an assessment of the amount of technical in an application when making a strategic, replace/retire/rewrite decision. The problem of technical debt is for most people, in essence, a problem of time to market. But I’d like to talk today about the human side of the problem. And, make no mistake — in business, all human problems are also business problems,viewed with a wide enough lens. Unhappy humans are unhappy workers, and unhappy workers are less productive. Yet, this angle of technical debt is seldom discussed, in my experience. Read More'
