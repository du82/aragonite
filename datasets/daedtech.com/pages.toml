title = "Business of Freelancing Archives - DaedTech"
full_description = 'Jun11 By Erik Dietrich Offering Client Trials: Prototypes vs Auditions Category: Business of Freelancing, SEO for Non-Scumbags | (Editorial note: I originally published this one over on the Hit Subscribe blog.) Do you offer a trial? I’ve run Hit Subscribe’s sales for five of our seven years of existence. And this is by far the most common question I field at some point during discovery. The simple answer to the question is “sure, we can do that.” We don’t bother to set any minimums on the amount of content you can commission. We’re not selling automobiles; economies of scale on content are marginal. You can buy as little as a single blog post if that meets your needs. In fact, if you read our client bill of rights, you’ll see that we encourage you to de-risk. If you’re worried about doing something at scale, I view it as our obligation as a vendor to help you prototype success ahead of a large-scale commitment. Where things get nuanced, however, is around the question of which risk you’re minimizing for when you ask about a trial. And that’s at the core of what I want to document here reference for future prospects. We’re happy to start small, but there’s a good chance we don’t think of a trial the same way you do. Auditions vs Prototypes: What Risk Does Each Reduce? To get specific about this, we view small batches as prototypes, and, importantly, not auditions. Consider the difference. Auditions and Prototypes An audition is a subjective evaluation that de-risks against the judge having a large commitment to something they don’t care for. A prototype is an objective evaluation that de-risks against an engagement not achieving a goal or outcome. A simple, if mundane, example of an audition is a wine tasting. Before purchasing an expensive bottle of wine from a winery, it makes sense to run a trial (audition) of “do I, the judge of wine, like this wine?” In a professional context, auditions tend to, or at least should, move beyond simple aesthetics. The judge of a piece of content (ideally) isn’t evaluating whether they personally like it but rather acting as a proxy for others’ opinions or perhaps as some kind of designated expert in the medium. But the subjective, “do I approve of this” evaluation remains at the core. <img decoding="async" class="size-full wp-image-97948 aligncenter" src="https://www.hitsubscribe.com/wp-content/uploads/2024/06/prototype.jpg" alt="" width="700" height="911" />A prototype, on the other hand, involves a measurable big-picture goal and a smaller experiment designed to provide fast feedback on an initiative’s ability to achieve that goal. For instance, let’s go back to the winery. But this time, let’s say you have a goal to fill your small wine cellar with 200 bottles of wine, for less than $5,000, with wine that you feel good about serving to guests. Here your tasting becomes less important in favor of concerns like whether the bottles are in an acceptable price range, will fit in the cellar’s slots, and will appeal to unknown people. In this world, a prototype might involve buying five bottles of wine within your budget, then confirming they fit in the cellar and guests seem to like them. If the run of five goes well, you can scale up your buying from the winery. Read More Nov29 By Erik Dietrich An Actually Strategic Way to Do SEO Competitor Analysis Category: Business of Freelancing, Tech Content Marketing | I just spent part of my morning writing up internal documentation to operationalize so-called SEO competitor analysis. If you don’t believe me and think this is just a rhetorical flourish, here’s a really boring screenshot. <img decoding="async" class="aligncenter wp-image-94828 size-full" src="https://www.hitsubscribe.com/wp-content/uploads/2023/11/CompetitorSOP-e1700321405785.png" alt="" width="700" height="486" /> As I was doing this, my last step was to record a high-level explanation of the document, which included this paragraph: Clients have various ideas about what a competitor analysis is or should be, and they’re often requesting it by rote, as it’s something that SEO firms tend to do. Assessing competitors, however, tends to be of somewhat limited value, since many of them aren’t even trying for search traffic, or, if they are, they might be doing it naively. After typing that, I immediately wrapped up the SOP and started writing this blog post. My intent is to have it up here on the blog so that we can send it to anyone requesting a competitor analysis. And I want to do that because we do this differently than the typical SEO firm. You deserve an explanation of how and why. Read More Oct16 By Erik Dietrich The Agency Client Bill of Rights Category: Business of Freelancing | (Editorial note: I originally wrote this post over on the Hit Subscribe blog) Lately, within the account management function of Hit Subscribe, we’ve been swatting around a philosophical question. Rather than having disparate sales and account management departments, could a unified customer success group serve both functions for our business? We currently, tentatively believe that the answer is “yes,” and we’re proceeding accordingly. But to make this work, we realized that we’d need to provide collateral about how we work with clients prior to when we’ve historically done this: during kickoff and onboarding. This realization dovetailed nicely with the fact that a lot of the reader/viewer questions I answer in my freelancer Q&A video series are essentially about how to conduct yourself as the owner of a practice. So I figured I’d write it up, get buy-in from Hit Subscribe’s account managers, and publish the results. And that’s what this post is. <img decoding="async" class="aligncenter wp-image-93922 size-full" src="https://www.hitsubscribe.com/wp-content/uploads/2023/09/Hit-Subscribes-Client-Bill-of-Rights-e1696007809341.png" alt="Scroll with your rights written on it" width="850" height="818" /> I’m framing this as a list of rights (with a table of contents for navigability), and I intend our clients and prospects to be the primary audience, with newly hired account managers as a secondary audience. If any other readers enjoy this or get some use out of it, hey, it’s always nice to put a little collateral good into the world when you can. What follows is what you can expect from Hit Subscribe—and what we hope you’ll hold us to account on. We also have a PDF, cheat sheet version you can download, if you like. The Right to Freedom from Gimmicks The Right to Minimize Your Risk The Right to the Best Deal The Right to Non-Commitment The Right to Refunds The Right to Know Prices Up Front The Right to Labor Transparency The Right to Unconflicted Advice The Right to Easily Understood Deliverables The Right to Vendor Accountability The Right Not to Play Referee The Right to Fast, Predictable Responses Read More Sep11 By Erik Dietrich Link Building for Non-Scumbags: Build Authority Without Being Awful Category: Business of Freelancing, SEO for Non-Scumbags | (Editorial note: I originally published this on Hit Subscribe, and am going to gradually 301 the rest of the SEO/digital marketing content over there, where it makes more editorial sense. But I’ll keep cross-posting it here, if it seems like might be relevant to this audience. I’ll also keep posting miscellaneous rants and thoughts for indies and techies here.) If the title here seems aggressive, my hope is that you’ll empathize with me by the time you’re done reading. Throughout this post, I’m going to post screenshots of link building outreach I’ve received over the years. They’re not going to be relevant to the flow of the post, per se. Instead, I’m going to invite you on a walk with me through a digital garden of spam while I explain how to earn yourself backlinks without being terrible or hiring someone else to be terrible on your behalf. You see, these screenshots represent how most link building outfits operate. And they’re just the tip of the iceberg of what I receive—just the ones funny enough to save. Link Building: What It Is, Briefly If you don’t know what I’m talking about when I say link building, let’s start simply. What is link building? Well, for SEO purposes, the more links you have from other sites to yours, the more search engines like your site, and they’ll rank your content accordingly. So link building is an activity wherein you specifically “encourage” the world to link to your site, through a variety of tactics. These tactics run the gamut from “create interesting content that people want to link” to “hack into some poor blogger’s WordPress instance and insert 40 million links before someone kicks you out and has you arrested.” The Link Building State of the Art Sadly, the state of the art in link building looks a lot more like the latter than the former. <img decoding="async" aria-describedby="caption-attachment-93100" class="size-full wp-image-93100" src="https://www.hitsubscribe.com/wp-content/uploads/2023/08/Links3.png" alt="" width="564" height="388" />Aw, you don’t have to visit if you don’t want to, Tony Montana, but if you do, please say hello to my little friend. If you go out and google link building, I’m sure you’ll hear from the world’s top SEO tool vendors. And I’m also sure that—caveated with appropriate cautions not to leverage underhanded, “black hat SEO” tactics and that the best approach is earning links via “good” content—they’ll encourage you to undertake an extremely outreach- (read: spam-) heavy approach, such as: Create a throwaway gmail address because boy are people going to report what you’re doing as spam. Create an email template wherein you beg for links or else mendaciously tell recipients that it’s in their best interest to link to you. Unleash that email template onto the blogosphere, like a firehose taking out a few butterflies on some flowers. If that doesn’t work, just try to bribe people. In parallel to all of that, offer filler content with links to your site as a guest post for other sites. If that doesn’t work, try to sneak content with links onto various sites. As a last resort, also bribe them to publish the filler content. As you might imagine, these tactics yield a low success rate. And that means the only way to make them succeed is to execute them at incredibly high volume and low cost. Read More Aug1 By Erik Dietrich Every Billable Hour is Amateur Hour Category: Business of Freelancing | 14 Comments I know a bunch of you already have your pitchforks out, so let me start out by establishing some goalposts for my premise. When I’m done, you may still want to skewer me, but at least it’ll be for the right reasons, if you do. <img decoding="async" class="aligncenter size-full wp-image-9852" src="https://daedtech.com/wp-content/uploads/2017/10/pitchforks-storming-castle-e1509508230470.jpg" alt="" width="700" height="539" /> Through the rest of the post, I’m going to draw a distinction between amateurishness at craft, and amateurishness at business. Understanding my premise hinges on understanding that someone (a technician, in particular) can simultaneously be a craft professional and a business amateur. Oh, and incidentally, I’m not overloading the definition of amateur — I’m using it in the most literal sense. 1. Taking part in an activity for pleasure and not as a job, or (of an activity) done for pleasure and not as a job 2. Someone who lacks skill in doing something Professional Craftsperson, Amateur Business Owner For ease of illustration, let’s imagine someone following my own career arc. This person spends years employed as a technician. In my case, a software engineer. This person, in their salaried capacity, becomes a professional, non-amateur, generalist software engineer. Specifically, they become professional at maintaining a generalized, diverse skillset that allows another party (the employer) to deploy them in a wide variety of ad hoc situations. The professional software engineer becomes agnostic about things like tech stacks, implementation particulars, and, crucially, business outcomes. They hyper-optimize for versatility and feature shipping efficiency, abdicating on any true study of the business, beyond off-the-cuff opinions (“this feature is stupid, no one will buy this.”) Now let’s assume this software engineer decides to hang out a shingle as a freelancer. Almost without exception, this launches them into a pupal state between employee and business owner. They become amateur business owners. <img decoding="async" class="aligncenter size-full wp-image-7250" src="https://daedtech.com/wp-content/uploads/2017/01/Shark-at-a-desk-e1548399211128.jpg" alt="" width="800" height="733" /> You can recognize this by the continued focus on matters of technician craft and navel gazing about how they work, rather than for whom or why. They continue to abdicate on business outcomes for their clients, even though delivering client/customer outcomes is the absolute backbone of business professionalism. So this formerly professional craftsperson becomes an amateur business owner. And the billable hour is, quite literally, the currency of amateur business ownership. Every hour they bill is thus an amateur hour. Read More « Older Posts'
