full_description = '''Ask Me a Question Do you have something you’d like to ask? Then, by all means, ask me a question! Here’s how it works. You submit the question and it gets processed and put into my post topics backlog. I will try to answer in the form of a blog post or a youtube video. I may also simply reply with an email. I do try to turn them around in a reasonable amount of time, but no guarantees. Since launching this, I’ve been pleasantly surprised by the number of questions that I receive. The only downside of that is the built in time lag. So, I wouldn’t recommend asking anything that’s overly time sensitive. <img decoding="async" class="wp-image-2490 size-medium aligncenter" src="https://daedtech.com/wp-content/uploads/2013/01/Confused-234x300.jpg" alt="Ask a Question" width="234" height="300" /> Notice: JavaScript is required for this content. No Fields Found. var formDisplay=1;var nfForms=nfForms||[];var form=[];form.id='9';form.settings={"ninjaForms":"Ninja Forms","changeEmailErrorMsg":"Please enter a valid email address!","changeDateErrorMsg":"Please enter a valid date!","confirmFieldErrorMsg":"These fields must match!","fieldNumberNumMinError":"Number Min Error","fieldNumberNumMaxError":"Number Max Error","fieldNumberIncrementBy":"Please increment by ","fieldTextareaRTEInsertLink":"Insert Link","fieldTextareaRTEInsertMedia":"Insert Media","fieldTextareaRTESelectAFile":"Select a file","formErrorsCorrectErrors":"Please correct errors before submitting this form.","formHoneypot":"If you are a human seeing this field, please leave it empty.","validateRequiredField":"This is a required field.","honeypotHoneypotError":"Honeypot Error","fileUploadOldCodeFileUploadInProgress":"File Upload in Progress.","fileUploadOldCodeFileUpload":"FILE UPLOAD","currencySymbol":"$","fieldsMarkedRequired":"Fields marked with an <span class=\"ninja-forms-req-symbol\">*<\/span> are required","thousands_sep":",","decimal_point":".","siteLocale":"en_US","dateFormat":"d\/m\/Y"