title = "Expert Beginner Archives - DaedTech"
full_description = 'Mar7 By Erik Dietrich Expert Beginners Rendered Obsolete Category: The Life of a Programmer Tags: Developer Hegemony, Expert Beginner | 8 Comments I got an awesome tweet at the Expert Beginner twitter account the other day. Omer had one of those “wow, I can’t believe I never thought of this myself” ideas. @ExpertBeginner1 how are you with anonymous contributions? open DMs? — Omer van Kloeten (@omervk) March 6, 2017 Yes, please. Up until this point, I have run this account as a solo effort. But I certainly have no exclusive claim to some of the world’s worst wisdom delivered with some of the world’s most confidence. So I am now accepting submissions via twitter DM. Please send them my way, and I will curate, catalog and queue. As my work becomes increasingly remote and reclusive, I need all the fodder I can get for the account. Speaking of Expert Beginners In case you followed this blog only recently, I’m talking about a phenomenon that started with this post. You know that one job you had once? It lasted a year and a half, but seemed like 12. It dragged because of the senior principal architect on the project. Courtesy of random name generator, we’ll call him Dale. Dale eschewed popular frameworks because he once wrote this combination ORM-MVC platform back in 2004 and, in his mind, it’s still chugging along nicely. This framework set the world record for depth of inheritance hierarchy at 124, per your last count. Every time you wanted to add a column to some table in a CRUD app, Dale would have to come over and perform open heart surgery at your desk while you tried to read XKCD on your phone without his notice. But should you ever go off on your own and download something like an actual ORM, Dale would go completely nuclear. In Dale, we have a classic Expert Beginner. You put up with him for as long as you could before moving on to greener pastures, but you’re pretty sure he’s still there, jamming his tortured framework into some already-doomed CRUD app. <img decoding="async" aria-describedby="caption-attachment-3960" class="size-full wp-image-3960" src="https://daedtech.com/wp-content/uploads/2014/05/ExpertBeginner.jpg" alt="" width="661" height="673" srcset="https://daedtech.com/wp-content/uploads/2014/05/ExpertBeginner.jpg 661w, https://daedtech.com/wp-content/uploads/2014/05/ExpertBeginner-294x300.jpg 294w" sizes="(max-width: 661px) 100vw, 661px" />Dale will tell you what’s wrong with so-called professional ORMs. Anyway, as I decided to throw the satirical account open to public suggestions, I began to contemplate this older concept of mine against the backdrop of some newer ones. (Can you believe this dude is 5 years old, already?) Expert Beginners and Developer Hegemony Specifically, I started to think about how the relatively simple profile of the Expert Beginner has aged. In the years between his birth on my blog and the recent completion of my book, Developer Hegemony, I’ve spent a lot of time and mileage consulting. In particular, I have done a good bit of training and management consulting following a stint as a technical executive. This has furnished me with the office politics equivalent of language immersion. I began to wonder about the fate of the expert beginner in the world of developer hegemony that I foresee. I mention him some in the book, kind of in passing. But what will actually come of him? Read More Dec9 By Erik Dietrich Preemptively Identifying Dead Seas Category: Uncategorized, You Asked For It Tags: Career, Expert Beginner, Job Search, Soft Skills | 2 Comments Today, I’m going to try to tie various strands of my life together into one lanyard of efficiency. I haven’t done a reader question for a while, so I’ll change that today. In this post, I’ll offer a terminology nod to dead seas, a now-defunct term that became one of my favorites. The best context I can now offer lies here, in a post of mine, summarizing it. A few months back, I made a post on NDepend called, “What to do When Your Colleague Creates Spaghetti Code.” In this post, I described a caricature that I randomly named Bill, who you might recognize as sort of a quintessential expert beginner. I subsequently received a reader question about this subject. How can I tell if the company interviewing me has a “Bill?” (i.e. “How can I preemptively identify expert beginners?”) Well, I’ll take a crack at that. Expert Beginner Primordial Soup I think that a meaningful examination of this question requires us to look at the conditions that give rise to such archetypes. In the original series/book, I cover part of it. The organization must draw sort of a neat little box around the techie group and then put an advanced beginner in charge. From there, the concoction needs to simmer in a nicely insular environment, in which the budding expert beginner receives no real negative feedback, second guessing, or industry exposure. But this assessment focuses entirely on the software development organization. An ensconced expert beginner reigning over some miserable, backward fiefdom requires “the business” as an accomplice. Simply put, it requires the operational laziness to allow your business to be ruled by an unaccountable “expert” operating with utter opacity. Expert Beginner Hut Imagine you started a pizza shop and hired a pizza chef to run the kitchen. Then imagine that you completely delegated the cooking to the chef, as you should. Life treats all of you well for a while and you develop some business. But now complaints from customers start to come in about the taste and presentation of the pizza. “My pizza was incredibly salty and all of the pepperoni was isolated to three slices!” When you bring this problem to the chef, he tells you that such is life when it comes to making pizza—and, also, get out of the kitchen. You don’t taste the pizzas coming out or look at them or launch any sort of investigation when his pizza chef assistants serially quit, muttering about his incompetence. You just count the inbound trickles of revenue and assume that’s as good as it gets. <img decoding="async" class="aligncenter size-full wp-image-7130" src="https://daedtech.com/wp-content/uploads/2016/12/pizza.jpg" alt="" width="1935" height="1259" srcset="https://daedtech.com/wp-content/uploads/2016/12/pizza.jpg 1935w, https://daedtech.com/wp-content/uploads/2016/12/pizza-300x195.jpg 300w, https://daedtech.com/wp-content/uploads/2016/12/pizza-768x500.jpg 768w, https://daedtech.com/wp-content/uploads/2016/12/pizza-1024x666.jpg 1024w" sizes="(max-width: 1935px) 100vw, 1935px" /> Read More Dec6 By Erik Dietrich Expert Beginner Store Kickstarter (And Giveaway!) Category: Announcements Tags: Expert Beginner | 19 Comments Check it out: the Expert Beginner has a kickstarter page! But before you go, if you’re interested in details and some free swag, read on. <img decoding="async" class="alignnone wp-image-7115 size-large" src="https://daedtech.com/wp-content/uploads/2016/12/Expert-Beginner-Storefront-Image-1024x566.png" width="1024" height="566" srcset="https://daedtech.com/wp-content/uploads/2016/12/Expert-Beginner-Storefront-Image-1024x566.png 1024w, https://daedtech.com/wp-content/uploads/2016/12/Expert-Beginner-Storefront-Image-300x166.png 300w, https://daedtech.com/wp-content/uploads/2016/12/Expert-Beginner-Storefront-Image-768x425.png 768w" sizes="(max-width: 1024px) 100vw, 1024px" /> The Expert Beginner is Getting a Store…Maybe People seem to enjoy the Expert Beginner—well, the satire anyway. I imagine they don’t enjoy the real life version, walking around and lecturing you about the proper use of their tortured frameworks. Instead, we’re talking about this guy: <img decoding="async" class="alignnone size-medium wp-image-3960" src="https://daedtech.com/wp-content/uploads/2014/05/ExpertBeginner-294x300.jpg" alt="" width="294" height="300" srcset="https://daedtech.com/wp-content/uploads/2014/05/ExpertBeginner-294x300.jpg 294w, https://daedtech.com/wp-content/uploads/2014/05/ExpertBeginner.jpg 661w" sizes="(max-width: 294px) 100vw, 294px" /> My wife and I (though, mainly her, and thanks to her for all of the hard work on this) have decided to see if people would be interested in adorning themselves or their offices (okay, who are we kidding, cubicles) with themed merchandise. The goal of the Kickstarter campaign is to fund the creation and seeding of an online store that will sell this merchandise. The things we’re planning to stock the store with so far are sticker, mugs, and—best of all– extremely comfortable shirts. Seriously, I actually wear mine on weekend flights, which means it’s pretty much the most comfortable thing I own. <img decoding="async" class="alignnone wp-image-7111 size-large" src="https://daedtech.com/wp-content/uploads/2016/12/Shirts-stack-fade-1024x768.png" width="1024" height="768" srcset="https://daedtech.com/wp-content/uploads/2016/12/Shirts-stack-fade-1024x768.png 1024w, https://daedtech.com/wp-content/uploads/2016/12/Shirts-stack-fade-300x225.png 300w, https://daedtech.com/wp-content/uploads/2016/12/Shirts-stack-fade-768x576.png 768w" sizes="(max-width: 1024px) 100vw, 1024px" /> <img decoding="async" class="alignnone wp-image-7108 size-large" src="https://daedtech.com/wp-content/uploads/2016/12/Shirt-Erik-Outside-Back-1024x768.png" width="1024" height="768" srcset="https://daedtech.com/wp-content/uploads/2016/12/Shirt-Erik-Outside-Back-1024x768.png 1024w, https://daedtech.com/wp-content/uploads/2016/12/Shirt-Erik-Outside-Back-300x225.png 300w, https://daedtech.com/wp-content/uploads/2016/12/Shirt-Erik-Outside-Back-768x576.png 768w" sizes="(max-width: 1024px) 100vw, 1024px" /> <img decoding="async" class="alignnone size-medium wp-image-7104" src="https://daedtech.com/wp-content/uploads/2016/12/Mugs-Prototype-2-300x285.png" alt="" width="300" height="285" srcset="https://daedtech.com/wp-content/uploads/2016/12/Mugs-Prototype-2-300x285.png 300w, https://daedtech.com/wp-content/uploads/2016/12/Mugs-Prototype-2-768x730.png 768w, https://daedtech.com/wp-content/uploads/2016/12/Mugs-Prototype-2-1024x973.png 1024w, https://daedtech.com/wp-content/uploads/2016/12/Mugs-Prototype-2.png 1110w" sizes="(max-width: 300px) 100vw, 300px" /><img decoding="async" class="alignnone wp-image-7098 " src="https://daedtech.com/wp-content/uploads/2016/12/Close-up-sticker-1024x737.png" width="393" height="283" srcset="https://daedtech.com/wp-content/uploads/2016/12/Close-up-sticker-1024x737.png 1024w, https://daedtech.com/wp-content/uploads/2016/12/Close-up-sticker-300x216.png 300w, https://daedtech.com/wp-content/uploads/2016/12/Close-up-sticker-768x552.png 768w" sizes="(max-width: 393px) 100vw, 393px" /> <img decoding="async" class="alignnone wp-image-7100 size-large" src="https://daedtech.com/wp-content/uploads/2016/12/Collage-1024x768.jpg" width="1024" height="768" srcset="https://daedtech.com/wp-content/uploads/2016/12/Collage-1024x768.jpg 1024w, https://daedtech.com/wp-content/uploads/2016/12/Collage-300x225.jpg 300w, https://daedtech.com/wp-content/uploads/2016/12/Collage-768x576.jpg 768w, https://daedtech.com/wp-content/uploads/2016/12/Collage.jpg 2048w" sizes="(max-width: 1024px) 100vw, 1024px" /> If we’re funded, we can supply this merchandise indefinitely! If not, you might be on your own for making Expert Beginner shirts. (We promise not to sue you if we fall short and you want to pick up the torch.) The campaign will end January 5th, but if you’d like to contribute, please don’t wait until then. Apparently, projects that gain a lot of interest in the beginning are more likely to be promoted and rank higher in searches on Kickstarter. We ask that you visit the page and donate now to jumpstart the campaign. If you’re one of the first to donate, you have the chance at some early bird rewards, including mugs and shirts given for lower donation amounts. Again, here’s the link to visit the Kickstarter Campaign Now There’s also a reward for a $150 donation where you can get not only all the merchandise offered but also an hour on the phone with me to talk about whatever you like. I get a lot of reader questions for the blog, and in general, about a variety of subjects. With those, you’re sort of at the mercy of my natural posting cadence and attention span. With this donation option, you have my undivided attention for an hour, which is even longer than the time I donate at startup office hours. If you can’t donate any money, you can still help! Please consider sharing this blog post with your social networks by using the usual buttons at the end of the post. And you can enter our giveaway by sharing with your network via Rafflecopter. Read More Oct14 By Erik Dietrich The Humanized Expert Beginner Category: The Life of a Programmer Tags: Expert Beginner | 6 Comments I was going to write a post about my recent fascination with Selenium tonight, but with the current bandwidth I’m getting from my hotel wifi connection, I won’t have successfully installed Firefox until Thursday. Undaunted, I decided to go through my drafts folder and move a card out of that sizeable backlog. The one that I settled on came as a response to Damien’s comment in my first Expert Beginner post. Periodically, people happen across that post and continue to comment, and I continue to find the subject relatively interesting since this theme is one that doesn’t seem to be in danger of going away. The portion of his comment about which I thought I’d muse is as follows: You’d have to be mind-numbingly ignorant to fall into Expert Beginnerism. All you have to do to illuminate your ignorance is read a blog or book by highly experienced software engineers. If you’re an Expert Beginner in software, you’re likely an Expert Beginner in every area of your life. I’ve been thinking about this a little bit here and there over the last couple of months. The question essentially boils down to one of whether Expert Beginnerism is a specific, learned approach to one set of problems or whether it’s a general approach or even a personality trait (defect?). Is it possible to be woefully mistaken about your own competence in one area of life while otherwise being a relatively normal, well-adjusted and pleasant individual in other arenas? Operating hypothesis: yes, it is. Tentative evidence: karaoke. I’m serious. <img decoding="async" src="https://daedtech.com/wp-content/uploads/2014/10/karaoke-227x300.jpg" alt="karaoke" width="300" height="400" class="aligncenter size-medium wp-image-4284" /> Make your way down to a local place that does karaoke nights and suffer through the whole evening. I can almost promise you that you’ll find a nice, social, well-adjusted person that, to everyone’s listening displeasure, thinks they’re really good at singing. Most likely, they’ve never thought of making a go at it professionally and so no one has ever told them the hard but kind truth about their abilities. People just wince inwardly and say, “oh, sure, that’s GREAT!” And so the would-be Aretha Franklin or Frank'
