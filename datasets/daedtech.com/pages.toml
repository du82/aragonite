full_description = 'Feb27 By Erik Dietrich Six-Figure Content Programs: A Lesson (and Change) in Positioning Category: Uncategorized | (Editorial note: I originally published this on Hit Subscribe’s blog.) Since its founding, Hit Subscribe has had terrible positioning. And this has been entirely my fault. Now, before this self-flagellation descends into “awkward to watch,” I will offer two important mitigating considerations: Hit Subscribe’s new business has always been at least 95% pure inbound, so bad positioning has never been an acute pain. Almost all services, practices, and “agencies” also have terrible positioning, so few people have ever noticed or cared about ours. But I have long been among those few who notice these things. And since on channels like DaedTech and YouTube I’m constantly admonishing indies about de-commodifying themselves, I have felt the dissonance as a bit of a burr in my saddle. But that didn’t motivate me to fix it, so I’ve just had to live with my own low-grade hypocrisy. Until now, that is! We’ve changed Hit Subscribe’s positioning and updated our offerings page accordingly. We build six-figure traffic programs. And even though this arose out of my intent to hire help in marketing and delegate lead qualification against our ideal customer profile (ICP), I think this is worth a reflective blog post, particularly for those among my readership that find the subject of positioning to be interesting. <img decoding="async" class="aligncenter wp-image-96028 size-full" src="https://www.hitsubscribe.com/wp-content/uploads/2024/02/SixFigures-e1708554466127.png" alt="" width="750" height="536" /> Read More Feb19 By Erik Dietrich Gameplanning the SGE Apocalypse Category: Tech Content Marketing | Lately, I’ve found myself fielding client questions related to Google’s creatively named “Search Generative Experience (SGE)”. This is hardly surprising, given that it uses generative AI, and generative AI has forced Gartner to redraw its hype cycle curve with a peak of inflated expectations that now extends about 50 miles into space. (I cringe to think what the trough of disillusionment is going to look like.) In SEO circles, this has caused an absolute frenzy of panic and predictions, given that, like voice search, mobile, and other things before it, SGE poses a potentially existential threat to traditional SEO tactics. Outside of this tight band of technocratic minutiae, the technology probably just inspires some curiosity. If you’re not familiar, this is what we’re talking about: <img decoding="async" class="aligncenter size-full wp-image-13396" src="https://daedtech.com/wp-content/uploads/2024/02/GoogleSGE.png" alt="" width="850" height="664" srcset="https://daedtech.com/wp-content/uploads/2024/02/GoogleSGE.png 850w, https://daedtech.com/wp-content/uploads/2024/02/GoogleSGE-300x234.png 300w, https://daedtech.com/wp-content/uploads/2024/02/GoogleSGE-768x600.png 768w" sizes="(max-width: 850px) 100vw, 850px" /> When you execute a Google search, the SGE experience attempts to answer your question right in the browser rather than simply serving up other results. Anyone who googles something like “chuck norris age” knows that this concept has existed for a while. But SGE expands it and… say the line, Bart… uses generative AI! There are two questions that people are asking me: Do you think SGE is going to replace traditional search results? What should we do if it does? And here are my answers, respectively: I don’t know, and neither does anyone else. This is the question that actually matters, so I’m writing this post to answer it. Read More Jan15 By Erik Dietrich How to Identify Content Refresh Candidates, In Detail Category: Tech Content Marketing | For my first blog entry on 2024’s ledger (BTW, happy new year!) I’m going to do a little double-duty. As you can see from a little slice of my Asana task list, I owe our account managers an updated SOP for identifying client refresh candidates. <img decoding="async" class="size-full wp-image-95396 aligncenter" src="https://www.hitsubscribe.com/wp-content/uploads/2024/01/RefreshTodo.png" alt="" width="545" height="438" /> However, since it’s that time of year when everyone’s “best tools of 2023” listicles start to age like milk, I figure our account managers aren’t the only people that might have use for a primer on identifying content refreshes. So this is both an SOP for them and a blog post for everyone because, well, why not? A Brief Definition of Content Refreshes and Their Value Prop Before diving in, I’d be remiss not to provide a little context. First, when I talk about refreshing content, I mean quite simply modifying any previously published piece of content on a site. The nature of those edits will generally involve updating the article with additional, more current information (hence “refresh”). As a quick example, consider this post about content managers that I wrote back in 2020. In it, I talk about being a blogger for ten years, which is no longer true. So I could “refresh” it by going in and correcting that to thirteen years…and then applying for AARP. As for why you would do this, hobbyists might do it for a purist’s love of correctness. But in the business world, the main motivation is generally to preserve or increase traffic to the content, usually from search engines. Search Engines and Content “Freshness” At this point, I’m going to ask you to set aside your preconceived notion that “Google ‘likes’ fresh content,” if you have it. Anthropomorphizing the search engine isn’t helpful for our purposes here. There’s a less magical and more grounded explanation for executing refreshes. On a long enough timeline, nothing you publish is truly evergreen. If you publish some kind of viral hot take, you’ll get views for a week, then nothing, in what the SEO industry refers to as the “spike of hope and flatline of nope.” <img decoding="async" class="aligncenter wp-image-95398 size-full" src="https://www.hitsubscribe.com/wp-content/uploads/2024/01/SpikeFlatline.png" alt="Content marketing metrics often display varying patterns, including the exhilarating &quot;Spike of Hope&quot; and the discouraging &quot;Flatline of Nope.&quot; " width="720" height="402" /> But if you target keyword ranking and search engine traffic, you’ll typically have a lifecycle where traffic to your post gradually increases for maybe a year or two and then gradually decays over several years. I describe that in a lot more detail in this post about modeling organic traffic. The decay will come, and the best you can hope for is a gentle slope when it does. Enter the refresh. A content refresh aims to slow the decay or even temporarily restore traffic growth. By routinely modifying posts to maintain the latest information on their topic, you ensure that searchers continue to find the content valuable, prompting the search engine to continue to rank the article and bring traffic to it. I should note that, for the rest of this post, I’m going to assume that whoever is executing a refresh is doing so in an SEO-best-practice way, without going into detail about what that looks like. This post is already long enough without that digression. Factors So why not just routinely and obsessively refresh all of your content, as a sort of traffic decay prophylactic? Well, setting aside the obvious issue of cost/labor, especially for high-volume content sites, let’s now consider the variables involved in deciding when to execute a refresh. To do this, I’ll do what I specialize in: ruin the art of content with math. I’ll briefly identify the factors to consider when looking for refresh candidates. From there, each section below will get “mathier” as we go, allowing you to bail out when you’ve had enough. Here are the factors that impact the decision of whether or not to refresh a post: Content age Current content accuracy Content traffic potential Cost of refreshing Potential value of refreshing Traffic trend Risk tolerance vis a vis current traffic And generally speaking, we want a process that takes relevant factors into account and first compiles a list of candidates for refresh. There will then generally be a secondary process to evaluate the candidates, prioritizing and/or culling them. For our account managers, this is generally as simple as gathering refresh candidates and having the client approve. If you control all of the content, the prioritization process will generally account for cost and prioritize based on potential gains. I realize this is all abstract, but don’t worry. The 101 treatment of this will serve as a simple, concrete example. Refresh Identification and Curation 101: A Simple Process for Our Account Managers I’m going to start with the process, and then explain the rationale. Here’s a dead simple summary of the two things we need to do: Find any obviously outdated blog posts via a title search. Find any blog posts ranking between positions 4 and 15 for their “best” keyword. Identification Step-By-Step You’re going to make this list in two passes and later eliminate any duplicates you find. First, find the obviously outdated post. You do that with an advanced Google search: site:{targetsite} intitle:2023|2022|2021|2020|2019 Here’s what this would look like against the New York Times, for instance: <img decoding="async" class="aligncenter wp-image-95399 size-full" src="https://www.hitsubscribe.com/wp-content/uploads/2024/01/NewYorkTimes-e1704563094562.png" alt="" width="800" height="565" /> This will give you a list of any pieces of content on the site with a previous year in the title—a common occurrence with listicle-type articles that will need refreshing. You’ll want to add these URLs to a spreadsheet of candidates. Next up, let’s find articles ranking between 4 and 15. To do this, you’ll log into Ahrefs and use site explorer on the target site, navigating to “top pages.” Here’s what that looks like for our property, makemeaprogrammer.com. <img decoding="async" class="aligncenter wp-image-95400 size-full" src="https://www.hitsubscribe.com/wp-content/uploads/2024/01/makemeaprogrammer-e1704563369580.png" alt="" width="950" height="505" /> Now, you’re going to click on “+keyword filters” and filter by position, entering 4–15. <img decoding="async" class="size-full wp-image-95401 aligncenter" src="https://www.hitsubscribe.com/wp-content/uploads/2024/01/Position4to15.png" alt="" width="524" height="288" /> Apply the filter, and let ‘er rip. This will result in a list of URLs that occupy a position between 4 and 15 for what Ahrefs considers to be the URL’s “best” keyword. Click export, and this list of URLs is added to our candidates list. From here, paste the Ahrefs Excel export into a Google sheet and add any URLs from the outdated title search that aren’t already in there. This is our candidate list. If You Don’t Have Ahrefs Our account managers all have this, but if you don’t, you can still implement the spirit of the activity. The easiest thing to do would be to comb this list of SERP trackers for an inexpensive one or one with a free trial and use it to find rankings for your site. But you can also accomplish this manually by taking the pages on your site that earn search traffic and simply googling their best keyword, noting where you come up. Prioritizing and Culling With a candidate list in place, we need to cull, then prioritize. For us, it’s ultimately up to the client what to refresh, but we certainly want to go to them with a curated, prioritized list and a set of recommendations. Here’s how we cull, going through the list one by one: If the article has been modified in the last six months, remove it as a candidate. If an article with a year in the date is obviously about some temporal event (e.g., “Our trip to WhateverCon, 2023”), remove it as a candidate. If the article is unrelated to the keyword (e.g., an article about semi trucks ranks for the name of a random truck driver that the article happens to mention), remove it as a candidate. With everything culled, we now prioritize, which is also dead simple in the 101 edition. Sort by “Current Top Keyword: Volume,” descending. <img decoding="async" class="wp-image-95402 size-full aligncenter" src="https://www.hitsubscribe.com/wp-content/uploads/2024/01/PrioritizedList-e1704564970401.png" alt="" width="850" height="440" /> We now have a prioritized list of refresh candidates ready to present and/or execute. The Rationale Let’s pause now and revisit the factors I mentioned above in considering why this approach makes sense. Anything with a previous year in the title is now inaccurate and thus going to plummet in traffic, if it hasn’t already. The risk of a refresh here is nil, and the potential upside is high. We want to ignore any article ranking below position 15, since there’s a very high chance that it has no traffic and isn’t capable of earning any. This way, we don’t waste time or money on a pointless refresh with no upside value. We want to ignore any article ranking above position 4 since it’s successfully ranking already. As they say, “Don’t mess with success” (the risk factor is high). We want to hold off on any article touched within the last six months because the effort may be wasted, especially with newly published articles. It takes a while for things to settle into their eventual ranking position, and if you fiddle too much, it might be pointless labor. So, at the 101 level, we have a generally low-risk, high-upside way to productively identify and execute content refreshes. In other words, you can be confident that following this process will yield good results, without worrying too much about underlying data and probabilities. Refresh Identification 201: Traffic Trends To explain the rationale for the more in-depth approaches, I need to explain a little bit about probability and game theory. Enter the math. Refreshes as Blackjack Hands Whenever you refresh a live piece of content, you’re expecting it to rank better and earn more traffic. And this is usually what will happen. But sometimes, for whatever reason, it will actually drop in rankings and traffic. So every time you touch a post, you do so knowing that it will probably help but knowing it might instead hurt. You want to do it anyway because the expected value of the activity is positive. It’s more likely to help than hurt, so you live with the handful of times it hurts while trying to minimize the impact of the “hurts.” Think of this as a blackjack game where you’re the casino. You play the game knowing that you won’t win every hand but knowing that you will win more than you lose. The idea, then, is to play lots of hands, stacking the “win more than lose” and minimizing the impact of chance. This is the real reason for the “4–15” ranking heuristic above. A losing hand of a refresh is a lot less of a bummer for an article ranking in position 12 than for one ranking in position 1, but a winning hand can rocket you up the ladder. Expanding the “Nothin'
