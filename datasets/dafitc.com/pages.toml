["https://www.dafitc.com/speakers/kevin-mulvihill"]
title = "Mr. Kevin M.Mulvihill | DAFITC Keynote Speaker"
description = "Ms. Jen Sovada, President of SandboxAQ’s Global Public Sector, joins us as a DAFITC 2023 Keynote Speaker. Read Ms. Sovada's full biography here."
full_description = "Kevin Mulvihill is a career member of the Senior Executive Service and serves as the Acting DoD Principal Deputy Chief Information Officer. In this capacity, he will assist the Acting CIO in advising the Secretary of Defense on Information Management / Information Technology (IT) and Information Assurance, as well as non-intelligence space systems; critical satellite communications, navigation, and timing programs; spectrum; and telecommunications matters. Mr Mulvihill will also lead engagement with the Defense Agencies and Field Activities CIOs and drive strategic resource planning across the IT and cybersecurity domain. Prior to this position, Mr. Mulvihill served as the Deputy Chief Information Officer for Command, Control, and Communications (DCIO(C3)). In this role, he provided strategic direction, policy guidance, and oversight to enable the Department to effectively define, prioritize, acquire, govern, manage, and implement C3 capabilities in support of DoD operations. As DCIO, Mr. Mulvihill provided policy and guidance to execute Principle Staff Assistant responsibilities for: spectrum; communications systems and networks; C2 and coalition information sharing capabilities; Position, Navigation and Timing (PNT); Tactical Network Management; Waveform Management; and Enterprise Mobility. His teams were responsible for the horizontal and vertical integration of operational level C2 and strategic command, control and communications, supporting joint and coalition concepts of operations. No federal endorsement of any Non-Federal entity is intended or implied by the selection or hosting of its video and content."
year_published = 2025
clearnet = "https://www.dafitc.com/speakers/kevin-mulvihill"
