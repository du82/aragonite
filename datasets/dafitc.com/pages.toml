["https://www.dafitc.com"]
title = "DAFITC Education & Training Event"
description = "DAFITC is the DAF's largest annual IT and cyberpower event, emphasizing the public/private partnership, offering three days of training and keynote speakers."
full_description = "DAFITC The Department of the Air Force Information Technology and Cyberpower Event (DAFITC) took place in Montgomery, AL from August 26-28, 2024. In 2024, thousands of Air Force peers, along with private sector leaders in the IT and cyber security field convened to network, discuss, connect, and learn about the newest and most prevailing threats to our global networks and national defense. DAFITC 2024 featured 185+ breakouts, an exhibit hall with over 200 vendor booths, and over 4,600 attendees, speakers, and exhibitors. Attendees heard from leading voices in the public and private sectors, hearing a range of ideas, opinions, and assessments of the current state of all things cyber as well as insights into what the keys to future success might look like. The 2024 theme, Reoptimizing IT & Cyber: Posturing the DAF for Great Power Competition, DAFITC 2024 examined the ever-changing ways in which big data and emerging cyber technologies are reshaping the landscape in which we live. Breakout Training Sessions Each year the DAFITC offers well over 150 unique breakout training sessions in several currently themed and engaging topic areas. The event encourages participation across the spectrum, welcoming a range of sessions via a Call for Presentations. This allows the event to offer a comprehensive range of sessions that fit into the five training themes, the vast majority of which are available to all attendees. The 2024 Call for Presentations will open in the Spring of 2025. EXHIBIT AT DAFITC The DAFITC is your organization’s annual opportunity to connect with decision makers and interact with users within the federal cyber security community. For exhibitors this means reaching potential clients and networking while also having the opportunity to participate in the breakout training program or partner with event organizers for greater exposure. Exhibitor sign up for DAFITC 2025 is not yet open, but contact Anne Phillips at info@dafitc.com for more information."
year_published = 2025
clearnet = "https://www.dafitc.com"
