["https://www.dafitc.com/speakers/devon-bryan"]
title = "Devon Bryan | DAFITC Keynote Speaker"
description = "Devon Bryant is the Global CISO of Carnival Corporation and keynote speaker at DAFITC 2024. Read Devon Bryant's full biography, and see him speak at DAFITC."
full_description = "Devon Bryan is an award-winning, Global Chief Information Security Officer (CISO) with almost 30 years of experience leading global teams and supporting complex business in various industries, mitigating technology risks while enabling top-line business revenue growth. Devon’s career reflects a demonstrated track record of successfully delivering large-scale ($400M+) global cybersecurity management programs that balance cost-effective pragmatic risk-based strategies with complex businesses priorities. A military veteran of the US Air Force, Devon currently serves as the Global Chief Information Security Officer (CISO) for the S&P 500 Carnival Corporation & plc where he is charged with developing and implementing the global information security strategy that’s aligned with Carnival’s key business priorities. As a strategic partner of Carnival’s global technology-dependent business operations, Devon collaborates with senior business executives across the company in the support of growing top-line revenue, driving bottom-line efficiencies all while stimulating innovation, assuring compliance, the protection of personal data and corporate assets, increasing organizational capability and advancing productivity within Carnival Corporation & plc and our nine world-leading cruise line brands. Prior to joining Carnival Corporation & plc in November 2021 as the Global Chief Information Security Officer (CISO), Devon was Managing Director, Chief Information Security Officer (CISO), for MUFG Union Bank (Americas) where he was responsible for establishing and maintaining a comprehensive information security strategy and program to ensure that information assets and technologies were appropriately protected. A five-time CISO leading large complex board reportable technology risk management programs, Devon also served as the Chief Information Security Officer (CISO) for KPMG North Americas, The US Federal Reserve System (Fed), global outsourced payroll provider ADP Inc and was the Deputy CISO for the Internal Revenue Service (IRS)."
year_published = 2025
clearnet = "https://www.dafitc.com/speakers/devon-bryan"
