["https://www.dafitc.com/dafitc-breakout-sessions"]
title = "Breakout & Training Sessions | DAFITC"
description = "The DAFITC offers a wide variety of breakout training sessions with nearly 150 unique sessions, there is something for all who attend."
full_description = "DAFITC Breakout Training Sessions In 2024 the Department of Air Force Information Technology and Cyberpower event offered over 185 breakout training sessions. The theme in 2024 was Reoptimizing IT & Cyber: Posturing the DAF for Great Power Competition. Reoptimizing IT & Cyber for the Department of the Air Force (DAF) is crucial for maintaining dominance in modern warfare, particularly in the context of Great Power Competition (GPC). By enhancing IT and cyber capabilities, the DAF will better adapt to evolving threats, secure critical infrastructure, and leverage emerging technologies to outpace adversaries. This theme highlights the importance of proactive measures to stay ahead in the competitive landscape of cyberspace and beyond. 2024 Breakout Training TracksTrack 1: Project PowerTrack 2: Develop PeopleTrack 3: Generate ReadinessTrack 4: Develop CapabilitiesTrack 1: Project Power Power projection is at the heart of our NDS. Our ability to demonstrate rapid military power projection is core to integrated deterrence and lessons our nation’s likelihood of being drawn into conflict. Track 2: Develop People Developing personnel is a deliberate priority requiring a dedicated and unified effort to attract, retain, and nurture the talent and specialized skills demanded by the emerging strategic landscape. Track 3: Generate Readiness Strategic adjustments are necessary to optimize our readiness for the present and future operating environments. Track 4: Develop Capabilities To win in conflicts, we must optimize our capability development pipeline through an enterprise-wide integrated force design."
year_published = 2025
clearnet = "https://www.dafitc.com/dafitc-breakout-sessions"
