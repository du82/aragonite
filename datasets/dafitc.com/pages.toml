language = "en"
internal-references = ["none"]
external-references = ["linkedin.com", "twitter.com"]

["https://www.dafitc.com/speakers/chandler-atwood"]
title = "Brig Gen Chandler Atwood | DAFITC Keynote Speaker"
description = "Brig Gen Chandler Atwood is the Vice Commander & Deputy Commanding General, Operations, Space Operations Command, USSF and joins us as a DAFITC Keynote Speaker."
full_description = "Brigadier General Atwood is the Vice Commander and Deputy Commanding General, Operations, Space Operations Command, U.S. Space Force, Peterson Space Force Base, Colorado. General Atwood is responsible for all operational capabilities generated, presented, and sustained in Space Operations Command, a service retained USSF force provider to all Combatant Commands. The command mission areas include intelligence, surveillance, and reconnaissance, space battle management, space domain awareness, missile warning and tracking, orbital warfare, space electronic warfare, military satellite communications, precision navigation and timing, and cyber operations. General Atwood entered the Air Force in May 2001, after graduating summa cum laude from The Citadel. A career intelligence officer, he supported fighter aircraft operations and served as an instructor at the USAF Weapons School. He served as squadron commander of National Signals Intelligence and Overhead Persistent Infrared Activities for Space Operations and was the inaugural Delta 7 commander, establishing ISR operations for USSF. General Atwood has deployed in support of Operations Southern Watch, Northern Watch, Iraqi Freedom and Enduring Freedom. MAJOR AWARDS AND DECORATIONS Defense Superior Service Medal Legion of Merit Defense Meritorious Service Medal Meritorious Service Medal with two oak leaf clusters Air Force Commendation Medal with three oak leaf clusters Air Force Achievement Medal No federal endorsement of any Non-Federal entity is intended or implied by the selection or hosting of its video and content."
