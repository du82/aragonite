["https://www.dafitc.com/speakers/leahlauderback"]
title = "Lt Gen Leah G. Lauderback | DAFITC Keynote Speaker"
description = "Lt. Gen. Leah G. Lauderback is the Deputy Chief of Staff for Intelligence, Surveillance, Reconnaissance & Cyber Effects Operations is a keynote speaker at DAFITC."
full_description = "Lt. Gen. Leah G. Lauderback is the Deputy Chief of Staff for Intelligence, Surveillance, Reconnaissance and Cyber Effects Operations, Headquarters U.S. Air Force, the Pentagon, Arlington, Virginia. She is responsible to the Secretary and Chief of Staff of the Air Force for policy formulation, planning, evaluation, oversight and leadership of the Air Force’s ISR operations, cyber effects and warfighter communications operations, and electromagnetic spectrum superiority operations. As the Air Force’s Senior Intelligence Officer, she is directly responsible to the Director of National Intelligence and the Under Secretary of Defense for Intelligence & Security. She leads seven directorates and supports a 73,000-person enterprise with a portfolio valued at $72 billion across the Air Force. Lt. Gen. Lauderback received her commission in 1993 from Clemson University. Her career as an intelligence oﬃcer spans the strategic, tactical, and operational levels of war throughout the Paciﬁc, Central, and European theaters of operation. She commanded at the wing, group, and squadron levels, served as the Senior Military Assistant to the Under Secretary of Defense for Intelligence, and led as the Director of Intelligence for the Combined Joint Task Force-Operation Inherent Resolve, Southwest Asia. Her operational tours include the Implementation Force-Bosnia Herzegovina, operations Southern Watch, Iraqi Freedom, Odyssey Dawn, and Inherent Resolve. MAJOR AWARDS AND DECORATIONS Defense Superior Service Medal with oak leaf cluster Legion of Merit with oak leaf cluster Defense Meritorious Service Medal Meritorious Service Medal with two oak leaf clusters Joint Service Commendation Medal with oak leaf cluster Air and Space Commendation Medal with three oak leaf clusters Air and Space Achievement Medal National Defense Service Medal Armed Forces Expeditionary Medal Global War on Terrorism Service Medal Korean Defense Service Medal NATO Medal No federal endorsement of any Non-Federal entity is intended or implied by the selection or hosting of its video and content."
