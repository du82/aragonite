full_description = 'Dagger Dagger is a fully static, compile-time dependency injection framework for Java, Kotlin, and Android. It is an adaptation of an earlier version created by Square and now maintained by Google. The latest Dagger release is: Dagger 2.55 Dagger aims to address many of the development and performance issues that have plagued reflection-based solutions. More details can be found in this talk (slides) by Gregory Kick. Where are the docs? User documentation Dagger API @ HEAD Where is the code? https://github.com/google/dagger Have a question? Ask it on Stack Overflow with the dagger-2 tag Send an email to dagger-discuss@googlegroups.com function chooseCodeLanguage(language) { var code_off = document.getElementsByClassName("c-codeselector__code"); for (var i = 0; i < code_off.length; i++) { code_off[i].classList.add("c-codeselector__hidden_code"); } var code_on = document.getElementsByClassName("c-codeselector__code_" + language); for (var i = 0; i < code_on.length; i++) { code_on[i].classList.remove("c-codeselector__hidden_code"); } var buttons_off = document.getElementsByClassName("c-codeselector__button"); for (var i = 0; i < buttons_off.length; i++) { buttons_off[i].classList.add("c-codeselector__unselected_button"); } var buttons_on = document.getElementsByClassName("c-codeselector__button_" + language); for (var i = 0; i < buttons_on.length; i++) { buttons_on[i].classList.remove("c-codeselector__unselected_button"); } } function getCodeSelectorButtonLanguage(button) { var classList = button.classList; for (var i = 0; i < classList.length; i++) { if (classList[i].startsWith("c-codeselector__button_")) { return classList[i].substring("c-codeselector__button_".length); } } throw new Error("Could not find code language on button"); } function setCodeSelectorButtonOnClick(button, language) { button.onclick = function() { chooseCodeLanguage(language) }; } function initCodeSelectors() { var buttons = document.getElementsByClassName("c-codeselector__button"); for (var i = 0; i < buttons.length; i++) { setCodeSelectorButtonOnClick(buttons[i], getCodeSelectorButtonLanguage(buttons[i])); } chooseCodeLanguage("java"); } initCodeSelectors();'
