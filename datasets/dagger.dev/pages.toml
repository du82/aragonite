["https://dagger.dev/dev-guide"]
title = "Dagger"
description = "Dagger is a fully static, compile-time dependency injection framework for both Java and Android."
full_description = '''Dagger Dagger Multibindings Subcomponents Producers Assisted Injection Testing SPI Compiler Options Resources Versions KSP FAQ Dagger 1 Migration gRPC dagger.android The best classes in any application are the ones that do stuff: the BarcodeDecoder, the KoopaPhysicsEngine, and the AudioStreamer. These classes have dependencies; perhaps a BarcodeCameraFinder, DefaultPhysicsEngine, and an HttpStreamer. To contrast, the worst classes in any application are the ones that take up space without doing much at all: the BarcodeDecoderFactory, the CameraServiceLoader, and the MutableContextWrapper. These classes are the clumsy duct tape that wires the interesting stuff together. Dagger is a replacement for these Factory classes that implements the dependency injection design pattern without the burden of writing the boilerplate. It allows you to focus on the interesting classes. Declare dependencies, specify how to satisfy them, and ship your app. By building on standard javax.inject annotations (JSR 330), each class is easy to test. You don’t need a bunch of boilerplate just to swap the RpcCreditCardService out for a FakeCreditCardService. Dependency injection isn’t just for testing. It also makes it easy to create reusable, interchangeable modules. You can share the same AuthenticationModule across all of your apps. And you can run DevLoggingModule during development and ProdLoggingModule in production to get the right behavior in each situation. Why Dagger 2 is Different Dependency injection frameworks have existed for years with a whole variety of APIs for configuring and injecting. So, why reinvent the wheel? Dagger 2 is the first to implement the full stack with generated code. The guiding principle is to generate code that mimics the code that a user might have hand-written to ensure that dependency injection is as simple, traceable and performant as it can be. For more background on the design, watch this talk (slides) by Gregory Kick. Using Dagger We’ll demonstrate dependency injection and Dagger by building a coffee maker. For complete sample code that you can compile and run, see Dagger’s coffee example. Declaring Dependencies Dagger constructs instances of your application classes and satisfies their dependencies. It uses the javax.inject.Inject annotation to identify which constructors and fields it is interested in. Use @Inject to annotate the constructor that Dagger should use to create instances of a class. When a new instance is requested, Dagger will obtain the required parameters values and invoke this constructor. class Thermosiphon implements Pump { private final Heater heater; @Inject Thermosiphon(Heater heater) { this.heater = heater; } ... } Dagger can inject fields directly. In this example it obtains a Heater instance for the heater field and a Pump instance for the pump field. class CoffeeMaker { @Inject Heater heater; @Inject Pump pump; ... } If your class has @Inject-annotated fields but no @Inject-annotated constructor, Dagger will inject those fields if requested, but will not create new instances. Add a no-argument constructor with the @Inject annotation to indicate that Dagger may create instances as well. Dagger also supports method injection, though constructor or field injection are typically preferred. Classes that lack @Inject annotations cannot be constructed by Dagger. Satisfying Dependencies By default, Dagger satisfies each dependency by constructing an instance of the requested type as described above. When you request a CoffeeMaker, it’ll obtain one by calling new CoffeeMaker() and setting its injectable fields. But @Inject doesn’t work everywhere: Interfaces can’t be constructed. Third-party classes can’t be annotated. Configurable objects must be configured! For these cases where @Inject is insufficient or awkward, use an @Provides-annotated method to satisfy a dependency. The method’s return type defines which dependency it satisfies. For example, provideHeater() is invoked whenever a Heater is required: @Provides static Heater provideHeater() { return new ElectricHeater(); } It’s also possible for @Provides methods to have dependencies of their own. For example, since ElectricHeater has an @Inject constructor, the above method could be written instead as: @Provides static Heater provideHeater(ElectricHeater heater) { return heater; } This way Dagger takes care of instantiating ElectricHeater, and the @Provides method is only used to alias it to the type Heater. In this particular case, we can simplify things further using an @Binds method to define the alias. Unlike @Provides, an @Binds method is abstract, and has no implementation: @Binds Heater bindHeater(ElectricHeater impl); Note: Using @Binds is the preferred way to define an alias because Dagger only needs the module at compile time, and can avoid class loading the module at runtime. Finally, all @Provides and @Binds methods must belong to a module. These are just classes that have an @Module annotation. @Module interface HeaterModule { @Binds Heater bindHeater(ElectricHeater impl); } Note that in Kotlin, @Provides methods can also be declared in the companion object of an @Module class. @Module interface HeaterModule { @Binds fun bindHeater(impl: ElectricHeater): Heater companion object { @Provides fun provideElectricHeater() = ElectricHeater() } } By convention, @Provides methods are named with a provide prefix, @Binds methods are named with bind prefix and module classes are named with a Module suffix. Building the Graph The @Inject and @Provides-annotated classes form a graph of objects, linked by their dependencies. Calling code like an application’s main method or an Android Application accesses that graph via a well-defined set of roots. In Dagger 2, that set is defined by an interface with methods that have no arguments and return the desired type. By applying the @Component annotation to such an interface and passing the module types to the modules parameter, Dagger 2 then fully generates an implementation of that contract. @Component(modules = DripCoffeeModule.class) interface CoffeeShop { CoffeeMaker maker(); } The implementation has the same name as the interface prefixed with Dagger. Obtain an instance by invoking the builder() method on that implementation and use the returned builder to set dependencies and build() a new instance. CoffeeShop coffeeShop = DaggerCoffeeShop.builder() .dripCoffeeModule(new DripCoffeeModule()) .build(); Note: If your @Component is not a top-level type, the generated component’s name will include its enclosing types’ names, joined with an underscore. For example, this code: class Foo { static class Bar { @Component interface BazComponent {} } } would generate a component named DaggerFoo_Bar_BazComponent. Any module with an accessible default constructor can be elided as the builder will construct an instance automatically if none is set. And for any module whose @Provides methods are all static, the implementation doesn’t need an instance at all. If all dependencies can be constructed without the user creating a dependency instance, then the generated implementation will also have a create() method that can be used to get a new instance without having to deal with the builder. CoffeeShop coffeeShop = DaggerCoffeeShop.create(); Now, our CoffeeApp can simply use the Dagger-generated implementation of CoffeeShop to get a fully-injected CoffeeMaker. public class CoffeeApp { public static void main(String[] args) { CoffeeShop coffeeShop = DaggerCoffeeShop.create(); coffeeShop.maker().brew(); } } Now that the graph is constructed and the entry point is injected, we run our coffee maker app. Fun. $ java -cp ... coffee.CoffeeApp ~ ~ ~ heating ~ ~ ~ => => pumping => => [_]P coffee! [_]P Bindings in the graph The example above shows how to construct a component with some of the more typical bindings, but there are a variety of mechanisms for contributing bindings to the graph. The following are available as dependencies and may be used to generate a well-formed component: Those declared by @Provides methods within a @Module referenced directly by @Component.modules or transitively via @Module.includes Any type with an @Inject constructor that is unscoped or has a @Scope annotation that matches one of the component’s scopes The component provision methods of the component dependencies The component itself Unqualified builders for any included subcomponent Provider or Lazy wrappers for any of the above bindings A Provider of a Lazy of any of the above bindings (e.g., Provider<Lazy<CoffeeMaker>>) A MembersInjector for any type Singletons and Scoped Bindings Annotate an @Provides method or injectable class with @Singleton. The graph will use a single instance of the value for all of its clients. @Provides @Singleton static Heater provideHeater() { return new ElectricHeater(); } The @Singleton annotation on an injectable class also serves as documentation. It reminds potential maintainers that this class may be shared by multiple threads. @Singleton class CoffeeMaker { ... } Since Dagger 2 associates scoped instances in the graph with instances of component implementations, the components themselves need to declare which scope they intend to represent. For example, it wouldn’t make any sense to have a @Singleton binding and a @RequestScoped binding in the same component because those scopes have different lifecycles and thus must live in components with different lifecycles. To declare that a component is associated with a given scope, simply apply the scope annotation to the component interface. @Component(modules = DripCoffeeModule.class) @Singleton interface CoffeeShop { CoffeeMaker maker(); } Components may have multiple scope annotations applied. This declares that they are all aliases to the same scope, and so that component may include scoped bindings with any of the scopes it declares. Reusable scope Sometimes you want to limit the number of times an @Inject-constructed class is instantiated or a @Provides method is called, but you don’t need to guarantee that the exact same instance is used during the lifetime of any particular component or subcomponent. This can be useful in environments such as Android, where allocations can be expensive. For these bindings, you can apply @Reusable scope. @Reusable-scoped bindings, unlike other scopes, are not associated with any single component; instead, each component that actually uses the binding will cache the returned or instantiated object. That means that if you install a module with a @Reusable binding in a component, but only a subcomponent actually uses the binding, then only that subcomponent will cache the binding’s object. If two subcomponents that do not share an ancestor each use the binding, each of them will cache its own object. If a component’s ancestor has already cached the object, the subcomponent will reuse it. There is no guarantee that the component will call the binding only once, so applying @Reusable to bindings that return mutable objects, or objects where it’s important to refer to the same instance, is dangerous. It’s safe to use @Reusable for immutable objects that you would leave unscoped if you didn’t care how many times they were allocated. @Reusable // It doesn't matter how many scoopers we use, but don't waste them. class CoffeeScooper { @Inject CoffeeScooper() {} } @Module class CashRegisterModule { @Provides @Reusable // DON'T DO THIS! You do care which register you put your cash in. // Use a specific scope instead. static CashRegister badIdeaCashRegister() { return new CashRegister(); } } @Reusable // DON'T DO THIS! You really do want a new filter each time, so this // should be unscoped. class CoffeeFilter { @Inject CoffeeFilter() {} } Lazy injections Sometimes you need an object to be instantiated lazily. For any binding T, you can create a Lazy<T> which defers instantiation until the first call to Lazy<T>’s get() method. If T is a singleton, then Lazy<T> will be the same instance for all injections within the ObjectGraph. Otherwise, each injection site will get its own Lazy<T> instance. Regardless, subsequent calls to any given instance of Lazy<T> will return the same underlying instance of T. class GrindingCoffeeMaker { @Inject Lazy<Grinder> lazyGrinder; public void brew() { while (needsGrinding()) { // Grinder created once on first call to .get() and cached. lazyGrinder.get().grind(); } } } Provider injections Sometimes you need multiple instances to be returned instead of just injecting a single value. While you have several options (Factories, Builders, etc.), one option is to inject a Provider<T> instead of just T. A Provider<T> invokes the binding logic for T each time .get() is called. If that binding logic is an @Inject constructor, a new instance will be created, but a @Provides method has no such guarantee. class BigCoffeeMaker { @Inject Provider<Filter> filterProvider; public void brew(int numberOfPots) { ... for (int p = 0; p < numberOfPots; p++) { maker.addFilter(filterProvider.get()); //new filter every time. maker.addCoffee(...); maker.percolate(); ... } } } Qualifiers Sometimes the type alone is insufficient to identify a dependency. For example, a sophisticated coffee maker app may want separate heaters for the water and the hot plate. In this case, we add a qualifier annotation. This is any annotation that itself has a @Qualifier annotation. Here’s the declaration of @Named, a qualifier annotation included in javax.inject: @Qualifier @Documented @Retention(RUNTIME) public @interface Named { String value() default ""; } You can create your own qualifier annotations, or just use @Named. Apply qualifiers by annotating the field or parameter of interest. The type and qualifier annotation will both be used to identify the dependency. class ExpensiveCoffeeMaker { @Inject @Named("water") Heater waterHeater; @Inject @Named("hot plate") Heater hotPlateHeater; ... } Supply qualified values by annotating the corresponding @Provides method. @Provides @Named("hot plate") static Heater provideHotPlateHeater() { return new ElectricHeater(70); } @Provides @Named("water") static Heater provideWaterHeater() { return new ElectricHeater(93); } Dependencies may not have multiple qualifier annotations. Optional bindings If you want a binding to work even if some dependency is not bound in the component, you can add a @BindsOptionalOf method to a module: @BindsOptionalOf abstract CoffeeCozy optionalCozy(); That means that @Inject constructors and members and @Provides methods can depend on an Optional<CoffeeCozy> object. If there is a binding for CoffeeCozy in the component, the Optional will be present; if there is no binding for CoffeeCozy, the Optional will be absent. Specifically, you can inject any of the following: Optional<CoffeeCozy> (unless there is a @Nullable binding for CoffeeCozy; see below) Optional<Provider<CoffeeCozy>> Optional<Lazy<CoffeeCozy>> Optional<Provider<Lazy<CoffeeCozy>>> (You coul'''
