model of bindings and the binding graph. dagger.multibindings This package contains the API by which Dagger allows you to bind several objects into a collection that can be injected without depending directly on each of the individual bindings. dagger.producers This package contains the public API for Dagger 2's producer functionality. dagger.producers.monitoring This package provides hooks for monitoring producers. dagger.spi This package contains the Service Provider interface (SPI) to the dagger.model APIs at annotation-processing-time. dagger.spi.model This package contains the APIs that are core to Dagger's internal model of bindings and the binding graph."
