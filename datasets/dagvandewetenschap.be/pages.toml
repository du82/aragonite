full_description = '''Abdijmuseum Ten Duinen Het Abdijmuseum Ten Duinen dompelt je onder in de geschiedenis van de Duinenabdij die tijdens de middeleeuwen het Koksijdse landschap overheerste. Vandaag vind je naast de ruïne van de abdij het museum waar unieke collectiestukken te zien zijn die archeologen ter plaatse vonden. Het wetenschappelijk team van het museum blijft graven in de abdijgeschiedenis en brengt hierdoor regelmatig nieuwe inzichten naar boven die ons meer vertellen over de belangrijke rol van de Duinheren in de streek. logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0] %)"> (%? activity.images %) (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 || Object.keys(activity.images.optimizedImageUrls).length > 0 %) <picture> (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 %) <source srcset="(%~ Object.keys(activity.images.optimizedWebPImageUrls) :key:i %)(%=activity.images.optimizedWebPImageUrls[key]%) (%=key%)w(%? i < Object.keys(activity.images.optimizedWebPImageUrls).length - 1 %),(%?%)(%~ %)" sizes="(max-width: 819px) 95vw, (min-width: 820px) and (max-width: 979px) 420px, (min-width: 980px) 406px, 440px" type="image/webp"/> (%?%) <figure> (%? Object.keys(activity.images.optimizedImageUrls).length > 0 %) <img src="(%= activity.images.optimizedImageUrls[Object.keys(activity.images.optimizedImageUrls)[Object.keys(activity.images.optimizedImageUrls).length - 1]] %)" srcset="(%~ Object.keys(activity.images.optimizedImageUrls) :key:i %)(%=activity.images.optimizedImageUrls[key]%) (%=key%)w(%? i < Object.keys(activity.images.optimizedImageUrls).length - 1 %),(%?%)(%~ %)" sizes="(max-width: 819px) 9