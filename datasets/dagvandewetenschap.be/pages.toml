["https://www.dagvandewetenschap.be/organisatoren/media-lab-erpe-mere"]
title = "MEDIA LAB Erpe-Mere - Dag van de Wetenschap"
description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = '''MEDIA LAB Erpe-Mere Deze organisatie maakt deel uit van Netwerk STEM-academies Het Media Lab vormt samen met het Fablab een zeer krachtige en rijke leeromgeving voor studenten, leerkrachten, hobbyisten en starters. Met het Media Lab willen wij inzetten op digitaleeducatie door de ontwikkeling van lesprogramma’s in mediawijsheid en door het aanbieden van workshops voor scholen en particulieren. Het multi-medialab beschikt over een aangepaste infrastructuur voorzien van krachtige computers voor audio- en video-editing, materiaal voor het maken van audio- en videoopnames, tools rond augmented en virtual reality toepassingen maar ook tools voor app development. Deze tools zijn uitermate geschikt om in te zetten op de ontwikkeling van de 21ste eeuwse vaardigheden. In die zin is het multi medialab ook een middel om deze vaardigheden en competenties te ontwikkeling. Het multimedialab en Fablab vormen samen de school van de toekomst! De basisvaardigheden die de moderne burger nodig heeft, gaan verder dan leren lezen en schrijven. Om deel te nemen aan de samenleving is in de toekomst ook digitale basiskennis en de kennis van digitale media (film, foto, maar ook programmeren) onontbeerlijk. Het Medialab is ontwikkeld om bij te dragen aan deze digitale basiskennis. Dit betekent dat het Media Lab er is voor iedereen die meer wil leren over media en techniek. Met projecten en activiteiten voor jong en oud wordt deze kennis toegepast en gedeeld. logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0] %)"> (%? activity.images %) (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 || Object.keys(activity.images.optimizedIma