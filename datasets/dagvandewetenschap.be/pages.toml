full_description = '''EducaThor - locatie: T2-campus Genk EducaThor & partners nodigen jou uit op 24/11 voor een knaleditie van Dag van de Wetenschap. Kom met je familie en vrienden naar de Genkse T2-campus en beleef de magie van STEM. Wie doet er allemaal mee? EducaThor, stad Genk, Technologiebende, EnergyVille, KULeuven, Aquafin, Soltech, LednLux, Codefever, RM Builds, C-mine, Kunst-in-Zicht, PXL STEM Academy, VOKA Limburg, POM-Limburg, FacThory, LaBiomista en KRC Genk. Samen zorgen we voor een onvergetelijke dag en besmetten we je stiekem met het STEM-virus. Wil je na 24/11 met je klas een STEM-dag beleven? Kijk naar www.educaThor.be en ontdek ons aanbod voor scholen uit basis-, secundair en hoger onderwijs. Connect your school... en maak deel uit van het STEM-ecosysteem van EducaThor. logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0] %)"> (%? activity.images %) (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 || Object.keys(activity.images.optimizedImageUrls).length > 0 %) <picture> (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 %) <source srcset="(%~ Object.keys(activity.images.optimizedWebPImageUrls) :key:i %)(%=activity.images.optimizedWebPImageUrls[key]%) (%=key%)w(%? i < Object.keys(activity.images.optimizedWebPImageUrls).length - 1 %),(%?%)(%~ %)" sizes="(max-width: 819px) 95vw, (min-width: 820px) and (max-width: 979px) 420px, (min-width: 980px) 406px, 440px" type="image/webp"/> (%?%) <figure> (%? Object.keys(activity.images.optimizedImageUrls).length > 0 %) <img src="(%= activity.images.optimizedImageUrls[Object.keys(activity.images.optimizedImageUrls)[Object.keys(activity.images.optimizedI