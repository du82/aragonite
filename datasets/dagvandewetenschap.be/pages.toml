["https://www.dagvandewetenschap.be/organisatoren/de-creatieve-stem"]
title = "De Creatieve STEM - Dag van de Wetenschap"
description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = '''De Creatieve STEM Deze organisatie maakt deel uit van Netwerk STEM-academies De Creatieve STEM heeft als educatief doel het bevorderen van de ontwikkeling van (talenten van) jongeren. De vereniging wenst een kader te creëren waarbinnen kinderen hun talenten in techniek, wetenschap en talen ontwikkelen. Met vrije inloopmomenten, cursussen, workshops, speciale vakantieprogramma’s en activiteiten voor scholen en groepen brengt de vereniging dit in de praktijk. De vereniging biedt toegang tot gereedschappen die men thuis niet heeft en tot minder bekende materialen en technieken. Doel is steeds weer het stimuleren van creativiteit, interesse, ontwikkeling en ondernemerschap, met aandacht voor gelijke kansen voor alle kinderen. logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0] %)"> (%? activity.images %) (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 || Object.keys(activity.images.optimizedImageUrls).length > 0 %) <picture> (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 %) <source srcset="(%~ Object.keys(activity.images.optimizedWebPImageUrls) :key:i %)(%=activity.images.optimizedWebPImageUrls[key]%) (%=key%)w(%? i < Object.keys(activity.images.optimizedWebPImageUrls).length - 1 %),(%?%)(%~ %)" sizes="(max-width: 819px) 95vw, (min-width: 820px) and (max-width: 979px) 420px, (min-width: 980px) 406px, 440px" type="image/webp"/> (%?%) <figure> (%? Object.keys(activity.images.optimizedImageUrls).length > 0 %) <img src="(%= activity.images.optimizedImageUrls[Object.keys(activity.images.optimizedImageUrls)[Object.keys(activity.images.optimizedImageUrls).length - 1]] %)" srcset="(%~ Object.