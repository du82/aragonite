title = "Hogeschool VIVES - Dag van de Wetenschap"
description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = '''Hogeschool VIVES Lid van deAssociatie KU Leuven Deze organisatie maakt deel uit van W²etenschapsfestival, Netwerk STEM-academies VIVES, een van de grootste hogescholen van Vlaanderen met 18.500 studenten en vijf campussen, verwelkomt iedereen om samen te ontdekken en beleven. Onze slogan “Word wie je bent” staat centraal in ons uitgebreide aanbod van opleidingen in zes studiegebieden. Tijdens deze bijzondere dag slaan VIVES en KU Leuven Kulak de handen in elkaar: met het W²etenschapsfestival - Wetenschap verbindt. In deze samenwerking vieren we de vele samenwerkingen in onderzoek en opleiding in beide instellingen. Het wordt een dag vol interactieve workshops en boeiende wetenschappelijke stands. Ben jij klaar om de toekomst te verkennen? Dit festival biedt een unieke kans om de nieuwste technologische en wetenschappelijke wonderen te ontdekken. Laat je inspireren door innovaties die onze toekomst vormgeven. En kom langs bij onze Wetenschapsbar: waar Wetenschappelijk dialoog met onderzoekers een plaats krijgt. Mis deze kans niet om een dag vol kennis en ontdekkingen te beleven! We nodigen je van harte uit op het W²etenschapsfestival op VIVES Campus Kortrijk en Kulak. Tot dan! logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0] %)"> (%? activity.images %) (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 || Object.keys(activity.images.optimizedImageUrls).length > 0 %) <picture> (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 %) <source srcset="(%~ Object.keys(activity.images.optimizedWebPImageUrls) :key:i %)(%=activity.images.optimizedWebPImageUrls[key]%) (%=key%)w(%? i < Object.keys(