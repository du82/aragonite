title = "Reglement - Dag van de Wetenschap"
description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = "Reglement Algemeen Dit reglement regelt de voorwaarden en modaliteiten voor deelname en bevat tevens belangrijke data en gegevens in verband met de Dag van de Wetenschap, een initiatief van Vlaams minister van Economie, Innovatie, Werk, Sociale Economie en Landbouw, gecoördineerd door KAM vzw, Grasmarkt 61, 1000 Brussel: de coördinator. Deelname en registratie Door de organisatie te registreren, bevestigen de deelnemers dat ze kennis genomen hebben van en akkoord gaan met dit reglement. De coördinator houdt zich het recht voor om een inschrijving te weigeren, als de deelnemer niet aan het concept beantwoordt of als de algemene voorwaarden niet nageleefd worden. Alleen in geval van bewezen overmacht kan de deelnemer nog afzien van deelname. Registratie is mogelijk tot 23 september 2024 De Dag van de Wetenschap staat open voor alle organisaties (onderzoeksinstellingen, universiteiten, hogescholen, bedrijven, musea, verenigingen, bibliotheken, ...) in Vlaanderen die wetenschap en technologische innovatie ‘zichtbaar’ willen maken voor het grote publiek. Dat doen ze door digitaal wetenschap en technologie in toegepaste vorm te tonen, in productieprocessen, bij de verwerking van gegevens, bij het verlenen van diensten, in onderzoek, … Activiteiten aanmaken Als eerste stap dient de deelnemer de organisatie te registreren en een contactpersoon toe te voegen. Dat hoeft de deelnemer maar één keer te doen en nadien kan de deelnemer met zijn/haar login de activiteit(en) toevoegen. De deelnemer kan ten allen tijden extra mede-beheerders toe te voegen door hen uit te nodigen via het account. Op die manier kunnen de medebeheerders ook activiteiten invoeren en waar nodig de puntjes op de i zetten. Idealiter staan alle (of toch de meeste) activiteiten tegen 14 oktober online op het platform, maar de deelnemer kan ook nadien nog activiteiten toevoegen of aanpassen. Deelnamekosten Deelname aan Dag van de Wetenschap is gratis. Kosten gemaakt door de deelnemer zelf, naar aanleiding van de Dag van de Wetenschap, worden gedragen door de deelnemer. Data Dag van de Wetenschap vindt plaats op zondag 24 november 2024 voor het grote publiek. Verzekering De deelnemer zorgt ervoor dat hij te allen tijde voldoende verzekerd is. Op vraag van de coördinator legt de deelnemer een bewijs van verzekering voor (attest van bijzondere verzekering of bewijs van bestaande verzekering). Commerciële activiteiten Elke extra commerciële activiteit (verkoop, veiling, verhuur ....) die niet past binnen het concept en de doelstelling van Dag van de Wetenschap kunnen alleen mits voorafgaande schriftelijke toestemming van de coördinator. Deze toelating impliceert geen aansprakelijkheid in hoofde van de coördinator. Overmacht Indien Dag van de Wetenschap door overmacht niet kan plaatsvinden, kunnen de deelnemende bedrijven geen schadevergoeding eisen van de Vlaamse overheid, coördinator en de deelnemende instellingen. Communicatie Zowel het logo als de benaming van Dag van de Wetenschap zijn beschermd. De deelnemende bedrijven kunnen enkel in het kader van hun deelname en op de voorgeschreven wijze gebruik maken van dit logo en deze benaming. Hetzelfde geldt voor alle overige ontwerpen en concepten in het kader van de organisatie. De deelnemers verbinden zich ertoe enkel de door de organisatie ter beschikking gestelde materialen te gebruiken als communicatiemiddel en geen eigen ontwerpen aan te wenden (behalve bij uitdrukkelijke toestemming). Zo kunnen we een uniforme aanpak garanderen, zowel in het belang van de deelnemers als van de Dag van de Wetenschap. Rechtbank Eventuele betwistingen rond de toepassingen en/of interpretatie van dit reglement dienen voorgelegd te worden aan de rechtbank bevoegd voor de plaats waar de zetel van de organisator zich bevindt."
year_published = 2025
clearnet = "https://www.dagvandewetenschap.be/organisatie-reglement"
category = "SitesList"
