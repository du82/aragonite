["https://www.dagvandewetenschap.be/organisatoren/odisee"]
title = "Odisee - Dag van de Wetenschap"
description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = '''Odisee Lid van deAssociatie KU Leuven Deze organisatie maakt deel uit van Wetenschapsfestival Brussel 2024, Netwerk STEM-academies, Wetenschapsfestival Gent Odisee is een hogeschool met campussen in Aalst, Brussel, Dilbeek, Gent, Schaarbeek en Sint-Niklaas. Onderwijs, onderzoek, dienstverlening en permanente vorming zijn onze kernopdrachten. De hogeschool realiseert deze in zes studiegebieden: Biotechniek, Industriële wetenschappen en technologie, Handelswetenschappen en bedrijfskunde, Sociaal-agogisch werk, Onderwijs en Gezondheidszorg. Ze doet dit voor meer dan 10.000 studenten en met ongeveer 1.100 personeelsleden (+/- 800 VTE). Het onderwijsaanbod omvat professionele bacheloropleidingen, bachelor-na-bacheloropleidingen en postgraduaatopleidingen. In een samenwerkingsverband met centra voor volwassenenonderwijs en secundaire scholen voor verpleegkunde biedt Odisee ook HBO5-opleidingen aan. De kernopdracht van Odisee bestaat uit het verzorgen van kwalitatief hoogstaand hoger professioneel onderwijs. De onderzoeksprojecten zijn praktijkgericht, wetenschappelijk onderbouwd en hebben steeds een inhoudelijke link met één of meer opleidingen van Odisee. Bovendien is het onderzoek relevant voor het werkveld en/of de samenleving. De hogeschool streeft naar een optimale betrokkenheid van docenten en studenten bij het onderzoek. In opdracht van andere organisaties en instellingen voert Odisee ook projecten uit van maatschappelijke dienstverlening, zoals (kwalitatief of kwantitatief) onderzoek, testen, experimenten, surveys, ontwikkelingen, en het creëren van testopstellingen. logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0