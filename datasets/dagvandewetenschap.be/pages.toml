["https://www.dagvandewetenschap.be/organisatoren/ugent-volkssterrenwacht-armand-pien"]
title = "UGent Volkssterrenwacht Armand Pien - Dag van de Wetenschap"
description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = '''UGent Volkssterrenwacht Armand Pien Lid van deAssociatie Universiteit Gent Deze organisatie maakt deel uit van Netwerk STEM-academies Op zoek naar een zeer goed bewaard geheim in Gent? Hoog op het dak van de Rozier zit een heuse sterrenwacht verstopt, die de tand des tijds heeft overleefd en vandaag helemaal operationeel is. Nog beter: je kan het komen bezoeken en je onderdompelen in de heerlijke wereld van de astronomie, ruimtevaart en weerkunde. Zonsondergang bekijken op 40 meter hoogte? Check! Achteloos vermelden dat je dat deed op het hoogste grasveld van Gent en omstreken? Jazeker! Blik werpen door een prachtige, unieke lenzentelescoop uit 1880 (een 23-cm Steinheil-Cooke telescoop)? Check! Grootste barometer van Europa zien? Jawel hoor, het kan allemaal bij ons. Overdag bezoeken scholen ons, op woensdagavonden(en op heel wat andere momenten) is het brede publiek welkom. We organiseren voordrachten op zaterdagnamiddag, we hebben een jeugdvereniging voor tieners (Gentsters), organiseren een zomerkamp voor kinderen en tal van andere activiteiten. Onze vereniging draait op vrijwilligers die in verschillende werkgroepen actief zijn, gaande van weerkunde tot kijkerbouw over waarnemen. Als je gebeten bent door de sterrenkundemicrobe kan je bij ons terecht. We kijken uit naar je komst! logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0] %)"> (%? activity.images %) (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 || Object.keys(activity.images.optimizedImageUrls).length > 0 %) <picture> (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 %) <source srcset="(%~ Object.keys(activity.images.op