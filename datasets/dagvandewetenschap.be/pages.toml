["https://www.dagvandewetenschap.be/organisatoren/b-magic"]
title = "B-Magic - Dag van de Wetenschap"
description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = '''B-Magic Lid van deAssociatie van Universiteit en Hogescholen Antwerpen B-Magic: De culturele impact van de toverlantaarn als visueel massamedium in België. Dit project onderzoekt de geschiedenis van de toverlantaarn als massamedium in België onderzoeken. Het project wil de vele functies herontdekken die performances met lichtbeelden vervulden in de Belgische publieke ruimte en het onderzoek toespitsen op de overdracht en onderhandeling van kennis, normen en waarden door verschillende sociale groepen. Wetenschappers en entertainers, leraars en priesters, politieke bewegingen en organisaties: ze hebben allemaal ingezet op geprojecteerde visuele narratieven om een publiek van vaak duizend mensen te informeren, te entertainen, op te voeden en te mobiliseren. Alle lagen van de maatschappij - geletterd en ongeletterd – verwierven visuele informatie over de natuur, religie, wetenschap, nieuwe technologieën en andere landen. Het consortium van B-Magic zal de cruciale rol onderzoeken die de toverlantaarn speelde in de Belgische maatschappij sinds de onafhankelijkheid van het land tot het gebruik ervan terugliep (1830-1940). Met dit doel voor ogen bestaat B-Magic uit een interdisciplinair team van onderzoekers uit de theaterwetenschap, cinema en media studies, stadsgeschiedenis, geschiedenis van wetenschap en kennis, communicatiewetenschap, semiotiek en narratologie. B-Magic zal de eerste omvattende studie produceren van de rol van de toverlantaarn als nationaal massamedium. logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0] %)"> (%? activity.images %) (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 || Object