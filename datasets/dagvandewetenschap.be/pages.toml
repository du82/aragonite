title = "STEM on the road - Dag van de Wetenschap"
description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = '''STEM on the road Lid van deAssociatie van Universiteit en Hogescholen Antwerpen Deze organisatie maakt deel uit van Netwerk STEM-academies Met STEM on the road willen we een breed publiek in Antwerpen bereiken en de STEM-academies zoveel mogelijk uitbreiden door samen te werken met sociale partners (buurtwerkingen, verenigingen…) en bedrijven. Daarnaast wordt een online aanbod gecreëerd van kant-en-klare STEM-activiteiten en workshops via een databank waarmee iedereen zelf aan de slag kan gaan. Verder bieden we een gratis opleiding tot STEM-coach aan. Ben jij monitor, jeugdwerker, bibliotheekmedewerker… en geïnteresseerd in het geven van STEM-workshops? Nadat je een opleiding van 2 x 3u gevolgd hebt, kan je zelfstandig aan de slag als STEM-coach in je vereniging of gemeente. Binnen STEM on the road bestaan verschillende STEM-academies dus er zit vast wel iets bij voor jou! logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0] %)"> (%? activity.images %) (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 || Object.keys(activity.images.optimizedImageUrls).length > 0 %) <picture> (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 %) <source srcset="(%~ Object.keys(activity.images.optimizedWebPImageUrls) :key:i %)(%=activity.images.optimizedWebPImageUrls[key]%) (%=key%)w(%? i < Object.keys(activity.images.optimizedWebPImageUrls).length - 1 %),(%?%)(%~ %)" sizes="(max-width: 819px) 95vw, (min-width: 820px) and (max-width: 979px) 420px, (min-width: 980px) 406px, 440px" type="image/webp"/> (%?%) <figure> (%? Object.keys(activity.images.optimizedImageUrls).length > 0 %) <img src="(%= activity.imag