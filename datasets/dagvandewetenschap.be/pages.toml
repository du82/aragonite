["https://www.dagvandewetenschap.be/stem-academies"]
title = "Netwerk STEM-academies - Dag van de Wetenschap"
description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = '''Netwerk STEM-academies Ben jij ook gefascineerd door VR, drones & robots? Of ben je handig en wil je een brug maken of een horloge doorgronden? Misschien zit je liever met je hoofd tussen de sterren of met je handen in de aarde? Of wil je je eigen ontwerpen in 3D printen? Super! Om te maken en te onderzoeken ben je bij het Netwerk STEM-academies op de juiste plaats. Wat zijn STEM-academies? In STEM-academies (Science’, ‘Technology’, ‘Engineering’ en ‘Mathematics’) zoek je oplossingen voor reële problemen en uitdagingen, zoals de klimaatverandering of plasticvervuiling in je lokale beek. Maar dat is niet alles! Je mag er volop de handen uit de mouwen steken en je kan je er helemaal uitleven als handige harry/hariette. Een STEM-academie geeft kansen aan jong en oud om rond STEM te creëren, te ervaren, te leren en samen te werken, van STEM-verwondering tot STEM-meesterschap. Je leert er oplossingsgericht en innovatief denken, creatief onderzoeken en ontwerpen, logisch redeneren, samenwerken en ondernemen. Voel je je enthousiasme al opborrelen? Je kan heel het jaar door activiteiten doen bij de STEM-academies. Zoek in de STEM-kalender naar STEM-academies in jouw buurt. Het netwerk STEM-academies Je vindt STEM-academies verspreid over gans Vlaanderen. Ze zijn erkend door het Agentschap Innoveren en Ondernemen (STEM@VLAIO), werken samen en delen kennis. Wil je deel uitmaken van het netwerk STEM-academies? Organiseer je STEM-activiteiten of wil je graag workshops geven? Voor meer info surf naar Stem in de Vrije Tijd Neem contact op via stem@vlaio.be Dag van de Wetenschap, 24 november 2024 Maak vandaag kennis met de STEM-academies. Klik op de logo's van de deelnemende STEM-academies om te kijken van welke activiteiten je vandaag kan proeven. Activiteiten van Netwerk STEM-academies logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full ov