full_description = '''Ekoli vzw Ekoli vzw wil de wetenschappers van morgen inspireren. Zij zullen namelijk de duurzame oplossingen van morgen ontwikkelen: biodegradeerbare bouwmaterialen, licht productie met micro-organismen, ongeneeslijke ziekten genezen, vlees kweken zonder dieren… Bij Ekoli zijn we ervan overtuigd dat iedereen wetenschapper kan zijn, ongeacht achtergrond of voorkennis. Wij vertalen wetenschappelijke thema's naar interactieve en inclusieve STEM-workshops, waar deelnemers in de rol van wetenschapper kruipen en op een hands-on manier ontdekken, creëren en experimenteren! logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0] %)"> (%? activity.images %) (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 || Object.keys(activity.images.optimizedImageUrls).length > 0 %) <picture> (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 %) <source srcset="(%~ Object.keys(activity.images.optimizedWebPImageUrls) :key:i %)(%=activity.images.optimizedWebPImageUrls[key]%) (%=key%)w(%? i < Object.keys(activity.images.optimizedWebPImageUrls).length - 1 %),(%?%)(%~ %)" sizes="(max-width: 819px) 95vw, (min-width: 820px) and (max-width: 979px) 420px, (min-width: 980px) 406px, 440px" type="image/webp"/> (%?%) <figure> (%? Object.keys(activity.images.optimizedImageUrls).length > 0 %) <img src="(%= activity.images.optimizedImageUrls[Object.keys(activity.images.optimizedImageUrls)[Object.keys(activity.images.optimizedImageUrls).length - 1]] %)" srcset="(%~ Object.keys(activity.images.optimizedImageUrls) :key:i %)(%=activity.images.optimizedImageUrls[key]%) (%=key%)w(%? i < Object.keys(activity.images.optimizedImageUrls)