["https://www.dagvandewetenschap.be"]
title = "Op zondag 24 november 2024 vindt Dag van de Wetenschap plaats - Dag van de Wetenschap"
description = "Op zondag 24 november 2024 vindt Dag van de Wetenschap plaats. Een dag boordevol fysieke en digitale activiteiten voor jong en oud. Noteer het alvast in jouw agenda!"
full_description = "#DVDW2024 Elke Dag is Wetenschap Wat een knaller! Dag van de Wetenschap ontmoette jullie voor de 14de keer op zondag 24/11/24 vanop tientallen locaties over heel Vlaanderen, Brussel én online. Uit meer dan 850 fysieke activiteiten konden jullie kiezen op bijna 100 locaties en georganiseerd door 160 lokale organisatoren.Nu kan je verder duiken in het fijne online aanbod en heel wat podcasts.Zo krijg je de kans om het allemaal te checkenEn opnieuw (en opnieuw, en opnieuw) uit te proberen. Wil je graag op de hoogte blijven op weg naar #DVDW2025? Schrijf je dan in voor de nieuwsbrief en noteer 23 november 2025 al in de agenda! Registreren of Aanmelden Om mee te doen met bepaalde online evenementen en om je ervaring zo persoonlijk mogelijk te maken, vragen we je om een account aan te maken. Je persoonlijke gegevens gebruiken we enkel hiervoor. Technologie & Techniek Natuur & Milieu Psyche & brein Gezondheid Ruimte Natuurwetenschappen Samenleving Cultuur Terugblik op #DVDW2024 Hoe het eraan toe ging op Dag van de Wetenschap 2024? Waanzinnig plezant en knallend interessant! Nagenieten van al die fun? Check het DVDW Fotoalbum, met daarin de leuke momentopnames. Nu al enkele beelden en we vullen verder aan! Geef toe, dat geeft al zin in de vólgende editie. Toch? Alle beelden ©Dag van de Wetenschap, gebruik enkel toegestaan na aanvraag en goedkeuring via info@dagvandewetenschap.be 👇👇👇 Foto album DVDW 2024 FOTO's - DVDW Wetenschapsfestival Brussel 2024 FOTO's I-Brain & Leren Breinwijzer Gent Peter Frank Deboosere DVDW Kortrijk DVDW2024 Odisee Aalst Nieuwsgierig zijn, verveelt nooit! Wetenschap is overal! Ook in mijn huidige job: we onderzoeken wat er met het menselijk lichaam in de ruimte gebeurt en hoe we astronauten zo gezond mogelijk kunnen houden. En dat is maar een tipje van de sluier van wat er allemaal nog te ontdekken valt. Ben jij ook nieuwsgierig en wil je graag onderzoeken? Welkom in de wondere wereld van de wetenschap! Angelique Van Ombergen, Chief Exploration Scientist bij de Europese Ruimtevaartorganisatie (ESA) en meter van De Dag van de Wetenschap Merci wetenschap Wat hebben een fietshelm, een geneesmiddel of oplossingen voor de klimaatverandering met elkaar gemeen? Allemaal zijn ze het resultaat van wetenschap en techniek. Van meisjes en jongens die hun STEMpel drukken op de toekomst. Onze toekomst en die van de volgende generaties. Frank Deboosere, voormalig weerman bij de VRT en peter van de Dag van de Wetenschap Wil je op de hoogte blijven? Schrijf je in voor de nieuwsbrief en mis niets over Dag van de Wetenschap! Hou me op de hoogte van het #DVDW2024 programma Vul je e-mailadres in Ik verklaar dat ik de privacy policy heb gelezen. Inschrijven Volg #DVDW2024 Volg ons op Facebook of Instagram, bekijk filmpjes op YouTube of tweet je eigen bijdrage met de hashtag #DVDW2024 Facebook Instagram LinkedIn Twitter YouTube"
year_published = 2025
clearnet = "https://www.dagvandewetenschap.be"
category = "SitesList"
