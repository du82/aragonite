full_description = '''DIENST WERK en FLANKEREND ONDERWIJSBELEID Provincie Antwerpen Techno Trailer Met het project Techno Trailer willen we volgende doelstellingen realiseren: Techniek als ontwikkelingsdoel/eindterm onder de aandacht brengen in het basisonderwijs De doelgroep prikkelen en vooroordelen rond techniek en techniekonderwijs bijsturen De drempel naar het onderwijs in nijverheid en techniek verlagen De link maken tussen opleidingen en beroepen Hoogtechnologische zaken op een ontdekkende wijze naar de basisschool brengen De doelgroep bestaat – in eerste instantie – uit leerlingen van de derde graad basisonderwijs uit scholen gelegen in de provincie Antwerpen. Techno Trailer werkt netoverschrijdend. logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0] %)"> (%? activity.images %) (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 || Object.keys(activity.images.optimizedImageUrls).length > 0 %) <picture> (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 %) <source srcset="(%~ Object.keys(activity.images.optimizedWebPImageUrls) :key:i %)(%=activity.images.optimizedWebPImageUrls[key]%) (%=key%)w(%? i < Object.keys(activity.images.optimizedWebPImageUrls).length - 1 %),(%?%)(%~ %)" sizes="(max-width: 819px) 95vw, (min-width: 820px) and (max-width: 979px) 420px, (min-width: 980px) 406px, 440px" type="image/webp"/> (%?%) <figure> (%? Object.keys(activity.images.optimizedImageUrls).length > 0 %) <img src="(%= activity.images.optimizedImageUrls[Object.keys(activity.images.optimizedImageUrls)[Object.keys(activity.images.optimizedImageUrls).length - 1]] %)" srcset="(%~ Object.keys(activity.images.optimizedImageUr