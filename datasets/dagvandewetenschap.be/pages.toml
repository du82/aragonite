full_description = 'Cookie policy Algemeen Deze cookie policy ("Cookie Policy") regelt het gebruik van cookies en soortgelijke technologieën als onderdeel van uw gebruik van onze Website (de "Website") en de bijbehorende diensten (hierna samen aangeduid als "Diensten"). Deze verwerking wordt uitgevoerd door v.z.w. Koepel van Attracties & Musea als verantwoordelijke voor de verwerking, met zetel te Grasmarkt 61, 1000 Brussel ("wij”, “ons"), geregistreerd bij de KBO onder het nummer BE0436.786.149 in overeenstemming met de toepasselijke wetgeving inzake de bescherming van persoonsgegevens.Cookies zijn kleine tekstbestanden die op de harde schijf van een toestel worden opgeslagen en bepaalde informatie bevatten, waaronder soms ook persoonsgegevens. Wanneer u onze Website en/of Diensten gebruikt, verzamelen en verwerken wij ook andere persoonlijke informatie dan via cookies en soortgelijke technologieën. Als u meer wilt weten, lees dan onze privacy policy.Door gebruik te blijven maken van onze Website en/of Diensten of door op "Aanvaarden" te klikken nadat u op de hoogte bent gesteld van het gebruik van cookies en soortgelijke technologieën, erkent u dat u deze Cookie Policy zorgvuldig heeft gelezen en dat u ermee instemt zonder voorbehoud. Zoals uiteengezet in deze Cookie Policy kunt u uw cookie-voorkeuren te allen tijde wijzigen. U kan hiervoor onderaan in de footer op "cookieinstellingen" klikken.Wij behouden ons het recht voor deze Cookie Policy van tijd tot tijd te wijzigen, aan te vullen of te vervangen. Dergelijke wijzigingen, toevoegingen of vervangingen zullen onder uw aandacht worden gebracht via onze Website en/of Diensten. Als u het niet eens bent met deze wijzigingen, toevoegingen of vervangingen, vragen wij u een e-mail te sturen naar info@dagvandewetenschap.be. Indien wij hiervan geen mededeling hebben ontvangen binnen drie (3) werkdagen nadat de wijzigingen, aanvullingen of vervangingen via onze Website of Diensten aan u zijn meegedeeld, wordt u geacht alle wijzigingen, aanvullingen of vervangingen te hebben aanvaard.Deze cookie policy werd laatst aangepast op 13 mei 2024. Welke cookies & waarom Wanneer u onze Website bezoekt en/of gebruikt, plaatsen wij cookies of gebruiken we soortgelijke technologieën waarmee we persoonsgegevens over u verzamelen en verwerken. Dergelijke cookies en soortgelijke technologieën omvatten onder meer:CRAFT_CSRF_TOKENType: Functionele cookieBeschrijving: gebruikt door het Content Management Systeem om cyberaanvallen tegen te gaan. Deze cookie is essentieel voor de beveiliging van de website en bezoeker.Bewaartermijn: Vervalt na één sessie__cookie_consentType: Functionele cookieBeschrijving: geeft aan of de cookie consent moet getoond worden of dat hij al geaccepteerd isBewaartermijn: Vervalt na één jaarCraftSessionIdType: Functionele cookieBeschrijving: gebruikt door het CMS om een unieke ID aan te maken voor de bezoeker.Bewaartermijn: Vervalt na één sessie_gaType: Analytische cookieBeschrijving: maakt unieke ID aan om statistische data over websitebezoeken bij te houden in Google Analytics.Bewaartermijn: Vervalt na 2 jaar_gatType: Analytische cookieBeschrijving: wordt gebruikt om een aanvraagratio door te sturen naar Google Analytics.Bewaartermijn: Vervalt na 1 dag_gidType: Analytische cookieBeschrijving: wordt gebruikt om statistische data over websitebezoeken bij te houden in Google AnalyticsBewaartermijn: Vervalt na elke sessiefontsType: Analytische cookieBeschrijving: Houdt het gebruik van speciale lettertypen bij die op de website worden gebruikt voor interne analyse. De cookie registreert geen bezoekersgegevens.Bewaartermijn: Vervalt nooitads/ga-audiencesType: Analytische cookieBeschrijving: Gebruikt door Google AdWords om bezoekers die zich naar klanten kunnen converteren opnieuw te betrekken op basis van het online gedrag van de bezoeker op verschillende websites.Bewaartermijn: Vervalt na één sessieU kunt voorkomen dat cookies worden geplaatst of reeds geplaatste cookies verwijderen door uw instellingen in uw browser aan te passen. Hulp bij het aanpassen van deze instellingen kunt u vinden op de website van de browser die u gebruikt. Houd er rekening mee dat het niet toestaan van cookies bij het bezoeken van de Website ertoe kan leiden dat sommige of alle functies van de Website niet naar behoren werken. - Internet Explorer: https://support.microsoft.com/... - Microsoft Edge: http://windows.microsoft.com/e... - Chrome: https://support.google.com/chr... - Firefox: https://support.mozilla.org/en... - Safari: https://support.apple.com/en-g...'
