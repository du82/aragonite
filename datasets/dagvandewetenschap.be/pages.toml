["https://www.dagvandewetenschap.be/organisatoren/brightlab-imec"]
title = "Brightlab/imec - Dag van de Wetenschap"
description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = '''Brightlab/imec Imec en Brightlab verwachten jullie voor de 14de keer op zondag 24 november 2024 bij de imec-site in Leuven op de De Dag van de Wetenschap! Wist jij al dat dit een bijzondere plek is? Dit is hét chiplabo van de wereld, waar de technologie van morgen het licht ziet. Je krijgt niet elke dag de kans om hier met je eigen ogen een kijkje achter de schermen te nemen. Maar dit is niet enkel een unieke plaats, hier werken ook buitengewone mensen. Want hieraan werken héél veel mensen mee: handige Harry's, technische Tine's, wiskundige Warre's, organiserende Olga's en vele anderen. Ontdek hoe ook jij aan chips kan werken en hoe die chips onze wereld door elkaar zullen schudden. Brightlab biedt een unieke gelegenheid voor de innovators van morgen, met inspirerende workshops en indrukwekkende demonstraties. Bezoekers kunnen de cleanroom van imec verkennen en leren van wetenschappers die je een blik geven in de fascinerende wereld van wetenschap en technologie. 📌Wat en waar? Zondag 24 november 2024 van 10u tot 17uImec, Remisebosweg 1, 3001 HeverleeVoor personen van 0 tot 99 jaar Het is niet meer mogelijk om te registeren via de website, maar er zijn nog een aantal plaatsjes om ons te bezoeken op zondag 24/11. Meld je aan bij de receptie aan imec tower, Remisebosweg 1, 3001 Leuven. logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0] %)"> (%? activity.images %) (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 || Object.keys(activity.images.optimizedImageUrls).length > 0 %) <picture> (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 %) <source srcset="(%~ Object.keys(activity.images.op