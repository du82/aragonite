description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = '''De Technologiebende, Stad Genk Deze organisatie maakt deel uit van Netwerk STEM-academies Als erkende stemacademie doen wij ook dit jaar mee met ' De dag van Wetenschap' in samenwerking met enkele andere partners. De Technologiebende heeft zowel een naschools - als vakantieaanbod gedurende het hele jaar voor kinderen en jongeren tussen 5 en 16 jaar. De meeste workshopreeksen vinden plaats op de T2-campus in Genk, maar ook Katevennen Cosmodrome en de BIB zijn vaste workshopplaatsen van ons. Bovendien zetten we sinds vorig jaar sterk in op het implementeren van de "A" in ons stemaanbod. Ook dit zal aanbod komen tijdens de activiteiten die we voorzien tijdens ' de dag van de Wetenschap'. logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0] %)"> (%? activity.images %) (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 || Object.keys(activity.images.optimizedImageUrls).length > 0 %) <picture> (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 %) <source srcset="(%~ Object.keys(activity.images.optimizedWebPImageUrls) :key:i %)(%=activity.images.optimizedWebPImageUrls[key]%) (%=key%)w(%? i < Object.keys(activity.images.optimizedWebPImageUrls).length - 1 %),(%?%)(%~ %)" sizes="(max-width: 819px) 95vw, (min-width: 820px) and (max-width: 979px) 420px, (min-width: 980px) 406px, 440px" type="image/webp"/> (%?%) <figure> (%? Object.keys(activity.images.optimizedImageUrls).length > 0 %) <img src="(%= activity.images.optimizedImageUrls[Object.keys(activity.images.optimizedImageUrls)[Object.keys(activity.images.optimizedImageUrls).length - 1]] %)" srcset="(%~ Object.keys(activity.images.optimizedImageUrl