title = "Arboretum Kalmthout - Dag van de Wetenschap"
description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = '''Arboretum Kalmthout Arboretum Kalmthout is een botanische tuin van 13.5 hectaren waar meer dan 11.000 planten groeien uit de hele wereld. De voormalige kwekerij van bijzondere coniferen, loofbomen en sierstruiken dateert uit 1856 en draagt tuinkunst hoog in het vaandel. Je kunt hier elke dag komen wandelen en struinen in de natuurlijke bomentuin waar élk seizoen iets te beleven valt: de spectaculaire collectie toverhazelaars met unieke, zoet geurende bloemen in warme kleuren in de winter. In de lente bloeien kerselaars en appelaars volop, een wolk van bloesems! In de zomer trekken vooral de vlindertuin, de kleurtuinen en de tuin van Sonia de aandacht. Japanse esdoorns brengen een prachtig kleurenspektakel in de herfst. logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0] %)"> (%? activity.images %) (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 || Object.keys(activity.images.optimizedImageUrls).length > 0 %) <picture> (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 %) <source srcset="(%~ Object.keys(activity.images.optimizedWebPImageUrls) :key:i %)(%=activity.images.optimizedWebPImageUrls[key]%) (%=key%)w(%? i < Object.keys(activity.images.optimizedWebPImageUrls).length - 1 %),(%?%)(%~ %)" sizes="(max-width: 819px) 95vw, (min-width: 820px) and (max-width: 979px) 420px, (min-width: 980px) 406px, 440px" type="image/webp"/> (%?%) <figure> (%? Object.keys(activity.images.optimizedImageUrls).length > 0 %) <img src="(%= activity.images.optimizedImageUrls[Object.keys(activity.images.optimizedImageUrls)[Object.keys(activity.images.optimizedImageUrls).length - 1]] %)" srcset="(%~ Object.key