["https://www.dagvandewetenschap.be/organisatoren/uc-leuven-limburg"]
title = "Hogeschool UCLL - Dag van de Wetenschap"
description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = '''Hogeschool UCLL Lid van deAssociatie KU Leuven Deze organisatie maakt deel uit van Dag van de Wetenschap - UCLL, Techniek- en Wetenschapsacademie Leuven, Dag van de Wetenschap - UCLL, campus Diepenbeek, Netwerk STEM-academies, KU Leuven campus Diepenbeek Hogeschool UCLL biedt 20 graduaten, 22 bacheloropleidingen en 9 bachelor-na-bachelor opleidingen aan op 8 campussen in Limburg en Vlaams-Brabant. Met 16.000 studenten en 1.750 medewerkers is UCLL één van de grootste instellingen voor hoger onderwijs in Vlaanderen. UCLL is actief in de interessegebieden lerarenopleiding, management, technologie, gezondheid en welzijn en combineert haar onderwijsopdracht met praktijkgericht onderzoek en dienstverlening. De hogeschool zet maximaal in op persoonlijke begeleiding van haar studenten. Haar brede onderwijsnetwerk garandeert een plek voor ieders talent en haar diploma’s staan sterk op de arbeidsmarkt. Mensen en ideeën in beweging brengen door ruimte te geven aan innovatief denken en samenwerken, dat is de visie van de hogeschool, dat is moving minds. De naam toont de internationale ambitie: UCLL, voluit University Colleges Leuven-Limburg, wil solide opleidingen aanbieden, georiënteerd op kwaliteit en met de blik naar buiten gericht, op de Euregio en verder. UCLL behoort tot de Associatie KU Leuven. Meer info: www.ucll.be logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0] %)"> (%? activity.images %) (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 || Object.keys(activity.images.optimizedImageUrls).length > 0 %) <picture> (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 %) <source srcset="(%~ 