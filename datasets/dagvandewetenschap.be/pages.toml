["https://www.dagvandewetenschap.be/meer-info"]
title = "Informatie voor deelnemers en organisaties - Dag van de Wetenschap"
description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = "Informatie voor deelnemers en organisaties Sta je op het punt om je organisatie te registreren voor de 14de editie van Dag van de Wetenschap? Goed zo! Vooraleer je verder gaat, vatten we nog eerst even samen wat zowel jij op Dag van de Wetenschap mag verwachten en hoe jij als organisator je activiteit(en) kan toevoegen. Fysiek en digitaal Op zondag 24 november 2024 is het weer Dag van de Wetenschap! Wat is Dag van de Wetenschap? We hoeven deze hoogdag van wetenschap & technologie waarschijnlijk niet meer voor te stellen. Elk jaar richt die de spots op straffe onderzoeken, baanbrekende innovaties en handige toepassingen die ons leven vandaag én morgen stukken beter maken. Het doel: volop informeren, fascineren en inspireren. Kortom, jouw dag!Dag van de Wetenschap is hét moment voor jouw bedrijf, laboratorium, museum, onderzoeks- of onderwijsinstelling om te tonen waar het - dag in dag uit - mee bezig is. Dat lukt via demo’s, lezingen, 360°-tours, DIY’s, experimenten, … die de monden laten openvallen van verbazing en aanzetten tot actie. Deel jij mee de passie voor het vak? Vooraleer het zover is, moeten eerst alle activiteiten nog een mooi plekje op het online platform van Dag van de Wetenschap krijgen. En hiervoor hebben we de hulp van organisatoren zoals jij nodig!Wat moet je doen om deel te nemen? Als eerste stap moet je je organisatie registreren en een contactpersoon toevoegen. Dat hoef je maar één keer te doen en vervolgens kan je inloggen met de gegevens van jouw account.Wil je dat niet allemaal op je eentje doen, voeg dan gerust beheerders toe. Zo kunnen ook collega’s activiteiten invoeren en waar nodig de puntjes op de i zetten. Hoe kan ik activiteiten toevoegen? Van zodra je geregistreerd bent, kan je activiteiten toevoegen. Het is belangrijk dat je goed aangeeft dat het om een fysieke of digitale activiteit gaat. Vervolgens vul je alle gegevens over jouw activiteit in. Ten slotte stuur je je activiteit in ter goedkeuring. De coördinator van Dag van de Wetenschap zal jouw activiteit screenen en goedkeuren. Activiteiten invoeren kan tot en met 4 oktober 2024! Wanneer staat mijn activiteit online? Idealiter staan alle (of toch de meeste) activiteiten tegen 14 oktober 2024 online op het platform, maar je kan ook nadien nog activiteiten toevoegen of aanpassen. Schrijf je gratis in voor Dag van de Wetenschap 2024! Contact Heb je nog vragen? Stel ze gerust via info@dagvandewetenschap.be. Reglement Lees zeker ook nog even het reglement door! Reglement"
year_published = 2025
