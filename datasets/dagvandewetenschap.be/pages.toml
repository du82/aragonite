["https://www.dagvandewetenschap.be/dvdw"]
title = "#DVDW - Dag van de Wetenschap"
description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = "#DVDW De Dag van de Wetenschap is een initiatief van de Vlaamse overheid en is het grootste wetenschapsevenement in Vlaanderen en Brussel. Het jaarlijkse evenement – dat inmiddels aan de 14e editie toe is – wordt gecoördineerd door Riebedebie en georganiseerd in samenwerking met de associaties van de Vlaamse universiteiten en hogescholen, wetenschappelijke instellingen en verenigingen, STEM-academies, attracties, erfgoedsites en musea, bedrijven en federaties. Wat is Dag van de Wetenschap? Dag van de Wetenschap is het grootste wetenschapsevenement van Vlaanderen en Brussel en vindt elk jaar plaats op de 4de zondag van november. Noteer dus alvast zondag 24 november 2024 in jouw agenda! Het richt de spots op wetenschappelijke onderzoeken en technologische innovaties, en rolt de rode loper uit voor een publiek vol jonge nieuwsgierigaards en oudere ontdekkers. Zij maken, op een originele en vaak creatieve manier, kennis met de straffe toepassingen en ontwikkelingen die ons leven vandaag en morgen beïnvloeden. Waarom zo’n Dag van de Wetenschap? Zonder wetenschap en technologie had deze website niet bestaan en had je er ook niet met je smartphone naartoe kunnen surfen. Je had geen bril op je neus gehad, geen toast als ontbijt gekregen, of geen pilletje tegen de hoofdpijn kunnen nemen. Kortom, wetenschap en technologie veranderen de wereld en verbeteren onze toekomst. Niet meer dan terecht dus dat we al die fascinerende onderzoeken en straffe uitvindingen het podium geven dat ze verdienen. En stiekem willen we jou natuurlijk ook heel graag aansteken met al dat innovatieve enthousiasme. Wat valt er te beleven? Op Dag van de Wetenschap mag je eens achter de schermen piepen van verschillende bedrijven, universiteiten, hogescholen, musea, doe-centra en onderzoeksinstellingen. Je stapt labo’s binnen, betreedt ‘heilige’ onderzoeksgrond, speurt de hemel af, tuurt door microscopen, bladert door verslagen, … Met tal van demo’s, tentoonstellingen en experimenten tonen de wetenschappers waarmee ze bezig zijn, en via workshops en proefjes kan ook jij ermee aan de slag. Hoe zit dat nu met dat fysieke en digitale luik? Dag van de Wetenschap was negen edities lang een fysiek gebeuren: we leefden ons uit op tientallen locaties, verspreid over heel Vlaanderen en Brussel. Maar toen kwam de corona-pandemie… Die zorgde ervoor dat onze tiende en elfde editie volledig digitaal ging. En ook dat was leuk; als deelnemer moest je niet meer van de ene naar de andere locatie crossen, maar kon je gewoon meteen beginnen experimenteren in je eigen living. Een ‘knallend’ succes en dus brengen de volgende edities weer een portie digitaal ontdekkingsplezier, als aanvulling op een groot aanbod aan fysieke activiteiten. Hoezo, voortaan is het élke dag ‘Dag van de Wetenschap’? Zo’n wetenschappelijke hoogdag mag wat ons betreft eindeloos duren. Daarom laten we deze digitale experimenteerzone ook online staan.Je blijft hier verrassend interessante video’s, workshops, lezingen, games en proefjes vinden. Zo krijg je de kans om ze allemaal te checken en daarna opnieuw - en opnieuw en opnieuw - uit te proberen. Voortaan is het dus elke dag een beetje Dag van de Wetenschap! Ben je nog op zoek naar een uitdagende hobby? Kom eens langs bij een STEM-academie! STEM staat voor 'Science’, ‘Technology’, ‘Engineering’ and ‘Mathematics'. STEM-academies geven kansen voor jong en oud om rond STEM te creëren, te ervaren, te leren en samen te werken, van STEM-verwondering tot STEM-meesterschap. Zin in onderzoeken, programmeren, maken en ontwerpen? Ga naar de pagina van de STEM-academies en naar de STEM-kalender! Met De Lijn naar Dag van de Wetenschap Wetenschap stuwt ons vooruit. Op een duurzame manier. Precies zoals het openbaar vervoer wil doen. Geen wonder dus dat De Lijn een enthousiaste partner van Dag van de Wetenschap is. Met de tram of bus raak je dan ook vlot op jouw Dag van de Wetenschap-activiteit. Of neem de trein, pak de (deel)fiets of stap ernaartoe. Je kan je route makkelijk uitstippelen met de routeplanner van De Lijn. Zo gaan we samen slim op weg. Zullen er foto’s en video’s genomen worden? Tijdens Dag van de Wetenschap zullen er foto’s en video’s worden genomen van onze bezoekers. We gebruiken deze foto’s en video’s om Dag van de Wetenschap te promoten op sociale media en in persberichten. We publiceren voornamelijk sfeerbeelden, maar als er beeldmateriaal wordt gebruikt waarin jij het hoofdonderwerp bent, zullen we steeds jouw toestemming vragen. Meer informatie over hoe Dag van de Wetenschap omgaat met jouw persoonsgegevens kan je nalezen in onze Privacy policy."
