["https://www.dagvandewetenschap.be/de_strafste_geheimen_van_de_natuur"]
title = "Festival: De strafste geheimen van de natuur - Dag van de Wetenschap"
description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = '''Festival: De strafste geheimen van de natuur Wat voor exotische beestjes leven er in onze waterlopen? Eten we in de toekomst nog bananen? En wat vertellen bomen over ons verleden? Op de Dag van de Wetenschap, slaan de Vlaamse Wetenschappelijke Instellingen (VWI’s) de handen ineen voor een gezamenlijk programma dat iedereen op een interactieve manier kennis laat maken met de meest verrassende geheimen van de natuur. In de gloednieuwe Groene Ark van Plantentuin Meise zullen de VWI’s laten zien hoe zij begaan zijn met de natuur in hun wetenschappelijk onderzoek aan de hand van verschillende activiteiten. Van jong tot oud en zowel voor flora en fauna-fans: onder het gezamenlijke thema ‘natuur’ brengen de VWI’s je heel wat bij op het grootste wetenschap evenement van Vlaanderen en Brussel! Wat kan je allemaal ontdekken en uitpluizen in Plantentuin Meise? Waar vissen de trap kunnen nemen Stuwen regelen het waterniveau in rivieren, zodat schepen veilig kunnen varen. Nabij een stuw zorgt een schutsluis voor het versassen van de schepen. Ze werken als een lift voor schepen. Omdat vissen in hun natuurlijke migratie worden gehinderd door deze stuwsluiscomplexen, worden zogenaamde vistrappen aangelegd, die vissen in staat stellen om opwaarts te migreren. Vistrappen bestaan uit kleine trapjes die vissen helpen om het hoogteverschil te overwinnen. Zo zorgen sluizen voor de schepen en vistrappen voor de vissen! Bij onze demo kom je te weten waaraan we allemaal denken bij het bouwen van een sluis. Boom of tijdmachine? De wetenschap dendrochronologie onderzoekt de jaarringen van bomen. Die ringen helpen ons ontdekken hoe oud een boom is en vertellen een verhaal over het jaar dat de boom groeide: regende het veel, of was het juist heel zonnig? En wist je dat dendrochronologen zelfs kunnen helpen uitzoeken wanneer oude houten gebouwen of schepen zijn gebouwd? Tijdens deze activiteit ga je samen met een dendrochronoloog een boom aanboren om de leeftijd te bepalen, samen schijfjes hout onderzoeken, en alles leren over deze straffe wetenschap! Speuren, proeven en ontdekken in Plantentuin Meise Kom op de Dag van de Wetenschap proeven van verschillende bananen- en koffiesoorten. Ga mee achter de schermen van de gloednieuwe Groene Ark, een enorm kassencomplex dat een veilige haven biedt voor tienduizend soorten planten van over de hele wereld. Vertrek zeker ook op speurtocht in het Plantenpaleis en win een boekenpakket van schrijfster Mathilda Masters! Praten met planten met stress Wist je dat ook planten last hebben van stress? En dat wetenschappers van ILVO bij Gent een slimme manier hebben gevonden om die stress op het veld te meten? In hun unieke, hightech veldlabo worden bietenplanten onder stroom gezet en in de gaten gehouden met drones. Zo leren de onderzoekers hoe de planten omgaan met droogte en welke zich het best aanpast aan de klimaatverandering. Het is survival of the fittest, op het bietenveld! Tijdens deze activiteit kan je een schaalmodel bewonderen van het echte veldlabo. Niet schrikken, want de planten maken lawaai! Kraak jij hun codetaal? Stiekeme natuur ontrafeld Verscholen in Plantentuin Meise hangen meerdere cameravallen van het INBO. Die filmen alle dieren die voorbijkomen, zowel overdag als 's nachts. Ben jij benieuwd naar wat er zoal leeft in de Plantentuin? Wil je de beelden van onze opnames leren analyseren? Kom dan luisteren naar Lynn, onze fauna-expert. Zij vertelt je met plezier alles over de cameravallen, de analyse van de beelden en de 'betrapte' diersoorten. Of kom langs om een aantal invasieve uitheemse diersoorten te bekijken. Wietse en Petra vertellen je alles over platwormen, klauwkikkers, rivierkreeften en heel wat andere exotische en invasieve beestjes die hier eigenlijk niet thuishoren. Praktisch Wanneer? Zondag 24 november 2024, van 10:00 tot 17:00 Waar? Nieuwelaan 38, 1860 Meise Toegang? Gratis! Iedereen is welkom. En waar Moeder Natuur nogal eens grillig kan zijn als het op het weer aankomt, blijf je in de overdekte Groene Ark warm en droog! Vragen? info@plantentuinmeise.be Activiteiten van Festival: De strafste geheimen van de natuur logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0] %)"> (%? activity.images %) (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 || Object.keys(activity.images.optimizedImageUrls).length > 0 %) <picture> (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 %) <source srcset="(%~ Object.keys(activity.images.optimizedWebPImageUrls) :key:i %)(%=activity.images.optimizedWebPImageUrls[key]%) (%=key%)w(%? i < Object.keys(activity.images.optimizedWebPImageUrls).length - 1 %),(%?%)(%~ %)" sizes="(max-width: 819px) 95vw, (min-width: 820px) and (max-width: 979px) 420px, (min-width: 980px) 406px, 440px" type="image/webp"/> (%?%) <figure> (%? Object.keys(activity.images.optimizedImageUrls).length > 0 %) <img src="(%= activity.images.optimizedImageUrls[Object.keys(activity.images.optimizedImageUrls)[Object.keys(activity.images.optimizedImageUrls).length - 1]] %)" srcset="(%~ Object.keys(activity.images.optimizedImageUrls) :key:i %)(%=activity.images.optimizedImageUrls[key]%) (%=key%)w(%? i < Object.keys(activity.images.optimizedImageUrls).length - 1 %),(%?%)(%~ %)" sizes="(max-width: 819px) 95vw, (min-width: 820px) and (max-width: 979px) 420px, (min-width: 980px) 406px, 440px" alt="" class="sr-only js-bg-src"/> (%?%) </figure> </picture> (%?%) (%?%) <div class="absolute top-0 left-0 z-10 flex pt-4 pl-4"> (%? activity.hasReservations && activity.hasReservations == 'has-reservations' %) <span class="flex items-center px-1 mr-2 text-sm text-white rounded-sm bg-live-gradient-lr