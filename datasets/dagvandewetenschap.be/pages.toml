description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = '''Jeugd Cultuur en Wetenschap Deze organisatie maakt deel uit van Netwerk STEM-academies JCW is een landelijke jeugdvereniging die activiteiten, kampen en workshops organiseert voor kinderen en jongeren tussen 5 en 30 jaar in het binnen- en buitenland. Onze kampen gaan verspreid over heel Vlaanderen door. We bieden ook workshops doorheen heel Vlaanderen aan. In onze kampen en activiteiten is er steeds een mengeling van wetenschap en cultuur aanwezig. We proberen kinderen en jongeren kennis te laten maken met een breed aanbod. We stimuleren hen om opzoek te gaan naar individuele interesses. We bieden op oudere leeftijd ook specifiekere kampen aan voor jongeren. Denk maar aan programmeerdagen, archeologiekampen, kampen rond robotica, etc. logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0] %)"> (%? activity.images %) (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 || Object.keys(activity.images.optimizedImageUrls).length > 0 %) <picture> (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 %) <source srcset="(%~ Object.keys(activity.images.optimizedWebPImageUrls) :key:i %)(%=activity.images.optimizedWebPImageUrls[key]%) (%=key%)w(%? i < Object.keys(activity.images.optimizedWebPImageUrls).length - 1 %),(%?%)(%~ %)" sizes="(max-width: 819px) 95vw, (min-width: 820px) and (max-width: 979px) 420px, (min-width: 980px) 406px, 440px" type="image/webp"/> (%?%) <figure> (%? Object.keys(activity.images.optimizedImageUrls).length > 0 %) <img src="(%= activity.images.optimizedImageUrls[Object.keys(activity.images.optimizedImageUrls)[Object.keys(activity.images.optimizedImageUrls).length - 1]] %)" srcset