description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = '''FabLab Erpe-Mere Deze organisatie maakt deel uit van Netwerk STEM-academies FabLab Erpe-Mere wil een platform en leeromgeving aanbieden aan alle jongeren, creatievelingen en inwoners van Erpe-Mere en omstreken. In dit FabLab is het mogelijk concepten of ideeën te realiseren met de aangeboden infrastructuur en expertise van de vrijwilligers. Dit kan door het volgen van workshops of via de aangeboden tutorials. Op woensdag- en vrijdagavond is het FabLab vrijblijvend open van 18.00 tot 22.00 uur. Het gebruik van herbruikbaar materiaal is volledig gratis. Enkele voorbeelden hiervan zijn: Arduino en software op onze laptops zoals Fusion 360. Materiaal dat niet herbruikbaar is, moet wel worden vergoed. Denk hierbij aan platen populier om uit te laseren of filament voor de 3D-printers. logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0] %)"> (%? activity.images %) (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 || Object.keys(activity.images.optimizedImageUrls).length > 0 %) <picture> (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 %) <source srcset="(%~ Object.keys(activity.images.optimizedWebPImageUrls) :key:i %)(%=activity.images.optimizedWebPImageUrls[key]%) (%=key%)w(%? i < Object.keys(activity.images.optimizedWebPImageUrls).length - 1 %),(%?%)(%~ %)" sizes="(max-width: 819px) 95vw, (min-width: 820px) and (max-width: 979px) 420px, (min-width: 980px) 406px, 440px" type="image/webp"/> (%?%) <figure> (%? Object.keys(activity.images.optimizedImageUrls).length > 0 %) <img src="(%= activity.images.optimizedImageUrls[Object.keys(activity.images.optimizedImageUrls)[Object.keys(activity.image