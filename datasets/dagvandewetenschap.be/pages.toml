full_description = '''BASF Antwerpen Deze organisatie maakt deel uit van Festival Antwerpen BASF Antwerpen is onderdeel van de Duitse chemiereus BASF en grootste geïntegreerde productiecentrum in België en het op een na grootste van de BASF-groep wereldwijd. Het productenpalet van BASF Antwerpen omvat basischemie en gespecialiseerde chemicaliën. De producten van BASF Antwerpen worden ingezet in bijna alle sectoren, zoals de auto-industrie, de bouwsector, productie van papier, lederwaren en sportartikelen, alsook de textiel, voeding- en farmaceutische sectoren.Bij BASF Antwerpen werken ongeveer 3.000 medewerkers. Kennis van wetenschap en technologie is van groot belang om onze installaties vlot en veilig te laten draaien. logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0] %)"> (%? activity.images %) (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 || Object.keys(activity.images.optimizedImageUrls).length > 0 %) <picture> (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 %) <source srcset="(%~ Object.keys(activity.images.optimizedWebPImageUrls) :key:i %)(%=activity.images.optimizedWebPImageUrls[key]%) (%=key%)w(%? i < Object.keys(activity.images.optimizedWebPImageUrls).length - 1 %),(%?%)(%~ %)" sizes="(max-width: 819px) 95vw, (min-width: 820px) and (max-width: 979px) 420px, (min-width: 980px) 406px, 440px" type="image/webp"/> (%?%) <figure> (%? Object.keys(activity.images.optimizedImageUrls).length > 0 %) <img src="(%= activity.images.optimizedImageUrls[Object.keys(activity.images.optimizedImageUrls)[Object.keys(activity.images.optimizedImageUrls).length - 1]] %)" srcset="(%~ Object.keys(activity.images.op