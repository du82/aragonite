["https://www.dagvandewetenschap.be/organisatoren/technopolis"]
title = "Technopolis - Dag van de Wetenschap"
description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = '''Technopolis Deze organisatie maakt deel uit van Netwerk STEM-academies Technopolis is een plek waar curieuzeneuzemosterdpotten van 4 tot 104 van alles over wetenschap en technologie kunnen ontdekken, zowel fysiek als digitaal! Kom langs op de Dag van de Wetenschap voor €10! Tickets kan je bestellen via de website.FysiekTechnopolis is géén museum, maar een doe-centrum. Via talloze interactieve opstellingen ervaar je hoe wetenschap deel uitmaakt van het dagelijkse leven. Daarnaast geef je er je ogen de kost tijdens te gekke demo’s boordevol verbluffende experimenten en een spectaculaire show waarin niets is wat het lijkt!DigitaalWie graag zelf experimenten doet, kan thuis – met spullen die je wellicht ergens in je keuken of tuinhok liggen hebt – een 80-tal verschillende proefjes uitvoeren. Wie liever niet de handen uit de mouwen steekt, kan zich in de meer dan 100 blogposts van Technopolis verdiepen. Fans van spectaculaire do-not-try-these-at-home experimenten kunnen dan weer hun ogen de kost geven op het YouTube- en TikTok-kanaal waar Technopolis wekelijks nieuwe experimenten post. logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0] %)"> (%? activity.images %) (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 || Object.keys(activity.images.optimizedImageUrls).length > 0 %) <picture> (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 %) <source srcset="(%~ Object.keys(activity.images.optimizedWebPImageUrls) :key:i %)(%=activity.images.optimizedWebPImageUrls[key]%) (%=key%)w(%? i < Object.keys(activity.images.optimizedWebPImageUrls).length - 1 %),(%?%)(%~ %)" sizes="(max-width: 819px) 95vw