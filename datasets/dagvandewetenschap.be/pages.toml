["https://dagvandewetenschap.be/privacy"]
title = "Privacy policy - Dag van de Wetenschap"
description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = '''Privacy policy Algemeen Deze privacy policy ("Privacy policy") regelt de verwerking van uw persoonsgegevens als een onderdeel van uw gebruik van onze Website ("Website") en de diensten die daarmee verband houden (gezamenlijk aangeduid als de "Diensten"). Deze verwerking wordt uitgevoerd door v.z.w. Koepel van Attracties @ Musea als verantwoordelijke voor de verwerking, met zetel te Grasmarkt 61, 1000 Brussel ingeschreven in de KBO onder nummer 0436.786.149 in overeenstemming met de toepasselijke wetgeving inzake de bescherming van persoonsgegevens.Door de checkbox aan te klikken waarin vermeld wordt: “Ik verklaar dat ik de privacy policy heb gelezen.”, verklaart u dat u inderdaad deze Privacy Policy gelezen heeft. U verklaart dat u begrijpt met welke doeleinden uw persoonsgegevens worden verwerkt.Hou er rekening mee dat we zogenaamde ‘cookies’ of gelijkaardige technologie kunnen gebruiken als deel van de Website en/of de Diensten. Cookies zijn kleine tekstbestanden die geplaatst worden op de harde schijf van een toestel, en die bepaalde informatie bevatten, waaronder soms persoonsgegevens. Voor meer informatie betreffende ons gebruik van cookies, gelieve u onze cookie policy te lezen (https://dagvandewetenschap.be/...)Deze Privacy Policy was laatst bijgewerkt op 5 juni 2024. Wat & waarom we gegevens verwerken We verwerken uw persoonsgegevens om u toe te laten deel te nemen aan de Dag van de Wetenschap editie 2024 en het gebruik van de Website van de Dag van de Wetenschap en indien gewenst aan de daaropvolgende edities.Gemaakte beelden kunnen gebruikt worden voor informatie-, communicatie- en promotiedoeleinden.Wanneer u de Website en/of Diensten gebruikt, verwerken we persoonsgegevens die op u betrekking hebben. Zulke persoonsgegevens omvatten: BEZOEKERS 1. Account Wanneer Bij het aanmaken van een account Welke VoornaamNaamGeboortedatumEmailadresVan de hoofdgebruiker houden we alle gegevens bij. De hoofdgebruiker moet steeds ouder zijn dan 13 jaar. Hoofdgebruikers mogen geen bijkomende profielen aanmaken voor kinderen onder de 13 jaar zonder de toestemming van de wettelijke vertegenwoordiger of voogd. Profielen onder de 13 jaar zullen zelf een account moeten aanmaken na toestemming van hun wettelijke vertegenwoordigers. Voor deze extra profielen houden we enkel de voornaam en de leeftijd bij. Wettelijke grondslag Toestemming Minderjarigen vragen extra aandacht op het vlak van privacybescherming. Als we toestemming nodig hebben van een jongere onder de 13, vragen we dit via de wettelijk vertegenwoordiger. Daarom kunnen jongeren onder 13 jaar geen account aanmaken zonder de toestemming van hun wettelijke vertegenwoordiger. Duurtijd De persoonsgegevens worden bijgehouden tot jij jouw profiel verwijderd. 2. Nieuwsbrief WanneerBij het inschrijven voor de nieuwsbrief WelkeE-mailadres Wettelijke grondslagToestemming DuurtijdDe bezoeker kan via elke nieuwsbrief uitschrijven of kan een mail sturen naar info@dagvandewetenschap.be om van de lijst verwijderd te worden.De persoonsgegevens worden bijgehouden tot je je uitschrijft. Gedeeld met derde partij?Deze gegevens worden gedeeld met Mailchimp als derde partij die de e-mailgegevens enkel gebruikt voor het versturen van de nieuwsbrief. 3. Reserveren Wanneer Een bezoeker zich wil reserveren voor een activiteit op de Dag van de Wetenschap. Voor bepaalde activiteiten moet er voorafgaand gereserveerd worden. Welke E-mailadres van de hoofdgebruikerVoornaam van de bezoeker (niet noodzakelijk de hoofdgebruiker) Wettelijke grondslagToestemming DuurtijdTotdat de activiteit die op de Dag van de Wetenschap plaatsvindt. De deelnemer mag de gegevens van de bezoeker niet meer gebruiken na het verstrijken van deze activiteit. Gedeeld met derde partij?Ja, met de deelnemer die de activiteit organiseert. Deze mag de gegevens enkel gebruiken om bezoekers informatie te bezorgen over de activiteit in kwestie en desbetreffende materialen te verstrekken. DEELNEMERS/ORGANISATOREN 1. Aanmaken account, organisatie en activiteiten op Dag van de Wetenschap WanneerAanmaken login, organisatie en activiteitenWelkeVoornaamNaamEmailadresWettelijke grondslagToestemmingDuurtijdDe deelnemer kan op elk moment vragen om zijn/haar profiel te verwijderen door te mailen naar info@dagvandewetenschap.beDe persoonsgegevens worden bijgehouden tot je jouw profiel verwijderd. 2. Collega toevoegen als beheerder WanneerEen deelnemer kan een ander e-mailadres uitnodigen om medebeheerder te worden van een organisatie en de onderliggende activiteiten.WelkeEmailadresDit e-mailadres wordt enkel gebruikt om een mailtje te sturen naar die persoon om als medebeheerder te kunnen optreden. Als hij/zij beheerder wil worden, vragen we eerst toestemming, alvorens we het e-mailadres en de naam van die medebeheerder opslaan.Wettelijke grondslagToestemmingDuurtijdDe persoonsgegevens worden bijgehouden tot je jouw profiel verwijderd. In principe verkrijgen wij de hierboven genoemde persoonsgegevens rechtstreeks van u. Naast de bovengenoemde doeleinden kunnen wij uw persoonlijke gegevens ook verwerken:• Voor het uitvoeren van statistische analyses om onze Website en/of Diensten te verbeteren van de Dag van de Wetenschap. 3. Interesses, voorkeuren en favorieten Wanneer Een bezoeker of organisator kan interesses en voorkeuren van onderwerpen en vormen aanduiden, alsook favoriete activiteiten. Welke Voorkeuren Wettelijke grondslag Toestemming Duurtijd De deelnemer kan op elk moment vragen om zijn/haar profiel te verwijderen door te mailen naar info@dagvandewetenschap.be De persoonsgegevens worden bijgehouden tot je jouw profiel verwijderd. 4. Foto's en video's Wanneer Tijdens het bezoek aan Dag van de Wetenschap kunnen er beelden worden genomen. Welke Beelden Wettelijke grondslag Behartiging van de gerechtvaardigde belangen van de deelnemende organisaties. Duurtijd De deelnemer kan op elk gewenst moment vragen om het gebruik van de beelden te stoppen zodat deze niet meer zullen worden gebruikt voor toekomstige publicaties. Met wie wij gegevens delen Wij verzenden uw persoonsgegevens niet op een identificeerbare manier naar derden als dit niet vereist is om de Diensten te verlenen, zonder uw uitdrukkelijke toestemming daartoe. Wij kunnen beroep doen op externe verwerkers om u de Website en/of Diensten van de Dag van de Wetenschap aan te bieden. Wij zorgen ervoor dat deze derde verwerkers uw persoonsgegevens alleen namens ons, en op schriftelijke instructie van ons, mogen verwerken. Wij garanderen dat alle externe verwerkers met de nodige zorgvuldigheid worden geselecteerd zodat wij kunnen rekenen op de veiligheid en integriteit van uw persoonsgegevens. Hoe wij gegevens verwerken Wij zullen alleen de persoonsgegevens verwerken die nodig zijn om de in deze Privacy Policy vermelde doeleinden te bereiken. Wij zullen uw persoonsgegevens op een wettelijke, eerlijke en transparante manier verwerken. Wij zullen de persoonsgegevens accuraat en up-to-date te houden.Uw persoonsgegevens worden alleen verwerkt zolang als nodig is om de in deze Privacy Policy vermelde doeleinden te bereiken of tot het moment waarop u uw toestemming voor de verwerking ervan intrekt. Wij zullen de gepaste technische- en organisatorische maatregelen nemen om uw persoonsgegevens veilig te houden tegen ongeoorloofde toegang of diefstal en tegen onopzettelijk verlies, manipulatie of vernietiging. Toegang door ons personeel of personeel van onze externe verwerkers is alleen mogelijk op een need-to-know-basis en is onderworpen aan strikte geheimhoudingsverplichtingen. Uw rechten U heeft het recht om toegang te vragen tot alle persoonsgegevens die wij over u verwerken.U heeft het recht om te vragen dat alle persoonsgegevens over u die onjuist of onnauwkeurig zijn, kosteloos worden gecorrigeerd.U heeft het recht om uw eerder gegeven toestemming voor de verwerking van uw persoonsgegevens in te trekken. U kunt uw toestemming te allen tijde intrekken door een e-mail te sturen naar info@dagvandewetenschap.be.U heeft het recht om te vragen dat persoonsgegevens met betrekking tot u worden verwijderd als deze niet langer nodig zijn in het licht van de doeleinden die in deze Privacy Policy worden uiteengezet of als u uw toestemming voor de verwerking ervan intrekt. U dient er echter rekening mee te houden dat een verzoek tot verwijdering door ons zal worden beoordeeld in het licht van wettelijke of reglementaire verplichtingen of administratieve of gerechtelijke bevelen die ons kunnen verhinderen de betreffende persoonsgegevens te verwijderen.In de plaats van verwijdering kunt u ook vragen dat wij de verwerking van uw persoonsgegevens beperken indien (a) u de juistheid van die gegevens betwist, (b) de verwerking onrechtmatig is, (c) de gegevens niet langer nodig zijn voor de genoemde doeleinden, maar u ze nodig heeft om uzelf te verdedigen in gerechtelijke procedures of d) als u uw recht van bezwaar hebt uitgeoefend, in afwachting van een beslissing.U heeft het recht om bezwaar te maken tegen de verwerking van persoonsgegevens als de verwerking steunt op een gerechtvaardigd belang of een taak van algemeen belang of openbaar gezag. Als de beoogde verwerking als direct marketing wordt aangemerkt, heeft u het recht zich kosteloos en zonder rechtvaardiging u te verzetten tegen een dergelijke verwerking.Wanneer uw persoonsgegevens worden verwerkt op basis van toestemming of op basis van een contract en de verwerking gebeurt met geautomatiseerde middelen, heeft u het recht om de door u aan ons verstrekte persoonsgegevens in een gestructureerd, algemeen gebruikt en machinaal leesbaar formaat te ontvangen en, indien technisch mogelijk, heeft u het recht deze gegevens rechtstreeks door te geven aan een andere dienstverlener. De technische haalbaarheid hiervan wordt uitsluitend beoordeeld door ons.Als u een verzoek wilt indienen om één of meer van de hierboven vermelde rechten uit te oefenen, kunt u een e-mail sturen naar info@dagvandewetenschap.be. In dit verzoek moet duidelijk worden vermeld welk recht u wenst uit te oefenen en waarom. Het moet ook gedateerd en ondertekend zijn en vergezeld zijn van een digitaal gescande kopie van uw geldige identiteitskaart waaruit uw identiteit blijkt. Wij zullen u onmiddellijk op de hoogte stellen van de ontvangst van dergelijk verzoek. Indien de aanvraag gegrond blijkt te zijn, zullen wij deze zo spoedig, als redelijkerwijs mogelijk is, en uiterlijk binnen de dertig (30) dagen na ontvangst van de aanvraag inwilligen.Als u een klacht heeft over de verwerking van uw persoonsgegevens door ons, kunt u altijd contact met ons opnemen via het e-mailadres info@dagvandewetenschap.be. Blijft u ontevreden over ons antwoord, dan staat het u vrij om een klacht in te dienen bij de Gegevensbeschermingsautoriteit. https://www.gegevensbeschermin... .'''
