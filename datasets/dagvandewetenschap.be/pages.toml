["https://www.dagvandewetenschap.be/organisatoren/volkssterrenwacht-urania-vzw"]
title = "Volkssterrenwacht Urania vzw - Dag van de Wetenschap"
description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = '''Volkssterrenwacht Urania vzw Deze organisatie maakt deel uit van Netwerk STEM-academies Wie stelt zich geen vragen over het hoe, het wat en - vooral - het waarom van de dingen? De talloze sterren die worden opgevoerd in talkshows verkondigen liever futieler zaken dan zich te buigen over onze plaats in de kosmos. Voorlopig hebben we daarover dus nog een televisieprogramma te goed. Maar eigenlijk is dat niet nodig: Vlaanderen heeft immers zes Volkssterrenwachten die je maar al te graag inwijden in de wondere wereld van de sterrenkunde. Urania is één van die zes. In de Oudheid was Urania de muze van de sterrenkunde. Vandaag inspireert Urania je tot sterrenkunde en aanverwante wetenschappen als weerkunde en ruimtevaart. Je hebt de keuze uit een heel gamma activiteiten en diensten: cursussen voor beginners en gevorderden, gegidste bezoeken aan de sterrenwacht, een uitgebreid documentatiecentrum, diverse publicaties, waarnemingsavonden, voordrachten, Urania Mobiel (de eerste mobiele sterrenwacht van Vlaanderen) en de astroshop. Urania neemt je zelfs mee op reis om bijzondere astronomische verschijnselen te gaan bekijken.Er is voor ieder wat wils: jong en oud, beginners en gevorderden, theoretici en praktijkliefhebbers, allen vinden hun gading bij Urania. logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0] %)"> (%? activity.images %) (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 || Object.keys(activity.images.optimizedImageUrls).length > 0 %) <picture> (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 %) <source srcset="(%~ Object.keys(activity.images.optimizedWebPImageUrls) :key:i %)(%=a