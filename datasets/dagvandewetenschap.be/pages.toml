["https://www.dagvandewetenschap.be/festivalantwerpen"]
title = "Festival Antwerpen - Dag van de Wetenschap"
description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = '''Festival Antwerpen Voor Dag van de Wetenschap Antwerpen bundelen een heleboel partners samen de krachten om jong en oud een onvergetelijke dag vol leuke experimenten en coole wetenschap te bezorgen. Onderzoekers verwachten je op zondag 24 november 2024 op een heel bijzondere locatie in hartje Antwerpen! Met meer dan 100 activiteiten toveren we deze locatie om tot een bruisend centrum van wetenschap, waar je kunt genieten van verrassende inzichten en de allernieuwste wetenschappelijke ideeën kunt ontdekken. Wetenschap verbindt De meest gehaaide en beresterke Antwerpse onderzoekers slaan de handen in elkaar en serveren je een overvloed aan wetenschap in de zalen van de ZOO. Waarom krijgen spechten geen hersenschudding? Hoe blijft een schip stabiel tijdens een storm op zee? Kan een drol van een goudkopleeuwaapje het regenwoud redden? En kan je binnenkort medicijnen bestellen op Bol.com? Dat kom je allemaal te weten. Je kan er ook je je knuffeldier onder de MRI-scanner leggen, een uitdagend parcours afleggen met een ouderdoms-simulatiepak aan, praten met een animatronic papegaai, en ontdekken wat artificiële intelligentie precies met fietsen te maken heeft. Praktische info ZOO Antwerpen, Astridplein 26, 2018 Antwerpen Gratis | Zalen van de ZOO (ingang Koningin Elisabethzaal)Met korting | Bezoek aan de ZOO*Iedereen is welkom van 10.00 u. tot 18.00 u.Vooraf reserveren kan niet. Voor te reserveren activiteiten boek je op de dag zelf een plaatsje aan de reservatiebalie in de Verlatzaal. *Toegang tot de ZOO zelf is betalend. Bezoekers van de Dag van de Wetenschap betalen op de Dag van de Wetenschap op 24 november een voordeeltarief van €15 (polsbandje te verkrijgen via de reservatiebalie in de Verlatzaal). Contactinformatie Bekijk hier de digitale brochure van Festival Antwerpen: Online brochure DVDW2024 by Senne Gotthold - IssuuOf vraag de papieren brochure aan: https://forms.office.com/e/YLHAHbDNvcVolg ons op social media:facebook: uantwerpen.wetenschapvooriedereeninstagram: uantwerpen.wvilinkedin: uantwerpenwetenschapvooriedereen Andere vragen? wetenschapscommunicatie@uantwerpen.be Dag van de Wetenschap Antwerpen is een organisatie van ZOO Antwerpen, Universiteit Antwerpen, Antwerp Maritime Academy, AP Hogeschool en Karel de Grote Hogeschool. Met steun van en in samenwerking met vele partners: In samenwerking met Activiteiten van Festival Antwerpen logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0] %)"> (%? activity.images %) (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 || Object.keys(activity.images.optimizedImageUrls).length > 0 %) <picture> (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 %) <source srcset="(%~ Object.keys(activity.images.optimizedWebPImageUrls) :key:i %)(%=activity.images.optimizedWebPImageUrls[key]%) (%=key%)w(%? i < Object.keys(activity.images.optimizedWebPImageUrls).length - 1 %),(%?%)(%~ %)" sizes="(max-width: 819px) 95vw, (min-width: 820px) and (max-width: 979px) 420px, (min-width: 980px) 406px, 440px" type="image/webp"/> (%?%) <figure> (%? Object.keys(activity.images.optimizedImageUrls).length > 0 %) <img src="(%= activity.images.optimizedImageUrls[Object.keys(activity.images.optimizedImageUrls)[Object.keys(activity.images.optimizedImageUrls).length - 1]] %)" srcset="(%~ Object.keys(activity.images.optimizedImageUrls) :key:i %)(%=activity.images.optimizedImageUrls[key]%) (%=key%)w(%? i < Object.keys(activity.images.optimizedImageUrls).length - 1 %),(%?%)(%~ %)" sizes="(max-width: 819px) 95vw, (min-width: 820px) and (max-width: 979px) 420px, (min-width: 980px) 406px, 440px" alt="" class="sr-only js-bg-src"/> (%?%) </fig