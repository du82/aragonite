description = "Ontdek het uitgebreide aanbod aan activiteiten van Dag van de Wetenschap. En goed nieuws: heel wat digitale Dag van de Wetenschap-activiteiten blijven immers gewoon online staan. Voortaan is het dus elke dag een beetje Dag van de Wetenschap."
full_description = '''CodeFever Deze organisatie maakt deel uit van Netwerk STEM-academies WIE VZW CodeFever is een STEM-Academie, die kinderen van 8 tot en met 15 jaar wil leren programmeren. WAAROM Het doel van CodeFever is van kinderen digitale ‘creators’ te maken in plaats van enkel ‘users’, een belangrijke nuance in deze snel digitaliserende maatschappij. Leren programmeren is dé basiscompetentie van de toekomst! Bovendien is leren programmeren zeer goed voor de algemene ontwikkeling: kinderen leren creatief en logisch te denken, te structureren, samen te werken en het stimuleert het probleemoplossend vermogen. CodeFever heeft een eigen leertraject met doorgroeilevels, op maat gemaakt van kinderen, in 3 leeftijdsgroepen, waarin de programmeerconcepten allemaal op een heel bevattelijke en leuke manier worden aangeleerd. WAAR Onze lessenreeksen gaan door in een 30-tal verschillende steden in Vlaanderen. Check ze op www.codefever.be. logo Activiteiten aan het laden ... (%~ it.activities :activity %) <div class="flex w-full px-2 mb-4 sm:w-1/2 md:w-1/3 lg:w-1/4"> <div class="relative flex flex-col w-full overflow-hidden whitespace-normal rounded-activity group hover:shadow-card"> <div class="relative bg-center bg-cover aspect-4/3 js-bg-target bg-light" style="background-color: (%= activity.images.colorPalette[0] %)"> (%? activity.images %) (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 || Object.keys(activity.images.optimizedImageUrls).length > 0 %) <picture> (%? Object.keys(activity.images.optimizedWebPImageUrls).length > 0 %) <source srcset="(%~ Object.keys(activity.images.optimizedWebPImageUrls) :key:i %)(%=activity.images.optimizedWebPImageUrls[key]%) (%=key%)w(%? i < Object.keys(activity.images.optimizedWebPImageUrls).length - 1 %),(%?%)(%~ %)" sizes="(max-width: 819px) 95vw, (min-width: 820px) and (max-width: 979px) 420px, (min-width: 980px) 406px, 440px" type="image/webp"/> (%?%) <figure> (%? Object.keys(activity.images.optimizedImageUrls)