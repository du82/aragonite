["https://www.dailambda.jp//tags/blockchain"]
title = "Blockchain - DaiLambda, Inc."
full_description = "Tezos operations: how to build, simulate and inject 2023-04-30に投稿 This article explains the details how Tezos wallets originate (= deploy) smart contracts, without using any wallet, with a working OCaml code! To read the code you have to be familar with OCaml. The whole code is available at https://gitlab.com/dailambda/tezos-origination-demo. RPC via JSON JSON We can access Tezos nodes via RPC and they talk in JSON over HTTP. Don’t confuse it with JSON-RPC. Here is a small module Json to handle JSON data. It is based on Data_encoding. Tezos protocol provides lots of t Data_encoding.t to encode its data to+from JSON and binary and we use them in this example. [続きを読む] blockchain tezos Nagoya Web3 Hackathon で Tezos のチュートリアルを行いました 2022-11-21に投稿 I had “Block chain and how to build Tezos DApps” tutorial at Nagoya Web3 Hackathon organized by Nagoya Web3 Society, using SmartPy and Taquito. It was very challenging for me to cover from the very basics of blockchain to how to use these Tezos tools in a limited time (about 100mins), but the participated teams had smalll but nice ideas to implement in the later session. 先日、名古屋大学Web3研究会主催の Hackathon で Tezos で DApps を書くためのチュートリアルを行いました。 [続きを読む] blockchain tezos dapps talk Tezosの内部挙動を理解する - ブロック検証編 2021-09-29に投稿 概要 Tezosも含めたBitcoinやEthereumなどのブロックチェーンにおいては、口座間の送金やスマートコントラクト呼び出しなどの現在のブロックチェーンの状態に対する差分操作がブロックとして表現されます。 [続きを読む] blockchain tezos code reading Tezosはここから始まった。Position paper, white paper和訳 2021-05-12に投稿 3年前、Tezos プロジェクトに参加する際に、 Tezos ICO にあたって書かれた position paper, white paper の和訳を作りました。これを掲載していたサイトが無くなりましたので、ここに掲載しておきます。 [続きを読む] blockchain tezos"
