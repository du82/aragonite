title = "DaiLambda, Inc. - DaiLambda, Inc."
full_description = "新オフィスへの移転のお知らせ 2021-11-01に投稿 この度、弊社ダイラムダ株式会社は登記所在地を移転いたしました。 新登記所在地 京都府京都市東山区三条通北裏白川筋西入石泉院町４０５番地２ 京都の正式な住所は長くなりがちです。次のものもお使いいただけます。 [続きを読む] 設立一周年を迎えて 2019-09-14に投稿 この度、弊社が設立一周年を迎えました。 昨年の五月に起業を決断し、七月、夏の日差しに大文字山の緑が映えているのを見て会社の名前とロゴを決めたのを記憶しています。海外の非営利財団からのオープンソースソフトウェア研究開発委託を本業とする、という特殊な事業内容のため、いろいろな調査や発注元との調整などであっとういう間に時間が流れ、登記を行なったのが九月でした。そこからの立ち上がりに一番苦労しましたが、幸い良い縁にいくつも恵まれまして、秋口からは全力で楽しく仕事を始めることができ、今に至っています。お力添えいただいた皆様のおかげです。厚く御礼申し上げます。 [続きを読む] 京都大学内オフィスに登記を移転しました 2019-06-01に投稿 この度、弊社の登記所在地を京都大学のベンチャーインキュベーションセンターKUViC内オフィスに移転しました: 新登記所在地 京都府京都市左京区吉田本町36番地1京都大学国際科学イノベーション棟ベンチャーインキュベーションセンター内 オフィス住所は今まで通り、次の短めの物もお使いいただけます: [続きを読む] Tezosのコア開発に正式に参加しました 2018-12-01に投稿 本日、弊社ダイラムダ株式会社は Tezos SouthEast Asia との間に Tezos コア技術研究開発およびアジアにおける Tezos 技術普及活動に関する受託契約を結びました。 [続きを読む]"
