title = "Talk - DaiLambda, Inc."
full_description = "Nagoya Web3 Hackathon で Tezos のチュートリアルを行いました 2022-11-21に投稿 I had “Block chain and how to build Tezos DApps” tutorial at Nagoya Web3 Hackathon organized by Nagoya Web3 Society, using SmartPy and Taquito. It was very challenging for me to cover from the very basics of blockchain to how to use these Tezos tools in a limited time (about 100mins), but the participated teams had smalll but nice ideas to implement in the later session. 先日、名古屋大学Web3研究会主催の Hackathon で Tezos で DApps を書くためのチュートリアルを行いました。 [続きを読む] blockchain tezos dapps talk Tezos Hands-on Kit 2019-09-03に投稿 In the last week of August 2019, I have done 2 summer class courses about “Blockchain and Formal verification” in Tokyo and Taipei. The course consisted of 4 hours of lecture and 2 hours of “Tezos hands-on”. Blockchain is a live technology, and I believe we should provide some real experience – hands-on – if we teach something about it. I have done 4 Tezos hands-on including the above 2 already in this year and each time provided a hands-on kit, so that the attendants can play with Tezos as easy as possible. And there is no point to keep it secret. Here it is: [続きを読む] blockchain tezos talk 東京と台北のサマースクールで授業をしました 2019-08-31に投稿 8月の最後の週、東京と台北でサマースクールの授業を二本持たせていただきました: PPLサマースクール2019 「ブロックチェーンと形式検証」 8/26、 於 芝浦工業大学芝浦キャンパス FLOLAC'19 「邏輯、語言與計算」暑期研習營 8/29、於 台湾大学 PPLのサマースクールは一日だけ、単一のテーマのものです。 FLOLACは10日連続のサマースクールの講義最終日に一日いただきました。 どちらも全長6時間、4時間私が喋った後は2時間 Tezos を使った簡単な実習を行いました。 内容もどちらも同じ。言語が日本語と英語くらいの違いしかありません。 [続きを読む] blockchain tezos talk"
