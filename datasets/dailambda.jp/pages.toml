title = "弊社代表取締役の Tezos Japan 理事就任のお知らせ - DaiLambda, Inc."
description = "本日、弊社代表取締役 古瀬 淳 は Tezos Japan 一般社団法人の科学担当理事に就任いたしました。"
full_description = "本日、弊社代表取締役 古瀬 淳 は Tezos Japan 一般社団法人の科学担当理事に就任いたしました。 Tezos Japan は日本における Tezos ブロックチェーン技術の普及を使命とした NPO です。 弊社は暗号通貨 Tezos (ティッカー XTZ)のコア技術開発に世界中の Tezos エンジニア、リサーチャー達とともに取り組んでまいりましたが、新技術の普及には技術本体の開発にとどまらず、世界各地域での啓蒙活動が重要です。そのため、日本国内での Tezos 技術の普及のお手伝いとして、弊社代表取締役が Tezos Japan への理事として参加することになりました。 Tezos Japan での古瀬の役割は、Tezos コア技術開発エンジニアとして得た知見を科学技術関連の助言として Tezos Japan 自体、そして Tezos Japan が関わる日本の方々に提供することです。これからは開発と啓蒙の両輪をバランスよく回していくことが責務となります。どうかよろしくお願いいたします。"
