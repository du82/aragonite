["https://www.dailambda.jp/news/2019-09-14-one-year"]
title = "設立一周年を迎えて - DaiLambda, Inc."
description = """
この度、弊社が設立一周年を迎えました。
昨年の五月に起業を決断し、七月、夏の日差しに大文字山の緑が映えているのを見て会社の名前とロゴを決めたのを記憶しています。海外の非営利財団からのオープンソースソフトウェア研究開発委託を本業とする、という特殊な事業内容のため、いろいろな調査や発注元との調整などであっとういう間に時間が流れ、登記を行なったのが九月でした。そこからの立ち上がりに一番苦労しましたが、幸い良い縁にいくつも恵まれまして、秋口からは全力で楽しく仕事を始めることができ、今に至っています。お力添えいただいた皆様のおかげです。厚く御礼申し上げます。"""
full_description = "この度、弊社が設立一周年を迎えました。 昨年の五月に起業を決断し、七月、夏の日差しに大文字山の緑が映えているのを見て会社の名前とロゴを決めたのを記憶しています。海外の非営利財団からのオープンソースソフトウェア研究開発委託を本業とする、という特殊な事業内容のため、いろいろな調査や発注元との調整などであっとういう間に時間が流れ、登記を行なったのが九月でした。そこからの立ち上がりに一番苦労しましたが、幸い良い縁にいくつも恵まれまして、秋口からは全力で楽しく仕事を始めることができ、今に至っています。お力添えいただいた皆様のおかげです。厚く御礼申し上げます。 大文字山からの京都市中の眺め ブロックチェーンは、今現在は投機対象として見られがちですが、本来は暗号技術を使ったオープンネットワーク上の分散データーベースであり、中央管理者を必要としない公共システムを実現できる、国家と無国家の対立を超えた情報インフラの基礎技術です。その公的な側面上、安全性は非常に重要です。安全性を特に重視するTezosブロックチェーンのコア技術開発に参加したことは弊社の大きな強みになると確信しています。 一期目では技術習得ができれば弊社にとっては上々だと考えておりましたが、2019年に入ってからは新しいツールやサブシステムの開発を独立して行い、意味のある貢献を行うことができました。また計11回の講演、授業、実習を通してブロックチェーンがプログラミング言語理論と密接な関係のある科学技術であることを広く伝えることもできました。大変な一年でしたが、Arthur Breitman氏、Tezos Foundation、Tezos Japan、Tezos Southeast Asia、Nomadic Labs、Nine Chapters などのTezos関連団体、企業、個人からの強力なサポートを得られたことは弊社にとって大きな助けとなりました。 弊社内においては、京都大学の末永幸平先生、東京大学の木戸冬子先生に弊社顧問として参加いただき貴重なご助言を頂くことができました。また、期末には株式会社proof ninjaの今井宜洋社長が開発に参加されることとなり、日本でのTezosコア開発は個人からチームへと成長しつつあります。弊社の二期目の目標は、この流れを止めずに弊社をアジアにおけるTezos開発のハブとすることです。一期目とは違ったチャンレンジとなりますが、今まで通り全力で楽しくやっていこうと思います。よろしくお願いいたします。 令和元年九月十四日 ダイラムダ株式会社 代表取締役 古瀬 淳"
year_published = 2025
clearnet = "https://www.dailambda.jp/news/2019-09-14-one-year"
