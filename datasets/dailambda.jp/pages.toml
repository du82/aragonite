["https://www.dailambda.jp/blog"]
title = "Blogs - DaiLambda, Inc."
full_description = "Tezos operations: how to build, simulate and inject 2023-04-30に投稿 This article explains the details how Tezos wallets originate (= deploy) smart contracts, without using any wallet, with a working OCaml code! To read the code you have to be familar with OCaml. The whole code is available at https://gitlab.com/dailambda/tezos-origination-demo. RPC via JSON JSON We can access Tezos nodes via RPC and they talk in JSON over HTTP. Don’t confuse it with JSON-RPC. Here is a small module Json to handle JSON data. It is based on Data_encoding. Tezos protocol provides lots of t Data_encoding.t to encode its data to+from JSON and binary and we use them in this example. [続きを読む] blockchain tezos Nagoya Web3 Hackathon で Tezos のチュートリアルを行いました 2022-11-21に投稿 I had “Block chain and how to build Tezos DApps” tutorial at Nagoya Web3 Hackathon organized by Nagoya Web3 Society, using SmartPy and Taquito. It was very challenging for me to cover from the very basics of blockchain to how to use these Tezos tools in a limited time (about 100mins), but the participated teams had smalll but nice ideas to implement in the later session. 先日、名古屋大学Web3研究会主催の Hackathon で Tezos で DApps を書くためのチュートリアルを行いました。 [続きを読む] blockchain tezos dapps talk Tezos+Plebeia context subsystem benchmark 2022-06-10に投稿 Introduction As Tezos core developers, we DaiLambda and Tarides are working together to improve the perfomance of Tezos context: the version controlled store of Tezos block chain states. DaiLambda has Plebeia, an append-only style data storage system based on Merkle Patricia binary tree. It is similar to Irmin by Tarides used for the Tezos context but incompatible. DaiLambda and Tarides have worked together to improve the performance of Tezos context subsystem, sometimes using what we have learned from Plebeia. For example, we provided the context tree for faster file access from the middle of the directory tree. Our context flattening done at Hangzhou upgrade speeded up the node by 30%. Recently, we have worked together to provide efficient Merkle proof encoding of Tezos context, using the idea of extender nodes of Plebeia, which will be used for the layer 2 solutions introduced in Tezos Jakarta upgrade. [続きを読む] plebeia tezos context optimization"
