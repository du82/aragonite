["https://www.dailambda.jp/projects"]
title = "Projects - DaiLambda, Inc."
description = """
Stonerope
Stonerope is a prototype for fast, large-scale account balance storage.
It can handle over 10 million accounts with 256-bits keys in 64GB of memory
and allows for rapid account insertion (10ms/insertion) and transaction
processing (2ms/transaction).
Tezos
Tezos is a PoS blockchain with protocol amendment.  Since its foundation, DaiLambda participated Tezos core development for 6 years.
Optz: Michelson optimizer
Optz is an optimizer of Michelson programs, the base language for Tezos smart contract. It takes a Michelson code as input and then returns a smaller and more efficient equivalent code."""
full_description = "Stonerope Stonerope is a prototype for fast, large-scale account balance storage. It can handle over 10 million accounts with 256-bits keys in 64GB of memory and allows for rapid account insertion (10ms/insertion) and transaction processing (2ms/transaction). Tezos Tezos is a PoS blockchain with protocol amendment. Since its foundation, DaiLambda participated Tezos core development for 6 years. Optz: Michelson optimizer Optz is an optimizer of Michelson programs, the base language for Tezos smart contract. It takes a Michelson code as input and then returns a smaller and more efficient equivalent code. Plebeia Plebeia is a functional implementation of a Merkle Patricia tree. The library allows the manipulation of in-memory functional views of the tree and perform atomic commits of those views to the disk. SCaml SCaml (Smart Contract Abstract Machine Language) is a language for Tezos blockchain smart contracts. Being a strict subset of OCaml, a programming language wildly used in computer science and financial industry including Tezos protocol, SCaml is a simple, small, but fully working compiler for Tezos smart contracts. Monaco_jsoo OCaml Js_of_ocaml interface for Monaco editor library."
