["https://www.dailambda.jp//tags/plebeia"]
title = "Plebeia - DaiLambda, Inc."
full_description = "Tezos+Plebeia context subsystem benchmark 2022-06-10に投稿 Introduction As Tezos core developers, we DaiLambda and Tarides are working together to improve the perfomance of Tezos context: the version controlled store of Tezos block chain states. DaiLambda has Plebeia, an append-only style data storage system based on Merkle Patricia binary tree. It is similar to Irmin by Tarides used for the Tezos context but incompatible. DaiLambda and Tarides have worked together to improve the performance of Tezos context subsystem, sometimes using what we have learned from Plebeia. For example, we provided the context tree for faster file access from the middle of the directory tree. Our context flattening done at Hangzhou upgrade speeded up the node by 30%. Recently, we have worked together to provide efficient Merkle proof encoding of Tezos context, using the idea of extender nodes of Plebeia, which will be used for the layer 2 solutions introduced in Tezos Jakarta upgrade. [続きを読む] plebeia tezos context optimization Plebeia in Tezos 2020-05-11に投稿 Plebeia is a functional storage system using Merkle Patricia tree implemented purely in OCaml. It is meant to be used for Tezos blockchain. Here are our updates since the last article: Optimized the storage size down to 80% since the last version, using its refactored path conversion scheme and hash-consing. Less than 70% of the current Tezos storage size by Irmin2. The code of Plebeia is available in GitLab. Plebeia integrated Tezos node is also available. [続きを読む] tezos dev plebeia"
