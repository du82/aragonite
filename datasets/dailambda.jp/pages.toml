["https://www.dailambda.jp/news/2018-12-01-tsa"]
title = "Tezosのコア開発に正式に参加しました - DaiLambda, Inc."
description = "本日、弊社ダイラムダ株式会社は Tezos SouthEast Asia との間に Tezos コア技術研究開発およびアジアにおける　Tezos 技術普及活動に関する受託契約を結びました。"
full_description = "本日、弊社ダイラムダ株式会社は Tezos SouthEast Asia との間に Tezos コア技術研究開発およびアジアにおける Tezos 技術普及活動に関する受託契約を結びました。 Tezos SouthEast Asia は東南アジア方面での Tezos 技術の普及を使命とした NPO です。 弊社はその設立より暗号通貨 Tezos (ティッカー XTZ)のコア技術開発に取り組んでまいりましたが、この契約により正式にコア開発の一員となりました。これからも世界中のエンジニア、リサーチャー達とともにブロックチェーンの技術研究開発に邁進してまいります。 弊社代表取締役はすでに Tezos Japan の理事として日本地域での Tezos 技術普及のための活動をしていますが、弊社と Tezos SouthEast Asia とのパートナーシップは、この活動を日本からアジア地区全体への拡大をも目指したものです。引き続き、より多くの皆様に安全なブロックチェーン技術を使っていただけるよう頑張っていきたいと思います。"
year_published = 2025
