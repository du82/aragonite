description = "cv tips - daiwk-github博客 - 作者:daiwk"
full_description = "普通的nn是不具备平移不变性的，而cnn可以，因为同一个卷积核在不同位置的权重是一样的 分组卷积：嵌入式的地方常用，mobilenet，因为速度快。例如256层，变成8组，每组32层，在cpu上加速很快，在gpu一般 se-net：引入se-block，在所有网络都有提升==》浅层、中层、深层 分别去做分类，然后把结果merge到一起 用上lstm: 1.拿出最后一个隐状态的结果做分类 2.把每一个时间步的状态做pooling，再分类，会稍微好一点 空间维度，先用一个cnn提取出1024维，t个时间步，看成1024个channel的图像，高1，宽是t，就变成了一个图像分类问题 训练时 会采样，例如只采样10帧（不用采太多），采一样多zhen，只要样本够多；测试可以所有帧 分类 欠拟合：区分性不足， 解决：把类别分细一点，类间不要有重合 加batchnorm"
