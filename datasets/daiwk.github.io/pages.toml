["https://daiwk.github.io/posts/nlp-probalistic-graphical-models.html"]
title = "概率图模型（HMM/MEMM/CRF） - daiwk-github博客"
description = "概率图模型（HMM/MEMM/CRF） - daiwk-github博客 - 作者:daiwk"
full_description = '概率图模型(probalistic graphical models)在概率模型的基础上，使用了基于图的方法来表示概率分布（或者概率密度、密度函数），是一种通用化的不确定性知识表示和处理方法。概率图模型的表达中，结点表示变量，结点之间的边表示相应变量之间的对应关系。 例如，假设S为一个汉语句子，X是句子S切分出来的词序列，那么，分词的过程可以看作是推断使\(P(X|S)\)最大的词序列X的分布。而词性标注中，可以看作在给定序列X的情况下，寻找一组最可能的词性标签分布T，使得\(P(T|X)\)最大。 贝叶斯网络又称信度网络或信念网络（belief networks），基础理论是贝叶斯公式，目的是通过概率推理 处理不确定性和不完整性问题。 一个贝叶斯网络就是一个有向无环图（directed acyclic graph, DAG），结点表示随机变量 （可观测量/隐含变量/未知参量或假设等），有向边表示条件依存关系（箭头指向的结点依存于发出箭头的结点【父节点】）。两个结点没有连线表示两个随机变量在某些特定情况下条件独立，如果有连线，则任何条件下都不可能条件独立。 每一个结点都和一个概率函数相关，概率函数的输入是该结点的父结点所表示的随机变量的一组特定值，输出为当前结点表示的随机变量的概率值。概率值的大小表示结点之间已存关系的强度。 对于一篇写了某个岛屿的文章而言，是否是一篇新闻记为事件N，是否记录了历史记为事件H，是否记录了旅游风光记为事件S。 下面我们来算一个概率：一篇关于某岛屿的文章是记录了历史，那么，它是一篇新闻的概率有多大？ \[ P(N=T|H=T)=\frac{P(H=T,N=T))}{P(H=T))}\\ =\frac {\sum _{S\in \{T,F\}}P(H=T,S,N=T)} {\sum _{N,S\in \{T,F\}}P(H=T,S,N)}\\ =\frac{(0.4\times 0.1\times 0.2=0.008)_{TTT}+(0.3\times 0.9\times 0.2=0.054)_{TFT}}{0.008_{TTT}+0.054_{TFT}+0.256_{TTF}+0.24_{TFF}}\\ =11.11\% \]'
year_published = 2016
