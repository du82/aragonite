full_description = "机器翻译系统在某些语言上取得了接近人类水平的性能，但其有效性在很大程度上依赖大量双语文本，这降低了机器翻译系统在大多数语言对中的适用性。本研究探讨了如何在只有大型单语语料库的情况下进行机器翻译。 在广泛使用的 WMT’14 英法和 WMT’16 德英基准测试中，我们的模型在不使用平行语句的情况下分别获得 27.1 和 23.6 的 BLEU 值，比当前最优技术高 11 个 BLEU 点。 大量文献研究了在有限的监督下使用单语数据来提升翻译性能的问题。这种有限的监督通常是以下形式： 最近，研究者提出了两种完全无监督的方法（Lample et al., 2018; Artetxe et al., 2018），仅依赖于每种语言的单语语料库，如 Ravi 和 Knight（2011）的开创性研究。 虽然这两项研究存在细微的技术差异，但我们发现了它们成功的几个共同因素:"
