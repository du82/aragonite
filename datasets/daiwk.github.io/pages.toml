["https://daiwk.github.io/posts/nlp-ndcg.html"]
title = "map/ndcg - daiwk-github博客"
description = "map/ndcg - daiwk-github博客 - 作者:daiwk"
full_description = 'NDCG如何理解？对于搜索引擎，本质是用户搜一个query，引擎返回一个结果列表，那么如何衡量这个结果列表的好坏？我能够想到的是： 第一个条件的满足是首要的，而第二个条件的加入是保证整体结果质量，而这两个条件都体现在了NDCG里面，首先，计算NDCG，需要计算Gain，这个gain即是每条结果的质量的定义，NDCG把所有结果相加最终相加保证，整体质量越高的列表NDCG值越大。同时，Discounted的设计使得越靠前的结果权重越大，这保证了第一条，更相关的排在靠前的结果会有更大的NDCG值。从这两点看，以NDCG为优化目标，保证了搜索引擎在返回结果总体质量好的情况下，把更高质量结果排在更前面。 首先，理解g(gain)，表示自己定义的一种获得，用来衡量网页的相关性程度，例如 \[\mathrm{DCG}_p=\sum^p_{i=1}{\frac{rel_i}{log_2(i+1)}}=rel_1+\sum^p_{i=2}{\frac{rel_i}{log_2(i+1)}}\] Ideal DCG，理想状况下的DCG。也就是说，相关性完全由高到低排序时算出的DCG：'
year_published = 2025
