["https://daiwk.github.io/posts/dl-dlbook-chap2.html"]
title = "deep learning book-第2章 Linear Algebra - daiwk-github博客"
description = "deep learning book-第2章 Linear Algebra - daiwk-github博客 - 作者:daiwk"
full_description = '\[ \\\boldsymbol{A}(\boldsymbol{B}+\boldsymbol{C})=\boldsymbol{A}\boldsymbol{B}+\boldsymbol{A}\boldsymbol{C} \\(\boldsymbol{A}\boldsymbol{B})\boldsymbol{C}=\boldsymbol{A}(\boldsymbol{B}\boldsymbol{C}) \] 注意，对于向量而言（\(\boldsymbol{x}\)是\(n\times 1\)的列向量，所以\(\boldsymbol{x}^T\)是\(1\times n\)的行向量）,所以\(\boldsymbol{x}_T\boldsymbol{y}\)是一个标量，他等于他的转置： \[ \boldsymbol{x}^T\boldsymbol{y}=(\boldsymbol{x}^T\boldsymbol{y})^T=\boldsymbol{y}^T\boldsymbol{x} \] 接下来看一下线性方程组（linear equations），\(\boldsymbol{A}\in \mathbb{R}^{m\times n}\)是一个已知的矩阵，\(\boldsymbol{b}\in \mathbb{R}^{m}\)是一个已知的向量，\(\boldsymbol{x}\in \mathbb{R}^{n}\)是一个未知的向量： \[ \boldsymbol{x}^T\boldsymbol{y}=(\boldsymbol{x}^T\boldsymbol{y})^T=\boldsymbol{y}^T\boldsymbol{x} \] \[ \\\boldsymbol{A}_{1,:}\boldsymbol{x}=\boldsymbol{A}_{1,1}x_1+\boldsymbol{A}_{1,2}x_2+...+\boldsymbol{A}_{1,n}x_n=b1 \\\boldsymbol{A}_{2,:}\boldsymbol{x}=\boldsymbol{A}_{2,1}x_1+\boldsymbol{A}_{2,2}x_2+...+\boldsymbol{A}_{2,n}x_n=b2 \\... \\\boldsymbol{A}_{m,:}\boldsymbol{x}=\boldsymbol{A}_{m,1}x_1+\boldsymbol{A}_{m,2}x_2+...+\boldsymbol{A}_{m,n}x_n=bm \] 单位矩阵：主对角线全1，其他元素全0的矩阵。单位矩阵和任何向量相乘，结果都是该向量本身。即，\(\boldsymbol{I}_n\in \mathbb{R}_{n\times n}\)，有： 矩阵的逆：\(\boldsymbol{A}^{-1}\)满足：\(\boldsymbol{A}^{-1}\boldsymbol{A}=\boldsymbol{I}_n\) 为了分析方程组有多少个解，我们可以从这个角度来理解线性方程组：我们从m维零向量出发，经过\(\boldsymbol{A}\)的n个方向的变换，最终到达m维目标向量\(\boldsymbol{b}\)所在的位置。那么，\(x_i\)就表示在这n个方向上，我分别走了多少步。 上面的式子表示，n个m维向量相加，得到一个m维向量这种操作称为线性组合（linear combination）。n个向量\({\boldsymbol{v}^{(1)},...,\boldsymbol{v}^{(n)}}\)的线性组合，指的就是每一个向量\(\boldsymbol{v}^{(i)}\)都乘以一个系数，并进行累加得到\(\sum _ic_i\boldsymbol{v}^{(i)}\)。'
