["https://daiwk.github.io/posts/ml-few-shot-learning.html"]
title = "few-shot learning - daiwk-github博客"
description = "few-shot learning - daiwk-github博客 - 作者:daiwk"
full_description = 'Meta Learning，又称为learning to learn，在meta training阶段将数据集分解为不同的meta task，去学习类别变化的情况下模型的泛化能力，在meta testing阶段，面对全新的类别，不需要变动已有的模型，就可以完成分类。 即要求模型从C*K个数据中学会如何区分这C个类别，这样的任务被称为C-way K-shot(C类，每个类K个样本)问题。 训练过程中，每次训练 (episode)都会采样得到不同meta-task。这种机制使得模型学会不同meta-task中的共性部分，比如如何提取重要特征及比较样本相似等，忘掉 meta-task中task相关部分，因此，在面对新的未见过的 meta-task时，也能较好地进行分类。 通过模型结构的设计快速在少量样本上更新参数，直接建立输入\(x\)和预测值\(P\)的映射函数。 One-shot learning with memory-augmented neural networks使用记忆增强的方法。基于记忆的神经网络方法早在2001年被证明可以用于meta-learning。通过权重更新来调节bias，并且通过学习将表达快速缓存到记忆中来调节输出。 利用循环神经网络的内部记忆单元无法扩展到需要对大量新信息进行编码的新任务上。因此，需要让存储在记忆中的表达既要稳定又要是元素粒度访问的，前者是说当需要时就能可靠地访问，后者是说可选择性地访问相关的信息；另外，参数数量不能被内存的大小束缚。神经图灵机（NTMs）和记忆网络就符合这种必要条件。 文章基于神经网络图灵机（NTMs）的思想，因为 NTMs 能通过外部存储（external memory）进行短时记忆，并能通过缓慢权值更新来进行长时记忆，NTMs可以学习将表达存入记忆的策略，并如何用这些表达来进行预测。由此，文章方法可以快速准确地预测那些只出现过一次的数据。 基于LSTM等RNN的模型，将数据看成序列来训练，在测试时输入新的类的样本进行分类。'
