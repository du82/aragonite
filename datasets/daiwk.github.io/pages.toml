description = "栈、堆、core、gdb等 - daiwk-github博客 - 作者:daiwk"
full_description = "u 表示从当前地址往后请求的字节数，如果不指定的话，GDB默认是4个bytes。u参数可以用下面的字符来代替，b表示单字节，h表示双字节，w表示四字 节，g表示八字节。当我们指定了字节长度后，GDB会从指内存定的内存地址开始，读写指定字节，并把其当作一个值取出来。 如果是某个奇葩版本的gcc，例如是4.8.4的https://www2.cs.duke.edu/csed/cplus/gcc-4.8.4/libstdc++-api-html/a00955_source.html，可以修改libstdcxx/v6/printers.py： 当然，更直接的，我们可以用github上的分支！！https://github.com/gcc-mirror/gcc/tree/gcc-4_8-branch。。。。比较大。。要下好久，建议直接把zip下下来试试。 对应的脚本在https://github.com/gcc-mirror/gcc/blob/gcc-4_8-branch/libstdc%2B%2B-v3/python/libstdcxx/v6/printers.py 来深入了解一下这个神奇的『dereference』：https://stackoverflow.com/questions/4955198/what-does-dereferencing-a-pointer-mean 其实_Hash_node_base就只是一个里面只有一个指针的结构体。。没啥用的样子，我们看看另一个变量 然后我们参考https://www2.cs.duke.edu/csed/cplus/gcc-4.8.4/libstdc++-api-html/a00406.html，会发现_M_buckets『好像』是一个数组！ 别被骗了。。这是个指针，不是数组https://www2.cs.duke.edu/csed/cplus/gcc-4.8.4/libstdc++-api-html/a00955_source.html： 再然后看看_Hash_node的定义：https://www2.cs.duke.edu/csed/cplus/gcc-4.8.4/libstdc++-api-html/a00957_source.html !!!大boss来了！！，我们来学习一下下什么叫高科技：(参考https://www.zhihu.com/question/26902926) 发现rid外层是对的，但在内层的videoinfo_pb里却是错的，说明在给videoinfo_pb赋值的地方有问题，进一步地，我们可以看看中层的video_info字段，发现这里的rid也是错的！！发现给这个video_info赋值的代码包在一个#pragma omp parallel for里，尝试把这个注释掉… 也就是说，临时变量mid_tmp_res里的一个地址adress被赋值给了rid_tmp_info这个变量的video_info这个成员！！但mid_tmp_res这个变量在函数执行完后就被回收了，所以后面还想要用tmp_res里的成员\b变量的video_info的时候，会发现这个地址取出来的值是不对的！！。。。解决方法呢，就是把这个mid_tmp_res的生命周期变得和tmp_res一样长了，看框架的设计机制咯。。"
