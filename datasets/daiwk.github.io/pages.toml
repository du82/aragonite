["https://daiwk.github.io/posts/dl-graph-representations.html"]
title = "graph representation - daiwk-github博客"
description = "graph representation - daiwk-github博客 - 作者:daiwk"
full_description = '''再来另一个KDD2019的图相关的turorial：“Learning From Networks——Algorithms, Theory, & Applications”： 以下主要参考自AAAI2019的tutorial：AAAI2019《图表示学习》Tutorial, 180 页 PPT 带你从入门到精通（下载） 传统的机器学习方法依赖于用户定义的启发式模型来提取关于图的结构信息的特征编码 (例如，degree statistics或核函数)。然而，近年来，使用基于深度学习和非线性降维的技术，自动学习将图结构编码为低维embedding的方法激增。 问题定义：给定\(G=(V,E,W)\)，其中，\(V\)是结点集合，\(E\)是边的集合，\(W\)是边的权重集合。所谓的node embedding就是对结点\(i\)学习一个向量\(u_i\in R^d\)。 First-order Proximity（一阶相似度）：两个顶点之间的自身相似（不考虑其他顶点）。因为有些结点的link并没有被观测到，所以一阶相似度不足以保存网络结构。 \[ p_1(v_i,v_j)=\frac{\exp(\vec{u_i}^T\vec{u_j})}{\sum_{(m,n)\in V\times V}\exp(\vec{u_m}^T\vec{u_n})} \] \[ O_1=\sum _{(i,j)\in E}w_{ij}\log w_{ij}-\sum _{(i,j)\in E}w_{ij}\log p_1(v_i,v_j)\approx -\sum _{(i,j)\in E}w_{ij}\log p_1(v_i,v_j) \] 只考虑一阶相似度的情况下，改变同一条边的方向对于最终结果没有什么影响。因此一阶相似度只能用于无向图，不能用于有向图。 Second-order Proximity（二阶相似度）：网络中一对顶点\((u,v)\)之间的二阶相似度是它们邻近网络结构之间的相似性。 邻近网络的模型分布，其中，\(u_i\)是\(v_i\)被视为顶点时的表示，\(u'_i\)是\(v_i\)被视为”context”时的表示： \[ \log \sigma(\vec{u'_j}^T\vec{u'_i})+\sum ^K_{i=1}E_{v_n\sim P_n(v)}[\log \sigma (-\vec{u'_n}^T\vec{u_i})] \] 其中\(\sigma(x)=1/(1+\exp(-x))\)，设置\(P_n(v)\propto d_v^{3/4}\)，其中\(d_v\)是节点的出度（即\(d_i=\sum _{k\in N(i)}w_{ik}\)，其中\(N(i)\)是\(v_i\)的为起点的邻居的集合）。 针对一阶的，把上面式子里的第一项里的\(\vec{u'_j}^T\)换成\(\vec{u_j}^T\)就行啦~'''
