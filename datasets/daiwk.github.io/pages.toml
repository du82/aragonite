description = "机器学习相关tips - daiwk-github博客 - 作者:daiwk"
full_description = 'autoauto- 李宏毅的机器学习笔记auto- 评价指标auto - 关于auc和p/r/f1…auto- aucauto- roc curve v.s. precision-recall curveauto - ROC与PR曲线auto- 过拟合问题auto - 获取更多数据auto - 从数据源头获取更多数据auto - 根据当前数据集估计数据分布参数，使用该分布产生更多数据auto - 数据增强（Data Augmentation）auto - 使用合适的模型auto - 网络结构auto - 训练时间（early stopping）auto - 限制权值/正则化auto - 增加噪声auto - 在输入中加噪声auto - 在权值上加噪声auto - 对网络的响应加噪声auto - 使用多种模型auto - baggingauto - boostingauto - dropoutauto - 贝叶斯方法auto- 模型参数与训练样本规模的关系auto - How much training data do you needauto - lstm参数规模计算auto - embedding layer参数规模计算auto- 其他auto - 不恰当地分割数据auto - 隐变量auto - 定错训练目标auto- 其他2auto - cv的tipauto- 学习率与batchsizeautoauto 参考https://stackoverflow.com/questions/34698161/how-to-interpret-almost-perfect-accuracy-and-auc-roc-but-zero-f1-score-precisio One must understand crucial difference between AUC ROC and “point-wise” metrics like accuracy/precision etc. ROC is a function of a threshold. Given a model (classifier) that outputs the probability of belonging to each class we usually classify element to the class with the highest support. However, sometimes we can get better scores by changing this rule and requiring one support to be 2 times bigger than the other to actually classify as a given class. This is often true for imbalanced datasets. This way you are actually modifing the learned prior of classes to better fit your data. ROC looks at “what would happen if I change this threshold to all possible values” and then AUC ROC computes the integral of such a curve. 首先，P/R/accuracy/F-measure如下： \[\\precision=\frac{TP}{所有预测为正例的样本}=\frac{TP}{TP+FP} \\recall=\frac{TP}{所有真正的正例}=\frac{TP}{TP+FN} \\accuracy=\frac{所有预测对的}{全量}=\frac{TP+TN}{P+N} \\F-measure=\frac{2}{\frac{1}{presion}+\frac{1}{recall}} \]'
