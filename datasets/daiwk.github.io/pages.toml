["https://daiwk.github.io/posts/nlp-nmt.html"]
title = "nmt - daiwk-github博客"
description = "nmt - daiwk-github博客 - 作者:daiwk"
full_description = 'paddle rnn系列文档： https://github.com/PaddlePaddle/Paddle/tree/develop/doc/howto/deep_model/rnn \[ \\ f_t=\sigma _g(W_fx_t+U_fh_{t-1}+b_f) \\ i_t=\sigma _g(W_ix_t+U_ih_{t-1}+b_i) \\ o_t=\sigma _g(W_ox_t+U_oh_{t-1}+b_o) \\ c_t=f_t \circ c_{t-1}+i_t \circ \sigma _c(W_cx_t+U_ch_{t-1}+b_c) \\ h_t=o_t \circ \sigma _h(c_t) \] 其中，初始值\(c_0=0\)，\(h_0=0\)，\(\circ \)表示element-wise的乘积，也就是图中的\(\otimes \) 在LSTM Recurrent Networks Learn Simple Context Free and Context Sensitive Languages, 2001以及Learning Precise Timing with LSTM Recurrent Networks引入peephole conneciton： \[ \\ f_t=\sigma _g(W_fx_t+U_fc_{t-1}+b_f) \\ i_t=\sigma _g(W_ix_t+U_ic_{t-1}+b_i) \\ o_t=\sigma _g(W_ox_t+U_oc_{t-1}+b_o) \\ c_t=f_t \circ c_{t-1}+i_t \circ \sigma _c(W_cx_t+b_c) \\ h_t=o_t\circ \sigma _h(c_t) \] 也就是说，传统的rnn是对\(\sigma _c(xxxh_{t-1})\)【其中\(\sigma _c\)是tanh】乘以w，然后再算sigmoid。而lstm对这项只是乘了一个(0,1)的系数(\(i_t\))，然后加上\(f_t \dot c_{t-1}\)，再求tanh再乘一个(0,1)的系数（\(o_t\)），也就是说，并没有乘w，只是和一堆（0,1）的系数进行了线性变换，然后求和。。。 GRU是Cho等人在LSTM上提出的简化版本，也是RNN的一种扩展，如下图所示。GRU单元只有两个门： \(z_t\)【更新门】和\(r_t\)【重置门】都作用(sigmoid)于\([h_{t-1},x_t]\)【即上一时刻的隐层状态\(h_{t-1}\)和这一时刻的输入\(x_t\)】。 而重置门作用于\(h_{t-1}\)得到\(r_t*h_{t-1}\)【注意，是element-wise乘积】再与\(x_t\)一起经过tanh得到节点状态。 最终的输出是更新门与节点状态相乘，再加上\(1-z_t\)与上一时刻的隐层状态\(h_{t-1}\)的乘积。 \[ \\ z_t=\sigma _g(W_zx_t+U_zh_{t-1}+b_z) \\ r_t=\sigma _g(W_rx_t+U_rh_{t-1}+b_r) \\ h_t=z_t \circ h_{t-1}+(1-z_t) \circ \sigma _h(W_hx_t+ U_h(r_t \circ h_{t-1}) + b_h) \] 我们已经在语义角色标注一章中介绍了一种双向循环神经网络，这里介绍Bengio团队在论文【Bahdanau等人Neural Machine Translation by Jointly Learning to Align and Translate, ICLR, 2015】中提出的另一种结构。该结构的目的是输入一个序列，得到其在每个时刻的特征表示，即输出的每个时刻都用定长向量表示到该时刻的上下文语义信息。'
year_published = 2017
