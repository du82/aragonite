["https://daiwk.github.io/posts/knowledge-algorithms.html"]
title = "常用算法 - daiwk-github博客"
description = "常用算法 - daiwk-github博客 - 作者:daiwk"
full_description = '从一个包含n个对象的列表S中随机选取k个对象，n为一个非常大或者不知道的值。通常情况下，n是一个非常大的值，大到无法一次性把所有列表S中的对象都放到内存中。 如果k=1，我们总是选择第一个对象，以1/2的概率选择第二个，以1/3的概率选择第三个，以此类推，以1/m的概率选择第m个对象。当该过程结束时，每一个对象具有相同的选中概率，即1/n， 证明：第m个对象最终被选中的概率P=选择m的概率*其后面所有对象不被选择的概率 证明：第m个对象被选中的概率=选择m的概率*（其后元素不被选择的概率+其后元素被选择的概率*不替换第m个对象的概率），即 \[ \begin{align*} P &=\frac{k}{m}*[(\frac{m+1-k}{m+1}+\frac{k}{m+1}*\frac{k-1}{k})*(\frac{m+2-k}{m+2}+\frac{k}{m+2}*\frac{k-1}{k})*...*(\frac{n-k}{n}+\frac{k}{n}*\frac{k-1}{k})] \\ &=k/m*m/n\\ &=k/n \end{align*} \] 蚁群算法作为一种启发式算法，在进行路径选择的过程中，当选择下一目标时，通过轮盘赌概率选择的方式完成，这也保证了每次循环都能随机的命中概率较大的目标。其算法思路如下： 设P(i)，其中i=1..n，为n个个体被选择的概率，在轮盘上表示为所占扇区的面积百分比，这里显然sum(P)=1。select用来保存n次选择的结果。 比如轮盘上有3个区域，概率分别是0.4,0.27,0.33，那么可以在[0,1]这条线段上划分出三个区间，两个分隔点是0.4,0.67，三个区间是[0,0.4],[0.4,0.67],[0.67,1]，然后随机一个[0-1]的数，看落在哪个区间，就相当于选中哪个数啦~ 实际应用中，例如对一个每个元素有自己score的N个元素的list，想生成一个重新排序的list。可以进行N次轮盘赌： 对剩下的元素走softmax归一化一下，算出每个的区间值，然后随机一个数，看在哪个区间里，就意味着选中了这个区间。 然后把这个区间的那个数扔出去，再对剩下的元素重复上面的过程（softmax，分区间，随机数，选区间，扔掉），直到选出了N个元素的list。'
