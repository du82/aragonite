description = "fasttext - daiwk-github博客 - 作者:daiwk"
full_description = '在文本分类任务中，fastText（浅层网络）往往能取得和深度网络相媲美的精度，却在训练时间上比深度网络快许多数量级。在标准的多核CPU上， 能够训练10亿词级别语料库的词向量在10分钟之内，能够分类有着30万多类别的50多万句子在1分钟之内。 softmax回归被称作多项逻辑回归（multinomial logistic regression），是逻辑回归在处理多类别任务上的推广。 softmax中，我们需要对所有的K个概率做归一化，这在\(|y|\)很大时非常耗时。分层softmax的基本思想是使用树的层级结构替代扁平化的标准Softmax，在计算\(P(y=j)\)时，只需计算一条路径上的所有节点的概率值，无需在意其它的节点。 \[ p(y_j)=\prod _{l=1}^{L(y_j)-1}\sigma (\left \lfloor n(y_j,l+1)=LC(n(y_j,l)) \right \rfloor \cdot \theta _{n(y_j,l)} ^TX) \] \[ \left \lfloor x \right \rfloor =\left\{\begin{matrix} 1, if x =true \\ -1,otherwise \end{matrix}\right. \] \[ \\P(y_2)=P(n(y_2,1),left)P(n(y_2,2),left)P(n(y_2,3),right) \\=\sigma (\theta _{n(y_2,1)}^TX) \cdot \sigma (\theta _{n(y_2,2)}^TX) \cdot \sigma (-\theta _{n(y_2,3)}^TX) \] 于是，从根节点走到叶子节点\(y_2\)，其实是做了3次二分类的lr。通过分层的Softmax，计算复杂度一下从\(|K|\)降低到\(log_2|K|\)。 似乎暂时没有tf的实现，有keras的实现：https://github.com/jmhessel/keras/blob/master/keras/layers/advanced_activations.py#L268-L395 基本思想是将文本内容按照字节顺序进行大小为N的滑动窗口操作，最终形成长度为N的字节片段序列。n-gram产生的特征只是作为文本特征的候选集，你后面可能会采用信息熵、卡方统计、IDF等文本特征选择方式筛选出比较重要特征。 因为词库V往往非常大，使用标准的softmax计算相当耗时，于是CBOW的输出层采用的是分层Softmax。 隐层的输出是C个上下文单词向量先求和，然后乘以W,再取平均，得到的一个N维向量:'
