title = "GAN-CDQN - daiwk-github博客"
description = "GAN-CDQN - daiwk-github博客 - 作者:daiwk"
full_description = '本文提出利用生成对抗网络同时学习用户行为模型transition以及奖励函数reward。将该用户模型作为强化学习的模拟环境，研究者开发了全新的Cascading-DQN算法，从而得到了可以高效处理大量候选物品的组合推荐策略。 本文用真实数据进行了实验，发现和其它相似的模型相比，这一生成对抗用户模型可以更好地解释用户行为，而基于该模型的RL策略可以给用户带来更好的长期收益，并给系统提供更高的点击率。 为了解决无模型方法样本复杂度大的问题，基于模型的RL方法更为可取。近期有一些研究，在robotics applications中，在相关但不相同的环境设置中训练机器人策略，结果表明基于模型的RL采样效率更高。如Neural Network Dynamics for Model-Based Deep Reinforcement Learning with Model-Free Fine-Tuning，还有Gaussian Processes for Data-Efficient Learning in Robotics and Control，还有 Learning to adapt: Meta-learning for model-based control。 基于模型的方法的优势在于可以池化大量的off-policy数据，而且可以用这些数据学习良好的环境动态模型，而无模型方法只能用昂贵的on-policy数据学习。但之前基于模型的方法一般都是根据物理或高斯过程设计的，而不是根据用户行为的复杂序列定制的。 本文的框架用统一的minimax框架学习用户行为模型和相关的奖励函数，然后再用这个模型学习RL策略。 用真实数据进行实验得到的结果表明，从保留似然性和点击预测的角度来说，这种生成对抗模型可以更好地拟合用户行为。根据学习到的用户模型和奖励，研究者发现评估推荐策略可以给用户带来更好的长期累积奖励。此外，在模型不匹配的情况下，基于模型的策略也能够很快地适应新动态（和无模型方法相比，和用户交互的次数要少得多）。 setting：给用户展示了\(k\)个item，然后他点了1个或者0个，然后展示后\(k\)个item。'
