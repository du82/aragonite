["https://daiwk.github.io/posts/ml-svm-3-levels.html"]
title = "深入理解svm - daiwk-github博客"
description = "深入理解svm - daiwk-github博客 - 作者:daiwk"
full_description = '支持向量机通俗导论（理解SVM的三层境界）：http://blog.csdn.net/v_july_v/article/details/7624837 其中，\(L=1/2w^2+\sum _{i=1}^m\alpha _i[1-y_i(w^Tx+b)]\)，\(1-y_i(w^Tx+b)\)这项<=0，\(alpha\)>=0，所以\(L=1/2*w^2-CC\)，CC>=0，所以\(L<=1/2*w^2\)，\(max_{\alpha} L=1/2*w^2\) 0/1分类： 给sigmoid之前的函数值\(\theta^Tx\)是负无穷到正无穷，sigmoid之后的值相当于取y=1时的概率值，大于0.5就视为1的类。如果\(\theta^Tx>0\)则\(sigmoid(\theta^Tx)>0.5\)，换言之，要学到参数\(\theta\)，使正例的的\(\theta^Tx\)远大于0，负例的\(\theta^Tx\)远小于0. \[ g(f(x))=g(\omega^Tx+b) = \begin{cases} +1, \omega^Tx+b >= 0 \\ -1, \omega^Tx+b < 0 \\ \end{cases} \] 超平面\((\omega,b)\)关于数据集T上的函数间隔：(w,b)关于T中所以样本点的函数间隔的最小值： 当w，b同时扩大时，超平面没变（\(\omega^Tx+b=0,2\omega^Tx+2b=0\)），但函数间隔却变大了，所以，需要规范化。 点\(x\)投影到超平面的点为\(x_0\),因为\(\omega\)是垂直于超平面的法向量，设\(x\)到超平面的距离是\(\gamma\),那么 因为\(x_0\)是超平面上的点，所以\(f(x_0)=0\)，所以 \[ \\x=x_0+\gamma\frac{\omega}{||\omega||} \\\omega^Tx=\omega^Tx_0+\gamma\frac{\omega^T\omega}{||\omega||} \\\omega^Tx+b=\omega^Tx_0+b+\gamma\frac{\omega^T\omega}{||\omega||} \\f(x)=0+\gamma\frac{\omega^T\omega}{||\omega||} \\f(x)=\gamma||\omega|| \\\gamma=\frac{f(x)}{||\omega||} \] 因为\(\gamma\)也是有符号的，而间隔只要他的绝对值，所以，几何间隔定义为： 对一个数据点进行分类，当这个点和超平面之间的间隔越大的时候，分类正确的把握越大(离超平面越远，那他肯定不是分界面附近的点，肯定属于某一个类别)。对于一个包含n个点的数据集，我们可以很自然地定义它的间隔为所有这n个点的间隔中最小的那个。于是，为了使得分类的把握尽量大，我们希望所选择的超平面能够最大化这个间隔值（最大化这n个点里离超平面最近的点和超平面间的间隔）。'
