["https://daiwk.github.io/posts/nlp-named-entity-recognition.html"]
title = "命名实体识别 - daiwk-github博客"
description = "命名实体识别 - daiwk-github博客 - 作者:daiwk"
full_description = "MUC-6最早提出命名实体（named entity），当时关注的焦点是information extraction，即从报章等非结构化文本中抽取关于公司活动和国防相关活动的结构化信息，而人名、地名、组织机构名、时间和数字表达（时间、日期、货币量和百分数等）是结构化信息的关键内容。 相关的评测会议还有CoNLL(Conference on Computational Natural Language Learning)、ACE和IEER(Information Extraction-Entity Recognition Evaluation)。 MUC-6关注人名、地名（细化为城市、州和国家）、组织机构名。CoNLL扩大了专有名词的范围，包含产品名的识别。其他研究工作中也涉及了电影名、书名、项目名、研究领域名、电子邮件地址、电话号码等，还有生物信息学领域的专有名词等。本文主要关注人名、地名和组织机构名三类专有名词的识别方法。 将给定的文本首先进行分词处理，然后对人名、简单地名和简单的组织机构名 进行识别，最后识别复合地名和复合组织机构名。 简单地名如北京、大不列颠；复合地名：北京市海淀区中关村xx路、中华人民共和国；简单组织机构名：北京大学、卫生部、联合国；复合组织机构名：欧洲中央银行、中华人民共和国卫生部、联合国世界粮食计划署。 由于基于CRF的命名实体识别属于有监督的学习方法，因此需要使用已标注的大规模语料，例如北京大学计算语言学研究所标注的现代汉语多级加工语料【现代汉语多级加工语料库】。还有一个在线的资源北大的CCL。 首先，将分词语料的标记转化成用于命名实体序列标注的标记，例如pnb表示人名的起始用字，pni表示名字的内部用字。同样的，还有locb/loci/orgb/orgi。另外，out表示不属于某一实体。 然后，确定特征模板。特征模板一般采用当前位置的前后n(n>=1)个位置上的字（或词、字母、数字、标点等，统称“字串”）及其标记 表示，即[w(-n)/tag(-n), …, w(-1)/tag(-1), w(0)/tag(0), w(1)/tag(1), …, w(n)/tag(n)]。综合考虑性能和涵盖的信息量，通常n取2~3。"
year_published = 2016
