["https://daiwk.github.io/posts/dl-dl-ctr-models.html"]
title = "基于深度学习的ctr预估模型集合（持续更新） - daiwk-github博客"
description = "基于深度学习的ctr预估模型集合（持续更新） - daiwk-github博客 - 作者:daiwk"
full_description = '多项式模型的问题在于二阶项的参数过多，假设特征个数为n，那么二阶项的参数数目为n(n+1)/2，参数太多，而却只有少数模式在样本中能找到，因此模型无法学出对应的权重。 \[ \hat{y} = w_0+\sum _{i=1}^nw_ix_i+\sum_{i=1}^{n-1}\sum_{j=i+1}^{n}\left \langle \mathbf{v}_i,\mathbf{v}_j \right \rangle x_ix_j \] 发现，\(xV\)就是将离散稀疏特征\(x\)降维成一个低维稠密向量，所以其实就是一种embedding。 FFM把相同性质的特征归于同一个field。每一维特征\(x_i\)，针对其他特征的每一种field \(f_j\)，都会学习一个隐向量\(V_{i,f_j}\)。所以隐向量不仅与特征有关，也与field相关。假设有\(n\)个特征，\(f\)个field，那么FFM的二次项总共有\(nf\)个隐向量，而FM中，每一维特征的隐向量只有一个。公式如下： \[ y=w_0+\sum^n_{i=1}w_ix_i+\sum^n_{i=1}\sum ^n_{j=i+1} \left \langle V_{i,f_j}, V_{j,f_i} \right \rangle x_i x_j \] 如果隐向量的长度是\(k\)，那么FFM的二次参数有\(nfk\)个，远多于FM的\(nk\)个，二次项并不能化简，所以时间复杂度是\(O(kn^2)\)。由于FFM中的latent vector只需要学习特定的field，所以通常要求\(k_{FFM}<< k_{FM}\) 主要思想就是把item侧的emb做一下转置，然后就可以各自concat，拼出user的大向量和item的大向量，然后做个内积就是了。要加一阶项或者user内部组合特征或者item内部组合特征，就往对应的大向量后面加，然后另一个大向量对应位置写1，再去搞内积就是了。 “微博在业务中的实践表明，如果采取FM召回模型，对于有些应用来说，一阶项对于最终效果有明显影响，所以在用FM/FFM做召回的时候，是需要将一阶项考虑进去的，这可能是个别一阶特征比较重要导致的。我们在Criteo数据集合的实验结果也证明：如果是FM模型，一阶项是有用的，去掉一阶项，只保留二阶项，AUC大约会掉1个绝对百分点，对于CTR来说，这个差距还是很明显的；而如果是采用DeepFM模型，则FM部分是否保留一阶项对最终结果没有什么影响，这说明DNN的隐层有效地将一阶项的作用吸收掉了。”'
year_published = 2018
