["https://daiwk.github.io/posts/knowledge-c++-useful-features.html"]
title = "c++有用的特性 - daiwk-github博客"
description = "c++有用的特性 - daiwk-github博客 - 作者:daiwk"
full_description = '''sprintf使用控制字符串来指定输出格式，该字符串通常包括”%s”(字符串输出)。若指定字符串输出的精确指定符，则可通过指定输出的最大长度来防止缓冲区溢出(如%.10s将复制不超过10个字符)。也可以使用”“作为精确指定符(如”%.s”)，这样就可传入一个最大长度值。精确字段仅指定一个参数的最大长度，但缓冲区需要针对组合起来的数据的最大尺寸调整大小。 “字段宽度”(如”%10s”，无点号)仅指定最小长度——而非最大长度，从而留下缓冲区溢出隐患。 函数说明：最多从源串中拷贝n－1个字符到目标串中，然后再在后面加一个 '\0'。所以如果目标串的大小为 n 的话，将不会溢出。 函数返回值：若成功则返回欲写入的字符串长度(而不是实际写入的字符串度)，若出错则返回负值。 auto_ptr是用于C++11之前的智能指针。由于 auto_ptr 基于排他所有权模式：两个指针不能指向同一个资源，复制或赋值都会改变资源的所有权。auto_ptr 主要有两大问题： 在C++11中已经放弃auto_ptr转而推荐使用unique_ptr和shared_ptr。unique跟auto_ptr类似同样只能有一个智能指针对象指向某块内存，但它还有些其他特性。unique_ptr对auto_ptr的改进如下： auto_ptr通过拷贝构造或者operator=赋值后，对象所有权转移到新的auto_ptr中去了，原来的auto_ptr对象就不再有效，这点不符合人的直觉。unique_ptr则直接禁止了拷贝构造与赋值操作。 unique_ptr像上面这样一般意义上的复制构造和赋值或出错，但在函数中作为返回值却可以用 我们知道auto_ptr不可做为容器元素，会导致编译错误。虽然unique_ptr同样不能直接做为容器元素，但可以通过move语义实现。 unique_ptr持有对对象的独有权，同一时刻只能有一个unique_ptr指向给定对象（通过禁止拷贝语义、只有移动语义来实现）。'''
