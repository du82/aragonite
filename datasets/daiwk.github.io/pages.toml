full_description = "现实生活中很多的数据可以用图（graph）来建模，比如社交网络数据，paper 引用数据等。对于 AI 而言，一个常见的任务是半监督分类，即对图中的每一个点进行分类，在仅有部分点有标注的情况下。 处理理此类问题，比较经典的方法是 GCN，通过对相邻节点的特征聚合操作来对每个节点进行特征提取。GCN 等 GNN 模型对于节点之间的关系表征是二元的，即仅能表征两个节点 <e1,e2> 之间的关系，对于大于二元的关系组只能通过多个二元关系的方式去近似。 超图模型（Hypergraph）就是针对这种情况提出的一种网络结构。不同类型的数据中都存在着多元关系，超图模型的基本设定就是一个边可以包含大于 2 个点，去拟合多元关系。"
year_published = 2019
clearnet = "https://daiwk.github.io/posts/dl-hypergraph.html"
