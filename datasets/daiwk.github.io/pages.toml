full_description = "内存泄漏一般是由于程序在堆(heap)上分配了内存而没有释放，随着程序的运行占用的内存越来越大，一方面会影响程序的稳定性，可能让运行速度越来越慢，或者造成oom，甚至会影响程序所运行的机器的稳定性，造成宕机。 上面的方式是完整模式，我们还可以通过diff模式，对两个时刻的heap做diff，把一些内存分配没有发生变化的模块去掉，而把增量部分显示出来。 如果内核版本2.6.32_1-23-0-0以上，系统有自带的(centos6u3以上的也自带)。否则需要安装： 例如，我们对某进程搞一下，可以看到以下火焰图，然后我们发现xgboost的预测xgboost::predictor::CPUPredictor::PredLoopSpecalize就占了总cpu利用的9.36%！。。： 然后，参考https://tsdgeos.blogspot.com/2014/03/asan-and-gcc-how-to-get-line-numbers-in.html，gcc要下面这样才能看到行号。。而clang可以直接看到行号。。 可见，test_asan.cpp:5使用了test_asan.cpp:4就free掉的指针，而这个指针是在test_asan.cpp:3进行的内存分配。"
