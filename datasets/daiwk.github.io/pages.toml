["https://daiwk.github.io/posts/dl-deep-cross-network.html"]
title = "deep & cross network for ad click predictions - daiwk-github博客"
description = "deep & cross network for ad click predictions - daiwk-github博客 - 作者:daiwk"
full_description = "在ctr预估这种场景中，有大量的离散和类别特征，所以特征空间非常大且稀疏。线性模型，例如logistic regression，简单，有可解释性，易扩展性，而交叉特征可以显著增加模型的表示能力。但这些组合往往需要人工的特征工程，或者exhaustive searching，而且，产生unseen的特征interactions非常困难。 本文提出了cross network，可以使用自动的方式实现显式的特征交叉。cross network包括了多种层，其中最高度的interactions是由层的深度决定的。每一层会\b基于已有的部分产出高阶interactions，并保持前层的interactions。本文实现了cross network和dnn的联合训练。dnn能捕捉特征间非常复杂的interactions，但相比cross network而言，需要更多参数（几乎差一个数量级？an order of），而且难以显式地产出交叉特征，\b并且可能难以高效地学习特征的interactions。 为了避免\bextensive task-specific特征工程，主要有两类方法：embedding方法和神经网络。 如果有足够的隐层及隐单元，DNN能够近似任意函数。而现实问题所对应的函数往往不是『任意』的。 将sparse特征（例如类别型的特征，输入就是一个二进制的one-hot，如[0,1,0,0]）embedding成稠密向量： 其中，\\(x_{embed,i}\\)是embedding后的向量，\\(x_i\\)是第i个类目的二进制输入，\\(W_{embed,i}\\in R^{n_e\\times n_v}\\)是一个embedding矩阵，\\(n_e\\)是embedding的size，\\(n_v\\)是词典的size。 可见，维数分别是dx1,1xd,dx1，最终输出得到的就是一个dx1的向量。所以第二项需要对上一层的输出转置成1xd。 假设cross layer有\\(L_c\\)层，\\(d\\)是input的维数，那么，整个cross network的参数数量就是： 这里乘了2，因为有w和b两个参数，每个参数在每一层里都是d维。时间和空间复杂度都是线性的。 其中，\\(x_{L_1}\\in R^d\\)是cross network的输出，\\(h_{L_2}\\in R^m\\)是dnn的输出。\\(w_{logits}\\in R^{(d+m)}\\)是权重，\\(\\sigma (x)=1/(1+exp(-x))\\)。"
