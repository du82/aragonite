full_description = "假设一句话有l个词，总词典大小是N，那么大的emb矩阵就是Nxd，而对于这句话来讲，就是一个lxd的矩阵，然后用same padding，并用1D卷积，详细地说，就是先padding成一个(l+K-1)xd的矩阵，然后有H个Kxd的卷积核，这样得到的结果就是一个(l+K-1-K+1)x(d-d+1)xH=lx1xH=lxH的矩阵了，之所以叫same padding，就是因为一开始的第一维是l，最终的第一维仍是l。 对于maxpooling来说，输入是lxH，按照论文和图中的，应该是l个数取max，得到1xH，但下面的tf的实现，好像不是这样的呢。。。paddle的实现用的是https://daiwk.github.io/posts/nlp-nmt.html#8-%E5%85%B6%E4%BB%96这个的sequence_conv_pool函数，实现参考 参考paddle代码：https://github.com/PaddlePaddle/models/blob/develop/fluid/PaddleRec/tagspace/net.py"
