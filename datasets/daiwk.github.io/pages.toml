["https://daiwk.github.io/posts/nlp-bert-code-annotated-framework.html"]
title = "bert代码解读——framework - daiwk-github博客"
description = "bert代码解读——framework - daiwk-github博客 - 作者:daiwk"
full_description = "高仿https://github.com/tensorflow/tensor2tensor/blob/master/tensor2tensor/layers/transformer_layers.py#L99的transformer_encoder部分。 从checkpoint的list_variables中，获取tvars（一般是tvars = tf.trainable_variables()）中的变量 tensor的rank表示一个tensor需要的索引数目来唯一表示任何一个元素。也就是通常所说的 “order”, “degree”或”ndims”，不是矩阵的秩。。参考https://blog.csdn.net/lenbow/article/details/52152766 其中的tf.erf是tensorflow/python/ops/gen_math_ops.py中的函数，计算Gauss error function of `x` element-wise. 返回一个shape是[batch_size, seq_length, embedding_size]的tensor，还有shape为[vocab_size, embedding_size]的整个embedding_table 参考https://www.cnblogs.com/yangmang/p/7125458.html提到的广播原则：如果两个数组的后缘维度(即：从末尾开始算起的维度)的轴长相符或其中一方的长度为1，则认为它们是广播兼容的，广播会在缺失和(或)长度为1的轴上进行。 如果from_tensor和to_tensor一样，那就是self-attention。from_tensor的每一个timestep会attend to to_tensor的对应序列，然后返回一个fixed-with vector。 首先，将from_tensor映射到一个”query” tensor，并把to_tensor映射成”key” tensors和”value” tensors。这些是一个长度为num_attention_heads的list的tensors，每个tensor的shape是[batch_size, seq_length, size_per_head]。 然后，对query和key tensors进行dot-product，然后scale。这是通过softmax来获得attention probabilities。然后把value tensors通过这些probabilities进行interpolate(插值？。。)，再然后concate到一起形成一个single tensor并返回。 实践中，multi-head attention通过transpose和reshape，而非真正地将tensors进行separate。。 注：classmethod修饰符对应的函数不需要实例化，不需要self参数，但第一个参数需要是表示自身类的cls参数，可以来调用类的属性，类的方法，实例化对象等。"
