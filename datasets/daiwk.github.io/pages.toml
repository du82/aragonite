["https://daiwk.github.io/posts/dl-gnn.html"]
title = "图神经网络 - daiwk-github博客"
description = "图神经网络 - daiwk-github博客 - 作者:daiwk"
full_description = '图是一种数据结构，它对一组对象 （节点） 及其关系 （边） 进行建模。图神经网络（GNN）是一类基于深度学习的处理图域信息的方法。由于其较好的性能和可解释性，GNN 最近已成为一种广泛应用的图分析方法。 GNN的第一个动机源于卷积神经网络（CNN）：CNN只能在规则的Euclidean数据上运行，如图像（2维网格）和文本（1维序列）。如何将CNN应用于图结构这一非欧几里德空间，成为GNN模型重点解决的问题。 GNN的另一个动机来自图嵌入（Graph Embedding），它学习图中节点、边或子图的低维向量空间表示。DeepWalk、node2vec、LINE、SDNE等方法在网络表示学习领域取得了很大的成功。然而，这些方法在计算上较为复杂并且在大规模上的图上并不是最优的，GNN旨在解决这些问题。 2009年的第一篇GNN的文章The graph neural network model。GNN的target是要学习包括了每个节点的邻居的信息的state embedding \(h_v\in R^s\)。这里的state embedding \(h_v\)是节点\(v\)的一个\(s\)维的向量，能用来产生输出\(o_v\)，例如节点的label。\(f\)是一个带有参数的函数，称为local transition function，被所有的节点共享，能根据输入的邻居来更新节点状态。\(g\)是local output function，表示如何产生output。所以： 把所有状态、输出、特征、所有节点的特征stack到一起，就有了向量\(X\)、\(O\)、\(X\)和\(X_N\)。所以有： 有向图。如图中的ADGPM【Rethinking knowledge graph propagation for zero-shot learning】，有两种权重矩阵\(W_p\)和\(W_c\) 其中的\(D^{-1}_pA_p\)和\(D^{-1}_cA_c\)分别是parent和children的normalized adjacency matrix。 信息传递函数主要包括信息收集（agggregation）和节点信息更新（update）两个部分，公式见： 譬如GraphSAGE从附近的邻居收集信息，并且能够应用于inductive learning领域；FastGCN使用了importance sampling的方法，使用采样替代使用节点所有的邻居信息，加快了训练过程。'
