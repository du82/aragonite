full_description = "Knime是一款出色的工具，可让你无需编写任何代码即可完成端到端的数据科学工作流程。 它甚至配备了一个拖放式界面，UI清晰，操作简单直观，可以说是懒人福音了。 操作起来非常简单，首先使用该工具进行数据收集和转换；完成后，你可以创建一个模型并将其可视化。在生产方面，你可以部署和管理数据科学项目。 Uber Ludwig是另一款适合初学者的优秀工具。有了它，你可以快速测试和训练深度学习模型。用户可以选择启用懒人模式（拖拽界面），或者直接操作代码。 使用起来比Knime稍微复杂一点点。需要先加载CSV文件来训练数据。通过使用预先训练的模型，你可以预测输出目标。最后，你可以使用可用的可视化选项可视化你的数据。 MLFlow的另一个惊人功能是它与库无关。这意味着你可以将其与其他机器学习库一起使用而不会出现任何兼容性问题。为了实现library-agonistic行为，它使用REST API和CLI。 机器学习笔记：https://createmomo.github.io/2018/01/23/Super-Machine-Learning-Revision-Notes/#tableofcontents 工业级ml应用的templates：http://predictionio.apache.org/，对应的代码https://github.com/apache/predictionio，例如推荐系统示例：http://predictionio.apache.org/templates/recommendation/quickstart/ 自动上色，不过因为资金不足。。主网站关了。。https://github.com/lllyasviel/style2paints 小结：Yoshua Bengio压轴解读深度学习的基础和挑战；Andrej Karpathy 最新演讲计算机视觉深度学习技术与趋势；"
