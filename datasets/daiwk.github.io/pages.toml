["https://daiwk.github.io/posts/nlp-first-glance.html"]
title = "自然语言处理基本常识 - daiwk-github博客"
description = "自然语言处理基本常识 - daiwk-github博客 - 作者:daiwk"
full_description = '英国数学家图灵在1950年，提出了判断计算机是否可以被认为“能思考”的标准（图灵测试，Turing test）：如果一个计算机系统的表现(act)、反应(react)和相互作用(interact)都和有意识的个体一样，那么，这个计算机系统就应该被认为是有意识的。 歧义消解(disambiguation)：例如，如何划分分词边界。 歧义结构分析结果的数量是随介词短语的数目的增加而呈现指数上升的。歧义结构的组合数称为开塔兰数(Catalan numbers, 记作\(C_{n}\))，即，如果句子中存在这样\(n\)个介词短语，那么： \[C_n = C^{n}_{2n} \dfrac{1}{n+1}\] 未知语言现象：对于一个特定系统来说，总是有可能遇到未知词汇、未知结构等意外情况，而同时，每一种语言又随着社会的发展而动态变化着，新的词汇（新的人名、地名、组织机构名和专用词汇）、新的词义、新的词汇用法（新词类），甚至新的句子结构都在不断地出现，尤其在口语对话或者计算机网络对话中，稀奇古怪的词汇和话语结构更是司空见惯。因此，鲁棒性(robustness)很重要。'
