full_description = "联邦学习能不用把数据从mobile传到cloud就可以训模型，也就是说mobile不仅可以做prediction，还可以搞训练。 大致流程如下，首先一个手机把当前模型下载下来，然后使用本机的数据进行更新，并把这些变化summarize成a small focused update。只有这个update会通过加密上传到cloud，然后这个用户的update会和其他用户的update一起进行平均，拿来更新shared model。所有的训练数据都存在设备上，不会把个人的update存到cloud去。 这种方式也有一个immediate benefit，那就是，在给shared model提供update之外，本地的improved model也可以立即在本地生效。 传统的机器学习系统，在cloud中通过partition分布在异构server上的大数据集上，使用sgd等优化算法。这种高度iterative的算法，要求与训练数据有低延迟、高吞吐的连接。而在federal learning的场景下，明显是更高的延迟、更低的吞吐，而且拿来训练的时候是intermittently（断断续续的）。 因此有了Federated Averaging algorithm\u001C，也就是Communication-Efficient Learning of Deep Networks from Decentralized Data，能够使用比naively federated version的sgd少10-100倍的连接来训练深度网络。核心思想是使用手机上更强大的处理器，计算比普通的gradient steps更higher quality的update。这样，因为用了high quality的update，所以通过更少的迭代就可以得到一个好的模型了，所以需要的连接也更少了。 因为上传速度往往比下载速度慢得多(可以参考https://www.speedtest.net/reports/united-states/)，可以采用random rotation和quantization来得到压缩后的updates，能够降低100倍的上传耗时，参考Federated Learning: Strategies for Improving Communication Efficiency。 而对于高维稀疏的\b凸模型，例如ctr预估问题，可以参考Federated Optimization: Distributed Machine Learning for On-Device Intelligence。"
year_published = 2025
clearnet = "https://daiwk.github.io/posts/dl-federated-learning.html"
