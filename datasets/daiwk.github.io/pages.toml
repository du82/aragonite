["https://daiwk.github.io/posts/ml-traditional-ml.html"]
title = "传统机器学习算法 - daiwk-github博客"
description = "传统机器学习算法 - daiwk-github博客 - 作者:daiwk"
full_description = '分布式的EM，以PLSI为例，看google www07发的那篇讲google news的推荐算法的：Google News Personalization: Scalable Online Collaborative Filtering 对于\(T\)个训练样本来讲，新闻是\(s\)，用户是\(u\)，引入一个中间隐变量\(z\)，就有两个条件概率(CPD, conditional probability distribution)\(p(z|u)\)和\(p(s|z)\)，(也就是从u到z再到s)然后就是要最大化条件似然的乘积，也就是要最小化负的经验log风险： \[ q^*(z;u,s;\hat{\theta}):=p(z|u,s;\hat{\theta})=\frac{\hat{p}(s|z)\hat{p}(z|u)}{\sum_{z\in Z}\hat{p}(s|z)\hat{p}(z|u)} \] \[ \begin{matrix} p(s|z) &= \frac{\sum_uq^*(z;u,s;\hat{\theta})}{\sum_s\sum_uq^*(z;u,s;\hat{\theta})}\\ p(z|u) &= \frac{\sum_sq^*(z;u,s;\hat{\theta})}{\sum_z\sum_sq^*(z;u,s;\hat{\theta})} \end{matrix} \] 假设M=N=1kw，L=1000,也就是1kw个user，1kw个item，然后有1000个隐变量，那么需要存\((M+N)\times L\times 4=80GB\)的内存来存储两个CPD(假设double占4字节)。单机是不行的，搞成分布式的。。 \[ \begin{matrix} N(z,s)=\sum_uq^*(z;u,s;\hat{\theta})\\ N(z)=\sum_s\sum_u^*(z;u,s;\hat{\theta}) \end{matrix} \] \[ q^*(z;u,s;\hat{\theta}):=p(z|u,s;\hat{\theta})=\frac{\frac{N(z,s)}{N(z)}\hat{p}(z|u)}{\sum_{z\in Z}\frac{N(z,s)}{N(z)}\hat{p}(z|u)} \] 对于每个给定的(u,s)的pair对，计算 \(q^*(z;u,s;\hat{\theta}):=p(z|u,s;\hat{\theta})\)时，需要之前多轮迭代的信息：\(\hat{p}(z|u)\)、\(N(z,s)\)和\(N(z)\)。当统计信息足够多时，对于一个(u,s)对，计算\(q^*\)是可以独立且并行的。 我们看一个\(R\times K\)的shard。假设所有用户被hash到\(R\)个group里，所有news被hash到\(K\)个group里。也就是说\((u_1,s_1)\)这个pair对，按下图就是被分到了\(C_{R3}\)这个shard里去了。然后在一个shard中，只要存储这个shard里的所有(u,s)的pair对的点展信息就行了，来计算里面的CPD。所以一个shard需要存的CPD就只有1/R的用户的CPD和1/K的news的CPD。'
