["https://daiwk.github.io/posts/dl-optimization-methods.html"]
title = "梯度下降优化算法 - daiwk-github博客"
description = "梯度下降优化算法 - daiwk-github博客 - 作者:daiwk"
full_description = '如果在峡谷地区(某些方向较另一些方向上陡峭得多，常见于局部极值点)，SGD会在这些地方附近振荡，从而导致收敛速度慢。这种情况下，动量(Momentum)便可以解决。动量在参数更新项中加上一次更新量(即动量项)。 \[ \begin{aligned} v_{t} &=\gamma v_{t-1}+\eta \nabla_{\theta} J(\theta) \\ \theta &=\theta-v_{t} \end{aligned} \] 其中，\(\eta\)一开始初始化为0.5，后面变成0.9。一般直接设成0.9好了。。http://ufldl.stanford.edu/tutorial/supervised/OptimizationStochasticGradientDescent/ 简单地说，就是记录每次的权重更新量，这次的更新量就是上次更新量乘上一个系数，再加上学习率乘以梯度。 \[ \begin{aligned} v_{t} &=\gamma v_{t-1}+\eta \nabla_{\theta} J\left(\theta-\gamma v_{t-1}\right) \\ \theta &=\theta-v_{t} \end{aligned} \] momentum首先计算一个梯度(短的蓝色向量)，然后在加速更新梯度的方向进行一个大的跳跃(长的蓝色向量)，nesterov项首先在之前加速的梯度方向进行一个大的跳跃(棕色向量)，计算梯度然后进行校正(绿色梯向量) 其中，\(G_{t} \in \mathbb{R}^{d \times d}\)是一个对角矩阵，每个对角线位置\(i,i\)为对应参数\(\theta_i\)从第1轮到第t轮梯度的平方和。 也就是学习率除以前t轮的梯度的平方和加上一个\(\epsilon\)再开根号。这个\(\epsilon\)一般设置成\(1 e-8\)。 \[ \begin{array}{l}{\Delta \theta_{t}=-\eta \cdot g_{t, i}} \\ {\theta_{t+1}=\theta_{t}+\Delta \theta_{t}}\end{array} \] 其实就是RMS(root mean square)，也就是\(R M S[g]_{t}=\sqrt{E\left[g^{2}\right]_{t}+\epsilon}\)，代入上式可以得到： \[ E\left[\Delta \theta^{2}\right]_{t}=\gamma E\left[\Delta \theta^{2}\right]_{t-1}+(1-\gamma) \Delta \theta_{t}^{2} \] 而\(R M S[\Delta \theta]_{t}\)是未知的，可以用直到上一个时间步的参数更新的RMS来近似。所以可以拿\(R M S[\Delta \theta]_{t-1}\)来替换学习率\(\eta\)，从而得到：'
