title = "openai gpt - daiwk-github博客"
description = "openai gpt - daiwk-github博客 - 作者:daiwk"
full_description = "openai的gpt(generative pre-training)：Improving language understanding with unsupervised learning。。改名字了『Improving Language Understanding by Generative Pre-Training』 该方法主要结合了两个已存的研究，即 Transformer 和无监督预训练。实验结果提供了非常令人信服的证据，其表明联合监督学习方法和无监督预训练能够得到非常好的性能。 研究者开发的这种方式借鉴了他们关于 Sentiment Neuron，即https://blog.openai.com/unsupervised-sentiment-neuron/方面的研究成果，他们发现无监督学习技术在足够多的数据集上训练能产生令人惊讶的可区分特征。 这一项研究任务建立在Semi-supervised Sequence Learning论文中所提出的方法，该方法展示了如何通过无监督预训练的 LSTM 与有监督的精调提升文本分类性能。这一项研究还扩展了论文Universal Language Model Fine-tuning for Text Classification所提出的 ULMFiT 方法，它展示了单个与数据集无关的 LSTM 语言模型如何进行精调以在各种文本分类数据集上获得当前最优的性能。 OpenAI 的研究工作展示了如何使用基于 Transformer 的模型，并在精调后能适应于除文本分类外其它更多的任务，例如常识推理、语义相似性和阅读理解。 该方法与 ELMo 相似但更加通用，ELMo 同样也结合了预训练，但需要使用为任务定制的架构以在各种任务中取得当前顶尖的性能。 OpenAI 只需要很少的调整就能实现最后的结果。所有数据集都使用单一的前向语言模型，且不使用任何集成方法，超参配置也与大多数研究成果相同。 完全图解GPT-2：看完这篇就够了（一） 完全图解GPT-2：看完这篇就够了（二）"
