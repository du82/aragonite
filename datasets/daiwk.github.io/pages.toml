["https://daiwk.github.io/posts/knowledge-tf-usage.html"]
title = "tf常用函数 - daiwk-github博客"
description = "tf常用函数 - daiwk-github博客 - 作者:daiwk"
full_description = '实践参考https://daiwk.github.io/posts/ml-feature-engineering.html#6-tf%E7%9A%84%E7%89%B9%E5%BE%81%E5%B7%A5%E7%A8%8B 分类的demo：https://github.com/daiwk/grace_t/blob/master/python/grace_t/basic_demos/custom_estimator_classifier.py 回归的demo：https://github.com/daiwk/grace_t/blob/master/python/grace_t/basic_demos/custom_estimator_regressor.py 如果想要estimator把一个东西输出到tensorboard中，只要自己定义一个scalar就行了(参考https://stackoverflow.com/questions/50264302/trying-to-log-accuracy-of-cnn-tensorflow-on-tensorboard)： 从截断的正态分布中输出随机值。 生成的值服从具有指定平均值和标准偏差的正态分布，如果生成的值大于平均值2个标准偏差的值则丢弃重新选择。 在tf.truncated_normal中如果x的取值在区间（μ-2σ，μ+2σ）之外则重新进行选择。这样保证了生成的值都在均值附近。 tf.reduce_mean: computes the mean of elements across dimensions of a tensor. Use this to sum the losses over all the examples to get the overall cost. You can check the full documentation here. tf.nn.softmax_cross_entropy_with_logits(logits = Z3, labels = Y): computes the softmax entropy loss. This function both computes the softmax activation function as well as the resulting loss. You can check the full documentation here. \[ \begin{aligned} P(k)&=\frac{1}{log(range\_max+1)}log(\frac{k+2}{k+1}) \\ &= \frac{1}{log(range\_max+1)}log(1+\frac{1}{k+1}) \\ \end{aligned} \] k越大，被采样到的概率越小。而我们的词典中，可以发现词频高的index小，所以高词频的词会被优先采样为负样本。 tf.nn.relu(Z1): computes the elementwise ReLU of Z1 (which can be any shape). You can read the full documentation here. partition号是p = id % len(params)。所以如果有5个id，要分成3个partition，那么结果就是[[0, 3], [1, 4], [2]]。所以这个时候，输入的params的shape就是[(2, emb_size), (2, emb_size), (1, emb_size)]。 所以如果有5个id，要分成3个partition，那么结果就是[[0, 1], [2, 3], [4]]。所以这个时候，输入的params的shape就是[(2, emb_size), (2, emb_size), (1, emb_size)]。'
