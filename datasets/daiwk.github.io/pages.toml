["https://daiwk.github.io/posts/ml-topknn.html"]
title = "海量数据相似数据查找方法 - daiwk-github博客"
description = "海量数据相似数据查找方法 - daiwk-github博客 - 作者:daiwk"
full_description = "例如，推荐系统中item-user矩阵。如果你有item数量是百万级别，user是千万级别，这个矩阵是十分稀疏的。你如何计算每一个item的Top N相似item呢？ 同样海量文本场景，文本集合可以看成doc-word 稀疏矩阵，如何求解每个文档的Top N相似文档？ 问题：虽然时间复杂度可以减小，但高频词可能导致倒排的拉链长度太长，导致效率下降。 定义一个函数h：计算集合S最小的minhash值，就是在这种顺序下最先出现1的元素。那么， 类似地，如果进行n次重排的话，就会有n个minhash函数，{h1(S), h2(S)…, hn(S)}, 那原来每个高维集合，就会被降到n维空间，比如S1->{h1(S1), h2(S1)…, hn(S1)}。 但是实际中因为重排比较耗时，会用若干随机哈希函数替代。比如设定一个哈希函数: h(x) = (i+1) % 5. 以{a, b, c, d, e}顺序，“i”表示各个索引，比如a的“i”值为1， b的“i”值为2等。 同样可以定义n个哈希函数【不需要重排，每个hash计算对应的值就行】，进行上述操作，那每个集合S就被降维到n维空间的签名。 minhash解决了文章一开始提到的第二个问题，高维向量间计算复杂度问题(通过minhash 机制把高维降低到n维低纬空间) LSH 就是这样的机制，通过哈希机制，让相似向量尽可能出现一个桶中，而不相似的向量出现在不同的桶中。相似度计算只在么个桶中进行，每个桶彼此之间不做相似度计算。 拿band1来说，第二列和第四列向量是一样的(第二列是（0, 2, 1）, 第四列是（0, 2, 1）)，一定会哈希到相同的桶中（band1名下的桶），而第一列和第二列有可能不会在一个桶中（band1名下的桶）。 这里就是重点设置分多少个组，每组多少个元素问题。这个可以根据实际情况和一些经验case来定。 1）如果d(x,y) ≤ d1， 则h(x) = h(y)的概率 ≥ p1【距离近的，在同一个桶概率大】； 2）如果d(x,y) ≥ d2， 则h(x) = h(y)的概率 ≤ p2【距离远的，在同一个桶概率小】；"
year_published = 2017
