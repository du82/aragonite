["https://daiwk.github.io/posts/ml-occf.html"]
title = "occf - daiwk-github博客"
description = "occf - daiwk-github博客 - 作者:daiwk"
full_description = "在很多推荐系统中，并不像netflix是可以拿到用户的评分数据（例如，1-5分）的，像新闻推荐、书签推荐等，训练数据往往只有是否点击/是否收藏这种0/1的数据。而且，这些数据特别稀疏（正例很少），而且非正例也不一定是负例（一篇文章没点击，可能是确实不感兴趣，也可能是感兴趣但之前系统没有给他推荐过[unlabeled positive]）。之前的文章多将这种one-class problem看成一个分类问题，本文从cf的角度，提出了weighted low-rank approximation和negative example sampling两种framework来解决occf。"
