["https://daiwk.github.io/posts/dl-capsules.html"]
title = "capsule - daiwk-github博客"
description = "capsule - daiwk-github博客 - 作者:daiwk"
full_description = '本文主要参考jhui的博客： https://jhui.github.io/2017/11/03/Dynamic-Routing-Between-Capsules/ 神经元的激活水平通常被解释为检测特定特征的可能性【例如，如果图中蓝色的比例很高，可能某个神经元的激活值就特别大】。 CNN善于检测特征，却在探索特征（视角，大小，方位）之间的空间关系方面效果较差。(一个简单的CNN模型可以正确提取鼻子、眼睛和嘴巴的特征，但如果一张图里，鼻子和眼睛错位了，或者一只眼睛倾斜了一定的角度，那这张图仍然有可能错误地激活神经元导致认为这张图就是人脸) 假设每个神经元都包含特征的可能性和属性【这里就叫做胶囊(capsule)了，也就是说，里面包含的不是一个值(a single scaler value)，而是一个向量(vector)】。例如，神经元输出的是一个包含[可能性，方向，大小]的向量。利用这种空间信息，就可以检测鼻子、眼睛和耳朵特征之间的方向和大小的一致性。此时，上面那张图对于人脸检测的激活输出就会低很多。 为了CNN能够处理不同的视角或变体，我们添加了更多的神经元和层。尽管如此，这种方法倾向于记忆数据集，而不是得出一个比较通用的解决方案，它需要大量的训练数据来覆盖不同的变体，并避免过拟合。MNIST数据集包含55,000个训练数据，也即每个数字都有5,500个样本。但是，儿童看过几次就能记住数字。现有的包括CNN在内的深度学习模式在利用数据方面效率十分低下。 胶囊网络不是训练来捕捉特定变体的特征，而是捕捉特征及其变体的可能性。所以胶囊的目的不仅在于检测特征，还在于训练模型来学习变体。 第一行表示神经元检测到数字“7”的概率。2-D胶囊是组合了2个神经元的网络。这个胶囊在检测数字“7”时输出2-D向量。 第二行中的第一个图像，它输出一个向量\(v = (0, 0.9)\)，向量的模是\(\| v \| = \sqrt{ 0^2 + 0.9^2 } = 0.9\)。'
