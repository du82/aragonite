["https://daiwk.github.io/posts/ml-basics.html"]
title = "机器学习common - daiwk-github博客"
description = "机器学习common - daiwk-github博客 - 作者:daiwk"
full_description = '根据一些 feature 进行分类，每个节点提一个问题，通过判断，将数据分为两类，再继续提问。这些问题是根据已有数据学习出来的，再投入新数据的时候，就可以根据这棵树上的问题，将数据划分到合适的叶子上。 这 M 个子集得到 M 个决策树。将新数据投入到这 M 个树中，得到 M 个分类结果，计数看预测成哪一类的数目最多，就将此类别作为最后的预测结果 当预测目标是概率这样的，值域需要满足大于等于0，小于等于1的，这个时候单纯的线性模型是做不到的，因为在定义域不在某个范围之内时，值域也超出了规定区间。 那么怎么得到这样的模型呢？这个模型需要满足两个条件 大于等于0，小于等于1 \[ \frac{exp(x)}{exp(x)+1}=\frac{exp(-x)exp(x)}{exp(-x)exp(x)+exp(-x)}=\frac{1}{1+exp(-x)}=sigmoid(x) \] 要将两类分开，想要得到一个超平面，最优的超平面是到两类的 margin 达到最大(即，这个分界面很有区分性，它附近很少有容易被判错的点)，margin就是超平面与离它最近一点的距离，如下图，Z2>Z1，所以绿色的超平面(hyperplane)比较好 将这个超平面表示成一个线性方程，在线上方的一类，都大于等于1，另一类小于等于－1 所以得到 total margin 的表达式如下，目标是最大化这个 margin，就需要最小化分母（就是x的系数w），于是变成了一个优化问题 举个栗子，三个点，找到最优的超平面，定义了 weight vector＝（2，3）－（1，1） 得到 weight vector 为（a，2a），将两个点代入方程，代入（2，3）令其值＝1【因为class1的标签是1】，代入（1，1）令其值＝-1【因为class2的标签是-1】，求解出 a 和 截矩 w0 的值，进而得到超平面的表达式。 原始问题是：给你一句话，它属于哪一类。通过 bayes rules 变成一个比较简单容易求得的问题 问题变成，这一类中这句话出现的概率是多少（given 标签，算出现这个单词、句子的概率），当然，别忘了公式里的另外两个概率'
