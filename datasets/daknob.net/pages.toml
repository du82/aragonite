["https://daknob.net/the-callback"]
title = "Irresponsible Disclosure"
full_description = '''When deploying access networks, current best practices require IPv6 and IPv4 access to be available for all devices. In this post we'll see how we can do this efficiently when using a VyOS router, with an IPv6-first mind. In this post we explore the need for IPv4 in access networks and the current state of affairs for IPv6-mostly or IPv6-only networks. We go over all of the relevant technologies, such as NAT64, DNS64, PREF64, 464XLAT, SIIT, and the IPv6-Only Preferred DHCP Option. It's a mostly complete picture of the current IPv6 transition mechanism landscape. Wiring fiber optic networks in buildings is certainly the future, and probably the present too. Follow a large deployment of a fiber optic network at my home to learn more about the technology, cabling, measuring, and design. When issuing certificates for TLS, you have the option of getting one with all of your domain names included, or one individual per domain. Which is better, and when? There is a very large number of Internext Exchange Points around the world, and a lot of networks are connected to at least one. But what happens when you forget to turn off Layer 2 protocols on the Peering LAN? On my journey to build a self-hosted Zero Trust environment I had to create TP: a secure proxy that takes care of a lot of the end user connectivity to my "Cloud". Data breaches happen, and there is need for cleanup after such an incident. But perhaps quickly going to password resets or calls to enable 2FA are not the best advice that should be followed blindly. MikroTik, with RouterOS 7, added the ability to offload IP Traffic to the hardware, and bypass the low performance CPUs of their products. As this feature is still developed, I put it to the test, using their cheapest device. Although not by design, ACME is mostly used today to issue TLS Server certificates, for use in the WebPKI. But it's a flexible protocol. An extra field here, a new challenge there. Let's see how far we can push it... The ACME protocol can be used to obtain TLS certificates, and the most common usecase is definitely the WebPKI. However, it can be used for any type of certificate, including mTLS certs in a private PKI. In this post I am providing information on my design for use of ACME for workload certificates.'''
year_published = 2025
clearnet = "https://daknob.net/the-callback"
