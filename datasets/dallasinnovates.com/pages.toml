["https://dallasinnovates.com/egg-beater-solution-for-deep-ocean-wind-turbines-utd-team-advances-new-design-with-nearly-8m-from-doe"]
title = "'Egg Beater' Solution for Deep-Ocean Wind Turbines: UTD Team Advances New Design With Nearly $8M From DOE » Dallas Innovates"
description = 'Ultimately, the offshore turbine designed by UTD Professor Dr. Todd Griffith could reached the stunning height of 900 feet—as tall as a 72-story skyscraper—generating electricity from winds over the deep ocean "miles from the coast and out of view from land."'
full_description = "Massive, long-bladed wind turbines are anchored to the shallow sea floor of countries around the world, especially in Northern Europe and China. The U.S. has been slower to adopt the technology due to costs, local opposition, and regulatory/supply chain hurdles. But a different solution could move wind farms further out into the sea, changing the game entirely. And a team of UT Dallas researchers is hot on the trail. One big difference: Their proposed turbine looks more like an egg beater than a traditional windmill. “Our turbine is designed to make offshore wind power safe, efficient and affordable,” says UTD Professor Dr. Todd Griffith, whose lab contains a 6-foot-tall, small-scale prototype of what could eventually become a 900-foot-tall upside egg beater floating far above the deep ocean floor. If successful, the technology could capture “untapped potential energy” from wind blowing across deep ocean water, the university said. Griffith and his team of UTD engineers recently put the prototype through extensive testing to show that it works. The next big test? Scaling it up as high as 500 feet tall to prove it works in a real-world situation. Ultimately, the offshore turbine could reached the stunning height of 900 feet—as tall as a 72-story skyscraper—generating electricity from winds over the deep ocean “miles from the coast and out of view from land,” UTD said. UTD researchers tested their prototype at the University of Maine, which has a facility that can simulate wind and wave conditions.[Photo: UTD] It’s not surprising that this research is happening in North Texas. The Lone Star State leads the nation in wind energy, with 19,000 wind turbines spinning away as of September 2024, according to the U.S. Wind Turbine Database. Griffith calls his team’s work “important” for enabling energy independence and reliability for Texas, which has made it a priority to increase the capacity of the electricity grid. “In the U.S., we have a major opportunity to develop offshore wind energy systems that can enhance energy capacity to the power grid in coastal areas,” Griffith said in a statement. “To access wind energy in deep ocean water, however, we need a different solution. Our turbine is designed to make offshore wind power safe, efficient and affordable.”"
author = "Dallas Innovates"
year_published = 2025
year_updated = 2025
