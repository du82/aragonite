["https://dallasinnovates.com/accenture-appoints-longtime-executive-as-dallas-office-managing-director"]
title = "Accenture Appoints Longtime Executive as Dallas Office Managing Director » Dallas Innovates"
description = "Mike Noel takes over the role from Jorge Corral, who led Accenture in North Texas for nearly 10 years. Corral will continue his ongoing role leading Data and AI for Accenture’s Resources Industry group."
full_description = "Global professional services company Accenture has appointed veteran executive Mike Noel as the new office managing director for its North Texas office in Dallas. Noel takes over that role from Jorge Corral, who led Accenture in North Texas for nearly 10 years. Corral will continue his ongoing role leading Data and AI for Accenture’s Resources Industry group, helping companies transform their businesses for innovation, the company said. “I’m blessed to serve as office managing director for Accenture here in Dallas, expanding on the phenomenal work Jorge Corral has done, further strengthening the support of our clients and community partners,” Noel said in a statement. “Jorge’s impact on our people and our relationships in North Texas with important organizations such as The United Way of Metropolitan Dallas and the Dallas Regional Chamber has enriched the lives of so many people in our North Texas community.” “Accenture’s focus will always be our people, our clients, and our community, and I am excited to expand our impact in these areas,” Noel added, noting that community is a key focus. “Accenture is committed to bringing the best of our global capabilities to help North Texas companies continue innovating and driving our region’s growth and prosperity.” In his new role, Noel will focus on elevating Accenture’s local presence and impact, nurturing client relationships and enhancing community engagement. “Accenture’s success is based upon the success of our community,” Noel said. “And for our region’s success, it’s our responsibility to not only be involved, but also to focus on the future of North Texas, doing as much as we can to help this area and the generations to come.” Accenture said Noel brings deep experience and expertise with a proven track record of leadership within the company to his new role. Noel began his career with a small consulting company before joining Accenture in 2007. The company said that as his career has progressed, he has assisted clients across a variety of industries with reinventing and refining for growth and success. He is a senior client account executive for several global consumer goods, retail, and financial clients responsible for managing the overall relationship."
