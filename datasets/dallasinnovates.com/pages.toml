title = "DEC Network Celebrates Innovation at 10th Annual State of Entrepreneurship, Honors DFW Founders, Companies » Dallas Innovates"
description = "From startup evangelists to visionary leaders, community-voted awards recognize excellence across the North Texas ecosystem."
full_description = "Dan Sinawat, CEO of VC ARENA and founder of AI CONNEX, captures a celebratory moment with Evelyn Solorzano, small business community officer at Bank of America, during The DEC Network's 10th Annual State of Entrepreneurship Awards. [Photo: The DEC Network] The DEC Network marked a major milestone at its 10th Annual State of Entrepreneurship event on February 13 at Vouv in Addison, bringing together North Texas’ entrepreneurial community in a high-energy celebration of a decade of innovation and resilience across the region. MC’d by Jeremiah Anderson, director of innovation at the Frisco Economic Development Corporation, the night highlighted ecosystem achievements while officially kicking off DFW Startup Week, to be held Monday, Aug. 3 through Friday, Aug. 7. “Each year, we gather to reflect on the incredible progress, innovation, and resilience within our entrepreneurial ecosystem. Tonight, as we mark a decade of SOE, we not only celebrate the achievements of the past year but also the unwavering spirit that drives North Texas forward,” Anderson told the audience of entrepreneurs, corporate partners, investors, and community leaders. Attendees gather for The DEC Network’s 10th Annual State of Entrepreneurship event at Vouv in Addison on Feb. 13. The ceremony kicked off DFW Startup Week and celebrated North Texas’ entrepreneurial ecosystem with Jeremiah Anderson of Frisco EDC serving as MC. [Photo: The DEC Network] The significance of reaching the 10-year milestone was emphasized throughout the evening, with Anderson noting, “As we celebrate ten years of SOE, we also celebrate the resilience, creativity, and boldness that define this community. Let’s make it count!” Anderson highlighted the region’s growing significance as an innovation hub, adding that that “Frisco is a fast-growing innovation community with more than 400 startups and 13 corporate innovation hubs. Frisco has seen great success during the past four years with exits for more than 35 startups and nearly 100 new investments in Frisco startups.”"
