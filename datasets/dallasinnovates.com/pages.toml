["https://dallasinnovates.com/earthx-announces-earthx2025-a-global-conference-in-dallas-on-sustainability-green-finance-and-conservation"]
title = "EarthX Announces Earthx2025: A Global Conference in Dallas on Sustainability, Green Finance, and Conservation » Dallas Innovates"
description = '''EarthX Founder Trammell S. Crow said this year's five-day conference will be the organization's largest ever, "bringing together leaders, advocates, and innovators from around the world to work together on tangible solutions for our planet."'''
full_description = "A scene from Earthx2024. Earthx2025 will host five keynote banquets across a five-day event in Dallas. [Photo: EarthX] Earthx2025—a five-day forum bringing together the world’s foremost leaders in business, investment, innovation, philanthropy, academia, government, public policy, and environmental advocacy—will take place April 21-25 at the Hilton Anatole Hotel in Dallas. “Over the past decade, EarthX has convened a diverse group of leaders across industries and political perspectives to focus on pragmatic solutions to environmental and sustainability challenges,” EarthX Founder Trammell S. Crow said in a statement. “This year’s conference will be our largest ever, bringing together leaders, advocates, and innovators from around the world to work together on tangible solutions for our planet.” EarthX 2025 is ranked as one of the top 3 sustainability events in the nation, according to Sustainability Magazine, covering the full spectrum of industries, policies, and initiatives shaping the future of our planet. Organizers said the event fosters dialogue and collaboration across all perspectives, inspiring tangible action in sustainability, finance, environmental advocacy, and conservation. EarthX2025 seeks to shift public sentiment and policies around environmental action and investment, and it offers an opportunity for attendees to engage with some of the most influential figures shaping the strategies to protect the planet’s future within a unique immersive and interactive forum. In addition to conference programming, Earthx2025 offers curated networking opportunities, exclusive receptions, banquets, and after-parties, ensuring “an unparalleled experience” for environmental leaders, policymakers, entrepreneurs, and investors alike. The Earthx2025 “Congress of Conferences” will feature main stage conferences focused on the future of energy, the circular economy, new conservation strategies, and ocean health and the blue economy. Earthx2025 again will feature the E-Capital Summit that connects investors and innovators in sustainable business, and the Family Office Summit, which builds connections and community among high-net worth individuals motivated to invest in the future of the planet."
