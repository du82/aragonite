title = "About » Dallas Innovates"
description = "Dallas Innovates: The source for what's new + next in Dallas-Fort Worth innovation from startup to enterprise, creative to social, education to enterprise."
full_description = "Dallas Innovates is the tip of the spear for innovation news in Dallas-Fort Worth. It’s a next-gen lens on North Texas business news focused on disruption, growth, and the future. We cover upstarts, game changers, and leaders shaping the future of business in North Texas. Our readers are growth-driven executives, entrepreneurs, investors, change agents, and other doers hungry for an edge. Dallas Innovates connects the dots between innovation and the bottom line through news, features, and commentary online, in print, and our free daily newsletter. Dallas Innovates spotlights the innovations, influencers, and ideas making Dallas-Fort Worth a place of the future. Our independent editorial team aims to arm decision-makers and entrepreneurs with a competitive edge through our daily news and features. The news platform launched in 2016 at D Magazine Partners in collaboration with the Dallas Regional Chamber, spinning off in 2021 as a media brand published by Dallas Next. The company, helmed by Dallas Innovates co-founder Quincy Preston, is built around an award-winning team of experienced journalists, creatives, and media veterans. DALLAS INNOVATES Published by Dallas Next Founder and Editor Quincy Preston Editorial Director David Seeley Executive Editor Glenn Hunter Projects Editor Maddie Preston Contributing Editor Sandra Engelland Contributing Editor Lance Murray Contributing Editor John Branch Editor at Large David Kirkpatrick Contributing Writer Leslie Barker — Creative Director Michael Samples Media Maverick Jewels Clark — Director of Media Operations Kevin Fitch Publisher DALLAS® Publications/Dallas Next Steve Reeves Publisher Dallas Innovates Tanya Sasser Rutledge Sign up here to get the daily newsletter. It’s free—and we offer occasional perks to our “Dallas Innovators.” Dallas Innovates’ once-a-year magazine covers game changers, disruptors, creatives, and the new frontiers of technology in Dallas-Fort Worth. The collective strength of the innovation ecosystem and intellectual capital in Dallas-Fort Worth is a force to be reckoned with. To learn more about the upcoming special issue, connect with CEO and Editor Quincy Preston. To advertise, reach out to Group Publisher Kyle Moss."
