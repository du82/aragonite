["https://dallasinnovates.com/breakthrough-technology-in-post-traumatic-stress-disorder-9999"]
title = "This UT Dallas Tech Breakthrough Could Help Veterans Overcome PTSD » Dallas Innovates"
description = "Researchers at the Texas Biomedical Device Center—or TxBDC—discovered a way to retrain the brain’s fear response using a tiny device—offering real hope to those suffering from trauma and military service-related Post-Traumatic Stress Disorder."
full_description = "Brain plasticity, or neuroplasticity, is the brain’s remarkable ability to change, adapt, and reorganize throughout our lives as we grow and learn. However, in Post-Traumatic Stress Disorder (PTSD), learning results in the memories and sensory information surrounding a traumatic event permanently connecting to the emotional part of the brain that drives fear and anxiety, known as the fight-or-flight response. PTSD is the result of enhanced learning during a traumatic event. During trauma, chemicals known as neuromodulators are released in the brain that can dramatically enhance learning. In PTSD, this learning is so strong that normal sounds, sights, and smells that were occurring during the trauma now trigger the emotional brain, resulting in a fight or flight response. The fight or flight response can be debilitating in severe PTSD, resulting in people disconnecting from the world to avoid triggering the response. Think of your worst fear and the feelings that elicits. In PTSD, these feelings are even more severe and occur in everyday life as triggers, including smell or sound, remind an individual of their trauma—for example, for someone involved in a past accident, the smell of a diesel truck results in an uncontrollable fear of being hurt. Every time you drive — a seemingly normal activity — there is a chance you will experience that fear. It seems like if PTSD is a learned response, it should be possible to unlearn this response. However, many people are treatment-resistant, and PTSD treatments fail. But hope is on the horizon. The Texas Biomedical Device Center team at The University of Texas at Dallas is working on innovative Targeted Plasticity Therapy (TPT) for treatment-resistant PTSD. This therapy involves implanting a minuscule device that stimulates the vagus nerve. This stimulation releases neuromodulators, which are chemicals that help the brain learn. The goal is to use these neuromodulators to re-learn the traumatic memories that trigger the fight or flight response, teaching the brain that these memories are no longer a threat. Essentially, this process helps to separate the sensory and memory centers of the brain from the emotional parts responsible for PTSD."
author = "Dallas Innovates"
year_published = 2025
year_updated = 2025
