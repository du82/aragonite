["https://dallasinnovates.com/as-it-works-to-electrify-regional-fleet-surf-air-mobility-relocates-air-operations-center-to-north-texas"]
title = "As It Works to Electrify Regional Fleet, Surf Air Mobility Relocates Air Operations Center to North Texas » Dallas Innovates"
description = "L.A.-based Surf Air is now operating out of Addison Airport. The regional air carrier is currently developing an AI-powered airline software operating system and is working toward certification of electric powertrain technology."
full_description = "L.A.-based Surf Air has relocated its air operations center to Addison Airport, north of Dallas. [Photo: Surf Air Mobility] Los Angeles-based regional air mobility company Surf Air Mobility has relocated its air operations center to Addison Airport in North Texas. The move is part of Surf Air’s broader transformation plan that consolidates operations departments and puts the regional carrier at the heart of one of the nation’s top aviation hubs. “Our decision to move our air operations center to Dallas reflects our commitment to excellence in the aviation industry and is another achievement within our transformation plan,” CEO and COO Deanna White said in a statement. “Dallas offers a thriving aviation environment, and we’re confident that centralizing our operations will further streamline our business and continue to lead the regional air mobility industry forward.” Illustrative graphic of Surf Air’s hybrid electric powertrain, now in development. [Image: Surf Air Mobility] Surf Air is one of the largest commuter airlines in the U.S. by scheduled departures as well as the largest passenger operator of Cessna Caravans in the nation. In addition to its airline operations, Surf Air is currently developing an AI-powered airline software operating system and is working toward certification of electric powertrain technology. The company said that the Dallas region offers Surf Air more direct access to a diverse and highly skilled talent pool, as it seeks to execute its mission to transform regional flying and bring its air operations to profitability this year. Dallas’s proximity to major airports and its central location makes it an ideal base to further strengthen Surt Air’s operational capabilities and increase efficiency across its national footprint of scheduled operations, the company said. Illustrative graphic of Surf Air’s fully electric powertrain, now in development. [Image: Surf Air Mobility] Surf Air said that by electrifying smaller existing aircraft first, it can take a significant step toward decarbonizing air travel. The carrier said that regional flights between 50 to 500 miles account for ~14% of carbon dioxide emissions from aviation. There are more than 15,000 nine-19 seat turboprop aircraft flying these routes, ready to be electrified, Surf Air said."
