["https://dallasinnovates.com/dallas-based-ltk-launches-new-app-that-lets-consumers-watch-creators-near-you"]
title = "Dallas-Based LTK Launches New App That Lets Consumers 'Watch Creators Near You' » Dallas Innovates"
description = "LTK Co-Founder and President Amber Venz Box says the creator commerce platform has rebuilt the LTK app from the ground up. Now users have control over their feed with the ability to discover creators by interests and location. And for the first time, they can see and connect with friends on LTK."
full_description = 'LTK has launched a new "video-first" app that lets consumers watch all content from nearby creators and in major cities across the globe. [Photo: Business Wire] Dallas-based LTK has announced a new consumer app it said goes beyond shopping to deliver a “video-first” experience to watch all content from nearby creators and in major cities across the globe. “We’ve rebuilt the LTK app from the ground up to deliver on what consumers want and what creators need—connection, discovery, and a seamless way to engage with content,” LTK co-founder and President Amber Venz Box said in a statement. “The creator economy is evolving rapidly, and now is the time to pioneer a new way people experience and connect with their favorite creators. LTK is the creator app—we want it to be the daily destination to watch, discover and engage with creators you want to see and follow.” LTK, the first and largest creator commerce platform, said the new app gives users control over their feed with the ability to discover creators by interests and location, and, for the first time, users can see and connect with friends on LTK. For creators, LTK is introducing new content editing tools in the LTK Creator app designed for a more seamless experience. LTK said that the creator economy is growing rapidly and is expected to be valued at $500 billion by 2027. It said that creators have become the trusted source for entertainment, trends, and products that shape consumer behavior. LTK said that 91% of Gen Z and 78% of millennials turn to their favorite creators to see what’s trending. As creator spaces evolve, social media platforms are adopting interest-based algorithms, leaving 74% of consumers feeling that social media is no longer social. Connection and community is what people want the most as they seek a destination to connect and curate a feed with the creators they follow, LTK said. Creators, the company added, need a platform that helps them build, nurture, and attract audiences.'
author = "Dallas Innovates"
