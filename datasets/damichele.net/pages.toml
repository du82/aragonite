full_description = "Nelle pizzerie di Napoli, Salerno e Aversa, prima, e presto in tutto il mondo, sarà disponibile un QR code che attraverso Authentico consentirà la verifica dell’origine e dell’autenticità delle materie prime usate nella preparazione delle pizze presenti sul menù. Mediante la piattaforma digitale di Authentico, che fornisce la certificazione della filiera basata sulla tracciabilità blockchain, i consumatori possono controllare l’origine delle materie prime, l’autenticità e la salubrità delle pizze de l’Antica Pizzeria Da Michele in the world. La Blockchain è una tecnologia informatica che permette di immagazzinare informazioni, dati e documenti sulle filiere di produzione, senza che queste siano sovrascrivibili e, di conseguenza, modificabili, assicurando, con certezza matematica, quando e da chi sono state inserite. In questo modo, può migliorare la sicurezza dei prodotti e la trasparenza aziendale verso i consumatori."
