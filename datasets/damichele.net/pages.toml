title = "Pizzeria da Michele – Il tempio della Pizza – sede storica di Napoli"
full_description = "Nuova Apertura Aversa L’antica Pizzeria Da Michele apre ad Aversa in Viale Europa n° 318Data e ora di apertura verranno comunica prossimamente Leggi tutto » 02/28/2023 Antica pizzeria da michele in the world e caffè moreno in co-branding per il mondo L’Antica Pizzeria da Michele in The World srl e Caffè Moreno srl hanno il piacere di comunicare l’accordo di co-branding che prevede la distribuzione graduale Leggi tutto » 02/27/2018 Con solo quattro pizze nel menù, a garanzia di qualità, ricerchiamo da più di cent’anni i sapori del passato. Garantiti dagli ingredienti delle eccellenze campane: dalla farina al fiordilatte all’olio, tutto nasce da imprenditori che dedicano il loro lavoro a un ambito ristretto, assicurando tecniche e sapori eccelsi. La nostra pizza racconta una storia, che nel nome della pizzeria protagonista del folclore di Napoli, con i suoi sapori e odori, arriva nel tempo fino a oggi, spingendosi in tutto il mondo col franchising Michele in the world. Da oltre 150 anni l’Antica Pizzeria da Michele delizia il palato di napoletani e turisti di tutto il mondo. Tanti i personaggi famosi che l’hanno frequentata e la frequentano, non sottraendosi al “rito” della lunga attesa, da Maradona a Julia Roberts, passando per divi del calcio e dello star system di oggi, tutti possono godere di sapori indimenticabili, in un luogo divenuto cult per stranieri, ma che ha il privilegio di essere rimasto “napoletano”, nella sua accezione più nobile e accattivante. I social network sono da sempre un parte importantissima de l’Antica Pizzeria Da Michele: i nostri followers sono tantissimi, oltre 150mila sui nostri canali e profili! Un mezzo fondamentale per entrare in contatto. Se non lo hai già fatto seguici subito! Su Facebook, Instagram e TikTok puoi rimanere sempre aggiornato sulle news e gli eventi che organizziamo L’antica Pizzeria Da Michele apre ad Aversa in Viale Europa n° 318Data e ora di apertura verranno comunica prossimamente"
