title = "Sede di Aversa – Pizzeria da Michele"
description = "L'archiviazione tecnica o l'accesso sono strettamente necessari al fine legittimo di consentire l'uso di un servizio specifico esplicitamente richiesto dall'abbonato o dall'utente, o al solo scopo di effettuare la trasmissione di una comunicazione su una rete di comunicazione elettronica."
full_description = "L’Antica Pizzeria Da Michele arriva ad Aversa con la sua terza sede in Campania. Nel design, questa nuova pizzeria richiama la casa madre di Napoli e la più recente a Salerno, con il verde e bianco scelti come colori preponderanti degli interni. Il menù offre le pizze classiche della tradizione della sede di via Sersale a Napoli, ovvero margherita normale e doppia mozzarella, marinara e cosacca. E, ancora, la margherita con mozzarella di bufala, la diavola con salame piccante, la salsiccia e friarielli, la provola e pepe, il ripieno al forno, la pizza fritta e una special, che cambia ogni mese. Il menù andrà poi ad arricchirsi con gli antipasti tipici della tradizione napoletana e i dolci. Tra le bibite, degna di nota è la presenza di una birra e di un vino brandizzati ‘l’Antica Pizzeria da Michele’ creati, rispettivamente, dalle aziende KBirr e Martusciello.Gli ingredienti sono, come in tutte le sedi, gli stessi utilizzati a Napoli da anni: farina del Mulino Caputo, fior di latte Fior d’Agerola, olio Fratelli Masturzo e pomodori Solea. Qui a lato un QR code che attraverso Authentico consentirà la verifica dell’origine e dell’autenticità delle materie prime usate nella preparazione delle pizze presenti sul menù. La Blockchain è una tecnologia informatica che permette di immagazzinare informazioni, dati e documenti sulle filiere di produzione, senza che queste siano sovrascrivibili e, di conseguenza, modificabili, assicurando, con certezza matematica, quando e da chi sono state inserite."
