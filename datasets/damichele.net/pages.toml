full_description = "Al centro della città, la pizzeria sorge nell’elegante Galleria del Corso, formando un triangolo di gusto e food experience con le realtà già presenti sul territorio. La pizzeria ha un design elegante, con archi agli ingressi, su uno dei quali è incisa la scritta ‘Il tempio della pizza’ a dare il benvenuto agli avventori. All’interno, circa 90 coperti e tanti riferimenti alla storia di via Cersare Sersale, alla tradizione del fondatore, Michele Condurro, alle poesie sulla pizza e alle visite più attuali di tanti personaggi del cinema. Il menù del primo mese è essenzialmente composto dalle pizze della casa madre, margherita, marinara e cosacca, arricchite da altre tipiche della tradizione, come il ripieno al forno e fritto, diavola, provola e pepe e salsiccia e friarielli. Dal secondo mese, saranno aggiunte alcune novità e la special del mese, che contraddistingue le sedi campane di Aversa, Pompei, Salerno, e ora anche Caserta. Qui a lato un QR code che attraverso Authentico consentirà la verifica dell’origine e dell’autenticità delle materie prime usate nella preparazione delle pizze presenti sul menù. La Blockchain è una tecnologia informatica che permette di immagazzinare informazioni, dati e documenti sulle filiere di produzione, senza che queste siano sovrascrivibili e, di conseguenza, modificabili, assicurando, con certezza matematica, quando e da chi sono state inserite."
