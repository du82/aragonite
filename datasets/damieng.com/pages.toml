["https://damieng.com/blog/category/Microsoft"]
title = "Blog posts categorised Microsoft - DamienG"
full_description = "Windows media keys on a regular keyboard 📅 16 Aug 2013 📝 253 words 🕙 2 minutes 📦 Hardware, Microsoft 🏷️ keyboards, WindowsMany full-size Windows keyboards come with extra buttons some of which are of questionable value but the volume and music controls are useful especially if you’re a programmer that likes to listen to music all day.Unfortunately my two keyboards of choice (DAS Ultimate and Topre Realforce) do not come with such controls. Neither does my MacBook Pro but Apple do the elegant thing and re-purpose some of the function keys.Continue reading ⇢ Working at Microsoft 📅 13 Jun 2013 📝 2,335 words 🕙 11 minutes 📦 Microsoft, Technology 🏷️ career 💬 7 responsesAhmet Alp Balkan on the Microsoft Azure team reflected on his experiences at Microsoft. His experiences do not exactly match mine (initially on LINQ to SQL, then Entity Framework and finally xbox.com) but I recognize some of his points.Here is some further discussion along with some other thoughts that have come up over the years. A lot of these don’t apply just to Microsoft and some are useful for people new to the industry to think about.Continue reading ⇢ Typography on the Microsoft Campus 📅 2 Jun 2013 📝 363 words 🕙 2 minutes 📦 Microsoft, TypographyOne of the great things about working for Microsoft was the sheer breadth of the company means there are lots of cool and interesting things going on that you can peek into even if it’s not your area.With a few exceptions your Microsoft badge gets you into the whole campus (some of the Xbox studios and the executive floor are exceptions).Continue reading ⇢ Acer Aspire S7 review – two months in 📅 23 Jan 2013 📝 943 words 🕙 5 minutes 📦 Hardware, Microsoft 🏷️ review 💬 3 responsesGiven my new focus on Windows 8 apps and the loss of my MacBook Pro I was in the market for a Windows 8 laptop.My requirements were that it had a touchscreen display with at least 1080p resolution, fast (i5 or better with an SSD) and very slim. You’d be surprised at how such simple requirements leave you with such a small selection right now.Continue reading ⇢"
