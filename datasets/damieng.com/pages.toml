["https://damieng.com/blog/tag/hinting"]
title = "Blog posts tagged hinting - DamienG"
full_description = "Font hinting and instructing – a primer 📅 7 May 2009 📝 1,162 words 🕙 6 minutes 📦 Typography 🏷️ hinting, Envy Code 💬 2 responsesTaking my bitmap font Envy Code B into the vector TrueType Envy Code R was a long process, the most difficult being hinting.Bitmap fonts are incredibly easy to make. Using a program like Softy or BitFonter you decide the size of your letters and start plotting pixels. You can see exactly how it will look because you draw every glyph (letter/symbol/number) in every size you want to support. This can obviously be very time consuming and doesn’t let you take full advantage of the resolution of the device and the capabilities it offers. A printer can handle in excess of 300 dpi while a display is typically 72 dpi (Mac) or 96 dpi (Windows) with LCD’s supporting sub-pixels due to the individual layout of the red-green and blue elements you can’t feasibly pre-plot every single combination and even if you could the file size would be rather large.Continue reading ⇢ Getting the hint (Where is Envy Code R?) 📅 3 Dec 2007 📝 188 words 🕙 1 minute 📦 Typography 🏷️ coding fonts, Envy Code, hinting 💬 5 responsesI know, I said there would be a good chance that the next version of Envy Code R would be out this weekend but the annoying sizing, thickness and cropping issues that came up at some sizes above and below the optimum 10 point were really annoying me.Many articles later, some playing around with Microsoft Visual TrueType and much frustration and experimentation later I think I’m on the right path.Continue reading ⇢"
