title = "AnkhSVN & TortoiseSVN - DamienG"
full_description = "AnkhSVN & TortoiseSVN 📅 12 Oct 2006 📝 228 words 🕙 2 minutes 📦 .NET 🏷️ AnkhSVN 💬 2 responsesDamienG joins AnkhSVN team!I’m proud to announce that I’ve joined the AnkhSVN team, albeit in a rather minor capacity.For the last few weeks I’ve been working on a set of new icons to add a bit of sparkle to the user interface for the forthcoming AnkhSVN 1.0 release. There is a good chance they will make the next release candidate that’s on it’s way to address some issues with delete/remove functionality.A couple of nights ago I checked in the current icon set as it stands although there is a little more work left to do. Specifically there are a couple more commands buried in the Repository and Working Copy Explorers.Once 1.0 goes gold I’ll post a couple of screen-shots and icons here. In the mean time here are a few of the rejects including my 16×12 pixel French maid. Yes, they’re Firefox style and not XP/Visual Studio style, sorry.TortoiseSVN ignore patternsOccasionally you may use TortoiseSVN against projects and find it trying to add all sorts of junk to your repository. This is where the global ignore pattern list fits in and rather than loose mine again I’ll post it here for future reference although it is applicable to more than just the Tortoise…*/bin */obj */Release */Debug *.suo *.err *.log *.obj *.bin *.dll *.exe *.LOG *.user *.pdb [tT]emp [tT]empPE Ankh.Load thumbs.db [)amien"
