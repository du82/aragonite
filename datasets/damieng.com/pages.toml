["https://damieng.com/blog/tag/Envy%20Code"]
title = "Blog posts tagged Envy Code - DamienG"
full_description = "My top 5 free VS 2010 extension picks 📅 22 Mar 2010 📝 386 words 🕙 2 minutes 📦 .NET 🏷️ Visual Studio, Envy Code 💬 1 responseThe Visual Studio Gallery is already home to 533 tools, controls and templates for VS 2010 and this number is sure to grow once VS 2010 hits RTM and people get to grips with the extendable new editor.Don’t forget to check out The Visual Studio Blog for more tips, tricks and tools.Continue reading ⇢ Font hinting and instructing – a primer 📅 7 May 2009 📝 1,162 words 🕙 6 minutes 📦 Typography 🏷️ hinting, Envy Code 💬 2 responsesTaking my bitmap font Envy Code B into the vector TrueType Envy Code R was a long process, the most difficult being hinting.Bitmap fonts are incredibly easy to make. Using a program like Softy or BitFonter you decide the size of your letters and start plotting pixels. You can see exactly how it will look because you draw every glyph (letter/symbol/number) in every size you want to support. This can obviously be very time consuming and doesn’t let you take full advantage of the resolution of the device and the capabilities it offers. A printer can handle in excess of 300 dpi while a display is typically 72 dpi (Mac) or 96 dpi (Windows) with LCD’s supporting sub-pixels due to the individual layout of the red-green and blue elements you can’t feasibly pre-plot every single combination and even if you could the file size would be rather large.Continue reading ⇢ From the vaults of Twitter 📅 10 Jul 2008 📝 268 words 🕙 2 minutes 📦 .NET, Apple, Microsoft 🏷️ C#, Envy Code 💬 4 responsesI don’t normally republish my Tweets but are my highlights.damienguard: Methods returning “this” is a hack for fluency. Let’s get “..” added to the C# compiler to operate on previous object. a.This()..That()Continue reading ⇢ Envy Code R preview #7 (scalable coding font) 📅 26 May 2008 📝 287 words 🕙 2 minutes 📦 Typography 🏷️ coding fonts, Envy Code 💬 87 responsesIt’s been a struggle but finally after countless hours here it is, the next release of my Envy Code R monospaced (fixed-width) font designed for programmers.Many glyphs have been redrawn since preview 6 including braces, lower-case yy, 66 & 99, ampersand, dollar-sign, hash etc. One pixel was removed vertically height to make the box drawing balanced and allow more lines per screen.Continue reading ⇢"
