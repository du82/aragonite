["https://damieng.com/blog/category/Guernsey"]
title = "Blog posts categorised Guernsey - DamienG"
full_description = "Visual Studio, Windows Server and SQL Server 2008 launch in Guernsey 📅 19 Mar 2008 📝 186 words 🕙 1 minute 📦 Guernsey, Microsoft 🏷️ Visual Studio 💬 1 responseThe various Heroes Happen HereHeroes Happen Here community events in the UK/USA to celebrate the launch of Visual Studio 2008 etc. made me envious that we don’t get such events and goodies here on the little island of Guernsey so I thought I’d so something about it!We at the Guernsey Software Developer Forum are hosting a community event in conjunction with Microsoft to celebrate the launch of Visual Studio 2008, Windows Server 2008 and SQL Server 2008.Continue reading ⇢ Hibernate presentation in Guernsey 📅 25 Feb 2008 📝 211 words 🕙 1 minute 📦 Guernsey 💬 1 responseMy good friend Steve Streeting is giving a talk about the Hibernate object-relational mapper at the Guernsey Software Developer Forum tomorrow night. Hibernate is a very successful ORM for Java which has been ported to .NET under the moniker NHibernate.The event, as always, is open to everyone and commences at 6pm at the Guernsey Training Agency above the old Post Office in Smith Street, St. Peter Port. They normally run for around 1 hour followed by an optional 30 minutes in the pub for those who can’t get enough (code, not alcohol).Continue reading ⇢ Language Integrated Query: An introduction presentation online 📅 29 Jan 2008 📝 96 words 🕙 1 minute 📦 .NET, Guernsey 🏷️ LINQThis evening’s presentation on Language Integrated Query (LINQ) is now available from my appearances page.The event went well with 12 developers (it’s a small island) and took a less time to produce because I didn’t write a script for but slides to lead us through areas I wanted to cover.Continue reading ⇢ Language Integrated Query: An introduction talk tomorrow 📅 28 Jan 2008 📝 128 words 🕙 1 minute 📦 .NET, Guernsey 🏷️ LINQI’m just finishing up the slides, notes and writing code samples for my LINQ presentation at the Guernsey Software Developer Forum tomorrow evening.Hopefully the broader scope of this presentation will mean a few new faces — the previous talks on Subversion and web application security might have been a little specific for a such a small audience (Guernsey is around 70,000 people on an island 9 miles long).Continue reading ⇢"
