title = "Dell Inspiron 5000e Unofficial FAQ* - DamienG"
description = "*and other Compal N30 series machines"
full_description = '''Dell Inspiron 5000e Unofficial FAQ* 📅 16 Jun 2013 📝 12,894 words 🕙 58 minutes*and other Compal N30 series machinesThis FAQ is no longer maintained and was last revised 21 September 2002. The author no longer offers support on the topic.Introduction Welcome Release notes Warning Revision history FeedbackGeneral Who manufactures this machine? What are the various models? Who supplies this machine? What are the various screen resolutions available? What hardware is used in this machine? How can I hard-reset my machine without removing the battery? What ports/features does the machine have? What ports/features does the Port Replicator have? What ports/features does the Advanced Port replicator have? Why does my TV output or projector fade in and out when playing DVD's? What is the latest BIOS? How do I flash my BIOS? How do I get into the BIOS settings? Why does my cursor jump across the screen when I type? Why does the touchpad not switch off when using my USB mouse? Is my hard drive supposed to make a noised when turned upside down? How do I make sure my processor is firmly socketed? Why does my machine boot up with a blank screen? How do I make my machine load silently?Dell specific What are the differences between the 5000 and 5000e? Where can I get a 5000e? Battery recall information Where can I get new/additional manuals? Where can I go for more help? How do I run Dell Diagnostics?WindowsAudio Does this machine support 3D sound technology? Why does my volume change suddenly in Windows 2000 and Windows ME? How do I choose between line-in and microphone recording? How can I stop sound stuttering with my Xircom RealPort card installed under Windows 2000? Why can't I hear my PC-Card (PCMCIA) modem dialling a remote system? How do I enable the SPDIF output on my port replicator? Display Why do I have four/two "Default Monitors" in Windows Device Manager? How do I set-up my monitors correctly? Where can I get an ICM colour matching definition for my LCD? How can I set my external monitor to above 60Hz in Windows? How can I make my desktop span two displays in Windows 2000? What about hardware accelerated 3D graphics? How can I tweak my graphics settings? How can I make my LCD turn off when I close the lid? DVD How can I play DVD's from other regions? How can I improve DVD playback? How do I adjust WinDVD's advanced settings? Why do I get a coloured square instead of my DVD when playing to a TV? How do I output digital audio via the SPDIF connector? Miscellaneous How can I make Windows 2000 support IrComm like 95/98/ME? How can I get my external mouse scroll-wheel to function? How do I hibernate under Windows 2000? Why does my hard-drive keep accessing? Why does Windows 9x lock-up after using Windows 2000 on a dual-boot system? Why do I loose the network connection on my Xircom? Drivers/operating systems Windows 95/98/ME Windows 2000 Windows NT Windows XP GNU/Linux BeOS QNX RTP FreeBSD OpenStep What other drivers are available?Hardware upgrades How do I upgrade my onboard video from 8mb to 16mb? What memory modules are supported? What hard drives are supported? Can I add a second hard drive into the DVD/CD bay? What is the unmarked trap-door underneath my laptop for? Can I add a DVD/CD-RW drive? Can I upgrade my processor?Software upgrades WinDVD (Intervideo)Software compatibility Asheron's Call (Microsoft) EverQuest (Sony) Madden 2001 No One Lives Forever (Fox) Return to Castle Wolfenstein MP Test Tribes (Dynamix/Sierra) Unreal TournamentPerformance tips 3D graphics DVD/CD SoundBenchmarks SiSoft SandraUtilities Disk Power VideoSpare partsSupply United Kingdom United StatesDell part codes AC power adapter Battery Cables Documentation (English) Enclosure Floppy bay Hard drive carrier Hard drives Internal boards LCD Media bay Memory Port replicationIntroductionWelcomeWelcome to the Dell Inspiron 5000e Unofficial FAQ. As this is my first notebook I’ve had quite a bit of fun learning the ins and outs of this machine and after a few visits to the Dell Talk support forums thought I’d share a few useful things I’ve learnt about this machine.WarningI do not work for Dell and certainly do not represent Dell in any way. Neither I nor Dell will take responsibility for the application or misapplication of these instructions and their consequences to your software, hardware, data, configuration or warranty. Use are your own risk. If you are uncomfortable with this then you are not the intended audience :)Revision history Date Updates 11 December 2000 All new FAQ for Dell Inspiron 5000e. 04 September 2001 Updated: How do I output digital audio via the SPDIF connector? to cover Windows XP Added: Pre-made registry changes for those answers that contain registry edits. Added: United States supplier to the Spare Parts supply - thanks to David Wolfskill Updated: What is the latest BIOS? to include Compal BIOS 05 September 2001 Added: Can I add a DVD/CD-RW drive? to Hardware upgrades - thanks to all who sent info Added: Can I upgrade my processor? to Hardware upgrades Updated: How do I setup my monitor's correctly? to include revised Windows 2000 and new Windows 98sections 06 September 2001 Cleaned up all the HTML, made it XHTML 1.0 compliant, fixed hyperlinks and bookmarks, contents and added links to W3C validator 13 September 2001 Updated: How can I play DVD's from other regions? to mention RPC under Windows XP Plus a whole host of updates from Conrad McDonnell: Updated: How can I make my LCD turn off when I close the lid? to include Windows 98/ME Updated: How can I play DVD's from other regions? to mention Region Killer Updated: Spares - correction to 8MB board description 18 September 2001 Updated: Windows XP drivers section to cover getting TV/Out and OpenGL support Added: Return to Castle Wolfenstein MP Test to compatibility section Updated: What memory modules are supported? to include current prices 21 September 2001 Updated: Windows XP drivers section to mention Windows 2000 TrackPad driver Updated: How can I play DVD's from other regions? to mention no known permanent solution for DVD region tab Added: TeamExcess as a spares and machine supplier - thanks to Jon Abbott Added: Eraser to the useful files section Added: New Stay updated section to send e-mails when the page updates 02 October 2001 Updated: Added Windows ME to How do I enable the SPDIF output on my port replicator? 12 October 2001 Updated: Newer unsupported (Dell provided, not 5000 specified) drivers - thanks to Thorsten Schuster 18 October 2001 A whole host of updates from Conrad McDonnell: Added: OpenStep section to drivers Added: E-Stock Ireland as reconditioned 5000e provider Added: MiniHobby and Xtreme to other manufacturers selling this machine 23 October 2001 Added all Dell's official 5000e Windows XP drivers/support files (thanks to Tyler Schallhorn for notifying me) Dropped using a version number for the FAQ's revision - a date is better 30 October 2001 Added latest Compal BIOS to What is the latest BIOS? - thanks to Igor Loginov Updated benchmarks to new Sysoft Sandra 001 07 November 2001 Now updated to cover all N38W variants, new section and changes all over the places Reviewed every single listed machine in the Who supplies this machine to update/check details Added PowerPro III:16 - thanks to Donald Stratton at PowerNotebooks Rewrote the whole BIOS section, new links, tips, procedure Fixed lots of links, removed dead ones Checked and updated the various drivers where applicable 13 November 2001 Added service manual link to What hardware is used in this machine? Added more retailers models Added MicroTech FlexNote NT 4 support link Added more places to get used/reconditioned 5000e's to Where can I get a 5000e? - thanks to Conrad McDonall 03 December 2001 Updated release notes with important notice Deleted Todo section Deleted Stay Updated section Added N30W/5000 video drivers Added IBM TravelStar 48GH drive 24 January 2002 Added Lucent/ActionTec LT WinModem driver to BeOS section 24 February 2002 Added hard drive carrier info to What hard drives are supported? - thanks to Todd Radel Added DVD-ROM/CD-RW combo drive to Can I add a DVD/CD-RW drive? Spell checking and typo fixes 21 September 2002 Added Compal N30W BIOS 1.07a - thanks to Jarron Johnson FeedbackNO LONGER MAINTAINEDGeneralWho manufactures this machine?Compal is the company that manufactures the N30 series and supplies it to other retailers for re-branding and as such it is available under many guises from a multitude of suppliers. See Who supplies this machine? for a list of them.What are the various models?There have been three major revisions to the N30 range. They are: Model Major differences N30W 4MB or 8MB Rage Mobility P N38W2 8MB or 16MB Rage 128 M3 MMC2 processors to 850MHz Up to SXGA+ 1400x1050 LCD resolution (apart from Dell UXGA 1600x1200) N38W3 16MB Rage 128 M3 uPGA-2 processors to 1GHz Up to UXGA 1600x1200 LCD resolution The Dell Inspiron 5000 used the N30W model and the Inspiron 5000e the N38W2 model. Dell have never offered a N38W3 model. Most machines currently on the market are based around the N38W2 model, with the some now offering the N38W3. The original N30W is no longer available. Most items in this FAQ apply to all these models.Who supplies this machine?Each model listed contains some basic details on the features and options that retailer has chosen to offer with the machine. The various models and options are as follows:N30W Brand CPU LCD Video Media drives Hard drives Weight Operating systems Warranty Notes Compal N30W ? ? 4MB 8MB DVD-ROM 24x CD-ROM ZIP LS-120 4GB-18GB 14.1" 6.1lbs 15" 7.2lbs n/a OEM only No longer available 48Wh battery Dell Inspiron 5000 Pentium III 600MHz-650MHz 15" XGA 4MB 8MB 6x DVD-ROM 24x CD-ROM LS-120 ZIP to 12GB 7.7lbs ? 3 year No longer available 59Wh battery (3 hour) WinDVD N38W2 Brand CPU LCD Video Media drives Hard drives Weight Operating systems Warranty Notes Compal N38W2 Pentium III Celeron 14.1" XGA 15" SXGA