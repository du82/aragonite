["https://damieng.com/typography/advent/2021"]
title = "Advent of Fonts 2021 - DamienG"
description = "In December 2021 I tweeted a 24-day calendar of 8x8 pixel fonts."
full_description = "Advent of Fonts 2021 📅 25 Nov 2022 📝 469 words 🕙 3 minutesIn December 2021 I tweeted a 24-day calendar of 8x8 pixel fonts.While many were original designs that made it into my ZX Origins some were not suitable for inclusion as they were either conversions or heavily based-upon existing bitmap fonts.Those fonts needed a home too, so they are presented here. .image-sized img { width: 256px; transition: transform .1s; } .image-sized img:hover { transform: scale(2) } p img { display: inline-block; padding-right: 1em; } Feud Quantra Founded Prism Extendomatic Gattars Fork Distant Tears Amiga Caprica Statement (withdrawn) Tartan Adventure Punch Capcom Fighter Vindicated Shadow of the Beast A Night in Tokyo Pristine Decay Minecraft Flamboyant Legend of Zelda Conveyance Skid Row Raptor BalrogDay 1 — FeudA version of @stepickford‘s font from his awesome ZX Spectrum game FEUD extended to include lowercase letters!Also included are the original upper-case only and smaller lower-case variants.Download Feud fontsDay 8 — AmigaAmiga day! This pack contains three fonts — the original Kickstart 1 version of Topaz 8, the revised more rounded Kickstart 2 version plus the Amiga OS 3 thin system font! All look great!Download Amiga fontsDay 11 — Tartan AdventureA fun and quirky font converted from the challenging 1987 split-screen text adventure The Gordello Incident by Tom D Frost via Tartan Software (screenshot 1).Download Tartan Adventure fontDay 13 — Capcom FighterCapcom Fighter! A monochrome conversion of the Final Fight arcade font from Capcom (shot #3) — variants were also used in some of the Street Fighter series. The Spectrum ports used a much worse font.Download Capcom Fighter fontDay 15 — Shadow of the Beast IIA font conversion from classic Amiga platform game Shadow of the Beast II extended with lower-case adapted from my Fatality font. I also did a Beast 2 logo font a while back.Download Shadow of the Best 2 font.Day 18 — MinecraftTo a whole generation pixels can mean only one thing… Minecraft!A decade ago working at Xbox I played with colleagues late into the night. Now my kids play it daily.Download Minecraft fontDay 20 — Legend of ZeldaPerhaps you adventured as the Hero of Hyrule with a Magical Princess!Legend of Zelda on the GB made quite the impression to me and it’s popular with kids today (my daughter loves the manga too).Download Zelda fontDay 24 — BalrogA tribute to the late @RochBalrog — The Balrog of Zenobi Software — who wrote & published many great text adventures.❤️ This font is a blend of a few different old-style fonts he used in his games.Download Balrog font"
