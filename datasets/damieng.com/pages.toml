["https://damieng.com/blog/2006/08/29/choosing_your_orm_runtime_vs_code_generation"]
title = "Choose your ORM: Runtime, code generation or build provider? - DamienG"
description = "Selecting the right object-relational mapper is a tricky decision with many factors to weigh up."
full_description = "Choose your ORM: Runtime, code generation or build provider? 📅 29 Aug 2006 📝 347 words 🕙 2 minutes 📦 .NET 🏷️ CodeSmith, SubSonic 💬 1 responseSelecting the right object-relational mapper is a tricky decision with many factors to weigh up.One of the basic decisions is whether to go with a dynamic run-time (“black-box”) or a code generator.I’m not a fan of the run-time approach — the discovery at run-time negatively impacts performance as it often uses reflection (or failing that post-compilation byte code modification) whilst robbing you of compile-time checking, IntelliSense support against your database objects, deployment and potentially licensing issues. In effect, it’s not that much better than a typed dataset.Code generation provides for a much finer granularity letting you tweak the templates for the performance and features you need whilst also providing full compile-time checking and IntelliSense support.Tools such as CodeSmith (my personal favorite), MyGeneration (free) do a good job of letting you write these templates and create the necessary ORM code but require being re-run every time you change the schema. During the starting phases of a project this could be quite often and goes against the whole concept of RAD.So step in SubSonic and it’s build provider approach.The idea here is that you modify your .config file to include the SubSonic build provider and it’s connection string, drop a simple text file in that lists which tables to work with and you’re done.SubSonic now goes off to your database via the connection and generates all the code for tables you need and it’s magically there to be used like any other classes. Check out the demo to see just how easy it is.SubSonic supports a large number of databases, has support for Enterprise Library, is open source and also provides simple “scaffold” pages that let you throw a basic web add/edit/update/delete table maintenance page by just throwing a table name attribute onto an empty page’s form element.The only downside at this point is that it uses the ActiveRecord pattern for the ORM. If I manage to get some time to spend with it and can knock up a Domain Object + Data Mapper version I’ll let you know.[)amien"
