["https://damieng.com/blog/category/Typography"]
title = "Blog posts categorised Typography - DamienG"
full_description = "Using variable web fonts for perf 📅 3 Dec 2021 📝 1,345 words 🕙 6 minutes 📦 Typography 🏷️ webdevWebfonts are now ubiquitous across the web to the point where most of the big players even have their own typefaces and the web looks a lot better for it.Unfortunately the problem still exists that either the browser has to wait before it draws anything while it is getting the font or it renders without the font then re-renders the page again once the font is available. Neither is a great solution and Google’s PageSpeed will hit you for either so what is an enterprising web developer to do?Continue reading ⇢ ZX-Origins - free 8-bit fonts for games 📅 3 Jun 2019 📝 368 words 🕙 2 minutes 📦 Typography 🏷️ Spectrum, pixel fonts 💬 2 responsesI started designing fonts around 1987 on an 8-bit Sinclair ZX Spectrum. Many years later, my involvement in the Spectrum emulation scene led aul Dunn to ask me if I could provide fonts for his excellent BASIN Sinclair BASIC for Windows. My interest in 8x8 fonts was suitably rekindled, and I ended up delivering about 60 — some even extracted from my original +3 disk images.I wanted to get these fonts online earlier! Raw 7698-byte files, however, are only of use to BASIN users or those suitably familiar with the convoluted process and tools to get them into a Spectrum or emulator. Even trying to use them on Windows was a pain given that TrueType only cares about scalable fonts (SBIT embedded bitmaps are rare these days).Continue reading ⇢ Typography in bits: For a few pixels more 📅 9 Aug 2016 📝 1,161 words 🕙 6 minutes 📦 Typography 🏷️ pixel fonts, 8-bit, 16-bit 💬 2 responsesA series of posts on system fonts:It’s been a while since I visited the bitmap fonts of old computers (see the bottom of the post for links), there are still some to evaluate!Continue reading ⇢ Typography in bits: Other English micros 📅 20 Jul 2014 📝 1,092 words 🕙 5 minutes 📦 Typography 🏷️ pixel fonts, 8-bit, 16-bit 💬 1 responseA series of posts on system fonts:I’ve been wanting to do a follow-up to the popular system fonts posts for some time and recent HackerNews and ArsTechnica traffic reminded me that I’m not the only one nostalgic for chunky pixel fonts of old.Continue reading ⇢"
