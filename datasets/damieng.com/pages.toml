["https://damieng.com/blog/2006/11/09/my-development-tools"]
title = "My 2006 development tools - DamienG"
description = "Christopher Bennage wrote about his development tool set-up and encouraged others to do the same so here’s my current set-up."
full_description = "My 2006 development tools 📅 9 Nov 2006 📝 334 words 🕙 2 minutes 📦 .NET 🏷️ AnkhSVN, CodeSmith, SubSonic, Visual Studio 💬 3 responsesChristopher Bennage wrote about his development tool set-up and encouraged others to do the same so here’s my current set-up.Daily toolsVisual Studio 2005 — IDE of preference despite it’s sluggish behaviorSQL Server 2005 Management Studio — Took getting used to but it’s an improvement on 2000’s Enterprise ManagerAnkhSVN – Subversion support inside Visual Studio 2005.NET Reflector — Searching .NET API or to find out what it’s doingWeb Application Projects — Stop using VS’s web sites and start using web applications!Web Deployment Projects — Deploy to dev, test or live servers as easily as building a projectNot quite dailyCodeSmith — Need to get to grips with v4 to build our whole database layer in one hitTrac — Bug tracking, milestones & wiki with integrated support for SubversionTortoiseSVN — Check-in/out of non-project items (e.g. art assets)Web Developer Extension — Trying CSS changes on-the-fly, validating pages etc. from FirefoxFirebug — Examining pages, the page DOM etc. from FirefoxKDiff — Excellent 3-way diff tool that works great with AnkhSVNSubtext — Blogging system running hereOn occasionVisual C# Express and XNA — Messing with 3D graphics, controllers and pixel shadersOgre — Steve’s object-oriented 3D engineXcode and Cocoa — Still quite alien with it’s message-based calling mechanism but obviously powerfulKeeping an eye onEclipse — IDE for developing Java (C++ and C# support in various stages too)Ruby on Rails — Interesting RAD approach to web development — Apple also supporting on Mac OS X 10.5Sandcastle — Microsoft’s documentation tool that already seems to have had an impact on NDocSubSonic — Build-provider that generates an ORM on the fly and provides automatic developer-only db editing pagesNot used lately, still installedDelphi 5/6 — Borland’s great RAD tool for non-.NET development, later versions support .NET tooJBuilder — Java development although I’d probably move to EclipseVisual Studio 2003 — Still required for the odd .NET 1.1 application/testing[)amien"
