["https://damieng.com/blog/2006/04/20/handlingnullablevaluetypesindotnet"]
title = "Handling nullable value types in .NET 1.x - DamienG"
description = "One of the great new features in .NET 2.0 is support for nullable types — especially important when dealing with value types such as Int or DateTime values coming from a database. Previously you were forced to either set and track another binary flag or to use a “special” value to represent null that sooner or later would turn up in real data."
full_description = "Handling nullable value types in .NET 1.x 📅 20 Apr 2006 📝 233 words 🕙 2 minutes 📦 .NET 🏷️ C#One of the great new features in .NET 2.0 is support for nullable types — especially important when dealing with value types such as Int or DateTime values coming from a database. Previously you were forced to either set and track another binary flag or to use a “special” value to represent null that sooner or later would turn up in real data.In C# 2.0 thanks to a bit of syntactic sugar we can do this;int? nullable1 = 1; if (nullable1 == null) nullable1 = 2; Which the C# compiler actually turns into the following:Nullable<int> nullable1 = new Nullable<int>(1); if (!nullable1.HasValue) nullable1 = new Nullable<int>(2); This makes use of the new Nullable<T> generic structure to wrap the value with an additional boolean HasValue property.That looks surprisingly similar to the syntax of the open-source NullableTypes project you can use with .NET 1.1 (or 2.0):NullableInt32 nullable1 = new NullableInt32(1); if (nullable1.IsNull) nullable1 = new NullableInt(2); Disclaimer: I’ve worked on the NullableTypes project specifically implementing the IXmlSerializable, NullableGuid & NullableTimeSpan.[)amienhtml .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}"
