["https://damieng.com/blog/2011/03/27/typography-in-16-bits-system-fonts"]
title = "Typography in 16-bits: System fonts - DamienG"
description = "A look at the system fonts of 16-bit machines including the IBM CGA & VGA Adapters, Apple Macintosh, Commodore Amiga, and Atari ST."
full_description = 'Typography in 16-bits: System fonts 📅 27 Mar 2011 📝 1,344 words 🕙 6 minutes 📦 Typography 🏷️ pixel fonts, Amiga, Atari, PC, 16-bit 💬 22 responsesA series of posts on system fonts: 8-bit systems 16-bit systems Other English systems A few more systemsWith the 8-bit system fonts post being so popular I just had to jump right in and look at the system fonts available on the 16-bit machines!IBM CGA Adapter (1981) Specifications StyleBold serif Width6-7 pixels Caps7 pixels CharsetASCII+code pages Low res320×200 (40×25 text) Med res640×200 (80×25 text) DesignerIBM The IBM PC’s first color graphics card was known as the Color Graphics Adapter.Download (TrueType)Unusual characteristicsMix of serifs and non-serifs depending on spaceOff center |+:Squished Q to avoid using descenderWide 0Bubbly !Inconsistent t point and lack of serif on jRationaleThe large bold letters work well on the low-resolution displays at the time and many of the quirky were unlikely particularly noticeable there.InfluencesUnknown.Apple Macintosh (1984) Specifications StyleBold sans Width1-11 pixels Caps10 pixels CharsetMac OS Roman Screen512×342 DesignerSusan Kare Apple’s second attempt at a GUI (after the Lisa) was the Macintosh. The system font was called Chicago initially as a bitmap font which was replaced with a scalable TrueType version. With Mac OS 8 it was replaced with the similar Charcoal typeface and then dropped entirely in Mac OS X which uses Lucida Grande for the UI.This font was dusted off again in 2001 and with a few minor tweaks became the system font of the iPod (classic & mini) until the higher resolution color display model.Download (TrueType)Unusual characteristicsProportional letters not fixed-widthSome symbols are not bold at all #%"/\*@^\Lovely flourish on &Curve on a actually touches the lower bowlDesigned specifically to avoid diagonal strokes (jaggies) on the Mac’s low-res screenRationaleThe high-resolution display let the designers really pay attention to detail and even though it was a 1-bit monochrome display it really looks beautiful for the time. It was little wonder that when Jobs went to NeXT they went with incredibly high-resolution monochrome displays again (at least initially and with 2-bit gray-scale).InfluencesIt’s unlikely they were digital.Commodore Amiga 1.x (1985) Specifications StyleBold serif Width6-7 pixels Caps7 pixels CharsetISO 8859-1 NTSC low320×200 (40×25 text) NTSC med640×200 (80×25 text) PAL low320×256 (40×32 text) PAL med640×256 (80×32 text) DesignerBob Burns The Amiga started with ex-Atari engineers desperate to design a 16-bit machine. It would eventually be purchased by Commodore and offer incredible graphics and sound that put Macs and PCs of the time to shame. Despite shipping with many fonts and supporting proportional text the default system font was a traditional fixed-width font called Topaz/8.Download (TrueType)Unusual characteristicsAs well as some letters touching some symbols such as \/ touched horizontally allowing nice ASCII artUnusual lower-case g somewhere between double and single storyUnusual almost comic-like !Some non-bold pixels for flourishes on t&Pixels missing on some curves aS especially obvious in low resolutionOver-extended r looks odd in any resolutionAlternate Topaz/9e — 10×9 (2 for descender) — modified some glyphs like g is available from Preferences as “Text 60”RationaleThe Workbench booted in white-on-blue (shown) and was intended for use either with their own Commodore monitors or home TVs. Despite the choice of a serif font it worked quite well on these displays although interlace was quite unusable without specialized displays.InfluencesVery similar to the IBM CGA system font, very likely to be derived from there.TechnicalThe Amiga shipped with it’s own font editor called “Fed” found on the Workbench Extras disk in the Tools folder.Commodore Amiga 2.x (1991) Specifications StyleBold sans Width6-7 pixels Caps7 pixels CharsetISO 8859-1 ScreenConfigurable DesignerPeter Cherna Commodore’s update to the Amiga saw all sorts of changes in the ROM and Workbench for the GUI including some revisions to the font and the ability to change what font the workbench used.Download (TrueType)Unusual characteristicsOver-extended top of 1Open elements on %@Messy Q is hard to distinguishAlternate Topaz/9e — 10×9 (2 for descender) — modified some glyphs like g and available from Preferences as “Text 60”RationaleThe Workbench booted in black-on-grey (shown) and the new font looked a lot more friendly as well as being a more legible choice for home TVs.InfluencesObvious modification of the prior 1.x font to remove serifs and improve legibility.TechnicalWBScreen allowed you to choose which font to display in Workbench including some of the proportional fonts included.Atari ST Low/Medium Res (1985) Specifications StyleBold sans Width6-7 pixels Caps7 pixels CharsetASCII+proprietary set Low res320×200 (40×25 text) Med res640×200 (80×25 text) DesignerUnknown The Atari ST was Atari’s answer to the Commodore Amiga after they failed to purchase back the talent and technology. The machine’s GUI was based on GEM from Digital Research.Download (TrueType)Unusual characteristicsDescenders are cut very short on pq despite gy not following this styleInconsistent positioning between , and ;Ugly braces () from the 8-bit font retainedRationaleThe font was very clear and worked well in both square pixel (low resolution) and rectangular pixel (medium resolution) modes.InfluencesAlmost identical to the Atari 8-bit font but with the capital letters, symbols and numbers extended a pixel higher (inverse symmetry was no longer a concern) and more consistent/cleaner lowercase letters sj.TechnicalIt is possible to change the system fonts used by the GEM desktop using the ST Font Loader.Atari ST High Res (1985) Specifications StyleBold sans condensed Width6-7 pixels Caps12 pixels CharsetASCII+proprietary set Screen640×400 (80×25 text) DesignerJerome Domurat The ST was quite unique in that the high-res mode genuinely used a different font rather than just doubling the pixels of the medium-res font like the Amiga etc. which made a lot of sense given the high-res mode was only available on high-resolution monitors.The proliferation of the ST in music and DTP would have put this chunky font in front of a lot of professionals.Download (TrueType)Unusual characteristicsVery tall letters — some glyphs 14 pixels high but still only 6–7 pixels wideAvoids every trace of a serif except usual Iil monospace hackShort descenders on pq stillInconsistent choices for c and R and wRationaleGiven that this screen mode was only available on high-resolution monitors it is very rectangular and failed to really take advantage of the unique situation in which it would be used.InfluencesVery likely based on the medium resolution font with some redrawing.IBM VGA Adapter (1985) Specifications StyleBold serif Width6-7 pixels Caps10 pixels CharsetASCII+code pages Screen640×400 (80×25 text) DesignerUnknown IBM really stepped up their game with the VGA adapter which was a huge leap forward in graphics for the PC. The system font was updated to take advantage of the higher resolution and the ability to display more colors.Download (TrueType)Unusual characteristicsVery tall letters — some glyphs 14 pixels high but still only 6–7 pixels wideTop bar of T is two pixels thickToo-high double quotes ” also styled inconsistentlyAnother bubbly ! like the Amiga’s Topaz 1Inconsistent sizing between , and ;Very large $ even bigger than the capital SRationaleA reasonably nice serif font that gave a serious look if somewhat inconsistent in places.InfluencesAlmost certainly based on the original CGA font.TechnicalCan be overridden by tools like fontedit.com.'
