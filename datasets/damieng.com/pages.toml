full_description = "Reference 📅 23 Jul 2024 📝 152 words 🕙 1 minuteI have a few reference pages here — some still maintained others long since past their best.Guernsey (still maintained)Guernsey is where I have spent most of my life and is woefully under-represented on the Internet.If you are responsible for the country-lists on your website, please refresh it with the official ISO-1366 country list as Guernsey, Jersey and the Isle of Man were added in 2006. Alas, they are still not listed as countries in many places and even when they are, they do not work correctly. Working with Guernsey has some useful information to get your started.Guernsey Estate Agents Comprehensive list of estate agents in Guernsey.Deliveries in Guernsey International delivery companies use local agents to represent them.FAQs (obsolete)I have previously maintained three Frequently Asked Questions and Answers (FAQs) on the following subjects:Arcam DVD playersDell Inspiron 5000e laptop (and compatibles)MGT Lifetime/Universal floppy drive"
