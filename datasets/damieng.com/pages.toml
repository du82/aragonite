title = "Blog posts tagged Windows - DamienG"
full_description = "Windows media keys on a regular keyboard 📅 16 Aug 2013 📝 253 words 🕙 2 minutes 📦 Hardware, Microsoft 🏷️ keyboards, WindowsMany full-size Windows keyboards come with extra buttons some of which are of questionable value but the volume and music controls are useful especially if you’re a programmer that likes to listen to music all day.Unfortunately my two keyboards of choice (DAS Ultimate and Topre Realforce) do not come with such controls. Neither does my MacBook Pro but Apple do the elegant thing and re-purpose some of the function keys.Continue reading ⇢ My one-year check-in with my Windows Phone 7 📅 21 Nov 2011 📝 1,122 words 🕙 5 minutes 📦 Hardware, Microsoft 🏷️ Windows, Xbox 💬 2 responsesIt’s been almost a year since I bit the Windows Phone 7 bullet and put my iPhone 3G away. As a long-time Mac fan (our house is nothing but Macs) I wasn’t sure I’d last…Contact and calendar management is truly awesome as I wrote about previously. With the latest mango release Twitter and LinkedIn get brought into this unified system and messages that start with a text message can switch in and out of Facebook and Live Messenger as available.Continue reading ⇢ Windows 2008 Server on my MacBook Pro 📅 2 Apr 2008 📝 465 words 🕙 3 minutes 📦 .NET, Microsoft 🏷️ Boot Camp, MacBook, Windows 💬 12 responsesA troublesome disk (a story for another time) has forced me to reinstall my MacBook Pro and review my Windows partition.My Boot Camp partition was running Vista Ultimate x86 which felt sluggish, ignored the last 1GB and bugged me with UAC. One Windows update kept failing to install which also prevented SP1 from completing.Continue reading ⇢ One week with a MacBook Pro 17″ 📅 19 Dec 2007 📝 564 words 🕙 3 minutes 📦 Apple, Hardware 🏷️ MacBook, Windows 💬 4 responsesIt has been one week since I picked up my new MacBook Pro 17″ to replace my aging first-generation 15″ model.My initial concern was that the size and weight would be unwieldy after 4 years of lugging around a 15″ MacBook Pro and a prior to that a Titanium PowerBook G4. The actual problem was that my trusty Samsonite Trunk & Co. backpack could not accommodate it and that I’d have to hope Santa would deliver something a little bigger. Being properly kitted up might reveal if the dimensions and weight are uncomfortable so expect an update once I’ve travelled with the beast.Continue reading ⇢"
