["https://damieng.com/blog/2006/05/03/substitutabilityofgenerictypesindotnet"]
title = "Substitutability of generic types in .NET - DamienG"
full_description = "Substitutability of generic types in .NET 📅 3 May 2006 📝 504 words 🕙 3 minutes 📦 .NET 🏷️ C# 💬 1 responseThe “is” operatorAnyone using object orientated programming soon finds themselves wanting to perform some action only if an object is of some type or implements some interface.The easiest way is to do this is to use the is operator. Typically it will appear something like:object objA = FunctionToGetAnObject(); if (obj is SomeClassOrInterface) ((SomeClassOrInterface) obj).SomeMethod(); Here if obj_A is of a type that implements SomeClassOrInterface anywhere in its inheritance tree then SomeMethod of SomeClassOrInterface will be called.Test substitution with generic typesNow lets say we have our own generic type — here’s one to illustrate a point;public class DamoClass<T> { public T GetProperty { get { ... } } public T SetProperty { set { ... } } public bool IsValid { return true; } } If we want to check obj_A supports DamoClass<T> but we don’t care what type T is you might expect to be able to perform;if (objA is DamoClass) But that results in a compilation error — you can’t reference a generic class without specifying the type parameters regardless of whether you care about them or not. You might then try;if (objA is DamoClass<object>) After all every class inherits from object. This compiles fine but at runtime if objA is of any type other than object, e.g. DamoClass<string> it will return false.Why?The following might be what you had in mind;if (objA is DamoClass<object>) { ((DamoClass<object>) objA).IsValid(); object test = ((DamoClass<object>) objA).GetProperty; } Which looks fine but if .NET allowed that then how would it prevent;if (objA is DamoClass<object>) ((DamoClass<object>) objA).SetProperty = 11; When objA.AssociatedObject might well be something other than an integer? It can’t — so it doesn’t.SolutionThe solution is to split your generic class into two classes.The first contains your non-generic methods and properties and the second inherits from the first adding all the generic specialisation. The good news is that they can even have the same name.public class DamoClass { public object GetProperty { get { ... } } public bool IsValid { return true; } } public class DamoClass<T> : DamoClass { public T SetProperty { set { ... } } } Then you are free to do;if (objA is DamoClass) { ((DamoClass) objA).IsValid(); object test = ((DamoClass) objA).GetProperty; } Indeed .NET itself uses this technique for IEnumerable and IEnumerable<T>.One drawback with this technique is that you can’t redefine the type of a member in the subclass — maybe that’ll make C# 3.0.[)amienhtml .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}"
