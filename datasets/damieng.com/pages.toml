["https://damieng.com/blog/category/Technology"]
title = "Blog posts categorised Technology - DamienG"
full_description = "Extracting files from Tatung Einstein disk images 📅 13 Feb 2023 📝 2,952 words 🕙 14 minutes 📦 Technology 🏷️ Tatung Einstein, 8-bit, floppy disksRecently Kevin Edwards got hold of some 3″ disks containing source code to various old commercial games. He imaged them with the Kryoflux flux-level imager (Greaseweazle and FluxEngine are also good options). These tools produce highly accurate images of magnetic media that rips through copy protection and format concerns even allowing you to write the image back to disk with that in tact. This level of detail emits large files — 11.7MB for a single-sided Spectrum disk that normally holds 173KB is quite typical. 4KB data tracks happily turn into 215KB flux.Powerful as these tools are they don’t give you access to the files contained within that disk although some can write emulator-compatible images like DSK. As somewhat versed in 3″ media and DSK files through my archive experience and my open source Disk Image Manager tool he asked if I could take a look into achieving that.Continue reading ⇢ A quick primer on floppy disks 📅 8 Feb 2023 📝 1,050 words 🕙 5 minutes 📦 Technology 🏷️ floppy disksI’ve always been fascinated by floppy disks from the crazy stories of Steve Wozniak designing the Disk II controller using a handful of logic chips and carefully-timed software to the amazing tricks to create — and break — copy protection recently popularised by 4am.I’m going to be writing a few articles about data preservation and copy protection but first we need a short primer.Continue reading ⇢ DDR4 memory information in Linux 📅 8 Feb 2020 📝 3,072 words 🕙 14 minutes 📦 Technology 🏷️ Linux, hardware, I2C 💬 1 responseIf you’ve built a PC desktop in the last few years, you’ve probably been exposed to the confusing array of DDR4 information when it comes to buying RAM.What it comes down to is not all RAM is created equal. Once you get past pin size and memory capacity, you’ll have to filter down by speed. Speed isn’t a simple one-figure number — you may see a rated speed like 2400MHz, but you may also see another bunch of numbers like 16–16–16–39 indicating the necessary clock cycles to perform certain types of memory operations.Continue reading ⇢"
