title = "Blog posts categorised Apple - DamienG"
full_description = "Mac OS System 9 on Windows 📅 21 Mar 2021 📝 1,485 words 🕙 7 minutes 📦 Apple 🏷️ macOS, 16-bit 💬 1 responseI’m often digging into old bitmap font and UX design out of curiosity — and someday hope to revive a lot of these fonts in more modern formats using a pipeline similar to that for ZX Origins so we can get all the usable fonts, screenshots etc. out of them.One limitation I’ve run into is digging into old Macintosh fonts. While James Friend’s PCE.js puts System 6 and System 7 at your fingertips when it comes to later MacOS 7.5, 8 or 9 releases the site doesn’t have you covered as PCE doesn’t support PowerPC emulation (it emulates Motorola 68000 and Intel 8086 processors).Continue reading ⇢ Make Home & End keys behave like Windows on Mac OS X 📅 24 Apr 2015 📝 243 words 🕙 2 minutes 📦 Apple 🏷️ keyboards, macOS 💬 84 responsesI’ve been using Mac OS X daily since 2001 when I purchased my Titanium PowerBook. I still can’t get used the Home and End key behaviour.If, like me, you want Home to send you to the start of the line and not to the top of the document, then create a file called DefaultKeyBinding.dictDefaultKeyBinding.dict in your ~/Library/KeyBindings~/Library/KeyBindings folder (might need to create that folder too) with the following contents:Continue reading ⇢ What to do before your iTunes Match subscription expires 📅 3 Sept 2014 📝 243 words 🕙 2 minutes 📦 Apple 🏷️ iTunes 💬 2 responsesAt $25 a year the iTunes Match service can be a little tough to swallow given all it does is synchronize your music across iTunes especially when other file-sharing services are cheaper and more general purpose (OneDrive, Mega, DropBox etc).One important thing to know however before you let your subscription lapse or cancel is that once it’s gone all your cloud-backed-up music will be unavailable.Continue reading ⇢ A case for my MacBook Pro: Snugg wallet case review 📅 23 Dec 2013 📝 309 words 🕙 2 minutes 📦 Apple, Hardware 🏷️ MacBook, reviewI did it. Earlier this year I caved and purchased a MacBook Pro 15″ Retina after being Mac-less for a few months despite some reservations about the lack of upgrade options.Finally I had a lovely unibody machine. Now I needed something to prevent the beating my 17″ acquired over the years — something with a bit of padding to prevent the occasional bump as my backpacks tend to be very thin.Continue reading ⇢"
