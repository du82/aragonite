title = "Privacy Policy - DamienG"
description = "This privacy notice for Damien Guard (’we‘, ’us‘, or ’our‘), describes how and why we might collect, store, use, and/or share (’process‘) your information when you use our services (’Services‘), such as when you:"
full_description = "Privacy Policy 📅 27 Jul 2021 📝 3,519 words 🕙 16 minutesThis privacy notice for Damien Guard (’we‘, ’us‘, or ’our‘), describes how and why we might collect, store, use, and/or share (’process‘) your information when you use our services (’Services‘), such as when you:Visit our website at damieng.com, or any website of ours that links to this privacy notice.Questions or concerns? Reading this privacy notice will help you understand your privacy rights and choices. If you do not agree with our policies and practices, please do not use our Services. If you still have any questions or concerns, please contact us at [email protected].Summary of Key PointsThis summary provides key points from our privacy notice, but you can find out more details about any of these topics by clicking the link following each key point or by using our table of contents below to find the section you are looking for.What personal information do we process? When you leave a comment we will process the personal information you leave. Learn more about personal information you disclose to us.Do we process any sensitive personal information? We do not process sensitive personal information.Do we collect any information from third parties? We do not collect any information from third parties.How do we process your information? We process your information to provide, improve, and administer our Services, communicate with you, for security and fraud prevention, and to comply with law. We may also process your information for other purposes with your consent. We process your information only when we have a valid legal reason to do so. Learn more about how we process your information.In what situations and with which parties do we share personal information? We may share information in specific situations and with specific third parties. Learn more about when and with whom we share your personal information.What are your rights? Depending on where you are located geographically, the applicable privacy law may mean you have certain rights regarding your personal information. Learn more about your privacy rights.How do you exercise your rights? The easiest way to exercise your rights is by visiting damieng, or by contacting us. We will consider and act upon any request in accordance with applicable data protection laws.Want to learn more about what we do with any information we collect? Please review this privacy notice in full.Table of ContentsWhat Information Do We Collect?How Do We Process Your Information?What Legal Bases Do We Rely On To Process Your Personal Information?When And With Whom Do We Share Your Personal Information?Is Your Information Transferred Internationally?How Long Do We Keep Your Information?Do We Collect Information From Minors?What Are Your Privacy Rights?Controls For Do-Not-Track FeaturesDo United States Residents Have Specific Privacy Rights?Do We Make Updates To This Notice?How Can You Contact Us About This Notice?How Can You Review, Update, Or Delete The Data We Collect From You?1. What Information Do We Collect?In Short: We collect only personal information that you provide to us.We collect personal information that you voluntarily provide to us when you when you leave a comment on the service Services, or otherwise when you contact us.Personal Information Provided by You. The personal information that we collect depends what your submit when you leave a comment. The personal information we collect may include the following:name or aliasemail addresswebsite addressX handleGitHub profile nameSensitive Information. We do not process sensitive information.2. How Do We Process Your Information?In Short: We process your information to provide, improve, and administer our Services, communicate with you, for security and fraud prevention, and to comply with law. We may also process your information for other purposes with your consent.We process your personal information for a variety of reasons, depending on how you interact with our Services, including:To facilitate leaving and displaying comments. We may process your information so you can leave a comment and that we can display it to future visitors.To request feedback. We may process your information when necessary to request feedback and to contact you about your use of our Services.To save or protect an individual’s vital interest. We may process your information when necessary to save or protect an individual’s vital interest, such as to prevent harm.3. What Legal Bases Do We Rely On To Process Your Information?In Short: We only process your personal information when we believe it is necessary and we have a valid legal reason (i.e. legal basis) to do so under applicable law, like with your consent, to comply with laws, to provide you with services to enter into or fulfil our contractual obligations, to protect your rights, or to fulfil our legitimate business interests.If you are located in the EU or UK, you have additional legal rights. We endeavour to extend those rights to everyone.The General Data Protection Regulation (GDPR) and UK GDPR require us to explain the valid legal bases we rely on in order to process your personal information. As such, we may rely on the following legal bases to process your personal information:Consent. We may process your information if you have given us permission (i.e. consent) to use your personal information for a specific purpose. You can withdraw your consent at any time. Learn more about withdrawing your consent.Legitimate Interests. We may process your information when we believe it is reasonably necessary to achieve our legitimate business interests and those interests do not outweigh your interests and fundamental rights and freedoms.Legal Obligations. We may process your information where we believe it is necessary for compliance with our legal obligations, such as to cooperate with a law enforcement body or regulatory agency, exercise or defend our legal rights, or disclose your information as evidence in litigation in which we are involved.Vital Interests. We may process your information where we believe it is necessary to protect your vital interests or the vital interests of a third party, such as situations involving potential threats to the safety of any person.4. When And With Whom Do We Share Your Personal Information?In Short: We only share information in specific situations described in this section and/or with the following third parties.We do not and will not share your personal information with third parties other than where those third parties are providing services to us. The third parties used to provide the services are:Cloudflare for web site hosting, delivery, comment processing and content delivery network services.GitHub for holding the source code for the site including submitted comments.Amazon AWS for site backups and static hosting.We may also share your personal information with law enforcement, government agencies, or other third parties if we are compelled to do so by law, court order, or other legal process, or if we believe it is necessary to investigate, prevent, or take action regarding illegal activities, suspected fraud, or situations involving potential threats to the safety of any person.5. Is Your Information Transferred Internationally?In Short: We may transfer, store, and process your information in countries other than your own.Many of our service providers are located in the United States. If you are accessing our Services from outside the United States, please be aware that your information may be transferred to, stored, and processed by us in our facilities and by those third parties with whom we may share your personal information (see When And With Whom Do We Share Your Personal Information? above), in the United States, and other countries.If you are a resident in the European Economic Area (EEA), United Kingdom (UK), or Switzerland, then these countries may not necessarily have data protection laws or other similar laws as comprehensive as those in your country. However, we will take all necessary measures to protect your personal information in accordance with this privacy notice and applicable law.6. How Long Do We Keep Your Information?In Short: We keep your information for as long as necessary to keep hosting the site and to comply with our legal obligations.We will only keep your personal information for as long as it is necessary for the purposes set out in this privacy notice, unless a longer retention period is required or permitted by law (such as tax, accounting, or other legal requirements). No purpose in this notice will require us keeping your personal information for longer than the period of time in which users have an account with us.When we have no ongoing legitimate business need to process your personal information, we will either delete or anonymise such information, or, if this is not possible (for example, because your personal information has been stored in backup archives), then we will securely store your personal information and isolate it from any further processing until deletion is possible.7. Do We Collect Information From Minors?In Short: We do not knowingly collect data from or target children under 18 years of age.We do not knowingly collect, solicit data from, or target children under 18 years of age. By using the Services, you represent that you are at least 18 or that you are the parent or guardian of such a minor and consent to such minor dependent’s use of the Services. If we learn that personal information from users less than 18 years of age has been collected, we will deactivate the account and take reasonable measures to promptly delete such data from our records. If you become aware of any data we may have collected from children under age 18, please contact us at [email protected].8. What Are Your Privacy Rights?In Short: Depending on your state of residence in the US or in some regions, such as the European Economic Area (EEA), United Kingdom (UK), Switzerland, and Canada, you have rights that allow you greater access to and control over your personal information. You may review, change, or terminate your account at any time, depending on your country, province, or state of residence.In some regions (like the EEA, UK, Switzerland, and Canada), you have certain rights under applicable data protection laws. These may include the right (i) to request access and obtain a copy of your personal information, (ii) to request rectification or erasure; (iii) to restrict the processing of your personal information; (iv) if applicable, to data portability; and (v) not to be subject to automated decision-making. In certain circumstances, you may also have the right to object to the processing of your personal information. You can make such a request by contacting us by using the contact details provided in How Can You Contact Us About This Notice? below.We will consider and act upon any request in accordance with applicable data protection laws. If you believe we are unlawfully processing your personal information, you may also have the right to complain to your local authority.EEA members to your Member State data protection authorityUK residents to the UK data protection authoritySwitzerland residents to the Federal Data Protection and Information CommissionerWithdrawing your consentIf we are relying on your consent to process your personal information, which may be express and/or implied consent depending on the applicable law, you have the right to withdraw your consent at any time. You can withdraw your consent at any time by contacting us by using the contact details provided in How Can You Contact Us About This Notice? below.However, please note that this will not affect the lawfulness of the processing before its withdrawal nor, when applicable law allows, will it affect the processing of your personal information conducted in reliance on lawful processing grounds other than consent.Submitted Comment InformationIf you would at any time like to review or change the information in your comment or remove your comment, you can:Contact us using the contact information provided.Upon your request to remove your comment we will check your identity and then remove your comment from the public site. Due to the blockchain nature of Git it is not possible to remove the comment from the Git history but that information is visible only to ourselves and our hosting providers.If you have questions or comments about your privacy rights, you may email us at [email protected].9. Controls For Do-Not-Track FeaturesOur services do not use any kind of tracking, analytics, cookies or local storage technologies. As such, we do not respond to Do-Not-Track (‘DNT’) signals because accessing our services are anonymous and we do not perform any tracking.10. Do United States Residents Have Specific Privacy Rights?In Short: If you are a resident of California, Colorado, Connecticut, Delaware, Florida, Indiana, Iowa, Kentucky, Montana, New Hampshire, New Jersey, Oregon, Tennessee, Texas, Utah, or Virginia, you may have the right to request access to and receive details about the personal information we maintain about you and how we have processed it, correct inaccuracies, get a copy of, or delete your personal information. You may also have the right to withdraw your consent to our processing of your personal information. These rights may be limited in some circumstances by applicable law. More information is provided below.Categories of Personal Information We CollectWe have collected the following categories of personal information in the past twelve (12) months:A. IdentifiersYES Contact details, such as real name, alias, email address, X user name, GitHub profile nameB. Personal information as defined in the California Customer Records statuteYES Name, contact informationNO Education, employment, employment history, and financial informationC. Protected classification characteristics under state or federal lawNO Gender, age, date of birth, race and ethnicity, national origin, marital status, and other demographic dataD. Commercial informationNO Transaction information, purchase history, financial details, and payment informationE. Biometric informationNO — Fingerprints and voiceprintsF. Internet or other similar network activityNO Browsing history, search history, online behaviour, interest data, and interactions with our and other websites, applications, systems, and advertisementsG. Geolocation dataNO — Device locationH. Audio, electronic, sensory, or similar informationNO — Images and audio, video or call recordings created in connection with our business activitiesI. Professional or employment-related informationNO — Business contact details in order to provide you our Services at a business level or job title, work history, and professional qualifications if you apply for a job with usJ. Education InformationNO — Student records and directory informationK. Inferenc"
