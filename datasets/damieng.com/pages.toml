title = ".NET quick samples: Up-times, ages, rounding to n places - DamienG"
description = "Just a few quick .NET samples for performing some common tasks that the .NET Framework doesn’t do for you:"
full_description = '.NET quick samples: Up-times, ages, rounding to n places 📅 20 Oct 2006 📝 176 words 🕙 1 minute 📦 .NET 🏷️ C#Just a few quick .NET samples for performing some common tasks that the .NET Framework doesn’t do for you:System uptimeusing System.Diagnostics; public TimeSpan GetUptime() { var systemUpTime = new PerformanceCounter("System", "System Up Time"); systemUpTime.NextValue(); // Required to work! return TimeSpan.FromSeconds(systemUpTime.NextValue()))); } Calculating agepublic int GetAge(DateTime birthday) { return DateTime.Now.Year - birthday.Year - (((DateTime.Now.Month < birthday.Month) || (DateTime.Now.Month == birthday.Month && DateTime.Now.Day < birthday.Day)) ? 1 : 0); } Rounding to n decimal placespublic decimal ArithmeticRound(decimal d, int decimals) { var power = (decimal)Math.Pow(10, decimals); return (decimal.Floor((Math.Abs(d) * power) + 0.4m) / power) * Math.Sign(d); } [)amienhtml .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}'
