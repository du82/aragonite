["https://damieng.com/blog/2006/08/14/microsoft_announces_xna_for_homebrew"]
title = "Microsoft announces XNA for homebrew, score 1 for my prediction skills - DamienG"
description = "Over the last few months I’ve pieced together various snippets and hints from the web to come to the conclusion that Microsoft’s forthcoming XNA platform, specifically the XNA Framework version, would be available to home-brew developers and let them develop on the Xbox 360 — the first official home-brew since the PlayStation 1’s Net Yaroze!"
full_description = "Microsoft announces XNA for homebrew, score 1 for my prediction skills 📅 14 Aug 2006 📝 213 words 🕙 1 minute 📦 .NET 🏷️ C#, Xbox, XNA 💬 4 responsesOver the last few months I’ve pieced together various snippets and hints from the web to come to the conclusion that Microsoft’s forthcoming XNA platform, specifically the XNA Framework version, would be available to home-brew developers and let them develop on the Xbox 360 — the first official home-brew since the PlayStation 1’s Net Yaroze!Indeed I’ve been telling people in IRC and on forums that I believe this to be true. One friend, after messing with Managed DirectX2, told me if I was wrong about this I was in trouble. I went as so far to claim that it’s already tested and GarageGames Marble Blast Ultra was an XNA Framework title.Today Microsoft announced at their Gamefest conference the XNA Game Studio Express — a free download due this “holiday season” (a beta is out 30th August) — that lets anyone create XNA Framework based games on their PC which other people can run, on their PC.The real icing on the cake however is that for $99 USD a year you can join the “creators club” and run home-brew XNA titles on your 360 — your own or other peoples.Check out Microsoft’s XNA Developer Center and their XNA FAQ for the low-down.Phew, seems my reputation is in tact.[)amien Ben Garney01/09/2006MBU was not developed on XNA. We just ported it over to make a nice demo. Sorry. :) Steve14/08/2006I don’t think language / native code is really a security issue — if it was every online PC game under the sun would be hacked to death by now, and there would already be 360 pirate bootloaders out there — the fact that MS doesn’t supply the tools doesn’t stop people writing code for it, as proven with the original Xbox. The real key to security is signing — in the online universe you never blindly trust what the user sends you, and that is ubiquitous. Same goes for bootloaders & cheats — if they retained control over how signed / unsigned code was launched it wouldn’t matter what it was written in."
