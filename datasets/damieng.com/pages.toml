["https://damieng.com/blog/2006/11/02/xna-game-studio-beta-2-has-xbox-360-support"]
title = "XNA Game Studio Beta 2 has Xbox 360 support - DamienG"
description = "Yesterday I predicted the ability to run XNA code on our Xbox 360’s today."
full_description = "XNA Game Studio Beta 2 has Xbox 360 support 📅 2 Nov 2006 📝 207 words 🕙 1 minute 📦 .NET 🏷️ Xbox, XNA 💬 1 responseYesterday I predicted the ability to run XNA code on our Xbox 360’s today.We’re not quite there yet but we are a lot closer than most people believed this time yesterday.Contrary to preliminary info on beta 2 of XNA Game Studio before it release it DOES in fact contains the necessary pieces for 360 development.Specifically the registration window inside XNA Game Studio, shown here, the XnaTrans.exe tool for transferring builds over to the 360 and a surprise XNA Remote Performance Monitor for Xbox 360 tool.I believe we have all the software we need right now. All we need Microsoft to do is to enable the Xbox 360 side — most likely a menu option alongside the Connect to media PC that’ll throw the connection key up on the screen that the PC side needs.If anyone from the XNA team wants to turn mine on for testing my gamertag is DamienG ;-)UpdateIt would seem the XNA team are prohibited from allowing beta code to run on retail Xbox 360’s :( Let’s hope they get to a 1.0 release sooner rather than later. A comprehensive look at the other beta 2 changes can be found at the XNA Team Blog.[)amien Steve02/11/2006Any idea whether you’ll have the same 50Mb limit that LiveArcade enforces? If so, I wonder if that has to include the XNA runtime too…"
