full_description = "Mac OS System 9 on Windows 📅 21 Mar 2021 📝 1,485 words 🕙 7 minutes 📦 Apple 🏷️ macOS, 16-bit 💬 1 responseI’m often digging into old bitmap font and UX design out of curiosity — and someday hope to revive a lot of these fonts in more modern formats using a pipeline similar to that for ZX Origins so we can get all the usable fonts, screenshots etc. out of them.One limitation I’ve run into is digging into old Macintosh fonts. While James Friend’s PCE.js puts System 6 and System 7 at your fingertips when it comes to later MacOS 7.5, 8 or 9 releases the site doesn’t have you covered as PCE doesn’t support PowerPC emulation (it emulates Motorola 68000 and Intel 8086 processors).Continue reading ⇢ Typography in bits: For a few pixels more 📅 9 Aug 2016 📝 1,161 words 🕙 6 minutes 📦 Typography 🏷️ pixel fonts, 8-bit, 16-bit 💬 2 responsesA series of posts on system fonts:It’s been a while since I visited the bitmap fonts of old computers (see the bottom of the post for links), there are still some to evaluate!Continue reading ⇢ Typography in bits: Other English micros 📅 20 Jul 2014 📝 1,092 words 🕙 5 minutes 📦 Typography 🏷️ pixel fonts, 8-bit, 16-bit 💬 1 responseA series of posts on system fonts:I’ve been wanting to do a follow-up to the popular system fonts posts for some time and recent HackerNews and ArsTechnica traffic reminded me that I’m not the only one nostalgic for chunky pixel fonts of old.Continue reading ⇢ Typography in 16-bits: System fonts 📅 27 Mar 2011 📝 1,344 words 🕙 6 minutes 📦 Typography 🏷️ pixel fonts, Amiga, Atari, PC, 16-bit 💬 22 responsesA series of posts on system fonts:With the 8-bit system fonts post being so popular I just had to jump right in and look at the system fonts available on the 16-bit machines!Continue reading ⇢ The Xerox Alto mono-spaced font rises again 📅 25 Aug 2008 📝 274 words 🕙 2 minutes 📦 Typography 🏷️ coding fonts, pixel fonts, 16-bit 💬 4 responsesComputing history tells us of a mythical place where many of the innovations we take for granted today were either invented or refined to a working level at a single location known as the Xerox’s Palo-Alto Research Center (PARC).These discoveries form the basis of much of the technology we use today and include the desktop metaphor, the graphical user interface, laser printers, object orientation and Ethernet.Continue reading ⇢"
