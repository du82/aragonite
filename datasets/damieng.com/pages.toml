title = "Blog posts tagged pixel fonts - DamienG"
full_description = "ZX-Origins - free 8-bit fonts for games 📅 3 Jun 2019 📝 368 words 🕙 2 minutes 📦 Typography 🏷️ Spectrum, pixel fonts 💬 2 responsesI started designing fonts around 1987 on an 8-bit Sinclair ZX Spectrum. Many years later, my involvement in the Spectrum emulation scene led aul Dunn to ask me if I could provide fonts for his excellent BASIN Sinclair BASIC for Windows. My interest in 8x8 fonts was suitably rekindled, and I ended up delivering about 60 — some even extracted from my original +3 disk images.I wanted to get these fonts online earlier! Raw 7698-byte files, however, are only of use to BASIN users or those suitably familiar with the convoluted process and tools to get them into a Spectrum or emulator. Even trying to use them on Windows was a pain given that TrueType only cares about scalable fonts (SBIT embedded bitmaps are rare these days).Continue reading ⇢ Typography in bits: For a few pixels more 📅 9 Aug 2016 📝 1,161 words 🕙 6 minutes 📦 Typography 🏷️ pixel fonts, 8-bit, 16-bit 💬 2 responsesA series of posts on system fonts:It’s been a while since I visited the bitmap fonts of old computers (see the bottom of the post for links), there are still some to evaluate!Continue reading ⇢ Typography in bits: Other English micros 📅 20 Jul 2014 📝 1,092 words 🕙 5 minutes 📦 Typography 🏷️ pixel fonts, 8-bit, 16-bit 💬 1 responseA series of posts on system fonts:I’ve been wanting to do a follow-up to the popular system fonts posts for some time and recent HackerNews and ArsTechnica traffic reminded me that I’m not the only one nostalgic for chunky pixel fonts of old.Continue reading ⇢ Typography in 16-bits: System fonts 📅 27 Mar 2011 📝 1,344 words 🕙 6 minutes 📦 Typography 🏷️ pixel fonts, Amiga, Atari, PC, 16-bit 💬 22 responsesA series of posts on system fonts:With the 8-bit system fonts post being so popular I just had to jump right in and look at the system fonts available on the 16-bit machines!Continue reading ⇢"
