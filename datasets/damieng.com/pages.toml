["https://damieng.com/blog/2006/09/01/subtext-1-9-released"]
title = "Subtext .NET blogging system 1.9 released - DamienG"
description = "My favorite .NET blogging system, Subtext, is celebrating it’s first .NET 2.0 compatible release known as Subtext 1.9."
full_description = "Subtext .NET blogging system 1.9 released 📅 1 Sept 2006 📝 312 words 🕙 2 minutes 📦 .NET 🏷️ Subtext 💬 2 responsesMy favorite .NET blogging system, Subtext, is celebrating it’s first .NET 2.0 compatible release known as Subtext 1.9.Haack and the team have worked hard on getting it out so here’s a thanks to them.I’ve deployed it here with only a couple of minor issues which are most likely due to me previously running a self-modified version off the Subversion trunk. As a result it didn’t quite detect that it needed to upgrade the database nor that my skin was missing and it should use something else for now.If anyone else has the same problem simply remove the 1.9.0 record from your subversion_version table and it should upgrade the tables and stored procedures appropriately.Now Subtext is a Web Application Project you can add a deployment project so deploying to live is only two clicks away (you’ll need to install Web Application Project and Web Deployment Project upgrades to VS 2005 first until SP1 gets here)Right-click on Subtext.Web and choose Add Web Deployment ProjectAccept the defaults by clicking OKRight mouse button on your new Subtext.Web.csproj_deploy deployment project and choose Property PagesSet the output folder to the path to your blog’s home on your live server and hit OKSo now we have almost what we need but we don’t want the live server being deployed to every time we build so:Right-click on the SubtextSolution and choose Configuration ManagerUn-check the build for Subtext.Web.csproj_deploy and press CloseNow you can modify, run, debug and test safely on your dev machine until you are happy it’s ready for live.To deploy to live either build in Release mode or right-click on Subtext.Web.csproj_deploy and choose build.You can also have the deployment project replace sections of the web.config on the target machine — useful when your live server connects to a different database for example.[)amien"
