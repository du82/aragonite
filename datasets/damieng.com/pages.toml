["https://damieng.com/blog/tag/coding%20fonts"]
title = "Blog posts tagged coding fonts - DamienG"
full_description = "The Xerox Alto mono-spaced font rises again 📅 25 Aug 2008 📝 274 words 🕙 2 minutes 📦 Typography 🏷️ coding fonts, pixel fonts, 16-bit 💬 4 responsesComputing history tells us of a mythical place where many of the innovations we take for granted today were either invented or refined to a working level at a single location known as the Xerox’s Palo-Alto Research Center (PARC).These discoveries form the basis of much of the technology we use today and include the desktop metaphor, the graphical user interface, laser printers, object orientation and Ethernet.Continue reading ⇢ Envy Code R preview #7 (scalable coding font) 📅 26 May 2008 📝 287 words 🕙 2 minutes 📦 Typography 🏷️ coding fonts, Envy Code 💬 87 responsesIt’s been a struggle but finally after countless hours here it is, the next release of my Envy Code R monospaced (fixed-width) font designed for programmers.Many glyphs have been redrawn since preview 6 including braces, lower-case yy, 66 & 99, ampersand, dollar-sign, hash etc. One pixel was removed vertically height to make the box drawing balanced and allow more lines per screen.Continue reading ⇢ May 2008 checkpoint 📅 21 May 2008 📝 520 words 🕙 3 minutes 📦 Personal, Typography 🏷️ coding fonts, Envy Code 💬 4 responsesI am now settled into my new, albeit temporary, apartment here in Vancouver, BC working for Microsoft!For those who haven’t been following my blog long I took a job at Microsoft Canada Development Center as a developer on LINQ to SQL. It turns out my H-1B Visa has been approved and I will be moving down to Redmond in October.Continue reading ⇢ More screen-shots of Envy Code R preview #7 📅 14 Apr 2008 📝 159 words 🕙 1 minute 📦 Development, Typography 🏷️ coding fonts, Envy Code 💬 12 responsesWork on my Envy Code R programming font has resumed and I’ve spent hours playing with the hinting process to ensure it looks good at sizes above and below 10 point:Continue reading ⇢"
