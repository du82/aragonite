["https://damieng.com/blog/tag/BBC%20Micro"]
title = "Blog posts tagged BBC Micro - DamienG"
full_description = 'Revisiting my BBC Micro - display, speech & more 📅 8 Jun 2018 📝 1,585 words 🕙 8 minutes 📦 Technology 🏷️ BBC Micro, 8-bitIt’s been a while since I blogged about Revitalizing my BBC Micro. In that time, I’ve performed a few upgrades readers might find interesting.As useful as the tiny Amstrad CRT was, I wanted something bigger, brighter, and sharper. LCD is terrible for retro systems with blurry scaling attempting to draw images designed to take advantage of CRTs. Emulator authors spend significant effort trying to mimic CRT effects for an authentic retro feel — but the best option is to use a CRT.Continue reading ⇢ Revitalizing a BBC Micro 📅 29 Mar 2015 📝 1,444 words 🕙 7 minutes 📦 Technology 🏷️ BBC Micro, 8-bitRecent casualties were my Apple ][e (no disks), Acorn ARM (wouldn’t boot) and Commodore VIC 20 (poor state). Next up is my Acorn BBC Micro B:My “Beeb” is in good condition and works well, but the case screws have long since disappeared (a common theme in my collection), and it needed a good clean. These older mechanical keyboards attract dust and dirt.Continue reading ⇢ Typography in 8 bits: System fonts 📅 20 Feb 2011 📝 1,997 words 🕙 9 minutes 📦 Typography 🏷️ pixel fonts, BBC Micro, ZX Spectrum, 8-bit 💬 47 responsesA series of posts on system fonts:My love of typography originated in the 80’s with the golden years of 8-bit home computing and their 8×8 pixel monospaced fonts on low-resolution displays.Continue reading ⇢ Origins of a love affair 📅 29 Dec 2009 📝 789 words 🕙 4 minutes 📦 Personal, Technology 🏷️ BBC Micro, ZX Spectrum, 8-bit 💬 5 responsesFrom an earliest memory of a cream colored box emblazoned with letters, mostly black — some red, came an owl proclaiming allegiance to the BBC.This small box sat silently, patiently even, in our classroom for the best part of a year. On the few occasions our teacher was brave enough to flip the switch the machine would chirp into life with it’s two-tone beep and would state on capital white letters on a black background that it was BASIC. At this point the teacher would key-in the mythical incantation of CHAIN ""CHAIN "" — handily jotted on a nearby note — and feed the beast a cassette tape.Continue reading ⇢'
