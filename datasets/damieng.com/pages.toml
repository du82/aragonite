["https://damieng.com/blog/2006/06/11/first_look_applying_domaindriven_designs_and_patterns"]
title = "First look: Applying Domain-Driven Designs and Patterns - DamienG"
description = "In an attempt to quench my thirst for all things C# and having already torn through the great .NET Framework Design Guidelines and less-great Effective C# I grabbed a copy of Applying Domain-Driven Design and Patterns (With Examples in C# and .NET) by Jimmy Nilsson."
full_description = "First look: Applying Domain-Driven Designs and Patterns 📅 11 Jun 2006 📝 653 words 🕙 3 minutes 📦 .NET 🏷️ C#, books, review 💬 8 responsesIn an attempt to quench my thirst for all things C# and having already torn through the great .NET Framework Design Guidelines and less-great Effective C# I grabbed a copy of Applying Domain-Driven Design and Patterns (With Examples in C# and .NET) by Jimmy Nilsson.The book is obviously based around domain models but also gives some coverage to test-driven development, NHibernate, design patterns, refactoring, code-smells etc.This is only a first-look as I’m only up to page 130 of the 500+ the tome weighs in at but here are a few observations so far.The Impedance Mismatch Between Domain Model and Relational DatabaseOne annoyance with the book is that is identifies and discusses problems and then offers no discussion or ideas for a solution before moving onto another topic.A good example is this section which touches on the mismatch between the primitive types of .NET and SQL without the consideration of how/where to check this, the fact that SQL types can be null with no regard to .NET 2’s INullable, bit flags or ‘magic values’.How to Recognize If an Application Will Be Long LastingAnother perfect example of the previous problem. The heading asks the question but the short anecdote about how a hacked together app became mission critical fails to answer it.Use public fieldsJimmy proposes a number of techniques that fly in the face of .NET Framework Guidelines and other solid material. This is highlighted by the phrase;As long as the fields are both readable and write-able and no interception is needed … public fields are at least as good as properties.Perhaps Jimmy doesn’t know that converting a field to a property later will break binary compatibility with anything using your assembly.Expose internals for testing…expose sub-results so they are testableflies in the face of hiding the implementation and Jimmy does at least refer to this balance but the whole idea of exposing unnecessary details for the sake of being able to test them gives me a shudder.Throwing aside the whole question of whether you should write unit tests that test implementation rather than interface a better solution would be to add a#if TESTING block to classes that really need to expose their internals to your test tools and compile with that switch set in your testing environment.Use static factory classes!Jimmy extracts the factory methods into a new class and but then leaves them static. A static class throws away substitutability, extension and indeed everything that makes OO great for the sake of being able to access it like a global variable.Expose IList as read-onlyOn page 102 Jimmy refactors a “public IList Children” field firstly making it a read-only property and then creates a AddChild method which is fine but then how will he stop people modifying his IList? With ArrayList.ReadOnly(children) of course bemoaning how clients still see .Add etc.Hello Jimmy, let me introduce you to IEnumerable.Use reflection to set internal properties from Factory & Repository!Jimmy describes how some properties should be read-only but then the Factory and Repository need to set the values. He proposes reflection.Maybe Jimmy missed the memento pattern and dislikes the internal keyword.Coding standardsAll the code samples use _ for internal members — something that Microsoft guidelines and their FxCop tools are keen to stamp out. Besides being ugly it also reeks of the obsolete Hungarian naming prefixes.Storybook formatThe whole book is written in “I still remember”, “I worked on an application”, “After that, I tried Domain Models”… It makes for slow reading at times.Well that about wraps it up so far.[)amienhtml .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}"
