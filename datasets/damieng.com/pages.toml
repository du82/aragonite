full_description = "Estimating JSON size 📅 24 Jul 2024 📝 990 words 🕙 5 minutes 📦 .NET 🏷️ JSON, C# 💬 2 responsesI’ve been working on a system that heavily uses message queuing (RabbitMQ via MassTransit specifically) and occasionally the system needs to deal with large object graphs that need to be processed different — either broken into smaller pieces of work or serialized to an external source and a pointer put into the message instead.The first idea was to serialize all messages to a MemoryStream but unfortunately this has some limitations, specifically:Continue reading ⇢ Migrating from OpenTracing.NET to OpenTelemetry.NET 📅 29 Nov 2021 📝 1,338 words 🕙 6 minutes 📦 .NET 🏷️ OpenTelemetry, C#OpenTracing is an interesting project that allows for the collection of various trace sources to be correlated together to provide a timeline of activity that can span services for reporting in a central system. They were competing with OpenCenus but have now merged to form OpenTelemetry.I was recently brought in as a consultant to help migrate an existing system that used OpenTracing in .NET that recorded trace data into Jaeger so that they might migrate to the latest OpenTelemetry libraries. I thought it would be useful to document what I learnt as the migration process is not particularly clear.Continue reading ⇢ Creating OR expressions in LINQ 📅 2 Mar 2021 📝 618 words 🕙 3 minutes 📦 .NET 🏷️ LINQ, C#As everybody who has read my blog before knows, I love LINQ and miss it when coding in other languages, so it’s nice when I get a chance to use it again. When I come back to it with fresh eyes, I notice some things aren’t as easy as they should be — and this time is no exception.People often need to build up LINQ expressions at runtime based on filters or criteria a user has selected. Adding criteria is incredibly easy, as you can chain operations together on the IQueryable interface, e.g.Continue reading ⇢ Azure Pipeline Build Variables 📅 27 Mar 2019 📝 359 words 🕙 2 minutes 📦 .NET 🏷️ Azure, CI, C#Azure Pipelines has been interesting to me especially given the generous free open source tier and seemingly instant availability of build agents. The setup is easy if you’re building .NET targets with lots of useful starters available.Some areas have been frustrating, specifically build variables, the difficulty in getting the app installed, and the limitations on triggers if you can’t (non-GitHub apps can’t be installed on Enterprise accounts even if FREE).Continue reading ⇢"
