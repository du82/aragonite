description = "Damien Guard on software development, typography, vintage computing, and .NET."
full_description = "14 Feb 2025DevelopmentEnhancing content articles in Nuxt3I’ve already covered reading time and generated excerpts for Nuxt3 content but there are still a couple more things you can do to enhance your content articles.20 Dec 2024ZX Origins fontStar MakerOlaf Stapledon’s 1937 novel Star Maker sees the protagonist detach from his body and explore the infinite reaches of the universe across space and time.12 Dec 2024ZX Origins fontBrashiI was lucky enough to spend an afternoon on a practical introduction to Japanese calligraphy this year and the feel of those brushes have stuck with me.6 Dec 2024ZX Origins fontRadialLooking back at my childhood I can see early signs of my love for fonts. One such sign was the joy in using a pen to paint in the letters on the tyres of my dads car.1 Dec 2024ZX Origins fontZX AmeliaStan Davis’ 1964 typeface Amelia takes inspiration from the magnetic OCR of its time but in a friendly, rounded & bold style.25 Apr 2024DevelopmentEmail form sender with AWS Lambda, Brevo & reCAPTCHAIn this article I'll show you how to use AWS Lambda to send an email with Brevo using their API while being protected by reCAPTCHA.23 Dec 2023ZX Origins fontQuirky PCEarly PC video cards featured a familiar serif 8x8 font. Over the years different manufactures tweaked a few glyphs (ATI), made a serif version (Amstrad), or just plain stylized parts (AMI & Phoenix BIOS) all of which gave a slightly off-brand feel.17 Dec 2023ZX Origins fontEchoesA classy yet fun new typeface with a high contrast x-bar and large rounded edges.13 Dec 2023ZX Origins fontProphecyAnother new font this time with an old worn look that takes cues from ancient chiselled serif fonts while applying a hint of uncial hand lettering for a distinctly prophetic look!7 Dec 2023ZX Origins fontMoffettAs a child of the 80s I loved the Airwolf TV show with its gorgeous helicopter (a modified Bell 222A), on-board computers, synth intro music and lone wolf hero.1 Dec 2023ZX Origins fontManicWhen I saw a remake of Manic Miner called Manic Person under development on the Spectrum Computing forums I thought a custom font would polish off the look.23 Apr 2023ZX Origins fontZX MegascopeA 2023 adaptation of DJR’s (David Jonathan Ross) fantastic Megascope font for April 2023.8 Feb 2023TechnologyA quick primer on floppy disksI’ve always been fascinated by floppy disks from the crazy stories of Steve Wozniak designing the Disk II controller using a handful of logic chips and carefully-timed software to the amazing tricks to create — and break — copy protection recently popularised by 4am.23 Dec 2022ZX Origins fontShakedownThis is day 23 — the penultimate day — of my 2022 Advent of Fonts calendar and we have a 1920s art deco font with some serious serifs and some not so serious for a little character.15 Dec 2022ZX Origins fontXcerptAdvent of Font 2022’s day 15 sees this italic serif handwritten font take to the stage. Italics are uncommon on handwriting styles but why not — after all I need to mix it up!10 Dec 2022TypographyAdvent of Fonts 2022Through December 2022 I again produced a 24-day advent calendar of 8x8 pixel fonts this time primarily on Mastodon.7 Dec 2022ZX Origins fontDecorAn original font for day 7 of my 2022 Advent of Fonts calendar gifts. What we have here is a art-deco inspired font that drops the heavy single wide-stroke verticals traditional to fonts of this period and instead throws in some unexpected angles and some bar overshoot.4 Dec 2022ZX Origins fontDockingBayA December 2022 Advent of Fonts entry that pushes the capitals crossbar right up while introducing the odd serif-like flourish.22 Jul 2022SoftwareSoftwareWriting creating computer software is my passion in life and I’ve been lucky to work on some incredible projects and technologies over the years.5 May 2022ZX Origins fontKindnessOne of the very few 2022 productions this is a tiny yet heavy and friendly font for use on space-constrained screens with a proportional renderer or where you just want a more unique look with plentiful letter-spacing.19 Jan 2022ZX Origins fontBinnacleA 2021 typeface inspired by the digital dash typography from the Peugeot 208-E although I’ve not been able to track down the exact font (it’s not their rather nice custom house Peugeot font). It is a nice intersection between sharp lines and soft edges with nice wide glyphs.22 Dec 2021ZX Origins fontSkid RowThis was day 22 in my 2021 Advent of Fonts and an adaptation of the font from Amiga cracking group Skid Row with their magnetic readable blob (MOCR) bubble-letters and extended it to a full set of lower-case letters.17 Dec 2021ZX Origins fontPristineDay 16 of my 2021 Advent of Fonts saw Pristine released with a clean and a decayed version available.12 Dec 2021ZX Origins fontPunchDay 12 of my 2021 Advent of Fonts saw Punch released.4 Dec 2021ZX Origins fontPrismDay 4 in my 2021 Advent of Fonts saw the evolution of a distressed font that had been sitting around for a while. With some selective clean-up, angularization and limiting the distressing to the upper-case it came together nicely.3 Dec 2021ZX Origins fontFoundedDay 3 in my 2021 Advent of Fonts and heavily based on the typography in the Apple TV adaptation of Isaac Asimov’s Foundation series.25 Oct 2021ZX Origins fontSorceryThis mid-2021 typeface attempted to draw inspiration from the ZX Spectrum game Dragontorc by Steve Turner — a game I still have a copy of to this day but haven’t touched in 20+ years.29 Jul 2021ZX Origins fontShinobi ExtendedSEGA’s 1987 ninja-themed horizontal-scrolling arcade game Shinobi is quite the classic with its sharp visuals and responsive play.1 Jul 2021ZX Origins fontGattars ForkThis mid 2021 design originally came out of a refinement to an as-yet-unpublished “Delta” series of fonts intended for futuristic space-ship signage. Somehow it started taking on a life of it’s own picking up a few Inkscript flairs resulting in a font that’s kind of hard to put your finger on.30 May 2021ZX Origins fontAnvilAnvil is a 2021 attempt to tackle the rustic, old-lettering but readable style made popular by many a Spectrum text adventure (without actually referencing it so as to avoid copying it).9 May 2021ZX Origins fontPandaA 2020–2021 production that started off as a CRT-specific font with exaggerated corners that would blur to provide some weight to them.2 May 2021ZX Origins fontTychoA May 2021 production that hasn’t been around too long based on the typography from the opening sequences of the phenomenal The Expanse TV-show.29 Mar 2021DevelopmentShipping breaking changesBreaking changes are always work for your users. Work you are forcing them to do when they upgrade to your new version. They took a dependency on your library or software because it saved them time but now it’s costing them time.25 Mar 2021ZX Origins fontWatchfaceAn alternate take on Hourglass inspired this time by Hoefler & Co.'s Decimal typeface that captures the feel of many classical watch faces.16 Mar 2021ZX Origins fontAuthorizedA 2021 release that intersects the magnetic style of Computing 60s with a cut-out “stencil” style like No Step. A rounded-off version was added in 2022.3 Mar 2021ZX Origins fontPrinceJordan Mechner’s phenomenal ground-breaking Prince of Persia needs no introduction. Even if you weren’t around for the original, there’s a good chance you’ve heard about it or played one of the many more-modern remakes and sequels.23 Feb 2021ZX Origins fontKoncreteSlab-serif fonts are my favorite family of fonts. From the incredibly gorgeous Guardian Egyptian to Rockwell and so many other slabs.14 Feb 2021ZX Origins fontKalopsiaA 2021 release that’s been sat around since 2020 but it was time to let it free or send it to the big bit bucket in the sky. It escaped and perhaps it’ll find a new home after all.22 Jan 2021ZX Origins fontArea51A 2021 effort that started from a discussion on Twitter about 51 column text on the Spectrum. While 64 column is quite common (3 pixels + space), 42 also quite common (5 pixels + space) and of course the default of 32 (8 pixels + space) a few people have created 51 column routines such as Micro Print 85 and Handywide.7 Jan 2021ZX Origins fontFountainMy first release of 2021 started off as an attempt to tackle the italic version of DJR’s Extendomatic but I really wanted to do something different with the lower-case and so it took on it’s own life.30 Dec 2020ZX Origins fontProformaA 2020 attempt at creating a serious looking font without all the bother of squeezing in ascenders and descenders by using a small caps version I last tried with Localhost (which was designed to look quirky and not professional).24 Dec 2020ZX Origins fontQuakedI designed this font back in 2020 after seeing a screenshot of Star Quake — a game I very much enjoyed in my youth that had some nice early 8x8 typography.14 Dec 2020ZX Origins fontLampLightI’m a big fan of point ‘n click adventures from my first experience with Monkey Island through Rex Nebula, Larry, Deponia, the incredible Broken Sword series as well as Simon the Sorcerer and modern takes such as Machinarium and Ron Gilbert’s excellent Thimbleweed Park.29 Nov 2020ZX Origins fontTunerA late 2020 BASIN production inspired by the aggressive typeface found on tuner cars and logos with cut-outs and an almost stencil bold look.10 Nov 2020ZX Origins fontHalflingA 2020 exploration into old-style hand-scripts such as you’d find in Lord of the Rings or Dungeons & Dragons.10 Oct 2020ZX Origins fontPinheadThis font started life as a conversion of the 1973 Wang 2200 minicomputer bitmap font. What surprised me was how it relied on the phosphor glow to give a nice effect despite being laden with gaps. This is really how all good fonts are designed — by modifying the input so the actual output on a real environment looks optimal.30 Sept 2020ZX Origins fontRavenThis 2020 font takes inspiration from Defender of the Crown on the Amiga. I’d created a TrueType version of reproduction of that a while back.13 Aug 2020ZX Origins fontJoshuaThis is a 2020 port of my previously proportional FontStruct font WarGames-OpenCredits which is based on the opening credits of the 1983 hacker movie WarGames.31 Jul 2020ZX Origins fontInkscriptThis early 2020 typeface has sat around for far too long in the incomplete. As is often the case it felt like it needed something at the time but looking at it later revealed it’s already rather nice. Sometimes all it takes is fresh eyes and a reflection on the constraints.29 May 2020ZX Origins fontGolden AirAir America was an airline from 1950 through the 1970s that looked to all appearances to be a regular airline. In reality, it was covertly-owned by the US Government for CIA operations to access places the US Military could not. Employee William G. Sherman took courses in typography drafting and created an entire typeface based on their logo. Much later, his son reached out to the Internet in turning that typeface into a digital version, and Aaron Bell of Saja Typeworks took up the task.24 Dec 2024ZX Origins fontComicalActual comic book typefaces are rather beautiful and Comic Sans — despite the name — doesn’t really embrace the style instead opting for an unusual bendy lower case rather than the small caps angled lettering that accompanies gorgeous comic book art.18 Dec 2024ZX Origins fontTanzaniteThe Amiga was the first machine I had where fonts were no longer constrained into 8x8 pixels. I played with FED on the Workbench 1.3 extras disk for quite a while!10 Dec 2024ZX Origins fontPatrolA new and original compact and aggressive font with cut-outs, unexpected serifs, and a full lower-case all available in three weights! If you were looking at my 2019 font Needlecast and thought “I wish this was more aggressive” then this is the font for you.3 Dec 2024ZX Origins fontScarletAn all-original new bubbly font with a very low x-bar for added style and impact.1 Aug 2024DevelopmentGenerated Excerpts for Nuxt3 ContentNuxt3 has been my stack of choice for a while now and it was time to port my site over from Nuxt2 — an exercise in itself I should blog about — but more concretely is the idea of excerpts.29 Dec 2023TypographyAdvent of Fonts 2023December 2023 saw the third year of my Advent of Fonts project where I published a 24-day advent calendar of 8x8 pixel on Mastodon.21 Dec 2023ZX Origins fontMatineeThe 1920’s art deco movement has inspired a lot of design and plenty of typography to go with it. Personally having already published SIX such 8x8 typefaces I wasn’t sure I could do something new…17 Dec 2023ZX Origins fontTrack40Here’s to day 17 of my 2023 Advent of Fonts calendar — a tribute to floppy disks and all the magnetic glory with letter shaped a little like sectors on a track. I’ve always been fascinated by copy protection and the tricks you can pull off on a supposedly pure digital medium to stop it being duplicated.11 Dec 2023ZX Origins fontCompassThis new font was inspired as being the counterpoint to my Protractor font that featured straight lines and harsh angles and instead takes broad rounded strokes as far as they can be squeezed in!5 Dec 2023ZX Origins fontUndervoltThick heavy fonts with cut-outs and stylized edges aren’t new in the world of typography gracing everything from TRON to AfterBurner and beyond but this new alternate take on the style with a real lower-case should bring polish to any space game.24 Oct 2023DevelopmentA blog comment receiver for Cloudflare WorkersA number of years back I switched to a static site generator for damieng.com, firstly with Jekyll, and then with Nuxt when I wanted more flexibility. I’ve been happy with the results and the site is now faster, cheaper, more secure and easier for me to maintain.The tricky part was allowing user comments without a third-party service like Disqus. I came up with a solution that has comments into markdown files just like the rest of the site content so they can be published as part of the build process.13 Feb 2023TechnologyExtracting files from Tatung Einstein disk imagesRecently Kevin Edwards got hold of some 3″ disks containing source code to various old commercial games. He imaged them with the Kryoflux flux-level imager (Greaseweazle and FluxEngine are also good options). These tools produce highly accurate images of magnetic media that rips through copy protection and format concerns even allowing you to write the image back to disk with that in tact. This level of detail emits large files — 11.7MB for a single-sided Spectrum disk that normally holds 173KB is quite typical. 4KB data tracks happily turn into 215KB flux.7 Feb 2023DevelopmentAdding reading time to Nuxt3 contentI’ve been using Nuxt2 quite a bit for my sites (including this one) and am now starting to use Nuxt3 for a few new ones and am finding the docs lacking in many places or confusing in others so hope to post a few more tips in the coming weeks.21 Dec 2022ZX Origins fontIdentMy 2022 Advent of Fonts hits the final stretch with day 21 and this sm"
