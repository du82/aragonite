full_description = "Multiple outputs from T4 made easy – revisited 📅 6 Nov 2009 📝 1,472 words 🕙 7 minutes 📦 .NET 🏷️ Entity Framework, LINQ, T4 💬 32 responsesMy multiple outputs from t4 made easy post contained a class making it easy to produce multiple files from Visual Studio’s text templating engine (T4).While useful it had a few issues:Continue reading ⇢ LINQ to SQL resources 📅 4 Jun 2009 📝 723 words 🕙 4 minutes 📦 .NET 🏷️ LINQ, T4A quick round-up of some useful LINQ to SQL related resources that are available for developers. I’ve not used everything on this list myself so don’t take this as personal endorsement.Note: While the T4 templating language is built-in to Visual Studio 2008/2010 it does not come with syntax highlighting or IntelliSense. Check out either:Continue reading ⇢ Multiple outputs from T4 made easy 📅 22 Jan 2009 📝 972 words 🕙 5 minutes 📦 .NET 🏷️ T4, C# 💬 14 responsesAn improved version is now available.One of the things I wanted my LINQ to SQL T4 templates to do was be able to split the output into a file-per-entity. Existing solutions used either a separate set of templates with duplicate code or intrusive handling code throughout the template. Here’s my helper class to abstract the problem away from what is already complicated enough template code.Continue reading ⇢ LINQ to SQL templates updated, now on CodePlex 📅 19 Jan 2009 📝 193 words 🕙 1 minute 📦 .NET 🏷️ LINQ, T4 💬 12 responsesMy templates that allow you to customize the LINQ to SQL code-generation process (normally performed by SQLMetal/LINQ to SQL classes designer) have been updated once again.CodePlex makes it easier for people to be able to see and merge updates in with their own modified versions as well as report issues via the issue tracker etc. There is also an RSS feed that lets you keep track of releases, source updates or whatever else you are interested in.Continue reading ⇢ LINQ to SQL template for Visual Studio 2008 📅 14 Sept 2008 📝 909 words 🕙 5 minutes 📦 .NET 🏷️ LINQ, T4, C#, VB.NET 💬 24 responsesA newer version of this LINQ to SQL template is available.If you want to customize the LINQ to SQL code generation phase in your project without additional tool dependencies this could be what you’re looking for.Continue reading ⇢"
