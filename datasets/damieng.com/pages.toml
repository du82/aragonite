title = "Blog posts tagged webdev - DamienG"
full_description = "Enhancing content articles in Nuxt3 📅 14 Feb 2025 📝 324 words 🕙 2 minutes 📦 Development 🏷️ Nuxt, webdevI’ve already covered reading time and generated excerpts for Nuxt3 content but there are still a couple more things you can do to enhance your content articles.I love typography and that includes the use of em-dashes, smart-quotes and other typographic niceties. I do not however enjoying having to type them in my simple markdown files. Thankfully Nuxt3 Content v2 is built on top of Remark which has many plugins including remark-typography which does exactly what we want.Continue reading ⇢ Generated Excerpts for Nuxt3 Content 📅 1 Aug 2024 📝 377 words 🕙 2 minutes 📦 Development 🏷️ Nuxt, webdevNuxt3 has been my stack of choice for a while now and it was time to port my site over from Nuxt2 — an exercise in itself I should blog about — but more concretely is the idea of excerpts.Basically when you have a list of articles you want to show a short snippet of the article to entice the reader to click on it. This can either be the description if it’s a simple one-liner used in a card for example, or it can be the start of the article itself. Nuxt’s Content v2 supports generating excerpts for you by taking the content up to the <!--more--><!--more--> marker in the text as the excerpt.Continue reading ⇢ Nuxt Content v1 content.db database & file size 📅 14 May 2024 📝 1,674 words 🕙 8 minutes 📦 Development 🏷️ webdev, Cloudflare, NuxtI’ve been using NuxtJS successfully for a number of client sites, and this one, for quite a while. One of my clients, MKG Marketing, has produced a lot more content than the others with over 200 podcast episodes most containing a full transcript. It’s been going very well with them maintaining all the markdown content in CloudCannon and the site itself being built and published with CloudFlare pages.MKG, like DamienG.com, is a Nuxt 2 site I haven’t upgraded yet — the upgrade Nuxt guide is a bit daunting and there’s some Nuxt Content specific migration guidance to go through as well.Continue reading ⇢"
