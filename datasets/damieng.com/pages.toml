["https://damieng.com/blog/2005/11/01/nullabletypes1-3-1beta"]
title = "NullableTypes 1.3.1 beta - DamienG"
description = "In my early .NET days I ran into a problem many developers integrating with other systems do. Unlike XML with it’s xsl:nil or database fields with <null> the standard .NET value-types don’t support the concept of null for missing values. It’s such an important omission that Microsoft implemented it in .NET 2.0 (now gone RTM and up on MSDN) with a generics class named Nullable<T> and a little syntactic sugar to help it go down smoothly."
full_description = "NullableTypes 1.3.1 beta 📅 1 Nov 2005 📝 221 words 🕙 1 minute 📦 .NET 🏷️ C#In my early .NET days I ran into a problem many developers integrating with other systems do. Unlike XML with it’s xsl:nil or database fields with <null> the standard .NET value-types don’t support the concept of null for missing values. It’s such an important omission that Microsoft implemented it in .NET 2.0 (now gone RTM and up on MSDN) with a generics class named Nullable<T> and a little syntactic sugar to help it go down smoothly.For those of us still working with .NET 1.1 the NullableTypes project provides null-capable versions of all your favorite .NET types and unlike the SqlTypes included in .NET these match the System types for precision and provide support for .NET remoting and web services.Yesterday NullableTypes 1.3.1 beta was release which adds (since the last 1.2 stable release):New types (NullableGuid and NullableTimeSpan)DateTime.Add method returns new instance in keeping with the the other immutable classesSecurity enhancement (reduced needed permissions/attack surface)NullableInt16.GetHashCode now returns hash codes identical to Int16Improvements and additions to the unit testsWith my contributions now including NullableGuid, NullableTimeSpan and implementing IXmlSerializable I am finally feeling like an open source/free software contributor.I’ve got a few more ideas for NullableTypes that I’ll be working through with LuKa around unit testing and .NET 2.0 source compatibility.[)amien"
