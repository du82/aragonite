title = "Blog posts tagged Azure - DamienG"
full_description = "Azure Pipeline Build Variables 📅 27 Mar 2019 📝 359 words 🕙 2 minutes 📦 .NET 🏷️ Azure, CI, C#Azure Pipelines has been interesting to me especially given the generous free open source tier and seemingly instant availability of build agents. The setup is easy if you’re building .NET targets with lots of useful starters available.Some areas have been frustrating, specifically build variables, the difficulty in getting the app installed, and the limitations on triggers if you can’t (non-GitHub apps can’t be installed on Enterprise accounts even if FREE).Continue reading ⇢ WordPress to Jekyll part 2 - Comments & commenting 📅 28 May 2018 📝 1,049 words 🕙 5 minutes 📦 Development 🏷️ WordPress, Jekyll, Azure 💬 7 responsesI do enjoy discussion and debate, whether designing software or writing articles. Many times the comments have explored the subject further or offered corrections or additional insights and tips. They are vital on my blog, and I was disappointed that Jekyll provides nothing out of the box to handle them.Third-party solutions like Disqus exist that require you either pay a subscription or have ads inlined with the comments. That $9/month adds up. The alternative of injecting ads onto my blog to support comment infrastructure doesn’t sit right with me.Continue reading ⇢ Model binding form posts to immutable objects 📅 11 Apr 2018 📝 633 words 🕙 3 minutes 📦 .NET 🏷️ Azure, C# 💬 2 responsesI’ve been working on porting over my blog to a static site generator. I fired up an Azure Function to handle the form-comment to PR process to enable user comments to still be part of the site without using a 3rd party commenting system — more on that in the next post — and found the ASP.NET model binding for form posts distinctly lacking.It’s been great getting back into .NET and brushing up some skills making the code clear, short and reusable. What I wanted was a super-clear action on my controller that tried to collect, validate and sanitize the data then, if all was well, create the pull request or report errors.Continue reading ⇢"
