title = "Blog posts tagged Entity Framework - DamienG"
full_description = "Optimizing Sum, Count, Min, Max and Average with LINQ 📅 4 Sept 2014 📝 498 words 🕙 3 minutes 📦 .NET 🏷️ Elasticsearch, LINQ, Entity Framework, C# 💬 2 responsesLINQ is a great tool for C# programmers letting you use familiar syntax with a variety of back-end systems without having to learn another language or paradigm for many query operations.Ensuring that the queries still perform well can be a bit of a chore and one set that fails quite badly are the aggregate operations when you want more than one.Continue reading ⇢ SQL Server query plan cache – what is it and why should you care? 📅 13 Dec 2009 📝 380 words 🕙 2 minutes 📦 .NET 🏷️ Entity Framework, LINQ, SQL Server 💬 5 responsesSQL Server like all databases goes through a number of steps when it receives a command. Besides parsing and validating the command text and parameters it looks at the database schema, statistics and indexes to come up with a plan to efficiently query or change your data.You can view the plan SQL Server comes up with for a given query in SQL Management Studio by selecting Include Actual Execution Plan from the Query menu before running your query.Continue reading ⇢ Multiple outputs from T4 made easy – revisited 📅 6 Nov 2009 📝 1,472 words 🕙 7 minutes 📦 .NET 🏷️ Entity Framework, LINQ, T4 💬 32 responsesMy multiple outputs from t4 made easy post contained a class making it easy to produce multiple files from Visual Studio’s text templating engine (T4).While useful it had a few issues:Continue reading ⇢ Client-side properties and any remote LINQ provider 📅 24 Jun 2009 📝 1,083 words 🕙 5 minutes 📦 .NET 🏷️ Entity Framework, LINQ, C# 💬 43 responsesDavid Fowler on the ASP.NET team and I have been bouncing ideas about how to solve an annoyance using LINQ:If you write properties on the client, you can’t use them in remote LINQ operations.Continue reading ⇢ LINQ to SQL next steps 📅 31 Oct 2008 📝 625 words 🕙 3 minutes 📦 Microsoft 🏷️ Entity Framework, LINQ 💬 25 responsesThere has been a flurry of posts and comments in the last 24 hours over the future of LINQ to SQL so I thought it would be interesting to provide some information on what the LINQ to SQL team have been up to and what we’re working on for .NET Framework 4.0.LINQ was a new feature in .NET 3.5 that provides a store-agnostic query language syntax using a provider model.Continue reading ⇢"
