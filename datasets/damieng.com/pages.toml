title = "Compile XNA for your Xbox 360 tomorrow? - DamienG"
description = "There’s a possibility that tomorrow will see the announcement of XNA Game Studio Beta 2 with support for compiling and running applications on your Xbox 360."
full_description = "Compile XNA for your Xbox 360 tomorrow? 📅 31 Oct 2006 📝 189 words 🕙 1 minute 📦 .NET 🏷️ Xbox, XNA 💬 1 responseThere’s a possibility that tomorrow will see the announcement of XNA Game Studio Beta 2 with support for compiling and running applications on your Xbox 360.Originally this was scheduled for the final 1.0 release and would involve a $99 annual fee for the privilege but what better way to get hype and excitement than to offer it free for a month or two while it’s being polished and tested during the beta phase?Before you think I’m dreaming consider that Microsoft released the Xbox 360 Halloween firmware update this morning complete with XNA support, admittedly overshadowed by the announcement of 1080p support — another thorn in Sony’s leaky side.The official release notes made it clear that the XNA support was tied into future availability and subject to subscriptions. The page on Xbox.com just comes out and plain says “now”.Dave over at LetsKillDave says they’ll be an announcement about XNA Game Studio Beta 2 in the next 24 hours although he has previously stated that the demonstrated technique for deploying games to the 360 won’t be available until 1.0.Guess we’ll have to wait and see.[)amien Gregory Wurm31/10/2006There is no reason to think you will be able to run your code on 360 with beta 2."
