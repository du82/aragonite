full_description = "Build a great Windows 8 developer & gaming desktop for $900-$1500 📅 24 Aug 2012 📝 1,642 words 🕙 8 minutes 📦 Hardware 🏷️ Intel, Nvidia, PC 💬 6 responsesWith Windows 8 right around the corner it’s time to build a new desktop PC that will scream for both development and gaming.Having set a personal budget of around $1500 I started the arduous process that every DIY PC builder has gone through… researching parts and playing with specifications until it feels just right.Continue reading ⇢ Typography in 16-bits: System fonts 📅 27 Mar 2011 📝 1,344 words 🕙 6 minutes 📦 Typography 🏷️ pixel fonts, Amiga, Atari, PC, 16-bit 💬 22 responsesA series of posts on system fonts:With the 8-bit system fonts post being so popular I just had to jump right in and look at the system fonts available on the 16-bit machines!Continue reading ⇢ Damo Awards 2006* 📅 29 Dec 2006 📝 806 words 🕙 4 minutes 📦 Entertainment, Hardware 🏷️ PC, Xbox, PlayStation 💬 8 responsesThe Xbox 360 enjoyed its second year and titles continue to impress although the count is still a little on the weak side. The addition of 1080p output was a great bonus but one many people (myself included) can’t take advantage of without a HDMI cable and nobody seems entirely sure if the 360 can pump out a digital video signal (I doubt it).On-line support is blooming although can get very expensive if you want all the extras for games you’ve already paid for — come on guys we put £40 down gives a few freebies!Continue reading ⇢ Reinstalling Windows XP on a 750GB monster 📅 3 Nov 2006 📝 687 words 🕙 4 minutes 📦 Hardware, Microsoft 🏷️ PC 💬 2 responsesMy first ever hard-disk was a whopping 2GB when 340MB was considered high-end. £800 meant it was a steal — an end-of-line trade-only offer…A massive double-height 5.25″ SCSI behemoth from DEC that sounded like a turbine powering up. It had a gyroscopic effect that could whip your hand off and a seek noise that resonated through the house in the early hours of the morning as another caller trawled Black Ice BBS’s file library.Continue reading ⇢"
