["https://damieng.com/blog/tag/ZX%20Spectrum"]
title = "Blog posts tagged ZX Spectrum - DamienG"
full_description = 'Notes from my Spectrum +3 manual 📅 5 May 2020 📝 411 words 🕙 2 minutes 📦 Development 🏷️ ZX Spectrum, 8-bit 💬 2 responsesI’ve recently been working on a full HTML5 conversion of the Sinclair Spectrum +3 manual with full canvas-drawn screenshots and diagrams for smooth scaling/high res displays as well as some close font matching and layout as well as cross-reference links all over the place.My ZX Spectrum +3 Manual conversion is now available!Continue reading ⇢ Typography in 8 bits: System fonts 📅 20 Feb 2011 📝 1,997 words 🕙 9 minutes 📦 Typography 🏷️ pixel fonts, BBC Micro, ZX Spectrum, 8-bit 💬 47 responsesA series of posts on system fonts:My love of typography originated in the 80’s with the golden years of 8-bit home computing and their 8×8 pixel monospaced fonts on low-resolution displays.Continue reading ⇢ Origins of a love affair 📅 29 Dec 2009 📝 789 words 🕙 4 minutes 📦 Personal, Technology 🏷️ BBC Micro, ZX Spectrum, 8-bit 💬 5 responsesFrom an earliest memory of a cream colored box emblazoned with letters, mostly black — some red, came an owl proclaiming allegiance to the BBC.This small box sat silently, patiently even, in our classroom for the best part of a year. On the few occasions our teacher was brave enough to flip the switch the machine would chirp into life with it’s two-tone beep and would state on capital white letters on a black background that it was BASIC. At this point the teacher would key-in the mythical incantation of CHAIN ""CHAIN "" — handily jotted on a nearby note — and feed the beast a cassette tape.Continue reading ⇢ Adding depth to my programming ability 📅 7 Nov 2006 📝 541 words 🕙 3 minutes 📦 .NET 🏷️ BBC Micro, ZX Spectrum, XNA, 8-bit 💬 2 responsesI remember gazing at the screen of Acornsoft’s Elite in my childhood wondering what the code behind those 3D images looked like.How did they rotate like that? How did it know which lines to hide? And more importantly where I can get a good price for this cargo hold of radio-actives and platinum?Continue reading ⇢'
