title = "Blog posts tagged LINQ - DamienG"
full_description = "Creating OR expressions in LINQ 📅 2 Mar 2021 📝 618 words 🕙 3 minutes 📦 .NET 🏷️ LINQ, C#As everybody who has read my blog before knows, I love LINQ and miss it when coding in other languages, so it’s nice when I get a chance to use it again. When I come back to it with fresh eyes, I notice some things aren’t as easy as they should be — and this time is no exception.People often need to build up LINQ expressions at runtime based on filters or criteria a user has selected. Adding criteria is incredibly easy, as you can chain operations together on the IQueryable interface, e.g.Continue reading ⇢ Optimizing Sum, Count, Min, Max and Average with LINQ 📅 4 Sept 2014 📝 498 words 🕙 3 minutes 📦 .NET 🏷️ Elasticsearch, LINQ, Entity Framework, C# 💬 2 responsesLINQ is a great tool for C# programmers letting you use familiar syntax with a variety of back-end systems without having to learn another language or paradigm for many query operations.Ensuring that the queries still perform well can be a bit of a chore and one set that fails quite badly are the aggregate operations when you want more than one.Continue reading ⇢ Include for LINQ to SQL (and maybe other providers) 📅 21 May 2010 📝 672 words 🕙 3 minutes 📦 .NET 🏷️ LINQ 💬 12 responsesIt’s quite common that when you issue a query you’re going to want to join some additional tables.In LINQ this can be a big issue as associations are properties and it’s easy to end up issuing a query every time you hit one. This is referred to as the SELECT N+1 problem and tools like EF Profiler can help you find them.Continue reading ⇢ LINQ to SQL tips and tricks #3 📅 11 Jan 2010 📝 925 words 🕙 5 minutes 📦 .NET 🏷️ LINQ, C#, SQL 💬 3 responsesAnother set of useful and lesser-known LINQ to SQL techniques.LINQ to SQL supports stored procedures for retrieving entities, insert, update and delete operations, as you know. But you can also use them to perform lazy-loading of navigation properties.Continue reading ⇢"
