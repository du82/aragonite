title = "Blog posts categorised Internet - DamienG"
full_description = "Monitoring URLs for free with Google Cloud Monitor 📅 27 Feb 2016 📝 464 words 🕙 3 minutes 📦 Internet 🏷️ Google Cloud, AWS 💬 2 responsesAs somebody who runs a few sites, I like to keep an eye on them and make sure they’re up and responding correctly.My go-to for years has been Pingdom, but this year they gutted their free service (update 2021 it’s toally killed and now owned by Solarwinds… yeah, the people who got hacked and unknowingly distributed a back door to all their customers) so maybe not that service.Continue reading ⇢ DHL failure in usability 📅 26 Aug 2008 📝 675 words 🕙 3 minutes 📦 Internet 🏷️ user experience 💬 21 responsesA couple of weeks ago I ordered the latest third-generation of the DAS Keyboard — my second generation packed away back in Guernsey and the Alps-switched one from DSI incapable of reliably registering more than 2 keys on USB.Being that I’m fixed on the European keyboard layout (our enter key is double height with the backslash moved down next to Z) I had to order from Germany, specifically the guys over at getDigital.deContinue reading ⇢ DamienG.com rises from the ashes (and how to flush your DNS on Windows and Mac) 📅 2 Jun 2008 📝 122 words 🕙 1 minute 📦 Internet 💬 2 responsesOn Saturday an explosion at ISP ThePlanet took this site offline and it remained like that for 48 hours whilst power and structure were restored to the 4,000+ affected servers.It’s unfortunate it happened when the site got some DotNetKicks and StumbleUpon love for Envy Code R but at least this isn’t a commercial venture losing money to such an incident — if it was I’d have a warm standby somewhere else — something many of ThePlanet’s commercial customers didn’t.Continue reading ⇢ WordPress 2.5 notes from the field 📅 18 Apr 2008 📝 756 words 🕙 4 minutes 📦 Internet 🏷️ analytics, WordPress 💬 10 responsesIt’s been a few weeks since I upgraded to WordPress 2.5 and whilst the upgrade went well it hasn’t been all plain sailing.The Manage > FilesManage > Files administration function has been silently removed despite still appearing in the on-line documentation.Continue reading ⇢"
