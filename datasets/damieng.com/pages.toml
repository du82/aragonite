["https://damieng.com/blog/tag/8-bit"]
title = "Blog posts tagged 8-bit - DamienG"
full_description = "Extracting files from Tatung Einstein disk images 📅 13 Feb 2023 📝 2,952 words 🕙 14 minutes 📦 Technology 🏷️ Tatung Einstein, 8-bit, floppy disksRecently Kevin Edwards got hold of some 3″ disks containing source code to various old commercial games. He imaged them with the Kryoflux flux-level imager (Greaseweazle and FluxEngine are also good options). These tools produce highly accurate images of magnetic media that rips through copy protection and format concerns even allowing you to write the image back to disk with that in tact. This level of detail emits large files — 11.7MB for a single-sided Spectrum disk that normally holds 173KB is quite typical. 4KB data tracks happily turn into 215KB flux.Powerful as these tools are they don’t give you access to the files contained within that disk although some can write emulator-compatible images like DSK. As somewhat versed in 3″ media and DSK files through my archive experience and my open source Disk Image Manager tool he asked if I could take a look into achieving that.Continue reading ⇢ Notes from my Spectrum +3 manual 📅 5 May 2020 📝 411 words 🕙 2 minutes 📦 Development 🏷️ ZX Spectrum, 8-bit 💬 2 responsesI’ve recently been working on a full HTML5 conversion of the Sinclair Spectrum +3 manual with full canvas-drawn screenshots and diagrams for smooth scaling/high res displays as well as some close font matching and layout as well as cross-reference links all over the place.My ZX Spectrum +3 Manual conversion is now available!Continue reading ⇢ Revisiting my BBC Micro - display, speech & more 📅 8 Jun 2018 📝 1,585 words 🕙 8 minutes 📦 Technology 🏷️ BBC Micro, 8-bitIt’s been a while since I blogged about Revitalizing my BBC Micro. In that time, I’ve performed a few upgrades readers might find interesting.As useful as the tiny Amstrad CRT was, I wanted something bigger, brighter, and sharper. LCD is terrible for retro systems with blurry scaling attempting to draw images designed to take advantage of CRTs. Emulator authors spend significant effort trying to mimic CRT effects for an authentic retro feel — but the best option is to use a CRT.Continue reading ⇢"
