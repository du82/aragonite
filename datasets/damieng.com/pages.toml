full_description = "8 Visual Studio debugging tips – debug like a boss 📅 5 Feb 2014 📝 954 words 🕙 5 minutes 📦 .NET 🏷️ C#, debugging, Visual Studio 💬 12 responsesThere are so many useful debugging features built into Visual Studio that aren’t well-known. Here are a few of my favourites, including some recent finds in VS 2013.Clicking the left gutter to set breakpoints, you could easily believe breakpoints happen at line-level.Continue reading ⇢ 5 simple steps to publishing a NuGet package 📅 8 Jan 2014 📝 635 words 🕙 3 minutes 📦 .NET 🏷️ C#, Visual Studio, NuGet 💬 1 responseThere is a fair amount of info on making and publishing NuGet packages but I couldn’t find a simplified guide for the simple case. Here it is and start by downloading nuget.exe and putting it in your path.Supporting multiple platforms gives you a choice to make:Continue reading ⇢ My top 5 free VS 2010 extension picks 📅 22 Mar 2010 📝 386 words 🕙 2 minutes 📦 .NET 🏷️ Visual Studio, Envy Code 💬 1 responseThe Visual Studio Gallery is already home to 533 tools, controls and templates for VS 2010 and this number is sure to grow once VS 2010 hits RTM and people get to grips with the extendable new editor.Don’t forget to check out The Visual Studio Blog for more tips, tricks and tools.Continue reading ⇢ AnkhSVN 2.0 – free Subversion integration with Visual Studio 📅 9 Jul 2008 📝 102 words 🕙 1 minute 📦 .NET 🏷️ AnkhSVN, Subversion, Visual Studio 💬 3 responsesThe guys over on the AnkhSVN team have acquired new members and burnt the midnight oil to deliver a great 2.0 release with:Despite all these great features it’s absolutely freeabsolutely free and still works with older versions of Subversion and both Visual Studio 2005 and 2008.Continue reading ⇢ Experimental LINQ to SQL template 📅 25 Jun 2008 📝 317 words 🕙 2 minutes 📦 .NET, Microsoft 🏷️ C#, LINQ, T4, Visual Studio 💬 3 responsesA newer version of this LINQ to SQL template is availableWhile SQLMetal does a good job of turning your SQL schema into a set of classes for you it doesn’t let you customize the code generation process.Continue reading ⇢"
