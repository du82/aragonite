["https://damieng.com/blog/tag/macOS"]
title = "Blog posts tagged macOS - DamienG"
full_description = "Mac OS System 9 on Windows 📅 21 Mar 2021 📝 1,485 words 🕙 7 minutes 📦 Apple 🏷️ macOS, 16-bit 💬 1 responseI’m often digging into old bitmap font and UX design out of curiosity — and someday hope to revive a lot of these fonts in more modern formats using a pipeline similar to that for ZX Origins so we can get all the usable fonts, screenshots etc. out of them.One limitation I’ve run into is digging into old Macintosh fonts. While James Friend’s PCE.js puts System 6 and System 7 at your fingertips when it comes to later MacOS 7.5, 8 or 9 releases the site doesn’t have you covered as PCE doesn’t support PowerPC emulation (it emulates Motorola 68000 and Intel 8086 processors).Continue reading ⇢ Make Home & End keys behave like Windows on Mac OS X 📅 24 Apr 2015 📝 243 words 🕙 2 minutes 📦 Apple 🏷️ keyboards, macOS 💬 84 responsesI’ve been using Mac OS X daily since 2001 when I purchased my Titanium PowerBook. I still can’t get used the Home and End key behaviour.If, like me, you want Home to send you to the start of the line and not to the top of the document, then create a file called DefaultKeyBinding.dictDefaultKeyBinding.dict in your ~/Library/KeyBindings~/Library/KeyBindings folder (might need to create that folder too) with the following contents:Continue reading ⇢ Three weeks with Windows Phone 7 – a Mac users perspective 📅 26 Dec 2010 📝 1,837 words 🕙 9 minutes 📦 Microsoft, Technology 🏷️ macOS, iPhone, Gmail, Xbox 💬 6 responsesIt’s been a few weeks since I took up Microsoft’s employee offer of a free Windows Phone 7 (when you renew a 2 year contract) and combined it with AT&T’s offer of buy-one-get-one-free for my wife.So how have things been going?Continue reading ⇢ MacBook Pro 256GB SSD upgrade experience 📅 9 Apr 2010 📝 2,859 words 🕙 13 minutes 📦 Apple, Hardware 🏷️ macOS, MacBook 💬 37 responsesI wanted an SSD for some time and finally caved in. Armed with credit card, screwdriver and trusty MacBook Pro I fitted a sweet SSD and decided to document the experience.There are a bewildering number of options out there. Budget, as always, dictates the combination of speed and size available.Continue reading ⇢"
