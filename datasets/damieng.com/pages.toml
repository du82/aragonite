["https://damieng.com/blog/2007/06/13/font-rendering-philosophies-of-windows-and-mac-os-x"]
title = "Font rendering philosophies of Windows & Mac OS X - DamienG"
description = '''Jeff Atwood asked "What’s Wrong With Apple’s Font Rendering?". Well, MacOS and Windows take opposite approaches to rendering text so let's take a look at what that means.'''
full_description = "Font rendering philosophies of Windows & Mac OS X 📅 13 Jun 2007 📝 588 words 🕙 3 minutes 📦 Apple, Microsoft, Typography 🏷️ macOS, Windows 💬 54 responsesJeff Atwood asked What’s Wrong With Apple’s Font Rendering? and as I answered in the comments it comes down to philosophy:The primary difference is that Microsoft try to align everything to whole pixels vertically and sub-pixels horizontally.Apple just scale the font naturally — sometimes it fits into whole pixels other times it doesn’t.This means Windows looks sharper at the expense of not actually being a very accurate representation of the text. The Mac with it’s design/DTP background is a much more accurate representation and scales more naturally than Windows which consequently jumps around a lot vertically.Jeff and Joel both wrote follow up posts agreeing that it is one of philosophy but both are of the opinion that the Windows pixel-grid approach is the better whilst our displays are only capable of low dots-per-inch (DPI).What they don’t seem to appreciate is the compromise this causes.Here is an example of Times New Roman on Windows (left) and Mac OS (right) scaled over whole point sizes with sub-pixel precision:The two thing to note here arising from this “pixel-grid is king” approach areWindows does not scale fonts linearly as the rough line points outWindows scales the height and width but not the weight of the fontNeither of these may matter to a casual user but for professionals preparing material destined for high DPI (film or print) then it’s a world of difference. How can you layout a page on-screen and expect the same result on the page when the font isn’t the same width?The issue is reminiscent of the “I hate black bars on wide-screen films” brigade who believe that the film should be chopped, panned, scaled and otherwise distorted from the artists original intention simply so that it fits better on their display.Typography has a rich and interesting history developed and honed over centuries. It is a shame to misrepresent typefaces especially as the pixel-grid approach becomes less relevant as displays reach higher resolutions.UpdateSome additional comparisons and a note that the gamma differences between Windows and Mac will affect how you see the “other” systems rendering on your machine.Further update (21 August 2007)Thanks to Daring Fireball and ZDNet we’ve had a few more great comments which I’ve summarized here:George thinks the philosophy idea is wrong because “What percentage of Mac users sit around all day doing nothing but pre-press work?” but as Fred points out Microsoft’s desktop-user optimized rendering ends up on images and videos all over the web, thus escaping the environment for which it was crippled.George also claims that Vista’s rendering is improved, I can’t vouch for that one way or another but from looking at his screen shots the difference there could simply be the contrast level as adjusted by the ClearType tuner.Nathaniel believes that it’s not Microsoft’s job to manipulate a typeface and that if you want on-screen readability then choose a font designed for that such as Microsoft’s own Tahoma or Apple’s Lucida Grande.I’d go further and say that Microsoft’s own aggression in sticking to the grid kills font choice at the regular reading size of 10/11 point by optimizing everything to a generic sans or serif look:Windows XPMac OS XJames points to an article called Texts Rasterization Exposures that proposes a combination of using vertical hinting only and calculating horizontally to 256 levels and has some convincing screen-shots showing the benefits. Probably too late for Leopard or Vista SP1 though.[)amien"
