["https://damieng.com/blog/category/Personal"]
title = "Blog posts categorised Personal - DamienG"
full_description = 'My own Delphi story - celebrating 25 years 📅 14 Feb 2020 📝 1,593 words 🕙 8 minutes 📦 Development, Personal 🏷️ DelphiIt’s 1995, and a wiry-looking engineer in need of a haircut is working at a tech services company in the Channel Islands. The island is Jersey (you can see the French coastline on a clear day), and he’s over here for a week or two for training from his nearby Guernsey home.This company does everything from IBM AS/400 maintenance to custom PC software development — the developer involved was brought in and trained to work on a banking package on those AS/400s but has ended up on the PC development side through a series of improbable events.Continue reading ⇢ From somewhere small: Transport in the USA (well, Seattle) 📅 29 Jan 2011 📝 1,581 words 🕙 8 minutes 📦 Personal, Travel 🏷️ England, Seattle 💬 1 responseJust over three years ago I packed up my Guernsey life to come and work for Microsoft in Washington. I thought it might be fun to share some things I’ve learnt. This one is about transport.Be prepared for cross-referenced questions and mandatory fingerprinting to make you feel like a replicant even though you’ve done nothing wrong and your eyes don’t glow in the dark. The gatekeepers at immigration are all-powerful and take their job seriously so you should too as I found out when I had a case of the giggles.Continue reading ⇢ Origins of a love affair 📅 29 Dec 2009 📝 789 words 🕙 4 minutes 📦 Personal, Technology 🏷️ BBC Micro, ZX Spectrum, 8-bit 💬 5 responsesFrom an earliest memory of a cream colored box emblazoned with letters, mostly black — some red, came an owl proclaiming allegiance to the BBC.This small box sat silently, patiently even, in our classroom for the best part of a year. On the few occasions our teacher was brave enough to flip the switch the machine would chirp into life with it’s two-tone beep and would state on capital white letters on a black background that it was BASIC. At this point the teacher would key-in the mythical incantation of CHAIN ""CHAIN "" — handily jotted on a nearby note — and feed the beast a cassette tape.Continue reading ⇢'
