full_description = "Guernsey 📅 25 Feb 2008 📝 126 words 🕙 1 minuteGuernsey is where I have spent most of my life and is woefully under-represented on the Internet.If you are responsible for the country-lists on your website, please refresh it with the official ISO-1366 country list as Guernsey, Jersey and the Isle of Man were added in 2006 but are still missing from many sites.Alas, even when they are listed as countries they do not always work correctly. The Guernsey Government has some details about working with Guernsey including the post code, opportunities, content ratings etc. Many companies like Amazon just treat it as part of the UK but without the VAT/sales tax.Guernsey Estate Agents Comprehensive list of estate agents in Guernsey.Deliveries in Guernsey International delivery companies use local agents to represent them."
