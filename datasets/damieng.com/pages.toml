["https://damieng.com/blog/2007/10/14/colour-schemes-for-visual-studio"]
title = "Color schemes for Visual Studio - DamienG"
description = "The default syntax color scheme in Visual Studio seems to be stuck in the 16-color era so once you’ve found your perfect font you are going to need a great theme to go with it."
full_description = "Color schemes for Visual Studio 📅 14 Oct 2007 📝 169 words 🕙 1 minute 📦 .NET 🏷️ Visual Studio 💬 11 responsesThe default syntax color scheme in Visual Studio seems to be stuck in the 16-color era so once you’ve found your perfect font you are going to need a great theme to go with it.Here is the theme I’m currently using at home (currently on a 42″ 1900×1200 LCD TV until I can find space for my monitor) that a couple of people have asked for.To to take full advantage of this theme you will need to download:Envy Code R for the syntax font with the italics hackPalmOS for the output window’s tiny textAlternatively you could remap it to your coding font of choice (but you won’t get italics because of limitations within the Visual Studio IDE).DownloadDownload Humane for Visual Studio Atom TextMate & Xcode Eclipse (by Steve)AlternativesIf this scheme doesn’t appeal to you then why not try:Thomas Restrepo’s schemes (dark backgrounds)Scott Hanselman’s list of themesJeff Atwood’s schemes (dark & grey backgrounds)[)amien Steve19/02/2011I created an adaptation for use in Eclipse, available at: http://www.eclipsecolorthemes.org/?view=theme&amp;id=361. It is colors-only, but it is possible to reset the font as well (I’m using Incosolata). Damien Guard21/12/2009I think that is because the Palm OS font is not supported in VS2010 as it is a bitmap font. Uninstall that font and it should work. Simon Hartcher21/12/2009Is it possible to get these themes to work in VS2010 or has the format changed? I tried to import this in 2010 and it caused VS to crash until I restored it to default. rouftop08/07/2009Hi, I usually resist any changes to the IDE, but this theme was too fantastic to skip. So so so much easier on the eyes, and the italics really help clarify matters. Thank you for sharing this. rouftop Phil Desrosiers16/11/2007Any chance of getting a version of this for Eclipse? I’d love to use this with Android Sans Mono. Adrian Ritchie18/10/2007This is the first time I’ve moved away from the standard VS theme and I must say I do like this theme. It’s so much easier on the old eyes!"
