["https://damieng.com/blog/2006/10/25/parameterising-the-in-clause-of-an-sql-select-in-net"]
title = "Parameterising the IN clause of an SQL SELECT in .NET - DamienG"
description = "I’m a fan of parameterized queries with a strong dislike for building SQL (or other magic strings). Encoding, escaping errors, localization formatting problems and injection can run rampant when you think everything is a string."
full_description = '''Parameterising the IN clause of an SQL SELECT in .NET 📅 25 Oct 2006 📝 401 words 🕙 2 minutes 📦 .NET 🏷️ SQL, C# 💬 6 responsesI’m a fan of parameterized queries with a strong dislike for building SQL (or other magic strings). Encoding, escaping errors, localization formatting problems and injection can run rampant when you think everything is a string.ProblemToday I found myself a quandary as I needed to SELECT records based on a list of values I had. e.g.SELECT * FROM Products WHERE ProductCode IN ('ABC123', 'DEF456', 'GHI789') At first glance the relevant parameterized version might look like:SELECT * FROM Products WHERE ProductCode IN (@productlist) The problem here however is that if you put a comma-separate list of items into a string parameter named @productlist then it sends this to the database server:SELECT * FROM Products WHERE ProductCode IN ('ABC123, DEF456, GHI789') That’s not what we want at all.This hack isn’t pretty and it has some limitations: Only works with named parameters Could upset some DB providers that don’t like having command parameters removed or command text modified Parameter name to replace must be totally unique – i.e. not exist as a subset of another parameter name Only preserves the basic IDbCommand declared properties It should however work across DB providers and types.UsageThe previous example would mean we use exactly the expected parameterized version with @productlist in place.Add the parameter as you’d expect but instead of assigning a string/numeric to it assign something IEnumerable.Finally call this method against the command and parameter before you execute it for the ‘magic’ to happen:The ‘magic’public void ExpandDbArrayParameter(IDbCommand cmd, IDbDataParameter parameter) { if (parameter.Value is IEnumerable) { int index = 0; StringBuilder newParameterSQL = new StringBuilder(); foreach(Object value in (IEnumerable) parameter.Value) { String valueParameterName = String.Format("{0}{1}", parameter.ParameterName, ++index); IDataParameter valueParameter = cmd.CreateParameter(); valueParameter.DbType = parameter.DbType; valueParameter.Direction = parameter.Direction; valueParameter.ParameterName = valueParameterName; valueParameter.SourceColumn = parameter.SourceColumn; valueParameter.SourceVersion = parameter.SourceVersion; valueParameter.Value = value; cmd.Parameters.Add(valueParameter); if (index == 1) newParameterSQL.Append(valueParameterName); else newParameterSQL.Append("," + valueParameterName); } cmd.Parameters.Remove(parameter); cmd.CommandText = cmd.CommandText.Replace(parameter.ParameterName, newParameterSQL.ToString()); } } [)amienhtml .default .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .shiki span {color: var(--shiki-default);background: var(--shiki-default-bg);font-style: var(--shiki-default-font-style);font-weight: var(--shiki-default-font-weight);text-decoration: var(--shiki-default-text-decoration);}html .dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}html.dark .shiki span {color: var(--shiki-dark);background: var(--shiki-dark-bg);font-style: var(--shiki-dark-font-style);font-weight: var(--shiki-dark-font-weight);text-decoration: var(--shiki-dark-text-decoration);}'''
