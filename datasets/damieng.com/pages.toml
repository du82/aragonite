full_description = "A case for my MacBook Pro: Snugg wallet case review 📅 23 Dec 2013 📝 309 words 🕙 2 minutes 📦 Apple, Hardware 🏷️ MacBook, reviewI did it. Earlier this year I caved and purchased a MacBook Pro 15″ Retina after being Mac-less for a few months despite some reservations about the lack of upgrade options.Finally I had a lovely unibody machine. Now I needed something to prevent the beating my 17″ acquired over the years — something with a bit of padding to prevent the occasional bump as my backpacks tend to be very thin.Continue reading ⇢ Windows media keys on a regular keyboard 📅 16 Aug 2013 📝 253 words 🕙 2 minutes 📦 Hardware, Microsoft 🏷️ keyboards, WindowsMany full-size Windows keyboards come with extra buttons some of which are of questionable value but the volume and music controls are useful especially if you’re a programmer that likes to listen to music all day.Unfortunately my two keyboards of choice (DAS Ultimate and Topre Realforce) do not come with such controls. Neither does my MacBook Pro but Apple do the elegant thing and re-purpose some of the function keys.Continue reading ⇢ Experiencing Chromecast – my review 📅 15 Aug 2013 📝 1,471 words 🕙 7 minutes 📦 Entertainment, Hardware 🏷️ Google, review 💬 1 responseMy eagerly-awaited Chromecast arrived a couple of weeks ago. Despite the reports that Google had run out of Netflix codes my 3-month streaming code arrived a few days before by email — a great deal given that it is also valid for current Netflix customers too.The requirements for using a Chromecast are:Continue reading ⇢ Acer Aspire S7 review – two months in 📅 23 Jan 2013 📝 943 words 🕙 5 minutes 📦 Hardware, Microsoft 🏷️ review 💬 3 responsesGiven my new focus on Windows 8 apps and the loss of my MacBook Pro I was in the market for a Windows 8 laptop.My requirements were that it had a touchscreen display with at least 1080p resolution, fast (i5 or better with an SSD) and very slim. You’d be surprised at how such simple requirements leave you with such a small selection right now.Continue reading ⇢"
