full_description = "LINQ to SQL tips and tricks #3 📅 11 Jan 2010 📝 925 words 🕙 5 minutes 📦 .NET 🏷️ LINQ, C#, SQL 💬 3 responsesAnother set of useful and lesser-known LINQ to SQL techniques.LINQ to SQL supports stored procedures for retrieving entities, insert, update and delete operations, as you know. But you can also use them to perform lazy-loading of navigation properties.Continue reading ⇢ When an object-relational mapper is too much, DataReader too little 📅 22 Sept 2009 📝 248 words 🕙 2 minutes 📦 .NET 🏷️ SQL, C# 💬 16 responsesI fired up Visual Studio this evening to write a proof-of-concept app and found myself wanting strongly typed domain objects from a database but without the overhead of an object-relational mapper (the application is read-only).One solution is to write methods by hand, another is to code generate them but it would be nice to be able to do:Continue reading ⇢ LINQ to SQL tips and tricks #2 📅 12 Apr 2009 📝 534 words 🕙 3 minutes 📦 .NET 🏷️ LINQ, C#, SQL 💬 4 responsesA few more useful and lesser-known tips for using LINQ to SQL.There are times when LINQ to SQL refuses to cook up the TSQL you wanted either because it doesn’t support the feature or because it has a different idea of what makes an optimal query.Continue reading ⇢ LINQ to SQL tips and tricks #1 📅 16 Mar 2009 📝 534 words 🕙 3 minutes 📦 .NET 🏷️ LINQ, SQL, C# 💬 4 responsesBeing on the inside of a product team often leads to uncovering or stumbling upon lesser-known techniques, and here are a few little nuggets I found interesting — I have more if there is interest.LINQ to SQL lets you specify that a property is delay-loaded, meaning that not retrieved as part of normal query operations against that entity. This is particularly useful for binary and large text fields such as a photo property on an employee object that is rarely used and would cause a large amount of memory to be consumed on the client, not to mention traffic between the SQL and application.Continue reading ⇢"
