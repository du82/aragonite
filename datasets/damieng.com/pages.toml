description = "A little about Damien Guard's personal blog covering software development, user experience, .NET, and fonts."
full_description = "About me 📅 23 Jul 2022 📝 269 words 🕙 2 minutesMy name is Damien Guard and I grew up on the small picturesque island of Guernsey located off the coast of northern France. (Yes, it’s where the cows come from.)I have been developing software since 1983 when I would learn on my schools Acorn BBC Micro computers by day and my own Sinclair ZX Spectrum 48K by night. I moved on to developing commercial & internet banking, e-commerce, device drivers, databases, intranets, extranets, Windows apps, content management, frameworks and developer tools.I hold a BSc degree in Computer Science (1st with Honours) and you can email me.Career HighlightsI am currently working for MongoDB as a Contract Software Engineer on their MongoDB EF Core Provider.Some previous career highlights include:Auth0 as a Principal Software Engineer on developer experience and SDKs.GitHub working on the Atom editor and heading up the Atom IDE initiative.Centurylink Cloud — Principal Software Engineer on cloud products and time on the insights & analytics team.Attack Pattern — Chief Technical Officer/co-founder creating apps for WD, Microsoft, Xbox, Pinger & Bluetooth SIG.Netflix — Senior Engineer on the .NET based platforms including web, Windows Phone 7x & Windows 8 apps.Xbox — Senior Engineer on Xbox web marketplace and Xbox.com services including security & APIs for Windows 8.Microsoft — Engineer on LINQ to SQL & Entity Framework ORMs. Was one of the original trio behind Code First.C5 Alliance — Co-founder heading up software engineering for the first four years.Ricoh — Development of the international distributor extranet ordering system and subsequent expansion.Thanks for reading,[)amien"
