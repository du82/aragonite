["https://damieng.com/reference/faq/arcam"]
title = "ARCAM DVD Player Unofficial FAQ* - DamienG"
description = "* Including the DiVA DV88, DV88P, DV88Plus, DV89 and FMJ DV27, DV27Plus, DV27A models"
full_description = '''ARCAM DVD Player Unofficial FAQ* 📅 21 Sept 2002 📝 6,577 words 🕙 30 minutes 🏷️ DVD, Hardware* Including the DiVA DV88, DV88P, DV88Plus, DV89 and FMJ DV27, DV27Plus, DV27A modelsThis FAQ is no longer maintained and was last revised 14 March 2004. The author no longer offers support on the topic.ContentsIntroduction Welcome Release notes Older news Warning Revision history FeedbackGeneral What are the differences between the models? What are the full specifications? Can I upgrade my player? Where can I buy online? Are there any reviews online? What other players are worth looking at? Why does it make so much noise? How do I bring player out of standby without the remote? Is there an official FAQ? Where can I chat with other owners? Are there any other interesting web sites? What can I get documentation?Audio Does it support DVD-Audio? How do I access an MP3 track directly? Is it possible to play MP3's in a random order? Why can't I hear MP3's through my amplifier/decoder? What CD titles have compatibility issues? Video Does it support progressive scan? How do I change my region code? Can I play RCE titles? Is it possible to switch off Macrovision? Why does my machine flash "Play" several times at the start of discs? How do I stop some of my discs automatically activating subtitles? What DVD titles have compatibility issues? Is it possible to switch off the "multi-angle" icon that keeps appearing on my screen? Do these machines suffer from the "chroma bug"? Problems I get sound dropouts or picture freezes I get a large single-track CD or MiniDisc when copying Advanced Does it support discrete iR codes for switching on and off? What are the iR codes for programming intelligent remotes? Where can I get a pre-made configuration for my Pronto/RC5000? What is the latest firmware? How do I upgrade my firmware? How do I create the firmware upgrade discs? How do I access the service mode? IntroductionWelcome Welcome to the ARCAM DVD Player Unofficial FAQ. I wanted to know a bit more about this machine so I did some digging and researching, this is the result. Release notes I have now upgraded to a Denon DV2900. I am very happy. My DV88 will be up for sale on eBay shortly I would imagine. I am unlikely to continue maintaining the FAQ once it's gone - most of the questions I'm getting asked relate to the DV89 or FMJ series anyway. Older news Big news with the DV89 coming out in around 8-10 weeks time with DVD Audio (DVD-A) compatibility. There will be a number of upgrades available for DV88/DV88P/DV88Plus owners around 4-6 weeks after that. Pricing does not yet appear to be fixed but in the 300-750GBP range presumably depending on which model of DV88 you have. What exactly this will entail has yet to be revealed other than the upgrade will take you to full DV89 specification. Renamed "Arcam DVD Player Unofficial FAQ" as now including details of all Arcam DVD models including the new DV89. Moved to new URL at http://www.envytech.co.uk/arcamdvd the old /dv88 address will redirect you. Also lots of minor updates and a new batch of unofficial drive mechanism firmware updates. Warning I do not work for Arcam and certainly do not represent them in any way. Neither I nor Arcam will take responsibility for the application or misapplication of these instructions and their consequences to your machine, warranty or other affected items. Use are your own risk. If you are uncomfortable with this then you are not the intended audience :) Revision history Date Updates 22 March 2001 All new FAQ for Arcam DV88 26 March 2002 Added LO16 firmware note to What is the latest firmware? Added progressive scan setup menu to Does it support progressive scan? - thanks to Harry & Rafael Added 'Corrs Unplugged, The' to What DVD titles have compatibility issues? - thanks to Quentin Jackson 17 May 2002 Updated latest firmware numbers to 1.78 player and LT37 drive. Thanks to Jon Theobald, Tony Salis and Greg Noel for the info. Included new LT37 drive firmware. 30 May 2002 Added 1.78 player firmware file as well as LT23 drive firmware file. 09 June 2002 Added 1.79 player firmware to list (no files yet) and separated the two different versions of the LT drive firmware - thanks to Stephane Bernier 20 June 2002 Added notes on Predator: SE (R2) and Apocalypse Now: Redux (R2) compatibility - thanks to Brendan Mason and Alex Ayres Added info on 1.79 firmware release Added new chroma-bug question Added new Sony & Philips players to 'other players' 21 June 2002 Added mp3 format restrictions to full specifications Spellchecked and tidied up Added signal characteristics to full specifications 02 July 2002 New 1.79 player firmware Updated release notes for player firmware New Arcam documentation on firmware upgrade procedures Split up/tidied whole firmware section 11 August 2002 Revised where can I buy online to include DV27/DV88P/Prog-scan upgrades 17 August 2002 Added Futurama to compatibility section 12 September 2002 Added details of new DV88Plus model to ship in late September 07 October 2002 Added link to PDF review of the DV27 in Perfect Vision Added links of the model to photos at Audiophile Systems in General section Added note of 1.80 firmware to player firmware section 21 October 2002 Added DVD-R compatibility to list of disc types, R1 "Josie & The Pussycats" and "Death To Smoochy" to video compatibility (thanks Steve Monks) Added Les Miserables to video compatibility (thanks to Steven Phee) Added extended region code information from DVD Reviewer 13 November 2002 Added 1.80 and 1.81 firmware notes 14 November 2002 Added 1.81 firmware, adjusted current versions and added new Arcam firmware upgrade docs 04 December 2002 Added new information on the DV27Plus 26 February 2003 Added new information on the DV89 and DV88Plus to specifications, DV88Plus handbooks, DV27 Dutch handbook Information on DV89 and upgrade availability - thanks to Nick Howe New unofficial drive firmware LO16, LT24 and LT75 - thanks to Giles Herfeld Removed "How does it compare to other players" - I don't have time to maintain an up-to-date list of competitive machines Added DVD+R compatibility and request for DVD-RW/DVD+RW compatibility - thanks to Lars H. Geisler Added additional Pronto/Marantz CCF file - thanks to Simon Davies 01 March 2003 New Can I upgrade my player? section Added details of the new DV27A model (DV27 + DVD-A) 07 April 2003 Questioning missing region-code changes on 3.0.0 firmware and missing "Allow PAL" progressive on region 1 FMJ27. Added What other players are worth looking at? 04 June 2003 Corrrected DV88 > DV89 upgrade pricing. Thanks to the many people who mailed me and Arcam for *finally* confirming it. 12 June 2003 Added some thoughts on the DV89 upgrade/purchase against the Denon DVD-2900 in the release notes section. 17 February 2004 Added fix on DTS dropout from Michael Russell that involved switching from coaxial to optical TosLink. Thanks. 14 March 2004 Updated release notes to mention DVD2900 purchase and pending DV88 sale. Feedback If you want to take the FAQ over and know XHTML (not FrontPage or DreamWeaver) then let me know. I've a number of e-mail addresses but in the interests of not getting spammed by crawlers please send feedback to [email protected] and put some reference to the Arcam/DV88 in the subject as I tend to get a lot of junk mail at this address and it's hard to know what's what. GeneralWhat are the differences between the models?DiVA DV88 Arcam's base-model interlaced DVD player that can additional accommodate a progressive-scan upgrade. Replaced by the DV88Plus. Features: Zoran Vaddis III decoder Available in black or silver finish DiVA DV88P Arcam's DV88 player factory-fitted with the progressive-scan upgrade (based on the Silicon Images 503 chip). DiVA DV88Plus Arcam's replacement for the DV88 and DV88P with based progressive-scan (utilising the Vaddis V chip) started shipping in late September 2002; Zoran Vaddis V decoder Major overhaul of user-interface - alternate firmware Note that the DV88 Progressive Scan module (350GBP) can be fitted to this player to give superior progressive scan output utilising the Silicon Images 503 de-interlacer. DiVA DV89 Arcam's DVD-Audio enabled version of the DV88Plus to begin shipping in March 2003: DVD-Audio compatibility On-board Dolby Digital & DTS decoding Bass management (all formats) Note that the DV88 Progressive Scan module (350GBP) can be fitted to this player to give superior progressive scan output utilising the Silicon Images 503 de-interlacer. FMJ DV27 Shares many characteristics of the DV88 including the same progressive-scan module but additionally features: Wolfson Electronics WM8740 24bit/192kHz DACs in dual differential mode Precision clock circuits Super clean power supplies Additional toroidal power transformer for audio output circuitry Laminated, anti-vibration Sontech chassis Four layer printed circuit boards for optimum ground paths Ultra low noise performance on both audio and video Suspended transport Available in black or silver finish FMJ DV27Plus Unlike the DV88Plus this model is not referred to by name, presumably to avoid leaving dealers with older DV27 stock. You can identify the newer DV27Plus models as they have the LT75 drive firmware factory installed. Additional new features are: Zoran Vaddis V decoder Silicon Image 504 Pure Progressive Scan chip New motherboard design New on-screen display with additional options New drive transport mechanism (LT model C) Official PAL progressive outputFMJ DV27ADVD-Audio enabled version of the DV27Plus featuring: DVD-Audio compatibility On-board Dolby Digital & DTS decoding Bass management (all formats)What are the full specifications?Data formats DVD Video (DVD) DVD Audio (DVD-A) (DV89/DV27A only) Video CD (VCD) Super Video CD (SVCD) CD Audio (CD) MPEG Audio Layer-3 (MP3, 44.1kHz and 48kHz, 64-192Kb/s) High Definition CD (HDCD)Disc types DVD-5, DVD-9, DVD-10, DVD-14, DVD-18 (DVD) Compact Disc (CD) Compact Disc Recordable (CD-R) Compact Disc Re-Writable (CD-RW) DVD Recordable (DVD-R, DVD+R)* * Unofficial, some success reported including Apple PowerBook with iDVD Super Audio CD (SACD) red-book layer of dual-layer discs (stereo only)* * Requires drive firmware LO14/LT18 or higher Looking for feedback on compatibility with DVD-RW and DVD+RW discs!Audio support Dolby Digital (DD) bitstream out/stereo down-mix Dolby Digital (DD) decoding (DV89 model only) Digital Theatre Systems (dts) bitstream out Digital Theatre Systems (dts) decoding (DV89 model only) MPEG 5.1 multicam bitstream out Pulse Coded Modulation (PCM) DVD Audio (DVD-A) (DV89/DV27A only)Video formats NTSC 525i 60Hz NTSC 480p 60Hz (All models except DV88) PAL 625i 50Hz PAL 576p 50Hz* (All models except DV88) * Official only on DV27Plus,DV88Plus,DV89,DV27A models Video functions Scanning at 2x, 4x, 8x, 20x speeds forward & backward Six slow motion forward & backward Frame advance Repeat title/chapter Repeat a/b loop Three level zoom (disc option) Multi-angle (disc option)Connections RGB, Composite (SCART) Composite (phono) S-Video (mini-din) Audio left and right two pairs (4 x phono) RGB, YUV (3 x phono) YUV progressive (3 x phono) (All models except DV88) Digital audio (1 x phono, 1 x optical TOSlink) All phono sockets are gold plated Remote in socket for receiving RC5 codes (DV88Plus)Physical Width 430mm Height 85mm Depth 280mm Weight 4.9kg (DV88/DV88Plus models) Weight 6.1kg (DV27 model) Black or silver finishSignal characteristics Output level 2.2V rms for 0dB signal Output level 4.4V (DV88 model), 4V (DV88Plus model) rms for 0dB signal (HDCD playback) Frequency response 20Hz to 20kHz +0.1dB, -0.5dB Total harmonic distortion < 0.005% for 1kHz 0dB signal, measured 20Hz-20kHz un-weighted (DV88 model) Total harmonic distortion < 0.005% for 1kHz 0dB signal, measured 22Hz-22kHz un-weighted (DV88Plus model) Signal to noise ratio 105dB measured 20Hz-20kHz un-weightedPower 115V/230V switch 100V to order Consumption < 30W (DV88/DV88Plus models) Consumption < 45VA (DV27 model)Can I upgrade my player? Arcam are expected to offer a number of upgrades. Only the DV88 to DV89 upgrade is officially available. Prices with a ? next to them are estimates. If you have had an upgrade done let us know the price. From To Available Price (GBP) DV88 DV88P Now 350 DV88 DV88Plus Q2 2003 400? DV88 DV89 Q2 2003 650 DV88Plus DV89 Q2 2003 300? DV27 DV27Plus Q2 2003 400? DV27 DV27A Q2 2003 500? DV27Plus DV27A Q2 2003 300 Where can I buy online? Arcam equipment should ideally be purchased from an Arcam authorised dealer, a full list of which can be found at http://www.arcam.co.uk/support/dealers/index.cfm Retailer URL Arcam authorised Model Price Audio Excellence http://www.audio-excellence.co.uk/ ? DV88 999.90 GBP DV88P 1,299.90 GBP DV27 1,599.90 GBP Audio Lab http://www.audiolab.com/ No DV88 / DV27 POA Audiophile Systems http://www.audiophilesystems.com Yes DV88 1,599 USD DV88P 2,099 USD DV27 2,599 USD PS upgrade 600 USD Colin Walkington Audio http://www.colinwalkingtonaudio.co.nz/ Yes 3,999 NZD DSE Digital http://www.dsedigital.co.uk/ Yes POA Jeffries HiFi http://www.jeffries.co.uk/ Yes 999.90 GBP Lefflers HiFi & Hembio http://www.lefflershifi.com/ No 16,795 SEK Peter Tyson http://www.petertyson.co.uk/ Yes 999.90 GBP Are there any reviews online? Publication Player URL Rating Audio Lab DV88 http://www.audiolab.com/for_sale/MoreInfo.asp?ItemID=468 N/A Audio Review DV88 ftp://ftp.pc.ibm.com/pub/pccbbs/mobiles/uttpfide.exe 5/5 Carlton Audio Visual DV88 http://www.carltonaudiovisual.com.au/arcam_dv88.html N/A DVD Review DV88 http://www.dvdreview.net/dvdreview/content/h_reviewfull.ez?REF=100 10/10 DVD Reviewer DV88 http://www.dvd.reviewer.co.uk/reviews/hardware.asp?Index=3440 9.5/10 Home Cinema Choice DV88 http://www.homecinemachoice.com/testbench/DVDPlayers/Arcam/ArcamDV88.shtml 5/5 DV27 http://www.homecinemachoice.com/testbench/DVDPlayers/Arcam/ArcamFMJDV27.shtml 5/5 Home Entertainment DV88 http://www.home-entertainment.co.uk/firstlook_read.asp?ID=1054 5/5 Home Theatre & Sound DV88 http://www.hometheatersound.com/equipment/arcam_dv88.htm N/A Perfect Vision DV27 http://www.aslgroup.com/arcam/6126_eprint.pdf N/A T3 DV88 http://www.audiolab.com/for_sale/MoreInfo.asp?ItemID=468 5/5 What other players are worth looking at? Model DVD-Audio Progressive Multi-region Price Links Denon 3800 Yes NTSC & PAL Yes 889 GBP Unofficial FAQ Pioneer 757 Yes NTSC (PAL firmware soon) 3rd party 650 GBP Why does it make so much noise? John Dawson of Arcam had the following to say on the matter which was posted to uk.media.home-cinema on 25 January 2001. This information relates to the original DV88 models only. "On the question of drive vibration - for any player of any brand this is dependent on a number of factors - the quality of the drive itself, its suspension system, the mechanical quality of the DVD being played, and the speed at which the disc spins. The speed is fastest when loading menus and at the very beginning of'''
