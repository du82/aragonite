title = "MGT Lifetime/Universal Disc Drive FAQ - DamienG"
full_description = 'MGT Lifetime/Universal Disc Drive FAQ 📅 3 Jan 2021 📝 3,163 words 🕙 15 minutes 💬 2 responses li img { display: inline } ContentsThe Drive itselfIntroductionDocumentationSettingsConnectorCircuit diagramUsing the Lifetime/Universal withAcorn BBC MicroAmigaAmstrad CPCAtari STIBM PCMSXSinclair QLSinclair Spectrum +3Spectrum PLUS DSpectrum Beta 128The Lifetime Drive itselfIntroductionThe MGT Lifetime Drive, later renamed the EEC Universal Drive after issues regarding implied warranties and a bankruptcy, was produced by Miles Gordon Technology (MGT) in April 1989 as a floppy drive capable of connecting to most popular machines at the time.MGT was run by Alan Miles and Bruce Gordon who had previously made the PLUS D disc interface for the Spectrum and later went on to make the Sam Coupe, an incredible 8-bit machine that arrived at the end of 1989. The Sam Coupe was not particularly popular often being compared to the 16-bit Amiga and Atari’s and led to the demise of MGT in 1990 when they went into liquidation.They then setup another company called SamCo, buying the rights to the Sam Coupe and produced it and further hardware upgrades until September 1992 when they once again went into liquidation.EEC Ltd. run by William (Bill) Richardson acquired the stock of the Universal drive during this period and sold the 3.5″ internal PSU model directly via mail order advertisements in Spectrum and Sinclair QL magazines with a revised manual for £89 later dropping to £75.ModelsThere are four models of drive being either 3.5″ or 5.25″ with or without an internal power supply. These are; 350 PA (3.5" internal PSU) 350 NA (3.5" no PSU) 525 WA (5.25" internal PSU) 525 XA (5.25" no PSU)DocumentationThere is very little information on the net about this drive, most likely due to the low numbers that shipped. Here’s what we have. Transcribed MGT user manual Scanned MGT user manual Crash news release New Computer Express review Advertisement Amstrad Action review SettingsThere are a set of 6 small switches on the back of the drive used to configure the unit for drive 0 or 1 operation and compatibility with the machine you wish to use. See the individual section for the machine you wish to use for recommended settings. Switch Meaning 1 Drive select 0 2 Drive select 1 3 ? 4 ? 5 ? 6 ? ConnectorThe Lifetime Drive has a Centronics 36 pin socket at the back with pins numbered:These pins are wired for the following signals: Pin Signal Pin Signal 1 +5V (no PSU), Unused (PSU) 19 Unused 2 Ready 20 Ground 3 Side select 21 Ground 4 Read data 22 Ground 5 Write protect 23 Ground 6 Track 0 24 Ground 7 Read/write select 25 Ground 8 Write data 26 Ground 9 Step head pulse 27 Ground 10 Direction select 28 Ground 11 Motor 29 Ground 12 Unused 30 Ground 13 Drive 0 select 31 Ground 14 Drive 1 select 32 Ground 15 Index pulse 33 Ground 16 Unused 34 Ground 17 To floppy pin 4 35 Ground 18 Disk changed 36 Ground to drive Circuit diagram Preliminary unverified schematic quite likely to not work, may cause damage to equipment. Using the Lifetime withAcorn BBC MicroCompatibilityOfficial with BBC B, Master and Compact computers fitted with a disc interface and DFS/ADFS ROM.Settings As drive A As drive B Links BBC User Guide ConnectorThe BBC has a 34 pin IDC pin connector with pins numbered:Cable diagramThis diagram is untested has been extrapolated from pin diagrams. BBC pin Signal Lifetime pin BBC pin Signal Lifetime pin AmigaCompatibilityOfficial, as drive DF1 only.Settings As drive DF1 ConnectorThe Amiga has a 23 pin D-type female connector with pins numbered as:Cable diagramCreated from official MGT cable. Amiga pin Signal Lifetime pin Amiga pin Signal Lifetime pin 1 Ready 2 2 Read data 4 3 Ground 20, 35 4 Ground - 5 Ground - 6 Ground - 7 Ground 20, 35 8 Motor 11 9 Drive select 2 13 10 Reset - 11 Disk changed 18 12 +5V (DC, 250mA max) 1 13 Side select 3 14 Write protect 5 15 Track 0 6 16 Read/write select 7 17 Write data 8 18 Step head pulse 9 19 Direction select 10 20 Drive select 3 - 21 Drive select 1 14 22 Index pulse 15 23 +12V (DC, 160mA max) - Amstrad CPCCompatibilityUnofficial but successfully tested with an Amstrad CPC 6128.Settings As drive B LinksSoftware for using >200K drives?ConnectorThe CPC has a 34 pin IDC edge connector with pins numbered as:Cable diagramThe cable diagram is exactly the same as that on the Spectrum +3.Atari STCompatibilityOfficial as drive B only.Settings As drive B ConnectorThe Atari ST has a 14 pin DIN male connector with pins numbered as:Cable diagramUntested, extrapolated from signals. Atari ST pin Signal Lifetime pin Atari ST pin Signal Lifetime pin 1 Read data 4 2 Side select 3 3 Ground 36 4 Index pulse 8 5 Drive 0 select 13 6 Drive 1 select 14 7 Ground - 8 Motor 20 9 Direction 10 10 Step 9 11 Write data 8 12 Read/write select 7 13 Track 0 6 14 Write protect 5 IBM PCCompatibilityOfficial.Settings Disc ready on pic 34 Disk ready on pin 2 ConnectorThe IBM PC has a 34 pin IDC pin connector with pins numbered as:To use your Lifetime in conjunction with an existing drive you will need a floppy cable that has at least three connectors. You can then wire it up to the spare IDC pin socket mounted on the cable. These multi-drive cables normally have a small section of cable twisted to switch round the drive select. If you choose to make your cable connect to your existing drive cable then you will not need to wire it up for a secondary drive.Cable diagramUntested, extrapolated from signals. IBM PC pin Signal Lifetime pin IBM PC pin Signal Lifetime pin 1 Ground - 2 Unused - 3 Ground - 4 Unused - 5 Ground - 6 Drive D select - 7 Ground - 8 Index pulse 15 9 Ground - 10 Drive A select 13 11 Ground - 12 Drive B select 14 13 Ground - 14 Drive C select - 15 Ground - 16 Motor 11 17 Ground - 18 Direction select 10 19 Ground - 20 Step head pulse 9 21 Ground - 22 Write data 8 23 Ground - 24 Read/write select 7 25 Ground - 26 Track 0 6 27 Ground - 28 Write protect 5 29 Ground - 30 Read data 4 31 Ground - 32 Side select 3 33 Ground - 34 Unused - MSXCompatibilityUnknown.Settings As drive A As drive BLinksTo format type call format press Enter and follow on-screen instructionsConnectorThe MSX series has a 25-pin D-type female connector at the computer, numbered as:Cable diagramUntested, extrapolated from signals. MSX pin Signal Lifetime pin MSX pin Signal Lifetime pin 1 +12V - 2 +5V 1 3 +5V - 4 Index pulse 15 5 Drive 1 select 14 6 Direction select 10 7 Step head pulse 9 8 Write data 8 9 Read/write select 7 10 Track 0 6 11 Write protect 5 12 Read data 4 13 Side select 3 14 +12V - 15 +12V - 16 +12V - 17 Drive 0 select 13 18 Motor 11 19 Ready 2 20 Ground 36 21 Ground - 22 Ground - 23 Ground - 24 Ground - 25 Ground - Sinclair QLOfficial but requires disk interface.Settings As drive 1 As drive 2 Sinclair Spectrum +3CompatibilityOfficial as drive B only.Settings As drive B (official with official cable) As drive A (works with below cable spec) Links User manual DU54 formatting tool Put formatted floppy in drive at reset time to enable drive B: in ROMConnectorThe +3 has a 34 pin IDC edge connector with pins numbered as:Cable diagramUntested, extrapolated from signals. +3 pin Signal Lifetime pin +3 pin Signal Lifetime pin 1 Ready 2 2 Ground 36 3 Side select 3 4 Ground - 5 Read data 4 6 Ground - 7 Write protect 5 8 Ground - 9 Track 0 6 10 Ground - 11 Read/write select 7 12 Ground - 13 Write data 8 14 Ground - 15 Step head pulse 9 16 Ground - 17 Direction select 10 18 Ground - 19 Motor 11 20 Ground - 21 Unused - 22 Ground - 23 Drive 1 select 14 24 Ground - 25 Unused - 26 Ground - 27 Index pulse 15 28 Ground - 29 Unused - 30 Ground - 31 Unused - 32 Ground - 33 Unused - 34 Ground - Spectrum PLUS D (and Disciple)CompatibilityOfficial for PLUS D, very likely for Disciple.Settings As drive A As drive B Links User manual Disciple/PLUS D technical info ConnectorThe PLUS D has a 34 pin IDC pin connector with pins numbered as:Cable diagramUntested, extrapolated from signals. PLUS D pin Signal Lifetime pin PLUS D pin Signal Lifetime pin 1 Ground - 2 Unused - 3 Ground 36 4 Unused - 5 Ground - 6 Unused - 7 Ground - 8 Index pulse 15 9 Ground - 10 Drive 0 select 13 11 Ground - 12 Drive 1 select 14 13 Ground - 14 Unused - 15 Ground - 16 Motor 11 17 Ground - 18 Direction select 10 19 Ground - 20 Step head pulse 9 21 Ground - 22 Write data 8 23 Ground - 24 Read/write select 7 25 Ground - 26 Track 0 6 27 Ground - 28 Write protect 5 29 Ground - 30 Read data 4 31 Ground - 32 Side select - 33 Ground - 34 Unused - Spectrum Beta 128CompatibilityUnknown.Links Manual ConnectorThe Beta 128 has a 34 pin IDC pin connector with pins numbered as:Cable diagramUntested, extrapolated from signals. Beta 128 pin Signal Lifetime pin Beta 128 pin Signal Lifetime pin 1 Ground - 2 Unused - 3 Ground - 4 Unused - 5 Ground - 6 Drive D select - 7 Ground - 8 Index pulse 15 9 Ground - 10 Drive A select 13 11 Ground - 12 Drive B select 14 13 Ground - 14 Drive C select - 15 Ground - 16 Motor 11 17 Ground - 18 Direction select 10 19 Ground - 20 Step head pulse 9 21 Ground - 22 Write data 8 23 Ground - 24 Read/write select 7 25 Ground - 26 Track 0 6 27 Ground - 28 Write protect 5 29 Ground - 30 Read data 4 31 Ground - 32 Side select 3 33 Ground - 34 Unused -'
