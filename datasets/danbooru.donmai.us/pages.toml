full_description = '''blue archive ブルアカ ブルーアーカイブ ブルアカイラスト部 ブルーアーカイブイラコン 블루아카이브 블루아카 บลูอาร์ไคฟ์ ບລູອາຣໄຄຟ BlueArchive 蔚藍檔案 碧蓝档案 碧藍檔案 BA ジョジョアーカイブ 蔚蓝档案 A Korean mobile gacha RPG developed by Nexon Games (Previously known as NAT Games before the merger), MX Studio and published by Shanghai Yostar (JP) and Nexon (Global). Known as Project MX in its earliest development.The game revolves around a player character, known simply as "Sensei" (先生 / teacher), a person brought in to assist in running the city of Kivotos following the mysterious disappearance of the president of its General Student Council. The player must assist in solving local issues, managing students, and assisting various schools, while investigating the mystery behind why the GSC president left. Gameplay takes place in a 3D isometric view, but is largely automatic, with player input being limited to triggering "Skill Cards" that enable students' special abilities.The story begins with a prologue, and each set with Volumes each. starting from the 1st volume (which is Abydos) until the 5th Volume (which focuses on Hyakkiyako). Main story expansions may update every week or months.The Anime adaptation aired on April 7, 2024. The First Season included the Foreclosure Task Force and the Handyman 68, with a major focus of the First Volume in the Game's loreBlue Archive also had collaborations outside from the game, including peculiar choice such as World of Warships.Related tagsObjectsHaloPregnancy HaloHaniwa (skill level up material)PyroxeneCrafting ChamberSkill BookSouvenir DollOutfitsAbydos High school swimsuitTrinity General school swimsuitMillennium Cheerleader outfitAngel's 24 uniformMischievous Straight uniformUtnapishtim Operator uniformMemesAtsuko's Grin (meme)Dancing Arona (meme)Death Momoi (meme)Racist Momoi (meme)Sunken Colony Izuna (meme)Ugoitenai no ni atsui yo (meme)Yankumi covering for her student who faps to Blue Archive (meme)Yuuka Rocket (meme)See alsoProject KVList of Blue Archive charactersExternal linksEnglish: Website / Twitter / Wikia / WikiJapanese: Website / Twitter / WikiruKorean: Nexon Games / Twitter / NamuwikiAnime website The following tags implicate this tag: blue_archive_the_animation (learn more). Posts'''
