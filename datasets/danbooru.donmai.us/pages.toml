description = "People have been asking for a thread where feedback on uploads could be obtained. So here it is. I have some reservations about how acrimonious this thread i..."
full_description = '''jxh2154 over 14 years ago People have been asking for a thread where feedback on uploads could be obtained. So here it is. I have some reservations about how acrimonious this thread is likely to get, and if it turns into nothing more than a flame-fest, I will lock it.Rules for those requesting feedback:#1 - You are not guaranteed feedback. It is entirely voluntary to give it.#2 - Danbooru may simply not be an appropriate place for your favorite art. If so, accept this and move on.#3 - Try not to be too thin-skinned,and don't take things personally.Rules for those giving feedback:#1 - Give constructive feedback only.#2 - Refrain from name-calling. Asking people to be thick-skinned doesn't mean you're allowed to be insulting. Updated by RaisingK over 1 year ago Reply Copy ID Copy Link glasnost over 14 years ago Could we add something like "post here if your uploads keep getting deleted" to the thread name? I'm worried less about the thread turning ugly and more about it going unnoticed by new users among all the other stickies. Reply Copy ID Copy Link jxh2154 over 14 years ago I guess. Adding too many words to the subject line is another good way to get people to ignore it, though.I also was going to make a post about clearing out the stickies but I'm not sure any of them can really go yet. Reply Copy ID Copy Link Log over 14 years ago Perhaps make a single stickied thread that is just a list of important threads and unstick artist tagging/danbooruup/plural -> singular/wiki, listing those plus deletion appeal/pixiv/pixiv ####/pointless wikis/pointless pools + a couple others I'm sure would fit in here perfectly but can't recall off the top of my head.Sure it requires an extra step to access those threads but having them all listed in one location would be very helpful too. Reply Copy ID Copy Link Smashu over 14 years ago Well, a few of the images I have uploaded which I thought were pretty decent to be on danbooru have been deleted and I assume my appeal to have them re-evaluated have been ignored.Am I in the right spot? `-`glasnost said:Could we add something like "post here if your uploads keep getting deleted" to the thread name? I'm worried less about the thread turning ugly and more about it going unnoticed by new users among all the other stickies.I think if people keep a calm head, they will understand and refrain from the nastiness. If not, perhaps it will have a ban as a punishment? Reply Copy ID Copy Link'''
