description = "Azur Lane is a Chinese shipgirl-themed side-scrolling shoot 'em up mobile game developed by Shanghai Manjuu and Xiamen Yongshi and published by Yostar."
full_description = '''azur lane 碧蓝航线 碧藍航線 アズールレーン AzurLane 舰B 艦B アズレン 벽람항로 アズールレーン陣営 アズールレーン版深夜の真剣お絵かき60分一本勝負 パイズールレーン KAN-SEN アズレン漫画 オリジナルKAN-SEN アズールレーン七周年記念 Azur Lane is a Chinese shipgirl-themed side-scrolling shoot 'em up mobile game developed by Shanghai Manjuu and Xiamen Yongshi and published by Yostar.GameplayLike Kantai Collection, the game is set during World War II and mainly features collecting and controlling moe personifications of warships from major participants of World War II. Unlike Kantai Collection, it features side-scrolling shooter gameplay with mechanics akin to those of Touhou. Other gameplay elements, such as customization of a interactive backyard and marrying in-game characters, are also present. The real life factions are replaced by fictional counterparts (such as Empire of Japan being called as "Sakura Empire", United States as "Eagle Union", etc.)Unlike KanColle, the game has made an effort to distance itself from WW2 in most aspects in order to appeal to a broader audience, pushing for most fantastical designs, the implementation of collabs unrelated to WW2 naval history, the release of shipgirls based on fictional warships without proper historical precedent, post-war era warships, WW1 warships, dark versions of its existing shipgirls (METAships), shipgirls from the Age of Sail, child and idol variants of its characters, and so on.MediaThe game has been adapted into several manga and novelizations. Azur Lane: Crosswave, a PlayStation 4 / PC game, was released in 2019. A TV anime adaptation aired during Fall 2019. The game has also held an annual collaboration with World of Warships since 2017. Azur Lane: Slow Ahead, a slice-of-life 4koma series, was adapted into an anime in early 2021.HistoryAzur Lane was launched on May 25th, 2017 in China, on September 14th, 2017 in Japan, on March 27th, 2018 in Korea, on August 16th, 2018 in English, and around September 2019 in Taiwan. As of 2024, the number of players registered surpassed at least 41 million.TaggingDon't tag shipgirls with mecha musume, personification, World War II, or Imperial Japanese Navy, unless these things are present outside of the shipgirls themselves.Shipgirls of the same class may be tagged as sisters, see forum #239409 and topic #24859.Related tagsWisdom CubeRetrofit (Azur Lane)Gem (Azur Lane)Ballot (Azur Lane)See alsoAbyss HorizonBattleship GirlBattleship: War GirlBlack Surge NightBlue OathGuardian ProjectKantai CollectionVictory BellesVelvet CodeWarship Girls RList of Azur Lane charactersExternal linksChinaOfficial SiteOfficial WeiboOfficial QQ/WechatOfficial BiliBiliMoegirlpediaChinese WikiJapanOfficial SiteAnime Official SiteOfficial TwitterOfficial YoutubeJapanese WikiEnglishOfficial SiteOfficial TwitterOfficial FacebookOfficial YoutubeKoumakan: English WikiWikipedia: Azur LaneKoreanX.D. Global: Offical Site Naver caffe: Offical CaffeTwitter: Official TwitterTaiwanOfficial SiteOfficial FacebookOfficial Twitter The following tags are aliased to this tag: bilan_hangxian (learn more). Posts'''
