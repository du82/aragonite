full_description = '''nonamethanks over 2 years ago I'm setting up this automated report on tag usage as a replacement for topic #15855, which has been dead for almost a year now.Feedback and feature/alteration requests are welcome, but if you are posting them in this topic please ping me in your message, otherwise there's a chance I'll miss it.My version of the report will be more compact to avoid running into the forum length limit, so I'll be including links to non-general new tags rather than posting them here, and I'll avoid posting BUR tags altogether.Changelog:2022-07-08:Artist entries older than 6 months that have been manually nuked by someone will be marked with a ⚠️ sign, because they should be moved via BUR rather than manually. Artists without artist entries aren't marked with this.The report autoupdates every half a hour. New/repopulated tags that have been nuked since posting will be marked with a ☢️ signAdded a section for artist tags without artist entries2022-09-25:If the report becomes too long due to too many changes, "Period" version links are removed for that specific report. Updated over 2 years ago Reply Copy ID Copy Link NNTBot over 2 years ago Daily Report (2022-07-07)Period: 2022-07-07 00:00:00+00:00 - 2022-07-08 00:00:00+00:00Discussion topic: topic #16337New General TagsNameUpdater(s)VersionsPost countcrew neck » KalpacMuskoxenVersions37dreadnoughtus » MojoMojoVersions1guanlong » MojoMojoVersions1holding own ears » HoppoVersions1inostrancevia » MojoMojoVersions1muttaburrasaurus » MojoMojoVersions1pyroraptor » MojoMojoVersions2ribbed socks » KagayakuShining...Versions1saddle hair ornament » theadonicusVersions1takahashi keisuke's mazda rx-7 fd » Sean_Marco_LouisVersions1turtleneck bodysuit » ChangemynameshitVersions3after anal fingering » ☢️BillyaabobVersions1holding shotgun » ☢️ChangemynameshitVersions1Other New Tags155 new artist tags3 new copyright tags64 new character tags7 new cosplay tagsRepopulated TagsNameUpdater(s)VersionsPost co