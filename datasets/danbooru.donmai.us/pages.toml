full_description = '''kimonomiko 2 months ago BUR #35191 has been rejected.create implication hashtag-only_commentary -> commentaryThere seem to be mixed feelings on whether this tag is useful, but if we're keeping it and symbol-only commentary also implies commentary, I see no reason not to have this one do so as well. Any thoughts? Reply Copy ID Copy Link WRS hasu no kougeki ANON TOKYO commentary request Knowledge Seeker hdk5 DDFLYo TenaciousTurtleDucks Missingno2024 Ylimegirl Milky24 Freshblink Jnglmpera Red Terror John Reality pipirupirupirupipirupi alexr05 Tojitomo Unbreakable shemingwan wen TVW Alixiron Obst Cpt Skippy heartattack 2 months ago If the hashtag's text is in a non-english language, why not tag it commentary request? The text can still be translated. Why would any hashtag whether it's english or raw japanese text get tossed into commentary, simply because it's also a twitter search link? Reply Copy ID Copy Link kimonomiko 2 months ago Quoting the wiki for symbol-only commentary, "Bare, unformatted URLs and hashtags do not count against this tag." So if there is an emoji with hashtags, it doesn't need to be translated. I don't see why not having an emoji should make a difference. Reply Copy ID Copy Link WRS 2 months ago It would be my dream to get this implied but unfortunately it seems like there's a weird strong resistance against this implication but nothing against symbol-only commentary.Previous attempts can all be found in topic #25867. Reply Copy ID Copy Link ANON TOKYO 2 months ago I still don't know why people suddenly take issue with this. The clauses in symbol-only commentary and in commentary have been there for a good while, but people don't seem interested in seeing that as a problem. Yet here it suddenly is an insurmountable problem.The following quote from commentary directly contradicts the idea of not having this implication:If the only untranslated portions of a commentary are meta, such as hashtags or mentions, then tag it with commentary and not partial commentary or commentary request.If this is wrong too, a discussion should be had to remove it, instead of just ignoring it. Reply Copy ID Copy Link'''
