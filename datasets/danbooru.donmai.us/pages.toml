["https://danbooru.donmai.us/forum_topics/7713"]
title = "Artist alias request thread | Danbooru"
description = "Use this thread to request that an artist tag be renamed."
full_description = '''jjj14 over 14 years ago Use this thread to request that an artist tag be renamed.How to make a requestClick Request alias/implication at the top of the page to make a request.In the form, write your request like this: alias tanaka_takayuki -> tony_taka. This would request that Tanaka Takayuki be renamed to Tony Taka.Guidelines for requestsDon't move or delete artist tags by hand. Make a request in this thread instead.If you're a Builder level user, you can approve requests in this thread as long as the tag has less than 200 posts. It's allowed and encouraged to approve requests yourself instead of waiting for an admin.Always prefer tag aliases over renames. An alias will redirect searches from the old tag to the new one; a rename won't. Don't request renames unless the old name is highly ambiguous or highly likely to conflict with other existing tags.If you do move an artist entry manually, rename it instead of creating a new entry and manually copying the URLs from the old entry to the new one.If you do delete an artist entry manually, always empty out the URLs and put the name of the new artist tag in the other names. This lets people know where the new artist is. The only thing in a deleted artist entry should be the name of the new artist.Never delete an artist entry when it still has posts (search).Never delete an artist entry without emptying out the URLs first (search).Don't put URLs, old names, or things the artist likes to draw in their wiki. These quickly become outdated. These should be removed on sight.Try to preserve artist history when possible. When merging two artist entries, if one is very old and the other is brand new, then ideally the new one should be deleted and moved out of the way first. This way the old artist entry can simply be renamed (preserving the edit history), instead of deleted and having its URLs copied to the new artist entry (losing the edit history). To do this, rename the new artist entry to something like new_artist_name_(deleted) and delete it before aliasing the old name to the new name.Guidelines on choosing artist namesPrefer the artist's most commonly used current name.Don't use the artist's real name unless they themselves use their real name as their primary handle.Avoid unnecessary qualifiers. Don't add qualifiers to well-known artists just because their name is "too short" or "potentially ambiguous" when it's not likely their tag will actually be confused with other tags. Updated by RaisingK over 1 year ago Reply Copy ID Copy Link'''
