title = "AI-generated art check thread | Danbooru"
description = "With the ongoing issue and controversy in regards to AI-generated art (which we do not allow to be posted on this site), it is best that we start a forum thr..."
full_description = "Jisadel over 2 years ago With the ongoing issue and controversy in regards to AI-generated art (which we do not allow to be posted on this site), it is best that we start a forum thread to help identify if posts are AI-generated or not so that we can reduce the number of accidental uploading of AI art.If you're unsure whether or not a certain image or set of images is AI-generated or not, post it here to request for feedback from other users to verify if that is the case.If it has not been uploaded to Danbooru yet, post it as a link in this thread.If it is already uploaded to Danbooru, post it here as post #xxxxxxxx.Since I created the thread, my turn first: https://www.pixiv.net/en/artworks/101928725 Reply Copy ID Copy Link voclain over 2 years ago My guess is not. The lines look human and SD hands that small are usually simplified to a blob, due to the complexity and then upscaling. Reply Copy ID Copy Link mortalkombachan over 2 years ago Jerrpanese said:Since I created the thread, my turn first: https://www.pixiv.net/en/artworks/101928725Artist's first post dates from October 10, 2022, but their two uploaded art have high resolution, well drawn fingers, and doesn't have that typical shading AI arts have.So, not AI. Reply Copy ID Copy Link Nozek over 2 years ago I think there are two frequent problems with art:- quality in terms of skill- what an author wants to portrayDanbooru checks on quality and skill to a degree, but doesn't filter what vulgar, tasteless, indecent, offensive and unmannerly stuff is being portrayed. This really speaks poorly of humanity. Just browsing Danbooru is enough to be outraged, upset and feeling of losing hope of humanity. What helps is a long blacklist.Ideally, I would want to filter all the AI works with:- bad quality in terms of artistry, proficiency- poor taste of the prompterCertainly we don't want Danbooru to be flooded with millions of mediocre, similar AI synthesis works. For example, if hands are badly synthesized, then it gets deleted. And these works need to be tagged properly too. Reply Copy ID Copy Link"
