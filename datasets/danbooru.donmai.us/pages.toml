["https://danbooru.donmai.us/wiki_pages/help:blacklists"]
title = "Help:Blacklists Wiki | Danbooru"
description = "Blacklists are a way to hide posts containing tags you don't want to see."
full_description = "help:blacklists Blacklists are a way to hide posts containing tags you don't want to see.To edit your blacklist, go to your account settings under My Account >> Settings >> Basic. You'll have to create an account if you don't have one already. In the Blacklisted tags box, add the list of tags you want to hide.Blacklisted posts are hidden during searches. When posts are hidden, a Blacklist option will appear in the sidebar showing you how many posts were hidden. You can click the tags under the Blacklist section to unhide blacklisted posts.Safe mode is another option if you just want to hide non-rating:general posts.ExamplesEach rule goes on a separate line:yaoi futanari guro spoilersThis will hide all posts that are tagged either yaoi, guro, or spoilers.If you put multiple tags on one line, then only posts that have all the tags will be hidden:yaoi guroThis will only hide posts that are tagged both yaoi and guro. Posts that are tagged only yaoi or only guro will still be visible.yaoi 2boys 1boyThis will hide all posts that are tagged both tag yaoi and 2boys, also hide 1boy.NOT operatorThe - symbol is the NOT operator. It lets you hide posts that don't have certain tags.nude 1boy -1girl -multiple_girlsThis will hide all posts that are tagged nude and 1boy, but only if they don't have the tags 1girl or multiple girls.OR operatorThe ~ symbol is the OR operator. It lets you hide posts that have any of the given tags.~1boy ~2boysis the same as:1boy 2boysThis can also be used to group together multiple complex rules into a single rule:1boy -1girl -multiple_girls 2boys -1girl -multiple_girlsis the same as~1boy ~2boys -1girl -multiple_girlsMetatagsThere are a few special commands, known as metatags, that can be used to blacklist things other than regular tags:rating:explicitrating:questionablerating:sensitiverating:generalstatus:pendingstatus:flaggedstatus:deletedscore:<-5 (only less-than comparisons allowed)uploaderid:1234 (must be a user id)LimitationsWildcards are not allowed within blacklists. For example, using *boys to match the 2boys, 3boys, etc., tags won't work.Default BlacklistsThe following blacklist is automatically set for logged out users and new users:guro scat furry -rating:gSee alsohelp:user settingshelp:safe mode"
