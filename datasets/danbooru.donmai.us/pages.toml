full_description = "arknights 明日方舟 アークナイツ 명일방주 Arknights ArknightsFanArt アークナイツバトルイラコン A Chinese tower defense mobile game, developed by Hypergryph and published by Hypergryph (Simplified Chinese), Yostar (Japanese, Korean, Global) and Longcheng/Gryphline (Traditional Chinese). It is available in Google Playstore and iOS appstore.The player is put in the role of the Doctor, in charge of Rhodes Island, an organization tasked with investigating disasters caused by a mysterious ore known as Originium, and aiding those infected by Oripathy, caused by exposure to Originium. As the amnesiac Doctor, the player is put in control over the characters known as Operators.The game was first announced in 2017. Between 2017 and 2019, it was briefly available for several short beta tests. The game was officially released on May 1st, 2019. International versions in Japanese and English were released Jan. 16th, 2020. The game is available in its native Chinese, Japanese, English and Korean, each with their own app clients. For the first few years of the game's lifetime, character voices were only available in Japanese regardless of region; however, Mandarin character voices were added in September 2021, with dialectal Chinese voices for the Sui siblings added later, and English, Korean character voices along with Italian voices for Siracusian characters were added in 2022, Russian and German voices for characters from Ursus/Leithanien added in late 2023.In 2022, a spinoff RPG game, Arknights: Endfield, was announced.Related tagsObjectshannya (arknights)lungmen dollaroripathy lesioninfection monitororiginiumoriginium artsthoughtLogoscolumbia logokingdom of kazimierz logokingdom of victoria logopenguin logistics logorhine lab logorhodes island logoursus empire logokjerag logoreunion logo (arknights)Memesdragon bubblesecretary settingsChoshanland PlushySee alsoAmbience SynesthesiaMountenStudio MontagneList of Arknights charactersExternal linksOfficial Website (Chinese)Official Website (