full_description = '''RaisingK almost 5 years ago This thread is primarily for replacing missing/corrupted images and image samples. Accidental uploads may also be acceptable if the post is recent enough and not Danbooru-worthy. Replacements can only be performed by moderators and admins.Do not post here if your "full size" is:...already on Danbooru as a separate post....from a different site, unless the old source is a third-party site....visibly different (revision, etc...).I run a daily scan that automatically replaces pixiv samples, so there's no need to request their replacement here unless it's also md5 mismatch or was uploaded more than 24 hours ago.If you have an image that is better than a post that is already legitimate (sourced from the artist's Twitter, Pixiv, Tumblr, etc...), just upload it separately and make it the parent.List the post, the full size URL (or a /media_assets link), and (if different) the final source for each proposed replacement, like so:post #2276553https://68.media.tumblr.com/b578fc702ce0bd407cee71824e701e68/tumblr_nutqb3lzDO1uv6edpo1_raw.pnghttp://asprbanana.tumblr.com/post/129281319074See also:topic #14156 - old request thread Updated 6 months ago Reply Copy ID Copy Link Zurreak almost 5 years ago post #1994224 was deleted and re-uploaded to the artist's pixiv. The bookmarklet says the similarity between that post and the version on their pixiv is 99.3% Updated by Unbreakable over 1 year ago Reply Copy ID Copy Link RaisingK almost 5 years ago Zurreak said:post #1994224 was deleted and re-uploaded to the artist's pixiv. The bookmarklet says the similarity between that post and the version on their pixiv is 99.3%I don't see a point in making a replacement, and replacements do not work for id:<=2800000 anyway (issue #4260). Updated by Unbreakable over 1 year ago Reply Copy ID Copy Link Timewaitsfornoone almost 5 years ago Please replace post #3851145 with original source, I messed up. Original source https://www.facebook.com/MajiisArt/photos/a.526027981078646/1106101323071306 Updated by Unbreakable over 1 year ago Reply Copy ID Copy Link'''
