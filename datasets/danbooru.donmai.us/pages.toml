["https://danbooru.donmai.us/forum_topics/26254"]
title = "Alternate Mario Costume Implications? | Danbooru"
description = "BUR #23207 has been approved by @nonamethanks."
full_description = "Knowledge Seeker about 1 year ago BUR #23207 has been approved by @nonamethanks.Showcreate implication cat_peach -> princess_peachcreate implication dr._peach -> princess_peachcreate implication fire_peach -> princess_peachcreate implication nurse_peach -> princess_peachcreate implication princess_bitch -> princess_peachcreate implication tennis_peach -> princess_peachcreate implication winter_peach -> princess_peachcreate implication tanuki_peach -> princess_peachcreate implication elephant_princess_peach -> princess_peachcreate implication bubble_peach -> princess_peachcreate implication drill_peach -> princess_peachcreate implication princess_peach_(wedding) -> princess_peachcreate implication princess_peach_(swimwear) -> princess_peachcreate implication princess_peach_(sunshine) -> princess_peachcreate implication princess_peach_(vacation) -> princess_peachcreate implication princess_peach_(wintertime) -> princess_peachcreate implication princess_peach_(kimono) -> princess_peachcreate implication princess_peach_(yukata) -> princess_peachcreate implication princess_peach_(halloween) -> princess_peachcreate implication princess_peach_(explorer) -> princess_peachcreate implication princess_peach_(happi) -> princess_peachcreate implication swordfighter_peach -> princess_peachcreate implication detective_peach -> princess_peachcreate implication patissiere_peach -> princess_peachcreate implication kung_fu_peach -> princess_peachcreate implication ninja_peach -> princess_peachcreate implication cowgirl_peach -> princess_peachcreate implication figure_skater_peach -> princess_peachcreate implication mermaid_peach -> princess_peachcreate implication mighty_peach -> princess_peachFor a while now, the lack of implication through the Mario series has annoyed me. I presume the only reason we haven't gotten any is because no one wanted to create wiki pages and all that for the many, many, many throughout this series. Well, I seek to try and change that, and to test the idea out, we'll be using Princess Peach as our hypothetical guinea pig because she has a ridiculous amount of official alternate costumes alone (and there are some fandom ones in there too), and I know that once Princess Peach: Showtime! comes out in full, those tags for her already seen transformation tags are going to get flooded (and that's not getting into the ones that we'll have to create when the game comes out). It would be in our best interest, I feel, to go ahead and implicate all these, for easier tagging and findability (and because I like Peach and her many costume).Tags missed:Baby Peach - The younger version of Princess Peach is generally treated as her own separate character. I'm not against the idea, but I'm not too sure how many people would feel about such an implication, so I'm leaving it out for now.Lord Peach - This is basically a role reversal on the whole Bowsette idea. Bowsette does not imply Bowser or Princess Peach for a reason, so I presume this tag has the same rules applying to it.Shadow Queen - This is actually a completely separate character from Peach, even though she does possess her (and thus most art is of that possessed state). Not every artwork of the Shadow Queen involves Peach in some form (post #3446519), therefore, we cannot implicate it.EDIT 2/15/2023: New costumes so soon huh? Added Figure Skater and Mermaid to the BUR. I hope to add Dashing Thief and Mighty too as soon as we get actual art of them on here. Updated about 1 year ago Reply Copy ID Copy Link TheGamingRodent DimensionalBlade Red Terror Tincan13 Lifeblooddespairking niitaarruu sabisabi avidbookreader user 1127425 CasualStan sinapp Jijoj BigBara"
