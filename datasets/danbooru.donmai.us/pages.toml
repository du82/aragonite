full_description = '''Schrobby almost 9 years ago You think a wiki entry is wrong, inaccurate or clashes with another? Or there's a tag that needs a new entry to explain it's use? Here's the place to ask.For deletion requests go there: topic #7690 Reply Copy ID Copy Link fossilnix almost 9 years ago spellcard is aliased to spell_card, but both have wiki pages Reply Copy ID Copy Link Type-kun almost 9 years ago kneeling should be clarified to be used only for standing on both knees, and directing to one_knee for standing on a single knee. one_knee should be rewritten accordingly as well. Also, some clean-up for both tags is necessary. See topic #12803.E: snipedNevermind, already done by @Blue_Trident a few minutes before I've written this post. Danbooru is awesome :3 Updated almost 9 years ago Reply Copy ID Copy Link Blue Trident almost 9 years ago Type-kun said:manacles and shackles should be merged.Type-kun said:E: snipedNevermind, already done by @Blue_Trident a few minutes before I've written this post. Danbooru is awesome :3☜(ﾟヮﾟ) I gotchuNow that the relevant bits are merged, is the policy to get rid of manacles or keep it around? Reply Copy ID Copy Link Type-kun almost 9 years ago Blue_Trident said:☜(ﾟヮﾟ) I gotchuNow that the relevant bits are merged, is the policy to get rid of manacles or keep it around?Once everything of value is salvaged, I'm pretty sure it's "delete". Done just that. Reply Copy ID Copy Link user 460797 almost 9 years ago About the arm_up wiki:Does this fall under this tag's usage (post #2370413). The hand is only at mouth level, but the tag said as an indicator, it should be around eye level. So does this mean, that it's necessary for this tag that the hand is around eye level, or is mouth also ok? I mean...indicator is pretty vague. Reply Copy ID Copy Link Blue Trident almost 9 years ago I would use hand up or raised hand for that post. Neither of those currently has a wiki, so we should probably settle on one or other and define it.I think eye level or above for the hand is fine as an indicator for arm up, but I think the upper arm should also be away from the body at a certain angle.My suggestion is: hand up or raised hand for when only the forearm and hand are above, say, neck level; and arm up for when the hand is above eye level and the upper arm is not at the person's side. Reply Copy ID Copy Link'''
