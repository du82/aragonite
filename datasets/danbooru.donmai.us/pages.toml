full_description = '''Ars about 15 years ago As we all know, making sure an image is correctly tagged as loli or not is rather important, though it can be rather dubious at best. I'm starting this thread in hopes of getting a centralized point of checking.If you're unsure whether or not a certain image or set of images warrants the loli tag, post it here (in "post #******" format, without the qoutes) and hopefully someone more knowledgeable will clear it up.Let me start it off with post #594502 and post #584872[mod edit: updated thread title to include shota - jxh2154] Updated by GiveUpTheGhost almost 12 years ago Reply Copy ID Copy Link AZD-A9S about 15 years ago Going by the current wiki here on loli, I would say those two do need (keep) that tag.Then again you did say you are looking for someone more knowledgeable on the subject. Reply Copy ID Copy Link jxh2154 about 15 years ago Keeping it on those is okay I guess, especially the second.You're definitely going to get diverging opinions on a lot of images, though. Reply Copy ID Copy Link eric.carson about 15 years ago I know that this would involve a significant amount of development time, but what if....Image was tagged loli It then becomes something of a un-viewable item to the general public. If the people who could view the image vote it out, with a possible end result of it being removed?On the other hand, restricting the people who can "see" loli would reduce rampant vandalism...On the third hand (i know...) diverging opinons might result in a voting war....Well, anyway, now you have my thoughts. Reply Copy ID Copy Link glasnost about 15 years ago Images tagged loli or shota are already hidden from the 'general public', i.e. anyone below Privileged. See forum #4987. I'm not sure what you mean by 'vote it out', either; we already have unapproval for that sort of thing, and it's not as though the tag vandalism of late is really centered around loli in the first place. Reply Copy ID Copy Link Algasir about 15 years ago I tagged it loli due to the general lack of curves. I was mostly being on the safe side with it, so if you want to remove it, be my guest. The only reason I re-added it earlie was because the user who took it off originally was of the member level. Not trying to be prejudiced with that last statement, it's just that when I was a member, I was locked out of changing the tags for loli/shota posts, and I wasn't sure if that was changed or he used some kind of script to do it. Reply Copy ID Copy Link'''
