full_description = '''sinfulporcupine about 2 months ago we currently have no way to tag sexual (and to a lesser extent romantic) interactions between canon characters and non-characters ("mob" - faceless, designless people who are typically barely anything more than their genitals)the closest way to achieve it would be searches involving the amount of chartags (chartags:1 hetero), or tags like pov, faceless, head out of frame, but they not only are rather indirect, they also provide a multitude of false positives and negatives:someone trying to achieve that effect through chartag counts would have a hard time dealing with costume tags and group sexposts with all three tags might be identifiable, be it through clothing, dialogue, or whatever else:pov example: post #8032063faceless example: post #5701070head out of frame example: post #8645891 (though the pov person seems to be a "mob" character, the headless one is identifiable through clothing)lack of such tagging also makes it difficult to find canon x canon ship posts, especially when it comes to NSFW hetero (canon x canon might also be worthwhile considering to tag due to this, though it does appear to be a problem more unique to hetero that yaoi and yuri are less likely to experience) Reply Copy ID Copy Link Knowledge Seeker about 2 months ago Oh yes, please, a way to filter "mob" characters would do so so much good for searching. I'm all for any attempt to do so.Personally though, I think just being able to tag "mob" characters at all would be a huge step forward. As it currently stands, there is no real way to filter them, even as a Builder+. Like...maybe come up with something better than mob, but just a tag for their presence would go a long way, especially when I just wanna see the canons fucking each other.Edit: Just realized mob is already a tag...Under the traditional definition of "angry crowd" lol. So come up with something that isn't just that period. Updated about 2 months ago Reply Copy ID Copy Link Unbreakable about 2 months ago We kinda used to have a tag for this, it was called extra but it was deprecated in topic #25406 Reply Copy ID Copy Link'''
