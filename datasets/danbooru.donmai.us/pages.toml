["https://danbooru.donmai.us/forum_topics/30565"]
title = 'should there be a way to categorize "naked school attendance"? | Danbooru'
description = "as a fan of the zenra tag, i've noticed that going to school naked is a particularly popular subgenre within it. you can find hundreds of images specifically..."
full_description = '''zenzeni99 20 days ago as a fan of the zenra tag, i've noticed that going to school naked is a particularly popular subgenre within it. you can find hundreds of images specifically focused on that on pixiv and twitter by searching for 全裸登校. but while a lot of images fall under that context, they often have very different situations.a lot of them depict characters on their way to school rather than being at school, and will show them somewhere like inside a train or on a city street. even when they're at school, they can be in different parts of it like a classroom or the gym. even the """outfits""" they wear can vary, with some opting to have the characters only wear things like neck ribbons and socks and shoes, others wearing only part of a school uniform, and some going full nude. and the actual reason for attending naked can vary too, from heat to more commonly a rule or change in common sensebasically there's a lot of things that fall under this contextual umbrella and i don't think a simple search for something like zenra classroom can cover even close to all of it, so i was just wondering if a new tag or pool or something would be appropriate.i understand the potential for ambiguity here, because there's no doubt a ton of 'naked in a classroom' images and other similar things, but most of the time these images are just blatantly tagged somewhere at the source as 全裸登校 or something similar, and when they aren't, then i don't think it's too hard to figure out the context of the image in the same way you would for any other tag that relies on context like zenra or change_in_common_sense. and there's also the potential for the characters to be upset and embarrassed about the situation, so i don't think it all falls under simple 'casual nudity' either.what do you all think? Reply Copy ID Copy Link TKX 20 days ago Tbh, I feel like it's niche within a niche, which means if there are enough posts for it then maybe we can make a tag out of it. Reply Copy ID Copy Link'''
