title = "D&AD Shift Sydney | Creative Advertising Placement Opportunities | D&AD"
description = "D&AD Shift Sydney is a free workshop for aspiring creatives in Sydney, Australia."
full_description = '''Sydney, it's time to #SHIFTCREATIVITY D&AD Shift Sydney is an award-winning, free industry-led night school for self-taught creatives entering the advertising, design and creative industry from outside traditional pathways in Sydney. Meet the Sydney Class of 2024 below, the talent you need. #product-button-441795-46792 { background-color: #ff382e; border-color: #ff382e; color: #000; } #product-button-441795-46792:hover, #product-button-441795-46792:active { background-color: #FFF; color: #000; border-color: #FFF; } Meet Class of '24 Shift Stories Get involved 5 months, 18 Shifters, 3 pitches and 1 showcase D&AD Shifters have embraced five months of online and in-person learning with more than 15 creative agencies across multiple disciplines, from creative direction and design thinking to ideation, pitching, and strategy. For this year's cohort of 18 Shifters, the Showcase is the culmination of five months of growing, developing, and defining their craft. They've spent countless hours at various agencies, learning directly from industry experts, and answering client briefs from We Are Warriors, Mastercard and Pepsi. Now ready to apply their skills to the industry, here's your opportunity to see what they're made of. Explore the work D&AD Shift Sydney Class of 2024 Meet this year's cohort and filter by creative discipline. Discipline Art Director Creative Designer Producer Strategist Writer #item-124408:hover .item-title, .og-expand #item-124408 .item-title { font-variation-settings: "wdth" None; } Alice Linn Alice Linn Alice Linn Alice Linn Alice Linn (She/Her) Creative / Writer Instagram: @butrfly_fx Big hair, big ideas as they say! I'm Alice, born in the 90's with creativity running through my veins. Ive always got a buzz out of inventing new ideas and I love a good pun. A unique and curious individual, I love to spark positivity through humour, change, emotion and experience. Curiosity may have killed the cat, but it defiantly saved the world of my imagination. Go to Alice's portfolio → #item-124409:hover .item-title, .og-expand #item-124409 .item-title { font-variation-settings: "wdth" None; } Brayden Stairmand Brayden Stairmand Brayden Stairmand Brayden Stairmand Brayden Stairmand (He/Him) Creative Direction / Photography & Filmmaking Instagram: @bigflowersmallfield I'm a wearer of many creative hats and a lover of art and creation. My heart is behind the lens, capturing my own unique view of the world around me. My curious nature has led me down a wide path of creative adventure, giving me a wealth of knowledge and light bulb moments. I aspire to collaborate and work with unique and diverse creatives as well as pave a way for others to follow their dreams. Go to Brayden's portfolio → #item-124410:hover .item-title, .og-expand #item-124410 .item-title { font-variation-settings: "wdth" None; } Brittney Angus Brittney Angus Brittney Angus Brittney Angus Brittney Angus (She/Her) Creative Direction / Graphic Design Instagram: @brittneyanguscreative Part of the 3% that make up less than 1% in the creative industry, I'm a First Nations Graphic Designer, creative thinker, and problem solver. Collecting clothing-brand tags sparked a passion for marketing and design. Since then, I’ve built brand identities for First Nations-led businesses and entrepreneurs. ​As an aspiring Art Director, fueled by representation, community, and culture, I’m a determined creator who thrives on challenges, motivated to deliver impactful work with a fresh perspective. Go to Brittney's portfolio → #item-124411:hover .item-title, .og-expand #item-124411 .item-title { font-variation-settings: "wdth" None; } Cameron Kapadia Cameron Kapadia Cameron Kapadia Cameron Kapadia Cameron Kapadia (He/Him) Strategy / Creative LinkedIn Since childhood, I've found joy in amusing others and uncovering buried truths. My inspiration stems from both the extraordinary and mundane moments in life. I embrace randomness, whether sharing unprompted movie ideas mid-conversation or pairing unexpected combinations. The chaos and contrasts of earth have led me to celebrate individuality and weirdness during my time here. With Shift's support and approval, I couldn't imagine working or living any other way. Go to Cameron's portfolio → #item-124412:hover .item-title, .og-expand #item-124412 .item-title { font-variation-settings: "wdth" None; } Carissa Costa Carissa Costa Carissa Costa Carissa Costa Carissa Costa (She/Her) Designer / 35mm Photographer Instagram: @cazza.film I’m Carissa but people call me Caz. I’m a daydreamer - often in my own bubble and fantasizing about my idealistic world. I bring these visions to life through my work: film photography, graphic design and art. I’ve always had a natural affinity for art, design and aesthetics, which has culminated into my distinctive eye and taste. I express myself profoundly through music, fashion and subculture. My childlike curiosity and desire for knowledge is one of my greatest assets. Go to Carissa's portfolio → #item-124413:hover .item-title, .og-expand #item-124413 .item-title { font-variation-settings: "wdth" None; } Casper Hockley Casper Hockley Casper Hockley Casper Hockley Casper Hockley Creative / Interior Design / Writer / Strategist Instagram: @___holy_ghost With a knack for managing event spaces, I’ve engineered countless brand activations and product launches. I blend hands-on interior design with property renovation, merging classic aesthetics with a distinctive twist. My work is visually captivating and immersive in its story telling. As a side hobby, I craft unique and elegant clothing, highlighting my creative flair. Experience visionary thinking, meticulous attention to detail, and a hands-on approach. Let’s embark on a journey where innovation thrives and possibilities are endless. Go to Casper's portfolio → #item-124414:hover .item-title, .og-expand #item-124414 .item-title { font-variation-settings: "wdth" None; } Darren Huynh Darren Huynh Darren Huynh Darren Huynh Darren Huynh Branding Instagram: @darren_one As a conceptual thinker, I'm driven by ideas, always eager to learn and experiment. Facing the challenges of my disability has honed my perseverance and problem-solving skills - valuable assets in design. Beyond aesthetics, I contribute to team discussions, describing my work with clarity. When not designing, I nerd out on anime, poker, Tetris, and Formula 1. With these experiences behind me, I'm excited to embark on the next chapter of my journey, continuing to grow as a designer and make a positive impact. Go to Darren's portfolio → #item-124415:hover .item-title, .og-expand #item-124415 .item-title { font-variation-settings: "wdth" None; } Elvis Collie Elvis Collie Elvis Collie Elvis Collie Elvis Collie (He/Him) Maker Instagram: @elviscolliephoto A storyteller unconfined by software or mediums. I embrace creativity to find solutions to problems. Continuing to expand my creative toolbox. I started with just a dull knife, and now possess a quiver of tools. With Shift my blades are sharper than ever. As I grow older I am becoming more self aware. That awareness bleeds into my environment as I work to build my dream life. Brick by brick. Will you be my next brick? Go to Elvis's portfolio → #item-124416:hover .item-title, .og-expand #item-124416 .item-title { font-variation-settings: "wdth" None; } Hamish Kennelly Hamish Kennelly Hamish Kennelly Hamish Kennelly Hamish Kennelly​ (He/him) Art Direction LinkedIn A chronically-online creative with a keen interest in counter-culture, film, and comedy. Advocate of “yes, and…” in the workplace. Energsied by strategic problem-solving and getting on the tools to bring ideas to life. Frequent traveller of the internet in search of obscure content and memes to harvest. A modern-day Sisyphus grappling with browser tab management. Forever chasing the thrill of the ‘aha’ moment in every project. Up-skill enthusiast. Your favourite creative’s favourite creative. Go to Hamish's portfolio → #item-124417:hover .item-title, .og-expand #item-124417 .item-title { font-variation-settings: "wdth" None; } Harrison Guest Harrison Guest Harrison Guest Harrison Guest Harrison Guest​ (He/Him) Graphic Designer / Illustrator Instagram: @harrisonguest_design Since I was little, I've been a maker and curious about learning new skills. Fast-forward to today, and I'm proud to be a Shifter and Graphic Designer! My path into the creative field is a little unusual as I’m also a Tradie! I’ve embraced my unique hands-on experiences from being on the tools, and you’d be surprised by how much it helped shape the designer I am today. I’m ready for the next step; this is just the beginning! Go to Harrison's portfolio → #item-124418:hover .item-title, .og-expand #item-124418 .item-title { font-variation-settings: "wdth" None; } Loni Thompson Loni Thompson Loni Thompson Loni Thompson Loni Thompson (She/Her) Illustrator / Designer / Creative Instagram: @lonithompson_illustration I’m a Sydney based creative with 10 years of experience in Illustration & Graphic Design. During this time I have worked on projects across fashion, hospitality, events and health industries in both print and digital mediums. ​I’m a maker and a problem solver. During this course I have be become intrigued and excited by experiential design and solving tangible problems that go beyond print and digital design, finding solutions that create memorable experiences. Go to Loni's portfolio → #item-124419:hover .item-title, .og-expand #item-124419 .item-title { font-variation-settings: "wdth" None; } Maz Messias Campos Maz Messias Campos Maz Messias Campos Maz Messias Campos Maz Messias Campos (She/Her) Experiential Designer / Creative Instagram: @mazxcam I'm a DJ and radio presenter on Gadigal Land, who aspires to represent the Latinx community through sound, both locally and beyond. I enjoy crafting genre-defying musical journeys, blending diverse rhythms and cultures. I also aim to extend my creativity into experiential design, connecting brands with audiences and shaping cultural experiences. Go to Maz's portfolio → #item-124420:hover .item-title, .og-expand #item-124420 .item-title { font-variation-settings: "wdth" None; } Moe Dixon Moe Dixon Moe Dixon Moe Dixon Moe Dixon (She/They) Graphic Design / Creative Direction ​LinkedIn Hello-e, I’m Moe! I’m a dynamic creative and junior graphic designer, with a nogan built for finding unique, entertaining, and meaningful answers to briefs. I draw a lot of creative inspiration from observing and filling in the blanks of everyday mundane, human activity and interactions. I’m curious about humans - I love designing for them, making them laugh, and making them think. My work is quirky, current, a bit left of centre, with a spritz of dark humour - just like me :)) Go to Moe's portfolio → #item-124421:hover .item-title, .og-expand #item-124421 .item-title { font-variation-settings: "wdth" None; } Odessa Jones Odessa Jones Odessa Jones Odessa Jones Odessa Jones (She/Her) Photographer / Creative Director Instagram: @odessa_jones I am a visual storyteller. My mission is to bring the raw energy and emotions of people and moments to life. Photography gives me the freedom to imagine and explore without limits, allowing me to share my world for over 10 years. Known for my grainy, film like, documentary style, I've worked closely with artists on live shows, album covers and promotional material. I am fueled by the joy of evoking emotions through my work, constantly striving to inspire others. Go to Odessa's portfolio → #item-124422:hover .item-title, .og-expand #item-124422 .item-title { font-variation-settings: "wdth" None; } Rhian Morrison Rhian Morrison Rhian Morrison Rhian Morrison Rhian Morrison (She/Her) Creative / Writer / Producer Instagram: @rhi_eat_world I am an aspiring junior creative driven by a deep passion for storytelling and creating positive social change. Whether writing, producing podcasts, or supporting TV and film projects, I aim to deliver work that resonates deeply and fosters genuine human connections. Writing comes naturally to me, and I excel at transforming ideas into compelling content. I’m determined to make a meaningful impact through collaboration with like-minded individuals. Go Rhian's portfolio → #item-124423:hover .item-title, .og-expand #item-124423 .item-title { font-variation-settings: "wdth" None; } Sarah Melamed Sarah Melamed Sarah Melamed Sarah Melamed Sarah Melamed (She/Her) Copywriter / Strategist / Account Coordinator Behance I am an energetic, creative marketing and media professional who thrives in fast-paced, collaborative environments. With early career experience in global and indie agencies and NFP environments, I am a go-to specialist in areas including digital marketing, copywriting and marketing strategy. With a willingness to embrace new concepts and achieve better outcomes through driving a cooperative, team-based approach, I am inquisitive, and empathetic and have strong communication and relationship-building skills. ​ Go to Sarah's portfolio → #item-124424:hover .item-title, .og-expand #item-124424 .item-title { font-variation-settings: "wdth" None; } Seded Altansukh Seded Altansukh Seded Altansukh Seded Altansukh Seded Altansukh (He/Him) Creative Strategist Instagram: @syded_ I am a creative strategist and street photographer based in Sydney. Originally drawn to advertising by chance, I have developed a deep appreciation for the power of visual storytelling and strategic work. With a keen eye for aesthetics and a genuine understanding of human emotions, I strive to create work that not only resonates but also inspires positive change. D&AD Shift was a turning point, giving me the clarity and confidence to pursue creative excellence. Go to Seded's portfolio → #item-124425:hover .item-title, .og-expand #item-124425 .item-title { font-variation-settings: "wdth" None; } Tea Blaiklock Tea Blaiklock Tea Blaiklock Tea Blaiklock Tea Blaiklock (They/She) Creative Designer Instagram: @paranoid.sprite Being creative is wired into my everyday life, whether its writing stories, making art, and building little animals out of wool (amigurumi). It started out – as most artists say – in my childhood. I took a liking to character design, and how simple illustrations could convey interconnected stories. I strive to tell stories, it’s a path that I have always been on, and showed me that regardless of where I am, if I’m creating, it’s where I am meant to be. Go to Tea's portfolio → Be part of Shift Sydney in 2025 Sign up below to register your interest for the next intake of applications. You don’t need a pre-existing portfolio to apply — we want to find out about you, how you think and about your ideas, so be creative. You can share a design, a campaign concept, a piece of artwork, a video, some photographs, lyrics, a story, anything - it’s up to you. To be eligible for Shift you must not hold a university degree in any subject, or be studying'''
