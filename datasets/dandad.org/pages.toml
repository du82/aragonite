full_description = "Editing Jury D&AD Awards 2025 The art of assembling dialogue, music, images and visuals into a cohesive whole for commercial advertising projects. Judges will prioritise craft over idea in this category. None Have a look at the subcategories below and download the entry kit for more information.Visit D&AD Awards for translated versions. Get the entry kit Subcategories You can enter your work in the following subcategories. 3501 - 15 Seconds & Under Editing for film advertising, music videos and branded content less than 15 seconds long. Includes work created for social, TV/VOD, out-of-home, events and virtual worlds. 3502 - Short Form Editing for film advertising, music videos and branded content less than 3 minutes long. Includes work created for social, TV/VOD, out-of-home, events and virtual worlds. 3503 - Long Form Editing for film advertising, music videos and branded content over 3 minutes long. Includes work created for social, TV/VOD, out-of-home, events and virtual worlds. 3504 - User Generated Content Editing that primarily involves user-generated content to create the finished product. Includes found footage, content submitted for competitions and content created and shared by consumers. 3505 - Visual Effects Editing where the use of visual effects is a central component of the creative output. This can include CGI or other digital techniques used to generate, modify or enhance the final outcome. 3506 - Trailers & Teasers Editing of teasers and trailers for film advertising, music videos and branded content. Teaser trailers must be a maximum of 90 seconds long. 3507 - Documentary Film Editing for branded or brand-funded documentaries, docudramas and recreations. 3508 - Fashion Film Editing for fashion films. Includes campaign films, branded films and runway shows. From high street fashion to couture, accessories to beauty. Jury Fouad Gaber (President) Film Editor Cabin Edit Nikki Chapman Production Partner FCB LONDON Renata Dumont Managing Director & Executive Producer Anonymous Content Brazil Thomas Grove Carter Partner Editor Trim Editing Gyu Kim Global Creative Director Cheil Worldwide Nicolas Larrouquère Editor Collectiv Maged Nassar Director Good People"
