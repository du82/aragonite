description = "View the D&AD profile for Jones+Tino Directors. Jones+Tino began working together in 2004 as a creative team at F/Nazca Saatchi & Saatchi - Brazil...."
full_description = 'Jones+Tino Directors Directors Brazil Member since 2015 Twitter Facebook Pinterest Jones+Tino began working together in 2004 as a creative team at F/Nazca Saatchi & Saatchi - Brazil. They began directing films for Nike, quickly receiving international recognition for their strong narrative styled films. Their commercials "Addiction" and “Before and After” starring Brazilian football star, Ronaldo, become critically acclaimed and soon, Jones+Tino found themselves full time directing. In 2015 the spot, “100” for Leica was awarded Film Grand Prix at Cannes Lions. The film celebrates the brand’s 100th anniversary and pays tribute to some of the most iconic moments that have been captured in camera. In 2016, the commercial Blood for Bodyform made the news for breaking the period commercial clichés and approaching menstruation from a whole new perspective. Among their most recent work there are films Ikea, Facebook and Ancestry. Jones+Tino are represented worldwide by Stink. Contact Jones+Tino. Website Twitter D&AD Awards (8) Addiction Film Advertising Crafts F/Nazca Saatchi & Saatchi Nike Film Advertising Crafts Cinematography for Film Advertising 2012 Addiction Film Advertising Crafts F/Nazca Saatchi & Saatchi Nike Film Advertising Crafts Direction for Film Advertising 2012 100 Film Advertising Crafts Stink Leica Gallery SP Film Advertising Crafts Cinematography for Film Advertising 2015 Before and After TV & Cinema Advertising F/Nazca Saatchi & Saatchi Nike TV & Cinema Advertising TV Commercials 41-60 seconds 2012 Addiction Film Advertising Crafts F/Nazca Saatchi & Saatchi Nike Film Advertising Crafts Editing for Film Advertising 2012 Addiction Film Advertising Crafts F/Nazca Saatchi & Saatchi Nike Film Advertising Crafts Sound Design for Film Advertising 2012 100 Film Advertising Crafts Stink Leica Gallery SP Film Advertising Crafts Production Design for Film Advertising 2015 Curiosism Spatial Design F/Nazca Saatchi & Saatchi Pinacoteca Museum Spatial Design Exhibition Design 2012'
