full_description = "D&AD Careers Hello there. You must be interested in working with us. Check below to see if we have any vacancies at the moment. Or connect with us and be the first to hear about new opportunities. Connect Vacancies Apply now Partnerships Manager/Account Manager Applications close 16 January 2025 Apply now Partnership Manager/Sales Applications close 16 January 2025 Apply now Senior Brand and Communications Manager Applications close 3 February 2025 Senior Digital Marketing Manager Applications closed Benefits Office — Be part of a relaxed work environment with a casual dress code in our Shoreditch accessible Office. Be part of a relaxed work environment with a casual dress code in our Shoreditch accessible Office. We have relaxing breakout and social areas, a modern spacious kitchen with a brilliant coffee machine and free breakfast. Professional development — Access to our events, President's Lectures, masterclasses and workshops. Access to our events, President's Lectures, masterclasses and workshops. An ever-growing D&AD library, tons of books about design, branding, advertising and big ideas. Flexible working — Many of our staff work flexibly in many ways including part time, remote working, flexible start and finish times or compressed hours. Many of our staff work flexibly in many ways including part time, remote working, flexible start and finish times or compressed hours. We can't promise to give you exactly what you want but we can promise to explore what's possible for the role. Time off — Our staff are supported in their time off, from discretionary company sick pay to enhanced maternity/paternity leave with qualifying service Our staff are supported in their time off, from discretionary company sick pay to enhanced maternity/paternity leave with qualifying service 23 days holiday a year, plus 3/4 additional days off to enjoy an extended Christmas break. We want you fresh and fully charged. Extras — As part of our staff you will benefit from the option to join the private healthcare scheme, receive a discounted gym membership, childcare vouchers and a pension 8% non-contributory. As part of our staff you will benefit from the option to join the private healthcare scheme, receive a discounted gym membership, childcare vouchers and a pension 8% non-contributory. We offer our staff an interest free season ticket loan and we are also registered under the Cycle-to-Work scheme. The scheme allows you to purchase bikes and accessories tax-free. Bigger picture — We have dedicated teams focusing on sustainability and diversity & inclusion. We have dedicated teams focusing on sustainability and diversity & inclusion. Trained first aiders and mental health first aiders looking after your wellbeing. Our values Our Mission Since 1962, D&AD has been celebrating and stimulating the finest in design and advertising. Members join a vibrant global community, whilst creatives and clients are inspired by a world-class Training programme. Not for Profit D&AD's surpluses go straight into programmes such as New Blood, inspiring the next generation of creative talent and stimulating the creative industry to work towards a fairer more sustainable future. Sustainability Here at D&AD we try to be as sustainable as we can, we aim to do this through schemes such as cycle to work, gearing towards being paperless, moving to reusable bottles and recycling as much as we can. Diversity D&AD is dedicated to creating a fairer, more diverse future for the creative industries and is strongly committed to building a culturally diverse workforce. We welcome applications from all individuals. Meet some of the team behind D&AD .tiles-panel-double { padding-top: 60px !important; }"
