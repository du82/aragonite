title = "D&AD Awards 2025 FAQs | Global Advertising, Design & Digital Awards | D&AD"
description = "A in-depth guide to your most pressing questions for D&AD Awards 2025."
full_description = "D&AD Awards 2025 FAQs Twitter Facebook Pinterest Got a question? Here are some of the common questions our entrants ask us, grouped by topics. Key Dates Eligibility Prices and Payments Creating an Entry Physical Materials Credits ​D&AD Impact Judging Process ​Results ​Contact Us More questions? We'll do all we can to answer them. Head over to our Awards page, or if you're stuck, you can contact us on +44 (0) 20 7840 1111 or awards@dandad.org. Key Dates Super Early Bird (30% off) Payment Deadline: 4 December 2024* Submission Deadline: 11 December 2024 Physical Shipment Deadline : 15 January 2025 Early Bird (20% off) Payment Deadline: 5 February 2025* Submission Deadline: 12 February 2025 Physical Shipment Deadline: 26 February 2025 Final Deadline Payment Deadline: 12 March 2025* Submission Deadline: 19 March 2025 Physical Shipment Deadline: 2 April 2025 *Payment options include credit cards or BACS, and invoices must be settled within 7 days of issuance. Please see our Terms & Conditions for further information. Shortlists Announced: 20-21 May 2025 D&AD Festival: 21-22 May 2025 Awards Ceremony: 22 May 2025 D&AD Annual Launch: September 2025 What's the difference between the payment deadline and the submission deadline? The Payment Deadline is the date by which you are required to complete the payment for your entries. Paying on or before the Super Early Bird or Early Bird Payment Deadline can earn you discounts of up to 20-30%. After the Payment Deadline, you will have an additional week to submit your work. On the other hand, the Submission Deadline refers to the date by which you must submit your entries. These deadlines are consistently set one week after each tiered payment deadline. It's crucial to ensure that your entries are 100% completed before submitting. Failing to do so by the respective deadline will result in charges reflecting the price difference between tiers. For specific dates of both deadlines, please refer to the dates above. When do D&AD Awards entries open? Entries for the D&AD Awards 2025 open on 6 November 2024. When will entries close? Entries will close after the Final Payment Deadline 12 March. This means that if you didn’t pay on the Super Early Bird or Early Bird deadlines, you will have to pay by this date, and will have until 19 March to finalise your entries. When is the deadline to post my entry materials? For Entries paid for on or before the Super Early Bird deadline of 4 December 2024, any supporting physical materials must be received by D&AD on or before 15 January 2025. It's important to note our offices will be closed from 19 December 2024 to 1 January 2025 for the Christmas and New Year break. Please ensure your packages arrive either before or after these dates, as we cannot guarantee we'll be able to sign for deliveries during this period. For Entries paid for after 4 December 2024 but before the Early Bird deadline of 5 February 2025, any supporting physical materials must be received by D&AD on or before 26 February 2025. For Entries paid for after 5 February 2024 but before the Entry deadline of 12 March 2025, any supporting physical materials must be received by D&AD on or before 2 April 2025. Eligibility What are the eligibility rules? To be eligible, work must have been: Commercially released between 1 January 2024 and 16 April 2025* Produced in response to a genuine brief from a client or approved by a client Made available to the public through legal mediums Approved and paid for by the client *Alternative eligibility windows apply to the following categories: Digital Design/Incremental, Digital Design/Beta, Product Design/Prototypes, Integrated/Established Campaigns, PR/Established Campaigns, New Brand Identity, Brand Identity Refresh, Impact, Future Impact and Sustained Impact. Please refer to our Terms & Conditions for more information. What are the eligibility dates? Work must have been commercially released between January 1 2024 - 16 April 2025 *. Alternative eligibility windows apply to the following categories: New Brand Identity & Brand Identity Refresh Entries in these categories must have been commercially released and launched, significantly changed or updated between 1 January 2023 and 15 April 2025. Digital Design / Incremental The changes must have taken place between 1 January 2022 and 16 April 2025. Digital Design / Beta The beta version of a platform, app or technology must have been released for the final stages of audience testing within the Awards Qualifying Entry Period. Product Design / Prototypes The prototype must have been released for audience testing within the Awards Qualifying Entry Period. Integrated / Established Campaigns & PR / Established Campaigns Campaigns must have been launched prior to 1 January 2024 and be commercially active within the Awards Qualifying Entry Period. Impact Entries in the Impact category are subject to a qualifying entry period of 1 January 2022 and 16 April 2025. In accordance with general awards rules, work can be re-submitted year-on-year, provided it has been developed or significantly changed. Sustained Impact Entries in the Sustained Impact category must have been commercially released and launched, significantly changed or updated between 1 January 2020 and 31 December 2023 with evident increased impact between 1 January 2024 and 16 April 2025. My work was created before the eligibility dates, can I still enter? If the work was released for the first time before 1 January 2024 it is eligible only under one of these two conditions: The majority of the work was launched between 1 January 2024 and 16 April 2025 (only applies to campaign entries). The work was changed/updated then re-launched between 1 January 2024 and 16 April 2025, having undergone a significant creative development. Nb. Some subcategories do permit work that was released for the first time before 1 January 2023. See question, What are the eligibility dates? for details. Can two companies enter the same work? Two different entrants cannot enter the same work within the same sub-category. If your project is a collaboration with other companies/individuals, check they haven’t entered it first. In case of duplicate entries, we will only accept the entry that was paid first. Can I enter work if I am the client? Yes, clients can enter work produced for them either internally or by an external agency (as long as it has not been entered by the external agency in the same category) – see previous question. Can I enter work done for free for a charity? Yes, however, to be eligible there must be a contractual relationship between the charity and entrant agency. If the media/ airtime was provided pro-bono we reserve the right to ask for confirmation from the media owner. Can I enter work that features the D&AD brand? No. We do not accept entries where D&AD is the primary and/or secondary client, or where D&AD is associated with the work. This includes work that features and/or promotes the D&AD brand. Can I enter self-initiated or self-promotional projects? Self-promotional work is a piece of work created by a freelancer or company with the purpose of showcasing and promoting their practice. This usually includes, but is not limited to, booklets, magazines, guides or websites. Self-promotional work is eligible only if it was commercially released and made available to existing and potential customers. It must not include any third-party names, trade marks, logos and/or any other third-party intellectual property, and must not falsely claim, suggest or imply any association with a third party. On the other hand, self-initiated work refers to a piece of work that wasn't commissioned, and was deliberately created by a freelancer or a company about a general topic, unrelated to their own practice. This is generally not accepted. If you’re unsure about your work being eligible, please contact awards@dandad.org Do you accept work created for the purpose of entering competitions? Work produced in response to a competition is only eligible if it was commercially released, and if it was signed off by the client it represents. Are you accepting entries from Russian companies or individuals this year? In 2022, D&AD announced it will not be accepting entries from Russian companies or individuals based in Russia to the Awards. The ban against Russian entries remains for 2025. Can Ukrainian companies and individuals enter for free this year? Entries from Ukraine will continue to be accepted free of charge in 2025. Please contact our team to obtain a discount code. Prices and Payments How much does it cost to enter? The price to submit each individual work depends on the category that is being entered. Details of pricing are listed on the category pages, as well as the Entry Fees page 11-13 on our Entry Kit. Please note that these prices do not include VAT; VAT is only applicable for UK entrants, and will be added on check-out. What payment methods are accepted? Bank transfers (BACS) and credit card payments. Cheques are not accepted. For bank transfers, the total amount must be transferred within seven days of completing your entry online. Can I get a discount on entries? All entries submitted before the Super Early Bird deadline of midnight on 4 December 2024 GMT will receive 30% off. Entries submitted during the Early Bird window of 5 December 2024 - 5 February 2024 will receive 20% off. All entries submitted post 6 February 2024 will be subject to final deadline fee. Overview of pricing are listed in the Entry Kit on page 11-13. You can also find the pricing listed on the category pages. Freelancers, businesses with less than 10 employees and non profits get a 30% discount on entries. Contact us at awards@dandad.org to obtain a discount code. We strongly advise obtaining the discount code well ahead of the deadline to avoid any potential issues; the code remains valid until the submission period closes. I forgot to add my discount code during checkout, can this be added on? If your entry hasn’t been paid for, you can return to the checkout page to enter your discount code. Under 'Discount code', copy and paste the code and don't forget to click the 'Apply' button. Discount codes must be used at the point of payment on the entry site and can not be redeemed or refunded retrospectively. Discount code not working If you find that your discount code isn't working, please check the below: You can only use the discount code once. Once you've applied the code, it is no longer valid. As our discount codes vary, so do the terms and conditions of each. Make sure you check when you receive any codes as some may only be valid for certain categories. If your discount code is still not working after checking all of the above, please get in touch with our Team so we can help you further. My payment was declined, what should I do? 1. Please pay for your entry again If your payment has been declined, then you'll need to try to pay for your entry again. 2. Make the relevant checks To help ensure your entry is not declined during checkout, we suggest checking the following: Check the card details during checkout to make sure the information is correct. For example, the expiry date or your billing address. Make sure you enter the security code correctly - that's the three digit number on the back of your card. Your card issuer may have declined your payment - as we're unable to resolve this issue, please contact your bank for further information. If your payment has been declined through the 3D secure security measures, then you’ll need to contact your bank for further information. If you've checked all of the above, try paying with another card or through bank transfer (BACS) 3. Contact us If you've received an error message, contact our Team with as many details as you can about the issue - including the error messages you receive, and we'll try to resolve it as soon as we can. Where's my invoice? There are two ways you can get a copy of your invoice: via email, once you have paid, or in your account. To do so, head to ‘My D&AD’ and go to the ‘My Awards Entry Invoices’ section in your account. What are you bank details? The Royal Bank of Scotland, London Drummonds, 49 Charing Cross, Admiralty Arch, London, SW1A 2DX Account Name: D&AD Sort Code: 16-00-38 Account No: 10199910 IBAN: GB14 RBOS1600 3810 199910 BIC/SWIFT: RBOS GB 2L VAT Registration No: 240 6465 76 Currency price differences There is a difference between prices in GBP, USD and EUR. Our prices do not reflect the current international exchange rates. Our entry fees have been established in comparison to the average entry fees of other major awards in different markets and currencies. As such if you are paying in British Pounds you will be paying a different amount than if you are paying in USD or Euros. You can choose to pay in any currency, including GBP, if that is more convenient for you. Please note we will then charge you in GBP so if you are paying from an account in Euros/USDs you have to take the conversion rates into account. Can I get a refund? You will only be eligible for a refund if you withdraw your entry within 48 hours of making payment by credit card, or by raising an invoice to pay via BACS. For more information, please see our Terms & Conditions. Where does the money I spend on my entries go? What people often don’t realise is that D&AD is a charity. In fact, everything we do is about inspiring the next generation of creative talent, improving their access to the industry, and nurturing and developing their skills. Thanks to the Awards, we are uniquely positioned to bring insights on creative excellence to aspiring creatives, providing free or heavily subsidised educational tools, and creating new, more accessible routes into the industry. We do this through our suite of New Blood programmes - which have been helping aspiring creatives realise their potential for 40 years. It’s a critical bridge between education and the world of work. In 2023, we provided over 195,000 vocational learning opportunities to emerging creatives. So, enter not just for a chance at the glory, but to contribute to our mission to make the creative world stronger, fairer and more open for everyone. To find out more about our new blood programmes please visit dandad.org or contact us on newblood@dandad.org. Creating an Entry Which categories should I enter my creative work into? The full list of categories is included in the Entry Kit. You may enter the same work into as many categories as you like. The only exception to this is Future Impact. Work entered into this category will only be eligible for Product Design/Prototypes, and Digital Design/Beta, subject to meeting their criteria. Need help with your entry? Please contact one of our regional account managers. Details are provided in the Contact section below and on Page 103 of the Entry Kit. How do I create an entry? To create an entry, log into your account and cl"
