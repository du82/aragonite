["https://dandad.org/en/d-ad-excellent-craft-still-possible-when-scale-demand-features-opinions"]
title = "Is excellent craft still possible when scale is in demand? | D&AD"
description = "Sunday Dinner Founder Lindsey Slaby explains how marketers can increase their operations without compromising on calibre. This is an excerpt from Lindsey Slaby’s talk Has Scale Killed Craft, held at D&AD Festival 2023."
full_description = "Is excellent craft still possible when scale is in demand? Sunday Dinner Founder Lindsey Slaby explains how marketers can increase their operations without compromising on calibre Twitter Facebook Pinterest Please accept marketing-cookies to watch this video. “There is a specific value of a team that’s focussed on quality and to figure out how to blend that with scale, (I need to understand) what scale actually means to me as a marketer,” says Lindsey Slaby, Founder of brand strategy consultancy Sunday Dinner. “It doesn’t mean ‘mass’ in our sense. Scale for me is being able to scale a design system so other people can use it, or make things that are consistent so other people can pick them up and make sure that the brand I love is showing up in the right way.” This is an excerpt from Lindsey Slaby’s talk Has Scale Killed Craft, held at D&AD Festival 2023. Watch more highlights from D&AD Festival here."
