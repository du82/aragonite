["https://dandad.org/en/d-ad-sustainability-policy"]
title = "Sustainability Policy | D&AD | D&AD"
full_description = 'Sustainability Policy Twitter Facebook Pinterest At D&AD we will help advance sustainable development, both by minimizing negative impacts and maximizing positive impacts on people and the planet. We will do this by: Using our voice in the creative community to move towards a more purposeful industry Bring community together to apply their creativity and innovation to solving sustainable development challenges our industry is facing. These challenges include: Diversity, Green Washing, Sustainable Lifestyles and Designing for Destruction (Reduce, Reuse, Recycle) Catalysing "pre-competitive collaboration". Enable players in the industry to work together and share best practices to accelerate progress and make sure that the entire industry moves forward as one All D&AD employees to strives towards a better more sustainable working environment Continue to support the Global Goals at D&AD Impact Our Mission For D&AD to empower the community to put sustainability at the centre of their business operations. We will do this through reaching out to the creative community, using: Training and workshops Masterclass programmes Partnerships D&AD Impact The work through our Foundation which we will influence the next generation of our industry We can also directly bring about change through: Accounting for the social value created by D&AD’s activities The education and awareness of all staff on sustainability Measuring, managing and reducing D&AD’s environmental impact Encouraging a diverse work force Community and outreach'
