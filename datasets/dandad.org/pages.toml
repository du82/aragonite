full_description = "Magazine & Newspaper Design Jury D&AD Awards 2025 The design of magazines and newspapers, or elements of them. For digital and printed publications. Press adverts should be entered into the Press & Outdoor category. Annual reports and brochures should be entered into Branding or Graphic Design. Exhibition catalogues are eligible in Book Design. None Have a look at the subcategories below and download the entry kit for more information.Visit D&AD Awards for translated versions. Get the entry kit Subcategories You can enter your work in the following subcategories. 5301 - Trade Magazines Design of entire business-to-business magazines or magazines related to a specific trade or sector. 5302 - Consumer Magazines Design of entire consumer magazines available at major outlets. Magazines by independent publishers should be entered into the Independent Magazines subcategory. 5303 - Independent Magazines Design of entire independently-owned magazines, including magazines available at select shops or with a small circulation. 5304 - Magazine Front Covers Cover designs for trade, consumer and independent magazines. 5305 - Magazine Spreads & Sections Design of entire sections or magazine spreads. Spreads should be made up of adjacent pages that work together as a unit. 5306 - Newspapers Entire publications, usually paper-based and distributed daily or weekly. 5307 - Newspaper Front Pages Front page designs for publications, usually paper-based and distributed daily or weekly. 5308 - Newspaper Spreads & Sections Design of entire newspaper sections or spreads. Spreads should be made up of adjacent pages that work together as a unit. 5309 - Special Issues Design of entire magazines or newspapers made to be a single edition and not released periodically. Includes special editions of regular publications, usually focused around one topic or theme; special editions of out-of-print magazines; and brand takeovers. 5310 - Special Issue Covers Cover design for magazines or newspapers made to be a single edition and not released periodically. Includes special editions of regular publications, usually focused around one topic or theme; special edition covers for out-of-print magazines; and brand takeovers. 5311 - Supplements Design of separate sections that accompany a newspaper or magazine, usually for the purposes of advertising. 5312 - Publication Refresh A rebrand of an existing magazine or newspaper, or elements of them. Includes special issues and supplements. 5313 - Digital Publications Magazines and newspapers, or elements of them, for example, digital covers, comics and webtoons, designed to be published in a digital format. Jury Gail Bichler (President) Creative Director The New York Times Magazine Seun Areoye Editor GAUCHOWORLD Kelley Cheng Founder & Creative Director The Press Room & Studio SML Naomi Hirabayashi Art Director & Graphic Designer PLUG-IN GRAPHIC Sherida Kuffour Art Director & Graphic Designer Brave New Lit: Sci-Fi Publishing & Rosarot AG Danny Miller Co-Founder & Chief Executive Officer Human After All Gianni Tozzi Global Chief Creative Officer FutureBrand"
