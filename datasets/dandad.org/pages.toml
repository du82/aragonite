e negligence of D&AD or its officers) arising from the misuse or loss of data or information submitted by you to D&AD directly through the Site or by email. 6. Some of the pages on the Site include links to external websites. These links are included to give you the opportunity to access other pages that it is felt may be of interest or assistance to you. D&AD is not responsible for the content of these Internet sites. 7. Whilst effort has been taken to ensure that the Site is free from viruses, D&AD gives no warranties it will always be free from viruses and you are responsible for ensuring that you have installed adequate and up-to-date virus-checking software. D&AD excludes, in so far as it is legally possible, all liability and responsibility (other than liability for death or physical injury arising out of the negligence of D&AD or its officers) for any viruses or any other computer code, files or programs designed to interrupt, restrict, destroy, limit the functionality of or compromise the integrity of any computer software or hardware or telecommunications equipment or other material transmitted with or as part of the Site. 8. The names, images and logos identifying D&AD or third parties and their products and services, are the proprietary marks of D&AD, and/or may be the proprietary marks of third parties. Any use made of these marks may be an infringement of rights in those marks and D&AD reserves all rights to enforce such rights that it might have. 9. These terms may be varied from time to time. Please ensure that you review these terms and conditions regularly as you will be deemed to have accepted a variation if you continue to use the Site after any variation has been posted. 10. If any of these terms and conditions should be determined to be illegal, invalid or otherwise unenforceable, it shall be severed and deleted from the terms and conditions and the remaining terms and conditions shall survive, remain in full force and effect and continue to be 