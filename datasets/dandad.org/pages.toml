["https://dandad.org/en/d-ad-creative-leadership-training-programme"]
title = "D&AD’s Creative Leaders Programme | Training | D&AD"
description = "Coaching and training, led by industry experts."
full_description = '''Where creativity meets business. ​Are you ready to transform how you lead? STARTS APPLICATIONS CLOSE 10 March 2025 31 January 2025 #product-button-441325-5162 { background-color: #FFD200; border-color: #FFD200; color: #000; } #product-button-441325-5162:hover, #product-button-441325-5162:active { background-color: #FFF; color: #000; border-color: #FFF; } Apply now Course experts Get in touch What is it? Informed by creative leaders who demand more, this 3-month in person programme is tailored to today’s toughest business problems. Taught by renowned topic experts and creative industry leaders such as Ajaz Ahmed, Founder of AKQA; Anthony Burrill, Graphic Artist; and Nishma Patel-Robb, President of WACL and former senior director, brand and reputation marketing at Google, D&AD’s Creative Leaders Programme delves into six critical areas: Values, Culture, Influence, Commerciality, Resilience, and Creativity. Expect a syllabus that evolves as fast as the market does, ensuring you, as a business leader, are ready to tackle modern leadership challenges creatively and effectively. You will also benefit from access to coaching and the opportunity to solve an individual or business challenge.. Applications close: 31 January 2025 Apply now Who is this for? This programme is designed for creative leaders within agencies, design studios, in-house teams, and founders of creative businesses. You’ll learn alongside peers in an exclusive cohort of just 17 people. It’s ideal for those moving from leading teams to leading organisations, such as: Running Creative Departments (ECDs, CDs, etc.) Leading In-House Creative Teams (Heads of, Department Directors) Top of Agencies (CEOs and Founders) We believe that great creative work creates better outcomes for all and is achieved through a diverse, inclusive, and sustainable industry. That’s why we’re providing bursaries to sponsor two places, to help ensure underrepresented talent are elevated into leadership roles. Apply now What's the return on investment? The ROI includes high-level consultancy on a key business challenge and the development of crucial leadership skills, providing long-term benefits for your organisation. Participants will address a specific ‘problem of practice’, gaining tailored insights and solutions from top industry professionals. The focused approach on creative roles ensures that leaders return to their organisations not only with new capabilities, but also with actionable strategies to tackle pressing business issues, driving innovation and growth. Apply now Why you should do this It’s all about transforming how you lead in today's creative world, equipping you with the skills to thrive in a rapidly changing industry. You'll leave having mastered the art of turning challenges into triumphs and become the go-to leader who energises the team and champions transformative thinking. This programme offers an opportunity to tackle a key business challenge of your choosing, gaining invaluable insights from top industry professionals. Apply now The details In-person full-day sessions, in London, covering six critical areas: Values, Culture, Commerciality, Influence, Resilience, Creativity. MAR 2025 Mon 10th — Day 1: VALUES Tues 11th — Day 2: CULTURE Wed 12th — Day 3: COMMERCIALITY Thurs 13th — Day 4: INFLUENCE MAY 2025 Mon 19th — Day 5: RESILIENCE Tues 20th — Day 6: CREATIVITY EXCLUSIVE: Immerse yourself in the D&AD Judging process for the 2025 Awards. As part of the programme you will have the chance to connect with over 250 judges, paving the way for exceptional networking. Plus, you will be invited to all the exclusive judging events and enjoy full access to the D&AD Festival & Awards Ceremony. PROGRAMME COST: £9,950* *VAT, travel & accommodation are not included Apply now Why are D&AD doing this? The landscape of leadership development is filled with resources, yet many miss the mark on addressing what today's creative leaders actually need. In D&AD’s Creative Leaders Programme, we’re offering a bespoke experience that focuses on the personal and professional growth of each participant, informed by the critical issues facing leaders today. This immersive learning experience, centred on collaboration with peers and experts from diverse backgrounds, is designed to give you exceptional leadership skills and build enduring relationships. Apply now Increasing female representation in leadership D&AD wants to address the lack of women in top creative leadership roles, with only 12% of creative director positions currently held by women. Decades of studies show that female leaders help increase productivity, enhance collaboration, inspire organisational dedication, and improve fairness (source: APA, Forbes). With that in mind, we’re aiming for over half the participants to be female, promoting diversity and driving better business outcomes. Apply now Applications close 31 January 2025 Location: London 2025 Dates: 10–13 March & 19–20 May Coaching & training, led by industry experts Applications close 31 January 2025 Location: London 2025 Dates: 10–13 March & 19–20 May Coaching & training, led by industry experts .coverImage { background: #ffd200; } .coverImage img { width: 100%; height: auto; margin: none; display: block; } #item-124211:hover .item-title, .og-expand #item-124211 .item-title { font-variation-settings: "wdth" None; } Ajaz Ahmed Ajaz Ahmed #item-124212:hover .item-title, .og-expand #item-124212 .item-title { font-variation-settings: "wdth" None; } Anthony Burrill Anthony Burrill #item-124213:hover .item-title, .og-expand #item-124213 .item-title { font-variation-settings: "wdth" None; } Brett Macfarlane Brett Macfarlane #item-124214:hover .item-title, .og-expand #item-124214 .item-title { font-variation-settings: "wdth" None; } Connson Locke Connson Locke #item-124210:hover .item-title, .og-expand #item-124210 .item-title { font-variation-settings: "wdth" None; } Dan Foreman Dan Foreman #item-124203:hover .item-title, .og-expand #item-124203 .item-title { font-variation-settings: "wdth" None; } Nadya Powell Nadya Powell #item-124209:hover .item-title, .og-expand #item-124209 .item-title { font-variation-settings: "wdth" None; } Nils Leonard Nils Leonard #item-124204:hover .item-title, .og-expand #item-124204 .item-title { font-variation-settings: "wdth" None; } Nishma Patel-Robb Nishma Patel-Robb #item-124205:hover .item-title, .og-expand #item-124205 .item-title { font-variation-settings: "wdth" None; } Peter Semple Peter Semple #item-124206:hover .item-title, .og-expand #item-124206 .item-title { font-variation-settings: "wdth" None; } Rania Robinson Rania Robinson #item-124207:hover .item-title, .og-expand #item-124207 .item-title { font-variation-settings: "wdth" None; } Sam Conniff Sam Conniff #item-124208:hover .item-title, .og-expand #item-124208 .item-title { font-variation-settings: "wdth" None; } Steve Vranakis Steve Vranakis .coverImage { background: #ffd200; } .coverImage img { width: 100%; height: auto; margin: none; display: block; } #item-124215:hover .item-title, .og-expand #item-124215 .item-title { font-variation-settings: "wdth" None; } The role of the creative leader Day 1. Values: The Role of the Creative Leader What is asked and expected of leaders is constantly changing. Understand your own values and the value and impact you bring to your organisation to shape success. • Vision and Leadership Style • Accountability • Cultivating High-Performance Teams → #item-124216:hover .item-title, .og-expand #item-124216 .item-title { font-variation-settings: "wdth" None; } Transforming the Workplace and Organisational Change Day 2. Culture: Transforming the Workplace and Organisational Change Disconnected teams lead to distrust, poor productivity and absenteeism. Learn to develop truly progressive and entrepreneurial workplaces that provide environments where everyone can thrive. • Inclusivity • Evolving Cultures • Talent and Competition ​• ​Managing an Intergenerational Workforce → #item-124217:hover .item-title, .og-expand #item-124217 .item-title { font-variation-settings: "wdth" None; } Communication and collaboration Day 3. Influence: Communication and Collaboration Negotiation is constant - with your team, your board, investors, peers, clients. Be the changemaker your business needs, and move creativity into the boardroom. Raise your profile with key stakeholders and learn to speak their language. • Client-Relationship-Stakeholder Management • High-stakes negotiation • Managing Conflict → #item-124218:hover .item-title, .og-expand #item-124218 .item-title { font-variation-settings: "wdth" None; } The business of creativity Day 4. Commerciality: The Business of Creativity Creativity is the main differentiator in business. Hone your ability to switch between wonder and rigour, to solve problems and deliver impact in all areas of an organisation. • Win Over the CFO • Move Creativity Up the Value Chain • Build adaptability to change → #item-124219:hover .item-title, .og-expand #item-124219 .item-title { font-variation-settings: "wdth" None; } Leading through uncertainty Day 5. Resilience: Leading Through Uncertainty As we increasingly face a world of volatile and uncertain economic, technological and societal environments, leaders need to embrace the unknown rather than fear it. Develop the knowhow to lean into risk, as avoiding it is no longer an option. • Explore and Understand Your Propensity For Uncertainty • Improve Decision Making • Navigate Your Organisation Through Ambiguous and Turbulent Times: AI → #item-124220:hover .item-title, .og-expand #item-124220 .item-title { font-variation-settings: "wdth" None; } Raising the bar of excellence Day 6. Creativity: Raising the Bar of Excellence Individual progression often results in leaving the creative behind. Re-establish your creative influence through the creation of a shared vision and values, that leads to beautifully executed and impactful work. Establish a clear criteria for creative excellence within your organisation, embracing the tension that comes with striving for brilliance. • Define and Implement Your Vision • Impact of AI, Climate, Purpose • Maintaining Excellence with Growth → What people say about Masterclasses "D&AD holds a hallowed place for creativity and craft - how to make more of creativity and help people set their benchmark" — Chaka Sobhani "One of the most insightful, relevant and inspiring sessions [we] have ever done, fabulous!" — Tangerine "It was amazing and gave practical ways to think of new ideas. Topics [broken] down into manageable chunks and there was a lesson that could be adapted by everyone to apply to their work" — DDB Remedy @-webkit-keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } @-moz-keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } @keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } #extra-bg-wrapper-441329 { background-color: #000; } Apply now Are you ready to transform how you lead? Applications close: 31 January 2025 Apply now Talk to us Interested but have more questions? Book a discovery call with the course programme manager. Book now .image-copy-with-link.parallax-section.text-grey { padding-top: 0px; } .image-copy-with-link.parallax-section.text-grey .a-head.product-panel-title { display: none; } .banderole ul { padding: 40px 0; } .banderole ul li { display: inline-block; text-transform: uppercase; font-weight: bold; } .parallax-section { padding-bottom: 0px; } .image-copy-with-link.parallax-section.text-white .embedded-page-link { color: #FFD200; } .image-copy-with-link.parallax-section.text-white .embedded-page-link:hover { color: #999999; } div.product-call-to-action-full-width.text-black .item-occupation { display: none; } .item-occupat