["https://dandad.org/en/d-ad-professional-development-creative-training-courses"]
title = "D&AD Learning | Advertising, Design & Digital Courses | D&AD"
description = "Our creative training programmes will help you acquire both the skills and the mindset to attain creative excellence."
full_description = '''D&AD Masterclasses Creative Courses Delivering unrivalled professional development to creative people at every stage of their working life. With a remit dedicated to education, inclusion and the highest standards of craft, Masterclasses are not just a step in the right direction, but an entire staircase of learning. Online courses Teams courses On-demand courses In-person courses Upcoming Masterclasses 10 March 2025 Principles of Selling Ideas Online 17 March 2025 Art Direction for Advertising Creatives In-Person 20 March 2025 Creative Collider Online 21 March 2025 How to Integrate AI into Businesses and Teams Online 21 March 2025 Brand Design and Brand Strategy for Creatives In-Person 25 March 2025 How to Get the Best out of Your Team Online 27 March 2025 How to Build Personal Resilience Online 28 March 2025 Managing Creative and Client Relationships In-Person Subjects Art Direction Branding & Design Copywriting Creative Thinking Digital, Marketing & PR Leadership Pitching & Presentation Storytelling Strategy What makes D&AD courses different? Rooted in D&AD’s awards, all courses reflect the very latest thinking and creative innovations, with Award-winning trainers boasting 350+ D&AD Pencils between them Immersive and interactive, our Masterclasses require you to participate rather than be passive, connecting you to other creatives By including yourself in a D&AD Masterclass, you include others by helping support D&AD programmes such as our New Blood Awards & Shift with Google Testimonials Really great and insightful - addressed some really important points that you wouldn't normally think about. Dyson View this course Absolutely feel like I'm equipped with the creative thinking techniques to create more compelling copywriting. UNICEF View this course A brilliant reminder of why we got into the biz in the first place. And a great poke in the tired brain with the imagination stick. M&C Saatchi View this course Not only did I learn a lot about how to create stronger presentations, but I also got a boost in confidence for how I can show up when sharing my work. LuluLemon View this course Courses for teams Our Masterclasses can be taught to whole teams, at a time and place to suit you, and we can work with you to tailor courses to the specific needs of your business. Explore teams Looking for more information? If you're interested in learning more about any of our Masterclasses, or have any related queries, please leave your details below and someone will be in touch shortly. hbspt.forms.create({ region: "eu1", portalId: "144450253", formId: "9eca4ffe-d41e-4b1e-bf0f-90eefe2047c2" }); Ready to learn with us? Whether you’re looking to hone your craft, broaden your skill set, or develop as a leader, D&AD Masterclasses are designed to support the next step-up in your career. #product-button-442535-5379 { background-color: #FFD200; border-color: #FFD200; color: #000; } #product-button-442535-5379:hover, #product-button-442535-5379:active { background-color: #FFF; color: #000; border-color: #FFF; } View all courses @-webkit-keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } @-moz-keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } @keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } #extra-bg-wrapper-442531 { background-color: #333333; } Who we teach Our creative training programmes are designed for anyone working within the commercial creative industries. This includes advertising, design, digital, marketing and PR agencies as well as in-house creative, design, product and marketing teams within brands, technology companies and consultancies. From founders, entrepreneurs and innovators to creative team leaders and practitioners looking to develop or broaden their skills. Our attendees come from many different disciplines including graphic design, product design, service design, digital design, experience design, art directors, UX, copywriting, branding, marketing, PR and creative leadership. .image-copy-with-link.parallax-section.text-black { padding-top: 80px; padding-bottom: 0px; } .image-copy-with-link.parallax-section.text-black ul { margin-bottom: 0px; } .image-copy-with-link h1 { max-width: 600px; margin-left: auto; margin-right: auto; } .multi-cols-copy { padding-top: 0px !important; padding-bottom: 0px !important; } .multi-cols-copy .col h3 { text-align: left; } .image-copy-with-link img { padding-left: 20px; } .product-copy { text-align: left; padding-top: 120px; padding-bottom: 120px; } .product-copy p { margin-top: 20px; margin-bottom: 20px; } .masterclass-testimonials h2 { font-family: "Helvetica Neue Light", "Helvetica Neue", Helvetica, Arial, sans-serif; }'''
