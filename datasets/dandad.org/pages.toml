full_description = '''D&AD Pencils If you’re already credited on a winning entry from any year, there’s a D&AD Pencil with your name on it. Get your Pencil About the D&AD Pencils Since 1962, the D&AD Pencil has represented the very best in design and advertising. Winning a Pencil remains the pinnacle of many careers and the work it celebrates inspires others to study, debate, copy and reference its excellence, as the industry’s finest and most historic of treasures. History of the Pencil @-webkit-keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } @-moz-keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } @keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } #extra-bg-wrapper-442180 { background-color: #000; } D&AD Award Levels Shortlist Work that demonstrates merit, worthy of recognition and in the top echelon of entries. It’s awarded in all categories in the first instance. Wood Pencil The best of the year in advertising, design, craft, culture and impact. Graphite Pencil For stand-out work that rises above the rest, worthy of consideration for a Yellow Pencil. Yellow Pencil The iconic D&AD Yellow Pencil, awarded only to outstanding work that achieves true creative excellence. Black Pencil The ultimate creative accolade, reserved for ground-breaking work. Only a handful of these are awarded each year, if any. The D&AD Forest Grows For the past four years, D&AD has planted a tree for every Pencil awarded. This commitment has now expanded, and through our partnership with Everclime, we are planting an average of four trees per Pencil, amplifying the environmental impact of our awards program. Planted an estimated 5,000 Seed Pods per awards cycle Restored approximately 4,000m² of forestry per awards cycle Sequestered 3–10 tonnes of carbon per awards cycle Provided every Pencil winner with tangible evidence of the trees planted on their behalf Offered real-time project updates via Everclime, including video content on planting, germination, and growth 2024 Planting Location: Northern Rivers, Australia In 2024 5,000 seedpods have all been planted in the Northern Rivers region. The unprecedented floods of 2022 triggered multiple catastrophic landslips in the Northern Rivers region, posing significant threats to homes and critical infrastructure. This resulted in widespread destruction of wildlife habitats and old-growth forests as well as crucial areas of refuge for local endangered species, including the koala. This upheaval jeopardised native biodiversity and severely impacted the resilience of the local ecosystem. With the help of AirSeed Technologies and Border Ranges Landcare, our seed pods will contribute to restoring biodiversity and enhanced ecological resilience, safeguarding natural heritage for future generations in the area. Through this initiative, D&AD Pencil winners are directly contributing to long-term environmental impact. Everclime's dynamic profile pages track investment and ecological benefits, ensuring transparency and engagement for our community. During our two-year partnership with The Other Dada, a recipient of $15,000 of the D&AD Impact Fund in 2019, we planted over 1,300 trees in Lebanon. Find out more about the Pencil for a tree initiative below. Pencil for a tree .coverImage { background: white; } .coverImage img { width: 100%; height: auto; margin: none; display: block; } Category Awards Future Impact Pencil Early-stage projects that demonstrate the potential to drive behavioural, environmental, societal or policy change through creativity. Awarded to work in the Future Impact category. White Pencil Exceptional projects that use the power of creativity to drive behavioural, environmental, societal or policy change. Replaces the Yellow Pencil in the Impact and Sustained Impact categories. How Do You Win One? D&AD Awards Be seen and celebrated by the best in the industry New Blood Awards Pencils currently not available to purchase President's Award The highest honour, reserved for industry legends Companies of the Year See how the top ranking companies measure up Your shopping basket has been updated. View Your Basket & Checkout Your shopping basket has been updated. Have You Won a D&AD Pencil? Order Yours Now They're sealed, masked, sanded, primed, painted, sprayed, printed, glossed and packed. <form class="ticket add-to-cart " action="" method="POST" data-datetime="{{#if start_date}}{{start_date}} {{start_time}}{{else}}9999-12-31 00:00:00{{/if}}"> <input type='hidden' name='csrfmiddlewaretoken' value='AhVDSkhgmfkrhe91zaqJUi7xvYztiPj6' /> <div class="ticket-box"> <img class="ticket-image" src="{{image_url}}"> <div class="ticket-info"> <div class="ticket-name"> {{name}} {{#if display_date}} <p> {{display_date}}</br> {{#if start_time}} {{timeFormat start_time}} {{/if}} {{#if end_time}} - {{timeFormat end_time}} {{/if}} </p> {{/if}} {{#if is_fake_event}} <p> Course dates coming soon<br /> Sign up to be the first to know </p> {{/if}} </div> <div class="ticket-desc"> {{short_description}} </div> {{#if tags}} <div class="ticket-tags">{{tags}}</div> {{/if}} </div> <div class="ticket-ctas"> <div class="ticket-price"> {{#if price}} {{#if discount_amount}} <del>{{priceFormat price}}</del> {{priceDiscount price discount_amount false}} {{else}} {{priceFormat price}} {{/if}} {{/if}} </div> {{#if website_url}} <a class="ticket-learn-more product-button" href="{{website_url}}">Learn More</a> {{/if}} {{#if is_purchasable}} {{#if is_in_stock}} <div class="ticket-buy product-button" onclick="addToOrder('{{catalog_item_id}}')">Add to Basket</div> {{else}} <span class="ticket-buy sold-out">Sold out</span> {{/if}} {{else}} {{#if contact_email}} <a class="ticket-buy product-button" href="mailto: {{contact_email}}">Get in Touch</a> {{/if}} {{/if}} {{#if des