full_description = "Packaging Design Jury D&AD Awards 2025 Innovative design for every kind of packaging, from luxury to consumer. With the exception of the Promotional category, all work entered must have been commercially sold with a barcode or sales identifier. Any non-English language on the packaging needs to come with a translation. None Have a look at the subcategories below and download the entry kit for more information.Visit D&AD Awards for translated versions. Get the entry kit Subcategories You can enter your work in the following subcategories. 5401 - Luxury Packaging for high-end brands or luxury items. 5402 - Limited Edition New packaging for existing products, where the packaging has run for a limited length of time or across a limited range of products and implies exclusivity. 5403 - Small Batch Packaging designed to be produced in small quantities, but not as a limited edition. As a guide, small batch production should be less than 2,000 units. Limited edition packaging should be entered into the Limited Edition subcategory. 5404 - Consumer Packaging design for slow-moving consumer products, electronics and mainstream consumer items. Includes appliances, furniture and computer equipment. Packaging for fast-moving consumer goods should be entered into the FMCG subcategory. Work will not be eligible in both subcategories. 5405 - FMCG Packaging for everyday consumer products that are sold quickly and produced by both small and big brands. Includes packaging for foods, beverages, toiletries, cosmetics, household cleaning, over-the counter medicines, food supplements and other consumable essentials. Does not include speciality products which have lower sales and higher carrying charges. > Packaging for slow-moving consumer goods should be entered into the Consumer subcategory. Work will not be eligible in both subcategories. 5406 - Labels The design of labels, stickers and self-adhesives as part of a product's packaging. 5407 - Materials Packaging materials that support a brand's proposition and sustainability goals. For example, zero-waste solutions or the application of antimicrobial technology. A fourth judging criteria applies to this subcategory: Is it responsible? 5408 - Plastic Free Packaging that has been designed, or redesigned, to eliminate the use of plastic. Includes the removal of plastic from labels, inks and glue. As a minimum, the packaging must be 99% plastic free. 5409 - Promotional Packaging that was distributed as part of a promotional event, stunt or marketing campaign. Typically a limited production run, not commercially available, with no barcode or sales identifier. 5410 - Structural The form and shape of a piece of packaging, with a focus on functionality. Includes structural elements designed for inclusivity. 5411 - Upstream Innovation Packaging designed to fit within a circular system, where an upstream innovation approach has been applied to prevent waste. Where packaging has been significantly reduced and/or redesigned to be reusable, returnable, recyclable or compostable. A fourth judging criteria applies to this subcategory: Is the design circular? 5412 - Rebrand Rebrand of an existing product or range of products. Jury Neha Tulsian (President) Founder & Executive Creative Director NH1Design Listya Amelia (Tya) Design Director & Partner OlssønBarbieri Leigh Chandler Founder & Creative Director Sister Mary Paolo Insinga Executive Creative Director Interbrand Ellena Mills Head of Design Howatson+Company Mark Paton Creative Partner Here Greg Quinton Co-Chief Creative Officer Design Bridge and Partners XiaoWei Zhang Chief Design Officer BLACKBOW | 33 and Branding"
