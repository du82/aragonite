["https://dandad.org/en/d-ad-shift-brazil"]
title = "D&AD Shift São Paulo 2025 | Creative Advertising Placement Opportunities | D&AD"
description = "D&AD Shift São Paulo is a free workshop for aspiring creatives in Brazil."
full_description = '''It's time to #ShiftCreativity D&AD Shift São Paulo is a free, industry-led night school for self-taught creatives entering the advertising, design and creative industry from outside traditional pathways in Brazil. This is your opportunity to SHIFT your career whilst challenging the industry to SHIFT their outlook. #ShiftSãoPaulo is now OPEN. Para ver a página em português, clique aqui. Apply now Meet Class of '24 Shift Stories Since Shift’s launch in 2016, we’ve trained almost 350 creative professionals across London, New York, Sydney and Germany. Shifters write for Apple, create strategies for Spotify, come up with creative ideas for Disney, direct Stormzy, make animations for Katy Perry and photograph for Vogue. Shifters are hired by all major global advertising and design agency networks. They win prizes, win pencils and are part of the D&AD board. Apply now Shift Sao Paulo Programme Wrap-Up Meet Seun, Shift London 2019 Meet Kayla, Shift New York 2017 Select video Shift Sao Paulo Programme Wrap-Up Meet Seun, Shift London 2019 Meet Kayla, Shift New York 2017 Please accept marketing-cookies to watch this video. Please accept marketing-cookies to watch this video. Please accept marketing-cookies to watch this video. How to apply to Shift São Paulo It takes just 30 minutes to apply for Shift via the form below. Applications are open until 26th March 2025. You don’t need a pre-existing portfolio to apply - we want to find out about you, how you think and about your ideas, so be creative. You can share a design, a campaign concept, a piece of artwork, a video, some photographs, lyrics, a story, anything - it’s up to you. To qualify for Shift, you cannot have a college degree or be pursuing higher education. Additionally, we will ask you to upload 3 examples of your creative work. Shift São Paulo is for you if you've always dreamed of a career in the creative industry, but thought it was impossible. The program will teach you skills and give you the confidence you need to get a job in the creative industry, giving you access to a network of contacts that you can grow throughout your career. hbspt.forms.create({ portalId: "144450253", formId: "051e3d53-1c81-4d85-bd82-35cdf880b360" }); What to expect What does Shift offer? Learn from and access a global network of like-minded creative professionals at both peer and industry levels Access to 1:1 mentoring with creative industry professionals Developing key collaboration skills for creatives who often work independently Become part of an international creative network and community, with opportunities to work with other alumni Build your portfolio with projects from world-leading brands Receive accreditation from a globally recognized creative organization Continue learning and get support after the program How does Shift work? The aim of Shift is to support learning alongside everyday work. The program is held in the evenings and occasionally on weekends. Sessions are delivered partly in person and partly online. We offer transport support within the São Paulo city region. The evening school offers exposure to the commercial creative sector through sessions led by creative professionals, in-person agency visits and opportunities to work on creative briefs set by global brands looking to support emerging talent. Each Shifter receives one-on-one mentoring support, networking opportunities, and help building their portfolio to kickstart their next career steps. In 120 hours of learning, the program covers the main disciplines and topics essential for working in advertising, strategy, design and production. It also covers professional skills such as collaboration, courage and resilience. Key dates 26 March 2025 Application deadline Submit your application by 12pm 5 April 2025 Challenge Day Shortlisted candidates will be invited to our live immersive day 26 April 2025 Incubator The beginning of Shift São Paulo 2025 28 August 2025 Showcase A celebratory event that will showcase the Class of 2025’ work to the industry D&AD Shift São Paulo Class of 2024 Meet this year's cohort and filter by creative discipline. Discipline Filmmaker Art Director Creative Designer Strategist #item-124426:hover .item-title, .og-expand #item-124426 .item-title { font-variation-settings: "wdth" None; } Alê Silveira Alê Silveira Alê Silveira (She/Her) Creative / Copywriter / Content Creator for Social Instagram: @lookingforale I exchanged an image for a thousand words and, after 10 years as a photographer, I migrated to writing. Since then, I see my skills in a complementary way and work mainly in creating content for social networks. I'm passionate about music and gastronomy, and I always look for ways to get a little closer to these universes. With a passionate and optimistic vision, I still believe that advertising is one of the best ways to tell stories and co-create the future. Currently, I am a writer at Ogilvy Brasil. Go to Alê's portfolio → #item-124427:hover .item-title, .og-expand #item-124427 .item-title { font-variation-settings: "wdth" None; } Carol Pereira Carol Pereira Carol Pereira (She/Her) Strategist / Content Creator for Social Media / Producer LinkedIn: Carol Pereira https://www.linkedin.com/in/ana-carolina-pereira-65352925/ With 9 years of experience in digital communication, I stand out in creating and implementing communication strategies. My expertise ranges from campaign design to the efficient management of online platforms and communities. Passionate about entheogenic plants and art, I find inspiration by running, whether on the street or on the treadmill. With persistence and creativity. I dedicate myself to expanding the digital presence of businesses, transforming challenges into significant results. Go to Carol's portfolio → #item-124428:hover .item-title, .og-expand #item-124428 .item-title { font-variation-settings: "wdth" None; } Gabriel Trindade Gabriel Trindade Gabriel Trindade (He/Him) Designer / Creative Instagram: @oitrindade Graphic designer passionate about lettering, focusing on visual identity, packaging and illustration. I'm a versatile generalist who loves bringing projects to life with vibrant colors and original creations. Fun and communicative, I always seek to bring personality and creativity to each job. Go to Gabriel's portfolio → #item-124429:hover .item-title, .og-expand #item-124429 .item-title { font-variation-settings: "wdth" None; } Heloisa Mendes Heloisa Mendes Heloisa Mendes (She/Her) Creative Strategist / Storytelling / Creative Director Instagram: @heloisamnds I translate the native readings of our generation in terms of cyberculture. Since I was 10 years old I have been present in the metaverse, creating narratives and concepts for avatars and helping to shape the creative industry within these spaces. I am a creative strategist, focused on directing storytelling and I venture into creative direction on projects such as adidas and Volvo. Go to Heloisa's portfolio → #item-124430:hover .item-title, .og-expand #item-124430 .item-title { font-variation-settings: "wdth" None; } Isabel Gonçalves Isabel Gonçalves Isabel Gonçalves (She/Her) Data-driven / Strategy / Data Analysis and Insights LinkedIn: Isabel Gonçalves An advertiser with a passion for data, I am constantly exploring new ways to transform information into actionable strategies. I live on an air bridge between Belo Horizonte and São Paulo, and along the way I have developed a very dynamic professional background. In recent years, I have honed my talent in analysis and courageously delved into the world of Data Analysis. My focus is at the intersection of marketing and technology, where engaging projects come to life. Go to Isabel's portfolio → #item-124431:hover .item-title, .og-expand #item-124431 .item-title { font-variation-settings: "wdth" None; } Isac Luisa Isac Luisa Isac Luisa (He/Him) Designer / Art Director Instagram: @isacluisa.tinta Passionate about art since childhood, I explored drawing and painting, looking for sustainable solutions. With experience at the Municipal Department of Culture and in cultural events, I introduced myself to natural paints in 2019, teaching their production and history as an ancestral art. My works occupied places such as the Instituto Tomie Ohtake, the Museu Afro Brasil - Emanuel de Araújo, and were highlighted on a double page in Vogue Brasil. Currently, I study ecological design, seeking to contribute to a more sustainable world. I believe in the transformative power of art as an agent of social change. Go to Isac's portfolio → #item-124432:hover .item-title, .og-expand #item-124432 .item-title { font-variation-settings: "wdth" None; } Israell Mendes Israell Mendes Israell Mendes (He/Him) Creative Strategist / Market Intelligence / Copywriter Instagram: @oraell Educated by hiphop through graffiti with artistic merit internationally recognized by the Luxembourg art gallery, with experience in multinationals focusing on market intelligence and investment specialist, currently GRO in Operations and Business at Bradesco. I remain creatively immersed and connected with the street, art and poetry in many different ways. Go to Israell's portfolio → #item-124433:hover .item-title, .og-expand #item-124433 .item-title { font-variation-settings: "wdth" None; } Jorge Santos Jorge Santos Jorge Santos (He/Him) Art Director / Brand Design / ​Packaging / Retouch Instagram: @ojorgedesign I often say that materializing projects is my main vocation, I see design as a tool to bring ideas into being. I have always been attentive to opportunities and determined to change my reality. I like long, deep dialogues. I do bodybuilding, and in my free time, I listen to a variety of podcasts, such as neuroscience or cryptocurrencies, for example. Despite my young age, love found me early, and I decided to get married young. Go to Jorge's portfolio → #item-124434:hover .item-title, .og-expand #item-124434 .item-title { font-variation-settings: "wdth" None; } Julia M Sciência Julia M Sciência Julia M Sciência (She/Her) Strategist / Copywriting / Creative LinkedIn: Julia Mota Sciência A creative in training interested in the area of Communication and Culture. I've always liked observing different lifestyles and learning through them, transmitting it to other people through stories. Tired of just observing and leaving ideas on paper, for the last three years I have been self-taught about the communication market and developing skills to enter the market. During this period I had the opportunity to be part of AKQA's SOMA+, the Co.liga creative school Project Meu Olhar in partnership with SPCine and recently D&AD Shift with Google São Paulo. Through these opportunities, I have brought life to my desire to work with Strategy and Copywriting by translating data into narratives that can be shared with many people. Go to Julia's portfolio → #item-124435:hover .item-title, .og-expand #item-124435 .item-title { font-variation-settings: "wdth" None; } Laura Laura Laura (She/Her) Filmmaker / Lighting / Director/ Photography Director Instrgram: @laugmrs Born and raised in Praia Grande, Santos. She has been in the Brazilian audiovisual market for 3 years. She has participated in great work in different roles: from assistance to production, from camera operation to direction, in front of the camera as a model and casting, from advertising to fashion, always adding her vision for the best result of the product. She contributed to work for major brands, such as C & A, Laboratório Fantasma, Asics, Ninho, among many others. Shaped by her experiences in the world of Hip Hop and Skate, Laura synthesizes in her work the movement between these two worlds: from the street to the spotlights and studios, showing this mixture in the essence of her works, as you can see in the music video “Semblante” by Ella Cavalcanti and “Cria” by Munra, his first clips aimed at his friends and countrymen. Go to Laura's portfolio → #item-124436:hover .item-title, .og-expand #item-124436 .item-title { font-variation-settings: "wdth" None; } Matheus Ferreira Matheus Ferreira Matheus Ferreira (He/Him) Photography Director / Motion Designer Instagram: @oferreirac A black guy from the hood, with diverse techniques and creative skills with the ability to combine them to solve complex problems. Founder of Beco Cria, a favela audiovisual production company that is always working to develop more people around him based on his own experience. A seed. Go to Matheus's portfolio → #item-124437:hover .item-title, .og-expand #item-124437 .item-title { font-variation-settings: "wdth" None; } Rickson Nascimento Rickson Nascimento Rickson Nascimento (He/Him) Art Director / Strategy / Creator Content / Creative LinkedIn: Rickson Nascimento I am an art director passionate about music and the rich black culture, which inspires me to use computer graphics software to create authentic projects full of innovation. My design and production skills, combined with creative strategies, show my commitment to transforming the world through art and entertainment. I'm always looking to integrate these passions into bold projects, challenging myself to develop visual experiences that are both captivating and memorable. Go to Rickson's portfolio → #item-124438:hover .item-title, .og-expand #item-124438 .item-title { font-variation-settings: "wdth" None; } Rogério Libanio Rogério Libanio Rogério Libanio (He/Him) Designer / Art Director / Creative Instagram: @rogeriolibanio Designer and future Art Director. My first form of creative expression came through Graffiti as a teenager. Design came along my path when I created PRU, a brand of caps and t-shirts that reflects my identity. Since then, I fell in love with creation software, and it helped me rediscover myself in the creative world. I believe that each project is an opportunity to showcase my unique vision and I highly value original work because it challenges me to go further and discover how far my creativity can take me. I love exploring new techniques and trends, always striving to create something even more incredible and memorable. Go to Rogério's portfolio → #item-124439:hover .item-title, .og-expand #item-124439 .item-title { font-variation-settings: "wdth" None; } Sivoneide Silva Sivoneide Silva Sivoneide Silva (She/Her) Creative / Copywriter Instagram: @escritaseafins My name is Sivoneide, I'm 23 years old, I was born in a small town in the interior of Pernambuco and I learned to read at age 6 at home; Since then, I've never stopped. Reading for me is the bridge between the mind and the world; This is how my passion for words arose. I love expressing what I'm feeling through texts and poems, and they are what brought me here. Writing for me is creating, healing and giving new meaning; It is the art of telling stories, immortalizing moments and connecting souls. Participating in D&AD showed me that I can work with something I've always loved. Go to Sivoneide's portfolio → #item-124440:h'''
