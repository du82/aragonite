full_description = '''D&AD Festival 2025 D&AD Festival returns to London in 2025 at the Southbank Centre Queen Elizabeth Hall, 21–22 May. Tickets are on sale now — book before midnight on Monday 7 April using code FESTIVAL20 to get 20% off your tickets. #product-button-442498-46897 { background-color: #FFF; border-color: #FFF; color: #000; } #product-button-442498-46897:hover, #product-button-442498-46897:active { background-color: #FFD200; color: #000; border-color: #FFD200; } Buy tickets At the Festival we will cover jury insights fresh from our 2025 juries, creative excellence, tech and AI, best-in-class craft, design & advertising, BTS deep dives into the work and giving the people behind it a stage, fireside chats and interviews of incredible creatives, networking and learning opportunities, and interactive activations. The two-day event will culminate with the D&AD Awards Ceremony on 22 May, awarding the very best in global creativity. Click here to buy tickets Sell tickets online with Ticket Tailor @-webkit-keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } @-moz-keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } @keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } #extra-bg-wrapper-442503 { background-color: #000; } What to expect 80+ international speakers across two stages; one for big discussions and inspirational content, and another for more focussed learning & insight-driven content Jury insight sessions with our global judges, giving you the low-down fresh from the 2025 D&AD Awards jury rooms Physical and digital exhibition of D&AD Award-winning work, back by popular demand Our world-class Masterclass content adapted to run live on stage to reach and benefit a larger audience 90-minute taster sessions of Masterclasses will be available, at a supplemented fee. More information to be announced! All the main-stage content will be recorded and shared with attendees post-event Find out more Programme & event timings We'll start announcing our speakers from the 25 February, and will then announce the full programme including sessions titles and synopses on 8 April. Watch this space and sign up to our newsletter to be the first to know. Timings: Wednesday 21 May Festival Day I — doors open 9am, stage content from 10am-6pm Thursday 22 May Festival Day II — doors open 9am, stage content from 10am-3pm Thursday 22 May Ceremony — 6pm to midnight Key dates 29 January 2025 — D&AD Festival 2025 ticket sales launch 24 February 2025 — Buy your ticket by 24 February 23:59 GMT to receive 30% off using code FESTIVAL30 March 2025 — Speakers announced 7 April 2025 — Buy your ticket by 7 April 23:59 GMT to receive 20% off 8 April 2025 — Full programme announced 21 & 22 May 2025 — D&AD Festival, London’s Southbank Centre 22 May 2025 — Ceremony, ​London’s Southbank Centre Important booking information Please carefully check the date on which you purchase a ticket for and ensure the attendee information is input correctly. This will ensure that attendees receive the correct information to make the most of their experience. 90-minute taster sessions of a selection of D&AD's Masterclasses will be made available for Festival ticket holders at a supplemented fee of £50 per person, per session. Please note that spaces on these taster sessions are limited, and the purchase of a Festival ticket does not guarantee you a space. We do not offer refunds for any ticket purchases but you can update the attendee information so a colleague or friend may take your place. Please note that Day I Passes, Day II Passes, and Ceremony Passes only gain you access to those parts of the Festival. If you wish to attend on additional days you must add all ticket types required to your basket, or purchase a Full Pass (which includes 