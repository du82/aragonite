 | D&AD"""
description = "If you've been awarded Wood Pencil or above, drop us your details for further information about how you can order your D&AD Pencil. If you've previously won In Book or a Nomination and would like to celebrate your achievement with a Wood or Graphite Pencil, please let us know."
full_description = '''100 Twitter Facebook Linkedin Award: Wood Pencil Wood Pencil / Film Advertising Crafts / Production Design for Film Advertising / 2015 This dramatic film celebrates the centenary of the first Leica camera by taking viewers on a journey through some of the most powerful pictures from the past 100 years. Malcolm Browne's image of Thich Quang Duc's famous self-immolation in Saigon, Stuart Franklin's shot of the Tank Man's protest in Tiananmen Square and Nick Ut's photo of 9-year-old Kim Phúc fleeing a napalm attack in Vietnam, are amongst the remarkable moments subtly reproduced in this ode to photography. Many of these prize-winning pictures weren't taken with a Leica but exist thanks to Leica. The moments were reproduced in a sequence of scenes that connected the deepest human emotions with the camera that forever changed the history of photography. Are you credited on this winning entry? If you've been awarded Wood Pencil or above, drop us your details for further information about how you can order your D&AD Pencil. If you've previously won In Book or a Nomination and would like to celebrate your achievement with a Wood or Graphite Pencil, please let us know. hbspt.forms.create({ portalId: "144450253", formId: "c4ff1ad9-b97a-49dd-a18a-f8603d485781" }); .image-copy-with-link.text-black { color: #333 !important; } .image-copy-with-link .b-head, .image-copy-with-link p { text-align: left !important; } .image-copy-with-link span p { margin-left: 0; margin-right: auto; } h2, .b-head { font-family: "ITCFranklinGothicStd-Book", "Helvetica Neue Light", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: normal; } .image-copy-with-link.parallax-section.text-black { padding-top: 0px; }'''
