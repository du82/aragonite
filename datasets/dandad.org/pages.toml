description = "House 337's Head of Creative and Emerging Technology explains how she advocates for herself and other neurodiverse creatives"
full_description = '''How neurodiverse creatives can advocate for themselves House 337's Head of Creative and Emerging Technology explains how she advocates for herself and others Twitter Facebook Pinterest Please accept marketing-cookies to watch this video. For Kim Lawrie, being public about having autism has changed her life for the better. “These last three years that I have been public about being autistic have been my most productive and I’ve made the best work of my career,” says Lawrie in her talk Why the Industry needs to think more neurodiversely held at D&AD Festival. Watch the clip to find out how House 337's Head of Creative and Emerging Technology advocates for herself, and what you can do to advocate for a more inclusive workplace. Lawrie also explains the benefits of going through the effort to do this. Not only is there a moral argument for doing so, but a compelling creative and commercial one too: "by understanding and embracing difference, we can create a whole culture of creativity, beauty and inclusivity that we aspire to." Watch more highlights from D&AD Festival talks here.'''
year_published = 2025
