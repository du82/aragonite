["https://dandad.org/en/d-ad-partnership"]
title = "D&AD Partnership | D&AD"
description = "When it comes to partnerships, D&AD acts as the junction between brands, the creative industries and the world's best talent."
full_description = "Partner with D&AD text-align:center D&AD Partnerships enable companies to promote products and services to an influential community of creative practitioners. Achieved through compelling brand activations and sponsorships. Case Studies Our Partners Partner with us Access Creative Professionals Align your brand with creative excellence through the D&AD Awards and Festival in order to deliver experiential relevance and value to thousands of industry influencers. Up-skill and Recruit Young Talent Set a brief to Uni students, un-earth talent from non-traditional backgrounds, and launch the careers of rising stars from around the world through D&AD's New Blood programme. Success Stories Adobe, D&AD Festival 2017 Nationwide, D&AD New Blood Awards Microsoft, D&AD Festival 2017 Shutterstock, D&AD Festival 2017 WPP, D&AD New Blood Academy Programme YouTube, Film Hack ASOS, New Blood Brief & Workshop Unilever, Creativity For Good Partners Supported by WPP Over the past four years, fifteen agencies from the WPP network such as The Partners, Fitch, AKQA and Ogilvy & Mather partnered with New Blood to offer mentoring and support. In our recent interview with WPP Worldwide Creative Director John O'Keeffe, we talked about New Blood and the biggest challenge in creative education right now. Read the Interview WPP Case Study Get Involved To learn more about these opportunities or to discuss a bespoke project. Email Partnerships .video-block .product-panel-title { display:none; } body.product .video-block { padding: 0 80px 100px; }"
