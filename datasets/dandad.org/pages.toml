["https://dandad.org/en/d-ad-awards-ceremony"]
title = "D&AD Awards Ceremony | D&AD Awards 2024 | D&AD"
description = "Bringing the creative industry together to recognise and award the finest creative minds from around the globe."
full_description = '''D&AD Awards Ceremony 2024 D&AD Awards showcases and celebrates the world’s best commercial creativity in design, advertising, craft and production. The 2024 Awards Ceremony took place at London's Southbank on 22 May. Congratulations to all the winners. Winners About D&AD Awards Ceremony Every year, D&AD Awards gathers and promotes the best commercial creative work in design, advertising, craft and production, attracting participation from creative companies, agencies, studios, brands and individuals in more than 75 countries. D&AD Judging, Festival and Ceremony moved to the Southbank Centre for 2024. D&AD Awards Ceremony running order 22 May 2024 ​Queen Elizabeth Hall, Southbank Centre, Belvedere Road, London SE1 Show running order 18:00 — <p>Doors</p> Doors — 18:00–19:15 — <p>Ceremony reception</p> Ceremony reception — 19:15 — <p>Take your seats</p> Take your seats — 19:30 — <p>Ceremony commences</p> Ceremony commences Craft Engagement & Experience Health Design Luxury Advertising Impact Entertainment Presidents Award Of the Year Awards 21:15 — <p>Ceremony After Party</p> Ceremony After Party — 23:59 — <p>Carriages</p> Carriages — Presenters Jack Renwick D&AD President Jack runs a creative branding agency, wittily titled Jack Renwick Studio, based in Whitechapel, London with designers who are more talented than her. She has worked on a huge variety of projects over the past 25 years for clients including Amnesty International, eBay, BBC, Nokia, Royal Mail, Sir Elton John and Stella McCartney and received recognition from most of the world’s most prestigious awards. She is a Fellow, a board member, an examiner, an advisor, a judge, a writer and a speaker and has received the epic honour of being selected as the D&AD President for 2023/24. Doc Brown Actor, Writer and Producer Ben Bailey Smith spent 10 years as a youth worker by day and as underground rapper Doc Brown by night, before picking up a gig tweaking comedy scripts for Lenny Henry led to Ben attempting stand-up for the first time in February 2008. For the next decade Ben retained his old rap moniker and dominated the live comedy scene, before hanging up his mic to focus on acting, writing and producing. He has starred in the likes of Disney’s Star Wars: Andor, Amazon’s Cinderella and BBC’s The Sixth Commandment, written for TV Film Radio and Advertising, and has published six children’s books. Sign up to D&AD news Sign up for the latest news, creative learning and inspiration from D&AD. hbspt.forms.create({ region: "eu1", portalId: "144450253", formId: "7ac0ab5f-3667-4333-ae14-e192a3d2de09" }); .tiles-panel.text-white.tiles-panel-content-top { padding-top: 0px; } .tiles-panel.text-white .tile-title { display: none; } .tiles-panel .tile .tile-copy-wrapper .tile-copy .tile-copy-inn.er .tile-copy-content .tile-title { text-transform: none; font-weight: bold; margin-bottom: 18px; } .horizontal-panel .ticket-buy { background-color: #ffd200; border: #ffd200; color: #000; } .horizontal-panel .ticket-buy:hover { background-color: #000; border: #000; color: #FFF; } .tickets-outer, .tickets-inner { padding-top: 0; } .product-copy { background-size: cover; } div.product-call-to-action-with-image .actions-container ul li.has-detail-box .og-expander .copy-content a { display: none; } .multiDownload.multiVideo { padding-top: 0px; } .multiDownload.multiVideo .product-panel-title { display: none; } .parallax-section .embedded-page-link:hover { color: #FFD200; } .table-listing .c-head.product-panel-title { display: none; } .table-listing { padding-top: 0px; } .product-copy { padding-bottom: 0px; }'''
