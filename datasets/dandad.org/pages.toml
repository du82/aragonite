full_description = 'A collaborative project funded by the EU to address the creative skills gap between education and industry. About Findings Free Learning Course .coverImage { background: #ffd200; } .coverImage img { width: 100%; height: auto; margin: none; display: block; } About the project Bridging the creativity gap is an EU funded project, forging collaboration between D&AD, IAAC (FABLABS), ADCE, OULU University and Kersnikova. Extensive research has been conducted to identify the creative skills gaps between education and industry and 5 leading European partners have been brought together to address this disparity. The project has produced an extensive virtual learning programme which draws upon innovative learning methodologies, industry leaders and subject experts. All is available free of charge to tutors, students and a wider community looking to develop these skills and forge a career in the creative industry. Findings You can find out more about the research undertaken to identify the skills gaps we are addressing through this course. Download Methodology Download White paper Download Findings Free Learning Course Together with our partners we have developed a series of free-to-access learning resources for students and tutors, available via the D&AD online campus. Enrol below to get started. Start course Sign up to D&AD news Sign up for the latest news, creative learning and inspiration from D&AD. hbspt.forms.create({ region: "eu1", portalId: "144450253", formId: "7ac0ab5f-3667-4333-ae14-e192a3d2de09" }); The European Commission support for the production of this publication does not constitute an endorsement of the contents which reflects the views only of the authors, and the Commission cannot be held responsible for any use which may be made of the information contained therein. .title-align-center { text-align: center; } .title-align-center img { width: 500px; } .footer-image img { width: 300px; } .logos-align-center { text-align: center; width: 100%; padding: 0px 20px 50px 20px; } .parallax-front .logos-align-center img { margin: 5px 15px; vertical-align: middle; display: inline-block; } .row.feed-blocks.new-feed-blocks { padding-top: 0px !important; } .feed.items-feed { padding-top: 0px !important; } .image-copy-with-link.parallax-section.text-white { padding-top: 60px; } @media screen and (min-width: 82.5em) { .content-blocks > li, .feed-blocks > li { width: 33.33333%; } }'
