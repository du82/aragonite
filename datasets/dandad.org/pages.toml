title = "D&AD New Blood Academy 2024 | Creative Students Advertising Design Course | D&AD"
description = "New Blood Academy is a creative bootcamp for new talent; nurturing, equipping and guiding young creatives into their future careers."
full_description = '''@-webkit-keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } @-moz-keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } @keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } #extra-bg-wrapper-439664 { background-color: #ff5e1f; } New Blood Academy 2024 D&AD New Blood Academy is an intensive online training programme fuelling the trajectory of hot new talent into the creative industry, in the space of just two weeks. Class of 2024 About the Academy Academy Stories Testimonials D&AD New Blood Academy is an intensive online training programme fuelling the trajectory of hot new talent into the creative industry, in the space of just two weeks. The 2024 New Blood Academy ran online from 2–13 September. The selected participants hit the ground running with a top notch array of speakers, and collaborated with a host of international agencies to work on a response to a brief set by adidas. Meet the New Blood Academy Class of 2024 These 36 ones to watch have completed New Blood Academy and are ready to take the industry by storm. Class of 2024 Check out previous New Blood Academy Resources: In partnership with WPP, we created the New Blood Academy Handbook in 2020 when the pandemic hit. This free-to-use online resource where over 25 industry creatives generously shared their top tips for emerging talent on a number of creative topics such as designing ‘mindfully’, creative resilience, how to push creative ideas and how to unlock your network. Read on to find out more. Read now The New Blood Academy in previous years... What's the D&AD New Blood Academy all about? Select video What's the D&AD New Blood Academy all about? Please accept marketing-cookies to watch this video. @-webkit-keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } @-moz-keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } @keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } #extra-bg-wrapper-439672 { background-color: #33DAC9; } Read what past New Blood Academy alumni have to say “Looking back at my ad journey, I feel extremely grateful for all the opportunities I received. If I could really dive deep and select the most defining event that shaped me to be the creative I am today it would really be the opportunity to participate in the D&AD new blood academy (three years ago!). I have benefited tremendously from the program.” — Edmund Chang, Class of 2019 “I love every thing about this programme. Please keep doing it! It literally means so much to me. This programme really broadened my horizon and I've got to make so many new friends, learn new things from my mentor, my coach and other 51 amazing creatives all around the world.” — Dam Thi Thanh Ha, Class of 2022 “I was – and still am – taken aback by how open and supportive the mentors were, despite being so senior. D&AD and the Academy redefined what it means to "bridge the gap" between students and the creative industry. Thank you so much! Meeting great people, getting inspired, seeing how many career paths are out there. Also learning about how unlikely sources can be great assets to informing your own work.” — Daiki Shinomiya, Class of 2021 Sign up to D&AD news Sign up for the latest news, creative learning and inspiration from D&AD. hbspt.forms.create({ region: "eu1", portalId: "144450253", formId: "7ac0ab5f-3667-4333-ae14-e192a3d2de09" }); .multiDownload.multiVideo h2 { display: none; } .multiDownload.multiVideo { padding-top: 0; }'''
