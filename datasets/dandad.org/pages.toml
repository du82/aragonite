full_description = "Sound Design & Use of Music Jury D&AD Awards 2024 The application of sound and the composition of music for commercial design, gaming and advertising projects.Judges will prioritise craft over idea in this category. Subcategories You can enter your work in the following subcategories. 2901 - Sound Design Sound created for film, audio and gaming projects, where the design concept and craft bring the idea to life. 2902 - Original Composition Original music that has been specially composed for film, audio and gaming projects. Where the composition is informed by the piece it was commissioned for. 2903 - Existing Music Existing music that's been applied to film, audio and gaming projects and works perfectly with the picture. 2904 - Adapted Music An adapted, re-recorded or remixed version of an existing piece of music applied to film, audio and gaming projects. 2905 - Audio Composition The use of complementary audio elements, and the craft of bringing them together, to create a cohesive whole. Includes mixing and use of voice, sound editing, sound design and music. 2906 - Artist & Brand Collaboration A creative partnership between an artist or producer and a brand, who collaborate to develop and integrate a distinctive audio identity, including music and sound elements and/or sonic logos, into the brand's marketing campaigns, products, or overall identity. 2907 - Social & Experiential Sound design, soundscapes, or music created specifically for social and immersive experiences such as brand activations, installations and pop-ups. 2908 - Sonic Identity The use of specific sounds or musical backgrounds that create a brand identity. This includes creating a consistent audio experience across different touchpoints, such as websites, mobile apps, gaming or advertising. Adapted Music (5) Greenpeace – Don’t Stop Sound Design & Use of Music Sound Design & Use of Music Adapted Music 2024 A Train of Memories Sound Design & Use of Music Sound Design & Use of Mus