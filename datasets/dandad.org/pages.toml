time. 2.2 Bookings may be paid by credit card at the time of booking via Ticket Tailor unless agreed directly with the D&AD Team to be paid by invoice. Invoice payments must be received by D&AD within 28 days of the invoice date or by close of business 30 calendar days before the event, whichever is earlier. For bookings made within 28 days of the event, a credit card payment will be required 2.3 If you register for the D&AD Festival less than 30 days before the date of the D&AD Festival we will only accept payment by a credit card, unless we expressly agree otherwise in writing. If for any reason we have not received payment in full by the date of the D&AD Festival you (or the attending delegates) will be asked as a condition of being allowed to attend the D&AD Festival to provide payment by credit card on the day of the D&AD Festival. We reserve the right to cancel your booking at any time if payment is not made. 2.4 Discounts may be offered from time to time but you may only use one discount per Event. Discounts apply to new bookings only; the price in respect of a Confirmed Booking cannot be altered. 2.5 All prices are subject to local taxes where appropriate. 2.6 You acknowledge and accept that if payment is not made in accordance with this Clause 2, interest on the overdue balances (including any period after the date of any judgement or decree against the Customer), and late payment fees, fall due and payable and are calculated upon the basis set out in the Late Payment of Commercial Debts (Interest) Act 1998 (as amended). 3. CONCESSIONARY AND GRATIS PASSES 3.1 Students Passes. The Student concessionary rate is only available to full time students and does not include instances where professionals are studying a part time course. Please contact festival@dandad.org for more information. All Student pass holders must show proof of Student status at the Festival onsite Registration desk, which can include an NUS card. If proof is not shown or verified, then the 