title = "D&AD Masterclasses for Teams | Advertising, Design & Digital Courses | D&AD"
description = "D&AD Masterclasses for companies power up careers and future-proof businesses by focusing on upskilling creative teams."
full_description = '''Team Training Split into two approaches, you can either book all of your team on to one of our existing courses, delivered at a time and place to suit you. Or, if you’re in need of something specific we’ll talk through your request in a meeting. #product-button-439599-46427 { background-color: #FFD200; border-color: #FFD200; color: #000; } #product-button-439599-46427:hover, #product-button-439599-46427:active { background-color: #FFF; color: #000; border-color: #FFF; } View teams courses Contact us How we work Our Team Training programmes can be shaped specifically to your needs. To create the right programme for you, we: 1. Run a diagnostic workshop to understand your team’s training need 2. Build a learning staircase with you including structure, content, timing & delivery 3. Deliver the team training in a setting and format to suit your team 4. Takeaways, summarise and links to the content are provided to embed the learning How creative training can help your business McKinsey has found effective reskilling tends to bring a productivity uplift of 6 to 12 percent (November 2021). Skill building is more prevalent than it was prior to the pandemic, with 69 percent of organisations doing more skill building now than they did before the COVID-19 crisis (McKinsey, April 2021). According to Harvard Business School (January 2022), Creativity and innovation are skills currently in demand and sought across multiple industries. This is largely because every industry has complex challenges that require creative solutions. Team Credits Let your team pick and choose the learning programme that’s right for them with our mix and match credit package. This option combines the ease of a one-off payment, with the freedom to pick and choose, and book places onto our individual courses that are right for each member of your team. Accessible across our individual course programme, you can book up to 4 people from your team on any one date (subject to availability). Find out more by contacting one of the team on masterclasses@dandad.org Testimonials A brilliant reminder of why we got into the biz in the first place. And a great poke in the tired brain with the imagination stick. M&C Saatchi View this course Absolutely feel like I'm equipped with the creative thinking techniques to create more compelling copywriting. UNICEF View this course Really great and insightful - addressed some really important points that you wouldn't normally think about. Dyson View this course Not only did I learn a lot about how to create stronger presentations, but I also got a boost in confidence for how I can show up when sharing my work. LuluLemon View this course Looking for more information? If you're interested in learning more about any of our Masterclasses, or have any related queries, please leave your details below and someone will be in touch shortly. hbspt.forms.create({ region: "eu1", portalId: "144450253", formId: "266eabf4-271c-4eb3-8473-8f136f47b25c" }); Ready to learn with us? Unique, collaborative and inspiring, our Team Training programme is shaped specifically to your needs, and always delivered by our roster of exceptional industry professionals. #product-button-439605-4880 { background-color: #FFD200; border-color: #FFD200; color: #000; } #product-button-439605-4880:hover, #product-button-439605-4880:active { background-color: #FFF; color: #000; border-color: #FFF; } View teams courses .team-steps { margin-top: 20px; margin-bottom: 20px; text-align: left; } .masterclass-testimonials h2 { font-family: "Helvetica Neue Light", "Helvetica Neue", Helvetica, Arial, sans-serif; }'''
