full_description = "Creator Content Jury D&AD Awards 2025 Creator-first content produced and posted by a creator or influencer, to strategically connect a brand or entity to its target audience through their content and channels. Work must have been commissioned by a brand or entity to be eligible in this category. Creators and influencers are figures whose fame or success is rooted in their ability to produce compelling content. Work that involves the use of celebrities should be entered into Digital Marketing. None Have a look at the subcategories below and download the entry kit for more information.Visit D&AD Awards for translated versions. Get the entry kit Subcategories You can enter your work in the following subcategories. 6101 - Creator & Brand Partnerships The partnerships of a creator, influencer, or social ambassador with a brand to engage with a specific target audience. For long-term ambassadorships of 1 year minimum. 6102 - Best Use of Platform Best use of a select social media platform and its specific features to deliver a creator-led marketing campaign. This includes, but is not limited to, Instagram, X (formerly Twitter), Youtube, and TikTok. 6103 - Best Use of Multi-platform Best use of multiple platforms to deliver a creator-led marketing campaign. 6104 - Brand Storytelling Influencer marketing that uses a creator, influencer, or social ambassador, to convey a brand's identity and connect with a specific audience. 6105 - Co-Creation For campaigns where the content creator was involved in the idea conception, as well as production and delivery. 6106 - Use of Creators Best use of a creator or influencer to successfully deliver a targeted social media marketing campaign to increase engagement or drive sales. 6107 - Entertainment Branded content that uses a creator or influencer to increase engagement and target specific markets. 6108 - Experiential Experience-led brand activations that use a creator or influencer to increase engagement and target specific markets. 6109 - Media Media activity that uses a creator or influencer to increase engagement and target specific markets. 6110 - PR PR activity that uses a creator or influencer to increase engagement and target specific markets. 6111 - Tactical Creator content that combines creative ideas and a breaking news story or a trending topic to generate maximum coverage and social media engagement for a brand, leading to an immediate impact. 6112 - Innovation Creator content that uses data or new technologies and emerging media to push the boundaries of creativity, drive commercial success or improve customer experience. Includes big data, real-time data, the use of AI, VR, AR, MR and applications across web 3.0 and the metaverse. 6113 - User Participation & User Generated Content Social activity strategically designed to engage an audience, for example by asking them to contribute to the campaign or a brand initiative. Jury Karl Haddad (President) Head of Global Creative Lab TikTok Thomas Angerer Co-Founder & Chief Creative Officer BeInfluence Europe Bobai Balat Founder & Chief Executive Officer TIMA Chloë Downes Founder & Chief Executive Officer SHFT Akanksha Goel Chief Executive Officer & Founder Socialize Agency Tim Hyland Creative Director Whalar Pei Ling Ho Executive Creative Director Publicis Chemistry Christina Miller Chief Social Officer, VML EMEA VML"
