title = "Accessibility | D&AD | D&AD"
full_description = '''Accessibility Twitter Facebook Pinterest We've tried hard to make this site accessible to wide range of visitors using a variety of devices for browsing. However the site is still young, and we would like to hear from you if you have any feedback or comments. Design The information within the site should be accessible and–at minimum–readable to all visitors. Build The site has been constructed with modern browsers in mind, but still to standards and recommendations from the World Wide Web (W3C) group. This page conforms to W3C's "Web Content Accessibility Guidelines 1.0", level A. This includes things like adding labels to forms and ALT tags to describe images to aid impaired users. More information available here. The site should still be navigable even with Javascript disabled. Text resizing We have not used buttons to increase and decrease text sizes within the pages, as web browsers already offer uses a way to increase the text size which can be used on every web page. Mac / all browsers: To increase the text size: Hold down the Command (cmd) key and press + To decrease the text size, hold down the Command (cmd) key and press - PC / all browsers: To increase text size: Hold down the CTRL key and press + To decrease the text size, hold down the CTRL key and press -'''
