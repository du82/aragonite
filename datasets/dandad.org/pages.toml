["https://dandad.org/en/d-ad-new-blood-shift-nyc"]
title = "D&AD Shift NYC | Creative Advertising Placement Opportunities  | D&AD"
description = "D&AD Shift NYC is a 12-week free program for aspiring creatives in New York."
full_description = '''It's time to #ShiftCreativity D&AD Shift New York is a free, industry-led night school for self-taught creatives entering the advertising, design, and creative industry from outside traditional pathways in New York. This is your opportunity to shift your career while challenging the industry to shift their outlook. #ShiftNewYork is now OPEN. Applications close November 22nd 2024 at 12 pm (EDT). #product-button-441831-46799 { background-color: #8152a1; border-color: #8152a1; color: #FFF; } #product-button-441831-46799:hover, #product-button-441831-46799:active { background-color: #FFF; color: #000; border-color: #FFF; } Apply here Find out more Meet Shift alumni Get involved Shift Stories Since Shift’s launch in 2016, we've trained over 340+ creatives across New York, London, São Paulo, Sydney, and Berlin. Shifters go on to write for Apple, design for Spotify, create for Disney, direct Stormzy, animate for Katy Perry, and shoot for Vogue. They’re employed by every major advertising and design network, win Pencils, and even sit on the D&AD Board. 2024 2023 2022 2020 2018 2017 Meet Seun, Shift London 2019 Meet Kayla, Shift New York 2017 New York Select video Meet Seun, Shift London 2019 Meet Kayla, Shift New York 2017 New York Please accept marketing-cookies to watch this video. Please accept marketing-cookies to watch this video. Please accept marketing-cookies to watch this video. Be part of Shift New York in 2025 Sign up below to receive the application form direct to your inbox. You don’t need a pre-existing portfolio to apply — we want to find out about you, how you think and about your ideas, so be creative. You can share a design, a campaign concept, a piece of artwork, a video, some photographs, lyrics, a story, anything - it’s up to you. To be eligible for Shift you must not hold a university degree in any subject, or be studying towards one. You will be asked to upload three examples of your work, so make sure you have this to hand. Shift New York is for you if you ever wanted a career in the creative industry but didn't think it could be possible. The programme will teach you the skills and confidence you need to gain a job in the creative industry as well as allow you access to a network you can build on throughout your career. Applications close November 22nd 2024 at 12 pm (EDT). hbspt.forms.create({ region: "eu1", portalId: "144450253", formId: "b9127ee8-1641-43b6-9b02-ed68b9bbe5c4" }); What to expect on Shift What does Shift offer? Learn from top creatives across the industry Access a global network of like-minded peers and industry leaders Gain mentorship from experienced professionals Develop essential collaboration and teamwork skills Join an international community of creatives Opportunity to collaborate with alumni worldwide on real projects Build your portfolio with projects from world-leading brands Earn accreditation from a globally recognized creative organization Enjoy continued support and learning opportunities beyond the program How does Shift work? Shift is a night school designed for aspiring creatives who want to break into the industry without sacrificing their current commitments. In-person sessions take place in the evening and occasionally on weekends, so there's no need to take time off work. We also offer transportation support for eligible applicants. Through sessions led by industry professionals, agency visits, and opportunities to tackle real briefs from global brands, you’ll gain hands-on experience and exposure to the commercial creative world. Every Shifter benefits from one-on-one mentoring, portfolio development, and networking opportunities. Over the course of five months, the program covers essential disciplines in advertising, design, and production while also equipping you with professional skills like collaboration, resilience, and creative bravery. What’s expected of you At Shift, your success is driven by your creativity, curiosity, and commitment. We believe that what you get out of the program depends entirely on what you put into it, so bring your bold ideas, your drive to make things happen, and a readiness to push your creative boundaries. Key dates 22 November 2024 — <p>Application deadline</p> Application deadline Submit your application by 12 pm (EDT) 2 December 2024 — <p>Immersion day</p> Immersion day Shortlisted applicants will be invited to our in-person creative immersion day 11 January 2025 — <p>Programme kicks off</p> Programme kicks off 8 May 2025 — <p>Programme ends/final Showcase</p> Programme ends/final Showcase A celebratory event showcasing the portfolios to industry and securing paid placements D&AD Shift with Google New York Class of 2024 Meet this year's cohort and filter by creative discipline. Discipline Art Director Copywriter Creative Director Creative Producer Designer Director Strategist #item-124445:hover .item-title, .og-expand #item-124445 .item-title { font-variation-settings: "wdth" None; } Arman Gibbs Arman Gibbs Arman Gibbs Arman Gibbs Arman Gibbs Art Director / Cinematography LinkedIn: Arman Gibbs Jumping straight into videography I never knew what i was getting myself into. Three years down the road and here I am, writing to you reading my bio. Being a creative with a willing heart taking charge in any direction I found myself loving the journey of challenges. I'm a firm believer of throwing things to the wall to see if it sticks, not caring if it puts a hole in it and thats what I call the ARMAN way. Go to Arman's portfolio → #item-124446:hover .item-title, .og-expand #item-124446 .item-title { font-variation-settings: "wdth" None; } Chey Nelson Chey Nelson Chey Nelson Chey Nelson Chey Nelson (She/Her) Art Director LinkedIn: Chey Nelson Hello, I'm Chey! I like think that I'm a visualizer. I love making ideas come to life with my hands. Pen, paper, iPad, stylus, brick wall, paint…I can create what you want to exist. Go to Chey's portfolio → #item-124443:hover .item-title, .og-expand #item-124443 .item-title { font-variation-settings: "wdth" None; } Christina Jones Christina Jones Christina Jones Christina Jones Christina Jones (She/Her) Art Director Hello, I'm Christina Jones. I was introduced to the world of advertising through modeling. Starting as a full-time model, I traveled the world, worked with exceptional brands, and fell in love with conceptual art direction, primarily using film and photography. When creating ideas, I adhere to my mantra, "Be Audacious," reminding myself that the best ideas come from pushing the envelope and having a wow factor. I aim to engage a diverse audience and incorporate nods to social justice causes and non-profits in my work. Transitioning from being a muse to an artist allows me to see both sides of the picture, and I'm grateful to continue serving the art community in this new role. Go to Christina's portfolio → #item-124447:hover .item-title, .og-expand #item-124447 .item-title { font-variation-settings: "wdth" None; } Cindy Bien-Aime Cindy Bien-Aime Cindy Bien-Aime Cindy Bien-Aime Cindy Bien-Aime​ (She/Her) Strategist LinkedIn: Cindy Bien-Aime A storyteller, wordsmith, performer, theatre kid, writer, and gifted spoken word poet; the quintessential idealist and romantic. The world is a place of beauty and magic in my eyes. Where others see facts and figures, I see symbolism, metaphors, and hidden meanings. My intuition, heart center, & vivid imagination together fuel my creative inspiration. Like a flower, I bring a breath of fresh air, beauty, and uplifting energy anywhere I am watered. Who doesn’t need flowers? Go to Cindy's portfolio → #item-124448:hover .item-title, .og-expand #item-124448 .item-title { font-variation-settings: "wdth" None; } Daniel Randall Daniel Randall Daniel Randall Daniel Randall Daniel Randall​ (He/Him) Photographer / Producer Instagram: @thesundncekid I bleed Brooklyn. Okay, maybe not literally, but this city's relentless energy pumps through my veins. As a native New Yorker, I'm wired to see beauty in the chaos. I don't just take pictures, I translate the language most don’t speak into visuals that resonate. I connect people with the ideas that move them, and ideas with the people they can inspire. So, let's create something together! Go to Daniel's portfolio → #item-124449:hover .item-title, .og-expand #item-124449 .item-title { font-variation-settings: "wdth" None; } Ezra West Ezra West Ezra West Ezra West Ezra West (She/Her)​​ Art Director LinkedIn: Ezra West Ezra West, is a visual artist and Content strategist based in downtown Brooklyn, New York. With a background in media production, she excels in art direction, Intentionally selecting color schemes, props, and concepts to craft thought provoking digital stories. Notably, her work has been published in 360 Magazine and Prestige Magazine by Westin Hotel. While her expertise shines in Professional photography, she also produces social content for virtual platforms. She's passionate about serving others and bringing their visions to life through media production, and creative strategy. Beyond her professional achievements, I'm driven by a genuine desire to uplift and inspire through my artistry. Go to Ezra's portfolio → #item-124444:hover .item-title, .og-expand #item-124444 .item-title { font-variation-settings: "wdth" None; } Francis Bazil Francis Bazil Francis Bazil Francis Bazil Francis Bazil (He/Him) Creative Director I’m the architect of my destiny and a design maestro. Having scoured the four corners of the earth, I turn my colorful experiences into delightful insights as a strategist. Embracing the mantra 'little man, big dreams,' I carry that energy into every team I work with when creative directing. When I'm not strategizing my next creative endeavor, I’m probably lost somewhere in the virtual world or continuing to hone my culinary skills in preparation for the next family holiday, where I can only hope to do better than Grandma's cooking. Go to Francis's portfolio → #item-124450:hover .item-title, .og-expand #item-124450 .item-title { font-variation-settings: "wdth" None; } Gabriel Guzman Gabriel Guzman Gabriel Guzman Gabriel Guzman Gabriel Guzman​ (He/Him) Director / Writer Whaddaya say? I mean to know about me is to feel a renewal of life, a void filled, to be looked at and not seen and a hand to hold when needed most. I am silent most times probably thinking of what superpower would be cool to have. Flying or teleportation, or something cringe I did I wish I can change. But when I do speak it is through the love language of filmmaking. Get to know me and stick around, I've been told my approachability is 10/10, my door is always open just knock a little louder. Go to Gabriel's portfolio → #item-124451:hover .item-title, .og-expand #item-124451 .item-title { font-variation-settings: "wdth" None; } Jobanny Cabrera Jobanny Cabrera Jobanny Cabrera Jobanny Cabrera Jobanny Cabrera​ (He/Him/El/Ello) 3D Designer Instragram: @jobannymusic Hi, I am Jobanny! (Joe-Bah-Knee) an artist, musician/producer and problem solver dedicated to transforming ideas into captivating visual narratives. I merge the realms of artistry and strategic thinking to breathe life into projects for companies, clients, and collaborators across diverse industries. From conceptualizing stunning visual artworks to untangling complex business dilemmas, I thrive on the fusion of creativity and pragmatism. Go to Jobanny's portfolio → #item-124452:hover .item-title, .og-expand #item-124452 .item-title { font-variation-settings: "wdth" None; } Kevonne Clarke Kevonne Clarke Kevonne Clarke Kevonne Clarke Kevonne Clarke​ (He/Him) Copywriter LinkedIn: Kevonne Clarke First, thanks D&AD. I'm Kev Clarke, If its creative please invite me. I love everything art. I make music, I make clothes, I started a podcast where I interview creatives, I take photos, I dance, I write quotes that hopefully inspire people, I've written over 100 skits that I hope to produce in the near future. I've been to Dubai, Amsterdam and London. I hope to go to Japan this year. Go to Kevonne's portfolio → #item-124453:hover .item-title, .og-expand #item-124453 .item-title { font-variation-settings: "wdth" None; } Kibria Chavez Kibria Chavez Kibria Chavez Kibria Chavez Kibria Chavez (She/Her) Art Director LinkedIn: Kibria Chavez An art director and graphic designer with a love for telling stories, building worlds, and curating immersive experiences. Appreciating beautiful moments in music, film, fashion and food. A professional people watcher/popcorn connoisseur, studying the nuances and emotional undercurrents of life. Go to Kibria's portfolio → #item-124454:hover .item-title, .og-expand #item-124454 .item-title { font-variation-settings: "wdth" None; } Lee Heflin Lee Heflin Lee Heflin Lee Heflin Lee Heflin (She/Her) Strategist ​LinkedIn: Lee Heflin A Virginia escapee, my lens found a home in NYC capturing unseen stories. I translate raw moments into visual narratives for underrepresented communities. My artistic compass spins between videography and photography, with production and strategy fueling my vision. D&AD's Shift program ignited my creative superpower, and I'm ready to unleash it on the world. Go to Lee's portfolio → #item-124455:hover .item-title, .og-expand #item-124455 .item-title { font-variation-settings: "wdth" None; } Lois Cheaye Lois Cheaye Lois Cheaye Lois Cheaye Lois Cheaye​ (They/Them) Artist / Strategist / Copywriter LinkedIn: Lois Cheaye Hi! My name is Lois Cheaye and I’m a cultural curator. My work leverages different mediums that invite others to explore a world where our wildest dreams are possible. I use creativity to show the ways we are interconnected in desire through writing, event production, mixed media art, and more. Go to Lois's portfolio → #item-124456:hover .item-title, .og-expand #item-124456 .item-title { font-variation-settings: "wdth" None; } Ondine Atwell-Hudson Ondine Atwell-Hudson Ondine Atwell-Hudson Ondine Atwell-Hudson Ondine Atwell-Hudson (She/Her/They/Them) Stylist / Hair artist Instagram: @ondine__ondine Little Wave, Infinite Rippels Go to Ondine's portfolio → #item-124457:hover .item-title, .og-expand #item-124457 .item-title { font-variation-settings: "wdth" None; } Parnell Jackson Jr. Parnell Jackson Jr. Parnell Jackson Jr. Parnell Jackson Jr. Parnell Jackson Jr.​ (He/Him) Videographer Raised in bookstores by Wizards, Dragons, and Mad Scientists, I've been writing since I learned how. When not being evicted from Starbucks, you can find me jotting down ideas in a Moleskine under the Golden Arches. I believe life’s luxuries come from paper, and when I'm not crafting copy, I'm filming dunks. Writing is my birthright and copywriting is my passion. Go to Parnell's portfolio → #item-124458:hover .item-title, .og-expand #item-124458 .item-title { font-variation-settings: "wdth" None; } Ryan Jada Ryan Jada Ryan Jada Ryan Jada Ryan Jada​ (He/Him) Strategist Go to Ryan's portfolio → #item-124459:hover .item-title, .og-expand'''
