title = "D&AD Shift London 2024 | Creative Advertising Placement Opportunities | D&AD"
description = "D&AD Shift London is a 12-week free workshop for aspiring creatives in London."
full_description = '''It's time to #ShiftCreativity D&AD Shift in London is an award-winning, free industry-led night school for self-taught creatives entering the advertising, design and creative industry from outside traditional pathways. This is your opportunity to shift your career whilst challenging the industry to shift their outlook. #ShiftLondon applications are now closed. #product-button-441733-46783 { background-color: #adfc80; border-color: #adfc80; color: #000; } #product-button-441733-46783:hover, #product-button-441733-46783:active { background-color: #FFF; color: #000; border-color: #FFF; } Meet Class of '24 Shift Stories Get involved 5 months, 21 Shifters, 3 pitches and 1 Showcase D&AD Shifters have embraced five months of online and in-person learning with more than 15 creative agencies across multiple disciplines, from creative direction and design thinking, to ideation, pitching, and strategy. They worked with adidas and Diageo on two real-life creative briefs as well as a 'brief-in-a-day' challenge with airbnb. Now ready to apply their skills to the industry, here's your opportunity to see what they're made of. Explore the work D&AD Shift London Class of 2024 Meet this year's cohort and filter by creative discipline. Discipline Art Director Creative Creative Technologist Copywriter Graphic Designer Illustrator Production Designer Strategist #item-124390:hover .item-title, .og-expand #item-124390 .item-title { font-variation-settings: "wdth" None; } Abdi, Meddy Meddy Abdi Meddy Abdi (He/Him) | Creative Technologist / Applied AI | Instagram: @meddymb365 A Creative technologist with a love for systems design, experiential marketing, strategy and sensory- driven brand experiences. I enjoy building apps and prototyping innovative solutions for memorable campaigns. Known for creative, out-of-the-box ideas, I focus on connecting brands with audiences in meaningful ways. Over the years I have amassed portfolio of web applications and grown a developer community from 10 engineers to now 500 creative technologists with our last event being with Samsung in Kings Cross. Go to Meddy's portfolio → #item-124383:hover .item-title, .og-expand #item-124383 .item-title { font-variation-settings: "wdth" None; } Aiem, Ethar Ethar Aiem Ethar Aiem (She/Her) | Graphic Designer | Instagram: @etharsX I’ve worked at an influencer marketing agency and an advertising agency specialising in programmatic DOOH, driven by my passion for bold ideas and relentless persistence. Go to Ethar's portfolio → #item-124379:hover .item-title, .og-expand #item-124379 .item-title { font-variation-settings: "wdth" None; } Briks, Dimitri Dimitri Briks Dimitri Briks (She/Her) | Art Director / Designer | LinkedIn: Dimitri B. Professional adventurer, often told-off for drinking too much coffee, I’m an art director, born- and-bred in France, with a passion for advertising. My speciality? Not having one. Go to Dimitri's portfolio → #item-124372:hover .item-title, .og-expand #item-124372 .item-title { font-variation-settings: "wdth" None; } Bychkova, Anna Anna Bychkova Anna Bychkova (She/Her) | Production Designer / Animator | Instagram: @the_onya_ I’m Anna, I started as a motion designer/animator/illustrator, but moved more into film in the recent years. Currently I work in art department in film and art direct some indie films/music videos. Go to Anna's portfolio → #item-124380:hover .item-title, .og-expand #item-124380 .item-title { font-variation-settings: "wdth" None; } Cuba, Ella Ella Cuba Ella Cuba (She/Her) | Creative Direction / Conceptualising | Instagram: @ellaacuba I’m a Cuban-Canadian mixed- media artist from Montréal, QC who took a leap of faith by perusing a full-time modelling career in 2018. This lead to a lot of time spent alone, traveling & exploring what self expression looked like for me. Go to Ella's portfolio → #item-124378:hover .item-title, .og-expand #item-124378 .item-title { font-variation-settings: "wdth" None; } Downes, Atlanta Atlanta Downes Atlanta Downes (She/They) | Art Director / Brand Partnership | Instagram: @atlantadownes I’ve had the opportunity to collaborate with organisations like the Museum of Youth Culture, MUF Architects, and the Roundhouse, contributing to exhibitions, online features, and social media campaigns. Go to Atlanta's portfolio → #item-124388:hover .item-title, .og-expand #item-124388 .item-title { font-variation-settings: "wdth" None; } Garrido-Williams, Joshua Joshua Garrido-Williams Joshua Garrido-Williams (He/Him) | Graphic Designer / Brand Strategy / Visual Storyteller | LinkedIn: Josh Garrido-Williams Design is what I do, and I’m all about creating high-quality, engaging work. I draw inspiration from everything around me – whether it’s art, nature, or everyday moments. Go to Joshua's portfolio → #item-124374:hover .item-title, .og-expand #item-124374 .item-title { font-variation-settings: "wdth" None; } Giovinazzo, Aleks Aleks Giovinazzo Aleks Giovinazzo (They/Them) | Illustrator | ​Instagram: @purelyvalentine My name is Aleks, I am a queer, neurodivergent creative based in London who leans towards more artistic approaches to work. I specialise in character work, from designing to illustration. Go to Aleks's portfolio → #item-124387:hover .item-title, .og-expand #item-124387 .item-title { font-variation-settings: "wdth" None; } Gray, Josh Josh Gray Josh Gray (He/Him) | Creative Technologist / Applied AI | ​Instagram: @plasticalchemy Joshua Philip E Gray, or just jpeg for short. I run an Applied AI agency called No Brainer where we create art, architect code, and explore new modes of working in the multi-modal, everything all at once, generative future that is hurtling towards us. Myself, I’m somewhere between an artist, a researcher and an entrepreneur. For over 12 years I’ve been having fun: ForMi: pattern printing and clothing manufacture with AI (2023) Plastic Alchemy: 3D Printing for Unique 1 of 1 Products (2018-2020), AI for brand partnerships (2018), CMO @ MyMiniFactory (2016), PAD Music/Tech Studio (2015). Go to Josh's portfolio → #item-124384:hover .item-title, .og-expand #item-124384 .item-title { font-variation-settings: "wdth" None; } Gregory, Jena Jena Gregory Jena Gregory (She/Her) | Creative Strategist / Creative Director | Instagram: @jengregart With a distinction in both Fine Art and Digital Marketing, I provide a blend between strategic thinking and creative execution to ensure an innovative solution is always provided. Go to Jena's portfolio → #item-124389:hover .item-title, .og-expand #item-124389 .item-title { font-variation-settings: "wdth" None; } Kendall, Kerrica Kerrica Kendall Kerrica Kendall (They/She) | Creative / Writer | Instagram: @kerricakendall Just a passionate storyteller and filmmaker determined to carve out new pathways in writing and directing. My creative journey has been shaped by resilience, curiosity, and a hunger to explore untold stories that resonate deeply. With a knack for navigating challenges and nurturing community-driven ideas, I aim to bring narratives to life that inspire connection and impact. I’m also known for my love of collaboration and my commitment to crafting work that truly stands out. Let’s create something amazing! Go to Kerrica's portfolio → #item-124376:hover .item-title, .og-expand #item-124376 .item-title { font-variation-settings: "wdth" None; } Moriarty, Catherine Catherine Moriarty Catherine Moriarty (She/Her) | Creative Strategist / Copywriter / Producer | Instagram: @cmor1arty As a Marketing Coordinator at The Brixton Project, Catherine creates community- driven campaigns that amplify unheard voices, with a background in storytelling- spanning plays and short film. Go to Catherine's portfolio → #item-124381:hover .item-title, .og-expand #item-124381 .item-title { font-variation-settings: "wdth" None; } Okha, Emmanuella Emmanuella Okha Emmanuella Okha (She/They) | Creative Strategist | ​Instagram: @theylovemski My journey has always been rooted in creativity and community. From working with Omnicom and Brixton Finishing School to leading projects at Community Music and Reprezent Radio, I’ve been driven by a passion for blending culture, content, and connection. Go to Emmanuella's portfolio → #item-124391:hover .item-title, .og-expand #item-124391 .item-title { font-variation-settings: "wdth" None; } Ronni Winter Ronni Winter Ronni Winter (She/Her) | Creative Strategist / Art Director | Instagram: @projectrnz Ronni's brought stories to life in Film and TV, and the past two years have seen her channelling her creativity into advertising and PR, where she’s developed a great appreciation for health advertising. Go to Ronni's portfolio → #item-124371:hover .item-title, .og-expand #item-124371 .item-title { font-variation-settings: "wdth" None; } Shola Ladeji Shola Ladeji Shola Ladeji (He/Him) | Strategist | LinkedIn: Shola Ladeji I like architectural history, abstract art, boxing, lasagne, sauna, nollywood and the colour blue. I’m here to help brands find a truth, cut the **** and build strategies that slap. My ethos is all about bringing together everyday people, sentimental objects, complicated histories and parallel perspectives – manifesting meaningful dialogue and public good in the process. Go to Shola's portfolio → #item-124385:hover .item-title, .og-expand #item-124385 .item-title { font-variation-settings: "wdth" None; } Smart, Greg Greg Smart Greg Smart (He/Him) | Art Director / Designer / Creative Technology | ​Instagram: @do.sumfing I am an artist of the future and forward moving world. I pride myself on progression, innovation and versatility, and rise to the challenge of learning whatever it takes to create something new. Go to Greg's portfolio → #item-124382:hover .item-title, .og-expand #item-124382 .item-title { font-variation-settings: "wdth" None; } Tete-Donkor, Emmanuel Emmanuel Tete-Donkor Emmanuel Tete-Donkor (He/Him) | Creative / Brand Strategist / Illustrator / Production | Instagram: @eartothepave Whatever idea you’re growing, I’m here to support and realise your vision. Priding myself on efficiency with quality and an open attitude, I leave no project unrefined. Go to Emmanuel's portfolio → #item-124375:hover .item-title, .og-expand #item-124375 .item-title { font-variation-settings: "wdth" None; } Thomas-Burton, Ashanté Ashanté Thomas-Burton Ashanté Thomas-Burton (He/They) | Copywriter / Storyteller / Poet | ​Instagram: @theshanifesto_ I’m currently freelance at the Black Cultural Archives and Ministry of Stories as a creative consultant and have had my work displayed at Horniman Museum and UCL Stratford. Go to Ashanté's portfolio → #item-124386:hover .item-title, .og-expand #item-124386 .item-title { font-variation-settings: "wdth" None; } Tupua, Isoa Isoa Tupua Isoa Tupua (He/They) | Creative Director / Production Manager | Instagram: @tp_laid Just a Girly-Pop who is serious about creating, developing and producing stories that do more than paint a thousand pictures. A great sense of empathy, so she’s great with understanding, managing and mediating people- The People’s Princess some might say. Go to Isoa's portfolio → #item-124373:hover .item-title, .og-expand #item-124373 .item-title { font-variation-settings: "wdth" None; } Turner, Abi Abi Turner Abi Turner (She/Her) | Art Director / Photographer | Instagram: @abiturnerphoto I’m a New Zealand-born, London-based photographer and art director. Creative collaboration is something I value deeply and have really loved during my time in Shift. Go to Abi's portfolio → #item-124377:hover .item-title, .og-expand #item-124377 .item-title { font-variation-settings: "wdth" None; } Ziggiotto, Altéa Altéa Ziggiotto Altéa Ziggiotto (She/Her) | Art Director / Creative Strategist | Instagram: @amz.works I’m a multidisciplinary creative and conceptual artist, with a strategic mind and a perpetually curious mindset. Bold, imaginative and strong-willed, I’m always finding a way - or making one! Born in Milan, Italy, I’ve lived and worked across Milan, Paris and London. THE BRIEF : breaking into the creative industry with a conceptual, raw approach to Art Direction and Strategy. THE STRATEGY : my complexity. A creative mind, plagued shaped by logical thinking + a goal-oriented attitude + a rich, multifaceted background = profit-driven ideas that remain culturally relevant. THE TAGLINE : Sparked by New challenges. Fuelled by problem solving. Fulfilled in ingenuity. Go to Altéa's portfolio → @-webkit-keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } @-moz-keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } @keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } #extra-bg-wrapper-441747 { background-color: #000; } Thank you to our supporting agencies, contributors and mentors Agencies AnalogFolk Anomaly Dazed Design Bridge and Partners Design Studio Frog GoodVillans Grey Hope & Glory Lewis Moberly Monotype MOX London M&C Saatchi Group Nice and Serious No Signal / Recess Ogilvy Pearlfisher Saboteur SevenSix Smyle Take More Photos That Lot VINE Creatives WPP Bloom One Good Reason The Mix Mentors Sadie Devane, Nice and Serious Marie Boulanger, Monotype Matt Mitchell, AnalogFolk Alex Wood, AnalogFolk Peter Adlington, Freelance Silvia Arenas Artiga, Born Social Jake Attree, Lego Jermaine Balfourth, AF OLIVER Drucilla Burrell, Adobe Hannah Busbridge, Anomaly Jacob Denno, Innocent Debbie Fagan, Edelman Harry Fisher, Stamp Design Consultancy Kyle Green, NFTUK Jennifer Hayashi, Freelance Aaliyah Hassan, Black Curatorial Quinton Irons, Blacklist Ruben Joseph, Alliants Hardip Kaur, VMLY&R Emilie Chen, Freelance Lisa Rahman, Freelance Aaron Taylor, Amplify Chloe Templeman, Pearlfisher Frankie, MOX Cat Kevern, Electric Cat Productions Ltd Akhil Morjaria, TPXimpa