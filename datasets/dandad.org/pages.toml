title = "Creative Sustainability & Marketing For Social Good Awards | D&AD Impact 2025 | D&AD"
description = "D&AD Future Impact identifies and celebrates creative ideas that contribute towards a better, fairer and more sustainable future for all."
full_description = '''D&AD Impact D&AD Impact celebrates creative ideas that are driving the UN's 17 Sustainable Development Goals. It also helps creative ideas grow, by providing mentoring, training, visibility and funding to work that shows potential. Shortlisted in the Future Impact category? Apply for a development grant of up to £25,000 to develop your idea. The D&AD Impact Award You can submit your work into one of three categories. The Impact category is for work that’s been commercially released. This includes campaign communications, product and service designs, fundraising and business initiatives, community alliances and regeneration projects. You must demonstrate behavioural, environmental, social or policy change that’s happened as a direct result of the work. Win a coveted Wood, Graphite, White or Black Pencil; your name in the D&AD Annual; and four trees planted in your name as part of our partnership with Everclime. The Future Impact category is for early-stage designs and initiatives, recognised for their potential to drive change. This includes prototypes, beta designs, MVPs, and initiatives that have yet to be launched, but can demonstrate proof of concept. Shortlisted Entrants will receive a place on the D&AD Impact Programme and the opportunity to apply for a grant from the D&AD Impact Fund, worth £25,000. Win a coveted Future Impact Pencil; your name in the D&AD Annual; and four trees planted in your name as part of our partnership with Everclime. The Sustained Impact category seeks to recognise that has resulted in ongoing behavioural, environmental, social or policy change that are benefiting society. This includes campaign films, press adverts, posters, audio spots and brand activations created for real and virtual worlds. Win a coveted Wood, Graphite, White or Black Pencil; your name in the D&AD Annual; and four trees planted in your name as part of our partnership with Everclime. The D&AD Impact Programme .impact-subtitle-background { background-color: #EEE; padding-bottom: 1px; } Please accept marketing-cookies to watch this video. Information What is it? The D&AD Impact Programme is a 12-month package of mentorship, training and support that’s designed to support project owners with the ideation, launch and early growth of their work. It’s available to anyone shortlisted in the Future Impact category. A Future Impact cohort typically includes individuals, organisations and teams working on prototypes, MVPs, projects in testing or those that have recently launched. Through the programme we aim to to enable a cohort of creative thinkers, known as D&AD Impacters, to develop their projects within 12 months. The D&AD Impact Programme has given us a shrewd understanding of business structures and how to make our idea pay... We could never have imagined at the beginning of the programme, all the different books and projects we are now working on. It has introduced us to amazing contacts within the industry who have been generous with their time and amazingly enthusiastic. Thank you so much D&AD!!! — Georgina Potier & Jake Abrams, Get Better Books, 2021–2022 Cohort What can I win? Anyone shortlisted in the Future Impact category will receive place on the D&AD Impact Programme and the opportunity to apply for a development grant from the £25,000 D&AD Impact Fund. The Impact Programme includes: —12-month package of mentorship, training and support that’s designed to support project owners with the ideation, launch and early growth of their work —A space on a live D&AD Masterclasses of your choice —Access to D&AD’s on-demand courses for a year —The opportunity to ask the Impact Council for project support in the year following your win —The opportunity to present your work live to the D&AD Impact Council during a summer showcase to demonstrate your progress —Free entry into the D&AD Awards Impact category, valid for 3 years Regardless of whether you would like to participate in the programme, your work will appear in the D&AD Annual, online and freely accessible to the global creative community. In 2024 this reached an audience of over 200,000 people, three quarters of which are outside the UK. Winners receive a Future Impact Pencil, a symbol of creative excellence, and a tree planted in recognition of their award. Impact Fund The D&AD Impact Fund is a source of financial support for our awarded entrants. Anyone shortlisted in the Future Impact category is invited to apply for a development grant from the fund. Worth £25,000, applications will need to show how the money will be used toward the development of their awarded project. The funds must be spent within 12 months of being received. D&AD does not claim any ownership of, or expect any financial return from, projects that receive funding. The Fund will be allocated by the D&AD Impact Council at their discretion and based on the information provided in applications. In 2024, the full £25,000 of the D&AD Impact Fund was awarded to the project ViWipe: £25,000 to ViWipe; the world's first non-invasive, low-cost, paper-based HPV self-test empowering young women to prevent cervical cancer. ViWipe aims to save lives and reshape the future of cervical health. It utilises menstrual blood and dried blood spot technology for a women-centric, fast, and accurate HPV DNA test; as simple as using toilet paper. Eligibility Future Impact is for designs and initiatives that are on their way to being launched into the world. Prototypes, MVPs and work undergoing testing are all appropriate here. New product or service lines are also eligible under the same conditions. We do not accept ideas without proof of concept and campaign communications are not be eligible. Commercially released work will only be accepted in exceptional cases, where the work has not made a tangible impact yet and would benefit from the support of the D&AD Impact Programme. Work that has been commercially released and can demonstrate effectiveness should be entered into Impact. For more details around the eligibility, please see page 9 in the Entry Kit. Past Impact Fund Recipients $15,000 to Beirut's RiverLESS Forest (2019); A series of initiatives to address the deterioration of the polluted Beirut River. $3,800 to More Moms (2019); this project combines qualitative insights, quantitative data and customer experience design to improve the user experience of moms in advertising. £9,700 to Baby BSL: Where is the Bird? (2020); a new form of immersive publishing that empowers the parents of deaf and hearing children to use British Sign Language in the home. £3,300 to Breathe (2020); a smart chest-binding garment that allows the wearer to customise the tightness of the garment on-the-go. £12,000 to Get Better Books (2021); this series of interactive books is designed to help paediatric patients understand their journey through treatment and stages of recovery. £15,000 to Resting Reef (2023); an innovative memorial and eco-burial service that allows people to transform their remains into reef structures. £10,000 to Lungy Health (2023); initially released as a wellness app, Lungy’s technology will be developed into a platform for patients with breathing problems. Everything you need to know Download Terms & Conditions The nitty gritty details on what you can enter. Read D&AD Pencils Get more information on the Pencils available. Read Everclime Pencil winners fighting climate change. Download Entry Kit The D&AD Awards 2025 have launched. @-webkit-keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } @-moz-keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } @keyframes gradientAnimation { 0%{background-position:51% 0%} 50%{background-position:50% 100%} 100%{background-position:51% 0%} } #extra-bg-wrapper-442024 { background-color: #1c1c1c; } D&AD Impacter Testimonials Winning the D&AD Impact Fund is an important milestone for ViWipe. This recognition highlights the potential of our innovation in empowering young women to take control of their cervical health through accessible, affordable, and non-invasive HPV self-testing. We deeply appreciate D&AD for their support and funding, which will help us make a meaningful impact on women’s health. Together, we are working towards a future where cervical cancer is preventable for everyone. ​— Yihan Dong & Kenny Malpartida Cardenas, ViWipe, 2024 Impact Fund recipients Now, more than ever before, as we emerge from the coronavirus crisis, and enter a new set of conflicts, we must design universal systems. We must design beyond geographical boundaries. I have found these values that I try to communicate through my project Geoidentity, in the Impact D&AD Programme, mentors and staff transmit. They build bridges and connect people. Thanks to them, I learned how to generate impact, and how to tell different stories, to different people. But most importantly, I realised how much Geoidentity matters, and how to keep working on it. ​— Giorgia Maria Malandrino, Geoidentity: Logging the Border, 2021 – 2022 Cohort The Impact Council Imagine your work being seen by a collection of senior figures from across the creative, investment and social impact space. The D&AD Impact Council consists of designers, brands, CMOs, entrepreneurs, investors and tech stars. All of them are working towards a fairer, more sustainable future in their chosen field. All of them are an invaluable resource for you and your business. They judge the entries, help to mentor Future Impacters, and most of all, they help our winners thrive. Read Bio Ben Akers Co-CEO/Co-Founder Talk Club Read Bio Deborah Alden Founding Partner da/rk Read Bio Joanna Catalano HR Director Uber Read Bio Paco Conde Co-founder & ECD Activista Read Bio Ben Cooper Founder & Innovation Director Brainstrust Read Bio Amy Dick Chief Operating Officer Read Bio Cat Drew Chief Design Officer Design Council Read Bio ElsaMarie D'Silva Founder Red Dot Foundation Read Bio Kerstin Emhoff Producer & Chief Executive Officer Prettybird Read Bio Tom Evans Creative Director / Coach / Entrepreneur tomevans.consulting Read Bio Vince Frost Founder, CEO & Executive Creative Director Frost*collective Read Bio Rama Gheerawo President / Director IIX Institute / INSTILL LTD Read Bio Roshi Givechi Design Strategist, Filmmaker & Facilitator Read Bio Tim Hawkey Chief Creative Officer AREA 23 and IPG Health Canada Read Bio Lars Hemming Executive Chair Culture3 Read Bio Harsh Kapadia Global Creative Chair, Viiv Havas Health & YOU Read Bio Thomas Kolster Founder Goodvertising Read Bio Emily Kortlang Chief Marketing Officer Guayakí Yerba Mate Read Bio Remco Marinus Executive Creative Director Havas Lemz Read Bio Melissa Mbugua East Africa Partnerships Lead Radio Workshop Read Bio Sarah Moffat Global Chief Creative Officer Turner Duckworth Read Bio Jim Moriarty Founder Singlefin Read Bio Jane Murray General Counsel Institutional Investors Group on Climate Change (IIGCC) Read Bio Priya Prakash Founder & Chief Technology Officer Design for Social Change (d4Sc) Read Bio Ali Rez Chief Creative Officer IMPACT BBDO Read Bio Tom Richards Global Chief Creative Officer 21GRAMS Read Bio Tiffany Rolfe Chair & Global Chief Creative Officer R/GA Read Bio Sydney Scott Sam Founder Workspace Global Read Bio Billy Seabrook Sr. Partner, Global Chief Design Officer IBM Consulting Read Bio Ruchi Sharma Founder & CCO HumanSense Read Bio Ariana Stolarz Global Chief Strategy Officer Accenture Song Read Bio Kwame Taylor-Hayford Co-Founder Kin Read Bio Renato Winnig Brand Director & CMO Aramis Inc Case studies Read Case Study: Inglorious Fruits and Vegetable D&AD Impact Black Pencil Winner Watch Case Study: Breathe D&AD Future Impact Winner Read Case Study: The Lion's Share D&AD Impact White Pencil Winner Watch Case Study: Beirut RiverLESS D&AD Future Impact Winner Creativity as a Catalyst for Change — a D&AD Masterclass with WeTransfer While creativity for good is a personal and business imperative for many, our new course, made possible thanks to WeTransfer, will explore how to turn this awareness and intention into action. Led by creative change-makers, all working towards a more sustainable future in their chosen fields, this course will build creative confidence to bring world-changing ideas to life, from concept to creation. Accessible via a free on-demand course, available on D&AD's digital campus to complete at a time and pace to suit you, or via our exclusive cohort events. Enrol now D&AD Awards 2025 The award that makes creative careers. The ultimate standard of excellence. Enter now Sign up to D&AD news Sign up for the latest news, creative learning and inspiration from D&AD. hbspt.forms.create({ region: "eu1", portalId: "144450253", formId: "7ac0ab5f-3667-4333-ae14-e192a3d2de09" }); .speakers-grid .speaker-meta img, .product-call-to-action .item { filter: grayscale(100%); } .product-call-to-action .item:hover { filter: grayscale(0%); } .tabbed-panel-standard .tab-link { font-family: "ITCFranklinGothicStd-Demi", "Helvetica Neue Light", "Helvetica Neue", Helvitca, Arial, sans-serif; text-transform: uppercase; } strong { font-family: "ITCFranklinGothicStd-Demi", "ITCFranklinGothicStd-Hvy", "Helvetica Neue Light", "Helvetica Neue", Helvetica, Arial, sans-serif; } .tabbed-panel { padding-top: 20px; } .speakers-grid { padding-top: 0px; } div.product-call-to-action-full-width.text-black .tabbed-panel.tabbed-filter .multi-tabs-menu .tab .tab-link.active, div.product-call-to-action-full-width.text-black .actions-container ul li.has-detail-box .og-expander, div.product-call-to-action-full-width.text-black .actions-container li.has-detail-box:hover .item-occupation, div.product-call-to-action-full-width.text-black .actions-container li.has-detail-box.og-expand .item-occupation { background-color: #1c1c1c; } div.product-call-to-action-full-width .