title = "D&AD Shift Germany 2024 | Creative Advertising Placement Opportunities | D&AD"
description = "D&AD Shift Germany is a free workshop for aspiring creatives in Berlin & Hamburg."
full_description = '''Germany, it's time to #ShiftCreativity D&AD Shift Germany is an award-winning, free industry-led night school for self-taught creatives entering the advertising, design and creative industry from outside traditional pathways in Germany. Meet the Germany Class of 2024 below, the talent you need. #product-button-441858-46806 { background-color: #55d3ff; border-color: #55d3ff; color: #000; } #product-button-441858-46806:hover, #product-button-441858-46806:active { background-color: #FFF; color: #000; border-color: #FFF; } Meet Class of '24 Shift Stories Get involved 5 months, 19 Shifters, 3 Pitches and 1 Showcase D&AD Shifters have embraced five months of online and in-person learning with more than 15 creative agencies across multiple disciplines, from creative direction and design thinking to ideation, pitching, and strategy. They worked with O2 and FAQ YOU on two real-life creative briefs as well as a 'brief-in-a-day' challenge with adidas. Now ready to apply their skills to the industry, here's your opportunity to see what they're made of. Explore the work D&AD Shift Germany Class of 2024 Meet this year's cohort and filter by creative discipline. Discipline Art Director Creative Designer Strategist Illustrator #item-124462:hover .item-title, .og-expand #item-124462 .item-title { font-variation-settings: "wdth" None; } Anastasiia Khitsenko Anastasiia Khitsenko Anastasiia Khitsenko (She/Her) @shozalife Graphic Designer / Mixed Media Artist / Illustrator / Manager Hey, I am Anastasiia. Creative Graphic Designer with 3+ years of experience in social media content creation, 2D animation and multimedia production. Skilled in blending various techniques to craft innovative and engaging content for brands. Passionate about bringing ideas to life through designs & illustration. Go to Anastasiia's portfolio → #item-124463:hover .item-title, .og-expand #item-124463 .item-title { font-variation-settings: "wdth" None; } Ann Ider Ann Ider Ann Ider (She/Her) ​@annbitiouss Copywriter / Project Manager / Creative Director Hello, I'm Annbitiouss. As a child, I traded playgrounds for the enchanting realms of books and media. Today, I create environments where people discuss the essence of storytelling across diverse spaces—from your favorite brands to vibrant communities in beloved cities. Whether it's copywriting, project management, styling, or film production, I'm your creative encyclopaedia. With a keen eye for aesthetics and a deep interest in cultural anthropology and neuropsychology, I specialize in crafting compelling concepts and steering impactful projects. Let's bring your vision to life! Go to Ann's portfolio → #item-124464:hover .item-title, .og-expand #item-124464 .item-title { font-variation-settings: "wdth" None; } Colette Pomerleau Colette Pomerleau Colette Pomerleau (She/Her) ​@ofcuriosities Photographer / Visual Artist / Concept Creative / Art Director I’m Colette Pomerleau: a creative powerhouse born in Las Vegas, now based in Berlin. I’ve spent the last 10 years as a freelance photographer, conceptualizing visual stories for brands, writing for culture and design publications, and managing communications for creative offices. I’ve honed in on a narrative which celebrates inclusivity and imaginative storytelling, often with a focus on the “soft gaze”—the tender, quiet, vulnerable moments which reveal our shared humanity. With anticipation and curiosity, I'm looking forward to whatever comes next. Go to Colette's portfolio → #item-124465:hover .item-title, .og-expand #item-124465 .item-title { font-variation-settings: "wdth" None; } Daniela Missinou Daniela Missinou Daniela Missinou (They/Them/She/Her) @daniela.selom Photographer /Editor / Visual Artist / Mixed Media Artist I'm Dan, a Black, queer multidisciplinary creative with a passion for working mixed media and a growing passion for filmmaking. My unique perspective can be refreshing in a world that focuses on a standardized representation. With a strength in visual storytelling, a strong will to experiment, user research skills and a love for collaborating with like-minded people, I believe that together innovative, experimental and maybe revolutionary stories can be told. Go to Daniela's portfolio → #item-124466:hover .item-title, .og-expand #item-124466 .item-title { font-variation-settings: "wdth" None; } Emiliano Giangreco Emiliano Giangreco Emiliano Giangreco (He/Him/They/Them) ​@emilianogiangreco Visual Artist / Photographer / Filmmaker / Concept Creative I'm Emiliano, a queer visual artist based in Berlin. Over the years, I've focused on visual storytelling through passion and professional projects, exploring photography, filmmaking, fashion, and concept creation to blend all my creative interests. After studying law and working in hospitality, I realized my true calling was always my art and that I needed a way to express myself, my queerness, my identity. Now, I'm excited to grow, take on new challenges, and connect with other creatives. Go to Emiliano's portfolio → #item-124467:hover .item-title, .og-expand #item-124467 .item-title { font-variation-settings: "wdth" None; } Lara Thul Lara Thul Lara Thul (She/Her) ​@larathuldesign Graphic Designer / Illustrator / Art Director Hi, I’m Lara. In school, I was that kid who was always writing stories and drawing pictures when she wasn’t supposed to. Now, I am a self-taught graphic designer with a passion for visual storytelling and a special interest in illustration and video editing. I am passionate about many things, I haven’t met a problem I haven’t tried to solve, and I am always on the lookout for my next creative challenge. You’ve got one of those? Hit me up! Go to Lara's portfolio → #item-124468:hover .item-title, .og-expand #item-124468 .item-title { font-variation-settings: "wdth" None; } Linda Neumann Linda Neumann Linda Neumann (She/Her) ​@linda.nm Concept Creative / Designer Hi it's Linda, a multidisciplinary creative based in Berlin. I am a psychology graduate and dancer who started walking the path of creative concept and design. No surprise that this combination led to a passion for visual stories filled with both motion and emotion. I have built skills across a variety of media. But my heart and my hard drive have been filling with projects in graphic and motion design. Go to Linda's portfolio → #item-124469:hover .item-title, .og-expand #item-124469 .item-title { font-variation-settings: "wdth" None; } Marharyta Borysova Marharyta Borysova Marharyta Borysova (She/Her) LinkedIn Graphic Designer / Visual Communication / Branding & Identity Hello! I’m Margo. I collect experiences and turn them into meaningful designs. I am a graphic designer focused on branding and visual identity, with multidisciplinary skills in printing and illustration, UI-UX, web design and 3D modeling. In my work I strive to create a perfect balance between creativity and logic, in order to communicate in the most clear and appealing way. I believe that you can find beauty everywhere. I just make it more visible for everyone to see. Go to Marharyta's portfolio → #item-124470:hover .item-title, .og-expand #item-124470 .item-title { font-variation-settings: "wdth" None; } Mario Andric Mario Andric Mario Andric (He/Him) ​@justmariosportfolio Creative Writer / Creative Director Do you know what's good? Salt sticks and chocolate. At first, you might think, "What a weird combo, those should be separate." But if copywriting is salt sticks and creative direction is chocolate, I'm that tasty combination called Mario. Once you try it, you might find yourself a fan. So, if you're up for a mouth-watering Bosnian & queer fusion, served with a glass half full, you should check out my portfolio or just hit me up! Go to Mario's portfolio → #item-124471:hover .item-title, .og-expand #item-124471 .item-title { font-variation-settings: "wdth" None; } Marta Litson Marta Litson Marta Litson (She/Her) @shydandy.creates Designer / Art Director / Concept Creative I am a Designer & Art Director with a background in leadership and operations, now specializing in branding and communication. My passion lies in infusing every project with a vibrant, nostalgic vibe that resonates deeply. What sets me apart is my ability to blend modern aesthetics with a touch of magic, crafting projects that captivate and connect. If you’re looking for someone who can bring creativity, dedication, and a fresh perspective to your team, I’m your choice. Go to Marta's portfolio → #item-124472:hover .item-title, .og-expand #item-124472 .item-title { font-variation-settings: "wdth" None; } Nicole (Nika) Klassen Nicole (Nika) Klassen Nicole (Nika) Klassen (She/Her) ​@nika.noema.poemas Writer (Copy, Poetry, Lyrics, Articles) / Musician / Illustrator / Event Coordinator / Campus Manager Nika - means victory in ancient Greek. With roots in Siberia and Kazakh Mennonite Exile, being born in Germany, I have a multicultural perspective. My ability to improvise, analyze, and organize makes me a valuable team member. I create music (singer/songwriter), poetry & tales (self-published my book „Seelenklang"" last summer), copies, articles, and events. I aim to move and connect people through my work. I advocate for mental health awareness and intersectional feminism, supporting safe spaces for growth (Coding Bootcamps, Open Stages, voluntary work,...). Go to Nika's portfolio → #item-124473:hover .item-title, .og-expand #item-124473 .item-title { font-variation-settings: "wdth" None; } Otto Windmöller Otto Windmöller Otto Windmöller (He/Him) @otto1hunnid Art Director Hey, I'm Otto! My background is in music and fashion videos - covering a to z: direction, production, filming and editing and I'm progressively moving more into advertisement and conceptual work. Since we might work together I’m gonna tell you now: you will see me coping my ocd over pushing pixels around on Miro boards presentation decks and production plans. If I could tell you how little budget most of my projects had without killing my future dayrates... let's put it this way: I’m still paying off my Mac. So imagine what we could do with a little more than status quo? Go to Otto's portfolio → #item-124474:hover .item-title, .og-expand #item-124474 .item-title { font-variation-settings: "wdth" None; } Paula Smiri Paula Smiri Paula Smiri (She/Her) ​@paulasmiri Concept Creative / Copywriter Hi, I’m Paula, a 28-year-old Creative, married, and mom to a 5-year-old boy. My belief? Advertising is more than selling – it's art at its finest and can influence generations. Remember when Santa didn't always wear red? (Thanks, Coca-Cola!) My journey has been anything but linear. From selling phone contracts to customer care, I've done it all in minimum wage jobs. In February 2024, I started freelancing as a concept developer and copywriter, turning an internship at high.media into my first client. Ready to shift perspectives? Let’s talk! Go to Paula's portfolio → #item-124475:hover .item-title, .og-expand #item-124475 .item-title { font-variation-settings: "wdth" None; } Rocío Tenaglia Rocío Tenaglia Rocío Tenaglia (She/Her/They/Them) ​@bleusnotfound Art Director / Photographer / 2D Animator / Writer Hola ˖⁺‧₊˚♡˚₊‧⁺˖ My name is Rocío Tenaglia. I'm an Argentinian curious-creative based in Berlin. My life is driven by visual arts, communication and magical mystery. The diversity of my Latin American, Italian and Andalusian roots shaped the way I see the world and my passion for stories, native plants, communities and culture. I've been working as a freelance photographer, art director & animator for more than a decade. Currently looking for creative work, cool projects or nice conversations. Contact me! Go to Rocío's portfolio → #item-124476:hover .item-title, .og-expand #item-124476 .item-title { font-variation-settings: "wdth" None; } Sarah Yilma Sarah Yilma Sarah Yilma (She/Her) ​@creatingmyvibe Content Creator / Art director / Illustrator / Social Media Marketer / Canva Creator Hi! I'm Sarah, a visual content creator with 5+ years of experience in social media marketing, content creation and illustration. I'm always online somewhere and love exploring emerging platforms. Engaging with diverse communities through social media campaigns made me realize that creatives are responsible for messaging sent out into the world. Every project I work on benefits from my distinctive perspective and creative vision. Want to create impactful work together? Get in touch. Go to Sarah's portfolio → #item-124477:hover .item-title, .og-expand #item-124477 .item-title { font-variation-settings: "wdth" None; } Sumit Roy Sumit Roy Sumit Roy (He/Him) ​@sumitfotoblog Visual Artist I'm a creative director with a multicultural background and extensive experience in visual design, specializing in graphics design and photography. My work focuses on creating impactful stories. Driven by curiosity and collaboration, I strive to bring the best out of both myself and my clients. I thrive on learning opportunities and believe in working efficiently and empathetically. Expect a dedicated professional who will be by your side, helping your business shine while I handle the visual design. Go to Sumit's portfolio → #item-124478:hover .item-title, .og-expand #item-124478 .item-title { font-variation-settings: "wdth" None; } Tari Çalışkan Tari Çalışkan Tari Çalışkan (He/Him) LinkedIn Creative Strategist / Researcher / Copy Writer I am a multidisciplinary strategist passionate about enabling innovation and change making. With a decade of experience, I've worked in various communication roles, gaining first-hand experience across every stage of the marketing mix. My curiosity and empathy make me an excellent researcher and strong networker, building valuable connections. Known for my holistic approach and diverse background, I bring unique perspectives to create newness and amplify projects. My motto: create relevancy to mobilize minds. Go to Tari's portfolio → #item-124479:hover .item-title, .og-expand #item-124479 .item-title { font-variation-settings: "wdth" None; } TJ Jeromin TJ Jeromin TJ Jeromin (He/Him) ​@teejaythecreat0r Illustrator / Art Director / Designer I'm TJ, a multidisciplinary creative based in Berlin. I thrive on customizing the world around me, giving everything my unique visual touch. My artistic playground spans paintings, sculptures, writing, content creation, and photography. Authenticity and culture are my guiding stars. I draw inspiration from the vibrant streets of Berlin and the urban landscapes of big cities worldwide, seeing the world through a child's eyes. Creating is life itself, and I embrace every avenue to unleash my boundless creativity. Go to TJ's portfolio → #item-124480:hover .item-title, .og-expand #item-124480 .item-title { font-variation-settings: "wdth" None; } Vlada Kovbasa Vlada Kovbasa Vlada Kovbasa (She/Her) ​@world_dancefloor_ecoguard Fimmaker / Art Director / Dancer / Collaborator Hi, I'm Vladirector :) And I do story'''
