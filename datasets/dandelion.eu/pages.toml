["https://dandelion.eu"]
title = "Dandelion API - Semantic Text Analytics as a service"
description = "Semantic Text Analytics API: From text to actionable data: extract meaning from unstructured text and put it in context with a simple API."
full_description = "Context Intelligence: from text to actionable data. Extract meaning from unstructured text and put it in context with a simple API. Thanks to its revolutionary technology, Dandelion API works well even on short and malformed texts in English, French, German, Italian, Spanish and Portuguese. Find mentions of places, people, brands and events in documents and social media. Easily get additional data about the entities. Identify whether the expressed opinion in short texts (like product reviews) is positive, negative, or neutral. Automatically identify important, contextually relevant, concepts and key-phrases in articles and social media posts. Compare two texts and compute their syntactic and semantic similarity. Understand when two texts are about the same subject. Understanding how a bank operates, who its clients are and how the bank behaves with regard to different industry sectors and geographic areas are very valuable information for marketers. Until today, this kind of information was obtained from very expensive, poorly representative and often very imprecise market studies subject to rapid obsolescence. Read about how our clients used Dandelion API to analyze millions of public documents in order to understand the relationships between more than 5 million companies and their banks. Extracted entities are linked with the huge amount of additional data available in our internal Knowledge Graph, which contains both open and proprietary high-quality data. This Knowledge Graph is in turn linked to the Linked Open Data Cloud. Instead of classic NLP technologies, Dandelion API leverages its underlying Knowledge Graph, without relying on traditional NLP pipelines. This makes it faster, more scalable, easier to customize and natively language independent. Easy to integrate into existing systems via a powerful REST API, the engine runs on a scalable infrastructure that can process millions of documents per-day. We also offer on-premise integration for enterprise customers with special data protection issues."
