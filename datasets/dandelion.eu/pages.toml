title = """
Dandelion API docs |    Dandelion API"""
description = """
Here you will find generic information about our APIs: how to authenticate,         how to submit requests and interpret the responses, what error you could        meet and why, and so forth. If you don't find something try looking        in the specific documentation of the API you're using (our        documentation HQ is a good starting        point) or write in our     support forum."""
full_description = "Here you will find generic information about our APIs: how to authenticate, how to submit requests and interpret the responses, what error you could meet and why, and so forth. If you don't find something try looking in the specific documentation of the API you're using (our documentation HQ is a good starting point) or write in our support forum . Every one of our APIs follows a general schema for requesting data. All the requests must be sent, either by GET or POST, to the API endpoint, which follows this structure: Every request must be authenticated. Dandelion API implements authentication through a single token parameter which univocally identify the caller. Currently only one token is given to each user, but we plan to let you create more than one in the near future. We still support the legacy authentication scheme, which uses the pair (app-id, app-key). Show me more We limited the size of each request to a maximum of 1MiB (therefore 1048576 bytes, just to avoid confusions). Unlikely you will need to submit larger requests, and if you do it's probably a symptom of misuse; maybe you should think of splitting your query in more requests? Dandelion API has a rate limit of 50 calls per second per token (or $app_id/$app_key pair if you are still using the old authentication method). If you exceed the rate limit your request will be denied with the status code 429 and the error code error.RateLimitExceeded Independently of the API you're using, Dandelion will give you some information using HTTP headers. Since each API has its own output structure, this allows you to access such information in a standard way, without customizing your code based on the API you are accessing. Such headers are: In case of errors, the response will contain an object with the following structure (other than having the status-code set as of the HTTP standard, of course): Dandelion API built with ❤ by SpazioDati S.r.l. Company subject to management and coordination of Cerved Group S.p.A."
