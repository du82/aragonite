["https://dandelion.eu/api-privacy"]
title = "Data privacy and retention policy | Dandelion API"
description = "Semantic Text Analytics API: From text to actionable data: extract meaning from unstructured text and put it in context with a simple API."
full_description = "SpazioDati is committed to right to privacy and to the ethical use of information online. We adhere strictly to the following privacy practices. We take every possible care to protect the security of our Users and Customers information. We use SSL encrypted technology to protect the transfer of data and personal information. We store any personal information on secure servers and use state of the art, industry standard protections and procedures to ensure the safety of such information. We follow generally accepted industry standards to protect the personal information submitted via our service, during transfer and once it has been received. We collect and combine personal data, such as name, addresses, emails, telephone numbers, both online and offline through public sources, commercially available databases and our websites. Personal data may be kept in its identifiable form, or in an aggregated form (so that individuals cannot be identified). While we take every possible care to assure the quality of data, the nature of the internet and our business means we cannot guarantee that all information stored on or transmitted to or from or servers will be free from unauthorized access. By using the SpazioDati Services you acknowledge that you understand and agree to the risks involved. Retention We will keep Personal Information only so long as it is necessary, including for the purposes of updating the product or services or as required by law. When the Personal Information is no longer required, it will be destroyed either by shredding or other approved destruction methods to prevent unauthorised parties from gaining access to the information during and after the process. We will safeguard information in our custody. In particular private input text that is submitted by users to the API (https://api.dandelion.eu/) is stored by SpazioDati for 60 days for the sole purpose of maintenance and bug fixing. We never analyze data submitted by users to improve our algorithms and models. For internal purposes we do track high-level usage stats (“usage stats”) which are necessary for service monitoring and customer billing. These usage stats include features used, number of calls made and parameters used by our users. Hosting providers As is common practice for SaaS providers we partner with hosting providers from whom we lease servers. At SpazioDati we work with Amazon Web Services (“AWS”), for further details refer to AWS privacy policy and information about AWS cloud compliance: https://aws.amazon.com/privacy/ https://aws.amazon.com/compliance/eu-data-protection/ Secure access and transfer of data Access to SpazioDati servers and the transfer of data to and from SpazioDati servers is over a SSL encrypted connection. SpazioDati uses technology and security precautions, rules and other procedures to protect your personal information from unauthorized access, improper use, disclosure, loss or destruction. To ensure the confidentiality of your information, SpazioDati uses also industry standard firewalls and password protection. It is, however, your personal responsibility to ensure that the computer you are using is adequately secured and protected against malicious software, such as trojans, computer viruses and worm programs. You are aware of the fact that without adequate security measures (e.g. secure web browser configuration, up-to-date antivirus software, personal firewall software, no usage of software from dubious sources) there is a risk that the data and passwords you use to protect access to your data, could be disclosed to unauthorized third parties."
