full_description = '''Language Detection API is a simple language identification API; it is a tool that may be useful when dealing with texts, so we decided to open it to all our users. It currently supports 96 languages. Remember to authenticate yourself specifying the token parameter (or the legacy $app_id and $app_key pair). See the API doc about authentication for any questions. For more information about status codes and error handling please refer to the dandelion generic API documentations. The cost of each request can be found in the response headers as described here. Dandelion API built with ❤ by SpazioDati S.r.l. Company subject to management and coordination of Cerved Group S.p.A. site privacy | api privacy | tos | cookies | consent preferences (function (w,d) {var loader = function () {var s = d.createElement("script"), tag = d.getElementsByTagName("script")[0]; s.src = "//cdn.iubenda.com/iubenda.js"; tag.parentNode.insertBefore(s,tag);}; if(w.addEventListener){w.addEventListener("load", loader, false);}else if(w.attachEvent){w.attachEvent("onload", loader);}else{w.onload = loader;}})(window, document); We're a startup based in Italy, specialized in Semantics & Big Data.Find out more about us at spaziodati.eu'''
