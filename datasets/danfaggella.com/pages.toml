description = "Daniel Faggella is Founder and Head of Research at Emerj Artificial Intelligence Research. He is a globally recognized speaker on the use-cases and ROI of"
full_description = 'About me Daniel Faggella is Founder and Head of Research at Emerj Artificial Intelligence Research. He is a globally recognized speaker on the use-cases and ROI of artificial intelligence in business. Emerj serves over a million enterprise readers and listeners per year by providing AI ROI insights directly from Fortune 500 AI leaders in the form of articles, podcasts, and research products. Called upon by organizations like the United Nations, OECD, World Bank, INTERPOL, and global pharmaceutical and banking companies, Daniel helps business and government leaders get a clear picture of AI’s near-term and long-term impact. Daniel’s AI predictions and research has been featured in TechCrunch, Inc, Xconomy, Forbes, and more. His research is referenced in Harvard Business Review, the World Economic Forum, MIT Technology Review, and more. Daniel is a Brazilian Jiu Jitsu black belt, winning the title of 2011 national champion (IBJJF Pan America Games). He graduated with a masters degree from UPENN, focusing his thesis research on skill acquisition. Daniel previously founded and sold an Inc 5000 educational eCommerce firm called Science of Skill LLC, based on his UPENN thesis work. Born in Wakefield, Rhode Island, he now lives in Boston. Contact: dan [at] emerj [dot] com <img fetchpriority="high" decoding="async" width="380" height="427" src="https://danfaggella.wpenginepowered.com/wp-content/uploads/2024/02/faggella-avatar.png" alt="" class="wp-image-2149" srcset="https://danfaggella.wpenginepowered.com/wp-content/uploads/2024/02/faggella-avatar.png 380w, https://danfaggella.wpenginepowered.com/wp-content/uploads/2024/02/faggella-avatar-267x300.png 267w" sizes="(max-width: 380px) 100vw, 380px" /> <img decoding="async" width="182" height="52" src="https://danfaggella.wpenginepowered.com/wp-content/uploads/2024/02/linked-in-1.png" alt="" class="wp-image-2151"/> <img decoding="async" width="182" height="52" src="https://danfaggella.wpenginepowered.com/wp-content/uploads/2024/02/twitter.png" alt="" class="wp-image-2152"/>'
