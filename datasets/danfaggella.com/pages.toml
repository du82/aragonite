full_description = "Emerj is committed to ensuring that your privacy is protected. Should we ask you to provide certain information by which you can be identified when using this website, then you can be assured that it will only be used in accordance with this privacy statement. Emerj may change this policy from time to time by updating this page. You should check this page from time to time to ensure that you are happy with any changes. This policy is effective 25th December 2015. Information collected For the purposes of relevance in our email communication we will collect your name and email address, as well as potential survey information about your role (entrepreneur, researcher, investor, etc…) or interests. None of this information is shared, leased, or sold to third parties. Security and protection Managerial and technical procedures are in place to protect the limited information that Emerj does collect. External links Links within Emerj article are intended to (a) source – as directly as possible – a statistic, fact, or quote, (b) provide a useful perspective or opinion from a source we deem credible and a value-add to the article itself, (c) is a useful aggregation of credible or interesting resources that fits well into an article. We aim to link to the source of information, and link only when value or perspective will be added to our material via said link. Links to other websites are not intended to be endorsements of the opinions or perspectives of those sources. Links are based on our writers’ opinion on the merit of the content. Our own privacy policy obviously does not extend outside the boundaries of our own web properties, so please read the policies of other websites when directed elsewhere. Cookies Emerj employs Google Analytics to our website in order to improve the experience for our users, and pick up on trends and engagement so that we can better serve our readers and subscribers. Like most media websites, we collect limited information (internet protocol addresses, browser type, internet service provider, referring/exit pages, operating system, date/time stamp) which is stored automatically in log files. This information is not tied to personal information for any particular user, and is never shared with third parties. Editorial coverage and statements Readers from around the world trust Emerj to assess companies, use-cases, and applications objectively. We have no agenda to either disparage or praise any organization or person we write about. Our ideas are simply our opinions, informed by our own primary or secondary research. Organizations or persons who believe that we have misrepresented a company or organization can message us directly at editorial [at] emerj [dot] com. While we are open – at our own discretion – to edit factual information when provided with proper sources, we are not obligated to take down or change any content based on a person or party disagreeing with our statements. Our content is our own opinion, and the trust of our readers depends on our firm objectivity, and ability to state the facts and interpret the facts with clarity."
