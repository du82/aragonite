full_description = "In the ever-evolving tapestry of fashion and youth subcultures, the New Romantics of the 1980s emerged as a vibrant and revolutionary movement. Known for their flamboyant style, gender-bending fashion, and a passion for all things theatrical and Bowie-related, the New Romantics left an indelible mark on pop culture via groups like Depeche Mode, Duran Duran, Culture Club, and Spandau Ballet. And there was also Visage, the post punk synthpop supergroup comprised of members, then present or former, of Magazine (Barry Adamson, Dave Formula), Siouxsie and the Banshees (John McGeoch), Ultravox (Midge Ure, Billy Currie) along with Steve Strange and Rusty Egan, who arguably started the whole scene by giving it a place to flourish, first at a West End dive bar called Billy’s and later at the Blitz nightclub. Embedding herself among these after dark denizens, photographer Sheila Rock captured this extraordinary scene like no other. Rock’s remarkable images of the New Romantics preserves a moment in time when fashion, music, and rebellion converged to create a cultural phenomenon. She’s put together a new book of these portraits titled New Romantics - From Billy’s to the People’s Palace published by MOONBOY Books. Sheila Rock: The name ‘New Romantics’ didn’t come into use until much later – but the scene was really born with the Bowie nights at Billy’s in the autumn of 1978. Steve Strange and Rusty Egan chose this very run-down bar on the edge of Soho as the location for their nights dedicated to the music of David Bowie and of course it attracted a highly creative crowd – many of them had been part of the punk scene, including Steve himself, so they were predisposed to dressing up and having a good time and cared little about what others thought! Rusty Egan, left, Steve Strange, 2nd from right, at Billy’s 1978 When did it reach critical mass and which media outlets first noticed? The Face and iD magazines were probably the first to report the movement in relation to what people were wearing - and Spandau Ballet were regulars at the Blitz so reports of their low-key/secret gigs around London started to appear in the music press along with photos of their exotically dressed followers. It was the usual kind of osmosis, where a small cult becomes mainstream by attracting attention – almost a form of self-destruction."
