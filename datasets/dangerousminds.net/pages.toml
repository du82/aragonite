["https://dangerousminds.net/categories/category/politics"]
title = """
Topic: Politics         |     Dangerous Minds"""
description = "Dangerous Minds is a compendium of the new and strange-new ideas, new art forms, new approaches to social issues and new finds from the outer reaches of pop culture. Our editorial policy, such that it is, reflects the interests, whimsies and peculiarities of the individual writers. We are your favorite distraction."
full_description = "The question Mark, is this: Where to begin the discussion of the great free-thinker and theorist that was Mark Fisher – when the object was somebody who dealt with the ambiguity of time itself? Can I outdo the last intellectual missive on the matter? I very much doubt it. Should I want to? If I learnt anything about Mark, I can wholeheartedly say no, I shouldn’t. He would much rather I invest my time reaching the audiences, who as yet, are entirely unaware of both him and his work. Or, better still, devising methods of my own, capable of derailing the deluge of despair, that dictates your cyclical resignation to “whatever will be, will be”, as Doris once sang. Mark’s switching of the baton to me, is not a position of privilege that I, and I alone hold, you understand? Mark made the case for all to seize it – and in turn pass it on – if we are to achieve what is required to tack through the ill-wind that blows. And that is poignant. For it was Raymond Briggs, who, with his graphic novel When The Wind Blows (pub. 1982), made his much needed anti-nuclear narrative, accessible to children. Briggs, like Fisher and other great writers, recognised that in order to avert what is seen by some as the inevitable future – one must reach the youngest of audiences. Far too many of those – now in their 40s and 50s – are fully accepting of all that their political ‘leaders’ feed them. Mark’s work, as well as being a call to arms, is an open invitation to be challenged in order to instil agency, and ignite – with a ferociousness like I have never seen before – an anarchical phenomenon that has reached even the eye of Chile’s president, Gabriel Boric. Therefore, proving itself capable of playing an entirely different game, and winning. Which, in itself, brings me to my penning this and contributing to Niall McCann’s forthcoming film about Mark Fisher’s life & work – Lost Futures. Niall is committed to making Mark accessible to as many and varied an audience as possible. Let’s assist. For every person who’s aware of Mark Fisher’s work, there are infinite others who aren’t. If his unparalleled discourse is to hold the status of his ‘lasting legacy’, which we, his devotees rightly bestow upon him, then it is us – those already well-versed in his vision – who carry the honour of the arduous task of spreading his word. And yes, it will be arduous, but that’s the least we, who claim to admire Fisher, should be prepared to shoulder, if we are worthy of declaring ourselves to be forever changed and inspired by his work. It’s worth remembering the integral role that the blessing and a curse – that is the internet – has to play, in facilitating these necessary connections. When Fisher cast his critique of the net, so ably identifying all its holes, he did so in the hope that it would all be stitched up with better solutions. After all, there is no catch to be had, without the means to captivate what lies beneath. He plunged us to the depths in helping us to understand the effects of social media, so as to provide us with the determination to surface, with all manner of attached material coming up for air with us."
year_published = 2022
