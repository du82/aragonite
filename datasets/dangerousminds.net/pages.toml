description = "Dangerous Minds is a compendium of the new and strange-new ideas, new art forms, new approaches to social issues and new finds from the outer reaches of pop culture. Our editorial policy, such that it is, reflects the interests, whimsies and peculiarities of the individual writers. We are your favorite distraction."
full_description = "Karl Marx always looked like he had birds nesting in his beard or maybe a smorgasbord of food debris clogging up his grizzled follicles from the last few meals he’d scoffed. He never looked quite healthy. He wasn’t. He drank too much, smoked too much (noxious cheap cigars), and was almost driven demented by a rash of painful boils on his butt that meant he did a lot of his writing standing up. More importantly, he hardly looked like the guy who is regularly blamed for the state oppression and the genocide of millions of people under communism or socialism or whateverism. If Marx knew the atrocities supposedly carried out in his name he’d probably swing fists or hurl chunks. The gulf between Marx’s ideas and the practice of so-called communism and socialism as has all-too often been carried out in his name is like the difference between those dour gritty portraits of a bad Santa and what the real Karl Marx was like as a person. Photographic portraits of Marx don’t suggest a guy who wrote poetry, loved his wife with a passion, doted on his kids, and was once a hellraiser of a student—getting drunk, causing mayhem, and being chased by the police after one too many for the road. He was also scarred in a duel and exiled from Germany, Belgium, and France over his barbed and satiric attacks on these countries often despotic rulers. Marx was a man of action always willing to lead the fight who eventually settled for a life of sedentary toil to produce works that changed the world. He was also a voracious reader who loved the works of Shakespeare and could quote entire plays by the Bard—just as his children could—and generally took an interest in everything. “Art,” he said, “is always and everywhere the secret confession, and at the same time the immortal movement of its time.” No idea or philosophy or culture was foreign to him, and there was nothing that didn’t keen his interest. Yet, he could also be bad tempered and foul to those who went against him. And on occasion was anti-semitic and racist—he described one poor frenemy (Ferdinand Lassalle) as a Jewish n-word. No saint, but all human."
