["https://dangerousminds.net/categories/category/Books"]
title = """
Topic: Books         |     Dangerous Minds"""
description = "Dangerous Minds is a compendium of the new and strange-new ideas, new art forms, new approaches to social issues and new finds from the outer reaches of pop culture. Our editorial policy, such that it is, reflects the interests, whimsies and peculiarities of the individual writers. We are your favorite distraction."
full_description = "This is a guest post by Spencer Kansa, author of Wormwood Star: The Magickal Life of Marjorie Cameron, Zoning and Out There: The Transcendent Life and Art of Burt Shonberg. (Authors note: This feature was meant to be accompanied by an interview with the artist Mark Wardel, but sadly, due to ill health, this has not been possible. We wish him the speediest of recoveries.) Doubtless, there are naysayers who may wonder whether the world needs yet another book dedicated to David Bowie, a man whose many lives and multifaceted career have been exhaustively, though not always accurately, scrutinised over the past six decades. The Bowie shelf in the Rock and Pop Hall of Records is as prodigious as any, and it’s tricky to find a new angle on an artist who was a genre unto himself or discover any unexplored territory that hasn’t already been charted. For the faithful, there remains a vain hope that his dutiful personal assistant, Corinne “Coco” Schwab, may one day share her memories of the man she devoted her life to. But, as the years pass, this looks unlikely to happen. Still, two new book releases underscore why Bowie remains such an endlessly fascinating and eternally elusive subject. A one-man cultural revolution whose protean influence impacted all the creative arts; whose sway cut across all strata of society: from gutter punks to members of European royalty. For new/latecomers, David Bowie Rainbowman: 1967-1980, by Jérôme Soligny, presents a comprehensive guide, concentrating mostly on the decade Bowie musically, artistically and creatively owned; when the release of a new album by him was treated as a cultural event. As a veteran journalist for the French music bible Rock & Folk, Soligny interviewed ‘the Guv’nor’ many times over the years, and, as a fellow recording artist, he developed a friendship not only with his subject but with Tony Visconti and Mike Garson, too, who both provide flattering forwards. Soligny sets up each chapter with an authoritative opening salvo from the Duke himself regarding each era, and then, in a workmanlike fashion, proceeds to document the year each landmark album was recorded, as well as all the creative offshoots, groundbreaking spectacles and social-cultural shockwaves that sprung from them. He then hands things over to the musicians and cohorts, famous fans and influencers who contributed to or were inspired by them, in an oral history that fleshes out the details."
