description = "Dangerous Minds is a compendium of the new and strange-new ideas, new art forms, new approaches to social issues and new finds from the outer reaches of pop culture. Our editorial policy, such that it is, reflects the interests, whimsies and peculiarities of the individual writers. We are your favorite distraction."
full_description = "“A report in 2019 revealed that Queen Elizabeth II and her family cost the British people £67 million per year,” says grateful subject Andrew Liles, introducing his elongated version of the Sex Pistols’ “God Save the Queen.” The monarchy is a sweet deal for Britons, since the royals put on the occasional horse show starring Tom Cruise to thank the common people for expending their lives in toil so that their betters may luxuriate among jeweled combs and Sèvres tea services. Now, Liles has found a musical way to tell the royals “you’re welcome” for the generalized misery that supports their year-round debauch: extending Her Maj’s favorite Pistols choon from a length of about three minutes to 45, one for each year since 1977. In all likelihood, this is the very melody she will be humming this morning while she consumes a year of your wages for breakfast. I was on my old friend Douglas Rushkoff’s Team Human podcast. We taped this just before news of George Floyd’s murder became widely known, and talked for over four hours over the course of two long calls. The edited version is just under an hour. It’s always fun to have a conversation with him. Playing for Team Human today, counterculture icon and Editor of Dangerous Minds, Richard Metzger. Metzger envisions what life might look like on the dole and what that means for the future of the counterculture. Rushkoff and Metzger consider whether the ideals of yesterday’s counterculture were so successful that they’ve become the new over culture? And if so, who really are the new revolutionaries? They also consider the effect Covid-19 will have on a new generation’s financial prospects, and whether the underlying flaws in capitalism will finally be laid bare. In his monologue, Rushkoff looks at the way our policing problems can only be solved if we fund and utilize other kinds of civil servants instead of just ones with weapons. A tour of every department of our media saturated society, the most explosive conspiracy ever conceived, the people shapers at every turn we see ourselves as they want us to be."
