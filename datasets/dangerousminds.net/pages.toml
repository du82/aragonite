description = "Dangerous Minds is a compendium of the new and strange-new ideas, new art forms, new approaches to social issues and new finds from the outer reaches of pop culture. Our editorial policy, such that it is, reflects the interests, whimsies and peculiarities of the individual writers. We are your favorite distraction."
full_description = "LOST Season 5 might have gone out with its usual bang, but that doesn’t mean the summer ahead can’t still be long and hot. When you’re done combing through Lostpedia’s The Incident theory page (it’s endless, I know), you might want to dip a toe, or something, into the wacky alt waters of Lost slash (fan) fiction. A 3-way between Ben, Locke and Richard…sure, why not? Desmond choosing Sayid over Penny…yeah, I can see that! What I find fascinating about these HIGHLY detailed reconfigurings, of course, is not the nature of the participants or their transgressions, but how they expose that nagging, near-universal hunger to see our hopes, dreams, fantasies—whatever they may be—projected through the prism of popular culture. Then again, maybe there’s just a LOT of people out there who wanna see Jack and Sawyer feeding each other mangos! I may be the last person to find out about this, but since I’m American, it’s OK: Luke Haines, the greatest British songwriter of the 1990s, has released a book detailing his bitter memories of the Britpop years and being completely ignored by the public at large. Entitled “Bad Vibes: Britpop and My Part in Its Downfall,” the book was released in the UK in February. So far no release in the US, nor is there likely to be, ever, so suck it up and pay the postage. Haines, who laid down the template that Blur and Pulp would later capitalize on with his band The Auteurs, went on to record such gems of human potential as concept albums about the Baader-Meinhof gang and Oliver Twist, recording under his own name and also with “supergroup” Black Box Recorder. For those who have never been exposed to the man, try any of his albums, ever: they’re all essential. While Blur were writing about middle-class boredom, Haines was writing one-man nostalgia trips through the lost, forgotten and seamy sides of English history, like a snarling pop version of Peter Ackroyd. Try it, you’ll like it. I know when I think of underwater James Bond action, I think think of The Man in Black, how about you?"
