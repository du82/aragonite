["https://dangerousminds.net/categories/category/featured"]
title = """
Topic: Featured         |     Dangerous Minds"""
description = "Dangerous Minds is a compendium of the new and strange-new ideas, new art forms, new approaches to social issues and new finds from the outer reaches of pop culture. Our editorial policy, such that it is, reflects the interests, whimsies and peculiarities of the individual writers. We are your favorite distraction."
full_description = "“I hope they don’t think we’re a rock ‘n’ roll outfit.” Via Retronaut via My Rare Guitars Conroy is one half of the exquisite pop duo, Misty Roses, whose beautiful and ethereal voice is married to the dramatic and mesmeric music of Jonny Perl. From when they first met, they understood each other. Call it synchronicity. Call it good taste. Together they are Misty Roses - the most startlingly original and brilliant group of the past 5 years. In an exclusive interview with Dangerous Minds, Misty Roses, Conroy and Perl, explain the who’s, what’s, why’s and wherefores of their music. Robert: ‘I met Jonny in late 2002, when he was still living in Brooklyn. We had a mutual friend and, in passing, I mentioned to that mutual friend that I was obsessed with Scott Walker and Julie London. To which he said “There is only ONE other person ON EARTH who is obsessed with Scott Walker AND Julie London! That’s this English guy I know, Jonny Perl!” And I found out he was a musician, and I was intrigued - so I got Jonny’s number and I called him. We met soon afterwards, and we just realized very quickly that we were on very similar frequencies. I mean, after our first rehearsal - which was three hours long, maybe - I think we came away with working demos of three or four songs that ended up on our first LP. We understood each other - musically - from the get-go.’ Born and raised in NYC, Robert had performed with a range of bands “post-punk, goth, electronic” over the years, and says he “was lucky enough to have a front row seat for a lot what happened musically over last decade or two.” The range of experience only confirmed his talents and focused his ambitions. Robert: First and foremost, I am a singer - I’ve trained with some serious vocal coaches, in my day. And I like a lot of different kinds of music. So if I dig the people and I dig how they write songs and they dig how I write songs, then I’m game.’ British born Jonny has always been musically gifted, as a child he learned to play the cello, piano, and saxophone. Before Misty Roses he had played in a variety of combos, and was playing with a surf band in NYC when the conversation about Julie London brought him to Robert."
