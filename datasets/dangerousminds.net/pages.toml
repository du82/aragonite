description = "Dangerous Minds is a compendium of the new and strange-new ideas, new art forms, new approaches to social issues and new finds from the outer reaches of pop culture. Our editorial policy, such that it is, reflects the interests, whimsies and peculiarities of the individual writers. We are your favorite distraction."
full_description = "‘Feline Philosophy,’ out November 24 in US and Canada “Epidemiology and microbiology are better guides to our future than any of our hopes or plans,” the philosopher John Gray wrote nearly 20 years ago in Straw Dogs: Thoughts on Humans and Other Animals. Anyone who entered 2020 with hopes and plans has seen these words vividly illustrated. Gray’s work makes a strong case that our species is incorrigibly irrational, and it raises questions about humanist beliefs that should be particularly important for those of us on the political left to consider. Among his books are False Dawn: The Delusions of Global Capitalism, Black Mass: Apocalyptic Religion and the Death of Utopia, The Silence of Animals: On Progress and Other Modern Myths, and Seven Types of Atheism. In his latest, Feline Philosophy, Gray pursues the deep interest in the nonhuman world that makes his critique of humanism so sharp in fang and claw. Through his reading of Montaigne, Pascal, the Stoics and Epicureans, and Spinoza, as well as literary writers from Dr. Johnson to Mary Gaitskill, Gray considers what cats have to teach us about philosophy and the good life. As I write this, the hardcover edition of the book is #15 on Amazon’s “New Releases in Philosophy” list and #1 in “New Releases in Cat Care.” John Gray answered a few of my questions about cats by email in October. John Gray (photo by Justine Stoddart) While Feline Philosophy returns to questions that will be familiar to readers of your work, it seems different in some ways from anything else you have published. How did you come to write this book? I’ve been thinking of writing a book on cats for many years. I’ve always wondered what philosophy would be like if it wasn’t so human-centred. Among all the animals that have cohabited with humans cats resemble us least, so it seemed natural to ask what a feline philosophy would be like. My book is an attempt at answering this question, and tries to imagine how a feline creature equipped with powers of abstraction would think about death, ethics, the nature of love and the meaning of life."
