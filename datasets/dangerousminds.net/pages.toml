full_description = "John Peel’s oft-repeated line about how the Fall’s music was “always different, always the same” could also be said about the output of English singer-songwriter Scott Lavene, although with just four albums under his belt, he’s got a long way to go before catching up to the Fall’s apparently infinite back catalog. And much like the late Mark E. Smith’s, Lavene’s music is so infused with his own idiosyncratic personality and lyrical preoccupations (custard, double denim, drinking, stealing roses from his racist neighbor’s garden) that no one would ever mistake one of his songs for anyone else’s. With his latest album, Disneyland in Dagenham, Lavene’s tunes are, in fact, largely the same as heard on his previous two long players (2019’s Broke and 2021’s Milk City Sweethearts) which is not, I hasten to add, an indication of actual sameness, but more an indication of consistently high quality and great songwriting. That he delivers exactly what his audience expects from a Scott Lavene album—always different, always the same and always really fucking good. According to TIDAL, I’ve listened to Disneyland in Dagenham 186 times in the past month. I’ve already listened to it from start to finish twice today and it’s not even 9 am here. I think it’s safe for the reader to assume that I really love this album. It’s world-class. All killer, no filler. An instant classic. Every song is a 10 out of 10. I like every single song on it so much that it almost seems like a greatest hits album to my ears after only four weeks. I could say the same about his other albums, too. Another observation about Lavene’s music—this occurred to me while revisiting his previous albums—is how well they are sequenced and how satisfying they are as start-to-finish listens. That and his arrangements are really sophisticated. Yes indeed, Disneyland in Dagenham is exactly what I expected from a Scott Lavene album and after a three-year wait, I was not the slightest bit disappointed. I mean, who listens to the same album 186 times in one month?"
