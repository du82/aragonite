full_description = "“A report in 2019 revealed that Queen Elizabeth II and her family cost the British people £67 million per year,” says grateful subject Andrew Liles, introducing his elongated version of the Sex Pistols’ “God Save the Queen.” The monarchy is a sweet deal for Britons, since the royals put on the occasional horse show starring Tom Cruise to thank the common people for expending their lives in toil so that their betters may luxuriate among jeweled combs and Sèvres tea services. Now, Liles has found a musical way to tell the royals “you’re welcome” for the generalized misery that supports their year-round debauch: extending Her Maj’s favorite Pistols choon from a length of about three minutes to 45, one for each year since 1977. In all likelihood, this is the very melody she will be humming this morning while she consumes a year of your wages for breakfast. Like a late-night transmission from a long-dormant UHF station, a new Cabaret Voltaire LP is beaming from Sheffield on November 20 to succor Dangerous Minds readers during these trying times. Shadow of Fear, the Cabs’ first new release since 1994’s The Conversation, is also the first we’ve heard from the band since founding member Richard H. Kirk resurrected the name for the 2014 Berlin Atonal festival and subsequent live performances in happy European cities. I caught up with RHK by phone last week. Despite a historically bad connection, I managed to learn a few things about Shadow of Fear, the new incarnation of Cabaret Voltaire, and Kirk’s welcome plans to release two more new Cabs albums and a twelve-inch single next year. An edited transcript of our conversation follows. Um, pretty boring. I mean, I was lucky, insomuch that I managed to get all of my recording finished just as the lockdown was coming in in England, so, you know, that was something. But pretty much since I finished recording the new album… I’ve got a couple of guys who I work with on the artwork, so next thing I was into that, and then afterwards it was mastering."
