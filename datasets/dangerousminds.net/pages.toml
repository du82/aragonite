["https://dangerousminds.net/categories/category/hip-hop"]
title = """
Topic: Hip-hop         |     Dangerous Minds"""
description = "Dangerous Minds is a compendium of the new and strange-new ideas, new art forms, new approaches to social issues and new finds from the outer reaches of pop culture. Our editorial policy, such that it is, reflects the interests, whimsies and peculiarities of the individual writers. We are your favorite distraction."
full_description = "A tour of every department of our media saturated society, the most explosive conspiracy ever conceived, the people shapers at every turn we see ourselves as they want us to be. The latest installment in On-U Sound’s Pay It All Back series of compilations, named after William S. Burroughs’ demand in Nova Express, gathers new music by Gary Lucas, Lee “Scratch” Perry, Roots Manuva & Doug Wimbish, Nisennenmondai, African Head Charge, Coldcut, Ghetto Priest, Sherwood & Pinch, Little Axe and Horace Andy, among others. Best of all, side three of the double LP kicks off with “Favour,” the first new solo material from Mark Stewart since 2012’s The Politics of Envy and its ghostly dub twin Exorcism of Envy. Adrian Sherwood and Mark Stewart, London, 1985 (photo by Beezer, courtesy of Mute) The video for “Favour,” directed by Stewart and Ruth Perry, sets the song’s opening lines, about emerging from a coma, deep in the sidereal void. Parched after his long sleep, the singer asks for a soda and receives dynamite—a better deal than Howlin’ Wolf got. Everything in “Favour,” from the symbols of circular time suspended onscreen to the drum the size of New Jersey reverberating on the soundtrack, suggests a vast mental space where all that is solid has melted into air. The only landmarks are memories that vanish as soon as they surface, represented here by footage from Tøni Schifer’s documentary On/Off: Mark Stewart (Pop Group to Maffia). Perry and Stewart have processed these images from the singer’s life to resemble the “Jupiter and Beyond the Infinite” sequence of 2001. Mark Stewart told DM in January that he’s got “like two or three albums worth of new stuff” in the can, so keep your eyes on the stars. If you’re looking for one of those doctors who has taken the Hippocratic oath, Kool Keith may not be your man. “Fuck it, he’s dead,” Keith’s alter ego, Dr. Octagon, pronounced on his 1996 debut, as his latest patient expired of cirrhosis of the eye and a horse wandered the halls of the hospital. Truth be told, the bedside manner of his alter alter ego, Dr. Dooom, was not very comforting either. Doing harm was pretty much his bag."
