description = "Dangerous Minds is a compendium of the new and strange-new ideas, new art forms, new approaches to social issues and new finds from the outer reaches of pop culture. Our editorial policy, such that it is, reflects the interests, whimsies and peculiarities of the individual writers. We are your favorite distraction."
full_description = "The poster that came with DEVO’s 1981 New Traditionalists album depicts the band sheltering an ethnically diverse triad of babies from the worst elements in American society: a horde of pirates, pushers, concert promoters, and Puritans looking to instrumentalize these newborns for their own unspeakable ends. Arrayed against this mob in matching JFK pompadours and Nutra work outfits, the men of DEVO face the challenge with poise and sangfroid, ready to open a cold can of whup-ass on these would-be baby-wreckers. In the background, the uncredited artist represents the USA as a rolling lawn ornamented with a few topiary trees, their branches shaped into stacked orbs that taper like the steps of the DEVO energy dome, three leafy cocktail onions of descending size impaled on toothpicks stuck in the horizon. This is the landscape on which DEVO’s Gerald V. Casale stretches his legs in the music video for his latest solo release, “The Invisible Man.” Once again, it’s “morning in America,” except for the glans-pated dweeb who dogs Jerry’s steps on the yellow brick road, subjecting him to sexual harassment, humiliation, and abuse. But as the story plays out, Jerry begins to suspect—his opponent’s neck tattoo of the D.R.I. logo notwithstanding—he’s once again doing battle with The Mark Inside, old Number One from The Prisoner. Dangerous Minds caught up with Jerry by 21st-century videophone on November 22, 2022. Before I ask you about “The Invisible Man,” it’s November 22. I’ve read a lot of DEVO interviews and I don’t know if you’ve spoken about this very much, so I thought it would be interesting to ask what you remember about the Kennedy assassination, and how you think that event affected your young minds. Yeah! Probably, that was like the opening salvo in a barrage of timed traumas that just continued the next seven years, that pretty much twisted up everything in my life and set me on a fork in the road, kind of like the proverbial red pill in The Matrix."
