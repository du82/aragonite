description = "Dangerous Minds is a compendium of the new and strange-new ideas, new art forms, new approaches to social issues and new finds from the outer reaches of pop culture. Our editorial policy, such that it is, reflects the interests, whimsies and peculiarities of the individual writers. We are your favorite distraction."
full_description = "I was on my old friend Douglas Rushkoff’s Team Human podcast. We taped this just before news of George Floyd’s murder became widely known, and talked for over four hours over the course of two long calls. The edited version is just under an hour. It’s always fun to have a conversation with him. Playing for Team Human today, counterculture icon and Editor of Dangerous Minds, Richard Metzger. Metzger envisions what life might look like on the dole and what that means for the future of the counterculture. Rushkoff and Metzger consider whether the ideals of yesterday’s counterculture were so successful that they’ve become the new over culture? And if so, who really are the new revolutionaries? They also consider the effect Covid-19 will have on a new generation’s financial prospects, and whether the underlying flaws in capitalism will finally be laid bare. In his monologue, Rushkoff looks at the way our policing problems can only be solved if we fund and utilize other kinds of civil servants instead of just ones with weapons. A portrait of our current president by Chest Strongwell. I present to you a few of the best photoshop jobs I have seen in quite a while which also just so happen to poke fun at members of our current administration and other fascistic enablers and foul miscreants. Not all photoshopped images are created equal—and these images set the bar a bit higher if you ask me. I don’t know much about Chest Strongwell outside of the fact that Strongwell is probably not really his real name (duh), he is a professional, left-leaning Internet troll, and a stay-at-home Dad claiming to have one thousand balls. I also know Chest has some sharp photoshop skills, and Republicans hate him, which I’m sure is just fine by Chest. At any rate, ole’ Chest has recently upped his online taunting directed at right-wing politicians with a few beautifully executed photoshopped images of 45’s “grab ‘em by the pussy” posse in the style of old-school KMart and JC Penny Portrait Studio photos from the 70s and 80s. Repulsive individuals such as Kellyanne Conway, Sarah Huckabee Sanders, and Vice President Mike Pence have never looked BETTER if you ask me."
