description = "Dangerous Minds is a compendium of the new and strange-new ideas, new art forms, new approaches to social issues and new finds from the outer reaches of pop culture. Our editorial policy, such that it is, reflects the interests, whimsies and peculiarities of the individual writers. We are your favorite distraction."
full_description = "A shot of David Bowie on the set of ‘Bing Crosby’s Merrie Old Christmas,’ 1977. Well, it’s about time 2020 actually gave us some good news. Though it’s not actually from Mars (BOO!), a David Bowie Monopoly-themed game does exist, and yes, you can have one. The Thin White Duke’s version of Monopoly came out earlier this year, first via an exclusive distribution with UK site Booghe. Sometime around the end of the summer, it found its way across the pond and can be easily found on all kinds of U.S. e-commerce sites. Now that you know you can actually have one, here’s the scoop on the gameplay for this Ziggy-centric edition of Monopoly. First, speaking as a collector of Monopoly board games, one of the things geeks like me look forward to are the game pieces, and wham-bam, thank you ma’am, the ones created for Bowie Monopoly do not disappoint. There is Major Tom, an astronaut helmet, a rolled-up tie for Bowie’s 1993 album Black Tie White Noise, and a replica of the hat Bowie wore as Pierrot in the video for “Ashes to Ashes” and on the cover of Scary Monsters (and Super Creeps), designed by Natasha Korniloff. Of course, there is a lightning bolt in honor of Aladdin Sane, a star to signify Bowie’s musical swan song, Black Star, and a skull, which of course, was often a Hamlet-esque Bowie stage prop. SOLD? Right? Not yet because as the saying goes “But wait! There’s MORE!” is in full effect here as Bowie Monopoly bends Monopoly’s classic gameplay just like many other versions of Monopoly have done over time. In the case of Bowie-Opoly, instead of buying property, the squares on the board represent albums from Bowie’s vast musical catalog. Once you own one of his albums, you can then build stages (instead of houses) and then stadiums (instead of hotels) to increase the “rent” paid when other players land on your square. Other play includes hitting up Bowie on tour and hiring your crew and other musicians to increase your star power and bank account. There are also Sound and Vision cards (like the Chance and Community Chest cards), which bring both good and bad fortune to players drawing from the deck."
