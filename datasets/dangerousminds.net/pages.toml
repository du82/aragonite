full_description = "National Lampoon editor Tony Hendra—probably best-known as Ian Faith, the irritable, incompetent manager of Spinal Tap—created the fucking funniest John Lennon parody of all time. Technically “Magical Misery Tour (Bootleg Record)” isn’t a parody so much as it’s a pointedly vicious satire. Hendra used direct quotes from John Lennon’s infamous 1970 Rolling Stone magazine interview with Jann Wenner (later published in book form as Lennon Remembers) for this hysterical bit. At the time of Lennon’s Rolling Stone sitting he was undergoing Primal Scream therapy with Dr. Arthur Janov and he really let it rip, shitting on his own fans, Mick Jagger, Paul and Linda McCartney and several others. All Hendra and Michael O’Donoghue did was handpick the best parts and arrange them into lyrics. Still as funny today as when it was released on the classic National Lampoon Radio Dinner LP in 1972. Hendra does an absolutely boffo Lennon impersonation here, razzing the former Beatle’s very public bitching and moaning. The music’s by Christopher Cerf, it was arranged by Christopher Guest and that’s Melissa Manchester making a cameo appearance as Yoko Ono at the very end. In his 1987 memoir Going Too Far, Hendra tells the tale of an FM radio disc jockey playing “Magical Misery Tour” for a visiting John and Yoko. Allegedly the color drained from Lennon’s face and he just got up and left. This one-off David Bowie aluminum saucepan will run you $611.78. The only person I can conceive of who would use such a thing is the Maid of Bond Street (you know the fancy ones who drive around in chauffeured cars?) and even she threw a side-eye toward this exorbitantly-priced piece of glam rock cookware. The person behind this 2020 creation is Japanese artist and graphic designer Teru Noji, a graduate of the Vantan Design Institute in Tokyo. Noji has lived and worked in Arles, France for the last dozen years, and cites the work of renowned Japanese psychedelic artist Tadanori Yokoo as his biggest influence. Exactly what inspired Noji to etch an image of Bowie (pictured with his astral sphere created by make-up artist Pierre La Roche) on the bottom of a 20 x 20-cm aluminum pan is a mystery. All I know is that it is the only one Noji ever made and you can buy it over at the online shop for the Bowie Gallery which is physically located in Totnes, Devon, UK."
