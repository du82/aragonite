description = "Dangerous Minds is a compendium of the new and strange-new ideas, new art forms, new approaches to social issues and new finds from the outer reaches of pop culture. Our editorial policy, such that it is, reflects the interests, whimsies and peculiarities of the individual writers. We are your favorite distraction."
full_description = "The new Wormwood box set, the latest installment in Cherry Red’s pREServed series of Residents reissues, runs to nine CDs etched with nearly nine hours of music. Not quite James Earl Jones Reads the Bible territory (sixteen CDs, nineteen hours), it nevertheless presents the Residents’ 1998 biblical epic at a scale appropriate to the form. Perhaps God, sufficiently enraged by humanity to send plagues, pestilences, fires, and hurricanes, has also seen fit to unleash this mighty flood of scriptural content, which makes the meager 203 minutes of the Charlton Heston Presents the Bible four-DVD set look like a positive insult to the Almighty. Wormwood: Curious Stories from the Bible, by one count the Residents’ twenty-third album, draws most of its lurid tales of rape, incest, and murder from the books of the Old Testament (though they also give us a Judas who understands betraying Jesus as his divine calling, as well as a five-and-a-half-minute instrumental based on Revelation). There are surprising takes on familiar stories—the same chapter from the Book of Daniel that inspired Johnny Cash to write “Belshazzar” moved the Residents to write “God’s Magic Finger,” and “Bathsheba Bathes” gives a decidedly less pious take on David than Leonard Cohen’s “Hallelujah”—and songs based on tales few other songwriters have dared to tell, like Jael pounding a tent peg into Sisera’s skull while he sleeps. Though Wormwood boasts more circumcisions than any rock record since Saccharine Trust’s Surviving You, Always, not to mention the winning contributions of Molly Harvey and Carla Fabrizio, it has never been my favorite Residents album. But listening to this box set has given me a new appreciation of the size and ambition of the Wormwood project, and how fruitful this period was for the group. In context with eight discs of supplementary material, the original album comes to seem like a preliminary sketch for a sprawling creation that kept the Residents busy for about four years, and included some remarkable work."
