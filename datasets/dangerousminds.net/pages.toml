description = "Dangerous Minds is a compendium of the new and strange-new ideas, new art forms, new approaches to social issues and new finds from the outer reaches of pop culture. Our editorial policy, such that it is, reflects the interests, whimsies and peculiarities of the individual writers. We are your favorite distraction."
full_description = "When the artist Roxana Halls was a child she considered becoming an actor or better still a film director when she grew up. Halls invented stories and ideas for the films she imagined she would make but soon realised the overly collaborative nature of filmmaking would only dilute her vision. This led Halls to seek other ways to capture the images which burst like fireworks in her head. She decided on painting. From early self-portraits in her bedroom-cum-studio at her parents home, first in Plaistow, London, later a small town in Devon, Halls taught herself how to paint picture by picture through hard work, discipline and an innate desire to make her ideas visible. After briefly attending Plymouth College of Art & Design, Halls returned to London where she established her first studio in an abandoned theater. It was a perfect venue for an artist whose passions were art and performance. Around this time, Halls began collecting mannequins which she incorporated into her work - sometimes explicitly recognisable, sometimes appearing as an uncanny presence. Among Halls early works is Tingle-Tangle a series of paintings exhibited at the Royal National Theater in 2009. Partially inspired by her time staying in Berlin and through the film Cabaret, Halls paintings revealed how “through the alchemy of paint, an inventive aesthetic can transform the mundane - cardboard sets and charity shop costumes - into extraordinary spectacle.” Next came the series Appetite which examined sex, identity, and female repression through the inhibiting forms of censure, surveillance, and denial in women’s relationship to food. Halls works within a feminist tradition as an artist. Her paintings engage the viewer in a dialectic. In her series Laughing While… (2013-ongoing), Halls presents women center stage laughing euphorically, joyously, while behind a wrecked car ignites, a house burns, a shop has been looted, or a plane has crashed. These are brave women. Revolutionary, rebellious women liberating themselves from the strictures enforced on them by others. Our first response may be to smile at these women in acknowledgement of their actions then perhaps wonder how much we are similarly seeking our own liberation."
