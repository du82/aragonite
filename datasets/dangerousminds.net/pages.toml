["https://dangerousminds.net/categories/category/kooks"]
title = """
Topic: Kooks         |     Dangerous Minds"""
description = "Dangerous Minds is a compendium of the new and strange-new ideas, new art forms, new approaches to social issues and new finds from the outer reaches of pop culture. Our editorial policy, such that it is, reflects the interests, whimsies and peculiarities of the individual writers. We are your favorite distraction."
full_description = "If you appreciate whimsical documentaries about eccentric or marginal types—much of Louis Theroux’s work, the Wild Man Fischer doc dErailRoaDed and Keith Allen’s deliriously insane Little Lady Fauntleroy would fall into this category—or if you are a Bob Dylan completest, then you might be interested in Tangled Up in Dylan: The Ballad of AJ Weberman directed by James Bluemel and Oliver Ralfe. AJ Weberman is infamous, if he is known at all, among Dylan aficionados for being the obsessed stalker who Bob Dylan physically assaulted in 1971 because he had been harassing his family. Weberman picked through their trash (he calls his stinky style of sleuthing the science of “Garbology”) and staged demonstrations (with the “Dylan Liberation Front,” the students of his “Dylanology” classes) outside of Dylan’s MacDougal Street brownstone, apparently with the aim of convincing Dylan to, uh, join the revolution, man… but having the result of really pissing him off. Bob Dylan vs. A.J. Weberman is the title of a much-sought after Dylan curio, a bootleg LP made from recordings of Weberman and Dylan talking on the telephone. It’s a fascinating conversation—indeed it’s what got the filmmakers interested in such an odd character in the first place—but it’s baffling why a superstar like Bob Dylan would have given such a freak his phone number in the first place (Weberman taught a class in “Dylanology” and had interviewed Dylan for the underground press before he got weird on him). Here’s what Weberman told Rolling Stone’s Marc Jacobson, years later, about the time Dylan beat him up: “I’d agreed not to hassle Dylan anymore, but I was a publicity-hungry motherfucker. . . . I went to MacDougal Street, and Dylan’s wife comes out and starts screaming about me going through the garbage. Dylan said if I ever fucked with his wife, he’d beat the shit out of me. A couple of days later, I’m on Elizabeth Street and someone jumps me, starts punching me."
