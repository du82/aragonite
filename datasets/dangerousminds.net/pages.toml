description = "Dangerous Minds is a compendium of the new and strange-new ideas, new art forms, new approaches to social issues and new finds from the outer reaches of pop culture. Our editorial policy, such that it is, reflects the interests, whimsies and peculiarities of the individual writers. We are your favorite distraction."
full_description = "An ad in the 1930 DeMoulin Bros. & Co. catalog for a product called “Drinking the Goat’s Blood.” Founded by three brothers in 1892, DeMoulin Bros. & Co. put out their final “side degree” (a term used to define other Masonic bodies or orders) catalog in 1930. The catalog offers a wide variety of sophisticated devices used to haze incoming Masonic candidates before the practice of hazing new initiations was banned some time in the 1930s. According to people familiar with Masonic history, there was a large influx of membership to the Masons following WWI. This influx drove an increase in the popularity of hazing, thus making the business of selling hazing contraptions quite profitable until the arrival of the Great Depression. Among the hazing accessories sold by DeMoulin Bros. & Co were a trick guillotine and something called “Drinking the Goat’s Blood.” According to well-informed Masons, “Drinking the Goat’s Blood” is culled from the expression “Kiss the Goat,” and the established Masonic acronym, GAOTU, or “Grand Architect of the Universe.” The gag-me gag is basically an amped-up version of the game we all played as kids, daring someone to drink an undisclosed glass full of something, all of it gross, or never live down the fact you wimped out. In the case of DeMoulin Bros. & Co.‘s “Drinking the Goat’s Blood,” they suggest the bucket be filled with all kinds of detritus like old shoes, rags, leaves, sticks, cigar butts, already-chewed tobacco, and presumably anything else that would churn the candidate’s gut. The cost of this tricked out bucket to mindfuck prospective members? A mere $12.50. But don’t trust my endorsement (because it had me at “drinking the goat’s blood”), here’s an actual testimonial about DeMoulin Bros. & Co.‘s blood bucket from Thos. Goughler, of the Amurath Siesta Princes of Bagdad “77” (a side order of the Knights of Malta) operating in Pittsburgh, Pennsylvania: “The paraphernalia that we have received has been very satisfactory in all ways and has proved very successful to this organization. We always look forward to putting it in action, and we have also increased our membership with the articles that we have received from your Company.”"
