description = "Dangerous Minds is a compendium of the new and strange-new ideas, new art forms, new approaches to social issues and new finds from the outer reaches of pop culture. Our editorial policy, such that it is, reflects the interests, whimsies and peculiarities of the individual writers. We are your favorite distraction."
full_description = "Via an intense David Bowie fandom, and also from being an avid reader of CREEM magazine, I discovered the work of the Velvet Underground at a very young age, like ten or eleven. I bought one of their albums without ever hearing it, because I just knew it was going to be good. I had no trouble figuring out what the songs were about, the subject matter of “Venus in Furs” or “Waiting for the Man” was well understood by me. (I was not in the least an innocent child.) In the mid-1970s Velvet Underground albums were not difficult to come by in my backwater West Virginia hometown—unlike Iggy, whose albums had to be mail ordered—and post VU solo efforts from Lou Reed, Nico and John Cale could easily be found in the cut-out bins of white trash department stores, usually in the form of 8-track tapes. These sold for 99 cents! One of these 99 cent 8-tracks that I picked up—which I still own—was Lou Reed’s Metal Machine Music. This inscrutable album presented me with a puzzle that I had to solve: Why do people like this? (Little did I know then that almost everyone hated it.) I played it endlessly AND ON HEADPHONES in an effort to figure out what it was. Eventually—I think—I did. The same could not be said of Nico’s The Marble Index. No matter how hard I tried—and I did try hard I promise you, I must’ve played it a hundred times at least—I simply could not wrap my brain around that album. In other words, ‘Metal Machine Music? Hey, no problem,’ but The Marble Index was just a bridge too far for my pre-teen mind. Obviously it’s not an album for everyone to begin with but especially not for a little kid who only the year before was listening to James Bond soundtracks and “Little Willy.” I finally gave up trying and never did get to the bottom of it. The Marble Index flew completely over my head. HOWEVER, when The Marble Index came out on CD in 1991, my fulsome familiarity with it some fifteen years earlier allowed me to “get it” instantly as an adult and from that moment on, I stand in utter awe at what I think, echoing both John Cale and Lester Bangs, is perhaps the greatest work of European avant garde classical music of the latter half of the 20th century. It’s a staggering, absolutely unprecedented work of genius. It’s a visionary masterpiece. It comes out of precisely nowhere. (The bowels of Hell?) It is of no musical tradition or recognizable genre. It doesn’t seem to have been influenced by anything and there’s nothing else that it can be likened to. The Marble Index is a singular artistic achievement. The best way to describe it to the reader who has not heard the album is to compare it to someone creating a ghostly new language from scratch. It really is that individual. A desolate psychic territory where no one else has ever ventured, before or since. And frankly why would anyone want to?"
year_published = 2024
