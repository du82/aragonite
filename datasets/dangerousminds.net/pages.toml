description = "Dangerous Minds is a compendium of the new and strange-new ideas, new art forms, new approaches to social issues and new finds from the outer reaches of pop culture. Our editorial policy, such that it is, reflects the interests, whimsies and peculiarities of the individual writers. We are your favorite distraction."
full_description = "Julien Nitzberg. Shit-stirrer, rebel director, artist, punk rocker and genius are some titles bestowed on this forward-thinking, back-slapping smart-ass. You might know him from his earliest documentary on Hasil Adkins—lunatic rockabilly one man band-he thought the guy in the radio made the music that way. Hasil sang about beheading his girlfriend so she “can eat no more hot dogs.” At that time he met Adkins’ neighbors the White family, who were the focus of his next documentary, the VHS cult sensation The Dancing Outlaw, about Jesco White, hillbilly clog dancer and Elvis impersonator. If you added up all the views just on YouTube of the different clips of this film alone it adds up into the millions. Fast forward to 2009, Johnny Knoxville and Nitzberg make the cult hit The Wild and Wonderful Whites of West Virginia. In between these Nitzberg did many other projects Like Mike Judge presents: Tales From the Tour Bus and the controversial The Beastly Bombing operetta, an equal opportunity love/hatefest about, well…the subtitle of the operetta is “A Terrible Tale of Terrorists Tamed by the Tangles of True Love,” if that helps. You can read about it here. All I knew about For the Love of a Glove going in was Julien’s history and sense of humor and that it was about Michael Jackson. That alone is at least a Godzilla’s worth of possible satiric destruction in the hands of Nitzberg, and that’s putting it mildly! It seems all of MJ’s bad behavior is blamed on aliens that look like glittery gloves who come to take over humanity. Oh did I mention it’s also a musical? And a puppet show? With life-sized puppets? The main one being Donny Osmond, Michael’s mortal enemy? There’s even one of Corey Feldman! And Emmanuel Lewis!! The show is a non-stop comedy clobbering of the senses, with a very small, very talented cast, great original music, cool effects, etc. Most of the actors play as many as four roles, and being that much of the cast is African American it was odd/funny and visibly uncomfortable (to some) when these actors donned white hoods for the big Ku Klux Klan musical show stopper! But if you know Julien… In these days of modern mass paranoia and casual racism, over-sensitivity and dumbing down of all things, even I had a flash of looking behind me (as I saw others do) and wondering if this was cool to like, who was getting offended, who was laughing, and right then at that moment I realized I have been way more affected by all this modern bullshit than I thought. We need people like Julien Nitzberg to remind and instill in us that it is not only okay, but quite necessary to think, laugh (at ourselves AND at others) and learn. I spoke to Julien Nitzberg and cast member Pip Lilly about all of this. Howie Pyro: Okay so why now? When did the idea come to you & what brought MJ to the top of your creative lunacy?"
year_published = 2020
