full_description = "Nick Cave’s online store Cave Things has been offering up material possessions designed by Cave since 2020. This is good news if you, like us here at Dangerous Minds, are all about all things Nick Cave. Why use boring old No. 2 pencils when you can use Nick Cave’s Sex pencils? While I’m not sure when I might actually need to use a pencil these days if I had to, Nick Cave’s Sex Pencils would be the ones I’d want in my collection. If Satan is more your speed then Cave’s red Devil pencils with printed quotes by Cave on them should be more than evil enough for you. Do you still have hair and are in need of a fashionable comb? Look no further than Cave’s specially-designed Warren Ellis’ “Pure Exploitation” comb, named for Cave’s long-time contributor, the multi-talented Warren Ellis. There are so many ultra-cool items in the Cave Things store, from small delights like Nick Cave stickers (!!!), greeting cards designed by Cave, a dog sweater modeled after Nick’s famous “Suck My Dick” t-shirt, and even wallpaper with Cave’s illustrations of The Hyatt Girls. If you’re not familiar with The Hyatt Girls, here’s Cave explaining them to one of his fans via his Red Hand Files site: “Just so that everyone knows what we are talking about, The Hyatt Girls are a group of beautiful and very naked women who live in my imagination and perform pornographic acts with each other, provided I stay at a Hyatt Hotel. For years I have drawn them, to the best of my ability, on the hotel’s notepaper whenever I have stayed at a Hyatt.” Of all the covetable things in Cave’s store, if I had the money to blow, I’d be proudly wearing one of two necklaces designed by Cave—his eerie Red Hand chain and charm (in honor of his 1994 single “Red Right Hand”), or his “Little Nick” necklace and charm, featuring a shirtless Cave flexing. So let’s take a look at some of the cooler Nick Cave things that could now be yours. You can see everything in the Cave Things shop here. Little Nick charm (comes with necklace). Extra Cave points for the red right hand detail. $122 USD. Devil pencils. More Nick Cave merch, after the jump…"
