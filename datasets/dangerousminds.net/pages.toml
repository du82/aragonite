full_description = "November 2019: Artist Sig Waller garnered considerable praise and caused some controversy when she exhibited a few of her latest paintings at the annual Saarland Association of Artists (SKB) Exhibition in Germany. Waller’s latest work was titled Hell is Empty and featured gruesome, powerful, and bitingly satiric paintings of the Trump family and their associates. The title Hell is Empty comes from William Shakespeare’s play The Tempest, when the spirit Ariel recounts the events of those shipwrecked on Prospero’s island: ...All but mariners Plunged in the foaming brine and quit the vessel, Then all afire with me. The king’s son, Ferdinand, With hair up-staring—then, like reeds, not hair— Was the first man that leaped, cried, “Hell is empty And all the devils are here.” Waller’s paintings makes reference to The Tempest together with pop culture, the occult, and movies like Rosemary’s Baby. Waller’s devils are very real and they rule our lives through politics religion and the media. These people and organisations we are supposedly meant to trust, but they are in fact devils intent on our subjugation and destruction. Their presence means there is no mercy and they intend to make devils of us all. Waller was born in Swansea, south Wales. Her father was an American historian “who dressed like a tramp,” her mother a German psychologist and housewife. The family foraged for food, brewed ale, collected driftwood and threw wild parties. At eighteen Waller moved to London where she studied Fine Art and Art History at Goldsmiths College. After graduation, she worked in animation, music promos, and film. In 1995, Waller moved to Berlin where she started painting. After the birth of her son Sky in 2002, Waller moved to Brighton, England, where she studied for another Fine Art degree at the city’s university. Since 2010, Waller’s work has been exhibited in galleries across Europe and America. She currently resides in Saarbrücken, Germany. See more of Sig Waller’s work here. See more of Sig Waller’s work, after the jump…"
