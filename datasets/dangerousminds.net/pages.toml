description = "Dangerous Minds is a compendium of the new and strange-new ideas, new art forms, new approaches to social issues and new finds from the outer reaches of pop culture. Our editorial policy, such that it is, reflects the interests, whimsies and peculiarities of the individual writers. We are your favorite distraction."
full_description = "Sad news to report, Kenneth Anger, the Magus of American cinema has died, aged 96. He’d been living for some time in an assisted living facility in Southern California. With deep sadness, Monika Sprüth and Philomene Magers, along with the entire gallery team, mourn the passing of the visionary filmmaker, artist, and author Kenneth Anger (1927–2023). Through his kaleidoscopic films, which combine sumptuous visuals, popular music soundtracks, and a focus on queer themes and narratives, Anger laid the groundwork for the avant-garde art scenes of the later twentieth century, as well as for the visual languages of contemporary queer and youth culture. His earliest works, such as the 1947 black-and-white ecstatic short, Fireworks, established Anger as an enfant terrible of the filmmaking underground. In his works of the 1950s and 1960s, he pushed the camera apparatus to its limits, incorporating double exposure, found footage, and manipulations of the celluloid itself. Anger’s personal occultism, explored most deeply in his masterpieces Inauguration of the Pleasure Dome (1954), Invocation of my Demon Brother (1969), and Lucifer Rising (1972), was a constant in his practice, with the act of transgression—from sacred to profane, from culture into counterculture, from old to new cinematic forms—becoming his defining mode of creation. Kenneth was a trailblazer. His cinematic genius and influence will live on and continue to transform all those who encounter his films, words and vision. Kenneth Anger (1927–2023) was a pioneer of avant-garde film and video art. His iconic short films are characterized by a mystical-symbolic visual language and phantasmagorical-sensual opulence that underscores the medium’s transgressive potential. Anger’s work fundamentally shaped the aesthetics of 1960s and 1970s subcultures, the visual lexicon of pop and music videos and queer iconography. The artist considered his life an artwork in its own right and frequently wove elements of myth, fact and fiction into his biography. His works can be understood as an integrative part of this life-as-artwork."
