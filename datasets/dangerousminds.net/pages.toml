description = "Dangerous Minds is a compendium of the new and strange-new ideas, new art forms, new approaches to social issues and new finds from the outer reaches of pop culture. Our editorial policy, such that it is, reflects the interests, whimsies and peculiarities of the individual writers. We are your favorite distraction."
full_description = "The poster in vinyl copies of ‘The Beggar’, out today on Young God Records (illustration by Nicole Boitos) Does time slow to a crawl during a Swans performance, or does it approach the speed of light? At the two-hour mark, have your feet really floated off the ground? If it’s a commonplace to compare a Swans show to a ritual, that’s because the shows really are like rituals in at least three respects: as reliable techniques for ecstasy, as exchanges between officiants and audience, as sacrificial acts. Like Sufi trance music, say, or Penderecki, the sound scrambles your sense of clock time, building and prolonging an almost unbearable tension, the expectation that a secret is about to be disclosed, that another dimension in time is close at hand, that the band’s labor will eventually divert the timestream’s flow from the horizontal to the vertical axis. Swans are one of the best live bands going. The Beggar is Swans’ sixteenth studio album and the sixth since Michael Gira reformed the band in 2010. It continues the remarkable streak Swans have been on since that year’s My Father Will Guide Me Up A Rope To The Sky, a series of records that not only keep faith with the band’s early work, but enrich it. I asked Gira a few questions about the new double LP by email. Michael Gira in Berlin (photo by Nicole Oike) Well, at my age it would be silly to avoid the subject, but the use of the word in some of the songs has a different implication in each instance, I would hope, none of which I’d consider to be morose. It’s just a fact of life, like having a bowel movement. The fact that it’s coming sooner rather than later at this point does lend an increased urgency, though I remain just as stunned by the raw and inexplicable fact of my existence as ever. I sometimes stare blankly at the blurring scene in front of me for minutes at a time, hoping to catch a glimpse of the fabric of the air tearing and revealing what’s hidden behind it. It feels like it’s screaming for release. I hope I’m able to witness what it is before I terminate."
