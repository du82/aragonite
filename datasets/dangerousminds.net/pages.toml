full_description = "Laibach’s latest project, a musical theater production based on texts by the German playwright Heiner Müller, has been staged in Berlin, Klagenfurt, Ljubljana, Zagreb, and Hamburg. As Laibach’s early work was not enthusiastically greeted by authorities in post-Tito Yugoslavia, so Müller, whose New York Times obituary described him as an “independent Marxist,” was banned for years from the East German stage. Indeed, the director of one of his early plays was rewarded with a trip to the coal mines. Müller’s association with Laibach dates from 1984, when the group composed music for a Slovenian production of his Quartet. Laibach and Müller met in Berlin the following year, and he suggested that they collaborate; but though he apparently did use Laibach’s music in one of his stage productions, the collaboration did not come to pass before Müller’s death in 1995. More than twenty years later, prompted by a suggestion from Anja Quickert, the head of the Internationale Heiner Müller Gesellschaft (International Heiner Müller Society), Laibach renewed their collaboration with the dramatist. As Laibach explains its approach to creating Wir sind das Volk in the press release: We followed Heiner Müller’s own strategy of cutting and rearranging the material, taking his text and putting it into another context, rebooting it with music, in order to drag the audience into it or alienate them from it. Music unlocks the emotions and is therefore a great manipulative tool and a powerful propagandistic weapon. And that’s why a combination of Heiner Müller, who saw theatre as a political institution, and Laibach, can be nothing else but a musical. Laibach kindly answered a few questions about Wir sind das Volk and related matters by email. Photo by Valter Leban Speaking in Dresden in 2014, South Korean President Park Geun-hye proclaimed: Wir sind ein Volk! What is the difference between this assertion and Laibach’s Wir sind das Volk? Laibach: Wir sind das Volk is a more general slogan and Wir sind ein Volk is a more particular one. When East Germans demanded the change of policy and reunification of the two Germanies in 1990, one of the slogans of the protesters at the time was Wir sind das Volk—“We are the people”—which meant that it is the people who will decide, not the authorities. When the wall between the two countries actually started to crumble, the slogan on both sides of the wall quickly changed to Wir sind ein Volk—“We are a people, one people, one nation, one state…” In this spirit, in 2014, South Korean President Park Geun-hye, speaking of the idea of reunification of the two Koreas, proclaimed Wir sind ein Volk!, which, of course, in the context of South and North Korea, means that they are one nation, violently divided in the Korean War and which, in a certain perspective of time, should be again reunited, just like Germany was."
