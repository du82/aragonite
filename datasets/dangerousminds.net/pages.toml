description = "Dangerous Minds is a compendium of the new and strange-new ideas, new art forms, new approaches to social issues and new finds from the outer reaches of pop culture. Our editorial policy, such that it is, reflects the interests, whimsies and peculiarities of the individual writers. We are your favorite distraction."
full_description = "A photograph by Kelly Garni that graces the cover of his new book, ‘Naked Vegas: The Highs and Lows of A Photographers Journey’ (2022). Kelly Garni has led a pretty storied life, his entire life. As a young teen, he became best friends with another teen, as kids do. Except Garni’s friend happened to be Randy Rhoads—a then budding guitar prodigy who would define the ultimate heavy metal sound with his instrument. Garni, who played bass, and Rhoads would go on to form Quiet Riot in the mid-70s along with vocalist Kevin Dubrow and drummer Drew Forsyth. The music put out by this original configuration of Quiet Riot is foundational, not just to heavy metal, but to glam and punk not just musically, but also in the way they dressed. Bow ties, polka dots, spandex and leather, with lots of the outfits coming from the ladies department. Their appearance created a stir at Garni and Rhoads’ high school, so much so they would routinely leave school quickly to avoid getting beat up by students who just didn’t get it. This changed once Quiet Riot started getting the attention they had worked so hard for and deserved. They were so popular, they were invited to play their high school prom even though Garni and Rhoads were barely attending classes anymore. Their classmates were no longer lining up to give them a beatdown, they were cheering for them in a swanky ballroom in Burbank. They would open for Van Halen who was coming up at the same time in Southern California. Garni’s time in Quiet Riot came to an abrupt end after an incident involving a gun and a drunken threat to kill Kevin Dubrow. An early photo of Quiet Riot (Kelly Garni is on the left) and a ticket stub from their gig with rivals Van Halen, April 23rd, 1977. Photo by Rob Sobol. Source. In a transitional move not unlike David Lee Roth’s in the same decade, Garni became an EMT in Los Angeles in the early 90s. As detailed in his wonderfully conversational new book Naked Vegas: The Highs and Lows of a Photographer’s Journey, he recalls the day his ambulance driver brought a 35mm camera along with her. Garni had never really used a camera and after getting some tips from his driver, he was hooked. At least until the demands of his job saving lives in LA became too time consuming, and his infatuation with photography waned. Thankfully that wouldn’t last and in the early 90s after going through what Garni describes as a very “painful divorce” he would rediscover his love of the lens. He spent time studying in the library and would chat up employees at camera stores. He built his own darkroom. Garni has never had a lack of self-confidence, and this of course worked to his advantage as he was embarking on what would become decades of photographing beautiful women merely by approaching them offering to take their photo and give it to them for free in order to hone his craft. So enthralled with the idea of photography becoming a legitimate career move, he quickly went into a bit of debt building a photography studio in his home in Las Vegas. Then Garni got the call that started it all from a modeling agency in Las Vegas that had seen some of his images. In a stroke of luck (or more likely Garni’s eye for a pretty girl), several of the girls he had recently photographed were actually working models. He would spend the next two decades taking photos of Vegas showgirls, strippers, models and sex workers, mostly in the setting of the Nevada desert. Here’s Garni on what he calls his favorite part of his life thus far:"
