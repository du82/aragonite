["https://www.danielgrosse.com/blog/jorg-britt-und-dirk-im-podcast-von-der-ami-6"]
title = "Jörg, Britt und Dirk im Podcast von der AMI (6) – Große Worte"
description = "Liebe Zielgruppe, der Sommer ist da. Nur für den Fall, dass Sie es nicht mitbekamen und sich fragen, warum so"
full_description = "Jörg, Britt und Dirk im Podcast von der AMI (6) Veröffentlicht am 7.06.2014 von Daniel Große Liebe Zielgruppe, der Sommer ist da. Nur für den Fall, dass Sie es nicht mitbekamen und sich fragen, warum Sie so kleben. Auch auf der AMI war es heute heiß, was nicht nur an den schicken Autos lag, sondern auch an diesem Sommer, der da draußen gerade ist. In der Glashalle schwitzte Moderator Jörg Draeger, zog seine Spielshow mit R.SA aber trotzdem wunderbar charmant durch. Was sonst noch los war, und warum wir uns auf morgen freuen – all das gibt’s im Podcast von der AMI mit Thomas Gigold und mir. Darauf ein Slush! Vielen Dank an unseren großartigen Sprecher Stefan Barth für das Intro und Outro. Musik: Spiedkiks – „Freak Boutique“ (Creative Commons) Dieser Beitrag wurde unter Lokales, Lustiges, Mediales, Motorisiertes, Werbliches, Wirtschaftliches gespeichert. Speichere den Permanentlink."
