["https://www.danielgrosse.com/blog/computerspielemusik-gleich-zwei-mal-in-den-klassik-charts"]
title = "Computerspielemusik gleich zwei Mal in den Klassik-Charts – Große Worte"
description = "Wenn ein Album voll mit Computerspielemusik in den Klassik-Charts Größen wie Pavarotti oder Anna Netrebko schlägt, dann muss das was"
full_description = "Computerspielemusik gleich zwei Mal in den Klassik-Charts Veröffentlicht am 19.10.201028.12.2020 von Daniel Große Wenn ein Album voll mit Computerspielemusik in den Klassik-Charts Größen wie Pavarotti oder Anna Netrebko schlägt, dann muss das was heißen. Und wenn dann ein zweites Album mit Klängen aus Videospielen in den Top 20 ist, darf man das durchaus eine Sensation nennen. Heute wurden die Oktober-Charts im Klassikbereich veröffentlicht. Neu auf Platz 20 ist ein Album, das seit einem Monat auf dem Markt ist: „Benyamin Nuss plays Uematsu“ heißt es. Zu hören ist darauf Benyamin Nuss, ein 21-jähriger Bergisch-Gladbacher, der den Soundtrack von „Final Fantasy“ (von Komponist Nobuo Uematsu) spielt wie ein junger Gott. Am Sonnabend dieser Woche ist Nuss übrigens im Leipziger Gewandhaus zu hören. Damit führt der Pianist auf gewisse Weise die erfolgreichen Spielemusikkonzerte in Leipzig fort, die 2008 für die Laserkrachshow „Video Games Live“ geopfert wurden. Diesmal zwar nur im kleinen Mendelssohn-Saal, aber immerhin. Am heutigen Abend spielt Benyamin Nuss in Berlin übrigens unter anderem vor Bundeskanzlerin Angela Merkel. Das zweite Album in den aktuellen Klassik-Charts ist „Symphonic Fantasies„, der Mitschnitt des gleichnamigen Konzerts, das im September 2009 in Köln die vornehmlich jungen Zuhörer begeisterte. Und auch Winfried Fechner, Manager des WDR Rundfunkorchesters, welches das Konzert spielte, war nicht zu bremsen: „Junge Zuhörer aus allen Teilen der Welt, die lachten, die weinten, die atemlos beobachteten, die 17 Minuten lange Partituren mit unglaublicher Konzentration erlauschten. Von solchen Zuhörern träumt ein Konzertveranstalter! Und wenn ich dann heute noch einmal die vielen Mails lese, die Fans mir schickten: Immer wieder tauchen die Worte Gänsehaut, weinen und Kindheit auf. Diese stark emotionalen Begriffe sind für mich das größte Dankeschön überhaupt und ich kann nur bekennen: Ich bin ein Fan dieser Fans, und ich bin so froh, dass wir jetzt die CD der Symphonic Fantasies fertiggestellt haben!“ Wer sich das Video hier ansieht und anhört, wird verstehen, wovon Fechner spricht. „Schuldig“ an diesem Erfolg der beiden Spielemusik-Alben ist der Dresdner Thomas Böcker. Jener, der 2003 das erste Spielemusikkonzert außerhalb Japans im Leipziger Gewandhaus organisierte und dies bis 2007 immer zur Games Convention tat. Und der seit 2008 solche Konzerte mit dem WDR Rundfunkorchester und dessen Chor umsetzt. Einer, der sein Handwerk versteht und nun unter anderem als Berater für Universal Music arbeitet. Zurecht. Dieser Beitrag wurde unter GC Games Convention, Kulturelles, Musikalisches gespeichert. Speichere den Permanentlink."
year_published = 2010
clearnet = "https://www.danielgrosse.com/blog/computerspielemusik-gleich-zwei-mal-in-den-klassik-charts"
