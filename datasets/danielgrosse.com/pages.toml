["https://www.danielgrosse.com/blog/leipzigs-vorzeigeimmobilien-und-sorgenkinder"]
title = "Leipzigs Vorzeigeimmobilien und Sorgenkinder – Große Worte"
description = "Für die aktuelle Ausgabe des TOP-Magazins habe ich als Titelthema eine längere Textstrecke über Leipzigs Immobilien in der Innenstadt und"
full_description = "Leipzigs Vorzeigeimmobilien und Sorgenkinder Veröffentlicht am 20.06.20132.07.2013 von Daniel Große Für die aktuelle Ausgabe des TOP-Magazins habe ich als Titelthema eine längere Textstrecke über Leipzigs Immobilien in der Innenstadt und den angrenzenden Stadtteilen geschrieben. Ein kurzer Auszug des achtseitigen Textes: Behutsam wachgeküsst: Alte Perlen neu aufpoliert Leipzig ist berühmt für viele Dinge, vor allem aber hört man Touristen immer wieder sagen, unsere Stadt sei ein Paradebeispiel für eine schöne Altstadt. Restaurierte Häuser, prächtige Passagen, viele Baudenkmäler. Und: Ständig verändert sich etwas. Als Leipziger wird einem das nicht immer sofort bewusst. Schaut man aber genauer hin, lässt sich feststellen: Die Touristen haben Recht. Die Hainstraße in Leipzig. Im Herzen der Stadt gelegen, verbindet sie den Markt mit dem Brühl. Neben zahlreichen Geschäften, Gastronomie und dem Passage Kino befindet sich hier ein Gebäude mit großer Vergangenheit: das »Hôtel de Pologne«. Im Stil des Neobarock wurde es 1847 bis 1848 erbaut. Durch die prunkvollen Ballsäle schritten bedeutende Persönlich- keiten wie Albert Lortzing, Clara Wieck und Leipzigs umstrittener Sohn Richard Wagner. Auch der König von Polen und Großfürst von Litauen Stanislaus Leszczynski residierte hier. Kurzum: Wer etwas auf sich hielt und in Leipzig verweilte, logierte hier. Bis 1917 wurde das Gebäude mit seinen fünf Etagen, großem Lichthof und imposanter Marmor-Freitreppe als Hotel genutzt. Später war es Messehaus und Sitz des Leipziger Messeamtes. Derzeit ist die Leipziger Stadtbau AG dabei, das »Hôtel de Pologne« zum »erlesensten Platz der Stadt« zu machen. […] Am Anfang der Hainstraße vom Brühl aus gesehen, soll ein weiterer Hingucker entstehen. Für eine der letzten Baulücken in der Leipziger Innenstadt entwickelt die Centrum GmbH aus Düsseldorf derzeit die »Hainspitze«. Die Fassadenarchitektur orientiert sich an der historischen Struktur der Altstadt. Das Gebäude, in dem 15.000 Quadratmeter Handelsfläche entstehen werden, soll sich auf diese Wei- se perfekt in die vorhandene Bausubstanz einfügen. Auf dem Filetstück der freien Flächen in der Innenstadt, nach dem sich eigentlich jeder Händler die Finger lecken sollte, herrscht derzeit allerdings gespenstige Ruhe: Statt einer Baugrube sehen Passanten nur Sand. Es fehlt an einem Ankermieter für das Kaufhaus. Seit Monaten halten sich Gerüchte, die irische Modekette Primark will hier mieten, in trockenen Tüchern ist das aber wohl noch nicht. Bis zum Sommer wolle man nun einen Generalunternehmer finden. […] Auf einen Investor, der einen rettenden Kuss haucht, wartet der Burgplatz. Was mit dem »Petersbogen« zwischen Burgplatz und Petersstraße so gut begann, kann heute nur als Fiasko bezeichnet werden. Ursprünglich sollten hier die Burgplatzpassagen entstehen. Stattdessen gähnt ein Loch hinter den Bauzäunen. Seit nunmehr 15 Jahren schon. Spricht man die Leipziger darauf an, erntet man nur Kopfschütteln und Unverständnis. Und auch die Stadtverwaltung hat schon längst keinen Mut zur Lücke mehr,kann aber nicht so, wie sie will. Einen Bebauungsplan für die letzte ungeklärte Baulücke Leipzigs lehnt der britische Eigentümer Amec ab. Ideen für den Krater hätten die Einwohner zur Genüge: Unlängst rief eine Brauerei dazu auf, Vorschläge direkt auf ein Banner am Bauzaun zu schreiben. Vom FKK-Strand über einen Kindergarten, Pool und Freilichtkino reichten die kreativen Einfälle. Immerhin bestätigte das Bauamt, dass bis zur Sommerpause der Stadtrat eine Vorlage bekäme, die erkläre, wie es mit dem City-Loch weitergehen soll. […] Fotos: TOP Magazin Leipzig/Halle Präsentiert wurde die aktuelle Ausgabe des TOP-Magazins am Montag in der Weißen Villa auf der Karl-Tauchnitz-Straße. Bei der mittlerweile 45. TOP-Lounge gaben sich wieder Promis und Persönlichkeiten der Stadt die Ehre. Ich freue mich, ab sofort zum festen Autorenstamm des TOP-Magazins gehören zu dürfen und bin gespant auf die weitere Zusammenarbeit. Dieser Beitrag wurde unter Erlebtes, Kulturelles, Lokales, Mediales, Wirtschaftliches gespeichert. Speichere den Permanentlink."
year_published = 2006
