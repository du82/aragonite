["https://www.danielgrosse.com/blog/du-bist-die-kunst"]
title = "Du bist die Kunst! – Große Worte"
description = "Kleiner Tipp für alle, die sich am Wochenende immer ratlos angucken und fragen Was machmer'n heute?! : Fahrt doch mal"
full_description = "Du bist die Kunst! Veröffentlicht am 4.07.201310.08.2020 von Daniel Große Kleiner Tipp für alle, die sich am Wochenende immer ratlos angucken und fragen „Was machmer’n heute?!“: Fahrt doch mal von Leipzig aus rund 70 Minuten nach Augustusburg. Das Städtchen im Erzgebirge liegt malerisch im Landschaftsschutzgebiet „Augustusburg-Sternmühlental“, hat eine Drahtseilbahn, die den Ortsteil Erdmannsdorf mit dem 516 Meter hohen Schellenberg verbindet. Außerdem steht hier das ehemalige Jagdschloss der sächsischen Kurfürsten. Und eben dort ist bis 10. November eine recht witzige Ausstellung zu sehen. Unter dem Namen „Du bist die Kunst“ wird hier aktiv dazu aufgerufen, Bilder mit der Kamera oder dem Smartphone zu fotografieren. Pro-Tipp: Nehmt eine richtige Kamera mit, meine Fotos sind nur Handy-Schnappschüsse. Mal einen Tiger küssen, einer Giraffe die Flasche geben, einen Mann aus dem Hintern eines Ochsen ziehen oder einer Frau beim Duschen zusehen und vieles, vieles mehr – all das geht in dieser Ausstellung. Rein virtuell natürlich. Möglich machen das die Bilder, die im 3D-Stil gemalt sind. Da kommt etwa ein Tiger aus dem Bilderrahmen, fliegen Enten durchs Zimmer oder greift eine Hand aus dem Fernseher. Neben den Kunstwerken, die aus China stammen, findet sich jeweils ein Bild, das veranschaulicht, wie man sich vor das Gemälde stellen kann, um dann von seinen Freunden oder der Familie fotografiert zu werden. Kunst zum Mitmachen und selbst erleben – wir fanden das am Wochenende richtig gut und eine schöne Möglichkeit, Kinder an Kunst und sonst eher langweilige Ausstellungen in miefigen Schlössern heranzuführen. Und wenn Ihr dann schon einmal in Augustusburg seid, schaut doch (Achtung, schamlose Werbung!) bei Zonos Kaffeehelden vorbei. Ex-Kollege Dirk Neubauer empfängt Euch in seiner Rösterei mit kleinem Café und Freisitz. Nehmt Euch Zeit für einen kräftigen Erzpresso, einen Latte Macchiato oder ein anderes spezielles Kaffeegetränk aus seiner Karte, lasst Euch von ihm etwas zur Geschichte oder den Eigenheiten der Stadt erzählen und nehmt unbedingt noch ein Päckchen seines Kaffees für zu Hause mit. Außerdem solltet Ihr Euch eine Fahrt in der Drahtseilbahn nicht entgehen lassen. Die 8 Minuten je Fahrt habt Ihr auch noch. 🙂 Auf dem Schellenberg gibt’s einen Spielplatz, eine Sommerrodelbahn, eine Minigolfanlage sowie Speis und Trank. Inklusive wunderbarem Ausblick ins Tal mit viel grün drumrum. Wie ein Kurzurlaub, und das grad mal etwas mehr als eine Stunde von Leipzig weg. Pro-Tipp 2: Wenn Ihr dieses Wochenende fahrt, erwarten Euch rund um das Schloss die Familientage aus Anlass des 5. Geburtstages des Landkreises Mittelsachsen. Am Sonnabend und Sonntag gibt’s hier Musik, Vorführungen von Vereinen und einen Markt. Dieser Beitrag wurde unter Erlebtes, Jugendliches, Kulturelles, Lokales, Mediales gespeichert. Speichere den Permanentlink."
year_published = 2013
clearnet = "https://www.danielgrosse.com/blog/du-bist-die-kunst"
