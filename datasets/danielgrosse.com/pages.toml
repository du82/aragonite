full_description = "Eigener Radiosender zum Highfield Festival Veröffentlicht am 26.04.201231.03.2018 von Daniel Große Anlässlich des Highfield Festivals, das in diesem Jahr vom 17. bis 19. August 2012 wieder am Störmthaler See in Großpösna bei Leipzig stattfindet, wird es wie in den Vorjahren ein eigenes Festivalradio geben. Wie die Sächsische Landesanstalt für privaten Rundfunk und neue Medien (SLM) mitteilt, wurde abermals eine entsprechende zeitlich befristete Hörfunkzulassung an die FKP Scorpio Konzertproduktions GmbH aus Hamburg zur Realisierung des Festivalradios „Beck’s CAMP FM“ erteilt. Auf der Frequenz 90,8 MHz will de Veranstalter mit einer Sendeleistung von 50 Watt über das Open-Air-Musik-Festival mit Musik- und Servicebeiträgen, Reportagen vor Ort sowie aktuellen Festivalinfos berichten. Dieser Beitrag wurde unter Jugendliches, Kulturelles, Lokales, Mediales, Musikalisches gespeichert. Speichere den Permanentlink. axt sagt: 26.04.2012 um 18:03 „im Umkreis von ca. 10 km“…tja, 2x zuviel Entfernung und von Webradio ist auch nichts zu lesen. Dabei fällt das so schön aus diesem unsäglichen das-Beste-aus-den-x-zigern-Einerlei heraus. >:-) Irgendwie erinnert mich sowas an die Messewelle. 😉 Daniel Große sagt: 26.04.2012 um 18:06 Ist ja auch nur für die Leute dort vor Ort gedacht und nur dafür lizenziert. Webradio wäre sicher zuviel Aufwand für den begrenzten Zeitraum. Und ja, Messewelle Leipzig früher war immer großartig. Fast schon West-Radio. 🙂 axt sagt: 26.04.2012 um 18:10 Ich seh‘ gerade in Lightning, zur selben Zeit findet auch das Leipziger Wasserfest statt. http://www.wasserfest-leipzig.de/"
