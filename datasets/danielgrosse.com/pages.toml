full_description = "89.0 RTL: Statt Nachrichten gibt es „Altrichten“ Veröffentlicht am 27.02.201427.02.2014 von Daniel Große Eigentlich sollten Nachrichten den neuesten Stand wiedergeben. Gerade morgens, wenn man wissen will, was in der Nacht so passiert ist, wie es zu aktuellen Konflikten in der Welt weitergeht. Bei den meisten Radiosendern erfährt man auf dem Weg zur Arbeit oder im Büro auch das Neueste. Bei 89.0 RTL aber wird offenbar nach der Methode… Weiterlesen Veröffentlicht unter Jugendliches, Mediales, Wirtschaftliches Chor der Russischen Polizei singt „Get Lucky“ auf Energy Moskau Veröffentlicht am 26.11.201331.03.2018 von Daniel Große Ganz großes Radio, was da dieser Tage in Moskau gesendet wurde. Der Chor der Russischen Polizei war zu Gast bei „Black2White“, der Sendung von DJ Simon „Black Pepper“ auf Energy Moskau. Live im Studio sangen die Herren Daft Punks großartiges „Get Lucky“ und bewiesen: Es geht noch großartiger. Was nicht zuletzt auch an „Black Pepper“… Weiterlesen Veröffentlicht unter Großes Netz, Jugendliches, Kulturelles, Mediales, Musikalisches MDR JUMP macht wieder Schulwege sicherer Veröffentlicht am 20.08.201331.03.2018 von Daniel Große Sie ist grün-rot und lecker. Und eine wirklich schöne Aktion von MDR JUMP in jedem Jahr: die JUMP Zuckertüte. In diesem Jahr bekommen über 74.000 Schulanfänger in Sachsen, Sachsen-Anhalt und Thüringen die süße Überraschung, die in Zusammenarbeit mit Zetti an die Kinder ausgegeben wird. Der eigentliche Ansatz der Popwelle des Mitteldeutschen Rundfunks geht aber weit… Weiterlesen Veröffentlicht unter Jugendliches, Lokales, Mediales | 3 Kommentare Zu viel Hitze in der MDR-Hörfunkzentrale? Veröffentlicht am 1.08.20132.08.2013 von Daniel Große Aus der Reihe „Wie man viel Interaktion auf seine Facebook-Seite bekommt, sich dabei aber völlig zum Ei macht“ sehen Sie heute: MDR JUMP. Gebührenfinanzierter Social-Media-Unsinn. Und die Zielgruppe macht fleißig mit. Herzlichen Glückwunsch. Hinweis: In der Überschrift hieß es irrtümlich erst „Funkhaus Halle“. Ich bitte den Fehler zu entschuldigen. Weiterlesen Veröffentlicht unter Jugendliches, Mediales | 2 Kommentare"
