["https://www.danielgrosse.com/blog/neues-cg-magazin-erschienen"]
title = "Neues CG-Magazin erschienen – Große Worte"
description = "Soeben erschien das aktuelle CG-Magazin, Unternehmensmagazin der CG Gruppe. Die Gruppe ist ein deutschlandweit tätiger Immobilien-Projektentwickler mit Stammsitz Berlin und"
full_description = "Neues CG-Magazin erschienen Veröffentlicht am 9.10.201428.12.2020 von Daniel Große Soeben erschien das aktuelle CG-Magazin, das Unternehmensmagazin der CG Gruppe. Die CG Gruppe ist ein deutschlandweit tätiger Immobilien-Projektentwickler mit Stammsitz Berlin und Niederlassung in Leipzig, sowie Standorten in Köln, Dresden und Frankfurt/Offenbach. Bereits zum dritten Mal durfte ich in diesem Jahr im Auftrag der TOP Media Leipzig das umfangreiche Projekt redaktionell umsetzen. Was mich nicht nur stolz, sondern auch dankbar macht, denn die CG Gruppe ist ein wirklich spannendes Unternehmen mit großen Projekten, die in Leipzig, Berlin und seit diesem Jahr auch darüber hinaus ganze Stadtteile neu erfinden. Jüngstes, und nur ein Beispiel von vielen: Das LKG-Carré entlang der Prager Straße und die sich anschließende Entwicklung des einstigen Technischen Rathauses. Ein Objekt, für das die Stadt Leipzig wohl auf lange Sicht kein vernünftiges Konzept gehabt hätte. Außerdem erfindet sich die CG Gruppe auch selbst neu, wie der Geschäftsfbereich Vertical Village zeigt – ein Metropolen-Lifestyle-Konzept, das möbliertes Wohnen in bislang ungenutzten ehemaligen Büro-Hochhäusern ermöglicht. Neben dem Engagement für den hochwertigen Wohnungsbau vergisst die CG Gruppe aber auch nicht die, denen es nicht so gut geht; insofern spielt auch die Charity eine Rolle im aktuellen Magazin. Vielen Dank an die Kollegen der TOP Media Leipzig und den Mitarbeitern der CG Gruppe, mit denen ich in den vergangenen Wochen für das Heft zu tun hatte, für die prima Zusammenarbeit und das Vertrauen. Dieser Beitrag wurde unter Großes Netz gespeichert. Speichere den Permanentlink."
