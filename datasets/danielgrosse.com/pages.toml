["https://www.danielgrosse.com/blog/dreamhack-leipzig-leipzig-veranstaltet-2016-wieder-ein-gaming-festival"]
title = "Dreamhack Leipzig: Leipzig veranstaltet 2016 wieder ein Gaming-Festival – Große Worte"
description = "Games Convention war früher, die gamescom interessiert uns nicht - wir blicken nach vorn. So laute in etwa das gemeinsame"
full_description = "Dreamhack Leipzig: Leipzig veranstaltet 2016 wieder ein Gaming-Festival Veröffentlicht am 2.06.201522.06.2023 von Daniel Große Games Convention war früher, die gamescom interessiert uns nicht – wir blicken nach vorn. So laute in etwa das gemeinsame Fazit und wohl auch die selbst verordnete innere Haltung aller Anwesender, heute auf der Pressekonferenz in Leipzig. Der Pressekonferenz, die seit der Live-Schaltung der Website gamingiscominghome.de so sehnsüchtig erwartet wurde. Vor allem in Kreisen der auf Gaming-News spezialisierten Blogs und Magazine wurde spekuliert, was es denn sein könnte. Irgendwas mit eSport, das war klar. Aber vielleicht noch mehr? Gar eine Neuauflage der Games Convention? Natürlich nicht. Wie ausgerechnet Spiele-Magazine darauf kommen, dass plötzlich hier wieder eine Games Convention und damit eine Konkurrenz zur offiziellen BIU-Veranstaltung aufgezogen wird, ist mir schleierhaft. Aber nun zu den wirklichen News: Ja, Leipzig feiert im nächsten Jahr ein Gaming-Festival. In der Halle 5 der Leipziger Messe soll die Dreamhack Germany stattfinden. Ein Ableger des originalen Dreamhack-Spektakels aus Schweden. Vom 22. bis 24. Januar 2016 soll die Dreamhack Leipzig stattfinden und unter anderem eine 56 Stunden nonstop LAN-Party bieten. Man möge es der Kollegin eines Radiosenders verzeihen, dass sie ernsthaft fragte, wo die Spieler dann schlafen könnten. Schlafen? Auf einer LAN-Party? Höchstens schließen sie kurz die Augen in der Relax-Zone, am Rande der Halle. Drei Säulen markieren die Dreamhack: Erstens eine LAN-Party für 1000 Teilnehmer, die ihren eigenen Rechner mitbringen können oder hier vor Ort ein Rundum-Paket bekommen. Zweitens die Dream-Expo, also einen Ausstellungsbereich für die Industrie, Merchandising-Artikel, Cosplay-Ausstattung und mehr. Das dürfte spannend werden, welche Firmen da wieder nach Leipzig zurück finden. Und drittens: der eSport an sich. Die Schweden organisieren ein hochklassiges Turnier. Welche Spiele gezockt werden, dazu ließen sich die Organisatoren noch nicht aus. Apropos Organisatoren: Veranstalter ist die Leipziger Messe, Lizenzgeber ist DreamHack AB, Schweden und technischer Partner ist Schenker Technologies Leipzig, ein Notebook-Hersteller, der mit seiner Marke XMG bereits auf der letzten GC zugegen war und sich seit 2009 im eSport engagiert. Ich finde die Idee sehr gut und freue mich auf das Event. Es passt wunderbar zur allgemeinen Aufbruchstimmung, die gerade in Leipzig herrscht. Nach Hypezig kommt jetzt Gamezig! Die komplette Pressemitteilung gibts auf der Website der DreamHack Leipzig. Und dieses schicke Video muss ich Euch auch noch zeigen: Dieser Beitrag wurde unter Großes Netz gespeichert. Speichere den Permanentlink."
year_published = 2015
