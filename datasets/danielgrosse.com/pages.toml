full_description = "Warnung vor diekaffeefee.de Veröffentlicht am 25.04.201710.08.2020 von Daniel Große Auf der Suche nach einer Kaffeemaschine oder Küchenmaschine im Internet? Dann solltet Ihr unbedingt die Seite diekaffeefee.de meiden. Diese Seite verwendet ein gefälschtes Impressum der Kaffeerösterei Zonos Kaffeehelden aus Augustusburg. Deren Inhaber Dirk Neubauer, der auch Augustusburgs Bürgermeister ist, handelt aber lediglich mit Kaffeebohnen, nicht mit Maschinen. Den ganzen Fall und die offenbar unglaublich träge Ermittlungsarbeit der Polizei schildert die Freie Presse. Das Ganze erinnert ein wenig an die hier häufig thematisierten Branchenbuch-Betrüger, die auch teils jahrelang unbehelligt ihrem Treiben nachgehen konnten. Unfassbar, dass bei einer De-Domain und einem deutschen Konto nicht sofort gehandelt werden kann. Das ist über den Domain-Inhaber bekannt: Name: Kenny Roger Organisation: N A Adresse: Hauptstr. 100 PLZ: 11055 Ort: Berlin Land: DE Beim Name und der Adresse dürfte es sich wie üblich um einen Fake handeln. Registriert wurde die Domain offenbar über den ukrainischen Anbieter Blazingfast. Dieser Beitrag wurde unter Großes Netz gespeichert. Speichere den Permanentlink."
