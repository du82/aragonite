full_description = "Elektrisierend: Der Podcast von der AMI (4) Veröffentlicht am 5.06.20145.06.2014 von Daniel Große Es tut uns sehr leid, wir wissen auch nicht, wie das passieren konnte – aber im heutigen Podcast von der AMI mit Thomas und mir gibt es tatsächlich Informationen. Und zwar elektrisierende Infos zum rein elektrischen e-up! von Volkswagen. Der Kleine macht richtig Spaß, schafft den Sprint von 0 auf 60 in knapp 4 Sekunden und ist dabei unfassbar leise. Mehr über den Batterie-Stadtflitzer gibt’s morgen auf der Website der AMI. So, und jetzt viel Spaß hierbei. Der werte Kollege Gigold meint übrigens, er sei heute recht leise. Er hat Recht. Wird morgen wieder besser. Vielen Dank an unseren großartigen Sprecher Stefan Barth für das Intro und Outro. Musik: Spiedkiks – „Freak Boutique“ (Creative Commons) Dieser Beitrag wurde unter Lokales, Lustiges, Mediales, Werbliches, Wirtschaftliches gespeichert und mit den Schlagworten ami-podcast markiert. Speichere den Permanentlink."
