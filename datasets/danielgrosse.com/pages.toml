full_description = "Endlich: Der Podcast von der AMI (1) Veröffentlicht am 2.06.20144.10.2021 von Daniel Große Ja, Ihr habt ihn schon vermisst. Unseren Podcast von der AMI. Seit vergangenen Freitag läuft (für Thomas und mich) Deutschlands Automesse #hautnah. Wir schreiben exklusiv für die Website der AMI, pflegen das Community Management auf Facebook und Twitter – und haben dabei wohl derzeit den besten Job, den man in Leipzig haben kann. Neue Autos,… Weiterlesen Veröffentlicht unter Großes Netz, Lokales, Lustiges, Mediales, Werbliches, Wirtschaftliches | Schlagworte ami-podcast Ein Delfin als Aktienhändler Veröffentlicht am 26.05.201431.03.2018 von Daniel Große Eigentlich ist die Rubrik „Super Symbolbilder“ ja dem Kollegen Niggemeier vorbehalten – das hier bei ntv.de fand ich aber gerade so aberwitzig und grotesk, dass ich es unbedingt zeigen muss. Unter dem Titel Kaufrausch nach Wahlen – Dax springt auf Rekordhoch zeigen die Nachrichten-TV-Onliner einen Delfin. Untertitelt ist der Blödsinn mit „Freudensprünge an den Aktienmärkten:… Weiterlesen Veröffentlicht unter Großes Netz, Lustiges, Mediales, Tierisches Happy – MOTORRÄDER DORTMUND Edition Veröffentlicht am 9.03.20143.08.2022 von Daniel Große Im Auftrag der TWIN Zweiradmessen GmbH blogge ich derzeit für die Messe MOTORRÄDER DORTMUND. Dem momentanen Trend der „Happy“-Videos folgend habe ich dieses kleine Stück hier produziert. Hoffe, es gefällt. 🙂 Weiterlesen Veröffentlicht unter Lustiges, Musikalisches, Wirtschaftliches Die ICHICHICH-Show – mit mir Veröffentlicht am 19.12.201331.03.2018 von Daniel Große Die ICHICHICH-Show ist eine leicht verrückte, aber sehr sympathische und zu Unrecht viel zu unbekannte Radioshow. Jeden Freitag um 20 Uhr läuft sie auf den Bürgerradios Funkwerk Erfurt 96,2 und Weimar 106,6. Produziert wird sie in einem Studio in Leipzig Lindenau, moderiert von den leicht verrückten, aber sehr sympathischen Journalistenkollegen Louisa Noack und Matthias Weidner…. Weiterlesen Veröffentlicht unter