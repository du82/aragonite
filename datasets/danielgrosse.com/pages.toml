full_description = "Flotter Franzose beim Podcast von der AMI (3) Veröffentlicht am 4.06.20145.06.2014 von Daniel Große Ich hatte heute einen flotten Franzosen. Nein, das muss Euch und Ihnen nicht leid tun – im Gegenteil, es war sehr angenehm. Aber bevor das hier abdriftet: Es handelte sich um den Citroen DS5. Ein Auto, das zwar schon vor zwei Jahren auf den Markt kam, aber noch immer faszinierend futuristisch ist. Einen kleinen Text… Weiterlesen Veröffentlicht unter Lokales, Lustiges, Mediales, Motorisiertes, Werbliches, Wirtschaftliches | Schlagworte ami-podcast Heute mit Cactus: Der Podcast von der AMI (2) Veröffentlicht am 3.06.20145.06.2014 von Daniel Große Nur noch 1,5 Wochen bis zur WM! Fußball! Fußball-WM! Brasilien! So – nachdem ich nun Eure volle Aufmerksamkeit habe (Fußball soll ja DAS ganz große Ding sein), gehen wir nahtlos zu etwas über, das nicht weniger anstrengend ist. Ja, ich spreche vom Podcast von der AMI, den Thomas und ich nicht unterlassen können, jeden Abend… Weiterlesen Veröffentlicht unter Lustiges, Mediales, Motorisiertes, Werbliches, Wirtschaftliches | Schlagworte ami-podcast Endlich: Der Podcast von der AMI (1) Veröffentlicht am 2.06.20144.10.2021 von Daniel Große Ja, Ihr habt ihn schon vermisst. Unseren Podcast von der AMI. Seit vergangenen Freitag läuft (für Thomas und mich) Deutschlands Automesse #hautnah. Wir schreiben exklusiv für die Website der AMI, pflegen das Community Management auf Facebook und Twitter – und haben dabei wohl derzeit den besten Job, den man in Leipzig haben kann. Neue Autos,… Weiterlesen Veröffentlicht unter Großes Netz, Lokales, Lustiges, Mediales, Werbliches, Wirtschaftliches | Schlagworte ami-podcast Gruppenbetriebsrat der DD+V-Gruppe drückt Solidarität mit LVZ- und DNN-Angestellten aus Veröffentlicht am 24.05.201424.05.2014 von Daniel Große Die Meldungen über die Pläne zum massiven Personalabbau bei der Leipziger Volkszeitung den Dresdner Neuesten Nachrichten haben auch bei der DD+V-Mediengruppe für Unruhe und Ärger gesorgt. Der Gruppenbetriebsrat des DD+V (u.a. Sächsische Zeitung und Morgenpost Sachsen) hat den Kollegen der LVZ und DNN daher ein Solidaritätsschreiben zukommen lassen. Eine große Geste, wie ich finde. Hier… Weiterlesen Veröffentlicht unter Lokales, Mediales, Wirtschaftliches"
