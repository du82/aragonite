full_description = "Die ICHICHICH-Show – mit mir Veröffentlicht am 19.12.201331.03.2018 von Daniel Große Die ICHICHICH-Show ist eine leicht verrückte, aber sehr sympathische und zu Unrecht viel zu unbekannte Radioshow. Jeden Freitag um 20 Uhr läuft sie auf den Bürgerradios Funkwerk Erfurt 96,2 und Weimar 106,6. Produziert wird sie in einem Studio in Leipzig Lindenau, moderiert von den leicht verrückten, aber sehr sympathischen Journalistenkollegen Louisa Noack und Matthias Weidner. Louisa und Matze löchern ihre Studiogäste auf ihre charmante (Louisa) und rotzfreche (Matze) Art mit Fragen, meist wird viel gelacht und einfach „laufen gelassen“. Am 15. November durfte ich zu Gast sein. Mittlerweile ist der Mitschnitt und bald auch ein Video von der Sendung fertig. Wer also die Antworten auf Fragen hören will, die er mir nie gestellt hätte… bittesehr! 🙂 http://www.danielgrosse.com/blog/uploads/iiis_15112013_dg.mp3 Dieser Beitrag wurde unter Erlebtes, Kulturelles, Lustiges, Mediales, Persönliches gespeichert. Speichere den Permanentlink."
