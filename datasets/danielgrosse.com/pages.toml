full_description = "Oskar. Veröffentlicht am 8.07.20148.07.2014 von Daniel Große Die Zeit rast – schon ewig nichts mehr gebloggt. Dabei passiert derzeit so viel. Wer mir auf Facebook folgt oder mit mir befreundet ist, weiß es bereits: Seit 28. Juni bin ich zum zweiten Mal Vater geworden. Unser Oskar bereitet uns und seiner großen Schwester viel Freude und bringt den Tages- und Nachtablauf ganz schön durcheinander. Wunderbar! Kurz die technischen Daten: 28.06.2014, 13.24 Uhr, 48 Zentimeter, 3275 Gramm. Weitere Fotos wird es nicht geben. Wir gestehen dem kleinen Mann bereits jetzt sein Persönlichkeitsrecht zu. Er wird später selbst entscheiden dürfen und können, wo Fotos von ihm zu finden sein werden. Dieser Beitrag wurde unter Persönliches gespeichert. Speichere den Permanentlink."
