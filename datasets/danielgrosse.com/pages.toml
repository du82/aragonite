["https://www.danielgrosse.com/blog/dhl-paketkasten-der-erste-test-ging-grundlich-schief"]
title = "DHL Paketkasten: Der erste Test ging gründlich schief (Update) – Große Worte"
description = "Ich habe es fast geahnt, aber trotzdem an die Leistungsfähigkeit von DHL geglaubt. Wenn einen Paketkasten anbieten, wird Zustellung in"
full_description = "DHL Paketkasten: Der erste Test ging gründlich schief (Update) Veröffentlicht am 25.09.20139.10.2013 von Daniel Große Ich habe es fast geahnt, aber trotzdem an die Leistungsfähigkeit von DHL geglaubt. Wenn die einen Paketkasten anbieten, wird die Zustellung in denselben doch klappen. Nein, klappte sie heute leider nicht. Als ersten Test des Paketkastens haben wir ein bisschen Bastelbedarf bei Amazon bestellt. Wie von DHL empfohlen, habe ich vorher meine Postnummer in die Versandadresse eingefügt und bei paket.de den Wunsch-Zustellort „DHL Paketkasten“ angegeben. Eine Mail mit dem voraussichtlichen Zustelldatum erreichte mich auch. Was mich heute nicht erreichte, war das Paket. Dabei war ich zu Hause, habe das DHL-Auto vor dem Haus stehen sehen. Als es wieder davon fuhr, freute ich mich: Der Fahrer hat nicht geklingelt, also wird wohl alles geklappt haben und das Paket im Kasten warten. Denkste. Als ich den Kasten öffnete, gähnte mich eine Leere an. Also auf paket.de eingeloggt, um zu sehen, ob dort was steht. „Es erfolgt ein 2. Zustellversuch“ Bitte? Warum das denn? Der Mitarbeiter an der Hotline, die eigens für Nutzer des DHL Paketkastens eingerichtet wurde, hatte dafür auch keine Erklärung. Eine Beschwerde will er aber weitergeben. Vermutet hat er nur, dass heute vielleicht ein Vertretungsfahrer unterwegs war, der den Transponder zum Öffnen des Paketkastens nicht dabei hatte. Warum der Fahrer dann nicht wie gewohnt klingelte, wusste der Mitarbeiter auch nicht. Sauber. Bin auf morgen gespannt. Update, 26.09.: Unser regulärer Zusteller war vorhin hier, hatte drei Transponder mit, von denen keiner funktionierte. Das Anlernen des Transponders, das eigentlich innerhalb von drei Tagen nach Hängen des Kastens erfolgen sollte, ist offenbar doch noch nicht erfolgt. Gestern war ein Vertreter des Zustellers hier. Warum der nicht wenigstens das Paket auf die übliche Weise zustellte, bleibt weiter unklar… Update 2: Das Telefon-Team vom DHL Paketkasten hat sich noch mal gemeldet – es kam beim Anlernen des Transponders wohl zu Terminschwierigkeiten. Heute soll das aber noch über die Bühne gehen und künftige Pakete dann also sicher zugestellt werden. Es bleibt weiter spannend… 🙂 Dieser Beitrag wurde unter Getestetes, Persönliches gespeichert und mit den Schlagworten paketkasten markiert. Speichere den Permanentlink."
year_published = 2013
clearnet = "https://www.danielgrosse.com/blog/dhl-paketkasten-der-erste-test-ging-grundlich-schief"
