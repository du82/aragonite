["https://www.danielgrosse.com/blog/presserat-missbilligt-leipziger-volkszeitung"]
title = "Presserat missbilligt Leipziger Volkszeitung – Große Worte"
description = "Auch eine humorvolle und saloppe Formulierung rechtfertigt keine werbliche Darstellung von Personen Produkten. So könnte man die Entscheidung des Presserates"
full_description = "Presserat missbilligt Leipziger Volkszeitung Veröffentlicht am 21.12.201421.12.2014 von Daniel Große Auch eine humorvolle und saloppe Formulierung rechtfertigt keine werbliche Darstellung von Personen und Produkten. So könnte man die Entscheidung des Presserates zusammenfassen, die mir nun zuging. Am 9. Juli veröffentlichte ich hier einen Artikel, in dem ich mich über die „Wunderbare Werbe-Welt des LVZ Boulevard“ ausließ. In eben jeder Boulevard-Rubrik ließ sich „Chefreporter“ Guido Schäfer zu einer werblichen Darstellung eines Physiotherapeuten und seiner Salbe hinreißen. Da ich hier den Pressekodex eindeutig verletzt sah, beschwerte ich mich beim Deutschen Presserat. Dieser sah meine Beschwerde nun als begründet und sprach eine Missbilligung gemäß Ziffer 7 des Pressekodex (Trennung von Werbung und Redaktion / Schleichwerbung) aus. Missbilligungen des Presserats sind für die Verlage folgenlos. Sie werden nicht von ihm veröffentlicht und müssen auch nicht von der betroffenen Zeitung veröffentlicht werden. Darum erledige ich das in diesem Fall. Das Schreiben des Presserats im Wortlaut: A. Zusammenfassung des Sachverhalts Die LEIPZIGER VOLSKZEITUNG veröffentlicht in der Rubrik Boulevard unter der Überschrift „Neuer Hingucker, neues Haus, neuer Job, neue Salbe“ eine Notiz über einen Leipziger Physiotherapeuten und eine von ihm entwickelte Sportsalbe. Die Salbe wird anhand von Aussagen zweier Patienten positiv beschrieben. Weiterhin wird ein Produktfoto veröffentlicht mit der redaktionellen Aussage „Bringt Lahme zum Gehen und zieht dahin, wo es weh tut: Sekoras brandneue Sportsalbe“. Der Beschwerdeführer sieht in der Veröffentlichung Schleichwerbung für den Physiotherapeuten und die Salbe. Der Chefredakteur teilt in seiner Stellungnahme mit, dass die beanstandete Berichterstattung in einer Rubrik erschienen sei, für die der Autor durch seine humorvollen, saloppen und manchmal auch etwas respektlosen Formulierungen bekannt sei. Er schreibe für die Zeitung sowohl im Sportteil als auch für die Rubrik „Boulevard“. Letztere befasse sich mit dem Leipziger Promi-Leben, Lokaleröffnungen und allem, was sich sonst für den Boulevard eigne. Dies werde meist mit einem Augenzwinkern begleitet. Schon die Überschrift „Neuer Hingucker, neues Haus, neuer Job, neue Salbe“ zeige, dass hier Dinge zusammengebracht würden, die eigentlich nichts miteinander zu tun hätten. Dass die Berichterstattung nicht „bierernst“ zu nehmen sei, erkenne man auch in dem einleitenden Artikel über die Eröffnung eines Bürokomplexes, in dem u.a. davon die Rede sei, dass „unser aller Oberbürgermeister immer und überall gefragt sei“. Genau so sei auch die Veröffentlichung über die Sportsalbe des lokalprominenten Physiotherapeuten zu sehen, der für den einzigen in der Stadt ansässigen Profifußball-Club RB Leipzig arbeite. Dass er und seine Salbe Aufnahme in die Rubrik gefunden hätten, sei auch der regionalen und bundesweiten medialen Aufmerksamkeit geschuldet, die der Aufstieg des von dem Red Bull-Eigner Dietrich Mateschitz unterstützten Vereins in die zweite Bundesliga gefunden habe. Dass die Berichterstattung nicht ganz ernst gemeint sei, zeigten auch Formulierungen wie „im Hauptfach ist er der Medizinmann der Roten Bullen“ und die Beschreibung einer bestimmten Schmerztherapie des Physiotherapeuten als sein „vorletzter Schrei“. Als sein „letzter Schrei“ werde dann die von ihm entwickelte Wundersalbe dargestellt. Die in diesem Zusammenhang genannte Domain sei im Übrigen nicht abrufbar, so der Chefredakteur. Die Berichterstattung sei insgesamt belustigend und nicht schleichwerbend gemeint. Das zeigten auch Formulierungen wie „Stöffchen“ und „edle Schenkel“ oder auch das Zitat „da geht man ab wie ein Zäpfchen“. Absurd und nicht ernst gemeint sei selbstverständlich auch die Bildunterzeile „bringt Lahme zum Gehen“, die außerhalb jeder Realität liege. B. Erwägungen des Beschwerdeausschusses Der Beschwerdeausschuss erkennt in der Veröffentlichung eine Verletzung des in Ziffer 7 Pressekodex festgeschriebenen Grundsatzes der klaren Trennung von Redaktion und Werbung. Mit der Darstellung wird die Grenze zwischen Berichterstattung von öffentlichem Interesse und Schleichwerbung nach Richtlinie 7.2 Pressekodex überschritten. Zwar ist es grundsätzlich möglich, darüber zu berichten, dass ein im Verbreitungsgebiet bekannter Physiotherapeut eine eigene Sportsalbe entwickelt hat. Dies kann im lokalen Bereich für die Leser durchaus von Interesse sein. Im konkreten Fall wird aber die Grenze zur Schleichwerbung durch die Veröffentlichung des Bildes der Salbe sowie werbliche Formulierungen wie „Bringt Lahme zum Gehen und zielt dahin, wo es weh tut“ oder auch „seine eigene Wundersalbe“ bzw. das Zitat „Da geht man ab wie ein Zäpfchen“ eindeutig überschritten. Solche Details bzw. Formulierungen sind nicht mehr durch ein öffentliches Interesse an einer Berichterstattung gedeckt und erzeugen einen eindeutigen Werbeeffekt für die Salbe. C. Ergebnis Der Beschwerdeausschuss hält den Verstoß gegen die Ziffer 7 des Pressekodex für so schwerwiegend, dass er gemäß § 12 Beschwerdeordnung die Maßnahme der Missbilligung wählt. Nach § 15 Beschwerdeordnung besteht zwar keine Pflicht, Missbilligungen in den betroffenen Publikationsorganen abzudrucken. Als Ausdruck fairer Berichterstattung empfiehlt der Beschwerdeausschuss jedoch eine solche redaktionelle Entscheidung. Die Entscheidung über die Begründung der Beschwerde ergeht mit sieben Ja-Stimmen bei einer Enthaltung. Die Entscheidung über die Wahl der Maßnahme ergeht mit sechs Ja-Stimmen bei einer Nein-Stimme und einer Enthaltung. Dieser Beitrag wurde unter Lokales, Mediales gespeichert. Speichere den Permanentlink."
year_published = 2014
