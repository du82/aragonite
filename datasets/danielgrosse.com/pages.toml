["https://www.danielgrosse.com/blog/chor-der-russischen-polizei-singt-get-lucky-auf-energy-moskau"]
title = "Chor der Russischen Polizei singt „Get Lucky“ auf Energy Moskau – Große Worte"
description = "Ganz großes Radio, was da dieser Tage in Moskau gesendet wurde. Der Chor der Russischen Polizei war zu Gast bei"
full_description = "Chor der Russischen Polizei singt „Get Lucky“ auf Energy Moskau Veröffentlicht am 26.11.201331.03.2018 von Daniel Große Ganz großes Radio, was da dieser Tage in Moskau gesendet wurde. Der Chor der Russischen Polizei war zu Gast bei „Black2White“, der Sendung von DJ Simon „Black Pepper“ auf Energy Moskau. Live im Studio sangen die Herren Daft Punks großartiges „Get Lucky“ und bewiesen: Es geht noch großartiger. Was nicht zuletzt auch an „Black Pepper“ lag: Seine Rap-Einlagen begeisterten den künstlerischen Leiter Viktor Eliseev so sehr, dass er ihm spontan eine Mitgliedschaft im Chor anbot. Simon lehnte jedoch dankend ab, willigte aber wenigstens ein, auf einem Foto mit dem Chor zu posieren. „Das darf meine Mutter aber nicht sehen, die würde sich sonst zu viele Sorgen machen, wenn sie mich sieht – umstellt von der russischen Polizei.“ Das Video dreht grad seine Runden im Web und wird Energy Moskau wohl einigen Ruhm einbringen. Zurecht. Dieser Beitrag wurde unter Großes Netz, Jugendliches, Kulturelles, Mediales, Musikalisches gespeichert. Speichere den Permanentlink."
