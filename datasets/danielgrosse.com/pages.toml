t Schätze seiner Sammlung von Computermagazinen. Was viele nicht nachvollziehen können, der Journalist und Autor sammelt leidenschaftlich gern „alte… Weiterlesen Veröffentlicht unter GC Games Convention, Kulturelles, Lokales, Mediales, Wirtschaftliches"
