full_description = "Was? Was ist denn das nun wieder? Dies ist mein Referenzen-Blog und damit wohl das erste Referenzen-Blog überhaupt. Hier trage ich aktuelle Referenzen (wie passend!) meiner Arbeit als freier Journalist ein. Außerdem blogge ich aktuelle Ereignisse, auf die ich zwischen Textabgabe und Fototermin stoße. Diese sind in der Kategorie „Alltägliches“ zu finden. Ideen, Anregungen, Kommentare, Geschenke, Schokolade nehme ich aber jederzeit gern entgegen. Meine Kontaktdaten stehen sinnigerweise unter „Kontakt.“ Ach – und eines noch: Alle Texte und Fotos unterliegen dem Urheberrecht – sofern nicht anders angegeben – dem Meinigen. Wer klaut, bekommt eine Rechnung. Wer in den Kommentaren spammt, bekommt eine saftige Rechnung. Wer mich – aus welchem Grund auch immer – abmahnt, bekommt wunderbare Publicity. Verlinkungen sind gestattet und werden mit Wohlwollen und einem Lächeln honoriert. Und immer dran denken: ich bin auch nur ein Mensch. Ein netter zumeist. Mit mir kann man reden. 🙂"
year_published = 2017
