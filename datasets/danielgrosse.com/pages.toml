["https://www.danielgrosse.com/blog/fruhlingsleichter-melodic-pop"]
title = "Frühlingsleichter Melodic-Pop – Große Worte"
description = "Lange nichts mehr über Musik geschrieben. Was vielleicht daran liegt, dass ich niemandem meinen Musikgeschmack aufdrängen möchte. Der ist teilweise"
full_description = "Frühlingsleichter Melodic-Pop Veröffentlicht am 7.03.20147.03.2014 von Daniel Große Lange nichts mehr über Musik geschrieben. Was vielleicht daran liegt, dass ich niemandem meinen Musikgeschmack aufdrängen möchte. Der ist teilweise sehr strange, reicht vom 90er Trash-Dance über aktuelles Chart-Gesäusel bis hin zu Filmmusik. Über eine Künstlerin muss ich aber mal ein paar Worte verlieren. Die Dame heißt Anna F. Und hat mich sofort gefangen. Aufgewachsen in der österreichischen Steiermark lernte die heutige 28-Jährige mit 11 Jahren Gitarre spielen. Erste Eigenkompositionen entstehen noch in ihrem Kinderzimmer, aufgenommen mit einem Kassettenrecorder. Beim Abschlusskonzert ihrer Schule trat sie auf und fing erneut Feuer. Feuer an der Musik, dem Selbstkomponieren und Singen. Kurze Zeit später zieht sie zum Studieren nach Graz und lernt dort Alex Deutsch kennen. Der ist Musiker, Produzent und Manager. Sie arbeitet mit ihm zusammen – und veröffentlicht direkt den Song „Time Stands Still“auf MySpace. Ein Unternehmen entdeckt den Song, lizenziert ihn für sich. Dann landet der Song im Radio und in den Charts. http://www.youtube.com/watch?v=SC6XoCaqSiM&feature=share&list=RDSC6XoCaqSiM In Innsbruck eröffnet Anna F. kurze Zeit später ein Konzert von Lenny Kravitz. Der Meister ist so begeistert von ihr, dass er sie für den Rest seiner Europa-Tournee als Support-Act mitnimmt. Vor bis zu 15.000 Menschen spielt die hübsche Anna nun plötzlich – und fällt abermals eine Entscheidung: „Meine Zukunft liegt in der Musik. In meiner Musik.“ Ende Februar erschien ihr Debütalbum „King In The Mirror“. Ein Album voll mit wunderbarem Soul-Pop. Verpackt in frühlingsleichtem, melodischen Gewand. Wunderbar zum Mitsingen, Mitsummen oder einfach nur Fallenlassen. Gefällt mir äußerst gut. Am 11. März ist Anna F. Support für James Blunt in der Arena Leipzig. Gelegenheit, die Musik live zu genießen. mit Material von Polydor/Island (Universal Music) Dieser Beitrag wurde unter Mediales, Musikalisches, Persönliches gespeichert. Speichere den Permanentlink."
year_published = 2014
