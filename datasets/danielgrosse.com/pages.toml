["http://www.danielgrosse.com/blog/gamescom-logo-und-website-veroeffentlicht"]
title = "gamescom: Logo und Website veröffentlicht – Große Worte"
description = "Pünktlich vor dem Start der Games Convention in Leipzig hat die Kölnmesse heute Website zur Gamescom überarbeitet, nun erste Inhalte"
full_description = "gamescom: Logo und Website veröffentlicht Veröffentlicht am 19.08.200831.03.2018 von Daniel Große Pünktlich vor dem Start der Games Convention in Leipzig hat die Kölnmesse heute die Website zur Gamescom überarbeitet, die nun erste Inhalte bietet. Wie bekannt ist, will der Branchenverband BIU im September 2009 eine neue Messe in der Domstadt etablieren und die Games Convention in Leipzig nicht mehr unterstützen. Das Logo reißt mich persönlich nicht vom Hocker. Die Kleinschreibung ist aber schon mal etwas, das sich von Leipzig unterscheidet. Und die Kombination lila-babyblau gibt’s wohl auch nur in Köln. Informationen gibt es auf der Website nur für Aussteller, Fachbesucher und Presse. Dafür aber ein Herz zerreißendes Video über den Standort Köln. Für die „Privatbesucher“, wie das Fußvolk Publikum dort genannt wird, soll es eine eigene Website geben. „Celebrate the Games“ heißt es auf dieser. Hier kann man vorerst nur seine Mailadresse hinterlassen. Weitere Informationen finden sich noch nicht. Disclaimer: Ich bin derzeitig freier Mitarbeiter der Leipziger Messe. Logo: koelnmesse Dieser Beitrag wurde unter Mediales, Wirtschaftliches gespeichert. Speichere den Permanentlink. sue sagt: 25.08.2008 um 17:22 komisch, irgendwie liest sich der ganze artikel etwas… parteiisch, lokalpatriotisch angehaucht oder wie auch immer. aber das kann täuschen 😉 Daniel Große sagt: 25.08.2008 um 19:05 Boah, wie Du das rausgefunden hast…. 🙄 Ist ja auch kein Artikel, sondern ein Blogeintrag. ingiltere ogrenci vizesi sagt: 3.11.2008 um 18:54 Warum diese Web site haben nicht andere Sprachunterstützung? axt sagt: 3.11.2008 um 22:18 Die Türken haben zwar 2x vor Wien gestanden (Betonung auf vor), aber, um’s mit den Worten Deines Landsmannes zu sagen, „Ey Du, Du kommst hier net rein!“."
year_published = 2008
clearnet = "http://www.danielgrosse.com/blog/gamescom-logo-und-website-veroeffentlicht"
