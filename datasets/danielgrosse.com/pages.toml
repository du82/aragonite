full_description = "18 Jahre. 18! Jahre! Veröffentlicht am 17.06.20132.07.2013 von Daniel Große Ich habe gerade etwas festgestellt. Etwas, das wohl jeder Mann irgendwann einmal feststellt. Etwas, das Freunde, Verwandte, vielleicht die eigene Frau, sowieso schon längst festgestellt haben: Ich bin alt. Ja, das hat mich genau so getroffen wie Euch jetzt… Okay, okay – ich bin 37. Aber ich habe gerade festgestellt, dass es Dinge von mir… Weiterlesen Veröffentlicht unter Erlebtes, Jugendliches, Persönliches | 4 Kommentare Große Hoffnungen in kleine Fische Veröffentlicht am 4.09.20124.09.2012 von Daniel Große Auf Kreta gibt es in diesem Jahr einen neuen Trend: An quasi jeder Ecke eröffnete ein Fish-Spa. Was das ist? Ein kleiner oder größerer Laden, in dem kleine Aquarien mit Fischen stehen. Das Besondere: Vor oder hinter den Fischgläsern sind Sitzflächen angebracht. Wer dort Platz nimmt, kann seine (vorher gewaschenen) Füße in das Aquarium halten,… Weiterlesen Veröffentlicht unter Erlebtes, Wirtschaftliches Urlaub. Vorbei. Veröffentlicht am 28.08.2012 von Daniel Große Kalimera. Rainbow Apartments. Im Meer baden. Fischen hinterher tauchen. Gut essen. Mythos trinken. Schwitzen. Kirchen bewundern. Stalis. Fish-Spa. Malia. Heraklion. Steinemaler. Venezianischer Hafen. Agios Nikolaos. Sissi. Türkisblaues Wasser. Grillenzirpen. „Lecker, lecker, Chocolata!“, Autohupen. Hibiscus. Lassithi-Hochebene. Windmühlen. Blauer Himmel. Cocktails. Mitternachtsshopping, Parasailing. Krabben. Kalispera. Marias Golden Beach. Elounda. Spinalonga. Kalidon. Sirtaki. Teller werfen. Nemo Beach Bar…. Weiterlesen Veröffentlicht unter Erlebtes, Persönliches Sonne, Palmen, Audi fahr’n Veröffentlicht am 23.05.201231.03.2018 von Daniel Große Ja, das Leben als Blogger ist schon anstrengend. Mittags nach Mallorca fliegen, am Nachmittag den neuen A3 fahren, der erst ab dem Sommer ausgeliefert wird. Am Abend in einem nagelneuen 5-Sterne-Hotel wunderbar essen, nächtigen in einem Hotelzimmer so groß wie eine Zweiraumwohnung und Aufwachen mit Blick auf das ruhende Mittelmeer. Nach einem ausgiebigen Frühstück wieder… Weiterlesen Veröffentlicht unter Alltägliches, Erlebtes, Motorisiertes | 2 Kommentare"
