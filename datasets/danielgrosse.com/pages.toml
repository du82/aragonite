description = "Ich hatte heute einen flotten Franzosen. Nein, das muss Euch und Ihnen nicht leid tun - im Gegenteil, es war"
full_description = "Flotter Franzose beim Podcast von der AMI (3) Veröffentlicht am 4.06.20145.06.2014 von Daniel Große Ich hatte heute einen flotten Franzosen. Nein, das muss Euch und Ihnen nicht leid tun – im Gegenteil, es war sehr angenehm. Aber bevor das hier abdriftet: Es handelte sich um den Citroen DS5. Ein Auto, das zwar schon vor zwei Jahren auf den Markt kam, aber noch immer faszinierend futuristisch ist. Einen kleinen Text dazu lest Ihr auf der Website der AMI. Selbige, also die Auto Mobil International 2014 läuft noch bis Sonntag. Genügend Zeit also für Thomas und mich, noch mehr Autos Probe zu fahren und dem geneigten Publikum die Höhepunkte der Messe auf den Online-Plattformen näher zu bringen. Und Zeit genug, allabendlich unser Innerstes nach Außen zu kehren und uns zu erzählen, was wir schon uns schon immer sagen wollten. Darum gibt es heute auch ganz viel Liebe im Podcast. Und Gruftis. Vielen Dank an unseren großartigen Sprecher Stefan Barth für das Intro und Outro. Musik: Spiedkiks – „Freak Boutique“ (Creative Commons) Dieser Beitrag wurde unter Lokales, Lustiges, Mediales, Motorisiertes, Werbliches, Wirtschaftliches gespeichert und mit den Schlagworten ami-podcast markiert. Speichere den Permanentlink."
