["https://www.danielgrosse.com/blog/im-sommerloch-nur-30-fahren"]
title = "Im Sommerloch nur 30 fahren! – Große Worte"
description = "Jedes Jahr zur Sommerzeit kommen Politikern Ideen und Gedanken, die kurzzeitig für Wirbel sorgen, um dann wieder in der Versenkung"
full_description = "Im Sommerloch nur 30 fahren! Veröffentlicht am 21.06.201222.06.2023 von Daniel Große Jedes Jahr zur Sommerzeit kommen Politikern Ideen und Gedanken, die kurzzeitig für Wirbel sorgen, um dann wieder in der Versenkung zu verschwinden. Meist für rund ein Jahr, denn der nächste Sommer kommt bestimmt. Auch derzeit beherrschen diverse Themen die Schlagzeilen, die wohl noch einige Zeit der Überlegung brauchen. Der Versuch einer Aufzählung – ohne Garantie auf Vollständigkeit. Kommen wir zuerst zum Lieblingsthema von Bundesverkehrsminister Peter Ramsauer, der PKW-Maut. Nachdem er 2009 erst laut darüber nachdachte und sogleich einen Rückzieher machte, holt er im gefühlt halbjährlichen Rhythmus das Thema zurück auf die Agenda. So auch dieses Jahr, sogar vorfristig im Spätfrühling. Bis es Angela Merkel zu bunt wurde – und Ramsauers Träumen eine Abfuhr erteilte. Vorerst. Wie so oft in der Politik. Die nächste Legislaturperiode, die nächste Bundesregierung kommt bestimmt. Und die PKW-Maut ganz sicher auch. Nächstes Thema: Tempo 30 in Städten. „Verkehrsexperten“, wie es heißt, von SPD und Grünen haben angekündigt, im Falle eines Wahlsieges im Bund, innerorts überwiegend Tempo 30 einzuführen. Mal davon abgesehen, dass es gerade in Städten bereits viele Tempo 30-Zonen gibt, die auch Sinn ergeben und dass es in manchen Städten ohnehin besser ist für das Auto, nur mit 30 statt 50 durch die Schlaglöcher zu fahren: die SPD-Spitze hat die Pläne bereits abgelehnt. Das Thema sei keines für die Bundesregierung sondern eines der Kommunen. Tempo 30 komme nur da, wo es Bürgerinnen und Bürger für richtig halten, so SPD-Fraktionschef Frank-Walter Steinmeier. Und noch ein Thema, das wohl die lauen Spätsommernächte nicht überstehen wird: Die EU-Kommission plant einen jährlichen TÜV für Fahrzeuge ab dem siebten Jahr nach Erstzulassung bzw. bei Autos über 160.000 Kilometern nach bereits vier Jahren. Der ADAC lehnt das ab: es gebe keine technische Begründung dafür. Die Unfallstatistik 2010 weise rund 355.000 PKW-Unfälle mit Personenschäden aus, der Anteil der Autos, bei denen technische Mängel die Unfallursache waren, lag bei gerade mal 0,42 Prozent. Insofern nütze die jährliche Hauptuntersuchung nur den Prüfern. Was bleibt? Viel Aufregung um Nichts. Fast nichts. Denn zumindest die PKW-Maut wird kommen. Ob mit oder ohne Merkel wird sich zeigen. Achso, was wirklich kommt, ist das Wechselkennzeichen. Das in der Form, wie es der Bundesramsauer plant, eine Totgeburt sein dürfte. Dieser Beitrag wurde unter Alltägliches, Motorisiertes gespeichert. Speichere den Permanentlink."
year_published = 2012
clearnet = "https://www.danielgrosse.com/blog/im-sommerloch-nur-30-fahren"
