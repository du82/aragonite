full_description = "Endlich: Der Podcast von der AMI (1) Veröffentlicht am 2.06.20144.10.2021 von Daniel Große Ja, Ihr habt ihn schon vermisst. Unseren Podcast von der AMI. Seit vergangenen Freitag läuft (für Thomas und mich) Deutschlands Automesse #hautnah. Wir schreiben exklusiv für die Website der AMI, pflegen das Community Management auf Facebook und Twitter – und haben dabei wohl derzeit den besten Job, den man in Leipzig haben kann. Neue Autos,… Weiterlesen Veröffentlicht unter Großes Netz, Lokales, Lustiges, Mediales, Werbliches, Wirtschaftliches | Schlagworte ami-podcast Ein Delfin als Aktienhändler Veröffentlicht am 26.05.201431.03.2018 von Daniel Große Eigentlich ist die Rubrik „Super Symbolbilder“ ja dem Kollegen Niggemeier vorbehalten – das hier bei ntv.de fand ich aber gerade so aberwitzig und grotesk, dass ich es unbedingt zeigen muss. Unter dem Titel Kaufrausch nach Wahlen – Dax springt auf Rekordhoch zeigen die Nachrichten-TV-Onliner einen Delfin. Untertitelt ist der Blödsinn mit „Freudensprünge an den Aktienmärkten:… Weiterlesen Veröffentlicht unter Großes Netz, Lustiges, Mediales, Tierisches Chor der Russischen Polizei singt „Get Lucky“ auf Energy Moskau Veröffentlicht am 26.11.201331.03.2018 von Daniel Große Ganz großes Radio, was da dieser Tage in Moskau gesendet wurde. Der Chor der Russischen Polizei war zu Gast bei „Black2White“, der Sendung von DJ Simon „Black Pepper“ auf Energy Moskau. Live im Studio sangen die Herren Daft Punks großartiges „Get Lucky“ und bewiesen: Es geht noch großartiger. Was nicht zuletzt auch an „Black Pepper“… Weiterlesen Veröffentlicht unter Großes Netz, Jugendliches, Kulturelles, Mediales, Musikalisches Beim ZDF klaut sich’s besser (Update) Veröffentlicht am 8.10.201330.12.2019 von Daniel Große Ich bin kein Design-Experte, das gebe ich zu. Aber ich erkenne, wenn etwas schlecht umgesetzt ist. So wie das neue Logo der Unister-Gruppe aus Leipzig etwa. Die umstrittenen Portalanbieter haben sich eine neue Wort-Bild-Marke g