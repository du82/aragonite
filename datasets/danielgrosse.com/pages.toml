title = "Niemann singt traurig: „Wir sind das Volk“ – Große Worte"
description = "Wir sind das Volk . Dieser Ausruf war 1989 ein Ausspruch, der mit voller Stolz gerufen wurde. Lautstark. Voller Überzeugung."
full_description = "Niemann singt traurig: „Wir sind das Volk“ Veröffentlicht am 1.09.200928.12.2020 von Daniel Große „Wir sind das Volk“. Dieser Ausruf war 1989 ein Ausspruch, der mit voller Stolz gerufen wurde. Lautstark. Voller Überzeugung. Mit dem Ziel, etwas zu verändern. Heute, 20 Jahre nach dem Fall der Mauer, zumindest der aus Steinen, veröffentlicht Kai Niemann eine Single, die sicher gut gemeint ist. Mich dann aber doch etwas irritiert. Kai Niemann? Na der, der damals sang, „Im Osten“ gäbe es die hübscheren Mädels und hier würden sich die Kinder auch über kleine Sachen freuen. Dieser Kai Niemann also, der mit „Im Osten“ einen Achtungserfolg landen konnte, kommt nun mit „Wir sind das Volk“, jenem selbstbewussten Ausspruch von damals. Allerdings frage ich mich, warum der Sprechgesang erstens klingen muss wie eine Mischung aus And One und Peter Heppner. Und zweitens, warum „Wir sind das Volk“ plötzlich so leise und traurig klingt. Depressiv geradezu. Ist das jetzt, 20 Jahre danach, die Weiterentwicklung des einstigen lautstarken Ausrufs? Die Wandlung vom Machtbekenntnis zur nüchternen Erkenntnis, dass wir zwar nun das Volk, aber sonst nichts sind? Könnte sein, wenn ich mir das Cover anschaue, auf dem das „Volk“ als Marionetten dargestellt ist. Ich habe den Song heute gehört, darf ihn aber leider auch nicht ausschnittsweise online stellen. Bei Radio PSR läuft er seit heute in der Rotation; Kai Niemann wird auch auf dem Tag der Sachsen auftreten. Auch weder auf Niemanns myspace-Profil ist der Song aktuell zu hören, noch auf seiner Website. Im Radio sollte man ihn aber nun öfter hören können, vermute ich. Und vielleicht erklärt Niemann ja auf PSR oder dem Tag der Sachsen, warum sein Song so traurig klingt. Verlegt wird die Platte übrigens bei Cäsar Music, dem Label von „Cäsar“-Legende Peter Gläser. Update: Mittlerweile gibt es auf der Website von Radio PSR eine Hörprobe des Songs. Update 2: Und mittlerweile gibts den Song auch bei Youtube. (Offizielle Version nachgereicht). Dieser Beitrag wurde unter Lokales, Musikalisches gespeichert. Speichere den Permanentlink."
year_published = 2009
clearnet = "https://www.danielgrosse.com/blog/niemann-singt-traurig-wir-sind-das-volk"
