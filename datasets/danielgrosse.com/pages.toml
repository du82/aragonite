title = "Komplett nackt: Der Podcast von der AMI (5) – Große Worte"
description = "Morgen ist Weltnacktradeltag (Vorsicht!). Ein Tag, um gegen den motorisierten Verkehr zu protestieren. Die Stadt Leipzig fand das nicht prima"
full_description = "Komplett nackt: Der Podcast von der AMI (5) Veröffentlicht am 6.06.20146.06.2014 von Daniel Große Morgen ist Weltnacktradeltag (Vorsicht!). Ein Tag, um gegen den motorisierten Verkehr zu protestieren. Die Stadt Leipzig fand das nicht prima und hat das Nacktradeln kurzerhand verboten und von den Richtern als „grob ungehörig“ einstufen lassen. Wer weiß, vielleicht müssen auch noch ein paar Akten per Taxi transportiert werden – da stören die Radfahrer bloß. Nun, wie auch immer – im heutigen Podcast von der AMI Leipzig lässt Kollege Gigold ein klein wenig den Clown raus, den er jeden Morgen von seiner Frau in den Kaffee geschüttet bekommt. Aber keine Angst, was sich anhört wie eine mittelschwere Paranoia ist lediglich der Messekoller. Wundert mich, dass er so spät kommt dieses Jahr. Bei mir ist es sicher morgen dann soweit. Für den allabendlichen Hörsturz klicken Sie bitte nun auf Play. Vielen Dank an unseren großartigen Sprecher Stefan Barth für das Intro und Outro. Musik: Spiedkiks – „Freak Boutique“ (Creative Commons) Dieser Beitrag wurde unter Lokales, Lustiges, Mediales, Werbliches, Wirtschaftliches gespeichert und mit den Schlagworten ami-podcast markiert. Speichere den Permanentlink."
