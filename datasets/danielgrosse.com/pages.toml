full_description = "Erneut neuer Geschäftsführer für Leipziger Volkszeitung Veröffentlicht am 24.07.201428.12.2020 von Daniel Große Marc Zeimetz steigt auf in die Madsack-Konzerngeschäftsführung. Björn Steigert wechselt am 15. September 2014 von der Sächsischen Zeitung als neuer operativer Geschäftsführer zur Leipziger Volkszeitung. Weiterlesen Veröffentlicht unter Lokales, Mediales, Wirtschaftliches | 1 Kommentar Die wunderbare Werbe-Welt des LVZ Boulevard Veröffentlicht am 9.07.201422.06.2023 von Daniel Große Die Kolumne „Boulevard“ der Leipziger Volkszeitung ist eine Rubrik, über die man trefflich streiten kann. Hier sammeln die Kollegen seit vielen Jahren (anfänglich unter dem Namen „Leute in Leipzig“, später „BouL.E.vard“) kleine Zwischengeschichten, die sonst nirgends Platz finden. Meist sind dies Artikel zu Promis oder wenigstens Persönlichkeiten der Stadt. Das alles muss man nicht lesen,… Weiterlesen Veröffentlicht unter Lokales, Mediales, Werbliches | 6 Kommentare Einbruch in Tauchaer Kita Veröffentlicht am 9.07.20149.07.2014 von Daniel Große In der Nacht zum heutigen Mittwoch wurde in der Tauchaer Kindertagesstätte Tausendfüßler zum wiederholten Mal eingebrochen. Beim Betreten der Räumlichkeiten fand die Leiterin heute Morgen einen offenbar polizeibekannten Drogenabhängigen vor. Dieser schlief und hatte sich vorher in einem Raum des Kindergartens übergeben. Da dem Einbrecher eine Hepatitis-Erkrankung nachgesagt wird, wurde der Kindergartenbereich geschlossen, die Kinder… Weiterlesen Veröffentlicht unter Lokales | 1 Kommentar Oskar. Veröffentlicht am 8.07.20148.07.2014 von Daniel Große Die Zeit rast – schon ewig nichts mehr gebloggt. Dabei passiert derzeit so viel. Wer mir auf Facebook folgt oder mit mir befreundet ist, weiß es bereits: Seit 28. Juni bin ich zum zweiten Mal Vater geworden. Unser Oskar bereitet uns und seiner großen Schwester viel Freude und bringt den Tages- und Nachtablauf ganz schön… Weiterlesen Veröffentlicht unter Persönliches"
year_published = 2014
