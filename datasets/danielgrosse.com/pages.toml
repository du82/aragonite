title = "Mein Leipzig – ich lob‘ es mir! – Große Worte"
description = "Durch Zufall stieß ich heute bei YouTube auf einen wunderbaren Fernsehfilm, der 1980 im damaligen Westfernsehen lief. Nach 30 Jahren"
full_description = "Mein Leipzig – ich lob‘ es mir! Veröffentlicht am 20.06.201220.06.2012 von Daniel Große Durch Zufall stieß ich heute bei YouTube auf einen wunderbaren Fernsehfilm, der 1980 im damaligen „Westfernsehen“ lief. Nach 30 Jahren besuchte Autor Dieter Zimmer „sein“ Leipzig erneut. Bis zum 13. Lebensjahr hatte er hier gelebt und entdeckte die Stadt für den Film neu. Es ist teils ein wenig belustigend, aber vor allem hochinteressant, Leipzig im Jahre 1980 auf diese Weise kennen zu lernen. Als Leipziger fühlt man sich sofort heimisch, erkennt die alten Straßenbahnen, nickt in Erinnerung an die verfallenen Häuser heftig mit dem Kopf und freut sich zugleich, dass Leipzig im Laufe der Jahre so schön geworden ist. Kaum zu glauben etwa, dass sich Dieter Zimmer zu Beginn in Gohlis befindet. Wer den Anblick der Pölitzstraße 11 mit dem heutigen (Link zu Google Streetview) vergleicht, dem läuft zuerst ein kalter Schauer über den Rücken und gleich anschließend schmunzelt man. Zeitgleich überkommt einen so etwas wie Stolz. Mir jedenfalls geht das so. Ja, Leipzig hat es geschafft, aus dem im Film „Vorort“ genannten Gohlis einen lebens- und liebenswerten Stadtteil zu machen. Das Gohliser Schlösschen, die Menckestraße, der Zoo sehen heute besser aus als damals und lassen einen fast vergessen, wie grau es damals überall aussah. Aber nicht nur in Leipzigs heutiger Top-Lage hat sich viel getan. Die gesamte Stadt erkennt man kaum wieder, wären im Film nicht solche Wahrzeichen wie der Uni-Riese oder das Gewandhaus, das 1980 noch gebaut und ein Jahr später eröffnet wurde. Was bleibt? An manchen Stellen Verwunderung mit wie viel Aufwand Dieter Zimmer versuchte, unbedingt etwas Kritisches anmerken zu müssen. Und Verwunderung über die offensichtlich auswendig gelernten Dialoge mit den Interviewpartnern. Aber vor allem das Gefühl: Ja, mein Leipzig lob ich mir. Wegen seiner Vergangenheit, aber erst recht wegen seiner Gegenwart. Wir haben sicher noch nicht alles erreicht, vor uns liegt ein Haufen Arbeit. Aber wir sind auf dem richtigen Weg. Dieser Beitrag wurde unter Alltägliches, Lokales, Persönliches gespeichert. Speichere den Permanentlink."
year_published = 2006
clearnet = "https://www.danielgrosse.com/blog/mein-leipzig-ich-lob-es-mir"
