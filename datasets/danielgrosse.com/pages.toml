description = "Presserat missbilligt Leipziger Volkszeitung, Taucha kompakt gestartet, Neues CG-Magazin erschienen, Süßer Fratz: Der Little ADAM, Die #icebucketchallenge und ich"
full_description = "Presserat missbilligt Leipziger Volkszeitung Veröffentlicht am 21.12.201421.12.2014 von Daniel Große Auch eine humorvolle und saloppe Formulierung rechtfertigt keine werbliche Darstellung von Personen und Produkten. So könnte man die Entscheidung des Presserates zusammenfassen, die mir nun zuging. Am 9. Juli veröffentlichte ich hier einen Artikel, in dem ich mich über die „Wunderbare Werbe-Welt des LVZ Boulevard“ ausließ. Weiterlesen Veröffentlicht unter Lokales, Mediales Taucha kompakt gestartet Veröffentlicht am 14.11.2014 von Daniel Große Gestern Abend habe ich „Taucha kompakt“ gestartet. Das neue Online-Magazin für Taucha will informieren, nachfragen und aufklären. Hier steht vor allem das, was mich selbst interessiert und was die Tauchaer interessieren könnte. Zum Start gibt es gleich zwei Exklusiv-Geschichten. Diese sind nur entstanden, weil ich offenen Auges durch Taucha gehe. Themenvorschläge nehme ich gern entgegen…. Weiterlesen Veröffentlicht unter Großes Netz Neues CG-Magazin erschienen Veröffentlicht am 9.10.201428.12.2020 von Daniel Große Bereits zum dritten Mal durfte ich in diesem Jahr im Auftrag der TOP Media Leipzig das umfangreiche Projekt redaktionell umsetzen. Weiterlesen Veröffentlicht unter Großes Netz Süßer Fratz: Der Little ADAM Veröffentlicht am 16.09.201416.09.2014 von Daniel Große Als junger Vater – hust – okay, als Vater, der gerade noch mal Vater geworden ist, macht man die verrücktesten Dinge. Beispielsweise, dem noch nicht mal drei Monate alten Sprössling ein Auto kaufen. Weiterlesen Veröffentlicht unter Alltägliches, Motorisiertes, Persönliches Die #icebucketchallenge und ich Veröffentlicht am 26.08.201418.07.2019 von Daniel Große Ich gebe es zu: Bis das Phänomen der Ice Bucket Challenge im Netz auftauchte, hatte ich von der Krankheit ALS noch nichts gehört. Die Amyotrophe Lateralsklerose schädigt das motorische Nervensystem nachhaltig. Zum Schluss ist man sozusagen gefangen im eigenen Körper, kann sich nicht mehr bewegen und sprechen, während der Geist aber vollumfänglich arbeitet. Die Ursachen… Weiterlesen Veröffentlicht unter Erlebtes, Mediales | 2 Kommentare"
