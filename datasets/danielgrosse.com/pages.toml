["https://www.danielgrosse.com/blog/der-paketkasten-ist-da"]
title = "Der Paketkasten ist da. – Große Worte"
description = "Da ist er nun, der Paketkasten. Gestern wurde geliefert und von netten Mitarbeitern eines Schlüsseldienstes montiert. In zwei Tagen könnte"
full_description = "Der Paketkasten ist da. Veröffentlicht am 20.09.20139.10.2013 von Daniel Große Da ist er nun, der Paketkasten. Gestern wurde er geliefert und von netten Mitarbeitern eines Schlüsseldienstes montiert. In zwei Tagen könnte ich den Kasten dann so richtig nutzen, sagt DHL. Nach der Registrierung auf paket.de rief das Paketkasten-Team bei mir an und bestätigte mir, dass alles seinen Gang geht und jetzt ein lokaler Mitarbeiter noch den Kasten für den Empfang vorbereite – was auch immer das heißt. Ich vermute, die sorgen dafür, dass der Chip, der den Kasten öffnet, an den DHL-Fahrer ausgegeben wird, der hier immer die Pakete bringt. Oder so. 🙂 Wie man den Kasten öffnet, seht Ihr im Video unten. Dieser Beitrag wurde unter Getestetes, Werbliches, Wirtschaftliches gespeichert und mit den Schlagworten paketkasten markiert. Speichere den Permanentlink. Matthias sagt: 20.09.2013 um 18:08 Von diesen Paketkästen halte ich viel – die Frage ist aber doch: Was ist mit Hermes, UPS usw? Daniel Große sagt: 20.09.2013 um 20:51 Wie im Artikel vorher beschrieben: Die dürfen leider nichts dort reinlegen. Find ich auch sehr schade."
