["https://www.danielgrosse.com/blog/es-endet-hier-der-podcast-von-der-ami-7"]
title = "Es endet hier: Der Podcast von der AMI (7) – Große Worte"
description = "Das war sie, die AMI 2014. Zehn Tage voller Autos, Probefahrten und diesem abendlichen Hör-Wahnsinn. Tage, diesmal mit einem etwas"
full_description = "Es endet hier: Der Podcast von der AMI (7) Veröffentlicht am 8.06.20144.10.2021 von Daniel Große Das war sie, die AMI 2014. Zehn Tage voller Autos, Probefahrten und diesem abendlichen Hör-Wahnsinn. Zehn Tage, die diesmal mit einem etwas flauen Gefühl im Bauch endeten. Denn durch sommerliche Temperaturen, Feiertage, Stadtfest, Wave-Gotik-Treffen und Absagen diverser Hersteller wollte sich in Leipzig kein so rechtes AMI-Gefühl einstellen. Man spürte regelrecht, dass die Leute alles im Kopf hatten – nur keine Autos. Am Ende musste die AMI besuchertechnisch deutlich Federn lassen. Thomas hat in seinem Autoblog auch etwas dazu geschrieben. Was bleibt? Das Abhupen. Welches in diesem Jahr bedeutend leiser und kürzer ausfiel. Hoffen wir, dass es in zwei Jahren wieder besser wird. Es wird viel zu tun geben. Vielen Dank an unseren großartigen Sprecher Stefan Barth für das Intro und Outro. Musik: Spiedkiks – „Freak Boutique“ (Creative Commons) Dieser Beitrag wurde unter Lokales, Mediales, Motorisiertes, Werbliches, Wirtschaftliches gespeichert und mit den Schlagworten ami-podcast markiert. Speichere den Permanentlink."
