["https://www.danielgrosse.com/blog/mdr-jump-macht-wieder-schulwege-sicherer"]
title = "MDR JUMP macht wieder Schulwege sicherer – Große Worte"
description = "Sie ist grün-rot und lecker. Und eine wirklich schöne Aktion von MDR JUMP in jedem Jahr: die Zuckertüte. In diesem"
full_description = "MDR JUMP macht wieder Schulwege sicherer Veröffentlicht am 20.08.201331.03.2018 von Daniel Große Sie ist grün-rot und lecker. Und eine wirklich schöne Aktion von MDR JUMP in jedem Jahr: die JUMP Zuckertüte. In diesem Jahr bekommen über 74.000 Schulanfänger in Sachsen, Sachsen-Anhalt und Thüringen die süße Überraschung, die in Zusammenarbeit mit Zetti an die Kinder ausgegeben wird. Der eigentliche Ansatz der Popwelle des Mitteldeutschen Rundfunks geht aber weit darüber hinaus, den Eingeschulten Süßigkeiten zu überbringen: Vielmehr können Schulen, Radiohörer und Leser von Medien, die über die Aktion „Vorsicht Zuckertüte“ berichten, gefährliche Schulwege melden. Wo fehlen Hinweisschilder, wo müsste ein Fußgängerüberweg installiert, wo ein Tempo 30 erlassen werden? Bislang seien schon über 350 Versäumnisse und Gefahren gemeldet worden. Auch Ihr als meine Leser könnt das gern in den Kommentaren tun – ich würde das dann weiterleiten. Und Danke an MDR JUMP für die alljährliche süße Überraschung per Post. Meine Tochter freut sich jedes Mal. Okay, ich auch. 😉 Dieser Beitrag wurde unter Jugendliches, Lokales, Mediales gespeichert. Speichere den Permanentlink. Margit sagt: 29.08.2013 um 20:15 Werte Redaktion, haben Sie für die Musikbesprechung keinen kompetenteren, als Herrn Hans Hoff? In Nr.35/2013 ist die Herabsetzung von Helene Fischer und das nachgemachte Fliegen von Andrea Berg (bei allen langjährigen Verdiensten für den Schlager, ist und bleibt A.B. ein Bewegungstrampel) doch wohl nicht zu vergleichen. Der Schlager und die Konzerte haben einen Aufschwung erlebt, wie es ihn ohne Frau Fischer nicht gegeben hätte. Es haben alle Künstler ihre Fans und somit auch ihre Berechtigung in der Gesellschaft. Der Kommentar wird ja nicht erscheinen, denn „wer Ihnen auf den Teppich kotzt- fliegt raus.“ Wie primitiv sind Sie eigentlich? Margit Daniel Große sagt: 30.08.2013 um 11:58 Liebe Margit, ich bin immerhin so schlau, zu merken, wo ich kommentiere. Das hier ist nicht die Website von JUMP. Da aber alle Kommentare ihre Berechtigung in der Gesellschaft haben, veröffentliche ich Ihren Kommentar trotzdem…"
year_published = 2008
clearnet = "https://www.danielgrosse.com/blog/mdr-jump-macht-wieder-schulwege-sicherer"
