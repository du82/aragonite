["https://www.danielgrosse.com/blog/die-turrican-anthology"]
title = "Die Turrican Anthology – Große Worte"
description = "Der Soundtrack von Turrican ist auch heute noch für mich der mit dem größten Gänsehautfaktor. Ein Spiel, das ich wochenlang"
full_description = "Die Turrican Anthology Veröffentlicht am 24.04.20123.08.2022 von Daniel Große Der Soundtrack von „Turrican“ ist auch heute noch für mich der Soundtrack mit dem größten Gänsehautfaktor. Ein Spiel, das ich wochenlang gespielt habe oder auf dem Amiga einfach nur das Titelbild habe stehen lassen, um die Musik zu hören. Jetzt will Chris Huelsbeck eine Anthology mit allen Titeln der „Turrican“-Reihe veröffentlichen. Klar, dass ich das Projekt, an dem auch Thomas Böcker (Macher der Computerspiel-Konzerte, unter anderem zur Games Convention) mitwirkt, unterstütze. Die Produktionskosten werden derzeit über die Crowdfunding-Plattform Kickstarter eingesammelt. 75.000 Dollar werden benötigt, aktuell steht der Zähler bei über 63.000 Dollar. Für die Unterstützer gibt es mehrere, teils sehr attraktive Pakete, die je nach Höhe der Unterstützung erworben werden. Von einem „virtuellen Danke“ von Chris angefangen bis hin zu wöchentlichen Skype-Konferenzen mit Chris, in denen er zum Status des Projektes informiert. Erscheinungstermin soll der Dezember diesen Jahres sein. Ich freue mich schon jetzt auf das Ergebnis. Denn die Musik aus „Turrican“ gilt zurecht als eine der besten, die Chris Hülsbecks Synthesizer je verlassen haben. Natürlich steht die Soundtrack-CD auch hier bereits im Regal – die Anthology würde das Ganze noch toppen. Ich drücke also die Daumen, dass das benötigte Geld zusammen kommt. So klang die Titelmusik von Turrican II auf dem Amiga 500: Und hier die wunderbare klassische Umsetzung des WDR Rundfunkorchesters und des Filmharmonic Orchestra Prague anlässlich des Spielemusikkonzertes Symphonic Shades (23.8.2008): Update, 27. April: Das Ziel der 75.000 Dollar wurde erreicht. Glückwunsch! Dann freu ich mich mal auf den Dezember. 🙂 Dieser Beitrag wurde unter Jugendliches, Kulturelles, Musikalisches gespeichert. Speichere den Permanentlink."
year_published = 2012
clearnet = "https://www.danielgrosse.com/blog/die-turrican-anthology"
