["https://www.danielgrosse.com/blog/unister-logo-beim-zdf-klaut-sichs-besser"]
title = "Beim ZDF klaut sich’s besser (Update) – Große Worte"
description = "Ich bin kein Design-Experte, das gebe ich zu. Aber erkenne, wenn etwas schlecht umgesetzt ist. So wie neue Logo der"
full_description = "Beim ZDF klaut sich’s besser (Update) Veröffentlicht am 8.10.201330.12.2019 von Daniel Große Ich bin kein Design-Experte, das gebe ich zu. Aber ich erkenne, wenn etwas schlecht umgesetzt ist. So wie das neue Logo der Unister-Gruppe aus Leipzig etwa. Die umstrittenen Portalanbieter haben sich eine neue Wort-Bild-Marke gegönnt, die in vielerlei Hinsicht merkwürdig erscheint. Natürlich müssen sich die Unisters den Vorwurf gefallen lassen, beim ZDF geklaut zu haben. Nicht nur die „Idee“ des aus einem Kreis ausgestanzten Buchstabens wurde übernommen, auch entsprechen die RGB-Werte des gewählten Orange-Tons fast dem des ZDF-Logos: Ja, das sind die Web-Logos, die Werte unterscheiden sich in den Vektor-Logos möglicherweise noch mehr. Und ja, das alte Logo verwendete auch schon einen Orange-Ton, das unterschied sich jedoch bedeutend vom jetzigen. Zudem ist die Schriftart nicht sonderlich schön oder ausgefallen. Sieht mir eher aus wie eine Standard-Schrift, die hier verwendet wurde. Dazu kommt: Die Abstände zwischen den Buchstaben sind Mist. Das S sitzt rechts weiter am T als es links am I ist, das R sieht mir auch viel zu weit rechts aus. Aber das passt vielleicht ganz gut zur allgemeinen Außenwirkung. Btw: Was macht eigentlich der Unister-Neubau? Das Designtagebuch hat das Logo auch schon entdeckt und meint, Unister gönne sich zumindest überhaupt mal ein Logo. „Mehr als verwunderlich, dass das Clipart-Dinges überhaupt so lange überleben konnte“, schreibt Achim Schaffrinna. Vielleicht folgt ja noch eine ausführlichere Einschätzung. Update: Gestaltet hat das Logo die Werbeagentur zebra aus Chemnitz. Das verwundert, überzeugt zebra doch sonst mit sehr guten Arbeiten, nicht umsonst ist zebra Ostdeutschlands größte und erfolgreichste Agentur. Bin ein wenig verwirrt über diese Arbeit. Im Intranet von Unister ist zu lesen: „Vom ersten Treffen zwischen den UNISTER-Gesellschaftern und Agentur bis hin zur Freigabe hat der Logo-Prozess nur knapp drei Monate gedauert. Ein sehr schneller Prozess, wie zebra-Geschäftsführer Joerg G. Fieback bereits im Interview erklärte. Aber es sei ein Indiz für klare Vorstellungen und die Entschlossenheit seitens der UNISTER-Gruppe.“ Außerdem ist dort gleich die Erklärung zur Ähnlichkeit mit dem ZDF-Logo zu lesen: Das neue UNISTER-Logo hat erstaunlich viel Ähnlichkeit mit dem eines deutschen Fernsehsenders, wie sich einige UNISTER-Mitarbeiterinnen und Mitarbeiter gleich nach der Logo-Präsentation im Intranet am Freitag direkt an die Geschäftsführung gewandt haben. Hat das Folgen? Nein, stellt Joerg G. Fieback klar. Der Geschäftsführer und Creative Director der Werbeagentur zebra, die sich verantwortlich für das neue Logo zeigt, klärt auf. „Das neue Unister-Logo ist eine Evolution. In ihm befindet sich die DNA des alten Auftritts. Bei der grafischen Reduktion des Buchstaben U in einem orangefarbenen Kreis sind wir auf die nun vorliegende Lösung gekommen. Dass man bei solchen Design-Prozessen auch in die Nähe anderer Markenzeichen kommt, kann durchaus passieren“, so der zebra-Chef. Fieback verweist auf andere Beispiele, unter anderem auf das Wahlkampflogo von Barack Obama, welches sehr stark dem eines bestimmten Cola-Herstellers ähnelt. „Auch hier könnte man unterstellen, dass Obama für eine ganz bestimmte Cola eine Vorliebe hat. Die Wahrheit ist: Solche unbeabsichtigten Ähnlichkeiten gibt es. Solange die beiden nicht in den selben Gewässern fischen, ist es unproblematisch“, weiß Fieback. Na dann… Dieser Beitrag wurde unter Alltägliches, Großes Netz, Lokales, Mediales gespeichert. Speichere den Permanentlink."
year_published = 2013
