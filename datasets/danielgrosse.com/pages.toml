["https://www.danielgrosse.com/blog/kostenloses-seminar-social-media-fur-fuhrungskrafte"]
title = "Kostenloses Seminar: Social Media für Führungskräfte – Große Worte"
description = "Zu einem kostenlosen Seminar lädt heute Abend die FOM Hochschule ein. Ab 18 Uhr gibt es unter dem Titel „Social"
full_description = "Kostenloses Seminar: Social Media für Führungskräfte Veröffentlicht am 16.05.2013 von Daniel Große Zu einem kostenlosen Seminar lädt heute Abend die FOM Hochschule ein. Ab 18 Uhr gibt es unter dem Titel „Social Media für Führungskräfte“ eine Diskussionrunde mit kompetenten Experten zu diesem Thema. Veranstaltungsort ist das FOM Hochschulstudienzentrum in der Katharinenstraße 17 Wer täglich in den sozialen Netzen unterwegs ist, merkt es an der einen oder anderen Stelle ganz deutlich: Viele Unternehmen haben erheblichen Nachholbedarf im Umgang mit den sozialen Medien. Da werden Personenprofile auf Facebook zum Firmenauftritt erklärt, falsch mit der Zielgruppe kommuniziert, da verwaisen Twitter-Profile, weil sich niemand für die Pflege findet oder Unternehmen meiden die sozialen Netzwerke gleich ganz, weil sie Angst davor haben. Auch der Branchenverband BITKOM bescheinigt deutschen Unternehmen Nachholbedarf im Umgang mit sozialen Medien. Demnach ist zwar knapp die Hälfte aller deutschen Betriebe bei Facebook, Twitter und Co. aktiv, wenn es um die Umsetzung geht, werden die Möglichkeiten der Kommunikationsplattformen jedoch nicht konsequent ausgeschöpft. Wie man als Führungskraft die richtige Strategie für den Umgang mit dem Social Web entwickelt, steht beim Mittelstandsforum Leipzig der FOM Hochschule heute ab 18 Uhr zur Diskussion. Unter dem Titel „Social Media für Führungskräfte“ wartet die Veranstaltung mit kompetenten Experten aus der Praxis auf. Michael Geffken, Direktor und Geschäftsführer der Leipzig School of Media, thematisiert die Folgen der sogenannten Medienrevolution. Danach setzt sich Katja von der Burg, Geschäftsführerin der Projecter GmbH, mit den Möglichkeiten des Social Webs auseinander und verrät, wie Unternehmen von diesen profitieren können. Im Anschluss an die Vorträge besteht die Möglichkeit, sich in lockerer Runde mit den anderen Teilnehmern und den Referenten auszutauschen. Das Mittelstandsforum findet im FOM Hochschulstudienzentrum in der Katharinenstraße 17 statt, die Veranstaltung ist kostenlos. Um Anmeldung wird unter 0341 870967-91 oder corrina.herold@fom.de gebeten. Dieser Beitrag wurde unter Großes Netz gespeichert. Speichere den Permanentlink."
year_published = 2013
