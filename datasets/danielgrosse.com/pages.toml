["https://www.danielgrosse.com/blog/suesser-fratz-der-little-adam"]
title = "Süßer Fratz: Der Little ADAM – Große Worte"
description = "Als junger Vater - hust okay, als Vater, der gerade noch mal geworden ist, macht man die verrücktesten Dinge. Beispielsweise,"
full_description = "Süßer Fratz: Der Little ADAM Veröffentlicht am 16.09.201416.09.2014 von Daniel Große Als junger Vater – hust – okay, als Vater, der gerade noch mal Vater geworden ist, macht man die verrücktesten Dinge. Beispielsweise, dem noch nicht mal drei Monate alten Sprössling ein Auto kaufen. Diverse Autohersteller haben ja ihre Modelle auch als Rutschauto im Angebot. Zu Preisen, für die man heute schon eine Monatsrate für ein richtiges Auto zahlen kann. Muss ja nicht sein. Als vor ein paar Tagen Autoblogger Jens Stratmann per Facebook den Link zu Tchibo teilte, war es um mich geschehen. In einer Kooperation mit Opel kann man derzeit nicht nur den Little Adam, sondern auch den großen, ja, das richtige Auto bei Tchibo kaufen. Soeben kam er an, der Little ADAM in Sanguine Red. Das Auto ist teilweise vormontiert. Räder, Opel-Emblem, Scheinwerfer sowie Nebelscheinwerfer, Nebelschlussleuchte und Rückfahrlicht sind bereits montiert. Letztere, also die kleinen Aufkleber, die am Heck die Nebelschlussleuchte und das Rückfahrlicht symbolisieren sollen, waren bei unserem Exemplar sehr schief aufgeklebt. Die Buttons lassen sich aber leicht lösen und erneut schöner aufkleben. Ans Heck kommt noch der ADAM-Aufkleber. Montiert werden musste die Lenkstange und das Lenkrad. Anscheinend ist das Loch für die Lenkstange mit einem falschen Durchmesser vorgebohrt – zumindest passte die Stange nicht hindurch. Lässt sich aber mit einer Rundfeile leicht nacharbeiten. Lenkrad anschrauben – und fertig. Natürlich ist das Lenkrad mit einer Hupe ausgerüstet. Die klingt ein bisschen wie im Zeichentrickfilm, aber für Kinder ab einem Jahr ist das sicher angemessen… 🙂 Dieser Beitrag wurde unter Alltägliches, Motorisiertes, Persönliches gespeichert. Speichere den Permanentlink."
