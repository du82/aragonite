["https://www.danielgrosse.com/blog/nach-einbruch-in-tauchaer-kita-ausgliederung-der-kinder-in-regenbogenschule-notig"]
title = "Einbruch in Tauchaer Kita – Große Worte"
description = "In der Nacht zum heutigen Mittwoch wurde in Tauchaer Kindertagesstätte Tausendfüßler wiederholten Mal eingebrochen. Beim Betreten Räumlichkeiten fand die Leiterin"
full_description = "Einbruch in Tauchaer Kita Veröffentlicht am 9.07.20149.07.2014 von Daniel Große In der Nacht zum heutigen Mittwoch wurde in der Tauchaer Kindertagesstätte Tausendfüßler zum wiederholten Mal eingebrochen. Beim Betreten der Räumlichkeiten fand die Leiterin heute Morgen einen offenbar polizeibekannten Drogenabhängigen vor. Dieser schlief und hatte sich vorher in einem Raum des Kindergartens übergeben. Da dem Einbrecher eine Hepatitis-Erkrankung nachgesagt wird, wurde der Kindergartenbereich geschlossen, die Kinder kamen übergangsweise in der Regenbogengrundschule unter. Bis 14 Uhr wurde der Kindergartenbereich desinzifiert, danach konnten die Kinder zurückkehren. Der Kinderkrippenbereich war nach ersten Meldungen nicht betroffen, trotzdem zogen es einige Eltern aus Sicherheitsgründen vor, ihre Schützlinge heute zu Hause zu betreuen. Die Pressemitteilung der Polizei im Wortlaut dazu: Schlafend fanden die Kindergartenleiterin (45) und die bereits hinzu gerufenen Gesetzeshüter einen 35-Jährigen, der sich in einem Gruppenraum zur Ruhe gebettet hatte. Der Mann war durch den Keller in den Kindergarten eingebrochen und hatte in mehreren Räumen Schränke und Behältnisse durchwühlt, wurde aber offenbar nicht fündig. Von einer schweren Müdigkeit und mutmaßlich einem Betäubungsmittelrausch übermannt, ließ er sich in dem Zimmer nieder, in dem er schließlich durch die Polizisten sanft geweckt wurde. Seinen Schlaf konnte er später, nach der erklärten vorläufigen Festnahme, im Zentralen Polizeigewahrsam fortsetzen. Er wird sich wegen versuchten Diebstahls im besonders schweren Fall verantworten müssen. Dieser Beitrag wurde unter Lokales gespeichert. Speichere den Permanentlink. Daniel sagt: 9.07.2014 um 14:06 Das der Täter auch noch so doof ist dort zu nächtigen wundert mich nicht. Augenscheinlich wollte er ja unbedingt verhaftet werden, warum er sich nicht gleich bei der Polizei meldet und stattdessen einen Kindergarten besudelt bleibt wohl sein Geheimnis. Strafe wird er wohl keine allzu hohe bekommen."
