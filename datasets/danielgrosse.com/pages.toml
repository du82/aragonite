full_description = "Süßer Fratz: Der Little ADAM Veröffentlicht am 16.09.201416.09.2014 von Daniel Große Als junger Vater – hust – okay, als Vater, der gerade noch mal Vater geworden ist, macht man die verrücktesten Dinge. Beispielsweise, dem noch nicht mal drei Monate alten Sprössling ein Auto kaufen. Weiterlesen Veröffentlicht unter Alltägliches, Motorisiertes, Persönliches Beim ZDF klaut sich’s besser (Update) Veröffentlicht am 8.10.201330.12.2019 von Daniel Große Ich bin kein Design-Experte, das gebe ich zu. Aber ich erkenne, wenn etwas schlecht umgesetzt ist. So wie das neue Logo der Unister-Gruppe aus Leipzig etwa. Die umstrittenen Portalanbieter haben sich eine neue Wort-Bild-Marke gegönnt, die in vielerlei Hinsicht merkwürdig erscheint. Natürlich müssen sich die Unisters den Vorwurf gefallen lassen, beim ZDF geklaut zu haben…. Weiterlesen Veröffentlicht unter Alltägliches, Großes Netz, Lokales, Mediales | 1 Kommentar Im Sommerloch nur 30 fahren! Veröffentlicht am 21.06.201222.06.2023 von Daniel Große Jedes Jahr zur Sommerzeit kommen Politikern Ideen und Gedanken, die kurzzeitig für Wirbel sorgen, um dann wieder in der Versenkung zu verschwinden. Meist für rund ein Jahr, denn der nächste Sommer kommt bestimmt. Auch derzeit beherrschen diverse Themen die Schlagzeilen, die wohl noch einige Zeit der Überlegung brauchen. Der Versuch einer Aufzählung – ohne Garantie… Weiterlesen Veröffentlicht unter Alltägliches, Motorisiertes Mein Leipzig – ich lob‘ es mir! Veröffentlicht am 20.06.201220.06.2012 von Daniel Große Durch Zufall stieß ich heute bei YouTube auf einen wunderbaren Fernsehfilm, der 1980 im damaligen „Westfernsehen“ lief. Nach 30 Jahren besuchte Autor Dieter Zimmer „sein“ Leipzig erneut. Bis zum 13. Lebensjahr hatte er hier gelebt und entdeckte die Stadt für den Film neu. Es ist teils ein wenig belustigend, aber vor allem hochinteressant, Leipzig im… Weiterlesen Veröffentlicht unter Alltägliches, Lokales, Persönliches"
