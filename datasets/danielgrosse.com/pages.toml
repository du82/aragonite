full_description = "Games City Leipzig: * 29.8.2002, † 14.4.2011 Veröffentlicht am 14.04.20113.08.2022 von Daniel Große Heute ging ein gutes Stück Leipziger Wirtschafts-Geschichte zu Ende. Die Games City Leipzig existiert nicht mehr, die Leipziger Messe verabschiedet sich endgültig vom Thema Computerspiele. Die Games Convention Online wurde heute abgesagt: Die GAMES CONVENTION ONLINE 2011 wird nicht stattfinden. Der Fachkongress mit begleitender Ausstellung war für den 07. und 08. Juli geplant. Die Mehrheit… Weiterlesen Veröffentlicht unter GC Games Convention, Mediales, Werbliches, Wirtschaftliches | 1 Kommentar Computerspielemusik gleich zwei Mal in den Klassik-Charts Veröffentlicht am 19.10.201028.12.2020 von Daniel Große Wenn ein Album voll mit Computerspielemusik in den Klassik-Charts Größen wie Pavarotti oder Anna Netrebko schlägt, dann muss das was heißen. Und wenn dann ein zweites Album mit Klängen aus Videospielen in den Top 20 ist, darf man das durchaus eine Sensation nennen. Heute wurden die Oktober-Charts im Klassikbereich veröffentlicht. Neu auf Platz 20 ist… Weiterlesen Veröffentlicht unter GC Games Convention, Kulturelles, Musikalisches GCO-Time Veröffentlicht am 24.07.20093.08.2022 von Daniel Große Es ist ruhig hier geworden, ich weiß das. Bis Anfang August wird sich das auch nicht ändern. Stattdessen lade ich Euch ein, im Blog der GAMES CONVENTION ONLINE vorbeizuschauen. Dort bloggen Thomas und ich bereits seit mehreren Monaten. Jetzt wird’s so langsam richtig spannend, denn die weltweit erste Messe für Browser-, Client-, und Mobilegames steigt… Weiterlesen Veröffentlicht unter GC Games Convention, Mediales, Werbliches Alte „Computer-Schwarten“ auf Leipziger Buchmesse Veröffentlicht am 26.02.200925.02.2009 von Daniel Große Wenn es um Computerspiele geht, führt in Leipzig kein Weg an René Meyer vorbei. Auf der Games Convention stellte der 38-Jährige schon zweimal Teile seiner Spielkonsolen-Sammlung aus. Jetzt ist er bei der Buchmesse dabei – und zeigt Schätze seiner Sammlung von Computermagazinen. Was viele nicht nachvollziehen können, der Journalist und Autor sammelt leidenschaftlich gern „alte… Weiterlesen Veröffentlicht unter GC Games Convention, Kulturelles, Lokales, Mediales, Wirtschaftliches"
