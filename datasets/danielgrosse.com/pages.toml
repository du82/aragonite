["https://www.danielgrosse.com/blog/89-0-rtl-statt-nachrichten-gibt-es-altrichten"]
title = "89.0 RTL: Statt Nachrichten gibt es „Altrichten“ – Große Worte"
description = "Eigentlich sollten Nachrichten den neuesten Stand wiedergeben. Gerade morgens, wenn man wissen will, was in der Nacht so passiert ist,"
full_description = "89.0 RTL: Statt Nachrichten gibt es „Altrichten“ Veröffentlicht am 27.02.201427.02.2014 von Daniel Große Eigentlich sollten Nachrichten den neuesten Stand wiedergeben. Gerade morgens, wenn man wissen will, was in der Nacht so passiert ist, wie es zu aktuellen Konflikten in der Welt weitergeht. Bei den meisten Radiosendern erfährt man auf dem Weg zur Arbeit oder im Büro auch das Neueste. Bei 89.0 RTL aber wird offenbar nach der Methode verfahren: Was gestern noch stimmte, kann ja heute nicht ganz falsch sein. Darum sendet die (meiner Meinung nach ohnehin ganz fürchterliche und gekünstelte Morningshow) wohl häufiger die Nachrichten vom Vorabend. Nicht ein mal, sondern um 6, um 7 und um 8 Uhr. Als wäre zwischendrin nichts passiert. Im Blog von Fair Radio steht die ganze Geschichte, die meiner Meinung nach nicht nur Hörertäuschung ist. In seiner Selbstdarstellung auf der Website der Medienanstalt Sachsen-Anhalt schreibt 89.0 RTL: „Außerdem liefert die RTL-Nachrichtenredaktion das Wichtigste für den Tag – was ist los im Sendegebiet, was passiert aktuell und worüber spricht die Welt.“ Ich finde, an dieser Stelle wird der Lizenzvertrag nicht eingehalten. Die Medienanstalt Sachsen-Anhalt war für eine Stellungnahme heute Vormittag leider nicht erreichbar. Und 89.0 RTL gibt ohnehin keine Auskünfte, wie die Kollegen von Fair Radio schreiben. Das ist ein klein wenig unterirdisch. Dieser Beitrag wurde unter Jugendliches, Mediales, Wirtschaftliches gespeichert. Speichere den Permanentlink."
year_published = 2014
