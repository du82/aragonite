full_description = "DHL Paketkasten: Läuft! Veröffentlicht am 9.10.20139.10.2013 von Daniel Große Kurzes Update zum DHL Paketkasten, den ich ja derzeit testen darf: Mittlerweile funktioniert alles prima. Die anfänglichen Schwierigkeiten, die nur darauf zurückzuführen waren, dass der Transponder noch nicht angelernt war, sind vergessen. Der DHL-Zusteller freut sich nun sicherlich, meine Päkchen und Pakete einfach in den Kasten legen zu können. Und ich freue mich, dass alles sehr gut klappt. Das heutige Päkchen war sogar schon zugestellt, noch bevor mich die entsprechende Mail und SMS erreichten, dass die Sendung heute zugestellt wird. Insofern: Läuft! Dieser Beitrag wurde unter Getestetes, Persönliches gespeichert und mit den Schlagworten paketkasten markiert. Speichere den Permanentlink."
