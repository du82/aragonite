["https://www.danielgrosse.com/blog/icebucketchallenge"]
title = "Die #icebucketchallenge und ich – Große Worte"
description = "Ich gebe es zu: Bis das Phänomen der Ice Bucket Challenge im Netz auftauchte, hatte ich von Krankheit ALS noch"
full_description = "Die #icebucketchallenge und ich Veröffentlicht am 26.08.201418.07.2019 von Daniel Große Ich gebe es zu: Bis das Phänomen der Ice Bucket Challenge im Netz auftauchte, hatte ich von der Krankheit ALS noch nichts gehört. Die Amyotrophe Lateralsklerose schädigt das motorische Nervensystem nachhaltig. Zum Schluss ist man sozusagen gefangen im eigenen Körper, kann sich nicht mehr bewegen und sprechen, während der Geist aber vollumfänglich arbeitet. Die Ursachen dieser fiesen Krankheit sind weitgehend unbekannt, die Behandlungsmethoden darum nicht sonderlich wirksam. Für die Forschung über die Krankheit wird Geld benötigt. Viel Geld, das die Pharmakonzerne nicht ausgeben wollen. Darum erfand unter anderem Corey Griffin die Ice Bucket Challenge. Nominierte dieser Herausforderung müssen sich mit Eiswasser übergießen. Oder, wenn sie den Mut dazu nicht haben, sollen sie an die ALS Association spenden. Zahlreiche Menschen haben in den vergangenen Tagen und Wochen beides getan: gespendet und dem Eiswasser getrotzt. Und ja, ich habe mit Absicht die Füße still gehalten. Mich nicht an der Nörgelei Mancher beteiligt, die meinen, der Hype sei doch schon vorbei. Ich war mit Absicht ruhig, damit niemand auf die Idee kommt, mich zu nominieren. Nun. Mein lieber Kollege und Freund Thomas Gigold konnte es nicht lassen. Aber passt schon. Wie er spende ich auch für die ALS-Ambulanz der Berliner Charité. Weil ich möchte, dass das Geld hier in Deutschland eingesetzt wird, da hier die Beteiligung der Krankenkassen und wie eingangs erklärt der Pharmakonzerne eher marginal sind. Meine 50 Euro gehen heute noch raus. Wie Ihr spenden könnt, erfahrt Ihr auf der Website der ALS-Ambulanz. Meine Nominierungen: 1) Die Schauspielerin Inez Bjørg David. Mit ihr hatte ich in den vergangenen Wochen beruflich zu tun. Inez kennt man nicht nur aus „Doc meets Dorf“ bei RTL oder den Männerherzen-Filmen. Nein, die Dänin setzt sich mit ihrem Laden Miwai auch dafür ein, dass die Welt jeden Tag ein bisschen besser wird. Inez, ich denke, das wird ein Klacks für Dich! :-* 2) Meine Kollegin Linda Baller beim TopMedia Verlag Leipzig. Ja, Linda, wir haben im Augenblick alle viel zu tun, ich weiß das. Aber es ist doch für die gute Sache. Bin gespannt! 3) Der Fotograf Sebastian Willnow aus Leipzig. Sebastian, Du sorgst auf Presseterminen immer wieder für Lacher. Ich würde so gern sehen, was Du aus dieser Herausforderung machst! Und jetzt viel Spaß. Ich hatte jedenfalls welchen. 😉 Dieser Beitrag wurde unter Erlebtes, Mediales gespeichert. Speichere den Permanentlink."
year_published = 2014
