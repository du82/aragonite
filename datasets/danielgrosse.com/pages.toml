full_description = "World Radio Day: Danke, Radio! Veröffentlicht am 13.02.201431.03.2018 von Daniel Große Auf 107 Radiostationen in Deutschland lief heute um 7:20 Uhr ein Spot. Anlässlich des UNESCO World Radio Day hat die Radiozentrale eine gemeinsame Programmaktion für die Radiosender in Deutschland initiiert und konzipiert. Zur reichweitenstärksten Radiozeit wendete sich „das Radio“ an seine Hörer, um ganz persönlich Danke zu sagen. Für die Freundschaft und das stets offene… Weiterlesen Veröffentlicht unter Mediales, Persönliches, Wirtschaftliches Schluchz Veröffentlicht am 1.02.20143.08.2022 von Daniel Große Manchmal blutet mein kleines Bloggerherz. Vorhin durch Zufall entdeckt: Beim Hallenwart der Halle 5 auf der Leipziger Messe hängt dieses Bild: Es zeigt die volle Halle 5 während der GC Games Convention 2006. Die Messe bildete den Auftakt für Thomas und mich, Messegesellschaften eine Online-Redaktion anzubieten. Mittlerweile ist das ein Geschäftsmodell, das sehr gut funktioniert… Weiterlesen Veröffentlicht unter Erlebtes, Persönliches, Sentimentales, Wirtschaftliches Fröhliche Weihnachten! Veröffentlicht am 24.12.201324.12.2013 von Daniel Große Ich wünsche allen Lesern meines kleinen Blogs fröhliche Weihnachten. Mögt Ihr in Besinnlichkeit feiern, möge die Familie Euch nicht gleich an Heiligabend auf den Nerv gehen und mögen all Eure Wünsche in Erfüllung gehen. Für uns werden dies die letzten Weihnachten „zu dritt“, bevor unsere Familie Ende Juni endlich wieder wächst. Familie ist doch das,… Weiterlesen Veröffentlicht unter Persönliches Die ICHICHICH-Show – mit mir Veröffentlicht am 19.12.201331.03.2018 von Daniel Große Die ICHICHICH-Show ist eine leicht verrückte, aber sehr sympathische und zu Unrecht viel zu unbekannte Radioshow. Jeden Freitag um 20 Uhr läuft sie auf den Bürgerradios Funkwerk Erfurt 96,2 und Weimar 106,6. Produziert wird sie in einem Studio in Leipzig Lindenau, moderiert von den leicht verrückten, aber sehr sympathischen Journalistenkollege