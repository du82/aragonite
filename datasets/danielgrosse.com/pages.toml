["https://www.danielgrosse.com/blog/grose-worte-fur-grose-trucks"]
title = "Große Worte für große Trucks – Große Worte"
description = "Lange keine journalistische Referenz gepostet. Aber jetzt wieder: Ende September fragte die EuroTransportMedia Verlags- und Veranstaltungs-GmbH aus Stuttgart bei mir"
full_description = "Große Worte für große Trucks Veröffentlicht am 6.12.20173.08.2022 von Daniel Große Lange keine journalistische Referenz gepostet. Aber jetzt wieder: Ende September fragte die EuroTransportMedia Verlags- und Veranstaltungs-GmbH aus Stuttgart bei mir an, ob ich einen Text und Fotos für das Magazin „Scania bewegt“ beisteuern könnte. Es ginge um die Spedition Proloxx aus Crimmitschau, die im Kundenmagazin des LKW-Herstellers porträtiert werden solle. Meine erste wirkliche Berührung mit den großen Fahrzeugen und der Speditionsbranche auf journalistischem Gebiet. Die Vor-Ort-Recherche inklusive Fotoerstellung begeisterte mich auf Anhieb, vor allem der freundschaftliche Umgang der Geschäftsführung mit dem Scania-Niederlassungsleiter, Regionaldirektor und dem Verkäufer überzeugte. Kein Wunder: Proloxx besitzt nun bereits den 100. Scania – und es sollen noch mehr folgen. Vielen Dank an Jana Bronsch-Chassard und Georg Weinand für die wunderbare Zusammenarbeit! Text und Fotos gibt es auch online zu sehen. Auf dem Titel und ab Seite 6. Dieser Beitrag wurde unter Mediales, Motorisiertes gespeichert. Speichere den Permanentlink."
year_published = 2017
