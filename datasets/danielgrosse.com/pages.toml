artig. Einen Wechsel mit Ansage gibt es von Energy Sachsen zu vermelden. Morgenfrau Nadine Kallenbach will wieder zurück ins Hallenser Funkhaus, aus dem sie vor gerade Mal drei… Weiterlesen Veröffentlicht unter Jugendliches, Kulturelles, Lokales, Mediales | 1 Kommentar"
