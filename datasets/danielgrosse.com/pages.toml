["https://www.danielgrosse.com/blog/sonne-palmen-audi-fahrn"]
title = "Sonne, Palmen, Audi fahr’n – Große Worte"
description = "Ja, das Leben als Blogger ist schon anstrengend. Mittags nach Mallorca fliegen, am Nachmittag den neuen A3 fahren, der erst"
full_description = "Sonne, Palmen, Audi fahr’n Veröffentlicht am 23.05.201231.03.2018 von Daniel Große Ja, das Leben als Blogger ist schon anstrengend. Mittags nach Mallorca fliegen, am Nachmittag den neuen A3 fahren, der erst ab dem Sommer ausgeliefert wird. Am Abend in einem nagelneuen 5-Sterne-Hotel wunderbar essen, nächtigen in einem Hotelzimmer so groß wie eine Zweiraumwohnung und Aufwachen mit Blick auf das ruhende Mittelmeer. Nach einem ausgiebigen Frühstück wieder A3 fahren und mit dem Flieger ab nach Hause. Im Ernst: Natürlich freut man sich über eine Einladung zu solch einem Event, das komplett von einem Autohersteller bezahlt wird. Dass bei so viel Komfort für den Journalisten bzw. Blogger zwangsläufig eine positive Bewertung des zu testenden Wagens herausspringt, ist ein Ammenmärchen. Ja, der Audi A3 macht Spaß und ist ein durch und durch perfektes und stilvolles Fahrzeug. Aber was will man auch groß erwarten bei einem Neuwagen der Oberklasse. Und genau das ist sein Problem: War der A3 bislang eher was für die Mittelschicht, die einen „besseren Golf“ fahren wollte, ist der neue A3 nun Luxus pur. Selbst wenn man alle technischen Spielereien und Extras weglässt, beginnt er bei 21.600 Euro. In der mittleren und höchsten Ausstattungsvariante sowie allem, was am Ende wirklich Spaß macht und die eigene Sicherheit sowie die der anderen Verkehrsteilnehmer steigert, ist man allerdings schnell beim Preis des Standard-A4. Ansonsten aber gibt es am A3 nichts zu meckern. Besonders die 1.8er Maschine mit 180 PS und der Automatik S tronic hat mich beeindruckt. Den gesamten Test gibt es drüben, im AMI-Blog. Foto: Jochen Hencke alias schneeengel Update: Kollege Thomas Gigold hat sich auch zum Thema geäußert. Ich stimme ihm uneingeschränkt zu. Dieser Beitrag wurde unter Alltägliches, Erlebtes, Motorisiertes gespeichert. Speichere den Permanentlink. axt sagt: 23.05.2012 um 18:56 Das ist aber keine Palme im Hintergrund, sondern vermutlich eine Pinie. Hat das Hotel nicht so geheißen? „Schattige Pinie“? 😀 Überhaupt vermisse ich paar schöne Landschaftsaufnahmen. Denen kannst Du ja einen extra Artikel widmen. 🙂"
year_published = 2012
clearnet = "https://www.danielgrosse.com/blog/sonne-palmen-audi-fahrn"
