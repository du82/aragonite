["https://www.danielgrosse.com/blog/endlich-digital-lesen"]
title = "Endlich digital lesen – Große Worte"
description = "Seit gefühlt mehreren Jahren empfehle ich meiner Frau einen eBook-Reader. Sie liest tendenziell mehr als und kauft stets dicke Bücher,"
full_description = "Endlich digital lesen Veröffentlicht am 13.03.201414.03.2014 von Daniel Große Seit gefühlt mehreren Jahren empfehle ich meiner Frau einen eBook-Reader. Sie liest tendenziell mehr als ich und kauft stets dicke Bücher, die dann irgendwann im Arbeitszimmer-Schrank verschwinden. Selbiger nimmt kaum noch Bücher auf, weshalb wir die ausgelesenen Exemplare regelmäßig bei momox verkaufen. Ein Kreislauf aus Bücherkauf und Bücherverkauf. „Unnütz“, sage ich dann immer und zeige ihr, dass es mit einem eBook-Reader besser ginge. Auf dem Tablet ist seit langem ein Kindle-Reader installiert, sage ich. Nö, sie wolle weiterhin das haptische Gefühl eines Buches haben und Seiten rascheln hören. Aber schau, Du kannst in den Urlaub viele Bücher mitnehmen, ohne sie schleppen zu müssen. Nö, das brauche sie nicht, sie wolle weiterhin im Buchladen stöbern und voller Vorfreude ein Buch zur Kasse tragen. Nun, was soll ich sagen – seit gestern ist hier ein Kindle Fire HD eingezogen. Bei dem Knallerpreis von 79 Euro, den Amazon am Sonntag und Montag für das Gerät bot, und dann auch noch einer zeitgleich kombinierbaren Aktion, konnte ich nicht mehr länger warten – und zu meinem Erstaunen sagte die Frau nun plötzlich auch, dass so ein Reader ja eine gute Idee sei. Ach. 🙂 Beim ersten Testen und Probelesen einiger Bücher merkte sie: Das ist ja fast wie ein richtiges Buch. Gestochen scharfe Schrift, das Display in einer angenehmen Helligkeit. Passt also. Nun überlege ich nur, wie ich „Bücher“ ab sofort schenke. So ein eBook verpackt sich ja schlecht… Dieser Beitrag wurde unter Getestetes, Kulturelles, Mediales, Persönliches, Wirtschaftliches gespeichert. Speichere den Permanentlink."
