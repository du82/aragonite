["https://www.danielgrosse.com"]
title = "Daniel Große, freier Journalist Leipzig"
full_description = "Schön, dass wir uns gefunden haben. Ich heiße Daniel Große und bin freier Journalist sowie Blogger in Leipzig. Ich schreibe für Zeitungen, Zeitschriften, Agenturen und Unternehmen. Ich liefere Inhalte für Ihren Social Media-Auftritt in Text, Bild und Bewegtbild. Mit dem Mediennetzwerk 4und20.net betreue ich Unternehmenskunden in der Presse- und Öffentlichkeitsarbeit. Außerdem berichte in, was in Taucha und der Umgebung aktuell los ist. Taucha kompakt ist das Online-Nachrichtenmagazin für die Parthestadt und erreicht mittlerweile über 90.000 Leser monatlich. Und für den Landkreis Nordsachsen berichtet ein kleines Team aktuell auf nordsachsen24.de. In meinem Blog Große Worte passiert seit einiger Zeit nicht mehr ganz so viel. Also sprechen Sie mich doch gern direkt an. Auch hier finden Sie mich:"
