description = "Schluchz, Gute Reise, Opa, R.I.P. Steve Jobs, Flashmob in Leipzig am historischen Etagenkarussell, Vom Abschied nehmen"
full_description = "Schluchz Veröffentlicht am 1.02.20143.08.2022 von Daniel Große Manchmal blutet mein kleines Bloggerherz. Vorhin durch Zufall entdeckt: Beim Hallenwart der Halle 5 auf der Leipziger Messe hängt dieses Bild: Es zeigt die volle Halle 5 während der GC Games Convention 2006. Die Messe bildete den Auftakt für Thomas und mich, Messegesellschaften eine Online-Redaktion anzubieten. Mittlerweile ist das ein Geschäftsmodell, das sehr gut funktioniert… Weiterlesen Veröffentlicht unter Erlebtes, Persönliches, Sentimentales, Wirtschaftliches Gute Reise, Opa Veröffentlicht am 28.06.201228.06.2012 von Daniel Große In dieser Nacht verstarb mein Opa väterlicherseits. Gute Reise. Und drück Papa von mir. Weiterlesen Veröffentlicht unter Persönliches, Sentimentales R.I.P. Steve Jobs Veröffentlicht am 6.10.201131.03.2018 von Daniel Große Niemand will sterben. Sogar Menschen, die in den Himmel wollen, möchten nicht sterben, um dorthin zu kommen. Und trotzdem: Der Tod ist ein Schicksal, das wir alle teilen. Und so soll es auch sein, denn der Tod ist die beste Erfindung des Lebens. Er ist der Motor des Wandels. Steve Jobs, Gründer von Apple und… Weiterlesen Veröffentlicht unter Sentimentales, Trauriges | 3 Kommentare Flashmob in Leipzig am historischen Etagenkarussell Veröffentlicht am 17.11.201018.07.2019 von Daniel Große Im vergangenen Jahr brannte das beliebte historische Etagenkarussell noch vor dem Weihnachtsmarkt ab. Die Brandursache ist ungeklärt, die Versicherung hat dem Besitzer noch keinen Cent überwiesen. Trotzdem investierte er 400.000 Euro in den Neuaufbau und zeigt in diesem Jahr sein Karussell in neuem Glanz. So viel Einsatz für die Leipziger und ihre Kinder muss belohnt… Weiterlesen Veröffentlicht unter Lokales, Sentimentales, Wirtschaftliches | 2 Kommentare Vom Abschied nehmen Veröffentlicht am 7.12.200931.03.2018 von Daniel Große Heinz Rudolf Kunze hat mal gesagt und gesungen „Abschied muss man üben“. Doch wie soll man etwas so endgültiges üben? Wie soll man etwas üben, das man nicht versteht? Oder akzeptieren will. Abschied kann man nicht üben. Man kann ihn nur hinnehmen. Und zurückdenken. An die schöne Zeit, die man gemeinsam hatte. Das hier, Paps,… Weiterlesen Veröffentlicht unter Sentimentales, Trauriges"
