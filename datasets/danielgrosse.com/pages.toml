["https://www.danielgrosse.com/blog/die-wunderbare-werbe-welt-des-lvz-boulevard"]
title = "Die wunderbare Werbe-Welt des LVZ Boulevard – Große Worte"
description = "Die Kolumne Boulevard der Leipziger Volkszeitung ist eine Rubrik, über die man trefflich streiten kann. Hier sammeln Kollegen seit vielen"
full_description = "Die wunderbare Werbe-Welt des LVZ Boulevard Veröffentlicht am 9.07.201422.06.2023 von Daniel Große Die Kolumne „Boulevard“ der Leipziger Volkszeitung ist eine Rubrik, über die man trefflich streiten kann. Hier sammeln die Kollegen seit vielen Jahren (anfänglich unter dem Namen „Leute in Leipzig“, später „BouL.E.vard“) kleine Zwischengeschichten, die sonst nirgends Platz finden. Meist sind dies Artikel zu Promis oder wenigstens Persönlichkeiten der Stadt. Das alles muss man nicht lesen, man verpasst nichts, wenn man die wenigen Zeilen langen Geschichten nicht kennt. Aber meist ist es ganz unterhaltsam, was dort steht. Auch ich habe in der Vergangenheit für diese Rubrik Artikel und Fotos geliefert. Buntes und leicht verdauliches für Zwischendurch halt, das niemandem weh tut. Über die Relevanz des Ganzen muss jeder selbst urteilen. Allerdings: Wenn gut gemeinter Sarkasmus auf Unternehmensdarstellungen und Produktvorstellungen treffen, geht das ganz leicht schief und in Richtung Schleichwerbung. Am 1. Juli veröffentlichte Redakteur Guido Schäfer, den Meisten vor allem durch seine lockeren und amüsanten Sportberichte ein Begriff, einen Artikel über einen Leipziger Physiotherapeuten. Dem Text zufolge ist dieser wohl eine Art Prominenter, weil er der Sohn einer Leipziger Fußball-Legende ist. Zudem ist der der „Medizinmann der Roten Bullen“, schreibt Schäfer. Der Physiotherapeut habe jetzt als „letzten Schrei“ eine „Sportsalbe kreiert und zur Marktreife gebracht“. Diese Salbe muss Guido Schäfer derart beeindruckt haben, dass er diese und seinen Erfinder derart huldigt, dass man sich Sorgen um die journalistische Sorgfalt machen muss: So nennt er das Produkt unverhohlen „Wundersalbe“, druckt freundlicherweise die Internetadresse dazu, behauptet, RB-Kapitän Daniel Frahn schwöre auf das „Stöffchen“. Auch wird ein Hobby-Fußballer zitiert, der von der Salbe angeblich „abgeht wie ein Zäpfchen“. Auch Schäfer hat die Salbe probiert – allerdings auf eine Art, die man sich nicht vorstellen möchte. Grafisch unterstützt wird der Text von einem Foto des Physiotherapeuten (mit eigener Praxis am Waldplatz) nebst einer Produktabbildung der Sportsalbe. Darunter ist zu lesen: „Bringt Lahme zum Gehen und zieht dahin, wo es weh tut…“ Ich habe Jan Emendörfer, Chefredakteur der Leipziger Volkszeitung, sowie Susanne Bömmel, Sprecherin des Madsack Verlages, darum gebeten, mir zu erklären, wie dieses Gesamtpaket aus Text und Fotos mit den Richtlinien 7.1 und 7.2 des Pressekodex zu vereinbaren ist. Eine entsprechende Anfrage sendete ich am 1. Juli, am 4. Juli und am heutigen 9. Juli an beide Adressaten. Geantwortet hatte mir bis zum heutigen Tag niemand. Darum schrieb ich Guido Schäfer direkt eine Mail und bat ihn um Stellungnahme. Er rief sogleich zurück. Sicher sei das nicht optimal gelaufen, allerdings sei das nun kein Grund, derart ein Fass aufzumachen und gleich dazu zu bloggen. Aber wenn ich unbedingt wolle… In seiner Rubrik kämen oft solche Geschichten zum Tragen, das dürfe man nicht allzu ernst nehmen, hier ginge es ja auch nicht um die großen Millionen, meinte Guido. Nein, darum nicht, sondern lediglich um so etwas wie journalistische Sorgfalt und eben den Pressekodex. Ob denn niemand mehr über das liest, was die Redakteure so schreiben, wollte ich wissen. Natürlich doch, aber er habe viele Freiheiten. Beispielsweise die, direkt auf eine Anfrage zu antworten. Da müsse man nicht gleich Madsack fragen, meinte er sinngemäß. Es mag ein Zufall sein, dass kurz danach Madsack-Sprecherin Susanne Bömmel bei mir anrief, um mir mitzuteilen, dass ich keine Antwort zu erwarten brauche. Prima. So kommunizieren also Medienhäuser im Jahre 2014. Was der Deutsche Presserat zu diesem Fall von Schleichwerbung sagt, wird sich zeigen. Dass die Sanktionen eher harmlos sind und den Verlagen nicht weh tun, darüber müssen wir nicht reden. Hier ging es einfach ums Prinzip. Das ursprünglich an dieser Stelle verlinkte PDF der Seite habe ich sicherheitshalber gelöscht, um keinen Urheberrechtsanspruch der LVZ herauszufordern. Dieser Beitrag wurde unter Lokales, Mediales, Werbliches gespeichert. Speichere den Permanentlink."
year_published = 2014
