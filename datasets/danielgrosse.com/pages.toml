["https://www.danielgrosse.com/blog/dinge-die-ein-tauchaer-nicht-sagt"]
title = "Dinge, die ein Tauchaer nicht sagt – Große Worte"
description = "In dieser Woche startete ich eine neue Facebook-Seite, die Eigenheiten der Tauchaer und Parthestadt satirisch aufs Korn nimmt. Unter dem"
full_description = "Dinge, die ein Tauchaer nicht sagt Veröffentlicht am 20.07.201322.06.2023 von Daniel Große In dieser Woche startete ich eine neue Facebook-Seite, die Eigenheiten der Tauchaer und der Parthestadt satirisch aufs Korn nimmt. Unter dem Namen „Dinge, die ein Tauchaer nicht sagt“ regt sie nicht nur zum Schmunzeln, sondern auch zur Diskussion an. In den ersten 23 Stunden seit Etablierung der Seite kamen bereits 100 Fans zusammen, nach vier Tagen steht der Zähler bei etwas über 300. Erste Themen sind der große und meist menschenleere Busbahnhof, die für viele Minuten geschlossenen Schranken und die Internetseite der Stadt, aber auch die Schwemme an Friseuren. Die Seite reiht sich ein in die Riege vieler anderer „Dinge“-Seiten, die es schon gibt. Ehrlich gesagt bin ich sehr überrascht über den schnellen Erfolg. Die zumeist junge Zielgruppe hat das Projekt sofort angenommen und beteiligt sich fleißig. Wenn das mal keine sinnvolle Ferienbeschäftigung ist… 🙂 Dem Tauchaer Jugendmagazin MS Times gefiel das Projekt gleich so gut, dass Chefredakteur Jonas Juckeland eine Kooperation vorschlug: Ab sofort wird jeden Sonntag ein kleines Voting veranstaltet, bei dem aus drei Sprüchen der beste gewählt werden kann. Selbiger wird dann im Jugendmagazin des Internet Taucha e.V. veröffentlicht. Dieser Beitrag wurde unter Jugendliches, Kulturelles, Lokales, Lustiges, Mediales gespeichert. Speichere den Permanentlink. TobiD sagt: 20.07.2013 um 15:14 Wow, ich bin echt beeindruckt von dem schnellen Erfolg der Facebook-Fanpage. Da sieht man mal wieder, dass lustige und unterhaltsame Dinge immer noch am besten im Social-Network ankommen. Finde die Idee auch selbst sehr klasse. So hat man eine Community, in der die Leute auch mal auf ironische Weise ihre Meinung sagen können. 🙂"
year_published = 2007
clearnet = "https://www.danielgrosse.com/blog/dinge-die-ein-tauchaer-nicht-sagt"
