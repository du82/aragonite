["https://www.danielgrosse.com/blog/marc-zeimetz-geht-bjoern-steigert-kommt"]
title = "Erneut neuer Geschäftsführer für Leipziger Volkszeitung – Große Worte"
description = "Lieber Herr Große, Nein. Marc Zeimetz ist und bleibt Geschäftsführer der LVZ. Viele herzliche Grüße nach Leipzig, Susanne Bömmel So"
full_description = "Erneut neuer Geschäftsführer für Leipziger Volkszeitung Veröffentlicht am 24.07.201428.12.2020 von Daniel Große Lieber Herr Große, Nein. Marc Zeimetz ist und bleibt Geschäftsführer der LVZ. Viele herzliche Grüße nach Leipzig, Susanne Bömmel So lautete die Antwort der Madsack-Sprecherin Susanne Bömmel am 18. Juni 2014 auf meine Frage, ob denn meine Informationen stimmen würden, dass Marc Zeimetz seinen Posten als Geschäftsführer der Leipziger Volkszeitung abgibt. Nun, etwas mehr als einen Monat später, lässt der Madsack-Konzern verlauten, dass es eben doch einen neuen Geschäftsführer für das schlingernde Schiff am Peterssteinweg geben wird, wenngleich Zeimetz auch weiterhin Geschäftsführer der Leipziger Verlags- und Druckereigesellschaft (LVDG) bleibt: Björn Steigert, derzeit Geschäftsführer der Sächsischen Zeitung wird zum 15. September 2014 als operativ verantwortlicher Geschäftsführer zur LVDG wechseln. Marc Zeimetz hingegen steigt bis spätestens zum Jahresende zum Finanzchef (CFO) der Madsack Mediengruppe auf, gehört damit also der Konzerngeschäftsführung an. Nötig wurde die konzerninterne Umbesetzung wohl, weil Sven Fischer, bisheriger CFO, Madsack zum Jahresende auf eigenen Wunsch verlässt. Mit Björn Steigert sieht sich Madsack bestens gerüstet, den Medienwandel auch weiterhin aktiv und erfolgreich zu gestalten. In einer persönlichen Mitteilung an die Mitarbeiter der LVZ mit der Überschrift „Planänderung“ erklärte Marc Zeimetz heute, dass er seit einem Jahr glücklicher Neu-Leipziger sei und sein persönlicher Lebensplan keine Veränderung vorsah. „Aber es kommt oft anders als man es geplant hat“, schreibt er und bedankt sich für die „exzellente und vertrauensvolle Zusammenarbeit in den letzten Monaten.“ Er bleibe weiterhin in der Geschäftsführung des LVDG, für das operative Geschäft bleibe dann aber keine Zeit mehr. In den nächsten Monaten wolle er die Geschäfte an Björn Steigert übergeben. Dieser Beitrag wurde unter Lokales, Mediales, Wirtschaftliches gespeichert. Speichere den Permanentlink."
year_published = 2014
