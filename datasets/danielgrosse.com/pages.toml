title = "Mediales – Große Worte"
description = "Große Worte für große Trucks, Mit James Horner stirbt ein Stück Filmseele, Presserat missbilligt Leipziger Volkszeitung, Die #icebucketchallenge und ich,"
full_description = "Große Worte für große Trucks Veröffentlicht am 6.12.20173.08.2022 von Daniel Große Lange keine journalistische Referenz gepostet. Aber jetzt wieder: Ende September fragte die EuroTransportMedia Verlags- und Veranstaltungs-GmbH aus Stuttgart bei mir an, ob ich einen Text und Fotos für das Magazin „Scania bewegt“ beisteuern könnte. Weiterlesen Veröffentlicht unter Mediales, Motorisiertes Mit James Horner stirbt ein Stück Filmseele Veröffentlicht am 23.06.2015 von Daniel Große Es vergeht beinahe kein Tag, an dem wir nicht in Facebook oder Twitter von dem Tod einer mehr oder weniger berühmten Persönlichkeit lesen. Fast schon im Vorbeigehen kommentieren wir „R.I.P.“, erinnern uns an diese oder jene Begebenheit, die uns im Leben mit der Person begleitete. Und Minuten später haben wir es auch schon wieder vergessen…. Weiterlesen Veröffentlicht unter Mediales, Musikalisches, Persönliches Presserat missbilligt Leipziger Volkszeitung Veröffentlicht am 21.12.201421.12.2014 von Daniel Große Auch eine humorvolle und saloppe Formulierung rechtfertigt keine werbliche Darstellung von Personen und Produkten. So könnte man die Entscheidung des Presserates zusammenfassen, die mir nun zuging. Am 9. Juli veröffentlichte ich hier einen Artikel, in dem ich mich über die „Wunderbare Werbe-Welt des LVZ Boulevard“ ausließ. Weiterlesen Veröffentlicht unter Lokales, Mediales Die #icebucketchallenge und ich Veröffentlicht am 26.08.201418.07.2019 von Daniel Große Ich gebe es zu: Bis das Phänomen der Ice Bucket Challenge im Netz auftauchte, hatte ich von der Krankheit ALS noch nichts gehört. Die Amyotrophe Lateralsklerose schädigt das motorische Nervensystem nachhaltig. Zum Schluss ist man sozusagen gefangen im eigenen Körper, kann sich nicht mehr bewegen und sprechen, während der Geist aber vollumfänglich arbeitet. Die Ursachen… Weiterlesen Veröffentlicht unter Erlebtes, Mediales | 2 Kommentare Erneut neuer Geschäftsführer für Leipziger Volkszeitung Veröffentlicht am 24.07.201428.12.2020 von Daniel Große Marc Zeimetz steigt auf in die Madsack-Konzerngeschäftsführung. Björn Steigert wechselt am 15. September 2014 von der Sächsischen Zeitung als neuer operativer Geschäftsführer zur Leipziger Volkszeitung. Weiterlesen Veröffentlicht unter Lokales, Mediales, Wirtschaftliches | 1 Kommentar"
