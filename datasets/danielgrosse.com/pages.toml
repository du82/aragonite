["https://www.danielgrosse.com/blog/zu-viel-hitze-in-der-mdr-hoerfunkzentrale"]
title = "Zu viel Hitze in der MDR-Hörfunkzentrale? – Große Worte"
description = "Aus der Reihe Wie man viel Interaktion auf seine Facebook-Seite bekommt, sich dabei aber völlig zum Ei macht sehen Sie"
full_description = "Zu viel Hitze in der MDR-Hörfunkzentrale? Veröffentlicht am 1.08.20132.08.2013 von Daniel Große Aus der Reihe „Wie man viel Interaktion auf seine Facebook-Seite bekommt, sich dabei aber völlig zum Ei macht“ sehen Sie heute: MDR JUMP. Gebührenfinanzierter Social-Media-Unsinn. Und die Zielgruppe macht fleißig mit. Herzlichen Glückwunsch. Hinweis: In der Überschrift hieß es irrtümlich erst „Funkhaus Halle“. Ich bitte den Fehler zu entschuldigen. Dieser Beitrag wurde unter Jugendliches, Mediales gespeichert. Speichere den Permanentlink. jan sagt: 2.08.2013 um 15:11 dafür bezahlt man doch gern seinen monatlichen rundfunkbeitrag. ich bin immer wieder fassungslos wie inhaltsleer sich mdr jump on air und online zeigt. aber wie daniel große schon geschrieben hat – der zielgruppe gefällts. aber dann soll die mdr jump auch nur alleine bezahlen! 🙂 Daniel Große sagt: 2.08.2013 um 15:13 gut, das ist natürlich quatsch. und eigentlich ärgere ich mich auch darüber, dass so ein unfug gemacht wird. das hat jump eigentlich nicht nötig. wer weiß, welcher mitarbeiter da im alleingang unterwegs war."
