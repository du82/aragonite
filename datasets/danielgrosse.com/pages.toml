["https://www.danielgrosse.com/blog/wer-hats-geschrieben"]
title = "Wer? – Große Worte"
description = """
Große Worte\t\t\t\t\t\t\t\t\t
\t\t\t

\t\t\tvon Daniel Große, freier Journalist Leipzig"""
full_description = "Wer? Über wen reden wir hier eigentlich? Ich heiße Daniel Große, bin Jahrgang 1976 und freier Journalist in Leipzig. Meine hauptsächlichen Arbeitsgebiete sind vor allem Artikel mit medialen Inhalten. So biete ich ein breites Themenspektrum und spezialisiere mich in letzter Zeit auf Texte zu Internet, Content Management, ECM, ERP, Viren, Spyware, Phishing sowie Wirtschaft, Jugend und Umwelt. Ich arbeite für Zeitungen, Zeitschriften, Nachrichtenagenturen, Presse- und PR-Agenturen sowie Radiosender in Text und Foto. Ende 2003 gründete ich mit einigen Freiberuflern das Mediennetzwerk 4und20.net – Medien & Kommunikation. Wir sind Journalisten, PR-Berater, Grafiker und Programmierer. Durch Verknüpfung unserer Leistungen können wir Kunden Komplettpakete anbieten, ohne auf einen fest angestellten Mitarbeiterstamm zurückgreifen zu müssen. Im Jahr 2006 starteten Thomas Gigold und ich das erste in Deutschland von einer Messegesellschaft unterstützte Messe-Weblog: das GC-Blog. Mittlerweile ist daraus BlogSolution geworden, eine Unternehmung, die sich vornehmlich auf Event-Blogs konzentriert, prinzipiell aber jedes Corporate Blog erstellen und redaktionell betreuen kann. Im April 2009 ging BlogSolution in die medienrauschen UG über, die Thomas Gigold gründete. Sämtliche Leistungen von BlogSolution werden nun von medienrauschen übernommen. Ich agiere als freier Mitarbeiter für Contenterstellung, Blogredaktion sowie Presse- und Marketingaufgaben."
year_published = 2017
clearnet = "https://www.danielgrosse.com/blog/wer-hats-geschrieben"
