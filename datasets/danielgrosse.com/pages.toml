["https://www.danielgrosse.com/blog/mit-james-horner-stirbt-ein-stuck-filmseele"]
title = "Mit James Horner stirbt ein Stück Filmseele – Große Worte"
description = "Es vergeht beinahe kein Tag, an dem wir nicht in Facebook oder Twitter von Tod einer mehr weniger berühmten Persönlichkeit"
full_description = "Mit James Horner stirbt ein Stück Filmseele Veröffentlicht am 23.06.2015 von Daniel Große Es vergeht beinahe kein Tag, an dem wir nicht in Facebook oder Twitter von dem Tod einer mehr oder weniger berühmten Persönlichkeit lesen. Fast schon im Vorbeigehen kommentieren wir „R.I.P.“, erinnern uns an diese oder jene Begebenheit, die uns im Leben mit der Person begleitete. Und Minuten später haben wir es auch schon wieder vergessen. Als ich heute Morgen las, dass James Horner mit seinem Privatflugzeug abgestürzt und dabei offenbar ums Leben kam (manche Medien meldeten es wie einen Fakt, andere sagen bislang nur, Horners Flugzeug sei abgestürzt), hinterließ dies bei mir allerdings eine Art Schockstarre. Nein, ich kenne James Horner nicht persönlich, ich hab ihn noch nie getroffen und auch sonst keine Verbindung zu ihm. Außer die Verbindung zu seiner Musik. Und die ist wahrlich fest. Ich kann mich noch sehr gut erinnern, wie ich als Jugendlicher mit Kopfhörern im Bett lag, und gefesselt war vom Soundtrack von „Aliens“. Wie ich Gänsehaut bekam von dem orchestralen Sound, der die düstere Welt des Planeten LV-426 direkt in meinen Gehörgang brachte. Wie ich erschrak, als auf Stille plötzlich ein schrilles Pfeifen folgte. Wie ich den Klang der Streicher mit den Händen dirigierte. Meine erste Begegnung mit James Horner. Eine ähnlich intensive Erfahrung gab es danach mit dem Soundtrack zu Titanic, der mich so faszinierte, dass ich den zweiten Teil des Soundtracks „Back to Titanic“ auch unbedingt haben musste. Für die Musik zu Titanic gewann James Horner zwei mal den Oscar. Getoppt hat das für mich eigentlich nur noch der Soundtrack zu Avatar. Das großartige „The Bioluminescence Of The Night“ bringt für mich die Faszination des Planeten Pandora auf beeindruckende Weise zu Gehör. Mit James Horner stirbt ein Stück Filmseele. Viele Filme, darunter auch Braveheart, Ab Beautiful Mind, Star Trek, Der Junge im gestreiften Pyjama oder The Amazing Spider-Man wären ohne seine Musik nur halb so viel Wert. Danke, James, für all das, was Du uns gegeben hast. Dieser Beitrag wurde unter Mediales, Musikalisches, Persönliches gespeichert. Speichere den Permanentlink."
year_published = 2015
clearnet = "https://www.danielgrosse.com/blog/mit-james-horner-stirbt-ein-stuck-filmseele"
