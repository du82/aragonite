["https://www.danielgrosse.com/blog/category/persoenliches"]
title = "Persönliches – Große Worte"
description = "Mit James Horner stirbt ein Stück Filmseele, Süßer Fratz: Der Little ADAM, Oskar., Endlich digital lesen, Frühlingsleichter Melodic-Pop"
full_description = "Mit James Horner stirbt ein Stück Filmseele Veröffentlicht am 23.06.2015 von Daniel Große Es vergeht beinahe kein Tag, an dem wir nicht in Facebook oder Twitter von dem Tod einer mehr oder weniger berühmten Persönlichkeit lesen. Fast schon im Vorbeigehen kommentieren wir „R.I.P.“, erinnern uns an diese oder jene Begebenheit, die uns im Leben mit der Person begleitete. Und Minuten später haben wir es auch schon wieder vergessen…. Weiterlesen Veröffentlicht unter Mediales, Musikalisches, Persönliches Süßer Fratz: Der Little ADAM Veröffentlicht am 16.09.201416.09.2014 von Daniel Große Als junger Vater – hust – okay, als Vater, der gerade noch mal Vater geworden ist, macht man die verrücktesten Dinge. Beispielsweise, dem noch nicht mal drei Monate alten Sprössling ein Auto kaufen. Weiterlesen Veröffentlicht unter Alltägliches, Motorisiertes, Persönliches Oskar. Veröffentlicht am 8.07.20148.07.2014 von Daniel Große Die Zeit rast – schon ewig nichts mehr gebloggt. Dabei passiert derzeit so viel. Wer mir auf Facebook folgt oder mit mir befreundet ist, weiß es bereits: Seit 28. Juni bin ich zum zweiten Mal Vater geworden. Unser Oskar bereitet uns und seiner großen Schwester viel Freude und bringt den Tages- und Nachtablauf ganz schön… Weiterlesen Veröffentlicht unter Persönliches Endlich digital lesen Veröffentlicht am 13.03.201414.03.2014 von Daniel Große Seit gefühlt mehreren Jahren empfehle ich meiner Frau einen eBook-Reader. Sie liest tendenziell mehr als ich und kauft stets dicke Bücher, die dann irgendwann im Arbeitszimmer-Schrank verschwinden. Selbiger nimmt kaum noch Bücher auf, weshalb wir die ausgelesenen Exemplare regelmäßig bei momox verkaufen. Ein Kreislauf aus Bücherkauf und Bücherverkauf. „Unnütz“, sage ich dann immer und zeige… Weiterlesen Veröffentlicht unter Getestetes, Kulturelles, Mediales, Persönliches, Wirtschaftliches Frühlingsleichter Melodic-Pop Veröffentlicht am 7.03.20147.03.2014 von Daniel Große Lange nichts mehr über Musik geschrieben. Was vielleicht daran liegt, dass ich niemandem meinen Musikgeschmack aufdrängen möchte. Der ist teilweise sehr strange, reicht vom 90er Trash-Dance über aktuelles Chart-Gesäusel bis hin zu Filmmusik. Über eine Künstlerin muss ich aber mal ein paar Worte verlieren. Die Dame heißt Anna F. Und hat mich sofort gefangen. Weiterlesen Veröffentlicht unter Mediales, Musikalisches, Persönliches"
