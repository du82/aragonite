full_description = "Biker und Musik beim Countrytreffen Veröffentlicht am 10.08.2009 von Daniel Große Taucha. Zum vierten Mal fand am Wochenende das Country-Fest und Biker-Treffen auf dem Schlosshof statt. Alleinveranstalter Rainer Klöpsch bot Countrymusik, eine große Ausfahrt für Motorradfahrer und erstmals einen Linedance-Workshop. Die Besucherzahlen waren im Vergleich zu den Vorjahren rückläufig. Weiterlesen Veröffentlicht unter Kulturelles, Lokales, Musikalisches, Wirtschaftliches Annemarie Eilfeld: Die pinke Lady Gaga Veröffentlicht am 5.08.200922.04.2010 von Daniel Große Nicht nur die GCO beschäftigte mich Ende Juli, auch bei Radio PSR war ich kurz, um Annemarie Eilfeld zu treffen. Der Artikel erschien am 30. Juli 2009 in der Leipziger Volkszeitung und wird hier nun nachgetragen, der Vollständigkeit halber. 🙂 Annemarie Eilfeld wurde bei der sechsten Staffel von „Deutschland sucht den Superstar“ zwar nur Dritte,… Weiterlesen Veröffentlicht unter Lokales, Mediales, Musikalisches | 1 Kommentar Zweiohrküken Veröffentlicht am 10.07.20095.07.2021 von Daniel Große Ich sage es sehr oft und bei jeder Gelegenheit: Ich bin verknallt in einen Film: Keinohrhasen. Ja, natürlich wegen Nora Tschirner, aber auch wegen Matthias Schweighöfer und Til Schweiger, von dem ich bis zu diesem Film nicht viel hielt. Dieser Film versprüht so viel Lebensgefühl, Ironie, Witz und Traurigkeit, wie es kaum ein Film schafft…. Weiterlesen Veröffentlicht unter Kulturelles, Mediales, Musikalisches, Sentimentales | 4 Kommentare Rocknacht Taucha begeistert hunderte Besucher Veröffentlicht am 29.06.200929.06.2009 von Daniel Große Taucha. Sie ist mittlerweile zu einer schönen Tradition geworden, die Tauchaer Rocknacht. Zum bereits siebten Mal unterhielten Live-Bands mit handgemachtem Rock die Besucher vor der urigen Kulisse des historischen Ritterguts. Besucher und Veranstalter zogen ein weitgehend positives Fazit. In diesem Jahr begann die Rocknacht bereits vormittags. Ab 9 Uhr standen junge Nachwuchsbands auf der Bühne,… Weiterlesen Veröffentlicht unter Erlebtes, Kulturelles, Lokales, Musikalisches | 3 Kommentare"
