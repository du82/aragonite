["https://www.danielgrosse.com/blog/duden-steht-nicht-im-duden"]
title = "Duden steht nicht im Duden – Große Worte"
description = "Etwa seit dem Jahre 750 nach Christus gibt es die deutsche Sprache. Um 1450 erfindet der Mainzer Drucker den Buchdruck"
full_description = "Duden steht nicht im Duden Veröffentlicht am 15.07.200918.07.2019 von Daniel Große Etwa seit dem Jahre 750 nach Christus gibt es die deutsche Sprache. Um 1450 erfindet der Mainzer Drucker den Buchdruck mit beweglichen Metalllettern und ermöglicht dadurch den massenhaften Druck. 1717 wird in Preußen die Schulpflicht eingeführt. 1722 stellt Hieronymus Freyer vier orthographische Leitprinzipien auf: Aussprache, Abstammung, Analogie und Schreibgebrauch. 1872 veröffentlicht Gymnasialdirektor Konrad Duden „Die deutsche Rechtschreibung.“ Diese (auszugsweisen) Stationen aus der Geschichte der deutschen Orthografie stehen im neuen Duden, der am 21. Juli in der 25. Auflage erscheint. Ich darf ihn, wie andere Pressekollegen, schon vorher haben und drin blättern. Rund 5000 neue Wörter wurden aufgenommen, darunter so markante wie „twittern“, „Abwrackprämie“ oder das beliebte „fremdschämen“. Besonders gelungen finde ich den Sonderteil „Sprache in Zahlen“. Dort erfährt man unter anderem, dass die bestimmten Artikel „der“, „die“ und „das“ die häufigsten Wörter in deutschsprachigen Texten sind. Oder auch, was das längste Wort im Dudenkorpus, einer verlagseigenen Datenbank ist. Mit 67 Buchstaben hat es das Wortungetüm Grundstücksverkehrsgenehmigungszuständigkeitsübertragungsverordnung auf Rang 1 geschafft. Nur ein Wort steht nicht im Duden: Das Wort Duden. Überhaupt haben es nur wenige Wörter mit „Dude…“ in den Duden geschafft: „dudeldumdei“, „Dudelei“, „Dudeler“, „Dudelfunk“, „dudeln“ und „Dudelsack“. Okay, „Wahrig“ steht auch nicht drin. 🙂 Die 25. Auflage des Duden steht wie gesagt ab 21. Juli in den Regalen der Bücherläden. Das 1216-seitige Buch und Korrektursoftware kosten im Paket 25 Euro. Leider arbeitet die Software nur mit Microsoft Office und Works. Wer das Buch gar nicht benötigt, kann auf die CD-ROM-Version für Windows, Mac und Linux zurückgreifen. Auch auf PDAs und Smartphones kann man nun bequem nachschlagen. Eine eigene iPhone-Software gibt es auch. Dieser Beitrag wurde unter Getestetes, Mediales gespeichert. Speichere den Permanentlink."
year_published = 2009
