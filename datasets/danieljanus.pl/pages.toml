full_description = "Ogden NashMasz – masz o czym rozmawiaćSą ludzie, i nie ma znaczenia, czy to biedacy, czy milionerzy,Którzy twierdzą, że coś jest najlepsze na świecie tylko dlatego, że do nich należy.Jeśli są, dajmy na to, właścicielami trzydziestoletniej syrenki, patrzą na sąsiada jak na menela w podartych łachach,Kiedy wsiada do nowego maybacha.Albo kiedy patrzą na dzieci znajomych, dostające się jedno po drugim na studia, gdy ich własne, choć ma dwadzieścia trzy lata, nie zdało jeszcze matury,Kręcą głową i sarkają, że do czego to podobne, żeby rodzice nie byli lepiej wykształceni od progenitury,A gdy im cieknie dach,To dlatego, że dachówki są zabytkowe, podobnie jak okiennice, drzwi i inne elementy budowlane składające się na ich gmach.Inni ludzie, niezależnie od tego, czy pochodzą z Trójmiasta, czy z Timoru Wschodniego,Twierdzą, że coś jest lepsze niż ich własność tylko dlatego, że należy do kogoś innego.Jeśli pogratulujesz im kilku złotych medali, które ich pers o błękitnej, jedwabistej sierści zdobył na wystawie kotów we Wrocławiu, obruszą się i spojrzą na ciebie z miną cierpiętniczą,Mówiąc, że sąsiad ma tak uroczego dachowca, że wszystkie te trofea się zupełnie nie liczą.Kupują paczkę Popularnych z przekonaniem graniczącym z pewnością, że gdzieś za tę samą cenę, albo i taniej, można dostać Marlboro,A na gali sylwestrowej w Paryżu spokoju nie daje im myśl, że znajomi bawią się lepiej przy sopockim molo.Tak, patrzą na własną krowę i konia z obrzydzeniem, a na konia i krowę sąsiada z zawiścią godną stu szatanów,Pragnąc, jeśli są mężami, by ich żona była jak Grażynka, a jeśli żonami — by ich mąż był jak Rysio z „Klanu”.Moim zdaniem porównania są pożałowania godne, nie pochwalam całej tej pogoni za lepszym ani samouwielbienia,A poza tym, najmilsi, uważam, że wspaniali jesteście tak wy i wasze, jak ja i moje mienia.← Do spisu tłumaczeń"
year_published = 2025
clearnet = "https://danieljanus.pl/translations/ogden-nash/possessions-9points/01-masz-masz.html"
