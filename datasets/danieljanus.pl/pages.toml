["https://danieljanus.pl/translations/les-murray/an-absolutely-ordinary-rainbow/01-najzwyczajniejsza-tecza.html"]
title = "DJ’s translations: null null – Najzwyczajniejsza tęcza"
full_description = "Les MurrayNajzwyczajniejsza tęczaKrążą plotki u Repina,w barze Lorenziniego szepczą do siebie stoliki,na Tattersalls podnoszą głowy zza arkuszy liczb,maklerom na giełdzie wypadają z rąk kawałki kredyi dżentelmeni z kromkami chleba w kieszeniach opuszczają Klub Grecki:Człowiek szlocha na Martin Place. Nie mogą go powstrzymać.Korek na George Street ciągnie się na pół mili,wyzuty z ruchu. Ludzie gadają w napięciui tłumy ciągną ze wszech stron. Biegają po zaułkach,głównych ulicach jeszcze kilka chwil temu, pokazują:Tam dalej płacze człowiek. Nikt go nie powstrzyma.Ten człowiek, do którego nikt się nie zbliża, po prostupłacze, i nie próbuje tego ukryć, płaczenie tak jak dziecko, nie jak wiatr, jak człowieki nie bije się w piersi, nie wrzeszczy, ani nawetnie łka głośno – a jednak godność jego płaczutrzyma nas na odległość od pustego miejsca, które wytwarzawokół siebie w blasku południa, w pentagramie smutku,a mundurowi w tłumie, którzy próbowaligo ująć, patrzą i zdumieni czują, jak ich własneumysły tęsknią do łez jak dzieci do tęczy.Powiedzą lata później, że to jakieś haloczy siła była wokół. Nie ma nic takiego.Powiedzą, że byli w szoku i byliby go powstrzymali,ale ich tam nie było. Najzagorzalsza męskość,najtwardszy chłodny dystans, najciętszy humor w nastrzęsie się z ciszy i płonie niespodzianymsądem pokoju. W przejściu krzyczy ktoś, ktosądził, że jest szczęśliwy. Tylko małe dziecii ci, co wyglądają jak z Raju, podchodzą,siadając u jego stóp wśród psów i gołębi.Niedorzeczność, mówi ktoś obok mnie, zakrywającusta dłonią, jak gdyby zwymiotował słowa –i widzę, jak świetlista kobieta drżywyciągając ręce, by przyjąć dar płaczu,jak wielu stojących za nią także go przyjmuje,i wielu płacze z czystej akceptacji, i więcejbroni się przed płaczem z lęku przed akceptacją,lecz temu płaczącemu mężczyźnie, jak ziemi,nie trzeba nic, ignoruje nas i wyrzucaz pomarszczonej twarzy i zwyczajnego ciałanie słowa, lecz żałobę, nie mowę, lecz smutek,twardy jak ziemia, zupełny, obecny jak morze –a gdy przestaje, rusza wśród nas zwykłym krokiemi ociera twarz z prostą godnością człowieka,który płakał, a teraz płacz swój już zakończył.Wymyka się wierzącym i spieszy w głąb Pitt Street.Z tomu „The Weatherboard Cathedral”, 1955← Do spisu tłumaczeń"
