["https://danieljanus.pl/translations/sondra-ball/the-villanelle/01-vilanella.html"]
title = "DJ’s translations: null null – Vilanella"
full_description = "Sondra BallVilanellaTa vilanella, muzyczna i słodka,jak blask odbity w delikatnym rymie,tańczy w uderzeń takt srebrnego dzwonka,a wdzięczna magia wypływa z jej środka.Jak srebro gongów nucących jej imięjest vilanella, muzyczna i słodka;czerpie energię czarów z blasku słonka,ze światłocieniem igrając na linie,tańcząc w uderzeń rytm srebrnego dzwonka.Nie wrzyna się jak głuchy stukot młotkaw cymbały, bliżej jest jej mandolinie —ta vilanella, roztańczona, słodka,jak przezroczysta, kruchutka osłonka,chłonąc blask lata, nim w jesieni zginie,tańczy w uderzeń takt srebrnego dzwonka.Miękko, swobodnie, płochliwie się błąka;jak strumień światła lejący się w zimieta vilanella, muzyczna i słodka,tańczy w uderzeń takt srebrnego dzwonka.← Do spisu tłumaczeń"
year_published = 2025
