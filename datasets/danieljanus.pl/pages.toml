["https://danieljanus.pl/translations/edwin-arlington-robinson/luke-havergal/02-luke-havergal.html"]
title = "DJ’s translations: null null – Luke Havergal"
full_description = "Edwin Arlington RobinsonLuke HavergalIdź ku zachodniej bramie, Luke’u Havergalu,Gdzie przylgnął karmazynem do wierzej metaluGąszcz gron winnych, i w zmierzchu czekaj, co się stanie.Tam liście będą szeptać o niej, bez niej, dla niej;Jak słowa w locie smagnie cię ich opadanie,Lecz idź; a gdy się wsłuchasz, zabrzmi zew jej żalu.Idź ku zachodniej bramie, Luke’u Havergalu —Luke’u Havergalu.Na wschodnim niebie słońce nie wstaje nad głową,Aby noc w twoich oczach rozświetlić burzową;Lecz tam, gdzie się posępne zachody gromadzą,Ciemność się skończy tylko pod ciemności władzą:Bóg zabija się każdym liściem wciąż na nowo,A piekło jest Edenu więcej niż połową.Na wschodnim niebie słońce nie wstaje nad głową —Nie wstaje nad głową.Oto z grobu wychodzę, by ci to powiedzieć,Wygasić pocałunek na twej skroni przedzie,Co tak oślepiającym żarem cię omroczył,Że tracisz z oczu drogę, którą musisz kroczyć.Tak, jeszcze jedna wąska ścieżka do niej wiedzie,I choć gorzka, lecz wiara nigdy z niej nie zwiedzie.Oto z grobu wychodzę, by ci to powiedzieć —By ci to powiedzieć.Oto zachodnia brama, Luke’u Havergalu,Oto karmazyn liści u wierzej metalu.Idź już, nie patrz, jak wiatr je na strzępy rozdziera,Nie wsłuchuj się w ich słowa szepczące „umieraj”,Nie czuj, jak cię wołają, nie przystawaj teraz,Lecz idź; a gdy uwierzysz, w głos jej się rozfaluj.Oto zachodnia brama, Luke’u Havergalu —Luke’u Havergalu.przełożył Daniel Janus← Do spisu tłumaczeń"
