["https://danieljanus.pl/translations/roger-waters/the-gunners-dream/01-sen-kanoniera.html"]
title = "DJ’s translations: null null – Sen kanoniera"
full_description = "Roger WatersSen kanonierawspomnień kłąbprzez mgłę chmurstrumieniem spływa na spotkanie ze mną w dół —lecz gdzieś w przestrzeni między niebem a małym skrawkiem obcych ziem —tam miałem sen,tak, miałem sen.żegnaj, Max,Mamo, pa...po nabożeństwie, w chłodzie listopadowego dnia,do samochodu kroczysz z nią, a pasemka jej włosów srebrzy szron,słyszysz bijący dzwon, na przypasaną zerkasz broń,i gdy spływają łzy na przepaskę, co jej zdobi skroń,ujmujesz jej dłoń i chwytasz za ten sen.miejsce, gdzie jestco jeść, gdzie spać,gdzie stary wiarus może na ulicy stać,gdzie możesz głośno mówić o wątpliwościach i obawach,i gdzie nie znika nikt, i żaden ciężki but wojskowy nie kopie w twoje drzwi,i gdzie spokojnie trwać możesz w wierze,że w wieże dwie samolot żaden nie wbije się,i gdzie nie trzeba martwić się o wikt,i nikt już nie zabija dzieci, nikt,nikt już nie zabija dzieci, nikt.noc w noc i wciąż, krążąc po umysłu dnie,ten sen w szaleństwo wpędza mnie______.na małym skrawku obcej ziemi kanonier dzisiaj śpi,już; stało sięi nie da się wymazać ostatnich scen —pamiętaj ten sen,pamiętaj.Z albumu „The Final Cut”, 1982← Do spisu tłumaczeń"
