["https://danieljanus.pl/translations/melissa-ginsburg/tigers/01-tygrysy.html"]
title = "DJ’s translations: null null – Tygrysy"
full_description = "Melissa GinsburgTygrysyErikowi Lemke (1979–2012)1.Koliber wlatuje w oknowyglądające jak niebo. Wszystko tuwygląda jak niebo. Niebo wygląda jak w tygrysie pasy.Takie chmury nazywajączymś. Znam kogoś,kto zna się na chmurach. Mogłabym znaleźćnazwę. Wszystko tuma jakąś nazwę.2.Koliber spadł na taras. Mój mąż go podniósł.– Jakie to było uczucie, trzymać go w dłoni?– Jak nic. Jakby był niczym.– Gdzie jest teraz?– Nie ma go.– Zdechł?– Nie zdechł. Odleciał. Zniknął i znowu zniknął.3.Opowiem ci dowcip. Koliber wleciał w okno…Opowiem ci jeszcze jeden dowcip. Zdrada,byliśmy kiedyś przyjaciółmi.4.W snach ptak ważywięcej, tak że czujesz go,kiedy go podnosisz. Więc gdyumiera, jest tak,jakby coś się naprawdę stało.To słowoowiniętewokół twojej dłoni i znakna drodze w pasy.Dmuchana gwiazdka na plastikowym patykuprzywiązana do znaku.Asfalt. Słup. Na naprężonej, pękatejgwieździezmarszczki. Wypchana.Lśni.Będzieprzyjęcie, tutaj, gdzieś niedaleko.Ptak nic nie waży nigdzie nie czeka.Niebo wygląda jak okno, przez które przelatuje.← Do spisu tłumaczeń"
year_published = 2025
