["https://danieljanus.pl/translations/edwin-arlington-robinson/how-annandale-went-out/01-jak-zgasl-annandale.html"]
title = "DJ’s translations: null null – Jak zgasł Annandale"
full_description = "Edwin Arlington RobinsonJak zgasł Annandale„Zwano go Annandale’em — a ja trwałem przy nim,By pomagać, słów szukać, troszczyć się obficie.Ja — lekarz, hipokryta, kłamca, pocieszyciel,Patrzyłem nań; a przykry widok jego czyniłWrażenie znacznie gorsze, niż czasy dawnymi:Konstrukcja, w której nic się nie dało uprościć,Wrak, oddzielony piekłem od ostateczności,Pozostał z Annandale’a; a ja byłem przy nim.Znałem zgliszcza, co kiedyś były jego ciałem:Złączcie tych dwoje w jedno, jeśli potraficie,Pamiętając, co we mnie plugawe i zgniłe,I postawcie się w moim miejscu, tam gdzie stałemZ taką małą maszynką, o tak . . . Już widzicie?Czy powiesilibyście mnie? Nie? — tak sądziłem.”Z tomu „The Town Down The River”, publ. 1910← Do spisu tłumaczeń"
