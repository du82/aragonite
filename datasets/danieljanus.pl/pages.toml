["http://danieljanus.pl/autosummarized-hn"]
title = "Autosummarized HN"
full_description = "Every day from 1 August 2022 to 21 January 2023, a script fetched the articles from Hacker News’ front page, summarized them with GPT-3 and displayed the results on this page. I always considered it as an experiment. I originally thought I’d run it for just a month – it ended up being almost six months, due to inertia and OpenAI lowering their prices. You can still access previous editions of Autosummarized HN. I intend to keep this archive available indefinitely. The source code is also still available. Another implementation of the same idea (still live as of 21 January 2023) is available here (source code)."
year_published = 2025
