["https://danielmiessler.com/blog/my-gaming-idea"]
title = "My Gaming Idea | Daniel Miessler"
description = "[ July 27, 2006 ] A long time ago (a couple of years) I considered going to market with a gaming idea. The idea was fairly simple, and it’s coming to frui"
full_description = 'A long time ago (a couple of years) I considered going to market with a gaming idea. The idea was fairly simple, and it’s coming to fruition in many ways already today. The idea was to create a generic virtual world that could have modules built on it — modules for various different kinds of gaming interface. Examples would be driving, FPS, hand-to-hand combat, knife-fighting, swimming (SCUBA), flying, dating, shopping, makeup, clothes, cars…the list goes on and on. So, at first glance this sounds exactly like a number of different projects out there right now. I think there’s a major difference though. My idea is to have different interfaces, i.e. different games, within this world. So it’s not like you just have these various elements in the world, but rather you see the world through this preferred perspective. There is a business model built right into it. Here’s how it’d go: People sign up for the base world — we’ll call it ALTAR (a play on ALTERnative). This interface is very basic. Basic looking objects, general physics, etc. When you do things in this world everything looks rather generic. When you drive a car it looks like … a generic 4-door sedan. The wheels are nondescript, no branding, etc. But when you pay for the "EA Drive 6 Module" (like an additional $.80 a month), you get a different view of cars when you interface with them. When you’re in the regular world you see them as generic, but when you are close to them, or are interacting with them in some way, you move into the module you’ve paid for. Now, all cars have branding, the proper paint for the year, the proper engine sounds, and even the handling when you’re driving it. So, the whole idea of the world is to substitute for the failing one that exists in reality. The one where most people are weak and powerless. So people will go to work just to pay their gaming subscription, and they’ll subscribe to the modules that they enjoy. The women will get all the latest clothes (the real clothes), the shoes, the makeup, trips to the salon, etc. Plus they can hike and spend time with friends online…whatever…only they’re doing it in a body that they love…'
year_published = 2025
