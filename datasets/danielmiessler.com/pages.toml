["https://danielmiessler.com/blog/personal-daemons-customization"]
title = "Personal Daemons and Customization | Daniel Miessler"
description = "I’ve been thinking and writing for years now about what I call Personal Daemons. These are sets of preferences, attributes, and interests that are “"
full_description = 'I’ve been thinking and writing for years now about what I call Personal Daemons. These are sets of preferences, attributes, and interests that are "broadcasted" to others everywhere you go. The key component of these daemons is that they interact constantly with other daemons that are physically near them, e.g. people, restaurants, homes, businesses, entertainment venues, etc. This interaction is done transparently on your behalf by the daemons themselves, and the interaction is managed by your personal assistant which controls when you are notified of certain things (as well as your security settings). Daemon information is compartmentalized into security groupings. It’s really all one daemon, but it appears as many. For example: Your public daemon broadcasts information that anyone can see; perhaps your name, and the fact that you like dogs. It also broadcasts other preference types, such as favorite coffee, and foods, and music types—but only to certain other types of daemon (restaurants, for example). Your public daemon is what interacts most with the public daemons of the people and places around you. Let’s look quickly at a particular person: Chris. Chris is a 21-year-old single guy who went to school for film and loves manga. He’s standing in line at a Starbucks in a small town outside of San Diego. The store’s daemon interacted with his daemon, and knew his most common order, the fact that he was a rewards member, his most frequented Starbucks, the fact that he’s eligible for a free pastry, etc. The store’s daemon told his daemon what was playing on the store’s sound system, and did matching for artists that Chris might be interested in. It also told his daemon that on Thursday there’ll be an open mic poetry reading in this branch. It also mentioned that the girl at the counter is named Julie. Chris’s personal assistant (his mobile device) then speaks into his ear: "Chris, you should ask Julie about the poetry even happening on Thursday." It made the decision to interrupt Chris because it knows he likes poetry as well.'
year_published = 2025
