["https://danielmiessler.com/blog/ai-founder-augmentation"]
title = "AI is Founder Augmentation | Daniel Miessler"
description = "SECURITY | AI | PURPOSE :: Building AI that upgrades humans."
full_description = "This is a flaw of capitalism, not automation, yet in the next couple years there will be a growing tendency to blame AI for the loss of human jobs. The strange truth is that the entire phenomenon of people having jobs that pay them money comes from one simple dynamic: There are some people who want to make things that don’t exist yet, and they are unable to make those things without external help. When either of those two things reduces, or goes to zero, so goes much of our current economy. It’s the drive to make things, and the fact that creators cannot do it alone. This is why there are hundreds of millions of people with jobs that pay them money to live. Think about that when you see people walking around buying things with money paid to them by employers. If that employer could do all the work themselves, they not only could-but they should-do exactly that. This is a much clearer way to think about AI with respect to human employment. Rather than thinking about reduction of employees, think instead of AI making the founder into a superhuman that can do the work of 10,000 employees herself. Dishwashers and electric lights are now just capabilities of homeowners, and so nobody is angry at them for not hiring teams of people to do those things manually That same thing is about to happen to knowledge work with AI, and then physical labor with AI powered robots. Founders will simply be able to do sales, marketing, design, accounting, project management, administration, and 1000 other tasks by themselves using AI agent-based services. It is hard to overstate how much of an impact this is going to have on society. The more enabled founders are, the more they can make, at higher quality, and at higher speed. But who exactly is buying all these new products? Weren’t we previously buying all these products with money that we earned from employers? In this world, there are far fewer employers, which means fewer employees, which means fewer wages and salaries. This is a Matrix-like moment for me, and if you think about it long enough, it will be for you as well. Look at the freeways, look at the people in the grocery store, look at all the people on all the TV shows you watch. They all survive, and the entire economy works, because founders can only do the work of one person."
year_published = 2025
