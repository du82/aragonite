["https://danielmiessler.com/p/creativity-friction-coefficient"]
title = "AI and the World's Most Important Economic Metric | Daniel Miessler"
description = "Introducing the Creativity Friction Coefficient, and how AI will help reduce it"
full_description = "I think we’ve been ignoring one of the most important economic measurements. Let’s call it the Creative Friction Coefficient (CFC), and (imperfectly) define it as: The Creativity Friction Coefficient (CFC) — The level of time, money, and support required to go from an idea to a functioning business with recurring income. In other words, it’s a measure of how hard it is to create a new product or service that you can turn into a business. That definition is a decent start, but let’s expand on it. I think we can break the friction into three main categories: Time: It’s nearly impossible to start a business if you are the sole caregiver to young children, or if you’re working multiple low-paying jobs. Or even if you have help raising the kids while you’re working a decent-paying job. Money: It tends to cost somewhere around $10K to $200K to start a business in the US. Merchandise, infrastructure, tools, staff, etc. And that’s assuming you have the money to stop working other jobs to pay bills while you work on the business. Support: Most people who start businesses have a peer group where it’s common and acceptable to do so. It’s very hard to dedicate time and money to a thing when nobody around you believes it’s possible. And of course you also need to be fairly smart, and have an idea, as well as have the grit to actually execute. But let’s just take these as givens for an additional meta-filter. So let me ask you this: what percentage of Americans (yes, this is a bit US-focused) do you think have all three of the main components today? How many people have the time freedom, plus many tens of thousands of dollars…and they’re surrounded by people who actually discuss starting a business as an option and would support their endeavor? If I’m somewhere close to right, that’s 99.9% of the US on the innovation sidelines. Think about how much creativity they have. Think about the ideas they had (and still have) that simply never got launched."
year_published = 2025
