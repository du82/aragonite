["https://danielmiessler.com/blog/apple-lifeos"]
title = "Apple’s LifeOS | Daniel Miessler"
description = "SECURITY | AI | PURPOSE :: Building AI that upgrades humans."
full_description = "I made a prediction the month before the iPhone came out that Apple’s approach would win in the phone market. Then I camped for that 2007 iPhone at an AT&T store in Tallahassee, FL., and I’ve also camped for every iPhone release since then. So I’m definitely a fanboy by my own standards, but with one (hopeful) exception. I am still analytical about the company and its goals, vision, and execution. I think their AI strategy has been dogshit, for example. Or at least as it relates to the consumer-facing stuff. Siri doesn’t feel better than it was when it came out. The entire HomeKit ecosystem is struggling because of that, and it bothers me. Anyway, what I wanted to talk about today is why I think Apple is winning. Not just with the iPhone but with its overall ecosystem. It’s not because they have more features, or that all their features are better. They don’t, and they aren’t. There are many features that Android has, or that Windows Phone had, that were super awesome. Using a high-quality ecosystem communicates the quality of the owner, both to others and to themselves Starting with #1, which is Vision, I believe Apple is slowly and meticulously building the operating system for life. LifeOS, as I call it. Note: I did work at Apple for a few years but nothing I’m talking about here or anywhere else comes from insider knowledge. Most importantly, when they add something new to the mix, like adding Mental Health and Mood tracking in iOS 17, it seamlessly drops into its place within the ecosystem. They’re also coming stronger for Video Conferencing with new Facetime features, although that’ll take a while to reach Zoom-like functionality or adoption. If you imagine tech in 10 or 20 years, I imagine it as a whole lot more invisible and a whole lot more personal. Your chosen operating system and your digital assistant will manage everything in your life. This is part of the ecosystem point, actually, but it deserves its own section. Apple builds features to be enjoyable to use, and they often are so enjoyable because they work well with everything else you already have."
year_published = 2025
