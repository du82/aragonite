["https://danielmiessler.com/blog/plan-career-around-problems"]
title = "Plan Your Career Around Problems | Daniel Miessler"
description = '''It's no longer safe to work in an "industry" without knowing what problems you're solving'''
full_description = 'I see a lot of people who want to work in cybersecurity. I said the same when I got started, but now I think this is the wrong way to frame things, especially because of AI. My thinking now is that working in an "industry" is too vague and unfocused to give you any stability in a world where AI can do most jobs. I think the only way to get stability in this future—or at least as much as possible—is to be very talented at working on really hard problems. Crucially, that requires that you can clearly articulate those problems, and describe how your approach and results are superior to alternatives. The past version of myself would’ve said I wanted to be a security expert and have a long, fruitful career in security. Well I don’t really know, but I really like Recon, Web Testing, Risk Assessment, Testing Methodology Optimization, OSINT, and stuff like that. And then my career would sort of accidentally fall into that direction, and I would hopefully become known for those things. That path worked for me over the last couple of decades, but I don’t think it would work for me again. Which is why I don’t recommend it. I think what people should say today, is that I am fascinated by all sorts of security problems, but my favorites include the Many Eyes problem within open source, the time delay in Attack Surface Management, and the problem of not knowing who is doing what in a world of nonhuman identities, or the problem of establishing trust in a world where anything could be deepfaked, i.e., how do you know if you’re actually interacting with a person you think you are interacting with? Nothing is more attractive to a hiring manager than someone who’s both competent and self-directed. These are still security. They’re still cyber. And in some ways it’s no different than where I started with my legacy narrative. But there is a crucial difference in that this doesn’t lead with "wanting to be in security", and then rattling off some potential, ambiguous interests.'
year_published = 2025
