["https://danielmiessler.com/blog/the-insane-reaction-to-renee-diresta-on-the-joe-rogan-podcast"]
title = "The Insane Reaction to Renée DiResta on the Joe Rogan Podcast | Daniel Miessler"
description = "I heard Renée DiResta on the Sam Harris podcast a while back, and was excited to learn that she just appeared on Joe Rogan as well. Her work is focused on misin"
full_description = "I heard Renée DiResta on the Sam Harris podcast a while back, and was excited to learn that she just appeared on Joe Rogan as well. Her work is focused on misinformation campaigns, and she works at a place that tries to combat the problem. Anyway, I was listening to her and Joe talking, and I somehow started reading some YouTube comments, which I took a screenshot of above. I’m completely blown away. I’ve been reading about misinformation campaigns, and specifically the efforts by the Russians, since 2015 or so, and she’s been focused on it full-time for even longer. I’ve also read several books on the topic. I also have a military background with some dabbling in intelligence work during that time. Every fiber of my being tells me that the misinformation threat from Russia is absolutely real, and the research that’s documented this fact is overwhelming. So that raises the question: why is almost every single comment on Joe Rogan’s podcast talking about Renée as if she’s the Clinton-Email-Antichrist? And why is it that every time I talk to my conservative friends about Russian influence, they downplay it massively and claim it’s fake news? Especially when they went out of their way to say not everything is Russian influence, there are real people just being idiots, etc. Their discussion was remarkably measured and cautious, actually. It in no way matched the commentary about it. One of the most powerful dialectic lessons I learned in the last 10 years was that people reject what they don’t want to accept the implications of. If liberals were shown evidence that concealed carry made places safe, they would reject that evidence because they wouldn’t want to see more guns. Conservatives deny climate change data because they don’t want climate change regulations pushed down from a bloated, untrustworthy government. Another option is that these comments are from a bunch of actual trolls as well, and are therefore not representative of his actual audience."
