["https://danielmiessler.com/about"]
title = "About | Daniel Miessler"
description = "SECURITY | AI | PURPOSE :: Building AI that upgrades humans."
full_description = '''I'll start by saying that if you've not tried to capture what you're about in some of "about me" page—you should try it. It's equal parts revealing and impossible. My name is Daniel Miessler (MEE-slur) and I'm an AI/Security researcher and entrepreneur based out of the San Francisco Bay Area. I started this site in 1999 as a platform for writing and archiving my own technical knowledge. Today it has over 3,000 essays, tutorials, articles, and other types of content, and it serves as my interim DAEMON before I have one officially. So that's a rough breakdown of how I think the world works. Here's a similar analysis of what I think is going on in the early 21st century. Then in late 2022, modern AI was born, and now our collective existential crisis is about to be compounded by the loss of millions of jobs. First from AI, and then from AI-powered robots that can do physical work as well. So what we're facing in 2025 and beyond is a world that's rapidly losing its two primary sources of meaning—religion, and work. Nobody can say what percentage of current and future problems this will cause or exacerbate, but I think it's very high. This is why I've chosen these issues as my primary TELOS problems. That being the backdrop, one of my most consistently enjoyable activities is building models of how things work—both explicitly and implicitly. Said differently, I enjoy finding patterns in how people pursue meaning and happiness, constructing models for how said meaning works, and then creating, discussing, and sharing possible frameworks for improving it. Human 3.0 is what I'm calling the replacement for this dreary (and quickly dying) existence. It refers to both the state we're trying to get to as well as the actions we need to take to get there. Political debates are 98% heat rather than light. One or both sides end up getting triggered down an emotional path and it ceases being a discussion. I find this Ideal World method to be extremely effective at bypassing all of that and uncovering real values, agreements, and disagreements.'''
year_published = 2025
