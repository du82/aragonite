["https://danielmiessler.com/blog/we-have-enough-ai-for-agi"]
title = "We have Enough AI for AGI | Daniel Miessler"
description = "SECURITY | AI | PURPOSE :: Building AI that upgrades humans."
full_description = "I argued that Technical AGI is the real deal (AI that can generalize it's knowledge and learning), and Functional AGI is an emulation that's good enough to replace a human knowledge worker. I think our best AIs in early 2025 are already smart enough to do the job. They just haven't been properly orchestrated into unified systems that can emulate general intelligence. Yet. People keep waiting for the big one—some new AI model that will conclusively give us AGI, ASI, or whatever acronym we are currently chasing. But I've always thought of AGI as a system, not a model. A set of capabilities, not a single piece of tech. I'm simply arguing that #2 does not require #1 anymore. A combination of o3, deepmind, and hell—even gpt-4—if built properly into a cohesive system of coordinated agents—will be able to replicate or exceed human performance on a wide range of knowledge work tasks. Orchestrated agent systems, turned into products, and built on 2024-level AI, can get us to Functional AGI. And I'm predicting that happens by late 2025 or sometime in 2026 (and no later than 2028). Improvements in the fluid intelligence of the models themselves will continue, of course, but who knows how quickly. And each time that happens, reliance on the orchestration will decrease."
year_published = 2025
