["https://danielmiessler.com/p/ais-next-big-thing-is-digital-assistants"]
title = "AI’s Next Big Thing is Digital Assistants | Daniel Miessler"
description = "Most people think the big disruption coming from AI will be chat interfaces. Basically, ChatGPT for all the things. But that’s not the thing. The biggest"
full_description = "Most people think the big disruption coming from AI will be chat interfaces. Basically, ChatGPT for all the things. But that’s not the thing. The biggest thing—actually the second-biggest behind SPQA—will be Digital Assistants. What are Digital Assistants? Imagine Siri, but powered by ChatGPT and with access to all of the world’s companies through their APIs. So when you want something to eat, it can find you the perfect thing by querying all the local restaurant APIs. Or when you want something from Amazon, you don’t have to find an interface and go browsing: you instead tell it what you want and it shows you options you can choose from. When you select, it places the order for you. Sounds cool, but not much different from today, right? There’s about to be a huge difference, and that difference will come from context. Specifically, your Digital Assistant (DA) will know almost everything about you. Not just a few things like your name and your favorite color. No. It’ll know everything. We’re talking about: When you combine this kind of data with LLMs you can do some unbelievable stuff. Some of these will be separate apps or personalities that become possible, separate from the Digital Assistant itself, but they all play off of having deep context. Function like a romantic partner if you’re lonely and want a new boyfriend/girlfriend to flirt with Imagine having your own digital companion. Your own Tony Robbins. Your own Jarvis. Your own…avatar that represents you in the world. With you all the time. The key thing about the combination of context (your information) plus an LLM (like GPT-4) is that LLMs thrive on context. Something like GPT-4 is an expert on human psychology and relationships, but it can’t tell you what’s wrong if you don’t describe what’s going on. Your DA will be able to answer relationship questions with remarkable accuracy because it’s plugging your actual situation into the oracle. It’s asking the whole of human romantic and human behavior knowledge the best course of action based on your actual background, your previous partners, your current situation, etc."
year_published = 2025
