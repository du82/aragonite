["https://danielmiessler.com/p/ai-predictable-path-7-components-2024"]
title = "AI's Predictable Path | Daniel Miessler"
description = "Technological progress isn't predictable, but the human desires that drive it are"
full_description = "But despite me knowing that, I’m about to tell you—with a lot of confidence—some of the major developments that are about to happen in AI. The trick, however, is that I’m going to do this stochastically, and my promise to you is that once you hear them and let them sit for a bit, they’ll be as obvious to you as they are to me. It’s almost impossible to predict exactly what a given tech will look like, who will make it, or when it’ll happen. That $37 word I used—stochastic—is one of my favorites. It basically means random at any given point, but with a predictable destination. My favorite example of something stochastic is a drunk guy stumbling home from the bar. Every step he takes might as well be a pseudo-random generator. You could use all the supercomputers on Earth and not be able to predict exactly where he’ll step. But if you zoom out and add time, he’ll probably end up at home. The main thing I’m trying to convince you of is that understanding where tech is going doesn’t come from understanding tech at all. Tech isn’t predictable. We can predict the drunk person’s destination because we know they’re going home. So that leaves the question—what are humans stumbling towards when it comes to tech? Of course, if you’re one of the lucky among us, you might also value some higher pursuits, such as exploring the world around us, making a positive impact on the world, and generally helping others. But honestly, I think we can bucket that into thriving and/or connect—depending on the person. Anyway, the exact buckets don’t matter that much. The point is that most of our lives involve consciously and subconsciously looking for better ways to do these three things. And I believe this is all you need to predict where tech is going. So, with all that throat clearing out of the way, here’s what I see coming in the world of AI. Sidenote: I captured a number of these in my essay-turned-book The Real Internet of Things, in 2016. I wish I could recommend it strongly, but the only thing it’s really good for is showing that I’ve been thinking about this for a long time. Worth a read if you’re into a 2016 view of these same concepts."
year_published = 2025
