["https://danielmiessler.com/blog/my-politics"]
title = "How I Think About Politics | Daniel Miessler"
description = "SECURITY | AI | PURPOSE :: Building AI that upgrades humans."
full_description = "I want to say a few things about what’s happening right now in politics. I especially want to do so because I’ve supported Elon and Andreessen and similar “centrist” types in the past—and continue to do so on certain topics. I want to explain how and why that is, which turns out requires an overview of how I see things more broadly. In a phrase, I am a Star Trek (Next Generation) Liberal, and I would say the following are the tenets of my political / life philosophy: As such, I believe that taxes and social programs are incredibly important to overcome whatever causes the lack of equal opportunity. I believe the rich are lucky, and the super-rich are super-lucky. Do they usually have good work ethics and self-disciple? Lots of talent and grit? Sure. But those come from luck as well. Good genes, good parenting, good schools, good environment, and/or a mindset bestowed onto them that makes them strive. Those are luxuries granted them by chance, and they shouldn't be. They’re luxuries every human should have. Most importantly, you can’t look at someone who doesn't have them—due to who their parents were, a history of discrimination or oppression—and judge them the same. It’s society’s responsibility—that is, our responsibility—to give everyone the best possible starting parameters we can. When we see places where that's not the case, we have to use science, curiosity, and compassion to make adjustments to society that fix those issues. Believing this is the core of what I believe makes someone Liberal, and it’s why I will never stop being one. Aside from core beliefs, I have another way of capturing one's politics without talking about politics at all—and that is to describe the world you want to live in. I want to live in a multi-racial, multi-ethnic, multi-cultural, and highly individualistic society that values and supports everyone becoming the best version of themselves. It's largely the same as what I put in my tenets above, but it's a nice shortcut to just describe, or refer to, the type of world you wish existed."
year_published = 2025
