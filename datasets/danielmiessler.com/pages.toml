["https://danielmiessler.com/projects"]
title = "Projects | Daniel Miessler"
description = "SECURITY | AI | PURPOSE :: Building AI that upgrades humans."
full_description = "This is where I keep track of my active endeavors. Nothing fancy, just a list with a quick overview and a link to learn more. Just like with /ideas and /predictions, the main purpose here is to encourage others into making a similar page of their own. Human 3.0 is a framework for helping humans get ready for a world where AI has disrupted traditional corporate work. It involves becoming an expressive, full-spectrum human who is constantly learning, creating, and interacting with others. Telos is a concept and structure for managing contextual information for things we care about, e.g., our personal lives, our family, an organization we're running, a team, a department, a company, or whatever. The spiritual format for this is a single text document, known as a Telos File, but the format isn't as important as the concept of clear, deliberate capture of the various components. Key among those components are mission, goals, metrics, challenges, risks, ideas, team members, a journal, and many other sections. There is too much content out there, and it's hard to know if it's worth your time before you actually waste your time on it. What does that mean? The purpose of the project is to make the things that matter to humans more transparent, discussable, and ultimately—fixable. Daemon is the API-ification system for people, objects, and organizations. It's the technology component that actually presents what an entity is about to the outside world. Imagine a given Daemon having /preferences, /ideas, /resume, /books, etc., if it's for a person, and /menu, /capacity, and /staff, if it's for a restaurant. Beacon is essentially an application / interface for processing activity being broadcasted by someone. So imagine all the books they're reading, the movies they're enjoying, mentions about their new favorite coffee shop, or favorite coffee recipe, etc. It's essentially an activity feed for someone, which is automatically created as part of their Daemon, that allows me to subscribe to them as a source of connection, inspiration, etc."
