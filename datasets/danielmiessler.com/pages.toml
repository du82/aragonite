["https://danielmiessler.com/p/ai-becoming-reading"]
title = "AI is Already Becoming Like Reading | Daniel Miessler"
description = "AI is already becoming just as uninteresting as books, and that's a problem"
full_description = "Meaning—the masses are starting to see it as just another tech phase, while the highly ambitious are working to integrate it into every part of their lives. Rich and successful people have told us over and over that there’s a secret to their abilities. Voracious book consumption. Like a book a week in many cases. 1 And those are largely high-quality non-fiction books about science, business, productivity, and other topics that help one improve their lot in life—not just the fun stuff. Successful people have told us for years that their secret is reading, but most people don’t listen. Going back to my framing piece, I talked about how I generally meet two groups of people in the Bay Area. Group 1 is highly depressed, inactive, unhealthy, and they see the world as this evil and hostile place. They also don’t generally read biographies, business books, science books, productivity books, or anything else oriented around motivation, self-discipline, innovation, positivity, and progress. The other group that I meet is the exact opposite. They’re reading constantly! About how to be smarter. Healthier. More productive. How to start businesses. How to be more disciplined. And they see the world as a fundamentally positive place full of potential. The masses are starting to ignore the benefits of AI and go back to normal. While the highly-ambitious are constantly reading and are using AI for absolutely everything. If you thought the gap was big between readers and non-readers, wait until you see the gap between AI-augmented readers and everyone else. But that’s not what AI haters will say, or people who discount reading. They’ll talk about how flawed AI is. Or how it’s all hype. Or about how most books have flaws. Or most experts have been proven to be biased. Or some random narrative that convinces them to continue doing nothing. The unfortunate punchline of all this, and why this makes me so angry, is that Group 2 will end up with everything. It’s not a mystery how the hyper-sucessful get that way. There’s a blueprint that most anyone can follow."
