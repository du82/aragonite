["https://danielmiessler.com/p/weve-been-thinking-about-ai-all-wrong"]
title = "We've Been Thinking About AI All Wrong | Daniel Miessler"
description = "AI is just a way to execute Intelligence Tasks that only humans can (could) do"
full_description = 'When I tell people that AI going to separate people into have’s and have-nots, or multiply our global productivity by trillions of dollars, most don’t believe me. I realize now why that is. It’s because most people don’t have the right mental model for thinking about AI. When most people think AI they think image generation or chatbots. And understandably so—since those were the first applications of what’s now called GenAI. Great question. An Intelligence Pipeline is a series of Intelligence Tasks that result in a useful output. And Intelligence Tasks are functions that can only be done using human intelligence. Before we get into these, let’s highlight the point by doing something crazy. Let’s completely abandon the word "AI". It’s a silly word, and it means 100 different things depending on who you ask. So imagine a person—let’s call them Chris—who works in a cube with a computer. Chris has a coffee next to him, and a small plant. And a picture of his girlfriend and his dog on the cube wall. Chris works at a company called CutePup. CutePup finds pictures of cute dogs and puts them on the CutePup website. Chis is a member of a Process Team that does one part of the company workflow. Here’s the whole process. Chris is part of the Process 1 team, so his job is to determine whether a picture is a dog or not. Here’s what he sees on his screen all day: Carol sits next to Chris. She works in Process 2. She only gets photos that Process 1 has determined are dogs, and she has a screen that asks her if the dog is cute or not. Well, because they can’t. You can’t ask Python or C++ if something is a dog or not. Or if that dog is cute. That’s three different tasks that require human intelligence. That’s an Intelligence Pipeline, and each node in the Pipeline is an Intelligence Task. ClaimRight is an insurance company that pays people out if their products wear out before they’re supposed to. It’s for all sorts of products, like scooters, tents, baby strollers, etc.'
year_published = 2025
