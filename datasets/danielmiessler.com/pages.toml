["https://danielmiessler.com/blog/spqa-ai-architecture-replace-existing-software"]
title = "SPQA: The AI-based Architecture That’ll Replace Most Existing Software | Daniel Miessler"
description = "March 10, 2023 AI is going to do a lot of interesting things in the coming months and years, thanks to the detonations following GPTs. But one of the most impor"
full_description = 'AI is going to do a lot of interesting things in the coming months and years, thanks to the detonations following GPTs. But one of the most important changes will be the replacement of our existing software. We used to adapt our businesses to the limitations of the software. In this model the software will adapt to how we do business. AI-based applications will be completely different than those we have today. The new architecture will be a far more elegant, four-component structure based around GPTs: State, Policy, Questions, and Action. Fundamentally it’s a transition from something like a Circuit-based architecture to an Understanding-based architecture. Our current software is Circuit-based, meaning the applications have explicit and rigid structures like the etchings in a circuit board. Inputs and outputs must be explicitly created, routed, and maintained. Any deviation from that structure results in errors, and adding new functionality requires linear effort on the part of the organization’s developers. New software will be Understanding-based. These applications will have nearly unlimited input because they’re based on natural language sent to a system that actually understands what you’re asking. Adding new functionality will be as simple as asking different questions and/or giving different commands. There are many who don’t see what GPTs are doing as actual "understanding", but I think I can convince most holdouts in less than 60 seconds. Ready? Go. Intelligence is something like, "The collection, analysis, and sharing of information on the enemy to enable superior decision-making. So, can GPTs do this? Let’s respond with an example. Let’s see if they understand concepts like Star Wars and Forbidden Love and Shakespeare enough to write the following poem? That’s a Shakespearean poem, about Forbidden Love, in the Star Wars universe, between two Siblings. And it’s applied to a completely new situation/context that I just made up. Notice that I didn’t even mention Star Wars or Forbidden Love in the prompt! It understood the meanings of "Luke and Leia", and "Love", and it inferred that it was forbidden because it knows siblings aren’t supposed to feel that way about each other.'
year_published = 2025
