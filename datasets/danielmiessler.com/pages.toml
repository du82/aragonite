["https://danielmiessler.com/blog/how-my-projects-fit-together"]
title = "How My Projects Fit Together | Daniel Miessler"
description = "SECURITY | AI | PURPOSE :: Building AI that upgrades humans."
full_description = 'When people look at the various projects I’ve put out over the last year, they often ask which is the main one, or if they’re all related. And if so—how? So I see you doing Fabric, and then Substrate, and now you’re on about some thing called Human 3.0. And what’s this Telos thing? I like starting every conversation about solutions with a clear description of the Problems they’re meant to solve. Here are the Problems that all my life’s work—including all the projects above—is based around (WP = World Problem): WP1: Humans are suffering from a lack of purpose and meaning in their lives, which is causing mental health and societal problems. WP2: Humans do not understand—and are not prepared for—the sophistication and speed of introduction of AI into our society, which will cause major work disruptions and exacerbate our lack of purpose. WP3: Humans are not trained to become full-spectrum people, but rather to become economically useful to a materialistic and transactional economy. There are two exceptions, however, that are purely in my home space of Information Security, which I still absolutely love and will never really move away from. I see AI as containing security, so I will continue doing security projects, assessments, consulting, advising, and thinking. It’ll just likely be accompanied by a regular question of "How can I turn this into a (AI-enhanced) platform?". Here are the two main security projects I’m currently working on and will continue (along with 1-2 security assessments per year). Basically, I will always be doing Information Security. It’s in my DNA and how I think about the world. And interestingly enough, security is actually Latin—meaning se (without), and cura (worry), so it’s actually very much part of my overall mission now, i.e.,: helping people can become their best selves. Anyway, those two security projects are in my two favorite sub-fields in InfoSec (Attack Surface Management and Program Management), and I will continue maintaining and upgrading them. But I will mostly be hacking on and improving them technically while people I hire manage them from a business standpoint.'
year_published = 2025
