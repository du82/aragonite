["https://danielmiessler.com/blog/ai-state-management"]
title = "AI's Ultimate Use Case: Transition from Current to Desired State | Daniel Miessler"
description = "SECURITY | AI | PURPOSE :: Building AI that upgrades humans."
full_description = '''When most people think of AI's potential to help humanity in 10, 100, or 1,000 years, they think much too small. They think about what it does today, and then just imagine "more of that." Like AI agents providing more employees, or tutors, or companions. The best use case I've thought of so far is something far more general. It's a pattern for solving problems generally, as opposed to just a set of one-off solutions. One way to characterize the universal challenge for anything alive is how to go from its current situation to its desired situation. This applies to finances, employment, starting a business, relationships, raising children, health, and so on. You can imagine this as the eternal problem for anything with goals. In other words, one end-tier capability for any intelligence—human or otherwise—is the ability to turn any problem into a current-to-desired-state transition problem—at any scale. This requires extraordinary understanding of how things work and significant intelligence, but what it needs most is what scientists call working memory. This is like the size of the space that a given intelligence can operate on at any given time. It needs to hold all these things in its mind at once and then apply its intelligence, creativity, etc. These current and desired states will be summarized, compressed, and otherwise efficiently minified, but they will still be vast, so working memory (context size) matters a lot. One of the primary use cases for this model of problem solving comes down to the most common questions ever. You ask these questions when you're looking for a life partner, when you're trying to hire employees, trying to raise a child, and a thousand other things. If you squint your eyes a bit, you'll be able to see that even these types of questions are just another way to think about state transition. While we are asking technically different questions, about different situations, and at different times, they can all be reframed as: A State Managing AI will then model a dozen or a billion futures where you did this vs. that, and then advise you which one to choose.'''
year_published = 2025
