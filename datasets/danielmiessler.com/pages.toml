["https://danielmiessler.com/blog/fast-vs-slow-ai"]
title = "Fast vs. Slow AI | Daniel Miessler"
description = "SECURITY | AI | PURPOSE :: Building AI that upgrades humans."
full_description = "Having used hundreds (and built dozens) of AI applications since late 2022, I've come to realize something crucial about good and bad use cases. Or, to phrase it as a question: My first inclination was full speed ahead. Consume everything. Summarize everything. Blast away, basically. Why? Because I could. Because it wasn't possible before. But a few months later I realized there was a big problem with this that I heard captured best by Van Jones—in a completely different context—like 10 years ago. This weights analogy is powerful, and if I tried to encapsulate it (without AI), I'd say the concept is: I'm still grappling with the ultimate takeaway here, but I think it links deeply to meaning itself. Meaning and suffering are closely tied to one another. With weights it's literally pain—via the tearing of muscle. That's the difficult work that's required to grow. I think learning—and maybe even truly experiencing—is far more similar to muscle teardown than many realized. Certainly than I realized. We need to be careful not to remove that slow, deliberate, and yes—painful—work from our important activities just because we can. The painful work might actually be the best part. For me this means switching from using AI to consume everything, to instead using it to help me find the best stuff. And then switching to Slow Mode for consumption and processing."
year_published = 2025
