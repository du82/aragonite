["https://danielmiessler.com/p/what-im-doing-how-its-going"]
title = "What I'm Doing and How It's Going | Daniel Miessler"
description = "SECURITY | AI | PURPOSE :: Building AI that upgrades humans."
full_description = 'Lots of people have been asking what the hell I’m doing. Like do I work somewhere? What do I actually do all day? I believe that the time for being identified by—and tied to—corporate jobs is passing, and it’s time to transition to what comes next My most urgent but least important reason for writing this is to just update people on what I’m doing. I have constant conversations with people I used to talk to a lot who say things like, "So you still at Apple?" And when I’m like, "Nah, I left there years ago and went to Robinhood for a couple of years.", they’re like, Fair enough. I do the same to lots of people too. We don’t have time to keep up on LinkedIn updates for the hundreds of people we know. So, short version, I was at IOActive, left to go to Apple to build the BI function and platform for InfoSec for 3 years (before Covid). Left there to go to Robinhood for 2 years to build their Vuln Management team/platform. Then at the end of last year I left RH to go independent. I’ve seen those too, and I avoid them. Maybe some are real, but I have no interest in an Amazon drop-shipping or an Orphan Bloodletting business. Or whatever the hell they’re doing. My reason for making the transition was very simple. It wasn’t about money. I was making good money in corporate InfoSec. No. I just had to get away from corporate jobs where one or more of these were true: So the company spends most of its time in planning sessions that will be ignored within a few weeks, only to do it again in a couple of months I was spending all my time on a thing I didn’t think improved the world as much as I could have doing something better When I asked myself that question I realized I should be working for myself, building things that help people, consulting with people to help them, and putting that content into the world somehow. So today I run Unsupervised Learning, which is not just the newsletter/podcast but the parent company of three separate pillars. Builder: First, I’m building a platform for solving all sorts of problems around purpose, focus, and execution—both for individuals and companies. See above! If that sounds vague, that’s ok, we’re still not talking about the product publicly yet. The first product we’re building on that platform addresses the primary cause of Startup Death. I’ll say more once the product is public, but it’s 🔥. Or at least that’s what I tell myself, and the feedback has been excellent from those who’ve seen it.'
