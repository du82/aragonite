["https://danielmiessler.com/p/the-ai-attack-surface-map-v1-0"]
title = "The AI Attack Surface Map v1.0 | Daniel Miessler"
description = "Introduction Purpose Components Attacks Discussion Summary Introduction This resource is a first thrust at a framework for thinking about how to attack AI syste"
full_description = "At the time of writing, GPT-4 has only been out for a couple of months, and ChatGPT for only 6 months. So things are very early. There has been, of course, much content on attacking pre-ChatGPT AI systems, namely how to attack machine learning implementations. It’ll take time, but we’ve never seen a technology be used in real-world applications as fast as post-ChatGPT-AI. But as of May of 2023 there has not been much content on attacking full systems built with AI as part of multiple components. This is largely due to the fact that integration technologies like Langchain only rose to prominence in the last 2 months. So it will take time for people to build out products and services using this tooling. Once those AI-powered products and services start to appear we’re going to have an entirely new species of vulnerability to deal with. We hope with this resource to bring some clarity to that landscape. The purpose of the this resource is to give the general public, and offensive security practitioners specifically, a way to think about the various attack surfaces within an AI system. The goal is to have someone consume this page and its diagrams and realize that AI attack surface includes more than just models. We want anyone interested to see that natural language is the primary means of attack for LLM-powered AI systems, and that it can be used to attack components of AI-powered systems throughout the stack. We see a few primary components for AI attack surface, which can also be seen in the graphics above. Langchain calls these Components. Prompts are another component in Langchain but we see those as the attack path rather than a component. We’ve so far always chosen to trade privacy for functionality, and AI will be the ultimate form of this. AI Assistants are the agents that will soon manage our lives. They will manipulate our surroundings according to our preferences, which will be nice, but in order to do that they will need extraordinary amounts of data about us. Which we will happily exchange for the functionality they provide."
