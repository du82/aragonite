["https://danielmiessler.com/p/companies-graph-of-algorithms"]
title = "Companies Are Just a Graph of Algorithms | Daniel Miessler"
description = "AI is about to see your company as a series of components to be optimized"
full_description = "I think the reason so many people don’t understand how big AI is going to be is that they don’t understand that everything is an algorithm. Well, let’s say that your company takes pictures, cleans them up, stylizes them, and adds a caption—which customers can then download in a large format. Let’s call the company Memories. The company started in the early 2000’s, founded by an artist/photographer, and here’s how it works: The user uploads the best quality digital image that you have of the photo, or send it to the company, Memories receives it and does a high-quality scan using a bunch of old-school photography techniques + Photoshop Then they use those same techniques to stylize the image in some kind of way, like Retro, Cinematic, Family, whatever. Simple enough, and for anyone into computers you will recognize this as a series of steps, aka—an algorithm. Also, each one of these steps is an algorithm itself, just like the full set of algorithms. So you could break the Upload step into its own piece. But the sending and processing pieces aren’t the only flows that make up the business. You also have: As you continue the process, you start seeing a full picture of all the different pieces that make up the business. I use the word graph because it allows me to think of the relationships between the different components and describe them using an action—such as send to or receive, or whatever. This process of breaking down processes of any kind—and especially for an entire business—is powerful on its own. If you were to have done this exercise for any business in 2022 it would have given that business a significant advantage. It allows you to see all the pieces, how they fit together, and figure out what to optimize or even eliminate from the workflow. AI excels at both discrete task execution and determining how things fit together, and every single one of your company’s workflow components becomes ripe for optimization or elimination. AI-deniers are simply not realizing how opaque most businesses are, how much waste there is in their processes, or the level of redundancy and inefficiency."
year_published = 2025
