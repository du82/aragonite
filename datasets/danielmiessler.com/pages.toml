["https://danielmiessler.com/p/real-problem-job-market"]
title = "The End of Work | Daniel Miessler"
description = "My big, depressing, and optimistic theory for why it's so hard to find and keep a job that makes you happy"
full_description = '''If you’re like me, you’ve had this strange, uneasy feeling about the job market1 for a few years now. It’s like a splinter in the brain. We know something is deeply broken about the whole system, but it’s impossible to grasp or articulate. People talk a lot about how AI is going to replace millions of jobs, and how it will also create many more. I think that’s true, but I think there’s a lot more going on here than just AI. First, why do we even think there’s a problem? For me, it starts with noticing how bad—and how often—work just completely sucks. Like the whole thing—finding work, doing work, being stressed about not losing work. Etc.2 Most companies, departments, and teams are horribly inefficient, have very little direction, are full of wasted time and efficiency, and are poorly run. It’s constant meetings to talk about the latest corporate fuckery, which only prevents you from doing what you should be doing. It’s change for the sake of change. And when you get excited about a way to fix things, either nobody listens, or they only pretend to before failing to implement it. Work tends to be a series of disappointments for most people, punctuated by a few rays of light. I was curious about how many people felt this way—not wanting to do a full essay on just my own opinions—and found this from Gallup about the quiet quitting phenomenon. The overall decline was especially related to clarity of expectations, opportunities to learn and grow, feeling cared about, and a connection to the organization's mission or purpose—signaling a growing disconnect between employees and their employers. Many quiet quitters fit Gallup's definition of being "not engaged" at work—people who do the minimum required and are psychologically detached from their job. This describes half of the U.S. workforce. I’m sure there are lots of factors going into Quiet Quitting, but I think this feeling I’m talking about is one of them. And that brings me to what I think the real issues are, which are a lot deeper and more unsettling than just, "AI is taking the jobs."'''
year_published = 2025
