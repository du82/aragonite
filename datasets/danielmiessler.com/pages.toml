["https://danielmiessler.com/p/raid-ai-definitions"]
title = "RAID (Real World AI Definitions) | Daniel Miessler"
description = "An evolving set of real-world AI definitions designed to be usable in discussion"
full_description = 'I see a lot of definitions of different AI terms out there and I wanted to put my own thoughts into a long-form format. This is mostly for my own reference, but I hope it’ll be useful to others as well. Some of these are practical definitions, i.e., useful, general, and conversational containers that help us frame an everyday conversation. Others are more technical with specific thresholds, which are better for tracking milestones towards big jumps. I really liked Hamel Husain’s AI Bullshit Knife which gave aggressively short definitions for a bunch of AI terms. Here’s my expanded take on it. I think that’s a pretty clean list for thinking about the concepts. Now let’s expand on each of them. There are so many different ways to define AI, so this is likely to be one of the most controversial. I choose the "what used to only be possible with humans" route because it emphasizes how the bar continues to move not only as the tech advances, but also as people adjust their expectations. The general template for this rolling window is this: Well, yeah, of course AI can do ___________, but it still can’t do __________ and probably never will.Lots of people in 2023/4 I know there are a million technical definitions for machine learning, but back in 2017 when I started studying it the thing that floored me was very simple. That’s it. It’s the idea that a thing—that we created—could get smarter not from us improving its programming, but from it just seeing more data. That’s insane to me, and to me it’s still the best definition. Adversarial Machine Learning is a way of tricking an AI model into doing something unexpected and negative by presenting it with modified, tainted, or otherwise deceptive and harmful input. A great example of this is where an attacker can make a slight modification to a STOP sign and have a machine learning model interpret it as a 45-mile-per-hour speed limit sign instead. In other words, if a human looks at the sign, it looks like a slightly modified STOP sign, but when the AI sees it, it sees a speed limit sign.'
