title = "Daniel Miessler"
description = "SECURITY | AI | PURPOSE :: Building AI that upgrades humans."
full_description = "My name is Daniel Miessler and I'm an AI / Security Researcher and entrepreneur based out of the San Francisco Bay Area. My focus is on building AI systems that augment human capabilities rather than replace them. My goal is to help prepare people for a world where AI removes the traditional, corporate labor model—and move us towards something better—which I call Human 3.0. To look around, you can check out my writing, telos, projects, ideas, and/or predictions—or a deeper version of this explainer on the about page. I've been writing and building in public since 1999. My work unapologetically spans multiple domains, including cybersecurity, AI, technology, society, and philosophical exploration. Professionally, I've been in cybersecurity for my entire career, and have worked at companies like Apple, Robinhood, IOActive, HP, and others. I've also consulted for hundreds of companies from the Fortune 10 to the Global 1,000. To learn more about what I'm working on, you can check out my projects, writing, telos, ideas, and predictions. And if you want to reach out, you can find me on X, BlueSky, LinkedIn, or email."
