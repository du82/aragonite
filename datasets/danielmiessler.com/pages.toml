["https://danielmiessler.com/blog/why-well-have-agi-by-2028"]
title = "Why We'll Have AGI by 2025-2028 | Daniel Miessler"
description = "We don't need a single model to be AGI-capable because it's all about the systems, not the components"
full_description = 'People are thinking a lot about when we’re going to get Artificial General Intelligence (AGI), and I think it’s coming faster than most. AGI is distinct from regular AI because regular AI is "narrow," meaning it’s only good at a very specific thing and can’t adapt to complexity like humans. An AI that’s good at multiple things, or is able to handle complexity, would be monumental. It would be direct competition for humans—especially human workers. For the longest time, the consensus of the best experts was that either this would 1) never happen, or 2) it would come many decades from now. But, given what’s happened in the last year with GenAI and ChatGPT, that’s now changing. Given all these developments, my prediction is a 60% chance of AGI in 2025 and a 90% of AGI in 2028. But before we get too deep into it, we need to more accurately define what we mean by AGI. Here’s Sam Altman’s definition: This is a decent attempt, but I think it has a couple of problems. First, it seems to focus on knowledge work but it doesn’t say so. Like this isn’t an average construction worker he’s talking about. AGI things are not robot things. Second, the word "median" is problematic. Why not say average? Because mean and median are two different types of average, and they have different meanings, that’s why. Anyway, here’s my definition that I think is more in line with what people really mean when they talk about AGI: I think this is a better definition because it’s more specific. Payscale did a study of 302 different knowledge worker salary profiles, and found the average salary to be $87,342. Cool, so let’s say that an AGI is a system that can replace an average knowledge worker in the US making an average salary. A lot of people are skeptical of imminent AGI because they’ve made the mistake of thinking it has to come from one component. They’re imagining some new model like GPT-6 being AGI-capable by itself. That’s one way to get there, but it’s not the only way. And I’d argue it’s not how we’ll get there first.'
year_published = 2025
