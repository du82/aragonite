["https://danielmiessler.com/p/the-iphone-will-dominate-but-not-because-of-features-functionality"]
title = "The iPhone Will Dominate, But Not Because Of Features/Functionality | Daniel Miessler"
description = "May 9, 2007 So the iPhone is getting ready to come out in June and I’m hearing a lot of press about how this phone or that phone is better than it already"
full_description = 'So the iPhone is getting ready to come out in June and I’m hearing a lot of press about how this phone or that phone is better than it already, and that it’s too late for it to make a splash. I disagree. People keep talking about features, and I think they are missing the point. Sure, there will be many people who don’t get an iPhone because it doesn’t have a certain feature (or 5 certain features), but again — I think there’s something else to this. I think the iPhone is simply going to be superior (demand-wise) to these other offerings despite lacking features such as 3G, a real keyboard, etc. Look at the music player market; there are a number of other players that are "better" than the iPod, but they don’t have the same feel, the same interface, the same…"I don’t know what" that the iPod has. So while people are saying, "I need x, y, and z and iPhone doesn’t have it.", when they get a hold of one for two minutes they’re going to be like, "Holy crap. I’m getting one of these." The phrase, "More than the sum of its parts" comes to mind. Of course, it could suck horribly and die a painful, humiliating death. I accept that as a very real possibility, and will be getting a Blackberry Curve or Helio Ocean shortly afterwards if that happens. But I don’t think so. I think it’s going to become the next "must-have" device — not because of what all it can do — but because of how it feels when you do it.'
