["https://danielmiessler.com/p/introducing-substrate"]
title = "Introducing Substrate — An Open-source Framework for Human Understanding, Meaning, and Progress | Daniel Miessler"
description = "Substrate is a crowdsourced project designed to enhance understanding, communication, and action in order to move humanity forward"
full_description = 'I’m excited to share a project I’ve been working on for a number of months called Substrate. Fair warning: it’s quite ambitious. Yep, fantastic question. The purpose of the project is to make the things that matter to humans more transparent, discussable, and ultimately—fixable. When we say "human understanding, meaning, and progress" in the description, we’re talking about these types of conceptual objects: Each of these will be an actual list, maintained as a repository within Github. Each list will have a schema, similar to this one for the Problems repository: This structure will allow the entire open-source community (i.e., the world) to contribute their own Problems, Claims, Sources, Frames, Goals, etc., that others can use. Here are some more examples of Substrate Components in everyday scenarios. Let’s look at an Argument component. Think of a common argument we might hear on any given day about whatever topic. This one is about recycling. I don’t know why you recycle, man. It’s a total waste. It costs so much to recycle right now and the programs are poorly run, so it’s not actually benefiting the environment. Like, I’d do it it it worked, but it doesn’t. We’re confronted by this type of thing constantly. About things like recycling, but also about things that matter much more, like politics. What Substrate will do is take an argument like this recycling example, and turn it into something like this: It’d be good to recycle plastic if it were actually worth the effort, but current systems are so inefficient that they cost more energy than they save. When people make truth claims, it’s important that we be able to fact-check or research those claims to see their support. Substrate does this by maintaining a list of Sources that we may or may not trust for new information, such as an Organization, or a Person (both of which are also Substrate Components). When someone makes an Argument, or a Claim within an Argument, it can be linked to Sources that people can choose to trust or not trust.'
year_published = 2025
