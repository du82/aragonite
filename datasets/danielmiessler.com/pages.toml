["https://danielmiessler.com/blog/a-visual-breakdown-of-intellectual-dark-web-idw-political-positions"]
title = "A Visual Breakdown of Intellectual Dark Web (IDW) Political Positions | Daniel Miessler"
description = "Apr 6, 2019 My Exploration of Difference Between Classical Liberalism and Libertarianism I realized recently that I had no idea where many people in the Intelle"
full_description = "I realized recently that I had no idea where many people in the Intellectual Dark Web actually stood on key positions. I thought I knew—sort of—but it turns out that most of what I knew was coming from a shoddy skyscraper of misconceptions. I did a post recently about Renée DiResta being on Joe Rogan’s podcast, and in the comments I learned that she was evidently some sort of shill for…I’m not sure who. I guess for the Democrats? I also learned recently from other readers that Joe Rogan was alt-right. I was being attacked by alt-right types saying DiResta part of a pro-Clinton conspiracy, which was ridiculous. Really? Joe Rogan? A conservative? The mediation, cannabis, commedian who’s for gay marriage and pro-choice, and income equality? I then made the mistake of thinking Dave Rubin was conservative as well, since he’s often labeled that by the extreme left. I’m an MMA fan, and I have followed Sam Harris since the very beginning, so Rogan and Harris were already in my awareness and thus I could tell when they were being maligned fairly easily. But when it came time for me to describe people like Rubin, I realized I was committing the same errors as everyone else. If you’ve not listened to a large body of someone’s work—both in good faith and over a long period of time—you can’t hope to understand them. So I decided this weekend to do the research to figure out what these people believed on all the major issues, and that’s the spreadsheet you see above. During the research I started noticing some weird stuff about this supposedly hateful IDW group of Harris, Weinstein, Rubin, and Shapiro. Namely, they’re all Jewish, and yet a number of them are often labeled as white supremacists and even neo-Nazis. That completely breaks the stupidmeter. Ben Shapiro—yes, the conservative one—actually needs private security because of his open criticism of the alt-right. Shapiro has also been in very aggressive debates with Milo Yiannopoulos, who is a vocal proponent of the alt-right, and that public disagreement has become quite ugly."
year_published = 2025
