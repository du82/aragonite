["https://danielmiessler.com/ideas"]
title = "Ideas | Daniel Miessler"
description = "SECURITY | AI | PURPOSE :: Building AI that upgrades humans."
full_description = '''Here I try to keep track of original ideas I've had over the years, which I do for a number of reasons: These are what I consider my most interesting and important ideas based on what's happening right now. If you think about most products and services, they're largely just executing on these components in different ways. I've come to believe that complex human issues like free will and existentialism come down to understanding that reality has multiple layers. I feel like The Fabric of Reality, by David Deusch, is a good starting point for this idea, although I've been grappling with it for years before reading it in 2024. The idea is practical rather than technical. It's the notion that each layer of reality is valid on its own, and there isn't an actual "true" reality. Or to put in another way, the way you frame your question and your desired outcomes determines which layers of reality—and thus which truths—get engaged for the answer. Technically, your neighbor is a mechanistic creature that lacks free will, so he didn't have a choice about whether or not to take your figs. But right now your kid is asking why he can't have a fig, and why your neighborhood is selling them across the street. So the physics conversation is rather moot. Same with enjoying ice cream, or friendship, or trying to do good in the world. At some layer they're likely all meaningless, but that doesn't matter for humans because we live spend our entire lives in layers where they do. Humans vibrate at a particular set of layers based on our physical makeup combined with the rules of the universe, and the reactions between those ultimately determine what is real to us. And it's the same for anything else. Meaning, reality, and truth are all dependent on who's asking the questions, and for what reasons. These are two terms I came up with in 2008 that we would eventually use for talking about people who were augmented with tech—or not. My goal was to have them be easy to say and single syllable.'''
year_published = 2025
