["https://danielmiessler.com/blog/were-heading-for-something-ugly-in-2020"]
title = "We’re Heading for Something Ugly in 2020 | Daniel Miessler"
description = "I’ve had a sense of foreboding for the last month or so about the mental health of the United States. And sure—the Trump situation is raising pulses, but it’s m"
full_description = 'I’ve had a sense of foreboding for the last month or so about the mental health of the United States. And sure—the Trump situation is raising pulses, but it’s more than that. It’s a building tension that I feel coming from everyone—especially online—from being forced by current events into extreme versions of ourselves. It’s like the country is a giant piece of strong but brittle steel being bent closer and closer to the snapping point. It’s creating a piercing sound that everyone can hear and can’t get out of their head. In broad strokes, we are polarizing and the center is disappearing—both economically and ideologically. 50 years ago we would pick between something like a Romney and a McCain character for president, which were basically the same because the country had shared goals. Today, everyone is getting forced to pick between socialism and fascism, and if you strike a single wrong note in a conversation with someone, you’re assumed to be their opposite. Nuance and exploration in a political discussion today lasts around 40 seconds. Then as soon as someone hits one of the keywords—like "free speech", "me too", "the wall", etc.—the conversation becomes a garbage fire. Each side labels the other, automatically figures out the 39 other beliefs that they probably hold, and then figures out how to exit the conversation and go tell their in-group that they encountered another enemy in the wild. Labeling and ostracising has always been present in politics, but in the last year it’s become pathological. One place I see it very prominently is in the information security community that I’m a part of, with Twitter as the courtroom of choice. As I write this, we’re in the middle of the worst community conflict I’ve seen going back to 1999. It’s not separate from the bending steel bar that is our country right now—it’s a characterization of that stress through a particular lens. In this case, a lens of a Cybersecurity industry with serious gender imbalance and male chauvinism problems.'
year_published = 2025
