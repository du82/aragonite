["https://danielsaidi.com/lyrics/kollektivet/fem-ber%C3%A4ttelser/salta-s%C3%A5r"]
title = "Salta sår | Daniel Saidi"
description = "Han slår sig ner och låter fingret sjunka Ord som aldrig har sagts yttras genom ögonen Världar slås ihop och liv förändras på en sekund till någonting man saknar, någonting man hatar"
full_description = "Fem berättelser Salta sår Han slår sig ner och låter fingret sjunka Ord som aldrig har sagts yttras genom ögonen Världar slås ihop och liv förändras på en sekund till någonting man saknar, någonting man hatar “Men säg vad du vill ha sagt om du nu vill förändra mig” Hans virrigt hesa röst vittnar om en kemisk tröst Men hon stryker och håller käft, bränner tyger i protest Hon drömmer sig iväg till vackra dagar som ännu inte regnat bort Hon säger: “Kan du tänka klart, så ser du nåt att skratta åt Vi låter våra år strös i våra salta sår Och kan du inte se, så hoppas jag och ber att du i hjärtat vet att vi trivs bäst i ensamhet” Han säger: “Hör du inte klart? Vad fan är det du säger? Du går vresigt runt omkring, men gör ju själv ingenting Men är du missnöjd då så gå, men jag trodde att det var vi två Genom bråk och kiv kan vi inte ändra våra liv” Hon suckar tyst och vänder ryggen till, kastar en kall blick mot toasitsen - uppfälld än en gång Det är petitesser som får dagar att tänjas ut i långa år “Vänd dig inte om, vi måste tala ut om sånt som förstör våra liv” Hans uppriktighet river hårt, så hon vänder sig om med tårar av glädjespetsad sorg och sjunker ner på deras smutsiga golv och säger: “Jag vet att du har rätt att du älskar mig för den jag är, men det är inte lätt att blunda för misär” Hon ler och gråter ut: “Vi håller ut tills allt det onda så tar slut Vi hör ihop, vi hör ihop! Det är vi, du och jag, bara vi som vet hur vi vill ha det Och kanske vi skulle ta bättre hand om varandra och om våra dagar, våra dagar tillsammans” Men nattetid gror sorg och inatt gror tvivlet än en gång Hon vrider sig så som hon gjort så många, många gånger förut Tvivlet sliter hennes gröna ögon blå när hon till sist förstår"
