["https://danielsaidi.com/talks"]
title = "Talks | Daniel Saidi"
description = "My name is Daniel Saidi. I’m a freelance software engineer in Stockholm, Sweden, who specializes in mobile product development, with a focus on Apple platforms like iOS, macOS, tvOS and watchOS and technologies like Swift and SwiftUI."
full_description = "Home Talks & Workshops Here is a list of some talks and workshops that I have given at conferences, meetups, events etc. I enjoy it, but am not actively reaching out, sending in papers etc. It happens when it happens. Mastering the macOS Menu Bar CocoaHeads Stockholm· Presentation I gave this talk at CocoaHeads Sthlm in December 2022, on how to customize the macOS menu bar and about panel with SwiftUI, and how to use focus state to control where actions are performed. Building Rich Documentation with DocC CocoaHeads Stockholm· Presentation I gave this talk at CocoaHeads Sthlm in October 2022, on how to use DocC to build rich documentation media, articles and tutorials and how to automate generating documentation for open-source projects. Going Open-Source MalagaMobile· Presentation I gave this talk at MalagaMobile in March 2022, and later at Copenhagen Cocoa, on my experiences of working on many open-source projects, how to get started and how to manage closed-source projects. Building a tvOS app with SwiftUI try! Swift World· Presentation· Article I gave this workshop at the try! Swift World online conference in 2021, on how to build a video streaming app for tvOS, using SwiftUI and Combine. Swift Package Manager - How to Distribute Closed-Source Software try! Swift World· Presentation I gave this workshop at the try! Swift World online conference in 2021. In it, we look at how to use the Swift Package Manager to distribute closed-source software and protect our secret sauce. Get Swifty! DevSum· Presentation I gave this talk at Devsum 2020, about the Swift programming language its syntax and building blocks. We explored the language basics, then used what we learned to build an app in UIKit and SwiftUI. Coordinating Async Operations CocoaHeads Stockholm· Presentation· Article I gave this talk in 2019, about how to coordinate multiple concurrent and serial async operations using protocols. We created a fully tested solution that is easy to use, and understand."
