["https://danielsaidi.com/blog/2010/09/22/animation-disables-font-in-ie"]
title = "Animation disables font in Internet Explorer | Daniel Saidi"
description = "As I built a simple site to show how easy it is to get fonts.com Web Fonts up and running, I noticed that Internet Explorer disables custom fonts during animations."
full_description = '''Blog Animation disables font in Internet Explorer Sep 22, 2010 · javascript As I built a simple site to show how easy it is to get fonts.com Web Fonts up and running, I noticed that Internet Explorer disables custom fonts during animations. As the animation starts, Internet Explorer disables the fonts and resets to the original fonts. After some investigation, it turns out that it wasn’t a limitation in Internet Explorer, but a bug in the animation code. Turns out that this button code’s trailing comma made Internet Explorer fail: <button onclick="$('.comic').animate({fontSize: '3em', });">Click me!</button> Removing the comma fixes the font disabling bug: <button onclick="$('.comic').animate({fontSize: '3em' });">Click me!</button> Thanks for never showing any exceptions at all ever, IE! Discussions & More If you want to discuss this post, please share your thoughts on Bluesky and Mastodon. Make sure to follow to be notified when new content is published.'''
