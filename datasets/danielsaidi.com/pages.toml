["https://danielsaidi.com/blog/2013/07/31/android-glossary"]
title = "Android Glossary | Daniel Saidi"
description = "I’m currently getting started with Android development, which means that I have many new things to learn. The biggest challenge with learning a new language is not the syntax itself, but the tools and conventions. Let’s look at some acronyms that are worth remembering."
full_description = "Blog Android Glossary Jul 31, 2013 · android I’m currently getting started with Android development, which means that I have many new things to learn. The biggest challenge with learning a new language is not the syntax itself, but the tools and conventions. Let’s look at some acronyms that are worth remembering. Below is a list of some Android acronyms that I found in the Android Developer Guidelines: AAPT - Android Asset Packaging Tool ADB - Android Debug Bridge (enables debugging on emulator or device) ADK - Accessory Development Kit ADM - Android Debug Monitor ADT - Android Developer Tools AIDL - Android Interface Definition Language ANT - Another Neat Tool (build tool) APK - Android Application Package (like an .msi file) AVD - Android Virtual Device BMGR - Backup Manager CAB - Contextual Action Bar DDMS - Dalvik Debug Monitor Service DEX - Dalvik Executable DVM - Dalvik Virtual Machine GPB - Google Play Billing (like iOS IAP) JDWP - Java Debug Wire Protocol MMU - Memory-management unit NDK - Native Development Toolkit If you like me is an Android n00b, I recommend checking out the Android knowledge base. Discussions & More If you want to discuss this post, please share your thoughts on Bluesky and Mastodon. Make sure to follow to be notified when new content is published."
