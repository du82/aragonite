["https://danielsaidi.com/blog/2012/09/03/ios-bounce-animation"]
title = "iOS Bounce Animation | Daniel Saidi"
description = "I have an app where tapping various icons bounces the icon, plays a sound and takes the user to another part of the app. Let’s see how the bounce animation was made."
full_description = 'Blog iOS Bounce Animation Sep 3, 2012 · ios I have an app where tapping various icons bounces the icon, plays a sound and takes the user to another part of the app. Let’s see how the bounce animation was made. After trying out different approaches, I fell in love with a nice and clean bounce animation that does its job without being too obvious. I implemented the animation as a UIView category, with a bounce factor so the effect can be used in different situations. I should probably do the same for the repeat count as well. Here’s the code for the category: UIView+Bounce.h: #import <UIKit/UIKit.h> @interface UIView (Bounce) - (void)bounce:(float)bounceFactor; @end UIView+Bounce.m: #import "UIView+Bounce.h" #import <QuartzCore/QuartzCore.h> @implementation UIView (Bounce) + (CAKeyframeAnimation*)dockBounceAnimationWithViewHeight:(CGFloat)viewHeight { NSUInteger const kNumFactors = 22; CGFloat const kFactorsPerSec = 30.0f; CGFloat const kFactorsMaxValue = 128.0f; CGFloat factors[kNumFactors] = {0, 60, 83, 100, 114, 124, 128, 128, 124, 114, 100, 83, 60, 32, 0, 0, 18, 28, 32, 28, 18, 0}; NSMutableArray* transforms = [NSMutableArray array]; for(NSUInteger i = 0; i < kNumFactors; i++) { CGFloat positionOffset = factors[i] / kFactorsMaxValue * viewHeight; CATransform3D transform = CATransform3DMakeTranslation(0.0f, -positionOffset, 0.0f); [transforms addObject:[NSValue valueWithCATransform3D:transform]]; } CAKeyframeAnimation* animation = [CAKeyframeAnimation animationWithKeyPath:@"transform"]; animation.repeatCount = 1; animation.duration = kNumFactors * 1.0f/kFactorsPerSec; animation.fillMode = kCAFillModeForwards; animation.values = transforms; animation.removedOnCompletion = YES; // final stage is equal to starting stage animation.autoreverses = NO; return animation; } - (void)bounce:(float)bounceFactor { CGFloat midHeight = self.frame.size.height * bounceFactor; CAKeyframeAnimation* animation = [[self class] dockBounceAnimationWithViewHeight:midHeight]; [self.layer addAnimation:animation forKey:@"bouncing"]; } @end Feel free to try it out. Hope you like it! Discussions & More If you want to discuss this post, please share your thoughts on Bluesky and Mastodon. Make sure to follow to be notified when new content is published.'
