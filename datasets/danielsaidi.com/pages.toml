full_description = "Work Oribi 2021 - 2024 swift swiftui spm ios macos closed-source keyboard-extension Oribi develops powerful spelling aids & language support for the digital and physical world, including word prediction, spell checking, voice synthesizing and more. Oribi reached out regarding KeyboardKit, and asked me to create a custom keyboard app powered by their amazing language technology. The first product I developed for Oribi was oKeyboard, which is a custom keyboard for iOS & iPadOS that adds Oribi’s autocomplete, spellchecking & text-to-speech: As part of this project, I structured Oribi’s tools into separate libraries, which makes it easy to combine and use them in any app that use Oribi technologies. After oKeyboard, I rebuilt their Oribi Writer app from scratch, to a multi-platform, document-based app that runs on iOS, iPadOS and macOS: Thanks to Oribi, I was able to improve KeyboardKit a lot, as part of making oKeyboard. It was a true pleasure to work with them for so many years. Links Visit the Oribi website"
