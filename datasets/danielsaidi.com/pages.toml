["https://danielsaidi.com/blog/2013/08/02/android-fullscreen-activity"]
title = "Android Fullscreen Activity | Daniel Saidi"
description = "The best way for me to learn, is to write about it. This way, I can return to earlier posts and see that I knew nothing once, and that I have learned a few things. Today, I will honor that strategy by publishing a simple class that can be used for fullscreen Android activities."
full_description = "Blog Android Fullscreen Activity Aug 2, 2013 · android The best way for me to learn, is to write about it. This way, I can return to earlier posts and see that I knew nothing once, and that I have learned a few things. Today, I will honor that strategy by publishing a simple class that can be used for fullscreen Android activities. In this class, I have just stripped and refactored the boilerplate code you get when creating a fullscreen activity, then exposed simple methods that you can call from the subclass. import android.annotation.TargetApi; import android.app.Activity; import android.os.Build; import android.os.Bundle; import android.os.Handler; import android.view.View; import android.view.Window; /** If you inherit this class, call initFullscreenWithContentView or initFullscreenWithContentViewId in onCreate, after setting the content view. Since going fullscreen will not resize the activity, consider not using an action bar, since it will be partially hidden. A setContentViewWithoutTitleBar method is available, and can be used instead of setContentView. */ public class FullscreenActivity extends Activity { private static final boolean FULLSCREEN_AUTO = true; private static final int FULLSCREEN_AUTO_DELAY_MILLIS = 3000; private static final int FULLSCREEN_INIT_DELAY_MILLIS = 100; private static final boolean FULLSCREEN_TOGGLE_ON_CLICK = true; private static final int FULLSCREEN_HIDER_FLAGS = SystemUiHider.FLAG_HIDE_NAVIGATION; private Handler fullscreenHandler; private Runnable fullscreenRunnable; private SystemUiHider systemUiHider; @Override protected void onCreate(Bundle savedInstanceState) { super.onCreate(savedInstanceState); } @Override protected void onPostCreate(Bundle savedInstanceState) { super.onPostCreate(savedInstanceState); fullscreenAfterDelay(FULLSCREEN_INIT_DELAY_MILLIS); } protected void fullscreenAfterDelay(int delayMillis) { if (systemUiHider == null) { return; } fullscreenHandler.removeCallbacks(fullscreenRunnable); fullscreenHandler.postDelayed(fullscreenRunnable, delayMillis); } protected void initFullscreenWithContentView(View view) { setupFullscreenHandler(); setupSystemUiHandlerForView(view); setupContentViewClickBehavior(view); fullscreenAfterDelay(FULLSCREEN_INIT_DELAY_MILLIS); } protected void initFullscreenWithContentViewId(int id) { initFullscreenWithContentView(findViewById(id)); } protected void setContentViewWithoutTitleBar(int resourceId) { requestWindowFeature(Window.FEATURE_NO_TITLE); setContentView(resourceId); } private void setupContentViewClickBehavior(View view) { view.setOnClickListener(new View.OnClickListener() { @Override public void onClick(View view) { if (FULLSCREEN_TOGGLE_ON_CLICK) { systemUiHider.toggle(); } else { systemUiHider.show(); } } }); } private void setupFullscreenHandler() { if (fullscreenHandler == null) { fullscreenHandler = new Handler(); fullscreenRunnable = new Runnable() { @Override public void run() { systemUiHider.hide(); } }; } } private void setupSystemUiHandlerForView(View view) { systemUiHider = SystemUiHider.getInstance(this, view, FULLSCREEN_HIDER_FLAGS); systemUiHider.setup(); systemUiHider.setOnVisibilityChangeListener(new SystemUiHider.OnVisibilityChangeListener() { @Override @TargetApi(Build.VERSION_CODES.HONEYCOMB_MR2) public void onVisibilityChange(boolean visible) { if (visible && FULLSCREEN_AUTO) { fullscreenAfterDelay(FULLSCREEN_AUTO_DELAY_MILLIS); } } }); } } This is different from any iOS code I’ve previously written. I used to write and teach Java at the university, but I’m really torn on it. However, it’s still way nicer than Objective-C. Discussions & More If you want to discuss this post, please share your thoughts on Bluesky and Mastodon. Make sure to follow to be notified when new content is published."
