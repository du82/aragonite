["https://danielsaidi.com/talks/2020/01/25/get-swifty"]
title = "Get Swifty!"
description = """
I gave this talk at Devsum 2020, about the Swift programming language
its syntax and building blocks. We explored the language basics, then
used what we learned to build an app in UIKit and SwiftUI."""
