full_description = "Here are the best things I found on the internet last week. A stunning musical performance, great art, why Bitcoin is the worst, how AI could lead to creative/local software, and something to waste some time with on the toilet. The full set. VIDEO: DOMi & JD BECK - SPACE MOUNTAiN - Live at Tokyo, Japan Just watch it. 2 certified child prodigies at work. Musicianship at its finest whilst looking like the coolest mf-ers in town. ART: Mantra’s Murals Collect Enormous Butterflies in Building-Size Specimen Cases French artist Youri Cansell, known as Mantra, creates large, vibrant insect murals, including a recent rooftop piece in Miami featuring diverse butterfly species to promote nature preservation. Stunning. I want one on the side of my street. GAME: Stimulation Clicker This is a very clever, very fun, very addictive waste of time. Play it in you browser now. ARTICLE: Bitcoin: Lessons about Capitalism “One of the things Bitcoin teaches us is that there is too much money in the world, more than can be put to work in sensible investments.” ARTICLE: Home-Cooked Software and Barefoot Developers Maggie Appleton (on her amazingly designed personal website) talks about the emerging golden age of home-cooked software, barefoot developers, and why the local-first community should help build it. You can watch a video of it at the top of the page, or scroll down for the text/slides."
