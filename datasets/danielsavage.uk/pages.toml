["https://danielsavage.uk/2024/12/02/cultural-diet-november"]
title = "Cultural Diet - November 2024 | Daniel Savage"
description = """
A run down of everything I’ve consumed this month.
November has been busy. I’ve overdone it and December is supposed to be the month of excess. It has, however, also been fun. And that’s important too."""
full_description = "A run down of everything I’ve consumed this month. November has been busy. I’ve overdone it and December is supposed to be the month of excess. It has, however, also been fun. And that’s important too. Music Kendrick Lamar - GNX Chemical Brothers - Planet Dust Yannis & the Yaw - Lagos Paris London EP Gigs 07/11/24 Warmduscher @ The Ritz - a surprisingly “6Music Dad” heavy crowd but the band performed well, even if I wasn’t too sure about the newer stuff. ⭐️⭐️⭐️ 09/11/24 Homobloc @ The Warehouse Project - a joyous queer celebration where I finally got to meet Janet Planet from Confidence Man aka the only woman I truly love. ⭐️⭐️⭐️⭐️ 13/11/24 Fat Dog @ Band on the Wall - a raucous, pounding, energy unleashed from one of the most exiting new live bands around. ⭐️⭐️⭐️⭐️⭐️ 22/11/24 The Glang Show @ Fairfield Social Club - a terrific anarchic proto-gameshow comedy night. Superb. ⭐️⭐️⭐️⭐️⭐️ 30/11/24 Confidence Man @ Manchester Academy - the 9th (NINTH) time I’ve seen the party-pop Australian band and while good (and Janet Planet remaining my number 1 crush), it wasn’t my favourite. ⭐️⭐️⭐️ TV Alma’s Not Normal S2 (iPlayer) - fantastic, funny, moving second series. ⭐️⭐️⭐️⭐️ The Penguin (Sky) - surpassed all expectations, if the rest of the new DC universe is going to be like this then bring it on. ⭐️⭐️⭐️⭐️⭐️ Nautilaus (Amazon Prime) - got bored by the last few episodes, but had some good moments. ⭐️⭐️ Taskmaster S18 (Channel 4) - it’s the best show on telly, isn’t it? ⭐️⭐️⭐️⭐️⭐️ Mortimer & Whitehouse: Gone Fishing S7 (iPlayer)- slow, easy television, but with heart and wit. ⭐️⭐️⭐️⭐️ The Diplomat S1 & S2 (Netflix) - Missed the first season when it came out, but binged both in quick succession. Fantastic television, cliffhangers and performances. ⭐️⭐️⭐️⭐️ How To with John Wilson S1-S3 (iPlayer) - I’m not usually a big documentary guy, but these short episodes are so well done, illuminating surprising niches that humans seem to get themselves into. Joyous. ⭐️⭐️⭐️⭐️ The Franchise (Sky) - with Armando Iannucci involved and with an impressive cast of British comedy actors, I was hoping for something slightly… more. ⭐️⭐️⭐️ Film Dumb Money (Prime) ⭐️⭐️⭐️⭐️ The Rover (Prime) ⭐️⭐️⭐️⭐️ Deadpool & Wolverine (Disney+) ⭐️⭐️ Ratatouille (Disney+) ⭐️⭐️⭐️⭐️"
