title = "now playing | Daniel Savage"
full_description = "14 Feb 2025 🎵Now Playing: Doechii - Alligator Bites Never Heal (2024) Late to the hype but wanted to check it out. Sounds old and fresh at the same time, which is a tough thing to do. Some superb tracks and considering this is a mixtape of 19 songs pretty much all under 3mins, I’m looking forward to what she can do with a focused album. Favourite Tracks: BOILED PEANUTS DENIAL IS A RIVER CATFISH NISSAN ALTIMA 21 Jan 2025 🎵Now Playing: Bob Dylan - Blood on the Tracks (1975) Haven’t seen A Complete Unknown yet. But today felt like a Bob day, and this is currently my favourite album of his. He’s a genius. Favourite tracks: Tangled Up In Blue Simple Twist of Fate Idiot Wind If You See Her, Say Hello Shelter from the Storm Buckets of Rain 16 Jan 2025 🎵Now Playing: Aldous Harding - Warm Chris (2022) Huge fan of Aldous Harding and I realised I hadn’t given this album much of a listen when it was released. Not quite as much oddness to the folk as in previous albums (or maybe I’m used to it), but enough to keep it interesting. Lovely stuff. Favourite Tracks: Tick Tock Fever Lawn Passion Babe Leathery Whip 7 Jan 2025 🎵Now playing: The National - Boxer (2007) It’s started snowing outside again. This album (and this band) always makes me feel like I’m sat in front of an open flame. Hunker down. Favourite tracks: Fake Empire Mistaken for Strangers Squalor Victoria Apartment Story Ada 6 Jan 2025 🎵Now playing: The Beatles - Revolver (1966) Back at work today, so thought I’d throw on an album I’ve ordered on vinyl with some Christmas money. It’s hard to pick a favourite Beatles album (The Best of the Beatles?) but this is my favourite Beatles album. Favourite Tracks: Eleanor Rigby I’m Only Sleeping Here, There and Everywhere She Said She Said Good Day Sunshine And Your Bird Can Sing For No One Got To Get You Into My Life Tomorrow Never Knows 19 Dec 2024 🎵Now Playing: This Is Lorelei - Box for Buddy, Box for Star (2024) This was The Lovely Robin’s™️ best album of the year, and it had completely passed me by so I thought I’d throw it on today. A lovely piece of work. Best Tracks: Perfect Hand I’m All F****d Up Dancing in the Club An Extra Beat for You and Me 18 Dec 2024 🎵Now Playing: Biffy Clyro - Infinity Land (2004) Not gone through the back catalogue of Biffy for a while. Blackened Sky is still my favourite album but this occasionally bangs. Best Tracks: Glitter and Trauma Wave Upon Wave Upon Wave 16 Dec 2024 🎵Now Playing: TV on the Radio - Dear Science (2008) I only remembered I love this band over the weekend so had to play this album today. Great way to start the week. Best Tracks: Halfway Home Crying Golden Age Shout Me Out DLZ 5 Dec 2024 🎵Now Playing: Laura Marling - Patterns (2024) Laura Marling is a perfect artist. She’s already one of my favourite gigs of all time, and this album is a stripped back, beautiful, tender, moving piece of work. Sublime. Best Tracks: Child of Mine No One’s Gonna Love You Like I Can Caroline Looking Back 3 Dec 2024 🎵Now Playing: Joshua Idehen - Mum Does The Washing EP (2024) My Spotify algorithm came good suggesting this to me. Absolutely loved it. Sharp, clever, heartfelt lyrics with great production. I see he’s playing Manchester in April, might have to grab a ticket. Best Tracks: Mum Does The Washing Could Be Forever Tactics for Survival Once in a Lifetime (Talking Heads cover)"
