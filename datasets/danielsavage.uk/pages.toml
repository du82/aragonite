full_description = "26 Feb 2025 🎵Now Playing: Sam Fender - People Watching (2025) I missed his standout Glastonbury set in 2022 which I imagine will turn him into a future headliner. This new album sounds very accomplished and it’s vital to have working class voices in the mainstream. For all the good, I still think it’s a little bit…. boring? It could be a grower though. Favourite Tracks People Watching Wild Long Lie Something Heavy 23 Feb 2025 The Bug Club @ Gorilla, Manchester 2025-02-22 🎵 22 Feb 2025 Spring is coming 🌱 21 Feb 2025 🎵Now Playing: Queens of the Stone Age - Rated R (2000) They’ve announced a massive show in Sheffield and while I have seen them live before, my favourite memory is when Daniel Avery played Feel Good Hit of the Summer at the end of his incredible Glasto set in the early hours of the morning. Favourite Tracks Feel Good Hit of the Summer The Lost Art of Keeping a Secret Better Living Through Chemistry In The Fade 19 Feb 2025 Stewart Lee @ The Lowry Theatre, Salford 2025-02-19 🎭 18 Feb 2025 kele @ Gorilla, Manchester 2025-02-15 🎵 14 Feb 2025 🎵Now Playing: Doechii - Alligator Bites Never Heal (2024) Late to the hype but wanted to check it out. Sounds old and fresh at the same time, which is a tough thing to do. Some superb tracks and considering this is a mixtape of 19 songs pretty much all under 3mins, I’m looking forward to what she can do with a focused album. Favourite Tracks: BOILED PEANUTS DENIAL IS A RIVER CATFISH NISSAN ALTIMA 13 Feb 2025 First time since I got my new “proper” job over a year ago where I’ve felt under pressure and slightly out of my depth. Dreaming of the days all I did was turn up to a quiz/dj night and have fun. 12 Feb 2025 OK, I admit it. I love Stacey Solomon’s Sort Your Life Out. Tidying ✅ Organising ✅ Heartwarming ✅ 6 Feb 2025 I am staying in Ashford overnight before a site visit for work tomorrow. According to ChatGPT: Ashford, Kent, is known for several key features and attractions: Transport Hub High-Speed Rail: Ashford International Station offers Eurostar services (historically) and high-speed trains to London St Pancras in under 40 minutes. Road Links: It is a major transport hub with the M20 motorway, providing direct access to London and the Channel Tunnel. Best for getting out of it."
