["https://danielsavage.uk/2025/01/01/a-sober"]
title = "A Sober 2025 | Daniel Savage"
description = "I’ve decided to go through 2025 with a theme in mind. In 2024 I focused on doing well at work, keeping the job I recently got, learning quickly, and becoming a valued member of the team. I think I achieved that pretty well. My finances that were lacking in 2023,  have improved and given me a bit of breathing room. I have the opportunity to build on this in 2025. But work isn’t my priority this year."
full_description = "I’ve decided to go through 2025 with a theme in mind. In 2024 I focused on doing well at work, keeping the job I recently got, learning quickly, and becoming a valued member of the team. I think I achieved that pretty well. My finances that were lacking in 2023, have improved and given me a bit of breathing room. I have the opportunity to build on this in 2025. But work isn’t my priority this year. In 2025, I want to prioritise my health. Specifically, the thing I want to address is my alcohol intake. In fact, if I’m truly honest, I have an alcohol problem. I’m a binge drinker. I enjoy a proper sesh, and I’ve been pretty (see: very) good at them over the years. But I’m turning 37 this year, and my body, mind and soul are becoming increasing damaged by alcohol and its effects. The anxiety, depression, and shame of hangovers are debilitating. The tiredness and lack of cognitive function takes days to subside. The bad decisions are bordering problematic. I don’t want to have to hit the typical alcoholic “rock bottom” before I change course, but that looks more likely the longer I let this continue. I can quit now and say thanks for all the fun. If I can regain control over drink, and complete 365 days of sobriety (and more), I think it will have unimaginably positive consequences. I will be a better friend, son, brother, colleague and human being."
year_published = 2025
clearnet = "https://danielsavage.uk/2025/01/01/a-sober"
