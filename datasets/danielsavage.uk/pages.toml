o through 2025 with a theme in mind. In 2024 I focused on doing well at work, keeping the job I recently got, learning quickly, and becoming a valued member of the team. I think I achieved that pretty well. My finances that were lacking in 2023, have improved and given me a bit of breathing room. I have the opportunity to build on this in 2025. But work isn’t my priority this year. Read More → Cultural Diet - December 2024 31 Dec 2024 A run down of everything I’ve consumed this month. After November’s hectic gig schedule, this month was rather quieter with the festive holidays in mind. As we got closer to the winter solstice and it got dark and cold from 2pm, staying in and watching TV or a film became my preferred choice. I hope you had a wonderful and peaceful Christmas break and you’re looking forward with hope into 2025. Read More →"
