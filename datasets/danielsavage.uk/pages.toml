["https://danielsavage.uk/categories/music"]
title = "music | Daniel Savage"
full_description = "Cultural Diet - January 2025 4 Feb 2025 A run down of everything I’ve consumed this month. January was long. And busy. And sober. Work has been getting busier and so I’ve fallen into a trap of putting something on in the background in the evening and barely paying attention. Gigs are back in Feb though, got some good ones in the diary. Read More → There is Thrill in the Friction 8 Jan 2025 This post is part of the IndieWeb Carnival, V.H. Belvadi is hosting this initiative for January. Read More → Cultural Diet - December 2024 31 Dec 2024 A run down of everything I’ve consumed this month. After November’s hectic gig schedule, this month was rather quieter with the festive holidays in mind. As we got closer to the winter solstice and it got dark and cold from 2pm, staying in and watching TV or a film became my preferred choice. I hope you had a wonderful and peaceful Christmas break and you’re looking forward with hope into 2025. Read More → 19 Dec 2024 🎵Now Playing: This Is Lorelei - Box for Buddy, Box for Star (2024) This was The Lovely Robin’s™️ best album of the year, and it had completely passed me by so I thought I’d throw it on today. A lovely piece of work. Best Tracks: Perfect Hand I’m All F****d Up Dancing in the Club An Extra Beat for You and Me 18 Dec 2024 🎵Now Playing: Biffy Clyro - Infinity Land (2004) Not gone through the back catalogue of Biffy for a while. Blackened Sky is still my favourite album but this occasionally bangs. Best Tracks: Glitter and Trauma Wave Upon Wave Upon Wave 16 Dec 2024 🎵Now Playing: TV on the Radio - Dear Science (2008) I only remembered I love this band over the weekend so had to play this album today. Great way to start the week. Best Tracks: Halfway Home Crying Golden Age Shout Me Out DLZ 5 Dec 2024 🎵Now Playing: Laura Marling - Patterns (2024) Laura Marling is a perfect artist. She’s already one of my favourite gigs of all time, and this album is a stripped back, beautiful, tender, moving piece of work. Sublime. Best Tracks: Child of Mine No One’s Gonna Love You Like I Can Caroline Looking Back 3 Dec 2024 🎵Now Playing: Joshua Idehen - Mum Does The Washing EP (2024) My Spotify algorithm came good suggesting this to me. Absolutely loved it. Sharp, clever, heartfelt lyrics with great production. I see he’s playing Manchester in April, might have to grab a ticket. Best Tracks: Mum Does The Washing Could Be Forever Tactics for Survival Once in a Lifetime (Talking Heads cover) Cultural Diet - November 2024 2 Dec 2024 A run down of everything I’ve consumed this month. November has been busy. I’ve overdone it and December is supposed to be the month of excess. It has, however, also been fun. And that’s important too. Read More → 29 Nov 2024 🎵Now Playing: Yannis & The Yaw - Lagos Paris London EP (2024) A dream collaboration between The Foals singer and the legendary drummer Tony Allen. Result is a Foals-y sound with the groove turned up to 11. Best tracks: Rain Can’t Reach Us Clementine"
