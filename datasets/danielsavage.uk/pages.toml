["https://danielsavage.uk/about"]
title = "👋About | Daniel Savage"
description = """
Daniel Savage is trying very hard to exist. If you want to exist, then being born is pretty much a necessity.
I happened to be born in London, the capital of a small angry island nation, in 1988. I moved to Manchester when I was one, which is very lucky considering it is the world’s greatest city*.
I am a creative. I would like to call myself an artist, but “creative” feels right for now."""
full_description = "Daniel Savage is trying very hard to exist. If you want to exist, then being born is pretty much a necessity. I happened to be born in London, the capital of a small angry island nation, in 1988. I moved to Manchester when I was one, which is very lucky considering it is the world’s greatest city*. I am a creative. I would like to call myself an artist, but “creative” feels right for now. I have written plays, acted, and performed music and comedy. I would like to draw, paint, and make more music. I am currently attempting to spend my year alcohol free Feb Update. I recently stopped running the world’s best pub quiz** and now work as an IT Consultant for money. Sadly, if you want to exist, you need money. I have previously worked for money as a: Finance Administrator Scenic Artist Festival Site Crew (Décor) Music Promoter Charity Operations Manager There is so much money in the world, and I keep hoping it will be distributed fairly between us so we can all exist happily together. I am also a dreamer. I live with my cat, Domino. He is the world’s greatest cat***. *debatable **debatable ***fight me"
