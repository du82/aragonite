["https://danielsavage.uk/2024/12/31/cultural-diet-december"]
title = "Cultural Diet - December 2024 | Daniel Savage"
description = """
A run down of everything I’ve consumed this month. After November’s hectic gig schedule, this month was rather quieter with the festive holidays in mind. As we got closer to the winter solstice and it got dark and cold from 2pm, staying in and watching TV or a film became my preferred choice.
I hope you had a wonderful and peaceful Christmas break and you’re looking forward with hope into 2025."""
full_description = "A run down of everything I’ve consumed this month. After November’s hectic gig schedule, this month was rather quieter with the festive holidays in mind. As we got closer to the winter solstice and it got dark and cold from 2pm, staying in and watching TV or a film became my preferred choice. I hope you had a wonderful and peaceful Christmas break and you’re looking forward with hope into 2025. Music This is Lorelei - Box for Buddy, Box for Star Biffy Clyro - Infinity Land TV on the Radio - Dear Science Laura Marling - Patterns In Repeat Joshua Inehen - Mum Does The Washing EP Gigs 27-12-24 - The Songs Of Black Sabbath @ The Golden Lion, Todmorden - An amazingly heavy night of covers, by an incredible band headed by frontman Mike Vennart. Superb music, superb pub. ⭐️⭐️⭐️⭐️⭐️ TV A Man on the Inside S1 (Netflix) - Cosy, witty, warm show about a guy undercover in an old peoples home. Liked it. ⭐️⭐️⭐️⭐️ The Madness (Netflix) - Strong start that slowly petered out but fun all the same. ⭐️⭐️⭐️ The Day of the Jackal S1 (Sky) - Loved this. Fantastic cast. Action packed. Superb. ⭐️⭐️⭐️⭐️ Somebody Somewhere S1-3 (Sky) - A beautiful, tender, funny sitcom that really surprised me. Wonderful the whole way through and played with such exquisite skill and humanity from the cast. ⭐️⭐️⭐️⭐️⭐️ Black Doves S1 (Netflix) - Another good one. Another action one. But with more swearing and blood and accents than the others. ⭐️⭐️⭐️⭐️ Dune: Prophecy (Sky) - Did I like this? I mean I watched it all. And there were some good bits but it all felt quite slow. ⭐️⭐️⭐️ Bad Sisters S2 (Apple TV+) - Not as good as the first series (which was tremendous) but had its moments. ⭐️⭐️⭐️ Gavin & Stacey Finale (BBC) - A satisfying ending to a much loved sitcom. ⭐️⭐️⭐️⭐️ Film Blitz (Apple TV+) ⭐️⭐️⭐️ The Preacher’s Wife (BBC) ⭐️⭐️⭐️ A Shot in the Dark (Amazon Prime) ⭐️⭐️⭐️ Love Lies Bleeding (Amazon Prime) ⭐️⭐️⭐️⭐️ Home Alone (Channel 4) ⭐️⭐️⭐️⭐️⭐️ Wallace & Gromit: Vengeance Most Fowl (BBC) ⭐️⭐️⭐️⭐️ Jurassic Park (BBC) ⭐️⭐️⭐️⭐️⭐️ Uncle Buck (BBC) ⭐️⭐️⭐️⭐️ Carry-On (Netflix) ⭐️⭐️ The Goonies (ITV) ⭐️⭐️⭐️ Sport 01-12-24 Manchester United vs Everton @ Old Trafford - United win 4-0, the feel good factor seemed to be back… not for long though. Still, a great day out. 14-12-24 Altrincham FC vs Sutton United @ The J. Davidson Stadium - Altrincham win 1-0. It was freezing but had a good catch up with some mates."
year_published = 2024
