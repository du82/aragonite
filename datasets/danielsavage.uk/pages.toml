["https://danielsavage.uk/categories/microposts/page/2"]
title = "Microposts | Daniel Savage"
full_description = "2 Feb 2025 Nearly made myself cry because I don’t understand how wireless headphones work. 25 Jan 2025 On the train to Newcastle to meet my niece for the very first time 👶🏻. There’s some beautiful views out of the window, Storm Éowyn nowhere to be seen. 22 Jan 2025 Spent the last couple of hours beginning a new Obsidian vault to start fresh and reorganise my notes into something more manageable and future proof. This could take some time (and does it even matter). 21 Jan 2025 🎵Now Playing: Bob Dylan - Blood on the Tracks (1975) Haven’t seen A Complete Unknown yet. But today felt like a Bob day, and this is currently my favourite album of his. He’s a genius. Favourite tracks: Tangled Up In Blue Simple Twist of Fate Idiot Wind If You See Her, Say Hello Shelter from the Storm Buckets of Rain 20 Jan 2025 Decided I will be ignoring and refusing to get involved with/read/comment on anything to do with trumps inauguration except to say this: a collection of the most uncool, corrupt, unintelligent, unloved fucking losers will all be in a room together and I’d love that room to fall into hell itself. 17 Jan 2025 Amad’s hat-trick last night. 00’s Forever all day on 6music today. Wedding tomorrow. Happy days. 16 Jan 2025 🎵Now Playing: Aldous Harding - Warm Chris (2022) Huge fan of Aldous Harding and I realised I hadn’t given this album much of a listen when it was released. Not quite as much oddness to the folk as in previous albums (or maybe I’m used to it), but enough to keep it interesting. Lovely stuff. Favourite Tracks: Tick Tock Fever Lawn Passion Babe Leathery Whip 9 Jan 2025 News: I became an Uncle today. 9 Jan 2025 Delighted to hear Lauren Laverne is well and coming back to 6music. Moving to the 10.30am-1pm time-slot is great. I chose the right time to start listening again. 8 Jan 2025 I realise I haven’t shared any cat (🐈‍⬛) content here, so here is Domino - the world’s laziest colleague."
