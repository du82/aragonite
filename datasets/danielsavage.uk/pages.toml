full_description = "I track all my gigs on setlist.fm. You can also see a list of the festivals I’ve attended. Going forwards, when I go to a gig I’ll blog about it. Favourites Radiohead @ Glastonbury, ENG 2017 Headlining after Royal Blood and The xx on the first day of my first Glasto AKA The Greatest Day of My Life. Paul McCartney @ Glastonbury, ENG 2022 I saw a fucking BEATLE, plus Dave Grohl and Bruce Springsteen. Björk @ Bluedot, ENG 2022 An artist of the highest order, doing an orchestral set. She remoulded my world into hers. Arctic Monkeys @ Benicàssim, ESP 2007 First-ever festival, with the band of my generation on peak form. Elton John @ Glastonbury, ENG 2023 Rocketman’s final ever UK show, and it’s hit after hit after hit. Confidence Man @ Barrowlands, SCO 2022 They’re just the most fun live act you will ever see. Top-tier dance pop. Laura Marling @ Albert Hall, MCR, ENG 2021 A breathtaking intimate solo show post-pandemic, an angel from a better world. Justice @ Glastonbury, ENG 2017 What a way to close out my first Glastonbury. They are cool MFs. The Chemical Brothers @ Glastonbury, UK 2019 Superstar DJs, here we go! The Maccabees @ Albert Hall, MCR, ENG 2016 As part of their final album tour. They split up the year after, and I’m still sad I didn’t see them more. Honourable mentions: Oasis 2005, The Verve 2007, Blur 2009, The Prodigy 2010, The Strokes 2011, The Killers 2013, Caribou 2014, OutKast 2014, IDLES 2024."
