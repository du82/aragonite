["https://danielsavage.uk/2024/12/04/reading-habits-for"]
title = "Reading Habits for 2025 | Daniel Savage"
description = "It’s December, so obviously, I’m in reflection mode—looking back on the year, spotting the wins, and acknowledging where there’s room to improve. One area that I failed at this year was reading more."
full_description = "It’s December, so obviously, I’m in reflection mode—looking back on the year, spotting the wins, and acknowledging where there’s room to improve. One area that I failed at this year was reading more. At the start of the year, I set what felt like an easy goal: one book a month. Surely you can read one book a month, mate. You used to devour books as a child and young adult. But somewhere along the way, the TV and my phone stole the spotlight. Admitting the problem is the first step. I’ve come to terms with the fact that I’m a bit of a dopamine fiend. Accepting that means I can start making real changes. Something Old, Something New Rather than setting an arbitrary target, I’ve decided to focus on reading books I already know I’ll enjoy. 2025 is going to be the year I revisit some of my favourite books. I’ll alternate between re-reading favourites and diving into something new. This way, I can keep building on my library while still savouring the comfort of the books I adore. Of course, none of this will work if I don’t tackle the habits that held me back this year. That means setting boundaries for my screen time before bed. A book on my nightstand, not my phone, should be the last thing I reach for. Nice to have a plan, anyway."
