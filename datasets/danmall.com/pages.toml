full_description = "My father-in-law (a retired pastor) shared with me a simple framework he crafted from many years of preaching sermons week after week. Every good story has these three components: Most people don’t know how to tell a good story, but that’s easily solved with this simple trick. You’ll soon have your listeners hanging on your every word! Join 60,200+ subscribers to the weekly Dan Mall Teaches newsletter. I promise to keep my communication light and valuable! I’m Dan Mall: creative director, designer, founder, entrepreneur, and author. I ran design systems consultancy SuperFriendly for over a decade. Now I share as much as I can to create better opportunities for people who wouldn’t have them otherwise. Currently creating Great Job! and Design System University. Learn more about me. This site is built on Eleventy, hosted on Netlify, and typeset in Fabriga by LuxTypo, Ecra by DSType, and Space Mono by Colophon. © 2005 – 2025 Dan Mall Teaches. All rights reserved. Thou shalt not steal—but feel free to remix. Privacy Policy."
