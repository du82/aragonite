["https://danmall.com/posts/2021-year-in-review"]
title = "“2021 Year in Review,” an article by Dan Mall"
description = "The ups and downs of 2021."
full_description = "2021 marks the first full year my family and I have lived in our dream house. In general, I think of this as a calm house. It’s quiet. Maybe that’s the neighborhood. Maybe that’s the open floor plan or the minimal interior. Maybe we moved here in the middle of a recommended quarantine and there wasn’t much to do, so we didn’t do much other than be home with each other. I don’t exactly know why it is, but I like it. The school district here is amazing; the kids seem to love it. I think they’re doing a great job of managing to keep the kids as safe as they can amidst a global pandemic that continues to ebb and flow. Sidda has a teacher that makes learning fun. He seems to spend a lot of time developing his students’ critical thinking skills, and I’m grateful for that on behalf of Sidda’s future self. I’m sad that she no longer goes to school with her best friend since preschool, but we organize frequent enough play dates for them to spend time together. Charlie seems to like her friends a lot more at the new school, and she seems to have a lot more of them here too. This year, I saw Em start and immediately crush a new career in interior design. She’s so good at everything she does. Our dog Max seemed to need a friend, so we got him Matilda (Tilly for short). They seem to get along fine enough, although there are a little too many “I’m the big brother” moments for my liking, even though she’s already way bigger than he is. Our new house has a pool. It’s the first time I’ve lived in a house with a pool, so I learned how to swim this summer. I’m so proud of myself for this! I’ve loved being in the water since I was a kid, but I never knew how to tread water or figure out what to do with my breathing. I watched this video, paid pretty close attention to my kids’ swim teacher, and practiced every day for at least an hour or two. By the end of the summer, I was swimming! I’m still not a strong swimmer, but I’m not afraid of being in the 10-foot deep end of our pool since I can tread water enough + know how to blow bubbles underwater, at least enough to casually make my way to the edge before I get too tired. Next summer, my goal is to be able to jump off our diving board without holding my nose!"
