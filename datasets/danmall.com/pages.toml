["https://danmall.com/posts/folly-of-design-system-foundations"]
title = "“The Folly of Design System “Foundations”,” an article by Dan Mall"
description = "The idea of “foundations” is one of the biggest threats to creating a design system people use."
full_description = "When creating a physical structure like a building, a foundation is pretty dang important, for lots of reasons. Most importantly, in the words of This Old House, the foundation “should last forever.” In fact, there’s a good argument to be made that many software development practices exist to decouple reliance on as many “forever” pieces as possible. Merging capabilities in version control systems allow us to edit, remove, or augment any part of the product at any time without damaging the rest of the codebase. Removing the first line of code ever written in any given piece of software is only ever one pull request away. Digital products are our modern day ships of Theseus. I’m not entirely sure where the idea that the first step in creating a good digital product starts by establishing “foundations” like color and typography came from. Perhaps it’s a relic of the waterfall methodology that implies that creating digital products is a series of dependencies that build upon each other. The danger of thinking about anything in a digital product as a “foundation” is that it implies you must focus on this thing first, that everything else needs to be built on this supporting structure. Lest we get too pedantic here, I’m talking as much about the idea of “foundations” as the specific word. The logic still applies whether you call them “foundations,” “base,” “core,” “fundamentals,” or any other synonym. Whatever the reason, our sample size of prospective clients and customers suggest this is a legitimately preconceived notion. One of the most frequent questions we got when we launched our Design System in 90 Days workbook is about the lack of content about establishing color, typography, and spacing guidelines, referred to by most of the people asking as “foundations.” The main reason it’s not in the workbook is because we think there are at least 52 more important things to focus on in the first 90 days. Blasphemy, I know!"
year_published = 2022
clearnet = "https://danmall.com/posts/folly-of-design-system-foundations"
