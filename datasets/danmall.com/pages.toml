["https://danmall.com/posts/581-miles"]
title = "“581 Miles,” an article by Dan Mall"
description = "Practice professional bravado."
full_description = "I’ve never been to a Buc-ee’s before so I don’t know anything about it, but the internet tells me that it’s a chain of travel centers and gas stations known for clean bathrooms. Despite my unfamiliarity, I’m always impressed by the swagger of this sign. To be so bold as to suggest I drive 581 miles in the opposite direction to visit this place is audacious. And honestly, it kinda makes me want to. Whether you’re trying to attract new clients/customers or lobbying for a promotion at work, is your pitch as confident as “↶ 581 miles?” Join 60,200+ subscribers to the weekly Dan Mall Teaches newsletter. I promise to keep my communication light and valuable! I’m Dan Mall: creative director, designer, founder, entrepreneur, and author. I ran design systems consultancy SuperFriendly for over a decade. Now I share as much as I can to create better opportunities for people who wouldn’t have them otherwise. Currently creating Great Job! and Design System University. Learn more about me. This site is built on Eleventy, hosted on Netlify, and typeset in Fabriga by LuxTypo, Ecra by DSType, and Space Mono by Colophon. © 2005 – 2025 Dan Mall Teaches. All rights reserved. Thou shalt not steal—but feel free to remix. Privacy Policy."
