["https://danmall.com/posts/2018-year-in-review"]
title = "“2018 Year in Review,” an article by Dan Mall"
description = "The ups and downs of 2018."
full_description = "I didn’t think I was one for year-end round-ups, but reading Dave Rupert’s made me want to do one of my own. I’m generally a “glass half full” kind-of-guy, so while 2018 had both ups and downs, it was a pretty good year overall. In no particular order, some observations about my year and what I’m looking forward to for 2019. Em and I celebrated our ten-year wedding anniversary in 2018! We wanted to do a big celebration bash, but alas: we’re both pretty terrible at follow-through for this kind of thing, so it never happened. We’ve hired some help this time around, so hopefully we’ll celebrate our 11th anniversary in 2019 with the Ma11 Ba11 (I know, I know… my logo designer is showing). Parenting 2 daughters is more fun than it’s ever been. I’ll admit: as much as I tried to be a present and active dad, I wasn’t really sure how to have fun and play with them as babies. That was really difficult for me. Now that they’re older, I love so many more of the things we can do together! We've been playing a lot of board games like Clue, Battleship, and Taboo. Sidda reads books and comics in her bed as a way to fall asleep every night. (She’s currently into the Raina Telgemeier series.) She started ice skating lessons too and is loving that. We're talking about taking a trip together soon, just the two of us. Charlie’s asked me to give her piano lessons and practices on her own without prompting. She's frustrated that she can’t read like big sis, which I think is the exact motivation that’s going to get her to read. She draws letters constantly. They both learned to swim this summer; Sidda’s pretty fearless in the water now, while Char is still a bit hesitant. I bet one more summer of swimming will build that full confidence. They’re also in the same school again after a year of being in different schools. It's a little weird as Seventh-day Adventists to have them in a Catholic school, but the school is great and it gives us the opportunity to talk about things like confirmation and baptism and whether or not they want to take part, which we leave up to them. It's also interesting to see them figure out how their relationship as sisters compares to their relationship to their friends."
year_published = 2019
