["https://danmall.com/posts/titles-are-important"]
title = "“Titles are Important,” an article by Dan Mall"
description = "Don’t believe anyone that tells you otherwise."
full_description = "Every few months or so, someone on Twitter will start a conversation about industry titles. Is UX Strategist the same as UX Architect? Is it better to be a Graphic Designer instead of a UI or Visual Designer? I’ll admit: these conversations generally lead me to expunge a sigh of “ugh, this again” frustration just before I giddily chime in, but there’s one specific reaction that I can’t stand. Almost inevitably, someone will contribute this gem: “Titles don’t matter.” That’s usually followed up with some qualifier like “just do good work and the rest will follow“ or “make things you love.” Utter crap. I’ll admit: I’m a pedant and thoroughly enjoy analyzing the nuances between “Experience Designer” and “User Experience Designer.” But even more than an entertaining discussion for an afternoon, titles are useful for two main reasons: Your title tells your colleagues how to interact with you.I’ve worked with and seen 30-person teams where everyone has the title of “Designer.” It’s no coincidence that these teams often have trouble resolving conflict when two of them disagree. They resort to dumb things like voting or punt the decision to testing instead of using some of the skills that make designers so valuable like intuition and experience. Add a “Senior” or “Junior” in front of one of their titles and the conflict clears up almost immediately, because everyone knows who to look to for answers by default. When I was an Art Director, my Junior Designers knew that they could come to me for guidance and safety, even on their first days on the job before we had established much trust or rapport.Your title also defines your scope of responsibility. This is useful for you as well as for others. I once coached with a team where everyone was—I kid you not—a “Maker.” Who makes what? In that regime, it was incredibly unclear who was supposed to make a site map. Something as simple as changing to “Copywriter” and “Designer” made it clear at once what each person was expected (and not expected) to do."
year_published = 2015
