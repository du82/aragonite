["https://danmall.com/posts/what-is-a-design-system"]
title = "“What is a Design System?” an article by Dan Mall"
description = "6 different types of design systems."
full_description = "What is a design system? You’ve probably heard lots about them. You may have even worked on one, but you still struggle to define it. There are many great design system books out there. Let’s see what their authors have to say about design systems: A set of connected patterns and shared practices, coherently organized to serve the purposes of a digital product. Design systems bring order and consistency to digital products. They help to protect the brand, elevate the user experience, and increase the speed and efficiency of how we design and build products. A collection of reusable components, guided by clear standards, that can be assembled together to build any number of applications. A library of visual style, components, and other concerns documented and released by an individual, team, or community as code and design tools so that adopting products can be more efficient and cohesive. I think it’s because there are a lot of different definitions of the word “design” and of the word “system,” and both are very broad. A set of things—people, cells, molecules, or whatever—interconnected in such a way that they produce their own pattern of behavior over time. Put those two things together and it says something to the effect of “An intentional set of connected things that create repeated behavior.” That could apply to almost anything! In my design systems work, I’ve noticed 6 different kinds of things that can be described as design systems: Brand identities and design/visual languages are the oldest and most common version of what people in general know as a design system. This has been around from as early as cave paintings. A design language refers to all of the different visual elements that make up a brand or a particular user interface design. That could be the colors, the typography, the spacing, the layout, all of the different visual components that combine so that a brand is recognizable. Tools are some of the most common instances of digital design systems we see. UI kits are great examples. We see these a lot when we talk about software applications like Figma or Sketch, where we have these libraries of visual components that we can drag and drop into other interfaces to make it easier to design those interfaces all at once. Websites like Design Systems for Figma display a gallery of UI kits that different teams have used and open-sourced so you get a sense of how these libraries are connected with symbols and components that can be reassembled."
year_published = 2023
