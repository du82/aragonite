["https://danmall.com/posts/superfri-end"]
title = "“superfriEnd,” an article by Dan Mall"
description = "I’m shutting SuperFriendly down."
full_description = "My oldest daughter was 6 months old, and I wanted a way to be around her and my wife for as many hours of the day as I could be while still providing for our family. I believed in a different way of working, and I wanted to test it all out. Remote work and distributed work were fairly uncommon at time, but I believed people could work asynchronously from wherever they wanted and do better work because of it. I believed people didn’t have to be fellow employees to be an effective team. I believed getting paid for outcomes aligned customer and provider more closely than charging for time. I believed teaching clients how to do what I and we do without us is a better service that making them reliant on the partnership. I believed freelancers could simultaneously operated independently and still have career paths, growth trajectories, and community. I believed all of those things fit together under one business model pretty well. More than ten years later, I still believe all of those things, even stronger than I originally did, partly because I have proof of it now. I’m also happy that there are more people in the world who seem to believe these things too. When I started SuperFriendly, I remember having to pitch prospective clients on the value of distributed team; now much of the world works this way (or at least have had 1–2 years of forced experience in it). Network-based digital businesses were fairly rare a decade ago; now I feel like every agency out there pitches “a network of freelancers, custom assembled for each client.” I’m not arrogant enough to think SuperFriendly was responsible for that progression—heck, I stole it too—but I do like to think we contributed to it in some small way. I’m very proud of the work we’ve done. More importantly, I’m proud of the way we did it. Personally, through SuperFriendly, I’ve had a chance to do some of the best work of my career. In a lot of ways, SuperFriendly is the best work of my career (so far). One day, I’ll find a way to share some of the work few have seen in a way that honors it."
year_published = 2022
