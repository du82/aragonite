["https://danmall.com/posts/ask"]
title = "“Ask,” an article by Dan Mall"
description = "You shall receive."
full_description = "I’m fortunate to receive a significant number of emails and direct messages where someone is looking for some advice or momentary mentorship from me. I’m wondering if you’d want to be on my podcast. I’d love to have you on if you’re interested. I try and take these for the positive spirit which I assume they’re intended. I’m honored that people reach out to learn from me or want to involve me in what they’re doing; I don’t take that lightly. The thing that bugs me about them is that there’s no actual request here. I can certainly infer and assume what they’re looking for, but I know what happens when I assume. I realize I’m nitpicking, but details matter. One of the most common reasons people don’t get what they want is that what they’re asking for is unclear. Here are a few tips to help you make your desires more direct. When our kids were toddlers, my wife and I would redirect their whining with this phrase, “A whine is probably a question you’re not asking. What’s your question? Is there something you want?” It was a really helpful technique in turning a hot-tempered “I don’t like peas!” to “Can I please have asparagus instead?” Lest we think this behavior is found only in children, I was on a sales call the other day where the person on the other end spent the first 25 minutes of our call giving me “context.” Once they got to a natural pause, I asked, honestly puzzled, “What can I help with?” They spent the next 10 minutes telling me their plan. I asked again, “What can I help with?” They spent the next 5 minutes telling me what some of their personal weaknesses were. While all the info was great, I still didn’t really know what they wanted from me. I eventually left the call bewildered. When you’re asking something of someone, you probably want the result more than they want do it for you, so it behooves you to do the work. The more difficult question you ask, the less likely it is that you’ll get your desired answer."
year_published = 2020
