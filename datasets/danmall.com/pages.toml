["https://danmall.com/posts/better-webcam-video"]
title = "“Better Webcam Video,” an article by Dan Mall"
description = "Stepping up quality for video calls."
full_description = "In running a completely distributed agency, I spend a signficant portion of my day on video calls. Like, most days, the majority of my day. So, if my colleagues and I have to spend a lot of time looking at my mug, I might as well try to make that a more pleasant experience for everyone involved. The initial inspiration for this goes to Aaron Shekey. I saw a tweet of his that talked about switching from a built-in webcam to a proper camera, and I was immediately off to research how to do this. Luckily, he wrote a post about his setup, and I’m doing most of the things he is, with a few minor modifications. Thanks for all of this, Aaron! I use an Olympus mirrorless camera for my webcam with a pancake lens that has a pretty wide aperture (f/1.7) so I can get some pretty shallow depth of field. The camera is pretty light—which is part of the reason I got this particular camera in the first place—but it’s not light enough to sit on top of a monitor like a typical external webcam. So, I use a tabletop tripod to hold it steady, which also has the added benefit of being able to position it at the exact height as well as place on my desk that I want. Since it’s next to my laptop where I typically leave my video call screen (usually Zoom but occasionally Google Hangouts), it appears to people on the call that I’m looking slightly offscreen. I could look directly into the camera, but then I wouldn’t be able to see the people I’m talking to, which is what I prefer. I may tweak this setup in the future to see if I can achieve both simultaneously. The Elgato Cam Link with HDMI to Micro HDMI cable is what makes all of this possible. (If you’re using a different camera, be aware that you might need a HDMI to Mini HDMI cable instead of a HDMI to Micro HDMI cable.) Once it’s set it, you can switch to this camera as a video input just like you would any other webcam (built into a monitor or external). I typically get about 1½ – 2 hours of straight video time, which is pretty decent. But, since I’m on video calls a lot, I always have 2 spare batteries charging for a quick swap in case a battery dies in the middle of a call."
year_published = 2020
