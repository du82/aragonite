["https://danmall.com/posts/2022-year-in-review"]
title = "“2022 Year in Review,” an article by Dan Mall"
description = "The ups and downs of 2022."
full_description = "Continuing the tradition from 2021, 2020, 2019, and 2018, here’s my reflection on 2022. (Disclosure: this post contains affiliate links for some of the products I mention and/or recommend.) I ended last year’s review with the goals of doing less, laughing more, and eating delicious food with family and friends. One of my favorite things this year was getting and playing the game Hearing Things. I have a pretty good poker face when playing games, but something about this game makes me convulse with laughter… like, can’t-catch-my-breath, gotta-run-out-of-the-room-to-compose-myself laughter. I’ve loved playing this game over the last year with my family and friends. One pattern I’ve learned about myself is that I like a clear mental load before undertaking any big new endeavor, even if I don’t know what said endeavor will be yet. For two years, my startup Arcade has occupied my brain space, but I was dedicating very little time to working on it. I had to admit to my co-founders Mike Carbone and Leslie Camacho that I didn’t see a way that I could devote the appropriate amount of time and effort to being the CEO of this company. We decided to wind it down. I’m grateful for the brain space back, and I’m sad that I still don’t have the design tokens tool I want. Maybe I’ll revisit this idea again someday. Deciding to shut down SuperFriendly—the agency I’d run for over a decade—was the most impactful thing for me this year. The last two years included a lot of volatility for SuperFriendly, like soaring revenue with dwindling profits, the end of trying to scale up, a shift away from the longstanding contractor staffing model, and more. As I got more involved in coaching our clients last year, I realized how much I wanted to run a business with teaching more as the core than deliverables. I didn’t know how to make SuperFriendly the vehicle for this, so it felt like time to shut these doors. After 10 years, 9 months, and 6 days in business, SuperFriendly will file its final tax return in 2022."
year_published = 2022
