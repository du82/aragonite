["https://danmall.com/posts/2020-year-in-review"]
title = "“2020 Year in Review,” an article by Dan Mall"
description = "The ups and downs of 2020."
full_description = "I really enjoyed writing “year in review” posts for 2019 and 2018, so I think this is officially a tradition now. Our family takes pride in adventuring together, and boy was 2020 an adventure. Our adventures typically involve traveling on planes, but that definitely didn’t happen this year. Instead, the adventures took the form of being together a lot. 9-year old Sidda and 7-year old Charlie go to a Catholic school that held in-person classes, but Em and I didn’t feel comfortable doing that, so we opted for virtual school for the first semester to see how the school handled such an unprecedented event. That was difficult. The kids handled it like champs, but introverted Em and I really felt the lack of our own space since we were all home, all the time. We had a welcome reprieve when my parents offered to do school with the kids 2 days a week so they could have some change of scenery and Em and I could get some personal space back. Parenting kids in virtual school was tough. I pride myself on being pretty digitally savvy, but I just couldn’t get my head straight about how and when to submit assignments; what platforms to use between Google Classroom, ClassDojo, and others; when to print which handouts for the day, and lots more. I contemplated getting in touch with the school and offering to run all of their digital platform stuff for the kids, parents, and teachers, but taking on something new that big felt just as stressful as dealing with it. So we dealt with it. Em realized that dealing with homework sorting and submitting stressed her out, and I realized that sitting with the kids while in school was frustrating to me while I tried to get work done, so we switched: Em sat with the kids while they were “in class,” and I took over when school was done and they got into homework time. Come report card time, the kids got mediocre grades, not because they weren’t learning the material, but because I didn’t submit assignments on time or at the right place. Cue flashbacks of me in school learning all the stuff but not caring enough about the administrivia. Trigger city."
year_published = 2021
