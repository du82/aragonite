["https://danmall.com/posts/2023-year-in-review"]
title = "“2023 Year in Review,” an article by Dan Mall"
description = "The ups and downs of 2023."
full_description = "Continuing the tradition from 2022, 2021, 2020, 2019, and 2018, here’s my reflection on 2023. (Disclosure: this post contains affiliate links for some of the products I mention and/or recommend.) 2023 was the first full year that I wasn’t an employee of a company since 2007. (I worked for other agencies from 2007–2012, and then I was a salaried employee of my agency SuperFriendly from 2012–2022. Dan Mall Teaches is an LLC, so I’m now a sole proprietor for the first time, not an employee.) My big work goal for 2023 was to transition fully away from selling my time, but I wasn’t able to do that. Still, I’m very grateful to the small list of clients who trusted me to help them this past year: Peloton, The New York Times, NSMBL, Supernova, Figma, Zeplin/Omlet, and The Valoram Group. As someone who has only worked at agencies or run his own, the in-house position grass is constantly greener. Combined with drastically changing my business and a looming recession, that field is downright emerald. I have a running alert on LinkedIn for jobs I might be suited for. From the end of 2022 to now, I’ve participated in 3 interview processes: I’ve heard many stories of others who have had much worse job-hunting experiences than I have, but even my small sample size has turned me off to the idea that there’s a place out there that would value me as much as I would value them. I think I’ll keep my professional destiny in my own hands for now. In last year’s Year in Review post, I mentioned wanting to explore how I could make mentoring, advising, and coaching part of my year. I loved every second of working with them. Both are super sharp and hungry to learn and improve. The strategies we formed together allowed me to bring my experience and creativity to the table. But both were paying for these sessions personally and could only afford so much, despite seeing tremendous value in it. I also opened up a week at the end of the year where people could book a paid hour with me to talk about anything they wanted to. A few people did this; they all said it was helpful, but I didn’t feel like I was delivering enough value for what they were paying."
year_published = 2023
