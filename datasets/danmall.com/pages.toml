["https://danmall.com/posts/choosing-between-two-good-options"]
title = "“Choosing Between Two Good Options,” an article by Dan Mall"
description = "How do you decide?"
full_description = "Deciding between a good option and a bad option is easy. Should I eat the medium rare ribeye or a live king cobra? I'll have the steak, please. Deciding between two good options is much more difficult. Should I drive the Lamborghini today or the Ferrari? (Hey, a man can dream.) I have a tough decision between two great options to make this weekend. I started Dan Mall Teaches to pursue teaching and content creation full-time, and I’m almost able to fully do that. But, I’ve taken on a few small consulting gigs to pay the bills and because they’re fun and interesting. One of those gigs is with a great company that has a lot of interesting opportunities. I work with them for 1½ days each week, consulting on how to establish and grow their design system. I like the people I work with there—I know some folks from there read this newsletter… you know I’m enjoying our work together!—and they pay well, and early. My contract with them expires at the end of February. I had some Dan Mall Teaches projects lined up for March in case they didn’t want to extend our contract, and I’m pumped for these projects the more I think about them. But, in a conversation today, they mentioned that they’d love to extend our work, and they’ve already earmarked funds for me until June. How lucky I am! And also, quite the dilemma! In some ways, I wish they would have told me that they don’t want to renew, because the decision would have been made for me. And sure: I still have 3 days each week that I can work on my own stuff. But I’m used to working with clients full-time. Consulting part-time is new for me. I can’t help but think about ideas for my clients on my “off days.” It’s not the time I want back; it’s the mental space. Lately, I’m burdened from the weight of context switching. Years ago, I actively tested my limits and learned that I could work on 12 simultaneous projects without feeling like I was dropping too much. But even if I can do that, I don’t like it. I’m craving focus. I want an answer to the question, “What would my work look like if I was able to wholly focus on it?”"
year_published = 2023
