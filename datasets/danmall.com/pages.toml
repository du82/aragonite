["https://danmall.com/posts/commarts-interactive-2020"]
title = "“Communication Arts Interactive 2020,” an article by Dan Mall"
description = "A rundown of the kind of work I want to see awarded in this year’s competition."
full_description = "When I was first learning design, the Communication Arts annuals were often my go-to resource for best-in-class inspiration. I’m thrilled to be on the jury for the 2020 Interactive Awards along with Guillaume Braun of Akufen, Jacinte Faria of Stink Studios, Hayley Hughes of Shopify, and Phillip Tiongson of Potion. Historically, the work awarded in this show and others like it has typically been apps, microsites, installations, and other short-lived pieces, tied to some advertising campaign or marketing push. This makes sense, as awards like this tend to be highly coveted by ad agencies and production shops as a way to somewhat objectively endorse work in an otherwise unregulated industry. In last year’s Interactive Annual, 31 of the 37 awarded pieces were tied to a campaign of some sort. That’s not a complaint. I’ve always loved work like Tool of North America’s Jurassic Box Experience, and I hope we continue to see that kind of submission. But I do hope to see some more work that typically goes unheralded. I’d like to see more sites, not microsites. I’d like to see apps that people use regularly, not apps that have a 6-week shelf life, where all that’s left to reference it is a sizzle reel. I’m optimistic that this isn’t outside of the spirit of this competition. While the Commarts Interactive competition has traditionally only featured jurors that work in advertising, recent years have seen more jurors from product companies like Megan Meeker of Lyft and Libby Bawcombe of NPR. That’s a noteworthy signal that product work can be as inspiring and exciting as advertising. I love that last year’s jury awarded sites like Cowboy by Ueno, The Cool Club by Wonderland, and Rapha by Work & Co. These are sites that command the same level of polish found in any good ad campaign but perform a business function for the company in addition to a marketing function. This is the kind of work I think we should celebrate more. I’d love to award work that demonstrates creative use of the highest level of color contrast ratios and works well on assistive devices. I’d love to award work that’s still useful when JavaScript fails. I’d love to award work that shows smart thinking and strategy in addition to flawless execution and art direction. I’d love to award work that serves business and user needs. I’d love to award the Flighty app. I’d love to award Gov.uk’s Get ready for Brexit guide. I’d love to award the flagship Lyft app in addition to the Lyft Auto Tunes campaign. I’d love to award The Guardian’s guide to digital design. I’d love to award the Airtable and Notion platforms, not solely their apps or sites."
