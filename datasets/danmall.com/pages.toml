full_description = "A six-part video series featuring Josh Clark, Brad Frost, and me that highlight our recommendations and experience for design systems at the largest scale. Made with our friends at InVision. I discuss best practices for design system adoption with Nathan Curtis and Zack Phillipps, moderated by Nico Carmosino from Omlet. A conversation with Hayley Hughes, Ben Callahan, Vitaly Friedman, and me about how design systems work, what they can do for your teams, and how to manage them without crippling your creativity. Design systems are a hot topic, but how do you make sure your design system is useful? More importantly, how do you make sure people actually use it? In this episode, I “teach” Jason Lengstorf the fundamentals of design systems live and how they can help you be more effective. Design systems advocate and Material Design relations manager Jina Anne and I sit down together to answer questions about remote working, community, rebranding, typography, and more. I talk to Tommy Geoco about the current state of design systems, how to manage complexity in a product with a lot of moving parts, and how to build your team’s first design system in 90 days. Design system documentation has been maturing at a rapid pace over the last five years. how we document is an opportunity for us to stop, reflect and figure out the biggest challenges that face us in how we document and grow our design systems. Frederick Weiss and I talk about starting a design system-focused agency, a design systems course, and more. As follow-up, Amy Hupe, Nathan Curtis, and I discuss whether speed a healthy metric to track for design systems. The nuances of freelancing, contracting, and why this maybe a very viable path right now in today’s market. Alexis Collado and I talk through creating leveling and growth paths for freelancers and intentionality behind your freelance work lifestyle. I talk to an audience of agency owners to help them identify their shop’s unique advantages, 