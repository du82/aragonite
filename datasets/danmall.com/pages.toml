["https://danmall.com/posts/clients-by-brand-color"]
title = "“Clients by Brand Color,” an article by Dan Mall"
description = "Celebrating clients over the years."
full_description = "As I’m getting ready to close up shop for the year and recharge for 2019, I’m in a reflective mood. Every year, I’m incredibly privileged to work with clients that pay me to do something I enjoy, and this year was no exception. After SuperFriendly’s first year of business in 2012, I published an annual report that looked at workload, clients, and tasks at a high level. Visualizing data in aggregate like this has always helped me be intentional what I’m currently doing and what I might want to change moving forward. 2019 will mark year seven for SuperFriendly. As a Seventh-day Adventist, I’m a big believer in the value of cycles of seven, which often bring completeness and wholeness. It seems like an appropriate time for some more reflection. Here’s a rough breakdown of the distribution of work per year. Clients are represented by their main brand color (at the time of working with them) and roughly sequenced by where the work occurred during the year. Join 60,200+ subscribers to the weekly Dan Mall Teaches newsletter. I promise to keep my communication light and valuable! I’m Dan Mall: creative director, designer, founder, entrepreneur, and author. I ran design systems consultancy SuperFriendly for over a decade. Now I share as much as I can to create better opportunities for people who wouldn’t have them otherwise. Currently creating Great Job! and Design System University. Learn more about me. This site is built on Eleventy, hosted on Netlify, and typeset in Fabriga by LuxTypo, Ecra by DSType, and Space Mono by Colophon. © 2005 – 2025 Dan Mall Teaches. All rights reserved. Thou shalt not steal—but feel free to remix. Privacy Policy."
