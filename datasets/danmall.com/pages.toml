["https://danmall.com/posts/a-design-system-coachs-portfolio"]
title = "“A Design System Coach’s Portfolio,” an article by Dan Mall"
description = "It probably doesn’t look like what you’d expect."
full_description = "I’ve been talking a lot lately about my new products where I teach design systems, so a lot of people have been asking to see design systems that I’ve made. That’s a fair and reasonable request! After all, if you’re going to be taught by someone, you want proof that they know their stuff, right? ​Designing with AI keeps you ahead of the curve. Get full access to video workshops, live learning labs, and exclusive talks with seasoned practitioners. Get 50% off your first month with code DANFRIENDS. Check out designingwith.ai. The standard way that the tech industry typically evaluates whether someone knows their stuff is through the all-powerful Portfolio. There are many definitions of portfolio, but generally, it means “a collection of stuff.” For tech portfolios, that collection of stuff is often images of sites, apps, and other web thangs. Those images usually lack context, which is why we resort to interviews and can’t always hire only from viewing a portfolio. Each image represents a conglomerate of work; which part of that did you do? Did you art direct it? Write the front-end code? Did you design under a supervisor? Did you write the copy? The interview surfaces answers that a portfolio should have provided. When people ask to see my design system work, I think they’re expecting to see a portfolio of some images of Figma UI kits or Storybook installs. That’s a reasonable expectation, but those aren’t the kinds of design systems I work on, even though they partially are. I work with teams of people who are already good at making Figma UI kits and Storybook installs. Their portfolios are full of great examples of UI kits and code libraries. If you’re reading this post for examples of those, here are some great case studies created by some of my students in my Dribbble design system course: But that’s what the portfolios of my students and teams look like. For me to show images of those things are both a misrepresentation of my own work and a misappropriation from the people who directly did that work. I’d be largely showing their work, even though I played a part in it. Said differently, I am not a design system designer or a design system engineer, so my portfolio shouldn’t look like the portfolio of a design system designer or a design system engineer."
year_published = 2023
