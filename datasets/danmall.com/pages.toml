["https://danmall.com/posts/pricing-profitable-projects"]
title = "“Pricing Profitable Projects,” an article by Dan Mall"
description = "Make it work for them and you—in that order."
full_description = "In the last post, I talked about the importance of the early conversations you have with your prospects. Ideally, you’ve dreamt a bit out loud with them, and you now have a good sense of the kind of future they’d love to see materialize. Now it’s time to price your work in a way that’s profitable to both your prospect and you—in that order. This article is part of a 4-part series brought to you by Wix Studio about running valuable projects that grow your clients’ businesses and yours too. Wix Studio is a platform built for agencies and enterprises to create exceptional websites at scale. If you're looking for smart design capabilities and flexible dev tools, Wix Studio is the tool for you. If you’ve had value conversations with your prospect, you’ll likely have heard phrases about their desired future state that you can start to turn into a price. Some phrases are easier to convert than others. The easiest one is making more money. Imagine your prospect said that they can see a future where they’ve turned their current $1 million in annual revenue into $5 million in annual revenue. The value of this particular scenario—shorthand for “the total bounty able to be generated“—is $4 million. A well-positioned agency might envision a combination and sequence of services that might generate an additional $4M in revenue that include improving design, transitioning to a new e-commerce platform, and search engine optimization work. The next question is how much to charge. I typically start at 10% of total value of the scenario, as it’s often small enough to the prospect to be a not-so-painful investment with a great return, and also large enough for me that it’s lucrative. For an opportunity that could generate $4M, I’d set my price at around $400k. If the prospect asks where I got that price, I’d be honest: “The opportunity seems to be generating $4M in additional annual revenue for you, and I typically start at 10% as I thought a 9× return on investment would be great for you and lucrative enough for me to keep my business running.” Every time I mention the price, I’m always sure to talk about it relative to the value. Saying “$400k” certainly induces sticker shock, but saying “$400k to create $4M of additional annual revenue” puts it in much-welcome perspective."
year_published = 2024
