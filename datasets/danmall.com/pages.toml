["https://danmall.com/posts/career-paths-ladders-and-leveling-in-design-systems"]
title = "“Career Paths, Ladders, and Leveling in Design Systems,” an article by Dan Mall"
description = "We need better structure for design system roles and responsibilities."
full_description = "I’ve been involved in design systems long enough to see it evolve from an auxiliary asset (“we made a quick design system to help us be more organized”) to a full-fledged part of an organization (“I work on a design system team full-time”). As design systems and dedicated design system teams become more prevalent and official, we need more support structures to help people evaluate and grow. One of the most popular tools for that is a career ladder that articulates leveling, areas that have little if any standardization for design system teams. Let’s change that! I like how Doordash’s Head of Design Helena Seo describes a team member’s career needs in her article, “Designing” a Career Ladder for Product Design: I want to understand where I stand currently. I want to know what I need to do to get to the next level. Those expectations are usually opaque for a design system professional. Fortunately, there are lots of good models and examples to pull from in adjacent spaces. Design system roles often sit squarely between design, engineering, and product roles. While it’s not exactly right to use them verbatim, they can provide great starting points for remixing. We need to define the criteria that all roles must adhere to, regardless of seniority. The criteria in the Design Team Levels Framework that Peter Merholz originally created for Snagajob is a great starting point: Second: I added 2 columns that say “Looks like” and “Sounds like,” something I learned from Emily Meekins and Wil Reynolds at Seer Interactive. I stole this when creating a handbook for SuperFriends and it really helped to make abstract responsibilities much more tangible. For example, a responsibility in “Cross-functional Meetings” for a Senior (Level 3) person might be “Active planner of the meeting.” That could look like “creates meeting agenda with defined desired outcomes and distributes an agenda to all participants 24-hours before the meeting.” That could sound like, “I took the liberty of drafting an agenda for Thursday’s meeting. You can find it attached to this email.”"
year_published = 2023
