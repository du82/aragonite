["https://danmall.com/posts/my-design-contract-template"]
title = "“My Design Contract Template,” an article by Dan Mall"
description = "Bring it all together by documenting the dream and how you’ll get there together."
full_description = "In the last post, I talked about how to make sure your projects are profitable for both your client and you. In my final installment of this series, I’ll show you how to articulate all of that to set you up for a successful relationship with your client. In other words, I’ll show you how to write a great contract. This article is part of a 4-part series brought to you by Wix Studio about running valuable projects that grow your clients’ businesses and yours too. Wix Studio is a platform built for agencies and enterprises to create exceptional websites at scale. If you're looking for smart design capabilities and flexible dev tools, Wix Studio is the tool for you. Necessary disclaimer: I am not a lawyer, so none of this is legal advice. It’s only stories from my experience. I’m fortunate to have worked with my lawyer to evolve and iterate on my boilerplate agreements for over a decade. (If you’re looking for a great lawyer to work with on your freelance or agency business, look no further than Matt Sherlock.) Before we get into the details of a contract, I’d like to share some of my own ground rules around contracts. First: what a contract is not. A contract is not a proposal. I’ve seen many freelancers and agencies treat a contract like a proposal, a way to provide a few options that a client can choose from. That’s not what a contract is for. Contracts should only contain obligations: what you’re obligated to do for your client and what are they obligated to do for you. The more “coulds” and “shoulds” you have in your contract, the more ambiguous and difficult to enforce it becomes. Shift the “coulds” and “shoulds” to “musts.” Many treat contracts as a zero sum game: in order to get the most, your client has to lose the most. That’s the game that’s played: write a contract that incredibly one-sided, knowing that your client (or client’s lawyers) will negotiate it the other way, and eventually you’ll land close to the middle."
year_published = 2024
