["https://danmall.com/posts/design-systems-prepare-you-for-change"]
title = "“Design Systems Prepare You for Change,” an article by Dan Mall"
description = "The moment where a design system proves its value most."
full_description = "There’s a specific moment where everyone clearly realizes the value of having—or not having—a design system. It’s the largest test of a design system’s effectiveness. First: definitions. “Design system” here doesn’t mean Figma or Sketch files, or brand/design languages. “Design system” means a version-controlled, package-managed, software product that’s a dependency in websites and apps. Many organizations try to spark the flywheel that is the virtuous cycle between design system and product(s) releases, often using a method like the Measuring Spoon Cycle. And it works! They use the flywheel to continue creating and releasing new and updated features and products. Essentially, they use it to continue what they’ve already been doing… except faster, more consistently, and at higher quality—the typical promises of a design system. The return on investment is slow at first. At the beginning, using a design system might take the same time as not using one. Eventually though, the marginal gains start to add up. Teams start saving a week at a time, then 2 weeks, then 4 weeks. That increase in efficiency might take a year or two to start seeing. These changes can be local to a team or be organization-wide. They’re often unplanned, so they bulldoze established roadmaps. Even when they are planned, they’re not trivial to pull off, much less pull off well. In these scenarios, a design system (along with an established design system practice) is a pivotal factor. These processes sometimes take years where a connected design system would make it take weeks. This is where connected systems shine and really prove their value. This is where the ROI is much clearer: do you want this task be months of complicated code updates or days of relatively easy configuration changes? Not surprisingly, these events often inspire people to think, “While we’re doing this, let’s look into creating a design system too.” Creating a design system at one of these inflection points ideally makes the next one easier and smoother."
