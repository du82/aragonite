["https://danmall.com/posts/apprenticeships-superfriendly-academy"]
title = "Apprenticeships,” an article by Dan Mall"
description = "A fantastic solution to bridge the gap between opportunity in tech and those in need of change."
full_description = "Our industry doesn’t do a great job of mixing learning with working. We setup things like weekend hackathons, afterwork programs, and “lunch and learns”—all great endeavors, but their very existence proves that we think of learning as a separate thing from work, that work doesn’t provide ample enough opportunity to develop new skills. Writer and educator David Edwards laments the typical American school system setup in Wired article On Learning by Doing: We “learn,” and after this we “do.” We go to school and then we go to work… This approach does not map very well to personal and professional success in America today. Learning and doing have become inseparable in the face of conditions that invite us to discover. The separation of learning and doing is partly due to our incessant quest for maximum efficiency in the workplace, which is sometimes synonymous with the elimination of failure in the workplace. In her article Strategies for Learning from Failure in the Harvard Business Review, Professor Amy Edmondson describes a spectrum of reasons for failure, with blameworthy types of failure on one end and praiseworthy types on the other. Certainly, we don’t want our coworkers to fail because of deviance or attention, but the elimination of failure unfortunately removes the opportunity for failure through exploratory testing or uncertainty, which are crucial in creative process. Consider the way we hire. Our job pages are strewn with solicitations for “extraordinary people,” prior work of “high quality,” an enthusiasm for those who can “champion ideas,” and countless other superlatives. The subtext is clear: you must be amazing before we hire you, because you certainly aren’t going to gain those skills here. The prerequisite for greatness is as crippling as it is sparse. As a scatter plot measured against a spectrum or skills, that may look something like this (approximation—not drawn to scale): In looking to fill vacant job openings, many tech companies look to the upper echelon of this graph. That results in the skilled becoming even more skilled as they move from job to job, creating a wider gap between those at the top and those at the bottom."
year_published = 2016
