["https://danmall.com/about"]
title = "About Dan Mall"
description = "The long story behind a husband, dad, teacher, creative director, designer, founder, and more."
full_description = "Hi friend! I’m Dan Mall, a husband, dad, teacher, creative director, designer, founder, and entrepreneur from Philly. I share as much as I can to create better opportunities for those who wouldn’t have them otherwise. Most recently, I ran design system consultancy SuperFriendly for over a decade. Now I’m trying to share as much of what I’ve learned to help designers get the respect they deserve. Currently creating Design System University. My Pakistani dad and Filipina mom both emigrated to the U.S., where they met and I was born. I grew up in north Philadelphia. It wasn’t a bad neighborhood, but it wasn’t a good one either. And we weren’t poor, but we weren’t rich either. I watched my parents work hard as an accountant and a nurse to continually raise the standard of living for my brother and me to give us all a better life. I grew up playing music, drawing, reading comic books, and watching Disney movies. When I was 8, my dad bought us a computer. When I was 12, a relative dropped off some pirated copies of Photoshop and Flash. When I got to college, I discovered design. I was fortunate to get an internship through my college that turned into another internship that turned into becoming a founder member of 2 agencies that turned into running design at a digital agency that turned into starting my own agency and running it for over a decade now. (I’ll tell the full version of these stories someday.) I’ve been blessed to learn so many things from so many people in my career of 24 years so far, and I’d love to share as much of it as I can with you. Em (my wife) and I met when we were both in fifth grade. She’s been with me from the beginning of my journey to learn how to be a designer and as I’ve grown in that practice. She’s always been my biggest supporter and my best creative director. Just because I’m able to push pixels around a screen, we’ve been able to provide a great life for our daughters Sidda and Charlie and enjoy experiences together from playing in the sand of some of the world’s most beautiful beaches to hanging out at home together to dogsledding on a glacier in Alaska and so much more."
