["https://danmall.com/posts/stealing-your-way-to-original-designs"]
title = "“Stealing Your Way to Original Designs,” an article by Dan Mall"
description = "There’s nothing new under the sun."
full_description = "I have a framework that I find very helpful in teaching my apprentices how to design. It’s 3 steps: The first step to being just a competent designer—or a competent anything, for that matter—is doing what someone else can do. It’s a test: can you follow directions? Except, instead of following directions you read or hear, you follow directions that you see. It’s no coincidence that junior designers often get trained up by doing production work after an art director has set an art direction. If the art director makes the main headline 48px bold Helvetica with 16px of margin on each side, do you do the same on every screen you design? Sounds simple, but many junior designers struggle to even get this down. Why? Many want to be chefs but aren’t willing to be line cooks first. It’s not glamorous work, but it builds design muscles, muscles that you’ll need in order to get better and advance to the next step. Think of it like learning to draw by tracing. In fact, it’s literally the same thing. The first few assignments of my designers’ apprenticeships are taking screenshots of existing websites, pasting them into Sketch or Photoshop, dropping the opacity and locking the layer, and tracing over it to produce the same layout, colors, illustrations, typography, and everything else needed to reproduce the site pixel for pixel. In his article Copy If You Can: Improving Your UI Design Skills With Copywork, Erik Kennedy extols the virtues of copywork as a great way to practice and hone UI design skills. Even more, it gets you out of going to your usual bag of tricks and instead gives you new ones to add. Whether new to design or a seasoned creative director, this simple exercise will get you warmed up, like stretching before a long run. Once you can confidently imitate any style you come across, you can start to tweak the elements to feel more custom to the way you need to use it. This step has the least parameters and needs the least guidelines, because it’s up to your imagination and the amount of changes you’re willing to try."
year_published = 2017
