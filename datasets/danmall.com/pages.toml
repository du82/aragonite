["https://danmall.com/posts/2019-year-in-review"]
title = "“2019 Year in Review,” an article by Dan Mall"
description = "The ups and downs of 2019"
full_description = "I really enjoyed writing last year’s in review as it was a good way to assess the year and look forward to the next one. Naturally, here’s one for 2019! As we ring in the new year and new decade, it seems like a good time to for me to look back at the last year and decade and take inventory. In 2009, Em and I left Philly where she had lived for over a decade and I had lived for most almost two decades to try on New York as one of our first big adventures as a married couple. I left a dream job at Happy Cog, turned down a dream offer from Facebook, a took another dream job at Big Spaceship. (And yes, I know how privileged I am to have any one of those things, much less all three. I don’t take any of it for granted. I have nothing but extreme gratitude in my heart for all of those opportunities and do my best to pass it on and provide the same opportunities for as many others as possible.) On this day in 2009, I awoke to 7 missed calls from my Mom, saying my Grandma passed away peacefully in her sleep. I miss her terribly every day, but the hundreds of memories I have of her make me smile every time I think of her. In the decade since, we’ve moved back to Philly with renewed fervor for the city, quit my band, created two spectacular daughters, started an agency, started (and left) a podcast, wrote a book, started (and left) a SaaS product, ate some delicious food, and traveled around the world. Em and I celebrated our 11th anniversary in 2019! We were going to throw a big bash called the Ma11 Ba11 Mall Ball—get it?—but then we realized that it would really stress out these two introverts to plan and throw a giant party and that we’d much rather travel together. So we spent a long weekend in Cuba instead! Overall, our family had lots of fun adventures together in 2019. Sidda and Charlie are now 8 years old and 6 years old respectively. There’s lots of interesting things to share about them, but I’m also increasingly more inclined to keep their personal details private. Suffice it to say that the older they get, the more I’m enjoying being their dad. And the more the four of us grow together,the deeper and more interesting and exciting our family relationship gets. It’s easy at times and difficult at times, and I’m lucky to be a part of all of it."
