["https://danmall.com/posts/2024-year-in-review"]
title = "“2024 Year in Review,” an article by Dan Mall"
description = "The ups and downs of 2024."
full_description = "Continuing the tradition from 2023, 2022, 2021, 2020, 2019, and 2018, here’s my reflection on 2024. For the past 6 years, I’ve organized my year in review posts by topic, ordered lightly by the topics that seemed most top-of-mind. This year, I’m choosing a slightly different framing: the life I’d like to live. I’ve started to hone this over the last year and a half, and I’m getting comfortable enough with it to start using it more actively and using it as a lens to view the things I did and choices I made. At the end of 2023, I chose a theme word—actually 2—for 2024: “strengthening & stretching.” I didn’t explain it any more to anyone who asked, but I intended a few things by it. First: physically. I don’t see myself as very physically strong or flexible. I wanted to work on improving this. Secondly: mentally, emotionally, and psychologically. I’m a “do everything to the best of your ability” kind of person, or I’d rather not do it at all. I wanted to make sure that everything I did in 2024 was something that made me stronger and something that stretched me in some way. More on all of this below. The shorthand that has resonated most and longest for me is Ramit Sethi’s idea of a “Rich Life”. Though the name indicates a specific financial status, it’s more than that. As Sethi describes: A Rich Life is your ideal life—one where you look at your personal relationships, your finances, and your ordinary days and say, “Wow!” But it still feels very singular, solitary, and self-centered. While I appreciate that, I found a passage in Scott Galloway’s The Algebra of Wealth that addresses nicely addresses the gap for me: An obsession with career and money (beyond what you could ever spend) begins to diminish what is the source of real satisfaction: relationships. Yes! That trifecta works well for me: 1) being free to do things I really enjoy to the fullest 2) with little worry of cost 3) and sharing that with people I enjoy. The best name I’ve arrived at so far to encompass all that is a “Full Life List.” I’m open to a better label, but I’m sticking with that for now."
