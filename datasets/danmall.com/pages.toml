["https://danmall.com/posts/measuring-quality-with-design-systems"]
title = "“Measuring Quality with Design Systems,” an article by Dan Mall"
description = "Part 2 of a conversation between Amy Hupe, Nathan Curtis, and Dan Mall."
full_description = "As a follow up to our previous conversation about measuring speed with design systems, Amy, Nathan, and I recorded another chat about measuring quality. Many thanks to Lucijan Blagonić for capturing these notes about the conversation! (Links added afterwards.) General takeaway: You have to build the idea into the company culture that it is OK to go back and change things, and the idea should be ingrained in the product teams. Join 60,200+ subscribers to the weekly Dan Mall Teaches newsletter. I promise to keep my communication light and valuable! I’m Dan Mall: creative director, designer, founder, entrepreneur, and author. I ran design systems consultancy SuperFriendly for over a decade. Now I share as much as I can to create better opportunities for people who wouldn’t have them otherwise. Currently creating Great Job! and Design System University. Learn more about me. This site is built on Eleventy, hosted on Netlify, and typeset in Fabriga by LuxTypo, Ecra by DSType, and Space Mono by Colophon. © 2005 – 2025 Dan Mall Teaches. All rights reserved. Thou shalt not steal—but feel free to remix. Privacy Policy."
