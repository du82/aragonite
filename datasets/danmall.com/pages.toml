["https://danmall.com/posts/a-response-to-hiring-help"]
title = "“A Response to ‘Hiring Help,’” an article by Dan Mall"
description = "Opportunity or exploitation?"
full_description = "Some saw what I was offering as an opportunity for them. Some saw it as exploitative. And many were somewhere in-between. One reply in particular was something I’d like to share. This person opted to send it privately, for fear of vitriol towards them and me. They also gave me permission to share it anonymously. Ugh, Dan… I’ve always admired your work and your contributions to the design community. But admittedly, these thoughts on hiring gave me pause. It took some courage to share my concerns, as I'm aware of the potential backlash (let's be honest, as a junior myself, this lone message could completely derail my career), but I felt morally compelled to speak up here. Offering lower-rate junior-level compensation for someone who can exceed your own expectations (120%?!) is exploitative, especially in the current economic climate. I understand the desire to find someone who can go above and beyond, as you do for your clients. But expecting that level of performance for a significantly lower wage than industry standards, without even the guise of mentorship (again you are asking for senior-level top performers), feels disingenuous. It's one thing to ask for a little extra effort from your employee, it's another thing entirely to systematically underpay them while expecting them to over-perform. I know you have already mentioned that you do not aim to exploit anyone, but the every other word on the page seems to contradict that in practice. I mean, at one point, you even mention that you believe this person would be easy to find specifically because the market right now is tough. You mention that your inbox is bursting. That’s extremely disappointing to hear and is exploitive by definition. I know that $36k/year was on the lower end of the spectrum you listed but just to put some things into perspective, that is less than $18 an hour for a 40 hour workweek. It’s dangerously close to the federal poverty line for a family of 3, not to mention that the poverty line is already pretty outdated and fraudulently optimistic. I would argue that $30k/year (or $36k/year) should be considered poverty for even a family of one, in most American cities. To even suggest that is appropriate is extremely insulting. $60k/year is obviously better, but still very questionable as a junior, let alone a senior-level employee giving the role their all. If we are talking a 20 hour workweek instead (you did mention this) things start to look even more fair. But I would warn you run the risk of attracting candidates that look good on paper but aren't fully committed - not top talent. When you are barely paying enough for survival and offering no additional benefits, it means the only real benefit left is that the role could be a stepping stone. You are almost encouraging a revolving door."
year_published = 2024
