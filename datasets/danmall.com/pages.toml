["https://danmall.com/posts/2023-adirondacks-fall-foliage-photography-trip"]
title = "“2023 Adirondacks Fall Foliage Photography Trip,” an article by Dan Mall"
description = "A special trip during a special time of year."
full_description = "For the last 3 years, I’ve made an annual tradition of taking advantage of living on the east coast of the U.S. to take photo of the changing foliage during this time of year. This year, I visited the legendary Adirondack Mountains. I managed to rope in a few friends to join me: Chris Rivera, Matt Sherlock, and Jesse Gardner. We’d been watching the fall foliage prediction map for weeks, and it seemed our trip was perfectly timed for peak color. Late afternoon, Chris’ wife dropped him off at my house and we went to pick up Matt. The three of us had shot photos together before, but it had been a while since we’d seen each other, so we spent most of the initial time of the car ride catching up on what was new in our lives. Jesse lived a lot closer, so he headed to our Lake Placid Airbnb to settle in. After a Jersey Mike’s dinner (not a sponsor) and 2 stops to charge my Tesla, we finally arrived at the Airbnb a little after midnight to crash. We chose our bedrooms and agreed to do a sunrise shoot in the morning. I unpacked my clothes and gear, finally getting to sleep around 2:00am. I woke up at our agreed time of 5:30am to catch sunrise. The forecast called for rain all day, so we were hoping that would mean a foggy scene at Mirror Lake. Unfortunately, it was already pouring pretty hard by the time we got there. Defeated, we retreated to the Downtown Diner for breakfast to fuel up and regroup. Pancakes, waffles, eggs, and coffee gave us the courage to decide that we were going to shoot in the rain. I scoured my phone for inspiration for fall photos that looked good in the rain, most of which were forest-y shots. Our sunset plan that night was walk around the shore of Heart Lake then hike to the top of Mount Jo, but we decided to go earlier and scout out around since sunset didn’t seem promising because of a full day of rain. On the way there, we stopped at a few pull-offs to shoot some incredible scenery, including the Olympic Jumping Complex. We mosied over to Heart Lake to shoot the shoreline in the rain. I got the foggy lake shots I wanted, but we were completely drenched."
