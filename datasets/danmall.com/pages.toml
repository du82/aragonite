["https://danmall.com/posts/attracting-5-6-and-7-figure-clients"]
title = "“Attracting 5-, 6-, and 7-Figure Clients,” an article by Dan Mall"
description = "Take your client service to the next level."
full_description = "This article is part of a 4-part series brought to you by Wix Studio about running valuable projects that grow your clients’ businesses and yours too. Wix Studio is a platform built for agencies and enterprises to create exceptional websites at scale. If you're looking for smart design capabilities and flexible dev tools, Wix Studio is the tool for you. For the next 4 weeks, I’ll be writing a series of newsletters for freelancers and agency owners who want to take their work to the next level in terms of professionalism, income, and reputation. These newsletters will draw from my experience of doing client services for the last 20 years. From 2004–2012, I worked at agencies, honing my craft, and freelancing regularly on the side. From 2012–2022, I ran my own agency called SuperFriendly. In my first year, I made $416,636 working primarily by myself with 2-3 contractors to help out every once in a while. 8 years in, SuperFriendly made $3M in revenue with 1 full-time employee—me!—and a team of 70 contractors. We worked with some of the most well-known clients in the world like Nike, Google, Apple, The New York Times, ESPN, FX Networks, and more. I’ll share some of the lessons I learned along the way to help you learn how to do your version of this in your own practice, whether you’re a sole freelancer, run your own small studio of a handful of folks, or lead a big agency. Almost every inflection point in running a design business requires the same thing: more money. That’s why “how do I make more money” is a constant question that lives rent-free in the minds of freelancers and agency owners. The common answer is to raise your rates. It’s true that many professionals are undercharging for their services due to some combination of insecurity, lack of understanding of their market, and their limiting views of money. But I see a more rampant problem. Too many freelance and agency businesses aren’t positioned well enough to even have conversations about highly-priced work. What I’ve learned is that fixing your positioning solves a lot of pricing problems."
