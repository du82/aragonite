["https://danmall.com/posts/choose-your-hard"]
title = "“Choose Your Hard,” an article by Dan Mall"
description = "Take the hard way out."
full_description = "Most difficult decisions are generally a choice between two hard things. This is generally undesirable. Humans try to optimize for decisions to a choice between something good and something bad. But that’s not a choice at all. Of course we pick the good one! Receive $10 or get punched in the face? Money please! For decisions that are a bit more ambiguous, we still try to paint one as good as the other as bad when we can, or at least position one as better than the other. That’s the idea behind the common “pros vs. cons” list. The choice with more “pros” is seemingly “better,“ so we pick that one. That is: decide in advance what type of hard you prefer. This allows you to skip the part where you look for the more optimal option. There might not be one, or you might overspend your time trying to find it. Once you hone in on the type of hard you prefer, it won't always make decisions easier, but it will usually make them faster. In most important decisions, we’re not always looking for the solution as much as we're trying to find agency, some amount of power to affect our own future. Choosing your hard can give you that. Next time you’re at an impasse, choose the kind of hard you prefer. It’s a great way to help you build some momentum. Join 60,200+ subscribers to the weekly Dan Mall Teaches newsletter. I promise to keep my communication light and valuable! I’m Dan Mall: creative director, designer, founder, entrepreneur, and author. I ran design systems consultancy SuperFriendly for over a decade. Now I share as much as I can to create better opportunities for people who wouldn’t have them otherwise. Currently creating Great Job! and Design System University. Learn more about me. This site is built on Eleventy, hosted on Netlify, and typeset in Fabriga by LuxTypo, Ecra by DSType, and Space Mono by Colophon. © 2005 – 2025 Dan Mall Teaches. All rights reserved. Thou shalt not steal—but feel free to remix. Privacy Policy."
