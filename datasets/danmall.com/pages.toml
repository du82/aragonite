["https://danmall.com/posts/behind-the-curtain"]
title = "“Behind the Curtain,” an article by Dan Mall"
description = "Mid-life crisis abounds."
full_description = "These are just a few messages I’ve received lately from some of my friends and social media followers. I also feel wholly delusional about it, as what people seem to be seeing about me doesn’t match the way I feel about what I’ve been doing lately. I seem to have done what I abhor: sharing only the Instagram version of my life and career and obfuscating the bumps. Of course, I’d like to qualify “struggles” here. Maslow’s Hierarchy of Needs gives me some helpful concepts and language. I’m lucky and grateful that I’ve almost never had to struggle with getting physiological, safety and security, and love and belonging needs in my life. I’m struggling with self-esteem and self-actualization needs, which is a privilege and a problem. I recently came across this framing, which gives me even more helpful language. I’m experience growth needs, not deficiency needs. Here’s how Maslow distinguished growth needs: Yes! I feel seen. I’m thankfully not lacking anything, but I feel stuck on how I can be growing right now. I don’t know if I fully believe this, but I can’t stop thinking about the William S. Burroughs quote: “When you stop growing, you start dying.” Oh, and to put a fine point on it, I’m fully aware that I am smack dab in the middle of my mid-life crisis. Mid-life crises are often brought on by a trigger event. In the last few years: I shut down my business of 10 years, had some significant family events, turned 40, and experienced a global pandemic with the rest of the world. I think those qualify as ample trigger events. Even though I’m aware of this, I know I can’t do anything to stop it. I’m accepting going through it and identifying what’s both in and out of my control. Here are some things I wish I could control that I’m working on accepting instead. A lot of my current struggles have something to do with money. This comes in different forms, from different angles. Overall, I don’t have as much money as I used to or that I’m used to. A lot of feelings comes with that."
year_published = 2024
