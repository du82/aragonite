title = "Dan Mall’s Posts"
description = "Read about how to grow in design systems, design process, and design leadership."
full_description = "There’s a narrow window for effective design system work. It sits squarely in the center of a spectrum that’s too easy to slide towards one end or the other. How designers, engineers, writers, and DesignOps contribute to a design system effort, by the numbers. A cognitive bias in which there’s a tendency to notice something more often, leading someone to believe that it has an increased frequency of occurrence. A digital nomad is defined as someone who uses technology, especially a laptop and a wireless network, to work remotely from anywhere in the world. A surprisoligist explains why it feels good when the unexpected is sprung on us, and why surprise is actually good for us. SuperFriendly’s worst year to date and one of my biggest professional failures. Time for a big change. Embracing the difference in pattern types is the key to making a modular design system infinitely more scalable. A primer on creative direction as compared to art direction and design… and what they all mean in a digital context. I’m Dan Mall: creative director, designer, founder, entrepreneur, and author. I ran design systems consultancy SuperFriendly for over a decade. Now I share as much as I can to create better opportunities for people who wouldn’t have them otherwise. Currently creating Great Job! and Design System University. Learn more about me. This site is built on Eleventy, hosted on Netlify, and typeset in Fabriga by LuxTypo, Ecra by DSType, and Space Mono by Colophon. © 2005 – 2025 Dan Mall Teaches. All rights reserved. Thou shalt not steal—but feel free to remix. Privacy Policy."
