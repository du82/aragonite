["https://danmall.com/articles/my-experience-with-laser-eye-surgery"]
title = "“My Experience with Laser Eye Surgery,” an article by Dan Mall"
description = "A play-by-play."
full_description = "I started wearing glasses in 1995, and I switched to contacts in 1999. Two days ago—twenty years later—I got laser eye surgery. Here’s the play-by-play. In my 2018 Year in Review, I mentioned wanting to investigate being done with glasses and contacts for good. So a month ago, I quickly Google-search for the closest laser eye surgery place1 and go in for a consultation. After a brief eye exam, they tell me that my -2.5 left eye prescription and -3.25 right eye prescription make me eligible for the procedure. This article is more about my experience than it is a review of the LASIK office I got the surgery done. If you’re curious about how I picked, it was mostly based on a combination what was close by and reading great reviews on Google and Facebook. Eyes naturally change over time, so apparently about 5% of patients need an enhancement after a few years. They give me two different prices: $3,902 for the surgery with a lifetime plan that covers enhancements for life and $2,611 that only covers enhancements for 2 years after the initial surgery. They also offer a $200 incentive on each plan if I do the procedure before the end of the month. I don’t have enough time to do the procedure and recover before some upcoming travel, so I put it off a few weeks, which gives me some additional time to think about it. Knowing a little bit about how people set prices, the $200 incentive clues me in to the possibility that they might need the business more than I want to have unassisted perfect vision. A month later, I call back to schedule the procedure, and I tell them that I’d love to do the lifetime plan but that I don’t really want to spend more than $3,000 on this. After a brief hold, they say that, in addition to the original $200 discount they offered, they can do an additional $500 off for local customers, bringing the total to $3,202. I accept their clearly-fabricated but still-gracious additional discount and pick a date for the procedure. They offered financing too, but I’m generally not a fan of that. I’m not very disciplined when it comes to using credit, so I’ll often choose to wait until I have the money to pay for what I want in full."
year_published = 2019
