["https://danmall.com/posts/a-sneak-peek-of-the-new-danmallcom"]
title = "“A Sneak Peek of the New DanMall.com,” an article by Dan Mall"
description = "Let’s talk flowers."
full_description = "If all goes well, I’ll be launching my new website in the next week or two. Fingers crossed! 🤞🏽 In the meantime, I figured I’d share a few behind-the-scenes thoughts that you might be interested in. One of the earliest thoughts I had about a new site is that I wanted it to be beautiful. And I don’t mean beautiful in a “someone in the know can appreciate the understated beauty in the nuance of subconscious design elements like whitespace and typographic subtleties.” I mean any human in the world can viscerally react, “Wow, that’s gorgeous.” I really like my current site. From a functional perspective, it does a lot of things for me. But it isn’t beautiful, not in that visceral way. And beauty is such an important part of design. As digital design evolved over the last two decades, the industry started to realize the impact of design at increasingly larger scales. Naturally, efficiency through systems became more valuable too. My career has also evolved in lockstep with the industry. Where I started making standalone microsites and brochureware one-and-done websites grew into working with clients who manage hundreds of digital products that serve millions and billions of customers. In that kind of work, beauty quietly recedes in the list of priorities. Understandably so, there’s a growing notion that people who work on design systems—that’s me—don’t, can’t, or won’t make beautiful things. Part of my goals for this new site is to prove that notion wrong. For some reason, I associate beauty with nature. One of the most beautiful things I can think of is a pile of flowers. I’ve often had the shallow thought that “I should make my website have flowers all over.” But I’m a fairly left-brained designer, the kind who always has to have a reason for everything on the screen. I couldn’t think of a reason for adding a bunch of flowers other than I liked it, which is the exact kind of logic I caution younger designers against. “Don’t just include stuff because you like it,” I’d hear myself scolding them. “It has to have a purpose!” And yet, if I was ever gonna include something just for the sake of it, my personal website would be the place, no?"
year_published = 2025
