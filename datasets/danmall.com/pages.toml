["https://danmall.com/posts/config-2023-recap"]
title = "“Config 2023 Recap,” an article by Dan Mall"
description = "What’s really special about in-person conferences."
full_description = "I just got back home from 5 days in San Francisco for Figma’s Config. At 8,500 in-person attendees (and many more online), it was the largest conference I’ve ever attended and spoken at. I’ve been to almost 300 conferences since I started speaking in 2008; this post contains my reflections on Config 2023 as well as some general tips about how I make the most of a conference experience. I meet with many people who are discouraged about their design systems. That could be because they’re just starting and they foresee a daunting mountain of work ahead of them. Or, they’ve had a design system for years and are disheartened at the lack of traction against their expectations or see steadily accruing design or technical debt. I wanted to do a talk that encouraged everyone that it may not be as bad as it seems, and I wanted to share actionable tips that attendees could put into practice immediately. I’m honored that my talk was selected among thousands of submitted proposals. The preparation process to give a talk at Config was rigorous. They assign a content reviewer that helps you prepare your talk for the 2 months leading up to the event. Luckily for me, I was paired with my longtime friend Rogie King. It usually takes me about 3–4 weeks to create a talk from scratch. Fortunately, this was a talk that I’ve given before a few times, so I only needed a few tweaks to get it tailored to the audience at Config. A few days before the event, Rogie messaged me to ask if I’d be willing to take part in a design competition on stage that turned out to be Figmatch. Given that I’ve had practice doing this kind of thing before, I happily obliged! My team was amazing: I was partnered up with Clara Ujiie, Anna Fine, and Joey Lamelas. I hadn’t met any of them before, but I’ve been admirers of their work for a while. In our initial prep, I sneakily volunteered to take on any onstage presentation duties so they could focus on designing. I brought my best dad jokes and trash talk. The strategy paid off: the audience voted us the winners!"
year_published = 2023
clearnet = "https://danmall.com/posts/config-2023-recap"
