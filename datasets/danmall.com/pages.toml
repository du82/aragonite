["https://danmall.com/posts/adults-can-be-wrong"]
title = "“Adults Can Be Wrong,” an article by Dan Mall"
description = "You don’t have to take their word for it."
full_description = "My mom was Seventh-Day Adventist, and my dad was Pentecostal, so our family went to church on Saturdays and Sundays. As with all good church kids, we learned the Ten Commandments. One Sunday at the Pentecostal church, we were going through them. I raised my hand to ask the Sunday School teacher to clarify. “Excuse me, you said ‘Sunday’ but you meant ‘Sabbath,’ right?” That's not what I learned at the Seventh-Day Adventist church. In Sabbath School, they said that Saturday was the Sabbath. I said as much. They said I was wrong. I insisted. They kicked me out and told me to go sit with my parents. For a shy, straight-A’s kid who never had anything close to a disciplinary issue before, this was embarrassing and humiliating. Kicked out for something I learned? As I sat with my parents processing it all in my mind, a thought dawned on me. A group of adults taught me that Saturday was the Sabbath. A different group of adults taught me that Sunday was the Sabbath. One of these groups of adults was wrong. Or maybe both groups were. Either way, the lesson is the same: This was a new idea to me. I was a generally compliant, obedient kid. I listened to my parents, my grandparents, my teachers, my uncles and aunts, and other adult authority figures because I assumed they were always right. But what if I didn’t have to? What if adults were sharing their opinions and beliefs and not always truth? This is the kind of thinking that turns some kids rebellious, but it didn’t go that direction for me for whatever reason. Instead of being rebellious, I became curious. I became discerning. I learned to value my own opinions. I didn’t reject what adults said, but I didn’t accept it as truth. I’m rarely insubordinate, but I do value alignment over authority. I’m always agreeable but I don’t always agree. I didn’t become skeptical or cynical; I learned to develop a worldview and measured ideas against it. Even though I’m an adult now, there are still “adults” in my personal and professional life, people I think are “supposed” to be respected and whose word is to be taken at face value as truth: elders, politicians, people in charge of something, clients, bosses, managers, and more."
