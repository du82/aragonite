["https://danmall.com/posts/avengers-endgame"]
title = "“Avengers: Endgame,” an article by Dan Mall"
description = "My review. Major spoilers included."
full_description = "I’m saying it again: spoilers included below. If you haven’t seen Endgame yet and you’re the kind of person that gets upset if they know things going into a movie, don’t read any further. Spoilers included for not just Endgame but also Interstellar, Looper, Back to the Future, The Time Traveler’s Wife, Ant-Man and the Wasp, Doctor Strange, Spider-Man: Into the Spider Verse, and Infinity War. You’ve been warned. As my buddies on Comic Book Junto say, 3… 2… 1… if you’re reading past this point, it’s your fault. Overall, the movie was great. As the final chapter in an 11-year, 22-movie arc, the stakes couldn’t have been higher. And Endgame delivered. The amount of characters and storylines to incorporate was staggering. But what Joss Whedon failed to do in Age of Ultron, Endgame directors Anthony and Joe Russo and writers Stephen McFeely and Christopher Markus handled as well as could be imagined. I’ve only seen it once so far and intend to many times over, but I doubt I’ll much of my positive opinion will change upon subsequent viewings. There is one thing, though, that I take issue with: time travel. When we first sat down in the theater, Em nonchalantly whispered to me, “I bet they go back in time and everyone comes back to life.” 1 I go to great lengths to avoid spoilers, which to me means anything that reveals anything about a movie. That’s a trailer, a poster, a plot point, fan theories… anything. My most enjoyable movie viewings are ones where I have no clue what’s happening. Any expectations I have really affect my movie experiences. And then Scott Lang goes on to tell everybody about the quantum realm and seals the deal with the phrase “time heist,” which makes me involuntary produce a simultaneous “sigh & eye-roll” combo a suburban Philadelphia movie theater has ever seen. As soon as you open the “time travel” door, things get… science-y. Even if you don’t know it specifically, time travel is about special relativity, which quickly brings up questions like the twin paradox, grandfather paradox, and the like."
year_published = 2019
