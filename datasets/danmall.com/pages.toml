["https://danmall.com/posts/2024-stowe-fall-foliage-photography-trip"]
title = "“2024 Stowe Fall Foliage Photography Trip,” an article by Dan Mall"
description = "A special trip during a special time of year."
full_description = "Because I’ve been doing it for more than 3 years now, it’s officially a tradition: my annual fall foliage photography trip. In prior years, I’ve gone with my family or a few close friends. Last year, we went to the Adirondacks. This year, I opened it up to the internet. Together with new and old friends Dani Crosby, Angelika Fuellemann, Jesse Gardner, Chris Rivera, and Matt Sherlock, we spent a few days in Stowe, VT, capturing the beauty of this special season of the year. Just after ushering my kids out the door for school, I packed the car with snacks and sped off to pick up Chris and Matt to make our way towards Stowe. The great conversation made the 8+ hour trip fly by, and we settled in at our Airbnb before we knew it. Shortly after, Dani, Jesse, and Angelika all trickled in from their respective journeys. Pizza and salads were delivered, and we had a short orientation to get to know each other and our agenda for the next 2 days. I brought printed itineraries for everyone and a pile of books about Vermont fall photography to get everyone inspired. We shared gear and photography tips so everyone felt comfortable enough shooting over the next few days. We met at 6:15am at the viewpoint of our first location: the famous Stowe Community Church, the quintessential white church against a sea of warm colors. The sun rose at 6:50am, but, because the church is in front of some hills, it would be another hour still before the sun crested over the peaks. We waited it out and were treated to a ton of different looks as fog rolled through the valley. We only intended to stay for an hour or so but ended up being there for almost 3 hours since the light kept changing and there was constantly new looks to photograph. I picked this as our first location because it’s relatively easy to shoot and get good photos and I wanted everyone to start the trip with a win. Ironically, while everyone else got good shots, I psyched myself out a bit. I had been to this location 3 years ago and got a great shot. Part of wanting to return here was to see for myself how much I had grown as a photographer. Unfortunately, my shots here weren’t nearly as good as when I was first here. I was a bit discouraged by that, but it led me to a few creative alternatives. First, I set up my GoPro for the whole time and got an amazing 3-hour time lapse. Secondly, Dani was shooting with a Leica Q2 Monochrom, a camera that shoots black and white. That’s a pretty bold choice for a fall foliage shoot… I was initially thinking that could be either awesome or a disaster. After looking over her shoulder of her first few shots, they were incredible! Super dramatic and moody, and it made me reconsider the shots I was taking. I figured I’d also try my hand at a few black-and-whites of this location. Not sure that I nailed anything, but it definitely got me looking at the scene differently."
year_published = 2024
