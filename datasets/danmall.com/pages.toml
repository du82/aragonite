description = "A daily routine for a COVID-19 world."
full_description = "From 2012–2019, I ran a 9-month apprenticeship at SuperFriendly for people new to design and development that wanted to make their way into the tech industry. I’ve previously written about why apprenticeships are valuable and what format I used; here are the details about how I ran them. My previous system worked really well for me until it didn’t. So far, I’m liking this system a lot. Even if things go “back to normal” and the kids go back to school in the fall, I may still keep this schedule, or something similar to it. I’ve found very little difference in productivity in currently working 25–30 hours per week as opposed to my previous 35–45 hours per week. In fact, I may be more productive now—and happier with what I’m doing too. Join 60,200+ subscribers to the weekly Dan Mall Teaches newsletter. I promise to keep my communication light and valuable! I’m Dan Mall: creative director, designer, founder, entrepreneur, and author. I ran design systems consultancy SuperFriendly for over a decade. Now I share as much as I can to create better opportunities for people who wouldn’t have them otherwise. Currently creating Great Job! and Design System University. Learn more about me. This site is built on Eleventy, hosted on Netlify, and typeset in Fabriga by LuxTypo, Ecra by DSType, and Space Mono by Colophon. © 2005 – 2025 Dan Mall Teaches. All rights reserved. Thou shalt not steal—but feel free to remix. Privacy Policy."
