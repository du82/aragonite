["https://danmall.com/posts/commit-to-commit"]
title = "“Commit to Commit,” an article by Dan Mall"
description = "When “yes” or “no” doesn’t work."
full_description = "“Yes” is easy. If you do believe you can have it done by the end of the day, “yes” is easy because it’s honest and it’s probably what the asker wants to hear. “No” is a bit tougher. If you don’t believe you can have it done by the end of the day, “no” is honest but it’s probably not what the asker wants to hear. Still though, the asker is looking to see if there’s a commitment that can be made, and your answer makes it clear that there isn’t… at least not right now. People often resort to “maybe” or “I don’t know,” but neither of those answers are very helpful to the asker, as they leave the asker in the same place as they were before they asked: unsure. What’s a better response? Commit to commit. It sounds like this: “I’m not sure right now, but I can tell you in an hour.” Committing to commit gives you the ability to hold your own honest ambiguity while still giving the asker the commitment they’re looking. Next time someone asks you for a commitment where you can’t yet answer yes or no, try committing to commit. It’s a great way to create accountability. Join 60,200+ subscribers to the weekly Dan Mall Teaches newsletter. I promise to keep my communication light and valuable! I’m Dan Mall: creative director, designer, founder, entrepreneur, and author. I ran design systems consultancy SuperFriendly for over a decade. Now I share as much as I can to create better opportunities for people who wouldn’t have them otherwise. Currently creating Great Job! and Design System University. Learn more about me. This site is built on Eleventy, hosted on Netlify, and typeset in Fabriga by LuxTypo, Ecra by DSType, and Space Mono by Colophon. © 2005 – 2025 Dan Mall Teaches. All rights reserved. Thou shalt not steal—but feel free to remix. Privacy Policy."
