["https://danmall.com/posts/10-years-of-superfriendly"]
title = "“10 Years of SuperFriendly,” an article by Dan Mall"
description = "A decade in business!"
full_description = "Ten years ago—also on my birthday… February 1, 2012—I got myself the gift of my very own agency called SuperFriendly. Now, I’m just on the other side of a decade of running it. What a journey it’s been! It’s the longest job I’ve had by far; every other job I’ve had prior was no longer than 3 years. I never thought I’d be at the same place for 10 years, much less a business that I’m in charge of. I’m so grateful for the opportunity. I recently shared that 2021 was a less-than-ideal year for SuperFriendly, but, on the whole, it’s been a pretty great business over a decade. I started it in 2012 as a way to be in control of my own pace of working so that I can be as available for my wife and newborn daughter as possible. Financially though, I was prepared to make less money than I ever have and even had a secret plan B to ask my parents if we could move into their basement to keep our expenses low. Fortunately, even year 1 of a new business made me more money than I’ve ever made up to that point in my career. There have been up years and down years, but on average, SuperFriendly has been a great living for me. I make more than I’d make at a Silicon Valley tech startup without a need for any complicated RSU vesting or crippling VC pressure, and it’s allowed my family and I to travel the world together, invest in running an apprentice program for years, buy our dream house, donate significantly to causes we believe in, support my sneaker collecting hobby, and much more. Financially speaking, my pricing approach for SuperFriendly has been built on value pricing from the start… the idea that any price we charge must be “worth it” for both the customer and the service provider. One thing I’ve learned over time that many people miss about value pricing is that the idea of “worth it” isn’t solely confined to the dollar amount of any individual transaction. When I look at SuperFriendly at a more zoomed out level—say, over a quarter or a year—it’s much easier to spot what financial decisions have been “worth it.”"
year_published = 2022
