["https://danmall.com/posts/applications-are-open-hiring-a-designer-who-can-ship"]
title = "“Applications Are Open: Hiring a Designer Who Can Ship!,” an article by Dan Mall"
description = "As of today, applications are officially open!"
full_description = "A word of caution: please read my tips! It’s important to me to work with someone thoughtful and considerate who pays attention, and ignoring my guidelines is a great way to show me that we’re already not a good fit to work together. For example, I asked for a portfolio that’s tailored toward me and the work I’d potentially be assigning to you, but I’d put money on the fact that people will submit their generic portfolios. Don’t let that be you. It’s a great way to get me to skip right over your application. Applications will be open until Friday, October 18, 2024 at 11:59pm Eastern; you have the next two weeks to submit. Join 60,200+ subscribers to the weekly Dan Mall Teaches newsletter. I promise to keep my communication light and valuable! I’m Dan Mall: creative director, designer, founder, entrepreneur, and author. I ran design systems consultancy SuperFriendly for over a decade. Now I share as much as I can to create better opportunities for people who wouldn’t have them otherwise. Currently creating Great Job! and Design System University. Learn more about me. This site is built on Eleventy, hosted on Netlify, and typeset in Fabriga by LuxTypo, Ecra by DSType, and Space Mono by Colophon. © 2005 – 2025 Dan Mall Teaches. All rights reserved. Thou shalt not steal—but feel free to remix. Privacy Policy."
