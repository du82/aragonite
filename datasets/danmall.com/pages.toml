["https://danmall.com/posts/superfriendly-in-2020"]
title = "“SuperFriendly in 2020,” an article by Dan Mall"
description = "Looking forward to a new kind of year for SuperFriendly by looking back at the past few years."
full_description = "Midway through 2019, we officially and publicly repositioned the company to focus solely on design systems. An overwhelming majority of the work we were doing over the last few years was design systems work anyway, so we decided to be upfront about this focus in hopes that the narrower positioning would bring some advantages. And boy, it did. The end of 2019 bore plenty of fruits of that labor. We’ve seen a 1,000% increase in the amout of leads in our pipeline compared to what we had at this time last year. In order to figure out how to set up well for a great 2020, I found it useful to look back at how SuperFriendly has done thus far. (I shared a more detailed version of this with the team and thought it could be helpful to share some of this publicly in case it helps any other agency owner out there.) At the end of 2012, I shared some data about how I spent my time in year one as an owner of a new agency that was still primarily responsible for the majority of production work. Nowadays, at the close of year seven, I’m much less involved. Here’s a comparison of how 2019 compared to 2012. The percentages don’t add up to 100%, mostly because I only wanted to show the most significant changes between 2012 and 2019. Our profit has really fluctuated over the years and is generally trending downwards. A major focus for 2020 is to at least level this out, if not trend upwards. A profit of 58% would do the trick, but it’s a touch too ambitious to be realistic. We’re shooting for 50%. As I reflect on and continue to refine SuperFriendly’s purpose, I’ve realized that a grand opportunity is to create better opportunities for creative people to flourish. Against that criteria, I think it’s important to continually evaluate how many opportunities we’re creating, for whom, and how good those opportunities are. A quick rundown: In general, I tend to use 20% as standard benchmark, because I learned from Tim Kadlec’s Fast Enough that a 20% difference is when a change is noticeable."
