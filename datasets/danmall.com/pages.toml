["https://danmall.com/posts/portfolios"]
title = "“A Portfolio Hiring Managers Can’t Deny,” an article by Dan Mall"
description = "Tell ’em exactly what they want to hear before they even ask."
full_description = "For designers and developers, one thing stands high above résumés, cover letters, and university degrees: the esteemed portfolio. A great portfolio can get you a high-paying, life-restoring job, even if you don’t have much or any schooling. The converse is also true: you may have many degrees and lots of experience listed on a résumé, but unless you can demonstrate it through a portfolio, that great job opportunity may still pass you by. What makes for a good portfolio? In a sentence, a portfolio that has the highest likelihood of landing a job indicates you already have the skills to do what you’ll be hired to do. Will you be expected to design inventive user interfaces for senior citizens? That’s what should be in your portfolio. Is that potential job expecting that you’ll build React apps using Redux and LotusNotes? Time to break out that “Domino for Dummies” book. Many designers and developers think of a portfolio as a simple way to collect the things they’ve worked on over the last few years of their careers. While that might make your mama proud, it’s a distraction from the fact that a portfolio has a job to do—namely, to get you a job. If you do want to collect your work somewhere, call it a “time capsule” or “archive.” And while those might help to get you a job, there are much better ways to land your dream gig than by just putting a random smattering of work in a place. Therefore, the first step in crafting a great portfolio is identifying what job you’re actually trying to get. Half of that is identifying the company you’d like to work for; the other half is identifying the specific job you want at that company. Once you know those things, you can create a specific message that addresses why you’d be a great fit for that job at that company. You might already see the conundrum with that approach: even with the same title, every job is at least slightly different from company to company. A Senior Product Designer job at online medical care appointment booking service Zocdoc is different than a Senior Product Designer job at meal kit service Plated. There’s certainly overlap in the details: both companies are in New York, involve interdisciplinary collaboration, and require facilitation as well as execution skills. But the big stuff couldn’t be more different. Plated is looking for a designer to “help them craft beautiful and engaging experiences that help people transform dinnertime.” Zocdoc is looking for a designer to help create “the next generation of patient and provider experiences to help us transform healthcare.”"
