["https://danmall.com/posts/answers-to-common-design-questions"]
title = "“Answers to Common Design Questions,” an article by Dan Mall"
description = "A few quick takes and hot takes about design."
full_description = "I get a good deal of messages from people asking me questions about design. I try to answer as many as I can, but I’m unable to get to all of them. So, here’s a roundup of my answers to some of the most common questions I receive. ​Neue Haas, GT America, or Pangram Sans. Gothics, grotesks, and geometric sans are so are in right now. ​Start at $25/hour. Once you feel like your work is worth more than you’re making, double it. Keep doubling until you get to a rate that clients won’t pay, then value price. ​It doesn’t say what you want from the viewer. Ditch the meaningless “I create bold experiences for a new world” copy at the top and replace it with something more direct like “I’m looking for a senior designer job at a publishing company” or “I’m looking for new clients who make sustainable vehicles” or something equally specific. If you want something, you gotta ask for it. If you work at a startup: no. Your time is probably best used creating more value for your customers and your investors. I work at an enterprise and am reinventing the wheel more than I should. I need a design system. Where should I start? Work on something that directly makes your boss or your company more money. Then tell them often that you did/are doing that and that you could do more of that if you get a better title, more money, and a company credit card. Put up a landing page this weekend, ask all of your friends to tell their friends about it, and see how many email signups you get. I mean, most questions can be answered with, “It depends,” but I hate giving that answer. I’d rather give you a definitive starting point even if it’s wrong, because it’s easier to revise than create. Join 60,200+ subscribers to the weekly Dan Mall Teaches newsletter. I promise to keep my communication light and valuable! I’m Dan Mall: creative director, designer, founder, entrepreneur, and author. I ran design systems consultancy SuperFriendly for over a decade. Now I share as much as I can to create better opportunities for people who wouldn’t have them otherwise. Currently creating Great Job! and Design System University. Learn more about me."
