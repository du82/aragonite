["https://www.danpink.com/books/johnny-bunko"]
title = "The Adventures of Johnny Bunko | Daniel H. Pink"
description = "Meet Johnny Bunko. He’s probably a lot like you. He did what everybody – parents, teachers, counselors -- told him to do. But now, stuck at a dead-end job, he’s begun to suspect that what he thought he knew is just plain wrong. One bizarre night, Johnny meets Diana, the unlikeliest career advisor he's ever seen. Part Cameron Diaz, part Barbara Eden, she reveals to Johnny the six essential lessons for thriving in the world of work The Adventures of Johnny Bunko is America’s first business book in the Japanese comic format known as manga – and the last career guide you’ll ever need."
full_description = "The Adventures of Johnny Bunko * A BusinessWeek Bestseller! * Read it in Portuguese, German, Japanese, Italian, Dutch, Korean, French (France), French (Canada), Thai, Polish, and Spanish. (For foreign rights inquiries, contact Helen Manders) * An American Library Association Best Graphic Novel for Teens! * Discussion Guides: For business | For students From Daniel H. Pink, the #1 bestselling author of Drive and To Sell Is Human, comes an illustrated guide to landing your first job in The Adventures of Johnny Bunko: The Last Career Guide You’ll Ever Need. There’s never been a career guide like The Adventures of Johnny Bunko. Told in manga—the Japanese comic book format that’s an international sensation—it’s the fully illustrated story of a young Everyman just out of college who lands his first job. Johnny Bunko is new to the Boggs Corp., and he stumbles through his early months as a working stiff until a crisis prompts him to rethink his approach. Step by step he builds a career, illustrating as he does the six core lessons of finding, keeping, and flourishing in satisfying work. A groundbreaking guide to surviving and flourishing in any career, The Adventures of Johnny Bunko is smart, engaging and insightful, and offers practical advice for anyone looking for a life of rewarding work. Daniel H. Pink is the New York Times bestselling author of A WHOLE NEW MIND and FREE AGENT NATION. He lectures to corporations, associations, and universities around the world on economic transformation and the changing world of work. In 2007, he won a Japan Society Media Fellowship that took him to Tokyo to study the manga industry. Pink lives in Washington, DC, with his wife and their three children. Rob Ten Pas is the winner of TOKYOPOP’s annual Rising Stars of Manga competition. He received a B.A. from the Minneapolis College of Art and Design and now lives and draws in Wisconsin. Buy the book:Amazon.comBarnes & Noble800ceoread.comIndieBound.comiBooks Reviews .r