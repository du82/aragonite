["https://www.danpink.com/books/the-power-of-regret"]
title = "The Power of Regret | Daniel H. Pink"
description = "Instant NY Times bestseller! The Power of Regret: How Looking Backward Moves Us Forward In Daniel Pink's new book, find out how regret, our most misunderstood emotion, can be the pathway to our best life. Order the Book Media Coverage Best Books of 2022 BESTSELLER Best of 2022 Best Books of 2022 Best Books 2022"
full_description = "In Daniel Pink's new book, find out how regret, our most misunderstood emotion, can be the pathway to our best life. From the #1 New York Times–bestselling author of When and A Whole New Mind, a paradigm-altering book about the transformative power of our most misunderstood emotion: regret. “No regrets.” You’ve heard people proclaim it as a philosophy of life. That’s nonsense, even dangerous, says Daniel H. Pink in his latest bold and inspiring work. Everybody has regrets. They’re a fundamental part of our lives. And if we reckon with them in fresh and imaginative ways, we can enlist our regrets to make smarter decisions, perform better at work and school, and deepen our sense of meaning and purpose. In The Power of Regret, Pink draws on research in psychology, neuroscience, economics, and biology to challenge widely-held assumptions about emotions and behavior. Using the largest sampling of American attitudes about regret ever conducted as well as his own World Regret Survey—which has collected regrets from more than 16,000 people in 105 countries—he identifies the four core regrets that most people have. These four regrets, Pink argues, operate as a “photographic negative” of the good life. By understanding what people regret the most, we can understand what they value the most. And by following the simple, science-based, three-step process that he sets out, we can transform our regrets in a positive force for working smarter and living better. With Pink’s signature blend of big ideas and practical takeaways, captivating stories and crisp humor, The Power of Regret offers an urgent and indispensable guide for a life well lived. Daniel H. Pink is the author of the New York Times bestsellers A Whole New Mind, Drive, To Sell Is Human, and When. His books have sold millions of copies, have been translated into forty-two languages, and have won multiple awards. Pink and his family live in Washington, D.C. “I love that Daniel Pink is taking on one of the best (and toughest) teachers in my life - regret. I’ve always known that regret deepened my connection to myself and to others, but now, thanks to Dan’s research and storytelling, I understand why. The idea of 'no regrets' doesn’t mean living with courage. It means living without reflection. The world needs this book and more reflection. Now.”"
year_published = 2021
year_updated = 2024
