["https://www.danpink.com/books/to-sell-is-human"]
title = "To Sell Is Human | Daniel H. Pink"
description = "“Like discovering your favorite professor in a box…packed with information, reasons to care about his message, how and why to execute his suggestions, and it's all accentuated with meaningful examples… this book deserves a good, long look.” —Publishers Weekly (starred review) To Sell Is Human offers a fresh look at the art and science of selling. As he did in Drive and A Whole New Mind, Daniel H. Pink draws on a rich trove of social science for his counterintuitive insights. He reveals the new ABCs of moving others (it’s no longer “Always Be Closing”), explains why extraverts don’t make the best salespeople, and shows how giving people an “off-ramp” for their actions can matter more than actually changing their minds. Along the way, Pink describes the six successors to the elevator pitch, the three rules for understanding another’s perspective, the five frames that can make your message clearer and more persuasive, and much more. The result is a perceptive and practical book–one that will change how you see the world and transform what you do at work, at school, and at home."
full_description = "To Sell Is Human Buy the book:Amazon.comBarnes & Noble800ceoread.comIndieBound.comiBooks “Artfully blend(s) anecdotes, insights, and studies from the social sciences into a frothy blend of utility and entertainment.” – Bloomberg From the bestselling author of Drive and A Whole New Mind comes a surprising–and surprisingly useful–new book that explores the power of selling in our lives. According to the U.S. Bureau of Labor Statistics, one in nine Americans works in sales. Every day more than fifteen million people earn their keep by persuading someone else to make a purchase. But dig deeper and a startling truth emerges: Yes, one in nine Americans works in sales. But so do the other eight. Whether we’re employees pitching colleagues on a new idea, entrepreneurs enticing funders to invest, or parents and teachers cajoling children to study, we spend our days trying to move others. Like it or not, we’re all in sales now. To Sell Is Human offers a fresh look at the art and science of selling. As he did in Drive and A Whole New Mind, Daniel H. Pink draws on a rich trove of social science for his counterintuitive insights. He reveals the new ABCs of moving others (it’s no longer “Always Be Closing”), explains why extraverts don’t make the best salespeople, and shows how giving people an “off-ramp” for their actions can matter more than actually changing their minds. Along the way, Pink describes the six successors to the elevator pitch, the three rules for understanding another’s perspective, the five frames that can make your message clearer and more persuasive, and much more. The result is a perceptive and practical book–one that will change how you see the world and transform what you do at work, at school, and at home. Buy the book:Amazon.comBarnes & Noble800ceoread.comIndieBound.comiBooks Reviews .reviews span.source { display:block; } “Important reading…an integral addition to a growing body of literature that argues for a radical shift in how businesses operate.” —Kirkus “Persuasive . . .Harnessing the power of intrinsic motivation rather than extrinsic remuneration can be thoroughly satisfying and infinitely more rewarding.” —Miami Herald “Pink is rapidly acquiring international guru status . . . He is an engaging writer, who challenges and provokes.” —Financial Times “Drive is the rare book that will get you to think and inspire you to act. Pink makes a strong, science-based case for rethinking motivation–and then provides the tools you need to transform your life.” —Dr. Mehmet Oz, co-author of YOU: The Owners Manual “Pink’s a gifted writer who turns even the heaviest scientific study into something digestible — and often amusing — without losing his intellectual punch.” —New York Post “Enchanting . . . an important book offering a whole new way to think about motivation.” —Globe and Mail “Pink's ideas deserve a wide hearing. Corporate boards, in fact, could do well by kicking out their pay consultants for an hour and reading Pink's conclusions instead.” —Forbes “Fascinating . . . If Pink's proselytizing helps persuade employers to make work more fulfilling, Drive will be a powerhouse.” —USA Today “Pink’s analysis–and new model–of motivation offers tremendous insight into our deepest nature.” —Publishers Weekly “Pink makes a convincing case that organizations ignore intrinsic motivation at their peril.” —Scientific American “These lessons are worth repeating, and if more companies feel emboldened to follow Mr. Pink's advice, then so much the better.” —Wall Street Journal Reviews .reviews span.source { display:block; } “Like discovering your favorite professor in a box…packed with information, reasons to care about his message, how and why to execute his suggestions, and it's all accentuated with meaningful examples… this book deserves a good, long look.” —Publishers Weekly (starred review) “Artfully blend(s) anecdotes, insights, and studies from the social sciences into a frothy blend of utility and ente