title = "How casual carpool works in Oakland and Berkeley | Dan Wang"
description = "You can use casual carpool to commute from the East Bay into San Francisco for free. Here's the etiquette, how it works, and where to find pick-up spots."
full_description = "December 13, 2015 Casual Carpool in Oakland and Berkeley I’ve been living in north Oakland/south Berkeley for two months. This is a post about one of my favorite institutions: casual carpool. Every morning I walk 15 minutes from my house to a spot in Rockridge, Oakland. There I’d find a line of cars waiting to pick up passengers. I’d get into a car and be driven across the Bay Bridge into San Francisco, where I’d be dropped off two blocks away from my office in the Financial District. All of this is free. The system is called “casual carpool.” It’s not app-enabled or have much to do with the internet. Instead it emerged since the ‘60s or ‘70s as a way for East Bay’ers to get into the city. It’s an excellent trade: Passengers get a free ride into the city. Drivers can use the carpool lane, saving on average 20 minutes and $4 on their morning commutes. It works simply. A small sign is all there is to designate a pickup spot. There are about two dozen such spots in the East Bay, concentrating around East Oakland, Emeryville, and Berkeley. The designated drop-off spot is the first exit off the Bay Bridge; it just so happens that my office is close by. Casual carpool is structured to be maximally easy for everyone. For passengers, these spots are close to parking spaces or within walking distance of public transportation. The spot I go to is right before a highway entrance, to make it especially compelling for drivers to take passengers: If you see people lining up to save you time on your commute, why not pick them up? The experience is shrouded in some etiquette. There typically isn’t a great deal of talking. It’s up to the driver to initiate conversation, and I’ve chatted perhaps a third of the time. It’s rude for the passenger to carry out a phone conversation over the whole ride. NPR is almost always on, loudly. You should to ask for permission to have food and coffee in the car. Drivers and passengers are supposed to match on the basis first-come-first-served; a driver should not look for the most attractive woman in the line and ask her to get in. I find especially interesting the driver rhetoric towards accepting money. Occasionally someone will ask for a dollar, but more often I’ve had drivers insist to me that they won’t take payment. They say they do it “to be nice” and to be environmentally friendly. Of course we acknowledge that everyone saves time: When we drive past unmoving lines that are 50-cars deep, we wonder why more drivers don’t pick people up. Two stories: I was once picked up by a person who turned out to be a federal judge of the United States; he sits on the court of the Northern District of California, and has been driving people from Berkeley for the last twenty-five years. He reported that exactly two of those experiences have been unpleasant. My favorite ride was when I rode across the Bay Bridge in a Fiat convertible, top down in the summer sun. It’s gorgeous to watch the sun rise over the city; sometimes you can see ships across the bay. Alas casual carpool doesn’t work so well in the evening. There isn’t a centralized drop-off spot and there’s a much greater range of people’s after-work commute times. I take BART home. I don’t know if casual carpool works like this anywhere else. For all the talk of Berkeley/Oakland friendliness, I think this has been so sticky because it’s a third-best response to the housing shortage of the city, the size of the population across the bay, and the constraint of the lone Bay Bridge as the only way to get into the city. Casual carpool is so marvelous that I don’t particularly want to move into the city. I enjoy my morning commute; how many other people can say that? Addendum, 12.13: As Samuel Hammond said in a tweet—isn’t this the original sharing economy? Subscribe to new posts I publish infrequently. Enter your email to get my posts delivered to your inbox: Email Sign up Maybe others would like this piece too:TweetPocketEmailReddit Posted in Economics"
