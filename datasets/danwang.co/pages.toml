full_description = "October 19, 2015 Sonderweg I had intended to read Peter Watson’s The German Genius before I left for Germany. Instead I got to it only now, after I’ve returned. Here anyway are some thoughts. The book is an intellectual history of Germany. Watson largely ignores political intrigue, bringing out instead the ideas of philosophers, musicians, scientists, historians, and industrialists. It’s to make a simple point: There’s a lot more to the country than the 12 years between 1933 and 1945. He regrets that the Third Reich so dominates popular imagination of Germany, and this 850-page book is his corrective. To prove the point he makes to overwhelm with the sheer number of important German thinkers. It’s not just Kant and Goethe and Beethoven and Hegel and Freud and Wagner and Schiller and Nietzsche and Einstein and Marx and on and on. Take a look at these chapter titles: Physics Becomes King: Helmholtz, Clausius, Boltzmann, Reimann; Sensibility and Sensuality in Vienna; Munich/Schwabing: Germany’s “Montmartre”; Masters of Metal: Krupp, Diesel, Rathenau. The approach is sometimes frustrating. Watson typically serves up a brief bio and an explication of a thinker’s main ideas. Most people receive a few paragraphs before they’re dismissed. So just when you think: “Hmm, tell me more,” Watson has already moved on to the next person. I found his treatment of quite a few people to be unsatisfactory. He skips over the fascinating details of Albert Hirschman’s work during the war, noting only that Hirschman was assistant to Varian Fry; on the intellectual side, he brings out Hirschman’s scholarship on development economics, but says nothing of his work on political science. What interesting details has he rushed over in the lives of other people? If you pick up this book, just be aware that he’s trying to be encyclopedic, and that breadth here is the point. Watson is British, but some of his sentences feel very… German. Take this: “Gödel imagined (or rather, worked out mathematically) that if the universe were rotating, as he calculated it was (this was now called a “Gödel universe”), then space-time could become so greatly warped or curved by the distribution of matter that were a spaceship to travel through it at a certain minimum speed (which he calculated), time travel would be possible.” Then he moves on. Consider another excerpt. This gives a better sense of what Watson is trying to do: “The pithiest way to show how German refugees affected American life is to give a list of those whose intellectual contribution was such as to render their names, if not household words, then at least eminent among their peers: Theodor Adorno, Hannah Arendt, Rudolf Arnheim, Erich Auerbach, Paul Baran, Hans Bethe, Bruno Bettelheim, Arnold Brecht, Bertolt Brecht, Marcel Breuer, Hermann Broch, Charlotte and Karl Bühler, Rudolf Carnap, Lewis Coser, Karl Deutsch, Marlene Dietrich, Alfred Döblin, Peter Drucker, Alfred Eisenstaedt, Hanns Eisler, Erik Erikson, Otto Fenichel, Ernst Fraenkel, Erich Fromm, Hans Gerth, Felix Gilbert, Kurt Gödel, Gottfried von Haberler, Eduard Heimann, Ernst Herzfled, Julius Hirsch, Albert Hirschman, Hajo Holborn, Max Horkeimer, Karen Horney, Werner Jaeger, Marie Jahoda, George Katona, Walter Kaufmann, Otto Kirchheimer, Wolfgang Köhler, Kurt Koffka, Erich Korngold, Siegfried Kracauer, Ernst Krenek, Ernst Kris, Paul Oskar Kristeller, Fritz Lang, Paul Lazarsfeld, Kurt Lewin, Peter Lorre, Leo Lowenthal, Ernst Lubitsch, Heinrich Mann, Klaus Mann, Thomas Mann, Herbert Marcuse, Ernst Mayr, Ludwig von Mises…” That’s not even all of “M,” and yes it goes to “Z.” Now I don’t want to give the impression that this book is merely a bio mashup of important Germans. Watson takes all this material to argue that there is something of a German character after all. He brings up the term Sonderweg, which means “special path,” a German equivalent of “American Exceptionalism.” As I understand it, Sonderweg usually refers to Germany’s particular political development, but Watson relates it instead to the profundity of German culture. So here’s what makes German thinkers German. Watson shows that Germans have always prized inwardness, or Innerlichkeit. It manifests for example as Kant’s ideas on the inwardly-looking structures of the mind; consider also the symphony, which is (usually) wordless and beyond words. Watson shows the historical roots of the concept of Bildung, which refers to self-cultivation and the desire to “enlarge” ourselves and those around us. Both are German tendencies which have been explicitly named and praised as virtues over many centuries. Watson also cites other features that help explain the idea of a German character. He shows that German development has been affected by a relatively large educated middle class. And he brings out historical arguments that Germans are apathetic towards politics and tend towards a nationalist cultural pessimism. (He also shows how modern Germans no longer hold these ideas.) Finally, he considers whether the Nazi regime was a necessary development given these tendencies; read the book, I won’t try to discuss that idea here. Last thing on Watson’s arguments before I present a few scattered thoughts. In the conclusion he writes: “Kant, Humboldt, Marx, Clausius, Mendel, Nietzsche, Planck, Freud, Einstein, Weber, Hitler—for good or ill, can any other national boast a collection of eleven (or even more) individuals who compare with these figures in regard to the enduring influence they have had on modern ways of thought?” Maybe, right? Britain is a candidate. Hume preceded Kant, Smith preceded Marx, Newton preceded Clausius, Planck, and Einstein, Darwin preceded Mendel, Locke and Mill preceded Nietzsche. It’s not just a question of chronology; the British thinkers came up with the fundamental ideas that the German thinkers built on. Here are a few more short thoughts: Three data points that support the idea for a large educated middle class: In the early 19th century, Germany had 300 universities to Britain’s 4. In 1900, it had 4221 newspapers to France’s 3000 and Russia’s 125. And before 1933, Germany had more Nobel Prizes than American and British scientists put together. Reading ideas from certain German thinkers made me think of China. In both cultures there’s an emphasis on reading and education, and perhaps a philosophical cultivation among the upper class. But there’s also less happy stuff. Racial identities featured prominently in both cultures; people are or have been a bit too eager to believe that their race makes them especially inventive or philosophical. Prominent writers from both countries have offered arguments that their people are particularly allergic to liberal values, and that authoritarianism best suits their country. These ideas are now so out of the mainstream in Germany, but it’s disturbing how easily you can come across them in China now. Watson wants us to think beyond Nazis, but I thought that the book’s strongest section was the part about the damage that Nazis caused. It’s the section that engages most actively with history, presenting how the political situation thoroughly profaned the intellectual culture. (One example: A few prominent scientists, including some who won the Nobel Prize, were actively encouraged to leave the country.) My favorite chapter was the one on German refugees in America. It discusses how they mostly failed to assimilate to American culture and how many returned to Europe (with most settling in Switzerland) when they got the chance. Here’s a paragraph I found intriguing: “Dewey’s first point was that history has shown that to think in abstract terms is dangerous. It elevates ideas beyond the situations in which they were born and charges them with we know not what menace for the future. He observed the British philosophy, from Francis Bacon to John Stuart Mill, had been cultivated by men of affairs rather than professors, as had happened in Germany (Kant, Fichte, Hegel)… In particular, he thought that Germany—and its well-trained bureaucracy—had ‘ready-made channels through which philosophic ideas may flow on their way to practical affairs,’ and that Germany differed from the United States and Britain in that this channel was the universities rather than the newspapers.” Watson collected a few dozen short quotes about Germany and German culture at the beginning of the book. Here are my favorites: German problems are rarely German problems alone. – Ralf Dahrendorf The word “genius” in German has a special overtone, even a tinge of the demonic, a mysterious power and energy; a genius—whether artist or scientist—is considered to have a special vulnerability, a precariousness, a life of constant risk and often close to troubled turmoil. – Fritz Stern The Germans dive deeper—but they come up muddier. – Wickham Steed The Allies won [the Second World War] because our German scientists were better than their German scientists. – Sir Ian Jacobs, military secretary to Winston Churchill (Above, Caspar David Friedrich’s Schneehügel mit Raben, Snow Hill with Ravens. Watson remarks that Friedrich rarely depicts direct sunlight, and instead paints scenes of dusk, dawn, or fog… via Wikimedia Commons.) Subscribe to new posts I publish infrequently. Enter your email to get my posts delivered to your inbox: Email Sign up Maybe others would like this piece too:TweetPocketEmailReddit Posted in Books, Economics, Travel"
