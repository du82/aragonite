full_description = "January 1, 2020 2019 letter (This piece is my year in review; here’s my letter from 2018) Following the twists and turns of the trade war meant that I had less time for personal writing this year, so this letter is the only piece I’ll publish. I’m disappointed not to write more here, but on the other hand it might allow us to identify, for academic purposes, my lack of personal output to be the smallest and most trivial casualty of the trade war. This year I want to discuss mostly science and technology. First, some thoughts on China’s technology efforts. Then I’ll present a few reflections on science fiction, with a focus on Philip K. Dick and Liu Cixin. Next I’ll discuss books I read on American industrial history. I save personal reflections for the end. *** I spend most of my time thinking about China’s technology trajectory. The main ideas can be summed up in two broad strokes. First, China’s technology foundations are fragile, which the trade war has made evident. Second, over the longer term, I expect that China will stiffen those foundations and develop firms capable of pushing forward the technological frontier. In my view, there’s not yet much terribly impressive about China’s technology achievements. It’s true that the country leads on mobile payments and the consumer internet, as well as the buildout of infrastructure projects like a high-speed rail network. These however have more to do with differences in the social environment and regulatory regime. More importantly, much of China’s technology stack is built on American components, especially semiconductors. Failure to develop more foundational technologies has meant that the US has had an at-will ability to kneecap major firms, and to be able to impose at least significant operational hassles on Huawei. Over the medium term, US controls will disrupt the ability of Chinese firms to acquire leading technologies. And so long as substantial US tariffs stay in place, Chinese firms will have worse access to the world’s largest and best consumer market, meaning that they’ll be exposed to less export discipline. I am constructive however for China’s longer-term industrial development. I expect that Chinese firms will build strong technological capabilities, with companies that will reach the leading edge and push it forward. On the supply side, Chinese workers engage in a greater amount of technological learning than anyone else, for the simple reason that most supply chains are in China. On the demand side, a huge and dynamic market will pull forward domestic capabilities. And US controls can only be successful in the short term; it’s not likely that it can monopolize key technologies forever. I. Fragile foundations There are certain lights under which Chinese technology efforts look spectacular. China is the only country other than the US to have been able to develop internet giants, which can look upon their Silicon Valley counterparts as peers. The Chinese mobile internet experience certainly is far more fun than what consumers in the US are able to play with. Chinese firms have built up credible positions in certain industrial technologies that include solar energy generation, mobile infrastructure equipment, and high-speed rail. They’re also making good inroads in consumer electronics, from smartphones to drones. And Chinese firms have a plausible shot at leading in emerging technologies like artificial intelligence and quantum computing. These are not trivial achievements. But neither are they earth-shattering successes. Consider first the internet companies. I find it bizarre that the world has decided that consumer internet is the highest form of technology. It’s not obvious to me that apps like WeChat, Facebook, or Snap are doing the most important work pushing forward our technologically-accelerating civilization. To me, it’s entirely plausible that Facebook and Tencent might be net-negative for technological developments. The apps they develop offer fun, productivity-dragging distractions; and the companies pull smart kids from R&D-intensive fields like materials science or semiconductor manufacturing, into ad optimization and game development. The internet companies in San Francisco and Beijing are highly skilled at business model innovation and leveraging network effects, not necessarily R&D and the creation of new IP. (That’s why, I think, that the companies in Beijing work so hard. Since no one has any real, defensible IP, the only path to success is to brutally outwork the competition.) I wish we would drop the notion that China is leading in technology because it has a vibrant consumer internet. A large population of people who play games, buy household goods online, and order food delivery does not make a country a technological or scientific leader. Although Alibaba and Tencent may be technically impressive on software development, their business success is mostly a function of the size of the market as well as the social and regulatory environment. The ubiquity of mobile payments is the result not just of technological innovation (substantial though that might be), but also the financial regulatory regime and the leapfrog over credit cards. Ecommerce works great because China has built first-rate infrastructure and because many migrant workers are available to deliver goods in dense urban areas. These are fine companies, but in my view, the milestones of our technological civilization ought to be found in scientific and industrial achievements instead. Now even if one did want to consider consumer internet the be the most important sector, the US still looks good. A rough rule-of-thumb comparison: market caps of the five biggest US tech companies (Apple, Microsoft, Google, Amazon, and Facebook) add up to US$5tn at the time of this writing, while the two Chinese internet giants (Alibaba and Tencent) add up to US$1tn. This 5:1 advantage to the US feels intuitively right to me as a measure of relative capabilities. As a tangent, I’ve found it curious that Congress has become so keen to publicly beat up on Facebook and Google while the US considers itself in technological competition with China. In my view, antitrust arguments apply better to companies like Intel and Boeing, which are the tech giants that wield much greater market power. Maybe the contrarian move however is to recognize the cleverness of Congress. The legislators might in fact understand that semiconductors and jet engines are a core strategic asset, in a way that social networks and search engines are not. Therefore Congress is actually exercising a judicious use of political power to bully cash-rich companies to do more on innovation, or at least employment. China has a strong position when it comes to manufacturing industrial goods. A few firms have staked out leading positions in industries that include steel, solar power generation, and telecommunications equipment. The bulk still has a long way to go however before they can really be considered the peers of German, Japanese, Korean, and American giants. In fact, I suspect that Chinese firms should be considered underperformers as a whole. Few domestic firms have become globally-successful brands, and Chinese firms are still far behind more technologically-sophisticated industries like aviation and semiconductors. As a rule of thumb, it’s harder to name global Chinese brands than Japanese and Korean ones, even when they were close to China’s current level of per capita GDP. Shouldn’t we expect more from the world’s second-largest market? How about emerging technologies like AI, quantum computing, biotechnology, hypersonics, and other buzzing areas? I think there’s no scientific consensus on China’s position on any of these technologies, but let’s consider it at least a plausible claim that Chinese firms might lead in them. So far however these fields are closer to being speculative science projects than real, commercial industries. AI is mostly a vague product or an add-on service whose total industry revenue is difficult to determine, and that goes for many of these other items. In my view, focusing the discussion on the Chinese position in emerging technologies distracts from its weaknesses in established technologies. Take semiconductors, machine tools, and commercial aviation, which are measured by clearer technical and commercial benchmarks. They are considerably more difficult than making steel and solar panels, and Chinese firms have a poor track record of breaking into these industries. The focus on speculative science projects brings to light another issue around discussions of China and technology: an emphasis on quantifying inputs. So much of the general commentary focuses on its growth in patent registrations, R&D spending, journal publications, and other types of inputs. One can find data on these metrics, which is why measures of “innovation” are often constructed around them. But these inputs are irrelevant if they don’t deliver output, and it’s not clear that they often do, neither in China nor anywhere else. Wonderfully asymptoting charts on Chinese patent registrations and R&D spending suggest that Chinese firms might overrun the rest of the world any day now. So far however the commercial outputs are not so impressive. The trade war has produced the clearest evidence that China’s technology foundations are fragile. When the US government decided to restrict technology exports to particular firms, it drove ZTE to near bankruptcy, crippled the operations of Fujian Jinhua, and has at least dealt a major blow to Huawei. US sanctions have revealed that most Chinese firms engage in only a thin layer of innovation, and that Chinese firms in general have not had serious success mastering more foundational technologies. The most important of these is the semiconductor. Without particular chips like CPUs, GPUs, and FPGAs, which for the most part come from American providers, even a fi