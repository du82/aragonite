title = "2021 letter | Dan Wang"
description = "Getting worse and getting better; Jesuits; common prosperity; Rossini's glittering realm; slow-casual chains; Lem's ocean; vowelsongs."
full_description = "January 1, 2022 2021 letter (This piece is my year in review; here’s my letter from 2020) I’ve by now lived in each of China’s main megaregions. It is time to make assessments. Everything that can go wrong in urban design has gone wrong in Beijing. The climate is arid and prone to northerly sandstorms. Its streets are unwalkable, but a stroll would reveal that its imperial heritage, made up of alley houses called hutongs, is slowly being taken over by its socialist heritage, made up of gray Soviet blocks that tower over all. Beijing is therefore a desert steppe city with Stalinist characteristics. A decade ago, the city was a lively place. One can find no shortage of people reminiscing about visiting art shows and fun bars in hutongs, then grabbing roadside barbecue just outside. Today, it is a concrete no-fun zone and the most restrictive city in the country. But Beijing is redeemed by its intellectual life. It is the center not just of state power, but also universities and the biggest-dreaming startups. For those who can work up the courage to confront the mess of its urban city, a sparkling dinner awaits. A hundred years ago, Shanghai (where I currently reside) was the city in Asia where the ambitious could live comfortably while making a great deal of money. A rough few decades later, that fact is true once more. Shanghai is by far the most westernized city in China, attracting perhaps the majority of foreign nationals as well as Chinese who have spent time abroad. One can live in the tree-lined former French Concession, which today hosts the greatest concentration of coffee shops in the world, and work in office settings little different from those in Singapore and Hong Kong. It’s easy to make day trips to the canal cities of east China that enchanted poets and emperors alike. Shanghai today is culturally on par with Beijing, offering no fewer selections of visual and performance art. A more valid contrast is that Shanghaiers are more concerned with practical affairs. Its people are focused on producing the sorts of food and fashion businesses that make the city still more livable. The Greater Bay Area is a bit more of a mystery to me, given that I lived in the failing part—Hong Kong—rather than the growing part: Shenzhen. At the start of reform and opening, Shenzhen absorbed the shock troops of Chinese entrepreneurialism. The southeastern region has long focused more on commerce than culture, having produced relatively fewer objects of historical resonance. When the British seized Hong Kong, the port was a mostly-barren rock, while Shenzhen was barely a settlement at all. Even Guangzhou, a major mercantile hub, has never quite been a center of culture, only cuisine. The southeast is pursuing a strategy similar to Shanghai’s: the development of service sectors around a vibrant manufacturing base. But it is doing so with less taste. Although Shenzhen is less fun than Shanghai, its region is probably the most dynamic and forward-looking part of the country today. The central government has delineated around a hundred million people to each of these megaregions and charged them to drive future growth.1 Beijing, the political center of the country for most of the time since Mongol rule in the 13th century, anchors the northern hub, which also includes Tianjin and relatively smaller cities. Shanghai leads east China, a manufacturing and cultural center since the 10th-century Song dynasty, which counts the nearby cities of Hangzhou, Suzhou, and other medium-large cities. And there’s no obvious leader in the southeast, but it is between Shenzhen, the richest city in the region, and Guangzhou, the political capital of the province and a hub of international commerce since the 18th century. Each region has a different personality. The north is economically dysfunctional. Large parts of it suffer from resource dependency, environmental problems, and the population loss that results from these trends. Cities near Beijing showcase overcapacity in steel and coal, while Tianjin is well-known for having falsified its economic data. The northeast provinces nearby have seen a population decline of around 10% over the last decade, while the north as a whole has seen its share of the country’s GDP shrink from half in 1960 to a third today.2 Beijing however has bucked the region and seen strong growth. It is the political center of the country and reaps every economic advantage from that status. That means retaining the bulk of the state sector as well as the industries most dependent on political rents. Thus it’s not so different from Washington, DC, with its mix of embassies, think tanks, and industries that need lobbying. Not every sector in Beijing though is dependent on the beneficence of government. Although Alibaba is in Hangzhou and Tencent is in Shenzhen, Beijing hosts the preponderance of consumer internet firms, like ByteDance, Meituan, and JD. Beijing is a good place to find talent because it has led for so long and because many of the country’s best universities are there. Whereas a lot of the entrepreneurs in Shenzhen are dreaming of building billion-dollar businesses, those in Beijing are at work building the kind that reach hundreds of billions of dollars. Shanghai is more commercially oriented. Around a thousand years ago, the region of east China started to transform into the fiscal center of the country, as people moved from the millet-growing north into the more productive rice-growing east. The area received another boost with the influx of New World silver, propelling Nanjing, Suzhou, and Hangzhou into the first cities in the world that made luxury goods for global markets. Dotted around these metropolises were market towns producing rice, ceramics, silk, and other goods. Shanghai came into its own through the slow collapse of the Qing. By the turn of the 20th century, it attracted the most dynamic Chinese entrepreneurs and became the center of the country’s industrial works. At the same time, Shanghai was the gambling and brothel capital of the world, the center of the country’s opium trafficking, and the extraterritorial playground for British, French, and American businessmen.3 Today, Shanghai’s seedy past is mostly out of view. But the economic dynamism has not quite faded away. The city hosts the preponderance of the Chinese headquarters of multinationals. And it attracts Chinese entrepreneurs who appreciate its business environment: they tell me that local government districts compete against each other to host companies, and are constantly asking how they can help. While the area around Beijing is failing, the cities around Shanghai are many of China’s best economic successes. Simon Rabinovitch describes it best: “Beijing, a showcase for political power, is blotted by the hulking headquarters of state-owned enterprises. Day trips take reporters to China’s greatest economic calamities, from overbuilt Tianjin to coal-mine carnage in Inner Mongolia. In Shanghai, which functions remarkably well for a city of 25m, reporters instead hop over to see high-tech innovators in Hangzhou, nimble exporters in Wuxi and ambitious entrepreneurs in Wenzhou.”4 The fact I appreciate best is that Shanghai is highly livable. Among cities in Asia, Tokyo is a singular miracle, but I think that Shanghai is not lesser than Singapore, Hong Kong, or Seoul. Business executive types tell me that New York is the only city that rivals its dynamism. I agree that both cities have a special energy: both are on major waterways, invest a great deal in greenery, and have a thriving business environment to support excellent leisure activities. A huge number of people moved from Beijing to Shanghai after the start of the pandemic, including me. Whereas Beijing is hit hard by every domestic outbreak, Shanghai hasn’t had many cases while being the least restrictive city in the country. It’s hard for us fresh arrivals not to smirk at our friends in the north each time we read about new restrictions in Beijing. The Shenzhen region is harder to write about given its patchwork nature. Shenzhen surpassed Hong Kong to be the region’s richest city in 2018. But it hasn’t been able to wrest leadership away from Guangzhou, which jealously guards its political power. Dongguan, Zhuhai, and Huizhou each pursue their own strategies, while Macau fits into the constellation as well (although it is less interesting given that it’s a single-industry town). Hong Kong, meanwhile, is a world unto itself. Since the political problems there over the last three years, the central government has made it obvious that it can think of the city only with exasperation. Rather than expect it to lead, Beijing is treating Hong Kong as something like an ulcer: a problem to manage away with hopefully not much more pain. I left Hong Kong in 2018, before its protests and the ensuing political crackdown. I had hastened to leave then because I already felt the keen disappointment of living in a city in structural decline. I acknowledge that Hong Kong is an urban paradise: a tropical island with a splendid geographic setting, featuring a ring of skyscrapers that hug thickly-forested mountains. There the amenities of the tropics are easy to find: beaches, forests, wild birds and animals galore, all accessible by excellent systems of public transit. Manhattan meets Maui, in other words, at the mouth of the Pearl River. And there is still an interesting cast of characters, many of whom have adventured on the mainland or the rest of Asia, to enliven the city. But Hong Kong was also the most bureaucratic city I’ve ever lived in. Its business landscape has remained static for decades: the preserve of property developers that has created no noteworthy companies in the last three decades. That is a heritage of British colonial rule, in which administrators controlled economic elites by allocating land—the city’s most scarce resource—to the more docile. Hong Kong bureaucrats enforce the pettiest rules, I felt, out of a sense of pride. On the mainland, enforcers deal often enough with senseless rules that they are sometimes able to look the other way. Thus a stagnant spirit hangs over the city. I’ve written before that Philip K. Dick is useful not for thinking about Hong Kong’s skyline, but its tycoon-dominated polity: “governed by a competent but fundamentally pessimistic elite, which administers a population bent on consumption. Instead of being hooked on drugs and television like in PKD’s novels, people in Hong Kong are addicted to the extraordinary flow of liquidity from the mainland, which raises their asset values and dulls their senses.” Therefore I think there is little excuse for young people to live in Hong Kong. They should hop over to Shenzhen, which is an hour away by subway and decades younger by spirit. Shenzhen and Guangzhou are still attracting entrepreneurial types, producing an even more commercially-oriented culture than Shanghai. But while Shenzhen is pleasant, it is also a boring city with minimal culture. A friend relates an anecdote from a gallery artist, who said that clients in Shenzhen rarely comment on the art that they plan to buy. Instead they ask only its expected price in five years. Prophets, not pragmatists One shouldn’t overdraw the differences between these regions. After all, people and officials rotate between Beijing, Shanghai, and Shenzhen all the time. But I will exaggerate their differences as part of an exercise to decompose the heterogeneity behind Chinese growth. There’s a little joke that the ideal company is led by a Beijinger, who would provide the vision, leadership, and government-relations savvy; its finances would be led by someone from Shanghai, and its operations managed by someone from Shenzhen (who would hire people from Sichuan and Anhui to do the actual work). Entrepreneurial friends say that doing business is most straightforward in Shenzhen: people there get together over dinner, discuss how to allocate the workload, and then get to work the very next day. Dinner in Beijing features lots of drinking, bluffs about one’s connections in high places, and little follow up. Beijingers are the way they are due to the imperial and socialist heritage of the city. The currency of Beijing is power. The party-state maintains a formal system of rank, a holdover of imperial times, which denotes the status of every public official. In the imperial era, the powerful enjoyed official rank and connections to the court. In the socialist era—when distribution of goods was meant to be equal—the powerful enjoyed official rank, access to the party farms and best primary schools, and connections to the Central Committee. I used to live in the embassy district. On any given day the full complement of security services might come into view: army, paramilitary, police, plainclothes police, and so on. The aura of state power is overbearing in Beijing. By power I mean the physical infrastructure, which is meant to intimidate. Beijing’s boulevards are so unwalkable because they are designed less for pedestrians than for army parades. And by power I mean the structure of personal interactions. Beijing locals have adapted to the proliferation of rules not with complete obedience, but discernment of which can be safely ignored. Northerners are thus often unruly. When I’m in Beijing, I find myself sympathizing with the Legalist school of philosophy, which enjoins the ruler to govern with a brutal fist. I speak from the perspective of a cyclist, an aggrieved class everywhere. It’s frustrating to see so many moped drivers going the wrong way or riding on the sidewalk when they see no cops in sight. But Beijing’s role is grander than mere enforcer of petty restrictions. Its control tendencies demonstrate a commitment to the transformative role of ideology. Shanghai and Shenzhen are creating wealth and leisure; Beijing is trying to lift their gaze towards its banner of utopia. The core of my letter in 2020 concerned centralized campaigns of inspiration, which is the need of the Communist Party to mobilize the population through political campaigns. A distinctive feature of Chinese governance is to continuously fix slogans, like “reform and opening” to move the country away from socialism, and the more recent “common prosperity” to move it back. Beijing isn’t satisfied with national wealth alone. It is also seeking socialist modernization and the “great rejuvenation of the Chinese people.” That is a messianic drive, complete with sacred texts, elaborate rituals, and the occasional purge. Shenzhen might stand in for the purest form of the Chinese moneymaking spirit. Many people, including northerners, move to Shenzhen for its relaxed political climate. Shanghai is a bit more of a middle ground between Shenzhen and Beijing. Although there is substantial economic dynamism in Shanghai, the data shows that the state sector makes up around the same share of the city’s eco"
