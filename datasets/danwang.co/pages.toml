title = "2020 letter | Dan Wang"
description = "Centralized campaigns of inspiration; Proust; rejecting complacency and decadence; the pandemic in Beijing; brown sauce; riding a bike; rejuvenation."
full_description = "January 1, 2021 2020 letter (This piece is my year in review; here’s my letter from 2019) I. Inspiration It’s difficult to identify a great economic reason to explore space. There are easier ways to extract minerals, doing anything at all is terribly expensive, and Mars is a hard place to make a living. The benefits of space exploration are instead mostly inspirational. Few other human activities are so grand to captivate the imagination, and doing these uneconomic projects have pulled forward technological capabilities that may otherwise have languished. It’s difficult to identify a great economic reason to practice socialism. Its historical results have ranged from catastrophic misallocation of talent at best to mass deaths at worst. But socialism still retains appeal to broad segments of many populations, which shows that it has considerable inspirational value. For better or for worse, there are still many advocates for the creation of some form of a more equal society. This year, I read every issue of Qiushi (translation: Seeking Truth), the party’s flagship theory journal, whose core task is to spell out the evolving idea of socialism with Chinese characteristics. For those not familiar, Qiushi reads like a cross between the New Yorker and the Federal Register. Published twice a month, the magazine features lengthy essays, thick pages, and some of the finest writers in the party. Each issue starts in the same way: a reprint of a speech or essay by top leader Xi Jinping—in a font distinct from the rest of the magazine’s—and then commentary and reports from the rest of the party state. Accompanying pictures feature either the country’s leaders making inspections, scenes of the people, or major pieces of infrastructure and heavy industry. Its audience? People with nothing better to do than read the party center’s commentary, like retired cadres, or those who are keenly interested in Beijing’s priorities, like local officials. Reading party speeches with its various annexes and cross references echoes my main professional activity these days. That is the study of the US sanctions regime—namely Commerce’s Export Administration Regulations and Treasury’s IEEPA-based authorities. Party speeches and US regulations are both made up of arcane, formal language that make references to more obscure texts, which themselves hint at still more distant and terrible truths. US sanctions lawyers, I suspect, can have a splendid time with Qiushi. Steady engagement with the journal throughout the year has forced me to think more deeply about the Chinese Communist Party. There are many things that Xi wants to do, I believe that his most fundamental goal is to make this Marxist-Leninist party an effective governing force for the present century. His patient work to reshape the bureaucracy is aided by a distinctive feature of the Chinese system: the use of propaganda to create centralized campaigns of inspiration. Some of Xi’s efforts have borne fruit. The country’s governance capabilities have markedly improved, a trend that is apparent in daily life. At the same time, the state has grown much more repressive. A focus on repression shouldn’t neglect the improvement in the country’s institutional and commercial strengths; and appreciation of this improvement ought to be tempered by the party center’s growing mania for control. When foreign commentators discuss the experience of reading state media, they rarely fail to attach a reference to its “turgid prose.” While some partyspeak is indeed unreadable, I’ve always seen that dismissal as a signal of contempt for the party’s pronouncements, thus deterring people from taking it seriously. But there is reason to treat its content with care. Though propaganda may not matter to you, it matters to the party. Anne-Marie Brady has pointed out that the leadership considers propaganda to be the “lifeblood” of the party state. 1 Propaganda work is considered so powerful that the person in charge must be only a functionary. Brady shows that the head of propaganda always has a seat on the Politburo, but shouldn’t usually be allowed to reach the standing committee. He is not to be too imaginative, or he might dominate the entire political system. Propaganda is key to understanding the party, since it governs not in itself, but in symbiosis with state institutions. For the most part, the party’s role can be boiled down to two items: inspiration, by setting the ideological direction, and control, through its power to select personnel. Qiushi offers an authoritative articulation of the central government’s priorities at any moment. Its job, like the rest of the state media, consists of repetition and explication of a few phrases. It’s easy to roll one’s eyes at crude sloganeering, like the two centenary goals of achieving a “moderately prosperous society in all respects” by 2021 and “a modern socialist country and the great rejuvenation of the Chinese people” by 2049. But the need to fix slogans makes good sense in Chinese governance: the party center has to speak to all local officials as well as the entire population. As Richard Epstein has argued, the greater the complexity in a system, the simpler the rules that govern it must be. One should allow, for example, extensive and nuanced bargaining between buyer and seller at the vegetable stall, but for an online marketplace to manage millions of transactions a day, then its rules must be very simple indeed. It’s up to the party center to adjust and refine slogans to signal the priorities of the moment. The easiest way to appreciate the importance of that effort is to consider Deng Xiaoping’s efforts to shift the country to pragmatic governance through Reform and Opening—itself a named initiative. He invented or instrumentalized a series of ingenious phrases that include “development is the only hard truth,” “cross the river by feeling the stones,” and “practice is the sole criterion for the determination of truth.” My favorite is his declaration at the 13th party congress that China is in the “primary stage of socialism.” Left unspecified is how long this stage will last and how many more stages there will be before the people can enjoy the full deal. Many of the party center’s slogans tend to be deliberately vague, thus permitting lower-level officials to figure out implementation. My one-sentence definition of Xi Jinping Thought on Socialism with Chinese Characteristics for a New Era is: “To achieve the two centenary goals—under the leadership of the party—by accomplishing tasks that include but are not limited to eliminating poverty, advancing the socialist rule of law, improving party discipline, etc.” That concept is still an evolving one. Meanwhile, we await better explication of the hot slogans this year: “dual circulation” and “demand-side reform.” Some of it however can be absurd: I’m skeptical that anyone can readily explain the nuances between “rule of law,” “socialist rule of law,” and “socialist rule of law with Chinese characteristics.” When it’s not being vague, the party can be trying to have things both ways. Xi declared at the third plenum in 2013 that market forces would have a “decisive” role in allocating resources, while at the same time the state sector would have a “leading” role. It’s not unusual to see a great deal of semantic acrobatics. Deng declared that socialism means the capacity to concentrate resources to accomplish great tasks; under that definition, the Apollo and Manhattan projects were exercises in socialism. In July, Xi reminded us that “socialism with Chinese characteristics has many distinctive features, but its most essential is upholding leadership by the Chinese Communist Party.”2 In other words, socialism with Chinese characteristics means the party is never wrong. Either the market or the state sector can be more important at any moment: it is the party’s pleasure to decide. Centralized campaigns of inspiration, which usually manifest through fixing slogans, is a distinctive feature of the Chinese political system. In the US, political candidates trot out slogans when they run for election; in China, one is never far from the next big named initiative. At its best, defining major goals is the essence of political leadership, and nowhere is this principle better illustrated than Apollo. John F. Kennedy announced the target in 1961: land a man on the moon and return him safely to earth before the decade was out. By fixing this clear goal, as well as committing the necessary spending, he accelerated the creation, development, and deployment of technologies that made the lunar landings possible.3 Xi grasps this idea of leadership. He has unleashed a torrent of new initiatives during his tenure. In my view, Xi feels strongly that the practice of governing China under socialism cannot be an exercise in sustained mendacity. The political system can no longer continue to be an unstable structure based on ad hoc compromises; instead it must have a clear organizational structure, with the party at the top. And the ruling party needs to have the political consciousness of an effective governing force. Consider two of his most important initiatives: the campaign against corruption and the move toward law-based governance. Xi has decided that corruption is not a mystery to be endured, but a problem to be solved. A few years past the peak of the crackdown, it’s fair to say that the campaign hasn’t solely been effective in removing his adversaries, but has also been broad enough to restore some degree of public confidence in government. A few commentators contend that removal of opportunities for graft have prompted talented people to leave government. But the flip side of that coin has been the improvement in morale among the civil servants who found corruption among colleagues to be intolerable, and can finally see themselves doing public work well. And for years, Xi has emphasized following clear rules of written procedure, under the rubric of “law-based governance.”4 Since then, the state has improved regulatory systems, for example in setting clear standards for license approvals, as well as creating effective securities and antitrust regulations. The state has removed some of the arbitrary aspects of governance, thus bringing serious enforcement actions following the passage of relatively clear regulations. That has improved facts on the ground. Companies and lawyers tell me that a decade-long effort by the State Council to ease doing business has yielded real results. Obtaining business licenses no longer requires a relentless pace of wining and dining, and has instead become close to a matter of routine. I haven’t been able to verify this fact for myself, but one of my friends told me that the office of the National Development and Reform Commission used to be ringed by some of the fanciest restaurants in Beijing, offering mostly private rooms; many of these restaurants have now closed, following the professionalization of business approvals. The lived experience of being in Beijing has improved in parallel. I remember what a nightmare it was to buy a high-speed rail ticket for the first time years ago, which involved lots of yelling and multiple people cutting in line. Today, I purchase one on my phone, with no need to obtain a paper ticket, and the lines to board are more or less orderly. Consumer products of all sorts are getting pretty good, and the customer service experience of engaging with any of these companies tends to be not unpleasant. There’s certainly still all sorts of disorderly behavior, but anyone can notice the improvement on all fronts of daily life. In more macro view, some of the breathless stories from years ago on China’s growing capabilities look at last like they’re on good ground today: the country has produced credible companies, have many investable assets (especially in fixed income), and are building globally-competitive brands. It’s easy to enumerate the grave problems facing the country, but critics tend to under-appreciate its strengths. Chief among them, in my view, has been the party’s surprising adaptability. At any given point, commentators have said that the problems have become too big for the government to handle. Meanwhile, the country has achieved a good record of pulling itself out of sticky situations: in 1992 when it restarted reform, after the financial crisis of 1997, and again in 2008. That record was validated most spectacularly again this year in the aftermath of the Covid-19 outbreak. This year made me believe that China is the country with the most can-do spirit in the world. Every segment of society mobilized to contain the pandemic. One manufacturer expressed astonishment to me at how slowly western counterparts moved. US companies had to ask whether making masks aligned with the company’s core competence. Chinese companies simply decided that making money is their core competence, and therefore they should be making masks. The State Council reported that between March and May, China exported 70 billion masks and nearly 100,000 ventilators.5 Some of these masks had problems early on, but the manufacturers learned and fixed them or were culled by regulatory action, and China’s exports were able to grow when no one else could restart production. Soon enough, masks were big enough to be seen in the export data. It’s obvious that the authorities in Wuhan screwed up big, but it’s also the case that the central government organized an effective response to virus containment. It’s not just the manufacturers: the consumer internet companies leapt into action in a way that their US peers did not. 6 Francis Fukuyama states that high-trust societies have “spontaneous sociability,” in which people are able to organize more quickly, initiate action, and sacrifice for the common good. On each of these metrics, I submit that China should receive high marks. As every discussion on China grows more strident, and as every proposition about it has to be vested with sentiment, I submit that it’s all the more important to be able to see things as they are. That entails having coming to terms not just with a rise of its repression, but also with its growing commercial and institutional strengths. US elites have abandoned the idea that China would liberalize nicely. They should put another idea to bed: that this authoritarian system, riddled with weaknesses, is on the brink of collapse. The country’s strengths are real and improving while the government becomes more nasty towards its critics and the rest of the world. China is neither a Marxist fundamentalist regime nor a universally-surveilled open-air prison, in which one is free to do nothing but worship the party and carry out its edicts. That is however the impression created by quite a bit of the media. 7 I think that’s not the fault of individual journalists, instead more structural explanations are at work. News bureau"
