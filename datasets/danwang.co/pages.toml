description = "Thiel delivered lectures on startups at Stanford in 2012. They’re all online here. These are superbly interesting. I’ve decided to record here my personal favorite parts. Class 1: The Challenge of the Future We might describe our world as having retail sanity but wholesale madness. Details are well understood while the big picture remains unclear. […]"
full_description = "April 2, 2014 Lecture notes by Peter Thiel Thiel delivered lectures on startups at Stanford in 2012. They’re all online here. These are superbly interesting. I’ve decided to record here my personal favorite parts. Class 1: The Challenge of the Future We might describe our world as having retail sanity but wholesale madness. Details are well understood while the big picture remains unclear. All successful companies are different; they figured out the 0 to 1 problem in different ways. But all failed companies are the same; they botched the 0 to 1 problem. We tend to think very statistically about the future. And statistics tells us that it’s random. We can’t predict the future; we can only think probabilistically. If the market follows a random walk, there’s no sense trying to out-calculate it. Companies exist because they optimally address internal and external coordination costs. In general, as an entity grows, so do its internal coordination costs. But its external coordination costs fall. Totalitarian government is entity writ large; external coordination is easy, since those costs are zero. But internal coordination, as Hayek and the Austrians showed, is hard and costly; central planning doesn’t work. Severe coordination problems may stem from something as seemingly trivial or innocuous as a company having a multi-floor office. The easiest answer to “why startups?” is negative: because you can’t develop new technology in existing entities. There’s something wrong with big companies, governments, and non-profits. The intellectual rephrasing of these questions is: What important truth do very few people agree with you on? The business version is: What valuable company is nobody building? Class 2: Party like it’s 1999? We are all born into a particular culture at a particular time. That culture is like an extended dinner conversation; lots of people are talking, some lightly, some angrily, some loudly, some in whispers. It is questionable whether one can really understand startups without, say, knowing about Webvan or recognizing the Pets.com mascot. Most of the 1990s was not the docom bubble. Really, what might be called the mania started in September 1998 and lasted just 18 months. The rest of the decade was a messier, somewhat chaotic picture. The 1990’s could be said to have started in November of 1989. The Berlin Wall came down. Two months of pretty big euphoria followed. In 1998, the Ruble crisis hit Russia. These were unique animals in that usually, either banks go bust or your currency goes worthless. Here, we saw both. So your money was worthless, and the banks had none of it. Zero times zero is zero. The technology bubble was an indirect proof; the old economy was proven not to work, as we could no longer compete with Mexico or China. Emerging markets were proven failures, rife with cronyism and mismanagement. Europe offered little hope. And no one wanted to invest with leverage after the LTCM disaster. Proof by contradiction is a dangerous way to draw conclusions. The world is not always a logical place. So even if something’s not A,B,C, or D, it doesn’t necessarily follow that the truth is E. There’s no shortage of anecdotes. There were 40-year-old grad students at Stanford who were trying to start dozens of rather wacky companies. Now, usually being a forty-something grad student means you’ve gone insane. And usually, trying to start several companies at once is seen as unwise. But in late 1998, many people believed this to be a winning combination. The founders agreed that PayPal could not afford to hire sketchy people. So they just hired their friends instead. The PayPal team reached an important conclusion: BD didn’t work. They needed organic, viral growth. They needed to give people money. 7 to 10% daily growth and 100 million users was good. No revenues and an exponentially growing cost structure was not. A South Korean firm that really wanted to invest called up PayPal’s law firm to ask where they could wire funds to invest. It promptly wired $5 million without any documents or negotiating a deal. The Koreans absolutely refused to say where PayPal could send the money back. For bubble and anti-bubble thinking are both wrong because they hold the truth is social. If the herd isn’t thinking at all, being contrarian – doing the opposite of the herd – is just as random and useless. Class 3: Value Systems Enemies in the War on Fraud were many. There was “Carders World,” a dystopian web marketplace that vowed to bring down Western Capitalism by transacting in stolen identities. The term “perfect competition” seems pregnant with some normative meaning. It’s not called “insane competition” or “ruthless competition.” Thats probably not an accident. Perfect competition, we’re told, is perfect. Globalization seems to have a very competitive feel to it. It’s like a track and field sprint event where one runner is winning by just a few seconds, with others on his heels. That’s great and exciting if you’re the spectator. But it’s not a natural metaphor for real progress. The single business idea you hear most often is: the bigger your market, the better. That is utterly, totally wrong. The restaurant business is a huge market. It is also not a very good way to make money. Well-defined, well-understood markets are simply harder to master. Class 4: The Last Mover Advantage Too often in the race to compete, we learn to confuse what is hard with what is valuable. The pithy, wry version of this is the line about Rhodes Scholars: they all had a great future in the past. Henry Kissinger’s anti-academic line aptly describes the conflation of difficulty and value: in academia the battles are so fierce because the stakes are so small. Just look at high school, which for Stanford students and the like, was not a model of perfect competition. It probably looked more like extreme asymmetric warfare; it was machine guns versus bows and arrows. No doubt that’s fun for the top students. But then you get up to college and the competition amps up. Even more so during grad school. Things in the professional world are often worst of all; at every level, people are just competing with each other to get ahead. Top high school students who arrive at elite universities quickly find out that the competitive bar has been raised. But instead of questioning the existence of the bar, they tend to try to compete their way higher. Universities deal with this problem in different ways. Princeton deals with it through enormous amounts of alcohol. Yale blunts the pain by encouraging people to pursue extremely esoteric humanities studies. Harvard sends its students into the eye of the hurricane. Everyone just tries to compete even more. If a bearish investor reminds you that 90% of restaurants fail within 2 years, you’ll come up with a story about how you’re different. You’ll spend time trying to convince people you’re the only game in town instead of seriously considering whether that’s true. There are three steps to creating a truly valuable tech company. First, you want to find, create, or discover a new market. Second, you monopolize that market. Then you figure out how to expand that monopoly over time. What is amazing about Amazon was how they were able to gradually scale from bookstore to the world’s general store. Zynga wants the narrative to be about hardcore psychometric sauce. it’s a better company if it’s figured out how psychological and mathematical laws give it permanent monopoly status. Zynga wants, perhaps needs, to be able to truthfully say: “We know how to make people buy more sheep, and therefore we are a permanent monopoly.” The best way to fail is to start big and then shrink. Disruptive companies tend not to succeed. Disruptive kids get sent to the principal’s office. Just look at Napster. The time to build a car company was the time when car technology was being created. The last major car company that got started is the American Motors Corporation in 1954. An important subquestion is whether, given a gold rush, you’d rather be a gold digger or the guy selling shovels. Why should the 20th employee join your company? If you have a great answer, you’re on the right track. The right answer has to be that you’re creating some sort of monopoly business. Class 5: The Mechanics of the Mafia Cults are crazy and idealistic in a bad way. Cult members all tend to be fanatically wrong about something big. You want your people to be different in a way that gives the company a strong sense of identity and yet still dovetails with the overall mission. Engineers and STEM people tend to be highly intelligent, good at problem solving, and naturally non zero-sum. Athletes tend to be highly motivated fighters; you can only win if the other guy loses. The problem with a company made up of nothing but athletes is that it will be biased towards competing. Athletes like competition because, historically, they’ve been good at it. So they’ll identify areas where there is tons of competition and jump into the fray. The problem with a company made up of nothing but nerds is that it will ignore the fact that there may be situations where you have to fight. The notion that diversity in an early team is important or good is completely wrong. You should try to make the early team as non-diverse as possible. In a team, an n-squared communications problem emerges. In a five-person team, there are something like 25 pairwise relationships to manage and communications to maintain. The more diverse the early group, the harder it is for people to find common ground. The most talented folks are almost always quirky. Watch for the quirks and embrace them. Nothing is stranger than watching a quirky entrepreneur criticize another quirky entrepreneur for being too quirky. The management team at PayPal was very frequently incompatible. Management meetings were not harmonious. Board meetings were even worse. They were certainly productive meetings. Decisions were made and things got done. But people got called idiots if they deserved it. If people complain about people behind each other’s backs, you have a problem. If people don’t trust each other to do good work, you have a problem. But if people know that their teammates are going to deliver, you’re good. Even though people would physically fight on the engineering room floor, if you ever asked PayPal people if they respected each other, the answer was obvious. For a long time, everyone believed in everyone else. The standard view is that companies get destroyed by external competition. Maybe that’s true in the long run. But in the short run, they get destroyed internally. They are complex entities with complex dynamics. Usually those dynamics blow up before some predator from the wider ecosystem strikes. If you graduate Stanford at 22 and Google recruits you, you’ll work a 9-to-5. It’s probably more like an 11-to-3 in terms of hard work. They’ll pay well, it’s relaxing, but what they’re actually doing is paying you to accept a much lower intellectual growth rate. When you recognize that intelligence is compounding, the cost of that missing long-term compounding is enormous. They’re not giving you the best opportunity of your life. You might realize one day that you’ve lost your competitive edge. You won’t be the best anymore. Arguing about smart marketing moves or different approaches to solving tactical or strategic problems is fundamental. These are decisions that actually matter. Avoid groupthink in these areas is key. Class 6: Thiel’s Law Beginnings of things are very important. Beginnings are qualitatively different. The importance of foundings is embedded in companies. Where there’s a debate or controversial claim at Google, one says, “The Founders have scientifically determined that x is true,” where x is his preferred position. Once the paradigm shifts from 1 to n, the founding is over. Good, high-trust people with low alignment structure is basically anarchy. Talented people could work on all sorts of different projects and generally operate without a whole lot of constraints. Sometimes the opposite combination – low trust people and lots of rules – can work too. This is basically totalitarianism. Foxconn might be a representative example. The low-trust, low-alignment model is the dog-eat-dog sort of world. People you might not trust can do a lot of whatever they want. An investment bank might be a good example. The ideal is the combination of high-trust people with a structure that provides a high degree of alignment. People trust each other and together create a good culture. But there’s a good structure to it, too. People are rowing in the same direction, and not by accident. If the founders are in sync, you can move on to the rest of the company. But if they aren’t, it will blow up the company. You should set up as a Delaware C corporation. That is the right answer. Experience has shown that there is great predictive power in a venture-backed CEO’s salary: the lower it is, the better the company tends to do. Being part-time, holding other jobs, or bringing on consultants or advisors to do important work are big red flags because those arrangements are very mis-aligning. Class 7: Follow the Money The more a VC understands the skew pattern, the better the VC. Bad VCs tend to think that all companies are created equal, that some just fail, spin wheels, or grow. In reality, you get a power law distribution. It’s troubling if a startup insists that it’s going to make money in many different ways. The power law distribution on revenues says that one source of revenue will dominate everything else. People who are most heavily motivated by money are never the ones who make the most money in the power law world. If you go to an incubator that’s not Y-Combinator, that is perceived as a negative credential. It’s like getting a degree at Berkeley. You can discover a lot about founders by asking them about their choices. What are the key decisions you faced in your life and what did you decide? What were the alternatives? Why did you go to this school? Why did you move to this city? Class 8: The Pitch Be funny and help your cause. In the tech community, even one joke will suffice. Raising too much can haunt you. Map out your operating expenses for one year, multiply that figure by 1.5, and ask for that, as a first approximation. It helps to pitch as early as possible in the day. When you make your ask, don’t give them tons of different financing options or packages or other attempts at optimization. That will burden them with a cognitive load that will make them unhappy. Keep it simple. No senior VC needs to do your investment. You should never forget that. Do not rely on VCs to draw key inferences. They may, but why risk it? There’s a romantic notion that th eonly thing that matters is product and that you can devote yourself to that entirely. That is false. In fact, fully half of your job is selling the com"
