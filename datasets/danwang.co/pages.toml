title = "Game of Thrones: A Girardian Reading | Dan Wang"
description = "The world of George R. R. Martin revolves around mimetic desire, and A Song of Ice and Fire models fundamentally Girardian ideas."
full_description = "August 26, 2015 Game of Thrones: A Girardian Reading I’ve recently been reading René Girard. As an exercise I decided to try my hand at something he does so well: applying the ideas of mimetic theory to works of literature. Here’s a Girardian reading of the books and the show that have become popular. Girard’s ideas are tricky to summarize, especially in a way that attempts to convince. Instead I’ll leave all concessions to the reader, with encouragement to check out Girard on Wikipedia or to read this introduction from Imitatio. This is by no means an exhaustive discussion of mimetic issues in A Song of Ice and Fire. I’m interested instead in pointing to broad themes. Please do let me know where I’m off in my grasp of either Girard or the ASOIAF storyline. (With respect to the latter, I’ll disclaim that I’ve kept up with the show but have not read the last book.) Now let me present the idea that mimetic desire is a significant part of Martin’s world. External mediation by Targaryens The books begin in the reign of King Robert Baratheon. Robert’s royal ascent is a recent one. It came about only recently after he led a rebellion against the Targaryen dynasty, which until then had ruled the realm for hundreds of years. Why did the Targaryen reign last so long? We can begin by noting that the family was literally a race distinct from the rest of Westeros. The Targaryens were a slightly magical people who came from a different continent, bringing with them their own language, religions, and customs. They helpfully had control of dragons, which they used to destroy unfriendly kingdoms. Thus began their rule. Were the Targaryens were able to keep the peace for long because they were so different from the people they ruled? In Girardian terms, the desire by great houses (Starks, Lannisters, Baratheons, etc.) to seek the throne has been externally mediated. The other kingdoms weren’t sucked in to mimetic rivalry because the Targaryens were on a different plane. There was not a sustained, general rebellion against them before Robert’s. The same is not true for the great houses in various kingdoms. House Reyne, for example, attempted to depose House Lannister, and every great house has had trouble keeping smaller houses in line. No one dared challenge the Targaryens, but smaller houses would gamble on rebellion to control a region. The Targaryen power declined over the course of a century. They gave up their religion, lost their ability to play with fire, and couldn’t keep breeding dragons. Robert rebelled when the Targaryens lost not just most of their might, but also most of their distinctiveness. It wasn’t just a question of power. It had been decades since the Targaryens had dragons, and it’s not clear how without them they could have warded off the invasion of another ambitious house. After people realized that they weren’t so special, the Targaryens were conquered by Robert. And how long did Robert keep the peace? A meager two decades. When lords realized that Westeros could be ruled by a non-Targaryen, their envy stirred. The Iron Throne switched from being a source of external mediation into a source for internal mediation. That may be the most fundamental reason for why war broke out in multiple places as soon as Robert became weak. The collective murder of Jon Snow Jon Snow is at once an extreme insider and an extreme outsider. He is at once a Stark and not a Stark. He’s the commander of the Night’s Watch but out of sync with his subordinates. He’s one of the few people who joined the Watch without lordly compulsion. He’s the perfect victim, a nonviolent person in a culture ruled by violence; it was he who wanted to save wildlings instead of letting them be killed by White Walkers. In one sense he’s barely a fit member of the Watch, and in another sense he’s an extreme one. The show sets Jon up as a Jesus figure. I want to fixate not on the question of his resurrection, but instead on the facts of his murder. Since I haven’t read the last book, I’ll rely on the interpretation presented by the show. The situation is precarious. Winter has come, a mutiny tore the Watch apart not long ago, and wildlings have been moving south en masse, some mingling with members of the Watch. Jon’s position as commander is hardly secure; he was elected recently and with a slim margin. And what is one of his first acts? To go on an expedition to save wildlings, the traditional foes of the Watch, and bring them south of the Wall. Mimetic contagion spreads through the Watch. Brothers are starting to show visible hatred towards Jon, without presenting arguments against his actions or suggesting alternatives. A mimetic snowballing rolls through the group. Eventually a consensus emerges that Jon must die. It’s not clear if the conspirators plan anything beyond this move, since the act is mostly a way to express their rage. They determine that Jon is the cause of the crisis and also the agent for its resolution. Jon’s murder is a collective one. It takes many stabs from many people to kill him. Everyone gets a go, and no one can be pinpointed as the murderer. In the books, the attack is led by Bowen Marsh, a fellow steward, the same class that Jon belonged to. In the show, the final stroke is left for Olly, again a fellow steward. See the parallels to the Girardian Christ? Jon died in part because he refused to engage with the mimetic cycle. The proximate justification for his murder is that he saved wildlings rather than ordered their destruction. It’s very much a turn-the-other-cheek renunciation of violence. And it was an effective invitation for the community to rally against him. Shakespearean, not Marxist conflict Here’s a more general point. There are dragons and zombies in the stories, but the stories are not primarily about dragons and zombies. That’s partly why the books and the show have earned critical acclaim. They’re mostly about people fighting each other, with rich depictions of ambition, betrayal, corruption, etc. amongst humans. Dragons and zombies are still peripheral to the story, and instead we’re served tales of intrigue between various houses. Knowledge that these monsters are out there hardly seems to disturb the various lords. Instead they view them as distractions to their main enemies: hostile houses. And so we get a fundamentally Shakespearean, and that is to say, Girardian, model of conflict instead of a Marxist one. People are obsessed with fighting others like themselves. Wars aren’t fought to defeat collective, existential threats. Instead they’re fought to avenge honor, or sometimes for political or territorial gains. It’s Montagues vs. Capulets, not the huddled masses vs. capitalists. Winter as mimetic crisis At the time of the first book, magic had largely disappeared for at least a few decades. Lords came to rely on a supposedly rational order of maesters, a sage class with a scientific bent. The re-emergence of magic might be taken as a sign of mimetic crisis. Consider a specific magical event: the Long Night. It was a winter that lasted for “a generation,” descending on the continent 8000 years ago. Ice zombies called White Walkers emerged from the north, raising wights to fight the living. Finally a hero drove these monsters back, and people built up a wall to seal them off. This was an event far in the past, one barely believed by the few who’ve heard of it. Let’s read this as a mimetic crisis. The cold, the snow, and the darkness are brought about by mimetic tensions; the conditions resemble a plague, in which animals die and crops don’t grow. The emergence of monsters may be a metaphor for the violence brought about by mimetic contagion. What does it take to defeat these monsters? A human sacrifice of an apparently random person. Azor Ahai first attempted to stop by the crisis by sacrificing a lion. When that didn’t work, he sacrificed his wife. The reasons she had to die are never particularized. Yet she is the person chosen to resolve the crisis, and her sacrifice is divinized because it allows the hero to forge a magical sword. He duly drives the monsters back. Let’s look at winters more generally. One of the most interesting features of Martin’s world is that seasons arrive at uneven intervals. They’re apparently not tethered to any natural events. Perhaps that’s because they’re responsive to social events? I submit it’s not a coincidence that a new winter began and magic started to re-emerge at the end of Robert’s reign. The winter, the attacks by White Walkers, and the birth of dragons may all be a sign of the precipitating mimetic crisis, in which brothers turned upon brothers and the country broke out in a war of all against all. Other instances of mimetic desire There are many examples of Girardian ideas at play. I’ll only gesture at them here but leave them untouched. Can we consider the varieties of orders that swear off mimetic desires (e.g. the Night’s Watch, maesters, the faith) to be especially successful organizations? Do the unharmonious relationships between brothers (e.g. Victarion/Euron, Renly/Stannis) outnumber the unharmonious ones, and is Jaime/Tyrion’s the exception that proves the rule? Can we find passages explicitly demonstrating how the Iron Throne mediates desire? How does the Ramsay/Roose relationship resemble the Jon/Ned relationship? And what’s with the many surrogate fathers of Arya? Final thought I haven’t digged up a direct connection between George R. R. Martin and René Girard. Martin isn’t exactly Proust or Cervantes, but I see him as modeling Girardian ideas. Does anyone else think that his world fundamentally revolves around mimetic desire? Subscribe to new posts I publish infrequently. Enter your email to get my posts delivered to your inbox: Email Sign up Maybe others would like this piece too:TweetPocketEmailReddit Posted in Books, Economics"
