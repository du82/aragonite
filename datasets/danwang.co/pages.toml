title = "Two months of Soylent | Dan Wang"
description = "Soylent is great if you’re not expecting a lot out of it. I’m little affected healthwise. I don’t find that I have a lot more extra time."
full_description = "July 22, 2015 Two months of Soylent I’ve been drinking Soylent, the powdered meal replacement, once a day for nearly two months. Here’s what it’s been like for me, separated in different modules so that you can read whatever you’re most curious about. Why I got it. The University of Rochester is located inside the bend of a river. A huge cemetery caps the bend so that the only ways out are the tips of the curve. You can cross the river via a bridge, into a neighborhood responsible for a big chunk of all crimes committed in upstate New York. The upshot is that for a city-based college, the U of R offers unusually few good food options close to campus. The dining halls serve dining hall food, expensively; there are no substantial grocery stores around; there are few restaurants, even fast food joints, nearby. I like to cook, and right before senior year I was living in the center of Toronto while working at a company that offers daily catered lunches. After that summer I decisively gave up hope that college food could be fun. So I ordered Soylent. (Incidentally, the company I worked at runs the software used to sell Soylent.) Taste. I’ve received two types of Soylent: Version 1.3, which I’ll call cake-mix Soylent; and Version 1.4, which I’ll call burnt-sesame Soylent. The earlier one comes with bottles of oil that are to be mixed with powder and water; the latter version is straight powder. 1.3 has a sweet taste. It’s presumably the version reviewed by The Verge, which likened the flavor to peanut butter mixed with milk. Appealing, no? Those though aren’t the words I’d use. For me it smells and tastes like those Betty Crocker vanilla-flavor cake mixes: A bit oversweet, but otherwise quite pleasant. The consistency is thin, so it doesn’t go down all that smoothly. I prefer 1.3 to 1.4. This newer version is bland, hardly sweet. It has more of a savory taste, and the best I can do to describe it is to say that it reminds me of slightly burnt sesame seeds. There’s a bit of a nutty flavor. It’s thicker and smoother, but I do miss the sweetness of the old version. As I started to drink Soylent regularly, I got scared of the possibility that I’ll one day find it too revolting to swallow. That won’t happen soon, but the thought lurks. Once you reach that point you never want to drink this stuff again, no matter how thoroughly it’s modified and updated. A problem I’ve had with both versions is the persistence of clumping; you can’t get rid of the occasional bit of dry powder in your mouth as you drink. Making it with warm water doesn’t eliminate them. No matter how aggressively I stir and shake, they’ll always be there, undissolved. (Note: I don’t have a blender and haven’t at all been creative with the mixture, for example by adding fruits or cocoa.) Last thing about taste: You’re supposed to make Soylent the night before and let it chill in the fridge. One day I forgot to do that and had it “fresh.” It was awful. Good Lord. Never drink this stuff warm. Satiety. Soylent is filling for the moment, but I get hungry soon afterwards. I usually have it to replace lunch, and am looking for food three or four hours later. I’m not a snacker, but I have to keep a stock of apples and cookies. Soylent might make more sense for breakfast, when convenience is more of a premium and where the distance to the next meal is shorter. I can’t see myself going entirely without food, as anyway this was never my intention. I enjoy cooking if I have easy access to ingredients! I’d be hitting the point of revulsion much sooner if I have this more than once a day. Health. I’ve experienced no noticeable changes in health or digestion. Some people say that they lose weight, get more energy, or even get to see skin improvements. I haven’t noticed these or any other changes. It’s all been… normal. Storage, preparation, and convenience. The raw powder can last a long time (upwards, it’s claimed, of two years). But watch out for the caveat: Soylent spoils quickly once you make it. It takes me four days to finish a batch. Twice when I skipped a day the last quarter of Soylent spoiled, and when it was always refrigerated too. So I’m wary of taking it out and bringing it for example on a hike. You run the risk of spoilage, it tastes terrible when unchilled, and the container is hard to clean in the outdoors. Making Soylent is as convenient as promised. All you have to do is dump a bag of powder in a pitcher made by the company, throw in water and oil, then shake/stir. With the new Soylent, you don’t even have to add the oil. These are the basics. I’ve learned tweaks, e.g. having water in the pitcher before adding the powder to reduce clumping. It takes maybe ten minutes, and then I have lunch for four days. Washing the big, gooey pitcher requires lots of soap and water, but of course that’s easier than doing lots of dishes. Has it been life changing? Not really. The positive take is that Soylent is great if you’re not expecting a lot out of it. I’m little affected healthwise. I don’t find that I have a lot more extra time. That said, it is nice not to have to think about what to do for lunch. I guess that the biggest benefit of Soylent for me is a psychological one. I don’t always want to cook, but I’m frugal enough not to want to eat out more than a few times a week. I’ve always been a lunch packer. Soylent makes it easy for me to get out of cooking every day without having to feel guilty about eating out. After all, this stuff is cheap, about $3 per meal. Frustrations with the company. I placed my first order last July, hoping that the shipment would start in September. Soylent told me to wait until October. Come October, a delay: The company told me to expect it in November. Come November, delay again. By the time the powder arrived I had already moved to Germany. Soylent doesn’t ship internationally so I had to wait trying it out until I returned. Once the subscription started everything was smooth, but the delays were annoying. The advertised two-month waiting period turned into a five-month one. Ideological commentary. You see I’ve saved this until the very end. People give me incredulous looks and questions when they see that this is what I’m “eating.” Some react with visible sympathy, as if I’ve never enjoyed good food. It’s in vain that I assure them that I grew up in one of the great food cultures of the world, or that I don’t mind cooking, or that Soylent doesn’t demand that I give up on the world of solid food. Quite a bit of the skepticism directed towards Soylent feels misplaced and elitist. I don’t understand why people are so derisive of it. I challenge the doubters to declare that every meal they have is a plate of nutritious deliciousness, prepared simply, and enjoyed in the company of friends. For the rest of us, there’s at least one meal that involves little cooking, is meant to be quick, and is not often nutritious. That’s called breakfast, and for that at least, isn’t Soylent a great replacement? People, Soylent is a straightforward Pareto improvement over lots of common situations. It’s simpler and better for you than to get donuts and iced coffee; or a hot dog in a cafeteria before a meeting you’re late for; or a frozen microwave dinner after an exhausting day. Tastewise, Soylent is about as interesting than the latter two. This stuff should be sold in (refrigerated) vending machines, and well-stocked in corporate fridges. It may not be super tasty, but it’s pleasant and nutritious. Other issues. No I haven’t seen the movie. Yes I would order more when I run out. Subscribe to new posts I publish infrequently. Enter your email to get my posts delivered to your inbox: Email Sign up Maybe others would like this piece too:TweetPocketEmailReddit Posted in About me"
