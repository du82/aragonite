full_description = "March 14, 2016 Things I’ve recently learned, 3.13.16 Here are a few things I’ve been recently thinking about: 1. Intelligence is overrated; curiosity and a bias for action are underrated. There’s an abundance of people who are able to come up with solutions once a problem is presented to them. There are far fewer people who are able to figure out how to frame problems in the first place, and to actually implement the solution once they have an idea. I’m not sure if Silicon Valley is more or less prone to this. 2. I’ve been having way too much fun recently reading up on British titles. Did you know that the “Commissioner in Lunacy” was a real position until 1914? No matter how much I research, I can’t figure out the responsibilities of the “Lord Privy Seal.” Relatedly, I’ve found fascinating why it’s the “British Army” while it’s the “Royal Navy” and the “Royal Air Force.” (The convention is repeated in other Commonwealth countries, e.g. the “Royal Canadian Navy,” “Australian Army,” and “Royal New Zealand Air Force.”) Apparently it has to do with the fact that armies are raised by local lords, and therefore under the control of Parliament; but if you want to invade France, you need the monarch to raise a fleet. Furthermore, Scottish troops would be reluctant to serve a “Royal Army” after the Acts of Union with England. Still, it doesn’t explain why it’s the “Royal Air Force.” Didn’t the air force emerge from the army, which should strip it of its “royal” designation? 3. Of my recent Flexport articles, my favorite is: “Supply Chain of the Banana.” 4. I recently overheard an eminent writer say: “The problem with most people is that they’re not interested in anything at all. If you cultivate interests, people will think that you’re interesting yourself.” At first I thought “being interested in things” is not sufficient to being interesting, but I’ve warmed up to the idea. 5. My favorite recording of Mahler 3 is Abbado with the Wiener Philharmoniker. I can find no instance of cinematic music that’s more idiomatic than the opening of “The New World,” which features the vorspiel of Wagner’s Das Rheingold. And I’ve become fully comfortable admitting that hysterical Verdi > sublime Verdi. 6. Two questions: Why do so few people write consistently? It seems valuable, and I wish that more of my smart friends would put their ideas down in print. And why do so few people outbound? It’s usually not so hard to get a meeting with someone interesting, if you’d tweet or send an email. But so few people actually make the ask. 6. I’m trying harder to be direct and forthcoming. To do that, I’ve become more open about the things I’m ashamed about. I find doing this to be more valuable: First, it boosts confidence so that I can more quickly get to the point. And it also makes it easier for the other party to do the same. I’m hesitant though to do that online, by which I mean Twitter and this blog. There’s much more room for misinterpretation print. Someone has said that it’s less risky to have a child than to write; at least you’re able to legally disown your progeny. 7. The most beautiful book title I’ve seen in recent months is *Autumn in the Heavenly Kingdom,* by Stephen Platt. The second best has to be: *The Pity of It All: A Portrait of the German-Jewish Epoch, 1743-1933.* I much prefer the UK version of Rose George’s book: *Deep Sea and Foreign Going,* to the American version: *Ninety Percent of Everything.* 8. Something else I’ve learned recently: Goebbels spent as much money on theatre as he did on propaganda, which is twice as much as he did on films. Apparently it was because theatre-going was very much an activity of the middle-class, of which Goebbels really needed support. (This is from Nicholas Stargardt’s *The German War*) 9. Some personal news: I’ve moved from northern Oakland/southern Berkeley to Pac Heights in the city. I love the college environment of Berkeley, but I found too good of a deal to pass up in the really nice neighborhood of Pac Heights. Living in the city already feels different, perhaps I’ll write more about it once I’ve been here for a while. In the meantime, do send me a note if you’d like to meet up. There are a lot of coffee shops and restaurants nearby. Continue reading → Maybe others would like this piece too:TweetPocketEmailReddit"
