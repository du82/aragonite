title = "2022 letter | Dan Wang"
description = "Becoming a barbarian; an ideological revelry; lockdown; sweetgrass and banana leafs; crankiness; delightful animals; to the mountains"
full_description = "March 4, 2023 2022 letter (This piece is my year in review, this year a bit late; here’s my letter from 2021) Mountains offer the best hiding places from the state. There were a lot of state controls to escape from in 2022. Two days before Shanghai locked down in April, I was on the final flight from the city to Yunnan, the province in China’s farthest southwest. Yunnan’s landmass — slightly smaller than that of California’s — features greater geographic variation than most countries. Its north is historic Tibet, while the south feels much like Thailand. People visit the province for its spectacular nature views: rainforest, rice terraces, fast rivers, and snowy mountains. Otherwise tourists are drawn to its ethnic exoticism. As many as half of the country’s officially-recognized ethnic groups have a substantial presence there, including many of those that have historically resisted Han rule. As Shanghai’s lockdown became protracted, a trip planned to last days grew into one that lasted months. Wandering through Yunnan gave me a chance to contemplate the culture of the mountains. They are towering in the north. These are Tibetan areas home to a meaningful chunk of the Himalayas: Yunnan’s highest peak is Kawarkapo, one of Tibetan Buddhism’s most sacred mountains. This region is unbeatable for snowy beauty. The roads around them are strewn with fluttering prayer flags and studded with impassive yaks. Something in the thinness of the air produces more vivid light, which fires up white peaks in brilliant red when the sun is low. I went on several hikes around Kawarkapo and Tiger Leaping Gorge, which offer gorgeous treks through tough terrain.1 Northern Yunnan is a site of improbable mixings. Missionaries made headway into these lands in the 19th century, establishing not just a Christian population but also vineyards that continue to produce wine grapes. In a remote valley, I passed by a vineyard owned by LVMH to produce Cabernet, which retail for US$300 per bottle.2 The most stimulating parts of this region are not the cities of Lijiang or Shangri-La, but the more remote Tibetan areas. Tibetans have been subject to decades of forced assimilation to Han culture, but they still find room to practice small acts of subversion. One guide told me, for example, that monks have slipped a portrait of the Dalai Lama behind the portrait of the Panchen Lama in their monastery, allowing them to pray in good conscience. These rounds of control and evasion continue to grind on. The mountains are gentler in the south. Tea hills are set amidst rainforest and rubber plantations in Xishuangbanna, the prefecture that sits above Laos and Burma. The weather there is sweltering. To cool down, one can take a dip in the Mekong River, which carries remarkably cold water that has flowed from the Tibetan highlands, or eat its tropical fruits: mango, papaya, durian, or so many melons. Xishuangbanna is one of China’s most biodiverse regions, home to thousands of species of trees, as well as wild elephants, peafowl, bears, and birds galore. In southern Yunnan, most of the people have Southeast Asian features. Xishuangbanna hosts around a dozen of China’s official ethnic groups, some of which consist of only a few tens of thousands of people clustered around certain mountains. The most prominent group there is the Dai, while the smaller groups include the Aini, Bulang, and Hani peoples.3 Most make their living off of mountain agriculture, which means planting cash crops like tea, rubber, or bananas (unless they’ve chosen to put on their ethnic dress to cater to tourists). That cultivation intermixes with the foraging of wild herbs, mushrooms, and flowers, along with occasional illicit hunting of game. A more perilous venture would be to traffic narcotics, since the area is right along the Golden Triangle. I ended up spending most time in the north-central city of Dali. It is located in the most temperate part of Yunnan: cooler than Xishuangbanna and sunnier than Shangri-La, bounded by a mountain range to the west and a large lake to the east. The local people are the Bai, whose cultural practices are proximate to the Han’s. My home was a wooden farmhouse in a Bai village at the foot of the mountains. If I stayed closer to the lake, the houses would be made of attractive stone, ornamented with wooden carvings and ink paintings on white wall. The Bai have a long culture of craftmaking, producing marbleware or tie-dye linens for trade. Up until the early 2000s, a different Bai product attracted foreign travelers: cannabis, which grew freely around Dali. Foreigners in Beijing or Shanghai would reminisce about the good old days in Dali, where one could be beckoned by a smiling lady into an alley to purchase a baggie. The cannabis trade has been stamped out.4 Nowadays, it is not foreigners who travel to Dali to toke a joint, but Chinese who visit for a harder drug: cryptocurrency, NFTs, and other web3 paraphernalia. A great deal of China’s crypto community has relocated in recent years to Dali. It is not that the city has wanted to attract them; rather, its appeal is more general. Dali has sunny weather, nice hikes, and a big lake. I reminisce about its open-air markets, where every morning one can go to pick up fresh vegetables, fruits, rice noodles, and all sorts of pickles. Dali offers fertile farmland, attracting China’s burgeoning young organic farmers. It has a significant foreign population that has set up sourdough bakeries, cafés with excellent croissant, and clubs playing techno. The first outdoor rave I came across in China was at an orchard in Dali. It attracts urban families as well: parents of young children would bring kids to nature-focused school programs over summers or full-time before starting primary school back in Shenzhen or Shanghai. Visitors enjoying the sun referred to the city as “Dalifornia.” Yunnan has many other interesting places besides. Kunming, its capital, is not one. That is a city like any other in the PRC, perhaps best analogized to Mexico City: an administrative center of many interesting people and places, but relatively boring compared to them. Tengchong, in Yunnan’s furthest west, is made up of Dai peoples living among volcanic springs; history buffs might visit it for its centrality along the Burma Road. More interesting is Lugu Lake on Yunnan’s northern border with Sichuan, a difficult-to-access place home to the Mosuo people, who form a matriarchal society. In the mountains one can find the Wa people, who are supposed to maintain a tradition of animal sacrifices and human headhunting. Climbing out of civilization Mountains have always beckoned to dissenters, rebels, and subversives. It is not only the air that thins out at higher elevations: the tendrils of the state do too. Small bands of people only need to hike a while to find a congenial refuge in the mountains. By contrast, it’s far harder for imperial administrators with their vast caravans to locate all the hideouts. Throughout history, therefore, people have climbed upwards to escape the state. It is not only to take leave of the irksome suction of the tax collector. It’s also to break free of the problems that accompany dense populations — epidemics, conscription, and the threat of state-scale warfare. As a consequence, people who dwell in the mountains tend to be seen as unruly folks, be they Appalachian Americans or Highland Scots. Yunnan has been a distinguished refuge for peoples tired of the state. It is the heart of a vast zone of highland Southeast Asia described by James C. Scott in The Art of Not Being Governed — the best book I read this year (and which I will be drawing on throughout this piece). Scott writes about the innumerable hill peoples who have repaired to these mountains over the last several millennia, escaping oppression from the Burmese state, the Tibetan state, or most often, the Han-Chinese state. In Scott’s telling, early states (of several millennia up to a few centuries ago) did not grow because people were drawn towards “civilization” or a luminous court center. They grew because the domineering temper of a rice- or wheat-addicted despot demanded ever greater populations to produce grain surpluses for the glory of his court. The process was dialectical, as wars made the state, and the state made war. Thus most of the people in a population core consisted of captives seized in a military victory or purchased from raiders. Scott goes so far to claim that where one can find an early state, there one will find a population core sustained by coerced labor. His case is that the civilization that arose from sedentary farming made people worse — in terms of health, safety, and liberty — before they made society better. Before mass cultivation of grains, most people were foragers of some sort. And they have tended to be more robust and healthy than farmers tied to a single plot of land, who faced constant danger of state appropriation, epidemic diseases, and losing everything in an environmental disaster. It’s easier to understand that there has been intense resistance by peoples everywhere to state efforts to make them sedentary, whether in Central Asia or North America — accepting that fate only after a military defeat. In mountains they tend to be more safe.5 And that, Yunnan has in abundance. The peoples who escape into the rugged highlands of Southeast Asia tend to have, in Scott’s telling, state-repellent practices. That includes cultivating diverse and shifting root crops, which are less assessable by the tax collector; adopting relatively egalitarian social structures; and practicing an oral culture, which helps to make histories and ethnic identities more malleable. These ethnic tribes have thus become “barbarians by design.” Still today, Yunnan remains one of the poorest provinces in China. The mountainous geography makes its economy more ideal for agriculture and tourism than technologically-intensive industries. It became a quietly thrilling experience to read about this highland zone while I wandered around in Yunnan. Scott writes that state administration learned to climb into the mountains by the end of the Second World War, after the deployment of railroads, telephone, helicopters, and later, information technology. But I certainly feel that the culture of Yunnan remains different from the imperial cores of Beijing and Shanghai. Official initiatives often run out of breath before these rugged hills. These mountains protected various retreating armies, including Nationalist troops, which were not fully rooted out from the region until the early 1960s. They protected people during the Great Leap Forward, when people climbed up to forage for food. They protected villagers even during the Cultural Revolution: “When Red Guards climbed into the highlands, they found few people, no one obviously wealthy to direct their attacks upon, and little to eat. They would then just harangue the villagers for a while, stage a noisy demonstration, and then go back down the mountain, not very eager to return.”6 Yunnan is a province that resists efficient administration even today. In general, rules in Yunnan are not consistently enforced. Is that because the officials are lazy or incompetent? Who cares, probably both. I saw how villagers circumvented regulations that threatened their way of life. The most important event to happen over the past decade in Dali was a visit from Xi Jinping in 2015, when the top leader admonished local officials to clean up the nearby lake. Officials then jumped to implement the order. Among their measures was to direct all water from the mountains to flow into the lake. Villagers who were used to spring water from the mountains for their drinking and food production now had to drink treated water. Locals spoke of that water diversion as one of the most upsetting things in village history. It was not that they objected to cleaning up the lake. It was that a word from the top leader prompted local officials to deny them the best water in China, while making an at-best-minimal contribution to the cleanup. Their response was to climb further up the mountains and lay new pipes to send water to the village temple. They taught me to bring my own jugs to fill up there. Local officials came to the village temple not with hammers to smash these pipes, but with their own jugs for filling up. Here, it is still possible to navigate around senseless directives from the central government. Dali’s culture of open drug use may have dissipated, but the region retains an ineffectualness. Distance from the party center is one reason that Yunnan has drawn a growing number of emigrés tired of the city life. That emigration accelerated this year, as the oppressiveness in big cities grew intense. Lockdowns Throughout the three years of the pandemic, China developed a weightier state apparatus, one better able to impress itself against its subjects. The government at all levels, especially local, has gained new authorities to be more intrusive into people’s lives.7 Shanghai experienced the brunt of these measures in the spring. Anxiety levels grew steadily over March. Shanghai became hushed as entire residential compounds (some of which have thousands of people) were told that they were not allowed to exit from their homes for up to a fortnight due to their proximity to a positive case; as restaurants were told they must close; and as officials made multiple demands that everyone in certain districts must take a PCR test. By the end of March, it was apparent that these measures could not stop omicron. So Shanghai announced that the city would lock down, in two phases: the eastern half (Pudong) on March 27th for four days, and the western half (Puxi, where I lived) on April 1st for four days. What did lockdown mean? The ability to step foot outside one’s doorway. A fortunate few might be permitted to venture outside their apartment building, but not the residential compound. Shanghai’s lockdown would last more than four days: it ended after eight weeks. 25 million people were unable to leave their home or residential compounds between April and May. (Some even longer, as their compounds started locking down in March.) The main exception was the ability to go out for rounds of PCR tests conducted daily or every few days. The March 27th announcement came after city officials repeatedly denied that they would impose a full lockdown. That robbed a sense of urgency among most of my friends to stockpile essential supplies. I didn’t stockpile either, but I did decide to leave. Within an hour of the announcement, I had booked a plane ticket to Yunnan. Most people in Shanghai would suffer a bleak April. Food became the overwhelming concern. Fresh vegetables and fruits ran out after a week or so. The government promised to deliver food, but that proved a logistical impossibility for a city of 25 million people: truck drivers couldn’t del"
