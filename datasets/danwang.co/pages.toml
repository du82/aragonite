full_description = "January 23, 2024 2023 letter (This piece is my year in review; here’s my letter from 2022) I. Walking The trunk of an elephant might feel cool to the touch. Not what one expects, perhaps, from 200 pounds of writhing muscle, strong enough to uproot a tree, which tapers down to two “fingers,” giving it enough delicacy to detect the ripest berry on a shrub, and pluck it. Feeling an elephant’s trunk draws you to her other great feature: melancholic eyes that are veiled by long and dusty lashes. This combination of might with the suggestion of serene contemplation is surely the reason that elephants seem to embody a special state of grace. I encountered several of these big beasts on a trek through the mountains of northern Thailand in December. The occasion was a “walk and talk” organized by Kevin Kelly and Craig Mod, who launched a dozen people on a 100 kilometer walk over seven days from Mount Inthanon to the center of Chiang Mai. Our journey took us through elephant grounds, banana plantations, and coffee shrubs, finishing within Chiang Mai’s old city walls. The landscape shifted marvelously as we descended from the mountain into the city. At higher altitude, Mount Inthanon is home to forests of relict pine, each tree looking like a skinny and very tall piece of broccoli, their foliage wreathed in fog every morning before the sun broke through. At middle attitude, we found teak trees. Deforestation over the past few decades has spurred villagers to protect some of the oldest teaks by wrapping their trunks in saffron monk robes, thus “ordaining” them. At lower altitudes we saw the vegetation typical of rainforest: bamboo groves, lychee orchards, and banana plants. I found the latter unexpectedly beautiful. Bananas grow in bunches on a rough stem, under enormous leaves that are tall enough to allow an elephant to rest in their shade. Waterfalls dotted the trail, which allowed us sometimes to take a dip in the afternoon heat. It wasn’t just the natural landscape that was so stunning. Terraced farms, carved into hillsides, were attractive too. Local villagers have in recent years started cultivating strawberries, some of which are sold directly at roadside stands. These highland farmers understand cash crops. This region of northern Thailand, after all, was a major grower of the opium poppy until the 1980s. At that point, the Thai government (in a coordinated campaign with neighboring countries) eradicated nearly all opium production, enticing — or more often, compelling — farmers to plant other crops. That didn’t stop, however, one of the villagers from reminiscing about the days when the fields produced “Doctor O.” One of the ideas of the walk-and-talk, as Craig puts it, is to put adults in situations they may not have experienced since they were kids: “new people, unknown environs, continuous socializing, intense conversations.” Our demographics leaned toward the middle-aged and self-employed: people who could afford to disconnect from family and work obligations for what was really a ten-day commitment in early December. Few of the twelve of us had previously met anyone else on this trip and a long walk is a fast way to get to know someone. Talking happened naturally, as the landscape continuously reconfigured us into knots of two or three. Our conversation weaved into a single strand over the nightly dinner, with Kevin moderating over one topic. It didn’t take long for people to open up: to talk about how they decided to join the walk, and very quickly onwards to their lives, their work, and their struggles. The central conversation every night featured topics to which everyone can contribute, so our discussions had prompts like “home,” “fears,” and “failures.” These more general topics were extraordinarily effective in prompting people to be vulnerable, which helped to bind the group together. (If I did another walk-and-talk, I might try leaning away from consensus. That is, to treat the dinners more like a workshop, in which everyone comes prepared with a 15-minute talk on something they’re working on, then open up for discussion. I concede, however, that not everyone would find it a thrilling idea to end a strenuous day with a lecture.) We carried small packs during the day and had a larger bag forwarded to our nightly accommodations. We stayed along waterfalls, in elephant sanctuaries, at a glamping site that looked as if transplanted from California, and terminating in a Chiang Mai hotel shaded by a 200-year-old tamarind tree. There was also the bizarre. One night, we were the only guests at a resort so creepy that we debated whether the whole thing was a front for tax fraud. Its bungalows looked like they were the 3-D printed output of an AI generator that received a detailed description of Antonio Gaudí’s Park Güell. That the hotel staff kept taking photographs of us, as if they were documenting that they had real guests, didn’t allay our unease that our presence could be abetting a fraudulent enterprise. I think it would be wonderful if the walk-and-talk could be a commonplace activity. I can imagine doing one every few years, alternating between walking with close friends and entrusting group selection to someone else. The challenge is that this format requires a gargantuan effort of planning. Some off-the-shelf walks are possible, for example along pilgrimage routes, but many will have to be bespoke. Our heroic guide on this trip is an American hotelier who has lived in Chiang Mai and China over the last 30 years, who took it upon himself to hike our route five times before leading the rest of us along. A well-organized walk demands planning not only the route, but also booking accommodations for around ten people, finding a quiet restaurant every night, and a dozen other things. (Craig’s comprehensive guide features all the items to consider.) A 100 kilometer walk is difficult to pull off anywhere in America: the suburban, car-centric reality of this country means that it’s hard to find a walkable route that has accommodations spaced in intervals of approximately 15 km.1 Then again, committing a chunk of time to go abroad may as well be a strength of the format. These walks are not a family weekend activity, a spontaneous trip with friends, or an offsite meant to produce workplace bonding. They’re much more serious than that. It takes special concentration, after all, to reproduce the magic of being a child. One of the things that this walk provoked me to do was to write this year’s letter on what I saw in Thailand. I stayed for the whole month of December in Chiang Mai. In part, for food. Whole new culinary vistas open up once you’re ready to eat jungle. My favorite Northern Thai meals featured a papaya salad (or Burmese tea leaf salad), with some grilled meats — pork jowl, half a chicken, spare ribs — and a seafood soup in clear broth. For sides, one can order pork with lemongrass and ginger grilled in a banana leaf, crushed young jackfruit mixed with chilies, and sometimes a fried honeycomb. I’ve never eaten honeycomb before. It’s a strange thing to savor, the texture like biting into a pillowy piece of toast, expressing only a hint of honey. For dessert, I can imagine nothing more perfect than to have slices of a ripe mango on the side of sticky rice, the latter plump from being soaked in coconut milk, and coconut cream drizzled on top of the whole thing. And I stayed, in part, to explore highland Southeast Asia. My 2022 letter was preoccupied with Yunnan, which is on the other side of mountain ranges from Chiang Mai. This is the same vast highland region populated by marginalized folks who have deliberately tried to put themselves beyond the reach of powerful states, the most domineering of which have been Burmese, Tibetan, and especially Han-Chinese. By moving into rugged terrain and practicing mountain agriculture, they’ve managed to maintain an arms-length relationship with valley kingdoms, taking as much “civilization” as they require. In Yunnan I was in land of the Bai and the Dai peoples; the hill tribes in Chiang Mai include the Karen, Akha, Shan, and Hmong. These Thai highlands absorbed a wave of new people yearning for statelessness this year. In Chiang Mai, I encountered a great mass of young folks who no longer wish to live in China. II. Running The most important story of China in 2023 might be that the expected good news of economic recovery didn’t materialize, when the end of zero-Covid should have lifted consumer spirits; and that the unexpected bad news of political uncertainty kept cropping up, though the previous year’s party congress should have consolidated regime stability. China may have hit its GDP growth target of 5 percent this year, but its main stock index has fallen -17% since the start of 2023. More perplexing were the politics. 2023 was a year of disappearing ministers, disappearing generals, disappearing entrepreneurs, disappearing economic data, and disappearing business for the firms that have counted on blistering economic growth. No wonder that so many Chinese are now talking about rùn. Chinese youths have in recent years appropriated this word in its English meaning to express a desire to flee. For a while, rùn was a way to avoid the work culture of the big cities or the family expectations that are especially hard for Chinese women. Over the three years of zero-Covid, after the state enforced protracted lockdowns, rùn evolved to mean emigrating from China altogether.2 One of the most incredible trends I’ve been watching this year is that rising numbers of Chinese nationals are being apprehended at the US-Mexico border. In January, US officers encountered around 1000 Chinese at the southwest border; the numbers kept rising, and by November they encountered nearly 5000.3 Many Chinese are flying to Ecuador, where they have visa-free access, so that they can take the perilous road through the Darién Gap. It’s hard to know much about this group, but journalists who have spoken to these people report that they come from a mix of backgrounds and motivations.4 I have not expected that so many Chinese people are willing to embark on what is a dangerous, monthslong journey to take a pass on the “China Dream” and the “great rejuvenation” that’s undertaken in their name. The Chinese who rùn to the American border are still a tiny set of the people who leave. Most emigrés are departing through legal means. People who can find a way to go to Europe or an Anglophone country would do so, but most are going, as best as I can tell, to three Asian countries. Those who have ambition and entrepreneurial energy are going to Singapore. Those who have money and means are going to Japan. And those who have none of these things — the slackers, the free spirits, kids who want to chill — are hanging out in Thailand. I spent time with these young Chinese in Chiang Mai. Around a quarter of the people I chatted with have been living in Thailand for the last year or two, while the rest were just visiting, sometimes with the intention to figure out a way to stay. Why Thailand? Mostly out of ease. Chinese can go to Thailand without having to apply for a visa, and they can take advantage of an education visa to stay longer. That category is generous, encompassing everything from language training to Muay Thai boxing lessons. Many Chinese sign up for the visa and then blow off class. Some people had remote jobs. Many of the rest were practicing the intense spirituality possible in Thailand. That comes in part from all the golden-roofed temples and monasteries that make Chiang Mai such a splendid city. One can find a meditation retreat at these temples in the city or in more secluded areas in the mountains. Here, one is supposed to meditate for up to 14 hours a day, speaking only to the head monk every morning to tell him the previous day’s breathing exercises and hear the next set of instructions. After meditating in silence for 20 days, one person told me that he found himself slipping in and out of hallucinogenic experiences from breath exercises alone. The other wellspring of spiritual practice comes from the massive use of actual psychedelics, which are so easy to find in Chiang Mai. Thailand was the first country in Asia to decriminalize marijuana, and weed shops are now as common as cafés. It seems like everyone has a story about using mushrooms, ayahuasca, or even stronger magic. The best mushrooms are supposed to grow in the dung of elephants, leading to a story of a legendary group of backpackers who have been hopping from one dung heap to another, going on one long, unbroken trip. Most of the young Chinese I chatted with are in their 20s. Visitors to Thailand are trying to catch up on the fun they lost under three years of zero-Covid. Those who have made Chiang Mai their new home have complex reasons for staying. They told me that they’ve felt a quiet shattering of their worldview over the past few years. These are youths who grew up in bigger cities and attended good universities, endowing them with certain expectations: that they could pursue meaningful careers, that society would gain greater political freedoms, and that China would become more integrated with the rest of the world. These hopes have curdled. Their jobs are either too stressful or too menial, political restrictions on free expression have ramped up over the last decade, and China’s popularity has plunged in developed countries. So they’ve rùn. One trigger for departure were the white-paper protests, the multi-city demonstrations at the end of 2022 in which young people not only demanded an end to zero-Covid, but also political reform. Several of the Chiang Mai residents participated in the protests in Shanghai or Beijing or they have friends who had been arrested. Nearly everyone feels alienated by the pressures of modern China. A few lost their jobs in Beijing’s crackdown on online tutoring. Several have worked in domestic Chinese media, seriously disgruntled that the censors make it difficult to publish ambitious stories. People complain of being treated like chess pieces by top leader Xi Jinping, who is exhorting the men to work for national greatness and for the women to bear their children. Many people still feel ambivalence about moving to Thailand. Not everyone has mustered the courage to tell their Chinese parents where they really are. Mom and dad are under the impression that they’re studying abroad in Europe or something. That sometimes leads to elaborate games to maintain the subterfuge, like drawing curtains to darken the room when they video chat with family, since they’re supposed to be in a totally different time zone; or keeping up with weather conditions in the city they’re supposed to be so that they’re not surprised when parents ask about rain or snow. There still are some corners in China that are relatively permissive. One of these is Yunnan’s Dali, a city on the northern tip of highland Southe"
