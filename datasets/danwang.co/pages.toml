full_description = "January 1, 2019 2018 letter (This piece is my year in review; here’s my letter from 2017) I want to kick off this post by making a point about Moore’s Law. That’s the observation, which later turned into a prediction, that the number of transistors on an integrated circuit doubles every 18 to 24 months. Moore’s Law is not some natural law built into the fabric of the universe, designed to self-execute without a bit of engineering effort. Instead, it requires a massive industrial undertaking to push forward this technological frontier. It follows that we have agency on how quickly we can maintain the pace of technology improvements. The semiconductor industry set a benchmark for improvement early on, one that seems kind of arbitrary today, and made a collective effort to execute against it. Semiconductor companies—the leaders of which are TSMC, Intel, and Samsung—adopted Moore’s Law as an industry goal. The rate of progress seems to have gotten slower and more expensive, but it’s remarkable that Moore’s Law has held up for decades. Now I wonder to what extent we can replicate exponential progress by doing some branding. Moore’s Law turned from a neat backwards-looking observation into an obligation for the entire chips industry to keep improving. One description that I like of it is that it’s a “clock that has become a chaotic attractor for innovation.” I don’t think there are many other technologies in which exponential growth in performance over decades is possible. But maybe there’s a handful more that are, and they await a nice label that will concentrate minds, mobilize capital, and attract talent to keep improving. Coming up with that label might be a kind of low-hanging fruit that would encourage greater growth. I’d like this exponential progress to come to other fields, especially industrial technologies. Semiconductors are upstream of all electronics, which is a sector that has been vibrantly innovative over the last few decades. If we had exponential progress in a few more upstream technologies, we may be able to enjoy faster innovation in fields beyond computers, software, and the internet. Silicon Valley is rightly celebrated as a driver of innovation and wealth creation. But I’m not sure to what extent that Silicon Valley companies have yet promoted dynamism in the broader non-tech world. Companies there are very good at building software on top of and abstracted from the physical world. The tech companies we hear most often about tend to be capital-light, beautifully-scalable businesses that earn the most handsome returns for investors. We’re excited about companies like Airbnb and Uber, which match consumers with underutilized assets. Better matching of supply and demand is valuable, but I’m looking for something more ambitious. Focusing on industrial technologies is more like taking a firm hold of the supply curve and pulling it downwards; that process can unconstrain the growth of many downstream companies. For example, energy is upstream of everything in the economy; think about how much more room AI would have to play with if energy costs were measured in cents rather than dollars. Smartphone components today would have been military-grade technology just two decades ago. Their costs have been brought down in some cases by the hundredfold, and are cheap enough to create whole new categories of products, like the consumer drone and virtual reality headsets. Instead of being enamored with downstream, consumer-facing internet companies, I wish more people could be excited about upstream, industrial technology companies. It’s easy to love smartphones, the internet, and all the apps we use without thinking about how semiconductor improvements have made a lot of these things possible. Furthermore, I wish that more of these industrial components can improve at the pace of Moore’s Law. We haven’t had quite as much progress in energy, space, chemicals, and medicine that we were expecting decades ago. To some extent, Moore’s Law is an irrational commitment by the chips industry. It’s expressly driven by an engineering benchmark, i.e. to keep doubling transistor density, which is not necessarily a market- or customer-driven demand. This is a triumph of scientists and engineers over financial types, who would question why an abstract scientific challenge should be invoked for capital allocation decisions. In my view, this sort of irrationality is not a bad thing. In many cases, we should invest more in upstream technologies, even if we have no idea what sort of downstream uses they may enable. I don’t think it would be terrible if many industries developed a maniacal commitment to lowering input costs or broadening the capabilities of these inputs. *** This year, my tastes in music veered towards the more adventurous. That means I made a conscious decision to dwell less on Beethoven and Wagner. I attended three performances worth noting: the Vienna Philharmonic playing Wagner in Tokyo; the Berlin Philharmonic playing Mozart in Berlin; and the Deutsche Oper staging Lady Macbeth of the Mzensk District. The first two were nice examples of technical perfection, I enjoyed the third one the best. Shostakovich may have had too much fun for his own good when he composed Lady Macbeth. It’s no wonder that Stalin is rumored to have personally penned an editorial in Pravda to denounce the work. The best parts of the opera come from the juxtaposition of beautiful musical passages with wildly inappropriate desires acted out on stage. For example, when a kulak decides that he will at last make a move on his daughter-in-law, forcing down the bedroom door if necessary, the music erupts into a gorgeous Viennese waltz. Shostakovich is not the only composer to play these kinds of games. The music of Strauss is most fine when the action on stage becomes most dreadful; sweet and triumphant tones ring out from the orchestra as Salomé fondles the head of John the Baptist, which she had just ordered to be separated from the rest of his body. Let’s stay a bit longer on music. When I read Tyler’s interview of Elisa New this year, it struck me that many of her suggestions of how to get started on poetry apply just as well as how to get started on opera. The general plan should not be to absorb a whole work sequentially and all at once. (That is, don’t put on Parsifal or Don Carlo, plan to sit still for six hours, and expect to get something out of it.) Instead, the plan should be to look for small moments as entry points, which one can use as beachheads to expand towards the rest of the work. While most parts of every opera are boring, some parts are the peaks of composed music. Nobody, I submit, can sit in rapture for the entirety of every performance. Instead, I believe that we’re all seeking a few morsels from any particular work. For many moments, you can’t actually hear anything the first few times. I mean that literally, in the sense that even the most beautiful bits will not necessarily register cognitively until a dozen times of repeated listening, often with more than one conductor. I’ll suggest a few heuristics when it comes to finding morsels in Mozart and Verdi, two of my favorites. First, the endings of acts tend to burst with drama, in which large parts of the cast gather around to issue a gigantic statement of terror or grief; Verdi especially means for these scenes to arouse. Second, look for scenes with multiple voices, like duets, trios, and quartets—to me, these represent the musical peaks. (Rarely am I very moved by solos or the entire chorus.) I found the quartets in Don Giovanni and Rigoletto to be compelling beyond belief, and they were responsible for drawing me into the rest of Mozart and Verdi. It’s sort of surprising that Verdi works as well as he does. I think it was Alex Ross who suggested that it’s hard to make sense of Verdi from the page: the orchestral accompaniment looks crude, offering usually unimaginative beats. Verdi’s best moments feature a mix of voices that drive the momentum, with urgency that’s hard to pick up from the sheet. I consider the best parts of Verdi to be the ruminative sections, like the quartets in Don Carlo and Rigoletto, in which each person is making a private confession of grief or joy, where none can enjoy the consistent support of the orchestra. Or the concluding duet of Aida, in which the tenor and soprano come to terms that death is the condition for politically-forbidden love, their voices rising and falling on top of shimmering strings. If the ruminative parts of Verdi don’t grab you, look for the fast-paced parts that feature tight rhythms: Il Trovatore offers many such points of ignition. Muti is certainly my favorite Verdi conductor. Whereas the best of Verdi are the ruminative parts, the best of Mozart are in the flourishes, in which strings propel the action. Instead of dwelling on something marvelously beautiful, as Strauss would, Mozart wraps things up so that he can get on to unfurling the next perfect moment. He’s not like Beethoven, who is sober by default; nor like Verdi, who draws out sad moments with special weight; nor like Wagner, entirely without frivolity, who brings listeners into trancelike states of wonder. I spent a lot of time this year listening to the Da Ponte operas. Many conductors have recorded these works, I like Currentzis and Gardiner the best. I know that we’re all supposed to prefer Don Giovanni to Figaro and Cosi, but I want to present a dissenting view. I feel that Mozart has a tendency to be ironic and cheerful. It’s harder to pull that off with Don Giovanni, which starts out being objectionable, then turns moralistic, and ends on a sappy note. Figaro and Cosi are less serious and more dialectical. Everyone has a chance to be deceitful and villainous, there is no single person who is the obvious rake. The tender moments of Figaro and Cosi feel more real, and they feature a better use of irony. My favorite morsels from these works include the false wooing of Fiordiligi by Ferrando, the false acceptance of wooing by Susanna from Count Almaviva, and the way-too-real wooing of Donna Elvira by Don Giovanni. Here is Tyler on Mozart and his advice on how to get into opera. If you should enjoy Lady Macbeth, perhaps you’d also be interested in Jenufa by Janacek, Salomé by Strauss, and Lulu by Berg. *** I’m spending most of my time studying Chinese industrial policy and the country’s technology upgrading process. This was a busy year for work given the escalating trade war. I wrote reports on topics that included the long-term outlook of China’s semiconductor development (and how export controls can derail that progress); how China’s internet and smartphone companies are going abroad, mostly to developing countries; how multinationals are adjusting their supply chains given tariffs; a general evaluation of the prospects of success of 2025; and other stuff. Fragments of that work exist in public. If you’re curious, you can listen to a podcast I recorded for Bloomberg’s Odd Lots, with Joe Weisenthal and Tracy Alloway. I did some live TV with Bloomberg as well, and I’ll link to that segment when it becomes available. There are also bits of my commentary in news stories. For example, I talked about China’s chip capabilities with the FT, electric vehicles with the WSJ, 2025 with the NYT, and data centers in Guizhou with the Economist. Last year, I visited many cities of the Sinosphere. This year, aside from some time in Tokyo and Berlin, most of travel was in China itself. I’m glad to have visited eight of the country’s ten richest cities, for work or pleasure. (The two I missed were Tianjin and Suzhou.) The least interesting city of them all is Wuhan, which seems to have nothing other than industry, and no food worth remarking upon. I had the most fun in Hangzhou and Chongqing. They’re a nice study in contrasts, and I recommend visiting them as a pair. Start the trip in Chongqing, a chaotic city in a bizarre geographic setting, with tall buildings growing out of gorges and hills. I find the dusk and night scenes there to be more dramatic than even Hong Kong’s. No wonder the gallery of cyberpunk transformations of Chongqing seems so fitting. Then head to Hangzhou, which I consider the most pleasant large city in China; when I gazed at its lake and surrounding hills of tea plantations, I thought it could plausibly resemble parts of Ontario or upstate New York. Walking around, one can tell that Hangzhou anchored the richest region of China for 1,000 years, why the poets dwelled there to find inspiration, and why the emperors liked to visit. The spicy food of Chongqing is indeed what it’s cracked up to be; and the food in Hangzhou is so fine that I feel that Jiangnan cuisine might be the most wonderful cuisine of them all. *** Enough highlights; let’s get on to self-criticism. I regret that I wrote only three pieces on this site in 2018. It’s half the number of the previous year. Ultimately I’m not so bothered however, that writing personal essays took a concession to quite a lot of work, travel, and reading. Furthermore I’m quite pleased with how my two non-review pieces turned out. Imperial History and Classical Aesthetics was an effort to capture some of the flavors of Chinese cultural sensibilities, and I’m modestly satisfied with the result. How Technology Grows is an elaboration of my thoughts on definite optimism: that we should reach for economic growth and pay more attention to the industrial world. Come to think of it, that’s a rather nice thesis statement for my site. The essay also makes the point that knowledge ought to be considered a living product, which needs to be practiced for it to be even sustained at its current level. Certainly next year I’ll try to write more, but again I won’t be much bothered if writing here takes a backseat to other stuff. This is after all only an effort that’s meant to be for fun. Much more of my quick-take output has moved to emails and group texts, with some of it spilling over to Twitter. I’m more aggrieved by my lack of movie and television consumption in 2018. This year I watched only a handful of movies, I think fewer than a half-dozen, and no TV. I’ll repeat what I said from last year: “I regret to have ignored TV as a creative stimulus this year, and concede that my imaginative capacity has possibly suffered as a result.” Of the few movies that I watched, three made an impression. Ash is Purest White, Jia Zhangke. It’s a gangster movie for the first hour that turns into a Jia movie in the second, starring as usual Zhao Tao. The trailer is great. One kind of knows now what one is getting into with Jia: he will offer poignant scenes, sometimes dropping in the baffling or surreal, and adding a touch of the supernatural. Jia prefers understatement, but the prospect of violence hovers more closely in sight in this more than his other movies. There are many references to his previous works. Zhao Tao trav"
