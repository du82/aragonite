["https://dar-al-masnavi.org/ghazals-foruz.html"]
title = "The Ghazals-Foruzanfar Concordance"
full_description = '''This concordance contains a listing of all of Rumi's ghazals with their corresponding Foruzanfar edition numbers. These are ordered according to the arrangement in the Konya Maanuscript of the Divan, which orders the ghazals according to twenty-three (plus) poetic meters, an arrangement that was followed by Golpinarli, Ergin, Sobhani, and Osborne. Also inncluded are references to Arberry's 400 translations of selected ghazals based on Foruzanfar's edition. Only traanslations done by scholars are included in this concordance, so there are no referencess to popularized interpetive versions of Rumi's ghazals, such as those made by Coleman Barks and other popularizers. The concordance lists all of the numbers of the ghazals and tarji`bands (except Tarj. No. 14 and Tarj. No. 29--not in Golpinarli's/Ergin's translations) from Forûzânfar's edition of the Dîvân. In spite of its deficits (such as some loss of original meanings due to being a double translation--that is, being translated from Persian to Turkish to English), the complete translation of the Dîvân by Dr. Nevit O. Ergin (died, 2015) was a major contribution to understanding and appreciating the poetry of the Dîvân in the English language. At first, there was no way to evaluate Ergin's English (and, therefore GolpinarlI's Turkish) translations because they were based on a unique manuscript from the Mevlana Museum in Konya, Turkey of the Dîvân in which all of the ghazals and tarji`bands were ordered according to 23 poetic meters, instead of the standard listing according to the alphabetical order of the ending syllables. The publication of the volumes of Ergin's translation occurred between 1995 and 2003 and was subsidized by the Turkish government (Ministry of Culture and Tourism). Then the funding was stopped (perhaps because of Ergin's growing reputation as a radical interpreter of Rumi's verses). As a result, the last parts of Ergin's translation (the equivalent of perhaps two to four volumes) were never published. Subsequently, Ergin published a small number of these poems from the end of the Dîvân in a book titled: "The Forbidden Rumi: The Suppressed Poems of Rumi on Love, Heresy, and Intoxication" (with Will Johnson), 2006. He claimed that the Turkish government "withdrew its support and refused to participate in the publication of the final volume due to its openly heretical nature." And he claimed that: "Rumi explains that in order to transform our consciousness, we must let go of ingrained habits and embrace new ones. In short, we must become heretics." The claim of suppression, however, is not true, since it has been pointed out that the last part of Rumi's Dîvân has never been controversial in Iran (where educated people understand that Rumi's images of wine-drinking are classical metaphors of spiritual states), and the Dîvân has been freely available for purchase in bookstores for many decades. It turns out that Rumi's "heretical" verses were the result of Ergin's own distorted interpretations, as well as a misuse of his reputation as a "Rumi translator" (who did not know Persian). Some examples:'''
year_published = 2025
clearnet = "https://dar-al-masnavi.org/ghazals-foruz.html"
