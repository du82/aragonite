["https://dar-al-masnavi.org/about_divan.html"]
title = "About the Divan"
full_description = '''The "Divan" is the inspiration of Rumi's middle-aged years. It began with his meeting Shams-i Tabriz, becoming his disciple and spiritual friend, the stress of Shams' first disappearance, and the crisis of Shams' final disappearance. It is believed that he continued to compose poems for the Divan long after this final crisis-- during the composition of the Masnavi. The Divan is filled with ecstatic verses in which Rumi expresses his mystical love for Shams as a symbol of his love for God. It is characteristic of Persian sufi poetry for it to be ambiguous as to whether the human beloved or the Divine Beloved (= God) is being addressed. It is also an essential feature of the particular kind of sufism Rumi practiced that mystical "annihilation in the spiritual master" [fan� fi 'sh-shaykh] is considered a necessary first stage before mystical "annihilation in God" [fan� fi 'll�h] can be attained. The Divan is filled with poems expressing this first stage in which Rumi sees Shams everywhere and in everything. Rumi's "annihilation" of his separate self was so intense that, instead of following the tradition of including his own name in the last line of odes/ghazals, he often uses the name of his beloved spiritual master and friend instead. Or he appeals to (mystical) Silence [kh�mosh] which transcends the mind and its concepts. "Divan" [Arabic: d�w�n; pronounced "d�v�n" in Persian] means the "collected works" of a poet. It has been published with a variety of titles: "D�van-i Kab�r," "D�v�n-i Shams-i Tabr�z� ," "Kulliy�t-i Shams," "Kulliy�t-i Shams-i Tabr�z�. Rumi's Divan consists of three different types of poems. It contains 44,282 lines (according to Foruzanfar's edition, which is based on the oldest manuscripts available): 3,229 odes, or ghazals [ghazaliy�t] (total lines = 34,662); 44 tarji-bands [tarj�`�t] (total lines = 1698); and 1,983 quatrains [rub�`iy�t] (total lines = 7932). The best edition available was done by the Iranian scholar, Badi`uzzam�n For�z�nfar, published in ten volumes between 1957-1967.'''
year_published = 2025
clearnet = "https://dar-al-masnavi.org/about_divan.html"
