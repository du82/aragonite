["https://dar-al-masnavi.org/masnavi_recordings.html"]
title = "Masnavi Recordings"
full_description = '''In the recitations/singing of the verses in Persian, an attempt is made to approximate the original pronunciation of the words according to classical/medieval pronunciation, which resembles more the pronunciation in today's Afghanistan and Tajikistan rather than Iran. For example, the original "majhûl vowels" are pronounced as "ê" (to differentiate "shêr" [lion] from "shîr" [milk] and "ô" (to differentiate "dôst" [friend] from "dûr" [far]. Also included is the sound of "w" (to differentiate from "v", a remnant of the Turkish Safavid and Qajar pronunciation). c) Recited Persian only (with background recorded music of Turkish ney player, Ömer Faruk Tekbilek; featured on RadoMolana: http://www.radiomolana.com/2010/01/program-1.html) Open an additional window here to read the English translation followed by the transliterated Persian text (1) Sung Persian only (6/15) by Forouzandeh Arbabi of Tehran, the wife of Masnavi scholar, Mohammad Bordbâr Efendi.'''
