["https://dar-al-masnavi.org/about-mevlevi-order.html"]
title = "About the Mevlevi Order"
full_description = '''The Mevlevi Order is a traditional Islamic sufi Way (Tarîqat) that has preserved the spiritual teachings of Mawlânâ Jalâluddîn Rûmî, his descendants, successors, and followers for over 700 years. Because sufi organizations are still illegal in Turkey, it is not called the "Mevlevi Order" or "Mevlevi Tarikat" there, and other sufi terms related to organized sufi activity (such as "shaykh") tend to be avoided as well. At present, the hereditary leader (Makam-i Chelebi) of the Mevlevis and direct descendent of Hazrat-e Mawlânâ, Faruk Hemdem Chelebi, is President of an organization in Istanbul and Konya called the International Mevlana Foundation (UluslararasI Mevlânâ Vakfi), a cultural and educational foundation. The Mevlevi order was first organized by Mawlânâ's appointed sucessor, Chelebi Husâmuddîn, who died about eleven years later; his successor was another leading disciple of Mawlânâ's named Karîmuddîn Bektamor, who died after another eight years. Only after this did Mawlânâ's son, Sultân Walad, become the over-all leader of the Mevlevis. The order began to expand (with leaders appointed to other towns and regions) under the leadership of Mawlânâ's grandson, Ulu `ârif Chelebi. Eventually, there were 114 tekke [takyâ] (monastery-like) buildings or building complexes established throughout the Ottoman Empire--including ones in Belgrade, Athens, Cairo, Mecca, Baghdad, Damascus, and Tabriz. After the collapse of the empire, following defeat in World War I, the new Turkish government of Ataturk declared all sufi organizations in Turkey illegal in 1925. All surviving Mevlevi tekkes were closed down. Some were made into mosques and a few into museums, such as the main tekke (or Mevlevihane) in Konya (where Mawlânâ Rûmî is buried) and the Galata tekke in Istanbul. Another Mevlevihane in Istanbul, called the YenikapI tekke, that burned down in 1961, has been completely rebuilt. Although the Turkish government decided to use the main building for use by a university, the rebuilt Sema hall [semahane], which is a separate building, now has regular Sema performances.'''
year_published = 2025
clearnet = "https://dar-al-masnavi.org/about-mevlevi-order.html"
