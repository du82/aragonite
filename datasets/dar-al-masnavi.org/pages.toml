["https://dar-al-masnavi.org/about_rumi.html"]
title = "About Rumi"
full_description = '''Jalaluddin Rumi (may God sanctify his holy spirit) was one of the greatest Muslim saints and mystics. He has also been hailed by Western scholars as the greatest mystical poet of all time.1 And popularized versions of his poetry have made him the best-selling poet in America in recent years2 -- after a period of over 700 years, during which his fame has endured in the Middle East, Central Asia, and the Indian subcontinent. The popularity of his poetry has spread in the West because of its heart-felt themes of lover-beloved mysticism, and its spiritual joy which seems to emanate even from the most distorted versions in English. However, the popularization of his poetry has also been attained by a number of sacrifices: (1) a lack of accuracy of the meanings of his words and teachings; and (2), a deliberate minimization and evasion of verses in his poetry that reveal that he was a pious Muslim all his life, and a very devoted follower of the prayerful daily life exemplified by the Prophet Muhammad (may God pour blessings upon him). He was born in what is now the nation of Tajikistan (the country north of Afghanistan) in town of Wakhsh , where his father worked as a Muslim preacher and scholar. Wahksh was part of the cultural area of the ancient city of Balkh (in present-day Afghanistan), which had been a major center of Islamic learning for five hundred years before Rumi was born. His father, also a great mystic, or sufi master, was from Balkh. He named his son Muhammad, but later called him by the additional name, Jal�lu 'd-deen ("the Glory of the Faith"). His full name was Jal�lu 'd-deen Muhammad bin (= son of) Husayn al-Balkh�. Later, when he moved to Anatolia (present- day Turkey) with his family, he became known as Jal�lu 'd-deen Muhammad al-Roomee. This is because Anatolia had been called for centuries "R�m" (a form of "Rome") which meant "the land of the Greeks" (who had long ruled the area from Constantinople, the capital of the Eastern Roman Empire and later the Byzantine Empire). In the East, he has always been known as Mawl�n� (pronounced "Mowl�n�" in Iran, India, and Pakistan; pronounced "Mevlana" in Turkey). This means "our Master" in Arabic, and was traditionally a title given to Muslim scholars. However, due to his great fame, the respectful title "Mawl�n�" quickly came to refer primarily to Jalaluddin Rumi. Only in the West has he been called "Rumi."'''
year_published = 2025
clearnet = "https://dar-al-masnavi.org/about_rumi.html"
