["https://dar-al-masnavi.org/about_translations.html"]
title = "About the Translations"
full_description = '''The translations published on this webpage are made freely available for the benefit of lovers of Rumi's poetry. They are a work of love. They have been made by an amateur Rumi scholar who has been a "lover" [muHibb] on the Mevlevi ("Whirling Dervish") path of Islamic sufism for many years. The selections have been completed on a weekly basis during the past two years-- and will continue to be made, God willing, on an ongoing basis. The Translator has devoted many hours of his spare time every week to ensure that the translations, commentary, and transliterations as accurate as he is able to make them. Please respect the copyright, and do not copy the translations (elsewhere on the Internet or on paper) without including the name of the Translator (preferably with his permission). And please do not use these translations in order to make your own "interpretive poetic versions" (and then distribute or publish them as your own "Rumi translations" -- as is the trend nowadays). This is a literal translation. Words not in parenthesis are usually literal, but are not literal in the case of some idioms. Words in parentheses are added to clarify intended or implied meanings (as well as to smoothe the grammatical flow (see more on this topic below). Words in brackets are the Translator's own interpretations of the meaning. The reader may gain a better sense of the original by reading the verses and skipping the words in parenthesis; occasionally, this may yield a richer understanding of the meaning. The Translator taught himself classical/medieval Persian, starting about twenty years ago, for the sake of reading and studying Rumi's poetry. He has had little interest in learning to speak Persian or reading other kinds of Persian literature (except for some other sufi poetry classics). He began translating in 1985, in collaboration with an Afghan scholar, to translate Rumi's quatrains. This work, still unpublished, includes literal translations, explanatory notes, and the original text in Persian script.'''
year_published = 2025
clearnet = "https://dar-al-masnavi.org/about_translations.html"
