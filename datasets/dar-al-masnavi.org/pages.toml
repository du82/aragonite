["https://dar-al-masnavi.org/about_nicholson.html"]
title = "About R.A. Nicholson and his Translation and Commentary on the Masnavi"
full_description = '''Reynold Alleyne Nicholson (1868-1945), was the greatest Rumi scholar in the English language. He was a professor for many years at Cambridge Universtiy, in England. He dedicated his life to the study of Islamic mysticism and was able to study and translate major sufi texts in Arabic, Persian, and Ottoman Turkish. That a Western scholar of "the first rank" dedicated much of his life to the study and translation of Rumi's poetry was very fortunate. His monumental achievement was his work on Rumi's Masnavi (done in eight volumes, published between 1925-1940). He produced the first critical Persian edition of Rumi's Masnavi, the first full translation of it into English, and the first commentary on the entire work in English. This work has been highly influential in the field of Rumi studies, world-wide. His critical Persian text has been re-printed many times in Iran and his commentary has been so highly respected there, that it has been translated into Persian (by Hasan L�h�t�, 1995). Nicholson also produced two volumes which condensed his work on the Masnavi and which were aimed at the popular level: "Tales of Mystic Meaning" (1931) and "Rumi: Poet and Mystic" (1950). His earliest translations of selected ghazals from Rumi's Divan ("Selected Poems from the D�v�ni Shamsi Tabr�z," 1898) has been superceded by A. J. Arberry's translations ("Mystical Poems of Rumi," 1968; "Mystical Poems of Rumi: Second Selection," 1979), in that Arberry used a superior edition of the Divan (done by Foruzanfar). Arberry re-translated all of the ghazals previously translated Nicholson (his teacher and predecessor at Cambridge University) based on the superior edition, minus seven ghazals which were not in the earliest manuscripts of the Divan (and therefore are no longer considered by scholars to be authentic Rumi poems (Nicholson's numbers IV, VIII, XII, XVII, XXXI, XXXIII, and XLIV). In addition, Nicholson published the first information about Rumi's "Discourses" (F�-hi M� F�-hi) in the English language (in a 1924 article in the Journal of the Royal Asiatic Society).1'''
year_published = 2025
clearnet = "https://dar-al-masnavi.org/about_nicholson.html"
