["https://dar-al-masnavi.org/rumi-on-masnavi.html"]
title = "Rumi on the Masnavi"
full_description = '''Translated (11/17/02) from the original Persian and Arabic by Ibrahim Gamard (with gratitude for R. A. Nicholson's 1926-34 British translation of the Masnavi, and for John O'Kane's 2002 translation of Aflaki's stories about Rumi) � Ibrahim Gamard (translation, footnotes, & transliteration) This is the book of the Masnavi,1 and it is the roots of the roots of the roots of "the Religion" [Qur'an 3:19] (of Islam) in regard to unveiling the secrets of obtaining connection (with God)2 and (spiritual) certainty3 (of the Truth). . . . For the possessors of (advanced spiritual) stations and (spiritual) wonders,4 (the Masnavi, like Paradise, is) "the best station and the best place of rest" [Qur'an 25:24]. The righteous ones eat and drink in it, and the (spiritually) free ones rejoice and delight in it. It is like the Nile (River) of Egypt5 (in that) it is a pure drink to those who are (devoutly) patient, but a sorrow to the followers of Pharaoh and the unbelievers-- just as (God) said, "He leads many astray by it,6 and He guides many (to the truth) by it" [Qur'an 2:26]. Because it is the remedy for hearts, the brightening polish for sorrows, the revealer of (the meanings of) the Qur'an, the opportunity for (finding spiritual) riches, and the purifying of (bad) natures and dispositions. . . . (Like the Qur'an), "Falsehood cannot reach it from in front (or behind)" [Qur'an 41:42], and God watches it and guards it. "And He is the Best of Preservers and He is the Most Merciful of the merciful ones" [Qur'an 12:64]. And God Most High has given other honorable titles to it.7 -- Mathnawi, I: Preface (Arabic text below)49 If the Masnavi were like the sky in size, not (even) half a part of this (wisdom)8 would be contained in it. -- Masnavi I: 2098 (Persian text below)50 Some explanation about the wisdom for delaying this second volume:9 If all the Divine wisdom were made known to the servant (of God) about the benefits of an action, the servant would remain helpless to (do) the action; the endless Wisdom of God would destroy his understanding (and) he would not (be able to) perform the action (at all). Therefore, God Most High makes a tiny amount of that endless wisdom as a ring for his nose and draws him to (do) that action. If He doesn't give him any information about the benefits (of the action), he won't move-- because intentional movement is (only done) for human advantages, for the sake of which we act in (our) interest. But if He pours down (all) the wisdom about that (action) onto him, he will similarly be unable to move.10 For if there is no nose ring11 for the camel, it won't go, and if it is too big it will just lie down (and refuse to move). "And nothing exists except (that) its storehouses12 are with Us, and We do not send it down (in created form) except according to a measure known (to Us)."13 -- Masnavi II: Preface (Persian text below)51'''
year_published = 2025
