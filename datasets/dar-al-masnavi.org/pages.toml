["https://dar-al-masnavi.org/about_masnavi.html"]
title = "About the Masnavi"
full_description = '''The "Masnavi" is Rumi's greatest poetic work, composed during the last years of his life. He began it when he was between the ages of 54-57 [about 1258-1261]1 and continued composing its verses until he died in 1273 (with the last story remaining incomplete). It is a compendium of sufi stories, ethical teachings, and mystical teachings. It is deeply permeated with Qur'anic meanings and references. Rumi himself called the Masnavi "the roots of the roots of the roots of the (Islamic) Religion... and the explainer of the Qur'an [wa huwa uSûlu uSûlu uSûlu 'd-dîn... was kashshâf al- Qur'ân] (Masnavi, Book I, Preface). Its full name is name is "Mathnawî-yé Ma`nawî," which means "Rhyming Couplets of Deep Spiritual Meaning." The name "Mathnawî" (pronounced "Masnavî" in Persian) means "couplets" in Arabic [because the second half of the verse (in Arabic, "thanî") rhymes with the first]. It is the name of a type of poetry (called "mathnawî"). The second word, "Ma`nawî," means "significant," "real," "meaningful," "spiritual" in Arabic. The following is an example of the particular mathnawi meter used by Rumi (there are other mathnawi meters used by other Persian sufi poets): XoXX XoXX XoX. The rhymes in the first three couplets of Rumi's Masnavi are "â-yat mê-ko-nad," "-îda-and, "-âq": The story of how the beginning of the composition of the Masnavi has been told in the hagiography written by Aflaki (written between 1318-53), a disciple of Rumi's grandson: "Sirâjuddîn, the Mathnawi-reciter [masnavi-khwân] at the Tomb (of Rumi) told the story that the reason for the composition of the book of the Masnavî-yé Ma`nawî, which is the Revealer of the secrets of the Qur'an was: One day Hazrat-i... Husâmuddîn [Chelebi-- Rumi's closest disciple], may God sanctify his precious secret, found out that some of the friends, in complete relish and great love, were making serious efforts to study the 'Book of the Divine' [Ilâhî-Nâma] of (the sufi poet) Hakîm (Sanâ'î) and the 'Speech of the Birds' [ManTiqu 'T-Tayr] and the 'Book of Misfortune' [MuSîbat-Nâma] of (the sufi poet) Farîduddîn `ATTâr, and (who) were delighted by (studying) their (mystical) secrets and (accounts of) the unusual spiritual amorousness (of the lovers of God) displayed by them. ..... One night, he found Hazrat-i Mawlana [= Rumi] alone. He bowed and said, 'The collections of odes [ghazalîyât] have become plentiful.... (But) if there could be a book with the quality of the 'Book of the Divine' of Hakîm (Sanâ'î), yet in the (mathnawî) meter of the 'Speech of the Birds,' so that it might be memorized among the knowers and be the intimate companion of the souls of the lovers... so that they would occupy themselves with nothing else...' At that moment, from the top of his blessed turban, he [Rumi] put into Chelebî Husâmuddîn's hand a portion (of verses), which was the Explainer of the secrets of Universals and particulars. And in there were the eighteen verses of the beginning of the Masnavi: 'Listen to this reed, how it tells a tale, complaining of separations' up to. 'None (who is) 'raw' can understand the state of the 'ripe.' Therefore, (this) speech must be shortened. So farewell.'"3'''
year_published = 2025
