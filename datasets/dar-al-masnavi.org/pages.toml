title = "Mevlevi Articles"
full_description = '''Due to the great fame of Rumi's Masnavi in the late Ottoman Empire, the Masnavi was studied not just in Mevlevi centers [tekke] for Mevlevi students, but for the general public. There used to be Masnavi libraries with ongoing classes throughout the Ottoman Empire. However, this gradually declined and the tradition of maintaining such centers has died out. In a book by Professor Franklin Lewis ("Rumi, Past and Present, East and West: The Life, Teachings and Poetry of Jalâl al-Din Rûmi," 2001, 2003 revised edition), he mentions that a Turkish-language poet named Fejzulah Hadzibajric (died 1990), who lived in the former Yugoslavia, ". . . kept alive the tradition of the Dâr al-Masnavi, or Masnavi College, and composed the most recent Masnavi commentary in a western language" (p. 475). The last Dâr al-Masnavî in the Ottoman Empire was built in 1844 (Golpinarli asserted an earlier date, 1778) by a non-Mevlevi, Shaykh Morâd Bokhârî (died 1848) of the Naqshbandi Order; it was built in the Çarshamba neighborhood in the Fatih district of Istanbul on what is presently named "Mesnevihane" Street. He "founded a Dâr al-Masnavi in Istanbul; he began a commentary on the work in September 1839 and by the evening of April 25, 1845 was at work on Book 6" (Lewis, p. 480). Shaykh Morâd Bokhârî was allowed to wear a Mevlevi turban when he taught Masnavi. Some buildings still remain of the old "Mesnevihane" (as it was called in Turkish): the mosque, also used as a classroom, a minaret shaped like a tall Mevlevi hat, a mausoleum (that contains the tomb of the founder), and an ablutions fountain. In former times there was a library, a room for devotional prayer-chanting [tevhidhane], a kitchen, dervish cells, and a part of the building reserved for men [selamlIk]. Below are two photos (click once for enlargement): the Translator (Ibrahim Gamard, standing in front of this Dâr al-Masnavî site, 5/08) and the Arabic inscription: "This is the institute for teaching of the Masnavî of Mawlânâ Jalâluddîn Rûmî--may his exalted spirit be sanctified" [hadhâ dâru tadrîsu 'l-mathnawî ka-Hadhrat mawlânâ jalâlu 'd-dîn rûmî--qaddasa sirra-hu as-sâmî].'''
