["https://dar-al-masnavi.org/about_translator.html"]
title = "About the  Author and Translator"
full_description = '''The author and translator, Ibrahim Gamard, is a Rumi scholar, born in the United States (in 1947). He has been strongly interested in mysticism (since 1966) and has been a student of sufism (since 1971). He became a semazen ("whirler") in Los Angeles in 1975 (photo below). That year, he read the entire English translation of Mevlana Rumi's Masnavi and realized that it is the greatest work of religious mysticism ever written. The next year, in 1976, a Mevlevi shaykh, Suleyman Dede Efendi of Konya, Turkey (photo below) came to the United States for the first time, visited Los Angeles, and taught the Whirling Prayer Ceremony (Sema). He initiated Ibrahim as a semazen (by placing the Mevlevi conical hat upon his head while praying and singing the tekbir: "Allahu Ekber...."). This was when Ibrahim became a member of the 750 year-old sufi order that derives from the teachings of Mawlânâ Jalâluddîn Rûmî, the Mevlevi ('Whirling Dervish") Order. During that visit, Dede Efendi led the Ceremony (photo below)--Ibrahim's first. Ibrahim became a Muslim (in 1984), completed the Pilgrimage [Hajj] to Mecca (in 1999), became a neyzen, or Turkish reed-flute player (in 1998), and became a translator (from Persian) of Rumi's poetry (in 1985). He was a Mevlevi whirler [semazen] for thirty years until 2007, when he participated in Sema in the Galata Mevlevi Sema hall (Semahane] in Istanbul. He was the disciple [murîd] of Shefik Jan Efendi (photo below), a Mevlevi shaykh and Masnavî teacher (Masnavî-khwân) in Istanbul, Turkey (from 1999 until the latter's death at age 96 on 24 January 2005) who was under the authority of the present world leader of the Mevlevi order, Faruk Hemdem Chelebi Efendi. He played the Turkish reed-flute (ney) for eight years (until 2007, due to the onset of hand tremors) and played Mevlevi music, such as the Beyati Ayîn-i Sherîf. as well as Turkish hymns (illâhîs). The photo below shows him playing in front of the Galata Mevlevi-house in Istanbul. Professionally, he was a licensed psychologist in California (Ph.D. in Psychology, 1986) until he retired at the end of 2018. But his passion has long been for studying and began teaching himself classical Persian for the sole purpose of reading Rumi's poetry in the original language. In 1985 he began collaborating with Dr. Ravan Farhadi (photo below), an Afghan professor of Persian Literature at the University of California, Berkeley, in a translation of the nearly two thousand quatrains attributed to Rumi, together with commentary and Persian text, "The Quatrains of Rumi"), published in 2008.'''
year_published = 2025
clearnet = "https://dar-al-masnavi.org/about_translator.html"
