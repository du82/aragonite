["https://dar-al-masnavi.org/about_mevlevi_ring.html"]
title = "About the Mevlevi Ring"
full_description = '''This is the homepage for the Mevlevi Ring. The purpose of this webring is to unite the currently approved members of the International Mevlana Foundation, Istanbul, that maintain websites representing the Mevlevi Order of Islamic sufism. The hope is that the Mevlevi Ring will help resolve confusion caused by the many websites on the Internet that claim authority to represent the Mevlevi Order. Websites belonging to the Mevlevi Ring will have the logo of the International Mevlana Foundation which will signify acceptance, approval, and authorization to represent the Mevlevi tradition by the current hereditary leader of the Mevlevi Order--Faruk Hemdem Chelebi, the 33rd Makam-i Chelebi (hereditary leader of all Mevlevis) and the 22nd generation direct descendent of Hazret-i Mevlana Jelaluddin Rumi. The Mevlevi Ring will allow visitors to visit the various websites that are authorized to represent the Mevlevi tradition. If you are invited to be a part of the Mevlevi Ring, click on the link "Join" below, provide your site's information, then place the HTML code given to you on the opening page of your website. You can leave the links to the graphics as is, or else download, upload and publish them to your server. Once established, you should see an increase in your site's traffic as visitors surf over from other Mevlevi Ring sites.'''
