["https://dar-al-masnavi.org/divan-meters.html"]
title = "Divan Meters"
full_description = '''This manuscript is exhibited in the Konya Museum, MSS no. 68 & 69, of the Dîwân-é Kabîr [Complete Poetic Works of Mawlânâ Jalâluddîn Rûmî; also known as the Dîwân-é Shams-é Tabrîzî]. The scribe was Hasan ibni `Usmân al-Mawlawî, who completed the two volumes in 1366 and 1368 C.E. The manuscript was used by the Iranian scholar, Forûzânfar for his edition of the Dîwân, based on the earliest manuscripts (however, there are manuscripts of the Dîwân that are earlier than this one). It was also used by the Mevlevi shaykh and scholar Golpinarli to make his complete translation of the Dîwân into Turkish. Golpinarli's Turkish translation was completely translated into English by Dr. Nevit Ergin (Volume 1 in 1995, Volume 22 in 2003). The manuscript has been published in a facsmile form by Tôfîq Sobhânî (published in Tehran, 2007) and by Nevit Ergin (www.sfumevlana.org); it also has been published in a modernized typographic form by by Tôfîq Sobhânî (published in Tehran, 2007, 2009). [Note: Meters here are to be read from left to right; CAPITALS and "X" = long syllables; small letters and "o" = short syllables] Meter 1: rajaz sâlim (muthamman) [English trans. by Ergin, Vol. 1; 158 poems] (MUS-TAF-`i-LUN MUS-TAF-`i-LUN MUS-TAF-`i-LUN MUS-TAF-`i-LUN) [XXoX XXoX XXoX XXoX] Meter 2: muZâri` akhrab sâlim [Ergin, Vol. 2; 157 poems] (MAF-`UU-lu FAA-`i-LAA-TUN MAF-`UU-lu FAA-`i-LAA- TUN) [XXo XoXX XXo XoXX] Meter 3: hazaj akhrab sâlim [Ergin, Vol. 3; 241 poems] (MAF-`UU-lu mu-FAA-`IY-LUN MAF-`UU-lu mu-FAA-`IY- LUN) [XXo oXXX XXo oXXX] Meter 4: muZâri` akhrab makfûf maHdhûf [Ergin, Vol. 4; 136 poems] (MAF-`UU-lu FAA-`i-LAA-tu mu-FAA-`IY-lu FAA-`i-LUN [XXo XoXo oXXo XoX] Meter 5: khafîf makhbun [Ergin, Vol. 5; 14 poems] (fa-`i-LAA-TUN mu-FAA-`i-LUN fa-`i-LAA-TUN mu-FAA-`i- LUN) [ooXX oXoX ooXX oXoX] Meter 6: hazaj makfûf [Ergin, Vol. 5; 15 poems] (mu-FAA-`IY-lu fa-`UU-LUN mu-FAA-`IY-lu fa-`UU-LUN) [oXXo oXX oXXo oXX] Meter 7: mujtathth makhkbun aslam [Ergin, Vol. 5 & 6; 282 poems] (mu-FAA-`i-LUN fa-`i-LAA-TUN mu-FAA-`i-LUN FI`-LAAN) [oXoX ooXX oXoX XX]'''
