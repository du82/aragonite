["https://dar-al-masnavi.org/masnavi.net.html"]
title = "Announcing masnavi.net"
full_description = '''The new website, formerly known to members of the Dar-al-Masnavi discussion group (Google Groups) as the "Masnavi Project," has improved greatly during the past year and is available online as of June 1, 2015. At present, the website contains the full text of the Masnavi in Persian (Mahdî Âzâr Yazdî's edition), English (Nicholson's translation), and Turkish (Veled Chelebi's translation). All three texts are based on the earliest manuscript of the Masnavi (the "Konya Manuscript," completed in 1278, five years after Mawlana Rumi's death). There is full word-search capacity in all three languages and full verse number search capacity (using Nicholson's verse numbering) within each of the six books. The Contents menu includes lists of all the headings in the Masnavi (in Persian, English, and Turkish); the headings also serve as links to the headings on the main pages. A page "About masnavi.net" plus "Frequently Asked Questions" (FAQ) is in the "More" menu. Readers are invited to submit any errors that they find in order to improve the accuracy of the website. The website has much potential for future development, such as adding other language translations, other Persian recitations, and perhaps commentary in English, Persian, and Turkish. There are audio files in Persian for the entire Masnavi (except for 93 verses in Book 4) recorded in Iran by Hosayn Âhî (Books 1 and 6) and by Amîr Nûrî (Books 2, 3, 4, and 5). The Persian text is highlighted with the color yellow, which can be moved up or down by the up/down arrows on the keyboard. The next/previous pages can be accessed by the right/left arrows on the keyboard, as well as by the right/left arrows on the webpages. The complete Persian text can be displayed alone or together with either English or Turkish; also, the English translation alone and the Turkish translation alone may be displayed (see screen shots of the current website below). The audio files are started and stopped, one verse at a time, by the space bar on the keyboard (or a black start button in the left margin for mobile devices). Continuous play is started and stopped by clicking on a circular start button in the left margin, and temporarily stopped and re-started by the space bar; it is also stopped completely by using the updown arrows to go to another verse (then pressing the space bar and waiting for the recitation of that verse to end), or clicking on a different verse. Another feature is that if a single text is chosen, pressing the Tab bar (or clicking on the plus button in the margin for mobile users) causes a drop box to appear and present the verse in another (pre-selected) language. An additional feature is memory: after closing the website and later returning to it, the last page of the site visited will reappear. To return to the "home oage" (the beginning verses of Masnavi, click on "Masnavi" in the upper left corner (there are actually five different "home pages.") At the present time, Google Chrome is the preferred browser for viewing the website, for all devices and operating systems. The website also works well on Firefox. It does not work well on Safari yet, but we hope it will in the near future.'''
