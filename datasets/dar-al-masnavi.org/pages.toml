full_description = '''There are three works of Rumi's words and teachings that are not in the form of poetry. The first are his seventy-one talks and lectures, "F�-hi M� F�-hi" (literally, "in it what is in it"), commonly known as his "Discourses." These have been translated into English by two different scholars. Then there are his seven sermons, "Maj�lis-� Sab`a (literally, "seven sessions"), commonly known as his "Sermons." The collected book of these has not been translated into English (except for one short sermon). Finally, there are his one hundred and fifty letters, "Maktub�t," known as his "Letters." The collected book of these as not been translated into English (except for a few short ones).'''
