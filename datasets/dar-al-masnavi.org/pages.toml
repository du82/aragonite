["https://dar-al-masnavi.org/discourses.html"]
title = "The Discources"
full_description = '''This is a collection of seventy-one of Rumi's talks and lectures, entitled, "Fî-hi Mâ Fî-hi" (literally, "in it what is in it"). They are generally known as his "Discourses." Scholars believe that these were probably compiled from notes made by his disciples (who presumably wrote down from memory only the most significant parts of the talks, while leaving out introductory and concluding prayers, as well as sermons). It is believed that this material was collected together in single manuscripts after Rumi's death.1 The edition of Badî`uzzamân Forûzânfar (1951) was the best edition available, until an improved edition was made by Ja`far Modarres-i Sadîqî ("Maqâlât-i Mawlânâ (Fîhi Mâ Fîhi)," 1994). A. J. Arberry was the first to translate the entire work into English ("Discourses of Rumi," 1961), based on the Foruzanfar edition. More recently, a second translation was published by Wheeler Thackston ("Signs of the Unseen," 1994), also based on the Foruzanfar edition. Arberry's translation is very literal, and more faithful to the original,2 but is more "academic-sounding." Thackston's translation is much more readable, and occasionally more accurate,3 but is at times more superficial (and seems, as a whole, to have been done rather hurriedly).4 For some reason, Thackston chose to translate verses from the Qur'an and other Arabic sayings in a "King James-ish" manner."5 Sometimes, the differences between the two translations are because one of them chose to translate a variant among the manuscripts instead of Foruzanfar's chosen text.6 William Chittick has translated just over a hundred short excerpts from this work ("The Sufi Path of Love: The Spiritual Teachings of Rumi," 1983) based on the Foruzanfar edition (see "Index of Sources," pp. 380-381). 1. see "Rumi-- Past and Present, East and West: The Life, Teachings and Poetry of Jalâl al-Din Rumi," by Franklin Lewis, 2001, pp. 292-93. "...these thing are hidden you, like the water in the sea. The waters leave not the sea save through the medium of a cloud; they do not become visible except in a wave. The wave is a commotion visible from within you, without an external medium. But so long as the sea is still, you see nothing."'''
year_published = 2025
clearnet = "https://dar-al-masnavi.org/discourses.html"
tags = ["discources", "editions", "english", "notes", "persian", "translations"]
language = "en"
