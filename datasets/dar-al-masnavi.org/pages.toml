title = "Links"
full_description = '''A Full-Text Website of Mawlana Rumi's Masnavi in Persian, English, and Turkish; with search capacity in all three languages; with Persian audio files for the first hundred verses (a work in progress) Nich. trans. of Books I & II of Mathnawi (same as on semazen.net site; reformatted, no table of contents) Nich. trans. of Books III & IV of Mathnawi (same as on semazen.net site; reformatted, no table of contents) Nich. trans. of Books V & VI of Mathnawi (same as on semazen.net site; reformatted, no table of contents) Hard copy (CD no longer available) of the complete English translation of Mathnawi and commentary by Nich. with calligraphy text (apparently based on his Persian text) with several other works (in Persian and English) by Rumi and `Attar Order the three volumes of Nicholson's complete translation of "The Mathnawi" (2 books per volume), the two volumes of Commentary, & the three volumes of the Persian text (1926-40)--separately or in sets, from the website of Nicholson's publisher Order the three volumes of Nicholson's complete translation of "The Mathnawi" & the three volumes of the Persian text from Amazon.com Order Victoria Holbrook's translation of a late Ottoman Turkish commentary on Book I of Masnavi--the first extensive commentary in English since Nicholson completed his commentaries in 1940; contains the complete translation (from Persian) of Book I embedded in the commentary; amazingly, the Masnavi translation replicates the eleven syllables of every half-couplet as in the original Persian; each couplet is translated into imperfect rhyme, with the assonant sound of the final vowel or consonants. Highly recommended. Order a 4 CD audiobook of selections from Williams' translation of Book 1 of Masnavi (2006), read by Anton Lesser (from Amazon.com) Read an excellent article, "The Operation of Divine Love," an interview with Professor Alan Williams about his newly published translation of Books One and Two of the Masnavi audio talks about various themes in Rumi's works by Professor Fatemeh Keshavarz, University of Maryland.'''
