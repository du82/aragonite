["https://dar-al-masnavi.org/about_dar_al_masnavi.html"]
title = "About Dar-Al-Masnavi"
full_description = '''The Masnavi is the great masterpiece of Mawlana Jalaluddin Rumi, the most popular poet in America -- after more than 700 years! The Masnavi consists of mainly of sufi teaching stories with profound mystical interpretations. It contains thousands of rhyming couplets (a type of poetry called, in Arabic, "mathnaw�") and is a treasury of religious mysticism of a most sublime quality -- which is why it has been so famous and well-loved for so many centuries. Dar-al-Masnavi.org is the activity of the American Institute of Masnavi Studies (AIMS) on the Internet. At present (August, 2001), it is the only activity of the Institute (although it would be wonderful someday to have a physical building, acquire a library, etc.-- God willing). The Institute is affiliated with the International Hazrat-i Mevl�n� Foundation, in Istanbul, Turkey. The president of the Foundation is the hereditary and actual world leader of the Mevlevi order--the 33rd Chelebi Efendi, Faruk Hemdem Chelebi, the 22nd generation great-grandson of Hazrat-i Mevl�n� Jal�ludd�n R�m�. "Dar al-Masnavi" (literally, "house, or abode, of the Masnavi") is the traditional name for a study center dedicated to studying Rumi's great masterpiece of Islamic sufism. [This Arabic term may also be transliterated as D�ru 'l-Mathnaw�, D�ru 'l-MaSnawi, Daaru 'l-Masnavi, Dar al-Mesnevi, dar�lmesnevi.] Historically, such study houses have been founded by wealthy patrons of the Mevlevi ("Whirling Dervish") order, which has preserved and disseminated the spiritual teachings of Rumi for over 700 years. [The term "Mevlevi" may also be transliterated as Mawlaw�, Mawlawi, Maulawi, M�lav�, Molavi, Mowlavi, Mewlewi, Mawlawiyya] [Rumi's name may also be transliterated as Mawl�n� Jal�lu 'd-d�n R�m�, Mowlana Jalal al-Din Rumi, Mevlana Jelaluddin Rumi; in addition, he is called M�l�v� /Molavi/Maulavi in Iran, M�l�n� R�m/Maulana Rum in India and Pakistan, and Mawl�n�-y� Balkh� in Afghanistan].'''
