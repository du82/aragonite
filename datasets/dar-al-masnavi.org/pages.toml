["https://dar-al-masnavi.org/transliterations.html"]
title = "Transliterations"
full_description = '''At the end of every translation on this website are Romanized transliterations (in blue font color) of the original Persian words used by Rumi. These are provided for those who cannot read the Arabo-Persian script. There are about 35 complete translations of Rumi's ghazals and about 150 selections of verses from the Masnavi--all of which are followed by full transliterations. It is possible to read the transliterated Masnavi selections on this website and hear them being recited at the same time, by opening up a second window containing another website (masnavi.net that contains the same verses recited in Persian by an expert Iranian poetry reader). As an example, open the following page on the website here. Then scroll down to the transliteration in a blue font, starting at verse 1720. Open up a second window and go here. Next, start the audio recitation by clicking on the round button in the left margin of masnavi.net. Readers should be aware, however, that the transliteration system used on this website is different from the usual Iranian transliterations (either precise and academic, or inconsistent and common). This is because the Translator studied Persian with an Afghan scholar (in the translation of "The Quatrains of Rumi"). It would not be accurate to call these "Afghan transliterations." Rather they are transliterations of the "Darî" form of Persian--which is closer to Rumi's Persian than is the "Farsî" form of Persian. Below is an example of a non-academic Iranian transliteration of the first four verses of the Masnavi (Book 1:1-4--"Listen to this reed flute, how it iscomplaining." This is followed by the Translator's transliteration on this website. (1) The earliest manuscripts of Masnavi begin: "beshnaw în nay" ("beshnaw az nay" is a later "improvement.") (2) In Iranian Persian (Farsî), the classical "w" consonant has changed to a "v" consonant, due to Turkish (Safavid and Qajar) influence. That is why I transliterate "union" as "wasl" (not "vasl").'''
year_published = 2025
clearnet = "https://dar-al-masnavi.org/transliterations.html"
