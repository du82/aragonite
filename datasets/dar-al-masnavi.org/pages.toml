["https://dar-al-masnavi.org/tarji_band.html"]
title = "About the Tarji-Bands"
full_description = '''Tarji`-bands [tarjî`ât-- literally, "bound to return") are similar in form to that of the ghazal (and the qasîda), in that the first half of the beginning line rhymes with the second half, but the first halves of the following lines are free from this constraint. After that, it is as if several ghazals-- of the same meter, but each having a different rhyme-- were combined together. In between each stanza with a different rhyme is single hemistich (with two halves) with an independent rhyme. The standard format is for these single intervening lines to be the same repeating (= returning) refrain. However, Rumi's intervening lines are different from each other within the same poem (which, technically, qualifies the poems to be "tarkîbât," not tarjî`ât). Occasionally, an intervening lines begins with the word "tarjî`" ["Returning..."]. The separate sections consist, in most cases, of an odd number of lines, usually ranging between 7-15 lines Following, is an example of the tarji-band format at the beginning of Tarjî` no. 1. It consists of 40 lines and four sections (of exactly nine lines), each followed by a tarjî` "refrain" (such as line 10): The tarji`-bands are only a very small part (4% of the verses) of Rumi's poetic output in the Dîvân (collected works of poetry), and there are only 44 in the earliest manuscripts. The best edition of the tarji-bands available is in the edition of Rumi's Dîvân (in Volume 7), done by the Iranian scholar, Badi`uzzamân Forôzânfar, based on the earliest manuscripts and published in 1966. There is a commercial edition in one volume (1957, enlarged 1962, and re-printed many times since), which falsely purports to contain all of Foruzanfar's edition. However, it was first put out before Foruzanfar completed editing the tarji-bands. The tarji-bands in the commercial edition were incorporated from some other (inferior) edition (and in a different order) and are therefore not those in Foruzanfar's authentic edition. These (non-Foruzanfar) tarji-bands number, in the one-volume edition, numbers 3366-3502 (= a total of 15).'''
year_published = 2025
clearnet = "https://dar-al-masnavi.org/tarji_band.html"
