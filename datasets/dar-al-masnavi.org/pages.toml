["https://dar-al-masnavi.org/about-arabic-poetry.html"]
title = "About Rumi's Arabic Poetry"
full_description = '''In Forûzânfar's edition of Rumi's Divan, there are 90 ghazals (Vol. 1, 29;Vol. 2, 1; Vol. 3, 6; Vol. 4, 8; Vol. 5, 19, Vol. 6, 0; Vol. 7, 27) and 19 quatrains entirely in Arabic. In addition, there are ghazals which are all Arabic except for the final line; many have one or two lines in Arabic within the body of the poem; some have as many as 9-13 consecutive lines in Arabic, with Persian verses preceding and following; some have alternating lines in Persian, then Arabic; some have the first half of the verse in Persian, the second half in Arabic. Also, in Rumi's "Discourses" [Fî-hi Mâ Fî-hi] there is one discourse entirely in Arabic (Discourse 22) and one in Arabic except for the first five words (Discourse 34). In Rumi's Sermons there are short Arabic introductory prayers for each of the seven sermons. And in his Letters, there are three entirely in Arabic, some half in Arabic, and four which consist entirely of Arabic poems. In addition, there are quotations of Arabic poetry in many of the letters. In Rumi's Masnavi, there are numerous instances of single lines entirely in Arabic, as well as instances of multiple consecutive lines in Arabic. Translations into English from Rumi's Arabic works are few: Professor Franklin Lewis translated a sermon (the sixth) from Rumi's "Seven Sermons" that begins with a benediction in Arabic ("Rumi-- Past and Present, East and West: The Life, Teachings and Poetry of Jalâl al-Din Rumi," 2002, pp. 130-33); Ibrahim Gamard and Rawan Farhadi translated Rumi's twenty-one Arabic quatrains--a few are half-Persian--"The Quatrains of Rumi," 2008); Nesreen Akhtarkhavari (with Anthony A. Lee) has made 33 selected translations from Rumi's Arabic ghazals in a bilingual edition (Love Is My Savior: The Arabic Poems of Rumi, 2016). "Rumi obviously had an excellent command of Arabic, not only as a reading language, but as a language in which he could compose poems, deliver sermons and so on. He appreciated the poetry of al-Mutanabbî, even though he represented the professional class of panegyrists. Aflâki (Af 623-4) has Rumi reading Mutanabbî at nights for pleasure, a practice which Shams al-Din condemned and tried to wean him of. Rumi quotes from Mutanabbî's poetry in Fihe mâ fih and also in the Masnavi, so Shams did not succeed in rooting this poet out of Rumi's memory. Quite likely, Rumi had come to appreciate al-Mutanabbî during his student days in Syria." (Franklin Lewis, "Rumi-- Past and Present, East and West," p. 315)'''
year_published = 2025
clearnet = "https://dar-al-masnavi.org/about-arabic-poetry.html"
