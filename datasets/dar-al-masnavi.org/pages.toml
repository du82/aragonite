["https://dar-al-masnavi.org/divan-aflaki.html"]
title = "Divan-Aflaki Concordance"
full_description = '''The following concordance of verses from Rumi's odes/ghazals was compiled by Susan Friedman, Ph.D. (on 9/27/03) and offered for use on this website to anyone interested. The earliest accounts of Jalâluddîn Rûmî were written by his son, Sultan Walad (mainly in poetic form). The next earliest account is by Sepahsâlâr, who claimed to have been a disciple of Rumi for twenty years. Thirdly, is Aflâkî's account, completed in 1353 (eighty years after Rumi died). Aflaki's book was initiated by the order of his shaykh, Ulu `ârif Chelebî, who was Rumi's grandson. His work is considered to be a "hagiography," in that it typically exaggerates in order to magnify the greatness of Rumi the saint, as well as his father and successors, especially by emphasizing their miracles. In his account, he borrowed freely from Sepahsâlâr's book, as well as the collection of the notes of the disciples of Shams-é Tabrîzî (Maqâlât-é Shams). Aflaki appears to have ornamented his work with verses from Rumi's works which have similar themes to the narrative accounts. Only occasionally does he state that a specific poem was composed or recited by Rumi during a specific occasion. Quite a few of the quoted verses are be other poets known or unknown to Aflaki, and are therefore not in the collected works of Rumi. Aflaki's quotations from Rumi's quatrains are not included in this concordance, but can be found in the "Quatrains Concordance" (in the Quatrains section of this website, sendable following email request). Aflaki's quotations from Rumi's Masnavi can be located in O'Kane's index, and are reliable. Unless noted, Aflaki page citations are for the English edition: "Shams al-dîn Ahmad-e Aflâkî, 'The Feats of the Knowers of God' (Manâqeb al-`ârefîn)," translated from the Persian by John O'Kane (Boston: Brill, 2002). O'Kane also has an index of verses which he located, however, the ones from Rumi's ghazals are imperfectly cited--therefore the need for the present concordance. Chapter and section numberings are the same for English and Persian editions unless noted. Arberry (a) and Nicholson (n) numberings follow the numbers in Foruzanfar's Persian edition if available.'''
year_published = 2025
clearnet = "https://dar-al-masnavi.org/divan-aflaki.html"
