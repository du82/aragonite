["https://dar-al-masnavi.org/about_qor.html"]
title = 'About "The Quatrains of Rumi"'
full_description = '''To: Friends of Daru 'l-Masnavi.org From: The webmaster of this site, Ibrahim Gamard Date: December, 2023 The first complete English translation of the Quatrains--over 700 pages--based on the Persian of the original, complete, and uncorrupt Forûzânfar edition (corrected and improved)--translated with close attention to Rumi's idiomatic usage, with the collaboration of scholar from Afghanistan, whose native Persian remains close to Rumi's own. The "version-makers" of the poetry of Jalâluddîn Rûmî have helped to make him perhaps today's most popular poet in the English language. But they have not served his intended meaning with equal zeal, often portraying him as a "universal" mystic who had somehow "transcended" Islam, even though his celebrated Mathnawi has been called "the Qur'an in the Persian tongue." Ibrâhîm W. Gamard and A. G. Rawân Farhâdî have labored to set the record straight, and to demonstrate that Mawlânâ Rûmî's universality is inseparable from his Islam--from the depth of his Islam. The book can be ordered from AMAZON (US), from AMAZON (UK), from BARNES AND NOBLE, or from other booksellers on the Internet.'''
