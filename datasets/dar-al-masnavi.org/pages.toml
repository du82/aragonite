["https://dar-al-masnavi.org/letters.html"]
title = "The Letters"
full_description = '''This is a collection of one hundred and fifty of Rumi's letters, "Maktubât," known as his "Letters." They reveal his active involvement with disciples and family members, who looked to him to intercede on their behalf with God, as well as with government leaders.1 The best edition was made by Tôfîq Sobhânî (1992), based on the oldest manuscript (in Konya, Turkey, dated 1352). The entire book of Letters is still not translated in full. William Chittick translated 12 short excerpts (generally one or two paragraphs in length),2 plus 2 long excerpts (one page and two pages in length).3 English Versions John Moyne has made translations, together with Coleman Barks of parts of 17 of the letters.*4 Barks' influence can occasionally be seen in the form of some inauthentic-sounding words and phrases.*5 Moyne's translation is sloppy and inaccurate.*6 These are not scholarly translations, as can be readily seen when compared to the excellent translations by William Chittick into very readable American English.* 7 1. see "Rumi-- Past and Present, East and West: The Life, Teachings and Poetry of Jalâl al-Din Rumi," by Franklin D. Lewis, 2001, pp. 294-95. 2. William C. Chittick, "The Sufi Path of Love: The Spiritual Teachings of Rumi," 1985. Short excerpts: from Letters (using Sobhânîs numbering): 1, 2, 8, 19, 21, 48, 60, 69, 97, 100 (see "Index of Sources, p. 380). He made one citation error (in Letter no. 97/95, p. 152, the verse is Qur'an 15:28-29, not 38: 72-73-- two very similar, but not identical, verses). 3. Chittick, "The Sufi Path of Love." Long excerpts: from Letter (using Sobhânîs numbering) 39 (p. 77) and Letter s 49-50 (pp. 133-5). 4. Barks, with Moyne, "This Longing: Versions of Rumi," 1988. Excerpts from Letters (using Sobhânîs numbering) 24, 56, 69, 64, 150 39, 49, 83, 85, 100, 118, 81, 82, 20, 69, 70, 19. 5. For example: "When jealously reduces someone to salesmanship" (p. 106); "Peace be with you and glory" (p. 82); "May you stay in your infinity" (p. 100)'''
year_published = 2025
