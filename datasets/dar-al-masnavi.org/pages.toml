["https://dar-al-masnavi.org/about_anqaravi.html"]
title = "About Anqaravi and his Masnavi Commentary"
full_description = '''Ism�`�l b. AHmad Rus�khu 'd-d�n Bayr�m�, Mevlev�, Anqarav� (known also as "Rus�kh�," the pen name he used in his poetry), died 1631, was the author of the most famous Ottoman Turkish commentary on the Masnavi. He named his commentary "majm�`atu 'l-laT�'if wa maTm�r�tu 'l-mu`�rif" (Collected Subtleties and Stored Mystic Knowledge). It has been, incorrectly, called by other names, such as by Nicholson (who called it by the title of another of Anqaravi's works, which was incorporated into his full commentary, "f�tiHu 'l-aby�t"-- Opener of the Verses) MeHmet T�hir ("sharH-i maSnav� shar�f, al-musamm� muf�tiHu 'l-aby�t"-- Commentary on the Noble Masnavi, called Opener of the Verses), Ism�`�l Pasha al-Baghd�d� ("f�tiHu 'l-aby�t f� sharHi 'l-maSnav�"-- Opener of the Verses in Commentary on the Masnavi). The work was first published in 1806 and last published in 1872, generally in six volumes. It was translated (but abridged) into Arabic by Chang� Y�suf Dede b. AHmad al-Mawlaw� (died 1669) and published in 1872 (as "al-manhaju 'l-qaw� f� sharHu 'l- mathnaw�"-- The Firm Path of Commentary on the Masnavi). And it was translated (completely) into Persian by `ISmat Satt�r-z�dah in 1970, in 15 volumes ("sharH-i kab�r-i anqarav� bar maSnavi-yi ma`nav�-yi m�lav�"-- Anqaravi's Great Commentary on the Couplets of Spiritual Meaning by M�lav� [= Rumi]). It has not been translated into English, although Nicholson quoted it often, in his own commentary, since (of the Persian, Turkish, and Arabic commentaries he consulted) it was the one which he most often used. He considered it to be "a work of great merit,"1 "the best Oriental exposition of the poem,"2 and the commentary by which he "profited most."3 Anqaravi's commentary consists of a translation of every line in the Masnavi into Turkish, followed by explanations. His work was so esteemed, that it was the primary commentary studied by members of the Mevlevi ("Whirling Dervish") order in order to master the meaning of the Masnavi. Certificates of mastery [ij�zat] of the commentary were issued to those who were appointed the rank of Masnavi-reciters, or lecturers [maSnav�- khw�n]. It was considered the greatest Ottoman Turkish commentary, along with two others ("jaw�hir-i baw�hir-i MaSnav�," by S�r� `Abdull�h Efendi, died 1661; "r�Hu 'l- mathnaw�," by Ism�`�l Haqq� of Bursa, died 1727).'''
