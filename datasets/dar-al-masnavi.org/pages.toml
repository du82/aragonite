["https://dar-al-masnavi.org/about_rai.html"]
title = "About Rumi and Islam"
full_description = '''To: Friends of Daru 'l-Masnavi.org From: The webmaster of this site, Ibrahim Gamard Date: March 21, 2004 I'm pleased to announce the publication of a book I was invited to write in 2003. An editor from Skylight Paths Publishing came across my Rumi website (www.dar-al-masnavi.org) and said that the format I use is similar to that used in their "Skylight Illuminations Series"--translations of selections from mystical classics on the right-hand pages, with facing-page explanatory notes on the left. She specifically invited me to write a book about what Rumi said about the Prophet Muhammad. What a blessed opportunity to write a book about what Mawlana (may God sanctify his spirit) and the Prophet (may God pour blessings upon him and give him peace) both said! Per my belief that the best title for a book is one that expresses its contents, my proposed title was "Rumi: On Muhammad". However,the publisher wanted a tile that would hopefully be more interesting to perspective buyers of the book. The book was titled "RUMI AND ISLAM" and has three sections: (1) stories about the Prophet (exemplifying his kindness, compassion and wisdom), (2) wise sayings of the Prophet (where Rumi said "Ahmad/Mustafa/Payghambar said..."), and (3) praises of the Prophet (where Rumi mentioned the Prophet very favorably). The first part, more than half of the book, is from Rumi's Masnavi/Mathnawi; the rest of the book is mainly from Rumi's Divan-i Kabir ("ecstatic poems"), but also from the Masnavi and the Discourses ("Fihi Ma Fihi"), as well as a few quotes from the Sermons ("Majalis-i Saba`ah") and Letters ("Maktubat"). The selections from the Masnavi often have Rumi's own profound explanations following some of the verses. These are direct translations from Persian and include references to the Persian editions. It is my hope that the book will further knowledge about how Rumi's mysticism was firmly rooted in Islam (in contrast to the popularized Rumi books which minimize or avoid the Islamic context, terms, and references in his poetry), how he was strongly devoted to the Prophet Muhammad and his example and wisdom (in addition to his famous devotion toward his spiritual master, Shams-i Tabrizi), and about how Islam is a religion of great compassion, wisdom, and moderation (in contrast to stereotypes about fanaticism).'''
year_published = 2025
clearnet = "https://dar-al-masnavi.org/about_rai.html"
