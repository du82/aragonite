["https://daringfireball.net/2024/03/eu_share_of_apples_revenue"]
title = "Daring Fireball: The EU’s Share of Apple’s Global Revenue"
description = "The DMA allows the EC to penalize “gatekeepers” with fines that are vastly disproportionate to the amount of revenue they generate in EU member states."
full_description = "A few readers have asked about my speculation that Apple, along with the other DMA-designated gatekeepers (none of which are European companies of course), might reasonably pull out of the relatively small EU market rather than risk facing disproportionately large fines from the European Commission. The DMA allows the EC to fine gatekeepers up to 10 percent of global revenue (which would hit a hardware-based company like Apple particularly hard) for a first offense, and up to 20 percent for subsequent fines. But the EU represents only 7 percent of Apple’s revenue. That figure comes from CFO Luca Maestri on Apple’s Q1 2024 analyst call: Amit Daryanani, Evercore: Fair enough, and then as a follow up, you folks have implemented a fair bit of changes around the apps for in Europe post the DMA implementation there. Can you just touch on what are some of the key updates and then Luca, does NetApp at all, do you see it having any significant impact financially to your services or the broader Apple P&L statement. Luca Maestri: Yes, and Amit, as Tim said, these are changes that we’re going to be implementing in March. A lot will depend on the choices that will be made. Just to keep it in context, the changes apply to the EU market, which represents roughly 7% of our global absolute App Store revenue. [Update 29 March: See transcription correction here. Maestri said “App Store revenue”, not “absolute revenue”.] It’s unclear whether Maestri was saying that the EU accounts for 7 percent of Apple’s worldwide App Store revenue, or 7 percent of all revenue, but I suspect it doesn’t matter, and that both are around 7 percent. App Store revenue ought to be a good proxy for overall revenue — there’s no reason to think EU Apple users spend any less or any more in the App Store than users around the world. There’s some “7 percent sounds way too low” confusion that stems from the fact that Apple, in its quarterly consolidated financial statements, breaks results into five geographic regions: Americas, Europe, Greater China, Japan, and “Rest of Asia Pacific”. “Europe” accounts for somewhere around 25 percent of Apple’s global revenue. That’s the number most people think about. But there are a significant number of high-GDP countries in Europe that aren’t in the EU — the UK (most famously), Russia, Turkey, Switzerland, Norway, and Ukraine. More importantly, Apple’s “Europe” includes the entire Middle East."
year_published = 2024
