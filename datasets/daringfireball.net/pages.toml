["https://daringfireball.net/2002/08/baby_needs_a_new_pair_of_processors"]
title = "Daring Fireball: Baby Needs a New Pair of Processors"
description = "Have pro users stayed away from Mac OS X because they weren’t happy with the previous crop of PowerMacs? Or, have they postponed buying new PowerMacs because they aren’t happy with Mac OS X?"
full_description = 'You might think that if you were about to debut a Macintosh-oriented weblog, it would be quite a stroke of good fortune for some Really Big News to break on the very day you plan to start writing. Like, say, a brand new line of PowerMac G4’s. The Daring Fireball’s verdict? Well, they certainly pass the “Do I Want One?” test. While the processor speeds are — surprise, surprise — only modest improvements over the previous models, the new plumbing under the hood is a nice improvement indeed: the mid- and high-end models feature a 167MHz bus and PC2700 DDR SDRAM. But is there a single surprise in the feature set? The architectural improvements (the faster bus and DDR SDRAM) debuted with the Xserve, which was announced nearly three months ago. Apple is continuing to offer a very appealing display promotion with the new G4’s: $200 towards the purchase of a 17" flat-panel, and $500 towards a Cinema Display. And, if you have a lot more money than the Daring Fireball does and want to take advantage of the new machines’ built-in support for dual displays, you can use this rebate offer to buy as many monitors as you want. Sweet. Recent Apple news and discussion has been inexplicably focused on the cost of upcoming software, namely Jaguar (which people want to be free or cheap for existing OS X users) and .Mac (née iTools, which, once again, people want to be free or cheap). (Come to think of it, this overblown focus on the price of Jaguar and .Mac isn’t really inexplicable at all — the modern Mac user is a cheap bastard.) But these issues are silly and shortsighted. There are two big problems facing Apple. The first is that PowerMac sales are down, and have been down for quite some time. No other problem compares to this one in magnitude, because the fact remains that Apple is in the business of selling computers. And while low-end consumer machines like the iMac and iBook have been great for revenue, it’s the high-end PowerBooks and PowerMacs that keep the company in business. It’s simple: low-end machines are low-margin, high-end machines are high-margin.'
year_published = 2002
