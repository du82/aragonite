["https://daringfireball.net/2013/09/vesper_whats_new_whats_next"]
title = "Daring Fireball: Vesper: What’s New and What’s Next"
description = "Sync is the feature that almost everything else on our roadmap hinges upon."
full_description = "After Apple unveiled iOS 7 at WWDC in June, we received many kind compliments along the lines of “Wow, Vesper really looks like an iOS 7 app already.” But the truth is that Vesper 1.0 was a forward-looking iOS 6 app. It was obvious to all three of us, right away, that this was very different from being a forward-looking iOS 7 app. We have big plans and a long roadmap for Vesper. But we’re a very small team. Setting our priorities — the order of our roadmap — has profound repercussions on when those things go from ideas we’re working on to features in the hands of our customers. We knew all along that our first priority was to ship a great iPhone app. Any other year, having done that in June, we’d have spent the summer working on something else. But iOS 7 is such a fundamental change to the platform, it rendered 2013 no ordinary year. If our first priority is for Vesper to be a great iPhone app, that meant we needed to spend our summer making Vesper a great iOS 7 app. A minor refresh while we moved on to other things simply would not do. The details of why that took all summer long (and why we expected it to) will make for a great design dissection, like the one Dave wrote for version 1.0. But for now, suffice it to say, it was a lot of work. Our policy, like that of many companies, is not to comment on future plans or work in progress. There are many good reasons that companies as big as Apple and as small as one-person shows adhere to such a policy. One reason is to keep attention focused on what is already available. Another is that keeping your mouth shut about work in progress is a way to implicitly under-promise and over-deliver. When a company says “We plan to ship X in the next three months” and it turns out to take six months, customers are naturally disappointed. When you say what’s coming next, people naturally want to know when. And when you tell them how long you think it will take, you’re giving them a guess, but to the customer it feels like a promise. And at heart, we’re all optimists about how long our work will take. In short, talking about work in progress and future plans is often a recipe for disappointing your customers."
year_published = 2013
