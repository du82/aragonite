["https://daringfireball.net/2002/10/stepping_on_eweeks_blue_suede_shoes"]
title = "Daring Fireball: Stepping on eWeek’s Blue Suede Shoes"
description = '''
<p>
It’s bullshit detection week here at Daring Fireball.
</p>

<p>
Next on our list is <a href="http://www.eweek.com/article2/0,3959,634711,00.asp">eWeek’s “scoop”</a> claiming that within the next three weeks, Apple is going to release a 10.2.2 update to Jaguar, which will include, as an option, a journaling file system code-named “Elvis”.
</p>

<p>
Allow me to dissent from the rah-rah coverage this story is getting elsewhere. Because I don’t believe it...
</p>'''
full_description = "Next on our list is eWeek’s “scoop” claiming that within the next three weeks, Apple is going to release a 10.2.2 update to Jaguar, which will include, as an option, a journaling file system code-named “Elvis”. Allow me to dissent from the rah-rah coverage this story is getting elsewhere. Because I don’t believe it. Disclaimer: I don’t have any sources within Apple. Nor do I have a beta copy of 10.2.2. I’ve got nothing but my own speculation. But if I’m wrong, and 10.2.2 appears in a few weeks with a journaling file system, I’ll eat some crow right here. The journaled file system, which will run atop the Mac’s traditional HFS file scheme, will be switched off by default; users will be able to switch it on via the command line, sources said. They reported that while Elvis runs in the background, enabling the journaled file system will slow current system performance by 10 percent to 15 percent. HFS+ and UFS are two file systems, both supported by Mac OS X. Neither is a journaling file system. (Neither is a “file scheme”, either, whatever that is.) You can’t just turn HFS+ into a journaling file system with a magic layer of pixie dust. To change a disk from one file system to another, you need to reformat it. What eWeek is claiming simply isn’t possible. A journaling file system doesn’t simply write a single “journal” file containing all the journaling information. The whole point of a journaling file system is that the journaling data is a fundamental part of the format itself. Indeed, Apple apparently enlisted the creator of the Be technology for its Elvis project: Be’s BFS journaled file system was written by Dominic Giampaolo, who in March joined Apple as a file system engineer, The Register UK reported. It’s definitely true that Apple hired Dominic Giampaolo. And it’s also true that Giampaolo was largely responsible for the BeOS’s journaling file system. And it makes a lot of sense that he might be working on a journaling file system for Apple. But if and when such a journaling file system appears, it will, by definition, be a new file system."
year_published = 2002
year_updated = 2002
clearnet = "https://daringfireball.net/2002/10/stepping_on_eweeks_blue_suede_shoes"
tags = ["blue", "elvis", "eweek’s", "gruber", "john", "k-mart", "minneapolis", "next:", "previous:", "records"]
language = "en"
