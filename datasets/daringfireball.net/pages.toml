["https://daringfireball.net/2002/08/blame_it_on_quark"]
title = "Daring Fireball: Blame It on Quark"
description = """
<p>
This “blame it on Quark” excuse has achieved a lot of traction in the current conventional wisdom. Everyone wants to believe that Apple’s problems are just that simple: <em>If only those cocksuckers at Quark would get their act together, everyone would start buying new machines and join hands in singing the OS X theme song.</em>
</p>"""
full_description = "As mentioned here last week after the introduction of the new “mirror tray” G4 PowerMacs, Apple is hoping that the dual debuts of these new machines and Mac OS X 10.2 will break them out of two troubling slumps: It’s hard to tell how linked these two slumps are. One argument is that people are waiting to switch to OS X until they buy new machines on which it’s pre-installed, but that they are waiting to buy new machines until Apple comes out with significantly improved PowerMacs. This makes a lot of sense, but doesn’t account for everybody. It’s also an uncomfortable theory for Apple, because it’s based on the idea that their flagship PowerMac G4 line just hasn’t been very compelling. Apple’s preferred theory, as expressed by their executives in quarterly analyst meetings, goes something like this: Customers are waiting to buy new machines until they’re ready to switch to Mac OS X, but they’re not ready to switch to Mac OS X, but not because there’s anything wrong with Mac OS X itself, but because lazy third-party developers still haven’t ported essential software to run natively on Mac OS X yet. One after another, however, important software packages like Microsoft Office and Adobe’s design suite — most especially Photoshop — have been released for Mac OS X. The updates come and garner stellar reviews, but neither PowerMac sales nor OS X adoption ever jump. The lone notable holdout is QuarkXPress, which is neither native for OS X nor expected to be anytime soon. (Does anyone honestly believe that an OS X-native “Quark 6.0” will be shipping this January?) This “blame it on Quark” excuse has achieved a lot of traction in the current conventional wisdom. Everyone wants to believe that Apple’s problems are just that simple: If only those cocksuckers at Quark would get their act together, everyone would start buying new machines and join hands in singing the OS X theme song. People really want to believe that this is Quark’s fault. For example, Derrick Story — a smart guy, good writer, and managing editor for the O’Reilly Network. In a weblog entry offering advice to Apple, he wrote:"
