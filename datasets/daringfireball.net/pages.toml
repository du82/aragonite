["https://daringfireball.net/2015/09/the_iphones_6s"]
title = "Daring Fireball: The iPhones 6S"
description = "Storage capacities and battery life are unchanged from last year’s iPhones. Everything else — the materials it’s made from, the performance of its custom CPU/GPU, the quality of the cameras, the smoothness of the user interface — is noticeably, tangibly improved."
full_description = "The pattern is pretty clear. In even-numbered years (2008, 2010, 2012, 2014) Apple releases all-new iPhone form factors: 3G, 4, 5, 6/6 Plus. In the subsequent years, they release “S” variants: iPhones that look nearly identical to their predecessors, but with improved components. There are some ecosystem advantages to this tick-tock1 schedule. Most iPhone cases, for example, fit both the tick and tock iPhones. (The rare exceptions are certain hard cases with extremely tight tolerances. The iPhones 6S, for example, are both a few tenths of a millimeter bigger, wider, and thicker than their corresponding siblings from last year.) I think there are some branding advantages to this two-year cycle as well. iPhones are iconic devices. The devices themselves are recognizable. Keeping each new form factor around for two model years lets that iconic appearance seep deeper into the mass market collective consciousness. Releasing a new generation of iPhones every year — year in, year out — is an aggressive pace given the scale and scope of the iPhone, and its importance to Apple financially. Sure, other handset makers put out dozens of different models every year. But Apple is playing an entirely different game. With one exception — the iPhone 5C two years ago (a phone which, as time goes by, seems more and more curious strategically) — Apple has never made a new iPhone other than a new top-of-the-line industry-leading flagship. In the same way that automobiles don’t change form factors every year, I don’t think it would be feasible for Apple to change the iPhone’s form factor every year. I think it takes more than a year for Apple’s design team to create a new iPhone design — at least to create a new design that is different because it is better, not merely different for the sake of being different. The glaring downside to this tick-tock schedule is that we as a culture — and particularly the media, both on the tech/gadgetry side and the business side — are obsessed with “new”. And, well, the S-model iPhones don’t look new. This year there is a new rose gold aluminum finish, but at a glance, the iPhones 6S look like last year’s iPhones 6. Every year is an iterative improvement over the previous one, whether it’s an S year or not. But it’s hard not to see the S years as more iterative, less impressive, updates, simply because they look the same."
