["https://daringfireball.net/2002/09/ip_freely"]
title = "Daring Fireball: I.P. Freely"
description = """
<p>
All the noise last week was about iCal, but the two most important announcements from Apple had nothing to do with the free calendar app.
</p>"""
full_description = "All the noise last week was about iCal, but the two most important announcements from Apple had nothing to do with the free calendar app. The biggest story is that new Macs released after January will no longer boot Mac OS 9. This isn’t shocking, since it was obviously going to happen at some point, the only surprise is that it’s happening so soon. If we discount Mac OS X 10.0 (because it mostly stunk), Mac OS X has really only been out for about a year. And even Apple’s own estimates regarding OS X adoption put the number at under 20 percent: “We expect that 20 percent of our entire installed base will be using Mac OS X by the end of this year, making it the fastest operating system transition in recent history,” said Steve Jobs, Apple’s CEO. (Jobs keeps saying it’s “the fastest operating system transition in recent history”, but that’s just an empty marketing statistic. For one thing, what’s “recent”? For another, compared to what other OS transitions?) The more interesting story, however, is Apple’s new “Design Freely” promotion — if you buy a new PowerMac G4 between now and the end of the year, you score a free copy of Adobe InDesign. Not discounted. Free. This is huge. Huge. But for some reason, it hasn’t gotten much press. Here’s why this offer is big news: It’s an interesting promotion, to say the least. It doesn’t mean much at all to anyone who doesn’t do serious page layout, but for those of us who do, it’s certainly tempting. But irrestible? I don’t think so. For one thing, pro designers aren’t software cheapskates — it’s not the price tag for InDesign that has kept them from abandoning QuarkXPress. $699 for a software package certainly sounds like a lot of money to most people, but design software has been expensive ever since the desktop publishing revolution began. High prices didn’t keep Photoshop and Illustrator (and QuarkXPress, which retails for $899) from becoming runaway successes. What has kept InDesign from putting Quark out of business is the simple fact that InDesign is not QuarkXPress. It does the same thing as XPress, and in a fairly similar way (as opposed to Quark’s previous but long-since defeated arch rival, PageMaker, which did the same thing, but in a very different way). But InDesign is not an XPress clone (nor was it intended to be). As a Quark user with five years of experience, I tried InDesign, and found it to be servicable, but frustrating. Frustrating because the little differences made me much less productive than I am in Quark."
year_published = 2002
