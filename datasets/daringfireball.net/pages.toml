["https://daringfireball.net/2017/09/the_iphones_8"]
title = "Daring Fireball: The iPhones 8"
description = "These are solid year-over-year updates — at least as impressive as the iPhone 7 was over the iPhone 6S. If they hadn’t debuted alongside the iPhone X we’d be arguing about whether these are the most impressive new iPhone models since the iPhone 6."
full_description = "I was tempted to write this review under the conceit that there was no such thing as the iPhone X. Just don’t even mention the iPhone X, and consider the iPhone 8 and 8 Plus as though they were the only two new phones coming from Apple this year. That conceit would work, insofar as the iPhones 8 are excellent year-over-year upgrades compared to their iPhone 7 counterparts. But ignoring the iPhone X would actually do an injustice to the 8 and 8 Plus, because so much of what is inside the X is also inside the 8’s. These phones are in no way shape or form1 some sort of half-hearted or minor update over the iPhone 7. These new iPhones look and feel great. I’ve been testing a silver iPhone 8 and gold iPhone 8 Plus since last Wednesday. Whether you like the way their polished back glass looks is subjective, but I like it a lot. Feel-wise, there’s no question in my mind that glass is better than aluminum. My personal iPhone 7 that I’ve been using for the last 11 months, however, is the jet black model, which in hand feels very similar to the glass of the iPhones 8. With both the iPhone 8 and iPhone 7 in my pocket I can’t tell them apart by feel, but that’s only because my 7 has the jet black finish. I’ve never owned a Plus-sized iPhone, and last year my review unit did not have the jet black finish, so I found the 8 Plus with glass back to be a revelation. I prefer it so much to any previous Plus-sized iPhone I’ve tested that it almost feels like a different form factor, not just a different material. I’ve always found the Plus unwieldy, and part of that is that aluminum is slippery enough that, combined with the size of the device, it just felt like something I had to consciously think about to avoid dropping. However, just like the jet black aluminum finish, the polished glass back of these new phones is grippier. That grippiness is a nice feature for the 4.7-inch size, but for the Plus, I think it’s a necessity — it makes it far more pleasant to hold and use."
year_published = 2017
clearnet = "https://daringfireball.net/2017/09/the_iphones_8"
