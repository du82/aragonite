["https://daringfireball.net/2002/11/do_you_smell_something"]
title = "Daring Fireball: Do You Smell Something?"
description = '''
<p>
<a href="
http://radio.weblogs.com/0100148/2002/11/14.html">Nicholas Riley nails the Mac OS X Finder</a>:
</p>

<blockquote>
<p>
Why, after three major releases and multiple years of development, is the OS X Finder so slow, buggy and painful to use? The problems I had regularly with OS 9’s Finder I could count on one hand.
</p>
</blockquote>

<p>
Indeed, the OS X Finder is an embarrassment, not only to Apple, but to the good name of the original Finder, from the original Macintosh through Mac OS 9.
</p>

<p>
Mr. Riley goes on to post a screenshot of a shoddy Finder dialog box, against which he claims to have identified seven major problems. Michael Tsai does a good job <a href="http://www.mjtsai.com/blog/archives/2002/11/15/finder_move_problems.html">identifying them</a>. To Mr. Tsai’s list I’ll add the following: The caution icon should be in the <a href="http://developer.apple.com/techpubs/macosx/Essentials/AquaHIGuidelines/AHIGLayout/Sample_Dialog_Layouts.html">upper left of the window</a>.
</p>'''
