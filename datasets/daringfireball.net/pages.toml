["https://daringfireball.net/linked/2025/03/01/green-imessage-disappearing-messages"]
title = "Daring Fireball: Matthew Green: 'Dear Apple: Add \"Disappearing Messages\" to iMessage Right Now'"
description = "Link to: https://blog.cryptographyengineering.com/2025/03/01/dear-apple-add-disappearing-messages-to-imessage-right-now/"
full_description = "If you install WhatsApp, Facebook Messenger, Signal, Snap or even Telegram (please don’t!) you’ll encounter a simple feature that addresses this problem. It’s usually called “disappearing messages”, but sometimes goes by other names. I’m almost embarrassed to explain what this feature does, since it’s like explaining how a steering wheel works. Nevertheless. When you start a chat, you can decide how long the messages should stick around for. If your answer is forever, you don’t need to do anything. However, if it’s a sensitive conversation and you want it to be ephemeral in the same way that a phone call is, you can pick a time, typically ranging from 5 minutes to 90 days. When that time expires, your messages just get erased — on both your phone and the phones of the people you’re talking to. A separate feature of disappearing messages is that some platforms will omit these conversations from device backups, or at least they’ll make sure expired messages can’t be restored. This makes sense because those conversations are supposed to be ephemeral: people are clearly not expecting those text messages to be around in the future, so they’re not as angry if they lose them a few days early. [...] To recap, nearly every single other messaging product that people use in large numbers (at least here in the US) has some kind of disappearing messages feature. Apple’s omission is starting to be very unique. I do have some friends who work for Apple Security and I’ve tried to talk to them about this. [...] When I ask about disappearing messages, I get embarrassed sighs and crickets. Nobody can explain why Apple is so far behind on this basic feature even as an option, long after it became standard in every other messenger. I can only speculate why iMessage doesn’t offer this feature. Perhaps Apple doesn’t want to imply that “disappearing messages” are in any way guaranteed to be ephemeral, which would be impossible. Who’s to say the recipient hasn’t screenshotted them? And if Messages were to impose a software block against capturing a screenshot of a “disappearing message” (like the way you can’t capture screenshots of DRM-protected video), who’s to say the recipient hasn’t used another device to take a photograph of the display showing the ostensibly-ephemeral message? E2EE is a mathematical guarantee. There’s no way to offer such a guarantee regarding ephemerality, and perhaps that gives Apple pause."
year_published = 2025
