["https://daringfireball.net/2019/09/the_iphone_11_and_iphones_11_pro"]
title = "Daring Fireball: The iPhone 11 and iPhones 11 Pro"
description = "It’s an impressive year-over-year camera improvement one year after an impressive year-over-year camera improvement."
full_description = "A few weeks ago on my podcast, speculating on the tentpole features for this year’s new iPhones, I said that “iCamera” would be a far more apt name than “iPhone”. MG Siegler, writing about Apple’s event last week, had the same thought: The iPhone is now officially a camera. I mean, it has been a camera for a long time. The most popular camera in the world, as Apple is quick to point out each and every year, a decade on. But now it’s really a camera, as today’s keynote made clear. The key parts of the presentations for both the iPhone 11 and the iPhone 11 Pro were all about the camera. As Phil Schiller said in his portion: “I know what you’re waiting for, and I am too. Let’s talk about the cameras. Without question, my favorite part about iPhone.” It feels like if Apple wasn’t so wedded to their own legacy branding — more on that in a bit — they would rename this thing the iCamera. Apple’s not really going to do that, of course. But Apple spent the vast majority of the stage time for the iPhone 11 and iPhone 11 Pro talking about their cameras. They spent no time — not a word — talking about phone calls. It would have been weird if they did talk about phone calls. That’s probably the single biggest change in the landscape from 2007 to today. Back then, introducing the original iPhone, Steve Jobs spent a lot of time talking about phone calls and voicemail, and almost no time on the camera. It never ceases to amaze me that the original iPhone camera couldn’t even shoot video — at all — and within 10 years Steven Soderbergh was using iPhones to shoot feature films. Driven by the iPhone, the word phone has simply taken on a new definition — a pocket-sized touchscreen personal computer with wireless networking and one or more cameras. Try convincing a six-year-old that a landline telephone is a “phone” — they won’t believe you. If you want to know Apple’s top priority with the iPhones 11, just look at the back of the new iPhones. Remember when we thought the iPhone 6 camera bump was prominent? That it was something Apple might be trying to hide in marketing photos? With the iPhones 11, the camera system takes up an entire corner. It’s so large Apple had to move the Apple logo down to the center of the back. I’m not sure if it’s related to the lower position of the Apple logo, but for the first time, the iPhones 11 no longer say “iPhone”. The only two things on the back are the logo and a big camera system. They don’t have to rename it “iCamera” — these phones scream this is a camera just by looking at them. And if you insist upon judging Apple’s focus — no pun intended, I swear — for these new iPhones by what they talked about during last week’s event, this 24-second highlight reel says it all."
year_published = 2019
clearnet = "https://daringfireball.net/2019/09/the_iphone_11_and_iphones_11_pro"
