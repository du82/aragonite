["https://daringfireball.net/linked/2025/02/23/linus-sebastian-switch-to-iphone"]
title = "Daring Fireball: Linus Sebastian's Thoughts After Switching to an iPhone for 30 Days"
description = "Link to: https://daringfireball.net/linked/2025/02/23/linus-sebastian-switch-to-iphone"
full_description = "I’ve been meaning, since it came out in December, to link to this video from Linus Sebastian of “Linus Tech Tips” fame, and with the iPhone 16e dropping this week, now seems like a good time. It’s a common genre that dates back decades before YouTube was even a thing: longtime user of platform X switches to rival platform Y for a few weeks, and then explains what they liked, what they didn’t, what confused them, etc. This sort of thing always raises hackles because there’s a natural human tendency to get tribal — if not downright religious — about one’s platforms of choice. And Sebastian’s intro — playing to YouTube’s algorithm — frames it in a way that makes it seem like his overall take on iOS is going to be inflammatory. Right in the first 30 seconds of the 20-minute video, he says: Just a few days into my iOS challenge I started to look a little differently at the Apple users in my life. They describe Apple products with marketing slogans like “it just works” as though they actually believe them, and it made me wonder, does Apple have one version of their products for the True Believers and then a different one for the scrubs like me? Because my time with the iPhone 16 Plus has been absolutely riddled with unintuitive design choices, unnecessarily limited functionality, and some of the weirdest bugs that I have encountered on a supposedly finished product in years. The first time I watched the video, my finger started hovering to the close-tab button at this point. But that provocative opening isn’t really representative of Sebastian’s actual observations and complaints at all. It’s just the YouTube/social-media style. Me? I would start an essay, on, say, the things that bug me the most about Android, in the least inflammatory way possible, to open people’s minds and get as many Android proponents as possible to relax, and listen to my arguments. And then I’d try to make my case, building to a crescendo where I deliver my perhaps inflammatory conclusions only at the very end. YouTube works the reverse way — you start out in provocative fashion to raise hackles, because outrage drives engagement, but then sort of work your way back toward reasonableness."
