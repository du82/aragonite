["http://daringfireball.net/thetalkshow"]
title = "Daring Fireball: The Talk Show"
full_description = "Special guest: Paul Kafasis. Special topics: Siri/Super Bowl nonsense, “Gulf of Mexico/America” nonsense, the iPhone 16e gets announced, and a veritable Bond villain buys the rights to the James Bond movie franchise. Kagi founder and CEO Vlad Prelovac joins the show to talk about the business of web search, the thinking behind Kagi’s own amazing search engine, and their upstart WebKit-based browser Orion. Special guest Allen Pike joins the show to talk about the state of generative AI and how Apple Intelligence measures up (so far). Also: some speculation on Apple’s pending acquisition of the ever-difficult-to-pronounce Pixelmator. Joanna Stern returns to the show to talk about our new best friends, AI chatbots, and I chime in with how the Voight-Kampff test got it all wrong. This again. Jiminy. Well, once more, let’s talk around another election, and try, by doing so, to maybe express something about it. Dan Moren returns to the show to discuss this week’s introductions of the first M4 Macs: iMac, Mac Mini, and MacBook Pros. Tyler Stalman joins the show to discuss the iPhone 16 lineup’s cameras, and the state of iPhone photography. Jason Snell returns to the show to discuss Apple’s September product announcements, and Meta’s Orion prototype AR glasses. Absolutely no baseball talk, almost. Special guest Taegan Goddard, longtime writer and founder of Political Wire, joins the show to talk about the past, present, and future of independent media. Chance Miller, ace reporter (and editor-in-chief) for 9to5Mac, joins the show to talk about the latest changes to Apple’s DMA compliance plans with iOS, expectations for the September Apple event, and more. Christina Warren (a.k.a. “Mary Brown”) returns to the show. Topics include Apple’s new iOS 18.1 and MacOS 15.1 betas (featuring Apple Intelligence), a little reminiscing about Gil Amelio and Steve Jobs, and the bizarre saga of TUAW, resurrected as a zombie AI slopsite. Special guest Hunter Hillegas, author of the excellent Vegas Mate app, joins the show to discuss euphemistic emoji, the CrowdStrike fiasco, and the closing of the iconic Mirage resort in Las Vegas."
