["https://daringfireball.net/2025/02/golfo_del_gringo_loco"]
title = "Daring Fireball: Golfo del Gringo Loco"
description = "Much serious thought and consideration, from very smart people in Mountain View and Cupertino, went into determining how to respond to a profoundly silly and thoughtless executive order. Yet that response is disturbing."
full_description = "You saw the news last week, I’m sure, that both of the major mapping-app providers, Google and Apple, have updated their maps to refer to the Gulf of Mexico as the “Gulf of America”. Microsoft’s Bing Maps, which I would describe as a minor provider, has made the change too.1 It’s all actually quite a bit more complicated than “they renamed the Gulf of Mexico”, but bear with me for now. You’ve also seen, I’m equally sure, a lot of people angry at Google and Apple for going along with this. That anger is — to some degree — misplaced. I get where the anger comes from, but it’s still misplaced. My initial take, right in the midst of Trump’s inauguration speech on January 20, was that if he went through with it, Apple and Google and everyone else who publishes maps should just ignore it. Trump, obviously, did go through with it: the United States Geological Survey, an agency within the Department of the Interior, which is within the executive branch and thus under the president’s purview, officially made the change on February 7. Now that it’s official US government policy, “just ignore it” really isn’t feasible. If that’s still your stance, I implore you to consider at least a bit more nuance. But let’s first stipulate up front that there are multiple far more important and urgent issues facing the United States and the world, just four short weeks into the Trump 2.0 administration. Off the top of my head: Ukraine, Gaza, tariffs, DOGE, the rule of law. Whether you approve or disapprove of Trump’s actions on any or all of those issues, there should be no question that all of them are important and consequential. The name we see on maps for a body of water, not as much. But it’s the smallness, the relative unimportance, the spiteful pettiness of the renaming in the first place — down to the fact that until Trump’s executive action, there was no controversy, zero, none, nada, anywhere in the world, amongst any group of people, regarding the name of the Gulf of Mexico — that makes it interesting to examine in detail how Google and Apple have chosen to deal with it. It’s only because this particular issue is so spectacularly piddling that we can consider it in full."
