title = "Daring Fireball Projects"
full_description = "A text-to-HTML formatting syntax for web writers, implemented as a plug-in for Movable Type, Blosxom, and BBEdit. Markdown allows you to write using an easy-to-read, easy-to-write plain text format, then convert it to structurally valid XHTML (or HTML). A plug-in for Movable Type, Blosxom, and BBEdit that provides smart quotes and other typographic goodies. Vesper was a simple and elegant tool for collecting notes, ideas, things to do — anything you want to remember. Vesper lets you use tags to group related items into playlist-like collections, and now offers fast, reliable cloud-based syncing. Alas, it is now defunct. A Mac OS X service that takes as input the text selection in the frontmost app. Every URL within the selected text is opened in a tab in one new window in Safari. A plug-in for Movable Type that escapes strings for JSON. Useful when creating templates for JSON feeds. A command-line tool for saving and loading text color schemes for BBEdit and TextWrangler. Obsoleted by the built-in color scheme preferences in BBEdit 10 or later. A combination of Perl and AppleScript that allows you to syntax-check CSS files using the W3C’s CSS Validation Service. Syntax-coloring language module for Movable Type configuration files (‘mt.cfg’), for BBEdit 8.0 or later. Command-line interface to BBEdit’s Find Differences command on Mac OS X. (Obsoleted by BBEdit 8.0's official ‘bbdiff’ tool (which is not based on mine), but some people still prefer using this script.)"
