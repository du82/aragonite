["https://daringfireball.net/2020/10/the_2020_ipad_air"]
title = "Daring Fireball: The 2020 iPad Air"
description = "If you plan to never or seldom use your iPad with a hardware keyboard and trackpad, I don’t think you’re missing that much with Touch ID instead of Face ID. If you do plan to use a keyboard and trackpad, however, you’re missing a lot."
full_description = "I’ve been using the new iPad Air for the last week, and, as is my wont with iPad reviews, I’m writing this on it. My personal iPad has been an 11-inch iPad Pro from late 2018. This new iPad Air looks and feels like the current 11-inch Pro’s spiritual sibling. The 2018 and 2020 11-inch iPads Pro (1st and 2nd generation) are precisely identical in size and shape, camera systems aside. The new 10.9-inch iPad Air, with its single-lens rear camera system, is nearly identical to the 2018 11-inch iPad Pro, and uses the same basic industrial design: flat sides, round “edge-to-edge” displays, no home button. A glance at Apple’s iPad Compare page shows that the new iPad Air and both generations of 11-inch iPad Pro are the same height and width right down to the tenth of a millimeter. The one minute difference in size is that the new Air is 0.2 mm thicker. Hence, the new Air fits perfectly in the same Magic Keyboard as the 11-inch iPad Pros. Side-by-side with an 11-inch iPad Pro, you can see that the bezel surrounding the display of the new 10.9-inch Air is slightly wider. It has to be — with the same size body but a slightly smaller (and, I presume, slightly less expensive) display, the bezel has to be ever so slightly thicker. In practice, when you’re not looking at them side-by-side, it’s not noticeable. The only obvious-at-a-glance difference is that the new Air is available in colors that the iPad Pro is not — green, blue and rose gold — in addition to silver and space gray. Apple provided me the green one — it is charmingly minty. Comparing the displays of the new iPad Air to the iPad Pro, the 0.1-inch diagonal size difference is not significant. The maximum “typical” brightness (500 nits vs. 600 nits) doesn’t seem that significant to me either. But one difference is significant: the iPad Pro offers ProMotion — Apple’s name for dynamic refresh rates up to 120 Hz — and the iPad Air does not. Apple introduced ProMotion to the iPad Pro over three years ago, in June 2017 — so long ago that those original ProMotion iPad Pros had home buttons. iPads Pro are still the only devices Apple makes with ProMotion, to the consternation of folks who were hoping to see the technology make it to iPhones this year."
year_published = 2020
clearnet = "https://daringfireball.net/2020/10/the_2020_ipad_air"
