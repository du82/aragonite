["https://daringfireball.net/2025/02/fox_new_scorebug_graphic_design"]
title = "Daring Fireball: Fox’s New Scorebug Graphic Design, and Our Innate Resistance to Change"
description = "Different doesn’t always mean better. But better necessarily implies different."
full_description = "A scorebug is industry jargon for the sub-genre of chyron (itself jargon) that shows ever-present information about a televised sporting event while you’re watching. These graphics display the teams, the score, the time remaining, and other metadata pertaining to the current situation. The current ball/strike count in baseball. The down and yards-to-go in football. The shot clock in basketball. That sort of thing.1 Fox was the broadcast network for Super Bowl 59 yesterday, in which the Philadelphia Eagles utterly embarrassed the Kansas City Chiefs 40-22 (but which felt like a score of 114-0). The NFL rotates the Super Bowl annually between the networks that broadcast games. Fox has a tradition of unveiling updated on-screen graphics packages when it has the Super Bowl. This year, they didn’t just tweak the design, they completely re-thought it and redesigned it. First, here’s Fox’s familiar old scorebug, as captured from their broadcast of Super Bowl 57, a game that also pitted the Eagles against the Chiefs two years ago.2 Here’s the new scorebug they debuted last night, in front of the biggest sports audience of the year: I noticed the change immediately (of course), and my knee-jerk instant reaction was negative. Too big, too bold, too different. Don’t like. That’s natural. Human beings evolved to be alarmed by change. If everything looks the same as usual, everything is probably as safe as usual. If something looks jarringly different, it might be a sign that you’re about to be killed. (Evolutionarily speaking.) So I started studying and considering the changes to Fox’s scorebug. I quickly not only warmed up to the new scorebug, I decided I really like it. It’s better than Fox’s old one, and better than every other network’s (which all largely look the same), in almost every single regard. I like the new scorebug so much I (cross-)posted about it to social media during the game. My posts, in order of engagement: Threads (~6,600 likes, ~700 replies and reposts), Bluesky (~3,900 likes, ~600 replies and reposts), and Mastodon (179 likes, 53 replies and reposts)."
