["https://daringfireball.net/linked/2021/02/12/bloomberg-big-con"]
title = "Daring Fireball: Bloomberg, at Long Last, Follows up on 'The Big Hack', and It's Nothing but a Pile of Sophistic Horseshit"
description = "Link to: https://www.bloomberg.com/features/2021-supermicro/"
full_description = "Well, holy shit, two years and four months after publishing “The Big Hack”, Bloomberg has finally followed up. The follow up is even from the same two reporters, Jordan Robertson and Michael Riley. It’s a 4,000-word exercise in journalistic sophistry. It creates the illusion of something being there, but there is nothing there. The only good purpose this report could serve is as source material for a class on critical thinking. Bloomberg headlined this followup “The Long Hack: How China Exploited a U.S. Tech Supplier”, but it’s looking ever more like a long con on Bloomberg’s part. The original story’s key allegations — what made it a blockbuster — were that Chinese government operatives had surreptitiously added “phone home” chips to server components made by a company named Supermicro, and that Apple and Amazon were among the companies who’d been breached by these compromised servers. Apple and Amazon adamantly refuted the entire story, in unambiguous language. Bloomberg’s original report offered no firsthand evidence of these compromised servers. In the years since, no one has ever discovered any evidence of such compromised servers. Bloomberg Businessweek first reported on China’s meddling with Supermicro products in October 2018, in an article that focused on accounts of added malicious chips found on server motherboards in 2015. That story said Apple Inc. and Amazon.com Inc. had discovered the chips on equipment they’d purchased. Supermicro, Apple and Amazon publicly called for a retraction. U.S. government officials also disputed the article. No other paragraph in the story mentions either Apple or Amazon. Bloomberg still hasn’t retracted their allegations regarding Apple or Amazon. Yet they still haven’t produced one shred of evidence supporting their allegations. Apple and Amazon aside, they still haven’t produced one shred of evidence regarding these surreptitious “phone home” chips on Supermicro components."
year_published = 2025
