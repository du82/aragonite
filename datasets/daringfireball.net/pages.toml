["https://daringfireball.net/2018/09/iphone_xs_xr_series_4_apple_watch_event"]
title = "Daring Fireball: Thoughts and Observations on Apple’s iPhone XS/XR and Series 4 Apple Watch Introductory Event"
description = "Regarding the event itself and the devices announced at it."
full_description = "I just re-read my “Welcome to the Steve Jobs Theater” piece from last year, and my description of the venue holds up well. It truly is a magnificent venue. Before, during, and after the show, it feels like something big is being announced. That feeling just couldn’t be conjured at the old Town Hall facility on the Infinite Loop campus. WWDC feels big, of course, but that’s because there are like 5,000 or 6,000 people in the audience and it’s held in a cavernous convention hall. Apple’s numerous events in San Francisco could have a “this is a big deal” feel — especially the recent ones that were held at the Bill Graham Civic Auditorium — but what the Steve Jobs Theater provides that no venue in San Francisco ever could is seclusion. Apple Park really feels like it is its own world. Putting “Park” in the complex’s name was exactly right. In terms of sight lines and feeling like you’re isolated from the rest of the world, the effect is very similar to being in one of the theme parks at Walt Disney World. As you walk the pathway uphill from the Visitor Center to the theater, ambient music plays from hidden speakers. The only thing man-made you can see from the pavilion atop the Steve Jobs Theater is Apple Park’s Ring building, seemingly on the horizon. The foliage and grass filled in significantly since last year. It even smelled better this year — last year the odor of fertilizer for the grass still wafted in the air. It’s simply beautiful, inside and out. The experience of attending an event there is just very, very Apple. Steve Jobs would have loved it. Last year I complained about the hands-on area being crowded. Apple had an altogether new table layout this year, and it really helped. Apple, I suspect, wants to be conservative about using this space for events. Many of us expect Apple to hold an event some time in October, to introduce new iPad Pros and updated MacBooks. They might hold that at Apple Park too — the new iPad Pros look to be major updates, worthy of a major event. But I wouldn’t be surprised if they held it elsewhere. And I really doubt they’ll ever hold more than two public events here in a year. It’s extraordinary to think about how much they spent to build a facility they intend to use only a handful of times per year. (They do use the theater internally, for company events.)"
year_published = 2018
year_updated = 2018
