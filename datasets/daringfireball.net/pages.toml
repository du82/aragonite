["https://daringfireball.net/2017/10/iphone_x_review_roundup"]
title = "Daring Fireball: iPhone X Review Roundup"
description = "First impressions of the iPhone X, and comments on Matthew Panzarino’s and Nicole Nguyen’s reviews."
full_description = "Because I’ve only had about 24 hours with the iPhone X, I’m in no position to write a review yet. But my quick take: I was far from alone in not getting an extended period of time to test the phone before the review embargo lifted. Matthew Panzarino used iPhone X for a week, and stress-tested it with a family trip to Disneyland. (He did the same thing with the iPhone 6 and 6 Plus three years ago — it’s a great conceit for a review.) He also got on-the-record interviews with Phil Schiller, Dan Riccio, Craig Federighi, and Alan Dye. Riccio flatly denied reports that Apple was scrambling to get Touch ID working with iPhone X: “I heard some rumor [that] we couldn’t get Touch ID to work through the glass so we had to remove that,” Riccio says, answering a question about whether there were late design changes. “When we hit early line of sight on getting Face ID to be [as] good as it was, we knew that if we could be successful we could enable the product that we wanted to go off and do and if that’s true it could be something that we could burn the bridges and be all in with. This is assuming it was a better solution. And that’s what we did. So we spent no time looking at fingerprints on the back or through the glass or on the side because if we did those things, which would be a last-minute change, they would be a distraction relative to enabling the more important thing that we were trying to achieve, which was Face ID done in a high-quality way.” I hate to say it, but it makes the iPhone 8 Plus LCD look kind of like butt. I love it, even though it is flawed in one noticeable way. The one area where this display falls prey to standard OLED gripes is in off-axis viewing. Apple tells me that it has done work to counter the drop in saturation and shift to blue that affects OLED screens traditionally. I can tell you that, compared to other OLED screens, you have to get further “off of center” to see a real shift in color, holding the phone 30 degrees or more off of dead on. But it is still there. For people who share their phone’s screen or use it at odd angles a lot, it will be noticeable. On some phones, OLEDs go super blue. On the iPhone X it’s more of a slight blue shift with a reduction in saturation and dynamic range. It’s not terrible, but it definitely exists."
year_published = 2017
