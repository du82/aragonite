["https://daringfireball.net/2011/11/getting_steve_jobs_wrong"]
title = "Daring Fireball: Getting Steve Jobs Wrong"
description = "On Malcolm Gladwell’s argument that Jobs was a “tweaker” and not a “large-scale innovator”."
full_description = "Exhibit A in the case against Walter Isaacson’s flawed Jobs biography: Malcolm Gladwell in last week’s New Yorker, arguing that Jobs was “a tweaker”: In 1779, Samuel Crompton, a retiring genius from Lancashire, invented the spinning mule, which made possible the mechanization of cotton manufacture. Yet England’s real advantage was that it had Henry Stones, of Horwich, who added metal rollers to the mule; and James Hargreaves, of Tottington, who figured out how to smooth the acceleration and deceleration of the spinning wheel; and William Kelly, of Glasgow, who worked out how to add water power to the draw stroke; and John Kennedy, of Manchester, who adapted the wheel to turn out fine counts; and, finally, Richard Roberts, also of Manchester, a master of precision machine tooling — and the tweaker’s tweaker. He created the “automatic” spinning mule: an exacting, high-speed, reliable rethinking of Crompton’s original creation. Such men, the economists argue, provided the “micro inventions necessary to make macro inventions highly productive and remunerative.” Jobs was neither. These men make for a poor comparison to Jobs because Jobs didn’t really “invent” anything — not in the sense that Industrial Revolution inventors did. Jobs understood technology but was not an engineer. He had profoundly exquisite taste but was not a designer. What it was that Jobs actually did is much of the mystery of his life and his work, and Isaacson, frustratingly, had seemingly little interest in that, or any recognition that there even was any sort of mystery as to just what Jobs’s gifts really were. Gladwell, alas, takes Isaacson’s portrait of Jobs at face value: In the eulogies that followed Jobs’s death, last month, he was repeatedly referred to as a large-scale visionary and inventor. But Isaacson’s biography suggests that he was much more of a tweaker. He borrowed the characteristic features of the Macintosh — the mouse and the icons on the screen — from the engineers at Xerox PARC, after his famous visit there, in 1979. The first portable digital music players came out in 1996. Apple introduced the iPod, in 2001, because Jobs looked at the existing music players on the market and concluded that they “truly sucked.” Smart phones started coming out in the nineteen-nineties. Jobs introduced the iPhone in 2007, more than a decade later, because, Isaacson writes, “he had noticed something odd about the cell phones on the market: They all stank, just like portable music players used to.”"
year_published = 2011
clearnet = "https://daringfireball.net/2011/11/getting_steve_jobs_wrong"
