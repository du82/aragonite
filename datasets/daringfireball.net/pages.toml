["https://daringfireball.net/projects/csschecker"]
title = "Daring Fireball: CSS Syntax Checker for BBEdit and TextWrangler"
full_description = "The CSS Syntax Checker for BBEdit and TextWrangler is a combination of Perl and AppleScript that allows you to syntax-check CSS files using the W3C’s CSS Validation Service. Errors and warnings from the validation service are displayed in a results browser, very similar in effect to BBEdit’s built-in HTML syntax checker. These scripts require Mac OS X 10.3.9 or later, and have been tested against BBEdit 8.2.3 and TextWrangler 2.1. It might work with BBEdit 7 as well. Both scripts are essential. The easiest way to install these scripts is to put both of them in your BBEdit or TextWrangler scripts folder: Technically, this “Scripts” folder is intended just for AppleScripts (to be truly pedantic, it’s intended for OSA scripts). However, it’s harmless to store the Perl script here (it won’t show up in your Scripts menu), and the AppleScript assumes the Perl script is in the same folder as itself. Open a CSS file and choose “CSS Syntax Check” from the Scripts menu. It will probably take a second or two to run. If there are no errors or warnings, you should get a new 10.4-style “display alert” dialog saying so. If there are any errors or warnings, you should get a results browser showing the errors and warnings. If you run it against an HTML document, it will perform a CSS syntax check against the contents of the first <style>...</style> tag pair in the document. In other words, even if your CSS isn’t in a standalone CSS file, you can still syntax-check it with this script. This is quite handy for developers who use inline CSS during development to avoid browser caching issues. For extra fun, you can make an alias to the “CSS Syntax Check” script and place it (the alias) in your BBEdit Menu Scripts folder. Name the alias “Check•Document Syntax” (that’s an Option-8 bullet). The alias should end up here: After you’ve done this, you should now be able to invoke the CSS syntax checker using the Markup -> Check -> Document Syntax command, the same one used for checking HTML documents."
