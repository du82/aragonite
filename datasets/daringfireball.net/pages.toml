["https://daringfireball.net/projects/bbcolors"]
title = "Daring Fireball: BBColors"
full_description = "BBColors is a free command-line tool for saving and loading text color preference schemes for BBEdit and TextWrangler. Copy “bbcolors” to some location in your shell’s PATH; a typical location would be /usr/local/bin/ or /usr/bin/. bbcolors is a hack that works by diddling with BBEdit’s preferences; as such, I strongly recommend that you make a backup of your com.barebones.bbedit.plist file in your Preferences folder before using it. To load the text colors from the set named “My Other Great Colors”, replacing your current BBEdit text color preferences, but leaving all of your other BBEdit preferences alone, type: Because bbcolors does its thing by diddling with BBEdit’s preferences using the defaults system, colors can only be loaded when BBEdit (or TextWrangler) is not running. Colors may be saved at any time, however. Color schemes are saved as text files in ~/Library/Application Support/BBColors/, using the file name extension “.bbcolors”. So, a color scheme named “My Great Colors” will be saved as a text file at: These files can be shared with others. To “install” a color set file, simply copy it to your ~/Library/Application Support/BBColors/ folder. Lines starting with “//” (two slashes) are treated as comments. This is useful for adding your name and other information to files you intend to share with others. Comments are only supported at the beginning of lines. Backslashes and double-quotes in the name of a key (or value, in theory, but none of these keys should have values that contain either of these characters) must be escaped with a backslash. I’ve created a simple codeless language module for BBColors color scheme files: BBColors_Scheme_CLM.zip. This language module will only work in BBEdit 8.5 and later."
