["https://daringfireball.net/2002/10/exposed"]
title = "Daring Fireball: Exposed"
description = "That’s not to say CEO arrogance isn’t at the root of this Macworld Boston fiasco. It’s just that Jobs isn’t the arrogant CEO to blame; IDG chief Charlie Greco is..."
full_description = "There seems to be a lot of confusion over the IDG-Apple Macworld Expo spat. Many people seem confused about why this happened. Why would Apple pull out of a major trade show that is dedicated to their company and its products, and which generates a ton of press for any announcements they make? Why would IDG forge ahead with plans to move the summer show back to Boston, without making sure Apple would agree to come along? Most people seem to think the Expos are a win-win for both Apple and IDG: Apple gets lots of press coverage, IDG gets a headline act. But it’s not that simple, at least from Apple’s perspective. A few reasons why the Macworld Expos are a pain in Apple’s ass: They’re expensive. Most estimates I’ve seen put the grand total at well over $10 million per show. It could be more, but the exact cost doesn’t really matter. Suffice it to say, Apple pays a lot of fucking money for these shows. Timing. Every six months, there is a Macworld Expo. (Well, at least there was.) That means every January, and every July, Jobs delivers a keynote, and at each of these keynotes, the Mac community expects to hear about Great New Things. This is doubly troublesome for Apple. For one thing, people have learned not to buy new Macs during the month before each Expo, because there’s a decent chance that something brand new is going to be announced at the upcoming keynote. Obviously, that’s not good for sales. Worse, however, is that the schedule for keynotes is set in stone: January and July. The schedule for new products, however, is unpredictable. It would be much better for Apple if they could simply announce new products — especially major new product lines — when they’re ready to sell them. The January show in particular is badly timed. December is prime holiday buying season, but many Mac users are wary of buying new hardware so close to the San Francisco Expo. Control. Contrary to widespread belief, Apple does not run the Expos. (As of this week, of course, this belief is probably no longer widely held.) Effectively, Apple is just another exhibitor. They just happen to rent an acre of floor space (expensive), pay for a ton of signage (expensive), and man the floor with a bunch of their employees (expensive). Their CEO also just happens to get invited to deliver the keynote at every single Expo."
year_published = 2002
clearnet = "https://daringfireball.net/2002/10/exposed"
