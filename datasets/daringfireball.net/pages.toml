["https://daringfireball.net/2011/11/fun_with_numbers"]
title = "Daring Fireball: Fun With Numbers"
description = "Tablet market share numbers sure do look different when you don’t count any of the tablets that people are actually buying."
full_description = "Yesterday the NPD Group issued a report on U.S. tablet sales in the U.S., from January through October of 2011. Worth noting up front is that the numbers in this report are about sales — actual tablets sold to actual customers — not “shipments” from the factory to stores and warehouses. Much-reported on is that second-place went to HP, after its fire sale on the discontinued TouchPad. What hasn’t gotten much commentary is the extraordinarily contorted way that NPD reported these numbers. U.S. tablet sales, excluding iPad sales, soared to more than 1.2 million units sold from January through October and brought in $415 million in revenue at retail, according to leading market research company The NPD Group’s monthly Connected Handhelds Report. “If you look at the tablet market without Apple there are a number of high-profile brands vying for that number two spot,” said Stephen Baker, vice president of industry analysis at NPD. “According to NPD’s Consumer Tracking Service, 76 percent of consumers who purchased a non-Apple tablet didn’t even consider the iPad, an indication that a large group of consumers are looking for alternatives, and an opportunity for the rest of the market to grow their business.” “A large group of consumers”. Keep that in mind. They then report the results with the following table: What makes this whole presentation so contorted is the notion of “non-Apple tablets” as a separate product category, without any context as to where these tablets stand when the iPad is included. According to Apple’s financial results for the three quarters covered by NPD’s report (Q2, Q3, Q4 2011), 25 million iPads were sold during that period. Apple doesn’t break out sales by region in its quarterly results, alas, so that 25 million number is worldwide, whereas NPD’s report is about the U.S. market. Let’s guess that 10 million of those iPads were sold in the U.S.1 That gives us a table like this: Again, that’s based on a guess that 40 percent of Apple’s worldwide iPad sales were in the U.S. I think that’s a conservative guess. That means Apple sold about 50 times more tablets than “second place” Hewlett Packard."
year_published = 2011
