full_description = "Extraordinary illustrated essay by Marcin Wichary, documenting a typeface — and its long, fascinating, splintered history — that exemplifies the difference between beautiful and pretty. The beauty in Gorton isn’t just in its plainness and hardworking mechanical roots — it’s in the history of the 20th century itself. Gorton became such a part of the world that the bygone world of the previous century imbues how this font makes me feel. Do yourself a favor and read this one in a comfortable chair, with a tasty slow-sipping beverage, on a screen bigger than a phone. Everything about this piece is exemplary and astounding — the writing, the photography, the depths of research. But most of all, Wichary’s clear passion and appreciation. It’s a love letter."
