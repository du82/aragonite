title = "Daring Fireball: As if Anyone Needed Further Proof, Patrick Soon-Shiong’s Los Angeles Times Is Now a Propaganda Rag (and They’re Bad at HTML)"
description = "You can’t see the link or click on it as rendered in a browser, because there’s no content between the opening `<a …>` and closing `</a>` tags, but whoever at the LA Times edited Reinhart’s column to pervert its meaning, did so sloppily, leaving behind at least this one acerbic vestigial link from his originally-submitted prose."
full_description = "As The New Republic reported on Friday, The Los Angeles Times — currently in a race to the bottom with The Washington Post to determine which of the two venerable institutions can sell out to Donald Trump the hardest — found itself in a fresh controversy after contributor Eric Reinhart accused the paper of making significant edits to a piece of his that was largely critical of Robert F. Kennedy, Jr. into one that depicted the president’s pick to run the Department of Health and Human Services with an “optimistic tone,” largely “suggesting that the virulent conspiracy theorist could be an answer and solution to the American public’s bubbling resentment toward the health care industry.” Reinhart exposed the shady goings-on on X (fka Twitter). “Editing out the most urgent point of an OpEd in the minutes before sending to press while then also assigning a title and image that suggest an argument entirely opposite to the author’s clear intent is pretty shitty,” he wrote. In light of this lamentable journalistic malpractice, The New Republic has agreed to run Reinhart’s piece as he intended it to be read. Reinhart’s headline at TNR, encapsulating the intended thrust of his piece: “RFK Jr’s Wrecking Ball Won’t Fix Public Health”, and the closing paragraph of the column: Although RFK, Jr., and Luigi Mangione are both responses to the same underlying problem of US healthcare corruption, there is a major difference between them: one allegedly operated outside the law to kill one person in defense of millions, whereas the other — via his egomaniacal disregard for scientific evidence — seeks to use law itself to inflict preventable death on those millions. The headline the LA Times ran his piece under, after their editing: “Trump’s Healthcare Disruption Could Pay Off — if He Pushes Real Reform”, and its closing paragraphs: Such an approach would shift us away from overreliance on expensive medical treatments and toward public health as it should be: a project by and for the people that makes full use of government resources to empower communities."
