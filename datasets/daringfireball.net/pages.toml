["https://daringfireball.net/linked/2025/01/03/allen-tim-cook-1m-trump-inauguration"]
title = "Daring Fireball: Axios: Tim Cook Donates $1 Million to Trump Inauguration"
description = "Link to: https://www.axios.com/2025/01/03/tim-cook-apple-donate-1-million-trump-inauguration"
full_description = "Apple CEO Tim Cook will personally donate $1 million to President-elect Trump’s inaugural committee, sources with knowledge of the donation tell Axios. [...] Cook, a proud Alabama native, believes the inauguration is a great American tradition, and is donating to the inauguration in the spirit of unity, the sources said. The company is not expected to give. Donald Trump tried to overthrow the legitimate results of the 2020 election to remain in office, and as part of his efforts, inspired a violent mob of insurrectionists to invade the U.S. Capitol and disrupt the peaceful transfer of power. For that reason alone — there are, of course, many others, but to me, Trump’s betrayal of U.S. democracy itself remains paramount — this donation is gross and perverse. But I’m not sure it was feasible not to play ball here. In times like this, realpolitik is the only politics. I wouldn’t have the stomach to make this donation, and those of you disgusted by this likely don’t either. Few people are cut out to be the CEO of a large multinational company like Apple. Sometimes you have to eat the shit sandwich. It seems pretty obvious that it was Apple/Cook that leaked this to Axios, not Trump’s side, given the eye-roll-inducing “proud American tradition” spin, but more especially the nugget that only Cook personally, not Apple as a company, is contributing. That’s Cook asking for any and all ire to be directed at him, personally, not Apple. Good luck with that."
