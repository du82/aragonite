["https://daringfireball.net/linked/2017/07/19/apple-machine-learning-journal"]
title = "Daring Fireball: Apple Machine Learning Journal"
description = "Link to: https://machinelearning.apple.com/"
full_description = "New publication from Apple, where Apple engineers can publish their work and research on machine learning. The writing is more accessible than a peer-reviewed technical journal, but alas (but unsurprisingly for Apple), the articles are un-bylined. The approachability without avoiding nitty-gritty technical details reminds me of Dr. Dobb’s Journal back in the day. My assumption here is that this doesn’t replace publishing in established peer-reviewed journals, but rather acts as a public-facing, more accessible filter for research that Apple engineers publish in peer-reviewed journals — perhaps along with original content at some point. (Also: no RSS feed. Update: There is an RSS feed — the URL just isn’t published anywhere in the HTML. Update 2: The site now has a <link> tag with the URL for the feed so you can just point any feed reader at its home page to discover the feed. Nice.)"
