["https://daringfireball.net/2025/02/the_iphone_16e"]
title = "Daring Fireball: The iPhone 16e"
description = "The iPhone 16e is an iPhone for people who don’t want to think much about their phone. But they *do* want an iPhone, not just any “whatever” phone. A just plain iPhone, with a good screen, good enough (and simple) camera, and great battery life."
full_description = "I’ve spent the last six days using the iPhone 16e, and the experience has been a throwback. In many ways, the iPhone 16e both looks and feels like the modern-day progeny of the early Steve Jobs era iPhones. Early iPhones like the plastic 3G and 3GS, and the glass-back/metal-sides 4 and 4S were simpler offerings. Two colors, black and white. Single-lens inconspicuous cameras. The iPhone 16e feels like their direct descendent. Let’s start with the camera. With just a single lens on the back, the iPhone 16e camera doesn’t just look less conspicuous compared to its dual- and triple-lens brethren, it feels less conspicuous. Especially for me, coming from several years of daily-driving an iPhone Pro model, the 16e feels strikingly smaller in hand and pocket because it lacks the entire “mesa” protrusion from which iPhone 16 and 16 Pro camera lenses further protrude. Apple’s tech specs for iPhone thickness don’t include the camera lenses or camera mesas. Apple just measures and reports the thickness of the flat non-camera part of the phone. But those camera modules and lenses protrude quite a bit. Using a digital caliper, I measured the thickness of the three “levels” of the 16e, regular 16, and 16 Pro: So not only does the 16e completely omit the mesa, but the thickness of the entire camera, from the lens to the front display, is less than the thickness of the iPhone 16 and iPhone 16 Pro at their mesas, not even including their lenses. Just look at this screenshot from Apple’s comparison page, showing all three side-by-side in their black color options: The iPhone 16e looks like a phone with a tiny camera on the back. The iPhone 16 Pro looks like a camera that also happens to be a phone. You can really feel the difference in hand, too — not just the weight, but the balance.1 You can feel that the 16 Pro’s extra camera hardware adds extra weight. Per Apple’s specs, the iPhone 16e weighs 167g; the 16 Pro 199g — a 16 percent difference. (Also take note of a clever touch: Apple’s default wallpapers for each phone subtly suggest how many camera lenses they have.)"
year_published = 2025
clearnet = "https://daringfireball.net/2025/02/the_iphone_16e"
