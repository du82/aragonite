["https://daringfireball.net/linked/2025/02/20/the-name-is-prime-james-bond-prime"]
title = "Daring Fireball: Amazon MGM Studios Takes Creative Control Over James Bond Franchise"
description = "Link to: https://variety.com/2025/film/global/james-bond-amazon-mgm-gain-creative-control-1236313930/"
full_description = "Amazon MGM Studios is set to take creative control of the James Bond franchise. The shock announcement — which is sure to shake and, indeed, stir the industry — was made Thursday, alongside the news that long-time producers and custodians of 007, Michael G. Wilson and Barbara Broccoli, would be stepping back. As per details of the historic agreement, Amazon MGM Studios, Wilson and Broccoli have formed a new joint venture to house the James Bond intellectual property rights. The three parties will remain co-owners of the iconic franchise but Amazon MGM will have creative control. The villains in Bond stories are often bald billionaire industrialists who either build rockets or own media companies, with lasciviously-dressed women on their arms. It’s hard to imagine how we could come closer to a real-life Bond villain taking control of the franchise. (At least it wasn’t Musk.) “Nepo babies” is a term that tends only to be used pejoratively, but family ownership is a proven model to nurture and maintain — to protect — exceptional companies with exceptional cultures. Berkshire Hathaway owns several where their agreements not only allowed, but encouraged, the families to maintain control post-acquisition. See’s Candies comes to mind. This letter from Warren Buffet describes their strategy. But Berkshire is itself an exceptional company. Most corporate conglomerate acquisitions of creator/family-run endeavors wreak devastation upon everything that made those smaller operations unique and special. Look at what’s happened to The Washington Post now that Bezos owns it. There’s much to complain about The New York Times in general, and current publisher A.G. Sulzberger in particular (sixth generation of family control since Adolph Ochs bought the paper in 1896), but The Times is still The Times. Heretofore, Barbara Broccoli did that with the 007 franchise. The output was uneven under her and Wilson’s producing stewardship, but the Daniel Craig era was a splendid return to form. There’s no other movie franchise like it. The closest is Mission Impossible but that franchise is a distant second place, in my mind. It lacks a certain magic, a timeless but yet somehow always modern je ne sais quoi of the 007 franchise. Always the same, but somehow always fresh."
year_published = 2025
