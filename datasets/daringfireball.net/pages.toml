["https://daringfireball.net/2024/10/vision_pro_bites_dog"]
title = "Daring Fireball: Vision Pro Bites Dog"
description = "It’s almost as though — hear me out — Apple launched Vision Pro in 2023 for long-term strategic reasons, not with short-term sales in mind."
full_description = "Wayne Ma and Qianer Liu, reporting for The Information (paywalled, alas — here’s Techmeme’s roundup of summaries and regurgitations), “Apple Sharply Scales Back Production of Vision Pro”: Apple has sharply scaled back production of its Vision Pro mixed reality headset since the early summer and could stop making the existing version of the device entirely by year end, according to multiple people directly involved in building components for the device. The move suggests that Apple has enough inventory built up to meet demand for the foreseeable future. It follows Apple’s decision earlier this year to focus on building a model that’s cheaper than the current version — which retails for $3,500 — for possible release by the end of 2025, as The Information has previously reported. [...] Counterpoint Research said Apple sold around 370,000 headsets in the first three quarters of this year and estimates that it will only sell around 50,000 more units by year end. I’ll start by pointing out, just as an example of conventional wisdom, that the Time magazine story I linked to earlier today, about Vision Pros being used by surgeons, flatly described Vision Pro as “a commercial flop”. There’s no question that Vision Pro sales are, by the standards of most Apple products, low. On a unit basis, they’re a rounding error compared to products like the iPhone, iPads, Macs, and AirPods. Apple stopped releasing unit sale numbers for any of its products long ago, but working backwards from iPhone revenue numbers, which Apple does release, most estimates peg iPhone unit sales at around 210–240 million per year. That’s about 600,000 iPhones sold per day. So if we accept Counterpoint’s above-cited estimate for Vision Pro unit sales — which seems about right — that means Apple sells about 1.5× more iPhones on an average day than they’ll sell Vision Pros in the entire year. I find that a useful perspective. But all of this coverage, from The Information’s report on production pausing to Time’s offhand dismissal of Vision Pro as a “commercial flop”, insinuates (in the case of The Information) or just presumes (Time’s case) that Vision Pro sales are significantly lower than Apple expected. The Information doesn’t say that. In fact, their report yesterday goes out of its way not to compare actual sales to expectations — an omission I’ll return to shortly. Nobody compares Vision Pro sales to Apple’s expectations, because seemingly no one outside the company knows how many Vision Pro units Apple expected or hoped to sell. My gut feeling, though, is that Vision Pro sales are, at worst, just a little on the low side of where Apple’s internal expectations were. Most of that gut feeling is simply based on everything that was reported about Vision Pro before it hit the market."
year_published = 2024
clearnet = "https://daringfireball.net/2024/10/vision_pro_bites_dog"
