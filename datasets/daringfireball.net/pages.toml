["https://daringfireball.net/2002/10/valid_rss_091_feeds_from_movable_type"]
title = "Daring Fireball: Valid RSS 0.91 Feeds From Movable Type"
description = "A plug-in and example template for generating valid RSS 0.91 feeds from Movable Type..."
full_description = "So, of course, I immediately ran Daring Fireball’s RSS feed through the validator. There were three errors. I shouldn’t have taken this personally, because my RSS feed was automatically generated by Movable Type’s default RSS 0.91 template, but take it personally I did. My HTML validates, my CSS validates, so damn it, my RSS ought to validate. The RSS Validator even helpfully (and correctly) guessed that my RSS was being generated by Movable Type, and offered suggestions for fixing it. However, its suggestion for fixing a Movable Type RSS 0.91 template is to use an RSS 2.0 template instead. That doesn’t help if you really want to stick with 0.91. All things considered, I like RSS 0.91 because it is really, really simple; RSS 1.0 and 2.0 are not. So, I decided to fix my RSS 0.91 template so that my feed would validate. The main problem was with the date format. According to the RSS 0.91 spec, date strings should conform with RFC 822. RFC-822 dates shouldn’t be hard to generate. One thing that’s very nice about RFC-822 dates is that they’re very much human readable. Here’s an example: Alternatively, in lieu of specifying the abbreviation for the time zone, you can specify an offset from Universal Time (a.k.a. Greenwich Mean Time): If this format looks familiar, that’s because it’s the format for Date: headers in email messages. The “Mon, 21 Oct 2002 14:04:23” part is easy to output from Movable Type, using this template tag: The problem is the time zone offset. Movable Type’s built-in <MTBlogTimeZone> tag outputs the offset, but it includes a colon between the hour and minute: So, I whipped up a tiny MT plug-in which creates a new template tag, <MTrfc822BlogTimeZone>, which spits out timezone offsets without the colon. Thus, after installing the plug-in, the following template code produces a valid RFC-822 date string that passes through the RSS Validator: Download the plug-in: rfc822BlogTimeZone_1.0.zip (3.2 KB). Installation instructions and further details are included."
