["https://daringfireball.net/2024/11/regarding_and_well_against_substack"]
title = "Daring Fireball: Regarding — and, Well, Against — Substack"
description = "My advice to any writer looking to start a new site based on the newsletter model would be to consider Substack *last*, not first."
full_description = "We constrain our imaginations when we subordinate our creations to names owned by fascist tycoons. Imagine the author of a book telling people to “read my Amazon”. A great director trying to promote their film by saying “click on my Max”. That’s how much they’ve pickled your brain when you refer to your own work and your own voice within the context of their walled garden. There is no such thing as “my Substack”, there is only your writing, and a forever fight against the world of pure enshittification. I am upset by the above, but only insofar as I’m jealous that I had never thought to make the analogy to an author telling people to “read my Amazon”. A publication on Substack is no more “a Substack” than a blog on WordPress is “a WordPress”. It’s really quite a nifty — but devious — trick that Substack has pulled to make this parlance a thing. Substack is, just as a reminder, a political project made by extremists with a goal of normalizing a radical, hateful agenda by co-opting well-intentioned creators’ work in service of cross-promoting attacks on the vulnerable. You don’t have to take my word for it; Substack’s CEO explicitly said they won’t ban someone who is explicitly spouting hate, and when confronted with the rampant white supremacist propaganda that they are profiting from on their site, they took down... four of the Nazis. Four. There are countless more now, and they want to use your email newsletter to cross-promote that content and legitimize it. Nobody can ban the hateful content site if your nice little newsletter is on there, too, and your musings for your subscribers are all the cover they need. I know quite a few people whose opinions I admire who feel the same way as Dash here. I’ll disagree. I think Substack sees itself as a publishing tool and platform. They’re not here to promote any particular side. It makes no more sense for them to refuse to publish someone for being too right-wing than it would for WordPress or Medium or, say, GitHub or YouTube. Substack, I think, sees itself like that."
year_published = 2020
