["https://daringfireball.net/2002/09/on_joel_on_software"]
title = "Daring Fireball: On Joel on Software"
description = '''
In fact, I think Spolsky is wrong about nearly everything in his
article. (Dave Winer <a href="http://scriptingnews.userland.com/backissues/2002/09/20#morningCoffeeNotes">theorizes</a> that Spolsky is being purposefully
inflammatory, so that suckers like me will link to him. I don’t doubt this, but I still feel the need to refute Spolsky’s argument.)'''
full_description = "Last week, Joel “Joel On Software” Spolsky wrote an article arguing that there’s not much of a business case for developing Mac software. Not surprising, given that his company only develops for Windows, and that Mr. Spolsky formerly worked for Microsoft developing Windows software. His argument boils down to something like this: there are around 25 times more Windows users than Mac users; thus, the only reason you should develop for the Mac is if you think a Mac version of your software will be 25 times more popular on the Mac than Windows. That the Daring Fireball disagrees goes without saying. Brent Simmons took the bait and responded, politely. Mr. Simmons, of course, is the developer of the red-hot, just-out-of-beta NetNewsWire Lite. Many of you know exactly what NetNewsWire is, given the number of times it is showing up in Daring Fireball’s referrer logs. For those of you who don’t know, it’s an RSS news reader, which means it allows you to subscribe to web sites that publish RSS feeds. Notably, NetNewsWire is written using Cocoa, and thus is only for Mac OS X. Spolsky only seems to be debating whether professional developers should write for the Mac in addition to Windows; that a serious developer might ignore Windows and write only for the Mac is apparently inconceivable. Simmons’s defense is insightful, elegant, and passionate; I disagree with but a single sentence: the one in which he writes, “I don’t think Joel is wrong about anything he says.” In fact, I think Spolsky is wrong about nearly everything in his article. (Dave Winer theorizes that Spolsky is being purposefully inflammatory, so that suckers like me will link to him. I don’t doubt this, but I still feel the need to refute Spolsky’s argument.) Let’s start with this nugget: Developing for the Mac is not a whole lot different than creating a web site that only works on Netscape. (Given the market share of Macs (about 3.5%) and the market share of Netscape (about 3.4%), that is not a silly comparison.)"
year_published = 2002
clearnet = "https://daringfireball.net/2002/09/on_joel_on_software"
