["https://daringfireball.net/2002/11/that_finder_thing"]
title = "Daring Fireball: That Finder Thing"
description = "An exhaustive (and exhausting) diatribe against the OS X Finder."
full_description = "Someone should be sitting down with the OS 9 and OS X Finders, trying everything they can think of, comparing behavior, and keeping consistency where appropriate, and filing bugs. Better yet, that someone should have been the programmers implementing the OS X Finder in the first place. For example, that it took until Mac OS X 10.2 for “replace all” to be an option in the Finder, though still not keyboard-accessible, when it was both easily keyboard-accessible and the default in Mac OS 9, is inexcusable. Who do they think has the patience to sit and click “Replace” repeatedly as the progress window resizes itself over and over again? That’s the essence of my complaint: either the people who write the Finder at Apple have an incredibly high tolerance for flaky software, they don’t use it at all, or are placed under pressure from management such that they don’t have a chance to deliver quality software. Anything I write - for my own use, even - I would fix if it were as broken as the Finder is, and if it were heading for use by potentially millions of users, I’d feel incredibly guilty to subject them to such garbage. It’s my guess that the OS X Finder was designed and implemented by former NeXT engineers who neither used (nor liked) the original Finder nor understand the needs of Mac users who do. The problem described by Mr. Riley above is just one of many examples supporting my theory: when you copy or move a bunch of files that are going to replace other files with the same names, pre-Jaguar versions of the OS X Finder required you to click a Replace button for each file, even if there were hundreds of them. Ridiculous. The Finder is emblematic of everything wrong with Mac OS X. In the years leading up to the initial release of Mac OS X, Mac users only asked for two things from Apple’s next generation operating system: When I talk about changes to the UI, I’m not referring to the cosmetic changes brought about by Aqua. I’m talking about fundamental changes — not just how it looks, but how it works. A minor example is the relocation of the zoom and minimize buttons in window title bars. That’s just change for change’s sake, and it disregards the expectations and habits of long-term Mac users for no good reason."
year_published = 2002
