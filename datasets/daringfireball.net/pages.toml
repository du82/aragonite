["https://daringfireball.net/linked/2025/02/19/humane-faq"]
title = "Daring Fireball: When 'FAQ' Stands for 'Fucking Angry Questions'"
description = "Link to: https://support.humane.com/hc/en-us/articles/34243204841997-Ai-Pin-Consumers-FAQ"
full_description = "From Humane’s “AI Pin Consumers FAQ”, which they link to with one of the best euphemisms of the year thus far — “We understand this transition may be difficult, and you may have questions”: This was a $700 purchase (for the matte black base model — polished metal ones were $800) with a mandatory $24/month service charge (which included cellular networking) and extra battery “boosters” were $70. Customers who bought when it launched last April have spent at least $1,000, but probably more, all told. Humane gave them 10 days notice before the thing turns into a brick. Refunds are only available for customers who are still within the 90-day return window from their original shipment date. You are eligible to receive a refund if your product shipped on or after November 15th, 2024. All device shipments prior to November 15th, 2024 are not eligible for refunds. All refunds must be submitted by February 27th, 2025. No. Once the service is discontinued, your Ai Pin will no longer function as a cellular device or connect to Humane’s servers. This means no calls, texts, or data usage will be possible. [...] Yes. After February 28, 2025, Ai Pin will still allow for offline features like battery level, etc., but will not include any function that requires cloud connectivity like voice interactions, AI responses, and .Center access. You can check the battery of a device that no longer offers any useful functionality. I get it, companies go bust, and when they go bust, their services go bust with them. But this is exactly the sort of outcome that made Humane’s AI Pin seem more like a scam than a product all along."
