["https://daringfireball.net/2025/02/thoughts_and_observations_on_todays_iphone_16e_announcement"]
title = "Daring Fireball: Thoughts and Observations on Today’s iPhone 16e Announcement"
description = "The iPhone 16e is arguably just plain a better phone than the iPhone 15, and I think it’s almost inarguably a better value at $100 less."
full_description = "Last week Tim Cook teased a “newest member of the family” product announcement coming today; turns out it was the iPhone 16e, a device whose name briefly paralyzed me with indecision regarding how to capitalize it,1 which replaces the three-year-old iPhone SE (3rd generation) in the lineup. Apple made the announcement in a 13-minute video that is currently atop their home page, but seemingly only perma-linkable at YouTube. (Maybe this?) It was also, of course, announced in a press release on Apple Newsroom. The first three minutes of the video feature Tim Cook (talking about how great iPhones are, the iPhones 16 in particular, and Apple Intelligence). Cook hands things off to iPhone product marketing VP Kaiann Drance for the next five minutes; Drance mostly recaps iOS 18’s tentpole features, especially, of course, Apple Intelligence. Drance hands off to keynote first-timer (I think) Lucy Browning, a director of iPhone product design, who talks up the 16e specifics. The most unusual thing about the video is its setting: not Apple Park, not the Steve Jobs Theater, but the infinite white void, where, in a bygone era, Apple TV commercials like the famed Hodgman/Long “I’m a Mac / I’m a PC” series were set. (The new infinite void is arguably light gray, not white.) First, the name. It’s not the fourth-generation iPhone SE, and instead sports an altogether new “e” suffix. Apple has used an “S” suffix with the iPhones 4S, 5S, 6S, and XS; “C” with the iPhone 5C, and “R” with the XR. We shall see if this “e” is a one-off. In an online press briefing today, when asked whether the “e” stands for anything, an Apple rep said no, it does not stand for anything, but that it’s built for everyone. I don’t think she meant to imply that the “e” secretly stands for everyone, if only because I’m pretty sure Apple doesn’t want everyone buying the lowest-price iPhone model. Apple never had an explanation for the “SE” name either, although in my head I’ve already read that as maybe sorta kinda standing for special edition? Way back in the day, I think Phil Schiller once said the “S” in “iPhone 3GS” stood for speed, because the 3GS was in fact strikingly faster than the prior year’s 3G, and the “C” in “iPhone 5C” definitely, if unofficially, stood for color. But it’s best not to waste too much time trying to find any logic to this other than that Apple thinks “iPhone 16e” looks and sounds cool. I’m just glad it’s not the “iPhone 16 AI”."
year_published = 2025
