["https://daringfireball.net/2010/12/future_of_the_mac_in_an_ios_world"]
title = "Daring Fireball: The Future of the Mac in an iOS World"
description = "It’s the heaviness of the Mac that allows iOS to remain light."
full_description = "There’s a certain “Be careful what you wish for, you just might get it” aspect to the current Mac renaissance. After more than a decade of stagnant market share, the Mac is thriving. Apple used to sell about 1 million Macs every fiscal quarter. Now it sells three times that many, and it’s getting close to four. The longtime lament of the Mac enthusiast — Why don’t more people who are unhappy with Windows PCs switch to the Mac? — has been answered. They are switching, in droves. Quarter after quarter, Apple reports that over half of all Mac sales in the company’s retail stores are to first-time Mac buyers. This sort of renaissance is rare. When markets are new, they tend to be fluid. But when they’re old, they’re settled — and a decade ago, the personal computer market seemed settled. But at some point about five years ago, that changed, and the Mac has seen year after year of consistent industry-leading growth. The irony is that there’s more doubt today about the long-term prospects of the Mac than there has been at any time since Steve Jobs returned to Apple in 1997. Rather than suffering defeat at the hands of a competing platform — like, say, Microsoft Windows — the problem for the Mac today is that it has been overshadowed by its own sibling, the fabulously precocious iOS. There are more iOS users and developers than Mac ones. For all the aforementioned growth in Mac sales — remarkable by any measure, but especially so for a 25-year-old platform — the iPad, just six months old, is already outselling the Mac. Here’s the short version of the “Mac is doomed” scenario: iOS is the future, Mac OS X is the past, and Apple, unlike most major tech companies, is strongly inclined to abandon the past in the name of the future. You can’t really argue with that, can you? But the premise that the end is near for the Mac presupposes quite a bit about the near-term future of iOS. Apple’s cultural aversion to legacy technology isn’t about a lack of seriousness, or a short companywide attention span. It’s not about being attracted only to the new and shiny. It’s about fear — the fear of being weighed down by excess baggage. Fear that old stuff will slow them down in their pursuit of creating brand-new stuff."
year_published = 2010
