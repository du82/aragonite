title = "The Talk Show ✪: Ep. 108, With Guest Ben Thompson"
full_description = "Topics include Apple’s pseudo “sabbaticals” (employees who leave the company but then return after a year or two); Google’s cultural similarities to Microsoft; the ways that Apple (and iOS users) might miss Scott Forstall; accessibility as a high priority for Apple; Instagram’s success (and how they effectively ate Hipstamatic’s lunch); a debate on just how “simple” Twitter is; Box’s successful IPO, and Dropbox’s support for Yosemite’s official Finder integration for such services; MIT economist Jonathan Gruber pissing in my Google juice; Chromebooks; Amazon’s overall strategy, and the colossal failure of their Fire Phone; and, lastly, a good chunk on Microsoft’s Windows 10/HoloLens event last week."
