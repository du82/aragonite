["https://daringfireball.net/2002/10/microsofts_answer_to_ellen_feiss"]
title = "Daring Fireball: Microsoft’s Answer to Ellen Feiss"
description = '''
<p>
A few days ago, Microsoft posted <a href="http://www.microsoft.com/insider/opsystems/windowsxp_setup.asp">this happy tale</a> of a Mac user who switched to Windows XP. I share MacInTouch’s suspicion that the article is apocryphal. Most obviously, despite the fact that the article is written in the first person, there is no byline. But the details don’t ring true either. It’s quite bizarre...
</p>'''
full_description = '[Update: Microsoft removed the “Switcher” article from their web site after it became obvious that it was made up. Slashdot picked up the story, and one of their readers found the author’s photo in a stock picture archive. Dave Winer has the story too, including this link to the original article in Google’s cache. It looks to me as though all the testimonials on Microsoft’s “Insider” sub-site are made up, so I’m not sure why they’ve only removed the “Switcher” article.] A few days ago, Microsoft posted this happy tale of a Mac user who switched to Windows XP. (Link thanks to MacInTouch, which sadly still doesn’t offer permalinks.) I share MacInTouch’s suspicion that the article is apocryphal. Most obviously, despite the fact that the article is written in the first person, there is no byline. But the details don’t ring true either. It’s quite bizarre. Take this line, for example: I can read my files, import e-mail addresses from my Palm* to the Microsoft Outlook® messaging and collaboration client, and keep my Web favorites. Does anyone outside of Microsoft’s tin-eared marketing department describe Outlook as a “messaging and collaboration client”? There’s a much greater choice of portable computers and features, for less money, on the Windows platform. My laptop came with 512 MB of RAM, a 15” screen, a DVD player, and Windows XP Home Edition preinstalled, for $450 less than a comparable iBook. My recommendation is to go straight to Windows XP Professional; the extra features for mobile users are worth it. Two points, here. First, you can’t do a price comparison of a laptop loaded with XP Home Edition, then recommend XP Professional (which costs more). Second, it’s easy for this switcher to claim she found a comparable laptop for $450 less, but it’s a lot harder to actually find such a machine in the real world. I just priced a Dell Inspiron, with the same RAM (256 MB), screen (14"), and disk size (30 GB) as a stock 14" iBook, and the Dell machine came out $50 cheaper ($1,750 vs. $1,799). Can you get a PC for less money than a Mac? Sure. But especially in portables, Apple’s prices are extremely competitive for comparable machines.'
year_published = 2002
clearnet = "https://daringfireball.net/2002/10/microsofts_answer_to_ellen_feiss"
