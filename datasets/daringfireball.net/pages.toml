["https://daringfireball.net/2008/04/firefox_3_safari_3"]
title = "Daring Fireball: Firefox 3 vs. Safari 3"
description = "Competition in the Mac web browser space is strong and getting stronger. Firefox isn’t just a great web browser, but it’s a pretty good *Mac* web browser, too."
full_description = "After a few weeks in the arms of Firefox 3 betas, I’ve returned to Safari as my daily browser. Unsurprisingly, it’s the interface that drove me back. But I’m not talking about cosmetic issues — or at least not only about cosmetic issues. The new default theme for Firefox theme looks pretty good, especially when you switch the toolbar icons to the small size. The Safari-style “GrApple” Firefox themes I linked to last month makes Firefox 3 look even better, albeit mostly by mimicking Safari. But cosmetic appeal is just the surface. Steve Jobs, in a 2003 New York Times magazine interview, said: “Most people make the mistake of thinking design is what it looks like. People think it’s this veneer — that the designers are handed this box and told, ‘Make it look good!’ That’s not what we think design is. It’s not just what it looks like and feels like. Design is how it works.” And that’s just it. Firefox 3’s shortcomings as a Mac app are behavioral, too. The main issues that drove me back to Safari: Background Window Appearance — Starting with Leopard, standard application windows follow a simple, consistent rule: the frontmost window of the current application gets a medium gray color while all other windows have a lighter, flatter look. The idea is that with several windows visible at once, giving the active one a darker look makes it easier to pick out visually. (One of the long-standing gripes regarding the late brushed metal theme — Christ, remember that ugly thing? — was that its windows barely changed appearance when switching from active to inactive.) Firefox 3 doesn’t do this. Its windows all have the darker “active” look even when in the background. And I believe that its theming mechanism does not allow for it. Text Editing Shortcuts — Firefox 3 still doesn’t support certain standard Mac text editing key bindings. For example, in a one-line text field, the Up and Down Arrow keys should move the insertion point to the beginning and end of the line, respectively. Drives me nuts."
year_published = 2008
