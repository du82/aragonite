["https://daringfireball.net/2013/09/more_on_nintendo"]
title = "Daring Fireball: More on Nintendo and Handheld Gaming"
description = "A Nintendo that doesn’t make games for iOS is a Nintendo that doesn’t reach today’s kids; a Nintendo that doesn’t reach today’s kids is a Nintendo with no future."
full_description = "The criticisms levelled against the DS and the Wii were exactly the same ones Gruber now levels against the current Nintendo consoles. But Nintendo is at its best when it doesn’t try to compete with other devices on the market, and often at its worst when it does. Nintendo is not competing on hardware. It’s competing on entertainment value. I’m well aware that throughout Nintendo’s history as a game console maker, it has seldom competed on technical specs — and in fact, has done best when its consoles were cheaper and based on older technology. (Mathis has another follow-up just on this Nintendo philosophy, “Lateral Thinking With Withered Technology”.) So, yes, the original Game Boy, equipped with a monochrome display, destroyed its color-screen competition. The standard-definition Wii outsold the PS3 and Xbox 360. The 3DS is outselling the far more capable PlayStation Vita. What’s different about the post-iPhone world of mobile computing is that the buying decision is no longer about or, it’s about and. Pre-iPhone, someone interested in a handheld game device would choose between Nintendo’s offering or someone else’s. Nintendo did well in that world, selling more than enough devices to succeed. Today, though, someone deciding to buy a dedicated handheld game device is, more likely than not, deciding whether to buy something to carry in addition to the mobile device they already carry everywhere. This is an entirely new scenario for Nintendo, and as I see it, they are on course to head right over a cliff. It’s like the Hemingway line on going bankrupt: “How did you go bankrupt?” Bill asked. “Two ways,” Mike said. “Gradually and then suddenly.” The irony, perhaps, is that in a way, the iPhone and iPad are pulling a “lateral thinking” move on dedicated gaming devices like Nintendo’s DS lineup. As stated before, Nintendo has succeeded not just despite the fact that its hardware has traditionally lagged that of its competition technically, but because of it. “Lateral thinking with withered technology” allowed their hardware to be cheaper and thus accessible to more people."
year_published = 2013
clearnet = "https://daringfireball.net/2013/09/more_on_nintendo"
