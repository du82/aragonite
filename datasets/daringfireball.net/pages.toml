title = "Daring Fireball: Email"
full_description = '''I encourage you to send me your comments regarding Daring Fireball. Unfortunately, I am at times a lousy correspondent — where by “at times” I mean “most of the time”. If I don’t respond to your email, or do so only after an inordinate amount of time has passed, please don’t take it personally. If you use Twitter, a good way to comment on Daring Fireball posts is was by mentioning either @gruber or @daringfireball on Twitter. Update January 2023: Twitter mentions no longer work for my account, but Mastodon is the new Twitter, so I recommend you mention (and follow) me there: @[email protected]. I really do read all my Mastodon mentions (and would still read my Twitter mentions, if only Twitter weren’t crumbling). If you don’t use Mastodon, or have remarks you’d prefer not to share in public, feel free to use email. No need to apologize — email is always welcome. //<![CDATA[ function hiveware_enkoder(){var i,j,x,y,x= "x=\"783d22793e237a7e3c2a2a332d6a297375746376742f792c282628296671626474666f" + "763e2c7a7c2a333e2c6a3c6975686f666d2f793d6a3c313e6a297370673c28283e7a3c5d23" + "3a38653863343a333a33333464333a37393333383538343833373638343866333938633338" + "3336333833393336373138323734373438363766373638653463333a3863383a3333346534" + "63333a3763343937353838376637363764376633393864343a376334313465343a37393333" + "386737373763343833383365343a38633433333337343431343434333734343a3433343334" + "33343637343432343734373733343437343435343834363437343637373436373334343737" + "3434373734323437343334373436343734333438343a343734373437343834373436373734" + "3a343734333438343234373435343734313435343434383435343834363737343634373435" + "37373435373734373737343434373436373434333433343437363433343334343736343537" + "34343634373434373734353438343a34373435343834313433343334333434373634353438" + "34363437343637373436373334343737343437373432343734333437343634373433343834" + "3a3437343734373438343734363737343a3437343334383432343734353437343134353434" + "34383435343834363737