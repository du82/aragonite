["https://daringfireball.net/linked/2024/11/26/delicious-library-eol"]
title = "Daring Fireball: The End of the Line for Delicious Library"
description = "Link to: https://mastodon.social/@wjs/113539330521476328"
full_description = "Amazon has shut off the feed that allowed Delicious Library to look up items, unfortunately limiting the app to what users already have (or enter manually). I’ve pulled it from the Mac App Store and shut down the website so nobody accidentally buys a non-functional app. The end of an era, but it’s kind of surprising it was still functional until now. (Shipley has been a full-time engineer at Apple for three years now.) It’s hard to describe just what a sensation Delicious Library was when it debuted, and how influential it was. Delicious Library was simultaneously very useful, in very practical ways, and obsessed with its exuberant UI in ways that served no purpose other than looking cool as shit. It was an app that demanded to be praised just for the way it looked, but also served a purpose that resonated with many users. For about a decade it seemed as though most popular new apps would be designed like Delicious Library. Then Apple dropped iOS 7 in 2013, and now, no apps look like this. Whatever it is that we, as an industry, have lost in the now decade-long trend of iOS 7-style flat design, Delicious Library epitomized it. They were even clever and innovative in the ways they promoted the app. The first time Delicious Monster sponsored Daring Fireball for a week, their sponsorship message read, in its entirety: When they created an iPhone version of Delicious Library, they announced it via this delightfully intricate but decidedly lo-fi stop-motion-animated video. 20 years go by and there’s some inevitable nostalgia looking back at any art form. But man, Delicious Library exemplified an era of indie app development that, sadly, is largely over. And make no bones about it: Delicious Library was a creative work of art."
year_published = 2025
