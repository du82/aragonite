["https://daringfireball.net/2022/09/the_iphones_14_pro"]
title = "Daring Fireball: The iPhones 14 Pro (and iPhones 14)"
description = "There are two super interesting innovations with the iPhone 14 Pro and Pro Max. There aren’t any interesting innovations with the iPhone 14 or 14 Plus — which fact itself is actually pretty interesting, strategically."
full_description = "There are two super interesting innovations with the iPhone 14 Pro and Pro Max. There aren’t any interesting innovations with the iPhone 14 or 14 Plus — which fact itself is actually pretty interesting, strategically. The first super interesting thing about the iPhone 14 Pro models is the most obvious. It’s the feature Apple is highlighting, including putting its name on a title card, in TV commercials that began running last week. It’s the feature every other major phone maker has, I’ll bet, already assigned teams to rip off. The best ideas in any creative field often follow a counterintuitive pattern. The ideas are, in fact, original, highly innovative, and spring from very creative minds. But if well-executed — always a big “if” — once experienced, they seem incredibly obvious. The Dynamic Island is one of those ideas. Not only does the Dynamic Island now strike me as the obvious answer to what should be done with a sensor array cutout in a phone display,1 it’s so cool, so fun, so useful that it feels like an obvious reason why you should have a sensor array cutout in a phone display in the first place. When the iPhone X introduced the notch, there were a lot of people who thought Apple should have hidden it by drawing a black notch-height border across the top of the display. Only a fool would argue that the Dynamic Island would be better off hidden like that. The Dynamic Island feels like a user interface element that deserves to be there, almost exactly as it looks, even if there were no front-facing sensor cutouts. It’s not merely some clever idea to do something useful with the cutout space, it’s an incredibly clever idea for a permanent on-screen UI for live activities, status, certain notifications, and small interactions. The fact that it completely and elegantly disguises the sensor cutout array is just the icing on the cake. It’s like watching expert sleight-of-hand magicians vanish an object. The fact that you know you’re being fooled makes it even more fun. Dynamic Island is a genius idea and Apple has knocked the initial implementation out of the park."
year_published = 2022
year_updated = 2022
