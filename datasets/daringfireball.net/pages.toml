["https://daringfireball.net/2024/09/the_things_they_carried"]
title = "Daring Fireball: The Things They Carried"
description = "Keynotes as a proxy for reflecting on Apple as a whole."
full_description = "Back in July 2007, I contributed this photo to a Flickr group called, self-describingly, “The Items We Carry”: 17 years later, I’ve consolidated. 2007 was so long ago that Field Notes hadn’t yet been created; my back-pocket notebooks are much slimmer now than that hardcover Moleskine.1 Instead of the Leatherman and a ring of four keys, I’m down to just two keys and a Halifax key-sized tool from The James Brand. The keys and Halifax lay flat and fit comfortably in the change pocket of a pair of jeans.2 And while I do own (and very much enjoy) a Ricoh GR IIIx — a modern but very similarly sized descendant of the above camera — I don’t carry it on an everyday basis because iPhone cameras have gotten so good. But there was an everyday carry item I omitted from the above photo — wired earbuds. I don’t remember if I omitted them because I forgot to include them, or if it was for aesthetic reasons. But circa 2007 I generally had a pair of wired Apple earbuds with me. Today, I’ve always got my AirPods Pro — far and away my favorite consolidation. By weight, AirPods (with case) are heavier, but measured by fussiness, they offer a never-tangled fraction of the wired earbuds experience. The remaining items in my pockets are equivalent but upgraded. I’ve got better (and because I no longer wear contact lenses, prescription) sunglasses. I long ago switched from the Pilot G2 to the Zebra Sarasa, a pen I consider nearly perfect. The above Swiss Army watch broke in early 2009, and I’ve since started a small (I swear) collection of mechanical watches. But on most workdays, there’s an Apple Watch on my wrist. iPhone, AirPods, Apple Watch. I’ve almost always got two of them with me, and often all three. I’m sure for many of you reading this, it’s always all three. These are Apple’s three “everyday carry” products. They’re as much a part of our lives as our clothes and glasses and jewelry. They thus go together swimmingly in the same product introduction event."
year_published = 2024
