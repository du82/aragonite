["https://daringfireball.net/2013/09/the_iphone_5s_and_5c"]
title = "Daring Fireball: The iPhone 5S and 5C"
description = "My review of Apple’s new iPhones."
full_description = "On the inside, it’s an iPhone 5, with a few relatively minor upgrades. (To wit: the cellular antenna now supports more LTE bands and faster LTE speeds, and the front-facing FaceTime camera is better.) Otherwise, it’s the same A6 processor, the same iSight camera, the same everything as in the iPhone 5, so far as Apple has claimed and I can tell. I’ve run a few benchmarks (see below), and on each, my 5C review unit scored nearly identically to my personal iPhone 5. And the 5C camera, to my eyes, produces identical results to that of the 5. That is not to say the iPhone 5C is uninteresting. It simply is not interesting in terms of tech specs. Any praise or criticism of the 5C is thus about fashion, branding, and marketing. These are perfectly valid criteria. Fashion and branding are about emotion. The 5S is another engineering triumph for Apple (and no slacker in the fashion/branding game either). The 5C, though, is purely an emotional play — and, I think, a winning one. If Apple had stuck to its playbook from the past few years, the 5C would not exist, and instead, the year-old iPhone 5 would have hung around for another year, at $99 on contract, with 16 GB of storage. Engineering-wise, the afore-noted exceptions aside, they’ve stuck to the old plan. But marketing and branding-wise, they’re in all new territory. The mid-range iPhone model is no longer an afterthought, but instead a full-fledged family member, with its own TV commercials, two storage/pricing tiers (16 GB for $99, 32 GB for $199, on contract), and most importantly, a distinctive new appearance and brand. Apple has made colorful devices before. Other companies have made colorful touchscreen smartphones before. But there’s never been a colorful iPhone before. There is now, and people are noticing. A few times this week I’ve repeated the notion that in marketing, what looks new is new. The technically-minded may well view the 5C as a “rebadged iPhone 5”, but the overwhelming majority of people are not technically-minded, and to them, if it looks like a new iPhone, it is a new phone. To paraphrase Stanley Kubrick, the truth of the iPhone 5C is in the feel of it, not the think of it. Most people make purchasing decisions based as much or more on emotion than logic."
year_published = 2013
