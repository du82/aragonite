["https://daringfireball.net/2014/09/the_iphones_6"]
title = "Daring Fireball: The iPhones 6"
description = "One week with the new iPhone 6 and iPhone 6 Plus."
full_description = "A few days into testing the new iPhone 6 and 6 Plus, I accidentally left my personal iPhone 5S on a desk next to the iPhone 6 Plus. While my back was turned, the Plus tried to eat my 5S. It’s a monster. Last week after the announcement event, Apple provided me with review units of both iPhones 6 (a white/gold regular 6 and a white/silver 6 Plus, both running on Verizon, which allowed me to pop my personal SIM card into both phones for testing). I spent the first three days using the 6 Plus as my full-time phone, and the next three days using the 6. I wish I’d had more time with both phones before writing this, but my high-level take is very simple, and would not change with more time: If you simply want a bigger iPhone, get the 4.7-inch iPhone 6. That’s what it feels like: a bigger iPhone. If you want something bigger than an iPhone, get the 5.5-inch iPhone 6 Plus. It feels more like a new device — a hybrid device class that is bigger than an iPhone but smaller than an iPad Mini — than it feels like a bigger iPhone. If you don’t want a bigger iPhone — and in recent weeks I’ve heard from numerous readers who still pine for the 3.5-inch display iPhones — you might be disappointed by this year’s iPhone lineup, and should consider sticking with the iPhone 5-class models. (Note that Apple is continuing to sell two models of the iPhone 5S: 16 GB for $99, and 32 GB for $149. That 32 GB model to me looks like a hedge on Apple’s part.) The Plus is a remarkable and striking device. Its 401 PPI display is the first display I’ve ever used on which, no matter how close I hold it to my eyes, I can’t perceive the pixels. Typography has rendered great on all retina displays to date; type looks perfect on the iPhone 6 Plus. I’m jealous that the 6 Plus camera has optical image stabilization. The bigger physical size makes the Plus a pleasure to thumb-type on. But I have no desire to use an iPhone 6 Plus as my personal phone. I ordered an iPhone 6 for my own use. And if the iPhone 6 Plus were the only new iPhone this year, I probably would have stuck with the iPhone 5S."
year_published = 2014
year_updated = 2014
