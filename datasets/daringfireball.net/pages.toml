["https://daringfireball.net/2018/10/the_iphone_xr"]
title = "Daring Fireball: The iPhone XR"
description = "It sounds too good to be true, but the XR is almost as good as the XS models at a *far* lower price. Dollar for dollar, the XR is almost certainly the best iPhone Apple has ever made."
full_description = "That’s what everyone has been thinking ever since Apple announced the iPhone XR alongside the XS and XS Max on September 12. Right? The iPhone XR seemingly offers too much of what the XS provides at a significantly lower price. The iPhone XR is everything Apple says it is, and it’s the new iPhone most people should buy. I’ve been using one as my primary phone for the last week, and it’s a lovely, exciting device. Even some of the things I thought were compromises don’t feel like compromises at all in practice. Overall, yes, the XS and XS Max are better devices, but in a few regards the XR is actually better. Let’s start with the price. For the equivalent amount of storage, the iPhone XR costs $250 less than an iPhone XS, and $350 less than an XS Max. But in practical terms, the difference is even more striking than that. 64 GB of storage is a credible baseline — a far cry from just a few years ago when storage started at a criminally meager 16 GB for the iPhones 6S in 2015, and 32 GB for the iPhones 7 in 2016. But the sweet spot for most people in 2018, in my opinion, is one tier above 64 GB. I think my wife is a fairly typical iPhone user. Music, photos, podcasts, games. I just checked and her iPhone is using right around 64 GB of storage. She could actually save about 12 GB if she enabled the Offload Unused Apps feature in iOS. So she could get by with 64 GB, but she’d need at least 128 GB to be comfortable. I think a lot of iPhone users have similar storage needs. But only the iPhone XR offers a 128 GB storage tier, and it’s just $50 more. If you want more than 64 GB with an iPhone XS, you’ve got to pay $150 more than the base price and jump all the way to 256 GB. So in terms of what I would actually recommend for most people — getting the storage tier one level above entry level — the 128 GB iPhone XR costs $350 less than the 256 GB XS and $450 less than the XS Max. People who are looking for some way that iPhone XR purchasers are getting screwed have it backwards. If anyone is getting screwed on pricing, it’s XS and XS Max purchasers, who don’t have the option of buying a 128 GB device for just $50 more than the baseline 64 GB models. You can buy a 256 GB iPhone XR for $100 less than the price of a 64 GB iPhone XS — 4x the storage for $100 less."
year_published = 2018
clearnet = "https://daringfireball.net/2018/10/the_iphone_xr"
