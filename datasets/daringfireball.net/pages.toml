["https://daringfireball.net/2025/02/bootable_mac_startup_drive_backups_and_another_ode_to_superduper"]
title = "Daring Fireball: Bootable Mac Startup Drive Backups, and Another Ode to SuperDuper"
description = "I know how different storage is today — abundant, cheap, reliable — but I still have feelings about my data that are rooted in the distant past."
full_description = "Just a quick post: macOS 15.3 is now out, and with it, a fix for the broken replicator. As such, macOS copying will work again with Erase, Then Copy backups. No update to SuperDuper is necessary (but feel free to install our v3.10 Beta 2, below). [...] Thanks for your patience as we waited for the fix from Apple. I know I’m relieved that I (hopefully) will no longer be bombarded with support because of it! You may recall that this was a bug introduced in MacOS 15.2, which prevented Shirt Pocket’s excellent long-standing utility SuperDuper from making a bootable clone of your startup drive. Great news, bug fixed, hurrah. Back in December, though, when the bug had just started circulating, Mike Bombich, developer of Carbon Copy Cloner (the long-standing also-excellent archrival to SuperDuper), wrote a post that I took to suggest that he thought the bug was not a bug, “Bootable Backups Have Been Deprecated for Several Years”: While some developers seem surprised by a change in macOS 15.2, we’ve known for several years that making bootable backups would eventually become impossible. We shifted CCC’s strategy away from relying on External Boot so our users wouldn’t be affected by this inevitable result. I took a few days off last week to help a family member, and returned to find the Mac community all aflutter with comments about bootable backups not working after the 15.2 update and comparisons of Apple to The Grinch. After reviewing a lot of comments on this subject, I felt it was time to weigh in. Apple is taking a lot of heat for this “bug” in 15.2, but if there is any finger-pointing here, I think it should be directed towards any developers that have misled their users into believing that ASR and “bootable backups” had any place in a backup/recovery strategy post-Big Sur. That feels like some shade thrown toward Nanian and Shirt Pocket, but here we are with MacOS 15.3, and bootable startup drive clones are back, so I have to question who needs to don sunglasses here."
