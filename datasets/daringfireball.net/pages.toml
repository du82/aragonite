["https://daringfireball.net/2020/10/thoughts_and_observations_on_apples_hi_speed_iphone_12_event"]
title = "Daring Fireball: Thoughts and Observations on Apple’s ‘Hi, Speed’ iPhone 12 Event"
description = "The 2020 iPhone lineup."
full_description = "Last month’s “Time Flies” event for the Apple Watch Series 6 and new iPad Air was about an hour long; this week’s “Hi, Speed” event ran just a bit longer at 70 minutes. Perhaps, if 2020 had gone as planned, all of these products would have been announced in one big two-hour event in early September. There’s a lot I miss about in-person events,1 but in terms of dosing the news, I like the digestibility of these shorter, more focused events. There’s more than enough to process considering just the new iPhone 12 models and the dessert course (served before the entrees) of HomePod Mini. So there are four new iPhones this year. Is that confusing? I don’t think so, and if anything is confusing or complicated about this year’s lineup, it’s at the high end, with the camera system differences between the 12 Pro and 12 Pro Max. The addition of a fourth iPhone, the 12 Mini, doesn’t complicate the lineup at all, because its name completely describes everything there is to know about it. Really, the product names tell you how to understand the lineup. The iPhone 12 is the new iPhone — almost certainly the best choice for most people in the market for a new-model-year iPhone. Unless they really want an iPhone that is smaller, in which case they should, with no hesitation, get the iPhone 12 Mini. In terms of features and specs, it’s exactly like the iPhone 12, just smaller. It’s also $100 cheaper — but the reason to buy a 12 Mini is the size, not the price. If a lower price is more meaningful to you than device size, you should probably either get an iPhone 11 or XR and save some money, or, for a smaller device, get an iPhone SE and save a lot of money. Here’s a matrix with the new lineup, organized the way I think makes the most sense. In the bottom row, I compare all storage tiers to 128 GB as a baseline. Storage is priced very consistently this year: across all iPhone models, every 64 GB of additional storage costs $50. I think it’s useful to include last year’s prices for the then-new iPhone 11 lineup for comparison:"
year_published = 2020
