["https://daringfireball.net/2018/10/iphone_xr_review_roundup"]
title = "Daring Fireball: iPhone XR Review Roundup"
description = "Reviewing the reviews."
full_description = "It sounds too good to be true, but the XR is almost as good as the XS models at a far lower price. Dollar for dollar, the XR is almost certainly the best iPhone Apple has ever made. I’ve read over a dozen other reviews of the XR this week, and that’s been the bottom line of every single one of them. It’s a remarkable consensus. There are some interesting differences though. However, I found myself missing the zoom lens a lot. This is absolutely a your mileage may vary scenario, but I take the vast majority of my pictures with the telephoto lens. Looking back at my year with the iPhone X I’d say north of 80% of my pictures were shot with the telephoto, even if they were close ups. I simply prefer the “52mm” equivalent with its nice compression and tight crop. It’s just a better way to shoot than a wide angle — as any photographer or camera company will tell you because that’s the standard (equivalent) lens that all cameras have shipped with for decades. Wide angle lenses were always a kludge in smartphones and it’s only in recent years that we’ve started getting decent telephotos. If I had my choice, I’d default to the tele and have a button to zoom out to the wide angle, that would be much nicer. But with the iPhone XR you’re stuck with the wide — and it’s a single lens at that, without the two different perspectives Apple normally uses to gather its depth data to apply the portrait effect. Nilay Patel, on the other hand, doesn’t miss the telephoto second camera much but instead thinks the LCD display is the biggest compromise compared to the XS iPhones: Those differences are interesting and worth pulling apart, but really, the simplest way to think about the iPhone XR is that it offers virtually the same experience as the iPhone XS for $250 less, but you’ll be looking at a slightly worse display. Look. The display on the iPhone XR is… fine. It’s fine! It has a lower-resolution and pixel density than the OLEDs in new flagship phones like the iPhone XS, Galaxy S9, and Pixel 3, but it’s the same 326 pixels per inch as Apple’s previous non-Plus LCD iPhones. Anyone coming to this phone from any iPhone, save the iPhone X, will not notice a huge discrepancy in resolution. I suspect most people will find it totally acceptable."
year_published = 2018
