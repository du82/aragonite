["https://daringfireball.net/2017/12/the_iphone_x"]
title = "Daring Fireball: The iPhone X"
description = "The iPhone X is a triumph, a delightful conceptual modernization of a ten-year-old platform that, prior to using the iPhone X, I didn’t think needed a modernization."
full_description = "The more popular a computer platform becomes, the more of a bind in which it inevitably finds itself. A platform is only “finished” when it is abandoned. It needs to evolve to remain relevant, but it’s difficult to change in unfamiliar ways without angering the base of active users. Adding new features on top of the familiar foundation only gets you so far — eventually things grow too complex, especially when what’s needed now is in conflict with a design decision that made sense a decade (or more) prior. Eventually, inevitably, incremental improvements paint a platform into a corner. Something has to give. This happened to the classic Mac OS in the mid-90s, when certain technical constraints of the OS made the platform seem anachronistic. The classic Mac OS had no protected memory and used cooperative, rather than preemptive, multitasking. No protected memory meant that every process on the system could read and write anywhere in RAM — both the memory of other processes and the memory of the OS itself. Cooperative multitasking meant that each app decided when to give up the CPU to other processes. If an app wanted to use the entire CPU, it could. In a sense, from today’s perspective, the original Mac was effectively just one process, and apps were more akin to plugins running within that process. In 1984, these were utterly reasonable design decisions. Protected memory, pre-emptive multitasking, and a powerful OS kernel just weren’t feasible on a computer with an 8 Mhz CPU and 128 kilobytes (kilobytes!) of RAM. In fact, there was no multitasking at all on the original Mac until Andy Hertzfeld released Switcher in April 1985 — the forerunner of MultiFinder.1 The problem mid-90s Apple faced is that the Mac was popular because of its thriving library of excellent third-party software, but in trouble because of the creakiness of its underlying OS. But Apple couldn’t truly modernize the OS without breaking the application software — which is exactly what happened with Mac OS X. Old software ran in a virtual “Classic” environment — essentially, a virtualized version of the old classic Mac OS running within the modern Mac OS X. New software — apps that took advantage of Mac OS X’s modern APIs, new features, and new look-and-feel — needed to be written using different (Cocoa) or updated (Carbon) APIs. The transition worked, as evidenced by the Mac’s continued success today, but it took years — arguably close to a decade. And it was a painful, jarring transition for everyone involved: users, developers, and Apple itself."
