["https://daringfireball.net/linked/2017/06/15/inductive-is-not-wireless"]
title = "Daring Fireball: Inductive Charging Is Not 'Wireless'"
description = "Link to: https://www.merriam-webster.com/dictionary/wireless"
full_description = "having no wire or wires; specifically : operating by means of transmitted electromagnetic waves a wireless remote Wi-Fi is wireless. No one would accept wireless as a description for an internet connection that required the device to be in physical contact with a charger, even if it were magnetic rather than a port you plug a cable into. So Apple Watch, for example, does not use wireless charging. Apple describes it perfectly as “magnetic charging”. It sounds like this is what might be in store for the next iPhone. That’d be cool — but it wouldn’t be as cool as being able to charge over the air. If we call inductive charging “wireless” now, what are we going to call it when it really is wireless in a few years?"
