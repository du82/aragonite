["https://daringfireball.net/linked/2025/02/22/going-deep-on-deep"]
title = "Daring Fireball: Going Deep on 'Deep'"
description = "Link to: https://www.washingtonpost.com/opinions/2025/02/18/deep-peak-deep-deepseek-ai-tech-chatgpt-naming/"
full_description = "But lately, one meaning has become trendier than the rest. Close ties to artificial intelligence have led to a surge in “deep” being used for AI-related endeavors, to the point that the word is fast becoming shorthand for “cutting-edge tech” — and is already starting to feel derivative. In 2025, “deep” is to the tech world what the plus sign (+) became a few years ago to streaming platforms such as AppleTV+, Disney+ and Paramount+. Update, 26 February: Another one! “Think Deeper” is Microsoft Copilot’s feature that’s basically what most other AI apps call “Deep Research”."
