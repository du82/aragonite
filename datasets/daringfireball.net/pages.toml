["https://daringfireball.net/2002/11/cruft"]
title = "Daring Fireball: Cruft"
description = '''
<p>
Matthew Thomas: <a href="http://mpt.phrasewise.com/stories/storyReader$374">When good user interfaces go crufty.</a>
</p>

<p>
I agree with much of Mr. Thomas’s essay, but not all...'''
full_description = "I agree with much of Mr. Thomas’s essay, but not all. For one thing, he argues that applications should not force users to explicity save new documents: We have the power, in today’s computers, to pick a sensible name for a document, and to save it to a person’s desktop as soon as she begins typing, just like a piece of paper in real life. We also have the ability to save changes to that document every couple of minutes (or, perhaps, every paragraph) without any user intervention. Personally, I nearly always despise applications that offer “automatic” anything. The effort needed to override the “auto” behavior is usually more of a pain in the ass than the original task the feature is trying to automate. I don’t save any documents to my desktop — it’s jammed with more than enough icons already. Plus, my desktop is almost always completely obscured by application windows. Even if you don’t default to the actual desktop, there’s no other default folder location that would be suitable for all new files. I don’t save my Perl scripts to the same folder as my grocery list. Nor do I want applications choosing file names for me. If you don’t choose the names for your own files, how do you identify them when you try to reopen them later on? It’s also the case that I often create new documents for temporary use, which I have no intention of ever saving to disk. It would be annoying if I had to manually clean up a bunch of files that a too-smart-for-its-own-good application created for me automatically. What might be a good idea would be for applications to silently create and save an automatic backup file for unsaved new documents — hidden away in an application support folder, with a file name the user never needs to see. The only time the application would offer to restore such files is after a crash. But I can’t buy the argument that the Save command, as a general concept, is nothing more than a crufty anachronism. Trouble is, the “Quit” command has always been annoying and confusing people, because it’s exposing an implementation detail — the lack of multitasking in the operating system. It annoys people, because occasionally they choose “Quit” by accident, losing their careful arrangement of windows, documents, toolboxes, and the like with an instantaneity which is totally disproportionate to how difficult it was to open and arrange them all in the first place. And it confuses people, because a program can be running without any windows being open, so — while all open windows may belong to the file manager, which is now always running in the background — menus and keyboard shortcuts get sent to the invisible program instead, producing unexpected behavior."
year_published = 2002
clearnet = "https://daringfireball.net/2002/11/cruft"
