["https://daringfireball.net/2022/10/everything"]
title = "Daring Fireball: Everything"
description = "What we need isn’t an everything app. It’s an everything *device*, with small focused apps for features."
full_description = "He is essentially talking about a “super app,” which is common in China but not the U.S. and might include payments, subscriptions, entertainment etc. It’s the right idea but hard to pull off. Also, X is the name of his first significant company back in the day. I don’t think I’d say the idea is common in China — just WeChat, specifically. And while I agree it’s “hard to pull off”, I vehemently disagree that it’s “the right idea”. Ben Thompson has written extensively about WeChat’s impossible-to-overstate dominant role in China. In China, WeChat is the way to chat, the way to share photos, the way to pay for things with your phone, and a lot more. Back in 2015, Connie Chan of Andreessen Horowitz wrote a great piece explaining WeChat’s expansive domain, and if anything, WeChat’s dominance inside China has only grown since then. Her headline says it all: “When One App Rules Them All: The Case of WeChat and Mobile in China”. It’s no coincidence at all that WeChat is the only “everything app” anyone can cite, and it comes from China, an authoritarian regime. In practice, the concept really only makes sense there. It doesn’t benefit users that WeChat dominates all aspects of digital life — it benefits the authoritarian Chinese Communist Party. (And investors in Tencent, WeChat’s Chinese-government-controlled parent company.) If you’re just spitballing wild ideas, it’s easy to get enthralled by such an idea. But give it any serious thought whatsoever and it starts falling apart. What you’re talking about is putting an entire OS inside an app. Not a computer science operating system but a user-facing system for “everything”. That’s certainly possible — WeChat proves it — but history shows that sprawling monolithic apps are never a good experience in practice. It is really hard to present a coherent, consistent, intuitive, explorable user interface for features as disparate as chat, news, entertainment, and payments. But we have such interfaces: OSes."
year_published = 2022
clearnet = "https://daringfireball.net/2022/10/everything"
