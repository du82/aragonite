["https://daringfireball.net/linked/2017/08/10/facebook-copycatting"]
title = "Daring Fireball: Inside Facebook's Institutional Policy of Copying Competitors"
description = "Link to: https://t.co/JILcX9dbMC"
full_description = "Facebook uses an internal database to track rivals, including young startups performing unusually well, people familiar with the system say. The database stems from Facebook’s 2013 acquisition of a Tel Aviv-based startup, Onavo, which had built an app that secures users’ privacy by routing their traffic through private servers. The app gives Facebook an unusually detailed look at what users collectively do on their phones, these people say. The tool shaped Facebook’s decision to buy WhatsApp and informed its live-video strategy, they say. Facebook used Onavo to build its early-bird tool that tips it off to promising services and that helped Facebook home in on Houseparty. So Facebook is using a VPN app that is supposed to protect users’ privacy to violate their privacy by analyzing which apps they use. Also worth noting: in the iOS App Store, Onavo’s owner is still listed as “Onavo, Inc.”, not “Facebook”. I suspect a large number of Onavo users have no idea the app is owned by Facebook (I for one had never heard of it before this Journal story), and might think differently about entrusting their privacy to it if they knew."
year_published = 2025
