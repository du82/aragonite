["https://daringfireball.net/2002/08/pretty_good_news"]
title = "Daring Fireball: Pretty Good News"
description = '''
<p>
Holy shit, the PGP product line has been brought back from dead, and is now safely in the hands of the new <a href="http://www.pgp.com/">PGP Corporation</a>. The previous purveyors of the PGP product line, <a href="http://nai.com/">Network Associates</a>, were a bunch of morons who probably couldn’t have done a worse job marketing and selling PGP if they tried. 
</p>'''
full_description = "Holy shit, the PGP product line has been brought back from dead, and is now safely in the hands of the new PGP Corporation. (The previous purveyors of the PGP product line, Network Associates, were a bunch of morons who probably couldn’t have done a worse job marketing and selling PGP if they tried.) This is huge news, because it includes the announcement that PGP Desktop Security for Mac OS X is going to be released before the end of 2002. It’s no secret that the PGP engineering team completed work on Mac OS X and Windows XP updates to PGP Desktop Security before Network Associates pulled the plug on the product line. The software has been sitting there, completed, taunting Mac OS X users who seek industrial-strength encryption technology. The mantra from the open source peanut gallery, repeated ad nauseam, has been that “PGP doesn’t matter because GPG is here, is free, and is cryptographically compatible with PGP.” That’s all true, but misses the point. What’s wrong with GPG is what’s wrong with so much open source software — the user interface. Open source software has proven itself to be fantastic for creating developer-level technology, and horrible at creating end-user software. As developer-level crypto technology, GPG is great. But it stinks as end user software. No matter how noble the efforts of the MacGPG contributors, their software pales in comparison to the real PGP. There’s no shame in that, and I don’t mean to disparage their efforts. But user interface design is hard work, and implementing a good design takes a long time. This is where so many arguments for open source fall off track. There is a widespread misconception in the Unix world that a GUI is something that sits on top of “real” software; that all the real engineering work is done at low levels, producing APIs and command-line tools, and that one can reasonably expect to wrap a GUI around the completed low level technologies in short order. And, that the difference between a good GUI and a bad one is merely skin deep."
year_published = 2002
