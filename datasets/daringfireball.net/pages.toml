["https://daringfireball.net/2017/12/marzipan"]
title = "Daring Fireball: Marzipan"
description = "In short, Apple’s goal should be to make it easier for developers to create good Mac apps, and easier for Mac and iOS app siblings to share code. Apple’s goal should not be to make it easier to get iOS apps to run on the Mac in slightly modified form."
full_description = "Mark Gurman had an intriguing story at Bloomberg this week, but the problems start with the headline itself: “Apple Plans Combined iPhone, iPad and Mac Apps to Create One User Experience”. Gurman probably didn’t write the headline, but it doesn’t even make sense. iOS has no concept of a mouse cursor and runs only on touchscreen devices. MacOS has no support for touchscreen devices and requires a mouse pointer. “One user experience” is neither possible nor desirable. The truth is that this effort by Apple is almost certainly not about cross-platform applications but instead cross-platform frameworks for developers. It’s developer news, not user news. Starting as early as next year, software developers will be able to design a single application that works with a touchscreen or mouse and trackpad depending on whether it’s running on the iPhone and iPad operating system or on Mac hardware, according to people familiar with the matter. Developers currently must design two different apps — one for iOS, the operating system of Apple’s mobile devices, and one for macOS, the system that runs Macs. That’s a lot more work. What’s more, Apple customers have long complained that some Mac apps get short shrift. […] Apple is developing the strategy as part of the next major iOS and macOS updates, said the people, who requested anonymity to discuss an internal matter. Codenamed “Marzipan,” the secret project is planned as a multiyear effort that will start rolling out as early as next year and may be announced at the company’s annual developers conference in the summer. Gus Mueller, designer and developer of the excellent Acorn, wrote an excellent piece reading between the lines of Gurman’s report: I feel like this article from Gurman could have been reduced down to: “We think Apple might some day have a shared UI framework for iOS and MacOS. Apple could even create some sort of cross store bundling or a single store with a single binary for all platforms when using this framework (even though there’s nothing stopping Apple from doing this today). That sounds neat and wouldn’t it be cool if all platforms also used the same processor to boot? This may or may not happen starting next year, and it could very likely be canceled as well. Apple declined to comment on our sensational story.”"
year_published = 2017
year_updated = 2017
clearnet = "https://daringfireball.net/2017/12/marzipan"
