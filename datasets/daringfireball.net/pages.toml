["https://daringfireball.net/2024/10/profiles_in_cowardice_bezos_lewis_washington_post"]
title = "Daring Fireball: Profiles in Cowardice: Owner Jeff Bezos and Publisher William Lewis of The Washington Post"
description = "Liberal newspapers breaking tradition to not endorse anyone is *worse* than if their owners had forced them to endorse Trump instead."
full_description = "Sewell Chan, writing for Columbia Journalism Review on Wednesday, “Los Angeles Times Editorials Editor Resigns After Owner Blocks Presidential Endorsement”: Mariel Garza, the editorials editor of the Los Angeles Times, resigned on Wednesday after the newspaper’s owner blocked the editorial board’s plans to endorse Vice President Kamala Harris for president. “I am resigning because I want to make it clear that I am not okay with us being silent,” Garza told me in a phone conversation. “In dangerous times, honest people need to stand up. This is how I’m standing up.” On October 11, Patrick Soon-Shiong, who bought the newspaper for $500 million in 2018, informed the paper’s editorial board that the Times would not be making an endorsement for president. Jeff Bezos, owner of The Washington Post, was like, “Hold my beer...” Here’s William Lewis, CEO and publisher of the Post, which Bezos wholly owns: The Washington Post will not be making an endorsement of a presidential candidate in this election. Nor in any future presidential election. We are returning to our roots of not endorsing presidential candidates. The only rational explanation for this decision is cowardice on Bezos’s part in the face of Donald Trump’s vindictiveness. Lewis tries, haplessly, to couch this as a return to the Post’s “roots”, hand-wavingly justifying the decision by pointing out that, prior to 1976, the newspaper declined to issue endorsements: That was strong reasoning, but in 1976 for understandable reasons at the time, we changed this long-standing policy and endorsed Jimmy Carter as president. But we had it right before that, and this is what we are going back to. We recognize that this will be read in a range of ways, including as a tacit endorsement of one candidate, or as a condemnation of another, or as an abdication of responsibility. The “understandable reasons” for The Washington Fucking Post to endorse Carter in 1976, not delineated by Lewis, were — you know — the crimes of Republican Richard Nixon in the Watergate scandal, as reported by the Post’s own legendary reporting duo, Bob Woodward and Carl Bernstein. Woodward and Bernstein are having none of Lewis’s and Bezos’s bullshit, issuing a clear condemnation of the decision (which, conspicuously, the Post’s own news desk published):"
