["https://daringfireball.net/2025/03/why_cant_we_screenshot_frames_from_drm-protected_video"]
title = "Daring Fireball: Why Can’t We Screenshot Frames From DRM-Protected Video on Apple Devices?"
description = "This “feature” accomplishes nothing of value for anyone, including the streaming services, but imposes a massive (and for most people, confusing and frustrating) hindrance on honest people simply trying to easily capture high-quality (as opposed to, say, using their damn phone to take a photograph of their reflective laptop display) screenshots of the shows and movies they’re watching."
full_description = "About five years ago, Catherine Pearson started taking screenshots of every bouquet featured on The Nanny (1993–1999), the six-season CBS sitcom that was then streaming on Netflix. She was just becoming a florist, and she found the arrangements — ornate, colorful, and distinctly tropical — inspirational. She now keeps them in a folder on her desktop, alongside screenshots of flower arrangements featured on Poirot (1989–2013), the British detective drama. A few months ago, however, Pearson suddenly found that when her fingers danced instinctively toward Command-Shift-3, she was greeted by a black box where her flowers used to be, a censored version of what she had meant to capture. It was around this time when streaming platforms like Netflix, HBO Max, Amazon Prime, and the Criterion Channel imposed a quiet embargo on the screenshot. At first, there were workarounds: users could continue to screenshot by using the browser Brave or by downloading extensions or third-party tools like Fireshot. But gradually, the digital-rights-management tech adapted and became more sophisticated. Today, it is nearly impossible to take a screenshot from the most popular streaming services, at least not on a Macintosh computer. [...] For PC users, this story takes a different, and happier, turn. With the use of Snipping Tool — a utility exclusive to Microsoft Windows, users are free to screen grab content from all streaming platforms. This seems like a pointed oversight, a choice on the part of streamers to exclude Mac users (though they make up a tiny fraction of the market) because of their assumed cultural class. This assumption isn’t unreasonable. Out of everyone interviewed for this article, only one of them was a PC user. Deligter’s essay has been sitting in my long (and ever-growing) list of things to link to ever since she published it back in 2023. I referenced it in my post earlier today re: Matthew Green’s entreaty to Apple to add “disappearing messages” to iMessage, and re-reading it made me annoyed enough to finally write about it."
year_published = 2025
