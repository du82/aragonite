["https://daringfireball.net/2020/10/the_iphone_12_and_iphone_12_pro"]
title = "Daring Fireball: The iPhone 12 and iPhone 12 Pro"
description = "So when you see that the new iPhone 12 and 12 Pro have 6.1-inch displays, 12 years of iPhone experience are going to make you think these are iPhone XR/11-sized devices. They’re not. In hand, in pocket, and to the eye, they feel and look like iPhone X/XS/11 Pro-sized devices."
full_description = "I try to keep two distinct readers in mind with these annual reviews of new iPhones. First, you, today — you probably want insight to help you decide, to some degree, whether you should upgrade from whatever iPhone you currently own (and you probably do own an iPhone already) to one of this year’s new ones, and if so, which one? Second, me, in the future — I want to look back and use what I write now as a resource to remember what was new with the 2020 iPhones. What’s worth noticing and knowing about these iPhones vis-à-vis the market today? What remains the same? What’s different? What stands out? What will be worth remembering about them in the future? When I get lost in a sea of disparate notes and observations, these are the questions I come back to for clarity. But there’s just no way to write a definitive review of the entire iPhone 12 lineup today. There are four iPhones in that lineup, and the two that I’ve been using for the last week are the least novel of the bunch: the no-adjective iPhone 12 (in blue) and the iPhone 12 Pro (in pacific blue). The iPhone 12 Mini (the smallest iPhone Apple has made since the 5 / 5C / 5S / SE) and the 12 Pro Max (the biggest iPhone Apple has ever made, with the most advanced camera system) are launching three weeks after the identically mid-sized 12 and 12 Pro, and reviews, if Apple follows form, will likely drop three weeks from today.1 If you really want to understand the gestalt of the whole iPhone 12 lineup, you have to wait. We all do. But that’s not a complaint. I’ve struggled enough trying to review these two phones in a week. (They arrived last Wednesday. So, at publication, I’ve been using them for about six days.) I don’t know how much of the three-week split between the launches of the 12/12 Pro and the 12 Mini/12 Pro Max was dictated by the travails of production and manufacturing,2 and how much is purposeful strategy,3 but I’m glad to have the chance to just write about these two iPhones first, even if the 12 Mini and 12 Pro Max are ultimately more interesting."
year_published = 2020
