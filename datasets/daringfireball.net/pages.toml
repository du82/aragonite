["https://daringfireball.net/2002/08/grab_html_script_for_bbedit"]
title = "Daring Fireball: ‘Grab HTML’ Script for BBEdit"
description = "An AppleScript version of Dan Crevier’s old HTML Grabber plug-in for BBEdit."
full_description = "Way back in 1996, Dan Crevier wrote a nifty plug-in for BBEdit called HTML Grabber. It’s a simple but useful little thing: choose its menu item and it pops up a dialog box into which you enter a URL; click a button and the plug-in fetches the contents of the URL via HTTP, then presents the results in a new BBEdit text window. Sort of like the View Source command in a web browser, except much more convenient if you’re already working in BBEdit. Even better, HTML Grabber also lets you see the HTTP headers, which can be very useful when debugging CGI’s. The plug-in still works in BBEdit 6.5, but only in Mac OS 9. However, a Mac OS X version is a cinch to write in AppleScript, passing the HTTP work off to the command-line curl utility. (Thus, the script won’t work in Mac OS 9.) Here’s the script. Paste it into your script editor, and save it as a compiled AppleScript in the “Scripts” folder in your “BBEdit Support” folder. This sort of AppleScript/shell hybrid shows Mac OS X at its best. The do shell script command puts the whole Unix command-line toolset at your fingertips — while a command line by itself does not make for a good user interface, it can be an amazingly easy-to-use programming interface. It’s also worth noting that curl is flexible enough to accept URLs without a protocol specifier; you can just type “daringfireball.net” instead of “http://daringfireball.net”. my_url is a string that holds the URL we’re fetching. Because it’s a property, the last URL you enter will be remembered the next time you run the script. It defaults to the empty string. display dialog pops up a dialog box with a text input field. The contents of the text input field are set to the value of my_url. After the dialog is dismissed, AppleScript’s magic result variable contains a record of values, including the name of the button that was clicked and the text in the input field. We don’t need to check which button was clicked, however, because the display dialog command is smart enough to know what a “Cancel” button means — if you run the script and choose “Cancel”, the script terminates as soon as the dialog is closed."
year_published = 2002
year_updated = 2002
