["https://daringfireball.net/2025/02/hot_tob_hardcore_porno_app_eu"]
title = "Daring Fireball: ‘Hot Tub’, a Hardcore Porn App for iOS, Hits AltStore in the E.U."
description = "So, no, Apple neither approves of Hot Tub in particular, nor the ability to distribute native porn apps in general. Everyone involved with both AltStore and Hot Tub knows this, but they also know that framing it as though notarization conveys approval is a good way to get headlines."
full_description = "The screenshots and video previews are blurred-for-obfuscation by default, but Hot Tub’s website makes pretty clear that the content it aggregates is serious porn. Figuratively speaking, they’re not fucking around. Literally speaking, that’s exactly what they’re aggregating — including an in-app “teens” channel. Describing Hot Tub as “Apple-approved” is cheeky, if we’re being generous, and downright misleading if we’re not. What they mean is that Hot Tub was duly notarized by Apple — an ostensibly technical, not editorial, review that encompasses (using terms from Apple’s own documentation) accuracy, functionality, safety, security, and privacy. I say “ostensibly” there because Apple has, controversially, refused to notarize apps for other reasons, including in November when it rejected for notarization the classic Mac emulator Mini vMac, on the grounds that Mini vMac both violated Apple’s software licensing terms and misused Apple’s trademarks. But pornography has pretty much always been Apple’s canonical example for the sort of content they do not want in the App Store, and thus — because Apple’s stance is that the App Store ought to be the sole source for consumer software for iOS — the sort of content they do not consider appropriate for native apps. You’ve been able to watch porno on your iPhone since the first day it shipped — a full year ahead of the App Store — by using the web. Apple’s line has always been clear: native apps = Apple-approved; the web = anything goes. (That same line goes for payment processing for digital goods and services as well.) Back in 2010, MG Siegler (then at TechCrunch) reported on an email exchange between Steve Jobs and customer Matthew Browing. Browing wrote to Jobs: It appears that more and more Apple is determining for its consumers what content they should be able to receive. For instance, the blocking of Mark Fiore’s comic app (due to being political satire) or blocking of what Apple considers to be porn."
year_published = 2025
clearnet = "https://daringfireball.net/2025/02/hot_tob_hardcore_porno_app_eu"
tags = ["altstore", "e.u.", "gruber", "hardcore", "hits", "ios,", "john", "next:", "porn", "previous:"]
