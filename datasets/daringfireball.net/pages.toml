["https://daringfireball.net/linked/2016/12/26/apple-ai-research-paper"]
title = "Daring Fireball: Apple's AI Team Publishes First Research Paper"
description = "Link to: http://www.macrumors.com/2016/12/26/apples-ai-team-first-paper/"
