["https://daringfireball.net/2024/09/the_ios_continental_drift_widens"]
title = "Daring Fireball: The iOS Continental Drift Widens"
description = "What’s happening with Apple Intelligence and iPhone Screen Sharing this year is what I expect to happen with every new product or service Apple creates that integrates with iOS: they will come late, or never, to the EU."
full_description = "At the end of August, Apple announced several more DMA compliance changes. They are worth examining in detail. Developers of browsers offered in the browser choice screen in the EU will have additional information about their browser shown to users who view the choice screen, and will get access to more data about the performance of the choice screen. The updated choice screen will be shown to all EU users who have Safari set as their default browser. For details about the changes coming to the browser choice screen, view About the Browser Choice Screen in the EU. All users with Safari as their default browser, including users who have already seen the choice screen prior to the update, will see the choice screen upon first launch of Safari after installing the update available later this year. The choice screen will not be displayed if a user already has a browser other than Safari set as default. When migrating to a new device, if (and only if) the user’s previously chosen default browser was Safari, the user will be required to reselect a default browser (i.e. unlike other settings in iOS, the user’s choice of default browser will not be migrated if that choice was Safari). I get that the entire point of this mandatory choice screen is that because iOS is, in DMA parlance, a designated “gatekeeping” platform, the presumption is that Apple has unfairly advantaged Safari by bundling it with the OS and making it the default. So, from the European Commission’s perspective, some significant number of iOS users are using Safari only because it is bundled and default, and would prefer and/or be better served — or even just equally served — using another web browser as their default. Thus, Safari gets treated differently. It’s not just another browser in a list of 11. It’s the only browser whose users will be forced to choose again even if they’ve already chosen it in iOS 17.4 or later. It’s the only browser whose users will be forced to choose again whenever they migrate to a new iPhone or iPad. What exactly is the point of forcing this screen per-device rather than per-user, other than to repeatedly irritate Safari users who own multiple iOS devices?"
year_published = 2024
year_updated = 2024
