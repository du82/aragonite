["https://daringfireball.net/2016/08/vesper_adieu"]
title = "Daring Fireball: Vesper, Adieu"
description = "If I could do it all over again, here is what I would do differently."
full_description = "In December 2012, I started a company with my friends Brent Simmons and Dave Wiskus. We named it Q Branch. In June 2013, we launched our first and only product: an iPhone notes app called Vesper. Yesterday, we announced that development was ceasing, and we’ll soon be shutting down our sync server. I am terribly sad about this. I love Vesper. I use it every day. I mean that in the present tense. I still use it. When we pull the plug on the sync server, I’ll stop, but until then it’s my go-to notes app. In my career, the only things I’ve done that I’m prouder of are writing Daring Fireball and the creation of Markdown. What went wrong was very simple. We never made enough money. Why we didn’t make enough money, what we should have done differently to make more money — those are complex questions (which I’ll tackle below). But what actually sunk Vesper was not complicated. Even as a relatively popular app at a relatively high price (for iOS), revenue was never high enough. Brent took a job at the excellent Omni Group in September 2014, and from that point onward the writing was on the wall. We could have, and probably should have, shut Vesper down a year ago. But we loved it too much. Or at least I did. When we started at the end of 2012, Brent still had a few months to go working on Glassboard. Dave and I spent that time designing Vesper for iPhone. Our basic plan was: In hindsight, I am now convinced this plan was fundamentally flawed. The market for paid productivity apps for iOS is simply too difficult. There are exceptions, of course. Fantastical and Tweetbot are two examples from my own iPhone’s first home screen. But paid apps for iOS are the exception. The norm is clearly free apps, with in-app purchases. This is completely clear now, but it should have been clear to me three years ago. If I could do it all over again, here is what I would do differently. I would start the exact same way, with Dave and me designing Vesper for iPhone. But then, before Brent wrote a single line of code, we would immediately design Vesper for Mac.1 And that’s the product we’d have built and shipped first. There is downward pressure on pricing for Mac apps, but the market is still there for quality apps that cost $20–100 (or more). The plan would have looked like this:"
year_published = 2016
