["https://daringfireball.net/2017/09/iphone_x_event_thoughts_and_observations"]
title = "Daring Fireball: Thoughts and Observations on the Products Announced at This Week’s iPhone X Introductory Event"
description = "Thoughts on the new iPhones, Apple Watches, AirPower, Face ID, and more."
full_description = "Apple made this decision well over a year ago. Perhaps the fundamental goal of iPhone X was to get as close as they could to an edge-to-edge display. No chin whatsoever. There were, of course, early attempts to embed a Touch ID sensor under the display as a Plan B. But Apple became convinced that Face ID was the way to go over a year ago. I heard this yesterday from multiple people at Apple, including engineers who’ve been working on the iPhone X project for a very long time. They stopped pursuing Touch ID under the display not because they couldn’t do it, but because they decided they didn’t need it. I do believe it’s true that they never got Touch ID working, but that’s because they abandoned it in favor of Face ID early. I don’t know why recent supply chain rumors suggest Apple was scrambling to get Touch ID working on iPhone X as late as this summer, and no one at Apple seems to know either. Disinformation campaign from competitors? There is clearly skepticism out there about Face ID. Some people think Face ID is going to suck, and a lot of people are flat-out assuming that they’re going to miss Touch ID. We saw the same thing with Touch ID when it was announced, and the skeptics were very wrong. I haven’t used it personally, but I am pretty sure already that the skeptics are going to be wrong about Face ID too. This piece at Ars Technica by Ron Amadeo is going to age poorly, I suspect. The only time I’ve spent playing with an iPhone X was about 10-15 minutes in the hands-on area after the event, and I did not get a chance to try Face ID. But I spent time — both officially, as a member of the media, and unofficially, as a friend — with several Apple employees who are already carrying an iPhone X as their daily-use phone, and from what I observed and from what they told me — and again, several of these employees are engineers, not PR or product marketing folks — it just works. You don’t have to think about it. According to them, you get used to not thinking about it very quickly, and when you go back to a Touch ID device, it feels broken that you have to touch the button to unlock the device."
year_published = 2017
