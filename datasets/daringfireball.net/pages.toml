["https://daringfireball.net/2017/09/apple_watch_series_3"]
title = "Daring Fireball: Apple Watch Series 3"
description = "With the addition of cellular networking in Series 3, Apple Watch gains something essential: independence. It’s not just a cool feature. It’s aimed smack dab in the middle of the two things people like best about Apple Watch: notifications and fitness."
full_description = "When is the right time to ship a product? In particular, a hardware product? The answer, sometimes, is not when it’s done, but rather when it’s useful. The original Apple Watch was too slow. It was too dependent on being tethered to an iPhone. The user interface was too unfocused. But it was useful in some meaningful ways — primarily fitness tracking and as a convenient display for notifications. With WatchOS 2 and 3, Apple focused the experience on fitness tracking and notifications. With last year’s Series 2 hardware, performance improved and the screen got much brighter, making it far more legible outdoors. With the addition of cellular networking in Series 3, Apple Watch gains something essential: independence. It’s not just a cool feature. It’s aimed smack dab in the middle of the two things people like best about Apple Watch: notifications and fitness. When are you separated from your iPhone? When you’re exercising. What do you miss most when you’re away from your phone? Messages and phone calls. Phone anxiety is a weird, and, for me at least, irrational thing. I know that mankind survived for millennia without the ability to communicate with each other out of earshot. But once you get used to having your phone with you at all times, you get used to feeling that if anyone needs you, they can get you. Apple Watch Series 3 with cellular networking completely alleviates this anxiety. It is not a replacement for a phone, and is not supposed to be. But it lets you leave your phone at home when you go for a run, or in your locker while you’re at the gym, or in your hotel while you go to the beach, and not worry in the least that you’re out of touch. Audio quality for phone calls on the watch is very good. People I called via the watch said I sounded great, and I could hear them loud and clear. And all of my testing of phone calls on the watch took place mid-day on busy city streets — full of traffic and pedestrians — here in Philadelphia. People won’t know you’re calling them from your watch if you don’t tell them."
year_published = 2020
