["https://daringfireball.net/2002/11/thanksfindering"]
title = "Daring Fireball: Thanksfindering"
description = "A follow-up to “That Finder Thing”."
full_description = "I speculated that the OS X Finder engineering team was comprised of former NeXT folks; I also suggested that the OS 9 Finder team might be a good choice to fix the OS X Finder. I heard from an ex-Apple engineer who was involved with the development of several technologies directly related to the Finder, and it ends up there’s only one Finder team at Apple, responsible for coding both the 9 and X Finders. That’s a bit surprising, and worth clarifying, but it’s not really that big a deal. In the end, it doesn’t matter who coded it. What matters is who designed it. Mihai Parparita sent along an interesting link to the resume of Arno Gourdol, a long-time Apple engineer who led the OS X Finder engineering team. To increase market share, Apple hopes to entice Windows users to switch, and a number have happily done so. But it also needs longtime Mac users to switch—from OS 9. The last statistic we saw claimed one out of five Mac users has switched to OS X. By our arithmetic, that means four out of five have not. If Apple wants to be sure they will, it must listen not only to the praise of satisfied customers but also to the gripes of those who find OS X slower, less consistent, and less intuitive than the classic Mac OS. At WWDC last year, my co-workers and I sat in quiet horror as we heard the umpteenth presenter say, “Now I’m going to turn on the new ‘metal’ look for this window, because it looks pretty cool.” This from actual Apple employees, in Apple’s actual engineering department. What happened to all the people who gave a damn about the Mac user experience? Michael Tsai (whose nifty SpamSieve utility got a rave review in last week’s issue of MWJ) bemoans the dissolution of Apple’s Human Interface Group: I maintain that the real cause of OS X’s interface problems is not poor design but (for lack of a better word) poor supervision—the result of Steve Jobs’s dissolving of the human interface group. With no one enforcing consistent interface principles and a woefully incomplete set of guidelines, it’s really no surprise that we are where we are. Apple has lots of programmers, and this is what happens when you let them loose (however smart they may be). I don’t think it’s so much a matter of their platform heritage. There are obviously a lot of Mac-type people working on OS X. Joel Spolsky loved that Microsoft gave him a lot of freedom when he was low on their totem pole. I think that this element of corporate culture, while it may be a great way of keeping programmers happy, is a lousy way to ensure quality and consistency. Yet rejecting this idea need not lead to Joel’s Juno scenario; programmers respect HI experts when they are good. Programmers need HI experts in the same way that writers need editors."
year_published = 2002
clearnet = "https://daringfireball.net/2002/11/thanksfindering"
