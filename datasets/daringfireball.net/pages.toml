["https://daringfireball.net/2024/12/journalism_requires_owners_committed_to_the_cause"]
title = "Daring Fireball: Journalism Requires Owners Committed to the Cause"
description = "Bezos can still be a hero in this story. But his only move is to sell."
full_description = "Kara Swisher, the popular podcaster and pioneering tech journalist, is trying to round up a group of rich people to fund a bid for the Washington Post, she told us. Why it matters: Swisher — who started in the Post mailroom, and became an early tech reporter at the paper (and later one of the first at The Wall Street Journal) — believes the Amazon founder will eventually want to sell, since the paper has become a managerial nightmare. Like many, Swisher thinks Bezos should sell since he has other financial and personal interests — like space tech — that are more important to him, and can conflict with his Post ownership. “The Post can do better,” she told us. “It’s so maddening to see what’s happening. ... Why not me? Why not any of us?” This would be an excellent outcome. Bezos should sell. These last few months should make clear to him that he should not own the Post. Swisher would be an excellent publisher. Her entire career has been focused on sharp, smart, good journalism. One simple fact that’s been clear to me ever since I worked (as a designer in the promotions department) at The Philadelphia Inquirer in the late 1990s is that news publications need to be owned by people who are devoted to the core pursuit of journalism. The Inquirer was a world-class newspaper at the time. I played supposedly casual lunchtime softball with colleagues from across the company on Fridays, and only after a few weeks found out that around half the regulars in our group had won Pulitzer prizes. When I learned this I was astonished. It gave me a moment’s pause about hitting the ball as hard as I could. I didn’t want to injure journalistic royalty. (But just a moment’s pause. It was a friendly game but we were all competitive bastards.) There was a stretch in the late 1980s when the Inquirer, under the leadership of editor Gene Roberts, won more Pulitzers than The New York Times and Washington Post. That culture, and the journalists, remained in place through the 1990s. But The Inquirer was owned at the time by Knight Ridder, a national conglomerate, and Knight Ridder wasn’t in the newspaper business for the journalism. They were in it for the profits. Which, at the time, were quite lucrative. There was one quarter where word spread that Knight Ridder brass was pissed because The Inquirer’s profit margin for the quarter had dropped to 19 percent. 20 was the magic number. Newspapers were still minting money from the classified ads. Much of the great editorial and reporting talent at The Inquirer soon left for other publications, like The New York Times, The Washington Post, and Time magazine. It fell apart. Ownership matters."
year_published = 2020
