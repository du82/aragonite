["https://daringfireball.net/2016/09/the_iphones_7"]
title = "Daring Fireball: The iPhones 7"
description = "Five days with the new iPhone 7 (in jet black) and iPhone 7 Plus (in black)."
full_description = "I loved the black iPhone 5. Nostalgic affection for the original iPhone aside, as a piece of kit, the black iPhone 5 was it for me. I never really liked the round shape nor the plastic material of the 3G and 3GS. I liked the 4 and 4S much better, but I didn’t love the glass backs. The black 5 though, that was it. The “slate” anodization did show wear and tear as the year went by, but I liked the effect. Like a good pair of jeans or a leather watch strap. Apple, apparently, did not agree, and with the 5S changed the black model from “slate” to “space gray”. Space gray aged much more gracefully — my used-for-a-year 5S has some nicks along the sides, but the nicks are the same space gray color as the unblemished areas — but it just wasn’t dark enough for my taste. The black iPhones 6 and 6S stuck with the same space gray anodized finish. For me, personally, both aged very well. I’m looking at both of them, close up, right now. My 6 has a few scuffs at three of the four corners. One looks like I must’ve dropped it on or scraped it against something very rough. But even that mark is rather small. My 6S, the phone I’ve been using every day since it arrived on September 25 last year, looks near mint. There is one tiny scuff on one corner. A few pinprick-like pockmarks along the sides. And that’s it. Not one serious scratch on the glass front. Not one scratch on the back surface. Not one scratch on the camera lens or the surrounding enclosure — even though they protrude from the back. Even the reflective Apple logo on the back is unscratched. I haven’t treated the more recent iPhones any more carefully. It’s possible that I’ve simply been luckier, but that seems unlikely. Looking at all nine of my previous iPhones — and yes, I kept them all — the trend is clear: Apple is getting better and better at making devices resistant to wear and tear. That brings us to the tenth generation of iPhones, which, for the first time, offers two options for black: a matte-finished “black” and an incredibly glossy “jet black”."
year_published = 2016
clearnet = "https://daringfireball.net/2016/09/the_iphones_7"
