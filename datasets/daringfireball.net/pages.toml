["https://daringfireball.net/2002/10/microsoft_make-up"]
title = "Daring Fireball: Microsoft Make-Up"
description = "The details of the switcher article, however amusing, are not important. The real story is that at Microsoft — indisputably one of the most powerful, most successful corporations in the world — it is standard operating procedure to fabricate customer testimonials..."
full_description = "I think the AP missed the real story, however. (To be honest, I did too when I wrote about it yesterday.) In case you missed the original article while it was available at microsoft.com, Dave Winer has it mirrored, including style sheets, at Scripting News. There’s a lot of ass-covering going on. The idea that Microsoft published a made-up story about a Mac user who switched to a PC is, to say the least, embarrassing. False testimonials? Total amateur hour. As Dave Winer wrote yesterday: “You’d think Microsoft could at least find one real person to say they made the switch from Mac to Windows and were happy about it.” There are lots of embarrassing aspects to the story. The stock photo. The blatant falsehoods (such as the insinuations that neither Office nor Internet Explorer are available for the Mac). The marketing-speak that permeates the entire article. That it reeks of a juvenile response to Apple’s Switch ads. But the most damaging issue is the idea that the entire article was simply made up, that it’s a fabricated testimonial which Microsoft tried to pass off as the true story of an actual person. The main thrust of the AP article, however, is (surprise, surprise) the conflict angle — that the Mac-to-Windows switcher story was an ill-conceived response to Apple’s Switch campaign. But the conflict angle isn’t interesting. Apple’s Switch campaign is a big, slick, multi-million dollar advertising campaign. Microsoft’s switcher article was one measly web page, and a poor one at that. What makes this story interesting isn’t that article existed at all, but that it wasn’t even true. Microsoft fessed up to the bad marketing. But they’re sticking to the claim that there exists a legitimate author of the article. In other words, Yes, it was poorly done; but we didn’t just make it up. Microsoft acknowledged that the writer’s anonymity and use of the stock photograph contributed to suspicions whether it was making truthful representations. Executives pulled the ad Monday but still would not identify the author by name."
year_published = 2002
