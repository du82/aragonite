["https://daringfireball.net/2011/10/apps_are_the_new_channels"]
title = "Daring Fireball: Apps Are the New Channels"
description = "Why not something like Newsstand for TV network apps?"
full_description = "I got an email yesterday from an up-and-coming young blogger named Jason Kottke, with a screenshot of two consecutive DF entries posted earlier in the day — “Condé Nast Subscriptions Up 268 Percent Since Newsstand Launch” and “Bloomberg TV+ for iPad”. His note read, simply: Reading these two together, the idea for a Newsstand-ish “TV Set” app popped into my head and then the iTV suddenly made sense. Sort of. Back at the original iPad introduction event in January 2010, everyone knew it was going to be a “tablet”, and everyone knew that a tablet, any tablet, no matter what Apple had decided upon specifically, ought to be a good outlet for newspaper/magazine content. And all the writers who work for traditional media publications were (and remain) obsessed with the future of their business, for good reason. So there was widespread consensus that part of Apple’s day-one iPad news would be some sort of iTunes Store system for newspaper/media content. Something, in broad hand-wavingly vague terms, like the iTunes Store’s music, TV, and movie content. Where newspaper/magazine content could be purchased and subscribed to and but would be rendered in a single written-and-designed-by-Apple reader app. And when that didn’t come to pass, there was much disappointment. Apple did announce iBooks and the iBookstore, but nothing for magazines or newspapers. There was a palpable, “Damn, I was expecting Steve Jobs to save our industry today” reaction amongst the media contingent. Whether Newsstand was Apple’s strategy all along, I don’t know, but I think it might have been. The app is the unit of distribution for newspapers and magazines, not the “issue” or the “article”. This puts more work on the publishers’ shoulders — they need to design, create, and maintain software, not merely publish content — but it gives them more control over the reader experience and more potential for creativity and differentiation. Why not the same thing for TV channels? We’re seeing the beginnings of this, with iPhone and iPad apps like HBO Go, Watch ESPN, and the aforementioned Bloomberg TV+. Letting each TV network do their own app allows them the flexibility that writing software provides. News networks can combine their written and video news into an integrated layout. Networks with contractual obligations to cable operators, like HBO and ESPN, can write code that requires users to log in to verify their status as an eligible subscriber."
year_published = 2011
