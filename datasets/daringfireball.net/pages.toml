["https://daringfireball.net/2011/11/companies_that_publish_concept_videos"]
title = "Daring Fireball: The Type of Companies That Publish Future Concept Videos"
description = "I’m not arguing that making concept videos directly leads to a lack of traction in the current market. I’m arguing that making concept videos is a sign of a company that has a lack of institutional focus on the present and near-present."
full_description = "As you might expect, Jon [sic] “Daring Fireball” Gruber, who’s often been called Apple’s freelance PR guy, viewed it with a jaundiced eye. This video encapsulates everything wrong with Microsoft. Their coolest products are imaginary futuristic bullshit. Guess what, we’ve all seen Minority Report already. Imagine if they instead spent the effort that went into this movie on making something, you know, real, that you could actually go out and buy and use today. Of course, he’d never say such a thing about Apple’s classic Knowledge Navigator video, which at the time it was made — circa 1987, when the Macintosh II and SE, IBM PS/2 series and Amiga 500 and 2000 were brand new machines — was at least as pie-in-the-sky as this newest Microsoft video. DeVilla isn’t the only one who accused me of Apple-biased hypocrisy regarding my stance on Microsoft’s “Future Visions” vs. Apple’s “Knowledge Navigator”. It is true that when I linked to Andy Baio’s post about “Knowledge Navigator” a few weeks ago, I didn’t add any commentary. But the exact same criticism I have for Microsoft today applies to 1987 Apple. “Knowledge Navigator” encapsulates everything that was wrong with Apple in 1987. Their coolest products were imaginary futuristic bullshit. The mindset and priorities of Apple’s executive leadership in 1987 led the company to lose what was then an enormous usability and user experience lead over the rest of the industry, and eventually drove the company to the precipice of bankruptcy. That 1987 Apple was a broken company is so painfully obvious from today’s vantage point that I didn’t think it needed to be mentioned. “Knowledge Navigator” didn’t help Apple in any way. Apple never made such a product. It didn’t bring Siri to us any sooner than if that video had never been made. It only served to distract from and diminish Apple’s then-current actual products. Apple today, from a strategic and operational perspective, is nothing like Apple of 1987. Apple today would never release to the public a concept video speculating on what sort of products they might be making 10 or 20 years from now. The attention of the public and the media is a rare and precious commodity. Apple today uses what attention it gets to focus on actual new products, ones that you can go out and actually buy and use."
year_published = 2011
