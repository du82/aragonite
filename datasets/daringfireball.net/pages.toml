["https://daringfireball.net/2002/09/welcome_indeed"]
title = "Daring Fireball: Welcome, Indeed"
description = """
<p>
The Jaguar updater deserves rich praise, especially the nifty new “Archive and Install” option (although I ended up opting for a clean installation). But there’s an annoying grain of sand, ready to jump into your eye, as soon as you pop the first disc into a machine running Mac OS 9.
</p>"""
full_description = "SCENE: Avie Tevanian’s office, late July, 2002. A tester from Apple’s QA department knocks at the door. Avie: Call me Avie. You’re the guy who filed a bug report against the Jaguar GM installation discs? QA: Well, it works fine in Mac OS X, but it’s broken under Mac OS 9. Hold on a sec, I can show you. QA: Well, it’s not just cosmetic. It’s a functional bug, because you can’t open the file by double-clicking it in the Finder. QA: I mean on 9. Everything I’m talking about here is on 9. The readme file works just fine on X. But if you double-click it on 9, you get the dialog box that says, “The document ‘Read Before You Install.pdf’ could not be opened, because the application program that created it could not be found.” That’s a bug. QA: Double-clicking files is a fundamental action in the Finder. For some users, it’s the only way they know how to open files. QA: But not on Mac OS 9. And the Jaguar installation disc needs to run from 9. As it stands, it’s sort of an insult — it’s the readme file, the first file most users will try to open, in a folder named “Welcome to Mac OS X”, but it can only be double-clicked if you’re already running Mac OS X. Avie: Hey, you’re not the same guy who reported the bug against the Jaguar Finder because the new file searching window doesn’t let you search for Type/Creator codes, are you?"
year_published = 2002
clearnet = "https://daringfireball.net/2002/09/welcome_indeed"
