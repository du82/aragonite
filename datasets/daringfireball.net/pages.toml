["http://daringfireball.net/2010/01/ipad_big_picture"]
title = "Daring Fireball: The iPad Big Picture"
description = "This is Apple’s way of asserting that they’re taking over the penthouse suite as the strongest and best company in the whole ones-and-zeroes racket."
full_description = "There was a meta-message in today’s Apple event, not about the iPad in particular, but rather about Apple as a whole. Jobs’s brief preamble included a bit of extra emphasis on the fact that the Apple now generates over $50 billion per year in revenue. (Apple also emphasized this $50 billion revenue thing in their PR two days ago announcing their Q1 2010 financial results.) He also said that when you consider MacBooks as “mobile” devices, Apple generates more revenue from mobile hardware than any other company in the world; the three competitors he singled out were Sony, Samsung, and Nokia. The adjective he used was “bigger”. Lastly, there’s the fact that the iPad is using a new CPU designed and made by Apple itself: the Apple A4. This is a huge deal. I got about 20 blessed minutes of time using the iPad demo units Apple had at the event today, and if I had to sum up the device with one word, that word would be “fast”. It is fast, fast, fast. The hardware really does feel like a big iPhone — and a big original iPhone at that, with the aluminum back. (I have never liked the plastic 3G/S iPhones as much as the original in terms of how it feels in my hand.) I expected the screen size to be the biggest differentiating factor in how the iPad feels compared to an iPhone, but I think the speed difference is just as big a factor. Web pages render so fast it was hard to believe. After using the iPhone so much for two and a half years, I’ve become accustomed to web pages rendering (relative to the Mac) slowly. On the iPad, they seem to render nearly instantly. (802.11n Wi-Fi helps too.) The iPad hardware is exactly what you think. It looks great, it feels great. It’s very nice to hold. (People are complaining about the wide bezel around the display, but without that, where would your thumbs go? You don’t want your thumb that’s holding the device to cover on-screen content or register as a touch. Trust me, it’s just right.) Just like with the iPhone, it’s all in the software. And the software is obviously marvelous in many ways. It is clearly the result of deep thought and hard work."
year_published = 2010
clearnet = "http://daringfireball.net/2010/01/ipad_big_picture"
