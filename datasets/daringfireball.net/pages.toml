["https://daringfireball.net/2002/09/versioncrapper_user_reviews"]
title = "Daring Fireball: VersionCrapper User Reviews"
description = '''
<p>
Steven Frank, clever programmer at <a href="http://www.panic.com">Panic</a>, writes <a href="http://www.panic.com/~stevenf/mt/archives/000048.html#000048">about the clueless underbelly</a> of the Mac user community, the VersionTracker user review forums,
</p>'''
full_description = "Steven Frank, clever programmer at Panic, writes about the clueless underbelly of the Mac user community, the VersionTracker user review forums: The other day we received an email from a paying customer, who had a fairly simple routine inquiry about the software he had purchased. Certainly nothing life or data-threatening. Like all of our other support email, it went into a first-in, first-out email queue. It seems only fair to answer emails in the order they arrive, after all. After the second hour, a third email arrived, this time with a threat attached. We were to either reply to this email immediately or our company and product would be besmirched by him posting a scathing review on a popular version tracking web site. Users like this are, thankfully, few and far between, but when they rear their heads, they’re a real pisser. Worse, when you think about it, they only annoy the good guys: developers who are actually trying to be responsive to their users. The shitty developers who ignore their users aren’t bothered, since, well, they ignore their users. When you encounter bugs in software, there are only two reasonable ways to respond: (1) report the bug to the developers; or (2) keep it to yourself, and either work around it, or, if it’s a show-stopper, abandon the software. Choice (1) is the only option that has a chance of helping the bug get fixed; it sounds totally obvious, but developers only fix the bugs they know about. But choice (2) is still reasonable. Perhaps the software in question isn’t very important to you. Perhaps you reported bugs to the same developer in the past, and never heard back. What’s completely unreasonable, however, is option (3): lambasting the developer and the software on the web. It’s baffling; if you’re going to take the time to write a report about the bug, why post it to the VersionTracker forums without having first emailed a report to the developer? Is the goal to see the software actually improve, or just to get off on pissing all over someone else’s work?"
year_published = 2002
year_updated = 2002
clearnet = "https://daringfireball.net/2002/09/versioncrapper_user_reviews"
