["https://daringfireball.net/2002/08/pepper_author_maarten_hekkelman"]
title = "Daring Fireball: Pepper Author Maarten Hekkelman"
description = "An interview with Pepper developer Maarten Hekkelman."
full_description = "Maarten Hekkelman is the programmer behind Pepper, a Macintosh programmer’s text editor that started life on BeOS as Pe. Two weeks ago, the 36-year-old resident of the Netherlands called it quits, and announced that he was no longer developing or selling Pepper. The Daring Fireball interviewed Mr. Hekkelman via email — who better to interview the author of a Mac text editor than someone who used to work for Bare Bones Software? John Gruber: Let’s start with the news. According to your web site (http://www.hekkelman.com/), you are no longer taking orders for Pepper, the text editor you’ve been working on for several years. In fact, it is no longer even available for download, except for registered users. Maarten Hekkelman: It is. It took me some six years to develop what has become Pepper. Pepper started life as Pe on BeOS and was ported to Mac OS [beginning with Pepper 3.0]. Frankly, I was very disappointed by Mac OS X and so [for version 4.0] I decided to do a port to Windows. The code was already quite portable but now I separated Pepper’s code from the more generic code. I had used PowerPlant for the first Mac OS port and now I started replacing PowerPlant with my own framework. I got help from an old friend, Bas Vodde, who helped me get up to speed on Windows (I had never programmed for that OS before). It took me nine months to finish Pepper 4.0 for Mac OS and Windows, and a Linux version was released a couple of months later. But Pepper 4.0 was not well received. The first releases had some performance issues and people blamed it on going cross platform. However, most of the performance problems were related to fixing bugs internally and were not at all related to the platform switch. The negative feedback spread around; on VersionTracker there were many complaints, and this influenced sales. And then Pepper’s serial number was cracked, I got my first fraud cases, had a quarrel with Tucows, and Pepper didn’t run on Jaguar and then I gave up. Pepper 3.0 debuted for the Mac in July 2000, only a few months before the first public beta of Mac OS X, and only 8 months before the release of Mac OS X 10.0. Did you ever consider dropping support for the old Mac OS, and making Pepper only for Mac OS X?"
year_published = 2002
