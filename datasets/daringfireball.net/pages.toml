["https://daringfireball.net/projects/smartypants"]
title = "Daring Fireball Projects: SmartyPants"
full_description = "SmartyPants is a free web publishing plug-in for Movable Type, Blosxom, and BBEdit that easily translates plain ASCII punctuation characters into “smart” typographic punctuation HTML entities. This means you can write, edit, and save your posts using plain old ASCII straight quotes, plain dashes, and plain dots, but your published posts (and final HTML output) will appear with smart quotes, em-dashes, and proper ellipses. SmartyPants is a combination plug-in — a single plug-in file that works with Movable Type, Blosxom, and BBEdit. It can also be used from a Unix-style command-line. SmartyPants does not modify characters within <pre>, <code>, <kbd>, or <script> tag blocks. Typically, these tags are used to display text where smart quotes and other “smart punctuation” would not be appropriate, such as source code or example markup. Movable Type users should also note that SmartyPants can work in conjunction with Brad Choate’s MT-Textile plug-in. MT-Textile is a port of Dean Allen’s original Textile project to Perl and Movable Type. MT-Textile by itself only translates Textile markup to HTML. However, if SmartyPants is also installed, MT-Textile will call on SmartyPants to educate quotes, dashes, and ellipses, automatically. Using SmartyPants in conjunction with MT-Textile requires no modifications to your Movable Type templates. Textile is Dean Allen’s “humane web text generator”, an easy-to-write and easy-to-read shorthand for writing text for the web. An online Textile web application is available at Mr. Allen’s site. Upgrading from any previous version of SmartyPants is easy. Just replace your old “SmartyPants.pl” plug-in file with the new one. You don’t need to change any of your templates to reap the benefits of the numerous bug fixes. (You will need to change your templates, however, if you wish to use the new en- and em-dash shortcut.) Most normal, mentally stable individuals do not take notice of proper typographic punctuation. Many design and typography nerds, however, break out in a nasty rash when they encounter, say, a restaurant sign that uses a straight apostrophe to spell “Joe’s”."
year_published = 2025
