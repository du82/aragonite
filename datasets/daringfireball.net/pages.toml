["https://daringfireball.net/2022/10/the_ipad_lineup_is_like_growing_out_its_bangs_or_something"]
title = "Daring Fireball: The iPad Lineup Is, Like, Growing Out Its Bangs or Something and Looks a Little Weird Right Now, but Apple TV Has Been Going to the Gym and Looks Great"
description = "So the iPad lineup as of this week — including accessories — isn’t where anyone would want it to be."
full_description = "On the Apple TV front, the news is (almost) all good and the lineup actually makes more sense now. Apple has finally dropped the long-outdated 1080p Apple TV and now sells just two models, at reasonable prices: a 64 GB model for $130, and a 128 GB one for $150. Both now have the A15 chip that debuted in last year’s iPhone 13 lineup. The $130 model doesn’t have an Ethernet port and doesn’t support Thread wireless networking — the open protocol for smart home gadgets backed by Matter. The Ethernet port I can see. But I wish both models supported Thread. And we finally have a dead canary in the “Is the iPhone switching from Lightning to USB-C next year?” coal mine: the Apple TV Remote now charges via USB-C. (The remote is otherwise unchanged — including no support for Find My, alas, which is disappointing for the one Apple product I most frequently misplace.) The new 10th-generation (no adjective) iPad moves to the modern all-screen / no-home-button design style. It gets the A14 chip that debuted with the iPhone 12 lineup two years ago, and has Touch ID on its side button. It comes in some pretty fun colors — yellow, pink, and blue — along with plain old silver. It looks a lot like the 5th-gen iPad Air that debuted in March this year, with one very significant difference: Apple moved the front-facing camera to the long (“landscape”) side, which positions the camera correctly when docked to a keyboard — which is exactly how most people who rely on the front-facing iPad cameras want to use them. And, like all the other all-screen / no-home-button iPads, it moves from Lightning to USB-C — but, bizarrely (on first consideration at least), is compatible only with the Apple Pencil 1, which has a male Lightning plug that is required both for charging the Pencil and pairing it with an iPad. So Apple now sells a $9 USB-C to Lightning adapter — with female ports on both sides — just for using an Apple Pencil 1 with these new iPads. (The adapter will henceforth be included in the box with new Pencil 1’s.)"
year_published = 2022
