["https://daringfireball.net/2017/10/face_id_fud"]
title = "Daring Fireball: Face ID FUD"
description = "If Apple had really been dithering over Touch ID-embedded-in-the-display vs. Face ID in June of this year, iPhone X wouldn’t be hitting the market until 2018. And the final decisions on the hardware for the iPhones that *will* be debuting next year are being made right now."
full_description = "Seemingly-sensational Apple story from Bloomberg today, reported by Alex Webb and Sam Kim, “Inside Apple’s Struggle to Get the iPhone X to Market on Time”: As of early fall, it was clearer than ever that production problems meant Apple Inc. wouldn’t have enough iPhone Xs in time for the holidays. The challenge was how to make the sophisticated phone — with advanced features such as facial recognition — in large enough numbers. As Wall Street analysts and fan blogs watched for signs that the company would stumble, Apple came up with a solution: It quietly told suppliers they could reduce the accuracy of the face-recognition technology to make it easier to manufacture, according to people familiar with the situation. That sounds terrible. But what exactly does it mean? Does it mean Face ID will create too many false positives? Does it mean it will be too slow? Does it mean there will be too many false negatives? Surprise surprise, Bloomberg doesn’t say. Apple is famously demanding, leaning on suppliers and contract manufacturers to help it make technological leaps and retain a competitive edge. While a less accurate Face ID will still be far better than the existing Touch ID, the company’s decision to downgrade the technology for this model shows how hard it’s becoming to create cutting-edge features that consumers are hungry to try. Apple spokeswoman Trudy Muller said “Bloomberg’s claim that it reduced the accuracy spec for Face ID is completely false and we expect Face ID to be the new gold standard for facial authentication. The quality and accuracy of Face ID haven’t changed; it continues to be one in a million probability of a random person unlocking your iPhone with Face ID.” It is extraordinary for Apple to issue a blanket “this is completely false” statement on any news story. Apple, as policy, no-comments every news story, even when they know it’s bullshit. So either this story is particularly strong bullshit, or Apple is lying, on the record, under an employee’s real name (as opposed to the anonymous “an Apple spokesperson” attribution)."
year_published = 2017
clearnet = "https://daringfireball.net/2017/10/face_id_fud"
