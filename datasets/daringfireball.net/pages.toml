["https://daringfireball.net/2018/09/apple_watch_series_4"]
title = "Daring Fireball: Apple Watch Series 4"
description = "The Series 4 Apple Watch is defined by being a nicer watch."
full_description = "Tim Cook opened the Apple Watch segment of the event last week by stating that Apple Watch wasn’t just the number one smart watch in the world (come on, that’s obvious), but that “it’s the number one watch, period”, standing in front of a slide with a big “#1” on it. Number one by what measure, though? They didn’t say, which I find irksome. Presumably Cook meant number one by revenue. At last year’s event he noted revenue specifically, mentioning that Apple Watch had surpassed Rolex. Apple has several products that lead their markets in revenue or profit. What makes Apple Watch different from every other product the company makes, though, is a measure near and dear to the company’s soul by which they cannot claim Apple Watch to be number one: nicest. Nicest is inherently subjective, of course. But iPhone, iPad, MacBook, and iMac can all reasonably be argued to be the nicest products in their respective markets. You can definitely add Apple Watch to that list if you limit the comparison to other smart watches and fitness trackers. I would say hands-down, no question, Apple Watch is the nicest of those. But that’s like saying you’re the richest person in the poorhouse. And Tim Cook is the one who stood on stage boasting about Apple Watch’s position among all watches. Traditional watches are Apple’s competition for nicest watch. And Apple Watch just isn’t there. It’s not even close. Don’t get me wrong — Apple Watch is nice, and always been. I think that’s ultimately what defined the minimum viable product for the original Apple Watch. Apple could have made something that did what the original Apple Watch did years earlier, I’m sure. But it wouldn’t have been nice enough. But as nice as Apple Watch has always been, there are many watches that are nicer. And that makes Apple Watch unique in the history of the company. What successful product has Apple ever made that wasn’t at least arguably the nicest in its category? Apple Watch is the first."
year_published = 2018
