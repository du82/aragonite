["https://daringfireball.net/2002/08/movable_type_smart_quote_devilry"]
title = "Daring Fireball: Movable Type Smart Quote Devilry"
description = '''
<p>
Over at <a href="http://diveintomark.org">DiveIntoMark</a>, Mark Pilgrim has some excellent tips with regard to hacking Movable Type <a href="http://diveintomark.org/archives/2002/08/15.html#better_living_through_regular_expressions">to generate smart quotes</a> (a.k.a. curly quotes, a.k.a. typographer’s quotes). This got the gears turning here at Daring Fireball — surely, this could and should be even easier.
</p>'''
full_description = "Over at DiveIntoMark, Mark Pilgrim has some excellent tips with regard to hacking Movable Type to generate smart quotes (a.k.a. curly quotes, a.k.a. typographer’s quotes). This got the gears turning here at Daring Fireball — surely, this could and should be even easier. [13 Nov 2002: If you’re using Movable Type 2.5 or later, these instructions are now obsoleted by my new SmartyPants plug-in.] [5 Oct 2002: This article was edited on October 5 to (1) fix a few bugs; (2) take advantage of improvements in the latest versions of Brad Choate’s plug-ins; and (3) improve the smart-quotes algorithm. See this article for details about the changes.] For, what, at least the last 15 years or so, Mac users have come to expect proper quotes to happen automatically simply by typing regular apostrophes and quotation marks. In their word processors, that is. In HTML markup, however, smart quotes have been a royal pain in the ass. The problem with getting smart quotes in HTML is that the curly quote characters aren’t part of the standard cross-platform ASCII character set, which means that if you want them to appear properly on all platforms, you need to use entities. But raw entities are ugly and distracting — it’s hard to write and edit when your text looks like this: So, most people ignore the issue, and simply use good old-fashioned dumb quotes in their HTML. Typography nerds who persevere and insist upon doing the right thing, like Textism’s Dean Allen, typically resort to preflighting scripts to generate smart quote entities. In other words, a three-step process: But the whole point of modern blogging tools is that they make posting articles easy. Normal, non-obsessive people will only tolerate steps 1 and 3: write, then post. And they’re right — educating quotes is not a difficult problem to solve, and your software should be able to do it for you. Our own preflight scripts here at Daring Fireball are BBEdit text filters, written in Perl. But why invoke them manually, when Movable Type itself is extensible with Perl? Why indeed."
year_published = 2002
