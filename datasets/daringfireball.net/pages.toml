["http://daringfireball.net/2013/08/the_case_for_a_new_lower_cost_iphone"]
title = "Daring Fireball: The Case for a New Lower-Cost iPhone"
description = "So the question to ask is not “Does Apple need a lower-cost iPhone?”, but rather, “Why would Apple change its lower-cost iPhone strategy from selling years-old high-end models to a new model designed from the get-go to sell at lower prices?”"
full_description = "Lost amid much of the rampant speculation that Apple is on the cusp of unveiling a new plastic-bodied lower-priced iPhone “5C” is the simple fact that Apple has offered lower-priced iPhones for several years now — year-old and two-year-old models. So the question to ask is not “Does Apple need a lower-cost iPhone?”, but rather, “Why would Apple change its lower-cost iPhone strategy from selling years-old high-end models to a new model designed from the get-go to sell at lower prices?” I.e. why change now? Make no mistake: Apple’s current strategy has been remarkably successful. They sell a ton of iPhone 4S and 4 devices, and have expanded the iOS market by doing so. But there are several factors this year that suggest a change in strategy. If Apple does unveil an iPhone 5C, I expect them to concurrently abandon the iPhones 4 and 4S. Their three pricing tiers for the next year would be a new iPhone 5S at the high end, today’s iPhone 5 in the mid-range, and the new 5C at the low end.1 This way, all new iPhones would sport 16:9 aspect ratio displays, and all would have Lightning adapter ports. Adios both to 3:2 displays and the grody old 30-pin port.2 The other factor is that I think Apple needs to push the low end of the iPhone lineup even lower. Today they’re primarily selling the low end models as free-with-contract devices. Apple has no iPhone that competes well in non-subsidized markets. In the U.S. and other subsidized markets, I expect the 5C to be sold just like the iPhone 4 is today: “free” with a contract. But in non-subsidized markets, I expect the 5C to sell at lower prices than an unsubsidized iPhone 4 does today. How low? Well, ever since 2007 and the original iPod Touch, it’s always seemed to me that the Touch suggests a floor for a hypothetical lower-priced iPhone. Take an iPod Touch and add cellular networking components. Boom, there’s your lower-priced iPhone. With the iPad, Apple charges quite a premium for cellular models — they cost $130 more than the corresponding Wi-Fi-only models. Apply that to today’s iPod Touch lineup and you’d get a 32 GB low-cost iPhone for $299 + $130 = $429. But there’s also that 16 GB Touch for just $229. Part of the cost savings on that device is that it doesn’t even have a rear-facing camera. And I’ve never believed that the $130 premium for cellular iPads is entirely related to component and assembly costs; I think Apple charges a premium for cellular iPads because they know many people are willing to pay that premium."
year_published = 2013
clearnet = "http://daringfireball.net/2013/08/the_case_for_a_new_lower_cost_iphone"
