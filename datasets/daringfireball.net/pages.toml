["https://daringfireball.net/misc/2005/04/tiger_details"]
title = "Daring Fireball: Tiger Details"
full_description = "Notes, comments, and observations regarding Mac OS X 10.4. Tip: RSS feed to track updates to this page. The usual, or at least obvious, way to use the keyboard shortcuts for semi-modal features like Exposé and Dashboard is: I’m not going to argue that this saves any time or effort, but ever since I learned this trick, I’ve been using it whenever I invoke Dashboard and the application windows mode of Exposé. I mean, if you’re going to be using some Dashboard widget for a while, sure, you’ll want to use the regular “tap the key” mechanism — but if you just want to glance at one or more status-displaying widgets (e.g. Weather), the press-and-hold mechanism feels just right. It’s also worth noting that the Exposé shortcuts work like this in Mac OS X 10.3, too. The command-line osascript tool allows you to execute AppleScript scripts from the command-line. In Mac OS X 10.0 through 10.3, the only argument you could pass to osascript was the script to execute. In Tiger, you can now pass along arguments to pass to the script itself. Mac OS X has long supported built-in support for advanced typographic features — e.g. genuine small caps, automatic ligatures, old-style figures, etc. — in AAT fonts. AAT stands for Apple Advanced Typography, and several of these fonts ship with Mac OS X, including Hoefler Text, Didot, and Zapfino. Apps that use ATSUI (Apple Type Services for Unicode Imaging) for text rendering get support for these advanced typographic features, including Pages, Keynote, and just about any app that uses the standard Cocoa text editing field. This was all well and good, but wasn’t of much use to serious type users because AAT fonts are not widely produced by companies other than Apple. The de facto standard format for fonts with built-in advanced typographic features is OpenType. The good news is that starting with Tiger, Mac OS X now automatically maps OpenType features to AAT features. This means if you have OpenType fonts installed, they now “just work” in apps that previously provided advanced typographic features only with AAT fonts. If you have any OpenType fonts installed (several excellent OpenType fonts are included with the Adobe Creative Suite, for example), you can try these features out in TextEdit. Open the Fonts panel, then open the Typography palette from the Font panel’s gear menu."
year_published = 2023
clearnet = "https://daringfireball.net/misc/2005/04/tiger_details"
