["https://daringfireball.net/linked/2025/02/21/yankees-facial-hair"]
title = "Daring Fireball: Yankees Loosen The Boss's Facial Hair Policy"
description = "Link to: https://www.mlb.com/yankees/news/yankees-change-facial-hair-policy"
full_description = "“In recent weeks I have spoken to a large number of former and current Yankees — spanning several eras — to elicit their perspectives on our longstanding facial hair and grooming policy, and I appreciate their earnest and varied feedback. These most recent conversations are an extension of ongoing internal dialogue that dates back several years. “Ultimately the final decision rests with me, and after great consideration, we will be amending our expectations to allow our players and uniformed personnel to have well-groomed beards moving forward. It is the appropriate time to move beyond the familiar comfort of our former policy.” The appropriate time to change this was years ago, but better late than never. It’s the most Yankees story possible that this policy change is much bigger news than the fact that the team today also signed manager Aaron Boone to a two-year extension through the 2027 season. MLB reporter Bryan Hoch: The grooming policy dates to George M. Steinbrenner’s purchase of the team. As the legend goes, its roots grew in 1973, when Steinbrenner observed his team on the first-base line for Opening Day against the Cleveland Indians. Steinbrenner was not yet “The Boss,” so new in the role that he could not identify the players by their faces. Instead, he focused upon their hair — unkempt mustaches, mutton chops and shaggy locks. He scowled, scribbling uniform numbers on a scrap of paper urgently dispatched to manager Ralph Houk. Tell these men to get a haircut, Steinbrenner commanded. My favorite Yankee, Don Mattingly, not only ran into grief over this policy with George Steinbrenner, but again with the next team he played for."
