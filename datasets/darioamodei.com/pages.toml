full_description = "Dario Amodei is the CEO of Anthropic, a public benefit corporation dedicated to building AI systems that are steerable, interpretable and safe. Previously, Dario served as Vice President of Research at OpenAI, where he led the development of large language models like GPT-2 and GPT-3. He is also the co-inventor of reinforcement learning from human feedback. Before joining OpenAI, he worked at Google Brain as a Senior Research Scientist. Dario earned his doctorate degree in biophysics from Princeton University as a Hertz Fellow, and was a postdoctoral scholar at the Stanford University School of Medicine. Short posts On DeepSeek and Export Controls Essays Machines of Loving Grace Research Google Scholar Interviews In conversation with Zanny Minton Beddoes (2025) Lex Fridman Podcast (2024) Econ 102 with Noah Smith (2024) In Good Company Podcast (2024) TIME interview (2024) The Ezra Klein Show (2024) Dwarkesh Podcast (2023) Subscribe for email alerts about new posts."
