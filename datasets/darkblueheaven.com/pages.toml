["https://www.darkblueheaven.com/crowdfund"]
title = "Crowdfund: $ESSAY | Dark Blue Heaven"
description = "A new business model for long-form writing."
full_description = "A new experiment begins today: using crypto to crowdfund the next essay I'm writing, titled Scissor Labels. Instead of publishing my work for free, or putting it behind a paywall, I'm doing something in between: raising funds to produce a new essay in exchange for ownership of the work. This will allow me to devote my full time to writing the piece, while allowing it to exist as a public good for anyone to read. The crowdfund is now live, and will stay open for one week, or until the cap is hit. The funding goal for the project is 2 ETH. If we hit 2 ETH, I'll publish the essay! There's also a hard cap of 10 ETH, to limit the total funding and number of tokens. Unlike other patronage models, this form of crowdfunding is not pure altruism. Instead, patrons receive a stake in the success of the work. Here's how it works: Over the past couple years, paid writing has made great strides, with Substack popularizing newsletter subscriptions as the dominant business model for writing online. However, the paid newsletter model only works for a certain kind of writing - something regular, consistent, and often a bit shorter. While newsletters are great for many reasons, we also need other business models for writing. Some of the greatest thinkers around are primarily dedicated to something besides publishing their ideas on a regular cadence, and therefore won't be found starting a weekly newsletter. Even those who are dedicated to writing often produce their best work after weeks or months of research, not by writing a new piece every few days. Unfortunately, these kinds of writers face a tough choice today: adapt their work to a newsletter format, or write without being paid. Even for writers running successful newsletters, there's an inherent tradeoff in the subscription format: in order to monetize their content, writers must hide some, if not all of their work, behind a paywall, reserved for those who pay to subscribe. With each new piece is a choice between rewarding those who pay and sharing ideas widely."
