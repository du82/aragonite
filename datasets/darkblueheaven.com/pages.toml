["https://darkblueheaven.com/cryptogovernance"]
title = "Crypto Governance and Vote Farming | Dark Blue Heaven"
description = "A quick brainstorm on the future of crypto governance."
full_description = "The concept of yield farming has reorganized the DeFi landscape. When you deposit money into a protocol, you can earn some tokens or funds the longer your money is there. DeFi protocols aggressively compete with each other to offer users the most bang for their buck. Often, users choose where to deposit funds based on a combination of where they can get the highest yield and where they can earn the tokens they care most about. As UNI and COMP token prices have increased, the price of meaningful participation in governance decisions has already risen far beyond the reach of most individuals. I believe we're heading towards a future where participants in crypto governance will congregate together to control larger amounts of votes as a group, rather than directly participating as individuals. As a result, I think it's highly likely that protocols like Uniswap and Compound reach a state where their governance landscape is made up of several powerful factions, each with its own governance token and constituency which is coordinating around protocol-level decisions. These factions will compete with each other for voting power the way political parties do, and therefore will most likely be open to anyone. For regular people, gaining power within one of these factions will be the highest-leverage way to have a voice in the broader protocol governance landscape. In such a world, I think we'll see a mechanism emerge for vote farming. When you delegate your UNI or COMP votes to a faction or political group, you'll earn more of that faction's sub-governance tokens the longer your votes are delegated there. Individuals will begin to delegate their votes to different factions based on who is offering the best rates (as defined by the ratio of sub-governance token yield to that faction's top-level voting power), and more importantly, whose political agenda is aligned with their values. Today, we're still pretty far away from this kind of reality, but things tend to move pretty quickly in crypto, and my personal goal is to set good precedents in this regard."
year_published = 2025
