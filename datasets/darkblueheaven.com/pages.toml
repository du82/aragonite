["https://darkblueheaven.com/newearlyteam"]
title = "The New Early Team | Dark Blue Heaven"
description = "A new hiring strategy for early stage startups."
full_description = '''Over the next year or two, a new strategy for building out the early team at a startup will become popular. This strategy stands in contradiction to a lot of the startup advice that has dominated the past ten years or so. Namely, I'm talking about hiring people as contractors during the early product building phase of a company. Typical startup advice is that all core product development should be done by founders and full-time employees, and that you should never outsource this work. And while hiring contractors isn't the same as outsourcing, it clearly goes against this standard rule. The reason this is changing today is that this rule is in direct opposition to another core rule of startups: "Move quickly." Due to the abundance of venture capital and the competition for talent, founders today frequently must choose between moving quickly and working only with full-time employees. The startup environment today is different than a decade ago. There's more venture capital going into startups, especially at the seed stage. This means more funded startups trying to hire talent. All the leverage in hiring has therefore moved to the side of the employees. Employees can now maximize optionality, as the demand for talent far outweighs the supply. Talented employees can spend more time deciding or waiting for the perfect offer before joining any company full-time. This leaves founders dealing with the strategy dilemma mentioned above: Move slow waiting for full-time employees, or move fast with contractors. That dualistic phrasing is helpful for framing the main tradeoff, but ignores another dimension: talent quality. Due to the same emergent leverage mentioned above, it's often the case that working with contractors unlocks higher quality talent, in addition to moving quickly, because top talent is difficult to recruit for full-time work. Since very few startups want to compromise on talent quality, this makes it is even more difficult to stick to the "full-time only" rule. Today, it means moving slower and potentially lowering the quality bar for who is building the product.'''
