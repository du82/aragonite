["https://darkblueheaven.com/digitalnations"]
title = "Digital Nation States and Digital Political Parties | Dark Blue Heaven"
description = "An essay about cryptocurrency and VR worlds."
full_description = "Due to a collection of technologies that have been growing lately, the world seems poised to undergo a revolution in the way we structure politics. I’ve been having lots of abstract thoughts and inspirations on this topic for the last couple of months, and attempting to compile them into a coherent essay is too intimidating right now. This will be more of a brainstorming session. Breaking Smart Season 1 talks a lot about the networked world and the geographic world. The geographic world has been around forever, controlled by physical resources and bound to zero-sum conflicts. The networked world is empowered by software and the rapid flow of information. Since software and information can be duplicated and moved around with ease, it can move beyond zero-sum physical problems and “eat” old systems. Today, the networked world and the geographic world are increasingly entwined, together constituting the “real world.” But while startups have come along and taken over some areas where antiquated, inefficient solutions existed, we are still bound by slowly evolving, ineffective political parties. Why can’t political parties cause disruption? American government is a democracy, but the process of evolving it is extremely inefficient. Consider disruption in the business world, where there may be an existing organization dominating an industry. When a group of people has an idea for a new organization, they can build it and put it into action. Once it’s started, people or other businesses can test it and decide how much to use it in the future. If it’s a better business, it can steal the market away from the industry incumbent. We can think about this capitalist approach to business as a form of continuous A/B testing, whose incremental improvement is limited only by people’s ability to spend money and judge the results of their spending. One big difference here is that while the “majority vote” will determine which business captures the largest market share, the business with the majority vote isn’t the only one that gets to be tested. Each individual can vote with his money and see the results immediately. Then people can change their votes moving forward if they deem it smart."
year_published = 2025
