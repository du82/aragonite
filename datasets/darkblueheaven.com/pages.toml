title = "Making Crypto Multiplayer | Dark Blue Heaven"
description = "Crypto's unfulfilled potential as a tool for social + economic coordination."
full_description = "Though we don’t commonly see it through such a lens, money is ultimately a tool for coordination. In his book The Ascent of Money, Niall Ferguson introduces this concept in these terms: Money is the root of most progress…The evolution of credit and debt was as important as any technological innovation in the rise of civilization, from ancient Babylon to present-day Hong Kong. Banks and the bond market provided the material basis for the splendours of the Italian Renaissance. Corporate finance was the indispensable foundation of both the Dutch and British empires, just as the triumph of the United States in the 20th century was inseparable from advances in insurance, mortgage finance and consumer credit…Behind each historical phenomenon there lies a financial secret… Crypto has a clear place in this chronology. The internet has always connected us socially, allowing us to transfer information anywhere across the globe nearly instantly and for free. But it has never done so economically in the same kind of open, permissionless way. The story of payments on the internet is basically bank transfers, credit card processing, PayPal, and later Venmo and Cash app. But in 2009, the Bitcoin whitepaper changed this. Bitcoin introduced the concept of a blockchain - a shared public ledger with its own native asset. It gave us “internet-native money.” In 2014, Ethereum pushed this even further, creating a blockchain paired with its own virtual machine and a Turing-complete programming language. It was this invention that turned crypto from “internet money” into “programmable money.” This was a key unlock for the internet. What could happen if transferring value and setting up ownership arrangements had a programming framework as open and flexible as HTML and Javascript? Phrased differently: What happens if you combine 2 of humanity’s most important inventions: money and software? In the early days, one of the most exciting narratives around “programmable money” was that you could program rules for coordination. And just a few months after Ethereum’s mainnet launch, we got a famous early example of this. In June of 2016, a few early Ethereum developers launched their new project, simply called “The DAO.” It was the first ever instance of a concept that Vitalik Buterin had coined in the Ethereum whitepaper: “Decentralized Autonomous Organization.”"
year_published = 2025
clearnet = "https://darkblueheaven.com/makingcryptomultiplayer"
