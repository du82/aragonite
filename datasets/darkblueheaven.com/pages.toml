["https://darkblueheaven.com/marketplaceforwriting"]
title = "A Markeplace for Writing | Dark Blue Heaven"
description = "Aggregating liquidity to fund writing production."
full_description = "Since the Mirror crowdfund happened, I've been thinking a lot about the idea of crowdfunds and bounties being two sides of the same coin. Both of these ideas are getting a lot of hype lately, and I think lots of people are looking to experiment with them. Then, in the back of my mind has been a question around how Mirror can develop a network effect and be more like Uniswap, less like a standalone product. An exciting thought here is that Mirror could be a marketplace / aggregator for both bounties and crowdfunds at once. This would be a central part of the product (and a dedicated page in the UI), and make Mirror more about writing production, not just writing consumption. It would have two parts: This kind of central marketplace would establish Mirror as the place where writing is financed. Similar to Uniswap, there would be a huge network effect around aggregating all of this liquidity into one place. Additionally, it adds to Mirror’s defensibility. Not only is the liquidity a moat, but over time, publications and profiles would build up some credibility around the amount of work they’ve done before, and how successful it was. For an author or publication applying to fill a bounty, you could see things like Total Bounties Filled (in ETH), Average Page Views (per post, once Mirror has analytics built in), and Average Funder’s Score (did people who funded the post enjoy it). The power of this kind of liquidity means that people could eventually build huge publications on top of Mirror, not just blogs or newsletters. It’s not completely insane to imagine that someone could build a publisher at the scale of the New York Times on top of a marketplace where there was enough capital around just waiting to fund writing production. I think this is actually quite different than something like Substack, which to me is purely about about paying for consumption. What remains to be seen is if demand for writing production will increase to a point where it can support this kind of ecosystem, and if Mirror can aggregate that demand by building a great platform. But I'm optimistic."
