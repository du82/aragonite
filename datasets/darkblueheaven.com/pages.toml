["https://darkblueheaven.com/ideagenerators"]
title = "Startup Idea Generators | Dark Blue Heaven"
description = "Some patterns for coming up with startup ideas."
full_description = "Lately, I’ve been been thinking more systematically about startup ideas. Sometimes you’re just not finding organic startup ideas, or you want to think of tons of ideas for fun. I’ve been using a few symbolic patterns lately that seem good for coming up with relevant startup ideas. That’s just a fancy way of saying I take a pattern or concept that seems interesting right now, and then I come up with ideas that fit into that mold. It’s pretty easy to come up with several ideas all based on the same insight. I’ve got about a dozen patterns I’ve been thinking of lately, but here I’ll just include three of them, with concrete examples of how I go from a pattern to a rough product concept. As with any creative exercise, it helps to get specific. With any of these ideas, it’s not enough to say something like “Uber for X.” You really want to be naming specific features and loosely defining an MVP so that you can feel out your idea and force your imagination to do some work. Process: Find any widespread, specific use-case or for a group chat and build a bespoke app around that. Because group chats are such a flexible tool for communication, they’re good enough to work for all these use-cases. But a tailored solution around any of these use-cases could steal part of that market. For example, I’m in a few group chats that are just for general conversation, but whenever a University of Virginia basketball game comes on, that becomes sole focus of the chat. It’s actually confusing because I’m usually not watching the game. I think this is a pretty common, widespread behavior for sports fans. So, let’s imagine a group chat app specifically for people who are watching sports. Even more specific, an app for group chats during college basketball games. You could form a group around any specific game, and the chat UI could be highly intelligent around that game. Again, I’m in quite a few group chats that get completely taken over by basketball when it’s on, then go back to normal conversation afterwards. A thoughtful “group chat for basketball” app could take that time from iMessage, and eventually become “group chat for sports” and then “group chat for events.” Ultimately you could probably just build the world’s best messenger by starting on something so specific."
year_published = 2025
