["https://darkblueheaven.com/unbundling"]
title = "Unbundling the University | Dark Blue Heaven"
description = "We can unbundle each part of the university experience."
full_description = '''Our education system fails in a lot of ways, but I've recently been thinking about how ineffective it is at one thing in particular: figuring out what to work on. Right now, most Americans go through a super-tracked education system that rushes us through the process of making some really important decisions. Making these decisions more effectively is one of the biggest ways to level up human productivity and happiness. Ultimately, our educational track leads us to getting a job. But the jobs we end up in are too often the result of randomness. First, we rush many smart high school graduates into college, before they know if they want to go, or what they want to major in. Second, we rush college graduates into jobs, usually just the best job offer they can get when they graduate. We can become both more effective and happier by emphasizing effective decision-making at important life junctures. So, how could we escape the current system of rushing from one thing to the next? One solution I've been thinking about lately comes in the form of new schools. Mainly, I've been thinking in terms of "unbundling the university." If you think about the university experience right now, it's a pretty inefficient bundling. It's kind of like the annoying mail you get from Comcast. "Sign up for Internet + TV + Phone!" How could we "unbundle" this value and give people the chance to choose just the pieces they care about? Lambda School has arguably taken the most important step, unbundling the "training to get a job" piece into its own contained experience. Imagine a new kind of school called a Decision School. A three- or four-month program designed for effectively deciding on a career path. At first, this would specifically target would-be college students: smart, ambitious high school grads who aren't sure what they want to do in life. I'm not strongly opinionated about how this would be done. Maybe you shadow people in different professions. Maybe you reflect on what you care about. Maybe you take part in seminar discussions with your classmates about what constitutes important work.'''
year_published = 2025
