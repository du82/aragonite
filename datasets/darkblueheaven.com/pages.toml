["https://darkblueheaven.com/remotework"]
title = "Thoughts on Remote Work | Dark Blue Heaven"
description = "Some high-level opinions on remote work."
full_description = "I was just commenting on this thread on Twitter and decided to write down the same thoughts more coherently. This is a quick summary of my thoughts on remote work, which is pretty trendy these days. A few weeks ago I decided to start interviewing people on distributed teams, with the idea that there must be lots of fertile ground for products to be built in this space. It seems obvious that in an online world, the future of work doesn’t require a group of co-workers to be in the same room. I went into these interviews expecting to find a discrete problem to solve around organization, communication, or logistics. After speaking to about ten remote employees or founders, I didn’t really find any obvious problems of that nature. Instead, I found bigger problems with the nature of remote work. My overall takeaway: Remote work will be the future, but not until there’s a big change in how it’s done. If you read blog posts online, or talk to anyone who works remote, they’ll all tell you the same thing: Remote teams require a lot more process. Like five times the process. More communication, more documentation, and more structure. If you go on to hear about the way they work, you find that most of these teams have solved these problems using a variety of tools. They have documentation systems, asynchronous communication strategies, and task tracking across several tools. There are many new startups forming right now dedicated to enabling the future of remote work, but I think they’re all missing the bigger vision. If you assume that remote work requires five times the process, what do you build? Things like a knowledge base, a task tracker, a meeting scheduler, etc. Most of these startups are building tools where you can expend five times the effort on process. And right now, if your team can figure this out, you get all the amazing benefits of remote work. However, I think everyone vastly underestimates how difficult it is to find people who can work this way. I do not think that 80% of people can do it."
year_published = 2025
