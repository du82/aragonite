["https://darkblueheaven.com/nextgendaos"]
title = "Next Gen DAOs | Dark Blue Heaven"
description = "What DAOs are good for, and how to push them to the next level."
full_description = "Organizational structures help humans align around common goals. When forming a new organization, it’s important to understand the nature of the task at hand and to choose an organization structure best suited to that task. Crypto originated the concept of a new kind of organization called a “DAO” – decentralized autonomous organization – which promised to unlock exciting new kinds of coordination on the internet. Over the past several years, DAOs have led to countless experimental projects, lawsuits, and debates. But at this point in time, DAOs have unfortunately become tightly coupled with a form factor that’s holding back the evolution of this idea. In their most common form today, DAOs involve an on-chain treasury that is governed by token holders through a proposal system via smart contracts. This process is “decentralized” (it’s democratic and on-chain), but it’s also centralized (every decision must go through this single-threaded process). In other words: DAOs today put a centralized decision-making process on decentralized rails. The problem with DAOs today is that they’re sitting in an awkward middle place between centralized companies and decentralized protocols. They get some things right (broad distribution of token holders, anyone can buy the token), but then turn those things into weaknesses by directing them towards traditional decision-making processes. I think the main reason this is happening is that 1) we’re overly biased towards a “onchain company” analogy and 2) people creating DAOs don’t have a clear mental model for when they’re the right tool for the job. Here’s a very simple take on that: We’ve got companies pretty figured out. But DAOs are suffering from a huge amount of untapped potential. People haven’t really grasped what they’re good for, and their form factor has stopped evolving. We should change this. The way forward for DAOs is to push their own strengths to the extreme. Set a broad directional goal, then allow people to participate permissionlessly and in parallel (this also probably requires dropping the term “DAO” which now carries strong negative associations for onchain users)."
