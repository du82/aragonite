["https://www.darkblueheaven.com/scissorlabels"]
title = "Scissor Labels | Dark Blue Heaven"
description = "Maximally divisive narrative conflict."
full_description = '''We live in an age of constant narrative conflict. But today, not every battle is legible to the untrained observer. While some grifts are plainly perpetrated by would-be thought leaders, other battles for narrative control are hiding in plain sight, happening under the guise of intellectual debate. When these battles go unrecognized for what they are, even the best among us fall victim to meaningless conversations that waste the time of those involved. In this piece, I introduce the concept of "scissor labels," why they foment controversy, and how they're different from other linguistic debates. I then suggest how to engage with this phenomenon with a more fruitful, future-oriented mindset. A specific shape of online debate caught my attention in 2020. As I've reflected on the past year, I've realized that this pattern is happening frequently but is rarely understood. A standout example from 2020 was the rise of "Hyperpop." The term came about to describe a particular musical aesthetic associated with artists like A.G. Cook and SOPHIE, and gained momentum over the past couple years, reaching a peak sometime in early 2020. The musical landscape of Hyperpop is interesting on its own, but equally powerful is the divisive power of the word itself. Last year, the term served as a centralizing idea around which an entire movement built momentum. In this way, Hyperpop as a label possessed immense generative power, identifying a widely recognized trend, and providing a singular phrase around which a subculture for associated sounds and artists could congregate. But what exactly Hyperpop is, no one has fully agreed on. If you ask around, you won't find a canonical definition for Hyperpop. Laura Les of 100 gecs, on The Pitchfork Review, said "Everybody draws the line in the sand at a different point" (22:40). Eli Enis from Vice calls it "a genre tag for distinctly genre-less music." This sense of ambiguity is what makes Hyperpop so divisive. Though the term initially served as a cultural magnet for a range of musicians and fans, its definition quickly became the object of repetitive debates.'''
year_published = 2025
