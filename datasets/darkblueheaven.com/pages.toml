title = "Refactor Camp 2019 | Dark Blue Heaven"
description = "Some thoughts from Refactor Camp this year."
full_description = '''When I was thirteen years old, I traveled outside of the US for the first time, on a vacation to Europe with my family. On that trip I felt a certain kind of nervous energy I had never felt before. Somewhere deep in the stack of my normal thoughts and emotions was an exciting discomfort. Where was it coming from? The new cities I visited were interesting in their own right, but I don't remember thinking they were that interesting. This feeling was something else. It wasn't just that I was arriving in a new place for the first time, but more so that I had left a familiar place for the first time. I was missing context that in my normal life was never missing. I was feeling a contextual void. That void opened up room for curiosity and play. It became natural and easy to ask questions I never asked in the US. I got to fill the void with my imagination, even subconsciously, as I tried to spot the differences between where I was and where I usually existed. As I've grown up, it's been harder to find that feeling again. I get it in small doses here and there, but I think it's more difficult for adults to find a place where they have no context. And that makes it really hard to clear that mental space and play with what might go there instead. There's a lot to say about Refactor Camp 2019, but if I had to write a quick summary, it would be this: I got to feel that weird lack of context again, and spend a weekend playing in it. In the spirit of mediocrity, I'm just going to leave it at that and then write some random bullets below this about what I liked. In a way, I'm lucky I had never attended Refactor Camp before. It being my first time there, combined with the theme of "Escape Reality," led to so many moments where I felt curious, confused, or excited at my lack of context. Shoutout "xenoreaction" talk. I'm really glad Sarah Perry's talk on "How to See Voids" was first. It kind of became a lens through which I saw many of the other talks. I'm even thinking about it now as I write about a unfamiliarity leading to play, by forcing you to fill a contextual void with new ideas.'''
