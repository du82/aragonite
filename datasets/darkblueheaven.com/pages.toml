["https://darkblueheaven.com/newmvp"]
title = "The New MVP | Dark Blue Heaven"
description = "The quality bar for MVP's has changed."
full_description = '''There's something about the startup playbook of the past decade that is doesn't seem right anymore. Namely, it feels more than ever like a linear track to follow, where product quality has been de-emphasized. I'm not the first to write about this, but recently it has seemed more true than ever. Marc Andreessen wrote awhile back about which is the most important factor for a startup: Product, Market, or Team. He posited that Market wins out over anything else, and today most people in the startup world agree with him. Some people advocate for Team being most important. After all, a good team can pivot to a better market. No one ever says Product is most important. I don't think Product is the right answer either. Market and Team do make more sense. But emphasis on product has been thrown aside by most early stage startups. Partly as a result of this, product quality is now an overlooked opportunity for differentiation and defensibility from day one. For the past decade, the prevailing startup playbook has been to build an MVP, ship it early, and then iterate your way to success. But the environment in which we build products has evolved quite a bit. Today, there's so much capital in the startup ecosystem, and so many tools that make it cheap and easy to ship a product, that baseline applications have become a commodity. Most users can intuitively feel the cheapness of the average product today, and their app fatigue is at an all-time high. MVP stands for Minimum Viable Product, and I want to specifically emphasize the word "viable." We're continually experiencing quality inflation as app-building frameworks get better. As it gets easier to build basic applications, the floor for what is actually viable rises. The problem today is that most founders' idea of what constitutes a software product's MVP is outdated. My friend Wilson Cusack brought up a good point this week regarding the startup world these days: it feels a lot like a pre-planned track. In an interview earlier this year, Peter Thiel said, "Tracks work less well when everyone knows them and everyone is doing the same thing."'''
year_published = 2025
