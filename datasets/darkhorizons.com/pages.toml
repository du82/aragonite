title = 'Kirk, Osment, Cyler Set For "The Burbs" - Dark Horizons'
description = "Justin Kirk (“Interview with the Vampire”), Haley Joel Osment (“The Sixth Sense”), RJ Cyler (“The Harder They Fall”), Kyrie McAlpin (“Will Trent), Danielle Kennedy (“Man on the Inside,” “Narcos”) and Randy Oglesby (“For All Mankind”) are all set to join the TV series version of the 1989 dark comedy “The ‘Burbs” at Peacock. All will […]"
full_description = "TV News Kirk, Osment, Cyler Set For “The Burbs” By Garth Franklin - Saturday, March 1st 2025 5:17 pm AMC Justin Kirk (“Interview with the Vampire”), Haley Joel Osment (“The Sixth Sense”), RJ Cyler (“The Harder They Fall”), Kyrie McAlpin (“Will Trent), Danielle Kennedy (“Man on the Inside,” “Narcos”) and Randy Oglesby (“For All Mankind”) are all set to join the TV series version of the 1989 dark comedy “The ‘Burbs” at Peacock. All will play recurring guest stars on the series which stars Keke Palmer, Jack Whitehall, Julia Duffy, Paula Pell, Mark Proksch and Kapil Talwalkar in series regular roles. Set in present-day suburbia, the story follows a young couple (Palmer, Whitehall) who have reluctantly relocated to the husband’s childhood home. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); Their world is upended when a new neighbor moves in across the street bringing old secrets of the cul-de-sac to light, and new deadly threats shatter the illusion of their quiet little neighborhood. Celeste Hughey will adapt the film for television and executive produce. Nzingha Stewart will executive produce and direct the first episode, while Seth MacFarlane and Brian Grazer also executive produce. The series will film on the Universal Studios backlot in Los Angeles where Joe Dante helmed the original film. That movie received mix reviews at the time, but opened at No. 1 at the box office and has since earned a cult following. Source: Variety .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous articleCapcom Responds To “Monster Hunter Wilds” Bugs Next articleFinal Oscar Predictions As Ford Drops Out Garth Franklin"
