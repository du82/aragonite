description = "Dragon Age: The Veilguard EA’s “Dragon Age: The Veilguard” has been announced as part of Sony’s PlayStation Plus’ Essential Games for March alongside “Sonic Colors: Ultimate” and “Teenage Mutant Ninja Turtles: The Cowabunga Collection”. The games will join the catalogue from March 4th. That the title is making the jump to the service after just […]"
full_description = "Game News Game News: Dragon, AI, Live-Service, Terminator By Garth Franklin - Thursday, February 27th 2025 8:18 pm Bitmap Bureau Dragon Age: The Veilguard EA’s “Dragon Age: The Veilguard” has been announced as part of Sony’s PlayStation Plus’ Essential Games for March alongside “Sonic Colors: Ultimate” and “Teenage Mutant Ninja Turtles: The Cowabunga Collection”. The games will join the catalogue from March 4th. That the title is making the jump to the service after just four months has led to people worrying about the franchise’s future. Last month EA indicated the game had underperformed with EA’s boss Andrew Wilson suggesting the game would’ve performed better had it been live service. [Source: EuroGamer] Microsoft AI Microsoft CEO Satya Nadella says the company is already planning to utilize Muse, its generative AI model, in multiple video games and plans to “have a catalog of games using generative AI” which can create not just game visuals but gameplay action too. [Source: VGC] (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); Live-Service Games More than 40% of total time spent playing PS5 or Xbox Series X/S games by the U.S. population last month was spent on just ten live service games. Mat Piscatella of industry analysts Circana revealed the figure, adding that more than 70% of active users played at least one of those top ten. The Top 10 wasn’t listed but likely covers “Fortnite,” “Minecraft,” “Call of Duty,” “Apex Legends,” “Rocket League,” “Grand Theft Auto Online,” “Destiny,” “Marvel Rivals” and two EA sports games. [Source: VGC] Terminator 2D: No Fate Bitmap Bureau has premiered the trailer for “Terminator 2D: No Fate,” a 2D side-scrolling action game that adopts the look of 1990s Sega CD titles and follows the events of “Terminator 2: Judgment Day”. Players can control Sarah Connor, John Connor, and the T-800 Terminator across a variety of levels. The game will release on September 5th on all platforms. .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous articleNew Trailer: Statham In Ayer’s “Working Man” Next article“Daredevil: Born Again” S2 Details & Casting Garth Franklin"
