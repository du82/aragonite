full_description = "TV News Trailer: “Mythic Quest” Spin-Off “Side Quest” By Garth Franklin - Friday, February 28th 2025 7:34 pm Apple TV+ Apple TV+ has released the first trailer for “Side Quest,” the upcoming anthology spin-off series tied to its office comedy “Mythic Quest”. Apple calls this an ‘expansion series’, the four-episode event follows the lives of employees, players, and fans impacted by the in-show video game. The series is said to be modelled after the standalone episodes that the main series often airs during its seasons. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); Rob McElhenney, Anna Konkle, Derek Waters, William Stanford Davis, Bria Samoné Henderson, Rome Flynn, Leonard Robinson, Gary Kraus, Annamarie Kasper, Esai Morales, and Shalita Grant will all appear in “Side Wuest”. The show has been developed and executive produced by Ashly Burch, John Howell Harris, and Katie McElhenney. Megan Ganz, Rob McElhenney, David Hornsby, Charlie Day, Todd Biermann, Nick Frenkel, Michel Rotenberg, Margaret Boykin, and Genevieve Jones all executive produce. All four episodes will be made available at once with the release set to premiere alongside the fourth season finale of “Mythic Quest” on March 26th. .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous articleQuick News: Spider-Man 3, Clayface, Anaconda, MobLand Next articleSony Considers “Starship Troopers” Remake? Garth Franklin"
