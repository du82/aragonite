["https://www.darkhorizons.com/superman-star-corenswet-talks-criticism"]
title = '"Superman" Star Corenswet Talks Criticism - Dark Horizons'
description = "When anyone gets cast as a superhero on film, they come under a certain amount of very public scrutiny and criticism. The bigger and more well-known the hero, the louder that criticism gets. When it comes to Superman on the big screen, every man and his dog seems to weigh in on whoever is cast […]"
full_description = "Movie News “Superman” Star Corenswet Talks Criticism By Garth Franklin - Saturday, March 1st 2025 3:12 pm Warner Bros. Pictures When anyone gets cast as a superhero on film, they come under a certain amount of very public scrutiny and criticism. The bigger and more well-known the hero, the louder that criticism gets. When it comes to Superman on the big screen, every man and his dog seems to weigh in on whoever is cast in the role. Christopher Reeve, Brandon Routh and Henry Cavill all saw a lot of criticism before first showing off their work in the role, but these days all are seemingly appreciated for what they each brought. Now, David Corenswet takes on the role for James Gunn’s “Superman”. The actor has the character’s quintessential look, but has also been subject to criticism for his physical size, his ‘baggy’ superhero outfit, even an apparent ‘wonky’ eyeline in one TV spot. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); During a new interview with Esquire, Corenswet was asked about the criticism he’s encountered since his casting was announced. He seems to take it in stride: “I like to grow and improve myself with criticism. I don’t take it personally. Quite the opposite, it’s a learning experience. And all actors must accept it as what it is in order to grow professionally. James Gunn has a tremendous imagination. I’m only here to deliver the lines he’s written. It’s a very particular vision, spiced up with some wonderful elements and performances. I hope I measure up to it in the audience’s eyes.” The trailer and TV spots so far have shown plenty of him as both Clark and Superman, but have shown little of him speaking thus far. It’s not clear when the film’s next trailer will drop, but the movie itself opens July 11th. .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous articleSonic Team Response To “Shrek 5” Redesign Next articleCapcom Responds To “Monster Hunter Wilds” Bugs Garth Franklin"
