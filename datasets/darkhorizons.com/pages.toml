title = 'Sony Considers "Starship Troopers" Remake? - Dark Horizons'
description = "A report earlier this week indicates that a remake of Paul Verhoeven’s 1997 sci-fi war satire “Starship Troopers” is in the works at Sony Pictures. Screen Geek (via WoR) published the report, saying their sources claim the studio is developing the project which they dub a remake of the film as opposed to a new […]"
full_description = "Movie News Sony Considers “Starship Troopers” Remake? By Garth Franklin - Friday, February 28th 2025 7:35 pm Sony Pictures A report earlier this week indicates that a remake of Paul Verhoeven’s 1997 sci-fi war satire “Starship Troopers” is in the works at Sony Pictures. Screen Geek (via WoR) published the report, saying their sources claim the studio is developing the project which they dub a remake of the film as opposed to a new adaptation of the 1959 novel of the same name by Robert A. Heinlein. The original film is set in the 23rd century as teenager Johnny Rico (Casper Van Dien) and his comrades serve the highly militarised United Citizen Federation, an Earth-based world government, which is engaged in an interstellar war against an insectoid alien species known as the Arachnids. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); The film received mixed reviews at the time and earned only $121 million off a $100 million budget. However, as the years passed the movie has been critically re-evaluated and become a cult classic. Whereas Heinlein’s novel was very militaristic and borderline fascistic, Verhoeven (who grew up in an occupied country) used the material to make an anti-fascism satire that effectively skewered the original work (along with adding his usual gratuitous violence and T&A). Although not all of the audience understood the joke at the time, it is now considered a minor masterpiece of the genre. Several low-budget direct-to-video sequels, cartoons, and games followed, but none could replicate the success of the first. Since its publication, the report has not been corroborated, and so it is pure rumor for now. Two previous attempts to remake Verhoeven sci-fi classics, 2012’s “Total Recall” and 2014’s “RoboCop,” both bombed with critics and at the box-office. Verhoeven is next expected to shoot “Young Sinner,” his first American production since “Hollow Man” in 2000. .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous articleTrailer: “Mythic Quest” Spin-Off “Side Quest” Next articleMarvel Hit By “Avengers” Concept Art Leak? Garth Franklin"
