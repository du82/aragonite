["https://www.darkhorizons.com/capcom-responds-to-monster-hunter-wilds-bugs"]
title = 'Capcom Responds To "Monster Hunter Wilds" Bugs - Dark Horizons'
description = "While PC is often held up as the ‘best way to play’ when it comes to video gaming, it has one serious issue that seems to strike far more often than its console counterparts – bad optimisation & ports. Whereas consoles all use the same hardware and thus can be designed and optimised with those […]"
full_description = "Game News Capcom Responds To “Monster Hunter Wilds” Bugs By Garth Franklin - Saturday, March 1st 2025 4:13 pm Capcom While PC is often held up as the ‘best way to play’ when it comes to video gaming, it has one serious issue that seems to strike far more often than its console counterparts – bad optimisation & ports. Whereas consoles all use the same hardware and thus can be designed and optimised with those in mind, PCs come in thousands of configurations which makes it trickier. This can result in the PC ports of multi-platform AAA games being plagued by issues to the point that even hardware that’s several times more powerful than their console brethren can struggle to keep up. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); Late January saw the PC release of “Marvel’s Spider-Man 2” plagued with issues, and this was despite Nixxes Software having done the port – the company with the best track record to date of bringing PS5 releases to PC. A month of hotfixes and patches later, it’s in decidedly better shape but still has a bit to go. This past week though saw Capcom releasing “Monster Hunter Wilds” and already that game’s PC version has been infamously plagued by issues with optimization, performance and more. Digital Foundry has gone so far as to say they cannot recommend the PC version, and now Capcom has finally responded to the issues. In a post on Monster Hunter Status, the franchise’s official support account, it says: “If you’re experiencing any initial issues with Monster Hunter Wilds on Steam, please try updating your graphics driver, turning off compatibility mode, and then readjust your settings. If you still experience issues, please also try the troubleshooting steps on the Official Monster Hunter Wilds Troubleshooting & Issue Reporting Thread posted on the Steam community page as they contain more detailed and additional steps that may help resolve your issue.” The performance issues haven’t stopped sales or players, the title hitting almost 1 million concurrent Steam players on launch night, but reviews are decidedly mixed and the issues are all with the port’s performance as opposed to the game’s content. .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous article“Superman” Star Corenswet Talks Criticism Next articleKirk, Osment, Cyler Set For “The Burbs” Garth Franklin"
