["https://www.darkhorizons.com/2025-razzie-winners-coppola-responds"]
title = "2025 Razzie Winners & Coppola Responds - Dark Horizons"
description = "This year’s Razzie Awards, celebrating the worst in film, have been handed out and have drawn a response from one of its major nominees. Sony’s Marvel film “Madame Web” topped the list, winning three awards including Worst Film, Worst Actress (Dakota Johnson) and Worst Screenplay. The other awards were a three-way tie of two wins […]"
full_description = "Movie News 2025 Razzie Winners & Coppola Responds By Garth Franklin - Friday, February 28th 2025 1:49 pm Lionsgate This year’s Razzie Awards, celebrating the worst in film, have been handed out and have drawn a response from one of its major nominees. Sony’s Marvel film “Madame Web” topped the list, winning three awards including Worst Film, Worst Actress (Dakota Johnson) and Worst Screenplay. The other awards were a three-way tie of two wins each. “Unfrosted” took Worst Actor (Jerry Seinfeld) and Worst Supporting Actress (Amy Schumer), “Joker: Folie a Deux” took Worst Screen Combo (Phoenix/Gaga) and Worst Prequel, Remake, Rip-Off or Sequel. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); Arguably the most interesting thing about the ceremony came after Francis Ford Coppola’s “Megalopolis” won for Worst Director and Worst Supporting Actor for Jon Voight (that award shared with performances from Voight in three other films). Coppola himself took to Instagram to respond, issuing the following lengthy statement: “I am thrilled to accept the Razzie award in so many important categories for ‘Megalopolis’ and for the distinctive honor of being nominated as the worst director, worst screenplay, and worst picture at a time when so few have the courage to go against the prevailing trends of contemporary moviemaking!. In this wreck of a world today, where ART is given scores as if it were professional wrestling, I chose to NOT follow the gutless rules laid down by an industry so terrified of risk that despite the enormous pool of young talent at its disposal, may not create pictures that will be relevant and alive 50 years from now. What an honor to stand alongside a great and courageous filmmaker like Jacques Tati who impoverished himself completely to make one of cinema’s most beloved failures, ‘PLAYTIME’! My sincere thanks to all my brilliant colleagues who joined me to make our work of art, ‘MEGALOPOLIS,’ and let us remind ourselves us that box office is only about money, and like war, stupidity and politics has no true place in our future.” “Megalopolis” released late last year and grossed just $11.5 million at the box office from a budget of $120 million. .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous articleNew “Superman” Photo, Early Screening Talk Next articleTrailer: Max’s Horror-Comedy “The Parenting” Garth Franklin"
