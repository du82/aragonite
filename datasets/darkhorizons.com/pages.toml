title = 'Two Returning For "Daredevil: Born Again" S2? - Dark Horizons'
description = "A new rumor this weekend from scooper MyTimeToShineH has suggested that both Frank Castle/The Punisher (Jon Bernthal) and Benjamin “Dex” Poindexter/Bullseye (Wilson Bethel) will be back for the second season of Marvel’s “Daredevil: Born Again”. The rumor comes days ahead of the show’s premiere next week and just as production is getting underway on the […]"
full_description = "TV News Two Returning For “Daredevil: Born Again” S2? By Garth Franklin - Saturday, March 1st 2025 5:23 pm Marvel A new rumor this weekend from scooper MyTimeToShineH has suggested that both Frank Castle/The Punisher (Jon Bernthal) and Benjamin “Dex” Poindexter/Bullseye (Wilson Bethel) will be back for the second season of Marvel’s “Daredevil: Born Again”. The rumor comes days ahead of the show’s premiere next week and just as production is getting underway on the show’s eight-episode second season which is expected to air next year. Bernthal’s return isn’t a surprise, especially in the wake of the reports that the character will be getting his own Disney+ Special Presentation in 2026. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); Marvel Studios’ Head of Streaming Brad Winderbaum previously said the aim of the second season is to air next year, and then “hopfeully season 3 and season infinity after that”. Reactions to the entire nine-episode run of the first season have started coming in with unanimous raves so far, some calling it the best Marvel series to date whereas others consider it stronger than some of the prior Netflix seasons (especially Season 2). Winderbaum previously confirmed this week that both “Your Friendly Neighborhood Spider-Man” and “X-Men ’97” animated shows will also return with their second seasons in 2026. .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous articleFinal Oscar Predictions As Ford Drops Out Garth Franklin"
