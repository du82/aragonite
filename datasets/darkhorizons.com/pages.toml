["https://www.darkhorizons.com/krysten-ritter-joins-dexter-resurrection"]
title = 'Krysten Ritter Joins "Dexter: Resurrection" - Dark Horizons'
description = "Former “Jessica Jones” and “Breaking Bad” star Krysten Ritter has scored a high-profile and multiple-episode guest role on Paramount+ with Showtime’s sequel series “Dexter: Resurrection”. Ritter will recur as Mia Lapierre, a famed sommelier who may also be a serial killer. The series has been filming for a month in New York with Ritter posting […]"
full_description = "TV News Krysten Ritter Joins “Dexter: Resurrection” By Garth Franklin - Thursday, February 27th 2025 8:16 pm AMC Former “Jessica Jones” and “Breaking Bad” star Krysten Ritter has scored a high-profile and multiple-episode guest role on Paramount+ with Showtime’s sequel series “Dexter: Resurrection”. Ritter will recur as Mia Lapierre, a famed sommelier who may also be a serial killer. The series has been filming for a month in New York with Ritter posting on Thursday morning she’s headed there shortly. The comment stirred fan talk online as the second season of “Daredevil: Born Again” is set to commence shooting on Friday – also in New York. Marvel’s Brad Winderbaum the other week indicated that the studio was ‘exploring’ the idea of bringing back other characters from the Marvel-Netflix era like Ritter’s Jessica Jones. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); The series serves as a second season of the revival series “Dexter: New Blood”. It will continue the events of ‘New Blood’ and will be set in the present day. Michael C. Hall will return as serial killer Dexter Morgan, joined by fellow returning franchise alum David Zayas as Detective Angel Batista, Jack Alcott as Harrison Morgan, and James Remar as Harry Morgan. Joining them are Peter Dinklage as a billionaire venture capitalist, and Uma Thurman as said capitalist’s head of security. The series is expected to premiere this Summer. Source: TV Line .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate)