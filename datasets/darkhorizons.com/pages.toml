full_description = "TV News “Crazy Rich Asians” Becoming A Max Series? By Garth Franklin - Friday, February 28th 2025 1:10 pm Warner Bros. Pictures The Max streaming service has officially begun development of a TV series based on the “Crazy Rich Asians” book series by Kevin Kwan reports Deadline. Adele Lim, who co-wrote the film’s script with Peter Chiarelli, will serve as executive producer, writer and showrunner on the series. Also onboard to executive produce are Kwan and the original film’s director Jon M. Chu. There have reportedly been unofficial conversations with the original cast about possibly returning, but no creative direction for the series has yet to be determined so it’s a little early. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); Sources for the trade indicate the show will NOT replace the long-awaited sequel to the 2018 film which is still in development. The original follows the love story between Chinese-American Rachel (Constance Wu) and her fiancé Nick (Henry Golding) as they travel to visit his family and friends in his native Singapore. Rachel is surprised to discover that Nick’s family is extremely rich and extremely traditional with issues of their own. Constance Wu, Henry Golding, Michelle Yeoh, Gemma Chan, Nico Santos, Ronny Chieng, Jimmy O. Yang, Ken Jeong and Awkwafina co-starred. .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img 