title = 'Second Trailer: The "Until Dawn" Movie - Dark Horizons'
description = "A second trailer has arrived for filmmaker David F. Sandberg’s horror feature “Until Dawn,” an adaptation of the acclaimed 2015 PlayStation game of the same name. The film is said to be a new story set in the same world rather than an actual adaptation of the game’s narrative, which had hundreds of potential storyline […]"
full_description = "Movie News Trailers Second Trailer: The “Until Dawn” Movie By Garth Franklin - Thursday, February 13th 2025 6:46 am Sony Pictures A second trailer has arrived for filmmaker David F. Sandberg’s horror feature “Until Dawn,” an adaptation of the acclaimed 2015 PlayStation game of the same name. The film is said to be a new story set in the same world rather than an actual adaptation of the game’s narrative, which had hundreds of potential storyline permutations depending on player choice. This tries to evoke that by using a time loop concept. The story begins one year after Clover’s sister Melanie mysteriously disappeared. Clover and her friends head into the remote valley where she vanished in search of answers. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); Exploring an abandoned visitor center, they find themselves stalked by a masked killer and horrifically murdered one by one…only to wake up and find themselves back at the beginning of the same evening. Trapped in the valley, they’re forced to relive the nightmare again and again – only each time the killer threat is different, each more terrifying than the last. Hope dwindling, the group soon realizes they have a limited number of deaths left, and the only way to escape is to survive until dawn. Sandberg directs from a script by Gary Dauberman (“Salem’s Lot,” “IT”). Ella Rubin, Michael Cimino, Maia Mitchell, Belmont Cameli, Ji-young Yoo and Odessa A’zion lead the cast while Peter Stormare reprises his role from the game. “Until Dawn” will open in cinemas April 25th. .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous articleKrasinski’s “Jack Ryan” Movie Adds Four More Next article“Rings of Power” Renewed For Season 3 Garth Franklin"
