["https://www.darkhorizons.com/about-us"]
title = "About Us - Dark Horizons"
description = "Founded in January 1997 in Australia, Dark Horizons® is not only one of the world’s top sources for online entertainment news, but one of the most widely respected and well regarded with experience in this medium that few can match. With a focus squarely on the industry rather than celebrity gossip, and a predilection for […]"
full_description = "About Us Founded in January 1997 in Australia, Dark Horizons® is not only one of the world’s top sources for online entertainment news, but one of the most widely respected and well regarded with experience in this medium that few can match. With a focus squarely on the industry rather than celebrity gossip, and a predilection for genre fare, the site has amassed a very large and intensely loyal readership over the years including corporate professionals, early adopters, influential industry insiders, marketing & PR departments, and film and tech journalists. Said readership is matched only by its internal industry reputation as one of the most fair, balanced and objective sites in the field, one that avoids the hyperbole of over editorialising. It also delivers the news with a voice of authority and experience thanks to its editor Garth Franklin who has blazed the trail in the online publishing field since the Internet’s early days back in the mid-1990’s. If you have a scoop you’d like to submit, please use the Contact Us form already provided. If you’d like to syndicate our content, Dark Horizons® has affordable plans that let you reprint our content in your newspaper, in your newsletter, or on your website or blog. Contact us for more information. Garth Franklin Editor, Writer, Designer, Webmaster, Creator One of the very first online entertainment journalists, Sydney-based Garth Franklin has clocked up more hours, stories and experience in this field than the entire staff of various other sites combined. Respected and well-regarded amongst his peers, Franklin created and designed the very first Dark Horizons® incarnation on geocities.com back in April 1996 and has steered it through at least four major re-designs, two recessions, hundreds of interviews, thousands of screenings, and tens of thousands of articles. Garth’s work over the past nearly twenty years has taken him all over the globe to places like Auckland, Albuquerque, Atlanta, Bangkok, Baton Rouge, Berlin, Calgary, Chicago, Dallas, Edmonton, Harare, Hwange, Honolulu, Istanbul, Johannesburg, Las Vegas, London, Los Angeles, Melbourne, Nadi, Naples, New York City, Paris, Perth, Prague, Rome, Rotorua, San Diego, San Francisco, Siem Reap, Singapore, Surfer’s Paradise, Suva, Toronto, Vancouver, Venice and Wellington. He has regular consulted with and/or worked alongside publicists, managers, producers, studio VPs, agents, filmmakers and celebrities in the US, UK, Europe and Australia. Franklin, who is also a ‘Top Critic’ on Rotten Tomatoes and member of the Australian Film Critics Association, has also contributed columns for several outlets including Empire Magazine Australia, Cinescape Magazine and AOL, served as a film critic on both Foxtel’s Channel V and ABC Radio 702 with Angela Catterns, contributed content or towards pieces for numerous outlets ranging from IGN to USA Today to the U.S. Armed Forces Radio and Television Service, and guested on several podcasts including The Leaky Cauldron, Smodcast’s Team Jack, Pod Save Our Screen and Hell is for Hyphenates. Contact: Mail, Facebook, Twitter Blake Howard Australian Contributor A Michael Mann fanatic all the time, Blake Howard is an Aussie film writer, editor and member of the Online Film Critics Society. Co-founder of the acclaimed Australian film website Graffiti with Punctuation, he offers articulate analysis across the gamut of cinema from blockbusters to indies galore. A former co-host of That Movie Show 2UE, he’s also behind the top-rating film podcasts such as Pod Save Our Screen and The Debrief, a freelance contributor to outlets from Penthouse to ABC News 24, and a co-host of the weekly ‘Gaggle of Geeks’ on 2SER radio. Contact: Twitter, Website Maria Lewis Australian Contributor Maria Lewis is a New Zealand born, Queensland raised author, screenwriter, journalist and pop culture commentator. She began her career at the age of sixteen as a cadet at the Gold Coast Bulletin covering the crime and police beat for several years. Her work on pop culture has appeared in publications such as Empire Magazine, Penthouse, Junkee, New York Post, The Guardian, SFX Magazine, The Daily Mail, Film Ink, i09, The Daily and Sunday Telegraph, SBS, Herald Sun, BuzzFeed, ABC, Screen Australia, WHO Weekly and Bloody Disgusting. Contact: Twitter Drew Turney Australian Contributor A hard-working Australian journalists who has written for publications and institutions throughout Australia including The West Australian, Penthouse, The Sydney Morning Herald, Australian MacWorld, Xpress Magazine and The Seaside Observer. Along with writing general features on everything from celebrities and business to ideas and culture, he’s written over 15 novels, dozens of short stories, poetry, and a journal now in its 20th year. Contact: Mail, Website Further Contact Information DarkHorizons.com is wholly owned and operated by Dark Futures Pty. Limited (ACN: 081244171) based in Sydney, Australia. Dark Horizons® is a registered trademark of Dark Futures Pty. Limited. Contact details below: Phone: +61 417 467 238 E-Mail: garth@darkhorizons.com Past contributors have also included: Paul Fischer, Brian Orndorf, Jeff Otto, Josh Hylton and Tom Brennan. Follow Us On:"
