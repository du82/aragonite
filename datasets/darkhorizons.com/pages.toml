description = "Netflix has released the first trailer for “Havoc,” the long-in-the-works action thriller starring Tom Hardy and directed by “The Raid” filmmaker Gareth Evans. After a drug deal gone wrong, a bruised detective must fight his way through a criminal underworld to rescue a politician’s estranged son, while unravelling a deep web of corruption and conspiracy […]"
full_description = "Movie News Trailers Teaser: Tom Hardy In Gareth Evans’ “Havoc” By Garth Franklin - Wednesday, February 26th 2025 2:41 pm Netflix Netflix has released the first trailer for “Havoc,” the long-in-the-works action thriller starring Tom Hardy and directed by “The Raid” filmmaker Gareth Evans. After a drug deal gone wrong, a bruised detective must fight his way through a criminal underworld to rescue a politician’s estranged son, while unravelling a deep web of corruption and conspiracy that ensnares his entire city. The film was famously shot all the way back in 2021 and then wrapped reshoots in July last year with post-production still underway. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); Evans said the reshoots allowed him to streamline the movie and do the film he wanted to do after not quite getting what he needed with the main shoot. He calls the project “a blistering, fast-paced action-thriller with nods to the Hong Kong cinema that I grew up watching.” Forest Whitaker, Timothy Olyphant, Justin Cornwell, Luis Guzmán, Jessie Mei Li, Yeo Yann Yann, Sunny Pang, Jim Caesar, Xelia Mendes-Jones, Quelin Sepulveda and Michelle Waterson co-star in “Havoc” which will hit Netflix on April 25th. .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous articleZaslav Wasn’t Happy About “Joker 2” Failure Next articleWhy Chris Nolan Didn’t Do A Bond Film Garth Franklin"
