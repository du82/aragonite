title = 'New "Superman" Photo, Early Screening Talk - Dark Horizons'
description = "DC Studios chief James Gunn marked the one-year anniversary of the start of production of his “Superman” film by releasing a new photo of David Corenswet’s Superman in his boots in the snow in Norway where filming began. Gunn made headlines earlier this week speaking about the DC slate and teasing he’s very keen on […]"
full_description = "Movie News New “Superman” Photo, Early Screening Talk By Garth Franklin - Friday, February 28th 2025 1:26 pm Warner Bros. Pictures DC Studios chief James Gunn marked the one-year anniversary of the start of production of his “Superman” film by releasing a new photo of David Corenswet’s Superman in his boots in the snow in Norway where filming began. Gunn made headlines earlier this week speaking about the DC slate and teasing he’s very keen on a project not yet announced that no-one has guessed as yet. Unsurprisingly speculation about said project has been rife in the past few days with The Hot Mic suggesting a Superman/Batman team-up film. Meanwhile The InSneider reported that the most recent cut of the film received great feedback in test screenings and allegedly performed far better than in ones held last year with a rougher earlier cut of the film. Then he did an about face during his Hot Mic appearance, saying his best source tells him the film hasn’t improved. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); The Wrap has reported that marketing veteran Ricky Strauss has been tapped to consult on the film. Strauss has previously led marketing campaigns for the Apple TV+ sercice. Gunn previously indicated (via CBM) he may be walking back his no reshoots stance, indicating that “we might shoot a couple little, tiny things” during the press event the other day. “Superman” is due out in cinemas on July 11th. One year ago today. Longyearbyen, Svalbard. Faster than a speeding bullet toward July 11, 2025. #Superman pic.twitter.com/3YaejQCLYw — James Gunn (@JamesGunn) February 28, 2025 .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous article“Crazy Rich Asians” Becoming A Max Series? Next article2025 Razzie Winners & Coppola Responds Garth Franklin"
