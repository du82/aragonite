full_description = "Movie News Trailers Teaser Trailer: “Fear Street: Prom Queen” By Garth Franklin - Tuesday, February 25th 2025 1:37 pm Netflix Netflix has premiered the teaser trailer for its upcoming “Fear Street: Prom Queen,” their fourth film adaptation of the R.L. Stine teen horror novel of the same name which has set a May 23rd release date. Previously, Netflix adapted three stories from the book series into a full trilogy of films which were released over three back-to-back weeks on the streamer in July 2021. Leigh Janiak helmed the films which all received very positive reviews. In the new film it’s prom season at Shadyside High is underway and the school’s wolfpack of It Girls is busy with its usual sweet and vicious campaigns for the crown. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); When a gutsy outsider is unexpectedly nominated to the court, and the other girls start mysteriously disappearing, the class of 1988 is suddenly in for one hell of a prom night. The film is said to be the first of several more “Fear Street” films in development. The young cast includes Fina Strazza, India Fowler, Arianna Greenblatt, Ella Rubin and Rebecca Ablack, while older cast members include Chris Klein, Lili Taylor, Katherine Waterston, David Iacono and Suzanna Son. Matt Palmer directs and co-wrote the screenplay with Donald McLeary. Kori Adelson, Dan Bernard, Peter Chernin, August Linn, and Jenno Topping produce. .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:tran