full_description = "Movie News Trailers New Trailer: Statham In Ayer’s “Working Man” By Garth Franklin - Thursday, February 27th 2025 8:17 pm Amazon MGM Studios Amazon MGM Studios has released a new red-band trailer for David Ayer’s new action thriller “A Working Man”. The project sees Ayer re-team with his “The Beekeeper” star Jason Statham. Statham stars as Levon Cade, a man who left behind a decorated military career in the black ops to live a simple life working construction. When his boss’s daughter, who is like family to him, is taken by human traffickers, his search to bring her home uncovers a world of corruption far greater than he ever could have imagined. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); David Harbour, Jason Flemyng, Merab Ninidze, Maximilian Osinski, Cokey Falkow, Michael Peña, Noemi Gonzalez, Arianna Rivas, Emmett J. Scanlan, and Eve Mauro co-star. The film is based on Chuck Dixon’s 2014 novel “Levon’s Trade” with the script adapted by both Ayer and Sylvester Stallone. Statham, Ayer, and Stallone produce alongside Chris Long, John Friedberg, Bill Block, and Kevin King Templeton. “A Working Man” will open in cinemas on March 28th. .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous articleKrysten Ritter Joins “Dexter: Resurrection” Next articleGame News: Dragon, AI, Live-Service, Terminator Garth Franklin"
