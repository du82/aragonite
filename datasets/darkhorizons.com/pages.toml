description = "BritBox has released the official trailer for the new three-episode limited series adaptation of Agatha Christie‘s 1944 mystery novel “Towards Zero”. Oscar winner Angelica Huston, Emmy winner Matthew Rhys, Oliver Jackson-Cohen, Mimi Keene, Ella Lily Hyland, Anjana Vasan and Clarke Peters lead the cast. Rhys plays a troubled detective who must rediscover his purpose to […]"
full_description = "TV News Series Trailer: “Agatha Christie’s Towards Zero” By Garth Franklin - Friday, February 28th 2025 2:28 pm Britbox BritBox has released the official trailer for the new three-episode limited series adaptation of Agatha Christie‘s 1944 mystery novel “Towards Zero”. Oscar winner Angelica Huston, Emmy winner Matthew Rhys, Oliver Jackson-Cohen, Mimi Keene, Ella Lily Hyland, Anjana Vasan and Clarke Peters lead the cast. Rhys plays a troubled detective who must rediscover his purpose to untangle a toxic web of jealousy, deceit and dysfunction that is responsible for a murder on a family estate in England in 1936. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); After a scandalous celebrity divorce, British tennis star Nevile Strange and his ex-wife Audrey choose to spend a summer together at Gull’s Point – their childhood home and the coastal estate of his aunt Lady Tressilian. Tensions run high with the added presence of Nevile’s new wife Kay along with Tressilian’s long-suffering companion, a mysterious valet, a grudge-holding exiled cousin, a venerable family lawyer, an inquisitive orphan and a French con man. Penned by Rachel Bennette and directed by Sam Yates, the streamer will release the episodes daily from Wednesday April 16th through to Friday April 18th. .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max