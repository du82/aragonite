["https://www.darkhorizons.com/sonic-response-to-shrek-5-redesign"]
title = 'Sonic Team Response To "Shrek 5" Redesign - Dark Horizons'
description = "The last two days has seen a raging debate on social media about the recently released “Shrek 5” teaser trailer. Running just a few seconds, the clip is more of a casting announcement piece revealing Zendaya has a role as Shrek’s daughter in the film with the character revealed alongside her returning family and Pinocchio. […]"
full_description = "Movie News Sonic Team Response To “Shrek 5” Redesign By Garth Franklin - Saturday, March 1st 2025 2:52 pm Universal Pictures The last two days has seen a raging debate on social media about the recently released “Shrek 5” teaser trailer. Running just a few seconds, the clip is more of a casting announcement piece revealing Zendaya has a role as Shrek’s daughter in the film with the character revealed alongside her returning family and Pinocchio. It’s those character designs that have stirred discussion. It has been 14 years since the fourth “Shrek” film hit, and almost 24 years since the original debuted – computer graphics have considerably improved since then. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); As a result, the characters sport a slightly updated look that has led to a debate as to whether it deviates too far from the original. Comparisons have been made to the early ‘Ugly Sonic’ trailer which caused that film to completely redesign its character animation to what we see in the final “Sonic” films. Now, the official “Sonic the Hedgehog” movie account has weighed in on the debate, doing a TikTok commenting on the redesign. That has only stirred up the discussion again with the general consensus being the “Shrek” redesign is nowhere near as drastic as the ‘Ugly Sonic’. “Shrek 5” is still in production and set for a release Christmas 2026. The official ‘Sonic Movie’ account has made a TikTok about the ‘Shrek 5’ redesigns: “for any green ogres looking for advice” pic.twitter.com/bN3WMtMN02 — ToonHive (@ToonHive) March 1, 2025 .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous article“Captain” Low, “Breath” Gasps At Box-Office Next article“Superman” Star Corenswet Talks Criticism Garth Franklin"
