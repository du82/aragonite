title = "Do Not Sell My Personal Information - Dark Horizons"
description = "Under the California Consumer Privacy Act of 2018 (CCPA/CRPA), beginning January 1, 2020, California residents have the right to opt-out of the sale of personal information about them or their household, such as (though not limited to) their name, postal or email address, and other personally-identifying information. You need not be physically present in California […]"
full_description = "Do Not Sell My Personal Information Under the California Consumer Privacy Act of 2018 (CCPA/CRPA), beginning January 1, 2020, California residents have the right to opt-out of the sale of personal information about them or their household, such as (though not limited to) their name, postal or email address, and other personally-identifying information. You need not be physically present in California to exercise this right provided that you have a current California residence. This right is subject to certain exemptions. For example, the law does not apply to information that has been aggregated and/or de-identified such that it could not reasonably be used to identify you. It also does not apply to information that we share with third-party service providers in order for them to perform certain business functions for us. Our Privacy Policy, Cookie Policy and Notice at Collection offer a complete rundown on what information we and third-party service providers use on the site collect and how it is used. All should be consulted before proceeding further. Dark Horizons® is owned and operated out of Australia and does not sell personal information to third parties for monetary or other valuable consideration. We are also committed to providing visitors with as many privacy choices as we reasonably can. How To Exercise Your Opt-Out Rights or Other California Privacy Rights If you would like to opt-out of the sale of your personal information, or to exercise the other rights provided by the CCPA/CRPA, there are multiple options available. If you are only concerned about our display advertisers potentially obtaining any personal information, sites like AdChoices and Network Advertising Initiative offer single-click solutions to stopping personalised ads across dozens of ad networks, including those used here and much of the internet. In addition you can adjust your avertising prefrences at any time either by clicking here or on the link in the footer of every page of this site. Our Privacy Policy and Cookie Policy both offer multiple options to opt-out and remove data yourself including not just with advertisers but our other third-party service providers as well. Alternatively, you or your authorized agent or representative may fill in the form below. Except as otherwise required by law, requests pertaining to children under 18 should be submitted by a parent, legal guardian, or another authorized adult representative. As with the right to opt-out, the other rights provided by the CCPA/CRPA are subject to certain exemptions and exceptions. Those statutes and/or regulations may also stipulate the maximum time allowed for acknowledging and responding to a request. There is no charge for making privacy-related requests, but legally consumers may only make a request for information twice a year at most and only for a twelve-month look-back period. Please note that, in order better to safeguard your privacy and the privacy of others, we will be required to verify your identity before processing certain data-related requests. Consult the ‘Your California Privacy Rights’ section of the Privacy Policy for more information about verification requirements which will vary depending upon the request. For example, under CCPA/CRPA draft regulations requests for access to specific pieces of personal information requires us to match at least three pieces of a consumer’s personal information, and the consumer to submit a signed declaration under penalty of perjury. In addition, for a request made by an authorized agent – the regulations provide that we may require written permission from the consumer and that the consumer verify their own identity directly with us, unless the consumer has provided the agent with power of attorney pursuant to probate laws. We may also request additional information for the purposes of verifying the identity, and for security or fraud prevention purposes. We shall delete any new personal information for verification as soon as practical, except as required to comply with record-keeping obligations. In some cases, we may be unable to fulfil your request because we have no reasonable method by which we can verify your identity to the standard that the law and/or its associated regulations require. For example (but without limitation), if you have visited our website but never submitted a Contact Form, we may not have enough information to confirm your identity to even a ‘reasonable degree of certainty’ (as the applicable regulations may define that term). If we can not, we shall state so in our response to your request and explain why. Also, in addition to any other exemptions applicable law and/or regulation may provide to your rights under the CCPA/CRPA (particularly with regard to the deletion of your personal information), we may be unable to delete certain information (e.g., our web host’s server and error logs) for technical reasons. To learn more about what kinds of information we gather in connection with this website and/or its associated services, please consult the Privacy Policy and Cookie Policy. Please enable JavaScript in your browser to complete this form. Full Legal Name * Email * Email Confirm Email Address * Address Line 1 Address Line 2 City State / Province / Region Postal Code --- Select country --- Afghanistan Albania Algeria American Samoa Andorra Angola Anguilla Antarctica Antigua and Barbuda Argentina Armenia Aruba Australia Austria Azerbaijan Bahamas Bahrain Bangladesh Barbados Belarus Belgium Belize Benin Bermuda Bhutan Bolivia (Plurinational State of) Bonaire, Saint Eustatius and Saba Bosnia and Herzegovina Botswana Bouvet Island Brazil British Indian Ocean Territory Brunei Darussalam Bulgaria Burkina Faso Burundi Cabo Verde Cambodia Cameroon Canada Cayman Islands Central African Republic Chad Chile China Christmas Island Cocos (Keeling) Islands Colombia Comoros Congo Congo (Democratic Republic of the) Cook Islands Costa Rica Croat