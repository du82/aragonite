ill play an active role in the third game despite the events at the end... Cinema Roof Collapses During Marvel Screening Garth Franklin - Friday, February 28th 2025 5:10 pm 0 Video and photos have been released of a movie theater in the U.S. state of Washington that partly collapsed during a screening of Marvel Studios' "Captain America: Brave New World" on Tuesday night. The Wenatchee Valley Fire Department released the... The Rock Tops 2024’s Highest Paid Actors List Garth Franklin - Friday, February 28th 2025 3:37 pm 0 Publication Forbes has released their annual list of the highest-paid actors, with "Red One" starrer Dwayne Johnson coming out at #1 for 2024 with $88 million ($103 million gross). Johnson's total fee for "Red One" came in at $50 million,... More Details On Gene Hackman’s Passing Garth Franklin - Friday, February 28th 2025 3:21 pm 0 Further details have emerged about the passing of iconic actor Gene Hackman following the reports of his death the other day. As previously indicated, the 95-year-old Hackman, his 63-year-old wife Betsy Arakawa and their dog were all found dead in... Series Trailer: “Agatha Christie’s Towards Zero” Garth Franklin - Friday, February 28th 2025 2:28 pm 0 BritBox has released the official trailer for the new three-episode limited series adaptation of Agatha Christie‘s 1944 mystery novel "Towards Zero". Oscar winner Angelica Huston, Emmy winner Matthew Rhys, Oliver Jackson-Cohen, Mimi Keene, Ella Lily Hyland, Anjana Vasan and Clarke... Trailer: Max’s Horror-Comedy “The Parenting” Garth Franklin - Friday, February 28th 2025 2:10 pm 0 Max has premiered the trailer for "The Parenting," a screwball comedy meets haunted house thriller feature starring a quite impressive cast and set for release in just two weeks. The story follows young couple Rohan (Nik Dodani) and Josh (Brandon... 2025 Razzie Winners & Coppola Responds Garth Franklin - Friday, February 28th 2025 1:49 pm 0 This year's Razzie Awards, celebrating the worst in film