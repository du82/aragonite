description = "Further details have emerged about the passing of iconic actor Gene Hackman following the reports of his death the other day. As previously indicated, the 95-year-old Hackman, his 63-year-old wife Betsy Arakawa and their dog were all found dead in their home in the US state of New Mexico. The boides were found after a […]"
full_description = "Movie News More Details On Gene Hackman’s Passing By Garth Franklin - Friday, February 28th 2025 3:21 pm 20th Century Studios Further details have emerged about the passing of iconic actor Gene Hackman following the reports of his death the other day. As previously indicated, the 95-year-old Hackman, his 63-year-old wife Betsy Arakawa and their dog were all found dead in their home in the US state of New Mexico. The boides were found after a home maintenance worker called in a welfare check. Now, Santa Fe County Sheriff Adan Mendoza has revealed in a Friday press conference that Hackman’s pacemaker has revealed his ‘last event’ took place on February 17th – nine days before the bodies were discovered. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); Mendoza says putting a timeline together on their passing has been difficult, but based on the evidence it “appears several days, possibly even up to a couple weeks” have passed since their passing. Citing the pathologist’s report, both individuals tested negative for carbon monoxide and there was no external trauma to either individual. Official autopsy and toxicology reports are pending, but manner and cause of death has not yet been determined. Tributes to Hackman have been flooding the internet for the past two days, with various actors and filmmakers who’ve worked with him relating their experiences. Morgan Freeman, Clint Eastwood, Kevin Costner and many more have shared stories of their time with the classic actor and paint a picture of a classic old school actor and straight talker. Source: The Wrap .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous articleSeries Trailer: “Agatha Christie’s Towards Zero” Next articleThe Rock Tops 2024’s Highest Paid Actors List Garth Franklin"
