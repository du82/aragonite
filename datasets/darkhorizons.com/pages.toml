title = '"Captain" Low, "Breath" Gasps At Box-Office - Dark Horizons'
description = "While overall domestic box-office is up 11% over the same time last year, this weekend is looking to be the second lowest of the year to date – behind only the Super Bowl weekend. Marvel Studios’ “Captain America: Brave New World” will come in first place with a $15 million third weekend – a drop […]"
full_description = "Movie News “Captain” Low, “Breath” Gasps At Box-Office By Garth Franklin - Saturday, March 1st 2025 1:46 pm Focus Features While overall domestic box-office is up 11% over the same time last year, this weekend is looking to be the second lowest of the year to date – behind only the Super Bowl weekend. Marvel Studios’ “Captain America: Brave New World” will come in first place with a $15 million third weekend – a drop of 47% which is a fairly decent hold that is being attributed to its IMAX presence. Its total domestic haul should hit $163 million by end of the weekend, which paints a rosier picture than “The Marvels” but is still tracking behind ‘Quantumania’ in its third weekend. The sole new wide release is the Woody Harrelson and Simu Liu deepsea diver thriller “Last Breath” which landed an ordinary B+ CinemaScore and fairly good critical reviews. The title is heading for a $7.3 million opening weekend which seems small, but with its tight $24 million budget it’s a decent start. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); NEON’s horror “The Monkey” will come in third with $6.2 million, a 55% drop for its second weekend which is a better number than anticipated. Fourth will be “Paddington in Peru” with $4.5 million, down just 31% in its third weekend. Rounding out the top five is “Dog Man” which is headed for $4 million and a drop of 32% in its fifth week, a strong hold despite the title having been available via PVOD for nearly two weeks now. GKIDS also launched the Kazuya Tsurumaki-directed anime film “Mobile Sult Gundam GQuuuuuuX-Beginning” which made it into tenth position with a $1 million haul expected. Source: Deadline .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous articleNetflix Buying Portman/Dunham Film For $55MNext articleSonic Team Response To “Shrek 5” Redesign Garth Franklin"
