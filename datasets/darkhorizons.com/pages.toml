title = 'Full Trailer: Oscar Isaac Is "The King of Kings" - Dark Horizons'
description = "Blue Harbor Entertainment and Angel Studios have premiered the full-length trailer for “The King of Kings,” the new animated, faith-based film set to open at Easter. The inspirational time-spanning film is loosely based on “The Life of Our Lord” – a posthumously published Charles Dickens short story which focuses on the life and times of […]"
full_description = "Movie News Trailers Full Trailer: Oscar Isaac Is “The King of Kings” By Garth Franklin - Monday, February 17th 2025 7:11 pm Angel Studios Blue Harbor Entertainment and Angel Studios have premiered the full-length trailer for “The King of Kings,” the new animated, faith-based film set to open at Easter. The inspirational time-spanning film is loosely based on “The Life of Our Lord” – a posthumously published Charles Dickens short story which focuses on the life and times of Jesus Christ. In the story, Dickens goes on a multidimensional adventure with his youngest son Walter, engaging his vivid imagination with the fascinating life of Jesus from his various challenges to his friends and enemies. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); Oscar Isaac will voice Jesus in the film, though only gets a few lines in the trailer. Much of the preview is dominated by Kenneth Branagh as Charles Dickens. Also starring are Ben Kingsley as High Priest Caiaphas, Forest Whitaker as Peter, Uma Thurman as Catherine Dickens, Mark Hamill as King Herod, Pierce Brosnan as Pontius Pilate and Roman Griffin Davis as Walter Dickens. Seong-ho ‘Jay’ Jang directs the film with South Korea-based animation house Mofac Animation providing the animation. Jang co-wrote King of Kings with Rob Edwards (“The Princess and the Frog”). “King of Kings” will be released in theaters in the U.S. on April 11th. .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous articleMarvel Unfazed By “Brave New World” Reviews Next articleSNL50 Anniversary Special Was A Ratings Hit Garth Franklin"
