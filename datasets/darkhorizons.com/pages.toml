["https://www.darkhorizons.com/imax-ready-to-go-nuclear-for-narnia"]
title = '''IMAX Ready To Go 'Nuclear' For "Narnia" - Dark Horizons'''
description = "A few weeks back came confirmation that Netflix had reached a deal with IMAX in regards to Greta Gerwig’s “The Chronicles of Narnia” film. Under the deal, the streamer would give the film a two-week exclusive window on IMAX screens around Thanksgiving 2026 – a month ahead of the movie launching on the streamer that […]"
full_description = '''Features Movie News IMAX Ready To Go ‘Nuclear’ For “Narnia” By Garth Franklin - Tuesday, February 25th 2025 6:41 pm Original "Chronicles of Narnia" image: Disney A few weeks back came confirmation that Netflix had reached a deal with IMAX in regards to Greta Gerwig’s “The Chronicles of Narnia” film. Under the deal, the streamer would give the film a two-week exclusive window on IMAX screens around Thanksgiving 2026 – a month ahead of the movie launching on the streamer that Christmas. Some have tried to spin this as Netflix testing the waters for larger theatrical exhibition plans, something the streamer subsequently denied. For them, it seems any potential theatrical release of an original film will be looked at on a case-by-case basis. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); Now a new report at Puck has tackled the missing part of this equation – the other studios and exhibitors. They indicate rival studios and U.S. cinema chains are “furious” about the deal and how it was made without other studios’ input. They claim Disney, who released two previous “Narnia” films, is said to be angry because it means their untitled animated movie scheduled for Thanksgiving 2026 has now lost out on IMAX screens (the studio also has a Marvel film opening a few weeks earlier on November 6th). Other theater chains like Regal and Cinemark have reportedly implied they won’t screen “Narnia” at all, but IMAX CEO Rich Gelfond claims to have a “nuclear option” to make theaters play Narnia on IMAX screens. Speculation about that ‘nuclear option’ ties to a potential deal with AMC Theaters which owns around 46% of the 400 IMAX screens in North America. AMC CEO Adam Aron says commenting on such a potential deal would be “inappropriate”. Filming on Gerwig’s “Narnia” film is slated to commence this Summer. .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous articleTV News: Mid, Neagley, Dead, Adolescene, You Next articleAMC CEO Wants Movies In Cinemas Way Longer Garth Franklin'''
