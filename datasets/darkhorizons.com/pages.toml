description = "Max has premiered the trailer for “The Parenting,” a screwball comedy meets haunted house thriller feature starring a quite impressive cast and set for release in just two weeks. The story follows young couple Rohan (Nik Dodani) and Josh (Brandon Flynn) as they plan a perfect weekend getaway in the country to introduce their parents. […]"
full_description = "Movie News Trailers Trailer: Max’s Horror-Comedy “The Parenting” By Garth Franklin - Friday, February 28th 2025 2:10 pm Max Max has premiered the trailer for “The Parenting,” a screwball comedy meets haunted house thriller feature starring a quite impressive cast and set for release in just two weeks. The story follows young couple Rohan (Nik Dodani) and Josh (Brandon Flynn) as they plan a perfect weekend getaway in the country to introduce their parents. As tensions begin to flare between the more traditional Sharon (Edie Falco) and Frank (Brian Cox) and the laid-back Liddy (Lisa Kudrow) and Cliff (Dean Norris), the families soon realize that their rental – managed by eccentric local Brenda (Parker Posey) – is haunted by the presence of a 400-year-old poltergeist. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); When one parent becomes thoroughly possessed, it’s up to the young couple and their meddlesome BFF Sara (Vivian Bang) to unite the families and stop the evil entity once and for all. Chloe Sciore, Keith R. Beck, John Hawe, Kate Avallone, Heidi Garza, Carolyn Holland and Nick Silva co-star in the film directed by Craig Johnson from a screenplay written by Kent Sublette. “The Parenting” will officially be available for streaming starting on Thursday, March 13th. .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@medi