title = "Netflix Buying Portman/Dunham Film For $55M - Dark Horizons"
description = "In what is rumored to be one of the biggest sales in the history of the European Film Market in Berlin, Netflix has won a major bidding war for the Lena Dunham-directed “Good Sex” starring Natalie Portman. According to"
full_description = "Movie News Netflix Buying Portman/Dunham Film For $55M By Garth Franklin - Saturday, March 1st 2025 1:34 pm Marvel In what is rumored to be one of the biggest sales in the history of the European Film Market in Berlin, Netflix has won a major bidding war for the Lena Dunham-directed “Good Sex” starring Natalie Portman. According to (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); Portman plays Ally, a 40-ish couple’s therapist who has a steamy fling with a 20-something Brooklyn hipster just as she begins a promising, more conventional relationship with Alan – a successful 50-something Manhattan executive. The script by “Girls” creator/star Dunham has drawn rave reviews with the project anticipating a 2025 shoot in New Jersey. Dunham, who most recently helmed “Catherine Called Birdy,” recently dropped out of directing a “Polly Pocket” movie to make this project. Portman is said to be a notable fan of Dunham’s 2009 debut “Tiny Furniture”. .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous articleMarvel Hit By “Avengers” Concept Art Leak? Next article“Captain” Low, “Breath” Gasps At Box-Office Garth Franklin"
