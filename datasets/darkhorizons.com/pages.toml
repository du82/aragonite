title = 'First Trailer: "The Accountant 2" - Dark Horizons'
description = "Amazon MGM Studios has released the first trailer for “The Accountant 2,” the sequel to the 2016 action-thriller which opens in cinemas this April. Stars Ben Affleck, Jon Bernthal, Cynthia Addai-Robinson and J.K. Simmons return along with director Gavin O’Connor and writer Bill Dubuque. The film follows on from the first which made $155 million […]"
full_description = "Movie News Trailers First Trailer: “The Accountant 2” By Garth Franklin - Thursday, February 13th 2025 12:36 pm Amazon MGM Studios Amazon MGM Studios has released the first trailer for “The Accountant 2,” the sequel to the 2016 action-thriller which opens in cinemas this April. Stars Ben Affleck, Jon Bernthal, Cynthia Addai-Robinson and J.K. Simmons return along with director Gavin O’Connor and writer Bill Dubuque. The film follows on from the first which made $155 million worldwide, and later became the most-rented digital film in 2017. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); Affleck starred in the first as Christian Wolff, a highly skilled accountant with autism who moonlights as a forensic accountant for criminal organizations. When he uncovers discrepancies in a robotics company, he must navigate a web of deceit to stay a step ahead of the law and his criminal clients. When he uncovers discrepancies in a robotics company, he must navigate a web of deceit to stay a step ahead of the law and his criminal clients. In the sequel, an old acquaintance is murdered, leaving behind a cryptic message to ‘find the accountant’. Christian is compelled to solve the case. Realizing more extreme measures are necessary, Wolff recruits his estranged and highly lethal brother, Brax (Jon Bernthal), to help. In partnership with U.S. Treasury Deputy Director Marybeth Medina (Cynthia Addai-Robinson), they uncover a deadly conspiracy, becoming targets of a ruthless network of killers who will stop at nothing to keep their secrets buried. Daniella Pineda and Allison Robertson join the cast for the second film. Affleck serves as a producer alongside Lynette Howell Taylor and Mark Williams. The movie releases in cinemas on April 25th. .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous articleTeaser Trailer: “Twisted Metal” Season 2 Next articleLinda Cardellini May Play Pamela Voorhees? Garth Franklin"
