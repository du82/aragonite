["https://www.darkhorizons.com/the-rock-tops-2024s-highest-paid-actors-list"]
title = "The Rock Tops 2024's Highest Paid Actors List - Dark Horizons"
description = "Publication Forbes has released their annual list of the highest-paid actors, with “Red One” starrer Dwayne Johnson coming out at #1 for 2024 with $88 million ($103 million gross). Johnson’s total fee for “Red One” came in at $50 million, which was combined with his fee for “Moana 2” and residuals from past films. Two […]"
full_description = "Movie News The Rock Tops 2024’s Highest Paid Actors List By Garth Franklin - Friday, February 28th 2025 3:37 pm Amazon MGM Studios Publication Forbes has released their annual list of the highest-paid actors, with “Red One” starrer Dwayne Johnson coming out at #1 for 2024 with $88 million ($103 million gross). Johnson’s total fee for “Red One” came in at $50 million, which was combined with his fee for “Moana 2” and residuals from past films. Two of his former co-stars are right up there with him – his “Red Notice” cohort Ryan Reynolds at #2 with $85 million ($100 million gross) and his “Central Intelligence” co-star Kevin Hart at #3 with $81 million ($108 million gross). The three together earned more than the rest of the Top 10 combined. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); Coming in fourth was Jerry Seinfeld with $60 million ($70 million gross), followed by Hugh Jackman with $60 million ($55 million gross), Brad Pitt with $32 million ($42 million gross), and George Clooney with $31 million ($37 million gross). Nicole Kidman was the highest grossing woman on the list in at #8 with $31 million ($41 million gross) thanks to two movies and three TV series last year. The next nearest woman on the list was “Law & Order” alum Mariska Hargitay with $25 million ($29 million gross) at #11. Rounding out the top ten were Adam Sandler with $25 million ($35 million gross) and Will Smith with $25 million ($30 million gross). Channing Tatum, Jason Statham, Mark Wahlberg, Matt Damon, John Cena, Denzel Washington, Jake Gyllenhaal, Scarlett Johansson and Joaquin Phoenix all made the top twenty. Age proved to be a factor, the average age of the top 20 earners is 54 with Scarlett Johansson being the youngest on the list at age 40. Many of these actors here aren’t just scoring earnings for this year but also profit participations from their large back catalogs. .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous articleMore Details On Gene Hackman’s Passing Next articleCinema Roof Collapses During Marvel Screening Garth Franklin"
