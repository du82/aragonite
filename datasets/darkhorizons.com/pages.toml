title = "Quick News: Spider-Man 3, Clayface, Anaconda, MobLand - Dark Horizons"
description = "Marvel’s Spider-Man 3 Voice actor Yuri Lowenthal, who voices Peter Parker in the “Marvel’s Spider-Man” video games from Insomniac Games, tells The Direct that Parker will play an active role in the third game despite the events at the end of the second. Lowenthal says: “Peter is not gone, he will be a part of […]"
full_description = "Movie News Quick News: Spider-Man 3, Clayface, Anaconda, MobLand By Garth Franklin - Friday, February 28th 2025 5:21 pm Insomniac Games Marvel’s Spider-Man 3 Voice actor Yuri Lowenthal, who voices Peter Parker in the “Marvel’s Spider-Man” video games from Insomniac Games, tells The Direct that Parker will play an active role in the third game despite the events at the end of the second. Lowenthal says: “Peter is not gone, he will be a part of the next game and he won’t be relegated to the couch, I promise.” A third main game in the franchise is not expected for several years and has yet to be officially confirmed by Insomniac or Sony. Clayface DC Studios chief James Gunn has debunked rumors that Daniel Radcliffe is being eyed for the “Clayface” movie, saying the report is “100% false” and adding: “We haven’t even started the casting process. Daniel is great but we certainly haven’t talked to or considered him.” James Watkins is directing the film which will be rated R. [Source: Threads] (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); Anaconda Filming has officially wrapped on the new “Anaconda” in Queensland, Australia. Paul Rudd and Jack Black lead the cast of the part-comedy creature feature which also stars Selton Mello, Thandiwe Newton, Steve Zahn, Daniela Melchior and Ione Skye. The reboot involves a group of friends facing mid-life crises who are remaking their favorite movie from their youth. They head to the rainforest, only to find themselves in a fight for their lives against natural disasters, giant snakes, and violent criminals. [Source: The Hollywood Handle] MobLand The first photos are out of Tom Hardy, Pierce Brosnan and Helen Mirren in Guy Ritchie’s new TV series “MobLand”. Paddy Considine, Joanne Froggatt and Lara Pulver co-star in the series which hits Paramount+ on March 30th. Hardy plays the enforcer for Brosnan and Mirren’s married couple who serve as the heads of an Irish organized crime family – a group fighting for power within a global crime syndicate. Tom Hardy est Harry Da Souza. Pierce Brosnan est Conrad Harrigan. Helen Mirren est Maeve Harrigan. #MobLand, bientôt sur Paramount+. pic.twitter.com/DsNFETcNRm — Paramount+ France (@ParamountPlusFR) February 28, 2025 .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous articleCinema Roof Collapses During Marvel Screening Next articleTrailer: “Mythic Quest” Spin-Off “Side Quest” Garth Franklin"
