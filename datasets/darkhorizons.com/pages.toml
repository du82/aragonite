8:16 pm 0 Former "Jessica Jones" and "Breaking Bad" star Krysten Ritter has scored a high-profile and multiple-episode guest role on Paramount+ with Showtime's sequel series "Dexter: Resurrection". Ritter will recur as Mia Lapierre, a famed sommelier who may also be a serial... Kathleen Kennedy Says “I’m Not Retiring” Garth Franklin - Thursday, February 27th 2025 5:08 pm 0 Following a busy week of trade reports and plenty of online speculation about Lucasfilm chief Kathleen Kennedy and her potential retirement, Kennedy herself has finally spoken publicly about what's going on. The big takeaway? She's not going anywhere anytime soon.... More Details On Axed “Wonder Woman” Game Garth Franklin - Thursday, February 27th 2025 4:07 pm 0 Following the news of game developer Monolith Productions being shut down by Warner Bros. Games, more details have emerged about the company's highly anticipated and now cancelled "Wonder Woman" game title. A long-term consultant on the game was veteran comic... “A Walk To Remember” Gets Rebooted Garth Franklin - Thursday, February 27th 2025 4:06 pm 0 Monarch Media has announced plans to reboot the Nicholas Sparks coming-of-age romance drama "A Walk to Remember" with the company securing the rights and enlisting the original film's producers Denise Di Novi and Hunt Lowry. Published in 1999, the original... “Gollum” Film Delayed, “Rings” Adds Cast Garth Franklin - Thursday, February 27th 2025 2:16 pm 0 Warner Bros. Pictures' live-action "The Lord of the Rings: The Hunt For Gollum" film won't be making its December 2026 cinema release as initially hoped. Andy Serkis, who both plays Gollum in the film and will be directing the project,... “The Beekeeper 2” To Shoot This Fall Garth Franklin - Thursday, February 27th 2025 1:37 pm 0 A sequel to 2024's Jason Statham vs. Phishers action thriller "The Beekeeper" is in the works with Miramax set to produce and finance. The first film saw Statham playing a retired intelligence operative who suffers a