title = "Cinema Roof Collapses During Marvel Screening - Dark Horizons"
description = "Video and photos have been released of a movie theater in the U.S. state of Washington that partly collapsed during a screening of Marvel Studios’ “Captain America: Brave New World” on Tuesday night. The Wenatchee Valley Fire Department released the photos and video which shows the ceiling of the Liberty Cinema having collapsed in the […]"
full_description = "Movie News Cinema Roof Collapses During Marvel Screening By Garth Franklin - Friday, February 28th 2025 5:10 pm Marvel Video and photos have been released of a movie theater in the U.S. state of Washington that partly collapsed during a screening of Marvel Studios’ “Captain America: Brave New World” on Tuesday night. The Wenatchee Valley Fire Department released the photos and video which shows the ceiling of the Liberty Cinema having collapsed in the middle of a screening. Firefighters responded to a reported ceiling collapse at 8pm on Tuesday night. Debris is seen strewn across multiple rows. The cause of the collapse is not known and is under investigation. Only two people were inside the theater at the time and, fortunately, no injuries were reported. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); Both reporredly heard strange noises but were unsure if they came from the ceiling or the movie. Wenatchee is located east of Seattle. Reaction has quickly flooded social media today, with most focused less on the damage on more on the fact that just two people were in attendance in a decent-sized theater for an evening screening of a major film in only its second full week of release. Others have taken this as a chance to talk about the state of movie exhibition. Have your say in the comments below. .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-