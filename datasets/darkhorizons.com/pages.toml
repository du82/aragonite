title = '"A Walk To Remember" Gets Rebooted - Dark Horizons'
description = "Monarch Media has announced plans to reboot the Nicholas Sparks coming-of-age romance drama “A Walk to Remember” with the company securing the rights and enlisting the original film’s producers Denise Di Novi and Hunt Lowry. Published in 1999, the original novel follows a rebellious high school senior in North Carolina who falls for a quiet, […]"
full_description = "Movie News “A Walk To Remember” Gets Rebooted By Garth Franklin - Thursday, February 27th 2025 4:06 pm Warner Bros. Pictures Monarch Media has announced plans to reboot the Nicholas Sparks coming-of-age romance drama “A Walk to Remember” with the company securing the rights and enlisting the original film’s producers Denise Di Novi and Hunt Lowry. Published in 1999, the original novel follows a rebellious high school senior in North Carolina who falls for a quiet, faith-driven girl after being forced to participate in a school play. They discover the transformative power of love, forgiveness and the beauty of living each day with purpose as she has leukemia and hasn’t been responding to treatment. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); Shane West and Mandy Moore starred in the original film directed by Adam Shankman, which made $48 million in cinemas from a $12 million budget but became a bigger hit on home video. Di Novi, Lowry, Steve Barnett, Alan Powell, Vicky Patel, Margaret French-Isaacand Patty Reed will produce. Di Novi is also currently prepping the sequel to “Practical Magic”. Sparks has sold over 130 million copies of his books worldwide, most of which are in the United States (92+ million). ‘Walk’ and “The Notebook” are considering the most famous film adaptations of his work. Source: Deadline .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.