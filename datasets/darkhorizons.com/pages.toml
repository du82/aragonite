title = 'Second Trailer: Rudd, Ortega In "Unicorn" - Dark Horizons'
description = "A24 has premiered the second trailer for its all-star black comedy/fantasy-horror tale “Death of a Unicorn” that is set to open in cinemas March 28th. Paul Rudd, Jenna Ortega, Richard E. Grant, Téa Leoni, Will Poulter, Anthony Carrigan, Sunita Mani, Jessica Hynes and Steve Park co-star in the project which was produced by Ari Aster […]"
full_description = "Movie News Trailers Second Trailer: Rudd, Ortega In “Unicorn” By Garth Franklin - Thursday, February 27th 2025 12:00 pm A24 A24 has premiered the second trailer for its all-star black comedy/fantasy-horror tale “Death of a Unicorn” that is set to open in cinemas March 28th. Paul Rudd, Jenna Ortega, Richard E. Grant, Téa Leoni, Will Poulter, Anthony Carrigan, Sunita Mani, Jessica Hynes and Steve Park co-star in the project which was produced by Ari Aster (“Herediatry”) and has a score composed by John Carpenter. (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); A satirical spin on modern capitalism and its systemic exploitation, the story centers on a father and his teenage daughter who accidentally kill a unicorn with their car on the way to a crisis management retreat. His boss, a wealthy billionaire and his family seize upon the moment, and their scientists discover that dead creatures’ flesh, blood, and horn are endowed with miraculous curative properties from which they could quickly make another fortune. Karma soon comes for these unethical people who discover deadly consequences from their actions. The project marks the directorial debut of Alex Scharfman who also wrote the script. .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous article“Hunger Games” Stage Play Sets Date Next articleFirst Photo: HBO & DC’s “Lanterns” Series Garth Franklin"
