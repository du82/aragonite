title = "Mobile App - Dark Horizons"
description = "In a time when mobile apps are proving cumbersome and outdated, Dark Horizons® has opted out of building a dedicated app. Instead, the entire site has been designed from the ground up to be completely responsive and thus fit with whatever device you’re browsing, plus it won’t go out of date like some apps do. […]"
full_description = "Mobile App In a time when mobile apps are proving cumbersome and outdated, Dark Horizons® has opted out of building a dedicated app. Instead, the entire site has been designed from the ground up to be completely responsive and thus fit with whatever device you’re browsing, plus it won’t go out of date like some apps do. The biggest convenience of an app, a single button launch, is available. All you need to do is add a bookmark of the site to your phone or tablet’s home screen. How do I do that? Simple. Here’s the instructions: For iOS Users 1. Navigate to the front page, or click on this link DarkHorizons.com 2. In the bottom bar, click on the middle icon – a square with an up arrow coming out from it. 3. In the pop up menu, click ‘Add to Home Screen’ button (has a ‘plus’ sign). 4. Click either the ‘Done’ or ‘Add’ button. 5. That’s it, you now have DH on your phone or tablet. For Android Users 1. Navigate to the front page by clicking on this link DarkHorizons.com 2. Click on menu, ‘Bookmark’, ‘Add a Bookmark’ and OK 3. Go back to the home screen, click and hold until the ‘Add to Screen’ menu appears. 4. Click ‘Shortcut’, ‘Bookmark’ and then the ‘Dark Horizons’ bookmark you previously created. 5. That’s it, you now have DH on your phone or tablet."
