title = "Legendary Actor Gene Hackman Has Died - Dark Horizons"
description = "Legendary actor Gene Hackman has died. Hackman, his wife Betsy Arakawa and their dog were all found dead in their home in the US state of New Mexico. Hackman was 95. Santa Fe County Sheriff Adan Mendoza confirmed the passing just after midnight Thursday local time. He said there was no immediate indication of foul […]"
full_description = "Features Movie News Legendary Actor Gene Hackman Has Died By Garth Franklin - Thursday, February 27th 2025 1:56 am Paramount Pictures Legendary actor Gene Hackman has died. Hackman, his wife Betsy Arakawa and their dog were all found dead in their home in the US state of New Mexico. Hackman was 95. Santa Fe County Sheriff Adan Mendoza confirmed the passing just after midnight Thursday local time. He said there was no immediate indication of foul play, but a cause of death hasn’t been provided. An investigation is ongoing. The sheriff said: “All I can say is that we’re in the middle of a preliminary death investigation, waiting on approval of a search warrant.” (function (d, s, b) { var mElmt, primisElmt = d.createElement('script'); primisElmt.setAttribute('type', 'text/javascript'); primisElmt.setAttribute('async','async'); primisElmt.setAttribute('src', s); var elmtInterval = setInterval(function() { mElmt = d.getElementById(b); if (mElmt) { mElmt.parentNode.insertBefore(primisElmt, mElmt.nextSibling); mElmt.parentNode.removeChild(mElmt); return clearInterval(elmtInterval); } }, 20); })(document, 'https://live.primis.tech/live/liveView.php?s=113101', 'widgetLoaded'); Hackman is a Hollywood icon. The famed former marine turned character actor appeared in over 80 films and won two Oscars for his role as Detective Jimmy ‘Popeye’ Doyle in William Friedkin’s “The French Connection” in 1971 and Sheriff ‘Little Bill’ Daggett in Clint Eastwood’s famed western “Unforgiven” in 1992. His career stretched from the 1960s through to the early 2000s and included countless memorable roles from Lex Luthor in Richard Donner’s “Superman” and several sequels, and Harry Caul in Coppola’s “The Conversation,” to Coach Norman Dale in “Hoosiers” and Senator Keeley in Mike Nichols’ “The Birdcage”. He scored Oscar nominations for this roles as FBI Special Agent Rupert Anderson in “Mississippi Burning,” Gene Garrison in Gil Cates’ “I Never Sang for My Father,” and Buck Barrow in “Bonnie and Clyde”. To an older generation he was known for his roles in “The Poseidon Adventure,” “A Bridge Too Far,” “Downhill Racer,” “Young Frankenstein,” “Uncommon Valor,” “Night Moves,” “Lucky Lady,” “Reds,” “No Way Out,” “Narrow Margin,” “Class Action,” “Loose Cannons” and “Postcards from the Edge”. To a younger generation he had memorable turns in “The Firm,” “Enemy of the State,” “Crimson Tide,” “The Quick and the Dead,” “Heartbreakers,” “The Royal Tenenbaums,” “Heist,” “Get Shorty,” “Wyatt Earp,” “Absolute Power,” “Hoosiers,” “Antz,” “The Replacements,” “The Mexican,” “Behind Enemy Lines” and “Runaway Jury”. Hackman was married twice and had three children. He and Arakawa, a pianist, were together for over 33 years. Source: ABC .tdi_2.td-a-rec{text-align:center}.tdi_2.td-a-rec:not(.td-a-rec-no-translate){transform:translateZ(0)}.tdi_2 .td-element-style{z-index:-1}.tdi_2.td-a-rec-img{text-align:left}.tdi_2.td-a-rec-img img{margin:0 auto 0 0}@media (max-width:767px){.tdi_2.td-a-rec-img{text-align:center}} (adsbygoogle = window.adsbygoogle || []).push({}); Previous articleSpeculation Swirls Over Lucasfilm Successor Next article“Hunger Games” Stage Play Sets Date Garth Franklin"
