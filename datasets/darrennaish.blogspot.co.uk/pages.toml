full_description = "Wednesday, January 24, 2007 Tetrapod Zoology ver 2 It is done: Tetrapod Zoology is moving. Please go over to....http://scienceblogs.com/tetrapodzoology/See you on the other side! posted by Darren Naish at 5:58 PM 9 comments Tuesday, January 23, 2007 Goodbye blogspot.... Remember I said that things were going to change? (go here, for example). Well, things are going to change. Please watch this space: it will take a few days to happen, but I will keep you posted.Why the chalicothere, I hear you ask? Well that would be telling, wouldn't it. Sorry about lack of promised vampire post, it's still due to appear. Sorry also to those owed emails, please be patient.UPDATE (added 23-1-2007): I should be able to let you know what's happening later today. And no prizes for the many that have guessed correctly already.UPDATE 2 (added in the small hours of the morning on 24-1-2007): ok, things are nearly ready. Drumroll. So, I said that things are changing. No, I do not (yet) have a proper job. No, I am not moving to myspace (very funny). Am I moving to scienceblogs? Yes. As many of you correctly guessed, Tetrapod Zoology is moving, so you will need to update your browsers, change links etc. The full transition is occurring as I type, and I should have the url by the end of today: though the first post is up and ready (and I can view it), I don't know if it's publicly accessible, so don't waste your time by trying to find it. So far as I know, the year's archive of posts here on blogspot will remain, and of course I'll be linking back to these posts from time to time. Please check back soon for the new url... posted by Darren Naish at 12:36 AM 5 comments Sunday, January 21, 2007 Happy first birthday Tetrapod Zoology (part II) As discussed in the previous post, today (January 21 2007) is Tetrapod Zoology’s first birthday. Hooray: more champagne, please. You’ll need to read part I to make sense of the following. Anyway, here we go. Tetrapod Zoology: horribly biased As mentioned in the previous post, given that I do not blog ‘to a plan’, I want to know what the spread of subjects I’ve blogged about might tell me. Might they reflect my ‘real’ interests, or might they perhaps indicate which areas within tetrapod zoology are currently the most happening, interesting or sexy? I don’t know, but I find the results pretty surprising. In terms of broad coverage of subject areas, we see from the adjacent graph [click for larger version, of course] that I’ve written more about reptiles (including birds) than I have about other tetrapod groups. It’s also notable that the number of miscellaneous posts – those that cover various assorted crap and aren’t really focused on any one group of animals – is reasonably high. The prevalence of reptiles is not so surprising, given that I specialize on dinosaurs and other Mesozoic reptiles, but what does surprise me is how the reptiles break down when we look at them by group. Turtles, crurotarsans (the clade that includes crocodilians and their extinct relatives) and pterosaurs are equally represented, but with only a few posts each. Despite (or, perhaps, because of) the fact that I have just been working on them for seven years, non-avian theropods haven’t featured heavily. I must rectify this. Squamates (lizards, snakes and kin) do a bit better, and would have featured even more on the blog if I’d gotten round to finishing the articles I’ve started on sea snakes, island-endemic lizards and anguids. The two most surprising groups are sauropods (represented by 10 posts), and birds (represented by 24 posts). Yikes, does this mean that I’m more ‘interested’ in sauropods and birds – and even squamates – than in non-avian theropods? It’s something for me to think about. The prevalence of birds is just downright scary: more on it in a moment. A similarly surprising thing happens when we break down all the mammal posts. Of the groups covered (and keep in mind that a vast number of areas haven’t been covered at all), hoofed mammals are out in front, and rodents and primates are reasonably well represented. This surprises me because I’d always imagined that these were the least interesting mammals: way outclassed by marsupials, monotremes, pangolins, bats and xenarthrans. Yet I’ve hardly blogged at all on any of these topics. Yikes, do I really find deer and voles more interesting than sloths, thylacines and echidnas? Again, it’s something I’ll have to think about, and perhaps aim to rectify in future. Looking at subject areas broken down more specifically (this time across all material covered), the overall picture is, again, somewhat surprising. Lissamphibians feature poorly and Palaeozoic and Mesozoic amphibian groups like lepospondyls and temnospondyls don’t feature at all. This is bad as I actually spent a lot of time doing research on these groups in 2006. Rodents, primates and turtles are reasonably represented overall (which, again, surprises me as I just never imagined that I’d end up writing much about these groups). The red bars show those subject areas that were particularly well represented: miscellaneous stuff, hoofed mammals, sauropods and birds! There is no way this is what I would have predicted. The big score that birds get is worrying. Granted, I haven’t broken Aves down into constituent clades, so the results aren’t exactly balanced, but – again – I’m asking myself: does this really reflect my personal interests? Am I really more interested in birds than in other tetrapods? Or is it just that birds were particularly newsworthy in 2006? I think that the latter point is significant here, as the posts on eagle owls, phorusrhacids, the Madagascar pochard, and the 10 bird meme were not spin-offs of my own ideas, but were instead initiated by the writings of others. For those who say nice things about my blog, the good news is that this is still just the beginning, and there is a vast amount of material I have yet to complete and post, or even write. Ironically, I still haven’t managed to complete many articles that I have started writing way back at the start of 2006, including those on temnospondyls, rhinogradentians, Haast’s eagle, Piltdown and amphisbaenians. To those looking forward to the posts on these subjects, all I can say it: please bear with me, they will be completed and posted eventually! As I’ve said before, if I could devote more time to blog writing I would. At the moment life gets in the way. So, happy first birthday Tetrapod Zoology. I hope you’ve enjoyed the ride so far. Many thanks to all those who have helped and supported me over the past year, to those who assist in obtaining literature, to those who advise and point out errors, to those who post comments, and to all who read and/or visit the blog [UPDATE: to see what happened next go here]. posted by Darren Naish at 1:15 AM 11 comments Happy first birthday Tetrapod Zoology (part I) On Saturday 21st January 2006 – that is, one year ago – I decided, entirely on a whim, to start my own blog. I’d been reading various people’s blogs for a while and it was on that night that the thought of writing one of my own occurred to me. Of course, it was just about the worse time to do this, given that I was scheduled to complete my PhD in April of that year, and I was already too busy with too many additional commitments. But I did it anyway, and while lying in bed later that night I felt the over-riding urge to get up, switch the computer on and write the first of my patented over-long, tediously detailed blog essays. It was on giant killer eagles, a favourite subject of mine, and one that I was to return to several times later on in the year. It marked the beginning of a new and highly rewarding phase in my life. So, today is Tetrapod Zoology’s first birthday. In this post (and part II) I want to look back at a year’s blogging: given that I do not really blog ‘to a plan’ (I simply write about those subjects that I bump into, or find particularly interesting on the spur of the moment), I’m interested in seeing what I might learn about my blogging habits. It’s also worth reviewing Tetrapod Zoology’s changing fortunes, and on looking back at my own circumstances, during the year that’s past. You’ll be pleased to hear that we (as in, Toni, Will and myself) celebrated Tetrapod Zoology’s first birthday by visiting the Natural History Museum in London. Above is a photo of the robotic tyrannosaur to prove it. And sorry if you were expecting the vampire post… it will follow shortly. A year in the life It feels like a lot happened in 2006, though I’m not sure if it really did. I spent time in the field looking at obscure British reptiles and amphibians, wild deer, rodents, bats and birds, and I taught Will stuff about tracking and field sign. I visited the farm many times (see adjacent image), and the zoo where I was impressed by takins, peccaries, sleeping anteaters and rhinos. Feedback on the blog increased and, thanks to it, I made lots of new friends. The main event of 2006 was, of course, the completion of my PhD on Wealden theropods. By repeatedly staying up until 05-00 each morning, I managed to get the thing completed, and at the start of June I had the viva and completed the process in full. Besides being kept busy with my editorial work for Cretaceous Research, in late 2006 I began an adult-education course on the evolution and diversity of tetrapods for the WEA (Workers Educational Authority), and at the start of 2007 I am currently teaching the second such course. Since completing the PhD I’ve been unable to get a job in academia, despite strenuous efforts, and life has been very hard. However, working on the assumption that I will somehow get back into the system, I have continued to do research when time allows. Several academic projects that have been mentioned on the blog have yet to come to fruition, including that long-delayed manuscript on British dinosaur diversity, and work on Cretaceous Spanish vertebrates, Wealden sauropods, and azhdarchid ecology. In July, Dave Martill and I finally published our paper on Tupuxuara and the affinities of azhdarchoid pterosaurs (to a flurry of media attention), and Dave, Sarah Fielding and I published a review of Kimmeridge Clay dinosaurs later in the year. I am routinely asked to do talks for local natural history and geology groups, and in 2006 I lectured on ichthyosaurs, British big cats and Wealden dinosaurs. I also did TV interviews on theropods and marine reptiles, a podcast for George Kenney’s Electric Politics site, and late in the year I was commissioned to assist in the development of a TV programme featuring computer-generated dinosaurs. While all of this was going on, I have researched and published blog articles on… well, a lot of stuff (see part II). For me, blogging is great for two main reasons. Firstly, it’s very easy compared to conventional publishing. An article of a 1000 words can be written, illustrated, formatted and published within an hour or so. Secondly, the accessibility and popularity of blogs means that blog posts are almost certainly read by more people than are anything within conventionally published media. Troughs, peaks and mega-peaks Naturally, if you maintain a web site of any sort, you’re interested in how much, or how little, traffic you’re getting. Blogspot doesn’t provide a web counter for every blog of course, so the only way to check your traffic is to see how many people have viewed your profile. However, of every 2000 people that visit a blog, perhaps 1 looks at the profile, so this isn’t a reliable guide. So in September I installed a web counter (provided, free by bravenet), and by November 2006 it had counted 50,000 hits, which ain’t bad. At the time of writing, the current number of average daily hits is round about 500 (see adjacent graph, depicting traffic on 12th January 2007), though this was more like 300 prior to November 2006 or so. Within a short length of time I learnt that certain types of posts got more hits than others, and this partly explains why – in November 2006 – I blogged about sasquatch. Thanks to the web counter, I was able to watch my traffic soar to a high of about 3000 a day. It seems that mentions of the blog on scienceblogs.com sites and anomalist.com result in a surge of traffic: the graph shown here shows what happened on the 18th January 2007 when PZ Myers linked to my post on Darwin’s beard. A far more remarkable peak – a mega-peak – occurred however during the Christmas holiday, when (over the space of three days) the total number of hits jumped from 50,000 to over 80,000. I initially thought this was some kind of software glitch, but it wasn’t (unfortunately, I never thought to save the bravenet counter graph generated at the time). It seems that Pekka Komi’s remarkable 2006 photos of the Golden eagle scrapping with the fox had proved incredibly popular, and after a link to my blog was listed on digg.com, things went nuts. So I learnt that neat photos make all the difference, if, that is, traffic is what you’re interested in. Continued in part II…. posted by Darren Naish at 12:30 AM 7 comments Thursday, January 18, 2007 The evolution of vampires Coming soon: musings on a possible path to passerine parasitism. Also extinct plasma-quaffing microbats, and maybe pterosaurs (again).Update: go here, here or here... posted by Darren Naish at 12:17 AM 8 comments Saturday, January 13, 2007 Why I hate Darwin’s beard Here’s a little known fact. Charles Robert Darwin (1809-1882), the most important biologist of all time, did not spend his entire life as an old man. I despise stereotypes, especially those that are totally erroneous, and whenever I see a picture of ‘old man Darwin’ I wonder: why is it that so many of our most important scientists are consistently portrayed as old men? Don’t get me wrong, I have nothing in particular against old men, it’s just that this tradition is annoying and misleading, and perpetuated by a society that seems to want scientists to be oddballs that operate on the fringes of society. Darwin is the ultimate example of this sort of thing: ask people what Darwin looked like and I reckon 99% or more will describe an aged, bald-headed individual with a bushy beard, photographed in black and white and wearing a suit. Of course this is the way in which Darwin is virtually always depicted, in part because photography only became widespread in the 1850s (and by the 1860s Darwin was indeed balding and bearded). But the obvious point worth making – and drumming home whenever it’s appropriate – is that Darwin didn’t spend his entire life as an old man of 70 years of age. While it’s correct that he was still actively involved in research at this age (in 1879 he finished a work on climbing plants, and in 1881 he published work on the ecological importance of earthworms), it’s neither fair nor appropriate to imagine him doing all of his important work at this stage in his life. Quite the opposite: in f"
