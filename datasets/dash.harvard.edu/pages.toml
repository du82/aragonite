liver, W. D.; Ottosson, K.; Pizzuto, A.; Potter, R.; Pritchard, O.; Pryadko, L. P.; Quintana, C.; Reagor, M. J.; Rhodes, D. M.; Roberts, G.; Rocque, C.; Rosenberg, E.; Rubin, N. C.; Saei, N.; Sankaragomathi, K.; Satzinger, K. J.; Schurkus, H. F.; Schuster, C.; Shearn, M. J.; Shorter, A.; Shutty, N.; Shvarts, V.; Sivak, V.; Skruzny, J.; Small, S.; Smith, W. Clarke; Springer, S.; Sterling, G.; Suchard, J.; Szalay, M.; Sztein, A.; Thor, D.; Torres, A.; Torunbalci, M. M.; Vaishnav, A.; Vdovichev, S.; Villalonga, B.; Heidweiller, C. Vollgraff; Waltman, S.; Wang, S. X.; White, T.; Wong, K.; Woo, B. W. K.; Xing, C.; Yao, Z. Jamie; Yeh, P.; Ying, B.; Yoo, J.; Yosri, N.; Young, G.; Zalcman, A.; Zhu, N.; Zobrist, N.; Neven, H.; Babbush, R.; Boixo, S.; Hilton, J.; Lucero, E.; Megrant, A.; Kelly, J.; Chen, Y.; Smelyanskiy, V.; Vidal, G.; Roushan, P.; Läuchli, A. M.; Abanin, D. A.; Mi, X.Show moreAbstract Understanding how interacting particles approach thermal equilibrium is a major challenge of quantum simulators1,2. Unlocking the full potential of such systems towards this goal requires flexible initial state preparation, precise time evolution and extensive probes for final state characterization. Here we present a quantum simulator comprising 69 superconducting qubits that supports both universal quantum gates and high-fidelity analogue evolution, with performance beyond the reach of classical simulation in cross-entropy benchmarking experiments. This hybrid platform features more versatile measurement capabilities compared with analogue-only simulators, which we leverage here to reveal a coarsening-induced breakdown of Kibble–Zurek scaling predictions3 in the XY model, as well as signatures of the classical Kosterlitz–Thouless phase transition4. Moreover, the digital gates enable precise energy control, allowing us to study the effects of the eigenstate thermalization hypothesis5–7 in targeted parts of the eigenspectrum. We also demonstrate digital preparation of pairwise-entangled dimer states, and image the transport of energy and vorticity during subsequent thermalization in analogue evolution. These results establish the efficacy of superconducting analogue–digital quantum processors for preparing states across many-body spectra and unveiling their thermalization dynamics.Show more No Thumbnail Available PublicationIn Situ Techniques for Quinone-Mediated Electrochemical Carbon Capture and Release in Aqueous Environments (American Chemical Society (ACS), 2024-01-31) Amini, Kiana; Cochard, Thomas; Jing, Yan; Sosa, Jordan D.; Xi, Dawei; Alberts, Maia; Emanuel, Michael S.; Kerr, Emily F.; Gordon, Roy G.; Aziz, MichaelShow moreWe present two novel experimental techniques designed to quantify the contributions of nucleophilicity-swing and pH-swing mechanisms to carbon capture in the electrochemical aqueous quinone-based CO2 capture process. Through thermodynamic analysis, we elucidate the intricate interplay between these two mechanisms, and emphasize the critical role of unde'''
