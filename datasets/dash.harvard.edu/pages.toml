, Kythe; Stang, Charles M; Boylston, Nicholas; Giron Negron, Luis; Howe, FannyShow moreThrough an inter-disciplinary and comparative study of the acoustic phenomenon of resonance—i.e., the synchronous vibration between two or more sounds—this dissertation thinks through a socially-engaged “sonic metaphysics” and phenomenology of sound in the field of religious studies, in three case studies of contemporary aesthetic and mystical works: Eastern Orthodox Estonian composer Arvo Pärt’s (1935-present) selected works from his early tintinnabuli period of composition; Mestizo Indigenous Chilean poet and artist Cecilia Vicuña’s (1948-present) selected Précario and Quipu works; and transnational Sri Lankan Sufi Shaikh M.R. Bawa Muhaiyaddeen’s (?-1986) The Resonance of Allah: Resplendent Explanations Arising from the Nūr, Allāh’s Wisdom of Grace. Critically, the study discovers how these three contemporary forms and dimensions of sonic religiosity act formally (through their content, form, and reception) to open up within and beyond established discourses of mysticism, animism, and aesthetics, to speak in new and socially-engaged ways about actual human and environmental relations and transformations. Each case study traces clear, detailed connections between metaphysical ideas about resonance and the impact of resonance on concerns such as self-realization and healing, social and environmental justice, humanitarian aid, medical care, and inter-religious tolerance, while examining the capacity of resonance to express continuities between metaphysics and the phenomenology of lived religious experience; to convey meaning across religious, political, and aesthetic categories of belonging; and to expand our capacity for listening and ethical action. Each case study likewise contributes both theoretical and ethnographic insights into how resonance, and sound more generally, convey roles as prayer, as presence, and as mode(s) of attunement that enact the creation of the cosmos and dialogue with the divine. The dissertation also uncovers the psychoacoustics of the listener’s embodied relationship with sound and presence and the capacity of resonance to elucidate commonalities in intersubjective experience (relational ontologies). The study contributes methodologically to the study of religion by situating resonance as a vital concept of contemporary interdisciplinary and comparative inquiry and positioning the listening subject and their experience at the center of the unfurling of sound within complex multi-religious and secular global spaces. More broadly, the study addresses how developing an account of the metaphysics of resonance in religion helps us to hear differently, with and for each other.Show morePublicationExploring the Spiritual Value of Slasher Films: Watching Horror Movies as a Sacred PracticeMaples, Kristen; Greene-Hayes, AhmadShow moreThis thesis describes the author's experience watching the slasher films Black Christmas (1974), Halloween (1978), Scream (1996) and The Cabin in The Woods (2011) as a sacred practice. The rise of the religious "nones" in the United States has necessitated a renewed look at how this population makes sense of the world. The concept of reading as a sacred practice was adopted from Not Sorry Productions and applied to the medium of film. Charles Long's definition of religion as orientation is used to provide a theoretical framework to posit that the practice of sacred engagement with secular texts is a secular equivalent to religious investigation. Horror films have long been part of popular culture and our collective imagination, and their engagement with the monstrous posits them as unique and important vehicles for social commentary, which make them excellent texts for watching as sacred practice. Over the course of an academic year, the author viewed each film multiple times with different participants for each viewing and recorded the subsequent meaning making conversations. It was found that individual horror films offer virtually endless opportunities for discovery, which facilitates a deeper understanding of the world in which we find ourselves and what it means to be human. These meanings can only be uncovered through repeated viewings combined with intentional conversations with others.Show morePublicationAP English Curriculum Proposal and Outline for novel Between Two Moons by Aisha Abdel GawadMaden-Yilmaz, Betul; Rashid, HusseinShow moreThis was written as a Capstone Project for the Certificate of Religion in Public Life and it is a project within the education track which prioritizes Religious Literacy within Education. The novel Between Two Moons presents a great opportunity for young adults to explore this text and analyze in ways that religious literacy could be promoted at a high school level. This project includes an outline unit for an AP English Literature curriculum, with the potential for pitching it to College Board.Show morePublicationTai Chi—Dance Movement Therapy Integration: A Cross-Cultural Approach to Mind- Body PsychotherapyLi, Xinran; Lamberth, David; Rizzo, StevenShow moreFrom a holistic health perspective, this paper investigates the practice of combining Tai Chi with Dance Movement Therapy (DMT) and its benefits as an integrative therapy— Tai Chi-DMT Integrated Movement Therapy—in cross-cultural therapeutic applications. The study first analyzes the philosophical foundations and cultural background of Tai Chi and DMT, pointing out their complementary nature in promoting mental, physical, and spiritual health. Tai Chi originates from traditional Chinese philosophy, which emphasizes achieving harmony and balance between body, mind, and spirit through smooth movements and meditation. In contrast, dance movement therapy is rooted in Western psychological theories that value individualism and personal expression, as well as the importance of body movement in promoting mental health. This thesis argues that by combining Tai Chi with DMT, a comprehensive therapeutic framework can be constructed that is both adaptable to various cultural backgrounds and able to bridge Eastern and Western therapeutic traditions. This paper explores a practical approach to solving health problems by analyzing the philosophy of Tai Chi and dance movement therapy and its application in the therapeutic process. I introduced Tai Chi-DMT Integrated Movement Therapy, which combines Tai Chi's serialized meditation reflection with DMT's emphasis on emotional expression and personal growth, aiming to provide a cross-cultural treatment plan. This study adopted the Expressive Therapy Continuum (ETC) framework, a multidimensional therapy model that focuses on promoting creative expression and supports individual therapy processes. ETC framework ranges from basic sensory experience to complex symbolic expression and cognitive understanding. Through this systematic approach, this treatment model aims to meet diverse treatment goals and pave ways for the global application of cross-cultural body psychotherapy. The conclusion highlights the importance of adopting a cross-cultural and whole person approach to health, noting that its value transcends traditional monocultural or monotherapeutic models. By combining Eastern philosophies of meditation and movement with Western individualistic and psychotherapeutic approaches, this approach exploits the shared body language of humans, deepens the understanding of therapeutic philosophies of different cultures, promotes communication of new methods of health and treatment among people from different backgrounds, and thereby enhances diversity and inclusion in the global health field. Therefore, this Tai Chi-DMT integrated therapy can be considered an important complementary and innovative tool in the field of global public health.Show morePublicationFace-to-Face with the Corpse: Time, Death, and the Dead in Levinas’ Totality and InfinityGoldberg, Talia; Lamberth, DavidShow morePublicationRestoring Faith in the Promise of Healing: Affirmative Presence as a Care Ethic for Post-Covid Medical DistrustConston, Ryan; Parmigiani, Giovanni; Bloor, SherahShow moreThis study draws on both an affirmative biopolitical framework and a pastoral framework to propose an effective way of navigating medical distrust from communities found online and throughout the world. I engage with Roberto Esposito’s theorization of ‘community’ and ‘immunity’ in states of exceptional crises to introduce a critique of biopolitical governance by emerging online communities. Through a case study analyzing coded Reddit thread posts worldwide, I explore how these communities perceive and react to the COVID-19 response efforts by the medical field. In giving voice to these perspectives and offering a responsive care ethic of affirmative presence, I argue that restoring faith in the promise of medicine is not only possible, but practically achievable – in both the clinic and the public sphere. In my work, I hope to contribute to improved healthcare communication, management, and administration methods, as well as highlight the utility of affirmative presence in addressing the various forms of skepticism and distrust of conventional healthcare.Show morePublicationSpiritual Innovation and EntrepreneurshipMcAdams, Charlotte; McKanan, DanielShow moreIn this yearlong experimental project I built an organization to deliver spiritual care in new ways and facilitated the creation of a community of practice of spiritual care providers. My short thesis submission outlines the experiences and challenges of the work.Show morePublicationLiber Pagani: a MythArcher, Joseph; Bagaria, SwayamShow moreWhat follows is a condensed myth, part of a guidebook intended for soldiers who identify as Pagan in the US Army. This piece is in conversation with the many deep ecologists and animists who have shaped my ecological and theological understandings. This myth explores relatedness, subjectivity, and morality in a sacred animate world where violence is inherent to being. Most central is relatedness, that is relatedness to the environment, the anima, and in the context of warrior culture, relatedness to the enemy, and one’s own impulses to aggression. Much of the symbolic inspiration of this piece comes from Panel A of the Gundestrup Cauldron, an iron age silver cauldron discovered in northern Denmark. This story is also inspired by the themes of Indo-European myth, paleolithic cave art, Jungian and Neo-Jungian thought, and the metaphysical understandings of the Xam and Yukaghir hunting cultures. This work is also inspired by the biographies of the A’aninin warrior and healer, Bull Lodge, and the Tibetan Yogi, Milarepa. Most of all, this story is shaped by my encounters with the wild Puma, Elk, Bear, Rattlesnakes, rivers, and peaks of my home: the Rocky Mountains.Show more No Thumbnail Available PublicationRap MinistryVicente, George; Dunning, BenjaminShow moreThis project is a rap album which intertwines the things I've learned as well as my experiences at Harvard Divinity School in conversation with my faith and relationship with Jesus Christ. Through using what I've learned at HDS, I made an album that serves as a ministering agent, primarily to those of my faith, but also with an eye to testifying about Jesus and bring glory to God. In addition to the album, this project contains a written reflection in which I describe how each song is connected to my academic work at Harvard, and in what way it functions in a ministerial sense. The name of the album is called "The Gospel of Grace". It displays the goodness of God as shown in the Old Testament, through to the New Testament, all the way up until today. It is a devotional project which incorporates insights gained throughout my academic journey at HDS.Show morePublicationAn Apostolic-Pentecostal Progenitor: Bishop Kenneth H. Moales Sr. “The Man, The Ministry, The Mantle”Moales, Kenneth III; Greene-Hayes, Ahmad; Rizzo, StevenShow moreThis thesis contributes to the study of African American religion, more specifically, the realm of the Apostolic-Pentecostal tradition. This work recollects the untold story of Bishop Kenneth Herbert Moales Sr., a father in the Black Charismatic Movement. This project works to uncover his impact within the Black Church and Gospel Music traditions by shedding light on his life’s journey. This thesis uses his musical journey to make sense of his call to ministry. While becoming the successor to Dr. Thomas Dorsey for the National Convention of Gospel Choirs and Choruses, he was a dynamic preacher who was anointed and called to live a life of prayer and love. He became known interdenominationally for the “War Cry,” a ‘shout chant’ that merged his music and preaching ministry, which is still being sung in churches nationwide. Through this journey, we will understand the history of the Holiness movement and the impact of women that shaped his life while closing with the importance of commissioning'''
