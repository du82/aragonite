["https://dash.harvard.edu/entities/story/2ecb0b0b-1303-4114-bac6-2b7432d3f523"]
title = '"What is the History of Books?"… : DASH Story 2014-06-10'
description = '''My masters dissertation in the University of Reading is based on Darton's communication circuit. I have been using the 1982 version, but ""What is the History of Books?" Revisited" is also key. The university did not have access to it and the price (US$ 30, I guess) was really expensive for a student. Thank you so much for making it freely available! People tend to think that those enrolled in a post graduate university can afford academic articles, but I have seen that this is not the case.'''
