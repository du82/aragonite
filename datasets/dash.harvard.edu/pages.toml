title = '"Way Down in the Hole": Systemic… : DASH Story 2013-04-01'
description = "I am an independent scholar writing for publication to disseminate my research and enhance employment prospects. Recent and past increases in privatization of access to intellectual resources prevents my ready access to online databases and comprehensive library holdings. These market-driven moves by many administrations and publishers are hampering the ability of researchers and scholars such as myself to contribute to the collective intelligence of the global community. Open access initiatives will hopefully reverse the privatization trend so that all may benefit from our collectively produced knowledge. Thank you!"
