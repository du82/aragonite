entification is to evolve into a multiracial identity, it may not be at the expense of existing group consciousness. Instead, we expect mixed-race identity to be contextual, fluid, and additive, so that it can be layered onto rather than substituted for traditional monoracial commitments. If the multiracial movement successfully challenges the longstanding understanding and practice of “one drop of blood” racial groups, it has the potential to change much of the politics and policy of American race relations.DescriptionOther Available Sources http://papers.ssrn.com/sol3/papers.cfm?abstract_id=1259963Keywords Terms of Use This article is made available under the terms and conditions applicable to Open Access Policy Articles (OAP), as set forth at Terms of ServiceURI http://nrs.harvard.edu/urn-3:HUL.InstRepos:8944744CollectionsFAS Scholarly ArticlesEndorsementReviewSupplemented ByReferenced By Full item page Related StoriesStory“There's No One as Irish as… : DASH Story 2013-04-05Using Open Access has helped me tremendously with my research papers for school. I attend an online university and although they have an extensive online library. I have noticed many of the articles are not full text, which in a sense defeats the purpose of looking for the article online for instant access. So I really appreciate Open Access providing relevant credible work.Show more"
