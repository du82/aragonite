title = "30,000 Years Old Wild Flax Fibers… : DASH Story 2013-11-13"
description = "Information matters. Life began when some information got a way to replicate itself. Since then, life has evolved by quantitative (and somehow qualitative) increases in the replication, storing and transmission of information. Eventually, original replicators got a way to produce complex organisms with organs to store, process and transmit information by their own: brains. Open Access is only one of the last links in this vital and universal chain. Given that information matters a lot, open access to information matters a whole world."
