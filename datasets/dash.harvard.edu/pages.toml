["https://dash.harvard.edu/entities/story/530a3c6f-1086-4763-89af-118e77f801c1"]
title = '"What is the History of Books?"… : DASH Story 2013-09-24'
description = "Going to university is a costly business, especially if you are supporting yourself and your major is Life sciences (because of all the extra laboratory fees etc.). I attend National Taiwan University at the moment but I grew up in the states, and although my chinese is fairly fluent, reading and writing on a university level remains a challenge. English is a much more comfortable language for me to learn in. Therefore, when my core curriculum classes assigns me translated versions of essays and articles, I set out to find the original english source. Low on money, I can't afford to buy the original english version in Taiwan, but I can usually find the book in the university library, usually but not always though. Open Access helps me read sources that I can't get to without buying the original, and helps me with getting through my university degree by providing me with the original manuscript of articles. Thanks!"
