["https://dash.harvard.edu/entities/publication/73120378-8ba6-6bd4-e053-0100007fdf3b"]
title = "30,000 Years Old Wild Flax Fibers - Testimony for Fabricating Prehistoric Linen"
description = "A unique finding of wild flax fibers from a series of Upper Paleolithic layers at Dzudzuana Cave, located in the foothills of the Caucasus, Georgia, indicates that prehistoric hunter-gatherers were making cords for hafting stone tools, weaving baskets, or sewing garments. Radiocarbon dates demonstrate that the cave was inhabited intermittently during several periods dated to 32 to 26 thousand years before the present (kyr B.P.), 23 to 19 kyr B.P., and 13 to 11 kyr B.P. Spun, dyed, and knotted flax fibers are common. Apparently, climatic fluctuations recorded in the cave’s deposits did not affect the growth of the plants because a certain level of humidity was sustained."
full_description = "Publication: 30,000 Years Old Wild Flax Fibers - Testimony for Fabricating Prehistoric LinenOpen/View FilesPrimary BarYosef_PrehistoricLinen.pdf (116.49 KB)Date2009Authors Kvavadze, Eliso Bar-yosef, Ofer Belfer-Cohen, Anna Boaretto, Elisabetta Jakeli, Nino Matskevich, Zinovi Meshveliani, Tengiz Published Version 10.1126/science.1175404Journal TitleJournal ISSNVolume TitlePublisherAmerican Association for the Advancement of Science Share your DASH Story The Harvard community has made this article openly available. Please share how this access benefits you.Research ProjectsOrganizational UnitsJournal IssueCitationKvavadze, Eliso, Ofer Bar-Yosef, Anna Belfer-Cohen, Elisabetta Boaretto, Nino Jakeli, Zinovi Matskevich, and Tengiz Meshveliani. 2009. 30,000 Years old wild flax fibers - Testimony for fabricating prehistoric linen. Science 325(5946): 1359.Research DataAbstractA unique finding of wild flax fibers from a series of Upper Paleolithic layers at Dzudzuana Cave, located in the foothills of the Caucasus, Georgia, indicates that prehistoric hunter-gatherers were making cords for hafting stone tools, weaving baskets, or sewing garments. Radiocarbon dates demonstrate that the cave was inhabited intermittently during several periods dated to 32 to 26 thousand years before the present (kyr B.P.), 23 to 19 kyr B.P., and 13 to 11 kyr B.P. Spun, dyed, and knotted flax fibers are common. Apparently, climatic fluctuations recorded in the cave’s deposits did not affect the growth of the plants because a certain level of humidity was sustained.DescriptionOther Available SourcesKeywords Terms of Use This article is made available under the terms and conditions applicable to Open Access Policy Articles (OAP), as set forth at Terms of ServiceURI http://nrs.harvard.edu/urn-3:HUL.InstRepos:4270521CollectionsFAS Scholarly ArticlesEndorsementReviewSupplemented ByReferenced By Full item page Related StoriesStory30,000 Years Old Wild Flax Fibers… : DASH Story 2013-11-13Information matters. Life began when some information got a way to replicate itself. Since then, life has evolved by quantitative (and somehow qualitative) increases in the replication, storing and transmission of information. Eventually, original replicators got a way to produce complex organisms with organs to store, process and transmit information by their own: brains. Open Access is only one of the last links in this vital and universal chain. Given that information matters a lot, open access to information matters a whole world.Show moreStory30,000 Years Old Wild Flax Fibers… : DASH Story 2013-11-15I work in software engineering, but at home I am very low tech. I scour fleeces, card or comb them, and spin them for my knitting and weaving projects. While I tend to focus on archaeological reports from Bronze Age forwards, I am thoroughly fascinated by fiber-related finds in prehistory, and appreciate the detail that a proper scholarly article brings. I will be keeping these results in mind the next time I pull out flax fibres, and may try to reproduce them. Attempting to reproduce archaeological finds is a wonderful teacher.Show moreStory30,000 Years Old Wild Flax Fibers… : DASH Story 2013-12-04I am an attorney who pursues information about the history of clothing. Articles like this are helping me build an understanding of the development of clothing from humankind's beginning. I aspire to being able to publish original research that will aid, at least in a small way, the reshaping of the history of clothing by archaeology.Show moreStory30,000 Years Old Wild Flax Fibers… : DASH Story 2014-03-12I am involved in historical education including stone age and being able to read about the precise finds is invaluable. I can now show pupils how to twist flax fibres into cordage as part of their stone age experiential learning, as well as use natural plant dyeing. This information is just too important to keep secret, so thank you for sharing!Show more"
