["https://dash.harvard.edu/entities/publication/73120378-9c61-6bd4-e053-0100007fdf3b"]
title = '"Way Down in the Hole": Systemic Urban Inequality and The Wire'
description = "The Wire is set in a modern American city shaped by economic restructuring and fundamental demographic change that led to widespread job loss and the depopulation of inner-city neighborhoods. While the series can be viewed as an account of the systemic failure of political, economic, and social institutions in Baltimore in particular, the fundamental principles depicted in The Wire certainly parallel changing conditions in other cities, especially older industrial cities in the Northeast and Midwest. Indeed, it is for this reason that The Wire captures the attention of social scientists concerned with a comprehensive understanding of urban inequality, poverty, and race in American cities."
full_description = 'Publication: "Way Down in the Hole": Systemic Urban Inequality and The WireOpen/View FilesPrimary Wilson-WayDown.pdf (204.87 KB)Date2011AuthorsWilson, William JuliusChaddha, AnmolPublished Version 10.1086/661647Journal TitleJournal ISSNVolume TitlePublisherUniversity of Chicago Press Share your DASH Story The Harvard community has made this article openly available. Please share how this access benefits you.Research ProjectsOrganizational UnitsJournal IssueCitationChaddha, Anmol, and William Julius Wilson. 2011. "Way Down in the Hole": Systemic Urban Inequality and The Wire. Critical Inquiry 38(1): 1-23Research DataAbstractThe Wire is set in a modern American city shaped by economic restructuring and fundamental demographic change that led to widespread job loss and the depopulation of inner-city neighborhoods. While the series can be viewed as an account of the systemic failure of political, economic, and social institutions in Baltimore in particular, the fundamental principles depicted in The Wire certainly parallel changing conditions in other cities, especially older industrial cities in the Northeast and Midwest. Indeed, it is for this reason that The Wire captures the attention of social scientists concerned with a comprehensive understanding of urban inequality, poverty, and race in American cities.DescriptionOther Available SourcesKeywordsSUP - Social and Urban Policy, Poverty and Inequality, Inequality, Race, Ethnicity, Gender, and Class, Demographics Terms of Use This article is made available under the terms and conditions applicable to Other Posted Material (LAA), as set forth at Terms of ServiceURI http://nrs.harvard.edu/urn-3:HUL.InstRepos:8057979CollectionsHKS Faculty ScholarshipEndorsementReviewSupplemented ByReferenced By Full item page Related StoriesStory"Way Down in the Hole": Systemic… : DASH Story 2013-04-01I am an independent scholar writing for publication to disseminate my research and enhance employment prospects. Recent and past increases in privatization of access to intellectual resources prevents my ready access to online databases and comprehensive library holdings. These market-driven moves by many administrations and publishers are hampering the ability of researchers and scholars such as myself to contribute to the collective intelligence of the global community. Open access initiatives will hopefully reverse the privatization trend so that all may benefit from our collectively produced knowledge. Thank you!Show more'
