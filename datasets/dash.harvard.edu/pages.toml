["https://dash.harvard.edu/entities/publication/411cfdcd-8b27-495c-93dc-af2e7baae406"]
title = "UniqueQMA vs QMA: oracle separation and eigenstate thermalization hypothesis"
description = '''
We study the long-standing open question of the power of unique witness in quantum protocols, which asks if UniqueQMA, a variant of QMA whose accepting witness space is 1-dimensional, is equal to QMA. We show a quantum oracle separation between UniqueQMA and QMA via an extension of the Aaronson-Kuperberg's QCMA vs QMA oracle separation. In particular, we show that any UniqueQMA protocol must make Ω(D−−√) queries to a subspace phase oracle of unknown dimension ≤D to "find" the subspace. This presents an obstacle to relativizing techniques in resolving this question (unlike its classical analogue - the Valiant-Vazirani theorem - which is essentially a black-box reduction) and suggests the need to study the structure of the ground space of local Hamiltonians in distilling a potential unique witness. Our techniques also yield a quantum oracle separation between QXC, the class characterizing quantum approximate counting, and QMA.
Very few structural properties are known that place the complexity of local Hamiltonians in UniqueQMA. We expand this set of properties by showing that the ground energy of local Hamiltonians that satisfy the eigenstate thermalization hypothesis (ETH) can be estimated through a UniqueQMA protocol. Specifically, our protocol can be viewed as a quantum expander test in a low energy subspace of the Hamiltonian and verifies a unique entangled state in two copies of the subspace. This allows us to conclude that if UniqueQMA ≠ QMA, then QMA-hard Hamiltonians must violate ETH under adversarial perturbations (more accurately, under the quantum PCP conjecture if ETH only applies to extensive energy subspaces). Our results serve as evidence that chaotic local Hamiltonians, such as the SYK model, contain polynomial verifiable quantum states in their low energy regime and may be simpler than general local Hamiltonians if UniqueQMA ≠ QMA.'''
full_description = '''Publication: UniqueQMA vs QMA: oracle separation and eigenstate thermalization hypothesis No Thumbnail Available Open/View Files UniqueQMA vs QMA oracle separation and eigenstate.pdf (1.12 MB)Date2024-10-31AuthorsAnshu, Anurag Haferkamp, Jonas Hwang, Yeongwoo Nguyen, Quynh T. Published Version 10.48550/arXiv.2410.23811Journal TitleJournal ISSNVolume TitlePublisher Share your DASH Story The Harvard community has made this article openly available. Please share how this access benefits you.Research ProjectsOrganizational UnitsJournal IssueCitationResearch DataAbstractWe study the long-standing open question of the power of unique witness in quantum protocols, which asks if UniqueQMA, a variant of QMA whose accepting witness space is 1-dimensional, is equal to QMA. We show a quantum oracle separation between UniqueQMA and QMA via an extension of the Aaronson-Kuperberg's QCMA vs QMA oracle separation. In particular, we show that any UniqueQMA protocol must make Ω(D−−√) queries to a subspace phase oracle of unknown dimension ≤D to "find" the subspace. This presents an obstacle to relativizing techniques in resolving this question (unlike its classical analogue - the Valiant-Vazirani theorem - which is essentially a black-box reduction) and suggests the need to study the structure of the ground space of local Hamiltonians in distilling a potential unique witness. Our techniques also yield a quantum oracle separation between QXC, the class characterizing quantum approximate counting, and QMA. Very few structural properties are known that place the complexity of local Hamiltonians in UniqueQMA. We expand this set of properties by showing that the ground energy of local Hamiltonians that satisfy the eigenstate thermalization hypothesis (ETH) can be estimated through a UniqueQMA protocol. Specifically, our protocol can be viewed as a quantum expander test in a low energy subspace of the Hamiltonian and verifies a unique entangled state in two copies of the subspace. This allows us to conclude that if UniqueQMA ≠ QMA, then QMA-hard Hamiltonians must violate ETH under adversarial perturbations (more accurately, under the quantum PCP conjecture if ETH only applies to extensive energy subspaces). Our results serve as evidence that chaotic local Hamiltonians, such as the SYK model, contain polynomial verifiable quantum states in their low energy regime and may be simpler than general local Hamiltonians if UniqueQMA ≠ QMA.DescriptionOther Available SourcesKeywordsQuantum Physics, Computational Complexity Terms of Use This article is made available under the terms and conditions applicable to Open Access Policy Articles (OAP), as set forth at Terms of ServiceURI https://dash.harvard.edu/handle/1/42716460CollectionsFAS Scholarly ArticlesEndorsementReviewSupplemented ByReferenced By Full item page Related Stories'''
