full_description = '''Faculty of Arts and SciencesPermanent URI for this communityhttps://dash.harvard.edu/handle/1/1This community provides open access to material created by faculty, staff, and students of the Faculty of Arts and Sciences. All material in the repository is also harvested by search engines (such as Google Scholar) and Open Archives Initiative data harvesters.Browse Search Subcommunities and Collections By Issue Date By Author By Title By Subject By Department Search Subcommunities and Collections By Issue Date By Author By Title By Subject By Department 28482 results Back to results Filters Author 461 search.filters.author.Morii, Masahiro 423 search.filters.author.Huth, John 422 search.filters.author.Franklin, Melissa 310 search.filters.author.Loeb, Abraham 287 search.filters.author.Jacob, Daniel Show more Search author name Submit Subject 461 search.filters.subject.Biology 373 search.filters.subject.Economics 330 search.filters.subject.Genetics 296 search.filters.subject.Biochemistry 275 search.filters.subject.Computer science Show more Search subject Submit Date Start End Submit 1952 - 195941960 - 19792231980 - 19991.9K2000 - 201921.9K2020 - 20254.2K Has files 26.5K Yes 1.9K No Item Type 28.5K Publication FAS Department 3K search.filters.fas_department.Engineering and Applied Sciences 2.3K search.filters.fas_department.Physics 1.3K search.filters.fas_department.Economics 1.3K search.filters.fas_department.Organismic and Evolutionary Biology 1.3K search.filters.fas_department.Chemistry and Chemical Biology Show more Search Department Submit Deposit Date Start End Submit 2008 - 20091.9K2010 - 201921.1K2020 - 20255.5K Reset filters SettingsSort By Accessioned Date Descending Most Relevant Title Ascending Date Issued Descending Results per page 1 5 10 20 40 60 80 100 Search Search Tools Search ResultsNow showing 1 - 10 of 28482 No Thumbnail Available PublicationOn the Computational Power of QAC0 with Barely Superlinear Ancillae (2024-10-09) Anshu, Anurag; Dong, Yangjing; Ou, Fenging; Yao, PenghuiShow moreQAC0 is the family of constant-depth polynomial-size quantum circuits consisting of arbitrary single qubit unitaries and multi-qubit Toffoli gates. It was introduced by Moore [arXiv: 9903046] as a quantum counterpart of AC0, along with the conjecture that QAC0 circuits can not compute PARITY. In this work we make progress on this longstanding conjecture: we show that any depth-d QAC0 circuit requires n1+3−d ancillae to compute a function with approximate degree Θ(n), which includes PARITY, MAJORITY and MODk. We further establish superlinear lower bounds on quantum state synthesis and quantum channel synthesis. This is the first superlinear lower bound on the super-linear sized QAC0. Regarding PARITY, we show that any further improvement on the size of ancillae to n1+exp(−o(d)) would imply that PARITY ∉ QAC0. These lower bounds are derived by giving low-degree approximations to QAC0 circuits. We show that a depth-d QAC0 circuit with a ancillae, when applied to low-degree operators, has a degree (n+a)1−3−d polynomial approximation in the spectral norm. This implies that the class QLC0, corresponding to linear size QAC0 circuits, has approximate degree o(n). This is a quantum generalization of the result that LC0 circuits have approximate degree o(n) by Bun, Robin, and Thaler [SODA 2019]. Our result also implies that QLC0≠NC1.Show more No Thumbnail Available PublicationUniqueQMA vs QMA: oracle separation and eigenstate thermalization hypothesis (2024-10-31) Anshu, Anurag; Haferkamp, Jonas; Hwang, Yeongwoo; Nguyen, Quynh T.Show moreWe study the long-standing open question of the power of unique witness in quantum protocols, which asks if UniqueQMA, a variant of QMA whose accepting witness space is 1-dimensional, is equal to QMA. We show a quantum oracle separation between UniqueQMA and QMA via an extension of the Aaronson-Kuperberg's QCMA vs QMA oracle separation. In particular, we show that any UniqueQMA protocol must make Ω(D−−√) queries to a subspace phase oracle of unknown dimension ≤D to "find" the subspace. This presents an obstacle to relativizing techniques in resolving this question (unlike its classical analogue - the Valiant-Vazirani theorem - which is essentially a black-box reduction) and suggests the need to study the structure of the ground space of local Hamiltonians in distilling a potential unique witness. Our techniques also yield a quantum oracle separation between QXC, the class characterizing quantum approximate counting, and QMA. Very few structural properties are known that place the complexity of local Hamiltonians in UniqueQMA. We expand this set of properties by showing that the ground energy of local Hamiltonians that satisfy the eigenstate thermalization hypothesis (ETH) can be estimated through a UniqueQMA protocol. Specifically, our protocol can be viewed as a quantum expander test in a low energy subspace of the Hamiltonian and verifies a unique entangled state in two copies of the subspace. This allows us to conclude that if UniqueQMA ≠ QMA, then QMA-hard Hamiltonians must violate ETH under adversarial perturbations (more accurately, under the quantum PCP conjecture if ETH only applies to extensive energy subspaces). Our results serve as evidence that chaotic local Hamiltonians, such as the SYK model, contain polynomial verifiable quantum states in their low energy regime and may be simpler than general local Hamiltonians if UniqueQMA ≠ QMA.Show more No Thumbnail Available PublicationLearning Shallow Quantum Circuits (Association for Computing Machinery, 2024-06-11) Huang, Hsin-Yuan; Anshu, Anurag; Liu, Yunchao; Broughton, Michael; Kim, Isaac; Landau, Zeph; McClean, Jarrod R.Show moreDespite fundamental interests in learning quantum circuits, the existence of a computationally efficient algorithm for learning shallow quantum circuits remains an open question. Because shallow quantum circuits can generate distributions that are classically hard to sample from, existing learning algorithms do not apply. In this work, we present a polynomial-time classical algorithm for learning the description of any unknown n-qubit shallow quantum circuit U (with arbitrary unknown architecture) within a small diamond distance using single-qubit measurement data on the output states of U. We also provide a polynomial-time classical algorithm for learning the description of any unknown n-qubit state | ψ ⟩ = U | 0n ⟩ prepared by a shallow quantum circuit U (on a 2D lattice) within a small trace distance using single-qubit measurements on copies of | ψ ⟩. Our approach uses a quantum circuit representation based on local inversions and a technique to combine these inversions. This circuit representation yields an optimization landscape that can be efficiently navigated and enables efficient learning of quantum circuits that are classically hard to simulate.Show more No Thumbnail Available PublicationIdentification of more than 40 gravitationally magnified stars in a galaxy at redshift 0.725 (Springer Science and Business Media LLC, 2025-01-06) Fudamoto, Yoshinobu; Sun, Fengwu; Diego, Jose M.; Dai, Liang; Oguri, Masamune; Zitrin, Adi; Zackrisson, Erik; Jauzac, Mathilde; Lagattuta, David J.; Egami, Eiichi; Iani, Edoardo; Windhorst, Rogier A.; Abe, Katsuya T.; Bauer, Franz Erik; Bian, Fuyan; Bhatawdekar, Rachana; Broadhurst, Thomas J.; Cai, Zheng; Chen, Chian-Chou; Chen, Wenlei; Cohen, Seth H.; Conselice, Christopher J.; Espada, Daniel; Foo, Nicholas; Frye, Brenda L.; Fujimoto, Seiji; Furtak, Lukas J.; Golubchik, Miriam; Hsiao, Tiger Yu-Yang; Jolly, Jean-Baptiste; Kawai, Hiroki; Kelly, Patrick L.; Koekemoer, Anton M.; Kohno, Kotaro; Kokorev, Vasily; Li, Mingyu; Li, Zihao; Lin, Xiaojing; Magdis, Georgios E.; Meena, Ashish K.; Niemiec, Anna; Nabizadeh, Armin; Richard, Johan; Steinhardt, Charles L.; Wu, Yunjing; Zhu, Yongda; Zou, Siwei; fudamoto, yoshinobuShow moreStrong gravitational magnifications enable to detect faint background sources, resolve their internal structures, and even identify individual stars in distant galaxies. Highly magnified individual stars allow various appli- cations, including studies of stellar populations in dis- tant galaxies and constraining dark matter structures in the lensing plane. However, these applications have been hampered by the small number of individual stars observed, as typically one or a few stars are identified from each distant galaxy. Here, we report the discovery of more than 40 microlensed stars in a single galaxy be- hind Abell 370 at redshift of 0.725 when the Universe was half of its current age (dubbed “the Dragon arc”), using James Webb Space Telescope (JWST) observations with the time-domain technique. These events are found near the expected lensing critical curves, suggesting that these are magnified stars that appear as transients from intr- acluster stellar microlenses. Through multi-wavelength photometry, we constrain stellar types and find that many of them are consistent with red giants/supergiants magnified by factors of hundreds. This finding reveals an unprecedented high occurrence of microlensing events in the Dragon arc, and proves that JWST’s time-domain observations open up the possibility of conducting statistical studies of high-redshift stars.Show more No Thumbnail Available PublicationOpportunities in nanoscale probing of laser-driven phase transitions (Springer Science and Business Media LLC, 2024-08-28) Yannai, Michael; Haller, Matan; Ruimy, Ron; Gorlach, Alexey; Rivera, Nicholas; Basov, Dmitri N.; Kaminer, IdoShow more No Thumbnail Available PublicationQuantum error correction below the surface code thresholdGoogle Quantum AI; Lee, JoonhoShow more No Thumbnail Available PublicationThermalization and criticality on an analogue–digital quantum simulator (Springer Science and Business Media LLC, 2025-2-5) Andersen, T. I.; Astrakhantsev, N.; Karamlou, A. H.; Berndtsson, J.; Motruk, J.; Szasz, A.; Gross, J. A.; Schuckert,