title = "HKS Mossavar-Rahmani Center for Business & Government"
full_description = "HKS Mossavar-Rahmani Center for Business & GovernmentPermanent URI for this collectionhttps://dash.harvard.edu/handle/1/37371316Browse Search By Issue Date By Author By Title By Subject By Department Search By Issue Date By Author By Title By Subject By Department 48 results Back to results Filters Author 4 search.filters.author.Ahmady, Ajmal 3 search.filters.author.Balls, Edward 3 search.filters.author.Gibson, Stephen 3 search.filters.author.Turner, Daniel 2 search.filters.author.Elsden, Esme Show more Search author name Submit Date Start End Submit 2019 - 201912020 - 202547 Has files 48 Yes Item Type 48 Publication Deposit Date Start End Submit 2020 - 202547 Reset filters SettingsSort By Accessioned Date Descending Most Relevant Title Ascending Date Issued Descending Results per page 1 5 10 20 40 60 80 100 Search Search Tools Search ResultsNow showing 1 - 10 of 48 No Thumbnail Available PublicationGovernance at a Crossroads: Artificial Intelligence and the Future of Innovation in America (Mossavar-Rahmani Center for Business & Government, 2025) Carvão, Paulo; Ancheva, Slavina; Atir, Yam; Jeloka, Shaurya; Zhou, BrianShow moreThe accelerated adoption of Artificial Intelligence marks a pivotal moment in technological progress. AI is reshaping industries, redefining labor markets, and prompting critical societal reflections on intelligence, reasoning, and the dissemination of information. While AI offers opportunities for economic growth, it also presents risks that must be managed to avoid adverse societal and geopolitical outcomes, making effective and transparent governance more urgent than ever. This paper explores the potential of dynamic, collaborative public-private governance to foster safe innovation. Drawing from primary research, including interviews with tech industry leaders, U.S. Members of Congress, and staff, and an analysis of 150 AI-related bills introduced by the 118th U.S. Congress, this work identifies emerging areas of alignment between policymakers and industry stakeholders. It also highlights opportunities for a unified national approach, despite the challenges of a fragmented legislative environment. The authors propose a dynamic governance approach that brings government and industry together while combining the foresight of ex-ante measures with the adaptability needed to respond to technological advancements. Coupled with existing ex-post mechanisms, the Dynamic Governance Model creates a comprehensive framework to promote competition, innovation, and accountability. It represents a policy-agnostic extra-regulatory framework, including a public-private partnership for standards setting and a market-based ecosystem for audit and compliance.Show more No Thumbnail Available PublicationSovereign Debt Restructuring with China at the Table: Forward Progress but Lost Decade Risk Remains (Harvard Kennedy School, 2025-01) Makoff, Gregory; Maret, Théo; Wright, LoganShow moreSovereign debt restructuring deals have not been smooth sailing over the last few years. They have moved slowly, been marked by bickering between China and G7 stalwarts, and the outcomes have been inconsistent. Recent policy innovations, however, have successfully accelerated the pace at which deals are being completed —that’s the good news. The bad news is that China remains highly reluctant to grant permanent debt relief. Deals are coming faster, but debt relief may be insufficient to avoid repeat restructurings. This is deeply unfortunate in the post-Covid-19 context, with many lower income countries at or near debt distress (World Bank 2024 at 18). The first part of this paper explains this recent history. We explain how the architecture of sovereign debt restructuring has evolved over the last four years in response to China’s objections to the traditional rules and procedures of the Paris Club and the IMF. After a short introductory section on China’s overseas lending boom, we review disputes over the procedures applied in the restructuring of the debt of Congo Brazzaville (2018–2019), Suriname (2021–2023), and Zambia (2020–2024). Then we review the policy innovations announced between 2022–2024 to resolve these disputes. We suggest that faster motion in recent debt restructurings is a direct result of this successful policy process, China’s pressure leading to positive procedural changes. The latter part of this paper addresses a remaining challenge: China’s general unwillingness to grant permanent debt relief. This creates the possibility that the international restructuring architecture will be run to prefer debt maturity extension and avoid granting debt relief. This risks a repeat of the “lost decade” of the 1980s, when write-downs were systematically avoided, and many countries were trapped in serial restructurings until debt relief was finally granted in the Brady plans of the 1990s. We discuss this topic in two parts, first addressing China’s complex institutional setting, then explaining China’s policy, legal, and economic constraints to granting debt relief. We conclude by recommending that China establishes a sovereign debt asset management company to centralize management of its problematic sovereign loans, an idea borrowed from the playbook China used in the 1990s to clean up its commercial banks. The idea would be for the new agency to take over all the problematic loans from China Development Bank (CDB) and China Eximbank. This would provide significant institutional efficiency, allow better high-level oversight, facilitate superior data management, and allow China to more flexibly respond to the exigencies of future international sovereign debt negotiations.Show more No Thumbnail Available PublicationChinese Graduate Students' Experience of U.S. Higher Education Through Covid and U.S.-China Tensions (Mossavar-Rahmani Center for Business & Government, 2024-08) Yarrow, Richard; Li, VictoriaShow moreAbout 300,000 students from the People’s Republic of China study in the United States. This population of students lay the base for academic ties between the U.S. and China. Today, university relations are near the heart of U.S.-China relations—encapsulating issues of intellectual property, national security, cultural exchange, and scientific and economic progress. At a time when many Chinese STEM graduate students are under great stress–from job markets, geopolitics, and lingering effects of the pandemic–we sought to shine light on how Chinese graduate students, primarily in STEM fields, think about their time in American higher education. Over the last three years, we conducted multi-hour interviews with roughly 45 Chinese doctoral or postdoctoral students at universities across the United States. This paper offers an outline, based on comments from our sample, of how U.S. universities could better serve and attract Chinese students and researchers.Show more No Thumbnail Available PublicationOvercoming the Collective Action Problem in the Common Framework (Mossavar-Rahmani Center for Business & Government, 2024-11) Grigorian, DavidShow moreSince the approach envisaged under the Common Framework attempts to bring together a larger and more diverse group of creditors than usually observed in sovereign debt restructurings, consistent with the Theory of Collective Action, additional measures may be required to compensate for the added complexity and incentive issues. To address this de facto collective action problem, the paper proposes a modified framework that is based on: (1) simplicity and speed with elements of coercion and enticement, (2) improved coordination based on a more prominent role for the US and China, (3) a more nuanced treatment of domestic debt within the restructuring perimeter, and (4) a modified “comparability of treatment” principle. While multilateral debt will not be restructured under the proposed approach, the International Financial Institutions with exposure to sample countries are expected to contribute to safeguarding financial stability of domestic financial sectors.Show more No Thumbnail Available PublicationAdvice for New York State and International Policymakers Regarding Sovereign Debt Reforms at the State Level (Mossavar-Rahmani Center for Business & Government, 2024-09) Makoff, GregoryShow moreThe possibility of sovereign debt legislation at the state level has been an underexplored area in sovereign debt policy—that is until the New York State Legislature became the center of serious contention over three proposed bills during the last two legislative sessions. The bills pitted social activists seeking to help relieve sovereign debts against bond-market organizations claiming that the bills would drive business out of New York State and raise the cost of financing for developing countries. Rhetoric flew and lobbying was intense. Yet a constructive outcome was achieved: two of the bills were dropped while the New York Senate passed the third bill after incorporating significant changes required by the market. The purpose of this working paper is to recount the legislative history of these three bills and to use their differing features—and outcomes—to draw policy rules regarding the appropriate scope of sovereign debt reforms carried out at the state level.Show more No Thumbnail Available PublicationAI for the People: Use Cases for Government (M-RCBG Faculty Working Paper Series, 2024-08) Fagan, MarkShow moreArtificial intelligence (AI) is the news topic of the 2020s. From ChatGPT writing essays to chatbots answering questions to algorithms identifying cancers, AI is impacting and often disrupting how we live our lives. AI is proposed or in place in every domain and touches every function. In government, AI is relevant for departments from education and transportation to national security and public safety. Within these organizations, AI can facilitate the hiring of new employees, providing interactive responses with constituents, planning workloads, identifying anomalies, and forecasting natural disasters, to name a few applications.Show more No Thumbnail Available PublicationRisk Management: Lessons Learned from Afghanistan's Central Bank (Mossavar-Rahmani Center for Business & Government, 2024-09) Ahmady, AjmalShow moreThis paper reviews the development of Afghanistan’s central bank (DAB) risk management practices, including both operational risk management and anti-money laundering (AML) and counter-financing of terrorism (CFT) risk management. We then develop a few principles that may be of use to policymakers from frontier economies as they review their own risk management regimes.Show more No Thumbnail Available PublicationA better old age? Improving health and care outcomes for the over-65s in the UK (Mossavar-Rahmani Center for Business & Government, 2024-06) Cavendish, Camilla; Moberg, Gabriel; Freedman, JessicaShow moreBritain’s health and care system is in a precarious state. The pressures of an ageing population, common to many industrialised countries, are being compounded by post-pandemic waiting lists for National Health Service (NHS) treatment which number around 7.7 million people. Public satisfaction with the NHS has fallen to historic lows of 24%, a drop of 29 percentage points since 2020. Part of the problem is insufficient social care capacity, which is overburdening hospitals. At times, up to a third of hospital beds in some regions have been occupied by older people who are medically fit for discharge but who cannot live independently, and cannot get access to social care. Satisfaction with social care is even lower with only 13% of the British public reporting satisfaction with the system. Already, the system is failing to meet the demands placed upon it. Currently, 16% of people aged between 65 and 74 struggle with one or more of the activities of daily living (ADL), according to the English Longitudinal Study of Ageing (ELSA). Of those aged 85+, 44% struggle with one or more ADLs. AgeUK estimates that 1.6 million people over 65 have unmet needs for care and support. To make matters worse, demand for social care from the over-65s in England is increasing as the population ages and grows. The annual number of requests for social care to local authorities by over-65s rose from 1.32 million to 1.37 million requests between 2017/18 and 2021/22. Furthermore, projections by the Health Foundation suggest that 1 in 5 people in England could be living with major illness in less than two decades’ time as the prevalence of chronic diseases increase. Compounding the problems has been a lack of meaningful reform by both main political parties. In 2010, a Labour proposal to fund universal social care through a new inheritance tax was dropped after being labelled a ‘death tax’. In 2017, a Conservative manifesto pledge to increase individuals’ contributions towards social care was dropped after being criticised as a ‘dementia tax’. The 2021 Conservative plan for a Health and Social Care levy was dropped in 2022.10 All attempts at setting the financing of elderly care on stronger ground have failed in part because of the political difficulty of raising taxes to fund a system which few voters understand, for a sector which has had little voice.Show more No Thumbnail Available PublicationSizing A Market Entry Reward for the Development of New Antibiotics (Mossavar-Rahmani Center for Business & Government, 2024-05) Evans, Eric; Meyer, Alexandre; Conti, RenaShow moreAntimicrobial resistance (AMR) is a growing threat to global health and wealth. Although new antibiotics are needed to address AMR, industry investment in new antibiotics is limited, due to the expected low economic returns on these projects. The UK implemented a 13M dollar pull incentive in 2022, to provide additional funds to motivate private sector actors to invest in new antibiotics and stakeholders have suggested other OECD governments join these efforts. We examine how large an incentive for industry is needed to invest in new antibiotics to address AMR, using a model of economic return based on Internal Rate of Return (IRR) measures and incorporating the latest data on development phase progression and costs. To achieve a minimum IRR of 11%, our results suggest a government funded market entry reward on the order of 2.6 billion dollars, paid over ten years, would be required to incentivize the development of one new antimicrobial agent. If six new antibiotics were required over a period of ten years, the total indicated fund would be 15.6 billion dollars. Compared to the direct and indirect costs of doing nothing, our estimated cost of a pull incentive seems manageable, and is consistent with estimates of an AMR pull incentive recently proposed in the US Pasteur Act (up to 3 billion dollars). Our estimates provide a foundation for governments and potentially other stakeholders to pursue the development of new antibiotics to avoid or mitigate the AMR crisis.Show more No Thumbnail Available PublicationBui"
