["https://dash.harvard.edu/entities/story/7d27903e-68ec-436e-b681-4f0fa701aa3c/full"]
title = '"What is the History of Books?"… : DASH Story 2015-12-19'
description = "I am a journalist, researcher and alternative publisher from Goa, India, and a long-time supporter of Creative Commons, GNU-GPL and other sharable licenses. Despite being in alternative (book) publishing myself, ours is a tiny operation, and we find access to international reading material very restrictive and hard to come by. It was a pleasant surprise to find this work shared online. I'm sure it would shape my perspectives as I go further along in my research on the history of the book in 20th century Goa (a Portuguese colony for part of the period)."
