full_description = '''FAS Scholarly ArticlesPermanent URI for this collectionhttps://dash.harvard.edu/handle/1/2This collection provides open access to peer reviewed scholarly articles authored or co-authored by faculty, staff, and students of the Faculty of Arts and Sciences. All material in the repository is also harvested by search engines (such as Google Scholar) and Open Archives Initiative data harvesters.Browse Search By Issue Date By Author By Title By Subject By Department Search By Issue Date By Author By Title By Subject By Department 19764 results Back to results Filters Author 461 search.filters.author.Morii, Masahiro 423 search.filters.author.Huth, John 422 search.filters.author.Franklin, Melissa 310 search.filters.author.Loeb, Abraham 286 search.filters.author.Jacob, Daniel Show more Search author name Submit Subject 226 search.filters.subject.Biology and Life Sciences 144 search.filters.subject.Medicine and Health Sciences 141 search.filters.subject.Multidisciplinary 122 search.filters.subject.Biochemistry 120 search.filters.subject.Genetics Show more Search subject Submit Date Start End Submit 1952 - 195941960 - 19792211980 - 19991.9K2000 - 201916.9K2020 - 2025508 Has files 19.8K Yes 4 No Item Type 19.8K Publication FAS Department 2.8K search.filters.fas_department.Engineering and Applied Sciences 2.1K search.filters.fas_department.Physics 1.3K search.filters.fas_department.Organismic and Evolutionary Biology 1.1K search.filters.fas_department.Economics 1.1K search.filters.fas_department.Chemistry and Chemical Biology Show more Search Department Submit Deposit Date Start End Submit 2008 - 20091.9K2010 - 201916.2K2020 - 20251.6K Reset filters SettingsSort By Accessioned Date Descending Most Relevant Title Ascending Date Issued Descending Results per page 1 5 10 20 40 60 80 100 Search Search Tools Search ResultsNow showing 1 - 10 of 19764 No Thumbnail Available PublicationOn the Computational Power of QAC0 with Barely Superlinear Ancillae (2024-10-09) Anshu, Anurag; Dong, Yangjing; Ou, Fenging; Yao, PenghuiShow moreQAC0 is the family of constant-depth polynomial-size quantum circuits consisting of arbitrary single qubit unitaries and multi-qubit Toffoli gates. It was introduced by Moore [arXiv: 9903046] as a quantum counterpart of AC0, along with the conjecture that QAC0 circuits can not compute PARITY. In this work we make progress on this longstanding conjecture: we show that any depth-d QAC0 circuit requires n1+3−d ancillae to compute a function with approximate degree Θ(n), which includes PARITY, MAJORITY and MODk. We further establish superlinear lower bounds on quantum state synthesis and quantum channel synthesis. This is the first superlinear lower bound on the super-linear sized QAC0. Regarding PARITY, we show that any further improvement on the size of ancillae to n1+exp(−o(d)) would imply that PARITY ∉ QAC0. These lower bounds are derived by giving low-degree approximations to QAC0 circuits. We show that a depth-d QAC0 circuit with a ancillae, when applied to low-degree operators, has a degree (n+a)1−3−d polynomial approximation in the spectral norm. This implies that the class QLC0, corresponding to linear size QAC0 circuits, has approximate degree o(n). This is a quantum generalization of the result that LC0 circuits have approximate degree o(n) by Bun, Robin, and Thaler [SODA 2019]. Our result also implies that QLC0≠NC1.Show more No Thumbnail Available PublicationUniqueQMA vs QMA: oracle separation and eigenstate thermalization hypothesis (2024-10-31) Anshu, Anurag; Haferkamp, Jonas; Hwang, Yeongwoo; Nguyen, Quynh T.Show moreWe study the long-standing open question of the power of unique witness in quantum protocols, which asks if UniqueQMA, a variant of QMA whose accepting witness space is 1-dimensional, is equal to QMA. We show a quantum oracle separation between UniqueQMA and QMA via an extension of the Aaronson-Kuperberg's QCMA vs QMA oracle separation. In particular, we show that any UniqueQMA protocol must make Ω(D−−√) queries to a subspace phase oracle of unknown dimension ≤D to "find" the subspace. This presents an obstacle to relativizing techniques in resolving this question (unlike its classical analogue - the Valiant-Vazirani theorem - which is essentially a black-box reduction) and suggests the need to study the structure of the ground space of local Hamiltonians in distilling a potential unique witness. Our techniques also yield a quantum oracle separation between QXC, the class characterizing quantum approximate counting, and QMA. Very few structural properties are known that place the complexity of local Hamiltonians in UniqueQMA. We expand this set of properties by showing that the ground energy of local Hamiltonians that satisfy the eigenstate thermalization hypothesis (ETH) can be estimated through a UniqueQMA protocol. Specifically, our protocol can be viewed as a quantum expander test in a low energy subspace of the Hamiltonian and verifies a unique entangled state in two copies of the subspace. This allows us to conclude that if UniqueQMA ≠ QMA, then QMA-hard Hamiltonians must violate ETH under adversarial perturbations (more accurately, under the quantum PCP conjecture if ETH only applies to extensive energy subspaces). Our results serve as evidence that chaotic local Hamiltonians, such as the SYK model, contain polynomial verifiable quantum states in their low energy regime and may be simpler than general local Hamiltonians if UniqueQMA ≠ QMA.Show more No Thumbnail Available PublicationLearning Shallow Quantum Circuits (Association for Computing Machinery, 2024-06-11) Huang, Hsin-Yuan; Anshu, Anurag; Liu, Yunchao; Broughton, Michael; Kim, Isaac; Landau, Zeph; McClean, Jarrod R.Show moreDespite fundamental interests in learning quantum circuits, the existence of a computationally efficient algorithm for learning shallow quantum circuits remains an open question. Because shallow quantum circuits can generate distributions that are classically hard to sample from, existing learning algorithms do not apply. In this work, we present a polynomial-time classical algorithm for learning the description of any unknown n-qubit shallow quantum circuit U (with arbitrary unknown architecture) within a small diamond distance using single-qubit measurement data on the output states of U. We also provide a polynomial-time classical algorithm for learning the description of any unknown n-qubit state | ψ ⟩ = U | 0n ⟩ prepared by a shallow quantum circuit U (on a 2D lattice) within a small trace distance using single-qubit measurements on copies of | ψ ⟩. Our approach uses a quantum circuit representation based on local inversions and a technique to combine these inversions. This circuit representation yields an optimization landscape that can be efficiently navigated and enables efficient learning of quantum circuits that are classically hard to simulate.Show more No Thumbnail Available PublicationIdentification of more than 40 gravitationally magnified stars in a galaxy at redshift 0.725 (Springer Science and Business Media LLC, 2025-01-06) Fudamoto, Yoshinobu; Sun, Fengwu; Diego, Jose M.; Dai, Liang; Oguri, Masamune; Zitrin, Adi; Zackrisson, Erik; Jauzac, Mathilde; Lagattuta, David J.; Egami, Eiichi; Iani, Edoardo; Windhorst, Rogier A.; Abe, Katsuya T.; Bauer, Franz Erik; Bian, Fuyan; Bhatawdekar, Rachana; Broadhurst, Thomas J.; Cai, Zheng; Chen, Chian-Chou; Chen, Wenlei; Cohen, Seth H.; Conselice, Christopher J.; Espada, Daniel; Foo, Nicholas; Frye, Brenda L.; Fujimoto, Seiji; Furtak, Lukas J.; Golubchik, Miriam; Hsiao, Tiger Yu-Yang; Jolly, Jean-Baptiste; Kawai, Hiroki; Kelly, Patrick L.; Koekemoer, Anton M.; Kohno, Kotaro; Kokorev, Vasily; Li, Mingyu; Li, Zihao; Lin, Xiaojing; Magdis, Georgios E.; Meena, Ashish K.; Niemiec, Anna; Nabizadeh, Armin; Richard, Johan; Steinhardt, Charles L.; Wu, Yunjing; Zhu, Yongda; Zou, Siwei; fudamoto, yoshinobuShow moreStrong gravitational magnifications enable to detect faint background sources, resolve their internal structures, and even identify individual stars in distant galaxies. Highly magnified individual stars allow various appli- cations, including studies of stellar populations in dis- tant galaxies and constraining dark matter structures in the lensing plane. However, these applications have been hampered by the small number of individual stars observed, as typically one or a few stars are identified from each distant galaxy. Here, we report the discovery of more than 40 microlensed stars in a single galaxy be- hind Abell 370 at redshift of 0.725 when the Universe was half of its current age (dubbed “the Dragon arc”), using James Webb Space Telescope (JWST) observations with the time-domain technique. These events are found near the expected lensing critical curves, suggesting that these are magnified stars that appear as transients from intr- acluster stellar microlenses. Through multi-wavelength photometry, we constrain stellar types and find that many of them are consistent with red giants/supergiants magnified by factors of hundreds. This finding reveals an unprecedented high occurrence of microlensing events in the Dragon arc, and proves that JWST’s time-domain observations open up the possibility of conducting statistical studies of high-redshift stars.Show more No Thumbnail Available PublicationOpportunities in nanoscale probing of laser-driven phase transitions (Springer Science and Business Media LLC, 2024-08-28) Yannai, Michael; Haller, Matan; Ruimy, Ron; Gorlach, Alexey; Rivera, Nicholas; Basov, Dmitri N.; Kaminer, IdoShow more No Thumbnail Available PublicationQuantum error correction below the surface code thresholdGoogle Quantum AI; Lee, JoonhoShow more No Thumbnail Available PublicationThermalization and criticality on an analogue–digital quantum simulator (Springer Science and Business Media LLC, 2025-2-5) Andersen, T. I.; Astrakhantsev, N.; Karamlou, A. H.; Berndtsson, J.; Motruk, J.; Szasz, A.; Gross, J. A.; Schuckert, A.; Westerhout, T.; Zhang, Y.; Forati, E.; Rossi, D.; Kobrin, B.; Paolo, A. Di; Klots, A. R.; Drozdov, I.; Kurilovich, V.; Petukhov, A.; Ioffe, L. B.; Elben, A.; Rath, A.; Vitale, V.; Vermersch, B.; Acharya, R.; Beni, L. A.; Anderson, K.; Ansmann, M.; Arute, F.; Arya, K.; Asfaw, A.; Atalaya, J.; Ballard, B.; Bardin, J. C.; Bengtsson, A.; Bilmes, A.; Bortoli, G.; Bourassa, A.; Bovaird, J.; Brill, L.; Broughton, M.; Browne, D. A.; Buchea, B.; Buckley, B. B.; Buell, D. A.; Burger, T.; Burkett, B.; Bushnell, N.; Cabrera, A.; Campero, J.; Chang, H.-S.; Chen, Z.; Chiaro, B.; Claes, J.; Cleland, A. Y.; Cogan, J.; Collins, R.; Conner, P.; Courtney, W.; Crook, A. L.; Das, S.; Debroy, D. M.; Lorenzo, L. De; Barba, A. Del Toro; Demura, S.; Donohoe, P.; Dunsworth, A.; Earle, C.; Eickbusch, A.; Elbag, A. M.; Elzouka, M.; Erickson, C.; Faoro, L.; Fatemi, R.; Ferreira, V. S.; Burgos, L. Flores; Fowler, A. G.; Foxen, B.; Ganjam, S.; Gasca, R.; Giang, W.; Gidney, C.; Gilboa, D.; Giustina, M.; Gosula, R.; Dau, A. Grajales; Graumann, D.; Greene, A.; Habegger, S.; Hamilton, M. C.; Hansen, M.; Harrigan, M. P.; Harrington, S. D.; Heslin, S.; Heu, P.; Hill, G.; Hoffmann, M. R.; Huang, H.-Y.; Huang, T.; Huff, A.; Huggins, W. J.; Isakov, S. V.; Jeffrey, E.; Jiang, Z.; Jones, C.; Jordan, S.; Joshi, C.; Juhas, P.; Kafri, D.; Kang, H.; Kechedzhi, K.; Khaire, T.; Khattar, T.; Khezri, M.; Kieferová, M.; Kim, S.; Kitaev, A.; Klimov, P.; Korotkov, A. N.; Kostritsa, F.; Kreikebaum, J. M.; Landhuis, D.; Langley, B. W.; Laptev, P.; Lau, K.-M.; Guevel, L. Le; Ledford, J.; Lee, J.; Lee, K. W.; Lensky, Y. D.; Lester, B. J.; Li, W. Y.; Lill, A. T.; Liu, W.; Livingston, W. P.; Locharla, A.; Lundahl, D.; Lunt, A.; Madhuk, S.; Maloney, A.; Mandrà, S.; Martin, L. S.; Martin, O.; Martin, S.; Maxfield, C.; McClean, J. R.; McEwen, M.; Meeks, S.; Miao, K. C.; Mieszala, A.; Molina, S.; Montazeri, S.; Morvan, A.; Movassagh, R.; Neill, C.; Nersisyan, A.; Newman, M.; Nguyen, A.; Nguyen, M.; Ni, C.-H.; Niu, M. Y.; Oliver, W. D.; Ottosson, K.; Pizzuto, A.; Potter, R.; Pritchard, O.; Pryadko, L. P.; Quintana, C.; Reagor, M. J.; Rhodes, D. M.; Roberts, G.; Rocque, C.; Rosenberg, E.; Rubin, N. C.; Saei, N.; Sankaragomathi, K.; Satzinger, K. J.; Schurkus, H. F.; Schuster, C.; Shearn, M. J.; Shorter, A.; Shutty, N.; Shvarts, V.; Sivak, V.; Skruzny, J.; Small, S.; Smith, W. Clarke; Springer, S.; Sterling, G.; Suchard, J.; Szalay, M.; Sztein, A.; Thor, D.; Torres, A.; Torunbalci, M. M.; Vaishnav, A.; Vdovichev, S.; Villalonga, B.; Heidweiller, C. Vollgraff; Waltman, S.; Wang, S. X.; White, T.; Wong, K.; Woo, B. W. K.; Xing, C.; Yao, Z. Jamie; Yeh, P.; Ying, B.; Yoo, J.; Yosri, N.; Young, G.; Zalcman, A.; Zhu, N.; Zobrist, N.; Neven, H.; Babbush, R.; Boixo, S.; Hilton, J.; Lucero, E.; Megrant, A.; Kelly, J.; Chen, Y.; Smelyanskiy, V.; Vidal, G.; Roushan, P.; Läuchli, A. M.; Abanin, D. A.; Mi, X.Show moreAbstract Understanding how interacting particles approach thermal equilibrium is a major challenge of quantum simulators1,2. Unlocking the full potential of such systems towards this goal requires flexible initial state preparation, precise time evolution and extensive probes for final state characterization. Here we present a quantum simulator comprising 69 superconducting qubits that supports both universal quantum gates and high-fidelity analogue evolution, with performance beyond the reach of classical simulation in cross-entropy benchmarking experiments. This hybrid platform features more versatile measurement capabilities compared with analogue-only simulators, which we leverage here to reveal a coarsening-induced breakdown of Kibble–Zurek scaling predictions3 in the XY model, as well as signatures of the classical Kosterlitz–Thouless phase transition4. Moreover, the digital gates enable precise energy control, allowing us to study the effects of the eigenstate thermalization hypothesis5–7 in targeted parts of the eigenspectrum. We also demonstrate digital preparation of pairwise-entangled dimer states, and image the transport of energy and vorticity during subsequent thermalization in analogue evolution. These results establish the efficacy of superconducting analogue–digital quantum processors for preparing states across many-body spectra and unveiling their thermalization dynamics.Show more No Thumbnail Available PublicationIn Situ Techniques for Quinone-Mediated Electrochemical Carbon Capture and Release in Aqueous Environments (American Chemical Society (ACS), 2024-01-31) Amini, Kiana; Cochard, Thomas; Jing, Yan; Sosa, Jordan D.; Xi, Dawei; Alberts, Maia; Emanuel, Michael S.; Kerr, Emily F.; Gordon, Roy G.; Aziz, MichaelShow moreWe present two novel experimental techniques designed to quantify the contributions of nucleophilicity-swing and pH-swing mechanisms to carbon capture in the electrochemical aqueous quinone-based CO2 capture process. Through thermodynamic analysis, we elucidate the intricate interplay between these two mechanisms, and emphasize the critical ro'''
