full_description = "Graduate School of EducationPermanent URI for this communityhttps://dash.harvard.edu/handle/1/3345927This community provides open access to material created by faculty, staff, and students of the Graduate School of Education. All material in the repository is also harvested by search engines (such as Google Scholar) and Open Archives Initiative data harvesters.Browse Search Subcommunities and Collections By Issue Date By Author By Title By Subject By Department Search Subcommunities and Collections By Issue Date By Author By Title By Subject By Department 864 results Back to results Filters Author 33 search.filters.author.Levinson, Meira 32 search.filters.author.Dryden-Peterson, Sarah 26 search.filters.author.Rowe, Meredith 25 search.filters.author.Star, Jon 23 search.filters.author.Luk, Gigi Show more Search author name Submit Subject 82 search.filters.subject.Education, Administration 80 search.filters.subject.Education, General 65 search.filters.subject.Educational leadership 62 search.filters.subject.Education 39 search.filters.subject.Education, Curriculum and Instruction Show more Search subject Submit Date Start End Submit 1981 - 198911990 - 199952000 - 2009952010 - 20195872020 - 2024165 Has files 572 Yes 287 No Item Type 859 Publication FAS Department 49 search.filters.fas_department.Doctor of Education Leadership (Ed.L.D.) 20 search.filters.fas_department.Psychology 17 search.filters.fas_department.Education Policy, Leadership, and Instructional Practice 17 search.filters.fas_department.Human Development and Education 16 search.filters.fas_department.Culture, Communities, and Education Show more Search Department Submit Deposit Date Start End Submit 2010 - 20196622020 - 2025197 Reset filters SettingsSort By Accessioned Date Descending Most Relevant Title Ascending Date Issued Descending Results per page 1 5 10 20 40 60 80 100 Search Search Tools Search ResultsNow showing 1 - 10 of 864 No Thumbnail Available PublicationThe sustainable development goals and education, achievements and opportunities (Elsevier BV, 2024-01) Reimers, Fernando M.Show more No Thumbnail Available PublicationEducation purposes for a sustainable future (Springer Science and Business Media LLC, 2023-12-20) Reimers, Fernando M.Show more No Thumbnail Available PublicationExploring teachers perceptions and a priori needs for designing smart classrooms: A case from Brazil (Springer Science and Business Media LLC, 2024-07) Ferreira, Andreza; Lima, Danielli Araújo; Oliveira, Wilk; Bittencourt, Ig Ibert; Dermeval, Diego; Reimers, Fernando; Isotani, SeijiShow more No Thumbnail Available PublicationThe Quest for Educational Equity in Mexico (MIT Press, 2024) Reimers, Fernando M.Show moreAbstract I examine the dynamics of implementing at-scale reforms to provide meaningful educational opportunities to disadvantaged students in Mexico. To effectively reduce social inequality and exclusion, education policies need a mix of system-wide and targeted efforts that are implemented at scale and sustained long enough to become institutionalized. The resiliency of those policies requires an elusive balance between system-wide and targeted efforts, alignment between federal and state initiatives, and supportive politics. However, the politics of implementing system-wide reforms are more contentious than those involving targeted efforts because they disrupt entrenched interests, making such efforts harder to sustain. Targeted policies, while easier to implement, reinforce the segregation of students into different educational tracks of varying quality.Show more No Thumbnail Available PublicationEducation and the challenges for democracy (Mary Lou Fulton Teacher College, 2023-09-19) Reimers, Fernando M.Show moreThis introductory essay for the special issue, “Education and the Challenges for Democracy,” proposes challenges to democracy call for a reexamination of the relationship of democracy to democratic education. The essay describes the challenges to democracy, how those challenges impact democratic education and how education can address those challenges, followed by a summary of six peer reviewed papers that examine the relationship of education to democracy in Japan, Singapore, South Africa and the United States. The essay concludes with a discussion of the significance of these papers to understand the dialectical relationship between education and democracy, and their implications for research, policy and practice.Show more No Thumbnail Available PublicationEducating Students for Climate Action: Distraction or Higher-Education Capital? (MIT Press, 2024) Reimers, Fernando M.Show moreAbstract This essay examines how universities are responding to demands to educate students for climate action. I argue for a whole-of-university approach, in which sustainability becomes part of the mission of the university, and translates into reimagined forms of education, research, outreach, and management of the university operations. This approach runs counter to the most common response of universities, incremental to new demands, and is likely to take place only in institutions with greater capacity for innovation. Strategy and knowledge are key resources to support such innovation, drawing on the comparative analysis of the global experience of higher education, as there are already high rates of institutional innovation globally in educating for climate action.Show more No Thumbnail Available PublicationThe Right to Education (Oxford University Press, 2021-06-09) Dryden-Peterson, Sarah; Mariën, HaniaShow moreAbstract This chapter examines the right to education of refugees. International human rights instruments, including the International Covenant on Economic, Social and Cultural Rights (ICESCR) and the Refugee Convention, provide a framework for the right to education for refugees. As a social right, and as reflected in the ICESCR, the right to education is to be progressively realized and requires positive action and allocation of funding. Like all human rights, it is dependent on action by government, the availability of public resources, and enforcement mechanisms. The devolution of responsibility for the education of refugees to States through recent policy further entrenches the role of the State in respecting, protecting, and fulfilling refugees’ right to education. The chapter then explores the intersection of global and national frameworks for the right to education for refugees and its realization in the form of access to schools. Despite the widely embraced global articulation of the right to education for all refugee children, the realization of the right to education is highly variable, being largely dependent upon their State of asylum.Show more No Thumbnail Available PublicationEducation for Refugees: Building Durable Futures? (Oxford University Press (OUP), 2023) Horst, Cindy; Dryden-Peterson, SarahShow moreAbstract Education is one of the key tools of nation-building, as it aims to create future citizens. Yet what happens in seemingly ‘futureless’ contexts where refugees cannot access even social membership, let alone legal citizenship? In this introduction to our special issue on education for refugees, we explore the aspirations and conceptions of possible futures that students, teachers, governments, international non-governmental organizations (INGOs), and funders have when they promote and pursue education as the solution to the liminal position that refugees in protracted refugee situations find themselves in. Based on insights from the articles, we analyse disconnects between aspirations for education and realities of access to quality education and to opportunities after completing education. We argue that to address these disconnects requires us to move beyond temporal and spatial binaries—present vs. future, here vs. there—that are so common in refugee education discourse and policy. Our suggestion is to draw on and support stakeholders’ work, powerfully exemplified in this special issue, to contribute to improved conditions through pedagogies, practices, and policies that address these binaries.Show more No Thumbnail Available PublicationUnderstanding Implementation: Street-Level Bureaucrats' Resources for Reform (Oxford University Press (OUP), 2003-07-01) Hill, H. C.Show more No Thumbnail Available PublicationMathematical Knowledge of Middle School Teachers: Implications for the No Child Left Behind Policy Initiative (American Educational Research Association (AERA), 2007-06) Hill, Heather C.Show more This article explores middle school teachers’ mathematical knowledge for teaching and the relationship between such knowledge and teachers’subject matter preparation, certification type, teaching experience, and their students’ poverty status. The author administered multiple-choice measures to a nationally representative sample of teachers and found that those with more mathematical course work, a subject-specific certification, and high school teaching experience tended to possess higher levels of teaching-specific mathematical knowledge. However, teachers with strong mathematical knowledge for teaching are, like those with full credentials and preparation, distributed unequally across the population of U.S. students. Specifically, more affluent students are more likely to encounter more knowledgeable teachers. The author discusses the implications of this for current U.S. policies aimed at improving teacher quality. Show more« 1 (current) 2 3 4 5 6 7 8 9 10 ... 87 »"
