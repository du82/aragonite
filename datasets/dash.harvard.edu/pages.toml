he subspace. This allows us to conclude that if UniqueQMA ≠ QMA, then QMA-hard Hamiltonians must violate ETH under adversarial perturbations (more accurately, under the quantum PCP conjecture if ETH only applies to extensive energy subspaces). Our results serve as evidence that chaotic local Hamiltonians, such as the SYK model, contain polynomial verifiable quantum states in their low energy regime and may be simpler than general local Hamiltonians if UniqueQMA ≠ QMA.DescriptionOther Available SourcesKeywordsQuantum Physics, Computational Complexity Terms of Use This article is made available under the terms and conditions applicable to Open Access Policy Articles (OAP), as set forth at Terms of ServiceURI https://dash.harvard.edu/handle/1/42716460CollectionsFAS Scholarly ArticlesEndorsementReviewSupplemented ByReferenced By Full item page Related Stories'''
