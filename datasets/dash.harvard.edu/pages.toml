nce approach that brings government and industry together while combining the foresight of ex-ante measures with the adaptability needed to respond to technological advancements. Coupled with existing ex-post mechanisms, the Dynamic Governance Model creates a comprehensive framework to promote competition, innovation, and accountability. It represents a policy-agnostic extra-regulatory framework, including a public-private partnership for standards setting and a market-based ecosystem for audit and compliance.DescriptionOther Available SourcesKeywordsURI https://dash.harvard.edu/handle/1/42716416CollectionsHKS Mossavar-Rahmani Center for Business & GovernmentEndorsementReviewSupplemented ByReferenced By Full item page Related Stories'
