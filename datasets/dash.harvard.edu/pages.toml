["https://dash.harvard.edu/entities/publication/73120378-8480-6bd4-e053-0100007fdf3b"]
title = '"What is the History of Books?" Revisited'
description = "Having accepted the invitation to revisit my essay of 1982, “What Is the History of Books?”, I find that I can do it only in the first person singular and therefore must ask to be excused for indulging in some autobiographical detail. I would also like to make a disclaimer: in proposing a model for studying the history of books twenty-four years ago, I did not mean to tell book historians how they ought to do their jobs. I hoped that the model might be useful in a heuristic way and never thought of it as comparable to the models favored by economists, the kind in which you insert data, work it over, and arrive at a bottom line. (I do not believe that bottom lines exist in history.) It seemed to me in 1982 that the history of books was suffering from fissiparousness: experts were pursuing such specialized studies that they were losing contact with one another. The esoteric elements of book history needed to be integrated into an overview that would show how the parts could connect to form a whole—or what I characterized as a communications circuit. The tendency toward fragmentation and specialization still exists."
full_description = '''Publication: "What is the History of Books?" RevisitedOpen/View FilesPrimary darnton_revisited.pdf (215.02 KB)Date2007AuthorsDarnton, RobertPublished Version 10.1017/S1479244307001370Journal TitleJournal ISSNVolume TitlePublisherCambridge University Press Share your DASH Story The Harvard community has made this article openly available. Please share how this access benefits you.Research ProjectsOrganizational UnitsJournal IssueCitationDarnton, Robert. 2007. "What is the history of books?" revisited. Modern Intellectual History 4(3): 495-508.Research DataAbstractHaving accepted the invitation to revisit my essay of 1982, “What Is the History of Books?”, I find that I can do it only in the first person singular and therefore must ask to be excused for indulging in some autobiographical detail. I would also like to make a disclaimer: in proposing a model for studying the history of books twenty-four years ago, I did not mean to tell book historians how they ought to do their jobs. I hoped that the model might be useful in a heuristic way and never thought of it as comparable to the models favored by economists, the kind in which you insert data, work it over, and arrive at a bottom line. (I do not believe that bottom lines exist in history.) It seemed to me in 1982 that the history of books was suffering from fissiparousness: experts were pursuing such specialized studies that they were losing contact with one another. The esoteric elements of book history needed to be integrated into an overview that would show how the parts could connect to form a whole—or what I characterized as a communications circuit. The tendency toward fragmentation and specialization still exists.DescriptionOther Available SourcesKeywords Terms of Use This article is made available under the terms and conditions applicable to Other Posted Material (LAA), as set forth at Terms of ServiceURI http://nrs.harvard.edu/urn-3:HUL.InstRepos:3403039CollectionsFAS Scholarly ArticlesEndorsementReviewSupplemented ByReferenced By Full item page Related StoriesStory"What is the History of Books?"… : DASH Story 2013-05-31Hello! I am a PhD student in Library & Information Science at Dominican University. I need to read this article for my advanced seminar on reading, and it's not available at DU. Thank you so much for making this article freely available!Show moreStory"What is the History of Books?"… : DASH Story 2013-09-24Going to university is a costly business, especially if you are supporting yourself and your major is Life sciences (because of all the extra laboratory fees etc.). I attend National Taiwan University at the moment but I grew up in the states, and although my chinese is fairly fluent, reading and writing on a university level remains a challenge. English is a much more comfortable language for me to learn in. Therefore, when my core curriculum classes assigns me translated versions of essays and articles, I set out to find the original english source. Low on money, I can't afford to buy the original english version in Taiwan, but I can usually find the book in the university library, usually but not always though. Open Access helps me read sources that I can't get to without buying the original, and helps me with getting through my university degree by providing me with the original manuscript of articles. Thanks!Show moreStory"What is the History of Books?"… : DASH Story 2013-10-05I am a minister in a major Christian denomination in the United States. I am leading a team of people who are building a new, modern hymn book for our church body. My area of expertise and leadership is how technology will play a role in the new book. I was able to access an article from Harvard through the Open Access program. I doubt I would have had access to this scholarship without such open access. Thank you so much for making this scholarship available.Show moreStory"What is the History of Books?"… : DASH Story 2014-06-10My masters dissertation in the University of Reading is based on Darton's communication circuit. I have been using the 1982 version, but ""What is the History of Books?" Revisited" is also key. The university did not have access to it and the price (US$ 30, I guess) was really expensive for a student. Thank you so much for making it freely available! People tend to think that those enrolled in a post graduate university can afford academic articles, but I have seen that this is not the case.Show moreStory"What is the History of Books?"… : DASH Story 2015-09-07Looking for articles to use in a class and wanted to find more about Darnton's communication circuit. This will be very useful for my students, and since it is open access, they can have an electronic copy without concern for breaking copyright laws.Show moreShow 1 more'''
