["https://dash.harvard.edu/entities/publication/033297fb-060a-4cce-916f-6dc844bb3235/full"]
title = "Learning Shallow Quantum Circuits"
description = "Despite fundamental interests in learning quantum circuits, the existence of a computationally efficient algorithm for learning shallow quantum circuits remains an open question. Because shallow quantum circuits can generate distributions that are classically hard to sample from, existing learning algorithms do not apply. In this work, we present a polynomial-time classical algorithm for learning the description of any unknown n-qubit shallow quantum circuit U (with arbitrary unknown architecture) within a small diamond distance using single-qubit measurement data on the output states of U. We also provide a polynomial-time classical algorithm for learning the description of any unknown n-qubit state | ψ ⟩ = U | 0n ⟩ prepared by a shallow quantum circuit U (on a 2D lattice) within a small trace distance using single-qubit measurements on copies of | ψ ⟩. Our approach uses a quantum circuit representation based on local inversions and a technique to combine these inversions. This circuit representation yields an optimization landscape that can be efficiently navigated and enables efficient learning of quantum circuits that are classically hard to simulate."
full_description = "Publication: Learning Shallow Quantum Circuits Simple item page dash.source.page1343 - 1351dc.contributor.authorHuang, Hsin-Yuandc.contributor.authorAnshu, Anuragdc.contributor.authorLiu, Yunchaodc.contributor.authorBroughton, Michaeldc.contributor.authorKim, Isaacdc.contributor.authorLandau, Zephdc.contributor.authorMcClean, Jarrod R.dc.date.accessioned2025-03-04T21:52:44Zdc.date.issued2024-06-11dc.description.abstractDespite fundamental interests in learning quantum circuits, the existence of a computationally efficient algorithm for learning shallow quantum circuits remains an open question. Because shallow quantum circuits can generate distributions that are classically hard to sample from, existing learning algorithms do not apply. In this work, we present a polynomial-time classical algorithm for learning the description of any unknown n-qubit shallow quantum circuit U (with arbitrary unknown architecture) within a small diamond distance using single-qubit measurement data on the output states of U. We also provide a polynomial-time classical algorithm for learning the description of any unknown n-qubit state | ψ ⟩ = U | 0n ⟩ prepared by a shallow quantum circuit U (on a 2D lattice) within a small trace distance using single-qubit measurements on copies of | ψ ⟩. Our approach uses a quantum circuit representation based on local inversions and a technique to combine these inversions. This circuit representation yields an optimization landscape that can be efficiently navigated and enables efficient learning of quantum circuits that are classically hard to simulate.dc.description.sponsorshipComputer Sciencedc.description.versionAccepted Manuscriptdc.identifier.doi10.1145/3618260.3649722dc.identifier.isbn979-8-4007-0383-6dc.identifier.urihttps://dash.harvard.edu/handle/1/42716461dc.language.isoEnglishdc.publisherAssociation for Computing Machinerydc.relation.isversionofhttps://dl.acm.org/doi/10.1145/3618260.3649722dc.relation.journalSTOC 2024: