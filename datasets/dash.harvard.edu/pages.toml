full_description = '''DASH StoriesPermanent URI for this collectionhttps://dash.harvard.edu/handle/1/42689391Browse Search By Issue Date By Author By Title By Subject By Department Search By Issue Date By Author By Title By Subject By Department 1137 results Back to results Filters Country 596 search.filters.storyCountry.US 103 search.filters.storyCountry.GB 50 search.filters.storyCountry.CA 34 search.filters.storyCountry.AU 32 search.filters.storyCountry.DE Show more Search country Submit Submitted date Start End Submit 2012 - 20161.1K Published date Start End Submit 20251.1K Linked publication 24 search.filters.storyRelatedPublicationTitle.The Benefit of Power Posing Before a High-Stakes Social Evaluation 16 search.filters.storyRelatedPublicationTitle.Racism and Research: The Case of the Tuskegee Syphilis Study 15 search.filters.storyRelatedPublicationTitle.Workplace Wellness Programs Can Generate Savings 13 search.filters.storyRelatedPublicationTitle.Pathways to prosperity: Meeting the challenge of preparing young Americans for the 21st century 12 search.filters.storyRelatedPublicationTitle.Social Dominance Orientation: A Personality Variable Predicting Social and Political Attitudes Show more Search linked publications Submit Reset filters SettingsSort By Title Ascending Date Issued Descending Accessioned Date Descending Results per page 1 5 10 20 40 60 80 100 Search Search Tools Search ResultsNow showing 1 - 10 of 1137 No Thumbnail Available Story“There's No One as Irish as… : DASH Story 2013-04-05Using Open Access has helped me tremendously with my research papers for school. I attend an online university and although they have an extensive online library. I have noticed many of the articles are not full text, which in a sense defeats the purpose of looking for the article online for instant access. So I really appreciate Open Access providing relevant credible work.Show more No Thumbnail Available Story"Way Down in the Hole": Systemic… : DASH Story 2013-04-01I am an independent scholar writing for publication to disseminate my research and enhance employment prospects. Recent and past increases in privatization of access to intellectual resources prevents my ready access to online databases and comprehensive library holdings. These market-driven moves by many administrations and publishers are hampering the ability of researchers and scholars such as myself to contribute to the collective intelligence of the global community. Open access initiatives will hopefully reverse the privatization trend so that all may benefit from our collectively produced knowledge. Thank you!Show more No Thumbnail Available Story"What is the History of Books?"… : DASH Story 2013-05-31Hello! I am a PhD student in Library & Information Science at Dominican University. I need to read this article for my advanced seminar on reading, and it's not available at DU. Thank you so much for making this article freely available!Show more No Thumbnail Available Story"What is the History of Books?"… : DASH Story 2013-09-24Going to university is a costly business, especially if you are supporting yourself and your major is Life sciences (because of all the extra laboratory fees etc.). I attend National Taiwan University at the moment but I grew up in the states, and although my chinese is fairly fluent, reading and writing on a university level remains a challenge. English is a much more comfortable language for me to learn in. Therefore, when my core curriculum classes assigns me translated versions of essays and articles, I set out to find the original english source. Low on money, I can't afford to buy the original english version in Taiwan, but I can usually find the book in the university library, usually but not always though. Open Access helps me read sources that I can't get to without buying the original, and helps me with getting through my university degree by providing me with the original manuscript of articles. Thanks!Show more No Thumbnail Available Story"What is the History of Books?"… : DASH Story 2013-10-05I am a minister in a major Christian denomination in the United States. I am leading a team of people who are building a new, modern hymn book for our church body. My area of expertise and leadership is how technology will play a role in the new book. I was able to access an article from Harvard through the Open Access program. I doubt I would have had access to this scholarship without such open access. Thank you so much for making this scholarship available.Show more No Thumbnail Available Story"What is the History of Books?"… : DASH Story 2014-06-10My masters dissertation in the University of Reading is based on Darton's communication circuit. I have been using the 1982 version, but ""What is the History of Books?" Revisited" is also key. The university did not have access to it and the price (US$ 30, I guess) was really expensive for a student. Thank you so much for making it freely available! People tend to think that those enrolled in a post graduate university can afford academic articles, but I have seen that this is not the case.Show more No Thumbnail Available Story"What is the History of Books?"… : DASH Story 2015-09-07Looking for articles to use in a class and wanted to find more about Darnton's communication circuit. This will be very useful for my students, and since it is open access, they can have an electronic copy without concern for breaking copyright laws.Show more No Thumbnail Available Story"What is the History of Books?"… : DASH Story 2015-12-19I am a journalist, researcher and alternative publisher from Goa, India, and a long-time supporter of Creative Commons, GNU-GPL and other sharable licenses. Despite being in alternative (book) publishing myself, ours is a tiny operation, and we find access to international reading material very restrictive and hard to come by. It was a pleasant surprise to find this work shared online. I'm sure it would shape my perspectives as I go further along in my research on the history of the book in 20th century Goa (a Portuguese colony for part of the period).Show more No Thumbnail Available Story1 Corinthians… : DASH Story 2015-08-16I am a pastor leading a Bible study of 1 Corinthians. I want to provide my congregation with the latest scholarship on the subject, but I live in rural Nevada and have limited resources and cannot afford a full membership to a university library online. I am grateful to Harvard for making such recent scholarship available free of charge!Show more No Thumbnail Available Story30,000 Years Old Wild Flax Fibers… : DASH Story 2013-11-13Information matters. Life began when some information got a way to replicate itself. Since then, life has evolved by quantitative (and somehow qualitative) increases in the replication, storing and transmission of information. Eventually, original replicators got a way to produce complex organisms with organs to store, process and transmit information by their own: brains. Open Access is only one of the last links in this vital and universal chain. Given that information matters a lot, open access to information matters a whole world.Show more« 1 (current) 2 3 4 5 6 7 8 9 10 ... 114 »'''
