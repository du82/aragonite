["https://dashdash.io/1/base64"]
title = "base64(1): base64 encode/decode data | Linux Man Page"
description = "base64 encode/decode data and print to standard output"
full_description = "base64 — base64 encode/decode data and print to standard output Examples (TL;DR) Encode a file: base64 filename Decode a file: base64 -d filename Encode from stdin: somecommand | base64 Decode from stdin: somecommand | base64 -d tldr.sh Synopsis base64 [OPTION]... [FILE] Description Base64 encode or decode FILE, or standard input, to standard output. With no FILE, or when FILE is -, read standard input. Mandatory arguments to long options are mandatory for short options too. -d, --decode decode data -i, --ignore-garbage when decoding, ignore non-alphabet characters -w, --wrap=COLS wrap encoded lines after COLS character (default 76). Use 0 to disable line wrapping --help display this help and exit --version output version information and exit The data are encoded as described for the base64 alphabet in RFC 4648. When decoding, the input may contain newlines in addition to the bytes of the formal base64 alphabet. Use --ignore-garbage to attempt to recover from any other non-alphabet bytes in the encoded stream. Author Written by Simon Josefsson. Reporting Bugs GNU coreutils online help: <https://www.gnu.org/software/coreutils/>Report any translation bugs to <https://translationproject.org/team/> Copyright Copyright © 2019 Free Software Foundation, Inc. License GPLv3+: GNU GPL version 3 or later <https://gnu.org/licenses/gpl.html>.This is free software: you are free to change and redistribute it. There is NO WARRANTY, to the extent permitted by law. See Also Full documentation <https://www.gnu.org/software/coreutils/base64>or available locally via: info '(coreutils) base64 invocation' Referenced By ascii85(1), randombytes(1), virt-inspector(1). October 2019 GNU coreutils 8.31"
