["https://dashdash.io/8"]
title = "Man Pages 8: Admin -- Dash Dash"
description = "Section 8 of the manual describes commands which either can be or are used only by the superuser, like system-administration commands, daemons, and hardware-related commands. As wi"
full_description = "Top 6 commands Command Description Lookups 1 cron daemon to execute scheduled commands 136,000 2 traceroute print the route packets trace to network host 105,000 3 netstat Print network connections, routing tables, interface statistics, masquerade connections, and multicast memberships 69,000 4 iptables administration tool for IPv4 packet filtering and NAT 46,000 5 apt-get APT package handling utility - command-line interface 25,000 6 ping send ICMP ECHO_REQUEST to network hosts 16,500 All commands763 Command Description 30-systemd-environment-d-generator Load variables specified by environment.d accessdb dumps the content of a man-db database in a human readable format accton turns process accounting on or off addpart tell the kernel about the existence of a partition agetty alternative Linux getty anacron runs commands periodically arpd userspace arp daemon. arping send ARP REQUEST to a neighbour host arptables-nft ARP table administration (nft-based) arptables-nft-restore Restore ARP Tables (nft-based) arptables-nft-save dump arptables rules to stdout (nft-based) astraceroute autonomous system trace route utility audispd-zos-remote z/OS Remote-services Audit dispatcher plugin auditctl a utility to assist controlling the kernel's audit system auditd The Linux Audit daemon augenrules a script that merges component audit rule files aureport a tool that produces summary reports of audit daemon logs ausearch a tool to query audit daemon logs automount manage autofs mount points autrace a program similar to strace avcstat Display SELinux AVC statistics badblocks search a device for bad blocks blkdeactivate utility to deactivate block devices blkdiscard discard sectors on a device blkid locate/print block device attributes blkiomon monitor block device I/O based o blktrace data blkmapd pNFS block layout mapping daemon blktrace generate traces of the i/o traffic on block devices blkzone run zone command on a device blockdev call block device ioctls from the command line booleans Policy booleans enable runtime customization of SELinux policy bpfc a Berkeley Packet Filter assembler and compiler brctl ethernet bridge administration bridge show / manipulate bridge addresses and devices btrace perform live tracing for block devices btrecord recreate IO loads recorded by blktrace btreplay recreate IO loads recorded by blktrace btrfs a toolbox to manage btrfs filesystems btrfs-balance balance block groups on a btrfs filesystem btrfs-check check or repair a btrfs filesystem btrfsck check or repair a btrfs filesystem btrfs-convert convert from ext2/3/4 or reiserfs filesystem to btrfs in-place btrfs-device manage devices of btrfs filesystems btrfs-filesystem command group that primarily does work on the whole filesystems btrfs-find-root filter to find btrfs root btrfs-image create/restore an image of the filesystem btrfs-inspect-internal query various internal information btrfs-map-logical map btrfs logical extent to physical extent btrfs-property get/set/list properties for given filesystem object btrfs-qgroup control the quota group of a btrfs filesystem btrfs-quota control the global quota status of a btrfs filesystem btrfs-receive receive subvolumes from send stream btrfs-replace replace devices managed by btrfs with other device. btrfs-rescue Recover a damaged btrfs filesystem btrfs-restore try to restore files from a damaged btrfs filesystem image btrfs-scrub scrub btrfs filesystem, verify block checksums btrfs-select-super overwrite primary superblock with a backup copy btrfs-send generate a stream of changes between two subvolume snapshots btrfs-subvolume manage btrfs subvolumes btrfstune tune various filesystem parameters captest a program to demonstrate capabilities catman create or update the pre-formatted manual pages cfdisk display or manipulate a disk partition table chcat change file SELinux security category chcpu configure CPUs checkmodule SELinux policy module compiler checkpolicy SELinux policy compiler