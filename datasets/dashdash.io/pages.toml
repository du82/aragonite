title = "Linux Man Pages -- Dash Dash"
description = "Dash Dash sets the linux documentation in a beautiful collection of typefaces to make the technical content more approachable."
full_description = "Manual Pages Manual Page 1 General Commands Manual Page 2 System Calls Manual Page 3 Library Functions Manual Page 4 Special Files Manual Page 5 File Formats Manual Page 6 Games Manual Page 7 Conventions and Miscellany Manual Page 8 Admin Top 10 commands Command Description Lookups 1 cron daemon to execute scheduled commands 136,000 2 traceroute print the route packets trace to network host 105,000 3 tar an archiving utility 84,000 4 crontab tables for driving cron (ISC Cron V4.1) 75,000 5 netstat Print network connections, routing tables, interface statistics, masquerade connections, and multicast memberships 69,000 6 cp copy files and directories 68,000 7 ls list directory contents 64,000 8 iptables administration tool for IPv4 packet filtering and NAT 46,000 9 curl transfer a URL 34,000 10 chmod change file mode bits 32,000 Linux commands With the rise of software, Dash Dash exists to bridge the divide between the technical and the non-technical by making the Linux documentation more approachable. Instead of having to take the red pill and become Neo from the Matrix, Dash Dash breathes new life into technical documentation by adding a bit of poignant design and precise typography. What once felt like a maze of weird symbols and hyper intense colors, now are visually subdued and easier to understand. As we witness the continued proliferation of technology which enables everyone to build tools to alleviate mundane tasks, the inevitable next step is to learn the command line. Dash Dash adds a memorable micro-brand to every command while also highlighting the most common commands in each section. About The making of Dash Dash"
year_published = 2025
clearnet = "https://dashdash.io"
