["https://dashdash.io/1/bno_plot"]
title = "bno_plot(1): generate interactive 3D | Linux Man Page"
description = "generate interactive 3D plot of IO blocks and sizes"
full_description = "bno_plot — generate interactive 3D plot of IO blocks and sizes Synopsis bno_plot [ -h | --help ] [ -v | --verbose ] [ -K | --keys-below ] [ <file...> ] Description bno_plot is a visualization tool for the block layer IO tracing tool called blktrace(8). As noted in its documentation, blktrace is a block layer IO tracing mechanism which provides detailed information about request queue operations up to user space. bno_plot utilizes gnuplot to generate a 3D plot of the block number output from btt. If no <files> are specified, it will utilize all files generated after btt was run with -B blknos (meaning: all files of the form blknos*[rw].dat). The -K option forces bno_plot to put the keys below the graph. If it is not specified, all keys for input files are put in the upper right corner of the graph. If the number of devices exceed 10, then bno_plot will automatically push the keys under the graph. To use this utility, the gnuplot package needs to be installed. To exit the plotter, enter 'quit' or ^D at the 'gnuplot> ' prompt. Authors bno_plot was written by Alan D. Brunelle. This man page was created from the blktrace documentation by Bas Zoetekouw. Reporting Bugs Report bugs to <linux-btrace@vger.kernel.org> Copyright Copyright © 2008 Hewlett-Packard Development Company, L.P.This is free software. You may redistribute copies of it under the terms of the GNU General Public License <http://www.gnu.org/licenses/gpl.html>. There is NO WARRANTY, to the extent permitted by law.This manual page was created for Debian by Bas Zoetekouw. It was derived from the documentation provided by the authors and it may be used, distributed and modified under the terms of the GNU General Public License, version 2.On Debian systems, the text of the GNU General Public License can be found in /usr/share/common-licenses/GPL-2. See Also btt (1), gnuplot (1), blktrace (8), blkparse (1), verify_blkparse (1), blkrawverify (1) Referenced By btt(1). February 22, 2007 blktrace git-20080213182518"
