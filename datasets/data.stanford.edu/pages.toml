title = "Database on Ideology, Money in Politics, and Elections (DIME): Public version 4.0 | Stanford Libraries Social Science Data Collection"
description = "Abstract: The Database on Ideology, Money in Politics, and Elections (DIME) provides a general resource for the study of campaign finance and ideology in American politics. The database was developed as part an on-going effort to construct a comprehensive ideological mapping of political elites, interest groups, and donors. Constructing the database required a large-scale effort to compile, clean, and process data on contribution records, candidate characteristics, and election outcomes from various sources. The current database contains over 850 million itemized political contributions made by individuals and organizations to local, state, and federal elections covering from 1979 to 2024. A corresponding database of candidates and committees provides additional information on state and federal elections.The included measures of ideology have been extensively validated across several studies spanning a variety of institutional settings and types of actors. A compendium of these validation results can be accessed here. The DIME+ data repository on congressional activity extends DIME to cover detailed data on legislative voting, lawmaking, and political rhetoric. (See https://data.stanford.edu/dime-plus for details.)Principal Investigator: Adam BonicaHow to Cite this Dataset: Bonica, Adam. 2024. Database on Ideology, Money in Politics, and Elections: Public version 4.0 [Computer file]. Stanford, CA: Stanford University Libraries. https://data.stanford.edu/dime.Contact Email: bonica@stanford.eduIntroduction: The database is intended to make data on campaign finance and elections (1) more centralized and accessible, (2) easier to work with, and (3) more versatile in terms of the types of questions that can be addressed. A list of the main value-added features of the database is below:     Data processing: Names, addresses, and occupation and employer titles have been cleaned and standardized.     Unique identifiers: Entity resolution techniques were used to assign unique identifiers for all individual and institutional donors included in the database. The contributor IDs make it possible to track giving by individuals across election cycles and levels of government.     Geocoding: Each record has been geocoded and placed into congressional districts. The geocoding scheme relies on the contributor IDs to assign a complete set of consistent geo-coordinates to donors that report their full address in some records but not in others.      Ideological measures: The common-space DIME scores (CFscores) allow for direct distance comparisons of the ideal points of a wide range of political actors from state and federal politics spanning over 40 years. In total, the database includes ideal point estimates for 156,514 candidates and 37,083 political committees as recipients and 36.2 million individuals and 2.9 million organizations as donors. These measures of ideology have been extensively validated across several studies spanning a variety of institutional settings and types of actors.     Corresponding data on candidates, committees, and elections: The recipient database includes information on fundraising statistics, election outcomes, gender, and other candidate characteristics. All candidates are assigned unique identifiers that track candidates when they run for different offices/districts. The recipient IDs can also be used to match against the database of contribution records. The database also includes entries for PACs, super PACs, party committees, leadership PACs, 527s, state ballot campaigns, and other committees that engage in fundraising activities.Validation: The ideological measures have been extensively validated across several studies spanning a variety of institutional settings and types of actors. A compendium of these validation results can be accessed here. Methodology/SamplingUniverse: The contribution database contains records for political donations made by individuals and organizations to local, state, and federal elections. The candidate database includes entries for candidates, PACs, super PACs, leadership PACs, 527s, party committees, campaigns for state ballot measures, and other recipient committees that engage in fundraising activities.Unit of Analysis: Individual donors, Political action committees (PACs), Candidates, Party committees, Ballot campaigns, other political committeesType of data collection: Campaign finance records, Candidate and district characteristics, Election outcomesTime span: 1979-2024Time of data collection: 2010-2024Geographic coverage: United StatesSmallest geographic unit: Geocoded addresses DocumentationCodebook (DIME) - Version 4.0 (pdf)  Data Download LinksCandidate/Recipient Files  dime_recipients_1979_2024.csv.gz - Candidate/Recipient CFscores    dime_recipients_1979_2024.rdata - Candidate/Recipient CFscores     Donor Files    dime_contributors_1979_2024.csv.gz - Individual Donor/PAC CFscores   dime_contributors_1979_2024.rdata - Individual Donor/PAC CFscores     Itemized Contribution Files    contribDB_1980.csv.gz     contribDB_1982.csv.gz     contribDB_1984.csv.gz     contribDB_1986.csv.gz     contribDB_1988.csv.gz     contribDB_1990.csv.gz     contribDB_1992.csv.gz     contribDB_1994.csv.gz     contribDB_1996.csv.gz     contribDB_1998.csv.gz     contribDB_2000.csv.gz     contribDB_2002.csv.gz     contribDB_2004.csv.gz     contribDB_2006.csv.gz     contribDB_2008.csv.gz     contribDB_2010.csv.gz     contribDB_2012.csv.gz     contribDB_2014.csv.gz     contribDB_2016.csv.gz     contribDB_2018.csv.gz     contribDB_2020.csv.gz     contribDB_2022.csv.gz     contribDB_2024.csv.gz     (Note: The itemized contribution records exclude all records retrieved from the Center for Responsive Politics/NIMSP database. Please contact me directly at bonica@stanford.edu if you would like to request access to these data for strictly academic use.)Contribution Files Grouped By Office Type (Note: These records are the same as those in the above filese, but grouped by office type instead of cycle)   contribDB_governor.csv.gz     contribDB_judicial.csv.gz contribDB_president.csv.gzSparse Matrix of Contributions dime_mimp_1979_2024.rdata - Sparse matrix of contribution amounts     SQLite File of Complete Database   SQLite3 (Download the entire database in SQL format)   (For a primer on how to interface with the SQLite database in R, see the following example R script.Curated Datasets of Political ElitesContribution records have been matched onto other publicly available databases of important political actors. Note that some of these curated datasets have been compiled using previous versions of DIME.Federal court judges (Updated Dataset Through 2024) (Paper,  Original Replication Data)Fortune 500 directors and CEOs (Data) (Paper) State supreme court justices (Data) (Paper)Executives appointees to federal agencies (Data) (Paper)Medical professionals (Data) (Paper)Legal Professionals (Data) (Paper)    Data Use AgreementYou are free:To Share: To copy, distribute and use the data.To Create: To produce works from the data.To Adapt: To modify, transform and build upon the data.​​As long as you:Attribute: You must attribute any public use of the data, or works produced from the data, in the manner specified in the license. For any use or redistribution of the data, or works produced from it, you must make clear to others the license of the data and keep intact any notices on the original data.Read the full ODC-BY 1.0 license text for the exact terms that apply."
