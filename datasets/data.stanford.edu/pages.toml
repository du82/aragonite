rd, Congressional roll call voting, Congressional legislation Time span: 2003-2014 Time of data collection: 2015 Documentation Web site or document download link(s): DIME PLUS codebook (dime_plus_codebook.pdf) Data Use Agreement The data I download from the Data Archive will not be used to identify individuals. I will not charge a fee for the data if I distribute it to others. I will inform the contact person for each dataset about work I do using their dataset. (This helps us keep an accurate bibliography. See each data page for its contact email. ) I will cite the data appropriately. (See each data page for its bibliographic citation.) Data Download Links Congressional Votes (vote_db.csv.zip 26.4 MB) Congressional Text (text_db.csv.zip 994 MB) Congressional Bills and Amendments (bills_db.csv.zip 496 KB) Alternative Mirror (Download files from Google Drive Repository) Back to Top'''
