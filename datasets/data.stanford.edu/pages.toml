lity"). Because of demand from users of HCMST, we have redacted the Q24 and Q35 text answers, and obtained IRB approval to share the redacted answers on a restricted basis. As of February, 2013, ICPSR is making the edited versions of full-text q24 and q35 available to researchers who get their own IRB approval to host the data. Contact ICPSR for access. We are planning (at a future date) to redact the text variables from waves 4 and 5 append them to the restricted data hosted by ICPSR. Geographic codes for ZIP code, as well as a variety of state-based variables, which have been suppressed from the public dataset in order to preserve respondent confidentiality, are available from ICPSR for users who obtain IRB approval. Frequently Asked Questions: Q) There are a variety of different kinds of questions in the dataset about sexual identity, whether the respondent is part of a same-sex couple, and what gender of person the respondent is sexually attracted to. The answers to these questions sometimes seem to provide contradictory information. Why? A) There is some inherent ambiguity in the realm of sexual identity and in identifying same-sex couples. There is also the possibility that a small number of respondents don't understand the questions. PI Rosenfeld created several new variables for the dataset, same_sex_couple, potential_partner_gender_recodes, alt_partner_gender. These new variables represent the researcher's best guess as to the gender of the partner, and as to whether the couple is a same-sex couple. In creating these variables PI Rosenfeld relied mostly on the variables in the public data, and a little bit on the text answers that are not part of the public data. Q) What is the variable that identifies the partnered respondents? A) qflag Q) Why do the variables for children in the household (such as ppt01, ppt25, etc) not yield exactly the same information about household members as the household roster variables (such as pphhcomp11_member2_relationship)? A) There are several reasons for the discrepancies. First, the ppt01 and ppt25 variables were derived from answers provided by the head of household, while the household roster variables were derived from the survey respondent. Not all survey respondents are the head of household as far as Knowledge Networks is concerned (see variable pphhhead). Second, household survey that was the source of the ppt01 and ppt** variables may not have taken place at the same time as the Core Adult Profile which was the source of the household roster variables such as pphhcomp11_member2_relationship. Lastly, the ppt01 and ppt** variables are incremented over time, as the children in the household are presumed to age over time. So the ppt** variables are accurate for the time of wave 1 of the HCMST survey, whereas the household roster variables are accurate reports from the time of the Core Adult Profile, which took place earlier. Changes, additions, and improvements to the dataset Changes for version 2.0 Version 2.0 of the dataset includes new variables from wave II of the survey, the one year follow-up, along with the previously available variables from wave I, the main survey. See the new User's Guide under documentation for more information about variable layout. Version 2.0 also includes a second round of background demographic data for most respondents in the dataset, see User's Guide for variable layout. The Stanford research team has added a new variable, how_met_online, which categorizes the prior social connections (if any) between respondent and partner for respondents who met their partners online, based largely on an exhaustive re-analysis of the respondents open text answers to q24 (the open text answers are not yet available in the public dataset for respondent confidentiality reasons). See also the new variable either_internet_adjusted . Version 2.0 includes a new couple weight, weight_couples_coresident, see the updated documentation on weights for more details. For version 2.0 the Stanford research team has added two new date variables in YYYYMMDD format, HCM_main_interview_fin_date and w2_HCM_interview_fin_date. These variables are easier to read but less useful for analysis than the other date-time format variables already in the dataset. The variable partner_deceased has been updated to reflect the discovery of a few more cases of respondents whose partner was already deceased at the time of the main survey. Changes from version 2.0 to version 3.02 Version 3 includes wave 3 of the survey (the second follow-up survey) variables generally starting with w3_*, along with the third round of core adult profile data, variables generally starting with pp3_* New variables describing the particular family members who played the intermediary role in respondent meeting partner, variables coded q24_fam* The documentation for earlier versions offered a not-quite correct explanation for the variable ppnet. ppnet actually codes whether subject had their own internet access at home a'''
