["https://datacenterdynamics.com/en/news/edf-calls-for-expressions-of-interest-from-data-center-developers-for-three-sites"]
title = "EDF calls for expressions of interest from data center developers for three sites - DCD"
description = """
By                                        Dan Swinhoe"""
full_description = '''EDF calls for expressions of interest from data center developers for three sites Company looking to offer land at three power station sites March 05, 2025 By Dan Swinhoe Comment French energy firm EDF has detailed the sites it it hoping to offer up for data center development.The French energy utility last month announced it was requesting expressions of interest for digital companies wishing to build data centers on EDF-owned land in France. – EDF EDF is offering “ready-to-use” land spaces connected to the electrical grid. The company said this will reduce the time needed to complete projects “by several years.”At the time, it said it had pre-identified four industrial sites on its own land, with a total available power estimated at 2GW. This week the company officially launched the first calls for expressions of interest (CEI) for digital companies and detailed the sites on offer.The first CEI is for a site located at Montereau-Vallée-de-la-Seine in Seine-et-Marne, in the municipalities of Vernou-La-Celle-sur-Seine and La Grande Paroisse. EDF operates the Montereau Power Plant in the area, totaling 370MW via two gas-powered turbines.The second CEI concerns two sites: La Maxe and Richemont in Moselle.The 500MW La Maxe power station was retired in 2015 after around 44 years of operation. The chimney was demolished last year. Commissioned in 1954, the gas-powered Richemont power station was closed in 2010 and has since been demolished.A fourth site has been identified, with details to come later.“The objective of the calls for expressions of interest is to select digital operators capable of building and operating high-power data centers on the sites. Land spaces will be allocated based on objective and transparent criteria, focusing on the credibility and maturity of the companies' projects,” the company said.To be selected, these companies must demonstrate a ”solid technical, legal, and financial structure,” alongside a project “compatible with the characteristics of the different sites and existing constraints, particularly in terms of environmental footprint.”EDF noted efforts to identify other suitable land spaces are ongoing, with the aim of selecting two additional sites by 2026, for a total of six sites.EDF is the world's largest nuclear power producer – with its nuclear output topping 360TWh in 2024.In October, EDF launched Project Giga to meet the growing energy demand from artificial intelligence data centers. The project plans to leverage EDF’s land and grid connections to supply low-carbon power to major hyperscalers. Get a weekly roundup of EMEA news, direct to your inbox. Thank you for subscribing to our EMEA newsletter series. More in Construction & Site Selection Data Center Trends 2025: Power, AI, and Progress 05 Dec 2024 Microsoft buys another 43 acres in Pataskala, Ohio, for $11.4m Episode Logistics as the catalyst for rapid data center deployment More in Europe DCD>Connect | London - Sample Delegate List 05 Feb 2025 BT Ireland sells wholesale and enterprise units to Cordiant Episode Transparency and community engagement in the high-density era Tags EDF France La Grande Paroisse La Maxe Montereau-Vallée-de-la-Seine Moselle Nuclear Richemont Seine-et-Marne Vernou-La-Celle-sur-Seine googletag.cmd.push(function() { googletag.defineSlot('/21796610478/Datacenterdynamics_UK_DCDUK_REGION_GLOBAL_HOME_LB_BOTTOM', [728, 90], 'ad-unit-leaderboard-footer-5726249960') .addService(googletag.pubads()) .setTargeting("term", "the-data-center-construction-channel,europe,construction-site-selection,the-critical-power-channel,grid-level") .setTargeting("path", "/en/news/edf-calls-for-expressions-of-interest-from-data-center-developers-for-three-sites/"); googletag.enableServices(); googletag.display('ad-unit-leaderboard-footer-5726249960'); }); var documentLanguage = document.documentElement.getAttribute('lang'); var disqus_config = function () { this.page.url = "https://www.datacenterdynamics.com/en/news