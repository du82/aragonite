full_description = '''Introducing the Certificate in Global Digital Infrastructure A collaborative university curriculum on global Internet infrastructure February 06, 2025 By DatacenterDynamics Comment Datacenter Dynamics is proud to announce the first-ever Certificate in Global Digital Infrastructure.This is a collaboration between DCD>Academy, the University of California, Berkeley, the SubOptic Foundation, and iMasons to establish a cutting-edge university curriculum that covers the technical, economic, legal, environmental, and social dimensions of the global Internet’s infrastructure. – University of California, Berkeley Students work on group projects to tackle the biggest challenges the industry has to offer, including sustainability and resilience. Guest speakers include leaders and experts across many fields, including Erick Contag, Dean Nelson, Doyle Barlow, Vlad-Gabriel Anghel, John Booth, Katja Bego, Lane Burdette, Ramakrishnan Durairajan, Eileen Gallagher, April Herlevi, Sebastian Moss, Maxie Reynolds, Brandon Gries, Fiona Marron, and Hesham Youssef, among many others.Top student essays will be published in industry magazines, and top projects will be shown to an industry panel. The curriculum is also supported by key partnerships with Datacenter Dynamics, Telegeography, and the National Data Centre Academy."We're proud to play a role in bringing The Certificate in Global Digital Infrastructure to life," Vlad-Gabriel Anghel, director of solutions engineering, DCD>Academy said."Nicole Starosielski & the team at Berkeley are doing a fantastic job and we can't wait for the students to start the program. We hope that this program will enable students to be the next innovators & leaders in our sector."We invite you to join our inaugural cohort of summer 2025. Learn more here and at our virtual Open House on February 20th at 10am. Register here.As Neal Stephenson says, "wired people should know something about wires." Tags University of California,Berkeley i