["https://datacenterdynamics.com/en/news/edged-announces-13mw-data-center-outside-des-moines-iowa"]
title = "Edged announces 13MW data center outside Des Moines, Iowa - DCD"
description = """
By                                        Dan Swinhoe"""
full_description = '''Edged announces 13MW data center outside Des Moines, Iowa Work on new facility to start in Q2 for 2027 completion date March 05, 2025 By Dan Swinhoe Comment Data center firm Edged is developing a new facility outside Des Moines, Iowa.The company this week announced a new data center in Ankeny in Polk County, to the north of Des Moines. – Google Maps Located on 17.5 acres at 2701 Southeast 90th Street, the site will house an approximately 105,000-square-foot (9,755 sqm) facility known as Edged Des Moines. It will offer 13.2MW of capacity.Edged will break ground on the project in Q2 of 2025, and construction is slated to last 24 months. The company said it aims to invest $187 million in the project.Reports that Edged was looking to develop a campus in the area surfaced last year, with plans for a two-building campus. Ankeny City Council members unanimously approved a development agreement with Edged earlier this week for the project.The company said the modular system supports densities of up to 70kW per rack with air cooling and 200kW per rack with plug-and-play liquid cooling integration.“Everything we do at Edged is designed to maximize sustainability, and our data centers’ optimization of energy efficiency and water conservation are a big part of that vision,” said Bryant Farland, Edged CEO. “We are honored to be partnering with the City of Ankeny, which shares our vision of a more sustainable future. Together, we are leveraging advanced technology for positive impact.”The company noted it will be investing in water and sewer extensions to serve the site. These utility extensions will also serve an additional 120 acres in the immediate area, which Edged said will open up more land for new development.“The City of Ankeny couldn’t be more thrilled to have Edged building a new state-of-the-art facility in Ankeny,” said Derek Lord, economic development director for the City of Ankeny. “The greater Des Moines area has become a destination for tech innovation, and with this new Edged facility, our region continues to attract significant investment in this space and is viewed as an ideal location for critical tech development and sustainable infrastructure.”Edged Energy is part of Endeavour, which was set up by Aligned founder Jakob Carnemark.It currently has data centers either operating or in development in Madrid and Barcelona in Spain; Lisbon, Portugal; and across the US, including Missouri, Arizona, Texas, Georgia, Iowa, Ohio, and Illinois. Get a weekly roundup of North America news, direct to your inbox. Thank you for your North American news subscription More in Construction & Site Selection Commercial PV Panel Roofs 13 Nov 2024 Empyrion enters Bangkok, its third Asian market this year Episode Tech showcase: Accelerating timelines and increasing ROI with permit services More in North America DCD>Leadership Summit 2025 - Sponsorship Brochure 27 Jan 2025 NextEra partners with GE Vernova on gas for data centers, will restart Iowa nuclear plant 10 Jan 2025 Event News Registration now open for Yotta 2025 Tags 2701 Southeast 90th Street Ankeny Des Moines Edged Data Centers Edged Energy Iowa Polk County googletag.cmd.push(function() { googletag.defineSlot('/21796610478/Datacenterdynamics_UK_DCDUK_REGION_GLOBAL_HOME_LB_BOTTOM', [728, 90], 'ad-unit-leaderboard-footer-7130236942') .addService(googletag.pubads()) .setTargeting("term", "the-data-center-construction-channel,construction-site-selection,north-america,colocation-wholesale") .setTargeting("path", "/en/news/edged-announces-13mw-data-center-outside-des-moines-iowa/"); googletag.enableServices(); googletag.display('ad-unit-leaderboard-footer-7130236942'); }); var documentLanguage = document.documentElement.getAttribute('lang'); var disqus_config = function () { this.page.url = "https://www.datacenterdynamics.com/en/news/edged-announces-13mw-data-center-outside-des-moines-iowa/"; this.page.identifier = "95781"; this.language = (documentLanguage === "es" ? "