["https://datacenterdynamics.com/en/news/areim-raises-450m-for-swedens-ecodatacenter"]
title = "Areim raises €450m for Sweden’s EcoDataCenter - DCD"
description = """
By                                        Dan Swinhoe"""
full_description = '''Areim raises €450m for Sweden’s EcoDataCenter EcoDataCenter developing 150MW campus in Östersund March 05, 2025 By Dan Swinhoe Comment Nordic investment firm Areim has raised €450 million ($480m) for its data center fund, which will be channeled into Swedish operator EcoDataCenter.Areim this week announced it has completed an additional capital raise for its Nordic data center fund, Areim DC Fund, bringing the total raised capital to €900 million ($961m). New capital to be used to expand EcoDataCenter – EcoDataCenter The raised capital will be used to continue expanding EcoDataCenter.The investment firm said the capital raise was “significantly oversubscribed,” adding both Nordic and international institutional capital. Over the past two years, Areim has raised more than €1.2 billion ($1.28bn) of capital to the platform, including equity, debt, and bond capital.“The continuous strong support we have received from both existing and new investors is a testament to the strategy of our dedicated data center fund,” said Henrik Brinck Landelius, CEO of Areim. “The substantial interest in the Areim DC Fund and EcoDataCenter underlines the demand and attractiveness of the Nordic market for data centers.”EcoDataCenter was formed in 2015 as a joint venture between local energy company Falu Energi & Vatten and data center operator EcoDC AB and opened its first facility in Falun in 2019.Nordic real estate investor and developer Areim took a majority stake in the firm via the Areim Fund III for around SEK 200 million ($22m) in 2018 and merged it with Swedish operator Fortlax in 2019. EcoDataCenter has been fully owned by the Areim DC Fund since 2023.Peter Michelson, CEO of EcoDataCenter, added: “We are establishing one of the most exciting companies in the Nordics. Through our platform, we have established partnerships with some of the world's leading companies, which creates great investor confidence in what we do.”Andulf Advokat provided legal counsel to the Areim in the capital raise.The company currently operates five data centers across three sites in Falun, Piteå, and Stockholm. Earlier this year EcoDataCenter announced plans for a new 150MW campus, known as EcoDataCenter 2, in Östersund, Sweden. The campus will be constructed in phases, with the first 20MW completed in 2026.The company recently signed a hosting deal with GPU cloud firm CoreWeave. More in Investment / M&A Data Center Trends 2025: Power, AI, and Progress 23 Sep 2024 Ephos raises $8.5m to build photonic chips made of glass Episode Revisiting the investor perspective of the AI hype cycle More in Nordics Issue 55 - Poles Apart 30 Jan 2025 Nokia CEO bullish on 2025 prospects after strong network infrastructure sales 26 Nov 2024 AWS inks partnership with SSAB for green steel at Swedish data center Tags Areim Areim DC Fund EcoDataCenter Henrik Brinck Landelius Peter Michelson Sweden Östersund googletag.cmd.push(function() { googletag.defineSlot('/21796610478/Datacenterdynamics_UK_DCDUK_REGION_GLOBAL_HOME_LB_BOTTOM', [728, 90], 'ad-unit-leaderboard-footer-5053666280') .addService(googletag.pubads()) .setTargeting("term", "the-investment-and-markets-channel,investment-ma,nordics,colocation-wholesale") .setTargeting("path", "/en/news/areim-raises-450m-for-swedens-ecodatacenter/"); googletag.enableServices(); googletag.display('ad-unit-leaderboard-footer-5053666280'); }); var documentLanguage = document.documentElement.getAttribute('lang'); var disqus_config = function () { this.page.url = "https://www.datacenterdynamics.com/en/news/areim-raises-450m-for-swedens-ecodatacenter/"; this.page.identifier = "95779"; this.language = (documentLanguage === "es" ? "es_ES" : documentLanguage); }; (function() { var d = document, s = d.createElement('script'), s2 = d.createElement('script'); if (document.language === "es") { s.src = 'https://datacenterdynamics-es.disqus.com/embed.js'; s2.src = 'https://datacenterdynamics-es.disqus.com/count.js'; s2.id = 'dsq-count-scr'