title = "Hetzner launches solar venture with MHB Montage for German data center porfolio - DCD"
description = "Aims to supply German data center portfolio with energy generated by solar projects"
full_description = '''Hetzner launches solar venture with MHB Montage for German data center porfolio Aims to supply German data center portfolio with energy generated by solar projects March 04, 2025 By Zachary Skidmore Comment German data center developer Hetzner and MHB Montage, a German solar developer, have formed a new clean energy firm that will focus on developing solar and large-scale battery technologies.The new company, HT Clean Energy GmbH, is currently developing a 6.5MW solar park across seven hectares in Nassau-Weikersheim, central Germany. – MHB Montage GmbH The company claims to be working on several other solar developments and aims to completely supply Hetzner’s data centers with energy generated by its solar projects in the long term.“Our goal is to ensure that our data centers can meet growing energy capacity requirements, but that we can also do that by supplying them completely with self-generated, renewable energy. By doing this, we are taking responsibility to provide our clients with environmentally friendly IT infrastructure,” said Martin Hetzner.Hetzner Online was established in 1997 as a privately owned web hosting company. It currently owns and operates two data center campuses in Germany, in Nuremberg and Falkenstein, and opened the Finnish campus in 2018.The company also has data center parks in Virginia, Oregon, and Singapore. In August last year, it launched cloud services in Singapore.MHB Montage is a German company that plans, installs, maintains, and repairs photovoltaic systems. Based in Merkendorf, Bavaria, it develops both ground-mounted and rooftop systems.Other data center operators in Germany have secured solar power to supply their operations.In March of last year, Maincubes signed a 10-year Power Purchase Agreement (PPA) with Stadtwerke Göttingen AG for 34MW of power. More in Europe Issue 55 - Poles Apart 31 Jan 2025 Equinix partners with designer for dress made from repurposed data center gear Episode How to build a sustainable data center - Inside Conapto’s Stockholm 4 project More in Sustainability Recycling and Circularity of Li-Ion Batteries 10 Dec 2024 NIMBY lessons for data centers from renewable developers Episode Balancing sustainable construction in a rapidly growing market Tags HT Clean Energy GmbH Hetzner Online MHB Montage Nassau-Weikersheim Solar googletag.cmd.push(function() { googletag.defineSlot('/21796610478/Datacenterdynamics_UK_DCDUK_REGION_GLOBAL_HOME_LB_BOTTOM', [728, 90], 'ad-unit-leaderboard-footer-2787590538') .addService(googletag.pubads()) .setTargeting("term", "the-energy-and-sustainability-channel,europe,sustainability,colocation-wholesale") .setTargeting("path", "/en/news/hetzner-launches-solar-venture-with-mhb-montage-for-german-data-center-porfolio/"); googletag.enableServices(); googletag.display('ad-unit-leaderboard-footer-2787590538'); }); var documentLanguage = document.documentElement.getAttribute('lang'); var disqus_config = function () { this.page.url = "https://www.datacenterdynamics.com/en/news/hetzner-launches-solar-venture-with-mhb-montage-for-german-data-center-porfolio/"; this.page.identifier = "95744"; this.language = (documentLanguage === "es" ? "es_ES" : documentLanguage); }; (function() { var d = document, s = d.createElement('script'), s2 = d.createElement('script'); if (document.language === "es") { s.src = 'https://datacenterdynamics-es.disqus.com/embed.js'; s2.src = 'https://datacenterdynamics-es.disqus.com/count.js'; s2.id = 'dsq-count-scr'; } else { s.src = 'https://datacenterdynamics.disqus.com/embed.js'; s2.src = 'https://datacenterdynamics.disqus.com/count.js'; s2.id = 'dsq-count-scr'; } s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); (d.head || d.body).appendChild(s2); })(); Please enable JavaScript to view the comments.</a>'''
