["https://datacenterdynamics.com/en/news/data4-signs-ten-year-ppa-with-edison-energia-for-500gwh-of-solar-power-in-italy"]
title = "Data4 signs ten-year PPA with Edison Energia for 500GWh of solar power in Italy - DCD"
description = """
By                                        Zachary Skidmore"""
full_description = '''Data4 signs ten-year PPA with Edison Energia for 500GWh of solar power in Italy The PPA will cover 10 percent of Data4's energy consumption in Italy March 05, 2025 By Zachary Skidmore Comment French data center operator Data4 has signed a ten-year Power Purchase Agreement (PPA) with Italian utility Edison Energia for 500GWh of energy from an Italian solar project.The solar project, located in Lazio, in the province of Viterbo, has a capacity of 148MW and was recently commissioned. According to Data4, the PPA will cover 10 percent of its energy consumption in the Italian market. – Getty Images "Italy is a key country for Data4, and we are pleased to support the production of renewable energy for the benefit of our customers in partnership with a leading player in the sector. Edison has been a key partner for Data4 for almost ten years, and this PPA is further proof of the success of our partnership," said Davide Suppia, country managing director at Data4 in Italy.According to its website, Data4 operates eight data centers in Italy, all in the Milan region. In April, the company announced a €500 million ($535m) investment in a new data center campus in Milan. The campus, known as Mil2, will be located in Vittuone, west of the city, and will feature four data centers on an 829,000 sq ft (77,000 sqm) site.The first data center on the site is expected to be operational in 2027 and has an IT capacity of 15MW. When fully built out, the campus could offer up to 100MW.Established in 2006, the company is owned by Brookfield, which acquired it from AxaIM in April 2023 for a reported $3.8 billion.It currently operates around 30 data centers in France, Italy, Spain, Poland, Greece, and Germany. Brookfield has pledged to invest €15bn ($15.5bn) in Data4 to build out its network of data centers in France.Edison Energia is an Italian electric utility headquartered in Milan. It was established in 2012 and acquired by EDF in 2012. It operates a diversified generation portfolio, including gas-fired, combined-cycle power plants, hydroelectric power, and renewable energy, and is aiming to build at least 5GW of installed renewable capacity by 2030. More in Europe DCD>Connect | London - Sample Delegate List 07 Sep 2024 EcoDataCenter plans 240MW campus in Borlänge, Sweden Episode Are data centers ready for Europe’s 2026 gas regulation? More in Sustainability The future of data centers under the EU Energy Efficiency Directive Building the future together: Strategic partnerships for advancing sustainable AI practices Episode Balancing sustainable construction in a rapidly growing market Tags Data4 Edison Energia Italy Lazio PPA Power Purchase Agreement Solar Viterbo googletag.cmd.push(function() { googletag.defineSlot('/21796610478/Datacenterdynamics_UK_DCDUK_REGION_GLOBAL_HOME_LB_BOTTOM', [728, 90], 'ad-unit-leaderboard-footer-2418859607') .addService(googletag.pubads()) .setTargeting("term", "the-energy-and-sustainability-channel,europe,sustainability,colocation-wholesale") .setTargeting("path", "/en/news/data4-signs-ten-year-ppa-with-edison-energia-for-500gwh-of-solar-power-in-italy/"); googletag.enableServices(); googletag.display('ad-unit-leaderboard-footer-2418859607'); }); var documentLanguage = document.documentElement.getAttribute('lang'); var disqus_config = function () { this.page.url = "https://www.datacenterdynamics.com/en/news/data4-signs-ten-year-ppa-with-edison-energia-for-500gwh-of-solar-power-in-italy/"; this.page.identifier = "95770"; this.language = (documentLanguage === "es" ? "es_ES" : documentLanguage); }; (function() { var d = document, s = d.createElement('script'), s2 = d.createElement('script'); if (document.language === "es") { s.src = 'https://datacenterdynamics-es.disqus.com/embed.js'; s2.src = 'https://datacenterdynamics-es.disqus.com/count.js'; s2.id = 'dsq-count-scr'; } else { s.src = 'https://datacenterdynamics.disqus.com/embed.js'; s2.src = 'https://datacenterdynamics.disqus.com/count.js'; s2.id =