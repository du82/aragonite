full_description = "Goodman plans AU$4bn equity raise to fund data center build-out Company planning 500MW of new facilities by mid-2026 Bharti Airtel lands SeaMeWe-6 cable in Chennai, India Company also landed the cable in Mumbai at the end of last year Secure your pass Connect | APAC 17–18 June 2025 Grand Hyatt Bali, Nusa Dua 104 Days to go Secure your pass Apply to speak Become a partner Connecting the data center ecosystem to design, build & operate sustainable data centers for the AI age Bringing together over 1,500 senior leaders working on the largest data center projects in Asia Pacific, DCD>Connect | Asia Pacific - Bali will drive industry collaboration, help you forge new partnerships and identify innovative solutions to your core challenges. Learn more about the Connect Experience 2 Co-located events, covering the entire digital infrastructure ecosystem 60+ Exhibitors showcasing the latest tech Hear from 120+ leading experts from across the data center industry Network with 1,500+ Senior Data Center Professionals “Attending the DCD>Connect | Asia Pacific conference was an enlightening experience. The event provided invaluable insights into the latest technologies shaping the data center industry. Additionally, it served as an excellent platform for networking, allowing me to reconnect with many friends and partners from the sector. The blend of cutting-edge knowledge and community engagement made it a standout conference.” — Managing Director - APAC, RED 2 Co-located events 60+ Exhibitors showcasing the latest tech 120+ Expert speakers 1,500+ Senior Data Center Professionals 2 Co-located events 60+ Exhibitors showcasing the latest tech 120+ Expert speakers 1,500+ Senior Data Center Professionals Speakers include Hazlan Hezri Senior Program Manager, Cloud Operations + Innovation, Microsoft Close Hazlan Hezri Senior Program Manager, Cloud Operations + Innovation, Microsoft View full profile and related articles Related sessions: DCD>Debate: Talent in short supply: Can the industry avert a workforce crisis and deliver on surging capacity demands? June 17, 2025, 2:45 p.m. — June 17, 2025, 3:30 p.m. Management & Operations Open Session More details Jon Curry Vice President Operations - APAC, Digital Realty Close Jon Curry Vice President Operations - APAC, Digital Realty Jon Curry is the Vice President of Operations, Asia Pacific at Digital Realty and has over 25 years experience in the IT industry covering an array of disciplines starting from the ground up as a computer operator in 1985 on a DOS/VSE mainframe. Jon rapidly progressed to a Network Systems Programmer and finally an MVS sysprog before heading off to the UK where he worked for Avis Europe, British Telecom and Nuclear Electric on a number of challenging projects including the privatization of the UK electricity industry. On his return to Australia Jon worked in various senior management roles with Arnotts Biscuits, Unisys, Coca Cola Amatil, Mercantile Mutual, Prudential & MLC Insurance. During this time Jon leveraged his technical experience to move into program management and the art of outsourcing management. Jon has spent time on both sides of the IT fence as a customer buying IT services and products and as a provider selling and supporting software, networks and services View full profile and related articles Stephanus Oscar CEO, Edge DC Close Stephanus Oscar CEO, Edge DC Oscar is currently leading the team in EDGE DC, a company of Digital Edge - data center service provider with low latency located in downtown Jakarta. Combining his knowledge in edge data center and cloud computing, he’s passionate to share how both can accelerate and grow digital business in Indonesia.Starting his career as Sales Manager at DCI Indonesia, he was responsible for managing Cloud Service Providers, Financial Services, and large enterprises from Fortune 500 companies. Prior to EDGE DC, Oscar was in Amazon Web Services, where he handled mature Indonesia startups to achieve their business goals. Oscar earned his Bachelor of Engineer degree in Chemical Engineering from the University of Michigan - Ann Arbor. View full profile and related articles Suppan Saravanamuthu Director Of Operations - Asia Pacific, Iron Mountain Data Centers Close Suppan Saravanamuthu Director Of Operations - Asia Pacific, Iron Mountain Data Centers Sara is an experienced Data Centre Operations Director with over 18 years of experience in Data Centre / Critical Environment / Facilities Management and Project Management industry.He joined Iron Mountain Data Centers in March 2019, and has been responsible for the overall operations of Iron Mountain Data Center in Singapore and India, ensuring zero downtime ever since.Sara has demonstrated strong leadership and support to staff and teams, proficient in Data Centre Management, facilities management, project management and budgeting skills, problem solving, cost saving, energy saving, and the standardization of business and operational procedures. He provides his client base with strategic solutions to ensure that facilities and contracts are maximized and operational delivery exceeds expectations.Prior to joining IMDC, Sara held positions in CBRE and Cofely FMO – ENGIE (Formerly Keppel FMO) as Critical Facility Manager for various data center accounts, as well as Business Development.Sara holds a Master’s in Business Administration from Alagappa University, India, and a Bachelor of Engineering in Electrical and Electronics from Annamalai University, India. He is also a Singapore Certified Energy Manager. View full profile and related articles Related sessions: DCD>Debate: Maximizing uptime - Are traditional maintenance & retrofit approaches at risk of falling short in the age of AI? June 17, 2025, 1:30 p.m. — June 17, 2025, 2:15 p.m. Management & Operations Open Session More details Chandra Irawan Country Manager/Director, Pure Data Centres Group Foong Kheng Nge Engineering Manager (APAC), Global Switch Close Foong Kheng Nge Engineering Manager (APAC), Global Switch View full profile and related articles Related sessions: DCD>Debate: Maximizing uptime - Are traditional maintenance & retrofit approaches at risk of falling short in the age of AI? June 17, 2025, 1:30 p.m. — June 17, 2025, 2:15 p.m. Management & Operations Open Session More details Shalini Lagrutta CEO and Managing Director, DXN Close Shalini Lagrutta CEO and Managing Director, DXN Shalini Lagrutta boasts a remarkable 20-year track record in the telecoms and data centre industry. Her journey includes pivotal roles in renowned companies such as Fujitsu Telecommunications, Huawei, LGC Wireless in Silicon Valley, and Flexenclosure. Notably, Shalini’s leadership at DXN since 2019 has propelled significant sales growth in Modular Data Centres. Shalini’s contribution at DXN since 2019 to 2022 was as bringing in significant customers and revenue growth to the business. Since being appointed as CEO on 2022, her focus has been to restructure the company including exiting unprofitable businesses and focusing on turning the company around to profitable growth. Recognised for her outstanding contributions, she earned accolades like Capacity Media’s 20 Women to Watch in 2020, Top 30 Edge Computing Leaders by Data Economy in 2020, and a spot-on Capacity Media’s 2021 Power 100 listing. Shalini’s recent achievement includes being honoured as one of the Infrastructure Masons (iM100) award recipients in December 2021 as well as 2024 TOP-10 APAC Women Leaders by Data Centre Magazine —a testament to her inspiring leadership in shaping the digital age. View full profile and related articles Related sessions: DCD>Debate: Thinking beyond greenfield - Can modular be the solution to booming AI capacity demands? June 17, 2025, 1:30 p.m. — June 17, 2025, 2:15 p.m. Data Center Construction Open Session More details Darren Webb Co-Founder & CEO, Evolution Data Centres Close Darren Webb Co-Founder & CEO, Evolution Data Centres As Co-Founder and CEO, Darren’s role is to ensure that Evolution Data Centres delivers on its strategic vision to become the leading pan-Asian data centre platform, delivering digital growth, reliably and sustainably, into high growth markets (often referred to as Tier 2 markets). Evolution are actively developing projects today, across the Philippines, Thailand and Vietnam.Darren’s career spans the full breadth of the digital infrastructure ecosystem, including Telco, Data Centre and Artificial Intelligence. Darren was the Asia Managing Director for IO Data Centres, where he had overall leadership for a modular-designed data center in Singapore. Darren led this business to net cash flow positive and ultimately to a successful exit.In his time in telco, Darren delivered significant investment programmes, with budgets of over £500m, while leading Vodafone’s strategic investments across Asia, Africa and the Middle East. Part of this role included Darren establishing the Vodafone Enterprise brand in the UAE. Prior to Vodafone, Darren was MD of Cable & Wireless for Asia, in addition to running their Global Enterprise sales channel, a business delivering annualised revenue of over £240m.Along with his Evolution Fo-founder and team, Darren is passionate about culture in the workplace. He aspires for Evolution to be an organization where everyone is a driver and there are no passengers. All the team are responsible for moving Evolution forward every day in the right direction, he encourages all the team to take ownership and accountability. He is often heard saying and reminding himself, to enjoy the journey, rather than being obsessed with the destination.Sustainability is a cornerstone of Darren’s approach, his goal is to drive change in the industry to deliver greener data centres (he doesn’t agree with, or like, the phrase “green data centres”). This ambition is brought to life in Evolution where every effort is made to minimize the environmental impact of every data center project that the company develops. View full profile and related articles Swati Goyal Chief Investment Officer, DCI Data Centers Close Swati Goyal Chief Investment Officer, DCI Data Centers Swati is Chief Investment Officer, DCI Data Centers. With over a decade of experience across banking, private equity and data centers, Swati has directly led growth and expansion for DCI in APAC and previously for STT Global Data Centers. Prior to this, Swati also worked with Blackstone Real Estate in Singapore and London and credits her varied experience for igniting her life long passion for building long term businesses while keeping an eye on the detail. Swati holds a Bachelor of Technology in Computer Science from Indian Institute of Technology, Mumbai and MBA from Indian Institute of Management, Bangalore. View full profile and related articles Ken Miyashita Managing Director, Telehouse Thailand View all speakers Apply to speak Secure your pass End-User/Specifier June 17-18 Free Includes access to Connect | APAC Investment Forum | APAC For end-users within the digital infrastructure industry More details Who qualifies? ✅ End-users within the data center industry from Enterprise and Hyperscale✅ End-users specializing in IT, Compute, Storage or Networking✅ Technical roles from Colocation Operators✅ Specifiers of data center technology & services (technical roles) from AECs (Architects, Consulting Engineers, Contractors), Systems Integrators and Energy Utilities✅ Procurement teams Who does not qualify? ❌ Sales & Marketing Professionals❌ Technology or Service Vendors❌ Resellers❌ Recruitment Firms Extra details End-User/Specifier passes include access to both co-located events on June 17-18. You will also be invited to private activities included hosted lunches, cocktail hours and tech exchange sessions (subject to availability) and have the ability to book meetings via the event app. Complimentary food & beverages are provided throughout the event. Hide details Get your pass General Admiss