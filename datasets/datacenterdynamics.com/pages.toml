full_description = "Stream now: DCD>International Women's Day Special .block-header .icon { color: #7da83b; } .block-header .button:not(.button--disabled) { background-color: #7da83b; } .block-header .icon-separator { color: #7da83b; } DCD>Compute, Storage & Networking DCDBroadcast 2025 New episodes released every month Home Broadcasts DCD>Compute, Storage & Networking DCD>Compute, Storage & Networking Next generation computing environments for AI workloads March 6, 2025, 9 a.m. — March 6, 2025, 10 a.m. This episode will be available to stream at 9:00am ETThe era of next generation computing is upon us, but keeping up with the demands of rapidly evolving workloads and accelerating tech refresh cycles is putting increasing pressure on businesses. To develop scalable and resilient AI strategies, many organizations are turning to the Cloud, but CSPs supporting traditional enterprise workloads also need to upgrade their infrastructure for AI. This episode explores:AI’s impact on traditional data centers and the challenges of power and capacityData center modernization as a strategy to free up power & space for AIBest practices for implementing enterprise AI solutions including hardware and softwareData center requirements for AI including GPU and CPU compute, storage and networking Speakers Alex Dickins , DatacenterDynamics Linda Yang , Supermicro Siva Kotipalli , AMD Brought to You by Supermicro"
