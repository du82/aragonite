title = "Former Princeton Nurseries site in New Jersey could host data center - DCD"
description = """
By                                        Matthew Gooding"""
full_description = '''Former nursery site in New Jersey could host data center Part of wider redevelopment of Princeton Nurseries March 05, 2025 By Matthew Gooding Comment A former nursery in New Jersey could be turned into a data center.The owner of the Princeton Nurseries site is seeking to construct a 340,985 sq ft (31,678 sqm) data center as part of a wider redevelopment of the 160-acre plot.WRV Nurseries South Brunswick LLC has applied for permission to build the data center, along with parking and associated facilities.It will be accessed by a private road that will be built to connect with the nearby Route 1 highway at the Independence Way intersection. The news was first reported by My Central Jersey. The former Princeton Nurseries site – Google Maps If approved, the data center will be located in OC Office Corporate Zone within the Princeton Nurseries Redevelopment Area. Technical specifications and how the data center would be powered, have not been shared.The site was formerly home to Princeton Nurseries, once the largest commercial nursery in the US. It introduced many important plant varieties, but the site has been empty since the nursery relocated in 1995.It is now under the control of South Brunswick Township of the State of New Jersey, which is looking to redevelop into a mixed commercial development targeting tech and life sciences, as well as other sectors.A decision on the data center plan will be made by South Brunswick Township Planning Board at a meeting on March 12.According to Data Center Map, South Brunswick is currently home to just one data center, which is operated by Lumen. However, the wider New Jersey area is an active market, with many facilities serving New York’s financial district.Last year, a six-building data center campus covering 2.4 million sq ft (222,970 sqm) was proposed for South New Jersey, near Philadelphia. More in North America DCD>Connect | Investment New York - Sponsorship Brochure 22 Jan 2025 Quantinuum to establish photonics R&D center in New Mexico 10 Sep 2024 Lynk Global appoints Dan Dooley as new CEO in strategic rejig More in Construction & Site Selection DCD Edge Facility Construction Survey Report 2024 07 Feb 2025 NTT launches Kolkata data center campus in West Bengal, India Episode The burgeoning importance of secondary markets in APAC Tags New Jersey OC Office Corporate Zone Princeton Nurseries South Brunswick Township South Brunswick township planning board WRV Nurseries South Brunswick LLC googletag.cmd.push(function() { googletag.defineSlot('/21796610478/Datacenterdynamics_UK_DCDUK_REGION_GLOBAL_HOME_LB_BOTTOM', [728, 90], 'ad-unit-leaderboard-footer-3652344468') .addService(googletag.pubads()) .setTargeting("term", "the-data-center-construction-channel,construction-site-selection,north-america") .setTargeting("path", "/en/news/former-nursery-site-in-new-jersey-could-host-data-center/"); googletag.enableServices(); googletag.display('ad-unit-leaderboard-footer-3652344468'); }); var documentLanguage = document.documentElement.getAttribute('lang'); var disqus_config = function () { this.page.url = "https://www.datacenterdynamics.com/en/news/former-nursery-site-in-new-jersey-could-host-data-center/"; this.page.identifier = "95747"; this.language = (documentLanguage === "es" ? "es_ES" : documentLanguage); }; (function() { var d = document, s = d.createElement('script'), s2 = d.createElement('script'); if (document.language === "es") { s.src = 'https://datacenterdynamics-es.disqus.com/embed.js'; s2.src = 'https://datacenterdynamics-es.disqus.com/count.js'; s2.id = 'dsq-count-scr'; } else { s.src = 'https://datacenterdynamics.disqus.com/embed.js'; s2.src = 'https://datacenterdynamics.disqus.com/count.js'; s2.id = 'dsq-count-scr'; } s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); (d.head || d.body).appendChild(s2); })(); Please enable JavaScript to view the comments.</a>'''
