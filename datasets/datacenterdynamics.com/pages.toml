title = "Lenovo unveils ThinkEdge SE100 AI inferencing server at MWC - DCD"
description = """
By                                        Charlotte Trueman"""
full_description = '''Lenovo unveils ThinkEdge SE100 AI inferencing server at MWC Forms part of family of new ThinkSystem V4 servers March 05, 2025 By Charlotte Trueman Comment Lenovo has unveiled its new ThinkEdge SE100 AI inferencing server at Mobile World Congress.In a statement, the company said the offering was the “first-to-market, entry-level AI inferencing server,” designed to make Edge AI accessible and affordable. The Lenovo ThinkEdge SE100 server – Lenovo The SE100 forms part of Lenovo’s family of new ThinkSystem V4 servers and supports hybrid cloud deployments and machine learning for AI tasks like object detection and text recognition.Powered by Intel Xeon 6 processors, the server also contains the company’s new Neptune liquid cooling technology, Neptune Core Compute Complex Module, which, according to Lenovo, supports faster workloads with reduced fan speeds, resulting in quieter operations and lower power consumption.The company added that the technology has been specifically engineered to reduce air flow requirements, whilst also lowering fan speed and power consumption, and keeping parts cooler in order to extend their system health and lifespan.The SE100 is also 85 percent smaller than a standard 1U server, making it the “most compact AI-ready Edge solution on the market,” and has also been designed to stay under 140W, even at its fullest GPU-equipped configuration.“Lenovo is committed to bringing AI-powered innovation to everyone with continued innovation that simplifies deployment and speeds the time to results,” said Scott Tease, VP of Lenovo infrastructure solutions group, products. “The Lenovo ThinkEdge SE100 is a high-performance, low-latency platform for inferencing. Its compact and cost-effective design is easily tailored to diverse business needs across a broad range of industries. This unique, purpose-driven system adapts to any environment, seamlessly scaling from a base device, to a GPU-optimized system that enables easy-to-deploy, low-cost inferencing at the Edge.” More in IT Hardware & Semiconductors Future-proof your datacenter with DDC S-Series 17 Jan 2025 Department of Commerce signs four new CHIPS funding agreements Episode Software and hardware co-design: Optimizing next-gen compute Tags AI inference Lenovo Scott Tease ThinkEdge SE100 googletag.cmd.push(function() { googletag.defineSlot('/21796610478/Datacenterdynamics_UK_DCDUK_REGION_GLOBAL_HOME_LB_BOTTOM', [728, 90], 'ad-unit-leaderboard-footer-5372843865') .addService(googletag.pubads()) .setTargeting("term", "the-compute-storage-and-networking-channel,it-hardware") .setTargeting("path", "/en/news/lenovo-unveils-thinkedge-se100-ai-inferencing-server-at-mwc/"); googletag.enableServices(); googletag.display('ad-unit-leaderboard-footer-5372843865'); }); var documentLanguage = document.documentElement.getAttribute('lang'); var disqus_config = function () { this.page.url = "https://www.datacenterdynamics.com/en/news/lenovo-unveils-thinkedge-se100-ai-inferencing-server-at-mwc/"; this.page.identifier = "95741"; this.language = (documentLanguage === "es" ? "es_ES" : documentLanguage); }; (function() { var d = document, s = d.createElement('script'), s2 = d.createElement('script'); if (document.language === "es") { s.src = 'https://datacenterdynamics-es.disqus.com/embed.js'; s2.src = 'https://datacenterdynamics-es.disqus.com/count.js'; s2.id = 'dsq-count-scr'; } else { s.src = 'https://datacenterdynamics.disqus.com/embed.js'; s2.src = 'https://datacenterdynamics.disqus.com/count.js'; s2.id = 'dsq-count-scr'; } s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); (d.head || d.body).appendChild(s2); })(); Please enable JavaScript to view the comments.</a>'''
