["https://datacenterdynamics.com/en/news/microsoft-hits-back-at-uk-cmas-provisional-findings"]
title = "Microsoft hits back at UK CMA's provisional findings - DCD"
description = """
By                                        Georgia Butler"""
full_description = '''Microsoft hits back at UK CMA's provisional findings Cloud providers publish their response to initial report March 04, 2025 By Georgia Butler Comment Cloud providers, including Microsoft, Google, and Amazon Web Services (AWS), have submitted responses to the UK Competition and Markets Authority's (CMA) provisional findings from its cloud services market investigation.The initial report from the CMA was released in late January 2025 and found that both Microsoft and AWS had been "generating sustained returns from their cloud services substantially above their cost of capital in cloud services for a number of years." – Competition and Markets Authority The report identified issues with egress fees reducing the ability for customers to switch or use multi-cloud solutions, economies of scale preventing smaller providers from entering the market or expanding, and dedicated a section to Microsoft's licensing of products.Specific to the software licensing issue, the CMA found differences in relation to pricing and quality factors when customers used the software products on Microsoft cloud versus that of AWS and Google - "in fact, the price that Microsoft charges these rivals for some of these products can be higher than the retail price it charges its own customers."Both AWS and Microsoft were recommended for "SMS investigation" under the Digital Markets, Competition, and Consumers Act, which came into force at the start of this year, to consider designating the companies as having "strategic market status." Should AWS and Microsoft be found to be "SMS," they could be subjected to further investigation, and face conduct requirements, and reporting requirements.Microsoft has now hit back at the CMA, submitting a response on February 28, arguing that the regulatory body has not based its findings on "evidence" but instead using "hypothetical scenarios" and is "singling out" Microsoft.Microsoft added: "While AWS clearly believes it is entitled to license all of Microsoft’s software for its own benefit and on favorable terms (even though AWS provides none of its own software to Microsoft or anyone else), it has not, to our knowledge, complained about an inability to compete effectively. Nor could it."The response further draws attention to Google Cloud's successful growth, arguing that "with results like that, it bears reflecting whether the CMA must intervene to enable Google’s growth in the UK market by softening competition from its competitors."Microsoft described the request from AWS and Google to constrain the price that Microsoft can charge them when they use Microsoft's software to build and sell cloud services to their customers, and the price Microsoft itself charges customers, as "extraordinary and unprecedented," adding "no other software provider in the industry would be subject to similar limitations," and that AWS and Google do not allow any of their services to be licensed to Microsoft or other competitors at any price.The company also criticized Google's previous move to offer CISPE close to $500 million to continue its antitrust probe against Microsoft, and reiterated its accusation that the launch of the Open Cloud Coalition was a direct attempt to campaign against Microsoft.Microsoft concludes that starting a third investigation on the part of the CMA would be "a step in the wrong direction," and instead recommends the monitoring of developments and outcomes for UK customers in the cloud computing market.AWS' response to the provisional findings similarly asserts that the CMA's findings that AWS is anticompetitive are incorrect and claims that the CMA does not provide evidence for that. AWS does, however, agree that "Microsoft’s deliberate commercial decisions with respect to its software licenses is an example of such an artificial barrier, designed to restrict interoperability."Google, as expected, "strongly agree[s] with the CMA’s finding that Microsoft’s software licensing practices are giving rise to an adverse effect on competition," and said that it "broadly support[s] the package of remedies that the CMA recommends," though disagrees with proposed remedies on egress fees.Other responders to the report include the Open Cloud Coalition, Black Box Hosting, CCIA, Civo, Cloudflare, International Centre for Law and Economics, OVHcloud, Prolinx, Rayo, Rob Sedgwick, Simon Hansford, and Startup Coalition.Following the submission of these responses, the CMA is now determining whether to take action against the barriers to competition it has identified, with a final decision due later this year. More in Cloud & Hyperscale How to build business-ready hybrid cloud 28 Nov 2024 Royal Philips and AWS expand partnership to migrate health systems to the cloud Episode Achieving sustainable data centers through circular design More in UK & Ireland 27 Sep 2024 Vodafone signs wind PPA in Ireland 23 Sep 2024 Kirby CEO Mark Flanagan to step down after five years 28 Oct 2024 Lloyds Bank data center up for sale in West Yorkshire, UK Tags AWS Amazon Web Services CMA Competition and Markets Authority Google Microsoft UK googletag.cmd.push(function() { googletag.defineSlot('/21796610478/Datacenterdynamics_UK_DCDUK_REGION_GLOBAL_HOME_LB_BOTTOM', [728, 90], 'ad-unit-leaderboard-footer-2787885936') .addService(googletag.pubads()) .setTargeting("term", "the-cloud-and-hybrid-channel,the-investment-and-markets-channel,standards-regulations,cloud-hyperscale,uk-and-ireland") .setTargeting("path", "/en/news/microsoft-hits-back-at-uk-cmas-provisional-findings/"); googletag.enableServices(); googletag.display('ad-unit-leaderboard-footer-2787885936'); }); var documentLanguage = document.documentElement.getAttribute('lang'); var disqus_config = function () { this.page.url = "https://www.datacenterdynamics.com/en/news/microsoft-hits-back-at-uk-cmas-provisional-findings/"; this.page.identifier = "95716"; this.language = (documentLanguage === "es" ? "es_ES" : documentLanguage); }; (function(