title = 'Deutsche Telekom CEO says "Europe needs a DOGE," as carriers call out for more consolidation - DCD'
description = """
By                                        Paul Lipscombe"""
full_description = '''Deutsche Telekom CEO says "Europe needs a DOGE," as carriers call out for more consolidation It's not the first time consolidation has been called for by European CEOs March 05, 2025 By Paul Lipscombe Comment Deutsche Telekom CEO Tim Höttges has claimed that Europe needs its own version of the Department of Government Efficiency (DOGE) that Elon Musk runs in the US.He stated that there's too much red tape in the region, as several European carriers also took aim during this week's Mobile World Congress (MWC) event held in Barcelona, Spain. – Deutsche Telekom DOGE was established by President Donald Trump's administration as part of his campaign plans to significantly slash federal spending."What Europe needs is a DOGE,” Höttges said during a keynote. "We need an initiative to cut down this bureaucracy and this administration here because there are tens of thousands of people sitting there and administrating our industries."He was speaking alongside Vodafone’s Margherita Della Valle, Orange’s Christel Heydemann, and Telefónica's recently appointed CEO Marc Murtra.European operators, in particular, have struggled during the 5G era, with the continent falling way behind China and the US.For context, a recent Ookla whitepaper highlighted how big the gap has become with regards to the rollout of 5G Standalone (5G SA) network deployments.As of Q4 2024, China has 5G SA availability in 80 percent of the country, followed by 52 percent in India and 24 percent in the US. Meanwhile, 5G SA is only available to two percent of Europe's population. Time for consolidation?Höttges suggested now is the time for telecoms consolidation in Europe, comments he's made at previous MWC events.“There is no reason that every market has to operate with three or four operators,” he said. “We should build a European single market.”He wasn't the only CEO to call for market consolidation. Telefónica's Murtra is also keen to see mergers.Murtra noted that excessive European TMT regulation and fragmentation has caused the continent to fall behind."We believe that it is time for large European telecom companies to be allowed to consolidate and grow, to create technological capacity," he said.DOGE has been criticized in the US for firing critical federal workers, sometimes rehiring them, and incorrectly inflating how much it has saved. More in Carrier Networks 14 Jan 2025 Italian court rejects Vivendi's request to annul Telecom Italia's grid sale 09 Nov 2024 Australia's Optus slapped with $8m fine for last year's triple zero outage 20 Sep 2024 MTN and ZTE combine for 5G ultra-range maritime coverage in South Africa More in Europe DCD>Connect | London - Sample Delegate List 27 Nov 2024 Portus to expand Luxembourg data center Episode Transparency and community engagement in the high-density era Tags Deutsche Telekom MWC 2025 Spain Telefónica Tim Höttges googletag.cmd.push(function() { googletag.defineSlot('/21796610478/Datacenterdynamics_UK_DCDUK_REGION_GLOBAL_HOME_LB_BOTTOM', [728, 90], 'ad-unit-leaderboard-footer-6896085581') .addService(googletag.pubads()) .setTargeting("term", "the-telecoms-and-connectivity-channel,carrier-networks,telecoms-5g,europe") .setTargeting("path", "/en/news/deutsche-telekom-ceo-says-europe-needs-a-doge-as-carriers-call-out-for-more-consolidation/"); googletag.enableServices(); googletag.display('ad-unit-leaderboard-footer-6896085581'); }); var documentLanguage = document.documentElement.getAttribute('lang'); var disqus_config = function () { this.page.url = "https://www.datacenterdynamics.com/en/news/deutsche-telekom-ceo-says-europe-needs-a-doge-as-carriers-call-out-for-more-consolidation/"; this.page.identifier = "95761"; this.language = (documentLanguage === "es" ? "es_ES" : documentLanguage); }; (function() { var d = document, s = d.createElement('script'), s2 = d.createElement('script'); if (document.language === "es") { s.src = 'https://datacenterdynamics-es.disqus.com/embed.js'; s2.src = 'https://datacenter