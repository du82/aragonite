["https://datacenterdynamics.com/en/news/edf-masdar-sign-ppa-to-power-solunas-166mw-texas-data-center-behind-the-meter"]
title = "EDF, Masdar sign PPA to power Soluna’s 166MW Texas data center behind-the-meter - DCD"
description = """
By                                        Zachary Skidmore"""
full_description = '''EDF, Masdar sign PPA to power Soluna’s 166MW Texas data center behind-the-meter The PPA will cover the entire capacity of the data center March 05, 2025 By Zachary Skidmore Comment EDF Renewables North America and Masdar, an Emirati state-owned renewable energy company, have signed a long-term power purchase agreement (PPA) with data center developer Soluna Holdings for 166MW of wind power to its Project Kati data center in Texas.The 166MW data center will receive behind-the-meter power from the 273MW Las Majadas Wind Project, which became operational in 2021 and is located in Willacy County, southern Texas. EDF and Masdar co-own Las Majadas. Las Majadas Wind Project – EDF Renewables North America The PPA will cover the entire capacity of the data center and aims to supply the facility directly, while curtailing its operations under certain market conditions when energy is most needed on the grid.The length of the PPA was not disclosed.According to the companies, the PPA structure will provide a flexible solution to transmission constraints and curtailment challenges, essentially allowing an alternate route to capture under-utilized electricity.“Behind-the-meter offtake opportunities present a unique advantage for market-exposed renewable projects by physically delivering a portion of a plant’s power directly to a co-located buyer’s facility," said Gabe Messercola, associate director, capital improvements portfolio management at EDF Renewables. Messercola said the deal was a "win win situation" for the companies involved.The Project Kati data center will be used for Bitcoin mining and AI. Last month, it successfully exited the Electric Reliability Council of Texas planning phase. Following this exit, Kati will now focus on land negotiations, open the project to bids from potential investors, accelerate talks on possible joint ventures to develop an AI data center at the project, and complete a high-performance computing site analysis.Project Kati is named after Hungarian scientist Kati Kariko, who helped to develop mRNA-based protein therapies.Soluna intends to start construction on the project later this year. The company evelops, designs, and operates digital infrastructure. The company says it uses surplus renewable energy and repurposes it for HPC, Bitcoin mining, Generative computing, AI, and other compute-intensive applications.It also operates Project Sophie, a 25MW data center in Kentucky. Previously, the company owned another facility in Kentucky and one in Washington, but it exited in 2023 and 2022, respectively. More in North America DCD>Leadership Summit 2025 - Sponsorship Brochure 05 Dec 2024 AT&T to deploy Mavenir radios for Open RAN network 22 Oct 2024 Atalait plans $100 million investment to expand data center in Metepec, Mexico More in Sustainability Charting a Course for Compliance, Carbon Emission Reductions, and Efficiency with Low GWP Refrigerants 08 Jan 2025 NBN signs six year PPA with operator of Australia's largest wind farm Episode How to build a sustainable data center - Inside Conapto’s Stockholm 4 project Tags EDF Renewables North America Las Majadas Wind Project Masdar PPA Power Purchase Agreement Soluna US googletag.cmd.push(function() { googletag.defineSlot('/21796610478/Datacenterdynamics_UK_DCDUK_REGION_GLOBAL_HOME_LB_BOTTOM', [728, 90], 'ad-unit-leaderboard-footer-4607120952') .addService(googletag.pubads()) .setTargeting("term", "the-energy-and-sustainability-channel,north-america,sustainability,hpc-quantum") .setTargeting("path", "/en/news/edf-masdar-sign-ppa-to-power-solunas-166mw-texas-data-center-behind-the-meter/"); googletag.enableServices(); googletag.display('ad-unit-leaderboard-footer-4607120952'); }); var documentLanguage = document.documentElement.getAttribute('lang'); var disqus_config = function () { this.page.url = "https://www.datacenterdynamics.com/en/news/edf-masdar-sign-ppa-to-power-solunas-166mw-texas-data-center-behind-the-meter/"; this.page.identifie