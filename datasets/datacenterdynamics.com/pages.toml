title = "China's MIIT approves 13 foreign firms to offer telecoms value added services - DCD"
description = """
By                                        Niva Yadav"""
full_description = '''China's MIIT approves 13 foreign firms to offer telecoms value added services Policy first launched in October last year March 05, 2025 By Niva Yadav Comment China’s Ministry of Industry and Information Technology (MIIT) has reportedly given approval to 13 foreign companies to enter the telecoms sector. – Getty Images According to a report from the Xinhua News Agency, the companies will be permitted to offer value-added services, such as Internet access and information services in Beijing, Shanghai, Hainan, and Shenzhen.The MIIT first launched the pilot project in October last year, opening the doors to foreign-owned data centers, after initially mooting the plan in April 2024.As of the end of February, the report said the MIIT has given the green light to more than 2,400 foreign telecom enterprises, up 30 percent year-on-year.The policy allows foreign investors to operate wholly-owned businesses such as Internet data centers and to engage in data processing within the four cities.The investors will also have access to China’s cloud computing and computer power services.Companies include T-Systems P.R. China Ltd and Siemens Digital Technology, as well as Airbus China.Li Wenfang, vice president of T-Systems P.R. Ltd, said: “We can better integrate global resources, enhance technological innovation and service capabilities, and provide higher-quality solutions and services for multinational corporations, as well as industries operating in China such as the manufacturing and automotive industries, thereby leading more German companies to enter the Chinese market.”According to Developing Telecoms, Tesla and HSBC Fintech Services (Shanghai) are also planning to participate in the pilot.China has said the policy is an inclusive, investor-friendly alternative for overseas players in light of “simmering global trade tensions and a global surge in protectionism.”Last month, the Ministry of Commerce and the National Development and Reform Commission announced plans to stabilize foreign investment in 2025, including plans to open the telecoms VAS market and introduce similar pilots in biotechnology sectors.This comes as the Trump administration enacted a 10 percent hike on Chinese imports last Tuesday. China has responded with tariff increases of 10 to 15 percent on US agricultural imports. More in China 11 Nov 2024 Huawei outlines 5G Advanced progress, says telcos must prepare for AI future 02 Feb 2025 Canada and Mexico impose retaliatory tariffs against US 11 Nov 2024 TSMC suspends chip production for Chinese firms More in Telecoms & 5G Advanced Networks for Articial Intelligence and Machine Learning Computing 19 Oct 2024 Vodafone Idea eyes March 2025 5G launch in India Episode Looking ahead - telcos and the 6G rollout Tags Beijing China Hainan Li Wenfang MIIT Shanghai Shenzhen T-Systems P.R. Ltd googletag.cmd.push(function() { googletag.defineSlot('/21796610478/Datacenterdynamics_UK_DCDUK_REGION_GLOBAL_HOME_LB_BOTTOM', [728, 90], 'ad-unit-leaderboard-footer-7916376725') .addService(googletag.pubads()) .setTargeting("term", "the-telecoms-and-connectivity-channel,the-investment-and-markets-channel,telecoms-5g,government-military,china,investment-ma") .setTargeting("path", "/en/news/chinas-miit-approves-13-foreign-firms-to-offer-telecoms-value-added-services/"); googletag.enableServices(); googletag.display('ad-unit-leaderboard-footer-7916376725'); }); var documentLanguage = document.documentElement.getAttribute('lang'); var disqus_config = function () { this.page.url = "https://www.datacenterdynamics.com/en/news/chinas-miit-approves-13-foreign-firms-to-offer-telecoms-value-added-services/"; this.page.identifier = "95739"; this.language = (documentLanguage === "es" ? "es_ES" : documentLanguage); }; (function() { var d = document, s = d.createElement('script'), s2 = d.createElement('script'); if (document.language === "es") { s.src = 'https://datacenterdynamics-es.disqus.com/embed.js'; s2.src = 'https://datacenterdyn