["https://datacenterdynamics.com/en/dcd-connect-live/connect-nyc/2025"]
title = "DCD>Connect New York 2025 - DCD"
description = "DCD>Connect | New York will welcome over 3,500 delegates to the largest data center conference for the North American data center industry at the Marriott Marquis, Time Square in March 2025."
full_description = "Reliving Sandy: How data center operators coped during the record storm And what lessons we still need to learn Secure your pass Connect | New York 24–25 March 2025 Marriott Marquis, Times Square 19 Days to go Secure your pass Apply to speak Become a partner Connecting the data center ecosystem to design, build & operate sustainable data centers for the AI age Bringing together more than 3,500 senior leaders working on North America's largest data center projects, DCD>Connect | New York will drive industry collaboration, help you forge new partnerships and identify innovative solutions to your core challenges. Learn more about the Connect experience 3 Co-located events covering the entire digital infrastructure ecosystem Network with 3,500+ Senior Data Center Professionals Hear from 250+ leading experts from across the data center industry 120+ Exhibitors showcasing the latest tech First class event that presented a wide variety of perspectives and technologies in an engaging and informative forum. — Data Center Project Architect, AWS 3 Co-located events 120+ Exhibitors showcasing the latest tech 250+ Expert speakers 3,500+ Senior Data Center Professionals 3 Co-located events 120+ Exhibitors showcasing the latest tech 250+ Expert speakers 3,500+ Senior Data Center Professionals Our speakers Tom Garvens Vice President - Advanced Technology Innovation, Google Close Tom Garvens Vice President - Advanced Technology Innovation, Google Hands on technology executive with over 30 years of leadership in architectural definition, team building, engineering execution, and launch success. Results oriented with a strong track record of execution, incorporating many first to market IP elements. Track record of talent acquisition, development, and retention. Core Competencies: Cultivating innovation, execution planning/steering, tech partner relationships, and customer collaboration. View full profile and related articles Related sessions: Welcome Panel: AI unleashed - Data, compute and the future of everything March 24, 2025, 5 p.m. — March 24, 2025, 6 p.m. Main Stage Investment & Markets Compute, Storage & Networking Open Session More details Andria Zou Senior Director of Global AI Strategies and Solutions, NVIDIA Close Andria Zou Senior Director of Global AI Strategies and Solutions, NVIDIA View full profile and related articles Related sessions: Capacity Planning Welcome Lunch Briefing March 24, 2025, 12:15 p.m. — March 24, 2025, 1:45 p.m. Cloud & Hybrid Hospitality & Networking Invite-only Session More details Keith Heyde Director, Infrastructure Strategy & Development, OpenAI John Hawkins Global Cloud Data Center Real Estate Lead, IBM Close John Hawkins Global Cloud Data Center Real Estate Lead, IBM John Hawkins is the IBM Global Data Center Strategy and Planning Lead. John brings over 20 years and $3B of leasing experience in the data center and commercial real estate fields. John is best known for his work at Telx, where he was the Director of Global Real Estate & Data Center Expansions. During his years at Telx, John expanded the data center portfolio over seven hundred percent and negotiated over $1B+ in leases, leading to the acquisition of Telx by Digital Realty for $1.9 billion. Prior to Telx, John was Vice President of Real Estate and Data Center Logistics at Exenet Technologies, where he was responsible for the complete ownership of a multi-country facility build-out. Earlier in his career, John was Vice President of International Operations & Real Estate at The Matlen Silver Group, where he opened operations in India and Trinidad. John earned his Masters of Real Estate at New York University. View full profile and related articles Related sessions: Major Panel: Fragmented, but functional? - Redefining capacity planning for the future March 25, 2025, 4 p.m. — March 25, 2025, 5 p.m. Main Stage Management & Operations Cloud & Hybrid Open Session More details John Hilt Head of Data Center & Operations, GEICO Close John Hilt Head of Data Center & Operations, GEICO John Hilt is a highly-regarded executive with a distinguished career in data center operations, consulting engineering, and corporate real estate. With a specialized focus on digital infrastructure and critical facility management, he has successfully led large-scale data center construction, operation, and optimization projects. His expertise spans the full spectrum of design, construction management, and space planning, positioning him as a leading figure in the fast-paced, mission-critical world of data centers.John is highly qualified in client relationship management, portfolio leadership, and performance enhancement, and excels in budgetary planning and team leadership. He has a proven track record of managing multi-million-dollar, fast-tracked programs and high-stakes data center projects that demand precision, scalability, and operational efficiency.As an innovative problem solver, John is known for his ability to manage large, cross-functional teams, establish and control yearly budgets, and drive critical infrastructure projects to success. He communicates effectively with all stakeholders, including executive leadership, shareholders, clients, integrators, and vendors, ensuring seamless coordination and alignmentJohn’s relentless drive for excellence ensures a results-oriented, committed approach focused on operational resilience, future-proofing solutions, and sustained growth. John is a Licensed Professional Engineer that holds a bachelor’s degree in Computer Engineering and master’s degree in Business Administration from University of Delaware. He is also the recipient of multiple global awards for innovation. View full profile and related articles Related sessions: Major Panel: Fission Accomplished? Bridging energy gaps as nuclear power takes center stage March 25, 2025, 9:30 a.m. — March 25, 2025, 10:30 a.m. Main Stage Energy & Sustainability Open Session More details Jerrod Buterbaugh PMTS - Data Center Thermal and Power Architecture, AMD Close Jerrod Buterbaugh PMTS - Data Center Thermal and Power Architecture, AMD Jerrod Buterbaugh serves as a Principal Engineer in AMD’s Datacenter and Embedded Solutions Group, where he specializes in data center power and cooling infrastructure, with a focus on high-density, liquid-cooled computing systems. Jerrod began his career in the United States Air Force as an Avionics and Electrical Technician before moving into the tech industry. He spent 15 years at IBM, developing expertise in server power systems design and data center power and cooling engineering. Following IBM, Jerrod spent 10 years at Lenovo and was instrumental in advancing cooling technologies and services, particularly in energy efficient facility design and deployment of direct liquid cooled servers. Jerrod joined AMD in 2024 and guides AMD’s data center power and cooling infrastructure strategy and supports industry initiatives around high density, liquid-cooled GPU platforms. Jerrod has 24 patents in power and cooling technology and is a member of Open Compute Project and ASHRAE TC9.9, contributing to industry standards. Jerrod holds a B.S. in Electrical Engineering from the University of Florida. View full profile and related articles Related sessions: Major Panel: Too cool to commit? Breaking down barriers to liquid cooling adoption March 25, 2025, 10:30 a.m. — March 25, 2025, 11:30 a.m. Main Stage Data Center Cooling Open Session More details Herb Tracy Global Director of Critical Site Operations, BlackRock Close Herb Tracy Global Director of Critical Site Operations, BlackRock Herb Tracy's experience includes over 30 years of MEP Engineering, Facilities Management, Data Center Design and Management, Alternative Energy - Fuel Cells, Windmills, and Photovoltaic, Power Plant Maintenance and Management - Combined Cycle Gas Turbines and Steam Turbines, Environmental, Health, and Safety Management, and Business Development. View full profile and related articles Related sessions: Major Panel: Scaling up - What is the future of the enterprise? March 25, 2025, 11:30 a.m. — March 25, 2025, 12:30 p.m. Main Stage Management & Operations Cloud & Hybrid Compute, Storage & Networking Open Session More details John Lee Executive Director, Wells Fargo Close John Lee Executive Director, Wells Fargo John Lee is an innovative technology executive focused on operational excellence through driving change. Combining a proven track record for providing outstanding results and building teams with diverse skills to deliver the highest-level of customer service. Core abilities regarding analysis and optimization. Passionate about continuous learning. View full profile and related articles Related sessions: DCD>Debate: Clouded judgment - Are enterprises asking too much of cloud providers? March 24, 2025, 2 p.m. — March 24, 2025, 2:45 p.m. Cloud & Hybrid Open Session More details Kapil Wannere AVP - Network Engineering, Barclays Close Kapil Wannere AVP - Network Engineering, Barclays Kapil Wannere is a seasoned expert in IT infrastructure, cloud architecture, and network solutions, dedicated to designing and delivering innovative, scalable, and secure technologies that drive business success. With a strong foundation in SD-WAN, datacenter management, IT security, and cloud systems, Kapil specializes in creating cutting-edge solutions tailored to meet evolving organizational needs.Whether streamlining enterprise IT operations, deploying advanced cloud solutions, or optimizing network security, Kapil is passionate about solving complex challenges with precision, creativity, and professionalism. View full profile and related articles Related sessions: DCD>Debate: Will DCIM help navigate the data flood, or sink your operations? March 24, 2025, 11 a.m. — March 24, 2025, 11:45 a.m. Management & Operations Open Session More details Sean Varley Chief Evangelist, VP of Business Development, Ampere Close Sean Varley Chief Evangelist, VP of Business Development, Ampere Sean Varley is the Chief Evangelist and leader of ecosystem development and partner programs at Ampere. His group is responsible for go to market, messaging, strategy and execution of developer and partner ecosystem growth programs. The team covers marketing strategy, strategic business relationships, business planning and developer recruitment for Cloud Native Computing in the rapidly evolving Cloud and Edge server markets. Our goal is to provide Products and Solutions that showcase the disruptive advantage our unique Cloud-Native server processors provide to the market. View full profile and related articles Wellington Lordelo Global Director of AI & Innovation, Digital Realty Close Wellington Lordelo Global Director of AI & Innovation, Digital Realty View full profile and related articles Related sessions: Welcome Panel: AI unleashed - Data, compute and the future of everything March 24, 2025, 5 p.m. — March 24, 2025, 6 p.m. Main Stage Investment & Markets Compute, Storage & Networking Open Session More details Jennifer Ruch Director of Sustainability, Oracle Close Jennifer Ruch Director of Sustainability, Oracle Jennifer is a sustainability leader within the Oracle Cloud Infrastructure (OCI) Data Center Engineering team and is leading energy and sustainability for data center services. She is working towards Oracle's goals to be 100% renewable by 2025 and embed sustainability within one of the world's fastest growing public clouds.Prior to joining Oracle, Jennifer led Equinix's global Sustainability Program Office located within Investor Relations, helping them the EPA Green Power Partner of the year in 2020 as well as one of the largest corporate renewable energy buyers worldwide. In 2020, Jennifer also led the creation of Equinix's Green Finance Framework enabling the issuance of $3.7B in green bonds to finance their investments in green buildings, renewable energy, and energy and water efficiency. She also led their science-based targets and supported their leadership in the EU towards the formation of the EU Climate-Neutral Data Centre Operator Pact.She holds a master’s degree in Decision Analysis from Johns Hopkins University and an undergraduate degree in Chemistry. View full profile and related articles Related sessions: DCD>Debate: Gridlocked - Can data centers ever escape their energy constraints? March 24, 2025, 11 a.m. — March 24, 2025, 11:45 a.m. Mission Critical Power Open Session More details James Sedoruk Director of Operations – East, Sabey Data Centers Close James Sedoruk Director of Operations – East, Sabey Data Centers View full profile and related articles Related sessions: Major Panel: Rise of the machines - Is AI running your data center better than you? March 25, 2025, 3 p.m. — March 25, 2025, 4 p.m. Main Stage Management & Operations Open Session More details Alise Porto SVP of Energy and Sustainability, Switch Close Alise Porto SVP of Energy and Sustainability, Switch Alise Porto joined the Switch team in 2015 and has held several key senior management roles, currently serving as SVP of Energy and Sustainability. As an invaluable member of the Sustainability Team, she is responsible for the oversight of Switch’s environmental, social and governance initiatives (ESG), and is responsible for implementing sustainable energy and resource management strategies that align with the company’s overall policies and goals of being environmentally and socially sustainable, in partnership with the Policy team.In addition, she leads Switch’s energy procurement strategy, and energy resources, including Switch’s retail electric provider activities in Texas and various resource management initiatives. She similarly leads the development and execution of special projects associated with business development and innovative sustainable water resource management.Alise also co-leads the Switch Newsroom team that is responsible for public relations, corporate communications and corporate events and represents the companies interests at the Nevada Legislature.Alise received her degree from University of Nevada Las Vegas and completed the University of California Berkeley Sustainable Capitalism & ESG program. View full profile and related articles Related sessions: Major Panel: The sustainability imperative - Safeguarding data centers in an uncertain future March 25, 2025, 2 p.m. — March 25, 2025, 3 p.m. Main Stage Energy & Sustainability Open Session More details Sophie Smith Director, Soben Close Sophie Smith Director, Soben Based in the Southwestern US, Soben Director and Pre-Construction Lead, Sophie Smith specializes in data center preconstruction and post contract cost management. Sophie has worked on some of the largest data center projects and programs in the US and world. View full profile and related articles Related sessions: DCD>Debate: Is 'Pay-As-You-Go' the future of data center supply chains and vendor relationships? March 24, 2025, 2 p.m. — March 24, 2025, 2:45 p.m. Data Center Co"
