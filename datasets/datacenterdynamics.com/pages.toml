full_description = '''Stream now: DCD>International Women's Day Special .block-header .icon { color: #7da83b; } .block-header .button:not(.button--disabled) { background-color: #7da83b; } .block-header .icon-separator { color: #7da83b; } International Women's Day Special 2025 DCDBroadcast Subscribe to channel 5 March 2025 The Management & Operations Channel Home Broadcasts International Women's Day Special 2025 International Women's Day Special 2025 Not another “women in” panel March 5, 2025, 9 a.m. — March 5, 2025, 10 a.m. This episode will stream live at 9am ETWhile the title of this episode may be rather tongue and cheek, join us as we challenge the tradition of “women in” conversations and discuss the outstanding systemic change necessary in the industry. As data centers and digital infrastructure continue to expand globally, empowering and diversifying workforces is a central consideration for companies hoping to foster an inclusive and innovative working environment. Join this episode to:Address the "hangover effects" of outdated practices that hinder diversityCelebrate pioneering women who have championed initiatives to break down barriersLearn how to create new opportunities for those looking to excel in highly technical roles Speakers Allison Boen , Alcatex Kat Sullivan , DatacenterDynamics Miranda Gardiner , iMasons Climate Accord Catriona Shearer , JLL Brought to You by Kirby Group Engineering Subscribe to channel'''
