["https://datacenterdynamics.com/en/marketwatch/i-know-what-you-dont-know-about-data-centers"]
title = "I know what you don’t know about data centers - DCD"
description = "Emma Fryer discusses public perceptions of data centers, highlighting the findings of CyrusOne&#x27;s recent study"
full_description = '''Sponsored I know what you don’t know about data centers Emma Fryer discusses public perceptions of data centers, highlighting the findings of CyrusOne's recent study February 04, 2025 By DatacenterDynamics Comment As director of public policy at CyrusOne, Emma Fryer makes it her mission to mitigate risks to business operations posed by policy and regulatory developments – across no fewer than seven European markets. A role like this covers everything from lobbying to shape more favorable regulations, to driving education efforts that ensure policymakers and the public are well-informed about data centers.In this episode of DCD>Talks, we explore how Fryer’s role is particularly crucial at CyrusOne, as a global colocation provider with around 50 operational data centers. Furthermore, the company – like many others in the industry – is looking to expand into more rural or underserved markets, which comes with its own set of public policy challenges. Fryer notes:“The conventional availability zones are becoming increasingly saturated. In traditional locations, such as industrial estates, you're seeing developments shift toward semi-rural areas or urban residential zones. When sensationalist articles emerge, we have something concrete to challenge or refute them Emma Fryer, CyrusOne "That makes it essential to carefully consider how you integrate data centers and to understand public perceptions before moving forward. It's key for informing our future community engagement strategies.”Fryer highlights how this focus even led to a study examining public perceptions of data centers and their impact on community initiatives:“There's an element of frustration because we see a lot of negative media coverage. However, when we engage directly with the communities where we plan developments, the feedback is generally far more positive. We also wanted something statistically robust, so that when sensationalist articles emerge, we have something concrete to challenge or refute them.”With a representative sample of 13,129 general consumers across seven countries, CyrusOne aims to demonstrate that much of this media coverage does not necessarily reflect broader public opinion.What the public really knows about data centersFryer explains that CyrusOne’s study, designed to inform future community engagement strategies and better understand public perception to ensure data centers are accepted by communities, yielded interesting and somewhat surprising results.As anticipated, people living near data centers were more likely to understand their purpose and recognize their benefits. In contrast, the age group with the lowest awareness of data centers was the 16 to 24-year-old demographic.“Only 35 percent of them connected WhatsApp, TikTok, and Spotify, with the need for digital infrastructure – specifically data centers,” Fryer divulges. 21:43 DCD>Talks: Public perceptions of data centers with Emma Fryer, CyrusOne Emma Fryer of CyrusOne talks to DCD's Alex Dickins about the public perception of data centers, and why there is room for optimism but not complacency. 30 Jan 2025 “The overall understanding of what data centers do and how essential they are to our everyday digital services was surprisingly low. Across Europe, only 52 percent of respondents selected the correct definition from a set of five options."Statistically, with five choices, 20 percent should have answered correctly by chance alone, so 52 percent is still quite low. Astonishingly, the UK had the lowest awareness in Europe.”Fryer notes that while the sector has been effective in educating policymakers, outreach to the general public has been more challenging due to the industry’s B2B nature.The study highlights the need for greater public education, drawing in adjacent industries like power and energy. Fryer stresses the importance of improved community engagement and transparency to address public concerns and improve data center acceptance.The discussion concludes with a focus on the long-term importance of community engagement and the vital role data centers play in supporting local economies.To learn more about Emma Fryer’s take on the study’s findings, listen to the full DCD>Talks episode here. Read the report here. More from CyrusOne And now for the truth: What people really think about data centers Are data centers really as bad as they seem? And are negative reports a fair reflection of public opinion? 15 Jan 2025 By Emma Fryer, CyrusOne Data centers and the new Labour government: the start of a beautiful friendship? Things are getting easier for data center developers, but they still have a responsibility to maintain standards 24 Sep 2024 By Emma Fryer, CyrusOne The UK's CNI designation for data centers: "A rose by any other name…" The creation of a whole new government Department is itself an encouraging indication that digital technology is starting to get the attention it deserves 12 Sep 2024 By Emma Fryer, CyrusOne Tags Public policy Policy Public perception Emma Fryer Regulation CyrusOne googletag.cmd.push(function() { googletag.defineSlot('/21796610478/Datacenterdynamics_UK_DCDUK_REGION_GLOBAL_HOME_LB_BOTTOM', [728, 90], 'ad-unit-leaderboard-footer-9729556691') .addService(googletag.pubads()) .setTargeting("term", "the-data-center-construction-channel,government-military,colocation-wholesale,standards-regulations,business-operations") .setTargeting("path", "/en/marketwatch/i-know-what-you-dont-know-about-data-centers/") .setTargeting("associated_company", "cyrusone"); googletag.enableServices(); googletag.display('ad-unit-leaderboard-footer-9729556691'); }); var documentLanguage = document.documentElement.getAttribute('lang'); var disqus_config = function () { this.page.url = "https://www.datacenterdynamics.com/en/marketwatch/i-know-what-you-dont-know-about-data-centers/"; this.page.identifier = "94455"; this.language = (documentLanguage === "es" ? "es_ES" : documentLanguage); }; (function() { var d = document, s = d.createElement('script'), s2 = d.createElement('script'); if (document.language === "es") { s.src = 'https://datacenterdynamics-es.disqus.com/embed.js'; s2.src = 'https://datacenterdynamics-es.disqus.com/count.js'; s2.id = 'dsq-count-scr'; } else { s.src = 'https://datacenterdynamics.disqus.com/embed.js'; s2.src = 'https://datacenterdynamics.disqus.com/count.js'; s2.id = 'dsq-count-scr'; } s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); (d.head || d.body).appendChild(s2); })(); Please enable JavaScript to view the comments.</a>'''
