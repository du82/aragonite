full_description = "Stream now: DCD>International Women's Day Special .block-header .icon { color: #7da83b; } .block-header .button:not(.button--disabled) { background-color: #7da83b; } .block-header .icon-separator { color: #7da83b; } DCD>Telecoms & Connectivity DCDBroadcast 2025 New episodes released every month Home Broadcasts DCD>Telecoms & Connectivity DCD>Telecoms & Connectivity Looking ahead - telcos and the 6G rollout March 10, 2025, 9 a.m. — March 10, 2025, 10 a.m. This episode will stream live at 9:00am ETThe rollout of 5G is well underway, with telcos leveraging existing infrastructure while integrating new technologies. But with regions such as North America and APAC already looking ahead to deploying 6G by 2030, telcos need to be proactive to accommodate the infrastructure challenges that will arise. What are these challenges, and how are telcos preparing for them?This episode will discuss:Where are we with the 6G rollout by 2030, and can we exceed this?Regional nuances and market trends for 6G rolloutThe evolution of technology from 5GUnderstanding data center interconnects and new players in the market Speakers Paul Lipscombe , DatacenterDynamics Christopher Antlitz , Technology Business Research Marie Hogan , Ericsson"
