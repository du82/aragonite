full_description = "Qareeb Data Centres and Gcore sign MoU AI and cloud services in Middle East Shortly follows Gcore's joint venture announcement with Ezditek Uzbekistan to build 'carbon-free' data center with Saudi partners According to the Minister of Digital Technologies Secure your pass Connect | MENA 15–16 April 2025 JW Marriott Marquis, Dubai 41 Days to go Secure your pass Apply to speak Become a partner Connecting the data center ecosystem to design, build & operate sustainable data centers for the AI age Bringing together more than 800+ senior leaders working on the Middle East & North Africa's largest data center projects, DCD>Connect | MENA - Dubai will drive industry collaboration, help you forge new partnerships and identify innovative solutions to your core challenges. Learn more about the Connect experience 3 Co-located events covering the entire digital infrastructure ecosystem 60+ Exhibitors showcasing the latest tech Hear from 130+ leading experts from across the data center industry Network with 800+ Senior Data Center Professionals First class event that presented a wide variety of perspectives and technologies in an engaging and informative forum. — Data Center Project Architect, AWS 3 Co-located events 60+ Exhibitors showcasing the latest tech 130+ Expert speakers 800+ Senior Data Center Professionals 3 Co-located events 60+ Exhibitors showcasing the latest tech 130+ Expert speakers 800+ Senior Data Center Professionals Our speakers Hassan Al Naqbi CEO, Khazna Data Center Close Hassan Al Naqbi CEO, Khazna Data Center CEO of Khazna Data Center, Hassan Al Naqbi has held various positions with du and TECOM and was a member of the UAE Armed Forces. He holds a Bachelor of Science degree in engineering management and a higher diploma in computer engineering. View full profile and related articles Dame Dawn Childs Chief Executive Officer, Pure Data Centres Group Close Dame Dawn Childs Chief Executive Officer, Pure Data Centres Group Dawn is an accomplished engineer and operator who was honoured with a Fellowship from the Royal Academy of Engineering in 2020. Prior to joining Pure her career spanned several engineering sectors and industries including UK Change Director for National Grid across both the gas and electricity transmission businesses; Group Engineering Director for Merlin Entertainments with responsibility for engineering delivery, standards, practices and processes across the worldwide portfolio of more than 130 theme parks, resorts and attractions; Head of Engineering at Gatwick Airport covering the infrastructure and technical services at the airport; and over 20 years as an Engineering Officer in the Royal Air Force where she held various positions including Head of Engineering at RAF Waddington looking after the Intelligence, Surveillance, Target Acquisition and Reconnaissance aircraft fleets and Deputy Chief Engineer for the Air Transport and Air to Air Refuelling aircraft fleets.She has a track record of developing women in her organisation as well as working to bring more women and girls into engineering and has been the President of the Women’s Engineering Society since 2018.Dawn now leads the operational arm of Pure Data Centres Group ensuring the delivery of resilient 24/7 operations globally. View full profile and related articles Related sessions: DCD>Keynote Panel: Building competitive AI infrastructure in the Middle East April 16, 2025, 9:30 a.m. — April 16, 2025, 10:30 a.m. Investment & Markets Open Session More details Nader Alanazi Data Center Engineer, Oracle Close Nader Alanazi Data Center Engineer, Oracle Nader Alanazi is a Data Center Engineer with a strong background in network engineering and cloud infrastructure. Currently, he work at Oracle, where he focuses on data center operations, cloud solutions, and IT infrastructure management. He hold certifications like CDCTP, Oracle Cloud Infrastructure (OCI), and ITIL, and he earned my Bachelor’s degree in Computer Science from Tabuk University.He is passionate about cloud computing, networking, and system administration, always striving to optimize performance and efficiency. Whether it’s designing solutions, troubleshooting complex issues, or ensuring seamless operations. View full profile and related articles Related sessions: DCD>Debate: The double-edged sword: Is AI a path to operational efficiency or a source of chaos? April 15, 2025, 3:15 p.m. — April 15, 2025, 4 p.m. Management & Operations Energy & Sustainability Open Session More details Priyanka Nagpal Data Centre Lead, Consulting, MEA, JLL Close Priyanka Nagpal Data Centre Lead, Consulting, MEA, JLL With over 12 years of real estate research, pricing and acquisition strategy, consumer analytics and data centre experience, Priyanka holds a reputation as an ethical and reliable advisor in the corporate real estate domain across the region. She has an extensive skill set specific to data centre advisory, with over five years of dedicated experience working on data centre projects. View full profile and related articles Related sessions: DCD>Major Panel: Beyond the giants - Regions ready for data center growth April 16, 2025, 4 p.m. — April 16, 2025, 5 p.m. Main Stage Investment & Markets Open Session More details Kamel Al Tawil Managing Director, MENA, Equinix Close Kamel Al Tawil Managing Director, MENA, Equinix Kamel Tawil joined Equinix in September 2020 as Managing Director MENA (Middle East and North Africa) and he is responsible for developing MENA markets to deliver world class digital infrastructure solutions, building a network dense ecosystem. Prior, Mr. Tawil spent 18 years at Oracle in various leadership roles across ECEMEA (East Central Europe, Middle East and Africa) where he led major digital transformation projects. View full profile and related articles Related sessions: DCD>Keynote Panel: Building competitive AI infrastructure in the Middle East April 16, 2025, 9:30 a.m. — April 16, 2025, 10:30 a.m. Investment & Markets Open Session More details Safaa Adbel Baki Digital Strategy & Sustainability Consultant, LTA Close Safaa Adbel Baki Digital Strategy & Sustainability Consultant, LTA View full profile and related articles Related sessions: DCD>Major Panel: Conservation conversations - Shaping a sustainable data center landscape April 16, 2025, 10:30 a.m. — April 15, 2025, 11:30 a.m. Main Stage Energy & Sustainability Open Session More details Aslihan Gurescier Managing Director Turkey, Equinix Close Aslihan Gurescier Managing Director Turkey, Equinix Aslihan Güreşcier joined Equinix in 2019 as Managing Director for Turkey. Aslihan has more than 25years experience in the Digital & Data Center industry, including three years at Zenium Data Centers, where she was the Country Manager for Turkey. Most recently, Aslihan worked as a freelance cloud and data center consultant for various firms, including Tradefive, the exclusive partner of Alibaba Cloud in Turkey, to establish a local cloud presence.Prior to Zenium, Aslihan was with the Systems Integration, data center and technology solutions firm, KoçSistem, where she progressed to Sales Group Manager for more than 20 years with the company.Aslihan graduated from Bosphorus University with a BA in Foreign Languages in 1995 and an MA in Business Administration from Marmara University in 1999. View full profile and related articles Related sessions: DCD>Major Panel: Beyond the giants - Regions ready for data center growth April 16, 2025, 4 p.m. — April 16, 2025, 5 p.m. Main Stage Investment & Markets Open Session More details Scott McCarry Head of Procurement, Pure Data Centres Group Close Scott McCarry Head of Procurement, Pure Data Centres Group Scott is the Head of Procurement for Pure Data Centres, where he is responsible for developing and implementing equipment supply chains across Pure’s global fleet of data centre construction projects. Working exclusively in the data centre industry since 2012 delivering projects across the Middle East, Europe and Asia; Scott has developed a deep understanding of the supply chain value, associated risks, challenges and economics.Scott possesses a degree in Quantity Surveying from Edinburgh Napier University and has a background in the commercial management and procurement of global hyperscale data centre projects View full profile and related articles Related sessions: DCD>Debate: Is local manufacturing key to resilient supply chains across this region? April 15, 2025, 3:15 p.m. — April 15, 2025, 4 p.m. Management & Operations Data Center Construction Open Session More details Miranda Gardiner Executive Director, iMasons Climate Accord Close Miranda Gardiner Executive Director, iMasons Climate Accord Miranda Gardiner is the Executive Director of the iMasons Climate Accord, a non-profit composed of 250+ member companies, representing more than $6T in market cap, and aligned on global carbon accounting of digital infrastructure. The organization is focused on influencing market-based decisions and driving the data center industry to ultimately achieve net zero carbon.With over 16 years of experience, Miranda is a driven, professional manager with extensive industry experience in green buildings, energy and water efficiency, and sustainable master plans and policies. She is passionate about the environment and improving sustainability practices through local and global engagement, with a proven record of working for international sustainability organizations like the US Green Building Council and in 2020, was recognized by USGBC as a LEED Fellow.Miranda is an enthusiastic author and public speaker who clearly communicates with peers, clients, and corporations to achieve individual and departmental goals. She thrives in implementing sustainable practices that result in significant cost savings, improved efficiency, and reduced environmental impact. Additionally, she is distance running coach and cycling instructor, who believes that caring for oneself resonates in caring for the planet; she has completed 8 marathons and 3 ultramarathons. View full profile and related articles Related sessions: DCD>Major Panel: Conservation conversations - Shaping a sustainable data center landscape April 16, 2025, 10:30 a.m. — April 15, 2025, 11:30 a.m. Main Stage Energy & Sustainability Open Session More details iMasons EMEA Chapter Meeting April 15, 2025, 9 a.m. — April 15, 2025, 11 a.m. Co-located Chapter Meetings Open Session More details Sayed Hasan Amin Head of Operations, Batelco Close Sayed Hasan Amin Head of Operations, Batelco Sayed Hasan Amin is a distinguished leader in the data center and technology industry, bringing over 18 years of expertise in telecommunications, datacom, digital solutions, and data center operations. He holds a Bachelor of Business Information Systems from the University of Bahrain and a Master of Science in Information Systems Management from the University of Salford, complementing his extensive industry experience with strong academic credentials.As the Head of Operations at Batelco, Sayed has played a pivotal role in the development and delivery of state-of-the-art data center projects that support organizations’ digital transformation and infrastructure scalability. His portfolio includes leading the development of a 6MW data center in Bahrain, managing critical aspects of design, construction, and operations to ensure world-class standards. In addition, he has successfully delivered multiple data center projects, showcasing his expertise in achieving operational excellence, energy efficiency, and sustainable solutions.Sayed's leadership extends beyond data centers, with a track record of achievements such as centralizing enterprise support channels, integrating complex systems like BSS/OSS, and expanding terrestrial and submarine cable systems. His broad experience positions him as an expert in developing resilient, future-ready digital infrastructure. View full profile and related articles Related sessions: DCD>Major Panel: Building the future - Meeting booming capacity demands in the region April 16, 2025, 3 p.m. — April 16, 2025, 4 p.m. Main Stage Data Center Construction Open Session More details View all speakers Apply to speak Secure your pass End-User/Specifier April 15-16 Free Includes access to Connect | MENA Compute | MENA Investment Forum | MENA For end-users within the digital infrastructure industry More details Who qualifies? ✅ End-users within the data center industry from Enterprise and Hyperscale✅ End-users specializing in IT, Compute, Storage or Networking✅ Technical roles from Colocation Operators✅ Specifiers of data center technology & services (technical roles) from AECs (Architects, Consulting Engineers, Contractors), Systems Integrators and Energy Utilities✅ Procurement teams✅ Digital Infrastructure Investors/Analysts Who does not qualify? ❌ Sales & Marketing Professionals❌ Technology or Service Vendors❌ Resellers❌ Recruitment Firms Extra details End-User/Specifier passes include access to all three co-located events on April 15-16. You will also be invited to private activations included hosted lunches, cocktail hours and tech exchange sessions (subject to availability) and have the ability to book meetings via the event app. Complimentary food & beverages are provided throughout the event. Hide details Get your pass Show Floor April 16 only Free Includes access to Connect | MENA Compute | MENA For end-users within the data infrastructure industry, as well as the sales & marketing professionals who support them More details Who qualifies? ✅ Sales & Marketing Professionals from: Colocation & Cloud Providers, AECs (Architects, Consulting Engineers, Contractors), Systems Integrators and Energy Utilities✅ Law Firms & Professional Advisory Services Who does not qualify? ❌ Technology or Service Vendors❌ Resellers❌ Recruitment Firms Extra details Show Floor passes includes access to both co-located events taking place at the JW Marriott Marquis, Dubai on April 16 only, with the ability to book meetings via the event app. Complimentary food & beverages are provided throughout the event. Hide details Get your pass Vendor Pass April 15-16 $2,295 Includes access to Connect | MENA Compute | MENA Investment Forum | MENA For technology vendors, service vendors, resellers and recruiters More details Who qualifies? ✅ Technology or Service Vendors✅ Resellers✅ Recruitment Firms Extra details What is included in a Vendor Pass?✅ Access to all 3 co-located events on April 15-16: DCD>Connect | MENA - Dubai, DCD>Connect | Compute, and DCD>Connect | Investment✅ Complimentary two-night stay at the JW Marriott Marquis on the nights of April 14 & 15✅ Ability to book meetings through the event app✅ Complimentary food & beverages throughout the eventPurchasing multiple Vendor PassesIf you wish to purchase multiple passes for your team, event sponsorship could provide you more value. All of our sponsorship packages include Vendor Passes. Please get in touch with"
