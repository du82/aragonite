["https://datacenterdynamics.com/en/analysis/poles-apart-building-the-arctics-first-subsea-cable"]
title = "Poles apart: Building the Arctic's first subsea cable - DCD"
description = "Could going directly through the North Pole finally deliver the Arctic Circle an underwater Internet cable?"
full_description = '''Poles apart: Building the Arctic's first subsea cable Could going directly through the North Pole finally deliver the Arctic Circle an underwater Internet cable? February 28, 2025 By Matthew Gooding Comment Coral_Brunner/Getty Images Lapland’s reindeer herders face plenty of problems, but getting a mobile phone signal is apparently not one of them.“I remember going across Northern Finland on an educational program with a professor who gives remote classes on reindeer herding,” says Mia Bennett, an associate professor at the University of Washington and an expert on Arctic infrastructure.“She would go out on the tundra, connect to 5G, and zoom in with her phone to show her students back in Alaska what she was doing. Connectivity in most of Northern Scandinavia is pretty good - I spoke to another reindeer herder at a workshop who was able to pull up Snapchat to chat to the other herders and see what they were up to.”Reliable 5G and social media access may be a small consolation for the herders battling against the growing industrialization of the Arctic Circle and the impact logging and deforestation have had on the land they use to graze their animals. But it does reflect the fact that virtual infrastructure in many parts of the Far North is actually in good shape. Issue 55 - Poles Apart Building a submarine cable through the North Pole 20 Dec 2024 But despite the presence of 5G in one of the Earth’s most remote locations, fiber connections in the region are much rarer. Subsea Internet cables, which play a vital role in connecting the world, are few and far between in the oceans of the Arctic Circle, with climatic and geopolitical factors limiting their development.The prize for anyone who can successfully operate a cable in the Arctic is significant, though, with the region potentially able to provide a shortcut to connect the US, Europe, and Asia, relieving pressure on other, oversubscribed, routes.A new consortium is taking up the challenge with an ambitious plan to lay a cable, Polar Connect, right through the North Pole itself. This is easier said than done, though, with significant technological and environmental barriers to overcome if the project is to become a reality.This feature appeared in Issue 55 of the DCD Magazine. Read it for free today.A brief history of cables in the ArcticThe Arctic Circle is characterized as the geographical area where the sun does not rise all day on the Northern Hemisphere’s winter solstice, the shortest day of the year. It takes in areas of countries including the US, Canada, Russia, Finland, Norway, Sweden, and even a small part of Iceland. Greenland, the world’s largest island and a territory of Denmark, sits almost entirely within its borders. An ice breaker moored at Svalbard – Rixipix/Getty Images Despite covering an area of some 20 million sq km (7.7 million sq mi), most of which is occupied by ocean, the Arctic Circle is an almost entirely subsea cable-free zone. Per Submarine Cable Map, the only cables traversing the seas of the far north currently are Russia’s domestic Polar Express cable, the first section of which was completed in 2022, and the Svalbard cable system, a 1,400km (~840 mile) link that connects the island of Svalbard, the world’s northernmost civilian settlement, with the Norwegian mainland.Enterprising engineers have been trying to lay a larger network of cables around the Arctic, utilizing the Northern Sea Route, since the 1990s, says Howard Kidorf, managing partner at Pioneer Consulting, a firm that advises its clients on the planning and implementation of undersea cables. “I remember a project called Polarnet, which was originally supposed to start construction in 2002,” Kidorf says. “It was a vision to connect Europe, Asia, and the US.”Polarnet was a Russian-owned company, and seemed to be making progress towards its goal of linking East and West when, in 2012, it signed a contract with US cable vendor Tyco (now Subcom) to construct the Russian Optical Trans-Arctic Submarine Cable System, or ROTACS. But work on the project was put on hold when Russia invaded Crimea in 2014, and it was eventually canceled.Attempts were made to revive the ROTACS route in 2015 via Arctic Connect, a project led by Finland which would have seen a 13,800km (8,575 mi) cable laid connecting the Nordic nation and Japan via the Northern Sea Route. This would have been the shortest cable linking Europe with Asia, and Finnish telco Cinia joined forces with Russian telecoms firm MegaFon to deliver the project, which was due to be up and running in 2021/22. However, sanctions imposed on Russia after it waged war on Ukraine, plus spiraling costs, saw Arctic Connect sink without a trace. "In many ways, Quintillion serves as a useful proof of concept" Howard Kidorf The Russians instead pursued Polar Express, which conjures images of a cosy Christmas tale, but is in fact a state-funded cable connecting different parts of Russia via the Arctic Ocean. The first section, linking Teriberka and Amderma, was launched in October 2022, with a second section due to come online in 2025. For obvious reasons, Polar Express is not connected to any global telecoms networks.Elsewhere, Alaskan fiber company Quintillion proposed a northern cable from London to Tokyo via the US state, and even built part of the link, with a subsea cable in the Arctic Sea running from Alaska’s Nome to Prudhoe Bay. But plans for a more ambitious network collapsed in spectacular fashion when Quintillion CEO Elizabeth Pierce was sentenced to 60 months in jail for defrauding investors out of more than $270 million. Pierce was convicted in 2019 after being found guilty of fabricating future revenue contracts to convince investors to back the scheme.“Quintillion has not connected the big markets, so you might look on that project as a failure, but in many ways it serves as a useful proof of concept,” Kidorf says. “It shows that you can lay and service cables in Arctic waters, so it’s a step in the right direction.”While it may seem like all attempts to drop cables in the Arctic Ocean are cursed, enthusiasm about the region’s potential as a future fiber route remains high. There are two practical reasons for this, Kidorf says. One is that the region itself is increasingly busy with shipping traffic and industrial activity as global warming causes the polar ice cap to recede. The other is that it could open up a faster way to connect Europe with Asia and the US, avoiding the crowded and problematic routes through the Middle East.“When the northern passages started opening, more ships started to traverse those routes,” Kidorf says. “Beyond that, there was already a need for connectivity because there oil and gas facilities on the northern coast of Alaska, First Nations on Canada’s coast and many extractive and military facilities on Russia’s. 16 Apr 2024 The Houthis and the Red Sea: A new risk to subsea cables Intentional or otherwise, terrorists are now a threat to global connectivity “There are also security concerns to consider - the US, Canada, and Russia have always had radar posts in the north, and Russia also has its submarine fleet anchored there.”As the Arctic ice thaws, things are also hotting up further south in the Red Sea, through which 90 percent of all Internet traffic between Europe and Asia flows. “All the cables available right now between Europe and Asia are expensive,” Kidorf explains. “They wiggle through the Mediterranean and the Middle East, and one of the motivations for setting up new routes is to avoid the Egypt bottleneck.”Not only is the route through the Middle East crowded, but it comes with considerable peril. DCD has previously reported on the threat posed by Houthi rebels in Yemen, who have declared they will sabotage cables as part of the ongoing conflict in the African nation. Attacks on ships in the region could also cause indirect issues for the 15 cables that run adjacent to Yemeni waters, with a stray anchor capable of causing an outage that can last for weeks at a time.Connecting the dotsThe latest attempt at laying an Arctic cable is Polar Connect - a project with similar ambitions (and a confusingly similar name) to its predecessors, but one that is taking a slightly different direction.It intends to lay a cable directly through the polar ice sheet, passing west of the geographical North Pole. The route would run from Sweden via Norway and Svalbard through the North Pole to Japan, South Korea, and the Asia-Pacific region via the Bering Strait between Alaska and Russia, with landing points in the US, too. The 10,000km cable will pass under some 2,000km of thick ice, with a target launch date of 2030. The routes of Polar Connect and Far North Fiber – NORDUNet Polar Connect is being planned by NORDUnet, the Nordic regional research and education network serving academics in Norway, Finland, Sweden, Denmark, and Iceland.Erik-Jan Bos, senior advisor at NORDUnet, is overseeing the project, and says it is designed to enable more efficient and resilient data sharing between Europe and the rest of the world.It is hoped this will help bolster Europe’s R&D efforts and the continent’s economy. On a political level, Bos says there is buy-in at both ends of the route. “Japan and South Korea are definitely interested because we need a direct path from Europe to Asia for digital sovereignty and autonomy reasons,” he says.Bos says Polar Connect was first conceived a decade ago under the name Borealis, but was considered infeasible at the time. NORDUnet decided to revisit the idea after the other Arctic cable projects sunk, and has spent the last 18 months carrying out studies to determine whether they can make their plan a reality.So far, the answer seems to be… maybe. A Northern EU Gateways project report from the Swedish Polar Research Secretariat (SPRS) looking into the plans suggests deployment of Polar Connect will require three ships; two heavy icebreakers (at Polar Class 2) and an ice-strengthened cable laying ship. “We need the two icebreakers so that the cable-laying ship can go about its business safely,” Bos says.Icebreakers are required because of the sheer thickness of the ice that Polar Connect intends to slice through. Some arctic icebergs reach the ocean floor, the SPRS report says: “Ice conditions in this area are among the toughest in the world,” it notes. While fresh ice can be relatively easy to cut, multi-year ice, which has thawed and refrozen several times, can be harder than concrete, the report says.The problem is, the ships needed by Polar Connect for this sizeable task do not all exist yet. When it comes to icebreakers, the Swedish Government currently owns a vessel, the Oden, that would be suitable for assisting a cable-laying ship in the Arctic. It is planning to commission a second imminently, known as the Swedish Heavy Polar Research Vessel (SHPRV), which it hopes to receive by 2028. A third icebreaker may even be needed as a backup, the Northern Gateways report says.At present, there is also no cable-laying ship suitable for the extreme conditions of Arctic waters. The report suggests converting an existing icebreaker, as this could be “significantly more cost-efficient” than building a new ship. Finnish crafts Fennica and Nordica have been identified as possible candidates for conversion. The SPRS report explains that in the cable laying operation, the SHPRV would lead the way, performing reconnaissance and initial cutting of the ice. The Odin would follow, ensuring the way was clear for the cable-laying ship, which would travel at the back of the convoy.How this complicated-sounding operation will be paid for remains to be seen, but the European Union is certainly throwing its weight behind Polar Connect, and in December 2024, announced it had awarded the project €4 million ($4.22m) to carry out mapping of the seabed in the Arctic Ocean. “All the oceans in the world have been mapped in detail apart from the Arctic" Erik-Jan Bos This is something, Bos says, that has never been done before on the required scale. “All the oceans in the world have been mapped in detail apart from the Arctic,” he says. “It remains largely unknown because it’s extremely difficult to do. We are planning to go there on expeditions over the next two years and collect bathymetry information.”Bathymetry information is that relating to the depth of an ocean, and thanks to the EU funding, the Polar Connect team will have access to the Oden to carry out its mission. Ieva Muraškienė, strategy, and policy officer at NORDUnet, says the bathymetry detail will be key to finalizing the route for Polar Connect.“It’s extremely important to get this data to have an understanding of where the safe path for the cable is,” Muraškienė says. “We already have some information about ridges and seismic activity, and there’s a whole continent underwater, which is relatively safe because it’s flat. But there might also be things like mountain slopes where you don’t really want to be putting a cable.”Russian rouletteWhile the Polar Connect team grapples with the physical challenges of laying cables through one of the most remote and unknown parts of the world, it will also be mindful of the geopolitical situation in the region.Russia’s status as an international pariah has put the kybosh on many pan-Arctic schemes, the University of Washington’s Bennett says. “There’s been a lot of excitement around infrastructure projects in the Arctic, driven by climate change making the region more accessible,” she says. “In the early 2010s, things like roads and pipelines came to fruition, and Russia made significant investments.”But, she says, a lot of projects fell through, partly because of cost overruns making the Arctic unviable, but also because “Russia becoming separated made things more challenging and volatile.”Mathieu Boulègue concurs. A researcher on Eurasian security and defense issues, and a visiting scholar at New York University, Boulègue recently authored a paper entitled Arctic seabed warfare against data cables: Risks and impact for US critical undersea infrastructure, and says the current situation in the region is something of a return to normality.“In the 1990s, Gorbachev floated the Murmansk Initiative, which aimed to promote Arctic exceptionalism and cooperation,” Boulègue says. “After that, we had what now looks like a 20-year ‘lull’ of low tension, but we are back in an era of operating in a confrontational geopolitical environment.”No longer a reliable partner for other countries in the Arctic region, Russia now squats as a hostile state next to Finland, and Polar Connect will pass close to its waters. This is a potential problem because the Kremlin - and its allies in China - have shown they are not averse to interfering with subsea infrastructure as a way of disrupting their enemies in the West.In November 2024, two Internet cables in the Baltic Sea were severed by a Chinese vessel, which investigat'''
