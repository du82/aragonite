["https://www.datadoghq.com/product/log-management"]
title = "Log Management & Analytics | Datadog"
description = "Datadog Log Management enables you to collect, monitor, manage, and analyze large volumes of logs as well as unify metrics and traces all in one platform."
full_description = "Datadog Log Management unifies logs, metrics, and traces in a single view, giving you rich context for analyzing log data. Whether you’re troubleshooting issues, optimizing performance, or investigating security threats, Logging without Limits™ provides a cost-effective, scalable approach to centralized log management, so you can get complete visibility across your stack.Rapid troubleshooting and analytics with no querying languageSearch, filter, and analyze logs on the fly—no complex query language requiredAnalyze logs with out-of-the-box interactive dashboards and drag-and-drop data visualizationsJump start exploration with Log Patterns, which intelligently surfaces trends in log activityDrill deeper with Pattern Inspector to understand at a glance the distribution of values within each patternFor time sensitive issues, automatically identify Log Anomalies using Watchdog Insights Process, enrich, and route all your logs from one control panelLeverage out-of-the-box log processing pipelines for 200+ common technologiesBuild consistent, structured datasets from your raw log data, no matter the sourceEnrich ingested logs with custom reference data to add more context and make them more actionableCentralize routing of processed logs to 3rd party destinations such as your data lake or SIEM vendor using Log ForwardingLogging without Limits™Ingest, Live Tail, Live Search, flexibly store, and archive everything. Decide which logs are most useful to retain (and for how long); change your mind anytimeGenerate metrics from all logs (regardless of whether they’re indexed) to track trends and KPIsRehydrate logs from your compressed log archives and access them in Datadog to support audits or investigationsPerform simple or complex log queries directly on Flex Logs in Datadog, including extended retention optionsFlexibly store all logs at any retention and querying capacityLeverage Flex Logs to adjust your retention and querying capacity independently, fulfilling even more use cases than standard retentionMeet your budget and users’ query needs while reducing the number of places logs need to be storedMaximize full storage and investigation into any log typeMake both simple and complex queries on all stored logs with the full capabilities of the Log Explorer, which is purpose-built for querying logsSeamless correlation with full context in an integrated platformPivot from logs to the corresponding APM traces with a single click for full contextJump directly from logs to triggered security signals without switching tools or contextsEasily navigate from dashboards to associated logs for faster troubleshooting Scalable log management for every team and every stackManage access to your log data with granular RBAC controls that can be scoped to fit your organization’s structures and rolesScale with confidence—send and process millions of logs per minute or petabytes per month seamlesslySupports PCI and HIPAA compliance400+ Detection Rules to protect against cloud threatsAutomate threat detection with our built-in SIEM developed and maintained by our in-house security research team and correlate activity across alertsIdentify common threats or attacks within the MITRE ATT&CK® framework ensuring robust security coverageCustomize rules effortlessly with our easy-to-use query language, tailored to meet your security needsUse Log Explorer and Log Workspaces to query and visualize security logs as tables, charts, and more to detect suspicious user and entity activities and patterns Previous NextFor us, it’s all about getting the right insights and maximizing the return on our log assets. Datadog Flex Logs not only provides us with the flexibility to retain any type of log, but also accommodates our logging workloads and querying all as part of an integrated platform experience.Rachit Nandwani Engineering Manager Observability, Square (Block, Inc.)Datadog Flex Logs has made it easier for our engineering teams to correlate logs with metrics and troubleshoot production issues faster. The decoupling of storage and compute allows us to solve our multiple log monitoring use cases effectively and efficiently—helping our business to grow rapidly in the region.Jose Dalino Jr. Head of Engineering, TravelokaWe want to know everything about each one of our viewer's experience, which means a lot of logs. At peak it is 150 million logs per minute—we can’t possibly index everything we ingest, hence Logging without Limits™.Kartik Garg Director - Cloud & Platform Engineering, HuluDatadog Log Management has changed the way we approach log ingestion and usage, allowing multiple teams to sustainably manage very large volumes of logs.Aaron Mitti Chief Software Architect at GE Transportation, a Wabtec CompanyDatadog’s ability to filter the exact logs we need, and retain what’s most valuable for specific time periods, has enabled us to cover everything within budget, allowing us to find and fix performance issues faster.Prakash Janakiraman Co-Founder and Chief Architect, NextdoorDatadog has been instrumental in reducing our time to incident resolution. Datadog exposes a great deal of valuable data about our services and environments, to the right stakeholders, at all points of our software development life cycle.Jeff Webb Engineering Manager, Rose RocketCustomer TestimonialsFor us, it’s all about getting the right insights and maximizing the return on our log assets. Datadog Flex Logs not only provides us with the flexibility to retain any type of log, but also accommodates our logging workloads and querying all as part of an integrated platform experience.Rachit NandwaniEngineering Manager Observability, Square (Block, Inc.)Datadog Flex Logs has made it easier for our engineering teams to correlate logs with metrics and troubleshoot production issues faster. The decoupling of storage and compute allows us to solve our multiple log monitoring use cases effectively and efficiently—helping our business to grow rapidly in the region.Jose Dalino Jr.Head of Engineering, TravelokaWe want to know everything about each one of our viewer's experience, which means a lot of logs. At peak it is 150 million logs per minute—we can’t possibly index everything we ingest, hence Logging without Limits™.Kartik GargDirector - Cloud & Platform Engineering, HuluDatadog Log Management has changed the way we approach log ingestion and usage, allowing multiple teams to sustainably manage very large volumes of logs.Aaron MittiChief Software Architect at GE Transportation, a Wabtec CompanyDatadog’s ability to filter the exact logs we need, and retain what’s most valuable for specific time periods, has enabled us to cover everything within budget, allowing us to find and fix performance issues faster.Prakash JanakiramanCo-Founder and Chief Architect, NextdoorDatadog has been instrumental in reducing our time to incident resolution. Datadog exposes a great deal of valuable data about our services and environments, to the right stakeholders, at all points of our software development life cycle.Jeff WebbEngineering Manager, Rose RocketRecognized by G2 for Log Analysis and Log Monitoring :root{--callout-bg-gradient-dg:linear-gradient(to right, #4401B1, #8001FF)}:root{--callout-background-dg:none}Product Brief: Log Management & AnalyticsCost-effectively collect, process, and archive your logsGet the Product BriefResourcescase studyResolving bugs and scaling challenges using the power of Logging without Limits™Log ManagementObservabilityBLOGRoute logs to third-party systems with Datadog Log Forwardingfeaturelog managementBLOGGroup your logs to analyze processes with Log Transaction Queriesfeaturelog managementBLOGAdd more context to your logs with Reference Tablesfeaturelog management:root{--callout-bg-gradient-pricing:linear-gradient(to right, #FF0080, #8000FF)}:root{--callout-background-pricing:none}Get started with Log Management & Analytics today with a 14-day free-trial start free trialview pricing"
