everal years as a software engineer at IBM Research, Neomeo, and Orange, and he brings a strong focus on technical elegance and operational efficiency to Datadog. Alexis holds an MS, CS from the Ecole Centrale Paris and has presented sessions on cloud monitoring and server performance at many conferences, including AWS re:Invent, Monitorama, DevOpsDays, Velocity, and PyCon.David ObstlerCHIEF FINANCIAL OFFICERDavid Obstler brings more than three decades of operational finance experience, with over two decades focused on technology companies. Prior to Datadog, David served as CFO of TravelClick, where he led global financial operations. David was appointed to the board of Braze in 2021. David has also held CFO roles at OpenLink Financial, MSCI Inc., Risk Metrics Group, and Pinnacor, as well as investment banking positions at JPMorgan, Lehman Brothers, and Goldman Sachs. David has a BA from Yale University and a MBA from Harvard Business School.David Obstler brings more than three decades of operational finance experience, with over two decades focused on technology companies. Prior to Datadog, David served as CFO of TravelClick, where he led global financial operations. David was appointed to the board of Braze in 2021. David has also held CFO roles at OpenLink Financial, MSCI Inc., Risk Metrics Group, and Pinnacor, as well as investment banking positions at JPMorgan, Lehman Brothers, and Goldman Sachs. David has a BA from Yale University and a MBA from Harvard Business School.Sara VarniChief Marketing Officer Sara Varni has over 15 years of experience bringing enterprise software products to market. Prior to Datadog, she served as CMO of Attentive, a leader in SMS marketing, as well as the CMO of Twilio where she bridged the developer and enterprise markets. Sara started her career at Salesforce where she spent over 10 years in various leadership roles, ultimately managing marketing for their flagship product. She holds a BS from Bucknell University and an MBA from t