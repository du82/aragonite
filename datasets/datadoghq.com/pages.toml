description = "ObservabilityEnd-to-end, simplified visibility into your stack’s health & performance"
full_description = "Datadog Database Monitoring (DBM) enables application developers and database administrators to troubleshoot and optimize inefficient queries across database environments. Easily understand database load, pinpoint long-running and blocking queries, drill into precise execution details, and optimize query performance to prevent incidents and spiraling database costs. With Database Monitoring, easily identify, investigate, and resolve slow and problematic queries by unifying database, application, and infrastructure telemetry in one place.Troubleshoot database host and query inefficienciesTriage database issues using wait event load analysis and host insights to quickly identify areas of underperformanceFind out what resources queries are waiting on and what users, queries, services, and applications are driving the load on database hostsIsolate long-running queries by examining historical and currently running query performance and database configuration metricsResolve database table locks by visually identifying root blocking queries and impacted waiting queries to identify specific query processes to kill Proactively optimize query performanceTrack performance trends by monitoring key query metrics, including average latency, total execution time, and number of rows queried over timeQuickly improve underperforming queries that have long-running transactions, are high-impact blockers, or have index recommendations by using automated Watchdog insightsIdentify the best performing query configurations by comparing individual query executions Resolve outages faster with unified database and application performanceAccelerate root cause analysis of high latency by correlating distributed traces with query metrics and explain plans in one viewTriage issue faster across teams by understanding how database bottlenecks impact calling services and vice versaMonitor database host and query metrics alongside service performance, reliability, and cost data in 