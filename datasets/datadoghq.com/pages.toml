full_description = "Datadog FundamentalsDatadog Fundamentals is our foundational certification offering. This exam tests core knowledge required to use the platform effectively. Knowledge covered includes basic computer fundamentals, infrastructure deployment with Datadog, networking and Datadog Agent configuration, data collection, troubleshooting the Datadog Agent, and data visualization and utilization.View the exam guide Try Our Practice Exam Log Management FundamentalsDatadog’s Introductory Log Management exam tests base knowledge of logging and log management with Datadog. This exam covers logging fundamentals, log collection, log parsing, log searching and filtering, log analysis, log utilization, and log troubleshooting with Datadog.View the exam guide Try Our Practice Exam APM and Distributed Tracing FundamentalsDatadog’s Introductory APM exam tests base knowledge of the APM product. This exam covers APM fundamentals, application instrumentation with Datadog, insight discovery with Datadog APM, visualizing insights, and troubleshooting applications using APM.View the exam guide Try Our Practice Exam"
