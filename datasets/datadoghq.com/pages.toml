title = "Applicant and Candidate Privacy Notice | Datadog"
description = "See metrics from all of your apps, tools & services in one place with Datadog's cloud monitoring as a service solution. Try it for free."
full_description = "At Datadog, we care about your privacy. That’s why every candidate for employment with us receives this notice, which explains what information Datadog (“we,” “us,” “our”) collects about you during our hiring process, why we collect and how we use your information, and what your rights are related to your information. Please note that your use of any Datadog service or website is also governed by our general Privacy Policy. During the recruitment process, we will collect information about you–either from you directly or from third parties with your approval–which may include the following: We only use the information we collect about you as part of our application and recruitment process in order to: The security of your personal information is incredibly important to us. We have implemented and we continually maintain a variety of technical and organizational measures to protect your personal information from unauthorized access and against unlawful processing, accidental loss, destruction, and damage. If you are considered for a position at Datadog and your candidacy is unsuccessful, you decline our offer, or you withdraw your application, we will retain your personal information only to consider you for potential future positions at Datadog, and as long as needed to comply with any applicable laws or for the establishment, exercise, or defense of a legal challenge related to our recruitment process or decision. If you do not want us to retain your personal information to consider you for potential future positions, you may request that we delete it as described below. Please note, however, that we may retain some information that we are required to retain by law or in order to defend ourselves in the event of a legal claim. If you are offered and accept a position with us, your personal information will become part of your employment record. This section provides additional details about the personal information we process subject to the General Data Protection Regulation (GDPR) and UK GDPR."
