title = "How TriZetto’s CIO Consolidated Tools to Reduce IT Costs with Datadog | Datadog"
description = "See metrics from all of your apps, tools & services in one place with Datadog's cloud monitoring as a service solution. Try it for free."
full_description = "TriZetto Provider Solutions, a Cognizant company, offers healthcare organizations revenue cycle and claims management software and services. The company currently serves 347,000+ healthcare providers, processing more than 2.6B transactions annually. With more than $1B in annual transactions, TriZetto needed to ensure its systems had a 99.99% uptime and prevent outages before they occurred. But with limited visibility into its IT environment, TriZetto’s IT team was often the second to know when services were slow or down. “Clients would call us and say, ‘Hey, this service is slow, or that service is down,’” says Robert Wise, CIO.To improve visibility across its environment, TriZetto recently selected Datadog to replace four existing monitoring tools and to consolidate everything into a single, intuitive dashboard.“We now have the ability to set a high watermark and a low watermark for server performance, so when we start crossing thresholds, we get alerts quickly, address those alerts, and reduce the false positives we had before,” says Wise.Tool consolidation also enabled Wise to generate cost savings while reducing MTTR/MTTD and improving customer satisfaction. “The implementation of Datadog means we can now partner more closely with our clients,” says Wise. “We are actively working on operational dashboards for our clients where they can see the environment in real-time. They can see how their systems are performing. They can look at the response times of our systems. They can also look at the uptime of our systems and availability in real-time.”Ultimately, Datadog plays a critical role in TriZetto’s efforts to help health systems, hospitals, physician practices, partners, and payers improve how they manage revenue cycles and simplify the business of healthcare."
author = "Datadog"
year_published = 2025
