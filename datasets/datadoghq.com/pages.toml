["https://www.datadoghq.com/ja/product/data-streams-monitoring"]
title = "Data Streams Monitoring | Datadog"
description = "Datadog Data Streams Monitoringで、ストリーミングデータパイプラインのマッピング、モニタリング、トラブルシューティングを簡単に行なえます。詳しくはこちら。"
full_description = "Datadog Data Streams Monitoring（DSM）を使用すると、KafkaやRabbitMQを使用するイベント駆動型アプリケーションのパフォーマンスを簡単に追跡して改善できます。DSMは、すべてのサービスとキュー間の依存関係を自動的にマッピングし、エンドツーエンドのレイテンシの測定、障害のあるキューやサービスとその所有者の特定、バックアップされたメッセージの洪水を修復するのに役立つすぐに使えるメトリクスを提供することで、重大なダウンタイムの回避と厳しいSLAの達成を可能にします。2022 GARTNER® MAGIC QUADRANTTMDatadog は、Gartner® Magic Quadrant™ の APM およびオブザーバビリティ部門においてリーダーに認定されました。詳細なレポートを入手イベント駆動型アプリケーションのあらゆる場所で速度低下を検出キュー、プロデューサー、コンシューマーを含むパイプライン全体の任意の2点間のレイテンシーを測定。秒単位とオフセット単位の遅延指標を確認できるため、遅延メッセージを簡単に特定できます。閾値、異常値、外れ値モニタリングを作成することで、ストリーミングデータパイプラインの異常なレイテンシーやスループットを迅速に検出できます。パイプラインのボトルネックや障害を局所化し、解決エンド・ツー・エンドのパイプライン・トポロジーの自動マッピングにより、キュー、プロデューサー、コンシューマー間の依存関係の破綻を簡単に検出遅延がアプリケーションサービスやキューシステムの問題に起因しているかどうかを判定し、原因チームを特定サービスやキューのメッセージバックアップ量を考慮し、遅延の影響によるトラブルシューティングの優先順位付け大量のバックアップ メッセージを修復ダウンストリームのボトルネックを迅速に検出・解決し、長い遅延、メッセージのダウンタイム、メッセージの遅延を防ぎます。各サービスの自動コンシューマラグ通知により、上流でメッセージフローのバーストが発生している可能性がある箇所を特定します。依存するすべてのサービスやキューにおけるメッセージの流れを視覚的に追跡し、常にSLAを満たすようにします。ストリーミング データ パイプライン メトリクスをコンテキスト内のすべてのテレメトリと関連付けDSM メトリクス、分散トレース、インフラストラクチャ メトリクス、ログの間でシームレスにピボットすることで、アプリケーションの問題をより迅速に解決します。Kafka または RabbitMQ 統合ダッシュボードにレイテンシとスループットのメトリクスを追加することで、パイプラインを完全に可視化します。サービス カタログ経由でサービス オーナー、オンコール エンジニア、重要なリソースに迅速にアクセスできるため、インシデント対応が合理化されます。 Previous Next当社のデジタル取引プラットフォームを支えるストリーミングデータパイプラインの構築には、すべてのキューとサービスを含むシステム全体のスループットとレイテンシを可視化する必要があります。Data Streams Monitoringによって、私たちのチームはパフォーマンスのボトルネックを積極的に発見し、ストリーム処理を最適化して、最大スループットと低レイテンシーのデータ配信を顧客に保証できます。ダレン・ファー MarketAxess社のソリューションアーキテクトDatadog Data Streams Monitoringのおかげで、世界中に散らばるクラスタのKafkaパイプラインのトポロジーを簡単にマッピングし、エンドツーエンドのレイテンシーをモニタリングし、パイプライン全体のインシデントソースを1か所で特定することができます。DSMがAPMとシームレスに統合されたことで、世界中の何百万人ものゲーマーが常に最高の体験を得られるようにすることができました。スンヨン・オ Devsisters社のエンジニアリング担当VPCustomer Testimonials当社のデジタル取引プラットフォームを支えるストリーミングデータパイプラインの構築には、すべてのキューとサービスを含むシステム全体のスループットとレイテンシを可視化する必要があります。Data Streams Monitoringによって、私たちのチームはパフォーマンスのボトルネックを積極的に発見し、ストリーム処理を最適化して、最大スループットと低レイテンシーのデータ配信を顧客に保証できます。ダレン・ファーMarketAxess社のソリューションアーキテクトDatadog Data Streams Monitoringのおかげで、世界中に散らばるクラスタのKafkaパイプラインのトポロジーを簡単にマッピングし、エンドツーエンドのレイテンシーをモニタリングし、パイプライン全体のインシデントソースを1か所で特定することができます。DSMがAPMとシームレスに統合されたことで、世界中の何百万人ものゲーマーが常に最高の体験を得られるようにすることができました。スンヨン・オDevsisters社のエンジニアリング担当VPリソースofficial docsData Streams MonitoringBLOGTrack and improve the performance of streaming data pipelines with Datadog Data Streams MonitoringfeatureAPMBLOGMonitoring Kafka performance metricsmonitoring guideseries metricsBLOGLessons learned from running Kafka at Datadogbest practicesinfrastructure monitoringBLOGSimplify microservice governance with the Datadog Service Catalogfeatureservice catalogすべての関連資料を表示"
