full_description = "Datadog Dynamic Instrumentation enables you to capture application telemetry at runtime and swiftly troubleshoot production issues without making code changes or restarts. By utilizing Dynamic Logs, you can easily capture method parameters and local variables; Dynamic Metrics enables you to analyze method usage and impact; and Dynamic Spans and Span tags offer additional granularity and context to your APM traces.Debug application issues by adding log lines without redeploymentGet granular insights into application behavior and service interactions while debugging by adding log statements without redeploying codeInstrument stack traces from within Datadog APM to collect detailed runtime context, including method parameters and local variables, in order to expedite resolution of issues as they occurCapture essential log information needed for the required level of detail and duration, while minimizing overhead and noise using conditional probesModify and enrich distributed traces for deeper analysis without changing codeIncrease the resolution of your APM traces at runtime by adding spans as needed, without affecting your original instrumentationAdd spans to troubleshoot slow requests and specific operations in your application without leaving the Datadog platformAttach request metadata as tags to your spans on the fly in order to filter, and group user request data and create custom dashboardsGenerate key metrics associated with your live code whenever neededAnalyze the real-world Impact of any method by using counts and histograms to visualize how frequently it has been executed over timeCreate metrics the fly that measure the time any method in your code is consuming in production, and use metric expressions to focus on specific requestsCapture a specific parameter value or performance metric for any specific method or block of code to measure the performance of your systemResourcesofficial docsDynamic InstrumentationBLOGUse Datadog Dynamic Ins