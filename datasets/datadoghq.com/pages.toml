title = "Certification | Datadog"
description = "Datadog の認定プログラムは、Datadog 製品のインストール、構成、使用について深く理解している個人を認定することを目的としています。"
full_description = "Datadog の基礎 (Datadog Fundamentals)Datadog の基礎(Datadog Fundamentals)は、Datadog が提供する基礎的な認定資格です。この試験では、プラットフォームを効果的に使用するために必要なコア知識がテストされます。基本的なコンピュータの基礎知識、Datadog によるインフラストラクチャーのデプロイ、ネットワーキングと Datadog Agent の構成、データ収集、Datadog Agent のトラブルシューティング、データの視覚化と活用などが含まれます。(日本語)View the exam guide Try Our Practice Exam ログ管理の基礎 (Log Management Fundamentals)Datadog のログ管理の基礎 (Log Management Fundamentals) は、Datadog によるログ取得とログ管理に関する基本的な知識をテストします。この試験では、Datadog によるログ取得の基礎、ログの収集、ログのパース、ログの検索とフィルター、ログの分析、ログの活用、ログのトラブルシューティングをカバーします。(英語)View the exam guide APM と分散型トレーシングの基礎 (APM and Distributed Tracing Fundamentals)Datadog の APM と分散型トレーシングの基礎 (APM and Distributed Tracing Fundamentals) は、APM 製品の基本的な知識をテストします。この試験では、APM の基礎、Datadog による アプリケーションインスツルメンテーション、Datadog APM によるインサイトの発見、インサイトの視覚化、APM を使用したアプリケーションのトラブルシューティングをカバーします。(英語)View the exam guide"
