revent leaks of sensitive data with built-in security and privacy scannersSafeguard your LLM applications from response manipulation attacksCommon QuestionsCan I use the product before I commit to it?Yes, LLM Observability is already available in your account and it is free to start using. We will reach out to you about pricing once your instrumented LLM apps start submitting meaningful number of LLM requests.How can I get started?You need to instrument your LLM application with an SDK for Python or submit spans via an API if your application is written in a different language. If you are using orchestration frameworks like LangChain and popular LLM providers like ChatGPT, the SDK will automatically capture traces. You can view the full list of auto-instrumentation here.Why is pricing custom?LLM Observability is a new product so we want to make sure the billing plans meet your needs which is why we are offering custom pricing only at this time. For a detailed explanation of billing, please reach out to your Customer Success Manager.Do I need to purchase other Datadog products to use LLM Observability?No, you can use LLM Observability without purchasing any other Datadog products. If you are already an APM customer or plan on using APM, however, LLM Observability integrates with APM such that you have better end-to-end visibility of your entire application. Generally, having all your monitoring and security alerts and insights in one place is something we encourage for comprehensive visibility.Cloud Security ManagementUnified view of infrastructure threats and findingsProStarting At$ 10Per host,per month*Continuous scanning across your entire cloud infrastructure with a combination of agent and agentless scanningCloud Security Posture Management (CSPM)Kubernetes Security Posture Management (KSPM)Built-in mapping of your resources to compliance frameworks to help with auditsVulnerability Management (VM) for Containers & HostsCloud Infrastructure Entitlement Management