title = "Data Streams Monitoring | Datadog"
description = "Easily map, monitor, and troubleshoot your streaming data pipelines with Datadog Data Streams Monitoring. Learn more."
full_description = "Datadog Data Streams Monitoring (DSM) enables you to easily track and improve the performance of event-driven applications that use Kafka and RabbitMQ. DSM automatically maps dependencies between all services and queues and provides out-of-the-box metrics that help you measure end-to-end latencies, locate faulty queues or services and their respective owners, and remediate floods of backed-up messages so that you can avoid critical downtime and meet strict SLAs.Detect slowdowns anywhere in your event-driven applicationsMeasure latency between any two points throughout your pipeline, including queues, producers, and consumersEasily identify delayed messages by viewing actionable lag metrics both in seconds and offsetQuickly detect abnormal latency or throughput across your streaming data pipelines by creating threshold, anomaly, and outlier monitorsLocalize and resolve pipeline bottlenecks and failuresEasily detect failing dependencies between queues, producers, and consumers with automatic, end-to-end pipeline topology mappingTriage whether delays are originating from issues with application services or queueing systems, and identify the owning teamPrioritize troubleshooting efforts by impact of delay, with message backup volumes for services and queuesRemediate floods of backed-up messagesQuickly detect and resolve downstream bottlenecks to prevent long lags, message downtime, and delayed messagesSpot where bursts in message flow may be occurring upstream with automated consumer lag notifications for every serviceVisually track the flow of messages across all dependent services and queues to ensure you constantly meet your SLAsCorrelate streaming data pipeline metrics with all telemetry in contextResolve application issues faster by seamlessly pivoting between DSM metrics, distributed traces, infrastructure metrics, and logsGain complete pipeline visibility by adding latency and throughput metrics to your Kafka or RabbitMQ integration dashboardsStreamline incident response with quick access to service owners, on-call engineers, and critical resources via Software Catalog Previous NextBuilding streaming data pipelines to power our digital trading platform requires visibility into throughput and latency across the entire system, including all queues and services. With Data Streams Monitoring our team is able to proactively discover performance bottlenecks and optimize stream processing to ensure maximum throughput and low latency delivery of data to our customers.Darren Furr Solutions Architect at MarketAxessDatadog Data Streams Monitoring allows us to easily map the topology of our Kafka pipelines across our globally-spread clusters, monitor end-to-end latency, and identify sources of incidents across our entire pipeline in one place. Having DSM integrate seamlessly with APM helps us ensure that millions of gamers around the world always get the best possible experience.SeungYong Oh VP of Engineering at DevsistersCustomer TestimonialsBuilding streaming data pipelines to power our digital trading platform requires visibility into throughput and latency across the entire system, including all queues and services. With Data Streams Monitoring our team is able to proactively discover performance bottlenecks and optimize stream processing to ensure maximum throughput and low latency delivery of data to our customers.Darren FurrSolutions Architect at MarketAxessDatadog Data Streams Monitoring allows us to easily map the topology of our Kafka pipelines across our globally-spread clusters, monitor end-to-end latency, and identify sources of incidents across our entire pipeline in one place. Having DSM integrate seamlessly with APM helps us ensure that millions of gamers around the world always get the best possible experience.SeungYong OhVP of Engineering at Devsisters:root{--callout-bg-gradient-dg:linear-gradient(to right, #4401B1, #8001FF)}:root{--callout-background-dg:none}2024 GARTNER® MAGIC QUADRANT™Datadog has been recognized as a Leader in the Gartner Magic Quadrant™ for Observability PlatformsGet the full reportResourcesofficial docsData Streams MonitoringBLOGTrack and improve the performance of streaming data pipelines with Datadog Data Streams MonitoringfeatureAPMBLOGMonitoring Kafka performance metricsmonitoring guideseries metricsBLOGLessons learned from running Kafka at Datadogbest practicesinfrastructure monitoringBLOGSimplify microservice governance with the Datadog Service Catalogfeatureservice catalogView All Related Resources:root{--callout-bg-gradient-pricing:linear-gradient(to right, #FF0080, #8000FF)}:root{--callout-background-pricing:none}Get started with Data Streams Monitoring today with a 14-day free-trial start free trialview pricing"
