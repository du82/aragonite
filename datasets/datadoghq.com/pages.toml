full_description = "Your trust is important to us, and we want to ensure that your personal information is protected. This Privacy Policy explains how we collect and use your personal information in relation to Datadog products, services, events, websites, and applications that link to this Policy (together, the “Datadog Products”). It also describes how you can control or exercise your rights related to your personal information. We process information about you while providing the Datadog Products. Below, we outline the kinds of information we collect. The security of your personal information is incredibly important to us. We have implemented and we continually maintain a variety of technical and organizational measures to protect your personal information from unauthorized access and against unlawful processing, accidental loss, destruction, and damage. View our Security page to learn more about the specific security controls we have put in place to safeguard your information. We only keep your personal information for as long as necessary to fulfill the purposes we collected it for, after which it will be deleted or archived unless we are required to keep it to comply with our legal obligations or for another legitimate and lawful purpose. To determine the appropriate retention period for personal information, we consider several factors, including: In some cases, we may anonymize your personal information so that you are no longer identifiable, in which case we may use the resulting information without further notice to you. The Datadog Products are not directed to individuals under the age of 16, and we do not knowingly collect or sell the personal information of children under 16. This section provides additional details about the personal information we process subject to the General Data Protection Regulation (GDPR) and UK GDPR. Unless otherwise stated in a supplemental notice, Datadog, Inc. is the data controller of your personal information. To exercise your rights, please complete our Data Subject Rights intake form or contact us as outlined in the “Contact Us” section below. Please note that we may ask you to provide us with additional information to confirm your identity."
