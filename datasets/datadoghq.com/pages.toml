["https://www.datadoghq.com/ja/product/cloud-security-management/cloud-security-posture-management"]
title = "Datadog クラウドセキュリティポスチャ管理 (CSPM) | Datadog"
description = "ObservabilityEnd-to-end, simplified visibility into your stack’s health & performance"
full_description = "Datadog Cloud Security Platformの一部であるDatadog クラウドセキュリティポスチャ管理 (CSPM) は、クラウドのアカウント、ホスト、コンテナ全体の構成チェックを行います。スキャンは継続的に行われ、すべてのリソースを調査し、Datadogのエグゼクティブレポートは、業界のベンチマーク基準への適合性を追跡するためのサマリーを提供します。CSPMは、統一されたDatadogエージェントとプラットフォーム全体のクラウド統合の上に構築されており、数分で開始できます。DevSecOpsの成熟度モデルブループリントを使用して、組織のDevSecOpsプラクティスを評価および推進。開始するターンキーの構成モニタリング直感的に操作できるセキュリティ対策ダッシュボードで、「私のポスチャースコアは？」や「私のスコアに影響を与える最も一般的な発見は何か？」などのもっとも重要な疑問に集中できます。業界ベンチマークおよびCIS、PCI DSS、SOC2などの他のコントロールの要件への適合性を追跡インフラストラクチャ全体のセキュリティポスチャスコアを確認し、各スコアを該当するベンチマークまたはフレームワークの基準までさかのぼって追跡 シンプルだが単純ではないポスチャー管理任意の時点での構成ステータスを可視化昨年の特定の日にS3バケットがどのように設定されていたかなど、難しい質問にも対応可能Datadog クラウドセキュリティポスチャ管理 (CSPM) を活用し、継続的なスキャンにより、一時的なものから長期的なものまで、すべてのリソースを追跡することで、完全なセキュリティポスチャーの背景を確認できます。 製品紹介: セキュリティモニタリングダイナミックなシステムにおける脅威の検知と対応製品概要を入手する迅速に開始し、効率的にスケーリングDatadogの統一されたエージェントとプラットフォーム全体のクラウド統合により、数分で開始できます。クラウドサービスプロバイダーのAPIコールレート制限に抵触するリスクを低減しながら、クラウド環境全体を調査できます既存の基盤技術を活用することで、運用効率の向上と総所有コストの削減を実現アラート疲れを防ぐDatadogの効率的、動的、かつ集約されたセキュリティポスチャー調査を使用して、コンプライアンス業務を拡張設定ミスや違反の可能性をオーダーメイドで表示し、適切なチームに適切なアラートを提供クラスタ、アカウント、またはサービスレベルでの設定に関するアラートを運用ユーザーに通知し、ビジネスユーザーには各チームのセキュリティ態勢について情報を提供追加のエージェントを必要とせずに、クラウドの構成監視やコンテナのセキュリティを実現できるツールはほとんどありません。しかし、当社のエンジニアリングチームはすでにDatadogを愛用していたため、CSPMを驚くほど短期間で導入することができただけでなく、エンジニアリングチームもすぐに導入し、その価値を実感することができました。Ben Collen Vertex 社 IT & Security ダイレクターCustomer Testimonials追加のエージェントを必要とせずに、クラウドの構成監視やコンテナのセキュリティを実現できるツールはほとんどありません。しかし、当社のエンジニアリングチームはすでにDatadogを愛用していたため、CSPMを驚くほど短期間で導入することができただけでなく、エンジニアリングチームもすぐに導入し、その価値を実感することができました。Ben CollenVertex 社 IT & Security ダイレクターリソースsolutionsCompliance for CIS BenchmarksBLOGIntroducing Datadog Cloud Security Posture ManagementfeaturesecurityBLOGIntegrate the AWS Well-Architected Tool with Datadog CSPMintegrationsecurityすべての関連資料を表示"
