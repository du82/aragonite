full_description = '''Get started on your App todayFollow these three steps to get started Icon/logs-2 Created with Sketch. Free TrialExplore the entire Datadog platform for 14 days.GET STARTED > Icon/logs-2 Created with Sketch. Demo SessionSign up for a live product demonstration.ATTEND DEMO > Icon/logs-2 Created with Sketch. Platform DatasheetLearn about Datadog features and capabilities.GET DATASHEET >Register for a demo session with a Datadog engineer×I'd like Datadog to share the latest news about Datadog services and related offerings with me by email or telephone. You may unsubscribe at any time by following the instructions in the communications received from Datadog. var trackerName = 'corpProd'; function observeFieldAddition(form) { const target = form.getFormElem()[0]; function callback(mutations) { mutations.forEach(mutation => { if (mutation.type === "childList" && mutation.addedNodes.length > 0 && !["LABEL", "BUTTON"].includes(mutation.target.tagName)) { mutation.addedNodes.forEach(node => { Array.from(node.querySelectorAll("[style]")).concat(node).forEach(el => { el.removeAttribute("style"); }) Array.from(node.querySelectorAll(".mktoFieldWrap")).forEach(field => { if (field.querySelector("label")) { let labelText = ''; if (field.querySelector("input")) { labelText = field.querySelector("input").getAttribute("placeholder"); if(!labelText.includes("*") && field.querySelector("input").classList.contains("mktoRequired")) { labelText+="*"; } } else if (field.querySelector("select")) { labelText = field.querySelector("select").getAttribute("name"); if(!labelText.includes("*") && field.querySelector("select").classList.contains("mktoRequired")) { labelText+="*"; } } field.querySelector("label").textContent = labelText; } }) }) } }); } const observer = new MutationObserver(callback); observer.observe(target, { childList: true, subtree: true }); } function replaceLabelWithPlaceholder(form) { const formEl = form.getFormElem()[0]; const mktoFieldWraps = Array.from(formEl.querySelectorAll('.mktoFieldWrap')); mktoFieldWraps.forEach(field => { if (field.querySelector("label")) { let labelText = ''; if (field.querySelector("input")) { labelText = field.querySelector("input").getAttribute("placeholder"); if(!labelText.includes("*") && field.querySelector("input").classList.contains("mktoRequired")) { labelText+="*"; } } else if (field.querySelector("select")) { labelText = field.querySelector("select").getAttribute("name"); if(!labelText.includes("*") && field.querySelector("select").classList.contains("mktoRequired")) { labelText+="*"; } } if (labelText.toLowerCase().includes("country")) { if (!field.querySelector("select").querySelector("option").textContent.toLowerCase().includes("select")) { labelText = field.querySelector("select").querySelector("option").textContent; } } field.querySelector("label").innerHTML = labelText; } }) } function replacePlaceholderWithLabel(form) { const formEl = form.getFormElem()[0]; const mktoFieldWraps = Array.from(formEl.querySelectorAll('.mktoFieldWrap')); mktoFieldWraps.forEach(field => { if (field.querySelector("label")) { const labelText = field.querySelector("label").innerText.replace("*", ""); field.querySelector("input") ? field.querySelector("input").setAttribute("placeholder", labelText) : null; field.querySelector("input") ? field.querySelector("label").innerText = "" : null; } }) } function destyleMktoForm(form) { const formEl = form.getFormElem()[0]; const styledEls = Array.from(formEl.querySelectorAll('[style]')).concat(formEl); styledEls.forEach(function (el) { el.removeAttribute('style'); }); const styleSheets = Array.from(document.styleSheets); styleSheets.forEach(function (ss) { if (formEl.contains(ss.ownerNode)) { ss.disabled = true; } }); } function addSpanToBtn(form) { const submitBtn = form.getFormElem().find('button[type=submit]'); const btnText = submitBtn.text(); submitBtn.html(`<span>${btnText}</span>`); } function isPersonalEmail(email) { const personalEmailDomains = ["@gmail.","@yahoo.","@hotmail.","@live.","@aol.","@outlook."]; let result = false; for (const domain of personalEmailDomains) { if (email.indexOf(domain) !== -1) { result = true; break; } } return result; } function isExcludedEmail(email) { const excludedEmailDomains = ["@docomo.ne.jp","@icloud.com","@ezweb.ne.jp","@i.softbank.jp","@hotmail.com","@au.com"]; let result = false; for (const domain of excludedEmailDomains) { if (email.indexOf(domain) !== -1) { result = true; break; } } return result; } MktoForms2.loadForm('//lp.datadoghq.com', '875-UVY-685', "2029", (form) => { const marketoForm = document.querySelector('#mktoForm_2029'); invokeCustomOnFormLoad(form); removeContentlessLegalLinks(); removeMktoStyleLoaded(); form.onSubmit(function() { var values = form.vals(); if (values.Email) { if (typeof analytics !== "undefined") { analytics.identify(values.Email, { email: values.Email }); } } const domainsToBlock = [ "shop.com", "fox.com", "fox.to", "ypf.com", "msm.com", "admin.com", "fh.com", "ypg.com", "fox.tl", "ropa.com", "mom.com" ]; if(values.Email) { if(window.location.pathname.includes('/es/dg/webinars') && domainsToBlock.includes(values.Email.split('@')[1])) { form.submittable(false); } } }) form.onSuccess((values, followUpUrl) => { if (window.ga) { ga( `${trackerName}.send`, 'event', 'Marketo', 'Form Submit', window.location.pathname ); } if (window.dataLayer) { let dataLayerPayload = { 'event': 'gtm.marketoFormSubmit', 'gtm.elementId' : "2029", 'formId': "2029", 'user_data': { 'address': { 'first_name': form.vals().FirstName ? form.vals().FirstName : '', 'last_name': form.vals().LastName ? form.vals().LastName : '', } } }; dataLayer.push(dataLayerPayload); } invokeCustomOnSuccess(); return false; }); function invokeCustomOnFormLoad(form) { } function invokeCustomOnSuccess() { modalHeaderDemoSignupCustom(true); } function headerEventV2Custom() { } function movePolicyText() { const mktoRows = marketoForm.querySelectorAll('.mktoFormRow'); const mktoButtonRow = marketoForm.querySelector('.mktoButtonRow'); const policyRow = mktoRows[mktoRows.length - 1]; mktoButtonRow.appendChild(policyRow); policyRow.classList.add('mt-2'); } function addTargetBlankAttributeToLegalLinks() { const privacyPageLink = document.querySelector('a[href="https://www.datadoghq.com/legal/privacy/"'); const cookiesPageLink = document.querySelector('a[href="https://www.datadoghq.com/legal/cookies/"'); if (privacyPageLink) { privacyPageLink.setAttribute('target', '_blank') } if (cookiesPageLink) { cookiesPageLink.setAttribute('target', '_blank') } } function removeContentlessLegalLinks() { const privacyLinks = document.querySelectorAll('a[href="https://www.datadoghq.com/legal/privacy/"'); const cookiesLinks = document.querySelectorAll('a[href="https://www.datadoghq.com/legal/cookies/"'); if (privacyLinks) { privacyLinks.forEach(link => { if (!link.textContent) { link.remove(); } }); } if (cookiesLinks) { cookiesLinks.forEach(link => { if (!link.textContent) { link.remove(); } }); } } function removeMktoStyleLoaded() { const targetDiv = document.querySelectorAll("#mktoStyleLoaded"); targetDiv.forEach((div) => { div.remove(); }) } function displayThankYouMessage(thankYouText) { const isMobile = window.innerWidth < 768; const thankYouMsgContainer = document.createElement('div'); thankYouMsgContainer.classList.add('w-100'); thankYouMsgContainer.innerHTML = thankYouText; marketoForm.classList.add('hidden'); marketoForm.classList.add('tw-hidden'); const signUpHeader = document.querySelector('#sign-up-header > h2'); if (signUpHeader) { signUpHeader.classList.add('d-none'); } marketoForm.parentNode.appendChild(thankYouMsgContainer); if (!isMobile && marketoForm.parentNode.closest('section')) { marketoForm.parentNode.closest('section').scrollIntoView(); } else if (isMobile) { marketoForm.parentNode.scrollIntoView(); } } function displayThankYouMessageTEM(thankYouText) { const formContainer = document.getElementById("main-form-container"); formContainer.innerHTML = thankYouText; formContainer.scrollIntoView(); } function displayThankYouMessageReinvent(thankYouText, index) { const formContainer = document.querySelector(`#main-form-container--${index}`); formContainer.innerHTML = thankYouText; formContainer.parentNode.closest('section').scrollIntoView(); } function updateAddToCalendar() { const addToCalendarCta = document.querySelector('.add-to-calendar'); addToCalendarCta.setAttribute('href', 'summit/london25/datadog-london-summit-2025.ics'); } function moveTosAfterButton() { if ("2029" === 3684 ) { const $formElm = form.getFormElem(); const tosText = $formElm.find('.mktoFormRow:nth-child(17)'); if (!tosText || tosText[0].innerText.indexOf('Privacy Policy') < 0) { return } let buttonRow = $formElm.find('button').closest('.mktoButtonRow'); buttonRow[0].parentNode.insertBefore(tosText[0], buttonRow[0].nextSibling); tosText[0].style.paddingTop = '20px'; } } function handleLegalCheckbox() { const legalCbxCopy = ""; const legalCbxParent = document.createElement("div"); const legalCbx = document.createElement("input"); const legalCbxLabel = document.createElement("label"); legalCbx.setAttribute("type", "checkbox"); legalCbxParent.classList.add("pt-2"); legalCbxParent.classList.add("d-flex"); legalCbx.setAttribute("id", "confirm-legal"); legalCbxLabel.style.marginTop = "-4px"; legalCbxLabel.style.marginLeft = "7px"; legalCbxLabel.innerText = `${legalCbxCopy}`; legalCbxParent.appendChild(legalCbx); legalCbxParent.appendChild(legalCbxLabel); marketoForm.appendChild(legalCbxParent); const legalCbxEl = document.getElementById("confirm-legal"); const submitButton = marketoForm.querySelector(".mktoButton"); submitButton.disabled = true; legalCbxEl.addEventListener('change', (event) => { submitButton.disabled = !event.target.checked; }) } function whitepaperCustom(onSuccess) { if(onSuccess) { if (window.ga) { ga( `${trackerName}.send`, 'event', 'Asset Download', 'Download', window.location.pathname ); } } else { moveTosAfterButton(); const button = form.getFormElem().find("button"); if (button && button[0].type === "submit") { button[0].dataset.eventCategory = 'Asset Download'; button[0].dataset.eventAction = "Downloaded"; button[0].dataset.eventLabel = ""; const formId = form.getId(); button[0].classList.add('js-gtm-trigger-click'); } } } function ebookCustom(onSuccess) { if(onSuccess) { const formElem = form.getFormElem(); const submitButton = formElem.find('button[type="submit"]'); submitButton.append('<img height="1" width="1" style="display:none;" alt="" src="https://px.ads.linkedin.com/collect/?pid=74631&conversionId=1516249&fmt=gif" />'); } else { const button = form.getFormElem().find("button"); if(button && button[0].type === "submit"){ button[0].classList.add('js-gtm-trigger-click'); } } } function eventCustom(onSuccess) { if(onSuccess) { form.getFormElem().hide(); const elemsToHide = document.querySelectorAll(".col-12 > h4"); if (elemsToHide.length !== 0) { elemsToHide.forEach((el) => el.style.display = 'none'); } } else { } } function eventSingleOneColumnCustom(onSuccess) { const calendarLink = document.querySelector('.js-add-calendar'); form.getFormElem().hide(); const elemsToHide = document.querySelectorAll(".col-12 > h4"); if (elemsToHide.length !== 0) { elemsToHide.forEach((el) => el.style.display = 'none'); } const calURL = ''; calendarLink.href = calURL; } function stickyEmailBannerCustom(onSuccess) { form.getFormElem().hide(); const formElements = document.querySelectorAll('#mktoForm_2029'); if (formElements.length !== 0) { formElements.forEach((formElement => { formElement.after('<p class="text-center fw-semibold text-white pt-2 pt-lg-0">Thank you! We will follow up with you soon.</p>'); })) } } function headerTextFormCustom(onSuccess) { let thank_you = ""; thank_you = "Thank you! We will follow up with you soon." form.getFormElem().hide(); const elementTarget = ".frame-wrapper"; const thankYouElement = document.createElement("div"); thankYouElement.innerHTML = thank_you; document.querySelector(elementTarget).append(thankYouElement); document.getElementById('confirmform') ? document.getElementById('confirmform').style.visibility = 'visible' : null; } function modalHeaderDemoSignupCustom(onSuccess) { form.getFormElem().hide(); document.querySelector('.js-modal-body').insertAdjacentHTML('beforeend','<h4 class="text-center">Thank you! We will follow up with you soon.</h4>'); const signupThankyou = !!document.getElementById("signup-override-inline-thankyou"); if(signupThankyou) { const thankYouPlaceholder = document.getElementById("signup-override-inline-thankyou"); const thankYouMsgContainer = document.createElement('div'); thankYouMsgContainer.classList.add('w-100'); thankYouMsgContainer.innerHTML = "Thank you! We will follow up with you soon."; thankYouPlaceholder.appendChild(thankYouMsgContainer) } } function specialEditionWebinarCustom(onSuccess) { let thank_you = "Thank you! We will follow up with you soon."; form.getFormElem().hide(); const elementTarget = `<div id="confirmform" style="padding:15px;margin: 0 auto;"><p>${thank_you}</p></div>`; elementTarget.append('.frame-wrapper'); document.getElementById('confirmform').style.visibility = 'visible'; window.scrollTo(0, 300); } function unsubscribeCustom(onSuccess) { if(onSuccess) { form.getFormElem().hide(); document.querySelector("h2").textContent = "Unsubscribe Successful"; document.getElementById('confirmform').style.visibility = 'visible'; } else { const e = sessionStorage.getItem('e'); if(typeof e !== 'undefined'){ document.querySelector("#Email").value = e; } document.querySelector("#mktoForm_1").style.display = "none"; } } function pricingCustom(onSuccess) { form.getFormElem().hide(); document.querySelector('.form-response').classList.remove('hidden'); } function partnerStartupSingleCustom(onSuccess) { const urlParams = new URLSearchParams(window.location.search); let code = ""; const burnerField3 = document.querySelector('input[name=burnerField3]'); if ( null && burnerField3) { code = "%!s(\u003cnil\u003e)" + `= ${ urlParams.get( null ) }`; burnerField3.value = code; } } function moveElementBefore(formID, targetSelector, referenceSelector, textReference) { const formEl = document.querySelector(`#mktoForm_${formID}`); const targetEl = formEl.querySelector(targetSelector); if (textReference && targetEl && targetEl.textContent.indexOf(textReference) !== -1) { formEl.insertBefore(targetEl.closest('.mktoFormRow'), formEl.querySelector(referenceSelector)); } else { throw new Error('Could not move target element.') } } }); Our Trusted Partners Marketplace ResourcesLearn how to launch on the Datadog Marketplace successfullyCase Study: Learn how RapDev was able to increase their exposure and accelerate revenue with the Datadog MarketplaceBlog: Our Marketplace LaunchDocumentation: Marketplace for Partners and DevsPortal: The Datadog Partner Network'''
