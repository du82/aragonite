title = "Datadog クラウド セキュリティ マネジメント | Datadog"
description = "Datadog クラウド セキュリティ マネジメントが、クラウドインフラストラクチャー全体においてリアルタイムの脅威検知と継続的なコンフィギュレーション監査をどのように実現しているかをご紹介します。"
full_description = "Datadog クラウド セキュリティ マネジメントはシームレスなコラボレーションと迅速な修復を実現する統一プラットフォームで、クラウドインフラ全体にわたり、これまでにない可視性、リアルタイムの脅威検出、継続的なコンフィギュレーションの監査機能を提供します。セキュリティチームと DevOps チームは、観測可能なデータとセキュリティリスクという共有コンテキストに基づいて行動し、脅威の影響を迅速に判断することができます。クラウドインフラストラクチャーに統合された視認性をクラウド環境をスキャンしてすべてのクラウドリソース間の関係をカタログ化し、完全なマップを取得インフラに対する最も重要な脅威を抽出し、トリアージを行った後、単一のビューから直ちに調査を開始リソース関係グラフとタグを使用して、特定のチームが所有するアセットを迅速にドリルダウンし、最も重要なクラウドアセットの修復を特定調査時のコラボレーションを効率化既存のワークフローに、堅牢なカスタム脅威検出およびインシデント対応プロセスをシームレスに実装。それと並行して効率的な DevOps の実装を維持1 回のクリックで、調査に不可欠なコンテキストを含むインシデントを自動的に宣言統合された Agent から収集した観測データを活用し、資産の正確な所有者、環境変数、攻撃フローを自動的に特定することで、修復までの時間を短縮 クイックにはじめて、効率的にスケールDatadog のすぐに使えるルールで、セキュリティの専門知識を必要とせず数分で開始可能同じ監視プラットフォームを利用することで、開発チームと運用チームのセキュリティワークフローを簡素化Datadog の 600 以上のネイティブインテグレーションによりシステムの運用効率を高め、総所有コストを削減クラウド セキュリティ マネジメントを使ってみた感想は、「エンジニアリングチームに情報セキュリティチームのメンバーが組み込まれている」といった感じでした。すべてのセキュリティ指標が画面の中央にわかりやすく表示されるため、設定ミスのあるリソースの数を一目で確認でき、情報セキュリティ担当者からの問題報告を待つ必要がありませんでした。Chad Upton Firstup 社インフラ担当 VPCustomer Testimonialsクラウド セキュリティ マネジメントを使ってみた感想は、「エンジニアリングチームに情報セキュリティチームのメンバーが組み込まれている」といった感じでした。すべてのセキュリティ指標が画面の中央にわかりやすく表示されるため、設定ミスのあるリソースの数を一目で確認でき、情報セキュリティ担当者からの問題報告を待つ必要がありませんでした。Chad UptonFirstup 社インフラ担当 VP"
