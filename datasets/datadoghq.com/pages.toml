full_description = "Datadog Audit Trailは、企業がDatadogプラットフォームを安全に導入し、コンプライアンスを維持し、ガバナンスを実施し、より高い透明性を構築できるよう支援します。すべてのシステムにおけるユーザーアクセスやプラットフォームの変更を完全に可視化し、コンテキストに富んだインサイトによってDevOpsチームやコンプライアンスチームを支援します。コンプライアンスへの対応を容易にプラットフォーム内の設定可能な資産、アクセス、課金資産に関するすべての監査イベントを自動的に取得し、レポート最大90日間の詳細な監査イベントを検索・分析し、簡単にアーカイブして長期保存が可能監査イベントデータをエクスポートし、HIPAA、PCI、SOX、GDPRなどの規制要件に対応した独自のレポートを構築可能 プラットフォームガバナンスを強化し、チーム内でのDatadog導入を容易に重要な資産に対する設定変更のモニタリングと修正資産の所有権とアクセスコントロールに関する死角をなくすチームがDatadogの機能の採用をカスタマイズしている間、一元的な可視性を維持製品概要: Logging without Limits™ログの収集、処理、アーカイブをコスト効率よく行えます。製品概要をダウンロードチーム間のサイロを解消GRC（ガバナンス・リスク・コンプライアンス）チーム、監査人、セキュリティチームとの連携と調査結果の共有詳細な監査イベントを使用して、コンテキストに富んだレポートとインサイトを生成変更頻度に応じたDatadogプラットフォーム構成の最適化 Datadog Audit Trailを使用することで、特定のアクセスキーにおける不審な行動を迅速に発見し、ロックダウンでき、機密情報がスタック全体で保護され、コンプライアンスとセキュリティの目標を達成できました。Doug Reading エンジニアリングマネージャー、オブザーバビリティ - ZendeskCustomer TestimonialsDatadog Audit Trailを使用することで、特定のアクセスキーにおける不審な行動を迅速に発見し、ロックダウンでき、機密情報がスタック全体で保護され、コンプライアンスとセキュリティの目標を達成できました。Doug Readingエンジニアリングマネージャー、オブザーバビリティ - ZendeskリソースBLOGBuild compliance, governance, and transparency across your teams with Datadog Audit Trailfeatureaudit trailBLOGBest practices for reducing sensitive data blindspots and riskbest practiceslog managementBLOGBuild a modern data compliance strategy with Datadog's Sensitive Data Scannerfeaturelog managementすべての関連資料を表示"
