title = "App Builder | Datadog"
description = "システムの利用状況を改善し、コラボレーションを促進するために構築されたカスタムアプリケーション。アクションにつながる可観測性のインサイトを提供します"
full_description = "Datadog App Builder は、セキュアな環境でカスタムアプリケーションを迅速に開発し、モニタリングスタックに統合するローコードソリューションを提供します。ひとつのビューで監視とアクションをまとめて実行できるほか、監視スタック内の管理画面で問題の修正や進行中のインシデントへの対応が可能です。ドラッグ＆ドロップで使えるシンプルなインターフェースには、事前に構築された UI コンポーネントとアクションを装備。エラーを削減し、IT 運用環境全体のコラボレーションを向上させるインパクトの大きいアプリケーションを迅速に立ち上げることができます。ビルド済みの UI コンポーネントとアクションを使用して、アプリケーションを迅速に開発フロントエンドのコード知識がなくても、本番運用に適した社内ツールを迅速に構築プリセットのブループリントライブラリを活用して、一般的なユースケースをすばやく解決ドラッグ＆ドロップでユーザーフレンドリーな UI コンポーネントを統合独自の JavaScript ロジックでアプリケーションをカスタマイズ 複雑なツールなしで生産性を向上メトリクス、ログ、モニターなど、Datadog のネイティブアクションを即座に活用すぐに使える550以上のアクションカタログとのインテグレーションHTTP リクエストを使用して、任意の Rest API と柔軟なインタラクションを実現クラウドとオンプレミスの両方のリソースと通信企業のモニタリングデータ、ツール開発、観測可能性対応のすべてを 1 か所に集約 誰でも迅速な対応・修復が可能セルフサービスアプリを活用し、問題がインシデントになる前にあらかじめ対処できる体制をサポート同じインターフェイス内ですべての問題をトラブルシューティングすることで時間を節約。コンテキストスイッチを最小限にDatadog Workflow Automation からワークフローをワンクリックでトリガーすることで、アプリケーションの機能を強化 エラーの削減とコントロールの維持きめ細かなロールベースのアクセス制御で、アプリの閲覧・編集権限を構成アプリの安全性、スケーリング、組織全体からのアクセスを容易に監査ログと使用状況の追跡を通じてすべてのアプリを可視化データとインサイト、アクションを一元化アプリの可用性をスケーリングし、組織全体におけるアクセシビリティを確保企業のモニタリング、ツール開発、観測可能性対応を統合環境全体でより強力な DevSecOps カルチャーを実現Datadog のダッシュボードにウィジェットとしてアプリを追加することで、既存のモニタリング設定にアプリを埋め込み Previous Next弊社は世界 4 大陸に社員を擁し、日々リモートワークを実践しています。App Builder のおかげで、世界中の社員が活発にアクションを起こせるようになりました。以前は特定のチームにチケットを作成していたものが、セルフサービスで簡単に処理できるように。追加でトレーニングが必要な新しいツールの導入も不要でした。ルーカス・ドイツ NationBuilder 社 システムエンジニアDatadog App Builder は、API コールで取得したデータからインタラクティブなコンポーネントを生成することで、ダッシュボード機能を強化してくれます。開発プラットフォームも豊富で、有用なブループリントや構成要素を備えているためすぐに使い始めることができます。インシデント対応の改善やデータの可視化などにおいても、App Builder は非常にありがたいツールです。ベンジャミン・ラッシュ PayByPhone Technologies, Inc. 社 サイト信頼性エンジニアApp Builder のおかげで、Datadog をまったく新しい形で活用できるようになりました。改善ステップをダッシュボードと連動させることができるので、同じエコシステムから問題を観察・修正できます。インフラストラクチャーの独自性に最適化したインターフェイスを構築できるため、プラットフォーム / 開発チームの両方にメリットがあります。BJ・クラーク Planning Center 社 プラットフォームエンジニアApp Builder によって、Datadog と当社の技術スタック間の相互運用性と可視性がさらに向上し、インフラストラクチャーへの直接アクセスや技術的知識を必要とせずに、重要な情報やプロセスへのアクセスが可能になりました。トーマス・ヤン Vital.io システムエンジニアCustomer Testimonials弊社は世界 4 大陸に社員を擁し、日々リモートワークを実践しています。App 