nagementSensitive Data ScannerAudit TrailObservability Pipelines This product is currently unavailable on the US-FED site.SecurityCloud Security ManagementApplication Security Management This product is currently unavailable on the US-FED site.Software Composition Analysis This product is currently unavailable on the US-FED site.Runtime Code Analysis (IAST) This product is currently unavailable on the US-FED site.Cloud SIEMDigital ExperienceError TrackingReal User Monitoring & Session ReplaySynthetic Testing & MonitoringSoftware DeliveryCI Pipeline Visibility This product is currently unavailable on the US-FED site.Continuous Testing This product is currently unavailable on the US-FED site.Test Optimization This product is currently unavailable on the US-FED site.Service ManagementApp Builder This product is currently unavailable on the US-FED site.Incident ResponseEvent Management This product is currently unavailable on the US-FED site.Workflow Automation This product is currently unavailable on the US-FED site.AI ObservabilityLLM Observability This product is currently unavailable on the US-FED site.CI Pipeline VisibilityMonitor the health and performance of your CI pipelinesStarting At$ 8Per committer,per month*Start Free TrialView data from multiple CI providers in a single placeVisualize performance across pipelines, stages, and jobsSurface recurring errors and the commits that caused them*Billed annually or $12 on-demandStart Free TrialFeaturesDiagnose the health & performance of your pipelinesMake data-driven decisions to optimize your CI/CDPipeline Visibility is currently compatible with GitLab, GitHub Actions, Jenkins, CircleCI, Buildkite, Codefresh, TeamCity, Azure DevOps, and AWS CodePipeline. Other providers and custom pipelines can be integrated via API. Out-of-the-box support for more CI providers is coming soon.Powerful out-of-the-box dashboards & integrationsAlert relevant teams about pipeline health and performanceWhen Combined with Other PlansAuto-instrument pipelines and tests to seamlessly pivot to related logs and errorsService and SupportTechnical support via Chat and Email, Community Forum, and Online DocsLearn more about our additional support plansCommon QuestionsHow do you define a committer?A committer means an active Git committer; they are identified through their Git author email address. A committer is counted towards billing if they commit at least 3 times in a given month.How do you define a committer in a pipeline not linked in a Git repository?In the event that a pipeline is not associated to a git repository, or git metadata is unavailable, the username of the person triggering the pipeline execution will be used as the billable committer.Can I purchase more than one software delivery plan for my team?Yes, customers can purchase a combination of software delivery plans. For example, for a team of 10, you can have 8 committers billed for Pipeline Visibility and 5 committers billed for Test Optimization.How do you define a span?Every pipeline, pipeline stage and pipeline job is considered a span in Pipeline Visibility.How many spans are allotted?400,000 spans per committer per month or 547.95 spans per committer per hour (both summed across all Pipeline Visibility committers). Additional pipeline spans can be purchased at $3 per million spans per month.What is the span retention period?Pipeline spans are retained for 15 months.Can I modify the span retention period?No, the span retention period cannot be modified.What CI providers does CI Visibility support?Pipeline Visibility is currently compatible with GitLab, GitHub Actions, Jenkins, CircleCI, Buildkite, Codefresh, TeamCity, Azure DevOps, and AWS CodePipeline. Support for more CI providers is coming soon.Continuous TestingFast, codeless, and reliable testing that helps you ship features with confidenceAPI TestingStarting At$ 5Per 10K test runs, per month*Test API endpoints and workflowsEasily configure and run single or multistep API testsGlobally managed locations*Billed annually or $7.20 on-demandStart Free TrialBrowser TestingStarting At$ 12Per thousand test runs,per month*Provide the best end-user experiencesRecord tests without codeIntelligent, self-healing testsStep-by-step screenshots and error reportingGlobally managed locations*Billed annually or $18 on-demandStart Free TrialMobile App TestingStarting At$ 50Per hundred test runs,per month*Proactively monitor your key business flows using real devicesRecord tests without codeRun tests on real Android and iOS devicesIntelligent, self-maintaining tasksView screenshots and front-end errors for every step*Billed annually or $72 on-demandStart Free TrialContinuous Testing (add-on)Starting At$ 79Per additional parallelization,per month*Increase the speed of your test runs in the CIRun multiple tests at the same time across your test environments to expedite release cycles and reduce test durationsAnalyze tests across your pipelines in the Synthetic Monitoring & Continuous Testing Explorer and search using facets on test durations, commit author, pipeline, and more*Billed annually or $114 on-demandStart Free TrialMulti-Year/Volume discounts availableContact UsFeaturesWhen Combined with Other PlansFull stack visibility with APM integrationPivot to related metrics, traces, and logsService and SupportTechnical support across chat and emailCommunity Forum and Online DocsPlans with the right level of support for your organizationCommon QuestionsWhat is Continuous Testing?Datadog Continuous Testing is a comprehensive toolkit in the development cycle that offers integration and end-to-end testing with codeless test setup, self-healing capability, and seamless integration with CI providers (GitHub Actions, Azure DevOps, CircleCI, GitLab, and Jenkins) and collaboration tools to help you ship high-quality features to your users quickly.Running tests in your CI/CD pipelines today is included with your API and Browser Testing test runs, and tests will run sequentially (one after another). If you would like to increase the speed of testing in your CI/CD pipelines, you can purchase additional Parallel Testing speed (parallelization), which makes some tests run at the same time.For example, 1 Parallel Testing additional speed offers an additional parallel slot, allowing you to run 2 tests in parallel; 2 Parallel Testing additional speed offers 2 additional parallel slots, allowing you to run 3 tests in parallel; and so on. This helps you run more tests in parallel (at the same time), and reduce the overall execution speed of your test suite.Am I limited to a certain number of test runs based on my additional parallelization?No. With Parallel Testing, you can run as many tests as you need in your CI/CD pipelines. Parallelization ensures you can run more of those tests at the same time, and ultimately reduce the duration of testing in your CI/CD pipelines.For example, if you want to run 100 tests in a CI pipeline and each test takes 10 seconds to run:WITHOUT parallelization, your tests will run sequentially and your pipeline will take roughly 17 minutes to complete.WITH parallelization, if you purchase (for example) an additional speed of 4 Parallel Testing, your 100 tests will run over a total of 5 parallel slots, and your pipeline will now take roughly 3 minutes to complete.Note: In both cases, your 100 test runs will contribute to your API or Browser Testing test run quotas.Can I reuse my Synthetic tests that I use to monitor my production environments?Yes. With Parallel Testing, you can use the same Synthetic tests you have configured for production monitoring across all of your staging, QA, and pre-production environments. Through variable overrides and custom configuration values, you can benefit from one test throughout your entire software development lifecycle.What are parallel tests?Parallel tests are tests that run simultaneously in your continuous integration and delivery pipelines to ensure that you can:Reduce pipeline duration and ship new features fasterIncrease development confidence and speed of deliveryHave complete test coverage and reduce the volume of production-breaking bugs from reaching your codebaseAs an example, if you needed to run 60 tests and each test took one minute to run, it would take you one hour to run those tests sequentially. However, running those tests in parallel with a parallelization value of 60, you could run all your tests at the same time and within one minute, saving you 59 minutes to tackle other business-critical tasks. That's the power of Parallel Testing.Can I see the full trace of a test if I also use Datadog APM?Yes! If you instrument your services with APM, you will have a complete 360-degree visibility into your applications and services—from your frontend user experience right through to your backend trace. Find more information here.What counts as a browser test run?Each simulation of a web transaction (up to 25 steps) counts as a single browser test run. A single test containing 50 steps would count as two test runs on each execution. For example, running a 60-step test (three test runs) every 15 minutes from five different locations and two different devices equates to 120 test runs in one hour.How do subtests count toward billing?Subtests are simply a set of steps within a browser test. Therefore, we count a subtest as part of the overall browser test execution. For example, if you set up a browser test with only three subtests and each subtest had five steps, that would amount to a total of 15 steps, or one browser test run.Test OptimizationMonitor, debug, and accelerate every test suite across your entire CI environmentStarting At$ 20Per committer,per month*Start Free TrialDetect tests that fail or slow down your CI pipelinesCatch and prevent flaky tests from being mergedLower CI costs through improved testing efficiencyImprove testing quality and developer productivity*Billed annually or $29 on-demandStart Free TrialFeaturesAutomatic detection of flaky tests and performance regressionsFlaky test full lifecycle managementTest Impact Analysis that skips tests irrelevant to a code changeGranular visibility into test performance with distributed tracing and stack tracesCommon QuestionsHow do you define a committer?A committer means an active Git committer; they are identified through their Git author email address. A committer is counted towards billing if they commit at least 3 times in a given month.Can I purchase more than one software delivery plan for my team?Yes, customers can purchase a combination of software delivery plans. For example, for a team of 10, you can have 10 committers billed for CI Visibility and 5 committers billed for Test Optimization.How do you define a span?Every individual test run is considered a span in Test Optimization.How many spans are allotted?1,000,000 spans per committer per month or 1,370 spans per committer per hour (both summed across all Test Optimization committers). Additional test spans can be purchased at $3 per million spans per month.What is the span retention period?Test spans are retained for 3 months.Can I modify the span retention period?No, the span retention period cannot be modified.What CI providers does Test Optimization support?Test Optimization is compatible with any CI provider(not limited to those supported by CI Visibility).What languages does Test Optimization support for tests?Test Optimization directly supports .NET, Java, JavaScript, Python, Swift, and Ruby. Other languages and test frameworks are supported by using JUnit xml.How does Test Impact Analysis identify which tests to skip?Datadog automatically collects which files are covered by any given test. Based on the files that have been modified in any given code commit, we skip all irrelevant tests. Learn more.App BuilderCustom apps that integrate in your monitoring stack to accelerate remediation tasks and reduce errorsGet in touchCustom Quoterequest a quoteBuild apps using a low code drag-and-drop interface with blueprints and over 550+ out-of-the box actions to handle complex tasks and take action without having to leave Datadogrequest a quoteMulti-Year/Volume discounts availableContact UsFeaturesQuickly build production ready internal ops tools without front end code knowledgeDrag and drop 14+ UI components and customize your logic using custom JavaScript code.Integrate with a catalog of 550+ out-of-the-box action integration. Maintain the flexibility to interact with any rest API using HTTP requests. Ability to communicate with both cloud and on-prem resourcesGet value instantly with a library of pre-configured blueprints solving common use cases in DevOps, security, software delivery, project management and moreConsolidate all your company’s monitoring data, tool development, and observability response in one placeEmpower teams with self-serve apps so they can proactively take action before issues ariseSave time with minimized context switching by troubleshooting al"
