["https://www.datadoghq.com/privacy"]
title = "Privacy at Datadog | Datadog"
description = "See metrics from all of your apps, tools & services in one place with Datadog's cloud monitoring as a service solution. Try it for free."
full_description = "Privacy at DatadogDatadog takes great pride in our respect for customer and employee privacy and has a team dedicated to ensuring that the company meets its global privacy requirements and protects the privacy of individuals, customers, applicants, and employees. Datadog takes great pride in our respect for customer and employee privacy and has a team dedicated to ensuring that the company meets its global privacy requirements and protects the privacy of individuals, customers, applicants, and employees. We believe that our customer’s trust in us is best solidified by utmost transparency. From our data handling practices to our policies and procedures, Datadog knows the strongest customer relationships are built upon honesty and visibility. We are equally committed to the privacy of our employees, and promote transparency about how employee data is managed. Datadog doesn’t just think of customer privacy once something goes wrong. Privacy is embedded into our products, with direct impact into how features are engineered and implemented. At Datadog we know our customers do business all over the world. Our Privacy Team is trained on data protection laws and regulations spanning the globe. We translate those requirements into measurable controls in order to ensure compliance. You manage the quantity and types of data that is sent to Datadog through your use and configuration of the Datadog Agent, APIs, and integrations. These APIs, agents, and integrations may be made available by Datadog or your component providers, or they may be built by your own teams. Those made available by Datadog are primarily open source and subject to one of several open source licenses. As open source tools, their code can be independently vetted by you for copyright, errors, and malicious code. Datadog provides you with a single pane of glass to enable effective analysis of the operations of your infrastructure and applications. In addition to the basic business information provided to use our services, such as name and email address, Datadog will collect data needed to provide the product we offer. For customers sharing more sensitive information, including personal data, additional contractual obligations may be required to meet regulatory requirements. We provide Service-Specific and Other Supplemental Terms, a data processing addendum (DPA), or a Business Associate Agreement (BAA), depending on the type of data that will be shared."
