full_description = "Please note that this document is for informational purposes only, and that Datadog customers are responsible for making their own independent assessment of the information presented below. All of Datadog’s obligations and liabilities to our customers are outlined in our agreements, and this document does not form part of, or modify, any agreement between Datadog and our customers. Datadog is a subscription-based, multi-tenant, third-party cloud-hosted, web-based, software as a service (SaaS) platform. Our services enable our customers’ collection, monitoring, management and analysis of data generated by their IT systems, platforms, services, applications, software, devices, sites and/or networks in order to gain real-time visibility into the operation of the information technology supporting their businesses. Subscription-Based: Although you can purchase our services through the platform on a pay-as-you-go basis, most of our customers purchase annual access subscriptions to our platform. Subscriptions are commitments by both parties to maintain the relationship through the full term of the applicable order and cannot be terminated for convenience mid-term. Multi-Tenant: This means that a single instance of the software and support infrastructure serves multiple customers. While each customer’s data is isolated and remains invisible to other customers, the Datadog infrastructure (including the security controls) and services are the same for all of our customers and cannot be customized on an individual customer-by-customer basis. Third-Party Cloud Hosted: This means we use third-party cloud service providers such as AWS, GCP and Azure to host our platform so we can provide high-availability, enterprise-grade services to our customers. We also engage other third parties to assist us in providing our platform and support to our customers. A full list of our third-party providers that process customer data is available here. Web-Based: This means that you do not store our application on your on-prem servers, but rather access them through the web."
