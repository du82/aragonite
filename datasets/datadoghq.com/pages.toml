title = "Join Us in New York City for DASH 2025 | Datadog"
description = "See what we have planned for this year's DASH, taking place June 9, 10, and 11 in New York City."
full_description = "Join us in New York City for DASH 2025A new day for workshops and the Partner SummitKeynote and sessionsHands-on learning workshops and expo hallGet Datadog CertifiedJoin usFurther ReadingDatadog Platform DatasheetLearn about the key components, capabilities, and features of the Datadog platform.Download to learn moreevent / dashDASH is our biggest event of the year, where you can hear our latest product announcements, join expert-led sessions, participate in hands-on experiences, level up with a certification, and network with thousands of Datadog users.Now, we’re excited to announce DASH 2025 will be back in New York City at the Javits Center (North Javits) on June 9, 10, and 11 for three days of learning and community. Register before March 31 to lock in super early bird pricing.In this post, we’ll offer a brief look into the events and sessions you can expect, and we’ll highlight what’s new for DASH 2025.A new day for workshops and the Partner SummitFor the first time, DASH will have a pre-day on June 9 dedicated to additional workshops and our Partner Summit. The Datadog Partner Network (DPN) is thrilled to be hosting Partner Summit one day early this year, offering an opportunity to come together with fellow partners and gain insights into the latest trends and developments within the Datadog partner ecosystem. Our packed day will include a partner keynote, our Voice of the Partner, Partner Awards, and a networking reception.Also included in our first pre-day will be a selection of workshops—allowing you to maximize the subsequent sessions you want to attend. Additionally, anyone attending the conference can stop by to pick up their badge so that you can skip the registration line before the keynote on June 10.Keynote and sessionsOur keynote presentation on the morning of June 10 will highlight Datadog’s product updates and latest releases. Join Datadog executives, product leaders, and customers as they showcase new ways to build and scale the next generation of applications, infrastructure, security, and teams.After the keynote, we’ll have over 80 sessions at DASH from customers like Redfin, Toyota, and Volkswagen, as well as from Datadog product managers, engineers, and leaders. Throughout DASH, you’ll be able to join our breakout sessions and expo theaters to learn more about Datadog products and hear how our customers are tackling complex technical challenges and creating innovative solutions.Hands-on learning workshops and expo hallThis year we’ll be offering workshops across all three days, with over 20 topics to choose from. Workshops will run from Monday (June 9) through Wednesday (June 11) afternoon, covering a range of topics such as cloud platforms, Kubernetes, LLM observability, OpenTelemetry, and more. Each workshop features 2–3 hours of instruction and a dedicated learning environment—including the Datadog app, cloud resources, and applications—to put your newly gained knowledge into action. Workshop registration will launch in the coming weeks, but you’ll need to be registered for DASH to sign up for workshops.DASH is the largest gathering of Datadog users and the best opportunity to network and learn from our community—through a range of different activities. In addition to workshops, we’ll have other hands-on activities in our expo hall, where you can earn prizes and compete in gamified experiences such as CoTerm Battle and AWS Gameday. Our expo hall will also feature two theaters where you can hear updates on Datadog products and from our partners, and check out all of the exhibitors. Stop by the Datadog Hub on Tuesday or Wednesday to get a demo and some swag.Get Datadog CertifiedDASH is the only event where you can take a Datadog certification exam in person, and it’s included in the price of your ticket. We will offer Datadog Fundamentals, APM, and Log Management exams in English as well as other supported languages.Sessions will be available throughout June 10 and 11, but seating is limited. You can prepare now by learning from our free, self-paced courses at the Datadog Learning Center and by taking a practice exam. Check out our certification blog for more information on becoming Datadog Certified.Join usAs in years past, there will be a lot going on at DASH 2025, and we’re excited for you to come experience it all with us. Super early bird pricing ends soon, so register today. And if you’re new to Datadog, get a head start on learning with a 14-day free trial.Want to work with us? We're hiring!"
