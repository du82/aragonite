["https://www.datadoghq.com/ja/product/apm"]
title = "Application Performance Monitoring (APM) | Datadog"
description = "クラウド規模の Application Performance Monitoring (APM) により、サービスの健全性メトリクス、分散型トレース、コードパフォーマンスを簡単に監視できます。詳細はこちら。"
full_description = "Datadog Application Performance Monitoring (APM) は、ブラウザやモバイルアプリケーションからバックエンドサービスやデータベースまで、AI を活用したコードレベルの分散型トレーシングを提供します。トレースとログ、メトリクス、リアルユーザーモニタリング (RUM) データ、セキュリティシグナル、その他のテレメトリーをシームレスに相関させることで、根本原因の検出と解決を迅速化し、アプリケーションパフォーマンスとセキュリティ体制を改善し、リソース消費を最適化し、より効果的なコラボレーションを実現して、最高のユーザーエクスペリエンスを提供することが可能になります。2023 年 GARTNER® MAGIC QUADRANTTMDatadog は、Gartner® Magic QuadrantTM の APM および可観測性部門でリーダーに認定されましたレポートを読むスレッドレベルの分散型トレーシングで問題の原因を特定トレースとログ、インフラストラクチャーメトリクス、データベースクエリ、ネットワークコール、フロントエンドテレメトリーとの相関付けにより、根本原因を一か所で迅速に特定各メソッド、コード行、スレッドの実行時間とリソース消費を可視化することで、コードのパフォーマンスを改善アクティブなインシデントを迅速に解決し、トレースクエリを使用して上流および下流のサービスやデータベースへの影響を分析任意のタグを使用してスパンベースのメトリクスからダッシュボード、モニター、SLO を作成することで、ビジネス固有の KPI を追跡してアラートコンテキスト内のすべてのテレメトリーでサービスパフォーマンスを改善インフラストラクチャーやデータベースからのテレメトリーとともに、健全性メトリクスと依存関係を一元的に表示することで、サービスの問題の原因を迅速に検出Datadog UI、Terraform プロバイダー、API を介して SLO、モニター、Synthetic テストを設定することで、アプリケーションの信頼性をプロアクティブに改善サービスカタログでサービスオーナー、オンコールエンジニア、ランブックなどに素早くアクセスして、インシデントを効率的に修復本番環境内の脅威やコードの脆弱性を特定することで、クラウドアプリケーションを保護し、侵害に至る前に緩和 すべてのデプロイを自動的に追跡し、自信を持ってリリースリリース前、リリース中、リリース後のパフォーマンスの変化を追跡することで、カナリア、ブルーグリーン、その他のデプロイ戦略を採用コードバージョンごとに健全性メトリクスを自動的に集計することで、リリースが高いエラーレートやレイテンシーを引き起こしているかどうかを迅速に判断インフラストラクチャーとコードのパフォーマンスに対する最近のバージョンの影響を比較することで、パフォーマンスの低下を解決エラーを管理可能な問題群に自動的にグループ化する Error Tracking により、新規および進行中の問題の優先順位を決定 ウェビナー: Application Performance Monitoring複雑なクラウド規模のアプリケーションのパフォーマンス問題を簡単に検出、トラブルシューティング、最適化オンデマンドで視聴Watchdog AI でインシデントを迅速に解決自動化された根本原因分析により MTTR を改善し、対象となるサービス、ユーザー、ビューへの影響を最小限に抑制自動化およびカスタマイズ可能な ML ベースのアラートで異常値や外れ値を検出し、パフォーマンスメトリクスの将来の変化を予測することで、MTTD を削減エラーやレイテンシーの外れ値をクエリ時に表示し、ノイズの中からシグナルを見つけることで、調査を迅速化不良デプロイの自動検出により、ダウンタイムとエンドユーザーへの悪影響を最小限に抑制本番環境におけるオープンソースの脆弱性検出により、セキュリティリスクを低減サービス全体の健全性を監視しながら、本番環境にロードされた脆弱なオープンソースライブラリを検出Datadog の重大度スコア (脆弱性の露出、CVSS、ライブの脅威アクティビティを考慮) を使用して、脆弱性の優先順位を決定脆弱性の修復が本番環境に確実に導入されるようにすることで、本番前のコードと本番環境のコードの不一致を回避 Previous Next最初の 30～45 日間で、パフォーマンス上の問題がある上位 5 つのエンドポイントを迅速に特定し、応答時間を 80～90％ 短縮することができました。ヨニー・フェン Peloton、最高技術責任者兼共同設立者Datadog のトレース機能は、次世代の可観測性ツールです。大量のサービスにコンテキスト情報を提供し、分析とトラブルシューティングのために個々のリクエストに接続します。アナトリー・ミハイロフ Zendesk、スタッフパフォーマンスエンジニアDatadog 分散トレースの堅牢性と応答性、そしてトレースの視覚化方法の独自性により、問題を迅速に発見し、その芽を摘むことが非常に容易になりました。イアン・シェル Cvent、サイトリライアビリティアーキテクトDatadog の APM によって、当社の開発者は、iOS と Android のクライアントから、彼らが構築したサービスまでのパス全体を見ることができます。クリス・ペラザ whatnot、クラウドエンジニアチームが大きくなるにつれ、私たちが最も懸念していたのは、問題を診断する時間でした。APM は、トラブルシューティングという点で、私たちにとってまさにゲームチェンジャーです。ポール・ヒンツェ HashiCorp、インフラストラクチャーディレクター何十億通ものメールやプッシュ通知のパフォーマンス問題をデバッグする際には、すべてのライブトレースデータにアクセスする必要があります。Datadog のトレースツールは、トラブルシューティングに非常に役立っています。ザック・マコーミック Braze、エンジニアリングマネージャーCustomer Testimonials最初の 30～45 日間で、パフォーマンス上の問題がある上位 5 つのエンドポイントを迅速に特定し、応答時間を 80～90％ 短縮することができました。ヨニー・フェンPeloton、最高技術責任者兼共同設立者Datadog のトレース機能は、次世代の可観測性ツールです。大量のサービスにコンテキスト情報を提供し、分析とトラブルシューティングのために個々のリクエストに接続します。アナトリー・ミハイロフZendesk、スタッフパフォーマンスエンジニアDatadog 分散トレースの堅牢性と応答性、そしてトレースの視覚化方法の独自性により、問題を迅速に発見し、その芽を摘むことが非常に容易になりました。イアン・シェルCvent、サイトリライアビリティアーキテクトDatadog の APM によって、当社の開発者は、iOS と Android のクライアントから、彼らが構築したサービスまでのパス全体を見ることができます。クリス・ペラザwhatnot、クラウドエンジニアチームが大きくなるにつれ、私たちが最も懸念していたのは、問題を診断する時間でした。APM は、トラブルシューティングという点で、私たちにとってまさにゲームチェンジャーです。ポール・ヒンツェHashiCorp、インフラストラクチャーディレクター何十億通ものメールやプッシュ通知のパフォーマンス問題をデバッグする際には、すべてのライブトレースデータにアクセスする必要があります。Datadog のトレースツールは、トラブルシューティングに非常に役立っています。ザック・マコーミックBraze、エンジニアリングマネージャーリソースofficial docsGetting started with Datadog APMBLOGDatadog Distributed Tracing: live-query all ingested traces, retain only the ones you needfeatureAPMBLOGSimplify microservice governance with the Datadog Service Catalogfeatureservice catalogBLOGAutomated root cause analysis with Watchdog RCAfeaturewatchdogBLOGExplore a centralized view into service telemetry, Error Tracking, SLOs, and morefeatureAPMすべての関連資料を表示"
