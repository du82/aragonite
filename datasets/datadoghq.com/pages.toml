["https://www.datadoghq.com/legal/data-processing-addendum"]
title = "Data Processing Addendum | Datadog"
description = "See metrics from all of your apps, tools & services in one place with Datadog's cloud monitoring as a service solution. Try it for free."
full_description = "This Data Processing Addendum with its appendices (together, this “DPA”) is incorporated into the Subscription Agreement (or other electronic or mutually executed written agreement) between Datadog and Customer that references it (the “Agreement”). This DPA is effective as of the effective date of the Agreement. This DPA remains in effect until the later of (a) the expiration or termination of the Agreement, and (b) the return or deletion of Customer Personal Data in accordance with Section 6. Datadog will implement and maintain the technical and organizational measures to protect Customer Personal Data against accidental or unlawful destruction, loss, alteration, and unauthorized disclosure or access, as described in Appendix B (the “Technical and Organizational Measures”). Datadog will take appropriate steps to ensure compliance with the Technical and Organizational Measures by its employees, agents, contractors, and Subprocessors to the extent applicable to their scope of performance, including ensuring that all persons authorized to Process Customer Personal Data have agreed to appropriate confidentiality obligations. If Datadog receives a Data Subject Request, Datadog will (a) advise the Data Subject to submit the request to Customer directly, and (b) promptly notify Customer of the request. Where required by Data Protection Laws, Datadog will, on Customer’s request and taking into account the nature of Customer Personal Data Processed, provide reasonable assistance to Customer in fulfilling the Data Subject Request to the extent Customer is unable through its use of the Services to address a particular Data Subject Request on its own. To the extent permitted by Applicable Law, Customer will be responsible for any costs arising from Datadog’s assistance. Commencing 30 days after the effective date of termination of the Agreement, Datadog will initiate a process on Customer’s written request that deletes Customer Personal Data retained in production within 90 days and in backups within 180 days. Any Customer Personal Data archived in backups will be isolated and protected from any further Processing, except as otherwise required by Applicable Laws. Notwithstanding the foregoing, to the extent Datadog is required by Applicable Laws to retain some or all Customer Personal Data, Datadog will not be obligated to delete the retained Customer Personal Data, and this DPA will continue to apply to the retained Customer Personal Data.Customer acknowledges that it is responsible for exporting any Customer Personal Data that Customer wants to retain prior to expiration of the 30-day period referenced in this Section 6 pursuant to the Agreement."
