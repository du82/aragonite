["https://www.datadoghq.com/product/apm"]
title = "Application Performance Monitoring (APM) | Datadog"
description = "Easily monitor service health metrics, distributed traces, and code performance with cloud-scale Application Performance Monitoring (APM). Learn more."
full_description = "Datadog Application Performance Monitoring (APM) provides AI-powered code-level distributed tracing from browser and mobile applications to backend services and databases. By seamlessly correlating traces with logs, metrics, real user monitoring (RUM) data, security signals, and other telemetry, Datadog APM enables you to detect and resolve root causes faster, improve application performance and security posture, optimize resource consumption, and collaborate more effectively to deliver the best user experience possible.Pinpoint the source of issues with thread-level distributed tracingIdentify root causes quickly by correlating traces with logs, infrastructure metrics, database queries, network calls, and frontend telemetry—all in one viewImprove code performance with visibility into the execution time and resource consumption of every method, code line, and threadResolve active incidents faster and analyze their impact on upstream and downstream services and databases with trace queriesTrack and alert on business-specific KPIs by creating dashboards, monitors, and SLOs from span-based metrics using any tagImprove service performance with all telemetry in contextDetect the source of service issues rapidly with a centralized view of health metrics and dependencies alongside telemetry from your infrastructure and databasesProactively improve application reliability by setting up SLOs, monitors, and synthetic tests via the Datadog UI, Terraform provider, and APIsRemediate incidents efficiently with quick access to service owners, on-call engineers, runbooks, and more in Software CatalogSecure your cloud applications by identifying threats and code vulnerabilities that are live in production so you can mitigate them before they become breaches Track every deployment automatically and ship with confidenceAdopt canary, blue-green, or any other deployment strategy by tracking performance changes before, during, and after the releaseQuickly determine if a release is causing high error rates or latency by automatically aggregating health metrics by code versionResolve performance degradations by comparing the impact of recent versions on infrastructure and code performancePrioritize new and ongoing issues with Error Tracking, which automatically groups errors into a manageable set of issues Resolve incidents faster with Watchdog AIImprove MTTR with automated root cause analysis and minimize the impact on affected services, users, and viewsReduce MTTD with automatic and customizable ML-based alerts to detect anomalies and outliers and predict future changes in performance metricsAccelerate investigations with error and latency outliers, which are surfaced at query time to help you find the signal in the noiseMinimize downtime and negative impact on end users with automatic faulty deployment detectionReduce security risk with open source vulnerability detection in productionSurface vulnerable open source libraries loaded in production as you monitor the overall health of your servicesPrioritize vulnerabilities with the Datadog Severity Score, which factors in vulnerability exposure, CVSS, and live threat activityAvoid discrepancies between pre-production and production code by ensuring remediated vulnerabilities make it to production Previous NextWithin the first 30 to 45 days, we were able to quickly identify the top five endpoints that had performance issues and reduce response times by 80 to 90%.Yony Feng Cto & Co-founder, PelotonDatadog’s Traces functionality is a next generation observability tool. It brings contextual information for high-volume services, and connects it to an individual request for analysis and troubleshooting.ANATOLY MIKHAYLOV STAFF PERFORMANCE ENGINEER, ZENDESKThe robustness and responsiveness of Datadog Distributed Tracing, as well as the unique way in which traces are visualized, makes it very easy to spot problems quickly and nip them in the bud.IAN SCHELL SITE RELIABILITY ARCHITECT, CVEN