title = "Unraveling a Postgres Segfault That Uncovered an Arm64 JIT Compiler Bug | Datadog"
description = "ObservabilityEnd-to-end, simplified visibility into your stack’s health & performance"
full_description = '''Unraveling a Postgres segfault that uncovered an Arm64 JIT compiler bugIsolating the issueA crash course on JIT in PostgresTesting on a Postgres debug buildSpotting an infinite loop in Arm64 assemblyFinding the Postgres code that generated the assemblyAn Arm implementation of a switch statementA wild LLVM assertion appearsJIT section allocations vs. Arm64 ABI requirementsInvestigation summaryThe resolution: A fix released in upstream PostgresFurther ReadingDatadog Platform DatasheetLearn about the key components, capabilities, and features of the Datadog platform.Download to learn moreengineering / postgresql / armHere’s an error that no developer wants to see in their Postgres server logs: server process was terminated by signal 11: Segmentation fault. When our team was paged about one of our Postgres clusters crashing with this error, we were quite surprised, and quickly activated our incident response. The failing cluster was a new workload freshly deployed on our reliable internal Postgres-on-Kubernetes platform. What could possibly be causing this new and scary failure mode? Why was Postgres crashing with segmentation faults?The problem was manifesting on multiple EC2 nodes, so we quickly ruled out hardware issues. We had core dumps from the crashes that appeared corrupted but provided little hint as to why. Looking more broadly, we correlated our query logs and pinpointed a query pattern that was occurring right before each crash. Following this lead, we jumped into a psql terminal to test the suspicious query and indeed found that running it triggered a segfault. We were taken aback to discover that we had a Postgres cluster—up to date with the latest minor version—that was crashing after running an innocuous-looking “query of death”!Ultimately, by successfully isolating and debugging the crashes down to the assembly level, we were able to identify an issue in Postgres JIT compilation, and more specifically a bug in LLVM for Arm64 architectures. This post describes our investigation into the root cause of these crashes, which took us on a deep dive into JIT compilation and led us to an upstream fix resolution.Isolating the issueWe started our investigation by looking at the cluster as a whole, where we confirmed that only a few queries were crashing Postgres. On a promising note, the ones that failed were triggering the segmentation fault in a consistent way. We started by examining one of these queries, and simplified it down to the following trivial reproducer:Copypostgres=# SELECT repo_id FROM repository; server closed the connection unexpectedly This probably means the server terminated abnormally before or while processing the request. connection to server was lostInspecting our collection of core dumps more closely, we were able to find some with salvageable frames:Copy#0 0x0000fff7353141cc in ?? () #1 0x0000fff7a1ad3754 in ?? () #2 0x0000fff7a2016720 in ExecRunCompiledExpr (state=0xaaaafffe4c88, econtext=0xaaaafffe46d8, isNull=0xaaaafffe5928) at ./build/../src/backend/jit/llvm/llvmjit_expr.c:2483 #3 0x0000fff7a2016720 in ExecRunCompiledExpr (state=0xaaaafffe5928, econtext=0xaaaafffe47e8, isNull=0xfffffcef70f7) at ./build/../src/backend/jit/llvm/llvmjit_expr.c:2483 #4 0x0000aaaadaad5bd0 in ?? () at executor/./build/../src/backend/executor/nodeSort.c:430A typical Postgres backtrace should have at least 20 frames, with the main entry point at the bottom. This backtrace only had four frames, with the last frame being ??, suggesting that the stack was corrupted. We weren’t sure if we could trust the frames, but they seemed to indicate an issue within Just-in-Time (JIT) execution.A crash course on JIT in PostgresPostgres needs to handle arbitrary SQL expressions like WHERE a=1 or 1+1, which are executed by a general-purpose interpreter that can handle all types of operations. When processing millions of rows, the overhead that results from the interpreter repeatedly evaluating expressions can add significant CPU load.JIT can mitigate this overhead by compiling a native version of these expressions during the query’s execution (hence the moniker “Just-in-Time”). For example, using JIT, the 1+1 expression can be compiled into a machine code function that directly returns 2. Another key JIT optimization is tuple deforming, which natively transforms on-disk tuples (containing all of the columns) into their in-memory representation. Postgres uses the popular LLVM Project to handle all JIT compilation.While JIT offers an execution speed boost over the query interpreter, there’s no free lunch—it takes additional processing cycles to compile code on the critical path of query execution. Additionally, Postgres doesn’t support reusing JIT-compiled functions, so they must be re-compiled for every query. Thus, Postgres relies on heuristics and tunable cost thresholds to invoke JIT only for expensive queries where the benefits are more likely to offset the compilation overhead.Our query of death was expensive: it scanned a table ”repository” that had 64 partitions and more than 1.6 million rows, as seen in the query plan:Copy QUERY PLAN ------------------------------------------------------------------------ Append (cost=0.00..111412.66 rows=1682444 width=29) -> Seq Scan on repository0 (cost=0.00..1615.99 rows=26399 width=29) -> Seq Scan on repository1 (cost=0.00..1610.13 rows=26313 width=29) ... -> Seq Scan on repository62 (cost=0.00..1597.72 rows=26072 width=29) -> Seq Scan on repository63 (cost=0.00..1598.26 rows=26126 width=29) JIT: Functions: 128 Options: Inlining false, Optimization false, Expressions true, Deforming trueThe query plan indicated that JIT was used to compile 128 functions. Given all of the focus on JIT, as an investigative step, we tried running the query with JIT disabled:Copypostgres=# SET jit = off; SET postgres=# SELECT repo_id FROM repository; repo_id ------------------------------------- github.com/DataDog/datadog-agent github.com/DataDog/integrations-core github.com/DataDog/dd-trace-go ...With JIT disabled, the query ran without triggering a segfault. As an immediate mitigation, we disabled JIT for the entire cluster, which stopped the crashes completely and without any noticeable impact on query latencies. It was time to relax and grab a cup of coffee.So far, the only information we had was that the crash was happening during JIT execution. We still needed to find the root cause to prevent the issue from recurring in other production clusters with different trigger conditions. Because the impacted cluster was running a release version of Postgres, it didn’t provide much debugging capacity or flexibility. To further debug the issue, we needed to reproduce it in a dedicated test environment.Our initial attempts at reproducing the crash by simply copying the data to a local Postgres instance (using pg_dump or pg_basebackup) were unsuccessful. Simply replicating the data wasn’t enough, so we looked into replicating the exact characteristics of the original cluster: memory, instance type, CPU, architecture, and so on.One of the differences turned out to be very important: the production cluster was running on Arm64 cloud instances (whereas our initial test environment was running on AMD64). By switching to Arm64 and trying again, we were able to successfully reproduce the issue!Testing on a Postgres debug buildNow that we could reproduce the crash, we wanted to investigate further using a debug build. Since the crash was related to Postgres’s JIT features, we needed to ensure that we compiled Postgres with LLVM support:Copy$ git clone --single-branch --branch REL_14_STABLE https://github.com/postgres/postgres.git $ mkdir postgres/build; cd postgres/build $ CFLAGS="-O0" ../configure --enable-cassert --enable-debug --prefix /var/lib/postgresql/.local --with-llvm $ make install -j9We also enabled jit_debugging_support in our postgresql.conf to register generated JIT functions with GDB. Once our debug cluster was up, we discovered that running the query of death resulted in a different set of failure symptoms: the database didn’t segfault anymore, but the process appeared to be stuck using 100 percent CPU, neither crashing nor returning anything. This was confusing.To figure out what the process was doing, we needed to capture the process’s backtrace. The first step was to identify the correct process to attach to. When a client like psql opens a connection, Postgres forks a new process—called a backend process—that is dedicated to serve the connection. The backend process will show a command with the following format: \$username \$database \$source \$state. We checked the list of Postgres processes to find the process we were interested in:Copy$ pgrep postgres -a 20111 /var/lib/postgresql/.local/bin/postgres -D /var/lib/postgresql/db_data 20112 postgres: logger 20195 postgres: checkpointer 20196 postgres: background writer 20197 postgres: walwriter 20198 postgres: autovacuum launcher 20206 postgres: postgres postgres [local] SELECTProcesses like logger, checkpointer, and walwriter are system processes, and thus not relevant to the query execution. Our list of processes showed one client, postgres postgres [local] SELECT, connected with the postgres user on the postgres database using a Unix socket and currently handling a SELECT query. We attached GDB using the process with the identified PID:Copy$ gdb -p 20206Once GDB was attached, we got the following backtrace:Copy(gdb) bt #0 0x0000ec53660aa14c in deform_0_1 () #1 0x0000ec53660aa064 in evalexpr_0_0 () #2 0x0000ab8f9b322948 in ExecEvalExprSwitchContext (isNull=0xfffff47c3c87, econtext=0xab8fd0f13878, state=0xab8fd0f13c50) at executor/./build/../src/include/executor/executor.h:342 #3 ExecProject (projInfo=0xab8fd0f13c48) at executor/./build/../src/include/executor/executor.h:376 ...Indeed, this was JIT code and, with the jit_debugging_support parameter enabled, we had more useful frame names to help us understand what the JIT code was: evalexpr_0_0 and deform_0_1.Spotting an infinite loop in Arm64 assemblyEven though the symptoms changed, we felt that the stuck process was most likely a different manifestation of the same issue and that analyzing it would help us understand the root cause.Since we were debugging assembly code, we couldn’t use the normal GDB commands and views. Using layout split and layout regs in GDB showed a split view of the assembly dump, along with the state of the registers. Additionally, to advance within the assembly code, nexti and stepi were used instead of the usual next/step commands.Debugging in GDB using the assembly layout.By repeatedly advancing one instruction at a time, we pinpointed the beginning and end of an infinite loop:Start: deform_0_1+140 (140 bytes after the start of the deform_0_1 function we saw in the backtrace)End: deform_0_1+188This was the assembly dump for that range:Copy0xec53660aa130 <deform_0_1+132> adrp x11, 0xec53fd308000 0xec53660aa134 <deform_0_1+136> add x11, x11, #0x0 0xec53660aa138 <deform_0_1+140> adr x8, 0xec53660aa138 <deform_0_1+140> 0xec53660aa13c <deform_0_1+144> ldrsw x10, [x11, x12, lsl #2] 0xec53660aa140 <deform_0_1+148> add x8, x8, x10 0xec53660aa144 <deform_0_1+152> mov x10, x9 0xec53660aa148 <deform_0_1+156> str x10, [sp, #104] 0xec53660aa14c <deform_0_1+160> mov x10, x9 0xec53660aa150 <deform_0_1+164> stur x10, [x29, #-96] 0xec53660aa154 <deform_0_1+168> mov x10, x9 0xec53660aa158 <deform_0_1+172> stur x10, [x29, #-88] 0xec53660aa15c <deform_0_1+176> mov x10, x9 0xec53660aa160 <deform_0_1+180> stur x10, [x29, #-80] 0xec53660aa164 <deform_0_1+184> stur x9, [x29, #-72] 0xec53660aa168 <deform_0_1+188> br x8The loop happened because deform_0_1+188 branched (with the br instruction) to the address stored in x8. However, x8 always pointed back to the start at deform_0_1+140. Carefully tracing the loop step by step helped us come up with a guess for why this was happening:<deform_0_1+132> adrp x11, 0xec53fd308000 Set x11 to be the address of a 4KB page (0xec53fd308000).<deform_0_1+140> adr x8, <deform_0_1+140> Set x8 to be the address of deform_0_1+140 (0xec53660aa138). This address (and this instruction, in fact) is the start of the infinite loop.<deform_0_1+144> ldrsw x10, [x11, x12, lsl #2] Load into x10 the value located at memory address x11+x12*4. At time of debugging: - Register x12 was 0, so this loaded the value at memory address 0xec53fd308000. - The contents of memory address 0xec53fd308000 was 0. - Therefore, this load instruction set register x10 to be 0.<deform_0_1+148> add x8, x8, x10 Set x8 = x8 + x10 At time of debugging: - As x10 was 0, this instruction was a no-op. - x8 remained the address deform_0_1+140 (0xec53660aa138), which was the start of the “loop.”<deform_0_1+188> br x8 Branch to address stored in x8. At time of debugging: - This branched to the start of the “loop,” on repeat indefinitely!The key step that felt wrong was the load instruction <deform_0_1+144>, which sets x10 to be zero. If it had loaded a non-zero value, the code might have branched somewhere useful instead. We checked the contents of the memory around the address 0xec53fd308000, and indeed we only observed zeros:Copy(gdb) x/6 0xec53fd308000 0xec53fd308000: 0 0 0 0 0xec53fd308010: 0 0It took some careful debugging, but we concluded that this assembly code/data was definitely broken. We started to wonder if Postgres was somehow building bad JIT code. We needed to find the JIT builder code in the Postgres source.Finding the Postgres code that generated the assemblyThanks to the deform_0_1 name, we could identify the function building the JIT code: slot_compile_deform. This function was more than 700 lines long, and the assembly view in GDB didn’t provide many hints to help us pinpoint the exact part of the function that broke. Fortunately, we discovered that we could generate assembly sources containing additional annotations from the JIT bitcode.To achieve that, we did the following:Enabled jit_dump_bitcode, which generated $PID.0.bc files in the database’s data_directory.Compiled the bitcode file into assembly using llc, creating a $PID.0.s file with the assembly source: \$ llc -O0 -march=arm64 $PID.0.optimized.bc.Then, scanning the generated assembly sources, we found the section that we were debugging in GDB:Copydeform_0_1: // @deform_0_1 .cfi_startproc [...] // %bb.3: // %find_startblock adrp x11, .LJTI1_0 add x11, x11, :lo12:.LJTI1_0 .Ltmp0: adr x8, .Ltmp0 ldrsw x10, [x11, x12, lsl #2] add x8, x8, x10 br x8This output gave us a useful find_startblock annotation that pointed us to a specific part of slot_compile_deform:CopyLLVMPositionBuilderAtEnd(b, b_find_start); v_nvalid = l_load(b, LLVMInt16TypeInContext(lc), v_nvalidp, ""); /* * Build switch to go from nvalid to the right startblock. Callers * currently don't have the knowledge, but it'd be good for performance to * avoid this check when it's known that the slot is empty (e.g. in scan * nodes). */ if (true) { LLVMValueRef v_sw'''
