title = "Application Security Management | Datadog"
description = "ObservabilityEnd-to-end, simplified visibility into your stack’s health & performance"
full_description = "Datadog Application Security Management を使用すると、本番環境の Web アプリケーション、サーバーレスアプリケーション、および API に対する脆弱性と脅威を継続的かつリアルタイムでモニタリングし、アプリケーションセキュリティリスクを管理できます。APM の分散型トレーシングやコードレベルのコンテキストと自動統合された Application Security Management は、開発、運用、およびセキュリティチームが本番環境で安全なアプリケーションを構築・運用できるようにします。攻撃の検出と防御エンドツーエンドの攻撃フローにより、Web アプリケーションやサーバーレスアプリケーションを標的とする継続的な脅威がサービスチェーンを通じてどのように伝播しているかを把握エラー、関連スタックトレース、およびログにピボットし、チーム間のコラボレーションを容易にし、ボトルネックを排除Datadog プラットフォームを通じて不審なリクエストや悪質な行為を直接ブロックすることで、攻撃を鈍化API の攻撃対象領域を自動的に発見すべての API エンドポイントのパフォーマンス、セキュリティ、および所有権を 1 つのビューで可視化最も標的とされているエンドポイントとリスクのあるエンドポイントを特定し、改善の優先順位を決定特定の IP、ユーザー、リクエストを自動的にブロックして API エンドポイントを保護レポート: 2023 年アプリケーションセキュリティの現状2023 年のアプリケーションセキュリティの状況に関する 7 つの事実をお読みくださいレポートを読む本番環境におけるコードレベルの脆弱性を継続的に監視コードスキャンや時間のかかるテストプロセスのオーバーヘッドなしに、本番レベルのトラフィックを提供するアプリケーションコードの脆弱性を継続的に特定トリアージを加速するために、脆弱性のトリガーとなった特定の入力またはリクエストを特定脆弱性のあるファイル、バージョン、およびコード行を正確かつ即座に確認し、修復までの平均時間を短縮 アクティブなリスクをもたらすオープンソースの脆弱性にフォーカスCI および本番環境にロードされた脆弱なオープンソースライブラリをエンドツーエンドで可視化Datadog の重大度スコアを使用して、コード内およびランタイムのオープンソースライブラリの脆弱性を優先順位付け。スコアは暴露、CVSS、リアルタイムの脅威活動を考慮改善された脆弱性が本番環境に確実に導入され、CI/CD パイプラインのエラーによる静的コードとランタイムコードの不一致を回避 Datadog は、サーバーレスアプリケーションに対する攻撃を検出し、その場でそれらの試みをブロックする自動応答をトリガーします。Application Security Management は簡単に有効化でき、さらに私たちのニーズに合わせて構成することができました。また、脆弱性検出とコンテキスト化された重大度評価により、サービス層内での修復作業の優先順位をより適切に設定することができるようになりました。ミカ・カッツ Yellow Card、CISOCustomer TestimonialsDatadog は、サーバーレスアプリケーションに対する攻撃を検出し、その場でそれらの試みをブロックする自動応答をトリガーします。Application Security Management は簡単に有効化でき、さらに私たちのニーズに合わせて構成することができました。また、脆弱性検出とコンテキスト化された重大度評価により、サービス層内での修復作業の優先順位をより適切に設定することができるようになりました。ミカ・カッツYellow Card、CISOリソースBLOGGain visibility into open source vulnerabilities with Datadog Application Vulnerability ManagementfeaturesecurityBLOGBlock attackers in your apps with Datadog Application Security ManagementfeaturesecurityBLOGThreat modeling with Datadog Application Security Managementbest practicessecurityBLOGSecure serverless applications with Datadog ASMfeatureserverless monitoringすべての関連資料を表示