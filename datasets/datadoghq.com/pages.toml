ity requirements by tailoring detection rules, either by duplicating an existing control or designing one from scratchLearn more Uncover and remediate excessive permissions to reduce identity riskAvailable with Agentless and Agent-based setupSecure your cloud infrastructure from IAM-based attacks by mitigating excessive permissions gaps, controlling administrative privileges, and reducing the potential blast radius of security incidentsAccess full summaries of detected identity risks, including how resources can be accessed, related permissions, and remediation steps for efficient mitigationProactively defend against evolving identity risks with curated rules and best practices, continually updated by Datadog’s security researchLearn more Protect your cloud workloads against attacks as they happenAvailable with Agent-based setupGet kernel-level visibility into workload activity across your hosts and containers to uncover threatsUse curated out-of-the-box workload threat detection rules researched, developed, and maintained by Datadog security researchDetect unknown threats and anomalous process, network, or file activity using workload behavior modelingMaintain critical file controls and detect problems in real time with Datadog File Integrity Monitoring (FIM)Gain unparalleled visibility into your workloads with support for most major Linux distributions, Windows Servers, AWS Fargate, Docker, and ContainerdLearn more Confidently adhere to industry and custom compliance benchmarksAvailable with Agentless and Agent-based setupTrack conformance to requirements of industry benchmarks and other controls, such as CIS, PCI DSS, SOC 2, and more or create custom frameworksContinuously benchmark your Kubernetes deployments against industry-standard frameworks to strengthen your security postureEvaluate your organization’s compliance and security progress across teams and accounts with the Datadog Posture ScoreCreate, monitor, and report on custom compliance frameworks by leve