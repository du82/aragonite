ncluding Senior Vice President and General Manager for the Storage and Availability Business Unit. Li holds a Ph.D degree from Princeton University, a master's degree from Cornell University and a bachelor’s degree from Tsinghua University. She completed the Stanford Executive Program from Stanford Graduate School of Business in 2014.Dr. Yanbing Li is a global business and technology leader with extensive experience in product, engineering, large-scale P&L and global operations. Prior to joining Datadog, Li was the Senior Vice President of Engineering at Aurora. Before Aurora, she was Vice President of Product and Engineering at Google where her portfolio included Google Cloud Commerce, Cloud Operations and Service Infrastructure. Prior to Google, Li held multiple executive leadership positions at VMware, including Senior Vice President and General Manager for the Storage and Availability Business Unit. Li holds a Ph.D degree from Princeton University, a master's degree from Cornell University and a bachelor’s degree from Tsinghua University. She completed the Stanford Executive Program from Stanford Graduate School of Business in 2014.David GalloreeseChief People OfficerDavid Galloreese has over 20 years of Human Resources experience, spanning the technology, financial services and retail industries. Prior to Datadog, David served as a Senior Advisor to McKinsey and Company and Advisor to multiple technology companies. David previously was the Chief HR Officer for Figma, Wells Fargo, Sam’s Club and Head of Human Resources for Medallia. He holds a BA from UCLA and an MBA from NYU.David Galloreese has over 20 years of Human Resources experience, spanning the technology, financial services and retail industries. Prior to Datadog, David served as a Senior Advisor to McKinsey and Company and Advisor to multiple technology companies. David previously was the Chief HR Officer for Figma, Wells Fargo, Sam’s Club and Head of Human Resources for Medallia. He holds a BA from UCLA and an MBA from NYU.Sean WaltersChief Revenue OfficerWith over two decades in enterprise software sales, Sean Walters brings deep experience to his role of Chief Revenue Officer. He joined Datadog in 2018 and was previously the Senior Vice President of Sales at the company. Prior to joining Datadog, Sean held sales leadership positions at technology companies including Medallia and IBM. Sean holds a Bachelors of Science in Marketing from Rowan University.With over two decades in enterprise software sales, Sean Walters brings deep experience to his role of Chief Revenue Officer. He joined Datadog in 2018 and was previously the Senior Vice President of Sales at the company. Prior to joining Datadog, Sean held sales leadership positions at technology companies including Medallia and IBM. Sean holds a Bachelors of Science in Marketing from Rowan University.Emilio EscobarChief Information Security Officer With two decades of experience in Information Security and Compliance, Emilio Escobar has worked at large enterprises, medium-sized companies, and governmental organizations. Previously, Emilio served as the VP of Information Security for Hulu, where he played a pivotal role in setting up key security functions. Prior to that, Emilio worked for PlayStation, where he built and ran the software security teams. Emilio’s unique approach to security and compliance has always prioritized partnerships and people—hiring the right talent to build the processes, procedures, and technologies that unite Security, Engineering, and Operations teams. Emilio holds a BS in Computer Science from the University of Puerto Rico.With two decades of experience in Information Security and Compliance, Emilio Escobar has worked at large enterprises, medium-sized companies, and governmental organizations. Previously, Emilio served as the VP of Information Security for Hulu, where he played a pivotal role in setting up key security functions. Prior to that, Emilio worked for PlayStation, where