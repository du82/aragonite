full_description = "Datadog Cloud Security Platformの Datadog Cloud SIEMは、動的なクラウドスケール環境に堅牢な脅威検知機能を提供します。クラウドSIEMでは、運用ログやセキュリティログをボリュームに関係なくリアルタイムに分析し、厳選されたすぐに使える統合機能やルールを活用して脅威を検知することができます。また、開発者、セキュリティ、運用チームは、詳細なオブザーバビリティデータを活用して、単一の統合プラットフォームでセキュリティ調査を加速することができます。DevSecOpsの成熟度モデル当社のベストプラクティスを利用して、組織のDevSecOpsの実践を評価し、前進させましょう。詳細はこちら拡張可能で、すぐに使えるセキュリティインテグレーションDatadogの500以上の統合機能を活用して、ネットワーク、IDプロバイダー、エンドポイント、SaaSアプリケーションを完全に可視化ログやサードパーティのセキュリティ・アラートを取り込み、正規化し、充実させることで、脅威を検知し、調査を加速チケッティングポータル、チャットシステム、レメディエーションツールとの統合による複数チームとの連携 精選されたカスタマイズ可能なセキュリティルール内蔵された閾値と異常検知ルールを活用し、最小限の設定で脅威を迅速に検知MITRE ATT&CK®フレームワークによる一般的な脅威や攻撃の特定独自のクエリ言語を学習することなく独自のカスタムルールを作成可能 製品シート: Cloud SIEMダイナミックなシステムにおける脅威の検知と対応製品概要を入手する昼夜対応のリアルタイムな脅威検知コストのかかるインデックス作成後ではなく、ログ取り込み時にセキュリティ問題を発見可能複雑なルールや大量のデータを取り込んでいる場合でも、脅威を迅速に検知することが可能Datadogが管理するスレット・インテリジェンス・フィードでセキュリティ・シグナルを充実 低メンテナンスでコスト効率の高いSIEMハードウェアのメンテナンスではなく、脅威の検知に集中することで、すぐに価値を実現SIEMのパッチ適用の負担を軽減することで、セキュリティ調査時のチームの効率を向上コスト効率に優れたクラウド型SIEMで運用コストを削減リソースBLOGAutomate remediation of threats detected by Datadog Cloud SIEMintegrationsecurityBLOGDetect application abuse and fraud with Datadog Cloud SIEMtutorialsecurityすべての関連資料を表示"
