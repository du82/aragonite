full_description = "LeadershipOlivier PomelCEO & CO-FOUNDER Prior to founding Datadog, Olivier Pomel built data systems for K-12 teachers as a VP, Technology for Wireless Generation, where he grew the development team from a handful of people to close to 100 of the best engineers in New York until the company’s acquisition by News Corp. Before Wireless Generation, Olivier held software engineering positions at IBM Research and several internet startups. Olivier is an original author of the VLC media player and holds a MS, CS from the Ecole Centrale Paris.Prior to founding Datadog, Olivier Pomel built data systems for K-12 teachers as a VP, Technology for Wireless Generation, where he grew the development team from a handful of people to close to 100 of the best engineers in New York until the company’s acquisition by News Corp. Before Wireless Generation, Olivier held software engineering positions at IBM Research and several internet startups. Olivier is an original author of the VLC media player and holds a MS, CS from the Ecole Centrale Paris.Alexis Lê-QuôcCTO & CO-FOUNDERPrior to founding Datadog, Alexis Lê-Quôc served as the Director of Operations for Wireless Generation, where he built the team and infrastructure that served more than four million students in 49 states. As a member of the original “devops” movement, Alexis spent several years as a software engineer at IBM Research, Neomeo, and Orange, and he brings a strong focus on technical elegance and operational efficiency to Datadog. Alexis holds an MS, CS from the Ecole Centrale Paris and has presented sessions on cloud monitoring and server performance at many conferences, including AWS re:Invent, Monitorama, DevOpsDays, Velocity, and PyCon.Prior to founding Datadog, Alexis Lê-Quôc served as the Director of Operations for Wireless Generation, where he built the team and infrastructure that served more than four million students in 49 states. As a member of the original “devops” movement, Alexis spent several years as a software engineer at IBM Research, Neomeo, and Orange, and he brings a strong focus on technical elegance and operational efficiency to Datadog. Alexis holds an MS, CS from the Ecole Centrale Paris and has presented sessions on cloud monitoring and server performance at many conferences, including AWS re:Invent, Monitorama, DevOpsDays, Velocity, and PyCon.David ObstlerCHIEF FINANCIAL OFFICERDavid Obstler brings more than three decades of operational finance experience, with over two decades focused on technology companies. Prior to Datadog, David served as CFO of TravelClick, where he led global financial operations. David was appointed to the board of Braze in 2021. David has also held CFO roles at OpenLink Financial, MSCI Inc., Risk Metrics Group, and Pinnacor, as well as investment banking positions at JPMorgan, Lehman Brothers, and Goldman Sachs. David has a BA from Yale University and a MBA from Harvard Business School.David Obstler brings more than three decades of operational finance experience, with over two decades focused on technology companies. Prior to Datadog, David served as CFO of TravelClick, where he led global financial operations. David was appointed to the board of Braze in 2021. David has also held CFO roles at OpenLink Financial, MSCI Inc., Risk Metrics Group, and Pinnacor, as well as investment banking positions at JPMorgan, Lehman Brothers, and Goldman Sachs. David has a BA from Yale University and a MBA from Harvard Business School.Sara VarniChief Marketing Officer Sara Varni has over 15 years of experience bringing enterprise software products to market. Prior to Datadog, she served as CMO of Attentive, a leader in SMS marketing, as well as the CMO of Twilio where she bridged the developer and enterprise markets. Sara started her career at Salesforce where she spent over 10 years in various leadership roles, ultimately managing marketing for their flagship product. She holds a BS from Bucknell University and an MBA from the Anderson School of Management at UCLA.Sara Varni has over 15 years of experience bringing enterprise software products to market. Prior to Datadog, she served as CMO of Attentive, a leader in SMS marketing, as well as the CMO of Twilio where she bridged the developer and enterprise markets. Sara started her career at Salesforce where she spent over 10 years in various leadership roles, ultimately managing marketing for their flagship product. She holds a BS from Bucknell University and an MBA from the Anderson School of Management at UCLA.Adam BlitzerCHIEF OPERATING OFFICERAdam Blitzer has over a decade of experience in the SaaS space. He was at Salesforce for eight years, culminating in his role as Executive Vice President and General Manager of Digital (Marketing Cloud, Commerce Cloud, and Experience Cloud). Prior to his time at Salesforce, Adam co-founded Pardot, which is now owned by Salesforce and is considered one of the top B2B marketing automation platforms in the industry. He holds a BA from Duke University.Adam Blitzer has over a decade of experience in the SaaS space. He was at Salesforce for eight years, culminating in his role as Executive Vice President and General Manager of Digital (Marketing Cloud, Commerce Cloud, and Experience Cloud). Prior to his time at Salesforce, Adam co-founded Pardot, which is now owned by Salesforce and is considered one of the top B2B marketing automation platforms in the industry. He holds a BA from Duke University.Yanbing LiCHIEF PRODUCT OFFICERDr. Yanbing Li is a global business and technology leader with extensive experience in product, engineering, large-scale P&L and global operations. Prior to joining Datadog, Li was the Senior Vice President of Engineering at Aurora. Before Aurora, she was Vice President of Product and Engineering at Google where her portfolio included Google Cloud Commerce, Cloud Operations and Service Infrastructure. Prior to Google, Li held multiple executive leadership positions at VMware, including Senior Vice President and General Manager for the Storage and Availability Business Unit. Li holds a Ph.D degree from Princeton University, a master's degree from Cornell University and a bachelor’s degree from Tsinghua University. She completed the Stanford Executive Program from Stanford Graduate School of Business in 2014.Dr. Yanbing Li is a global business and technology leader with extensive experience in product, engineering, large-scale P&L and global operations. Prior to joining Datadog, Li was the Senior Vice President of Engineering at Aurora. Before Aurora, she was Vice President of Product and Engineering at Google where her portfolio included Google Cloud Commerce, Cloud Operations and Service Infrastructure. Prior to Google, Li held multiple executive leadership positions at VMware, including Senior Vice President and General Manager for the Storage and Availability Business Unit. Li holds a Ph.D degree from Princeton University, a master's degree from Cornell University and a bachelor’s degree from Tsinghua University. She completed the Stanford Executive Program from Stanford Graduate School of Business in 2014.David GalloreeseChief People OfficerDavid Galloreese has over 20 years of Human Resources experience, spanning the technology, financial services and retail industries. Prior to Datadog, David served as a Senior Advisor to McKinsey and Company and Advisor to multiple technology companies. David previously was the Chief HR Officer for Figma, Wells Fargo, Sam’s Club and Head of Human Resources for Medallia. He holds a BA from UCLA and an MBA from NYU.David Galloreese has over 20 years of Human Resources experience, spanning the technology, financial services and retail industries. Prior to Datadog, David served as a Senior Advisor to McKinsey and Company and Advisor to multiple technology companies. David previously was the Chief HR Officer for Figma, Wells Fargo, Sam’s Club and Head of Human Resources for Medallia. He holds a BA from UCLA and an MBA from NYU.Sean WaltersChief Revenue OfficerWith over two decades in enterprise software sales, Sean Walters brings deep experience to his role of Chief Revenue Officer. He joined Datadog in 2018 and was previously the Senior Vice President of Sales at the company. Prior to joining Datadog, Sean held sales leadership positions at technology companies including Medallia and IBM. Sean holds a Bachelors of Science in Marketing from Rowan University.With over two decades in enterprise software sales, Sean Walters brings deep experience to his role of Chief Revenue Officer. He joined Datadog in 2018 and was previously the Senior Vice President of Sales at the company. Prior to joining Datadog, Sean held sales leadership positions at technology companies including Medallia and IBM. Sean holds a Bachelors of Science in Marketing from Rowan University.Emilio EscobarChief Information Security Officer With two decades of experience in Information Security and Compliance, Emilio Escobar has worked at large enterprises, medium-sized companies, and governmental organizations. Previously, Emilio served as the VP of Information Security for Hulu, where he played a pivotal role in setting up key security functions. Prior to that, Emilio worked for PlayStation, where he built and ran the software security teams. Emilio’s unique approach to security and compliance has always prioritized partnerships and people—hiring the right talent to build the processes, procedures, and technologies that unite Security, Engineering, and Operations teams. Emilio holds a BS in Computer Science from the University of Puerto Rico.With two decades of experience in Information Security and Compliance, Emilio Escobar has worked at large enterprises, medium-sized companies, and governmental organizations. Previously, Emilio served as the VP of Information Security for Hulu, where he played a pivotal role in setting up key security functions. Prior to that, Emilio worked for PlayStation, where he built and ran the software security teams. Emilio’s unique approach to security and compliance has always prioritized partnerships and people—hiring the right talent to build the processes, procedures, and technologies that unite Security, Engineering, and Operations teams. Emilio holds a BS in Computer Science from the University of Puerto Rico.Kerry AcocellaGeneral CounselIn her role as General Counsel, Kerry Acocella oversees all legal matters at Datadog from day-to-day compliance matters to strategic transactions. Prior to Datadog, Kerry held senior legal positions in public companies across a wide range of industries. Kerry began her legal career at Morrison & Foerster LLP. She received her J.D. from the Benjamin N. Cardozo School of Law and her B.S. in Psychology from the University of Georgia.In her role as General Counsel, Kerry Acocella oversees all legal matters at Datadog from day-to-day compliance matters to strategic transactions. Prior to Datadog, Kerry held senior legal positions in public companies across a wide range of industries. Kerry began her legal career at Morrison & Foerster LLP. She received her J.D. from the Benjamin N. Cardozo School of Law and her B.S. in Psychology from the University of Georgia.Board of DirectorsShardul ShahPartner, Index Ventures Shardul Shah joined Index Ventures in 2008, specializing in infrastructure, security, and software. Shardul is currently involved in the boards of multiple private technology companies, including AttackIQ, Inc., Brightback Inc., Castle Intelligence, Inc., Expel Inc., Gatsby, Inc. and Iterable, Inc., and has supported investments in Moleskine, Squarespace, Dropbox, Centrify, Stack Exchange, and Koality (acquired by Docker). Shardul holds a BA in Economics and a BA in Biology (with a specialization in Immunology) from the University of Chicago.Shardul Shah joined Index Ventures in 2008, specializing in infrastructure, security, and software. Shardul is currently involved in the boards of multiple private technology companies, including AttackIQ, Inc., Brightback Inc., Castle Intelligence, Inc., Expel Inc., Gatsby, Inc. and Iterable, Inc., and has supported investments in Moleskine, Squarespace, Dropbox, Centrify, Stack Exchange, and Koality (acquired by Docker). Shardul holds a BA in Economics and a BA in Biology (with a specialization in Immunology) from the University of Chicago.Dev IttycheriaPresident and CEO, MongoDB Dev Ittycheria is the President & CEO of MongoDB, where he led its IPO in 2017—the first public offering of a database company in more than 25 years. Previously, he was Managing Director at OpenView Venture Partners, Venture Partner at Greylock Partners, and co-founder of BladeLogic, which was acquired by BMC for $900 million. Following this acquisition, Dev served as President of BMC, overseeing a business with $1.4 billion in annual revenue. Dev was appointed to the board of Altimeter Growth Corporation in 2020, a public special purpose investment vehicle formed to invest in a technology company. Dev graduated from Rutgers University with a BS in Electrical Engineering, was honored with the Medal of Excellence, and was recognized by the School of Engineering as its 2010 Alumnus of the Year.Dev Ittycheria is the President & CEO of MongoDB, where he led its IPO in 2017—the first public offering of a database company in more than 25 years. Previously, he was Managing Director at OpenView Venture Partners, Venture Partner at Greylock Partners, and co-founder of BladeLogic, which was acquired by BMC for $900 million. Following this acquisition, Dev served as President of BMC, overseeing a business with $1.4 billion in annual revenue. Dev was appointed to the board of Altimeter Growth Corporation in 2020, a public special purpose investment vehicle formed to invest in a technology company. Dev graduated from Rutgers University with a BS in Electrical Engineering, was honored with the Medal of Excellence, and was recognized by the School of Engineering as its 2010 Alumnus of the Year.Michael CallahanCo-founder, Awake SecurityBefore he co-founded Awake Security, Michael Callahan was CTO and Co-founder of PolyServe, which built mission-critical shared-data storage clustering software for Linux and Windows. A Greylock Partners portfolio company, PolyServe was acquired by HP in 2007. Previously, Michael served as Director of Advanced Development at Ask Jeeves, an early natural-language search engine. Michael graduated summa cum laude from Harvard University and was both a Rhodes Scholar and a Junior Research Fellow in Mathematics at Oxford University, where his research focused on differential geometry, topology, gauge theory, and the application of massively parallel architectures to computer vision.Before he co-founded Awake Security, Michael Callahan was CTO and Co-founder of PolyServe, which built mission-critical shared-data storage clustering software for Linux and Windows. A Greylock Partners portfolio company, PolyServe was acquired by"
