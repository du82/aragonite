ent Icon/check Created with Sketch. Icon/check Created with Sketch. Icon/check Created with Sketch. AllotmentsWorkflow Automation5 workflow executions per host per month20 workflow executions per host per monthCSM Containers5 containers per host per month20 containers per host per month4 containers per host per monthAdd-onsAWS Fargate (Serverless Containers)$2 per task ($2.90 on demand)When combined with other productsOne interface to correlate workload level threats with misconfigurations, vulnerabilities, and identify related risks. Icon/check Created with Sketch. Icon/check Created with Sketch. Icon/check Created with Sketch. Pivot seamlessly to related metrics, traces, and logs during investigations Icon/check Created with Sketch. Icon/check Created with Sketch. Icon/check Created with Sketch. Support PlansFrom basic plans to bespoke offerings, Datadog offers the right level of support for any organization.LEARN MORE ABOUT OUR SUPPORT PLANSCommon QuestionsCSM ProCSM EnterpriseCWS CSM Pro CSM Enterprise CWSWho is this for?CSM Pro is built to support multiple teams in discovering their existing cloud infrastructure, identifying issues that require attention, and evaluating their compliance readiness with cloud security posture management, all while providing guidance on how to address those gaps effectively.Can I purchase CSM Pro for some hosts, and CSM Enterprise for the rest of my hosts?No, you may either purchase CSM Pro or CSM Enterprise for your organization, but not both.What kind of billing plan do I need to run CSM Pro?CSM Pro can be purchased without needing any other Datadog plan. It does not require the purchase of an Infrastructure Monitoring plan.What counts as a billable host?A host is any physical or virtual OS instance that you protect with Datadog using agent or agentless technology. It could be a server, VM, node (in the case of Kubernetes) or an App Service Plan instance (in the case of Azure App Services).What capabilities are included?Continuous scanning for misconfigurations, vulnerability management for container images, a full inventory of your cloud resources, case management, and 5 workflow executions per host per license.What does setup involve?Getting started requires cloud provider integrations and optionally the unified Datadog agent.Who is this for?CSM Enterprise is an advanced solution tailored specifically for security-minded teams that quickly maps, identifies, and prioritizes misconfigurations, threats, vulnerabilities and identity risks across their entire cloud infrastructure.Can I purchase CSM Pro for some hosts, and CSM Enterprise for the rest of my hosts?No, you may either purchase CSM Pro or CSM Enterprise for your organization, but not both.What kind of billing plan do I need to run CSM Enterprise?Every billable CSM Enterprise host requires the purchase of Enterprise Infrastructure Monitoring.What capabilities are included?Continuous scanning for misconfigurations, vulnerability management for container images and hosts, real-time threat detection, cloud infrastructure entitlement management, anomalous workload profile detection, a full inventory of your cloud resources, case management, 20 workflow executions per host, and 20 containers included per host license.Is Infrastructure Monitoring Pro or Enterprise required on every CSM Enterprise HostYes, for example, if you subscribe for 10 CSM Enterprise Hosts, those hosts must also be subscribed for 10 Infrastructure Pro or Enterprise hosts. This applies to both committed and non-committed host usage.What does setup involve?Getting started requires cloud provider integrations and optionally the unified Datadog agent.Why are CWS and CSM Pro listed on my bill?If you are using CSM Enterprise on demand, your bill will temporarily show the line items CSM Pro and Cloud Workload Security. Those will be transitioned out by the end of year and replaced by a line item for CSM Enterprise only.What counts as a billable host?A host is any physical or virtual OS instance that you monitor with Datadog. It could be a server, VM, node (in the case of Kubernetes) or App Service Plan instance (in the case of Azure App Services).What kind of billing plan do I need to run Cloud Workload Security (CWS) ?CWS can be purchased in addition to Infrastructure Monitoring, and is already included if CSM Enterprise is purchased.What counts as a billable host?A host is any physical or virtual OS instance that you monitor with Datadog. It could be a server, VM, node (in the case of Kubernetes) or App Service Plan instance (in the case of Azure App Services).How do I monitor containers and Kubernetes workloads?In containerized environments, the Datadog agent runs in a container alongside any number of other containers on a host. From there it monitors system activity for all running containers and for the host itself. Depending on your plan, you can monitor 4 containers free for each host license. Additional containers will be billed at $0.002 per container per hour. In addition, you can purchase prepaid containers at $1 per container per month.What environments does CWS support?We support most major Linux distributions, Windows Servers, and container runtimes including Docker and Kubernetes to provide unparalleled visibility into your workloads.CI Pipeline VisibilityMonitor the health and performance of your CI pipelinesStarting At$ 8Per committer,per month*Start Free TrialView data from multiple CI providers in a single placeVisualize performance across pipelines, stages, and jobsSurface recurring errors and the commits that caused them*Billed annually or $12 on-demandStart Free TrialFeaturesDiagnose the health & performance of your pipelinesMake data-driven decisions to optimize your CI/CDPipeline Visibility is currently compatible with GitLab, GitHub Actions, Jenkins, CircleCI, Buildkite, Codefresh, TeamCity, Azure DevOps, and AWS CodePipeline. Other providers and custom pipelines can be integrated via API. Out-of-the-box support for more CI providers is coming soon.Powerful out-of-the-box dashboards & integrationsAlert relevant teams about pipeline health and performanceWhen Combined with Other PlansAuto-instrument pipelines and tests to seamlessly pivot to related logs and errorsService and SupportTechnical support via Chat and Email, Community Forum, and Online DocsLearn more about our additional support plansCommon QuestionsHow do you define a committer?A committer means an active Git committer; they are identified through their Git author email address. A committer is counted towards billing if they commit at least 3 times in a given month.How do you define a committer in a pipeline not linked in a Git repository?In the event that a pipeline is not associated to a git repository, or git metadata is unavailable, the username of the person triggering the pipeline execution will be used as the billable committer.Can I purchase more than one software delivery plan for my team?Yes, customers can purchase a combination of soft"
