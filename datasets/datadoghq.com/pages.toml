full_description = "経営陣オリヴィエ・ポメルCEO & CO-FOUNDER Datadogを設立する前、オリビエ・ポメルは、Wireless Generation社の技術担当副社長として、幼稚園教諭向けのデータシステムを構築し、News Corp.に買収されるまでの間、開発チームを数人から100人近くのニューヨークの優秀なエンジニアに成長させました。Wireless Generation社以前は、IBM Research社やいくつかのインターネット新興企業でソフトウェア・エンジニアリングを担当していました。VLCメディアプレーヤーの原作者であり、パリのエコール・セントラルで修士号とCSを取得しています。Datadogを設立する前、オリビエ・ポメルは、Wireless Generation社の技術担当副社長として、幼稚園教諭向けのデータシステムを構築し、News Corp.に買収されるまでの間、開発チームを数人から100人近くのニューヨークの優秀なエンジニアに成長させました。Wireless Generation社以前は、IBM Research社やいくつかのインターネット新興企業でソフトウェア・エンジニアリングを担当していました。VLCメディアプレーヤーの原作者であり、パリのエコール・セントラルで修士号とCSを取得しています。アレクシス・ルクオックCTO & CO-FOUNDERアレクシス・ルクオックは、Datadogを設立する前は、Wireless Generation社のオペレーション・ディレクターとして、49州400万人以上の学生にサービスを提供するチームとインフラを構築しました。また、「DevOps」ムーブメントの先駆者として、IBM Research、Neomeo、Orangeでソフトウェアエンジニアとして数年間勤務した経験を持ち、Datadogでは技術的なエレガンスと運用効率に重点を置いています。また、AWS re:Invent、Monitorama、DevOpsDays、Velocity、PyConなど、多くのカンファレンスでクラウドモニタリングやサーバーパフォーマンスに関するセッションを行っています。アレクシス・ルクオックは、Datadogを設立する前は、Wireless Generation社のオペレーション・ディレクターとして、49州400万人以上の学生にサービスを提供するチームとインフラを構築しました。また、「DevOps」ムーブメントの先駆者として、IBM Research、Neomeo、Orangeでソフトウェアエンジニアとして数年間勤務した経験を持ち、Datadogでは技術的なエレガンスと運用効率に重点を置いています。また、AWS re:Invent、Monitorama、DevOpsDays、Velocity、PyConなど、多くのカンファレンスでクラウドモニタリングやサーバーパフォーマンスに関するセッションを行っています。デイビッド・オブストラーCHIEF FINANCIAL OFFICERデービッド・オブスラーは、30年以上のオペレーション・ファイナンスの経験を持ち、そのうち20年以上はテクノロジー企業に焦点を当てていました。Datadog入社以前、デイビッドはTravelClick社のCFOを務め、グローバルな財務業務を指揮しました。デイビッドは、2021年にBraze社の取締役に就任しました。デイビッドは、OpenLink Financial社、MSCI Inc.社、Risk Metrics Group社、Pinnacor社でCFOを務めたほか、JPMorgan社、Lehman Brothers社、Goldman Sachs社で投資銀行業務を担当しました。イェール大学で学士号、ハーバード・ビジネス・スクールでMBAを取得しています。デービッド・オブスラーは、30年以上のオペレーション・ファイナンスの経験を持ち、そのうち20年以上はテクノロジー企業に焦点を当てていました。Datadog入社以前、デイビッドはTravelClick社のCFOを務め、グローバルな財務業務を指揮しました。デイビッドは、2021年にBraze社の取締役に就任しました。デイビッドは、OpenLink Financial社、MSCI Inc.社、Risk Metrics Group社、Pinnacor社でCFOを務めたほか、JPMorgan社、Lehman Brothers社、Goldman Sachs社で投資銀行業務を担当しました。イェール大学で学士号、ハーバード・ビジネス・スクールでMBAを取得しています。Sara VarniChief Marketing Officer Sara Varni 