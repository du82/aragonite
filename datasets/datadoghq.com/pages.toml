["https://www.datadoghq.com/ja/product/code-profiling"]
title = "Continuous Profiler | Datadog"
description = "Datadog Continuous Profiler を使用すると、プロファイルデータを自動的に分析して分散型トレースと関連付け、本番環境でのコードパフォーマンスを最適化できます。"
full_description = "Datadog Continuous Profiler を使用すると、最小限のオーバーヘッドでスタック全体にわたって本番環境でのコードパフォーマンスを分析できます。コードプロファイリングを利用して、アプリケーションで最もリソースを消費するメソッドまたはクラスをすばやく検出および最適化できます。これにより、コードの効率が向上し、クラウドプロバイダーのコストが削減されます。コードのボトルネックが一目瞭然本番環境に影響を与えることなく、コードを継続的にプロファイリングします。タグとファセットを使用して、メソッド、スレッド、パッケージなどのさまざまな属性で呼び出しスタックをフィルタリングします。CPU、メモリ割り当て、ロック、I/O などのさまざまなプロファイルを視覚化し、メソッド名、クラス名、行番号で分類して、ボトルネックのトラブルシューティングを行い、エンドユーザー側での遅延とインフラストラクチャーのコストを大幅に削減します。 コードプロファイルと分散型トレースを相関させる当社の統合型プラットフォームにより、ボタンをクリックするだけで、プロファイルと分散型トレース間のシームレスな双方向の相関が可能になります。プロファイル内で、最もリソースを集中的に使用するリクエストを特定できます。同様に、低速なリクエストを調査する場合、関連するプロファイルにピボットしてリソースのボトルネックを見つけることができます。 コード分析から実用的なインサイトを導き出す自動ヒューリスティック分析とコードの主要な問題領域の要約を活用して、ブロックされたスレッド、非効率的なガベージコレクション、メモリリークなどのパフォーマンスの問題を特定して対処します。さらに詳細な情報が必要な場合は、コードキャッシュ、クラスローディング、ヒープサイズなどのカテゴリ別に内訳された完全なコードプロファイリング分析を見ることができます。 長期的なコードの傾向を追跡するプロファイラーメトリクスを表示して、パフォーマンス基準を下回るホストの切り離しに役立つ傾向を特定します。CPU ごとのトップメソッド、コンパイル時間ごとのトップメソッド、ロック待機時間ごとのトップメソッドなど、サービスからのメトリクスを相関させることにより、アプリケーションのパフォーマンスのより包括的なビューを取得できます。興味深い傾向を見つけた場合は、 こうしたグラフをカスタムダッシュボードに追加するか、機械学習ベースのアラートを作成して、異常や外れ値を即座に検出できます。"
