["https://www.datadoghq.com/blog/datadog-rum-unity-sdk"]
title = "Improve Gaming App Performance With Unity Support in Datadog RUM | Datadog"
description = "Learn how the new Datadog RUM Unity SDK enables developers to maintain and optimize the performance of their mobile games."
full_description = "Improve gaming app performance with Unity support in Datadog RUMIdentify and troubleshoot performance bottlenecksImprove the performance of your gaming app todayFurther Reading2024 Gartner® Magic Quadrant™Learn why Datadog is named a Leader for Digital Experience MonitoringDownload to learn morefeature / real user monitoring / unityAs mobile gaming evolves, players have higher expectations for seamless experiences, real-time interactions, and cross-platform accessibility. Whether you’re developing games for iOS, Android, or another mobile operating system, maintaining and optimizing the performance of your game is critical for player retention. For instance, if a mobile game becomes laggy or begins to drop frames during gameplay, players will grow frustrated and abandon the game altogether. Mobile game developers working with popular engines such as Unity must quickly identify and troubleshoot common performance issues, including crashes that interrupt gameplay, latency issues affecting multiplayer and real-time interactions, poor frame rates leading to laggy animations and sluggish controls, and long load times.Without real-time observability, identifying and resolving these problems can be time-consuming and difficult. Datadog RUM’s Unity SDK addresses these challenges by capturing real-time in-game telemetry, monitoring player interactions, tracking crashes, and correlating performance data for mobile games. With this SDK, Unity developers can optimize gameplay, improve stability, and maintain player retention by proactively addressing issues before they disrupt the gaming experience.Datadog RUM is built to fit easily into a Unity developer’s workflow, providing seamless performance monitoring and actionable insights. The diagram below illustrates how the SDK captures performance metrics, crashes, and user interaction data, which is then processed through Datadog’s backend. The processed data is then stored and made accessible through Datadog’s frontend platform, enabling real-time monitoring, visualizations, alerts, and insights.Identify and troubleshoot performance bottlenecksSetting up Datadog RUM for Unity is quick and requires little manual instrumentation. The SDK automatically records key events such as crash and error reports, monitors network requests made with UnityWebRequest, and logs scene transitions and screen loads that use SceneManager. You can install the Datadog Unity SDK with the Unity Package Manager or via OpenUPM. You’ll then need to enable Datadog within Unity’s project settings to enable monitoring features. For full setup details, refer to the Datadog Unity setup docs.After you set up the Unity SDK, real-time performance data will automatically be captured and visualized within Datadog RUM. By viewing performance data within Datadog RUM, you can get a quick overview of your Unity game’s crashes, errors, and Mobile Vitals metrics such as ANR rate, hang rate, and application startup time.You can also set alerts to notify you whenever a performance issue arises. For instance, you can set an alert to flag when your Unity game’s hang rate—the amount of time the game becomes unresponsive per hour of gameplay (measured in seconds per hour)—exceeds 5 seconds per hour.High hang rates mean that players are frequently running into lags, game freezes, or total unresponsiveness. In such an event, you can take mitigating actions such as implementing asynchronous code that enables your game to maintain responsiveness while asynchronous tasks run in the background.Improve the performance of your gaming app todayDatadog RUM’s Unity SDK helps optimize game performance, ensure player satisfaction, and boost engagement. With real-time visibility into performance data, developers can quickly detect, diagnose, and resolve issues before they impact gameplay. To learn more about how Datadog RUM unlocks the power of real-time performance insights into your Unity game, check out our documentation.And if you aren’t already using Datadog, sign up today for a 14-day free trial.Want to work with us? We're hiring!"
