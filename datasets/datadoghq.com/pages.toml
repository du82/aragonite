title = "Environmental, Social, and Governance Report | Datadog"
description = "Datadog is committed to dialogue of transparency and accountability in the ways we conduct business. Read Datadog's latest ESG report."
full_description = "Environmental, Social, and GovernanceREAD THE REPORTThe 2023 Environmental, Social, and Governance Report addresses those ESG topics that we believe our investors, employees, customers, vendors, and other stakeholders consider the most important. We look forward to reporting our progress as we further integrate sustainability into our operations.EnvironmentWe expanded our carbon footprint assessment, and are sharing our Scope 1, Scope 2, and Scope 3 emissions for 2023. In addition, we are establishing a commitment to offset 100% of our residual Scope 1 and 2 emissions for 2023 and future years. To do so, we plan to power more of our leased offices with renewable energy, where available, and to source renewable energy credits or carbon removal credits for all remaining Scope 1 and Scope 2 emissions.GovernanceESG is a key priority at Datadog, with direct oversight from the Board of Directors and management. Our board as a whole and through its committees oversees ESG governance, and is advised by the Nominating and Corporate Governance Committee (NCG Committee), which oversees the company’s ESG programs. Our Audit Committee oversees financial reporting risks, including internal controls, enterprise risk assessment, cybersecurity and privacy, and our Compensation Committee oversees company risks and policies related to compensation, recruiting, talent development, retention and diversity of our global workforce.Diversity, Equity & InclusionAt Datadog, diversity means making a conscious effort to reflect the many experiences and identities of the world outside while treating each other with fairness and without bias. Inclusion is the choice we make everyday to foster an environment where people of all backgrounds not only belong, but excel, so that we can succeed together as a company.50%of our board is composed of racially/ethnically diverse members>$1.1Mdonated by Datadog Cares, together with our employees in 2023>80%Employee survey participation and favorability scoresGiving BackAt Datadog we believe in using our resources to support our global communities. We accomplish this through our philanthropy program, Datadog Cares. We held an end of year giving campaign called the All Pack Give Back where employees allocated funds given to them by Datadog to one or more of our outlined causes. Led by our employees, this campaign alone resulted in over $500,000 given to over 75 organizations in 2023.Our commitment to reduce or offset our Scope 1 and 2 emissions is a “forward-looking” statement. See the Appendix to our ESG Report for important information regarding this commitment.Learn more in our 2023 ESG ReportREAD THE REPORT AB 1305 DISCLOSURE"
