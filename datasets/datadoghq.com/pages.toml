title = "Cookie Policy | Datadog"
description = "See metrics from all of your apps, tools & services in one place with Datadog's cloud monitoring as a service solution. Try it for free."
full_description = "This Cookie Policy (this “Policy”) describes how Datadog, Inc. (“Datadog,” “we,” “us,” or “our”) uses cookies and similar technologies (collectively, “Cookies”) on websites that link to this Policy, (collectively, the “Sites”), and how you can manage the cookie settings in your browser. A cookie is a small piece of data that is stored on your device when you visit a website. You can think of cookies as providing a 'memory' for a website in order to make the website function or work more efficiently by recognizing users and their activity over time. For instance, a cookie may be used to record where you have paused a video so that you can resume playing it from the same spot later on. Some Cookies are required for technical reasons in order for the Sites to operate, and we refer to these as “essential” or “strictly necessary” Cookies. Other Cookies enable us to track and target the interests of our users to enhance the experience on our Sites. Cookies set by Datadog are called “first-party cookies”. Cookies set by parties other than Datadog are called “third-party cookies”. Third-party cookies enable third-party features or functionality to be provided on or through the Sites. Datadog uses Cookies to help us understand the profile of our visitors, recognize when you are signed in to your account, and provide you with a better user experience. We may also use Cookies to analyze and track data, determine the popularity of certain content, deliver advertising and content targeted to your interests on our Sites, and better understand your online activity. Some content or applications on the Sites are served by third-parties that may use Cookies to collect information about you when you use the Sites. The information they collect may be associated with your personal information or they may collect information about your online activities over time and across different websites and other online services. We do not control third-party cookies or how they may be used. If you have any questions about an advertisement or other targeted content, you should contact the responsible provider directly."
