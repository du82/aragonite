ップに効果的に対処する方法に関するガイダンスを提供するように構築されています。一部のホスト用に CSM Pro を購入し、残りのホスト用に CSM Enterprise を購入することはできますか？いいえ、組織として CSM Pro または CSM Enterprise のいずれかを購入できますが、両方を購入することはできません。CSM Pro を実行するには、どのような請求プランが必要ですか？CSM Pro は、他の Datadog プランを必要とせずに購入できます。インフラストラクチャーモニタリングプランを購入する必要はありません。請求対象のホストは何をカウントしますか？ホストは、エージェントおよびエージェントレス技術を使用して Datadog で保護する物理的または仮想的なOSインスタンスをカウントします。サーバー、VM、ノード（Kubernetes の場合）、App Service Plan インスタンス（Azure App Services の場合）などがあります。どのような機能が含まれていますか？設定ミスの継続的なスキャン、コンテナイメージの脆弱性管理、クラウドリソースの完全なインベントリ、ケース管理、1 ホスト 1 ライセンスにつき 5 つのワークフロー実行。セットアップには何が必要ですか？始めるには、クラウドプロバイダーとの統合と、オプションで統合 Datadog Agent が必要です。これは誰のためのものですか？CSM Enterprise は、クラウド・インフラ全体の設定ミス、脅威、脆弱性、アイデンティティ・リスクを迅速にマッピング、特定、優先順位付けする、セキュリティ志向のチームに特化した高度なソリューションです。一部のホスト用に CSM Pro を購入し、残りのホスト用に CSM Enterprise を購入することはできますか？いいえ、組織として CSM Pro または CSM Enterprise のいずれかを購入できますが、両方を購入することはできません。CSM Enterprise を実行するには、どのような請求プランが必要ですか？請求対象の CSM Enterprise ホストには、Enterprise インフラストラクチャ・モニタリングの購入が必要です。どのような機能が含まれていますか？設定ミスの継続的なスキャン、コンテナイメージとホストの脆弱性管理、リアルタイムの脅威検出、クラウドインフラの権限管理、異常なワークロードプロファイルの検出、クラウドリソースの完全なインベントリ、ケース管理、ホストごとに 20 のワークフロー実行、ホストライセンスごとに 20 のコンテナが含まれます。すべてのCSM Enterpriseホストでインフラストラクチャ モニタリング ProまたはEnterpriseが必要です。はい。たとえば、CSM Enterprise ホストを 10 台サブスクライブする場合、それらのホストは インフラストラクチャ Pro または Enterprise ホストも 10 台サブスクライブする必要があります。これは、コミットしているホストとコミットしていないホストの両方に適用されます。セットアップには何が必要ですか？始めるには、クラウドプロバイダーとの統合と、オプションで統合 Datadog Agent が必要です。請求書にCWSとCSM Proが記載されているのはなぜですか？オンデマンドで CSM Enterprise を使用している場合、請求書には一時的に CSM Pro と Cloud Workload Security の項目が表示されます。これらの項目は年末までに移行され、CSM Enterpriseのみの項目に変更されます。請求対象のホストは何をカウントしますか？ホストは、Datadogで監視する物理的または仮想的なOSインスタンスをカウントします。サーバー、VM、ノード（Kubernetesの場合）、App Service Planインスタンス（Azure App Servicesの場合）などがあります。Cloud Workload Security (CWS) を実行するには、どのような請求プランが必要ですか？CWS は、インフラストラクチャ・モニタリングに加えて購入することができ、CSM Enterprise を購入した場合は既に含まれています。請求対象のホストは何をカウントしますか？ホストは、Datadogで監視する物理的または仮想的なOSインスタンスをカウントします。サーバー、VM、ノード（Kubernetesの場合）、App Service Planインスタンス（Azure App Servicesの場合）などがあります。コンテナや Kubernetes の