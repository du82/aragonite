["https://dataeastgames.com/p_1175"]
title = "Majesco Entertainment Announces ‘Data East Arcade Classics’ for Wii - Data East Games"
full_description = "EDISON, N.J., October 1st, 2009 - Relive the glory days of video games without the pocketful of quarters as Majesco Entertainment Company (NASDAQ: COOL), an innovative provider of video games for the mass market, today announced Data East Arcade Classics for Wii. Licensed by G-Mode and developed by G1M2, this timeless compilation features 15 arcade favorites with full multiplayer support for only $19.99. Players can now enjoy some of the best shooter, sports, puzzle and twitch action video games ever created in one convenient package. Data East Arcade Classics features 15 nostalgic titles, including: BurgerTime and its sequel, Peter Pepper’s Ice Cream Factory, Bad Dudes vs. Dragon Ninja, Burnin’ Rubber, Heavy Barrel, Caveman Ninja, Magical Drop III, Side Pocket and many more. The collection keeps the classics intact but also includes special updates for the modern gamer: players can link their high scores to their Mii and accomplish 75 different goals across the games that let them unlock a wealth of bonus material, from soundtracks to bezels. Finally, all 15 games support single player and 2-player head-to-head or co-operative multiplayer along with Wii Remote and Nunchuk, Classic Controller or GameCube controller functionality. Data East Arcade Classics for Wii is expected to release in early 2010 for a SRP of $19.99. For additional information about Majesco’s exciting line of products, please visit www.majescoentertainment.com. Majesco Entertainment Company is a provider of video games for the mass market. Building on more than 20 years of operating history, the company is focused on developing and publishing a wide range of casual and family oriented video games on Wii, Nintendo DS and other leading systems. Franchise highlights include Cooking Mama, Cake Mania® and Jillian Michaels’ Fitness Ultimatum. The company’s shares are traded on the Nasdaq Stock Market under the symbol: COOL. Majesco is headquartered in Edison, NJ and has an international office in Bristol, UK. More information about Majesco can be found online at www.majescoentertainment.com. @Majesco is on twitter or at www.twitter.com/majesco."
