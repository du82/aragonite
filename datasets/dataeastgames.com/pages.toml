["https://dataeastgames.com/page_id_146"]
title = "HISTORY - Data East Games"
full_description = "Data East (DE) began its operations on the 20th of April, 1976 by engineer Tetsu Fukuda as an electronics company and became well known throughtout the world for its video game titles. In January 1978, DE released their first videogame, Super Break which sparked 27 years in the video game industry and the release of 18 coin-op video games within Japan and 275 games worldwide. It was Fukudas engineering experienced that led DE to begin developing the DECO cassette system. This new system which would enable an arcade owner to continue using existing Data East game cabinets as DECO game cassette tapes could be removed and replaced thus eliminating the expense of replacing the entire cabinet. DE was promising a supply of over ten originial videogames per year with this new hardware. In 1982, DE would develop the wildly successful titles Burgertime and Bump ‘N’ Jump in August and November respectively, games that would go on to rival the current videogame phenoms of the time; Ms Pac Man, Galaga and Donkey Kong. The same year DE would enter the consumer videogame market with the release Burgertime, Bump ‘N’ Jump and Lock ‘N’ Chase on the Atari 2600 amongst other computer and videogame platforms. In 1983, DE was thriving shipping over 35,000 DECO Cassettes systems, boasting over 70 game developers, 4 DE office buildings including a 7 story facility in Tokyo, a R&D and administrative HQ and a new manufacturing plant already busy assembling DECO cassette systems. Unfortunately for DE, in 1984 the DECO cassette system was being slowly phased out for the more basic arcade boards due to growing complaints about the systems vulnerability to erasure and corruption. DE also began receiving some criticism for some of their sub-par game releases. Yet, between 1983 and 1985, DE would continue productions at a staggering rate, releasing 37 games including the highly revered Karate Champ, the first 1on1, hand to hand fighting game. DE would sign a Licensing agreement with Nintendo and become one of the first third-party publishers for the then emerging Super Famicon/NES system. The Nintendo DE partnership proved extremely lucrative, beginning with the Tag Team Wrestling game release in October 1986. Due to the partnership, DE was now bringing in $100 million annualy, 10 times the subsidiarys prior total annual sales. The partnership brought later bestsellers such as Breakthru, the aforementioned Burgertime, Cobra Command, Karate Champ, Karnov, Slide Pocket and RIng King."
