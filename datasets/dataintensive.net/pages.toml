["https://dataintensive.net/poster.html"]
title = "The poster to accompany Designing Data-Intensive Applications (DDIA)"
full_description = "Each chapter in Designing Data-Intensive Applications is accompanied by a map. And we’ve turned those maps into a beautiful poster. Designing Data-Intensive Applications contains something very unusual for a computing book: every chapter is accompanied by a map. It is drawn in the style of a geographic map, but it is actually a graphical table of contents for the chapter, showing the key ideas and how they relate to each other. Don’t take it too seriously — some of it is a little tongue-in-cheek, we have taken some artistic license, and the things included on the map are not exhaustive. But it does reflect the structure of the chapter: political or geographic regions represent ways of doing something, and cities represent particular implementations of those approaches. Similar things are more likely to be close together, and roads or rivers represent concepts that connect different implementations or regions. Most computing books describe one particular piece of software and discuss all the aspects of how it works. Designing Data-Intensive Applications is structured differently: it starts with the concepts — discussing the high-level approaches of how you might solve some problem, and comparing the pros and cons of each — and then points out which pieces of software use which approach. The maps use the same structure: the region in which a city is located tells you what approach it uses. In both the print and ebook editions of the book, the map for each chapter appears at the start of each chapter. However, we have also gone further: we have taken all the maps from the individual chapters, and assembled them into a poster — an archipelago of islands representing technologies in the sea of distributed data. You can download a JPG file of this poster for free (for your personal, non-commercial use only). In September 2017 I ran a Kickstarter campaign to finance a print run. That campaign was successful, and backers of the campaign have received their posters."
year_published = 2025
