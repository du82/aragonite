full_description = "The NJ Department of Children and Families (DCF), Office of Applied Research and Evaluation (OARE) seeks a Research Scientist 2, who under general supervision of a Research Scientist 1 or other supervisory official, conducts research projects or participates in functional programs; assumes appropriate administrative and scientific duties as delegated; heads complex projects and makes recommendations to the supervisor; does related work. This position is located in Trenton, NJ and may be eligible to work remotely for up to two days in a calendar week. This position will support the development of tools and methodologies to monitor the quality and fidelity of service delivery among DCF’s contracted service providers. Anticipated tasks include: * Work with a team of research staff to design, implement and maintain a system to monitor quality and fidelity of contracted service providers in partnership with DCF’s Office of Monitoring. * Support the design of valid and reliable monitoring tools, including case record review, site visit, participant interview and referent interview tools. * Work closely with the leadership team in the Office of Monitoring and Office of Data Management and Reporting to develop monitoring processes and procedures and perform related project management duties. * Work with program partners to understand the service models, contract requirements and existing data collection for programs that will be monitored. * Review relevant academic and national literature related to monitoring quality of services to identify best practices and provide scientific advice. * Participate in the design and build out of systems for collection and reporting of monitoring data. * Assist with developing and delivering training on use of the monitoring tools for Office of Monitoring staff. * Provide technical input on the production of provider scorecards with data collected by the Office of Monitoring. * Interpret analyses and communicate results to senior leadership and program partners, as appropriate."
