title = "Director of Data Labs job at Pew Research Center | DataJobs.com"
full_description = "Pew Research Center (“the Center”), a nonpartisan fact tank that informs the public about the issues, attitudes, and trends shaping the world, seeks an experienced and innovative leader to serve as its next Director of Data Labs. This role presents an exciting opportunity to shape the future of research at one of the nation’s most respected institutions. The Center conducts demographic research, public opinion polling, media content analysis, and other empirical social science research in the areas of U.S. politics and policy views; media and journalism; internet and technology; religion and public life; Hispanic trends; global attitudes; and U.S. social and demographic trends. The Center does not take policy positions, and among its core values are independence, objectivity, accuracy, rigor, humility, transparency, and innovation. More information about the Center is available at www.pewresearch.org. In response to the changing nature of data on human behaviors and attitudes, the Center created Data Labs in 2015 to explore the emerging field of computational social science (CSS), which applies data science methods to social science research questions. Data Labs uses CSS to complement and expand on the Center’s existing research agenda. The Center’s long-term objectives for Data Labs are to integrate CSS among research teams across the Center and to build the Center’s external reputation as a leader in applying CSS to practical research questions. To achieve these goals, the Center seeks a Director with a combination of highly developed technical skills, including CSS expertise, as well as leadership and management experience in a rigorous research environment. Strong candidates will have a track record of building partnerships and relationships with multiple stakeholders both inside and outside an organization; recruiting and developing a high-performing, technically skilled team; superb judgment and focus; and exceptional communication skills and credibility when communicating with external audiences. A Masters, PhD, or other terminal degree with a strong quantitative focus is required."
