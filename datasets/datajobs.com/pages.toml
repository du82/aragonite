full_description = "Boston Architectural College (BAC) has launched a new strategic plan that envisions the BAC as a global network for design education and design literacy, with virtual aerial roots that capture social differences and facilitate the learning of the curious, the creative, the ambitious, the exemplary traditional and nontraditional students irrespective of social identities and geographic location delivering on our educational mission of diversity and inclusion to help our students fully actualize their potential. To accomplish our plan, the BAC will transform over the next five years into a robust and growing institution whose educational innovations become models emulated across the higher education spectrum. Critical to the success of this plan is the design and development of a robust data and analysis strategy that will facilitate the use of data for strategic, operational, research, and decision support consistently across the institution. This includes designing new advanced models to measure the BAC’s social and intellectual value and strategic outcomes. This position, as well as the function, is new at the BAC. As a result, we are seeking a strong leader with an entrepreneurial spirit, who is interested in designing a new approach to data analysis and building a new function. In addition, the individual needs to be comfortable performing this role as a department of one at the beginning, working toward a longer-term strategy while ensuring that minimum required regulatory reporting is maintained. The Data & Analytics Officer (DAO) is the senior executive responsible for supporting the effective use and analysis of internal and external data at the BAC in support of the colleges strategic plan, operational and research goals, and regulatory reporting requirements. As chief data and analytics strategist for the college, the DAO oversees the data governance and policy infrastructure necessary. The DAO must be able to work collaboratively with the BACs leadership and management teams to facilitate the design and development of effective data analysis models, including strategic goal measures, KPIs, and dashboards to support the achievement of the BACs strategic plan, enable data-informed decision making, and support operational and research needs. The DAO will promote a culture that relies upon data to assess the effectiveness of all programs, services, and processes as well as the college's overall progress in reaching its strategic goals. To that end, the DAO should be adept at telling stories with data and using data for visualization. The DAO will work with university data stewards and with IT professionals responsible for the implementation and management of the technology infrastructure to build and sustain an enterprise data strategy that can help the BAC achieve its goals. The DAO will be a key player in establishing and sustaining a campus-wide data governance infrastructure that fosters a culture of trust and shared responsibility for the ethical use of data for institutional strategic purposes."
