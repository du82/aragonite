title = "Data Engineer job at Achievement Network (ANet) | DataJobs.com"
full_description = "Every student deserves opportunities in life, and every educator committed to providing those opportunities, deserves support. Those beliefs drive us to work alongside schools to support great teaching so that we can work towards guaranteeing that all students are receiving high quality instruction. We partner with over 900 schools - both district and charter - in underserved communities around the country, thus impacting more than 330,000 students. Third-party evaluations confirm that when schools have the right basic conditions in place and partner with ANet, they achieve 6-8 months of additional learning over a two-year period compared to schools not partnering with ANet. At ANet we are committed to living out our core values, both across our organization and with our partner schools. We acknowledge that systemic inequities impact student access to opportunities and that in order to ensure educational equity for all students, we must center on the experiences of those from marginalized communities to guide our work. We work to deepen our understanding of how race, class, power and privilege influence the education system as well as influence our own perspectives. To do so, we provide ongoing learning opportunities through org-wide professional development, affinity groups, working groups, and resource sharing. Individuals who join ANet have the opportunity to be part of a dynamic, values driven, and team-oriented organization that is committed to having impact in schools by investing in each other and learning together. We were named as The NonProfit Times “Best Nonprofits to Work For” and work tirelessly to foster a working environment where the unique perspectives, backgrounds, and identities of our staff members are valued. We are seeking a Data Engineer to join ANet's Data & Analytics Team, reporting directly to the Vice President, Data & Analytics. The Data Engineer will own the maintenance, improvement, cleaning, manipulation, and ETL of data in ANet's analytic databases. Working with a cross-functional team of data scientists, analysts, dashboard builders and software engineers, the Data Engineer will understand and implement database requirements, analyze performance, and troubleshoot any issues -- all with the end-goal of defining and building robust data pipelines that enable faster, better, data-informed decision-making to accelerate outcomes for ANet's partner schools and students."
