full_description = "Founded in 2018, Lever Data is based in Midtown Manhattan and serves a customer base of hedge funds. Lever Data maintains, validates, and monitors third-party data feeds, working with data vendors to respond to any errors. Lever Data facilitates transparency and reliability in the quantitative investing data supply chain, allowing data users to refocus. Lever Data was formed by an experienced management team, with successful prior exits, and backed by a few of the world’s largest hedge funds, to solve some of the most challenging problems in data analytics and data-driven insights. Because of our strong backers, who are both investors and potential customers, we are well-funded and able to build exciting solutions with full collaboration from our intended end users – a privileged position to be in, where you will enjoy the best of the startup life and stability uncommon for ordinary startups. Technically, you will be one of the principals responsible for architecting and building a new platform by leveraging a wide variety of technologies and services, including cloud providers like AWS. You will deliver a solution capable of processing large volumes of heterogenous data, to provide analytics and insights to aid with research, investment and operations. This position will offer an attractive salary, a substantial stock grant, and a significant upside in terms of career growth and influence. For the right person, this is a once in a lifetime opportunity. We are seeking a rare kind of individual, who can zoom out to the big picture, both from a technical architecture, and from a technical strategy perspective, and zoom in to details of the implementation while fussing over the code quality, hygiene, and maintainability. You will be one of the key team members responsible for setting standards, culture, mentorship of other team members, and shipping high quality solutions. You aim to bring clarity and energy to the team, and to your work environment