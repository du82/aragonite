title = "Data Privacy Lab"
full_description = "Technology Science How technology impacts humans. theDataMap Where your data goes. aboutMyInfo Is your data unique? MyDataCan Your data under your control. DataTags Compliant data sharing. Privacert HIPAA Certification of data. ForeverData Preserve temporal data. SnapIt™ Preserve a web page as it appears today. The Data Privacy Lab is dedicated to creating technologies and related policies with guarantees of privacy protection while allowing society to collect and share private (or sensitive) information for many worthy purposes. We do this by partnering with institutions, agencies, and corporations facing real-world privacy concerns. The Data Privacy Lab seeks balanced, integrated solutions that weave technology and policy together."
