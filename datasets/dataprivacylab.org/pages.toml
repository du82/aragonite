["https://dataprivacylab.org/about.html"]
title = "About the Data Privacy lab"
full_description = "The overall objective of the Data Privacy Lab is to provide intellectual leadership to society in shaping the evolving relationship between technology and the legal right to or public expectation of privacy in the collection and sharing of data. The Data Privacy Lab is inspired by the astonishing proliferation of public information made available on the Internet and by recent access to inexpensive, fast computers with large storage capacities. Most data holders do not even realize the jeopardy at which they place financial, medical, or national security information when they erroneously rely on existing or past security practices. Technology has eroded common protections, leaving the information vulnerable. In the past, a person seeking to reconstruct private information was limited to visiting disparate file rooms and engaging in the labor-intensive review of printed material in geographically distributed locations. Today, one can access voluminous worldwide public information using a standard handheld computer and ubiquitous network resources. Thus, from seemingly innocuous anonymous data and available public and semi-public information, one can draw an electronic image of a person or organization that is as identifying and personal as a fingerprint, even when the information contains no explicit identifiers, such as a name or phone number. However, one cannot seriously propose that all information with any links to sensitive information be suppressed. Society has developed an insatiable appetite for all kinds of detailed information for many worthy purposes, and modern systems tend to distribute information widely. A goal of the Data Privacy Lab is to inform on-going discussions and to assess and propose balanced approaches in which data can be shared but in which inferences about the identities of people and organizations contained in the released data cannot reliably be made. In this way, information that is practically useful can be shared freely with guarantees that it is sufficiently anonymous and declassified."
year_published = 2025
