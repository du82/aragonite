full_description = "Corporate, non-profit and government partnership is intended as a low-cost mechanism for partners to learn more about data privacy problems and solutions, to gain access to Data Privacy Lab faculty and students and to obtain a rapid turnaround study by Data Privacy Lab researchers specific to the partner�s needs. Some organizations may become Data Privacy Lab partners for affiliation purposes and to receive internal publications. A turnaround project is not required. All partnerships and turnaround projects in the Data Privacy Lab are subject to the Partnership Terms and Conditions Statement. The Data Privacy Lab and Harvard University reserve the right to refuse to accept any partnership or project. These are just a few examples of the kinds of turnaround projects possible through the Data Privacy Lab. If the results of any of these appear promising, the corporate, non-profit or government partner may choose to fund a more targeted research effort on this topic, or may join with the Data Privacy Lab to find a source of funding."
