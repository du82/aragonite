full_description = "Newsroom Press Releases DataRobot Listed in AWS “ICMP” for the U.S. Federal Government DataRobot Listed in AWS “ICMP” for the U.S. Federal Government February 4, 2025 DataRobot is now available to U.S. Government Customers in ICMP February 4, 2025 — BOSTON — DataRobot, the provider of AI that makes business sense, today announced that it is listed in the AWS Marketplace for the U.S. Intelligence Community (ICMP). ICMP is a curated digital catalog from Amazon Web Services (AWS) that makes it easy to discover, purchase, and deploy software packages and applications from vendors that specialize in supporting government customers. DataRobot is transforming how federal organizations approach and adopt AI. With a unified approach for developing, delivering, and governing AI assets — regardless of where they were built or deployed — federal teams have command of their entire AI landscape. Built-in AI observability, governance, and security features enable agencies to align all their AI initiatives to achieve mission objectives and meet regulatory requirements, today and in the future. “As the adoption of AI grows and becomes increasingly critical, we are excited to leverage the AWS Marketplace to provide the federal government with a turnkey AI solution that drives faster time to results,” said John O’Leary, Director of Federal, DataRobot. “With over a decade of experience working with federal agencies, DataRobot is proud to deliver AI for mission-critical objectives with maximal impact and minimal risk.” To learn more, visit datarobot.com/solutions/public-sector/. About DataRobot DataRobot delivers AI that maximizes impact and minimizes business risk. Our platform and applications integrate into core business processes, so teams can develop, deliver, and govern AI at scale. DataRobot empowers practitioners to deliver predictive and generative AI, and enables leaders to secure their AI assets. Organizations worldwide rely on DataRobot for AI that makes 