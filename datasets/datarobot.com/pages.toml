["https://www.datarobot.com/jp/newsroom/press/datarobot-acquires-agnostiq-to-accelerate-agentic-ai-application-development"]
title = "DataRobot、Agnostiqを買収し、AIエージェントの開発を加速 | DataRobot"
description = "「AIをビジネスの力に」を掲げるDataRobotは、Agnostiqとそのオープンソース分散コンピューティングプラットフォームであるCovalentを買収したことを発表しました。この買収により、DataRobotは高度なコンピューティングオーケストレーションとその効率化をさらに強化し、より高度なAIエージェントの開発を加速させます。"
full_description = "ニュースルーム DataRobot、Agnostiqを買収し、AIエージェントの開発を加速 DataRobot、Agnostiqを買収し、AIエージェントの開発を加速 2025年2月14日 本内容は2月10日にグローバルで発表されたプレスリリースの抄訳版です。 「AIをビジネスの力に」を掲げるDataRobotは、Agnostiqとそのオープンソース分散コンピューティングプラットフォームであるCovalentを買収したことを発表しました。この買収により、DataRobotは高度なコンピューティングオーケストレーションとその効率化をさらに強化し、より高度なAIエージェントの開発を加速させます。 最近の調査によると、組織はビジネスニーズをエージェント型AIアプリケーションに変換し、断片化されたツールや環境でこれらのアプリケーションを管理するのに苦労しています。そのため企業は、AIエージェントを複数のインフラやコンピューティング環境に展開できる柔軟性と、可用性、コスト、パフォーマンスに基づいてエージェントを動的に管理できる能力を必要としています。 DataRobotのChief Executive OfficerであるDebanjan Sahaは次のように述べています。「企業はAIエージェントの時代に移行することを熱望していますが、サイロ化されたインフラストラクチャとツールによって妨げられています。この運用上の複雑さは、持続可能でもスケーラブルでもありません。今回のAgnostiqとの統合によって、AIチームはコンピューティング環境全体でAIエージェントをインテリジェントかつ費用対効果の高い方法で開発および管理し、ビジネスに具体的な結果をもたらすことができます」 今回の買収によって、AIエージェントの開発が急速に進みます。 AIデプロイを加速する異種計算オーケストレーション CPU、GPU、NPUなどのマルチクラウド、オンプレミス、ハイブリッド構成のコンピューティング環境全体にAIワークロードを展開、スケーリング、および管理します。 run:ai、Slurm、Nomad、K8sなどのクラスター全体を調整して、エージェント型AIアプリケーションを実行します。 リソースが動的に割り当てられることによって、インフラストラクチャが最高の価格性能でビジネスニーズをサポートするようにスケーリングします。 AIインフラストラクチャの複雑さとコストの削減 リソースとコンピューティングの効率的な共有とパーティション分割を利用して、特殊な大規模AIワークロードのコストを削減します。 AIの構築、ファインチューニング、展開、およびエージェントフローのための単一プラットフォームを通じて、移行コストをかけずにAIツールを合理化します。 ルールを構成して、コストとレイテンシーのしきい値を設定したり、優先順位のキューを作成して、ビジネスユースケースに合わせて調整された価格とパフォーマンスを最適化したりします。 より優れたツールとインフラストラクチャの柔軟性のためのオープンで不可知論的なアプローチ 5,000人のユーザーからなる確立されたオープンソースコミュニティを活用します。 ベンダーロックインを回避し、インフラストラクチャを適応させ、効率的にスケーリングします。 既存のインフラストラクチャと統合して、ますます自律的なマルチモーダルエージェントを構築します。 AgnostiqのChief Executive OfficerであるOktay Goktasは次のように述べています。「Covalentの高度なコンピューティングオーケストレーションにより、DataRobotと共に歩んでいけることを嬉しく思います。コミュニティがシームレスなスケーラビリティと効率性で、画期的なAIソリューションを迅速に構築および、展開できるよう協力して取り組んでいきます」 Agnostiqは、業界をリードするAIインフラストラクチャ管理とコンピュートオーケストレーションプラットフォームであるCovalentを開発しています。Covalentを利用することで、企業は動的なリソース割り当てによってAIデプロイメントを容易に拡張し、インフラストラクチャの効率的な利用によってコストを削減し、ユーザーフレンドリーなインフラストラクチャの抽象化によってAIアプリケーションの開発を加速することができます。Covalentは14万以上のダウンロード数を誇り、世界中の主要なチームや組織から信頼されています。 詳細については、こちらのブログ「AIエージェント：現実のビジネスへの影響、エンタープライズ対応のソリューション」もご覧ください。 DataRobotについて DataRobotは、ビジネスリスクを最小化し、インパクトを最大化するAIを提供します。当社のAIアプリケーションとプラットフォームは、主要な業務プロセスに統合され、お客様がAIを大規模に開発、運用、管理できるよう支援します。DataRobotは、実務者が予測AIおよび生成AIを提供できるようにし、リーダーがAIアセットを保護することを可能にします。世界中の組織が、今日も未来もビジネスにとって価値のあるAIを求め、DataRobotを信頼しています。 投稿をシェアする 他の ニュースルーム 注目 News プレスリリース すべてを表示 リソース News DataRobot、「Enterprise AI Suite」を発表–生成AIアプリの開発・提供を統合支援 続きはこちら プレスリリース 年頭所感：真に「AIをビジネスの力に」変えるために プレスリリースを読む News 真に「AIをビジネスの力に」変えるために–DataRobot Japan・馬場氏 続きはこちら News DataRobot、「Enterprise AI Suite」を発表–生成AIアプリの開発・提供を統合支援 続きはこちら プレスリリース 年頭所感：真に「AIをビジネスの力に」変えるために プレスリリースを読む News 真に「AIをビジネスの力に」変えるために–DataRobot Japan・馬場氏 続きはこちら すべての ニュースルーム を見る"
