oked elsewhere. Craig Civil Director of Data Science & AI // Dynamically load the Marketo Forms2 library const script = document.createElement('script'); script.src = "//page.datarobot.com/js/forms2/js/forms2.min.js"; script.onload = function () { // Ensure the Forms2 library has loaded before proceeding if (typeof MktoForms2 === 'undefined') { console.error('MktoForms2 library did not load.'); return; } // Load the Marketo form MktoForms2.loadForm( '//page.datarobot.com', // Marketo instance domain '229-XUK-217', // Munchkin ID 1077, // Form ID function (form) { // Attach success handler to the form form.onSuccess(function (values, followUpUrl) { console.log('Form submitted successfully:', values); window.location.href = 'https://www.datarobot.com/resources/what-ai-tools-arent-delivering-for-ai-leaders/thank-you/'; // Prevent default Marketo success behavior return false; }); } ); }; // Append the script to the document document.head.appendChild(script);'''
