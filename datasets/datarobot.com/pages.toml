full_description = '''About DataRobot Headquartered in Boston with a global team, we’re on a mission to make business better with AI. Since our founding in 2012, DataRobot has pioneered some of the most important applied technological advancements in AI and machine learning, from inventing AutoML and Automated Time Series to trailblazing MLOps and generative AI. More than 1,000 organizations worldwide — including BCG, Boston Children’s Hospital, FordDirect, Old Mutual, Razorpay, and the U.S. Army — rely on DataRobot for AI that makes sense for their business, today and for the future. Explore customer stories document.addEventListener('DOMContentLoaded', function () { const urlParams = new URLSearchParams(window.location.search); // Check if the `debanjan-video` query parameter is present if (urlParams.has('debanjan-video')) { // Select the <a> element that triggers the modal const modalTrigger = document.querySelector('a[data-type="iframe"]'); if (modalTrigger) { // Use a small delay to ensure everything is ready setTimeout(() => { // Simulate a click on the modal trigger modalTrigger.click(); }, 500); // Adjust delay if necessary } } }); Leadership Team Debanjan Saha Chief Executive Officer Debanjan Saha Chief Executive Officer As the Chief Executive Officer at DataRobot, Debanjan Saha works to make businesses better with AI. Debanjan is a visionary technologist and the co-author of over 50 patent applications with twenty years of product, engineering, and operational leadership experience (Google, Amazon Web Services, and IBM). He is also a Fellow of the Institute of Electrical and Electronics Engineers (IEEE) and a Distinguished Member of the Association for Computing Machinery (ACM). Amy Suchanek Chief People Officer Amy Suchanek Chief People Officer As the Chief People Officer at DataRobot, Amy Suchanek drives strategies and programs that unlock team potential. Prior to DataRobot, Amy led people teams at two tech startups and spent more than fifteen years in people roles (Reebok and adidas Group). Her experience spans a variety of company sizes and stages, industries, and regions, including the United States, Germany, and Hong Kong. Brian Brown Chief Legal Officer and Chief Financial Officer Brian Brown Chief Legal Officer and Chief Financial Officer As the Chief Legal Officer and acting Chief Financial Officer at DataRobot, Brian Brown is responsible for all financial and legal affairs, including financial planning, accounting, investor relations, corporate governance and compliance, and global legal matters. Before DataRobot, Brian held roles as Associate General Counsel and Head of Corporate Legal (DoorDash) and Executive Vice President and General Counsel (Ellie Mae). Brian also has extensive experience as a corporate attorney at several international law firms. Jay Schuren Chief Revenue Officer Jay Schuren Chief Revenue Officer As the Chief Revenue Officer at DataRobot, Jay Schuren drives global growth and business impact for customers. Prior to DataRobot, Jay held field CTO and data science roles (Nutonian) focused on empowering users to identify and understand high-value patterns in data. Jay’s technical experience includes developing and deploying thousands of AI/ML models across a variety of Fortune 500 companies and industries. Kelly Fiedler Chief Marketing Officer Kelly Fiedler Chief Marketing Officer As the Chief Marketing Officer at DataRobot, Kelly Fiedler leads global marketing efforts spanning brand and creative, product marketing, communications, demand generation, and marketing operations. Before DataRobot, she redefined go-to-market strategies and drove significant growth as CMO and VP of Marketing (Expel, RSA Security, and Aveksa). Kelly’s experience includes elevating brands and driving value for both publicly traded companies and emerging startups. Michael Schmidt Chief Technology Officer Michael Schmidt Chief Technology Officer As the Chief Technology Officer at DataRobot, Michael Schmidt leads an advanced research and development team focused on pioneering AI technologies. He joined DataRobot in 2017 as part of the acquisition of an ML company he founded and led (Nutonian). As an AI researcher, Michael created the first AI for discovering laws of physics in experimental data and was recognized as a top data scientist by Forbes. Venky Veeraraghavan Chief Product Officer Venky Veeraraghavan Chief Product Officer As Chief Product Officer at DataRobot, Venky Veeraraghavan drives the definition and delivery of the DataRobot Enterprise AI Suite. Venky has twenty-five years of experience focusing on big data and AI as a product leader and technical consultant at top technology companies (Microsoft) and early-stage startups (Trilogy). Prajakta Damle Senior Vice President, Product Prajakta Damle Senior Vice President, Product Prajakta Damle is the Senior Vice President of Product at DataRobot. She leads product, design, and documentation teams at DataRobot, driving product strategy, definition, and delivery of the enterprise AI suite. Prajakta is a seasoned product leader who has spent her career driving growth and impact in leading technology companies (Google Cloud, AWS). Amit Purohit Senior Vice President, Engineering Amit Purohit Senior Vice President, Engineering Amit Purohit is the Senior Vice President of Engineering at DataRobot. Amit is a seasoned engineering leader in the enterprise, cloud, data, and AI industries who has spent his career driving growth and impact in some of the most successful technology companies in the world (AWS, Meta). Rae Naidoo Senior Vice President, Strategy and Operations Rae Naidoo Senior Vice President, Strategy and Operations Rae Naidoo serves as the Senior Vice President of Strategy and Operations at DataRobot. Rae leads the corporate strategy and development, revenue and business operations, and enterprise applications. Prior to DataRobot, Rae worked as a consultant at McKinsey where he led AI and digital transformation strategies and at AI startups. Board of Directors Debanjan Saha Chief Executive Officer Tracey Newell Chairperson of the Board Jai Das Managing Director, Sapphire Ventures Tony Florence General Partner, NEA Dr. Amit Sinha CEO, DigiCert | Board Member Zscaler Investors We’re hiring! Take the first steps to transform your career. Join us'''
