/b> open positions in <b>{location}<\/b>","view_dept_pos":"Viewing <b>{number}<\/b> {department} position in <b>{location}<\/b> | Viewing <b>{number}<\/b> {department} positions in <b>{location}<\/b>","button_view":"Currently no open positions | View <span>{number}<\/span> open position | View <span>{number}<\/span> open positions","featured_locations":"Major Offices","start_typing":"Start typing to see autocomplete options","show_locations_around":"Show open positions near me.","show":"Show","location_found":"Looks like you are located near <b>{location}<\/b>.","location_closest":"The closest DataRobot location to you is <b>{location}<\/b>.","click_to_show":"Click to show all open positions in this location.","job_not_found":"Job not found.","job_expired":"This job may have been taken down.","search_again":"Please search again","explore_positions":"Explore our Open Positions","core_values":"Our Core Values","core_values_text":"Together, we cultivate an exceptional people and team experience where we all belong, feel inspired to engage and are empowered to grow."},"department":{"sales":"Sales","data_science":"Data Science","business":"Business","product":"Product","marketing":"Marketing","engineering":"Engineering","operations":"Operations","customer_success":"Customer Success","enterprise-security":"Enterprise Security"},"continent":{"na":"North America","sa":"South America","asia":"Asia","europe":"Europe","oceania":"Oceania","africa":"Africa"}}}}; var careers_data = {}; careers_data.locale = "en"; careers_data.page = {"ID":60979,"post_name":"open-positions","post_title":"Open Positions","post_content":"<!-- wp:html -->\n<style>\n#careers .dr-divider-gray-1:after,\n#bottom > div.uk-section.uk-section-default.uk-padding-3xlarge-top {\n display: none;\n}\n<\/style>\n<!-- \/wp:html -->","image":false,"benefits":{"title":"","items":false}}; careers_data.departments = [{"ID":30232,"post_name":"business-operations","post_title":"Business Operations","post_content":"The Business Operations department plays a vital role in the strategic management of business units, teams\u2019 alignment, setting goals, and process improvement within DataRobot. We look at each part of the company and provide feedback from multiple angles to avoid biases. We work across departments to help business owners make decisions on how to effectively execute various business functions like generating sales pipeline, marketing, product, etc. Each business has its own set of measurements for implementing best practices to maximize operational effectiveness.","dept_ID":"biz-ops-group"},{"ID":11140,"post_name":"customer-success","post_title":"Customer Success","post_content":"The Customer Success team helps our customers to implement mission-critical AI systems, and realize business value through their investment in DataRobot. We ensure our customers achieve their desired outcomes while using our product. Product adoption will determine success as measured by client usage, retention, expansion, and revenue. The Customer Success function exists to make the product more compelling and ultimately to maximize the lifetime value of a customer. DataRobot wants to transform every business into a Value-Driven AI Enterprise, and Customer Success is one of the pivotal teams in that mission.","dept_ID":"customer-success-group"},{"ID":47391,"post_name":"deal-desk","post_title":"Deal Desk","post_content":"The core purpose of our Deal Desk domain is accelerating deal processing by enabling the success and achievement of corporate goals through sales process optimization, contract negotiation, deal structure guidance\/reviews, and operational support. We partner with sales and revenue teams to help them understand what is needed more to execute a deal by making things standard, simpler, and easier to do or providing assistance with more complex scenarios.","dept_ID":"deal-desk-group"},{"ID":10007,"post_name":"engineering","post_title":"Engineering","post_content":"Our Engineering department consists of distributed cross-functional teams that own various parts of DataRobot\u2019s machine-learning platform and actively contribute to the development of new capabilities. As a core fundamental department, upon which the company was built, we play a vital role in bringing technical expertise to the organization. Our individuals represent some of the industry's brightest and most innovative minds in a variety of domains like Data Science, Front-end and Back-end engineering, Global Platforms, and many others. We work on multiple aspects such as software development, system architecture, database management, and technology infrastructure to enable the next generation of AI.","dept_ID":"engineering-group"},{"ID":47392,"post_name":"executive","post_title":"Executive","post_content":"The DataRobot leadership team is made up of visionaries, data scientists, and seasoned veterans with experience building world-class companies that drive value and change the face of technology.","dept_ID":"executive-group"},{"ID":11143,"post_name":"operations","post_title":"Facilities","post_content":"Our Facilities department plays a critical role in managing and maintaining the workplace environment. We oversee a range of responsibilities including facility planning and ensuring that the office space and infrastructures are functional and well-maintained to enable employees to perform their work effectively and contribute to the company's success.","dept_ID":"facilities-group"},{"ID":47393,"post_name":"finance","post_title":"Finance","post_content":"The Finance department combines financial expertise with a deep understanding of the technology industry. It plays a crucial role in managing the financial aspects and has the opportunity to inform and influence strategic business decisions. Our specialists are responsible for overseeing and optimizing the company\u2019s financial resources, ensuring financial stability, analyzing and visualizing data in financial modeling, as well as supporting the company\u2019s growth and profitability. Working closely with multiple decision-makers, including executive and engineering teams, we are helping to drive financial excellence and build the foundation for developing useful business insights, enhancing sustainable growth, and contributing to the overall success of the organization.","dept_ID":"finance-group"},{"ID":47394,"post_name":"it","post_title":"IT","post_content":"Our IT department is on a mission to build, support and maintain our corporate infrastructure. We are also responsible for building automated auto-provisioning and centralized authentication systems. We ensure corporate systems have proper backups and proper recovery procedures. With our expertise and support, we contribute to the overall efficiency, productivity, and security of the organization's IT infrastructure, enabling seamless operations and empowering employees to leverage technology effectively.","dept_ID":"it-group"},{"ID":47395,"post_name":"legal","post_title":"Legal","post_content":"The Legal department plays a significant role in ensuring legal compliance, mitigating risks, and protecting the company's interests. We provide guidance and support in various legal matters, including the negotiation of complex software license agreements, intellectual property, data privacy, and regulatory compliance. We license our software as both on-premises and software-as-a-service to customers worldwide.","dept_ID":"legal-group"},{"ID":10006,"post_name":"marketing","post_title":"Marketing","post_content":"The thoughtful and knowledgeable skills of talented marketing professionals are required to bring our message to the world: use our AI solutions to solve your most complex business problems. \r\nOur Marketing team includes creators of changes and product marketing gurus, who participate in communications, content, demand planning, events, and digital and product marketing. We develop marketing plans and implement corporate campaigns to create brand awareness and pipelines in global markets. We\u2019re ready for the challenge. Are you?","dept_ID":"marketing-group"},{"ID":15987,"post_name":"people","post_title":"People","post_content":"The People team is responsible for creating a healthy and productive workplace that attracts, retains, supports, engages, and develops top talent. Our People Team is passionate about HR, from recruiting to employee management and retention with a focus on employee satisfaction and well-being. There is an emphasis on training and development, succession plans, diversity and inclusion, and employer branding.","dept_ID":"people-group"},{"ID":11141,"post_name":"product","post_title":"Product","post_content":"We are on a pivotal journey to develop a platform that radically changes the way customers use machine learning. Our Product team included talented people who design, develop and launch the product after understanding our user needs. We are responsible for the strategic vision of our product developing new features and evolving product improvements from ideation to implementation. We also build and lead mission-critical processes, develop data-driven approaches, and drive excellence deep into the product.","dept_ID":"product-group"},{"ID":11852,"post_name":"sales","post_title":"Sales","post_content":"The DataRobot Sales team has a powerful impact on the company\u2019s bottom line \u2014 and not just on our own company. The Revenue team also impacts our clients who see extraordinary ROI from our products. Our people sell an industry-defining solution that has the power to change outcomes for organizations all over the globe. And they're backed by a passionate team of top engineering and support professionals who help close complex deals. We provide valuable insights to inform strategic decision-making and drive revenue growth.","dept_ID":"sales-group"},{"ID":13162,"post_name":"enterprise-security","post_title":"Security","post_content":"Our Mission is to Protect DataRobot\u2019s digital assets by building a state-of-the-art Enterprise Security program driven by all our people, that addresses evolving cyber and information security risks, enables an agile business strategy, and uses innovative technologies.","dept_ID":"security-group"},{"ID":11142,"post_name":"data-science","post_title":"Training","post_content":"As a Training Department, we believe that continuous professional growth is one of the pivotal components of employees' success. With a focus on enhancing the capabilities and improvement of individual and team performance, we are responsible for designing and delivering innovative, high-impact training programs and learning solutions aligned with the DataRobot strategic goals.\r\nWe ensure effective learning and development initiatives target essential skills and behaviors that drive learners' progress and meet business needs while integrating the company culture throughout. ","dept_ID":"training-group"}]; careers_data.locations = [{"ID":10008,"post_name":"boston","post_title":"Boston, MA, USA","post_content":"As the headquarters for DataRobot, our Boston office is home to several hundred people who work in Engineering, QA, Data Science, Sales, Marketing, Human Resources, Operations, and Customer Success. Located in the heart of the city, we pride ourselves on a collegial and collaborative workplace that includes daily catered lunch and dinners and an open office environment.","location_ID":"boston-ma-us"},{"ID":11858,"post_name":"columbus-oh-usa","post_title":"Columbus, OH, USA","post_content":"Our Columbus office has grown due to acquisition, and we expect it to be a strategic location for future growth of the company, especially in R&D.","location_ID":"columbus-oh-us"},{"ID":11864,"post_name":"kopenhagen-denmark","post_title":"Copenhagen, Denmark","post_content":"Our Copenhagen office is a strategic office for R&D growth within the company.","location_ID":"copenhagen-denmark"},{"ID":10009,"post_name":"kyiv","post_title":"Kyiv, Ukraine","post_content":"Our Kyiv office is the second biggest office outside of Boston, representing all company functions with R&D being the largest group.","location_ID":"kyiv-ukraine"},{"ID":11860,"post_name":"london-uk","post_title":"London, UK","post_content":"Our London offices houses our European headquarters, including Business Development, Sales, and Marketing.","location_ID":"london-united-kingdom"},{"ID":26775,"post_name":"morgantown-wv-usa","post_title":"Morgantown, WV, USA","post_content":"","location_ID":"morgantown-wv-us"},{"ID":11857,"post_name":"san-francisco-ca-usa","post_title":"San Francisco, CA, USA","post_content":"Our San Francisco team is a strong hub for business development that has grown recently due to acquisition of another company. We look forward to this office being a strategic place for R&D growth.","location_ID":"san-francisco-ca-us"},{"ID":11107,"post_name":"singapore","post_title":"Singapore, Singapore","post_content":"As our Asia-Pacific headquart'''
