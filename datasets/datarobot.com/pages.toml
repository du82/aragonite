["https://www.datarobot.com/jp/customers/oyak"]
title = "OYAK Cement 社、代替燃料の使用率を 4% から 30% へ引き上げ、約 3,900 万ドルのコストの削減を達成 | DataRobot"
description = "業務プロセスの最適化のために AI に注目したトルコの大手セメントメーカーは、AI による改善効果を実感し、本格導入に踏み切りました。今では、コスト削減にとどまらず、さらに重要な成果として CO2 排出量を年間約 20 万トン抑制できるようになりました。"
full_description = '''お客様 OYAK Cement 社、代替燃料の使用率を 4% から 30% へ引き上げ、約 3,900 万ドルのコストの削減を達成 OYAK Cement 社、代替燃料の使用率を 4% から 30% へ引き上げ、約 3,900 万ドルのコストの削減を達成 業務プロセスの最適化のために AI に注目したトルコの大手セメントメーカーは、AI による改善効果を実感し、本格導入に踏み切りました。今では、コスト削減にとどまらず、さらに重要な成果として CO2 排出量を年間約 20 万トン抑制できるようになりました。 関連製品: Automated Time Series, AutoML, DataRobot Data Prep, MLOps お客様事例を読む // Dynamically load the Marketo Forms2 library const script = document.createElement('script'); script.src = "//page.datarobot.com/js/forms2/js/forms2.min.js"; script.onload = function () { // Ensure the Forms2 library has loaded before proceeding if (typeof MktoForms2 === 'undefined') { console.error('MktoForms2 library did not load.'); return; } // Load the Marketo form MktoForms2.loadForm( '//page.datarobot.com', // Marketo instance domain '229-XUK-217', // Munchkin ID 1112, // Form ID function (form) { // Attach success handler to the form form.onSuccess(function (values, followUpUrl) { console.log('Form submitted successfully:', values); window.location.href = 'https://www.datarobot.com/jp/wp-content/uploads/sites/11/2022/04/070-A-DR-Customer-Success-OYAK-2-pager-FINAL-JP-04202022.pdf'; // Prevent default Marketo success behavior return false; }); } ); }; // Append the script to the document document.head.appendChild(script); ダイジェスト版 課題 OYAK 社は、コストと CO2 排出量の両方を削減できるようなプロセスの改善方法を探していました。 ソリューション AI を利用したプロセス制御によって、アップグレードの方向性が最適化され、エネルギー消費を削減する助けになっています。 結果 OYAK 社では、代替燃料の使用率が 7 倍に向上し、CO2 の全排出量の約 2% を削減できました。900 万本の木を節約し、年間で約 3,900 万ドルのコスト削減を達成しました。 セメント製造: 世界の CO2 排出量の 8% を占める コンクリートは強度が高くコストも比較的安価なため、ビル、橋、ダム、道路など世界中のインフラストラクチャで大量に使われています。水に次いで、世界で 2 番目に多く消費されている素材です。 しかし、世界の CO2 排出量の最大 8%（英語）— 航空業界の実に 3 倍 — は、コンクリートの原料であるセメントの製造に起因すると推定されています。 そのため、トルコの大手セメントメーカー OYAK Cement 社にとって、排出量の削減は常に最優先事項となっています。同社は、6 カ国で 18 のプラントを稼働させており、年間のセメント生産能力は 3,300 万トンに達します。 同社は、プラントの運用効率を 5% 向上させることで 4 ～ 5% のコスト削減につながるだけでなく、CO2 の排出量が 2% 低下することにも気づきました。これは年間にすると、CO2 の排出を約 20 万トン抑制し、CO2 関連の影響による社会的コストを 1,000 万ドル以上節約できることになります排出量の削減は単に環境問題上の責任ではなく、政府による排出規制を超過した場合に科される高額の罰金リスクの軽減にもつながります。 OYAK Cement 社 Process Manager の Burak Demir 氏は次のように述べています。「当社のプロセスを最適化できれば、環境に対する影響とコストの両方が自動的に軽減されます。持続可能性を持ったセメント生産におけるボトルネックを特定しなければなりません」 DataRobot を導入したおかげで、コストベース、効率ベース、そして最も重要なこととして、環境ベースでの意思決定ができるようになりました。当社はこれらの点で優位性を獲得し、先手を打って改革を進めていきます Berkan Fidan 氏 Performance and Process Director, OYAK Cement 予測インサイトにかかる時間が 4 分の 1 に OYAK 社は、プロセスの最適化と自動化を目標とする Cement 4.0 と呼ばれる取り組みを開始しました。その目標の中で、同社は 18 カ所のプラントに関連する膨大な量のデータを理解しようと努力しました。プラントでは、いくつものセンサーからストリーミングデータを取得したり、異なる DCS （分散制御システム）および SCADA （リモート監視・制御システム）が混在して運用されています。このデータを手作業で分析するのはどう考えても不可能でした。 OYAK 社 Performance and Process Director の Berkan Fidan 氏は、同社のデータの価値を理解する手段として AI を提案しましたが、周囲は懐疑的でした。 しかし、試験的なプロジェクトで、機械の故障を予測し、防止するための分析時間をこれまでの 4 分の 1 に短縮できることが判明したのです。 Demir 氏は次のように述べています。「以前は、分析の結果が出るまでに 28 日も待たなければなりませんでした。しかし、機械学習を導入した今では、7 日目にはどのパラメーターが品質値に影響しているかが分かり、調整できるようになりました」 少なくとも年間 160 万ドルのコスト削減 DataRobot による試験的なプロジェクトの結果を受けて、OYAK 社の経営陣はこのソリューションを全プラントに展開し、データサイエンティストチームを発足させることを決定しました。加えて同社は、全社のエンジニアおよびメンテナンスチームのメンバーがシチズンデータサイエンティストとして DataRobot を利用できるように取り組みました。 自身もシチズンデータサイエンティストの 1 人である Demir 氏は次のように述べています。「DataRobot を利用するために本物のデータサイエンティストになる必要はありません。DataRobot は従業員なら誰でも非常に容易に利用できるのです」 この試験的なプロジェクト以降、OYAK 社は、粉砕プロセスの最適化、原料使用効率の向上、メンテナンスニーズの予測、原料品質の維持プロセスの改善のために DataRobot を導入し、関連するコスト削減額は推定で 160 万ドルに達します。 Fidan 氏は次のように述べています。「DataRobot を導入したおかげで、コストベース、効率ベース、そして最も重要なこととして、環境ベースでの意思決定ができるようになりました。当社はこれらの点で優位性を獲得し、先手を打って改革を進めていきます」 また、OYAK 社はは売上予測の的中率を上げて、各プラントが需要に対してさらに効果的に備えられるよう支援しています。 代替燃料の使用率が 7 倍に OYAK Cement 4.0 をサポートする拡張知能などによる取り組みによって、代替燃料の使用率が 4%から 30% に向上しました。パーセンテージが 1 ポイント改善されるたびに、年間で約 150 万ドルの節約になります。 Fidan 氏は次のように述べています。「AI のおかげでデータの評価が以前よりはるかに簡単になり、プロセス改善にはどのような投資が最善かを見極められるようになりました」 Turkish operations 社の CEO、Ali Pastonoğlu 氏は次のように付け加えました。「競争優位を維持するため、私たちは AI とその関連テクノロジーに大いに投資しています。それによって事業のパフォーマンスを高め、従業員を適切な分野に配置できるのです。今では、当社の全事業部門でこの戦略を実施するよう促しています」 DataRobot を利用するために本物のデータサイエンティストになる必要はありません。DataRobot は従業員なら誰でも非常に容易に利用できるのです Burak Demir 氏 Process Manager, OYAK Cement 会社 OYAK 業界 製造 Geography Turkey SNSでシェアする もっとお客様事例を見る すべてのお客様事例を見る お客様事例 「MLOps」の活用で AI運用のさらなる効率化を目指す 続きはこちら お客様事例 保険業界のDXを DataRobotが支援 続きはこちら お客様事例 金融業界における AI Cloud 活用の重要性と最新トレンド 金融業界の DX は、年々高度化している。とりわけ、その中核を担う AI 導入は、概念実証（PoC）を乗り越えた後であっても、単一モデルがシンプルな構成で運用されているケースがほとんどだった。近年は、AI モデルの継続性や複数のモデルを同時並行的に実行・制御する本格的な AI の導入に転換してきており、現場レベルでも影響の低い業務での“お試し”的な運用から、基幹業務に直結する AI 利用に変わりつつある。 続きはこちら お客様事例 「MLOps」の活用で AI運用のさらなる効率化を目指す 続きはこちら お客様事例 保険業界のDXを DataRobotが支援 続きはこちら お客様事例 金融業界における AI Cloud 活用の重要性と最新トレンド 金融業界の DX は、年々高度化している。とりわけ、その中核を担う AI 導入は、概念実証（PoC）を乗り越えた後であっても、単一モデルがシンプルな構成で運用されているケースがほとんどだった。近年は、AI モデルの継続性や複数のモデルを同時並行的に実行・制御する本格的な AI の導入に転換してきており、現場レベルでも影響の低い業務での“お試し”的な運用から、基幹業務に直結する AI 利用に変わりつつある。 続きはこちら すべてのお客様事例を見る AI で迅速にビジネス価値向上を実現。今すぐ始めましょう。 製品ご購入前のお問い合わせ var wFORMS = wFORMS||{behaviors:{paging:{},condition:{}}};'''
