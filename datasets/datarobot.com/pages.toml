full_description = "パートナー概要 テクノロジーアライアンス SAP SAP + DataRobot SAP のテクノロジースタックと DataRobot を活用して、カスタム機械学習モデルの構築、デプロイ、監視を実行できます。 お問い合わせ var wFORMS = wFORMS||{behaviors:{paging:{},condition:{}}}; この共同ソリューションは、幅広い相互運用性に加え、モデル構築と本番環境のためのエンドツーエンド機能を備えたカスタム機械学習を適用することで、企業が SAP ビジネスデータの価値を活用できるよう支援します。企業はコーディング中心のアプローチやノーコードアプローチを使用し、SAP とサードパーティー双方のデータソースを自在に組み合わせて最先端の機械学習モデルを構築できるほか、DataRobot MLOps を使用してそれらをプロアクティブに監視したり再トレーニングしたりできるようになりました。 両社のパートナーシップにより、DataRobot のマルチモーダル機械学習機能と SAP の広範囲なビジネスデータおよびプロセスが統合され、ビジネス中心の機械学習ソリューションを生み出します。 Nishant Thacker 氏 SAP 社、VP of Solution Management 世界トップの業界で長年の経験を持つ DataRobot のデータサイエンティストは、DataRobot の最先端テクノロジーを使用してビジネス上の重要な意思決定に影響を与えます。 製造 サプライチェーンの可視性、需要予測のきめ細かさ、価格の最適化、タイムリーな予知保全など、製造業の課題に対応します。DataRobot on SAP は、製造業者が混乱を予測し、出荷遅延を特定し、持続可能なソリューションを実装し、イノベーションを推進するのに役立ちます。 金融サービス 金融サービス企業は、DataRobot on SAP を使用して、信用リスク予測を改善し、不正検出の精度を高め、規制コンプライアンスを合理化し、リスクを軽減することで、顧客が変動の激しい市場でも収益を上げられるよう支援します。 ヘルスケア DataRobot on SAP を使用すると、医療機関は正確な再入院予測、医療試験のタイムリーな離脱予測、スタッフ配置のためのベッド占有率と患者フローの詳細な予測など、幅広い用途を実現できる信頼性に優れた実用的な AI システムを提供できます。 業界別の DataRobot サポート 銀行 債務不履行の予測 小売業 店舗別日次需要予測 SAP は、エンタープライズアプリケーションソフトウェアの市場リーダーとして、ERP を再定義し、サプライチェーン全体で透明性、回復力、サステナビリティを提供するインテリジェントエンタープライズのネットワークを構築することで、あらゆる規模、あらゆる業種の企業の業務改善を支援しています。SAP のエンドツーエンドのアプリケーションおよびサービスのスイートにより、お客様は収益性を維持しながら運用し、継続的に適応し、世界的に差別化を図ることができます。 会社 www.sap.com Benefits カスタム機械学習モデルの価値実現までの時間を短縮 DataRobot の迅速な共同構築環境を活用して、最先端 AI モデルの構築、テスト、デプロイを実行できます。SAP AI Core による ML 予測を利用、あるいは SAP Build Apps を使用してモデル上にアプリを構築すれば、ビジネスプロセスの予測可能性を高めることができます。 SAP テクノロジースタックのシームレスな接続 既存の SAP HANA データベースやその他のサードパーティーデータソースにも、わずか数クリックで接続できます。データを別のシステムに移動することなく 機械学習モデルを作成できます。 DataRobot MLOps で AI モデルをデプロイ、監視、再トレーニング SAP エコシステム内のすべての AI モデルをプロアクティブに管理し、制御することによって、モデルの出所や場所に関係なく最新の状態を維持できます。SAP 環境内外のモデルを追跡して監視します。 AI で迅速にビジネス価値向上を実現。今すぐ始めましょう。 お問い合わせ"
