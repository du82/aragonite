full_description = "Episode 36AI at the Crossroads: Bias, Diversity, and Scalability with Boshika Tara and Dr. June AndrewsIn this week’s DSS Podcast, Anna had a conversation with Boshika Tara, Technical Machine Learning Product Manager at H&M Group. Boshika brings over 7 years of experience in technical product development, engineering, and building large-scale ML systems in NLP and Computer Vision. In this episode, she dives into the critical issue of bias in AI, discussing various types of biases in machine learning, how to detect them, and the importance of creating more equitable teams with diverse representation to mitigate these biases.Additionally, Anna had the pleasure of hosting Dr. June Andrews, the Founder of Lat Long Labs. Dr. Andrews shares her incredible journey from leading the Style Discovery team at Stitch Fix to her role as a Tech Lead at LinkedIn. She discusses the complexities of scaling and transforming AI projects, particularly in predicting consumer preferences and enhancing product discovery. Previous episode next episode"
