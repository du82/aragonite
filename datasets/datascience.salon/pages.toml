full_description = "DSS WEBINARSDiscover the latest and sharpen your skills in AI, data science, machine learning, and related topicsVisit our recordings page to find training videos on various topics: AI webinars, NLP webinars, data engineer webinars, ChatGPT webinars, machine learning webinars, data analytics webinars, and more. Upcoming webinars Watch recordingsUpcoming webinarsEvalOps Efficiency: Empowering AI with Cost-Effective LLM JudgesWatch live: Thursday, March 13 @ 2pm ET Join us to explore the dual themes of agent evaluations and EvalOps in this comprehensive technical session. This webinar will focus on how to effectively integrate cost-effective LLM judges into AI systems, enhancing the precision and efficiency of agent decisions and overall LLM evaluations. You’ll learn about the strategic application of EvalOps and agent-specific evaluations, balancing accuracy, speed, and cost, backed by practical case studies.Key Takeaways:– Gain insights into both specific agent evaluations and general LLM evaluations through EvalOps.– Discover strategies to optimize both agent performance and overall system evaluations.– Examine case studies demonstrating successful implementations of agent evaluations and EvalOps.– Learn how to maintain budget control while maximizing performance and accuracy.This webinar is designed for ML engineers and data scientists looking to deepen their expertise in sophisticated AI model management. Register now Ari HeljakkaFounder & CEORoot SignalsAn LLM-enabled Medical Terminology ServerWatch live: Wednesday, February 26 @ 2pm ET Medical terminology servers help different systems speak the same language by providing a versioned, comprehensive, and always-current suite of medical codes. They also help organizations translate across specialized data models by enabling domain experts to manage custom code systems, value sets, and concept maps. This session presents a fast and flexible terminology server which comes pre-loaded with all widely used medical terminologies, deploys privately behind your firewall, and provides a full API and user interface for advanced concept search, mapping, and normalization. Its standout capability is LLM-powered search which enables:1. Identifying concepts when no exact match is found, useful for anything from correcting spelling mistakes to applying synonyms and hierarchies2. Finding the most relevant concept given a given clinical context, great for finding specific codes for diagnoses, drugs, treatments, or adverse events3. Identifying the semantically closest contept to a search term, great for multi-word terms that can be written in different ways like ICD-10 descriptions or prescriptions Register now Kate WeberSenior Data ScientistJohn Snow LabsLooking for more?If you want to stay up to date with data science development, you can attend our virtual and face-to-face data science events or listen to our Data Science Podcast.Interested in putting your brand in front of the most diverse data science community in the space? apply to sponsor"
