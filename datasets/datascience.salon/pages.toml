full_description = "Ways to get involvedGet involved and engage with the Data Science Salon community!Become a DSS AmbassadorBecome a DSS speakerBecome a community partnerBecome an event volunteerSponsor an eventJoin the DSS Slack CommunityDSS AmbassadorsBalaji DhamodharanGlobal Data Science LeaderNXP SemiconductorsMugdha TasgaonkarData Science LeaderMedtronicKaran GuptaAVP, Risk AnalyticsSantanderPuneetha BalekumeriData ScientistUniversity of MarylandMark H. OliverData Science Principal, Sales ExcellenceAccenture Become a DSS AmbassadorEvangelize the DSS brand among your channels in return for exclusive benefits such as complimentary conference passes and free access to the DSS Insider video repository. Seize the opportunity to foster the growth of the data science community in your city, all while establishing valuable connections with industry thought leaders. Apply now Become a Community PartnerBe an official community partner for one or multiple DSS events. Promote events among your community and channels and your logo will be included on all event communication and the DSS website. In addition, you’ll receive complimentary tickets, which you can share with your team and/or community. Learn more Become a DSS speakerApply now to become a presenter at an upcoming DSS event, where you’ll have the opportunity to showcase your experience and expertise to a vibrant data science community while cultivating connections with like-minded individuals. We’re looking forward to your application! Apply now Become a volunteerSupport the DSS community as a volunteer! Connect with the most diverse data science community and expert speakers at one of the upcoming events while helping to create an outstanding event experience for the attendees. Read more about the opportunity and apply now! Apply now Sponsor an eventParticipate as a speaker or host a table at an upcoming DSS event to actively engage with a diverse data science community and influential decision makers. By aligning your brand with DSS, you can promptly witness the impact on your marketing goals, connecting with a wide range of individuals while expanding your reach. Learn more Join the DSS Slack CommunityJoin thousands of data science practitioners and managers in the DSS Slack community!! Connect with local DSS chapters, keep up with company wide announcements, share your events, and be the first to know about recently published job openings. Join now"
