description = "DSSe is an initiative to elevate women in data science and help companies set a better habit to generally consider women for data-intense roles."
full_description = "DataScienceSALON presents Elevating Women in DataDesigned to Elevate Women in the Data Science & Analytics Field Events Blog Podcast interviews Careers in data science continue to grow exponentially, but what percentage of those roles will be filled by women?According to research by executive recruiting firm Burtch Works, only 18% of the data professionals were women in 2020. In another study by Harnham for a 2020 survey, each minority group made up less than 20% in the data science fields compared to their Caucasian counterparts. And for minority women, the number is even lower.While the numbers are disappointing, we have a chance to shape a better future for a more diverse and inclusive field. Diverse teams means wider perspectives, better work quality, broader business opportunities, and more. Inclusive teams benefit from a more varied skill set and are therefore more efficient. It fosters positive teamwork and creates a space with a supportive community. More diverse voices means a better data science field where people can continue to challenge, educate, and innovate together.Through Data Science Salon’s Elevate initiative, we are empowering women in the data science field by amplifying their voices. We are dedicated in our mission to include BIPOC, LGBTQIA+, and other underrepresented groups. By connecting and creating a strong network for women, we hope to foster a space that is both welcoming and encouraging to women practitioners. We will continue to elevate our community to build a truly incredible and thriving field that brings every voice to the table. Apply to DSSe Nominate someone wWatch Now: Creating Value with Diverse Data TeamsDSS Elevate Panel filmed at DSS ATX 2023. DSSe interviews June 2022 See more DSSe interviews DSSe Voices Podcast“The same way we share code on GitHub, we need to share knowledge through mentoring.”–Jeanne Holm – Senior Technology Advisor to the Mayor, City Of Los Angeles Check out the DSSe Voices podcast 