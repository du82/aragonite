["https://www.datascience.salon/dsse-virtual-2021"]
title = "DSS ELEVATE: VIRTUAL SALON 2021 - Data Science Salon"
description = "The Data Science Salon is a destination conference which brings together specialists face-to-face to educate each other, illuminate best practices, and innovate new solutions in a casual atmosphere with food, drinks, and entertainment."
full_description = "Elevating women in dataTHURSDAY, SEPT 9 2021 See Upcoming EventsSponsored by Community partners Data Science Salon Elevate is a unique women focused virtual conference that includes BIPOC, members of the LGBTQIA+, and other underrepresented groups. This event series brings together data science specialists to educate each other, illuminate best practices and innovate new solutions. Learn as these thought leaders share their wisdom and experience in their chosen field.SpeakersLauren SternData Science Community Lead at Audi of AmericaBeata KouchnirDirector of Machine Learning at GlassdoorLaura EdellChief Data Scientist, AI Markets & Innovation at MicrosoftAngela BassaSenior Director of the Data Science and Analytics Center of Excellence at iRobotPiyanka JainPresident & CEO at AryngVidhi ChughStaff Data Scientist at Blue YonderTempest Van SchaikSenior Machine Learning Engineer at MicrosoftSmiti SharmaSr. Director, Systems Engineering at DataStaxAnna AnisinFounder & CEO at Data Science SalonSchedule(All times are US Eastern Time)12:00pm - 12:15pmlive chat on linkedin12:20pm - 12:30pmIntroductionAnna Anisin – Founder & CEO at Data Science Salon12:30pm - 1:00pmBuilding A Data Science CommunityLauren Stern – Data Science Community Lead at Audi of AmericaData Science is a relatively new term circulating around the tech world. Unlike many other of our more established partner fields such as Statistics, Computer Science, and Computer Engineering we do not have the luxury of relying on institutional degrees and countless years of direct experience to determine a candidate’s ability to perform their job functions. Data Science is in the unique position of being driven at its core, by a predominantly peer led community. Building a strong Data Science Community means more than just checking off a box. It means enabling your workforce with critical technical skills, promoting the adoption of advanced analytics, and providing overall faster customer response times. It means creating an inclusive space where your employees feel heard and are able to share best practices, current issues, and new project ideas and technologies.Dive deeper with us into what it takes to get a community set up, where some common pitfalls occur, the expected benefits for stakeholders, and finally some tips and tricks for growing your community and helping it thrive!1:00pm - 1:30pmBAM! Reinforcement Learning : Taking Recommenders Up a NotchLaura Edell – Chief Data Scientist, AI Markets & Innovation at Microsoft 1:30pm - 2:00pmA Few Reflections on a Data Science CareerAngela Bassa – Senior Director of the Data Science and Analytics Center of Excellence at iRobotHow do you grow and lead a high-performing data science team? As someone evaluating whether to join a new team, how do you know what to expect? What should you look for? Data scientists come from all walks of life and contribute in their own ways. Teams need to recognize that, care about each other’s work, know how to connect it to the business, and foster a diverse and resilient environment. This talk will explore how to identify, join, and build healthy data science teams. It is relevant for students and early-career professionals who are interested in exploring data science and understanding what skills and qualities are sought-after within the field. While specific to data science, this talk is also valuable for midcareer professionals and managers across a variety of disciplines who want to know how to instill a positive culture.2:00pm - 2:30pmConvergence of Data, Data Governance and AI/MLSmiti Sharma – Sr. Director, Systems EngineeringThe volume of data, the exponential velocity with which new data is generated is talked about much. What is also becoming apparent is the business need to maintain data quality, discover insights from this data while maintaining parameters of regulation and data guardianship. In this talk, we will talk about how companies are using AI ML embedded in transactional systems that deliver real time insights to their customers. We will touch upon data governance and data sovereignty requirements that have been widely used by various industry domains2:30pm - 3:15pmCoffee ChatTempest Van Schaik – Senior Machine Learning Engineer at MicrosoftPiyanka Jain – President & CEO at Aryng Vidhi Chugh – Staff Data Scientist at Blue Yonder Moderated by Q McCallum – Senior Content Advisor at Formulatedby3:25pm - 3:45pmData Science in banking solutionsVidhi Chugh – Staff Data Scientist at Blue YonderMultiple AI-driven solutions exist in the banking industry, but considering the critical role it plays in the economy and the consumer interaction, it needs more explainability on the prediction outcome. The talk intends to use Bayesian networks to better understand causal reasoning and generate insights on the credit worthiness of the borrower.3:45pm - 4:15pmHow to identify top AI/Data Science projects and deliver rapidly on themPiyanka Jain – President & CEO at AryngThis session will lay out a methodology to identify the most promising projects for a company (i.e., the analytics roadmap). And then, we will showcase how to execute those projects with minimal resourcing rapidly. The recipe we share can serve as a playbook for any head of Data Science/Analytics to drive maximum value from their company.4:15pm - 4:45pmApplied Machine Learning (a.k.a Research vs. The Real World)Beata Kouchnir – Director of Machine Learning at GlassdoorOne of the main reasons that motivates people to get into machine learning is the incredible pace of innovation and potential for world-changing impact. While we all get very excited about the latest breakthroughs coming out of think tanks such as Google Research and OpenAI, for most of us, those discoveries have little in common with our day-to-day work. This talk addresses the less glamorous, but still very complex reality of applying machine learning to “real world” business problems.4:45pm - 5:00pmWrap up sample of topics covered:Machine learning best practices Data strategy and governance Data ethics and bias Recommendation engines Designing ML pipelines efficiently Career paths Hiring and Recruitment Seeking mentorship with purpose The importance of female-first spaces Navigating male-dominated teams Overcoming imposter syndrome Data science teams: managing, building, collaboration Integrating open source tools into your workflows Data and AI for emerging platforms Data governanceAbout DSSeDSSe is an initiative to elevate and connect the voices of women in data science and encourage companies to set better standards in hiring women for data-intense roles. To expand our mission, we are committed to creating the most inclusive and diverse community for women including BIPOC, members of the LGBTQIA+, and other underrepresented groups. By elevating our community, we have the opportunity to build a truly incredible and thriving field that influences decision-making at every level in a meaningful way.DSSe is important because the field of Data Science is still young — for it to fulfill its true potential, we need voices that reflect the full experience of the world we live in to contextualize our data-derived insights."
