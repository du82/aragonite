full_description = "Data Science Salon MIAUSING AI &MACHINE LEARNINGIN THE ENTERPRISEMIAMI | SEPTEMBER 17, 2025 Register NowSponsored By: OverviewSpeakersScheduleWatch On Demand Join us at Data Science Salon Miami for an exclusive experience designed to connect you with the people you’d like to meet, without any surprises. DSS MIA is an annual one-day conference, focused on using artificial intelligence and machine learning in the enterprise. This intimate event, a mix of TedEx, Foo Camp and Summit, curates data science sessions to bring senior managers, C-suite executives, and the most talented local AI/ML researchers face-to-face, fostering education and collaboration on innovative solutions in artificial intelligence, machine learning, predictive analytics, and best practices. Expect to walk away with actionable insights from those working on the frontlines of machine learning in the enterprise. 2024 SpeakersRachita NaikMachine Learning Engineer Preyaa AtriSenior Data EngineerSushaanth SrirangapathiPrincipal Data ScientistBalaji DhamodharanData Science Leader Lauren Burke-McCarthySenior Data Science Lead, AI Strategy Karthik IlangovanHead of Business Intelligence Perla SierraVP of AI Strategy Chalamayya Batchu VeeraSr. Enterprise Architect Hasham Ul HaqSr. Machine Learning Engineer Rebecca SharpeChief Technology Officer Noelle RussellChief AI Officer Jay KachhadiaSenior Data Scientist Flaviane PeccinAI & ML DirectorAntonio PonteGlobal Deposits & Investment Product Manager Sagar Varma SamanthapudiData Engineer Chris LatimerCo-FounderAikerim BelispayevaData AnalystAna AriasGeographic Information Systems AnalystMichel LopezCEOMatthew DenesukSVP, Data Analytics & AI Sidd SeethepalliCo-Founder & CTOJenifer Jones-BarbatoVice President, Global Data and Analytics Apply to speakTOPICS INCLUDEPersonalization at Scale with AICloud Automation and MLRecommendation EnginesDesigning ML pipelines efficientlyNatural Language Processing & Deep LearningDeep Neural NetworksImage Recognition with MLUsing large scale data setsScaling ML ProductionData Science Teams: Managing, Building, CollaborationIntegrating Open Source Tools into your workflowsImproving Data QualityMachine learning best practicesData SecurityAbout DSS MiamiData Science Salon Miami is a one-day experience for senior managers, C-suite executives, and top local AI/ML researchers. This exclusive event is all about networking and connecting you with the right people you want to meet. It features a curated mix of use-cases, technical talks, workshops, and Q&A sessions, designed to foster direct interaction and collaboration among industry leaders. Secure your spot now and join us to gain actionable insights from those at the forefront of machine learning in the enterprise. Apply to SponsorWHY ATTEND THE DSS MIAMI EXPERIENCE?Network with the Right People: Connect with senior managers, C-suite executives, and top local AI/ML researchers in an exclusive, invite-only setting.Engage in Curated Sessions: Participate in a carefully selected mix of use-cases, technical talks, workshops, and Q&A sessions tailored to foster direct interaction and collaboration.Learn from the Best: Gain insights from practitioners, technical experts, and executives on what AI and machine learning mean for the enterprise.Interactive Q&A: Ask expert speakers your questions during live Q&A sessions.Actionable Insights: Walk away with practical knowledge and strategies from those working on the frontlines of machine learning in the enterprise.Exclusive Access: Session footage will only be available to those who attend the event in person. WATCH ON DEMAND top Attending companies VenueAmpersand Studios, 31 NE 17th St, Miami, FL 33132Purchase a Pass to DSS MIA 2024Click here to buy ticketsSell tickets online with Ticket Tailor In partnership with Be a community partner“Over the years Data Science Salon has grown into an amazing community of likeminded practitioners across multiple domains. We learn from each other different applications and techniques that normally we would not have seen within our own industry. Such a strong community of smart applied data scientists within an open and collaborative setting!”Moody HadiHead of Credit Analytics New Product Development, S&P Global“Both Viacom and Data Science Salon are known for being at the forefront of their fields. We’re proud to provide a platform for DSS, and to host the most relevant conversations on data science in media and entertainment.”Colleen Fahey RushCHIEF RESEARCH OFFICER, VIACOM“We at Katana Graph had the pleasure of being a sponsor at the DSS NYC event in December 2022. Every aspect starting from the sponsorship support, to the venue and post event communication has been absolutely stellar. This event has attracted some of the brightest and most engaging audience members as well as industry leaders which resulted in very thoughtful conversations. We look forward to supporting future DSS events!”Justin Fine DIRECTOR OF FIELD ENGINEERING AT KATANA GRAPH“Their conferences are smaller, more intimate, with lots of opportunities for workshops and networking, which helps fill that need in the data science community to get together from time to time.”David TalbyCTO, John Snow Labs“Data Science SALON is a must-attend event for decision-makers across the data science landscape. The combination of high-quality content and power networking creates a unique opportunity to generate business.”Matt DenesukSVP, DATA ANALYTICS & AI, ROYAL CARIBBEAN GROUP“The Data Science Salon series is the most important new conversation happening in the industry right now.”Eduardo Arino de la RubiaHEAD OF DATA SCIENCE, INSTAGRAM Ways to get involvedJoin the DSS Slack CommunityJoin nowBecome a community partnerLearn moreBecome a DSS speakerApply nowBecome a volunteerApply nowSponsor an eventLearn moreBecome a DSS AmbassadorApply now"
