full_description = 'Data Science Salon SFUsing Generative AI & Machine Learning in the Enterprise{ "@context": "https://schema.org", "@type": "Event", "name": "Using Generative AI & Machine Learning in the Enterprise - San Francisco | Data Science Conference | AI Conference | Machine Learning Conference | Big Data Tech Event", "url": "https://www.datascience.salon/san-francisco/", "startDate": "2023-11-29", "endDate": "2023-11-29", "image": [ "https://www.datascience.salon/wp-content/plugins/psn-pagespeed-ninja/ress/s/img/wp-content/uploads/2022/10/DSC03969.jpg.webp", "https://www.datascience.salon/wp-content/plugins/psn-pagespeed-ninja/ress/s/img/wp-content/uploads/2022/10/DSC03374.jpg.webp" ], "description": "Using Generative AI & Machine Learning in the Enterprise is a Data Science conference in San Francisco organized by Data Science Salon. It deals with Increasing User Productivity with Intelligent Workflows, Transforming Cruising Operations & Customer Experience by ML & GenAI, Blending Art, Science, and AI in the Human Approach to the Future of Creativity, Insights for Low-latency Model Inference in Enterprise Finance, Building Intelligent and Interactive Writing Assistants in the era of Large Language Models, Building Next-Gen Recommender Systems with Large Language Models, Strategies and Insights, AI in Non-Tech Companies.", "eventAttendanceMode": "https://schema.org/MixedEventAttendanceMode", "eventStatus": "https://schema.org/EventScheduled", "performer": { "@type": "Organization", "name": "Data Science Salon" }, "organizer": { "@type": "Organization", "name": "Data Science Salon", "url": "https://www.datascience.salon" }, "offers": [ { "@type": "Offer", "name": "General Admission Pass", "price": "695.00", "priceCurrency": "USD", "availability": "https://schema.org/InStock", "validFrom": "2023-10-01T00:00", "url": "https://www.datascience.salon/san-francisco/" }, { "@type": "Offer", "name": "Virtual Access", "price": "295.00", "priceCurrency": "USD", "availability": "https://schema.org/InStock", "validFrom": "2023-10-01T00:00", "url": "https://www.datascience.salon/san-francisco/" } ], "location": [ { "@type": "VirtualLocation", "url": "https://www.datascience.salon/san-francisco/" }, { "@type": "Place", "name": "San Francisco", "address": { "@type": "PostalAddress", "addressLocality": "San Francisco", "addressRegion": "California" } } ] }San Francisco | November 6, 2025 Register NowSponsored by OverviewSpeakersApply to Attend Join us at Data Science Salon San Francisco for an exclusive experience designed to connect you with the people you’d like to meet, without any surprises. DSS SF is an annual one-day conference, focused on using artificial intelligence and machine learning in the enterprise. This intimate event, a mix of TedEx, Foo Camp and Summit, curates data science sessions to bring senior managers, C-suite executives, and the most talented local AI/ML researchers face-to-face, fostering education and collaboration on innovative solutions in artificial intelligence, machine learning, predictive analytics, and best practices. Expect to walk away with actionable insights from those working on the frontlines of machine learning in the enterprise. Past SpeakersSanghamitra GoswamiSenior Director, AI & ML Aditi GodboleSenior Data Scientist Vyoma GajjarAI Technical Solution Architect Jodi BlombergVP of Data Science Raghavan MuthuregunathanSr Engineering Manager, Search AI Roger MagoulasContent Director Ari HeljakkaCo-Founder & CEO Lav KumarLead Member of Technical Staff Brian CruzHead of AI Engineering Sanghamitra DebAI & ML Leadership Jon BrasethCEO Ashish SaxenaLead Software Engineer Alice ChangEngineering Manager, AI Products Sundeep KattaLead Member of Technical Staff Akhil ChaturvediStaff ML Engineer Sayan MaityPrincipal ML Engineer Arpita VatsSenior AI Engineer Swagata AshwaniPrincipal Data Scientist Charlie GuSenior Engineering Manager Thryn ShapiraAI Ethics Lead, Google Photos Kristen LeeSenior User Experience Researcher, Android Tools & DataAlexis BaudronSenior AI Researcher Aditya PalnitkarSoftware Engineer Apply to SpeakTOPICS INCLUDEPersonalization at Scale with AICloud Automation and MLRecommendation EnginesDesigning ML pipelines efficientlyNatural Language Processing & Deep LearningDeep Neural NetworksImage Recognition with MLUsing large scale data setsScaling ML ProductionData Science Teams: Managing, Building, CollaborationIntegrating Open Source Tools into your workflowsImproving Data QualityMachine learning best practicesData Security About DSS San FranciscoData Science Salon San Francisco is a one-day experience for senior managers, C-suite executives, and top local AI/ML researchers. This exclusive event is all about networking and connecting you with the right people you want to meet. It features a curated mix of use-cases, technical talks, workshops, and Q&A sessions, designed to foster direct interaction and collaboration among industry leaders. Apply to attend and join us to gain actionable insights from those at the forefront of machine learning in the enterprise. Apply to SponsorWHY ATTEND THE DSS SF EXPERIENCE?Network with the Right People: Connect with senior managers, C-suite executives, and top local AI/ML researchers in an exclusive, invite-only setting.Engage in Curated Sessions: Participate in a carefully selected mix of use-cases, technical talks, workshops, and Q&A sessions tailored to foster direct interaction and collaboration.Learn from the Best: Gain insights from practitioners, technical experts, and executives on what AI and machine learning mean for the enterprise.Interactive Q&A: Ask expert speakers your questions during live Q&A sessions.Actionable Insights: Walk away with practical knowledge and strategies from those working on the frontlines of machine learning in the enterprise.Exclusive Access: Session footage will only be available to those who attend the event in person. Grab Your Spot SOME Attending companies Purchase a Pass to DSS SF 2025Click here to buy ticketsSell tickets online with Ticket Tailor In partnership with Be a community partner“Over the years Data Science Salon has grown into an amazing community of likeminded practitioners across multiple domains. We learn from each other different applications and techniques that normally we would not have seen within our own industry. Such a strong community of smart applied data scientists within an open and collaborative setting!”Moody HadiHead of Credit Analytics New Product Development, S&P Global“Both Viacom and Data Science Salon are known for being at the forefront of their fields. We’re proud to provide a platform for DSS, and to host the most relevant conversations on data science in media and entertainment.”Colleen Fahey RushCHIEF RESEARCH OFFICER, VIACOM“We at Katana Graph had the pleasure of being a sponsor at the DSS NYC event in December 2022. Every aspect starting from the sponsorship support, to the venue and post event communication has been absolutely stellar. This event has attracted some of the brightest and most engaging audience members as well as industry leaders which resulted in very thoughtful conversations. We look forward to supporting future DSS events!”Justin Fine DIRECTOR OF FIELD ENGINEERING AT KATANA GRAPH“Their conferences are smaller, more intimate, with lots of opportunities for workshops and networking, which helps fill that need in the data science community to get together from time to time.”David TalbyCTO, John Snow Labs“Data Science SALON is a must-attend event for decision-makers across the data science landscape. The combination of high-quality content and power networking creates a unique opportunity to generate business.”Matt DenesukSVP, DATA ANALYTICS & AI, ROYAL CARIBBEAN GROUP“The Data Science Salon series is the most important new conversation happening in the industry right now.”Eduardo Arino de la RubiaHEAD OF DATA SCIENCE, INSTAGRAM Ways to get involvedJoin the DSS Slack CommunityJ