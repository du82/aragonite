description = 'Necessary cookies are absolutely essential for the website to function properly. These cookies ensure basic functionalities and security features of the website, anonymously.CookieDurationDescriptioncookielawinfo-checkbox-analytics11 monthsThis cookie is set by GDPR Cookie Consent plugin. The cookie is used to store the user consent for the cookies in the category "Analytics".cookielawinfo-checkbox-functional11 monthsThe cookie is set by GDPR cookie consent to record the user consent for the cookies in the category "Functional".cookielawinfo-checkbox-necessary11 monthsThis cookie is set by GDPR Cookie Consent plugin. The cookies is used to store the user consent for the cookies in the category "Necessary".cookielawinfo-checkbox-others11 monthsThis cookie is set by GDPR Cookie Consent plugin. The cookie is used to store the user consent for the cookies in the category "Other.cookielawinfo-checkbox-performance11 monthsThis cookie is set by GDPR Cookie Consent plugin. The cookie is used to store the user consent for the cookies in the category "Performance".viewed_cookie_policy11 monthsThe cookie is set by the GDPR Cookie Consent plugin and is used to store whether or not user has consented to the use of cookies. It does not store any personal data.'
full_description = "Episode 29When companies try to “sprinkle some AI” on a productIf you’ve been in the data game long enough, you’ve probably seen this before: a stakeholder or product owner approaches you with a project that’s 95% done, and they’d like you to … “sprinkle some AI on it.” They’ve heard that this “AI” thing can be useful so they want some of it in their latest effort.Data scientist-turned-product person Noelle Saldana has experienced the “sprinkle some AI on it” request more times than she’d care to remember. Our Senior Content Advisor Q McCallum met up with Noelle to explore this phenomenon. How does this happen? (Hint: “corporate FOMO.”) What should you do when stakeholders insist on implementing AI that isn’t actually going to help? What about when your data scientist peers seem like they’re doing this for the sake of “résumé-driven development?”Ultimately, the pair work through the bigger issue: how do you make peace with companies throwing money at AI like this? And how can these companies use this approach to their advantage?As a bonus, Noelle shares how she made the move from a data scientist role into product management. If this path sounds interesting to you, take a listen.Noelle’s Data Council talk, “Hot Takes and Tragic Mistakes: How (not) to Integrate Data People in Your App Dev Team Workflows”Find Noelle on LinkedIn: https://www.linkedin.com/in/noellesio/Q’s blog post (which came out much better thanks to Noelle’s help): “AI isn’t something you just add to a company” Previous episode Next episode"
