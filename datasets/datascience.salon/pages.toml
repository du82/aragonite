full_description = "Episode 37AI in Action: From Machine Learning Interpretability to Cybersecurity with Serg Masís and Nirmal BudhathokiIn this DSS Podcast, Anna Anisin welcomes Serg Masís, Climate and Agronomic Data Scientist at Syngenta. Serg, an expert in machine learning interpretability and responsible AI, shares his diverse background and journey into data science. He discusses the challenges of building fair and reliable ML models, emphasizing the importance of interpretability and trust in AI. Serg also talks into his latest book, “Interpretable Machine Learning with Python,” and provides valuable insights for data scientists striving to create more transparent and effective AI solutions.In another compelling episode, Anna sits down with Nirmal Budhathoki, Senior Data Scientist at Microsoft. Nirmal, who has extensive experience at VMware Carbon Black and Wells Fargo, focuses on the intersection of AI and cybersecurity. He shares his journey into security data science, discussing the unique challenges and critical importance of applying AI to enhance cybersecurity measures. Nirmal highlights the pressing need for AI in this field, practical use cases, and the complexities involved in integrating AI with security practices, offering a valuable perspective for professionals navigating this dynamic landscape. Previous episode"
