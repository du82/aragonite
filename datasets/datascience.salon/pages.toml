full_description = "USING GENERATIVE AI & MACHINE LEARNING IN THE ENTERPRISE + STARTUP SHOWCASEAUSTIN + ON-DEMAND | FEBRUARY 19-20, 2025OverviewSpeakersScheduleSponsorsApply to Attend DSS Austin | ScheduleFebruary 19-20, 2025 Day 1Day 28:30 – 9:30am CTRegistration 9:30 – 9:40am CTIntroductionAnna Anisin - Founder, Data Science Salon9:40 – 10:10am CTAI Powered Innovations in HealthcareAarohi Tripathi - Senior Data Engineer at CVS HealthArtificial intelligence (AI) is revolutionizing the healthcare industry by enhancing the efficiency and accuracy of diagnostics, treatment planning, and patient care. This talk explores recent AI-powered innovations in healthcare, including machine learning algorithms for early disease detection, natural language processing for patient data management, and robotics for precision surgery. I will talk about the integration of AI in real world healthcare applications and examine how AI enhances diagnostic accuracy, enables personalized medicine, improves operational efficiency, and contributes to better patient outcomes. In this session, I will also address ethical considerations, data privacy concerns, and the future potential of AI in transforming healthcare as AI has the potential to significantly advance medical research and practice, ultimately leading to a more effective and equitable healthcare system.10:10 – 10:40am CTIntegrating Multi-Modal, Reasoning, and Conversational Medical LLMs to Understand Complex Patient StoriesDavid Talby - CEO at John Snow LabsComplex patients visit different doctors, hospitals, and labs and can easily have more than a thousand pages added to their medical record per year. Integrating all this medical text, images, labs, and tables into a useful data model that can be easily queried is a challenge for every healthcare system. This session presents a patient journeys platform that combines multiple healthcare-specific large language models to deliver an end-to-end solution that integrates multi-modal clinical data and reasons about missing, uncertain, and longitudinal information in natural language. We’ll also cover the medical language models which deliver state-of-the-art accuracy on these tasks, above what general-purpose LLMs currently do, as well as privacy and compliance needs for such systems to operate in real-world environments.10:40 – 11:00am CTAgents on a Leash: Winning with Strong, Swift, Affordable LLM JudgesAri Heljakka - Co-Founder & CEO at Root SignalsSolve the last-mile optimization of AI agents by integrating swift, cost-effective LLM judges to evaluate their steps and decisions at scale. This session tackles the challenge of making frequent, high-quality evaluations affordable by framing it as a semantic optimization problem, the practise known as EvalOps. Through practical examples, learn how to optimize speed, semantic virtues and cost of your judges, in order to then optimize your agents, to make aligned, informed decisions without breaking the bank.11:00 – 11:20am CTCoffee Break 11:20- 11:50am CTHarnessing the Potential of Unstructured Data to Drive Enterprise SuccessDhivya Nagasubramanian - Lead AI Solutions Architect, VP at U.S. BankEnterprises hold wealth of data, much of which remains untapped. In today’s data-driven landscape, unstructured data—spanning text, images, videos, and more—makes up over 80% of all enterprise data. Yet, its full potential often goes unrealized. In this session, I will explore strategies to unlock the value of unstructured data, enabling actionable insights, enhanced decision-making, and innovation. Drawing from a real-world use case, I’ll demonstrate how scanned documents can be transformed into structured formats to drive positive business outcomes. I will also address key challenges faced during this process and share practical tips to overcome them effectively.11:50 – 12:20pm CTUnlocking the Power of Graph-Based Retrieval and Analytics for Unstructured DataAnthony Mahanna - Software Engineer at ArangoDBDiscover cutting-edge tools designed to revolutionize how organizations process, query, and extract value from their data using ArangoDB’s unique approach to GraphRAG and HybridRAG. This session will dive into advanced solutions that will transform your unstructured information into actionable insights, leveraging the power of a multi-model graph database. – Natural Language to Query Language – Explore an innovative service that translates natural language into precise database queries, enabling intuitive data exploration powered by private or public language models.– Unstructured to Structured Data – Learn how to extract entities and relationships from complex, text-heavy files, automatically constructing a robust knowledge graph for better data connectivity and visibility.– Enhanced Retrieval and Insights – See how advanced search capabilities unlock semantic similarity searches and aggregate community insights through flexible global and local queries.These containerized services combine graph, document, key-value, full-text, and vector search capabilities, offering unparalleled efficiency in data retrieval and knowledge extraction. Don’t miss this opportunity to see how modern data technologies can streamline your approach to complex datasets.12:20 – 1:05pm CTPanel: Generative AI: Seizing Opportunities and Overcoming Challenges in the EnterpriseBrent Schneeman - Director, AI and Software Engineering at PMG, LLC, Seshendranath Balla - Senior Manager of Software Development at Comcast, Balaji Dhamodharan - Global Software Analytics Leader at AMD, and Shivika Bisen - Data Scientist at Viasat1:05 – 2:05pm CTLunch & Networking 2:05 – 2:25pm CTSaving Lives with Data Science: How Data Science Shortened the COVID-19 Pandemic by 2 MonthsDr. Greg Michaelson - Chief Product Officer & Co-Founder at ZerveDuring the COVID-19 pandemic, every day counted in the race to save lives. Data science emerged as a critical tool in accelerating vaccine trials, deployment, and community outreach, ultimately shortening the pandemic timeline by an estimated two months. In this talk, we will uncover the data-driven strategies that empowered the U.S. government to fast-track vaccine trials and distribution. From leveraging advanced analytics and predictive modeling to fostering interdisciplinary collaboration, we’ll explore how data science enabled precise targeting of key communities at pivotal moments. Join us to learn how these groundbreaking efforts not only expedited vaccine availability but also demonstrated the transformative power of data science in public health crises.2:25 – 2:55pm CTRevolutionizing Forecasting: A Comparative Analysis of Time Series Methods Across IndustriesArun Kuppam - Director of Data Science at Gap, Inc.This talk encapsulates the essence of exploring diverse time series forecasting methods across sectors such as travel, logistics, supply chain, and retail. It highlights the comparison between traditional econometric techniques and modern machine learning approaches like deep learning, transformer models, and LLM-based methods. The talk would delve into how these varied approaches are applied in different industries to enhance forecasting accuracy and decision-making processes.2:55 – 3:15pm CTAgentic AI for Data ScienceFatma Tarlaci - Chief Technology Officer at Rastegar CapitalAs artificial intelligence (AI) advances, AI agents are revolutionizing the field of data science by automating routine but essential tasks such as data cleaning, preprocessing, feature engineering, and pipeline management. These autonomous systems are not just tools; they are reshaping the data scientist’s role, enabling a shift toward higher-value activities like strategic analysis and creative model development. This beginner-friendly talk will introduce the concept of AI agents, explain their functionality and the transformative opportunities they bring to the data science workflow. Attendees will gain a clear understanding of how these systems streamline mundane processes and multiply productivity. Whether you are new to data science or a professional looking to learn more about the future of autonomous AI-driven workflows, this session offers a technically grounded yet accessible guide to the game-changing role of AI agents in modern data science.3:15 – 3:35pm CTCoffee Break 3:35 – 4:05pm CTEnhancing Recommendation Systems with LLM-Generated Aspect AugmentationsKailash Thiyagarajan - Senior Machine Learning Engineer at AppleTraditional recommendation models struggle to capture user intent beyond interaction history, often missing critical contextual insights. Large Language Models (LLMs) offer a compelling solution by generating item aspects—descriptive features that better reflect user preferences. In this session, we’ll explore how aspect augmentation with LLMs can significantly improve ranking models, leading to more accurate recommendations. Join me to learn: How LLMs can generate meaningful item aspects from textual data. Three integration techniques: feature concatenation, wide-and-deep models, and two-tower architectures. How aspect-based augmentation compares to traditional Pre-trained Language Model (PLM) embeddings. Real-world results demonstrating improvements in ranking metrics such as MRR and NDCG.4:05 – 4:25pm CTAdvanced RAG For Text to SQL ApplicationsArjun Bali - Senior Data Scientist at Rocket MortgageWhat if you could turn complex datasets into instant, actionable insights, just by asking a question like you would, to a colleague familiar with the data? This talk introduces an Advanced Retrieval-Augmented Generation (RAG) system that puts the power of data directly into the hands of business leaders. No more delays and data bottlenecks. This RAG powered tool enables real-time, natural language interactions with your data, bridging the gap between technical teams and decision-makers. Business leaders can now unlock nuanced insights with ease, ask follow-up questions, and make data-driven decisions not only faster than ever before but also way easier. This session will dive into real-world applications, revealing how the tool enhances operational efficiency, democratizes data access, and empowers businesses to stay ahead in competitive markets. Learn how organizations are transforming their workflows, reducing reliance on technical teams, and fostering a culture of rapid, intelligent decision-making.4:25 – 4:55pm CTEmpowering Neurodivergent Communities Through AI-Driven Anxiety ManagementMugdha Tasgaonkar - Data Science Leader at MedtronicThis session explores how AI is revolutionizing mental health care for neurodivergent individuals, a community often underserved by traditional solutions. By leveraging advanced AI applications to analyze data from wearable devices, health apps, and electronic health records, innovative workflows predict anxiety triggers and enable personalized, data-driven interventions. These technologies simplify mental health management for individuals while equipping caregivers with actionable insights, improving support systems and fostering greater independence. Attendees will gain an in-depth understanding of the business opportunities in this space, including the integration of predictive analytics, real-time monitoring, and tailored mental health solutions. The session also addresses the scalability of AI-driven platforms and the strategic considerations for designing inclusive technologies that align with regulatory and ethical frameworks. Learn how these AI applications create a pathway for neurodivergent individuals to thrive in society, presenting a scalable and impactful investment opportunity in a less-explored yet high-growth market.4:55 – 5:00pm CTClosing RemarksAnna Anisin - Founder, Data Science Salon Watch on demand"
