["https://www.datascience.salon/elevate/voices"]
title = "DSSe Voices Podcast - Data Science Salon"
description = "This episode features Veronica Zhai, Principal Technical Product Manager, Analytics at Fivetran, Alyce Ge, Data Scientist at Cherre, Ben Rogojan, Data Engineer at Facebook and Ashely Titus, Partnership Coordinator at Women in Analytics. Listen as they discuss challenges and opportunities of data practice in different types of organization as well as how to break into this area or advance one’s career."
full_description = "Listen to our latest episode BE A GUEST ON OUR PODCASTIt’s no secret that women are vastly underrepresented in data science, one of the fastest growing careers. Listen to the DSSe podcast to hear female data scientists sharing their experiences and advice on community building, imposter syndrome, mentorship, and successful careers.If you are a female data science practitioner, manager, or executive, or are interested in supporting women in data science, this is the podcast for you. NEW – Episode 10Empowering Women in Data Science: Navigating a successful career pathThis episode features Veronica Zhai, Principal Technical Product Manager, Analytics at Fivetran, Alyce Ge, Data Scientist at Cherre, Ben Rogojan, Data Engineer at Facebook and Ashely Titus, Partnership Coordinator at Women in Analytics. Listen as they discuss challenges and opportunities of data practice in different types of organization as well as how to break into this area or advance one’s career. Episode 9Live from DSSe Vol 4 – Virtual Coffee ChatListen in to this live coffee chat discussion, where a panel of four amazing female data scientists describe their data science journey, networking, and work/life balance. Episode 8Live from DSSe Vol 3 – Virtual Coffee ChatListen in to this live coffee chat discussion, where a panel of three amazing female data scientists describe their data science journey, their every-day work life, and ways they have grown along the way. Episode 7Live from DSSe Vol 2 – Virtual Coffee ChatListen in to this live coffee chat discussion, where a panel of four amazing female data scientists dive into specific themes including imposter syndrome, challenges faced by women in the data science field, and changing career paths. Episode 6What makes a successful manager?This month’s episode features Meghna Sinha, Vice President Data Sciences at Target, Ali Vanderveld, Director of Data Science at ShopRunner, and Melissa Ludack, Senior Director of Data Science & Analytics at Target. Listen as they discuss how to build a test and measure culture across departments, how to give constructive criticism, and the qualities that make a great manager. Episode 5Live DSSe Panel at DSSNYC 2019Listen in live from DSSNYC where a panel of four amazing female data scientists, led by Anna Nicanorova, VP of Engineering at Annalect Labs, discuss issues of diversity, the future of 5G and the importance of elevating minority perspectives within the industry. Episode 4What Makes a Successful Mentor?This month’s episode highlights the stories of how Devshree Golecha, Associate Vice President of Analytics at EXL, Laura Ellis, Analytics Architect at IBM and Jeanne Holm, Senior Technology Advisor to the Mayor of Los Angeles evolved into prolific mentors within the data science community as they together determine what makes a successful mentor. Episode 3The Importance of Female-First SpacesThis month’s episode delves into the benefits and areas for improvement of female and gender minority first spaces within the realm of data science. Gabriela de Queiroz, Founder of R-Ladies, Erika Braithwaite, Co-Founder and CEO of Precision Analytics and Randi Ludwig, Data Scientist at Dell share the highlights of leading their respective female and gender minority first spaces while addressing issues involving these spaces’ development in general. Episode 2You’re Evolving Into Your CareerThis month’s episode features high-power Viacom Executive Amy Yu, and esteemed Machine Learning Research Expert Friederike Schuur as they discuss their career histories and the future of work. Listen as a walk back through memory lane evolves into a riveting dialogue about the implications of gender in the data space and how female data leaders in particular can raise the industry to new heights. Episode 1You’re Not An impostorThis month’s episode features renowned econometrician Amar Natt, Managing Director of Data Science at Econ One Research and Millennial Award Winner Kelsey Foster, Campaign Director at Committee for a Better New Orleans. Listen as a sharing of data tools and resources evolves into a meaningful discussion about imposter syndrome and how women in the data space can rise above it."
