sing AI and Machine Learning in the Enterprise + Startup Showcase | 2026Using AI and Machine Learning in Finance | May 15, 2025Using Generative AI and Machine Learning in Retail and eCommerce | April 16, 2025Using AI and Machine Learning in Media and Advertising | TBT, 2025 See all events Webinars on Data Science, AI & Machine Learning Tune into the top 10 Podcast in AI, Machine Learning and Data Science Acquire new skills casually from featured data science presentations Trending topics and discussions in the data science community Elevating Women in the data science and analytics field Leading data scientists share their experiences in a 15 minute interview | Join the DSS Slack community Join now Elevating Women in the data science and analytics field Gain digital access to talks and slides from past DSS events“Over the years Data Science Salon has grown into an amazing community of likeminded practitioners across multiple domains. We learn from each other different applications and techniques that normally we would not have seen within our own industry. Such a strong community of smart applied data scientists within an open and collaborative setting!”Moody HadiHead of Credit Analytics New Product Development, S&P Global“Both Viacom and Data Science Salon are known for being at the forefront of their fields. We’re proud to provide a platform for DSS, and to host the most relevant conversations on data science in media and entertainment.”Colleen Fahey RushCHIEF RESEARCH OFFICER, VIACOM"We at Katana Graph had the pleasure of being a sponsor at the DSS NYC event in December 2022. Every aspect starting from the sponsorship support, to the venue and post event communication has been absolutely stellar. This event has attracted some of the brightest and most engaging audience members as well as industry leaders which resulted in very thoughtful conversations. We look forward to supporting future DSS events!"Justin Fine DIRECTOR OF FIELD ENGINEERING AT KATANA GRAPH“Their