full_description = "Episode 31FinTech Insights: AI Innovations, Privacy Strategies, and Synthetic Data with Harry Mendell & Supreet KaurIn this episode, Anna sits down with two distinguished leaders in the ML/AI finance industry. First, we have Harry Mendell, Technology Group Data Architect at the Federal Reserve Bank of New York, who brings over 30 years of expertise in FinTech. Harry shares compelling stories and discusses emerging trends in the finance sector.Following Harry, Supreet Kaur, AVP at Morgan Stanley and product owner for various AI products, joins the conversation. Supreet provides insights into the use of synthetic data to protect customer privacy in FinTech, ensuring informed decision-making. This deep dive into synthetic data highlights its growing importance in the industry. Previous episode next episode"
