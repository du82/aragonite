full_description = 'DATA SCIENCE SALON ATXUSING GENERATIVE AI & MACHINE LEARNING IN THE ENTERPRISE + Startup ShowcaseAustin + On-demand Watch On demandSponsored by OverviewSpeakersScheduleSponsorsApply to Attend Data Science Salon is a flagship Austin, TX event. The intimate two-day 250 person conference curates data science sessions to bring industry leaders and specialists face-to-face to educate each other on innovative solutions in generative AI, machine learning, predictive analytics and acceptance around best practices. You will see a mix of use-cases, technical talks and workshops, and you will walk away with actionable insights from those working on the frontlines of machine learning in the enterprise. All sessions are recorded and will be available on demand after the event.We added The Future of ML & AI Startups + Showcase as part of the second day of programming and this will continue for all DSS ATX events moving forward. This day will include, VC panels sharing insights on the funding journey and startup panels discussing real-world challenges and success stories with AI founders + a start-up showcase with a prize of a monetary credit to help their startup with GTM and overall marketing/growth strategy awarded to the most interesting start-up. Apply here to feature in the DSS ATX Startup Showcase! Participating provides a unique platform to demonstrate your product to our broad and diverse community. speakers attendees in person Past SpeakersShivika BisenData ScientistArun KuppamDirector of Data ScienceDr. Greg MichaelsonChief Product Officer & Co-FounderBrent SchneemanDirector, AI and Software EngineeringFatma TarlaciChief AI Officer Seshendranath Balla VenkataSenior Manager of Software DevelopmentKailash ThiyagarajanSenior Machine Learning EngineerBalaji DhamodharanGlobal Software Analytics LeaderMugdha TasgaonkarData Science LeaderDhivya NagasubramanianLead AI Solutions Architect, VP Apple Anthony MahannaSoftware EngineerDavid TalbyCTOArjun BaliSen