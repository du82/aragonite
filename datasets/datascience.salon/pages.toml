["https://datascience.salon/podcast"]
title = "Data Science Podcast - Data Science Salon"
description = "The official podcast of Data Science Salon. We interview top and rising luminaries in data science, machine learning, and AI on the trends and business use cases that are propelling the field forward. The Data Science Salon series is a unique vertical focused conference which brings together specialists face-to-face to educate each other, illuminate best practices, and innovate new solutions in a casual atmosphere with food, great coffee, and entertainment."
full_description = "Welcome to the official Data Science Salon Podcast!Since its launch six years ago, our podcast has quickly become one of the top 10 machine learning and AI podcasts. Hosted by Q McCallum, our Senior Content Advisor and Anna Anisin, founder of the Data Science Salon, each episode dives deep into the world of data science, machine learning, and AI. Our guests range from DSS speakers to renowned authors and industry professionals, each bringing their unique insights and perspectives on trends and business use cases within these dynamic fields. Listen to our latest episode SPONSOR A PODCAST New – Episode FORTY-ONEBuilding Data Excellence at Nordstrom: Scaling Standards & Measurement for Impact In this episode of the Data Science Salon Podcast, host Anna Anisin sits down with two data leaders from Nordstrom to explore how organizations can build a culture of technical excellence and measurement in data science.First, Gina Schmalzle, Principal Data Scientist at Nordstrom, shares her experience leading the Technical Excellence Initiative within the company’s data science and analytics organization. She discusses the challenges of scaling data teams, the importance of setting standards for efficiency and collaboration, and how MLOps and feature stores can streamline data science workflows. Gina provides practical insights into creating high-quality, scalable data solutions that drive business impact.Next, Kevin Haynes, former Program Manager at Nordstrom, takes us into the world of “Eating Your Own Dog Food”—Building a Culture of Measurement for Data Products. He explores why internal metrics are essential for validating and improving data-driven solutions and how data teams can adopt a product mindset when developing internal tools. Kevin also shares his approach to fostering an engaging, high-impact team culture while ensuring that measurement and accountability remain at the core of data initiatives.Both guests offer interesting insights into building sustainable, high-performing data organizations in today’s evolving AI and data landscape. Tune in to learn actionable strategies from two data leaders shaping the future of AI and analytics.Episode FORTYExploring the Past, Present, and Future of AI/ML In this episode of the Data Science Salon Podcast, host Anna Anisin sits down with two influential leaders in AI and data science to discuss their experiences, challenges, and insights into the evolving landscape of the industry.First, Fatma Tarlaci, Chief Technology Officer at Rastegar Capital, shares her journey as an AI engineering leader, discussing the intersection of technical execution and strategic leadership. She explores the importance of responsible AI, open-source contributions, and aligning technical teams with business goals to drive impactful solutions. Fatma provides actionable insights on fostering innovation while maintaining ethical AI development.Next, Brent Schneeman, Director of AI and Software Engineering at PMG, brings his unique perspective on building high-performing interdisciplinary teams and navigating the evolving expectations in AI and machine learning. He shares lessons learned from his journey, insights into stakeholder collaboration, and the importance of cultivating a “test and learn” culture within organizations.Both guests provide invaluable perspectives on leading AI initiatives, overcoming industry challenges, and staying ahead in an era of rapid technological change. Tune in to gain practical knowledge and inspiration from their experiences.Episode Thirty Nine2025 Predictions: The Future of AI, LLMs, and Data Science In this episode, Anna Anisin, Founder of Data Science Salon, and Tyler Carmody, Head of Event Operations, catch up on everything we missed over the past few weeks. They dive into exciting developments in AI, including how it’s transforming scientific research, solving complex problems, and revolutionizing business tools. They also discuss predictions for 2025—what trends we expect to see in AI, LLMs, and generative AI, and how these technologies are shaping industries across the globe.Plus, don’t miss exciting news about the upcoming DSS ATX event on February 19-20, with a special discount code DSSPODCASTATX for 20% off your registration. We’re also looking for startups to join our showcase—check the application link in the description!Tune in for insights and trends you won’t want to miss as we head into the new year!Episode Thirty EightData-Driven Excellence: AI and Analytics in Action with Matthew Denesuk & Jaime Russ In this DSS Podcast we chat with Matthew Denesuk, SVP of Data Analytics & AI at Royal Caribbean Group. Matthew shares his insights on leveraging a Center of Excellence model to drive data-driven strategies across the organization. Tune in to discover how this approach can transform enterprise business processes using AI, analytics, and data science!We’re also excited to welcome Jaime Russ, former Principal Data Scientist at Ryder System. Jaime brings a fresh perspective on data science, focusing on integrating advanced analytics and machine learning models into traditionally held concepts. Tune in as she explores the application of machine learning in corporate finance and its fascinating parallels to fleet management.Episode Thirty SevenAI in Action: From Machine Learning Interpretability to Cybersecurity with Serg Masís and Nirmal Budhathoki In this DSS Podcast, Anna Anisin welcomes Serg Masís, Climate and Agronomic Data Scientist at Syngenta. Serg, an expert in machine learning interpretability and responsible AI, shares his diverse background and journey into data science. He discusses the challenges of building fair and reliable ML models, emphasizing the importance of interpretability and trust in AI. Serg also talks into his latest book, “Interpretable Machine Learning with Python,” and provides valuable insights for data scientists striving to create more transparent and effective AI solutions.In another compelling episode, Anna sits down with Nirmal Budhathoki, Senior Data Scientist at Microsoft. Nirmal, who has extensive experience at VMware Carbon Black and Wells Fargo, focuses on the intersection of AI and cybersecurity. He shares his journey into security data science, discussing the unique challenges and critical importance of applying AI to enhance cybersecurity measures. Nirmal highlights the pressing need for AI in this field, practical use cases, and the complexities involved in integrating AI with security practices, offering a valuable perspective for professionals navigating this dynamic landscape.Episode Thirty SixAI at the Crossroads: Bias, Diversity, and Scalability with Boshika Tara and Dr. June Andrews In this week’s DSS Podcast, Anna had a conversation with Boshika Tara, Technical Machine Learning Product Manager at H&M Group. Boshika brings over 7 years of experience in technical product development, engineering, and building large-scale ML systems in NLP and Computer Vision. In this episode, she dives into the critical issue of bias in AI, discussing various types of biases in machine learning, how to detect them, and the importance of creating more equitable teams with diverse representation to mitigate these biases. Additionally, Anna had the pleasure of hosting Dr. June Andrews, the Founder of Lat Long Labs. Dr. Andrews shares her incredible journey from leading the Style Discovery team at Stitch Fix to her role as a Tech Lead at LinkedIn. She discusses the complexities of scaling and transforming AI projects, particularly in predicting consumer preferences and enhancing product discovery.Episode Thirty fiveElevating Computer Vision and Female Voices with Alex Levinson and Sheila Beladinejad In this episode of the DSS Podcast, Anna Anisin introduces two powerhouse guests in the realms of AI and robotics.First, Anna welcomes Alex, Principal Algorithms/AI Engineer at Elbit Systems of America, based in Miami. Alex shares her journey into the field of AI, particularly computer vision, and discusses common use cases, pitfalls, and success stories in sourcing and improving data for computer vision models. She also offers valuable recommendations for data scientists starting out in the field and highlights an exciting trend in AI that she’s currently following.Next, Anna introduces Sheila Beladinejad, President of Women in AI & Robotics. Sheila talks about the network she built in Germany, dedicated to fostering gender-inclusive, ethical, and responsible AI and robotics solutions. She highlights the importance of creating such a network and the positive impact it has had on the AI and robotics community.Episode Thirty fourUSING AI & MACHINE LEARNING TO DEVELOP BETTER HEALTHCARE EXPERIENCES WITH SUMAYAH RAHMAN AND VAIBHAV VERDHANIn this episode of the Data Science Salon Podcast, host Anna Anisin sits down with two leading experts in the ML/AI healthcare industry. First, Sumayah Rahman, Director of Data Science – Machine Learning and Infrastructure at Cedar, discusses optimizing the patient experience to make healthcare more affordable and accessible. She explains how ML-powered discounts can benefit both patients and providers, sharing practical examples of using data to enhance patient experiences and highlighting the transformative impact of AI/ML in healthcare.Next, Vaibhav Verdhan, Analytics Leader at AstraZeneca, dives into the role of computer vision in healthcare and his favorite technologies in the healthcare analytics space. He discusses how advanced analytics are driving innovation at AstraZeneca by developing, deploying, and maintaining decision support capabilities. Both guests provide valuable insights into how AI and ML are revolutionizing healthcare, offering listeners practical knowledge and inspiration.Vaibhav ‘s DSS Break – February 2022Sumayah‘s DSS Break – February 2022Episode Thirty threeLESSONS LEARNED FROM APPLYING DATA SCIENCE IN FINANCE AND A DEEP DIVE INTO DRIFT WITH MABU MANAILENG AND ADAM LIEBERMANIn this episode, Anna sits down with two leaders in the finance industry, exploring the forefront of AI and ML innovations.First, we have Mabu Manaileng, Lead Data Scientist at Standard Bank Group. Mabu shares his journey and current role, highlights the challenges of applied data science in the financial sector, and discusses the transformative impact of AI on banking in the coming years.Next, we welcome Adam Lieberman, Head of AI and ML at Finastra. Adam defines the concept of drift, discusses statistical measures to quantify it, and provides strategies for maintaining model health, ensuring that models continue to serve users’ needs effectively.Mabu’s DSS Break – January 2022Adam’s DSS Break – January 2022Episode Thirty twoLeveraging Statistical Models and ESG to Grow Your Business with Laura Gabrysiak and Rochelle MarchIn this episode, Anna sits down with two leaders in the finance industry, exploring the forefront of AI, ML, and ESG innovations.First, let’s welcome Laura Gabrysiak, Data Science Leader at Visa. Laura develops statistical models and decision analytics tools that enable Visa clients to transform massive amounts of data into actionable ML models and AI implementations. She’s also passionate about fostering the local data science community in Miami as the Founder of R-Ladies Miami. In this conversation, they dive into the future of ML/AI in financial services and the impactful work being done with Code Art to promote diversity in tech.Next, we have Rochelle March, former Head of ESG Product at Dun & Bradstreet. Rochelle specializes in impact analysis related to carbon, water, and the Sustainable Development Goals, and applies machine learning to ESG products. She also teaches data and analytics at Bard College’s MBA program, sits on the advisory board for USL Technology, Inc., and mentors fellows in the Environmental Defense Fund’s Climate Corps program. Since recording this episode, Rochelle has started her own company, People Places Words Actions. In our discussion, we explore her journey in ESG innovation and analytics, why ESG data is crucial for responsible investment decisions, and how it drives sustainable business practices.Tune in to learn from these industry thought leaders and gain insights into the cutting-edge applications of AI and ESG data in the finance sector.Laura’s DSS Break – July 2023Rochelle’s DSS Break – June 2023Episode Thirty oneFinTech Insights: AI Innovations, Privacy Strategies, and Synthetic Data with Harry Mendell & Supreet KaurIn this episode, Anna sits down with two distinguished leaders in the ML/AI finance industry. First, we have Harry Mendell, Technology Group Data Architect at the Federal Reserve Bank of New York, who brings over 30 years of expertise in FinTech. Harry shares compelling stories and discusses emerging trends in the finance sector.Following Harry, Supreet Kaur, AVP at Morgan Stanley and product owner for various AI products, joins the conversation. Supreet provides insights into the use of synthetic data to protect customer privacy in FinTech, ensuring informed decision-making. This deep dive into synthetic data highlights its growing importance in the industry.Harry’s DSS Break – July 2023Supreet’s DSS Break – June 2023Episode ThirtyContext Matters: Generative AI, the spectrum of worldviews, and understanding propaganda’s appealBen Dubow studied the Middle East during his undergrad and took a job tracking terrorist groups. After a brief stint at a large tech company, he launched Omelas, a company that combines AI and subject matter expertise to deliver intelligence to national security professionals.In today’s episode, our Senior Content Advisor Q McCallum caught up with Ben to learn more about what Omelas is up to and how the company applies AI and data analysis to its mission.Along the way they explore the value of data in context; why it’s important to ask the right questions of the right data, and not just the whole pool; the power of involving humans in the data pipeline; and what it takes to do NLP and NER at scale. The two also talk about the impact of generative AI on democracy and authoritarianism. A topic which, interestingly enough, holds lessons for corporations that plan to release AI chatbots.Episode Twenty NineWhen companies try to “sprinkle some AI” on a productIf you’ve been in the data game long enough, you’ve probably seen this before: a stakeholder or product owner approaches you with a project that’s 95% done, and they’d like you to … “sprinkle some AI on it.” They’ve heard that this “AI” thing can be useful so they want some of it in their latest effort.Data scientist-turned-product person Noelle Saldana has experienced the “sprinkle some AI on it” request more times than she’d care to remember. Our Senior Content Advisor Q McCallum met up with Noelle to explore this phenomenon. How does this happen? (Hint: “corporate FOMO.”) What should you do when stakeholders insist on implementing AI that isn’t actually going to h"
