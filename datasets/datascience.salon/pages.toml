full_description = "Episode Twenty SixThe roles of economists in data science, with Dr. Amar NattWe’ve all heard the term “economist,” sure. But exactly what does and economist do? And as economics is a very data-driven field, where does their work intersect with data science, machine learning, and AI?To answer that question, Senior Content Advisor Q McCallum spoke with Amar Natt, PhD. She’s an economist at Econ One Research, and her work focuses on advanced analytics and predictive modeling. Does that sound like ML to you? Well, Amar explains that it’s similar in some ways, different in others. From there, she tells us about techniques economists can learn from data scientists, and what data scientists can pick up from econ. (Hint: “causal inference.” You heard it here first.) Previous episode Next episode"
