full_description = '''AI & Machine Learning in the EnterpriseLearn from the brightest minds in data science!DSS Insider offers a selection of engaging technical data science talks tailored to your industry.Sign up for only $95Includes 12 months access to content! hbspt.forms.create({ region: "na1", portalId: "4625340", formId: "86b62482-0927-4f8d-a35e-3eedb1704674" }); EXPERT TALKS PANELS }HOURS OF UNIQUE CONTENT MONTHS ACCESS IFEATURED TALKS AND PANELSThe Two Sided Marketplace of Customer Service: Algorithmic Contact AssignmentGraham Ganssle – Head of Data Science at WayfairOverview of Explainable AI for Natural Language ProcessingJean-Leah Njoroge – Director Conversational AI/NLP at Lowe’s Home ImprovementDSS Elevate Panel: Creating Value with Diverse Data TeamsKim Martin, Angel Durr, Eve Psalti, Roja Boina, Chris BenevichAugment, Don't Automate: Drawing Insights From Customer Feedback Using Natural Language ProcessingPeter Grabowski – AUS Site Lead – Core Enterprise Machine Learning at GoogleAgile Data Science TeamsRandi Ludwig – Director, Data Science at Dell TechnologiesUsing Interconnected ML Models to Tackle Retail ChallengesKshetrajna Raghavan – Staff Data Scientist at ShopifyBuilding Real Time HR Sourcing RecommendationsKim Martin – Director, Software Engineering at IndeedBuilding Data Science Teams in Fast-Paced EnvironmentsCharles Pich – Director, Analytics at GameStopMore Than a Hack, It's Innovation!Arya Eskamani – Director of Global Data Science at VisaPanel Discussion: Implementing and Operationalizing ML Successfully in the EnterpriseMark Moyou, Connie Yee, Jaime Russ, Dr. Man Chon (Kevin) U, Charles Irizarry (Moderation)Applications of Natural Language Processing for Financial EngineeringMoody Hadi – Group Manager – New Product Development & Financial Engineering at S&P Global Market IntelligencePrediction, Parsimony, and Explainable AI at ColgateIraklis Pappas – Director of Predictive Analytics at Colgate-Palmolive See all content included ZTop reasons to sign up✓ Learn from industry leaders and the best in data science in 36+ engaging presentations and panel conversations✓ Learn how to apply state-of-the art AI and machine learning techniques in the enterprise✓ Get 12 months access to the video repository. Watch it whenever it’s most convenient for you!✓ Get access to the DSS Community Network to e-meet and connect with one of the most diverse data science communities. Speakers from top companies SKILLS YOU WILL GAINData ScienceMachine LearningDeep LearningMLOpsAgile Data Science PracticesComputer VisionBuilding Data Science TeamsState-of-the art NLPPredictive AnalyticsData Science LeadershipML OperationalizationPredictive Analytics What’s includedThe Two Sided Marketplace of Customer Service: Algorithmic Contact AssignmentGraham Ganssle - Head of Data Science at WayfairWayfair may be a home goods retailer, but our customer service representatives are taxi drivers. Our customers are on the street wishing they could catch a ride. In this talk, I’ll describe the Uber of the customer service world: Wayfair’s Algorithmic Contact Assignment (ACA) product. ACA is an adaptive machine learning product that connects customer phone calls and chats to customer service agents. For each customer contact, ACA makes rider/driver-like connections in a hyper-personalized assignment that ensures the customer’s intent, the contact’s complexity, and the value-at-stake of the interaction are handled by the goldilocks agent (the agent with the single best natural proclivities to handle that contact juuuust right). The result is the customer gets what they need faster, happier, and with better resolutions. When customer Sarika got from the parking lot to the soccer field just in time to see her daughter’s first goal because she got off her call with a Wayfair returns specialist in 98 seconds, we knew ACA was perfect! Panel Discussion: Handling Technical Surprise in the EnterpriseFeaturingPeter Wang, CEO at AnacondaYing Ying, Bill & Lewis Suit Professor at University of Texas at AustinMike Shores, Dr. Director – Data Science at VistaSarita Joshi, AI Specialist at GoogleAndy Terrel, CTO at StoryfitThe Art of Observability in Machine Learning: Ensuring Performance and ReliabilityReah Miyara - VP of Product at AporiaIn the world of machine learning, ensuring the performance and reliability of models is essential for success. This requires a deep understanding of how the models are behaving and why they are behaving in a certain way. In this presentation, we will discuss the importance of observability in machine learning and how it can help to ensure the performance and reliability of models. We will explore the key metrics that should be monitored, the types of observability tools that are available, and best practices for implementing observability in machine learning workflows.We Need to Talk about Data MistakesCaitlin Hudon - Data Scientist at Figma and Laura Ellis - VP of Data Engineering & Platform Analytics at RapidLet’s talk about mistakes we’ve made while working with data – what we did, what we learned and why we share.Team and Self Empowerment while Making an Impact with DataLalitha Pragada - Director of Data at AffiniPayA plain simple question of how we get to keep giving our best, grow up the ladder when there are many many dynamics at play. How to lead with empathy and still win the game. Data team empowerment is a crucial aspect of creating a successful data-driven organization. This results in numerous benefits, including increased productivity, improved data quality, faster insights, and better decision-making. Organizations must ensure that data teams are recognized for their contributions and that their work is valued throughout the organization. Let’s talk a little bit about all this and also how to prioritize data literacy and create a culture that values data-driven decision-making to ensure that data teams are able to collaborate effectively with other departments.MLOps Designed for Data ScientistsJeff Will - Senior Product Manager at WallarooIf you’ve ever thought “production is where ML goes to die,” I’m here to propose putting model operations into the hands of the model experts – the data scientists – and making production the value-generating engine it is meant to be. In this session, I deconstruct the challenges many data scientists face and what it looks like to put you at the center of model operations. With purpose-built tools to effortlessly take models from experimentation to production while avoiding operational roadblocks, you will discover how MLOps can be re-imagined to incorporate a data science perspective.Navigating Cyber Security Threats in Open-Source SoftwareHassam Mian - Senior Sales Engineer at AnacondaThe use of open-source software (OSS) in the enterprise has seen continued growth in recent years, enabling rapid innovation and solution development. Unfortunately, as the use of OSS has increased, so too have software supply chain attacks.OSS security presents unique challenges that are not typically well-served by traditional IT management and security tools. How do you ensure your open-source pipeline is protected from attacks like the recent Kaseya and Log4j incidents?In this session, we will discuss:-Lessons learned from helping secure the OSS pipelines of our customers-Best practices and common pitfalls to avoid-The implications of recent regulatory changes related to software supply chain security-What you can do to prepare for the futureOverview of Explainable AI for Natural Language ProcessingJean-Leah Njoroge - Director Conversational AI/NLP at Lowe's Home ImprovementRecent years have seen important advances in the quality of state-of-the-art models; however, this has come at the expense of models becoming less interpretable. In this talk, I will present an overview of the current state of Explainable AI (XAI), within the domain of Natural Language Processing (NLP); the operations and explainability techniques currently available for generating explanations for NLP model predictions, to serve as a resource for model developers in the community.DSS Elevate Panel: Creating Value with Diverse Data TeamsFeaturingKim Martin, Director, Software Engineering at IndeedAngel Durr, Founder of DataReady DFW and Lecturer at the University of NevadaEve Psalti, Senior Director, Artificial Intelligence Engineering at MicrosoftRoja Boina, Chapter Co-Lead at Women in DataChris Benevich, Counder & President at Revel Data IncorporatedAI in Health: Enabling Better CareYing Ding - Bill & Lewis Suit Professor at University of Texas at AustinThis talk will outline the current advances in applying AI technologies in medical imaging diagnosis, medical notes, and health risk prediction. The latest AI technologies include transformer, knowledge graph, and explainable AI. This talk summarizes the opportunities and challenges related to AI in health.Scaling Up Human-AI Collaboration for the New Frontier of Financial CybersecurityKelly Tsao - UX Designer at Q2 and Jesse Barbour - Chief Data Scientist at Q2Intelligence is more than the human brain. This case study delves into the philosophical underpinnings of how artificial intelligence applied to financial technology problems at the enterprise or platform level reveals new powers of scale. Cognitive science and UX best practices enable effective human-computer-AI interaction at the individual level, which creates an emergent intelligence greater than the sum of its parts once connected to a diverse network of financial institutions.Opportunities Happen in the Moment, Not in Batches: Revenue Growth through Predictive InterventionsJay Van Zyl - Founder at ecosystem.aiThis presentation provides an overview of the opportunities that arise from changes in human behavior and how to capitalize on them by capitalizing on machine learning and a no-code environment. It will look at how these approaches can help drive revenue growth through predictive interventions, with case studies used to illustrate the effectiveness of this strategy. The presentation will demonstrate how batch-based approaches are no longer suitable for the ever-changing landscape of consumer behavior, and how a continuous machine learning approach, combined with a no-code environment, can enable businesses to stay ahead of the curve and drive profitable growth.Enhancing Supply Chain Sustainability and Efficiency through Data Science and EngineeringAlex Schwarm - Head of Data (Data Science, ML/Data Engineering, Analytics Engineering) at Arrive LogisticsThe supply chain is a critical part of the US economy. The freight/trucking industry is the largest component of the US supply chain, both in terms of economic impact ($875B+ in costs and ~11B tons moved in 2021, ATA 2022) and greenhouse gas emissions (420M metric tons equivalent in 2021, US BTS 2022).In this talk, we will discuss examples of Data Science, Data Engineering, and ML Engineering challenges and corresponding solutions to improve sustainability, efficiency, and profitability for the US trucking market. We will also briefly discuss the challenges in implementing real-time, online solutions at a very fast-growing, fast-moving company with high quality of service expectations.Principles for Building High Quality Models using High Quality Data at ScaleAtindriyo Sanyal Chief Technology Officer at Galileo Inc.Machine Learning (ML) is increasingly used to make business-critical decisions across multiple industries. The surge of deep learning has further accelerated this data across multiple data modalities. But unlike traditional software, which has well-defined standards and practices, ML systems lack a systematic way to measure the full spectrum of model quality.In this talk, we will dive deeper into what ML Data Intelligence means and how it solves the Data Quality problem in Machine Learning, the primary determinant of Model Quality. We’ll be discussing the key principles, techniques, and indicators employed in curating high-quality, error-free datasets for ML and productionizing high-quality models.Panel Discussion: AI State of the Art, Organizational Topologies, and Defining SuccessFeaturingGraham Gassle, Head of Data Science, Sales, and Customer Service at WayfairSweta Sinha, Director, Data Science at Ascend LearningRandi Ludwig, Director, Data Science at Dell TechnologiesAlec Coughlin, Client Partner, Financial Services at LivePersonAugment, Don't Automate: Drawing Insights From Customer Feedback Using Natural Language ProcessingPeter Grabowski - AUS Site Lead - Core Enterprise Machine Learning at GoogleCompanies are frequently faced with large amounts of unstructured text data, like forum comments or product reviews. Important trends can emerge in these datasets, but it can be time-consuming to read through comments, and keyword matching frequently misses critical nuances.We’ll discuss how we’ve approached this problem at Google using Natural Language Processing, with examples of the approach applied to open datasets.We’ll explore how this fits into the ML project lifecycle, with examples of common pitfalls. Finally, we’ll highlight how to use this technology as part of a “human in the loop” approach to supercharge your existing team members.Agile Data Science TeamsRandi Ludwig - Director, Data Science at Dell TechnologiesAgile software development practices are great tools to increase the visibility and productivity of any team writing code. However, the data science lifecycle has some particular differences from traditional software development that make it tricky to implement. Randi has led multiple teams of data scientists through the transition of adopting and then thriving using modified Agile methodologies.She will share tips and tricks for how to get the most value out of Agile in the ways that are most beneficial to the uncertain process of data science. She will also share an adoption roadmap to go from wild west data science to a well-oiled value factory!ML-Powered Discounts: Helping Patients and Improving Financial Results for ProvidersSumayah Rahman - Director of Data Science - Machine Learning and Infrastructure at CedarDiscounting is a pricing technique that can be used to encourage customers (in our case, patients) to pay their bill. If discounting is done right, this can lead to an overall increase in revenue. We applied ML to identify which patients should receive a discount on their bill, but, like many ML projects, it was not as straightforward as it seemed. For example, we realized that the target variable for our model did not fully capture the outcome we are trying to optimize for financial results. By digging into the data to more deeply understand trends in payment behavior, we took steps to build a more robust solution– a journey that is still ongoing!Using Interconnected ML Models to Tackle Retail ChallengesKshetrajna Raghavan - Staff Data Scientist at ShopifyRunning a retail business is hard. At Shopify, we have '''
