["https://www.datascience.salon/episode-41-building-data-excellence-at-nordstrom-scaling-standards-measurement-for-impact"]
title = "Episode 41: Building Data Excellence at Nordstrom: Scaling Standards & Measurement for Impact - Data Science Salon"
description = 'In this episode of the Data Science Salon Podcast, host Anna Anisin sits down with two data leaders from Nordstrom to explore how organizations can build a culture of technical excellence and measurement in data science.First, Gina Schmalzle, Principal Data Scientist at Nordstrom, shares her experience leading the Technical Excellence Initiative within the company’s data science and analytics organization. She discusses the challenges of scaling data teams, the importance of setting standards for efficiency and collaboration, and how MLOps and feature stores can streamline data science workflows. Gina provides practical insights into creating high-quality, scalable data solutions that drive business impact.Next, Kevin Haynes, former Program Manager at Nordstrom, takes us into the world of "Eating Your Own Dog Food"—Building a Culture of Measurement for Data Products. He explores why internal metrics are essential for validating and improving data-driven solutions and how data teams can adopt a product mindset when developing internal tools. Kevin also shares his approach to fostering an engaging, high-impact team culture while ensuring that measurement and accountability remain at the core of data initiatives.Both guests offer interesting insights into building sustainable, high-performing data organizations in today’s evolving AI and data landscape. Tune in to learn actionable strategies from two data leaders shaping the future of AI and analytics.'
