full_description = "DISCOVER THE LATEST AND SHARPEN YOUR SKILLS IN AI, DATA SCIENCE, MACHINE LEARNING, AND RELATED TOPICS. Upcoming webinars Watch recordingsPast webinarsMatching Patients with Clinical GuidelinesRecorded on: Wednesday, January 22 @ 2pm ET Healthcare systems, payers, and medical societies invest massive effort to maintain evidence-based clinical guidelines for a variety of conditions. However, when patients are in the hospital, often clinicians just don’t have the time to research or read these guidelines, leading to major gaps in how consistently they are applied. Recent advances in Medical AI can shortcut this problem by automatically reading the full history of a given patient, finding the most recent and relevant guideline for their clinical history, and presenting it in context. This session will walk through a solution architecture for an end-to-end solution that does this, using a state-of-the-art healthcare-specific LLM, that can be deployed locally within an organization’s security perimeter to ensure privacy, compliance, and the ability to read organization-specific guideline documents. We’ll also show how to handle formatting of clinical guideline documents that are challenging to general-purpose LLMs like flowcharts, decision trees, and visual decision tables. watch recording Veysel KocamanChief Technology Officer, John Snow LabsTop-10 Misconceptions About LLM Judges in ProductionRecorded on: Wednesday, December 4 @ 2pm ET Implementing LLM “judges” in production settings can be a game-changer for evaluating AI behaviors, but it’s often more challenging than it appears. Many teams struggle with common pitfalls such as; high error rates and cost unpredictability to issues with latency and long-term maintenance. This webinar will break down the top 10 misconceptions around LLM judges, equipping you with the insights to avoid these challenges and build more reliable, production-ready evaluation systems.Join us to learn:• Key Misconceptions: Understand where teams often go wrong in deploying LLM judges.• EvalOps Principles: Discover best practices and tools to operationalize evaluations effectively.• Reliability in Production: Learn how to make evaluation outcomes systematic, scalable, and dependable.• Use Cases & Value: Explore real-world applications where LLM judges add significant value and the tangible results they deliver.Who Should Attend:This webinar is ideal for machine learning engineers, data scientists, AI practitioners, and technical leaders seeking to enhance their approach to model evaluation in production environments. watch recording Ari HeljakkaFounder & CEO, Root Signals Ouz GencogluCo-Founder & Head of AI, Root SignalsBuilding Patient Journeys from Multi-Modal Healthcare Data Using Medical Language ModelsRecorded on: Thursday, October 31 @ 2pm ET Data integration has been an enormous challenge in healthcare for decades. Issues of data standardization, data quality, legacy formats, unstructured data, and semantic inconsistencies have made it hard to answer basic questions about how a hospital operates or what should be done next for a patient. Recent advances in Healthcare AI combine to transform this age-old problem – enabling you to automatically ingest large volumes of raw, multi-format, multi-modal, untrusted medical data into coherent longitudinal patient stories in an industry-standard format.This webinar presents an integrated solution in action that uses John Snow Labs’ state-of-the-art Medical Language Models, healthcare-specific data preparation pipelines, and Text-to-OMOP question answering models running on Databricks’ secure, scalable, and compute-optimized AI platform. The solution takes in multi-modal data – structured (tabular), semi-structured (FHIR resources), and unstructured (free-text) – and generates an OMOP/OHDSI standard data model that:– Builds a unified view of each patient over time.– Builds this unified patient view from multi-modal source data.– Reasons at the patient level.We’ll then show how the resulting patient data model can then be used for either “AI” (building patient cohorts with natural language queries) or for “BI” (dashboards for patient risk scoring and quality measures), all from the same source of truth, with full explainability and traceability. watch recording Kayla GriemeSenior Solutions Architect – Academic Medical Centers, Databricks Kate WeberSenior Data Scientist, John Snow LabsFireside Chat – Efficiency Unlocked: The Power of Synthetic Data in Modern EnterprisesRecorded on: Wednesday, October 2 @ 2pm ET Synthetic data has emerged as a powerful tool for organizations looking to enhance their operational efficiency and reduce costs. By generating artificial data that mimics real-world data, companies can overcome limitations related to data scarcity, privacy concerns, and high costs associated with data collection and storage. This conversation will delve into the practical benefits and real-world applications of synthetic data, providing insights on how it can drive significant efficiency gains and cost savings. watch recording Varun NakraVice President, Deutsche Bank Raghavan MuthuregunathanSenior Engineering Manager, Search AI, Linkedin Alex WatsonCo-Founder & CPO, Gretel.aiPolars and Time Series: What It Can Do, What It Can’t (Yet!), and What You Can Do About ItRecorded on: Tuesday, September 10 @ 12:00pm ET Time series analysis is ubiquitous in applied data science because of the value it delivers. In order to do effective time series analysis, you need to know your tools well. Polars has excellent built-in time series support, and it’s also possible to extend it where necessary.In this talk, we will cover:– Basic built-in time series operations with Polars (e.g. “what’s the average number of sales per month?”).– Advanced, custom time series operations, and how you can implement them as Polars plugins (e.g. business day arithmetic).– What Polars can’t (yet!) do, and what we can do about itAudience level:Basic interest and knowledge of Python and data will be assumed, but no prior Polars experience is required.—This event is hosted by OpenTeams (https://www.openteams.com), the sponsor of REPOS, a platform that promotes sustainable funding for open source projects. To learn more, visit https://repos.openteams.com. watch recording Marco GorelliSr. Software Engineer, Quansight Labs Inessa Pawson OSPO Manager, OpenTeamsWhy You Should Consider Being a TrainerRecorded on: Thursday, August 22 @ 12:00pm ET Have you ever considered pursuing a career in training? For our guest speaker, Reuven Lerner, this path was not obvious at first. With a degree in Computer Science, the expectation was a career focused on software engineering and architecture. However, after many years of teaching Python and pandas full-time, he has found both greater financial rewards and a deeper sense of fulfillment and excitement in his work. In this talk, he will share valuable insights into the world of corporate training, his journey into this field, and whether it might be a suitable path for you. The session will conclude with an open Q&A, providing an opportunity for attendees to ask questions and learn more. watch recording Reuven LernerPython Trainer, Lerner PythonOpen Source Qualified Leads: A Marketing Framework for Commercial Open SourceRecorded on: Wednesday, July 31 @ 12:00pm ET Commercial open source businesses face a unique challenge compared to their proprietary software counterparts: many potential customers already have access to a free version of their product. Determining which open source users are most likely to be interested in paid support, premium features, or other business offerings can be daunting. In this talk, we present a novel framework that commercial open source businesses can utilize to score leads based on their open source usage. This framework helps them establish a thriving business around their open source project. watch recording Avi PressCEO & Founder, ScarfMaking Multimodal Generative AI WorkRecorded on: Wednesday, June 17 @ 2:00pm ET The future of generative-AI is multimodal and yet, projects involving LLM and Large Vision Models in production are already struggling as teams try to scale up (and out) awe-inspiring Twitter demos. We’ll discuss what teams need to be doing to support the development and integration of multimodal models into product features. watch recording Mikiko BazeleyAI & MLOps Engineer, LabelboxFast, Cheap, Scalable: Open-Source LLM Inference with Spark NLPRecorded on: Wednesday, June 26 @ 2pm ET Learn how the open-source Spark NLP library provides optimized and scalable LLM inference for high-volume text and image processing pipelines. This session dives into optimized LLM inference without the overhead of commercial APIs or extensive hardware setups. We will show live code examples and benchmarks comparing Spark NLP’s performance and cost-effectiveness against both commercial APIs and other open-source solutions.Key Takeaways:Learn how to efficiently process millions of LLM interactions daily, circumventing the costs associated with traditional LLM deployments.Discover advanced methods for embedding LLM inference within existing data processing pipelines, enhancing throughput and reducing latency.Review benchmarks that compare Spark NLP’s speed and cost metrics relative to commercial and open-source alternatives. Watch recording Danilo BurbanoSoftware and Machine Learning Engineer at John Snow LabsDanilo Burbano is a Software and Machine Learning Engineer at John Snow Labs. He holds an MSc in Computer Science and has 13 years of commercial experience. He has previously developed several software solutions over distributed system environments like microservices and big data pipelines across different industries and countries. Danilo has contributed to Spark NLP for the last 6 years. Turning Open Source Into a Sustainable BusinessRecorded on: Wednesday, June 12 @ 2:00pm ET Turning open-source projects into sustainable businesses is a crucial challenge for those in the tech industry. This AMA session explores practical strategies for building profitable business models within the open-source landscape. Travis and Peter will talk about various revenue streams such as support services, premium features, dual licensing, and partnerships. Participants will learn how to effectively communicate the value of open-source solutions, engage with communities for support and feedback, and balance open-source ethos with commercial objectives.Join us and bring your questions for our speakers, Peter Wang from Anaconda and Travis Oliphant from OpenTeams, as they provide insights on transforming open-source initiatives into lasting ventures. watch recording Travis OliphantCEO, Open Teams and Quansight Peter WangChief AI and Innovation Officer & Co-founder, AnacondaNew State-of-the-art Accuracy for the 3 Primary Uses of Healthcare Language ModelsRecorded on: Tuesday, May 29, 2024 @ 2pm ET This talk presents new levels of accuracy that have very recently been achieved, on public and independently reproducible benchmarks, on the three most common use cases for language models in healthcare:Understanding clinical documents: Such as information extraction from clinical notes and reports; detecting entities, relationships, and medical codes; de-identification; and summarization.Reasoning about patients: Fusing information across multiple modalities (tabular data, free text, imaging, omics) to create a longitudinal view of each patient, including making reasonable inferences and explaining them.Answering medical questions: Answering medical licensing exam questions, biomedical research questions, and similar medical knowledge questions – accurately, without hallucinations, and while citing relevant sources. Watch recording David TalbyCTO at John Snow LabsDavid Talby is the Chief Technology Officer at John Snow Labs, helping companies apply artificial intelligence to solve real-world problems in healthcare and life science. David has extensive experience building and running web-scale software platforms and teams – in startups, for Microsoft’s Bing in the US and Europe, and to scale Amazon’s financial systems in Seattle and the UK. David holds a Ph.D. in Computer Science and Master’s degrees in both Computer Science and Business Administration. He was named USA CTO of the Year by the Global 100 Awards in 2022 and Game Changers Awards in 2023.Supporting Open Source in the Post-xz utils Backdoor WorldRecorded on: Thursday, May 22 @ 2pm ET On April 5th, 2024, the open-source community faced a significant challenge when a malicious backdoor was discovered in xz Utils, a popular data compression utility. This incident, triggered by the original maintainer’s burnout and subsequent manipulation by an attacker, underscores the vulnerabilities that arise from insufficient community support and the pressures faced by open-source maintainers. Watch recording Armin NehzatChief Product & Marketing Officerat Thanks.devGuiding organisations to accelerate innovation and digital transformation. Over 15 years experience in managing projects and product development life cycles. Strong knowledge of Sales, Marketing, Manufacturing tech stack. Strong knowledge of DevOps in IoT, eCommerce, web and mobile application design.The 2024 Generative AI in Healthcare SurveyRecorded on: Tuesday, April 30, 2024 @ 2pm ET This webinar presents key findings from the 2024 Generative AI in Healthcare Survey, conducted in February & March of 2024 by Gradient Flow to assess the key use cases, priorities, and concerns of professionals and technology leaders in this space. Topics covered:Current levels of adoption and budget allocationTypes of language models being usedUse cases for LLMsPriorities for evaluating LLMs and roadblocksLLM model enhancement strategiesLLM testing for Responsible AI requirements Watch recording Ben LoricaThe Founder of Gradient FlowBen Lorica is founder at Gradient Flow. He is a highly respected data scientist, having served leading roles at O’Reilly Media (Chief Data Scientist, Program Chair of the Strata Data Conference, O’Reilly Artificial Intelligence Conference, and TensorFlow World), at Databricks, and as an advisor to startups. He serves as co-chair for several leading industry conferences: the AI Conference, the NLP Summit, the Data+AI Summit, Ray Summit, and K1st World. He is the host of the Data Exchange podcast and edits the Gradient Flow newsletter. David TalbyCTO at John Snow LabsDavid Talby is the Chief Technology Officer at John Snow Labs, helping companies apply artificial intelligence to solve real-world problems in healthcare and life science. David has extensive experience building and running web-scale software platforms and teams – in startups, for Microsoft’s Bing in the US and Europe, and to scale Amazon’s financial systems in Seattle and the UK. David holds a Ph.D. in Computer Science and Master’s degrees in both Computer Scie"
