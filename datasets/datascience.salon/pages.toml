mmunity demographics) is the only industry community focused on AI and machine learning applications in different verticals. DSS has micro communities and Meetups in San Francisco, Miami, New York, Austin, Seattle, Montreal, London and Zurich covering the following verticals: Media, Entertainment, Advertising, Technology, FinTech, Healthcare, Retail, eCommerce, Travel, Logistics and others. 500-1,200 decision makers and Sr. Data Scientists attend each virtual salon, 150-350 attend each in person salon. Learn more"
