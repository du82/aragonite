description = "Join the local data science community at DSS NYC on June 18, 2024 for a full day of networking and content sharing focused on AI and ML in finance & technology!"
full_description = "Data Science Salon NYCApplying AI & Machine Learning to Finance & TechnologyNew York | May 15, 2025 get ticketsSponsored by OverviewSpeakersApply to AttendREGISTER Join us at Data Science Salon New York for an exclusive experience designed to connect you with the people you’d like to meet, without any surprises. Data Science Salon New York is an annual one-day conference, limited to vetted attendees, focused on using artificial intelligence, data science and machine learning in finance, insurance and technology. This intimate event, a mix of TedEx, Foo Camp and Summit, curates sessions to bring senior managers, C-suite executives, and the most talented local AI/ML researchers face-to-face, fostering education and collaboration on innovative solutions in AI, machine learning, data science, predictive analytics, and best practices. Expect to walk away with actionable insights from those working on the frontlines of AI and machine learning in finance, insurance and technology. Please note, all session footage will only be available to those who attend the event in person.DSS NYC 2025Day(s):Hour(s):Minute(s):Second(s) Confirmed SpeakersSai Sharanya NallaPrincipal Data & Applied ScientistSasibhushan Rao ChanthatiAVP Sr. Software EngineerGurleen AhujaData Scientist IIKristi Kunworee BaishyaAI Product ManagerAnil Kumar MokaLead Software Engineer Dhivya NagasubramanianVice President AI Transformation and InnovationYu YuDirector of Data ScienceMoody HadiHead of Credit Analytics, New Product DevelopmentYashasvi SinghData StewardDan LiyanageMachine Learning Scientist watch dss nyc 2024 on-demandTOPICS INCLUDEPersonalization at Scale with AICloud Automation and MLRecommendation EnginesDesigning ML pipelines efficientlyNatural Language Processing & Deep LearningDeep Neural NetworksImage Recognition with MLUsing large scale data setsScaling ML ProductionData Science Teams: Managing, Building, CollaborationIntegrating Open Source Tools into your workflowsImproving Data QualityMachine learning best practicesData SecurityAbout DSS New YorkData Science Salon New York is a one-day, invite-only experience for senior managers, C-suite executives, and top local AI/ML researchers. This exclusive event is all about networking and connecting you with the right people you want to meet. It features a curated mix of use-cases, technical talks, workshops, and Q&A sessions, designed to foster direct interaction and collaboration among industry leaders. Apply to attend and join us to gain actionable insights from those at the forefront of machine learning in the enterprise. apply to speakWHY ATTEND THE DSS NYC EXPERIENCE?Network with the Right People: Connect with senior managers, C-suite executives, and top local AI/ML researchers in an exclusive, invite-only setting.Engage in Curated Sessions: Participate in a carefully selected mix of use-cases, technical talks, workshops, and Q&A sessions tailored to foster direct interaction and collaboration.Learn from the Best: Gain insights from practitioners, technical experts, and executives on what AI and machine learning mean for the enterprise.Interactive Q&A: Ask expert speakers your questions during live Q&A sessions.Actionable Insights: Walk away with practical knowledge and strategies from those working on the frontlines of machine learning in the enterprise.Exclusive Access: Session footage will only be available to those who attend the event in person. Grab Your Spot Top attending companies VenueS&P Global Market Intelligence, 55 Water St, New York, NY 10041Purchase a Pass to DSS NYC 2025Click here to buy ticketsSell tickets online with Ticket Tailor In partnership with Be a community partner“Over the years Data Science Salon has grown into an amazing community of likeminded practitioners across multiple domains. We learn from each other different applications and techniques that normally we would not have seen within our own industry. Such a strong community of smart applied data scientists within an open and collaborative setting!”Moody HadiHead of Credit Analytics New Product Development, S&P Global“Both Viacom and Data Science Salon are known for being at the forefront of their fields. We’re proud to provide a platform for DSS, and to host the most relevant conversations on data science in media and entertainment.”Colleen Fahey RushCHIEF RESEARCH OFFICER, VIACOM“We at Katana Graph had the pleasure of being a sponsor at the DSS NYC event in December 2022. Every aspect starting from the sponsorship support, to the venue and post event communication has been absolutely stellar. This event has attracted some of the brightest and most engaging audience members as well as industry leaders which resulted in very thoughtful conversations. We look forward to supporting future DSS events!”Justin Fine DIRECTOR OF FIELD ENGINEERING AT KATANA GRAPH“Their conferences are smaller, more intimate, with lots of opportunities for workshops and networking, which helps fill that need in the data science community to get together from time to time.”David TalbyCTO, John Snow Labs“Data Science SALON is a must-attend event for decision-makers across the data science landscape. The combination of high-quality content and power networking creates a unique opportunity to generate business.”Matt DenesukSVP, DATA ANALYTICS & AI, ROYAL CARIBBEAN GROUP“The Data Science Salon series is the most important new conversation happening in the industry right now.”Eduardo Arino de la RubiaHEAD OF DATA SCIENCE, INSTAGRAM Ways to get involvedJoin the DSS Slack CommunityJoin nowBecome a community partnerLearn moreBecome a DSS speakerApply nowBecome a volunteerApply nowSponsor an eventLearn moreBecome a DSS AmbassadorApply now"
