full_description = 'DATA SCIENCE SALON ATXUSING GENERATIVE AI & MACHINE LEARNING IN THE ENTERPRISE + Startup ShowcaseAustin + On-demand Watch On demandSponsored by OverviewSpeakersScheduleSponsorsApply to Attend Data Science Salon is a flagship Austin, TX event. The intimate two-day 250 person conference curates data science sessions to bring industry leaders and specialists face-to-face to educate each other on innovative solutions in generative AI, machine learning, predictive analytics and acceptance around best practices. You will see a mix of use-cases, technical talks and workshops, and you will walk away with actionable insights from those working on the frontlines of machine learning in the enterprise. All sessions are recorded and will be available on demand after the event.We added The Future of ML & AI Startups + Showcase as part of the second day of programming and this will continue for all DSS ATX events moving forward. This day will include, VC panels sharing insights on the funding journey and startup panels discussing real-world challenges and success stories with AI founders + a start-up showcase with a prize of a monetary credit to help their startup with GTM and overall marketing/growth strategy awarded to the most interesting start-up. Apply here to feature in the DSS ATX Startup Showcase! Participating provides a unique platform to demonstrate your product to our broad and diverse community. speakers attendees in person Past SpeakersShivika BisenData ScientistArun KuppamDirector of Data ScienceDr. Greg MichaelsonChief Product Officer & Co-FounderBrent SchneemanDirector, AI and Software EngineeringFatma TarlaciChief AI Officer Seshendranath Balla VenkataSenior Manager of Software DevelopmentKailash ThiyagarajanSenior Machine Learning EngineerBalaji DhamodharanGlobal Software Analytics LeaderMugdha TasgaonkarData Science LeaderDhivya NagasubramanianLead AI Solutions Architect, VP Apple Anthony MahannaSoftware EngineerDavid TalbyCTOArjun BaliSenior Data ScientistChristine GalibDirector, Advancing Photonics TechnologiesAri HeljakkaCo-Founder & CEO, Root Signals Adrienne C. PubylskiPublic Sector Vice PresidentMichael MaloneyPrincipalGarnet S. HeramanCo-Founder, Managing PartnerRohin TagraFounder, CEOGeorge PlossHead of VC Practice Jesse MartinezFounder, CEO, ChairDr. Jan E. OdegardManaging PrincipalAriana SmetanaCEO, FounderLauren Burke-McCarthySenior Data Science Lead, AI StrategyGopinath SundaramurthyFounder & Head of Data Science Aarohi TripathiSenior Data EngineerOksana MalyshevaManaging Partner & CEO watch on demandMEET THE JUDGES OFTHE 2025 DSS ATX STARTUP SHOWCASEDr. Jan E. OdegardManaging Principal, 62x LLCDr. Christine GalibDirector, Advancing Photonics Technology, Princeton UniversityAdrienne C. PubylskiPublic Sector Vice President, SHI International GroupBalaji DhamodharanGlobal Software Analytics Leader, AMDTake advantage of this unique opportunity to showcase your product before a vibrant and diverse audience at the DSS ATX Startup Showcase (must be pre-seed or less to qualify). We are selecting four startups to pitch their innovations in front of a panel of five judges and an engaged audience of 200 attendees. Last year, [ Vectorize ] took home the top prize, highlighting the potential for transformative success through this platform. This is more than just exposure—it’s a chance to connect directly with potential users who are actively seeking and ready to embrace new solutions. Don’t miss the chance to position your product at the forefront of an audience eager to discover and benefit from groundbreaking technologies like yours.MEET THE FOUNDERS OFTHE 2025 DSS ATX STARTUP SHOWCASEAnekha SokhalFounder & Lead Data ScientistIain MontfordFounder & CEO Irina StarovoitovaProject ManagerNancy TyagiChief Technical OfficerSurjodeep SarkarChief Operating Officer Jeremy AntoniukFounder & CEO CONGRATS TO SCALAFAI FOR THEIR WIN IN THE DSS ATX 2025 STARTUP SHOWCASE! TOPICS INCLUDEFrom Unicorn Data Scientist to Key Roles in Data Science: Standardizing RolesOverview of Explainable AI for Natural Language ProcessingThe Intelligence of Systems: Scaling Up Human-AI Collaboration for the New Frontier of Financial CybersecurityIncreasing Customer Satisfaction in the B2B Space Using MLAgile Data Science TeamsProduct Led Growth: A New and Upcoming Concept in Data Driven IndustriesAbout DSS AustinData Science Salon Austin gathers the most diverse community in the data science field, bringing together executives, senior data science practitioners, data science managers, analysts, and engineering professionals. The format includes an optional expo and lots of time for networking in a casual environment with entertainment.Why Attend the DSS Austin Experience?Improve your data skills in engaging live presentations and panel discussionsMeet and connect with leading data scientists in a casual atmosphereLearn how to apply state-of-the art AI and machine learning techniques in the enterpriseAsk expert speakers questions in live Q&A sessionsEnjoy fun cocktail hours and great entertainmentAccess the recordings of all sessions until two weeks after the event Past Attending Companies VenueNetsuite Oracle’s HQ: 2300 Oracle Wy, Austin, Texas.purchase on-demand tickets for DSS ATX Are you interested in attending multiple DSS events? Get 20% off the regular ticket price if you register for two events and 30% off if you register for three or more events. Reach out to events@formulatedby.com for more details. All ticket sales are final and non-refundable, however you can transfer your ticket any time. In partnership with Be a community partner“Over the years Data Science Salon has grown into an amazing community of likeminded practitioners across multiple domains. We learn from each other different applications and techniques that normally we would not have seen within our own industry. Such a strong community of smart applied data scientists within an open and collaborative setting!”Moody HadiHead of Credit Analytics New Product Development, S&P Global“Both Viacom and Data Science Salon are known for being at the forefront of their fields. We’re proud to provide a platform for DSS, and to host the most relevant conversations on data science in media and entertainment.”Colleen Fahey RushCHIEF RESEARCH OFFICER, VIACOM"We at Katana Graph had the pleasure of being a sponsor at the DSS NYC event in December 2022. Every aspect starting from the sponsorship support, to the venue and post event communication has been absolutely stellar. This event has attracted some of the brightest and most engaging audience members as well as industry leaders which resulted in very thoughtful conversations. We look forward to supporting future DSS events!"Justin Fine DIRECTOR OF FIELD ENGINEERING AT KATANA GRAPH“Their conferences are smaller, more intimate, with lots of opportunities for workshops and networking, which helps fill that need in the data science community to get together from time to time.”David TalbyCTO, John Snow Labs“Data Science SALON is a must-attend event for decision-makers across the data science landscape. The combination of high-quality content and power networking creates a unique opportunity to generate business.”Matt DenesukSVP, DATA ANALYTICS & AI, ROYAL CARIBBEAN GROUP“The Data Science Salon series is the most important new conversation happening in the industry right now.”Eduardo Arino de la RubiaHEAD OF DATA SCIENCE, INSTAGRAM"Conferences are dice-rolls and I felt so lucky. That was top notch content. The career path I chose is a bit lonely, because if you run an AI/ML COE, then you are the only person doing that at your company. That makes me appreciate the community you are building at DSS all the more!"Jodi BlombergVP, DATA SCIENCE, COX AUTOMOTIVE Ways to get involvedJoin the DSS Slack CommunityJoin nowBecome a community partnerLearn moreBecome a DSS speakerApply nowBecome a volunteerApply nowHost a booth at the eventLearn moreBecome a DSS AmbassadorApply now'
