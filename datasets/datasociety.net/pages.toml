["https://datasociety.net/our-network"]
title = "Data & Society — Our Network"
description = "Data & Society advances public understanding of the social implications of data-centric technologies and automation."
full_description = "Our Network .center-align-text-no-heading .center-align-text { color:red !important; background:green !important; } At the heart of Data & Society is our network. Building a strong and connected network is vital to advancing our field: it is only together that we can realize a future where technological development is guided by equity and human dignity. We nurture long-term, reciprocal relationships with our network members and place a high value on continuously learning from one another. On this page you can learn more about our advisors, affiliates, Scholars Council, fellows, and alumni. Follow these links to learn more about our staff and board of directors. To connect with members of our network, contact us. Advisors Coming from backgrounds including public policy and law, AI governance, communications, academia, and the arts, the breadth and depth of our advisors’ expertise reflects Data & Society’s strategic priorities and ambitions. D&S advisors offer advice and feedback on issues including institutional development, equity and inclusion, donor relations, policy engagement, and strategy, and help facilitate other collaborations. Meet our advisors Past Advisors Affiliates Data & Society affiliates make up a cohort of talented researchers, thinkers, and advocates who actively collaborate with the organization, whether by producing reports, policy briefs, and workshops; participating in D&S programming; or otherwise contributing their insights to our community. Meet our affiliates Past Affiliates Scholars Council A group of experts who study technology and data’s role in society, our Scholars Council helps Data & Society chart a path forward in our research. Members provide feedback on research-in-progress, provide mentorship to early career scholars, and take part in exploratory discussions aimed at rethinking research practice, developing new research areas, and advancing existing ones. Meet The Scholars Council Fellows Anchoring a field of researchers and practitioners that’s growing in size and influence, our nine cohorts of fellows have pursued academic research, written code, created art, brought together communities of activists and practice, run workshops and hosted convenings, worked closely with Data & Society’s inhouse research teams, and so much more. As we consider how to best serve our network going forward, the fellows program is currently on pause. Meet The Fellows Alumni Data & Society staff have put their experiences to work in a range of roles and organizations focused on technology governance and policy, labor, social justice, industry, and more. Others have pursued advanced degrees and entered academia. Here are just a few: Kinjal Dave PhD Candidate, University of Pennsylvania Previously: Research Analyst, Data & Society’s Disinformation Action Lab Andrew Selbst Assistant Professor, UCLA Law Previously: Postdoctoral Scholar, Data & Society Madeleine Clare Elish Head of Responsible AI, Google Cloud Previously: Program Director, Data & Society’s AI on the Ground program Cristina López G. Senior Analyst, Graphika Previously: Senior Research Analyst, Data & Society’s Disinformation Action Lab Zachary Gold Senior Director of Cable, Broadband, and Special Projects, New York City Office of Technology & Innovation Previously: Researcher, Data + Human Rights Research Track Kadija Ferryman Core Faculty at the Johns Hopkins Berman Institute of Bioethics and Assistant Professor in the Department of Health Policy and Management at the Bloomberg School of Public Health, Johns Hopkins University Previously: Postdoctoral Scholar, Data & Society’s Health and Data program Nazelie Doghramadjian PhD Candidate, University of Michigan School of Information Previously: Network Engagement Associate, Data & Society"
