full_description = "Donate .center-align-text-no-heading .center-align-text { color:red !important; background:green !important; } Decisions about how consequential technologies like AI affect our lives are being made by a small group of powerful companies and actors. Those choices are being made without the people and communities who use, live, and work with those technologies every day. At Data & Society, we prioritize the public interest. Innovation should not — and need not — come at the expense of people and communities. Technology must serve people, not the other way around. This is a defining issue of our time, and one that touches every area of our lives — from our jobs to our health to our environment. Support our work today. Image by Michelle Lan Donate Video: Meet Data & Society Take Action Today 1. Donate Online 2. Post a check Data & Society Research Institute 228 Park Ave S. PMB 83075 New York, NY 10003-1502 3. Dollar-Match Your Contribution Many employers sponsor matching gift programs and will match any charitable contributions made by their employees, retirees, and/or employees’ spouses. You can look up your employer to see if you can match your contribution to Data & Society. 4. Donor-Advised Funds You can help Data & Society with a gift from your donor-advised fund (DAF). You can start the process right here: Donor Advised Fund 5. Gifts of Stock & Planned Giving Every stock gift that Data & Society receives strengthens our capacity. You may also name Data & Society as a beneficiary of your retirement, brokerage, insurance, donor-advised funds, or living trust. If you or your client are interested in making a gift of stock or planned gift, kindly contact us. 6. Foundation Grants Institutional giving is foundational for Data & Society. Please contact us to talk about strategic partnerships. Who Funds Us Photo credit: Tim Biondo Data & Society is a 501(c)3 nonprofit organization that ethically sources and accepts grants from a diverse range of funders. Adhering to our values of integrity and independence we publish our 990s and audited financial statements annually on our website. View a list of our funders here, and learn more about individual states’ disclosures for soliciting contributions right here. We respect the privacy of our donors. Please see our Privacy Policy to learn more about how your data is stored and used. Annual Reports 2022-2023 Data & Society 2023 Annual Report (Download) Data & Society 2022–2023 Financial Statement (Download) Form 990 (Download) 2021–2022 Data & Society 2022 Annual Report (Download) Data & Society 2021–2022 Financial Statement (Download) Form 990 (Download) 2020–2021 Data & Society 2021 Annual Report (Download) Data & Society 2020–2021 Financial Statement (Download) Form 990 (Download) 2019–2020 Data & Society 2020 Annual Report (Download) Data & Society 2019–2020 Financial Statement (Download) Form 990 (Download) 2018–2019 Data & Society 2018–2019 Annual Report (Visit Site, Download) Data & Society 2018–2019 Financial Statement (Download) Form 990 (Download) 2017–2018 Data & Society 2017–2018 Annual Report (Visit Site, Download) Data & Society 2017–2018 Financial Statement (Download) Form 990 (Download) 2016–2017 Data & Society 2016–2017 Annual Report (Download) Data & Society 2016–2017 Financial Statement (Download) Form 990 (Download) 2015–2016 Data & Society 2015–2016 Annual Report (Download) Data & Society 2015–2016 Financial Statement (Download) Form 990 (Download) 2014–2015 Data & Society 2014–2015 Annual Report (Download) Data & Society 2014–2015 Financial Statement (Download) Form 990 (Download) Contact Us Joanna Gould Associate Director of Development [email protected] Camille Horton Special Events Associate [email protected] Harry Hudome Grants Writer & Editor [email protected] Connect with Us Subscribe to our newsletter Attend an event Follow us on Bluesky"
