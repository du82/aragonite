full_description = "Research and policy for the public interest Data & Society believes that technology policy must be grounded in empirical evidence, account for tech’s real-world impacts, and serve the public. For the latest news, events, and ideas, subscribe to our newsletter. Follow us .center-align-text-no-heading .center-align-text { color:red !important; background:green !important; } The Latest from Data & Society Report Red-Teaming in the Public Interest Our new report examines how red-teaming methods are being adapted to evaluate generative AI, and offers a vision for red-teaming in the public interest. Public Panel March 20: Stories of Digitality, Infrastructures, and Resistance Join us online as we break down confrontations between technological infrastructures and local communities and discuss how to reshape narratives of process, power, change, and futurity. Op-Ed Participatory AI? Begin with the Most Affected People “Eliciting impacted communities’ input can support true innovation by directing technology development to the problems identified on the ground — rather than those imposed from the top down,” AIMLab Project Director Meg Young writes. Announcement Introducing Data & Society’s Climate, Technology, and Justice Program At a critical time, our research will examine the social and environmental repercussions of the expanded global infrastructures and labor practices that sustain the growth of digital technologies. Statement of Independence Data & Society is an independent, nonprofit 501(c)(3) research institute. We are committed to the independence and autonomy of Data & Society’s initiatives and convenings. We do not accept funding that would affect our ability to pursue work free of external interference, and we fiercely protect the independence of our researchers and fellows in their intellectual activities and individual funding relationships. Read more in our statement on organizational independence and gift acceptance. READ MORE Spotlights