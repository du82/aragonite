full_description = "Points A home for ideas and reflections at the intersection of technology and society, our blog publishes pieces that consider timely issues and essential questions related to our work and the field. If you have an idea, get in touch at [email protected]. .center-align-text-no-heading .center-align-text { color:red !important; background:green !important; } Participation and Trust Digital Infrastructures, Material Consequences Members of the Trustworthy Infrastructures team write about their research road trip through Pennsylvania, where they traced the connection from the industrial past to our tech-dominated present. Policy and Accountability What Does Silicon Valley Want? In a personal reflection, Brian J. Chen offers some lines of inquiry, directions, and tentative explanations for understanding and engaging on matters of tech policy in this moment. Reframing Our Relationship to Technology Insights from the Data for Black Lives Conference Anuli Akanegbu reflects on the connections between data practices and systemic racism, and offers resolutions to guide work that prioritizes the humane over the artificial. Points Our Year in Review As 2024 comes to a close, we’re looking back on some highlights of a milestone year. View All Recent Stories Policy and Accountability July 24, 2024 Why AI Safety Requires a Sociotechnical Approach: Our Top Ten Reads February 1, 2024 Why We’re Endorsing the AI Environmental Impacts Act Brian J. Chen and Tamara Kneese explain why we’re taking the unusual step of endorsing the AI Environmental Impacts Act of 2024. January 10, 2024 Measuring Justice: Field Notes on Algorithmic Impact Assessments What does it look like to assess how algorithms impact people’s lives, choices, and access to essential services? Participation and Trust February 5, 2025 Digital Infrastructures, Material Consequences Members of the Trustworthy Infrastructures team write about their research road trip through Pennsylvania, where they traced the connection from the industrial past to our tech-dominated present. September 18, 2024 The Algorithmic Impact Methods Lab: Methods from the Field The AIMLab team reflects on why they’ve shifted from thinking about their work as being about “impact assessment” to understanding it as a form of impact engagement. March 13, 2024 A Working History of the Verified Internet Robyn Caplan introduces her research on the history of the verified badge: the familiar checkmark that is “one of the few symbols of stratification on the internet that is visible to us, the user.” Reframing Our Relationship to Technology May 29, 2024 The Science and Technology of Social Justice Dr. Sará King on healing through contemplative technology January 24, 2024 When Kindness Kills How algorithms accelerate savior swarms August 16, 2023 Doppelgangers in a Digital world From deep fakes and avatars to big data, we all have a doppelganger that lives and acts online."
