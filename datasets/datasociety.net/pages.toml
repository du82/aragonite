["https://datasociety.net/library/keywords-of-the-datafied-state"]
title = "Data & Society — Keywords of the Datafied State"
description = "Keywords of the Datafied State is a collection of essays on concepts that are of central significance to understanding the relationship between government and technology, and how it differs across geographies."
full_description = "Book ⋅ April 24 2024 Keywords of the Datafied State Jenna Burrell Ranjit Singh Patrick Davison et al. Read the introduction Download the full collection Learn about the contributors .center-align-text-no-heading .center-align-text { color:red !important; background:green !important; } Produced in collaboration with global scholars and edited by Jenna Burrell, Ranjit Singh, and Patrick Davison, Keywords of the Datafied State is a collection of essays on concepts that are central to understanding the relationship between government and technology, and how it differs across geographies. Underlying this collection is the conviction that words matter. They matter because they often become a key to understanding practices. Keywords for any practice are words that may have broad or generic meanings but take on a certain specificity within the context of that practice. The practices of datafication in organizing the state are no different. The collection represents views that span the globe to highlight that the datafied state does not have a singular form. Accordingly, several keywords are defined by multiple authors, foregrounding different themes and examples and disrupting the assumption that these words could or should have one single, conclusive definition. This project grew from a desire to explore how algorithms become part of and influence state functions, how trust and doubt in public sector data infrastructures are shaped — and what the implications are for democratic practice. We hope readers see Keywords of the Datafied State as a resource for gathering their own communities to engage with the ongoing emergent challenges of contending with the datafied state, and as an invitation to explore which keywords matter most to them. Suggested citation: Burrell, Jenna, Ranjit Singh, and Patrick Davison, eds. Keywords of the Datafied State. Data & Society Research Institute. http://dx.doi.org/10.2139/ssrn.4734250 Illustration by Gloria Mendoza. This image is not licensed under Creative Commons. Essays Bureaucracy Jennifer Raso and Victoria Adelmant Corporate Capture Burcu Baykurt Bureaucracy Ludmila Costhek Abilio and Carolina Cruz Data Publics Youngrim Kim Public Administration Amina Abdu and Abigail Jacobs Public Interest Anne L. Washington and Joanne Cheung Automation Georgia van Toorn, Chris O'Neill, Maitreya Shah, and Mark Andrejevic Digital IDs Mardiya Siba Yahaya and Bonnita Nyamwire Public Interest Technology Maria Filippelli Open Data Malavika Raghavan Counterpublics Matthew Bui and Bianca Wylie Counterdata Seyi Olojo Counterdata Vanessa Massaro, Darakhshan J. Mir, Terrell Mosley, and Nathan C. Ryan Missing Data Alessandra Jungs De Almeida, Lauren Klein, and Catherine D'Ignazio Indigenous Data Sovereignty Stephanie Russo Carroll, Marisa Duarte, and Max Liboiron Further Readings Origins Points The Datafied State Research Agenda Jenna Burrell Points A Guide to Investigating the Datafied State Through Documents Jenna Burrell Databite Series Conversations on the Datafied State Ranjit Singh, Rigoberto Lara Guzmán et al."
