full_description = "Library Search the website Use our library to explore Data & Society's original empirical research and read our expert commentary. Sort by media type, or select one or more topic categories to begin browsing. AI labor health human rights platforms media climate policy accountability safety & security fairness surveillance & privacy disinformation & manipulation automation Select Type Academic Article Announcement Article blog post Book Book or Chapter event Explainer Feature Installation Lecture Longform op-ed Panel podcast Policy Brief Press Coverage Primer report Resource video Workshop All Types Publisher Title Date podcast Computer Says Maybe The Taiwan Bottleneck Brian Chen In time for this year’s RightsCon, Data & Society Policy Director Brian J. Chen joins Alix Dunn of Computer Says Maybe for a conversation about the process of advanced chip manufacture, its entanglement with US economic policy, and the colonial making of Taiwan’s chip supremacy. Read on Computer Says Maybe February 2025 op-ed Tech Policy Press Participatory AI? Begin with the Most Affected People Meg Young “Eliciting impacted communities’ input can support true innovation by directing technology development to the problems identified on the ground — rather than those imposed from the top down,” AIMLab Project Director Meg Young writes. Read on Tech Policy Press February 2025 Press Coverage Creative Commons The AI Action Summit & Civil Society’s (Possible) Impact Janet Haven Read on Creative Commons February 2025 Press Coverage The French Tech Journal AI Summit Day 1: Bending the Arc of AI Towards a Resilient and Open AI Ecosystem Janet Haven Read on The French Tech Journal February 2025 Press Coverage Reuters Paris AI summit pits innovation ambitions against job loss fears Brian Chen Policy Director Brian Chen tells Reuters he’s concerned about potential pressure to weaken the EU's AI Act and its existing protections. Read on Reuters February 2025 report Data & Society Re