full_description = "Opportunities .center-align-text-no-heading .center-align-text { color:red !important; background:green !important; } Learn more about working at Data & Society and see our current openings. Current Openings Senior HR Manager Chief Development Officer Working at Data & Society We are a collaborative and participatory work environment dedicated to research and policy for the public interest. Our organization features the following teams and functions: Communications Development Finance Human Resources Policy Research Strategy and Engagement To be notified when we add new opportunities, sign up for our newsletter. Data & Society provides a comprehensive benefits package and work environment to support our regular full-time employees, including: A paid time off program to assist in balancing professional and personal needs. Health, dental, and vision insurance coverage. Life insurance. Employee Assistance Program, which offers a variety of mental health, work/life balance, and legal/financial consults and services. Flexible spending accounts for medical and dependent care expenses. Professional development support. We are currently a remote-first organization. To be considered for employment candidates must be living and authorized to work in the United States. Frequently Asked Questions Does D&S have any current job openings? All opportunities will be listed on our website, social media platforms, and newsletter. Does D&S have any internship or volunteer opportunities? Unfortunately, we do not have any internship or volunteer positions open at this time, but we encourage you to stay on the lookout — subscribing to our newsletter is the best way to stay up to date. Can we publish our research at D&S? We publish only original research by our staff and do not take solicitations for publication from outside researchers. How can we collaborate with D&S? Given our current research schedule, it’s difficult for us to comment on or collaborate on unsolicited projects. We invite you to get involved with Data & Society by attending our public-facing events. To connect with specific members of our research team, contact [email protected]."
