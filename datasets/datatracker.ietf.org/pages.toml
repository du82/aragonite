 Mentoring Coordinators metaverse Metaverse Discussion mib-doctors MIB Doctors list middisc Discussions on TCP option for middlebox discovery. mif-arch-dt MIF Architecture Design Team mailing list mod-discuss Discussion list for IETF moderation policies and practices mpls-tp-manage IETF and ITU-T management of the MPLS-TP project mpvdapi Multiple Provisioning Domain Architecture API design msec Multicast Security List msr6 Multicast Source Routing IPv6 mtg-guests For communication between the traveling companions (friends, family) of IETF meeting attendees. mtgvenue List for email discussion of the IETF meeting venue selection process. mud Discussion of Manufacturer Ussage Descriptions multiformats Discussion related to the various Multiformats data formats nasr Network Attestation for Secure Routing neotec Operations of Networks for Telecom Cloud netconf-next-dt NETCONF Next Design Team nethistory Matching net historical materials with institutions that may preserve them netmod-ds-dt Updated YANG Datastore Design Team Mailing list netmod-ver-dt NetMod WG YANG Model Versioning Design Team netslices This list is intended for discussion and review of network slicing at IETF. network-tokens Discussion list for network tokens newsclips IETF News Clips new-wg-docs New (-00) Working Group Documents new-work Early exchange of information about new work in SDOs nfvcon NFV (Network Function Virtualization) Configuration and Modeling nipc non-IP control no-draft-expiry No draft expiry nsaas *NSaaS: Network Security as a Service mailing list* nsis-imp List for implementation questions for NSIS protocols ntdp define standards for the purpose of scripting of network testing equipment nvo3-dt-encap Private mailing list for internal NVO3 Encapsulation Design Team discussions oauth-ext-review IANA Expert Review: Review of proposed IANA registrations for OAuth. oauth-security-reports Information about security vulnerabilities concerning the OAuth specifications and OAuth implementations old-nomcom-chairs Old NomCom Chairs omcast pre-BOF overlay multicast discussions openv6 Openv6 discussion list ops-area OPS Area e-mail list ops-dir Ops Directorate ops-nm OPS Area NM e-mail list p2psip Peer-to-Peer SIP working group discussion list pdap Personal Digital Agent Protocol pidloc Issues Artificial Intelligence Machine Learning (AIML) networking pilots-ag IETF Pilots Affiliate Group pm-dir Performance Metrics Directorate Discussion list pntaw Discussion list for practices related to proxies, NATs, TURN, and WebRTC pop3ext Discussion of extensions and updates to Post Office Protocol (POP3) ports-team-internal Ports Team Internal Discussion pq-dnssec Discussion of post-quantum DNSSEC research privacy-convey A File Format to Aid in Consumer Privacy Enforcement, Research, and Tools procon Discussion of Process Documents Consolidation qlog qlog logging format qos_inband Discussion of in-band methods for Quality-of-service signaling quic-issues Notification list for GitHub issues related to the QUIC WG rdma-cc-interest Congestion Control for Large Scale HPC/RDMA Data Centers reap REAP (RENEW) EAP recentattendees Recent IETF Attendees recipe RECIPE (Reducing Energy Consumption with Internet Protocols Exploration) remote-mentors List for IETF remote mentors. restconf-next-dt RESTCONF Next Design Team rfc-dist RFC Announcements rfc-editor-rfi RFC Editor RFI Discussion rfc-interest A list for discussion of the RFC series and RFC Editor functions. rfc-markdown rfc-markdown is a discussion list for people writing I-Ds and RFCs in Markdown and the authors of the tools used for that. rfp-announce Announcement of IETF RFPs rohc Robust Header Compression rosa Routing on Service Addresses routing-discussion Routing Area General Discussion list rpat RFC Production Advisory Team - Provides operational advice to the RFC Production Center rpp This list discusses a provisioning protocol based on RESTful principles and corresponding data representations using JSON. rsab R