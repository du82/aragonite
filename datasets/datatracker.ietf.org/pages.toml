lusion of the IESG Note. Other matters may be recorded in comments, and the comments will be passed on to the RFC Editor as community review of the document. 3.4.1 New items (None) 3.4.2 Returning items (None) 4. Working Group actions 4.1 WG creation 4.1.1 Proposed for IETF review (None) 4.1.2 Proposed for approval (None) 4.2 WG rechartering 4.2.1 Under evaluation for IETF review (None) 4.2.2 Proposed for approval WG name Bit Indexed Explicit Replication (BIER) Charter charter-ietf-bier-(02-05) Area RTG (Gunter Van de Velde ) 5. IAB news we can use 6. Management issues 6.1 [IANA #1412835] renewing early allocation for draft-ietf-anima-constrained-voucher (IANA) 7. Any Other Business (WG News, New Proposals, etc.)'''
