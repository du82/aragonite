full_description = '<div class="alert alert-danger alert-ignore my-3"> <b>Javascript disabled?</b> Like other modern websites, the IETF Datatracker relies on Javascript. Please enable Javascript for full functionality. </div> Datatracker The IETF Datatracker is the day-to-day front-end to the IETF database for people who work on IETF standards. It contains data about the documents, working groups, meetings, agendas, minutes, presentations, and more, of the IETF. The primary public face of the IETF is at www.ietf.org. IETF Document Search Search Additional search criteria Document Type RFC Internet-Draft (active) Internet-Draft (expired, replaced or withdrawn) Agenda Bluesheets BOF request Charter Chat log Conflict review Minutes Narrative minutes Polls Proceedings materials Recording Review Slides Statement Status change Author or Affiliation Name WG Area any area Applications and Real-Time Area General Area Internet Area Operations and Management Area Routing Area Security Area Web and Internet Transport AD any AD Deb Cooley Roman Danyliw Jim Guichard Mahesh Jethanandani Erik Kline Murray Kucherawy Warren Kumari Francesca Palombini Zaheduzzaman Sarker John Scudder Orie Steele Gunter Van de Velde Éric Vyncke Paul Wouters ------------------ (System) Andrew Alston Harald T. Alvestrand Jari Arkko Alia Atlas Ignas Bagdonas Richard Barnes Steven M. Bellovin Mike Bishop Ron Bonica Mohamed Boucadair Scott O. Bradner Deborah Brungard Stewart Bryant Randy Bush Ross Callon Gonzalo Camarillo Ben Campbell Brian E. Carpenter Benoît Claise Alissa Cooper Margaret Cullen Spencer Dawkins Ralph Droms Martin Duke Lisa M. Dusseault Wesley Eddy Lars Eggert Pasi Eronen Gorry Fairhurst Adrian Farrel Stephen Farrell Bill Fenner Ned Freed Patrik Fältström Brian Haberman Ted Hardie David Harrington Sam Hartman Scott Hollenbeck Russ Housley IAB Joel Jaeggli Cullen Fluffy Jennings Benjamin Kaduk David Kessens Suresh Krishnan Mirja Kühlewind Barry Leiba Ted Lemon Terry Manderson Allison J. Mank