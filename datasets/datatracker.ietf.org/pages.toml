ement that the IESG should request inclusion of the IESG Note. Other matters may be recorded in comments, and the comments will be passed on to the RFC Editor as community review of the document. 3.4.1 New items Conflict review IETF conflict review for draft-irtf-nmrg-green-ps conflict-review-irtf-nmrg-green-ps IRTF Informational Challenges and Opportunities in Management for Green Networking draft-irtf-nmrg-green-ps Token Mahesh Jethanandani Deferred by Paul Wouters on 2025-02-06 Conflict review IETF conflict review for draft-irtf-coinrg-use-cases conflict-review-irtf-coinrg-use-cases IRTF Informational Use Cases for In-Network Computing draft-irtf-coinrg-use-cases Token Roman Danyliw Conflict review IETF conflict review for draft-perkins-irtf-code-of-conduct conflict-review-perkins-irtf-code-of-conduct IRTF Informational IRTF Code of Conduct draft-perkins-irtf-code-of-conduct Token Roman Danyliw Conflict review IETF conflict review for draft-irtf-iccrg-rledbat conflict-review-irtf-iccrg-rledbat IRTF Experimental rLEDBAT: receiver-driven Low Extra Delay Background Transport for TCP draft-irtf-iccrg-rledbat Token Zaheduzzaman Sarker 3.4.2 Returning items (None) 4. Working Group actions 4.1 WG creation 4.1.1 Proposed for IETF review WG name Digital Emblems (DIEM) Charter charter-ietf-diem-(00-02) Area ART (Orie Steele ) 4.1.2 Proposed for approval WG name Domain Keys Identified Mail (DKIM) Charter charter-ietf-dkim-(05-07) Area ART (Murray Kucherawy ) WG name RESTful Provisioning Protocol (RPP) Charter charter-ietf-rpp-(00-02) Area ART (Orie Steele ) 4.2 WG rechartering 4.2.1 Under evaluation for IETF review WG name Bit Indexed Explicit Replication (BIER) Charter charter-ietf-bier-(02-00) Area RTG (Gunter Van de Velde ) WG name Mail Maintenance (MAILMAINT) Charter charter-ietf-mailmaint-(01-00) Area ART (Murray Kucherawy ) 4.2.2 Proposed for approval (None) 5. IAB news we can use 6. Management issues 6.1 [IANA #1412135] Designated experts for RFC 9704 (PvD Split DNS 