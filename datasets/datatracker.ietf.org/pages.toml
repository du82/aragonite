["https://datatracker.ietf.org/list/nonwg"]
title = "Other (not WG) email lists"
full_description = '''<div class="alert alert-danger alert-ignore my-3"> <b>Javascript disabled?</b> Like other modern websites, the IETF Datatracker relies on Javascript. Please enable Javascript for full functionality. </div> Other (not Working Group) email lists Guidelines for these lists, including how to request a new one to be created, can be found on the Non–Working Group email list guidelines webpage. Name Description 3gv6 This mailing list is intended for discussions relating to the use of IPv6 in cellular networks. 6band 6lo Bootstrapping, Access for Networked Devices 6gip IP Issues in 6th Generation Mobile Network System (6gip) abnf-discuss General discussion about tools, activities and capabilities involving the ABNF meta-language admin-discuss Discussion list for IETF LLC administrative issues ai-control AI Control aidc Data Center Networking for AI Clusters alldispatch Alldispatch anrp-select This is a private list used by the selection committee for the Applied Networking Research Prize (ANRP). anrw-sc ANRW workshop series steering committee anrw-tpc ANRW workshop series technical program committee antitrust-policy Discuss the need for an antitrust or competition policy for the IETF. apn Application-aware Networking appsdir Apps Area Review List arc Authenticated Received Chain (ARC) protocol architecture-discuss open discussion forum for long/wide-range architectural issues ark Archival Resource Key art Applications and Real-Time Area Discussion atn Aeronautical Telecommunications Network auth48archive Archiving AUTH48 exchanges between the RFC Production Center, the authors, and other related parties bundled-domain-names Discussion of "bundled domain names" ccg IANA IPR Community Coordination Group cdni-footprint CDNI Footprint and Capabilities Advertisement cfbl Discussions mailing list about Complaint Feedback Loop Address Header channel-binding IANA Expert Review: Discussion of channel binding IANA registry requests and specifications codesprints List for coordinating (and following up on) codesprint activities codestand-develop "Discussion forum for the planning, coordination, and development of CodeStand" collation IANA Expert Review: Collation registration and discussion (see RFC 4790) companions IETF Meeting Companions List core-parameters IANA Expert Review: Expert review of CoAP parameters. crypto-panel Crypto Review Panel review coordination cwp Certificates without PKIX cwt-reg-review IANA Expert Review: CWT Registry Review dconn Domain Connect is a protocol that makes it easy for a user to configure DNS for a domain running at a DNS provider to work with a Service running at an independent Service Provider. dcpel Mailing list for possible diffserv control plane elements WG dcrouting Routing in the Data Center: discussions about problems, requirements and potential solutions. dcrup DKIM Crypto Update dd DNS Delegation deepspace IP protocol stack in deep space detnet-dp-dt DetNet WG Data Plane Design Team (inactive) detnet-edp-dt DetNet WG Enhanced Data Plane Design Team diem Discussion of digital emblems dir-coord This is an e-mail alias for the organisers of IETF directorates. diversity Diversity open mailing list dlnex Discussion of reliable and deterministic latency attributes dlt-networking DLT Networking dmarc-report Archive of DMARC reports for ietf.org domain dmsc Discussion of Distributed Micro Service Communication dnsdir DNS Directorate dnslb DNS-based Load Balancing dns-rrtype-applications IANA Expert Review: List to send new DNS RRtype template applications dnssec-bootstrapping Authenticated Bootstrapping of DNSSEC Delegations dtn-interest The Delay-Tolerant Networking Research Group (DTNRG) - Announce. dyncast Dynamic Anycast e2ee Discussion of the definition of end-to-end encryption. ecn-in-quic ECN in the QUIC protocol discussion list. ehip Discuss methods to protect email senders and receivers from disclosure of email headers to observers. eligibility-discuss IETF eligibility procedures endymail End-to-end email security/privacy improvements enterprise Discussions about enterprise networking specific scenarios and deployment problems eodir Education & Outreach Directorate etosat The EToSat list is a non-WG mailing list used to discuss performance implications of running encrypted transports such as QUIC over satellite. experiment-guidance This list exists for discussion of what guidance to give the authors of Internet-Drafts containing protocol specifications intended for publication as Experimental RFCs. explicit-meas This mailing list is intended for discussions relating to Explicit Flow Measurements Techniques. fantel Fast Notification for Traffic Engineering and Load Balancing fdt Mailing list for the discussion of the use of formal description techniques in IETF documents fecframe-proto Fecframe protocol design team feeds Web Feeds flexip Flexible Internet addressing and Flexible routing forces-protocol forces-protocol gdpr-response-team GDPR Response Team gen-art GEN-ART: General Area Review Team gen-art-private Private GEN-ART list github-admin Administation of IETF GitHub repositories hackathon Discussion regarding past, present, and future IETF hackathons. ham-ag HAM Radio Operators Affiliate Group happy Discussion list for Happy Eyeballs v3 algorithm development hiaps Host Identification, Address and Prefix Sharing in Wi-Fi Access (hiaps) hls-interest Discussions about HTTP Live Streaming (HLS). homesec-dt 'Advanced' Home Gateway Security Design Team List hotrfc HotRFC Lightning Talk submission list hp-wan High Performance Wide Area Networks i18ndir Internationalization Directorate i2icf Interface to In-Network Computing Functions iab Internet Architecture Board (IAB) iab-stream Target for IAB Stream emails iaoc-rps Remote Participation Services Subcommittee mailing list icalendar iCalendar ice-issues Announce-only list for activity on the ICE working group's issue list id-align Identity Alignment i-d-announce Internet Draft Announcements only ideas Discussions relating to the development, clarification, and implementation of control-plane infrastructures and functionalities in ID enabled networks. idna-update Internationalized Domain Names in Applications (IDNA) implementation and update discussions idnet The IDNet (Intelligence-Defined Network) iesg-agenda-dist Distribution of IESG agendas ietf IETF-Discussion. This is the most general IETF mailing list, intended for discussion of technical, procedural, operational, and other topics for which no dedicated mailing lists exist. ietf-822 Discussion of issues related to Internet Message Format [RFC 822, RFC 2822, RFC 5322] ietf-and-github Discussion of using GitHub in IETF activities, particularly for Working Groups ietf-announce IETF announcement list. No discussions. ietf-community-india List for IETF participants from India that is used to coordinate events internal to India. ietf-cycling Discussion list for finding good routes around IETF meeting venues for cycling, and for sharing cycling-related experiences with IETF participants ietf-hub-boston For IETFers in the Boston area. ietf-languages IANA Expert Review: Review of requests for language tag registration according to BCP 47 (RFC 4646) ietf-mentoring-discuss This mailing list is set up to discuss issues and suggestions related to the IETF mentoring program. It is open any one interested. ietf-message-headers Discussion list for header fields used in Internet messaging applications. ietfmibs IETF MIB Discussion list ietf-nomcom Discussions of possible revisions to the NomCom process ietf-outcomes IETF Outcomes Wiki discussion list ietf-privacy Internet Privacy Discussion List ietf-rfps IETF RFPs ietf-runners A list for IETF runners. ietf-sailors Discussion list to plan sailing events collocated with IETF meetings. ietf-smtp Discussion of issues related to Simple Mail Transfer Protocol (SMTP) [RFC 821, RFC 2821, RFC 5321] ietf-sow SOW Feedback List igmp-mld-bis IGMPv3/MLDv2 ima EAI (Email Address Internationalization) imap5 Discussion on drastically slimming-down IMAP. independent Discussion of RFC Editor independent submissions proposal int-dir This list is for discussion between the members of the Internet Area directorate. iot-directorate Mailing list for the IoT Directorate Members iot-onboarding Discussion of IoT onboarding mechanisms ipdir Internet Area IP Directorate ippm-ioam-ix-dt IPPM iOAM Immediate Export (IX) design team ipr-announce For keeping updated on new IETF IPR disclosures ipr-wg IPR-WG irsg This is the IRSG private list. It consists of the IRTF Chair, the IAB Chair, IRTF Research Group Chairs, and IRSG At-Large members. irtf-announce IRTF-Announce iucg internet users contributing group jose-reg-review IANA Expert Review: The JSON Web Algorithm standard (RFC 7518) establishes this email list for designated experts to discuss proposed changes, additions, and removals to the set of algorithms in the JSON Object Signing and Encryption (JOSE) registry jwt-reg-review IANA Expert Review: Expert review of proposed IANA registrations for JSON Web Token (JWT) claims. l4s-discuss Low Latency, Low Loss, Scalable Throughput (L4S) last-call IETF Last Calls legal To bring legal matters to the attention of the IETF link-relations Discussion of registration requests for link relation types llc-board-ed-secretariat LLC Board and support staff llc-consultation A list for IETF LLC community consultation lln-futures Low power/Lossy Networks Futures loi-requests Letters of Invite Requestors lsd Loosely-coupled SIP Devices (LSD) working group discussion list lucid Locale-free UniCode Identifiers (LUCID) mailsec Email Security Issues mavs Multiprovider End-to-end VPN Services mcast-wifi Discussions related to issues with multicast in 802.11 Wi-Fi networks & solutions/optimizations targeted at resolving these issues. media-feature-tags discussion of media feature tags medup Missing Elements for Decentralized and Usable Privacy mentoring-coordinators IETF Mentoring Coordinators metaverse Metaverse Discussion mib-doctors MIB Doctors list middisc Discussions on TCP option for middlebox discovery. mif-arch-dt MIF Architecture Design Team mailing list mod-discuss Discussion list for IETF moderation policies and practices mpls-tp-manage IETF and ITU-T management of the MPLS-TP project mpvdapi Multiple Provisioning Domain Architecture API design msec Multicast Security List msr6 Multicast Source Routing IPv6 mtg-guests For communication between the traveling companions (friends, family) of IETF meeting attendees. mtgvenue List for email discussion of the IETF meeting venue selection process. mud Discussion of Manufacturer Ussage Descriptions multiformats Discussion related to the various Multiformats data formats nasr Network Attestation for Secure Routing neotec Operations of Networks for Telecom Cloud netconf-next-dt NETCONF Next Design Team nethistory Matching net historical materials with institutions that may preserve them netmod-ds-dt Updated YANG Datastore Design Team Mailing list netmod-ver-dt NetMod WG YANG Model Versioning Design Team netslices This list is intended for discussion and review of network slicing at IETF. network-tokens Discussion list for network tokens newsclips IETF News Clips new-wg-docs New (-00) Working Group Documents new-work Early exchange of information about new work in SDOs nfvcon NFV (Network Function Virtualization) Configuration and Modeling nipc non-IP control no-draft-expiry No draft expiry nsaas *NSaaS: Network Security as a Service mailing list* nsis-imp List for implementation questions for NSIS protocols ntdp define standards for the purpose of scripting of network testing equipment nvo3-dt-encap Private mailing list for internal NVO3 Encapsulation Design Team discussions oauth-ext-review IANA Expert Review: Review of proposed IANA registrations for OAuth. oauth-security-reports Information about security vulnerabilities concerning the OAuth specifications and OAuth implementations old-nomcom-chairs Old NomCom Chairs omcast pre-BOF overlay multicast discussions openv6 Openv6 discussion list ops-area OPS Area e-mail list ops-dir Ops Directorate ops-nm OPS Area NM e-mail list p2psip Peer-to-Peer SIP working group discussion list pdap Personal Digital Agent Protocol pidloc Issues Artificial Intelligence Machine Learning (AIML) networking pilots-ag IETF Pilots Affiliate Group pm-dir Performance Metrics Directorate Discussion list pntaw Discussion list for practices related to proxies, NATs, TURN, and WebRTC pop3ext Discussion of extensions and updates to Post Office Protocol (POP3) ports-team-internal Ports Team Internal Discussion pq-dnssec Discussion of post-quantum DNSSEC research privacy-convey A File Format to Aid in Consumer Privacy Enforcement, Research, and Tools procon Discussion of Process Documents Consolidation qlog qlog logging format qos_inband Discussion of in-band methods for Quality-of-service signaling quic-issues Notification list for GitHub issues related to the QUIC WG rdma-cc-interest Congestion Control for Large Scale HPC/RDMA Data Centers reap REAP (RENEW) EAP recentattendees Recent IETF Attendees recipe RECIPE (Reducing Energy Consumption with Internet Protocols Exploration) remote-mentors List for IETF remote mentors. restconf-next-dt RESTCONF Next Design Team rfc-dist RFC Announcements rfc-editor-rfi RFC Editor RFI Discussion rfc-interest A list for discussion of the RFC series and RFC Editor functions. rfc-markdown rfc-markdown is a discussion list for people writing I-Ds and RFCs in Markdown and the authors of the tools used for that. rfp-announce Announcement of IETF RFPs rohc Robust Header Compression rosa Routing on Service Addresses routing-discussion Routing Area General Discussion list rpat RFC Production Advisory Team - Provides operational advice to the RFC Production Center rpp This list discusses a provisioning protocol based on RESTful principles and corresponding data representations using JSON. rsab RFC Series Approval Board (RSAB) rtg-bfd RTG Area: Bidirectional Forwarding Detection DT rtg-dir Routing Area Directorate rtg-dt-encap-considerations Routing Area Design Team on Encapsulation Considerations discussion list rtg-dt-yang-arch Routing Area Yang Architecture Design Team rtg-mibs Routing MIB experts rtg-ooam-dt List is used by the Routing Area Overlay OAM Design team for internal coordination and discussion rtg-open-source Discussion and collaboration for Open Source efforts related to the Routing Area rt-media-ng Discussion of new architecture and protocol updates to Real-Time Media (Voice and Video) over IP sat-int Discussion of the IETF technologies for satellite networking for NTN integration for 5G and Beyond. sbm Source Buffer Management: In the past decade there has been growing awareness about the harmful effects of bufferbloat in the network, and there has been good work on developments like L4S to address that problem. scuba-ag IETF SCUBA Diving Affiliate Group sdp-directorate-private Pr'''
