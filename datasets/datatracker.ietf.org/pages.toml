title = "Other (not WG) email lists"
full_description = '''<div class="alert alert-danger alert-ignore my-3"> <b>Javascript disabled?</b> Like other modern websites, the IETF Datatracker relies on Javascript. Please enable Javascript for full functionality. </div> Other (not Working Group) email lists Guidelines for these lists, including how to request a new one to be created, can be found on the Non–Working Group email list guidelines webpage. Name Description 3gv6 This mailing list is intended for discussions relating to the use of IPv6 in cellular networks. 6band 6lo Bootstrapping, Access for Networked Devices 6gip IP Issues in 6th Generation Mobile Network System (6gip) abnf-discuss General discussion about tools, activities and capabilities involving the ABNF meta-language admin-discuss Discussion list for IETF LLC administrative issues ai-control AI Control aidc Data Center Networking for AI Clusters alldispatch Alldispatch anrp-select This is a private list used by the selection committee for the Applied Networking Research Prize (ANRP). anrw-sc ANRW workshop series steering committee anrw-tpc ANRW workshop series technical program committee antitrust-policy Discuss the need for an antitrust or competition policy for the IETF. apn Application-aware Networking appsdir Apps Area Review List arc Authenticated Received Chain (ARC) protocol architecture-discuss open discussion forum for long/wide-range architectural issues ark Archival Resource Key art Applications and Real-Time Area Discussion atn Aeronautical Telecommunications Network auth48archive Archiving AUTH48 exchanges between the RFC Production Center, the authors, and other related parties bundled-domain-names Discussion of "bundled domain names" ccg IANA IPR Community Coordination Group cdni-footprint CDNI Footprint and Capabilities Advertisement cfbl Discussions mailing list about Complaint Feedback Loop Address Header channel-binding IANA Expert Review: Discussion of channel binding IANA registry requests and specifications codesprints List for coordinating (and following up on) codesprint activities codestand-develop "Discussion forum for the planning, coordination, and development of CodeStand" collation IANA Expert Review: Collation registration and discussion (see RFC 4790) companions IETF Meeting Companions List core-parameters IANA Expert Review: Expert review of CoAP parameters. crypto-panel Crypto Review Panel review coordination cwp Certificates without PKIX cwt-reg-review IANA Expert Review: CWT Registry Review dconn Domain Connect is a protocol that makes it easy for a user to configure DNS for a domain running at a DNS provider to work with a Service running at an independent Service Provider. dcpel Mailing list for possible diffserv control plane elements WG dcrouting Routing in the Data Center: discussions about problems, requirements and potential solutions. dcrup DKIM Crypto Update dd DNS Delegation deepspace IP protocol stack in deep space detnet-dp-dt DetNet WG Data Plane Design Team (inactive) detnet-edp-dt DetNet WG Enhanced Data Plane Design Team diem Discussion of digital emblems dir-coord This is an e-mail alias for the organisers of IETF directorates. diversity Diversity open mailing list dlnex Discussion of reliable and deterministic latency attributes dlt-networking DLT Networking dmarc-report Archive of DMARC reports for ietf.org domain dmsc Discussion of Distributed Micro Service Communication dnsdir DNS Directorate dnslb DNS-based Load Balancing dns-rrtype-applications IANA Expert Review: List to send new DNS RRtype template applications dnssec-bootstrapping Authenticated Bootstrapping of DNSSEC Delegations dtn-interest The Delay-Tolerant Networking Research Group (DTNRG) - Announce. dyncast Dynamic Anycast e2ee Discussion of the definition of end-to-end encryption. ecn-in-quic ECN in the QUIC protocol discussion list. ehip Discuss methods to protect email senders and receivers from disclosure of email headers to observers. eligibility-discuss IETF eligibility procedures endymail End-to-end email security/privacy improvements enterprise Discussions about enterprise networking specific scenarios and deployment problems eodir Education & Outreach Directorate etosat The EToSat list is a non-WG mailing list used to discuss performance implications of running encrypted transports such as QUIC over satellite. experiment-guidance This list exists for discussion of what guidance to give the authors of Internet-Drafts containing protocol specifications intended for publication as Experimental RFCs. explicit-meas This mailing list is intended for discussions relating to Explicit Flow Measurements Techniques. fantel Fast Notification for Traffic Engineering and Load Balancing fdt Mailing list for the discussion of the use of formal description techniques in IETF documents fecframe-proto Fecframe protocol design team feeds Web Feeds flexip Flexible Internet addressing and Flexible routing forces-protocol forces-protocol gdpr-response-team GDPR Response Team gen-art GEN-ART: General Area Review Team gen-art-private Private GEN-ART list github-admin Administation of IETF GitHub repositories hackathon Discussion regarding past, present, and future IETF hackathons. ham-ag HAM Radio Operators Affiliate Group happy Discussion list for Happy Eyeballs v3 algorithm development hiaps Host Identification, Address and Prefix Sharing in Wi-Fi Access (hiaps) hls-interest Discussions about HTTP Live Streaming (HLS). homesec-dt 'Advanced' Home Gateway Security Design Team List hotrfc HotRFC Lightning Talk submission list hp-wan High Performance Wide Area Networks i18ndir Internationalization Directorate i2icf Interface to In-Network Computing Functions iab Internet Architecture Board (IAB) iab-stream Target for IAB Stream emails iaoc-rps Remote Participation Services Subcommittee mailing list icalendar iCalendar ice-issues Announce-only list for activity on the ICE working group's issue list id-align Identity Alignment i-d-announce Internet Draft Announcements only ideas Discussions relating to the development, clarification, and implementation of control-plane infrastructures and functionalities in ID enabled networks. idna-update Internationalized Domain Names in Applications (IDNA) implementation and update discussions idnet The IDNet (Intelligence-Defined Network) iesg-agenda-dist Distribution of IESG agendas ietf IETF-Discussion. This is the most general IETF mailing list, intended for discussion of technical, procedural, operational, and other topics for which no dedicated mailing lists exist. ietf-822 Discussion of issues related to Internet Message Format [RFC 822, RFC 2822, RFC 5322] ietf-and-github Discussion of using GitHub in IETF activities, particularly for Working Groups ietf-announce IETF announcement list. No discussions. ietf-community-india List for IETF participants from India that is used to coordinate events internal to India. ietf-cycling Discussion list for finding good routes around IETF meeting venues for cycling, and for sharing cycling-related experiences with IETF participants ietf-hub-boston For IETFers in the Boston area. ietf-languages IANA Expert Review: Review of requests for language tag registration according to BCP 47 (RFC 4646) ietf-mentoring-discuss This mailing list is set up to discuss issues and suggestions related to the IETF mentoring program. It is open any one interested. ietf-message-headers Discussion list for header fields used in Internet messaging applications. ietfmibs IETF MIB Discussion list ietf-nomcom Discussions of possible revisions to the NomCom process ietf-outcomes IETF Outcomes Wiki discussion list ietf-privacy Internet Privacy Discussion List ietf-rfps IETF RFPs ietf-runners A list for IETF runners. ietf-sailors Discussion list to plan sailing events collocated with IETF meetings. ietf-smtp Discussion of issues related to Simple Mail Transfer Protocol (SMTP) [RFC 821, RFC 2821, RFC 5321] ietf-sow SOW Feedback List igmp-mld-bis IGMPv3/MLDv2 ima EAI (Email 