full_description = '<div class="alert alert-danger alert-ignore my-3"> <b>Javascript disabled?</b> Like other modern websites, the IETF Datatracker relies on Javascript. Please enable Javascript for full functionality. </div> User settings The following settings are implemented using cookies, so if you have cookies disabled then you will not be able to change the settings (everything still continues to work by using default settings). How many days is considered "new"? This setting affects how many days are considered "new enough" to get the special highlighting in the documents table. The default setting is 14 days. 7 days 14 days 21 days 30 days 60 days 90 days How many days is considered "soon"? This setting tells what is considered "soon" when showing documents that are going to be expire soon. The Default setting is 14 days. 7 days 14 days 21 days 30 days 60 days 90 days Show full document text by default? Show the full text immediately on the document page instead of only showing beginning of it. This defaults to on. Off On Show the left-hand menu? Show the left-hand menu on all regular pages? This defaults to off. Off On Which color mode should be used? Use a light, dark or automatic (as indicated by OS) color mode. Light Dark Auto'
