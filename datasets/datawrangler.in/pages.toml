["https://datawrangler.in/blog/5-elasticsearch-to-mongodb-migration"]
title = "Elasticsearch to MongoDB Migration - MongoES - DATAWRANGLER"
description = "DATAWRANGLER -  - Informal article covering the introduction to an Elasticsearch to MongoDB migration tool known as MongoES, from the house of Datawrangler"
full_description = 'The following are some of the situations where the developers simply love to hate! The one-last-thing syndrome - This reminds me of the following quote: The first 90 percent of the code accounts for the first 90 percent of the development time. The remaining 10 percent of the code accounts for the other 90 percent of the development time. — Tom Cargill, Bell Labs, from the book ‘Programming Pearls’ Declaring certain undocumented features to be as bugs - Seriously, this creates traumas for the developers. Interruptions during coding - Here’s an idea. Try talking to developers while they code; chances are, they have just about <10% of your attention. We get used to some situations. But, there are some we don’t. DISCONNECTION FROM THE SERVER DUE TO BAD INTERNET DURING A MIGRATION - Ouch!! That’s gotta hurt real bad. Talking about ES to MongoDB Migration - How hard could that be? Good Side JSON objects are common for both. Numerous tools to choose from, for migration. Bad Side: The Migration can be hideous, and can eat up a lot of the system resources. Be ready for a system-freeze, in case the migration tool uses a queue. Ugly Side: Can never be resumed from the point of failure. If the connectivity goes down during the migration; the transferred collection has to be deleted and the data transfer has to be initiated once again from the beginning. This is where MongoES can help - MongoES. It is a pure python3-bred Migration tool to migrate documents from the Elasticsearch’s indices to the MongoDB collections. It’s robust in its native way; no queues/message brokers are involved; which means that there won’t be any memory spikes or system freezes. This was achievable because MongoES specifically uses a tagging strategy before the migration. The tagging happens in the source Elasticsearch, which stands as a checkpoint during the migration. Why a new custom id tagging, while there’s an _id already? Unless the documents are explicitly tagged, the _id fields in Elasticsearch documents are a bunch of alphanumeric strings generated to serialize the documents. These _id columns become unusable since queries/aggregations can not be run using them. MongoES - How to Install all the Prerequisites. Clone the repository from https://github.com/datawrangl3r/mongoes.git Edit the mongoes.json file according to your requirements. { "EXTRACTION": { "HOST": "localhost", "INDEX": "lorem_ipsum", "DBENGINE": "elasticsearch", "PORT":9200 }, "COMMIT": { "HOST": "localhost", "DATABASE": "plasmodium_proteinbase", "COLLECTION": "mongoes", "DBENGINE": "mongo", "USER": "", "PASSWORD": "", "PORT":5432 } } Make sure that both the Elasticsearch and MongoDB services are up and running, and fire up the migration by keying in: > python3 __init__.py Sit back and relax; for we got you covered! The migration’s default value is 1000 documents per transfer.'
