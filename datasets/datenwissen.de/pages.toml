["https://datenwissen.de/hintergrundinfos/chancen-und-techniken-von-linked-data"]
title = "Chancen und Techniken von Linked Data | Datenwissen"
description = "Warum wir Daten verlinken müssen"
full_description = "Chancen und Techniken von Linked Data 2009 bin ich auf einen interessanten Vortrag von Tim Berners-Lee bei einer TED-Konferenz gestoßen, der mich sogleich faziniert hat. Er spricht über eine neue Form des Webs, ein Web aus miteinander verknüpften Daten – Linked Data. Das Word Wide Web, wie wir es heute kennen, versteckt seine Daten. Webanwendungen bauen zwar meist auf Datenbanken auf, veröffentlichen die Daten jedoch vorzugsweise in einem menschenlesenbaren Format. Eine schick gestaltete HTML-Seite mag für Menschen wunderbar anzusehen sein, lässt sich maschinell jedoch nur schwer verarbeiten. Um die Datenflut des Informationszeitalters bewältigen zu können, müssen wir die Daten strukturieren und miteinander in Beziehung setzen. Aus verknüpften Daten können sich neue, vorher unbekannte Informationszusammenhänge ergeben die zu neuen Erkenntnissen führen, was Wissenschaft und Forschung ebenso zugute käme wie der Wirtschaft und der Gesellschaft im Ganzen. Hier der wirklich hervorragende Vortrag von Tim Berners-Lee: Ich sehe in Linked Data ein sehr großes Potential und habe dem Thema eine meiner Studienarbeiten an der DHBW Karlsruhe gewidmet. Die Arbeit mit dem Titel „Chancen und Techniken von Linked Data“ kann hier als PDF heruntergeladen werden. Aus meinem Interesse für Linked Data heraus ist auch dieses Blog entstanden, mit dem ich hoffe, weitere Menschen für das Thema zu begeistern."
year_published = 2022
