title = "Podcast | Datenwissen"
description = "Warum wir Daten verlinken müssen"
full_description = "Podcast, Solid Conversations about Software Engineering: Solid 25. Mai 2022 Angelo Veltens Ich habe mit dem CaSE-Podcast über Solid gesprochen. In der Folge gehe ich näher darauf ein, wie eingeschränkt wir mit den heute typischen Apps sind und welche Möglichkeiten uns das Solid-Ökosystem im Gegenzug eröffnet. Viel Spaß beim Anhören! Solid is a specification that lets people store their data securely in decentralized data stores called Pods. But why do we want to keep our data decentralized? What problems does Solid solve? In this episode, Angelo Veltens explains to Lucas Dohmen the advantages (but also potential disadvantages) of this project. CaSEPodcastSolid Podcast, Solid programmier.bar Podcast zum Solid Project 3. Januar 2021 Angelo Veltens Ich war zu Gast bei der programmier.bar und hab ein bisschen was zu Solid erzählt: Klingt “All of your data, under your control.” gut für dich? Diesen Ansatz verfolgt das Solid Project und will damit das Internet dezentralisieren. Geleitet wird es von Tim Berners-Lee, dem Erfinder des World Wide Web selbst, der die heutige Entwicklungsrichtung des Umgangs mit Nutzungsdaten kritisch sieht. Wie eine Dezentralisierung ablaufen soll, erklärt uns in dieser Folge Angelo Veltens.Folge 79 – Solid Project mit Angelo Veltens Hört mal rein 🙂 Podcastprogrammier.barSolid"
