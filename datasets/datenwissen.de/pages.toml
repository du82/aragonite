["https://datenwissen.de/2020/07/solid-neues-aus-der-community-grosse-ankuendigungen-von-inrupt"]
title = "Solid: Neues aus der Community, große Ankündigungen von  Inrupt | Datenwissen"
description = "Warum wir Daten verlinken müssen"
full_description = "Solid Solid: Neues aus der Community, große Ankündigungen von Inrupt 4. Juli 2020 Angelo Veltens Was ist eigentlich in den letzten Monaten im Solid-Projekt passiert? Die Solid World July gibt einen Überblick über das 1. Halbjahr 2020. Während am W3C die Spezifikation verfeinert wird und die Community an Apps tüftelt, fällt Inrupt erstmals seit langem wieder mit großen Ankündigungen auf. Solid World_July from Solid Project on Vimeo. W3C Solid Community Group Die Community Group arbeitet in verschiedenen Panels an der Weiterentwicklung der Spezifikationen. Sie sammelt dazu Use Cases und Anforderungen von App-Entwickler*innen und Solid Early Adaptors. Solid Community Die Solid Community insgesamt arbeitet darüber hinaus auch an Apps, Tools, Dokumentation und mehr. Wie man mitwirken kann beschreibt der Prozess. Die Website unter solidproject.org bietet einen guten Einstieg für Benutzer*innen, Entwickler*innen, Unternehmen und allgemein Interessierte. Darüber hinaus gibt es weiterhin das Forum, den Chat und eine Reddit Community. Open Link Open Link arbeitet schon seit vielen Jahren an Linked Data und WebID Software. Der Support von Solid ist ein logischer Schritt. Mit YouID lassen sich Solid Profildokumente und Identitäten erstellen. Der Structured Data Sniffer erlaubt das Speichern von Webseiten und Daten im Solid Pod. Inrupt Inrupt fällt mit großen Neuankündigungen auf: Ein Team der Ghent University unter Führung von Ruben Verborgh entwickelt den Community Solid Server, eine Open-Source-Neuentwicklung und Alternative zum Node Solid Server (NSS). Inrupt finanziert und unterstützt die Entwicklung. Für NSS wird Inrupt noch Bugfixes und Sicherheitsupdates bereitstellen, aber keine neuen Features mehr entwickeln. Außerdem hat Inrupt neue JavaScript-Client-Bibliotheken veröffentlicht und weitere für andere Programmiersprachen angekündigt. Inrupt ist mit dem pod-server und dem react-sdk zuvor bereits Ähnliches angegangen und dort nach einiger Zeit eher mit Inaktivität und Intransparenz aufgefallen. Ich bin gespannt ob die neuen Anläufe ihren Schwung erhalten und Inrupt die Kommunikation mit der Community wieder intensiviert. Regelmäßige Statusupdates wurden auf der Solid World zumindest versprochen. Eine weitere vielversprechende Ankündigung ist ein Enterprise Solid Server, der hoffentlich eine gute Grundlage für professionelles Pod-Hosting und unternehmenskritische Anwendungen geben wird. Informiert bleiben Die Solid World findet monatlich statt. Updates zum Nachlesen gibt es im Newsletter This Month in Solid. InruptOpen LinkPräsentationSolidSolid WorldVideo"
year_published = 2022
