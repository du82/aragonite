full_description = "Solid Alice und Bob entdecken Solid 30. November 2021 Angelo Veltens Was ist Solid? In 30 unterhaltsamen und leicht verdaulichen Comics hat Patrick Hochstenbach dies im „Solvember“ erklärt – jeden Novembertag gab es ein neues Bildchen zum Thema Solid. Creative Commons Attribution-ShareAlike 4.0 International License. (c) @hochstenbach 2021 Angefangen bei den Grundlagen zeigen die Protagonist*innen Alice und Bob unter anderem wie Zugriffskontrolle mittels WebACL und Linked Data Notifications funktionieren und was das für die beiden in der Praxis bedeutet. Schaut es euch an! Alle Abenteuer von Alice und Bob findet ihr zum Durchstöbern auf seinem Solid Pod. comicLinked DataSocial WebSolid"
