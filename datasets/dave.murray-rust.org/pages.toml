title = "About - Dave Murray-Rust"
description = "Dave Murray-Rust"
full_description = "AboutI’m an Associate Professor at TU Delft, working in human-algorithm interaction - exploring the messy terrain between people, data and things through a combination of making and thinking. Current research questions include: How can we understand the algorithmically mediated society that we are heading towards? How can we ensure that there is space for people within computational systems, preserving privacy, choice, identity and humanity while making use of the possibilities of emerging technology? How can we work with things that have an increasing sense of agency, from sensing to responding to shaping the world around them? See info on academic work, with more detail on research, teaching and PhD supervision.In my creative practice I engage with interactions between people and technology. I make music using computers and controllers, and our laptop trio Raw Green Rust has played in many interesting places. I create artworks that explore technological and social phenomena that have been shown internationally (ZKM, Creativity and Cognition, Scottish National Gallery of Modern Art, Talbot Rice Gallery) and have won multiple awards (Lumen Prize, New Technology Art Award).Upcoming public events(see all events)Selected recent papers (Un)Making AI Magic: A Design Taxonomy Lupetti, Maria Luce and Murray-Rust, Dave (2024) Proceedings of the CHI Conference on Human Factors in Computing Systems Unpacking Human-AI Interactions: From Interaction Primitives to a Design Space Tsiakas, Konstantinos and Murray-Rust, Dave (2024) ACM Transactions on Interactive Intelligent Systems Spatial Robotic Experiences as a Ground for Future HRI Speculations Murray-Rust, Dave and Lupetti, Maria Luce and Ianniello, Alessandro and Gorbet, Matt and Van Der Helm, Aadjan and Filthaut, Liliane and Chiu, Adrian and Beesley, Philip (2024) Companion of the 2024 ACM/IEEE International Conference on Human-Robot Interaction Experiential AI: Between Arts and Explainable AI Hemment, D