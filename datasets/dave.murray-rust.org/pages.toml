title = "Artworks - Dave Murray-Rust"
description = "Dave Murray-Rust"
full_description = "ArtworksI am an academic, artist and musician, exploring the relations that emerge when humans and technology become entangled. I work with metaphors, prototyping, speculation, tinkering and mess to re-think technological propositions, whether robots, intelligence, music or distributed systems. My interactive installations have won the Lumen Prize for AI and Art as well as a people’s choice New Technology Art Award, and have been shown at ZKM Karlsruhe, Athens Art Fair, Kinetica, Talbot Rice Gallery. I blend creative practice with technological research, winning a best paper at Human Robot Interaction 2024 for speculative design work around a robotic artwork and showing design work at Tate Exchange. I have also curated residencies and exhibitions exploring the connections between art and data and exploring art and AI at Inspace gallery in Edinburgh. I am part of the Experiential AI/New Real group, and have spoken at ZKM, Ars Electronica, Conflux festival and more, making links between the various practices of AI, art, music and design.WorksArtificial Otoacoustics (photo credits to Pieter Kers https://beeld.nu/)Artificial Otoacoustics is an investigation into a physical deep learning synthesiser with an unconventional soundmaking apparatus that comes to understand its noise making potentials.Lichtsuchende Lichtsuchende, a collaboration with Rocio Jungenfeld, is a small society of robot sunflowers that interact by exchanging beams of light. Over the years, they have morphed from a study in distributed embodied algorithms into an exploration of what robot imaginaries might be.Thawing Colours Thawing Colours is a collaborative piece with Rocio Jungenfeld, involving ice, pigment, wool, contact microphones and concatenative synthesis.Chaodependant Chaodependant, in collaboration with Owen Green and Agelos Papadakis, investigates the use of technology to explore invisibly structured spaces, in particular the attraction and repulsion of magnetic fields. A pendulum hangs from the roof, with a magnet encased in glass as the bob. A circular base supports a collection of glass pods containing magnets, sensors and lights.OutputsSelected Shows and Awards Speculative Robot Encounters 3/11/2023 TU Delft (Exhibition) [ Doc 1 ] Artificial Otoacoustics 10/6/2023 iii (Residency) [ Doc 1 ] Space and Satellites Exhibition 11/6/2020 Inspace, Edinburgh (Curation) Lichtsuchende 24/10/2019 Shortlisted for Lumen Prize, AI Section (Award) Data Lates 8/7/2019 Inspace (Curation) Lichtsuchende 16/11/2018 Machine Gods, Scottish National Gallery Of Modern Art (Modern Two) (Exhibition) Lichtsuchende 22/06/2015 ACM Creativity and Cognition (Exhibition) Lichtsuchende 31/10/2015 Exo-Evolution, ZKM Karlsruhe (Exhibition) [ Doc 1 ] Lichtsuchende 26/11/2014 3rd Public Choice Award, New Technology Art Awards (Award) [ Doc 1 ] Lichtsuchende 11/8/2014 New Technology Art Awards, Zebrastraat, Ghent (Exhibition) [ Doc 1 ] Lichtsuchende 4/1/2014 AISB50, Goldsmiths, London (Exhibition) Silicasonisphere 5/11/2014 FOaM, Brussels (Exhibition) [ Doc 1 ] Lichtsuchende 28/03/2014 Hidden Door, Edinburgh (Exhibition) [ Doc 1 ] Thawing Colours 5/12/2012 Talbot Rice Gallery, Edinburgh (Exhibition) [ Doc 1 ] Chaodependant 5/7/2010 International Festival of Digital Arts and New Media, Athens Video Art Festival (Exhibition) Chaodependant 2/4/2010 Kinetica, Ambika/P3, London (Exhibition) [ Doc 1 ] Chaodependant 15/05/2009 Passing Through, London (Exhibition) [ Doc 1 ] Truth Table 21/02/2008 The Lighthouse, Glasgow (Exhibition)Papers On Creative Practice and Generative AI Vidmar, Matjaz and Hemment, Drew and Murray-Rust, Dave and Black, Suzanne R. (2024) Data-Driven Innovation in the Creative Industries: Creative Data Catalysts Spatial Robotic Experiences as a Ground for Future HRI Speculations Murray-Rust, Dave and Lupetti, Maria Luce and Ianniello, Alessandro and Gorbet, Matt and Van Der Helm, Aadjan and Filthaut, Liliane and Chiu, Adrian and Beesley, Philip (2024) C