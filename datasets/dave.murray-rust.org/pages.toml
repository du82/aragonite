["https://dave.murray-rust.org/music"]
title = "Music - Dave Murray-Rust"
description = "Dave Murray-Rust"
full_description = '''MusicI’m interested in musical improvisation, particularly ways that I can use digital means of making and manipulating sound fluidly across time, timbre and space using physical gesture. My PhD from Edinburgh University in 2007 was investigating AI and music, in particular how we can look at shared improvisation as a dialogue, in order to allow intelligent agents to become partners in improvisation. Now I do most of my musicking with humans. My longest running music project is the laptop trio Raw Green Rust. We experiment with algorithms that modulate improvisational dynamics, exploring blurred agencies, creative failures and finding beat-like structures in soups of resampled glitches. We’ve played at Sonorities, Convergence, Hear and Now (Radio 3) among others, we have an album out on Superpang. Taking the interactive agencies further, we have won a Centre for Data, Culture and Society Research Prize for Jules Rawlinson’s Antagonistic Sextet. I’m working with ideas about how human and machine agencies intermix, how digital interventions can shape both micro and macro approaches to playing and how the trascendent internal space of improvising practice can survive the the screens and cables of computational approaches.I’ve also played a lot as part of Edimpro, Edinburgh’s free improvising orchestra, and have an ongoing duet with Firas Khnaisser - albums below.Latest ReleasesMoody oozing electronics: <a href="https://co-dependent.bandcamp.com/album/code034">CODE034 by Dave Murray-Rust</a>Solo album - kotamo and electronics, spacious and listenable: <a href="https://mo-seph.bandcamp.com/album/weathered">Weathered by Dave Murray-Rust</a>Raw Green Rust’s first release - abstract glitch dub: <a href="https://rawgreenrust.bandcamp.com/album/inability-to-end">Inability To End by Raw Green Rust</a>Duet with Firas Khnaisser - crunchy guitars and shimmering electronics: <a href="https://mo-seph.bandcamp.com/album/plant-bites-bug">Plant bites bug by Dave Murray-Rust and Firas Khnaisser</a>Raw Green RustRaw Green Rust (formerly TR-I/O-FON) has been playing as an improvising laptop trio since 2008, serving up humorous abstract glitch-dub from promiscuous audio processing. We’ve played at Sonorities, Convergence, Hear and Now (Radio 3) among others, we have an album out on Superpang. We have won a Centre for Data, Culture and Society Research Prize for Jules Rawlinson’s Antagonistic Sextet.You can read about our approach in Its Psychedelic Baby Magazine, and there’s a talk at xCoAx about what we do and how we do itReleasesOur first album is out on Superpang: <a href="https://rawgreenrust.bandcamp.com/album/inability-to-end">Inability To End by Raw Green Rust</a>VideosPerformance of Antagonistic Sextet with post-talk for Edinburgh Futures Institute “Love Machine” season 2023: Performance at Beyond Festival, Heilbronn, 2019: Dave Murray-RustThis is my improvised solo music.Moody oozing electronics <a href="https://co-dependent.bandcamp.com/album/code034">CODE034 by Dave Murray-Rust</a>Mixing in acoustic instumentation with electronics <a href="https://mo-seph.bandcamp.com/album/weathered">Weathered by Dave Murray-Rust</a>Dave Murray-Rust & Firas KhnaisserOur second album is self released - lots of crunchy guitar, mangled samples and clouds of distorted drums: <a href="https://mo-seph.bandcamp.com/album/plant-bites-bug">Plant bites bug by Dave Murray-Rust and Firas Khnaisser</a>Our first album came out on the very lovely but sadly wrapped up TQN-aut label (check out their other releases). It’s all improvisation between us, done remotely in lockdown and then processed and edited down. <a href="https://tqn-aut.bandcamp.com/album/dust-needs-no-imagination">Dust needs no imagination by Dave Murray-Rust &amp; Firas Khnaisser</a>mo-sephmo-seph is my solo project, mostly composed work but moving towards processed improvisation.The Slow DescentA journey through the hidden recesses of the mind - ambient techno explorations of bass and joy. The latest EP from mo-seph is stitched together from improvised playing into a seamless trajectory of noise and beats and glitches. <a href="http://blacklanternmusic.bandcamp.com/album/the-slow-descent">The Slow Descent by mo-seph</a>The Other PlaceA collection of tracks from the last few years. Sparkling, wiggling, crunchy time signatures and dirty basses. <a href="http://blacklanternmusic.bandcamp.com/album/the-other-place">The Other Place by mo-seph</a>Growth and FormA continuous piece of music, sliding from one imaginary landscape to another.The breadth of styles and influences absorbed is spectacular… Download both, get ‘em on your mp3 player and set course for the middle of nowhere… real fucking wow music.” Liam Arnold, Team Little Rock / Shallow Rave on Growth and Form and The Other Place<a href="http://blacklanternmusic.bandcamp.com/album/growth-and-form">Growth and Form by mo-seph</a>Somos NanasTense, unsettling electronics and vocals, edited together from a series of live performances and studio improvisations between me and Josie Davis in the summer of 2009. <a href="http://blacklanternmusic.bandcamp.com/album/somos-nanas">Somos Nanas by Mo-Seph and Josie Davis</a>EdimproEdimpro is an ongoing improvisers orchestra loosely based at the University of Edinburgh. We put out three albums while I was there, all on the Reid Label: <a href="http://reidid.bandcamp.com/album/heated">heated by edimpro</a> <a href="http://reidid.bandcamp.com/album/forest">forest by edimpro</a> <a href="http://reidid.bandcamp.com/album/alison">alison by edimpro</a>AZIFAZIFAZIFA collaboration with Harlequinade - ritual beats and physical performanceMo-seph’s arrestingly tribal bass beat in AZIFAZIFAZIF is intriguingly meditative accompanied by performer Harlequinade’s animalistic chant Talila Pick, The SkinnyConcerts DCODE Summer School 20/6/2022 () Raw Green Rust 22/10/2019 Creative Informatics Lab, Old Tolbooth Market () Edimpro 9/1/2017 Reid Concert Hall, Edinburgh (Concert) Grey Area 8/4/2016 Sharmanka Gallery, Glasgow (Concert) Edimpro 10/11/2015 Reid Concert Hall, Edinburgh (Concert) Grey Area and Alex McLean perform music by Hugh Davies, 17/10/2015 Sounds Heard, Clothworkers Centenary Concert Hall, School of Music, University of Leeds (Concert) [ Doc 1 Doc 2 ] Edimpro 6/2/2015 Edinburgh (Concert) Grey Area Performs 23/05/2015 Sounds Heard, Clothworkers Centenary Concert Hall, School of Music, University of Leeds (Concert) [ Doc 1 ] mo-seph+Harlequinade: AZIFAZIFAZIF 16/08/2014 Fringe, Woodland Creatures, Edinburgh (Concert) Edimpro + Evan Parker 30/06/2014 LRA, Edinburgh (Concert) Edimpro + Michael Doneda 27/11/2014 Talbot Rice Gallery, Edinburgh (Concert) Phil Minton & Simon Fell with Edimpro 14/02/2014 Dialogues Festival, Inspace, Edinburgh (Concert) mo-seph+Harlequinade: AZIFAZIFAZIF 13/12/2013 Anatomy, Edinburgh (Concert) [ Doc 1 ] Edimpro + Marilyn Crispell + Raymond McDonald 12/3/2013 Reid Concert Hall, Edinburgh (Concert) mo-seph 6/7/2013 Eden Festival, Dumfries (Concert) Edimpro 29/06/2013 Glasgow Jazz Festival (Concert) Edimpro + Superimpose 30/03/2013 Reid Concert Hall, Edinburgh (Concert) TR-I/O-FON 5/12/2012 Dialogues, Bongo Club, Edinburgh (Concert) mo-seph + Josie Davis 13/09/2009 Indie Pub, Skopje Bienalle (Concert) LLEAP 21/05/2009 Bongo Club, Edinburgh (Concert) [ Doc 1 ] TR-I/O-FON 13/05/2009 Grind Sight Open Eye, Edinburgh (Concert) [ Doc 1 ] TR-I/O-FON 15/11/2008 Dialogues, Informatics Forum, Edinburgh (Concert) Kresch 17/02/2007 Dialogues, Queen's Hall, Edinburgh (Concert)'''
