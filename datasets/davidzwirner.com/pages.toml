full_description = "SurveyExhibitionsArtist NewsBiographySelected PressBooksInquireFrancis AlÿsBelgian-born Francis Alÿs (b. 1959) is known for his in-depth projects in a wide range of media, including film, painting, photography, performance and video. Through his practice, Alÿs consistently directs his distinct poetic and imaginative sensibility toward anthropological and geopolitical concerns centered around observations of, and engagements with, everyday life.Learn MoreSurveyExplore all ArtworksFrancis AlÿsChildren's Games, Various locations, 1999–PresentInstallation view at Copenhagen Contemporary, 2022Francis AlÿsSandlines, the Story of History, Iraq, 2018–2020Single channel film, 61 minMade in collaboration with Julien Devaux, Ivan Boccara, and the Ruya FoundationFrancis AlÿsExodus, 2014-2018Graphite on paper in eight hundred and fifty (850) parts and single channel video, 17 min 8 secInstallation view at Rockbund Art Museum, Shanghai, 2018Francis AlÿsColor Matching, Mosul, Iraq, 2016Video documentation of an action, 4 min 56 secFrancis AlÿsBartella Iraq, Oct 2016Oil and graphite on linenDiptych Each: 5 5/8 x 7 1/2 inches (14.4 x 18.9 cm)Francis AlÿsCut, 1992-2015Oil and encaustic on panel16 x 19 5/8 x 7/8 inches (40.6 x 49.8 x 2.2 cm)Francis AlÿsThe Silence of Ani, Turkish-Armenian Border, 2015Video documentation of an action, 13 min 21 sec In collaboration with Antonio Fernández Ros, Julien Devaux, Félix Blume, and the teens of KarsFrancis AlÿsLada Kopeika Project, St. Petersburg, Russia, 2014Video documentation of an action, 9 min In collaboration with Frédéric De Smedt, Constantin Felker, and Julien DevauxFrancis AlÿsParadox of Praxis 5: Sometimes we dream as we live & sometimes we live as we dream, Ciudad Juárez, México, 2013Video documentation of an action, 7 min 49 sec In collaboration with Julien Devaux, Rafael Ortega, Alejandro Morales, and Félix BlumeFrancis AlÿsLinchados, 2010Oil on canvas on wood5 3/8 x 7 1/8 x 7/8 inches (13.5 x 18 x 2 cm)Francis AlÿsREEL-UNREEL, 2011Video documentation of an action, 19 min 28 secIn collaboration with Julien Devaux and Ajmal MaiwandiFrancis AlÿsUntitled (color bar), 2011-2012Oil and collage on canvas on wood5 3/8 x 7 x 5/8 inches (13.5 x 17.7 x 1.5 cm) ExhibitionsExplore ExhibitionsView AllArtist NewsExplore Artist NewsFrancis Alÿs: RicochetsFundação Serralves, Porto, PortugalOctober 17, 2024–March 16, 2025Read MoreFrancis Alÿs: RicochetsBarbican Centre, London, United KingdomJune 27–September 1, 2024Read MoreFrancis Alÿs to receive the 2023 Wolfgang Hahn PrizeMuseum Ludwig, Cologne, GermanyFall 2023Read MoreFrancis Alÿs: The Nature of the GameWIELS Contemporary Art Centre, Brussels, BelgiumSeptember 2023Read MoreFrancis Alÿs at the Museo Universitario Arte ContemporáneoMuseo Universitario Arte Contemporáneo, Mexico City, MexicoFebruary 2023Read MoreFrancis Alÿs: Touches of GamesKuandu Museum of Fine Arts, Taipei, TaiwanDecember 2022Read MoreFrancis Alÿs: Children’s GamesCopenhagen Contemporary, Copenhagen, DenmarkOctober 2022Read MoreWALK!Schirn Kunsthalle Frankfurt, Frankfurt, GermanyFebruary 2022Read MorefragilitésGalerie Rudolfinum, Prague, Czech Republic2022–2023Read MoreFrancis Alÿs to Represent Belgium at the 59th Venice BiennaleVenice Biennale, Venice, Italy2022Read More BiographyView Artist WebsiteDownload Full CVBelgian-born Francis Alÿs (b. 1959) is known for his in-depth projects in a wide range of media, including documentary film, painting, drawing, performance, two-dimensional animation, and video. Through his practice, Alÿs consistently directs his distinct poetic and imaginative sensibility toward anthropological and geopolitical concerns centered around observations of, and engagements with, everyday life. The artist himself has described his work as “a sort of discursive argument composed of episodes, metaphors, or parables.”Born in Antwerp, Alÿs originally trained as an architect. He moved to Mexico City in 1986, where he continues to live and work, and it was the confrontation with issues of urbanization and social unrest in his country of adoption that inspired his decision to become a visual artist. The artist’s work has been represented by David Zwirner since 2004. He was the subject of solo exhibitions at the gallery’s New York location, in 2007 and 2013. In 2016, Ciudad Juárez projects marked his first solo presentation at the gallery’s London location, and in 2021, the solo exhibition Don’t Cross the Bridge Before You Get to the River was on view at David Zwirner Paris. The Gibraltar Projects, a solo exhibition featuring the artist’s acclaimed body of work, The Gibraltar Projects: Don’t Cross the Bridge Before You Get to the River, is currently on view at David Zwirner New York. In summer 2024, the Barbican Art Centre, London, presented Francis Alÿs: Ricochets, marking the United Kingdom premiere of the artist’s series Children’s Games (1999–). The exhibition is currently on view at the Serralves Foundation – Museum of Contemporary Art, Porto through March 2025. Alÿs was the recipient of the 2023 Wolfgang Hahn Prize, awarded by the Museum Ludwig, Cologne, and he received a solo exhibition at the museum in November of that year. The artist’s 2013 film Paradox of Praxis 5 was presented at the Cleveland Museum of Art in 2023. Francis Alÿs: Children’s Games, 1999–2022, was on view at the Museo Universitario Arte Contemporáneo, Mexico City, earlier in the same year. A solo exhibition of the artist’s work was on view at Copenhagen Contemporary from 2022 to 2023. In 2022, Alÿs represented Belgium at the 59th Venice Biennale with the solo presentation, Francis Alÿs: The Nature of the Game. At the Musée cantonal des Beaux-Arts, Lausanne, Switzerland, Francis Alÿs: As Long As I’m Walking, was on view in 2021. Also that year, Francis Alÿs: Salam Tristesse was on view at Fragmentos, Espacio de Arte y Memoria, Bogotá. In 2019 to 2020, solo shows by the artist were on view at the Musée d’art contemporain de Montréal (part of the 16th edition of the MOMENTA | Biennale de l’image) and the Eye Filmmuseum in Amsterdam.In 2018 solo exhibitions of Alÿs’s work were held at the Art Sonje Center in Seoul; KANAL–Centre Pompidou in Brussels; and Rockbund Art Museum in Shanghai. In 2017, the artist unveiled new work at the Iraqi Pavilion at the 57th Venice Biennale, made following his trips to the country. Additionally, a major solo museum exhibition, A Story of Negotiation, featuring the artist’s three projects Don’t Cross the Bridge Before You Get to the River, Tornado, and REEL-UNREEL, was presented at the Art Gallery of Ontario in Toronto. The show was first exhibited at the Museo Tamayo Arte Contemporáneo in Mexico City in 2015, followed by the Museo de Arte Latinoamericano de Buenos Aires (MALBA)—Fundación Costantiniand the Museo Nacional de Bellas Artes de la Habana in Havana.In 2014, Alÿs’s video REEL-UNREEL, which depicts a street game played by local children in Kabul, was on view alongside related drawings, paintings, and research materials at Museo d’Arte Contemporanea Donna Regina Napoli, Naples. The exhibition traveled later that year to Ujazdowski Castle Centre for Contemporary Art, Warsaw. REEL-UNREEL was originally produced in 2012 for documenta 13, where a selection of paintings was installed in a former bakery in Kassel's city center and the video was screened at a satellite venue in Kabul.The artist’s work was the subject of a major survey, A Story of Deception, which was on view from 2010 to 2011 at Tate Modern, London; Wiels Centre d’Art Contemporain, Brussels; and The Museum of Modern Art and MoMA PS1, both New York. Over the past decade, Alÿs has had several solo exhibitions at prominent venues including the Museum of Contemporary Art, Tokyo (2013; traveled to the Hiroshima City Museum of Contemporary Art); Irish Museum of Modern Art, Dublin (2010); The Renaissance Society, University of Chicago (2008); Hammer Museum, Los Angeles (2007); Hirshhorn Museum and Sculpture Garden, Washington, DC (2006); and Portikus, Frankfurt (2006).Work by the artist is held in public collections worldwide, including the 21st Century Museum of Contemporary Art, Kanazawa, Japan; Art Institute of Chicago; Hammer Museum, Los Angeles; Musée d’Art Moderne de la Ville de Paris; Musée d’Art Moderne Grand-Duc Jean, Luxembourg; The Museum of Modern Art, New York; Philadelphia Museum of Art; Pinakothek der Moderne, Munich; Solomon R. Guggenheim Museum, New York; Stedelijk Museum, Amsterdam; and Tate, United Kingdom.View Artist WebsiteDownload Full CVSelected PressExplore Selected PressFrancis Alÿs: The Gibraltar ProjectsThe Brooklyn Rail, review by Amanda Gluibizzi2024Read MoreFrom Covid-inspired tag in Mexico to soccer with no ball in Iraq: Francis Alÿs on his joyous films of children’s gamesThe Guardian, review by Elizabeth Fullerton2024Read MoreFrancis Alÿs: All the World’s a GameArtReview, review by Anna Parker2024Read MoreFrancis Alÿs: Ricochets review – children of the world unite in a health and safety nightmareThe Guardian, feature by Adrian Searle2024Read MoreFrancis Alÿs’s Games without FrontiersFrieze, feature by Elvia Wilk2022Read MoreFrancis Alÿs on Borders and Games in Hong KongOcula, In Conversation with Xue Tan & Tobias Berger2021Read MoreSelected TitlesExplore BooksFrancis AlÿsRevised & Expanded EditionPhaidon$69.95Francis Alÿs: As Long as I'm WalkingJRP|Editions$55Francis Alÿs: The Nature of the GameDCV$35Endless Enigma: Eight Centuries of Fantastic ArtDavid Zwirner Books$80Landscape Painting NowFrancis Alÿs: Le temps du sommeilSecession$45Francis Alÿs: Schilder van luchtspiegelingenFrancis Alÿs: Sometimes doing something poetic can become political and sometimes doing something political can become poeticDavid Zwirner$40Francis Alÿs: The Modern ProcessionPublic Art Fund$35 Request more informationGet In Touch"
