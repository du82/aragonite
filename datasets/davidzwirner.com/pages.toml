["https://davidzwirner.com/collect/chris-ofili-joyful-sorrow-book"]
title = "Chris Ofili: Joyful Sorrow | Books | David Zwirner"
description = "David Zwirner is an art gallery with locations in New York, Los Angeles, London, Paris and Hong Kong. We present physical and online exhibitions, podcasts, books, and more."
full_description = "Chris Ofili: Joyful SorrowPublisher: Victoria Miro/David Zwirner BooksPublication Date: 2024Text by the studio of Chris Ofili. Poems by Jason Allen-PaisantA stunning presentation of the acclaimed British painter Chris Ofili’s newest body of work that continues his exploration of Shakespeare’s OthelloRenowned for his rich, multilayered paintings, Ofili here expands his engagement with William Shakespeare’s The Tragedy of Othello, the Moor of Venice (1603–1604). The transmuting colors and forms of the watercolors and paintings in this volume reflect the complex interiority of the character Othello—his vulnerabilities and his joyful sorrows. The artist also considers these works, which investigate ideas of authenticity, meaning, and selfhood, to be partly self-portraits. As viewers and readers, encountering a subject whose features split and shift with each repeated representation, we are asked to consider metamorphosis, love, the bearing of outside influences on our inner selves, and the force we exercise on the world.Published on the occasion of a two-site exhibition staged by David Zwirner Paris and Victoria Miro in Venice, the catalogue includes a text from Ofili’s studio and a selection of poems by Jason Allen-Paisant from his 2023 collection Self-Portrait as Othello.DetailsPublisher: Victoria Miro/David Zwirner BooksArtist: Chris OfiliContributors: Jason Allen-PaisantPublication Date: 2024ISBN: 9781644231593Retail: $60 | $80 CAN | £45Designer: Atelier DyakovaBinding: SoftcoverDimensions: 7.75 × 10 in | 20 × 25.6 cmPages: 84Reproductions: 29 illustrationsArtist and ContributorsChris OfiliChris Ofili (b. 1968) creates atmospheric and enigmatic paintings investigate the intersection of desire, identity, and representation. Portraying characters from a range of aesthetic and cultural sources through a kaleidoscopic visual mode that bridges abstraction and figuration, his works serve as sites for journeys of creative transformation.Jason Allen-PaisantJason Allen-Paisant is a scholar, an award-winning poet, and a writer. His work explores how Afro-diasporic artists and communities shape their futures through embodied philosophies, focusing on the intersections of poetry and philosophy. His debut poetry collection, Thinking with Trees, won the 2022 OCM Bocas Prize for Caribbean Literature. His second book, Self-Portrait as Othello, has earned significant accolades, including the 2023 Forward Prize for Best Collection and the T. S. Eliot Prize. He is a professor of critical theory and creative writing at the University of Manchester.$60"
