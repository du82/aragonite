title = "Alice Neel - Artworks & Biography | David Zwirner"
description = "Alice Neel (1900-1984) is widely regarded as one of the foremost American figurative artists of the twentieth century. As the avant-garde of the…"
full_description = '''SurveyExhibitionsArtist NewsBiographySelected PressBooksInquireAlice NeelOne of the foremost American artists of the twentieth century, Alice Neel (1900–1984) is known for her daringly honest, humanist approach to the figure. Working from life and memory, she painted writers, poets, artists, activists, family, friends, and others around her with unfazed accuracy, honesty, and compassion. Calling herself a "collector of souls," Neel is acclaimed for not only capturing the truth of the individual, but also reflecting the era in which she lived.Learn MoreSurveyExplore all ArtworksAlice NeelHartley and Andrew, 1983Oil on canvas48 x 34 inches (121.9 x 86.4 cm)Framed: 51 1/2 x 37 7/8 inches (130.8 x 96.2 cm)Alice NeelAnnie Sprinkle, 1982Oil on canvas60 7/8 x 44 1/8 inches (154.6 x 112.1 cm) Framed: 62 7/8 x 46 7/8 inches (159.7 x 119.1 cm)Alice NeelMargaret Evans Pregnant, 1978Oil on canvas57 3/4 x 38 inches (146.7 x 96.5 cm)Institute of Contemporary Art BostonAlice NeelThe De Vegh Twins, 1975Oil on canvas38 x 32 inches (96.5 x 81.3 cm)Alice NeelCindy Nemser and Chuck, 1975Oil on canvas41 1/4 x 59 5/8 inches (104.8 x 151.4 cm)Framed: 44 3/4 x 63 inches (113.7 x 160 cm)Alice NeelCarmen and Judy, 1972Oil on canvas40 x 30 inches (101.6 x 76.2 cm)Oklahoma City Museum of ArtAlice NeelJohn Perreault, 1972Oil on canvas38 x 63 7/8 inches (96.5 x 162.2 cm)Framed: 41 3/8 x 67 1/4 inches (105.1 x 170.8 cm)Whitney Museum of American Art, New YorkAlice NeelIan and Mary, 197146 x 50 inches (116.8 x 127 cm)Framed: 48 7/8 x 52 7/8 inches (124.1 x 134.3 cm)Alice NeelRichard, 1967Oil on canvas59 5/8 x 45 1/8 inches (151.4 x 114.6 cm)Framed: 63 5/8 x 49 3/8 inches (161.6 x 125.4 cm)Alice NeelHugh Hurd, 1964Oil on canvas40 x 30 1/8 inches (101.6 x 76.5 cm)Framed: 42 7/8 x 33 1/8 inches (108.9 x 84.1 cm)Alice NeelStill Life, 1964Oil on canvas46 x 40 inches (116.8 x 101.6 cm)Framed: 49 5/8 x 43 3/8 inches (126 x 110.2 cm)Alice NeelRuth Nude, 1964Oil on canvas40 1/8 x 48 inches (101.9 x 121.9 cm)Framed: 43 3/8 x 51 3/8 inches (110.2 x 130.5 cm) ExhibitionsExplore ExhibitionsView AllArtist NewsExplore Artist NewsDialogues: Hilton Als on Alice NeelSeptember 2024Read MoreAlice Neel: Every Person Is A New UniverseMunch Museum, OsloSeptember 2023Read MoreAlice Neel: Feels Like HomeOrange County Museum of ArtJune 2023Read MoreAlice Neel: Hot Off The GriddleBarbican Centre, LondonFebruary 2023Read MoreAlice Neel: An Engaged EyeCentre Pompidou, ParisOctober 2022Read MoreAlice Neel: People Come Firstde Young Museum, San FranciscoMarch 2022Read MoreAlice Neel: People Come FirstThe Metropolitan Museum of Art, New York2021Read MoreAlice Neel The Art of Not Sitting PrettyPhoebe Hoban’s definitive biography of the renowned American painter2021Read MoreAlice Neel: Painter of Modern LifeThe European travelling survey recounting the artist's career2016–2018Read More BiographyAlice Neel, Self-Portrait, 1980Download Full CVOne of the foremost American artists of the twentieth century, Alice Neel (1900–1984) is known for her daringly honest, humanist approach to the figure. Working from life and memory, she painted writers, poets, artists, activists, family, friends, and others around her with unfazed accuracy, honesty, and compassion. Calling herself a "collector of souls," Neel is acclaimed for not only capturing the truth of the individual, but also reflecting the era in which she lived.Neel was born in Merion Square, Pennsylvania, and died in New York. In 1921, she enrolled in the fine art program at the Philadelphia School of Design for Women (now Moore College of Art and Design) and graduated in 1925.Although she exhibited sporadically early in her career, her work has been shown widely from the 1960s onwards. In 1971, a comprehensive solo exhibition of Neel's paintings was held at her alma mater Moore College of Art and Design, Philadelphia, and in 1974, she had her first retrospective at the Whitney Museum of American Art, New York. It was followed by a large-scale presentation of eighty-three paintings in 1975 at the Georgia Museum of Art, The University of Georgia, Athens. In 1978, the Graham Gallery, New York, organized the first retrospective dedicated to the artist's works on paper, and in 1979, a survey of her paintings was co-hosted by the University of Bridgeport and The Silvermine Guild of Artists in Connecticut.To celebrate the centenary of the artist's birth, the Philadelphia Museum of Art organized a solo exhibition of Neel’s work, which debuted in 2000 at the Whitney Museum of American Art, New York, before traveling to the Walker Art Center, Minneapolis, among other venues. In 2010, the survey exhibition Alice Neel: Painted Truths was organized by the Museum of Fine Arts, Houston, and traveled to the Whitechapel Gallery, London, and Moderna Museet Malmö, Sweden. In 2013, a major presentation of the artist's watercolors and drawings, Alice Neel: Intimate Relations, was on view at Nordiska Akvarellmuseet in Skärhamn, Sweden. In 2016, the Ateneum Art Museum, Helsinki organized Alice Neel: Painter of Modern Life, which traveled to the Gemeentemuseum, The Hague, and the Fondation Vincent van Gogh in Arles, France, before concluding at the Deichtorhallen Hamburg in 2018.The major retrospective, Alice Neel: People Come First, was first on view at The Metropolitan Museum of Art, New York, in 2021, before traveling to the Guggenheim Museum Bilbao, and the de Young Museum, San Francisco, in 2022. Alice Neel: Un regard engagé debuted at the Centre Pompidou, Paris, in 2022 before traveling to the Barbican Centre, London, and the Munch Museum, Oslo, both in 2023. Also on view in 2023 was a solo presentation at the Orange County Museum of Art, Costa Mesa, California.Other solo presentations include those held at National Museum of Women in the Arts, Washington, DC (2005); Moderna Museet, Stockholm (2008); The Douglas Hyde Gallery, Dublin (2011); and the Talbot Rice Gallery, The University of Edinburgh (2016).Since 2008, The Estate of Alice Neel has been represented by David Zwirner, where her work was presented in 2009 in a critically acclaimed, two-venue solo exhibition, Alice Neel: Selected Works and Alice Neel: Nudes of the 1930s. Other solo exhibitions at the gallery in New York include Alice Neel: Late Portraits & Still Lifes (2012); and Alice Neel: Drawings and Watercolors 1927–1978 (2015). The critically-acclaimed exhibition Alice Neel, Uptown, curated by Hilton Als, took place at David Zwirner, New York, in 2017; followed by Alice Neel: Freedom (2019); and Alice Neel: The Early Years (2021). In 2022, Alice Neel: Men from the Sixties, the artist’s first exhibition in Greater China, was on view at David Zwirner Hong Kong. At Home: Alice Neel in the Queer World, curated by Hilton Als, was on view at David Zwirner Los Angeles in 2024.Work by the artist is represented in permanent collections that include the Art Institute of Chicago; Hirshhorn Museum and Sculpture Garden, Washington, DC; The Metropolitan Museum of Art, New York; Moderna Museet, Stockholm; Museum of Contemporary Art, Los Angeles; Museum of Fine Arts, Houston; The Museum of Modern Art, New York; National Gallery of Art, Washington, DC; Philadelphia Museum of Art; Tate, United Kingdom; and the Whitney Museum of American Art, New York.Download Full CVSelected PressExplore Selected PressThe Big Review: Alice Neel at the Centre Pompidou ★★★★★The Art Newspaper, review by Matthew Holman2022Read MoreAlice Neel was the greatest American portraitist of the 20th century. Her work continues to astonish.The Washington Post, review by Sebastian Smee2021Read MoreIt’s Time to Put Alice Neel in Her Rightful Place in the PantheonThe New York Times, review by Roberta Smith2021Read MoreAlice Neel’s Apartment Is Still a Portrait of the Artist at WorkT: The New York Times Style Magazine, by Rennie McDougall2021Read MoreBest Art Exhibitions of 2021The New York Times, review by Roberta Smith2021Read MoreArt Gallery Shows