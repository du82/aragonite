["https://davidzwirner.com/news/2024/francis-alys-ricochets-serralves"]
title = "Francis Alÿs: Ricochets | David Zwirner"
description = "David Zwirner is an art gallery with locations in New York, Los Angeles, London, Paris and Hong Kong. We present physical and online exhibitions, podcasts, books, and more."
full_description = "Fundação Serralves, Porto, PortugalOctober 17, 2024–March 16, 2025Fundação Serralves in Porto, Portugal presents Ricochets, an exhibition comprising both new and old films by Francis Alÿs, all depicting traditional and lesser-known hand games played by children and adults alike. Since 1999, Alÿs has recorded children at play in different contexts and environments around the globe. Over the previous two decades, he has traveled around the world to film the critically acclaimed series Children’s Games: from ‘musical chairs’ in Mexico, to ‘leapfrog’ in Iraq, ‘jump rope’ in Hong Kong, and ‘wolf and lamb’ in Afghanistan."
