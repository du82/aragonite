full_description = "Available ArtworksExhibitionsArtist NewsBiographySelected PressBooksInquireFranz WestEmerging in the early 1970s, Austrian-born artist Franz West (1947–2012) developed a unique aesthetic that engaged equally high and low reference points and often privileged social interaction as an intrinsic component of his work, thereby calling attention to the larger context of exhibition and the way in which viewers interact with works of art and with each other.Learn MoreAvailable ArtworksExplore Available ArtworksFranz WestUntitled, 1972Watercolor, marker, and pencil on paper5 3/8 x 8 1/8 inches (13.7 x 20.6 cm) Framed: 9 7/8 x 12 1/4 inches (25.1 x 31.1 cm)Franz WestNamensbilder, 1974-1985Papier-mâché, plastic, wood, plaster, dispersion, newspaper, cardboard, polyester, paint, and gauze on MasoniteOverall dimensions variableFranz WestPassstück (Adaptive), c. 1979Papier-mâché, plaster, and dispersion14 1/8 x 19 3/4 x 11 3/8 inches (36 x 50 x 29 cm)Franz WestUntitled, 1989Aluminum, wood, and dispersion7 x 35 x 15 inches (17.8 x 88.9 x 38.1 cm)Franz WestBI 11, 1990Cast aluminum and plaster15 x 33 x 8 1/2 inches (38.1 x 83.8 x 21.6 cm)Franz WestBrower's Rosen (unvollendet) (Brower's Roses [uncompleted]), 1982Acrylic and watercolor on newspaper in artist's frame24 5/8 x 33 1/2 inches (62.5 x 85 cm) Framed: 31 1/2 x 45 5/8 inches (80 x 116 cm)Franz WestPleonasme (Pleonasm), 1999Papier-mâché, plastic, plaster, glue, paint, and tape with painted wood and MDF artist's pedestalOverall: 91 x 34 x 41 1/2 inches (231.1 x 86.4 x 105.4 cm)Franz WestUntitled, 1997Structural steel, paint bucket lid, papier-mâché, gauze, plaster, dispersion, and acrylic23 1/2 x 18 x 14 inches (59.7 x 45.7 x 35.6 cm)Franz WestGrossse Lampe (Large Lamp), 2006Steel, plastic film, electrical accessories, and neon tubes116 7/8 x 45 1/4 x 40 1/2 inches 297 x 115 x 103 cmFranz WestKünstlerstuhl (Artist's Chair), 2006/2022Stainless steel, epoxy resin, and acrylic lacquer34 5/8 x 20 1/8 x 21 1/4 inches (88 x 51 x 54 cm)Franz WestKünstlerstuhl (Artist's Chair), 2006/2022Stainless steel, epoxy resin, and acrylic lacquer34 5/8 x 20 1/8 x 21 1/4 inches (88 x 51 x 54 cm)Franz WestDiwan (Divan), 1991/2022Steel, foam, rubber, and linen39 3/8 x 90 1/2 x 33 1/2 inches (100 x 230 x 85 cm) ExhibitionsExplore ExhibitionsView AllArtist NewsExplore Artist NewsConnecting Objects: Three Artists on the Legacy of Franz West2018Read MoreFranz West: Where Is My EightMuseum moderner Kunst Stiftung Ludwig Wien, Vienna2013Read MoreFranz West, To Build a House You Start with the Roof: Work, 1972–2008The Baltimore Museum of Art; traveled to Los Angeles County Museum of Art2008Read MoreMajor Museum RetrospectiveTate ModernFebruary 2019Read More BiographyDownload Full CVEmerging in the early 1970s, Austrian-born artist Franz West (1947–2012) developed a unique aesthetic that engaged equally high and low reference points and privileged social interaction as an intrinsic component of his work, thereby calling attention to the larger context of exhibition and the way in which viewers interact with works of art and with each other.West studied at the Akademie der bildenden Künste, Vienna, from 1977 to 1982. He began exhibiting his work in the 1970s in Austria and Germany and gained recognition across Europe in the 1980s, with significant shows at such venues as Neue Galerie am Landesmuseum Joanneum, Graz, Austria (1986); Wiener Secession, Vienna (1986); Skulptur Projekte Münster, Germany (1987); Kunsthalle Bern, Germany (1988); Portikus, Frankfurt (1988); Museum Haus Lange, Krefeld, Germany (1989); and the Institute for Contemporary Art, P.S. 1, New York (1989).The 1990s brought widespread international recognition, and the artist’s work was presented in numerous prestigious venues worldwide including the Austrian Pavilion of the 44th Venice Biennale (1990); Documenta IX, Kassel, Germany (1992); The Museum of Contemporary Art, Los Angeles (1994); Dia Center for the Arts, New York (1994); Carnegie International, Carnegie Museum of Art, Pittsburgh (1995); Villa Arson, Nice, France (1995–1996); and the Städtisches Museum Abteiberg, Mönchengladbach, Germany (1996). A major mid-career retrospective, Franz West: Proforma, was organized by the Museum moderner Kunst Stiftung Ludwig Wien, Vienna, in 1996 (it traveled to Kunsthalle Basel and Rijksmuseum Kröller-Müller, Otterlo, the Netherlands); and solo exhibitions were held at the Kunstverein in Hamburg (1996); FRAC Champagne-Ardenne, Reims, France (1997); The Museum of Modern Art, New York (1997); Fundação de Serralves, Porto, Portugal (1997). West participated in Documenta X, Kassel, Germany (1997); and the Rooseum, Centre for Contemporary Art, Malmö, Sweden, presented a solo exhibition of his work in 1999. West’s work was featured at The Renaissance Society, Chicago (2000); and Skulptur im Schlosspark Ambras, Innsbruck, Austria (2000); and ZKM | Museum für Neue Kunst, Karlsruhe, Germany, and the Museo Nacional Centro de Arte Reina Sofía, Madrid, presented the traveling survey Franz West: In & Out (2000–2001).Further exhibitions were held at the Museum für angewandte Kunst, Vienna, and MASS MoCA, North Adams, Massachusetts (2001–2002); Deichtorhallen, Hamburg (2001–2002); Wexner Center for Contemporary Art, Columbus, Ohio (2001); Musée d’Art Contemporain, Marseille (2002); Whitechapel Art Gallery, London (2003); Kunsthaus Bregenz, Austria (2003); Vancouver Art Gallery (2005); Museum für angewandte Kunst, Vienna (2008); Fondation Beyeler, Basel (2009); and the exhibition Franz West: Autotheater traveled from the Museum Ludwig, Cologne to the museo d’arte contemporanea Donnaregina, Naples in 2010.A significant grouping of outdoor sculptures was installed in the Lincoln Center Plaza in New York in 2004 (organized by Public Art Fund). In 2008–2009, the Baltimore Museum of Art organized the retrospective Franz West: To Build a House You Start with the Roof, which traveled to the Los Angeles County Museum of Art; and in 2013, a significant posthumous overview of the artist’s work, Franz West: Wo ist mein Achter? (Where Is My Eight?) was presented at the Museum moderner Kunst Stiftung Ludwig Wien (mumok), Vienna, and traveled to Museum für Moderne Kunst (MMK), Frankfurt, and The Hepworth Wakefield, England.A major survey of the artist’s work opened at the Centre Pompidou, Paris, in 2018, and traveled to the Tate Modern, London, in 2019.In 2023, a solo exhibition of work by the artist was on view at David Zwirner, Los Angeles, following two concurrent exhibitions of West’s work that were on view at the gallery’s Paris and New York locations earlier the same year. The Los Angeles show marked the eleventh exhibition of the artist’s work at David Zwirner since 1993, when his solo exhibition Investigations of American Art inaugurated the gallery’s program. This was followed by solo exhibitions at David Zwirner in 1994, 1996, 1998 (with Heimo Zobernig), and 1999. The gallery further organized an exhibition of his early work in 2004, a small survey in 2009, a show in 2014 that focused on work from the 1990s—accompanied by a catalogue published by David Zwirner Books, with essays by Eva Badura-Triska, Veit Loers, and Bernhard Riff—and a 2019 overview of the artist’s work in London.Work by the artist is held in major museum collections, including the Albertina Museum, Vienna; Bonnefanten Museum, Maastricht, the Netherlands; CAC Centro de Arte Contemporáneo, Málaga, Spain; Carnegie Museum of Art, Pittsburgh; Centre Pompidou, Paris; Hirshhorn Museum and Sculpture Garden, Washington, DC; Kröller-Müller Museum, Otterlo, the Netherlands; Kunsthaus Bregenz, Austria; Kunsthalle Bern, Switzerland; Louisiana Museum of Modern Art, Humlebæk, Denmark; Museum Boijmans van Beuningen, Rotterdam, the Netherlands; Museum of Contemporary Art, Los Angeles; The Museum of Modern Art, New York; Museum Moderner Kunst Stiftung Ludwig Wien (mumok), Vienna; Philadelphia Museum of Art; Stedelijk Museum voor Actuele Kunst (S.M.A.K.), Ghent; and ZKM | Museum für Neue Kunst, Karlsruhe, Germany.Download Full CVSelected PressExplore Selected PressSituational spaces created by Franz West’s furnitureWallpaper*, article by Siska Lyssens2019Read MoreThe Story Behind Franz West's Iconic ChairsArchitectural Digest, article by Hannah Martin2019Read MoreInside OutsiderArt in America, review by Richard Kalina2019Read MoreFranz West at Centre Pompidou, ParisArtReview, review by Jeppe Ugelvig2019Read MoreFranz West Worldly PleasuresTate ETC, review by Kito Nedo2019Read MoreBetween Two Senses: Franz West's Invitation To Look And Touchfrieze, review by Wilson Tarbox2018Read MoreSelected TitlesExplore BooksFranz West (Tate)Tate Enterprises$39.95Franz West: Galerie Eva Presenhuber95–15JRP|Ringier$55Franz West: The 1990sDavid Zwirner Books$65No Problem: Cologne/New York 1984–1989David Zwirner Books$65Franz West: Where Is My Eight?WALTHER KÖNIG, KÖLN$55 Request more informationGet In Touch"
