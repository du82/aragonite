full_description = "SurveyExhibitionsArtist NewsBiographySelected PressBooksInquireGerhard RichterWith a career spanning from the 1960s to the present, Gerhard Richter (b. 1932) is widely celebrated as one of the most important artists of his generation. He has pursued a diverse and influential practice characterized by a decades-long commitment to painting and its formal and conceptual possibilities. The artist has consistently probed the relationship between painting and photography, engaging a variety of styles and innovative techniques in a complex repositioning of genres.Learn MoreSurveyExplore all ArtworksGerhard RichterBirkenau, 2014Oil on canvas102 3/8 x 78 3/4 inches (260 x 200 cm) Neue Nationalgalerie, Staatliche Museen zu Berlin, Berlin, on long-term loan from the Gerhard Richter Art FoundationGerhard RichterBirkenau, 2014Oil on canvas102 3/8 x 78 3/4 inches (260 x 200 cm) Neue Nationalgalerie, Staatliche Museen zu Berlin, Berlin, on long-term loan from the Gerhard Richter Art FoundationGerhard RichterBirkenau, 2014Oil on canvas102 3/8 x 78 3/4 inches (260 x 200 cm) Neue Nationalgalerie, Staatliche Museen zu Berlin, Berlin, on long-term loan from the Gerhard Richter Art FoundationGerhard RichterBirkenau, 2014Oil on canvas102 3/8 x 78 3/4 inches (260 x 200 cm) Neue Nationalgalerie, Staatliche Museen zu Berlin, Berlin, on long-term loan from the Gerhard Richter Art FoundationGerhard RichterStrip, 2011Digital print on paper between aluminum and Perspex (Diasec)Two (2) panels, each: 78 3/4 x 86 5/8 inches (200 x 220 cm) Overall: 78 3/4 x 173 1/4 inches (200 x 440 cm) Fondation Louis Vuitton, ParisGerhard RichterSeptember, 2005Oil on canvas20 1/2 x 28 3/8 inches (52 x 72 cm) The Museum of Modern Art, New YorkGerhard RichterSelbstportrait (Self-portrait), 1996Oil on canvas20 1/8 x 18 1/8 inches (51 x 46 cm) The Museum of Modern Art, New YorkGerhard RichterLesende (Reader), 1994Oil on canvas28 3/8 x 40 1/8 inches (72 x 102 cm) San Francisco Museum of Modern ArtGerhard RichterI.G., 1993Oil on canvas28 3/8 x 40 1/8 inches (72 x 102 cm) Private CollectionGerhard RichterAbstraktes Bild (Abstract Painting), 1989Oil on canvas in two (2) parts126 x 78 3/4 inches (320 x 200 cm) Carré d'Art, Museé d'Art Contemporain de Nîmes, FranceGerhard RichterBeerdigung (Funeral), 1988Oil on canvas78 3/4 x 126 inches (200 x 320 cm) The Museum of Modern Art, New YorkGerhard RichterBetty, 1988Oil on canvas40 1/8 x 28 3/8 inches (102 x 72 cm) Saint Louis Art Museum ExhibitionsExplore ExhibitionsView AllArtist NewsExplore Artist NewsGerhard Richter: Hidden GemsKunstpalast Düsseldorf, Düsseldorf, Germany September 5, 2024–February 2, 2025Read MoreGerhard Richter: Serien | VariationenAlbertinum, Dresden, GermanyJune 22, 2024–September 8, 2024Read MoreVija Celmins & Gerhard Richter: Double VisionHamburger KunsthalleMay 2023Read MoreGerhard Richter: 100 Works for BerlinNeue Nationalgalerie, Berlin, GermanyApril 1, 2023–2026Read MoreDavid Zwirner to Represent Gerhard RichterDecember 2022Read More Biographyb.1932Download Full CVWith a career spanning from the 1960s to the present, Gerhard Richter (b. 1932) is widely celebrated as one of the most important artists of his generation. He has pursued a diverse and influential practice characterized by a decades-long commitment to painting and its formal and conceptual possibilities. The artist has consistently probed the relationship between painting and photography, engaging a variety of styles and innovative techniques in a complex repositioning of genres.Richter was born in Dresden, Germany. He studied art at the Dresden Hochschule für Bildende Künste from 1951 to 1956, with mural painting as his concentration. In 1959, he visited Documenta II, held in Kassel, Germany, an experience that inspired him to alter his artistic trajectory. After his escape from East Germany in 1961, he completed a second course of study at the Staatliche Kunstakademie in Düsseldorf. There, he united with fellow students Sigmar Polke, Konrad Lueg (later known as the gallerist Konrad Fischer), and Manfred Kuttner to collectively form the short-lived “capitalist realism” group.From 1964 onward, Richter has had many solo exhibitions in renowned galleries and museums worldwide. The artist’s first solo exhibition in a public institution was held at the Gegenverkehr, Zentrum für aktuelle Kunst, in Aachen, Germany, in 1969. In 1972 he was selected as the only artist to represent Germany in its national pavilion at the Venice Biennale. Richter has exhibited at Documenta, in Kassel, Germany, more times than any other artist (1972, 1977, 1982, 1987, 1992, 1997, 2007, and 2017).Richter’s work has been presented in numerous solo shows and retrospective exhibitions at important institutions worldwide, including the Kunstverein für die Rheinlande und Westfalen, Düsseldorf (1971, 1986); Kunsthalle Bremen, Germany (1975); Centre Pompidou, Paris (1977, 2012); Städtische Kunsthalle, Düsseldorf (1986); Neue Nationalgalerie, Staatliche Museen zu Berlin (1986, 2012, 2023); Hirshhorn Museum and Sculpture Garden, Washington, DC (1988, 2003); San Francisco Museum of Modern Art (1989, 2002); Tate, London (1991, 2011); Moderna Museet, Stockholm (1993); Art Institute of Chicago (2002); The Museum of Modern Art, New York (2002); Queensland Art Gallery, Brisbane (2017); The Met Breuer, New York (2020); and The National Museum of Modern Art, Tokyo (2022). In April 2023, the Nationalgalerie in Berlin opened Gerhard Richter: 100 Works for Berlin. This special long-term presentation features works that the Gerhard Richter Foundation gave to the museum on permanent loan in 2021, including Richter’s Birkenau (2014) cycle of large-scale abstract paintings. A new large-scale outdoor sculpture by Richter, STRIP-TOWER (2023), was on view at Serpentine South, in Kensington Gardens, London, in 2024.Richter has been honored with a number of significant awards, among them the Kunstpreis Junger Westen, Kunsthalle Recklinghausen, Germany (1967); Arnold-Bode-Preis, Kassel, Germany (1981); Oskar-Kokoschka-Preis, Vienna (1985); Goslarer Kaiserring, Goslar, Germany (1988); Golden Lion at the 47th Venice Biennale (1997); Praemium Imperiale Award, Japan Art Association, Tokyo (1997); Wexner Prize, Wexner Center for the Arts, Columbus, Ohio (1998); Foreign Honorary Membership of the American Academy of Arts and Letters, New York (1998); Staatspreis des Landes Nordrhein-Westfalen, Düsseldorf (2000); and the Kunst- und Kulturpreis der deutschen Katholiken, Deutsche Bischofskonferenz, Bonn, Germany (2004). In 2007 Gerhard Richter received honorary citizenship of Cologne, Germany, and in the same year he designed a spectacular glass window for the Cologne Cathedral.David Zwirner began representing the artist in 2023. The same year, the gallery presented a solo exhibition in New York of new and recent abstract works by Richter. The presentation was accompanied by a fully illustrated catalogue with a new essay by Dieter Schwarz. In early 2024, a solo exhibition of Richter's work was on view at David Zwirner, London. Prior exhibitions organized by the gallery in New York include Gerhard Richter: Prints & Multiples 1966–1993 (1994), Gerhard Richter: Early Paintings (2000), and Gerhard Richter: Landscapes (2004).Work by Richter is held in important public and private collections worldwide. He lives and works in Cologne.Download Full CVSelected PressExplore Selected PressGerhard Richter Rides AgainThe New York Times, review by Roberta Smith2023Read MoreNew Paintings from Gerhard RichterThe New Yorker preview2023Read MoreA Stained-Glass Gift, From God and Gerhard RichterThe New York Times, feature by Catherine Hickley2020Read MoreThe Master of UnknowingThe New York Review of Books, feature by Susan Tallman2020Read MoreThe Sublime Farewell of Gerhard Richter, Master of DoubtThe New York Times, feature by Jason Farago2020Read MoreGERHARD RICHTERArtforum, review by Jason Farago2020Read MoreSelected TitlesExplore BooksGerhard Richter: Foricano26 DrawingsDavid Zwirner Books$40Gerhard Richter: Foricano (Special Edition)Out of stockDavid Zwirner Books$350Gerhard Richter: New York 2023David Zwirner Books$75Gerhard Richter: 100 Abstract PicturesDavid Zwirner Books$50Gerhard Richter: LandscapesZwirner & Wirth$50 Request more informationGet In Touch"
