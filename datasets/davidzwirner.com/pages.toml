["https://davidzwirner.com/news/2024/noah-davis-at-the-barbican-centre"]
title = "Noah Davis Retrospective at the Barbican | David Zwirner"
description = "The Barbican Centre will present the second leg of Noah Davis, the largest international institutional survey to date of the late artist Noah Davis (1983-2015)."
full_description = "Barbican Centre, London, United KingdomFebruary 6–May 11, 2025The Barbican Centre will present the second leg of Noah Davis, the largest international institutional survey to date of the late artist Noah Davis (1983-2015). The Barbican Centre’s presentation will bring together approximately 50 works spanning the artist’s complete oeuvre, offering a comprehensive overview of Davis’ extraordinary practice.Noah Davis is the artist’s inaugural international institutional retrospective and will subsequently travel to the Hammer Museum, Los Angeles in Summer 2025.Curated chronologically, the retrospective presents Davis’ relentless creativity and curiosity commencing with his first exhibition in 2007, spanning eight years until his untimely death in 2015. Featuring previously unseen paintings, works on paper and sculpture, the exhibition pays special attention to the art historical and conceptual approaches in his practice, revealing that art history, imagery, humor, and above all, people were the epicenter of his work.Learn more at the Barbican Centre."
