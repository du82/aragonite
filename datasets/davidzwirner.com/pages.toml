["https://davidzwirner.com/exhibitions/2025/lisa-yuskavage"]
title = "Lisa Yuskavage |  Los Angeles | February 18—April 12, 2025  | David Zwirner"
description = "David Zwirner is pleased to present an exhibition of new and recent paintings by American artist Lisa Yuskavage, on view at the gallery’s 606 N Western Avenue location in Los Angeles. This will be the artist’s ninth solo exhibition with the gallery, and her first in Los Angeles in almost thirty years."
full_description = "ExploreChecklistInstallation ViewsExhibitionLisa YuskavageWant to know more?InquireNow OpenFebruary 18—April 12, 2025Opening ReceptionTuesday February 18, 6–8 PMLocation Los Angeles606 N Western AvenueLos Angeles, CA 90004Tue, Wed, Thu, Fri, Sat: 10 AM-6 PMArtistLisa YuskavageView Press ReleaseInstallation view, Lisa Yuskavage, David Zwirner, Los Angeles, 2025David Zwirner is pleased to present an exhibition of new paintings by artist Lisa Yuskavage, on view at the gallery’s 606 N Western Avenue location in Los Angeles. This is the artist’s ninth solo exhibition with the gallery and her first in Los Angeles in thirty years. It anticipates the first comprehensive museum presentation of Yuskavage’s works on paper, featuring drawings from the early 1990s to the present, the majority of which have never been exhibited before, at The Morgan Library & Museum, New York, in June 2025.ExploreExhibition Checklist: Lisa YuskavageView NowOne of the most original and influential artists of the past three decades, Yuskavage creates works that affirm the singularity of the medium of painting while challenging conventional understandings of genres and viewership. On view in Los Angeles are both large and small-format paintings, each set within a fictionalized artist’s studio in which the depicted spaces become stages where Yuskavage’s rich cast of characters and their varied attributes are intertwined.Lisa YuskavageTea and Cigarettes, 2024Oil on linen77 x 70 inches (195.6 x 177.8 cm)Inquire“Yuskavage’s principal tool for the creation of meaning in her paintings is color. This commitment to color was established very early in her career and has accrued nuance and complexity over time.... The color is the subject’s aura and the subject’s aura is, in turn, the subject of the painting.”—Christopher Bedford, director, San Francisco Museum of Modern ArtLisa YuskavagePainter Painting, 2024Oil on linen94 x 77 1/4 inches (238.8 x 196.2 cm)InquireLisa Yuskavage, Painter Painting, 2024 (detail)Lisa Yuskavage, Bad Habits Facing West 5, 1996Lisa Yuskavage, Motherfucking Rock, 1996. Institute of Contemporary Art, BostonLisa Yuskavage, Faucet, 1995Painter Painting (2024), one of the new large-scale works in the exhibition, envisions a monumental grisaille in front of which an artist—a self-portrait of Yuskavage in a lab coat—is at work. The painting within the scene is based on a black-and-white photograph that Yuskavage took in 1995 of one of her Bad Habits sculptural maquettes, “The Motherfucker.”The sculptures have subsequently appeared as subjects in many of her works, most notably from 1996 to 1999. Expanding the self-referential play within this studio narrative, Yuskavage includes a mimetic version of the original photograph, which is shown taped to the surface of the oversized grayscale painting. The Bad Habits sculpture itself is visible on a pedestal on the right side of the composition.Lisa Yuskavage, Painter Painting, 2024 (detail)“What has remained constant in her career is an extraordinary way with color, a penchant for scenarios that defy interpretation, and a fascination with rendering a particular kind of naked lady.... What Yuskavage ultimately seeks to provoke ... is empathy: for the figure, for the painter, for the victimizer and the victimized, the low and the high, the self who is staring, lost, at the conflagration of color.”—Ariel Levy in “Lisa Yuskavage’s Bodies of Work,” The New Yorker, 2023Lisa YuskavageIn the Company of Models, 2024Oil on linen77 x 70 inches (195.6 x 177.8 cm)InquireLisa Yuskavage, In the Company of Models, 2024 (detail)Installation view, Lisa Yuskavage’s Transference Portrait of My Shrink in Her Starched Nightgown with My Face and Her Hair (1995) and Rorschach Blot (1995), on view in Lisa Yuskavage: The Brood, Rose Art Museum, Waltham, Massachusetts, 2015Lisa Yuskavage and artist Keith Edmier in her studio with the Bad Habits maquettes, 1996. Photographer unknown, courtesy the artistIn the Company of Models (2024) includes a depiction of Yuskavage’s seminal 1995 painting Rorschach Blot, which can be seen leaning against the wall at an angle amid other works in progress. Yuskavage contrasts the lemony-yellow surface of that work with a wall painted in minty greens from which materializes a figure, who is based on an image of her at nineteen years old as a model in art school.This figure’s dress, painted in similar luminous greens, is reminiscent of the starched nightgown worn by the subject in Transference Portrait of My Shrink in Her Starched Nightgown with My Face and Her Hair (1995), the pendant painting to Rorschach Blot. These paired works were first exhibited together at Yuskavage’s 1996 solo exhibition at Christopher Grimes Gallery in Santa Monica—a nod to the artist’s history in Los Angeles. Another imagined version of one of Yuskavage’s Bad Habits sculptures is shown here in profile to the right of another of the artist’s notable figurative motifs, a female nude in beaded panties.Lisa Yuskavage, In the Company of Models, 2024 (detail)“I can’t help but look at the girls—can’t stop myself, any more than they can stop their free-fall into wilder mutations. In this, they reflect back the most disorienting image of self, one fundamental to the act of seeing—not as an intact spectator, but with an unnerving passivity, the very embodiment of visual contemplation.”—Faye Hirsch, art historian and critic, in her catalogue essay for Yuskavage’s 1996 solo exhibition at Christopher Grimes Gallery, Santa MonicaInstallation view, Lisa Yuskavage, David Zwirner, Los Angeles, 2025Lisa YuskavageNight Shift, 2024Oil on wood panel9 x 12 inches (22.9 x 30.5 cm)InquireIn several of the works in this exhibition, Yuskavage extends her meditations on the nature of her work and art making more broadly through the presence of arrays of monochromatic canvases that she frequently depicts propped up against each other in dense groupings. These monochromes at once reference color theory and the artist’s own working process, in which she builds up her compositions from a solid ground, applying layers of paint to achieve the luminosity and distinctive color saturation that are hallmarks of her works.Lisa YuskavagePainter (Kelly Marie), 2024Oil on linen10 x 8 inches (25.4 x 20.3 cm)InquireLisa YuskavageGiant Studio, 2024Oil on wood panel9 x 12 inches (22.9 x 30.5 cm)Inquire“When she started out, figurative painting was out of fashion. Today, it is contemporary art’s most popular genre — and Yuskavage is on top of the art world.”—Julia Halperin in the Financial TimesLisa Yuskavage, Night Shift, 2024 (detail)Lisa Yuskavage, Painter (Kelly Marie), 2024 (detail)Lisa Yuskavage, Giant Studio, 2024 (detail) Lisa YuskavageMorning Classes in New Haven: In the Department of Color Theory, 2024Oil on linen77 x 94 inches (195.6 x 238.8 cm)InquireLisa Yuskavage, Morning Classes in New Haven: In the Department of Color Theory, 2024 (detail)Lisa Yuskavage, Morning Classes in New Haven: In the Department of Color Theory, 2024 (detail)Lisa Yuskavage, Nel’zah’s, 2012 (detail)Lisa Yuskavage, Bonfire, 2013–2015. The Metropolitan Museum of Art, New YorkThe canvas as a visual and narrative device is foregrounded in Morning Classes in New Haven: In the Department of Color Theory (2024), where a cascade of these empty canvases—rendered in cadmiums of all sorts: yellows, golds, tangerines, and salmon pinks—proliferate next to two figures: a crouching model in front of an older model who is standing.Paradoxically, the cadmium-yellow light monochrome square at the front of the group is actually an exposed section of the overall underpainting. Behind the posing models is a large work in progress in jewellike green tones that seems to visually quote from several of the artist’s works from the early 2010s, which show groups of disapproving peasants, or “Nel’zahs.”Lisa YuskavageNotebook (Loved), 2024Oil on linen76 x 80 inches (193 x 203.2 cm)InquireNotebook (Loved) (2024) shows an enlarged sheet of notebook paper that serves as the backdrop for two figures. The paper features a sketch of a woman and a scrawl of text that is cut off by the frame. The incomplete inscription reads: “who was loved ... too much.” An avid archivist, Yuskavage unearthed the page in a notebook of hers from the late 1980s.A sheet from Yuskavage’s notebook, 1989 (detail). Courtesy the artistThe exhibition also features a selection of new and recent smaller paintings, which have been a constant and integral part of Yuskavage’s practice since the mid-1980s. While some are directly related to larger counterparts or sources of inspiration for the works in the show, others are one-of-a-kind compositions that exist only on an intimate scale. As places for exploring color, form, and characters, these small paintings play a remarkably dynamic and protean role within Yuskavage’s oeuvre, continuously inspiring new pictorial developments.Lisa YuskavageKK and Co., 2024Oil on wood panel7 x 5 inches (17.8 x 12.7 cm)InquireLisa YuskavageLittle Embroiderer, 2024Oil on linen8 x 10 inches (20.3 x 25.4 cm)“In these cases Lisa is trying out an idea in all its variations before launching into a large-scale production. Seeing all these explorations of the same image is like being given a chance to sit in on the painting equivalent of a rehearsal.... Working small allows her the opportunity to stay close to the image while painting.”—Tamara Jenkins, writer and director, in her catalogue essay for Lisa Yuskavage: Small Paintings 1993–2004Lisa Yuskavage, Little Embroiderer, 2024 (detail)Lisa Yuskavage, Little Embroiderer, 2024 (detail)Lisa Yuskavage, KK and Co., 2024 (detail)Lisa Yuskavage, KK and Co., 2024 (detail) Lisa YuskavageFives Nudes a Painter and a Pieface, 2024Oil on wood panelDiptych Overall: 12 x 18 inches (30.5 x 45.7 cm)InquireLisa Yuskavage, Five Nudes a Painter and a Pieface, 2024 (detail)Lisa Yuskavage, Chrissy, 2008 (detail)Lisa Yuskavage, Bailey’s Figure Painting Class, 2022 (detail)Notable among these new small-format works are two rare multipanel paintings. In the diptych Five Nudes a Painter and a Pieface (2024), we again see the artist’s motif of a female nude in beaded panties, as well as a reference to “The Motherfucker” in the large painting in the foreground. A small portrait in the right panel quotes from Yuskavage’s Chrissy (2008) and several other works from the 2000s of women who appear to have been hit in their faces with pies, while the woman seated on the chair in the background recalls similar figures from a number of earlier works, including, more recently, Bailey’s Figure Painting Class (2022).Lisa YuskavageEndless Studio, 2024Oil on linenTriptych Overall: 12 x 31 inches (30.5 x 78.7 cm)InquireLisa Yuskavage, The Good, 1995Lisa Yuskavage, Oh, 1995Installation view, Lisa Yuskavage’s Bonfire (2013–2015), on view in Lisa Yuskavage: The Brood, Contemporary Art Museum St. Louis, 2016Endless Studio (2024) is a rare small-format triptych. The left panel shows a number of the artist’s recurring motifs: a nude model holding a teacup, a view of an imagined work that again makes reference to the “Nel’zah's,” and a peacock—a symbol of immortality in Western art history. In the center, there is a self-portrait of Yuskavage in a lab coat, standing above a small canvas that recalls the subject of her 1995 painting Oh. The bonfire visible in the painting-within-a-painting in the right panel invokes a number of similar works from the 2010s and early 2020s.Lisa Yuskavage, Endless Studio, 2024 (detail)Lisa Yuskavage, Endless Studio, 2024 (detail)Lisa Yuskavage, Endless Studio, 2024 (detail) At times playful and harmonious, other times rueful and conflicted, Yuskavage’s rich cast of characters and their varied attributes are layered within compositions built of both representational and abstract elements. With painterly techniques that evoke art-historical precedents alongside motifs inspired by popular culture, her works create an underlying dichotomy between high and low and, by implication, sacred and profane, harmony and dissonance.Lisa YuskavagePeacock Infestation in the Garret, 2024Oil on linen25 x 30 1/8 inches (63.5 x 76.5 cm)“The paintings warp time, folding in and back in themselves spatially, like a wormhole that moves us forward and backward in time.... These paintings offer a complex history made up of personal iconography combined with a bevy of art-historical allusions, meaning that nothing is exactly as it appears. Instead, there is constant vacillation.”—Helen Molesworth, curatorInstallation view, Lisa Yuskavage, David Zwirner, Los Angeles, 2025Inquire about works by Lisa YuskavageGet in Touch"
