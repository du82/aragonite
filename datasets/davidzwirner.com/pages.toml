title = "30 Years of David Zwirner | David Zwirner"
description = "To mark the gallery’s anniversary, a look back at the pivotal artists, exhibitions, and moments in our history that have shaped the art world today."
full_description = "30 YearsofArtistsExhibitionsSpacesBooksEditionsStories30 YearsDavid Zwirner“To mark the gallery’s 30th anniversary and to inaugurate the completion of our new Los Angeles buildings, we are excited to present a very special exhibition that celebrates the artists who have shaped the gallery’s program since its founding. Many of our artists will be in LA for this happy occasion, as we toast to 30 years of exhibitions, books, spaces, and projects, and look forward to all that is to come.” —David ZwirnerLearn More About the Anniversary Exhibition at David Zwirner Los AngelesTomma AbtsNjideka Akunyili CrosbyAnni AlbersJosef AlbersFrancis AlÿsMamma AnderssonDiane ArbusMichael ArmitageLucas ArrudaRuth AsawaKatherine BernhardtHuma BhabhaMichaël BorremansJoe BradleyR. CrumbNoah DavisRaoul De KeyserRoy DeCaravaPhilip-Lorca diCorciaStan DouglasMarlene DumasMarcel DzamaWilliam EgglestonDan FlavinSuzan FreconIsa GenzkenFelix Gonzalez-TorresScott KahnDonald JuddOn KawaraToba KhedooriPaul KleeBarbara KrugerShio KusakaYayoi KusamaSherrie LevineLiu YeNate LowmanKerry James MarshallGordon Matta-ClarkJohn McCrackenEmma McIntyreSarah MichelsonJoan MitchellGiorgio MorandiJuan MuñozOscar MurilloAlice NeelJockum NordströmChris OfiliPalermoRaymond PettibonElizabeth PeytonSigmar PolkeWalter PriceNeo RauchAd ReinhardtJason RhoadesGerhard RichterBridget RileyThomas RuffRobert RymanFred SandbackRaymond SaundersDana SchutzRichard SerraSteven ShearerJosh SmithAl TaylorDiana ThaterWolfgang TillmansRirkrit TiravanijaLuc TuymansAndra UrsuţaMerrill WagnerJames WellingFranz WestDoug WheelerChristopher WilliamsJordan WolfsonRose WylieYun Hyong-keunLisa YuskavagePortia Zvavahera30 YearsofArtists,Exhibitions,Spaces,Books,Editions,StoriesThe Anniversary ShowFrom the start, artists have been at the very center of the gallery’s journey. When David Zwirner opened his doors, in 1993 in SoHo, he met Stan Douglas, Toba Khedoori, Raymond Pettibon, Jason Rhoades, Diana Thater, Luc Tuymans, James Welling, and Franz West in the first year. Three decades later, they are still part of the gallery, among some eighty extraordinary artists and estates who have joined them—from Leipzig, São Paulo, London, Trinidad, and anywhere else in the world where one can make a studio.Explore All ArtistsJason Rhoades (1965–2006), a pivotal figure in the 1990s Los Angeles art scene, at work on his first New York exhibition—and his first show with the gallery—in 1993, our inaugural year.Neo Rauch working in his Leipzig studio in 2021. Video by Uwe Walter.Dana Schutz at work in her studio in New York in 2021. Video by Jason Schmidt.Ruth Asawa (1926–2013), photographed c. 1951 by her close friend and collaborator, the artist Imogen Cunningham. Photograph © Imogen Cunningham Trust. Artwork © 2024 Ruth Asawa Lanier, Inc./Artists Rights Society (ARS), New York.Raymond Pettibon, who has been showing with the gallery since the 1990s, in his studio in New York in 2019. Photo by Jason Schmidt.Njideka Akunyili Crosby, whose first exhibition with the gallery inaugurated our Los Angeles spaces in 2023, in the printmaking studio in her first foray into the medium last year. Photo by Bobby Rogers.Luc Tuymans, one of the first artists to show with the gallery, pictured in his studio in Antwerp in 2020. Photo by Mieke Verbijlen.Yayoi Kusama working in her studio in Tokyo. Excerpt from Yayoi Kusama: Obsesión infinita, 2013, produced on the occasion of the 2013 exhibition Yayoi Kusama: Obsesión infinita, at MALBA in Buenos Aires.Elizabeth Peyton, Portrait at the Opera (Elizabeth), 2016. © Elizabeth Peyton.Franz West (1947–2012) in his bedroom in Vienna in 2006. The artist’s show of assemblages in spring 1993 opened the doors of our first gallery and effectively set the tone for the program to follow. Photo courtesy akg-images/IMAGNO/Didi Sattmann, 2006.Portia Zvavahera in her studio in Harare, Zimbabwe, in 2021. Photo by Gianluigi Guercia.Joan Mitchell (1925–1992) seen in 1983 in her studio in Vétheuil, in the French countryside, where she moved in the late 1960s. © Joan Mitchell Foundation. Photo by Robert Freson, Joan Mitchell Foundation Archives.Chris Ofili pictured in 2015 in his studio in Trinidad, where he moved from London in 2005. Photo by Ian Allen for TIME.Lisa Yuskavage in her Brooklyn studio in 2020. Photo by Jason Schmidt.Oscar Murillo at work in his London studio in 2022. Video by Tim Bowditch, edited by Julian Valderrama.Bridget Riley working in her West London studio in 1983.Suzan Frecon painting in her Upstate New York studio.Stan Douglas, whose video works were shown at the gallery in its first year, filming at Nootka Sound, British Columbia, in 1996.Josef Albers (1888–1976), whose contributions to color theory are still hugely influential, experimenting in his studio. Excerpt from Homage to the Square, 1969, produced and directed by Hans Namuth and Paul Falkenberg. A Chelsea House Publishers Production for University-At-Large Programs, Inc.Anni Albers (1899–1994) at the loom in her weaving studio at Black Mountain College, Lee Hall, Blue Ridge Assembly Campus, North Carolina, in 1937. After emigrating from Germany, where they had taught at the Bauhaus, in 1933, she and Josef founded Black Mountain College’s art department, where Anni taught until 1949. Photo by Helen M. Post. Photo courtesy Western Regional Archives, State Archives of North Carolina.Katherine Bernhardt working on the floor of her studio in St. Louis in 2023. Photo by Whitten Sabbatini.Shio Kusaka at the potter’s wheel in her Los Angeles studio, in 2022. Video by Dustin Pearlman.Marlene Dumas leading a walkthrough of her 2010 exhibition Marlene Dumas: Against the Wall at our West 19th Street gallery in New York. In the background is her 2009 self-portrait The Sleep of Reason.Michaël Borremans in 2020. Photo by Alex Salinas.Huma Bhabha in her studio in Upstate New York. Photo by Daniel Dorsa.Alice Neel (1900–1984) seen at work in an excerpt from the 1978 documentary They Are Their Own Gifts. © Rhodes/Murphy Venture.Emma McIntyre in her Los Angeles studio, in 2023, ahead of her first exhibition with David Zwirner. Photo by Chantal Anderson.Doug Wheeler in his studio in Venice, California, in 1968.Raymond Saunders, 1996. © Jock McDonald, 1996.Raoul De Keyser (1930–2012) visiting a large-scale traveling retrospective of his work at the Renaissance Society, Chicago, in 2001. Courtesy Piet De Keyser.Thomas Ruff in his Düsseldorf studio in 2021. Photo by Juergen Staack.Kerry James Marshall seen in his studio in Chicago, 2016. Photo by Lyndon French.Paul Klee (1879–1940) in his studio, Bern, Switzerland, in 1939. Photo by Felix Klee. Zentrum Paul Klee, Bern, Schenkung Familie Klee. © Zentrum Paul Klee, Bern, Image Archive.Michael Armitage, who lives and works in both Nairobi and London, pictured in 2022. Photo by Tom Jamieson.Rose Wylie in her studio on the upper floor of her cottage in Kent, 2023. Photo by Will Grundy.Gerhard Richter, who joined David Zwirner in 2023 and first showed with the gallery in 1994.Explore All ArtistsWhen he was planning to open his first gallery space, one of the maxims David Zwirner absorbed from the great German gallerist Konrad Fischer was, in effect, “Make every show count.” More than 650 shows later, a testament to that ethos—and to the innovative work of our pioneering artists—is how many works have gone on from our galleries to be shown in museums all over the world.Sign Up for our Exhibition UpdatesInstallation view, Franz West: Investigations of American Art, 43 Greene Street, New York, 1993Installation view, Franz West, Centre Pompidou, Paris, 2018. Photo © Philippe Migeat - Centre PompidouInstallation view, Franz West’s 2 to 2 (do too 2 [too do 2 {to do two}]) (1994), on view in Franz West: Rest, Dia Center for the Arts bookshop, New York, 1994Installation view, Franz West, Centre Pompidou, Paris, 2018. Photo © Philippe Migeat - Centre PompidouInstallation view, Franz West’s 2 to 2 (do too 2 [too do