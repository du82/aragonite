title = "Andra Ursuţa - Artworks & Biography | David Zwirner"
description = "Born in 1979 in Romania, Andra Ursuţa is known for inventive sculptural work that mines the undercurrents of society, drawing from memory and popular culture."
full_description = "SurveyExhibitionsArtist NewsBiographySelected PressInquireAndra UrsuţaAndra Ursuţa (b. 1979) was born in Salonta, Romania, a town on the Romanian-Hungarian border, and left for the United States in 1997. She moved to New York in 1999, and received a BA in art history and visual arts from Columbia University in 2002.Learn MoreSurveyExplore all ArtworksAndra UrsuţaInstallation view, Andra Ursuţa: Joy Revision, David Zwirner, London, 2022Andra UrsuţaInstallation view, Andra Ursuţa, 59 Biennale di Venezia, Venice, 2022Andra UrsuţaPhantom Mass, 2021Lead crystal43 1/2 x 18 1/4 x 20 5/8 inches (110.5 x 46.4 x 52.4 cm)Andra UrsuţaInstallation view, Andra Ursuţa: Void Fill, David Zwirner, Paris, 2021Andra UrsuţaImpersonal Growth, 2020Lead crystal26 3/8 x 21 1/2 x 7 inches (67 x 54.6 x 17.8 cm)Andra UrsuţaHalf-Drunk Mummy, 2019Lead crystal63 x 33 1/2 x 19 inches (160 x 85.1 x 48.3 cm) Installation view, Andra Ursuţa: Nobodies, Ramiken, Brooklyn, New York, 2019Andra UrsuţaPredators 'R Us, 2019Lead crystal29 x 27 x 52 inches (74 x 69 x 132 cm) Installation view, Andra Ursuţa: Nobodies, Ramiken, Brooklyn, New York, 2019Andra UrsuţaSuccubustin' Loose, 2019Lead crystal46 x 18 x 13 inches (117 x 46 x 33 cm) Installation view, Andra Ursuţa: Nobodies, Ramiken, Brooklyn, New York, 2019Andra UrsuţaInstallation view, May You Live In Interesting Times, 58 Biennale di Venezia, Venice, 2019Andra UrsuţaInstallation view, May You Live In Interesting Times, 58 Biennale di Venezia, Venice, 2019Andra UrsuţaInstallation view, Andra Ursuţa: Vanilla Isis, Fondazione Sandretto Re Rebaudengo, Turin, 2019Andra UrsuţaInstallation view, Andra Ursuţa: As I Lay Drying, ICA Miami, 2014–2015 ExhibitionsExplore ExhibitionsView AllArtist NewsExplore Artist NewsAndra Ursuţa Selected for the Fourth Plinth Commission Trafalgar Square, LondonOpening in 2028Read MoreLOST IN THE MOMENT THAT FOLLOWS at Kunsthalle PrahaKunsthalle Praha, Czech RepublicJune 2023Read MoreARS22: Living encounters at KiasmaMuseum of Contemporary Art Kiasma, Helsinki, FinlandApril-October 2022Read More59th Venice Biennale: The Milk of DreamsCentral Pavillion, Venice2022Read MoreSouffler de son souffle at Fondation Vincent van GoghFondation Vincent van Gogh Arles, FranceNovember 2021 - April 2022Read MoreDavid Zwirner to represent Andra UrsuţaJuly 2020Read More58th Venice Biennale: May You Live In Interesting TimesCentral Pavilion, VeniceMay-November 2019Read MoreAndra Ursuța in Emissaries for Things Abandoned by Gods at Casa Luis BarraganCasa Luis Barragan, Mexico City, Mexico2019Read More BiographyDownload Full CVAndra Ursuţa (b. 1979) was born in Salonta, Romania, a town on the Romanian-Hungarian border, and left for the United States in 1997. She moved to New York in 1999, and received a BA in art history and visual arts in 2002 from Columbia University, New York.The DESTE Foundation for Contemporary Art will open a solo exhibition dedicated to Ursuţa on June 24, 2025, at their Slaughterhouse Project Space in Hydra, Greece. From 2018 to 2019, a solo exhibition of the artist’s work, Vanilla Isis, was presented at the Fondazione Sandretto Re Rebaudengo, Turin, Italy. Alps, which was on view in 2016 at the New Museum, marked the artist’s first museum show in New York. Ursuţa’s work has been the subject of numerous solo exhibitions at prominent venues internationally, including Kunsthalle Basel (2015); Institute of Contemporary Art, Miami (2014–2015); Hammer Museum, Los Angeles (2014); Kölnischer Kunstverein, Cologne, Germany (2014); and Peep-Hole Art Center, Milan (2014).Ursuţa’s work has also been included in important group exhibitions worldwide, such as the 59th Venice Biennale (2022); ARS22: Living Encounters, Museum of Contemporary Art Kiasma, Helsinki, Finland (2022); Souffle de son souffle, Fondation Vincent van Gogh Arles, France (2021­–2022); 58th Venice Biennale (2019); The Warmth of Other Suns: Stories of Global Displacement, The Phillips Collection, Washington, DC (2019); The Trick Brain, Aïshti Foundation, Beirut (2017–2018); 15th Istanbul Biennial (2017); High Anxiety: New Acquisitions, Rubell Family Collection, Miami (2016–2017); 13th Lyon Biennale (2015–2016); Artists and Poets, Secession, Vienna (2015); Busted, The High Line, New York (2013–2014); 55th Venice Biennale (2013); Expo 1: New York, MoMA PS1, New York (2013); and Ostalgia, New Museum, New York (2011).In 2024, a sculpture by Ursuța was selected to be installed as the Fourth Plinth Commission in London's Trafalgar Square. The sculpture will be on view from 2028 through 2030.Ursuţa has been represented by David Zwirner since 2020, and her first solo exhibition with the gallery, Void Fill, was on view at David Zwirner, Paris, in 2021. In 2022, she received a solo exhibition, Joy Revision, at David Zwirner, London. Ursuţa’s work was included in the group exhibition 20/20, held at the gallery’s West 20th Street location in New York in 2020, and in the group exhibition Vessels, held at the gallery’s London location in 2022.The artist’s work is held in public collections worldwide, including the Aïshti Foundation, Beirut; DESTE Foundation for Contemporary Art, Athens; Fondazione Sandretto Re Rebaudengo, Turin, Italy; Hammer Museum, Los Angeles; Institute of Contemporary Art, Miami; Posten Moderne Kunstmuseum (PoMo), Trondheim, Norway; Rubell Museum, Miami; Tate, United Kingdom; and the Walker Art Center, Minneapolis. Ursuţa lives and works between London and New York.Download Full CVSelected PressExplore Selected Press‘Everywoman’ And Horse Sculptures Chosen For Display At London’s Fourth PlinthThe Guardian, announcement by Nadia Khomami2024Read MoreNew Sculptures Unveiled For Trafalgar Square's Fourth PlinthThe Evening Standard, article by Robert Dex2024Read MoreOtto Dix / Andra UrsuţaThe New Yorker, review by Johanna Fateman2021Read MoreWhat to See Right Now in New York Art GalleriesThe New York Times, review by Jason Farago2019Read MorePeer Inside the Otherworldly Studio of Andra Ursuţa, a Sculptor Who Transforms Horror-Movie Props Into Eerie TotemsArtnet News, interview by Taylor Dafoe2019Read MoreAggressive Masculinity and Radical Politics: How Extremism Has Emerged as the Teenage Rebellion of Choicefrieze, review by Hettie Judah2018Read MoreRequest more informationGet In Touch"
