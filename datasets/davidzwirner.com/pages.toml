["https://davidzwirner.com/news/2024/barbara-kruger-no-comment"]
title = "Barbara Kruger: No Comment | David Zwirner"
description = "No Comment presents Barbara Kruger's most iconic works."
full_description = "ARoS Aarhus Art Museum, Aarhus, DenmarkNovember 29, 2024–April 21, 2025One of the most influential artists of our time, Barbara Kruger grapples with power dynamics, gender, identity, late capitalism, and the mass media in her first survey exhibition in Scandinavia.No Comment presents Barbara Kruger's most iconic works; her early paste-ups; large-scale vinyl wall and floor installations; multi-channel and single channel video; soundscapes; and large scale LED, together with brand new site-specific text-based vinyl works. All vinyl works in this unique exhibition are customized to ARoS's architectureBy skillfully harnessing the seductive power of advertising, Barbara Kruger combines images drawn from mass-media with concise, authoritative language to question social and power relations.As part of the exhibition, Barbara Kruger will dress a number of Aarhus Lightrail carriages with her works. The exhibition also includes soundscapes, not only in the exhibition galleries but also the bathrooms and gift shop.For over 40 years, Kruger’s astute observations of society have reflected, and critically examined, our contemporary condition.“It would be great if my work became archaic, if the issues that they try to present, the commentary that I'm trying to suggest was no longer pertinent. Unfortunately, that is not the case at this point.”–Barbara Kruger.Learn more at ARoS."
