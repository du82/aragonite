["https://davidzwirner.com/exhibitions/2025/julius-eastman-glenn-ligon-evil-nigger"]
title = "Julius Eastman & Glenn Ligon: Evil Nigger | New York: 52 Walker | January 24—March 22, 2025  | David Zwirner"
description = "52 Walker is pleased to announce its fourteenth exhibition, pairing works by experimental composer and musician Julius Eastman (1940–1990) and celebrated New York–based artist Glenn Ligon (b. 1960). Titled Evil Nigger after a notable 1979 piano composition by Eastman (who was known to give his works intentionally challenging names), the show is conceived in close partnership with Eastman’s estate."
full_description = "ExhibitionJulius Eastman & Glenn Ligon: Evil NiggerWant to know more?InquireNow OpenJanuary 24—March 22, 2025Opening ReceptionFriday, January 24, 6–8 PMLocationNew York: 52 Walker52 Walker StreetNew York, New York 10013Tue, Wed, Fri, Sat: 10 AM-6 PMThu: 12 PM-8 PMArtistsJulius EastmanGlenn LigonView Press ReleaseJulius Eastman, Evil Nigger, 1979. Copyright © 2018 by Music Sales Corporation (ASCAP) and Eastman Music Publishing Co. (ASCAP)52 Walker is pleased to announce its fourteenth exhibition, pairing works by experimental composer and musician Julius Eastman (1940–1990) and celebrated New York–based artist Glenn Ligon (b. 1960). Titled Evil Nigger after a notable 1979 piano composition by Eastman (who was known to give his works intentionally challenging names), the show is conceived in close partnership with Eastman’s estate. Grounded in Eastman and Ligon’s shared affinity as artists and individuals, this exhibition draws on their complementary interests in authorial voice—in particular, the perilous slippage of context and intent that occurs when language is transmitted and received—as well as their ability to construct meaning through strategies of repetition, obfuscation, and improvisation. On view will be a work based on Eastman’s final unpublished musical score and an expansive installation by Ligon that comprises neon sculptures and paintings and speaks to Eastman’s compelling musical reflections on voice and visibility. In keeping with Ligon’s incisive body of text-based works—which are often rendered in materials such as neon, oil stick, and coal dust—the installation will plumb themes of identity, culture, and the construction of race.Learn more at 52walker.com"
