full_description = '''SurveyExhibitionsArtist NewsBiographySelected PressBooksInquireDiana ThaterSince emerging in the early 1990s, Diana Thater (b. 1962) has pioneered the use of film, video, light, and sound, continually challenging the boundaries of time-based media and installation art. Her work explores the relationship between the natural and man-made worlds while critically examining the structures of mediated reality.Learn MoreSurveyExplore all ArtworksDiana ThaterPractical Effects, 2022Installation of one (1) tent, five (5) projectors, five (5) media players, and six (6) DMX lights 13 min 5 sec, silentOverall dimensions variableDiana ThaterA Wild Kingdom, 2023Digital video projection on existing architectureOverall dimensions variableDiana ThaterChernobyl, 2011Six (6) projectors, six (6) media players, and Lee filtersDimensions variable with installationDiana Thaterknots + surfaces Version #1, 2001Five (5) video projectors, sixteen (16) videowall monitors, six (6) DVD players, one (1) synchronizer, and six (6) DVDsOverall dimensions variableDiana ThaterDelphine, 1999Four (4) video projectors, eighteen (18) video monitors, six (6) media players, and two (2) video wall controllersOverall dimensions variableDiana ThaterThe best animals are the flat animals, 1998One (1) LCD video projector, two (2) 3-lens video projectors, one (1) video monitor, false wall, existing architecture, four (4) laserdisc players, window gelsOverall dimensions variableDiana Thater"China", 1995Six (6) laserdiscsOverall dimensions variableDiana ThaterTrue Life Adventures, 2018Digital video projection on existing architectureOverall dimensions variableDiana ThaterLife is a Time-Based Medium, 2015Three (3) video projectors, one (1) Watch-Out system, and one (1) media playerOverall dimensions variableDiana ThaterBetween Science and Magic, 2010Two (2) 16mm films, two (2) modified Eiki RT-0 projectors with custom loopers, and speakersDimensions variableDiana ThaterWhite is the Color, 2002Two (2) video projectors, two (2) media players, and one (1) single 48" tube fluorescent light fixtureOverall dimensions variableDiana Thatergorillagorillagorilla, 2009Ten (10) video projectors, two (2) videowalls, twelve (12) DVD players, Lee filters, and existing architectureOverall dimensions variable ExhibitionsExplore ExhibitionsView AllArtist NewsExplore Artist NewsDiana Thater: Chernobyl ReduxLUMA Westbau, Zürich, SwitzerlandSeptember 27, 2024–January 19, 2025Read MoreDiana Thater: Practical Effects LUMA Arles, FranceJune 1, 2024–2025Read MoreYes, there will be singing: Closing PerformanceNovember 28, 2020Read MoreNewsDialogues: Diana Thater and Rachel Rose2020Read MoreDiana Thater: A Runaway WorldGuggenheim BilbaoNovember 2018Read MoreDiana Thater at the ICA WatershedInstitute of Contemporary Art, BostonJuly 4–October 8, 2018Read MoreDiana Thater: The Sympathetic ImaginationLACMA, Los AngelesNovember 22, 2015–April 17, 2016Read More BiographyDiana Thater in Chernobyl. Photo by Volodymyr Palylyk, 2010View Artist WebsiteDownload Full CVSince emerging in the early 1990s, Los Angeles–based artist Diana Thater (b. 1962) has pioneered the use of film, video, light, and sound, continually challenging the boundaries of time-based media and installation art. Her work explores the relationship between the natural and man-made worlds while critically examining the structures of mediated reality. Drawing on a wide variety of sources, including literature, animal behavior sciences, mathematics, chess, and sociology, her evocative works directly engage their surroundings, producing an intricate relationship between time and space.Born in San Francisco, Thater studied Art History at New York University, before receiving her MFA from the Art Center College of Design in Pasadena, California.The artist’s work has been represented by David Zwirner since 1993. A solo exhibition of Thater's work, Practical Effects, was on view at the gallery’s New York location in 2022. Yes, there will be singing was a sound, video, and light piece which could be experienced digitally via David Zwirner Offsite in 2020. In 2015, Science, Fiction marked Thater’s eighth solo exhibition with the gallery in New York. Previous solo presentations of the artist’s work at David Zwirner, New York, include Chernobyl (2012), Between Science and Magic (2010), Here is a text about the world... (2008), New Work (2005), the sky is unfolding under you (2001), China, Crayons & Molly Numbers 1 through 10 (1996), and Late & Soon (Occident Trotting) (1993).In June 2024, a solo exhibition of Thater’s work, Practical Effects, opened at LUMA Arles, France. In 2018, a solo presentation of the artist’s work was held at the new ICA Watershed, Boston. In 2017, the solo show A Runaway World was first exhibited at The Mistake Room, Los Angeles, and later traveled to Borusan Contemporary, Istanbul, and the Guggenheim Bilbao, Spain. In 2015, a comprehensive mid-career survey of her work, The Sympathetic Imagination, was organized by the Los Angeles County Museum of Art and later traveled to the Museum of Contemporary Art Chicago.Over the past decade, Thater’s work has been the subject of solo exhibitions at prominent institutions that include the Aspen Art Museum, Colorado (2015); San Jose Museum of Art, California (2015); Institute of Modern Art, Brisbane (2011); Santa Monica Museum of Art, California (2010); Kunsthaus Graz, Austria (2009); Natural History Museum, London (2009); Kunsthalle Bremen, Germany (2004); Museum für Gegenwartskunst Siegen, Germany (2004); Dia Center for the Arts, New York (2001); and Secession, Vienna (2000).In 2018, the artist was awarded an Art + Technology Lab Grant from the Los Angeles County Museum of Art. Other notable awards and fellowships include a California Community Foundation Fellowship for Visual Artists (2014), as well as an award for artistic innovation from the Center for Cultural Innovation, Los Angeles (2011), a James D. Phelan Award in Film and Video (2006), a John Simon Guggenheim Memorial Foundation Fellowship (2005), and a National Endowment for the Arts Fellowship (1993).Work by the artist is represented in museum collections worldwide, including the Art Gallery of Ontario, Toronto; The Art Institute of Chicago; Berkeley Art Museum and Pacific Film Archive, University of California; The Broad, Los Angeles; Carnegie Museum of Art, Pittsburgh; Castello di Rivoli Museo d’Arte Contemporanea, Turin; Centre national des arts plastiques, Puteaux, France; CU Art Museum, University of Colorado, Boulder; Fonds Régional d’Art Contemporain (FRAC) Rhône-Alpes, Institut d’art contemporain, Villeurbanne, France; Friedrich Christian Flick Collection, Hamburger Bahnhof - Museum für Gegenwart, Berlin; Hirshhorn Museum and Sculpture Garden, Washington, DC; Kunsthalle Bremen, Germany; Kunsthaus Zürich, Switzerland; Los Angeles County Museum of Art; Montreal Museum of Fine Arts; Musée d’Art Moderne et Contemporain de Strasbourg, France; Museum Ludwig, Cologne; The Museum of Contemporary Art, Los Angeles; Museum of Contemporary Art San Diego, California; Museum für Gegenwartskunst Siegen, Germany; National Gallery of Canada, Ottawa; Orange County Museum of Art, Newport Beach, California; Pinault Collection, Paris; Portland Art Museum, Oregon; Sammlung Falckenberg, Deichtorhallen Hamburg; Santa Barbara Museum of Art, California; San Jose Museum of Art, San Jose, California; Solomon R. Guggenheim Museum, New York; Stedelijk Museum, Amsterdam; Musée d’art moderne et contemporain, Strasbourg, France; The Museum of Modern Art, New York; Thyssen-Bornemisza Art Contemporary, Vienna; Vancouver Art Gallery; Walker Art Center, Minneapolis, Minnesota; and the Whitney Museum of American Art, New York. Also a prolific writer, educator, and curator, Thater lives and works in Los Angeles.View Artist WebsiteDownload Full CVSelected PressExplore Selected PressDiana Thater Monkeys Around With Our Future At David Zwirner In New YorkThe Art Newspaper, review by Linda Yablonsky2022Read MoreWhat Makes Artist-Run Spaces FlourishFrieze, conversation with Brian Butler, Sarah Lehrer-Graiwer and Diana Theater2021Read MoreThe Time and Space of Isolation: Diana Thater InterviewedBOMB Magazine, interview by Joey Orr2020Read MoreFor High-End Galleries, It’s a Season of Upended ExhibitionsThe New York Times, special report by Tess Thackara2020Read MoreThe ICA Will Open its East Boston Location on July 4Boston Magazine, article by Spencer Buell2018Read MoreIn an East Boston Shipyard, a Watershed Idea for ArtThe New York Times, review by Hilarie M. Sheets2018Read MoreSelected TitlesExplore BooksArtCenter Talks: Graduate SeminarThe First Decade 1986–1995 David Zwirner Books / ArtCenter Graduate Press$39.95Diana Thater: The Sympathetic ImaginationPrestel$65...drawling, stretching and fainting in coils... Request more informationGet In Touch'''
