["https://davidzwirner.com/podcast"]
title = "Dialogues: The David Zwirner Podcast | David Zwirner"
description = "What we talk about when we talk about art. Exceptional makers and thinkers across art, literature, film, fashion, music, and more come together to talk about what it means to make things today."
full_description = "DialoguesThe David Zwirner PodcastListen on:Apple Podcast IconApple PodcastsSpotify Podcast IconSpotifyGoogle Podcast IconGoogle PodcastsStitcher Podcast IconStitcherOvercast Podcast IconOvercastMicrophone IconSpecial Episode | On Richard Serra with Hal FosterNovember 21, 2024Art historian and critic Hal Foster joins Helen for a live conversation on Richard Serra (1938–2024) at David Zwirner New York. They discuss Foster’s decades-long engagement with Serra’s work and the artist’s enduring legacy. This conversation was taped in Every Which Way, a major Richard Serra installation from 2015, on view at David Zwirner’s 20th Street gallery in New York from November 8–December 14, 2024.Listen nowNewest EpisodesMicrophone IconThe Art of Rivalry with Wesley MorrisFebruary 26, 2025Pulitzer Prize-winning New York Times critic Wesley Morris comes on the podcast to unpack the long history and current state of artistic rivalries, from Leonardo daVinci and Michelangelo to Drake and Kendrick Lamar.Listen nowMicrophone IconThe Unconstitutional War on Trans PeopleFebruary 18, 2025Helen Molesworth hosts a special episode, starting with a conversation with leading ACLU lawyer Chase Strangio and followed by an interview with artist Laurie Simmons and activist Maryhope Howland.Listen nowMicrophone IconThe Best Art Exhibitions of The Century (So Far) | with Steve LockeDecember 18, 2024As we turn the page on a quarter century, Helen Molesworth and the artist Steve Locke look back with a highly opinionated list of their favorite art shows of the last 25 years.Listen NowMicrophone IconHas Contemporary Art Lost Its Edge?December 4, 2024Helen Molesworth speaks to Dean Kissick, author of The Painted Protest, a polemic piece on the state of contemporary art in this month’s Harper’s Magazine that has had a lot in the art world talking.Dean Kissick is a writer, contributing editor of Spike Art Magazine, and a director of Earth.Listen NowMicrophone IconThe Problem of Taste: On the Late, Great Dave Hickey with Jarrett EarnestOctober 16, 2024Writer, curator, and editor Jarrett Earnest joins Helen to discuss his most recent edited volume of writings by the iconoclastic, enduring art critic Dave Hickey, titled Feint of Heart: Art Writings, 1982-2002. Out now from David Zwirner Books, wherever books are sold.Listen NowMicrophone IconGrace Wales Bonner and Horace BallardApril 23, 2024Acclaimed fashion designer and curator Grace Wales Bonner is joined by the scholar and curator Horace D. Ballard. In a wide ranging conversation on art and fashion, they unpack the nuances of style, medium, and intentionality in art.Listen NowMicrophone IconOn Hilma af Klint with Julia Voss and Briony FerMarch 5, 2024An episode on the art and life of Hilma af Klint featuring art historian Briony Fer and af Klint’s biographer, Julia Voss.Listen NowMicrophone IconOn VermeerFebruary 6, 2024Was Vermeer really the artist behind some of his most well-known works? Listen Now Most PopularMicrophone IconDoug Wheeler and Vija CelminsListen NowMicrophone IconJordan Wolfson x BeepleListen NowMicrophone IconCriticism for Difficult TimesListen NowMicrophone IconInside ‘The Red Studio’: Ann Temkin with 6 Artists on Matisse Listen NowMicrophone IconHelen Molesworth and Benjamin H.D. Buchloh on Gerhard RichterListen NowMicrophone IconThe Legacy of Ruth AsawaListen NowStay up to date on new podcast episodesSubscribe"
