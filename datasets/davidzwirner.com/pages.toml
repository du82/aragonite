full_description = "SurveyExhibitionsArtist NewsBiographySelected PressBooksInquireAnni AlbersKnown for her pioneering graphic wall hangings, weavings, and designs, Anni Albers (née Annelise Fleischmann; 1899–1994) is considered one of the most important abstract artists of the twentieth century, as well as an influential designer, printmaker, and educator. Across the breadth of her career, she combined a deep and intuitive understanding of materials and process with her inventive and visually engaging exploration of form and color.Learn MoreExhibitionAffinities: Anni Albers, Josef Albers, Paul KleeNew York: 20th StreetComing Soon: March 13—April 19, 2025Learn MoreSurveyExplore all ArtworksAnni AlbersOrchestra, 1979Photo offset17 3/4 x 16 3/4 inches (45.1 x 42.5 cm)Anni AlbersDI-I, 1978Gouache on paper11 x 9 inches (27.9 x 22.9 cm)Anni AlbersStudy for Triangulated Intaglio III, 1976Ink on pencil graph paper12 7/16 x 11 7/16 inches (31.6 x 29.1 cm)Anni AlbersDR XV B, 1974Ink on paper15 1/8 x 22 7/16 inches (38.4 x 57 cm)Anni AlbersStudy for DO II, 1973Gouache on blueprint paper18 1/4 x 18 1/2 inches (46.4 x 47 cm)Anni AlbersFox II, 1972Photo offset20 x 20 inches (50.8 x 50.8 cm)Anni AlbersRed Meander II, 1970-1971Screenprint28 x 24 inches (71.1 x 61 cm)Anni AlbersUntitled, n.d.Felt-tip pen on tracing paper11 5/8 x 9 inches (29.5 x 22.8 cm) Framed: 14 5/8 x 12 5/8 inches (37.1 x 32.1 cm)Anni AlbersColor study, c. 1970Gouache and diazotype paper19 x 17 inches (48.3 x 43.2 cm) Framed: 21 1/2 x 19 1/2 inches (54.6 x 49.5 cm)Anni AlbersTR I, 1970Three-color aluminum plate lithograph on special Arjomari paperImage: 14 x 16 inches (35.6 x 40.6 cm) Sheet: 19 3/4 x 21 5/8 inches (50.2 x 54.9 cm) Framed: 22 3/4 x 22 3/4 inches (57.8 x 57.8 cm)Anni AlbersStudy for A, 1968Gouache on blueprinted graph paper17 3/8 x 13 15/16 inches (44.1 x 35.4 cm)Anni AlbersStudy for Camino Real, 1967Gouache on graph paper17 1/2 x 16 inches (44.5 x 40.6 cm) ExhibitionsExplore ExhibitionsView AllArtist NewsExplore Artist NewsJosef and Anni Albers: Iconic Couple of ModernismVilla Empain, Boghossian Foundation, BrusselsApril 4–September 8, 2024Read MoreAnni Albers: In Thread and On Paper Blanton Museum of Art, The University of Texas at AustinFebruary 11–June 30, 2024Read MoreAnni and Josef AlbersKunstmuseum Den Haag, the HagueOctober 2022Read MoreAnni Albers: Work With MaterialsSyracuse University Art MuseumAugust 2022Read MoreYou can go anywhere: Josef & Anni Albers Foundation at 50The Josef and Anni Albers FoundationApril 2022Read MoreFirst Exhibition in France Dedicated to Anni and Josef Albers Musée d’Art Moderne de ParisCentre Pompidou, ParisSeptember 2021Read MoreThe Josef and Anni Albers FoundationRead MoreIn Thread and On Paper: Anni Albers in ConnecticutNew Britain Museum of American ArtMarch 2020Read MoreAnni Albers in Group Exhibition at the Art Institute of ChicagoArt Institute of ChicagoSeptember 2019Read MoreAnni Albers in Weaving beyond the BauhausArt Institute of ChicagoAugust 2019Read More BiographyView Artist WebsiteDownload Full CVKnown for her pioneering graphic wall hangings, weavings, and designs, Anni Albers (née Annelise Fleischmann; 1899–1994) is considered one of the most important abstract artists of the twentieth century, as well as an influential designer, printmaker, and educator. Across the breadth of her career, she combined a deep and intuitive understanding of materials and process with her inventive and visually engaging exploration of form and color. Born in Berlin, she studied weaving at the Bauhaus beginning in 1922, eventually joining the faculty in 1929. Her innovative textiles from this period, at once functional and aesthetic, were the first to combine avant-garde geometric abstractions with weaving. Albers was deeply influenced by pre-Columbian art and textiles, which she encountered on trips to Mexico during her time teaching at Black Mountain College between 1933 and 1949. She went on to employ long-forgotten techniques discovered through her in-depth study and collection of these works, leading eventually to the creation of her pictorial weavings of the 1950s. After 1963, she largely moved away from weaving to focus on printmaking and drawing as well as a select number of commissions that likewise engaged her singular approach to composition, creating numerous abstract motifs that—like her weavings—set up a dynamic play between figure and ground.In 1933, Albers and her husband Josef emigrated to North Carolina, where they founded the Black Mountain College art department. At Black Mountain College, she elaborated on the technical innovations she devised at the Bauhaus, developing a specialized curriculum that integrated weaving and industrial design. It was during this time that she began to avidly collect Pre-Columbian art, in particular textiles. In 1949, she became the first designer to have a one-person show at The Museum of Modern Art, New York; the exhibition Anni Albers: Textiles subsequently traveled to 26 venues throughout the United States and Canada. Following the couple’s move to New Haven, Connecticut, in 1950, Anni Albers shifted her focus primarily to her workshop, spending the 1950s creating mass-reproducible fabrics (including a commission from Walter Gropius for Harvard University), writing, and developing her “pictorial weavings,” culminating in the exhibition Anni Albers: Pictorial Weavings at the MIT New Gallery, Cambridge, Massachusetts, in 1959. The show traveled to Carnegie Institute of Technology, Pittsburgh; Baltimore Museum of Art; Yale University Art Gallery, New Haven; and Contemporary Arts Museum, Houston.In 1963, Albers added printmaking to her artistic repertoire, working primarily in this medium from that point on. Her prints have been featured in numerous exhibitions worldwide, including Anni Albers: Bildweberei, Zeichnung, Druckgrafik at the Kunstmuseum Düsseldorf in 1975, which traveled to the Bauhaus-Archiv, Berlin. A retrospective exhibition on the 100th anniversary of her birth in 1999, organized by The Josef and Anni Albers Foundation and the Peggy Guggenheim Collection, Venice, traveled to the Josef Albers Museum, Bottrop; the Musée des Arts Décoratifs, Paris; and the Jewish Museum, New York.The artist’s seminal book On Weaving, published in 1965, helped to establish design studies as an area of academic and aesthetic inquiry and solidified her status as the single most influential textile artist of the twentieth century. Her writings on design, first published as On Designing in 1959, were reissued in 2000.In 2017, the Guggenheim Museum Bilbao presented Anni Albers: Touching Vision, an in-depth survey of the artist’s work. The Kunstsammlung Nordrhein-Westfalen in Düsseldorf organized an exhibition of Albers’s work in 2018, which traveled to the Tate Modern in London. In 2019, the two-person exhibition, Paul Klee and Anni Albers, was presented at the San Francisco Museum of Modern Art. Anni and Josef Albers: Art and Life was on view at the Musée d'Art Moderne de Paris, in 2021, and subsequently traveled to IVAM (Instituto Valenciano de Arte Moderno), Valencia, Spain, in 2022. The solo exhibition Anni Albers: Work with Materials was on view at the Syracuse University Art Museum, New York, in 2022, and in the same year, Anni en Josef Albers was presented at the Kunstmuseum Den Haag, The Hague, the Netherlands. In 2024, the Blanton Museum of Art, Austin, presented Anni Albers: In Thread and On Paper.Since May 2016, The Josef and Anni Albers Foundation has been exclusively represented by David Zwirner. The gallery’s first solo presentation of Anni Albers’s work was on view in 2019, coinciding with the centennial anniversary of the founding of the Bauhaus.Work by Albers is held in important public and private collections worldwide.View Artist WebsiteDownload Full CVSelected PressExplore Selected PressThe women of the Bauhaus who rethought the world—and were forgottenDocument, feature by Ann Binlot2019Read MorePeter Chappell on Anni Albers at the Tate ModernThe Guardian, review by Peter Chappell2019Read MoreAnni Albers review – ravishing textiles that beg to be touchedThe Guardian, review by Adrian Searle2018Read MoreAt Tate Modern, an Anni Albers RetrospectiveThe New York Times, review by Farah Nayeri2018Read MoreAnni AlbersArtforum, cover story by Lynne Cooke2018Read MoreAnni Albers’s Thoughts on Textiles Loom LargeHyperallergic, book review by Becky Peterson2018Read MoreSelected TitlesExplore BooksAnni Albers: Camino RealDavid Zwirner Books$55Anni AlbersTate Publishing$50Anni Albers: Notebook 1970–1980David Zwirner Books$40Anni Albers: On WeavingNew Expanded EditionPrinceton University Press$49.95You can go anywhere: Josef & Anni Albers Foundation at 50Josef and Anni Albers Foundation$71.50 Request more informationGet In Touch"
