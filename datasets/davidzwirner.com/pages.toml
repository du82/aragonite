title = "Fred Sandback: Threading Space | David Zwirner"
description = "David Zwirner is an art gallery with locations in New York, Los Angeles, London, Paris and Hong Kong. We present physical and online exhibitions, podcasts, books, and more."
full_description = "MAC/CCB Museum of Contemporary Art, Lisbon, PortugalOctober 24, 2024–March 9, 2025Fred Sandback: Threading Space explores the full spectrum of the renowned American artist’s work in an unprecedented solo exhibition in Portugal. Over more than 35 years, Sandback created a vibrant oeuvre based on economy and stillness, using materials associated with the domestic and feminine in line with—but also in contrast to—his post-minimalist contemporaries. In addition to his well-known small- and large-scale sculptures, the exhibition will include lesser-known aspects of his production, such as drawings, prints, wood reliefs, and text works.Stripped of any excess material, Sandback’s sculptures derive their power from the minimum, exuding rigor and lightness. They are arrangements of common acrylic yarn that combine drawing and construction. It is by the integration with their environment that they are made manifest.Threading Space is curated by Lilian Tone.Learn more at MAC/CCB."
