["https://davidzwirner.com/hongkong"]
title = "David Zwirner 卓納畫廊 | David Zwirner | David Zwirner"
description = "卓納畫廊是國際當代藝術畫廊，在紐約、倫敦、巴黎、香港均設有空間。1993年創立至今，畫廊舉辦了眾多創新、前瞻的展覽，活躍於一級及二級藝術市場。畫廊致力培育藝術家職業發展，目前代理了近八十位在世和已故藝術家，其中許多已是藝術史上巨擘，或已享譽世界。"
full_description = "David Zwirner 卓納畫廊卓納畫廊始終是為各種藝術媒介與門類舉辦革新、獨特、先鋒性的展覽的所在地，促進了今天許多最具影響力的藝術家們的事業，並且長期地代理眾多國際藝術家們的作品。畫廊目前共代理超過八十位藝術家及藝術家遺產基金會的作品。迄今為止，卓納畫廊在全球共設有12個空間，包括：紐約、倫敦、巴黎、香港和洛杉磯。 掃描二維碼，關注畫廊微信公眾號和查閱藝術家簡介開放時間 卓納畫廊香港空間現已開放給公眾 香港中環皇后大道中80號 （H Queen’s 5–6F） 週二至週六 （11:00–19:00） 如有任何問題，歡迎致函 hongkong@davidzwirner.com魯斯·阿薩瓦：向手作而生2024年11月19日–2025年2月22日「我研究大自然，我的許多形式都來自對植物的觀察。我潛心觀看自然，並只是按照所看到的去創作。我會在紙上畫畫，然後我拿起一根金屬絲線，讓它進入空氣中，由它定義空間，而無需從任何人那裏竊取甚麼。」 ——魯斯·阿薩瓦卓納畫廊欣然宣佈在香港空間舉辦美國藝術家魯斯·阿薩瓦（Ruth Asawa，1926-2013）的雕塑及紙本作品展。這是阿薩瓦在大中華地區的首場個展，概述性地呈現了她開闊的藝術實踐，尤其聚焦於她對自然世界的熱愛——這為她的藝術提供了源源不斷的靈感源泉。在微信上探索更多斯科特·卡恩：藍月難逢2024年11月19日–2025年2月22日卓納畫廊欣然於香港空間呈現美國藝術家斯科特·卡恩（Scott Kahn）的展覽。 《藍月難逢》將呈現一組全新的繪畫，它們聚焦不同類型的滿月及其蘊含的豐富內涵，並將之作為核心的構圖元素。展覽還將呈現卡恩職業生涯中的數件精選風景作品，其中不少也囊括了月亮，它們常在背景中若隱若現，彷彿凝結成了下方場景的某種徵兆。這些作品共同地體現了藝術家對風景這一門類的獨特處理方式。這將是卡恩在亞洲的首展，也是自2024年5月卓納畫廊宣布代理以來的首場畫廊個展。在微信上探索更多阿馬德奧·盧西亞諾·洛倫薩托2024年9月12日–11月9日身為巴西同時代人中最傑出的藝術家之一，阿馬德奧·盧西亞諾·洛倫薩托（Amadeo Luciano Lorenzato, 1900-1995）對家鄉貝洛奧里藏特（Belo Horizonte）的日常生活進行細緻入微的觀察，並以此為核心創作了大量獨特的繪畫，包括城市裏的貧民窟、半都市化的景觀，以及農業、農村、工業的場景。洛倫薩托的構圖獨樹一幟，其色彩豐富的自製顏料，由他用刷子、梳子和叉子塗抹，由此呈現出精簡的幾何形狀以及紋理密集的畫面。洛倫薩托的布面作品充滿着自信且自由的表達，精湛地捕捉了藝術家周圍環境的活力以及自然世界的色彩和紋理。在微信上探索更多藝術家/Artists托馬·阿布茨尼基德卡·阿庫衣·克洛斯比安妮·阿爾伯斯約瑟夫·阿爾伯斯弗朗西斯·埃利斯瑪瑪·安德森黛安·阿巴斯邁克爾·艾爾米塔什盧卡斯·阿魯達魯斯·阿薩瓦凱瑟琳·伯恩哈特胡瑪·芭芭米凱爾·博伊曼斯喬·布萊德利羅伯特·克魯伯諾亞·戴維斯拉烏爾·德·凱澤羅伊·德卡拉瓦菲利普-洛卡·迪克西亞斯坦·道格拉斯馬琳·杜馬斯馬塞爾·扎馬威廉·埃格爾斯頓丹·弗萊文蘇珊·弗雷孔伊薩·根澤肯費利克斯·岡薩雷斯-托雷斯薩沙·戈登唐納德·賈德斯科特·卡恩河原溫托巴·基多里保羅·克利芭芭拉·克魯格日下翅央草間彌生謝麗·利文劉野奈特·婁曼維克多·曼克里·詹姆斯·馬歇爾戈登·馬塔-克拉克約翰·麥克拉肯艾瑪·麥金泰爾莎拉·邁克爾森瓊·米歇爾喬治·莫蘭迪胡安·穆諾茲奧斯卡·穆里略愛麗絲·尼爾喬克姆·諾德思特洛姆克里斯·奧菲利巴勒莫雷蒙德·帕提伯恩伊麗莎白·佩頓西格瑪·波爾克沃爾特·普萊斯尼奧·勞赫艾德·萊茵哈特傑森·羅德斯格哈德·里希特布里奇特·賴利托馬斯·魯夫羅伯特·萊曼弗瑞德·桑德貝克雷蒙德·桑德斯戴納·舒茨理查德·塞拉史蒂芬·希勒約什·史密斯阿爾·泰勒戴安娜·塔特爾沃爾夫岡·提爾曼斯里克利·提拉瓦尼呂克·圖伊曼斯安德拉·烏蘇塔梅瑞爾·瓦格納詹姆斯·威靈弗朗茲·韋斯特道格·維勒克里斯托弗·威廉姆斯喬丹·沃爾夫森羅斯·懷利麗莎·約斯卡瓦吉波西亞·兹瓦瓦赫拉在微信上探索David Zwirner在微信上探索更多如欲了解更多請訂閱關注，搶先線上瀏覽作品訂閱"
