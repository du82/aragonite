title = "Bridget Riley - Artworks & Biography | David Zwirner"
description = "One of the most significant artists working today, Bridget Riley's dedication to the interaction of form and color has led to a continued…"
full_description = '''SurveyExhibitionsArtist NewsBiographySelected PressBooksInquireBridget RileySince 1961, Bridget Riley (b. 1931) has focused exclusively on seemingly simple geometric forms, such as lines, circles, curves, and squares, arrayed across a surface—whether a canvas, a wall, or paper—according to an internal logic. The resulting compositions actively engage the viewer, at times triggering sensations of vibration and movement.Learn MoreSurveyExplore all ArtworksBridget RileyIntervals 22, 2020Oil on linen91 1/4 x 65 3/4 inches (231.8 x 167 cm)Bridget RileyMeasure for Measure Dark with Turquoise 6, 2021Acrylic on linen36 3/4 x 36 1/2 inches (93.2 x 92.7 cm)Bridget RileyStatic 7, 2021Acrylic on linen53 3/4 x 53 3/4 inches (136.5 x 136.5 cm)Bridget RileyMeasure for Measure 45, 2020Acrylic on linen61 x 61 inches (155 x 155 cm)Bridget RileyRustle 6, 2015Acrylic on polyester73 5/8 x 74 7/8 inches (187 x 190.2 cm)Bridget RileyLight Shade 4, 2016Acrylic on polyester58 x 66 7/8 inches (147.3 x 170 cm)Bridget RileyArioso (Blue), 2013Oil on linen59 1/8 x 101 1/4 inches (150 x 257.2 cm)Bridget RileyTwo Yellows, Composition with Circles 5, 2011Acrylic on linen44 x 44 inches (112 x 112 cm) ExhibitionsExplore ExhibitionsView AllArtist NewsExplore Artist NewsBridget Riley Drawings at the Morgan Library & MuseumThe Morgan Library & Museum, New YorkJune 2023Read MoreBridget Riley's Ceiling Painting UnveiledBritish School at RomeMay 2023Read MoreBridget Riley Drawings: From the Artist’s Studio at Hammer MuseumHammer Museum, Los AngelesFebruary 2023Read MoreBridget Riley Drawings: From the Artist’s StudioArt Institute ChicagoSeptember 2022Read MoreLooking and Seeing, Doing and MakingZentrum Paul Klee, BernJune 2022Read MorePerceptual AbstractionYale Center for British Art, New HavenMarch 2022Read MoreBridget Riley Is Elected to the American Academy of Arts and LettersAmerican Academy of Arts and LettersMarch 2022Read MoreBridget Riley and Renoir at The Phillips CollectionThe Phillips Collection, Washington, DCFebruary 2022Read More BiographyPortrait of Bridget Riley, 2021. Photo by Yuki ShimaDownload Full CVSince 1961, Bridget Riley (b. 1931) has focused exclusively on seemingly simple geometric forms, such as lines, circles, curves, and squares, arrayed across a surface—whether a canvas, a wall, or paper—according to an internal logic. The resulting compositions actively engage the viewer, at times triggering sensations of vibration and movement. This sense of dynamism was explored to great effect in the artist's earliest black-and-white paintings, which established the basis of her enduring formal vocabulary. In 1967, Riley introduced color into her work, thus expanding the perceptual and optical possibilities of her compositions.Riley was born in London, where she attended Goldsmiths College from 1949 to 1952 and the Royal College of Art from 1952 to 1955.Riley’s first solo exhibitions were held at Gallery One, London, in 1962 and 1963, followed by two exhibitions at Robert Fraser Gallery, London, in 1966 and 1967. She was also at that time included in numerous group exhibitions such as Towards Art?, Royal College of Art London (1962); The New Generation, Whitechapel Gallery, London (1964); and Painting and Sculpture of a Decade 1954–1964, Tate Gallery, London (1964). In 1965, her work was included in the now-seminal group exhibition The Responsive Eye, organized by William Seitz at The Museum of Modern Art, New York. In 1968, she represented Great Britain at the 34th Venice Biennale (along with Philip King), where she was the first living British painter to win the prestigious International Prize for Painting. Her first retrospective, covering the period from 1961 to 1970, opened at the Kunstverein Hannover in 1971 and subsequently traveled to Kunsthalle Bern; Kunsthalle Düsseldorf; Galleria Civica d’Arte Moderna, Turin; and the Hayward Gallery, London.More recent significant solo presentations include those at Dia Center for the Arts, New York (2000-2001); Museum Haus Esters and Kaiser Wilhelm Museum, Krefeld, Germany (2002); Museum of Contemporary Art, Sydney (2004-2005); Musée d'Art Moderne de la Ville de Paris (2008); Walker Art Gallery, Liverpool (traveled to Birmingham Museums and Art Gallery; Norwich Castle Museum and Art Gallery; Southampton City Art Gallery; 2009-2010); National Gallery, London (2010-2011); Art Institute of Chicago (2014-2015); The Courtauld Gallery, London (2015); De La Warr Pavilion, Bexhill on Sea, England (traveled to Gemeentemuseum, The Hague; 2015); Graves Gallery, Museum Sheffield, England (2016); Christchurch Art Gallery, New Zealand (2017); and the Kawamura Memorial DIC Museum of Art, Sakura, Japan (2018).Bridget Riley: Perceptual Abstraction was on view at the Yale Center for British Art, New Haven, Connecticut, in 2022. The traveling exhibition Bridget Riley Drawings: From the Artist’s Studio, which included drawings from the late 1940s to the present day, originated at the Art Institute of Chicago and was subsequently on view at the Hammer Museum, Los Angeles, and the Morgan Library, New York, in 2023.A large-scale wall painting by Riley entitled Messengers was unveiled in 2019 at the National Gallery in London. Also in 2019, a solo presentation of the artist’s work that was organized by the National Galleries of Scotland opened at the Scottish National Gallery, Edinburgh, and traveled to the Hayward Gallery, London (2019-2020).In 1974, Riley was named a CBE (Commander of the Most Excellent Order of the British Empire) and in 1999, appointed the Companion of Honour. In 2003, the artist was awarded the Praemium Imperiale in Tokyo. She received the Kaiser Ring of the City of Goslar, Germany, in 2009 and the Rubens Prize of the City of Siegen, Germany, in 2012.David Zwirner has worked with Riley since 2014, and the gallery's inaugural exhibition of her work, Bridget Riley: The Stripe Paintings 1961-2014, was held in London that year. In 2015, a career spanning survey was presented at the gallery in New York, and in 2018, the London gallery presented Riley’s recent works from the last four years. Also on view at the gallery’s London location were Bridget Riley – Studies: 1984-1997 in 2020 and Bridget Riley: Past into Present in 2021. Riley lives and works in London, Cornwall, and France.Work by the artist is included in museum and public collections worldwide, including Art Institute of Chicago; Arts Council, United Kingdom; British Council, United Kingdom; Buffalo AKG Art Museum, New York; Dallas Museum of Art; Dia Art Foundation, New York; Israel Museum, Jerusalem; Kunstmuseum Bern; Los Angeles County Museum of Art; The Metropolitan Museum of Art, New York; Moderna Museet, Stockholm; Museum für Gegenwartskunst, Siegen, Germany; Museum of Contemporary Art, Los Angeles; The Museum of Modern Art, New York; National Museum of Modern Art, Tokyo; Nationalgalerie, Berlin; Stedelijk Museum, Amsterdam; and Tate, United Kingdom.Download Full CVSelected PressExplore Selected PressBridget Riley: 'I held a mirror up to human nature and reported faithfully'BBC2021Read MoreBridget Riley’s Paintings Continue to Mesmerize, Six Decades OnArtsy2019Read MoreBridget Riley review – still finding new ways to dazzle and exhilarateThe Guardian2019Read More"A visceral assault on the senses"Apollo magazine, review by Robert Barry2018Read More“You have to be willing to look, and able to look” stunning, mind-bending recent works by Bridget Riley Creative Boom, review by Emily Gosling2018Read MoreBridget Riley review – a blast of pure psychedelic energyThe Guardian, review by Jonathan Jones2018Read MoreSelected TitlesExplore BooksBridget Riley: Past into PresentDavid Zwirner Books$55Bridget Riley: Recent Paintings 2014–2017David Zwirner Books$50Bridget Riley: Works 1981–2015David Zwirner Books$50Bridget Riley: The Stripe Paintings 1961-2014David Zwirner Books$55Bridget Riley Working DrawingsThames & Hudson$60Bridget Riley: Dialogues on ArtThames and Hudson & The Bridget Riley Art Foundation$25Bridget RileyNational Galleries of Scotland$60About Bridget Riley: Selected Writings 1999–2016Ridinghouse$35Bridget Riley: Studies 1984-95Ridinghouse$25 Request more informationGet In Touch'''
