["https://davidzwirner.com/exhibitions/2025/raoul-de-keyser"]
title = "Raoul De Keyser: Touch Game | New York: 19th Street | January 16—March 14, 2025  | David Zwirner"
description = "David Zwirner is pleased to present an exhibition of work by Raoul De Keyser (1930–2012) at the gallery’s 519 and 525 West 19th Street locations in New York. Curated by Helen Molesworth, this exhibition will feature major works by the artist with a focus on the mature phase of De Keyser’s career from the 1980s to the 2000s."
full_description = "ExploreChecklistInstallation ViewsExhibitionRaoul De Keyser: Touch GameWant to know more?InquireNow OpenJanuary 16—March 14, 2025Opening ReceptionThursday, January 16, 6–8 PM LocationNew York: 19th Street519 & 525 West 19th StreetNew York, New York 10011ArtistRaoul De KeyserCuratorsHelen MolesworthView Press ReleaseInstallation view, Raoul De Keyser: Touch Game, David Zwirner, New York, 2025David Zwirner is pleased to present an exhibition of work by Raoul De Keyser (1930–2012) at the gallery’s 519 and 525 West 19th Street locations in New York. Curated by Helen Molesworth, this exhibition features major works by De Keyser with a focus on the mature phase of the artist’s career from the 1980s to the 2000s. The exhibition marks the first time the gallery has shown such an expansive selection of De Keyser’s oeuvre, following presentations of his work in Hong Kong in 2021 and 2022, and Raoul De Keyser: Drift, his last solo exhibition in New York in 2016, which was first on view at David Zwirner London in 2015–2016.ExploreRaoul De Keyser: Touch GameView ChecklistRaoul De Keyser, 2007. Photo by Stephan Peleman“A De Keyser painting deliciously halts the human impulse to make meaning. Instead, his daily practice of painting offers us the everyday as the accrual of small forms and gestures designed to heighten and focus our increasingly scattered attention.”—Helen Molesworth in her curatorial statement for Raoul De Keyser: Touch GameRaoul De KeyserUntitled, 1991Oil on canvas64 7/8 x 46 inches (164.8 x 116.8 cm)InquireMade up of simple shapes and painterly marks, De Keyser’s works allude to the natural world and representational imagery while avoiding suggestions of narrative or reductive frameworks that limit experience and interpretation. De Keyser’s ability to find new and exciting ways to invigorate his surfaces resulted in his reception as a major influence for contemporary painters—“an artist’s artist.”Raoul De KeyserFront, 1992Oil on canvas64 7/8 x 48 3/8 inches (164.8 x 122.9 cm)The artist’s inclusion in Jan Hoet’s highly celebrated Documenta 9 in Kassel, Germany, in 1992 signaled a serious turning point in the artist’s career as he started to gain greater international recognition. Several of the works in the exhibition are from this time, including Front (1992), which was featured at Documenta.Raoul De KeyserBleu de ciel, 1991-1992Oil on canvas27 3/8 x 19 3/4 inches (69.5 x 50 cm)Inquire“De Keyser’s budding international success around 1990 coincided with the full flourishing of his work’s peculiar power. He was able to maintain the restrictions he had imposed on himself since the beginning of his career, namely to adhere—albeit loosely—to the aesthetics of color field painting, and to paint things from his surroundings.”—Ulrich Loock, critic and curatorInstallation view, Raoul De Keyser: Touch Game, David Zwirner, New York, 2025Raoul De KeyserOchtend, 2000Oil and charcoal on canvas75 x 99 1/4 inches (190.5 x 252.1 cm) Inquire“He is the invisible godfather of a lot of pleasantly unassuming, slightly mysterious painting, from Luc Tuymans to Richard Aldrich. Mr. De Keyser focuses on, but also relies on, what may be painting's most basic quality: the inevitability with which marks on canvas create spatial illusion, suggest things seen in the world and evoke other paintings.”—Roberta Smith, former chief critic, The New York TimesRaoul De KeyserCome on, play it again nr. 2, 2001Oil on canvas51 1/4 x 74 7/8 inches (130.2 x 190.2 cm)InquireAmong the late-period works that will be on view are several paintings from De Keyser’s seminal Come on, play it again series from the early 2000s. The group of works was first presented at the artist’s inaugural show with the gallery at its original Greene Street location in New York in 2001.Raoul De KeyserCome on, play it again nr. 5, 2001Oil on canvas65 x 48 1/2 inches (165.1 x 123.2 cm)InquireRaoul De KeyserCome on, play it again nr. 8, 2001Oil on canvas28 x 19 3/4 inches (71.1 x 50.2 cm)InquireEach of these works seems to follow a different compositional logic, while nevertheless relying on a canny use of biomorphic and geometric forms, squares, lines, and dots. The title of the series carries a musical connotation, as if encouraging an improvisational jazz pianist, while simultaneously suggesting the possibility of infinite variation.David Zwirner and Raoul De Keyser at Raoul De Keyser: Come on, play it again, David Zwirner, New York, 2001Installation view, Raoul De Keyser: Come on, play it again, David Zwirner, New York, 2001Installation view, Raoul De Keyser: Come on, play it again, David Zwirner, New York, 2001Installation view, Raoul De Keyser: Come on, play it again, David Zwirner, New York, 2001 “De Keyser's work seems simple and direct. But it doesn't confront you, as it is quite a gentle proposal. The formation of the image seems mobile, temporary. A suggestion that could already look different in the next moment. You recognize something, and what you recognize is in this moment true.”—Tomma Abts, artistRaoul De KeyserCome on, play it again nr. 4, 2001Oil on canvas74 7/8 x 47 7/8 inches (190.2 x 121.6 cm)InquireRaoul De KeyserZinkend, 1983Oil on canvas38 x 30 inches (96.5 x 76.2 cm)InquireAmong the works that will be on view are several paintings from the 1980s, including representative works from De Keyser’s important Zinkend and Hellepoort series, which reflect a notable turn in the artist’s practice toward more dynamic, gestural facture. Specific formal elements recur in these and several other seminal paintings from the 1980s and 1990s.Raoul De KeyserHellepoort 8 (Gates of Hell 8), 1985Oil on canvas19 3/4 x 15 3/4 inches (50 x 40 cm)InquireInstallation view, Raoul De Keyser: Touch Game, David Zwirner, New York, 2025“What constituted a ‘picture’ for De Keyser, how much was physically there on the canvas, the meanings his suggestive lines and shapes elicited, these questions were profoundly constrained and then liberated by the economical manner he chose as his means of address. De Keyser’s work was just enough to transport me into a moment of wordless transcendence.”—James Welling, artistRaoul De KeyserClos, 2003Oil on canvas30 3/4 x 38 5/8 inches (78 x 98 cm)Resume debuted at Remnants, De Keyser’s 2003 solo exhibition at David Zwirner New York. It is one of several works from that time that De Keyser based on the fragments of a linocut print that he’d made ten years prior. As curator Martin Germann notes about these works, “The often whimsical landscape paintings—the painterly translation of fragmented traces of work suggests watersides, horizons, sky and the like—are further variants in a familiar economy: remnants of old images create cascades of new images, what went before is honed into an open present. De Keyser remained in the production loop of a network that, driven by change, was continuously reactivated anew.”Raoul De KeyserResume, 2003Oil on canvas35 1/2 x 25 5/8 inches (90.2 x 65.1 cm)Inquire“[The titles of the Remnants] all make a verbal connection with something that already exists.... His paintings are permeated as much with memories of his own past work as with echoes of the traditions of art, yet at the same time they gently, relentlessly seek out the immediate present.”—Konrad Bitterli, director, Kunst Museum Winterthur, SwitzerlandRaoul De Keyser, Resume, 2003 (detail)Though De Keyser has been the subject of numerous surveys and solo exhibitions at museums and institutions in Europe since the 1970s, this exhibition will be a rare opportunity for New York audiences to experience the breadth of his practice, his beguiling sense of color, his deft and delicate surfaces, and his sometimes poetic, sometimes mysterious, sometimes rigorously formal paintings.Raoul De KeyserUntitled, 2006Oil, gesso, and charcoal on canvas15 7/8 x 20 7/8 inches (40.3 x 53 cm)“De Keyser more than anyone of his generation or of more recent generations rolled the dice of history with nothing in his favor but raw talent and conviction.”—Robert Storr, curator, critic, and writerInstallation view, Raoul De Keyser: Touch Game, David Zwirner, New York, 2025Inquire about works by Raoul De KeyserGet in Touch"
