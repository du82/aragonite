full_description = "ConsignmentsAbout ConsignmentsSince its founding in 1993, David Zwirner has been active in the secondary market on behalf of private and public collections all over the world. We are pleased to offer Consignments, a new online submission tool that enables our current and future clients to take advantage of the gallery’s deep expertise and exceptional global Sales Team. Easily accessible via desktop or mobile, Consignments enables collectors worldwide to swiftly submit works from their collections that they are interested in selling.consignments@davidzwirner.comStep 1 of 4Consign with David ZwirnerKindly share your contact and artwork details here, and our team will connect with you shortly.All fields marked “*” are required.Input Text*Input Text*Input Text*Input TextNext: Artwork DetailsChevron Right IconPersonalized ProcessWe provide a discrete, personalized, flexible sales strategy for all consignments. After submitting your artwork details, you will work closely with a dedicated Sales Director to create a tailored approach that leverages the gallery’s many platforms.Unparalleled AccessBenefit from our global Sales Team’s extensive network of top international and emerging collectors, as well as the gallery’s close relationships with both living artists and historic estates.Unique ExpertiseOur Secondary Market Sales Team documents and evaluates all artworks, bringing a wealth of knowledge and market expertise to every consignment.Innovative PresentationsConsigned works have the opportunity to be featured in art fairs, group shows, and private sales, as well as unique online presentations. Featured artworks receive customized treatment from our Photography, Design, Video, and Digital departments, providing the complete context on the work with rich narrative detail.ExploreView a selection of past online presentations of secondary market Exceptional Works. To date, the gallery’s secondary market presentations have included additional notable artworks by Jean-Michel Basquiat, Philip Guston, Donald Judd, Sherrie Levine, Roy Lichtenstein, Giorgio Morandi, Sigmar Polke, Gerhard Richter, Bridget Riley, Mark Rothko, Cy Twombly, Andy Warhol, and Charles White, among others.Online ExhibitionExceptional Works: Robert RymanOnlineSeptember 20—November 20, 2021Learn MoreOnline ExhibitionExceptional Works: Ruth AsawaOnlineApril 22—22, 2020Learn MoreOnline ExhibitionExceptional Works: Joan MitchellOnlineMay 27—June 18, 2021Learn MoreOnline ExhibitionExceptional Works: Alice NeelOnlineMay 12—June 18, 2021Learn MoreOnline ExhibitionExceptional WorksAd ReinhardtOnlineNovember 8—30, 2021Learn MoreOnline ExhibitionExceptional Works: Noah DavisOnlineFebruary 24—March 12, 2021Learn MoreOnline ExhibitionExceptional Works: Donald JuddOnlineNovember 30—December 8, 2021Learn MoreOnline ExhibitionAlbers works from the Dreier collectionOnlineMarch 11—11, 2020Learn More Curious to learn more?Get in Touch"
