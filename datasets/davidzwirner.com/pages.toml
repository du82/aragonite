full_description = "SurveyExhibitionsArtist NewsBiographySelected PressBooksInquireDonald JuddWith the intention of creating straightforward work that could assume a direct material and physical “presence” without recourse to grand philosophical statements, Donald Judd (1928–1994) eschewed the classical ideals of representational sculpture to create a rigorous visual vocabulary that sought clear and definite objects as its primary mode of articulation. Learn MoreSurveyExplore all ArtworksDonald JuddUntitled, 1963Oil, plywood and iron pipe22 1/8 x 45 3/8 x 30 1/2 inches (56.2 x 115.1 x 77.5 cm)Hirshhorn Museum and Sculpture Garden. Smithsonian Institution. Joseph H. Hirshhorn Purchase Fund, 1991Donald JuddUntitled, 1966/1977Aluminum and galvanized steel1 unit: 40 x 190 x 40 inches (101.6 x 482.6 x 101.6 cm)Donald JuddUntitled, 1967Lacquer and galvanized iron5 x 40 x 8 3/4 inches (12.7 x 101.6 x 22.2 cm)Donald JuddUntitled, 1968Stainless steel5 units: 48 x 120 x 20 inches each (121.9 x 304.8 x 50.8 cm)Donald JuddUntitled, 1970Clear and purple anodized aluminum8 1/16 x 253 9/16 x 8 1/4 inches (20.5 x 644 x 21 cm)Moderna Museet, StockholmDonald JuddUntitled, 1973Brass and fluorescent red acrylic sheetSix elements, each: 34 x 34 x 34 inches (86.4 x 86.4 x 86.4 cm)Solomon R. Guggenheim Museum, New York. Panza Collection, 1991Donald JuddUntitled, 1974Galvanized steel15 1/2 x 93 x 78 inches (39.4 x 236.2 x 198.1 cm)Donald JuddUntitled, 1977Douglas Fir plywood36 x 60 x 60 inches (91.4 x 152.4 x 152.4 cm)Herbert Foundation, GhentDonald JuddUntitled, 1982Aluminum and violet aluminium sheetEach: 40 x 40 x 14 1/2 inches (100 x 100 x 37 cm each)AGV Collection, SwitzerlandDonald JuddUntitled, 1985Painted aluminum11 13/16 x 118 1/8 x 11 13/16 inches (30 x 300 x 30 cm)Donald JuddUntitled, 1989Painted aluminum59 x 24 7 1/4 x 65 inches (150 x 750 x 165 cm)Donald JuddUntitled, 1989Anodized aluminum clear and blue acrylic sheet39 3/8 x 78 3/4 x 78 3/4 inches (100 x 200 x 200 cm) ExhibitionsExplore ExhibitionsView AllArtist NewsExplore Artist NewsJuddMuseum of Modern Art, New YorkMarch 2020Read MoreFlavin Judd, Alexandra Cunningham-Cameron, and Lucas Zwirner in ConversationDesign MiamiDecember 6, 2019Read MoreDonald Judd Interviews: Flavin and Rainer Judd in Conversation with Alix BrowneMcNally Jackson, New YorkNovember 2019Read MoreJudd Foundation and David Zwirner Books to Release Donald Judd InterviewsNovember 2019Read MoreDonald Judd Interviews Marathon ReadingJudd Foundation, New YorkOctober 2019Read MoreThe Artist's Studio: Donald JuddMetrograph, New YorkOctober 2019Read MoreDonald Judd Interviews: Barbara Rose and Judd Foundation’s Caitlin Murray in ConversationNY Art Book Fair, MoMA PS1September 2019Read MoreDonald Judd: Paintings 1960–1961Judd Foundation, New York2018Read More BiographyView Artist WebsiteWith the intention of creating straightforward work that could assume a direct material and physical “presence” without recourse to grand philosophical statements, Donald Judd (1928-1994) eschewed the classical ideals of representational sculpture to create a rigorous visual vocabulary that sought clear and definite objects as its primary mode of articulation. Judd’s work has been exhibited internationally since the 1950s. His first significant solo shows were held at the Green Gallery, New York (1964), and the Leo Castelli Gallery, New York (1966). The artist’s first museum survey took place in 1968 at the Whitney Museum of American Art, New York, followed by a traveling European survey exhibition in 1970 organized by the Stedelijk Van Abbemuseum, Eindhoven, The Netherlands, which traveled to the Museum Folkwang, Essen, Germany; Kunstverein, Hannover, Germany; and Whitechapel Art Gallery, London. In 1975, the National Gallery of Canada, Ottawa, presented a notable solo exhibition of the artist’s work that was accompanied by the publication of a catalogue raisonné. From 1987 to 1988, the Stedelijk Van Abbemuseum, Eindhoven, The Netherlands, mounted Donald Judd: Sculptures 1965-1987, which traveled to Städtische Kunsthalle, Düsseldorf; Musée d’Art Moderne de la Ville de Paris; Fundació Joan Miró, Barcelona; and Castello di Rivoli, Turin. The Whitney Museum of American Art, New York, presented Donald Judd in 1988, which then traveled to the Dallas Museum of Art the following year. In 2004, a survey of the artist’s work was organized by Tate Modern, London, and traveled to K20 Kunstsammlung Nordrhein-Westfalen, Düsseldorf, and Kunstmuseum Basel. Other important exhibitions include Donald Judd: Colorist, held at the Sprengel Museum, Hannover, Germany, as well as Kunsthaus Bregenz, Austria, and Musée d’Art Moderne et d’Art Contemporain, Nice, from 2000 to 2001; Donald Judd: Early Work 1955-1968, which traveled from Kunsthalle Bielefeld, Germany, to The Menil Collection, Houston, Texas, from 2002 to 2003; Donald Judd: a good chair is a good chair, a comprehensive presentation of the artist’s furniture and related drawings organized by Ikon Gallery, Birmingham, England, in 2010; and Donald Judd: The Multicolored Works at the Pulitzer Foundation for the Arts, St. Louis, Missouri, in 2013. In 2018, the Institute of Contemporary Art, Miami, presented Donald Judd: Paintings and the San Francisco Museum of Modern Art organized Donald Judd: Specific Furniture. A retrospective of the artist’s work was on view at The Museum of Modern Art, New York in 2020 to 2021. In 1977, Judd established the ideas for Judd Foundation, which was founded to preserve his art, spaces, libraries, and archives as a standard for the installation of his work. In 1986, the artist established The Chinati Foundation/La Fundación Chinati in Marfa, Texas, specifically for the permanent installation of large-scale works by both himself and his contemporaries. Permanent installations of Judd’s work can be found at Judd Foundation in New York City, at 101 Spring Street, and Marfa, Texas, along with the neighboring Chinati Foundation. Judd’s work is included in numerous important museum collections around the world, including Kunstmuseum Basel; Leeum, Samsung Museum of Art, Seoul; Los Angeles County Museum of Art; The Metropolitan Museum of Art, New York; Museum Boijmans Van Beuningen, Rotterdam; The Museum of Modern Art, New York; Museum of Modern Art, Shiga; National Gallery of Art, Washington, DC; Solomon R. Guggenheim Museum, New York; Stedelijk Museum voor Actuele Kunst, Ghent; Tate, London; Tokyo Metropolitan Art Museum; and the Whitney Museum of American Art, New York, among others. In 2011, the gallery’s New York location exhibited a selection of works by the artist curated by Flavin Judd drawn from his seminal 1989 exhibition held at the Kunsthalle Baden-Baden, Germany, and in 2013, a major installation by Judd was included in Dan Flavin and Donald Judd, the inaugural show at David Zwirner’s new 20th Street location in New York. Also in 2013, the gallery held an exhibition of works by Judd at its London location, the first gallery presentation of this seminal artist in London in nearly fifteen years and the first significant show of Judd’s work in the UK since his 2004 retrospective at Tate Modern, London. In 2015, the gallery hosted an exhibition of the artist’s works in Cor-ten steel at the West 20th Street location in New York, the first comprehensive presentation of his work in this distinctive material. In 2020, the survey exhibition, Artworks: 1970-1994, was on view across all three of the gallery's West 19th Street locations in New York.View Artist WebsiteSelected PressExplore Selected PressThe Cold, Imperious Beauty of Donald JuddThe New Yorker, review by Peter Schjeldahl2020Read More‘Judd’ Review: Plainspoken PoetryThe Wall Street Journal, review by Lance Esplund2020Read MoreThe magic of Marfa – the making of an art meccaFinancial Times: How To Spend It, profile by Rima Suqi2020Read MoreThe Many Moods and Pleasures of Donald Judd’s ObjectsThe New York Times, review by Holland Cotter2020Read MoreThinking Outside Judd’s Boxes: His Legacy Still Shapes ArtistsThe New York Times, profile by Ted Loos2020Read MoreWhat’s in the Box?New York Magazine, review by Jerry Saltz2020Read MoreSelected TitlesExplore BooksDonald Judd: Artworks 1970-1994David Zwirner Books$85Donald Judd SpacesJudd Foundation and DelMonico Books/Prestel$75JuddThe Museum of Modern Art, New York$75Donald Judd InterviewsJudd Foundation/David Zwirner Books$39.95Donald Judd: Paintings 1959-61Paintings 1959-1961Donald Judd: Complete Writings 1959–1975Gallery Reviews, Book Reviews, Articles, Letters to the Editor, Reports, Statements, ComplaintsDonald Judd: Cor-tenDavid Zwirner Books$45Donald Judd WritingsJudd Foundation/David Zwirner Books$39.95Donald JuddDavid Zwirner / Steidl$65The Helga and Walther Lauffs CollectionSteidl / Zwirner & Wirth$100Donald Judd Collection$160 Request more informationGet In Touch"
