title = "Elizabeth Peyton: Angel | Books | David Zwirner"
description = "David Zwirner is an art gallery with locations in New York, Los Angeles, London, Paris and Hong Kong. We present physical and online exhibitions, podcasts, books, and more."
full_description = "Elizabeth Peyton: AngelPublisher: David Zwirner BooksPublication Date: 2024Text by Lucas ZwirnerElizabeth Peyton’s art is one of glances and gestures that become indistinguishable from her in the moment she paints them. The works are an expression of specificity, but also of Peyton’s extraordinary ability to identify with her subjects. There is a feeling that becomes cumulative in her art, unadulterated and almost destabilizing, built up through the many brush marks that characterize her surfaces. Through the depth of these images, constructed one stroke at a time, the emotional substrate of our reality is revealed. —Lucas Zwirner, “The Profession of the Painter,” in AngelAngel, Peyton’s debut monograph from David Zwirner Books, explores the artist’s extraordinary ability to identify with her subject matter, from Ang in the Mountains and Mani Rimdu to the subjects of Elvis Angel (Elvis' Eyes) and Titanic (Jack & Rose). These are paintings that dwell in the permeability of light and space, reveling in what Peyton calls “painting and art as a space to capture energy that can take you someplace else.”Published on the occasion of her exhibition Angel at David Zwirner, London, in 2023, this volume includes full-color plates of eighteen new works, Peyton’s own photographs connected by “the feeling of love, faith, and nature moving through all of them,” and a text by Lucas Zwirner.DetailsPublisher: David Zwirner BooksArtist: Elizabeth PeytonContributors: Lucas ZwirnerPublication Date: 2024ISBN: 9781644231340Retail: $70 | $90 CAN | £55Designer: Jules EstèvesPrinter: VeronaLibri, VeronaBinding: HardcoverDimensions: 9 × 11.75 in | 23 × 30 cmPages: 92Reproductions: 31 illustrationsArtist and ContributorsElizabeth PeytonElizabeth Peyton (b. 1965) attended the School of Visual Arts in New York from 1984 to 1987. She had her first solo exhibition in 1987 at Althea Viafora Gallery in New York. The artist is based in New York and Paris.Lucas ZwirnerLucas Zwirner is Senior Director, Sales, and Vice President, Business Development, at David Zwirner. In addition to establishing the ekphrasis series and spearheading the award-winning podcast Dialogues, Zwirner also helps lead select digital initiatives, including Platform, a standalone company founded in 2021. He is also a writer and translator, whose work has appeared in The Drift, The Paris Review, and An Elias Canetti Reader, edited by Joshua Cohen and published by Farrar, Straus and Giroux. He is a graduate of Yale University, where he studied comparative literature and philosophy.$70"
