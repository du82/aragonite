["https://davidzwirner.com/news/2025/wolfgang-tillmans-weltraum"]
title = "Wolfgang Tillmans: Weltraum | David Zwirner"
description = "Weltraum marks Wolfgang Tillmans’s first major museum show in Germany in over half a decade and features entirely new works created since 2022."
full_description = 'Albertinum, Dresden, GermanyMarch 8–June 29, 2025Weltraum marks Wolfgang Tillmans’s first major museum show in Germany in over half a decade. Following extensive retrospectives in the US and Canada, the exhibition will focus on entirely new works created since 2022. The starting point for Tillmans’s latest photographic series is, in part, a journey that began in San Francisco, the hub of digital technologies on the US West Coast, and continued through Guam to Southeast Asia. In regions such as Hong Kong, Taiwan, and Mongolia, Tillmans continued his investigation into the material traces of internet corporations and AI companies, observing how these industries intertwine disparate locales into a dense global network.Weltraum (in English, “outerspace") will prominently feature large-scale images that engage in a dialogue with historical artworks from the Staatliche Kunstsammlungen Dresden collections, creating a dynamic exchange between present and historical contexts.Wolfgang Tillmans’s boundless curiosity, which seamlessly spans geographies and disciplines, serves as the foundation for his exploration of contemporary visual culture. His work repeatedly tackles the challenge of translating complex realities into visual forms, offering accessible perspectives that encourage fearless, open coexistence. Internationally regarded as one of the most influential and prolific artists of our time, Tillmans’s impact extends beyond the art world into music and pop culture, shaping how we perceive images—and, by extension, our reality.Learn more at the Albertinum.'
year_published = 2025
