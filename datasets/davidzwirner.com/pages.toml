["https://davidzwirner.com/exhibitions/2025/tau-lewis-spirit-level"]
title = "Tau Lewis: Spirit Level | Los Angeles | February 13—March 29, 2025  | David Zwirner"
description = "David Zwirner is pleased to announce Spirit Level, a solo exhibition of work by Tau Lewis (b. 1993) that will be shown at the gallery’s Los Angeles location."
full_description = "ExploreChecklistInstallation ViewsExhibitionTau Lewis: Spirit LevelWant to know more?InquireNow OpenFebruary 13—March 29, 2025Opening ReceptionThursday, February 13, 6–8 PMLocationLos Angeles616 N Western AvenueLos Angeles, CA 90004Tue, Wed, Thu, Fri, Sat: 10 AM-6 PMArtistTau LewisView Press ReleaseInstallation view, Tau Lewis: Spirit Level, David Zwirner, Los Angeles, 2025David Zwirner is pleased to announce Spirit Level, a solo exhibition by Tau Lewis (b. 1993) at the gallery’s Los Angeles space at 616 N Western Avenue. The exhibition features five monumental sculptures and a circular quilt that debuted at Lewis’s 2024–2025 solo show at the Institute of Contemporary Art, Boston, curated by Jeffrey De Blois.The works in Spirit Level emerged from a period of profound loss for Lewis. In the conception of these anthropomorphic figures, the artist developed respective identities and narratives that implicate our ancestral pasts, spiritual and cultural similitudes, and multiplanar existences. Comprising found and inherited objects, each sculpture embodies the transitional period in which they were made as well as the liminal space in a material object’s journey as it changes hands and takes on a new form.Drawing from the faces of the Caribbean Sea, techno and dub music, literature, and studies of religion and spirituality, with this exhibition Lewis expands her world-building, weaving figures that reappear across her practice, connected by what she calls their “material DNA.” In the gallery’s airy space, these stately sculptures gather in quiet majesty, engaged in a silent spiritual dialogue.ExploreTau Lewis: Spirit LevelView ChecklistTau Lewis in her Brooklyn studio, 2024. Photo by Jeenah Moon“I wanted the figures in Spirit Level to be architectural. They are meant to be broad, strong and tall, something that is resisting like a castle or a giant tree or even a mountain. A figure that could also be a fortress or a place to hide inside of, that is how I always think of angels.”—Tau LewisTau LewisThe Night Woman, 2024Steel, enamel paint, acrylic paint and finisher, repurposed leather, suede, fur, shagreen, assorted fabric, leather, natural dyes, cow bone, conch, Abalone shell, stones, jute, coated nylon thread, and coated cotton thread130 x 137 x 106 inches (330.2 x 348 x 269.2 cm)InquireTau Lewis, The Night Woman, 2024 (detail)Tau Lewis, The Night Woman, 2024 (detail)Tau Lewis, The Night Woman, 2024 (detail)“Through the pris­matic lens of the world of evocative associations she gathers, Lewis’s work is directed at healing personal, collective, and historical traumas through the repetitive forms of creative labor and patterns of reuse she employs.”—Jeffrey De Blois, curator, Institute of Contemporary Art, BostonTau LewisThe Handle of the Axe, 2024Steel, enamel paint, acrylic paint and finisher, repurposed leather, suede, shearling, shagreen, assorted fabric, leather, fabric, natural dyes, rawhide, seashells, coral bone, pearl, stones, assorted beads, assorted found objects, gold and silk thread, coated nylon thread, and coated cotton thread132 x 176 x 141 inches (335.3 x 447 x 358.1 cm)InquireTau Lewis, The Handle of the Axe, 2024 (detail)Tau Lewis, The Handle of the Axe, 2024 (detail)Tau Lewis, The Handle of the Axe, 2024 (detail)Tau Lewispalace, 2025Steel, enamel paint, repurposed leather, suede, snakeskin, fabric, leather dye, acrylic paint and finisher, seashells, coral bone, abalone, and coated nylon thread61 x 103 x 100 inches (154.9 x 261.6 x 254 cm)InquireTau Lewispearl, 2025Steel, enamel paint, repurposed leather, suede, fabric, leather dye, acrylic paint and finisher, seashells, coral bone, assorted found objects, and coated nylon thread76 1/2 x 81 1/2 x 74 inches (194.3 x 207 x 188 cm)InquireTau Lewisdawn, 2025Steel, enamel paint, repurposed leather, suede, shearling, fabric, leather dye, acrylic paint and finisher, seashells, abalone, assorted found objects, and coated nylon thread96 x 91 x 107 inches (243.8 x 231.1 x 271.8 cm)InquireTau LewisPilot, 2024Steel, enamel paint, acrylic paint and finisher, repurposed leather, suede, shearling and fabric, organic cotton twill, and coated nylon thread54 1/4 x 34 1/4 x 18 inches (137.8 x 87 x 45.7 cm)Inquire “Something about the scale of [the] pieces was incredibly moving and very engaging for viewers—there was almost this invitation to talk to them.... We’re at a point in which the distinction between art and craft doesn’t matter anymore.”—Cecilia Alemani, curator of the 59th Venice Biennale, in The New York TimesTau LewisThe Reaper, 2024Steel, enamel paint, acrylic paint and finisher, repurposed leather, suede, snake skin, goat skin, assorted fabric, leather, fabric, natural dyes, seashells, coral bone, stones, assorted found objects, wire, jute, gold thread, silk thread, coated nylon thread, and coated cotton thread139 1/2 x 64 x 64 inches (354.3 x 162.6 x 162.6 cm)InquireTau Lewis, The Reaper, 2024 (detail)Tau Lewis, The Reaper, 2024 (detail)Installation view, Tau Lewis: Spirit Level, David Zwirner, Los Angeles, 2025“As many of the fragment’s histories are unknown, they fuse to create a new manner of storytelling that is not dependent on complete knowability, and yet, they possess familiar elements that prompt our patterns of recollection and memory. Lewis turns canonized narrative structure inside out, literally and figuratively reimagining how we can engage with the past.”—Magdalyn Asimakis, curator and writerTau LewisThe Doula, 2024Steel, enamel paint, acrylic paint and finisher, repurposed leather, suede, assorted fabric, leather, fabric, natural dyes, seashells, coated nylon thread, and coated cotton thread131 x 130 x 228 inches (332.7 x 330.2 x 579.1 cm)InquireTau Lewis, The Doula, 2024 (detail)Tau Lewis, The Doula, 2024 (detail)Tau Lewis, The Doula, 2024 (detail)In 2024, The Polygon Gallery, Vancouver, unveiled Lewis’s outdoor installation Coloratura, on view through March 30, 2025. She won the Ezratti Family Prize for Sculpture in November 2023, which was accompanied by a solo exhibition at the Institute of Contemporary Art, Miami. Additional solo exhibitions include Vox Populi, Vox Dei, at 52 Walker, New York, in 2022, and Symphony at the National Gallery of Canada, Ottawa, in 2021.Installation view, Tau Lewis’s Divine Giants Tribunal (2021), on view in The Milk of Dreams, 59th Venice Biennale,2022. Photo by Roberto Marossi and Ela BialkowsaInstallation view, Tau Lewis: Symphony, National Gallery of Canada, Ottawa, 2021–2022Installation view, Tau Lewis’s The cure will be completed in my body, silence your spirit to let me reach you, my skin will secrete angels and you will have forgotten and forgiven all (2023), on view at the Institute of Contemporary Art, Miami, 2023–2024. Photo by Zachary BalberInstallation view, Tau Lewis: Coloratura, Polygon Gallery, Vancouver, 2024–2025. Photo by Akeem Nermo Tau LewisThe Miracle, 2024Steel, enamel paint, foam, acrylic paint and finisher, repurposed leather, suede, goatskin, assorted fabric, leather, fabric, natural dyes, assorted beads, gold and silk thread, coated nylon thread, and coated cotton thread135 x 100 x 100 inches (342.9 x 254 x 254 cm)Inquire“We don’t all claim to be making sacrifices to our ancestors, but in a sense, that’s what I felt about her works…. [Now she is] tearing things to pieces, just tearing them to pieces, putting them back together, looking at them in a different format than they would ever be looked at.”—Lonnie Holley, artistTau Lewis, The Miracle, 2024 (detail)Tau Lewis, The Miracle, 2024 (detail)Tau Lewis, The Miracle, 2024 (detail)Tau LewisThe Last Transmission, 2024Repurposed leather and suede, cotton canvas, acrylic paint and finisher, leather, fabric, natural dyes, assorted found metal, wood, ceramic, glass, wire, beads, seashells, coated nylon thread, and coated cotton thread8 x 182 inches diameter (20.3 x 462.3 cm)InquireThe five colossal figures in Spirit Level gather in ceremony around a circular quilt titled The Last Transmission (2024). With its radial symmetry, The Last Transmission appears as a geometric portal that serves as a locus for prayer and meditation. The work’s title links all of Lewis’s subjects to a sweeping “last transmission,” in which the lives of those who have passed continue to return and transform in an infinite echo.Tau Lewis, The Last Transmission, 2024 (detail)Tau Lewis, The Last Transmission, 2024 (detail)Tau Lewis, The Last Transmission, 2024 (detail)“Tau Lewis’s works seem to evolve from the inside out. It is true that some hold secrets within—buried objects of personal significance that remain unseen on the surface, yet one might sense that they are there—beneath the hollow chest, or behind the painted eyes.”—Margot Norton, chief curator, Berkeley Art Museum and Pacific Film ArchiveInstallation view, Tau Lewis: Spirit Level, David Zwirner, Los Angeles, 2025Inquire about works by Tau LewisGet in Touch"
