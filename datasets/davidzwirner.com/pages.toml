["https://davidzwirner.com/exhibitions/2025/thomas-ruff-experiences-lumineuses"]
title = "Thomas Ruff: expériences lumineuses | London | January 30—March 22, 2025  | David Zwirner"
description = "David Zwirner is pleased to present an exhibition of work by the German artist Thomas Ruff (b. 1958), which will be on view across two floors of its space in London and will mark the artist’s first solo show in the city since his critically acclaimed presentations at Whitechapel Gallery and the National Portrait Gallery in 2017, and the Victoria and Albert Museum in 2018, where he was commissioned to create a series to inaugurate its Photography Centre."
full_description = "ExploreChecklistInstallation ViewsExhibitionThomas Ruff: expériences lumineusesWant to know more?InquireNow OpenJanuary 30—March 22, 2025Opening ReceptionThursday January 30, 6–8 PMLocationLondon24 Grafton StreetLondon W1S 4EZTue, Wed, Thu, Fri, Sat: 10 AM-6 PMArtistThomas RuffView Press ReleaseInstallation view, Thomas Ruff: expériences lumineuses, David Zwirner, London, 2025David Zwirner is pleased to present an exhibition of work by the German artist Thomas Ruff at the gallery’s location in London. expériences lumineuses marks the artist’s first solo show in the city since his critically acclaimed presentations at Whitechapel Gallery and the National Portrait Gallery in 2017, and the Victoria and Albert Museum in 2018, where he was commissioned to create a series to inaugurate its Photography Centre. The exhibition juxtaposes new and recent series, presented on the ground floor, with a selection of images surveying Ruff’s career on the first floor, together demonstrating his expansive approach to photography. On the occasion of the exhibition, curator Susanna Brown has contributed a new essay focusing on Ruff’s newest body of work.ExploreThomas Ruff: expériences lumineusesView ChecklistWorking in discrete series, Thomas Ruff has conducted an in-depth examination of a variety of photographic genres throughout his career, including portraiture, the nude, landscape, and architectural photography, among others. The artist’s overarching inquiry into the “grammar of photography” accounts for not only his heterogeneous subject matter but also the extreme variation of technical means used to produce his series.In London, the ground floor features two recent series—expériences lumineuses, on view for the first time in this presentation, and untitled#—that represent an expansion of Ruff’s ongoing investigation of photographic abstraction.Thomas Ruffe.l. - n°02, 2024Inkjet print on canvas96 7/8 x 79 1/8 inches (246 x 201 cm)Edition of 4, 1 APInquire“Each of the seven images in the series ... is a contemporary response to [Berenice] Abbott’s studies of light refraction.... While Abbott’s small images were well suited to reproduction in book form, Ruff’s images resemble charcoal drawings and, at more than two meters tall, his monumental canvases demand to be seen in person.”—Susanna Brown, curator, in her new essay “Giving Form to Light”Thomas Ruffe.l. - n°04, 2024Inkjet print on canvas96 7/8 x 79 1/8 inches (246 x 201 cm)Edition of 4, 1 APInquireThomas Ruff, self-portrait, 1980With expériences lumineuses and untitled#, Ruff begins by taking the photographs himself in a purpose-built studio, returning to a mode of production that defined his early career. As the artist has stated, the method used to create a photograph is for him a means to an end: “There’s not one way of making photographs. There are thousands of possibilities you can choose from…. I am just interested in the result and if the result is worth discussing.”Thomas Ruff, e.l. - n°04, 2024 (detail)Process photo showing the making of expériences lumineuses, 2024Process photo showing the making of expériences lumineuses, 2024Process photo showing the making of expériences lumineuses, 2024In expériences lumineuses, Ruff approaches the photographic image from a scientific perspective, endeavoring to devise a method of picturing pure light. To create these works, he turned to a simple physics experiment that helps visualize the electromagnetic spectrum. In his studio, he placed a number of glass objects—such as lenses, mirrors, and prisms—on top of a whiteboard and passed through them multiple beams of light.Thomas Ruffe.l. - n°03, 2024Inkjet print on canvas96 7/8 x 79 1/8 inches (246 x 201 cm)Edition of 4, 1 APInquire“Surely, scientific truth and natural phenomena are as good subjects for art as are man and his emotions, in their infinite variety.”—Berenice Abbott, photographerThomas Ruffe.l. - n°05, 2024Inkjet print on canvas96 7/8 x 79 1/8 inches (46 x 201 cm)Edition of 4, 1 APInquireAfter photographing the reflections and refractions that resulted from these arrangements, Ruff then digitally inverted the images so that the play of light would appear as dynamically intersecting lines or stripes in the composition. Printed on velvety matte surfaces, these works on canvas appear almost as painterly abstractions, though they are actually photographs documenting scientific phenomena.Thomas Ruffe.l. - n°10, 2024Inkjet print on canvas79 1/8 x 96 7/8 inches (201 x 246 cm)Edition of 4, 1 APInquireThomas Ruff, e.l. - n°010, 2024 (detail)“Unlike his contemporaries the German photographers Andreas Gursky, Candida Höfer and Thomas Struth ... Ruff does not travel to make his work. By annexing the world’s evolving photographic technologies, using his studio as his base, however, he has travelled further than any of his peers.”—Iwona Blazwick, curatorInstallation view, Thomas Ruff: expériences lumineuses, David Zwirner, London, 2025Thomas Ruffuntitled#20, 2022Chromogenic print with Diasec47 1/2 x 39 5/8 inches (120.5 x 100.5 cm)Edition of 5, 2 APInquireÉtienne Bertrand Weill, Comme des roseaux (Like reeds), 1965 (detail) © Estate Etienne Bertrand Weill & Galerie Maria WettergrenUnknown photographer, Heinrich Heidersberger with his Rhythmograph, 1955–1960. Booth Family Center for Special Collections, Georgetown University, Washington DC.Similarly foregrounding abstraction and formal studio experimentation, the untitled# series is inspired by Étienne Bertrand Weill’s Métaforms—long exposures recording the movement of mobiles made from materials such as glass, wire, and wood that he began making in the late 1950s—and Peter Keetman and Heinrich Heidersberger’s rhythmograms from the 1950s and 1960s, complex light patterns that visualize time and motion.For his own series, Ruff photographed a silver coil as it rotated in front of a black background, using a long exposure to capture the motion. The artist then digitally edited the images, applying a blue halo effect to their edges to mimic the appearance of vintage photography. He continued to photograph various wire constructions in his studio in this way, resulting in a body of abstract imagery that—as in expériences lumineuses—evokes light itself as its subject matter.Thomas Ruffuntitled#19, 2022Chromogenic print with Diasec47 1/2 x 39 5/8 inches (120.5 x 100.5 cm)Edition of 5, 2 APInquire“[We presume] that one has to either be suspicious of photography, or have affection for it; that one either operates a camera, or operates upon photographs. Ruff does both, and more. While his means may have changed a great deal, his ends have remained consistent: to produce a provocative and generous guide ... to photography at large.”—David Campany, creative director, International Center of Photography, New YorkInstallation view, Thomas Ruff: expériences lumineuses, David Zwirner, London, 2025A throughline to the newer series, the earliest work in the exhibition is a never-before-seen print from Ruff’s Porträts (Portraits, 1981–1991/1998–2001). The subjects in this breakthrough body of work—frequently his friends, fellow students, and colleagues—are always expressionless, set against a neutral background and often looking directly at the viewer, as if posing for a passport photograph.Thomas RuffPorträt (B. Ochaim), 1988Inkjet print with Diasec83 1/8 x 65 5/8 inches (211 x 166.6 cm)Edition of 4, 1 APInquire“[The Portraits] owe something to both the pore-by-pore gargantuanism of Chuck Close's paintings and the documentary distance of August Sanders's portrayals of the German people—a split debt that makes them different from both.... Nonetheless, [Ruff’s] work effectively dramatizes a series of encounters—between artist and subject and viewer and object, as well as those between ordinary people.”—Roberta Smith, critic, in a review in The New York Times, 1989Thomas Ruffjpeg to01, 2022Inkjet print with Diasec98 3/8 x 72 7/8 inches (250 x 185 cm)Edition of 3, 2 APInquireThomas RuffSubstrat 41 III, 2009Chromogenic print with Diasec50 5/8 x 71 1/4 inches (128.5 x 181 cm)Edition of 5, 1 APInquireBy contrast, Ruff has since become known for working outside and beyond the apparatus of the camera, establishing a distinct approach to conceptual photography through a variety of strategies, including the purposeful manipulation of computer-generated or preexisting source imagery. Among these are jpegs, begun in 2004; Substrat (Substratum), begun in 2001; and d.o.pe., begun in 2022.Thomas Ruffd.o.pe.07 III, 2022Colaris on velour carpet106 1/4 x 80 1/8 inches (270 x 203.5 cm)Edition of 4, 1 APInquire“Ruff’s pictures rarely play on the mnemonic characteristics of photography. Instead, in his work lies a core interest: to reflect a rigorous or exacting aesthetic analysis of the different species and domains of images, to explore the public and private roles, as well as the contexts, of image reception and production. Thus increasingly the camera, as such, seems either to hold limited interest in the development of Ruff’s images, or has become secondary to their conception.”—Okwui Enwezor, curator, critic, and art historianThomas Ruffneg◊laviniaschulz_03, 2021Chromogenic print11 3/4 x 8 5/8 inches (29.8 x 22 cm)Framed: 27 3/4 x 23 7/8 inches (70.5 x 60.5 cm)Edition of 8, 3 APInquireThese themes are further explored in Ruff’s negatives series, begun in 2014. The examples above, which are on view in London, are based on photographs of the German dancer Lavinia Schulz. For these works, Ruff inverts existing photographs into negatives.Ruff has noted: “[The negative] was actually never considered for itself, it was always only a means to an end.... [I turned] photographs into negatives in order to see their photographic reality reversed. In doing so I noticed that in some of them the light-dark distribution and the composition is far more readily appreciated in the negative than in a paper print. The contrasts were stronger, the figures and objects seemed suddenly more three-dimensional.… Figures were more reminiscent of marble sculpture than photographs of real people.”Thomas Ruffphg.05_II, 2014Chromogenic print with Diasec94 1/8 x 72 1/2 inches (239 x 184 cm)Edition of 4Inquire“Last Wednesday, Thomas was looking at a small pane of glass and discovered that it had wildly blurred fingerprints on it. He then took his camera and photographed them. It is precisely this way of deliberately capturing natural phenomena that interests us, and being able to translate what we capture into different realms is the freedom that today’s technology offers us.”—Wenzel S. Spingler, specialist in 3D visualization and Ruff’s research collaborator on his Photogram seriesThomas RuffStar 16h 56m / -40°, 2020Inkjet on paper with Diasec98 1/4 x 73 5/8 inches (249.4 x 187 cm)Edition of 2, 1 APInquireAs with the negatives, Ruff worked with found imagery as the basis for﻿ Star 16h 56m / -40°, which represents an extension of his Sterne (Stars) series from 1989–1992. Alongside photography, astronomy had long been a persistent interest of the artist’s, and he was frustrated by his inability to create his own images of space and the night sky. He therefore purchased a collection of negatives from the European Southern Observatory, which he utilized to print large-scale, nearly abstract starscapes. As with much of Ruff’s oeuvre, his images of stars underscores the artist's ongoing questioning of the notion of photographic veracity.Installation view, Thomas Ruff: expériences lumineuses, David Zwirner, London, 2025Inquire about works by Thomas RuffGet in Touch"
