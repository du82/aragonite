full_description = "SurveyExhibitionsArtist NewsBiographySelected PressBooksInquireDoug WheelerOver the past six decades, pioneering American artist Doug Wheeler (b. 1939) has become known for his innovative constructions and installations that engage with the perception and experience of light, space, and sound.Learn MoreSurveyExplore all ArtworksDoug WheelerUntitled, 1968/2014Vacuum-formed acrylic, sprayed lacquer on acrylic, electronic transformer, and fluorescent blue neon90 1/2 x 90 1/2 x 5 inches (229.9 x 229.9 x 12.7 cm)Doug WheelerSynthetic Desert G AZ 39 VC 71 CC NM 13, 2013Ink and colored pencil on drafting film36 1/16 x 49 1/8 inches (91.6 x 124.8 cm)Doug WheelerSA MI 75 DZ NY 12, 1975/2012Reinforced fiberglass, LED lights, high intensity fluorescent lights, UV fluorescent lights, quartz halogen lights, DMX controlArchitecturally modified space, composed of two parts: Room 1: 240 x 360 x 144 inches (609.6 x 914.4 x 365.8 cm) Room 2: 564 x 576 x 192 inches (1432.6 x 1463 x 487.7 cm) Total space: 564 x 702 inches (1432.6 x 1783.1 cm)Doug WheelerDW 68 VEN MCASD 11, 1968/2011White UV neon light18 x 34 x 33 feet (548.6 x 1036.3 x 1005.8 cm)Doug Wheeler49 Nord 6 Est 68 Ven 12 FL, 2011-2012Drywall construction, white latex, white epoxy paint, white nylon scrim, acrylic diffusers, and Gro-Lux and white UV neon light188 1/2 x 346 7/8 x 548 5/16 inches (478.7 x 881 x 1392.6 cm)Installation view, Doug Wheeler, 49 Nord 6 Est – FRAC Lorraine – Metz, France, 2012Doug Wheeler49 Nord 6 Est POV Luminiferous Light Volume, 2011-2012Phosphorescent paint applied to existing architecture, metal halide projectors145 11/16 x 240 3/16 x 360 1/2 inches (370 x 610 x 915.6 cm)Doug WheelerUD RU Ice Light Environment 2, 2009Pencil and ink on vellum26 5/8 x 38 1/4 inches (67.6 x 97.2 cm)Doug WheelerUD RU Ice Light Environment 2, 2008 Installation view, Upside Down: Les Arctiques, Musée du quai Branly, Paris, 2008-2009, 2008–2009​Doug WheelerSF NM BI SP 2000, 2000 Installation view, Changing Perceptions: The Panza Collection, Guggenheim Museum, 2000-2001, 2002Doug WheelerUntitled, 1981Black fabric tape applied to existing architecture, natural light18 x 18 x 11 feet (548.6 x 548.6 x 335.3 cm)Centro Internazionale di Sperimentazioni Artistiche Marie-Louise Jeanneret, Boissano, ItalyDoug WheelerSA MI DW SM 2 75 Continuum Atmospheric Environment (Installation view of environment at full brightness), 1975Plywood, coved plaster walls, halogens, black UV fluorescent light, mechanical dimming system2-room space: 20 x 10 x 12 feet (609.6 x 304.8 x 365.8 cm) and 30 x 30 x 16 feet (914.4 x 914.4 x 487.7 cm)Salvatore Ala Gallery, MilanDoug WheelerUntitled (Environmental Light), 1969Steel, coved plaster walls, acrylic paint, nylon scrim, and daylight neon light384 x 384 x 192 inches (975.4 x 975.4 x 487.7 cm) ExhibitionsExplore ExhibitionsView AllArtist NewsExplore Artist NewsDoug Wheeler: LC 71 NY DZ 13 DWCopenhagen ContemporarySeptember 2022Read MoreVija Celmins and Doug WheelerDialogues: The David Zwirner PodcastRead MorePSAD Synthetic Desert IIIRealized for the first time at the Solomon R. Guggenheim Museum in New York2017Read More BiographyDownload Full CVOver the past six decades, American artist Doug Wheeler (b. 1939) has become known for his innovative constructions and installations that engage with the experience of light, space, and sound.Wheeler was raised in the high desert of Arizona and began his career as a painter in the early 1960s while studying at the Chouinard Art Institute (now the California Institute of the Arts) in Los Angeles.The artist became a pioneer of the so-called Light and Space movement that flourished in Southern California in the 1960s and 1970s. His first solo exhibitions were held at the Pasadena Art Museum, Pasadena, California (1968); Ace Gallery, Los Angeles (1970); Galerie Schmela, Düsseldorf (1970); Mizuno Gallery, Los Angeles (1974, 1979); and Galleria Salvatore Ala, Milan (1975). His early environmental work appeared in a number of important exhibitions in the 1960s, 1970s, and 1980s, such as Robert Irwin—Doug Wheeler, Stedelijk Museum, Amsterdam (1969); Kompas 4: Westkust USA (West Coast USA), Stedelijk Van Abbemuseum, Eindhoven, The Netherlands (1969-70; traveled to Museum am Ostwall, Dortmund, West Germany; and Kunsthalle Bern, Switzerland); Larry Bell, Robert Irwin, Doug Wheeler, Tate Gallery, London (1970); Rooms P.S. 1, The Institute for Art and Urban Resources at P.S. 1, New York (1976); Ambiente Arte, 37th Venice Biennale (1976); and The First Show: Painting and Sculpture from Eight Collections, Museum of Contemporary Art, Los Angeles (The Temporary Contemporary) (1983–1984), among others.Wheeler’s work was also included in Sunshine & Noir: Art in L.A. 1960–1997, Louisiana Museum of Modern Art, Humlebaek, Denmark (1997; traveled to Kunstmuseum Wolfsburg, Germany; Castello di Rivoli, Turin; and UCLA/The Armand Hammer Museum of Art and Cultural Center, Los Angeles, through 1999); Changing Perceptions: The Panza Collection at the Guggenheim Museum, Guggenheim Museum Bilbao (2000–2001); Time & Place: Los Angeles 1957–1968, Moderna Museet, Stockholm (2008–2009; traveled to Kunsthaus Zürich as Hot Spots: Rio de Janeiro/Milano/Los Angeles 1956–1969); and Phenomenal: California Light, Space, Surface, Museum of Contemporary Art, San Diego, as part of the Getty Research Institute’s Pacific Standard Time initiative (2011–2012).49 Nord 6 Est – FRAC Lorraine, Metz, France, presented a solo exhibition of Wheeler’s work in 2012, and his work was included in Light Show at Hayward Gallery, Southbank Centre, London, in 2013. The following year, Wheeler presented a new light environment at Palazzo Grassi in Venice in conjunction with the group exhibition The Illusion of Light. In 2016, the artist’s 1976 PS1 installation was re-created for the anniversary exhibition Forty at MoMA PS1, New York.In 2017, The Solomon R. Guggenheim Museum in New York presented Doug Wheeler: PSAD Synthetic Desert III, in which the artist realized a work conceived and drawn in 1971, transforming one of the museum galleries into a hermetic, “semi-anechoic chamber” that reduced ambient sound to imperceptible levels and produced the sensory impression of infinite space, an experience akin to those the artist describes in the vast desert spaces of northern Arizona and New Mexico. Wheeler’s work was on view at the Gropius Bau, Berlin, as part of the exhibition Welt ohne Außen/World without Exterior. Immersive Spaces since the 1960s (2018). Major works by the artist were also featured in the group exhibition Light & Space, Copenhagen Contemporary (2021–2022); and Light, Space, Surface: Works from the Los Angeles County Museum of Art, Addison Gallery of American Art, Phillips Academy, Andover, Massachusetts (2021; traveled to Frist Art Museum, Nashville, in 2022).Wheeler has been represented by David Zwirner since 2011. His first solo presentation with the gallery was in New York in 2012, when he exhibited a new “continuum atmospheric environment.” The artist debuted a new “rotational horizon” installation, a culmination of circular works begun in the 1970s, at David Zwirner New York, in 2014; and in 2016, Doug Wheeler: Encasements was presented at the gallery’s 20th Street location. In New York in 2020, the gallery presented an installation which coincided with the publication by David Zwirner Books of the first major monograph devoted to Wheeler’s work. The most comprehensive overview of the artist’s career to date, it includes scholarship by the late art historian Germano Celant and features extensive illustrations of Wheeler’s most significant works from the early 1960s to the present, as well as previously unpublished images, drawings, and other archival material. A new light installation by the artist was on view at David Zwirner New York in 2024 as part of the exhibition, Doug Wheeler: Day Night Day.Work by the artist is held in prominent institutional collections worldwide, including Glenstone, Potomac, Maryland; Hirshhorn Museum and Sculpture Garden, Washington, DC; Los Angeles County Museum of Art; Museum of Contemporary Art, Los Angeles; Museum of Contemporary Art San Diego; Orange County Museum of Art, Costa Mesa, California; Panza Collection, Mendrisio, Switzerland; Pinault Collection, Paris; San Francisco Museum of Modern Art; Solomon R. Guggenheim Museum, New York; and Stedelijk Museum, Amsterdam. Wheeler lives and works in Santa Fe, New Mexico, and Los Angeles.Download Full CVSelected PressExplore Selected PressLight and shadow art as beautiful as a dream! Exclusive interview with American artist Doug WheelerHarper's Bazaar China, interview by Elizabeth G2020Read MoreDoug Wheeler recreates the sky inside Manhattan’s David Zwirner GalleryThe Spaces, review by Kylie McDowell2020Read MoreHow Much Silence Is Too Much? I Found OutThe New York Times, review by Daniel McDermon2017Read MoreSearching for Silence at Doug Wheeler’s Soundless Dome at the GuggenheimVogue, review by Patricia Garcia2017Read MoreDoug Wheeler: PSAD Synthetic Desert IIIThe Brooklyn Rail, review by Hannah Sage Kay2017Read MoreDesert Silence, Transposed to the Cacophony of New YorkThe New York Times, profile by Randy Kennedy2017Read MoreSelected TitlesExplore BooksDoug WheelerDavid Zwirner Books$75The Helga and Walther Lauffs CollectionSteidl / Zwirner & Wirth$100 Request more informationGet In Touch"
