title = "Raymond Saunders: Déménagement | Paris | February 1—March 22, 2025  | David Zwirner"
description = "David Zwirner is pleased to announce an exhibition of paintings and works on paper by American artist Raymond Saunders (b. 1934) at the gallery’s Paris location. Curated by Ebony L. Haynes, this presentation will be Saunders’s second solo exhibition with David Zwirner and marks the artist’s first exhibition in Paris in twenty years."
full_description = "ExploreChecklistInstallation ViewsExhibitionRaymond Saunders: DéménagementWant to know more?InquireNow OpenFebruary 1—March 22, 2025Opening ReceptionSaturday February 1, 6–8 PMLocationParis108, rue Vieille du Temple75003 ParisTue, Wed, Thu, Fri, Sat: 11 AM-7 PMArtistRaymond SaundersCuratorsEbony L. HaynesView Press ReleaseRaymond Saunders, Untitled, 2006 (detail)David Zwirner is pleased to present Déménagement, an exhibition of paintings and works on paper by American artist Raymond Saunders (b. 1934) at the gallery’s Paris location. Curated by Ebony L. Haynes, this presentation is Saunders’s second solo exhibition with David Zwirner and marks the artist’s first exhibition in Paris in twenty years.ExploreInstallation view, Raymond Saunders: Déménagement, David Zwirner, Paris, 2025Raymond Saunders: DéménagementView Checklist“It’s exciting to be in Paris with this work, thinking about Saunders walking through the city and bringing it back to his studio. His almost diaristic compositions reflect his movement, his loved ones, and his thoughts. Flowers and urnlike vases are recurring motifs in many of Saunders’s works and feature prominently in this exhibition. Some blooms resemble nonnative species, suggesting transatlantic migration and mutation—one wonders if Saunders uses these delicately rendered compositions to speak not only to the ephemerality of nature, but also his own experience.”— Ebony L. HaynesRaymond Saunders, 1970s. Photo by Anthony BarbozaSaunders once called Paris—where he kept a studio, spent summers, and regularly exhibited during the 1990s and 2000s—“a home away from home,” embracing the French capital as a generative place for art making and community building. The city offered a hopeful environment and freer way of life with fewer of the social and racial constraints endemic to American culture, one that held opportunities for artists to be in broader conversation with audiences and institutions at large. Saunders acted on this by opening his studio as a residency of sorts to his students visiting from California, offering them some of the same opportunities that he was given in decades prior.Raymond SaundersUntitled, 2006Acrylic, chalk, collage, and mixed media on canvas48 x 48 inches (121.9 x 121.9 cm)Inquire“Because I live part of the time in Paris, I can go and look at one section or fragment of a painting, and not necessarily go to the museum, which is pretty wonderful....if I know that there’s a Titian, a Velasquez, a Tintoretto, or a Zurbarán or such-and-such, or a Degas, or a Matisse, some place in the environment will metaphorically or sort of in an analogous kind of way, that’s the game that’s in town.... It’s very important...to be in that environment where art exists.”— Raymond SaundersInstallation view, Raymond Saunders: Déménagement, David Zwirner, Paris, 2025Raymond SaundersUntitled, c. 1995Acrylic, spray paint, chalk, collage, and mixed media on door79 7/8 x 35 3/4 inches (202.9 x 90.8 cm)InquireInvitation for the conference “A Visual Arts Encounter: African Americans & Europe,” organized by Raymond Saunders, Palais du Luxembourg, Paris, 1994Raymond Saunders in Paris, 1995. Photo by Clarence Morgan. Courtesy Clarence MorganCatalogue published on the occasion of the exhibition Paris Connections: African American Artists in Paris, curated by Raymond Saunders, Bomani Gallery, San Francisco, 1992In February 1994, Saunders helped organize “A Visual Arts Encounter: African Americans & Europe,” a conference held at the Palais du Luxembourg, Paris, which brought together Black artists, writers, curators, and intellectuals to discuss the experience of Black American artists in Europe. While convenings such as this event and others worked to advance this desire and reflected Saunders’s ongoing dedication to community building, many artists—including Saunders—did not achieve widespread visibility. Nonetheless, this active circle of international artists and intellectuals formed a significant group of cultural figures whose impact on the Paris art world followed in the lineage of kindred expatriate communities before them.Raymond SaundersUntitled, c. 2005Acrylic, spray paint, chalk, collage, and mixed media on wood panel48 x 48 inches (121.9 x 121.9 cm)InquireRaymond Saunders, Untitled, 2010–2015The works in this exhibition bring together Saunders’s extensive formal training with his own observations and lived experience. A vast range of materials and textures entangle in his compositions to create unexpected visual rhymes and resonances that reward careful, sustained looking and allow for a vast and nuanced multiplicity of meanings. The title—déménagement (in English, “moving”)—derives from a collage made in Saunders’s Paris studio that repurposes a box featuring the logo of a French moving company. While this idea speaks to the artist’s own experience of circulating between cities—Pittsburgh, Philadelphia, Oakland, and Paris, among others—and traveling widely throughout his career, it also broadly evokes his ongoing method of sourcing materials for his work in the various locales where he lived and visited, as well as his practice of taking things from one place to another.Installation view, Raymond Saunders: Déménagement, David Zwirner, Paris, 2025Raymond SaundersPittsburgh 07-8, 2007Acrylic, chalk, collage, and mixed media on canvas48 x 48 inches (121.9 x 121.9 cm)InquireSaunders’s dynamic bricolagist approach is evident in the paintings on view in the main gallery. Generally defined by a monochromatic black ground and square-format composition, these paintings on wood panel or canvas are often worked over with white chalk—both a pointed reversal of the traditional figure-ground relationship and a nod to Saunders’s decades spent as a teacher. Enhanced with a characteristic range of other markings, materials, and talismans—some directly linked to the artist’s Parisian life—these compositions demonstrate his singular aesthetic. Many works incorporate motifs that recur throughout Saunders’s mature oeuvre, such as scrawling text, urnlike vases, and flowers, some resembling nonnative species whose presence suggests a transatlantic migration.Raymond Saunders, Pittsburgh 07-8, 2007 (detail)Raymond Saunders, Untitled, 2011 (detail)Raymond Saunders, Untitled, 2011 (detail) Raymond SaundersUntitled, 2011Acrylic and chalk on canvas48 x 48 inches (121.9 x 121.9 cm)Inquire“Each [work] reflects back onto itself through its sheer exuberance and constant referencing of the process and materials of art-making, while also directing attention outward to the expansive world beyond the canvas. Often Saunders’s meanings and encodings are left cryptic, leaving the viewer to rely on guesswork. But even if precise readings are elusive, we relish the sharing of intuition, personal biography, and worldly observation.”—Steven A. Nash, Raymond Saunders: Black Paintings, 1995Raymond Saunders, Untitled, 2005 (detail)Raymond SaundersUntitled, 2005Acrylic and spray paint on canvas54 x 54 inches (137.2 x 137.2 cm)InquireRaymond SaundersUntitled, c. 2010Acrylic, chalk, and spray paint on wood panel48 x 48 inches (121.9 x 121.9 cm)InquireRaymond Saunders, Untitled, 1990 (detail)This show anticipates the group exhibition Paris noir: Circulations artistiques, luttes anticoloniales 1950–2000, which includes work by Saunders and opens at Centre Pompidou, Paris, on March 19, 2025, as well as the artist’s forthcoming major solo exhibition Raymond Saunders: Flowers from a Black Garden, which opens March 22, 2025, at the Carnegie Museum of Art, Pittsburgh, before traveling to the Orange County Museum of Art, Costa Mesa, California.Raymond SaundersUntitled, 2011Acrylic and chalk on wood panel48 x 48 inches (121.9 x 121.9 cm)Inquire“Saunders regarded Paris as ‘a home away from home,’ a city whose beauty and history he appreciated and where he collected visual information. While walking through the streets of the city, the artist observed and listened. For him, the relationship of the French to people of color was the result of the presence of men like Richard Wright or Frantz Fanon, of a common humanistic journey.”—Marie-Françoise Sanconie, “Paris 1945–1991,” in Paris Connections, 1992Installation view, Raymond Saunders: Déménagement, David Zwirner, Paris, 2025Also exhibited is a selection of paintings made on doors and panels, all of which originate from Saunders’s time in Paris. These works, which are often displayed leaning against the wall, further blur the boundaries between painting and assemblage and open themselves to additional layers of meaning. Installed together, these towering paintings inhabit a physicality that suggests both presence and displacement—embodying an artist who works across mediums, formats, and cities to produce an oeuvre that is at once constructed and improvisatory, didactic and deeply felt.Raymond SaundersUntitled, 1995-2000Acrylic, spray paint, chalk, collage, and mixed media on panel80 1/4 x 32 5/8 inches (203.8 x 82.9 cm)InquireRaymond SaundersPictures Talking the Talk, 1995-2000Acrylic, chalk, collage, and mixed media on door74 x 29 3/4 inches (188 x 75.6 cm)InquireRaymond SaundersUntitled, 1995-2000Acrylic, chalk, collage, and mixed media on door79 1/4 x 32 3/4 inches (201.3 x 83.2 cm)InquireRaymond Saunders, Untitled, 1995–2000 (detail)Raymond Saunders, Untitled, 1995–2000 (detail)Raymond Saunders, Untitled, 1995–2000 (detail) Installation view, Raymond Saunders: Déménagement, David Zwirner, Paris, 2025An adjacent gallery space contains a focused installation of intimate, elegantly restrained depictions of flowers rendered in watercolor and graphite on white paper. Sparse, graceful, and a surprising counterbalance to the larger, black-ground paintings, these compositions showcase the fine and occasionally whimsical quality of Saunders’s line. The artist has employed lyrical contours and gestural marks to depict single or multiple blooms that, grouped together, resemble a chart of floral species or a collection of flower pressings.Raymond SaundersUntitled, 1990-2000Watercolor, acrylic, and graphite on paper25 5/8 x 19 3/4 inches (65.1 x 50.2 cm)Framed: 29 3/4 x 23 7/8 inches (75.6 x 60.6 cm)InquireRaymond Saunders, Untitled, c. 2000 (detail)Raymond Saunders, Untitled, 1990–2000 (detail)Raymond Saunders, Untitled, 1990–2000 (detail) Raymond SaundersUntitled, c. 2000Watercolor and acrylic on paper25 5/8 x 19 3/4 inches (65.1 x 50.2 cm)Framed: 29 3/4 x 23 7/8 inches (75.6 x 60.6 cm)InquireRaymond SaundersUntitled, 1990-2000Watercolor, acrylic, and collage on paper25 5/8 x 19 3/4 inches (65.1 x 50.2 cm)Framed: 29 3/4 x 23 7/8 inches (75.6 x 60.6 cm)Inquire“To be present and to interact. I travel to see and to observe. I want to stay engaged with how I feel and what I see.”—Raymond SaundersInquire about works by Raymond SaundersGet in Touch"
