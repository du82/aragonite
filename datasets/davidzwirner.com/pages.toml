["https://davidzwirner.com/exhibitions/2025/frank-walter-moon-voyage"]
title = "Frank Walter: Moon Voyage | Paris | January 10—March 22, 2025  | David Zwirner"
description = "David Zwirner is pleased to present Moon Voyage, an exhibition of work by Antiguan artist, writer, and polymath Frank Walter (1926–2009) at the gallery’s Paris location."
full_description = "ExploreChecklistInstallation ViewsExhibitionFrank Walter: Moon VoyageWant to know more?InquireNow OpenJanuary 10—March 22, 2025Opening ReceptionFriday, January 10, 6–8 PMLocationParis108, rue Vieille du Temple75003 ParisTue, Wed, Thu, Fri, Sat: 11 AM-7 PMArtistFrank WalterView Press ReleaseFrank Walter, Untitled, n.d. (detail)David Zwirner is pleased to present Moon Voyage, an exhibition of work by the Antiguan artist, writer, and polymath Frank Walter (1926–2009) at the gallery’s Paris location. Organized in close collaboration with the art historian Barbara Paca and the Walter family, this is the artist’s fourth solo exhibition with the gallery and the first dedicated presentation of his work in Paris.The exhibition coincides with the inclusion of Walter’s work in the group show Après la fin. Cartes pour un autre avenir, which opens January 25, 2025, at Centre Pompidou-Metz, France, and follows the artist’s recent institutional solo shows at the Garden Museum, London (2023), and The Drawing Center, New York (2024). His work was recently included in group exhibitions at the Fondation Carmignac, Hyères, France (2023), and the Bourse de Commerce – Pinault Collection, Paris (2024). On the occasion of the exhibition, we’re pleased to publish a new essay by the exhibition’s curator, Barbara Paca.ExploreFrank Walter: Moon VoyageView ChecklistInstallation view, Frank Walter: Moon Voyage, David Zwirner, Paris, 2025Frank Walter, Moon Crater, c. 1994 (detail)Installation view, Frank Walter: Moon Voyage, David Zwirner, Paris, 2025Frank Walter, Untitled (Lavender Sky and Tall, Thick, Green Grass), n.d. (detail) Frank Walter, Moon Voyage, c. 1994 (detail)Francis Archibald Wentworth Walter, known as Frank Walter, was born on Horsford Hill, Antigua, on September 11, 1926. Feeling a deep connection to his native land, he studied agriculture and the sugar industry—the basis of Antigua’s economy—and at the age of twenty-two became the first person of color to work as a manager within the Antiguan Sugar Syndicate. He spent much of the 1950s traveling and learning advanced agricultural and industrial techniques in England, Scotland, and West Germany. During this time, he experienced the depths of racism and bias against people of color.Frank WalterMoon Voyage, n.d.Oil on wood panel11 1/2 x 18 1/2 inches (29.2 x 47 cm)Framed: 16 5/8 x 23 3/8 inches (42.2 x 59.4 cm)While in Europe, Walter pursued a variety of creative and artistic outlets, including drawing and painting as well as writing prose, philosophical texts, and poetry. The artist returned to the Caribbean in 1961, where, in addition to painting, drawing, and writing, he began making sculptures, photographs, and sound recordings. He spent most of his remaining lifetime in relative isolation, reflecting, writing, and making art inspired by his thoughts, knowledge, journeys, and surroundings.Frank WalterMoon Crater, c. 1994Oil on wood11 x 18 inches (27.9 x 45.7 cm)Framed: 18 5/8 x 25 1/8 inches (47.3 x 63.8 cm)Inquire“Throughout his artistic practice, Walter is, in effect, striking a balance between the universe’s larger patterns and the smaller details of lived experience. And throughout, his search for harmony consciously harnesses the therapeutic value of the arts in an astounding array of mediums.”—Barbara Paca, art historian, in her new essay, “Moon Voyage”Frank WalterUntitled (Red and black mountains are reminiscent of those in Moon Crater), n.d.Oil on press board7 1/2 x 13 3/4 inches (19.1 x 34.9 cm)Framed: 16 1/4 x 22 inches (41.3 x 55.9 cm)InquireFrank WalterRight Side of The Milky Way Galaxy, n.d.Oil on wood panel11 1/2 x 16 5/8 inches (29.2 x 42.2 cm)Framed: 18 1/8 x 25 1/4 inches (46 x 64.1 cm)Moon Voyage takes its title from a painting in Walter’s Milky Way Galaxy series, a body of work that expresses the artist’s interest in outer space, extraterrestrial life, and the mysteries of the universe. A group of works from this series—which have rarely before been exhibited together—forms one of several focal points of this show.Frank Walter, Right Side of The Milky Way Galaxy, c. 1994 (detail)Frank Walter, Untitled, n.d. (detail) Painted toward the end of Walter’s life, when he lived without electricity at his home on Bailey Hill, the works reflect the artist’s proximity to and appreciation for the night sky, as he spent most evenings in darkness. Here he employs a palette of golden yellow, gray, black, white, and red to fantastically depict zooming spaceships, celestial light beams, and moon craters—evocative motifs that emerged out of his practice of gazing at the stars.Frank WalterCentrifugal Sun Rockets, c. 1994Oil on wood panel12 x 14 3/4 inches (30.5 x 37.5 cm)Framed: 17 x 19 3/4 inches (43.2 x 50.2 cm)InquireInstallation view, Frank Walter: Moon Voyage, David Zwirner, Paris, 2025“There is no typical Frank Walter. His range as a painter is extensive and unfettered…. His cosmological paintings have a transcendental glow, his abstract works are systematic, the individuality of his figurative painting is captivating, and his landscapes gain strength through their clear abstractions.”—Susanne Pfeffer, director, Museum für Moderne Kunst, FrankfurtFrank WalterUntitled (Tall Man in Red Jumpsuit with White Hat and Horns in a Futuristic City), n.d.Oil on the back of a black-and-white photograph10 x 8 inches (25.4 x 20.3 cm)Framed: 13 5/8 x 11 5/8 inches (34.6 x 29.5 cm)InquireAnother selection of works in the exhibition further highlights Walter’s keen sense of observation and his vivid imagination, through figurative and representational paintings of subjects both real and envisioned. Ranging from images of heraldic devices to tranquil nature scenes or colorful architectural facades, these compositions speak to the breadth of Walter’s practice and the scope of his vision.Frank WalterUntitled (White Bird Standing on One Leg), n.d.Oil on cardstock8 3/8 x 6 3/8 inches (21.3 x 16.2 cm)Framed: 13 1/4 x 11 1/4 inches (33.7 x 28.6 cm)InquireThroughout his life, Walter shifted from the landscape genre to abstraction and back again, returning to certain vistas or motifs as a way of working through various ideas and compositional strategies. His paintings range from highly individualistic, vividly colored landscapes that evoke the Romantic spirit of William Blake and Caspar David Friedrich to systematic, abstract compositions reminiscent of the paintings of Hilma af Klint, all rendered in the artist’s own absorbing palette and distinctive visual style.Frank WalterBio-Forms / Intergalactic Botany, n.d.Colored pencil on paper9 5/8 x 7 1/4 inches (24.5 x 18.4 cm)Framed: 14 3/4 x 12 1/4 inches (37.3 x 31.2 cm)Frank WalterUntitled (Abstracted Townscape with Crescent Moon in Purple, Green, Grey, and Tan), n.d.Oil on Masonite in artist's frame13 3/4 x 15 5/8 inches (34.9 x 39.7 cm)Framed: 18 5/8 x 20 5/8 inches (47.3 x 52.4 cm)InquireStruggling with mental health issues throughout his life, Walter often experienced hallucinations and other neurological phenomena. To that end, the language of abstraction provided him a means of expressing personal experiences and feelings. He often mixed abstract and figurative forms in his compositions, drawing from wide-ranging sources including architecture, games, science, and astronomy.Frank Walter, Untitled (Abstracted Townscape with Crescent Moon in Purple, Green, Grey, and Tan), n.d. (detail)Frank Walter, Bio-Forms / Intergalactic Botany, n.d. (detail) “In these abstract, geometric paintings, Walter fashions a painterly world that deconstructs and then reconstitutes the material world from its component parts to create an entirely new universe of color, form, and space.... [He] has created an artistic world of another dimension, which harnesses and refracts the brutal assaults of history and lived experience.”—Gilane Tawadros, director, Whitechapel GalleryFilm by Thomas Barzilay Freund, 2025, commissioned by the Frank Walter EstateAt a young age, Walter learned the specifics of his ancestry: that he was a descendant of enslaved persons and plantation owners. With this knowledge came the understanding that his existence was inextricably entwined with histories of slavery and sexual violence. Coupled with the racism and brutality he became victim to as an adult, Walter turned to art as the vehicle by which he tried to reconcile his expectations around life as the ancestor of a white man with the reality of his experiences.Frank WalterUntitled (Self-Portrait), n.d.Oil on photographic paper backed with cardstock10 x 8 inches (25.4 x 20.3 cm)Framed: 18 7/8 x 16 7/8 inches (47.9 x 42.9 cm)InquireInstallation view, Frank Walter: Moon Voyage, David Zwirner, Paris, 2025A full wall of the gallery space is devoted to an expansive installation of Walter’s signature Polaroid paintings—minute traditional landscapes made on the packaging of Polaroid film cartridges. These intimately scaled, vibrantly colored, and powerfully reductive compositions showcase Walter in his essence, serving as miniature windows into the artist’s extraordinary world.Frank WalterUntitled (Lavender Sky and Tall, Thick, Green Grass), n.d.Oil on Polaroid film cartridge box4 x 3 1/4 inches (10 x 8.2 cm)Framed: 9 1/2 x 8 3/4 inches (24.1 x 22.2 cm)Inquire“I think that was the realization of seeing Walter’s extraordinary work: that ideas (if not the harsh reality) of center and periphery—artistic, historical, geographical, or political—are so dependent on perspective as to be almost a mirage.”—Nicholas Cullinan, director, The British MuseumFrank WalterUntitled (Meadow and Sea at Dawn), n.d.Oil on Polaroid film cartridge box4 x 3 1/4 inches (10 x 8.2 cm)Framed: 9 1/2 x 8 3/4 inches (24.1 x 22.2 cm)InquireFrank WalterUntitled (Rainbow Sky, Sailboat), n.d.Oil on Polaroid film cartridge box4 x 3 1/8 inches (10 x 8 cm)Framed: 9 1/2 x 8 3/4 inches (24.1 x 22.2 cm)InquireWalter painted landscapes and seascapes throughout his life, often depicting his native Antigua, which he represented in rich tropical colors, and Europe, where he traveled during the 1950s. Using the materials available to him, he painted his smaller scale landscapes on Polaroid film cartridges, cardstock, and the backs of photographs, giving these works a unique object quality.Frank Walter, Untitled (Meadow and Sea at Dawn), n.d. (detail)Frank Walter, Untitled (Rainbow Sky, Sailboat), n.d. (detail) “All artists take license, though Walter’s Antigua seems especially fertile ground for it. He was a rare plantation manager of color, a British subject who lived well into the island’s independence, a descendant of both enslavers and enslaved—and thus spiritually entitled to a British culture kept out of his reach.”—Walker Mimms, The New York TimesFrank WalterUntitled (Sunset Over Black Hills), n.d.Oil on Polaroid film cartridge box4 x 3 1/4 inches (10 x 8.2 cm)Framed: 9 1/2 x 8 3/4 inches (24.1 x 22.2 cm)InquireFor Walter, making art was not just a personal outlet but a method of healing and a way to contribute to the collective well-being. “He knew well the fragility of a human mind, as he was high functioning, finely tuned, and therefore intensely fragile,” writes Barbara Paca. After studying his works and writings in depth, the neurosurgeon Caitlin Hoffman characterized Walter’s talent as a unique form of creative brilliance distinct from madness.Installation view, Frank Walter: Moon Voyage, David Zwirner, Paris, 2025“Looking at his paintings, none very large, all detailed, was like looking through a scrim at someone else’s dreams. You could see every line, every color, but you had to peer past his poetic resolve not to tell everything, not to reveal all the world, but to show all the world in fragments ... because it was truer to what he knew: taking the fragments that life gave him, building on them and making it whole.”—Hilton Als, curator and criticFrank WalterUntitled (Green Land, Rendezvous Bay), n.d.Oil on Polaroid card3 7/8 x 3 1/4 (9.8 x 8.3 cm)Framed: 9 1/2 x 8 3/4 inches (24.1 x 22.2 cm)InquireFrank WalterUntitled (Hurricane Sky, Yellow Tree, Brown Tree), n.d.Oil on Polaroid card3 7/8 x 3 1/4 inches (9.8 x 8.3 cm)Framed: 9 1/2 x 8 3/4 inches (24.1 x 22.2 cm)InquireThe challenges Walter faced eventually led him to retreat inward. This solitude became both a refuge and a source of inspiration for his art. His landscape paintings reflect the quietude and introspection of his existence, capturing the beauty and vastness of his surroundings with a dreamlike quality. These works, often infused with an almost spiritual reverence for nature, stand as a testament to Walter’s ability to transform personal hardship into poetic visual expressions of place and self.Frank Walter, Untitled (Hurricane Sky, Yellow Tree, Brown Tree), n.d. (detail)Frank Walter, Untitled (Green Land, Rendezvous Bay), n.d. (detail) Frank WalterUntitled (Pale Blue Sun), n.d.Oil on Polaroid film cartridge box4 x 3 1/4 inches (10 x 8.2 cm)Framed: 9 1/2 x 8 3/4 inches (24.1 x 22.2 cm)Inquire“We are all connoisseurs of art, at any stage… Art is a teacher, adding much to knowledge. The comforter of the soul, when life grows cold. Religious or secular, moral and kind, art is a talent bestowed by providence. Surely by divine providence it is a human design to pursue art for delight, more than opulence.”—Frank WalterFrank Walter in his studio on Market Street, St. John’s, AntiguaInquire about works by Frank WalterGet in Touch"
