description = "Chris Ofili creates intricate, kaleidoscopic paintings and works on paper that deftly merge abstraction and figuration. Ofili rose to prominence in…"
full_description = '''SurveyExhibitionsArtist NewsBiographySelected PressBooksInquireChris OfiliChris Ofili (b. 1968) creates atmospheric and enigmatic paintings investigate the intersection of desire, identity, and representation. Portraying characters from a range of aesthetic and cultural sources through a kaleidoscopic visual mode that bridges abstraction and figuration, his works serve as sites for journeys of creative transformation.Learn MoreSurveyExplore all ArtworksChris OfiliThe Judgement of Paris - Crowning, 2022-2023Oil and charcoal on linen38 1/4 x 62 1/4 inches (97.2 x 158.1 cm)Chris OfiliThe Great Beauty, 2020-2023Oil and charcoal on linen78 3/4 x 122 inches (200 x 310 cm)Chris OfiliWaterfall - artist & muse (after Boscoe Holder), 2022Oil and charcoal on linen63 1/8 x 39 1/8 inches (160.3 x 99.4 cm)Chris OfiliSiren, 2019Oil, gold leaf, and charcoal on linen63 1/4 x 39 inches (160.5 x 99.2 cm) Chris OfiliSleeper (Calypso), 2019Oil, gold leaf, and graphite on linen39 1/8 x 63 inches (99.4 x 160 cm)Chris OfiliSleeper 2 (Odysseus), 2019Oil, gold leaf, and graphite on linen39 x 63 1/4 inches (99.1 x 160.7 cm) ExhibitionsExplore ExhibitionsView AllArtist NewsExplore Artist NewsChris Ofili: Harvester Featured as Large-Scale Stage Backdrop Multiple venues, including the Barbican Centre, London and Auditorium Parco della Musica, RomeSeptember 2023Read MoreChris Ofili Included in The Time is Always Now: Artists Reframe the Black FigureNational Portrait Gallery, LondonFebruary 2024Read MoreChris Ofili: RequiemTate Britain, London, United KingdomSeptember 2023-2033Read MoreIn the Black FantasticKunsthal Rotterdam, Netherlands2022–2023Read MoreIn the Black FantasticHayward Gallery, LondonRead MoreIn Our Time: Selections from the Singer CollectionScottsdale Museum of Contemporary Art (SMoCA), Scottsdale, AZ2022–2023Read MoreChris Ofili: The Othello PrintsWallach Art Gallery, Columbia University, New YorkJanuary 2022Read MoreLife Between Islands: Caribbean-British Art 1950s-NowTate, London2021–2022Read MoreChris Ofili and Emily WilsonDialogues: the David Zwirner PodcastOctober 2019Read More BiographyPortrait of Chris Ofili, 2017. Photo by Carlos AriasDownload Full CVChris Ofili’s (b. 1968) atmospheric and enigmatic paintings investigate the intersection of desire, identity, and representation. Portraying characters from a range of aesthetic and cultural sources through a kaleidoscopic visual mode that bridges abstraction and figuration, his works serve as sites for journeys of creative transformation. Born in Manchester, England, Ofili received his BFA from the Chelsea School of Art, London, in 1991 and his MFA from the Royal College of Art, London, in 1993. He has been working with David Zwirner since 2005.In 2023, Requiem, a major site-specific mural by Ofili, was unveiled at Tate Britain, London, and will remain on long-term view. In 2022, the Wallach Art Gallery, Columbia University, New York, presented Chris Ofili: The Othello Prints, in conjunction with a yearlong festival centered on Duke Ellington and Billy Strayhorn’s Shakespeare-inspired jazz piece. In 2017, the National Gallery, London, presented Chris Ofili: Weaving Magic, which marked the first time the artist had worked in the medium of tapestry. In 2012, Ofili designed sets and costumes for Metamorphosis: Titian 2012, a collaborative interdisciplinary project organized with The Royal Ballet in London. The artist’s first major solo museum exhibition in the United States, Chris Ofili: Night and Day (2014–2015), was held at the New Museum, New York, and subsequently traveled to the Aspen Art Museum in Colorado.Other monographic exhibitions have taken place at the Arts Club of Chicago (2010); Tate Britain, London (2005 and 2010); Kestner Gesellschaft, Hanover, Germany (2006); and The Studio Museum in Harlem, New York (2005). In 2015, Ofili’s work was included in All the World’s Futures, the International Art Exhibition of the 56th Venice Biennale, curated by Okwui Enwezor; and Ofili represented Britain at the British Pavilion, 50th Venice Biennale (2003). In 2017, Ofili was a recipient of Commander of the Most Excellent Order of the British Empire (CBE), and in 1998, he was awarded the prestigious Turner Prize.The artist’s works are represented in prominent institutional collections worldwide, including The British Museum, London; The Broad, Los Angeles; Carnegie Museum of Art, Pittsburgh; Centre national des arts plastiques, Puteaux, France; The Dakis Joannou Collection, Athens; Dallas Museum of Art; Fortress House Museum, Gibraltar; Glenstone Museum, Potomac, Maryland; Hammer Museum, Los Angeles; Institute of Contemporary Art, Miami; The Metropolitan Museum of Art, New York; Museu Coleção Berardo, Lisbon; Museum of Contemporary Art, Los Angeles; The Museum of Modern Art, New York; National Gallery of Art, Washington, DC; National Gallery of Canada, Ottawa; National Portrait Gallery, London; Pérez Art Museum Miami; Royal College of Art, London; Rubell Museum, Miami; Saastamoinen Foundation Art Collection, Helsinki; San Francisco Museum of Modern Art; The Studio Museum in Harlem, New York; Tate, United Kingdom; Victoria and Albert Museum, London; Walker Art Center, Minneapolis; and Zeitz Museum of Contemporary Art, Cape Town.Download Full CVSelected PressExplore Selected PressChris Ofili on His Epic Three-Wall Grenfell Fresco at the Tate BritainThe Guardian, interview by Gary Younge2023Read MoreLetting Go of OthelloThe Paris Review2019Read MoreCollector Steven Cohen Gifts Chris Ofili's Holy Virgin Mary To MoMAArtforum2018Read MoreChris Ofili’s Frustrating, Profound "Paradise Lost"The New Yorker, review by Doreen St. Félix2017Read MoreThe Fearless Chris Ofili Enters His Own Personal Paradise LostNew York Magazine, review by Jerry Saltz2017Read MoreChicago Art Museum Opens a Restaurant Named for MarisolThe New York Times, article by Florence Fabricant2017Read MoreLisa Brice, Peter Doig, and Chris Ofili Bring Trinidad to New YorkVogue, article by Dodie Kazanjian2017Read MoreSelected TitlesExplore BooksChris Ofili: Joyful SorrowVictoria Miro/David Zwirner Books$60William Shakespeare × Chris Ofili: OthelloDavid Zwirner Books$30Chris Ofili: Paradise Lost David Zwirner Books$35Chris Ofili: 2000 WordsDeste Foundation for Contemporary Art$22Chris Ofili: Night and DaySkira Rizzoli $75Chris OfiliTate PublishingChris OfiliRizzoli$85Chris Ofili: Devil's PieDavid Zwirner / Steidl$50 Request more informationGet In Touch'''
