["https://davidzwirner.com/about"]
title = "About Us | David Zwirner"
description = "David Zwirner is an art gallery with locations in New York, Los Angeles, London, Paris and Hong Kong. We present physical and online exhibitions, podcasts, books, and more."
full_description = "AboutDavid Zwirner is a contemporary art gallery with locations in New York, Los Angeles, London, Paris, and Hong Kong, and currently represents more than seventy artists and estates. The gallery has been home to innovative, singular, and pioneering exhibitions across a variety of media and genres. Active in both the primary and secondary markets, David Zwirner has helped foster the careers of some of the most influential artists working today and has maintained long-term representation of a wide-ranging, international group of artists.In 1993, David Zwirner opened his eponymous gallery on Greene Street in New York’s SoHo neighborhood. In 2002, Zwirner relocated his gallery from SoHo to West 19th Street in Chelsea. In 2012, the gallery expanded, opening on Grafton Street in the heart of London’s Mayfair district. Coinciding with its twentieth anniversary in 2013, David Zwirner inaugurated a new five-story exhibition and project space on West 20th Street in New York.In 2017, the gallery opened on the Upper East Side of Manhattan and launched David Zwirner Online, the gallery’s online viewing room. David Zwirner’s first gallery in Asia opened in 2018 in Hong Kong, and in 2019, David Zwirner opened its first Paris gallery. In 2021, David Zwirner opened 52 Walker, a gallery space in New York programmed and led by senior director Ebony L. Haynes. In 2023, David Zwirner opened its first gallery spaces in Los Angeles.In addition to the gallery program, David Zwirner produces content through David Zwirner Online; David Zwirner Books, the gallery’s publishing arm that launched in 2014; the podcast Dialogues, which premiered its first season in 2018; and Utopia Editions, the gallery’s fine art print publisher, launched in the fall of 2021.In 2021, David Zwirner also launched a new stand-alone company, Platform—an online destination for buying art from today’s most sought-after artists.View Our GalleriesLearn MoreSelect StaffLearn More30 Years of David ZwirnerWe are pleased to celebrate 30 years with the opening of our new flagship Los Angeles gallery and an exhibition featuring works by all of the gallery's artists.Read MoreContactSales Inquiries inquiries@davidzwirner.com Press Inquiries press@davidzwirner.com Rights and Reproductions Inquiries rights@davidzwirner.com Research Inquiries research@davidzwirner.com General Inquiries newyork@davidzwirner.com losangeles@davidzwirner.com london@davidzwirner.com hongkong@davidzwirner.com paris@davidzwirner.com Secondary Market Inquiries consignments@davidzwirner.com 52 Walker info@52walker.com David Zwirner Books info@davidzwirnerbooks.comWork at David ZwirnerExplore Our Open PositionsBe the first to knowSubscribe to receive emails on upcoming exhibitions, available works, artist events, and more.Sign Up"
