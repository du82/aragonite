full_description = "SurveyExhibitionsArtist NewsBiographySelected PressBooksInquireBarbara KrugerSince the late 1970s, Barbara Kruger (b. 1945) has powerfully and directly engaged with viewers through her distinctive visual language, utilizing images, text, and technology as tools of communication to reveal and question established power structures and social constructs. Her potent visuality and incisive observations on issues of value, gender, marginality, and the construction of consensus continue to be singularly recognizable and resonant today.Learn MoreBarbara Kruger: No CommentARoS Aarhus Art Museum, Aarhus, DenmarkNovember 29, 2024–April 21, 2025Read MoreSurveyExplore all ArtworksBarbara KrugerInstallation view, Barbara Kruger: Bitte lachen / Please cry, Neue Nationalgalerie, Berlin, 2022. Courtesy the artist and Sprüth Magers / Mies van der Rohe, VG Bild-Kunst, Bonn 2022. Photo by Timo OhlerBarbara KrugerInstallation view, 59th Venice Biennale: The Milk of Dreams, Venice, Italy, 2022. Photo by Maris MezulisBarbara KrugerInstallation view, Barbara Kruger: Thinking of You. I Mean Me. I Mean You, Museum of Modern Art, New York, 2022. © 2022 The Museum of Modern Art, New York. Photo by Emile AskeyBarbara KrugerInstallation view, Barbara Kruger: Thinking of You. I Mean Me. I Mean You, Serpentine South, London, 2024. Photo by George DarrellBarbara KrugerUntitled (No Comment), 2020Three-channel video installation, sound, 9 min 25 secOverall dimensions variableEdition of 4, 2 APBarbara KrugerUntitled (Please...), 2023Archival pigment print40 x 60 inches (101.6 x 152.4 cm)Framed: 41 1/2 x 61 3/8 inches (105.4 x 155.9 cm)Edition of 10, 3 APBarbara KrugerUntitled (Don't...), 2023Archival pigment print40 x 60 inches (101.6 x 152.4 cm)Framed: 41 1/2 x 61 3/8 inches (105.4 x 155.9 cm)Edition of 10, 3 APBarbara KrugerUntitled (The work is about...), 1979/2020 Single-channel video installation, silent, 5 min 38 sec Barbara KrugerUntitled (Our Leader), 1987/2020Single-channel video on LED panel, sound, 24 sec137 7/8 x 78 3/4 inches (350.1 x 200.1 cm)Edition of 1, 1 AP LUMA FoundationBarbara KrugerUntitled (Remember me), 1988/2020Single-channel video on LED panel, sound, 23 sec137 7/8 x 98 1/2 inches (350.1 x 250.1 cm)Edition of 1, 1 APBarbara KrugerInstallation view, Barbara Kruger: Thinking of You. I Mean Me. I Mean You, Art Institute of Chicago, 2021Barbara KrugerUntitled (It’s our pleasure to disgust you), 1989Photographic silk screen on vinyl90 x 77 inches (228.6 x 195.6 cm)Denver Art Museum ExhibitionsExplore ExhibitionsView AllArtist NewsExplore Artist NewsBarbara Kruger: Solo Exhibition at the Guggenheim BilbaoGuggenheim Bilbao, Bilbao, SpainJune 24–September 11, 2025Read MoreBarbara Kruger: No CommentARoS Aarhus Art Museum, Aarhus, DenmarkNovember 29, 2024–April 21, 2025Read MoreBarbara Kruger Commission for a New JFK Terminal AnnouncedTerminal 6 at John F. Kennedy International Airport, Queens, United StatesJuly 16, 2024Read MoreBarbara Kruger: Thinking of You. I Mean Me. I Mean You.Serpentine South, London, United KingdomFebruary 2024Read MoreBarbara Kruger Awarded the 2023 Distinguished Artist Award for Lifetime Achievement from the College Arts AssociationFebruary 2023Read MoreBarbara Kruger: Untitled (Hope/Fear)ICA Boston, Boston, United StatesNovember 2022Read MoreBarbara Kruger: Thinking of You. I Mean Me. I Mean You.Museum of Modern Art, New York, United StatesJuly 2022Read MoreBarbara Kruger: Please laugh / Please cryNeue Nationalgalerie, Berlin, GermanyApril 2022Read MoreBarbara Kruger Included in the 2022 Venice BiennaleVenice Biennale, Venice, Italy2022Read MoreBarbara Kruger: Thinking of You. I Mean Me. I Mean You.Los Angeles County Museum of Art, Los Angeles, United StatesMarch 2022Read MoreBarbara Kruger: Thinking of You. I Mean Me. I Mean You.Art Institute Chicago, Chicago, United StatesSeptember 2021Read MoreBarbara Kruger Included in Remix of The Met’s Landmark “Pictures Generation” Exhibition The Metropolitan Museum of Art, New York, United StatesOctober 2020Read More BiographyDownload Full CVSince the late 1970s, Barbara Kruger (b. 1945) has powerfully and directly engaged with viewers through her distinctive visual language, utilizing images, text, and technology as tools of communication to reveal and question established power structures and social constructs. Her potent visuality and incisive observations on issues of value, gender, marginality, and the construction of consensus continue to be singularly recognizable and resonant today. Kruger rose to prominence in the early 1980s, creating large-scale black-and-white photo-based images often framed in red and overlaid with the language of direct address. In the decades since, the artist has adapted her iconic visual language into a wide variety of formats, from lithographs, screenprints, and digital printing to monumental wall and floor based installations that engage the power of moving images via video and massive LED works.In 2022, the artist's first presentation with the gallery, Barbara Kruger, spanned the gallery's three locations on West 19th Street in New York.In 1999–2000, The Museum of Contemporary Art, Los Angeles, organized a mid-career retrospective highlighting the artist’s work from 1978 to the present that traveled to the Whitney Museum of American Art, New York. Other significant solo exhibitions of Kruger’s work have been organized by the Palazzo delle Papesse - Centro Arte Contemporanea, Siena (2002); Skarstedt Gallery, New York (2003, 2009); Moderna Museet, Stockholm (2008–2011); Schirn Kunsthalle, Frankfurt (2010–2011); Pinakothek der Moderne, Munich (2011–2012); Kunsthaus Bregenz, Austria (2013–2014); Modern Art Oxford (2014); National Gallery of Art, Washington, DC (2016-2017); Amorepacific Museum of Art, Seoul (2019); and the Neue Nationalgalerie, Berlin (2022). Barbara Kruger: Thinking of You, I Mean Me, I Mean You was on view in 2021 at the Art Institute of Chicago, and later traveled to the Los Angeles County Museum of Art in 2022. Presented in conjunction with this major solo exhibition was a large-scale site-specific installation by the artist that was on view in the Marron Family Atrium of The Museum of Modern Art, New York in 2022.Kruger has created a number of public installations, which have appeared in museums, municipal buildings, train stations, and parks, as well as on buses and billboards. Site-specific projects by the artist include installations for the Public Art Fund, New York (1989, 1991, 1997, and 2000); Whitney Museum of American Art, New York (1990 and 2010); The Los Angeles County Museum of Art (2008); Art Gallery of Ontario, Toronto (2010); Hirshhorn Museum and Sculpture Garden, Washington, DC (2012); The Hammer Museum, Los Angeles (2014); Vancouver Art Gallery (2016); Metro Bellas Artes, Mexico City (2016); The Museum of Contemporary Art, Los Angeles (2018 and 2020); and the Isabella Stewart Gardner Museum, Boston (2021), among others. At the Institute of Contemporary Art, Boston, a new installation by the artist is on view until 2024.In 2005, Kruger was awarded the Golden Lion for Lifetime Achievement at the Venice Biennale, where she was also commissioned to design the facade of Italy’s national pavilion. In 2019, the artist was awarded the Kaiserring (or “Emperor’s Ring”) prize from the city of Goslar, in Germany. An installation by the artist was presented at the 59th Venice Biennale in 2022.Work by the artist is represented in international museum collections, including the Art Institute of Chicago; The Broad, Los Angeles; Fonds régional d’art contemporain (FRAC) de Bourgogne, Dijon; Institute of Contemporary Arts, London; Los Angeles County Museum of Art; The Metropolitan Museum of Art, New York; Musée d’art moderne et d’art contemporain, Nice, France; Museum of Contemporary Art, Chicago; Museum of Contemporary Art, Los Angeles; Museum of Fine Arts, Boston; Museum Ludwig, Cologne; The Museum of Modern Art, New York; National Gallery of Art, Washington, DC; Saint Louis Art Museum, Saint Louis; Seibu Museum of Art, Tokyo; Solomon R. Guggenheim, New York; Tate, United Kingdom; and the Whitney Museum of American Art, New York. Kruger lives and works in Los Angeles and New York.Download Full CVSelected PressExplore Selected Press“Feels Like Life”​ | An Interview with Barbara KrugerThe Drift, interview by Kiara Barrow and Rebecca Panovka2022Read MoreReview: In a smashing new LACMA retrospective, Barbara Kruger probes the modern media maelstromThe Los Angeles Times, Review by Christopher Knight2022Read MoreBATTLEGROUNDSArtforum, feature by Johanna Fateman2022Read MoreBarbara Kruger: A Way With WordsThe New York Times, by Roberta Smith2022Read MoreArtist Barbara Kruger is still right about everything. Let’s listen up.The Washington Post, by Philip Kennicott2021Read MoreBarbara KrugerTIME, by Hal Foster2021Read MoreSelected TitlesExplore BooksBarbara Kruger: Thinking of You. I Mean Me. I Mean You.DelMonico Books/LACMA$60No Problem: Cologne/New York 1984–1989David Zwirner Books$65 Request more informationGet In Touch"
