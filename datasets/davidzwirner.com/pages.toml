full_description = "SurveyExhibitionsArtist NewsBiographyInquireElizabeth PeytonElizabeth Peyton (b. 1965) attended the School of Visual Arts in New York from 1984 to 1987. She had her first solo exhibition in 1987 at Althea Viafora Gallery in New York. The artist is based in New York and Paris.Learn MoreElizabeth Peyton Limited EditionThis deluxe set, available in a limited edition of 50, features a new etching by the artist along with a bespoke illustrated monograph from David Zwirner Books, presented together in a custom clamshell designLearn MoreSurveyExplore all ArtworksElizabeth PeytonElvis Angel (Elvis' Eyes), 2023Oil on linen board9 x 12 inches (22.9 x 30.5 cm)Elizabeth PeytonThus Love (Echo), 2023Oil on linen board14 1/8 x 11 inches (35.9 x 27.9 cm)Elizabeth PeytonFlowers and Lara (Lara Sturgis), 2022Oil on board20 x 16 inches (50.8 x 40.6 cm)Elizabeth PeytonFrederick Douglass, 1863, 2021Oil on board17 x 14 inches (43.2 x 35.6 cm)Elizabeth PeytonThe Friend, 2021Pastel and colored pencil on black paper8 x 5 7/8 inches (20.2 x 14.8 cm)Elizabeth PeytonGreta Thunberg, 2019Oil on board17 x 14 inches (43.2 x 35.6 cm)Elizabeth PeytonIsolde (Petitcru!), 2019Oil on board9 x 12 inches (22.9 x 30.5 cm)Elizabeth PeytonRaphael (Nick Reading), 2018Oil on board19 x 14 1/8 inches (48.3 x 35.8 cm)Elizabeth PeytonPractice (Yuzuru Hanyu), 2018Oil on board12 1/6 x 9 inches (30.9 x 22.9 cm) Courtesy of Green Family CollectionElizabeth PeytonUniverse of the World-Breath, 2018Oil on board12 x 9 1/8 inches (30.5 x 23.2 cm)Elizabeth PeytonPortrait at the Opera (Elizabeth), 2016Oil on board17 x 14 inches (43.2 x 35.6 cm) The Brant Foundation, Greenwich, ConnecticutElizabeth PeytonLove (1) (Jonas Kaufmann and Kristine Opolais; Manon Lescaut) #2, 2015Monotype on Twinrocker handmade paper38 1/2 x 30 1/2 inches (97.8 x 77.5 cm) ExhibitionsExplore ExhibitionsView AllArtist NewsExplore Artist NewsElizabeth Peyton: PracticeUCCA Center for Contemporary Art, BeijingAugust 2020Read MoreElizabeth Peyton: Aire and AngelsNational Portrait Gallery, London2019-2020Read MoreElizabeth Peyton: Still LifeHara Museum of Contemporary Art, TokyoJanuary 2017Read MoreElizabeth Peyton & Camille Claudel: Eternal IdolVilla Medici, Rome2017-2018Read MoreElizabeth Peyton: Here She Comes NowKunsthalle Baden BadenMarch 2013Read MoreElizabeth Peyton: Reading & WritingIrish Museum of Modern Art, DublinApril 2009Read MoreBlood of Two: Matthew Barney and Elizabeth PeytonDESTE Foundation Project Space, Slaughterhouse, Hydra, GreeceJune 2009Read MoreLive Forever: Elizabeth Peyton at New MuseumTraveled to Walker Art Center, Minneapolis; Whitechapel, London; Bonnefanten Museum, Maastricht, Netherlands2008-2009Read More BiographyElizabeth Peyton, Portrait at the Opera (Elizabeth), 2016Download Full CVElizabeth Peyton (b. 1965) attended the School of Visual Arts in New York from 1984 to 1987. The artist had her first solo exhibition in 1987 at Althea Viafora Gallery in New York. In the early 1990s, Peyton proceeded to have solo exhibitions at nontraditional sites, such as the washroom at Novecento, a former restaurant in downtown New York (1992); Room 828 at the Hotel Chelsea, New York (organized by Gavin Brown; 1993); and at the Prince Albert Pub in London (1995).In 2008, the New Museum, New York, organized the mid-career retrospective, Live Forever: Elizabeth Peyton, which later traveled to the Walker Art Center, Minneapolis; Whitechapel Gallery, London; and Bonnefanten Museum, Maastricht, the Netherlands. The artist has had solo exhibitions at notable institutions such as The Aldrich Contemporary Art Museum, Ridgefield, Connecticut (2008); Irish Museum of Modern Art, Dublin (2009); Mildred Lane Kemper Art Museum, St. Louis (2011); Opelvillen, Rüsselsheim, Germany (2011); Staatliche Kunsthalle Baden-Baden, Germany (2013); Gallery Met, Metropolitan Opera, New York (2016); Hara Museum of Contemporary Art, Tokyo (2017); French Academy in Rome – Villa Medici (2017); and Kling & Bang, Reykjavik, Iceland (2018).In 2019, the National Portrait Gallery, London, presented Elizabeth Peyton: Aire and Angels, in which the artist’s paintings were presented alongside historical works of portraiture drawn from the museum’s permanent collection. The UCCA Center for Contemporary Art, Beijing, presented the solo exhibition Elizabeth Peyton: Practice in 2020. Also in June, work by Peyton will be featured in the group exhibition Copistes at the Centre Pompidou-Metz, France, which is organized in special collaboration with the Musée du Louvre.Peyton is the recipient of several awards, including the Larry Aldrich Award, The Aldrich Contemporary Art Museum, Ridgefield, Connecticut (2006), and she was an honoree at the 2018 New Museum Gala. In 2023, the solo exhibition Elizabeth Peyton: Angel was presented at David Zwirner, London. In September 2024, the site-specific solo presentation Elizabeth Peyton: daystar hakuro, organized by David Zwirner, opened at the historic Ryosokuin Temple in Kyoto, Japan.Work by the artist is held in international public collections, such as the Art Institute of Chicago; Boros Collection, Berlin; The Brant Foundation, Greenwich, Connecticut; Carnegie Museum of Art, Pittsburgh; Centre Pompidou, Paris; Herbert F. Johnson Museum of Art, Cornell University, Ithaca, New York; Kultur123 Stadt Rüsselsheim, Germany; Kunstmuseum Basel; Kunstmuseum Wolfsburg, Germany; Los Angeles County Museum of Art; The Metropolitan Museum of Art, New York; Mildred Lane Kemper Art Museum, St. Louis; Museum of Contemporary Art, Los Angeles; Museum of Fine Arts, Boston; The Museum of Modern Art, New York; National Portrait Gallery, London; Orlando Museum of Art, Florida; Parrish Art Museum, Water Mill, New York; Philadelphia Museum of Art; Rubell Museum, Miami; San Francisco Museum of Modern Art; Seattle Art Museum; Solomon R. Guggenheim Museum, New York; Saint Louis Art Museum; Tate, United Kingdom; Walker Art Center, Minneapolis; and the Whitney Museum of American Art, New York, among others. Peyton has lived and traveled internationally throughout her career, and is currently based in New York and Paris.Download Full CVRequest more informationGet In Touch"
