full_description = '''SurveyAvailable ArtworksExhibitionsArtist NewsBiographySelected PressBooksInquireAl TaylorAlthough he began his studio practice as a painter, Al Taylor (1948–1999) devised a unique and innovative approach to process and materials that encompassed two-dimensional works on paper and three-dimensional objects. He sought to expand the possibilities of vision by exploring new ways of experiencing and imagining space. His sculptures, which he thought of as "tools for vision," were usually fashioned out of unconventional materials, often employing humble and sometimes humorous elements. Learn MoreSurveyExplore all ArtworksAl TaylorUntitled (Broadcast), 1985Wooden broomsticks with enamel paint, lath, acrylic paint with powdered pigment, and Formica laminate mounted on plywood with acrylic paint20 5/8 x 19 3/4 x 20 3/4 inches (52.4 x 50.2 x 52.7 cm)Al TaylorNo title, ca. 1985Acrylic paint on newsprint12 1/2 x 10 1/16 inches (31.8 x 25.6 cm)Al Taylor[no title], ca. 1985Acrylic paint on newsprint12 7/16 x 9 3/4 inches (31.6 x 24.8 cm) Al TaylorUntitled: (Latin Studies), 1985Plywood strips with acrylic paint, and wooden broomsticks with enamel paint mounted on Formica laminate25 x 17 1/2 x 15 1/2 inches (63.5 x 44.5 x 39.4 cm)Al Taylor[no title], 1988Pencil, watercolor, and ink on paper, with corner cut-out reattached with artist's tape verso23 x 14 7/8 inches (58.4 x 37.8 cm)Al TaylorDistill, 1988Wooden broomsticks with enamel paint and metal hook mounted on Formica laminate64 x 11 x 28 inches (162.6 x 27.9 x 71.1 cm)Al TaylorNo title, 1988Pencil, watercolor, and ink on paper29 13/16 x 21 3/4 inches (75.7 x 55.2 cm)Al TaylorWire Instrument, 1990Ink and wax crayon on paper18 x 22 inches (45.7 x 55.9 cm)Al TaylorUntitled: (Wire Instrument--Hot Tub), 1989-90Wood, latex paint, wood putty, and wire43 x 39 1/2 x 23 inches (109.2 x 100.3 x 58.4 cm)Al TaylorLow Rider (Bern), 1992Wooden broomsticks with enamel paint, wood, latex paint, and wire118 x 86 1/2 x 88 inches (299.7 x 219.7 x 223.5 cm)Al TaylorLayson a Stick (Blue Balls), 1992Wooden broomsticks with enamel paint, wire, and plastic leis35 1/2 x 28 x 39 1/4 inches (90.2 x 71.1 x 99.7 cm)Al TaylorOdd Vows, 1988Pencil, watercolor, colored ink, and correction fluid on paper11 1/16 x 15 inches (28.1 x 38.1 cm) Available ArtworksExplore Available ArtworksAl TaylorRat Guards, 1998Gouache, acrylic paint, and acrylic mica mortar on paper22 x 16 5/16 inches (55.9 x 41.4 cm) Framed: 28 7/8 x 22 7/8 inches (73.3 x 58.1 cm)Al Taylor[no title], c. 1985Acrylic paint on newsprint10 3/4 x 8 1/4 inches (27.3 x 21 cm) Framed: 16 7/8 x 14 1/4 inches (42.9 x 36.2 cm)Al TaylorHip Hose (Pass the Peas), 1992Plastic hula hoops, plastic garden hose, wire, and plastic rings43 1/4 x 35 1/2 x 35 1/2 inches (109.9 x 90.2 x 90.2 cm)Al TaylorWave Theory with Fish Floats (Rough Side), 1998Graphite, gouache, ink, and acrylic mica mortar on paper13 7/8 x 22 3/4 inches (35.2 x 57.8 cm) Framed: 20 5/8 x 29 1/4 inches (52.4 x 74.3 cm)Al TaylorWithout Riggers, 1998Foamed plastic fishing floats, acrylic paint, bamboo garden stakes, and acrylic mica mortar12 x 23 x 17 inches (30.5 x 58.4 x 43.2 cm)Al TaylorPet Names, 1990-1991Pencil, gouache, ink, and coffee on paper29 7/8 x 22 inches (75.9 x 55.9 cm)Framed: 36 5/8 x 28 3/4 inches (93 x 73 cm) ExhibitionsExplore ExhibitionsView AllArtist NewsExplore Artist NewsThe Drawings of Al TaylorThe Morgan Library & Museum, New YorkFebruary 2020Read MoreAl Taylor: What Are You Looking At?Major retrospective at High Museum of Art, Atlanta2017Read MoreRobert Storr Explores the Work of Al TaylorHigh Museum of Art, Atlanta2018Read More BiographyDownload Full CVAlthough he began his studio practice as a painter, in 1985, Al Taylor (1948-1999) devised a unique and innovative approach to process and materials that encompassed two-dimensional works on paper and three-dimensional objects. Moving fluidly between media, he sought to expand the possibilities of vision by exploring new ways of experiencing and imagining space. His sculptures, which he thought of as "tools for vision," were usually fashioned out of unconventional materials, often employing humble and sometimes humorous elements. As he later wrote, though he moved away from painting in a traditional sense, the perspectival effects made possible by the medium continued to inform his practice: "This work isn’t at all about sculptural concerns; it comes from a flatter set of traditions. What I am really after is finding a way to make a group of drawings that you can look around. Like a pool player, I want to have all the angles covered."1Taylor was born in Springfield, Missouri, and received a B.F.A. from the Kansas City Art Institute in 1970. He moved to New York later that year, where he would continue to live and work until his death, in 1999. His first solo exhibition took place in 1986 at the Alfred Kren Gallery in New York. His work would go on to be shown in numerous exhibitions in America and Europe, including solo exhibitions at the Kunsthalle Bern (1992) and the Kunstmuseum Luzern (1999), both in Switzerland.A retrospective of Taylor’s drawings was organized posthumously by the Staatliche Graphische Sammlung at the Pinakothek der Moderne, Munich, in 2006. A retrospective of the artist’s prints opened at the Pinakothek der Moderne, Munich, in September 2010, and traveled to the Louisiana Museum of Modern Art, Humlebaek, Denmark, in Spring 2011. The Santa Monica Museum of Art, California, presented a focused overview of two bodies of work by the artist, Wire Instruments and Pet Stain Removal Devices, in 2011. In 2013, the High Museum of Art in Atlanta mounted the exhibition Drawing Instruments: Al Taylor's Bat Parts and Endcuts. In 2014, The Philip Johnson Glass House in New Canaan, Connecticut, presented Six Panels: Al Taylor, curated by Robert Storr. A major survey of the artist's work was presented at the High Museum of Art, Atlanta in 2017-2018. The Drawings of Al Taylor was on view at The Morgan Library & Museum, New York, in 2020.Work by the artist is represented in a number of prominent public collections, including the British Museum, London; Musée National d’Art Moderne, Centre Georges Pompidou, Paris; Glenstone Museum, Potomac, Maryland; High Museum of Art, Atlanta; Museum of Fine Arts, Houston; The Morgan Library & Museum, New York; The Museum of Modern Art, New York; National Gallery of Art, Washington, DC; Staatliche Graphische Sammlung, Munich; and the Whitney Museum of American Art, New York, among others.The Estate of Al Taylor has been represented by David Zwirner since 2007. Al Taylor: Playing with Color, which was on view at the gallery’s Hong Kong location in 2022, marked the eighth solo exhibition of the artist’s work, following on: Al Taylor: Early Work (2008); Al Taylor: Rim Jobs and Sideffects (2010); Al Taylor: Pass the Peas and Can Studys (2012);Al Taylor (2014) at our Mayfair, London space; Al Taylor: Pet Stains, Puddles, and Full Gospel Neckless(2015); Al Taylor: Early Paintings (2017); and Al Taylor: A / LOW / HA, The Hawaiian Works (2020).1 Al Taylor, unpublished artist's statement, July 1990.Download Full CVSelected PressExplore Selected PressAl TaylorArt in America, review by Charlie Tatum2018Read MoreAl Taylor’s X-ray Vision at the High Museum of ArtBurnaway, review by Rebecca Brantley2018Read MoreSelected TitlesExplore BooksAl Taylor: Early PaintingsDavid Zwirner Books$45Al Taylor: Pet Stains, Puddles, and Full Gospel NecklessDavid Zwirner Books$50The Drawings of Al TaylorThe Morgan Library & Museum, DelMonico Books/ Prestel$40Al Taylor: What Are You Looking At?High Museum of Art$45Al Taylor: Pass the Peas and Can StudysDavid Zwirner Books | Steidl$50Al Taylor: Rim Jobs and SideffectsDavid Zwirner / Steidl$65Al Taylor: Early WorksSteidl / Zwirner & Wirth$65 Request more informationGet In Touch'''
