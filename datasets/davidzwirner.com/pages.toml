description = "New York-based artist Dana Schutz (b. 1976) is known for formally inventive canvases that combine figuration and abstraction to construct complex visual narratives."
full_description = "SurveyExhibitionsArtist NewsBiographyBooksInquireDana SchutzDana Schutz (b. 1976) is a Brooklyn-based painter and sculptor who constructs complex visual narratives that engage the capacity of art to represent subjective experience. Often depicting figures in seemingly impossible, enigmatic, or invented situations, her works reveal the deeper complications, tensions, and ambiguities of contemporary life.Learn MoreSurveyExplore all ArtworksDana SchutzDear Painter, 2023Oil on canvas86 x 120 inches (218.4 x 304.8 cm)Dana SchutzParrots, 2023Oil on canvas94 x 94 inches (238.8 x 238.8 cm)Dana SchutzThe Arbiters, 2023Oil on canvas94 x 120 inches (238.8 x 304.8 cm)Dana SchutzThe Chase, 2023Oil on canvas85 x 88 inches (215.9 x 223.5 cm)Dana SchutzThe Island, 2023Oil on canvas94 x 94 inches (238.8 x 238.8 cm)Dana SchutzThe Love, 2023Oil on canvas78 x 72 inches (198.1 x 182.9 cm)Dana SchutzThe Gathering, 2023Oil on canvas108 x 252 inches (274.3 x 640.1 cm)Dana SchutzOdalisque, 2022Bronze82 x 70 1/2 x 46 inches (208.3 x 179.1 x 116.8 cm)Dana SchutzSea Group, 2022Bronze113 1/2 x 115 3/4 x 98 1/2 inches (288.3 x 294 x 250.2 cm)Dana SchutzVictor, 2021Bronze67 3/8 x 57 7/8 x 35 1/2 inches (171.1 x 147 x 90.2 cm)Dana SchutzLine Painter, 2022Charcoal on paper44 x 30 inches (111.8 x 76.2 cm)Framed: 47 3/8 x 33 3/8 inches (120.3 x 84.8 cm)Louisiana Museum of Modern ArtDana SchutzThe Ride, 2022Charcoal on paper44 x 30 inches (111.8 x 76.2 cm)Framed: 47 3/8 x 33 3/8 inches (120.3 x 84.8 cm)Louisiana Museum of Modern Art ExhibitionsExplore ExhibitionsView AllArtist NewsExplore Artist NewsDana Schutz: The IslandThe George Economou Collection, AthensJune 16, 2024–March 7, 2025Read MoreDana Schutz: Le monde visible (The Visible World)Musée d’Art Moderne de Paris, France2023 - 2024Read MoreDana Schutz: Between UsThe Louisiana Museum of Modern Art, HumlebækFebruary 2023Read MoreStudio: Dana SchutzApril 2021Read MoreDavid Zwirner Now Represents Dana SchutzRead More BiographyDownload Full CVDana Schutz (b. 1976) is a New York–based painter and sculptor who constructs complex, allegorical visual narratives that engage the capacity of art to represent subjective experience. Often depicting figures in seemingly impossible, enigmatic, or invented situations, her works reveal the deeper complications, tensions, and ambiguities of contemporary life.Schutz was born in Livonia, Michigan, and received her BFA from the Cleveland Institute of Art and her MFA from Columbia University, New York.The first solo museum exhibition of Schutz’s work was held in 2004 at the Nerman Museum of Contemporary Art, Johnson County Community College, Overland Park, Kansas. The artist has since been the subject of solo exhibitions at prominent institutions worldwide, including the Rose Art Museum, Brandeis University, Waltham, Massachusetts (2006; traveled to Museum of Contemporary Art Cleveland); Museo d’arte moderna e contemporanea di Trento e Rovereto, Italy (2010); Douglas Hyde Gallery, Dublin (2010); Atlanta Contemporary Art Center (2011); and Museum of Contemporary Art Denver (2012). In 2011, the Neuberger Museum of Art, Purchase College, State University of New York, presented Dana Schutz: If the Face Had Wheels, a retrospective featuring paintings and drawings created by the artist over the previous decade. The show subsequently traveled to the Miami Art Museum and the Denver Art Museum through 2013.Additional solo presentations of Schutz’s work have taken place at The Hepworth Wakefield, England (2013; traveled to Kestner Gesellschaft, Hannover, Germany, through 2014); Musée d’art contemporain de Montréal (2015); and the Transformer Station, Cleveland (2018). A major traveling exhibition of the artist’s work, Dana Schutz: The Visible World, was presented at the Louisiana Museum of Modern Art, Humlebæk, Denmark, in 2023, and traveled to the Musée d'Art Moderne de Paris later that year. In 2024, Dana Schutz: The Island was held at The George Economou Collection in Athens, Greece.In 2023, Dana Schutz, the first comprehensive monograph on the artist’s work, was published by Phaidon Press, with essays by Dan Nadel and Lynne Tillman and an interview with the artist by Hamza Walker.Schutz has been represented by David Zwirner since 2020. Her first solo exhibition with the gallery, Dana Schutz: Jupiter’s Lottery, was presented in 2023 in New York. In 2024, Dana Schutz: The Sea and All Its Subjects was on view at David Zwirner Paris. Schutz’s work is held in numerous institutional collections, including the Aïshti Foundation, Beirut, Lebanon; Art Gallery of New South Wales, Sydney; Cleveland Institute of Art; Cleveland Museum of Art; Colby College Museum of Art, Waterville, Maine; Hammer Museum, Los Angeles; Hood Museum of Art, Dartmouth College, Hanover, New Hampshire; Institute of Contemporary Art, Boston; Los Angeles County Museum of Art; Louisiana Museum of Modern Art, Humlebaek, Denmark; The Metropolitan Museum of Art, New York; Montreal Museum of Fine Arts; Museo d’arte moderna e contemporanea di Trento e Rovereto, Italy; Museum of Contemporary Art, Los Angeles; Museum of Fine Arts, Boston; The Museum of Modern Art, New York; Nerman Museum of Contemporary Art, Johnson County Community College, Overland Park, Kansas; Pérez Art Museum Miami; Rose Art Museum, Brandeis University, Waltham, Massachusetts; Rubell Museum, Miami; San Francisco Museum of Modern Art; Solomon R. Guggenheim Museum, New York; Ulrich Museum of Art, Wichita State University, Kansas; and Whitney Museum of American Art, New York.Download Full CVSelected TitlesExplore BooksDana Schutz: Jupiter’s LotteryDavid Zwirner Books$80Dana SchutzPhaidon$54.95Dana Schutz: Between UsLouisiana Museum of Modern Art$50 Request more informationGet In Touch"
