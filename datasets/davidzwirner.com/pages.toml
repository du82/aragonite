description = "Fred Sandback’s (1943-2003) sculptures outline planes and volumes in space. Though he employed metal and elastic cord early in his career, he…"
full_description = '''SurveyAvailable ArtworksExhibitionsArtist NewsBiographySelected PressBooksInquireFred SandbackBeginning in the late 1960s, Fred Sandback (1943–2003) developed a singular, minimal formal vocabulary that elaborated on the phenomenological experience of space and volume with unwavering consistency and ingenuity. He largely dispensed with mass and weight by using steel rod, elastic cord, and acrylic yarn to outline planes and volumes in space, creating an extensive body of works that inherently address their physical surroundings, the "pedestrian space," as he called it, of everyday life.Learn MoreSurveyExplore all ArtworksFred SandbackUntitled (Red Floor Piece), 19671/16-inch diameter red elastic cord and red acrylic on steel1 5/8 x 4 1/2 x 264 inches (4.1 x 11.4 x 670.6 cm)Fred SandbackUntitled (RLL of A Series of Eight Sculptures, Closed Series), 1969Gray acrylic on 1/8-inch diameter steel and elastic cordThree (3) units, each: 30 x 8 x 4 inches (76.2 x 20.3 x 10.2 cm) 3 inches (7.6 cm) of space between units Overall: 96 x 8 x 8 inches (243.8 x 20.3 x 20.3 cm)Fred SandbackUntitled, 1971/1980Purple enamel on 1/4-inch diameter mild steel rodFour (4) parts, each: 12 x 24 x 48 inches (30.4 x 60.9 x 121.9 cm) Overall: 12 x 240 x 48 inches (30.4 x 609.6 x 121.9 cm)Fred SandbackUntitled (Two-part Vertical Construction), 1976Venetian red acrylic yarnCeiling height x 12 x 18 inches (Ceiling height x 30.5 x 45.7 cm)Fred SandbackUntitled (Sculptural Study, Six-part Construction), ca. 1977/2008Black acrylic yarnSituational: spatial relationships established by the artist; overall dimensions vary with each installationFred SandbackUntitled (Vertical Construction with Two Parts), 1981Chrome yellow and baby blue acrylic yarnCeiling height x 28 1/4 inches (Ceiling height x 71.8 cm)Fred SandbackUntitled (Sculptural Study, Seven-part Triangular Construction), c. 1982/2011Black acrylic yarnSituational: spatial relationships established by the artist; overall dimensions vary with each installationFred SandbackUntitled (Sculptural Study, Seventeen-part Right-angled Construction), 1985/2005Red acrylic yarnOverall dimensions variableFred SandbackUntitled (Six-part Leaning Construction), 1985Red, blue, and yellow acrylic yarnSituational: spatial relationships established by the artist; overall dimensions vary with each installationFred SandbackUntitled (Sculptural Study, Three-part Wall Construction), 1985/2018Blue, yellow, and red acrylic yarnSituational: spatial relationships established by the artist; overall dimensions vary with each installationFred SandbackUntitled (Sculptural Study, Two-part Vertical Construction), c. 1986/2009Black acrylic yarnSituational: spatial relationships established by the artist; overall dimensions vary with each installationFred SandbackUntitled (Sculptural Study, Five-part Construction), 1987/2009Black acrylic yarnSituational: spatial relationships established by the artist; overall dimensions vary with each installation Available ArtworksExplore Available ArtworksFred SandbackUntitled (Vertical Construction with Two Parts), 1981Chrome yellow and baby blue acrylic yarnCeiling height x 28 1/4 inches (Ceiling height x 71.8 cm)Fred SandbackUntitled (Sculptural Study, Three-part Wall Construction), 1985/2018Blue, yellow, and red acrylic yarnSituational: spatial relationships established by the artist; overall dimensions vary with each installationFred SandbackUntitled (Isometric Construction), c. 1985Pastel on etching paper46 7/8 x 37 7/8 inches (119.1 x 96.2 cm) Framed: 50 1/8 x 41 1/8 inches (127.3 x 104.5 cm)Fred SandbackUntitled (Sculptural Study, Eighteen-part Architectonic Vertical Construction), 1987/2018Black, blue, white, and light yellow acrylic yarnSituational: spatial relationships established by the artist; overall dimensions vary with each installationFred SandbackUntitled (Sculptural Study, Six-part Vertical Construction), c. 1983/2022Red acrylic yarnSituational: spatial relationships established by the artist; overall dimensions vary with each installationFred SandbackUntitled, c. 1995Acrylic paint on yellow tracing paper53 x 12 inches (134.6 x 30.5 cm) Framed: 58 x 17 3/4 inches (147.3 x 45.1 cm) ExhibitionsExplore ExhibitionsView AllArtist NewsExplore Artist NewsFred Sandback: Threading SpaceMAC/CCB Museum of Contemporary Art, Lisbon, PortugalOctober 24, 2024–March 9, 2025Read MoreVideo: Fred Sandback at Dia Beacon2022Read MoreAspects: Fred Sandback’s SculpturePublication by Edward A. Vazquez2018Read MorePedestrian SpaceSolo exhibiton at Fondation Venet, France2017Read MoreDecadesMonograph documenting five decades of Sandback's career2013Read MoreDia:BeaconLong-term installation designed by the artistRead MoreBook Launch and Panel Discussion for Luis Barragán, Fred Sandback: Las propiedades de la luz/The Properties of LightThe Americas Society, New YorkNovember 1, 2018Read More BiographyView Artist WebsiteDownload Full CVBeginning in the late 1960s, Fred Sandback (1943–2003) developed a singular, minimal formal vocabulary that elaborated on the phenomenological experience of space and volume with unwavering consistency and ingenuity. He largely dispensed with mass and weight by using steel rod, elastic cord, and acrylic yarn to outline planes and volumes in space, creating an extensive body of works that inherently address their physical surroundings, the "pedestrian space," as he called it, of everyday life.Sandback’s first solo shows were held at Galerie Konrad Fischer, Düsseldorf, and Galerie Heiner Friedrich, Munich, both in 1968, while the artist was still a graduate student pursuing his MFA at the Yale School of Art and Architecture. Other early exhibitions of Sandback’s work were presented at Dwan Gallery, New York (1969); Museum Haus Lange, Krefeld, Germany (1969); Kunsthalle Bern (1973); Museum Folkwang, Essen, Germany (1974); Hessisches Landesmuseum, Darmstadt, Germany (1975); Kunsthaus Zürich (1985); Kestner Gesellschaft, Hannover, Germany (1987); and Westfälischer Kunstverein, Münster, Germany (1987).Sandback became one of a small group of artists sponsored by Dia Art Foundation, which maintained an institution dedicated to his work—the Fred Sandback Museum—from 1981 until 1996. The museum was housed in a former bank building in Winchendon, Massachusetts, not far from the artist’s studio in Rindge, New Hampshire.Sandback’s work was the subject of an extensive survey organized in 2005 by the Kunstmuseum Liechtenstein, Vaduz, which traveled to the Fruitmarket Gallery, Edinburgh, and the Neue Galerie am Joanneum, Graz, Austria, in 2006. In 2011, his work was featured in a solo exhibition at the Whitechapel Gallery, London. That same year, the Museum of Contemporary Art, Denver, dedicated its entire building to a solo exhibition of his work. In 2014, the Kunstmuseum Winterthur, Switzerland, hosted the first major retrospective of Sandback’s drawings, which was curated by Dieter Schwarz. This exhibition subsequently traveled to Germany to the Josef Albers Museum Quadrat Bottrop, Germany, and Museum Wiesbaden, Germany. In 2015, the Pulitzer Arts Foundation, St. Louis, Missouri, mounted an exhibition of Sandback’s work, and the major retrospective Fred Sandback: Light, Space, Facts was on view at Glenstone in Potomac, Maryland. In 2016, sculptures by the artist were installed in buildings designed by Luis Barragán: Casa Luis Barragán, Casa Antonio Gálvez, Cuadra San Cristóbal, and Casa Gilardi, all in Mexico City. In 2021, Fondation CAB in Brussels organized a solo exhibition of Sandback’s work, and in 2023, the Hamburger Bahnhof - Nationalgalerie der Gegenwart, Berlin, presented Fred Sandback: Simple Facts. An ongoing solo exhibition of the artist’s work dating from 1967 to 1983 has been on view at Mana Contemporary, Jersey City, New Jersey, since 2018. A long-term installation of Sandback’s work, first installed in 2003, reopened at Dia Beacon, New York, in 2021.David Zwirner has represented the Estate of Fred Sandback since 2004. The gallery has presented seven solo exhibitions of the artist’s work, including a 2012 survey of important sculptures and drawings from each decade of his career in New York; a 2013 show at David Zwirner, London; and a 2016 presentation in New York entitled Fred Sandback: Vertical Constructions, which was accompanied by a catalogue published by David Zwirner Books with contributions by Yve-Alain Bois, David Gray, and Lisa Le Feuvre. The artist’s most recent solo presentation with the gallery took place at David Zwirner’s East 69th Street location in New York in 2022, and a two-artist presentation entitled L’Objet Invisible: Giacometti / Sandback was on view at the gallery’s Paris location in the same year.Sandback’s work is represented in numerous public collections, including the Art Institute of Chicago; British Museum, London; Centre Pompidou, Paris; Fonds national d’art contemporain, Paris; Israel Museum, Jerusalem; Los Angeles County Museum of Art; Museum für Moderne Kunst, Frankfurt; The Museum of Modern Art, New York; National Gallery of Art, Washington, DC; Pinakothek der Moderne, Munich; Solomon R. Guggenheim Museum, New York; Whitney Museum of American Art, New York; and the Yuz Museum, Shanghai.View Artist WebsiteDownload Full CVSelected PressExplore Selected PressThe Pleasures of PragmatismBorder Crossings, profile by Shep Steiner2017Read MoreFred SandbackArtforum, review by Julian Rose2017Read More"The Point at Which All Ideas Fall Apart": Fred Sandback's Grand IllusionsHyperallergic, article by Thomas Micchelli2016Read MoreThis Fall Stripes Are In at New York Galleries at LeastThe New York Times Stye Magazine, review by Alina Cohen2016Read MoreFred SandbackThe New York Times, review by Holland Cotter2009Read MoreSelected TitlesExplore BooksFred Sandback: Vertical ConstructionsDavid Zwirner Books$55Luis Barragán/Fred Sandback: The Properties of LightProyectos Monclova / Hatje Cantz$60Aspects: Fred Sandback's SculptureThe University of Chicago Press$50Fred Sandback: DrawingsRichter Verlag$60Fred Sandback: DecadesDavid Zwirner / Radius Books$60The Helga and Walther Lauffs CollectionSteidl / Zwirner & Wirth$100Fred SandbackZwirner & Wirth$80 Request more informationGet In Touch'''
