k Foundation, Berlin2021Read MoreChristopher Williams: Werbung: Adapted for UseHaubrok Foundation, Berlin2021Read MoreChristopher Williams: Stage Play2021Read MoreThe Lives and Loves of Images, Biennale für aktuelle Fotografie 2020Mannheim, Ludwigshafen, and Heidelberg, GermanyFebruary 2020Read MoreChristopher Williams: Inklusive Franz Xaver Kroetz 19712020Read MoreCelebration of Our Enemies: Selections from the Hammer Contemporary CollectionHammer Museum, Los AngelesJune 2019Read MoreChristopher Williams: Kölnische Dramaturgie 2019Read MoreThe Production Line of HappinessSolo exhibtion at MoMA, New YorkJuly-November 2014Read More BiographyDownload Full CVDeeply political and historical, Christopher Williams’s (b. 1956) work addresses the visual and informational structures that define everyday life. Working in a variety of media, including photography, video, and installation, his multifaceted practice incorporates references to multiple sources and precedents, including the artist’s own ever-expanding inventory of imagery and discursive materials.Williams was born in Los Angeles. Since 2000, his work has been represented by David Zwirner. He has had eleven solo exhibitions at the gallery. Footwear (Adapted for Use) was on view in 2020 at the gallery’s East 69th Street location in New York. The solo exhibition standard pose was on view at David Zwirner, Paris, from 2021–2022. In 2023, an exhibition of the artist’s work was presented at David Zwirner, Hong Kong, marking his first solo show in Greater China.Christopher Williams: The Production Line of Happiness marked the artist's first major museum survey, which spanned thirty-five years of work. The exhibition was first on view at The Art Institute of Chicago in 2014, followed by The Museum of Modern Art, New York, and Whitechapel Gallery, London in 2015. Also in 2014, Williams was the first artist to receive the Photography Catalogue of the Year, presented by the Paris Photo–Aperture Foundation PhotoBook Awards, for the two volumes specially designed and published on the occasion of his touring survey, The Production Line of Happiness (exhibition catalogue) and Printed in Germany (artist book).In 2019-2020, C/O Berlin presented the solo show Christopher Williams - MODEL: Kochgeschirre, Kinder, Viet Nam (Angepasst zum Benutzen). Other solo exhibitions include those held at Kestner Gesellschaft, Hanover, Germany (2018); La Triennale di Milano (2017); ETH Zurich, Institute gta, Zurich (2017); Museum Morsbroich, Leverkusen, Germany (2011); Museum Dhondt-Dhaenens, Deurle, Belgium (2011); Staatliche Kunsthalle Baden-Baden, Germany (2010); Bergen Kunsthall, Norway (2010); Kunsthalle Zürich (2007); Museu Serralves, Porto, Portugal (2006); Secession, Vienna (2005); Kunstverein Braunschweig, Germany (2005); Museum Boijmans Van Beuningen, Rotterdam (1997); and Wexner Center for the Arts, Columbus, Ohio (1995).Institutional collections which hold works by the artist include the Art Institute of Chicago; Carnegie Museum of Art, Pittsburgh; Hammer Museum, Los Angeles; Hirshhorn Museum and Sculpture Garden, Washington, DC; Ludwig Museum, Cologne; The Metropolitan Museum of Art, New York; The Museum of Modern Art, New York; Museum Moderner Kunst Stiftung Ludwig Wien, Vienna; San Francisco Museum of Modern Art; Solomon R. Guggenheim Museum, New York; Tate, United Kingdom; and the Whitney Museum of American Art, New York. He lives and works in Cologne and Los Angeles.Download Full CVSelected PressExplore Selected PressChristopher Williams at David Zwirner Hong KongOcula, review of R59C Keystone Shower Door — Chrome/Raindrop2023Read MoreA Standard Up For DiscussionTexte zur Kunst, review by Benoît Lamy de La Chapelle2022Read MoreThe Mythologies Of Christopher WilliamsLe Journal des Arts, review by Christine Coste2022Read MoreChristopher Williams: Open Letter – The Family Drama Refunctioned? (From the Point of View of Production)Time Out London, review by Matt Breen2017Read MoreChristopher WilliamsArtforum, review by Duncan Wooldridge2017Read MoreAll about the lookThe London Evening Standard, review by Ben Luke2015Read MoreSelected TitlesExplore BooksInklusive 1972 / Inclusive 1974Walther Koenig$20Christopher Williams: Blocking TemplatesGalerie Gisela Capitain, Köln$40Christopher Williams: Stage PlayWalther Koenig$65Christopher Williams: Kölnische DramaturgieWalther Koenig$38Theatre in Review: Upper AustriaWalther Koenig$15Inklusive Franz Xaver Kroetz 1971Walther Koenig$20Christopher Williams: Model 38$5Christopher Williams: Normative ModelsWalther Koenig$40Christopher Williams: The Production Line of HappinessArt Institute of Chicago / Museum of Modern Art / Whitechapel Gallery$45Christopher Williams: Printed in Germany (green)Walther Koenig$120Christopher Williams: Printed in Germany (red)Walther Koenig$120Christopher Williams: Printed in GermanyWalther Koenig$120Christopher Williams: Program. For Example: Dix-Huit Leçons Sur La Société Industrielle (Revision 10)Bergen Kunsthall$35Christopher Williams Poster: Model Footwear (Adapted For Use) Request more informationGet In Touch"
