description = "Most common questions are already answered here."
full_description = "Please read the manual and the tested services carefully before contacting us. There's also a high chance to get your question answered in our forums. General What does DAVx⁵ stand for? How does DAVx⁵ integrate with Android? How to debug DAVx⁵-related problems [Google Play] Can I install DAVx⁵ on multiple devices without paying multiple times? Can I use DAVx⁵ with Tor? Can I use DAVx⁵ with Android <7? Synchronization DAVx⁵ does not synchronize (at all, or not automatically) How can I change the base URL? Why is my HTTPS certificate not accepted? Why does WiFi SSID restriction need the location permission? Contacts [Google Contacts] DAVx⁵ address books don't show up in the list I have set up DAVx⁵, but existing contacts are not synchronized. Why can't I create/edit/view contact groups on my device? There's only one input field per postal address. How to enter a structured address? Can I show contact birthdays in the calendar? Calendars How can I subscribe to a HTTP (Webcal) or local .ics (iCalendar) file? Some of my recurring events are not rendered or synchronized correctly (exception dates etc.). Calendar app doesn't set event color How can I change my calendar colors? [Android 8.0] NullPointerException: Attempt to invoke virtual method '…getTimeZone()' on a null object reference Can I use DAVx5 with the Outlook app for Android? Tasks How do I use tasks and advanced features like sub-tasks with DAVx⁵?"
