["https://davx5.com/about/privacy-policy-chinese-version"]
title = "Privacy policy (Chinese)"
description = "Automatically translated from the English version"
full_description = "应用程序隐私政策 (App privacy policy) 当您在 DAVx⁵ 中输入您的登录数据（DAV 服务器 URL、用户名、密码）时，这些数据将仅用于将它们传输到您指定的服务器（包括该服务器提供的重定向位置，如果适用）。 用户名和密码是使用 Android 的帐户管理器存储的，而不是由 DAVx⁵ 本身存储的。 客户端证书取自 Android 的安全密钥库，DAVx⁵ 本身无法读取。 为保护您的登录数据，请考虑加密您的设备。 联系人、事件和任务（可能包含个人数据）由相应的 Android 内容提供商存储，而不是由 DAVx⁵ 本身存储。 DAVx⁵ 仅使用这些数据将它们与给定的 CalDAV/CardDAV 服务同步。 请记住，您 Android 设备上的其他应用（包括联系人和日历应用以及 Android 备份）可能会根据其政策使用和传输数据。 除了将地址簿、日历和任务列表与给定的 CalDAV/CardDAV 服务同步外，DAVx⁵ 不会收集、处理或传输任何个人或统计数据，例如应用程序或服务器使用情况。 没有跟踪，也没有广告。¹ 位置权限：您可能必须在 DAVx⁵ 中授予粗略和精细位置权限。 如果您使用指定的 SSID 打开“通过 WiFi 同步”选项，则需要此权限。 它表示当使用无线网络时，WiFi 提供商可以根据您使用该网络时获得的 IP 确定您的位置。 我们不会以任何方式访问、处理或传输这些数据。 GDPR：我们 (bitfire) 不会使用 DAVx⁵ 收集或处理任何个人数据。 任何个人数据都不会传输到我们的服务器。 我们仅提供 DAVx⁵ 软件，您可以使用它自行管理数据。 ¹ 应用商店（如 Google Play、三星 Galaxy 应用、亚马逊应用商店) 并安装了 3ʳᵈ 派对应用（比如 Twitter) 可能会跟踪应用程序的安装和使用情况（包括 DAVx⁵）。 负责人 负责数据处理：bitfire web engineering GmbH 如果您有任何疑问，请随时联系我们。"
year_published = 2025
clearnet = "https://davx5.com/about/privacy-policy-chinese-version"
