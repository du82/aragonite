["https://davx5.com/tested-with/appointmind"]
title = "Appointmind"
description = "DAVx⁵ has been successfully tested with Appointmind"
full_description = '''Appointmind is an event booking and management system DAVx⁵ settings You can synchronize your events/appointments from the appointmind server to your Android via DAVx⁵. Use the option "Login with URL and username": CalDAV Base URL: https://youraccount.appointmind.net/modules/webdav/caldav/ (replace youraccount with your user account) Username: 1 (can't be changed). Please look this up in your Appointmind web interface in the Synchronization → CalDAV section. Password: you need to set the password in your Appointmind web interface in the Synchronization → CalDAV section. The password is not your normal account password.Important: You need to activate CalDAV before you can connect with DAVx5. In the appointmind web interface go to Configuration → general settings → Synchronization. Activate CalDAV. Then in the drop down above switch from "All Calendars" to the specific one you want to sync. Below that you'll find your username (ususally a "1") and there you can also set a password which you need to set and then use in DAVx⁵.'''
year_published = 2025
