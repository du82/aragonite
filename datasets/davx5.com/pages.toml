["https://davx5.com/faq/system-integration"]
title = "How does DAVx⁵ integrate with Android?"
full_description = "How does DAVx⁵ integrate with Android? The primary goal of DAVx⁵ is to synchronize CalDAV/CardDAV collections with Android devices. It consists of two main parts: a GUI that allows you to add and manage accounts and settings, synchronization adapters for CalDAV/CardDAV, which are interfaces between CalDAV/CardDAV services and the Android APIs. Data storage: Contacts, events or tasks are stored in so-called content providers, not in DAVx⁵ itself. Those content providers are provided by system apps (Contacts storage, Calendar storage) or 3rd-party apps (like jtx Board). User interface: DAVx⁵ is not a contacts, calendar or tasks app. It does not provide facilities to edit/view contacts, events, tasks etc."
year_published = 2025
clearnet = "https://davx5.com/faq/system-integration"
