["https://davx5.com/privacy"]
title = "Privacy policy"
full_description = '''App privacy policy Note: Customers from China can find a Chinese version here. / 你可以在这里找到中文版When you enter your login data (DAV server URL, user name, password) in DAVx⁵, these data will only be used for transferring them to the server you specified (including redirect locations given by this server, if applicable). User name and password are stored using Android's account manager and not by DAVx⁵ itself. Client certificates are taken from Android's secure keystore and are not readable by DAVx⁵ itself. To protect your login data, consider to encrypt your device. Contacts, events and tasks (which will probably contain personal data) are stored by the respective Android content providers and not by DAVx⁵ itself. DAVx⁵ only uses these data to synchronize them with the given CalDAV/CardDAV service. Keep in mind that other apps on your Android device (including contact and calendar apps and Android backup) may use and transfer the data according to their policies.Except from synchronizing address books, calendars and task lists with the given CalDAV/CardDAV service, DAVx⁵ doesn't collect, process or transmit any personal or statistical data like app or server usage. There is no tracking and there are no ads.¹Location permissions: You may have to grant coarse and fine location permission in DAVx⁵. This permission is needed if you turn on the "Sync over WiFi" option with a specified SSID. It indicates that – when using a wireless network – the WiFi provider can determine your location based on the IP address you get when using this network. We're not accessing, processing or transferring this data in any way, and we are not tracking your location. GDPR: We (bitfire) don't collect or process any personal data with DAVx⁵. No personal data are ever transferred to our servers. We only offer the software DAVx⁵, which you can use to manage your data yourself. ¹ App stores (like Google Play, Samsung Galaxy apps, amazon appstore) and installed 3ʳᵈ-party apps (like Twitter) may track app installation and usage (including DAVx⁵). Web site privacy policy This Web site (DAVx⁵ Web site, *.davx5.com) doesn't collect or process personal data. Visits are logged by the Web server. These logs are only used for maintenance purposes and to generate anonymous access statistics. These logs are not kept longer than one year. Support privacy policy Support requests which are sent over the Support form or to our email addresses (@davx5.com) may be stored in our helpdesk system Zammad, which is located in Berlin, Germany and our processor as set out in the GDPR. Collected personal data: name, email address, date/time support request (text and possible attachments, may include personal data) These data will only be used to process the respective support request. You have the right to access your personal data, let your personal data be rectified or erased, restrict processing of your personal data, export your personal data and object to processing of your personal data. See also: Zammad privacy policy Donations privacy policy Personal data related to donations (name, email, origin, IP address) are only used for payment processing and accounting purposes. These data are processed by donorbox.org, which is located in California (USA) – their privacy policy as a data processor applies. are legally required to be kept for at least 7 years. Responsible person Responsible for data processing: bitfire web engineering GmbH If you have questions, feel free to contact us.'''
