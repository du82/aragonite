full_description = "Company read-only address books Imagine a company having dozens or thousands of employees. Wouldn't it be great if everyone had all contacts up-to-date all the time? Super paranoid? Use DAVx⁵ without Google Play, distrust all system certificates, use TOR and be invisible. Streaming videos from your home NAS? Having a videos collection on your NAS? DAVx⁵ offers a direct streaming of all files of any (!) size to your Android device - and you can even jump to any position of that video instantly (however a good network connection is recommended for this :-) A shared grocery list with your partner You're at work, but your better half is somewhere else and finally you remember stuff that has to be bought? No problem: put it in your shared grocery list! Family calendar No more conflicts on event planning. Manage your family events with ease and use a fully editable calendar where everyone has the ability to edit from everywhere. Combining two worlds: iOS and Android Coming from the Apple universe and still want to stay in sync with iCloud? No problem – connect your contacts and calendar with your Android and stay in sync on all your devices, even when you use your iPhone. Access your files everywhere Get access to all your WebDAV files on all your devices. Edit and save them directly on the server without the need of a down- and upload."
