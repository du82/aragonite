["https://davx5.com/tested-with/boxcom-1"]
title = "Ionos HiDrive"
description = "DAVx⁵ (WebDAV) has been successfully tested with Ionos HiDrive."
full_description = "IONOS provides cloud services for file access (including WebDAV) with their HiDrive product. WebDAV setup You can access your HiDrive files using the DAVx⁵ WebDAV mounts feature. WebDAV URL: https://webdav.hidrive.ionos.com User name and password: your IONOS HiDrive login email address and passwordImportant: Activate WebDAV in Ionos HiDrive: Settings → Access rights and protocols. DAVx⁵ is designed to be an open-source project (GPLv3) from the very first beginning. The source code is available, and you can download the app on F-Droid. It is always possible to compile the app yourself and use it for free. However, it was and still is much work to create and maintain DAVx⁵, so we have decided to put it in commercial stores for a small fee. If you want to support this project, please donate to DAVx⁵ or purchase it."
year_published = 2025
clearnet = "https://davx5.com/tested-with/boxcom-1"
