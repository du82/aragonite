description = "DAVx⁵ has been successfully tested with Dolibarr."
full_description = "Dolibarr is an Open Source ERP & CRM for business. It has CalDAV/CardDAV support with the CDav module. DAVx⁵ settings Base URL: https://server.example.com/dolibarr/htdocs/cdav/ User name: your Dolibarr email address Password: your Dolibarr passwordBe sure to have at least one event in each calendar, otherwise the server does not offer the calendar to DAVx5. Dolibarr is an Open Source ERP & CRM for business. It has CalDAV/CardDAV support with the CDav module. Be sure to have at least one event in each calendar, otherwise the server does not offer the calendar to DAVx5. DAVx⁵ is designed to be an open-source project (GPLv3) from the very first beginning. The source code is available, and you can download the app on F-Droid. It is always possible to compile the app yourself and use it for free. However, it was and still is much work to create and maintain DAVx⁵, so we have decided to put it in commercial stores for a small fee. If you want to support this project, please donate to DAVx⁵ or purchase it."
